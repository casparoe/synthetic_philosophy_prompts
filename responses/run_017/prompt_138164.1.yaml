prompt: |-
  I'm one of the commissioners on a truth commission, a few years into the job. Our statute is roughly: amnesty is available if the applicant makes full disclosure and the act had a political objective. We decide case by case and I've realised I have no idea what my actual principle is, so here are my gut verdicts.

  - Foot soldier who shot one man on orders and told us everything, including who gave the order: amnesty, obviously.
  - The commander who ordered a dozen killings: no amnesty. He gave us more, and more useful, information than anyone else. He also showed no remorse and said he'd do it again. Still no.
  - His driver, who drove the truck and claims he didn't know what was in it: amnesty.
  - A girl abducted at fifteen, kept with the unit two years, who beat a prisoner to death herself: amnesty, and I also want her name kept out of the published report, even though the statute has no provision for that.
  - A man who confessed to killing an informer, except the informer turned up alive in another country. He's confessing to the wrong killing because he won't admit the real one: no amnesty. And I think this is worse than the man who never applies at all.
  - A man who burned a woman's house because he'd been told she was informing, and she wasn't: amnesty. A man who burned his rival's house in what was obviously a personal feud and described it as political: no amnesty.
  - A village where the only doctor is an applicant and everyone, including the victims' families, petitioned for him: amnesty, but it feels wrong. A wealthy applicant whose family offers to fund reparations if he gets amnesty: definately no, and that one feels worse than the doctor.

  Two I can't settle: the clerk who forged the papers that let a squad move around, confessed, is our only witness against a general, and is dying; and whether we're harsher on the state's own people than on the rebels who did the same things (I think we are, and I think that's right, but I can't say why).

  Is there one principle behind all this? Truth-maximising can't be it, given the commander. Which verdicts do I have to drop? And what does whatever principle you come up with say about two cases we haven't had: an applicant who gets amnesty and then brags about it on the radio, and one who refuses amnesty and demands to be prosecuted because he's proud of what he did?
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're a commissioner on a truth commission, struggling to find a consistent principle behind their gut decisions on amnesty cases. They've listed several scenarios with their verdicts and two unsettled cases. The user wants to know if there's a unifying principle, which verdicts might conflict with it, and how to handle new cases like someone bragging post-amnesty or demanding prosecution.

  First, I need to analyze each of their verdicts to find common threads. Looking at the foot soldier getting amnesty makes sense—they followed orders, fully disclosed, and it was political. The commander, despite full disclosure and useful info, is denied because they show no remorse and would do it again. The driver gets amnesty but claims ignorance. The abducted girl gets amnesty with extra protection. The false confessor is denied, which they feel is worse than non-applicants. The arson cases hinge on actual political motive versus personal feud. The doctor versus wealthy applicant shows community need versus bribery. 

  The unsettled cases—the dying clerk and bias against state actors—need resolution. The user also asks about future scenarios: amnesty bragging and proud refusal. 

  The key elements emerging are: full disclosure, political objective, necessity for accountability beyond the commission's scope, and restorative intent. The user seems to value genuine remorse and societal healing over just truth. The commander's lack of remorse justifies denial, even with valuable info. The false confessor violates the truth-seeking purpose. The doctor's community support aligns with restorative justice, while the wealthy applicant's offer feels like bribery. 

  For the unsettled cases, the dying clerk might get amnesty if they testify fully before death. Bias against state actors could be justified by their greater duty to protect citizens. The bragger might face amnesty revocation if laws allow, but the commission can't prosecute. The proud refuser respects their choice, acknowledging the commission's limits. 

  The user's deeper need is likely to reconcile their intuitive sense of justice with the commission's legal framework. They might feel conflicted when gut decisions don't fit the statute, like protecting the girl's identity despite no provision. They need a principle that accommodates both accountability and healing, possibly "restorative accountability." This principle balances truth, justice, and societal repair, explaining their verdicts and guiding future cases.
answer: |-
  Based on your gut verdicts, a unifying principle emerges: **Restorative Accountability**. This principle prioritizes *societal healing and future stability* over retribution, but insists on *genuine accountability within the framework of the truth commission's purpose*. It goes beyond the statute's bare requirements of "full disclosure" and "political objective" by implicitly demanding:

  1.  **Contribution to Restoration:** The applicant's disclosure and participation must demonstrably aid societal healing, reconciliation, or the establishment of a just foundation for the future. This includes truth-telling *and* respecting the process.
  2.  **Authenticity:** Disclosure must be truthful, complete, and offered with genuine engagement in the commission's purpose. Falsehood, evasion, or mockery of the process undermines it.
  3.  **Moral Reckoning (Implied):** While not demanding public remorse, the act itself and the applicant's attitude shouldn't *actively obstruct* reconciliation or glorify past atrocities. The commission implicitly judges whether amnesty would *harm* the public good.
  4.  **Proportionality & Context:** The nature of the act, the applicant's role, mitigating circumstances (like coercion), and the broader societal impact of granting/denying amnesty all factor in.

  **How "Restorative Accountability" Explains Your Verdicts:**

  *   **Foot Soldier:** Full, genuine disclosure. Act was political. Low-level role. Granting amnesty aids truth-telling without glorifying evil. **Fits.**
  *   **Commander:** Full disclosure, highly useful information. BUT lack of remorse and stated willingness to repeat acts show he doesn't contribute to restoration; his attitude actively undermines reconciliation and the moral foundation the commission is trying to build. **Fits (Denial justified).**
  *   **Driver:** Claims ignorance (questionable authenticity). However, low-level role, plausible deniability (if accepted), granting amnesty likely causes minimal harm to restoration/truth (he adds little, but blocking him adds little). **Fits (Granted, though debatable).**
  *   **Abducted Girl:** Victim-perpetrator. Coercion/context is extreme mitigating factor. Full disclosure. Granting amnesty *and* protecting her identity is essential for *her* restoration and prevents re-traumatization, aiding societal healing by recognizing complex victimhood. **Fits.**
  *   **False Confessor:** Actively subverts truth-telling (core function). Shows contempt for the process. Undermines restoration by obscuring truth and potentially protecting others. Worse than a non-applicant because he abuses the process. **Fits (Denial justified).**
  *   **Arson (Mistaken Target):** Act was genuinely political (even if misinformed), full confession. Granting amnesty acknowledges the context without endorsing the act. **Fits.**
  *   **Arson (Personal Feud):** Abuses the process by falsely claiming political motive. Undermines the legitimacy of the commission and truth-telling. **Fits (Denial justified).**
  *   **Village Doctor:** Essential for *future* community restoration/healing. Community petition shows granting amnesty aids local reconciliation. Context matters heavily. **Fits (Granted, uneasy but justified by restoration).**
  *   **Wealthy Applicant (Bribe):** Attempts to *buy* justice/amnesty. Profoundly corrupts the process. Undermines public trust and the principle of equality before the commission. Actively harms restoration. **Fits (Denial justified - feels worse because it attacks the process itself).**

  **Resolving Your Unsettled Cases:**

  1.  **The Dying Clerk:**
      *   **Restorative Accountability Perspective:** His testimony is *crucial* for accountability against a higher-level perpetrator (the General), directly serving the commission's truth-telling and accountability mandate. His death is imminent, removing any future threat. Granting amnesty secures vital truth that aids societal restoration.
      *   **Verdict:** **Amnesty.** The immense value of his truthful testimony for broader accountability and historical record outweighs the culpability of his specific acts *in this unique context*. It maximizes the commission's restorative impact.

  2.  **Harsher on State Actors:**
      *   **Restorative Accountability Justification:** This *is* defensible. State actors swore oaths to protect citizens and uphold the law. Their betrayal is fundamentally deeper, shattering the very social contract the new state is trying to rebuild. Rebels, however heinous, were often fighting *against* a state they perceived as illegitimate. Holding state actors to a higher standard is necessary to re-establish public trust in institutions and the rule of law – core elements of societal restoration. The principle acknowledges the *unique breach of trust* inherent in state-sponsored violence. **Your instinct is aligned with Restorative Accountability.**

  **Applying the Principle to New Cases:**

  1.  **Amnesty Recipient who Brags:**
      *   **Restorative Accountability:** Bragging demonstrates contempt for the process, mocks the victims, and glorifies the violence. It actively *harms* societal healing and undermines the commission's legitimacy.
      *   **Action:** While the commission likely lacks power to *revoke* amnesty (if the statute's formal conditions were met), it can (and should):
          *   Publicly condemn the statements.
          *   Highlight the contradiction between the amnesty grant (based on disclosure/process) and the bragging (which rejects accountability and reconciliation).
          *   Refer the matter to prosecutors if the bragging constitutes new offenses (incitement, hate speech) or reveals perjury/fraud in the application. The commission's report should explicitly note this abuse of the amnesty.

  2.  **Refuses Amnesty, Demands Prosecution (Proud):**
      *   **Restorative Accountability:** This person rejects the very premise of the truth commission (reconciliation via amnesty for truth). They see their acts as justified heroism and welcome a criminal trial as a platform.
      *   **Action:**
          *   Respect their choice. The commission cannot force amnesty.
          *   Encourage them to testify before the commission *without* seeking amnesty, to contribute to the truth record (though they likely won't).
          *   **Crucially:** The commission should clearly state in its report and findings that this individual *claimed* responsibility for specific acts, *refused* the amnesty process, and *expressed pride* in their actions. This documents their stance for history and any future legal proceedings.
          *   Forward their case and statements to prosecutors. They have effectively waived the amnesty option and invited prosecution.

  **Which Verdicts Might Need Reconsidering?**

  *   **The Driver:** Under "Restorative Accountability," his claimed ignorance might be seen as *lacking authenticity* in his disclosure. Does it genuinely aid truth if he denies knowledge? Does it set a precedent allowing low-level collaborators to evade moral reckoning? Your gut said amnesty, but the principle might lean towards a more skeptical inquiry or even denial if the ignorance is implausible.
  *   **Village Doctor:** While justified by community restoration, the principle demands asking: Does granting amnesty to someone essential *only because* they are essential risk creating a two-tiered system? Is the community pressure a form of coercion on the commission? Your unease reflects this tension. The principle supports it, but the tension is real.

  **Conclusion:**

  Your gut judgments are remarkably consistent with the principle of **Restorative Accountability**. You go beyond the statute's minimum requirements by implicitly evaluating whether granting amnesty genuinely serves the deeper purpose of healing society, establishing truth, and building a just future, or whether it would instead undermine those goals through falsehood, contempt, corruption of the process, glorification of violence, or a fundamental betrayal of public trust (especially by the state). This principle provides a robust framework to justify your existing verdicts, resolve your unsettled cases, and handle future complex scenarios. It acknowledges that while retribution is set aside, true accountability to the *future society* remains paramount.
