  Below is a comprehensive design for your seminar activity, optimized for your constraints and learning goals. The activity uses index cards, a printed score sheet, and a structured repair-revenge loop to make the costs of paradox responses tangible. I'll provide all requested components: materials list, rules/scoring, timeline, debrief script, failure modes, and limitations.

  ---

  ### **Materials List**
  1. **Index Cards** (40+): 
     - 8 pre-printed cards for the initial board (see below).
     - 10+ blank cards for revenge phase.
     - Markers for writing new cards.
  2. **Shared Boards** (4): 
     - Movable tables with the initial 8 cards arranged visibly. 
  3. **Score Sheets** (4 copies, [printed](https://www.overleaf.com/read/dqjvqkzsnwpt)): 
     - Tracks assignments, penalties, and bonuses per round.
  4. **Whiteboard**: 
     - Display scoring rules and vocabulary.
  5. **Timer**: For pacing.

  ---

  ### **Initial Board Setup (8 Cards)**
  Each card has a unique ID and a sentence using **fixed vocabulary: "true," "false," "not," and card IDs (e.g., "Card 1")**. No other words allowed. Cards are:
  - **Card 1**: "Card 1 is not true." *(Liar)*
  - **Card 2**: "Card 2 is true." *(Truth-teller)*
  - **Card 3**: "Card 4 is true." *(Cycle A)*
  - **Card 4**: "Card 3 is false." *(Cycle A)*
  - **Card 5**: "Card 6 is true." *(Cycle B)*
  - **Card 6**: "Card 5 is false." *(Cycle B)*
  - **Card 7**: "Card 8 is true." *(Grounded chain)*
  - **Card 8**: "Card 8 is true." *(Grounded truth-teller)*

  **Why this mix?**  
  - Card 1 (Liar) causes immediate contradictions.  
  - Card 2 (Truth-teller) is harmless but ungrounded—forces consistency.  
  - Cards 3–4 and 5–6 are short cycles (mimic Liar but with mutual reference).  
  - Cards 7–8 are grounded (Card 7 refers to Card 8, which refers to itself consistently). Forces groups to apply rules universally.

  ---

  ### **Rules and Scoring Scheme**  
  **Goal**: Assign a status (e.g., T, F, Gappy, Both) to every card to minimize penalties.  

  #### **Scoring Rules (Displayed on Whiteboard)**  
  1. **Disquotation Penalty (5 points per card)**:  
     - If a card says, "Card X is **true**," you **must assign "true" to X** to avoid a penalty.  
     - If a card says, "Card X is **not true**," you **must not assign "true" to X** to avoid a penalty.  
     - Applies *only* to cards assigned **T or F** (not new statuses).  
  2. **Blank Penalty (10 points per card)**:  
     - Any card left unassigned incurs a penalty.  
  3. **Transparency Tax (3 points per card per new status)**:  
     - Each card assigned a status *beyond* T or F (e.g., "Gappy") incurs a tax.  
  4. **Classical Bonus (2 points per card)**:  
     - Rewards assigning T or F (encourages minimizing new statuses).  

  **Example Scoring**:  
  - Assign Card 1 as "true":  
    - Card 1 says it is "not true" → disquotation penalty (5) + classical bonus (2) = **-3**.  
  - Assign Card 1 as "Gappy":  
    - No disquotation penalty + tax (3) = **-3**.  
  - Leave Card 1 blank: **-10**.  

  ---

  ### **Activity Timeline (110 Minutes Total)**  
  #### **Part 1: Initial Scoring (35 min)**  
  - **0–5 min**: Explain rules. Emphasize: "Score as many cards T/F as possible. New statuses cost extra."  
  - **5–35 min**: Groups work. Circulate, observe struggles (e.g., they’ll try to mark Card 1 "meaningless" but must apply it to Cards 2/4/8).  

  #### **Part 2: Repair-Revenge Loop (25 min)**  
  - **35–40 min**: Groups propose a repair rule. **Rule format**:  
    > *"IF [condition] THEN assign [status]."*  
    - **Allowed conditions** (vocabulary):  
      - "The card says that [ID] is [status]."  
      - "The card says that [ID] is not [status]."  
      - "The card refers to [ID]."  
      - "The card is self-referential." (Refers to itself)  
      - Logical operators: AND, OR, NOT.  
    - **Example rule**: *"IF the card is self-referential THEN assign Gappy."*  
  - **40–60 min**: **Two revenge rounds**:  
    - **Round 1**: Instructor adds **Revenge Card 9**: "This card is not true." *(Standard Liar)*  
    - **Round 2**: Instructor adds **Revenge Card 10**: "Card 9 is true." *(Strengthened Liar)*  
    - Groups re-score the board (now 10 cards) with their rule.  
    - **Fallback revenge cards** (use if students propose common repairs):  
      - **"Ban self-reference" repair**: *"IF self-referential THEN assign Gappy."* → **Revenge Card 9**: "Card 10 is true." + **Card 10**: "Card 9 is false." (Cycle exploiting mutual reference, not self-reference).  
      - **"Hierarchical level-climb" repair**: *"IF the card refers to Card X AND Card X is in Level 1 THEN assign Level 2."* → **Revenge Card 9**: "This card is Level 2 and not true." (Forces infinite regress; tax accumulates).  
      - **"Ban all negative statements" repair**: *"IF the card uses 'not' THEN assign Invalid."* → **Revenge Card 9**: "Card 9 is true." (Truth-teller revenge; must be assigned T to avoid penalty, but assignment is arbitrary).  

  #### **Part 3: Debrief (25 min)**  
  - **60–70 min**: Groups share scores and repair rules.  
  - **70–85 min**: Map game to the three families:  
    ```markdown
    **Hierarchical Response (e.g., Tarski)**: 
    - What you did: Invented levels (e.g., "Level 2") to contain references.
    - Cost in game: Transparency tax for each level → *expressive cost*. You can't say "all cards" without new levels.
    - Cost in theory: No universal truth predicate. Revenge: Higher-level Liars.

    **Gap Response (e.g., Kripke)**:
    - What you did: Assigned "Gappy" to ungrounded cards (e.g., Liar).
    - Cost in game: Penalized for Cards 2/8 → *inferential cost*. Truth-tellers (Card 2) can't be left Gappy without tax, but assigning T/F is arbitrary.
    - Cost in theory: Cannot assert "this sentence is gappy" without new paradoxes.

    **Paraconsistent Response (e.g., Priest)**:
    - What you did: Assigned "Both" to tolerate contradictions.
    - Cost in game: Tax for "Both" → *inconsistency cost*. Card 6 ("Card 5 is false") forces explosion if you assign "Both" to Card 5.
    - Cost in theory: Loses "ex falso quodlibet" (explosion); math proofs break.
    ```

  #### **Part 4: Transition to Next Lecture (5 min)**  
  - **85–90 min**: Preview technical follow-up:  
    "Next time, we'll see how hierarchies extend *transfinitely*, how fixed points *exist mathematically*, and how paraconsistency breaks Pythagorean proofs."  

  ---

  ### **Predictable Failure Modes and Handling**  
  1. **"Just tear up the Liar card!"**  
     - *Handle*: "Rules require a *general* repair. What if another Liar appears?"  
     - *Why encourage*?: Highlights the need for systematic solutions.  

  2. **Reasoning in richer language (e.g., "Card 1 is meaningless")**  
     - *Handle*: "Use only the fixed vocabulary. Rephrase: 'IF self-referential THEN assign Gappy.'"  

  3. **"Your scoring rules are a Liar card!"**  
     - *Handle*: "Scoring is metalinguistic—it *talks about* the game. We’ll discuss this distinction next class."  
     - *Why encourage*?: Teaches metalanguage/object language separation (key to hierarchies).  

  4. **Group assigns all cards "Gappy" to avoid penalties**:  
     - *Handle*: Scoring makes this expensive: 8 cards × 3 tax = -24, vs. -15 for optimal strategies.  

  ---

  ### **What the Activity Cannot Show (Limitations)**  
  1. **Coherent responses exist, but costs are offloaded**:  
     - The game suggests "no solution" by generating infinite revenge. **Clarify in debrief**: Each family *works* by restricting language (hierarchy), allowing truth-value gaps (fixed points), or revising logic (paraconsistency). Costs are localized in theory but *systemic* in practice.  

  2. **Missing technical depth**:  
     - **Hierarchies**: Game can’t show transfinite levels (e.g., ω). *Supply in lecture*: Kripke’s ordinal-level construction.  
     - **Fixed points**: Game doesn’t prove existence. *Supply*: Knaster-Tarski theorem via lattice diagrams.  
     - **Paraconsistency**: Game can’t show non-explosion’s math costs. *Supply*: Example of trivialism in number theory.  

  3. **Game misleads on revenge**:  
     - In the game, revenge is mechanical (new cards). **Clarify**: Real revenge (e.g., "strengthened Liars") targets *expressive limits*, not just new sentences.  

  4. **Truth-teller arbitrariness**:  
     - Game forces T/F assignment via bonuses. **Clarify**: In fixed-point theories, truth-tellers *can* remain indeterminate.  

  ---

  ### **Instructor Notes**  
  - **First-run advice**: Groups will fixate on Card 1. Let them fail, then guide toward universal rules.  
  - **Printables**: [Score sheet template](https://www.overleaf.com/read/dqjvqkzsnwpt) and card contents.  
  - **Why this works**: Students *feel* costs through scoring (e.g., tax = expressive limitation) and revenge (inevitability of new paradoxes).  

  This design turns abstract costs into visceral trade-offs, setting up your next lecture for technical depth. Let me know if you need refinements!
