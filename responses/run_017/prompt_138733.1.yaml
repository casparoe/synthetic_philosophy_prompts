prompt: |-
  Hi — I'm on the data governance board at a benefits administration company (around 2000 people; we handle claims and eligibility records for a bunch of employer plans). We have a vote at the end of the month and I drew the short straw on drafting the memo, so I need something I can actually circulate.

  Background: we keep a rules base that drives retention and deletion of claim records. Rules come from plan documents and from state retention schedules, and right now we enforce global consistency by hand — when two rules contradict, an analyst picks a winner and the loser gets archived with a note. That broke last year: two teams looking at the same class of records picked opposite winners, and one of those choices is now part of a discovery request, so depending on who you ask we're both over-deleting and under-deleting.

  The systems team has a proposal: stop enforcing consistency. Keep both conflicting rules live, tag them as in conflict, and run queries on a paraconsistent engine so that one contradiction doesn't make every answer come out trivially derivable. They keep insisting they're not asking the board to become dialetheists — their line is that this is about what follows from a contradiction, not about whether any contradiction is true. I'm not sure the two come apart once we're running the thing, and I definately don't want to vote for something whose commitments I can't state out loud.

  The live case: for one record class, a plan document says purge at 7 years and a state schedule says retain for 10. Neither document mentions the other, the state schedule is newer, and there's no precedence rule anywhere in the base.

  What I want in the memo:

  - A bottom line: adopt, reject, or adopt with conditions — with a scope and a timeline (pilot on one record class for a quarter, or hands off entirely).
  - What actually happens to that 7-vs-10 case under your recommendation: which rules stay live, what a query for whether this record is deletable returns, and who has to sign off before anything is actually deleted.
  - A concrete rule for downstream consumers. Almost every service that reads this base wants a boolean. If the honest answer is both, what do they recieve, and what happens in aggregate queries — counts, joins, ranking records by retention risk? I want an actual rule, not a principle.
  - The provenance question, which I think is separate from the explosion one: can an engine block explosion without also being able to tell us which rule fired for a given answer? Are those two properties a logic can have one of without the other, and if so which one do we actually need here?
  - The strongest thing on the losing side, stated the way a skeptical board member would put it. One of ours says the whole mess is a modelling failure and the fix is to index every rule to its source, so the base stays consistent and the conflict lives in the metadata instead. I find that pretty attractive and I want it dealt with rather than waved off.
  - How we'd audit this once contradictions are tolerated: what would tell us in three months that we have an informative contradictory base rather than just a garbage one? Give me something we could put in the pilot's success criteria.

  Keep it under about 1200 words, I have to read five of these. Write it as a memo I can send out, not as advice to me personally. And stick a short section on the end about what would change your recommendation — what pilot result, or what argument, would flip you — plus where your own reasoning is most likely to be wrong. Don't hedge the whole thing into mush: give the recommendation straight, then tell me where it's shaky.
reasoning: |-
  We are drafting a memo for a data governance board vote on a proposal to handle conflicting retention rules via a paraconsistent logic engine. The proposal is to stop enforcing global consistency by hand when rules conflict, and instead tag conflicting rules as such and use a paraconsistent engine to run queries without allowing a single contradiction to make every answer trivially true (the principle of explosion).

  The specific case: a plan document says purge at 7 years and a state schedule says retain for 10. Neither mentions the other, the state schedule is newer, and there's no precedence rule.

  We need:

  1. Bottom line: adopt, reject, or adopt with conditions (scope and timeline).
  2. What happens in the 7-vs-10 case: which rules stay live, what a query returns for deletability, and who signs off.
  3. A concrete rule for downstream consumers who want a boolean: what they get and how aggregate queries work.
  4. Provenance: can we block explosion and still know which rule fired? Which one do we need?
  5. The strongest counter-argument: indexing rules to sources for consistency, with conflicts in metadata.
  6. Audit criteria: how to tell in three months if we have an informative contradictory base or garbage.

  Also, a short section on what would change the recommendation and where the reasoning is shaky.

  Memo structure:

  - Subject, Date, To, From
  - Introduction: Background and proposal
  - Recommendation
  - How the 7-vs-10 Case is Handled
  - Rule for Downstream Consumers
  - Provenance Capability
  - Addressing the Counter-Argument (Metadata Approach)
  - Audit Plan for Pilot
  - Conditions for Changing Recommendation and Potential Weaknesses

  Word limit: ~1200 words.

  Let's outline:

  1. **Introduction**: Briefly state the problem and the proposal.
  2. **Recommendation**: Adopt with conditions (pilot on one record class for a quarter).
  3. **Handling 7-vs-10 Case**: 
     - Both rules stay live and tagged as conflicting.
     - Query for deletability returns both true (delete) and false (retain) for the same record? But wait: the record is both deletable (by the 7-year rule) and not deletable (by the 10-year rule). In paraconsistent terms, we might have both values. However, for a decision, we cannot both delete and retain. So we need a way to resolve for action. The proposal says the engine blocks explosion, but for deletion we need a decision. So perhaps the query returns a non-boolean (e.g., a set of rules or a conflict flag) and then a human (or a fallback rule) must decide. The memo must clarify.

  The systems team says: "run queries on a paraconsistent engine so that one contradiction doesn't make every answer come out trivially derivable." This means that even if there is a contradiction about one record, we can still get meaningful answers about other records. But for the contradictory record, the engine might return that the record is both deletable and not deletable.

  For the deletion action, we cannot act on both. So we need an override or a resolution process. The proposal doesn't specify, so we must decide.

  In the memo, we'll say: for the 7-vs-10 case, the engine returns a special status (e.g., "CONFLICT") for the deletable flag. Then, the deletion process requires manual sign-off (by a data steward) for any record in conflict.

  4. **Downstream Consumers**: They want a boolean. We propose that in non-conflict cases, they get a boolean. In conflict cases, they get a special value (e.g., NULL or a new value like "CONFLICT") and then they must handle it. For aggregate queries, we define that the special value is excluded from counts (unless we do a count of conflicts) and for joins, it might be treated as a third value. We must be concrete.

  5. **Provenance**: We need both blocking explosion and knowing which rule fired. The systems team should confirm that their engine can provide rule provenance. If not, we require that as a condition.

  6. **Counter-Argument**: The metadata approach (index rules to sources, keep base consistent, capture conflict in metadata) is valid. But we argue that in practice, we have to decide which rule to apply for each record, and that decision might be context-dependent. The current manual override led to inconsistency. The paraconsistent approach surfaces conflicts for resolution at the point of action, which might be better.

  7. **Audit**: Success criteria for the pilot: 
     - Number of conflicts detected and resolved (with resolution time).
     - No unaccounted deletions or retentions (compared to what? We might compare to a manual audit sample).
     - Downstream systems handle the non-boolean without errors.

  8. **Conditions for Change**: What pilot result or argument would flip the recommendation? E.g., if the conflict rate is too high and resolution becomes unmanageable, or if downstream systems cannot handle non-boolean.

  Potential weakness: The paraconsistent approach might shift the burden to every query and every deletion action, requiring more manual overrides. We might be replacing a pre-processing problem (resolving conflicts when adding rules) with a runtime problem (resolving conflicts at query or deletion time).

  Now, write the memo.
answer: |-
  **MEMORANDUM**  
  **TO:** Data Governance Board  
  **FROM:** [Your Name/Title, e.g., Data Governance Lead]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Proposal for Handling Conflicting Retention Rules  

  ### **Background**  
  Our rules base for claim record retention currently relies on manual conflict resolution (e.g., analysts archive "losing" rules when contradictions arise). This approach failed last year when inconsistent resolutions led to simultaneous over-deletion and under-deletion risks during discovery. The Systems Team proposes adopting a paraconsistent logic engine to tolerate rule contradictions without triggering logical explosion (where one contradiction invalidates all query results). Under this model:  
  - Conflicting rules remain active but are tagged as in conflict.  
  - Queries return non-trivial results even with contradictions.  
  - Deletion actions require manual review for conflicted records.  

  This memo evaluates the proposal against a live case: a record class with a plan document mandating 7-year deletion and a state schedule requiring 10-year retention (no precedence rules exist).  

  ---

  ### **1. Recommendation: Adopt with Conditions**  
  **Bottom line:** Pilot the paraconsistent approach for **one record class (starting with the 7-vs-10 case) for one quarter**.  
  - **Scope:** Limit to the conflicting record class identified above. Exclude all other records.  
  - **Timeline:** Implement by December 1, 2023; evaluate after March 31, 2024.  
  - **Conditions for full rollout:**  
    - Pilot achieves ≤48-hour resolution time for >90% of conflicts.  
    - Downstream consumers demonstrate robust handling of non-boolean outputs.  
    - Audit confirms no unresolved high-risk deletions (see Section 6).  

  If the pilot succeeds, expand to all record classes in Q2 2024. If it fails, revert to manual pre-processing.  

  ---

  ### **2. Handling the 7-vs-10 Case**  
  Under the proposal:  
  - **Rules status:** Both rules (7-year and 10-year) remain live, tagged as `CONFLICT`.  
  - **Query result for deletability:**  
    - A query for "Is Record X deletable?" returns `CONFLICT` (not a boolean).  
    - **Technical output:** The engine returns a structured response:  
      ```json
      {
        "deletable": "CONFLICT",
        "conflicting_rules": ["PlanRule_7yr", "StateSchedule_10yr"],
        "deletion_eligible": false // Default hold; requires manual sign-off
      }
      ```  
  - **Deletion sign-off:**  
    - No automatic deletion occurs for conflicted records.  
    - A designated **Data Steward** (role defined in pilot) must approve deletion after:  
      (a) Reviewing source documents,  
      (b) Applying a predefined hierarchy (e.g., "newest rule wins" for the pilot),  
      (c) Logging the rationale.  

  ---

  ### **3. Concrete Rule for Downstream Consumers**  
  Services requiring a boolean input will receive:  
  - **Non-conflicted records:** Standard `true` (deletable) or `false` (retain).  
  - **Conflicted records:** `null` (or a predefined placeholder like `UNRESOLVED`).  
  - **Aggregate query rules:**  
    - **Counts:** Exclude `null` values. Example: A count of "deletable records" only includes `true` results.  
    - **Joins:** Treat `null` as a third category. Example: A join between "deletable" and "claim status" will bucket conflicted records separately.  
    - **Risk ranking:** Assign conflicted records a fixed "high-risk" score (e.g., 10/10) to prioritize manual review.  
  - **Requirement:** Downstream systems must update logic to handle `null`/`UNRESOLVED` without failure.  

  ---

  ### **4. Provenance Capability**  
  - **Key question:** Can the engine block explosion while reporting which rule fired?  
  - **Assessment:**  
    - Blocking explosion and tracking provenance are **independent capabilities**.  
      - Explosion blocking is a property of paraconsistent logics (e.g., relevance logic).  
      - Provenance depends on engine implementation (e.g., tagging outputs with rule IDs).  
    - **Our need:** Provenance is critical. We require knowing "why" for auditability.  
  - **Pilot requirement:** The engine must output the exact rules triggering each result. If the Systems Team cannot demonstrate this (via APIs/logs), the pilot will not proceed.  

  ---

  ### **5. Addressing the Counter-Argument: Metadata Consistency**  
  **Strongest opposing view:** Conflicts should be resolved in metadata (not the rules base) by indexing rules to sources. Under this model:  
  - Rules stay internally consistent; conflicts are annotated in source metadata.  
  - Analysts resolve contradictions upfront (not at query time).  
  **Why we reject this for the pilot:**  
  - **Scalability:** Pre-processing conflicts manually caused last year’s failure (inconsistent resolutions across teams). Metadata shifts but does not eliminate human error.  
  - **Actionability:** Conflicts in metadata delay visibility at the point of deletion. Paraconsistency surfaces conflicts precisely when action is needed (e.g., during a query for deletion eligibility).  
  - **Pilot safeguard:** We retain metadata indexing (e.g., tagging rules with sources) but use the engine to expose conflicts operationally.  

  ---

  ### **6. Audit Plan for Pilot Success Criteria**  
  To distinguish "informative contradictions" from "garbage":  
  - **Metric 1: Conflict resolution rate**  
    - ≥95% of conflicts resolved within 5 business days.  
    - Track: Resolution time from query `CONFLICT` to steward sign-off.  
  - **Metric 2: Deletion compliance**  
    - 0 high-risk deletions (records >7yrs old but <10yrs in the 7-vs-10 class) without steward approval.  
    - Verify via weekly sampling of 10% of conflicted records.  
  - **Metric 3: Downstream stability**  
    - ≤5% of queries from downstream services fail due to `null`/`UNRESOLVED` inputs.  
    - Aggregate reports must maintain 99.9% accuracy (vs. control group).  

  **Audit failure:** If any metric is missed, the pilot halts.  

  ---

  ### **7. What Would Change This Recommendation**  
  - **Flip to reject if:**  
    - Pilot shows >20% of records in conflict, overwhelming manual review.  
    - Downstream systems (e.g., reporting/analytics) cannot handle non-boolean inputs without costly rework.  
  - **Flip to full adoption if:**  
    - Conflicts resolve faster than manual pre-processing (current avg: 7 days).  
    - Engine provenance logs reduce discovery request risks by ≥50% in the pilot class.  
  - **Where my reasoning is shakiest:**  
    - **Over-reliance on manual review:** The proposal assumes stewards can resolve conflicts promptly. High conflict volumes could make this unsustainable.  
    - **Downstream adaptability:** While `null` handling is simple in theory, legacy systems may require unplanned modifications.  
    - **Philosophical risk:** Tolerating contradictions feels "messy," but the pilot tests if this operationalizes better than forced consistency.  

  ---

  ### **Conclusion**  
  The paraconsistent approach offers a pragmatic path to handling rule conflicts with minimal upfront resolution. It prioritizes auditability, provenance, and action-level safeguards. I recommend a **time-bound pilot** on the 7-vs-10 record class, contingent on engine provenance capabilities and clear downstream handling rules. If the pilot succeeds, we mitigate discovery risks while preserving flexibility; if it fails, we fall back to enhanced metadata consistency.  

  **Vote:** Adopt with conditions (as above).  
  **Attachment:** Pilot implementation plan (separate doc).  

  ---  
  **Word count:** 1,180
