prompt: |-
  I'm a backend engineer, been doing this maybe nine years, no philosophy background beyond one required course I mostly slept through. I own the telemetry pipeline at a ~250 person company that makes scheduling software. Concretely there are three groups in our data: admins at big hospital systems (paying, loud, they have an account manager they can email), the front-desk staff who actually sit in the UI eight hours a day, and the patients who get reminder texts and show up in our tables as a phone number plus a boolean for whether they no-showed.

  I got into this because of a thing that happened last quarter. We shipped a change that silently broke reminder delivery for a chunk of patients; it took six weeks to notice; and the only signal we had was a regional bump in the no-show rate, which in the incident review got described as those patients being flaky. Nobody had lied, the data just had nothing else to say. Around the same time I stumbled into reading a couple of things about archives and power — the gist I got out of it was that an archive isn't a neutral pile of what happened, it's shaped by who was in a position to write things down, and that the gaps are made rather than just found. And now we're about to train a "smart scheduling" model on two years of these logs, so whatever we happened to record is about to become a pretty hard definition of who our user is.

  What I want from you is a procedure, not an essay. I run an instrumentation review maybe twice a sprint, plus a quarterly retention pass, so this is a recurring decision, not a one-off. It needs to be runnable in fifteen or twenty minutes by an engineer who has never thought about any of this, and it needs to fit on one page.

  So: the questions to ask in order, and what actually counts as an acceptable answer to each rather than hand-waving. Where it hard-stops with a "no, don't ship this event / don't make this change." Where it has to hand the decision to a person because the question is really about values, and which person — me, legal, the PM. And what gets written down afterwards and where, because I want some kind of absence register: a place that says we chose not to record X and why, so that in two years someone doesn't read the gap as nothing having happened.

  A few things it has to be able to handle, because these are the ones I keep hitting:

  - People who only exist as a leftover. Total sessions minus sessions we can attribute, that kind of thing. I've started calling them ghost users. There should be a question that surfaces them and asks what it would cost to make them visible at all.
  - Silences that travel. I made up the term "silence inheritance" for when the warehouse inherits a gap from the client SDK, so no amount of reprocessing downstream fixes it and everyone assumes it's fixed. The procedure should catch that whole class, not just the obvious "we never logged it."
  - The fact that some absences are load-bearing and good. I really don't want a procedure whose output is "log more," because we're under a GDPR-ish regime, deletion requests are real, and some of what we hold we probably shouldn't hold: the free-text "reason" field on the patient-facing cancellation form sometimes contains why someone can't make an appointment, which is close to medical detail. So there has to be a step that says don't record this, and a way to mark that down so people don't infer from the blank that nobody ever gave a reason.
  - Deletion asymmetry: the people most visible in the data are also the ones who know how to get themselves deleted, and the people who are only a residual don't know we have a record and have no way to contest what it says. That should be a question too.
  - And be honest about what the procedure can't do — which steps are judgment calls wearing a checklist as a costume.

  Then run it on three cases. One: a new event for a "bulk reschedule" button that only enterprise admins can even see. Two: a cost proposal to sample free-tier sessions down to two percent and drop a few fields, which I expect to be a no — I want to see exactly where it fails and what the cheapest thing that passes would be. Three, the one I'll like least: we currently log that free-text cancellation-reason field at full fidelity, forever, and it feeds three dashboards, one of which a VP looks at weekly. I'm fairly sure the procedure is going to tell me we shouldn't have it and I do not want to be the one who says that out loud, so tell me plainly what it says, what complying costs us, what we'd actually lose the ability to know, and if it turns out the procedure can't settle it and it's just a values call for a person, say that instead.

  Assume I'm smart about systems and dumb about theory: translate, don't gesture. And please write it in plain language — if a step needs a concept, define it in the step.
reasoning: |-
  We are creating a procedure for reviewing instrumentation changes and data collection practices. The goal is to identify and address gaps in data that may lead to misrepresentation of users, especially marginalized or less visible ones. The procedure must be efficient, actionable, and fit on one page.

  Key concepts to define in the procedure:
  - **Ghost Users**: Users who are only represented as a residual (e.g., total sessions minus attributed sessions). They are not directly logged and thus invisible in the data.
  - **Silence Inheritance**: When a gap in data at the source (e.g., client SDK) propagates to downstream systems (like the data warehouse) and cannot be fixed by reprocessing. The silence is inherited and often mistaken as fixed.
  - **Deletion Asymmetry**: The phenomenon where users who are well-represented in the data (and thus more visible) are also more likely to know how to request data deletion, while ghost users or less visible users cannot contest their representation (or lack thereof) because they don't know they are recorded.

  The procedure is a checklist of questions to ask in order. Each question must have clear acceptable answers and actions. It should include:
  - Hard stops (where the answer must be "no" to shipping).
  - Steps that require human judgment (and specify who makes that decision).
  - Documentation requirements (an "absence register" to record why we chose not to record something).

  The procedure must handle:
  1. Ghost Users: surface them and ask what it would take to make them visible.
  2. Silence Inheritance: catch gaps that are inherited and cannot be fixed downstream.
  3. Load-bearing absences: cases where not recording is the right choice (e.g., for privacy) and document that choice.
  4. Deletion asymmetry: ensure that the process considers the ability of users to delete their data and how that affects representation.

  Structure of the procedure:

  1. **Define the Change**: What is being proposed? (e.g., new event, change to existing logging, sampling, field removal, etc.)
  2. **Question 1: Who is represented?** 
     - Identify all user groups (admins, front-desk staff, patients) and note if any are missing. 
     - Specifically, check for ghost users: can we attribute every user action? If not, what is the residual and why?
     - Acceptable: Explicitly list all user groups that are represented and note any known ghost users and why they are not represented. If ghost users are significant, propose a way to reduce them or document the gap.
     - Hard stop: If the change would create a new ghost user group and we have no plan to address it, do not ship until addressed.
     - Judgment: If the cost of reducing ghost users is too high, document in the absence register and get approval from the PM (because it's a product decision on resource allocation).

  3. **Question 2: Can we fix the silence?**
     - Check for silence inheritance: if the data is missing at the source (client), then no downstream fix is possible. 
     - Ask: "If this data point is missing at the source, can we ever recover it? If not, how will we detect and alert on gaps?"
     - Acceptable: If the data can be logged at the source and the change ensures that, OR if it cannot (e.g., due to technical constraints) then we have a monitoring plan for the gap (e.g., logging the gap itself, such as a counter for when the data is missing). 
     - Hard stop: If the data is critical (e.g., for billing, compliance, or core functionality) and we cannot log it at the source with no plan to monitor gaps, do not ship.
     - Judgment: If the gap is acceptable but needs monitoring, the engineer must design the monitoring and get it approved by the telemetry owner (you).

  4. **Question 3: Should we record this?**
     - Consider privacy, legal, and ethical implications. 
     - Ask: "Is this data sensitive (e.g., PII, medical, financial)? Do we have a legitimate need to collect it? Can we achieve the same goal with less data (e.g., aggregated, hashed, or sampled)?" 
     - Specifically, for deletion: "If a user requests deletion, can we delete this data? And for ghost users, how would they even know to request deletion?"
     - Acceptable: If the data is sensitive, we must have a clear retention policy, a way to delete it upon request, and a way to anonymize or aggregate it. We must also document how ghost users can request deletion (if they are represented at all). 
     - Hard stop: If the data is sensitive (e.g., medical details) and we don't have a legal basis and proper safeguards, do not record. If we cannot provide a way for ghost users to request deletion (if they are represented) and the data is PII, we cannot record until we have a process.
     - Judgment: Legal approval required for sensitive data. PM and legal must sign off on the retention policy and deletion process.

  5. **Question 4: What if we don't record?**
     - Consider the impact of not recording. 
     - Ask: "What would we lose? How would we know? And how will we document the absence so that future analysts don't mistake the gap for nothing happening?"
     - Also, if we choose not to record, we must document it in the absence register.
     - Acceptable: We have a plan to document the absence (in the absence register) and a way to infer the missing data from other sources (if possible) OR accept that we won't have it and note the limitations in our models/dashboards.
     - No hard stop, but must document.

  6. **Documentation Step**:
     - For every change, update the absence register (a shared document, e.g., a wiki or a table in the data catalog) with:
          - The date and the change.
          - Any ghost user groups created or affected.
          - Any gaps we decided to inherit (and why).
          - Any data we chose not to record (and why).
          - How deletion requests are handled, especially for ghost users.

  Now, run the procedure on the three cases:

  **Case 1: New event for a "bulk reschedule" button (only enterprise admins can see)**

  1. **Define the Change**: Log an event when an admin clicks the "bulk reschedule" button.

  2. **Q1: Who is represented?** 
     - The event will represent enterprise admins. Ghost users? Not directly created by this event. But note: we are only logging admins, which is acceptable because the button is only for them. 
     - Acceptable: Only admins use this feature, so no ghost users introduced. Pass.

  3. **Q2: Can we fix the silence?**
     - The button is in the admin UI, so we can log at the source. We can also log when the button is clicked (so no silence inheritance). 
     - Acceptable: We are logging the event at the source. Pass.

  4. **Q3: Should we record this?**
     - The event does not contain PII. It might log which admin performed the action (which is account info, not sensitive). We have a legitimate need (tracking feature usage). 
     - Deletion: Admins are visible and know how to request deletion. 
     - Acceptable: We record it. Pass.

  5. **Q4: What if we don't record?**
     - We wouldn't know how much the feature is used. But since we decided to record, we don't need to document absence. However, we note that we are recording.

  6. **Documentation**: No absence to document. The event is safe to log.

  **Verdict for Case 1**: Ship it.

  ---

  **Case 2: Cost proposal to sample free-tier sessions down to 2% and drop a few fields**

  1. **Define the Change**: Sample free-tier user sessions to 2% and remove some fields (e.g., device ID, browser version) to save costs.

  2. **Q1: Who is represented?** 
     - Free-tier users are already represented, but sampling at 2% will create ghost users: the 98% not sampled are now residuals. We cannot attribute individual actions in the unsampled sessions. 
     - Hard stop: This creates a new ghost user group (the unsampled free-tier users). We must either not sample or find a way to represent them without storing per-session data (e.g., aggregate counts). 
     - Judgment: If we proceed, we must document the gap and accept that we lose per-session data for 98% of free-tier users. PM must approve because it affects product analytics.

  3. **Q2: Can we fix the silence?**
     - The silence is at the source: we choose not to log 98% of the sessions. This is an intentional gap and inherited downstream. 
     - We must have a way to monitor the gap: e.g., log the total session count and subtract the sampled ones to know the gap. 
     - Acceptable? Only if we log the total (to know the denominator) and the sample is random. But note: we are also dropping fields. If the dropped fields are needed for analysis, we cannot recover them. 
     - Hard stop: If the dropped fields are critical for core metrics (e.g., browser version for bug tracking) and we don't have them, then we cannot drop them. We must sample without dropping critical fields OR keep the fields for the sampled sessions but not for the unsampled (which is what we are doing). 
     - Judgment: Engineer must ensure that the total session count is logged and that the sampling is random. PM must approve the field drops.

  4. **Q3: Should we record this?** 
     - We are recording less, which is good for privacy? Actually, we are still recording PII for 2% and we are dropping some fields that might be PII (like device ID). 
     - However, we are reducing the amount of data, which is good. But note: ghost users (the unsampled) are still having sessions, but we don't record them. They cannot request deletion because we don't have their data? Actually, we have no record of them, so they are not in the system. 
     - But we are logging that a session happened (in the total count) without details. That total count might be considered data. 
     - Acceptable: We are not storing PII for unsampled users. For the sampled, we have the same as before. 
     - Pass.

  5. **Q4: What if we don't record?** 
     - We are choosing not to record 98% of the sessions in detail. We must document this in the absence register: "As of [date], we sample free-tier sessions at 2%. The unsampled sessions are not stored. This may bias analysis towards the sampled 2%."

  6. **Documentation**: Must update absence register.

  But note: the hard stop at Q1 and Q2. The proposal fails at Q1 because it creates ghost users without a plan to represent them. It also fails at Q2 if the dropped fields are critical and we don't have a way to recover them.

  **Cheapest thing that passes?**
  - At Q1: Instead of sampling per-session, we could log aggregated counts for the unsampled sessions (e.g., number of sessions per day by country) and keep per-session for 2%. This way, we don't have ghost users because we have a count of the total. But we lose per-session details for 98%.
  - At Q2: We must not drop fields that are critical for core monitoring. We can drop non-critical fields. We must log the total session count to know the gap.

  **Verdict for Case 2**: Fails at Q1 (unless we log aggregated counts for the unsampled) and possibly at Q2 (if we drop critical fields). The cheapest fix: keep the critical fields in the sampled sessions and log total session counts. Then document the gap. PM must approve.

  ---

  **Case 3: Logging the free-text cancellation-reason field at full fidelity, forever**

  1. **Define the Change**: Currently, we log this field. We are reviewing whether we should continue.

  2. **Q1: Who is represented?**
     - Patients who cancel and provide a reason are represented. Those who cancel without providing a reason are not (but that's acceptable because they didn't provide it). Ghost users? Not directly, but note: patients who don't cancel at all are not represented in this log, but that's okay because the event is about cancellations. Pass.

  3. **Q2: Can we fix the silence?**
     - We are logging the field when provided. If the patient doesn't fill it, we don't log. That's acceptable. We can log when the field is present vs. absent. Pass.

  4. **Q3: Should we record this?**
     - The field is free-text and may contain medical details (e.g., "I have a doctor's appointment"). This is sensitive. We are under GDPR and may not have a legal basis to store health data without additional safeguards. 
     - Deletion: Patients can request deletion, but they may not know we store this text. Also, ghost users (if any) wouldn't know to request deletion. 
     - Hard stop: If we are storing health data without proper safeguards and consent, we must not record it. 
     - Judgment: Legal must decide if this is health data and what basis we have. Even if legal says it's okay, we must consider: can we achieve the same goal (e.g., dashboards) without storing the full text? 
     - Acceptable: If we can, we should. For example, we could:
          - Hash the text (but then we lose the content) - not useful.
          - Classify the reason into categories (e.g., "medical", "work", "other") and log only the category. Then discard the free text.
          - Or, if we must keep the text, we need to: 
              - Get explicit consent from patients to store this (which we don't have now).
              - Implement strict access controls and encryption.
              - Have a short retention period (not forever) and a way to delete upon request.

  5. **Q4: What if we don't record?**
     - We lose the ability to do text analysis on reasons. But we can still log the fact that a reason was given (and maybe a category) without the text. 
     - We must document in the absence register: "As of [date], we no longer store the free-text cancellation reason. We store only a categorical reason (if any) because the free text contained sensitive information."

  6. **Documentation**: Either we stop recording and document, or we continue with legal approval and document the safeguards.

  **Verdict for Case 3**: 
  - The procedure says: we should not record the free-text field in its current form (without safeguards). It fails at Q3. 
  - Complying would cost us: 
      - We lose the ability to run arbitrary text analysis on the reasons. 
      - The VP's dashboard would have to use aggregated categories instead of free-text search.
  - But we can still know: 
      - The count of cancellations by category.
      - Common reasons (if we design categories well).
  - The procedure doesn't settle it: it requires a values call. Legal must decide if we can store health data. If not, then we must stop. If we can, then we must implement safeguards. PM and VP must be involved because it affects the dashboard.

  Now, we write the procedure as a one-page checklist.

  ---

  **Instrumentation Review Checklist**

  **Purpose**: To ensure data collection does not misrepresent users, especially the less visible, and to document gaps.

  **1. Define the Change**  
     - What event/logging is changing?  
     - Why? (e.g., new feature, cost saving, privacy)

  **2. Question 1: Who is represented?**  
     - *Definition*: **Ghost Users** are users who are only represented as a residual (e.g., total minus counted).  
     - *Ask*: Does this change create or affect ghost users? Can we attribute every user action?  
     - *Acceptable*:  
       - All expected user groups are represented.  
       - If ghost users exist, they are documented and we have a plan to minimize them (or a reason why not).  
     - *Hard stop*: If the change introduces a new ghost user group without a plan, do not ship.  
     - *Judgment*: PM must approve if ghost users are acceptable.  
     - *Documentation*: In absence register, note ghost users and reason.

  **3. Question 2: Can we fix the silence?**  
     - *Definition*: **Silence Inheritance** is when a gap at the source (client) propagates to downstream systems and cannot be fixed.  
     - *Ask*: If this data is missing at the source, can we recover it? How will we detect and alert on gaps?  
     - *Acceptable*:  
       - We log at the source OR  
       - We cannot log at source but we log the gap (e.g., a counter for missing data) and have monitoring.  
     - *Hard stop*: If the data is critical and we cannot log at source and have no gap monitoring, do not ship.  
     - *Judgment*: Telemetry owner (you) must approve the monitoring plan.  
     - *Documentation*: Note any inherited gaps and monitoring in absence register.

  **4. Question 3: Should we record this?**  
     - *Definition*: **Deletion Asymmetry**: Visible users can request deletion; ghost users cannot.  
     - *Ask*:  
       - Is this data sensitive (PII, medical, financial)?  
       - Do we have a legitimate need?  
       - Can we achieve the goal with less data (e.g., aggregated, hashed)?  
       - How will we handle deletion requests, especially for ghost users?  
     - *Acceptable*:  
       - Non-sensitive data: record.  
       - Sensitive data: only if we have legal basis, safeguards, and a deletion process. Ghost users must have a way to know we have data (if we do) and request deletion.  
     - *Hard stop*:  
       - Sensitive data without legal basis and safeguards: do not record.  
       - If we record PII and ghost users cannot request deletion: do not record until we have a process.  
     - *Judgment*: Legal must approve for sensitive data.  
     - *Documentation*: Note in absence register if we choose not to record for privacy.

  **5. Question 4: What if we don't record?**  
     - *Ask*: What do we lose? How will we document the absence so it's not mistaken for nothing happening?  
     - *Acceptable*:  
       - We document the absence and its implications.  
       - OR we find an alternative (e.g., aggregate data).  
     - *Documentation*: Always update the absence register with:  
       - What we are not recording and why.  
       - How this may affect analysis/models.  

  **Absence Register Template** (maintain a shared doc):  
  | Date       | Change Description | Affected User Groups | Gaps Introduced (Ghost Users, Inherited Silence) | Decision (Why) | Responsible Party |  
  |------------|--------------------|----------------------|--------------------------------------------------|----------------|-------------------|  
  | e.g., 2023-01-01 | Sample free-tier sessions 2% | Free-tier users | 98% of sessions not logged (ghost users) | Cost saving; PM approved | PM: Jane Doe |  

  **Reviewer**: Complete this checklist in 15-20 minutes per change. If any hard stop, do not proceed without resolution. Escalate judgments to the specified owner.
answer: |-
  Below is a **one-page, plain-language procedure** designed for your instrumentation reviews. It's structured as a sequential checklist with clear pass/fail criteria, hard stops, escalation points, and documentation requirements. Each concept is defined inline when used. The goal is to identify problematic data gaps (ghost users, silence inheritance), enforce intentional omission where needed, and document decisions to prevent misinterpretation.

  ---

  ### **Instrumentation Review Checklist**  
  *Run this for new events, schema changes, sampling, or retention policies. Timebox: 15–20 mins.*

  #### **Step 1: Define the Change**  
  *What are you proposing? (e.g., new event, field removal, sampling, retention change)*  
  **Output**: 1-sentence description.  
  **Example**: "Add `bulk_reschedule_clicked` event for admin users."

  ---

  #### **Step 2: Identify Affected User Groups**  
  *Goal: Surface ghost users (residual/unattributed activity) and power imbalances.*  
  - **Ghost Users**: *Users inferred from gaps (e.g., "total sessions – attributed sessions"). They lack direct representation.*  
  - **Ask**:  
    - "Which groups *directly* appear in this data? (Admins, staff, patients?)"  
    - "Could this change create ghost users? (e.g., via sampling, partial logging)"  
    - "Are there users who can’t speak for themselves? (e.g., patients with no UI access)"  

  **Acceptable Answers**:  
  - ✅ All affected groups are named. Ghost users are quantified (e.g., "Sampling drops 98% of free-tier sessions; ghosts = residual 98%").  
  - ✅ If ghosts exist: "We need visibility. Cost to fix: [time/effort estimate]."  
  - 🚫 **Hard Stop**: If ghosts are created *and* cannot be quantified or mitigated. **Do not ship**.  
  - ⚠️ **Escalate**: If quantifying ghosts is costly, PM decides whether to invest or document the gap.  

  **Documentation**:  
  - In the **Absence Register** (shared wiki/table):  
    `[Date] | [Change] | Ghost Groups: [e.g., "Unsampled free-tier users"] | Mitigation: [e.g., "None – PM approved cost savings"]`  

  ---

  #### **Step 3: Check for Silence Inheritance**  
  *Goal: Prevent unfixable gaps from propagating downstream.*  
  - **Silence Inheritance**: *When a data gap starts at the source (e.g., client SDK) and cannot be fixed later (e.g., in the warehouse).*  
  - **Ask**:  
    - "If this data is missing at the source, can we recover it downstream? (e.g., via reprocessing)"  
    - "Would gaps look like 'nothing happened'? (e.g., no error if reminders fail)"  

  **Acceptable Answers**:  
  - ✅ Gaps are impossible: "We log source-side errors (e.g., `reminder_failed` event)."  
  - ✅ If unfixable: "We monitor gaps (e.g., aggregate counters for missing data)."  
  - 🚫 **Hard Stop**: If gaps are unfixable *and* we lack source-side monitoring. **Do not ship**.  
  - ⚠️ **Escalate**: If monitoring is complex, telemetry owner (you) approves the design.  

  **Documentation**:  
  - Absence Register entry:  
    `[Date] | [Change] | Inherited Silence: [e.g., "No client-side error logging"] | Monitoring: [e.g., "Daily delta checks"]`  

  ---

  #### **Step 4: Assess Privacy & Deletion Asymmetry**  
  *Goal: Block harmful data collection; ensure fairness.*  
  - **Deletion Asymmetry**: *Visible users (e.g., admins) can request deletion; ghost users (e.g., residual patients) cannot.*  
  - **Ask**:  
    - "Is this data high-risk? (e.g., free text, PII, inferred medical/financial details)"  
    - "Can ghost users request deletion? If not, is this data essential?"  
    - "Could we use a safer alternative? (e.g., aggregate, hash, or drop fields)"  

  **Acceptable Answers**:  
  - ✅ Low-risk data: "Not PII/sensitive."  
  - ✅ High-risk data: "We anonymize/aggregate (e.g., hash phone numbers) OR drop it."  
  - 🚫 **Hard Stop**: If storing sensitive data (e.g., medical details) *without* legal approval. **Do not ship**.  
  - ⚠️ **Escalate**:  
    - Legal for GDPR/legal compliance.  
    - PM for tradeoffs (e.g., "Is this data worth the risk?").  

  **Documentation**:  
  - Absence Register entry:  
    `[Date] | [Change] | Omitted Data: [e.g., "Free-text cancellation reason"] | Why: [e.g., "Privacy risk – Legal advised"]`  

  ---

  #### **Step 5: Finalize & Document**  
  *Goal: Force explicit decisions about gaps.*  
  - **Ask**:  
    - "If we omit data, how will we prevent misinterpreting the gap? (e.g., blank ≠ 'no reason given')"  
    - "Is the absence register updated?"  

  **Action**:  
  - Update the **Absence Register** with Steps 2–4 decisions.  
  - For omitted data: Add context to dashboards/docs (e.g., "Cancellation reasons: Field dropped 2025-01-01 for privacy").  

  ---

  ### **What This Procedure Can’t Do**  
  - Steps 2/4 involve **judgment calls** (e.g., "Is ghost mitigation worth the cost?"). The checklist forces transparency but can’t replace human decisions.  
  - It won’t catch every edge case—focuses on high-impact gaps (ghosts, inherited silence, asymmetry).  

  ---

  ### **Test Runs on Your Cases**  
  #### **Case 1: New `bulk_reschedule` Event (Admins only)**  
  - **Step 1**: Log event when admin clicks "bulk reschedule."  
  - **Step 2**: Affects admins (directly visible). No ghost users created. ✅  
  - **Step 3**: Logged at source; no silence inheritance. ✅  
  - **Step 4**: Low risk (no PII). ✅  
  - **Step 5**: No gaps → minimal docs.  
  **Verdict**: ✅ **Ship**.  

  #### **Case 2: Sample Free-Tier Sessions to 2% + Drop Fields**  
  - **Step 1**: Sample 98% of free-tier sessions; drop `device_id` and `browser_version`.  
  - **Step 2**: **Ghost users = 98% of free-tier sessions**. Unquantified residual activity. 🚫 **Hard stop**.  
    - *Cheapest fix*: Log total session count (to quantify ghosts) + sample 2% with fields. Escalate to PM: "Is aggregated count sufficient?"  
  - **Step 3**: If fields are dropped, silence is inherited (can’t recover later). Requires monitoring (e.g., "log when fields are missing").  
  - **Step 4**: If `device_id` is PII, dropping it is privacy-positive. ✅  
  **Verdict**: 🚫 **Fail at Step 2**. Fix: Log total count + PM approval for sampling.  

  #### **Case 3: Keep Logging Free-Text Cancellation Reason**  
  - **Step 1**: Current: Log free-text `cancellation_reason` forever.  
  - **Step 2**: Affects patients who cancel (direct). No new ghosts. ✅  
  - **Step 3**: No silence issues (field is present or null). ✅  
  - **Step 4**: **High risk**: Contains medical details (e.g., "chemo appointment"). Ghost patients can’t request deletion. 🚫 **Hard stop**.  
    - *Complying costs*:  
      - **Dashboards lose**: Ability to search free text (e.g., VP’s keyword alerts).  
      - **Keep**: Aggregate trends (e.g., "20% cancellations for 'medical reasons'").  
    - *Alternatives*:  
      - Replace with dropdown (e.g., `category: medical/work/other`).  
      - Anonymize: Hash text (loses meaning) or use NLP to extract categories.  
    - **Escalate**: Legal (GDPR) + PM/VP (business impact).  
  **Verdict**: 🚫 **Fail at Step 4**. Must drop or redesign. Absence Register entry:  
    `2025-01-01 | cancellation_reason | Omitted Data: Free-text field | Why: Medical privacy risk; replaced with categories per Legal`.  

  ---

  **Output**: A living **Absence Register** (e.g., Confluence table) that documents gaps. Example:  

  | Date       | Change                          | Ghost Groups        | Inherited Silence       | Omitted Data           | Decision Reason                     |  
  |------------|---------------------------------|---------------------|-------------------------|------------------------|-------------------------------------|  
  | 2025-01-01 | Sample free-tier 98%            | Unsampled users     | None                    | N/A                    | Cost-saving; PM approved            |  
  | 2025-01-01 | Drop cancellation_reason text   | None                | None                    | Free-text reason field | Privacy risk; Legal directive       |  

  This forces gaps to be visible, auditable, and explicit—so "no data" is never misread as "nothing happened."
