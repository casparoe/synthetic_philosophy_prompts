prompt: |-
  Hi — I'm a science-and-ideas writer at a magazine, mostly covering AI, and I keep losing arguments with our style desk about when we're allowed to write that a system thinks, decides, wants, or refuses. Last month we ran a piece saying a chatbot "refused to answer" and a reader wrote in to say we'd smuggled in a mind; the month before we said a chess program "sacrificed its queen" and nobody blinked. I was arguing about this with a friend who edits at another outlet and her rule is just "never use mental verbs about machines," which seems definately too crude to me — we use them about firms, markets, and ant colonies all the time. So I want something better than a vibe: a short procedure my team can actually run. Constraints: reporters with no philosophy training, filing in a few hours, an assigning editor has to sign off, and it has to fit on one page of the style guide and work for headlines and photo captions, not just body copy.

  The theory I want it built out of is Dennett's three stances — physical, design, intentional — plus the companion idea that a pattern counts as real rather than merely projected when there is a description of the data that compresses it, so that predicting via the pattern is cheaper than tracking the underlying detail and any observer doing the bookkeeping would extract the same pattern. Please turn that into ordered steps, and please fix my draft list rather than rubber-stamping it (say which of my steps are circular or in the wrong order). Roughly what I have in mind: (1) a compression audit — the reporter must be able to write down, in one sentence in their notes, the cheaper description that the mental verb is buying; if they can't produce it, stop and no intentional language; (2) a design-availability check — a lot of the systems I write about are trained rather than built, so nobody can say what the parts are for, and I suspect this case is where the usual three-stance picture quietly breaks down and the intentional language starts doing work the design story should have done; (3) whether the intentional description buys predictions the design or physical story doesn't already give, over a prediction horizon the reporter has to name at filing time (new prompts? new board positions? new temperatures?) rather than just over the cases already in the story; (4) whose design it is — if the design stance is unavailable, does the attribution belong to the trainers and objective-setters instead of the system; and (5) some handoff point where the remaining question is about readers rather than metaphysics, i.e. how likely this sentence is to be read as a causal explanation rather than a summary, and how much it matters if it is. I also want a retraction clause: when an intentional prediction later fails on a new case, what exactly are we obliged to print, and why "the system changed its mind" is or isn't an available move. And I'd like the procedure to sort sentences into grades — unhedged attribution, hedged "as if", scare quotes, "in the vocabulary of the field" — and say which grade it licenses and with what typographic marking, since half our fights are about whether to use the quotes at all.

  Then run it on three sentences. One: "the model refused to answer" for a chatbot that was tuned to decline certain requests. Two: "the chess system sacrificed its queen" and "the system prefers positions it can win from." Three: something like "the ant colony chose the shorter route" or "the thermostat wants the room at twenty degrees" — a case where I suspect the procedure licenses unhedged mental language and I will hate the result. Please include at least one worked case where the procedure gives me an answer I don't like, and be explicit about the cases it can't settle at all, where an editor just has to decide. If you can also flag where the procedure will misfire in practice — the failure modes of the checklist itself, not just of the sentences — that would be genuinely useful.
reasoning: |-
  Hmm, this is a fascinating request from a science writer grappling with how to responsibly use intentional language when describing AI systems. The user clearly has deep familiarity with Dennett's philosophy and wants a practical, step-by-step guide for their editorial team.

  Key constraints I need to honor: 
  - Must work for journalists without philosophy training
  - Needs to fit on one page of a style guide
  - Must cover headlines and captions, not just body text
  - Requires clear typographic markings for different grades of attribution
  - Needs to handle prediction failures ("retraction clause")

  The user's draft has good bones but needs restructuring. Their step 1 (compression audit) is solid, but step 2 (design availability) should come later in the flow. I notice they're wrestling with how training complicates the design stance - that's crucial for modern AI systems.

  For the procedure: I'll organize it into three phases - qualification (can we use intentional language at all?), grading (how strongly can we phrase it?), and retraction (what if predictions fail?). The compression test should be first since it's the foundation. The "whose design" question needs to move earlier too.

  Biggest challenges will be:
  - Making the compression test practical for journalists on deadline
  - Handling cases where design stance is unavailable (like LLMs)
  - Grading language for headlines where space is tight
  - That pesky thermostat example where the framework might approve "wants" but feels wrong

  For the worked examples:
  - Chatbot "refused" should probably fail step 1 (no compression gain)
  - Chess "sacrificed" passes easily (clear predictive compression)
  - Thermostat "wants" will be the controversial one that passes technically but feels off

  Failure modes to flag:
  - Journalists might fake the compression description
  - Prediction horizons being set too narrowly
  - Over-reliance on "as if" language becoming weasel words

  The retraction policy needs teeth - if predictions fail, we downgrade language immediately. No "changed its mind" cop-outs unless it passes the compression test again.

  This needs to be tight - every step must earn its place on that one-page style guide. The grading scale with typographic markings will be key for consistency across headlines/captions/body text.
answer: |-
  Here’s a streamlined, actionable procedure based on your requirements, built from Dennett’s stances and compression theory. It fits on one page, works for all text formats (headlines, captions, body), and includes grading, retraction rules, and failure modes. Your draft steps were insightful but needed reordering and refinement to avoid circularity.

  ---

  ### **Style Guide: Intentional Language for Non-Human Systems**  
  *Apply this checklist before using verbs like "thinks," "decides," "wants," or "refuses" for machines, algorithms, or collectives.*

  #### **Step 1: Compression Audit (Is the pattern real?)**  
  ➔ **Action:** Reporter must write a *single sentence* describing **what predictive work the mental verb does**.  
  ➔ **Test:** Does this description compress the data? (i.e., is it cheaper than listing all underlying states?)  
  ➔ **Fail if:** The verb adds no predictive shortcut (e.g., "refused" just restates "didn’t respond").  
  ➔ **Output:** If fail, **stop**. No intentional language allowed. Use physical/design descriptions only.  

  #### **Step 2: Design Stance Check (Who owns the intent?)**  
  ➔ **Action:** Identify if the system’s behavior is explained by known **design/purpose**.  
  ➔ **Key Qs:**  
    - Was this behavior *explicitly* programmed? → Attribute to **designers**.  
    - Is it an *emergent* feature of training? → Attribute to **training process/system**.  
    - Is design unknowable (e.g., black-box AI)? → Proceed to Step 3.  
  ➔ **Output:** Determines *who* gets credit/blame (e.g., "the *training* caused the model to...").

  #### **Step 3: Predictive Gain Test (Does the verb buy new insight?)**  
  ➔ **Action:** Reporter must specify a **prediction horizon** (e.g., "new user prompts," "board states 5 moves ahead").  
  ➔ **Test:** Does the intentional stance predict *novel outcomes* in this horizon that design/physical stances **cannot**?  
  ➔ **Fail if:** Design/physical descriptions already cover all predictions.  
  ➔ **Output:** If pass, proceed to grading. If fail, use design/physical language only.  

  #### **Step 4: Grading & Phrasing (How to write it)**  
  ➔ Apply based on Steps 1–3:  

  | **Grade**          | **When to Use**                                     | **Format**                     |  
  |---------------------|-----------------------------------------------------|--------------------------------|  
  | **Unhedged**        | All tests pass *and* design stance is clear         | "The chess AI sacrificed its queen." |  
  | **Hedged ("as if")**| All tests pass, but design is emergent/opaque       | "The chatbot *acted as if* it refused." |  
  | **Scare Quotes**    | Compression passes, but predictive gain is weak     | "The model ‘refused’ to answer." |  
  | **Field Vocabulary**| Standard term in domain (e.g., "prefers" in game AI)| "The system *prefers* winning positions." |  

  ➔ **Headlines/Captions:** Use the strictest applicable grade (prioritize quotes/hedging if uncertain).  

  #### **Step 5: Retraction Protocol**  
  ➔ **If prediction fails:** Downgrade phrasing immediately (e.g., unhedged → "as if").  
  ➔ **Never use:** "The system changed its mind" (implies unproven persistent intent).  
  ➔ **Correction required:** Explain failure in design/predictive terms (e.g., "The behavior did not generalize to new cases due to data gaps").  

  ---

  ### **Worked Examples**  
  **1. "The model refused to answer."**  
  - **Step 1:** Compression? *"Avoiding harmful outputs per safety training."* → **Pass** (predicts it will skip similar queries).  
  - **Step 2:** Design stance? **Training-driven** → Attribute to training, not the model.  
  - **Step 3:** Predictive gain? **None** – design stance ("safety filter blocks X") already predicts this.  
  - **Grade:** **Scare quotes** ("refused") or hedge ("acted as if refusing") – *unhedged fails Step 3*.  

  **2. "The chess system sacrificed its queen."**  
  - **Step 1:** Compression? *"Trading high-value piece for positional advantage."* → **Pass** (predicts future win probability).  
  - **Step 2:** Design stance? **Explicit** (minimax algorithm) → Attribute to system.  
  - **Step 3:** Predictive gain? **Yes** – predicts opponent’s forced moves.  
  - **Grade:** **Unhedged** – all tests pass.  

  **3. "The thermostat wants the room at 20°C."**  
  - **Step 1:** Compression? *"Maintaining target temperature via feedback loop."* → **Pass** (predicts when it will activate heat/cool).  
  - **Step 2:** Design stance? **Explicit** (programmed setpoint).  
  - **Step 3:** Predictive gain? **None** – design stance ("compares actual vs. target temp") suffices.  
  - **Grade:** **Fail** – use physical: "The thermostat regulates to 20°C." (*You’ll hate this, but design stance covers all predictions.*)  

  ---

  ### **Edge Cases & Failure Modes**  
  - **Can’t Settle:** If compression exists but predictive gain is ambiguous (e.g., novel AI creativity), **default to "as if" + editor judgment**.  
  - **Procedure Misfires:**  
    - **Compression fraud:** Reporters write vague justifications. *Fix: Require peer review of the one-sentence test.*  
    - **Over-hedging:** "As if" used for *all* cases, voiding utility. *Fix: Audits if >30% of uses are hedged.*  
    - **Headline oversimplification:** Grades ignored for space. *Fix: Never use unhedged in headlines without Step 3 pass.*  
    - **Prediction horizon gaming:** Setting artificially narrow horizons. *Fix: Assigning editor must approve horizons.*  

  ---

  ### **Why This Works**  
  - **Philosophy → Practice:** Dennett’s stances operationalized into journalist-friendly checks.  
  - **Anti-Circular:** Steps ordered to prevent self-justification (e.g., compression test first).  
  - **Reader-Safe:** Grading system minimizes mind-smuggling while allowing precision.  
  - **Retraction-Ready:** Closes "it changed its mind" loopholes.  

  Append this to your style guide with a flowchart for quick reference. For contentious cases (like the thermostat), emphasize Step 3’s predictive bar – it blocks lazy anthropomorphism while allowing robust uses like chess AI.
