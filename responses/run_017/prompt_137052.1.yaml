prompt: |-
  I've been asked to put together a short "position file" on personal identity and survival for a reading group I'm in, and I'd like someone to check it over for coherence before I stand up and defend it. Here's where I've landed, more or less. Some of it feels like a package deal that doesn't quite fit together, and I'd rather find that out now than halfway through a seminar.

  (1) Reductionism. There's no deep further fact about whether I survive — no ego, no soul, nothing over and above the more particular facts about brains, bodies, psychology and causal chains.

  (2) What matters in survival is psychological continuity and connectedness, however it's caused — call it R. Bodily or organismic continuity matters only as the usual cause of R. If R holds, the cause is beside the point.

  (3) Standard destructive teletransporter: scan me here, destroy the body, rebuild from the scan on Mars. I press the button. As good as ordinary survival, no discount.

  (4) Fission, both hemispheres into two bodies. Strictly I don't survive, since identity can't be one-many. But I don't care about that: what matters is preserved, and I'd press the button just as readily as in (3). I also want to say it isn't *twice* as good as ordinary survival — two lives aren't better than one.

  (5) Branch-line style variant: non-destructive scan, replica on Mars, and the Mars branch dies of a heart defect two days later. Barely worse than ordinary survival, as I see it — the Earth branch carries on, the extra bit of life was short, no real loss.

  (6) Ordinary duplication where nobody dies: non-destructive scan, and both the Earth continuer and the Mars one go on for decades. I think the Earth continuer has a genuine and serious complaint here, and that something has gone badly wrong for them. I'd pay a lot to avoid this, and nowhere near as much to avoid (5). Which is odd, given that less dying happens in (6).

  (7) Swampman by fluke: a quantum accident assembles something molecule-for-molecule identical to me on Mars, with all my apparent memories, while I carry on here. Not me, not my survival — and (2) shouldn't be read as covering it.

  (8) Survival comes in degrees. If the scan is degraded and the replica only overlaps with me about 60% psychologically, I'm happy saying I partly survive, and I think the combined-spectrum style argument shows there's often no sharp yes or no answer.

  (9) Delayed reconstitution: scan, I die, and the replica is built from the archived scan forty years later with no memories of the gap. Survival with a forty-year hole in it. I'd sign up.

  (10) Asymmetric division: one branch comes out with maybe 90% of the connectedness and the other with about 30%. I want to say the first is nearly as good as ordinary survival and the second is a bad outcome, but not as bad as death.

  So: which pairs of these are actually in tension, and how badly? Rank the tensions by severity rather than flagging all of them as equally bad, and for each one say exactly what would have to give and what that revision would cost me somewhere else in the set. There's got to be at least one verdict in there that my own principle can't deliver — (6) is my suspicion, but I'd like you to work out which one it really is rather than just agreeing with me. Tell me too which of the apparent tensions dissolve on inspection and why, because I don't want to go around thinking I'm being bold when I'm just being confused. Then, if you had to fix the whole thing with one revision, which would clean up the most and what would it leave me committed to?

  Two more things. Please seperate what's settled among people who actually work on this from what's a contested reading — don't smooth a contested reading into "the standard view", and if you're unsure whether something is contested, say so instead of quietly picking a side. And flag anywhere my own wording is doing load-bearing work, i.e. where the tension is really about how I've phrased a thesis rather than about the cases. No need to cite anything or point me at papers, I've read the standard stuff; I just want the audit.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They've put together a position file on personal identity and survival, and they want me to check it for coherence. The main concern is that some parts might not fit together well, and they want to identify tensions before defending it in their reading group. 

  First, I need to go through each of their ten points carefully. They start with reductionism (1), emphasizing no deep further fact beyond physical and psychological continuity. Then (2) states that psychological continuity (R) is what matters, regardless of cause. The teletransporter case (3) seems consistent with this—they'd press the button, seeing it as survival. But fission (4) introduces a problem: identity can't be one-many, so technically no survival, but they still value R and would undergo fission. The odd part here is that two continuers aren't twice as good as one. 

  Next, the branch-line case (5) with a short-lived replica is barely worse than survival because the original continues. But in (6), when both original and replica survive long-term, the original has a serious complaint. This seems inconsistent because in (5) the original isn't harmed by a short-lived duplicate, but in (6) a long-lived duplicate causes a problem despite less actual death. Why is that? The user senses tension here, especially with their principle in (2).

  Swampman (7) is excluded even though it's psychologically identical, because it's a fluke. But (2) says R matters however caused, so excluding Swampman needs justification. The user might be relying on causal history here, which contradicts (2)'s "however it's caused." That's a key tension. 

  Degrees of survival (8) and delayed reconstitution (9) seem compatible. But asymmetric fission (10) complicates things—valuing the stronger psychological connection more. However, in (4), fission isn't survival but is equally valued, yet in (10) the weaker branch is a bad outcome. That needs reconciling. 

  Now, ranking tensions. The biggest one is between (2) and (7). If R matters however caused, Swampman should be survival, but the user denies it. That's a direct conflict. The branch-line (5) vs. duplication (6) tension is next—why is duplication worse? The user might be smuggling in self-interest about competing selves, which isn't in their stated principles. 

  Smaller tensions include fission's value in (4) vs. asymmetric (10), where the weaker branch is bad. Also, the delayed reconstitution (9) with a memory gap might conflict with psychological continuity requiring connectedness. 

  The user asked for revisions. If I suggest dropping the "however caused" from (2), it resolves the Swampman issue but makes causation matter, which could affect the teletransporter if causation is questioned. Alternatively, adding a non-branching clause to (2) fixes duplication worries but makes fission asymmetrical, complicating (4) and (10). 

  I should also note where wording is load-bearing. In (2), "however it's caused" is crucial for Swampman. In (6), "genuine and serious complaint" implies competition or uniqueness, which isn't in their principles. 

  Finally, clarifying what's contested. Reductionism and psychological criteria are standard, but degrees of survival and the importance of non-branching are debated. Swampman's exclusion is contested, as some theorists include it under psychological continuity. The user needs to be aware of these points when defending their position.
answer: |-
  Here's a coherence audit of your position file, ranking tensions by severity, identifying resolvable points, and suggesting a key revision. I'll flag contested areas and load-bearing wording as requested.

  **Major Tensions (Threaten Core Consistency):**

  1.  **Tension between (2) & (7) - Severity: High**
      *   **Conflict:** (2) states "what matters is psychological continuity and connectedness, *however it's caused*." (7) explicitly excludes Swampman, whose psychological continuity is perfect, *solely due to its cause* (quantum fluke).
      *   **What Gives:** You must either abandon the "however it's caused" clause in (2) or accept that Swampman *does* preserve what matters (and thus, on your view, constitutes survival). Excluding Swampman *requires* that cause matters fundamentally.
      *   **Cost:** Abandoning "however caused" weakens your case for the teletransporter (3) and fission (4), as critics could argue the *specific technological cause* matters. Accepting Swampman as survival radically departs from common intuitions and makes survival potentially ubiquitous and fleeting.
      *   **Contested?** YES. Whether brute-causal duplication (Swampman) preserves what matters is highly contested. Parfitians often bite the bullet and accept it; others (e.g., neo-Lockeans) insist on appropriate causal history. Your position currently tries to have it both ways.
      *   **Load-Bearing Wording:** "however it's caused" in (2) is *crucially* load-bearing against (7).

  2.  **Tension between (4)/(5) & (6) - Severity: High**
      *   **Conflict:** In fission (4) and branch-line (5), lack of identity isn't concerning because what matters (R) is preserved *in a continuer*. But in duplication (6), R is preserved *in a continuer* (Earth Original), yet they have a "genuine and serious complaint." Why the difference? Your principles (1, 2, 4) don't justify this asymmetry. If R is preserved for Earth Original (as it is in 3, 4, 5, 6), why is only (6) bad?
      *   **What Gives:** You need an additional principle. Likely: non-branching matters, or uniqueness matters. The complaint in (6) stems from the existence of a *rival* claimant, not a failure of R for the original. Your stated view (1, 2) doesn't provide resources for this.
      *   **Cost:** Adding a non-branching condition (e.g., "R *without fission*") resolves (6) but makes fission (4) *worse* than teletransportation (3) – contradicting your claim you'd press the button "just as readily". It also complicates asymmetric fission (10). Without it, you struggle to explain the disvalue in (6).
      *   **Contested?** YES. The significance of non-branching for "what matters" is central to the Parfit/Williams debate. Williams argued fission *should* be worse; Parfit argued it isn't. Your (4)/(5) align with Parfit, your (6) aligns with Williams.
      *   **Load-Bearing Wording:** "genuine and serious complaint" in (6) implies a unique harm not captured by your other principles. "Barely worse" in (5) downplays the significance of branching when it's temporary.

  **Moderate Tension (Requires Clarification/Qualification):**

  3.  **Tension within (4) & (10) - Severity: Medium**
      *   **Conflict:** In symmetric fission (4), you say it's not twice as good as survival, implying the value isn't additive. In asymmetric fission (10), you judge the 30% branch as a "bad outcome, but not as bad as death." This suggests *some* positive value to R-preservation in the weak branch, even if significantly discounted. How is this discounting justified or calculated given (8) (degrees)? Is the value of survival for a continuer *only* relative to the original's perspective *before* fission? Or does each branch have a perspective that matters intrinsically?
      *   **What Gives:** You need a clearer account of *for whom* and *how* outcomes are good/bad across fission. Is value indexed to the pre-fission person? To each resultant person? How does degree of connectedness map to degree of prudential concern *for the original*?
      *   **Cost:** Developing this risks complexity. It might require distinguishing the value *to the original* of having continuers from the value *of the lives* of the continuers themselves.
      *   **Contested?** YES. Accounting for value and concern in fission scenarios is deeply problematic and contested.
      *   **Load-Bearing Wording:** "twice as good" (4) and "bad outcome" (10) rely on an implicit metric of prudential value that isn't articulated.

  **Minor Tensions / Apparent Tensions that Dissolve:**

  4.  **Tension between (9) & Psychological Continuity - Severity: Low (Resolvable)**
      *   **Conflict:** (9) accepts survival with a 40-year memory gap. Standard psychological continuity theories emphasize overlapping chains of psychological connections (memories, intentions). A 40-year gap severs this chain.
      *   **Dissolution:** Your view (2) focuses on *continuity and connectedness*, not necessarily *unbroken* chains in real-time. The replica has significant connectedness (memories, personality) to the pre-scan person. This aligns with (8) - perhaps the 40-year gap means survival is partial or degraded, but still significant. You could embrace (8) here explicitly.
      *   **Contested?** Somewhat. Whether significant temporal gaps break psychological continuity is debated, but many reductionists accept they need not be fatal if enough connectedness exists at the endpoints.

  5.  **Tension between (1) & Survival Talk - Severity: Low (Resolvable)**
      *   **Conflict:** (1) denies any deep further fact, yet you freely talk about "survival," "partly survive," "not me."
      *   **Dissolution:** This is standard reductionist fare. Reductionists use identity/survival talk as a useful shorthand for complex patterns of physical/psychological relations (R). Your use in (3, 4, 7, 8, 9, 10) is consistent with this *if* "survival" is understood as "preservation of what matters (R)" (as per 2) rather than strict identity. Just be explicit that "survival" is shorthand.
      *   **Contested?** NO (among reductionists). This is the standard reductionist move.

  **The Key Revision:**

  *   **Revise (2) to Drop "however it's caused":** This is the single revision that cleans up the most severe tension (with Swampman).
  *   **New Commitment:** You must now accept that *appropriate causal history* is necessary for R to constitute what matters (or for R to be genuine). This aligns with excluding Swampman (7).
  *   **Impact:**
      *   **Resolves:** Tension between (2) & (7). Swampman lacks the right causal history, so R doesn't hold in the relevant way.
      *   **Preserves:** (1), (3), (4), (5), (8), (9), (10) largely intact. You can still argue teletransportation/fission provide the *right kind* of causal chain.
      *   **Complicates Slightly:** Requires justifying why teletransporter/fission causes are "appropriate" while Swampman's isn't. This is manageable (e.g., informational/causal link vs. coincidence).
      *   **Doesn't Fully Resolve:** The tension between (4)/(5) & (6) remains. You still need an account of why duplication (6) is bad despite R holding for Earth Original via an appropriate cause. Adding a non-branching clause ("R *without fission* matters") would be the next step, but this conflicts with your equanimity about symmetric fission (4).

  **Conclusion:**

  Your core tension isn't primarily (6), though (6) highlights a *different* significant tension (non-branching). The most fundamental inconsistency is between the bold "however it's caused" claim in (2) and the intuitive exclusion of Swampman in (7). **Dropping "however it's caused" from (2) is the most effective single revision.** It forces you to embrace a causal requirement for "what matters," which is a contested but defensible position, and resolves the Swampman clash directly. The fission/duplication tension (4/5 vs 6) is a separate, deep issue in personal identity that your view inherits; resolving it requires taking a stand on non-branching, which will involve a cost to your current symmetric fission verdicts. Your degrees thesis (8) helps smooth over many other potential rough edges (like 9, 10).
