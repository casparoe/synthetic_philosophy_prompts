prompt: |-
  I work at a small philanthropic brokerage that arranges moral trades: we introduce two funders who disagree about what is worth funding, and each directs money to what the other believes matters, on the understanding that both can end up better off by their own lights even though neither has persuaded the other of anything. We vet around twenty proposed trades a year with three staff and roughly half a day per proposal, and anything above a modest size has to be signed off by our board. What we do not have is a written procedure. We argue case by case, and the arguments keep collapsing into two slogans: that both sides gain by their own lights, so there is nothing left to object to, and that we are helping people do indirectly what they would not do themselves, which my colleagues treat as conclusive and I do not. I would like something better than either slogan, and better than a list of considerations with no order to them.

  Please write the decision procedure we could actually run. It should be a short ordered sequence of questions, with, for each one, what counts as a sufficient answer, what evidence we should demand and from whom, where the procedure stops with a no, and where it hands the decision to a named person because the remaining question is one of values rather than facts. It has to be usable by someone with no philosophy training, in a few hours, with counterparties who often cannot articulate a general value theory and can only tell us what they would fund. The conceptual work is in what the procedure preserves and what it drops, so it should handle at least these: the difference between a trade and mere cooperation on a project both parties already value, and between a trade and offsetting, where one party does something the other takes to be harmful and then compensates for it; cases where the disagreement is about a matter of fact rather than a matter of value, where what looks like a trade may really be a bet about which intervention is more effective; whether helping the counterparty do what we ourselves take to be wrong can ever be licensed by the fact that they gain by their own lights; whether we should discount the counterparty's gain by our own credence that their view is correct, and what, if anything, agreeing to broker says about that credence; parties whose values contain thresholds, satiation points, or protected and incommensurable goods, so that more money in their favoured cause eventually buys them nothing; trades where one party is a trustee acting for beneficiaries who cannot now consent, and trades whose performance is deferred for decades, where the party that must later perform is not the party that agreed; enforcement, meaning sequencing, escrow, reputation, defection after receipt, and what we owe each side when the other defaults; and our own conflict of interest, since our fee scales with the size of the trade we approve.

  Then run it on three proposals. First, a global-health funder who pays for insecticide-treated nets and deworming, matched with a funder who pays for arts education in her own city and makes no apology for favouring it; each commits two hundred and fifty thousand dollars to the other's chosen charity. I expect this one to pass, and I want to see where the procedure still demands judgement, including why equal dollar amounts are the default ratio and when the ratio should differ. Second, an animal-welfare foundation gives a million dollars now to a fund oriented towards the long-term future, and the fund's trustees undertake to disburse an inflation-adjusted equivalent to animal-welfare work in thirty years, across at least two changes of trustee and a governing document that can be amended: I want the procedure's answer on whether current trustees can bind their successors, whether beneficiaries who do not yet exist can be represented in a trade, and what security we should require. Third, a trade that both parties gain from by their own lights and that would be the largest we have ever brokered, in which one side's favoured intervention rests on an empirical claim our staff believe to be false and the other side accepts the trade largely because it defers to that judgement: my co-founder says it is not our business to police anyone's factual beliefs, I think we are being asked to sell our credibility, and I want the procedure to tell us which of us is right, or to tell us what extra question would have to be added to settle it and what adopting that question would cost us. If the procedure also needs a different treatment for trades involving an individual donor rather than an institution, say so. Two or three pages, no citations or bibliography, with a short preamble a new analyst could read to understand what a moral trade is and why the both-gain test is not enough on its own, and an honest closing section on what the procedure cannot do and where it will misfire.
reasoning: |-
  We are designing a decision procedure for a philanthropic brokerage that arranges "moral trades". In such a trade, two parties (A and B) each direct money to the other's cause, on the understanding that both can be better off by their own lights, even without changing their values. The key idea is that each values their own cause more than the other's, so by trading, they each get more of what they value.

  However, the "both gain by their own lights" test is necessary but not sufficient. We must also avoid:
  - Mere cooperation: where both already value the same project (so no trade is needed).
  - Offsetting: where one party does harm and then compensates (which may be seen as complicity in harm).
  - Bets: where the disagreement is about facts (effectiveness) rather than values.

  The procedure must be practical, usable by non-philosophers in a few hours, and work with parties who cannot articulate a general value theory.

  The procedure is a sequence of questions. For each:
  - What counts as a sufficient answer?
  - What evidence to demand and from whom?
  - Where to stop with a "no"?
  - Where to hand the decision to a named person (because it's a value judgment)?

  We must handle:
  1. Distinguishing trade from cooperation and offsetting.
  2. Factual disagreements (bets).
  3. Whether we can help fund what we think is wrong.
  4. Whether to discount gains by our credence in the other's values.
  5. Thresholds/satiation/incommensurable goods.
  6. Trustees and future beneficiaries.
  7. Deferred performance and enforcement.
  8. Our conflict of interest (fee scales with trade size).

  The procedure:

  **Preamble for Analysts:**
  A moral trade is an exchange between two funders with different values. Each directs money to the cause the other values, because each values their own cause more than the other's. Thus, by trading, each gets more of what they value. The "both gain by their own lights" test is the starting point: each must be able to say that, after the trade, they are better off than before. But that alone is not enough because:
  - We might be enabling harm (if we think one cause is bad).
  - The trade might not be a genuine exchange of values but a bet on facts.
  - There might be problems with enforcement or representation.

  Therefore, we have a step-by-step procedure.

  ---

  **Decision Procedure for Moral Trades**

  **Step 1: Are both parties making a voluntary, informed commitment?**
  - *Purpose*: Ensure basic consent and capacity.
  - *Sufficient answer*: Yes, both parties are legally competent and have the authority to commit. They understand the trade's structure (who pays whom, when, for what).
  - *Evidence*: 
    - For institutions: governing documents, board resolutions, or delegated authority.
    - For individuals: identity verification and a statement of understanding.
    - For trustees: proof that the trust instrument permits such commitments and that the commitment is within the trustee's powers (if not, stop).
  - *Stop if no*: If either party cannot commit (e.g., a trustee without power to bind future trustees), stop and reject.
  - *Hand off?*: No. This is factual.

  **Step 2: Do the parties have different values? (Avoiding mere cooperation)**
  - *Purpose*: Ensure this is a trade, not just cooperation on a shared goal.
  - *Sufficient answer*: Each party must value their own cause more than the other's cause, and the causes must be distinct. Specifically, without the trade, neither would fund the other's cause at the proposed level.
  - *Evidence*:
    - Ask each party: "Would you, absent this trade, fund the other's cause at this level?" They must both say no.
    - Also, ask: "Do you believe the other's cause is less important than your own?" They must both say yes (or at least not equally important).
  - *Stop if no*: If both parties would fund the other's cause anyway, or if they value the causes equally, then it's not a trade. Stop and reject.
  - *Hand off?*: No. This is about revealed preferences.

  **Step 3: Is the disagreement about values, not facts? (Avoiding bets)**
  - *Purpose*: Ensure the trade is about differing values, not about differing beliefs on effectiveness.
  - *Sufficient answer*: The parties must disagree about what is intrinsically valuable, not about what is effective in achieving a shared goal.
  - *Evidence*:
    - Ask each party: "If you believed the other's intervention were maximally effective at achieving its stated goal, would you still value it less than your own?" If both say yes, then the disagreement is about values.
    - If either says no (meaning: if the intervention were effective, they might value it), then the disagreement might be about facts. In that case, require the parties to state their factual beliefs and see if they differ. If they do, then it's a bet and not a moral trade.
  - *Stop if no*: If the disagreement is primarily about facts (e.g., one thinks nets save lives, the other thinks they don't), stop and reject because it's a bet.
  - *Hand off?*: If the answer is unclear, hand to the Board for a judgment on whether the core disagreement is about values or facts.

  **Step 4: Is each party gaining by their own lights?**
  - *Purpose*: The core of a moral trade: both must be better off after the trade.
  - *Sufficient answer*: Each party must state that they prefer the post-trade world (where they have less money but the other's cause is funded) to the pre-trade world (where they have their money and fund their own cause at a lower level). Specifically, they must be willing to make the trade at the proposed ratio.
  - *Evidence*:
    - Each party must sign a statement: "By my own values, I am better off with this trade than without it."
    - Additionally, we require a brief explanation of why (to catch mistakes, e.g., if they misapprehend the terms).
  - *Stop if no*: If either party cannot affirm this, stop and reject.
  - *Hand off?*: No. This is a direct statement by the party.

  **Step 5: Are there thresholds or incommensurable values that might block the trade?**
  - *Purpose*: Ensure that more money for a cause actually benefits the party (by their own lights) and doesn't violate protected values.
  - *Sufficient answer*: The party must confirm that the additional funding to their cause (from the other party) will be used in a way that they value, and that they do not have a threshold beyond which more funding is worthless or a protected value that would be violated by the trade.
  - *Evidence*:
    - Ask each party: "Does your cause have a funding threshold above which additional money does not help? If so, is the amount being directed to your cause above that threshold?" If yes, then the gain may not occur.
    - Also ask: "Is there any aspect of this trade that violates a core principle you hold, such that you would not want it to happen even if it brought more money to your cause?" (E.g., if one cause is antithetical to their values, they might not want it funded at all.)
  - *Stop if no*: If a party says that the funding would exceed a threshold (and thus not be beneficial) or violate a protected value, stop and reject.
  - *Hand off?*: If the party is unsure about thresholds, hand to the Board to decide whether the evidence of thresholds is strong enough to block the trade.

  **Step 6: Is there offsetting? (Avoiding complicity in harm)**
  - *Purpose*: Ensure we are not facilitating harm by one party and then compensation by the other.
  - *Sufficient answer*: The trade must not involve one party doing something that the other party (or we) considers harmful, and then "compensating" by funding the other's cause. The funding flows must be independent of any harmful act.
  - *Evidence*:
    - Ask each party: "Is your funding of the other's cause conditional on them performing any act that you (or we) might consider harmful?" If yes, it may be offsetting.
    - Also, we must judge: are the two funding actions independent? If one party is using the trade to enable harm (e.g., "I'll fund your cause if you let me build a polluting factory"), then it's offsetting.
  - *Stop if yes*: If the trade is structured as offsetting (harm + compensation), stop and reject.
  - *Hand off?*: If it is unclear, hand to the Board to judge whether it is offsetting or a genuine trade.

  **Step 7: Can we avoid being complicit in what we believe is wrong?**
  - *Purpose*: Address the broker's concern about facilitating a cause we consider bad.
  - *Sufficient answer*: Our brokerage must not facilitate a cause that we (the brokerage) believe is seriously wrong, even if the party gains by their own lights. However, we must balance this against our role as a neutral broker. We set a high bar: only block if the cause is one that we believe is clearly harmful and violates basic moral standards we hold.
  - *Evidence*:
    - Our staff must assess: does either cause fall into a category we have pre-defined as unacceptable (e.g., promoting hate, violence, or clear environmental destruction)? If so, we must not broker.
    - If not, then we accept the trade even if we disagree with the cause, because our role is to facilitate trade, not to judge values.
  - *Stop if yes*: If the cause is on our "unacceptable" list (to be maintained by the Board), stop and reject.
  - *Hand off?*: If staff are unsure, hand to the Board for a judgment on whether the cause is unacceptable. The Board must use our pre-agreed moral standards.

  **Step 8: Are there issues of representation? (Trustees and future beneficiaries)**
  - *Purpose*: Ensure that trustees can bind future trustees and that future beneficiaries are adequately represented.
  - *Sufficient answer*: For trustees, the commitment must be within their current powers and not improperly bind future trustees. For future beneficiaries, we must ensure that the trade is likely to be in their interests (by the trustee's current best judgment).
  - *Evidence*:
    - For trustees: legal opinion that the commitment is permitted and that it will be binding on successors (e.g., by creating a legally enforceable obligation). If not, then we require an escrow or other security.
    - For future beneficiaries: the trustee must affirm that they are acting in the best interests of the beneficiaries (by their own lights) and that the deferred performance is secured.
  - *Stop if no*: If the trustee cannot legally bind successors and no security is provided, stop and reject.
  - *Hand off?*: If legal questions arise, hand to our legal counsel. If the representation of future beneficiaries is in doubt, hand to the Board to judge whether the trustee's commitment is reasonable.

  **Step 9: How will the trade be enforced?**
  - *Purpose*: Ensure that the trade will be performed and that we have a plan for defaults.
  - *Sufficient answer*: The trade must have a clear enforcement mechanism: either simultaneous exchange, escrow, or a binding contract with reputational or legal consequences. We must also have a plan for what we do if one party defaults after the other has performed.
  - *Evidence*:
    - Propose a structure: for immediate trades, simultaneous transfer. For deferred trades, escrow or a legally binding obligation with security (e.g., a bond).
    - Also, we must have a written agreement that specifies remedies for default (e.g., we return the money to the performing party if possible, or seek damages).
  - *Stop if no*: If no feasible enforcement mechanism can be set up, stop and reject.
  - *Hand off?*: If the enforcement mechanism is complex, hand to the Board for approval.

  **Step 10: Check for conflicts of interest.**
  - *Purpose*: Ensure our fee does not bias our decision.
  - *Sufficient answer*: The analyst must confirm that they have followed the procedure without bias. For trades above a set size, the Board must approve, and the Board must not have a direct financial stake.
  - *Evidence*: The analyst's report and a Board sign-off for large trades.
  - *Stop if yes*: If a conflict is found and cannot be mitigated (e.g., by recusal), stop and reassign.
  - *Hand off?*: If an analyst has a conflict, hand to another analyst. If a Board member has a conflict, they recuse.

  **Step 11: Ratios and amounts.**
  - *Purpose*: Ensure the trade is balanced so that both parties gain. The default is equal dollar amounts, but sometimes ratios should differ.
  - *Sufficient answer*: The parties have agreed on the amounts, and each has confirmed they gain (Step 4). However, we must check that the gains are roughly comparable to avoid exploitation. We use a rule of thumb: the amounts should be within a factor of 2 unless one party has a strong reason (e.g., different purchasing power in their cause).
  - *Evidence*: The parties' statements from Step 4. If the amounts are very unequal, ask the parties to justify why they still gain.
  - *Stop if no*: If one party is clearly being exploited (e.g., giving $1M for $10K without justification), stop and reject.
  - *Hand off?*: If the amounts are unequal and the justification is unclear, hand to the Board to judge if the trade is fair.

  After all steps, if no stop, approve.

  ---

  **Running the Procedure on Three Proposals**

  **Proposal 1: Global Health vs. Local Arts**
  - Parties: 
    - A: Global health funder (nets and deworming), commits $250K to arts.
    - B: Local arts funder, commits $250K to global health.
  - Step 1: Both are institutions with authority. Pass.
  - Step 2: Values different? A values global health more than arts; B values arts more than global health. Both confirm they would not fund the other's cause at this level without the trade. Pass.
  - Step 3: Disagreement about values, not facts? A thinks saving lives is paramount; B thinks local culture is paramount. Even if arts were maximally effective, A would still value health more, and vice versa. Pass.
  - Step 4: Both gain by their own lights? A: "I get $250K for health, which I value more than the $250K I give to arts." B: similarly. Pass.
  - Step 5: Thresholds? Neither cause is near a funding threshold at this level. Pass.
  - Step 6: Offsetting? No harmful act is involved. Pass.
  - Step 7: Complicity? We (the brokerage) do not believe either cause is unacceptable. Pass.
  - Step 8: Representation? Both are current funders, no trustees. Pass.
  - Step 9: Enforcement? Simultaneous transfer. Pass.
  - Step 10: Conflict? Fee is small; no issue. Pass.
  - Step 11: Ratios? Equal amounts. Justified? Yes, because both parties are happy. Pass.
  - **Approve.**

  **Proposal 2: Animal Welfare Foundation vs. Long-Term Future Fund**
  - Animal welfare (A) gives $1M now to long-term fund (B).
  - B commits to disburse an inflation-adjusted $1M to animal welfare in 30 years.
  - Step 1: Both are trustees. Check authority: 
    - A: likely has power to grant money now.
    - B: must check if they can bind successors. Governing document may allow commitments, but amendment risk exists. **Evidence needed**: legal opinion on B's ability to bind successors and whether the obligation survives amendments. If not, we need security (e.g., escrow or a trust). If they cannot provide, stop. 
    - Assume B gets a legal opinion that the commitment is binding and they set up a trust for the obligation. Pass.
  - Step 2: Values different? A values animal welfare now; B values long-term future (e.g., AI safety). Both value their own cause more. Pass.
  - Step 3: Disagreement about values? Yes: A cares about current animals, B cares about future beings. Even if B's intervention were effective, A might not value it as much (if at all). Pass.
  - Step 4: Both gain? 
    - A: "I get $1M (in 30 years) for animal welfare, which I value more than the $1M I give now to B's cause." 
    - But note: A must discount the future. Ask A: "Do you value future animal welfare less than present? If so, is the inflation adjustment enough?" A must confirm they gain. 
    - B: gains because they get money now for their cause. Pass if both affirm.
  - Step 5: Thresholds? For A, will $1M in 30 years be useful? A must confirm that animal welfare will still be a priority and that the amount will be significant. Pass if yes.
  - Step 6: Offsetting? No harmful act. Pass.
  - Step 7: Complicity? Neither cause is unacceptable. Pass.
  - Step 8: Representation? 
    - For A: current animals are beneficiaries, but A is trustee. A must affirm they are acting in the beneficiaries' interests. 
    - For B: future beneficiaries cannot consent. B must affirm that this trade is in the best interests of their mission. 
    - **Hand off?** The Board must judge if the trustees' actions are reasonable, given the uncertainty of the future. Pass if Board approves.
  - Step 9: Enforcement? 
    - Because of the long delay, we require escrow or a legally secured obligation (e.g., a trust that holds assets to pay the future amount). 
    - Also, we need a plan for default (e.g., if in 30 years B doesn't pay, there is a legal claim). 
    - If secured, pass.
  - Step 10: Conflict? Large trade, so Board must sign off. Pass.
  - Step 11: Ratios? Equal nominal amount, but inflation-adjusted. Is that fair? A must confirm that the inflation adjustment is sufficient for their discount rate. If not, we might need a higher future amount. Hand to Board if adjustment is disputed.
  - **Overall**: Pass if the enforcement is secure and both parties affirm gain (Step 4) and representation is approved by Board.

  **Proposal 3: Large Trade with Factual Disagreement**
  - Party A funds intervention X (which our staff believe is ineffective).
  - Party B funds intervention Y.
  - Trade: A gives to Y, B gives to X. Both gain by their own lights because each values their own cause more. But B accepts the trade partly because they defer to A's judgment that X is effective, even though our staff think X is ineffective.
  - Step 1: Both can commit. Pass.
  - Step 2: Values different? Assume A values X more than Y, B values Y more than X. Pass.
  - Step 3: Disagreement about values or facts? 
    - Ask A: "If Y were maximally effective, would you still value X more?" A says yes. 
    - Ask B: "If X were maximally effective, would you still value Y more?" 
      - Here, B might say: "If X were effective, I might value it more, but I don't think it is." So B's valuation depends on the facts. 
    - Therefore, we require B to separate values and beliefs. If B says: "I value the goal of X (e.g., saving lives) but I don't believe X achieves it," then the disagreement is about facts. 
    - **Stop** because it's a bet, not a value trade. 
  - **Reject** at Step 3.

  But what if B says: "Even if X were effective, I would still value Y more"? Then Step 3 passes. Then we proceed.

  However, the problem is that our staff think X is ineffective. Does that matter?

  - Step 7: Complicity? We must check if funding X is unacceptable. If X is not harmful in itself (e.g., it's well-intentioned but ineffective), then it's not on our "unacceptable" list. We do not block based on effectiveness alone. So if Step 3 passes, we would approve.

  But the issue is: our co-founder says we shouldn't police facts, but the requester feels we are selling credibility. The procedure says: 
  - If the disagreement is about values (Step 3 passed), then we don't block based on our own factual beliefs. 
  - Step 7 only blocks if the cause is morally unacceptable, not if it's ineffective.

  Therefore, if Step 3 passes, we approve. The procedure sides with the co-founder.

  To address the credibility concern, we might add a step: "Do we have strong evidence that one intervention is harmful or fraudulent?" But that is already covered in Step 7 (unacceptable causes). Ineffectiveness alone is not a block.

  **Closing Section: What the Procedure Cannot Do**

  The procedure:
  - Relies on parties being honest and self-aware about their values.
  - Cannot resolve deep philosophical disputes (e.g., what counts as harm).
  - Assumes that parties can assess their own gains (no cognitive biases).
  - Does not handle trades where one party's values change over time.
  - May be too rigid for complex value systems (e.g., if values are context-dependent).
  - Cannot guarantee enforcement in the face of extreme events.
  - Our "unacceptable causes" list is subjective and must be maintained by the Board.

  It might misfire:
  - If a party misrepresents their values (Step 2 or 3).
  - If we misjudge the representation of future beneficiaries (Step 8).
  - If a deferred trade defaults and we cannot recover (Step 9).

  But it provides a structured way to avoid the main pitfalls we've identified.

  ---

  **Final Procedure (Abbreviated for Clarity):**

  1. **Voluntary, informed commitment?** (Evidence: authority docs) [Stop if no]
  2. **Different values?** (Evidence: parties say they wouldn't fund the other's cause and value their own more) [Stop if no]
  3. **Disagreement about values, not facts?** (Evidence: parties say even if the other's intervention were effective, they'd still value their own more) [Stop if factual; if unclear, hand to Board]
  4. **Both gain by their own lights?** (Evidence: signed statement) [Stop if no]
  5. **No thresholds or value violations?** (Evidence: parties confirm) [Stop if yes; if unsure, hand to Board]
  6. **Not offsetting?** (Evidence: no harmful act conditional on trade) [Stop if offsetting; if unclear, hand to Board]
  7. **Not unacceptable cause?** (Evidence: check our list) [Stop if unacceptable; if borderline, hand to Board]
  8. **Representation issues handled?** (Evidence: legal opinion for trustees; Board judgment for future beneficiaries) [Stop if not; hand to legal/Board]
  9. **Enforcement secured?** (Evidence: plan for exchange and default) [Stop if not; hand to Board if complex]
  10. **Conflict of interest?** (Evidence: analyst and Board checks) [Stop if not resolved]
  11. **Ratios reasonable?** (Evidence: parties affirm; if unequal, justification) [Stop if exploitative; hand to Board if unclear]

  Approve if all pass.
answer: |-
  ### Decision Procedure for Moral Trades  
  **Preamble for Analysts**: A moral trade occurs when two funders with different values each direct money to the other's cause, allowing both to gain by their own lights without persuasion. The "both gain" test is necessary but insufficient alone. We risk enabling harm, mistaking bets for trades, binding future parties unfairly, or compromising our integrity. This procedure ensures trades are genuine, enforceable, and ethically sound. It prioritizes practical evidence over abstract theory. If a party cannot articulate values, use their funding choices as proxies. Always document evidence in writing.

  ---

  **Decision Procedure**  
  *Run sequentially. Stop and reject if any step fails. All evidence must be signed by the counterparty or verified independently. Involve the Board (our governing body) for value judgments or high uncertainty.*

  1. **Can both parties commit voluntarily and knowledgeably?**  
     - *Sufficient answer*: Unambiguous "yes" from both, with proof of authority and understanding.  
     - *Evidence*: For institutions, provide board minutes or delegation documents. For individuals, provide ID and a written summary of the trade terms. For trustees, show trust documents permitting such commitments.  
     - *Stop if*: Authority is lacking (e.g., a trustee cannot bind successors without legal backing), or a party cannot explain the trade in simple terms.  
     - *Hand off?*: No. Fact-based.

  2. **Do the parties genuinely value different things? (Avoids mere cooperation)**  
     - *Sufficient answer*: Each party confirms they would not fund the other’s cause at the proposed level without the trade, and sees their own cause as superior.  
     - *Evidence*: Written statements: "I value [my cause] more than [counterparty’s cause] and would not fund [counterparty’s cause] at $X without this trade."  
     - *Stop if*: Either party would fund the other’s cause anyway or values them equally.  
     - *Hand off?*: No. Relies on party statements.

  3. **Is the core disagreement about values, not facts? (Avoids bets)**  
     - *Sufficient answer*: Both affirm that even if the other’s intervention were 100% effective, they would still prefer their own cause.  
     - *Evidence*: Written responses to: "If [counterparty’s intervention] worked perfectly, would you fund it over your own?" Must answer "no." If facts are disputed (e.g., effectiveness), require party explanations.  
     - *Stop if*: Disagreement hinges on facts (e.g., "I’d fund your cause if your numbers were right").  
     - *Hand off?*: If ambiguity remains, escalate to the Board to decide if it’s primarily about values.

  4. **Does each party gain by their own lights at the proposed ratio?**  
     - *Sufficient answer*: Signed declaration: "By my values, I am better off with this trade than without it."  
     - *Evidence*: The declaration plus a brief rationale (e.g., "I value $1 for my cause at $2 for theirs"). Default to equal dollar amounts unless adjusted.  
     - *Stop if*: Either party cannot affirm this.  
     - *Hand off?*: For unequal ratios (e.g., $500K for $250K), the Board must approve if the disadvantaged party cannot justify it (e.g., "My cause is cheaper per unit of good"). Ratios should stay within 1:2 without Board approval.

  5. **Could thresholds, satiation, or protected values block gains?**  
     - *Sufficient answer*: Both confirm the funding will advance their cause (no imminent thresholds) and the trade doesn’t violate sacrosanct values (e.g., "No amount of money justifies funding X").  
     - *Evidence*: Party statements on funding limits (e.g., "My cause needs $1M; this trade provides $250K, below saturation") and value conflicts.  
     - *Stop if*: Funding exceeds a stated threshold (e.g., "My cause is fully funded at $200K") or violates a protected value (e.g., "I won’t fund animal testing, ever").  
     - *Hand off?*: If thresholds are uncertain, the Board judges feasibility using party histories (e.g., past funding patterns).

  6. **Is this offsetting, not a trade? (Avoids complicity in harm)**  
     - *Sufficient answer*: No direct link between funding and harmful acts; money flows independently.  
     - *Evidence*: Written assurance: "My funding is not compensation for harm caused by the counterparty."  
     - *Stop if*: Trade enables harm (e.g., "I fund your cause so you’ll stop protesting my factory").  
     - *Hand off?*: If harm is alleged (e.g., one cause is "destructive"), the Board decides using our pre-defined "unacceptable acts" list (e.g., violence, coercion).

  7. **Can we broker this without endorsing harm? (Broker’s integrity check)**  
     - *Sufficient answer*: Neither cause is on our "unacceptable" list (e.g., hate groups, fraud).  
     - *Evidence*: Staff assessment against our internal list (reviewed annually by the Board).  
     - *Stop if*: A cause is unacceptable.  
     - *Hand off?*: If staff disagree, the Board rules. Our credence in a party’s values is irrelevant here—we only block clear harm.

  8. **Are future beneficiaries and commitments secure? (For trustees/long-term trades)**  
     - *Sufficient answer*: For deferred performance, binding mechanisms exist (e.g., escrow, trusts). Trustees confirm they are representing beneficiaries’ interests.  
     - *Evidence*: Legal opinion on binding successors; trustee statement: "This trade benefits my beneficiaries by my values."  
     - *Stop if*: Successors cannot be bound legally (e.g., governing documents allow amendments that void obligations), or beneficiaries’ interests are ignored (e.g., future humans/animals unrepresented).  
     - *Hand off?*: Board approves security arrangements (e.g., escrow size) and judges if trustees’ rationale is reasonable (e.g., "Future animals will still need help").

  9. **How will enforcement and defaults be handled?**  
     - *Sufficient answer*: A clear, signed contract covers sequencing, escrow, defaults, and remedies (e.g., "If B defaults, A gets funds returned plus reputational redress").  
     - *Evidence*: Contract draft reviewed by our legal counsel.  
     - *Stop if*: No feasible mechanism (e.g., deferred performance without escrow).  
     - *Hand off?*: Board approves complex enforcement (e.g., >10-year deferrals).

  10. **Is our conflict of interest managed?**  
      - *Sufficient answer*: Staff confirm impartiality; trades >$500K require Board approval.  
      - *Evidence*: Analyst declaration: "I followed procedure impartially."  
      - *Stop if*: Conflict is unmitigated (e.g., analyst’s bonus tied to trade size).  
      - *Hand off?*: Board approves large trades and resolves conflicts.

  **Output**: Approve if all steps pass. Reject if any step stops.  
  **Special Case**: For individual donors (not institutions), add:  
  - Step 1 requires proof of mental capacity (e.g., independent advisor confirmation).  
  - Step 8 is waived (no trustees), but Step 9 still applies for deferred performance.

  ---

  ### Running the Procedure: Three Proposals  
  **Proposal 1: Global Health vs. Local Arts**  
  - *Parties*: Health funder A ($250K to arts), arts funder B ($250K to health).  
  - **Step 1**: Both institutions provide board resolutions. Pass.  
  - **Step 2**: A: "I wouldn’t fund arts at $250K; health is paramount." B: "I wouldn’t fund health; local arts matter more." Pass.  
  - **Step 3**: A: "Even if arts transformed my city, saving lives is supreme." B: "Even if health interventions worked perfectly, arts define our community." Pass.  
  - **Step 4**: Both affirm gain. Equal ratio accepted (default). No Board needed.  
  - **Step 5**: No thresholds; $250K is marginal for both causes. Pass.  
  - **Step 6**: No offsetting; independent grants. Pass.  
  - **Step 7**: Neither cause unacceptable (health and arts are on our "safe" list). Pass.  
  - **Step 8**: No trustees. Pass.  
  - **Step 9**: Simultaneous transfer; standard contract. Pass.  
  - **Step 10**: Trade size <$500K; no Board needed. Pass.  
  - **Result**: Approve. *Judgement required*: None—equal ratio is default and justified by party affirmations.

  **Proposal 2: Animal Welfare vs. Long-Term Future Fund**  
  - *Parties*: Animal funder A ($1M now to future fund B); B commits inflation-adjusted $1M to animal welfare in 30 years.  
  - **Step 1**: A’s authority confirmed. B’s trust allows commitments but amendments possible. *Evidence*: Legal opinion shows B can bind successors if assets are escrowed. Pass with conditions.  
  - **Step 2**: A: "I wouldn’t fund long-term risks; animals suffer now." B: "I wouldn’t fund animals; future humans come first." Pass.  
  - **Step 3**: A: "Even if B’s work prevents human extinction, animals matter intrinsically." B: "Even if animal work succeeded, future risks dominate." Pass.  
  - **Step 4**: A affirms gain but notes: "Future animal funding must be inflation-adjusted to match my discount rate." B affirms. Board approves ratio (Step 4 hand-off).  
  - **Step 5**: A: "No saturation; $1M in 30 years will still help." B: "No protected values violated." Pass.  
  - **Step 6**: No offsetting. Pass.  
  - **Step 7**: Neither cause unacceptable. Pass.  
  - **Step 8**: Trustees represent future beneficiaries. A: "Current animals benefit indirectly." B: "Future humans benefit from funding now." *Hand-off*: Board judges this reasonable. Pass.  
  - **Step 9**: *Evidence*: Escrow account with B’s assets, adjusted for inflation. Contract includes arbitration for default. *Hand-off*: Board approves escrow mechanics. Pass.  
  - **Step 10**: Trade >$500K; Board approves. Pass.  
  - **Result**: Approve with conditions (escrow, Board sign-off). *Security required*: Fully funded escrow for the future amount. *Trustee binding*: Possible only with escrow/trusts. *Future beneficiaries*: Represented via trustee judgment, subject to Board review.

  **Proposal 3: Large Trade with Factual Disagreement**  
  - *Parties*: A funds intervention X (empirically disputed); B funds Y. Trade: A gives to Y, B gives to X. Both gain by their lights, but B defers to A’s factual judgment. Our staff believe X is ineffective.  
  - **Step 1**: Both institutions confirm authority. Pass.  
  - **Step 2**: A values X over Y; B values Y over X. Pass.  
  - **Step 3**: A: "Even if Y worked perfectly, X is my priority." B: "Even if X worked perfectly, I’d prefer Y." *But B adds*: "I accept because A’s expertise suggests X works." *Evidence*: B’s statement implies disagreement is about values, not facts—they’d still prefer Y. Pass.  
  - **Step 4**: Both affirm gain. Pass.  
  - **Step 5**: No thresholds. Pass.  
  - **Step 6**: No offsetting. Pass.  
  - **Step 7**: X is not "unacceptable" (e.g., not fraudulent/harmful, just ineffective). Pass.  
  - **Steps 8–10**: Not applicable or pass.  
  - **Result**: Approve. *Why?* Step 3 focuses on values, not facts. Staff’s credence in X’s efficacy is irrelevant per Step 7. *Your co-founder is right*: We don’t police factual beliefs, only value disagreements and harm. *To settle your concern*: Add a sub-step to Step 7: "Is there evidence of fraud or bad faith?" If staff provide proof (e.g., studies debunking X), the Board decides. But this risks overreach and delays—only add if fraud is common.

  ---

  ### What the Procedure Cannot Do  
  - **Handle value changes**: If a party’s values shift post-trade (e.g., arts funder regrets health funding), we rely on contracts.  
  - **Resolve deep ambiguity**: When parties cannot articulate values (e.g., "I just feel arts matter"), we use funding history, but this may misfire.  
  - **Predict long-term risks**: Deferred trades (e.g., 30 years) may fail from unforeseen events, even with escrow.  
  - **Eliminate bias**: Self-reported gains (Step 4) could be mistaken or dishonest.  
  - **Address all conflicts**: If both parties gain but the trade exploits third parties (e.g., harms non-consenting groups), Step 6 may miss it without evidence.  
  - **Scale effortlessly**: Complex trades (e.g., multiple thresholds) may require more time than allotted.  

  **Where it misfires**:  
  - If a party lies about values (Step 2), we enable false trades.  
  - If "unacceptable acts" (Step 7) are too narrow, we broker harmful causes.  
  - If future trustees ignore obligations (Step 8), beneficiaries lose out.  

  **Closing**: This procedure prevents slogans from overriding analysis, focusing on consent, gain, harm, and enforceability. It accepts that we broker trades, not truths—so we avoid judging facts or values beyond clear harm. But it demands rigor: when in doubt, the Board decides. Start small, document everything, and revise annually.
