prompt: |-
  so I'm on a short contract with the secretariat of our union's competence chamber — 14 member states, roughly 180m people, the chamber reviews whether the union-level legislature has overstepped and can send measures back for reconsideration. I've been reading about subsidiarity for fun (the EU version, the way Swiss cantons hoard everything they can, the German setup where the Länder end up administering most federal law, the American anti-commandeering stuff) and I've started trying to reverse-engineer the rule the chamber is actually running rather than the one it recites, since the recital is just the usual union-may-act-only-where-member-states-cannot-achieve-the-objective-sufficiently formula and obviously doesn't decide anything by itself. I put our recent decisions into a spreadsheet and can't get one clean rule out of them: we upheld a cap on sulphur in fuel for barges on the river system that runs through six member states; we upheld a rule forcing member states to recognise each other's vocational licences so an electrician qualified in one can take jobs in another; we upheld a cap on roaming charges for mobile calls, reasoning that no member state can regulate a call that originates in a different one; we struck down a directive requiring member states to criminalise denial of a listed set of historical atrocities with a minimum prison sentence; we struck down a union-wide ban on selling raw-milk cheese aged under sixty days; we upheld a rule requiring member states to reimburse residents who get treated in another member state's hospitals; we upheld, seven votes to six, a directive guaranteeing every worker twenty days of paid annual leave, with the majority saying member states would otherwise undercut each other competing for investment and the dissent saying that's a political judgement dressed up as a competence test; we struck down maximum waiting-time guarantees for hospital treatment even though the union produced mortality data; and we upheld a requirement that hospitals publish comparable data on infection rates. The two axes I keep coming back to are whether the harm or the decision's costs cross a border versus whether the failure mode is a coordination problem (everyone better off if everyone moves together) or a competition problem (each state individually wants to be the low-standard one) — and then there's a third variable that seems to matter to them more than the stated test does, namely whether the instrument is disclosure, a binding minimum, or full harmonisation.

  Next month's case is a directive requiring member states to impose a binding minimum staffing ratio in care homes for the elderly — one staff member per six residents on night shifts — plus a floor under care workers' hourly pay. The stated justification is that member states compete to attract private care-home chains, that any state holding standards loses investment and ends up with worse care overall, and that the resulting wage floor also depresses the care systems of neighbouring states whose workers get recruited away. The chamber has the usual paperwork: regional parliaments were consulted, there's a forty-page reasoned opinion, and the union's own impact assessment concedes that residents basically never cross a border and that care labour is overwhelmingly local, though it notes that about a seventh of care workers are posted in from other member states.

  What I want is not really the bottom line. I want: the two or three rules that fit our precedents about equally well and what each of them predicts here (I can think of at least a narrow transboundary-effects rule, a race-to-the-bottom rule, a core-domain carve-out for criminal law and health and social care, a process-only rule where we just check the reasoning and the consultation, and something like a least-intrusive-instrument ladder); which one you'd actually bet on and why, including whether the annual-leave decision or the waiting-times decision is the real tell; one further case that would separate the surviving candidates cleanly, ideally something I could get discussed as a hypothetical — I was thinking the same care-home directive but drafted as a transparency requirement instead of a binding ratio, though maybe there's a better probe; and finally, if I'm the one drafting the opinion and want it to cohere with what we've already done, what should we decide, which precedent is the closest analog, and what exactly are we committing ourselves to either way. My inside view is that they strike the binding ratio and drop a heavy hint that a disclosure version would have survived, but the outside view is that chambers like this defer whenever the paperwork is in order, and I can't tell how much of my hunch is just me pattern-matching on the cheese case.
reasoning: |-
  Hmm, the user is working for a union competence chamber and trying to reverse-engineer their actual decision-making rules from precedents. They've provided several cases where the chamber upheld or struck down union-level legislation, covering areas like environmental standards, labor rights, healthcare, and historical denial laws. 

  The user seems intellectually curious - they're reading about subsidiarity for fun while working on a short contract. They're clearly analytical, having created a spreadsheet of decisions and identified potential patterns like transboundary effects, race-to-bottom risks, and instrument types (disclosure vs binding rules). 

  Their core request is multilayered: they want alternative rules that fit the precedents equally well, predictions for each rule in the upcoming care-home case, betting advice on which rule will win out, a hypothetical case to distinguish between rules, and drafting advice for a coherent opinion. 

  The precedents show interesting tensions:
  - They upheld cross-border issues like roaming charges and vocational licenses
  - But struck down "core domain" rules like criminalizing historical denial
  - The paid leave case split 7-6 with competition logic winning
  - Yet they rejected hospital waiting times despite mortality data

  For the care-home case, key factors seem to be:
  - Weak transboundary claims (only 1/7 workers cross borders)
  - Strong race-to-bottom argument in the proposal
  - Binding minimums vs disclosure options
  - Parallels to both the upheld (paid leave) and struck down (waiting times) health cases

  The user's hunch about striking down the ratio but hinting at disclosure seems plausible - it mirrors the cheese case where harmonization failed but disclosure might work. But the paid leave precedent complicates things since that binding rule was upheld using competition logic. 

  For a clean test case, a disclosure-only version of the care-home rule would be perfect - if the chamber accepts that, it confirms instrument sensitivity; if not, it suggests deeper hostility to social policy harmonization. 

  If drafting, I'd lean toward striking down the staffing ratio as insufficiently cross-border, while explicitly endorsing disclosure as a better alternative - using the raw-milk cheese and hospital infection cases as anchors. This avoids overruling the paid leave precedent by distinguishing wage competition from staffing ratios.
answer: |-
  Based on your precedents and the care-home case details, here’s a structured breakdown of the competing rules, predictions, and strategic advice:

  ---

  ### **I. Plausible Rules Extracted from Precedents**
  1. **Narrow Transboundary Harm Rule**  
     - *Logic*: Uphold only where harm/cost *physically crosses borders* (roaming, river pollution, vocational licenses, healthcare reimbursement).  
     - *Predicts for Care-Homes*: **STRIKE DOWN**. Residents don’t cross borders; labor mobility is low (only 14% posted workers). Wage competition is indirect.  
     - *Weakness*: Doesn’t explain *paid leave* or *infection data* uphold (no physical spillover).

  2. **Race-to-the-Bottom (RTB) Rule**  
     - *Logic*: Uphold where states face *competitive pressure to lower standards* that undermines shared goals (paid leave, vocational licenses).  
     - *Predicts for Care-Homes*: **UPHOLD**. Justification explicitly cites investment competition lowering standards.  
     - *Weakness*: Why strike down *raw-milk cheese* or *waiting times*? Possibly requires proof of *systemic* undercutting (absent in cheese case).

  3. **Least-Intrusive Instrument Ladder**  
     - *Logic*: Tiered scrutiny: Disclosure > Minimum standards > Full harmonization. Upholds disclosure (infection rates), skeptical of binding rules (cheese, waiting times).  
     - *Predicts for Care-Homes*: **STRIKE DOWN** the binding ratio/pay floor, but hint disclosure (e.g., staffing transparency) would be acceptable.  
     - *Strength*: Explains *infection data* (upheld) vs. *waiting times* (struck down).

  4. **Core Domain Carve-Out**  
     - *Logic*: Defer to states on "core sovereign" areas: criminal law (atrocity denial), health/social care (waiting times, raw-milk cheese).  
     - *Predicts for Care-Homes*: **STRIKE DOWN**. Elderly care is "core" health/social policy.  
     - *Weakness*: Fails on *paid leave* and *healthcare reimbursement* (both upheld despite touching social policy).

  5. **Process-Only Rule**  
     - *Logic*: Defer if consultation/impact assessment is adequate (all cases here had paperwork).  
     - *Predicts*: **UPHOLD** (paperwork exists).  
     - *Weakness*: Doesn’t explain inconsistent outcomes (e.g., atrocity denial struck down despite process).

  ---

  ### **II. Betting Prediction & Key Tell**
  - **Most Likely Rule in Play**: **Least-Intrusive Instrument Ladder** (with RTB elements).  
    - *Why?*  
      - Instrument type (disclosure vs. binding rule) splits your precedents cleanly:  
        - **UPHELD**: Disclosure (infection rates), RTB + cross-border (paid leave, roaming).  
        - **STRUCK DOWN**: Binding rules in core domains (cheese, waiting times, criminal law).  
      - *Annual leave* is the **real tell**: The 7-6 split shows the chamber *does* accept RTB logic for *labor standards* but is split on its limits. *Waiting times* loss despite mortality data suggests **intrusiveness** mattered more than harm severity.  
    - **Prediction for Care-Homes**: **Strike down binding ratio/pay floor** (intrusive + weak transboundary), but endorse disclosure or softer coordination.  

  ---

  ### **III. Hypothetical Case to Separate Rules**  
  **Probe Case**: *Union directive requiring care homes to publicly disclose*:  
  - Staff-to-resident ratios,  
  - Pay ranges for care workers,  
  - Resident satisfaction scores.  
  *(No binding minimums)*  

  - **How it Separates Theories**:  
    - *Transboundary Rule*: Strikes down (no cross-border harm).  
    - *RTB Rule*: Upholds (disclosure mitigates race-to-bottom by empowering consumers).  
    - *Instrument Ladder*: Upholds (disclosure is least intrusive).  
    - *Core Domain*: Strikes down (still "health/social policy").  
  - **Outcome Prediction**: Chamber **UPHOLDS**, aligning with *infection data* precedent. Confirms **instrument sensitivity** > transboundary test.

  ---

  ### **IV. Drafting Advice for Coherence**  
  - **Recommended Decision**: **STRIKE DOWN** the staffing ratio and pay floor.  
    - *Closest Analog*: *Raw-milk cheese* (binding rule in localized sector struck down despite safety claims).  
  - **Key Reasoning for Coherence**:  
    1. **Weak Transboundary Nexus**: Stress that care labor/residents are predominantly local (per impact assessment). Wage competition is speculative.  
    2. **Instrument Matters**: Cite *infection data* vs. *waiting times*: Disclosure is acceptable; binding ratios are not without clear cross-border market failure.  
    3. **Distinguish from Paid Leave**: Argue paid leave affects *worker mobility* (cross-border), while care ratios are *fixed-location services*.  
  - **Commitment Implications**:  
    - **If Struck Down**: Reinforces *instrument ladder* and *localized-core-domain* boundaries. Limits future RTB claims to mobile factors (labor, capital).  
    - **If Upheld**: Erases *cheese/waiting-times* logic and opens all social policies to RTB arguments.  

  **Final Tip**: Emphasize the *disclosure alternative* in the opinion. This mirrors the *cheese* case’s implicit endorsement of labeling over bans, preserving flexibility while nudging the union toward less intrusive tools.  

  ---
  **Bottom Line**: Your hunch is likely correct. Chamber will strike down the binding ratio but bless disclosure—aligning with *cheese* and *infection data* while sidestepping the *paid leave* rift. The paperwork won’t save this directive; *intrusiveness in a localized sector* is the fatal flaw.
