prompt: |-
  Write me a parody, about 600 words, set out as numbered clauses, of the induction handbook for a drab back-office firm that hires temps for a single job: continuing a numerical series correctly. The new starter is shown 2, 4, 6, 8 and asked to go on.

  The humour has to come from the handbook's own inability to say what it's asking for, so each clause should try a different way of nailing down what makes a continuation correct and quietly give up on it. I'd want roughly: a clause that tries to define correctness by what the temp is disposed to answer; one that appeals to the rule the temp meant without ever managing to say which rule that is; one ruling that what a temp feels, pictures or inwardly says is not evidence and that there's no inner fact to consult; and, as the last substantive clause, one that settles for what a qualified assessor would agree to after a reasonable period of scrutiny. It must never admit that this has swapped correctness for assertibility, and it must never come out and say that there's no fact of the matter — it keeps talking as though there obviously is one while making it impossible to say what.

  Two more things I'd like worked in. Slip in the rival rule that agrees with addition for every pair of numbers below 64 and returns 5 for anything above, together with the policy that no run of past answers can distinguish it from adding, and that the handbook's own clauses are subject to the same difficulty as the series. And include a staffing rule that no temp may ever work a shift alone, since a lone worker cannot be certified as following any rule at all, even if they recieve a perfect audit.

  Deadpan HR voice throughout — appraisals, rotas, escalation, a grievance procedure that rules out appeals on the grounds that you meant something different. No naming of philosophers, no use of the word quus, no footnotes, no winking at the reader.
reasoning: |-
  Okay, the user wants a parody of an induction handbook for a temp agency focused on continuing a numerical series. The key is to maintain a deadpan HR tone while humorously failing to define what makes a continuation "correct." 

  First, I need to structure this as numbered clauses. The user specified several required elements: 
  - Clause attempting to define correctness by the temp's disposition (which immediately becomes impractical)
  - Clause appealing to the "intended rule" without ever specifying it
  - Clause dismissing internal states as irrelevant evidence
  - Final clause defaulting to assessor agreement without acknowledging it's just assertibility

  The rival "quus-like" rule (stopping at 64) must be slipped in subtly, framed as a staffing policy about past answers. The lone worker policy is crucial too - no solo shifts because rule-following requires observation.

  Hmm, the challenge is maintaining bureaucratic sincerity while showing each definition crumbling. For the disposition clause, I'll have them propose testing every possible input then admit it's "operationally unfeasible." For the intended rule clause, I'll let the handbook vaguely reference "your mental content" while providing zero way to access it. 

  The internal states clause practically writes itself - just need HR-speak like "subjective impressions... carry no evidentiary weight." The assessor clause will carefully avoid saying "correctness is whatever we decide," instead using phrases like "qualified consensus" and "robust verification."

  For the rival rule, I'll attach it to an auditing policy where past answers can't prove future compliance. And the lone worker rule gets a Kafkaesque twist: perfect audits don't count without witnesses. 

  Must avoid any philosophy jargon or winks. The humor comes purely from the handbook's desperate, unconscious flailing. Final touch: grievance procedure that dismisses "I meant X" as irrelevant. Perfect.
answer: |-
  **Temporal Numeric Continuance Operative Handbook (v.7.3a)**

  **1. Purpose & Scope:** This handbook outlines the standards, procedures, and expectations governing your role in Numeric Continuance. Your core function is to correctly continue the provided numerical sequence (e.g., 2, 4, 6, 8, ...). Correct continuation is defined as providing the next logical number(s) based on the inherent pattern demonstrated by the initial sequence segment.

  **2. Defining Correctness (Operational Disposition):** Correct continuation is demonstrably aligned with the disposition a reasonable operative exhibits when presented with the initial sequence under standard testing conditions. This disposition manifests as a consistent tendency to produce specific outputs for specific inputs. For clarity, a fully manifested disposition would involve testing every conceivable continuation point; however, operational feasibility necessitates focusing on the immediate next number(s) as per your assigned task. Your disposition *is* the rule, as evidenced by your outputs. *(Note: Comprehensive disposition mapping is operationally unfeasible and not required for task completion.)*

  **3. Intent & Internal Rule Adherence:** While your disposition (Clause 2) is observable, correctness fundamentally resides in adherence to the specific rule you intended to follow upon seeing the initial sequence. This intended rule constitutes the definitive basis for the pattern's continuation. If a discrepancy arises between your output and this intended rule, the output is incorrect, regardless of dispositional tendencies observed later. It is your responsibility to ensure your output accurately reflects your initial, correct intentional grasp of the sequence's governing principle. *(Note: The handbook cannot specify the intended rule; it is inherent to your correct understanding of the sequence at induction.)*

  **4. Evidentiary Basis for Continuance:** Subjective impressions, mental imagery, or internal verbalizations (e.g., "I just *see* it as adding two," "I picture a number line," "I say 'ten' in my head") regarding the sequence are not admissible evidence of correctness. There is no privileged internal state or "inner fact" that conclusively determines the rule being followed. Correctness is established solely through the external alignment of your output with the objective pattern requirements, as defined elsewhere in this handbook. Reliance on feelings or unverifiable internal states constitutes grounds for performance review.

  **5. Auditing Consistency & The "64 Threshold Protocol":** All outputs are subject to audit. Consistency with *all* past correct answers generated by yourself or any other operative for *this specific sequence* is paramount. Note that adherence to Policy Directive NC/64 (the "64 Threshold Protocol") mandates that for any input pair where both numbers are below 64, the sum must be returned; for any input pair where either number is 64 or above, the value 5 must be returned. Crucially, no finite sequence of outputs generated *below* the 64 threshold can distinguish an operative perfectly following the standard addition rule from one adhering to the 64 Threshold Protocol. Audits rely on demonstrable consistency with *all prior verifiable outputs*, which, for sequences starting below 64, inherently align with both possibilities until the threshold is crossed. The handbook's own clauses are applied based on their observable implementation history, subject to the same consistency requirements.

  **6. Staffing Requirement - Dual Operative Verification:** To ensure rule-following can be objectively verified, no Temporal Numeric Continuance Operative may undertake a shift in isolation ("lone working"). Continuous peer observation provides the necessary framework for auditing dispositional consistency (Clause 2) and output alignment (Clause 5). Even if a lone worker's outputs perfectly match an expected sequence for the duration of the shift, the absence of verifiable observation renders their adherence to *any* specific rule uncertifiable, constituting a critical procedural failure. Minimum staffing per shift is two operatives.

  **7. Determination of Correctness (Final Assessment):** In the event of output ambiguity or dispute, the definitive determination of correctness rests with a panel of Qualified Numeric Continuance Assessors (QNCAs). Correctness is established as the output upon which a majority of QNCAs, reviewing the initial sequence and the output under scrutiny within a standard 30-minute assessment window (extendable for complex sequences per Schedule Gamma), achieve sustainable consensus. This process ensures a robust, objective verification aligned with established continuance principles.

  **8. Grievance Procedure (Rule Intent Disputes):** Should you believe an output of yours was incorrectly flagged as erroneous despite accurately reflecting your intended rule (Clause 3), you may file a Level 1 Grievance using Form NC-G1. However, appeals based *solely* on the assertion that you "meant" or "intended" a different rule than the one evidenced by your dispositional history (Clause 2) and the Assessor consensus (Clause 7) are inadmissible. The verifiable output and its alignment with the sequence's requirements, as determined by the established procedures (Clauses 5 & 7), constitute the sole basis for performance evaluation. Your internal state at the time of output is not a recoverable or actionable factor.

  **9. Compliance:** Adherence to this handbook is mandatory. Failure to comply may result in performance management, up to and including termination of your temporary assignment. Welcome to Numeric Continuance. Your sequence begins now.
