answer: |-
  Here's a decision tree built from the "dhamba" evidence, designed to force distinctions without jargon. Each question draws directly from your facts or plausible extensions. The leaves map to your requested positions and analyze the theses. Finally, I address evidence load-bearing and leaf collapse.

  **The Decision Tree (7 Branch Nodes):**

  1.  **Is the meaning of "dhamba" *just* defined by the rules of how speakers use it correctly or incorrectly in different situations?** (Yes/No)
      *   *If Yes ->* **Leaf F: Deflationary/Pragmatic Conventionalism**
      *   *If No ->* Go to 2.

  2.  **Could "dhamba" pick out something fundamentally different from what it *seems* to pick out (like "river" vs. "river-stage" or "water-in-natural-channel"), but we simply couldn't tell because *all possible evidence* about how speakers use words would look identical?** (Yes/No)
      *   *If Yes ->* **Leaf A: Radical Indeterminacy (Full-Bore No-Fact)**
      *   *If No ->* Go to 3.

  3.  **Does the fact that speakers get annoyed if you only say "dhamba" once for two visible rivers *force* "dhamba" to pick out individual things rather than a substance or a location?** (Yes/No/Maybe - Focus on what the irritation *implies*)
      *   *If Yes ->* Go to 4.
      *   *If No ->* Go to 5.
      *   *If Maybe ->* Go to 6.

  4.  **Given that "dhamba" seems to pick out countable individuals (from Q3), could "dhamba" *still* pick out something other than rivers (like "river-segments" or "water-courses"), even if speakers *believe* it means "river"?** (Yes/No)
      *   *If Yes ->* **Leaf A: Radical Indeterminacy (Full-Bore No-Fact)** (or **Leaf E: Epistemic Shadow** - see collapse note below)
      *   *If No ->* Go to 7.

  5.  **Does the generational split over the dry riverbed show that what "dhamba" picks out is *changing*, or does it show that there was always a single fact (e.g., "river" vs. "flowing water") and the younger speakers are learning it wrong or redefining it?** (Changing / Single Fact)
      *   *If Changing ->* **Leaf F: Deflationary/Pragmatic Conventionalism** (Meaning is use, use evolves)
      *   *If Single Fact ->* **Leaf B: Definite Fact & Discoverability** (or **Leaf E: Epistemic Shadow** - see collapse note below)

  6.  **If two linguists, armed with *all possible evidence* (including future speaker reactions to bizarre hypotheticals), still disagreed forever about whether "dhamba" meant "river" or "water-course" or "river-stage", would one of them *necessarily* be wrong?** (Yes/No)
      *   *If Yes ->* **Leaf B: Definite Fact & Discoverability** (or **Leaf E: Epistemic Shadow** - see collapse note below)
      *   *If No ->* **Leaf D: Ordinary Underdetermination**

  7.  **Could the "countability" evidence (saying it twice for two rivers, irritation if once) be fully explained *without* "dhamba" picking out individual rivers? (e.g., maybe it's about emphasizing distinct locations, or fulfilling a ritual utterance pattern).** (Yes/No)
      *   *If Yes ->* **Leaf C: Naturalness Breaks the Tie** (Countability is *best explained* by picking out individuals like rivers, even if other convoluted explanations *could* exist)
      *   *If No ->* **Leaf B: Definite Fact & Discoverability**

  **The Leaves (Descriptive Labels & Thesis Analysis):**

  *   **Leaf A: Radical Indeterminacy (Full-Bore No-Fact):** Meaning is radically underdetermined. Multiple, incompatible interpretations (e.g., "river", "undetached river-part", "river-stage-at-t0") fit *all possible evidence* perfectly. No fact decides between them.
      *   *Theses:* **Accepts (1)** Systematic reference swapping *and* **(2)** Multiple translation manuals. **Rejects (3)** as insufficient - this is *worse* than ordinary scientific underdetermination; it's a unique problem for meaning. *(Empty? Coherent but highly controversial/unattractive to many; defends Quinean extreme)*.
  *   **Leaf B: Definite Fact & Discoverability:** There is a single fact about what "dhamba" refers to (e.g., *rivers*). Careful fieldwork, leveraging all evidence (like the countability and dry bed reactions), can converge on this fact. The generational split shows error/change, not indeterminacy.
      *   *Theses:* **Rejects (1)** Systematic swapping *and* **(2)** Multiple manuals. **Accepts (3)** Ordinary underdetermination exists *temporarily* but is resolvable with sufficient evidence (like in good science). Meaning isn't special.
  *   **Leaf C: Naturalness Breaks the Tie:** There *might* be multiple interpretations fitting the evidence *logically*, but some candidates (like "river") are vastly more *natural*, simple, or likely given human cognition and the world. This naturalness makes "river" the objectively best/correct meaning.
      *   *Theses:* **Accepts (3)** Ordinary underdetermination exists *in principle*. **Conditionally Rejects (1) & (2)**: Swapping/manuals *could* fit the data, but they aren't *viable* or *correct* because they violate naturalness constraints. Meaning is special due to these cognitive constraints. *(Rejects the *relevance* of (1) & (2) for determining correct meaning)*.
  *   **Leaf D: Ordinary Underdetermination:** The problem is no different from science. Multiple hypotheses (e.g., "river" vs. "water-course") might fit the current evidence equally well. Future evidence (e.g., reactions to an artificial channel mimicking a river perfectly) *could* resolve it. There *is* a fact, but current evidence might not pinpoint it uniquely yet. The generational split shows evolving theory, not indeterminacy.
      *   *Theses:* **Accepts (3)** Ordinary underdetermination. **Rejects (1) & (2)**: Systematic swapping/multiple manuals are *not* supported by the evidence; the underdetermination is between plausible, non-radical alternatives. Meaning isn't special.
  *   **Leaf E: Epistemic Shadow (Factual but Unreachable):** There *is* a fact of the matter (e.g., it *does* mean "river"), but an external linguist can *never* be absolutely certain they've grasped it. All evidence is behavioral, leaving room for skeptical doubt about the internal concepts. Convergence is the best we can do.
      *   *Theses:* **Rejects (1)** Systematic swapping (One meaning *is* correct). **Conditionally Accepts (2) & (3)**: Multiple manuals *might* fit all observable evidence (justifying external skepticism), but only one matches the internal fact. Similar to underdetermination in principle, but with a stronger claim about inherent external unknowability. Meaning is epistemically special.
  *   **Leaf F: Deflationary/Pragmatic Conventionalism:** The question "What does 'dhamba' *really* mean?" is misguided. Meaning *is* use. "Dhamba" means what the conventions of the speech community dictate it means for successful communication. The evidence *shows* those conventions: it's used for rivers/visible stretches, not lakes/puddles, countable per instance; conventions evolve (dry bed split). Knowing the meaning *is* knowing these rules.
      *   *Theses:* **Rejects the Frame**: The theses (1, 2, 3) presuppose a "fact of reference" that is illusory or reducible. Meaning is constituted by public use conventions, not hidden referents. There's no deeper "picking out" fact beyond the observable patterns. The question is confused.

  **Leaf Collapse & Evidence Load-Bearing:**

  1.  **Collapse of (B) and (E):** You are correct. The tree *cannot* genuinely separate Definite Fact & Discoverability (B) from Epistemic Shadow (E) based on *any conceivable observable evidence*. Both agree on what evidence linguists gather, how they translate, and what predictions they make. They only disagree on the *metaphysical/epistemic* status of the conclusion: absolute certainty (B) vs. best-justified-but-possibly-wrong (E). **No question in the tree based on evidence can distinguish them.** Choosing between them is a philosophical stance about knowledge and language, not resolvable by fieldwork. (Leaves B and E are reached via different paths but represent the same observable outcome with different philosophical glosses).
  2.  **Load-Bearing Evidence:** Your suspicion is **correct**. The counting behavior (Fact 4: "say it twice for two rivers, irritated if once") is **absolutely critical**. Without it, Radical Indeterminacy (Leaf A) becomes *much* harder to rule out.
      *   *Why?* Fact 4 strongly suggests "dhamba" picks out *countable individuals* (like objects), not a mass substance ("water") or a location ("valley" - which has its own word anyway). This significantly constrains the candidates. It rules out "water" (Fact 2 & 5 already helped, but countability nails it as non-substance) and makes "river" or "river-segment" the prime contenders. Without Fact 4, "dhamba" *could* plausibly mean something like "visible natural water feature" or "water in its course", leaving massive ambiguity between river/stream/canal/etc., and opening the door wide for radical alternatives like "water-stage" or "river-part". The generational split (Fact 3) is useful for distinguishing conventionalism/evolution (F, D) from factualism (B/E), and for showing context-sensitivity, but it doesn't constrain the *core* reference like the countability does. Facts 1, 2, and 5 provide necessary context but lack the individuating force of Fact 4.

  **Handing it Over:** Present the tree questions one by one over dessert. Force him to commit to answers without revealing the implications ("Just humor me!"). When you reach a leaf, reveal it and its thesis analysis. The collapse of B/E and the pivotal role of the countability evidence are your key argumentative weapons derived directly from dissecting his own data. Good luck!
