answer: |-
  ## Analysis of Blamer Standing: Beyond Hypocrisy

  **Brainstorm: Core Cases Any Theory Must Capture**
  1.  **The Reformed Acknowledger (Your Case):** Long history of violating N, now reformed, openly acknowledges past wrongs. *Should likely have standing.*
  2.  **The Unrepentant Practitioner:** Actively violates N (smokes), blames another (child) for violating N, accepts N binds them *in theory* but has no intent to comply. *Should likely lack standing.*
  3.  **The Weak-Willed Guilt-Accepter:** Believes in N, feels guilt for violating it, would accept blame directed at them, but fails to reform. *Should likely have standing, or at least more than the Unrepentant Practitioner.*
  4.  **The Status-Hypocrite:** Scrupulously complies with N (punctuality), blames subordinates for violating N, but explicitly rejects that N binds *them* (blamer) in the same way. *Should clearly lack standing despite compliance.*
  5.  **The Institutional Double Standard (AI):** Institution blames group A (students) for violating norm N (no AI writing), while its own agents (admissions) violate N *in a relevantly similar context* (using AI for core communication). *Distinguish: Standing to blame (address wrongness) vs. Standing to impose formal penalty.*

  **Verdict & Analysis**

  Neither the Clean Hands principle nor the Symmetric Address principle adequately handles the full range of cases. The **Symmetric Address principle is closer to the truth but requires significant refinement**. The core function of blame reveals why both are incomplete and points towards a superior hybrid view: **Functional Address**.

  **Critique of the Principles:**

  1.  **Clean Hands Principle (CHP):** This fails decisively in two directions:
      *   **The Status-Hypocrite (Case 4):** The manager has "clean hands" regarding punctuality. She complies. Yet, her explicit rejection that the norm binds *her* symmetrically means her blame is not an appeal to shared normative commitment; it's an assertion of power. CHP incorrectly grants her standing. Her blame is illegitimate because she refuses the reciprocity the norm implicitly demands.
      *   **The Weak-Willed Guilt-Accepter (Case 3):** CHP denies standing because this person hasn't "repaired" their violation (quit smoking). Yet, their genuine acceptance of the norm and willingness to accept blame *themselves* suggests their admonition to others isn't hypocritical in the sense that undermines moral address. They aren't exempting themselves; they are failing, painfully. CHP is too harsh here. Conversely, CHP *might* grant standing to the Status-Hypocrite who complies but rejects reciprocity – which is wrong.

  2.  **Symmetric Address Principle (SAP):** This handles some crucial cases CHP botches:
      *   **The Status-Hypocrite (Case 4):** SAP correctly denies standing because the manager explicitly rejects that N binds her symmetrically. Her blame is performatively inconsistent.
      *   **The Weak-Willed Guilt-Accepter (Case 3):** SAP correctly grants standing. They accept the norm binds them fully and would accept blame directed at them. Their weakness doesn't negate their sincere commitment to the norm's validity for everyone, including themselves.
      *   **The Unrepentant Practitioner (Case 2 - Partial Failure):** SAP *incorrectly grants standing*. While the parent *says* they accept N binds them and *might* theoretically accept blame, their *ongoing, unrepentant violation* fundamentally undermines their standing. Their blame rings hollow. Demanding their child comply while they actively flout the norm *themselves* treats the child differently without justification. It’s not just weakness; it’s a refusal to align conduct with professed belief, making their "acceptance" of the norm's binding force seem disingenuous or unserious in the context of issuing blame. SAP overlooks the dissonance between *current, intentional action* and professed belief when *issuing demands to others*.

  **The Hybrid View: Functional Address**

  Blame, at its core in interpersonal contexts, is a form of **moral address**. Its primary function is not merely to point out wrongness abstractly, but to **demand acknowledgment from the wrongdoer that a legitimate norm was violated and that their action constituted a failure to meet a demand implicit in the relationship or shared moral space.** The blamer acts *as a representative* of the norm.

  Therefore, **a blamer lacks standing to blame if their own current normative stance or conduct makes it impossible for them to issue this demand for acknowledgment without performative contradiction.** Standing depends on the blamer’s ability to coherently perform this specific function of blame.

  **Conditions for Standing (Functional Address):**
  1.  **Normative Commitment:** The blamer must genuinely accept the norm N as binding *on themselves* in the same way it binds the blamee. (Captures SAP's strength, rules out Status-Hypocrite).
  2.  **Non-Exemption:** The blamer must not currently hold themselves as *exempt* from the demands of N *in the relevant context*. This exemption can be *practical* (ongoing, unrepentant violation while blaming) or *theoretical* (explicitly denying reciprocity).
  3.  **Coherent Demand:** The blamer’s *current* actions and stance must not fundamentally contradict the demand they are making of the blamee. Issuing a demand for compliance/acknowledgment while *simultaneously* and *intentionally* flouting that demand oneself is incoherent.

  **Application to Cases:**

  1.  **Your Case (Reformed Acknowledger):** You meet all conditions. (1) You accept N binds you (you quit, acknowledge past wrong). (2) You hold yourself subject to N *now* (you don't vape). (3) Your demand ("Don't vape, it's harmful/wrong") is coherent – you aren't currently violating the norm you preach. **You have standing.** Your brother’s tu quoque fails because your past violation, *once acknowledged and repented*, doesn’t contradict your *current* demand. Repair restores coherence.
  2.  **Unrepentant Practitioner:** Fails conditions (2) & (3). (1) They *might* accept N binds them *in theory*. BUT (2) They *currently* exempt themselves *in practice* by continuing to smoke without repentance. (3) Demanding their child abstain while they actively smoke is a performative contradiction – they demand compliance they refuse to give. **Lacks standing.**
  3.  **Weak-Willed Guilt-Accepter:** Meets all conditions. (1) Accepts N binds them. (2) Holds themselves subject to N (feels guilt, accepts blame – no exemption claimed). (3) While their *compliance* is weak, their *demand* ("This is wrong, don't do it") isn't contradicted by their *stance* (guilt, acceptance of blame). Their struggle doesn't negate the legitimacy of the demand they make of others from within the shared normative space. **Has standing.**
  4.  **Status-Hypocrite:** Fails conditions (1) & (2). (1) They reject that N binds them symmetrically. (2) They explicitly exempt themselves ("rules run downward"). (3) Their demand for punctuality is incoherent because it denies the reciprocity the norm of punctuality inherently implies in a cooperative endeavor like work. **Lacks standing.**
  5.  **Institutional Double Standard (AI):**
      *   **Standing to Blame (Address Wrongness):** The university likely **lacks standing**. Applying Functional Address: (1) Does the *institution*, through its agents (admissions), accept N binds *it* in relevantly similar contexts? Using AI for outreach while condemning it for students suggests not. (2) It exempts its own core functions from N. (3) The demand ("AI writing violates academic integrity") is contradicted by its own use of AI for institutionally significant communication. This creates performative incoherence.
      *   **Standing to Impose Formal Penalty:** This is distinct. Standing here might depend on institutional rules, due process, and whether the penalty serves legitimate institutional goals (e.g., ensuring student learning outcomes) *despite* the university's own questionable conduct. The Functional Address principle primarily concerns the *moral legitimacy of the address itself*, not necessarily the legal or procedural validity of sanctions, though hypocrisy can undermine the perceived fairness of sanctions.

  **Conclusion:**

  The **Functional Address** view, focusing on the core function of blame as a demand for normative acknowledgment and the conditions for issuing that demand coherently, successfully subsumes the insights of the Symmetric Address principle while correcting its failure regarding the Unrepentant Practitioner. It decisively rejects the Clean Hands principle's over-reliance on past compliance/repair and its blindness to the Status-Hypocrite. Your standing to address your brother is restored because your acknowledgment and reform allow you to coherently demand acknowledgment of the norm's force from him without contradiction. His tu quoque only holds water against an unrepentant or exempting blamer, which you are not.
