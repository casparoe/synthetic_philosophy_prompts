prompt: |-
  I direct a small municipal archive in a city of about ninety thousand, and I came to the job from a history PhD rather than from an archives program. My staff is me, one part-time technician, and a rotating set of volunteers; we get thirty to forty offers of material a year and can properly process perhaps eight of them; we are moving buildings in eighteen months and have been told to plan on leaving behind roughly a third of what we hold. Our existing holdings are what you would expect from a city that grew around a rail yard: deeds and plat maps, tax assessor rolls, council minutes and departmental correspondence, the papers of two founding families. The people who make up most of the city now — renters, recent immigrants, a large Ghanaian Pentecostal congregation, the families who pass through the housing court — appear in those papers almost entirely as entries someone else generated: a name on a summons, a line in a ledger, a photograph taken from the sidewalk. I take the point that archives are not neutral and that the shape of a collection is an effect of power rather than a residue of chance. What I cannot work out is what follows from that on a Tuesday morning, when a box is on the table and I have perhaps half a day to decide whether it comes in, and how it gets described if it does.

  What I want is a written procedure my team can actually run, not a set of principles. It should cover appraisal (do we take it, do we decline, do we take it with conditions, and when do we take only a description of it rather than the thing itself) and description (what we are obliged to say about a collection in the finding aid beyond what it contains). The part I care most about is that it should treat gaps as objects to be documented rather than lamented: I want my staff to be able to distinguish, in a repeatable way, a silence that was never created from one that was destroyed, from one that survives somewhere we cannot find it, from one that exists in a form or language we cannot render, from one we ourselves are creating right now by declining or deferring; and I want each of those to have its own test, its own standard of evidence, and its own line in the catalogue record — call it a silence note — written in language a twenty-year-old volunteer can apply to a box without a seminar in theory. I also want the procedure to say, explicitly, where it stops with a no, and where it must stop and hand the question to our community advisory panel because the issue is one of values rather than of fact. Two further wrinkles: the archive's own paperwork (retention schedules, destruction logs, the files of past refusals) is itself a record of the archive's silences, and I want to know whether the procedure should capture that; and one of my board members has proposed that we simply correct the imbalance by actively collecting from under-recorded communities, which I half suspect reproduces the same asymmetry in a friendlier voice, since the material would still enter on our terms, under our description, in our building. Please commit on that dispute rather than describing both sides.

  Then run the procedure, at whatever length is needed, on three real-shaped cases. First: the records of a property management company, 1974 to 2003 — eviction files, rent ledgers, maintenance complaints, a few photographs — in which tenants appear only as defendants, debtors and complainants, offered to us by the founder's daughter on the condition that the reading room be named for her father. Second: a box of maybe two hundred audio cassettes from that Ghanaian congregation, services, counselling sessions and committee meetings from 1989 to 2004, donated by a departing pastor without the knowledge of anyone recorded on them, in a language none of my staff speaks, and including discussions of congregants' immigration status. Third: the papers of a long-serving city councillor, forty linear feet, offered with a small cash endowment attached, which would consume essentially all of our processing capacity for the next year and would fit our existing holdings perfectly. I expect the procedure to give me an answer I dislike in at least one of these; give it to me anyway and say so. Where you are making a judgment call dressed up as a step, mark it as one; and commit to the rule you would actually adopt and why, rather than laying out the menu and leaving me to choose — including, at the end, an honest note on what this procedure cannot do, and which of your steps you would be least surprised to find yourself revising in three years.
reasoning: |-
  Hmm, the user runs a small municipal archive in a city of 90,000 people and is struggling with practical decision-making about what materials to accept and how to process them. They're a historian by training without formal archival education, working with limited staff and resources. They specifically want a concrete procedure for appraisal and description that helps document archival silences systematically.

  The user outlines several key challenges: They receive 30-40 donation offers annually but can only process about 8. They're facing a move where they must leave behind a third of their holdings. Their current collections reflect power imbalances - focusing on founders and officials while marginalizing renters, immigrants, and minority communities who appear only through bureaucratic records. They want to move beyond theoretical discussions of archival bias to practical tools.

  Their specific requests for the procedure include:
  - Distinguishing different types of silences with clear tests and cataloging methods
  - Creating "silence notes" that volunteers can apply
  - Defining clear "no" decisions versus when to refer to community advisors
  - Handling the archive's own administrative records as evidence of silences
  - Addressing a board member's proposal about "corrective collecting"

  They want this tested against three real cases: property management records with naming contingency, Ghanaian congregation tapes with privacy issues, and councilor papers that would monopolize processing capacity. They specifically want uncomfortable answers and honesty about limitations.

  The user's deeper needs appear to be:
  - Operationalizing critical archival theory within severe constraints
  - Creating accountable documentation of power dynamics
  - Protecting vulnerable communities in appraisal decisions
  - Maintaining professional integrity while under resourced
  - Preparing for difficult collection reduction during their move

  I'm impressed by how they articulate the tension between theoretical awareness ("archives are not neutral") and daily practice ("what follows on a Tuesday morning"). Their focus on documenting silences as tangible objects rather than abstract concepts is particularly insightful. The "silence note" concept could be valuable for the profession broadly.

  For the procedure design, I need to balance:
  - Practicality for volunteers
  - Theoretical rigor
  - Ethical obligations
  - Resource limitations
  - Community accountability

  The three test cases represent classic archival dilemmas: donor restrictions vs ethics (property records), privacy vs representation (tapes), and resource allocation vs collection coherence (council papers). The Ghanaian tapes case is especially complex with its language barriers and immigration status concerns.

  Regarding the board member's "corrective collecting" proposal, I agree with the user's suspicion that this might recreate power imbalances. True equity would require shifting control over description, access, and physical custody - which their current model doesn't support. Community partnerships would be better than unilateral collecting.

  For limitations, I should acknowledge that:
  - No procedure can eliminate power differentials
  - Silence documentation depends on available evidence
  - Community input mechanisms have their own biases
  - Resource constraints force painful triage
  - Language/cultural barriers can't be fully overcome by documentation alone

  The procedure will need clear flowcharts and decision trees to be usable by volunteers. The "silence typology" must be concrete enough for application without theoretical training. Referral thresholds to the community panel need specific triggers.
answer: |-
  Below is a practical, step-by-step procedure for appraisal and description designed for your constraints. It prioritizes **documenting silences systematically** while providing clear decision thresholds. The procedure uses defined tests, standardized "silence notes," and explicit handoffs to your community advisory panel. It also addresses your core concerns about power asymmetry and institutional self-documentation.

  ---

  ### **ARCHIVAL DECISION PROCEDURE: APPRAISAL & DESCRIPTION**
  **Goal:** To accept, reject, or conditionally accept offered materials in ≤4 hours/box, documenting gaps as actively as content.

  #### **I. APPRAISAL DECISION TREE (Do we take it?)**
  *Complete all steps in order; stop at first "No" or "Refer."*

  1. **LEGAL & ETHICAL RISK SCREEN (10 min)**  
     - ☑ **Test:** Does the material contain restricted data (e.g., medical, immigration, under-18 identities)?  
     - ☑ **Evidence:** Spot-check 5% of items or 20 items (whichever is smaller).  
     - ☑ **Decision:**  
       - **Yes** → Refer to Community Advisory Panel (CAP) *immediately*.  
       - **No** → Proceed to Step 2.  
     - ☑ **Silence Note Trigger:** None (risk takes precedence).

  2. **RESOURCE CHECK (15 min)**  
     - ☑ **Test:** Can we physically store it post-move (using space allocation formula)?  
     - ☑ **Evidence:** Measure box(es); apply cubic-foot limit per new building plan.  
     - ☑ **Decision:**  
       - **No space** → Decline. Add **Silence Note Type 5** (created by current refusal).  
       - **Space** → Proceed to Step 3.

  3. **SILENCE AUDIT (60 min)**  
     - ☐ **Test 1: Was silence intentionally created?** (e.g., records never made).  
       - *Evidence:* Donor interview notes; absence in govt. indexes; gaps in date runs.  
     - ☐ **Test 2: Was silence due to destruction?** (e.g., records lost/discarded).  
       - *Evidence:* Donor testimony; shred marks; references in other collections.  
     - ☐ **Test 3: Does silence exist elsewhere?** (e.g., held privately/elsewhere).  
       - *Evidence:* Online catalog searches; local historical society consultations.  
     - ☐ **Test 4: Is silence due to access barriers?** (e.g., language/format).  
       - *Evidence:* Language identification; playback equipment check.  
     - ☑ **Decision:**  
       - Any Test 1–4 confirmed → **Conditionally accept** *with required Silence Notes*.  
       - All negative → Proceed to Step 4.  

  4. **COMMUNITY VALUE ASSESSMENT (45 min)**  
     - ☑ **Test:** Does this material counteract an identified gap in *lived experience* (not just demographics)?  
     - ☑ **Evidence:** CAP’s priority list; cross-check against holdings (e.g., "Do we have tenant voices?").  
     - ☑ **Decision:**  
       - **Fills documented gap** → Accept.  
       - **Amplifies existing power imbalance** → Decline. Add **Silence Note Type 5**.  
       - **Unclear/Disputed** → Refer to CAP.  

  5. **DONOR TERMS REVIEW (20 min)**  
     - ☑ **Test:** Are donor conditions (e.g., naming rights) feasible and ethical?  
     - ☑ **Evidence:** Written donor agreement; CAP ethics guidelines.  
     - ☑ **Decision:**  
       - **Unacceptable term** → Decline or renegotiate. If decline, add **Silence Note Type 5**.  
       - **No terms/Acceptable** → Accept.  

  ---

  #### **II. DESCRIPTION PROTOCOL (How do we catalog it?)**
  - **Mandatory Fields:** Title, Date Range, Physical Extent, Creator.  
  - **Silence Notes (Required if Tests 1–4 triggered in Step 3):**  
    > **Type 1 (Never Created):** "No known records exist from [group/event] during [dates]."  
    > **Type 2 (Destroyed):** "[Donor/entity] confirmed destruction of [specific records] in [year]."  
    > **Type 3 (Held Elsewhere):** "[Group] may hold related materials; contact [entity]."  
    > **Type 4 (Access Barrier):** "Material in [language/format]; unprocessed due to [barrier]."  
    > **Type 5 (Created by Us):** "Declined [date]; reason: [e.g., reinforces imbalance]."  
  - **Admin Records:** Log all refusals/deferrals in "Gap Register" (linked to Silence Note 5).

  ---

  #### **III. COMMUNITY ADVISORY PANEL (CAP) REFERRAL TRIGGERS**
  Refer *immediately* if:  
  - Step 1 (Legal/Ethical Risk) is triggered.  
  - Step 3 (Silence Audit) reveals Test 4 (Access Barrier) *and* material is high-priority.  
  - Step 4 (Community Value) is disputed.  
  - Donor terms (Step 5) conflict with CAP ethics guidelines.  

  ---

  ### **COMMENT ON "CORRECTIVE COLLECTING" DISPUTE**
  **Your suspicion is valid.** Actively collecting from under-documented groups *without ceding control* replicates asymmetry. **Adopt this rule:** Only collect directly from communities if partnered with a trusted community entity (e.g., the Ghanaian church council) that co-owns descriptive metadata and access rules. Otherwise, focus on **enabling community self-documentation** (e.g., providing storage for their independent archive). Refuse "friendly extraction."

  ---

  ### **APPLICATION TO TEST CASES**
  #### **Case 1: Property Management Records (1974–2003)**  
  - **Step 1:** Eviction files likely contain restricted data (tenant SSNs, court records). → **REFER TO CAP.**  
  - **Silence Notes:** Type 1 (Tenant perspectives never created). Type 5 if declined.  
  - **CAP Input Required:** Can redaction resolve risks? Is naming demand ethical?  
  - **Your Likely Discomfort:** If CAP accepts conditional on naming, but procedure forces ethical scrutiny.  

  #### **Case 2: Ghanaian Congregation Tapes (1989–2004)**  
  - **Step 1:** Immigration status + counseling sessions = high risk. **REFER TO CAP.**  
  - **Step 3:** Test 4 (Language barrier); Test 2 (Donor lacked authority; possible destruction of consent forms).  
  - **Silence Notes:** Type 4 (Untranslated Twi); Type 2 (If consent destroyed); Type 5 if declined.  
  - **CAP Input Required:** Does congregation want this preserved? Who can translate/redact?  
  - **Procedure Mandate:** **Decline if CAP cannot secure congregation’s partnership.** Silence Note 5: "Declined to avoid non-consensual preservation."  

  #### **Case 3: City Councillor Papers (40 linear ft + endowment)**  
  - **Step 2:** Exceeds ⅓ post-move space allocation → **DECLINE.**  
  - **Step 4:** Reinforces power imbalance (founder families already overrepresented).  
  - **Silence Notes:** Type 5: "Declined [date]; resource allocation + reinforces existing gap in community voices."  
  - **Your Discomfort:** Turning down cash and "easy" processing. Procedure prioritizes space/equity over convenience.  

  ---

  ### **HONEST ASSESSMENT OF LIMITATIONS & FUTURE REVISIONS**  
  **What This Procedure Cannot Do:**  
  - Eliminate power imbalances in preservation; only make them visible.  
  - Overcome language/format barriers without community partners.  
  - Solve resource shortages; it triages, but doesn’t create capacity.  

  **Steps Most Likely to Change in 3 Years:**  
  1. **Step 3 (Silence Audit):** May need finer categories (e.g., separating "suppressed" from "never created").  
  2. **CAP Referral Triggers:** Over-referral may overwhelm CAP; may need staff pre-screening.  
  3. **Corrective Collecting Rule:** If community partnerships prove unworkable, may revert to Type 5 documentation only.  

  **Why Commit to This Now?** It forces explicit choices about *which* silences you sustain, and centers transparency in scarcity. It won’t fix everything, but it will turn "Tuesday morning" decisions into accountable acts of witness.
