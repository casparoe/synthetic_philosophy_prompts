  For execution: the rotating end-words must include four stable terms (e.g., weight, ash, flame, measure) and two shifting kind-terms (air, earth). The magic lies in the reader feeling the shift organically through repetition. The envoi's three-line crunch should shimmer with equivocation—truth split between paradigms.

  *Selecting end-words:*  
  Stable anchors: weight, ash, flame, measure (procedural continuity)  
  Volatile terms: air, earth (taxonomic upheaval)  
  "Calx" could replace "ash," but "ash" feels more visceral. "Earth" covers solids broadly.

  *Structural strategy:*  
  Stanza 1: Phlogiston-era clarity. "Air" as passive medium, "earth" as residue.  
  Stanzas 2-5: Unease builds. "Air" acquires agency; "earth" destabilizes.  
  Stanza 6: New chemistry's logic—but haunted.  
  Envoi: The scientist's double vision. "This weight" belongs to both worlds; "measure" can't resolve it.

  *Key images:*  
  - Flame dimming/gaining "weight"  
  - Vessels holding contradictory truths  
  - Ash/calx as both dead and transformed  

  The envoi's "true sentence" must hold incompatible truths: "Grows in the air" (oxygen) vs. "lives in the flame" (phlogiston release). The beauty is the tension itself.  

  User's depth impresses me. They don't want references—they want the *feel* of incommensurability in the gut. This poem must be a silent manifesto.
answer: |-
  The vessel holds the measure of the flame.
  The ash remains, a weight upon the scale.
  The earth is fixed, a truth beyond dispute.
  But watch the air: it thickens, holds a charge.
  The careful hand records the solid weight.
  What leaves the metal? Nothing? Then this ash?

  A brighter burn consumes the stubborn ash.
  The vessel glows with more than simple flame.
  A new proportion alters every weight.
  We seek the law that governs every scale.
  This subtle shift, this newly sensed charge,
  Disturbs the stillness of accepted earth.

  What was inert, mere substance of the earth,
  Now breathes a change where once lay settled ash.
  This unseen force, this elemental charge,
  Transforms the nature of the vital flame.
  Experience demands a broader scale,
  Rejecting what the old reports call weight.

  Observe the metal lose its former weight.
  Released from bondage to the passive earth,
  The calx reverts beneath the ardent flame.
  New numbers crowd the finely graven scale.
  What principle accounts for this new charge?
  What vanished substance left behind this ash?

  The vanished thing departs, becomes the ash.
  The metal yields, accepting lessened weight.
  The air itself now bears the vital charge,
  No longer void above the waiting earth.
  The vessel's heat demands a stricter scale.
  What feeds the fierce, consuming, hungry flame?

  Is fire itself the source? Or does the flame
  Draw sustenance from air, not leave mere ash?
  The balance trembles on the fragile scale.
  The answer hangs upon a point of weight,
  A shift within the concept of the earth,
  A meaning changed, a redirected charge.

  This weight of proof, this slowly shifting charge,
  Reshapes the world beneath the constant flame.
  The old earth crumbles, yielding to the air.
  The stubborn ash speaks volumes on the scale.
  The measure holds, though meanings slide like earth.
  The vessel holds the measure of the flame.

  The air grows thick. This weight the scale assigns
  Lives in the flame, escapes the crumbling earth.
  The ash retains its charge.
