prompt: |-
  I convene a final-year seminar in practical ethics, and for the session on how one ought to choose between causes — whether to devote a career, or a grant budget, to this rather than that — I want the students to build the specification before I show them a single existing framework. So please write me the desiderata. Fix the purpose first, and say what you are fixing it as: I have in mind a small charitable foundation with a fixed annual budget, a ten-year spending horizon, no capacity to run experiments or to wait for feedback before committing money, and a board of trustees who disagree with one another about population ethics, about whether future benefits may be discounted, and about how much weight to give to risks of civilisational collapse. Write the list of requirements any framework for prioritising causes would have to meet to count as adequate for that decision-maker: the cases it must get right, the distinctions it must not collapse, the results from decision theory or economics it must not contradict — with the concrete case or consideration behind each requirement, since I want the criteria motivated by examples rather than by slogans.

  Here are the candidates I have been circling in my own notes, which may or may not all be genuine desiderata; tell me which are and which are merely the prejudices of one camp. (i) That the framework score grants or actions at the margin rather than causes in the aggregate, because a problem can be enormous and badly neglected in total whilst the thousandth pound into it buys almost nothing, given limits on how fast an organisation or a field can absorb money. (ii) That it be invariant to how finely the cause space is carved: lumping sub-causes together or splitting one cause into several must not reorder the ranking, and a framework whose output improves when you redraw a cause's boundaries is being gamed rather than consulted. (iii) That its factors be genuinely independent, so that combining them — by multiplication or otherwise — does not count the same consideration twice; I strongly suspect that "neglectedness" and "tractability" both smuggle in something about diminishing marginal returns. (iv) That it credit counterfactual impact honestly: funging, crowding out, and the difference between bringing an outcome about and merely occupying a role someone else would have filled. (v) That it assign value to buying information — pilots, research, capacity-building — and not only to intervening directly, which seems to require handling option value and the value of resolving the board's own disagreements. (vi) That it remain usable under moral uncertainty and cluelessness, neither demanding spurious precision about long-run effects nor collapsing into a refusal to rank anything at all. (vii) That it cope with interaction between causes, complementarities as well as substitutability, so that two middling causes pursued together can beat the top-ranked cause pursued alone. (viii) That it be legible and adoptable by trustees who are not expected-value maximisers, and robust to their attempts to steer it towards causes they antecedently favour. Mark each as non-negotiable or as a preference of a particular camp, and add any requirement I have missed that you think belongs on the list.

  The part I most want, though, is the diagnosis of the list itself. Flag any subset of the desiderata you think cannot be jointly satisfied — in particular, say whether carving-invariance, sensitivity to interaction between causes, and marginal-unit scoring can be had together at all in a framework that outputs a single ranking, and whether the demand for a complete ordering of causes is even compatible with taking moral uncertainty seriously rather than merely averaging over it. Then tell me which single requirement does the most work in excluding candidate frameworks, and why. Finish with a short scorecard, a few lines each and no more: the familiar three-factor multiplicative framework that scores causes by how important, how tractable and how neglected they are; straightforward expected cost-effectiveness estimation with explicit probabilities; and a portfolio or "hits-based" approach that spreads bets across many causes. I shall use the scorecard only to provoke discussion, so keep the weight on the criteria.
reasoning: |-
  Okay, the user is convening a final-year seminar on practical ethics and wants students to build a specification for prioritizing causes before introducing existing frameworks. The scenario involves a small charitable foundation with specific constraints: fixed annual budget, ten-year horizon, no capacity for experiments or feedback, and a divided board. The user provided eight candidate desiderata and wants them evaluated for necessity, plus any missing requirements.

  First, I need to unpack the foundation's operational constraints. The fixed budget and inability to wait for feedback mean the framework must make upfront decisions without iteration. Trustee disagreements on population ethics, discounting, and collapse risks mean the framework must handle deep moral uncertainty without requiring consensus. The ten-year horizon adds time pressure but avoids perpetual discounting debates.

  Looking at the user's eight points:
  (i) Marginal scoring is non-negotiable due to diminishing returns - e.g., pouring more into a saturated malaria bednet program.
  (ii) Carving invariance seems essential to prevent gaming - like splitting "education" into sub-causes to manipulate rankings.
  (iii) Factor independence is tricky - neglectedness and tractability both relate to diminishing returns, so this might be more aspirational than achievable.
  (iv) Counterfactual honesty is crucial - e.g., funding a project that would've happened anyway wastes money.
  (v) Valuing information is key given the no-feedback constraint - pilots build future options.
  (vi) Moral uncertainty/cluelessness handling is vital with the divided board - can't demand false precision about long-term effects.
  (vii) Interaction sensitivity is important but challenging with ranking - e.g., climate policy + tech innovation together beat either alone.
  (viii) Legibility/robustness is non-negotiable - trustees need to trust the process.

  The key tension is between carving invariance, interaction sensitivity, and marginal scoring. A single ranking struggles with interactions - e.g., cause A+B > A alone might require abandoning ranked lists for portfolio approaches. Moral uncertainty also conflicts with complete orderings; averaging views may hide legitimate disagreements.

  Biggest framework-killer is likely counterfactual honesty - many frameworks ignore displacement effects or funging. Also, the no-feedback constraint makes iterative methods impossible, ruling out adaptive frameworks.

  For missing requirements: I should add time sensitivity (10-year horizon), irreversibility (no backtracking), and clear stopping rules (when to abandon causes).

  For the scorecard:
  The three-factor framework (ITN) fails carving invariance and counterfactuals - tractability/neglectedness overlap, and it ignores displacement.
  Expected cost-effectiveness struggles with cluelessness and moral uncertainty - requires precise probability estimates trustees disagree on.
  Portfolio approaches handle uncertainty and interactions well but violate single ranking and legibility - trustees may resist "spray and pray."

  The core insight is that the foundation's constraints create incompatible demands: they need robustness to disagreement without iterative learning, which forces trade-offs between theoretical purity and practical usability.
answer: |-
  Below is a structured response with **desiderata** for your foundation's prioritization framework, followed by **diagnosis of tensions**, **key exclusions**, and a **scorecard** of existing approaches. Desiderata are classified as **non-negotiable** (essential given constraints) or **camp-specific** (reflects philosophical biases). Concrete cases motivate each.

  ---

  ### **Desiderata for the Framework**  
  **Fixed Purpose**: *To allocate a fixed annual budget across causes under a 10-year horizon, with no feedback loops, irreversible commitments, and trustee moral disagreement.*  

  1.  **Marginal-Unit Scoring (Non-negotiable)**  
      *Case*: Funding the 10,000th bednet in a saturated malaria program yields minimal health gains vs. the first bednet in a novel parasite outbreak. Aggregate cause size (e.g., "malaria kills millions") ignores absorptive capacity.  
      *Requirement*: Score *additional* £ spent, not whole causes.  

  2.  **Carving Invariance (Non-negotiable)**  
      *Case*: Ranking "global poverty" below "climate change," but splitting poverty into "rural electrification" and "urban sanitation" reorders priorities due to arbitrary granularity. Invites gaming.  
      *Requirement*: Rankings must be stable under cause redefinition.  

  3.  **Factor Independence (Camp-Specific)**  
      *Case*: "Neglectedness" (few funders) and "tractability" (low cost per outcome) both capture diminishing returns; multiplying them double-counts this effect.  
      *Requirement*: Factors (e.g., scale, tractability) must be orthogonal to avoid inflation.  
      *Diagnosis*: Reflects a precision-camp bias; non-negotiable only if multiplicative aggregation is used.  

  4.  **Counterfactual Honesty (Non-negotiable)**  
      *Case*: Funding a hospital others would have built anyway (zero impact) vs. funding a unique vaccine trial. Must account for crowding out, funging (displacement), and additionality.  
      *Requirement*: Quantify net impact after displacement/alternatives.  

  5.  **Value of Information (VoI) (Non-negotiable)**  
      *Case*: A £50k pilot study on AI alignment could resolve board disputes or reveal high-impact interventions. With no feedback pre-commitment, ignoring VoI wastes the 10-year horizon.  
      *Requirement*: Incorporate option value of learning (e.g., pilots, research).  

  6.  **Moral Uncertainty & Cluelessness Tolerance (Non-negotiable)**  
      *Case*: Trustees disagree on discounting future lives (e.g., climate). A framework demanding precise 100-year impact estimates ignores their epistemic limitations.  
      *Requirement*: Output rankings under unresolved disagreement; avoid false precision.  

  7.  **Interaction Sensitivity (Camp-Specific)**  
      *Case*: Anti-corruption reforms (cause A) boost education spending effectiveness (cause B). Pursuing only the "top" cause (A) misses synergies.  
      *Requirement*: Capture complementarities/substitutions.  
      *Diagnosis*: Reflects systems-thinking camp; conflicts with single-cause rankings.  

  8.  **Legibility & Robustness (Non-negotiable)**  
      *Case*: A trustee favoring "arts education" shouldn’t game the model by tweaking weights. Framework must be transparent and resistant to manipulation.  
      *Requirement*: Accessible to non-experts; robust to biased inputs.  

  ### **Missing Requirements**  
  9.  **Time Sensitivity**  
      *Case*: A 10-year horizon demands accounting for time lags (e.g., policy advocacy vs. disaster relief).  
      *Requirement*: Penalize causes with benefits delayed beyond 10 years.  

  10. **Irreversibility Handling**  
      *Case*: Granting £1M to build a school locks in capital; must compare to flexible cash transfers.  
      *Requirement*: Flag irreversible commitments and opportunity costs.  

  11. **Stopping Rules**  
      *Case*: If a cause underperforms at Year 5, but funds are committed, must define exit triggers.  
      *Requirement*: Include predefined failure/success metrics.  

  ---

  ### **Diagnosis of Tensions**  
  - **Incompatible Triad**: Carving invariance + interaction sensitivity + marginal scoring **cannot coexist** in a single ranking.  
    *Why?* Interactions imply marginal impact depends on other funded causes (e.g., electrification’s value rises if paired with tech training). Carving causes finely (invariance) hides these synergies; coarse carving obscures marginal returns.  
  - **Moral Uncertainty vs. Complete Ordering**: Forcing a single ranking *averages* moral views (e.g., 0.2% discount rate), burying disagreement. Better to output ranges or Pareto-efficient sets.  
  - **Key Exclusionary Requirement**: **Counterfactual honesty** excludes most frameworks. Many ignore displacement (e.g., ITN frameworks) or assume no crowding out (simplistic CEA).  

  ---

  ### **Scorecard of Existing Frameworks**  
  *(Evaluated against non-negotiables: Marginal scoring, carving invariance, counterfactuals, VoI, moral uncertainty, legibility)*  

  1. **Three-Factor (ITN: Importance/Tractability/Neglectedness)**  
     - ❌ **Fails**: Counterfactuals (ignores displacement), factor independence (neglectedness/tractability overlap), VoI (no option value), interaction sensitivity.  
     - ⚠️ **Partial**: Legible but easily gamed via cause-carving. Moral uncertainty addressed only via weight adjustments.  

  2. **Expected Cost-Effectiveness (CEA) with Probabilities**  
     - ❌ **Fails**: Moral uncertainty (demands precise probabilities), counterfactuals (often assumes no crowding out), VoI (rarely models option value), carving invariance (granularity affects probability estimates).  
     - ⚠️ **Partial**: Strong on marginal scoring if well-specified. Legibility low with complex models.  

  3. **Portfolio/"Hits-Based" Approach**  
     - ❌ **Fails**: Carving invariance (interactions drive allocations, not fixed rankings), legibility (trustees may reject "lottery logic"), marginal scoring (focuses on entire bets).  
     - ✅ **Strengths**: Handles VoI, moral uncertainty (diversifies across views), interactions (implicitly via diversification), counterfactuals (if funging modeled).  

  ---

  ### **Summary for Seminar**  
  The foundation’s constraints create irreconcilable demands: **interactions** and **carving invariance** clash inherently, while **moral uncertainty** resists reduction to a single ranking. **Counterfactual honesty** is the sharpest filter—frameworks ignoring displacement/alternatives fail. Use this tension to provoke debate: *Can a "framework" reconcile fixed budgets, no feedback, and radical disagreement? Or is the quest for one ranking fundamentally flawed?*  

  Would you like expanded cases for seminar discussion or refinement of the tensions?
