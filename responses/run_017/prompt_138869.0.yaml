answer: |-
  **MEMORANDUM**  
  **To:** Heads of School, All Divisions  
  **From:** Interim Committee on the Scientific Status of Historical Sciences (ICSSHS)  
  **Subject:** Reclassification of the Department of Biology – Final Determination and Operational Implications  
  **Date:** 24 May 2024  
  **Ref:** ICSSHS/Determination/Bio/04  

  1.  Following its mandate under Statute 7.12(c) (Methodological Rigour in Research Classification), the ICSSHS has completed its formal assessment of the epistemological foundations of research conducted within the Department of Biology, with particular focus on the theoretical framework commonly termed "Darwinism" or the "Modern Evolutionary Synthesis" (hereafter "the Theory").

  2.  The Committee applied the demarcation criterion articulated by Sir Karl Popper, specifically the requirement for a genuinely scientific theory to be empirically falsifiable in principle through conceivable observations. Non-falsifiable propositions, while potentially meaningful or useful, fall outside the strict definition of science and must be classified accordingly.

  3.  The Committee concurs with Popper's seminal assessment (circa 1970s)* that the core proposition of the Theory – namely, that natural selection is the primary mechanism of evolutionary change – does not meet this criterion of falsifiability. The Theory functions not as a testable scientific theory, but as a fertile *metaphysical research programme*. It provides a powerful heuristic framework capable of generating testable subsidiary hypotheses concerning specific adaptations or population dynamics, but its core mechanism itself resists definitive falsification.
      *   *Footnote: The Committee acknowledges Popper's subsequent public retraction (circa 1978) of this specific assessment concerning natural selection. However, after deliberation, the Committee determined that the internal logic and rigour of the *original* 1970s argument remain sound and compelling, and that the retraction, while noted, is not binding upon this assessment. The retraction appears motivated by external pressures and does not invalidate the core philosophical critique.*

  4.  The primary impediment to falsifiability lies in the operationalization of "fitness":
      *   4.1 If "fitness" is defined tautologically as "differential reproductive success" (i.e., the survivors survived), then the proposition "natural selection leads to the survival of the fittest" becomes logically true but empirically empty. It cannot be falsified by any observation, as any outcome is compatible with it.
      *   4.2 If "fitness" is defined prospectively as a measure of expected reproductive success *in a specified environment*, the proposition potentially gains testable content. However, falsifiability hinges critically on the *independent specification* of the relevant environment and the fitness function *prior to*, and independently of, the observed evolutionary outcome.
      *   4.3 The Committee reviewed numerous case studies submitted by the Department illustrating this difficulty. A representative example involved the proposed adaptation of the pale throat-patch in the *Caithness dune-wasp* (*Vespula dunensis caithnessiensis*) for intra-species signalling within its ancestral dune environment.
          *   4.3.1 Biologists proposed Environment A (low-UV, high sand-reflectance) as the selective context favouring a pale signal patch.
          *   4.3.2 The Committee requested observations that could have falsified the hypothesis *if Environment A were independently verified*. Biologists indicated that finding the patch non-functional for signalling in Environment A, or finding it disadvantageous in Environment A, would falsify it.
          *   4.3.3 However, the Committee determined that Environment A was reconstructed *primarily* from biological evidence (including the presence of the patch itself and inferred behaviours) and sedimentological data interpreted *through the lens of the adaptationist assumption*. Its independent specification, absent circular reference to the biological outcome needing explanation, was deemed insufficient.
          *   4.3.4 Alternative environments (B: high predation pressure favouring camouflage; C: thermoregulatory constraints) were subsequently proposed, each arguably compatible with the patch's existence. The Committee found that the Theory, applied post-hoc, readily generated plausible narratives for the patch under *any* reasonably proposed environment, without offering a clear methodological path to identifying which environment (if any) constituted the *actual* independent selection pressure that would render the adaptation hypothesis genuinely testable. The core claim remained shielded from definitive refutation.

  5.  **Determination:** Therefore, the ICSSHS determines that the core theoretical framework underpinning the majority of research within the Department of Biology (specifically, natural selection as the primary driver of adaptation and evolutionary change) is **Metaphysical** in status, not Scientific. It constitutes a **Heuristic Research Programme (HRP)**.

  6.  **Operational Implications:** Effective immediately:
      *   6.1 **Research Funding:** Departmental applications for core scientific research grants (Category 1-3; e.g., RCUK-BIO, HFSP) must cease. Applications may be submitted under:
          *   HRP Development Grants (Category 7a: Metaphysical & Heuristic Frameworks)
          *   Historical Sciences Grants (Category 5b: Narrative Reconstruction & Explanation)
          *   Grants for the Generation of Testable Hypotheses (Category 4c: Derivative Propositions from Established HRPs)
      *   6.2 **Curatorial Oversight:** The University Museum's taxonomic collections curated by Biology staff are reclassified as "Historical Artefacts of Biological Heuristic Programmes". Physical relocation to the Department of History & Philosophy of Science storage annex (Wing D, Sub-Level 2) will commence 01/07/2024. Museum staff associated purely with taxonomy transfer with the collections.
      *   6.3 **Teaching:** The Theory, specifically the mechanism of natural selection, may no longer be taught *as established scientific fact* within core Biology modules. It may be presented within:
          *   Philosophy of Science modules (as a key example of a Heuristic Research Programme).
          *   History of Science modules (tracing the development and impact of the HRP).
          *   Advanced Biology modules *only* with the explicit caveat: "This concept represents the core heuristic principle of the dominant metaphysical research programme in historical biology; its derivative hypotheses, however, may be scientifically testable."
      *   6.4 **Peer Review:** Reviewers for biological journals are instructed to assess papers proposing adaptive explanations strictly on the falsifiability of the *specific subsidiary hypotheses* presented (e.g., about genetic mechanisms, physiological performance, or current ecological function). Claims presented as direct evidence *for natural selection itself as the cause* of a trait in deep time are to be flagged as belonging to the HRP's narrative component, not its testable scientific core.
      *   6.5 **Research Degrees:** New PhD theses originating from the Department must be catalogued under "Philosophy of Heuristic Programmes (Biological)" or "Historical Reconstruction (Life Sciences)". Existing theses will be retrospectively re-catalogued.

  7.  **Clarification:** The Committee wishes to state unequivocally that this reclassification:
      *   7.1 Does **NOT** assert that the Theory is *false*.
      *   7.2 Does **NOT** assert that the Theory is trivial or without immense practical and intellectual value.
      *   7.3 Does **NOT** cast doubt on the occurrence of evolution or the relatedness of life forms (which may be supported by other, potentially falsifiable, lines of evidence such as comparative genomics/embryology interpreted *outside* the strict adaptationist HRP).
      *   7.4 Pertains **SOLELY** to the methodological status of the core mechanism (natural selection) under the strict falsificationist demarcation criterion applied consistently by this Committee.

  **Questions Members Have Asked**

  *   **Q: If the Theory isn’t false, trivial, or denying evolution happened, what’s the actual *problem* with teaching it as science?**  
      A: The issue is one of *categorisation* and *epistemological rigour*. Teaching a non-falsifiable proposition as established scientific fact misrepresents its methodological status and undermines the clear demarcation essential for scientific progress. It risks conflating empirically testable science with productive but ultimately untestable metaphysical frameworks.

  *   **Q: Doesn’t the fruitfulness of the Research Programme *prove* its scientific worth?**  
      A: Fruitfulness in generating testable hypotheses is a virtue of a *good* metaphysical research programme. However, heuristic fertility is distinct from, and does not confer, the status of being itself a falsifiable scientific theory. Many fruitful conceptual frameworks operate outside strict science (e.g., certain economic models, psychoanalytic concepts).

  *   **Q: Where does this leave research on bacterial antibiotic resistance, which clearly shows selection happening now?**  
      A: Observations of *differential survival/reproduction within observable populations under defined contemporary conditions* constitute testable micro-evolutionary hypotheses falling under Category 4c (Derivative Propositions). The reclassification pertains specifically to the *core mechanism's* application as the *primary explanation* for deep-time, unobservable historical events and complex adaptations. Research on observable, contemporary selection pressures remains categorizable as science.
