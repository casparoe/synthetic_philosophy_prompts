prompt: |-
  I am in the third year of a PhD in philosophy, writing on the axiology of population size, and I need to characterise my supervisor's view accurately enough to attribute it to her in a chapter. Over the last two terms she has given me off-the-cuff rulings on a series of cases, and before I build the chapter around them I want to know what she will say about the case I am about to put to her, and how much of her view her own verdicts actually pin down.

  I will use the following convention. Welfare is measured on a scale on which 0 is the neutral point — a life neither worth living nor worth having — 100 is the best life a person could have, and negative numbers are lives not worth living. A life at 40 is decent but unremarkable; a life at 60 is good; a life at 1 is barely worth living. I write n@w for a population of n people each at welfare level w. Where I say that one population contains "a further" group, I mean that the original people exist with the same welfare under both options and the further people exist only under one of them. Her verdicts so far:

  (1) 1,000@100 versus 1,000@100 together with a further 2,000@60. The larger population is better.
  (2) 1,000@100 versus 1,000@100 together with a further 2,000@30. The smaller population is better. I pressed her on this: she said the addition makes the outcome worse, not merely that it fails to improve it.
  (3) 1,000@100 versus 1,000,000,000@40. The larger population is better, and by a wide margin.
  (4) 1,000@20 together with 1,000@80 versus 2,000@50. The two are exactly equally good.
  (5) 1,000@100 versus 1,000@100 together with a further 1,000@−10. The smaller population is better.

  Two features of this list strike me as important. The first is that it excludes the two simplest comparisons I can think of: (1) is hard to reconcile with ranking populations by average welfare, and (2) is hard to reconcile with ranking them by total welfare. The second is that in every case so far in which the number of people differs, one of the two populations has been 1,000@100. That is what worries me, because my own reconstruction and a colleague's reconstruction seem to differ only in cases where the anchor is somewhere other than 100.

  My reconstruction: she is measuring each life by how far it stands above some fixed level and adding those surpluses up, with the fixed level lying somewhere above 30 and below 60. My colleague's reconstruction: she is weighting total welfare by something like a power of population size, so that numbers count but with diminishing returns. On the verdicts above I cannot tell these apart, and I do not trust my own arithmetic enough to construct the separating case reliably.

  The case I want to put to her is this. Under policy I, 10,000 people exist at welfare 40. Under policy II, those same 10,000 people exist at welfare 40 and a further 10,000 people exist at welfare 28. Every life in question is worth living; the second policy creates additional people whose lives are decent but well below those of the people already there, and leaves everyone else exactly as they were. Is the second outcome better than the first?

  What I am asking for, concretely:

  - Which rules, stated precisely enough that I can compute with them, are consistent with all of (1) through (5)? Please give each as a formula, and give the range of parameter values that her verdicts permit for it. If her verdicts leave a rule's parameters only loosely constrained, say where the loose constraints bite.
  - What does each candidate rule say about my case, and is any of those verdicts sensitive to where the rule's parameters sit inside the permitted range? I care about robustness here: I would rather know that a rule says "the second outcome is better" for every setting her track record allows than that it says so for most settings.
  - Your best guess at her actual verdict, with the reason for preferring that rule over the others that fit her record equally well — including any reason that comes from which rule is more likely to be something a person would arrive at informally, rather than from fit alone.
  - I have one supervision left before I write this up. If more than one rule fits her verdicts and agrees with the others about my case, give me the single further comparison that would do the most work in telling them apart, and say what she would have to say about it for each rule to be confirmed.

  Two last things that may bear on this. She has told me more than once that she has never felt the force of the repugnant conclusion as an objection; yet her ruling in (3) has, as far as I can see, the same shape as the repugnant comparison, merely at a higher welfare level than the standard one. I would like to know whether that shows she has only relocated the problem rather than avoided it, and whether it counts for or against either of the two reconstructions above. And I should say that I am not after a label for her view; a name would be useful to me only insofar as it comes with a formula I can apply and a statement of where the view's edges are.
reasoning: |-
  Hmm, the user is a third-year PhD student in philosophy working on population axiology. They need to accurately characterize their supervisor's view based on her past verdicts on specific population cases. They've provided five rulings and want to test two potential reconstructions: a critical-level view (where welfare above some threshold is summed) versus a variable-value view (where population size affects the weight of total welfare).

  Looking at the supervisor's verdicts:
  - Case 1 prefers adding 2000 people at 60 to 1000 at 100
  - Case 2 rejects adding 2000 at 30 to 1000 at 100
  - Case 3 prefers 1 billion at 40 over 1000 at 100
  - Case 4 considers 1000@20 + 1000@80 equal to 2000@50
  - Case 5 rejects adding 1000 at -10 to 1000 at 100

  The critical-level theory seems promising. For Case 1, adding lives at 60 above a threshold (say 30-59) improves things. Case 2 rejects adding at 30 if it's below the threshold. Case 3 works if the critical level is below 40. Case 4 fits only if the critical level is exactly 50 - that's crucial. Case 5 naturally rejects negative additions.

  The variable-value theory fits too, but less neatly. It requires specific diminishing returns parameters to match Case 2's strict worsening and Case 4's exact equality. The critical-level view seems more elegant here.

  For the test case: adding 10,000 at 28 to 10,000 at 40. The critical-level view (with threshold 50) would say this worsens outcomes since 28<50. The variable-value view would likely approve it as positive welfare addition.

  If I needed to distinguish further, I'd propose a case like: 1000@100 vs 2000@30. The critical-level view (threshold 50) would reject it (30<50), while variable-value might accept if diminishing returns aren't too strong.

  Notably, the supervisor's comfort with Case 3 (billions at 40 > 1000 at 100) suggests she's avoided the classic repugnant conclusion but created a "weak" version where high-quality lives are outweighed by sufficient mediocre ones. Both reconstructions accommodate this.

  Given the simplicity and perfect fit of critical-level utilitarianism with threshold 50 - especially how cleanly it explains Case 4's exact equality - that's my recommended reconstruction. The test case should clarify if the threshold is indeed at 50.
answer: |-
  Based on your supervisor's verdicts and the need for precise, computable rules, I've analyzed the two reconstructions (critical-level utilitarianism and variable-value theory) for consistency with cases (1)-(5), their implications for your test case, and strategies for distinction. The critical-level view fits perfectly with a specific parameter, while the variable-value view fits only under constrained parameters and exhibits fragility. Below is a systematic breakdown.

  ---

  ### 1. **Rules Consistent with Verdicts (1)-(5)**
  #### **A. Critical-Level Utilitarianism (CLU)**  
  **Formula:** \( V(P) = \sum (w_i - c) \) for all lives \( w_i > 0 \), where \( c \) is a fixed "critical level" (lives below \( c \) are not worth adding).  
  - **Consistency with verdicts:**  
    - (1) Larger better: \( c < 60 \) (since \( 2000 \times (60 - c) > 0 \)).  
    - (2) Smaller better: \( c > 30 \) (since \( 2000 \times (30 - c) < 0 \)).  
    - (3) Billion at 40 better: \( c < 40 \) (otherwise \( 10^9 \times (40 - c) < 1000 \times (100 - c) \)).  
    - (4) Exact equality: Requires \( c = 50 \).  
      - Left side: \( 1000 \times (20 - c) + 1000 \times (80 - c) = 1000 \times (100 - 2c) \)  
      - Right side: \( 2000 \times (50 - c) = 1000 \times (100 - 2c) \).  
      *Only equal if \( c = 50 \).*  
    - (5) Smaller better: Adding lives at \(-10\) always worsens \( V \) (since \(-10 - c < 0\)).  
  - **Parameter range:** Verdicts (2), (3), and (4) **jointly pin \( c \) to exactly 50**. This is non-negotiable due to (4).  

  #### **B. Variable-Value Theory (VVT)**  
  **Formula:** \( V(P) = N^\alpha \times \text{Average Welfare} \), where \( \alpha \) is a diminishing-returns parameter (\( 0 < \alpha < 1 \)).  
  - **Consistency with verdicts:**  
    - (1) Larger better: \( (3000)^\alpha \times \frac{1000 \times 100 + 2000 \times 60}{3000} > (1000)^\alpha \times 100 \)  
      → Holds for any \( \alpha > 0 \) since average welfare increases (86.67 > 100? No, but total welfare increases).  
      *Correction: \( (3000)^\alpha \times 86.67 > 1000^\alpha \times 100 \) → True if \( \alpha \) is not too small (e.g., \( \alpha > 0.1 \)).*  
    - (2) Smaller better: \( (3000)^\alpha \times \frac{1000 \times 100 + 2000 \times 30}{3000} < 1000^\alpha \times 100 \)  
      → \( (3000)^\alpha \times 53.33 < 1000^\alpha \times 100 \) → Requires \( \alpha < \log_{3}(100/53.33) \approx 0.26 \).  
    - (3) Billion at 40 better: \( (10^9)^\alpha \times 40 > 1000^\alpha \times 100 \) → \( 40 \times (10^6)^\alpha > 100 \) (since \( 10^9/1000 = 10^6 \))  
      → Holds for \( \alpha > \log_{10^6}(100/40) \approx 0.00004 \) (trivially true for any plausible \( \alpha \)).  
    - (4) Exact equality: \( (2000)^\alpha \times 50 = (1000)^\alpha \times 50 + (1000)^\alpha \times 50 \)  
      → Left: \( 2000^\alpha \times 50 \); Right: \( 1000^\alpha \times 50 + 1000^\alpha \times 50 = 2 \times 1000^\alpha \times 50 \)  
      → Equality iff \( 2000^\alpha = 2 \times 1000^\alpha \) → \( (2)^\alpha = 2 \) → \( \alpha = 1 \).  
      **But \( \alpha = 1 \) is total utilitarianism**, which *contradicts (2)*. Thus, **no value of \( \alpha \) satisfies (4)**.  
    - (5) Smaller better: Adding \(-10\) lives reduces average welfare, so likely worse, but depends on \(\alpha\).  

  **Conclusion for VVT:**  
  - Verdict (4) is **fatal** for standard VVT. It cannot hold exact equality unless \(\alpha = 1\), but \(\alpha = 1\) violates (2).  
  - *If we ignore (4)*, VVT fits (1)-(3) and (5) only if \( 0.1 < \alpha < 0.26 \). But (4) is a clear verdict and cannot be discarded.  

  ---

  ### 2. **Verdict on Your Test Case**
  - **Case:** Policy I (10,000@40) vs. Policy II (10,000@40 + 10,000@28).  
    - **Critical-Level Utilitarianism (c=50):**  
      \( V(\text{I}) = 10000 \times (40 - 50) = -100,000 \)  
      \( V(\text{II}) = 10000 \times (40 - 50) + 10000 \times (28 - 50) = -100,000 + (-220,000) = -320,000 \)  
      → **Policy I is better** (less negative). Verdict is *robust* and *parameter-free* (since \(c=50\) is fixed).  
    - **Variable-Value Theory:**  
      Not viable (fails (4)), but if forced:  
      \( V(\text{I}) = 10000^\alpha \times 40 \)  
      \( V(\text{II}) = 20000^\alpha \times \frac{10000 \times 40 + 10000 \times 28}{20000} = 20000^\alpha \times 34 \)  
      Since \( \alpha < 1 \), \( 20000^\alpha < 2 \times 10000^\alpha \), so:  
      \( V(\text{II}) \approx 20000^\alpha \times 34 < 2 \times 10000^\alpha \times 34 = 68 \times 10000^\alpha \)  
      \( V(\text{I}) = 40 \times 10000^\alpha \)  
      → **Policy II is worse if \( 68 < 40 \)? No, 68 > 40**, so \( V(\text{II}) > V(\text{I}) \) for all \(\alpha\).  
      *This contradicts CLU* but is irrelevant since VVT fails (4).  

  **Robust Conclusion:**  
  - Only CLU (with \( c=50 \)) fits all verdicts, and it **strictly prefers Policy I** (smaller population).  

  ---

  ### 3. **Best Guess at Her Actual View**  
  - **Critical-Level Utilitarianism with \( c = 50 \) is the only rule fitting all verdicts.**  
    - **Why it dominates:**  
      1. **Perfect fit:** Matches (1)-(5) exactly with no parameter flexibility after (4).  
      2. **Simplicity:** Explains (4)'s equality naturally (critical level = average of 20 and 80).  
      3. **Psychological plausibility:** A fixed "good enough" threshold (here, 50) aligns with human intuition more than abstract diminishing returns.  
      4. **Repugnant Conclusion insight:** Her verdict (3) (billion at 40 > 1000 at 100) is consistent if \( c < 40 \), which \( c=50 \) satisfies. This creates a **weak repugnant conclusion** (sufficiently large populations at \( w > c \) can outweigh small high-welfare groups), but avoids the classic version (where \( w \) can be arbitrarily low). She may see this as acceptable, given her stated lack of concern.  

  - **Why VVT fails:** It cannot reconcile (2) and (4) without contradiction.  

  ---

  ### 4. **Crucial Distinguishing Case (If Needed)**  
  If you suspect other views, propose:  
  - **Case X:** 1,000@100 vs. 2,000@30.  

  **Predicted Verdicts:**  
  - **Critical-Level (c=50):**  
    \( V(\text{1000@100}) = 1000 \times (100 - 50) = 50,000 \)  
    \( V(\text{2000@30}) = 2000 \times (30 - 50) = -40,000 \)  
    → **Strongly prefers 1000@100** (since negative value).  
  - **Variable-Value (if forced, \(\alpha \approx 0.2\)):**  
    \( V(\text{1000@100}) = 1000^{0.2} \times 100 \approx 251 \times 100 = 25,100 \)  
    \( V(\text{2000@30}) = 2000^{0.2} \times 30 \approx 288 \times 30 = 8,640 \)  
    → **Prefers 1000@100**.  
    But if \(\alpha\) were higher (e.g., \(\alpha=0.5\)), \( V(\text{2000@30}) = \sqrt{2000} \times 30 \approx 44.7 \times 30 = 1,341 \), still worse.  
    *No plausible \(\alpha\) makes 2000@30 better here.*  

  **Why this case?** It tests the lower bound of her tolerance for low-positive welfare additions. CLU (c=50) predicts a strict preference for the high-welfare group, consistent with her rejection in (2). If she *preferred* 2000@30, it would contradict CLU and suggest a different view (e.g., total utilitarianism), but her history makes this unlikely.  

  ---

  ### 5. **Repugnant Conclusion Insight**  
  - Her view **relocates but does not avoid** the repugnant conclusion:  
    - **Classic repugnant conclusion:** Vast population at \( w \approx 0^+ \) can outweigh small group at high \( w \).  
    - **Her view (CLU, c=50):** Vast population at \( w > 50 \) (e.g., 51) can outweigh small group at 100, since \( n \times (51 - 50) \) can exceed \( 1000 \times (100 - 50) \) for large \( n \).  
    - **Why she may accept this:** Lives above \( c \) are "good enough," and quantity has moral weight. Her verdict (3) explicitly endorses this tradeoff.  
  - **Implication for reconstructions:**  
    - CLU naturally generates this "weak repugnance."  
    - VVT (if it fit) would too, for \( w \) above the point where \( N^\alpha \times w \) outpaces high-welfare alternatives.  

  ---

  ### Summary and Recommendations
  1. **Your supervisor's view is almost certainly Critical-Level Utilitarianism with \( c = 50 \).**  
     - Formula: \( V(P) = \sum (w_i - 50) \) for all lives worth living.  
     - **Test case verdict:** Policy I (10,000@40) is **better** than Policy II (adding 10,000@28).  
     - **Key edge:** Adding lives below 50 makes outcomes worse, even if lives are worth living (as in your test case and her verdict (2)).  

  2. **For your chapter:**  
     - Attribute CLU with \( c=50 \). Explicitly note that (4) pins \( c \) to 50.  
     - Discuss her avoidance of the *classic* repugnant conclusion (via \( c > 0 \)) but acceptance of a higher-threshold version.  

  3. **In your final supervision:**  
     - **Present your test case:** If she agrees Policy I is better, it confirms CLU.  
     - **If cautious, use Case X (1000@100 vs. 2000@30):**  
       - If she prefers 1000@100 (expected), it further confirms CLU.  
       - If she prefers 2000@30, it would undermine everything—but this is unlikely given (2).  

  **Final note:** Her view is elegant and consistent. The weak repugnance it permits is likely why she "never felt the force" of the standard objection—it doesn't apply to her theory.
