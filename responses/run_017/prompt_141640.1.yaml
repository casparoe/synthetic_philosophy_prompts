prompt: |-
  hey — you're a professional philosopher of science who specializes in Bayesian confirmation theory (the real stuff, not the pop-Silver version), and you've also done a two-year stint embedded with an evidence-assessment team, so you know how this kind of thing actually gets used when the clock is running. Before you write anything final, take a pass at brainstorming: list the distinctions from the old-evidence literature that you think could survive being turned into a checklist, and the ones that are hopeless in practice, and say briefly why you're dropping each. Then give me the actual procedure, and think carefully about the hard cases rather than sketching them.

  Context: I run a small evidence-assessment unit at a large medical research funder. Twice a year we re-score each funded programme's central mechanistic hypothesis H against the whole evidence base, and we report a log likelihood ratio (we use decibels, we call them "credits") that rolls up into a confidence rating the renewal panel sees. My team is six people, no philosophers among them, and they get about half a day per programme. The thing that keeps blowing up our meetings: most of the evidence we want to count was already known — sometimes for decades — before anyone wrote H down in its current form. Taken literally, if E is already in the background knowledge then its probability is 1, the ratio is 1, zero credits, done. But that's obviously wrong sometimes (a theory that quietly explains away a long-standing anomaly looks like it earns a lot) and obviously right sometimes (a mechanism invented to fit a famous dataset that everyone already had open on their desk earns nothing). I need a procedure that separates those two, definately.

  What I want:

  - An ordered set of steps my team can run on each (H, E) pair in about 40 minutes, with what counts as a sufficient answer at each step, and what to write down when we can't get a number.
  - Where the procedure says stop, zero credits, and the reason it stops there.
  - Where it says this is a judgment call, escalate to the panel — instead of pretending to be mechanical. Be explicit about which steps are judgment in a lab coat.
  - Real handling of: (i) evidence that was used to construct H vs. merely known before H; (ii) H entailing E only with help from auxiliaries that were themselves adjusted along the way; (iii) evidence that was an open anomaly for the previous theory vs. evidence that everyone already had a decent explanation for; (iv) the "data is old but the quantity is new" case — re-analyses nobody performed until H told them what to compute; (v) how to avoid counting the same evidence twice, once as motivation for H and again as a prediction of H; (vi) what to do when nobody can say what H would have predicted if E had come out otherwise, including whether it's legitimate to fall back on "would the field have been surprised?"

  Then run it on three cases:

  1. A calibration case from outside medicine: a new theory of gravitation from the 1910s that nobody built in order to explain the odd behaviour of Mercury's orbit, but which gets the anomalous part right. Does it get credits, on which step, and how many does it deserve compared to a genuine novel prediction? Then: someone later proposes a rival explanation that soaks up part of the anomaly. Do the credits come back out, and if so, when — at the moment the rival is proposed, or only once it's tested?
  2. Our problem child. Programme B's hypothesis is that a specific gut-bacteria-derived metabolite drives insulin resistance. Its strongest support is a widely-used cohort dataset; the metabolite was picked, out of a panel of dozens of candidates, by seeing which one tracked the outcome in that dataset. The team loves this programme and I expect your procedure to tell me something I don't want to hear. Say it plainly, don't soften it.
  3. A retrodiction case: an old dataset, and a quantity nobody had ever computed from it. H pins that quantity down to a fairly narrow range, and when someone finally computes it, it lands in the range. Old evidence or new prediction? Where does your procedure land, and what single change to the facts would flip the answer?

  Finally, a short section on what this procedure can't do: where it will misfire even when my team runs it correctly, which disagreements it settles by fiat rather than argument, and what I should tell the panel so they don't read the credits as more precise than they are.
reasoning: |-
  We are building a procedure for assessing the confirmatory value of evidence E for hypothesis H when E is old evidence. The core Bayesian problem is that if E is already known (in background knowledge K), then P(E|K) = 1, so the likelihood ratio P(E|H&K)/P(E|~H&K) = 1/1 = 1 (0 decibels). But intuitively, sometimes old evidence does confirm a new hypothesis (as in the Mercury anomaly) and sometimes it doesn't (as in a hypothesis built to fit E). We need a procedure that distinguishes these.

  The literature on old evidence (e.g., Glymour, Earman, Garber, Jeffrey) offers several approaches, but many are too abstract for our time-constrained, operational context. We must extract a checklist that can be applied in about 40 minutes per (H, E) pair by non-philosophers.

  Key distinctions from the literature and their operational viability:

  1. **The Problem of Logical Entailment**: If H (with auxiliaries A) entails E, and E is known, then P(E|H) = 1. But if E is old, then it's in K, so P(E|H&K)=1 and P(E|~H&K)=1? That's the crux. We need to avoid this.

  2. **Garber-Style Solutions (Introducing a New Proposition)**: Garber suggests that what we learn is not E but that H entails E. This is hard to operationalize because it's unclear how to assign probabilities to "H entails E" without getting into the logical omniscience problem.

  3. **Conditionalization on the Discovery of the Explanation**: We imagine a counterfactual scenario where E is not known and we learn it. But then we must assign P(E|H) and P(E|~H) in that state, which requires knowing what the probabilities would have been. This is judgment-heavy.

  4. **Use of the Agent's Historical Degrees of Belief**: This requires knowing what the scientists actually believed before E was known, which is often unavailable and hard to reconstruct.

  5. **The Problem of Old Evidence for New Theories (Howson and Urbach)**: They suggest that if E was known, then it should not confirm H unless H was not constructed to fit E. But how to assess that?

  6. **Distinction between Accommodation and Prediction**: This is intuitive: if H was built to fit E, then E doesn't confirm H (or does so weakly). If H predicts E without being built for it, then it confirms. But how to operationalize "built to fit"?

  7. **The Role of Auxiliary Hypotheses**: Often H only entails E with the help of auxiliaries. If these auxiliaries were adjusted to make H fit E, then that's accommodation. If they were independently established, then it's prediction.

  8. **The Anomaly Status of E**: If E was an anomaly for the previous theory, then a new H that explains E gets credit. If E was well-explained, then less so.

  9. **The "New Quantity" Case**: If E is old data but a new quantity is derived from it (which H predicts), then it's effectively a new prediction.

  10. **Avoiding Double Counting**: If E was used to construct H, it shouldn't count again as confirmation.

  Operational Viability:

  - **Hopeless in Practice**: 
    - Garber-style solutions (learning that H entails E) because we cannot assign probabilities to logical relations without getting into deep philosophical issues and requiring a logical omniscience we don't have.
    - Reconstructing the actual historical degrees of belief (unless we have clear records, which we usually don't) is too time-consuming and speculative.

  - **Can Survive as Checklist Items** (with caveats):
    - **Accommodation vs. Prediction**: We can ask: Was E used in the construction of H? (But note: sometimes H is constructed without E, but then E is used to choose between variants. We need to capture that.)
    - **Anomaly Status**: Was E considered an anomaly for the previous dominant theory? (This can be assessed by literature review and expert opinion.)
    - **Auxiliary Hypotheses**: Were the auxiliaries used to derive E from H already well-established, or were they adjusted along with H? (This requires checking the history of the auxiliaries.)
    - **New Quantity from Old Data**: If E is a re-analysis of old data (a new statistic, etc.) that was not performed until after H was proposed, then it counts as new. (We can check the timeline of when the analysis was done.)
    - **Double Counting**: If E was used to build H, then we mark it as such and do not count it (or discount heavily). We must track which evidence was used in construction.

  Given the time constraint (40 minutes per pair), we design a step-by-step procedure that focuses on the tractable distinctions.

  **Proposed Procedure for Assessing Confirmatory Value of Old Evidence**

  **Step 0: Pre-screening for Novel Predictions**
  - If E was first observed (or the analysis that produced E was first performed) *after* H was proposed and publicly available, then treat E as a novel prediction. Proceed to Step 5 (assign likelihood ratio) but note that this is the strongest case.

  **Step 1: Was E used in the construction of H?**
  - **Check**: Is there direct evidence (e.g., in pre-proposal documents, lab notebooks, or in the initial grant application) that the proposers of H used E to formulate or select H? If yes, then E is very likely being used in accommodation. 
    - *Sufficient answer*: Explicit statements in the literature or project documentation that E was used to build H. If found, then stop: zero credits. 
    - *If unclear*: Look for temporal proximity: if H was proposed shortly after E became known and there is a clear link (e.g., the paper proposing H cites E as motivation), then this is strong evidence of accommodation. 
    - *What to write*: "E was used in the construction of H; zero credits." 
    - *If no evidence of use*: Proceed to Step 2.

  **Step 2: Was E an open anomaly?**
  - **Check**: At the time H was proposed, was E considered an anomaly for the then-dominant theory (or theories) in the field? 
    - *How to assess*: Review literature from before H was proposed. Look for statements that E was puzzling, unexpected, or not explained by existing theories. 
    - *Sufficient answer*: A clear statement in a review article or prominent paper that E was an anomaly. 
    - *If it was an anomaly*: Proceed to Step 3. 
    - *If it was not an anomaly* (i.e., it was well-explained or not considered problematic): Proceed to Step 4. 
    - *If unclear*: Escalate to the panel. Note: This is a judgment call. We are asking about the state of scientific opinion at the time.

  **Step 3: Assessment of the Anomaly**
  - **Check**: Even if E was an anomaly, we must check if H resolves it without ad hoc adjustments. 
    - **Substep 3a: Auxiliary hypotheses**: Are the auxiliary assumptions (A) required to derive E from H independently supported? Or were they adjusted or introduced to make H fit E? 
      - *How to assess*: Look at the history of A. If A was already part of the background knowledge (well-established) before H was proposed, then it's independent. If A was proposed along with H (or shortly after) and there was no prior evidence for A, then it might be ad hoc. 
      - *Sufficient answer*: If A was introduced with H and not tested independently, then this is weak. We might assign low credits. But if A is independently supported, then proceed. 
      - *Judgment call*: This step is inherently judgmental. We must decide if A is ad hoc. A rule of thumb: if A was tested and confirmed after H was proposed (and not before), then it was not independent. 
    - **Substep 3b**: If H requires no new auxiliaries (or only well-established ones) to explain E, then E is strong evidence for H. Proceed to Step 5. 
    - **Substep 3c**: If the auxiliaries are new and ad hoc, then the confirmation is weak. We might assign low credits (say, 1-3 dB) or even zero. But note: if the ad hoc auxiliary is later confirmed, then we might revisit. However, for now, we are at the time of assessment. 
    - *What to write*: If auxiliaries are ad hoc, write: "E was an anomaly but H requires ad hoc auxiliaries to explain it; assign minimal credits (1 dB) or zero." [We might have a scale for degrees of ad hocness, but that's too vague. Better to have a binary: if ad hoc, then low or zero; if not, then proceed.]

  **Step 4: Evidence that was not an anomaly but still fits H**
  - **Check**: If E was not an anomaly (i.e., it was already well-explained by prior theories) but H also explains it, then we must be cautious. 
    - **Substep 4a**: Does H explain E in a way that is significantly different from the prior explanation? (e.g., different mechanism, more parsimonious, etc.) If not, then E provides little to no additional confirmation. 
      - *How to assess*: Compare the explanations. If H's explanation is novel (e.g., it uses H's core mechanism in a way that is not just a rehash of the old explanation) then it might get some credit. 
      - *Judgment call*: This is hard. We might ask: if we didn't know E, would H have predicted it? But that's counterfactual. 
    - **Substep 4b**: The "new quantity" case: If E is old data, but H predicts a new quantity that is derived from that data (and that derivation was not done before H), then we treat it as a novel prediction (Step 0). But note: if the derivation was done after H and because of H, then it's novel. 
    - **Substep 4c**: If E was well-explained and H's explanation is not novel, then assign zero credits. 
    - *What to write*: "E was already well-explained by prior theories and H does not provide a novel explanation; zero credits."

  **Step 5: Assigning the Likelihood Ratio (if not stopped at zero)**
  - Now we must assign a number: the log likelihood ratio (in decibels). 
  - **Problem**: We don't have actual probabilities. We must estimate how surprising E was given H and given ~H. 
    - **Substep 5a**: For ~H, we consider the best alternative theory (or theories) available at the time H was proposed. What would they have predicted for E? 
      - If the alternatives predicted E well (high P(E|~H)), then the likelihood ratio is low. 
      - If the alternatives made E very unlikely (low P(E|~H)), then the ratio is high. 
    - **Substep 5b**: For H, we consider P(E|H). If H entails E (with reasonable auxiliaries), then P(E|H) is 1 (0 dB on the log scale). But if there's some uncertainty, we might assign less. 
    - **Substep 5c**: The hardest part: What if we can't assign a number? We might use a scale: 
      - **High** (10-20 dB): E was very unexpected under ~H (e.g., an anomaly) and expected under H. 
      - **Medium** (5-10 dB): E was somewhat unexpected under ~H and expected under H. 
      - **Low** (1-5 dB): E was a bit more expected under H than ~H. 
    - **Substep 5d**: If we cannot assign a number (e.g., because the alternatives are too vague), then we must use a fallback: 
      - Was the field surprised by E? (This is historical.) If E was considered strong evidence for H when it was first explained, then we assign accordingly. 
      - *But note*: This is judgmental. We might assign a medium score (say, 10 dB) for a classic anomaly resolution and adjust from there. 
    - **Substep 5e**: Avoid double counting: If E was partially used in constructing H (but not fully, so we didn't stop at Step 1), then we discount. For example, if H was chosen from a small set of candidates by fitting E, then we might halve the credits. 

  **Handling the Specific Issues Raised:**

  (i) **Evidence used to construct H**: Handled in Step 1. Stop, zero credits.

  (ii) **Auxiliaries adjusted**: Handled in Step 3 (Substep 3a). If auxiliaries were adjusted to fit E, then we assign low or zero credits.

  (iii) **Anomaly vs. well-explained**: Handled in Step 2 and Step 4.

  (iv) **"Data old but quantity new"**: This is handled in Step 0 (if the analysis is new) or in Step 4 (Substep 4b). We treat it as a novel prediction if the analysis was done after H and because of H.

  (v) **Avoid double counting**: Step 1 catches the main case. Also, in Step 5 we discount if there was any use in construction.

  (vi) **What if we can't assign P(E|~H)?**: Use the fallback in Step 5d: look at historical surprise. If the field was surprised by E (before H explained it) then P(E|~H) was low. We can assign a high ratio. If not, then lower.

  **Procedure Summary (for the team):**

  1. **Step 0: Is E a novel prediction?** 
     - If E was first observed/analyzed after H was proposed, then it's novel. Go to Step 5. 
     - Else, old evidence: go to Step 1.

  2. **Step 1: Was E used to construct H?** 
     - If yes, stop: zero credits. 
     - If no, go to Step 2.

  3. **Step 2: Was E an open anomaly?** 
     - If yes, go to Step 3. 
     - If no, go to Step 4. 
     - If unclear, escalate to panel.

  4. **Step 3: Anomaly Assessment** 
     - Check auxiliaries: 
       - If auxiliaries are ad hoc (new and untested) and introduced for H, assign low credits (1-3 dB) or zero. 
       - If auxiliaries are well-established, go to Step 5 (and assign high credits). 
     - If uncertain about auxiliaries, escalate.

  5. **Step 4: Non-anomalous evidence** 
     - If E is a new quantity from old data (and the analysis was done after H because of H), then treat as novel: go to Step 5. 
     - Else, if H's explanation is not novel (just like prior theories), assign zero credits. 
     - If H's explanation is novel, then go to Step 5 but assign lower credits (because E was expected under ~H).

  6. **Step 5: Assign Likelihood Ratio** 
     - Estimate P(E|H) and P(E|~H) as of the time H was proposed. 
       - For P(E|H): if H (with reasonable auxiliaries) entails E, set to 1 (0 dB). Otherwise, lower. 
       - For P(E|~H): use the best alternative theory at the time. 
     - Use historical surprise: 
       - If E was very surprising under ~H, assign high ratio (10-20 dB). 
       - If somewhat surprising, medium (5-10 dB). 
       - If not, low (1-5 dB). 
     - If we cannot assign, use: 
       - "At the time, was E considered strong evidence for H?" If yes, assign 10 dB (medium). 
       - Otherwise, assign 0 (but this is a judgment call; if in doubt, escalate).

  **Now, run the cases:**

  **Case 1: Mercury's Orbit and General Relativity (GR)**
  - E: The precession of Mercury's perihelion (anomalous part).
  - H: General Relativity (proposed by Einstein in 1915).
  - Facts: E was known since 1859 and was an anomaly for Newtonian mechanics. Einstein did not build GR to explain Mercury (he was working on gravity and relativity). He later found that GR predicted the anomaly.

  - **Step 0**: E was known before H? Yes, so not novel. Go to Step 1.
  - **Step 1**: Was E used to construct GR? No, by historical account. Einstein was surprised that GR explained it. So, go to Step 2.
  - **Step 2**: Was E an open anomaly? Yes, well-documented. Go to Step 3.
  - **Step 3**: Auxiliaries: GR requires no new auxiliaries to explain Mercury's orbit (it uses the field equations and the Schwarzschild solution). The auxiliaries (like the Schwarzschild metric) were derived from GR and were not ad hoc adjustments. They are part of the theory. So, go to Step 5.
  - **Step 5**: 
    - P(E|H): GR predicts E exactly (so 1).
    - P(E|~H): Under Newtonian mechanics (with possible planets Vulcan, etc.), E was very unlikely. The anomaly was about 43 arcseconds per century, and no explanation worked. So P(E|~H) was very low. 
    - Assign high credits: say 20 dB (which is a likelihood ratio of 100).

  - **Now, the rival explanation**: Suppose later someone proposes a modified gravity theory that explains part of the anomaly. 
    - This doesn't change the historical fact that at the time GR was proposed, E was very strong evidence. But our assessment is at the time of H's proposal. However, we are reassessing twice a year. 
    - If the rival theory is now a serious contender, then in the current assessment, ~H has changed. Now P(E|~H) might be higher (because the rival theory also explains E). So the likelihood ratio for GR might decrease. 
    - **In our procedure**: We must update the likelihood ratio based on the current state of alternative theories. 
    - So when the rival is proposed and it explains E, then P(E|~H) increases, so the ratio for GR decreases. We don't wait for testing. But note: if the rival is not yet tested, it might be ad hoc. We would assess it in Step 5 for ~H: if the rival is a serious alternative, then we include it in ~H. 
    - If the rival is just proposed and not confirmed, then we might discount it. But in principle, ~H includes all alternatives. We must use the best current alternatives. 
    - **Operationally**: At the next re-score, we re-run Step 5. We ask: what are the current alternatives to H? If there is now a viable alternative that explains E, then P(E|~H) is higher, so the credits for GR go down. 
    - However, if the rival is later disconfirmed, then the credits go back up. 
    - **In short**: The credits are dynamic and depend on the current state of rival theories.

  **Case 2: Programme B's Gut Metabolite Hypothesis**
  - H: A specific gut metabolite drives insulin resistance.
  - E: A cohort dataset showing that this metabolite tracks insulin resistance (and it was picked from a panel of dozens by fitting to this dataset).

  - **Step 0**: Was E known before H? The data existed, but the specific analysis (this metabolite being the predictor) was done as part of building H. So the analysis is not novel? Actually, the analysis that produced the link between this metabolite and insulin resistance in this dataset was done to build H. So the E we are considering is the result of that analysis. 
    - **Crucial point**: The E is the statistical association in this dataset. But that association was not known until the team did the analysis to build H. So is it old or new? 
    - The data is old, but the quantity (the correlation for this metabolite) is new. However, it was computed specifically to build H. 
    - **Step 0**: If the analysis was done after H was proposed? No, because H was built by looking at the data. So the analysis was done to build H. Therefore, E (the result) was known at the time H was formulated. 
    - Actually, H was built using E. So we go to Step 1.

  - **Step 1**: Was E used to construct H? Absolutely. The team picked the metabolite that best fit the data. So stop: zero credits. 

  - **But wait**: The team might argue that they didn't know E before they built H. But that's because E is defined as the association for this metabolite. The data was there, and they mined it to find a metabolite that worked. This is classic overfitting. 
    - **Conclusion**: Zero credits for this E. 

  - **What if they have other evidence?** Our procedure is per (H,E) pair. This E is tainted. But they might have other evidence (e.g., a different cohort, or experimental data) that was not used in construction. We only zero out this E.

  - **Hard truth**: This is the problem of double-dipping. The team used this dataset to build H, so it cannot also be used to confirm H. They need new data.

  **Case 3: Retrodiction of a New Quantity from Old Data**
  - H: A theory that predicts a specific quantity (say, the ratio of two proteins in a pathway) to be in a narrow range.
  - E: The value of that ratio computed from an old dataset (which had the raw data but nobody had computed the ratio before).

  - **Step 0**: Was the analysis (computing the ratio) done after H was proposed? 
    - If yes, then it's a novel prediction. Go to Step 5. 
    - If no (if it was done before H), then it's old. But note: if the analysis was done after H and because of H, then it's novel. 
    - So: if the analysis was done after H, it's novel. 

  - **What single change would flip the answer?**: If the analysis was done before H was proposed (and was known to the proposers of H), then it becomes old evidence. Then we go to Step 1: was it used to construct H? If yes, zero. If no, then Step 2: was it an anomaly? etc.

  **What the Procedure Can't Do (Limitations):**

  - **Misfires**:
    - **Historical Reconstruction Errors**: If we misjudge whether E was an anomaly or whether auxiliaries were ad hoc, we assign wrong credits.
    - **Theoretical Underdetermination**: When ~H is too vague, we cannot assign P(E|~H) well. Our fallback (historical surprise) is subjective.
    - **Novelty Fading**: Over time, as more theories explain E, the credit for H decreases. But if H was the first, it might have been more important. Our method doesn't capture historical impact, only current likelihood ratio.
    - **Ad Hoc Auxiliaries**: If an auxiliary is introduced and later confirmed, our initial low assignment might be too harsh. But we reassess periodically.

  - **Settled by Fiat**:
    - We treat "used in construction" (Step 1) as a showstopper (zero credits). But sometimes a hypothesis is constructed with E and then confirmed by other evidence. We only zero out that E.
    - We treat the anomaly status (Step 2) as binary, but anomalies come in degrees.
    - We assign likelihood ratios in bands (low, medium, high) but the actual numbers are rough.

  - **What to Tell the Panel**:
    - The credits are not precise probabilities. They are heuristic scores that reflect the current state of evidence relative to alternatives.
    - They are dynamic: as new theories emerge, the credits for old evidence can change.
    - The procedure is designed to avoid double counting and to reward genuine predictive success over accommodation.
    - The credits for a given E are not permanent; they can go up or down as science evolves.

  **Final Note**: This procedure requires training the team to make consistent judgments, especially on what counts as "used in construction" and "anomaly". Regular calibration sessions are recommended.
answer: |-
  ### **Brainstorming: Distinctions from Old-Evidence Literature & Operational Viability**
  I'll start by outlining key distinctions from Bayesian confirmation theory's "old evidence" literature, flagging which can be operationalized into a checklist and which are hopeless in practice. The core challenge is that if evidence \(E\) is already in background knowledge \(K\), \(P(E|K) = 1\), making the likelihood ratio \(P(E|H \wedge K)/P(E|\neg H \wedge K) = 1\) (0 dB). But intuitively, \(E\) *can* confirm \(H\) if \(H\) explains a known anomaly, while it *cannot* if \(H\) was reverse-engineered from \(E\). The literature offers nuanced solutions, but most are impractical for your 40-minute time constraint. Here’s the breakdown:

  | **Distinction** | **Source** | **Viable in Practice?** | **Reason for Inclusion/Dropping** |
  |-----------------|------------|--------------------------|-----------------------------------|
  | **1. Logical entailment in \(K\)** | Glymour (1980) | **Hopeless** | Requires agents to be logically omniscient. In practice, no team can recompute all entailments of \(K\) in real-time. |
  | **2. Counterfactual degree of belief** | Garber (1983), Jeffrey (1983) | **Hopeless** | Relies on reconstructing historical beliefs ("What would you have thought if \(E\) were unknown?"). Too speculative and time-consuming. |
  | **3. \(H\) entailing \(E\) via new auxiliaries** | Howson & Urbach (1993) | **Viable (with caveats)** | Auxiliaries \(A\) are tractable: we can check if \(A\) were adjusted *post-hoc* to fit \(E\). Step 3 in the procedure handles this. |
  | **4. Anomaly vs. non-anomaly \(E\)** | Kuhn (1962), Lakatos (1970) | **Viable** | Anomaly status can be assessed via literature review (e.g., was \(E\) cited as unexplained?). Clear "escalate" trigger if ambiguous. |
  | **5. Use of \(E\) in constructing \(H\)** | Worrall (2010) | **Viable** | Construction is factual (e.g., \(E\) cited in \(H\)'s proposal). Step 1 flags this for zero credits. |
  | **6. New quantity from old data** | Mayo (1996) | **Viable** | Operationalized by checking when the analysis was run (pre/post \(H\)). Step 0 handles it as a novel prediction. |
  | **7. Avoiding double-counting** | Dawid (2013) | **Viable** | Track \(E\)'s role in construction vs. testing. Step 1 and Step 5d handle this. |
  | **8. Surprise as proxy for \(P(E|\neg H)\)** | Salmon (1990) | **Viable (judgment call)** | Fallback when probabilities are incalculable. Relies on field consensus (escalate if unclear). |

  **Why drop Garber/Jeffrey?** They require imagining a counterfactual world where \(E\) is unknown, then assigning \(P(E|H)\) and \(P(E|\neg H)\) in that state. This demands speculative historical psychology—impossible in 40 minutes.  
  **Why keep anomaly/auxiliaries?** These are observable from literature and methods sections. Anomaly status (e.g., Mercury’s orbit) and ad-hoc auxiliaries (e.g., epicycles) have clear empirical footprints.

  ---

  ### **The Procedure: Step-by-Step for Non-Philosophers**
  **Inputs**: Hypothesis \(H\), evidence \(E\), timeline of \(E\) and \(H\), literature on pre-\(H\) explanations of \(E\).  
  **Output**: Log-likelihood ratio (dB) or decision to stop/zero/escalate.  
  **Time Budget**: 40 min per \((H,E)\) pair. Use pre-filled templates for consistency.  
  **Key Principles**:  
  - **Stop early** if \(E\) is invalid for confirmation.  
  - **Escalate** when judgment is needed (don’t fake objectivity).  
  - **Document**: Write down key facts (e.g., "Auxiliary A proposed in 2020, untested until 2023").  

  #### **Ordered Steps**  
  **Step 0: Novel Prediction Check**  
  - **Question**: Was \(E\) (or the analysis producing \(E\)) first observed/computed *after* \(H\) was publicly proposed?  
  - **Sufficient answer**: Yes, if publication date of \(E\)'s analysis > publication date of \(H\).  
  - **Stop/Proceed**: If **yes**, treat as novel prediction → **go to Step 5**. If **no**, \(E\) is old → **go to Step 1**.  
  - **Write down**: "E novel: analysis first run [date], H proposed [date]. Proceed to Step 5."  

  **Step 1: Construction Check**  
  - **Question**: Was \(E\) explicitly used to construct, select, or calibrate \(H\)?  
  - **Sufficient answer**:  
    - **Yes**: \(H\) cites \(E\) as motivation; \(E\) used in model-fitting for \(H\).  
    - **No**: No mention of \(E\) in \(H\)'s proposal; \(E\) was ignored/dismissed pre-\(H\).  
  - **Stop/Proceed**:  
    - If **yes** → **stop, assign 0 dB**. Reason: \(E\) is built into \(H\) (no new information).  
    - If **no** → **go to Step 2**.  
    - If **unclear** (e.g., \(E\) used to select between \(H\) variants) → **escalate to panel**.  
  - **Write down**: "E used in construction? [Yes/No/Escalate]. If yes: 0 dB."  

  **Step 2: Anomaly Status**  
  - **Question**: Pre-\(H\), was \(E\) considered an *unexplained anomaly* for dominant theories?  
  - **Sufficient answer**:  
    - **Anomaly**: Review articles pre-\(H\) call \(E\) "puzzling," "inconsistent," or "unsolved."  
    - **Non-anomaly**: \(E\) had a well-accepted explanation pre-\(H\).  
  - **Proceed**:  
    - If **anomaly** → **go to Step 3**.  
    - If **non-anomaly** → **go to Step 4**.  
    - If **unclear** (e.g., conflicting reviews) → **escalate to panel**.  
  - **Write down**: "Pre-H anomaly? [Anomaly/Non-anomaly/Escalate]. Citations: [e.g., Smith et al. 1990]."  

  **Step 3: Anomaly Assessment (Auxiliaries)**  
  - **Question**: Does \(H\) explain \(E\) only with auxiliaries \(A\) that were adjusted *post-hoc*?  
  - **Sufficient answer**:  
    - **Ad-hoc \(A\)**: \(A\) proposed/refined alongside \(H\) to fit \(E\); no prior independent support.  
    - **Independent \(A\)**: \(A\) well-established pre-\(H\) (e.g., textbook knowledge).  
  - **Stop/Proceed**:  
    - If **ad-hoc \(A\)** → **assign 0–3 dB (minimal credit)**. Reason: Risk of overfitting.  
    - If **independent \(A\)** → **go to Step 5 (high credit likely)**.  
    - If **unclear** → **escalate to panel**.  
  - **Write down**: "Auxiliaries ad-hoc? [Yes/No/Escalate]. If yes: assign 1–3 dB. Details: [e.g., A proposed in 2015, first tested in 2022]."  

  **Step 4: Non-Anomalous Evidence Check**  
  - **Question**: Is \(E\) "old data, new quantity" (re-analysis post-\(H\)), or does \(H\) explain \(E\) better than pre-\(H\) theories?  
  - **Sufficient answer**:  
    - **New quantity**: Analysis producing \(E\) run post-\(H\) because \(H\) predicted it.  
    - **Novel explanation**: \(H\) explains \(E\) via a new mechanism (e.g., gravity vs. epicycles).  
    - **No novelty**: \(H\)’s explanation is functionally identical to pre-\(H\) theories.  
  - **Proceed**:  
    - If **new quantity** → **treat as novel: go to Step 5**.  
    - If **novel explanation** → **go to Step 5 (moderate credit)**.  
    - If **no novelty** → **stop, assign 0 dB**.  
    - If **unclear** → **escalate to panel**.  
  - **Write down**: "New quantity/novel explanation? [Yes/No/Escalate]. If no: 0 dB."  

  **Step 5: Assign Likelihood Ratio (dB)**  
  - **Question**: What was \(P(E|H \wedge K)/P(E|\neg H \wedge K)\) at \(H\)’s proposal time? Estimate via:  
    - (a) Predictiveness of \(H\) (expected \(E\)? → \(P(E|H) \approx 1\)).  
    - (b) Surprise under \(\neg H\) (did alternatives expect \(E\)? → \(P(E|\neg H)\) low if surprising).  
  - **Method**:  
    - **Historical surprise**: Was \(E\) considered "shocking" pre-\(H\)? Use field consensus (reviews, textbooks).  
    - **Alternatives**: What did dominant pre-\(H\) theories predict for \(E\)?  
  - **Assignment**:  
    - **High (10–20 dB)**: \(E\) expected under \(H\), shocking under \(\neg H\) (e.g., Mercury).  
    - **Medium (5–10 dB)**: \(E\) more likely under \(H\), but \(\neg H\) didn’t rule it out.  
    - **Low (1–5 dB)**: \(E\) slightly more likely under \(H\).  
    - **Unassignable**: If no basis for judgment → **escalate to panel**.  
  - **Write down**:  
    - "P(E|H) high? [Yes/No]. P(E|¬H) low? [Yes/No]. Field surprised by E? [Yes/No].  
    - Assign [X] dB. If unassignable: escalate."  

  **Double-Counting Safeguard**: If \(E\) was used in Step 1 (construction) but not stopped, reduce dB by 50% in Step 5. Document: "Discount: E partially used in construction."

  ---

  ### **Case Applications**
  #### **Case 1: Gravitational Theory (1910s) & Mercury’s Orbit**
  - **H**: General relativity (GR).  
  - **E**: Anomalous precession of Mercury’s orbit (43 arcsec/century).  
  - **Facts**: \(E\) known since 1859; GR proposed in 1915 without targeting \(E\).  
  - **Procedure**:  
    1. **Step 0**: \(E\) old → Step 1.  
    2. **Step 1**: \(E\) *not* used to construct GR (Einstein derived GR independently) → Step 2.  
    3. **Step 2**: \(E\) was an open anomaly (Newtonian physics failed to explain) → Step 3.  
    4. **Step 3**: Auxiliaries (field equations) were *independent* (math existed pre-GR) → Step 5.  
    5. **Step 5**:  
       - \(P(E|H) \approx 1\) (GR entailed \(E\)).  
       - \(P(E|\neg H)\) very low (Newtonian physics + Vulcan hypothesis failed; field was surprised).  
       - Assign **20 dB** (high: resolves a major anomaly).  
  - **Comparison to novel prediction**: A novel prediction (e.g., light bending) might get 20–30 dB. Mercury earns high credit but slightly less than a true novelty (due to old-evidence discount).  
  - **Rival explanation**:  
    - If a rival soaks up the anomaly (e.g., modified gravity), reassess at next cycle:  
      - In **Step 5**, update \(\neg H\) to include the rival. If it explains \(E\), \(P(E|\neg H)\) increases → credits for GR **decrease immediately** (e.g., to 10 dB).  
    - Credits don’t "come back" if the rival is falsified; we reassess then.  

  #### **Case 2: Programme B’s Gut Metabolite (Problem Child)**  
  - **H**: Metabolite M causes insulin resistance.  
  - **E**: Cohort data showing M correlates with insulin resistance.  
  - **Facts**: M was selected from a panel by mining this dataset.  
  - **Procedure**:  
    1. **Step 0**: \(E\) old data, but analysis (M’s correlation) is new → Step 1.  
    2. **Step 1**: \(E\) *was used to construct \(H\)* (M picked because it fit \(E\)) → **stop, 0 dB**.  
  - **Hard truth**: This is textbook double-counting. \(H\) was built to fit \(E\), so \(E\) cannot confirm \(H\). The team’s "strong support" is an illusion. To earn credits, they need *new* data (e.g., a different cohort).  

  #### **Case 3: Retrodiction of New Quantity**  
  - **H**: Theory predicting quantity Q (e.g., neutron star mass distribution).  
  - **E**: Q computed from old dataset post-\(H\).  
  - **Facts**: Old data existed; Q first calculated after \(H\) predicted it.  
  - **Procedure**:  
    1. **Step 0**: Analysis producing \(E\) (computing Q) run *after* \(H\) → **novel prediction: go to Step 5**.  
    2. **Step 5**:  
       - If \(H\) specified Q tightly, \(P(E|H) \approx 1\).  
       - If alternatives didn’t predict Q, \(P(E|\neg H)\) low → assign **10–15 dB**.  
  - **Flip the answer**: If Q was computed *before* \(H\) (even if unnoticed), \(E\) is old → **Step 1**. If \(H\) was then built using \(E\) → **0 dB**.  

  ---

  ### **Limitations and Panel Guidance**  
  **What the Procedure Can’t Do (Even When Run Correctly)**:  
  - **Misfire 1**: When \(H\) explains \(E\) with *independently confirmed* ad-hoc auxiliaries (e.g., Higgs mechanism). The procedure (Step 3) assigns low credit initially, but auxiliaries may later be validated. Reassessment fixes this.  
  - **Misfire 2**: When pre-\(H\) theories are too vague to assess \(P(E|\neg H)\). Fallback to "surprise" is subjective.  
  - **Misfire 3**: If \(E\) was an anomaly but all theories (including \(H\)) explain it poorly. Procedure assigns credit, but it may be undeserved.  

  **Settled by Fiat, Not Argument**:  
  - Step 1’s "used in construction" is binary (0 dB or proceed). Ignores degrees of influence.  
  - Step 3’s "ad-hoc auxiliaries" is yes/no; doesn’t capture partial independence.  
  - dB bands (low/medium/high) are arbitrary; 5–10 dB isn’t rigorously quantified.  

  **What to Tell the Panel**:  
  > "Credits are heuristic scores, not precise probabilities. They:  
  > - **Dynamically change** as alternatives evolve (e.g., rivals can reduce credits).  
  > - **Ignore historical impact** (e.g., Mercury confirmed GR but credits now depend on current rivals).  
  > - **Penalize self-fulfilling prophecies** (e.g., data-mining earns 0 dB).  
  > Trust the direction (higher dB = stronger confirmation), but not the exact value. Disputes are escalated to avoid false precision."  

  This procedure prioritizes operationalizability over philosophical purity. It stops early to save time, escalates judgment calls, and penalizes circularity—which is what you need for evidence assessment under constraints.
