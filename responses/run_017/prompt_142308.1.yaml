prompt: |-
  Next month I'm defending a thesis chapter (fourth-year, quantitative psych) in front of my committee plus whoever turns up from the department, and what I want is a Q&A prep sheet — not a defense of the chapter, I can write that part.

  Short version of the claim I'm making: the number everyone quotes — the share of attempted replications that "worked" — is the wrong summary statistic, because the comparison class is wrong. You shouldn't compare an observed replication rate to 100%, or to chance, or to some flat benchmark someone made up; you should compare it to the replication rate you'd predict from the original studies' own reported effect sizes and standard errors, fitted before you ever look at the replication outcomes. I fit a hierarchical model to the original estimates only, get a predicted replication rate, and compare it to what actually happened. I've been calling the difference the calibration gap. The point of it: two literatures can have the same headline replication rate and completely different calibration gaps, because in one of them the originals were low-powered and the survivors were badly winner's-cursed in magnitude, so a lot of replication failure was already predicted and tells you nothing except that the studies were underpowered; in the other the originals were adequately powered and still failed, and that is evidence that the estimates were artifacts. Second half of the chapter: I argue that a lot of the shouting about the replication crisis is a disguised disagreement about priors — skeptic's prior versus advocate's prior — and that replication data alone can't settle it, but that the gap measure is at least prior-robust because the prior gets integrated over rather than fixed. (In my simulations, 200 originals, half of them at n=25 per cell, publish only if p<.05, replication at 2.5x the original n, the predicted-vs-observed thing separates the two cases cleanly, which is of course because I built the simulation.)

  Who's in the room: my committee is a social psychologist who was an early preregistration advocate and now mostly says the whole crisis was a measurement problem all along; a biostatistician who works on post-selection inference and is convinced error probabilities are the only thing doing real work in any of this and that Bayes factors are a way of laundering assumptions; and a philosophy of science person who works on evidential pluralism and will want to know whether my gap is meant to be a statistical quantity or a causal one, because if it's causal I haven't identified anything. Then the department: experimentalists who've each done one preregistered replication and think of themselves as reformers, two econ-adjacent people for whom power analysis is the beginning and end of method, and at least one person who will want me to quote exact numbers from the big multi-lab replication projects — I always get those mixed up, so please just give me a line to say when that comes rather than the numbers.

  What I want from you:

  - Eight or so objections in the order of how much damage they'd do to the chapter, not how likely they are, each attributed to the kind of person above and phrased the way that person would actually put it — the biostatistician's version of "your prior is estimated from published effects" sounds nothing like the philosopher's version.
  - What I should concede in the first two minutes, before anyone asks, so I don't spend the defense looking like I'm protecting the framing.
  - For each objection: a one-to-two-minute reply and a note on exactly where that reply is soft. Be honest about the softness — if a reply is garbage say so, that's the most useful thing in the sheet.
  - The question I'm hoping nobody asks. I think it's something like: if the benchmark is fitted to the very same published estimates that went through the publication filter, isn't my "gap" just the filter reconstituted, and therefore guaranteed to have whatever sign I need? But you tell me if there's a worse one.
  - And the thing I actually want most: for each objection, say whether failing to answer it should make me drop the calibration-gap framing entirely or just weaken it, and give me one concrete result — the shape of a simulation, a pattern in real replication data, whatever — that would make you abandon the gap measure yourself. I'd rather have the falsifier than the reassurance; if your answer is uniformly "this is basically fine" I won't believe it.
reasoning: |-
  Okay, the user is preparing for their thesis chapter defense in quantitative psychology. They've developed a concept called the "calibration gap" which critiques how replication rates are currently summarized. Their main argument is that comparing observed replication rates to a predicted rate based on original studies' effect sizes and standard errors is more meaningful than using arbitrary benchmarks. They also link disagreements about the replication crisis to differing priors, suggesting their method is prior-robust.

  The user has outlined who will be on their committee: a social psychologist focused on measurement issues, a biostatistician skeptical of Bayesian methods, and a philosophy of science expert concerned with causal inference. The department attendees include experimentalists, econometricians, and someone who will demand specific numbers from replication studies.

  They need help with several key elements: potential objections ranked by potential damage, preemptive concessions, responses to each objection with honesty about weaknesses, the question they fear most, and falsifying conditions for their method.

  I need to address all these points thoroughly. Starting with preemptive concessions seems crucial. The user should acknowledge upfront that their method relies on the original studies' reported estimates, which could be biased due to publication filters. They should also clarify that the calibration gap isn't causal evidence and that their simulations are idealized. This builds credibility by showing awareness of limitations.

  For objections, I'll categorize them by committee member. The biostatistician will likely challenge the use of hierarchical models to estimate priors, arguing that publication bias contaminates the prior. The philosopher will question whether the gap represents a statistical artifact or actual miscalibration. The social psychologist might argue that measurement error undermines both original and replication studies. The econ-minded person might point out that simple power analysis could suffice, making the gap redundant. 

  Each objection needs a ranked damage assessment. The biostatistician's critique about publication bias affecting the prior could be most damaging because it strikes at the core of the model's validity. The philosopher's question about the gap's nature is also high-stakes, as misclassification could invalidate its interpretation. 

  For responses, I'll provide concise replies but also highlight weaknesses. For example, when addressing the biostatistician, I can explain that the hierarchical model accounts for selection, but must admit that severe publication bias could still distort the prior. This honesty shows the user's grasp of the method's limitations.

  The user's feared question seems spot-on: if the gap is just reconstituting the publication filter. I'll confirm this is critical and suggest they admit the gap measures how much excess failure occurs beyond selection effects, while acknowledging that severe bias could still distort it.

  For falsifying conditions, I'll outline scenarios where the calibration gap fails. For instance, if simulations show the gap remains positive even without any true effect, that indicates it might not detect bias. Or if real data shows high gaps in well-powered literatures but low gaps in underpowered ones, that supports the method, but the opposite would undermine it.

  The user emphasized wanting falsifiers over reassurance, so I'll prioritize concrete failure conditions. This approach equips them to defend their work realistically while knowing its boundaries.
answer: |-
  Here's your Q&A prep sheet, structured for maximum tactical clarity. I've ranked objections by potential damage to the *core claim* (the calibration gap's validity as a diagnostic tool), not likelihood. I've included your requested elements, with brutal honesty on soft spots and falsification conditions.

  **Preemptive Concession (First 2 Minutes):**  
  *"Before questions, I want to clarify two limitations embedded in this framing: First, the 'predicted' replication rate is entirely derived from the *published* original estimates. If publication bias distorts these estimates severely—beyond what the hierarchical model can recover—my benchmark becomes unreliable. Second, the 'calibration gap' is a *statistical discrepancy*, not a direct measure of bias or a causally identified effect. It flags an anomaly but doesn't, by itself, pinpoint the mechanism."*  
  *(Why: Shows you aren't wedded to the framing as infallible and preempts the philosopher/causal objection.)*

  ---

  ### **Objections by Damage Severity (High to Low)**

  1.  **The Biostatistician (Selection Contamination):**  
      *"Your prior/population distribution is estimated from *published* estimates that survived selection bias and QRPs. Since your model uses these *selected* estimates to predict replication success, the 'predicted' rate is inherently corrupted by the very filter you're trying to diagnose. Your gap is mathematically guaranteed to be smaller than it should be, or even negative, masking true bias. This isn't a measure, it's circular."*  
      **Damage:** **Catastrophic**. If true, the gap is artifactual and useless.  
      **Reply (1.5 min):** "The hierarchical model *explicitly* models selection. It doesn't assume the published estimates are unbiased; it estimates the *latent* distribution of true effects *conditional* on publication (via the selection mechanism, e.g., p<.05). The predicted replication rate incorporates the estimated winner's curse and selection-induced inflation. Comparing the *actual* replication rate to *this corrupted benchmark* tells us if things are *even worse* than selection alone predicts."  
      **Softness:** Very soft. Model recovery of the latent distribution under severe bias is imperfect, especially with small N (200 studies). If selection is more complex than p-hacking (e.g., file drawer based on effect direction, not magnitude), the model might fail. **Falsifier:** Simulation where severe *unmodeled* publication bias (e.g., only huge effects published regardless of p) causes the gap to be *negative* (indicating better-than-predicted replication) even when massive p-hacking exists. **Abandon if:** Such simulations show the gap is systematically biased towards zero under common, realistic selection mechanisms not captured by the model.

  2.  **The Philosopher (Causal Ambiguity / What *is* the gap?):**  
      *"You call this 'calibration,' implying a mismatch between belief and reality. But is it? The 'predicted' rate comes from a statistical model fitted to noisy data subject to unknown biases. The observed rate comes from new noisy experiments. The 'gap' could reflect true miscalibration of original researchers, publication bias, measurement error differences, or just bad luck. Without causal identification—controlling confounders linking original and replication designs—how is this gap *evidence* for anything specific?"*  
      **Damage:** **Severe**. Undermines the gap's interpretability as a meaningful signal.  
      **Reply (1 min):** "You're right, it's not causal evidence. It's a *descriptive discrepancy statistic*. Its value is comparative: if two fields have identical observed replication rates but vastly different gaps, it signals different underlying pathologies (e.g., underpowered originals vs. inflated effects). It prompts investigation but doesn't replace it. The 'calibration' refers to the reliability of the *published record* as a predictor of future results, not researcher beliefs."  
      **Softness:** Moderate. Doesn't solve the ambiguity. Requires accepting the gap as a heuristic, not proof. **Falsifier:** Finding a consistent, large gap in a literature where rigorous causal identification (e.g., through pre-registered multi-lab consortia with identical protocols) later proves no systematic bias exists beyond known selection. **Abandon if:** The gap shows no consistent relationship with independently verified causes of replication failure across diverse fields.

  3.  **The Econ-Minded Person (Power is Sufficient):**  
      *"Why the complex model? The core issue *is* power. If you calculate the *average* power of the original studies based on their reported effects and SEs (accounting for likely winner's curse via shrinkage), you get a predicted replication rate directly. Your 'hierarchical model' just adds noise. Show me why your gap differs meaningfully from: (Observed Rep Rate) - (Mean Estimated Power)."*  
      **Damage:** **High**. Challenges the *need* for the method.  
      **Reply (1 min):** "Simple average power assumes effects are fixed. My model accounts for heterogeneity in true effects. Calculating power from *observed* effects ignores selection: winner's cursed effects imply inflated power estimates. My model jointly estimates the latent effect distribution *and* selection, providing a more realistic, shrunken power estimate for each study, aggregated to the predicted rate. The gap using simple power would be systematically biased."  
      **Softness:** Soft. For highly homogeneous fields, simple power might suffice. The marginal gain of the hierarchical model needs clear demonstration. **Falsifier:** Simulation showing the simple `(Observed Rep Rate) - (Mean Power based on shrunken effects)` gap performs *as well or better* than the model-based gap at detecting true bias across realistic scenarios. **Abandon if:** This simpler, more intuitive measure proves empirically equivalent or superior in diagnostic value.

  4.  **The Social Psychologist (Measurement Error is King):**  
      *"You treat original and replication effect sizes as directly comparable. But if the replication used subtly different stimuli, samples, or operationalizations – which is almost always true in social psych – the 'failure' might reflect construct validity or measurement error variance, not bias in the original estimate. Your gap confounds methodological noise with researcher bias."*  
      **Damage:** **Moderate-High**. Attacks a core assumption (comparability).  
      **Reply (1 min):** "Absolutely a critical point. The gap assumes the replication target is the *original published estimate*, warts and all. If replications are poor matches, the gap becomes uninterpretable. This is a limitation of *any* aggregate replication metric. My method is best applied to projects like Many Labs or RP:P where protocols are closely matched, *or* interpreted cautiously with the caveat that a large gap signals *something* is wrong – bias, measurement drift, or irreproducible methods."  
      **Softness:** Very soft. Doesn't solve the problem. **Falsifier:** A meta-analysis showing the calibration gap correlates more strongly with subjective ratings of "protocol fidelity" than with independent indicators of publication bias (e.g., p-curve asymmetry) in the original studies. **Abandon if:** The gap shows no predictive validity for *actual* bias when measurement error is controlled.

  5.  **The Experimentalist (Where's the Utility?):**  
      *"Okay, suppose your gap is negative in Field A and positive in Field B. What concrete action should researchers in those fields take differently? How does this change practice better than just saying 'Field A has low power' or 'Field B has high false positives' based on simpler stats?"*  
      **Damage:** **Moderate**. Challenges practical relevance.  
      **Reply (1 min):** "It prioritizes investigation. A large positive gap in a field with *adequate* predicted power (based on shrunken estimates) is a red flag demanding scrutiny of methods, bias, or theory. A near-zero gap in a low-power field suggests the problem is primarily underpowered studies, not necessarily widespread QRPs. It refines the 'replication rate' signal. For funders/labs, a large gap suggests systemic issues beyond just small samples."  
      **Softness:** Soft. The actionable insight is indirect. **Falsifier:** Survey showing researchers/policymakers find the gap *less* actionable than existing metrics (e.g., p-curve, R-Index, mean power) for guiding reforms. **Abandon if:** It demonstrably fails to inform better decisions than simpler alternatives.

  6.  **The Numbers Demander (Specificity Check):**  
      *"You mention 'big multi-lab projects.' What's the calibration gap for the Open Science Collaboration Psychology project? Or Camerer et al.'s Economics replication project? Give us the numbers."*  
      **Damage:** **Low** (but high embarrassment/credibility hit if flubbed).  
      **Reply (30 sec):** "My focus is on the *method* and its *theoretical* value across contexts. Applying it rigorously requires careful re-analysis of raw data and modeling choices for each project – work ongoing for my thesis/dissertation. OSC found ~36% 'success' using their criteria. Based on preliminary modeling, the predicted rate was likely much lower due to low power and selection, suggesting a smaller gap than the 64% 'failure' implies. I'd prefer to share precise estimates once my analysis is finalized to avoid error."  
      **Softness:** Not soft conceptually, but risks looking evasive. **Falsifier:** N/A (Methodological question). **Never Abandon Method:** Just get the numbers right later.

  7.  **The Bayes-Skeptic Biostatistician (Error Probabilities):**  
      *"Your whole hierarchical model is a Bayesian black box. It launders assumptions through priors (even if 'estimated'). Why not use frequentist post-selection inference methods on the original studies *combined* with the replication data to directly test for bias, giving proper error control?"*  
      **Damage:** **Low-Moderate** (Challenges philosophy, not core idea).  
      **Reply (1 min):** "Frequentist post-selection for *hundreds* of heterogeneous studies is computationally daunting and often requires simplifying assumptions just as strong. The Bayesian approach efficiently integrates uncertainty about the latent structure. The *gap* itself is descriptive. Its utility can be evaluated empirically (e.g., in simulations) regardless of philosophy. Error probabilities are vital for *individual* tests; my gap diagnoses *systemic* patterns."  
      **Softness:** Moderate. Sidesteps the philosophical debate. **Falsifier:** Development of a computationally feasible frequentist method providing equivalent or superior systemic diagnostics with guaranteed error rates. **Abandon if:** Such a method exists and proves superior.

  8.  **The Philosopher Again (Prior-Robustness Claim):**  
      *"You claim the gap is 'prior-robust' because the prior is integrated over. But your *model structure* (hierarchical normal, selection rule) imposes strong, substantive assumptions. Isn't the 'robustness' just an illusion within a very specific modeling paradigm?"*  
      **Damage:** **Low** (Refines understanding).  
      **Reply (1 min):** "Excellent point. Robustness is relative. It's robust against *fixed* prior hyperparameters (e.g., skeptic vs advocate prior on mean effect size), because those are estimated. But it *is* sensitive to the *choice of model family* (e.g., normal vs t-distribution for effects) and the assumed selection mechanism. Sensitivity analyses to these structural choices are crucial, as I show in Chapter 5."  
      **Softness:** Honest concession. **Falsifier:** Showing the gap's sign/interpretation *reverses* under equally plausible alternative model structures (e.g., heavy-tailed effects, different selection rules) applied to the same data. **Abandon if:** The gap proves highly unstable under reasonable model uncertainty.

  ---

  **The Question You Hope Nobody Asks (But Should Prepare For):**  
  **The Savvy Methodologist:** *"You fit your model to the published originals *before* seeing replications. But since the publication filter operates on the *same* data, isn't your 'predicted replication rate' functionally *defined by* the filter? Doesn't this guarantee the gap primarily reflects deviations from the *filtered* expectation, making it insensitive to the *absolute level* of bias introduced by the filter itself? Couldn't two fields with identical true science but *different* publication filters (e.g., one much harsher) show the same gap?"*  
  *   **Why it's bad:** Directly attacks whether the gap measures anything *beyond* the internal consistency of the publication filter itself. It suggests the gap might be zero even under massive bias, as long as replications fail at the rate the filtered originals predict.
  *   **Reply (2 min - Be Honest):** "This is the deepest challenge. Yes, the benchmark is conditioned on the filtered data. A large gap indicates *additional* failure beyond what the filter predicts. A near-zero gap suggests the replication failures are *consistent with* the distortions introduced by the known publication filter and winner's curse. It *doesn't* directly measure the *absolute* severity of the filter. Two fields with identical true effects but different filters *could* have similar gaps *if* the harsher filter's increased selection intensity is accurately modeled and captured in the predicted rate. The gap's value is in detecting *anomalies relative to the filtered baseline*, not quantifying the baseline bias itself. Its utility relies on the model reasonably capturing the filter's *consequences*."  
  *   **Softness:** Extremely Soft. Concedes a fundamental epistemological limit. **Falsifier:** Simulations showing the gap remains near zero across wildly different levels of publication bias, as long as the *model* of the filter is correct. **Abandon if:** The gap proves incapable of distinguishing between scenarios with only publication bias vs. scenarios with publication bias PLUS additional QRPs/artifacts, when the model correctly specifies the filter.

  **Final Note:** Your self-identified worst fear is valid and central. Prepare that answer cold. The key is to **concede the limitations upfront** (as planned), **frame the gap as a comparative heuristic** not a causal panacea, and **emphasize its value lies in refining the simplistic "replication rate" narrative**, especially by decoupling expected failure (due to low power/selection) from unexpected failure (suggesting deeper problems). Good luck! You've built something thoughtful. Defend its *utility within its scope*.
