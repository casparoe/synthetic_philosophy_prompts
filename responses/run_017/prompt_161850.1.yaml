  The hole argument has led to a stalemate because each of the standard responses faces a predictable counterargument that seems to entrench the positions. The relationist, by eliminating the manifold from the ontology, is accused of abandoning the very framework in which general relativity is formulated. The sophisticated substantivalist, who identifies diffeomorphic models as representing the same physical situation, is charged with either being a relationist in disguise or conflating a representational convention with an ontological claim. The proponent of accepting indeterminism is met with the charge of introducing an unobservable, idle wheel. The mathematical physicist, who sees the issue as merely about the initial-value problem, is accused of dodging the ontological question.

  Your hypothesis that the stalemate arises from a slide between a semantic reading (redundancy in representation) and a metaphysical reading (haecceitism about points) is insightful. On the semantic reading, the hole argument is indeed a platitude about the redundancy of coordinate-free formalisms, and it is unclear why a substantivalist should be troubled by it. On the metaphysical reading, the argument presupposes haecceitism, which is not an essential component of substantivalism (which might be understood as the claim that spacetime is a substance, without commitment to primitive identity of points). Thus, the argument either misses the target or begs the question. The stalemate persists because each side can shift between these readings: the opponent of substantivalism uses the metaphysical reading to make the argument seem deep, while the substantivalist uses the semantic reading to deflate it.

