answer: |-
  **Weakest link: You're conflating current utility with proper function—the wax helps now, but that benefit doesn't *explain the trait's persistence*.**  

  Your frog's glands *are* malfunctioning—but only relative to their *selected historical capacity*: producing waterproofing wax. The antifungal effect is a lucky accident—a side-effect that happens to be lifesaving now. But accidents aren't functions. If I trip and knock a mug off a table, saving you from a falling brick, my clumsiness isn't *for* lifesaving; it’s just fortuitous. The wax persists *because* ancestral selection for waterproofing built a robust developmental pathway—not because the fungus maintains it. Without historical selection, you've got a beneficial *effect*, not a *purpose*.  

  **On the "dying frog" intuition:** Your field biologist *would* call the glandless frog diseased—but that’s because she’s *assuming* the trait’s historical norm! She’s invoking the *selected* capacity to produce wax as the benchmark for health. Strip away history, and "malfunction" loses meaning—why isn’t the mutant frog just "adapted" to a fungus-free world? Your intuition smuggles in the etiological view you’re rejecting.  

  *(Afterthought: Your friend’s right—that "diseased" intuition is ours. You can’t borrow it while denying its foundation.)*
