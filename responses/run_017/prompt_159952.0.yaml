  We are constructing an interview with a philosopher of mind who defends a non-substitutive eliminative materialism about belief and desire. Her key claims are:
  1. There is no phenomenon of being guided by representations of the world (no beliefs/desires as real states).
  2. Folk psychology is a useful compression but not a description of real structure.
  3. She keeps attitude-talk at the "stance level" (a fiction in our self-model) but denies the ontology.
  4. She bites the "upstream bullet": no inference, evidence, justification, knowledge in normative senses; rebuilds epistemology as control theory (calibrated, world-tracking dynamics).
  5. She is a realist about conscious experience but eliminates propositional attitudes.

  We need 8-10 questions, each with:
  - The question
  - A short note on her likely reply
  - A follow-up question keyed to that reply

  Pressure points to cover (in a logical order):
  A. Reflexive worry: the view is stated in a form that presupposes what it denies (e.g., her assertion "there are no beliefs" — what is it doing if no truth conditions?).
  B. Success of folk psychology: predictive/explanatory track record in everyday life and human sciences; can such a successful compression be merely instrumental?
  C. Cognitive neuroscience: already posits things that look like attitudes (Bayesian models, prediction errors, etc.). Is refusing to call them beliefs/desires substantive or terminological?
  D. Asymmetry: experience stays, content goes. What becomes of intentionality? (If no content, what is conscious experience about?)
  E. Control-theory epistemology: have calibrated degrees of confidence really purged the normative? Does calibration sneak in the truth-norm? Can a view without inference be coherently argued for?

  Additional constraints:
  - Build at least two questions such that if she uses her stock moves ("that's stance-level talk" or "you're treating the model as the thing modeled"), it visibly costs her.
  - Last question: What evidence could count against the view? (Since it's an empirical bet, but she can reinterpret any candidate as non-content-bearing.)

  Tone: Respectful but attacking the strongest form.

  Let's structure the interview in a logical arc:

  1. Start with the reflexive worry (A) to set up the meta-issue about the status of her own claims.
  2. Then move to the empirical success of folk psychology (B) to challenge the eliminativist claim.
  3. Next, the neuroscience point (C) to show that even science seems to find attitude-like states.
  4. Then the asymmetry (D): how can experience be real without content?
  5. Follow with the control-theory epistemology (E) to challenge the rebuilding project.
  6. Finally, the question about falsifiability.

  We also need to build in the two "costly" questions for her stock moves.

  We'll aim for 8-10 questions. Let's outline:

  1. Question on reflexive worry (A).
  2. Follow-up to 1.
  3. Question on folk psychology success (B).
  4. Follow-up to 3 (or a second question on B if needed).
  5. Question on neuroscience (C) and whether it's terminological.
  6. Follow-up to 5 (or a second question on C).
  7. Question on asymmetry (D).
  8. Follow-up to 7.
  9. Question on control theory (E) — calibration and truth-norm.
  10. Question on inference and argument (E).
  11. Question on falsifiability (last).

  But we must also integrate the two "costly" questions. We can design two questions such that if she uses her stock moves, it creates a problem for her.

  Idea for a costly question on the stance-level move:
  - We can press on the stability of the stance-level fiction. If the fiction is load-bearing in our self-model, but there is no real belief, then how can we trust the fiction to do any work? And if we can, then isn't that work evidence of real structure?

  Idea for a costly question on the model/thing move:
  - In the context of neuroscience, if she says that the Bayesian quantities are just models, not the thing, then we can ask: what would the thing look like? How would we know if there were real content? If there is no answer, then the move becomes vacuous.

  Now, let's write the questions.

  Note: We are to provide 8-10 questions, each with:
  - Question
  - Likely reply
  - Follow-up

  We'll do 8 to be safe.

  Here we go:

  Question 1 (Reflexive worry, A):
  Your view denies the existence of beliefs and desires, but you make assertions that you presumably take to be true and justified by evidence. How do you avoid the charge that your own act of asserting the view presupposes the very things you deny? That is, doesn't asserting eliminativism require that you believe it and that you take it to be supported by reasons?

  Likely reply: She will say that her assertion is stance-level talk. It is part of the useful fiction that we adopt for communication and prediction. She doesn't literally believe it, but she is using the fiction in a way that is calibrated to the world.

  Follow-up: But if your assertion is only stance-level, then it has no truth value? Then why should we accept it as true? And if you say it is true in the same way that a fiction can be "true" (i.e., useful), then doesn't that collapse truth into utility, which would undermine the normative force of your argument?

  Question 2 (Folk psychology success, B):
  Folk psychology has an impressive track record: it allows us to predict and explain behavior in everyday life and in the human sciences (like economics or psychology). If it's just a fiction, why is it so successful? And in other domains, when we have a compression that successful (like thermodynamics or the gas laws), we take that as evidence that the compression is latching onto real structure. Why not here?

  Likely reply: She might say that folk psychology is successful because it is a good compression of a high-dimensional system (the brain), and compressions can be useful without being structurally isomorphic. She might draw an analogy to Newtonian mechanics: it was useful but not fundamentally true.

  Follow-up: But in the case of Newtonian mechanics, we now know that it is an approximation to a deeper theory (relativity and quantum mechanics). And that deeper theory explains why the compression works. In the case of folk psychology, if there is no deeper theory that posits real attitudes (as per your non-substitutive eliminativism), then what explains the success? Without an underlying structure, why would the compression work at all?

  Question 3 (Neuroscience, C):
  In cognitive neuroscience, we see models that posit internal states with content: Bayesian priors and posteriors, prediction errors, reward signals. These look a lot like beliefs and desires. What prevents us from identifying these with the attitudes? Is your denial that these are beliefs just a terminological point, or is there a substantive difference?

  Likely reply: She will likely say that these are mathematical constructs in a model, not real states with content. They are defined by their role in the model, but they don't have intrinsic intentionality. They are not about the world in the way folk psychology takes beliefs to be.

  Follow-up: But if these mathematical constructs are causally responsible for behavior and are updated by sensory input, doesn't that mean they are functioning as representations? And if so, how is that different from having content? If you deny that they have content, then what would it take for a state to have content? Is your view that content is an illusion?

  Question 4 (Costly for stock move: "model vs thing" in neuroscience):
  You say that the Bayesian quantities are just in the model, not in the system. But then, what would the system have to look like for it to contain real beliefs? If there is no possible evidence that could show that, then doesn't your move become unfalsifiable? And if it is unfalsifiable, how is your eliminativism an empirical bet?

  Likely reply: She might say that the empirical bet is that mature neuroscience will not posit content-bearing states. But note: she might use her stock move: these models are just models, not the thing.

  How it costs her: If she uses the stock move, then we press on what would count as a content-bearing state. If she says nothing could, then her view is not empirical. If she does specify, then we can look for that in the brain. But she might not want to specify because that would reify content.

  Follow-up: If no possible observation in neuroscience would count as discovering a belief, then isn't your claim that there are no beliefs non-empirical? And if so, how is it different from a metaphysical assertion?

  Question 5 (Asymmetry, D):
  You are a realist about conscious experience but eliminate propositional content. But conscious experiences are typically about something: my visual experience is of a chair, my thought is about the weather. If there is no content, what is the conscious experience? How can there be conscious experience without intentionality?

  Likely reply: She might say that conscious experience is non-representational. It is raw feel, qualia, without intentional content. Or she might say that intentionality is a stance-level feature we project.

  Follow-up: But in ordinary understanding, conscious experiences have intentionality: they are directed at objects. If you deny that, then what is the structure of conscious experience? And if you say that we project intentionality onto it at the stance level, then doesn't that projection require a real projector (us) who has beliefs about the experience? But you deny beliefs.

  Question 6 (Control theory epistemology, E - calibration):
  In your control-theory epistemology, you replace justification with calibration: a system is epistemically good if it is well-calibrated, tracking the world. But isn't calibration just a way of sneaking in the truth-norm? After all, a system is calibrated if its confidence levels match the true frequencies. So doesn't that presuppose truth?

  Likely reply: She might say that calibration is a naturalistic relation between internal states and the world, without normative force. It's a matter of functional coupling, not truth in the normative sense.

  Follow-up: But when you say we should aim for calibration, isn't that a normative claim? And if your view has no room for norms (since you eliminate justification), then why should we prefer calibrated systems? Without norms, isn't "should" just another stance-level fiction? But then, why prefer your epistemology?

  Question 7 (Control theory epistemology, E - inference and argument):
  Your view eliminates inference, since there are no beliefs to serve as premises and conclusions. Yet, you present arguments for your view. How can you coherently do that? And if you say that reasoning is just a dynamic process in the brain, then why should we take that process as leading to truth? Isn't that just another stance-level projection?

  Likely reply: She might say that the process of argumentation is a stance-level activity. We are using the fiction of inference to persuade, but it's not literally happening.

  Follow-up: But then, your own arguments are not really arguments? They are just causal processes that you hope will change our brain states? Doesn't that undermine any reason to accept them? If you are not giving reasons, why should we be moved?

  Question 8 (Falsifiability, last question):
  You frame eliminativism as an empirical bet about what mature psychology will posit. But you seem to have a strategy for reinterpreting any candidate successor state (like Bayesian representations) as non-content-bearing. So, what evidence could count against your view? How could we know if you are wrong?

  Likely reply: She might say that if neuroscience were to discover states that are intrinsically content-bearing, that would falsify it. But she might also say that such a discovery is impossible because content is not a natural property.

  Follow-up: But then, if the discovery of content-bearing states is impossible by your lights, isn't your bet empty? And if you can always reinterpret any finding as non-content-bearing, then isn't your view unfalsifiable? How is it a scientific bet rather than a dogma?

  Now, we have 8 questions. We covered all the pressure points and the constraints.

  But note: we have two questions that are costly for her stock moves:
  - Question 4 is designed to cost her the "model vs thing" move.
  - Question 1 and its follow-up, and also Question 7, might cost the "stance-level" move. We can also design another one explicitly.

  Alternatively, we can adjust to have one on each stock move. Question 1 already targets the stance-level move. Let's make Question 4 target the model/thing move.

  We also have a question on asymmetry (Question 5) and two on control theory (6 and 7).

  We can add one more if needed, but 8 is within the 8-10 range.

  Let me write them out in full.
answer: |-
  Below are eight interview questions designed to probe the core tensions in your guest's non-substitutive eliminative materialism. Each question includes:  
  - **The question itself**, phrased to respect her position while targeting its strongest form.  
  - **Likely reply**, based on her stated views (e.g., stance-level talk, model/thing distinction, upstream bullet).  
  - **Follow-up question**, keyed to her reply to maintain a logical spine and avoid disconnection.  

  The sequence builds an arc: it starts with meta-issues about her view's coherence (A), moves to empirical challenges (B and C), addresses the experience/content asymmetry (D), critiques the control-theory epistemology (E), and ends with falsifiability. Two questions (2 and 4) are engineered to make her stock moves ("that's stance-level talk" or "you're treating the model as the thing modeled") visibly costly—using them would expose circularity or vacuity. Tone is rigorous but charitable, assuming she defends a sophisticated position.

  ---

  ### **Question 1: Reflexive worry about truth-conditions**  
  **Question:** Your view denies the existence of beliefs, but you assert this denial as true and justified. If there are no beliefs, no normative evidence, and no inference, what is the status of your own assertion? Doesn’t presenting eliminativism as an argument presuppose the very things—reasons, justification, belief—that you eliminate?  
  **Likely reply:** She will invoke stance-level talk: her assertion is part of a useful, instrumental fiction for communication and prediction, not a literal description of ontology. She might compare it to a compatibilist "free will" reconstruction—a pragmatic tool without metaphysical commitment.  
  **Follow-up:** If your assertion is only stance-level, it lacks truth-conditions and becomes a fiction you don’t "believe." But then why treat it as more than a convenient story? If you insist it’s empirically supported, doesn’t that smuggled-in notion of "support" rely on the normative evidence you’ve eliminated?  

  ### **Question 2: Folk psychology’s success and the cost of "stance-level" talk**  
  **Question:** Folk psychology has a strong track record: it predicts behavior in everyday life and underlies human sciences like economics. In other domains (e.g., thermodynamics), successful compressions are backed by microstructure—why isn’t folk psychology’s success evidence of real structure, not just instrumentalism?  
  **Likely reply:** She will likely call this "stance-level talk": folk psychology is a high-dimensional compression, like Newtonian mechanics, useful without reflecting reality. She may add that its success stems from efficient coding, not ontology.  
  **Follow-up (costly for "stance-level" move):** If you dismiss this as stance-level, you’re using the fiction to explain the fiction—a circular defense. But if stance-level talk is purely instrumental, what explains its predictive edge? Without real structure, why doesn’t it fail randomly, like a broken compression algorithm? Doesn’t its reliability imply it’s tracking something real, making your instrumentalism ad hoc?  

  ### **Question 3: Cognitive neuroscience and attitude-like states**  
  **Question:** Neuroscience already posits contentful states: e.g., Bayesian priors (belief-like) or reward-prediction errors (desire-like). If these are real, causal, and track the world, why not call them beliefs? Is your refusal substantive—e.g., they lack intrinsic intentionality—or just terminological?  
  **Likely reply:** She will argue these are mathematical constructs in models, not ontologically real content. They’re "defined quantities" in a formal system (e.g., vectors in a neural network), not "aboutness" in the folk sense.  
  **Follow-up:** But if these constructs causally explain behavior and update via sensory input, they function as representations. How is this different from belief? If you concede they represent, you’ve substituted attitudes; if not, what would real content look like?  

  ### **Question 4: Neuroscience and the cost of "model/thing" distinction**  
  **Question:** You say neuroscientific models describe mathematical abstractions, not real content. But if we take the "model/thing" distinction seriously, what neural phenomenon would count as a real belief? If nothing could—because you define content as always modeled—isn’t your eliminativism unfalsifiable?  
  **Likely reply:** She might use her stock move: "You’re treating the model as the thing modeled." Genuine content would require intrinsic intentionality, which she denies exists; these models are tools, not discoveries.  
  **Follow-up (costly for "model/thing" move):** If you reject any neural state as content-bearing by definition, your view isn’t an empirical bet—it’s tautological. But you frame eliminativism as contingent on mature science. If no observation could ever confirm beliefs, how is this bet testable? Doesn’t this make eliminativism a dogma, not a scientific claim?  

  ### **Question 5: Asymmetry between experience and intentionality**  
  **Question:** You preserve conscious experience but eliminate propositional content. Yet ordinary experience seems intrinsically intentional—e.g., a pain is about damage, a perception is of an object. Without content, what is consciousness "of"? How can you be a realist about experience while denying what it’s about?  
  **Likely reply:** She will distinguish: consciousness is non-representational "qualia" or raw feeling; intentionality is a stance-level projection we impose, not an ontological feature.  
  **Follow-up:** But if intentionality is projected, who is the projector? If it’s us—agents "taking" experiences to be about things—doesn’t that projection require real beliefs? Yet you deny those. Isn’t this asymmetry unstable?  

  ### **Question 6: Control-theory epistemology and the truth-norm**  
  **Question:** You rebuild epistemology as calibrated, world-tracking dynamics. But calibration aims for confidence to match truth-frequencies—e.g., a 90% credence should be true 90% of the time. Isn’t this sneaking in the truth-norm through the back door, retaining what made beliefs suspicious?  
  **Likely reply:** She will argue calibration is a non-normative, causal relation: a system’s dynamics are "calibrated" if they covary with the environment via feedback loops, without "truth" as a normative ideal.  
  **Follow-up:** But when you say we "should" calibrate, that’s normative. If you reject norms upstream, why prefer calibrated systems? If it’s just for survival, that’s instrumental—but then, why trust your epistemology over a demon-induced fiction?  

  ### **Question 7: Coherence of arguments without inference**  
  **Question:** You eliminate inference, yet you present eliminativism as argued—e.g., from neuroscience or compression theory. Without beliefs as premises, how can arguments be coherent? If reasoning is just dynamics, why take it as truth-tracking?  
  **Likely reply:** She will call this stance-level activity: "argument" is a useful fiction for social dynamics, not literal inference. Her claims are patterns in a high-dimensional system, causally shaped by evidence.  
  **Follow-up:** But if your arguments are fictional, they aren’t reasons to accept eliminativism—they’re just noise. Doesn’t this make your view self-defeating? If we’re to "update" based on your claims, doesn’t that require the very notion of evidence you’ve eliminated?  

  ### **Question 8: Falsifiability of the empirical bet**  
  **Question:** You frame eliminativism as an empirical bet: mature psychology won’t posit irreducibly contentful states. But you reinterpret any candidate (e.g., Bayesian beliefs) as non-content-bearing mathematical objects. What evidence could falsify your view? If nothing can, is this bet meaningful?  
  **Likely reply:** She will likely say evidence for intrinsic intentionality—e.g., a neural state with non-derived "aboutness"—would falsify it, but she’ll argue this is impossible because content is always modeled.  
  **Follow-up:** If intrinsic intentionality is impossible by definition, your bet collapses into a semantic claim. But you call it empirical. If mature science posits "real beliefs" (e.g., neural states with causal-semantic properties), could you concede defeat, or would you always redescribe them? Doesn’t this risk making eliminativism non-empirical?  

  ---  
  **Rationale for the sequence**:  
  - Starts with **self-referential coherence (Q1)** to set up the meta-challenge.  
  - Moves to **empirical pressures (Q2–4)**: Q2 forces her to defend instrumentalism without circularity; Q3–4 target neuroscience, with Q4 making the "model/thing" move costly by exposing unfalsifiability.  
  - **Asymmetry (Q5)** comes next, highlighting tension in preserving experience but not content.  
  - **Epistemology (Q6–7)** challenges control theory: Q6 questions if it purges norms, and Q7 attacks argumentative coherence.  
  - Ends with **falsifiability (Q8)**, pressing her empirical bet.  
  - **Stock moves made costly**:  
    - Q2 pressures "stance-level" by showing it invites circularity and cannot explain predictive success.  
    - Q4 pressures "model/thing" by revealing how it risks unfalsifiability.  
  - No biographical questions; tone is incisive but fair—e.g., "steelmanning" by citing her distinctions (e.g., stance-level, calibration) before probing.  

  This structure ensures each question flows from the prior reply, maintaining spine while covering all requested pressure points. Total: 8 questions (within your 8–10 range).
