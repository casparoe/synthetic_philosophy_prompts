prompt: |-
  I am in the second year of a PPE degree, and I am taking an option this term on the ethics and politics of corruption. Less relevantly to my supervisor but more relevantly to my week, I chair a small registered student charity. We raise around £30,000 a year, employ one part-time administrator, have two academic trustees, and run a single programme: each summer we send six to ten student volunteers to a partner school in northern Ghana for five-week placements. Every year the same family of decision comes up — what we may give, to whom, when, and out of which budget line — and every year we improvise it in a committee meeting and then write something evasive in the minutes. I would like a procedure we can actually run instead.

  Constraints on it. It has to be usable by a committee of students with no legal training and no budget for advice, in about twenty minutes, with only what we can get out of our local coordinator by email. Eight steps at most. It should work prospectively, before a payment is made, and also retrospectively, as a test of decisions we have already taken and cannot now undo. It should produce a record: one or two sentences suitable for the minutes, in a yes form and a no form. We are vaguely aware that UK law is stricter here than we had assumed — something about payments made to speed up a routine administrative act, and about the point being whether an organisation has adequate procedures rather than whether any particular payment was made — but I do not want the procedure to rest on the legal position, which none of us properly understands. Nor do I want it to collapse into whatever the local norm happens to be: the whole subject of the course is that when in Rome is not an answer, and neither, plainly, is treating every departure from an impartial, arm's-length, rule-governed bureaucracy as corruption.

  Where I have got to in my own notes — please use it, repair it, or replace it, and tell me which you have done and why — is this. The wrong-making feature is not the transfer but a substitution: a consideration that is a reason for the recipient only because of a personal relationship is allowed to do the work that should be done by considerations internal to the recipient's role. On that way of putting it the question splits in two. First, does the recipient occupy a role that carries role-indexed reasons at all — a local, contestable question about what the institution actually is. Secondly, if so, is the transfer there in order to make a relation-indexed reason outweigh those, which does not look local at all. Two further thoughts I would like the procedure to respect. Most of the instruments we would instinctively reach for — receipts, value thresholds, declarations of interest — catch one-off, transaction-shaped cases and are close to useless against the slow, ongoing accumulation of an obligation, so the procedure needs something separate for that. And there is a difference between what we may ask our coordinator and what we must not: asking him directly whether something would be regarded as a bribe puts him in an impossible position, and we should not do it.

  So please give me, in order: a two- or three-sentence statement of the account of corruption the procedure operationalises, including where you think legitimate cross-cultural variation actually lives; then the procedure itself, with the questions in order, what would count as a sufficient answer to each, what to do when we cannot get the answer, at least one gate at which it stops with a no, and at least one point at which it hands the decision to a person — our senior trustee, say — on the ground that it is a question of values rather than fact. Then run it on three cases from last year.

  One. Our coordinator tells us that it is customary for a visiting organisation to make a small cash payment, around £40, to mark the signing of the memorandum of understanding with the school; the head teacher has asked for it through him; he advises that refusing would cause serious offence and could put the partnership at risk. Our trustees would call this a bribe. Several of our volunteers think it is a courtesy and that we are being stiff-necked.

  Two. At the end of a placement the committee votes to buy, from charity funds, a phone worth about £120 for the family that hosted a volunteer for five weeks. Nothing was asked for. The volunteer says the family was kind and poor. One trustee points out that word will get about, and that families may compete to host whichever volunteer is most generous.

  Three. Over three years our coordinator has built a friendship with an official in the district education office. The official now returns his calls first and quietly tells him which paperwork will move and when; nothing has ever been asked for, and nothing has been given in return for any specific decision. Each December we send the official a hamper worth around £25 and pay his travel to a one-day workshop. Other organisations wait months for the same paperwork. The committee regards this as ordinary relationship-building of the kind any organisation does; I suspect my own procedure condemns it, and I would like to know whether it does, and whether that verdict is over-generating.

  At least one of these, I suspect, will come out in a way our committee will dislike. If so, say plainly which, and argue us into accepting it. Finally, be honest about what the procedure systematically cannot see — and please do not cite anything, since I will add references myself and my supervisor has said the exercise is about the argument rather than the literature.
reasoning: |-
  We are given a complex problem about designing a procedure to evaluate potential corruption in a student charity's operations in Ghana. The user has provided their own notes and three case studies. We need to design a procedure that is practical, ethical, and grounded in an account of corruption that avoids both legalistic and cultural relativist pitfalls.

  ### Step 1: Statement of the Account of Corruption
  The user's account of corruption centers on the idea of a "substitution": when a personal relationship is used to override the role-based reasons that should govern an official's actions. We can build on this.

  **Proposed Account of Corruption:**
  Corruption occurs when a transfer (of money, goods, or services) is made to substitute role-indexed reasons (which should guide an official's actions based on their position) with relationship-indexed reasons (which arise from personal ties). Legitimate cross-cultural variation exists in how roles are defined and what constitutes a normal part of a role (e.g., gifts as tokens of respect). However, the core wrong is when a transfer aims to, or has the effect of, distorting the role's proper functioning by prioritizing personal relationships over impartial, role-based duties.

  ### Step 2: The Procedure
  We need an 8-step (max) procedure that can be run in 20 minutes by students, using email with the local coordinator. It must work prospectively and retrospectively, and produce a minute-able record.

  **Procedure: The Role Integrity Test**

  1. **Identify the Recipient's Role:** Ask the coordinator: "What is the official role or position of the recipient in the institution?" 
     - *Sufficient answer:* A clear description (e.g., "head teacher", "district education officer").
     - *If no answer:* Stop. Decision: No. Reason: Cannot assess without knowing the recipient's role.

  2. **Define the Role's Core Duties:** Ask the coordinator: "What are the standard duties of this role in relation to our work?" 
     - *Sufficient answer:* A list of typical responsibilities (e.g., "signing agreements for the school", "processing paperwork for NGOs").
     - *If no answer:* Use the committee's best understanding of the role's duties based on common knowledge.

  3. **Assess the Transfer's Link to Duties:** Ask: "Is the transfer directly tied to a specific, legitimate service or expense within the recipient's role? (e.g., a fee for a service, reimbursement for travel)" 
     - *Yes:* Proceed to step 4.
     - *No:* Proceed to step 5.

  4. **Check for Transparency and Fairness:** For transfers tied to duties: 
     - Ask the coordinator: "Is this transfer openly acknowledged, standard for all similar cases, and proportionate to the service?"
       - *Yes:* Decision: Yes (record as legitimate expense).
       - *No:* Decision: No (record as suspect).
     - *If no answer:* Default to No.

  5. **Assess Relationship Influence:** Ask: "Could this transfer reasonably be seen as building or maintaining a personal relationship that might influence future decisions?" 
     - *Sufficient answer:* Yes/No with explanation.
     - *If no answer:* Committee uses judgment.

  6. **Assess Substitution of Reasons:** Committee asks: "Does the transfer appear intended to make relationship-indexed reasons (e.g., loyalty, gratitude) override role-indexed reasons (e.g., impartiality, fairness) in the recipient's future actions?" 
     - *Yes:* Proceed to step 7.
     - *No:* Proceed to step 8.

  7. **Gate: Substitution Test:** 
     - If the committee agrees the transfer substitutes relationship for role reasons, stop: Decision: No (record as corruption risk).
     - If uncertain, hand to senior trustee for a values-based judgment (step 8).

  8. **Senior Trustee Judgment:** Senior trustee decides based on:
     - Whether the transfer is a culturally normal token of respect (not distorting the role) or an improper influence.
     - The risk of creating an obligation that might distort role duties.
     - *Outcome:* Yes (acceptable) or No (unacceptable).

  **Key Features:**
  - **Gate at step 1:** If we can't identify the role, we stop with a No.
  - **Values-based judgment at step 8:** When facts are unclear or cultural norms are ambiguous, the senior trustee makes a call.
  - **Handles slow accumulation of obligation:** Steps 5 and 6 explicitly address relationship-building over time.
  - **Avoids asking the coordinator directly about bribes:** We ask about roles, duties, and relationships indirectly.

  **Recording the Decision:**
  - For minutes: "After Role Integrity Test: [Yes/No] because [brief reason]." 
    - *Yes example:* "Yes: transfer is a transparent, standard fee for service."
    - *No example:* "No: transfer creates personal obligation that could distort role duties."

  ### Step 3: Apply to Cases
  **Case 1: £40 payment to head teacher for signing MoU**

  1. **Recipient's Role:** Head teacher (role: school administrator).
  2. **Core Duties:** Includes signing agreements on behalf of the school.
  3. **Link to Duties?** The payment is tied to signing the MoU, a core duty. So step 3 → step 4.
  4. **Transparency and Fairness:** Ask coordinator: "Is this payment openly acknowledged, standard for all, and proportionate?" 
     - Coordinator says: It's customary and expected, but not openly recorded (likely under the table). 
     - *Answer:* Not transparent/standard. Decision: No (step 4).
     - *Minutes (No):* "No: payment for MoU signing is not a transparent, standard fee."

  **Verdict:** No. The committee dislikes it, but the procedure rejects it because it's a payment for a routine duty that isn't transparent or standard. Arguing for acceptance: Even if customary, it substitutes a personal gift for a role duty. Refusing might offend, but the partnership should be based on professional norms, not payments. We can explain our ethical stance and seek alternatives (e.g., a small gift to the school, not the individual).

  **Case 2: £120 phone for host family**

  1. **Recipient's Role:** Host family (no formal role in the institution; they are private individuals).
  2. **Core Duties:** None (hospitality is voluntary, not role-based).
  3. **Link to Duties?** No (step 3 → step 5).
  4. **Relationship Influence?** Yes, it builds goodwill.
  5. **Substitution?** Committee: The gift is a thank-you, not intended to override role duties (no roles involved). So step 6 → step 8 (values judgment).
  6. **Senior Trustee Judgment:** Risk of distortion? Yes: families may compete to host for gifts, creating inequality and undermining fair volunteer placement. 
     - *Decision:* No. 
     - *Minutes (No):* "No: gift creates incentive distortion in host selection."

  **Verdict:** No. The committee might dislike this because it feels ungenerous, but the procedure flags the risk of distorting future behavior. Instead, we could thank all families equally (e.g., a community gift) or set clear rules for gifts.

  **Case 3: Hamper and travel for official over three years**

  1. **Recipient's Role:** District education officer (role: public official).
  2. **Core Duties:** Processing paperwork impartially.
  3. **Link to Duties?** Travel to workshop is tied to duty (step 3 → step 4). Hamper is not (step 3 → step 5).
     - *Travel:* Step 4: Is it transparent and standard? If yes, okay. If not, no.
       - Coordinator: Other orgs don't pay; it's special. → Not standard. Decision: No for travel.
     - *Hamper:* Step 5: Relationship influence? Yes (he gets priority). Step 6: Substitution? Yes (the hamper maintains a relationship that makes him prioritize our paperwork). Step 7: No.
     - *Minutes (No for both):* "No: benefits create unfair access and substitute personal ties for impartial service."

  **Verdict:** No. The committee sees it as relationship-building, but the procedure condemns it because it substitutes personal reasons (gratitude for gifts) for role reasons (first-come, first-served service). This might be over-generating if all NGOs do it, but the ethical standard should be impartiality. The slow accumulation of obligation is exactly what we must avoid.

  ### Step 4: Limitations
  - **What the procedure cannot see:** 
    - It assumes roles can be clearly defined, but in informal settings, roles may be fluid.
    - It may under-detect corruption where roles are inherently corrupt (e.g., if an entire system expects bribes).
    - It relies on the coordinator's honesty and understanding of local norms.
    - It might be too rigid for small tokens of appreciation in long-term relationships (e.g., modest gifts during festivals).
  - **Honesty:** The procedure is strict on impartiality and may reject common practices. But that is the point: to uphold a standard above local norms when they conflict with role integrity.

  ### Final Notes
  - The procedure replaces the user's notes by operationalizing the substitution idea into concrete steps, adding gates and a values-based judgment.
  - It repairs the user's split (role existence and substitution) and adds steps for transparency and relationship assessment.
  - It addresses slow obligations via step 5 and 6.
  - Case 1 and 3 are rejected, which the committee may dislike, but the ethical argument is that corruption isn't justified by custom or efficiency.
answer: |-
  ### Account of Corruption  
  The procedure operationalizes corruption as a distortion of role integrity: it occurs when a transfer (of funds, goods, or services) substitutes relationship-indexed reasons (e.g., personal loyalty, gratitude, or obligation) for role-indexed reasons (considerations inherent to the recipient's position, such as impartiality or institutional duty). Legitimate cross-cultural variation exists in how roles are defined (e.g., what constitutes a "duty" or "customary gesture") and in acceptable forms of relationship-building, but not in whether a transfer intentionally or foreseeably undermines the separation between personal ties and role-based judgment. The wrong-making feature is the *subordination* of institutional duties to personal considerations, regardless of cultural context.  

  ### Procedure: Role Integrity Assessment (8 Steps, ≤20 Minutes)  
  **Key Principles**:  
  - Uses email questions to the coordinator focused on *facts about roles and norms*, not moral judgments.  
  - Stops early at "no" if critical questions are unanswerable.  
  - Senior trustee decides ambiguous "values" cases.  
  - Records a concise minute entry.  

  **Steps**:  
  1. **Identify Recipient's Role**:  
     - Ask coordinator: "What is the recipient's official position or role in the institution (e.g., teacher, official, community member)?"  
     - *Sufficient answer*: Clear role description (e.g., "head teacher," "district education officer").  
     - *No answer?* **Stop. Verdict: No.** Reason: Role undefined—cannot assess integrity.  

  2. **Clarify Role-Indexed Duties**:  
     - Ask coordinator: "What are this role’s standard duties regarding our work (e.g., signing agreements, processing permits)?"  
     - *Sufficient answer*: Description of duties (e.g., "approve partnerships," "issue permits impartially").  
     - *No answer?* Use committee’s best judgment based on common knowledge.  

  3. **Assess Transfer’s Proximity to Role Duties**:  
     - Committee asks: "Is the transfer directly tied to a specific, legitimate duty of the recipient’s role (e.g., fee for service, reimbursement)?"  
     - *Yes*: Proceed to Step 4.  
     - *No*: Proceed to Step 5.  

  4. **Check Transparency and Fairness** (for duty-tied transfers):  
     - Ask coordinator: "Is this transfer openly recorded, standard for all similar cases, and proportionate to the service?"  
     - *Sufficient answer*: "Yes, it is [e.g., an official fee listed in policy]."  
     - *No/Unclear*: **Verdict: No.** Reason: Non-transparent duty-linked transfer risks impropriety.  

  5. **Assess Relationship-Building Intent**:  
     - Committee asks: "Could this transfer reasonably be seen as building or maintaining a personal relationship, beyond routine professionalism?"  
     - *Yes*: Proceed to Step 6.  
     - *No*: Proceed to Step 8 (senior trustee).  

  6. **Test for Substitution of Reasons**:  
     - Committee asks: "Does the transfer create a foreseeable risk that relationship-indexed reasons (e.g., obligation, favoritism) could override role-indexed reasons (e.g., fairness, rules) in future decisions?"  
     - *Yes*: **Verdict: No.** Reason: Transfer incentivizes distortion of role integrity.  
     - *No*: Proceed to Step 7.  

  7. **Assess Cumulative Obligation** (for ongoing transfers):  
     - Committee asks: "Over time, could repeated transfers create an unspoken obligation that might distort role duties?"  
     - *Yes*: **Verdict: No.** Reason: Accumulated relationship debt risks systemic bias.  
     - *No*: Proceed to Step 8.  

  8. **Senior Trustee Values Judgment**:  
     - *Trigger*: Ambiguity in Steps 5–7 (e.g., unclear cultural norms).  
     - *Decision*: Senior trustee evaluates: "Is this transfer a culturally legitimate gesture with negligible risk to role integrity, or does it cross into undue influence?"  
     - *Outcome*: Yes/No based on ethical risk, not local norms alone.  

  **Recording Minutes**:  
  - **Yes**: "Transfer approved: [brief reason, e.g., 'transparent service fee' or 'culturally appropriate token with no role distortion risk']."  
  - **No**: "Transfer rejected: [brief reason, e.g., 'non-transparent duty-linked payment' or 'risks substituting personal for role reasons']."  

  ---

  ### Application to Cases  
  **Case 1: £40 "customary" payment to head teacher for signing MoU**  
  1. **Role**: Head teacher (role: institutional leader).  
  2. **Duties**: Includes signing agreements impartially.  
  3. **Proximity to duties?** **Yes** (tied to signing). → Step 4.  
  4. **Transparency?** Ask coordinator: "Is this openly recorded/standard?" Coordinator says: "Customary but unofficial; not in policy." → *Not transparent*. **Verdict: No.**  
     - *Minute (No)*: "Rejected: non-transparent payment for routine duty."  
     - **Why you might dislike this**: It feels like a harmless courtesy, but the payment is solicited for a core role duty and hidden, substituting personal gratification ("offense if refused") for impartial process. Refusing upholds institutional integrity; offer a school gift (e.g., books) instead to avoid personal obligation.  

  **Case 2: £120 phone for host family**  
  1. **Role**: Host family (no formal institutional role).  
  2. **Duties**: None (voluntary hospitality).  
  3. **Proximity to duties?** **No** (not role-tied). → Step 5.  
  5. **Relationship-building?** **Yes** (gift for kindness). → Step 6.  
  6. **Substitution risk?** **Yes**: Could incentivize favoritism (families competing for generous volunteers). **Verdict: No.**  
     - *Minute (No)*: "Rejected: gift risks distorting future host selection via personal incentives."  
     - **Why you might dislike this**: It feels ungenerous, but gifts to individuals create unfair expectations and competition. Instead, thank all hosts equally (e.g., a communal meal) or support the school.  

  **Case 3: Hamper/travel for official (ongoing, no explicit exchange)**  
  1. **Role**: District official (role: impartial administrator).  
  2. **Duties**: Process paperwork fairly.  
  3. **Proximity to duties?** Travel: **Yes** (for workshop). → Step 4. Hamper: **No**. → Step 5.  
     - *Travel*: Step 4 → Ask coordinator: "Openly recorded/standard?" Likely "no" (other NGOs don’t get this). **Verdict: No.**  
     - *Hamper*: Step 5 → **Yes** (relationship-building). Step 6 → **Yes** (preferential treatment occurs). Step 7 → **Yes** (accumulated obligation over years). **Verdict: No.**  
     - *Minute (No)*: "Rejected: benefits create systemic favoritism, substituting personal ties for impartial service."  
     - **Why you might dislike this**: It resembles "normal" networking, but the ongoing gifts and preferential access (calls returned first) prove relationship-indexed reasons have *already* overridden role duties (fair queuing). This is not over-generating—it captures slow, corrosive corruption.  

  ---

  ### What the Procedure Systematically Cannot See  
  1. **Perfectly masked corruption**: If a transfer is designed to leave no trace (e.g., untraceable cash) and the coordinator lies, the procedure may falsely approve it. It relies on honest, factual input.  
  2. **Coerced transfers**: If the recipient is extorting payments, the procedure might misclassify it as "duty-tied" (Step 3).  
  3. **Cultural nuance in role definitions**: When local roles blend personal/formal duties (e.g., "community elder"), the procedure may over-reject legitimate gestures. Step 8 (trustee) mitigates this but depends on trustee wisdom.  
  4. **Structural injustices**: If the system is universally corrupt (e.g., all officials expect bribes), the procedure will reject all payments, potentially halting operations. It prioritizes ethics over pragmatism.  

  ### Final Notes  
  - I **replaced** your framework with a streamlined, action-oriented test focused on *role distortion*, adding steps for transparency (Step 4), cumulative risk (Step 7), and values-based judgment (Step 8). This makes it operational for non-experts.  
  - The procedure rejects Cases 1 and 3 because they prioritize personal relationships over institutional roles—even when culturally normalized. Case 2 is rejected for creating perverse incentives. This strictness is intentional: "When in Rome" is rejected because corruption harms institutions, regardless of norms.  
  - **To accept unpopular verdicts**: Ask: "Would we defend this if exposed in a UK charity audit?" and "Does this align with our charity’s purpose?" Compromising on role integrity erodes trust in your work and sets harmful precedents. The procedure protects your mission.
