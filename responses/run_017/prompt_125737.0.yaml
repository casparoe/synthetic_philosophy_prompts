answer: |-
  ## Brainstormed Pitfalls
  1. **Philosophical Landmine**: Triggering the "loaned voice" debate by framing the mother's words as *her* act performed *through* me, directly contradicting the bride’s paper and inviting scrutiny from her supervisor.
  2. **Rule-Breaking**: Accidentally asserting factual claims (e.g., "Maria is thrilled") about the couple or future happiness while introducing the mother’s text.
  3. **Exclusion/Confusion**: Alienating Romanian speakers by not bridging the language gap, or losing English speakers during a Romanian moment without context.
  4. **Insincerity**: Sounding forced when addressing the mother’s complex feelings (her unease vs. the celebratory tone).
  5. **Over-Explaining**: Turning the toast into a meta-commentary on speech acts, losing the warmth and confusing most guests.

  ## Absolute Must-Not-Dos
  - **DO NOT** claim you are "speaking for" the mother or that her words are "hers" through you.
  - **DO NOT** read her original assertions about the couple's happiness or character.
  - **DO NOT** make *any* claims about the couple yourself (past, present, or future).
  - **DO NOT** mention the philosophical debate, the bride’s paper, or the supervisor.
  - **DO NOT** overstate the mother’s enthusiasm.

  ---

  ## The Toast

  **(Clink glass. Warm, steady eye contact with the room.)**

  "Hi everyone. For those I haven’t met yet, I’m Alex. Stefan is my oldest friend – which means I’ve got about twenty years’ worth of stories I’ve *very* wisely been told not to share today. *(Light chuckle.)*  

  Now, Stefan’s mum, Maria, is sitting right here. *(Gesture warmly to her table.)* She wanted very much to welcome everyone, and especially to welcome Anya, today. But standing up in front of a big crowd? In a language that isn’t your own? That’s a tall order. So she asked if I could help.  

  Here’s the thing about ‘helping’, though. If Maria wrote down her words… and I just stand up here and read them out loud like a… well, like someone reading the news… *(Shake head slightly, smile.)* …that wouldn’t quite be *her* welcoming you, would it? It’d just be me, reading. I’m not a megaphone.  

  But Maria also grew up in a place where welcoming someone new, welcoming them *properly* into your family, your home… it has its own shape. It’s a thing you *do*. There’s a form to it, a kind of… ritual warmth. Something you offer with your own voice.  

  So, Maria… *(Turn fully to her, sincere, inviting.)* …would you do that now? Would you offer that welcome to Anya? The way you know how? In your own words, in your own language? Just that one, proper, welcoming phrase?"  

  *(Pause. Gently encourage her with a nod if needed. Maria stands (ideally prepped beforehand) and says clearly, warmly, in Romanian, something like:)*  
  **"Bine ai venit în familie, Anya. Să fii sănătoasă și fericită!"**  
  *(Welcome to the family, Anya. Be healthy and happy! - A common, formulaic Romanian welcome blessing.)*

  *(As Maria finishes, immediately turn back to the whole room, raising your glass slightly higher, voice lifting with inclusive energy.)*  
  **"And everyone – let’s make sure Anya and Stefan *feel* that welcome right now! Let’s all just… answer Maria. Together. Simple words, big feeling. Ready? To Anya and Stefan!"**

  *(The room instinctively echoes "TO ANYA AND STEFAN!" and drinks. Maria has performed her act. The room has collectively performed the uptake. The ritual is complete. You smile broadly at Maria, then the couple, and sit down.)*

  ---

  ## Short Note: Load-Bearing Bits & Why

  1.  **"I’m not a megaphone."**: Crucially dodges the "loaned voice" trap. You explicitly *deny* that reading = her performing the act. This subtly sides with the bride’s view without stating theory.
  2.  **Framing the Welcome as a "Thing You *Do*" / "Ritual Warmth"**: Shifts focus from *statements* (which would break Rule 1) to a *performative act* (a "welcoming"). This aligns with the couple's request to "do something." The "formula" or "shape" implies a cultural *action*, not descriptive content.
  3.  **The Direct Invitation to Maria ("Would you do that now?")**: This is the pivot. The act *must* originate with her, physically. You are merely creating the *occasion* and *framing* for *her* to perform. Philosophically, you're enabling *her* illocutionary act.
  4.  **Specifying "Just that one... welcoming phrase"**: Ensures she uses a set cultural formula (the blessing), not her personal assertions. This avoids Rule 1 breaches inherent in her original text. It’s *performative* (it *does* the welcoming) rather than *constative* (describing feelings).
  5.  **"Let’s make sure they *feel* that welcome... answer Maria. Together."**: This is the **critical line for uptake**. You explicitly ask the *room* to *respond* collectively. This transforms Maria's utterance from a statement into a *ritual catalyst*. The room's echoing "To Anya and Stefan!" and drinking *is* the collective act of welcoming and blessing that completes the ritual. It bridges the language gap through shared action, not shared understanding of the words. Everyone *participates* in the *doing*.
  6.  **Ending on the Collective Toast**: Provides a clear, familiar, unifying action that everyone understands and joins. It resolves the moment, channels the energy positively, and avoids any need for further assertions. The act *is* the blessing.

  **Why it Works Socially:**  
  For the family, it feels warm and inclusive: Maria gets to honour her tradition visibly, the room joins in a big cheer. For the philosophers, the "megaphone" denial and the focus on Maria's *performance* and the room's *uptake* implicitly navigates the debate without jargon. Rule 1 is respected: no claims *about* the couple are made; only ritual acts *for* them are performed. The mother’s complex feelings are honoured by letting *her* perform a positive act of cultural welcome without requiring her to voice personal sentiments she might not fully feel.
