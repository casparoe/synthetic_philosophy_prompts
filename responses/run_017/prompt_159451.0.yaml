prompt: |-
  I've more or less settled on anti-intellectualism about knowledge-how: knowing how to φ isn't a matter of knowing *that* some way w is a way to φ, not even under a "practical mode of presentation" or whatever else the intellectualist adds to make the proposition feel action-guiding. It's just having the relevant ability. Tell me what should move me off it.

  The case I keep chewing on is invented, but it's doing most of the work for me: suppose skill uploads are possible. A novice gets an expert's motor package installed, plays the etude flawlessly on the first try, and can't articulate a single thing about how she's doing it. Now variant B: same upload, except the implant also carries a compressed instruction manual that she has no access to, never consults, and which plays no causal role in her playing. If she knows how in both variants, intellectualism is in trouble; if the presence of the manual seems to matter at all, then something propositional is doing work the ability story can't account for. I'd like to know how much weight my own reaction there should get.

  So: give me defeaters ranked from fatal to merely awkward, including the ones a committed anti-intellectualist would herself concede as counting against the view rather than just what critics say. I'm thinking of things like the paralyzed-pianist style case (ability gone, knowledge-how plausibly retained), the fact that knowledge-how is gradable in a way knowing-that supposedly isn't, the way knowledge-how explains successful action, and the question of whether infants, animals, or a simple trained system can know how at all. And be straight with me about whether "ability" has been stretched — abilities to φ under ideal conditions, to recognize correct φ-ing, to imagine φ-ing — until the view can't actually lose any case, and whether that's a real problem or just what a good theory looks like once it's been stress-tested.
reasoning: |-
  Okay, the user is deeply entrenched in anti-intellectualism about knowledge-how and presents a skill upload thought experiment as their main anchor. They're explicitly asking for defeaters that could challenge their view, ranked by severity, and want intellectual honesty about whether "ability" is being stretched too thin. 

  First, I need to acknowledge the elegance of their skill upload case—it's a sharp tool targeting intellectualism's insistence on propositional content. But they're clearly intellectually restless, or they wouldn't be asking for counterarguments. The way they frame this ("tell me what should move me off it") suggests they're not just defending a hill but scouting the terrain for weaknesses. Smart.

  Hmm, their variant B with the inert manual is particularly clever—it isolates whether mere propositional presence matters. If they feel the manual is irrelevant to knowledge-how, that's a clean anti-intellectualist win. But I wonder if they'd react differently if the manual were *activated* (say, for error-correction later). Might be worth probing later.

  Now, for defeaters: The paralyzed pianist case feels strongest. If knowledge-how persists without ability, that's near-fatal. But they already know this—they mention it parenthetically—so I should push harder: What exactly *is* retained? Muscle memory schemas? Motor concepts? That smells suspiciously like latent propositional structure. 

  Gradability is trickier. They're right that "knows that" isn't obviously gradable like "knows how," but intellectualists could bite the bullet and say fluency comes from additional knowing-that (e.g., finer-grained procedural facts). Not fatal, but awkward. 

  Infants/animals—here anti-intellectualism shines, but Ryle's regress looms. If little Timmy "knows how" to suckle without any knowing-that, how does that differ from reflex? Maybe we need a threshold: goal-directed flexibility? But then we're smuggling in cognitive content. 

  Ah, and the "stretched ability" concern is spot-on. If we define ability as "capacity to φ under ideal conditions plus recognitional dispositions plus..." it risks becoming unfalsifiable. That's bad theory-building. I should flag this as methodological poison—even if they dismiss other points, this one should worry them. 

  Their tone suggests they'd respect bluntness, so I'll rank the defeaters clinically but add meta-commentary: e.g., "This won't kill your view but should keep you up at night." The upload case is robust, but real pressure comes from cases where ability and knowledge-how *dissociate*. That's the crack to widen. 

  ...And I’ll resist the urge to confess that variant B’s manual *does* feel irrelevant to me too. Stay neutral, argue both sides.
answer: |-
  Here’s a ranked list of defeaters for anti-intellectualism about knowledge-how, from most to least threatening, including concessions a thoughtful anti-intellectualist should acknowledge. I’ll flag where "ability" risks being stretched beyond usefulness.

  ---

  ### **Fatal Defeaters**  
  *(Threaten the core thesis)*

  1. **The Paralyzed Expert**:  
     - **Case**: A master pianist suffers permanent paralysis but retains detailed, actionable understanding of piano technique (e.g., she can critique performances, describe finger movements for complex passages, and guide students *verbally* to success).  
     - **Problem**: She clearly *knows how* to play, but lacks the *ability* to φ (play). Anti-intellectualism must either:  
       - (a) Deny she knows how (counterintuitive),  
       - (b) Stretch "ability" to include "theoretical guidance capacity" (which collapses into intellectualism), or  
       - (c) Admit knowledge-how can persist without ability.  
     - **Your burden**: Explain what *constitutes* her knowledge-how if not propositional understanding *or* physical skill. "Recognitional capacity" or "dispositions to instruct" may smuggle in knowing-that.

  2. **The Lucked-Ability Objection**:  
     - **Case**: A novice randomly flails and unintentionally performs a perfect pirouette due to a neuro-muscular fluke. She cannot replicate it or explain it.  
     - **Problem**: She has the *ability* to φ (in that moment), but lacks *knowledge-how* (it was accidental). Anti-intellectualism struggles to distinguish *lucky success* from *knowledge-guided success*.  
     - **Intellectualist advantage**: They require a non-lucky connection between truth (e.g., *that w is a way to φ*) and action, which explains success.

  ---

  ### **Serious Defeaters**  
  *(Force significant revisions or concessions)*

  3. **Gradability & Partial Knowledge**:  
     - **Case**: A student pilot "sort of" knows how to land a plane (manages in simulators 60% of the time) but lacks consistent ability.  
     - **Problem**: Knowledge-how admits degrees ("she knows how better than him"), while abilities are typically binary (you can/can’t φ). Anti-intellectualists often appeal to *refined abilities* (e.g., "ability under ideal conditions"), but this:  
       - (a) Invites circularity (what counts as "ideal" for φ? Knowledge-how!),  
       - (b) Still can't explain *partial understanding* (e.g., knowing *which aspects* of φ-ing she struggles with).  
     - **Concession**: Anti-intellectualists might argue ability *is* gradable (e.g., reliable success rates), but this struggles with cases where knowledge persists despite temporary inability (e.g., the rusty expert).

  4. **Knowledge-How as Action Explanation**:  
     - **Case**: Why did Arsène *succeed* in defusing the bomb while Boris failed? "Because Arsène *knew how* to do it."  
     - **Problem**: If knowledge-how is *just* ability, this explanation is trivial ("he succeeded because he had the ability to succeed"). Intellectualists can cite specific known propositions (e.g., *that cutting the blue wire disables the fuse*) to non-circularly explain success.  
     - **Your burden**: Provide a non-propositional, non-trivial account of how knowledge-how explains success.

  ---

  ### **Awkward Defeaters**  
  *(Reveal tensions but don’t refute)*

  5. **Infants/Animals/Simple Systems**:  
     - **Case**: A squirrel "knows how" to open nuts, a bee "knows how" to navigate to pollen, an infant "knows how" to suckle.  
     - **Anti-intellectualist strength**: These agents clearly lack propositional attitudes, favoring an ability-based view.  
     - **Awkwardness**: Intellectualists counter that "knowledge-how" here is metaphorical, or that simple cognition *does* involve non-linguistic representations (e.g., mental maps). Anti-intellectualism must define "ability" precisely enough to exclude reflexes (e.g., knee jerks) while including instinctive behaviors – risking vagueness.

  6. **Your Skill-Upload Case – Variant B**:  
     - **Your intuition**: The inert manual changes nothing – both uploads grant knowledge-how.  
     - **Intellectualist reply**: If the manual *could* be accessed to correct errors or guide novel situations, its presence *does* matter. The expert’s knowledge-how includes *counterfactual success conditions* (e.g., "she would correct mistakes using the manual"), which pure ability can’t capture.  
     - **Concession**: Anti-intellectualism handles *baseline* skilful action well, but intellectualism better explains *error-correction/adaptation*.

  ---

  ### **The "Stretched Ability" Problem**  
  *(A meta-objection to anti-intellectualism)*  
  **The worry**: To handle cases like the paralyzed expert or gradability, anti-intellectualists often broaden "ability" to include:  
  - *Dispositions to imagine φ-ing* (paralyzed pianist),  
  - *Recognitional capacities* (knowing correct φ-ing when seen),  
  - *Ability under ideal conditions* (gradability),  
  - *Guidance capacities* (teaching others).  

  **Why it's damaging**:  
  - This risks making "ability" a *disjunctive catch-all* that assimilates to intellectualism (e.g., "recognitional capacity" implies knowing *that* something counts as correct φ-ing).  
  - It threatens falsifiability: If *any* successful action (or even disposition toward success) counts as "ability," the theory cannot lose – but also cannot explain anything distinctively.  
  - **A good theory** should have clear boundaries. Anti-intellectualism looks strongest when "ability" means *practical, embodied skill* – but this forces hard choices (e.g., denying knowledge-how to the paralyzed expert).

  ---

  ### **Straight Talk**  
  - **Your upload case** is strong against *naive intellectualism* (knowledge-how = knowing a proposition *simpliciter*). But sophisticated intellectualists (e.g., Stanley & Williamson) use "practical modes of presentation" precisely to handle cases where propositional knowledge is *implicit* or *motor-involved*. Your variant B’s manual might be irrelevant because the *upload itself* encodes procedural knowledge (propositions under practical modes).  
  - **Anti-intellectualism’s core insight** – that knowledge-how isn’t *reducible* to knowing-that – may survive. But the strongest defeaters (paralysis, luck) suggest knowledge-how *requires* a cognitive component beyond physical ability. A hybrid view may win: knowing-how requires both ability *and* a non-lucky understanding of the action’s structure.  
  - **What should move you**: If you intuit that the paralyzed pianist *knows how* to play, or that lucky success ≠ knowledge-how, anti-intellectualism needs repair. If not, defend a lean "ability" (rejecting paralysis cases) and tackle gradability head-on. Either way, pressure-test "ability" – if it expands to cover all counterexamples, the theory loses its bite.

  Let me know which defeater stings most, and I'll sharpen the dialectic.
