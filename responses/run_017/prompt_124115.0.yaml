  ### Embedded Agency Exercise: "The Last Look Game"

  #### **Materials**
  - Index cards (14)
  - Pen for each player
  - Whiteboard & markers
  - Box for card collection
  - Dice (to resolve ties)
  - Coffee voucher prize

  #### **Setup (10 min)**
  1. **Introduction (5 min)**:  
     - Explain the goal: "Each of you will write a rule on a card that outputs a number between 0 and 100. Your score depends on how close your number is to a target \( T \). \( T \) is computed using everyone’s rules and outputs. Highest score wins a coffee voucher."  
     - Emphasize: "Your rule must work **without knowing other rules in advance**. When you compute your output, you’ll see all rules and prior outputs."  
     - Write on whiteboard:  
       - **Target \( T = \frac{1}{2} \times (\text{Average of Rules} + \text{Average of Outputs}) \)**  
       - **Scoring**: `Score = max(0, 10 - |\text{Your Output} - T|)`  
       *(e.g., if \( T = 50 \) and you output 52, score = 8)*  

  2. **Rule-Writing Instructions (5 min)**:  
     - "Your rule must be a **single sentence** that outputs a number. It can use:  
       - All rules written on the board (including yours).  
       - Outputs already computed (if you’re not first).  
       - Your position in the computation order (e.g., ‘if I’m first...’)."  
     - Examples:  
       - `"Always output 60."`  
       - `"Output the average of previous outputs, or 50 if none."`  
       - `"If any rule contains '100', output 0; else output 100."`  
     - **No secret roles. All rules public after writing.**

  ---

  #### **Game Flow (40 min)**
  1. **Write Rules (5 min)**:  
     - Players write rules anonymously on cards. Collect in box.  
     *Example rules from past runs:*  
     - Philosophy: `"Output whatever T will be."`  
     - CS: `"Output the fixed point of all rules."`  

  2. **Reveal & Compute (25 min)**:  
     - **Shuffle cards**, then write all rules verbatim on whiteboard (label R1 to R14).  
     - **Randomize computation order** (roll dice to assign player numbers 1–14).  
     - **For each player in order**:  
       - Player comes to whiteboard. They see:  
         - All rules (R1–R14).  
         - Outputs of prior players (O1, O2, ...).  
       - Player **computes their output** based on their rule.  
       - **30-second time limit**. If unresolved, output 50.  
       - Write output on board (O1, O2, ...).  

  3. **Scoring (10 min)**:  
     - Compute:  
       - Avg(Rules) = Average of all rule outputs *if each rule were run alone*.  
       - Avg(Outputs) = Average of actual outputs (O1–O14).  
       - \( T = \frac{1}{2} \times (\text{Avg(Rules)} + \text{Avg(Outputs)}) \).  
     - Calculate scores. Declare winner (resolve ties with dice). Award voucher.  

  ---

  #### **Debrief (40 min)**  
  **Guide the discussion to surface key insights:**  
  1. **"The target moves because you’re inside it"**:  
     - Ask: *"How did it feel to compute your output? Did \( T \) feel predictable?"*  
     - Highlight: "Your output changed Avg(Outputs), which changed \( T \). You were *part* of the system generating \( T \)."  
     - **When it happens**: When a player outputs 70 because they expect \( T = 70 \), but \( T \) becomes 75 because others did the same.  

  2. **"The room gets the last look"**:  
     - Ask: *"Did anyone change their intended output after seeing the rules? Why?"*  
     - Point to a rule like `"Output 100"`. Ask: *"How did others react to this?"*  
     - Highlight: "Your rule was a physical object in the room. Later players saw it and adjusted. The environment had the **last look**."  
     - **When it happens**: A player writes `"Output 100"`, but a later player outputs 0 because their rule counters "overconfident" rules.  

  3. **"Self-reference hands the problem to the resolver"**:  
     - Ask: *"Did anyone write a rule like ‘Output what I will output’ or ‘Do what’s best’? What happened?"*  
     - Highlight: "Self-referential rules don’t resolve themselves. **You** had to interpret them in the room’s context. The ‘last look’ applied to *you*, not just your rule."  
     - **When it happens**: A player writes `"Output the Nash equilibrium"` and stalls (outputs 50).  

  **Name "last-look"**:  
  - "This is what my friend calls **last-look**—the environment always sees your rule and can react. Embedded agency isn’t just self-reference. It’s about being a small part in a larger system that out-scopes you."  

  **Address Predictable Issues**:  
  - **CS players hunting fixed points**:  
    - *If they succeed*: "Your fixed point assumed others are rational. But see player 3’s rule? They trolled you by outputting 99."  
    - *If they fail*: "You tried to compute a fixed point but ran out of time. The room forced a default."  
  - **Philosophy players calling it incoherent**:  
    - "Yes, the setup is self-referential! But we *ran* it. The incoherence was resolved by **you** in this room, with physical cards and a clock. That’s the point: agents are physical systems, not abstract giants."  

  **Limitations**:  
  - "This game **doesn’t show adaptation over time**. In reality, agents update their rules based on feedback. Here, rules were fixed. The deeper embedded agency problem is when the environment *optimizes against your learning process*. We’d need a multi-round game for that—but today, we focused on the **physicality** of agency."  

  ---

  #### **What Could Go Wrong**  
  1. **Ambiguous rules**:  
     - *Solution*: Enforce "1 sentence" strictly. If unclear, player must interpret in 30 sec (or default to 50).  

  2. **Outputs cluster (Keynesian beauty contest)**:  
     - *Prevent*: The dual-average \( T \) (rules + outputs) and public reactions discourage guessing "the average." Example: If everyone outputs 60, Avg(Rules) might be 70 (if rules are bolder), pulling \( T \) away.  

  3. **Philosophy players disengage**:  
     - *Hook them*: Ask, *"Whose rule ‘begged the question’? Did your rule assume its own correctness?"*  

  4. **Computation order bias**:  
     - *Mitigate*: Randomize order. Later players have more info—but their rules are fixed in advance.  

  ---

  #### **Why This Works**  
  - **Your card is fed back twice**:  
    1. As a **rule** in Avg(Rules).  
    2. As an **output** in Avg(Outputs).  
    (e.g., A rule `"Output 50"` affects Avg(Rules), but if the player outputs 60 instead, it *also* affects Avg(Outputs)).  
  - **No laptops needed**: Physical cards and whiteboard make the "room as environment" visceral.  
  - **No premature labeling**: "Embedded agency" is named only at the end.  

  **Run Time**:  
  - Intro: 10 min  
  - Writing: 5 min  
  - Compute: 25 min  
  - Scoring: 10 min  
  - Debrief: 40 min  
  Total: 90 min  

  This forces players to confront **physical embeddedness** (rules as public objects) and **self-reference** (rules that bite their own tail). The coffee voucher stakes keep it light but sharp.
