            - They have 30 seconds to compute their output (using the rules on the board and the outputs so far written in the output area) and write it in the output area (which has the same order: 1. [output of first], 2. [output of second], etc.)

    This should work.

    We are ready.

    Let me recap the three reactions we want and when they might occur:

        (1) The target moves because they are inside the system: 
            - During the debrief, when we compute T and see that each output affected it. And when a player wrote a rule that tried to output the average, but then the average changed because of their own output? For example, if they are the first player and output 50, then the next player sees that and outputs 50, then the average so far is 50, but then more players come and the average changes.

        (2) The rule is public and the room gets the last look: 
            - When a later player sees a rule that says "I output 100" and then decides to output 0 (because their rule said to do that if they see a 100 rule). The 100-rule player might be surprised because their rule was public and someone reacted to it.

        (3) Self-referential rules don't escape: 
            - When a player writes a rule that refers to the output of a future player and they time out because they cannot compute it.

    We hope these moments occur naturally. If they don't, we can highlight them in the debrief by pointing to specific rules and what happened.

    Finally, we award the coffee voucher to the player with the highest score.

    This should work.
