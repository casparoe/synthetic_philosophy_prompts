prompt: |-
  I convene a small fortnightly seminar series — graduate students and advanced undergraduates, about fifteen of us, ninety minutes of conversation rather than lectures — and next week's guest is a philosopher (I'll call her Dr. Marlow here, though that isn't her name) who has just published a paper that dissolves Bradley's regress rather than solving it. Her view, as I've reconstructed it from the paper and from her talk last month: propositions are not complexes whose constituents need to be tied together, because a proposition is not an object at all but a procedure — a structured routine for checking whether reality contains certain items arranged in a certain way — and what the tradition calls the unity of the proposition is really just the order of the steps in the routine. Her signature line, which she used three separate times, is the retort "You are reading the sentence's grammar back into the world," aimed at anyone who asks how a relation manages to connect its relata. I had a long, unresolved argument with a friend after that talk. He holds the cheap Russellian position that relations just relate and no glue is needed, and he claims the procedure view is only the Fregean thought that concepts are unsaturated, restated in a more expensive vocabulary, and that in any case it never touches what he takes to be Bradley's real target: not propositions but facts — what makes it the case that a, R, and b compose a single state of affairs rather than three scattered items. I came away genuinely unsure whether she has an answer to that, or whether she regards it as a separate question she is entitled to decline.

  So: draft me eight to ten interview questions for her, sequenced so that the grammar-back-into-the-world line becomes progressively harder to lean on, each with a follow-up keyed to the reply she is most likely to give. I want at least one question on each of the following. First, false propositions: if a proposition is the check it runs, what holds the proposition that aRb together when aRb doesn't obtain, and does she now owe an account of absence, or of negative facts, that her parsimony was supposed to avoid? Second, how fine-grained her individuation of procedures can be: can she distinguish the proposition that aRb from the proposition that bRa when R is symmetric, and the proposition that a is taller than b from the proposition that b is shorter than a, without reintroducing propositional structure through the criterion of procedure-identity — and if she makes the criterion fine enough to respect cognitive significance, hasn't the structured proposition come back through the back door? Third, whether the regress simply reappears one level up: a procedure has steps, and something must make those steps steps of one procedure rather than several procedures run in sequence, so what stops Bradley's argument from applying to her own unities, and is that a fatal symmetry or just a place where she bites the bullet? Fourth, what the procedure view buys that the Russellian answer and the Fregean answer don't already get you — in particular how she handles the difference between a proposition and a mere list of its constituents, which is the case people usually reach for when they say the unity problem can't be dissolved. And fifth, a question that forces her either to take on the version of the regress that concerns facts in the world or to say explicitly why that isn't her problem, and what it would cost her to say so. Close with one question about what finding or argument would make her give the view up. After each question, note briefly the answer you expect from her and why it's the one she'd give.
reasoning: |-
  Okay, the user is organizing a seminar and needs interview questions for a philosopher, Dr. Marlow, who has a unique take on Bradley's regress. They want questions that challenge her "grammar back into the world" stance, covering false propositions, procedure individuation, regress recurrence, advantages over Russell/Frege, and the fact-based regress. They also want a closing question about what would make her abandon her view.

  First, I need to understand Dr. Marlow's position. She sees propositions as procedures—structured routines for checking reality, not objects with constituents. This dissolves Bradley's regress by avoiding the need for "glue" to unite parts. Her key rebuttal is accusing others of misplacing grammatical structure onto reality.

  The user has specific concerns from a debate with a Russellian friend. The friend thinks her view is just Frege's unsaturated concepts in new terms and doesn't address facts. The user wants questions that push beyond her standard retort, especially on facts and false propositions.

  Let me break down the required topics:  
  1. **False propositions**: How does she account for unity when the proposition is false? Does this force her into negative facts?  
  2. **Procedure individuation**: Can she distinguish between equivalent propositions (like symmetric relations or taller/shorter) without reintroducing structure?  
  3. **Regress recurrence**: Couldn't Bradley's regress apply to the steps of her procedures?  
  4. **Advantages over Russell/Frege**: What does her view offer that theirs don't, especially regarding unity vs. lists?  
  5. **Facts in the world**: How does she handle the regress for facts, not just propositions?  

  For each, I need a main question and a follow-up anticipating her response. The sequence should make her "grammar" rebuttal less usable over time.

  For false propositions, I'll start by asking what unifies the procedure when the check fails. Likely, she'll say the procedure exists regardless of outcome. The follow-up should press on whether this implies negative facts or absences.  

  For procedure individuation, I'll ask about symmetric relations. She might say the procedures differ in instruction order. The follow-up can question if this makes procedure identity too fine-grained, risking structured propositions.  

  For regress recurrence, I'll ask if steps need unification. She might dismiss it as confusing execution with description. The follow-up can challenge if this avoids the core issue.  

  For advantages, I'll contrast with Russell and Frege. She'll likely argue they're still objectifying. The follow-up can push how she avoids the list problem.  

  For facts, I'll directly ask about the friend's objection. She might distinguish propositions from facts. The follow-up can ask if this limits her dissolution's scope.  

  Finally, the abandonment question: what evidence would change her mind? She might cite explanatory failure.  

  The questions need to escalate pressure. I'll start with easier ones where her retort fits, then move to harder ones where it doesn't apply. The structure should flow logically, building on previous answers.  

  I'll ensure each question has a clear follow-up and expected response based on her stated views. The closing question should be open but probing, revealing her commitment level.  

  The user wants depth, so I'll make sure the questions are precise and the follow-ups cut to the heart of potential weaknesses without being hostile. The seminar context means questions should be discussable in 90 minutes, so they need to be focused but not overly technical.
answer: |-
  Here are ten sequenced interview questions for Dr. Marlow, designed to progressively challenge reliance on the "grammar back into the world" retort, with follow-ups and predicted responses. Each addresses your core concerns while building toward the fact-based regress and her view’s viability.

  ### Sequence & Strategy
  The sequence starts with her core framework (where her retort fits naturally), moves to internal tensions (falsehoods, individuation), escalates to self-applicability (regress recurrence), contrasts with rivals, forces engagement with facts, and ends with falsifiability. Follow-ups target evasive or incomplete answers.

  ---

  **1. Opening: Clarifying the View**  
  *Question:* "You argue a proposition is a *procedure* – a routine for checking reality. Could you concretize this? For ‘a is F,’ is the procedure something like: *Locate a, then check if F applies*? If not, what *is* the routine?"  
  *Predicted Response:* She’ll likely affirm the example but stress it’s an *abstract instruction set* (not mental tokens), and emphasize order/structure as irreducible. *Why?* It reinforces her core analogy and avoids object-talk early.  
  *Follow-up:* "If the procedure isn’t a mental event or abstract object, what is its ontological status? Is it more like a recipe, a rule, or a type of action?"  
  *(Sets up later questions about procedure-identity and regress by forcing ontological clarity.)*

  **2. False Propositions (Addressing Absence)**  
  *Question:* "For a *false* proposition like ‘aRb,’ what unifies the procedure? If reality lacks aRb, is there still a single *thing* (the procedure) with internal unity? Or is ‘false procedure’ a misnomer?"  
  *Predicted Response:* She’ll insist the procedure exists independently of success/failure: unity lies in the *executable instruction* itself (e.g., "Check for a-R-b linkage"), not in the world. *Why?* Preserves procedural unity without truthmakers.  
  *Follow-up:* "If the procedure’s unity holds *even when reality lacks the linkage*, does this commit you to negative facts (the fact that aRb *isn’t* instantiated) or absences to ground the procedure’s coherence? Or is procedural unity primitive?"  
  *(Forces confrontation with whether her view smuggles in problematic metaphysics.)*

  **3. Individuation: Symmetric Relations**  
  *Question:* "Take a symmetric relation R (e.g., adjacent). How does your view distinguish the procedure for ‘aRb’ from ‘bRa’? If order in the procedure matters, doesn’t that reintroduce structural elements akin to Russellian complexes?"  
  *Predicted Response:* She’ll argue the procedures differ in *instructional order* (e.g., "Take a, find R-link to b" vs. "Take b, find R-link to a"), denying this is "structure" in the object sense. *Why?* Order is intrinsic to dynamic routines, not static glue.  
  *Follow-up:* "If procedures are individuated by step-order, could two procedures with identical steps but different orders (e.g., ‘a taller than b’ vs. ‘b shorter than a’) correspond to the *same* fact? If so, does cognitive significance (Frege’s ‘morning star’ problem) demand *finer-grained* procedures than reality – and if not, how is this not propositional structure rebranded?"  
  *(Targets tension between cognitive distinctions and ontological parsimony.)*

  **4. Individuation: Criteria & Structure**  
  *Question:* "What makes two procedures *the same*? If it’s functional equivalence (same truth-conditions), doesn’t that collapse distinctions like Hesperus/Phosphorus? If it’s computational steps, haven’t you rebuilt structured propositions with ‘steps’ as constituents?"  
  *Predicted Response:* She’ll likely opt for finer-grained identity (steps matter) but deny steps are "constituents," framing them as *inseparable phases* of a holistic act. *Why?* Avoids conceding structure while accommodating cognition.  
  *Follow-up:* "If step-order is essential but not constitutive (like parts), what prevents Bradley’s regress *within* the procedure: what unifies Step 1 (pick a) and Step 2 (check R to b) into *one* routine?"  
  *(Pivots to regress recurrence; sets trap for next question.)*

  **5. Regress Recurrence: Procedures**  
  *Question:* "Bradley’s regress arises if unifying elements themselves need unity. Your procedure has steps needing integration into a single routine. What stops the regress here? What makes steps *belong* to one procedure rather than separate acts?"  
  *Predicted Response:* She’ll reject the framing: steps aren’t "elements to be glued" but *aspects* of an irreducible primitive – the procedure *just is* a unified directive. *Why?* Her dissolution relies on rejecting the "composition" assumption entirely.  
  *Follow-up:* "If procedures are basic unities, is this a brute fact? Or does it imply a *further* procedure to ‘execute the steps as one’? If not, why is this move acceptable for procedures but not for facts?"  
  *(Directly challenges her to justify asymmetry between her view and the target.)*

  **6. Advantage Over Russell/Frege (Unity vs. List)**  
  *Question:* "Russellians say ‘relations just relate’; Fregeans say ‘concepts are unsaturated.’ Both claim to solve unity. What does the *procedure* view offer that these don’t – especially regarding the ‘list problem’ (how a proposition differs from a list of a, R, b)?"  
  *Predicted Response:* She’ll argue Russell/Frege still treat propositions as *things* with mysterious "relating" or "saturation," while procedures are *acts*: a list is static, but a procedure *does something* with inputs. *Why?* Positions her view as more fundamentally action-oriented.  
  *Follow-up:* "But a list can be *interpreted* as instructions (e.g., ‘a, R, b’ → ‘link a-R-b’). If the procedure is just that interpretation, what prevents the regress for interpreting the list *as* a directive?"  
  *(Tests whether "act" talk adds substance or relabels the problem.)*

  **7. The Fact-Based Regress (Core Challenge)**  
  *Question:* "Your critic argues Bradley’s regress targets *facts* (what unifies a, R, b in reality), not propositions. You dissolve propositional unity via procedures – but how does this address the *worldly* unity of states of affairs? Or do you see this as a distinct issue you’re not obliged to solve?"  
  *Predicted Response:* She’ll likely reframe facts as *successful executions* of procedures (e.g., the fact *is* the obtaining of what the procedure checks for), denying facts need "unification" beyond this. *Why?* Maintains focus on epistemology/metaphysics of representation.  
  *Follow-up:* "If a fact *just is* the complex aRb obtaining, Bradley asks: what makes this a unity rather than three items? Saying ‘it just does’ mirrors Russell. If you instead say ‘it’s unified *because* the procedure would succeed,’ isn’t that circular? Or must you deny facts have structure?"  
  *(Forces choice: bite the bullet on brute unity, embrace circularity, or eliminate facts. Her weakest point.)*

  **8. Costs of Dissolving Facts**  
  *Question:* "Suppose you deny facts have constituent structure – treating them as primitive ‘obtainings.’ Does this sacrifice explanatory power (e.g., why aRb and bRa are the same fact)? Or is this the price of avoiding the regress?"  
  *Predicted Response:* She’ll embrace primitive facts or claim facts are "shadows" of true procedures, sacrificing granularity for anti-regress gains. *Why?* Consistent with her anti-metaphysical stance.  
  *Follow-up:* "If facts are primitives, how do we account for their relation to procedures? Does the procedure ‘aRb’ *match* a fact, or is the fact *defined* by the procedure’s success? If the latter, how do we avoid idealism?"  
  *(Highlights tension between realism and proceduralism.)*

  **9. Synthesis: What Work Does ‘Procedure’ Do?**  
  *Question:* "Summarizing: is the key advantage of your view that it replaces *static unifiers* (glue, saturation) with *temporal order* in a cognitive act? And if so, does this imply unity is mind-dependent?"  
  *Predicted Response:* She’ll deny mind-dependence (procedures are abstract, not psychological) and reiterate that order is worldly-but-dynamic, not static composition. *Why?* Final defense against idealism/psychologism charges.  
  *Follow-up:* "If procedures aren’t mental, and their order isn’t in the static world, *where* does this order exist? Is it a Platonic script? And doesn’t *this* invite a new regress about unifying the script’s parts?"  
  *(Pushes her towards either Platonism or nominalism, both problematic.)*

  **10. Falsifiability: Abandoning the View**  
  *Question:* "Lastly, under what conditions would you concede the procedure view *fails* to dissolve Bradley’s regress? What evidence or argument would compel you to abandon it?"  
  *Predicted Response:* She’ll likely state that if the regress can be coherently run *within* the procedural framework (e.g., steps needing meta-unifiers), or if it can’t handle core phenomena like falsehoods without paradox. *Why?* Shows she views internal consistency and explanatory scope as decisive.  
  *(No follow-up needed; ends on reflective note.)*

  ---

  ### Why this works
  - **Progressive Pressure**: Early questions (1–3) let her use her framework comfortably; mid-questions (4–6) force internal justification; late questions (7–9) attack the fact-regress and ontological costs. Her signature retort fits only the first few questions.
  - **Follow-ups**: Each anticipates her likely defense (e.g., denying composition for procedures, deflecting facts) and counters with a deeper problem (circularity, idealism, brute primitives).
  - **Your Requirements Covered**:  
    - **False propositions**: Q2 & follow-up target absence/negative facts.  
    - **Individuation**: Q3 & Q4 handle symmetry, cognitive significance, and structure.  
    - **Regress recurrence**: Q5 & follow-up explicitly challenge self-applicability.  
    - **Advantages**: Q6 contrasts with Russell/Frege and presses the list problem.  
    - **Facts**: Q7 & Q8 force engagement with worldly unity.  
    - **Falsifiability**: Q10 closes decisively.
  - **Predicted Responses**: Based on her published view – she’ll consistently reject "composition" talk, lean on procedural dynamism, and deflect facts as epiphenomenal to successful checks.

  Use Q7 (fact-regress) as the pivot: if she dismisses it, note the cost (Q8); if she engages, the follow-up exposes circularity or brute unity. This forces her to either defend a weak flank or concede limits to her dissolution. Good luck with the seminar!
