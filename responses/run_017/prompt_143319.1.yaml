prompt: |-
  Hi — I'm a GP by background and I sit on our regional health system's individual funding request panel, the thing everyone here calls "exceptional cases". We meet twice a month, get through about twenty-five cases a session, ten or fifteen minutes each, and the panel is me, a paediatrician, someone from finance, and a lay member who is formidably sensible and has no medical training at all. Our founding document says we fund "restoration or maintenance of normal bodily and mental functioning" and we don't fund "improvement of function beyond what is normal". That sentence read as perfectly clear for about a fortnight, and then real cases started arriving and it's been coming apart in our hands ever since. I've done some reading on the therapy-versus-enhancement distinction in my own time and I get the general shape of the arguments, but everything I found stops right at the bit I need: somebody has to actually decide, in fifteen minutes, and write one page of reasons that has to survive an appeal and be readable by the person who applied. I was complaining about this to my brother, who teaches, and he said the same thing comes up with exam extra time and whether a quiet room is a treatment or an advantage, which is basically the same problem wearing a different hat.

  So: please write me a decision procedure my panel can actually run, with the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure stops and returns a "no" on its own, and where it has to hand the question to the four of us because it's a values call and not a factual one. Some constraints. We can't put terms like "species-typical" in the decision letters — the lay member rolls her eyes and the applicants definitely won't know what it means — so every question needs an askable-in-plain-English version. We get a twenty-page submission from the applicant's clinician and we can't commission anything ourselves, and maybe forty per cent of the time the submission just doesn't contain what we need, so the procedure has to tell us what to do when the answer is "unknown" rather than pretending we can look it up. We're also meant to be consistent with what earlier panels did without being strictly bound by it, so say how to record a decision so the next one can follow it. Two things I want built in because they've wrecked us twice already: one, some of these benefits are positional — they only work because most other people don't have them, and if we funded everyone the benefit would just evaporate — and I don't know whether that counts against funding or whether it's a fairness question we should be voting on separately. Two, my colleague pointed out that if we'd built schools around moving around instead of sitting still, a chunk of what we fund for attention problems would count as enhancement under our own rule, which makes me think "normal functioning" is quietly being measured against a world we invented; I'd like a question that catches cases where the demand being met is one our own institutions created, and I'd like you to tell me honestly if that question opens a hole we can't close.

  Then run it on these. (1) A cochlear implant for a 45-year-old man who has been profoundly deaf since birth, fluent signer, active in the Deaf community, otherwise healthy; half the panel thinks this is obviously treatment because he's deaf, half thinks it's enhancement because there's nothing there to restore. (2) A request from occupational health on behalf of night-shift nurses for a wake-promoting drug — the papers just call it Drug W, it's licensed for narcolepsy, these nurses don't have narcolepsy, they have our rota — with data showing measurably higher error rates on nights. (3) Growth hormone for a twelve-year-old boy on the second percentile for height, no deficiency, both parents short, predicted adult height about 5'3", and the referral letter mentions bullying. I've a feeling at least one of those comes out somewhere the panel won't want to go — my guess is the growth hormone one, since we've always informally treated short stature as cosmetic, but if it's a different one that should bother us, say so plainly instead of letting me fudge it. If you've room, sketch the case that keeps coming up and that I personally can't get straight: a 58-year-old surgeon whose memory is completely normal for her age and not for her job. And tell me which distinctions I have to keep for the procedure to stay honest, which ones I can drop without it going wrong, and where it will give me an answer that's consistent and defensible but just isn't right.
reasoning: |-
  Hmm, the user is a GP on a healthcare funding panel facing challenges with the therapy-enhancement distinction. They need a practical decision-making framework that can handle real cases in limited time. 

  The core tension lies in their mandate: funding "restoration/maintenance of normal functioning" but not "improvement beyond normal." What seemed clear in theory unravels with actual cases. They've done background reading but found academic discussions unhelpful for concrete decisions. 

  Key constraints:
  - Must use plain English (no jargon like "species-typical")
  - Limited clinical submissions (often missing crucial data)
  - Need consistency with prior decisions without strict precedent
  - Must address two thorny issues: positional goods and socially constructed "normality"

  The three test cases reveal fault lines:
  1. Cochlear implant for culturally Deaf adult: Is deafness a "condition to restore" when it doesn't impair function within his community?
  2. Wake-promoting drugs for night-shift nurses: Is combating institutional demands "treatment"?
  3. Growth hormone for non-deficient short stature: Where does "normal" end and enhancement begin?

  The surgeon case adds another layer: When occupational demands exceed age-typical function. 

  The proposed framework must:
  - Be executable in 15-minute slots
  - Generate appeal-proof rationales
  - Explicitly flag when decisions become value judgments
  - Handle missing data robustly
  - Surface societal biases in defining "normal"

  For the positional goods dilemma (e.g., ADHD accommodations in standard classrooms), we'll need to confront whether funding individual advantages in zero-sum situations aligns with their mandate. The socially constructed "normality" problem requires acknowledging that environments create disabilities - but we must avoid opening unlimited liability for institutional flaws.

  The decision pathway should:
  1. Start with objective functional impact assessment
  2. Establish baseline comparators (individual/age/typical)
  3. Then address the harder normative questions
  4. Explicitly separate factual gaps from value judgments

  Crucially, we'll maintain the therapy-enhancement distinction but reframe "normal functioning" as:
  - Measurable functional capacity relative to...
  - ...what's typical for that age group in...
  - ...standard environments (while acknowledging this last bit is contestable)

  The growth hormone case will likely fall as enhancement - not because shortness isn't distressing, but because their mandate prohibits funding non-medical disadvantages. But we must be clear that this reveals a limitation in their framework, not a moral judgment.

  For the surgeon, we might approve interim support while acknowledging the real problem is occupational inflexibility - but the panel's role is to apply their mandate, not fix systemic issues.

  The procedure will work best when:
  - Functional impacts are measurable
  - Baselines are clear
  - Pathologies are present

  It will struggle with:
  - Socially mediated suffering
  - "Previvor" scenarios
  - Performance demands exceeding typical aging

  But crucially, it will force transparent value calls rather than hiding them in medicalized language.
answer: |-
  Here's a practical decision procedure designed for 15-minute case reviews, with plain English phrasing, explicit handling of unknowns, and mechanisms for consistency. It separates factual questions (which can stop the process) from value judgments (requiring panel vote).

  ---

  ### **Decision Procedure: "Restoration vs. Enhancement" Framework**
  **Core Principle:** Fund only interventions that *restore or maintain* measurable function to what is *typical for that individual's age group* in daily life. Do not fund improvements beyond typical function or solutions to socially created disadvantages.

  #### **Step 1: Functional Impact**  
  *Question:* **"Does the person struggle with daily activities most others their age can do *without* medical help?"**  
  - *Sufficient evidence:* Clinical documentation of specific limitations (e.g., "cannot hear alarms," "makes errors in routine tasks," "unable to reach kitchen shelves").  
  - *Unknown/missing data:* **Stop → Return as "Insufficient Evidence."**  
  - *If "no" → Decline funding.* (No functional deficit = enhancement).  
  - *If "yes" → Proceed to Step 2.*

  #### **Step 2: Baseline Function**  
  *Question:* **"Is the problem caused by a disease, injury, or congenital condition that reduced their *personal* function below what's typical for their age?"**  
  - *Sufficient evidence:* Diagnosis (e.g., meningitis causing deafness, narcolepsy, growth hormone deficiency).  
  - *Unknown → Stop → "Insufficient Evidence."*  
  - *If "yes" → Proceed to Step 3.*  
  - *If "no" → Proceed to Step 4* (e.g., lifelong deafness, short stature without deficiency).

  #### **Step 3: Restoration Potential**  
  *Question:* **"Would the treatment reliably return them to function typical for their age?"**  
  - *Sufficient evidence:* Peer-reviewed data showing ≥50% of similar patients achieve age-typical function.  
  - *Unknown → Decline* (unproven restoration).  
  - *If "yes" → Approve.*  
  - *If "no" → Decline* (incomplete restoration).

  #### **Step 4: Social/Environmental Cause**  
  *Question:* **"Is the problem primarily caused by societal demands (e.g., work schedules, building design) or a lifelong difference *not* defined as a medical condition?"**  
  - *Sufficient evidence:* Documentation linking limitation to external factors (e.g., "errors only on night shifts," "height insufficient for standard desks").  
  - *If "yes" → Proceed to Step 5.*  
  - *If "no" or unknown → Decline* (no medical basis for restoration).

  #### **Step 5: Positional Benefit & Values Vote**  
  *Question:* **"Would funding this create an advantage that *only* works because most people don't have it?"**  
  - *Examples:* Cognitive enhancers in competitive jobs, cosmetic treatments for social gain.  
  - *If "yes" → Decline* (funding violates "no enhancement" rule).  
  - *If "no" → Proceed to Vote Question.*  
  - **Vote Question:** **"Is denying funding likely to cause severe harm or injustice that outweighs our enhancement rule?"**  
    - *Panel votes.* Majority decides.  
    - *Record reason:* "Approved/denied due to exceptional equity concerns."

  ---

  ### **Recording for Consistency**  
  - **Template for decision letter:**  
    > "We found [functional limitation]. The cause is [medical/non-medical]. Treatment offers [restoration/enhancement] because [evidence from Steps 1-5]. Positional benefit? [Yes/No]. Equity vote? [Yes/No/Not needed]."  
  - **Database tags:** Functional domain (e.g., "hearing," "alertness"), cause ("disease," "congenital," "environmental"), positional ("yes/no").

  ---

  ### **Handling Test Cases**
  #### **1. Cochlear Implant (Profoundly Deaf Since Birth)**  
  - **Step 1:** Yes (e.g., cannot hear alarms, phone calls).  
  - **Step 2:** No (no *reduction* from baseline; congenital difference). → **Step 4:** Yes (limitations due to sound-based society). → **Step 5:**  
    - Positional? **Yes** (implant provides advantage in hearing-centric world; universal funding wouldn't "evaporate" but isn't medically needed).  
    - Vote Question: Severe harm? **Debatable** (culturally Deaf may reject "harm"). → **Decline (Enhancement)**.  
    *Rationale:* No function to *restore*; intervention adds capability beyond typical human variation.

  #### **2. Drug W for Night-Shift Nurses**  
  - **Step 1:** Yes (higher error rates on nights).  
  - **Step 2:** No (no disease; caused by rota). → **Step 4:** Yes (societal cause: work schedule). → **Step 5:**  
    - Positional? **Yes** (if all nurses used it, advantage evaporates; safer shifts become baseline).  
    - Vote Question: Severe harm? **Yes** (patient safety risk). → **Approve on equity grounds** (vote required).  
    *Rationale:* Environment creates hazard; funding mitigates institutional harm despite positional benefit.

  #### **3. Growth Hormone (Non-Deficient Short Stature)**  
  - **Step 1:** Yes (bullying limits social function).  
  - **Step 2:** No (no deficiency; genetic variation). → **Step 4:** Yes (limitations due to societal norms). → **Step 5:**  
    - Positional? **Yes** (height advantage matters because not all are tall).  
    - Vote Question: Severe harm? **Unlikely** (distress ≠ severe harm; cosmetic under mandate). → **Decline (Enhancement)**.  
    *Rationale:* Function (reaching, mobility) intact; societal bias doesn't justify medical enhancement.

  #### **4. Surgeon with Age-Typical Memory Decline**  
  - **Step 1:** Yes (cannot recall surgical protocols quickly).  
  - **Step 2:** No (normal aging, not disease). → **Step 4:** Yes (job demands exceed age-typical function). → **Step 5:**  
    - Positional? **Yes** (cognitive enhancers would advantage her competitively).  
    - Vote Question: Severe harm? **No** (career transition possible). → **Decline**.  
    *Rationale:* Funding would enhance beyond normal aging; solution is workplace adaptation.

  ---

  ### **Critical Distinctions & Limitations**  
  **Must-Keep Distinctions:**  
  - **Functional vs. Social Limitation** (Steps 1 vs. 4).  
  - **Positional Benefit Check** (Step 5) – Prevents zero-sum enhancements.  
  - **Baseline = Age-Typical Function** – Avoids conflating aging with disease.  

  **Can-Drop Safely:**  
  - "Species-typical" – Age group comparison is sufficient.  
  - "Normal" – Replaced with "typical for age" (e.g., normal memory for 58 ≠ surgeon's needs).  

  **Where the Procedure Fails Honestly:**  
  - **Social Justice Cases:** Step 5 vote allows exceptions but can't resolve systemic issues (e.g., funding cochlear implants perpetuates hearing-centric design).  
  - **"Created Demand" Blind Spot:** The procedure flags socially caused limitations but *cannot* force institutions to change. It may decline worthy cases (e.g., growth hormone) due to mandate limitations.  
  - **Predictable "Wrong" Outcome:** Declining non-deficient short stature *feels* unjust but is consistent. The problem is the mandate, not the framework.  

  **Biggest Risk:** Step 4’s "social cause" question *does* open a hole – it forces acknowledgment that society disables people, but funding individual fixes (like Drug W) may absolve systems of responsibility. The vote mitigates this but can't close it entirely.  

  **Recommendation:** Use declined cases to advocate for institutional changes (e.g., "We denied growth hormone but recommend school anti-bullying programs"). The procedure delivers defensible decisions, but its moral adequacy depends on the mandate itself.  

  ---  
  This framework ensures transparency, handles missing data decisively, and isolates value judgments for panel votes. It won't make hard cases easy – but will make them consistent.
