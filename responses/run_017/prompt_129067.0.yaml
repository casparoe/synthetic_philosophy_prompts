answer: |-
  1. This is a substantive metaphysical disagreement rooted in conflicting intuitions about ontological commitment and the relationship between fundamental physics, causal power, and ordinary language, not merely terminological confusion.
  2. The persistent, recalcitrant pressure from arguments like the argument from vagueness demonstrates that the conflict arises from deep tensions within our conceptual scheme concerning existence and parthood, not superficial ambiguity in the term 'composition'.
  3. The role-fragmentation hypothesis is compelling and the incompatibility conjecture likely correct; the *causal-unity role* is the primary driver of substantive disagreement, as it demands a metaphysically robust distinction that the bookkeeping role undermines and the descriptive role struggles to justify non-arbitrarily.
  4. Mereological flatness would decisively refute nihilism (by denying privileged parts) and embarrass universalism (by showing composition is explanatorily idle), but it wouldn't resolve the tension between causal unity demands and descriptive practice, leaving moderates scrambling to ground restrictions without physics.
  5. Progress requires disentangling the roles explicitly: either developing distinct composition relations for each role, abandoning the demand for a single relation, or demonstrating that one role (likely causal unity) definitively overrides the others for metaphysical purposes.
