  For the physics test: mereological flatness would devastate nihilism by undermining any privileged decomposition, embarrass universalism by showing composition adds nothing to physics, and leave moderates struggling to justify their restrictions. But it wouldn't resolve the underlying metaphysical tensions because the roles would persist - we'd still need bookkeeping variables, causal explanations, and practical descriptions.

