  ---

  **Question 5: Condorcet Jury Theorem in Practice (30 marks)**

  You are a member of a housing co-operative with 41 members. Recently, the co-op changed its decision-making process for major capital projects (like replacing the roof) from a 3-person maintenance committee to a vote of the entire membership, with decisions made by majority rule. The change was justified by appealing to the Condorcet jury theorem, which states that if each voter is independent and has a probability \( p > 0.5 \) of being correct, then the probability that the majority makes the correct decision increases to 1 as the group size increases. However, after the change, concerns were raised about the accuracy of the new process.

  The old maintenance committee had 3 members. Each member independently made the correct decision with probability 0.7. The entire membership has 41 members. Based on historical data, it is estimated that on a typical capital decision, the probability that a randomly chosen member (from the entire membership) would independently make the correct decision is 0.55. However, the members are not all independent. Specifically:

  - 5 members are "reasonably informed" and vote independently with individual competence 0.55.
  - The remaining 36 members are "casual". Among these:
      - One member, Dale, is highly influential and makes the correct decision with probability 0.7.
      - 30 of the casual members always vote exactly as Dale does.
      - The other 5 casual members vote independently with individual competence 0.55.

  Thus, the entire membership consists of:
  - Dale (who votes correctly with probability 0.7),
  - 30 members who always vote the same as Dale (we call these the "Dale followers"),
  - 5 reasonably informed members (each independent, competence 0.55), and
  - 5 independent casual members (each independent, competence 0.55).

  **Part A: Committee Accuracy (4 marks)**
  Calculate the probability that the old 3-person maintenance committee (with independent voters, each with competence 0.7) makes the correct decision by majority rule. Show your work.

  **Part B: Independent Assembly Accuracy (6 marks)**
  Suppose that all 41 members voted independently with competence 0.55. Calculate the probability that the majority makes the correct decision. Use the normal approximation to the binomial distribution. Show your work, including the parameters of the normal distribution and the z-score.

  **Part C: Actual Assembly Accuracy (8 marks)**
  Now consider the actual voting behavior described above (with Dale, his followers, and the independent voters). Calculate the probability that the majority of the 41 votes is correct. Explain your reasoning.

  **Part D: Independence and the Jury Theorem (6 marks)**
  Compare the probabilities you computed in Parts A, B, and C. Explain why the result in Part C is different from what one might expect from the Condorcet jury theorem. In particular, discuss the role of independence in the theorem and how the dependence in the actual assembly affects the group’s accuracy.

  **Part E: Applicability of the Theorem (6 marks)**
  The Condorcet jury theorem assumes that there is an objectively correct decision. In the context of the co-op’s decision about replacing the roof, discuss whether this assumption holds. Identify aspects of the decision that might be matters of fact and those that might be matters of values or preferences. How might this distinction affect the use of the Condorcet jury theorem for such a decision?

  ---

  **Model Answer** (approx 600 words)

  **Part A: Committee Accuracy (4 marks)**

  The old committee has 3 independent members, each with competence \( p = 0.7 \). The committee makes the correct decision by majority rule, meaning at least 2 votes must be correct.

  The probability of exactly 2 correct is \( \binom{3}{2} (0.7)^2 (0.3) = 3 \times 0.49 \times 0.3 = 0.441 \).

  The probability of exactly 3 correct is \( \binom{3}{3} (0.7)^3 = 1 \times 0.343 = 0.343 \).

  Therefore, the total probability is \( 0.441 + 0.343 = 0.784 \).

  **Part B: Independent Assembly Accuracy (6 marks)**

  If all 41 members vote independently with competence \( p = 0.55 \), the number of correct votes \( X \) follows a binomial distribution with \( n = 41 \) and \( p = 0.55 \). We use the normal approximation to compute \( P(X \geq 20.5) \) (since we require at least 21 votes for a majority, and we use continuity correction).

  Mean \( \mu = n p = 41 \times 0.55 = 22.55 \).

  Variance \( \sigma^2 = n p (1-p) = 41 \times 0.55 \times 0.45 = 41 \times 0.2475 = 10.1475 \).

  Standard deviation \( \sigma = \sqrt{10.1475} \approx 3.185 \).

  We compute the z-score for \( X = 20.5 \):

  \( z = \frac{20.5 - 22.55}{3.185} = \frac{-2.05}{3.185} \approx -0.6436 \).

  We need \( P(X \geq 20.5) = P(Z \geq -0.6436) = P(Z \leq 0.6436) \) (by symmetry of the normal distribution).

  Using standard normal tables, \( P(Z \leq 0.64) \approx 0.7389 \) and \( P(Z \leq 0.65) \approx 0.7422 \). Interpolating, for 0.6436, we use approximately 0.740.

  Thus, the probability is approximately 0.740.

  **Part C: Actual Assembly Accuracy (8 marks)**

  In the actual assembly, there are three voting blocs:

  1. Dale and his 30 followers: This bloc has 31 votes that are always the same as Dale's vote. Since Dale is correct with probability 0.7, the entire bloc votes correctly with probability 0.7.

  2. The 5 reasonably informed independent members: Each votes independently with competence 0.55.

  3. The 5 independent casual members: Each votes independently with competence 0.55.

  Note that the votes of the independent members (groups 2 and 3) are independent of Dale and of each other.

  Now, the entire assembly of 41 votes. The majority decision is correct if at least 21 votes are correct.

  Consider two cases:

  - Case 1: Dale is correct (probability 0.7). Then the Dale bloc (31 votes) is correct. The remaining 10 votes (from the independent members) can be correct or incorrect, but the total correct votes are at least 31 (since the bloc is correct and the independents might add more). Since 31 > 20.5, the majority is correct regardless of the independent votes. Therefore, in this case, the assembly is correct.

  - Case 2: Dale is incorrect (probability 0.3). Then the Dale bloc (31 votes) is incorrect. The independent members can contribute at most 10 correct votes (if all are correct). Therefore, the total correct votes are at most 10. But 10 < 21, so the majority is incorrect.

  Therefore, the assembly is correct if and only if Dale is correct. The probability is 0.7.

  **Part D: Independence and the Jury Theorem (6 marks)**

  The probabilities are:
  - Old committee: 0.784
  - Independent assembly: 0.740
  - Actual assembly: 0.700

  The Condorcet jury theorem states that if voters are independent and each has competence above 0.5, then increasing the group size increases the group's accuracy. However, in our actual assembly, the group accuracy (0.7) is less than the old committee (0.784) and also less than the independent assembly (0.740). This is because the actual assembly violates the independence assumption.

  In the actual assembly, 31 votes (Dale and his followers) are perfectly dependent: they all follow Dale. This dependence means that the group of 31 effectively provides only one independent signal (Dale's vote). Therefore, the entire assembly's accuracy is determined solely by Dale's accuracy. The theorem relies on independent signals to reduce the variance and to allow the majority to converge to the truth. Here, the dependence creates a large bloc that can dominate the outcome, and the additional voters (the followers) do not provide new information. Thus, the group accuracy does not benefit from the larger size and is capped by the accuracy of the most influential voter.

  **Part E: Applicability of the Theorem (6 marks)**

  The Condorcet jury theorem assumes that there is an objectively correct decision. In the roof decision, there are both factual and value components. Factual components might include: the expected cost of patching versus replacing, the expected lifespan of the current roof, and the probability of leaks in the next five years. These are matters of fact to which the theorem might apply. However, the decision also involves value judgments: how much risk the co-op is willing to take, how much disruption they are willing to endure, and how they weigh immediate costs against future costs. These are matters of preference and cannot be objectively "correct" in the same way.

  Because the decision involves values, the theorem does not directly apply to the entire decision. The theorem is only valid for the factual part. For the value part, democratic voting may be appropriate to aggregate preferences, but the jury theorem does not guarantee that the majority will choose the "best" outcome because there is no objective truth about preferences. Therefore, the co-op might benefit from separating the factual questions (using expert opinions or the jury theorem for the facts) and then making a decision that reflects the members' values.

  ---

  **Marking Scheme (30 marks total)**

  **Part A: Committee Accuracy (4 marks)**
  - 1 mark for setting up the binomial probability (at least 2 correct)
  - 2 marks for correct calculation (0.784)
  - 1 mark for showing work

  **Part B: Independent Assembly Accuracy (6 marks)**
  - 1 mark for identifying binomial parameters (n=41, p=0.55)
  - 1 mark for mean (22.55) and variance (10.1475) or standard deviation (3.185)
  - 1 mark for continuity correction (using 20.5)
  - 1 mark for correct z-score (-0.6436)
  - 1 mark for correct normal probability (0.740)
  - 1 mark for showing work

  **Part C: Actual Assembly Accuracy (8 marks)**
  - 2 marks for identifying the Dale bloc (31 votes) and its accuracy (0.7)
  - 2 marks for recognizing that the independent voters (10 votes) do not affect the outcome when the Dale bloc is correct (because 31>20.5)
  - 2 marks for recognizing that when Dale is wrong, the entire assembly is wrong (because at most 10 correct votes)
  - 2 marks for the conclusion (probability = 0.7)

  **Part D: Independence and the Jury Theorem (6 marks)**
  - 1 mark for comparing the probabilities (0.784, 0.740, 0.700)
  - 2 marks for explaining the role of independence in the Condorcet jury theorem (independent signals are key)
  - 2 marks for explaining how the dependence (the Dale bloc) reduces the effective number of independent signals and caps the accuracy at Dale's accuracy
  - 1 mark for connecting to the theorem's requirement of independence and how the violation leads to lower accuracy than the independent case

  **Part E: Applicability of the Theorem (6 marks)**
  - 2 marks for distinguishing factual and value components in the roof decision
  - 2 marks for explaining that the theorem applies only to factual components (with objective truth)
  - 2 marks for discussing the implications for the co-op's decision process (separating facts and values)

  **Typical Mistakes and How Grades Are Separated:**

  - **A vs B**: The B answer will correctly compute the probabilities in Parts A, B, and C but may not fully explain the conceptual points in Parts D and E. The A answer will tie the computations to the limitations of the Condorcet jury theorem, especially the independence assumption and the objective truth requirement. The A answer will also articulate the implications for the co-op's reform.

  - **Common Mistakes**:
    - Part A: Forgetting to add the probability of 3 correct, or incorrect binomial coefficient.
    - Part B: Not using continuity correction, or miscalculating mean/variance.
    - Part C: Not realizing that the Dale bloc of 31 votes is decisive (so that the outcome is solely determined by Dale). Some might try to model the independent votes and then condition, but without noting that the independent votes are irrelevant if the bloc is correct and insufficient if the bloc is wrong.
    - Part D: Stating that independence is important but not explaining how the dependence in the actual assembly causes the accuracy to be exactly Dale's accuracy.
    - Part E: Not distinguishing facts and values, or not discussing the implications for the theorem's applicability.

  **Note to Instructor**: The exact binomial probability for Part B (41 independent with p=0.55) is approximately 0.739. You can compute it as follows (for your answer key):

      P(X>=21) = 1 - P(X<=20)

      Using a binomial calculator: 
          P(X<=20) = binomcdf(41,0.55,20) ≈ 0.2607

          So P(X>=21) = 1 - 0.2607 = 0.7393.

      The normal approximation (0.740) is very close.

  **Final Note**: The question is designed to show that the reform (moving to the entire membership) actually reduced the accuracy (from 0.784 to 0.7) due to the dependence. Even in the best-case scenario (all independent), the accuracy (0.74) would still be lower than the old committee, but the dependence makes it worse. This challenges the reflex that "more voters is more accurate".
answer: |-
  ### Problem Set Question: Collective Decisions and the Condorcet Jury Theorem  
  **Total Marks: 30**  
  **Word Guide: ~700 words for a strong answer**  

  #### Background  
  Your housing co-op (41 members) recently shifted major capital decisions (e.g., roof replacement) from a 3-person maintenance committee to a full membership vote (simple majority). This reform was justified using the Condorcet jury theorem: if voters are independent and each has probability \(p > 0.5\) of being correct, group accuracy increases with size. However, concerns arose due to dependence among voters.  

  - The **old committee** (3 members) voted independently. Each had probability **0.7** of being correct.  
  - The **41 members** have mixed competence:  
    - 5 "informed" members vote independently, each correct with probability **0.55**.  
    - 36 "casual" members:  
      - **Dale** (1 person) is correct with probability **0.7**.  
      - **30 casual members** always copy Dale’s vote.  
      - **5 casual members** vote independently, each correct with probability **0.55**.  

  Assume all listed probabilities are independent *where applicable*.  

  ---

  #### Tasks  
  **Part A: Old Committee Accuracy (4 marks)**  
  Calculate the probability that the old 3-member committee made correct decisions by majority rule. Show your work.  

  **Part B: Hypothetical Full Membership Accuracy (Independent Voters) (6 marks)**  
  Suppose all 41 members voted **independently** with competence \(p = 0.55\). Compute the probability of a correct majority decision using the **normal approximation** to the binomial distribution. Show your steps (mean, variance, z-score, and probability).  

  **Part C: Actual Full Membership Accuracy (With Dependence) (8 marks)**  
  Calculate the probability of a correct majority decision under the **actual voting system** (with Dale and his followers). Explain your reasoning step by step.  

  **Part D: The Role of Independence (6 marks)**  
  Compare your results from Parts A, B, and C. Explain why the actual assembly’s accuracy (Part C) contradicts the intuition that "larger groups are more accurate." Discuss how the Condorcet jury theorem’s assumptions—especially **independence**—apply (or fail) here.  

  **Part E: Fact vs. Preference (6 marks)**  
  The roof decision involved both *factual* questions (e.g., "Will the roof last 5 more years?") and *value* questions (e.g., "Is the disruption worth a new roof?"). Discuss how this affects the applicability of the Condorcet jury theorem. Should the co-op distinguish facts from preferences? Why?  

  ---

  ### Model Answer  
  **~600 words**  

  **Part A: Old Committee Accuracy**  
  The committee uses majority rule with 3 independent voters, each correct with \(p = 0.7\). A majority requires \(\geq 2\) correct votes. Using the binomial formula:  
  \[
  P(\text{correct}) = P(X=2) + P(X=3) = \binom{3}{2}(0.7)^2(0.3) + \binom{3}{3}(0.7)^3 = (3 \times 0.49 \times 0.3) + (1 \times 0.343) = 0.441 + 0.343 = 0.784.
  \]  
  **Probability = 0.784**.  

  **Part B: Hypothetical Full Membership Accuracy (Independent Voters)**  
  With 41 independent voters (\(p = 0.55\)), the number of correct votes \(X \sim \text{Binomial}(41, 0.55)\). Majority requires \(X \geq 20.5\) (continuity correction for 21 votes).  
  - Mean \(\mu = np = 41 \times 0.55 = 22.55\),  
  - Variance \(\sigma^2 = np(1-p) = 41 \times 0.55 \times 0.45 = 10.1475\),  
  - Standard deviation \(\sigma \approx \sqrt{10.1475} = 3.185\).  
  - \(z\)-score: \(z = \frac{20.5 - 22.55}{3.185} \approx -0.644\).  
  - \(P(X \geq 20.5) = P(Z \geq -0.644) = P(Z \leq 0.644) \approx 0.740\) (using standard normal tables).  
  **Probability ≈ 0.740**.  

  **Part C: Actual Full Membership Accuracy (With Dependence)**  
  - Dale’s bloc (Dale + 30 followers) casts 31 identical votes, correct if Dale is correct (\(P = 0.7\)).  
  - Independent voters: 5 informed + 5 casual = 10 voters, each correct with \(p = 0.55\).  

  The assembly is correct **only if Dale’s bloc is correct**:  
  - If Dale is correct (probability 0.7), his bloc provides 31 correct votes. This exceeds the 20.5-vote majority threshold alone, so the outcome is correct *regardless* of independents.  
  - If Dale is incorrect (probability 0.3), his bloc provides 31 incorrect votes. Even if all 10 independents are correct (max 10 votes), total correct votes = 10 < 21. The majority is incorrect.  

  Thus, the assembly’s accuracy equals Dale’s accuracy: **Probability = 0.7**.  

  **Part D: The Role of Independence**  
  - **Results**: Old committee: **0.784**, Hypothetical independent assembly: **0.740**, Actual assembly: **0.700**.  
  - **Contradiction**: The actual assembly (0.700) is *less accurate* than the old committee (0.784), despite more voters. This contradicts the "larger groups are more accurate" intuition.  
  - **Independence in Condorcet**: The theorem assumes voters provide **independent signals**, allowing errors to cancel out. Here, 30 voters blindly follow Dale, reducing 31 votes to a **single dependent signal**. This dependence:  
    - Caps accuracy at Dale’s competence (0.7), ignoring the independents.  
    - Violates the theorem’s core assumption, preventing growth in accuracy with group size.  

  **Part E: Fact vs. Preference**  
  - **Factual components** (e.g., "Will patching last 5 years?") have objective truths, making the Condorcet theorem applicable *if* voters are independent.  
  - **Preference components** (e.g., "Is disruption worth avoiding risk?") lack objective correctness; they involve values best aggregated by fair voting, not truth-tracking.  
  - **Implication**: The co-op should **separate facts from preferences**:  
    - Use expert/jury processes for factual sub-questions (where independence matters).  
    - Use preference aggregation (e.g., voting) for value judgments.  
    - Blending them misapplies the Condorcet theorem, as "accuracy" is undefined for preferences.  

