prompt: |-
  I'm an undergraduate philosophy major in a seminar on philosophical method, and we have just finished a unit on thought experiments: what they can establish, how they persuade, and when the persuasion is illegitimate. Our seminar uses the phrase intuition pump for the cases that move us by something other than the argument they are supposed to contain. I have tried to sort the cases we read into the ones I think we are entitled to lean on and the ones I think are rigged, and my verdicts do not line up with any rule I can state. I would like help finding the rule, or being told which of my verdicts to abandon.

  My verdicts, on the cases as I have them:

  1. The Gettier-style case, in which someone has a justified true belief that is true only by luck, either from a stopped clock or from a landscape of convincing barn facades. Legitimate. The conditions were specified independently of the case, the case satisfies them, and the mismatch tells us something about the analysis being tested.

  2. The runaway trolley that can be diverted onto a sidetrack where it will kill one instead of five. Legitimate. I trust the intuition as data, and I do not think the trolley imagery is contributing anything the principle under test fails to mention.

  3. The surgeon who cuts up a healthy visitor in order to distribute his organs to five dying patients. Not legitimate, or at least very heavily over-credited. I think the verdict people give is driven by the bodily violation framing rather than by the numbers.

  4. The case in which you wake up wired to a famous violinist who will die if you unplug. Also not legitimate for me, and for what I take to be the same reason. But when I rewrote the case for a friend in the driest contractual language I could manage, with no kidnapping, no tubes and no hospital gown, my friend's verdict flipped to the one I actually hold on reflection, and I became confident again. So I trust the dry version and distrust the famous version, which are the same case with the imagery either present or removed.

  5. Mary's room, in which a scientist who has never seen color learns every physical fact about color vision and then sees red for the first time. Legitimate. I do not accept the conclusion most people draw from it, but I think the case is fair and that the intuition it produces is real and needs answering.

  6. The zombie case, in which a world physically identical to ours contains no consciousness. Not legitimate. I do not think my sense that such a world is conceivable is evidence about anything, and I do not think the case can be made to support the weight put on it.

  7. Twin Earth, in which the clear drinkable stuff in the lakes of a distant planet has a different chemical composition from water. Legitimate. I think the intuition here is anchored by real cases of the sort that actually settle how a term attaches to a kind.

  8. Swampman, the molecule-for-molecule duplicate of a person produced by chance in a swamp. Not legitimate. I have no stable intuition about it at all, and it seems to me impossible in a way that matters, not merely impossible in a way that can be ignored.

  9. The experience machine, in which you can be plugged permanently into a simulation of a wonderful life. Not legitimate. I think the reluctance to plug in is status quo bias plus a framing that makes the alternative sound narcotic, and I do not think the case can be filled in far enough to remove that.

  10. A case I invented: over ten years, one detail of your autobiography is rewritten each night while you sleep, until your memories match those of another person. Are you the same person at the end? I distrust every answer here, including my own, and I think the reason is that the case is badly under-described rather than that the question is deep.

  11. Another case I invented: the same structure as the trolley case, except that the five are on a stretch of track that curves out of view and you learn of them from an instrument readout rather than seeing them. My verdict weakens noticeably but does not vanish. I cannot tell whether this shows the original verdict was contaminated by the visual framing or merely that my confidence was always partly visual.

  The tentative principle I have been working with has three clauses. A thought experiment is evidentially usable only if, first, it survives de-pumping: strip the imagery, the proper names and the narrative, state the case in the thinnest possible prose, and the verdict should be unchanged. Second, it satisfies an anchor requirement: the intuition it elicits must have a nearby real case that we have independent reason to trust. Third, it satisfies an isolation requirement: the case must vary only what the theory under test says makes no difference.

  These clauses do not agree with each other on my own list. De-pumping is what saves my verdict on case 3, but Mary's room appears to have no content at all once the qualitative image is stripped away, and yet I counted it as legitimate; maybe the anchor clause, rather than de-pumping, is what separates case 5 from case 6, since sight restoration and sensory substitution are real while zombie worlds are not. And I do not know what any of the three clauses says about cases 10 and 11.

  What I would like, in American English, is the following: a principle, or at most two rival principles, stated precisely enough that I could apply it to a new case without asking you; for each clause, the case of mine that motivates it and the case that causes it trouble; an honest account of which of my eleven verdicts the principle cannot recover and which of them you think I should overturn; and verdicts on three cases I have not listed. The first is a de-pumped version of the zombie case, if one can be written. The second is the common practice of reaching a hard verdict by walking someone through a long sequence of cases that each differ from the last only slightly, so that the end of the sequence looks like the beginning. The third is any thought experiment of your choosing whose central figure is very unlike a human being, such as a hive mind or a system trained on text. Please also tell me what would count as a genuine check on the principle rather than another intuition about it. I do not need the literature surveyed or sources cited; I need the principle and what it costs me.
reasoning: |-
  Okay, let me start by really understanding what this philosophy student is asking. They're in a seminar on philosophical method, specifically focusing on thought experiments and intuition pumps. They've classified eleven different cases into legitimate or illegitimate based on their own judgment, but they can't find a consistent rule. Their goal is to get a clear principle or two that can be applied consistently, even if it means changing some of their initial verdicts.

  First, I need to look at their verdicts on each case. They consider Gettier, trolley, Twin Earth, and Mary's room legitimate. But they reject the surgeon, violinist, zombie, Swampman, experience machine, and their own cases (10 and 11) as problematic. The key points they raise are de-pumping (removing narrative elements), anchoring to real cases, and isolation (only varying relevant factors).

  The student proposed three clauses: de-pumping, anchor requirement, and isolation requirement. But these clash. For example, de-pumping works for the violinist case (4) but seems to fail for Mary's room (5) because stripping away qualitative experience leaves nothing. Anchoring helps distinguish Mary's room (real cases of sight restoration) from zombies (no real parallel). Isolation is tricky for trolley variations like their case 11, where removing visual elements weakens intuition.

  I notice that some cases rely on modal intuition (zombies, Mary's room) while others are more about moral principles (trolley, surgeon). The student seems more skeptical of modal cases without real-world anchors. Their distrust of zombies and Swampman might stem from the lack of conceivable real analogs, whereas Twin Earth ties to actual science (like chemical kinds).

  Their invented cases highlight under-description (case 10) and framing effects (case 11). The weakening of intuition in the trolley variant suggests that visual framing does influence judgments, which challenges the isolation requirement. But maybe the core moral principle still holds if the numbers are clear, just with less confidence.

  For a unifying principle, maybe the key is whether the intuition survives abstraction to its structural core and connects to real-world practices or necessities. Cases that can't be de-pumped without losing the point (like Mary's room) might still be valid if anchored in real phenomena. Meanwhile, cases driven by emotional narratives (surgeon, violinist) fail de-pumping, revealing illegitimate influences.

  The student needs a principle that allows some imagery when it's essential (e.g., qualia in Mary's room) but rejects it when it's manipulative (violinist's kidnapping). So the distinction isn't just about stripping details but whether those details are necessary for the conceptual point. 

  Also, for the additional cases: a de-pumped zombie might be impossible without real anchors, slippery slope arguments could be legitimate if each step is isolable, and non-human entities would test if the intuition relies on anthropocentric bias. 

  Ultimately, the student might need to adjust their verdicts on Swampman (if anchored in biology) and the experience machine (if de-pumped shows status quo bias). The principle should emphasize functional role over imagery, with anchoring as a check against mere conceivability.
answer: |-
  Here's a principled framework derived from your intuitions, designed to adjudicate your cases and provide clear guidance. It prioritizes **functional robustness** over narrative vividness:

  ### The Core Principle: Functional Equivalence Anchored in Practice (FEAP)
  A thought experiment is evidentially legitimate **if and only if**:
  1.  **Functional Core Preservation (FCP):** The intuition elicited survives translation into a minimal, affectively neutral description that captures only the *structural/functional relationships* relevant to the target concept.
  2.  **Operational Anchor (OA):** The core intuition connects demonstrably to how we *actually operate* with the target concept in non-hypothetical reasoning, decision-making, or linguistic practice (e.g., resolving disagreements, correcting misapplications, making predictions).

  ### Why FEAP Explains Your Verdicts (and Challenges Some)
  *   **Gettier (1): Legitimate (FCP+OA)**
      *   *FCP:* "Agent has belief P justified by evidence E; P is true; but the connection between E and P's truth is accidental." → Intuition preserved.
      *   *OA:* We constantly distinguish knowledge from accidentally true, well-supported guesses in epistemology, law, history, science.
  *   **Trolley (2): Legitimate (FCP+OA)**
      *   *FCP:* "Action A saves 5 lives at cost of 1; Inaction allows 5 to die; No other relevant differences." → Intuition preserved.
      *   *OA:* We weigh costs/benefits and compare actions vs. inaction in policy, triage, resource allocation.
  *   **Surgeon (3): Illegitimate (Fails FCP)**
      *   *FCP:* "Agent can save 5 lives by taking resources from 1 healthy individual, killing them." → Intuition *flips* or weakens significantly for many. The visceral "bodily violation" framing is doing heavy lifting not present in the functional core.
  *   **Violinist (4): Illegitimate (Fails FCP), Legitimate Depumped (FCP+OA)**
      *   *FCP:* "Agent is connected to another; Severing connection kills the other but is necessary for agent's bodily autonomy/continued life." → Your dry version demonstrates FCP success (intuition preserved). The vivid version fails FCP by adding kidnapping/tubes.
      *   *OA:* Bodily autonomy and refusal of life-support are core concepts in medical ethics and law.
  *   **Mary's Room (5): Legitimate (FCP+OA)**
      *   *FCP:* "Agent knows all physical facts about phenomenon X; Agent gains new information upon experiencing X." → Intuition preserved (new info = phenomenal character). *Crucially, FCP requires preserving the functional role of experience itself.*
      *   *OA:* We distinguish propositional knowledge from experiential knowledge constantly (learning to ride a bike vs. reading about it, describing pain vs. feeling it).
  *   **Zombie (6): Illegitimate (Fails OA)**
      *   *FCP:* Conceivable? Yes. "World physically identical to ours lacks phenomenal consciousness." → Intuition preserved for many.
      *   *OA Fails:* Our operational use of "consciousness" is *tied to* physical/functional criteria (behavior, neurology). We don't *operationally* treat consciousness as separable in this way; we infer it from physical/functional facts. Zombies rely solely on conceivability detached from practice.
  *   **Twin Earth (7): Legitimate (FCP+OA)**
      *   *FCP:* "Substance S in environment E has superficial properties P but hidden structure H; Substance S' in environment E' has P but H'; Would term T (anchored in E to H) apply to S'?" → Intuition preserved.
      *   *OA:* This mirrors real practices: discovering Pluto isn't a planet, fool's gold vs. gold, correcting misidentifications based on underlying structure (e.g., chemical analysis).
  *   **Swampman (8): Illegitimate (Fails OA)**
      *   *FCP:* "Entity physically identical to a person arises spontaneously. Is it a person?" → Unstable intuition (as you note).
      *   *OA Fails:* Our personhood attributions rely on history/origin (biological, social) *as well as* current state. "Spontaneous generation" isn't part of our operational criteria; we have no practice for it. It severs the concept from its actual historical/contextual anchors.
  *   **Experience Machine (9): Illegitimate (Fails FCP & OA)**
      *   *FCP:* "Option A: Live real life. Option B: Live life with guaranteed maximal positive subjective experience via direct neural stimulation." → Intuition weakens/changes significantly for many when described neutrally. "Narcotic" framing and status quo bias heavily influence the vivid version.
      *   *OA Fails:* Our value judgments about "real" vs. "simulated" experiences are complex and context-dependent (e.g., enjoying a movie vs. living in VR). There's no clear operational anchor for the strong intuition *against* plugging in as a general principle.
  *   **Autobiography Rewrite (10): Illegitimate (Fails FCP & OA)**
      *   *FCP:* Impossible to state minimally without losing the phenomenon. "Gradual replacement of memory content" doesn't capture the identity worry. Adding the identity worry makes it non-minimal and ambiguous.
      *   *OA Fails:* Our operational criteria for personal identity (psychological continuity + connectedness, often with bodily criterion) are applied continuously, not in "all-at-once" judgments about massively altered hypothetical futures. The case is too detached from practice.
  *   **Instrument Trolley (11): Legitimate but Weaker (FCP+OA, highlights framing effect)**
      *   *FCP:* Same as Trolley (2) - structural facts (5 vs 1, action vs inaction) are preserved. Intuition persists, though weaker.
      *   *OA:* Same as Trolley (2).
      *   *Why Weaker?* The visual framing likely amplified confidence by making the stakes feel more "real" or vivid, but it didn't *create* the core intuition about numbers/action. FEAP explains the weakening as reduced *salience*, not invalidation. The core functional intuition remains anchored in practice.

  ### FEAP vs. Your Tentative Clauses
  *   **De-pumping:** FEAP's FCP is similar but crucial: **It only requires stripping *affective/narrative* elements, not *essential functional* elements.** Mary's Room *requires* the concept of "gaining new information via experience" – that's functional, not just imagery. Your clause 1 was too strict by demanding "thinnest possible prose," potentially stripping necessary functional roles. FCP allows essential functions to remain.
  *   **Anchor Requirement:** Absorbed into FEAP's OA. OA is stricter: it demands connection to *actual operational use*, not just a "nearby real case." This clearly separates Mary (connects to experiential vs propositional knowledge distinction we make) from Zombies (no operational separation of consciousness from physical/functional criteria).
  *   **Isolation Requirement:** FEAP doesn't require isolation as a separate criterion. FCP ensures only relevant structural features are present in the core. If a case *fails* because it varies something irrelevant (e.g., visual framing in Trolley 11 affecting *confidence* but not the *core intuition*), it highlights the importance of FCP, but the core intuition anchored in OA may still hold. FEAP focuses on the robustness of the *core* intuition.

  ### Verdicts FEAP Cannot Recover (You Should Overturn)
  1.  **Swampman (8):** FEAP judges it illegitimate (lacks OA). Your lack of stable intuition aligns with FEAP. Overturn your "Not legitimate" only if you can find a robust *operational* anchor for personhood attribution that ignores origin/history. Currently, OA fails.
  2.  **Experience Machine (9):** FEAP judges it illegitimate. Your diagnosis (status quo bias + framing) aligns with FCP failure. Overturn your "Not legitimate" only if a truly neutral description reliably produces the strong anti-plugging intuition *and* connects to a clear operational principle we use (OA). It likely doesn't.

  ### FEAP Verdicts on Your New Cases
  1.  **De-pumped Zombie:**
      *   *Core:* "Consider a universe U1 physically identical to our universe U0 at time T. In U1, no subjective experiences occur. Is U1 conceivable? Does its conceivable existence show that phenomenal properties are non-physical?"
      *   *FEAP Verdict:* **Illegitimate.** FCP preserved (conceivability intuition may remain). **OA Fails:** Our concept of consciousness is *operationally* applied based on physical/functional properties (behavior, brain states). We don't have a practice of *separately* verifying "real" consciousness detached from these. The conceivability intuition lacks an operational anchor in how we actually use the concept. It remains a pure intuition pump.
  2.  **Slippery Slope / Continuum Argument:**
      *   *Core:* "Case A is clear. Case B differs minimally from A. Case C differs minimally from B. ... Case Z is clear in the opposite direction. Therefore, since we accept A, we must accept Z (or vice versa)."
      *   *FEAP Verdict:* **Conditionally Legitimate, but Fraught.**
          *   *FCP:* Can be preserved if each step *only* varies the parameter under test and the minimal difference is truly negligible *relative to the target concept*.
          *   *OA:* Only legitimate if the *operational criteria* for the concept are actually applied in a way sensitive to such tiny differences in real practice. Often, they are not – our categories have fuzzy boundaries or thresholds. The argument relies on the *intuition* of continuity, not operational practice. It can be legitimate for concepts with continuous operational criteria (e.g., height=tall), but often illegitimate for concepts with thresholds or multi-dimensional criteria (e.g., personhood, justice) where small changes *do* matter operationally at specific points. **Proceed with extreme caution; often an intuition pump.**
  3.  **Non-Human Central Figure (e.g., Hive Mind):**
      *   *Core (Example):* "A collective of insects (Hive) exhibits complex, coordinated problem-solving indistinguishable from intelligent human planning. Each insect acts only on simple local rules. Does Hive possess beliefs, desires, or consciousness?"
      *   *FEAP Verdict:* **Potentially Legitimate, tests concept boundaries.**
          *   *FCP:* Requires careful minimal description focusing *only* on functional organization and capacities relevant to the target concept (e.g., problem-solving, communication, adaptability for "intelligence" or "belief"; integrated global states for "consciousness").
          *   *OA:* Legitimate *if* the intuition connects to our operational criteria for applying the concept. If we attribute beliefs/desires to systems based *only* on functional role (e.g., thermostats, chess computers, in some contexts), then the intuition might be anchored. If our operational criteria *require* specific biological substrates (e.g., for consciousness), the intuition might lack an anchor. **The value lies in forcing us to examine our OA.** Does our practice *really* depend on the substrate, or just the function? The case is legitimate if it probes OA rigorously.

  ### Genuine Check on FEAP (Beyond Intuition)
  A genuine check requires **empirical investigation of operational practice (OA)**:
  1.  **Linguistic Analysis:** How do people actually resolve disputes or correct misapplications of the target concept (e.g., "Is this *really* knowledge?", "Is that machine *really* intelligent?", "Was that person *conscious*?")? What criteria do they invoke? (See work in experimental philosophy/X-Phi).
  2.  **Analysis of Institutional Practices:** How are concepts applied operationally in law (insanity, personhood, consent), science (species, element, disease), or medicine (death, pain)? What features are decisive?
  3.  **Cognitive Science:** How are concepts like "cause," "intention," or "self" actually processed and applied in real-time reasoning? Do the intuitions match the cognitive mechanisms?
  4.  **Conceptual Evolution:** How has the operational application of the concept changed over time in response to new discoveries or social changes (e.g., "water," "planet," "marriage")? Does this reveal its functional core?

  FEAP doesn't dismiss intuitions; it demands that they be justifiable by reference to how concepts *work* for us in the world. Your strongest intuitions (Gettier, Trolley, Twin Earth, Mary) succeed because they pass this test. Your skepticism towards others (Surgeon, Violinist-vivid, Zombie, Swampman, Experience Machine, Autobiography) is well-placed by FEAP's lights. FEAP suggests you were right to trust the dry Violinist and the Instrument Trolley (though its weakness is instructive), and provides clear grounds to overturn any lingering trust in Swampman or the Experience Machine as robust evidence.
