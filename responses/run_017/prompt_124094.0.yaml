answer: |-
  ## Grant Proposal: Rationality and the Hidden Parameter of Expected Utility in Non-Absolutely Convergent Gambles

  **Project Title:** Matching Rules, Rearrangement Freedom, and the Foundations of Expected Utility in the Pasadena Paradox

  **1. Core Question & Intellectual Crux:**
  The standard resolution of the Pasadena paradox declares the expected utility (EU) undefined due to the conditional convergence of the alternating harmonic series representing its payoffs. Your insight challenges this: **Is the "rearrangement freedom" not a defect of the gamble itself, but rather evidence of a hidden parameter within the EU framework – a "matching rule" specifying how infinite positive and negative payoff tails are netted?** The central question this project will rigorously investigate is:

  *   **Precise Question:** *Can Expected Utility Theory be consistently extended to handle non-absolutely convergent gambles (like the Pasadena game) by explicitly incorporating a "matching rule" parameter, and what normative constraints (if any) do standard axioms of rational choice (Stochastic Dominance, Statewise Dominance, Invariance under Gambling Redescription, Additivity over Independent Gambles) impose on the selection of such a rule?*

  The crux lies in whether these axioms:
  *   **Collapse the Framework:** Force convergence to the principle that EU only exists under absolute convergence (invalidating the matching rule approach).
  *   **Constrain Meaningfully:** Select a unique matching rule (e.g., the "natural order" ln(2)), a privileged class of rules, or leave substantial freedom.
  *   **Lead to Incoherence:** Generate contradictions, especially when applying additivity to independent copies.

  **2. Why Standard Moves Leave the Question Open:**
  *   **"Undefined" (Orthodoxy):** Ignores the intuition that the gamble *does* have a "core" value (ln(2)) and dismisses the question of tail matching as irrelevant.
  *   **"Any Value You Like" (Rearrangement):** Treats rearrangement as arbitrary, failing to acknowledge that specific rearrangements correspond to specific, potentially defensible, matching rules for netting tails. It doesn't engage with whether rationality *selects* a rule.
  *   **Bounded Utility:** Avoids the problem but changes the underlying model, potentially limiting applicability to realistic unbounded valuations.
  *   **Nonstandard/Weak Expectations:** Often provide *an* answer (e.g., using hyperreals) but lack a clear decision-theoretic story about *why* that specific answer is privileged by rational axioms. Is it just a technique, or does it correspond to a specific matching rule? Your approach aims for axiomatic grounding within standard real-valued EU.

  **3. Methodology & Work Plan (3 Months):**
  *   **Month 1: Formalization & Axiomatization (Weeks 1-4)**
      *   **Task 1.1:** Define "Matching Rule" ($\mathcal{M}$) rigorously. Formalize it as a specific pairing function mapping subsets of positive payoff states to subsets of negative payoff states with "equivalent" tail magnitudes under a chosen metric (e.g., absolute value, utility magnitude). Define the net EU($\mathcal{M}$) resulting from applying $\mathcal{M}$.
      *   **Task 1.2:** Translate core rationality axioms into constraints on $\mathcal{M}$:
          *   *Stochastic Dominance:* If gamble A dominates B statewise, EU($\mathcal{M}_A$) > EU($\mathcal{M}_B$) for any consistent $\mathcal{M}$.
          *   *Statewise Dominance:* Directly constrains state-by-state comparisons.
          *   *Invariance:* If two gambling schemes describe the same underlying payoff distribution (like different coin-labeling), EU($\mathcal{M}$) must be identical. Requires defining equivalence classes of descriptions w.r.t. $\mathcal{M}$.
          *   *Additivity (Key Challenge):* Define EU($\mathcal{M}_{A \oplus B}$) for independent gambles A and B. Does it equal EU($\mathcal{M}_A$) + EU($\mathcal{M}_B$)? If so, how must $\mathcal{M}_{A \oplus B}$ relate to $\mathcal{M}_A$ and $\mathcal{M}_B$?
  *   **Month 2: Test Case Analysis & Axiomatic Tension Resolution (Weeks 5-8)**
      *   **Task 2.1: Pasadena vs. Pasadena + $1 (PD):**
          *   Apply Statewise Dominance: PD strictly dominates Pasadena. *Requires:* EU($\mathcal{M}_{PD}$) > EU($\mathcal{M}_P$) for *all* admissible $\mathcal{M}$. Does this hold, or could a pathological $\mathcal{M}$ violate it?
      *   **Task 2.2: Pasadena vs. St. Petersburg (SP):**
          *   Compare divergent tail structures. Does any $\mathcal{M}$ make Pasadena preferable to SP, or vice-versa? Do axioms constrain this?
      *   **Task 2.3: Two Independent Pasadena Games (P x P) (Crucial):**
          *   **Investigate Additivity:** Does EU($\mathcal{M}_{P \times P}$) = 2 * EU($\mathcal{M}_P$)?
          *   **Potential Conflict:** If the natural order $\mathcal{M}_P$ yields ln(2), does $\mathcal{M}_{P \times P}$ yield 2*ln(2)? Or does the combined game's more complex tail structure under a "naive" $\mathcal{M}$ lead to a different value? If additivity is demanded axiomatically, what structure must $\mathcal{M}$ have across independent copies? Might this force a *specific* $\mathcal{M}$ for the single game? Or prove impossible without absolute convergence?
  *   **Month 3: Synthesis, Deliverables & Failure Assessment (Weeks 9-12)**
      *   **Task 3.1:** Synthesize results. Does a consistent framework emerge? What degree of freedom (if any) do the axioms allow for $\mathcal{M}$? Is ln(2) uniquely privileged? If freedom remains, is it normatively significant?
      *   **Task 3.2:** Formalize the extended EU framework incorporating $\mathcal{M}$.
      *   **Task 3.3:** Draft paper outlining theory, results, and philosophical implications.

  **4. Deliverables:**
  1.  A formally defined "Matching Rule" framework for extending EU to conditionally convergent gambles.
  2.  Analysis of the constraints imposed by standard axioms (Dominance, Invariance, Additivity) on admissible matching rules.
  3.  Definite verdicts on the proposed test cases within the framework.
  4.  A clear answer: Does rationality pin down a unique value (ln(2)), a class of values, or allow substantial freedom for Pasadena?
  5.  A draft manuscript: "Matching Rules: The Hidden Parameter Revealed by the Pasadena Paradox".

  **5. Defining Success and Failure:**
  *   **Good Result (Success):** The framework is internally consistent. Axioms meaningfully constrain $\mathcal{M}$ but do *not* force absolute convergence. Test cases yield determinate, axiomatically justified answers (e.g., Pasadena + $1 is always better; Additivity holds only for specific $\mathcal{M}$ choices, potentially singling out ln(2) or a class). The hidden parameter interpretation is validated as distinct from nonstandard work.
  *   **Failure Conditions:**
      *   **Collapse:** The axioms (especially Additivity) inevitably force the conclusion that EU only exists under absolute convergence. The matching rule parameter adds no value.
      *   **Indeterminacy:** The axioms impose minimal constraints, leaving EU($\mathcal{M}$) effectively arbitrary for Pasadena. The framework offers no predictive or normative power for the test cases.
      *   **Incoherence:** Applying the axioms (particularly Additivity over independent games) leads to contradictions or inconsistencies within the framework.
      *   **Repackaging:** The framework is shown to be formally equivalent to existing nonstandard or weak expectation approaches, offering no new conceptual insight.
      *   **Intractability:** Formalizing the matching rules or applying the axioms to the test cases proves mathematically intractable within 3 months.

  **6. Scope & Feasibility Assessment:**
  The scope is ambitious but focused. The core question is sharply defined. Three months is sufficient because:
  1.  **Foundation:** Defining matching rules and translating core axioms is a manageable formalization task (Month 1).
  2.  **Test Cases:** The critical test cases (Pasadena variants, St. Pete, Independent Copies) are specific and well-defined. Analyzing them under the axioms requires careful argumentation but not open-ended exploration (Month 2).
  3.  **Focus:** Avoiding literature review and citation hunting saves significant time. The goal is internal theoretical development and axiomatic testing.
  4.  **Deliverable Clarity:** Success is measured by clear answers to the specific questions posed about axioms and test cases, not by solving all infinite EU problems.

  **Conclusion:**
  This project tackles a fundamental conceptual puzzle in decision theory – the status of conditionally convergent expectations like the Pasadena game. It rigorously tests a novel and philosophically intriguing hypothesis: that the standard EU framework always contained a hidden "matching rule" parameter, revealed only by infinite gambles. By formally defining matching rules and subjecting them to the core axioms of rational choice, particularly the crucible of additivity over independent games, the project will determine whether this parameter offers a coherent extension of EU theory or collapses under normative pressure. The test cases provide concrete benchmarks for success or failure. The potential payoff is significant: either a principled way to evaluate a notorious paradox revealing a hidden dimension of rational choice, or a demonstration of why such evaluations are impossible without abandoning core axioms. This focused, axiomatic investigation is both philosophically deep and feasible within a three-month timeframe.
