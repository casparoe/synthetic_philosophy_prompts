prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, which is where I picked up both the habit of treating expected-utility maximization as the normative gold standard and the habit of distrusting self-report. I now sit on the allocation committee of a small health-and-development fund (roughly $400k a year), and for two years we have ranked grants using subjective-wellbeing accounting: self-reported life-satisfaction points multiplied by the number of people affected, of the kind some happiness-focused funders have been pushing. I've never been comfortable with it. The scale has no fixed unit, and comparing one villager's reported satisfaction with another's looks like exactly the interpersonal comparison of utility that the ordinalist tradition warned us is unscientific.

  It occurred to me recently that we might not need introspection at all. If the point of revealed-preference theory is that utility can be reconstructed from choice, and if the von Neumann–Morgenstern theorem gives a cardinal utility function from choices over lotteries — unique up to positive affine transformation — then I can elicit a beneficiary's utility function behaviorally (hypothetical lotteries, certainty equivalents, fit the curve) and then remove the residual freedom by rescaling each person's function to the unit interval, anchoring zero at the worst outcome in that person's relevant menu and one at the best. Call the result a behavioral well-being unit. The output is cardinal, person-specific, behaviorally grounded, and expressed in a common unit, so I can sum across people and compare programs; and nothing in the procedure depends on anyone's introspection or on my guessing what goes on inside anyone's head. I've been using small-stakes lotteries so that the curvature I measure is local, on the theory that this keeps me from merely recording risk aversion.

  Two observations make me doubt the scheme. First, the numbers come out strange: under this normalization, someone whose range runs from "nothing changes" to "receives a bed net" has exactly the same zero-to-one span as someone whose range runs from "child survives" to "child dies," so the two can contribute identically to the total. Second, when I ran the procedure on myself over small monetary gambles, the fitted curve came out nearly linear, which would imply I should be close to indifferent between a sure $50,000 raise and a coin flip between nothing and $100,000 — and I am emphatically not.

  So where is the mistake, and is it repairable? Is the problem the normalization (and if so, what is the right one?), or is the elicitation itself measuring something other than welfare? I keep being told that Harsanyi already solved the interpersonal-comparison problem, but his aggregation theorem looks to me like it assumes the very comparability I'm trying to measure. Is there a principled version of what I'm attempting, or does the underdetermination go all the way down?
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're on the allocation committee for a health-and-development fund, using subjective well-being metrics but uncomfortable with the methodology. They've proposed an alternative based on revealed preference and vNM utility theory but are encountering issues with the normalization and risk preferences.

  First, I need to understand their core concern: interpersonal utility comparisons. They mention ordinalist warnings and distrust self-reports, which makes sense given their rationalist background. Their proposed solution involves behavioral elicitation via lotteries and normalization to 0-1 scales. But the outputs seem problematic—comparing trivial benefits to life-and-death situations as equal, and their personal risk aversion test contradicts the model.

  Hmm, the normalization issue is glaring. Scaling everyone's utility to [0,1] regardless of outcome range destroys meaningful comparison. A bed net recipient's "full scale" isn't comparable to a parent avoiding child mortality. The user intuitively recognizes this, but the model doesn't capture it. This feels like a fundamental flaw in the approach.

  Then there's the risk aversion mismatch. Their near-linear curve for small stakes implies risk neutrality, but they reject the $50k vs coin flip equivalence. This suggests either misapplication of vNM axioms or scope limitations. Small-stakes lotteries might not reveal true risk preferences for larger sums—a known behavioral economics puzzle (like Rabin's critique).

  I recall Harsanyi's aggregation theorem assumes pre-existing cardinal utilities. But the user is trying to derive those utilities behaviorally, which circles back to the comparability problem. They're right to question if Harsanyi "solved" this—his theorem requires what they're attempting to measure.

  Alternative paths? DALYs/QALYs come to mind—they avoid self-reports by standardizing health states. But the user might resist introducing external valuations. Equivalent income is another option, but it's money-centric and may not capture non-material benefits well.

  The user's meta-question about underdetermination is profound. Welfare economics has grappled with this for decades. Their insight is correct: no method escapes assumptions. The choice between behavioral metrics (like their proposal) vs standardized units (like DALYs) vs self-reports involves trade-offs between objectivity, richness, and comparability.

  The key is helping them see that their normalization choice *is* the value judgment they hoped to avoid. By rescaling ranges to 0-1, they implicitly treat all outcome spans as equally important—which is ethically significant. Better to make such judgments explicit, perhaps through beneficiary consultation or deliberative weighting.

  For practical steps: Suggest piloting multi-stage lotteries to capture curvature beyond small stakes, or testing normalization anchors (e.g., worst/best imaginable outcomes). But emphasize that perfect cardinal comparability remains illusory—their discomfort with the bed net vs child mortality comparison is philosophically warranted.
answer: |-
  Your approach is admirably rigorous but stumbles on fundamental issues in welfare economics and decision theory. The core problems are **normalization choice** and **scope limitations of vNM utility**, not mere implementation errors. Here's a breakdown:

  ### 1. **The Normalization Problem: Destroying Welfare Significance**
     - Your rescaling to [0,1] for each individual **discards interpersonal information** about outcome severity. 
     - Mathematically: If person A has \( u_A(\text{death}) = 0 \), \( u_A(\text{survival}) = 1 \), and person B has \( u_B(\text{no net}) = 0 \), \( u_B(\text{net}) = 1 \), you force:
       \[
       \Delta u_A = \Delta u_B = 1
       \]
       even if the *actual welfare difference* between death and survival is astronomically larger than between no net and net.
     - **Consequence**: Your sum implicitly claims that saving a life provides the same welfare gain as distributing a bed net. This violates both intuition and ethical priorities.

  ### 2. **The vNM Utility Misalignment: Risk ≠ Welfare**
     - vNM utility captures **risk attitudes**, not just pure welfare. Your near-linear curve for small stakes doesn't prove you value money linearly—it reflects **local risk neutrality**.
     - **Why your coin-flip example fails**:
       - vNM utilities are **context-dependent on the lottery domain**. Your curve was elicited over small gambles, but your aversion to the $50k vs. $100k coin flip reveals:
         - **Wealth effects**: Marginal utility of money diminishes at larger scales.
         - **Probability weighting**: Real humans overweight small probabilities of loss.
       - vNM utility *can* measure welfare, but only under strong assumptions (e.g., identical risk preferences across domains)—which fail here.
     - **Key insight**: The vNM approach conflates *utility of outcomes* with *attitudes toward risk*. Harsanyi's aggregation assumes the former, but your method measures a blend.

  ### 3. **Where Harsanyi Doesn't Help (Yet)**
     - You’re correct: Harsanyi's **Utilitarianism Theorem** *assumes* interpersonal comparability. It shows that if:
       1. Individuals have vNM utilities \( u_i \),
       2. The social planner has vNM preferences over outcomes,
       3. Preferences satisfy Pareto axioms,
       → Then social welfare *must* be a weighted sum of \( u_i \).
     - **But**: It doesn't solve how to *calibrate* the \( u_i \) across people. Your scaling choice (0 to 1) is one arbitrary normalization; Harsanyi leaves the weighting underdetermined.

  ---

  ### Toward a Principled Alternative

  No method escapes value judgments, but you can improve:

  #### A. **Normalization with Welfare Anchors**
     - Instead of arbitrary rescalings, anchor utilities to **meaningful welfare thresholds**:
       - **Option 1**: Set 0 at a "neutral" outcome (e.g., subsistence) and 1 at a "high welfare" benchmark (e.g., healthy life expectancy). Requires defining these *intersubjectively*.
       - **Option 2**: Use **equivalent income** or **life-years** as a numeraire.  
         *Example*: "How much income would make you indifferent to receiving this health intervention?" then compare monetary equivalents across individuals.

  #### B. **Revealed Preference Beyond Small Stakes**
     - Elicit vNM utilities over **broader outcome ranges** for each person.  
       - Instead of bed nets vs. status quo, include: "bed net," "malaria cure," "child survives," etc.  
       - Fit a single utility function over the full range of *relevant* outcomes.
     - **Advantage**: Avoids comparing locally scaled utilities from disjoint outcome sets.

  #### C. **Hybrid Approaches: Combining Behavior and Introspection**
     - **Calibrate vNM with welfare judgments**: 
       1. Use vNM lotteries to find *individual-specific* curvature.
       2. Anchor 0 and 1 using **objectively defined endpoints** (e.g., "death" = 0, "full health" = 1 for all), then map personal vNM utils to this scale.
     - **Example**: Ask certainty equivalents for gambles involving death vs. health states, then normalize so death=0, full health=1.

  #### D. **Adopt Standardized Welfare Metrics (e.g., WELLBYs, DALYs)**
     - **WELLBYs** (Wellbeing-Adjusted Life Years): Use life-satisfaction surveys but *calibrate to population-level anchors* (e.g., "severe depression" = -9 WELLBYs/year).  
     - **DALYs/ QALYs**: Standardizes health outcomes via disability weights—avoids self-report biases but may miss non-health welfare.

  ---

  ### Conclusion: The Underdetermination Problem
  **Yes, underdetermination goes "all the way down."** Your dilemma exposes the core challenge of welfare economics: 
  - **Ordinalism** forbids interpersonal comparisons.  
  - **Harsanyi** requires them as inputs.  
  - **Behavioralism** (vNM) confounds risk with welfare.  

  **Practical path forward**:
  1. **Abandon universal 0-1 scaling**—it destroys welfare information.  
  2. **Adopt intersubjective anchors** (e.g., death=0, full health=1) and elicit vNM utilities over *comparable outcome ranges*.  
  3. **Use supplemental metrics** (e.g., consumption equivalents) to cross-validate.  
  4. **Acknowledge value judgments**: Choosing anchors is ethical, not technical. Involve beneficiaries in defining welfare thresholds.  

  As a funder, your most defensible approach may be **cost-effectiveness using standardized units** (e.g., DALYs/$) supplemented with beneficiary consultation. This accepts modest incomparability while prioritizing transparency. The quest for perfect cardinal comparability is noble, but—as your experiment shows—likely quixotic.
