answer: |-
  Based on your requirements, I've constructed a decision tree with 10 branch nodes (questions about concrete cases) that sorts participants into positions without relying on pre-existing labels. The tree prioritizes logical consistency, forces distinctions between named positions, and flags unattractive or incoherent paths. Each question is phrased to avoid telegraphing philosophical commitments. The cases are sequenced to maximize differentiation, starting with the simplest functionalist/substrate split and escalating to branching and reductionist tests.

  ### **Decision Tree Structure**
  **Assumed starting points** (not branched on):  
  1. Perfect neuron-for-neuron functional replacement is technically possible.  
  2. "Would I survive?" is a coherent question, even if the answer is "no fact of the matter."

  ---

  #### **Node 1: Instantaneous Destruction & Emulation (Case 5)**  
  *The biological brain is destroyed all at once. An emulation built from a prior scan starts the next instant with perfect functional match.*  
  Does the original person survive?  
  - **A. Yes** → Go to Node 2 (tests functionalist commitments)  
  - **B. No** → Go to Node 3 (tests substrate/gradualness commitments)  
  - **C. No fact of the matter / ill-formed question** → Go to Node 9 (tests reductionist/no-self views)  

  #### **Node 2: Branching Scenario (Case 6, Hard Variant)**  
  *During gradual replacement, the biological brain is kept alive/conscious. Post-replacement, both biological and upload are active, functionally identical, and claim to be the original.*  
  How many instances of the original person exist?  
  - **A. Two: both are equally the original** → **Leaf B (Straight functionalism/patternism)**  
  - **B. One: the upload is the original** → *Incoherent* (contradicts functionalism; upload lacks physical continuity)  
  - **C. One: the biological is the original** → *Incoherent* (contradicts Node 1-A; biological was destroyed in instantaneous case)  
  - **D. Zero: the original is gone** → **Leaf D (No-branching/best-candidate view)**  

  #### **Node 3: Gradual Sharp Swap (Standard Case, 100% Match)**  
  *One neuron at a time is replaced with a perfect functional duplicate (sharp swap).*  
  Does the original person survive?  
  - **A. Yes** → Go to Node 4 (tests necessity of 100% match)  
  - **B. No** → **Leaf A (Biological/substrate-dependence)**  

  #### **Node 4: Gradual Swap with 99.9% Match (Case 1)**  
  *Single neuron replaced with a unit matching 99.9% of inputs (diverges on rare cases).*  
  Does this replacement destroy the original person?  
  - **A. Yes** → Go to Node 5 (tests whole-brain divergence)  
  - **B. No** → Go to Node 6 (tests crossfade vs. sharp)  

  #### **Node 5: Whole-Brain 99.9% Match (Case 1)**  
  *After full replacement, all units diverge on 0.1% of inputs.*  
  Does the original person survive?  
  - **A. Yes** → *Unattractive* (functional match is degraded, but survival is claimed)  
  - **B. No** → **Leaf C (Gradualness + 100% match required)**  

  #### **Node 6: Crossfade vs. Sharp Swap (Case 2)**  
  *In a "crossfade" version, weights ramp down/up over hours with no discrete swap. The outcome is functionally identical to a sharp swap.*  
  Does survival depend on the crossfade being used?  
  - **A. Yes: crossfade is necessary** → *Incoherent* (functional outputs are identical)  
  - **B. Yes: sharp swap is necessary** → *Unattractive* (no functional difference)  
  - **C. No: survival is identical** → **Leaf B (Straight functionalism/patternism)**  

  #### **Node 7: Subjective Thinning Reports (Case 3)**  
  *At 40% replacement, the subject reports "thinner" experience (e.g., less vivid colors), but this resolves post-procedure.*  
  What does this imply?  
  - **A. The original is partially surviving** → Go to Node 8 (tests order effects)  
  - **B. A new entity is emerging** → **Leaf A (Substrate-dependence)**  
  - **C. Reports are irrelevant to identity** → **Leaf B (Functionalism)**  

  #### **Node 8: Order Effects & Anesthesia (Case 4)**  
  *Replacement is done: (i) cortex-first while awake, or (ii) brainstem-first under anesthesia.*  
  Does survival depend on the order/method?  
  - **A. Yes: cortex-first is necessary** → *Unattractive* (prioritizes "higher" functions arbitrarily)  
  - **B. Yes: brainstem-first is necessary** → *Unattractive* (prioritizes consciousness maintenance arbitrarily)  
  - **C. No: survival is identical** → **Leaf C (Gradualness required, but order irrelevant)**  

  #### **Node 9: Never-Run Scan (Case 9)**  
  *A perfect scan exists but is never instantiated.*  
  Has the person survived?  
  - **A. Yes: the pattern is what matters** → *Unoccupied* (no major philosophy defends this)  
  - **B. No: instantiation is required** → Go to Node 10 (tests reductionism vs. no-self)  
  - **C. The question is nonsense** → **Leaf F (No persistent self)**  

  #### **Node 10: Gap Case (Case 8)**  
  *Scan is stored for 200 years before instantiation.*  
  Does the original person survive?  
  - **A. Yes, identically to no-gap** → **Leaf B (Functionalism)**  
  - **B. Partially, with degraded identity** → **Leaf E (Reductionist view)**  
  - **C. No: the gap prevents survival** → *Incoherent* (contradicts Node 9-B; gap differs from non-instantiation)  

  ---

  ### **Resulting Leaves & Positions**
  1. **Leaf A: Biological/substrate-dependence**  
     - Upload is a copy; you die unless biological continuity is preserved.  
     - Path: Node 1-B → Node 3-B *or* Node 1-B → Node 3-A → Node 4-A → Node 7-B.  

  2. **Leaf B: Straight functionalism/patternism**  
     - Survival depends on functional match; gradualness, timing, gaps, and branching are irrelevant.  
     - Path: Node 1-A → Node 2-A *or* Node 1-B → Node 3-A → Node 4-B → Node 6-C *or* Node 1-C → Node 9-B → Node 10-A.  

  3. **Leaf C: Gradual replacement required**  
     - Instantaneous upload is death; gradualness (with 100% match) ensures survival.  
     - Path: Node 1-B → Node 3-A → Node 4-A → Node 5-B *or* Node 1-B → Node 3-A → Node 7-A → Node 8-C.  

  4. **Leaf D: No-branching/best-candidate**  
     - Branching destroys the original; survival requires a unique, continuous candidate.  
     - Path: Node 1-A → Node 2-D.  

  5. **Leaf E: Reductionist view**  
     - Survival is a matter of degree; questions like "did I survive?" have no binary answer.  
     - Path: Node 1-C → Node 9-B → Node 10-B.  

  6. **Leaf F: No persistent self**  
     - The question "would I survive?" is misdescribed; there is no "self" to persist.  
     - Path: Node 1-C → Node 9-C.  

  ---

  ### **Critical Notes & Distinctions**
  - **Untenable paths** flagged as:  
    - *Incoherent*: Logically inconsistent (e.g., Node 2-B/C, Node 6-A/B).  
    - *Unattractive*: Coherent but philosophically unstable (e.g., Node 5-A, Node 8-A/B).  
    - *Unoccupied*: Coherent but undefended (e.g., Node 9-A).  

  - **Indistinguishable pairs**:  
    - **Reductionist (E) vs. No-self (F)** collapse without Node 9/10. The tree separates them via *instantiation* and *gap* requirements.  
    - **Functionalism (B) vs. No-branching (D)** are cleanly split by Node 2 (branching case).  

  - **Missing distinctions**:  
    - **Leaf E (reductionist) vs. Leaf C (gradualness required)** may blur if reductionism is misapplied. Added Node 10 (gap case) forces separation: Leaf C rejects gaps (non-gradual), while Leaf E accepts partial survival with gaps.  
    - **Leaf B (functionalism) vs. Leaf D (no-branching)** need Case 6 explicitly. Without it, they collapse—hence Node 2 is mandatory.  

  - **Why your cases work**:  
    - Case 1 (99.9% match) separates hard functionalists from gradualness/substrate views.  
    - Case 2 (crossfade) isolates superstitions about discrete swaps.  
    - Case 6 (branching) is the *only* way to distinguish functionalism from no-branching.  
    - Case 9 (never-run) forces reductionist/no-self to confront instantiation.  

  This tree captures all 6 requested leaves, uses all 9 cases, and exposes incoherencies (e.g., claiming functionalism but rejecting branching). For your group, I recommend adding a final "audit" question (e.g., "Does your survival require a soul?") to catch hidden assumptions and force re-runs.
