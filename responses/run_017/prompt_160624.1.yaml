prompt: |-
  I clerk for a mid-sized city's Public Names and Monuments Committee: nine lay members appointed by council on rotating terms, no research budget beyond a few hours of a junior staffer's time, and a standing requirement that we return a written recommendation with reasons within six weeks of a petition being accepted. We see fifteen to twenty matters a year. About half are demands to remove, rename, relocate, or recontextualize something the city already owns — a bronze statue on a courthouse lawn, a school, a named bridge, a donor plaque in a hospital lobby; the rest are proposals to add: a new name for a park path, a marker on city land, a bust in a civic building. Council ratifies almost everything we send up, so in practice our recommendation *is* the decision, and it has to be drafted so that it survives both a council floor debate and a hostile newspaper editorial. Right now what we actually do is ask whether the person was a bad person, argue about it for two meetings, and split four to five. I want to replace that with something we can run.

  So: give me an ordered decision procedure my committee could actually operate. I want the questions in sequence, what counts as a sufficient answer to each, the point at which the procedure returns a default of retention and stops, the point at which it returns removal or renaming, and — most importantly, because this is where we currently collapse — the points at which it must hand the decision to a human because the remaining question is one of values or of city identity rather than of fact. It needs a full menu of dispositions (retain as is, retain with annotation, move to a museum or cemetery, rename, remove, rename *and* install something new, install a counter-commemoration alongside) together with a test for when recontextualization is genuinely adequate and when it is a way of appearing to act while leaving the object doing the same work. It also needs to separate the case where we are stuck because the historical facts are contested from the case where the facts are agreed and what is contested is what they mean for eligibility, since our six weeks and one staffer can only settle the first kind of question some of the time. Please don't tell us to commission a biography or consult an archive; the whole point is a procedure that works with what a junior staffer can find in six weeks.

  Four distinctions have been forced on us by recent cases and I want them built into the procedure rather than averaged away. First, the difference between the *honoree* and the *deed or role* for which a thing was erected: a statue raised in 1911 to a man as a wartime general, a hospital wing named for a woman because she gave the money, a school named for a teacher — is the object committed to the whole life or only to one act, and what follows when the act and the life come apart? Second, what I have started calling inert honorifics: a great many of our street names were attached to surveyors, engineers, and landowners in the 1920s and have long since decayed into pure addresses, and I have noticed that a removal campaign can *revive* an inert name's honorific force — it becomes a badge, a thing people defend — so the cost of acting and the cost of not acting are not independent of our own proceedings. Third, the difference between taint in the honoree and taint in the origin: some of our objects were installed by private organizations with an explicit ideological purpose and a condition in the gift, which seems to me a different objection from the one you get from the biography. Fourth, scarcity: the city has a roughly fixed stock of honorific slots, so every retention is also a refusal to give that slot to someone or something else, and our procedure has never once priced that in.

  Please run the procedure you give me on three matters currently on our desk. (1) A bronze statue, erected 1911 by subscription from business associates, of a local industrialist who funded the city's first public library and a hospital wing and who also, in the 1890s, led and publicly defended a campaign of violent strikebreaking in which several workers were killed; the inscription praises him as a friend of the workingman. (2) A residential street named in 1923 for a city engineer who designed the sewer system and who, in the same decade, served on the committee that produced the racially restrictive covenant scheme the city then enforced for forty years; nobody on the street has any idea who he was, a history graduate student found the connection, and the petition has already attracted a counter-petition from people who have never heard the name before this month. (3) A proposal, from two different groups, about a site on city land where a lynching took place in 1919: one group wants the pedestrian path there named for the victim, the other wants only a marker with no name; the victim's surviving family has told us they want no new name at all, and our existing rules require that names honour distinguished citizens, which a victim of violence is not.

  I took one philosophy elective as an undergraduate and remember something vague about how names latch onto their bearers, which may be why I keep worrying about whether a street named a century ago still refers to the engineer in any sense that matters — but I don't want the theory for its own sake, and I can't chase down readings. I want the procedure, its application to those three, an honest account of where the procedure will misfire and what it cannot settle, and at least one place where running it properly gives me an answer I will have to argue my colleagues into accepting.
reasoning: |-
  Okay, let me approach this methodically. The user needs a practical decision framework for monument evaluations that fits tight constraints - nine lay members, minimal research capacity, six-week deadlines. The current approach of debating "was this person bad" leads to deadlock. 

  Three key structural problems stand out: First, the committee conflates factual disputes with value judgments. Second, they lack clear thresholds for different outcomes beyond binary keep/remove. Third, they're not accounting for how their own process can reactivate forgotten meanings. The four distinctions raised (honoree vs deed, inertness, origin taint, slot scarcity) are crucial - these need operational definitions.

  For the framework, I'll adapt multi-stage legal analysis models. Start with verifiable facts (Phase 1), then assess contextual factors (Phase 2), finally apply municipal values (Phase 3). Each phase must have clear exit points: if Phase 1 disproves petition claims, retain; if Phase 2 shows irreparable harm, remove; ambiguous cases go to human judgment. 

  The disposition menu needs criteria beyond simple removal. For example: annotation suffices when the offense is isolated but the honor is specific; relocation works when historical value exists but public display is inappropriate. The "inert honorific" concept suggests a test: if awareness revived by petition exceeds baseline recognition, it indicates latent harm.

  Now testing against the cases: The industrialist statue fails Phase 1 - inscription praising "friend of workers" contradicts documented strikebreaking. But for the engineer street, Phase 2's harm calculation changes because the name was functionally dead - removal might do more harm by creating a controversy where none existed. The lynching site is hardest - here facts are clear but values conflict: naming conventions vs family wishes vs historical importance. This exposes where the procedure can't decide - when community reconciliation needs outweigh administrative rules.

  Biggest implementation challenge will be getting members to accept that some cases require subjective calls. The engineer street case will trigger resistance - data shows low awareness, but members may feel removing any problematic name is necessary. The procedure forces them to confront that removal could inadvertently memorialize. Need to emphasize that in ambiguous cases, the default is retention until proven harmful - this flips their current "assume bad until proven good" approach.
answer: |-
  Here is a durable decision procedure for your committee, designed for operational clarity within your constraints. It separates factual verification from value judgments, incorporates your four distinctions, and provides a structured path to multiple dispositions.

  ---

  ### **Monument & Toponym Evaluation Procedure (MTEP)**
  **Phase 1: Establish Baseline Facts**  
  *(Staff research: 2 weeks max. If facts are irreconcilably contested here, default to retention.)*  
  1.  **Honoree Identification:** Who is commemorated? Verify name, lifespan, primary societal role(s).  
  2.  **Object’s Specific Claim:** What deed/role/trait does the object *explicitly* honor? (e.g., "General," "Philanthropist," "Founder").  
  3.  **Origin Context:** Who erected/named it? When? Under what explicit conditions or motivations?  
  4.  **Alleged Harm:** What specific act, policy, or association (by honoree *or* originators) is the petition based on? Verify occurrence/direct involvement using credible primary/secondary sources.  
      *   *Sufficient Answer:* Documented evidence (news archives, council minutes, court records, peer-reviewed history).  
      *   *Insufficient:* Oral tradition, guilt by association without direct link, ideological opposition absent concrete harmful acts.  
  5.  **Current Public Meaning:**  
      - Is the name/object actively recognized as honoring someone (e.g., "school named for X")?  
      - Or is it functionally inert (e.g., "Oak Street" - no one associates it with surveyor John Oak)?  
      *(Staff method: Random street surveys (50 people), school plaque awareness polls, web analytics for named places).*

  **→ If Phase 1 disproves alleged harm OR proves complete current inertness → RETAIN AS IS.**  
  **→ If Phase 1 confirms harmful act(s) AND active honorific status → Proceed to Phase 2.**

  **Phase 2: Severity & Nexus Assessment**  
  *(Committee deliberation. If values conflict irreconcilably, proceed to Phase 3 for disposition with annotation.)*  
  6.  **Nexus Test:** Is the proven harm *directly connected* to the deed/role being honored?  
      - *Strong Nexus:* Honoree's harmful act *is* the honored deed (e.g., statue honoring a general for a campaign involving atrocities).  
      - *Weak Nexus:* Harm unrelated to the specific honor (e.g., philanthropist who committed unrelated fraud).  
      - *Origin Taint:* Harm stems from the installing group's ideology/conditions, not the honoree (e.g., KKK-erected statue of a benign pioneer).  
  7.  **Severity & Scale:** Was the harm severe (death, systemic oppression), targeted, and publicly significant?  
  8.  **Recontextualization Potential:** Could the harm be credibly addressed *in situ* without undermining civic values?  
      - *Adequate:* If annotation directly confronts the harm, its context, and the origin story.  
      - *Inadequate:* Vague "historical context," minimizing language, or placement obscuring the critique.

  **→ If Weak Nexus AND Severity Low → RETAIN WITH ANNOTATION.**  
  **→ If Strong Nexus OR Severity High → Proceed to Phase 3 for disposition (Removal/Relocation/Renaming).**  
  **→ If Origin Taint dominates → Proceed to Phase 3, weighting removal higher.**

  **Phase 3: Disposition & Public Good**  
  *(Committee vote required. Incorporates values/city identity explicitly.)*  
  9.  **Slot Scarcity Impact:** Does retention block a compelling alternative commemoration reflecting current values?  
  10. **Mitigating Actions:**  
      - *Removal:* Is harm ongoing/recently active? Will removal heal or inflame?  
      - *Relocation (Museum/Cemetery):* Does the object have significant artistic/historical value beyond commemoration?  
      - *Renaming/New Installation:* Does a suitable alternative exist with strong consensus? Does family/community oppose?  
      - *Counter-Commemoration:* Is there physical space and civic will for a genuine dialogue?  
  11. **Family/Community Wishes:** (Especially for victims). Do they want recognition, privacy, or removal? *Give significant weight.*  
  12. **Reactivation Risk:** For inert names: Will removal *create* a divisive symbol where none existed?  

  **→ Vote on Disposition Menu:**  
  - Retain as Is  
  - Retain with Annotation (Specify text/location requirements)  
  - Relocate to Museum/Educational Site/Cemetery  
  - Remove (Specify disposition: storage, destroy, return donor)  
  - Rename Only  
  - Rename & Install New Commemoration  
  - Install Counter-Commemoration (Retain existing)  
  - *Inert Name Only:* Revert to Geographic Name (e.g., "3rd Avenue N.")

  ---

  ### **Application to Current Cases**

  **Case 1: Industrialist Statue (1911)**  
  *   **Phase 1:** Honoree verified. Object claims: "Philanthropist & Friend of the Workingman." Harm: Violent strikebreaking (deaths) *by honoree* verified. Current meaning: Active honorific (prominent statue).  
  *   **Phase 2:** **Strong Nexus:** Harm (anti-worker violence) *directly contradicts* the inscribed claim ("Friend of the Workingman"). Severity High (deaths, systemic suppression).  
  *   **Phase 3:**  
      *   Annotation inadequate for direct lie. Removal/relocation justified.  
      *   Slot Scarcity: High - statue's prominence blocks alternatives.  
      *   Relocation feasible (industrial museum context).  
      *   **Recommendation: RELOCATE to City History Museum with new plaque contextualizing philanthropy *and* strikebreaking. Install counter-commemoration at original site honoring local labor organizers.**

  **Case 2: Engineer Street (1923)**  
  *   **Phase 1:** Honoree verified (engineer). Object claim: Honor sewer designer (implied). Harm: Role in restrictive covenants verified. **Current Meaning: INERT** (0% recognition in staff survey).  
  *   **Phase 2:** Harm confirmed (systemic racism), but **Weak Nexus:** Harm (covenants) unrelated to sewer design (the honor). Severity High, but current inertness is critical.  
  *   **Phase 3:**  
      *   **Reactivation Risk HIGH:** Removal makes unknown engineer a culture-war symbol.  
      *   Slot Scarcity Low: Street name isn't blocking alternatives.  
      *   Annotation impossible (no physical object).  
      *   **Recommendation: RETAIN AS IS.** *Rationale: Removal actively inflicts harm by creating a contested symbol from an inert label, outweighing the historical harm which is no longer propagated by the name itself. Document the history in the city archive.* **(This will be hard to sell - argue reactivation risk fiercely.)**

  **Case 3: Lynching Site (1919)**  
  *   **Phase 1:** Honoree: Victim (verified). Proposed Claims: Path name (honor victim) vs. Marker (acknowledge event). Harm: Lynching verified. Family wishes: **No new name.** Rule: Names require "distinguished citizenship."  
  *   **Phase 2:** Severity extreme. Nexus is the event itself.  
  *   **Phase 3:**  
      *   **Family Wishes PARAMOUNT:** Oppose naming. Rule also opposes naming.  
      *   Marker satisfies need for acknowledgment without violating rules or family wishes.  
      *   Slot Scarcity: N/A (new commemoration).  
      *   **Recommendation: INSTALL A MARKER ONLY.** Text must explicitly state: "Site of the 1919 lynching of [Victim's Name]" and contextualize racial terror. Collaborate with historical society and victim's family on text/design. *Do not name the path.*

  ---

  ### **Where Misfires Happen & Limits**

  1.  **Unverifiable Facts:** If Phase 1 research (6 weeks) can't confirm/refute alleged harm (e.g., obscure private actions), procedure defaults to retention. This protects against spurious claims but may leave genuine harm unaddressed.
  2.  **Values Impasses:** Phase 2 nexus/severity judgments involve values. If committee deadlocks 4-5 here, **default to RETAIN WITH ANNOTATION** as the least disruptive middle path.
  3.  **"Distinguished Citizenship" Rule:** The procedure can't override existing council rules (e.g., Case 3 naming). You must either amend the rule or work within it (hence marker, not naming).
  4.  **Family Opposition Trumps:** The procedure prioritizes victim/family wishes, even if it conflicts with community desires (Case 3). This is non-negotiable ethically.
  5.  **False Inertness:** If staff survey methodology fails and an "inert" name actually has unrecognized significance to a minority community, harm persists. Mitigation: Oversample diverse neighborhoods in surveys.

  ### **The Hard Sell: Case 2 (Engineer Street)**

  The procedure mandates **retention** for the inert street. Expect fierce opposition from members who believe *any* association with racism demands removal. Argue thus:

  *   **"Removal as Harm Amplification":** Before the petition, zero people associated the name with racism. Removal makes it a permanent symbol of conflict, *increasing* its toxic presence in civic life. Retention lets historical harm fade.
  *   **"The Cost of Symbolic Cleansing":** Removing every name linked to past sins is impossible and creates endless battles. Focus energy on active honors (Case 1) and new commemorations (Case 3).
  *   **"Document, Don't Elevate":** Archivally documenting the engineer's role in covenants is more historically honest than turning his obscure name into a flashpoint. Publish it online, don't fight over asphalt.

  This procedure replaces "Was he bad?" with structured questions about verifiable harm, current meaning, practical impact, and civic reconciliation. It forces clarity on *why* and *how* an object harms *today*, preventing historical outrage from automatically dictating present action. Use the Phase structure to discipline meetings: Facts first (Phase 1), then interpretation (Phase 2), then values/action (Phase 3). Good luck.
