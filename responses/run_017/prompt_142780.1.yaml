prompt: |-
  Hi — I'm on the allocations commitee of a small foundation. About $40m a year, four staff, monthly meetings, and we have to publish a one-paragraph public rationale for every grant we make.

  We keep receiving what philosophers call Pascal's mugging: someone emails saying that unless we wire $5,000 to an account, they'll use their powers to cause some astronomically large amount of suffering, and when we ask how likely that is they just name a bigger number. We obviously say no, but we've never been able to say *why* in a way that doesn't also kill grants we actually want to make. Last month someone pointed out that if we're being consistent we either pay the mugger or we stop funding our pandemic-prevention portfolio, which has maybe a 1-in-10,000 shot at mattering at a civilisational scale. We also have a live $250k application from a group studying whether a certain industrial process could in principle set off a runaway atmospheric effect — real physics, genuinely speculative, maybe 1-in-a-million, catastrophic if real — and nobody can say whether that one is a mugging or not.

  So we want one written rule. It has to be usable by a programme officer with no decision-theory background in about twenty minutes, it has to output a number or a yes/no (no "it depends"), and it has to survive being published, because donors read these things.

  Here are nine candidate screens I've drafted, in my own words:

  1. Value ceiling — any payoff above a billion units of value just counts as a billion.
  2. Satisficing ceiling — once an option's upside clears a ceiling, we stop counting anything past it and rank options by what's under the ceiling.
  3. Probability floor — probabilities below one in a billion round to zero.
  4. Escalation screen — if the claimant can always name a bigger number in response to whatever probability we assign, the claim gets zero weight regardless of its content.
  5. Mechanism requirement — we need a causal chain from our action to the outcome where every link has a probability we could defend to a sceptical colleague; one unspecifiable link and the whole thing is zero.
  6. Track record — we only accept a probability if whoever produced it has a demonstrated calibration record at that order of magnitude; otherwise we throw their number out and substitute a base rate from a reference class of similar-sounding claims.
  7. Median not mean — rank options by the median of the outcome distribution under our posterior instead of the average.
  8. Robustness to our own disagreement — take whatever does best under the worst of the priors actually held around the table.
  9. Information only — never fund on expected-value grounds at all; fund only to reduce uncertainty, and price that separately.

  What I want back:

  - Score each screen 0–10 on two things *separately*: (a) does it actually stop the mugger — including the version where he emails every month with a bigger number, the version where he offers to pay *us* an astronomical sum, and the version where the harm happens somewhere we could never verify; and (b) does it leave the real portfolio intact — and for each screen, name the one existing grant it would wrongly kill.
  - I suspect two or three of these are the same rule wearing different clothes. Say which, and whether collapsing them loses anything that matters.
  - A tier list: adopt as written / adopt with one patch you specify / drop. One sentence per screen, no essays.
  - Under whichever screen you'd adopt, what fraction of the annual budget should we hold in reserve for mugger-shaped claims? Give me a number between 0 and 1, and say why it isn't 0 and why it isn't "as much as the biggest number implies."
  - Where is the real work actually happening — in the decision rule, or in whatever tells us where the probabilities came from? One paragraph. If it's the second, say what the written rule should say about that instead.

  Please don't rank them by how much decision theorists happen to like them. Rank them by whether a tired programme officer can apply them correctly at 4pm on a Friday, and by whether the sentence we publish makes us look like we know what we're doing.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of a small foundation dealing with grant allocations and are constantly getting Pascal's mugging attempts. They need a rule that's simple for program officers to apply quickly, stops these muggings, but doesn't reject legitimate high-risk, high-reward grants like pandemic prevention or atmospheric studies.

  First, I need to break down the nine screens they proposed. Each one has to be evaluated on two main points: effectiveness against the mugger and impact on their real portfolio. The user also wants to know if any screens are redundant and a tier list for adoption. Plus, they need a reserve budget recommendation and where the real work happens.

  Looking at the screens, some seem similar. For example, value ceiling and satisficing ceiling both cap the upside but in different ways. Probability floor sets a minimum threshold. Escalation screen targets the mugger's tactic of escalating claims. Mechanism and track record focus on evidence. Median vs mean shifts the evaluation metric. Robustness considers internal disagreement. Information-only avoids expected value altogether.

  The key challenges are:
  1. Stopping the mugger in all variants (escalating, payment, unverifiable).
  2. Protecting legitimate grants like pandemic prevention (1/10,000) and atmospheric study (1/1,000,000).
  3. Ensuring the rule is simple for non-experts and defensible publicly.

  Effectiveness against muggings: Mechanisms and track record are strong because they require evidence. Escalation screen directly addresses the mugger's method. Value ceilings and probability floors can be gamed if the mugger adjusts numbers. Median and robustness might not stop muggings as they don't address the root issue of baseless claims.

  Portfolio impact: Ceilings and floors might kill legitimate grants by capping their value or rounding probabilities to zero. Mechanism and track record could allow legitimate grants if they have plausible causal chains or calibrated estimates. Information-only shifts focus but might not fit all grants.

  Redundancy: Value ceiling and satisficing ceiling are similar; collapsing them makes sense. Probability floor and mechanism might overlap but mechanism is stricter. Track record and mechanism both deal with evidence but differ in approach.

  Tier list: Adopt Mechanism Requirement with a patch for base rates. Escalation screen is a close second. Drop median and robustness as they don't solve the core problem. Information-only is too restrictive.

  Reserve budget: 0.0001% (around $40) because it accounts for tiny probabilities without being exploited. It's not zero because there might be legitimate claims with evidence, but not a significant portion due to the screening.

  Real work: It's in the evidence gathering. The rule should require a documented causal chain with defensible probabilities at each step, sourced from calibrated estimators or base rates. Program officers need clear guidelines on evaluating evidence quality.

  Public rationale: Transparency about requiring credible mechanisms and evidence would make the foundation look competent. Explaining that claims without plausible causal steps are dismissed aligns with common sense and avoids controversy.
answer: |-
  Below is a concise evaluation of your nine screens against your criteria, followed by recommendations. Scores are split for (a) **Stopping Pascal's Mugging** (0–10) and (b) **Preserving Real Portfolio** (0–10), with one existing grant each screen might wrongly kill.

  ---

  ### **Scores & Key Flaws**
  1. **Value Ceiling**  
     (a) 6/10 (mugger escalates past ceiling; fails if harm is unverifiable)  
     (b) 3/10 (kills atmospheric study grant: civilisational upside capped at 1B units)  
     *Kills: Atmospheric runaway grant (catastrophic upside exceeds ceiling)*

  2. **Satisficing Ceiling**  
     (a) 5/10 (similar to #1; mugger names >1B harm)  
     (b) 7/10 (preserves pandemic/atmospheric grants if they clear ceiling)  
     *Kills: Same as #1 if ceiling is too low*  
     *Redundancy: Near-identical to #1. Collapsing loses nothing.*

  3. **Probability Floor**  
     (a) 8/10 (dismisses 1-in-a-zillion claims)  
     (b) 2/10 (kills atmospheric study: 1e-6 < 1e-9 floor)  
     *Kills: Atmospheric runaway grant (prob. rounded to zero)*

  4. **Escalation Screen**  
     (a) 10/10 (stops all mugger variants: escalation = automatic disqualification)  
     (b) 9/10 (preserves real grants; they don’t escalate demands)  
     *Kills: None inherently, but might misflag novel credible claims if poorly applied.*

  5. **Mechanism Requirement**  
     (a) 9/10 (mugger can’t specify causal links; unverifiable harm fails)  
     (b) 8/10 (pandemic/atmospheric grants have physics-based mechanisms)  
     *Kills: Non-mechanistic grants (e.g., speculative econ models)*

  6. **Track Record**  
     (a) 9/10 (mugger lacks calibration; substitutes low base rate)  
     (b) 7/10 (atmospheric study may lack track record; relies on base rates)  
     *Kills: Legitimate first-time researchers with novel models.*

  7. **Median not Mean**  
     (a) 4/10 (mugger’s median outcome is unchanged; fails escalation)  
     (b) 6/10 (preserves grants with symmetric uncertainty)  
     *Kills: High-risk/high-reward grants with skewed positive tails.*

  8. **Robustness to Disagreement**  
     (a) 3/10 (mugger might convince one skeptic; fails escalation)  
     (b) 5/10 (kills any grant with even one table opponent)  
     *Kills: Contentious but valuable grants (e.g., AI alignment)*

  9. **Information Only**  
     (a) 10/10 (never funds muggings; only buys knowledge)  
     (b) 0/10 (kills core portfolio: pandemic prevention isn’t pure research)  
     *Kills: All expected-value-driven grants (e.g., vaccine deployment).*

  ---

  ### **Tier List & Patching**
  - **Adopt as Written**  
    **#4 Escalation Screen** (Simple, robust, publishable: "Claims that escalate demands when questioned are dismissed.")  
    **#5 Mechanism Requirement** (Patch: Require base rates if track record is absent, but mechanism exists.)  

  - **Adopt with One Patch**  
    **#6 Track Record** (Patch: Use institution/base-rate calibration if individual calibration is lacking.)  

  - **Drop**  
    #1, #2 (redundant/ceiling issues), #3 (kills good grants), #7 (ineffective), #8 (kills consensus), #9 (overly restrictive).  

  ---

  ### **Reserve Budget for Mugger-Shaped Claims**
  **Fraction: 0.0001% ($40/year)**  
  - **Why not 0?** A vanishingly small reserve acknowledges non-escalating, evidence-backed claims (e.g., a credible but ultra-uncertain asteroid deflection).  
  - **Why not more?** Escalation/mechanism screens filter 99.99% of muggings; real claims with defensible mechanisms (like your atmospheric study) come from known entities, not cold emails.  

  ---

  ### **Where the Real Work Happens**  
  The work is **in probability/evidence assessment**, not the decision rule. A program officer can’t evaluate "1-in-a-million" without context. The rule should mandate:  
  > *"Probabilities must be derived from a documented causal mechanism, with each step’s likelihood defensible using calibrated models or base rates. Unspecifiable steps reduce the entire claim’s probability to zero."*  
  This forces muggers to confront their lack of evidence while allowing legitimate science (e.g., atmospheric physics) to demonstrate plausible causal chains. Pair with #4 to auto-dismiss escalators.

  ---

  ### **Final Recommendation**  
  **Adopt #4 (Escalation Screen) + #5 (Patched Mechanism Requirement).**  
  - **#4** stops all mugger variants instantly.  
  - **#5** ensures real grants survive via causal transparency.  
  - **Publishable rationale**: "We fund claims with clear, defensible causal pathways to outcomes. Proposals altering demands when challenged are ineligible."  
  - **Program officer ease**: <10 minutes. Check: (1) Did claimant escalate when probed? (2) Can they outline causal steps with reference-class probabilities? If no to both, reject.
