prompt: |-
  Question for anyone who works on this stuff — please answer in British English, it's going into a seminar handout.

  I teach a grad seminar on naturalizing mental content, and I keep hitting the same frustration in the readings and in seminar, and I want a word for it. I'm going to describe it without the jargon on purpose: every time I use the jargon someone says "oh, that's just the disjunction problem" or "that's the generality problem again", the conversation stops, and I don't think either of those is quite what I've got.

  Here's the pattern. Take a fairly simple signalling system — a vervet alarm call, or whatever state of a frog's visual system triggers the tongue flick. To say what that state is *about* you apparently need two things: a story about what the mechanism was built or selected to do, and a story about what the creature is currently using it to track. What I keep noticing is that these two stories get adjusted to fit each other, and adjusted until the answer comes out as "leopard" or "fly" — i.e. until it matches what we were going to say anyway. Press on the history story ("why not: selected for tracking leopard-shaped things, or aerial hazards?") and the answer comes back in terms of what the downstream system needs. Press on the downstream story ("why not: it causes climbing behaviour, so why isn't the content *climb now*?") and the answer comes back in terms of the history. Neither story seems to do independant work; each is calibrated against the other, and both are calibrated against the content we antecedently wanted. The machinery looks like it's deriving a content when it's really being tuned until it outputs one.

  Two more places I see it, which is why I think it's one thing and not two:

  (a) Co-opted mechanisms — a trait that was shaped for one job and is now used for another. Here the history story and the current-use story genuinely come apart, and people either go quiet or quietly pick whichever one gives the intuitive answer for the case in front of them.

  (b) The grain question — "leopard" vs "predator" vs "danger from above" vs "get into a tree". Nothing in the naturalistic machinery seems to fix the grain; what fixes it is what makes the creature's behaviour come out successful in the cases we've already picked as the paradigm ones.

  So: does this have a name? I've got "the calibration loop" in my notes, which I'm sure its not. But I want more than a label anyway — I've had enough of labels ending discussions. Specifically:

  1. What are the nearest established things, and how does mine differ from each? I keep being told the disjunction problem and the generality problem; I want to know exactly why mine isn't just one of them, or if it is, which one and in what respect.
  2. Is this best thought of as a circularity objection, an indeterminacy objection, an underdetermination objection, or something else? Those feel like different objections with different cures, and I'm not sure which one I actually have.
  3. Is it fatal, or just a constraint on how a theory of this kind has to be stated? I have a suspicion the answer turns on whether the machinery was supposed to *generate* content ascriptions from scratch as opposed to systematising ones we already make, but I can't say why.
  4. What would the boundary cases look like: a case where the mutual adjustment is legitimate (the two stories genuinely converge for reasons that don't presuppose the answer) versus a case where it's just curve-fitting? If I can't tell those apart I don't have an objection at all, and I'd rather know that than go on waving my hands.

  If there's genuinely no established term, coin one, define it, give me the boundary cases, and tell me what I'd have to find to convince myself it had been noticed before. And please write it in British English, and go light on the bibliography — I can find the reading myself, I just want the carving.
reasoning: |-
  Okay, let me approach this step by step. The user teaches a graduate seminar on naturalizing mental content and has encountered a recurring frustration that doesn't neatly fit into existing categories like the disjunction problem or generality problem. 

  The core issue seems to be about how we determine what a simple signaling system (like a vervet alarm call) represents. There are two factors at play here: what the mechanism was evolutionarily selected for, and what the creature currently uses it to track. But in practice, these two stories appear to get adjusted until they produce the intuitive content ("leopard" or "fly"), rather than independently determining the content. 

  I need to consider how this differs from established problems. The disjunction problem deals with how to rule out false positives (e.g., "fly or bee-bee"), while the generality problem concerns how specific the content should be (e.g., "leopard" vs "predator"). The user's issue seems distinct - it's about the circular interdependence between the historical and current-use accounts.

  For the co-opted mechanisms example, this interdependence becomes especially clear when history and current use conflict, and theorists default to whichever supports their preferred content. The grain question further shows how content seems predetermined rather than derived.

  I should think about whether this is primarily circularity, indeterminacy, or underdetermination. It appears to be circularity because the two factors calibrate each other against predetermined content, but also shows underdetermination since multiple content ascriptions could fit.

  On whether it's fatal: it might not be if we acknowledge that naturalistic theories systematize rather than generate content. But if the goal is complete independence from intuition, it could be problematic. 

  For boundary cases: legitimate convergence would be when history and current use independently point to the same content (e.g., vervet calls consistently linked to leopards in both domains). Illegitimate curve-fitting would involve ad-hoc adjustments to force agreement (e.g., reinterpreting frog vision history to match current fly-catching).

  I'll propose "the calibration objection" as a new term, emphasizing how historical and systemic factors get mutually adjusted to match pre-theoretic intuitions. This captures the dynamic, iterative process the user describes better than existing labels.
answer: |-
  Right, this is a sharp observation that cuts to the heart of many naturalisation projects. It's not *quite* the disjunction or generality problem as standardly conceived, though deeply related. Let's carve this up in British English as requested.

  **Your Core Observation: The Mutual Calibration Problem**

  You've identified a distinct issue we can call **the Mutual Calibration Problem (MCP)**. Its essence is this:

  > The purported naturalistic determinants of content (e.g., selection history and current systemic role) are not independently fixed anchors. Instead, they are mutually adjusted *post hoc* to converge on the pre-theoretic, intuitive content ascription ("leopard", "fly"). The machinery appears to *discover* content, but functions more like a *tuning device* for our antecedent intuitions, lacking independent constraint.

  **1. Relationship to Established Problems & How MCP Differs**

  *   **The Disjunction Problem (Fodor):** Focuses on how to rule out disjunctive content for false positives (e.g., is the frog's state about *flies* or *flies-or-BB-pellets*?). It assumes *some* causal/historical connection is content-determining and asks how to privilege the "right" one.
      *   **How MCP Differs:** MCP targets the prior step. It asks *why* we privilege "leopard" over "leopard-shaped-thing" *in our accounts of both history and current role* in the *first place*, before disjunction even arises. The disjunction problem arises *within* a framework (e.g., causal) that MCP suggests is already being gerrymandered to fit intuition. MCP is about the *inputs* to theories like Fodor's; disjunction is about an internal problem *within* those theories once inputs are fixed (or assumed).
  *   **The Generality Problem (Plantinga/others, often re: reliability):** Concerns how finely or coarsely to individuate the *type* of state or process for content ascription (e.g., is the belief "that leopard" caused by *this specific leopard*, *leopards generally*, *predators*, *moving shapes*?).
      *   **How MCP Differs:** Generality assumes we know *what property* the state is tracking/corresponding to and asks about the scope. MCP challenges how we determine *which property* that is *at all*, arguing the choice of property (leopardness vs. predatorness vs. leopard-shape) for *both* history and current role is tuned to fit the intuitive label. Generality is a problem of *specification*; MCP is a problem of *selection*.
  *   **The Input/Output Problem (sometimes linked to functional role semantics):** How to fix content purely by inputs (stimuli) or outputs (behaviour).
      *   **How MCP Relates/Differs:** MCP manifests *because* purely input-based theories (like simple causal/covariation) run into disjunction/generality, and purely output-based theories (like crude behaviourism) seem too coarse ("climb now!"). The "solution" of combining history (input selection) and systemic role (input-output mediation) *creates* the mutual calibration space MCP exploits. MCP shows how this combination can be vacuous without independent constraints.

  **2. Best Categorisation: Circularity with Underdetermination**

  *   **Circularity Objection:** Primarily. The proposed naturalistic criteria (selection history, current systemic role) are not genuinely independent. The justification for interpreting the selection history relies on assumptions about the current systemic role (what the "proper function" *is* for the system *now*, which presupposes what it represents *now*), and vice-versa (why *this* systemic role is privileged relies on what it was *selected for*). The circle is closed by calibrating both against the pre-theoretic content ascription.
  *   **Underdetermination Objection:** Secondarily. For any intuitive content ascription ("leopard"), multiple plausible-seeming (but mutually calibrated) historical and systemic-role descriptions exist ("selected for leopards", "selected for large predators", "selected for leopard-shaped moving patches"; "causes leopard-avoidance", "causes predator-avoidance", "causes tree-climbing"). The naturalistic machinery underdetermines the specific content without the intuitive target guiding the calibration.
  *   **Why Not Pure Indeterminacy?** Pure indeterminacy (like Quinean inscrutability) suggests *no fact of the matter*. MCP suggests there *is* a fact (we converge on "leopard"), but the *naturalistic machinery alone* isn't genuinely determining it; our intuition is driving the calibration. It's a problem of *epistemic access* and *methodological circularity* within the naturalisation project, not necessarily metaphysical indeterminacy.

  **3. Is it Fatal? It Depends on the Project's Ambitions**

  *   **Fatal for Strong Naturalisation?** Potentially yes, if the goal is a theory that *grounds* or *constitutes* content in purely non-semantic, non-intentional, non-normative natural facts *without any presupposition* of representational content. MCP suggests the "derivation" is illusory; the presupposed content is doing the heavy lifting. The tuning presupposes the very thing it's meant to output.
  *   **A Constraint for Moderate Naturalisation?** Likely no, or less so, if the goal is to *systematise*, *vindicate*, or *explicate* our intuitive content ascriptions within the natural world. Here, the naturalistic machinery isn't generating content *de novo* but showing how our intuitive ascriptions map onto complex natural processes (history + systemic role). MCP highlights the *explanatory burden*: the theory must show *why* the calibration converges reliably on specific contents across different systems and contexts, rather than being arbitrary. It needs to explain the *robustness* of the convergence.
  *   **Your Suspicion is Correct:** The severity hinges entirely on whether the project aims to *generate* content (where MCP is devastating) or *systematise* it (where MCP is a challenge to be met by showing the calibration isn't *mere* curve-fitting but reflects robust natural constraints).

  **4. Boundary Cases: Legitimate Convergence vs. Curve-Fitting**

  *   **Legitimate Convergence (Robust Calibration):** A case where the selection history and current systemic role *independently constrain* each other to a *narrow range* of content ascriptions, converging on a single one for *robust natural reasons*, not just because it matches intuition.
      *   **Example:** Vervet alarm calls. Robust ethological data shows *distinct calls* trigger *distinct, highly specific avoidance behaviours* (leopard call → run to thin branches; eagle call → look up/run under bush; snake call → stand bipedally/look down). Phylogenetic studies show these calls/behaviours co-evolved with *specific predator types* over long periods. Crucially, the *fidelity* and *specificity* of the mapping between call type, behavioural response, *and* predator type are observable independently. Attempts to widen the grain ("danger!") or shift content ("climb now!") fail because they don't capture the *systematic, differentiated* nature of the signalling and response *across multiple contexts*. History and current role genuinely lock each other down.
  *   **Illegitimate Curve-Fitting (Ad Hoc Calibration):** A case where selection history and current role are interpreted loosely, and adjustments are made primarily to preserve an intuitive content that isn't robustly constrained by either factor alone.
      *   **Example:** Frog vision/flicking. **History:** Was selection *for* "flies", "small moving dark dots", "nutritious airborne objects"? The fossil/neural evidence is scant. **Current Role:** Does the state *represent* "fly", "food", "flickable object", "move tongue now"? The downstream system might just trigger a ballistic tongue-flick to *any* small moving dot. Pressed on history, proponents say "Well, it *was* flies driving selection, look at the diet". Pressed on current role, they say "It's clearly part of the fly-catching system, see the behaviour". But neither story independently *forces* "fly" over "small moving dot". If the frog consistently flicked at raindrops or dust motes exhibiting the same motion, the "fly" ascription would likely shift to "small moving dot" *without* a fundamental change in the historical or systemic story – revealing the calibration. The intuitive content ("fly") is privileged without sufficient independent constraint.
  *   **Co-option Test Case (Your 'a'):** A mechanism originally selected for detecting shadows (predator avoidance) is now used for detecting ripe fruit (foraging). **Legitimate?** If the *current systemic role* demonstrably integrates the state into a *new, distinct* functional system (foraging circuit) with its own inputs/outputs, *and* the historical story is clear, then "ripe fruit" might be justified *despite* history. The current role *independently* fixes the content in the new context. **Illegitimate?** If the current use is ambiguous (e.g., the state still sometimes triggers startle responses *and* sometimes guides foraging, depending on context), and theorists pick "ripe fruit" *only* when discussing foraging success, conveniently ignoring the history, or pick "shadow" when a false alarm occurs, ignoring the new use – that's curve-fitting.

  **In Summary:**

  *   **Term:** The **Mutual Calibration Problem (MCP)**.
  *   **Definition:** The methodological issue in naturalising content where appeals to selection history and current systemic role are mutually adjusted, lacking independent constraints, resulting in their calibration primarily serving to output pre-theoretic intuitive content ascriptions rather than genuinely determining them from non-semantic facts.
  *   **Status:** A significant circularity/underdetermination challenge, potentially fatal for strong generative naturalisation projects, but a constraint requiring robustness explanations for systematising projects.
  *   **Boundary:** Legitimate convergence requires history and current role to *independently and robustly constrain* each other to a narrow content range (e.g., vervets). Curve-fitting occurs when interpretations of history/role are ad hoc to preserve intuition without such independent constraints (e.g., ambiguous frog/fruit cases).

  **To Find Precedents:** Look for critiques focusing on the *interplay* or *lack of independence* between historical (etiological) and systemic (functional/causal role) factors in teleosemantics or indicator semantics. Dretske's later work grappling with "Hard Problems", some critiques of Millikan by philosophers like Sterelny focusing on indeterminacy *despite* teleology, and discussions surrounding "derived" vs. "original" intentionality often touch on related tensions, though rarely framing it precisely as this *mutual calibration*. Your co-option point is a particularly strong lever to expose it. It's less a single labelled argument and more a recurring critical *observation* about the practice of naturalisation. You've articulated it well. Good luck with the seminar!
