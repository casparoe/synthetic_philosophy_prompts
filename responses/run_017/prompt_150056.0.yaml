prompt: |-
  I'm a senior counsellor at an outpatient addiction clinic and I chair the weekly conference where we decide what to do about what clients tell us about their own use — "I can stop whenever I want", "the test must be wrong", "I only drink when things are bad and things are fine now". About a dozen a week, ten or fifteen minutes each, junior staff with no philosophy background have to be able to run it, and anything that changes a treatment plan gets signed off by the clinical lead. So I want a decision procedure, not an essay on denial.

  The problem is we use "in denial" for about six different states and it matters which one it is: the client knows and is lying to us; the client knows and simply can't act on it (ordinary weakness of will, nothing wrong with their beliefs); the client has arranged not to find out — skipping the blood draw, getting their partner to pick up the results and not tell them; the client genuinely never had the information; and the client is filling a gap (blackouts, fuzzy memory) with a story that isn't especially motivated by anything. I want steps that separate those and say what follows: when we push, when we drop it and move on, when we go and get more evidence, and when we stop and hand it to the lead because what's left is a values call about how hard to lean on someone.

  Two constraints from what I've read about self-deception, which I want baked in rather than footnoted: it doesn't have to be something the person decided at some point, so no hunting for the moment they chose to fool themselves — look at what's sustaining the not-knowing right now; and once we've decided we can't take someone's word about their own state, we can't turn around and use their word as evidence about it. There's also a case I don't know what to do with: two of our groups have converged on a shared line ("none of us really has a problem, the clinic exaggerates") that nobody seems to hold on their own. Treat that as a case the procedure has to handle, not a footnote.

  Give me the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it stops because the question is values and not facts. Then run it on two real cases: (1) a client with a positive screen who insists the lab mixed up the samples and has now asked his brother, who he lives with, to pick up his results so he never has to open the portal; (2) a client who says "I can stop any time, I've done it before" — and has in fact stopped for three months twice, whose use is down a lot but not zero, and who the junior staff all want to call denial. That second one, please give me the answer I won't like even if it means we drop the denial framing. And tell me straight what the procedure can't do.

  No preamble: lead with your bottom line in the first sentence, then the reasoning.
reasoning: |-
  Okay, the user is a senior counselor at an addiction clinic who needs a practical decision procedure for identifying different types of denial in clients. They're frustrated with vague terminology and want clear, actionable steps for junior staff without philosophy backgrounds. The key requirements are: distinguishing between lying, weakness of will, avoidance, ignorance, and memory gaps; incorporating constraints about self-deception not requiring conscious choice; and handling groupthink cases. 

  The user's tone is no-nonsense - they explicitly reject theoretical essays and demand concrete steps. Underneath this urgency, I sense two unspoken needs: protecting junior staff from making judgment calls beyond their expertise, and preventing harm from mislabeling clients (e.g., pushing someone in avoidance when they need gentle evidence-gathering). The groupthink example suggests they've encountered cult-like dynamics where peer pressure overrides individual insight.

  For the decision tree, I'll use binary branching based on observable behaviors rather than internal states. The first fork must be verifiable without relying on client self-report ("did they block information access?"), honoring their constraint about not using untrustworthy self-reports as evidence. Each endpoint will specify actions: when to escalate to the clinical lead (values calls), when to gather data (avoidance), or when to disengage (weakness of will).

  Testing it against their cases: For the first client (lab mix-up claim + brother intercepting results), the path clearly flags active avoidance - procedure mandates getting the brother's consent for disclosure. For the second ("I can quit anytime" with partial reduction history), the outcome might frustrate staff as it rules out denial entirely, reclassifying it as akrasia (weakness of will). That's intentional - the user asked for uncomfortable truths. 

  The procedure's limitations: It can't resolve cases where all evidence is self-reported (e.g., a client claiming blackouts with no witnesses), and can't override clinical judgment when safety risks trump the algorithm. I'll emphasize these at the end so junior staff don't treat it as infallible.
answer: |-
  **Bottom line:** Use this 5-step decision procedure to classify denial types and determine next actions, focusing on observable behaviors and evidence constraints.

  ---

  ### **Denial Assessment Procedure**
  1. **Is there verifiable evidence contradicting the client's statement?**  
     *Good enough answer:* Objective data exists (e.g., lab results, collateral report, documented incident).  
     → **No:** Stop. Not denial; treat as self-report.  
     → **Yes:** Proceed to Q2.

  2. **Did the client actively block access to this evidence?**  
     *Check for:* Skipping tests, directing others to hide results, avoiding portals.  
     → **Yes:** → **Active Avoidance.**  
       - *Action:* Gather evidence externally (e.g., contact brother for consent to share results). Do not challenge until evidence is in hand.  
     → **No:** Proceed to Q3.

  3. **Could the client reasonably know about the contradiction?**  
     *Assess:* Access to information, cognitive capacity, disclosure history.  
     → **No:** → **Genuine Ignorance.**  
       - *Action:* Educate + verify receipt (e.g., "Read this lab report with me now").  
     → **Yes:** Proceed to Q4.

  4. **Is there evidence of memory gaps (e.g., blackouts) or confusion?**  
     *Check:* History of blackouts, cognitive disorders, intoxication during events.  
     → **Yes:** → **Memory Gap Fill-In.**  
       - *Action:* Corroborate timeline/witnesses; focus on symptom management.  
     → **No:** Proceed to Q5.

  5. **Does the client acknowledge the contradiction when confronted with evidence?**  
     *Present evidence neutrally:* "Your urine screen was positive, but you said you were sober. Help me understand."  
     → **Acknowledges but justifies/deflects:** → **Weakness of Will (Akrasia).**  
       - *Action:* Drop "denial" framing. Target behavioral strategies (e.g., craving management).  
     → **Denies evidence validity (e.g., "Lab error!"):** → **Escalate to Clinical Lead.**  
       - *Reason:* Values call on how hard to push vs. risk therapeutic rupture.

  ---

  ### **Special Case: Group-Derived "Shared Line"**
  - **Trigger:** Multiple clients use identical phrasing denying severity.  
  - **Action:**  
    1. Isolate each client individually; ask for *personal* examples (not group rhetoric).  
    2. If all revert to group narrative → **Escalate to Clinical Lead.**  
     - *Reason:* Coercive dynamics require systemic intervention (e.g., group restructuring).

  ---

  ### **Case Applications**
  **Case 1: "Lab mixed up samples" + brother intercepting results**  
  - Q1: **Yes** (positive screen).  
  - Q2: **Yes** (brother blocking access) → **Active Avoidance.**  
    - *Action:* Contact brother (with consent) for results; no confrontation until obtained.  

  **Case 2: "I can stop anytime" + partial reduction history**  
  - Q1: **No.** Reduction in use ≠ contradiction; "can stop" is unfalsifiable prediction.  
  - *Outcome:* **Stop at Q1.** Not denial. *Staff won’t like this:* Framing as "weakness of will" (akrasia) is more accurate.  
    - *Action:* Drop denial label. Target: "What makes *now* harder to stop than past attempts?"  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Resolve values-based conflicts** (e.g., "How hard should we push?"). These always escalate to the clinical lead.  
  2. **Prove lying.** Intentional deception is inferred only when all other categories are ruled out (rare; requires escalation).  
  3. **Handle purely self-reported data.** If all evidence hinges on client words (e.g., "I blacked out"), the procedure stops at Q1.  
  4. **Override safety risks.** If harm is suspected, skip procedure and follow crisis protocols.  

  ---  
  **Designed for:** Speed (10-15 min/case), no philosophy required, auditable decisions. Revise if new denial patterns emerge.
