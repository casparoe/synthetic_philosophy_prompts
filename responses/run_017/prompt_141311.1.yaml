prompt: |-
  I'm a graduate student in a philosophy of biology seminar, and before we get to the section on functions I want to fix what we should be asking of an account rather than grading the readings one at a time. Write me the specification: what any adequate theory of biological function has to deliver — which distinctions it must respect (a trait's function versus its merely useful side effects, having a function versus performing it, the function of a token versus of a type, function versus the effect a trait happens to produce now), which cases it has to get right, and which results from biology or medicine it can't be inconsistent with — each paired with the case or consideration that makes it a requirement rather than a preference of one camp. The four cases I most want handled are the very first proto-heart, which pumped before any selection history stood behind it; a protein designed from scratch in a lab and wired into a synthetic cell, where it does work no lineage has ever been selected for; a muscle flap moved by a surgeon to a new site where it now performs a task it never performed before; and a failing heart that still has a function it can no longer carry out. Then mark which requirements you take to be non-negotiable and which are demands a camp smuggles in because its own theory happens to meet them, including any that are really inherited from wanting functions to do work elsewhere — in artifacts, in the philosophy of mind, in medicine — rather than from biology; flag any pair of requirements you suspect can't be jointly satisfied, since that tension is the part I most want to see. Close by scoring the selected-effect (etiological) account and the causal-role (systemic, dispositional) account in two or three sentences each, and name the single requirement that eliminates the most otherwise-plausible theories.
reasoning: |-
  Okay, the user is a graduate student in a philosophy of biology seminar preparing for a section on functions. They want a clear specification for evaluating theories of biological function, not just grading readings. The key is to outline what any adequate theory must deliver: necessary distinctions, cases to handle, and consistency with biology/medicine. 

  First, I need to unpack their core request. They want a rigorous framework to assess function theories, moving beyond partisan debates. The four highlighted cases (proto-heart, synthetic protein, repurposed muscle flap, failing heart) are stress tests—each exposes weaknesses in existing theories. 

  I notice they’re hinting at deeper tensions: Can a theory cover both evolutionary novelty and selected traits? Can it handle malfunction without smuggling in norms? They also want warnings about "smuggled" requirements (e.g., from artifact philosophy) that might bias evaluations. 

  Structurally, I’ll organize around three pillars: distinctions, cases, and consistency constraints. The four cases are non-negotiable benchmarks—any theory that fails them is inadequate. But I’ll flag where requirements might conflict, like honoring selection history while accommodating function without history (proto-heart/synthetic protein). 

  For the scoring part, I’ll bluntly summarize how etiological and causal-role theories fare. The etiological account flunks the first two cases but aces malfunction; the causal-role account does the inverse. The killer requirement? "Function without selection history"—it sinks most theories that over-rely on evolution. 

  The user’s unspoken goal is likely to preempt seminar deadlocks by establishing neutral ground upfront. I’ll emphasize that while some demands (like mind/artifact compatibility) are negotiable, the core biological cases aren’t. The tension between novelty and normativity is the real battleground.
answer: |-
  Here’s a specification for an adequate theory of biological function, designed as a neutral framework for evaluating competing accounts in your seminar. Requirements are paired with their justifications, and tensions are flagged.

  ---

  ### **I. Essential Distinctions Any Theory Must Respect**
  *(Non-negotiable for biological adequacy)*

  1. **Function vs. Merely Useful Effect**  
     *Requirement:* Distinguish what a trait is *supposed* to do (function) from beneficial side effects.  
     *Case:* The heart’s function is pumping blood, not producing heart sounds (a useful diagnostic side effect).  
     *Why non-negotiable:* Without this, everything a trait does becomes "function," collapsing biological explanation.

  2. **Having a Function vs. Performing It**  
     *Requirement:* A trait can possess a function even when unable to perform it (e.g., broken or blocked).  
     *Case:* A failing heart still *has* the function of pumping blood, even if it can’t.  
     *Why non-negotiable:* Essential for concepts like malfunction, disease, and engineering interventions.

  3. **Token Function vs. Type Function**  
     *Requirement:* Explain why a *token* trait (e.g., your appendix) can lose its function while the *type* (appendix in humans) retains/ascribes one.  
     *Case:* A vestigial appendix in an individual vs. the historical function of the appendix type.  
     *Why non-negotiable:* Biology requires generalizations over traits while accounting for individual variation.

  4. **Function vs. Accidental Current Effect**  
     *Requirement:* Separate a trait’s stable function from transient or context-dependent effects.  
     *Case:* A tumor accidentally secreting beneficial hormones isn’t its function.  
     *Why non-negotiable:* Prevents functional ascription from being arbitrary or ephemeral.

  ---

  ### **II. Core Cases Any Theory Must Handle**
  *(Non-negotiable stress tests)*

  1. **The Proto-Heart**  
     *Case:* The first pulsating vessel in an ancestor, pumping fluid *before* natural selection could act.  
     *Requirement:* Explain how novel traits can acquire functions *without prior selection history*.  
     *Why non-negotiable:* Evolutionary novelty must be tractable; if functions require history, innovation is paradoxical.

  2. **Synthetic Protein in a Synthetic Cell**  
     *Case:* A de novo protein designed in a lab, integrated into a synthetic cell to perform a task no lineage was selected for.  
     *Requirement:* Ascribe functions to traits lacking evolutionary history, based on *current organization/intent*.  
     *Why non-negotiable:* Synthetic biology challenges purely historical accounts; functions must arise in systems without ancestry.

  3. **Surgically Repurposed Muscle Flap**  
     *Case:* A back muscle moved to serve as a replacement heart valve.  
     *Requirement:* Explain how a trait can gain a *new* function without evolutionary change.  
     *Why non-negotiable:* Medicine and biotechnology rely on functional repurposing; theories must accommodate non-evolutionary function shifts.

  4. **The Failing Heart**  
     *Case:* A heart unable to pump blood effectively.  
     *Requirement:* Maintain that the heart *has* a function it cannot perform.  
     *Why non-negotiable:* Central to pathology, ethics of treatment, and defining biological norms.

  ---

  ### **III. Consistency Constraints**
  *(Non-negotiable alignment with biology/medicine)*

  1. **Evolution by Natural Selection**  
     *Requirement:* Functions must explain adaptations (e.g., the lion’s teeth for tearing flesh).  
     *Why:* Biology’s core theory; failure here invalidates the account.  
     *Conflict risk:* Tensions with proto-heart/synthetic cases.

  2. **Malfunction in Medicine**  
     *Requirement:* Justify medical interventions by identifying functions independently of current performance.  
     *Why:* Clinical practice presupposes normative functions (e.g., pacemakers for hearts).  
     *Conflict risk:* Causal-role accounts struggle with normativity.

  3. **Vestigial Traits**  
     *Requirement:* Explain why a trait (e.g., whale pelvis) lacks a current function but retains historical identity.  
     *Why:* Pervasive in evolutionary biology; tests separation of current utility from function.

  ---

  ### **IV. Contentious "Smuggled" Requirements**
  *(Negotiable; reflect external philosophical commitments)*

  1. **Artifact Compatibility**  
     *Demand:* Functions in biology must align with artifact functions (e.g., a heart is "for" pumping like a pump is "for" moving water).  
     *Source:* Philosophy of technology/mind; risks anthropocentrism.  
     *Why contentious:* Biology lacks a designer; may force teleology where none exists.

  2. **Mental Representation Compatibility**  
     *Demand:* Functions must ground mental content (e.g., "heart" concepts).  
     *Source:* Philosophy of mind (teleosemantics).  
     *Why contentious:* Not all function theories need serve this agenda; biology may not require it.

  3. **Strong Normativity**  
     *Demand:* Functions imply intrinsic "oughts" (e.g., a heart *should* pump blood).  
     *Source:* Ethics or robust teleology.  
     *Why contentious:* Biology may only require statistical norms; "oughts" may be metaphorical.

  ---

  ### **V. Key Tensions & Trade-offs**
  *(Likely unresolvable; force theoretical choices)*

  1. **History vs. Novelty**  
     - *Tension:* Can a theory satisfy the **proto-heart/synthetic protein** (no history) and **vestigial traits** (history-dependent) cases simultaneously?  
     - *Sticking point:* Etiological theories fail novelty; causal-role theories struggle with vestigiality.

  2. **Normativity vs. Novelty**  
     - *Tension:* Can **malfunction** (requires normativity) and **synthetic protein** (requires non-historical function) coexist?  
     - *Sticking point:* Norms often appeal to history or design; novelty lacks both.

  ---

  ### **VI. Scoring Major Theories**

  - **Selected-Effect (Etiological) Account**  
    ✅ Excels at adaptation, malfunction, vestigial traits, and type/token distinctions.  
    ❌ Fails proto-heart, synthetic protein, and repurposed muscle flap (no selection history).  
    *Verdict:* Biologically robust but cannot handle innovation or design without evolution.

  - **Causal-Role (Systemic) Account**  
    ✅ Handles proto-heart, synthetic protein, and repurposed muscle via current organization.  
    ❌ Struggles with malfunction, vestigial traits, and function/accident distinctions (lacks normativity).  
    *Verdict:* Flexible for novelty but biologically "too permissive"; conflates function with causal contribution.

  ---

  ### **The Eliminator Requirement**
  **"Function Without Selection History"** (proto-heart/synthetic protein cases) is the single requirement that eliminates the most otherwise-plausible theories. It forces theories to either:  
  - Reject etiological foundations (sinking SE accounts), or  
  - Stretch "selection" to include non-evolutionary processes (e.g., lab design), risking conceptual incoherence.  

  This requirement exposes the core rift: **Can biology ground functions purely in current causal architecture, or must it invoke history?** Resolving this tension is where your seminar’s debates will ignite.
