  Section 3 (Cruxes and Predictions) involves three pre-committed tests. First, for "satisfied life-years" - does this solve snapshot problems or create new ones? Second, the "ministry trial" experiment - what happens when some ministries tie budgets to ladder scores? Third, aggregation alternatives - how do rankings change under threshold or bottom-penalized means? For each, I need both teams' predictions and what would falsify their views.

