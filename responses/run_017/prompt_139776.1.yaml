  ### Diagnostic Tree for the Metaphysics of Modality

  **Instructions:** Answer each question based on your intuitive judgment of the cases. Do not appeal to philosophical labels or formal logic. Use unambiguous ordinary language. Proceed sequentially—each answer determines the next question.

  ---

  #### 1. Are there facts about what is possible or necessary that do not depend on what anyone can know, verify, or stipulate?  
     - **Yes** → Go to 2  
     - **No** → Go to A  

  #### 2. Are these modal facts made true by something non-modal?  
     - **Yes** → Go to 3  
     - **No** → Go to B  

  #### 3. Could there be a fundamental property (e.g., a new force of nature) that nothing in our universe instantiates or could possibly instantiate?  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  #### 4. Could there have been nothing concrete at all (no physical objects, minds, or material things)?  
     - **Yes** → Go to 6  
     - **No** → Go to 7  

  #### 5. Could *this very wooden table* (pointing to a specific table) have been made of entirely different material (e.g., ice or plastic) while remaining the same table?  
     - **Yes** → Go to 8  
     - **No** → Go to 9  

  #### 6. Are the truthmakers for modal facts concrete worlds (i.e., physical universes like ours, but not part of our spacetime)?  
     - **Yes** → Go to 10  
     - **No** → Go to 11  

  #### 7. Must every possible way things could be settle every question (e.g., "is there life on planet X?"), or can there be partial possibilities?  
     - **Must settle every question** → Go to 12  
     - **Can be partial** → Go to 13  

  #### 8. When we quantify over possible things (e.g., "there is a world where..."), does anything we quantify over fail to exist in the ordinary, actual sense?  
     - **Yes** → Go to 14  
     - **No** → Go to 15  

  #### 9. Is actuality a property that some things have (like "being here" for locations), or does "actual" shift meaning with the speaker?  
     - **Property** → Go to 16  
     - **Shifts** → Go to 17  

  #### 10. Is every way things could be (e.g., every recombination of what exists) realized in some concrete world?  
     - **Yes** → Leaf: **Concrete Modal Realism**  
     - **No** → Leaf: **Concrete Plurality without Plenitude**  

  #### 11. Are the truthmakers for modal facts grounded in the natures or causal powers of actual things (e.g., what water *must* do given its structure)?  
     - **Yes** → Leaf: **Grounding in Essences/Causal Powers**  
     - **No** → Leaf: **Combinatorial Reduction**  

  #### 12. Could there be a human being qualitatively identical to you (same appearance, memories, etc.) but numerically distinct (a different person)?  
     - **Yes** → Leaf: **Non-Modal Abstract Realism (Linguistic)**  
     - **No** → Leaf: **Non-Modal Abstract Realism (Propositional)**  

  #### 13. Are the abstract representatives of possibilities constructed using prior modal notions (e.g., "possible" states of affairs)?  
     - **Yes** → Leaf: **Modal Abstract Realism**  
     - **No** → Leaf: **Non-Modal Abstract Realism (Linguistic)**  

  #### 14. Are modal claims (e.g., "dragons could exist") true because they correctly describe a useful fiction?  
     - **Yes** → Leaf: **Fictionalism**  
     - **No** → Leaf: **Deflationism/Expressivism**  

  #### 15. How do we know modal claims? By conceptual analysis (e.g., "bachelors are unmarried") or by empirical methods?  
     - **Conceptual** → Leaf: **Brute Primitivism**  
     - **Empirical** → Leaf: **Combinatorial Reduction**  

  #### 16. Are modal facts brute (i.e., not further explainable)?  
     - **Yes** → Leaf: **Brute Primitivism**  
     - **No** → Go to 11 (re-enter tree)  

  #### 17. Do modal claims express facts or attitudes/rules?  
     - **Facts** → Leaf: **Fictionalism**  
     - **Attitudes/rules** → Leaf: **Deflationism/Expressivism**  

  ---

  ### Leaf Positions and Awkward Commitments  
  1. **Concrete Modal Realism**: Awkward commitment: You must accept an infinite plurality of physical universes, including ones where you exist with green skin.  
  2. **Concrete Plurality without Plenitude**: Awkward commitment: Modality re-enters when explaining why some recombinations are "worlds" and others are not, undermining the view’s reductive promise.  
  3. **Non-Modal Abstract Realism (Linguistic)**: Awkward commitment: Possible worlds are linguistic constructs, making possibilities depend on human language conventions.  
  4. **Non-Modal Abstract Realism (Propositional)**: Awkward commitment: Possible worlds are sets of propositions, raising puzzles about their unity and truthmakers.  
  5. **Modal Abstract Realism**: Awkward commitment: Possible worlds are abstract but defined using unanalyzed modal notions (e.g., "possible states"), making the account circular.  
  6. **Combinatorial Reduction**: Awkward commitment: Every possibility must be a recombination of actual constituents, ruling out alien properties or radical novelties.  
  7. **Grounding in Essences/Causal Powers**: Awkward commitment: Essences (e.g., "what water is") are taken as primitive, risking obscurity.  
  8. **Brute Primitivism**: Awkward commitment: Modal facts (e.g., "water is necessarily H₂O") are unexplainable bedrock.  
  9. **Fictionalism**: Awkward commitment: We knowingly speak falsely when saying "there is a world where pigs fly," but this is useful.  
  10. **Deflationism/Expressivism**: Awkward commitment: Modal claims (e.g., "could have been") express non-cognitive attitudes, not truths.  

