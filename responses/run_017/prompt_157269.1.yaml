  3. Applying to the White Horse Dialogue: The passage supports the user's view. If "white horse" occupies a distinct wei from "horse," they name different actualities. The thesis isn't sophistry but a claim about categorical boundaries.

  The user's bare-substance vs. positioned-sortal distinction is useful. The text's emphasis on wei (position/order) favors positioned-sortal. A white horse isn't just a horse plus whiteness; it's a distinct functional category. This helps the user's argument by showing the dialogue is serious ontology, not wordplay.

