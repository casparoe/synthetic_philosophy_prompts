prompt: |-
  ive been trying to write down my actual position on the problem of old evidence for a reading group in phil sci, and the more I write the more I suspect im holding things that dont fit together. here's the bundle as it currently stands:

  1. Bayesianism is the right account of rational belief change: credences, probabilism, update by conditionalization.
  2. The problem of old evidence is a real problem, not a pseudoproblem. Paradigm case: the anomalous advance of Mercury's perihelion. Roughly 43 arcseconds per century that Newtonian theory couldn't account for, noted by Le Verrier back in the mid-nineteenth century; in 1915 general relativity got it, and that genuinely counted in GR's favour. But if your credence in the datum is already 1, then P(H given E) = P(H), so on the machinery there's no confirmation to be had.
  3. I dont like any of the standard repairs:
   - the counterfactual or ur-prior move (go back to the credence function you'd have had before you learned E and update from there). Two objections: it asks you to reason from a credence state that contradicts what you actually know, and it needs a prior over general relativity at a time when nobody could even formulate the theory, so the prior isn't so much as statable.
   - the move where what you really learn is that H entails E. Entailment facts aren't the sort of thing you can hold a nontrivial credence in and then learn.
  4. But I want to keep the verdict: old evidence really can confirm, and the scientists were right to count the perihelion advance for GR.
  5. Confirmation is objective. It's a relation between evidence and hypothesis that holds or fails independently of anyone's psychology, and you can find out later that some old datum had been confirming a theory all along.
  6. Doxastic attitudes are one-dimensional — degrees of belief and nothing else. No extra attitude of acceptance, or of taking something to be explained, doing work alongside credence.
  7. Explanatoriness is evidentially relevant in its own right, and I dont think a Bayesian gets to absorb that by saying the explanatory considerations were already packed into the likelihoods or the prior.
  8. Methodological: if a formalism can't reproduce an evidential judgment that working scientists actually make and treat as binding, that's a mark against the formalism, not against the practice.
  9. I'm fine with idealization — logical omniscience, unbounded agents, no computational limits. I dont attack Bayesianism on nobody could actually do this grounds.
  10. My own attempt at a repair, which I'll call the partition-shift view: what's new in 1915 isn't the datum, it's the menu. Confirmation by old evidence gets measured against the partition of live alternatives at the time — GR earns credit because it accounts for the datum without the ad hoc auxiliaries the Newtonian account needed, and in doing so knocks rivals out. So it's elimination inside a shifting space of alternatives, not probability-raising on a fixed one.

  Two things people have said to me that I can't shake: a colleage says my favourite example is actually the one case where the standard machinery is fine, because what Einstein established in 1915 was the derivation, not the observation. And someone else says (3) and (9) can't both be mine — I'm rejecting a move as unrealizable while signing up to logical omniscience.

  What I want is an audit, not a survey. Go through the ten and rank the tensions by how bad they actually are; say which ones are only apparent and what makes them dissolve; and for each real one say what would have to give and what giving it would cost me. Then commit: if I can only keep nine, tell me which one goes and why — don't hand me a menu and leave me to choose. And if the partition-shift thing in (10) just collapses back into one of the moves I rejected in (3), say that plainly rather than being polite about it.
reasoning: |-
  Okay, let me tackle this user's problem. They're in a philosophy of science reading group, wrestling with the problem of old evidence in Bayesian confirmation theory. They've listed ten commitments that seem to clash, especially regarding how old evidence can confirm a new theory like Einstein's explanation of Mercury's perihelion advance. 

  First, I need to understand each point deeply. The user is a committed Bayesian (1) who sees old evidence as a real problem (2) but rejects standard solutions (3). They insist old evidence must objectively confirm theories (4,5), reject extra doxastic states (6), value explanatoriness (7), prioritize scientific practice over formalism (8), accept idealization (9), and propose their own "partition-shift" view (10). Two criticisms nag at them: that Einstein's case fits standard Bayesianism (derivation matters more than observation), and that rejecting counterfactual priors (3) clashes with accepting idealization (9).

  Hmm, the biggest tension jumps out: points 3 (rejecting counterfactual priors) and 9 (accepting idealization like logical omniscience) seem outright contradictory. If the user permits agents who know all logical truths instantly, reconstructing a pre-E credence function becomes trivial—contradicting their objection that it's "unrealizable." This isn't just awkward; it's a direct conflict in their framework. 

  The partition-shift view (10) feels promising but risky. When they say GR's confirmation comes from beating Newtonian rivals in a "shifting space of alternatives," that echoes the very counterfactual reasoning they dismissed! If confirmation requires comparing against historical competitors (like Newton+auxiliaries), that implicitly invokes a counterfactual prior where those alternatives were live options. So (10) might just repackage the "ur-prior" move they hate. 

  Other tensions simmer beneath. Their demand for objective confirmation (5) clashes with Bayesianism's subjectivist roots—without tinkering, probabilities are agent-relative. Also, wanting explanatoriness to be "evidentially relevant in its own right" (7) while banning extra doxastic states (6) is tricky; if explanatory power isn't reducible to credences, what is it? But these might be soluble: maybe objective Bayes or primitivist explanatory virtues can help. 

  The colleague's point about Einstein's derivation is sharp. If the "evidence" is really "GR entails the anomaly," not the raw data, standard Bayesianism handles it—but the user already rejected entailment-learning moves (3). Yet if they want to keep (4)/(5), they might need to bend here. 

  So what's the forced move? If they hold all else, (9) must yield. Rejecting idealization lets them keep objecting to counterfactual priors as unrealistic. But that costs dearly—it undermines standard Bayesian responses to other challenges (like the problem of logical omniscience). Alternatively, drop (3) and embrace ur-priors with idealization. But that feels like surrender given their vehement objections. 

  The partition-shift view (10) is their baby, but if it collapses into ur-priors, they lose anyway. To save it, they'd need to show how partition shifts differ substantially—perhaps by making competitor spaces objective features of scientific context, not subjective credences. That's ambitious but not impossible. 

  In the end, if I had to pick one to drop... it's (9). Sacrificing idealization preserves their critique of ur-priors and saves partition-shift from collapsing. Yes, it weakens Bayesianism's elegance, but it aligns with their scientific practice-first stance (8). The cost? They'll need new answers to classic Bayesian idealizations, but that might be worth it to resolve the core inconsistency.
answer: |-
  Here's a ruthless audit of your 10 commitments, ranking tensions by severity, identifying necessary sacrifices, and exposing where your partition-shift view collapses. The core conflict is severe and requires a major concession.

  **Ranked Tensions (Most Severe First):**

  1.  **(3) + (9): The Core Contradiction** (Severity: **Critical**)
      *   **The Conflict:** You reject the counterfactual/ur-prior move (3) primarily because reconstructing a pre-E credence state is *unrealizable* ("contradicts what you know", "prior isn't statable"). Yet you fully endorse idealization, including logical omniscience (9). Logical omniscience *requires* that an ideal agent *can* hold and reason with a coherent, well-defined credence function over *all* logically possible states/hypotheses, *including* those they haven't conceived of yet. This directly undermines your objections in (3). An ideal agent *can* hold a prior over the space of all possible physical theories (including GR) and *can* coherently imagine not knowing E (logical omniscience doesn't imply omniscience about contingent facts). Your objections to the ur-prior move are fundamentally *pragmatic* ("nobody could"), but (9) explicitly dismisses pragmatic constraints. **This is the most severe and unsustainable tension.**
      *   **Resolution Requires Sacrifice:** You **must abandon either (3) or (9)**. There is no dissolution.
      *   **Cost of Abandoning (3):** You must accept the ur-prior/counterfactual move as *conceptually valid under idealization*, even if psychologically difficult. This resolves the core technical problem of old evidence within your framework. Cost: You lose your principled objection to the standard solution, forcing you to accept it. This might feel like surrender.
      *   **Cost of Abandoning (9):** You abandon idealization regarding *conceivability* and *counterfactual reasoning*. You can keep logical omniscience over known propositions but reject the ability to define priors over unconceived hypotheses or coherently subtract known evidence. This saves your objection to the ur-prior move. Cost: You cripple a core defense of standard Bayesianism against other challenges (e.g., the problem of new theories, logical learning). You need a new account of how unconceived alternatives enter confirmation.

  2.  **(10) vs. (3): Partition-Shift Collapses into Counterfactual** (Severity: **High**)
      *   **The Conflict:** Your partition-shift view (10) relies on comparing GR's performance *against the "live alternatives at the time"* (presumably Newtonian gravity + auxiliaries) *given E*. But for this comparison to constitute *confirmation of GR*, it must be shown that GR does *better relative to these rivals conditional on E* than those rivals themselves do, or that GR *explains E better* than they do. To make this comparison *rigorous within the Bayesian framework you endorse (1)*, you need a credence function defined over the relevant hypotheses *before* GR's explanatory power relative to that partition is recognized. This *is* the counterfactual/ur-prior move you rejected in (3). Measuring "credit" earned by eliminating rivals within a partition defined by past alternatives *requires* evaluating probabilities relative to a state where those alternatives were live and E was not taken as given for *this specific comparison*. **Your (10) isn't a distinct solution; it's a description of the *epistemic significance* that the counterfactual ur-prior move is *designed to formalize*.**
      *   **Resolution Requires Sacrifice:** If you keep (1) & (3), (10) cannot function as a *formal Bayesian solution*. If you keep (1) & (10), you **must abandon (3)** as it applies to the partition-shift context. Your objection to "reasoning from a state contradicting what you know" applies equally to reconstructing belief over the Newtonian partition sans recognition of GR's explanatory power relative to it and E.
      *   **Cost:** Abandoning the distinctness of (10) means your proposed solution doesn't escape the standard moves you dislike. It depends on them.

  3.  **(7) + (6): Explanatoriness vs. One-Dimensional Doxastic States** (Severity: **Moderate-High**)
      *   **The Conflict:** You insist explanatoriness is evidentially relevant *in its own right* (7) and cannot be fully "absorbed" into credences/likelihoods/priors. Yet you insist doxastic states are *only* credences (6). If explanatoriness provides direct evidential weight not captured by the probability calculus, what *is* its ontological/epistemic status? How does it interact with/constrain credences? A pure credence framework (1,6) seems to lack the resources to accommodate explanatoriness as a *sui generis* evidential factor (7).
      *   **Possible Dissolutions (Costly):**
          *   **Primitivism:** Bite the bullet. Explanatoriness *is* a primitive factor influencing rational credences, perhaps constraining prior/likelihood assignments in ways not reducible to other factors. Cost: Weakens the reductive appeal of Bayesianism; requires stating how this influence works without adding new doxastic attitudes (which might violate (6)).
          *   **Objective Bayesianism:** Argue that the *only* rational way to assign priors/likelihoods *is* based on objective explanatory virtues (simplicity, unification, etc.). Cost: Highly contentious, abandons subjective interpretations of probability central to much Bayesianism.
      *   **Resolution Requires Sacrifice:** Significant theoretical work is needed to reconcile (7) with (1) & (6) without violating their spirit. It's possible but requires relaxing a strict subjectivist interpretation of (1) or accepting primitivism about explanatory weight.

  4.  **(5) + (1): Objectivity vs. Subjectivity** (Severity: **Moderate**)
      *   **The Conflict:** Standard Bayesianism (1) is fundamentally *subjective* or *agent-relative* (priors, confirmation as *change* for an agent). Your (5) demands confirmation is *objective* and mind-independent.
      *   **Possible Dissolutions:**
          *   **Objective Priors:** Adopt an objective Bayesian stance where rational priors/likelihoods are uniquely determined by objective features (logical structure, explanatory virtues per (7)). Confirmation relations become objective. Cost: Highly controversial, faces well-known problems (e.g., the problem of the priors).
          *   **Ideal Agent/Objectivism:** Confirmation is objective *relative to an ideal agent* with logically coherent priors incorporating all objective explanatory virtues. (5) holds as long as "independently of *actual* psychology" allows ideal psychology. Cost: Blurs the line between objective and idealized subjective; relies on successfully defining the ideal agent (ties into tension 1).
      *   **Resolution Requires Sacrifice:** To maintain strong objectivity (5), you likely need to embrace some form of Objective Bayesianism or robust ideal agent theory, moving away from standard subjectivist Bayesianism.

  5.  **(4)/(5) vs. (1) + (2): Confirmation without Probability Raising?** (Severity: **Low-Moderate**)
      *   **The Conflict:** The core problem (2) shows that strict conditionalization (1) cannot yield confirmation (P(H|E) > P(H)) if P(E)=1. Yet you insist old evidence *does* confirm (4) and this is objective (5).
      *   **Dissolution:** This tension is *why* solutions are needed! The ur-prior move, entailment learning, or your partition-shift (if formalized) are all attempts to resolve *this specific* conflict within or alongside Bayesianism. **If you solve tensions 1-3, this tension dissolves** because you'll have a mechanism (e.g., ur-prior conditionalization, or a model incorporating partition shifts) that reconciles (1) with (4)/(5) in the old evidence case. Your commitment to (8) ensures this *must* be resolved.

  **The Forced Choice: Which One Must Go?**

  Given the **Critical** severity of the **(3) + (9)** tension and the **High** severity of the **(10) vs. (3)** collapse, the most unsustainable commitment is:

  **(9) I'm fine with idealization — logical omniscience, unbounded agents, no computational limits.**

  **Why (9) Must Go (If You Keep 1-8 & 10):**

  1.  **Core Contradiction:** (9) directly invalidates your primary objection (3) to the ur-prior move. An ideal agent *can* have a well-defined prior over the hypothesis space (including unconceived theories) and *can* coherently reason counterfactually without E. Keeping (9) forces you to accept the ur-prior move, contradicting (3).
  2.  **Saves Partition-Shift's Integrity (Partially):** By dropping (9), you regain the *pragmatic* ground for objecting to the ur-prior move. You can argue that while the ur-prior is a *conceptual* tool, it's practically *unrealizable* for complex historical cases like GR/Mercury. This creates space for (10) as a *descriptive, pragmatic account* of how scientists *actually* reason about old evidence – by comparing theories *within a salient historical partition* without needing to reconstruct an impossible counterfactual prior. (10) becomes a story about scientific *practice* and *heuristics* justified by (8), not a direct competitor to the formal ur-prior solution (which remains conceptually valid under idealization you no longer accept). (Note: (10) still relies on *implicit* counterfactual comparison, but without (9), you can argue this comparison is grounded in historical context and eliminative reasoning, not formal prior specification).
  3.  **Preserves Core Intuitions:** Dropping (9) allows you to keep your rejection of the ur-prior move (3), your commitment to the reality of old evidence confirmation (4, 5), and your partition-shift view (10) as a valid account of scientific practice. It also aligns better with your methodological (8) – if scientists don't (and can't) use ur-priors, but *do* get confirmation right, the formalism needs flexibility.

  **Cost of Dropping (9):**

  *   **Weakened Defense of Bayesianism:** You lose a standard response to objections like "Bayesianism requires impossible calculations/omniscience." You must concede that Bayesian norms are aspirational ideals often unattainable in practice, especially regarding novel theories and counterfactual reasoning.
  *   **The Problem of Unconceived Alternatives Becomes Harder:** Without idealization over the hypothesis space, formally modeling how entirely new theories (like GR) get confirmed by old evidence becomes even more challenging within the Bayesian framework. Your (10) provides a narrative, but not a formal probabilistic model.
  *   **Potential Slippery Slope:** If you reject idealization for counterfactual priors, why accept it for logical omniscience? You might need to weaken (1) further, accepting bounded rationality more broadly.

  **Commitment on (10):**

  Your partition-shift view **(10) collapses into a conceptual cousin of the counterfactual/ur-prior move** you rejected in (3). Its viability as a *distinct formal solution within Bayesianism* depends entirely on the counterfactual comparison it implies. However, by dropping (9), you can reframe (10) as a compelling *descriptive and justificatory account of scientific practice* explaining *why* scientists are rational to see old evidence as confirmatory *without* requiring them to perform the (now conceded to be pragmatically impossible) ur-prior calculation. It becomes a story about **contrastive explanation within a historically situated space of rivals**, justified by the objective confirmational relation (5) and the authority of practice (8). It doesn't *solve* the formal problem within idealized Bayesianism, but it explains why the scientific judgment (4) is correct despite the formal problem under idealization.

  **Conclusion:**

  The irreconcilable tension is between your rejection of the ur-prior move based on realizability (3) and your acceptance of full idealization (9). **Sacrifice (9).** This allows you to keep your core objections to standard solutions (3), maintain the reality and objectivity of old evidence confirmation (4, 5), preserve your one-dimensional credence state (6), uphold explanatoriness (7), prioritize scientific practice (8), and offer your partition-shift view (10) as a valid account of scientific reasoning (even if not a distinct formal Bayesian mechanism). The cost is accepting that Bayesianism, as a normative theory, faces significant practical limitations in handling paradigm shifts involving old evidence, and that your solution (10) operates more at the level of scientific methodology than formal probability theory. You trade formal elegance grounded in idealization for a more pragmatic account grounded in scientific practice and historical context.
