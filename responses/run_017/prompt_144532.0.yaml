  **Note on the Sestina**

  **Janus Line**: The line in the fourth stanza, "A clerk had written: bolts were short. But no one knew", serves as the janus line. For a reader unaware of the breach, the line is a neutral statement of fact: a memo about faulty bolts was misfiled and thus unknown. It is presented as one of many details, and its significance is not emphasized. However, to a reader who knows the levee failed, the same line becomes ominous: the bolts were a critical weakness, and the fact that no one knew about the memo explains why the problem was not addressed, making the breach feel predestined. The line holds under both readings because it does not explicitly link the memo to the breach; that connection is left for the reader to make (or not) based on prior knowledge.

  **Liberties and Contested Interpretations**: The poem takes liberties in several places. First, it simplifies the 1897 board vote into a clear mistake, when the decision to build the gatehouse might have been reasonable at the time (e.g., for tourism or infrastructure). Second, the three wet winters are presented as fostering overconfidence ("The people all then knew / The levee stood"), but the historical actors might have remained cautious. Third, the alternative futures (breach in 1899 or 1910) are acknowledged but dismissed quickly ("But who knew then?"), which risks minimizing historical contingency. The poem leans on a contested reading of the narrative fallacy by suggesting that the historian's causal chain is artificially constructed, yet it presents the actual outcome as the only plausible one until the envoy.

  **Hindsight Bias vs. Dramatic Irony**: The poem enacts hindsight bias through the historian's voice, which increasingly frames events as leading inevitably to the breach (e.g., "The signs were there" in stanza six). This is distinct from dramatic irony (where the audience knows more than the characters) because the historian is also a victim of the bias: they project their current knowledge onto past actors. The envoy explicitly critiques this by revealing the narrative as constructed ("ordered after / The event"). I am highly confident that this captures hindsight bias, as the focus is on the historian's cognitive distortion after knowing the outcome. However, the line is fine: the dramatic irony (reader's foreknowledge) facilitates the hindsight bias effect but is not the primary mechanism.

  **Least Sure Claim**: In the note above, the claim that the poem "risks minimizing historical contingency" by quickly dismissing the alternative futures is the one I am least sure of. The poem does mention the alternatives, and the brevity might reflect the historian's bias rather than an oversight. However, it could be argued that the poem adequately represents contingency by including them at all.
