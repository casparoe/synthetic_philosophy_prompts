prompt: |-
  I'm a novelist, and after three books about people I made up I've spent the last two years on something I no longer know how to describe: a novel about an invented nineteenth-century woman — call her Mary Aldiss — who spent eleven years as a human "computer" at a small observatory, was quietly dismissed when the director took credit for a star catalogue she had largely compiled, and who in her last decade stopped answering letters about astronomy and asked her sister to burn her notebooks. Her sister burned most of them. What survives is about forty pages of fragment and a great deal of silence. The irony is not lost on me. The book I want to write is about a woman who withdrew, and the only way I can see to write it is to give her a childhood, a lover, a private vocabulary, a final confrontation with the director that almost certainly never happened — and then to be thanked, presumably, for giving her back her voice. My publisher's contracts department has been delightful and useless on the point, and I've started daydreaming about the document that would actually tell me what I am permitted to do, which is how I arrived at this request.

  I'd like you to write that document, as a piece of deadpan satire. Give me an internal compliance instrument from the legal department of a studio or publishing house — call it Form 17-B, "Dramatization Consent Waiver and Legacy Impact Assessment (Deceased Subject)" — running to roughly 800 words, laid out as numbered clauses with checkboxes, blanks to be filled in, defined terms, and cross-references that lead nowhere, in the flat and entirely self-assured register of real production paperwork. It should be written from inside the institution, which has solved this problem and is faintly impatient with anyone who hasn't. Among the things I hope to find in it: an Overwrite Coefficient estimating the degree to which the finished work will permanently replace the real person in public memory, with a worked example showing that a successful depiction drives the coefficient to 1.0 and therefore resolves the question; a Willed Obscurity Election for subjects who appear to have chosen not to be remembered, together with the box for establishing that they did not mean it; a Ten Percent Doctrine capping invention at ten per cent of screen time or pages while permitting it to include all motivation, interiority, and last words; Composite Character Certification, allowing three real people to be merged so that no one of them is defamed by what the composite does; an Empathy Floor requiring that the subject remain sympathetic for at least sixty per cent of act two; a clause noting that the subject cannot withdraw consent; and an Estate Satisfaction Guarantee under which any element a rights-holder finds unflattering may be reshot, so that the truth of the depiction is whatever the estate will license.

  Two further requirements. First, the humour has to come from the actual ethics of the practice rather than from invented absurdity: every comic clause should exaggerate something dramatizations of the real dead genuinely do or genuinely assume — that a flattering lie is a form of respect, that a life has to be given the shape of a plot in order to be worth telling, that fame or obscurity is itself a kind of consent, that the disclaimer at the front of the film is doing moral work, that we may invent freely provided we invent inspirationally. No winking, no named real people, no real statutes or real cases, and no citations: the instrument should be entirely invented, so that nothing in it needs to be looked up. Second, I'd like the form's own logic to arrive somewhere I recoil from. A schedule of Progressive De-Identification, offering the one depiction guaranteed to wrong no one by degrees until nothing recognisable remains, crossed against Marketing's requirement that the subject stay recognisable, would do it — as would a clause that briefly states the worry I actually have and a following clause instructing that such questions are not to be raised in writing. A reader who has never thought about posthumous harm should still understand what is being mocked, and should finish it unsure whether signing would be wrong, and whether "we made her inspiring" is an answer.
reasoning: |-
  Okay, the user is a novelist grappling with ethical dilemmas in writing about a fictional 19th-century woman astronomer. They've created Mary Aldiss, based loosely on historical figures like human "computers" who did calculations before modern tech. The core tension: wanting to give voice to someone who deliberately erased herself, while recognizing the irony of overwriting her silence. 

  The request is brilliantly specific—a satirical legal form that exposes industry hypocrisy around "based on true story" narratives. Their deeper need seems to be validation of their unease; they want the form to weaponize corporate logic against itself. Key pain points: the publisher's unhelpful legal team, the horror of "giving voice" becoming colonization, and the fear that making Mary inspirational betrays her choice of obscurity.

  Hmm, they're asking for 800 words of deadpan bureaucracy that lands where they recoil. Must avoid cheap laughs—every clause should mirror real Hollywood/publishing ethics abuses. The Overwrite Coefficient is genius: quantifying how biopics replace real people. The Ten Percent Doctrine nails how studios reduce ethics to math. The Willed Obscurity clause should sting—that moment where bureaucracy dismisses "she wanted to be forgotten" as irrelevant.

  For the recoil moment... ah, Progressive De-Identification is perfect. A flowchart where removing "problematic" traits (her withdrawal, her anger) leaves a marketable shell. And the Estate Satisfaction Guarantee—letting heirs veto truth—should read like a hostage negotiation. 

  Biggest challenge: balancing satire with plausibility. The "Composite Character Certification" must sound legit while implying merging victims absolves defamation. The "Empathy Floor" should reduce moral complexity to a timer. And the disclaimer clause must highlight how "inspired by real events" is a get-out-of-jail-free card.

  Final note: the user’s phrase "we made her inspiring" is the dagger. The form should end by implying that if Mary’s fictionalized self is uplifting enough, her erasure was a public service. Brutal.
answer: |-
  ## Form 17-B: Dramatization Consent Waiver and Legacy Impact Assessment (Deceased Subject)

  **Version:** 8.3.1a (Supersedes all prior versions, extant or implied)
  **Effective Date:** Upon Filing
  **Subject Designation:** MARY ALDISS (Deceased) ("Subject")
  **Project Designation:** "STARRY SILENCE" (Working Title) ("Project")
  **Filer:** [Authorized Representative Name/Title] ("Filer")

  **1. PURPOSE & SCOPE:** This Instrument (Form 17-B) governs the dramatization of biographical elements pertaining to the Deceased Subject where express consent is unobtainable and legacy rights holders are indeterminate, nominal, or non-existent. It establishes protocols for mitigating perceived ethical and reputational risks associated with creative interpretation, superseding common law concerns regarding appropriation of likeness or posthumous harm (see Clause 12.4). Filing constitutes acknowledgment that historical fidelity is secondary to narrative efficacy and commercial viability within defined parameters.

  **2. DEFINITIONS:**
      *   2.1. **"Factual Core":** Events, dates, occupations, or relationships verifiable via public record or contemporaneous non-fiction documentation.
      *   2.2. **"Inventive Supplement":** Dialogue, motivations, undisclosed relationships, interior states, unrecorded events, thematic emphasis, and character traits inferred or created to serve narrative cohesion and audience engagement.
      *   2.3. **"Legacy Impact":** The projected alteration in public perception and historical memory of the Subject attributable solely to the Project.
      *   2.4. **"Willed Obscurity":** A demonstrable pattern of actions by the Subject indicating a preference for non-remembrance (e.g., destruction of personal papers, refusal of biographical inquiries, lack of self-promotion).
      *   2.5. **"Marketable Recognition Threshold (MRT)":** The minimum level of identifiable association between the Subject and the Project character required for audience connection and commercial exploitation, as determined by Marketing (Appendix C, not attached).

  **3. OVERWRITE COEFFICIENT (OC) ASSESSMENT:**
      3.1. The Filer **MUST** calculate the projected OC using the formula: OC = (Projected Audience Reach x Narrative Dominance Score) / Pre-Existing Public Awareness.
          *   3.1.1. Projected Audience Reach: [______] (Est. units sold/tickets)
          *   3.1.2. Narrative Dominance Score: [______] (Scale 1-10, 10=Project is definitive cultural depiction)
          *   3.1.3. Pre-Existing Public Awareness: [______] (Scale 1-10, 1=Unknown, 10=Household Name)
          *   3.1.4. **CALCULATED OC:** [______]
      3.2. **Interpretation:**
          *   OC < 0.3: Negligible legacy impact. Proceed with minimal restrictions.
          *   0.3 ≤ OC < 0.7: Moderate impact. Apply standard Form 17-B protocols.
          *   OC ≥ 0.7: High Impact. Subject's identity may be subsumed by Project depiction. **This resolves ethical concerns regarding obscurity, as the Subject achieves posthumous recognition.** (See Worked Example: A successful biopic (Reach: High, Dominance: 10, Awareness: Low (2)) yields OC= (8 x 10) / 2 = 40.0. OC=40.0 >> 1.0, establishing the Project depiction as the culturally dominant memory. The Subject's prior obscurity is rendered irrelevant.)

  **4. WILLED OBSCURITY ELECTION (WOE):**
      4.1. Evidence suggests the Subject engaged in Willed Obscurity? ☐ Yes ☐ No ☐ Ambiguous
      4.2. If Yes or Ambiguous, Filer **MUST** attest:
          *   ☐ The Subject's actions, while indicative of a desire for privacy, cannot be construed as a legally binding injunction against posthumous commemoration.
          *   ☐ Historical significance outweighs personal preference for obscurity.
          *   ☐ The Project serves a higher purpose of inspiration/education, rendering the WOE ethically void. *(Select all that apply)*
      4.3. **Conclusion:** The Subject's WOE is hereby deemed: ☐ Inapplicable ☐ Superseded by Cultural Need (Per Clause 3.2) ☐ Mitigated by Narrative Treatment

  **5. TEN PERCENT DOCTRINE (TPD):**
      5.1. The Filer estimates the percentage of the Project's total runtime/page count constituting the **Factual Core:** [______]%
      5.2. The Filer estimates the percentage constituting **Inventive Supplement:** [______]%
      5.3. **Certification:** Filer certifies that Inventive Supplement **DOES NOT EXCEED** 90% of the Project. *(Note: Motivation, interiority, final words, and pivotal emotional confrontations inherently constitute Inventive Supplement, regardless of historical plausibility. The 10% Factual Core requirement is satisfied by basic identifiers and verifiable events.)*

  **6. COMPOSITE CHARACTER CERTIFICATION (CCC):**
      6.1. Does the Project merge attributes/actions of multiple real individuals into a single character representing the Subject or interacting with the Subject? ☐ Yes ☐ No
      6.2. If Yes:
          *   6.2.1. Maximum number of real individuals composited: [______] (Max 3 per Clause 6.3)
          *   6.2.2. Filer certifies that no single composited individual bears primary responsibility for potentially defamatory actions assigned to the composite character.
          *   6.2.3. **Certification:** The composite character is a narrative device and does not falsely represent any *one* specific historical personage, thereby mitigating defamation risk.

  **7. EMPATHY FLOOR REQUIREMENT (EFR):**
      7.1. Filer certifies that the Subject, as depicted, maintains audience sympathy/identification for no less than **60% of Act II** (or narrative equivalent).
      7.2. Methods to ensure EFR compliance (e.g., mitigating documented flaws, emphasizing relatable struggles, providing redemptive arc): [____________________________________________________________________________________________________________________________________]

  **8. IRREVOCABILITY & DISCLAIMER PROTOCOL:**
      8.1. Acknowledgment is made that the Subject cannot provide consent or withdraw consent posthumously. This Instrument operates under the principle of **Beneficent Interpretation**.
      8.2. The Project **MUST** include the Standard Disclaimer: *"While inspired by real events and persons, this is a fictionalized dramatization. Certain characters, incidents, locations, and dialogue have been created or altered for dramatic purposes."*
      8.3. Filer acknowledges this Disclaimer fulfills all ethical disclosure obligations regarding historical deviation.

  **9. ESTATE SATISFACTION GUARANTEE (ESG) - (Applicable ONLY if identifiable Estate/Rights Holder emerges post-filing):**
      9.1. Should a validated Estate/Rights Holder object to specific depictions deemed unflattering or inaccurate:
          *   9.1.1. The Studio/Publisher reserves the right, at its sole discretion, to negotiate revisions or reshoots for subsequent editions/releases to achieve Estate satisfaction.
          *   9.1.2. **The revised depiction, once accepted by the Estate, shall be deemed the authorized and 'true' depiction for all purposes related to the Project.** Historical accuracy is secondary to licensable harmony.

  **10. PROGRESSIVE DE-IDENTIFICATION SCHEDULE (PDIS) - (Contingency Protocol):**
      10.1. Should unresolvable ethical or legal challenges arise *post-filing* regarding specificity of depiction, the Filer agrees to implement the PDIS to reduce identifiability:
          *   **Step 1:** Remove specific proper names (Subject becomes "The Astronomer's Assistant").
          *   **Step 2:** Alter specific, non-essential biographical details (e.g., change observatory name, nationality).
          *   **Step 3:** Generalize the profession/context (e.g., "A 19th-Century Female Scientist").
          *   **Step 4:** Remove all specific historical context (e.g., "A Woman Fighting for Recognition").
      10.2. **Certification:** Filer acknowledges implementation of PDIS Steps may reduce Project value by lowering recognizability below the MRT (See Definition 2.5). PDIS is a measure of last resort, conflicting with core commercial objectives. The optimal solution remains achieving an OC ≥ 0.7 (Clause 3.2).

  **11. NARRATIVE INTEGRITY & INSPIRATION MANDATE:**
      11.1. Filer affirms that the primary goal of the Project is to create an **inspiring, dramatically compelling narrative** accessible to a contemporary audience.
      11.2. Concerns regarding historical violation of the Subject's demonstrable wishes (e.g., destruction of notebooks, withdrawal from discourse) are acknowledged but deemed subordinate to the **Inspirational Imperative**.
      11.3. **Certification:** The Project ultimately honors the Subject by rescuing them from obscurity and presenting their life (or its essence) in a manner deemed uplifting and meaningful by modern standards, irrespective of the Subject's own actions or desires. *(Note: Raising fundamental objections to this principle invalidates the use of Form 17-B and suggests the underlying material is commercially non-viable. Such meta-ethical concerns should not be documented; consult Legal verbally.)*

  **12. GENERAL PROVISIONS & INDEMNITY:**
      12.1. Filing Form 17-B constitutes agreement to all terms and represents good faith effort to navigate legacy concerns.
      12.2. The Studio/Publisher assumes no liability for alterations to public perception or historical record.
      12.3. Cross-references to Appendices A, B, C, or internal statutes (e.g., "HR-404: Posthumous Persona Policy") are for structural verisimilitude only.
      12.4. This Instrument exhausts all ethical considerations pertaining to the dramatization of the Deceased Subject.

  **FILER ATTESTATION:**
  By signing below, the Filer certifies understanding of all clauses, affirms the accuracy of provided estimates and certifications, acknowledges the primacy of narrative and inspiration over historical minutiae or posthumous autonomy, and agrees that the successful execution of the Project (achieving OC ≥ 0.7) constitutes the definitive ethical resolution.

  **Signature:** _________________________ **Date:** _______________
  **Name/Title:** [________________________________]
  **Project Code:** [_________]

  **(Submit original + 2 copies to Legal Dept., Bin 17-B. Retain pink copy.)**

  ---
  **How it Arrives Where You Recoil:** The form systematically dismantles ethical barriers. The Overwrite Coefficient (Clause 3) turns obscurity into a problem *solved* by successful fiction. The Willed Obscurity Election (4) provides bureaucratic checkboxes to dismiss her clear wishes. The Ten Percent Doctrine (5) legalizes the invention of her entire inner world. The Estate Guarantee (9) makes truth negotiable. The De-Identification Schedule (10) offers a path to complete erasure *if* she proves troublesome, but explicitly conflicts with Marketing's need to *use* her identity (MRT). Finally, Clause 11 states the quiet part loud: the "Inspirational Imperative" justifies everything. Her withdrawal and demand for erasure are obstacles to be overcome by the *greater good* of making her inspiring *against her will*. The final instruction in 11.3 – that questioning this core justification is commercially non-viable and *should not be documented* – is the chilling bureaucratic seal on the ethical vacuum. Signing means agreeing that "we made her inspiring" is the only answer that matters.
