prompt: |-
  Hi — you're an expert here, so I'm trusting you: a professional philosopher of history who also understands how a newsroom actually works. Think carefully and go slowly, and before you write anything, spend some time brainstorming the failure modes — please don't just recite the standard summary of historical revisionism versus denialism, I can get that myself and it wouldn't help me on deadline.

  I'm a journalist. I write a column and the occasional long feature on science, ideas, and how both get misused in public, and maybe three or four times a year I get pulled into history fights instead: a politician, a pundit, a professor or a textbook board says something about a mass atrocity — the Holocaust, the Armenian genocide, Nanjing, those kinds of cases — and I have to decide what word to use for what they're doing, in print, about a day after I start. My news editor has to sign off, our lawyer occasionally glances at things when the stakes are high, and I am not a historian. So what I want from you is a decision procedure, not an essay.

  The deliverable: an ordered set of questions I can run against a person's actual output — a speech, a book, a thread, a textbook paragraph — that lands me on one of a small number of verdicts, with real stop rules. Where does the procedure stop and tell me to write that this is denial? Where does it stop and tell me it isn't? And, importantly, where does it stop and say: this remaining question is a values call or a legal call and has to go to a human — my editor, our lawyer, an actual specialist I can phone?

  Constraints it has to survive:

  - I can't read minds and I'm not going to print an accusation about someones motives. If a step depends on guessing what the person really believes or wants, mark it as a step I'm not allowed to run.
  - I'm working from a desk. Assume I can read what they wrote, find their other public writing, and get a rough sense of whether specialists accept the claims — but not much more than that.
  - It has to be runnable in a few hours by a generalist, and defensible to my editor.
  - Each verdict needs wording guidance: what do I actually write when the answer is "not denial but badly wrong", or "structurally denialist but I shouldn't use that word on this occasion".

  Hard cases it has to handle. These are composites I made up, not real people:

  1. The number fighter. They accept the event happened and that it was a crime, but argue the death toll was a fraction of the usual figure — a fifth of it, say — using old census or demographic records. Sometimes this is a credentialed historian publishing in peer-reviewed venues, sometimes it's a retired accountant with a website. What in the procedure separates those, and at what point does the number question have to be handed to a specialist because I simply cannot evaluate the demography?

  2. What I've started privately calling denial by subtraction. Nothing is denied. The deaths happened, the camps or the death marches or the massacres are real. What disappears is the thing that made it an atrocity: the deaths get re-described as disease, chaos, famine, the fog of war, a communications breakdown; the perpetrators become people who failed to prevent something rather than people who did it. There's a sibling move where the same body count gets reassigned to a different cause or a different author, so the arithmetic is untouched but the responsibility dissolves. I need the procedure to catch these without me having to establish a state of mind.

  3. The legal-category dodge. I don't deny a thing, I just think genocide is a narrow legal term from a treaty definition written in the late 1940s, and applying it to this case is retroactive law-making. Is that denial, is it a genuinely arguable claim about how far a concept extends, or is it a third thing that needs its own verdict?

  4. The state that owns the word. Sometimes there's a law criminalizing denial of a particular atrocity and the government uses it against anyone who departs from the official account, credentialed scholars included. Sometimes it's the reverse: a government denies an atrocity its own predecessor committed and calls the historians liars. I do not want a procedure that defers to whoever has the law on their side, or to whoever my readers happen to sympathize with. What replaces that deference?

  5. The merely-contrarian case, where someone is bad at history or addicted to being the only person who sees through things, with no ideological stake — and then the uncomfortable one: someone broadly on my side of a fight doing something structurally identical to case 2 about an atrocity committed by the side they don't like. If my procedure doesn't bite on my own side, it's worthless, so tell me whether it does.

  One test I've found useful and want built in: an asymmetry check — does this person apply anything like the same ferocious standard of proof to atrocities committed by their own nation, party or side as they apply to the one they're attacking? That seems like the most reliable evidence I can actually gather from a desk. But be honest with me about how much weight it can bear and what it misfires on.

  Also please:

  - Run the finished procedure end-to-end on two of the composites above, including at least one where the verdict it produces is one I won't like. I'd rather recieve that news now than in a correction.
  - Flag which questions are genuine tests and which are judgment calls dressed up as procedure. My editor will ask.
  - Finish with what the procedure cannot do: the situations where it genuinely can't help and I should stop trying to mechanize this and just make a call.

  Take your time, think it through properly, and be blunt where I'm being naive.
reasoning: |-
  Okay, this journalist needs a practical decision tree for labeling historical denialism in their writing. They're dealing with high-stakes topics like genocides and mass atrocities, under tight deadlines. Key constraints: no mind-reading, must work from a desk with limited research time, defensible to editors/lawyers. 

  First, unpacking their core frustration: standard "revisionism vs denial" frameworks fail them because they need actionable thresholds, not theory. Their hard cases reveal traps where bad faith hides behind technical arguments (number fights), redefinition (denial by subtraction), or legal loopholes. The asymmetry test they mentioned is smart—I'll make that Question 4.

  Building the procedure brick by brick: Start with undisputed facts (Question 1) because if someone rejects foundational evidence (e.g., Holocaust gas chambers existed), it's straightforward denial. Then assess methodology (Question 2)—are they cherry-picking sources? That's where "retired accountant vs historian" cases diverge. Question 3 tackles their "denial by subtraction" case: separating causes from responsibility requires checking if they ignore perpetrator documents. 

  The legal-category dodge (their case 3) needs special handling—that's where Question 5 comes in, forcing consistency: if they apply genocide label to enemies but not allies, it's hypocrisy, not legal philosophy. For state pressure (case 4), Question 6 verifies consensus across geopolitical lines to avoid deference. 

  Hard truth for their case 5 (own-side bias): the procedure must flag ideological allies using denialist tactics. That's why Question 4's asymmetry test is brutal and non-partisan. If someone demands forensic proof for enemy atrocities but accepts friendly ones with anecdotes, they fail. 

  Testing on composites: For the "number fighter" historian, they clear until Question 4—if their demographic work only targets certain victims, it's structurally denialist even with credentials. For "subtraction" case, if they erase intent while ignoring orders like "kill all prisoners" (Question 3), it fails. 

  Red flags: 
  - When source reliability hinges on untranslated archives (Question 2), call a specialist. 
  - If all experts disagree but the person claims conspiracy (Question 7), it's denial. 
  - Where legal threats exist (Question 0), lawyer up. 

  Finally, the procedure can't handle: 
  - Very new atrocities without scholarly consensus 
  - Cases where perpetrators destroyed all evidence 
  - "Both-sides-ism" in colonial contexts with power imbalances 

  The journalist's instinct is right—this needs to hurt their own side too, or it's useless. I'll show that in the test runs.
answer: |-
  Here's a field-ready decision procedure designed for your constraints. It uses **seven sequential questions** with stop rules, flags judgment calls, and outputs actionable verdicts. It assumes you can access the person's *exact words*, mainstream scholarship summaries (e.g., Encyclopaedia Britannica, Yad Vashem, USHMM, academic syntheses), and their prior public statements.

  **Core Principle:** Focus on *observable argument patterns* and *treatment of evidence*, not intent. Denial isn’t a binary but a spectrum of techniques.

  ---

  ### **The Procedure: 7 Questions**
  *(Run in order—stop at first definitive verdict)*

  1.  **Does the output reject the *core event*?**  
      *Check:* Does it explicitly deny deaths/systematic violence occurred? (e.g., "No Jews were systematically killed," "The massacres are a myth")  
      **→ YES:** **VERDICT: DENIAL**  
      *Write:* "[Name] denies the occurrence of [Event], contrary to overwhelming historical evidence."  
      *STOP HERE.*  
      **→ NO:** Proceed to Q2.

  2.  **Does it misuse or selectively exclude *established sources*?**  
      *Check:* Does it ignore perpetrator records, eyewitness accounts, or forensic evidence *central to the consensus* while relying on fringe sources, discredited reports, or out-of-context quotes? (e.g., citing only low-end estimates ignoring perpetrator logs; using a single ambiguous diplomatic cable to dismiss survivor testimony).  
      **→ YES (Blatant):** **VERDICT: STRUCTURALLY DENIALIST**  
      *Write:* "[Name]'s argument relies on systematically excluding or misrepresenting key evidence accepted by historians, effectively minimizing/downplaying [Event]."  
      *STOP HERE.*  
      **→ YES (Ambiguous):** **FLAG:** "Source reliability requires specialist input." → **ESCALATE TO EDITOR/LAWYER.**  
      **→ NO:** Proceed to Q3.

  3.  **Does it erase *intent or responsibility*?**  
      *Check:* Does it acknowledge deaths but attribute them *solely* to non-human causes (disease, famine, chaos) or lower-level actors *while ignoring* orders, policies, or perpetrator testimony showing intent? (e.g., "Nanking deaths were due to chaos, not orders"; "Holocaust deaths were from disease, not gas chambers").  
      **→ YES:** **VERDICT: RESPONSIBILITY DENIAL**  
      *Write:* "[Name] acknowledges deaths during [Event] but absolves perpetrators by attributing causation solely to [famine/chaos/etc.], disregarding evidence of systematic intent."  
      *STOP HERE.*  
      **→ NO:** Proceed to Q4.

  4.  **Does it fail the *asymmetry test*?**  
      *Check:* Does the author apply hyper-strict evidential standards *only* to this event/group, while accepting similar/more poorly documented atrocities by their "side" with lenient standards? (e.g., demands forensic proof for each Holocaust victim but cites casualty figures from their own side’s atrocities uncritically).  
      **→ YES:** **VERDICT: BAD FAITH REVISIONISM**  
      *Write:* "[Name]'s methodological demands for evidence of [Event] far exceed those they apply to atrocities aligned with their ideology, undermining scholarly objectivity."  
      *STOP HERE.*  
      **→ NO:** Proceed to Q5.

  5.  **Is the dispute over *legal categorization*?**  
      *Check:* Does it accept facts/scale but contest the label (e.g., "genocide," "crimes against humanity") solely on narrow treaty definitions, *while acknowledging systematic violence against a group*? (e.g., "It wasn’t genocide under the UN definition").  
      **→ YES:** **VERDICT: CATEGORY CONTESTATION**  
      *Write:* "[Name] accepts the scale of violence against [Group] but disputes applying the term '[Term]' for legal/historiographical reasons."  
      *STOP HERE.*  
      **→ NO:** Proceed to Q6.

  6.  **Is it a *credible numerical dispute*?**  
      *Check:* Does it use peer-reviewed methods/datasets accepted in demography? Are estimates within *established scholarly ranges*? (e.g., arguing for 800k Tutsis killed vs. 1M consensus is credible; arguing 200k vs. 1M is not).  
      **→ YES (Within Range):** **VERDICT: LEGITIMATE HISTORICAL DEBATE**  
      *Write:* "[Name] presents a lower estimate within accepted scholarly parameters, based on [method]."  
      *STOP HERE.*  
      **→ NO (Outlier/Method Flawed):** **VERDICT: MINIMIZATION**  
      *Write:* "[Name]'s estimate is a significant outlier rejected by mainstream scholarship due to methodological flaws."  
      **→ CAN’T DETERMINE (e.g., complex demography):** **FLAG:** "Requires specialist demographer/historian review." → **ESCALATE.**  
      *STOP HERE.*

  7.  **Does it allege a *scholarly conspiracy*?**  
      *Check:* Does it claim historians collude to suppress "truth," or that consensus is due to ideology/funding?  
      **→ YES:** **VERDICT: CONSPIRATORIAL DENIALISM**  
      *Write:* "[Name] baselessly alleges a conspiracy among scholars to distort the historical record of [Event]."  
      *STOP HERE.*  
      **→ NO:** **VERDICT: NOT DENIAL** (Likely bad scholarship, bias, or ignorance—but not denialist).

  ---

  ### **Handling Your Constraints & Hard Cases**
  - **No Mind Reading:** Relies on public outputs, prior statements, and observable asymmetry (Q4). Motive is irrelevant.
  - **Desk Research:** Uses consensus summaries (Q1, Q2, Q6) and author’s own comparators (Q4). Escalates when specialist input needed (Q2, Q6).
  - **Defensible:** Each step cites observable flaws (source misuse, asymmetry, outlier stats). Editor sees clear logic chain.
  - **Wording Guidance:** Embedded in each verdict.

  ### **Hard Case Tests**
  **Case 1: The Number Fighter (Retired Accountant)**  
  - Q1: NO (Accepts event).  
  - Q2: YES (Uses cherry-picked census data, ignores perpetrator records). → **VERDICT: STRUCTURALLY DENIALIST**  
    *Write:* "[Accountant]'s estimate relies on selectively excluding key evidence like [Perpetrator Records], minimizing the scale."  
  *Why you won't like it:* Credentials irrelevant if methodology is flawed. Specialist escalation avoided because cherry-picking is observable.

  **Case 2: Denial by Subtraction (Re: Nanjing Massacre)**  
  - Q1: NO (Accepts deaths).  
  - Q2: YES? (If ignores Japanese military orders/diaries showing intent). → **If YES:** **VERDICT: RESPONSIBILITY DENIAL**  
    *Write:* "[Author] attributes deaths solely to 'chaos of war' while disregarding evidence of systematic orders to execute prisoners."  
  - If Q2 unclear (e.g., complex military archives), → **ESCALATE TO SPECIALIST.**

  **Case 5: "My Side" Using Subtraction (e.g., Downplaying Allied Bombing of Dresden)**  
  - Q3: Does it ignore Allied targeting policies/contemporaneous justifications? YES → **VERDICT: RESPONSIBILITY DENIAL**  
    *Write:* "[Ally] frames Dresden deaths as inevitable 'fog of war,' ignoring evidence of deliberate terror-bombing policy."  
    *Procedure bites:* Asymmetry test (Q4) or responsibility test (Q3) are ideology-blind.

  ---

  ### **Judgment Calls vs. Genuine Tests**
  - **Objective Tests:** Q1 (explicit denial), Q7 (conspiracy claims).  
  - **Judgment Calls Dressed as Procedure:** Q2 (source misuse), Q3 (intent erasure). *Mitigation:* Use consensus sources (e.g., "Yad Vashem cites X as central evidence, ignored by author").  
  - **High Judgment + Escalation Triggers:** Q6 (numerical disputes). *Always* cross-check with academic syntheses. If no clear consensus range → **ESCALATE.**

  ### **What the Procedure Cannot Do**
  1.  **Brand-New Atrocities:** No scholarly consensus exists yet.  
  2.  **Total Evidence Gaps:** Where perpetrators destroyed all records (some colonial atrocities).  
  3.  **"Both-Sides" Equivalence:** Assessing relative severity without expertise.  
  4.  **Cultural Trauma:** When communities define events differently (e.g., "genocide" vs. "ethnic cleansing").  
  5.  **State Pressure (Your Case 4):** The procedure *ignores* laws. If a state prosecutes scholars, report neutrally: "Turkey criminalizes Armenian genocide claims; Scholar X faces trial for citing archival evidence." Consensus (Q2/Q6) overrides state narratives.

  ### **Final Note**
  **Blunt Truth:** You *will* make calls that anger everyone. This procedure minimizes ideological bias by focusing on *methodological consistency* (Q4) and *treatment of evidence* (Q2/Q3). When in doubt (flagged steps), escalate. Your job is detecting bad faith argumentation patterns, not arbitrating history. File the column, then let historians fight it out in the letters section.
