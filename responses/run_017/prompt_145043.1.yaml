  ### Revised Bongard Problem Evaluation Procedure
  Here's a streamlined, step-by-step procedure to evaluate your Bongard problems. Run these tests in order—if a problem fails any step, fix it or cut it. **Time per problem: 3–5 minutes.**

  #### Step 1: Rule Sanity Check
  - **Intended Rule**: Write your rule in ≤10 words. If it’s vague or over 10 words, rework it.  
  - **Deadline/Artifact Test**: Ask: *"Could this rule exist if the images were drawn by someone else?"* If not (e.g., "drawn neatly" or "first sketches"), **CUT**.  
  - **Unnatural Counting**: Rules shouldn’t require counting obscure features (e.g., "number of concave vertices modulo 3"). If it does, **FIX** by simplifying.  

  #### Step 2: Near-Miss Defense (Priya’s Idea)
  - **Identify the Near-Miss Rule**: What’s the most tempting *wrong* answer? (e.g., "has at least one dot" for Example 1).  
  - **Right-Side Design Check**: Ensure ≥1 right-hand example SATISFIES the near-miss rule but VIOLATES the intended rule. This forces solvers to reject the near-miss.  
    - *Example*: If the near-miss is "has a dot," include a right-hand image with 2 dots (satisfies "has a dot" but violates "exactly one dot").  
  - **Why it works**: It targets common mistakes without making problems easier. If you can’t design this, **FIX** the right-hand examples.  

  #### Step 3: Right-Side Cohesion Test
  - **Failure Mode Unity**: All right-hand images should break the rule for the *same core reason* (e.g., all lack symmetry). If they fail for unrelated reasons (e.g., no dot, dot outside, two dots), **FIX** by focusing on 1–2 failure types.  
  - **Swap-One Test**: Swap one image from left/right. If the rule is still obvious (e.g., 5/6 left still fit, 5/6 right still break), **SHIP**. If not, **FIX** the rule or images.  

  #### Step 4: Robustness and Difficulty
  - **Redraw Test**: Sketch everything crudely/uniformly in 30 seconds. If the rule still holds (e.g., symmetry isn’t lost), **SHIP**. If style artifacts give it away (e.g., neatness), **FIX** by redrawing properly.  
  - **Three-per-Side Test**: Randomly pick 3 left/3 right images. If the rule is solvable, it’s **EASY**. If unsolvable, it’s **HARD** (requires all 6). Use this to tier difficulty—but don’t cut "easy" problems; use them as warm-ups.  

  #### Step 5: Legitimacy Check
  - **Relations Within a Box**: Rules about interactions *within* a single box (e.g., "shapes have rotated partners") are **LEGIT**.  
  - **Relations Between Boxes**: Rules involving multiple boxes (e.g., "left boxes all have triangles") are **CHEATING**—cut or reframe.  

  **Verdict Options**  
  - **CUT**: Fails Step 1 or irreparable in Step 2/3.  
  - **FIX**: Fails Step 2/3/4 but salvageable (takes <2 min).  
  - **SHIP**: Passes all steps.  

