answer: |-
  **CRANE/SKYHOOK REVIEW PROTOCOL (FORM CSRP-4)**

  **1. Crane Adequacy (0-3 points)**
  *   **Definition:** Evaluates the presence and functionality of a proposed explanatory mechanism. A Crane must demonstrate a plausible, stepwise process grounded in established lower-level principles or empirically supported mechanisms. Points awarded for clarity of the lifting mechanism and explicit connection to the foundational layer.
  *   **Sample Comment:** "Proposal outlines a feasible neurocomputational algorithm (Crane) for value-representation, leveraging known synaptic plasticity mechanisms. +3 pts." OR "Mechanism for collective agency relies on vague 'social forces'; no identifiable Crane lifting from individual behaviors. 0 pts."

  **2. Skyhook Detection (0-3 points)**
  *   **Definition:** Identifies an appeal to an unexplained explanatory principle posited at the target level of analysis. A Skyhook lacks demonstrable machinery to lift it from lower levels, appearing as a *deus ex machina* or brute fact. Points *deducted* based on severity: Minor (-1), Significant (-2), Fatal Flaw (-3).
  *   **Sample Comment:** "Postulating 'fundamental consciousness particles' as the basis of mind constitutes an ungrounded Skyhook. -3 pts." OR "Invoking 'irreducible group intentionality' without specification of Crane mechanism risks Skyhook (-2 pts)."

  **3. Reductionist Integrity (0-2 points)**
  *   **Definition:** Assesses whether a proposed lower-level Crane mechanism adequately accounts for the target phenomenon without eliminating its essential characteristics (Greedy Reductionism). Points awarded if the reduction preserves the phenomenon's functional role and avoids dismissing it as illusory or epiphenomenal.
  *   **Sample Comment:** "Attempts to reduce moral reasoning solely to amygdala activation appear Greedy, failing to capture normative structure. 0 pts." OR "Reducing decision-making to reinforcement learning circuits preserves key functional aspects without Greedy dismissal. +2 pts."

  **4. Emergence Validation (0-2 points)**
  *   **Definition:** Evaluates claims of novel properties arising from component interactions. Points awarded only if the emergent property is clearly defined, its causal powers demonstrably irreducible (non-summative) to component powers *in the specific context*, *and* a Crane mechanism for its generation is provided. Mere labeling as "emergent" is insufficient.
  *   **Sample Comment:** "Claims 'sui generis social norms' emerge but provides no Crane for their generation or demonstration of irreducible causal efficacy; risks reintroducing Skyhook at collective level. 0 pts." OR "Models norm emergence via agent-based simulation (Crane), demonstrating stable, irreducible coordination patterns. +2 pts."

  **5. Regress Containment (0-3 points)**
  *   **Definition:** Evaluates the proposal's handling of the grounding chain. Points awarded for explicit acknowledgment of the potential regress and a justified, non-arbitrary stopping point. The chosen foundation must be demonstrably more stable/established than the phenomenon it grounds. Declaring a brute fact without justification incurs penalties.
  *   **Sample Comment:** "Stopping regress at 'basic physical laws' is standard but undeclared; lacks justification for *this* level vs. deeper. +1 pt." OR "Arbitrarily halts explanatory chain at 'evolved modules' without demonstrating why *these* modules require no further Crane, resembling a Skyhook (-1 pt)."

  **6. Interdisciplinary Translation Factor (Multiplier: 0.5x - 2.0x)**
  *   **Definition:** Adjusts scores from Criteria 1-5 based on field context. Proposals importing Cranes from well-established fields into novel domains receive a boost (up to 2.0x) reflecting established design work. Proposals applying familiar Cranes within their native field, or novel Cranes in any field, receive a neutral (1.0x) multiplier. Proposals misapplying a field's Crane as a Skyhook in another context may be penalized (down to 0.5x).
  *   **Sample Comment:** "Applying established evolutionary game theory (Field A Crane) to novel problem in Field B warrants 1.8x multiplier." OR "Using quantum coherence (Field X Crane) as unexplained Skyhook for cognition (Field Y) incurs 0.6x penalty."

  **7. Resolution Threshold (Pass/Fail)**
  *   **Definition:** The proposal fails if the Final Score (sum of 1-5, multiplied by 6) is ≤ 5 OR if it incurs a -3 Skyhook deduction regardless of other scores. A Skyhook deduction of -3 indicates a Fatal Flaw.
  *   **Sample Comment:** "Final Score: 8. Pass." OR "Skyhook Detection: -3 (Fatal Flaw). Fail."

  **Appeals**

  Appeals alleging misapplication of CSRP-4 criteria must be submitted in writing to the Panel Chair within ten business days of notification. Appeals must specify the disputed criterion and provide evidence that the reviewer either: a) Demonstrably misunderstood the proposal's stated mechanism, or b) Applied the criterion in a manner inconsistent with prior Panel rulings for analogous mechanisms. Appeals based solely on philosophical disagreement with the Crane/Skyhook framework, or arguing the inherent impossibility of satisfying all criteria simultaneously (e.g., Regress Containment vs. Crane Adequacy), are inadmissible. The Panel Chair may convene an ad-hoc subcommittee to review the appeal against the existing protocol; no revisions to CSRP-4 definitions or scoring ranges are permitted during the current funding cycle. The subcommittee's determination of proper procedural application is final.
