answer: |-
  Below is a disambiguation of "conventions are arbitrary" structured according to your requested dimensions, followed by analyses of the two moves, probe cases, and your proposed partition. All readings assume the **Lewis-Schelling tradition** of conventions as solutions to recurrent coordination problems with multiple equilibria.

  ---

  ### **Table: Disambiguating "Conventions are Arbitrary"**

  | **Reading** | **What is Arbitrary?** | **Sense of "Arbitrary"** | **Scope** | **Verdict** | **Supports Move 1?** | **Supports Move 2?** |
  |-------------|------------------------|--------------------------|-----------|-------------|----------------------|----------------------|
  | **1A** | Content of the regularity | Substitutable by an alternative serving *the same purpose* equally well | All conventions | Platitude ✓ | **Weakly** (if "purpose" ignores distribution; else false) | **No** (ignores path dependence) |
  | **1B** | Selection of this regularity | No *sufficient reason* for choosing *this option* over alternatives | Pure coordination conventions | Substantive ✓ | **Yes** (but ignores unfairness) | **Partially** (if expectations shift abruptly) |
  | **1C** | Agents' reason for complying | Compliance is *only* driven by expectations of others' compliance | All conventions | Substantive ✓ | **No** (reasons ≠ justification) | **Strongly ✓** (core of Move 2) |
  | **1D** | Causal history | Selection was *capricious/unplanned* | Accreted conventions | Often false ✗ | **Irrelevant** | **No** |
  | **1E** | Susceptibility to replacement | Can be *deliberately changed* if expectations shift | All conventions | Platitude ✓ | **No** | **Strongly ✓** (if revisability = fragility) |
  | **2A** | Content | *No independent reason* supports it | Pure coordination conventions | Substantive ✓ | **Strongly ✓** (if "independent" = moral) | **No** |
  | **2B** | Content | *Morally inert* (no inherent moral weight) | All conventions | Platitude ✓ | **Strongly ✓** (but conflates inertness with immunity) | **No** |
  | **2C** | Selection | *Epistemically ungrounded* (no fact of the matter) | All conventions | False ✗ | **No** | **No** |
  | **2D** | Entire convention | *"Up to us"* (collectively malleable) | All conventions | Substantive ✓ | **No** | **Strongly ✓** |

  ✓ = Survives scrutiny | ✗ = Straightforwardly false  
  **Move 1**: "No criticism possible due to arbitrariness."  
  **Move 2**: "Convention dissolves if public expectations shift."

  ---

  ### **Analysis of the Two Moves**
  - **Move 1 (Immunity to Criticism)**:  
    Only works under readings that conflate **functional equivalence** (1A) or **moral inertness** (2B) with *normative immunity*. This is invalid: a convention can be arbitrary in origin (1B) or substitutable (1A) yet *embed unfairness* (e.g., burdening a subgroup). Arbitrariness does not entail that all outcomes are equally just; it merely means the *coordination function* could be served otherwise. Readings like 2A (no independent reason) support Move 1 only by assuming unfairness is not an "independent reason" – a substantive (and questionable) moral claim.  
    *Verdict*: Move 1 is unsound unless arbitrariness is misapplied to dismiss embedded values.  

  - **Move 2 (Dissolution via Expectation Shifts)**:  
    Depends on **revisability** (1E) or **compliance solely via expectations** (1C). However, expectations are not always sufficient: conventions may persist due to *sunk costs*, *moralization*, or *institutionalisation* (e.g., "keep left" with fire exits). Reading 1C ignores that compliance can have *additional grounds* (e.g., safety in the corridor probe). Move 2 holds only for "pure" conventions with no salient alternatives or collateral stakes.  
    *Verdict*: Move 2 is overstated; path dependence limits revisability.

  ---

  ### **Probe Cases**
  - **(a) Broken Microscope "Convention"**:  
    - **Problem for**: Readings requiring *current substitutability* (1A) or *no independent reason* (2A).  
    - **Defence**: Still a convention if agents *believe* alternatives exist (e.g., they don’t know the lamp is broken) or if the regularity persists *as if* substitutable.  
    - **Verdict**: Counters strong substitutability claims (1A/2A), but not broader definitions.  

  - **(b) Corridor with Safer Right-Hand Side**:  
    - **Problem for**: Readings claiming *no independent reason* (2A) or *compliance solely via expectations* (1C). Safety provides a reason beyond expectations.  
    - **Defence**: Still a convention if safety is insufficient to override coordination (e.g., everyone expects left-keeping).  
    - **Verdict**: Challenges 1C and 2A; shows conventions can have "content" (e.g., safety trade-offs).  

  Both probes highlight that conventions exist on a spectrum from "pure" (arbitrary) to "impure" (salient alternatives/reasons). Denying convention-status to these cases is an *oddity of inflexible definitions*, not the examples.

  ---

  ### **Your Three-Way Partition: Content vs. Selection vs. Revisability**
  - **Content-Arbitrariness**: Whether *what is prescribed* (e.g., "drive left") lacks intrinsic merit.  
  - **Selection-Arbitrariness**: Whether *historical adoption* was undetermined/accidental.  
  - **Revisability**: Whether *current replacement* is feasible via coordinated action.  
  **Verdict**: This **cuts at the joints** but requires two clarifications:  
    1. **Temporal Asymmetry**: Selection-arbitrariness concerns the *past* (could another regularity have been adopted?), while revisability concerns the *future* (can we adopt one now?). As you note, these diverge: a convention arbitrarily selected (e.g., QWERTY keyboards) may now be costly to revise.  
    2. **Dependence**: Content-arbitrariness often enables revisability (if no reason to prefer *this* content, change is easier). However, selection-arbitrariness does not guarantee revisability (e.g., entrenched inequalities).  
  **Conclusion**: Your partition is sound, but emphasize that selection-arbitrariness ≠ revisability due to *increasing returns* (e.g., network effects).

  ---

  ### **Summary Recommendations for Your Paper**
  - **Against Move 1**: Reject readings that equate functional substitutability (1A) or moral inertness (2B) with *normative immunity*. Conventions can be arbitrary yet criticisable for distributive effects.  
  - **Against Move 2**: Stress that expectations alone sustain conventions only when no *salient alternatives* or *collateral reasons* exist (e.g., the corridor case).  
  - **Refine "Arbitrary"**: Specify *which aspect* (content/selection/revisability) and *in what sense* (substitutability/lack of reason). The microscope and corridor probes expose overly narrow definitions.  
  - **Use Your Partition**: It elegantly separates key dimensions – but explicitly address the past/future tension in selection vs. revisability.

  This framework should help dissect premature invocations of "arbitrary" and advance your paper’s core argument about norm persistence.
