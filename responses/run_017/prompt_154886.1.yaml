answer: |-
  Here is the complete exam package addressing your requirements, designed to push students beyond standard arguments while engaging with neuroanatomy's contested moral role:

  ### Exam Question (as it would appear)
  **Section B: Moral Status and Neuroanatomy (Answer ONE Question)**  
  **Question 5.**  
  “Brain size (or related neuroanatomical quantities like neuron count) is either morally irrelevant or merely a fallible proxy for psychological capacities. Anatomy itself cannot *constitute* moral standing.”  
  Critically evaluate this claim using **both** of the following test cases:  
  (i) The observation that a typical human infant and a human adult with advanced dementia may share similar total neuron counts despite radically divergent cognitive and relational capacities;  
  (ii) The prospect of artificial systems whose “brain analogue” (e.g., parameter count, training compute) lacks any evolutionary or behavioral link to familiar forms of cognition.  

  In your response, address:  
  - Whether neuroanatomical quantities could play distinct roles in assessments of moral *patiency* (e.g., rights, considerability) versus moral *agency* (e.g., responsibility, blame);  
  - How rejecting anatomy-based criteria might relocate, rather than resolve, challenges in defining morally relevant capacities.

  ---

  ### Model Answer (Approx. 700 words)  
  The claim that neuroanatomical quantities are either irrelevant or purely evidential proxies for morally significant capacities faces unresolved tensions when confronted with hard cases. While psychological capacities (e.g., sentience, agency) are widely regarded as foundational for moral status, the role of anatomy remains contested—not because it directly grounds standing, but because it interacts complexly with capacity-based frameworks in both practical and theoretical dimensions.  

  **Test Case (i): Dementia vs. Infancy** exposes a critical flaw in treating neuron count as a *constitutive* basis for moral status. If two entities with comparable neuron counts (an infant with developmental potential and a dementia patient experiencing capacity erosion) warrant different moral considerations—as our intuitions suggest—then anatomy alone cannot determine standing. This supports the claim that psychological capacities (e.g., current pain perception, relational reciprocity) are primary. However, it also reveals anatomy’s *evidential* limitations: neuron count poorly tracks the very capacities it purportedly proxies. This problem extends to encephalization quotients or cortical neuron counts, as such metrics may not correlate reliably with morally salient experiences in neurodiverse or damaged brains. Here, anatomy fails as both a constitutive foundation *and* a reliable indicator.  

  **Test Case (ii): Artificial Systems** challenges the proxy argument differently. When evaluating an AI system with high parameter counts but no biological or behavioral history, anatomy-like metrics (e.g., training compute) become unavoidable yet uncalibrated proxies. Without capacity-based behavioral evidence (e.g., does it *truly* feel or intend?), we confront a dilemma: either reject anatomy-alike metrics entirely (risking moral disengagement from potentially sentient entities) or grant them provisional weight (risking false positives). This highlights a deeper issue: **rejecting neuroanatomy relocates arbitrariness** to the selection and measurement of capacities. Disputes persist over *which* capacities matter (is sentience sufficient? Must there be self-awareness?), and whether thresholds should be absolute or scalar—questions anatomy was (imperfectly) deployed to avoid.  

  Crucially, neuroanatomy may play *asymmetric roles* in patiency versus agency. For moral patiency (e.g., the right not to suffer), brain metrics are weak proxies at best, given case (i). Sentience—a minimally contested basis for patiency—remains ambiguously linked to anatomy; for instance, debates continue over whether cephalopod brains, despite structural differences, support morally relevant sentience. Conversely, for agency and responsibility, neuroanatomy may hold indirect relevance. In humans, neurodevelopmental data or brain injuries may inform judgments of *culpability* (e.g., reduced responsibility due to prefrontal cortex damage). For AIs, parameter scale might partially constitute functional agency (e.g., the ability to model consequences), though this remains **[Contested Premise]**.  

  Policy and law further complicate this. Societies routinely rely on imperfect proxies (e.g., age for competence) where direct capacity assessment is impractical. Some argue **[Contested Premise]** that neuroanatomical thresholds (e.g., for neuron density in animal welfare laws) are legitimate despite known edge cases, given administrative necessity. Critics see this as unjust speciesism or biochauvinism.  

  **Conclusion**: The claim is defensible but incomplete. Anatomy is neither constitutive nor reliably evidential for patiency, as cases (i) and (ii) demonstrate. However, dismissing anatomy shifts arbitrariness to capacity selection without resolving it. Moreover, in agency assessments—especially for artificial or impaired entities—anatomical proxies may retain pragmatic or constitutive roles. Ultimately, the irreducibility of moral tensions is exposed, not resolved, by rejecting neuroanatomy.  

  *(Word count: 698)*  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Must-hit moves (5 marks each):**  

  1. **Contrast dementia-infant anatomy/capacity misalignment**  
     - *Full marks:* Uses case to show neuron count ≠ capacity, undermining anatomy as proxy/constitutive factor.  
     - *Common error:* Only discusses dementia *or* infancy; fails to contrast identical anatomy with divergent moral intuitions.  

  2. **AI test case: Anatomy without capacity calibration**  
     - *Full marks:* Argues that lacking behavioral baselines makes anatomy-like metrics unavoidable yet unreliable proxies, creating a dilemma.  
     - *Common error:* Assumes AI anatomy directly parallels biological brains without addressing calibration challenges.  

  3. **Distinguish patiency vs. agency roles**  
     - *Full marks:* Anatomy rejected for patiency (rights/suffering) but tentatively retained for agency (responsibility), e.g., via neurodevelopmental data.  
     - *Common error:* Treats moral status monolithically; ignores that agency assessments may use anatomy differently.  

  4. **Identify arbitrariness relocation**  
     - *Full marks:* Notes that rejecting anatomy moves arbitrariness to defining capacities (e.g., why sentience over autonomy?).  
     - *Common error:* Claims capacity-based criteria resolve all problems; ignores contested thresholds.  

  5. **Acknowledge key contested premises**  
     - *Full marks:* Flags ≥2 disputed issues (e.g., sentience sufficiency, proxy legitimacy) *without* presenting as consensus.  
     - *Common error:* Assumes uncontested premises (e.g., "sentience is clearly sufficient for rights") without justification.  

  **A/B Boundary Deciders:**  
  - **B to A-:** Hits moves 1–4 competently but misses nuance in relocation/patiency-agency split.  
  - **A- to A+:** Explicitly argues that capacity frameworks inherit anatomy’s arbitrariness problem *and* sharply distinguishes patiency/agency implications.  

  **Deductions:**  
  - -1 to -3 per move: Partial/incomplete treatment of required element.  
  - -2 per contested premise: Presented as consensus without flagging.  
  - Off-topic or reciting marginal cases/speciesism without engaging test cases: Max 15/25.  

  ---  
  This package forces engagement with your target issues while maintaining philosophical rigor. The model answer demonstrates handling contestation appropriately, and the marking scheme rewards distinguishing patiency/agency and recognizing relocated arbitrariness—key to surpassing the A/B threshold.
