  ### Poem: Three Stances for a Glass of Water  

  **PHYSICAL STANCE**  
  Electrons swarm in neural nets, synapses flare and twist,  
  hydrogen bonds in muscle fibers contract, a fist  
  extends through air, displacing molecules in paths unseen,  
  as tendons curl around a cylinder of glass, cool and clean.  

  **DESIGN STANCE**  
  A hand, shaped by evolution, lifts  
  to hydrate the body, guided by scripts  
  of thirst and function: vessel meets need.  
  The motion unfolds, a programmed deed.  

  **INTENTIONAL STANCE**  
  She wants  
  the water.  
  Reaches, grasps—  
  thirst solved.  

  **REAL PATTERNS**  
  Not atoms added, nor mind’s ghostly trace—  
  just compression’s gift: truth in time and space.  

  ---

  ### Handout: Dennett’s Stances & Real Patterns  
  **Context for the Poem**  
  This poem illustrates Daniel Dennett’s three stances (*physical, design, intentional*) and his "real patterns" criterion from "Real Patterns" (1991). The event—a person reaching for water—is described three times, with line lengths mirroring **compression**:  
  - **Physical Stance** (Lines 1–4): Overlong, dense lines detail microphysical processes (e.g., electrons, molecules). Like a "bit map," this is costly: precise but inefficient for prediction.  
  - **Design Stance** (Lines 5–8): Shorter lines abstract to function (e.g., evolution, hydration). A compressed "design description" ignores physics for teleology.  
  - **Intentional Stance** (Lines 9–12): Shortest lines attribute beliefs/desires (e.g., "She wants the water"). Maximally compressed; treats the system as an agent.  

  **The Turn** (Line 12 onward): The intentional stance isn’t a "lazy placeholder"—it’s **cheaper to compute** and equally predictive. "She wants the water" isn’t false reduction; it’s adaptive compression.  

  **Final Couplet & Real Patterns**  
  Dennett’s criterion: A pattern is real if describing it compresses data better than listing every physical detail. Here:  
  - **Real, not extra stuff**: "Thirst" isn’t a new substance—it’s a pattern emerging from physics.  
  - **Not merely subjective**: Compression is objective *relative to a predictor*. Limited minds (like ours!) need efficiency.  
  - **Why lines shorten**: Predictive power grows as description costs less (shorter lines = fewer computational resources).  

  **Seminar Closing**  
  This embodies Dennett’s view: **Minds are real patterns**—not because they defy physics, but because compressing physics into "wanting" or "believing" is what lets us navigate the world. Prediction, not ontology, grounds reality.  

  ---  
  *Poem note: Syllable counts per stance—Physical: 18–22, Design: 8–10, Intentional: 1–4—visually enact compression. The ordinary event (reaching for water) avoids technical jargon, emphasizing how stances shape everyday understanding.*
