prompt: |-
  I want a stress test of a position I keep defending in arguments about long-term policy — climate mitigation, pandemic preparedness, risks from new technologies. Call it Temporal Neutrality, and let me state it in two parts so that you can attack the seams.

  First, the neutrality claim: the date at which a given person's well-being occurs is not in itself a reason to count that well-being for less. A positive pure rate of social time preference — the delta term in the familiar Ramsey-style decomposition of the social discount rate into a pure-preference term, a growth term, and a curvature term — strikes me as having the same status as a discount rate that varied with the recipient's birth cohort: not a parameter to be estimated but a claim in need of a defense, and the defenses of it that I've encountered seem to me to smuggle in something else.

  Second, the contingency claim: neutrality does not entail a zero discount rate. Future benefits may never be received — the recipients may never exist, the institution or ecosystem that delivers the benefit may not persist, the project may be abandoned or reversed, the civilization may not survive. All of that licenses discounting, but only as expected-value discounting on the probability that the benefit is actually realized and actually lands on somebody. This is also, as I understand it, why the effective social discount rate should decline with the horizon rather than stay flat: if you are uncertain about the hazard rate at which benefits get interrupted, then the survival curve you get by averaging over the possible rates has a hazard that falls over time, so the further out you look, the lower the rate you should apply at the margin.

  What I want from you is a map of the exposure of this position, not a survey of the literature and not a list of things to read.

  Which considerations — arguments, formal results, empirical findings, implications I would find unacceptable — should move me, and which are merely awkward? Rank them from fatal to cosmetic. For each, say whether a defender of the position should concede that it counts against them or can reasonably dismiss it. I don't want a catalogue of objections that only converts people who already disagree with me.

  Three candidate defeaters I want taken seriously. One: I've been pointed to an old impossibility result, which I think is associated with the name Diamond, about ranking infinite streams of well-being, and told that it sinks any form of temporal neutrality. I cannot reconstruct the argument and I may have the attribution wrong; reconstruct it if you can, and tell me whether it tells against neutrality itself or only against a particular way of aggregating that I could give up while keeping neutrality. Two: the non-identity thought — for most long-term policies, who exists later depends on what we do now, so there may be no fixed future people whose later well-being I am urging you to weight equally. Does that go to the heart of the neutrality claim, or only to the applications I care about? Three: the claim that location within a life matters non-instrumentally, that some goods are worth more for arriving at a certain stage of a life and that the shape of a life is partly constitutive of a person's good. If that is right, then a single person's well-being may not be a date-neutral sum in the first place, and the neutrality claim fails before we ever reach policy. This is the objection I find hardest and I am not sure I can answer it.

  Then be honest about insulation. My worry is that the contingency claim is too accommodating: because some contingency story is always available, any observed discount rate can be retro-fitted with a hazard rate, and the position may predict nothing and risk nothing. If it has been qualified into unfalsifiability, say so, and say whether that is a defect in a normative claim of this kind or only what one should expect from one. If it does risk something, tell me precisely what observation or argument would make me abandon it. A test case, if it helps: spending a small fraction of current consumption now to avert a much larger consumption loss two centuries out, where there is a real chance the institutions needed to deliver the benefit will not last that long. If the position cannot yield a verdict there without my supplying further judgments, that is itself worth knowing.

  Mark your own confidence: distinguish what is standard in welfare economics from what you are reconstructing from my half-remembered description, and from what you are speculating about. If the two parts of the position do not fit together, or if my framing rests on a confused premise — if the distinction between pure and contingency discounting cannot bear the weight I put on it, or if declining rates do not follow from what I said — say that plainly instead of working politely inside my terms. I would rather be corrected than agreed with. Please answer in American English.
reasoning: |-
  Alright, let me start by unpacking the user's query. They're defending Temporal Neutrality in long-term policy arguments and want me to stress-test it. The position has two parts: neutrality (no discounting based on time alone) and contingency (discounting only for risks like project failure). They mention three specific defeaters: Diamond's impossibility result, non-identity problem, and life-stage relativity of goods.

  First, I need to understand each component deeply. The neutrality claim rejects pure time preference, similar to rejecting discrimination based on birth cohort. The contingency claim allows discounting for survival probabilities, leading to declining discount rates. The user is concerned about unfalsifiability here—any observed discount rate could be explained by adjusting hazard rates.

  For the defeaters, Diamond's theorem is key. I recall it shows that with infinite time horizons, no social welfare function can satisfy all desirable axioms. But does this directly challenge neutrality? I think neutrality might still hold if we avoid infinite streams or use partial orderings. I should explain why this is more of a technical obstacle than a fatal flaw.

  The non-identity problem is tricky. Future people's existence depends on current policies, so whose welfare are we discounting? But the user might counter that we can still consider potential persons or general trajectories. This seems like an application issue, not a core challenge to neutrality.

  Life-stage relativity is the toughest. If a person's well-being isn't additive across time stages, then temporal neutrality might not apply at the individual level. The user admits this is hard. I need to clarify that neutrality between lives isn't invalidated, but it complicates aggregating within a life. Maybe they can bite the bullet here.

  Unfalsifiability is a real concern. If hazard rates can always be adjusted to fit any discount rate, the theory isn't testable. But normative claims don't need falsifiability like scientific ones. The test case with a 200-year investment is telling. If the model requires exogenous judgments on hazard rates, that's a weakness in practice, but not necessarily in principle.

  The user's deeper needs seem to be about robustness. They want to know if their position holds under scrutiny or if they're missing critical flaws. They might be preparing for debates or policy proposals, so they need strong counterarguments preempted. Their focus on ranking objections from fatal to cosmetic shows they prioritize which battles to fight.

  Also, they value clarity over agreement. They mentioned preferring correction over politeness. So I should be blunt where necessary, especially on the life-stage issue and unfalsifiability. Confidence markers are crucial—distinguishing established economics from my reconstructions.

  Finally, ensuring the two parts cohere. The neutrality claim sets the ethical stance, contingency handles empirical uncertainty. They fit if we see hazard rates as capturing risks, not time preference. But the dependency on hazard models might be a practical seam worth noting.
answer: |-
  Here’s a stress test of Temporal Neutrality, structured by objection severity (fatal → cosmetic), with defenses, concessions, and insulation analysis. Confidence markers:  
  **[✓]** = Standard welfare economics | **[$]** = Reconstructed from your description | **[?]** = Speculative  

  ---

  ### **Fatal Objections (If Unaddressed)**  
  1. **Life-Stage Relativity of Well-Being**  
     - **Objection**: If a person’s good depends non-instrumentally on the *timing* of benefits within their life (e.g., health at 20 vs. 80), "well-being" isn’t a date-neutral sum. Neutrality fails *before* intertemporal aggregation.  
     - **Strength**: Fatal to neutrality’s foundation. Empirical psychology suggests people intrinsically value life-shape (e.g., rising trajectories).  
     - **Defense**: Concede this wounds *individual-level* neutrality but doesn’t kill *interpersonal* neutrality. Policy can still weight different people’s welfare equally across time.  
     - **Your Burden**: Either show life-stage timing is instrumental (e.g., early health enables later flourishing) or retreat to interpersonal neutrality only. **[?]**  

  ---

  ### **Serious Objections (Threaten Practical Coherence)**  
  2. **Non-Identity Problem**  
     - **Objection**: Future people’s existence depends on current policies. "Weighting equally" lacks a fixed subject—you’re comparing welfare of *different possible populations*.  
     - **Strength**: Undermines direct application to climate/tech policy. No "future person" is deprived if not born; neutrality can’t easily condemn choices that create different (happier) future people at lower population sizes.  
     - **Defense**: Shift to *general trajectories*: discount only survival probabilities (contingency), but treat *conditional* welfare streams neutrally ("if group X exists, weight equally").  
     - **Concession**: Forces neutrality into a "person-affecting" limbo. You must endorse *impersonal* comparisons (e.g., "more total flourishing is better"). **[✓]**  

  3. **Contingency Claim Unfalsifiability**  
     - **Objection**: Any positive discount rate can be retrofitted to *some* hazard function. Your position risks being vacuous—it "predicts" declining rates but can rationalize *any* rate curve with ad hoc hazards.  
     - **Test Case**: Spending 0.1% GDP now to avert 100% GDP loss in 200 years. You *must* supply:  
       - A model of institutional survival (e.g., hazard rates for governance collapse).  
       - A normative choice: whether to count *potential* beneficiaries who might not exist.  
     - **Strength**: Exposes the position as non-prescriptive without exogenous inputs.  
     - **Defense**: Concede it’s *structurally* unfalsifiable (like utilitarianism) but demand *empirically grounded* hazard models (e.g., climate TPs calibrated to historical state longevity).  
     - **What Would Kill It**: Proof that *no plausible hazard function* can justify observed market discount rates. **[?]**  

  ---

  ### **Technical Objections (Limits Scope, Not Core)**  
  4. **Diamond’s Impossibility Theorem**  
     - **Result**: With infinite time horizons and Pareto + Anonymity axioms, no complete social ordering exists.  
     - **Target**: Infinite-horizon neutrality (e.g., weighting all generations equally).  
     - **Strength**: Forces you to abandon completeness (accept "incomplete" orderings) or Anonymity (e.g., a "veil of ignorance" aggregation).  
     - **Defense**: Irrelevant to finite-horizon policy (e.g., 200-year climate models). Or use overtaking criteria (e.g., treat streams as equal if eventually identical).  
     - **Concession**: Sinks *strong* neutrality for infinite futures. Retreat to: "For all finite T, weight equally up to T." **[✓]**  

  ---

  ### **Awkward Implications (Not Fatal)**  
  5. **Growth-Term Discounting as Covert Neutrality**  
     - **Objection**: The Ramsey growth term (η⋅g) assumes rich future generations need less marginal utility—but if η>0, this *is* time discounting (weighting future utility less).  
     - **Defense**: Growth discounting is *contingent*: if growth stalls, discounting falls. Pure time preference (δ) is ethically distinct.  
     - **Awkwardness**: In practice, η⋅g dominates discount rates. Your "neutrality" still accepts heavy discounting if growth is high. **[✓]**  

  6. **Declining Rates ≠ Temporal Neutrality**  
     - **Objection**: Declining rates often arise from *non*-neutral models (e.g., uncertainty over *future δ*).  
     - **Defense**: Your declining rates stem from *survival uncertainty*—a contingency argument. But empirically, it’s hard to distinguish from alternatives.  
     - **Cosmetic Fix**: Reframe declining rates as a *symptom* of contingency, not core to neutrality. **[✓]**  

  ---

  ### **Insulation Report**  
  - **Contingency Claim’s Weakness**: It *is* accommodating—but **not fatally so**. It risks vacuity if hazard models are arbitrary, but demands:  
    - **Empirical discipline**: Hazard functions must be grounded (e.g., institutional decay data).  
    - **Testable Implication**: Projects with identical survival probabilities *must* use identical discounting.  
  - **What Would Force Abandonment**:  
    - Proof that *all* reasonable hazard models imply discount rates ethically indistinguishable from δ>0 (e.g., "benefit interruption" always correlates with calendar time).  
    - The life-stage objection succeeding + proving interpersonal neutrality incoherent.  
  - **Coherence Check**: Neutrality and contingency **fit together** if:  
    - Neutrality sets the *normative benchmark* (no date-based bias).  
    - Contingency handles *epistemic constraints* (risk of non-realization).  
    - **Seam Issue**: You still need a theory for *within-life* aggregation (Objection 1).  

  ---

  ### **Bottom Line**  
  - **Fatal If True**: Life-stage relativity.  
  - **Forces Retreat**: Non-identity (to impersonal welfare), Diamond (to finite horizons).  
  - **Demands Careful Defense**: Contingency’s empirical grounding.  
  - **Tolerable Awkwardness**: Explaining why growth discounting isn’t temporal bias.  

  **Your strongest shield**: Focus on policy-relevant timeframes (≤300 yrs) and stress that *any* non-zero discount rate requires justification—shifting the burden to opponents. Your position’s core virtue is ethical parsimony: discount only for *risk*, not time.
