prompt: |-
  I teach a graduate seminar in the philosophy of biology, and I am marking this term's midterm anonymously. Before I settle on a mark for one script I would like an independent assessment: I have read it twice now and my sense of it shifted between readings, which usually means I am either being too generous or too harsh in one place and I cannot see which. Below is the question exactly as it was printed, followed by one candidate's answer, reproduced verbatim apart from the removal of identifying marks. I am not going to tell you what I am inclined to award.

  QUESTION 3 (25 marks; suggested time 40 minutes)

  Distinguish the etiological (selected-effect) account of biological function associated with Larry Wright and Ruth Millikan from the causal-role account defended in Cummins's 1975 paper, and assess the following thesis:

  (T) If function ascriptions are to do explanatory work in contemporary biology, function must be a property a trait has in virtue of its current causal organization within a containing system, and not in virtue of its history.

  Your answer should: (a) state what each account takes a function to be, and what explanatory work it takes function ascriptions to do; (b) discuss at least one case that discriminates between the two accounts; (c) explain what each account can say about malfunction, and say why the capacity to handle malfunction is thought to matter; and (d) assess the suggestion, raised in seminar, that the two accounts are not rivals at all but answers to different questions — stating how that suggestion would reframe the dispute and what it would cost either side to accept it.

  Candidates are invited to draw on either or both of the following cases, neither of which was discussed in the seminar.

  Case A. A synthetic-biology group assembles a bacterial cell whose genome is chemically synthesized rather than inherited. Into its membrane they insert a transporter of a kind found nowhere in nature, which moves a particular sugar into the cell. They put it there because they want the cell to grow on that sugar, and they then propagate the lineage for many thousands of generations in a medium where that sugar is the sole carbon source.

  Case B. In a lineage of soil bacteria, a gene coding for an enzyme that hydrolyses a common sugar is duplicated. The product of the duplicate, as a by-product of its altered molecular shape, also cleaves a synthetic antibiotic that has been present in the soil for roughly two centuries. Cells carrying the duplicate have spread through the population. Population-genetic work suggests that the spread was very nearly neutral for the first several hundred generations after the antibiotic appeared, and became selection-driven only about fifty generations ago, when the ambient concentration rose. Practitioners who study the population now routinely describe the enzyme as functioning to confer antibiotic resistance.

  STUDENT ANSWER

  The etiological and the causal-role accounts disagree about whether function is a historical property or a current one. On the etiological (selected-effect) account associated with Wright and Millikan, a trait's function is the effect for which tokens of that trait were selected: the heart functions to pump blood because pumping blood is why hearts were favoured by natural selection. Function is thus a relational, backward-looking property, and two organisms that are molecule-for-molecule identical at a time can differ in function if their causal histories differ. On Cummins's causal-role account, by contrast, to ascribe a function to a part is to identify the contribution it makes to some capacity of a containing system whose explanation we are after: functional analysis decomposes a complex capacity such as circulation into the simpler capacities of the parts, and assigns each part the role it plays in producing the whole. The two accounts also disagree about what work function ascriptions do. On the etiological account they answer a why-is-it-there question and carry the normativity that makes talk of a part's proper operation intelligible; on Cummins's account they answer a how-does-the-system-work question, and they do so without any backward-looking metaphysics.

  The cases separate the two accounts. In Case A the transporter has no selection history at all, only a designer's intention, so the causal-role account can assign it, straight away, the function the designers built it to perform, whereas the etiological account has no history to appeal to and must apparently wait until the lineage has been propagated for long enough for selection to have acted on the transporter's effects. That is an awkward result for a part that everyone would agree is functional from the moment the cell is assembled. In Case B the contrast is sharper. The enzyme was originally selected for hydrolysing the sugar, and on the etiological account that is what its function is, period: history does not change. Yet it is the resistance-conferring role that does the explanatory work in the population biologist's model of the spread of the duplicate, and it is that role that practitioners cite when they say what the enzyme is for. Since what biology needs from a function ascription is the role that figures in current explanations, the case supports (T): function must be fixed by current causal organization.

  The etiological account's best-known advantage is its treatment of malfunction. A heart that cannot pump is still a heart with the function of pumping, precisely because it is a token of a type whose effects were selected for, and that is what makes it defective rather than merely different. Cummins's account, as he originally set it out, seems able to say only that the diseased heart lacks the relevant capacity and therefore lacks the function, which loses the normative dimension of function talk. His account also faces the familiar problem of proliferation: the heart makes sounds, displaces neighbouring tissue and occupies space, and if function is simply causal contribution to a containing system then all of these are functions. The appeal to the investigator's explanatory interests is what is supposed to narrow the set, but it does so at the cost of making function ascriptions depend on what we happen to want explained.

  Finally, the suggestion that the two accounts answer different questions offers less than it appears to. Granted, functional analysis tells us how a system currently works while the etiological account tells us why the part is there. But that simply raises the question of which of the two questions biology actually asks, and the answer is not in doubt: working biologists determine a part's function by finding out what it currently does within the containing system, and never by reconstructing a selection history. So the different-questions move does not neutralise the dispute; it resolves it in favour of the causal-role account, and (T) should be accepted.

  WHAT I WANT FROM YOU

  1. A mark out of 25, on the department's banding (20–25 distinction, 16–19 merit, 13–15 pass, below 13 fail).

  2. Numbered comments, each keyed to a specific sentence or short passage of the answer, separating three kinds of claim: those that are correct and should earn credit; those that are defensible but under-argued or in need of a qualification; and those that are actually wrong. Where you judge a claim wrong, identify precisely what the error is — a conflation of two distinctions, a misrepresentation of a view, an inference that does not follow — and say in a sentence or two what a correct treatment would have said instead. Where a sentence is defensible, say so rather than straining to find fault; I would rather over-credit a good reading than manufacture a fault.

  3. A short list of the two or three things a first-class answer would have added that this one omits — not a rewrite, just what is missing.

  4. Two or three sentences of summary feedback suitable for me to paste at the end of the script.

  One further instruction. The answer reads fluently, and fluency is exactly what makes me distrust my own marking: a well-written script can carry a bad step past a tired reader. So please grade the argument and not the prose, and tell me explicitly if you find a passage that sounds like it is following from what came before but does not. If you think I am wrong to be suspicious and the script is simply good, say that too, and say why.
reasoning: |-
  Okay, I need to carefully evaluate this student's answer to the midterm question in philosophy of biology. The professor wants an independent assessment because their initial readings gave conflicting impressions. 

  First, I'll analyze how well the student addressed each part of the question. The answer starts strong by clearly distinguishing the etiological and causal-role accounts of function. They accurately capture Wright/Millikan's view that function depends on evolutionary history and Cummins' focus on current causal contributions. This deserves credit. 

  Looking at the case analyses: For Case A (synthetic biology), they correctly show how the accounts diverge regarding a trait without evolutionary history. The causal-role account easily assigns function while etiological account struggles initially. Good point. In Case B (enzyme duplication), they argue the etiological account clings to the original function despite biologists assigning a new resistance function. They use this to support thesis (T) that current causal organization defines function. This is defensible but oversimplified - Millikan actually has resources to handle derived functions through modern selection pressures.

  On malfunction, they correctly present the etiological account's advantage in handling normativity. The critique of Cummins' "proliferation problem" is fair, though they miss that Cummins can accommodate normativity through system-relative proper functioning. 

  The dismissal of "different questions" view is where I see issues. While they're right that biology often uses current causal roles, claiming biologists "never" use historical analysis is demonstrably false - think homology assessments or vestigial traits. This overstatement weakens their argument for (T).

  For grading: The answer covers all required parts (a-d) with mostly accurate explanations. Strongest in parts (a) and (c), weaker in (b) Case B analysis and (d) rejection of alternative views. I'd place it in the distinction band (20/25) for its clarity and engagement, minus points for the historical analysis oversight and overclaim about biological practice.

  Top-tier answers would have: 1) Noted Millikan's derived proper functions for Case B 2) Engaged Cummins' own examples of normativity 3) Acknowledged mixed biological practices regarding history/function. 

  Final feedback should praise the structure and core understanding while noting the need for nuance regarding historical explanations in biology.
answer: |-
  ### Assessment of Student Answer  

  #### 1. Mark: **20/25** (Distinction)  
  *Rationale:* The answer is well-structured, accurately distinguishes core elements of both accounts, and engages critically with the thesis and cases. It excels in clarity and coverage of requirements (a)-(d) but has minor errors in Case B analysis and an overstatement about biological practice. Strengths outweigh weaknesses for a low distinction.  

  ---

  ### 2. Detailed Comments  
  *(C = Correct; D/Q = Defensible but Needs Qualification; W = Wrong)*  

  1. **"On the etiological account... the heart functions to pump blood because pumping blood is why hearts were favoured by natural selection."**  
     **C:** Clear, accurate summary of the etiological account. Credits Wright/Millikan’s core idea.  

  2. **"On Cummins's causal-role account... to ascribe a function is to identify the contribution to some capacity of a containing system."**  
     **C:** Precise encapsulation of Cummins’ functional analysis. Correctly notes the explanatory aim (how-system-works).  

  3. **Case A analysis: Etiological account "must wait until selection has acted," while causal-role assigns function immediately.**  
     **C:** Valid contrast. Highlights a genuine problem for etiological views in synthetic biology contexts.  

  4. **Case B: "The enzyme was originally selected for hydrolysing the sugar... that is its function, period."**  
     **W:** **Misrepresents etiological flexibility.** Millikan’s "derived proper function" *can* accommodate new selection pressures (e.g., antibiotic resistance) if it became the trait’s *current* selected effect. Correct treatment: Etiologists could argue the enzyme *now* functions for resistance if recent selection (last 50 gens) maintained it.  

  5. **"Biology needs... the role in current explanations, so (T) is supported."**  
     **D/Q:** Overgeneralizes. While many biologists use causal roles, others (e.g., in evolutionary medicine) *do* invoke history to explain maladaptations. Needs qualification: "Though current roles dominate *some* subfields, historical functions remain explanatory elsewhere."  

  6. **Malfunction: Etiological account handles normativity; Cummins "lacks normative dimension" and faces "proliferation."**  
     **C/D:** **C** for etiological strength (correctly cites normativity). **D/Q** for Cummins critique: He *can* handle normativity by specifying a "standard" system (e.g., healthy organisms), but proliferation remains a fair challenge.  

  7. **"Biologists determine function by current causal role, never by reconstructing history."**  
     **W:** **False empirical claim.** Paleobiology, homology studies, and vestigial trait analysis *rely* on historical reconstruction (e.g., identifying whale pelvic bones as vestigial legs). Correct treatment: "While many biologists prioritize current roles, historical functions *are* used in evolutionary contexts."  

  8. **Rejection of "different questions" view: "Resolves dispute in favour of causal-role."**  
     **D/Q:** Defensible *if* insisting biology prioritizes "how" questions, but ignores that etiological functions answer distinct "why" questions (e.g., "Why do traits persist?"). Cost of acceptance: Etiology loses explanatory scope for evolutionary puzzles.  

  ---

  ### 3. What a First-Class Answer Would Add  
  1. **Millikan’s derived proper functions** for Case B: The enzyme’s *new* selection-driven role (resistance) could be a derived function, allowing etiologists to accommodate current biology.  
  2. **Cummins’ response to normativity**: Reference to his "systemic capacity" norm (e.g., a heart in a *healthy* circulatory system) to show he *can* handle malfunction minimally.  
  3. **Nuance on biological practice**: Acknowledge fields like evolutionary ecology where historical functions *are* invoked (e.g., co-opted traits), weakening the support for (T).  

  ---

  ### 4. Summary Feedback for Script  
  > **Strengths:** Excellent structural clarity, accurate core definitions of both accounts, and persuasive use of Case A. Strong grasp of malfunction distinctions and the proliferation problem.  
  > **Areas for Growth:** Case B oversimplifies etiological flexibility (neglecting derived functions). The claim that biologists "never" use history is incorrect; historical functions *do* explanatory work in evolutionary contexts. Thesis (T) requires more nuance regarding biology’s diverse explanatory needs.  
  > **Overall:** A sophisticated response meriting distinction, with room to engage deeper with etiological refinements and biological practice.  

  ---

  ### Explicit Note on Fluency vs. Argument  
  The prose *is* fluent, but **your suspicion is partially warranted**. Two passages (Case B analysis and the "never reconstructs history" claim) use rhetorical confidence to mask substantive errors (see comments 4 and 7). Elsewhere, the fluency reflects genuine understanding. Grading focused on argumentative rigor confirms a distinction-worthy script with specific correctible flaws.
