prompt: |-
  I’m applying for a 10-week undergrad summer fellowship and need a short proposal (like 2 pages, ~800–1000 words) on Popper’s view of Darwinism, but not the usual “he first said it was unfalsifiable and then recanted, creationists quote-mined him” essay. Don’t bother with a bibliography or literature review; I’ll add citaitons myself. Same for any reading list.

  My half-formed idea: “Darwinism” as Popper argued about it isn’t one theory but a layer cake of at least three different things glued together. There’s (1) the big historical claim that species are modified descendants of common ancestors and that all terrestrial life probably goes back to a few simple organisms; (2) a population-genetic / model-building layer where, if you specify things like mutation rates, selection coefficients, population size, and an independent measure of fitness, you get concrete predictions about allele frequencies and trait distributions; and (3) an adaptationist heuristic: assume that most widespread traits are there because natural selection put them there, and look for selectionist explanations first unless you have special reason not to. I think Popper’s early charge that Darwinism is “not a testable scientific theory, but a metaphysical research programme” was really mostly about (3), and maybe about a sloppy version of (2) where “fitness” is just defined by actual survival, so “survival of the fittest” looks like a tautology and he even called the theory “almost tautological.” His later recantation, where he says the theory can be formulated so it is far from tautological and is testable, was mostly about (2), and maybe (1) too. But (3), the look-for-adaptive-explanations framework, still looks untestable on its own: no failure of any particular trait to have a selectionist story seems to refute the heuristic itself, because you can always say the trait is a byproduct, a constraint, drift, or you haven’t found the right selective regime yet.

  So the question I want the proposal to ask: can Popper’s own demarcation machinery handle a composite object like this—part testable model, part historical narrative, part untestable-but-heuristically-vital framework—or do we need to supplement falsifiability with some notion of “framework appraisal” (explanatory fertility, ability to generate novel testable models, resistance to ad hoc rescue, maybe something like degrees of empirical content inherited from the models a framework spawns)? A sharper way to put it: is Popper’s recantation best read as (a) a genuine retraction, (b) a relocation of the “metaphysical research programme” label from the whole theory to just the adaptationist heuristic / framework layer, or (c) a sign that his falsifiability criterion is too coarse to classify real historical sciences, so we should replace or supplement it? I want the question stated so it has a determinate answer (one of those options, or a defended taxonomy with conditions), not just an “explore the issue” prompt.

  Why the existing answers leave it open: the obvious moves are (i) “Popper was just wrong early on and right later, end of story,” (ii) “he was always talking about different things, so there’s no real reversal,” and (iii) “falsifiability is useless for a mature historical science like evolutionary biology, so the whole framing is misguided.” I think (i) ignores that even the testable formulations of natural selection depend on a non-testable framework that tells you what counts as a selective explanation and what to ignore; (ii) doesn’t say what the different things are, or why the framework part can’t just be eliminated or seperated from the models; and (iii) gives up on Popper’s project instead of testing whether it can be refined. The proposal should explain why these don’t settle it.

  What I want in the proposal:

  - A precise statement of the question, with the three layers (or whatever layers you think are right) defined clearly enough that someone could in principle check the answer.
  - Why the standard positions don’t settle it, as above.
  - The method / approach: what I’d actually do week by week over 10 weeks. I’m imagining something like: weeks 1–2 reconstruct the three layers and the early “metaphysical research programme” complaint, using general philosophy-of-science knowledge and toy examples rather than deep biology; weeks 3–4 analyze the “fitness = survival” circularity and how a non-circular definition of fitness makes the middle layer testable; weeks 5–6 look at the later recantation and ask which layer(s) it covers; weeks 7–8 try to build the “framework appraisal” notion and test whether Popper already has resources for it (metaphysics as rationally discussable but not testable, etc.) or whether it’s a genuinely new supplement; weeks 9–10 write up and stress-test. But give me your own plan and say why this approach rather than the obvious alternatives (e.g., just doing a straight conceptual analysis of “testability,” or just doing a case study of one evolutionary model, or just comparing Popper to the later research-programme idea).
  - What a successful result would look like: e.g., a clean taxonomy showing the early/late Popper flip-flop is really a shift of layer plus a defensible account of how to rationally appraise the untestable framework, or an argument that the early charge was right about the heuristic and the recantation only covered the genetic core. Also say what the deliverable is for someone deciding whether to fund it.
  - What would count as the project failing, and be honest about which failure mode is most likely. Possible failures: the three layers turn out to be inseparable (e.g., you can’t isolate the adaptationist heuristic from the models, or fitness always has to be cashed out in terms of actual survival/reproduction); the notion of “framework appraisal” collapses into either plain falsifiability or mere subjective preference / fashion; or the project is just too big and turns into a generic history of Popper-and-biology paper.
  - A realistic scope section: this is 10 weeks, for an undergrad who has taken intro philosophy of science and high-school biology but no advanced population genetics, and no web access / no ability to check the scholarly literature. Say honestly if it’s too big, what the minimum viable 10-week version is, and what you’d cut (e.g., drop the historical common-ancestry layer, keep only selection vs. drift, or treat the later recantation as given rather than analyzing it from scratch).

  Extra constraints: the proposal should refer to positions and arguments, not to scholarly articles by name, because I’ll fill in citations. No bibliography, no reading list. Keep the framing conceptual: the conceptual work is to find the question that is both open and tractable, and an angle that isn’t the standard one. Please write it as a proposal document I could actually submit: precise, with a clear question, method, success/failure conditions, and scope. Casual is fine for my prompt, but the proposal itself can be a bit more formal than this message. Oh, and I’m not worried about a typo or two in your reply to me, but don’t put any fake page numbers or invented quotes in the proposal; if you use a quotation from Popper, keep it short and exact (I’ll check it later), or just paraphrase.
