prompt: |-
  I sat on a university hiring committee this spring, and the experience left me puzzled about something I can't quite formulate. In the same week, all of us were required to complete the campus bias-training module — which argued, at length, that unstructured holistic judgments of a person's character are noisy, biased, and barely predictive of anything — and we were also asked to write third-year review letters assessing colleagues on "collegiality," and to sign a form certifying that a candidate is of "good moral character." Since then I keep seeing the same shape elsewhere: bar admission character-and-fitness questionnaires, security-clearance adjudications, reference letters, the way one old act of dishonesty is treated as revelatory of a person while an equally old act of violence gets written off as youthful indiscretion, and the way nearly all of these institutions also maintain some kind of rehabilitation window after which past conduct stops counting. It looks like every institution that judges character also trains its own members not to.

  I've been reading about the situationist critique of virtue ethics — the argument, drawn from social psychology, that behavior is driven mostly by features of situations rather than by stable global traits (the obedience experiments, the seminary students who hurried past a stranger slumped in a doorway when they were late), so that attributing robust character traits to people is a systematic error. Taken at face value, it makes my committee's practice look incoherent: we are trained not to make exactly the judgment we are then asked to certify. But I don't trust that reaction, and I'd rather have the implicit theory reconstructed properly than a verdict on whether the critique is true.

  So: what view of character do these practices actually presuppose? Do they strictly require global-trait realism of the sort the situationist denies, or would something much thinner do the work — only that conduct in one situation predicts conduct in relevantly similar ones, or that a person's history is evidence about how they will respond to the specific situations a role puts them in? Which rival views do they quietly rule out: thoroughgoing situationism, a local-traits-only view, a view on which character is a normative ideal or a regulative fiction rather than a psychological posit? Are their parts even consistent with one another — can one institution coherently treat single acts as revelatory, discount old ones, and honor a rehabilitation window, when each of those seems to assume something different about how stable character is and how diagnostic any given act is? Where, if anywhere, is the practice philosophically underdetermined, such that several quite different theories of character would license it equally well? And the case I actually care about: suppose a licensing board took the critique seriously and replaced its global "good moral character" finding with something situation-indexed — referees rate candidates only on specified domains ("admits their own mistakes when they'd gain from hiding them," "reliable under deadline pressure," "behaves similarly toward people with less power"), are explicitly told not to aggregate those ratings into any overall verdict, and must ignore conduct more than seven years old. Would that be a practice a situationist could endorse, or has the trait attribution merely moved one level down, into the domains? What would have to change institutionally for the reform to be real rather than cosmetic, and what would we give up?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the apparent contradiction between bias training that criticizes holistic character judgments and institutional practices that require assessing things like "collegiality" or "good moral character." They mention the situationist critique from social psychology, which argues behavior is more situation-dependent than trait-based. Their main question is about what theory of character these practices actually presuppose and whether a reformed system could align with situationist insights.

  First, I need to break down the components. The user lists several examples: third-year reviews, bar admissions, security clearances, etc. All involve judging character but also have mechanisms like rehabilitation windows. The tension is clear: institutions train people to avoid unstructured judgments yet demand exactly that. The user wants to understand the implicit theory behind these practices and if they can be reconciled with situationism.

  Looking at the practices, they don't strictly require global traits. Instead, they seem to rely on predictive validity for specific roles. For example, past dishonesty might predict future dishonesty in similar contexts, like legal work. Rehabilitation windows suggest that character isn't fixed; people can change over time. This points to a pragmatic, evidence-based view rather than a commitment to stable traits.

  The user asks if a reformed system—using situation-specific domains and ignoring old conduct—would satisfy situationism. I think yes, but only if the domains are context-specific and not aggregated. However, there's a risk that these domains become new traits. To avoid that, the focus should be on situational factors during assessment, like how a candidate acts under pressure rather than labeling them as "reliable."

  The user also wonders what's lost in such reforms. Holistic judgments might capture intangible qualities like collegiality, which are hard to measure but important for workplace harmony. Predictive validity might decrease if we ignore older data, but situationists would argue distant past behavior is less relevant. Institutions might resist because global traits simplify decisions, even if they're flawed.

  The key is that current practices are philosophically underdetermined. They can be interpreted through multiple theories, which explains the coexistence of conflicting elements. Rehabilitation windows and discounting old acts align with both situationism and the idea that character changes. Treating certain acts as diagnostic could fit a probabilistic view where some behaviors strongly predict future actions in similar contexts.

  For the reform to be real, institutions need to train evaluators on situational factors, structure assessments around specific contexts, and avoid aggregation. But this might sacrifice some predictive scope and efficiency. The user's deeper need might be seeking validation that their committee's practices are incoherent while looking for a feasible alternative that reduces bias without losing utility.
answer: |-
  Your committee's experience reveals a profound tension between institutional character-assessment practices and the psychological critiques embedded in bias training. The implicit theory of character underlying these practices is not a naive global-trait realism but a **pragmatic, contextually bounded predictive model**—one that situationism challenges but doesn't wholly invalidate. Let's reconstruct it:

  ### The Implicit Theory in Practice
  1.  **Domain-Specific Stability:** Practices assume that past behavior in *professionally relevant domains* (e.g., honesty in academic work, reliability under deadlines, conflict resolution with peers) predicts future behavior in *similar institutional contexts*. It rejects global "virtue" but accepts *local trait stability* within role-bound situations.
  2.  **Probabilistic, Not Deterministic:** A single act (e.g., plagiarism, fraud) is treated as highly diagnostic not because it reveals an immutable essence, but because it signifies a significantly elevated *statistical risk* in high-stakes roles (e.g., handling sensitive data, upholding legal ethics). Conversely, isolated youthful violence may be discounted if the role lacks situational triggers (e.g., no expectation of physical confrontation).
  3.  **Rehabilitation as Changed Responsiveness:** The "rehabilitation window" presupposes that character is *malleable* but *trackable*. Past conduct ceases to count not because character is fixed but because sustained prosocial behavior in relevant situations over time indicates a *new pattern of responsiveness* to situational demands. The clock starts when the person enters contexts demanding the previously deficient traits.
  4.  **Collegiality as Functional Necessity:** University assessments of "collegiality" aren't about universal agreeableness. They assess a candidate's *predictable responsiveness* to specific situational demands of academia: collaborative research, fair service burdens, respectful disagreement, mentoring. It's a *local trait* tied to the academic ecosystem.
  5.  **Moral Character as Threshold Compliance:** "Good moral character" requirements (bar admission, security clearance) function as risk-minimizing *filters*. They ask: "Is there evidence this person poses an *unacceptable risk* of misconduct *in situations inherent to this role*?" It's less about virtue and more about avoiding catastrophic failures where situational pressures are known.

  ### What Rival Views Are Ruled Out (or Accommodated)?
  *   **Thoroughgoing Situationism (Denied):** Practices reject the view that *only* immediate situational forces matter. Past behavior *is* seen as diagnostic for future similar situations.
  *   **Global-Trait Realism (Softened):** Strict Aristotelian virtue realism is unnecessary. Practices work with a weaker view: *recurring behavioral patterns in specific domains* have predictive power within bounded contexts.
  *   **Local-Traits-Only View (Accommodated):** This is the *closest fit*. Institutions care about "honesty-in-professional-contexts," "reliability-under-work-pressure," not "honest person" simpliciter.
  *   **Character as Regulative Fiction (Partially Accommodated):** The *language* ("good moral character") might function as a normative ideal, but the *operation* (looking at specific past acts, time windows) reveals it's treated as a probabilistic empirical posit about future risk.
  *   **Pure Behavioral Prediction (Embraced):** At its core, practice is often just predicting future behavior in role-specific situations using past behavior as the best available (though flawed) data.

  ### Coherence of the Practices
  The practices are *instrumentally coherent* under a **probabilistic risk-management model**:
  *   **Single Acts as Diagnostic:** A single act of fraud *is* highly predictive of future fraud risk in fiduciary roles (studies show past dishonesty predicts future dishonesty better than many traits predict behavior). Its diagnostic power is domain-specific.
  *   **Discounting Old Acts/Rehabilitation:** If the act occurred outside the "rehabilitation window," sustained prosocial behavior in relevant contexts has statistically lowered the risk to an acceptable threshold. The stability assumed is not eternal, but responsive to life patterns.
  *   **Inconsistency (Violence vs. Dishonesty):** This reflects different *institutional risk calculations*. A past violent act is often deemed irrelevant to an academic role (low situational triggers). Past dishonesty directly threatens core academic functions (research integrity, grading). The "revelatory" power is tied to *role-context relevance*, not metaphysics.

  ### Philosophical Underdetermination
  The practice is **underdetermined** between:
  1.  A **local traits view** (stable dispositions within specific situational domains).
  2.  A **probabilistic behavioral history view** (past actions are simply the best predictors of future actions in similar contexts, without invoking "traits").
  3.  A **risk-management model** (past conduct indicates elevated statistical risk, mitigated by time/rehabilitation).

  All three justify the core practice: using relevant past behavior within a time window to predict future risk in specific role-related situations.

  ### The Situationist-Endorsed Reform: Possibilities and Limits
  Your proposed licensing board reform **could be a significant step towards situationist compatibility**, but only if implemented rigorously:

  1.  **Domain Specification:** "Admits mistakes when they'd gain from hiding them" is far better than "honest." It defines the *situation* (opportunity for self-serving deception).
  2.  **No Aggregation:** Avoiding an overall "character" verdict is crucial. Situationists argue aggregation creates the fundamental attribution error.
  3.  **Time Limit:** Ignoring old conduct aligns with evidence that recent behavior is more predictive than distant past, and people change.

  **Where the Reform Might Still Stumble (or Require More):**
  *   **Domain as New Trait?** If "admits mistakes..." becomes a stable "trait" attributed to the *person* rather than a prediction about behavior *in that specific type of situation*, trait attribution merely relocates. Evaluators must be trained to see ratings as *situational predictions*, not person-essence labels.
  *   **Ignoring Situational Pressures:** A truly situationist reform would require evaluators to *contextualize* past conduct: *Why* did the dishonesty occur? What were the specific pressures, temptations, or institutional failures? Was it an outlier under extreme duress, or a pattern in mundane situations? This is often omitted due to practicality.
  *   **Predicting Novel Situations:** Roles create new situations. The reform focuses on *known* domains. Situationists would emphasize designing institutions to *shape* behavior (nudges, accountability structures, ethical infrastructure) rather than just filtering people based on past responses to *different* situations.

  **What Would Make the Reform "Real" (Not Cosmetic):**
  1.  **Train Evaluators on Situational Forces:** Teach referees *how* situational factors (power differentials, time pressure, incentive structures) influence behavior in the specific domains they assess.
  2.  **Require Context for Negative Ratings:** Mandate descriptions of the *situation* surrounding any concerning past behavior cited.
  3.  **Focus on Institutional Design:** Pair assessments with efforts to *create situations* within the role that minimize temptation/maximize prosocial behavior (transparency, checks-and-balances, ethical culture promotion).
  4.  **Monitor Predictive Validity:** Track whether the specific domain ratings actually predict future behavior in those domains within the role. If "reliable under deadline pressure" ratings don't correlate with actual on-time delivery, the domain needs refinement.

  **What Might Be Given Up:**
  *   **The Illusion of Holistic Insight:** We lose the (often false) comfort of feeling we "know" someone's essential moral worth. Decisions become explicitly probabilistic and domain-limited.
  *   **Simplicity & Efficiency:** Granular, situation-specific assessment is harder and slower than a holistic "gut feeling" or a single "good character" checkbox.
  *   **Predicting Truly Novel Challenges:** Assessing known situations may poorly predict responses to unprecedented ethical dilemmas the role might present. Holistic judgments claimed (often wrongly) to cover this.
  *   **Some (Possibly Spurious) Predictive Scope:** If rare, stable global traits *do* exist (debatable), the reform might miss them. Situationists argue this cost is negligible compared to the error reduction.

  ### Conclusion
  Your committee's tension arises because bias training targets the *unstructured, holistic, global* attribution of character ("this candidate has integrity"), while institutional practices *attempt* (often clumsily) to make *structured, domain-specific, probabilistic predictions* about future risk in role-relevant situations ("this candidate has no history suggesting they'll falsify data when under publish-or-perish pressure").

  The situationist critique doesn't render these practices incoherent *in principle*, but it exposes their frequent *operational incoherence* when they lapse into global trait language ("good moral character") without adequate structure. Your proposed reform moves strongly towards situationist compatibility by focusing on specific situational domains, avoiding aggregation, and implementing time limits. To be fully endorsed by a situationist, it would need to incorporate explicit training on situational forces, context for past behavior, and ideally, a shift towards designing institutions that actively shape ethical behavior, not just selecting supposedly "good" people. The cost is abandoning the myth of deep character knowledge; the gain is potentially fairer, more accurate, and less biased predictions of behavior within the specific contexts that matter for the role.
