  First, I consider possible settings. A hospital ward comes to mind because mistakes there have tangible consequences. The clerical error angle works well—something mundane like a misplaced door that seems trivial to fix. The challenge is making the Burkean win not rely on hidden purposes. 

  I sketch the scenario: a supply closet door installed backward due to a blueprint error. The reformer, Ana, does everything right—researches the origin, finds clear evidence it was a mistake, runs a pilot. But moving the door causes chaos. Now, why? The adaptations need to be concrete: nurses' muscle memory, infection control workflows, emergency response paths. These must be real dependencies that emerged organically, not designed. 

  Next, verifying constraints. The origin is a documented accident—no secret wisdom. Ana is competent and thorough. The three adaptations are specific: spatial habits, procedural chains, informal protocols. The gap is crucial: Ana can know the origin via records but can't foresee current interdependencies without disrupting the system. 

  I test if flipping elements breaks the case. If origin was undocumented, Chesterton's fence would block removal—different outcome. If the pilot revealed issues, cost-benefit wins. So the load-bearing bit is the pilot's inability to detect latent dependencies. 

  For the reformer's rebuttal: Ana might argue the adaptations are inefficiencies to be eliminated, treating them as bugs. This keeps the debate alive. 

  Finally, ensuring all specs are met. The Burkean win stems from system complexity, not hidden intent. Ana's competence isn't undermined. The three adaptations are named and functional. The gap between historical knowledge and emergent function holds. No specs dropped—everything fits.
answer: |-
  ## The Case of the Backward Door

  At St. Brigid's Hospital, the main linen supply closet for the East Wing has its door hinged on the right, opening *into* the busy corridor. This forces staff to step back into traffic when exiting with full carts. Nurse Ana, frustrated by near-collisions, investigates. She finds the original 1975 blueprints: the door was clearly specified to hinge on the *left*, opening *outward* into the alcove. A clerical error transposed the hinge symbols during final drafting. Construction followed the flawed plan. No hidden reason existed; it was a simple, documented drafting mistake, never corrected. Ana meticulously logs the error, proposes reversing the door to match the intended safe design, and secures approval for a weekend pilot during lower-traffic hours, with contractors on standby to revert. They change the door. Monday morning brings chaos: nurses instinctively reach for the old handle location and stumble, housekeeping carts block the widened alcove entrance creating a new pinch point, and crucially, the Infection Control team's established "clean handoff" protocol – where they collect soiled linens from a marked spot *just inside* the now-altered doorway while maintaining corridor flow – is disrupted, causing backups and protocol breaches. Patient care efficiency drops noticeably within hours. The door is hastily changed back.

  **Verdicts:**

  1.  **Historical-Rationale Test (Chesterton's Fence): PASSES.** Ana conclusively identified the origin (clerical drafting error) and its intended, unfulfilled purpose (safe outward swing). The fence *was* built in error; removal based on this understanding is justified. *Why: The test only requires understanding the original intent and reason for existence, which Ana did. The error invalidates the "fence's" original justification.*
  2.  **Best-Evidence Cost-Benefit Analysis: PASSES (in theory), FAILS (in practice).** Based on blueprints, observed near-misses, and logical flow, removing the error *should* improve safety and efficiency. The pilot's results, however, proved the opposite under real conditions. *Why: Pre-change analysis missed critical emergent dependencies. The pilot revealed unforeseen costs exceeding anticipated benefits.*
  3.  **Burkean Presumption: SUSTAINS.** Despite the proven error and careful removal attempt, altering the longstanding arrangement caused significant harm due to unforeseen dependencies. The presumption against change was correct. *Why: The door's current position, however erroneous initially, had become structurally integrated into complex, evolved work patterns that weren't fully discernible until disturbed.*

  **Three Specific Adaptations:**

  1.  **Muscle Memory & Spatial Navigation:** Nurses and orderlies developed deeply ingrained muscle memory for reaching, pulling, and stepping *back* while simultaneously scanning the corridor over their shoulder. Changing the swing direction disrupted this automatic, safety-critical choreography.
  2.  **Alcove Utilization & Cart Management:** The awkward inward swing forced housekeeping to leave carts *partially in the alcove* near the door, a space now blocked and rendered unusable when the door swung outward. This created a new, unexpected obstruction point where none existed before.
  3.  **Infection Control Protocol Integration:** The precise location *just inside* the inward-swinging door became the designated, efficient point for soiled linen handoff, allowing IC staff to grab bags without fully entering and maintaining corridor flow. The outward swing moved this critical interaction point into the corridor itself, disrupting the flow and the protocol's spatial logic.

  **The Load-Bearing Feature:**

  *   **The pilot was necessarily incomplete with respect to revealing latent dependencies.** While testing the *mechanics* of the new door, it couldn't replicate the complex, high-stakes, real-time interplay of multiple routines and ingrained habits under peak conditions until fully deployed. The adaptations were latent, emergent properties of the system-as-used, not features of the door itself.
  *   **Flipping It:**
      *   **Undocumented Origin:** If Ana *couldn't* find the reason, Chesterton's Fence (Test 1) would block removal ("You haven't proven it *was* an error!"), leading to a different stalemate, not this Burkean win.
      *   **Pilot Reveals Mess:** If the pilot *could* have simulated or detected the muscle memory conflicts, cart blockage, and protocol disruption *before* full commitment, the cost-benefit analysis (Test 2) would likely have correctly recommended *against* the change, aligning with the presumption. The Burkean win relies on the *inability* of the pilot to expose these latent adaptations in advance.

  **The Reformer's Rebuttal (Avoiding the Loss):**

  Ana argues: "This isn't a win for keeping mistakes! It's a failure of our *current* system's adaptability and a sign of *bad* dependencies. Those 'adaptations' – the stumbling, the cart blockage, the inflexible handoff spot – are *inefficiencies* and *workarounds* we've normalized around a known error. They are *precisely* the cruft we need to eliminate. The fact that changing one error caused chaos shows how brittle and poorly understood our own workflows are *now*, not that the original error was somehow wise. We should fix the door *and then* systematically fix the broken habits and protocols it exposed, using this disruption as a catalyst for genuine improvement, not an excuse for stagnation."

  **Spec Check:** All constraints satisfied. The origin is a known accident. The reformer is competent. The Burkean win comes from concrete, named adaptations (muscle memory, cart management, protocol integration), not hidden purpose. The evidence gap (pilot incompleteness) is central. No specs dropped.
