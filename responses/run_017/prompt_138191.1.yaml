        "reason": "Unrolled steps are computed in real-time; collapsed state is a cached output without process traces."
      },
      {
        "case": "Sole vs. Backed-up",
        "verdict": "Sole: borderline. Backed-up: in.",
        "reason": "Backed-up computation has multiple adaptive pathways; sole circuit is critical but lacks developmental depth."
      },
      {
        "case": "Recomputed vs. Precomputed (new case)",
        "verdict": "Recomputed: in. Precomputed: out.",
        "reason": "A value generated on-demand via S's current algorithms (recomputed) is entrenched; a lookup table populated pre-training (precomputed) is not, even if used identically."
      }
    ],
    "one_phenomenon_or_three": "One phenomenon: all cases hinge on whether the computation's presence reflects the system's *own problem-solving history*, not just current function.",
