  ### Key Clarifications  
  - **Diagnostic Test**: To check for *developmental entrenchment* without circularity:  
    1. **Rewind Test**: If you "rewound" S to an earlier training state and retrained with identical data but different initialization, would C re-emerge in a recognizably similar form? (Grown: yes; grafted: no).  
    2. **Process Interference Test**: Can you disrupt C *during its formation* (e.g., early-training ablation) and still achieve the same final behavior? If not, C is entrenched (unrolled: vulnerable early; collapsed: robust early).  
  - **Borderline Cases**: Sole circuits pass the rewind test (they re-emerge) but fail process interference (early ablation breaks final behavior). This tension makes them borderline.  
  - **Moral Relevance**: Entrenchment doesn't imply consciousness, but if moral status requires *experiential fidelity* (e.g., computations reflecting genuine "learning"), entrenchment could be a necessary filter. Your discomfort may stem from intuiting that grafted states lack "narratives of origin."
