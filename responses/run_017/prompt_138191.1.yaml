    "definition": "A computation C is developmentally entrenched in system S iff (1) C emerged and stabilized through S's adaptive history (e.g., training), and (2) S's architecture retains structural dependencies that arose from C's role in that history, making C resistant to perturbation not by redundancy but by integration.",
    "case_verdicts": [
