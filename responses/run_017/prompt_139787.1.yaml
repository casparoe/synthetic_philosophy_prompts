prompt: |-
  I'm helping to spend a smallish health budget — real money, a real vote — and our committee keeps splitting between programmes that buy a modest, well-measured improvement in how a lot of people feel and programmes that prevent or treat a handful of conditions (trigeminal neuralgia, cluster headache, that sort of thing) where patients describe the pain as unbearable. Before I write the short paper I owe everyone, I want the spec rather than the theory: what would a view about the moral weight of suffering as against happiness have to get right to be good enough to actually move money with?

  The family of views I keep half-convincing myself of is what I'll call lexical threshold negative utilitarianism, and I'll define it so we don't talk past each other: put pleasures and pains on a single intensity scale; below some threshold T of suffering the two trade off against each other in the ordinary aggregative way; at or above T suffering takes priority in the strong sense that no quantity of sub-threshold goods — not any number of people with mildly nicer lives — compensates for a single instance of it, which is the intuition behind the dust-specks-versus-torture case people always wheel out. What I want from you is the desiderata list such a view has to meet, each with the case or consideration behind it, and each marked non-negotiable or camp-preference. Here are the ones I already think are on it, which I want you to organise, sharpen, and tell me which are bogus: where T sits and why that isn't just gerrymandered to save the cases I like; the cliff problem, given that intensity looks vague, so a sorites across a long series of neighbouring cases either forces a sharp line somewhere arbitrary or breaks transitivity of better-than; what the unit of the threshold is — a single episode, a whole life, a person's lifetime distribution, a population; whether the trigger is really intensity or something like duration, unpredictability, or the subject's own retrospective attitude (the marathon, childbirth, the ascetic who recieves it as meaningful); which pain is even being counted when lived-through pain, remembered pain and anticipated pain come apart, which from what I've read they do, since remembered intensity seems to track the peak and the end rather than the total; and what to do when intensity can't be read off behaviour and the exposures are enormous but uncertain, as with fish or insects.

  I also want my own pet idea stress-tested rather than indulged: that pleasure has a compressed top end — the very best moments don't differ in intensity nearly as much as the very worst ones do — so maybe the lexical structure is really a derived fact about the shapes of the two distributions and the threshold is an artefact the theory should dispense with entirely. If it helps to pin the requirements down, here is the case the committee actually argued about: one patient with pain at nine-tenths of T lasting forty years, one patient with pain at eleven-tenths of T lasting ninety seconds, and money for only one of them. Tell me which of the requirements are just prejudices of one side, since I can drop anything that only matters if you already want the view to be elegant; tell me which single requirement does the most work in knocking out candidate views; and if some subset of the requirements cannot be jointly satisfied, say so and give me the argument, because if the list is itself a result I'd rather find out now — my guess is that lexical priority plus a vague threshold plus a genuine ordering is the unstable triple, but I want to see it done properly. You can rate the obvious candidates against the list in a line each if that helps, but keep the weight on the criteria. And skip anything like a reading list or citations; I have far too many tabs open already.
reasoning: |-
  Okay, the user is helping allocate a health budget and their committee is split between programs that provide modest improvements to many people versus those targeting severe, unbearable pain conditions like trigeminal neuralgia. They're considering a moral framework called lexical threshold negative utilitarianism, where suffering above a certain threshold T takes absolute priority over any amount of sub-threshold benefits. They want a set of criteria to evaluate this framework, focusing on practical application rather than theory.

  The user has several concerns: where to set T without gerrymandering, the cliff problem due to vague intensity scales, what unit the threshold applies to (episode, life, etc.), whether intensity alone should trigger it or other factors like duration, and how to handle pain measurement challenges including in non-human animals. They also propose an alternative idea - that pleasure has a compressed top end while pain has a wide range, making the lexical structure an artifact of distribution shapes.

  The core conflict is practical budget allocation with real-world consequences. They need criteria robust enough to withstand committee scrutiny and real-world implementation. Their proposed framework attempts to resolve the "dust specks vs torture" intuition but faces operational challenges.

  Key issues to address include:
  - Threshold justification: Avoiding arbitrary T placement while capturing "unbearable" suffering
  - Vagueness problem: How binary priority can work with continuous pain scales
  - Unit definition: Whether priority applies per episode or broader contexts
  - Intensity measurement: Accounting for subjective factors like peak-end effects
  - Uncertainty: Handling unmeasurable suffering (e.g., in insects)

  The user seems analytically rigorous but overwhelmed by open questions. They want clarity on which requirements are essential versus negotiable, and whether any combination creates fatal contradictions. The case study (40 years at 90%T vs 90 seconds at 110%T) tests whether duration could ever outweigh crossing T.

  The challenge is balancing moral intuition with operational feasibility. Any workable framework must survive both ethical scrutiny and implementation realities. The priority is identifying dealbreaker criteria rather than defending elegance.
answer: |-
  Here's a distilled list of **non-negotiable desiderata** and **camp-preference desiderata** for a "lexical threshold" view to be operationally viable for budget allocation, based on your constraints and the committee's dilemma. The core instability lies in reconciling **lexical priority** with **intensity vagueness** while maintaining a **practical decision procedure**.

  ### Non-Negotiable Desiderata (Failure here invalidates the view for funding decisions)
  1.  **Non-Arbitrary Threshold Justification ("Why T *here*?")**:
      *   **Case**: Setting T at "unbearable pain" (e.g., TN/cluster headache) vs. "severe but manageable" (e.g., chronic back pain). *Why not higher/lower?*
      *   **Requirement**: T must be defensible by observable, intersubjective criteria (e.g., functional incapacity, treatment resistance, specific neurobiological signatures) *beyond* just patient report. "Unbearable" needs operational anchors.
      *   **Knockout Power**: High. Gerrymandering accusations sink credibility. Fails if T relies solely on moral intuition without empirical anchors.

  2.  **Operational Unit Clarity ("What gets prioritized?")**:
      *   **Case**: Is one 90-second episode at 110%T *really* worse than one person's 40-year sentence at 90%T? What about chronic T-level pain vs. acute spikes? A population with scattered T-level episodes?
      *   **Requirement**: The unit triggering priority must be unambiguously defined: likely **discrete episodes exceeding T** (defined by intensity + minimum duration? e.g., >T for >1 minute). Prioritizing "lives with T-experience" is unworkably vague; prioritizing "any T-experience ever" risks absurd micro-focus.
      *   **Knockout Power**: Highest. Without this, the view cannot map onto real-world interventions. ("Do we fund the TN drug or the back pain program?" depends entirely on the unit.)

  3.  **Tractable Measurement ("How do we *know* T is crossed?")**:
      *   **Cases**: Pain scales are vague (0-10); behavioral proxies are unreliable (fish/insects, dementia patients); peak-end effects distort memory; cultural/individual variations in reporting.
      *   **Requirement**: A *feasible, reliable proxy* for T-crossing must exist and be implementable within budget constraints. This likely demands focusing on **medically diagnosed, treatment-refractory conditions with catastrophic functional impact** (e.g., confirmed TN, cluster headache) and excluding areas of high uncertainty (e.g., insect welfare, mild dementia pain).
      *   **Knockout Power**: Absolute. If you can't reliably identify T-crossing cases in practice, the lexical priority rule is useless for allocation.

  4.  **Transitive Ordering Under Uncertainty ("Can we actually rank options?")**:
      *   **Case**: Program A likely prevents 10 borderline-T cases (intensity 0.95T-1.05T). Program B certainly prevents 1 clear-T case (intensity 1.2T). Which has priority? A sorites series near T breaks simple comparisons.
      *   **Requirement**: The decision rule must yield a **transitive ordering** of interventions *despite* intensity vagueness near T and uncertainty. This requires either **bright-line diagnostic rules** (defining T-crossing categorically based on condition/diagnosis, not intensity scale) or **accepting near-T fuzziness breaks lexicality** (a fatal flaw).
      *   **Knockout Power**: High. Non-transitivity paralyzes decision-making. Bright-line rules are the only escape hatch.

  ### Camp-Preference Desiderata (Important for theoretical coherence/user buy-in, but potentially bendable)
  5.  **Intensity Focus ("Is it *just* pain?")**:
      *   **Case**: Childbirth/marathon pain vs. unexpected injury. Meaningfulness, predictability, controllability, duration.
      *   **Requirement**: Threshold crossing should be primarily tied to **raw experienced intensity/disability during the episode**, not retrospective attitudes or meaning. Duration matters *within* the priority rule (e.g., longer T-pain is worse than shorter), but shouldn't *define* T-crossing. *Why?* Retrospective views are unreliable; meaning is subjective; "unbearable" implies present intensity. Duration is a multiplier *after* priority is triggered.
      *   **Status**: Strong preference. Bending this (e.g., "meaningful pain doesn't count") invites arbitrary exclusion and undermines the core unbearable-pain intuition.

  6.  **Temporal Focus ("Which 'pain' counts?")**:
      *   **Case**: Anticipated dread, acute pain, remembered agony. Peak-end effect.
      *   **Requirement**: Priority should be triggered by **lived experience during the episode exceeding T**. Anticipation/memory are sub-T concerns (though they matter for QoL aggregation below T). The "peak" intensity is likely the critical factor for triggering T.
      *   **Status**: Preference. While total suffering matters below T, the *unbearability* justifying lexical priority is an acute, present-state phenomenon.

  7.  **Handling Your Compressed Pleasure Idea**:
      *   **Case**: If the *worst* pains are vastly worse than the *best* pleasures are good, maybe lexicality emerges naturally without a sharp T?
      *   **Requirement**: **Don't dispense with T yet.** Even if true:
          *   It doesn't resolve *where* priority kicks in or the cliff problem.
          *   It doesn't help define the operational unit.
          *   It doesn't solve measurement uncertainty.
          *   The committee case (40y@0.9T vs 90s@1.1T) *still* forces a choice requiring prioritization rules. The compressed range might explain *why* lexicality feels right, but doesn't operationalize it.
      *   **Status**: Interesting theoretical point, but operationally secondary to the non-negotiables. Keep it as supporting rationale, not a structural replacement.

  ### The Unstable Triple & Committee Case
  *   **Instability Confirmed:** **Lexical Priority + Vague Intensity Threshold + Transitive Ordering Cannot Coexist.** Vagueness near T creates borderline cases where A (just below T) is vastly better than B (just above T), but A is indistinguishable from C (further below), and C is vastly worse than B. Transitivity breaks. **The ONLY escape is abandoning a pure intensity scale for T and adopting bright-line diagnostic categories** (e.g., "Trigeminal Neuralgia = T-crossing by definition").
  *   **Committee Case (40y@0.9T vs 90s@1.1T):** This brutally exposes the cliff problem and unit definition.
      *   **Under Pure Lexical Threshold:** The 90s@1.1T case *must* be prioritized. No amount of 0.9T suffering compensates. This feels counterintuitive to many, highlighting the cliff.
      *   **Requirement Conflict:** It forces a choice between non-negotiable 1 (Justification - is 1.1T *really* categorically different?), 2 (Unit - is one brief episode the unit?), and 3 (Measurement - can we reliably distinguish 0.9T from 1.1T?). **Bright-line diagnosis is the only practical path:** If 90s@1.1T is a recognized symptom of a T-condition (e.g., cluster headache), it wins. If 40y@0.9T is a non-T condition (e.g., severe arthritis), it loses, *even if the patient reports subjectively similar agony*. Harsh, but tractable.

  ### Quick Candidate Rating vs. Non-Negotiables
  *   **Pure Aggregation (No T):** Fails N1 (No justification for ignoring unbearable pain). *Knocked out.*
  *   **Standard Lexical Threshold (Vague Intensity T):** Fails N3 (Unmeasurable), N4 (Non-transitive near T). *Knocked out.*
  *   **Lexical Threshold via Bright-Line Diagnosis (e.g., "TN/Cluster = T"):** Satisfies N1 (Anchor in medical reality), N2 (Unit = episode of defined condition), N3 (Measurable via diagnosis), N4 (Transitive via categorical definition). *Survives.*
  *   **Variable Trade-off (Diminishing Marginal Utility of Suffering Relief):** Fails N1 (Doesn't capture absolute priority intuition). *Knocked out.*
  *   **Your Compressed Pleasure + Aggregation:** Fails N1 (Still doesn't prioritize unbearable pain sufficiently). *Knocked out.*

  ### The Bottom Line for Your Paper
  To move money, **you must abandon a universal intensity threshold T.** Instead, **define a specific list of medical conditions deemed to inherently involve T-crossing episodes** (e.g., trigeminal neuralgia, cluster headache, maybe CRPS-I). Base this on overwhelming clinical consensus about the nature of suffering in these conditions. Then apply lexical priority *to preventing or treating episodes of these specific conditions*. This satisfies the non-negotiables:
  1.  **Justification:** Anchored in medical diagnosis, not arbitrary intensity.
  2.  **Unit:** Clear - an episode of a defined T-condition.
  3.  **Measurement:** Diagnosis is tractable (though imperfect).
  4.  **Transitivity:** Interventions are ranked by impact on T-condition episodes.

  **Sacrifices:** Theoretical purity, the ability to prioritize "unbearable pain" outside defined conditions (e.g., severe untreated trauma pain), intuitive handling of the 40y@0.9T vs 90s@1.1T case if the latter isn't a defined T-condition. But it provides a **workable, defensible, and non-arbitrary** way to prioritize the "handful of unbearable conditions" your committee cares about. Argue that this operationalization captures the core moral intuition while being the *only* feasible way to implement it with real money.
