prompt: |-
  I'm in a joint philosophy/politics seminar on democratic theory and we did the boundary problem last week — who has to be in the demos for a decision to be legitimately democratic. The tutor basically said the problem is insoluble in principle because any rule for drawing the circle presupposes a circle already drawn, and that felt like a cop-out, or at least like something I want stated as a result rather than asserted as a shrug. So before I go back to the standard answers (the all-affected interests line, the all-subjected/coercion line, the "the people constitute themselves" constitution-making line) I want the spec first: what would a theory of the demos's boundaries actually have to deliver to count as adequate?

  Fix the purpose so this isn't just armchair: I want the theory to be good enough to be written into a constitution's rules about the franchise for a binding referendum — including a secession referendum and a merger/joining referendum, not just ordinary elections. So it has to be usable by an actual electoral commission with a deadline, in a situation where people are arguing about who counts, and where nothing authoritative has yet settled whether a given group is inside or outside. Give me the desiderata list with the case or consideration behind each one, and mark which are non-negotiable and which are really preferences of one camp dressed up as requirements — I strongly suspect "it must yield a unique determinate answer for every person" is a prejudice rather than a requirement, but I don't trust myself on that. Cases I want covered: the long-term undocumented resident whose kids are in local schools; the cross-border commuter who pays tax in one jurisdiction and uses services in another; the non-resident citizen who owns property but hasn't lived there in twenty years; children; prisoners; future people who eat the costs of a hundred-year infrastructure or waste decision; and people abroad who are badly affected by this state's emissions or sanctions but are subject to none of its laws. Two requirements I've half-invented and want you to test rather than just accept: (1) the self-induced-affectedness filter — if a state unilaterally extends its reach over people (annexation, occupation, sanctions), it doesn't get to count them as members of its demos on the grounds that they're now affected by it; and (2) the who-counts-the-counters requirement — the criterion must not be such that whoever controls the residency register or the ID rules effectively picks the demos, since then it's not a criterion at all.

  Then the part I most want: tell me which subset of the desiderata you think can't be jointly satisfied, and be explicit that this is a result about the list rather than a failure of imagination — I'd guess the real trap is between "the demos has to be able to authorise itself" and "no body gets to certify its own constituency," but argue it rather than agreeing with me. And say which single requirement does the most work in knocking out otherwise popular answers. A very short scorecard against the three standard answers at the end is fine, but keep the weight on the criteria. Please also flag how confident you are in each thing you assert: which of your desiderata you'd actually defend under pressure, what argument or case would make you drop or add one, and where your reasoning is most likely to have smuggled in a substantive theory of legitimacy. I can fill in readings myself, so no citations.
reasoning: |-
  Okay, the user is in a joint philosophy/politics seminar focusing on democratic theory, specifically the boundary problem. They feel their tutor dismissed the issue as insoluble, which they found unsatisfactory. They want a clear set of criteria for determining who should be in the demos, especially for constitutional rules about referendums. Their goal is to have a practical framework an electoral commission could use, even in contentious situations like secession or mergers.

  First, I need to outline a list of desiderata that a theory of the demos must meet. The user provided several specific cases to consider: undocumented residents, cross-border commuters, non-resident citizens, children, prisoners, future generations, and those affected by a state's external actions like emissions. They also mentioned two self-proposed requirements: the self-induced affectedness filter and the who-counts-the-counters problem.

  I should start by identifying core requirements. Non-arbitrariness seems fundamental—any rule must avoid being ad hoc. Reflexivity is tricky because the demos needs to authorize itself, but that leads to circularity. Inclusivity of the affected is a common principle, but it's vague and over-inclusive. The coercion principle might address some issues but excludes those who are affected without being coerced. 

  Practical applicability is crucial here. The theory needs to be implementable by an electoral commission with deadlines. That means it must be administrable with clear, objective criteria. Determinacy is important but maybe not absolute; some indeterminacy might be acceptable if there's a fair procedure to resolve it. The self-induced affectedness filter addresses annexation scenarios, preventing states from including people they've coerced. The who-counts-the-counters requirement ensures that those controlling registries don't manipulate the demos.

  Looking at the cases: long-term undocumented residents pose a challenge. They're affected by decisions but lack formal status. The coercion principle might include them if they're subject to laws, but residency could be a proxy. Cross-border commuters complicate things—they pay taxes in one place but use services in another. Which demos do they belong to? Non-resident citizens might be included based on citizenship, but if they don't reside, are they affected enough? Children and prisoners are often excluded but might be affected. Future generations can't vote, so how do we represent their interests? Those affected by emissions abroad are impacted but not subject to coercion, which the coercion principle would exclude.

  Balancing reflexivity and anti-circularity is a key tension. The demos must define itself, but without a prior demos, it's circular. This might be the core insolubility. Inclusivity vs. practicality is another conflict. Including all affected could be too broad, while practical rules might exclude some who should be included. The user's self-induced filter helps in annexation cases but might not cover all scenarios like sanctions.

  I should evaluate the standard approaches. All-affected interests is over-inclusive and vague. All-subjected/coercion is clearer but excludes those affected without being subject to laws. Constitutional self-constitution avoids circularity but risks arbitrariness and exclusion. Each fails different desiderata. For example, coercion might handle the undocumented resident if they're subject to laws, but not the person affected by emissions abroad.

  The user's deeper need is likely a structured framework to critique existing theories, showing why the boundary problem is challenging but not entirely hopeless. They might want to push back against the tutor's claim by demonstrating specific trade-offs. Highlighting which desiderata conflict and why helps in understanding the insolubility. Confidence levels are important here—some criteria like non-arbitrariness are strong, while reflexivity's circularity is a probable point of failure.
answer: |-
  Here’s a structured breakdown of the desiderata for a theory of the demos, tested against your cases and requirements, followed by an analysis of tensions and standard approaches. I’ll flag confidence levels (🔒 = high, ⚠️ = medium, 🔍 = speculative) and note where normative assumptions might intrude.

  ---

  ### **Core Desiderata for a Theory of the Demos**  
  *(Non-negotiable unless marked)*  

  1.  **Non-Arbitrariness**  
      - **Requirement**: Criteria must be justifiable by public reason, not contingent on race, wealth, or raw power.  
      - **Why**: Foundational for legitimacy; avoids "might makes right" (e.g., excluding minorities via ID laws).  
      - **Non-negotiable**: 🔒  
      - *Test Case*: Undocumented residents’ kids in schools can’t be excluded arbitrarily if they’re socially integrated.  

  2.  **Reflexivity**  
      - **Requirement**: The demos must be capable of authorizing/revising the boundary rule itself.  
      - **Why**: Avoids infinite regress (no "meta-demos" to define the first demos).  
      - **Non-negotiable**: 🔒 (but its implications cause major problems).  
      - *Tension*: Creates circularity with "anti-circularity" (see below).  

  3.  **Inclusivity of the Affected**  
      - **Requirement**: Those whose fundamental interests are significantly shaped by decisions must have a voice.  
      - **Why**: Democratic legitimacy requires justifying coercion to those burdened.  
      - **Non-negotiable**: 🔒 (but scope is contested).  
      - *Test Cases*:  
        - Future generations ⚠️ (interests affected, but inclusion impractical).  
        - People harmed by emissions abroad 🔍 (if effects are direct/certain, e.g., climate refugees).  

  4.  **Anti-Circularity**  
      - **Requirement**: The boundary rule cannot presuppose an existing demos (e.g., "all citizens" assumes prior citizenship rules).  
      - **Why**: Avoids bootstrapping problem (who defines "citizen"?).  
      - **Non-negotiable**: 🔒  
      - *Your Filter*: "Who-counts-the-counters" is a subset of this ⚠️.  

  5.  **Practical Applicability**  
      - **Requirement**: Rules must be administrable by electoral commissions (clear, objective proxies, verifiable data).  
      - **Why**: Constitutional referendums need enforceable deadlines; avoids paralysis.  
      - **Non-negotiable**: 🔒 for your purpose.  
      - *Test Case*: Cross-border commuters ⚠️ (residency/tax records provide workable proxies).  

  6.  **Determinacy**  
      - **Requirement**: Must yield *sufficiently* clear answers in most contested cases.  
      - **Why**: Referendum rules require predictability; total ambiguity invites chaos.  
      - **Negotiable**: ⚠️ (Some indeterminacy is tolerable if bounded by procedures, e.g., courts adjudicate edge cases).  
      - *Your View*: Correct that "unique determinate answer for every person" is a prejudice – e.g., children/prisoners may be reasonably excluded without full determinacy.  

  7.  **Self-Induced Affectedness Filter** (Your Proposal)  
      - **Requirement**: States cannot count those they unilaterally coerce/annex as part of *their* demos.  
      - **Why**: Prevents legitimizing aggression (e.g., Russia annexing Crimea and "voting" it in).  
      - **Defensibility**: 🔒 (aligns with anti-colonial/anti-imperial norms).  
      - *Test Case*: Sanctioned foreigners 🔍 (excluded even if affected, as harm is imposed).  

  ---

  ### **Tensions That May Be Insoluble**  
  **The Reflexivity vs. Anti-Circularity Trap**  
  - Reflexivity demands the demos self-authorizes.  
  - Anti-circularity demands no prior demos is assumed.  
  - **Result**: 🔒 Any rule (e.g., "all subjected") either:  
    - (a) Assumes a prior authority (e.g., who defines "subjected"?), violating anti-circularity; or  
    - (b) Requires an unauthorized group to define the first demos, violating reflexivity.  
  - **Why this isn’t a shrug**: It shows democracy’s foundational moment is necessarily *revolutionary* (illegitimate by its own rules) or *procedural* (deferring to prior norms). No purely democratic solution exists.  

  **Secondary Tension: Inclusivity vs. Practicality**  
  - Including all affected (future people, emission victims) is administratively impossible ⚠️.  
  - **Result**: Trade-offs are unavoidable (e.g., proxies like residency exclude some affected groups).  

  ---

  ### **Most Damaging Requirement**  
  **Anti-Circularity** does the most work in defeating theories:  
  - All-affected? Who defines "affected"?  
  - All-subjected? Who defines the legal system?  
  - Self-constitution? Who convenes the "constituent power"?  
  ⮕ Each presupposes an undemocratic authority.  

  ---

  ### **Scorecard of Standard Approaches**  
  | **Theory**               | **Strengths**                          | **Failures**                                  |  
  |--------------------------|----------------------------------------|-----------------------------------------------|  
  | **All-Affected Interests** | Maximizes inclusivity (covers future/foreign) | Violates **practicality** (unadministrable), risks over-inclusiveness (global votes on local issues?) ⚠️ |  
  | **All-Subjected/Coercion** | Clear proxies (residency), satisfies **applicability** | Excludes those *affected but not coerced* (emission victims), struggles with **self-induced filter** (annexed populations "subjected") 🔍 |  
  | **Self-Constitution**     | Solves reflexivity via rupture (e.g., revolution) | Violates **anti-circularity** (who initiates?), risks arbitrariness 🔒 |  

  ---

  ### **Confidence & Vulnerability**  
  - **Highest Confidence**: Non-arbitrariness, reflexivity, anti-circularity 🔒. These are logical/structural.  
  - **Vulnerable to Critique**: Inclusivity of affected 🔍. A strict coercion theorist would reject it for being "moralized." I’d defend it, but drop it if shown that *all* interests claims collapse into indeterminacy.  
  - **Self-Induced Filter**: Strong 🔒 if limited to annexation/coercion; weaker if extended to sanctions (may over-exclude).  
  - **Smuggled Normativity**: The "fundamental interests" criterion in inclusivity ⚠️. Requires a theory of basic goods (e.g., security, dignity), which is substantive but unavoidable.  

  ### **Conclusion**  
  The boundary problem is insoluble in pure democratic terms due to the reflexivity/anti-circularity bind. Any adequate theory must:  
  1. **Acknowledge the foundational paradox** (democracy’s authority can’t be democratically established *ex nihilo*),  
  2. **Use bounded proxies** (residency, citizenship) for practicality,  
  3. **Build in anti-domination safeguards** (e.g., your self-induced filter),  
  4. **Delegate edge cases** to courts/review bodies (accepting limited indeterminacy).  

  This isn’t a shrug – it forces clarity about democracy’s limits. For referendums, I’d recommend:  
  - **Default rule**: All adult permanent residents + non-resident citizens.  
  - **Override**: Exclude groups covered by self-induced filter (annexed populations), include long-term undocumented (≥5 yrs? 🔍) via administrative review.  
  - **Future generations/foreigners**: Represented procedurally (e.g., environmental impact assessments), not via franchise.  

  Would this satisfy everyone? No. But it navigates the core tensions while meeting your operational need.
