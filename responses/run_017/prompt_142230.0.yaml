prompt: |-
  I keep arriving at an argument I don't like and can't defeat, and I'd like to know which step is rotten.

  Queueing, jaywalking, and restaurant tipping all look like conventions in the philosophers' sense: each is one among several available solutions to a recurring coordination problem, and any of the alternatives would have served just as well. But if that is right, the content of the local rule is arbitrary, and so the only consideration in favor of conforming is that nonconformists get sanctioned — the rule itself has no grip on someone who is willing to absorb the dirty looks. Two consequences seem to follow, and I doubt both.

  First, a visitor appears to owe the locals nothing. She never joined their practice, and it is hardly her fault that their equilibrium differs from the one she grew up with; so jumping a queue in Lisbon, crossing against the signal on a street where everyone else crosses, or leaving nothing on the table in a New York diner is at worst impolite — a breach of local etiquette rather than a wrong done to anyone.

  Second, consider a bakery in a city I will call Marisburg, where a place in line may be given away or sold and a transferred place is treated by everyone as fully valid. If the locals there are entitled to treat standing-when as a tradable good, then a visitor from Marisburg who offers to buy a place in a first-come-first-served queue elsewhere seems to be doing exactly what her own convention licenses, merely in a jurisdiction with a different arbitrary preference.

  Is the argument sound? If not, which premise fails? And does the answer come out the same for the queue, the crossing, and the tip?
reasoning: |-
  Okay, the user presents an argument about social conventions like queueing, jaywalking, and tipping. They see these as arbitrary solutions to coordination problems, where the only reason to follow them is to avoid sanctions. This leads them to two conclusions: visitors don't owe locals conformity, and people from places with different conventions (like tradable queue spots) aren't wrong to act according to their home norms elsewhere. The user doubts both conclusions and wants to know where the argument goes wrong.

  Hmm, the key issue seems to be reducing conventions to mere arbitrariness plus sanctions. The user's framing misses how conventions embed values beyond coordination efficiency. Let me unpack why their "arbitrary" premise is flawed. 

  For queueing, the "first-come-first-served" rule isn't neutral - it embodies fairness as equal opportunity based on arrival time. That's why queue-jumping feels like cheating even without formal sanctions. The moral weight comes from violating implicit reciprocity, not just dirty looks. 

  Jaywalking is trickier. When everyone crosses against the signal, the coordination value shifts from obeying lights to collective safety through mutual awareness. Here the arbitrariness claim holds better - but only if no one is endangered. If a visitor disrupts the flow and causes near-accidents, it becomes a harm. 

  Tipping reveals another dimension: economic vulnerability. In cultures where servers rely on tips, stiffing them isn't just etiquette breach - it's exploiting labor structures. The "arbitrary" label ignores how conventions sustain livelihoods. 

  On the Marisburg example: tradable queue spots might be locally coherent, but exporting that practice ignores how it alters the convention's moral calculus. Selling priority commodifies time/access in a system designed for equal treatment - a values clash, not just different preferences. 

  So the rotten step is oversimplifying conventions as value-neutral. The answer differs across examples because: queueing centers fairness, jaywalking on collective safety (when patterned), tipping on economic justice. Visitors' obligations scale with how deeply the convention ties to local welfare. 

  The user might be wrestling with cultural relativism. Underneath, they seem to want ethical consistency without blanket permission to ignore norms. A better framework: evaluate conventions by whether they promote human flourishing in context, not just "arbitrariness."
answer: |-
  Your argument contains a subtle but critical flaw in its core premise: **it assumes conventions are *merely* arbitrary coordination solutions with no underlying values.** This premise fails for most social conventions, making both conclusions unsound. Let's dissect why, examining each example:

  ### The Rotten Premise: "Pure Arbitrariness"
  Your claim that "the content of the local rule is arbitrary, and so the only consideration... is that nonconformists get sanctioned" ignores that conventions:
  1.  **Embed Values:** They often instantiate moral principles (fairness, efficiency, respect, safety, reciprocity).
  2.  **Create Legitimate Expectations:** They generate reasonable reliance on others' behavior.
  3.  **Solve Problems Beyond Coordination:** They address issues like fairness, effort recognition, or risk allocation.

  ---

  ### Refuting the Consequences

  **1. Does a visitor owe the locals nothing?**  
  **No.** While not necessarily a deep moral "wrong," nonconformity often violates **principles of fairness and reciprocity**, not just etiquette:

  *   **Queueing (Lisbon):** Jumping the queue isn't just "impolite." It violates the **fairness principle** embedded in "first-come, first-served." Everyone else invested time waiting; you gain an unfair advantage by ignoring the rule. You harm others by disrespecting their effort and time. Dirty looks are the *manifestation* of this perceived unfairness, not the *source* of the obligation.
  *   **Jaywalking (Crossing Against Signal):** If *everyone* crosses against the signal in a coordinated flow, the convention has shifted. Conforming maintains **safety and predictability.** Deliberately stopping or crossing erratically *disrupts the flow*, increasing risk for others. Your obligation stems from **not creating unnecessary risk or chaos**, not just avoiding dirty looks. If no one is crossing, crossing alone might be risky/illegal, but not necessarily a violation of a local *convention*.
  *   **Tipping (NY Diner):** This is the strongest counterexample. In systems where servers are paid below minimum wage *relying* on tips, stiffing isn't just impolite. It:
      *   **Exploits the System:** You benefit from service subsidized by others' tips.
      *   **Harms an Individual:** You directly deprive the server of expected (and often vital) income.
      *   **Violates Reciprocity:** You accept a service knowing the provider's compensation depends on your tip.
      The obligation arises from **fairness, reciprocity, and preventing harm within an established (if flawed) economic structure**, not mere etiquette. The "dirty look" reflects righteous anger at being cheated.

  **Visitor's Obligation:** A visitor *does* have an obligation grounded in **fairness, reciprocity, and avoiding unnecessary harm/disruption** within the system they are voluntarily participating in (standing in line, using the road, eating at the diner). It's not about "joining" the practice; it's about respecting the legitimate expectations and embedded values of the system you are *currently operating within*. Blaming your upbringing isn't a defense against acting unfairly *here and now*.

  **2. Is the Marisburg visitor merely acting under their own convention?**  
  **No.** Exporting the Marisburg convention ignores the **fundamental clash of values** embedded in the different rules:

  *   **"First-Come, First-Served" (Standard Queue):** Embeds values of **equal opportunity based on time investment** and **fairness through temporal order.** Time/patience is the currency.
  *   **Tradable Queue Spots (Marisburg):** Embeds values of **efficiency, willingness-to-pay, and commodification of time/position.** Money is the currency.

  **The Visitor's Mistake:** The visitor isn't just applying a different arbitrary label. They are **imposing a fundamentally different value system (commodification)** onto a system explicitly designed to operate under a different value system (temporal fairness). This violates the **legitimate expectations** of others in the standard queue who reasonably expect position to be earned by waiting, not purchased. It creates unfairness *within the context of the existing convention* by allowing wealth to bypass the effort (waiting) others invested. The sanction isn't just for breaking an arbitrary rule; it's for subverting the core fairness principle of the system they are trying to join.

  ---

  ### Does the Answer Differ Across Examples?

  Yes, **the strength and nature of the obligation vary based on the values embedded and harms prevented:**

  1.  **Queueing:** Strong obligation based on **fairness, reciprocity, and preventing free-riding.** Buying/selling spots fundamentally undermines the core value.
  2.  **Patterned Jaywalking:** Moderate obligation based on **safety, predictability, and not disrupting coordinated flow.** The core value is efficient/safe crossing, not necessarily light obedience. (Standalone jaywalking is weaker, often just risk/legality).
  3.  **Tipping (in wage-reliant systems):** Very strong obligation based on **preventing direct financial harm, fairness, reciprocity, and not exploiting a known economic structure.** Stiffing causes concrete, significant harm.

  ---

  ### Conclusion

  *   **The Rotten Step:** The premise that conventions are *purely arbitrary* coordination tools whose *only* normative force comes from sanctions ("dirty looks"). This ignores the **values (fairness, reciprocity, safety, harm prevention) embedded within conventions** and the **legitimate expectations they create.**
  *   **Why the Consequences Fail:** Nonconformity by visitors often violates fairness/reasonableness within the local system they are using, not just etiquette. Exporting a conflicting convention (like tradable spots) imposes a foreign value system that subverts the core principles of the local convention, creating unfairness.
  *   **Visitor's Obligation:** Grounded in **fairness, reciprocity, and avoiding unnecessary harm/disruption** within the local system they are voluntarily engaging with. The obligation scales with the importance of the embedded values and the potential for harm (strongest for tipping, strong for queueing, contextual for jaywalking). "I wasn't raised this way" is not an ethical justification for free-riding or causing disruption/harm within a system you choose to participate in.
