prompt: |-
  My brother-in-law is doing a philosophy MA and he sent me his one-paragraph summary of what the indicative vs counterfactual conditional distinction is supposed to be, because I'd asked him after getting confused by something on a podcast. He says it's basically the standard line and I half believe him, but he also likes sounding authoritative, so I want it audited before I repeat any of it. Here it is:

  'There are really two different connectives hiding behind the one word "if". The indicative conditional is just the material conditional: "if A then C" means not-A-or-C, so it comes out true whenever A is false. That's why "if Oswald didn't kill Kennedy, someone else did" is perfectly fine as an indicative — we know he did, so it's trivially true — but terrible as a counterfactual. The counterfactual is a different animal: you take the possible worlds closest to ours in which A is true and check whether C holds there, and in most of the nearest Oswald-free worlds nobody else shoots Kennedy either. The same point shows up in the probability work: Adams showed that how confident you should be in a conditional just is the conditional probability of C given A, full stop, and that means conditionals don't have truth conditions at all, only probabilities. So the only real puzzle left is why the two behave differently in these cases, and that's basically pragmatic — a counterfactual signals that the speaker takes the antecedent to be false, and an indicative doesn't.'

  The Oswald thing I feel in my gut: the indicative version seems okay and the subjunctive one feels like it's denying something we all take for granted. Past that I can't tell which bits are textbook and which bits are him.

  Which sentences would someone who actually works on conditionals sign off on, which are a one-sided take on a live dispute presented as settled, and which are just wrong? I have a vague memory of some famous result saying the probability equation he mentions can't hold in general if conditionals are really connectives with truth conditions — is he quietly stepping around that, or am I mixing it up with something else? And does his last move, that the whole difference is basically pragmatic, follow from anything in the earlier part of his summary, or is it a separate claim that needs its own argument?
