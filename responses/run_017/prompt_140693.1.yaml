answer: |-
  Here's a breakdown of your brother-in-law's summary, separating the solid, the contested, and the problematic bits. While he captures key ideas, it's a mix of standard views, oversimplifications of live debates, and one significant omission:

  **Sentences Someone Who Works on Conditionals Would Sign Off On:**

  1.  **"There are really two different connectives hiding behind the one word 'if'."** - This is the mainstream view. Indicative conditionals (e.g., "If it rains, the match is cancelled") and counterfactual/subjunctive conditionals (e.g., "If it had rained, the match would have been cancelled") behave very differently.
  2.  **"The counterfactual is a different animal: you take the possible worlds closest to ours in which A is true and check whether C holds there..."** - This accurately describes the Lewis-Stalnaker possible worlds semantics, the dominant framework for analyzing counterfactuals.
  3.  **"...and in most of the nearest Oswald-free worlds nobody else shoots Kennedy either."** - This correctly applies the possible worlds semantics to the Oswald example to explain why the counterfactual feels wrong.
  4.  **"The same point shows up in the probability work: Adams showed that how confident you should be in a conditional just is the conditional probability of C given A..."** - Ernest Adams's thesis (P(If A, then C) = P(C | A)) is a hugely influential and widely accepted *norm* for rational credence in indicative conditionals. It captures a fundamental intuition.
  5.  **"...a counterfactual signals that the speaker takes the antecedent to be false, and an indicative doesn't."** - This pragmatic signaling difference is a standard and widely accepted explanation for *why* we choose one form over the other in communication. (e.g., von Fintel, Gillies).

  **Sentences Representing a One-Sided Take on a Live Dispute (Presented as Settled):**

  1.  **"The indicative conditional is just the material conditional: 'if A then C' means not-A-or-C..."** - **This is highly contested and arguably the weakest part.** While the material conditional (A ⊃ C ≡ ¬A ∨ C) is the *classical logic* treatment, most contemporary philosophers and linguists reject it as an adequate analysis of the *meaning* of natural language indicative conditionals because of well-known "paradoxes" (e.g., "If I don't eat lunch today, I will eat lunch today" is true, which feels absurd; "If this rock is dropped, it will float" is true if I never drop it, which also feels wrong). The Oswald example *works* under this view, but using it to *define* the indicative is disputed. Many alternatives exist (e.g., non-truth-conditional accounts like Adams's, context-dependent strict conditionals, relevance logics).
  2.  **"...Adams showed... that means conditionals don't have truth conditions at all, only probabilities."** - **This is a specific, influential, but deeply contested position (Adams's own view).** While Adams's Thesis (P(If A, C) = P(C|A)) is central to the debate, its *interpretation* is hotly debated. Many theorists (e.g., Jackson, Griceans) argue that indicative conditionals *do* have truth conditions (perhaps material, perhaps other) but that *assertability* is governed by conditional probability. Others (like Stalnaker) try to build truth conditions compatible with Adams's Thesis. The claim that they *definitively* "don't have truth conditions at all" is Adams's specific non-propositional view, not a settled fact.
  3.  **"So the only real puzzle left is why the two behave differently in these cases, and that's basically pragmatic..."** - While the pragmatic signaling difference (point 5 above) is crucial, suggesting it's the *only* puzzle left and *basically* pragmatic **oversimplifies**. The fundamental semantic differences (possible worlds vs. ??, the nature of truth conditions) remain deep puzzles. The pragmatic signal explains *usage choice*, but the core semantic machinery underlying each type is a major ongoing research area.

  **The Significant Omission (Your Memory is Correct!):**

  *   **"I have a vague memory of some famous result saying the probability equation he mentions can't hold in general if conditionals are really connectives with truth conditions"** - **You are absolutely right.** This is **Lewis's Triviality Result** (and subsequent generalizations by others). David Lewis proved a devastating theorem: *If* we assume:
      1.  Indicative conditionals express propositions (have truth conditions).
      2.  Adams's Thesis holds universally (P(If A, C) = P(C|A) for all A, C, and probability functions P).
      3.  Some other seemingly minimal assumptions about probability and logic hold...
      *Then*, the only possibility is that the probability of C given A is *always* equal to the unconditional probability of C, which is absurd (P(C|A) = P(C) for all A, C). This forces a trilemma: reject (1), reject (2), or reject the "minimal assumptions" (though rejecting these usually involves complex, non-standard logics or probability). **Your brother-in-law presents Adams's non-truth-conditional view as the *consequence* of Adams's Thesis, but fails to mention the *reason* Adams (and others) were pushed towards this view: Lewis's proof that combining truth conditions and Adams's Thesis universally leads to triviality.** This is a massive oversight when presenting the "probability work".

  **Does the Pragmatic Move Follow?**

  *   **No, it does not follow directly from the earlier parts.** Claiming the difference is "basically pragmatic" is a **separate claim** that needs its own support. The earlier points establish:
      *   Indicatives and counterfactuals differ semantically (material vs. possible worlds, or other analyses).
      *   Indicatives obey Adams's Thesis.
      *   Counterfactuals use a closeness metric over worlds.
  *   The pragmatic signaling (indicative doesn't signal ¬A, counterfactual does signal ¬A) is an *additional layer* explaining *speaker choice* given these semantic differences and our knowledge state. It's a plausible and widely accepted explanation for *why* we use the different forms in different epistemic situations, but it's not *derived* from the specific semantic analyses he provides. It's a complementary pragmatic theory.

  **Summary Audit:**

  *   **Solid:** The distinction between indicatives/counterfactuals, possible worlds semantics for counterfactuals, the Oswald example illustrating the difference, Adams's Thesis as a norm for rational credence in indicatives, the pragmatic signaling difference.
  *   **Contested/Oversimplified (Presented as Settled):** Indicative = Material Conditional, Indicatives definitively have *no* truth conditions (Adams's specific view).
  *   **Significant Omission:** Lewis's Triviality Result, which is the *main reason* Adams's Thesis pushes many towards non-truth-conditional accounts. This is critical context missing from the "probability work" part.
  *   **Pragmatic Claim:** Plausible and standard, but a separate claim, not derived from the preceding semantics.

  **Verdict:** Your brother-in-law captures core ideas but presents contested claims (especially the material conditional analysis and the definitive "no truth conditions") as settled fact, and crucially omits the *reason* (Lewis's Triviality) why Adams's Thesis causes such headaches for truth-conditional accounts. His summary leans heavily towards Adams's specific non-propositional view without acknowledging the major arguments and alternatives surrounding it. The Oswald intuition is good, but using it to *define* the indicative as material is where the controversy starts.
