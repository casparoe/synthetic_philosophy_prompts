  Given the time, I think it's and (and in the literature) that it is difficult to have voters who are individually worse than chance while the majority is good, without having the voters be conditionally better than chance given the common factor. 

  In fact, the condition that the votes are positively correlated with the truth given the common factor is necessary for the group to do well. 

  So my conclusion is that the three specs cannot be satisfied together.

  The closest we can get is to have the individual marginal competence below 0.5, and the group competence above, but not with the group size in the range 20-300 and group accuracy >70%. 

  Or, if we allow the group size to be very large, but then we need the conditional competence given the common factor to be>0.5 in some states, and the common factor to be such that in those states the group accuracy is high.

  In our last Bayesian updating example, if we set r=0.51, then in T=1, the voters are always correct, in T=0, they are correct 10% of the time. Then group accuracy = 0.5 * 1 + 0.5 * 0.1 = 0.55, which is above 0.5 for the group, but below 70%. 

  And the individual competence is 0.55.

  To get individual competence below 0.5, we would need in both states the voters to be correct less than 50% of the time, but then the group, which is just an average, would also be below 50% in both states, so the group accuracy would be below 50%.

  Therefore, I think it's impossible.
