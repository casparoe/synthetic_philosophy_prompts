  ### Scenario: Medical Grant Review Panel  
  A national health institute uses a 101-member panel to decide whether to fund a medical research grant. The grant's true merit is either high (deserves funding) or low (does not), each with prior probability 0.5. However, the panel receives a **technical dossier** prepared by an external agency. This agency is usually incompetent: 95% of the time, it produces a dossier filled with complex jargon and misdirection that actively misrepresents the grant's merit. Specifically:  
  - When the grant is truly high-merit, a *bad dossier* (95% probability) omits key strengths and highlights irrelevant weaknesses, making it appear low-merit.  
  - When the grant is truly low-merit, a *bad dossier* (95% probability) uses impressive-sounding but meaningless statistics to make it appear high-merit.  
  - In the 5% of cases the agency is competent, the dossier accurately reflects the grant's true merit.  

  Each reviewer independently examines the **same dossier** and provides a "fund/don't fund" vote. Reviewers are intimidated by jargon; if the dossier is bad, they usually misinterpret it. Specifically:  
  - With a *competent dossier*, reviewers are 95% accurate.  
  - With a *bad dossier*, reviewers are only 40% accurate (i.e., they usually submit the wrong vote).  

  Critically, reviewers do not know the agency's competence level.  

  ### Numerical Results  
  **Individual voter accuracy** (marginal probability of being correct):  
  - Competent agency: Reviewer accuracy = 0.95 (occurs 5% of the time).  
  - Bad agency: Reviewer accuracy = 0.40 (occurs 95% of the time).  
  - *Marginal accuracy* = \( (0.05 \times 0.95) + (0.95 \times 0.40) = 0.0475 + 0.38 = 0.4275 \) (< 0.5).  

  **Group accuracy** (majority vote of 101 reviewers):  
  - **When the agency is competent (5% probability)**:  
    - Dossier is truthful. Reviewers independently vote correctly with probability 0.95.  
    - Majority accuracy ≈ 1 (by normal approximation: mean correct votes = \(101 \times 0.95 = 95.95\), SD = \( \sqrt{101 \times 0.95 \times 0.05} \approx 2.18 \)). Probability of <51 correct votes is negligible (z = (50.5 - 95.95)/2.18 ≈ -20.8).  
  - **When the agency is bad (95% probability)**:  
    - Reviewers are 40% accurate, so probability they vote correctly = 0.40.  
    - Majority accuracy = probability ≥51 correct votes.  
    - Normal approximation: mean = \(101 \times 0.40 = 40.4\), SD = \( \sqrt{101 \times 0.40 \times 0.60} \approx 4.92 \).  
    - z = (50.5 - 40.4)/4.92 ≈ 2.05; upper-tail probability ≈ 0.0202.  
    - Thus, majority accuracy ≈ 0.0202 (very low).  
  - **Overall majority accuracy** = probability agency competent × accuracy when competent + probability agency bad × accuracy when bad  
    = \( (0.05 \times 1) + (0.95 \times 0.0202) \approx 0.05 + 0.0192 = 0.0692 \) (6.92%).  

  **This does not meet the 70% group accuracy requirement.**  

  ### Why This Fails the Specifications  
  The scenario achieves individual incompetence (marginal accuracy 42.75% < 50%) and uses a natural shared factor (the dossier quality) to correlate votes. However, group accuracy collapses to 6.92% because:  
  - When the agency is bad (95% of cases), reviewers are systematically misled, and the majority almost always errs.  
  - When the agency is competent (5% of cases), the majority is correct, but this is too rare to uplift the overall accuracy.  

  **Removing the shared factor (dossier variation)**:  
  If the agency is removed and reviewers use only private signals (e.g., reading raw grant materials) with accuracy 42.75%:  
  - Group accuracy = probability ≥51 correct votes in a binomial distribution with p = 0.4275, n = 101.  
  - Normal approximation: mean = 43.1525, SD ≈ 4.98, z = (50.5 - 43.1525)/4.98 ≈ 1.48.  
  - Upper-tail probability ≈ 0.0694 → group accuracy ≈ 6.94% (similar to above).  
  - Outcome collapses: group accuracy remains low (~7%) if votes are independent.  

  ### The Core Issue and Roommate's Pushback  
  **Your roommate's argument is correct and decisive**:  
  - The Condorcet Jury Theorem assumes voters are *conditionally independent and competent given available information*. Here, "competence" should be measured conditional on the common dossier.  
  - Conditional on a *competent dossier*, reviewers are 95% accurate (>0.5).  
  - Conditional on a *bad dossier*, reviewers are 40% accurate (<0.5).  
  - The marginal incompetence arises from **Simpson's paradox**: aggregating two scenarios (good/bad dossier) where competence differs. The group’s success relies on the 5% of cases with a competent dossier, but this is too infrequent to achieve 70% accuracy.  
  - **Practical lesson undermined**: In real committees, if common evidence is usually misleading (e.g., dossiers from biased sources), the theorem’s "wisdom of crowds" fails. Independence and conditional competence are inseparable.  

  **Why the specs can’t be satisfied together**:  
  - **Individual incompetence** (<50% accuracy) requires voters to be systematically misled.  
  - **High group accuracy** (>70%) requires that either:  
    (a) Conditional competence is >50% *and* the common factor is favorable often enough, or  
    (b) Votes are positively correlated with the truth.  
  - But if the common factor is usually harmful (to achieve (a)), group accuracy is dragged down. If conditional competence is <50% (to avoid (a)), the majority errs in large groups.  
  - **What must give**: For the group to outperform individuals, voters must be conditionally competent (>50%) given the shared evidence. The "worse than useless" spec (marginal incompetence) is incompatible with robust group accuracy in realistic committee sizes.  

  ### If You Force the Scenario  
  A sharp student would note:  
  - The 40% accuracy under a bad dossier is arbitrary. If increased, marginal accuracy exceeds 50%; if decreased, group accuracy drops further.  
  - The 95% bad-agency rate ensures marginal incompetence, but worsens group performance.  
  - Real panels might detect dossier quality, violating the "no coordination" assumption.  

  **Conclusion**: The three specs cannot be jointly satisfied without violating the theorem’s spirit. Use this to teach that conditional competence given common information is non-negotiable for collective wisdom.
