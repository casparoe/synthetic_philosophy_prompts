answer: |-
  Your situation reveals a nuanced ethical conflict with three core issues: **norm disruption, distributive justice, and outsider agency**. Let's dissect the wrong-making features, compare it to queue-jumping, and propose resolutions.

  ### 1. **What Makes Your Tipping Problematic (and Why Your Friend Is Partly Right)**
     - **Unilateral Alteration of Shared Expectations**: Social norms (like no-tipping) are collective agreements. By tipping selectively, you bypassed communal consent. Like introducing a loudspeaker in a library, your action changed others' experience without consultation.
     - **Creating Unfair Pressure**: Your regulars now tip partly because *you* made it conspicuous. Staff subtly penalize non-tippers, coercing others into a practice they didn't endorse. This redistributes social power—waitstaff gain leverage, non-tipping locals lose standing.
     - **Selective Benefit & Temporal Privilege**: As a transient resident, you benefit from warmer service but avoid long-term consequences (e.g., rising expectations, staff resentment toward locals). This exploits your outsider status: you harvest goodwill without accountability.
     - **Distributive Injustice**: Tipping only "your" places creates haves/have-nots among service workers. Why should café staff receive windfalls while bus drivers or clerks get nothing? Your friend’s "tip everyone or no one" critique highlights this arbitrariness.

  **The wrong isn’t tipping itself—it’s how you implemented it.** A systemic tip culture (like in the U.S.) spreads expectations broadly; your hyper-localized approach creates pockets of inequality.

  ### 2. **Your Tipping vs. Queue-Jumping: The Principled Difference**
  Your queue-jumping friend defends his behavior as **norm-conforming** ("this is local rule"). You defend yours as **norm-improving** ("staff are better off"). This distinction is critical:

  | **Aspect**               | **Your Tipping**                          | **Queue-Jumping**                     |
  |--------------------------|------------------------------------------|---------------------------------------|
  | **Relationship to Norm** | Actively changes the norm                | Conforms to existing norm             |
  | **Social Impact**        | Creates new winners/losers               | Maintains status quo (however unfair) |
  | **Outsider Role**        | Imposes external values                  | Assimilates local practices           |
  | **Benefit**              | Personal gain (better service)           | Personal gain (faster service)        |

  **Why your action is more ethically fraught**: Queue-jumping accepts local dysfunction; your tipping *manufactures* new dysfunction. His behavior is opportunistic; yours is interventionist. Both seek advantage, but you destabilize a functional system (fair wages + no tipping), while he merely navigates a flawed one.

  ### 3. **What Should You Do?**
     - **Stop Tipping Discreetly**: Continuing fuels inequity and pressures locals. The staff’s changed behavior proves the harm.
     - **Never Tip Universally**: Forcing your norm citywide is cultural imperialism. Respect the law: service *is* included.
     - **Redirect Generosity Thoughtfully**:
       - **Option A (Direct, no reciprocity)**: Hand cash to staff with, "I’m leaving soon—thank you for great meals," making clear it’s a farewell gift, not a tip.
       - **Option B (Systemic, no feedback)**: Donate to local hospitality-worker funds or mutual aid networks. Publicize this to regulars to offset expectation you created.
     - **Repair the Norm**: Tell staff, "I’ve learned tipping isn’t done here—my mistake!" This signals respect for local rules.

  ### 4. **The Underlying Conflict: Outsider Ethics**
  You’re grappling with **temporary residency ethics**: Does short-term presence oblige stricter conformity, or permit goodwill experiments? Key principles:
     - **Do No Harm**: Avoid acts that outlast you or burden locals.
     - **Consent**: Innovate only where invited.
     - **Equity**: Benefit broad groups, not just those who serve you.

  Your tipping fails these tests; redirecting generosity passes them. Your queue-jumping friend’s conformity is defensible (if unheroic), while your disruption is well-intentioned but corrosive. **The greater wrong lies in reshaping a community’s economy for personal benefit without enduring the consequences.** 

  By shifting to non-reciprocal giving, you honor your gratitude without distorting local practice. That resolves the tension between generosity and respect.
