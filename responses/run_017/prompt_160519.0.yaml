prompt: |-
  Could you write me a satirical design doc for our eng wiki? Context: my team has to ship a service that takes someone's labs and lifestyle data and returns `is_disease: true/false`, and management's one hard requirement is that it be completely value-free — facts in, facts out, no judgement about whether anyone actually wants the condition fixed.

  So the doc should be written by an engineer who is fully bought into the naturalist way of doing this: a disease is just some part of the body failing to do what parts of that type are supposed to do, statistically atypical for people of that kind, nothing about whether its bad for you, and that's the whole story. Every design decision should follow from that seriously — I want someone who works on this stuff to read it and recogise the actual position rather than a strawman of it.

  The jokes should come from where the position genuinely strains, written as ordinary engineering detail: how we pick the reference class (age, sex, population — including the bits that get uncomfortable), what "normal environment" means when half our users sit all day in bad air, the fact that the most common things in our own dataset come back as not-a-disease under our own rules and the workaround we ship for that, and how "does this hurt survival and reproduction" smuggles in exactly the judging we were told not to do.

  ~700 words, deadpan, RFC section headings, no winking. Close with a seperate rejected-alternatives section for the other camp's design — the one where you need the dysfunction plus somebody thinking it's a bad thing — dismissed for the real reason it gets dismissed (things the manuals used to list: homosexuality, for one), with the author completely blind to the fact that his own design has the same bug one layer down.

  Add a few lines at the end on where you're taking liberties or leaning on a contested reading, and pick a reading — don't hedge.
reasoning: |-
  We are writing a design doc for a service that determines if a person has a disease based solely on naturalistic criteria, without value judgments. The engineer is fully bought into this naturalist perspective, treating a disease as a statistical dysfunction in a biological part relative to a reference class. The humor arises from the genuine tensions and contradictions in this approach.

  Key points to cover:
  - Defining the reference class (age, sex, population) and the discomfort that arises (e.g., how to handle intersex individuals, different populations).
  - Defining "normal environment" when many users are in suboptimal conditions (e.g., bad air, sedentary jobs) and how we decide what's normal.
  - The common case where prevalent conditions (e.g., myopia, obesity) might be statistically common and thus not considered diseases, and the workaround we implement.
  - How the criterion of "hurting survival and reproduction" introduces a value judgment despite the requirement to avoid it.

  Structure:
  - RFC-style headings (e.g., "1. Introduction", "2. Reference Class Selection", etc.)
  - Deadpan tone: present everything as straightforward engineering decisions.
  - Rejected Alternatives section: dismiss the "dysfunction plus disvalue" model by pointing out that it historically included things like homosexuality, and that it introduces subjective judgment. The author is blind to the fact that his own design has a similar issue (with the definition of "normal function" being value-laden).

  Finally, a few lines at the end (as a note) where we acknowledge liberties taken and a contested reading we are choosing.

  Word count: ~700.

  Let's outline:

  1. Introduction: State the goal and the naturalist definition of disease.
  2. Reference Class Selection: How we define the reference class and the issues with age, sex, population.
  3. Normal Environment Definition: The challenge of defining normal environment when many users are in non-ideal conditions.
  4. Common Conditions Workaround: How we handle conditions that are common in our dataset (like myopia) but would be considered normal by our rules, and the workaround (e.g., using historical data?).
  5. Survival and Reproduction Criterion: How we use this criterion but note that it's a proxy for biological function, while acknowledging it smuggles in value judgments about what is "good" for the organism.
  6. Rejected Alternatives: The model that requires dysfunction plus disvalue, dismissed because it introduces subjectivity and historically pathologized normal variations (like homosexuality). The author is blind that his own model has the same problem in defining "normal function".
  7. Note on Liberties: Briefly state where we are taking liberties or choosing a contested interpretation.

  Now, writing in deadpan RFC style.
answer: |-
  ### RFC: Disease Classification Service (DCS) v1.0  
  **Authors**: Engineering Team, Health Analytics  
  **Status**: Draft  

  ---

  #### 1. Introduction  
  DCS ingests user lab results (e.g., blood panels, genetic markers) and lifestyle data (e.g., activity logs, environmental exposures) to return `is_disease: true/false`. Per management directive, the system must operate value-neutrally: a "disease" is defined strictly as a statistically atypical biological dysfunction in a body part relative to a reference class, with no consideration of harm, desirability, or clinical impact. This aligns with naturalist philosophy: biology is physics, not ethics.  

  #### 2. Reference Class Selection  
  To determine statistical atypicality, DCS bins users into reference classes using:  
  - **Age**: 5-year cohorts (e.g., 30–34). Users outside human lifespan bounds (e.g., <0 or >122) are flagged as `INPUT_ERR`.  
  - **Sex**: Binary (male/female) via chromosomal markers (XX/XY). Edge cases (e.g., XXY, SRY-negative XY) are binned using majority organ function (ovaries/testes) or defaulted to male if ambiguous (99.7% coverage).  
  - **Population**: Geographically stratified by ISO 3166-1 alpha-3 codes. Users in multi-ethnic cohorts (e.g., urban U.S.) are mapped to the dominant regional genotype (e.g., "European" for Boston).  
  *Rationale*: Reference classes must be objective and discretizable. Discomfort around reductive groupings (e.g., assigning Inuit users to "Mongolian" clusters for vitamin D metabolism) is irrelevant; statistics demand hard boundaries.  

  #### 3. Normal Environment Definition  
  "Normal environment" is defined as the median conditions for a user’s reference class in our dataset. Examples:  
  - Air quality: "Normal" is PM2.5 ≤ 12 µg/m³ (global urban median). Users in Delhi (avg. 150 µg/m³) exhibiting lung decay at this threshold are classified as dysfunctional.  
  - Activity: "Normal" is ≤3k daily steps (U.S. office-worker median). Users exceeding this with exercise-induced tachycardia are flagged as diseased; sedentary users with identical vitals are normal.  
  *Edge Handling*: Environments deviating >3σ from the median (e.g., astronauts, deep-sea welders) trigger `ENV_UNSUPPORTED`.  

  #### 4. Common Condition Workaround  
  Under naturalist rules, widespread dysfunctions (e.g., myopia in 40% of adults) are statistically "normal" and return `is_disease: false`. This conflicts with user expectations (e.g., 98% of myopic users expect `true`).  
  **Solution**: Apply a temporal filter. If a condition’s prevalence increased >10% in the last century (per WHO archives), classify it as a disease. Thus:  
  - Myopia (prevalence +300% since 1950) → `true`.  
  - Obesity (BMI ≥30, +200% since 1980) → `true`.  
  - Aging (universal) → `false`.  
  *Note*: This is not a value judgment but a correction for dataset drift.  

  #### 5. Survival-Reproduction Proxy  
  The core engine flags dysfunction via deviation from evolved biological norms:  
  ```python  
  def is_dysfunction(biomarker, reference_class):  
    if biomarker in [LIFESPAN, FERTILITY]:  
      return outlier_vs_expected(biomarker, reference_class) # e.g., sperm count <5th percentile  
    else:  
      return outlier_vs_archetype(biomarker, reference_class) # e.g., hemoglobin ≠ modal value  
  ```  
  *Contradiction Note*: Using "survival/reproduction" as a proxy for function appears to smuggle in values (e.g., implying death is "bad"). However, this is a mechanical input: evolution is an observed statistical process, not a moral claim. Users who reject reproduction (e.g., elective sterilization) are still assessed against their cohort’s fertility baseline.  

  ---

  ### Rejected Alternatives  

  #### A. Dysfunction + Disvalue Model  
  *Proposal*: Require both statistical dysfunction AND subjective harm (e.g., pain, distress) to return `is_disease: true`.  
  *Rejection*: This introduces non-factual variables. Historical examples prove its hazards:  
  - Homosexuality was classified as a disease (DSM-II) due to "social impairment," despite no statistical dysfunction in reproductive anatomy.  
  - "Drapetomania" (slaves fleeing captivity) was pathologized via perceived social harm.  
  DCS avoids such errors by excluding disvalue. A dysfunction is a natural fact; whether humans "dislike" it is irrelevant.  

  ---

  ### Implementation Notes  
  - **Liberties Taken**: We treat "evolved function" as empirically deducible from population data, ignoring philosophical disputes (e.g., whether evolution has teleology). Natural selection is used as a measurable algorithm, not a normative ideal.  
  - **Contested Reading**: We reject "species-typical function" arguments (e.g., Boorse 1977) in favor of pure population statistics. If 51% of 70-year-olds have arthritis, it is normal.  
  - **Blind Spot**: The rejected model’s flaw (subjectivity) is acknowledged; the same flaw in our "survival proxy" is dismissed as irrelevant because evolution is "real."  

  **Estimated Launch**: Q3 2024. Feedback welcome.
