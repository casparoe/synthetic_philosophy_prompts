  The blinking wall scenario is where most theories implode - it forces us to define what makes a mapping "real" rather than arbitrary. That's probably the requirement that kills the most candidate theories.

  User's hidden need: They're not building a philosophy thesis but a novel. They need clear dramatic conflict points. The tension between micro closure and symbolic efficacy isn't a bug but a feature - it's where their characters' worldviews collide. The engineer might lean interventionist ("symbols matter because they let us predict and control") while the neuroscientist mocks this as instrumentalism. Ines herself might experience downward causation as real, creating existential drama when her self-symbol degrades.

