answer: |-
  Here’s the "spec" for your theory of symbolic causation, structured for dramatic tension and philosophical rigor. The core conflict arises from **Requirement 1 vs. Requirement 2** – they cannot be fully satisfied simultaneously without tradeoffs.

  ---

  ### **Desiderata for a Theory of Symbolic Causation**
  *(Non-negotiable in **bold**)*  

  1. **Non-Trivial Implementation Constraints**  
     - **Must distinguish meaningful implementations (e.g., Ines) from arbitrary mappings (e.g., the blinking wall)**.  
     - *Why*: Otherwise, any physical system (like the wall) could be called a "mind" under some interpretation.  
     - *Non-negotiable*: Without this, the concept of "symbol" collapses.  

  2. **Micro-Level Causal Closure**  
     - **Must not violate physics: all causation is microphysical; no new forces or gaps**.  
     - *Why*: The neuroscientist’s stance – if physics is complete, symbols can’t "push" atoms.  
     - *Non-negotiable*: Foundation of the engineer’s credibility.  

  3. **Symbol-Level Efficacy**  
     - Symbols must *do work* beyond prediction (e.g., Ines acts *because* she promised).  
     - *Why*: The promise scene – if symbols don’t cause behavior, the engineer’s edits are incoherent.  
     - *Negotiable*: The neuroscientist might deny this, but the plot requires it for tension.  

  4. **Counterfactual Robustness**  
     - Must ground truths like *"If Ines believed X, she would’ve done Y"* despite fixed microphysics.  
     - *Why*: The lawyer’s question – causality must explain alternatives without magic.  
     - *Negotiable*: But key for character motives and legal drama.  

  5. **Multiplicity/Overdetermination Handling**  
     - Must resolve:  
       - Timesharing (one physical event, two symbolic meanings).  
       - Relabeling cipher (same behavior, inverted semantics).  
       - Prosthesis (gradual replacement; is it still "Ines"?).  
     - *Why*: These scenes test if symbols are substrate-independent or epiphenomenal.  
     - *Non-negotiable*: Core to your novel’s tech.  

  6. **Reflexivity**  
     - Must explain self-referential symbols (Ines’s degraded self-representation).  
     - *Why*: The "self" symbol’s breakdown challenges stable identity.  
     - *Negotiable*: But critical for Ines’s character arc.  

  7. **Explanation vs. Ontology Distinction**  
     - Must clarify gaps between:  
       - *Causal efficacy* (symbols change outcomes),  
       - *Explanatory indispensability* (we need symbols to predict),  
       - *Reality* (symbols exist independently).  
     - *Why*: The neuroscientist conflates these; the engineer resists.  
     - *Non-negotiable*: Avoids straw-manning either side.  

  ---

  ### **Where the List Fights Itself**  
  **The Fatal Clash: Requirements 1 + 3 vs. Requirement 2**  
  - **Requirement 1** (non-trivial mappings) demands symbols aren’t arbitrary.  
  - **Requirement 3** (symbolic efficacy) demands symbols exert causal power.  
  - **Requirement 2** (micro closure) forbids symbols adding new forces.  
  **→ Contradiction**: If physics fully determines outcomes, symbols either don’t *truly* cause anything (violating #3) or are redundant (violating #1). **No theory fully satisfies all three.**  

  **Most Disruptive Requirement**: **#1 (Non-Trivial Implementation)**.  
  - It kills theories that reduce symbols to "any interpretation" (e.g., the blinking wall must fail).  
  - Forces hard choices: What makes a mapping "real"? Consensus? Function? This is where theories crumble.  

  ---

  ### **Scorecard of Theories**  
  *(How they fare against your scenes)*  

  1. **Epiphenomenalism** (Symbols don’t cause anything)  
     - *Fails*: The promise scene (Ines acts *because* she promised) and counterfactuals. Engineer’s interventions make no sense.  

  2. **Token Identity/Reductionism** (Symbols = specific microstates)  
     - *Fails*: Timesharing (one microstate can’t be two tokens) and prosthesis (replaced substrate). Relabeling cipher breaks symbol identity.  

  3. **Interventionist Autonomy** (Symbols as causal via abstraction)  
     - *Partial Win*: Explains engineer’s edits (tweak code → change behavior) and counterfactuals.  
     - *Fails*: Blinking wall (why isn’t it conscious?) and self-degradation (can’t handle self-reference cleanly).  

  4. **Real Patterns** (Symbols as higher-order invariants)  
     - *Partial Win*: Handles prosthesis (pattern persists) and cipher (pattern same, meaning changes).  
     - *Fails*: Timesharing (can two patterns share substrate?) and self-symbol degradation (pattern instability).  

  5. **Mechanistic Computation** (Symbols as functional states)  
     - *Partial Win*: Explains timesharing (functional roles differ) and code edits.  
     - *Fails*: Blinking wall (anything computes something) and counterfactuals (why does the function *matter*?).  

  6. **Emergent Downward Causation** (Symbols constrain microphysics)  
     - *Win*: Promise scene and counterfactuals feel intuitive.  
     - *Fatal Fail*: Violates micro-causal closure (#2). Neuroscientist would mock this as magical.  

  ---

  ### **Dramatic Implications**  
  - **Engineer’s View**: Leans **Interventionist Autonomy**. Symbols are "real" because they’re the level at which *he intervenes successfully* (editing code changes behavior predictably). But he can’t explain why the blinking wall isn’t a mind without circularity.  
  - **Neuroscientist’s View**: Leans **Epiphenomenalist/Reductionist**. "The symms shoved the symms" means symbols are *descriptions* of micro-events, not actors. She "wins" on physics but can’t explain counterfactuals or Ines’s selfhood.  
  - **Ines’s Experience**: Forces **Emergence/Real Patterns**. Her promise feels causally potent; her degradation is terrifyingly real. But this clashes with physics.  

  **Rewrite Tip**: Let each character embody a *flawed* theory. The engineer needs symbols to matter practically (#3, #5), the neuroscientist needs rigor (#2, #7), and Ines *lives* the tension (#6, the promise). Their conflict isn’t fog – it’s the unresolvable core of consciousness. Chapter 11’s climax could be Ines asking: *"If my promise didn’t move the symms, why did I cross the bridge?"* forcing both to face their theory’s failure.
