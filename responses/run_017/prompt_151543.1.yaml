prompt: |-
  hey, I'm taking a philosophy of technology course this term and we've been doing social ontology and virtual objects, and I keep running into a thing in games that I can't find a word for. sorry if this is rambly, two cases from an MMO I've played for years:

  (1) Before every raid everyone goes to a particular shrine and types a specific emote. Everyone I've ever asked says it's a hidden mechanic -- skip it and the boss gets a buff or the loot table gets worse. A couple months ago some dataminer types went through the game files and there is no such flag, nothing tied to that shrine or that emote. The practice didn't stop. People still get removed from groups for not doing it, guilds still schedule around it, and if you ask why, people say because it works.

  (2) There's a street in the main city where everyone trades. Everyone treats it as a no-PvP street and tells new players it's an official safe zone. Also not in the code. Someone attacks there maybe once a month and gets yelled at, kicked from their guild, sometimes mass-reported. Then last year the devs actually added a real safe-zone flag to that street and everybody said it had always been that way.

  So the thing I want a name for: features of a virtual world that are genuinely there -- they coordinate behaviour, people get punished over them, they show up in schedules and in the in-game economy -- but whose existence depends on each player assuming the devs put them there, while no individual player seems to have ever checked or to believe it on their own authority. Nobody is collectively accepting anything; each person is deferring to an authority they assume everyone else verified. And it's not the usual everyone-knows-that-everyone-knows situation either, because what gets shared is a belief about the devs, not about each other.

  Is there an established concept for this, or is it just an urban legend that happens to be load-bearing? I want the carving, not a label: what kind of thing this is, how it differs from its nearest neighbours (I can think of a couple -- a convention people follow because others follow it, and the code-vs-made-up-rule distinction), at what point one of these stops existing (does a patch note saying it was never real kill it? does the devs later coding it make it real retroactively, or make it a different object?), and whether the punishment in case (2) is a real harm in the same way it would be if the safe zone had been coded from the start.

  under 400 words please, and if you end up coining something I want the definition in one sentence plus one case that clearly counts and one that clearly doesn't. thanks!
reasoning: |-
  Okay, let me tackle this fascinating philosophy of technology question about emergent social constructs in virtual worlds. The user describes two compelling MMO examples where community behaviors function as game mechanics despite lacking actual coded implementation. 

  Hmm, the core tension here involves social ontology - how do these player-created "rules" gain such concrete reality within the game world? I recall Searle's institutional facts where collective intentionality creates status functions ("X counts as Y in context C"), but that doesn't quite fit since players aren't consciously agreeing - each thinks the mechanic is developer-created. 

  Ah! This is closer to what sociologists call "pluralistic ignorance" - everyone privately doubts but assumes others believe. But here it's inverted: everyone assumes others have verified the developer's intent. The shrine ritual persists because Player A thinks Player B knows it's coded, while Player B thinks Player A knows. 

  For case (2), the punishment dynamics are fascinating. Even before the safe zone was coded, violating the street rule caused real social harm (kicking, reporting) - demonstrating how community enforcement can create functional consequences as real as coded mechanics. The retroactive coding then cemented what was already socially operative. 

  I need to coin a precise term... perhaps "deferred authority construct"? Definition: A collectively maintained virtual world feature whose perceived reality stems from each participant attributing its origin to an authoritative source (e.g. developers) that never implemented it. 

  Clear example: The shrine ritual where behavioral coordination depends on assumed-but-nonexistent developer intent. Non-example: An actual coded safe zone, or a player-enforced rule where everyone knows it's community-made (like raid callouts). 

  The carving shows this differs from social conventions (conscious collective agreement) and pure urban legends (no behavioral enforcement). It collapses when authoritative denial occurs (e.g. patch notes), but interestingly, the safe zone case shows retroactive coding doesn't change its prior social reality - just shifts its ontological status.
answer: |-
  This is a brilliant case of **deferred authority constructs** in virtual worlds. Here's the carving:

  **Definition:** A deferred authority construct is a collectively sustained virtual feature whose perceived objective existence relies on each participant assuming its verification and implementation by an authoritative source (e.g., developers), despite lacking actual authoritative grounding.

  *   **Core Mechanism:** Its reality stems not from explicit collective acceptance (like a social convention) nor from code, but from the *deferral* of verification to an assumed authority. Each individual believes it exists because they assume *others* have confirmed its authoritative origin ("the devs put it there"), creating a self-reinforcing illusion of objectivity.
  *   **Distinction from Neighbors:**
      *   *Social Convention:* People follow it *because* others follow it, consciously knowing it's a group agreement (e.g., "We meet at the fountain for trades").
      *   *Actual Mechanic:* Exists in the code, verifiable independently.
      *   *Urban Legend:* A shared *belief* without enforced behavioral consequences or scheduling impact (e.g., "Whispering 'lootpls' increases drops" – but no one gets kicked for not doing it).
  *   **Existence & Collapse:** It persists as long as the deferral loop holds (individuals assume authority and others' verification). It *collapses* if the authority explicitly denies it (e.g., patch notes: "The shrine emote has no effect"). Authoritative implementation *retroactively validates* the social practice but changes its ontology from deferred construct to actual mechanic; the prior *social fact* of its enforcement remains real history.
  *   **Harm in (2):** The punishment was *real social harm* (expulsion, reputation damage) inflicted for violating a *socially objective rule*, regardless of its coded status. The harm's reality stems from the community's enforcement power, not the underlying code.

  **Coined Term:** **Deferred Authority Construct**

  *   **Definition:** A collectively operative virtual feature perceived as objectively real because each participant defers its verification to an assumed authoritative source that never implemented it.
  *   **Clear Example:** The shrine emote ritual. Its function (coordination, punishment) depends entirely on players assuming the *developers* implemented it, despite absence in code and lack of individual verification.
  *   **Clear Non-Example:** A player-organized "Auction House meetup every Tuesday at 8 PM". This is a *social convention*: participants consciously know it's a player agreement for mutual convenience, not a developer-imposed rule or mechanic. They follow it because others do, not because they assume the devs coded it.
