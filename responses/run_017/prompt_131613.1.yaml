prompt: |-
  I'm in a seminar on comparative economic history and global history, currently in the unit on the Great Divergence, and before I start writing my paper I want to settle on the standard I'm going to be held to. So: write me the desiderata that any adequate answer to the Needham-style question — why Britain and not China? — has to meet. Take the purpose as fixed: an answer is adequate if it would survive the strongest objection each camp in the literature would raise against it, at seminar-paper length. I don't want a bibliography or reading list, and please don't lean on my being able to look anything up: everything you use should be either in the givens below or reconstructible from what any educated reader already knows.

  The givens we've been working with (if you think one of them is false, argue it in the collisions section rather than quietly dropping it):

  (a) On the measures our readings use — real wages, urbanization, commercial density, agricultural productivity — the richest regions of China and of Europe look broadly comparable well into the eighteenth century.
  (b) The sustained break — self-reinforcing growth in output per head, tied to a shift toward fossil-fuel energy and mechanized production — happened first in one small corner of northwestern Europe.
  (c) Both sides had large bureaucratic states, extensive markets, and deep traditions of technical skill.
  (d) "Britain" and "China" are not comparable units: one is a small island polity, the other a continent-scale empire, so the civilization-level comparison compares objects of very different size and internal variety.

  What I want is the specification, not yet another answer. Here is my own half-finished list, which I'd like you to correct, extend, and re-cut rather than simply confirm — the thinking is supposed to be in the criteria, so tell me which of these are genuine desiderata and which are just the prejudices of one camp:

  - contrast-class sensitivity: an answer must say why the contrast is drawn where it is — why not India, Japan, or the Ottoman Empire as the comparator — and whether the answer would change shape if a different comparator were substituted;
  - an intra-European test: if the answer is really about Britain, it should also explain why the break happened there and not in the commercially advanced regions of the Low Countries or northern Italy, which shared many of the same supposed advantages;
  - the grain problem: the causal claim has to be stated at a level of aggregation at which it could be checked, given (d);
  - a swap test: if the answer cites factor F, it must explain why other places that also had F did not break through;
  - a symmetry test: the same feature must be described in vocabulary that applies to both units, so that, say, a strong state counts as capacity on one side and as despotism on the other only if the asymmetry is earned;
  - a mechanism requirement: a named pathway rather than a correlation, with the step from wages, energy prices, or state finances to the actual investment and invention decisions;
  - a timing requirement: why then, and not during the earlier commercial and technical flowerings on either side;
  - a splintering question: whether there is one divergence or several, since the crossings in urbanization, real wages, energy use, and scientific practice need not coincide;
  - a falsifier requirement: some specification of what would have to be true for the answer to be wrong, and of what kind of evidence could in principle discriminate;
  - no definitional cheating: the explanandum must not be defined so that only the winner could have satisfied it;
  - the scale of the causal claim: difference-maker against a background of shared conditions, versus sufficient condition, versus mere triggering contingency;
  - microfoundations: whether the account has to work at the level of household and firm decisions, or whether structural and Marxist-style accounts can refuse that demand.

  Write it in American English, in the following sections:

  1. "The explanandum" — about 150 words. Fix what exactly is being explained, and give your verdict on whether the question as posed is well posed; if it isn't, state the reformulation (or the several narrower questions it should be split into).

  2. "The desiderata" — about 700 words. A numbered list of the requirements an adequate answer must meet, each with the case or consideration that motivates it, each tagged as non-negotiable or as a preference of a particular camp, and each with a note on what it excludes. Include any requirement I missed.

  3. "Where the desiderata collide" — about 300 words. Which subsets cannot be jointly satisfied, and what follows from that: does the list itself show that no answer of the kind people want is available, or only that answers must be conjunctural, hedged, or reformulated? Name the single requirement that knocks out the largest number of familiar answers, and say why.

  4. "Scorecard" — about 300 words. A compact table rating the familiar families of answer against the list: the coal-and-colonies ecological windfall, the institutions-and-property-rights answer, the culture-and-religion answer, the high-level-equilibrium-trap line, and the revisionist answer that treats the late date of the break as the main point. One row each, with the single cell that most damages it.

  5. "My rubric" — about 100 words. The one sentence I should put at the top of my paper as the standard I'm trying to meet.
reasoning: |-
  Hmm, the user is in a seminar on comparative economic history focusing on the Great Divergence, specifically the Needham question of why Britain industrialized before China. They need help refining their list of desiderata for evaluating answers to this question in their upcoming paper. They've provided several givens: (a) comparable economic indicators in rich regions of China and Europe until 18th century, (b) industrialization started in NW Europe, (c) both had states/markets/skills, and (d) Britain and China are different-sized units.

  The user wants me to structure my response in five sections: explanandum, desiderata, collisions, scorecard, and rubric. They've shared their half-finished list of criteria and want me to evaluate, correct, and extend it rather than simply confirming. Their list includes contrast-class sensitivity, intra-European test, grain problem, swap test, symmetry test, mechanism requirement, timing requirement, splintering question, falsifier requirement, no definitional cheating, scale of causal claim, and microfoundations.

  For the explanandum section, I'll clarify that the core question is about the specific transition to self-reinforcing growth tied to fossil fuels and mechanization in Britain rather than comparable Chinese regions. Given (d), the comparison should be between similar economic units rather than entire civilizations. I'll suggest reformulating to focus on core economic regions.

  For the desiderata section, I'll organize their criteria into a numbered list with explanations, tagging each as non-negotiable or camp-specific. I'll add missing requirements like "irreversibility threshold" and "energy transformation specificity." I'll note where their initial criteria need refinement, like expanding the "grain problem" to include spatial aggregation.

  In the collisions section, I'll identify tensions between desiderata, especially how the "scale of causal claim" requirement conflicts with "microfoundations" and "mechanism." I'll point out that "intra-European test" combined with "symmetry" creates challenges for institutional explanations.

  For the scorecard, I'll create a table rating common explanations against the desiderata, highlighting each theory's weakest point. For example, coal-and-colonies fails the swap test, while culture-and-religion struggles with symmetry.

  Finally, for the rubric, I'll craft a single-sentence standard emphasizing conjunctural explanation with specific mechanisms that addresses timing and regional specificity.

  Throughout, I'll maintain academic rigor while using accessible language, keeping all arguments grounded in the givens without requiring external sources. I'll be critical of poorly framed comparisons while acknowledging the complexity of the divergence question.
answer: |-
  Here is your specification for evaluating Great Divergence explanations, structured as requested, based on your givens and refined desiderata.

  ---

  **1. The explanandum** (149 words)
  The core explanandum is **the sustained transition to self-reinforcing growth in output per head, fundamentally tied to fossil-fuel energy capture and mechanized production, occurring first in Britain (specifically its core industrializing regions) circa 1750-1830, despite comparable levels of economic sophistication and productivity in the most advanced regions of China (e.g., the Yangzi Delta) well into the 18th century.** The question "Why Britain and not China?" is flawed per given (d), as it compares vastly different units. An adequate answer must instead explain why *this specific transition* occurred *first* in *this specific region* (NW Europe/Britain) and not in *other highly developed, commercially sophisticated regions globally*, particularly China's most advanced cores. The reformulated question is: **Why did the transition to modern industrial growth, characterized by fossil-fuel dependence and mechanization, emerge endogenously in Britain when it did, while comparable advanced economic regions in China (and elsewhere) did not initiate a similar transition concurrently?** This focuses on the *transition mechanism* in comparable *economic cores*.

  **2. The Desiderata** (698 words)
  An adequate answer must meet these requirements:

  1.  **Contrast-Class Sensitivity (Non-negotiable):** The answer must explicitly justify why China is the primary comparator (e.g., size/complexity of advanced economy, technological sophistication pre-1750) *and* address why the breakthrough didn't occur in other plausible candidates (e.g., N. Italy, Low Countries, Japan, N. India). It must show whether substituting the comparator alters the core causal logic.
      *   *Motivation:* Given (a) & (d); avoids cherry-picking comparisons. Ensures the explanandum is "first breakthrough" not "Britain vs China".
      *   *Excludes:* Answers assuming China is the *only* relevant alternative or ignoring other advanced regions.

  2.  **Intra-European Test (Non-negotiable):** The answer must explain why the breakthrough occurred in Britain and *not* in other advanced European regions (esp. Low Countries, N. Italy) which shared many proposed British advantages (markets, institutions, finance, skills, even early science).
      *   *Motivation:* Given (b) & (c); crucial for isolating Britain-specific factors against a background of shared European conditions. Tests if proposed causes are sufficient.
      *   *Excludes:* Accounts implying "European" characteristics alone were sufficient.

  3.  **Aggregation & Grain Problem (Non-negotiable):** Causal claims must operate at a level of spatial and economic aggregation where comparison is valid per given (d). Explanations must specify the relevant *sub-unit* (e.g., Yangzi Delta vs. Lancashire; proto-industrial regions) and explain dynamics at that scale. National/imperial aggregates are often misleading.
      *   *Motivation:* Directly from given (d); avoids comparing apples (region) to oranges (empire).
      *   *Excludes:* Arguments relying solely on national-level statistics (e.g., "Chinese state policy") without linking to the dynamics of advanced regions.

  4.  **Swap Test (Non-negotiable):** If factor F is proposed as crucial for Britain, the answer must explain why other places possessing F (e.g., specific institutions in Dutch Republic, coal deposits near Beijing, market density in Lower Yangzi) did *not* trigger a similar breakthrough. F alone cannot be sufficient.
      *   *Motivation:* Basic causal logic; establishes F as a necessary condition *within the specific conjuncture* or identifies why F operated differently elsewhere. Prevents mono-causal overreach.
      *   *Excludes:* Mono-causal explanations (e.g., "coal", "property rights", "Protestantism") presented as sufficient.

  5.  **Symmetry Test (Non-negotiable):** Features must be described using comparable, neutral terminology applicable to both units. If a strong state is "oppressive" in one context but "capable" in another, the asymmetry *must be demonstrated*, not assumed. Value-laden labels require empirical justification.
      *   *Motivation:* Avoids Eurocentric/Orientalist bias; forces empirical rigor. Given (c) implies functional similarities existed.
      *   *Excludes:* Explanations relying on inherent cultural traits or teleological characterizations (e.g., "Chinese stagnation", "European dynamism").

  6.  **Mechanism Requirement (Non-negotiable):** The answer must specify the *causal pathway* linking proposed factors (e.g., factor prices, institutions, knowledge) to the *specific decisions* by economic actors (investors, inventors, entrepreneurs, workers) that led to sustained investment in fossil-fuel tech and mechanization *at that time and place*. How did macro-structures translate into micro-actions?
      *   *Motivation:* Needed to move beyond correlation; addresses the core of the transition. Given (b) is about a process of investment and innovation.
      *   *Excludes:* Purely correlational accounts; overly structural accounts lacking agency.

  7.  **Timing Requirement (Non-negotiable):** The answer must explain why the transition happened *circa 1750-1830* and not during earlier periods of high commercial activity, technical sophistication, or potential "efflorescences" in either Europe or China (e.g., Song China, Renaissance Italy, Dutch Golden Age).
      *   *Motivation:* Given (b) specifies a "sustained break" at a particular time; tests if proposed causes were uniquely present then.
      *   *Excludes:* Accounts citing factors present centuries earlier without explaining the 18th-century trigger.

  8.  **Splintering Question (Camp-specific: Revisionist/Quantitative):** The answer should acknowledge whether the divergence represents a single, sharp break or multiple, potentially asynchronous shifts (e.g., energy transition vs. institutional change vs. scientific practice) and how these relate. Must not *assume* a monolithic "take-off".
      *   *Motivation:* Reflects debates over the unity/timing of the divergence process; challenges simple narratives.
      *   *Excludes:* Overly simplified "big bang" theories of industrialization.

  9.  **Falsifier Requirement (Non-negotiable):** The answer must specify what empirical findings would contradict it. What evidence (e.g., on wages, energy prices, innovation rates, institutional function in China/elsewhere) *should not* exist if the explanation is correct? What could *disprove* the core causal link?
      *   *Motivation:* Basic standard of testability and scientific rigor. Forces specificity.
      *   *Excludes:* Unfalsifiable or overly vague explanations.

  10. **No Definitional Cheating (Non-negotiable):** The explanandum ("sustained industrial transition") cannot be defined using features that inherently exclude China/others (e.g., "unique British inventiveness"). Success cannot be baked into the cause.
      *   *Motivation:* Prevents tautology; ensures the outcome is genuinely contingent per given (a).
      *   *Excludes:* Teleological arguments where the outcome defines the necessary path.

  11. **Scale of Causal Claim (Camp-specific: Institutional/Conjunctural):** The answer must clarify the logical status of its factors: necessary condition, difference-maker against a background, sufficient condition (rarely plausible), or triggering contingency. It should identify the crucial *conjuncture* or *combination*.
      *   *Motivation:* Given the complexity, pure sufficiency is implausible; forces precision about causality. Highlights the need for combinatorial explanations.
      *   *Excludes:* Arguments implying single-factor sufficiency.

  12. **Microfoundations Demand (Camp-specific: Neoclassical/Methodological Individualist):** The account *should* demonstrate how structural factors (prices, institutions, knowledge) translated into rational (or boundedly rational) incentives and decisions by firms/households that cumulatively produced the transition. *However*, structural accounts (e.g., Marxist, ecological) may argue macro-dynamics constrain micro-choices in ways that make individual decisions epiphenomenal *for this specific transition*.
      *   *Motivation:* Connects macro to micro; preferred for explaining agency. *But* debate exists on whether structural breaks require microfoundations or operate at a system level.
      *   *Excludes:* (For those demanding it) Purely macro-structural accounts lacking any link to incentives/action; (For structuralists) Reductionist accounts ignoring systemic constraints.

  13. **Irreversibility Threshold (Non-negotiable - Added):** The answer must address what made the British transition *sustained and self-reinforcing*, preventing a reversal or stagnation like earlier efflorescences. What created the positive feedback loop?
      *   *Motivation:* Core to given (b) ("self-reinforcing growth"); distinguishes the Industrial Revolution from prior growth spurts.
      *   *Excludes:* Accounts explaining initial spark but not sustained growth.

  14. **Energy Transformation Specificity (Non-negotiable - Added):** The answer must specifically address the shift to *fossil fuels* as the primary energy source for production, not just growth or innovation generically.
      *   *Motivation:* Given (b) explicitly ties the break to fossil fuels and mechanization; this is the defining technological shift.
      *   *Excludes:* Accounts of growth that ignore the energy basis.

  **3. Where the Desiderata Collide** (298 words)
  The most significant collisions arise between:
  *   **Microfoundations vs. Structural Accounts:** Requiring detailed micro-level decision pathways (Desideratum 6 & 12) can conflict with macro-structural explanations (e.g., ecological constraints, world-systems) that see the transition as driven by systemic forces beyond individual agency. Structuralists argue microfoundations are irrelevant for epochal shifts; individualists counter that without them, the mechanism is opaque.
  *   **Scale of Causal Claim (Conjuncturalism) vs. Falsifiability & Mechanism:** Conjunctural arguments (Desideratum 11) emphasizing unique combinations are inherently complex and harder to falsify (Desideratum 9) or specify with precise mechanisms (Desideratum 6) than single-factor claims. What falsifies a unique conjuncture?
  *   **Intra-European Test vs. Symmetry Test:** Explaining Britain vs. the Low Countries (Desideratum 2) often relies on subtle institutional or factor price differences described in granular, symmetric terms. Applying the same symmetric granularity (Desideratum 5) to China is vastly harder due to scale (Desideratum 3) and source limitations, risking asymmetry by default.
  *   **Swap Test vs. Conjuncturalism:** The Swap Test (Desideratum 4) demands explaining why F elsewhere didn't work. A strong conjunctural answer (Desideratum 11) argues F *only* worked within *that specific combination* elsewhere, but demonstrating the absence of that *exact* combination globally is empirically daunting.

  These collisions don't make an adequate answer impossible, but they **force conjunctural, multi-causal, and explicitly qualified explanations.** Answers must be hedged, acknowledging complexity and evidentiary limits. They must specify *which* combination of factors in *which* spatial context triggered the *specific* feedback loops of fossil-fuel mechanization. The single requirement that knocks out the most familiar answers is the **Swap Test (4).** Mono-causal answers (coal! property rights! culture!) fail instantly. Even plausible factors (e.g., British financial innovations) stumble when asked why similar features elsewhere (Dutch finance) didn't suffice, demanding combinatorial explanations.

  **4. Scorecard**

  | Theory Family                     | Most Damaging Cell (Desideratum Violation)         | Brief Rationale                                                                                                  |
  | :-------------------------------- | :------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- |
  | **Coal & Colonies (Ecological)**  | Swap Test (4)                                      | Coal existed near Chinese industrial cores; colonies provided resources/wealth elsewhere (e.g., Spain) w/o breakthrough. Fails to explain why Britain uniquely leveraged these. |
  | **Institutions & Property Rights** | Intra-European Test (2) & Mechanism (6)           | Dutch Republic had arguably superior/comparable institutions and property rights c. 1700. Lacks clear mechanism linking "good institutions" directly to fossil-fuel investment decisions. |
  | **Culture & Religion**            | Symmetry Test (5) & Swap Test (4)                 | Characterizations of Chinese culture as "stagnant" vs. European "dynamic" fail symmetry. Similar "Protestant ethic" arguments apply to Northern Germany/Netherlands without triggering the same transition there. |
  | **High-Level Equilibrium Trap**   | Timing (7) & Irreversibility (13)                 | Why did the trap "spring" c. 1750-1800, not earlier (e.g., Song) or later? Fails to explain the self-reinforcing nature *once* the transition began. Often confuses outcome with cause. |
  | **Revisionist (Late Break Focus)** | Energy Specificity (14) & Mechanism (6)           | Emphasizing late divergence risks downplaying the *qualitative* shift to fossil-fuel dependency. Often descriptive (showing comparability) rather than explanatory for the *mechanism* of transition. |

  **5. My Rubric** (23 words)
  **To be adequate, an explanation must specify a conjunctural mechanism, operating at a regional scale, that links identifiable factors to the self-reinforcing adoption of fossil-fuel technology in Britain circa 1750-1830, while demonstrating why comparable advanced regions globally lacked this specific trigger.**
