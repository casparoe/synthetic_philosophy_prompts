  ### **The Heroic Choice Challenge: Activity Design**  
  **Goal:** Students experience the instability of the "good but not required" moral category (supererogation) through a cost-ladder scenario, a ratchet effect, and a failed quest for a non-arbitrary cutoff.  

  **Materials:**  
  - Projector: Display the "cost ladder" (10 rungs) and instructions.  
  - Whiteboard: Track votes and group thresholds.  
  - Poker chips (or stickers): 5 per student + extras for rewards.  
  - Raffle prize (e.g., chocolate bar).  
  - Index cards for private votes.  

  **Cost Ladder (Projected):**  
  *Scenario: You’re the only person who can save a drowning stranger. The cost to you:*  
  1. **Stubbed toe** (minor pain, no lasting harm).  
  2. **Ruined shoes** ($100 value).  
  3. **Sprained wrist** (painful, 1-week recovery).  
  4. **Broken arm** (6-week recovery, medical bills).  
  5. **Lose your job** (miss a critical work event).  
  6. **Severe leg injury** (surgery, 6-month recovery, permanent limp).  
  7. **Permanent paralysis** (waist down).  
  8. **Lose life savings** (all your money/retirement).  
  9. **50% chance of death**.  
  10. **90% chance of death**.  

  **Timeline (75 Minutes):**  

  ---

  ### **Part 1: Private Thresholds (15 min)**  
  **Goal:** Students privately define their "required," "praiseworthy," and "heroic" boundaries.  
  - **Rules:**  
    - Students answer on index cards:  
      - **R_required**: *Highest rung where saving is REQUIRED* (e.g., "Rung 3").  
      - **R_praise**: *Lowest rung where saving is PRAISEWORTHY but not required* (e.g., "Rung 5").  
      - **R_heroic**: *Lowest rung where saving is HEROIC* (e.g., "Rung 8").  
    - No discussion. Cards collected.  

  **Instructor Script:**  
  *"Imagine you’re the only one who can save this stranger. On your card, write:  
  1. The highest rung where you MUST save them.  
  2. The lowest rung where you’d be praised for saving, but it’s not required.  
  3. The lowest rung where it’s heroic (no one could demand it)."*  

  ---

  ### **Part 2: Group Interaction & Ratchet Effect (30 min)**  
  **Goal:** Students confront the instability of their thresholds and experience social pressure when group behavior is revealed.  

  #### **Round A: Cost-Ladder Votes (10 min)**  
  - **Rules:**  
    - Each student votes **YES/NO** for each rung (1–10) on a sheet: *"Would you save the stranger at this cost?"*  
    - Votes are private. No stakes yet.  
  - **Process:**  
    - Project the ladder. Students vote quickly (1 min total).  
    - Collect sheets. Tally votes per rung (display later).  

  #### **Round B: Ratchet Round (20 min)**  
  - **Rules:**  
    - **Stakes:** Each student starts with 5 poker chips (raffle tickets for a prize).  
    - **Social Pressure:** Before voting on each rung, reveal *"In Round A, X% of you saved at this rung."*  
    - **Reward:** For each **YES**, earn 1 extra chip (praise token). *No cost in chips—real cost is the scenario.*  
    - **Process:**  
      - **Rung-by-rung vote:** Project Round A results for Rung 1 → students vote for Rung 1 → repeat for Rungs 2–10.  
      - After all votes, distribute extra chips for **YES** votes.  

  **Instructor Script:**  
  *"Now you know what others did. For each rung, if you save, you get an extra raffle chip. But remember: the real cost is what’s on the ladder."*  

  ---

  ### **Part 3: Rescuing the Cutoff (15 min)**  
  **Goal:** Students try (and fail) to find a non-arbitrary qualitative break in the ladder.  
  - **Rules:**  
    - Form groups of 3–4.  
    - **Task:** *"Find a rung where the cost changes QUALITATIVELY (not just quantitatively). Why is it special?"*  
    - Report back: 1 minute per group.  
  - **Process:**  
    - Groups deliberate (5 min).  
    - Groups share rungs/reasons. Instructor lists suggestions on whiteboard (e.g., "Rung 4: Job loss changes life trajectory").  
    - Highlight contradictions (e.g., Group A: "Rung 4 is the break!" Group B: "No, Rung 6!").  

  ---

  ### **Part 4: Debrief & Reveal (15 min)**  
  **Goal:** Map the activity to supererogation theory and highlight instability.  
  1. **Reveal the Term:** *"Today’s idea: SUPEREROGATION—actions that are good to do, not required, and praiseworthy."*  
  2. **Map the Activity:**  
     - **Initial Pull:** Private thresholds (*R_praise/R_heroic*) = the "good but not required" intuition.  
     - **Collapse:**  
       - *"When two people debate why a 2% risk difference (e.g., Rung 4 vs. 5) flips ‘required’ to ‘optional,’ they expose arbitrariness."*  
       - Show spread of *R_required* from Part 1 cards (e.g., "Rung 3 to Rung 6!").  
     - **Ratchet Effect:**  
       - *"When you saw others’ Round A votes, did you feel pressure to save at higher rungs? That’s the ratchet: heroes raise the bar, making others feel blame for doing less."*  
       - Contrast Round A/B vote tallies (e.g., "Rung 5 saves increased by 30% after you saw others do it").  
     - **Failed Rescue:**  
       - *"You tried to find a non-arbitrary cutoff. But your reasons were subjective (‘job loss feels worse’) or circular (‘it’s where costs hurt more’). Supererogation collapses without a clear line."*  
  3. **Asymmetry & Gaps:**  
     - *"Notice: We praise heroes but don’t blame non-heroes. But in the ratchet, praise for one can feel like blame for others."*  
     - *"What we couldn’t simulate: ‘Permitted to skip’ vs. ‘not required.’ In real life, skipping isn’t wrong, but our ratchet made it feel that way."*  

  **Raffle:** Draw 1–2 chips for prizes (lighthearted finish).  

  ---

  ### **Predictable Problems & Structural Limits**  
  1. **What Will Go Wrong:**  
     - **The Act-Utilitarian:** One student saves at all rungs. *Workaround:* Use their votes to show extremism highlights the collapse ("Why is Rung 10 required but Rung 9 not heroic?").  
     - **"It Depends on the Person":** A student rejects universal thresholds. *Workaround:* Ask, *"Should moral categories depend on individual tolerance? What if heroes set new norms?"*  
     - **Time Pressure:** Voting may run long. *Mitigation:* Use aggregated voting (e.g., "Stand if you’d save at Rung 5") for Round B.  

  2. **Structural Limits (Must Explain in Debrief):**  
     - **Cannot Separate Key Concepts:** The activity blurs:  
       - *Not required* (no blame for skipping) vs. *permitted to skip* (no negative judgment) vs. *praiseworthy* (positive judgment).  
       - Students experience "permitted to skip" as "might be blamed if others do more."  
     - **Bigger Omission:** The activity cannot simulate **intrinsic motivation** (e.g., "I saved because I wanted to, not for praise"). Supererogation requires this, but our chips externalize it.  

  **Why It Works:**  
  - **Low Stakes:** Chips create light social pressure without ethical weight.  
  - **No Prep:** All materials are in-class.  
  - **Scalable:** Works for 12–18 students; groups adjust.  
  - **Aha! Moments:** The ratchet and failed cutoff make instability visceral.  

  **Instructor Tips:**  
  - **Emphasize Hypotheticals:** *"This isn’t about judging real choices—it’s about probing moral categories."*  
  - **Name the Tension:** *"Why did the hero make you feel uncomfortable? That’s the ratchet eating supererogation."*  
  - **Bridge to Theory:** End with: *"Philosophers like Urmson and Chisholm wrestled with this instability. Next class: Can we save supererogation?"*
