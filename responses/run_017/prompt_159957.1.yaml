  - Multi-component nature: compliance vs acceptance vs enforcement (phantom norm) 
  - Third-party enforcement (undetectable violations) 
  - Boundary conditions (outsider violations) 
  - Empirical consistency (variation, transmission biases, cohort death) 
  - Ontology (what norms are made of) 
  - Non-collapse into mere regularity or preference 

  I'll focus on clarity and precision, using their cases as anchors. The most challenging tension is likely between explaining compliance bottom-up and accounting for reasons to comply even with undetectable violations. The requirement that does the most exclusionary work is probably the "Normative Force Beyond Coordination Payoff" because it directly challenges reductionist accounts. Their list might reflect a bias toward seeing norms as inherently involving "oughtness," which some theorists might dispute.

  The scoring table will assess how each theory fares against the key desiderata.
answer: |-
  **Bottom Line:** An adequate theory of social norms must distinguish normative force from mere behavioral regularity, expectations, preferences, and coordination payoffs by satisfying desiderata concerning norm-specific *reasons for action*, *multi-component structure*, *third-party enforcement*, *boundary conditions*, *empirical adequacy*, *ontology*, and *non-reductionism*.

  **Desiderata for a Theory of Social Norms:**

  1.  **Normative Force Beyond Coordination Payoff (Non-Negotiable)**
      *   **Requirement:** Explain why agents experience a *prescriptive "ought"* (reason to comply) even when deviation is undetectable, unpunished, and imposes no material cost on the deviator *or* others (e.g., no coordination failure). This force must be irreducible to personal preference or expected sanctions alone.
      *   **Motivating Case:** The **Undetectable Violation** (e.g., secretly eating taboo food alone, where disgust/personal aversion isn't universal). The deviator often feels genuine *wrongness*, not just risk of sanction or preference violation. A convention theory (Lewis) fails here as deviation carries no inherent cost.

  2.  **Multi-Component Distinction (Non-Negotiable)**
      *   **Requirement:** Clearly distinguish and explain the interrelations between: **Compliance** (behavior), **Acceptance** (personal normative attitude/belief in the norm's validity), **Empirical Expectations** (beliefs about what others *will* do), **Normative Expectations** (beliefs about what others *think one ought to do* / approval/disapproval), and **Enforcement** (sanctioning behavior).
      *   **Motivating Case:** The **Phantom Norm**. Decades of stable compliance driven by normative expectations (everyone *thinks* everyone else accepts it) and enforcement, despite near-universal private non-acceptance. Collapse occurs when the lack of acceptance becomes public knowledge, dissolving normative expectations. A theory collapsing these into "preference to conform given others conform" cannot explain stability without acceptance or collapse without behavioral change.

  3.  **Third-Party Enforcement Imperative (Non-Negotiable)**
      *   **Requirement:** Explain why agents engage in costly punishment of norm violations *even when they are not personally harmed* and derive no direct material benefit from punishing. This distinguishes norms from mere conventions where "enforcement" is self-policing via coordination failure.
      *   **Motivating Case:** **Queue-Jumping**. A third party, not directly affected by the jump, often feels anger and imposes a cost (glaring, verbal reprimand, physical intervention) at personal cost/risk. Conventions (like driving side) lack this; deviation harms coordination partners directly. Theories must account for the motivation behind this "altruistic punishment".

  4.  **Boundary Conditions & Binding Force (Non-Negotiable)**
      *   **Requirement:** Explain why norms are perceived as binding on specific individuals/groups ("insiders"), why newcomers are expected (and often feel obligated) to comply, and why violations by perceived "outsiders" often provoke *stronger* negative reactions (anger, moralization) than identical violations by "insiders".
      *   **Motivating Case:** **Newcomers & Outsiders**. A tourist standing on the wrong side of the escalator (**Escalator Case**) often elicits harsher muttering/glaring than a local doing the same. Locals feel the newcomer *should* learn and comply. A theory must explain this sense of applicability and differential reaction without collapsing group identity into mere common knowledge.

  5.  **Empirical Adequacy (Non-Negotiable)**
      *   **Requirement:** Be consistent with key empirical findings: significant cross-cultural variation in norm content/fairness perceptions; variation in willingness to punish; the role of transmission biases (e.g., conformity bias, prestige bias) in norm spread/persistence; and the possibility of rapid norm death within a cohort without biological change.
      *   **Motivating Case:** **Phantom Norm Collapse** and cross-cultural studies (e.g., varying fairness norms in Ultimatum Games). Theories must accommodate rapid cultural change driven by shifting expectations/beliefs, not just slow genetic evolution.

  6.  **Ontological Clarity (Non-Negotiable)**
      *   **Requirement:** Specify the necessary and sufficient conditions for a norm's *existence*. Crucially, answer: Can a norm exist if there is widespread compliance driven *only* by empirical expectations and fear of sanctions, but *no one* personally accepts it as valid? Conversely, can a norm exist with near-universal acceptance but very low compliance?
      *   **Motivating Case:** **Phantom Norm (pre-collapse)** and **Collapsed Phantom Norm (post-collapse)**. Pre-collapse: Norm exists despite no acceptance? Post-collapse: Does the "norm" exist if everyone still remembers it and accepts it was a norm, but no one complies or enforces? A theory must define the "stuff" of norms (e.g., shared attitudes, practices, representations).

  7.  **Non-Reductionism (Non-Negotiable)**
      *   **Requirement:** Avoid collapsing normativity into either (a) a *mere behavioral regularity* plus sanctions or (b) an *aggregate of individual preferences/expectations*. The "normative" aspect must add explanatory power distinct from these elements.
      *   **Motivating Case:** **Escalator Standing**. The regularity is arbitrary, yet the reaction to deviation (glaring, muttering) exhibits a distinct *normative* character ("that's not how it's *done* here / you *shouldn't* do that") beyond simple annoyance at coordination failure or preference frustration. The theory must capture this qualitative difference.

  **Key Tensions & The Most Exclusionary Requirement:**

  *   **Primary Tension:** Requirement 1 (**Normative Force Beyond Coordination Payoff**) directly conflicts with purely bottom-up, preference/expectation/equilibrium explanations (like the housemate's queueing-as-convention view). It demands an explanation for compliance *motivation* in scenarios where no tangible cost exists for deviation, pushing towards concepts like internalized obligations, perceived collective intentionality, or irreducible shared representations of "oughtness".
  *   **Secondary Tension:** Requirement 3 (**Third-Party Enforcement Imperative**) is difficult to reconcile with strict rational choice models without introducing other-regarding preferences (e.g., for fairness, reciprocity) or group-level benefits, which themselves need explanation.
  *   **Most Exclusionary Requirement:** **Requirement 1 (Normative Force Beyond Coordination Payoff)** does the most work. It directly targets the core claim of reductionist accounts (like Lewis-style conventions) by demanding an explanation for reasons to comply *even when deviation is costless and undetected*. Most theories relying *solely* on preferences, expectations, and tangible sanctions fail here.

  **Potential Prejudice in Your List:** Your list implicitly assumes a "robust" notion of normativity involving a genuine, non-instrumental "oughtness" (Requirements 1 & 7). Some strict behavioral or rational-choice theorists might argue this "oughtness" is epiphenomenal or reducible. Your cases (especially 1 & 3) are chosen to challenge reductionism, reflecting your leaning against the "first camp".

  **Theory Scoring Table (vs. Key Desiderata):**

  | Desideratum                                  | Lewis-Style Convention (e.g., Housemate) | Social Expectations + Conditional Preference (e.g., Bicchieri) | Cultural Evolution + Punishment (e.g., Boyd, Richerson, Henrich) |
  | :------------------------------------------- | :--------------------------------------- | :------------------------------------------------------------- | :--------------------------------------------------------------- |
  | **1. Normative Force Beyond Coord. Payoff**  | **FAIL** (Only coordination payoff)      | **PARTIAL** (Depends on internalization/interpretation)       | **PARTIAL/FAIL** (Focus on sanctions; "ought" often instrumental) |
  | **2. Multi-Component Distinction**           | **PARTIAL** (Blurs compliance/expectations) | **STRONG** (Explicitly models all components)                 | **MODERATE** (Often focuses on behavior/enforcement; acceptance less central) |
  | **3. Third-Party Enforcement**               | **FAIL** (Enforcement = coordination failure) | **MODERATE** (Can model via normative expectations)           | **STRONG** (Core focus on costly punishment)                     |
  | **4. Boundary Conditions**                   | **WEAK** (Relies on common knowledge)    | **MODERATE** (Can incorporate group identity)                 | **MODERATE/STRONG** (Explicit models of group markers/identity)  |
  | **5. Empirical Adequacy**                    | **MODERATE** (Explains stability/variation) | **STRONG** (Fits experimental data well)                      | **STRONG** (Directly models transmission/variation)              |
  | **6. Ontological Clarity**                   | **MODERATE** (Relies on common knowledge/equilibrium) | **STRONG** (Defined by interdependent expectations)           | **MODERATE** (Often defined by punishment patterns)              |
  | **7. Non-Reductionism**                      | **FAIL** (Reduces to regularity + equilibrium) | **PARTIAL** (Normativity from expectations; risk of reduction) | **PARTIAL** (Normativity often reduced to sanction avoidance)    |
