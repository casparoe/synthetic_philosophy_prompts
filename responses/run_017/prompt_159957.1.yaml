  The user wants desiderata for a theory of social norms - not a theory itself, but criteria to judge whether normativity adds explanatory value beyond convention, expectation, and preference. They list several key cases that must be handled: escalator-standing (arbitrary content with non-arbitrary force), phantom norms (decades of stability collapsing overnight), undetectable violations (third-party enforcement vs self-policing conventions), and boundary problems (who norms bind and why outsiders annoy us more).

  I need to craft a rigorous set of requirements that any adequate theory must satisfy. Each requirement should specify what it demands, why it matters, whether it's non-negotiable, and be motivated by their cases. I should also highlight tensions between requirements and identify which one does the most work in excluding theories.

  For structure: I'll start with a one-sentence bottom line capturing the core specification. Then I'll list each desideratum with: label, requirement, motivating case, negotiability status. After the list, I'll discuss key tensions, the most exclusionary requirement, and potential biases in their list. Finally, I'll include a brief scoring table comparing Lewis-style conventions, social expectations accounts, and cultural-evolution-plus-punishment approaches.

  The requirements must address: 
