prompt: |-
  Hey — I write a science-and-ideas column, and I keep having the same argument with my editor. Roughly once a month I get a paper or a press release where two rival explanations fit the same data, and I want to write "scientists can't tell which one is right," and my editor says that's lazy both-sides-ism. Or the mirror image: I write "the evidence favors X," and a researcher on the losing side emails me that the data are underdetermined and I owe them a correction. I need an actual procedure I can run, not vibes.

  What I want is a decision checklist — a flowchart in words — that I can run in about twenty minutes, on the phone, usually with a scientist who is an author of one of the rival theories. I know the rough shape of the philosphy here: that hypotheses get tested in bundles rather than one at a time, so a theory can always be protected by adjusting the background assumptions around it; the difference between "we don't have the evidence yet" and "no evidence anyone could get would separate these"; and the worry that for any theory you can dream up an empirically equivalent rival, which would make the whole complaint cheap. I need that turned into something usable, and I need you to decide which of those distinctions survive the simplification and which can be dropped.

  Please build in gates for at least these:

  - Is the disagreement at the level of the theory, or at the level of the measurement model — do the rivals share the assumption that the instrument is tracking the thing it's supposed to track? If they don't, I think it's a different story, and I want to know which one.
  - Transient vs. strong underdetermination: what's the question I ask to tell them apart, and what counts as a sufficent answer? I want the scientist to have to name the experiment or dataset that would settle it and say roughly when it'll exist, and I want to know what to do when they name something but privately everyone thinks it'll take fifteen years.
  - Is the rival a real research program somebody has worked out, or what I've started calling a zombie rival: it exists as a logical possibility, nobody has shown it can reproduce the rest of the field's data, and it only ever gets wheeled out when this one dataset comes up. Give me a sub-test that kills zombie rivals without me having to accuse a source of bad faith on the phone.
  - When a theory survives a bad result by changing an auxiliary assumption, how do I tell a principled fix from a rescue job? My naive rule is: was that auxiliary already in play, and was it plausible before this dataset came in? Tell me if that rule is wrong, and what to do when the answer is genuinely unclear.
  - When the rivals really are empirically equivalent and the only thing separating them is simplicity, elegance, or fit with what the rest of the field already believes: is that evidence or is it taste? I need a sentence I can put in the piece either way that isn't dishonest.

  I also want the procedure to say where it stops with "file the both-sides version," where it stops with "file the version where one side is ahead," and where it hands the call to me or my editor because it's a stakes question rather than an evidence question — how bad it is to be wrong in each direction, who gets hurt, that sort of thing. Mark those handoffs explicitly.

  Then run it on three cases:

  1. Two models of an ancient-climate proxy. Both fit the same measurements. Model A says the proxy records ocean pH, Model B says it records temperature, and the thing that would settle it is a lab calibration nobody has ever done, which would take years.

  2. A psychology result: a training regime improves test scores. The authors' theory says it's a specific cognitive mechanism; a critic says the same pattern would appear if the effect were really just motivation, and honestly the two predict the same outcomes on every measure in the paper. Nobody has run the subgroup analysis that would separate them.

  3. A case I care about, which I want you to make come out badly for me. I've got a piece half-written where a maverick says the mainstream model only looks confirmed because every lab uses instruments from the same lineage, so one shared systematic error would explain everything — and I framed it as a near-scandal. I suspect your procedure is going to tell me this is a zombie rival and I should kill the framing. Run it and tell me honestly, including what the maverick would have to actually do to make it a live rival.

  Be explicit about what the checklist can't do. I've got a maths-adjacent degree but no stats beyond one regression course, the piece has to be filed the same day, and my editor has to sign off on any line that says a field is genuinely stuck.
reasoning: |-
  We are going to create a decision checklist (flowchart in words) that the journalist can use in about 20 minutes on the phone with a scientist. The goal is to decide how to frame a scientific disagreement in a column: whether to say "scientists can't tell which one is right" (both-sides), "the evidence favors X", or to recognize when it's a stakes question (handoff to editor).

  The checklist will have the following gates:

  1. **Disagreement Level**: Theory vs. Measurement Model
  2. **Transient vs. Strong Underdetermination**: What experiment would settle it? When?
  3. **Zombie Rival Check**: Is the rival a real research program?
  4. **Principled Fix vs. Rescue Job**: When a theory survives by changing an auxiliary assumption.
  5. **Empirical Equivalence and Non-Empirical Criteria**: Is simplicity/elegance evidence or taste?

  We also need to decide when to:
  - File the both-sides version.
  - File the version where one side is ahead.
  - Hand off to editor (stakes question).

  Then, we run the checklist on three cases.

  ---

  **The Checklist**

  **Step 0: Preliminary Setup**
  - You are on the phone with a scientist (likely an author of one of the rival theories). Explain that you are trying to understand the nature of the disagreement and that you have a few questions to clarify.

  **Step 1: Disagreement Level**
  - Ask: "Do the rival explanations agree on what the instrument is measuring, or is there disagreement about whether the instrument is tracking the intended thing?"
    - If they disagree on the measurement model (i.e., one side thinks the instrument is not tracking what it's supposed to), then note that this is a different story. The disagreement is about the validity of the measurement itself. This might require a different approach (e.g., focusing on the reliability of the instrument). This often leads to a both-sides framing because without agreement on the measurement, the data are ambiguous. However, if there is strong evidence that the instrument is valid (or not), that might tip the balance. But for now, mark this as a potential both-sides situation and move to Step 2 to see if it's transient or strong.

  **Step 2: Transient vs. Strong Underdetermination**
  - Ask: "What experiment or dataset would clearly distinguish between these two explanations? And when do you expect that evidence to be available?"
    - If the scientist can name a feasible experiment/dataset and gives a near-term timeline (within, say, 2-5 years, but adjust by field), then the underdetermination is transient. You can write: "Currently, the data do not distinguish between these explanations, but a definitive test is expected in the near future." (both-sides with a forward-looking note)
    - If they cannot name any experiment, or the experiment is not feasible (e.g., requires technology that doesn't exist, or is 15 years away), then we have strong underdetermination. Move to Step 3 to check if the rival is a zombie.
    - If they name an experiment but privately you know (or the scientist admits) it's far off, then treat it as strong underdetermination for the purpose of the current article.

  **Step 3: Zombie Rival Check**
  - Ask: "Is the rival explanation part of an active research program? That is, has it been developed to explain a broad range of phenomena, or was it proposed only to account for this specific finding?"
    - Also, if you have time, you might ask: "Has the rival been shown to be compatible with other established data in the field? Or is it only invoked for this one case?"
    - If the rival is not part of an active research program, and it hasn't been shown to account for other data, then it's a zombie. You can dismiss it as not being a serious contender. Then, you can frame the piece favoring the mainstream view (unless there are other issues). But note: if the source is the one proposing the rival, they might overstate its activity. So if in doubt, do a quick check: has there been a paper (or multiple) developing the rival beyond this one case? If not, it's a zombie.
    - If it is a real research program, then move to Step 4.

  **Step 4: Principled Fix vs. Rescue Job**
  - This step is only needed if one theory has been adjusted to fit new data and the other hasn't, and the adjustment is under fire. Ask: "Was the auxiliary assumption that was changed already under consideration before this new data came in? Or was it introduced specifically to save the theory from this result?"
    - Also: "Is this auxiliary assumption independently plausible? That is, is there any other reason to believe it besides saving the theory?"
    - Your naive rule is mostly right. If the auxiliary was already in play and was plausible before, then it's a principled fix. If it was invented post-hoc and has no independent support, it's a rescue job.
    - If it's a rescue job, then the adjusted theory is weakened relative to the rival (if the rival didn't require such a fix). You might then frame the piece as favoring the rival, or at least noting that the theory was saved by an ad hoc move.
    - If it's unclear, then note that the adjustment is controversial and frame the piece as both-sides for now.

  **Step 5: Empirical Equivalence and Non-Empirical Criteria**
  - If the two rivals are empirically equivalent (i.e., they predict the same outcomes for all possible experiments we can currently conceive) and the only difference is simplicity, elegance, or fit with background knowledge, then:
    - Acknowledge that the choice is based on non-empirical criteria. Write: "While both theories account for the data equally well, many scientists prefer [Theory X] because it is simpler/more elegant/aligns better with established principles." This is honest. Note: simplicity and fit with background knowledge are often considered legitimate criteria (e.g., Occam's razor), but they are not direct evidence. They are reasons for a preference until new evidence comes along.

  **Decision Points for Framing:**
  - **File both-sides version**: 
    - If Step 1 reveals a measurement model disagreement and Step 2 shows transient underdetermination (with a near-term test), or if Step 2 shows strong underdetermination and the rival is not a zombie (Step 3) and Step 4 doesn't clearly favor one side.
    - Also, if Step 5 shows empirical equivalence and non-empirical criteria are the only differentiators (and no clear consensus), then both-sides is appropriate.
  - **File one-side ahead**:
    - If Step 3 reveals a zombie rival, then the mainstream view is ahead.
    - If Step 4 shows a rescue job for one theory, then the other is ahead (unless the other also has problems).
    - If Step 5 shows a strong consensus based on non-empirical criteria (but note: if there's a live rival research program, be cautious).
  - **Handoff to editor (stakes question)**:
    - If the disagreement has high stakes (e.g., policy implications, potential harm) and the evidence is ambiguous, then the editor should decide how to frame the stakes. This might occur when the evidence is underdetermined (transient or strong) and the consequences of being wrong are asymmetric. Also, if the scientist indicates that the field is deeply divided and the issue is highly consequential, then hand off.

  **What the Checklist Can't Do:**
  - It can't resolve deep philosophical issues about underdetermination.
  - It doesn't do a full literature review; it relies on the scientist's answers and your background knowledge.
  - It doesn't replace statistical expertise (e.g., if the disagreement is about p-values or model fit, that might require a stats check, but that's beyond 20 minutes).

  ---

  **Running the Cases**

  **Case 1: Two models of an ancient-climate proxy.**
  - **Step 1**: The disagreement is at the theory level. Both models accept the instrument (the proxy) is measuring something, but they disagree on what (pH vs. temperature). So, measurement model is shared? Actually, no: they are using the same proxy but interpreting it differently. This is a theory-level disagreement about what the proxy records. The instrument is the same, but the calibration is in question. So Step 1: disagreement at theory level (what the proxy measures), not measurement model (they both trust the proxy data). 
  - **Step 2**: The scientist says a lab calibration would settle it, but it hasn't been done and would take years. This is strong underdetermination (because the test is not near-term).
  - **Step 3**: Both models are likely part of active research (since they are models of a proxy). Not zombies.
  - **Step 4**: Not applicable (no bad result being fixed).
  - **Step 5**: The models are empirically equivalent for the current data. The choice might be based on non-empirical criteria (simplicity, fit with other data). 
  - **Decision**: Since there's strong underdetermination and both are live programs, file both-sides. But note: if one model is much simpler or fits better with other knowledge, you might mention that as a reason for preference. However, without a clear consensus, both-sides is safe.

  **Case 2: Psychology result**
  - **Step 1**: Disagreement at the theory level (cognitive mechanism vs. motivation). They agree on the measurements (test scores) and that the training affects them. So, measurement model is shared.
  - **Step 2**: A subgroup analysis would settle it, but hasn't been run. Ask when it could be done. The scientist might say it could be done quickly (e.g., re-analyze existing data) or needs a new experiment (which might be near-term). If it's quick, then transient underdetermination. If it's not planned and might take a while, then strong. But let's assume the scientist says it's a new experiment and might take a year or two. Then transient (if near-term) or strong (if not). For the sake of this case, let's say the scientist says it could be done in 6 months (transient). 
  - **Step 3**: The critic's alternative (motivation) is a common alternative in psychology. It's a real research program (e.g., placebo effects, demand characteristics). So not a zombie.
  - **Step 4**: Not applicable (no auxiliary adjusted).
  - **Step 5**: They are empirically equivalent for the current data. But the subgroup analysis is the test. Since it's transient, we can say: "Currently, the data do not distinguish between the cognitive mechanism and a motivational explanation, but a planned experiment might resolve the issue within the next year."
  - **Decision**: File both-sides with a note about the upcoming test.

  **Case 3: Maverick vs. Mainstream (systematic error)**
  - **Step 1**: The maverick disagrees with the measurement model. They think the instruments have a shared systematic error. So this is a measurement model disagreement.
  - **Step 2**: Ask: what experiment would show that the systematic error exists? The maverick might say: use a different instrument lineage, or do a calibration with a known standard. If such an experiment is feasible and hasn't been done, then it might be transient. But if the mainstream scientist points out that the instrument has been validated in multiple ways, then the maverick might need to specify what exactly is wrong. If the maverick cannot name a feasible test, then it's strong underdetermination. Often, these claims are hard to test because the maverick might dismiss any test that uses the same instruments. 
  - **Step 3**: Is the maverick's view a real research program? Ask: "Has this rival been developed to explain a broad range of data, or is it only used to explain why the mainstream model might be wrong in this one instance?" If the maverick has not built a full alternative model that accounts for other data and has only pointed out a potential flaw, then it's a zombie. Also, if the maverick hasn't shown that their alternative can explain the existing data (without the systematic error), then it's not a live research program. 
  - **Step 4**: Not applicable (the mainstream hasn't adjusted an auxiliary to survive; the maverick is attacking the foundation).
  - **Step 5**: Not applicable because the maverick hasn't provided a full alternative theory that is empirically equivalent. They are only challenging the measurement.

  **Analysis for Case 3**:
  - The checklist would likely flag this as a zombie rival in Step 3 because the systematic error claim is not part of a broader research program that explains the data. It only exists to challenge the mainstream. Moreover, if the maverick cannot point to any independent evidence for the systematic error, and hasn't built an alternative model that fits the data, then it's a zombie. 
  - Therefore, the framing as a near-scandal is probably overblown. The proper framing might be: "Some have raised concerns about a potential systematic error, but without a full alternative model and without a feasible test, the mainstream view remains the best explanation." 
  - **What would make it live?** The maverick would need to:
    1. Develop a full alternative model that explains the existing data (including data that the mainstream model explains) without the systematic error, and show that it fits as well or better.
    2. Propose a feasible test that could detect the systematic error and then perform that test (or at least specify how it would be done).
    3. Have some independent evidence for the systematic error (e.g., from a different instrument).

  **Decision for Case 3**: Since it's a zombie rival, file the version where the mainstream is ahead. But note: if the maverick has a point about the instruments being from the same lineage, that might be worth a cautionary note. However, without a live alternative, it's not a both-sides situation.

  ---

  **Final Note**: The checklist is a tool to guide your questioning and framing. It requires judgment and might not capture every nuance. But it should help you avoid both lazy both-sides-ism and premature declarations of a winner.
answer: |-
  Below is a practical, phone-friendly decision checklist for evaluating scientific rivalries. It's structured as a flowchart in words, designed for ~20-minute calls with scientists. I'll first present the checklist, then run it on your three cases. The checklist is built on your specified gates (disagreement level, underdetermination strength, zombie rivals, auxiliary fixes, and non-empirical criteria), with explicit handoffs for framing decisions. It prioritizes distinctions that survive simplification: **transient vs. strong underdetermination**, **zombie detection**, and **principled fixes** are operationalized; deeper philosophy (e.g., "hypotheses tested in bundles") is embedded in the questions but not explicitly debated.  

  **Key simplifications/drops**:  
  - The "empirically equivalent rivals are cheap" worry is handled by the zombie gate (no need to entertain purely logical possibilities).  
  - "Underdetermination strength" focuses on feasibility/timeline, not epistemology.  
  - Background assumptions are probed via the auxiliary fix gate.  
  - Non-empirical criteria are treated as legitimate but secondary (per scientific practice).  

  ---

  ### **The Checklist: "Rivalry Triage" for Science Journalists**  
  *(Run in order; 3–5 min per gate)*  
  **Goal**: Decide between three framings:  
  - 🟢 **FILE BOTH-SIDES**: "Scientists can't yet tell which is right."  
  - 🟡 **FILE ONE-SIDE AHEAD**: "Evidence favors X, but questions remain."  
  - 🔴 **HANDOFF TO EDITOR**: Stakes/policy implications dominate; evidence is secondary.  

  #### **Gate 1: Disagreement Level**  
  **Ask the scientist**: *"Do the rivals agree on what the instruments are measuring, or is that part of the fight?"*  
  - **If they agree on measurement** (e.g., both trust the thermometer): Proceed to Gate 2.  
  - **If they disagree on measurement** (e.g., "Your instrument is flawed!"): This is a **measurement-model rivalry**. Flag it—your piece should center this. Still proceed to Gate 2, but expect a both-sides or handoff outcome.  

  #### **Gate 2: Transient vs. Strong Underdetermination**  
  **Ask**: *"What single experiment or dataset would definitively settle this? When could we realistically see it?"*  
  - **If they name a feasible experiment/dataset AND give a timeline ≤5 years**: Transient underdetermination. 🟢 **FILE BOTH-SIDES** with a forward-looking note (e.g., "A planned experiment may resolve this by 2026").  
  - **If no experiment exists, timeline >5 years, or answer is vague**: Strong underdetermination. Proceed to Gate 3.  
  - **If they name an experiment but privately you know it's implausible/long-delayed**: Treat as strong underdetermination.  

  #### **Gate 3: Zombie Rival Check**  
  **Ask**: *"Has Rival B been used to explain anything beyond this one dataset? Give me one example where it made a novel prediction or clarified an unrelated puzzle."*  
  - **If they provide a specific example** (e.g., "It also explains [X] phenomenon"): Real research program. Proceed to Gate 4.  
  - **If they can't or deflect** (e.g., "It could in theory..." or "It's the only alternative"): Zombie rival. 🟡 **FILE ONE-SIDE AHEAD** (the non-zombie side). No need to accuse bad faith—just note: "Critics argue no broader evidence supports [zombie]."  
  - **If unsure**: Ask: *"Has anyone published a paper applying Rival B to another problem?"* No → Zombie.  

  #### **Gate 4: Principled Fix vs. Rescue Job**  
  **Ask** (if one theory was "saved" by tweaking assumptions): *"Was this fix proposed or plausible before the new data came in? Is it supported by unrelated evidence?"*  
  - **Principled fix** (yes to both): Theory survives intact. Proceed to Gate 5.  
  - **Rescue job** (no to both): Theory is weakened. 🟡 **FILE ONE-SIDE AHEAD** (rival gains ground).  
  - **Mixed/Unclear**: 🟢 **FILE BOTH-SIDES** with caveat ("Some argue the fix is ad hoc").  

  #### **Gate 5: Non-Empirical Criteria (Simplicity/Elegance)**  
  **Ask**: *"If the data can't split them, why prefer one? Is it simplicity, elegance, or alignment with other theories?"*  
  - **If yes**: This is scientifically valid but subjective. Use: *"While both fit the data, many scientists favor [X] for its [simplicity/coherence with established physics], pending new evidence."*  
  - **If no consensus**: 🟢 **FILE BOTH-SIDES**.  
  - **If consensus is strong**: 🟡 **FILE ONE-SIDE AHEAD**, but label non-empirical reasons.  
  - **Handoff note**: If societal stakes are high (e.g., policy or safety implications), 🔴 **HANDOFF TO EDITOR** here.  

  ---

  ### **What the Checklist Can't Do**  
  - **Deep stats/philosophy**: Won't resolve Bayesian vs. frequentist debates or quantify underdetermination. Relies on scientist's honesty.  
  - **Timeline rigor**: Uses rough estimates (e.g., "≤5 years" is field-dependent).  
  - **Stakes judgments**: Only flags for editor handoff; doesn't weigh harms.  
  - **Certainty**: Avoids declaring a field "stuck" (editor must sign off).  

  ---

  ### **Case Runs**  

  #### **Case 1: Ancient-Climate Proxy (pH vs. Temperature Models)**  
  - **Gate 1**: Both agree on measurements (same proxy data). → Proceed.  
  - **Gate 2**: Settling experiment = lab calibration. Timeline = years (>5). → Strong underdetermination.  
  - **Gate 3**: Both are real programs (published in journals, explain other climate data). → Not zombies.  
  - **Gate 4**: No auxiliary fixes mentioned. → Proceed.  
  - **Gate 5**: Rivals are empirically equivalent. Preference based on elegance/fit with other data.  
  **Outcome**: 🟢 **FILE BOTH-SIDES** + your sentence: *"Both models fit the data, but some researchers lean toward [e.g., pH] for its consistency with ocean chemistry models, though a definitive test is years away."*  

  #### **Case 2: Psychology Training (Cognitive Mechanism vs. Motivation)**  
  - **Gate 1**: Both agree on measurements (test scores). → Proceed.  
  - **Gate 2**: Settling experiment = subgroup analysis. Timeline = short (could re-analyze existing data). → Transient underdetermination.  
  - **Gate 3**: Motivation is a real program (e.g., explains placebo effects in other studies). → Not zombie.  
  - **Gate 4**: No fixes mentioned. → Proceed.  
  - **Gate 5**: Empirically equivalent; preference may lean toward cognitive mechanism for specificity.  
  **Outcome**: 🟢 **FILE BOTH-SIDES** with transient note: *"The data don't yet distinguish whether cognitive gains or motivation drives results, but targeted re-analysis could clarify this soon."*  

  #### **Case 3: Maverick vs. Mainstream (Shared Systematic Error)**  
  - **Gate 1**: **Disagreement on measurement**! Maverick claims instruments are flawed. → Flagged.  
  - **Gate 2**: Ask maverick: *"What experiment would prove your error exists?"* Likely answer: "Use different instruments!" → But if all labs use same lineage, no alternative exists → Strong underdetermination.  
  - **Gate 3**: Ask maverick: *"Has your rival model explained anything beyond critiquing this data?"* If they say no (or only vague "it could"), → **Zombie rival**. If they cite papers applying it elsewhere, proceed.  
  - **Gate 4**: Mainstream didn't "fix" anything; maverick is attacking foundations. → Not applicable.  
  **Outcome**: Likely 🟡 **FILE ONE-SIDE AHEAD** (mainstream). Your framing was overdramatic; this is a zombie unless the maverick has a real program.  
  - **To make it live**: Maverick must show their model **explains other data** (e.g., predicts instrument behavior in unrelated experiments) AND **proposes a feasible test** (e.g., "Build a new instrument with [specific] design"). Without this, it's not a scandal—it's a fringe critique.  
  **Honest take**: Kill the "near-scandal" frame. Use: *"While most researchers trust the instruments, a few argue shared design flaws could skew results—though no alternative model yet explains the full body of evidence."*  

  ---

  ### **Summary of Handoffs**  
  - **🟢 FILE BOTH-SIDES**: Transient underdetermination OR mixed auxiliary fixes OR empirical equivalence with no consensus.  
  - **🟡 FILE ONE-SIDE AHEAD**: Zombie rival OR clear rescue job OR strong non-empirical consensus.  
  - **🔴 HANDOFF TO EDITOR**: High-stakes consequences (e.g., if wrong theory influences policy) OR evidence-debate is secondary to ethics/equity.  

  This procedure minimizes vibes, focuses on tractable distinctions, and forces scientists to commit to tests/timelines. For your workflow: If Gates 1–3 point to zombie + measurement disagreement, you'll usually file one-side ahead; if Gates 2 + 5 show transient equivalence, file both-sides. Run it verbatim on calls—it’s designed for speed and defensibility.
