  We are designing an activity to illustrate the ambiguity in interpreting replication failures, the role of unmeasured moderators, and how frequentist and Bayesian approaches might differ in handling this. The key is to avoid the standard p-hacking lesson and instead focus on the uncertainty between false positive and effect heterogeneity.

  Core Idea:
  - Each lab (table) has a hidden moderator (a die) that determines the true effect size for their population. We want participants to experience that without knowing about the moderator, they will struggle to interpret replication results.

  Concerns:
  - We don't want to rig the game toward Bayesian thinking by building in a distribution. However, note that the real world does have effect heterogeneity, so we are modeling that. The frequentist approach in the activity will assume a fixed effect, which is the point of contrast.

  Proposed Activity: "The Replication Challenge"

  Materials per table (4 tables of 4 people each, or adjust as needed):
  - 1 six-sided die (the moderator die) - kept hidden until the end.
  - 1 coin (fair) for each participant (or per table if time is short) to simulate data collection.
  - Cards: Each table gets a set of cards that define their "lab conditions" (but the key moderator is the die, which is not on the card).
  - Whiteboard for the whole room to record results.
  - Chips or tokens for payoffs.

  Setup:
  - Each table is a lab. They are going to run a simple experiment and then try to replicate others.

  The Effect:
  - We are studying a binary outcome (e.g., coin flip) but with a potential bias. The true effect for a table is determined by their moderator die:
    - 1 or 2: Null effect (coin is fair, 50% heads)
    - 3 or 4: Small effect (coin is slightly biased: 60% heads)
    - 5 or 6: Large effect (coin is highly biased: 80% heads)

  But note: Participants don't know about the moderator die! They are told that they are all studying the same phenomenon.

  Procedure:

  Part 1: Original Study (15 minutes)
  - Each table runs an original study. They flip their coin 20 times and record the number of heads.
  - They calculate a p-value (using a one-sample test against 0.5, e.g., binomial test) for the hypothesis that the coin is biased (two-tailed). They can use a provided table or a simple formula (or an app on the instructor's laptop if needed, but avoid per person).
  - They report their result to the central whiteboard: lab name, n, number of heads, p-value, and whether p<.05.

  Part 2: Replication (30 minutes)
  - Now each lab must choose one published study (from the whiteboard) to replicate. They can only replicate a study that was significant (p<.05) because that's what gets published. They must use the same n (20 flips).
  - They run the replication using their own coin (which, unknown to them, has a bias determined by their moderator die). They record the same data and p-value.
  - They report: which study they replicated, their own lab's result (n, heads, p-value, and whether it replicated at p<.05 and same direction).

  Part 3: Interpretation and Betting (30 minutes)
  - Now the whiteboard has original studies and replications. Some replications will succeed, some fail.
  - Each lab is given 10 chips. They must place bets on the following questions (each bet is 1 chip, and they can spread chips across multiple answers):
    a) For a specific original study that was replicated and failed: why did it fail?
        Option 1: The original was a false positive.
        Option 2: The effect is real but varies across labs (due to unmeasured factors).
    b) Overall, what proportion of the originally significant effects are real? (Options: 0-20%, 20-40%, 40-60%, 60-80%, 80-100%)
    c) (Optional) Which of the following strategies is best for science? (They might not have enough info, but we want their gut reaction)
        - Run more replications in different labs.
        - Run one big multi-lab study.
        - Do a meta-analysis of existing studies.
        - Abandon this research and study something else.

  - They place bets by putting chips in cups labeled with the options.

  Part 4: Reveal and Debrief (15 minutes)
  - Reveal the moderator die and explain that each lab had a different true effect size. Show the mapping (1-2: null, 3-4: small, 5-6: large).
  - Each table then reveals their die roll (so we see the distribution) and their true effect.

  Debrief Points:
  1. The original studies: Some were false positives (if a null lab got lucky), some were true effects (but note: even a true effect in one lab might not replicate in another if the moderator changes).
  2. The replications: Why did some fail? Because the replicating lab had a different true effect (or null) than the original. This is the ambiguity we wanted: without knowing about the moderator, we couldn't tell if the original was false or the effect varies.
  3. The betting: How did they decide? Some might have thought the effect is fixed (frequentist) and thus a failed replication means the original was false. Others might have thought there's variation (Bayesian) and thus it could be real but different.
  4. Formal mapping:
     - Frequentist approach: Assumes a fixed effect. The p-value is about the probability of the data under the null. Replication failure is evidence against the fixed effect.
     - Bayesian approach: Would start with a prior on the effect size and also on the heterogeneity (how much it varies). The likelihood would average over the possible effects. A failed replication in a different lab might not change the belief about the original lab's effect, but it would update the belief about the general effect or the heterogeneity.

  Payoff:
  - The chips are used for betting. At the end, for each question, the correct answer (as revealed by the moderator) gets the chips. But note: for question (a) about a specific failed replication, the "correct" answer might be both? We have to define:

    For (a): 
      - If the original lab had a null effect and the replication lab also had null: then the original was a false positive? Actually, the original got a false positive (by chance) and the replication correctly found null. So Option 1 is correct.
      - If the original lab had a true effect (say large) and the replication lab had null: then Option 2 (effect varies) is correct because the original was not a false positive, but the effect varies.

    But note: if the original had a true effect and the replication had the same true effect but the replication failed (by chance), then we have a false negative. But the question is about why it failed? In that case, it's just chance (neither 1 nor 2). However, we must avoid this complexity.

    We need to simplify: the moderator die is fixed per lab, so if the original had a true effect and the replication lab had a different true effect (or null), then the failure is due to heterogeneity. If the original was null (and got a false positive) and the replication lab (whatever it is) gets a non-significant result, then the failure is because the original was false.

    However, note: the replication lab might have a true effect but get a non-significant result by chance (false negative). We don't want to get into that.

    Alternative: We don't assign a "correct" answer for each bet until we reveal the truth. We can say:
      - The original was a false positive if the original lab had a null effect (regardless of the replication lab).
      - The failure is due to heterogeneity if the original lab had a true effect and the replication lab had a different true effect (or null).

    But note: if the replication lab had the same true effect and still failed, that's a false negative and not heterogeneity. So we must check the moderator of both.

    This might get messy. Therefore, let's change the betting question to:

    a) For a specific original study that was replicated and failed: what is the truth about the original study?
        Option 1: The original study was a false positive (i.e., the true effect in that original lab was null).
        Option 2: The original study was a true effect (i.e., the true effect in that original lab was non-null) but the effect is not the same in the replication lab.

    Then the correct answer is:
        Option 1 if the original lab's die was 1 or 2 (null).
        Option 2 if the original lab's die was 3,4,5,6 (non-null) AND the replication lab's die was different (so that the replication failed). But note: if the replication lab had the same non-null effect and still failed (due to chance), then Option 2 is still true (the original was true) but the replication failed due to chance? We don't have that option.

    This is getting too complex.

    Revised betting question to avoid this:

    Instead, we can have them bet on the cause of the failure of a replication, but we'll define the cause as:
      - If the original lab had null: then the failure (i.e., the replication not finding the effect) is because the original was false.
      - If the original lab had non-null and the replication lab had different (including null): then the failure is due to heterogeneity.
      - If the original lab had non-null and the replication lab had the same non-null: then the replication might have succeeded or failed by chance. We don't want to include these cases in the betting because they are ambiguous.

    So in the activity, when we look at a failed replication, we will only consider those pairs where either:
        - The original was null (so the replication failure is expected and due to false original) OR
        - The original was non-null and the replication lab had a different effect (so heterogeneity).

    We will ignore the cases where the replication failed even though the true effect was the same (false negative) because that adds noise and isn't the point.

    How to ensure that? We can't control the coin flips. But note: the true effect sizes are fixed by the die, so we know the ground truth. In the debrief, we can show for each failed replication what the true reason was.

    So in the betting, for each failed replication, we will have two cups: 
        Cup 1: "The original was a false positive"
        Cup 2: "The effect is real but varies across labs"

    And we assign the correct answer after the reveal.

    For the overall proportion (question b), we can compute the proportion of originally significant studies that were non-null (i.e., original lab die 3-6 and they got p<.05). But note: even if the original lab had a non-null, they might not have gotten p<.05 (false negative). So we must base it on the studies that were published (i.e., significant). The proportion of published studies that are non-null is the positive predictive value.

    We can compute: among the original studies that were significant, how many had a non-null effect? That's the PPV.

    Then the correct bin for (b) is the one that contains the actual PPV.

    For (c), it's more subjective, but we can say the best strategy is a multi-lab study because it directly estimates the heterogeneity? But we don't have to have a correct answer for (c). We can skip (c) or use it for discussion.

  Timeline (90 minutes total):

  - 0-5 min: Introduction to the activity. Explain that they are labs studying the same phenomenon (coin bias). They will run an experiment and then try to replicate. They don't know that there might be differences between labs.

  - 5-20 min: Part 1 - Original study. Each lab flips their coin 20 times, records heads, computes p-value (binomial test: they can use a table that gives p-values for number of heads out of 20). They report on the whiteboard.

  - 20-50 min: Part 2 - Replication. Each lab chooses one published (significant) study to replicate (they can choose any that is significant). They flip their own coin 20 times and compute the p-value. They report which study they replicated and their result.

  - 50-80 min: Part 3 - Interpretation and Betting. The instructor writes on the whiteboard the replication results next to the original. Then the instructor selects a few failed replications (say 2 or 3) and for each, the labs place bets on why it failed (using chips). They also bet on the overall PPV. They can discuss at their tables.

  - 80-90 min: Part 4 - Reveal and Debrief. Reveal the moderator die and the true effects. Show for each failed replication the true reason. Pay out chips for correct bets (if any). Then discuss the points above.

  What will go wrong:

  1. The table that draws a null effect might become skeptical and think the effect is always null. They might not want to replicate or might interpret everything as null. How to handle: Emphasize that they are to do the experiment as they would in real life. Also, in the replication, they are using their own coin (which has the same null effect) so when they try to replicate a significant finding, they will likely fail. Then in the betting, they might bet on false positive. That's okay because that is their experience. The reveal will show that their null was only for their lab.

  2. One loud person taking over: Assign roles at each table: e.g., one flipper, one recorder, one calculator, one spokesperson. Rotate or assign randomly. Or use structured discussion techniques (e.g., think-pair-share).

