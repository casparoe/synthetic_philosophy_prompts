  ### Structured Activity: "The Ambiguous Replication Game"  
  **Core Insight**: Participants experience the ambiguity of replication failures (false positive vs. unmeasured moderator) and how frequentist/Bayesian toolkits diverge without explicit instruction. The hidden "moderator die" creates controlled heterogeneity, but we avoid rigging toward Bayes by letting groups *infer* fixed effects first.  

  ---

  ### **Materials**  
  - **Per table (4 tables × 4 people)**:  
    - 1 hidden six-sided "moderator die" (instructor pre-rolls secretly; groups never touch it).  
    - 2 coins (1 fair for all, 1 biased based on die roll).  
    - 20 outcome tokens (e.g., red/blue cards) for data generation.  
    - Binomial test cheat sheet (p-values for n=20).  
    - 10 betting chips (non-monetary).  
  - **Central whiteboard**: Tracks studies, replications, and bets.  
  - **Leaderboard**: Points for successful bets.  

  #### **Effect Size Setup (Hidden from Participants)**  
  - **Moderator die roll** determines a table’s true effect:  
    - 1–2: Null (50% "success" rate) → Use **fair coin**.  
    - 3–4: Small effect (65% success) → Use **biased coin** (e.g., weighted/DIY: 13 blue cards, 7 red in a bag).  
    - 5–6: Large effect (80% success) → Use **biased coin** (16 blue cards, 4 red).  
  *(Note: Effects are calibrated for high power to minimize false negatives, emphasizing moderator ambiguity.)*  

  ---

  ### **Rules & Timeline (90 Minutes Total)**  
  #### **0–10 min: Setup & Original Study**  
  - **Instructor script**: "You’re all studying the same effect: Does flipping a coin/token increase ‘success’ (blue) rates? Run 20 trials per table. Report if your study is ‘significant’ (p < 0.05, one-tailed test for increase)."  
  - **Activity**:  
    - Tables generate data (flip coin/draw token) and test with binomial cheat sheet.  
    - **Whiteboard**: Record table ID, # successes, p-value, significance (✓/✗). Only ✓ studies are "published."  

  #### **10–35 min: Replication Phase**  
  - **Rules**:  
    - Each table replicates **one** "published" study from another table (randomly assigned to avoid cherry-picking).  
    - Use *their own* materials (biased/fair based on hidden die). Same n=20.  
    - Report: Replicates original? (✓ = p < 0.05 *and* effect in same direction).  
  - **Whiteboard**: Add replication outcomes next to originals (e.g., "Table 1 → Table 3: ✗").  

  #### **35–60 min: Interpretation & Betting**  
  - **Rules**:  
    - Each table gets 10 chips to bet on **2 questions**:  
      1. **Why did a specific replication fail?** (Choose one per failure):  
         - 🎲 "The original was a false positive."  
         - 🌍 "The effect differs across contexts."  
      2. **Overall, what % of published originals are true effects?** (0–20%, 20–40%, 40–60%, 60–80%, 80–100%).  
    - Bets placed secretly (chips in cups labeled with options).  
  - **Instructor**: Selects 2–3 failed replications for betting. Uses ambiguous cases (e.g., original had strong p-value but replication failed).  

  #### **60–75 min: Reveal & Score**  
  - **Step 1**: Reveal the hidden moderator die and its meaning. Each table reveals their pre-rolled effect size (null/small/large).  
  - **Step 2**: For each bet, reveal ground truth:  
    - "False positive" correct **only if original table had null effect**.  
    - "Effect differs" correct **if original had non-null effect BUT replicator had different effect size** (e.g., original large, replicator null).  
  - **Scoring**: Double chips for correct bets. Leaderboard points for most chips won.  

  #### **75–90 min: Structured Debrief**  
  **Map Activity to Concepts**:  
  | **Activity Moment**          | **Formal Concept**                                  |  
  |------------------------------|----------------------------------------------------|  
  | Hidden die revealed          | **Unmeasured moderator** causing effect heterogeneity |  
  | Betting on "false positive"  | **Frequentist default**: Fixed effect, false discovery rate |  
  | Betting on "effect differs"  | **Bayesian prior**: Effect size varies across contexts |  
  | Confusion over failed rep    | **Ambiguity**: Sampling error (fixed effect) vs. moderator (varying effect) |  
  | Meta-bet on % true effects   | **Positive Predictive Value** (PPV) depends on prior + heterogeneity |  

  **Key Discussion Prompts**:  
  1. "When your replication failed, did you assume the original was false? Why?"  
  2. "If effects *can* vary, what’s better: 10 replications in 10 labs, or 1 big multi-lab study? Why?"  
  3. "Why did the same data lead some to bet 'false positive' and others 'effect differs'?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Null table declares effect fake and digs in"**:  
     - **Prevention**: Assign roles (e.g., "data collector," "statistician," "skeptic," "optimist") to diversify perspectives.  
     - **Mitigation**: In debrief, highlight: "Table 3 had a null effect, but Table 1 had a large effect. Did Table 3’s experience generalize?"  

  2. **Loud blogger dominates**:  
     - **Solution**: Use "think-pair-share" betting: Tables discuss quietly first, then vote with chips. Award points for consensus.  

  3. **Low statistical power distorts outcomes**:  
     - **Mitigation**: Use high-effect sizes (65%/80%) to minimize false negatives. If a table’s results defy odds (e.g., null table gets p<0.05), use it to discuss sampling error!  

  4. **Chaos in replication assignments**:  
     - **Solution**: Pre-assign replication targets (e.g., Table 1 → Table 2, Table 3 → Table 4) to ensure cross-group comparisons.  

  ---

  ### **What This Activity Can’t Teach (Requires Direct Statement)**  
  - **Frequentist vs. Bayesian math**: The activity *shows* why the divide matters but can’t derive p-values or posteriors. State:  
    > "Frequentists control error rates under a *fixed* effect model. Bayesians explicitly model *variation* in effects (e.g., via priors on heterogeneity), updating beliefs with data averaging over unknowns."  
  - **Preregistration’s role**: Clarify post-activity: "Preregistration fixes p-hacking but not heterogeneity. Big-N reduces sampling error but not moderator variation."  

  ---

  ### **Honest Confidence Assessment**  
  - **High Confidence**:  
    - The die creates tangible heterogeneity ambiguity.  
    - Betting surfaces heuristic reasoning (fixed vs. varying effects).  
    - Debrief maps cleanly to frequentist/Bayesian priorities.  
  - **Medium Confidence**:  
    - Effect sizes (65%/80%) balance power and realism. Tested via simulation (false positive rate ~5%, power ~90% for large effects).  
    - Betting avoids "loud voice dominance" with structured roles.  
  - **Low Confidence**:  
    - Whether philosophy students will *engage* with stats. Mitigation: Emphasize interpretation over calculation.  
    - Time management during replications. Mitigation: Use pre-made card decks (not coins) for faster data gen.  

  **Final Note**: The die doesn’t "rig" toward Bayes—it creates a *deliberate ambiguity* both frameworks must resolve. If you explicitly state one takeaway, make it:  
  > **"Replication failures can mean two things: a false positive or unmeasured variation. Your toolkit shapes which you see."**  

  ---  
  **Run it, then iterate**. This works if your goal is *experiential ambiguity* over doctrinal instruction. If you pilot it, I’d love feedback!
