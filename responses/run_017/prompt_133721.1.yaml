     - Connect to frequentist vs. Bayesian: 
          Frequentist: assumes a fixed effect. A failed replication is evidence against that fixed effect.
          Bayesian: can incorporate a prior about heterogeneity (how much the effect varies across labs). Then a failed replication in a different lab doesn't necessarily mean the original was false, but it updates our belief about the overall effect and the heterogeneity.
     - The replication crisis: when we see failed replications, it might not be because the original was wrong, but because the effect is context-dependent. And piling on more single replications without modeling the heterogeneity might not help. We need multi-lab studies or meta-analyses that model the variation.

  This should meet your goals.
