prompt: |-
  Last week we had a visiting speaker in the department on laws of nature — broadly Humean supervenience versus the necessitation crowd — and in Q&A I asked the thing I always end up asking: if the law facts are nothing over and above the mosaic of particular matters of fact, what makes it true that the law explains its instances rather than the instances merely adding up to the law? You know, the asymmetry. He killed it with one line: "laws don't govern the events, they just describe them." Then he moved on, and the room sort of nodded.

  I don't think the nodding was agreement with anything in particular, and I have to teach this to my grad seminar on Thursday, so I want to put on the board the different precise claims that sentence could be making. Here's roughly where my head is, but it's mushy and I'd like it sharpened and corrected:

  1. The platitude: "obey" and "govern" are metaphors — no legislator, no sanctions, nothing enforced. True, and nobody on the other side denies it.
  2. The category claim: laws *are* descriptions — representational or linguistic items, not features of the world. This one I think has real trouble with laws nobody has ever formulated and with laws whose instances never occur.
  3. The supervenience claim: whatever makes a law-statement true is just how the particular facts are distributed, nothing extra in the world.
  4. The epistemic claim: we read laws off the data, so a law can't turn around and explain the data — inference and explanation run in opposite directions, so there's a circle. I think this is just confused, but I want to say exactly why.
  5. The deflationary modal claim: laws carry no nomic necessity and no counterfactual import at all; "law" just marks a well-confirmed regularity. I take this to be false, or at least stronger than anything a Humean needs.
  6. What I've started calling the filing-cabinet reading: a law explains not by *doing* anything to its instances but by compressing a lot of cases under one compact generalization — explanation as economical description rather than as production.

  Then the part I actually care about: which of these, if any, would get him his conclusion? I.e., which reading licenses "so nothing needs pushing, your asymmetry worry is a pseudo-problem"? My suspicion is that only the platitude does any dismissive work, and the platitude is perfectly compatible with everything the anti-Humean believes; whereas the reading that would really do the work is 6, and 6 is a substantive thesis about explanation that needs an argument, not a sentence.

  Here's the test case I keep using and want run through the menu: suppose a world just like ours except that one single micro-event goes the other way from what our best generalizations predict. Does the law still obtain there? On a "strict summary" reading of *describe*, no — one exception falsifies it. On a "best compression" reading, yes — the generalization still wins on the simplicity/strength tradeoff. On a governing reading, the deviant event wasn't merely unlikely, it was nomically excluded. So the slogan as stated doesn't settle it, and I want to know which reading puts us in which position and whether any of them is obviously the right one.

  So: handout, please. Lay the readings out as a list with verdicts — trivial, substantive and defensible, substantive and needs an argument, or just false — say for each whether it supports swatting my question, and tell me what I've missed or where I'm conflating things. I worry in particular that I'm running together "describes" in the sense of *is a statement about* with "describes" in the sense of *merely summarizes what happened*, and those seem to pull in opposite directions on case 2. Casual register is fine, it's for a seminar not a journal.
reasoning: |-
  Okay, let me start by unpacking the user's query. They attended a talk on laws of nature where the speaker dismissed their question about the asymmetry between laws explaining instances versus instances summing up to laws. The speaker's one-liner was that laws "don't govern, they just describe." The user, who's teaching a grad seminar, wants to clarify what exactly that statement means and which interpretations would actually address their original concern.

  First, I need to break down the possible readings of "laws just describe." The user has already listed six interpretations, but I should check each for clarity and correctness. The user’s main goal is to identify which reading supports the speaker's dismissal of the asymmetry problem. They also want to know if any reading is trivial, substantive, or false, and how each holds up against the test case of a world with one deviant micro-event.

  Starting with the platitude (1). The user thinks this is uncontroversial and doesn't resolve the asymmetry. I agree. Both Humeans and anti-Humeans can accept that governance is metaphorical. So this doesn't help the speaker's point.

  Next, the category claim (2). If laws are purely linguistic, that causes issues with unformulated laws or laws without instances. The user is right that this is problematic. But even if true, it doesn't directly address why explanation asymmetry is a non-issue. It might even make explanation harder to justify. So this reading doesn't dismiss the user's concern.

  Supervenience claim (3). This is core to Humeanism but doesn't by itself solve the asymmetry. The user’s question is about why the law explains instances if it's just a summary. Supervenience states the ontological point but doesn't tackle the explanatory direction. So it's necessary but insufficient for the speaker's dismissal.

  Epistemic claim (4). The user thinks this is confused. They're correct that inference and explanation aren't always opposite. For example, laws can explain before all data is known. This confuses epistemology with metaphysics and doesn't resolve the asymmetry issue. So it's not a strong support for the speaker.

  Deflationary modal claim (5). This denies any necessity, reducing laws to regularities. The user notes this might be stronger than needed. But even if true, it doesn't automatically address explanation asymmetry. It removes one aspect (necessity) but doesn't explain why summarizing should provide explanatory power. So it's not sufficient for dismissal.

  Filing-cabinet reading (6). Here, explanation is about compression. This could address the asymmetry by redefining explanation. If the speaker means this, it's substantive and argues that explanation isn't causal but descriptive. The test case shows that under best compression, the law still holds with one exception. This directly counters the asymmetry worry by redefining what explanation is. So this reading does the work but requires argument.

  The user’s test case is crucial. Under strict summary, the law fails with one exception. Best compression allows exceptions if the law is still the simplest. Governing views see the exception as impossible. The speaker's slogan doesn't specify, so only reading 6 aligns with allowing the law to still explain despite the exception.

  The user suspects that only the platitude is dismissive but compatible with anti-Humeanism, while reading 6 is substantive. That seems right. The speaker likely conflates the platitude with the substantive claim of explanatory compression. To dismiss the asymmetry, they need reading 6, which needs justification.

  The user also worries about conflating "describes" as statement vs. summary. In category claim (2), "describes" as linguistic item struggles with unformulated laws. In epistemic (4) and filing-cabinet (6), it's about summarization. This distinction matters, but only reading 6 offers a path to resolve asymmetry.

  Missing points? Maybe the pragmatic view of explanation where laws are tools for prediction, not ontological. But that overlaps with reading 6. Also, the difference between descriptive and explanatory adequacy, but the user’s test case covers that.

  In conclusion, only reading 6 tackles the asymmetry by redefining explanation. The speaker’s one-liner likely masks this substantive claim, which needs argument. The user should present these readings, highlight that 6 is the one that works but isn't self-evident, and use the test case to show how different interpretations lead to different outcomes.
answer: |-
  Here's your seminar-ready handout, sharpened and structured for clarity. I've labeled each reading, assessed its status, and run your test case through it. The core insight: **only Reading 6 ("Filing Cabinet") directly addresses the asymmetry, but it's a substantive claim requiring argument, not a dismissal.**

  ---

  ### **The Speaker's Slogan Unpacked: "Laws Don't Govern Events, They Just Describe Them"**

  | **Reading**               | **Precise Claim**                                                                 | **Status**                         | **Dismisses Asymmetry?** | **Test Case: 1 Deviant Micro-Event**                                                                                                                                 | **Notes** |
  |---------------------------|-----------------------------------------------------------------------------------|------------------------------------|--------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------|
  | **1. The Platitude**      | "Govern" is metaphorical (no legislator/enforcement). "Describe" = non-causal role. | Trivial                            | ❌ No                     | **Irrelevant.** Compatible with all views.                                                                                                                          | Everyone accepts this. Anti-Humeans agree laws aren't "enforced" like traffic laws. |
  | **2. Category Claim**     | Laws *are* linguistic/representational items (sentences, models), not worldly features. | Substantive but likely **False**   | ❌ No                     | **Law falsified?** If unstated, no law exists. If stated, falsified by exception.                                                                                   | Fails for unformulated laws & laws with no instances (e.g., fundamental force in an empty universe). |
  | **3. Supervenience Claim**| Law-truths are grounded *entirely* in the mosaic of particular facts; no "extra" modal glue. | **Substantive & Defensible** (Humean core) | ❌ No                     | **Law falsified?** Depends on Humean theory: *Strict Regularity*: Yes. *Best System*: Likely No (see Reading 6).                                                    | Explains ontology, not explanation. Doesn't resolve *why* laws explain instances. |
  | **4. Epistemic Claim**    | Laws are *inferred from* instances, so they can't *explain* them (inference ≠ explanation). | **Substantive & Confused**         | ⚠️ Pretends to, but fails | **Law falsified?** Inference fails with exception → no law? But this confuses discovery with justification.                                                        | Explanation ≠ causal production; laws can explain unobserved/unknown instances. Inference and explanation aren't "opposite". |
  | **5. Deflationary Modality** | "Law" = well-confirmed regularity; carries *no* nomic necessity or counterfactual force. | **Substantive & Strong** (not essential to Humeanism) | ❌ No                     | **Law falsified?** Yes (one exception → not a regularity). **Counterfactual?** "If X, Y *would* happen" is false or meaningless.                                   | Radical. Most Humeans (e.g., Lewis) allow laws to support counterfactuals via Best System. |
  | **6. Filing-Cabinet Claim** | Laws "explain" by compressing many particulars into a compact generalization; explanation *is* economical description. | **Substantive & Defensible**       | ✅ **Yes** (if accepted) | **Law falsified?** **No.** Best System still holds (simplicity + strength outweighs one exception). **Explanation?** Yes – the instance is "filed under" the law. | **The only reading that resolves asymmetry:** Explanation is redefined as compression/organization, not causal grounding. |

  ---

  ### **Key Conclusions & Why Your Suspicion is Correct**
  1. **The Platitude (1) is compatible with anti-Humeanism** (e.g., Armstrong accepts laws don't "govern" like a police state). It dismisses nothing.
  2. **Only Reading 6 directly addresses the asymmetry** by redefining explanation: instances "add up" to the law, and the law "explains" them by providing efficient cognitive organization. **But this is a substantive theory of explanation** (e.g., Friedman's unificationism), not a knockdown rebuttal. It needs argument, not a slogan.
  3. **The speaker conflated "describes" ambiguously**:
     - *Category sense* (2): Laws *are* descriptions → leads to absurdities.
     - *Functional sense* (6): Laws *serve a descriptive function* (compression) → can ground a deflationary account of explanation.
  4. **Your test case is decisive**:
     - **Anti-Humean (Governance):** Law is violated → event was *impossible*.  
     - **Humean-Strict (5):** Law falsified → no explanation.  
     - **Humean-Best System (3+6):** Law holds → explains deviant as *statistical fluke* or *measurement error*.  
     The slogan alone doesn't specify which Humean view is intended.

  ---

  ### **What You Missed? A Meta-Reading**
  - **7. *Rhetorical Deflation*:** "Govern" is anti-Humean jargon; "describe" is Humean jargon. The slogan dismisses your question by *reframing it as verbal confusion*.  
    **Status:** Superficially plausible but uncharitable. Asymmetry isn't just about words—it's about explanatory direction in the world.  
    **Verdict:** Evasive.

  ---

  ### **Seminar Takeaway Handout Snippet**
  > **Why did the room nod?** Likely from hearing the Platitude (1) or Rhetorical Deflation (7), not the substantive Filing Cabinet (6).  
  > **Why did the speaker "kill it"?** He reframed your metaphysical worry as a category error. But only Reading 6 genuinely resolves the asymmetry—by redefining explanation as compression. Yet this requires defending a *theory* of explanation, not just a slogan.  
  > **The Asymmetry Test:** Ask your students: "If one particle zigged instead of zagged, is F=ma *false*? Or does it still *explain* why the particle's zag was expected?" Humeans using Best System (Lewis) must say the latter. That's Reading 6 at work.

  This sharpens your "mushy" distinctions and confirms your hunch: the slogan only dismisses the asymmetry if it smuggles in a deflationary theory of explanation (Reading 6), which needs justification. The rest are red herrings or compatible with anti-Humeanism. Good luck Thursday!
