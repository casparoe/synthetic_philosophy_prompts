  Okay, let me start by really understanding what the user is grappling with. They're in an undergrad seminar on historical judgment and moral responsibility. Their core issue is that their attempt to refine the "man of his time" defense (MHOT) seems to have backfired. They added a Dissent Condition to prevent the defense from being too lenient, but now it makes everyone in every era blameworthy for everything.

  First, I need to break down their argument step by step. Step 1 is the basic MHOT: if a moral failing was near-universal, the person isn't blameworthy. Step 2 introduces the Dissent Condition to address the problem that near-universality alone excuses figures like Jefferson, even though there were abolitionists. Step 3 applies this to Jefferson and Columbus, showing they don't get excused because dissent existed. But step 4 applies the same logic to us today, pointing out that for any current practice (like eating meat or fossil fuel investments), there are dissenters. So, by the Dissent Condition, we're all blameworthy. Step 5 highlights the problem: this erases distinctions between historical figures and makes MHOT useless. Step 6 concludes something's wrong with steps 1-4.

  The user wants to keep step 3 (holding Jefferson and Columbus accountable) but avoid step 4's overreach. They also mention their professor's point about commemoration vs. blame, wondering if that's relevant.

  I should identify which premise is causing the issue. The Dissent Condition (step 2) is the key addition, so that's a likely culprit. The problem is that it's too binary. Just the existence of dissenters doesn't necessarily mean the historical figure had access to or was aware of that dissent. Maybe the issue is about the epistemic environment or the salience of the dissent.

  Another angle is the distinction between blameworthiness and other forms of judgment. The professor's commemoration point might be important here. Commemoration often considers broader contributions, not just moral failings. But the user's main concern is moral responsibility, so maybe that's a separate issue.

  Looking deeper, the user might need a way to differentiate between levels of moral criticism without collapsing into universal blame. They probably want a framework that allows for contextual understanding but still holds people accountable when they should have known better. The unspoken need here could be balancing historical context with moral accountability without falling into relativism or presentism.

  Possible solutions: Modify the Dissent Condition to include factors like accessibility, salience, or the credibility of dissenters. Or introduce a threshold for how integrated the dissent was into mainstream discourse. Another idea is to consider the agent's capacity to resist societal norms, though that might be hard to measure.

  Also, the user might benefit from distinguishing between different types of moral failures. For example, Jefferson writing "all men are created equal" while owning slaves shows a contradiction that makes his actions more blameworthy. Whereas someone without that inconsistency might be judged differently.

  I should also think about the implications for current judgments. If we adjust the Dissent Condition to be more nuanced, it avoids condemning everyone today. For instance, the prominence and availability of ethical arguments against factory farming versus fossil fuels might vary, affecting individual responsibility.

  In conclusion, the broken step is the Dissent Condition in step 2. It needs refining to consider not just the existence of dissenters but how accessible and recognized their views were. This preserves accountability for figures like Jefferson and Columbus while allowing for contextual judgments both historically and in the present.
answer: |-
  Your argument hits a fascinating philosophical nerve — the Dissent Condition *does* risk collapsing into universal blameworthiness if applied rigidly. The broken step is **Step 2's Dissent Condition itself**, specifically its **lack of nuance regarding the *accessibility, salience, and epistemic burden* of dissent.**

  **Why Step 2 is the Problem & How it Looked Fine:**

  1.  **The Oversimplification:** Your Dissent Condition states MHOT only works if "*nobody in the agent's own society, with roughly comparable evidence and education, who publicly said the practice was wrong.*" This treats the *mere existence* of any dissenter anywhere in the society as sufficient to destroy the defense *for every individual in that society*. That's too strong.
  2.  **Why it Looked Fine (Initially):** It seemed intuitively correct for Jefferson/Columbus because:
      *   **Jefferson:** The dissent wasn't just *somewhere*; it was prominent (Quakers, abolition societies), intellectually coherent, and directly confronted the core ideology Jefferson himself helped articulate ("all men created equal"). The dissent was *salient* and *accessible* to someone in his position.
      *   **Columbus:** Dissent existed within the very power structure enabling his actions (Spanish court/theologians like Las Casas). Again, it was highly relevant and accessible to those in authority.
      *   You naturally applied an *unstated assumption*: that dissent must be reasonably *available* and *cogent enough* to impose a genuine epistemic burden on the specific agent. For elite, well-connected, intellectually engaged figures like Jefferson/Columbus, this assumption held. The flaw emerged when applying it universally.

  **The Cost of Giving Up the Naive Dissent Condition (and What to Replace It With):**

  *   **Cost:** You lose the simple, binary test. Judging historical figures becomes messier, requiring contextual analysis of the *agent's specific situation* regarding the dissent.
  *   **Solution: Refine the Condition with Epistemic Accessibility & Salience:** MHOT is weakened (but not necessarily destroyed) if there existed dissent that was:
      *   **Accessible:** Could the agent reasonably have been aware of it? (Was it published? Circulated in their circles? Addressed to people like them? In a language they understood?)
      *   **Salient:** Was it prominent enough or intellectually forceful enough to demand a response from someone in their position? (Was it a lone voice in the wilderness, or a growing movement? Did it engage with prevailing arguments effectively?)
      *   **Relevant to the Agent's Role/Stake:** Does the dissent specifically address the moral implications of actions *like the agent's*? (e.g., Criticism of Spanish *encomienda* system generally is salient for Columbus; criticism of distant trading practices might be less so).
      *   **Intellectually Coherent:** Was the dissent based on principles or evidence the agent *could* reasonably engage with, even if rejecting them? (This avoids counting incoherent rants as meaningful dissent).
      *   **Agent's Capacity:** Did the agent possess the *intellectual capacity, education, and freedom* to seriously engage with the dissent? (This is tricky but important – judging a peasant farmer differently from a philosopher-king).

  **Applying the Refined Condition:**

  *   **Jefferson/Columbus:** Pass the refined test easily. Dissent was highly accessible, salient, intellectually coherent, and directly relevant to their actions and status. They had the capacity to engage. MHOT fails.
  *   **Us (Eating Meat/Fossil Fuels):** The refined condition *doesn't* automatically condemn everyone.
      *   **Accessibility/Salience:** While dissent exists, its *salience* and perceived *intellectual force* vary drastically depending on an individual's social circle, media consumption, education, and exposure. The fossil fuel industry actively obscures climate science. Ethical vegan arguments, while growing, are still niche in mainstream culture compared to the overwhelming normalization of meat-eating.
      *   **Epistemic Burden:** The sheer complexity of modern systems (global supply chains, disinformation campaigns, conflicting expert opinions) makes the *epistemic burden* much higher for an average person today to fully grasp and internalize the moral weight of, say, their pension fund compared to Jefferson understanding the contradiction of slavery vs. his own words. We might judge *leaders* (CEOs, politicians, prominent activists) who *deny* climate science or factory farming cruelty more harshly than the average person struggling to navigate complex systems, precisely because the dissent *is* salient and accessible to those leaders.
      *   **Conclusion:** The refined condition allows for *degrees* of blameworthiness. It condemns those who *wilfully ignore* accessible, salient dissent or actively suppress it (analogous to Jefferson/Columbus). It might mitigate blame for those genuinely unaware or overwhelmed by complexity or disinformation, *without* excusing them entirely. It preserves the distinction you want.

  **Regarding Commemoration vs. Blame (Your Prof's Point):**

  This is **crucial and not just a distraction.** It provides a key way out of the "blame everything" trap.

  1.  **Commemoration is Multifaceted:** Honoring someone (with a statue, building name) rarely signifies blanket moral approval of *every* aspect of their life. It usually highlights *specific contributions* deemed valuable (founding a nation, scientific discovery, artistic achievement) *despite* their flaws. We commemorate Winston Churchill for his WWII leadership, not for his views on empire or eugenics.
  2.  **Judgment vs. Commemoration:** We can *morally judge* historical figures (using your refined MHOT criteria) as blameworthy for specific actions *without* necessarily demanding they be erased from commemoration. The decision to commemorate involves a separate, pragmatic, and often political calculus: *What values are we choosing to elevate and remember from this complex figure? Do their positive contributions, in our current context, outweigh the negative associations for the purpose of this specific commemoration?*
  3.  **The "Man of His Time" in Commemoration:** MHOT, even in its weaker forms, becomes *more* relevant here. Understanding the context helps us weigh the significance of their contribution *against* their failings *as understood in their context*. It helps answer: Was their positive action truly exceptional *for their time*? Was their negative action particularly egregious *even by the standards starting to emerge then* (using your Dissent Condition)? This contextual understanding informs the *balance* struck in commemoration.

  **In Summary:**

  *   **Broken Step:** Step 2 (The Dissent Condition). It's too crude, equating *any* dissent anywhere with universal culpability.
  *   **Fix:** Refine the condition by incorporating **epistemic accessibility, salience, relevance, coherence, and agent capacity**. This preserves accountability for figures like Jefferson/Columbus while avoiding universal condemnation of us or others.
  *   **Cost:** Requires more nuanced, context-specific historical judgment. No easy formula.
  *   **Commemoration:** Your professor is right. Separating moral blameworthiness (a philosophical judgment) from commemoration (a social/political act of selecting which aspects of the past to honor publicly) is essential. MHOT contextual understanding plays a significant role *in* the commemoration debate, helping weigh contributions against failings within their historical framework, but it doesn't resolve it solely on blameworthiness grounds.

  This approach keeps MHOT defensible without making it useless or letting it "eat everything." It allows for meaningful moral distinctions across time while acknowledging the genuine challenges of judging the past and navigating our own complex moral landscape.
