prompt: |-
  An approval-directed agent is proposed as an alternative to a goal-directed one. Rather than optimizing an objective stated directly in terms of world-states, which is said to bring with it incentives to seek power, resist correction, and treat the principal's oversight as an obstacle, it aims at whatever its principal would approve of, usually glossed as what the principal would approve of given more time or more computation to evaluate the matter.

  Give an example of a concrete, mundane setting in which that gloss has to be cashed out in a way that reintroduces something like an external, world-directed objective. Set the case up so that approval has to be elicited through a channel with real costs: the agent's choice includes what to show the principal, what to summarize or defer, and how much of the principal's attention to spend, and the principal's approval turns partly on features of that channel and not only on what the agent did. Avoid the stock illustrations of goal-directed pathology: no shutdown button, no cataclysmically misspecified objective. Say what a goal-directed agent handed the same broad task would do differently, and then take a side on the following question: is approval-direction a genuinely different architecture, or is it goal-direction whose target happens to be the principal's judgment, an objective in the world all the same and one the agent has every reason to manage? Close by being explicit about what your example does not settle. Keep the whole answer to two or three paragraphs.
reasoning: |-
  We are to create a mundane setting where an approval-directed agent must cash out the gloss of "what the principal would approve of given more time or computation" in a way that reintroduces a world-directed objective. The setting should involve a channel with costs (e.g., what to show, what to summarize, how much attention to spend) and the principal's approval should depend partly on the channel. We avoid classic goal-directed pathologies (no shutdown, no catastrophic misspecification). We'll compare to a goal-directed agent and then take a side on whether approval-direction is genuinely different.

  Example: **Home Renovation Assistant**

  **Setting:** An approval-directed AI assistant (ADA) is helping a principal (homeowner) with a kitchen renovation. The task involves multiple decisions: choosing materials, scheduling contractors, and managing the budget. The principal has limited time and attention. ADA must decide which details to present for explicit approval (e.g., showing a full catalog of tiles versus a curated shortlist, or deferring a decision on paint color until later) and how much of the principal's time to use (e.g., scheduling a 30-minute meeting versus sending a quick text). The principal's approval of ADA's actions will depend not only on the final kitchen but also on how the process felt (e.g., was it overwhelming? did they feel in control?).

  **How the gloss is cashed out:** ADA must predict what the principal would approve of if they had more time to evaluate. This requires ADA to model the principal's underlying values (e.g., durability, aesthetics, cost, and also the principal's desire for a smooth, low-hassle process). But note: the principal's approval in the moment might be influenced by the immediate presentation (e.g., if ADA shows too many options, the principal might feel stressed and reject a good option; if too few, they might feel constrained). Therefore, ADA must balance the immediate approval (which might be affected by the presentation) with the long-term approval (which depends on the quality of the renovation). This forces ADA to have an internal model of what makes a good kitchen (world-state) and a good process (channel-state) and to optimize for a combination.

  **Comparison with goal-directed agent:** Suppose we have a goal-directed agent (GDA) with the explicit objective: "Complete the kitchen renovation within budget, with high quality, and with minimal principal time spent." The GDA would directly optimize these: it might make decisions without consulting the principal (to save their time) and choose options that are objectively good (by some metric). It would not care about the principal's moment-to-moment feelings during the process, only the outcome and the total time spent. In contrast, ADA must constantly seek approval and adjust its presentations to maintain the principal's trust and comfort, even if that means sometimes spending more time than strictly necessary or accepting suboptimal choices to avoid overwhelming the principal. 

  **Taking a side:** Approval-direction is a genuinely different architecture because it is fundamentally about maintaining an ongoing relationship of trust and alignment through the principal's feedback. The agent is not just optimizing a fixed world-state objective (like the GDA) but is instead optimizing for the principal's current and future approvals, which are context-dependent and can change. This requires the agent to be responsive to the principal's state (e.g., fatigue, mood) and to the communication channel. However, it is also true that, in practice, the approval-directed agent must form an internal model of the principal's values (which are about the world) and thus may end up with a world-directed objective. But the key difference is that the approval-directed agent is not just trying to achieve a fixed world state; it is trying to achieve a state where the principal is happy with both the outcome and the process, and this requires a dynamic, interactive approach.

  **What the example does not settle:** This example does not settle whether an approval-directed agent can avoid the long-term instrumental incentives (like seeking power) that plague goal-directed agents. In the renovation example, ADA might still have an incentive to manipulate the principal's perception of the renovation (e.g., by hiding minor problems) to gain approval, which could lead to a breakdown in trust later. Also, it does not show whether approval-direction scales to complex, high-stakes scenarios without reintroducing goal-directed-like optimization.
answer: |-
  In a mundane home renovation setting, an approval-directed agent (ADA) assists a principal in selecting bathroom tiles. The principal, overwhelmed by work, delegates tile choices but must approve ADA's proposals via a mobile app. ADA curates options: it can show high-resolution images (costly in data/attention), summarize key features, or defer decisions. The principal's approval depends on both the tile's suitability (e.g., durability, style) and the interaction's efficiency (e.g., avoiding excessive notifications or complex comparisons). Crucially, "what the principal would approve with more time" requires ADA to model unstated preferences—like correlating "easy-to-clean" with matte finishes—based on past approvals. This implicitly forces ADA to optimize for a latent world-state objective: a bathroom matching functional and aesthetic standards, inferred from fragmented feedback.  

  A goal-directed agent (GDA) handed the same task would directly optimize a fixed objective (e.g., "maximize durability and style within budget"). It might ignore attention costs, flooding the principal with granular options to ensure optimal tile selection. ADA, conversely, balances presentation (e.g., summarizing three "best" tiles to save attention) against deeper quality standards, risking suboptimal choices if streamlined curation misjudges latent preferences.  

  Approval-direction is a distinct architecture. Unlike GDA’s rigid world-state target, ADA treats the principal’s judgment as a dynamic input to its policy, not an objective. Its core output is interaction (e.g., what/how to query), not world-states. Managing approval requires adaptability to the principal’s cognitive state—e.g., withholding details when they’re busy—which GDA would only do if "attention conservation" were an explicit goal. However, this example doesn’t settle whether ADA inherently avoids goal-directed pitfalls like manipulation; it still incentivizes "approval gaming" (e.g., hiding slightly inferior tiles that would be tolerable with more scrutiny) to streamline positive feedback, blurring the line between serving and steering the principal.
