answer: |-
  ### Requirements for an Adequate Account of Non-Human Causation in History  
  *(Cut candidates: "Must treat humans/non-humans symmetrically" (actor-network bias); "Must deny teleology" (anti-intentionalist preference); "Must affirm emergence" (complexity-theory bias). These were philosophical preferences, not universal requirements.)*

  #### Non-Negotiable Requirements  
  1. **Mechanistic Specificity**  
     *Case*: Tambora (1); Irish Potato Famine (3).  
     *Requirement*: Must specify *how* a non-human cause (e.g., eruption, pathogen) interfaces with human systems (e.g., food distribution, labor markets). Without this, causation is merely correlative (e.g., Tambora’s ash → famine requires intermediary steps like crop physiology and market integration). Failure here collapses historical explanation into natural determinism.  

  2. **Evidential Testability**  
     *Case*: Undocumented eruption (2); Pre-germ-theory cholera (5).  
     *Requirement*: Must identify observable/proxy differences a claim implies (e.g., sulfate spikes in ice cores for eruptions; mortality patterns contradicting miasma-based policies). Untestable attributions (e.g., invoking "unknown eruptions" without geochemical traces) are non-historical. Anchored to your isotope-hydrology rigor: proxies must bear the weight.  

  3. **Vulnerability Acknowledgment**  
     *Case*: Monsoon failure (7); Plague and serfdom (4).  
     *Requirement*: Must explain why identical forcings produce divergent outcomes (e.g., monsoon failure → famine only where reserves/infrastructure are inadequate). *Your concepts are genuine desiderata*: "vulnerability window" (systemic slack) and "channeling" (institutional path-shaping) are empirical, not prejudices. They reject determinism but *demand* its refutation, not concede anti-determinism.  

  4. **Scale Translation**  
     *Case*: Monsoon failure vs. policy (7); Looped CO₂ case (6).  
     *Requirement*: Must articulate how macro-forcings (e.g., volcanic cooling) translate to micro-choices (e.g., relief legislation), or vice versa (e.g., depopulation → CO₂ dip). Avoids "scalar collapse" (e.g., blaming parliament’s vote on the monsoon alone).  

  #### Negotiable Requirements  
  5. **Actor Attribution Criteria**  
     *Case*: Plague pathogen (4); Blight (3).  
     *Requirement*: Must define if "actor" status requires goal-directedness (no, for non-humans) or *responsiveness to interpretive frameworks* (e.g., blight invoked in land-reform debates). Deniable: Some accounts may deflate "actor" to "cause" without loss. Basis: Non-human entities become actors *only* when embedded in human semiotic practices (e.g., cholera as "miasma" driving policy).  

  6. **Looped Causation Capacity**  
     *Case*: Post-Columbian CO₂ dip (6); 6th-century plague loop.  
     *Requirement*: Must handle feedback (human actions → geophysical change → human consequences). But a theorist could reject loops as reducible to linear chains without embarrassment (e.g., treating CO₂ dip as a "new" cause).  

  7. **Counterfactual Robustness**  
     *Case*: Grain exports during blight (3); Plague wages (4).  
     *Requirement*: Should assess if the outcome *depended* on the non-human cause (e.g., Would serfdom have collapsed without plague mortality?). Deniable: Strict empiricists may reject unobservable conditionals.  

  #### Conflicts and Exclusion  
  - **Conflict**: (2) Evidential Testability vs. (5) Actor Attribution. Testability demands physical traces; actor-talk often relies on cultural evidence (e.g., cholera’s "agency" in miasma debates). *Keep (2)*: Untestable claims undermine history. Revised list excludes accounts privileging hermeneutics over evidence.  
  - **Most Exclusionary Requirement**: (2) Evidential Testability. Eliminates:  
    - Actor-network theories that grant agency without empirical checks.  
    - Speculative Anthropocene narratives lacking proxy validation.  
    - "Miasma"-like attributions with no observable consequences.  

  #### Evaluation of Concepts  
  - **Vulnerability Window & Channeling**: Genuine desiderata. They address *why* non-human causes aren’t sufficient. Not deterministic: They show how causes are *conditioned* by human systems.  

  #### Specific Issues Addressed  
  - **Looped Causation**: Required for adequacy (per Case 6), but negotiable in *how* it’s modeled.  
  - **Actor vs. Cause**: Preserve distinction. Basis: "Actors" respond to *interpretation* (e.g., cholera’s policy impact depended on miasma beliefs). Non-humans lack goals/selection-responsiveness *alone*.  
  - **Evidential Clause**: Non-negotiable (Requirement 2).  

  ---

  ### Comparison of Historical Approaches  
  | Approach                  | (1) Mech. Specificity | (2) Evidential Test | (3) Vulnerability | (4) Scale | (5) Actor Attr. | (6) Loops | (7) Counterfactual |  
  |---------------------------|------------------------|----------------------|-------------------|-----------|------------------|-----------|---------------------|  
  | Environmental Determinism | ✘ (Oversimplifies)    | ▲ (Proxies only)    | ✘ (Ignores)       | ✘         | ✘                | ▲         | ✘                   |  
  | Possibilism               | ▲ (Vague on "how")    | ✔                   | ✔                 | ✔         | ✘                | ▲         | ▲                   |  
  | Difference-Making         | ▲                      | ✔ (If testable)     | ▲                 | ▲         | ✘                | ✔         | ✔                   |  
  | Actor-Network Theory      | ▲ (Symmetry obscures) | ✘ (Neglects proxies)| ▲                 | ▲         | ✔ (Overextends)  | ✔         | ✘                   |  
  | Anthropocene Narratives   | ▲ (Scale issues)      | ▲ (Mixed rigor)     | ▲                 | ✔         | ▲                | ✔         | ▲                   |  

  **Key**: ✔ = Strong; ▲ = Partial/Uneven; ✘ = Weak/Absent.  
  *Note*: No approach satisfies all. Requirement (2) excludes most actor-network work; (3) excludes determinism.
