prompt: |-
  I'm in this very loose reading group — me, a physics PhD who is skeptical about everything, and a philosophy grad student — and last week we got completely stuck on a section from Hofstadter (I think it's in one of his essay collections, maybe Metamagical Themas, the bit about the careenium and the simmballs), and before we argue about the anwser I want to get clear on what we're even asking. The setup as I took it: you've got this weird material made of "simmballs" — symbol-balls — and whatever happens in it can be described either at the level of individual balls shoving each other around, or at the level of the symbols and what they mean, and the question is who shoves whom. If a lump of careenium is running something that amounts to a decision, does the symbol-level story (that it decided X, that it believed Y, that a certain pattern meant Z) do any of the real causal work, or is it substrate all the way down and the symbol talk just a convenient gloss? Our physicist says gloss, end of story; I'm not so sure.

  So instead of settling it, write me the spec: what would a theory of symbol-level versus substrate-level causation have to deliver to count as adequate? I want the desiderata with the case or consideration behind each one, and I want you to mark which are non-negotiable and which are just one camp's prejudices. Some things I think belong on the list, but you tell me which are genuine requirements: it has to handle the mundane cases (a thermostat's set point, a chess program playing as if there were a threat on the board, an ant colony's trail, a virus's "fitness"); it has to say something about misrepresentation, where a symbol-level state that's about something that isn't actually the case seems to cause behavior anyway; it has to respect whatever physics really forces on us (causal closure — every physical event has a sufficient physical story in its physical past); it has to keep mere bookkeeping apart from real leverage (my own labels: "shadow relevance", where the symbol fact is entailed by the substrate story and tracks it but changes nothing, versus "leverage", where the symbol-level description constrains what the substrate does next); and it has to have a view about a case I made up — the fine-grained swap, where you take one lump running a prime-number routine and rewire it a few simmballs at a time into a lump running a weather simulation, so the symbol-level description is crisp at both ends and mushy in the middle. Does causation fade out gradually there, and what would that even mean?

  Then the part I actually care about: flag any pair of desiderata you suspect can't be jointly satisfied, because if the list itself is inconsistent that's a result and I'd rather know now. My guess is that "respect the causal closure of the physical" and "let symbol-level facts do explanatory work that couldn't in principle be done at the substrate level" are quietly at war, but maybe there's a reading that saves both. Also tell me which single requirement excludes the most candidates, and whether anything on my list is really a preference dressed up as a constraint. Then a very short scorecard, two lines each at most, for: straight reductionism or identity, functionalism with substrate-independence, non-reductive physicalism with downward causation, and eliminativism about the symbol level. Please write it in American English, and no reading lists, citations or bibliographies — we're doing this from one dogeared paperback with no library access, so anything that needs looking up is useless to us.
reasoning: |-
  Okay, the user is part of a reading group with a physics PhD skeptic and a philosophy grad student. They're stuck on Hofstadter's careenium and simmballs section, debating whether symbol-level descriptions have real causal power or if it's all just substrate physics. The user wants a clear set of requirements for a theory that can handle symbol-level vs. substrate-level causation, without settling the debate yet. 

  First, I need to unpack their core question: what criteria must such a theory meet? They listed some potential desiderata, like handling mundane cases (thermostats, chess programs), misrepresentation, respecting physical causal closure, distinguishing shadow relevance from real leverage, and handling fine-grained swaps where the system morphs gradually between two symbolic states.

  The user's explicit request is for a spec—desiderata with justifications, noting which are non-negotiable vs. debatable. But reading between the lines, they're frustrated with circular arguments and want a structured way to evaluate competing views. Their deeper need might be clarity on whether the debate is even resolvable, given potential conflicts in the requirements (e.g., causal closure vs. symbolic leverage). 

  I should start by defining robust desiderata. Non-negotiables seem to be: respecting physics (causal closure, no magic), handling everyday cases (or the theory is irrelevant), and addressing misrepresentation (since it's key to intentionality). Shadow relevance vs. leverage is crucial but might be a divisive preference—some theories might deny leverage exists. Fine-grained swaps are a stress test, not necessarily mandatory. 

  The big tension is indeed between causal closure (every physical effect has physical causes) and genuine symbolic leverage (symbols doing work beyond substrate). If physics fully determines outcomes, how can symbols add causal oomph? A theory must resolve this without handwaving—perhaps via multiple realizability or patterns constraining microstates. 

  For the scorecard, I'll keep it punchy: reductionism sees symbols as shorthand; functionalism abstracts from hardware; non-reductive physicalism claims top-down causation; eliminativism calls symbols illusions. The user likely wants this to compare frameworks quickly during their debate. 

  Finally, I'll flag that the leverage vs. closure conflict might be the hardest—many theories sacrifice one for the other. If their group can't tolerate that, it narrows the options fast.
answer: |-
  Here's a spec for a theory of symbol-level vs. substrate-level causation, built from your points and key considerations:

  **Core Desiderata (Non-Negotiable):**

  1.  **Respect Causal Closure of the Physical:** *Requirement:* Every physical effect (every simmball movement) must have a sufficient physical cause (prior simmball states/interactions/laws). *Why Non-Negotiable:* Violating this injects magic or non-physical forces, contradicting fundamental physics. *Case:* Explaining why simmball A bumps simmball B *must* trace back to physical forces/states, not *just* "because symbol X meant Y".
  2.  **Handle Mundane Symbolic Systems:** *Requirement:* Explain how symbol-level descriptions (set point, chess threat, fitness, trail pheromone *as signal*) seemingly cause behavior in simple systems. *Why Non-Negotiable:* If the theory can't handle thermostats or ant trails, it fails for the basic cases symbol-talk is used for. *Case:* The thermostat turns on the boiler *because the temperature is below 20°C* – how does this "because" relate to the bimetallic strip bending?
  3.  **Account for Misrepresentation:** *Requirement:* Explain how a system can behave *as if* a symbol referred to something true (or present) when it doesn't, and how this "false" state causes specific, often counterproductive, behavior. *Why Non-Negotiable:* Misrepresentation is central to meaning, error, and intelligence. A symbol-level causation story must handle it. *Case:* A chess program sacrifices its queen responding to a "phantom threat" (a pattern misidentified due to a substrate glitch). The *symbol-level mistake* seems key to explaining the bad move.

  **Critical Distinction (Potentially Divisive Requirement):**

  4.  **Distinguish Shadow Relevance from Genuine Leverage:** *Requirement:* Provide criteria to differentiate when a symbolic description is merely a passive, epiphenomenal shadow of the substrate ("shadow relevance") vs. when it plays an active, constraining role in causing future system states ("leverage"). *Why Critical but Potentially Divisive:* This is the *core* of the "who shoves whom" debate. Different theories will define "leverage" differently or deny its existence. *Case:* Does the chess program's *recognition of a threat pattern* actively constrain the next million simmball movements leading to the defensive move (leverage), or is it just a label we apply afterwards (shadow)?

  **Stress Test / Boundary Case (Reveals Theoretical Commitments):**

  5.  **Handle Fine-Grained Swaps:** *Requirement:* Address what happens to symbol-level causation during the gradual, substrate-level rewiring from System A (Prime Numbers) to System B (Weather Sim). *Why Revealing:* Forces the theory to confront the continuity/discontinuity of causal efficacy, the granularity of "implementation", and the reality of emergent levels during the "mushy middle". *Key Questions:* Does causation fade? Jump? Shift? Is there a point where "prime-ness" stops causing and "cloud-formation" starts? What *is* causing behavior in the middle?

  **Potential Conflicts & Analysis:**

  *   **The Big Tension:** You nailed it. **Causal Closure (1)** and **Genuine Symbolic Leverage (as defined in 4)** *appear* fundamentally at odds. If physics fully determines every simmball, what "work" is left for the symbol? *Possible Resolution Paths:* Leverage might be reconceived as *organization* or *patterns* acting as higher-level constraints on *how* physical laws play out within the system (e.g., the software "shapes" the hardware's activity space). Or, leverage might be a matter of *efficient explanation*, not fundamental physics. But satisfying *both* literally is the core challenge.
  *   **Most Excluding Requirement:** **Genuine Leverage (4)** is likely the biggest filter. It excludes:
      *   **Eliminativism:** Denies symbols exist as causal entities.
      *   **Strict Reductionism/Identity Theory:** Claims symbols *are* just substrate states, so "leverage" is an illusion; only shadow relevance exists.
      *   Many versions of **Non-Reductive Physicalism** struggle to define leverage without violating closure.
  *   **Preference Dressed as Constraint?** **Genuine Leverage (4)** is the prime suspect. Many physicalists argue it *is* just a preference for certain explanatory styles. They might accept 1-3 and 5 while denying real leverage exists beyond efficient description (shadow relevance). Conversely, proponents of strong emergence see it as essential.

  **Short Scorecard:**

  *   **Straight Reductionism/Identity:** Symbols *are* substrate configurations. Causation is 100% substrate. "Symbol talk" is shorthand/gloss (Shadow Relevance). *Meets:* 1, 2 (as gloss), 3 (misconfig=gloss). *Fails:* 4 (Leverage), struggles with 5 (symbols vanish gradually?).
  *   **Functionalism (Substrate-Independent):** Causal roles defined by abstract function. Symbols are functional states. Causation is role-fulfillment, multiply realizable. *Meets:* 1 (roles physically implemented), 2, 3, 5 (functional roles persist/collapse). *Struggles With:* 4 (Is role-fulfillment "leverage" or just functional description?).
  *   **Non-Reductive Physicalism (Downward Causation):** Symbols are real, higher-level properties/system states that exert causal influence "downward" on the substrate, constraining its micro-evolution. *Meets:* 2, 3, 4 (claims leverage), 5 (causal efficacy fades/changes during swap?). *Struggles With:* 1 (Reconciling downward influence with causal closure is the major hurdle).
  *   **Eliminativism:** "Symbols" as causal entities are illusions. Only substrate and physics exist. Causation is purely micro-physical. *Meets:* 1. *Fails:* 2, 3, 4, 5 (Rejects the very framework of symbol-level causation).

  **Conclusion:** Your instincts are sharp. The core battleground is **Leverage vs. Closure**, filtered through the **Shadow/Leverage Distinction** (Desideratum 4). Any theory must navigate this tension while handling the thermostat, the glitch, and the messy middle of the swap. The fine-grained swap (5) is an excellent test for *how* a theory handles the emergence/persistence of causal levels. Good luck with the careenium!
