prompt: |-
  I'm drafting a short position statement on material objects for a graduate workshop, and before I put it in print I'd like an audit of the commitments I've assembled. I don't know where the strain in the set is, so please don't treat any one of them as more negotiable than the others: take them all as things I currently believe, and tell me whether the package survives.

  1. The unrestricted answer to the special composition question is false. My reasons are the familiar pair: I won't grant that there is an object composed of the tip of my nose and the top of the Eiffel Tower, and I take the problem of the many to count heavily against any view on which every near-candidate for being the table in this room is a real object. So: not universalism.

  2. The never answer is false too. I want there to be tables, and not merely as a concession to ordinary talk — I don't think the paraphrase strategies that would let me say everything I want to say while denying that tables exist actually work.

  3. So I want a restricted answer, and this is the one I've been defending: some things compose an object just in case their activity jointly constitutes a life, or they are integrated into a single function that some actual community of users confers on them. The first clause is meant to get me organisms; the second is meant to get me artifacts, which is where I most expect trouble.

  4. Methodologically I want more than an extensionally correct generalization. I want the condition to be general, necessary, and stated in non-gerrymandered terms: a condition whose application turns on what some particular person happens to intend, want, or be attending to is not an answer to the question, it's a change of subject. And I don't want to fall back on a brute primitive. Treating it as an unexplained bedrock fact which pluralities compose strikes me as a research-stopper, and I'd rather revise almost anything else on this list than help myself to it.

  5. I also hold that composition and existence are sharp. There are no vague objects; for any plurality it is determinate whether they compose something; and I don't want to solve the problem of the many by stipulating that one privileged candidate among the many near-candidates in the room is the table and that the others aren't.

  6. I deny coincidence: I don't think there can be two material things made of exactly the same matter in exactly the same place at the same time. So the statue and the piece of clay it is made of are one and the same thing, if both are to be counted at all. But I also want to keep the ordinary pair of judgments that the clay would survive being rolled into a ball and that the statue would not.

  7. On scattered objects: I deny that my nose and the moon compose anything, but I'm happy to say that there is a single object composed of my two shoes while they are in different cities, or of the two pieces of a bikini, or of a star and its planets.

  What I want from you is an audit, not a survey of the literature. Go through the set pairwise and tell me which pairs are genuinely in tension and which only look like it — I'd rather you discriminate than flag everything. Order the genuine tensions by severity instead of listing them as equally bad. For each one, say exactly what I would have to give up or add in order to remove it, and what that would cost me elsewhere in the set; then tell me which single revision would clean up the most. Two further things I'd like flagged: any commitment I haven't stated but that the position requires, and any case my two-clause criterion obviously mishandles. I'm worried in particular about a watch taken apart and left in a drawer, and about whether there was ever really a table here at all given how vague its boundary seems to be.
reasoning: |-
  Okay, let me approach this systematically. The user presents a tightly argued position on material composition with seven commitments and requests a tension audit. They're clearly preparing for academic scrutiny and want pressure-testing before workshop presentation.

  First, I need to internalize their non-negotiables: rejection of both universalism and nihilism, insistence on sharp boundaries, artifact functionality as composition trigger, and no coinciding objects. The methodological constraint about avoiding brute facts or subject-dependent conditions seems particularly crucial - they want a principled solution, not just extensional adequacy.

  The artifact clause immediately raises red flags. How does "integrated into a single function" handle disassembled objects? Their watch-in-a-drawer example perfectly targets this. If functionality requires actual use, the disassembled watch isn't functional, but we'd still want to say its parts compose something. This clashes with their anti-gerrymandering principle (Commitment 4). 

  Then there's the sharp boundaries requirement (5) conflicting with artifact vagueness. When exactly do parts become "integrated"? A table's boundary particles seem indeterminate, yet they reject vague composition. Their statue/clay case (6) compounds this - if the clay survives reshaping but the table doesn't, but they're identical, that's contradictory unless they adopt temporal parts, which they haven't committed to.

  The scattered objects point (7) creates another problem. Why accept bikinis but reject nose+moon? Their functional criterion might include bikinis (if we consider them clothing), but shoes in different cities? That seems ad hoc without specifying what "actual community of users" means concretely. 

  Most severe tension is between 3 (functionality), 4 (non-subjectivity), and 5 (sharpness). Functionality depends on human intentions, which are vague and contextual - directly contradicting their demand for non-gerrymandered, sharp conditions. To resolve, they'd either need to bite the bullet on subjectivity (violating 4) or accept vagueness (violating 5), both painful concessions.

  Secondary tension arises from denying coincidence (6) while wanting different persistence conditions. If the clay = statue, they can't have different modal properties without violating Leibniz's Law. They'd need temporal parts or constitutionalism, neither compatible with their current commitments.

  Unstated commitments emerge too: they'll need a theory of function (biological and artifactual) and community intentionality that's objective and sharp - a tall order. Cases like repaired artifacts (Ship of Theseus) or malfunctioning objects will likely cause trouble.

  The watch disassembled in a drawer is indeed problematic - if functionality requires current integration, it doesn't compose. But if we appeal to past/potential function, that introduces vagueness (when does potential cease?) and subjectivity (who decides the function?).

  For revision priority, I'd suggest refining the artifact clause to include dispositional function or historical integration, but this risks violating sharpness. Alternatively, treat artifacts as having different persistence conditions than organisms, but that might require accepting coinciding objects temporarily.

  The user's awareness of these pressure points (especially the watch case) shows they're already probing deeply. My audit should validate their concerns while helping them see which trade-offs are least damaging for their core objectives.
answer: |-
  Here's an audit of your commitments, ordered by severity of tension. I'll flag irreconcilable conflicts, necessary unstated commitments, and problematic cases. Your core tension is between **sharpness**, **anti-subjectivity**, and **artifact functionality**.

  ---

  ### **Severe Tensions (Require Revision)**
  1. **Artifact Functionality (Commitment 3) vs. Sharp Boundaries (Commitment 5)**  
     - **Conflict**: Your artifact clause ("integrated into a single function conferred by a community") is inherently vague. Functionality depends on *interpretation* (what counts as a "function"?), community practices (which users? when?), and physical integration (how much repair invalidates a watch?). This clashes with your demand for sharp composition.  
     - **Example**: A watch disassembled in a drawer: Its parts *could* be reintegrated, but currently lack function. Is it still an object? If "yes," functionality isn't necessary; if "no," composition becomes ephemeral.  
     - **Resolution Cost**: Abandon sharpness (allow vague composition) or abandon non-gerrymandered functionality (e.g., treat artifacts as mind-dependent). Both violate Commitment 4 or 5.  

  2. **Denial of Coincidence (Commitment 6) vs. Artifact Persistence (Commitment 3)**  
     - **Conflict**: You claim the statue/clay is one object (Commitment 6) but insist the clay survives reshaping while the statue does not. This violates Leibniz's Law (identical objects can't have divergent properties).  
     - **Resolution Cost**: Accept coincidence (statue ≠ clay) *or* deny divergent persistence (e.g., say the statue *does* survive reshaping). The latter guts ordinary judgments (Commitment 6’s motivation).  

  3. **Functionality (Commitment 3) vs. Anti-Subjectivity (Commitment 4)**  
     - **Conflict**: Artifact functions depend on human intentions ("conferred by a community"). This is explicitly subjective, contra your demand for conditions independent of "what some person intends" (Commitment 4).  
     - **Example**: Is a driftwood sculpture an artifact if no one "confers" function? What if two communities disagree?  
     - **Resolution Cost**: Drop "conferred" (make function objective) or accept subject-dependence. The former is empirically dubious; the latter violates Commitment 4.  

  ---

  ### **Moderate Tensions (Manageable with Clarification)**  
  4. **Scattered Objects (Commitment 7) vs. Universalism Rejection (Commitment 1)**  
     - **Apparent Conflict**: You accept bikinis/shoes as scattered objects but reject nose+Eiffel Tower. Why is "function" or "life" satisfied in one case but not the other?  
     - **Resolution**: Your criteria *can* exclude nose+tower (no joint function/life) while including bikinis (unified function). **But**: You need a rigorous definition of "integrated function" to avoid arbitrariness. Clarify how scattered parts (e.g., shoes in different cities) are "integrated."  

  5. **Artifacts (Commitment 3) vs. Problem of the Many (Commitment 1)**  
     - **Conflict**: Tables have fuzzy boundaries (e.g., indeterminate particles). If composition is sharp (Commitment 5), which precise set of particles composes the table?  
     - **Resolution**: You might say the "function" determines exact boundaries. **But**: Functionality (e.g., "holding plates") doesn't specify *which* particles are essential. This risks reintroducing vagueness.  

  ---

  ### **Unstated Commitments Required**  
  - **A Theory of Function**: You need objective criteria for when a "single function" exists. Biological functions (for organisms) are debated but tractable; artifact functions are harder. Is it evolutionary role? Designer intent? Current use?  
  - **Community Intentionality**: What counts as an "actual community of users"? How many people? Must they agree? This demands a social ontology.  
  - **Persistence Conditions**: How artifacts retain identity over disassembly/repair (Commitment 6’s statue case).  

  ---

  ### **Problem Cases for Your Two-Clause Criterion**  
  - **Disassembled Watch**: Parts in a drawer lack current function or integration. Does the watch still exist? If not, this violates ordinary judgment (Commitment 2).  
  - **Vague Artifacts**: A rotting table with indeterminate boundaries. Your sharpness requirement (Commitment 5) forces a precise cutoff, but functionality won't provide it.  
  - **Repaired Artifacts**: If a table’s broken leg is replaced, is it the same object? Your function clause may say "yes," but then Commitment 6 (denying coincidence) conflicts if the old leg + spare parts could compose a "new" table.  
  - **Non-Artifact Tools**: A rock used as a hammer: No "community" confers function, yet it seems composed of its parts. Does it suddenly compose an object when used?  

  ---

  ### **Most Impactful Single Revision**  
  **Drop Sharp Boundaries (Commitment 5)**. This would:  
  - Resolve tensions with artifacts (tensions #1, #2, #5) by allowing vague composition.  
  - Cost: Accept that existence is vague (contrary to your current view) and weaken your response to the problem of the many.  
  - Alternative: **Drop Artifact Functionality** and treat artifacts as conventional (violating Commitment 4), but this guts your restricted answer.  

  ---

  ### **Summary**  
  Your package **fails** due to severe conflicts between **artifact functionality**, **sharp composition**, and **anti-subjectivity**. The watch/table cases expose these flaws. To survive, you must either:  
  1. **Abandon sharpness** (allowing vague objects), or  
  2. **Redefine artifacts** in non-functional terms (e.g., structural unity), or  
  3. **Accept subject-dependence** for artifacts (undermining Commitment 4).  

  **Recommended path**: Revise Commitment 3 to decouple artifacts from *conferred* function (e.g., define them by physical structure or causal unity). This reduces subjectivity but may overinclude (e.g., nose+tower if structurally connected) or underinclude (e.g., disassembled watches). Pair this with **temporal parts** to resolve the statue/clay tension, though this adds new commitments.  

  Let me know if you want to drill deeper into a specific tension or revision strategy.
