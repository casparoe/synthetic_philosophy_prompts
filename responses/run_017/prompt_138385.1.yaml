prompt: |-
  hey — i'm in a political theory seminar on conservatism this term and i've got a presentation on Burke coming up where I need a ~30 second joke at the end (prof said it's fine if it's light). Could you write me one that actually turns on the substance rather than being a generic nerd joke?

