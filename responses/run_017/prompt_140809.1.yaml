  The student correctly diagnoses that the Pasadena game does not have a well-defined expected value because the series for the absolute expectation diverges and the positive and negative parts both diverge to infinity. The comparison to the St. Petersburg game is mostly appropriate: both games involve unbounded payoffs that cause issues with expected value (infinite expectation for St. Petersburg, undefined for Pasadena). However, the statement "in that sense the expectation is infinite" for Pasadena is misleading; it is undefined, not infinite. The moral about unbounded payoffs rendering expected value problematic is reasonable, but the comparison could be sharper by noting that St. Petersburg has a divergent positive expectation while Pasadena suffers from conditional convergence.  
