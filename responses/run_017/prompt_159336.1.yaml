prompt: |-
  I moved here from Australia about four years ago and got my citizenship last spring, so this november was the first federal election I was actually eligible to vote in. Back home voting is compulsory so I'd never had to decide whether to do it. I've been turning something over since then and I want to know whether it has a name, because it keeps showing up and I don't have a word for it.

  Here's what I mean. In the weeks before the election everyone told me some version of: your vote won't decide anything on its own, obviously, but democracy only works if everyone adds theirs, so you have to turn out. Fine — I get it, the individual act is a drop in a bucket and what matters is the bucket. Then the day after, the same people started talking as if my vote were the thing that put the winner in office. Texts to friends who stayed home along the lines of "hope you're happy," texts to people who voted along the lines of "you did this," and to me specifically, "you voted for him, so you don't get to complain about what he does now." But that seems to need the opposite picture of what my action was: not a drop in a bucket but a lever I pulled, one that makes me into an author of whatever comes next.

  The reason I don't think I'm just describing hypocrisy, or people grabbing whichever argument suits them, is that both halves sound true to me when I hear them on their own. My vote really wasn't going to break a tie. And it's also true that if enough people like me had stayed home the result would have been different, and that I did add mine to the pile that produced it. It flips inside my own head too: before I voted I told myself it didn't matter so I could vote for the person I actually wanted, and afterwards I felt like I'd done something I was on the hook for.

  Things I've been told it might be, and why I think they're nearby but not it. A philosophy friend mentioned Parfit's harmless torturers case when I described it: lots of acts each of which makes no perceptible difference, big aggregate harm, no clean individual culprit. But there the puzzle is how harm can exist with nobody responsible, and here the puzzle is more like responsibility being handed back to me after I was told I wasn't a cause. I've also seen people online use "expressive voting," but as far as I can tell that's about voting in order to say something rather than to change the outcome — this is different, because here somebody else is deciding what my act said and booking it as support. And I'm not asking whether there's a duty to vote or whether lesser-evil voting is corrupting; those are separate questions I can find plenty on.

  One more thing that might be the same phenomenon or might be a second one: voting is treated as giving consent, but not voting isn't treated as withholding it. Nobody says "you didn't vote, so the government doesn't speak for you." The consent seems to run in one direction only.

  So: is there an established concept for the switch — the act being described as causally negligible when it's being demanded from me, and as causally mine when it's being credited to me? If there isn't, I'd like you to name and define it, and either way I want the carving more than the label: what exactly it is, what it isn't, and where its edges are. Specifically: does it need a large electorate? In my union local there are about forty of us and the last contract vote was 21–19, so a single vote genuinely can decide it, and the flip doesn't seem to operate there, or at least doesn't feel like the same thing. Does it need a secret ballot, or a two-party race, or a winner who then claims a mandate? Does it extend to other things people do collectively — signing petitions, eating meat, flying — or is there something special about voting? And is the one-way consent bit the same phenomenon or a different one? I'll know an answer is good if it tells me which cases don't count. Don't bother with reading lists or citations, I just want the distinctions straight.
reasoning: |-
  Okay, let me unpack this user's query. They moved from Australia, where voting is compulsory, to a country where it's optional. They voted for the first time and noticed a contradiction: before the election, people emphasized that an individual vote doesn't matter but everyone must participate for democracy to work. After the election, those same people treated each vote as if it directly caused the outcome, holding voters accountable. The user feels both perspectives seem true individually but conflict when combined.

  The user mentions considering several concepts but finds them insufficient. Parfit's harmless torturers focus on responsibility without causation, whereas here responsibility is assigned despite being told causation is minimal. Expressive voting is about intent, not post-hoc attribution. They also note the asymmetry where voting is seen as consent, but not voting isn't seen as withholding consent.

  The core issue is the dual framing of the act: negligible when demanding participation, significant when attributing responsibility. The user wants to know if there's a term for this and to understand its boundaries. They provide examples like small elections where a vote can be decisive, questioning if the phenomenon still applies. They also ask if it extends to other collective actions like petitions or meat consumption.

  First, I need to identify if there's an existing concept. The closest might be the "voter's paradox" or "participation paradox," but these usually focus on rational choice theory. The user's issue is more about narrative framing than rationality. I recall "moral licensing" or "illusory causation," but those don't fit perfectly. The key is the shift in narrative based on context—demand versus accountability.

  The user's observation about small elections is crucial. In a 40-person union vote decided by one vote, the causal impact is clear, so the pre-vote narrative doesn't downplay individual impact. Thus, the phenomenon requires a large electorate where individual impact is negligible yet aggregate matters. Secret ballots and two-party systems might amplify it by anonymizing contributions, making the post-hoc accountability seem manufactured. 

  Regarding other collective actions, consider meat consumption. Buying a single steak seems insignificant, but collectively it supports industry practices. However, the accountability isn't as direct as in voting. Voting has a formal outcome and public participation aspect, making the accountability more pronounced. Petitions might be similar if signatories are listed, but usually, blame isn't individualized. Flying's environmental impact is diffuse; responsibility isn't pinned on individual flights.

  The consent asymmetry is separate but related. Voting is framed as endorsing the winner, but abstaining isn't seen as rejection. This might stem from the act's public nature versus inaction. Participation is interpretable; non-participation is ambiguous. 

  In conclusion, the phenomenon is the "narrative shift" in participation frameworks—between negligible contribution and full authorship. It requires a large-scale collective action where individual impact is statistically insignificant but morally significant in aggregate. The edges involve settings where individual impact is clear or accountability isn't enforced. The consent issue is a corollary, arising from interpreting participation as endorsement.
answer: |-
  You've hit upon a deeply ingrained conceptual tension in democratic participation, and while there isn't a single universally accepted term for *every* aspect you describe, the core phenomenon has a name: **Participatory Authorship Shift** (PAS). It's the cognitive and rhetorical switch between framing an act as **statistically negligible** (during participation appeals) and **morally/politically authorial** (during accountability assignments). Below is a breakdown, including boundaries and distinctions.

  ---

  ### **Core Definition: Participatory Authorship Shift (PAS)**
  **What it is:**  
  A rhetorical and psychological phenomenon where an individual's contribution to a collective outcome is:  
  - **Minimized** when encouraging participation (e.g., "Your vote alone changes nothing").  
  - **Maximized** when assigning responsibility (e.g., "You voted for this, so you own the outcome").  

  **Why both halves feel true:**  
  - **Pre-vote:** Your vote *is* statistically insignificant in large elections (probability of decisiveness ≈ 0).  
  - **Post-vote:** You *did* formally endorse an outcome through a ritualized act of consent, making you symbolically complicit.  
  The tension arises because **causation** (did my action change the result?) and **authorship** (did my action endorse the result?) are conflated when convenient.  

  ---

  ### **Boundaries & Edge Cases: When PAS Occurs (and When It Doesn't)**  
  1. **Requires Large-Scale Collective Action:**  
     - **Applies:** Federal elections (millions of voters). Your vote is causally negligible, but you're held morally/politically responsible.  
     - **Does NOT Apply:** Small groups (e.g., your 21–19 union vote). Here, your vote *can* be decisive, so pre-vote minimization isn't needed. Accountability feels direct and causal.  
     - **Edge:** School boards or town councils (~500–10k voters). PAS *may* emerge weakly if margins are large but vanishes in close races.  

  2. **Requires Formal, Legally Recognized Participation:**  
     - **Applies:** Voting, signing binding petitions (e.g., ballot initiatives).  
     - **Does NOT Apply:** Informal collective acts (e.g., eating meat, flying). While similar moral tensions exist (e.g., "your burger didn't cause climate change, but meat-eaters did"), you're rarely *individually* blamed for the outcome. Responsibility diffuses.  
     - **Why?** Voting is a **ritual of consent** with legal weight. Your name is on a list (even if secret), making your act *interpretable* as endorsement.  

  3. **Requires Winner-Takes-All Mandate Logic:**  
     - **Applies:** Systems where winners claim broad legitimacy (e.g., "the people have spoken").  
     - **Does NOT Apply:** Consensus-based decisions or proportional representation. If outcomes reflect coalitions, individual votes aren’t framed as direct authorship.  

  4. **Secret Ballot Paradox:**  
     - **Secret ballots enable PAS.** Because your choice is anonymous, others *interpret* your vote symbolically ("you backed the winner") rather than factually. In open votes, your actual intent is known, weakening post-hoc authorship claims.  

  ---

  ### **The "One-Way Consent" Issue: Separate but Linked**  
  This is **asymmetrical symbolic ratification**.  
  - **Voting = Consent:** Treated as endorsing the *entire* outcome.  
  - **Not Voting ≠ Dissent:** Treated as apathy or laziness, not opposition.  
  **Why?**  
  - **Active acts** are legible; **inaction** is ambiguous.  
  - **System legitimacy** depends on participation. Acknowledging non-voters as dissenters would undermine the "mandate" narrative.  
  **It's a corollary of PAS**—both rely on reinterpreting individual acts to serve collective narratives.  

  ---

  ### **Why Other Concepts Don't Fully Fit**  
  | Concept          | Why It’s Insufficient                          |  
  |------------------|-----------------------------------------------|  
  | Parfit's Torturers | Focuses on *causal* responsibility in aggregate harm. PAS is about *symbolic* authorship in legitimizing outcomes. |  
  | Expressive Voting | Describes *voter intent* (voting to express identity). PAS is about *external interpretation* of the act. |  
  | Hypocrisy        | Implies bad faith. PAS often arises from genuine tension in democratic theory. |  

  ---

  ### **Key Distinctions**  
  - **PAS vs. "Drop in the Bucket" Arguments:** PAS specifically requires a **ritualized, formal act** (voting) where participation is framed as civic duty *and* the outcome is seen as legitimate.  
  - **PAS vs. Moral Complicity:** PAS is **non-causal authorship**. You’re blamed for *validating* the outcome, not *causing* it.  
  - **PAS in Non-Voting Contexts:**  
    - **Petitions:** Weak PAS if signatories are public (you "endorse" the cause).  
    - **Consumer Acts:** No PAS—blame is diffuse, no formal "mandate" exists.  

  ---

  ### **In Essence**  
  Participatory Authorship Shift is the **democratic system’s cognitive hack**: it downplays your power to get you to participate, then amplifies your power to hold you accountable. It thrives where:  
  - Individual impact is mathematically negligible.  
  - The act is public or legally formalized.  
  - Outcomes are claimed as collective mandates.  
  The moment your action *can* swing the result (like your union vote), the illusion shatters—and democracy feels less like a shared myth and more like a counted choice.
