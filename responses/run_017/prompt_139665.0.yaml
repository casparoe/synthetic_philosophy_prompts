  First, I need to unpack the key elements of their request. They mention several cases: two island populations with different cultural stability, transmission fidelity varying by domain, the overnight-extinction test, harmful practices spreading, and independent invention. They also emphasize structural requirements like avoiding group advantage in definitions, psychological realism, falsifiability, and domain scope. 

  The user is clearly frustrated with the lack of clarity in their discussions. They’re a convener, likely a grad student or faculty, trying to structure a productive debate. Their unspoken need might be to prevent circular arguments and ensure the group evaluates theories systematically. They might also want to expose hidden assumptions in existing frameworks, especially around particulate units and fidelity.

  I should start by listing each requirement based on their cases and structural points. For each, I'll note why it’s necessary and categorize it as non-negotiable or debatable. The island case, for instance, highlights differential persistence, which is core to explaining cultural dynamics. The fidelity budget points to domain-specific transmission mechanisms—non-negotiable for realism. 

  The tensions they suspect (e.g., stable units vs. reconstructive transmission) need careful handling. I agree that high-fidelity particulate units conflict with cognitive reconstruction. This might be a fundamental trade-off. Similarly, quantitative models struggle with content biases making predictions untestable. 

  For theory families, memetics fails on fidelity and reconstruction. Dual-inheritance struggles with domain scope. Attractor models avoid particulate units but lack predictive power. Cultural group selection often conflates levels of selection. 

  The user’s deeper need is a framework that forces explicit criteria, revealing where theories overreach. By flagging incompatible desiderata, they can guide their group toward more grounded discussions. I’ll make sure to highlight which requirements are essential and where compromises are inevitable, helping them focus the debate.
answer: |-
  Here is a specification of requirements for a Darwinian theory of cultural change, anchored to your cases and structural demands, sorted by negotiability and highlighting potential incompatibilities:

  ### Non-Negotiable Requirements (Core Explanatory Mandate)
  1.  **Explain Differential Persistence/Loss (Island Case):** *Why* does Population A's toolkit remain stable while Population B loses specific techniques after key individuals die without apprentices? The theory must account for stability vs. fragility of traditions in comparable environments/populations. (Case Anchor: Island Populations A & B)
  2.  **Specify Transmission Fidelity Mechanisms (Fidelity Budget):** The theory must explain *what factors determine the fidelity of transmission* for a cultural item, accounting for why fidelity differs drastically across domains (e.g., net knots vs. melodies) within the *same* population. It must identify the source of fidelity (e.g., task structure, cognitive demands, teaching protocols, artifact properties). (Case Anchor: Transmission-Fidelity Budget)
  3.  **Explain Overnight Extinction Recovery Patterns (Storage Test):** The theory must predict which traditions would recover under two scenarios: (a) all bearers dead but artifacts/descriptions intact; (b) one competent adult survives with no artifacts. This forces articulation of *where* and *in what form* the information necessary for reproduction resides (e.g., brains, artifacts, environment). (Case Anchor: Overnight-Extinction Test)
  4.  **Account for Maladaptive Spread (Harmful Practices):** The theory must explain how cultural items that reduce the fitness (survival/reproduction) of their bearers can spread and persist *without* relying on "for-the-good-of-the-item" teleology. Explanatory mechanisms must be causal, not teleological. (Case Anchor: Harmful Items Spreading)
  5.  **Define Unit Identity & Countability (Independent Invention):** The theory must provide *operationalizable criteria* for identifying a "unit" of culture (e.g., a technique) across time and space. It must distinguish between descent (lineage) and independent invention (convergence) of similar forms and explain how to count distinct units in a corpus. (Case Anchor: Independent Invention)
  6.  **Specify Level(s) of Selection:** The theory must be clear about the entities upon which selection acts (e.g., cultural variants within individuals, individuals, groups) and allow for multi-level selection *without* defining cultural items *a priori* by their group-level benefits. (Structural Requirement: Avoid Built-in Group Advantage)
  7.  **Be Psychologically & Culturally Realistic:** The theory must be compatible with known cognitive and social learning processes (e.g., reconstruction, guided variation, biased transmission via prestige/content, learning from artifacts/scaffolding), not rely solely on high-fidelity imitation if that's empirically inadequate. (Structural Requirement: Compatibility with Actual Learning)
  8.  **Be Falsifiable:** The theory must specify clear, empirically testable scenarios or patterns that, if observed, would contradict its core mechanisms or predictions. This prevents unfalsifiable "just-so" storytelling. (Structural Requirement: Adaptationist Worry)
  9.  **Declare Scope & Limits:** The theory must explicitly state which domains of culture (technology, language, science, religion, law, fashion) it aims to explain and acknowledge where its mechanisms may not apply or require significant modification. (Structural Requirement: Domain Scope)

  ### Negotiable Requirements (Often Camp Preferences)
  10. **Require High-Fidelity, Particulate "Replicators":** The demand for discrete, atomistic, high-fidelity copying units (like genes) for tractable population-genetic modeling. *Why potentially negotiable:* Your "reconstructive learning" and "attractor" points strongly suggest fidelity varies and units may be fuzzy/constructed during transmission. Insisting on high-fidelity particles may exclude plausible mechanisms for stability (e.g., via reconstruction to an attractor). This is the "biggest offender" you suspected. (Structural Tension Point)
  11. **Demand Quantitative Predictive Power (Population-Genetic Structure):** The requirement for precise, quantitative predictions of frequencies over time using formal population-genetics models. *Why potentially negotiable:* While desirable, this may be fundamentally at odds with incorporating rich, domain/content-specific biases and reconstructive processes (Requirement 7), which introduce complexity making precise long-term prediction intractable. (Structural Tension Point)
  12. **Insist on Cultural Group Selection (CGS) as Primary Driver:** *Requiring* CGS as the main or only explanation for group-functional traits. *Why negotiable:* CGS mechanisms *could* operate, but the theory must not *depend* on it (per Requirement 6). Other mechanisms (e.g., biased transmission, guided variation) might explain group-level patterns without between-group selection.

  ### Incompatible Desiderata Subsets
  *   **Tension 1 (Your suspicion i):** **High-Fidelity Particulate Units (10)** vs. **Reconstructive Transmission & Attractors (7).** These are *likely fundamentally incompatible* for core cultural units. High fidelity implies faithful copying of discrete units. Reconstructive learning implies generation from underlying principles/rules/schemas, guided by content biases and attractors, resulting in *similar* but not necessarily identical outputs. Stability may arise from converging on the same attractor, not copying fidelity. Insisting on high-fidelity particles forces an artificial structure onto culture.
  *   **Tension 2 (Your suspicion ii):** **Quantitative Predictive Power (PG Structure) (11)** vs. **Rich Content/Context Biases (7).** These create a *significant trade-off*, likely making *joint full satisfaction impossible*. Formal PG models require simplifying assumptions (fixed traits, measurable fitnesses, known transmission rules). Incorporating the vast, context-dependent complexity of human cognition, content biases, and reconstructive processes makes parameterization infeasible and predictions unreliable beyond short-term/simple cases. You gain realism but lose predictive precision/falsifiability; you gain tractability/predictivity but lose realism.

  ### Most Excluding Requirement
  **Requirement 5 (Define Unit Identity & Countability)** does the most work in excluding candidates. It forces operationalization – how do you *actually* identify "the same" hook design or waterproofing method in the archaeological/ethnographic record? This immediately challenges meme definitions, exposes fuzziness in dual-inheritance "traits," questions what an "attractor" really is as a countable unit, and complicates defining the "variant" in group selection models.

  ### How Families Fare (Very Briefly)
  *   **Memetics (Replicator Picture):** Fails hard on Fidelity (2), Realism (7 - ignores reconstruction/attractors), Unit Identity (5 - vague/circular definitions), Maladaptation (4 - often implies selfish replicators). Strong on Falsifiability (8) *in principle*, but often fails in practice due to unit vagueness. Scope (9) overreaches.
  *   **Dual-Inheritance Theory (Population-Genetic):** Excels at Quantitative Prediction (11) & Levels (6). Struggles with Unit Identity (5 - defining/counting "cultural traits"), Fidelity Mechanisms (2 - often assumes fixed fidelity), Realism (7 - simplification necessary for modeling), Scope (9 - better for tech/skills than e.g., religion). Overnight Extinction (3) unclear.
  *   **Cultural Attractors/Epidemiology:** Excels at Realism (7 - embraces reconstruction/biases), Fidelity Variation (2 - explains domain differences), Maladaptation (4 - via content biases). Struggles with Unit Identity (5 - attractors are fuzzy), Quantitative Prediction (11 - difficult), Falsifiability (8 - risk of post-hoc "attractor" labeling). Overnight Extinction (3) depends on attractor stability/accessibility.
  *   **Cultural Group Selection (CGS):** Focuses on Levels (6) & can explain group-level stability/functionality. Often weak on Unit Identity (5), Transmission Fidelity (2), Realism (7 - may downplay individual-level biases), Differential Loss (1 - why *these* specific items lost?). Risks violating "no built-in group advantage" (6) if traits defined by function. Maladaptation (4) challenging unless within-group mechanisms specified.

  **Key Takeaway:** The core tensions revolve around defining units and balancing mechanistic realism with predictive tractability. No existing theory satisfies all non-negotiables comfortably, primarily due to the unit definition problem and the particulate-vs-reconstructive divide. Your suspicion about the incompatibility of high-fidelity particles with reconstructive transmission is well-founded and central.
