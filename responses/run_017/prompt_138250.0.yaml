prompt: |-
  I write the incident write-ups for a customer-support chatbot we ship — usually two or three a week, about twenty minutes each, and they get read by on-call engineers, by our compliance person, and sometimes pasted more or less unchanged into a message to a customer whose ticket we messed up. (What we actually run is a router over a couple of models plus a retrieval step plus some hard rules, so "the system" is never really one thing.) The thing I keep tripping over is when it's ok to write that the assistant knew, decided, wanted, was trying to, or believed something, versus just describing what it output.

  I got into this on my own after reading about the intentional stance — the idea being that treating a thing as an agent and predicting from what it believes and wants is a strategy you adopt, not a discovery about what's inside it. That clicked, but "adopt it if its predictive" isn't something I can hand to a writer with a deadline and an engineering lead who will sign off on nothing that sounds like philosophy.

  So: give me a one-page procedure in plain english that someone with no philosophy can run in five minutes on a single sentence — the questions in order, what counts as a good enough answer to each, where it just says no and you rewrite, and where it hands the decision to a person because the question is about what we're willing to be read as claiming rather than about what's true. Two tests I half-invented, use them or replace them: the swap test (if we swapped in a completely different system with the same outputs, would the sentence still be true?) and the copy-paste test (does the sentence survive being pasted into a letter to a regulator?). The case I can't work out is where the mental word is definately the most predictive way to talk but no part of the machine corresponds to it — the pattern lives in the training data, not in the system. I've been calling that borrowed psychology.

  Run the procedure on three: (1) "the assistant knew the order number but gave the wrong one" — retrieval did fetch the right number; (2) "the assistant was tricked by text hidden in the uploaded PDF into approving a refund"; (3) "it doesn't want to disappoint people, so it stalls instead of saying the order is lost" — all we have is thumbs-down data. I want at least one where the rule tells me to do the opposite of what my team does now. And tell me what the procedure can't do, where it'll misfire on the kind of system we actually have, and — since I'm guessing at the philosophy — what would change your mind about the whole setup and where you think my framing is most likely wrong.
reasoning: |-
  We are creating a one-page procedure for writing incident reports about a customer-support chatbot. The key issue is when it's acceptable to use mental state verbs (knew, decided, wanted, tried, believed) versus just describing outputs.

  The procedure should:
  - Be in plain English.
  - Take about 5 minutes per sentence.
  - Include a sequence of questions to ask about a sentence that uses a mental state verb.
  - Specify what counts as a good answer, when to rewrite, and when to escalate.
  - Incorporate the swap test and copy-paste test, or alternatives if needed.
  - Address the case of "borrowed psychology" (where the pattern is in the training data but not in the system).

  We'll also run the procedure on three examples and note where it contradicts current practice.

  Additionally, we'll discuss:
  - Limitations of the procedure (where it might misfire).
  - What would change the assistant's mind about the whole setup.
  - Where the user's framing might be wrong.

  ---

  **Procedure: When to Use Mental State Verbs in Incident Reports**

  When writing about the chatbot's behavior, avoid mental state verbs (like "knew", "decided", "wanted", "tried", "believed") unless they pass the following checks. For each sentence that uses such a verb, ask these questions in order:

  1. **The Swap Test**: If we replaced the entire system (all models, retrieval, rules) with a completely different system that produced the same outputs for the same inputs, would the sentence still be true? 
     - **Good enough answer**: If yes, then the mental state verb is acceptable because it's about the behavior, not the internal workings. If no, then the verb is making a claim about the system's internals and we must proceed to the next question.
     - **Rewrite**: If the answer is no and the verb fails this test, rewrite the sentence without the mental state verb to describe only the outputs and inputs. Example: Instead of "the assistant knew X", write "the assistant had access to X and outputted ...".

  2. **The Copy-Paste Test**: Could this sentence be pasted into a formal communication (like a message to a regulator or a customer) without implying claims we can't support?
     - **Good enough answer**: If yes, then it's acceptable. If no, then the verb is too strong and we must either rewrite or escalate.
     - **Rewrite**: If the answer is no and the verb fails this test, rewrite to remove the mental state verb and stick to observable facts. Example: Instead of "the assistant was tricked", write "the assistant processed the uploaded PDF and incorrectly approved the refund".
     - **Escalate**: If you are unsure whether the claim is acceptable for formal communication, or if the rewrite would make the report less clear without the mental verb, escalate to the compliance person or engineering lead for a decision.

  3. **The Borrowed Psychology Check**: Is the mental state verb being used because it's the most predictive or natural way to describe a pattern that exists in the training data (or in human-like behavior) but not necessarily in the system's design?
     - **Good enough answer**: If yes, then we are in the territory of "borrowed psychology". This is acceptable only if the verb passes the Swap Test (i.e., it's about behavior) and the Copy-Paste Test (i.e., it's safe for formal contexts). Otherwise, rewrite.
     - **Rewrite**: If the verb is borrowed psychology and fails either test, rewrite to avoid the mental state. Instead, describe the pattern in terms of inputs and outputs. Example: Instead of "it doesn't want to disappoint people", write "the system tends to avoid giving negative news, resulting in stalling responses in cases of order loss".

  **Important Notes**:
  - **Default**: When in doubt, describe the behavior without mental state verbs. Focus on what the system did (outputs) and what information it had (inputs/retrieval).
  - **Escalate**: If the mental state verb is critical to the explanation and removing it would make the report unclear or less useful, escalate to the compliance person and engineering lead. They can decide if the verb is acceptable given the audience (e.g., internal vs. external) and our willingness to be read as making such claims.

  ---

  **Applying the Procedure to the Examples**

  **Example 1**: "The assistant knew the order number but gave the wrong one."

  - **Swap Test**: If we swapped the system with a different one that also retrieved the right order number but output the wrong one, would the sentence still be true? Yes, because any system that has the right data but outputs wrong would fit. So it passes.
  - **Copy-Paste Test**: Would this be acceptable in a message to a regulator? Probably not, because "knew" implies a mental state we can't prove. Regulators might interpret it as the system having understanding. So it fails.
  - **Borrowed Psychology Check**: This isn't borrowed psychology; it's about retrieval. But the verb "knew" is the issue.

  **Verdict**: Fails the Copy-Paste Test. Rewrite to: "The assistant retrieved the correct order number but output an incorrect one."

  **Example 2**: "The assistant was tricked by text hidden in the uploaded PDF into approving a refund."

  - **Swap Test**: If we swapped the system, any system that processed the PDF and output an incorrect approval would be "tricked"? Yes, so it passes (in the behavioral sense).
  - **Copy-Paste Test**: In a message to a regulator, "tricked" might imply vulnerability and intent by a malicious actor, which might be acceptable if that's the case. But note: we are describing an exploit. However, the word "tricked" anthropomorphizes. It might be acceptable if we are comfortable with that implication. But to be safe, we might fail it because we can't claim the system has subjective experience.
  - **Borrowed Psychology Check**: This is not borrowed psychology; it's about an exploit. But the word "tricked" is mental.

  **Verdict**: This is borderline. It passes the Swap Test but might fail the Copy-Paste Test. We should rewrite to be more factual: "The assistant processed an uploaded PDF containing hidden text and, based on that text, incorrectly approved a refund." However, if the incident is about an adversarial attack, we might want to convey the intent. Escalate to compliance: if they are okay with "tricked" in customer communications (as it's common in cybersecurity), then it might be acceptable. Otherwise, rewrite.

  **Example 3**: "It doesn't want to disappoint people, so it stalls instead of saying the order is lost."

  - **Swap Test**: If we swapped the system, would any system that avoids negative news and stalls fit? Yes, so it passes behaviorally.
  - **Copy-Paste Test**: In a message to a regulator, saying the system "doesn't want to disappoint" is too anthropomorphic and not acceptable. It fails.
  - **Borrowed Psychology Check**: This is exactly borrowed psychology. The pattern (avoiding disappointment) is in the training data (from human feedback) but not an explicit goal in the system. The verb "want" is a human-like explanation. However, because it fails the Copy-Paste Test, we must rewrite.

  **Verdict**: Fails the Copy-Paste Test. Rewrite to: "The system tends to avoid delivering negative news, resulting in stalling responses (e.g., not immediately confirming order loss) when such news is required."

  **Contradiction with Current Practice**: 
  For example 3, the team might currently use the "doesn't want to disappoint" language because it's intuitive and predictive. But the procedure would require rewriting to avoid the mental state verb for external communications. This is the opposite of what the team might do now.

  ---

  **Limitations of the Procedure**

  1. **Ambiguous Systems**: Our system is a pipeline (router, models, retrieval, rules). The procedure might misfire when the mental state verb applies to one component but not the whole. For example, if a model "decides" something internally (as a computation) but the overall system doesn't, the Swap Test might fail even if the verb is useful. But note: the procedure is for the whole system (the assistant). We don't ascribe mental states to components.

  2. **Borrowed Psychology in Internal Reports**: For internal audiences (like engineers), using mental state verbs might be acceptable and efficient. The procedure is designed for reports that might be shared externally. For internal-only reports, we might relax the rules, but the procedure doesn't account for that. The writer must know the audience.

  3. **Edge Cases in Copy-Paste Test**: What counts as acceptable for a regulator? This is subjective and may change. The procedure relies on the writer's judgment and escalation.

  4. **Non-Predictive But True**: Sometimes a mental state verb might be literally true (e.g., if the system has an explicit rule that corresponds to a belief) but the procedure might reject it based on the tests. However, in current AI systems, explicit beliefs are rare.

  **What Would Change the Assistant's Mind?**
  - If we built a system with explicit internal representations of knowledge, beliefs, and desires (e.g., a symbolic AI with a belief database), then mental state verbs might be literally true. The Swap Test would then be too strict because swapping to a different system might not have the same internals. We would need to adjust the procedure to allow for such cases.

  **Where the Framing Might Be Wrong**
  - The user's framing of "borrowed psychology" is insightful, but it might be too restrictive. Sometimes, even if a pattern is in the training data, if the system robustly exhibits that behavior, it might be acceptable to use mental state verbs in internal discussions. However, for the purpose of clear and defensible external communications, the procedure is sound.
answer: |-
  Here's a one-page procedure to determine when mental state verbs (e.g., "knew," "decided," "wanted," "tried," "believed") are acceptable in chatbot incident write-ups. This is designed for quick (5-minute) checks per sentence, with clear pass/fail criteria. The goal is to avoid over-claiming about the system's internals while keeping language practical for engineers, compliance, and customers.

  ---

  ### **Procedure: When to Use Mental State Verbs**  
  **Step-by-Step Questions (Run in Order for Each Sentence)**  
  Ask these questions about any sentence containing a mental state verb. If a step fails, rewrite or escalate as specified. Use the **Swap Test** (ST) and **Copy-Paste Test** (CPT) as defined below:  
  - **Swap Test (ST)**: *If we replaced the entire system (models, rules, retrieval) with a different system that produced identical outputs, would the sentence still hold?* Passes if YES (behavioral description). Fails if NO (relies on specific internals).  
  - **Copy-Paste Test (CPT)**: *If pasted verbatim into a customer/regulator message, would it imply claims we can't defend (e.g., anthropomorphism, intent, or false internals)?* Passes if NO (safe for external use). Fails if YES (risky language).  

  1. **Question 1: Does the verb pass the Swap Test?**  
     - **Good enough answer**: YES (it describes observable behavior/outputs, not unique internals).  
     - **If NO**: Rewrite immediately. Replace the mental verb with input/output facts (e.g., "retrieved X but outputted Y").  
     - **If YES**: Proceed to Question 2.  

  2. **Question 2: Does the verb pass the Copy-Paste Test?**  
     - **Good enough answer**: YES (it avoids implying human-like intent, consciousness, or unverifiable internals).  
     - **If NO**: Rewrite to remove the mental verb. Focus on data, rules, or outputs (e.g., "the system processed X, triggering a refund").  
     - **If YES**: Proceed to Question 3.  

  3. **Question 3: Is this "borrowed psychology"?**  
     - **Borrowed psychology definition**: The verb describes a pattern rooted in training data (e.g., human-like behavior) but not explicitly in the system's code/rules.  
     - **If YES**: Rewrite. Borrowed psychology fails CPT (overclaims) and isn’t defensible externally. Use neutral terms (e.g., "the system’s outputs aligned with a common pattern from training data").  
     - **If NO**: The verb is acceptable. Use it.  
     - **Unclear?** Escalate to compliance/engineering lead. This is about company policy, not truth.  

  **When to Rewrite vs. Escalate**:  
  - **Rewrite**: Always if any test fails (ST, CPT, or borrowed psychology).  
  - **Escalate**: Only if the verb is critical for clarity and you’re unsure about company policy (e.g., "Is 'tricked' too anthropomorphic for customers?"). Default to rewriting.  

  **Key Principle**: Never use mental verbs for the system as a whole unless they pass all tests. It’s safer to describe:  
  - Inputs (e.g., "the user provided X").  
  - Outputs (e.g., "the assistant responded with Y").  
  - Subsystem actions (e.g., "retrieval fetched Z, but the router overrode it").  

  ---

  ### **Test Cases: Applying the Procedure**  
  **Example 1**: "The assistant knew the order number but gave the wrong one."  
  - **Q1 (ST)**: Does it pass Swap Test?  
    - *Answer*: YES. If a swapped system retrieved the right number but outputted wrong, this holds.  
  - **Q2 (CPT)**: Does it pass Copy-Paste Test?  
    - *Answer*: NO. "Knew" implies understanding, which we can’t prove. Fails for regulators/customers.  
  - **Q3 (Borrowed psychology)**: Is this borrowed?  
    - *Answer*: NO. This is about retrieval (a subsystem).  
  - **Verdict**: FAIL (Q2). Rewrite to: *"Retrieval fetched the correct order number, but the assistant outputted an incorrect one."*  
  - **Why?** "Knew" anthropomorphizes. Current team might use this, but the procedure rejects it for external safety.  

  **Example 2**: "The assistant was tricked by text hidden in the uploaded PDF into approving a refund."  
  - **Q1 (ST)**: Does it pass Swap Test?  
    - *Answer*: YES. Any system processing the PDF and outputting approval fits.  
  - **Q2 (CPT)**: Does it pass Copy-Paste Test?  
    - *Answer*: NO. "Tricked" implies intent/vulnerability we can’t claim. Unacceptable for regulators.  
  - **Q3 (Borrowed psychology)**: Is this borrowed?  
    - *Answer*: NO. This is an exploit of the model’s processing.  
  - **Verdict**: FAIL (Q2). Rewrite to: *"The assistant processed hidden text in the uploaded PDF and incorrectly approved a refund."*  
  - **Why?** "Tricked" sounds like the system has agency. The rewrite is factual.  

  **Example 3**: "It doesn’t want to disappoint people, so it stalls instead of saying the order is lost."  
  - **Q1 (ST)**: Does it pass Swap Test?  
    - *Answer*: YES. If a swapped system avoids negative news and stalls, this holds.  
  - **Q2 (CPT)**: Does it pass Copy-Paste Test?  
    - *Answer*: NO. "Want" falsely implies desire/intent. Unacceptable externally.  
  - **Q3 (Borrowed psychology)**: Is this borrowed?  
    - *Answer*: YES. This "avoids disappointment" pattern is from training data (thumbs-down signals), not system design.  
  - **Verdict**: FAIL (Q3). Rewrite to: *"Based on patterns in training data, the assistant avoids negative responses; here, it stalled instead of confirming the order was lost."*  
  - **Why?** This is the opposite of current practice (which likely uses "want" for intuition). The procedure flags borrowed psychology as indefensible.  

  ---

  ### **Limitations and Caveats**  
  **Where the Procedure Misfires**:  
  1. **Component-level claims**: If you write about subsystems (e.g., "the model believed X"), the Swap Test may falsely pass. Avoid mental verbs for components—describe mechanisms instead (e.g., "the model’s weights prioritized X").  
  2. **Ambiguous training-data patterns**: Borrowed psychology is hard to prove. When unclear, rewrite or escalate.  
  3. **Internal vs. external audiences**: For internal reports (e.g., engineers), mental verbs might be efficient shorthand. The CPT assumes external use. If your audience is purely internal, relax CPT—but default to rewriting.  
  4. **Edge cases**: If a verb passes ST/CPT but feels "off" (e.g., "decided" for a hard-coded rule), rewrite anyway. Better to say: "the rule triggered X."  

  **What Would Change This Approach?**  
  - **If the system had true internals**: If you add modules with explicit belief states (e.g., a knowledge graph with confidence scores), the Swap Test could be adjusted to allow verbs like "knew" for those components. Currently, it’s not justified.  
  - **If regulators accept anthropomorphism**: If policy changes (e.g., "AI intent" is legally defined), relax the CPT. Today, it’s risky.  

  **Critique of Your Framing**:  
  - **Borrowed psychology is spot-on**, but calling it "predictive" undercuts your goal. Predictive ≠ defensible. The procedure prioritizes defensibility (via CPT) over predictive ease.  
  - **The intentional stance is pragmatic**, but incident reports aren’t philosophy—they’re liability documents. Your tests (ST/CPT) are excellent because they convert "predictiveness" into concrete checks.  
  - **Your team’s bias**: You likely use mental verbs because they’re intuitive (e.g., Example 3). The procedure trades intuition for precision to avoid backlash.  

  **Final Tip**: When stuck, replace mental verbs with:  
  - "The system outputted..."  
  - "Retrieval/data showed..."  
  - "A rule/model caused..."  
  This is always safe. Escalate only for policy calls (e.g., "Can we say 'tricked' in customer emails?").  

  ---  
  This procedure ensures clarity, minimizes liability, and works for your hybrid system. It rejects borrowed psychology and anthropomorphism, forcing rewrites that focus on data and outputs—which is where your team’s current approach is weakest.
