prompt: |-
  I write software for a living and read about statistics and the philosophy of science on the side, so I know the standard Bayesian machinery — priors, likelihoods, updating by conditioning — but I have no formal philosophy training, and I keep running into a distinction I cannot name. Here are the three situations I cannot keep apart.

  First, my own work. I have a dataset, I plot it, I notice a kink, and then I write a model with a term that produces the kink. The model fits beautifully. I do not feel entitled to say the data confirmed the model, because I chose the model after looking at the data. In my field the remedy is mechanical: hold out data the model never saw and check it there.

  Second, a case from physics. A theory is built partly to account for a fact that astronomers had known for decades — the residual, unexplained precession of Mercury's perihelion, recognised as an anomaly since 1859 and still unexplained when general relativity arrived — and that accommodation is routinely counted among the strongest evidence for the theory. The shape looks identical to my first case: the fact was sitting there first, and the theory was shaped to fit it. But nobody reaches for a held-out set, and the fit is treated as genuine support rather than as cheating.

  Third, the formalism, as I understand it, says the second case should not work at all. If I already know a fact, I assign it probability one, and conditioning on something of probability one cannot move any probability. So an already-known fact cannot raise the probability of any hypothesis, however elegantly the hypothesis explains it. On that telling, case one and case two come out the same way, and both come out badly, which is the opposite of what the physicists and my own instincts say.

  So my question: is there a name for what I am circling, and is it one thing or several?

  Is whatever makes case one illegitimate the same thing that makes case three a problem, or are these two separate complaints that merely look alike in a formalism that only tracks probabilities?

  My own hypothesis is that the variable that matters is not whether the fact was known before the theory existed, but whether the fact was in front of the theorist while the theory was being built — whether I had that data point on my screen when I chose the functional form. Someone who fixed the model first and only then looked at the data would be entitled to count it, even if the data had been sitting in a filing cabinet for fifty years. Is there an established concept for that distinction, and does it line up with whatever the philosophy literature calls the problem in case three?

  A related guess, which I lack the vocabulary to state properly: perhaps what does the work is not how probable the fact was to me, but how probable it was that a theory of this kind would manage to fit it at all. My model's kink term could have fit anything, so the fit tells me little; general relativity could easily have failed to reproduce the Mercury residual, and that it did not is the news. Is that a different thing from the first distinction, or the same thing in other words?

  Finally, does my train/test split capture any of this? It seems to me to measure predictive accuracy on unseen cases, which is a different virtue from being supported by a fact: a model can predict well while being wrong about why.

  I do not want references or a reading list. I want the carving: what the phenomenon is, what it is not, where its edges are, and which nearby concepts attach to which of my three cases. If part of what I am describing has no established name, say so and give me a working label with a definition, plus the boundary cases that would settle whether it applies.
reasoning: |-
  Okay, the user is a software developer with a strong background in statistics and Bayesian methods, but they're struggling with a philosophical distinction in scientific evidence. They've presented three scenarios: their own model-fitting experience, the Mercury perihelion example from physics, and the Bayesian formalism paradox. 

  Hmm, their core confusion seems to be about why post-hoc fitting feels "illegitimate" in their work but counts as strong evidence in physics. The Bayesian math says both should be worthless since known facts have P=1. But their intuition says otherwise - especially for the Mercury case. 

  Let me unpack their examples carefully. First scenario is classic overfitting: they saw a kink, modeled the kink, and rightly feel it's cheating. The remedy (train/test split) makes sense here. Second scenario breaks that intuition though - Einstein absolutely used Mercury's anomaly when building GR, yet physicists treat it as confirmation. Why the difference? 

  Ah, I think the key is in what they hinted at with "how probable it was that a theory would fit". For their kink model, any arbitrary curve could've been forced to fit. But GR is a tightly constrained framework - it couldn't easily accommodate Mercury's anomaly without its core principles (curved spacetime etc.) making that prediction inevitable. 

  The Bayesian paradox is actually a red herring. The issue isn't literal probability assignments but explanatory scope. When we say GR "explains" Mercury, we mean it derives the anomaly from deeper principles that also predict novel phenomena (like light bending). Their kink model lacks that depth - it's just curve-fitting. 

  For their practical work, train/test protects against overfitting but doesn't address explanatory depth. A model can predict well without being "true" - which is why they're uneasy even with good cross-validation scores. The Mercury case works precisely because GR wasn't just fitting that one datum but revealing a universal structure. 

  So the real distinction is between accommodation (fitting known data) versus prediction (implying new phenomena), but with a twist: what matters is whether the fit requires substantive theoretical constraints. I'll call this "constraint-based confirmation" versus "arbitrary fitting". The train/test split handles the latter but not the former.
answer: |-
  Your struggle is precise and profound—you're grappling with **theory-ladenness of evidence** and **confirmational holism**, but the core distinction you're circling is the difference between **accommodation** and **prediction**, with nuance added by the **theoretical constraints** involved. Below is the carving you requested, dissecting each case and the underlying principles:

  ---

  ### **1. The Core Distinction: Accommodation vs. Prediction**
  - **Accommodation**: Fitting a theory to *already-known* data.  
    - *Your case*: You saw a kink, added a term to fit it.  
    - *Problem*: High risk of **overfitting** (mistaking noise for signal).  
  - **Prediction**: A theory implies *novel, unexpected* phenomena later confirmed.  
    - *Mercury case*: GR didn't just fit Mercury's data; it **entailed** light bending, gravitational redshift, etc.  
    - *Strength*: The anomaly was a known-but-*unexplained* fact; GR derived it from fundamental principles.  

  **Key Insight**: The legitimacy hinges on whether the theory *could have failed* to fit the fact.  
  - Your model's kink term was **flexible** (it could fit any arbitrary curve).  
  - GR's field equations were **rigid** (they *had* to output Mercury's precession if GR was true).  

  ---

  ### **2. Resolving the Bayesian Paradox (Case 3)**
  The formalism isn't wrong—it's misapplied. When a fact is known, conditioning *formally* gives it P=1. But in practice, we ask:  
  - **How surprising is the fit?**  
    - If the hypothesis is *highly constrained* (e.g., GR's few parameters), fitting a known fact *is* evidence because it was unlikely for *that specific theory* to match it.  
    - If the hypothesis is *ad hoc* (e.g., your kink term), the fit is unsurprising.  
  **Bayesian workaround**: Don't set P(fact)=1. Instead, assess the likelihood P(fact | theory) *as if the fact were unknown*. GR's P(Mercury | GR) ≈ 1, while P(Mercury | Newton) ≈ 0.  

  ---

  ### **3. What Matters: Theorist's Awareness vs. Theoretical Rigidity**
  You suspected two variables—**whether the data was "in front of" the theorist** and **how easily the theory could fit the fact**. The latter dominates:  
  - **Flexible theories** (e.g., polynomial regression) can fit anything—so accommodation is weak evidence.  
  - **Constrained theories** (e.g., GR, quantum electrodynamics) have few degrees of freedom—so accommodation *is* evidence.  
  The "filing cabinet" scenario you described:  
  - If a theorist *ignores* 1859–1915 Mercury data, derives GR from pure math, and *then* matches the anomaly, it feels like prediction.  
  - But even if Einstein used the data, GR's rigidity makes the fit evidentially significant.  

  **Label**: **Confirmatory strength from theoretical constraints**.  
  - *Defined*: The evidential weight of a fact depends on how many alternative theories could also explain it.  
  - *Boundary case*: If a theory is so flexible it fits all possible data (e.g., "everything happens because of vibes"), it has zero confirmatory power.  

  ---

  ### **4. Your Train/Test Split: What It Captures (and Doesn't)**
  - **Captures**: **Predictive accuracy**—a model's ability to generalize to *new* data.  
  - **Fails to capture**: **Explanatory depth**—whether the model reflects true causal structure.  
    - A model can predict well but be wrong (e.g., epicycles).  
    - A model can be true but predict poorly with limited data (e.g., quantum gravity).  
  This is why physicists don't use train/test for GR: its evidence comes from *diverse, precise* fits (Mercury *and* GPS clocks *and* gravitational waves) that are improbable under alternatives.  

  ---

  ### **5. Mapping to Your Cases**
  | Case | Issue | Resolution |
  |------|-------|------------|
  | **1. Your kink model** | Illegitimate accommodation | Overfitting due to **flexible parameters**. Train/test rightly required. |
  | **2. Mercury anomaly** | Legitimate accommodation | Evidence because GR is **tightly constrained**. Predictions (e.g., light bending) sealed its validity. |
  | **3. Bayesian formalism** | Apparent paradox | Avoid P(fact)=1; focus on **likelihood contrast** (P(fact | theory) vs. P(fact | alternatives)). |

  ---

  ### **6. Philosophical Labels & Boundaries**
  - **Accommodation vs. Prediction**: The standard distinction, but **insufficient** alone.  
  - **Ad hoc hypothesis**: Your kink term—tacked on solely to fit known data, no independent justification.  
  - **Non-ad hoc hypothesis**: GR—Mercury's fit emerged from its core principles.  
  - **Novelty**: Some philosophers argue only *temporally novel* facts (unknown when the theory was built) count. Most now agree **use-novelty** (data not used in model construction) suffices.  
  - **Boundary test**: Could the theory have *failed* to fit the fact?  
    - Yes (GR) → strong evidence.  
    - No (your kink model) → weak evidence.  

  **Your vocabulary gap**: **Theoretical riskiness**. A theory gains credibility when it fits facts it *could plausibly have gotten wrong*. GR risked failure; your kink term did not.  

  ---

  ### **Summary**
  - **What unifies cases 1 and 3**: Both involve weak evidence from accommodation *without theoretical constraints*.  
  - **What separates case 2**: The theory was **risky**—its structure made the fit improbable unless it was true.  
  - **Train/test's role**: Guards against overfitting but doesn't validate truth—only predictive utility.  

  This is the heart of **scientific underdetermination**: Data alone can't prove a theory true, but a theory that *dangerously* predicts (or fits) facts its rivals can't gains plausibility. GR didn't just accommodate Mercury—it *demanded* it. Your kink term merely allowed it.
