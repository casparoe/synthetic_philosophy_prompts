  Ah, and I must remember their constraints: no waffling on vagueness, no letting them win by overemphasizing edge cases. In the brackets, I'll note their strongest move: showing how engineer manipulation seemingly reduces the distinction to contingent system design rather than fundamental agency. That’s the pressure point.
answer: |-
  Your cases are sharp, but they don't collapse the distinction—they clarify where it truly lives. Start with the second hospital nurse: she faces a system primed to *save* life unless interrupted. Her inaction lets the harm proceed down its existing path. That’s a paradigmatic *allowing*—the death depends on her *not redirecting* a process already in motion. Her will isn’t guiding events toward harm; it’s failing to steer them away.  

  Now the first nurse: she’s not just failing to act *within* a system; she *authored* the lethal dependency itself. When she designed the system to *require confirmation* for life-saving treatment, she initiated a chain where harm becomes the default outcome unless *she* (or others) actively prevents it. Her present inaction isn’t merely allowing a pre-existing threat; it’s the *culmination* of her prior affirmative act to structure the world so that non-intervention *produces* harm. This isn’t "allowing" in the bare sense—it’s *sustaining a doing*. Her past choice made her present omission *part of an ongoing harmful project* she set in motion. The difference isn’t in the engineer’s default setting per se, but in whether the agent’s own will *created the harmful dependency* others must now navigate.  

  [*Breaking point: You assume "designing the system" is a past act with no ongoing agential connection. But if her present inaction completes her past choice to install a harm-dependent system, it’s continuous with her original doing.*]  

