  Mencius compliance check: no transcendent claims. The market is human-scaled; roles are practical (e.g., HUSBAND as "stall-mate"). STRANGER's resistance echoes Confucian tensions with outsiders. 

  Poetic accessibility: even without philosophy, it should work as a vivid market vignette. Concrete details - soy sauce jars, persimmon stains - ground it. The ending leaves the tension unresolved, honoring the "empty-slot objection."

