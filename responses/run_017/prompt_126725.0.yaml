prompt: |-
  I live in a limited-equity housing cooperative and was recently elected to the small committee rewriting our occupancy agreement: about a dozen enforceable clauses, one winter of meetings, and a volunteer lawyer. The drafting has turned on which conception of freedom the document should be built around — a non-interference clause (the co-op and fellow members stay out of your unit), a capability clause (the co-op secures your effective ability to live well there: repairs, accessibility adaptations, and now broadband), or a non-domination clause (no member stands to the arbitrary will of another, board and manager included, backed by some machinery for contesting decisions).

  I need a defended ranking, not a survey. Which of these three actually changes what we would write, and which of the distinctions philosophers treat as load-bearing would collapse into drafting noise or into another clause? Concretely: does the non-domination clause buy anything over a non-interference clause plus appeal rights, once "arbitrary" has to be cashed out as something like "not required to track the interests of affected members as they could openly avow them"? And does the capability clause reach anything the other two cannot, or does it mainly license paternalism under a friendlier name?

  Rank two further questions alongside these rather than treating them as separate. First: the board is piloting an automated system that triages maintenance requests and flags arrears for review, and I cannot tell whether domination does real work there or is just a vivid restatement of ordinary accountability problems. Second: what I have started calling agenda power — the unchecked capacity to settle which grievances are intelligible as grievances at all, so that a complaint nobody has a name for never reaches a vote. Is that a distinct wrong deserving its own clause, or a redescription of something the three frameworks already cover?

  Tell me which of these deserve our scarce clauses and meeting time, and why: what criteria you are using (how much downstream drafting each choice settles, how contestable it is by members who are not philosophers, how much of it is merely symbolic), how you would trade those criteria off, and what would move an item up or down the list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a committee rewriting an occupancy agreement for a limited-equity housing cooperative. The core debate revolves around three philosophical concepts: non-interference, capability, and non-domination. They need a defended ranking of these concepts, not just a survey, to guide the drafting process efficiently. 

  First, I need to understand the practical implications of each concept. Non-interference is about keeping the co-op out of members' units. Capability focuses on ensuring members can live well with necessary support. Non-domination aims to prevent arbitrary power, ensuring decisions aren't made without considering members' interests. The user wants to know which of these actually affects the drafting and which distinctions might collapse into noise.

  Looking deeper, the user is concerned about efficiency and effectiveness. They have limited time and clauses, so they need to prioritize. They also have two additional questions: one about an automated system for maintenance and arrears, and another about "agenda power" – deciding which grievances get heard. These shouldn't be treated separately but integrated into the ranking.

  The user's explicit needs are clear, but their deeper concerns might include avoiding paternalism under the capability clause, ensuring that non-domination adds real value beyond existing appeal rights, and addressing hidden power dynamics like agenda control. They might also be worried about committee buy-in from non-philosophically inclined members, avoiding symbolic clauses that don't enforce well, and ensuring the agreement is practical and enforceable.

  To address this, I consider how each concept translates into enforceable clauses. Non-interference is straightforward but limited. Capability ensures essential services but could be seen as paternalistic. Non-domination tackles power imbalances but might be complex to implement. The automated system question tests whether non-domination addresses modern accountability issues. Agenda power is crucial as it determines whose voices are heard, possibly falling under non-domination but needing explicit mechanisms.

  Criteria for ranking include downstream impact (how many clauses it influences), contestability (ease of understanding), enforceability (legal viability), and problem coverage (addressing real issues). Trading these off: high-impact, enforceable concepts that cover gaps should rank higher, even if slightly complex. Symbolic clauses should be avoided.

  Ranking: Non-domination first because it addresses power dynamics and agenda control, which others don't fully cover. Capability next for tangible needs like broadband and repairs. Non-interference last as it's already partially covered and less comprehensive. The automated system and agenda power are best handled under non-domination, with specific provisions to prevent algorithmic bias and ensure inclusive grievance processes.

  Ultimately, the user needs actionable, prioritized clauses that resolve practical issues without unnecessary complexity, ensuring the agreement is robust, fair, and member-focused.
answer: |-
  Here’s a defended ranking of the frameworks and additional issues, optimized for practical impact on your occupancy agreement, clarity for non-philosophers, and efficient use of drafting resources. The goal is to prioritize **concrete, enforceable provisions** that resolve ambiguities in your current agreement while minimizing symbolic or redundant clauses.

  ### Core Ranking: Frameworks by Drafting Value
  1. **Non-Domination Clause**  
     **Why rank highest?**  
     - **Downstream impact**: Directly mandates structural safeguards against power imbalances (e.g., appeal processes, transparency requirements, limits on board discretion).  
     - **Addresses gaps**: Covers harms non-interference ignores (e.g., procedural unfairness, retaliation) and prevents capability clauses from becoming paternalistic by requiring member input.  
     - **Cashes out "arbitrary" practically**: Define it as:  
       *"Decisions affecting members must be grounded in co-op bylaws or policies adopted by member vote, with reasons provided in writing. Affected members may demand review if a decision lacks a clear link to documented co-op interests."*  
     - **Solves your "agenda power" concern**: Explicitly requires a process for members to raise unrecognized grievances (e.g., "Members may petition to add new grievance types to the agenda with 10% support").  
     - **Contestability**: Easier to frame as "fairness" and "voice" than philosophical abstractions.  

  2. **Capability Clause**  
     **Why second?**  
     - **Tangible obligations**: Mandates specific co-op duties (e.g., "timely repairs," "ADA-compliant common areas," "broadband access"). Non-domination ensures these aren’t imposed paternalistically.  
     - **Fills non-interference gaps**: Non-interference can’t compel the co-op to *act* (e.g., fixing a leak). Capability forces proactive support.  
     - **Risk**: Without non-domination, it *could* enable paternalism. Mitigate by tying capabilities to **member-defined needs** (e.g., "The co-op shall provide services identified as essential in biennial member surveys").  
     - **Enforceability**: Concrete standards (e.g., "repairs within 72 hours for critical issues") reduce disputes.  

  3. **Non-Interference Clause**  
     **Why last?**  
     - **Redundant or low value**: Limited-equity co-ops already imply restricted property rights. Most agreements already have "quiet enjoyment" clauses covering this.  
     - **Collapses into noise**: A strong non-domination clause (e.g., banning arbitrary inspections) covers core concerns. Adding it separately creates drafting overlap.  
     - **Fails critical tests**: Doesn’t address co-op *inaction* (capability) or procedural abuse (non-domination).  

  ### Ranking Additional Questions
  1. **Agenda Power**  
     **Why rank highest?**  
     - **Distinct harm**: Deciding "what counts as a grievance" is a primary tool of domination. Non-domination *requires* addressing this, but a **specific sub-clause** prevents evasion (e.g., "Grievance categories may be expanded by member petition or board proposal + member vote").  
     - **Drafting efficiency**: Resolves ambiguity in non-domination with 1–2 sentences.  
     - **Symbolic value**: Signals that marginalized concerns won’t be silenced.  

  2. **Automated System Accountability**  
     **Why lower?**  
     - **Covered by non-domination**: The risk isn’t automation itself, but *arbitrary* outcomes (e.g., error-prone algorithms with no appeal). Address via:  
       *"Automated systems affecting members must be audited annually for fairness; members may request human review of automated decisions."*  
     - **Downstream impact**: Handled in a "technology use" policy, not core occupancy terms.  

  ---

  ### Criteria & Tradeoffs Used
  | **Criterion**          | **Weight** | **Why?**                                                                 |
  |------------------------|------------|--------------------------------------------------------------------------|
  | **Downstream Drafting Impact** | Highest    | Avoids vague principles; forces concrete operational rules. Prioritizes clauses that resolve multiple ambiguities (e.g., non-domination enables appeal procedures). |
  | **Problem Coverage Gap**      | High       | Drops redundant concepts (non-interference) and elevates overlooked harms (agenda power). |
  | **Enforceability**            | Medium     | Philosophical clarity is worthless if lawyers/judges can’t apply it. Capability clauses need measurable standards. |
  | **Contestability (to non-philosophers)** | Medium     | Framing matters: "Fair process" (non-domination) > "Positive freedom" (capability) > "Negative liberty" (non-interference). |
  | **Symbolic Value**             | Low        | Your lawyer will cut pure symbolism. Prioritize clauses with practical teeth. |

  **Tradeoff Guidance**: If conflict arises, **favor enforceability over philosophical purity**. E.g., "arbitrary" *must* be defined procedurally ("violates written policy") not philosophically ("fails to track avowable interests"). Sacrifice elegance for clarity.

  ---

  ### Recommended Clauses for Your Agreement
  1. **Non-Domination Core** (3–4 provisions):  
     - Appeal process with neutral adjudicators.  
     - Ban on retaliatory actions.  
     - Transparency rule for board decisions.  
     - **Agenda Power Safeguard**: Mechanism to force new grievance types onto the agenda.  

  2. **Capability Minimums** (2–3 provisions):  
     - Defined repair timelines.  
     - Broadband access guarantee.  
     - Accessibility upgrade protocol (member-initiated).  
     - *Condition*: Member consultation before adding new capabilities.  

  3. **Drop Non-Interference** as redundant. Use standard "quiet enjoyment" language instead.  

  4. **Automation Addendum** (in tech policy, not occupancy agreement):  
     - Human review option.  
     - Annual bias audits.  

  ---

  ### What Moves an Item Up/Down?
  - **Up**: If it closes a loophole in current disputes (e.g., past agenda suppression → elevates agenda power).  
  - **Down**: If it requires complex metaphysical definitions (e.g., "avowable interests" → simplify to "member-ratified policies").  
  - **Up**: If it prevents costly litigation (e.g., clear appeal rights reduce lawsuits).  
  - **Down**: If it duplicates existing bylaws (e.g., non-interference ≈ quiet enjoyment).  

  **Final Advice**: Anchor the agreement in **non-domination** as the structural backbone. Use **capability** for service guarantees, but tether them to member input. **Kill non-interference** as a distinct concept—it’s either redundant or harmful. Address **agenda power** explicitly within non-domination. Automation is a sub-issue, not a core clause. This approach resolves 80% of drafting disputes with enforceable, member-legible terms.
