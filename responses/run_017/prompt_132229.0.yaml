  ### Special Composition Question Decision Tree  
  *Start at the top. Answer each question based on concrete cases, not labels. The endpoint shows your position’s key commitment.*  

  #### **Step 1: What are we asking about?**  
  - **A. Fundamentality**: Are we asking what exists at the most basic level of reality? (e.g., "Does a table *fundamentally* exist?")  
  - **B. Ordinary language**: Are we asking when everyday claims like "There’s a table here" are true? (e.g., "Is ‘table’ a useful concept, even if not fundamental?")  
  *→ If A, go to Step 2. If B, go to Step 3.*  

  #### **Step 2: [Fundamentality] Is composition about a relation or what exists?**  
  - **A. Relation**: Is "the parts compose a whole" about a specific connection between objects? (e.g., "Are my shoes and the Eiffel Tower related in a way that makes them a single thing?")  
  - **B. Quantifier range**: Is it about what objects our language commits us to? (e.g., "When do we *say* ‘there is’ something made of parts?")  
  *→ If A, go to Step 4. If B, go to Step 5.*  

  #### **Step 3: [Ordinary language] Is composition about a relation or what exists?**  
  - **A. Relation**: (Same as Step 2A, but for ordinary claims.)  
  - **B. Quantifier range**: (Same as Step 2B, but for ordinary claims.)  
  *→ If A, go to Step 6. If B, go to Step 7.*  

  ---

  ### **Branch 1: Fundamentality + Relation** (Step 2A → Step 4)  
  #### **Step 4: Do any two objects compose something? (Test case: Your left shoe + Eiffel Tower)**  
  - **Yes**: Go to Step 8.  
  - **No**: Go to Step 9.  

  #### **Step 8: Does composition *always* happen, no matter the parts?**  
  - **Yes**: **Unrestricted composition**.  
    - *Awkward commitment:* A scattered object like "shoe-Eiffel Tower sum" exists.  
  - **No**: *Empty cell (unexplored):* No known view denies arbitrary pairs but accepts unrestricted composition.  

  #### **Step 9: Is composition a brute fact (no deeper explanation)?**  
  - **Yes**: **Brute fact view**.  
    - *Awkward commitment:* We can’t explain why composition occurs for (e.g.) a cat but not a cat + your coffee mug.  
  - **No**: Go to Step 10.  

  #### **Step 10: Does composition require physical contact? (Test case: Two books touching on a shelf vs. same books on different continents)**  
  - **Yes**: **Contact-or-cohesion view**.  
    - *Awkward commitment:* A chess set with pieces on three continents doesn’t exist.  
  - **No**: Go to Step 11.  

  #### **Step 11: Does composition require life? (Test case: A live cat vs. a corpse)**  
  - **Yes**: **Organisms-only view**.  
    - *Awkward commitment:* A statue (non-living) doesn’t exist; only the clay does.  
  - **No**: Go to Step 12.  

  #### **Step 12: Does composition require joint consciousness? (Test case: String quartet playing together)**  
  - **Yes**: **Conscious composition** (distinct from organicism!).  
    - *Awkward commitment:* A non-conscious organism (e.g., a tree) doesn’t exist.  
    - *Test cases vs. organicism:*  
      - A brain-dead human (organic but unconscious): Organicism says *yes*, conscious composition says *no*.  
      - An AI collective mind (conscious but non-organic): Conscious composition says *yes*, organicism says *no*.  
      - *Awkward case for conscious composition:* A sleeping person’s hand and foot (part of a conscious being but not jointly conscious alone).  
  - **No**: Go to Step 13.  

  #### **Step 13: Is the whole identical to its parts? (Test case: A statue is just the clay, not a new object?)**  
  - **Yes**: **Composition as identity**.  
    - *Awkward commitment:* "The statue" and "the clay" are the same thing, yet we treat them differently.  
  - **No**: Go to Step 14.  

  #### **Step 14: Is there only one fundamental object? (Test case: The entire universe)**  
  - **Yes**: **Priority monism**.  
    - *Awkward commitment:* Your left shoe isn’t fundamental; only the cosmos is.  
  - **No**: *Empty cell (unattractive):* Denying all conditions but accepting composites is incoherent.  

  ---

  ### **Branch 2: Fundamentality + Quantifier range** (Step 2B → Step 5)  
  #### **Step 5: Are composite objects in our fundamental ontology? (Test case: Is "there is a table" true?)**  
  - **Yes**: Same as Branch 1, Steps 8–14 (*views repeat across branches*).  
  - **No**: **Strict nihilism (error theory)**.  
    - *Awkward commitment:* "There is a table" is literally false; only particles exist.  

  ---

  ### **Branch 3: Ordinary language + Relation** (Step 3A → Step 6)  
  #### **Step 6: Is ordinary language ever wrong about objects? (Test case: A statue and the clay—are both "real" in everyday talk?)**  
  - **Yes**: **Strict nihilism (error theory)** or **Nihilism-with-fictionalism** (see Step 7).  
  - **No**: Go to Step 10 (same as Branch 1).  

  ---

  ### **Branch 4: Ordinary language + Quantifier range** (Step 3B → Step 7)  
  #### **Step 7: When ordinary people say "there is," is it...**  
  - **A. Always false for composites?**: **Strict nihilism (error theory)**.  
    - *Awkward commitment:* Ordinary claims are systematically mistaken.  
  - **B. Useful but fictional?**: **Nihilism-with-fictionalism**.  
    - *Awkward commitment:* We must pretend tables exist, though they don’t.  
  - **C. Relative to our concepts?**: **Quantifier variance / deflationary view**.  
    - *Awkward commitment:* No fact of the matter whether a chess set scattered on three continents "exists."  
  - **D. True under a condition?**: Go to Steps 10–14 (same as Branch 1).  

  ---

  ### **Empty Cells & Why**  
  - **Step 8 "No"**: Unexplored—no view accepts some arbitrary pairs but not all.  
  - **Step 14 "No"**: Unattractive—denies all proposed conditions without offering an alternative.  
  - **Fundamentality + Fictionalism**: Incoherent—fundamental reality can’t be "fictional."  

  ### **Indistinguishable Views**  
  - **Composition as identity** and **Unrestricted composition** often overlap (both accept scattered sums), but composition as identity adds "the whole is the parts."  
  - **Strict nihilism** appears in multiple branches (always denies composites).  

  ---

  ### **Cases Used in Tree**  
  - **Scattered sum**: Shoe + Eiffel Tower (Step 4).  
  - **Statue and clay**: Step 6.  
  - **Chess set on three continents**: Step 10.  
  - **String quartet**: Step 12.  
  - **Two books on shelf**: Step 10.  
  - **Infinitely many parts**: Not used (redundant with unrestricted composition).  

  *Fits on two pages. Written in American English.*
