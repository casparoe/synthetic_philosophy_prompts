  Okay, the user is asking me to create a specification for interpersonal comparisons of well-being that would be suitable for distributional weights in cost-benefit analysis. They want me to categorize the requirements into three grades: mathematical/purpose-driven, negotiable, and camp-specific. They've also listed several specific cases that the specification must address, like people with blunted affect, different conceptions of well-being, comparisons of gains rather than levels, existence-changing policies, non-human entities, and issues with self-reports.

  I need to consider the mathematical foundations of utility representation first. The requirement that interpersonal comparisons must be invariant to individual affine transformations is crucial because individual utility functions are unique only up to positive affine transformations. Without this, interpersonal comparisons wouldn't be meaningful. Also, the welfare input needs to be cardinally measurable for trade-offs to make sense, which comes from the purpose of distributional weights in cost-benefit analysis.

  Now for the specific cases. For someone with chronic pain who uses the same scale but has a narrower range, the specification must ensure that interpersonal comparisons aren't distorted by scale compression. This means the comparison method needs to normalize or adjust for individual scales. The case where two people have different conceptions of well-being (desire-fulfillment vs. experiential) highlights the need for a common currency of well-being. Without this, disagreements can't be resolved, so this belongs in the core requirements.

  Comparisons of gains rather than levels require cardinality and common units. The mathematics already demands cardinal measurability, so this is part of the core. For policies that change who exists, we need a zero point for non-existence, which isn't just the bottom of someone's scale. This zero point must be defined independently, making it a core requirement since it's necessary for such policies.

  Non-human entities and non-reporting beings require an observer-based method, as self-reports aren't possible. This is negotiable because it involves how we define welfare for these entities. The issue of self-reports being influenced by context means the method must be robust to framing effects, which is a negotiable requirement since it's about implementation.

  Some requirements are camp-specific. For instance, the demand that the welfare measure be preference-independent might come from experientialist views, while the requirement that it be interpersonally comparable without normative input could stem from utilitarianism. Prioritarianism requires knowing absolute levels to give priority to the worse-off, which isn't necessary for all approaches.

  Now for the judgments. Full comparability of levels isn't a requirement from math or purpose alone; it's often a normative addition. The list might not be jointly satisfiable, especially when combining scale invariance with the need for a common zero point. This conflict means scale invariance might need relaxing. The disagreement about aggregating before or after uncertainty resolution is more about decision theory than interpersonal comparison. The requirement for a non-arbitrary zero point likely excludes many accounts, like those relying solely on preferences. Partial comparability can be usable if represented through ranges or intervals in decision rules, avoiding conversion to full comparability.

  I should also note conflicts, like between scale invariance and the need for a common zero. This conflict is real because scale invariance prevents defining a shared zero. The different welfare accounts have varying strengths: utilitarianism handles scale invariance but struggles with the zero point, while capabilities approaches might handle non-humans but face comparability issues.
answer: |-
  Here is a specification for interpersonal comparisons usable in national CBA for distributional weights, categorized by necessity and grounded in your cases. Requirements are labeled: **Core** (math/purpose), **Negotiable** (genuine but debatable implementation), **Camp-Specific** (reflects normative commitments).

  ### Core Requirements (Math/Purpose)
  1.  **Cardinal Measurability:** Welfare inputs must support cardinal comparisons (differences matter). *Case: Gains Comparison.* To claim "costs A more than twice what it gains B," we need cardinal units for both A's loss and B's gain. Mathematics requires cardinality for meaningful trade-offs.
  2.  **Scale Invariance (Individual):** Comparisons must be invariant to each individual's independent positive affine rescaling (u_i' = a_i * u_i + b_i, a_i > 0). *Case: Blunted Affect.* If Person X's underlying "8" reflects a compressed range, comparisons shouldn't change if we linearly transform X's scale to match the typical range's dispersion. Mathematics demands this for utility representations.
  3.  **Common Currency:** Must yield a single, interpersonally comparable welfare metric (W). *Case: Differing Conceptions.* Whether welfare is desire-based or experiential, comparisons require translating both into a common W for policy trade-offs. Purpose (CBA weights) necessitates a single metric.
  4.  **Non-Arbitrary Zero Point:** Requires a defined "zero" level of welfare distinct from minimum observed utility. *Case: Existence-Changing Policies.* Comparing existence vs. non-existence or adding new lives requires a neutral welfare baseline (often "a life not worth living").
  5.  **Gain/Loss Symmetry:** The framework must treat losses and gains symmetrically within the comparable metric. *Case: Gains Comparison.* Assessing "cost to A" vs. "gain to B" presupposes the metric works equally for decrements and increments.

  ### Negotiable Requirements
  6.  **Robustness to Elicitation Noise:** The method must acknowledge and mitigate sensitivity to framing, mood, and context in welfare reports or proxies. *Case: Self-Report Drift.* Cannot stipulate perfect reports; the theory must incorporate or be stable under reasonable noise models (e.g., averaging, anchoring adjustments).
  7.  **Observer Basis for Non-Reporting Entities:** Must provide a consistent (even if imperfect) method for assigning W to entities incapable of self-report. *Case: Non-Human Animals/AI.* Requires linking observable states (behavior, physiology, functionings) to the common W metric through defined criteria.
  8.  **Meaningful Comparability of Levels (Directional):** Must determine if A is better off than B. *Case: All Level Comparisons.* Necessary for prioritizing the worse-off (prioritarianism/sufficiency) or assessing inequality. Degree of precision is negotiable (see Partial Comparability below).
  9.  **Contextual Stability:** Comparisons should hold reasonably across relevant policy contexts, not be hypersensitive to minor environmental shifts unrelated to core welfare. *Case: Self-Report Drift / Differing Conceptions.* Guards against weights changing drastically due to irrelevant factors.

  ### Camp-Specific Requirements
  10. **Preference-Independence:** Welfare level comparisons should not rely solely on expressed preferences/choices. *Camp: Experientialism/Capabilities.* *Case: Blunted Affect / Differing Conceptions.* Argues that adaptive preferences or affective disorders make preferences unreliable welfare proxies. Rejected by preference-satisfaction views.
  11. **Full Level Comparability (Magnitude):** Must determine *how much* better off A is than B, not just the direction. *Camp: Utilitarianism/Prioritarianism (Strong Forms).* *Case: Worse-off vs. Better-off Trade-offs.* Needed for strict prioritarian weighting or classical utilitarianism. Sufficientarians may only need identification of the "sufficient" level.
  12. **Well-Being Monism:** Assumes a single correct theory of welfare underlies W. *Camp: All except Pluralists.* *Case: Differing Conceptions.* Rejects the idea that W could validly incorporate multiple irreducible welfare elements. Pluralists would require a meta-criterion to combine them.
  13. **Normative Agnosticism of Measurement:** The *measurement* of interpersonal comparisons should be separable from the *normative weighting* applied to those comparisons. *Camp: Preference Utilitarians/Some Welfarists.* *Case: Defending Weights.* Argues measurement should be "objective" so normative debate focuses on weights. Capability/Objective List views often embed norms in measurement.

  ---

  ## Judgments on Your Queries

  1.  **Full Comparability of Levels:** This is **primarily a Camp-Specific requirement (C11)**, *not* Core. Core only requires *directional* comparability (N8) and cardinality (C1). Knowing A is worse off than B is often sufficient for distributional weighting (e.g., sufficientarianism). Knowing *how much* worse off is necessary for strong prioritarian/utilitarian aggregation but is an extra stipulation.

  2.  **Joint Satisfiability:** The list **cannot be fully jointly satisfied without compromise or prioritizing.** The core conflict is between **C2 (Scale Invariance)** and the combination of **C4 (Non-Arbitrary Zero)** and **N8/C11 (Meaningful Level Comparability)**.
      *   *The Conflict:* C2 makes individual utility scales arbitrary (only ratios of differences matter). C4 requires a fixed, interpersonally shared zero point. N8/C11 require comparing absolute levels across individuals.
      *   *Why C2 Must Give Way (Partially):* To achieve C4 and any meaningful level comparison (N8/C11), we must fix the *location* (zero point) of the scales, not just the unit. This requires going beyond the mathematical invariance of individual utility functions. We must impose an *interpersonal* zero. C2 (specifically invariance under adding b_i) must be relaxed for interpersonal comparisons while retaining invariance under scaling (multiplying by a_i) for cardinality. This is a real conflict.

  3.  **Ex Ante vs. Ex Post Aggregation:** This dispute is **NOT fundamentally about interpersonal comparison.** It concerns the **timing of aggregation under uncertainty** relative to the resolution of risk. Your specification settles interpersonal comparison first (defining comparable W). The ex ante/ex post debate assumes W is comparable; it then asks: Should we aggregate individuals' *expected* W *before* uncertainty resolves (ex ante), or aggregate their *realized* W *after* it resolves (ex post)? This is a conflict in social decisions under uncertainty, not in defining W itself.

  4.  **Most Excluding Requirement:** **C4 (Non-Arbitrary Zero Point)** excludes the largest share of current accounts. **Why:** Many accounts (especially preference-based, experienced utility based on self-reports, some hedonic) struggle to define a non-arbitrary "zero" distinct from the minimum observed state. Preferences lack a natural zero. Self-reports typically anchor at "worst I've felt" or "death," which is context-dependent and not necessarily the neutral point for existence. **Why it's not just prejudice:** The *case for existence-changing policies* is compelling and practically important (population ethics, long-term environmental policy). Without a defined neutral point, evaluating such policies is impossible or relies on arbitrary assumptions. The requirement forces engagement with a fundamental problem.

  5.  **Partial Comparability Usability:** **Yes, genuine partial comparability (directional but not precise magnitude) CAN be represented usefully without collapsing into full comparability.** *How:* Represent welfare differences or levels as *intervals* or *ranges* rather than points. Decision procedures can use this:
      *   *Interval Orders:* Policy A is better than B only if the lower bound of A's total W > upper bound of B's total W.
      *   *Maximin/Maximax:* Focus on outcomes for the worst-off/best-off identifiable within the ranges.
      *   *Satisficing:* Define an acceptable range of outcomes based on partial comparisons.
      *   *Robust Optimization:* Choose policies that perform acceptably across *all* possible precise comparisons consistent with the partial ordering.
      *   *This avoids conversion:* As long as the decision rule respects the incompleteness (e.g., doesn't *assume* a precise midpoint when ranges overlap), it uses partial comparability genuinely.

  ---

  ## Conflicts & Closing Note on Families

  *   **Key Conflict:** As noted in (2), the core conflict is between **Scale Invariance (C2)** and the need for a **Non-Arbitrary Zero (C4)** + **Level Comparability (N8/C11)**. This is a real conflict requiring normative choice: prioritize welfarist symmetry (relax C4/N8) or the practical need for existence-comparisons and level judgments (relax C2's translation invariance).

  ### How Families Fare (Briefly)
  *   **Preference Utilitarianism:** Strong on C2, C3, C1 (if cardinal). Weak on C4 (zero?), C6 (preference instability), C10 (rejected), often weak on N7 (non-humans).
  *   **Experienced Utility (Hedonic):** Strong on C10, potential for C4 (zero=neutral hedonic tone). Weak on C2 (scale compression - blunted affect), C6 (report drift), N7 (non-humans).
  *   **Capabilities:** Strong on N7, C4 (zero=minimal capability threshold?), potentially C10. Weak on C1/C2 (cardinality? scale?), C3 (common currency?), C6 (operationalization).
  *   **Objective List:** Similar to Capabilities. Struggles with cardinality (C1) and common currency (C3).
  *   **Prioritarianism:** Requires strong C11 (full level comp). Inherits strengths/weaknesses of its underlying W metric.
  *   **Sufficientarianism:** Needs N8 (directional comp) and C4 (define sufficiency). More compatible with partial comparability than prioritarianism.

  This specification forces explicit choices at the tension points, particularly around the zero point, scale invariance, and the degree of level comparability required, revealing the normative foundations underlying any practical proposal.
