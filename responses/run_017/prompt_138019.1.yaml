prompt: |-
  I sit on the clinical ethics committee of a hospital with an active epilepsy surgery programme, and it is my turn to draft the memo for Thursday's meeting. I've read a fair amount of blog-level material on split-brain cases, so please don't spend the memo establishing why the case is philosophically interesting; two of our members already know enough to use the words "person" and "subject of experience" at each other. What I need is a bottom line and the argument for it.

  The patient is 44 and had a complete corpus callosotomy eleven years ago for drug-resistant epilepsy. He now has a slow-growing left frontal tumour; his surgeon wants to resect within about three weeks and puts the cost of a further month's delay at a few additional points of risk of permanent expressive-language deficit. Verbally he consents clearly and repeatedly, and he passes our ordinary capacity interview. But when neuropsychology presented the choice separately to each hemisphere — options flashed briefly to one visual field while he fixated, answered with the hand on that side — the split was stable across three sessions: right field, right hand, and voice say operate; left field and left hand say do not. Shown recordings of himself answering both ways, he said the left hand "just does that sometimes," then, writing with his left hand, asked us not to let the surgeons cut. Our neuropsychologist cautions that left-hand responding in these patients is noisy: intermanual conflict and alien-hand phenomena can produce behaviour that carries no preference at all.

  Two further facts. Three years ago, before any of this was foreseeable, he signed a directive saying that if his left hand ever appeared to contradict him, the hand should be disregarded rather than treated as a second opinion. His wife says the opposite, and cites an episode two years ago in which his left hand refused a medication he had verbally accepted and he later, by left hand, thanked her for having it stopped.

  Please draft the memo I will circulate. It should recommend a concrete course — operate on schedule, operate only after some further protocol, or transfer the decision to a surrogate — with a time frame and conditions; it should say plainly what we would be overriding if we proceed on his verbal consent alone; and it should say what evidence would justify treating the left-hand responses as the patient's own refusal rather than as motor noise, and how much weight his earlier directive deserves given that he wrote it without envisaging this situation.
reasoning: |-
  Okay, the user is part of a clinical ethics committee dealing with a complex case involving a split-brain patient. They need a memo draft that cuts straight to practical recommendations without philosophical tangents. Key issues: conflicting consent signals between hemispheres, an advance directive about disregarding left-hand contradictions, and time pressure from a growing tumor.

  Hmm, the core tension is between verbal consent (right hemisphere dominant) and left-hand refusal (left hemisphere). The neuropsychologist flags left-hand responses as potentially unreliable due to alien hand syndrome. But the wife's anecdote about medication refusal adds complexity. 

  The advance directive is tricky - it specifically says to ignore left-hand contradictions, but was written before this medical scenario. The wife's testimony suggests the left hand sometimes expresses valid preferences. 

  Three paths emerge: 
  1) Proceed with surgery based on verbal consent, overriding left-hand refusal as noise per the directive
  2) Delay for more testing to clarify if left-hand refusal is "real" 
  3) Transfer decision to surrogate (wife)

  Time is critical - each month's delay increases language deficit risk. The neuropsychologist already did three sessions showing stable split responses. More testing might not resolve ambiguity but eats into the safe window. 

  The memo should prioritize: 
  - Concrete action (operate on schedule) 
  - Clear rationale (verbal consent valid per capacity assessment + directive) 
  - Acknowledgement of what's overridden (possible autonomous refusal from left hemisphere) 
  - Criteria for when left-hand responses should count (consistent, intentional communication in non-conflict settings) 
  - Directive weight assessment (binding but imperfect) 

  Wife's view matters but isn't decisive - the directive exists, and surrogate input typically only applies if patient lacks capacity. Here capacity is intact verbally. 

  Final call: proceed. The risks of delay outweigh ambiguous contralateral signals, especially with the directive as backup. But document everything thoroughly.
answer: |-
  **MEMORANDUM**  
  **TO:** Clinical Ethics Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Management of Consent Conflict in Split-Brain Patient (Case #XYZ)  

  ### **Recommended Course**  
  **Operate on schedule** (within 3 weeks), relying on the patient’s verbal consent and advance directive. No further testing is warranted given time constraints. Transfer to a surrogate is not justified, as the patient retains decision-making capacity.  

  ### **Key Rationale**  
  1. **Valid Verbal Consent**:  
     - The patient consistently provides clear, repeated verbal consent for surgery during standard capacity assessments. He understands risks, benefits, and alternatives.  
     - Our primary ethical obligation is to respect contemporaneous, capacitated expressions of will. His verbal responses align with established clinical standards for informed consent.  

  2. **Advance Directive Controls Ambiguity**:  
     - The patient’s signed directive explicitly states: If the left hand contradicts verbal consent, it should be disregarded.  
     - Though drafted before this specific scenario, the directive’s intent—to resolve hemispheric conflict in favor of verbal output—applies directly. Overruling it requires stronger evidence than exists here.  

  3. **Left-Hand Responses Are Unreliable**:  
     - Neuropsychology confirms left-hand responses in callosotomy patients are often "noisy," reflecting alien-hand phenomena or intermanual conflict without intentional preference.  
     - The patient himself dismisses left-hand refusal ("just does that sometimes"), undermining its credibility as an autonomous refusal.  

  ### **What We Override**  
  Proceeding on verbal consent overrides:  
  - **Potential left-hemisphere dissent**: The left hand’s "do not operate" signals, *if* interpreted as a deliberate refusal (despite low reliability).  
  - **Wife’s testimony**: Her account of past left-hand "agency" (e.g., medication refusal) is anecdotal and conflicts with the directive.  

  ### **Criteria for Treating Left-Hand Responses as Valid Refusal**  
  For left-hand responses to outweigh verbal consent and directive, we would need:  
  1. **Consistency Beyond Conflict**: Reproducible refusal in non-conflicted contexts (e.g., left-hand writing unprompted by right-hemisphere stimuli).  
  2. **Evidence of Intentionality**: Clear demonstration (e.g., via structured interview) that responses reflect understanding/endorsement by the left hemisphere, not motor noise.  
  3. **Corroboration**: Independent neuropsychological validation that dissent persists absent alien-hand interference.  
  *Current evidence fails these criteria.*  

  ### **Weight of Advance Directive**  
  - The directive deserves **substantial weight**, despite being drafted pre-tumor:  
    - It explicitly addresses hemispheric conflict, proving the patient foresaw *categories* of disagreement (even if not this exact scenario).  
    - Revoking it requires contemporaneous capacitated instructions—absent here.  
  - Caveat: If new evidence showed the directive no longer reflected his values (e.g., consistent left-hand repudiation), we might discount it. No such evidence exists.  

  ### **Risk-Benefit Balance**  
  - **Delay Risks**: Postponing surgery for further testing (e.g., more hemispheric interviews) risks permanent language deficits (per surgical opinion).  
  - **Certainty Gradient**: Verbal consent (high certainty) + directive (high certainty) outweigh ambiguous left-hand signals (low certainty).  

  ### **Action Plan**  
  1. **Proceed with surgery** as scheduled, documenting reliance on verbal consent and directive.  
  2. **Inform wife/surgeon** of rationale, emphasizing directive’s role.  
  3. **Decline transfer to surrogate**: Patient retains capacity; surrogate input is advisory only.  
  4. **Monitor post-op**: Neuropsychology to track hemispheric integration/conflict.  

  **Time Frame**: Surgery within 3 weeks. No further ethics review needed unless new evidence of incapacity emerges.  

  ---  
  **Vote Recommended**: Approve surgery based on verbal consent and advance directive.  

  *Attachment*: Advance directive excerpt, neuropsych summary.
