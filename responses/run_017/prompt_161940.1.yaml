  Hmm, this is a profound and complex request about medical ethics protocols for mass-casualty triage. The user sits on a clinical ethics committee at a teaching hospital and needs a rigorous framework for distinguishing intended vs. merely foreseen harm in life-or-death decisions. They want desiderata for this distinction that can withstand real-world constraints like auditability and resistance to gaming.

  The core tension they're grappling with is between philosophical precision and practical implementability. Their frustration with the doctrine of double effect is palpable - every formulation seems either too vague or too crude. They need this for situations where clinicians have about 90 seconds to make irreversible decisions, and auditors must later verify protocol compliance objectively.

  Key challenges they've identified include: the description-sensitivity problem (same action described differently shouldn't change permissibility), the first-person/third-person gap (auditors can't read minds), and "laundering" risks (clinicians gaming mental states). They also want coverage beyond trolley problems to actual hospital scenarios like ventilator allocation or palliative sedation.

  I notice they're unusually philosophically sophisticated - referencing classic thought experiments while recognizing their limitations. Their demand for collision points between requirements shows they understand this may be fundamentally insoluble. The request for "which pairs can't be jointly satisfied" is particularly sharp.

  For the response structure, I'll: First list non-negotiable requirements like auditability and laundering-resistance. Then preferences like matching intuitive verdicts. Explicitly note collisions - especially the auditability vs intentionality paradox. Then scorecard approaches showing why each fails some core requirement, concluding with what might work better than DDE.

  The most brutal truth they need to hear: The classical DDE distinction may be fundamentally unworkable for their use case. Auditability requires observable criteria, but intention is irreducibly subjective. Any "objective" reformulation either collapses into consequentialism or creates loopholes. Their fallback should probably be a bright-line rule system with mechanical triggers.

  Throughout, I'll maintain their requested British English and feminine pronouns for clinicians. The tone must balance academic rigor with committee-paper practicality - they'll literally circulate this. Most importantly, I won't shy from saying "this can't work" where philosophy meets ER reality.
answer: |-
  ## Desiderata for a Triage Protocol Distinction: Intended/Foreseen Harm in Mass-Casualty Incidents

  **Committee Paper: Requirements for an Actionable Distinction**

  **1. Introduction:** This paper outlines the essential requirements ("desiderata") any operational distinction between intended harm (as a means) and merely foreseen harm (as a side-effect) must satisfy to form the basis of an auditable triage protocol for mass-casualty incidents (MCIs). Our goal is a codified rule enabling rapid (<90s), life-or-death decisions by any clinician on shift, subject to reliable third-party audit. The Doctrine of Double Effect (DDE) provides the conceptual framework, but existing formulations prove inadequate for this practical context. We identify core requirements, their grounding, and critical tensions.

  **2. Desiderata:**

  *   **A. Third-Personal Codifiability & Auditability (Non-negotiable):** The distinction must be definable and verifiable based *solely* on observable circumstances, actions, and outcomes available to an auditor reviewing the case *after the fact*. The auditor cannot access the clinician’s private mental states (intentions).
      *   *Grounding:* The core purpose of the protocol. Audit is essential for accountability, learning, and maintaining trust. If the distinction hinges on unobservable intentions, it cannot be reliably audited.
  *   **B. Resistance to Laundering / Gaming (Non-negotiable):** The protocol must be robust against clinicians deliberately structuring their thoughts or descriptions *in advance* to make a harmful outcome appear "merely foreseen" when it is functionally necessary or desired.
      *   *Grounding:* Without this, the protocol becomes meaningless. Clinicians could "train" themselves to frame any harmful act as permissible by adjusting their focus (e.g., focusing solely on "saving the five" while ignoring the lethal shunt diversion).
  *   **C. Description Robustness / Act-Individuation (Non-negotiable):** The permissibility verdict must be stable regardless of how finely or coarsely the clinician's *action* is described, provided the relevant causal structure remains constant. The verdict must depend on the *underlying causal role* of the harm, not semantic framing.
      *   *Grounding:* Auditors or clinicians might describe the same physical act differently ("diverting threat", "killing one", "saving five"). A protocol whose outcome changes with description is arbitrary and unworkable. The distinction must latch onto objective features.
  *   **D. Distinction from Motive/Blameworthiness (Non-negotiable):** The account must clearly separate the *permissibility* of the *act* (under the protocol) from the clinician’s underlying *motives* (e.g., malice, indifference, compassion) and her overall *blameworthiness* or *praiseworthiness*.
      *   *Grounding:* Permissibility is about the act's structure within the emergency context. A clinician may permissibly divert a threat (saving many, foreseeing one death) even if she feels malicious joy; conversely, a clinician acting from pure compassion may perform an impermissible act (e.g., pushing one off a footbridge to save five). Audit focuses on act-permissibility, not character.
  *   **E. Handling Probabilistic Causation (Preference):** The account should provide guidance when the causal link between the act and the harmful outcome is probabilistic (e.g., a shunt has a 1/3 chance of failing, killing one; saving the five *only* occurs if it holds).
      *   *Grounding:* Reality involves uncertainty. Does "foreseeing" apply to probable outcomes? Does "means" require certainty? While probabilistic cases are harder, a practically useful protocol needs principled guidance, not silence. Weight: Important for real-world relevance (e.g., risky procedures).
  *   **F. Handling Non-Standard Causal Roles (Preference):** The account should address cases where harm is causally necessary but not intuitively a "means" (e.g., harm as ballast, counterweight, or pure energy source), and cases where harm turns out to be causally irrelevant (e.g., a backup mechanism would have saved the five anyway).
      *   *Grounding:* These challenge simplistic "means" definitions and highlight the need for a sophisticated causal analysis. While perhaps rarer, they test the robustness of the distinction. Weight: Tests conceptual clarity.
  *   **G. Handling Multi-Agent & Overdetermination (Preference):** The account should yield clear verdicts in scenarios involving multiple actors (e.g., two clinicians each performing part of a lethal sequence) or overdetermined outcomes (e.g., the one would have died anyway; the five would have been saved by another).
      *   *Grounding:* Complex emergencies may involve multiple decision-makers or ambiguous causal chains. Audit needs to assess the individual clinician's act within this complexity. Weight: Important for realistic application.
  *   **H. Evidence-Relative vs Fact-Relative Permissibility (Preference - Leaning Evidence-Relative):** Should permissibility depend on the clinician’s *reasonable beliefs* based on evidence available *at the time*, or on the *actual facts* revealed later (e.g., the shunt that *in fact* failed, though believed safe)?
      *   *Grounding:* Audit occurs later, with full knowledge. However, decisions are made under extreme uncertainty. Punishing a clinician for bad luck despite reasonable assessment is unjust and undermines protocol use. Weight: Strong preference for evidence-relative assessment for fairness and encouraging protocol adherence in good faith.
  *   **I. Applicability Beyond Trolleys to Clinical Realia (Non-negotiable):** The distinction must generate clear, actionable guidance for paradigmatic *hospital* MCI dilemmas: ventilator allocation (denying/withdrawing from one to save another), palliative sedation (foreseen hastening of death), use of one patient’s data/tissue for others’ benefit, emergency procedures where harm to one is necessary to save others (e.g., complex trauma surgery).
      *   *Grounding:* The protocol is useless if it only solves philosophy problems. It must address the scenarios clinicians *actually* face, usable by those unfamiliar with trolley literature. Weight: Essential for practical relevance.
  *   **J. Matching Core Intuitive Verdicts (Preference - Cautious Weight):** The account should align with strong, widely shared intuitions on core philosophical cases *if possible without sacrificing core requirements*. Cases include: Bystander (Switch) (Permissible), Driver (Steer) (Permissible), Footbridge (Push Man) (Impermissible), Looped Track (Permissible?), Tactical Bombing (Permissible?), Terror Bombing (Impermissible?), Craniotomy (Impermissible?), Hysterectomy (Permissible?), Surgeon (Healthy Donor) (Impermissible). *Crucial Caveat:* This is a *preference*, not a non-negotiable. Matching *all* intuitions perfectly may be impossible or require reverse-engineering. Some intuitions (e.g., Footbridge vs Loop) may reflect deep-seated but potentially irrational psychological biases (e.g., personal force, contact) rather than sound moral principles. Weighting an account *too heavily* on matching *all* these intuitions risks building a Rube Goldberg machine of distinctions rather than a robust, practical principle. Focus should be on the most stable and morally compelling differences (e.g., direct vs indirect harm, agency vs allowing).

  **3. Collisions Between Requirements:**

  1.  **Auditability (A) vs. The First-Personal Core (Fundamental Collision):** The classical DDE distinction is *centrally* about the agent's *intention*. Requirement A demands an *objective, observable* criterion. These are fundamentally at odds. Any attempt to "objectify" intention (e.g., "What was the *goal*?") risks collapsing into consequentialism (D) or being easily laundered (B). This is the most severe and likely insurmountable collision for a *classical* DDE-based protocol. *Conclusion:* A protocol strictly based on the *intended/foreseen mental state distinction* is likely un-auditable and unworkable.
  2.  **Fine-Grained Continuum vs. Bright Lines (Significant Tension):** The causal and psychological roles of harm exist on a continuum. Requirement J (matching intuitions) and F (non-standard causal roles) push for nuance. However, Requirement C (description robustness) and the need for rapid, decisive action under stress demand *bright-line, easily applicable rules*. Overly nuanced distinctions are unusable in 90 seconds and vulnerable to laundering (B) and description-sensitivity (C). A protocol needs clear triggers ("If condition X, then act Y is permitted").
  3.  **Resistance to Laundering (B) vs. Any Mental-State Criterion:** If permissibility depends *at all* on the clinician's *deliberative focus* or *framing* (even if not full "intention"), it becomes vulnerable to gaming. Clinicians can consciously or subconsciously direct their attention to fulfill the protocol's mental-state requirement without changing the objective act or outcome. Requirement B pushes hard towards purely objective criteria, conflicting with any vestige of J or the core DDE idea.
  4.  **Evidence-Relative (H) vs. Fact-Relative Assessment:** While fairness strongly favours evidence-relative (H), audit happens later with full facts. An auditor seeing a shunt *actually* killed the one might struggle to accept the act was permissible if the protocol's objective criteria *appear* violated by the outcome, even if the clinician acted reasonably. This creates potential conflict in the audit process itself.

  **4. Prejudices Dressed as Desiderata?** The strongest candidate is the insistence on matching *all* intuitions from the trolley literature (J), particularly the Footbridge impermissibility. This intuition is powerful but notoriously difficult to justify *independently* of deontological assumptions about direct harming/pushing. An account that rejects the Footbridge intuition (e.g., some consequentialist views) might be dismissed prematurely based on J, even if it satisfies the non-negotiables (A-D, I) better than a convoluted DDE variant that matches the intuition through ad-hoc distinctions. Requirement J should be applied cautiously, focusing on the most central and defensible differences relevant to *clinical* contexts (e.g., direct bodily invasion vs allowing a disease process vs redirecting an existing threat).

  **5. Most Excluding Requirement:** **Third-Personal Codifiability & Auditability (A)** is the most devastating for classical DDE formulations. It immediately renders accounts relying on unobservable mental states non-starters. **Resistance to Laundering (B)** is a close second, undermining attempts to approximate intention via deliberative procedures.

  **6. Feasibility of Distinction-Based Protocol:** A protocol strictly based on the *classical intended/foreseen mental state distinction* satisfying the non-negotiables (A, B, C, D, I) appears **impossible**. The collision between the inherently first-personal nature of intention and the requirement for third-personal audit is fundamental.

  **7. Recommendation: What to Put in its Place?** Abandon the attempt to codify the *mental state* distinction for audit. Focus instead on developing **objective, action-based criteria** derived from a combination of:
      *   **Causal Role:** Primarily whether the harm is the *mechanism* by which the good is achieved (e.g., organ harvesting) vs. a *consequence* of an action primarily achieving good through a different mechanism (e.g., diverting a threat, sedating pain knowing death may be hastened). Prioritise mechanisms observable in the clinical act.
      *   **Rights/Violation:** Does the act involve a direct, intentional violation of fundamental bodily rights or agency (e.g., lethal injection, forced organ removal) vs. allowing harm to occur or redirecting an existing threat without direct bodily invasion?
      *   **Bright-Line Rules:** Define specific, observable *types* of actions that are prohibited (e.g., "Do not perform a procedure *on Patient A* where the *primary mechanism* of saving Patient B *is the death or severe harm* of Patient A") and permitted (e.g., "Allocating a scarce resource according to a pre-defined, objective priority score"; "Providing palliative treatment where the primary intent and mechanism is symptom relief, even if death is foreseen"; "Redirecting an imminent threat from a larger group to a smaller group where the harm mechanism affects the smaller group *directly by the threat itself*").
      *   **Consequentialist Thresholds:** Explicitly incorporate thresholds where the expected number of lives saved justifies actions with severe foreseen side-effects or resource denial, *without* pretending the harm isn't intended in the DDE sense. Be transparent about the tragic choice.
      *   **Rigorous Ex Ante Procedure:** Embed these rules within clear procedural steps (e.g., "Apply priority algorithm X to ventilator allocation"; "For threat redirection, confirm: Threat is immediate & lethal, Redirection targets smallest feasible group, Harm is direct result of threat impact, No less harmful option") that structure the 90-second decision and provide the basis for audit.

  **8. Scorecard of Approaches for Protocol Basis:**

  1.  **Classical Four-Condition DDE (Intention Focus):**
      *   *Criteria:* Good act intended; Bad effect not intended (neither as end nor means); Good effect not achieved *through* bad effect; Proportionality.
      *   *Assessment:* **Fails A (Un-auditable intention), B (Highly laundered), C (Description-sensitive - 'intending' depends on framing).** May satisfy J (intuitions) and parts of D, E, F, G, H, but unusable for protocol due to core failures on A-C.

  2.  **Counterfactual-Dependence / Means Test ("But-For" or "Causal Mechanism"):**
      *   *Criteria:* Was the harmful outcome part of the causal chain *necessary* for achieving the good? (But-For: Would the good outcome have happened *but for* the harm?) Or was the harm the *mechanism* producing the good?
      *   *Assessment:* **Potentially satisfies A (Observable causal chain), C (Focuses on mechanism), B (Harder to launder - mechanism is objective), I (Applicable clinically - e.g., organ harvesting vs threat diversion).** Struggles with F (Ballast/counterweight may be necessary but not mechanism), G (Overdetermination), E (Probabilistic causation - 'necessary' becomes fuzzy). May not perfectly match all intuitions (J - e.g., Loop vs Footbridge mechanism debate). Best candidate *if* a robust, objective definition of "causal mechanism/necessity" can be operationalised for clinical acts.

  3.  **Rights/Agency-Based Reconstruction:**
      *   *Criteria:* Focuses on what the agent *does to* the victim (e.g., directly attacking vs allowing to die vs redirecting a threat *already* posed).
      *   *Assessment:* **Potentially satisfies A (Observable actions - 'force-feeding poison' vs 'turning trolley'), C (Focuses on type of act), B (Harder to launder actions), D (Separates act-rights from motive), I (Clear for bodily invasion vs allocation).** Challenge is defining "doing to" rigorously enough to handle edge cases (F, G - e.g., multi-agent, complex causal roles) and probabilistic harm (E). May match core intuitions (J) well. Strong contender, especially combined with causal mechanism analysis.

  4.  **Threshold/Scalar Consequentialism (Abandon Distinction):**
      *   *Criteria:* Permissibility depends solely on net expected lives saved (or QALYs) exceeding a defined threshold. The intended/foreseen distinction is irrelevant.
      *   *Assessment:* **Potentially satisfies A (Objective calculation), B (Hard to launder numbers), C (Robust to description), E, F, G, H (Naturally evidence-relative), I (Directly applicable to allocation). Fails D (Collapses permissibility into outcome/motive assessment in some views), and clashes catastrophically with J (Permits Footbridge, Organ Harvesting if numbers high enough).** May be ethically necessary in extreme scarcity but abandons core deontological constraints the committee may wish to preserve. Requires defining the threshold clearly.

  5.  **Agent's Reasons/Motives:**
      *   *Criteria:* Focuses on the clinician's primary *reason for acting* (e.g., "to relieve pain" vs "to kill").
      *   *Assessment:* **Fails A (Un-auditable - reasons are mental states), B (Highly vulnerable to laundering - clinician focuses on 'saving lives'), C (Highly description-sensitive - reason depends on framing).** Satisfies D only if reasons define permissibility, but motives blur in. Poor fit for audit and protocol needs. Not recommended.

  **9. Conclusion:** The classical intended/foreseen distinction, centred on private mental states, is fundamentally incompatible with the requirements of an auditable, rapid-decision MCI triage protocol. Attempts to base the protocol directly on this distinction will fail auditability and be vulnerable to laundering. The committee should pivot towards developing rules based on **objective, observable features of the *action* and its *causal structure***, potentially combining:
  1.  A **rights/agency-based prohibition** on direct, intentional harm to one patient *as the mechanism* to save others.
  2.  A **causal mechanism test** to distinguish harmful mechanisms from foreseen side-effects.
  3.  **Bright-line procedural rules** for resource allocation and threat redirection based on observable criteria.
  4.  Explicit **consequentialist thresholds** for tragic choices involving foreseen harm or resource denial.

  The resulting protocol will be less philosophically "pure" than classical DDE but far more likely to be usable, auditable, and effective in the horrific reality of an MCI. The focus must be on structuring decisions fairly and transparently under extreme constraints, not on perfectly capturing an elusive mental state distinction.
