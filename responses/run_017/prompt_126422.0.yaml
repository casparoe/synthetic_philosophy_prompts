  4. Ranking: The proposals are ranked in descending order of their median score. Ties are broken by the average of the three grades. If still tied, break by the minimum grade (to favor proposals with more consistent high grades). If still tied, break by the maximum grade. If still tied, break by the proposal ID (lowest ID first).

  5. Clone detection: During the discussion phase, any panelist may propose that two proposals are near-identical. The full panel votes by majority. If approved, the two proposals are merged. The merged application receives a grade equal to the median of the six grades (the three for each). The merged application is then ranked as one. If it is above the cutoff, the panel then selects one of the two to fund.

  6. Shortlist and cutoff: The panel reviews the ranked list. The cutoff is set as follows: the panel may choose to fund the top k proposals, with k between 6 and 10, but only if they have a median score of at least 7.0. If there are fewer than 6 proposals with a median score of at least 7.0, the panel may fund fewer than 6, or none. The exact cutoff is chosen by the panel considering the distribution of scores and the available budget.

  7. Reasons: Each applicant receives a paragraph: "Your proposal received a median grade of X. The funded proposals had median grades ranging from Y to Z. The cutoff this cycle was a median grade of C." If the applicant was involved in a tie, add: "In the case of ties, we break by the average grade (and then by the minimum and maximum grades and proposal ID)." If the applicant was part of a merged application, add: "Your proposal was deemed near-identical to another and was merged. The merged application received a median grade of X."

  Rationale (one page):

  We use an absolute grading system to ensure that the assessment of each proposal is independent of others (satisfying the board's demand for intertemporal consistency). This avoids the Arrow impossibility by using cardinal information. The method is resistant to manipulation because grades are not easily traded and because we use medians to limit the effect of outliers. Clone independence is achieved by merging near-identical proposals. The no-show paradox is avoided because panelists who participate help their favorite proposals. The procedure is efficient and can be implemented in Excel.

