answer: |-
  Based on your constraints, board demands, and the inherent challenges of social choice theory (particularly Arrow's Impossibility Theorem), I propose a procedure centered on **cardinal grading with calibrated anchors**, violating Arrow's Independence of Irrelevant Alternatives (IIA) condition in its ordinal ranking form but satisfying your board's substantive accountability requirement through absolute scores. This method prioritizes defensibility, simplicity, and transparency, explicitly trading off theoretical ideals for practical feasibility. Below is the procedure, rationale, and tests against your scenarios.

  ---

  ### **Procedure (1 Page)**
  1. **Grading Setup**  
     - Before each cycle, the foundation provides panelists with:
       - A rubric: Scale of 0–10 (0.5 increments allowed), where 10 = "exceptional," 7 = "funding threshold," 4 = "major flaws," etc.
       - 5–10 anchor proposals (from past cycles) with pre-assigned benchmark grades (e.g., "Proposal X: 8.5 for strong methods but limited impact").
     - Panelists calibrate individually: Grade anchors, compare to benchmarks, and adjust their grading to align.

  2. **Review and Scoring**  
     - Each panelist grades all assigned proposals (using the rubric) before the meeting. Proposals are graded in isolation (no comparison).
     - For each proposal, calculate its **final score**:  
       - Take the median of the three panelists' grades (robust to outliers).  
       - If a panelist is absent, the chair reassigns their proposals to others (all proposals must have 3 grades).

  3. **Ranking and Shortlisting**  
     - Rank proposals by final score (highest to lowest). Break ties:  
       - Step 1: Average of the three grades (higher wins).  
       - Step 2: Lowest minimum grade (favors consistency; e.g., [8,8,8] beats [10,8,6]).  
       - Step 3: Highest maximum grade.  
       - Step 4: Earlier submission ID (arbitrary but consistent).  
     - **Shortlist cutoff**:  
       - Fund the top *k* proposals where *k* is 6–10 (board’s discretion), but only if final score ≥7.0.  
       - If fewer than 6 proposals score ≥7.0, fund fewer or none (per trust deed).  
       - *Budget note*: The cutoff (6–10) is a resource decision, not a social choice rule. The panel recommends *k*; the board approves based on funds.

  4. **Clone Handling**  
     - During discussion, any panelist flags near-identical proposals (e.g., same lab, methods, aims).  
     - Full panel votes: Majority approves → treat as one "merged" proposal.  
       - Merged score = median of all six grades (three per original proposal).  
       - Rank merged entry once. If funded, the panel selects one original proposal to award (avoids split).

  5. **Reasons and Accountability**  
     - Every applicant receives:  
       > "Your proposal’s median grade was [score]. Funded proposals: grades [min funded] to [max funded]. Cutoff: [lowest funded score or 7.0 if none]. Ties broken by average grade, then consistency."  
     - If merged: Add "Your proposal was deemed near-identical to [other]; merged grade was [score]."

  6. **Appeals and Transparency**  
     - Rules publicly state: "Proposal ranks depend solely on their own grades, not comparisons to others. This ensures fairness if your proposal or competitors change in future cycles."  
     - Appeals cite procedural errors (e.g., incorrect grade calculation, clone misapplication).

  ---

  ### **Rationale (1 Page)**  
  **Core Trade-off**: We violate Arrow’s IIA *for ordinal rankings* but satisfy your board’s substantive demand (intertemporal rank consistency) via **absolute scores**. Arrow assumes ordinal preferences; we use cardinal grades to escape impossibility. This choice costs:  
  - **Appeals**: We accept that grades may drift over cycles (e.g., rubric inflation), risking "harder to fund" over time. Mitigation: Recalibrate anchors annually.  
  - **Vote-Trading**: Grading is less manipulable than ranking (no obvious "swap"), but panelists could inflate grades collusively. Mitigation: Grades are public in the panel; outliers require justification.  
  - **No-Show Paradox**: By attending and grading sincerely, panelists help their favorites (if absent, their proposals risk lower grades). This satisfies your demand.  
  - **Partial Ballots**: Not an escape hatch—grades force completeness, avoiding Arrovian chaos.  
  - **Sub-Panel Consistency**: Demand 2 is partially met. If sub-panels grade identically, rankings match. But grades may differ naturally; we prioritize speed over full symmetry.  
  - **Clone Independence**: Achieved via merging. Cost: Requires panel time for detection/votes.  

  **Judgment Calls**:  
  - Grade calibration (panelists may vary; training is key).  
  - Clone votes (subjective; chair ensures evidence-based discussion).  
  - Cutoff *k* (budget-driven; panel proposes, board decides).  

  **What We Cannot Settle**:  
  - Grade inflation/drift: A "values" issue. The panel must weigh rigor vs. generosity.  
  - Tie-breaking: Steps 2–4 are procedural but arbitrary; we accept this to avoid deadlock.  
  - True IIA: Grades are *interpersonally absolute* but may shift if rubric drifts—this is "rubric management," not social choice.  

  **Costs in Panel Time**:  
  - Calibration: 1–2 hours pre-meeting (critical for consistency).  
  - Clone debates: Allow 15 minutes per suspected pair.  
  - Grading: Done offline; meeting focuses on clones, borderline scores, and cutoff.  

  ---

  ### **Test Runs**  
  **Cycle 1 (Clean, 8 Proposals, Implicit Quality Order)**  
  - Ballots: Single-peaked along quality (e.g., A: [10,10,10], B: [9,9,9], ..., H: [3,3,3]).  
  - **Procedure**:  
    - Scores: A=10, B=9, ..., H=3.  
    - Ranking: A>B>C>D>E>F>G>H.  
    - Fund top 6 (A–F).  
  - **Why no impossibility?** Domain restriction (single-peaked) allows majority-like rules, but grading is simpler. We avoid Arrow by not aggregting ordinals—no need to cite the theorem here.  
  - **Reason to H**: "Median grade: 3. Funded: 6–10. Cutoff: 6."  

  **Cycle 2 (Near-Duplicates + Rival; Chair Favors Rival)**  
  - Proposals: Lab submits P ([9,9,9] → median 9) and Q ([9,9,9] → median 9). Rival R ([9,9,9] → median 9).  
  - **Procedure**:  
    - Panel flags P and Q as clones; majority approves merge.  
    - Merged score = median of [9,9,9,9,9,9] = 9.  
    - Ranking: P/Q and R tie at 9.  
    - Break tie:  
      - Step 1 (average): Both average 9 → tie.  
      - Step 2 (min grade): Both min=9 → tie.  
      - Step 3 (max grade): Both max=9 → tie.  
      - Step 4 (ID): R has lower ID → R ranks above P/Q.  
    - Fund R. P/Q not funded (cutoff ≤10, but R is top).  
  - **Outcome**: Chair’s preference (R) wins via tie-breaker.  
  - **Cost**: Tie-breaker is arbitrary but transparent. If IDs favored P/Q, the panel would select one to fund.  

  **Cycle 3 (Resubmission: A vs. B)**  
  - Last cycle: A scored 8.0, B scored 7.5; A funded, B not.  
  - This cycle: A (resubmitted, stronger) scores 8.0 again (panelists’ assessments unchanged); B scores 7.5.  
  - **Procedure**:  
    - A and B ranked by scores: A=8.0 > B=7.5.  
    - Cutoff: If set at 7.8, neither funded; if 7.4, both funded.  
  - **Reason to A (if cutoff=7.8)**:  
    > "Your proposal’s median grade was 8.0. Funded proposals: grades 7.8 to 9.5. Cutoff: 7.8. Note: Your proposal outranked B (7.5), but neither met cutoff."  
  - **Board’s Demand Satisfied**: A *always* ranks above B if scores unchanged—no reversal. Absolute scores defend intertemporal consistency.  
  - **Cost**: Board must accept that "stronger resubmission" isn’t reflected if panelists don’t raise grades. This is a calibration/judgment issue, not rule failure.  

  ---

  ### **Conclusion**  
  This procedure meets your demands:  
  1. **IIA Accountability**: Ranks depend only on a proposal’s own grades, preventing reversals if scores unchanged (demand 1).  
  2. **Sub-Panels**: Consistency holds if grades align; we sacrifice symmetry for feasibility (demand 2).  
  3. **No-Show/Trading**: Sincere grading helps favorites; public grades deter trading (demand 3).  
  4. **Clones**: Merging avoids splits (demand 4).  

  **Explicit Violation**: We violate Arrow’s IIA *for ordinal preferences* (by using cardinal scores) but satisfy its spirit for accountability. The cost is rubric management and tie-breaking arbitrariness.  

  **Final Advice**: Implement this for one cycle as a trial. Monitor: (1) grade distribution for inflation/drift, (2) panel time on calibration/clones, (3) appeal rates. If appeals focus on grades (not ranks), the system works. If you need less arbitrariness, move to a Condorcet method—but that violates no-show and clone independence, costing more appeals. Grading balances your constraints best.
