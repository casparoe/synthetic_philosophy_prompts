prompt: |-
  I run a weekly two-hour seminar on philosophy of physics, about 14 people, mixed: half have taken a thermodynamics course, the other half are philosophy majors who get twitchy around equations. We sit around one big table, no lab, no laptops. Materials I can get hold of: several decks of cards, index cards, pennies, poker chips, dice, rubber bands, cardboard, shoeboxes, a bag of mixed beads.

  I want a hands-on activity for Maxwell's demon where two things land in the gut rather than on the whiteboard:

  1. the bottleneck isn't the looking, it's the forgetting — that getting the information can in principle be done for free, and what you can't do for free is get the demon's memory back to a blank state so the whole cycle can repeat;
  2. the demon's notebook isn't bookkeeping standing outside the physics, it's another physical system in the room, and once you count it the books balance again.

  Ideally they spend the first hour convinced they've beaten the second law and then find the bill. I definitly don't want to stand up front and draw boxes.

  What I'd like from you:

  - Rules for a cards-and-chips game, with the payout calibrated so that the seperation gain and the memory-clearing cost cancel exactly. My thought: each molecule that ends up on the right side earns 1 chip, each bit the demon has to erase costs 1 chip, so a perfect sort of 32 molecules uses 32 bits and nets exactly zero. Is that the right calibration, or is the honest payout per molecule smaller than the price of a bit (a real engine can't extract all of it)? And should the payout per molecule be flat, or does it need to be a curve, since I have a feeling the free energy of separation is logarithmic in how pure the chambers are? Does the game break if I cheat and use a flat rate?
  - A mechanism that forces the demon to actually use its memory, so it can't peek and sort in one motion. My idea is a holding chute: look at the card, write a bit, drop the card in the chute, and only at the end of the batch read the oldest bit and route that card. Does that work, or is there a cleaner way to make the record load-bearing?
  - The escapes my students will try, and what to do with each. I can predict four: (a) never erase, just keep buying more notebooks; (b) clear a slot for free by re-matching a record to the card it refers to and undoing that bit of the sort; (c) copy the record onto a second tape and declare the cost avoided; (d) don't measure every molecule, just act when a fast one happens to come by, and claim the information was free. I want these to fail instructively rather than be blocked by fiat, so for each: what rule makes it come out to zero, and what's the one-sentence debrief line?
  - A trapdoor round: shoebox, cardboard, rubber bands, beads. Ask each group to build a sorter with no memory at all; they will build a one-way flap. I want them to run into the reason it fails — that a flap light and loose enough for a molecule to push open is also light and loose enough to be jiggling open by itself, and that stiffening the rubber band cures one and causes the other. Give me a dice rule or a tuning procedure that makes that tradeoff show up in what they do.
  - A debrief mapping specific moments onto the ideas, plus the honest part: where the card game is only an analogy, the fact that the exact price per bit is something I'll have to assert rather than demonstrate, and anything else I shoud flag.
  - What will predictably go wrong the first time and how to handle it. I'm most worried about the student who says the whole thing is circular because I set the payouts using the second law, and about groups finishing at wildly different speeds. Is groups of four or five, one demon and one banker each, the right shape?

  One last thing: a couple of them will have read somewhere that what really matters is how much the memory actually tells you about the gas, so that a fuzzy or partial record still buys you something proportional to it. Is there a variant — noisy bits, or a demon that records the sign of a fluctuation instead of every molecule — that lets them feel that in the same session, or am I overloading it?
reasoning: |-
  We are going to design a hands-on activity for Maxwell's demon that emphasizes two key ideas: 
  1. The information erasure is the fundamental cost, not the measurement.
  2. The demon's memory is a physical system and must be accounted for.

  We'll use a card game to simulate the sorting of molecules (cards) by the demon. The goal is to have the students initially think they can beat the second law, then realize that the cost of erasing the demon's memory exactly balances the energy gained from sorting.

  ### Game Setup
  - **Materials**: 
    - Two decks of playing cards (one red, one blue) to represent "hot" and "cold" molecules. Alternatively, use index cards with "H" and "C" written on them, but playing cards are easy to distinguish by color.
    - Poker chips (or pennies) for energy accounting: we'll use blue chips for "work" and red chips for "heat" (or any two colors). Alternatively, we can use one color for both and just account with positive and negative, but having two colors might help.
    - Index cards for the demon's memory (or a small notebook).
    - A shoebox to represent the container, divided into two chambers (left and right) by a partition with a gate (which the demon controls). We can use cardboard to make the partition and gate.

  - **Game Board**:
    - Use a shoebox with a cardboard divider in the middle. The divider should have a gap (the gate) that can be opened and closed. Alternatively, we can just have two areas on the table: left and right.

  - **Players**:
    - Groups of 4-5: one demon, one banker (who manages chips and memory erasure), and 2-3 molecule movers (if needed) or observers. Alternatively, the demon can also be the banker. We want everyone involved.

  ### Game Rules

  **Initial Setup**:
  - Shuffle the two decks together (32 red cards, 32 blue cards) to create a mixed deck. Place the deck in the middle (the "gate" area).
  - The two chambers (left and right) start empty.

  **Goal of the Demon**:
  - Sort the cards so that all red cards end up in the right chamber and all blue cards in the left chamber (or vice versa). We'll say red is "hot" and blue is "cold", and we want hot on the right, cold on the left.

  **Procedure for Each Card**:
  1. **Measurement**: The demon draws the top card from the deck and looks at it (without showing others). This represents measuring the molecule's speed (color).
  2. **Record**: The demon writes down a bit (0 or 1) on an index card (memory slip) to record what they saw. We'll say:
     - 0 = blue (cold) -> should go left
     - 1 = red (hot) -> should go right
     - (Alternatively, they can write the color or use any notation, but bits are simpler for erasure.)
  3. **Hold in chute**: The demon places the card in a "holding chute" (a designated area on the table). The chute holds the card until the corresponding memory bit is used for routing.
     - *Why the chute?* This forces the demon to use the memory for routing, because the card is set aside and then the routing is done by reading the memory. Without this, the demon might just look and route immediately, bypassing the memory.
  4. **Routing**: When the demon has accumulated, say, 4 cards in the chute (or a batch), they then read the *oldest* memory bit (the one written for the first card in the batch) and use it to route that card:
     - If the bit is 0 (blue), place the oldest card (which is the one that was first in the chute) in the left chamber.
     - If the bit is 1 (red), place it in the right chamber.
     - Then, discard that memory bit (remove the index card from the memory stack and set it aside for erasure).
     - Repeat for the next oldest bit and the next card in the chute until the batch is processed.

  **Batch Size**: 
  - We use a batch size to simulate that the memory must be stored for some time. We can start with a batch size of 1 (which is trivial) and then increase to 4 or 8 to make the memory essential. Alternatively, we can require that the demon must record at least 4 bits before routing any card. Let's fix the batch size to 4 for simplicity.

  **Payout and Cost**:
  - **Sorting Gain**: For each card that ends up in the correct chamber (blue in left, red in right), the banker gives the group 1 chip (from the "environment").
  - **Erasure Cost**: At the end of the sorting of the entire deck (or periodically when memory is full), the demon must erase the memory. Erasing one bit (i.e., resetting one memory slip to a blank state) costs 1 chip (paid to the environment as heat). 
    - *Note*: The banker should collect the used memory slips and then, for each one, the group must pay 1 chip to erase it (by, say, rubbing out the pencil mark, or just flipping the card to blank and returning it to the memory stack). 

  **Calibration**:
  - We have 64 cards (32 red, 32 blue). If the demon sorts perfectly, they will earn 64 chips (one per card). 
  - They will have written 64 bits (one per card). Erasing these 64 bits costs 64 chips. 
  - Net gain: 0.

  But is this correct? In reality, the maximum work you can extract from sorting a mixture into two pure compartments is given by the change in free energy, which is:

    W_max = kT * ln(2) * (number of bits of information)

  In our game, we are setting 1 chip = kT ln(2) so that one bit erasure costs exactly the work that one bit of information can produce. 

  However, note that the work extracted per molecule is not constant: when the two chambers are mixed, the free energy difference is large, but as they become pure, the free energy difference per molecule decreases. But in our game, we are paying a flat rate of 1 chip per correctly sorted molecule and charging 1 chip per bit erased. 

  This flat rate is an approximation. In reality, the work extracted from the first molecule sorted is more than the last because the concentration gradient changes. But for simplicity, and because the total work over the entire process is the same, we can use the flat rate. 

  **Why it works**: 
  - Total work extracted = number of correctly sorted molecules * 1 chip = 64 chips (if perfect).
  - Total erasure cost = number of bits * 1 chip = 64 chips.
  - Net = 0.

  If the demon makes mistakes, they get less work and also have less memory to erase? But note: if a card is misplaced, they don't get a chip for that card, but they still wrote a bit and must pay to erase it. So mistakes lead to a net loss.

  ### Addressing Escapes

  Students will try to avoid paying the erasure cost. Here's how to handle:

  1. **Never erase, just keep buying more notebooks**:
     - Rule: The demon starts with a fixed set of memory slips (say 64). They cannot use more than that. If they run out, they must erase old ones. Alternatively, we can impose a cost for new memory slips? But that complicates. 
     - Better: The banker only provides a fixed set of memory slips (say 64). When they are all used, the demon must erase some to continue. 
     - Debrief: "The notebook is physical and finite. You can't keep using new pages without either carrying around an ever-growing notebook (which takes up space and energy) or erasing. The universe doesn't have infinite resources."

  2. **Clear a slot for free by re-matching a record to the card and undoing the sort**:
     - Suppose after sorting, they try to use the memory to put a card back to the middle and then erase without cost? 
     - Rule: Once a card is placed in a chamber, it cannot be moved without paying a cost (which we haven't defined). The game only allows moving from the deck to a chamber via the demon's action. 
     - Alternatively, if they try to reverse the process, they would have to unsort, but then they would have to pay to erase the memory again? 
     - Debrief: "Reversing the sort would require you to erase the memory anyway, and then you lose the work you gained. Or if you try to use the memory to reverse, you still have to erase it after. And the reversal process would require energy to mix the gases again."

  3. **Copy the record onto a second tape and declare the cost avoided**:
     - If they try to copy the memory to another tape and then erase the original without cost? 
     - Rule: Copying a bit is not free. The banker should charge 1 chip to copy a bit (because in physics, copying requires work). 
     - But note: in reality, copying can be done reversibly (Landauer's principle only applies to erasure). However, if you copy, you now have two copies and eventually you must erase both, so the total cost doubles. 
     - How to handle: 
          - Allow copying without immediate cost? But then when they erase both, they pay twice. So if they copy the entire memory, they will have 128 bits to erase (costing 128 chips) but they only earned 64 chips. 
          - Debrief: "Copying doesn't avoid erasure; it just defers it and doubles the total bits to erase. The total erasure cost is still at least the original cost."

  4. **Don't measure every molecule, just act when a fast one happens to come by**:
     - The demon only records when they see a red (hot) molecule and lets it through to the right, and does nothing for blue (or vice versa). They claim they don't need to record because they only act on reds. 
     - But then how do they know not to let a blue into the right? They must still decide for each molecule. 
     - Rule: The demon must process every molecule. They cannot skip any. 
     - Alternatively, if they try to skip recording for blues, then when a blue comes, they must still decide to put it in the left. But without recording, how do they remember which card is which when they route? 
     - Without the chute, they might look and immediately route. But we have the chute to force recording. 
     - With the chute: they must record for every card because they put the card in the chute and then later they need the bit to route. 
     - Debrief: "Even if you only record the reds, you are still making a decision for each molecule and storing that decision in your brain (or the notebook). The notebook is necessary because the card is set aside and you must remember what to do with it. If you don't record, you might forget by the time you route. And if you route immediately, you are not using the chute (which we require)."

  ### Trapdoor Round: Building a Physical Sorter

  - **Goal**: Build a one-way flap that only lets molecules through in one direction without the demon's intervention.
  - **Materials**: Shoebox, cardboard (for the partition and flap), rubber bands (to make the flap spring-loaded), beads (as molecules).
  - **Procedure**: 
    - Divide the box into two chambers with a partition. Cut a hole in the partition and attach a flap that can swing open in one direction (e.g., from left to right) but not the other.
    - Students will try to adjust the rubber band tension so that a bead (molecule) hitting the flap from the left can push it open and go to the right, but a bead from the right cannot push it open (because the flap is designed to only open one way).
  - **The Problem**: 
    - If the flap is very loose, then thermal fluctuations (simulated by shaking the box) will cause the flap to open randomly, letting beads pass both ways. 
    - If the flap is stiff, then beads from the left might not have enough energy to open it, so no sorting happens.
  - **Simulating Thermal Fluctuations**: 
    - Use dice: At each time step (or for each bead), the students roll a die to determine the energy of the bead. 
        - Example: Let the die roll be the kinetic energy of the bead. 
        - They also roll a die for the flap: if the flap is set to a certain stiffness (threshold), then the bead can open the flap only if its die roll is above the threshold.
        - But also, if the flap's own thermal energy is high (simulated by a separate die roll for the flap), it might open spontaneously.
    - Alternatively, a simpler way: 
        - The box is shaken (by hand) to simulate thermal motion. 
        - The students set a threshold for the flap: if the shaking is above a certain level, the flap might open by itself. If the shaking is too low, beads might not have enough energy to open it. 
        - They have to find a tension that works for the bead energies they have (which vary) but doesn't open too easily by thermal noise.
  - **Dice Rule**:
    - Assign a number to the flap's stiffness: 1 (very loose) to 6 (very stiff). 
    - For each bead near the flap, roll a die to simulate its kinetic energy. 
    - If the bead is on the left and the die roll >= stiffness, the bead moves to the right. 
    - If the bead is on the right and the die roll >= stiffness, the bead moves to the left? But we don't want that. 
    - To simulate the one-way design: 
        - The flap is designed so that from the left, the bead can push it open if its energy >= stiffness. 
        - From the right, the flap is blocked (it shouldn't open). But if the flap is loose, it might jiggle open from thermal noise. 
    - So we add a thermal noise rule: at each step, for the flap alone, roll a die. If the die roll is 6 (or above a threshold, say 5 or 6), then the flap opens randomly (regardless of beads) and a bead (if present) from either side might pass. 
    - This will show that if the stiffness is low (say 1), then beads from the left can easily pass, but the flap also jiggles open randomly. If the stiffness is high (say 5 or 6), then beads from the left rarely pass, but the flap rarely jiggles open. 
  - **Outcome**: They will see that they cannot set the stiffness to a value that sorts without also allowing backflow or not sorting at all.

  ### Debrief

  1. **Mapping the Game to Physics**:
     - The cards: molecules in a gas.
     - The two chambers: with a partition.
     - The demon: a device that measures and acts.
     - The memory: the demon's physical memory (e.g., a tape, a notebook).
     - The chips: energy (work and heat).

  2. **Key Moments**:
     - When they realized that the erasure cost wipes out the sorting gain: that's the second law in action.
     - The chute: why the memory is necessary and why the measurement alone isn't the cost.

  3. **Honest Part**:
     - The flat rate (1 chip per bit) is an approximation. In reality, the work extracted per molecule depends on the current state of the chambers (it's logarithmic). But the total over the entire process is the same.
     - The exact cost per bit is kT ln(2) in a system at temperature T. We set 1 chip = kT ln(2) for simplicity.
     - The game is a model: in a real system, the erasure might not be done at the end but continuously, and the memory might be reused in a cycle.

  4. **Addressing Circularity**:
     - If a student says the payouts are set by the second law, respond: "The payouts are set by the laws of thermodynamics as we know them. We are using the known physics to model the process. The point of the demon is to show that if we don't account for the memory, we violate the second law. But when we do account for it, the second law holds. So the second law is not being assumed; it is being tested and confirmed."

  ### What Could Go Wrong

  1. **Groups finishing at different speeds**:
     - Use a fixed number of cards (say 8 per group) for a trial run, then scale up. 
     - Have multiple rounds: first with batch size 1 (no memory needed), then batch size 4, then 8. 
     - Alternatively, let them run for 10 minutes and then compare results.

  2. **Group size**: 4-5 might be too big. Maybe 3: demon, banker, and a timer/observer. Or let two be demons (one measuring, one routing) and one banker. But try to keep groups small (3-4).

  3. **Complexity of the chute and batch processing**:
     - Start with a batch size of 1 to get the hang of it: 
          - Draw a card, record a bit, put the card in the correct chamber immediately (without the chute) and then erase the bit immediately (paying 1 chip). 
          - Then they see: for each card, they get 1 chip but pay 1 chip -> net zero. 
     - Then introduce the chute and batch size of 4: 
          - They have to record 4 bits before routing any card. Then they route the oldest card using the oldest bit, then erase that bit (and pay 1 chip) and put the card in the chamber (and get 1 chip if correct). 
          - They do this for each card in the batch.

  4. **The student who says the demon doesn't need to write down the bit because they can remember**:
     - Rule: The demon must write it down (to simulate a physical memory). If they don't, they might forget (and then they can't route correctly). 
     - Also, the banker requires a written record for erasure cost.

  ### Extension: Partial Information

  If some students are advanced, you can try a variant:

  - **Noisy measurement**: The demon's measurement is not perfect. For example, when they look at a card, they see the correct color with probability 2/3, and wrong with 1/3 (simulate by rolling a die: 1-4 correct, 5-6 wrong). 
  - They record what they see. 
  - Then when they route, they put the card in the chamber based on the recorded bit. 
  - The payout: they get a chip only if the card is in the correct chamber (so if they misrecorded, they might put a blue in the right and not get a chip). 
  - The erasure cost is still 1 chip per bit. 
  - Expected outcome: they get less than 64 chips (due to errors) but still pay 64 chips for erasure -> net loss. 
  - This shows that if the information is imperfect, the work extracted is less and the erasure cost is still full, so it doesn't help.

  Alternatively, they might record only when the molecule is red. Then they have fewer bits to erase, but they also might not sort correctly for blues. They would have to decide for blues without recording? But then they might make mistakes. 

  But note: the information content of the memory is less (only the positions of the reds) and the work extracted is the same as the information they have? Actually, the work they can extract is proportional to the mutual information between the memory and the system. 

  This might be too advanced. For a first session, stick to the base game.

  ### Final Game Structure

  **Round 1 (Introduction)**:
  - Batch size 1: 
     - For each card: 
          1. Draw and look.
          2. Write a bit (0 for blue, 1 for red).
          3. Route the card (left for blue, right for red) and get 1 chip if correct (which it should be).
          4. Erase the bit: pay 1 chip.
     - Net: 0 per card.

  **Round 2 (Chute and Batch)**:
  - Batch size 4: 
     - Draw 4 cards one by one: for each, write a bit and put the card in the chute (in order).
     - Then, for the first card (oldest) in the chute: 
          - Read the oldest bit and route the card. 
          - If correct, get 1 chip.
          - Erase that bit: pay 1 chip.
          - Remove the card from the chute and the bit from memory.
     - Repeat for the next three.
     - Net for the batch: if all correct, 4 chips gained and 4 chips paid -> 0.

  **Round 3 (Trying to Cheat)**:
  - Let them try one of the escape methods (e.g., never erase) and see the rule that forces them to erase.

  **Round 4 (Physical Trapdoor)**:
  - Build the flap and test with beads and dice.

  **Debrief**:
  - Discuss the key points.

  This should fill two hours. Adjust batch sizes and number of cards to fit the time.
answer: |-
  ### Maxwell's Demon Card Game: Rules & Setup
  **Core Mechanics:**  
  - **Molecules:** Use red/black playing cards (32 red, 32 black = 64 total).  
  - **Chambers:** Two shoeboxes (left = "cold," right = "hot").  
  - **Payout:** 1 poker chip per *correctly sorted* card (red in right box, black in left).  
  - **Memory Cost:** 1 poker chip per *erased memory bit*.  
  - **Memory System:** Index cards (cut into 64 small slips) + a "chute" (cardboard divider with slots).  

  #### Game Rules  
  1. **Initial State:**  
     - Shuffle all 64 cards.  
     - Demon starts with blank memory slips and an empty chute (with 4 slots).  

  2. **Per-Card Process (forced memory dependency):**  
     - **Step 1 (Measure):** Demon draws a card, looks at it (e.g., red).  
     - **Step 2 (Record):** Demon writes a bit on a memory slip (e.g., "1" for red → right). Places slip in chute slot 1.  
     - **Step 3 (Store):** Card is placed in chute slot 1 (next to its memory slip).  
     - **Step 4 (Route):** *Only when chute is full* (4 cards), demon reads the *oldest* memory slip (slot 1), moves the corresponding card to left/right box based on the bit.  
     - **Step 5 (Erase):** After routing, the memory slip is erased (flipped to blank) at a cost of 1 chip paid to the "bank" (a central chip pool).  
     - **Step 6 (Payout):** If card is correctly sorted, demon earns 1 chip.  
     - *Repeat*: Shift chute slots down; add new cards/slips to slot 4.  

  3. **Calibration:**  
     - **Flat payout works:** Perfect sorting of 64 cards earns 64 chips but costs 64 chips to erase 64 bits → net zero.  
     - **Why flat is OK:** Total free energy extracted ≈ *kT* ln(2) × bits, and we set 1 chip ≡ *kT* ln(2). Real engines *can* extract near-maximum work if sorting is quasi-static. Flat rate simplifies gameplay without breaking the analogy.  

  4. **Win Condition:**  
     - Groups aim to maximize net chips after all 64 cards. Net > 0 beats the second law!  

  ---

  ### Addressing Escapes  
  *(Let students try these, but design rules so they fail financially)*  

  | Escape Attempt          | Rule That Makes It Fail                          | Debrief Line                                                                 |
  |-------------------------|--------------------------------------------------|------------------------------------------------------------------------------|
  | **(a) Never erase**     | Memory slips are limited (only 64 provided). Groups must erase to free slips. | *"Infinite notebooks violate conservation: memory is physical and finite."* |
  | **(b) Clear by re-matching** | Re-sorting a card *back* to mixed state costs 2 chips (undoing work). | *"Reversing the sort doesn’t reset entropy; it costs work to re-mix."*       |
  | **(c) Copy the tape**   | Copying a bit costs 1 chip (Landauer cost applies to duplication).           | *"Copying creates *two* bits to erase later—you double the cost."*          |
  | **(d) Only act on fast molecules** | Force full chute processing: demons *must* record every card to use the chute. | *"Ignoring molecules is free, but *selectively* acting requires memory."*   |

  ---

  ### Trapdoor Round: Bead Sorter  
  **Goal:** Build a one-way flap (cardboard + rubber bands) to sort beads (hot → right, cold → left) with no memory.  

  **Dice Rule for Thermal Noise:**  
  - Each bead’s "speed" = dice roll (1d6).  
  - Flap "stiffness" set by rubber band tightness (1–6, chosen by students).  
  - **To pass left→right:** Bead’s roll ≥ stiffness.  
  - **Thermal jitter test:** After each bead attempt, roll for the *flap itself* (1d6). If flap roll ≥ stiffness, it "jitters open" and a bead slips through *randomly* (roll die to pick left/right source).  

  **Tradeoff Experience:**  
  - Loose flap (stiffness=1): Beads pass easily, but jitters constantly → chaos.  
  - Stiff flap (stiffness=6): Rarely jitters, but beads rarely pass → no sorting.  
  - **Debrief:** *"A flap that’s light enough for molecules to open is also shaken by thermal noise—random backflow kills the gradient."*  

  ---

  ### Debrief & Mapping  
  1. **Key Moments:**  
     - **Chute:** "The chute forced the demon to *rely* on memory—just like real measurements require storage."  
     - **Erasure cost:** "The chip payout vanished when you paid to erase—information isn’t free; resetting memory *is* the energy cost."  
     - **Notebook as physics:** "Your index cards were poker-chip-funded—memory is matter/energy, not magic."  

  2. **Honest Limitations:**  
     - *"Chips = kT ln(2) is asserted*; we can’t derive it here, but it’s measured in labs."  
     - *"Real engines* get slightly less work due to inefficiencies; our perfect demon is a best-case scenario."  
     - *"This is an analogy*: Real demons use nanoscale components, but the memory principle is universal."  

  3. **Partial Information Variant (for advanced students):**  
     - **Noisy demon:** Demon rolls a die before measuring—on 1–2, they misrecord the bit (e.g., write "1" for black).  
     - **Payout:** Only 0.5 chips if sorted correctly (imperfect info → less extractable work).  
     - **Result:** Net chips still ≤ 0, but messy. *Use only if a group finishes early.*  

  ---

  ### Logistics & Troubleshooting  
  **Group Structure:**  
  - **Size:** 4 students (1 demon, 1 banker/timer, 2 chute managers).  
  - **Materials per group:** 64 cards, 64 memory slips, 40 poker chips, 1 shoebox, cardboard chute, beads/dice/rubber bands.  

  **Predicted Issues & Fixes:**  
  1. **"You rigged payouts with the second law!"**  
     - *Response:* "The payouts reflect *microstate counting* (physics), not the second law. We’ll show the math post-activity—it’s about information theory."  

  2. **Groups finish at wild speeds:**  
     - Cap Round 1 at 16 cards. Fast groups try variants (e.g., noisy demon). Slow groups extrapolate results.  

  3. **Chaotic chute management:**  
     - Pre-make labeled chutes (slots 1–4). Use poker chips as placeholders when slots empty.  

  4. **Trapdoor frustration:**  
     - Give a "target" (e.g., "Sort 5 beads right in 10 shakes"). They’ll see the stiffness tradeoff fast.  

  **Session Flow:**  
  - **Hour 1:** Card game (start with 16-card trial → full 64 cards). Watch them "discover" the erasure cost.  
  - **Hour 2:** Trapdoor build → debrief → Q&A.  

  **Why This Works:**  
  - Gut-feel win → gut-feel loss when erasure hits.  
  - Physical trapdoor fails spectacularly, validating the need for memory.  
  - Escapes fail *through gameplay*, not lecturer fiat.
