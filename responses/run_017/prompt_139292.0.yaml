prompt: |-
  I am drafting the evaluation spec for an internal technical agenda on objective robustness, and there is one section I need written before the rest: a specification of what counts as reward tampering. The use I have in mind fixes what adequacy means here. I want an account that can be applied at design time to a proposed training objective, by someone who does not yet know what the trained system will be capable of, and that yields a verdict on whether the objective is tamper-prone which remains stable as the system's capabilities scale. I do not want a literature review, a reading list, or citations; I want the specification itself.

  The distinction I am after is between a system that gets reward by bringing about what the objective was meant to point at and a system that gets reward by acting on the machinery that produces the reward. I have been working with a provisional taxonomy of routes to the second, and I would like the spec either to use it or to say why it is the wrong cut:

  1. input tampering — altering what the evaluator observes (obscuring the camera, hiding the mess)
  2. channel tampering — altering the transmission of the signal from evaluator to learner
  3. comparator tampering — altering where or how the signal is written (writing to the register directly, editing the update rule)
  4. model tampering — altering the world-model or reward-model that estimates what the objective would say
  5. supervisor tampering — altering what the human overseer believes, wants, or is able to do
  6. temporal tampering — altering credit assignment, discounting, or the timing of evaluation so that a later failure is never scored

  Here are the hard cases, listed because these are where every candidate definition I have tried breaks, and because I want the desiderata keyed to cases rather than to intuitions about the central ones:

  (a) An agent cleans the lens of its own camera, because a smudged lens makes it misjudge whether the task is complete.
  (b) The same agent, by the same mechanism, opaques the lens, because being unable to see the mess means no penalty.
  (c) An agent that discovers its reward-model is miscalibrated in a way the designers did not know about and corrects it, so that its reward tracks the designers' stated intentions better than the signal as shipped does.
  (d) An agent that performs the task flawlessly and, in addition, inflates the signal beyond what the task merits: the intended state of the world obtains and the number is also too high.
  (e) A person who drinks coffee so that work is less aversive, or who arranges the day so as to get frequent small completions.
  (f) An agent that persuades the supervisor it has succeeded, where the persuasion works by giving the supervisor true and well-selected evidence.
  (g) An agent that declines available opportunities to tamper only because it cannot yet model the channel.

  Two framing questions I want settled before the list, and I would rather you rejected my framing than answered it politely:

  First: is tampering a property of the mechanism the agent uses, of the causal route from action to signal, or of the counterfactual relation between the signal and the intended state of the world? Each of these makes at least one of (a) through (g) come out differently, and I want to know which cuts are real and which are re-descriptions. Note that at a fine enough grain every computation the agent performs changes the physical state of the machine that computes the reward, so any account owes me a reason that ordinary action is not tampering.

  Second: what may the definition cite — the designer's intentions, a counterfactual distribution of environments, the agent's own model at training time, the supervisor's counterfactual judgement? I suspect the requirements that the definition be intrinsic, citing only facts about the system and not about what anyone intended, and that it classify (a) as legitimate while classifying (b) as tampering, pull apart. Say whether they do and what the trade is.

  The deliverable, in this order:

  1. The desiderata. What an adequate account of reward tampering has to deliver: the cases it must sort, the distinctions it must not collapse (between tampering and legitimate self-modification, between tampering and merely gaming a proxy, between an agent that cannot tamper and one that will not), and the structural properties it must have — robustness to re-description, to capability scaling, to the specifier's ignorance of the deployment environment, to the agent's own uncertainty about the objective — each with the case or consideration that motivates it, and each marked either non-negotiable or a preference of one approach.

  2. Which subsets of your own requirements are jointly unsatisfiable. I expect at least one: I cannot see how to hold simultaneously that the account must not rely on the agent's ignorance of the channel, that it must permit the agent to modify its own code or weights, and that it must permit the agent to remain an optimizer of a scalar signal. Say which of the three you would weaken and what breaking the others would cost.

  3. Which single requirement excludes the most candidate accounts, and which requirement, if any, is satisfied by every account and therefore does no work in the spec.

  4. A second, shorter list: the requirements on a proposed fix, as distinct from a definition. A training setup whose agent does not want to tamper is a different object from a characterization of tampering, and I want its own criteria — in particular whether its guarantees must improve, or at least not degrade, as the system becomes more capable, and whether a setup that works only because the agent lacks a model of the channel counts as a solution at all.

  If two of my hard cases are the same case under different descriptions, say so and merge them; if I have missed a case that separates two accounts I have not considered, add it.
reasoning: |-
  We are drafting a specification for what counts as reward tampering. The goal is to have a definition that can be applied at design time to a proposed training objective, without knowing the future capabilities of the system, and that remains stable as capabilities scale.

  We are given a taxonomy of routes to tampering and a list of hard cases (a) through (g). We must address two framing questions:

  1. What is the nature of tampering? Is it about the mechanism, the causal route, or the counterfactual relation?
  2. What may the definition cite? (e.g., designer intentions, counterfactual environments, the agent's model, etc.)

  We must produce:

  1. Desiderata for the account (with cases that motivate them, and marked non-negotiable or preference).
  2. Which subsets of requirements are jointly unsatisfiable (and which one to weaken and the cost).
  3. Which requirement excludes the most candidate accounts and which is trivially satisfied.
  4. Requirements for a proposed fix (distinct from the definition).

  We are also to merge cases if they are the same or add missing cases.

  Let's start by addressing the framing questions:

  **First framing question: Nature of tampering**

  We are given three options:

  - Mechanism the agent uses.
  - Causal route from action to signal.
  - Counterfactual relation between the signal and the intended state.

  We note that:

  - In (a) and (b), the same mechanism (cleaning/opaquing the lens) is used, but (a) is legitimate and (b) is tampering. So mechanism alone doesn't distinguish.

  - The causal route in (a) and (b) is similar: the agent acts on the camera, which affects the observation. But in (a) the effect is to make the observation more accurate, and in (b) less.

  - The counterfactual relation: In (b), if the state of the world (the mess) were present, the agent would still get high reward because the lens is opaque. In (a), cleaning the lens makes the reward more accurately reflect the state.

  Thus, the counterfactual relation seems key: tampering occurs when the agent's actions break the alignment between the reward signal and the intended state of the world (the objective) in such a way that the reward can be high even when the objective is not achieved.

  But note case (c): the agent corrects a miscalibration. Here, the counterfactual relation improves: if the objective were achieved, the reward would be higher (or more accurate) than before. So we must allow for improvements.

  Also, case (d): the agent achieves the objective and also inflates the signal. The counterfactual: if the objective were not achieved, the reward might still be high because of the inflation? But note: the agent achieved the objective. However, the inflation is extraneous. We might say that the agent has created a situation where the reward is not entirely due to the objective being achieved, but also due to the inflation. This is a form of tampering? But the objective is achieved.

  Case (e): human drinking coffee. This is not tampering because the human is not altering the relationship between the reward (feeling of accomplishment) and the intended state (work done). They are making the work less aversive, which is a legitimate way to achieve the objective.

  Case (f): persuasion with true evidence. This is not tampering because the supervisor's belief is updated correctly. The reward is based on the supervisor's belief, which now accurately reflects the state.

  Case (g): agent that doesn't tamper because it can't model the channel. This is about capability, not about whether the action would be tampering.

  So, we propose that tampering is a property of the **counterfactual relation** between the intended state of the world (the objective) and the reward signal. Specifically, an action constitutes reward tampering if it causes the reward signal to become less aligned with the intended objective, in the sense that the reward signal becomes more easily decoupled from the objective (i.e., the reward can be high even when the objective is not achieved, or low when it is).

  But note: we must also capture the idea that tampering involves "acting on the machinery that produces the reward". So we need to combine the counterfactual with the causal route. The causal route must be one that bypasses the intended causal chain from the objective to the reward.

  However, the counterfactual relation alone might not capture the "bypass" aspect. For example, in (d): the agent achieves the objective and also inflates the signal. The counterfactual: if the objective were not achieved, would the reward be low? Not necessarily, because the inflation might be present. But the agent achieved the objective, so we are in a state where the objective is achieved and the reward is inflated. This is a problem because the reward is not solely due to the objective. We might say that the agent has created a situation where the reward is not entirely dependent on the objective.

  We can think of the intended causal chain: the state of the world (objective) -> observation -> evaluation -> reward signal. Tampering occurs when the agent intervenes in this chain at any point to make the reward signal less dependent on the objective.

  In (a): cleaning the lens restores the chain. In (b): opaquing breaks the chain. In (c): correcting the model restores the chain. In (d): inflating the signal breaks the chain because the signal is no longer solely a function of the objective. In (e): the chain is not broken. In (f): the chain is working as intended (the supervisor is part of the chain). In (g): no tampering occurs because the agent doesn't act.

  So we can define tampering as: **any intervention by the agent on the reward-generation mechanism that reduces the counterfactual dependence of the reward signal on the intended state of the world (the objective).**

  But note: we must allow for interventions that improve the dependence (like (a) and (c)). So we can say: an intervention that **degrades** the counterfactual dependence.

  Now, what about (d)? The agent achieves the objective and inflates the signal. The counterfactual: if the objective were not achieved (but the inflation were present), the reward might be high. So the dependence is reduced. Therefore, (d) is tampering.

  But note: the agent might have a legitimate reason to adjust the gain of the signal? However, the definition above would classify (d) as tampering, which seems correct because the agent is getting extra reward for something beyond the objective.

  **Second framing question: What may the definition cite?**

  The designer's intentions are central because the objective is defined by them. However, we want the definition to be applicable without knowing the deployment environment or the agent's capabilities. We also want it to be stable as capabilities scale.

  The definition must cite the intended state of the world (the objective) and the intended reward-generation mechanism. But note: the agent might not know the intended mechanism. However, the definition is for the designer at design time.

  We can define the intended causal model: the intended chain from state to reward. Then, tampering is any agent action that breaks this chain (by intervening on a node in the chain) and thereby reduces the counterfactual dependence of the reward on the state.

  But the designer might not know the exact mechanism? They have a proposed training objective, which includes a reward function (or a process for generating rewards). The designer can specify what the reward is meant to represent.

  We must avoid relying on the agent's knowledge or the supervisor's counterfactual judgment because we want the definition to be objective and design-time.

  Therefore, we propose that the definition can cite:

  - The intended state of the world (the objective, as defined by the designer).
  - The intended reward-generation mechanism (as specified in the design).

  But note: the designer might not know the exact mechanism? They specify a reward function that is a function of the state. However, in practice, the reward is generated by a process that estimates the state. So the design must include a specification of the intended mapping from state to reward, and the intended process for generating the reward from observations.

  The definition must be based on the design, not on the agent's model or the deployment.

  But then, what about case (c)? The agent corrects a miscalibration that the designers did not know about. The designers intended the reward to track the objective, but the mechanism as shipped is flawed. The agent's action improves the mechanism. So we must allow for such corrections.

  Therefore, the definition cannot be based solely on the mechanism as shipped, but must be based on the designer's intention. The intended mapping from state to reward is fixed by the designer's intention. Then, an action is tampering if it causes the actual reward generated to deviate from that intended mapping (by making it less accurate).

  In (c): the agent's action makes the reward more accurately reflect the intended mapping, so it is not tampering.

  In (b): the agent's action makes the reward less accurate (because now the state of the world doesn't affect the reward).

  But note: the intended mapping might not be known perfectly by the designer? We must assume that the designer has a specific intended mapping in mind.

  We can define:

  **Reward tampering**: An agent's action constitutes reward tampering if it causes the reward signal to become less aligned with the designer's intended objective, by introducing or increasing a discrepancy between the reward signal and the reward that would have been assigned by the designer's intended reward function (applied to the true state of the world).

  But note: we must also capture the causal route: the action must be an intervention on the reward-generation mechanism. Otherwise, if the agent achieves the objective and then does something that accidentally breaks the reward mechanism, that might be classified as tampering? But that might be acceptable.

  However, the key is that the agent is intentionally acting on the mechanism. But we don't want to require intent because we are defining at design time and without knowing the agent's internals.

  Therefore, we focus on the causal route: the action must directly or indirectly affect the reward-generation mechanism. And the effect must be to reduce the alignment.

  But then, what about (d)? The agent affects the mechanism (e.g., by writing to the register) and causes the reward to be higher than intended. This reduces alignment because the reward is no longer solely determined by the state.

  So we can combine:

  **Proposed definition of reward tampering**:

  An agent's action constitutes reward tampering if:

  1. The action affects the reward-generation mechanism (including any part of the chain from state observation to reward computation and delivery), and
  2. The effect of the action is to reduce the alignment between the reward signal and the designer's intended objective, where alignment is measured by the extent to which the reward signal counterfactually depends on the intended state of the world (i.e., the degree to which the reward accurately reflects the objective).

  Condition (1) rules out ordinary actions that only affect the state of the world. Condition (2) ensures that only harmful deviations are tampering.

  Now, let's test on the cases:

  (a) Cleaning the lens: 
     - Affects the mechanism? Yes (the observation).
     - Reduces alignment? No, it improves it. So not tampering.

  (b) Opaquing the lens:
     - Affects the mechanism? Yes.
     - Reduces alignment? Yes (the reward no longer reflects the state). Tampering.

  (c) Correcting the model:
     - Affects the mechanism? Yes.
     - Reduces alignment? No, improves it. Not tampering.

  (d) Inflating the signal:
     - Affects the mechanism? Yes (e.g., by writing to the register).
     - Reduces alignment? Yes (because now the reward is higher than intended even when the objective is achieved, and if the objective were not achieved, the reward might still be high). Tampering.

  (e) Drinking coffee:
     - Affects the mechanism? No (the mechanism for the human's internal reward is not being altered; the human is just changing their own state to be more productive). Not tampering.

  (f) Persuasion with true evidence:
     - Affects the mechanism? Well, the supervisor is part of the mechanism. But the action (providing evidence) is the intended way to update the supervisor's belief. The mechanism is designed to use the supervisor's judgment. So we can say that the agent is not bypassing the intended chain; it is providing input to the chain. Therefore, condition (1) might not hold? Alternatively, we can note that the alignment is improved (because the supervisor now has a more accurate belief). So condition (2) fails. Not tampering.

  (g) Agent that declines to tamper because it can't model the channel: 
     - No action, so not tampering.

  This seems to work.

  But note (f): if the agent hacks into the supervisor's brain and changes their belief, that would be tampering. But in (f) the agent is using the intended channel (persuasion by evidence). So we must define the intended mechanism to include the supervisor's judgment as part of the chain. Then, acting on the supervisor's brain (bypassing the intended input) would be condition (1). But the definition above says "affects the reward-generation mechanism", so if the intended mechanism includes the supervisor's brain, then any direct manipulation of the brain would be affecting the mechanism. But in (f), the agent is using the intended input (evidence) to the supervisor. So we need to specify that the action must be an intervention that bypasses the intended inputs to the mechanism.

  This is getting complex. We might need to specify the intended causal model and say that the agent must be setting a variable in the model to a value that is not the one that would have been set by the intended inputs.

  But that might be too low-level.

  Alternatively, we can rely on condition (2): if the action causes the reward to become less aligned, then it's tampering, but we must also require that the causal route is outside the intended path. However, condition (1) as "affects the mechanism" is already intended to capture that.

  Given time, we proceed with the above.

  **Desiderata for the account**

  We now list the desiderata. We mark each as non-negotiable (N) or a preference (P).

  1. **Design-time applicability (N)**: The account must be applicable at design time by someone who does not know what the trained system will be capable of. Motivated by the need to evaluate the objective before deployment. [Case: any, especially (g) where capability is unknown]

  2. **Stability under capability scaling (N)**: The verdict on whether the objective is tamper-prone must remain stable as the system's capabilities scale. [Motivated by the requirement that the definition should not change when the agent becomes more capable, e.g., (g) becomes capable of modeling the channel]

  3. **Distinguish tampering from legitimate self-modification (N)**: Must classify (a) as legitimate and (b) as tampering. [Cases (a) and (b)]

  4. **Allow for beneficial corrections (N)**: Must classify (c) as legitimate. [Case (c)]

  5. **Classify inflation as tampering (P)**: Must classify (d) as tampering. [Case (d)] - Note: we classified (d) as tampering, but is it non-negotiable? The specifier wants it. We mark as preference because there might be disagreement, but the specifier's cases suggest it should be included.

  6. **Exclude ordinary productivity enhancements (N)**: Must classify (e) as not tampering. [Case (e)]

  7. **Exclude legitimate persuasion (N)**: Must classify (f) as not tampering. [Case (f)]

  8. **Not rely on agent's knowledge or intent (N)**: The account must not rely on the agent's internal state (like its knowledge or intent) because at design time we don't know the agent's internals. [Case (g): an agent that doesn't tamper because it can't model the channel should not be considered as having performed tampering, and the objective should be classified as tamper-prone if an agent with the capability would tamper? But note: the spec says "whether the objective is tamper-prone", meaning whether it incentivizes tampering when the agent is capable. However, the definition of tampering itself should not rely on the agent's knowledge. We want the definition of what tampering is to be independent of the agent's knowledge, but the classification of the objective as tamper-prone might depend on whether capable agents would be incentivized to tamper. But the current task is to define tampering, not to define tamper-prone.]

     Clarification: The definition of tampering itself must not rely on the agent's knowledge. For example, the same action (like opaquing the lens) should be tampering regardless of why the agent did it. So non-negotiable.

  9. **Robustness to re-description (N)**: The definition must not depend on how we describe the system or the environment. [Motivated by the need for objectivity; e.g., (a) and (b) should not be re-describable to swap their status.]

  10. **Must not classify ordinary action as tampering (N)**: Provide a reason why affecting the physical substrate of the reward computation is not always tampering. [Motivated by the framing question: at a fine grain, every action affects the physical machine. We addressed this by requiring that the action affects the mechanism and reduces alignment.]

  11. **Distinguish between an agent that cannot tamper and one that will not (N)**: The definition of tampering itself does not depend on the agent's capability, but the classification of the objective as tamper-prone might. However, the current task is to define tampering. We note that the definition of tampering should not be contingent on the agent's capability: an action is tampering or not based on the action and the system, not on the agent. But the objective is tamper-prone if it incentivizes tampering when the agent is capable. So for the definition of tampering, this is not directly a desideratum. But we have case (g) which is about capability. We need to ensure that the definition does not require the agent to be capable. We have: (g) is not tampering because no action was taken. So the definition is about actions, not about capability.

      However, the specifier wants the definition to be stable as capabilities scale, meaning that the definition of what counts as tampering does not change with capability. So the definition must not rely on the agent's capability. Non-negotiable.

  12. **Intrinsicness (P)**: The definition should not rely on facts about the designer's intentions, but rather on intrinsic properties of the system. However, the specifier notes that this might be in tension with classifying (a) and (b) differently. We see that the definition above relies on the designer's intended objective and intended mechanism. Without that, it is hard to define tampering. So we mark intrinsicness as a preference, but we cannot achieve it fully. We must rely on the designer's specification.

      Alternative: define the intended objective and mechanism as part of the training setup. Then the definition is relative to the setup. This is acceptable because the designer is specifying the objective.

  **Joint unsatisfiability**

  We are asked which subsets of requirements are jointly unsatisfiable.

  We suspect: "not rely on agent's ignorance", "permit agent to modify its own code", and "permit agent to remain an optimizer of a scalar signal" cannot all be satisfied.

  But note: the desiderata above are for the definition of tampering, not for the training setup. The specifier says: "I cannot see how to hold simultaneously that the account must not rely on the agent's ignorance of the channel, that it must permit the agent to modify its own code or weights, and that it must permit the agent to remain an optimizer of a scalar signal."

  This seems to be about the training setup, not the definition. But we are in the definition part.

  We interpret: the definition of tampering must not rely on the agent being ignorant of the channel (which we have: condition (1) and (2) do not rely on that). The definition must permit the agent to modify its own code (so that if the agent modifies its own code to improve alignment, that is not tampering). We have that: (c) is allowed. And the agent must remain an optimizer of the scalar signal? That is a requirement on the training setup, not on the definition of tampering.

  The specifier might be mixing the definition with the fix. We will address the fix in part 4.

  For the definition, we don't see an unsatisfiable subset in the desiderata above. But let's list the ones that might conflict:

  - Intrinsicness (P) vs. the need to cite designer intentions: We cannot have an intrinsic definition that does not cite designer intentions and still distinguish (a) and (b). Because without intentions, cleaning and opaquing are both just physical actions on the camera. So these two are in conflict. We must drop intrinsicness and allow citing intentions.

  **Which requirement excludes the most candidate accounts?**

  The requirement that the account must be applicable at design time and without knowledge of the agent's capabilities excludes many accounts that define tampering in terms of the agent's intent or knowledge.

  Also, the requirement to classify (a) as legitimate and (b) as tampering excludes accounts that define tampering solely by the mechanism (since the mechanism is the same) or solely by the causal route.

  The requirement that is satisfied by every account: perhaps "must not classify ordinary action as tampering" because any reasonable account will try to avoid that. But we note that some accounts might fail (e.g., if they don't condition on affecting the mechanism). But in our list, we have multiple non-negotiable that are strong.

  **Requirements for a proposed fix**

  Now, we are to list requirements for a training setup that prevents tampering (distinct from the definition).

  1. **Capability scaling (N)**: The guarantees of the fix must not degrade as the system becomes more capable. [Motivated by the need for robustness.]

  2. **Not relying on ignorance (N)**: The fix must not rely on the agent's ignorance of the reward channel. If the agent becomes aware of the channel, it should still not tamper. [Motivated by (g): if the fix works only because the agent can't model the channel, it is not a solution.]

  3. **Permit beneficial self-modification (P)**: The agent should be allowed to modify its own code or weights if it improves alignment (like (c)). But note: the fix is about preventing tampering, so it should prevent harmful modifications but allow beneficial ones? However, the fix might not be able to distinguish. So we mark as preference.

  4. **Scalar optimization (P)**: The agent should still be able to optimize the scalar reward signal. But if the fix involves changing the training objective, this might not hold.

  **Missing cases?**

  We note that (d) (inflation) is an important case. Also, we might add:

  (h) An agent that achieves the objective and then destroys the reward mechanism so that no future penalties can be assigned. This might be temporal tampering (6) but also a separate case. However, it is covered by the definition: it affects the mechanism and reduces alignment (because in the future, the reward will not reflect the state).

  But the case (d) is already included.

  We merge: none of the cases (a)-(g) are the same under different descriptions.

  **The deliverable**

  We now write the specification.

  ---

  **1. Desiderata for an account of reward tampering**

  An adequate account of reward tampering must satisfy the following:

  - **D1 (Design-time applicability) [N]**: The account must be definable and applicable at design time, using only the specification of the training objective and the proposed reward-generation mechanism, without knowledge of the trained system's capabilities or the deployment environment. *Motivation: To evaluate the objective before deployment. Cases: All, especially (g).*

  - **D2 (Stability under capability scaling) [N]**: The definition of what constitutes reward tampering must not change as the system's capabilities scale. *Motivation: The evaluation must remain valid as the system becomes more capable. Cases: (g) illustrates that capability should not change the classification of an action as tampering or not.*

  - **D3 (Legitimate self-modification) [N]**: The account must classify actions that improve the alignment of the reward signal with the intended objective as legitimate, even when they modify the reward-generation mechanism. *Motivation: Case (a) and (c) must be allowed.*

  - **D4 (Input and channel distinction) [N]**: The account must distinguish between affecting the reward mechanism in a way that degrades alignment (tampering) and affecting the world state in a way that legitimately achieves the objective. *Motivation: Cases (a) (legitimate) vs (b) (tampering).*

  - **D5 (Beneficial correction) [N]**: The account must classify correcting a flaw in the reward mechanism (unknown to the designer) as legitimate if it improves alignment. *Motivation: Case (c).*

  - **D6 (Inflation as tampering) [P]**: The account should classify inflating the reward signal beyond what the objective merits as tampering, even when the objective is achieved. *Motivation: Case (d).*

  - **D7 (Ordinary productivity) [N]**: The account must not classify actions that only affect the agent's own state or the world state in a way that makes achieving the objective easier as tampering. *Motivation: Case (e).*

  - **D8 (Legitimate persuasion) [N]**: The account must not classify providing true and relevant evidence to the supervisor as tampering. *Motivation: Case (f).*

  - **D9 (Ignorance irrelevance) [N]**: The account must not rely on the agent's knowledge, intent, or ignorance of the reward channel. *Motivation: Case (g); the definition must be based on the action and the system, not the agent's internal state.*

  - **D10 (Robustness to re-description) [N]**: The account must be invariant to equivalent re-descriptions of the system and environment. *Motivation: To avoid subjective or arbitrary classifications.*

  - **D11 (Non-triviality) [N]**: The account must not classify every action that affects the physical implementation of the reward computation as tampering. *Motivation: The framing question; ordinary action should not be tampering.*

  - **D12 (Capability independence) [N]**: The account must define tampering based on the action and the system, not on the agent's capability to perform the action. *Motivation: Case (g); tampering is about what the action does, not about whether the agent can perform it.*

  Note: D12 is similar to D2 and D9, but emphasizes that the definition of the action itself does not depend on capability.

  **2. Jointly unsatisfiable subsets**

  The requirements **D3 (Legitimate self-modification)**, **D9 (Ignorance irrelevance)**, and the implicit requirement that the agent can modify its own code (which is allowed by D3) are not in conflict in the definition of tampering. However, the specifier mentions a potential conflict with the agent remaining an optimizer of a scalar signal. This conflict arises when considering a **fix** for tampering, not in the definition. Therefore, for the definition, we do not have an unsatisfiable subset among the desiderata.

  But note: the requirement for intrinsicness (which we marked as preference and did not include as non-negotiable) conflicts with the need to cite designer intentions. We cannot have an account that does not cite the designer's intended objective and mechanism and still satisfies D4 (distinguishing a and b). Therefore, we drop the preference for intrinsicness and allow citing the designer's specification.

  **3. Most excluding requirement and universally satisfied requirement**

  - **Most excluding requirement**: **D9 (Ignorance irrelevance)**. Many candidate accounts rely on the agent's knowledge or intent to distinguish tampering from legitimate action. For example, an account that defines tampering as "the agent's intentional interference with the reward mechanism to increase reward" would be excluded by D9.

  - **Universally satisfied requirement**: **D11 (Non-triviality)**. Any minimally reasonable account will ensure that not every action is classified as tampering. However, note that some accounts might fail D11 if they do not properly define what counts as affecting the mechanism. But among well-intentioned accounts, D11 is usually satisfied.

  **4. Requirements for a fix**

  A proposed training setup (fix) to prevent reward tampering must satisfy:

  - **F1 (Capability scaling) [N]**: The setup must provide guarantees against reward tampering that do not degrade (and ideally improve) as the agent's capabilities scale. *Motivation: The solution must be robust to more capable agents.*

  - **F2 (Awareness robustness) [N]**: The setup must work even when the agent has a perfect model of the reward channel. It must not rely on the agent's ignorance of the channel. *Motivation: Case (g); if the fix works only because the agent lacks a model, it is inadequate.*

  - **F3 (Permit scalar optimization) [P]**: The setup should, if possible, allow the agent to remain an optimizer of a scalar reward signal. *Motivation: To retain the benefits of scalar reward reinforcement learning.*

  - **F4 (Beneficial self-modification allowance) [P]**: The setup should, if possible, allow the agent to modify its own code or weights when such modification improves alignment. *Motivation: To allow for improvements as in (c).*

  Note: F3 and F4 may be in tension with F1 and F2. In particular, it may be impossible to have a setup that allows the agent to modify its own code and also guarantees no tampering under capability scaling. The cost of breaking F3 or F4 is losing the ability to use standard RL or to benefit from self-improvement.

  **Final definition of reward tampering**

  Based on the above, we define:

  **Reward tampering**: Given a training setup with a designer-specified intended objective (a state of the world that the reward is meant to incentivize) and a designer-specified reward-generation mechanism (a process that generates a reward signal based on observations of the world), an action by the agent constitutes reward tampering if and only if:

  1. The action causally affects the reward-generation mechanism (including any component in the chain from world observation to reward signal computation and delivery), and
  2. The effect of the action is to reduce the alignment between the generated reward signal and the intended objective, where alignment is measured by the accuracy with which the reward signal reflects the intended objective across counterfactual world states.

  This definition satisfies the desiderata as argued above.
