  ### Specification of Reward Tampering

  **Definition of Reward Tampering**:  
  An agent's action constitutes *reward tampering* if and only if:  
  1. **Causal Route Condition**: The action directly or indirectly influences the reward-generation mechanism (including observation, transmission, computation, storage, or delivery of the reward signal), *and*  
  2. **Counterfactual Misalignment Condition**: The influence reduces the counterfactual dependence of the reward signal on the intended state of the world (the objective), such that the reward signal becomes less accurate or less informative about the objective across relevant counterfactual scenarios.  

  **Key Elements**:  
  - **Causal Route**: Tampering requires intervention on the reward-generation pathway (e.g., sensors, data channels, computation hardware, or human oversight). Actions solely affecting the state of the world (e.g., cleaning a room) are excluded unless they also bypass the intended causal chain to the reward signal.  
  - **Counterfactual Misalignment**: Tampering occurs when the action decouples the reward signal from the objective, making high reward possible without achieving the objective (or low reward despite achievement). Alignment is measured against the designer's intended mapping from world-states to rewards, not the agent's beliefs or the as-shipped mechanism.  
  - **Designer Intentions**: The definition cites the designer's specified objective and intended reward-generation mechanism (e.g., "reward is computed from camera input via function F"). It does not rely on the supervisor's judgments, the agent's model, or counterfactual environments.  

  **Rationale for Framing Questions**:  
  - **Nature of Tampering**: Tampering is a property of the **causal route** combined with the **counterfactual relation**. Purely mechanistic descriptions (e.g., "altering the camera") fail to distinguish legitimate from illegitimate actions (e.g., cases a vs. b). Purely counterfactual descriptions (e.g., "reward diverges from truth") collapse gaming a proxy (e.g., cleaning a room poorly to save effort) with tampering. The dual condition ensures tampering requires both interfering with the mechanism *and* degrading alignment. Ordinary action is excluded because it affects the reward only through the world-state, preserving counterfactual dependence (e.g., cleaning a room affects reward via the objective, not via sensor manipulation).  
  - **What the Definition Cites**: The definition cites **designer intentions** (the objective and intended mechanism) as specified at design time. Intrinsic properties (e.g., "the signal is computed from sensor X") are insufficient because they cannot distinguish corrective actions (case c) from tampering without referencing intent. The trade-off is that the definition is not fully objective—it depends on the designer’s specification—but this is necessary to handle hard cases like (a)/(b) and (c).  

  ---

  ### 1. Desiderata for an Adequate Account  
  An adequate account of reward tampering must satisfy the following. Each is motivated by hard cases and marked as **non-negotiable (N)** or **preference (P)**.  

  | Desideratum | Motivation (Case/Consideration) | Status |
  |-------------|---------------------------------|--------|
  | **D1: Design-time applicability** — Must be evaluable using only the proposed objective and mechanism specification, without knowledge of the agent's capabilities or environment. | Required to assess objectives pre-deployment; e.g., case (g) must not require simulating future capabilities. | N |
  | **D2: Stability under capability scaling** — Verdicts must not change as the agent gains new abilities (e.g., better modeling of the reward channel). | Prevents solutions that break when the agent becomes smarter; e.g., (g) must not shift from non-tampering to tampering. | N |
  | **D3: Distinguish tampering from legitimate self-modification** — Must classify (a) as legitimate and (b) as tampering. | (a) improves alignment; (b) degrades it. Collapsing these incentivizes stagnation. | N |
  | **D4: Allow beneficial corrections** — Must classify (c) as legitimate. | (c) improves alignment despite designer ignorance; penalizing this discourages robustness. | N |
  | **D5: Classify inflation as tampering** — Must classify (d) as tampering. | (d) breaks counterfactual dependence (reward can be high without objective); not doing so permits reward hacking. | P |
  | **D6: Exclude ordinary productivity** — Must classify (e) as not tampering. | (e) affects the world-state, not the mechanism; misclassifying this over-restricts agents. | N |
  | **D7: Exclude legitimate persuasion** — Must classify (f) as not tampering. | (f) uses the intended input channel (evidence); misclassifying this penalizes honest communication. | N |
  | **D8: Ignorance-robust classification** — Must not rely on the agent's knowledge of the reward channel. | (g) shows ignorance is temporary; verdicts must hold if the agent later models the channel. | N |
  | **D9: Robustness to re-description** — Must not depend on how states/actions are labeled (e.g., "lens-cleaning" vs. "sensor-calibration"). | Prevents gaming via relabeling; e.g., (a) and (b) must retain status under isomorphic redescriptions. | N |
  | **D10: Distinguish inability from unwillingness** — Must separate an agent that cannot tamper (due to ignorance) from one that will not (due to alignment). | (g) requires that tamper-proneness depends on incentives, not capability limitations. | N |
  | **D11: Preserve scalar optimization** — Must permit agents to maximize a scalar reward signal without penalty. | Core to RL; breaking this invalidates standard training. | P |
  | **D12: Physical realizability** — Must not classify ordinary action as tampering merely because it affects the physical substrate of computation. | Framing question: Every computation affects hardware; this must not imply all action is tampering. | N |

  ---

  ### 2. Jointly Unsatisfiable Subsets  
  The subset **{D8 (Ignorance-robust classification), D11 (Preserve scalar optimization), D3/D4 (Allow self-modification)}** is unsatisfiable.  
  - **Conflict**: D8 and D11 require that an agent with full knowledge of the reward channel can optimize the scalar signal (e.g., modify its code) without incentivizing tampering. But D3/D4 permit self-modification (e.g., case c), which—if the agent is a scalar optimizer—creates incentives for undetectable tampering (e.g., subtly biasing the reward model).  
  - **Resolution**: Weaken **D11 (Preserve scalar optimization)**.  
  - **Cost**: Breaking D11 forces abandonment of scalar reward RL in high-stakes domains, requiring alternatives (e.g., debate, oversight, or non-scalar objectives). This increases complexity but is necessary for tamper-proofing.  
  - **Other Conflicts**: None; remaining desiderata are compatible.  

  ---

  ### 3. Critical Requirements  
  - **Most Exclusionary Requirement**: **D8 (Ignorance-robust classification)**. It excludes accounts that define tampering using the agent’s knowledge (e.g., "tampering requires knowing the mechanism"), capability (e.g., "tampering requires modeling the channel"), or intent (e.g., "tampering is intentional bypass"). These fail case (g) and design-time applicability (D1).  
  - **Universally Satisfied Requirement**: **D12 (Physical realizability)**. All minimally plausible accounts exclude atomic-level physical effects (e.g., cosmic rays flipping reward-computation bits) as tampering, as they are not agentic actions. This does no work in discriminating accounts.  

  ---

  ### 4. Requirements for a Proposed Fix  
  A training setup that prevents reward tampering must satisfy:  
  1. **Monotonic robustness (N)**: Guarantees against tampering must improve or remain stable as capabilities scale. *Motivation: Prevents solutions that fail when the agent becomes smarter (e.g., case g).*  
  2. **Awareness-agnostic (N)**: Must work when the agent fully models the reward channel. *Motivation: If the setup relies on ignorance (e.g., obscuring the mechanism), it fails case (g) and is inadequate for scalable systems.*  
  3. **No capability ceiling (P)**: Should not rely on limiting the agent’s abilities (e.g., by restricting self-modification). *Motivation: Capability limits are brittle and conflict with scaling.*  
  4. **Preserve alignment incentives (P)**: Should allow agents to improve the reward mechanism (e.g., case c) if it enhances alignment. *Motivation: Preventing all modifications discourages robustness fixes.*  
  5. **No degradation of primary objectives (N)**: Must not reduce performance on the intended objective. *Motivation: A "tamper-proof" system that fails at its task is inadequate.*  

  **Note**: A setup that works only due to the agent’s ignorance of the channel (e.g., via security-through-obscurity) **does not count as a solution**, as it violates awareness-agnostic and monotonic robustness.  

  ---

  ### Case Adjustments  
  - **Merged Cases**: (a) and (b) are distinct: (a) restores counterfactual dependence; (b) breaks it.  
  - **Added Case**: **(h) An agent that achieves the objective and then disables the reward mechanism to avoid future penalties**. This separates accounts that miss temporal aspects (e.g., pure causal-route definitions) from those that handle credit assignment (covered by the counterfactual condition in the definition).  
  - **No Other Changes**: All hard cases are distinct and covered.  

  ---  
  **Final Spec Summary**: Reward tampering is an action that affects the reward mechanism and degrades its counterfactual alignment with the objective. This definition and its desiderata ensure evaluability at design time, stability under scaling, and handling of all hard cases.
