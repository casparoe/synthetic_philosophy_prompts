prompt: |-
  I've got a slightly odd one and I'm not even sure it's philosophy, so tell me to sod off if it isn't.

  I maintain the knowledge model for an incident-review tool at work. It ingests a pile of maintenance records and then has to answer questions like "did anyone on the ops team know, on 4 March, that the pressure valve was out of spec?" So it keeps track of what various people are on record as knowing, and then answers queries about that. Two things keep happening, and they feel like the same sort of thing pointing in opposite directions, and I need a word for whatever it is.

  Undershooting. The store will happily chain a long run of conditionals — A brings about B, B brings about C, all the way out to K — so long as every step uses the same expression for the same thing. But it comes apart the moment a step requires noticing that two descriptions pick out the same thing. It has that the badge issued at 06:40 on the 4th was used to open the pump room. It has that the badge issued at 06:40 on the 4th was Okonjo's. Ask it "did Okonjo enter the pump room?" and you get *unknown*, not no — as if the question had never been put. There are only three links. It isn't the length. It's the identity in the middle. And it's not a synonyms thing: "the badge issued at 06:40" isn't slang for Okonjo, and the model has both. Nor is it generality — give it "every valve in bay 3 was re-certified on 12 March" plus "this is a valve in bay 3" and it's fine. Strangely, ask "was the pump room opened by anybody?" and it says yes; it's only once Okonjo's name is in the question that it dries up.

  Overshooting, meanwhile, goes the other way. Ask whether any component was run outside spec that week and it comes back confident, because for each component it has no row saying there was a problem, and the absence of a row is being treated as a fact and then generalised over. Nobody told it the records were complete. One of our data people says that's just the closed-world assumption and can be configured off, but that's an answer about how the query engine behaves, and what I want to know about is what the person in the system can be said to know.

  So: is there an established concept for this pair, or for whatever the single thing underneath both is? And are they really one thing? My guess is the interesting bit is that the failures don't line up where you'd expect — it isn't that the model is too slow or too small to derive hard things (it does long derivations fine), it's that it's shut on one axis and wide open on another, and the axis is about re-description rather than effort. But I've not been able to work out whether that's a real distinction or whether I'm inventing one.

  Please don't just hand back a label. I want to know what the thing is, what it isn't, what the nearest few established notions are and precisely how my cases sit against each — including the ones that sound right but aren't — and, for whichever fits best, a case that falls just on the wrong side of the line so I can see the edge. If there genuinely isn't an established concept, say so and coin one, with a definition and a boundary case. A few paragraphs of discussion first, and then the table.

  Table, one row per candidate you canvass (established or invented), columns in this order:

  - `candidate` — the name
  - `home_field` — the area it normally belongs to, one phrase
  - `covers_undershoot` — fits / partly / no, against the identity-link failure above
  - `covers_overshoot` — fits / partly / no, against the no-row-means-fine failure
  - `where_it_misfits` — one sentence: the respect in which it breaks against my cases
  - `verdict` — keep / reshape / drop

  If you end up coining something, give it its own row and use `where_it_misfits` for the nearest thing it could be confused with.
reasoning: |-
  Okay, let me tackle this user's query. They're dealing with a knowledge model for an incident-review tool that has two distinct but seemingly related issues. The first is undershooting: the model fails to connect equivalent descriptions (like a badge and its owner) in inference chains. The second is overshooting: it treats absence of records as evidence of non-existence, making overconfident generalizations. The user wants to know if there's an established concept that explains both.

  Starting with undershooting, this reminds me of referential opacity in philosophy of language. Quine's example with "Hesperus is Phosphorus" comes to mind—knowing one doesn't imply knowing the other. But does that apply here? The model knows both descriptions but fails to link them for inference. That feels more like a limitation in the inference engine's ability to handle co-referential terms. So maybe referential opacity captures part of it, but not fully.

  Then there's overshooting. The closed-world assumption (CWA) from knowledge representation seems relevant. CWA assumes all relevant facts are known, so absence implies negation. The user mentions their data team suggested this, but the user is concerned about what the system can genuinely claim to know. This ties into epistemic closure—knowing P should imply knowing Q if Q logically follows, but only if the system has the necessary information and inference rules. However, CWA might be causing overconfidence here.

  Is there a unifying concept? Epistemic granularity comes to mind—the system's knowledge is fragmented. It handles specific descriptions but doesn't integrate them. For undershooting, it lacks the inferential bridge to connect different terms referring to the same entity. For overshooting, it incorrectly assumes its knowledge base is complete. Both stem from how the system manages the scope and integration of its knowledge.

  Looking at other concepts, the open-world vs. closed-world distinction in semantic web technologies might fit. But the user wants to understand the underlying epistemological issue. Semantic underspecification relates to how terms are defined, but here the problem is the system's failure to recognize identity, not ambiguity. Logical omniscience is the opposite—assuming the system knows all consequences, but here it's underinferring in some cases and overinferring in others.

  Perhaps a new term like "referential fragmentation" could capture the undershoot issue, where knowledge is siloed by description. For overshoot, "epistemic overclosure" combines closed-world assumption with the system's unjustified confidence. The core issue might be mismatches between the model's representational granularity and real-world inference needs.

  In the table, I'll compare these candidates. Referential opacity fits undershoot partly but not overshoot. CWA fits overshoot but not undershoot. Epistemic granularity as a coined term might cover both: undershoot due to failure to integrate descriptions, overshoot due to misaligned completeness assumptions. The boundary case would be when descriptions differ but logically connect without identity, like functional relationships.

  I should also note cases where these don't apply. For instance, if the system had explicit rules linking badge and owner, the undershoot wouldn't occur. Similarly, if the knowledge base explicitly stated incompleteness, overshoot might be avoided. The key is the system's implicit handling of identity and completeness without explicit logical rules.
answer: |-
  Your query is profoundly philosophical—it engages epistemology (theories of knowledge), philosophy of logic, and conceptual modeling. The core issue is **how a knowledge representation system handles *inferential gaps* arising from re-description and epistemic closure**. Undershooting stems from the system's inability to *integrate equivalent references* into its inferences; overshooting arises from unjustified *assumptions about knowledge completeness*. These are two facets of a single underlying problem: **the system’s failure to align its *representational granularity* with the *inferential requirements* of real-world queries**. It knows facts but cannot always "see" them under relevant descriptions or recognize the limits of its perspective.

  ### Core Philosophical Analysis
  1. **Undershooting (Identity Failure)**  
     This is a failure of **referential transparency** or **Leibniz's Law** in inferential contexts. The system knows `badge-0640 ≡ Okonjo's badge` and `badge-0640 opened pump room`, yet cannot conclude `Okonjo opened pump room`. It treats knowledge as *opaque* to substitutions of co-referential terms. This mirrors **Frege's distinction between *sense* and *reference***: the system grasps the reference (the badge) but cannot traverse different senses ("badge issued at 06:40" vs. "Okonjo's badge"). It’s *not* about computational complexity (as chains of conditionals work) but about **inferential disconnection between equivalent descriptions**.

  2. **Overshooting (Completeness Failure)**  
     This reflects an **unjustified epistemic closure assumption**. The system treats *absence of evidence* (no record of a problem) as *evidence of absence* (no problem exists). While technically a **Closed-World Assumption (CWA)** in databases, epistemologically it’s a fallacy: the system claims knowledge it cannot justify. Crucially, it *overgeneralizes* from local data to global truths without recognizing its epistemic boundaries.

  3. **The Unifying Problem: Epistemic Granularity**  
     Both failures arise from **misalignment between the system’s representational resolution and the demands of inference**.  
     - *Undershooting*: Knowledge is fragmented across descriptions; the system lacks rules to unify them inferentially.  
     - *Overshooting*: Knowledge boundaries are underspecified; the system assumes its data exhausts reality.  
     The "axis" you identify—**re-description rather than computational effort**—is key. The system handles *deduction under fixed descriptions* but fails at *conceptual integration* (undershoot) and *epistemic humility* (overshoot).

  ### Candidate Concepts Evaluated
  Below is a table comparing established ideas and a coined term. Candidates are ordered by fit.

  | candidate               | home_field               | covers_undershoot | covers_overshoot | where_it_misfits                                                                 | verdict   |
  |-------------------------|--------------------------|-------------------|------------------|----------------------------------------------------------------------------------|-----------|
  | **Epistemic Granularity** (coined) | Knowledge representation | fits              | fits             | Could be confused with semantic underspecification; this specifically addresses resolution mismatches in inferential access. | **keep**  |
  | Referential Opacity     | Philosophy of language   | partly            | no               | Focuses only on failure of substitutability (undershoot), ignores overshoot’s completeness issues.             | reshape  |
  | Closed-World Assumption | Database theory          | no                | fits             | Explains overshoot but treats it as a feature, not a flaw; ignores undershoot’s identity-linking failure.      | reshape  |
  | Logical Omniscience     | Epistemic logic          | no                | no               | Describes systems that know *all* consequences of their knowledge; yours *under*-infers in undershoot.        | drop     |
  | Semantic Underdetermination | Philosophy of science | partly            | no               | Addresses ambiguity in representations, but undershoot is about failure to *use* unambiguous identity links. | drop     |
  | Epistemic Closure       | Epistemology             | no                | partly           | Focuses on justification for belief preservation; overshoot violates closure by over-extending justification. | reshape  |

  ### Explanations & Boundary Cases
  1. **Epistemic Granularity** (coined)  
     - **Definition**: *The resolution at which a knowledge system represents entities and properties, and its capacity to traverse descriptions inferentially without overgeneralizing epistemic scope.*  
     - **Fits both**:  
       - *Undershoot*: Failure occurs when identical references are represented at incompatible granularities (e.g., badge-as-token vs. badge-as-property-of-Okonjo).  
       - *Overshoot*: Assumes granular data exhausts coarse-grained reality (e.g., "no cell in this table is false" → "no valve was faulty").  
     - **Boundary case**: If the system *explicitly* links Okonjo to the badge via a rule (e.g., `∀x [badge(x, Okonjo) → action(x) ≡ action(Okonjo)]`), undershoot disappears. If it *explicitly models data completeness* (e.g., "sensor coverage: 70%"), overshoot is mitigated.  
     - **Why not semantic underspecification?** Your system *has* the identity data; the issue is inferential, not representational ambiguity.

  2. **Referential Opacity**  
     - **Home field**: Philosophy of language (Quine).  
     - **Fits undershoot partly**: In opaque contexts (e.g., "knew that the badge opened the door"), substituting "Okonjo's badge" may not preserve truth if the agent doesn’t know the identity.  
     - **Misfit**: Your system isn’t modeling *agent beliefs* but *recorded facts*. The opacity is in the *inference engine*, not the epistemic state.  
     - **Boundary**: If the question was "Did Okonjo *know* she opened the pump room?", opacity would directly apply. Your case is ontological ("did she enter?"), not doxastic.

  3. **Closed-World Assumption (CWA)**  
     - **Home field**: Database/Knowledge representation.  
     - **Fits overshoot**: CWA assumes unlisted facts are false.  
     - **Misfit**: CWA is a design choice; your critique is epistemological (justification of knowledge claims). Turning off CWA prevents overshoot but doesn’t *explain* why it was flawed.  
     - **Boundary**: If records were guaranteed complete (e.g., "all valve checks logged in real-time"), CWA would be justified. Your system lacks this guarantee.

  4. **Logical Omniscience**  
     - **Home field**: Modal logic (e.g., possible worlds semantics).  
     - **Fits neither**: Omniscience assumes agents know *all* logical consequences of their beliefs. Your system *under*-infers (undershoot) and *over*-generalizes (overshoot)—the opposite problem.  
     - **Why drop?** This describes an idealized epistemic state, not your system’s inferential gaps.

  5. **Epistemic Closure**  
     - **Home field**: Theory of knowledge (e.g., if S knows P and P entails Q, does S know Q?).  
     - **Fits overshoot partly**: The system "closes" knowledge unjustifiably (no record → no problem).  
     - **Misfit**: Closure focuses on *preservation* of knowledge across entailment; undershoot is a failure of *acquisition* via re-description.  
     - **Boundary**: If "valves were monitored continuously" was known, closure would justify "no record → no fault".

  ### Conclusion
  **Epistemic granularity** best captures your dual problem. It highlights the mismatch between how finely the system carves reality (e.g., badges as distinct from their owners) and what inferences it can draw across those representations. Undershooting occurs when granularity prevents reference-traversal; overshooting when granular data is mistaken for exhaustive knowledge. 

  **Practical implications**: To fix undershoot, add inference rules for *identity bridging* (e.g., `same_reference(X,Y) → (property(X) ↔ property(Y))`). For overshoot, implement **explicit completeness metadata** (e.g., "this table covers 90% of valves; unknown for others"). This shifts the system from brittle chains to context-aware reasoning. Your instinct about "re-description" was precise—the failures are epistemic, not computational.
