prompt: |-
  I convene a third-year seminar in philosophy of economics, and I am writing its final paper. The students have worked through choice theory as far as expected utility, and they have read the two objections to revealed preference theory that anyone can recite: that observed choices are the product of preferences and beliefs together, and that a preference defined as whatever rationalizes behaviour cannot bear the weight welfare economics places on it. I want one essay question that cannot be passed by restating either of those.

  The subject is not merely professional for me this term. My wife and I are completing the application for our daughter's primary school place. The form asks each family to rank six schools; it pre-loads a "suggested" six, produced by an algorithm trained on the submissions of families with similar postcodes and similar histories; a family can search for and add others, but very few do. The local authority's consultation paper then proposes to treat those rankings as evidence of what families "really" value in a school — attainment, journey time, pastoral quality — in order to decide which schools to expand. I have been arguing with my own brother-in-law about whether our ranking will show anything at all about what we want.

  Please build the question around that kind of case: an institution inferring values from choices where the menu offered is itself a function of earlier choices, and where choosers know that what they can get depends on what they rank. The crux I want students to have to face is whether the rationalizability result we have been using — that, given the domain assumptions in the lecture notes, choices satisfying the weak axiom (never choosing X when Y was available, and Y when X was available) are exactly the choices representable as maximizing one fixed ordering — so much as applies when the sequence of menus is not fixed independently of the chooser's behaviour; and then, separately, whether an ordering recovered under those conditions could serve as a measure of the thing the institution cares about. I want the identification problem first, and then the question of which job "utility" is being asked to do: representing choice, measuring well-being, or furnishing an interpersonal currency for policy.

  Please supply: the question itself, with sub-parts and marks (25 total, forty-five minutes, closed-book, answerable without citing a single author — marks for the moves, not for names); a model answer of no more than 450 words; and a marking scheme organised around five must-hit moves, with the marks each is worth and one line on the characteristic way a candidate gets it wrong, followed by a sentence on where the A/B boundary falls. Have the question also force an answer to the exasperated objection that choices are all we can ever have, so that a "real" preference no possible behaviour could contradict is idle and policy should use the choice data anyway. I would also like them asked what pattern in the data would diagnose the problem — I have in mind something like a test that re-randomises which schools are suggested. Keep the whole response under 1,000 words.
reasoning: |-
  Okay, the user is a philosophy of economics professor designing a final exam question. They want to move beyond standard revealed preference critiques (preference-belief entanglement and normative weight) using a personal case study about school rankings. 

  Hmm, their case is rich: algorithmic pre-loading of school options creates a feedback loop where choices shape future menus, and choosers know their rankings affect allocation outcomes. That immediately destabilizes the standard rationalizability assumptions. 

  The professor's unspoken needs shine through: they're frustrated with rote answers ("anyone can recite" the two objections) and want students to grapple with real-world policy dilemmas. There's personal urgency too - this isn't abstract when your daughter's school application is involved. 

  Breaking this down: First, the identification problem - can we isolate preferences when menus are endogenous? Standard WA requires fixed independent menus. Here, suggested schools depend on past choices, creating path-dependence. Second, even if we recover an ordering, is it measuring welfare or just strategic behavior? The brother-in-law argument suggests rankings reflect expectations of admission chances, not pure preferences. 

  For the exam question, I'll need to: 
  1) Force analysis of WA's domain assumptions crumbling 
  2) Distinguish revealed choice from welfare 
  3) Tackle the "but we have no better data" objection head-on 
  4) Include a diagnostic test (like randomizing suggestions) as they requested 

  The marking scheme must penalize students who just parrot the two classic objections. Five key moves: (a) identifying menu endogeneity, (b) showing WA fails without fixed domains, (c) separating strategic vs welfare motives, (d) rebutting the "all we have" claim by showing the data may be corrupted, (e) proposing a randomization test. 

  Model answer will be tight - 450 words means cutting all flourishes. Must show: The recovered "preference" here confounds true values with beliefs about the system. When choosers know rankings affect outcomes (e.g., ranking safe options higher), the ordering becomes a bidding strategy, not a welfare measure. 

  Boundary for A/B: Clear distinction between identification failure (can't recover preferences) vs normative failure (recovered ordering isn't welfare) gets the A. Confusing them leans B. 

  ...And all under 1000 words. Time to compress like a ZIP file.
answer: |-
  **Essay Question (Total: 25 marks; Time: 45 minutes)**

  The City Council uses an algorithm to pre-load a "suggested" list of six primary schools onto each family's application form, based on the postcode and historical choices of similar families. Families can search for and add other schools, but very few do. The Council then treats the submitted rankings (over the final list of schools each family considers) as evidence of the families' underlying values (e.g., academic attainment, journey time, pastoral quality) to inform school expansion decisions.

  1.  **Identification Problem (12 marks):** Explain why it might be impossible to recover a single, fixed preference ordering over *all possible schools* for a family from their observed ranking choices in this specific system. Focus on how the system violates key assumptions behind the standard rationalizability result (that choices satisfying the Weak Axiom of Revealed Preference over a fixed, independently defined domain of options reveal a single underlying ordering). Consider the role of the algorithm and the family's awareness of the allocation mechanism.
  2.  **Interpretation Problem (8 marks):** Suppose the Council *could* recover a consistent preference ordering for a family based *only* on their choices within this specific system. Argue why this recovered ordering might *not* be a reliable measure of: (a) the family's underlying welfare (what is "best" for them), or (b) the values the Council wants to measure (like attainment, journey time) for policy purposes.
  3.  **Diagnostic & Policy Response (5 marks):** (a) What specific pattern in the *aggregate* ranking data might suggest that the Council's inference of values is flawed due to the system's design? (b) A critic argues: "Choices are the only objective data we have. The idea of a 'real' preference that can't be contradicted by behaviour is useless for policy. We should use the choice data we get." How would you respond, drawing on your analysis above?

  **Model Answer (Approx. 420 words):**

  **(1) Identification Problem:** The standard rationalizability result assumes choices are made over a fixed, exogenously given domain of options, independent of the chooser's past behaviour or beliefs about the system. Here, this assumption fails crucially. The *menu* each family faces (the pre-loaded suggestions) is *endogenous* – it is generated by an algorithm heavily influenced by the *historical choices* of similar families. This creates path-dependence: the options presented depend on prior revealed choices within the same system. Furthermore, families know their ranking *influences* the allocation outcome (e.g., ranking a popular school low might increase the chance of getting a less preferred but "safer" option). Their submitted ranking is thus a *strategic choice* based on beliefs about admission chances and the algorithm, not solely a revelation of underlying preferences over schools *in isolation*. Choices satisfy WA only over the *specific, algorithmically influenced menu* they face in a given year, not over a stable, universal domain. The system doesn't provide choices over fixed, independently defined sets necessary to recover a single, context-independent preference ordering over all schools. The "preference" revealed is contingent on the specific suggestion mechanism and the family's strategic response.

  **(2) Interpretation Problem:** Even if a consistent ordering *within the system* could be recovered (e.g., family A always ranks X>Y>Z on their suggested list), it is unreliable. (a) For **welfare**: The ranking reflects *expected utility* given beliefs about admission chances and the constrained menu, not necessarily the utility derived purely from school attributes. A family might rank a less-preferred but attainable school higher ("safe choice") than a preferred but scarce school they believe they won't get, misrepresenting their true welfare ordering. (b) For **Council Values**: The Council wants to know how families value specific *attributes* (attainment, journey time). However, the recovered ordering conflates attribute preferences with: (i) *Availability/Beliefs*: Schools not suggested are rarely ranked, not necessarily because they are less valued, but because they are unknown or believed unavailable. (ii) *Strategic Behaviour*: Rankings are influenced by perceived competition/scarcity, not pure attribute valuation. The ordering reflects a complex mix of preference, belief, and strategy, not a clean measure of the target values.

  **(3) Diagnostic & Policy Response:** (a) A key diagnostic pattern would be **significant divergence in ranking behaviour or stated satisfaction** between families who received *different suggested lists* (e.g., via random assignment in a trial) but who otherwise have similar characteristics and underlying preferences. If suggestions heavily constrain final choices, values inferred from choices would vary arbitrarily based on the initial algorithmic suggestion, revealing the inference's instability. (b) **Response to Critic:** While choices are vital data, this system risks generating *corrupted* choice data. If choices are heavily shaped by endogenous menus and strategic incentives, they cease to be reliable signals of underlying values or welfare. Using them uncritically for policy (like expanding schools assumed popular based on rankings) could be actively misleading and inefficient. We need better data (e.g., controlled experiments like diagnostic (a), surveys) or system redesign to elicit information less contaminated by the process itself. "Revealed preference" requires revelation, not distortion.

  ---

  **Marking Scheme (Total: 25 marks)**

  **Must-Hit Moves & Marks (Characteristic Errors in Parentheses):**

  1.  **Menu Endogeneity & Path-Dependence (WA Domain Assumption Violation): (5 marks)** *Identifies that the menu (suggested schools) is not fixed/exogenous but determined by past choices (algorithm input) and thus violates the fundamental domain assumption for standard revealed preference/rationalizability.*  
      *   *(Error: Treats the menu as fixed; ignores the algorithm's role in creating the menu based on history.)*
  2.  **Strategic Choice vs. Pure Preference Revelation: (4 marks)** *Explains that the family's ranking is influenced by beliefs about admission chances and the need to strategize within the constrained/biased menu, not just underlying preferences over school attributes.*  
      *   *(Error: Assumes ranking directly equals preference without considering strategic incentives/expectations.)*
  3.  **Distinguishing Recovered Ordering from Welfare & Target Values: (5 marks)** *Clearly argues that even a consistent system-specific ordering fails as a welfare measure (due to strategic safe choices/mismatch with true 'best') AND fails as a measure of the Council's target values (due to conflation with availability/beliefs/strategy, not pure attribute weighting).*  
      *   *(Error: Conflates welfare and target values; assumes recovered ordering must reflect one or the other adequately; fails to separate strategic influence from attribute preference.)*
  4.  **Proposing a Valid Diagnostic Pattern: (3 marks)** *Identifies that comparing choices/outcomes under *randomly varied suggestions* for similar families would test if the suggestions unduly constrain choices/values inference.*  
      *   *(Error: Suggests vague patterns like "inconsistency" without linking to the specific mechanism; suggests surveying *without* connecting it to diagnosing the menu influence.)*
  5.  **Effective Rebuttal to "Choices are all we have": (5 marks)** *Concedes the importance of choice data BUT argues convincingly that *in this specific system*, the data is corrupted (endogenous menus, strategic behaviour) and thus unreliable for inferring the target concepts (true values/welfare), potentially leading to bad policy; suggests need for better data or system redesign.*  
      *   *(Error: Dismisses choice data entirely; accepts the critic's point uncritically; rebuttal doesn't specifically address how *this system* corrupts the data.)*

  **A/B Boundary: (3 marks for structure/clarity)**  
  *   **A (21+):** Hits all 5 moves clearly and accurately. Demonstrates deep understanding of how the system breaks standard RP assumptions and corrupts the data. Rebuttal is forceful and specific. Answer is well-structured and concise.
  *   **B (17-20):** Hits most moves (likely missing nuances in Move 3 or 5) but with minor errors/omissions or less clarity. May identify the main problems but lack depth in explaining *why* they break RP (e.g., mentions strategy but not WA domain) or the rebuttal may be weaker. Structure is adequate.
  *   **C (13-16):** Identifies some issues (e.g., menu constraint, strategy) but misses key connections (e.g., to WA domain, path-dependence, clear distinction welfare vs. values). Rebuttal is superficial. Diagnostic may be weak/missing. Significant omissions or errors in applying concepts.
  *   **D (9-12):** Only addresses surface issues, heavily relies on the two standard objections without engaging the specifics of the case, or makes major conceptual errors. Little coherent analysis of the system's mechanics.
  *   **E (<9):** Fails to engage with the case or the core concepts of revealed preference/rationalizability.
