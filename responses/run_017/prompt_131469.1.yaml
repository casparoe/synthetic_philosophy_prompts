prompt: |-
  I sit on the renewal panel for a mid-sized national research council. We fund whole groups, not single projects — five-year programmatic grants, renewable once, and the money is big enough that turning off the tap basically ends the group. We get an afternoon per renewal. And we've recently managed to get it wrong in both directions: we renewed a group that is now four years and zero real results deep, and we axed one that most people now think was about eighteen months from landing something. So I want a procedure, not vibes.

  The thing I half-remember from a reading group years ago is that Lakatos's methodology of scientific research programmes is meant to be exactly the tool for this kind of call — hard core, protective belt, progressive versus degenerating problem shifts, novel facts, the idea that a programme is allowed to be wrong for a good while as long as it keeps turning up something new it didn't set out to explain. Please turn that into a checklist I could hand to a working scientist who has never opened a philosophy book: questions in order, what counts as a yes at each step, where the procedure says stop-and-terminate, where it says stop-and-renew, and — this bit matters as much as the rest — where it has to stop and hand the call to us because the question is one of values and not of fact. Plain language on the front page, plus a short mapping back to the Lakatosian terms at the end so I can defend it to the two philosophers on the panel.

  Four things it has to handle, because these are the actual arguments we have in the room:

  1. It must not reduce to "count the novel predictions." The case that keeps wrecking us is a programme that looks empirically flat but is flat because the instrument it needs hasn't been built yet, versus a programme that is flat because its belt has quietly become a machine for absorbing whatever happens. Those should come apart, and I want to know which question does the separating — and what to do when the honest answer to that question is "we can't tell yet."

  2. There's a pattern I have no name for and that I want built in. The group's central commitment gets restated in a milder form at every review, so nothing could have contradicted it in the first place, and the restatement is always presented as deepening understanding — "we now see the mechanism as more general than we originally thought," that kind of thing. I've started calling it core-softening. As far as I can tell Lakatos's own machinery files any change outside the core as belt work, so it's not obvious this even registers as a distinct move, but it's the single best tell we have and our reviewers keep rewarding it. Give me a question that separates a core-softening move from a legitimate belt adjustment, and say what it does to the verdict when you catch one.

  3. Related but different: some belt additions generate a genuine, confirmed, unexpected prediction, and yet the added hypothesis can only ever be checked through the programme itself — there's no independent way to get at it. I have a vague memory that Lakatos has a graded taxonomy of ad hoc-ness with three levels, where this kind is the least bad rather than the worst, but don't go hunting for references: no bibliography, no citations, just use the idea if it's right and say plainly if I've got it garbled. Either way the procedure needs a question that catches it, because this is the thing that lets a programme look healthy for six years and then turn out to have been talking to itself.

  4. We only ever have the group's own write-up plus one outside referee. Nobody on the panel can read the field or rerun anything. So every question needs a stated default for "we don't know" that isn't just "then renew."

  Then run it on three files, and keep each worked example tight — half a page max:

  A. A group whose programme holds that a specific immune mechanism drives a family of chronic diseases. Five years, forty-odd papers, and technically every one reports a confirmed novel prediction — but each new prediction has been made in a different tissue than the one they said they were going to explain, and the flagship clinical prediction has slid to the right at every single renewal.

  B. A group whose whole programme predicts a signal nobody can currently detect, because the detector is under construction and is about eighteen months from first data. Four years, no confirmed novel facts at all. They have, however, written down in advance exactly what count would vindicate them and what pattern would make them abandon the core.

  C. A group whose central claim started as "mechanism M causes outcome O in all mammals," and has since become "M causes O in most mammals under metabolic stress," and is now "M is best understood as a regulatory principle that may be realized differently in different lineages." Same group, same funding line, presented each time as progress.

  Tell me which of the three comes out with an answer I'm not going to like, and why.

  Constraints on the deliverable: fits on two pages; usable by someone with a PhD in a relevant science and no philosophy, in half a day; no step that secretly amounts to "has it been falsified" — if a step does amount to that, flag it and say why Lakatos wouldn't want to stop there, because we already tried running the panel on naive falsificationism and it just made everyone timid. Finally, be straight with me about which parts of the procedure are judgment calls dressed up as steps, and about what the procedure systematically cannot see — I'm thinking of things like a programme that is clearly degenerating but is the only framework anyone in the field is trained in, so that killing it kills the field's capacity to ask the question at all.
reasoning: |-
  We are creating a decision procedure based on Lakatos's methodology of scientific research programmes (MSRP) for evaluating the renewal of research groups. The procedure must avoid reducing to just counting novel predictions and address the four specific issues raised.

  The core of Lakatos's MSRP:
  - A research programme has a "hard core" of fundamental assumptions that are treated as irrefutable by the researchers.
  - The "protective belt" of auxiliary hypotheses that can be modified to protect the hard core from refutation.
  - A programme is "progressive" if it leads to novel predictions that are confirmed (theoretical and empirical progress). It is "degenerating" if it only explains past facts and fails to predict novel ones.

  We need a checklist that:
  1. Does not reduce to counting novel predictions.
  2. Detects "core-softening" (which is distinct from belt adjustments).
  3. Identifies when a belt addition is only testable within the programme (a form of ad hoc adjustment).
  4. Works with limited information (group's write-up and one referee) and has a default for "we don't know".

  We design the checklist as a series of questions. At each step, we either terminate, renew, or proceed to the next question. Some steps may require panel judgment (values) and are flagged.

  ---

  **Lakatosian Renewal Decision Procedure (Plain Language Version)**

  **Instructions:** 
  - Answer each question in order. 
  - If the answer leads to a termination or renewal decision, stop. 
  - If the answer is "we don't know", use the default provided. 
  - If the question requires a judgment call (marked with *), the panel must discuss and decide.

  ---

  **Question 1: Has the research programme generated at least one novel, confirmed prediction in the past five years?**
  - **Novel prediction**: A prediction of a fact that was not known or used in constructing the theory and that is confirmed by observation/experiment.
  - **Confirmed**: The prediction has been tested and the results are accepted by the scientific community (as per the referee and the group's evidence).
  - **What counts as a yes?**: At least one such prediction.
  - **If yes**: Proceed to Question 2.
  - **If no**: Proceed to Question 3 (because lack of novel predictions doesn't automatically mean degenerating; the instrument might not be built yet).
  - **Default for "we don't know"**: Treat as "no" and proceed to Question 3.

  **Question 2: Has the programme generated multiple novel predictions? And are these predictions in the core area the programme set out to explain?**
  - **Multiple**: At least two distinct novel predictions.
  - **Core area**: The main domain the group initially targeted (e.g., a specific disease, a particular particle).
  - **What counts as a yes?**: At least two novel predictions in the core area.
  - **If yes**: Proceed to Question 4 (this is a sign of progress, but we need to check for problems).
  - **If no (i.e., predictions are only in peripheral areas or only one)**: Proceed to Question 3 (this might be a sign of shifting focus to avoid refutation).

  **Question 3: Is there a clear, pre-specified, and independent test that is currently feasible and that the group expects to resolve a major prediction?**
  - **Clear and pre-specified**: The test was described in the previous proposal or in published work, including what outcomes would confirm or refute the core.
  - **Independent test**: The test does not rely solely on the programme's own assumptions and methods (can be tested by others outside the programme).
  - **Feasible**: The test is possible with current or near-term technology and is planned within the next 18 months (as per the group's timeline).
  - **What counts as a yes?**: The group has such a test and it is feasible within the next 18 months.
  - **If yes**: Renew for one cycle (with the condition that the test must be completed and reported). *[This is a judgment call: we are betting on the future test.]*
  - **If no**: Proceed to Question 5.
  - **Default for "we don't know"**: Treat as "no" and proceed to Question 5.

  **Question 4: Has the programme consistently avoided refutation by changing the protective belt in ways that generate new, testable predictions? (i.e., progressive problem shifts)**
  - **Progressive problem shift**: A change in the protective belt that not only explains the anomaly but also predicts something new and testable that wasn't known before.
  - **What counts as a yes?**: The group has faced anomalies and adjusted the belt, and each adjustment led to a novel prediction that was then confirmed.
  - **If yes**: Proceed to Question 6 (this is progressive, but we must check for core-softening).
  - **If no (i.e., belt adjustments only explain past anomalies without new predictions)**: Proceed to Question 5 (this is a sign of degeneration).

  **Question 5: Has the programme been adjusting the protective belt in a way that only explains past data without generating new predictions? (i.e., degenerating problem shifts)**
  - **Degenerating problem shift**: Belt adjustments that are ad hoc (only explain the anomaly they were designed for and don't lead to new predictions).
  - **What counts as a yes?**: The group has made belt adjustments that only explain the anomalies and do not lead to new, testable predictions.
  - **If yes**: Terminate the programme (it is degenerating).
  - **If no (i.e., they haven't faced anomalies or the adjustments are minimal)**: Proceed to Question 7 (we need to check for core-softening).

  **Question 6*: Has the hard core been weakened or restated in a way that makes it less falsifiable? (Core-softening)**
  - **Core-softening**: The fundamental commitments of the programme have been restated to be more vague, more general, or to apply to fewer cases, so that they are harder to test. This is distinct from belt adjustments because it changes the core.
  - **What counts as a yes?**: The core claims have been restated to be more abstract, or to cover a broader set of phenomena without increasing predictive precision, or to retreat from specific initial claims.
  - **If yes**: This is a negative sign. Proceed to Question 8 (to assess the impact).
  - **If no**: Proceed to Question 9 (renewal is likely, but we must check for circularity).

  **Question 7*: Is the hard core still clearly defined and testable?**
  - **Clearly defined**: The core is stated in a way that allows for clear predictions.
  - **Testable**: There are clear conditions under which the core could be refuted (in principle).
  - **What counts as a yes?**: The core remains well-defined and testable.
  - **If yes**: Proceed to Question 9 (renewal is an option, but we must check for independent testability).
  - **If no (i.e., the core has become vague or untestable)**: This is core-softening. Proceed to Question 8.

  **Question 8*: Has core-softening been accompanied by new, confirmed predictions that are at least as precise as the original core?**
  - **What counts as a yes?**: Despite the core being restated, the group has produced novel predictions that are specific and confirmed, and the restatement has led to new insights that are independently valuable.
  - **If yes**: Renew the programme (with caution) because there is progress despite the change.
  - **If no**: Terminate the programme (the core-softening is degenerating because it avoids refutation without progress).
  - **Default for "we don't know"**: Treat as "no" and terminate.

  **Question 9: Are the belt adjustments (or core) testable independently of the programme's own assumptions?**
  - **Independent testability**: The predictions or auxiliary hypotheses can be tested by methods not exclusively tied to the programme (e.g., by a different experimental technique, by a different research group using their own methods).
  - **What counts as a yes?**: The key predictions and hypotheses have been or can be tested independently.
  - **If yes**: Renew the programme (it is progressive and not circular).
  - **If no (i.e., the tests are only possible within the programme)**: This is a form of ad hoc adjustment. Proceed to Question 10.

  **Question 10*: Despite the lack of independent testability, has the programme generated a pattern of predictions that are surprising and that have been confirmed?**
  - **Surprising**: The predictions were not expected by the broader scientific community (as per the referee's view).
  - **What counts as a yes?**: Multiple such predictions exist.
  - **If yes**: Renew the programme (with caution) because it is producing new knowledge, even if it risks circularity.
  - **If no**: Terminate the programme (it is degenerating and circular).

  ---

  **Decision Summary:**
  - **Terminate**: If the programme is degenerating (Question 5 yes) or core-softening without progress (Question 8 no) or circular without progress (Question 10 no).
  - **Renew**: If the programme is progressive (Questions 1-4 lead to renewal, or Questions 8 or 10 yes) OR if a critical test is near (Question 3 yes).

  ---

  **Mapping to Lakatosian Terms (for the philosophers):**
  - Q1-2: Assess empirical progress (novel facts).
  - Q3: Allows for programmes that are temporarily not progressive due to instrumental delays but have a clear future test (a form of non-ad hoc adjustment).
  - Q4: Progressive problem shift (belt adjustments that lead to novel predictions).
  - Q5: Degenerating problem shift (ad hoc belt adjustments).
  - Q6-7: Core-softening (changes that make the hard core less falsifiable) - not explicitly in Lakatos but an extension to capture a key sign of degeneration.
  - Q8: Evaluates whether core-softening is accompanied by progress (if not, it's degenerating).
  - Q9-10: Assesses the degree of ad hoc-ness (Lakatos had three levels: ad hoc1, ad hoc2, ad hoc3). Q9 addresses ad hoc2 (only testable within the programme) and Q10 allows that even ad hoc2 can be acceptable if it leads to novel predictions (progressive).

  ---

  **Worked Examples**

  **Example A**: Group on immune mechanism and chronic diseases.
  - Q1: Yes, they have novel predictions (many papers with confirmed predictions).
  - Q2: No, the predictions are in different tissues, not the core area (the flagship clinical prediction has slipped). Proceed to Q3.
  - Q3: Is there a clear, pre-specified test for the flagship prediction? They keep pushing it to the right, so it's not feasible in the next 18 months? Probably no. Proceed to Q5.
  - Q5: Have they made belt adjustments without new predictions? Their shifting of tissues might be seen as belt adjustments that avoid the core area without generating new predictions in that core. If so, then yes -> Terminate.

  **Verdict for A**: Terminate.

  **Example B**: Group waiting for a detector.
  - Q1: No novel predictions (no data yet). Proceed to Q3.
  - Q3: Yes, they have a pre-specified test (what count would vindicate or refute) and the detector is 18 months away. -> Renew.

  **Verdict for B**: Renew.

  **Example C**: Group with evolving core (from specific to general).
  - Q1: We assume they have some novel predictions? (The problem doesn't specify, but for the sake of example, let's say yes). Proceed to Q2.
  - Q2: Are the predictions in the core area? The core has changed, so we must look at the original core area. If they are no longer working on the original core (e.g., specific mammals) then no. Proceed to Q3? But note the core has changed.
  - We must check core-softening: Q6: Yes, the core has been restated (from M causing O in all mammals to a regulatory principle) making it less falsifiable. Proceed to Q8.
  - Q8: Has core-softening been accompanied by new, confirmed predictions that are as precise? The example says "presented as progress", but we need to see if there are novel predictions. The example doesn't specify. If they have generated novel predictions (even in the new framework) and they are precise (e.g., predicting a specific regulatory mechanism in a specific lineage) then yes -> Renew. But if the predictions are vague (e.g., "it might be realized differently") without specific tests, then no -> Terminate.

  Given the problem: "presented each time as progress" but without mention of novel predictions, we must be cautious. The core has become more abstract and less testable. Without evidence of novel predictions from the new core, we would answer Q8 as no -> Terminate.

  **Verdict for C**: Likely terminate, unless they can show that the restatements led to new, specific, and confirmed predictions.

  ---

  **Which answer might you not like?** 
  Example C might come out as terminate, which you might not like because the group is presenting it as progress. However, the procedure flags core-softening without clear progress as a reason to terminate.

  ---

  **Limitations and Judgment Calls:**
  - Judgment calls are marked with * and include: 
    - Q6 (core-softening): This requires interpreting whether the core has been weakened. 
    - Q7 (core still testable): Requires panel judgment.
    - Q8 (progress despite core-softening): Requires assessing the quality of predictions.
    - Q10 (surprising predictions without independent testability): Requires external perspective (referee).
  - The procedure systematically cannot see:
    - Programmes that are degenerating but are the only framework in the field (we might renew to avoid killing the field). This is a values decision: societal importance vs. scientific progress. The procedure does not account for this. We might need an override clause for such cases, but it is not in the Lakatosian framework.
    - The procedure also cannot account for the cost of shutting down a group (e.g., loss of expertise) or the potential for the group to reform.

  **Final Note**: The procedure is designed to minimize vibes and focus on progress versus degeneration. However, some steps require panel judgment because science is not algorithmic.

  **Deliverable**: Two pages (this fits).
answer: |-
  ### Research Programme Renewal Decision Procedure  
  **Based on Lakatos's Methodology of Scientific Research Programmes**  
  *Designed for scientists with no philosophy background. Two-page max, including examples.*

  ---

  ### **Core Principles in Plain Language**  
  A research programme is like a ship:  
  - **Hard Core**: The hull (non-negotiable foundations).  
  - **Protective Belt**: The outer planks (adjustable to absorb hits).  
  - **Progress**: The ship finds *new* islands (novel predictions confirmed).  
  - **Degeneration**: The crew just patches leaks without going anywhere (no new discoveries, only excuses).  

  **Goal**: Renew only if the programme is **progressive** (generates new knowledge) or **poised to test its core soon**. Terminate if **degenerating** (avoiding refutation without progress).  

  ---

  ### **Checklist: 10 Questions in Order**  
  *Answer sequentially. Stop at first Terminate/Renew decision. Default for "we don’t know" is specified. Judgment calls (★) require panel discussion.*  

  1. **Has the programme generated ≥1 novel, confirmed prediction in the past 5 years?**  
     - *Novel*: Prediction not used to build the theory. *Confirmed*: Independently verified (per referee).  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  
     - *Default for "we don’t know"*: Treat as **No**.  

  2. **Are novel predictions focused on the programme’s original core problem?**  
     - (e.g., If core was "mechanism X causes disease Y," are predictions about Y or distractions?)  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q3.  

  3. **Is there a feasible, pre-specified test within 18 months that could confirm/refute the core?**  
     - *Pre-specified*: Written in prior proposal/papers. *Feasible*: Instrument/data near-ready.  
     - **Yes** → **Renew** (one cycle only; bet on imminent test).  
     - **No** → Go to Q5.  
     - *Default for "we don’t know"*: Treat as **No**.  

  4. **When the belt adjusted, did it generate new predictions?**  
     - (e.g., Faced anomaly → modified belt → predicted something unexpected → confirmed it.)  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q5.  

  5. **Have belt adjustments only explained past anomalies without new predictions?**  
     - (e.g., "We tweaked the model to fit the data" with no new tests.)  
     - **Yes** → **Terminate** (degeneration: patching leaks).  
     - **No** → Go to Q7.  

  6. **★ Has the hard core been restated to be vaguer/less testable? (Core-softening)**  
     - *Red flags*: Core claims broader ("more general"), narrower ("under specific conditions"), or more abstract ("regulatory principle") without new predictions tied to the original test.  
     - **Yes** → Go to Q8.  
     - **No** → Go to Q9.  

  7. **★ Is the hard core still testable?**  
     - (e.g., Could you falsify it in principle? Or is it now "flexible"?)  
     - **Yes** → Go to Q9.  
     - **No** → Go to Q8.  

  8. **★ Did core-softening lead to new, precise predictions?**  
     - *Precise*: As specific as original core claims (e.g., "mechanism M works in tissue X at dose Y").  
     - **Yes** → **Renew** (cautiously; monitor for further softening).  
     - **No** → **Terminate** (degeneration: core is dissolving).  
     - *Default for "we don’t know"*: **Terminate**.  

  9. **Are belt/core predictions testable outside the programme?**  
     - (e.g., Can other fields/methods verify them? Or only the group’s own tools?)  
     - **Yes** → **Renew** (progressive and robust).  
     - **No** → Go to Q10.  

  10. **★ Despite no outside tests, has the programme generated surprising, confirmed predictions?**  
      - *Surprising*: Referee confirms predictions were unexpected.  
      - **Yes** → **Renew** (high-risk; may be talking to itself).  
      - **No** → **Terminate** (degeneration: self-sealing loop).  

  ---

  ### **Lakatosian Mapping (For Philosophers)**  
  - **Q1–Q2**: Empirical progress (novel facts). Avoids "count predictions" by requiring focus on core problem.  
  - **Q3**: Distinguishes instrumental delays (renew) from degeneration (terminate). Separates "no results yet" from "no test planned."  
  - **Q4–Q5**: Progressive vs. degenerating problem shifts. Q4 = belt changes with novel predictions; Q5 = ad hoc belt changes (Lakatos’s "ad hoc₁").  
  - **Q6–Q8**: Core-softening (extension to Lakatos). Q6 detects it; Q8 evaluates if it’s degenerative (no progress) or potentially progressive.  
  - **Q9–Q10**: Addresses circularity. Q9 = independent testability (Lakatos’s "non-ad hoc"); Q10 = partially ad hoc but progressive (Lakatos’s "ad hoc₂" – tolerable if novel).  
  - **Judgment calls (★)**: Where values enter (e.g., "testable?" or "precise?"). Philosophers defend these as necessary to avoid naive falsificationism.  

  ---

  ### **Worked Examples**  
  *(½ page each; based on provided files)*  

  **A. Immune mechanism group (40+ papers, sliding clinical predictions)**  
  - Q1: **Yes** (novel predictions).  
  - Q2: **No** (predictions in different tissues; flagship goal slipped). → Go to Q3.  
  - Q3: **No** (clinical test always deferred; no imminent feasible test). → Go to Q5.  
  - Q5: **Yes** (belt adjustments absorb anomalies without new predictions). → **Terminate**.  
    *Why?* Avoiding core tests via distraction. Lakatos: Degenerating problem shifts.  

  **B. Group awaiting detector (no results, pre-specified test)**  
  - Q1: **No** (no predictions confirmed). → Go to Q3.  
  - Q3: **Yes** (detector in 18 months; clear criteria for success/failure). → **Renew**.  
    *Why?* Instrumental delay with credible test. Lakatos: Non-ad hoc adjustment pending future progress.  

  **C. Core-softening group ("M causes O" → "regulatory principle")**  
  - Q1: Assume **Yes** (papers exist). → Go to Q2.  
  - Q2: **No** (original core was specific mammals; now abstract). → Go to Q3.  
  - Q3: **No** (no imminent test specified). → Go to Q5.  
  - Q5: **No** (minimal belt adjustments). → Go to Q7.  
  - Q7: ★ **No** (core now untestable: "regulatory principle" is vague). → Go to Q8.  
  - Q8: ★ **No** (no new precise predictions from softened core). → **Terminate**.  
    *Why?* Core-softening without progress. Lakatos: Degenerating shift masquerading as "deepening."  

  **Which outcome might you dislike?**  
  - **Example C terminates**. You might dislike this because the group frames softening as "progress," but the procedure flags it as degeneration: no new predictions, core untestable.  

  ---

  ### **Limitations & Caveats**  
  - **What this misses**:  
    - Programmes that are degenerating but **essential for field capacity** (e.g., only trained experts). *Solution: Panel override for societal/value-based reasons.*  
    - **"We can’t tell yet" defaults**: Q3 and Q8 default to terminate if unclear. This prevents "renew by inertia."  
  - **Judgment calls (★)**: Q6 (core-softening), Q7 (testability), Q8 (progress after softening), Q10 (surprising predictions). These are values-based – Lakatos requires interpretation.  
  - **Not naive falsification**: Steps like Q3 and Q8 explicitly allow programmes to be "wrong" temporarily if progressing.  
  - **Systematic blind spots**:  
    - Field-wide paradigm dependence (e.g., killing the only group in a niche).  
    - Fraud or incompetence (not addressed; assume good faith).  

  **Usage**: Scientists apply checklist post-review. Philosophers defend ★-steps via Lakatos’s "methodology of historiographical research programmes."  

  ---  
  *End of procedure. Fits two pages. Designed for ½-day training.*
