answer: |-
  Here is a specification of desiderata for a test to distinguish verbal disputes from substantive ones in your context, structured as requested:

  ### Non-Negotiable Desiderata (Must be satisfied by any adequate test)
  1.  **Truth-Tracking Capacity:** The test must reliably distinguish disagreements arising *only* from divergent linguistic conventions (meaning/term application) from disagreements about non-linguistic facts or structures of the world. *Consideration:* This is the core purpose of the test – separating language-level disputes from world-level disputes. Failure invalidates the test.
  2.  **Textual Basis:** The test must operate solely on the evidence provided: published papers and transcripts. It cannot require new experiments, interviews, thought experiments, or controlled semantic discussions with the parties. *Consideration:* This is a hard constraint of the panel's mandate and available evidence.
  3.  **Focus on Dispute Resolution:** The test's output must directly aid the panel's goal: determining if the *core disagreement* between the groups is verbal or substantive concerning the central term(s). *Consideration:* The panel's consensus statement requires a verdict on the nature of the dispute itself, not peripheral issues.
  4.  **Separation of Questions:** The test must clearly distinguish:
      *   (a) **Verbal/Substantive Status** (Is the core conflict about meaning or fact?)
      *   (b) **Settlement Value** (Is resolving this conflict worthwhile? e.g., for science, policy, clarity)
      *   (c) **Fault/Blame** (Is the dispute due to bad faith, confusion, strategic shifting, etc.?)
      *Consideration:* Conflating these leads to unfair verdicts and misdirects the panel's statement. Fault assessment often requires intent evidence beyond texts.
  5.  **Preservation of Substance:** A verdict of "verbal" must *not* imply that the underlying subject matter (e.g., the phenomena the term attempts to describe) is trivial, unimportant, or non-existent. *Consideration:* Prevents the test from illegitimately doing first-order metaphysical work by dismissing the *topic* based on a *terminological* verdict.

  ### Preference-Sensitive Desiderata (Requirements where emphasis may reflect a camp's leaning)
  6.  **Inference & Counterfactual Handling (Non-Deflationist Leaning):** The test must handle cases where parties agree on all non-linguistic facts but disagree about what inferences the contested term licenses or what would hold in counterfactual scenarios involving it. *Consideration:* Non-deflationists often see meaning as constituted partly by inferential/counterfactual commitments. This tests if the dispute is about the *content* associated with the term.
  7.  **Cutoff Applicability Handling (Deflationist/Operationalist Leaning):** The test must handle disputes where the term establishes a cutoff (e.g., "significant risk," "viable population") applied by statute or funding rules to real cases. *Consideration:* Deflationists/operationalists may emphasize the practical consequences of term application; the dispute might be "merely verbal" *for scientific purposes* but have real-world consequences due to rules.
  8.  **Term Stability Tolerance (Deflationist/Contextualist Leaning):** The test must at least partially handle disputes where both parties shift the term's extension or intension during the exchange, lacking stable idiolects. *Consideration:* Rigidly requiring stable idiolects risks dismissing messy, evolving real-world disputes as "unanalyzable." Deflationists/contextualists may be more comfortable attributing shifts to context/pragmatics without declaring the dispute non-verbal.
  9.  **Prescriptive Aim Detection (Normative/Revisionist Leaning):** The test must help identify when one party's primary aim is not to report how the world *is* (descriptive) but to advocate for how the term *should be used* (prescriptive/revisionist). *Consideration:* Parties focused on reform often differ fundamentally in motivation from those focused on description, impacting the nature of the dispute.

  ### Specific Case Handling (Requirements derived from specified cases)
  *   **Case 1 (Inferences/Counterfactuals):** Covered by Desideratum 6.
  *   **Case 2 (Cutoff Application):** Covered by Desideratum 7.
  *   **Case 3 (Shifting Extensions):** Covered by Desideratum 8.
  *   **Case 4 (Prescriptive Aim):** Covered by Desideratum 9.

  ### Suspected Incompatible Desiderata
  *   **Tension:** **Textual Basis (2) & Inference/Counterfactual Handling (6)** vs. **Neutrality (Implicit in 1, but specifically regarding Deflationism)**
  *   **Why:** Desideratum 6 (Inference/Counterfactual Handling) pushes towards analyzing *meaning* as constituted by inferential roles or modal profiles, a view often associated with non-deflationary theories of content. Satisfying this robustly often requires interpreting commitments *within* the texts that go beyond simple extensional agreement, potentially needing philosophical tools. However, Desideratum 2 (Textual Basis) combined with the need for **Usability by Non-Philosophers** (a key concern you raised) strongly favors simpler, more operational, often extensional or behaviorist criteria. These simpler criteria (e.g., looking for explicit agreement on core examples/properties) are more accessible to non-philosophers but often align better with a deflationary view, which might dismiss robust inferential role disagreements as *also* ultimately verbal or pragmatic. Achieving deep inference/counterfactual analysis *neutrally* and *reliably* from *texts alone* without philosophical interpretation is extremely challenging for non-experts. Simplicity/Usability favors deflationary-leaning methods; robust inference analysis favors non-deflationary frameworks. Bridging this gap neutrally and accessibly is the core difficulty.

  ### Potential Prejudice & Most Restrictive Requirement
  *   **Desideratum as Potential Prejudice:** **Inference & Counterfactual Handling (6)** might subtly reflect a **non-deflationist prejudice**. It presupposes that disagreements over inferences/counterfactuals licensed by a term are *prima facie* evidence of a substantive dispute (about the world's structure), rather than potentially being the *very essence* of a verbal dispute about meaning conventions. A strong deflationist might argue that *all* meaningful disagreement reduces to differences in term use, making the distinction collapse. Requiring the test to treat inferential disagreement as a key marker *for* substance leans non-deflationist.
  *   **Most Restrictive Requirement:** **Term Stability Tolerance (8)** likely rules out the largest share of existing formal accounts (e.g., Chalmers' method, Hirsch's quantifier variance comparisons, many model-theoretic approaches). Most sophisticated philosophical tests rely on comparing relatively stable meanings/idiolects. Handling significant, dynamic meaning shifts *within* the dispute evidence without stability is an enormous challenge for formal methods and drastically limits viable approaches, pushing towards more interpretive, contextual, or pragmatic analyses.

  ### Preventing Illegitimate Metaphysical Work
  *   **Verdict Prevention:** The requirement that a "verbal" verdict **must not imply the underlying subject matter is trivial or non-existent (Desideratum 5 - Preservation of Substance)** is crucial. A test must output "verbal dispute over term T concerning phenomenon P" without implying "P is unreal/unimportant." This prevents the verdict from smuggling in eliminativism or reductionism about P. The test should be meta-linguistic, not first-order metaphysical.

  This specification provides the rigorous framework you need to evaluate potential tests against the complexities of your panel's task.
