   3. The scenario must be ordinary and realistic.

   4. We must have three types of agents:

      a. The "naive" agent who at each time re-optimizes: she swaps if and only if at that time she prefers the neighbor's item and the fee is less than her current willingness to pay.

      b. The "sophisticated" agent who uses backward induction: she foresees the entire sequence and works backward to decide at each step what to do, taking into account her future actions.

      c. The "committed" agent who at the outset commits to a plan (costlessly) for the entire sequence.

