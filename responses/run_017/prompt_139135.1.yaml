prompt: |-
  i'm doing a philosophy of mind paper this semester and also working as a TA for a first-year logic course, and the two things have kind of collided on me now that it's exam season. We did the extended mind stuff — the famous thought experiment where one person remembers the museum address in her head and the other has to check a notebook he always carries — and my prof's line in the lecture was that the thesis is either trivial or obviously false, and that university exam rules are a good way to tell which. I think she's being too quick but I can't say exactly why, which is what I want help with.

  Here's the practice, as concretely as I can give it. In the course I TA, students may bring a non-programmable calculator but not a phone, even though the phone contains a calculator that does strictly more and is arguably more reliable. They may bring one handwritten A4 sheet of notes, but under the rule as it was rewritten last year the sheet has to be "continuously available and actually relied on for the majority of study sessions for that paper" — so a sheet you made in week two and used all term is fine, a identical sheet printed out the night before is a breach, and a classmate who happens to be standing in the corridor is a breach no matter how many hours you spent revising with them. Meanwhile the disability office will approve a screen reader, a spellchecker, or a human scribe for students with dyslexia, but the same essay written with a grammar-and-rewrite tool switched on is academic misconduct, and so is paying a friend to proofread it. So: same computation, same output, wildly different treatment, and the differences don't seem to track how much thinking the tool is doing for you.

  What I want is the implicit theory. What does this rulebook presuppose about where a person's cognition stops — is it that the permitted aids have been reliably available, easily accessible and automatically trusted over time, roughly the conditions the reading talks about, or is it something else entirely, like a view about credit or about who deserves praise for the answer? Which rival views does it quietly rule out: does it rule out the skull-and-skin view, or does it instead rule out the really permissive view on which any external process you're coupled with is part of you? Are the parts even consistent with each other — the scribe case and the software case look identical to me from the outside, and the calculator/phone distinction can't be about computation — and where is the practice just philosophically underdetermined, so that several quite different theories would license exactly the same rules? And finally, what would actually have to change if a department took the extended view seriously: does a closed-book exam start to look less like a fair test and more like inducing a temporary disability, or does the whole thing collapse the other way, into nothing being bannable at all? I'd especially like to know how much of the metaphysics the rules are really committed to, versus how much is only loosely compatible with them, since that's the bit I'd need before I try arguing back in tutorial.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a TA for a first-year logic course and working on a philosophy of mind paper. The collision between the two comes from exam rules and the extended mind thesis. The professor thinks the thesis is either trivial or false, using exam rules as evidence. The user feels this is too quick but can't articulate why. 

  First, I need to understand the core issue. The user provided concrete examples: calculators allowed but not phones, handwritten notes allowed if used consistently but not if printed last minute, disability accommodations like screen readers permitted but grammar tools considered misconduct. The user wants the implicit theory behind these rules—what they presuppose about cognition, which views they rule out, and if they're consistent.

  The user's deeper needs seem to be constructing a counterargument to their professor. They need to show that exam rules don't necessarily refute the extended mind thesis. They also need to identify the underlying principles of the rules to see if they align with any philosophical stance or if they're pragmatic. 

  Looking at the examples, the rules prioritize reliability, access, and trust over time. The handwritten notes rule requires continuous availability and reliance, which mirrors Clark and Chalmers' conditions. But the prohibition against last-minute sheets or human help outside the exam room suggests that trust and reliability are bounded by the exam context. 

  The calculator vs. phone distinction isn't about computation but about control and potential for cheating. Phones can access the internet, communicate, etc., making them uncontrollable. So it's a pragmatic rule, not a metaphysical one. 

  The disability accommodations highlight fairness and leveling the playing field. Tools like screen readers compensate for disabilities, whereas grammar tools for others might give an unfair advantage. This introduces a normative element about what constitutes "natural" ability versus "artificial" enhancement. 

  The inconsistency between allowing a human scribe but banning a grammar tool seems contradictory. Both assist with writing, but the scribe is seen as enabling expression, while the tool might replace cognitive effort. However, the rules might be based on intent and authorization. The disability office approves scribes as necessary, while grammar tools are unauthorized aids. 

  The user questions if closed-book exams induce temporary disability under the extended mind view. If cognition is extended, then restricting access to external tools could hinder cognitive function. But the exam rules might presuppose that core competence must be demonstrable without external aids, emphasizing individual understanding. 

  The department taking extended mind seriously would need to rethink assessments. Maybe open-book exams or project-based evaluations that allow tools, focusing on application over memorization. But this could blur the line between the student's cognition and external resources, making assessment harder. 

  The user also asks about the metaphysics the rules commit to. The rules don't necessarily endorse the skull-bound view; they might be operationalizing a practical distinction between internal and external for fairness and control. The extended mind conditions (trust, accessibility, reliability) are partially met in the note example but limited by exam constraints. 

  Rival views: The rules reject the radical extended mind where any coupled process is part of cognition. They also don't fully embrace the skull-bound view since they allow some aids. Instead, they might reflect a commonsense individualism with pragmatic exceptions. 

  Inconsistencies: The scribe vs. grammar tool is a tension. Both provide similar functions, but one is permitted under disability, the other banned. This suggests the rules prioritize normative assessments (fairness, necessity) over metaphysical unity. The calculator/phone distinction is about risk management, not cognition. 

  Underdetermination: The same rules could stem from different principles. For example, reliability could be seen as fostering integration (extended mind) or controlling variables (pragmatic). Credit assignment might focus on the individual's effort versus the system's output. 

  To argue back, the user should highlight that the exam rules are pragmatic and normative, not metaphysical. They manage fairness and integrity, not define cognition. The extended mind thesis isn't refuted but constrained by exam contexts. The professor's claim that rules make extended mind trivial or false overlooks the practical motivations behind the rules.
answer: |-
  Your professor's dismissal of the extended mind thesis (EMT) based on exam rules is indeed too quick. The rules aren't a straightforward test of EMT's truth; they're a pragmatic, normatively loaded operationalization of *assessment goals* that selectively borrow from EMT-like intuitions while rejecting others. Here's the implicit theory and its philosophical implications:

  ### 1. **Core Presupposition: "Demonstrable Competence" Over "Coupled Systems"**
     - **The Rules Assume:** Cognition *for assessment purposes* is defined by **what the student can reliably generate *independently* of *uncontrolled* external resources under timed conditions.** 
     - **Why EMT Seems "Trivial or False" Here:** The exam context deliberately *severs* the coupling EMT relies on. It's artificial: you're testing *disembodied* skill extraction, not real-world embedded cognition. EMT describes how minds *work*; exam rules define how to *measure* a socially constructed subset of that process.
     - **The Hidden Normative Leap:** "Credit" belongs only to cognitive processes that are (a) biologically internal, or (b) *authorized* external tools meeting strict *reliability + access* criteria *during the specific assessment*. The "person" being assessed is a legally/administratively defined entity, not a metaphysical one.

  ### 2. **Key Implicit Conditions (Beyond Clark & Chalmers)**
     The rules operationalize a modified version of EMT's conditions (Reliability, Accessibility, Trust, Past Endorsement) but crucially add:
     - **Controllability:** The aid must be *passive* and *incapable of autonomous, unverifiable computation/communication* (hence calculator yes, phone no – it’s about cheating risk, not metaphysics).
     - **Individual Attribution:** The aid's output must be *unambiguously attributable to the student's prior effort* (notes you made vs. identical printout/friend – the latter breaks the causal chain of *your* labor).
     - **Authorization:** The aid must be *explicitly permitted by institutional authority* (disability office approval legitimizes the scribe/spellchecker; using the same aid without approval is misconduct).
     - **Non-Collaborativity:** The aid cannot *introduce another agent's cognition* (classmate in corridor = banned; non-AI spellchecker = maybe ok if authorized; grammar rewriter/AI = banned as "ghost author").

  ### 3. **Rival Views Ruled Out (and Compatible)**
     - **Ruled Out:**
       - **Radical EMT/Enactivism:** Any tool you're coupled with *is* part of your mind. (Rules reject this – coupling during the exam isn't enough; past effort/authorization is key).
       - **Strict Skull-Bound View:** *No* external tools are part of cognition. (Rules reject this – permitted notes/calculators *are* allowed extensions; they acknowledge utility of external resources when controlled).
     - **Compatible With:**
       - **Moderate EMT (Clark-style):** Rules implicitly accept EMT *if* conditions (reliability, trust, past endorsement) are met *AND* the tool is passive/controllable/authorized. The "notes used all term" rule *directly mirrors* EMT conditions.
       - **Epistemic Credit Theory:** Focuses on *deserving credit* for an answer. Rules tightly link credit to individual prior effort and current control, not just output.
       - **Pragmatic Instrumentalism:** The rules don't care about metaphysics; they care about measurable fairness, preventing cheating, and certifying individual skill.

  ### 4. **Inconsistencies & Underdetermination**
     - **The Scribe vs. Grammar Tool Inconsistency:** This highlights the **authorization/normative** core, not cognition. A scribe is seen as a *transparency-enabling tool* for a dyslexic student (output = student's *intended* words). A grammar rewriter is seen as *opaque cognition-replacement*, altering meaning/content without trace. The difference is in perceived *agency substitution*, not computational function. It's shaky ground, relying on intuition about where "thinking" happens.
     - **Calculator/Phone Distinction:** This is **not about cognition**. It's 100% about **pragmatic exam security**. Phones have uncontrollable communication/networking capacities; calculators don't. The "computation" is irrelevant.
     - **Underdetermination:** The *same rules* could be justified by:
       - A moderate EMT (notes/calculator meet conditions; phone/friend don't).
       - A credit theory (notes represent *your* past cognitive labor; printout doesn't).
       - Pure instrumentalism (these rules minimize cheating/scandal while allowing *some* aid).

  ### 5. **Taking EMT Seriously: Consequences for Assessment**
     If EMT were fully embraced:
     - **Closed-Book Exams:** Would indeed look like **imposed cognitive impairment**. Why sever reliable, trusted cognitive partners (notes, apps, networks) that are part of a student's *actual* epistemic toolkit?
     - **Radical Change (Not Collapse):** Assessment would shift focus:
       - **From:** Testing isolated, decontextualized internal computation.
       - **To:** Evaluating **skill in managing and utilizing integrated cognitive systems** (your brain + your authorized tools + your network access protocols).
       - **Practically:** More open-book, project-based, or "bring your own ecosystem" exams testing *problem-solving with your tools*. Cheating prevention focuses on *process transparency* (e.g., explain your tool-use reasoning) not tool exclusion.
     - **Not "Anything Goes":** EMT doesn't mean *every* external resource is part of *your* mind. Rules would still demand **trust, reliability, individual prior endorsement/configuration, and non-collaborativity** for permitted tools. Paying someone *else* to think for you (human or AI) still violates individual credit norms.

  ### Arguing Back: The Core Point
  **The exam rules *don't* falsify EMT; they *presuppose a narrow, assessment-specific operationalization* of it while prioritizing institutional control and normative credit assignment over metaphysical unity.** They show that *in a specific social context* (certifying individual competence under constrained conditions), we *choose* to define the "cognitive agent" narrowly. This choice is driven by **pragmatics (fairness, security, scalability) and normative values (credit for individual effort)** – not a deep metaphysical commitment to skull-bound cognition.

  **Your argument in tutorial should focus on:**
  1. **The Pragmatic/Normative Foundation:** Exam rules are policy tools, not philosophical proofs. They use *aspects* of EMT (reliability, past endorsement for notes) while rejecting others (real-time coupling is insufficient).
  2. **The Authorization Loophole:** The scribe/software inconsistency reveals that *permission* and *attribution*, not cognition, are paramount. EMT explains cognition; rules govern credit assignment.
  3. **The Artificial Severing:** Exams deliberately create an artificial environment that *disables* normal cognitive extension to isolate a specific skill. This doesn't prove the extensions aren't *part* of cognition; it proves we *value* testing the isolated component.
  4. **Moderate EMT Survives:** The "notes used all term" rule *is* EMT in action. The professor's "trivial" point might apply only to the most radical, unrestricted versions of EMT, not Clark & Chalmers' original conditional formulation.

  The rules aren't metaphysics; they are applied philosophy-of-mind-*as-policy*, bending concepts to serve institutional goals. Your professor's challenge conflates a descriptive theory of mind with a prescriptive framework for assessment.
