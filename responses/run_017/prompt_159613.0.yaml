  I'll flag that the symmetrical position and cognitive agency position are incompatible with volcanoes as "actors," and note where positions might collapse into each other. The tree will have 8 questions leading to 12 distinct leaves, each with a confidence marker about its real-world representation.

  The most uncertain branch is likely the symmetrical actor-network position - if scholars actually treat pathogens and policies identically in narrative construction, or if I'm overextending the theory. But given Latour's writing on non-humans, I think it holds.
answer: |-
  Here's a decision tree designed to classify positions on the role of "non-human actors" in history based on responses to cases, avoiding jargon and team labels. It uses your substitution and two-key tests as key branches, incorporates your specified cases, and addresses your structural requests. The tree has **8 branch questions** and **12 leaves**, with confidence markers and structural notes.

  ---

  ### **Decision Tree: How Do Non-Human Entities Shape History?**
  *Start with a case like the Irish Potato Famine (1840s), Tambora’s climate impact (1815), or Columbian Exchange smallpox. Answer based on whether the **specific identity** of the pathogen/event matters to the historical outcome.*

  1.  **Substitution Test:** If you swapped the *specific* pathogen/event (e.g., *Phytophthora infestans* for a different blight, Tambora for a different eruption causing similar cooling) but kept the *demographic impact* (death toll, timing, region) the same, would the core historical narrative **change significantly**?
      *   **YES (Identity Matters) → Go to Q2.**
      *   **NO (Shock is Generic) → Go to Q3.**

  2.  **Why Identity Matters:** The narrative changes because...
      *   **A) The biological/geophysical *specifics* altered human choices/perceptions (e.g., blight’s invisibility vs. yellow fever’s symptoms; volcano ash blocking sun vs. gradual cooling). → Leaf 1: *Contextual Interactionism* (Confidence: High - e.g., McNeill, Crosby)**
      *   **B) The entity’s *adaptive/responsive nature* was key (e.g., antibiotic resistance evolving; blight strains differing). → Leaf 2: *Co-Evolutionary Agency* (Confidence: Medium - common in STS/env. history)**
      *   **C) Its *temporal pattern* drove the outcome (e.g., recurring malaria vs. one-off famine; slow vs. fast spread). → Leaf 3: *Rhythmic Causation* (Confidence: High - e.g., studies of epidemic waves)**
      *   *Note: Volcanoes rarely pass Q2 convincingly (lack B/C); germs often do, especially pandemics.*

  3.  **Two-Key Test:** Was the outcome **contingent** on the *combination* of the specific social/human context *and* the specific non-human entity/event? (e.g., Irish famine required *both* blight *and* colonial policy; antibiotic resistance needs *both* bacteria *and* misuse).
      *   **YES (Necessary Combo) → Leaf 4: *Conjunctural Necessity* (Confidence: High - e.g., structural historians)**
      *   **NO → Go to Q4.**

  4.  **Without the entity/event, would the outcome likely have occurred *anyway*, just later/differently?** (e.g., "Colonial collapse in Americas was inevitable due to exploitation; smallpox just sped it up").
      *   **YES → Go to Q5.**
      *   **NO → Go to Q6.**

  5.  **The entity/event mainly acted as...**
      *   **A) A *trigger* accelerating an inevitable process. → Leaf 5: *Catalyst* (Confidence: High - common in "great man/event" critiques)**
      *   **B) A *final blow* after human systems were already broken. → Leaf 6: *Coup de Grâce* (Confidence: Medium - e.g., some interpretations of Haiti/Yellow Fever)**
      *   *Note: Q5A/B often blur; distinction is emphasis on timing vs. existing damage.*

  6.  **The primary role of the non-human factor is to...**
      *   **A) Create the *possibility space* (e.g., climate sets agricultural limits; geography enables trade). → Leaf 7: *Possibilism* (Confidence: High - e.g., Braudel, geographic determinism)**
      *   **B) Impose *inescapable constraints* (e.g., germ theory shows pathogens *force* responses; volcanoes destroy options). → Leaf 8: *Material Determinism* (Confidence: Medium - e.g., some eco-marxism/environmental determinism)**
      *   **C) Be an *equal partner* in a network of forces, none inherently primary. → Leaf 9: *Symmetrical Actor-Network* (Confidence: Medium - e.g., Latour-influenced STS)**
      *   *Note: Volcanoes often end up in Q6A/B; responsive germs can fit Q6C.*

  7.  **Blame & Responsibility:** Does framing the entity as an "actor" or key cause...
      *   **A) *Absolve* human actors/systems by shifting blame to nature? → Leaf 10: *Naturalizing Culpability* (Critique) (Confidence: High - common critical stance)**
      *   **B) *Increase* human responsibility by showing how systems *enable* disasters? → Leaf 11: *Revealed Complicity* (Confidence: Medium - e.g., political ecology critiques)**
      *   **C) Is "blame" the wrong frame entirely for non-sentient things? → Leaf 12: *Ascription Requires Mind* (Confidence: High - traditional philosophy)**
      *   *Note: Q7 applies *after* classifying the causal role; it's an ethical/meta layer.*

  ---

  ### **Leaf Positions Summarized & Confidence Markers**

  1.  **Contextual Interactionism:** Identity matters b/c specifics shape human responses/choices. (*Confidence: High - Directly supported by substitution test success. Framing fair.*)
  2.  **Co-Evolutionary Agency:** Identity matters b/c entity adapts/reacts to humans (germs, pests), creating feedback. (*Confidence: Medium - Common stance, but "agency" term contested. Framing slightly stretches common usage towards your focus.*)
  3.  **Rhythmic Causation:** Identity matters b/c temporal pattern (speed, recurrence) drives outcome. (*Confidence: High - Well-substantiated in epidemiology/climate history. Framing fair.*)
  4.  **Conjunctural Necessity:** Outcome *required* the specific combo of social & non-human factors. (*Confidence: High - Core to many historical materialist/structural analyses. Framing central to two-key test.*)
  5.  **Catalyst:** Non-human factor accelerated an otherwise inevitable outcome. (*Confidence: High - Ubiquitous historical explanation. Framing fair.*)
  6.  **Coup de Grâce:** Finished off a system already critically weakened by humans. (*Confidence: Medium - Implied in many analyses, less often explicitly named. Framing captures intent.*)
  7.  **Possibilism:** Sets boundaries/creates opportunities; doesn't "cause" specific events. (*Confidence: High - Braudelian tradition. Framing standard.*)
  8.  **Material Determinism:** Imposes hard constraints that override human will/systems. (*Confidence: Medium - Strong form is less common now; softer constraints widely accepted. Framing risks caricature but captures essence.*)
  9.  **Symmetrical Actor-Network:** All entities (humans, germs, tools, ideas) are equal "actants" in networks shaping outcomes. (*Confidence: Medium - Core ANT tenet, applied to history. Framing accurate but may simplify.*)
  10. **Naturalizing Culpability (Critique):** Calling germs/volcanoes "actors" risks excusing human responsibility. (*Confidence: High - Common critical argument. Framing fair as critique.*)
  11. **Revealed Complicity:** Highlighting non-human causes exposes the human systems that enabled disaster. (*Confidence: Medium - Implicit in political ecology; less explicitly named. Framing captures logic.*)
  12. **Ascription Requires Mind:** "Actors" implies intent/agency; these are just causes/catalysts/conditions. (*Confidence: High - Traditional philosophical view. Framing standard.*)

  ---

  ### **Structural Notes & Gaps**

  *   **Germs/Climate/Volcanoes:** Handled as *attributes* of leaves, not an early branch. The tree shows *why* something qualifies or not:
      *   Volcanoes rarely pass Q1/Q2 (Identity Matters) except perhaps Q2A (specifics alter perceptions - ash vs. gas) or Q6A/B (Possibilism/Determinism). They fit Q3-Q7 easily.
      *   Climate anomalies fit Q1 (sometimes), Q2A/C (sometimes), Q3-Q7 readily.
      *   Responsive pathogens (blight, antibiotic resistance) uniquely fit Q2B (Co-Evolution) and Q6C (Symmetry).
  *   **Gaps in Logical Space:**
      *   **Strong "Germs ONLY" Determinism:** (Fails substitution & two-key tests, claims germs alone caused outcome independent of society). *Why missing?* Factually incoherent for major historical cases; requires ignoring social context. (e.g., Smallpox didn't depopulate isolated tribes the same way as empires).
      *   **Pure "Society ONLY":** (Fails substitution test *if* identity matters, denies non-human factors any role beyond backdrop). *Why missing?* Rare in serious history today; contradicts evidence (e.g., Tambora's global impact).
  *   **Indistinct Leaves:**
      *   **Catalyst (5) vs. Coup de Grâce (6):** Distinction hinges on whether the system was *inevitably* doomed (5) or just *already critically damaged* (6). Often a difference of interpretation, not fundamental ontology.
      *   **Material Determinism (8) vs. Strong Possibilism (7):** Distinction is between *actively constraining* (8) vs. *passively enabling/limiting* (7). Blurry line in practice.
  *   **Confidence & Framing Notes:** Marked per leaf. Generally high confidence for established positions. "Co-Evolutionary Agency" (2) and "Revealed Complicity" (11) use slightly non-standard terminology to fit your tests but capture real stances.

  ---

  ### **Least Confident Element**

  *   **Branch/Leaf:** **Leaf 9: Symmetrical Actor-Network**.
  *   **Why:** While ANT explicitly argues for symmetry, *historians* applying it often still subtly prioritize human actors/narratives in practice, especially for non-responsive entities like volcanoes. Is the "equal partner" claim fully realized in historical writing, or more a methodological heuristic?
  *   **What Would Make Me Wrong:** If compelling historical analyses demonstrably treat the specific biology of *Phytophthora* or the atmospheric physics of Tambora with *exactly* the same explanatory weight and narrative presence as British land policy or colonial ambitions, without any implicit human-centrism. Finding such analyses applied to *volcanoes* (not just responsive germs) would strengthen this leaf.
