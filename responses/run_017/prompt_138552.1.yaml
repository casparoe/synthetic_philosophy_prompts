  The user's hypothesis is strong—they've pinpointed the epistemic/metaphysical split. Their cases, especially Incremental and Reverse Mary, are effective at probing the weaknesses in each position. But ultimate resolution? Unlikely. The debate might evolve, but core disagreements remain.
answer: |-
  Your analysis is sharp, not a category mistake—you've pinpointed the central fracture in the Mary debate. The stalemate persists because the dispute operates on two distinct levels: **metaphysical** (what exists) vs. **epistemic** (what we can know/represent), and the core disagreement hinges on whether bridging the epistemic gap *requires* a metaphysical gap. Here’s the anatomy of the deadlock:

  ### The Core Stalemate: Epistemic vs. Metaphysical
  1. **Anti-Physicalist Intuition (Metaphysical Claim)**  
     - Premise: Mary learns *something* upon seeing red.  
     - Leap: What she learns is a **new non-physical fact** (e.g., the intrinsic nature of phenomenal redness).  
     - Assumption: *If you can’t deduce X from the complete physical facts, X must be non-physical*.  
     - This assumes a tight link between epistemic access and metaphysical grounding.

  2. **Physicalist Replies (Epistemic Deflation)**  
     - All three strategies deny the *metaphysical* significance of Mary’s new knowledge:  
       - **Ability Hypothesis**: She gains skills (recognizing/imagining red), not facts.  
       - **Acquaintance Hypothesis**: She gains direct awareness of a property she already knew *about*.  
       - **New Concept Hypothesis**: She re-represents an old physical fact in a subjective format.  
     - Common thread: **Epistemic limitations ≠ ontological gaps**. Mary’s ignorance stems from *how* knowledge is acquired, not *what exists*.

  **Why nobody shifts**: Anti-physicalists see physicalists as evading the raw "what it’s like" experience. Physicalists see anti-physicalists conflating representation with reality. Each side views the other as changing the subject.

  ### Your Cases: Diagnosing the Divide
  Your thought experiments target the epistemic/metaphysical link. Here’s how they probe the stalemate:

  1. **Incremental Mary**  
     - **Setup**: Mary sees 100 minimally distinct red hues sequentially. Does she learn 100 new facts?  
     - **Anti-physicalist**: Each hue *feels* distinct → supports multiple new phenomenal facts.  
     - **Physicalist**: The explosion of "facts" is absurd → suggests the intuition tracks *sensory discrimination* (ability) or *conceptual refinement* (modes of presentation), not new ontological additions.  
     - **Verdict**: Exposes whether "learning" is about *fact-acquisition* or *perceptual calibration*. Favors epistemic deflation.

  2. **One-Sentence Mary**  
     - **Setup**: Can Mary’s new knowledge be conveyed linguistically in her room? E.g., "Seeing red feels *this* way" (pointing to a brain state description).  
     - **Anti-physicalist**: Impossible—no sentence captures the *subjective essence* without ostension or experience.  
     - **Physicalist**: If Mary *already knows* the physical correlates, adding a demonstrative ("this") or re-indexing concepts should suffice. Failure implies a *communicative* limit, not a metaphysical one.  
     - **Verdict**: Tests if the gap is about *propositional knowledge* or *non-propositional acquaintance*. If Mary *accepts* the sentence but still feels something is missing, it hints at metaphysics.

  3. **Reverse Mary**  
     - **Setup**: Color-experienced Chloe learns physics. She learns "c-fiber firing *is* pain." Does she gain a new fact?  
     - **Anti-physicalist**: Chloe learns a *theoretical identification*, but the *metaphysical reduction* holds.  
     - **Physicalist**: If Mary’s case refutes physicalism, so does Chloe’s → but chemistry *is* physical (just higher-level). Thus, Mary’s "learning" is equally compatible with physicalism.  
     - **Verdict**: Reveals ambiguity in "physical." If "physical" = fundamental particles, the argument proves too much. If "physical" = all structure/dynamics (including neurobiology), Chloe’s case is disanalogous.

  ### Why This Won’t End (and What Might)
  - **Bedrock Intuitions**: The stalemate rests on irreconcilable intuitions:  
    - Anti-physicalists: *Phenomenal qualities feel irreducible*.  
    - Physicalists: *Causal closure of physics is non-negotiable*.  
  - **"Physical" is Undefined**: Disputes over whether "physical" includes emergent properties (e.g., "Is water physical?") are substantive, not verbal. Mary’s case forces this ambiguity to the surface.  
  - **Your Flatmate’s View**: Introspection’s unreliability *is* a standard physicalist move (e.g., Dennett), but it dismisses the phenomenal intuition rather than engaging it.

  **Progress?** Two paths:  
  1. **Empirical**: If neuroscience correlates consciousness exhaustively with physical states *and* explains why subjectivity feels ineffable (e.g., as a representational feature), physicalism gains ground.  
  2. **Conceptual**: Clarify the epistemology/metaphysics link. Example: If all epistemic gaps imply ontological gaps, then *mathematical ignorance* (e.g., unproven conjectures) would imply non-physical math facts—which few accept. This weakens the anti-physicalist leap.

  ### Conclusion
  - **The Shape**: Two disputes under one label:  
    (a) Epistemic gap → Metaphysical gap? (substantive)  
    (b) What counts as "physical"? (substantive, not verbal).  
  - **Your Contribution**: Incremental Mary and Reverse Mary are especially potent. They force opponents to either accept unpalatable consequences (fact explosions, overgeneralization) or concede epistemic deflation.  
  - **Honest Answer**: Nothing will "end" it—consciousness debates are perennial. But progress occurs by **tightening the link between epistemic constraints and ontological commitments**. Your hypothesis does exactly that: *If Mary’s ignorance is about concepts or abilities, not facts, the argument collapses.* That’s not a stalemate—it’s a critical advance.
