  First, I need to unpack their hypothesis. They think anti-physicalists are focused on metaphysics—whether there's a feature of reality missing from the physical story—while physicalist responses address epistemology—Mary's concepts, abilities, etc. They suspect the leap from "Mary couldn't have known" to "there's something non-physical" is assumed without argument. That's a sharp observation. 

  The user also mentions confusion about what "physical" means, wondering if that's the real issue. Their flatmate, a neuroscientist, dismisses it as introspection being unreliable. The user created three thought experiments to test these angles: Incremental Mary, One-sentence Mary, and Reverse Mary. They want to know if these help untangle the stalemate and what progress would look like.

  Let me start with why the debate is stuck. The user is right—it's largely about the gap between epistemology and metaphysics. The anti-physicalist says Mary learns a new fact, implying a metaphysical gap. Physicalists counter that she gains abilities or new modes of presentation, which is epistemic. The core issue is whether "learning" in this context refers to gaining factual knowledge or something else. 

  The definition of "physical" is another layer. If "physical" only includes fundamental particles, then chemistry might not be physical, making the argument too broad. But if it includes all higher-level sciences, then Mary's new experience might still fit. This ambiguity keeps the debate circling.

