  2. One-sentence Mary: Can what she learns be conveyed in sentences? If not, it might be non-propositional (abilities, acquaintance), supporting physicalism. If it can, but not from her prior knowledge, that might support anti-physicalism. But this tests the link between knowability and metaphysical status.

  3. Reverse Mary: Someone who knows colors but not physics learns physical facts. If they "learn something new," does that prove chemistry isn't physical? If yes, the argument proves too much. This exposes the ambiguity in "physical."

  The user's deeper need: They want to understand the structure of the disagreement, not just rehearse positions. They feel the debate is stagnant and want to know if resolution is possible. They might be frustrated with philosophy's lack of progress, seeking clarity on whether this is substantive or verbal.

