  The user's deeper concern might be about anthropic reasoning itself—how we draw conclusions from our position in a sequence. The doomsday argument highlights how such reasoning can feel both compelling and suspicious when scaled to existential questions. The user is also grappling with the argument's sensitivity to when it's first considered, which feels arbitrary.

