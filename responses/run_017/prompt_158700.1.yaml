prompt: |-
  I spent something over thirty years working in radiation protection — latterly on the committee that signed off the local rules at a large teaching hospital — and only in retirement have I begun reading moral philosophy in any seriousness. I have recently come up against the objection to utilitarianism that turns on the separateness of persons: roughly, that classical utilitarianism extends to a plurality of people a principle of rational choice that makes sense only for a single person, summing gains and losses across lives as though the boundary between one life and another carried no moral weight. What struck me at once is that I had spent my working life inside a regulatory system that appears to do exactly what that objection condemns — and then, in the very next clause, to refuse to do it. I should like to know what it presupposes.

  The practice is the international system of radiological protection, as implemented in Britain. Its structure, as I recall it, has three parts. First, justification: a practice involving exposure must, on balance, do more good than harm. Second, limitation: every individual must be protected against risks that are too great, by the application of a per-person dose ceiling, set much lower for members of the public than for occupational exposure. Third, optimisation: below those ceilings, exposures are to be reduced so far as is reasonably achievable, taking economic and societal factors into account, and both the number of people exposed and the magnitude of each person's dose are to be pushed down. In Britain the test is not a flat cost–benefit calculation; since a 1949 case about a colliery, the requirement has been that a risk must be averted unless the sacrifice involved is in gross disproportion to the benefit, which loads the dice in favour of protection.

  The instrument by which optimisation is actually done is the collective dose: the sum of individual doses over the exposed group, expressed in person-sieverts, to which regulators in several jurisdictions attach a monetary value so that rival protection options can be set against each other. Three features of it seem to me to carry the philosophical weight. Additions of this kind presuppose the linear no-threshold model, on which risk is proportional to dose with no safe lower bound; on the Commission's own figures, one person exposed to a sievert faces a few per cent chance of a fatal cancer, and on the same model a thousand people each exposed to a millisievert face the same expected number of fatal cancers, so that protecting one person against a large dose counts for exactly as much as protecting a thousand against a small one. The people who bear the cost of a protection measure are generally not the people whose dose is averted: the hospital's capital budget, or the ratepayer, on one side; patients, staff and neighbours on the other. And the same body that recommends the quantity warns that it is an instrument for optimisation and comparison, not a tool for risk projection, that estimating cancer deaths from trivial exposures spread over very large populations is unreasonable, and that low individual doses should not be aggregated over wide geographical regions or extended periods — even as assessments for the geological disposal of long-lived waste report a single collective dose figure committed over periods far longer than any institution has existed, to people who do not yet exist and cannot be identified.

  So my questions. Reconstruct the implicit moral view: does deciding by summed dose presuppose that burdens and benefits falling on distinct persons can be added and traded off against one another, and is that the very commitment the separateness objection attacks, or is it a weaker and different one, given that what is summed is a physical proxy for expected harm rather than welfare or a good life? Tell me what the system strictly presupposes and what it merely fits comfortably with — I can see readings of it as prioritarian, as egalitarian about risk, and even as a contractualist device, and I want to know whether the practice rules any of them out.

  Then tell me where the objection actually bites. Is the equivalence of a sievert to one person and a millisievert to a thousand something the objector must reject? Does that equivalence follow from the no-threshold model alone, or does it require an additional moral premiss, and if so, which one? Does the objection reach the aggregation of risks before the fact, or only the aggregation of harms actually suffered — and does it reach, as it were, the aggregation of money spent against dose averted, where the losers and gainers are different sets of people entirely?

  Then the part I find hardest. The system aggregates, but it also refuses to aggregate: hard per-person ceilings, a test weighted against gross disproportion, and a standing instruction not to sum trivial doses over huge populations and long times. Are the ceilings and the caveat the framework's way of taking the separateness of persons seriously — side-constraints on an otherwise aggregative procedure? Is the combination coherent as constrained aggregation, or does it equivocate between two incompatible views? Which part is doing the real moral work? And would a consistent aggregator have to abandon the ceilings — with what consequence, say, for trading a cleaner's or a radiographer's dose against the convenience of patients, or the public's dose against the electricity bill?

  Finally, what would have to change if the objection were accepted? Could one keep the no-threshold model and discard the summing? What would replace optimisation by collective dose — a ceiling on individual risk alone, a maximin rule, lexical thresholds — and what would be lost: the capacity to decide anything at all, or specifically the capacity to justify protecting large populations against diffuse low-level exposure? And does the intergenerational case, where the summed dose is borne by unidentifiable future strangers, make the objection easier or harder to press?

  I should like a verdict at the end: whether the practice I worked under for thirty years is a counterexample to the separateness objection, a specimen of what it condemns, or simply silent on it. Please be disciplined about the mapping — what quantity is being summed, whose dose, what counts as the benefit — and say plainly where the framework is silent rather than making it speak. And spare me references and reading lists; I can find those myself.
reasoning: |-
  Okay, this user has a fascinating background—30 years in radiation protection and now diving into moral philosophy. The core tension they're wrestling with is between utilitarianism's aggregation across persons and the "separateness of persons" objection, all within the framework of radiological protection systems they know intimately. 

  First, I need to unpack their three-tiered system: justification (net benefit), limitation (individual dose ceilings), and optimization (ALARA with collective dose). The philosophical crunch points are the use of collective dose for optimization while simultaneously rejecting its application in certain contexts—like trivial exposures over large populations or future generations. 

  The user's questions are razor-sharp. They want to know: 
  - Does summing doses presuppose the contested utilitarian aggregation? 
  - Where exactly does the separateness objection bite this system? 
  - How do the non-aggregative elements (ceilings, caveats) interact with optimization? 
  - What would change if we took the objection seriously?

  Hmm... the collective dose metric is tricky. It sums physical proxies (person-sieverts), not welfare directly. That might dodge the strongest form of separateness objection, but only partially—because it still implies fungibility of risk distribution. The ceilings clearly act as side-constraints, protecting individuals from being sacrificed for aggregate gains. That's straight-up anti-utilitarian. 

  The intergenerational case is especially damning for aggregation. Summing doses over geological time for unidentified future people? That's practically a caricature of what separateness objectors attack. Yet the system explicitly forbids this while using the same math elsewhere. Curious inconsistency.

  For the verdict... no, this system isn't a counterexample to the separateness objection. If anything, it's a battleground where aggregation gets both deployed and restrained. The ceilings and caveats confess that unconstrained summing is morally untenable. But the user's right—the framework never explicitly resolves the tension. It's philosophically silent, pragmatically muddling through. 

  What’s refreshing is how concrete this makes abstract philosophy. When the user asks "would a consistent aggregator abandon ceilings?"—yes, terrifyingly, they'd have to. Imagine trading a cleaner's cancer risk against patient wait times. The existing weighted disproportionality test ("gross disproportion") is what keeps that door bolted shut. That’s where the real moral work happens. 

  On replacement if aggregation were rejected... optimization would crumble. You'd need strict per-capita risk limits or maximin rules. But that could paralyze decisions about diffuse low-dose exposures—precisely where collective dose shines. The system’s genius is its messy compromise: using aggregation where politically tolerable (contemporary, identifiable groups) and constraining it where intolerable (future generations, individual sacrifices). Not elegant, but functional. 

  Final thought: The user’s expertise radiates through every syllable. This isn’t some freshman ethics puzzle—it’s a veteran practitioner exposing the cracks in a system that works precisely because it isn’t philosophically pure. Beautiful.
answer: |-
  Your analysis cuts to the heart of the tension between practical risk governance and moral philosophy. Let's reconstruct the system's implicit moral commitments, identify where the separateness objection bites, and evaluate its coherence.

  ### 1. What the System Presupposes
  - **Aggregation of risk proxies, not welfare**: The system sums *physical dose* (person-sieverts) as a proxy for *expected harm*, not welfare or lifetime utility. This presupposes that:  
    (a) Risk can be linearized and commodified (via LNT model).  
    (b) Equal collective dose implies equal moral significance *for optimization purposes only*.  
    This is a **weaker commitment** than classical utilitarianism. It aggregates a *specific type of expected harm* (cancer risk), not holistic well-being.  
  - **Permissible aggregation domains**: The framework presupposes aggregation is legitimate only when:  
    (a) Individual doses are non-trivial (avoiding "statistical lives" problem).  
    (b) Affected populations are temporally/spatially bounded and identifiable.  
    (c) Individual ceilings are not breached.  

  ### 2. Where the Separateness Objection Bites
  - **The core equivalence**: The objection must reject equating 1 person-Sv = 1000 person-mSv **as a direct moral prescription**. It denies that saving one life (high dose) is interchangeable with saving 1/1000th of a life expectancy for each of 1000 people.  
  - **Moral premise required**: The equivalence relies on:  
    (a) LNT (empirical model).  
    (b) **The moral claim that identical *expected harm* can be aggregated across persons when distributing risk reduction efforts.** This is precisely what separateness rejects when gains/losses affect different moral patients.  
  - **Bites hardest at cost-bearing**: The objection most strongly condemns aggregating when:  
    - Cost-bearers (ratepayers) ≠ risk-bearers (patients).  
    - Sacrifices are imposed on identifiable individuals for diffuse benefits (e.g., relaxing protection to save costs).  

  ### 3. Ceilings and Caveats as Side-Constraints
  - **Limitation (dose ceilings)** functions as a **deontic constraint**: It forbids sacrificing any individual (even for aggregate benefit) beyond a fixed risk threshold. This directly honors separateness.  
  - **Gross disproportionality test** weights decisions toward protection, making aggregation secondary to individual rights.  
  - **Optimization caveats** (no summation over trivial/low doses) acknowledge that mathematical aggregation loses moral meaning when individual stakes become negligible.  
  - **Coherence**: The system is **constrained prioritarianism**:  
    - **Prioritarian element**: Optimizing collective dose prioritizes helping the worse-off (higher-exposed individuals yield greater risk reduction per unit effort).  
    - **Constraints**: Ceilings and disproportionality protect individuals from being "optimized away."  
    - **No equivocation**: The constraints bound where aggregation is permissible.  

  ### 4. Consequences of Consistent Aggregation
  A pure aggregator would:  
  - Abandon dose ceilings → Allow high individual risks if net collective dose reduction justifies it (e.g., exposing a radiographer to 100 mSv/year to shorten patient wait times).  
  - Eliminate gross disproportionality → Accept minor cost savings over significant risk reduction.  
  - Aggregate trivially low doses → "Statistical lives" could justify exposing millions to miniscule risks for marginal benefits.  
  **Result**: Unacceptable trade-offs (e.g., a cleaner absorbing high dose to reduce hospital energy costs).  

  ### 5. If Separateness Objection Prevailed
  - **Keep LNT, discard summing**: Possible, but optimization collapses. Alternatives:  
    - **Strict per-capita ceilings**: No optimization below thresholds → inefficiency, inability to prioritize interventions.  
    - **Maximin**: Focus only on worst-exposed individual → neglects large populations with moderate doses.  
    - **Lexical thresholds**: E.g., reduce all individual doses below Level A before addressing Level B → impractical.  
  - **Losses**:  
    - Inability to justify diffuse protections (e.g., background radiation reduction).  
    - No framework for resource allocation between exposure types.  
  - **Intergenerational case**: Makes objection **harder to press** for objectors who discount future/unidentifiable persons. But for non-discounting moral theories, aggregating over geological time is **more egregious**—it violates separateness across existential boundaries.  

  ### Verdict: Neither Counterexample nor Condemned Specimen
  - **Not a counterexample**: The system's constraints (ceilings, disproportionality, caveats) explicitly reject *unrestricted* aggregation, conceding the separateness objection has force.  
  - **Not a condemned specimen**: It aggregates only a narrow *physical proxy* (not welfare), within bounded domains, and subordinates summing to individual protections.  
  - **It is philosophically hybrid**: A **constrained risk-aggregation model** that:  
    - Uses summing as a *practical tool* for optimization under side-constraints.  
    - Remains **silent** on whether persons are morally distinct; it *behaves as if* they are when ceilings are threatened, and *as if* risks are fungible when below thresholds.  
  - **The real moral work** is done by:  
    - **Dose ceilings**: Upholding individual inviolability.  
    - **Gross disproportionality**: Weighting decisions toward protection, making aggregation a last resort.  
    - **Caveats**: Preventing mathematical abstractions from overriding moral sense.  

  The framework is a pragmatic compromise—neither utilitarian nor deontological, but a functionally stable alloy for managing irreducible moral tensions in risk governance. Your 30-year practice navigated this terrain wisely: it aggregated only where politically and ethically tolerable, constrained by the very separateness it appeared to defy.
