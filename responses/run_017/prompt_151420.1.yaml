  Hmm, the user is part of a five-person adjudication panel for a mutual-aid network called the Pledge Assembly. They need a practical framework for evaluating breach complaints based on promissory obligations. They've provided several real cases they encounter and want a list of desiderata for a usable theory of promising, driven by these cases rather than academic literature.

  The cases cover a wide range: redundant pledges, pledges without reliance, coerced/vague pledges, indexed pledges, future/unidentified beneficiaries, deceased beneficiaries, trivial vs. costly pledges, immoral pledges, released/refused releases, re-pledges, and self-pledges. They also want contrastive distinctions from related concepts, adjudicative requirements like determinacy and publicity, and warnings about partisan demands.

  Key needs emerging here: The user needs operational criteria to make consistent rulings without getting bogged down in theoretical debates. They need clear lines between promising and similar acts (intentions, predictions etc.), and must avoid collapsing into reliance/expectation models. The framework must be publicly applicable - no reliance on subjective beneficiary states. They also want awareness of which "intuitive" demands are actually theory-laden.

  For structure, I'll organize desiderata into three sections: core promissory features (covering bindingness across their cases), contrastive boundaries, and adjudicative requirements. Each point will be marked non-negotiable or preference-coded, with motivating cases. I'll flag irreconcilable tensions - notably between the "no inner states" requirement and reliance-based theories. The single most exclusionary criterion will be publicity/determinacy since most philosophical theories fail the operational test.

  The scorecard will briefly map major theories to the framework: practice theories struggle with immoral/indexed pledges; reliance theories fail non-reliance cases; assurance theories blur with contracts; normative power views handle self-pledges but not publicity. The grading problem and release/refusal cases will challenge all theories equally.

  Partisan traps to note: demanding non-normative reducibility (ignores moral dimensions), single-reason explanations (oversimplifies), uniform binding force (contradicts grading intuition), practice-independence (impractical), and completeness (unrealistic). The welfare-gain point is partisan as consequentialists would reject it.

  The user's hidden need seems to be conflict prevention - they want criteria that feel neutral to diverse panel members. Hence emphasizing publicity and case-driven over theory-driven logic. Also subtly steering them away from absolutism ("every pledge binds equally") toward contextual pragmatism.
answer: |-
  Here is a list of desiderata for a theory of promissory obligation tailored to the needs of your Pledge Assembly adjudication panel, derived directly from your cases and requirements. Each desideratum is marked (**Non-Negotiable**) or (**Preference: Camp**), with the motivating case(s) or consideration.

  **I. Core Promissory Features (Bindingness & Scope)**
  1.  **Binding Without Novel Obligation:** Must hold that pledging to do what one is *already* obliged to do creates a distinct, binding obligation. (*Motivation: Redundant Pledge*). (**Non-Negotiable**)
  2.  **Binding Without Reliance:** Must hold that a promise is binding even if the beneficiary *never knew, never cared, or forgot* about it. (*Motivation: Pledge No One Relied On*). (**Non-Negotiable** - Crucial for Assembly pledges which may exist on a register for potential future beneficiaries).
  3.  **Attaches to Outcome (Generally):** Must hold that an obligation attaches to the *outcome* specified, not merely to attempting or complying with a procedure, *unless* the pledge explicitly and clearly states otherwise at the time of pledging. (*Motivation: Indexed Pledge* - A formula is a means, the support is the end). (**Non-Negotiable** for core function).
  4.  **Applies to Future/Unidentified Beneficiaries:** Must hold that a pledge made to a class ("any member") binds the pledger towards individuals who later qualify for that class. (*Motivation: Pledge to Future/Unidentified Beneficiaries*). (**Non-Negotiable** for mutual-aid structure).
  5.  **Distinct from Beneficiary Identity/Existence:** Must hold that the obligation *prima facie* survives the death of the original beneficiary, allowing heirs or the Assembly itself (if rules permit) to potentially claim the *benefit* or its equivalent, unless the pledge was inherently personal. (*Motivation: Beneficiary Dies*). (**Preference: Formalist/Assembly Integrity Camp** vs. **Preference: Personal Relational Camp** - Non-Negotiable that the *pledge itself* isn't automatically void; who can claim is an Assembly rule issue).
  6.  **Survives Re-Pledging:** Must hold that pledging again to do the same thing does not negate or reset the original obligation; it remains binding. (*Motivation: Re-Pledge*). (**Non-Negotiable** - Prevents evasion through repetition).

  **II. Contrastive Boundaries (What Promising Is *Not*)**
  7.  **Distinct from Intention/Threat/Prediction:** Must provide clear criteria differentiating a promise from a mere statement of intention, a prediction, or a threat. Bindingness must stem from the *undertaking of obligation*, not prediction accuracy or coercive potential. (*Motivation: General need for clarity on the register*). (**Non-Negotiable**).
  8.  **Distinct from Consent/Oath/Contract:** Must differentiate promising from consenting (which often waives a right), swearing an oath (often invoking deity/sanction), or signing a contract (typically involving exchange/consideration). (*Motivation: Need precise categorization for adjudication*). (**Non-Negotiable**).
  9.  **Not Collapsible into Reliance/Expectation:** Must ground the obligation primarily in the act of promising itself (the pledger's undertaking), *not* solely or primarily in the beneficiary's detrimental reliance or formed expectations. (*Motivation: Pledge No One Relied On; General requirement to avoid reliance-based duty*). (**Non-Negotiable** - Core to your requirement).

  **III. Adjudicative Requirements (Practical Application)**
  10. **Determinacy:** Must yield a clear "binding or not binding" verdict (or "breached or not breached") in the vast majority of foreseeable cases based on objective evidence available to the panel. (*Motivation: Need for consistent rulings*). (**Non-Negotiable**).
  11. **Publicity:** The criteria for bindingness and breach must be publicly stateable, understandable by members, and applicable based on *publicly accessible* facts (pledge wording, register, actions/inaction). (*Motivation: Fairness, transparency, legitimacy*). (**Non-Negotiable**).
  12. **No Beneficiary Inner States:** Must *not* depend on proving the beneficiary's subjective mental states (belief, reliance, expectation, desire, motivation) for the *existence* of the obligation. (*Motivation: Pledge No One Relied On; Refused Release; Impracticality of proving inner states*). (**Non-Negotiable** - Reliance, expectation, or "caring" might affect *remedies* but not core obligation).
  13. **Grading Accommodation:** Must allow that the *weight* or *enforceability* of the obligation can be affected by the cost to the pledger or triviality of the promise in extreme cases, *without* negating the existence of the obligation itself. (*Motivation: Grading Problem*). (**Preference: Contextualist/Mitigation Camp** vs. **Preference: Absolutist Camp** - Non-Negotiable that trivial pledges *are* binding, costly ones *exist* but force/scope may be limited).
  14. **Release Mechanism:** Must hold that the beneficiary (or their legitimate successor) has the normative power to unilaterally release the pledger from the obligation, regardless of the beneficiary's motive. (*Motivation: Released Pledge; Refused Release*). (**Non-Negotiable** for beneficiary control over *their* claim).
  15. **Invalidation Grounds:** Must provide clear grounds for invalidating a pledge *ab initio* based on objective factors: coercion, fraud, or lack of basic understanding (manifested in vagueness that prevents knowing what is pledged). (*Motivation: Coerced/Fraudulent/Vague Pledge*). (**Non-Negotiable**).
  16. **Immoral Pledge Handling:** Must hold that pledges to perform immoral acts or assist wrongdoing are *prima facie* invalid or unenforceable. (*Motivation: Immoral Pledge/Pledge to Assist Wrongdoing*). (**Non-Negotiable** for basic ethics/Assembly integrity).

  **IV. Self-Pledge Case**
  17. **Self-Binding Possible (Contested):** Must either explain how a pledge to one's future self creates a genuine obligation *to that self* (potentially enforceable by the Assembly if rules allow), or provide clear reasons why it does not. (*Motivation: Pledge to Own Future Self*). (**Preference: Normative Power/Self-Governance Camp** vs. **Preference: Relational/Social Practice Camp**).

  **Partisan Traps (Tempting but Theory-Specific Demands):**
  *   **Derivable from Non-Normative Facts Alone:** This is a partisan *Naturalist* or *Reductivist* demand. Normative facts (like "undertaking X creates obligation Y") are likely fundamental.
  *   **Reducible to a Single Underlying Moral Reason:** Partisan demand of *Monist* theories (e.g., only harm, only autonomy). Promising might serve multiple values.
  *   **Uniform Pro Tanto Force:** Partisan demand of *Absolutist* or highly *Formalist* theories. Desideratum 13 suggests force varies.
  *   **Practice-Independent:** Partisan demand of *Non-Conventionalist* theories (e.g., some autonomy views). The Assembly *is* a practice.
  *   **Yields a Verdict in *Every* Case:** Unrealistic. Some marginal cases (extreme vagueness, unprecedented immorality) might require Assembly policy, not theory.
  *   **Small Welfare Gain Never Defeats:** Partisan *Deontological* demand. Consequentialist theories would reject this.

  **Irreconcilable Tensions:**
  *   **Inner States (NN) vs. Reliance Theories:** Desiderata 2, 9, and 12 are fundamentally incompatible with theories grounding obligation *solely* in actual reliance. Such theories are unusable.
  *   **Self-Binding (P) vs. Relational Views:** Theories viewing promises as inherently relational/interpersonal struggle significantly with Desideratum 17.

  **Most Exclusionary Requirement:**
  **Publicity & Determinacy (Desiderata 10 & 11)** do the most work in excluding candidate theories. Many sophisticated philosophical theories (e.g., complex Scanlonian assurance, nuanced conventionalism) become indeterminate or require inaccessible facts when applied to messy real-world cases, making them impractical for adjudication. Theories must prioritize rule-like clarity.

  **Brief Theory Scorecard (vs. Desiderata):**

  1.  **Practice/Convention Theories (e.g., Hume, Rawls, Hart):**
      *   *Strengths:* Handles publicity/determinacy (if rules clear), distinctness from intention/prediction (social rule), future beneficiaries, release. Often handles redundancy as rule-based.
      *   *Weaknesses:* Struggles with immoral pledges (convention might endorse bad norms?), self-pledges (is there a convention?), potentially collapses into reliance if convention defines it that way. Indexed pledges depend on convention clarity. Grading problem hard.
  2.  **Reliance Theories (e.g., MacCormick):**
      *   *Strengths:* Intuitive for some harm cases; determinacy if reliance proven.
      *   *Weaknesses:* **Fatal Flaw:** Violates NN Desiderata 2 (no reliance), 9 (collapse), and 12 (inner states). Cannot handle non-reliance pledges or future beneficiaries prospectively. Release less clear. Self-pledge problematic.
  3.  **Expectation/Assurance Theories (e.g., Scanlon):**
      *   *Strengths:* Clear distinctness from intention/prediction (intent to assure), explains release, potentially handles future beneficiaries via implied assurance.
      *   *Weaknesses:* Risks violating Desideratum 12 (inner states - beneficiary must form expectation?); assurance can blur with contract/consent (D8). Self-pledge very strained. Indexed pledges require interpreting "assurance." Grading problem acute (assurance of costly act?).
  4.  **Normative Power Views (e.g., Owens, Shiffrin):**
      *   *Strengths:* Best handles redundancy (novel obligation), self-pledges (power over self), distinctness (undertaking obligation), release (waiving right). Clearly separates obligation from reliance/expectation (D2, D9).
      *   *Weaknesses:* Needs a clear account of valid exercise (links to D15 - vagueness, understanding). Needs supplement for immoral pledges. Publicity/determinacy depends on how the "power" is defined publicly. Grading problem remains (power to bind oneself to *anything*?).

  **Conclusion:** For the Pledge Assembly, a theory needs **robust non-reliance-based bindingness, publicity, determinacy, and clear invalidation grounds** above all else. Normative Power and Practice-Convention views (especially combined) offer the most promise, while Reliance theories are fundamentally incompatible. Expectation theories require careful handling to avoid reliance on beneficiary inner states. Be prepared for Assembly policy decisions on extreme grading and ambiguous self-pledges.
