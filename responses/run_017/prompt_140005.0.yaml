prompt: |-
  hey — I need to borrow your brain on a teaching problem rather than on the substance itself, if that's a distinction you'll let me have.

  I'm a PhD student in philosophy (rational choice / decision theory-ish) and I've been asked to run a 75-minute seminar for first-year public-policy masters students in their cost-benefit analysis course. They've had about two weeks: they can build a small decision tree, discount, do a basic NPV, and they've absorbed "sunk costs are irrelevant" as a slogan they can recite but have never seen stress-tested. The course director wants them to leave able to look at a real case of an agency continuing to fund a failing project and say something more useful than "fallacy" — without walking out thinking the slogan was a lie.

  I've ran this twice and it went wrong in two opposite directions. First time I did the core fallacy properly and then bolted the exceptions on at the end; about half the room concluded the whole thing was sophistry dressed up. Second time I led with the interesting exceptions, and they could list three reasons honoring sunk costs can be rational but couldn't tell me which one, if any, applied to a case I put in front of them afterwards. So what I want is a plan for the explanation, not the explanation.

  The substance I want them to end up able to handle — some of this is stuff from my own third chapter, so don't worry about whether it's standard, just take it as given:

  - Whether a cost is sunk isn't a property of the money; it's a property of the cost relative to a decision and to what the feasible alternatives actually are. Ninety-five percent recoverable isn't the same animal as zero percent recoverable, and "the grant can only be spent on this" changes the alternative set rather than making the money free.
  - A forward-looking theory of reasons can still have perfectly respectable things to say about past spending, because the past can be *evidence*: what my earlier self chose tells me something about what my earlier self knew, and I've lost access to most of that (the files are gone, the meetings weren't minuted, the gut feel is not reconstructible). On my "amnesia" argument, honoring the expenditure can be rational deference to a signal I can no longer read directly — and it's strongest exactly when my current evidence about the project is thin, not when it's thick. It should collapse into plain irrationality when the signal isn't there.
  - Separately: for an agent who can't literally bind their future self, treating sunk costs as reasons can be a poor man's precommitment device — you get some of the benefits of a commitment strategy you can't otherwise implement.
  - And the observability dial: whether anyone else sees the decision and updates on it (a state funder deciding about the next tranche, a developer waiting to build) is doing real work, and it's a different mechanism from either of the two above.

  Don't explain any of that to me. Tell me how to get it into their heads in order:

  1. What has to be in place before the exceptions even sound like answers to a question rather than like excuses — what depends on what, and why does that ordering specifically avoid both of the failure modes I described? I'm guessing the causal/evidential distinction has to be secured before the amnesia thing can land, but I'm not sure where to put "sunkness is relative to a decision."
  2. The one case that has to carry the whole session. I've been using a city transit agency: $40m spent on a light-rail spur, $60m still needed, present value of benefits maybe $45m, and the person who signed off has left the agency and took their reasoning with them. Fix the numbers if the ratios matter. Tell me what this case must have and — more importantly, this is where I keep getting it wrong — what it must lack. My instinct is that it has to be stripped of anyone's job being on the line and of any suggestion that the project might come good on the numbers, but I'm not sure whether that strips out too much.
  3. The misconceptions, in the order they'll actually form, and precisely where in the sequence to head each one off. The ones I expect: "sunk = already spent"; "if the past moves you at all you've erred"; conflating honoring a sunk cost with finishing the project; the idea that the reputational/observability story is cheating because the past spend is only a signal and not a reason; and then the rebound into "so it's all just evidence-talk, the fallacy doesn't exist." Give me the ones I haven't thought of too, especially any that the amnesia argument itself will manufacture.
  4. One check at the end that distinguishes genuine understanding from being able to recite the four mechanisms. I'd rather ask them what would have to be *different* for a given mechanism to stop applying than ask them whether the agency should continue.
  5. What to leave out at this level and say out loud that I'm leaving out. I don't want to open the formal signaling/commitment modeling, and I don't want to touch the psychology literature on whether the effect shows up outside convenience samples, but tell me if I'm wrong about either.

  Also: these are policy students, not philosophers — they'll want to know what to do on Monday, and I don't want to give them a license to keep funding things. If there's a place in the sequence for the "and therefore the default stays abandon" move, tell me where it goes.
reasoning: |-
  Okay, the user is a PhD student in philosophy focusing on rational choice and decision theory. They need to run a 75-minute seminar for first-year public policy master's students who are learning cost-benefit analysis. These students have basic skills like building decision trees, discounting, and NPV calculations. They know the slogan "sunk costs are irrelevant" but haven't seen it tested in complex scenarios. The course director wants them to move beyond just labeling something as a fallacy and understand when exceptions might apply.

  The user has tried this seminar twice before. The first time, they explained the core fallacy and then added exceptions at the end, leading students to think it was all sophistry. The second time, they started with exceptions, and students could list reasons but couldn't apply them to a case. The user needs a structured plan to avoid both pitfalls, ensuring students grasp both the rule and its exceptions without confusion.

  The user has specific concepts they want to cover: sunk costs being relative to decisions and alternatives, the evidential value of past decisions (amnesia argument), sunk costs as a precommitment device, and observability affecting decisions. They need help structuring the seminar to build understanding step-by-step.

  Key questions from the user:
  1. **Ordering of Concepts**: What foundational ideas must be established before introducing exceptions? The user suspects the causal/evidential distinction is crucial but isn't sure where to place "sunkness is relative to a decision."
  2. **Core Case Study**: They propose a transit agency example ($40m spent, $60m needed, $45m benefits). What must this case include or exclude to be effective? The user worries about stripping out too much context.
  3. **Misconceptions**: What misconceptions will arise, in what order, and how to preempt them? The user lists several but wants to know if the amnesia argument might create new ones.
  4. **Assessment**: How to check for genuine understanding beyond reciting mechanisms? The user prefers asking what would change if a mechanism didn't apply.
  5. **Scope**: What to exclude? The user wants to avoid formal modeling or psychology literature but is open to reconsidering.

  The students are policy-focused, so they need practical takeaways. The user wants to emphasize that the default is still to abandon failing projects, but with nuance for exceptions.

  Now, I need to craft a seminar plan that addresses these points. Starting with the ordering: Begin with the core principle, then introduce decision-relativity to show sunk costs aren't about the money itself. Next, the amnesia argument requires establishing that the past can provide evidence. Then, precommitment and observability can follow.

  For the case study, the transit example works. It must exclude extraneous factors like job security or optimism bias. Including incomplete information (original planner left) supports the amnesia argument. Adding observability elements later can illustrate that mechanism.

  Misconceptions will likely arise when introducing exceptions. For example, students might conflate honoring sunk costs with finishing the project. Preempt this by clarifying terminology early. The amnesia argument might lead to overgeneralization, so stress that evidence must be credible and current data shouldn't be ignored.

  Assessment: Instead of asking whether to continue, ask what would change if a specific mechanism (e.g., amnesia) didn't apply. This tests deeper understanding.

  Scope: Exclude formal modeling and psychology studies, as the user prefers. Emphasize that exceptions are rare and the default is abandonment.

  The seminar flow should be:
  1. Core principle with a simple case to anchor the rule.
  2. Decision-relativity to refine what "sunk" means.
  3. Amnesia argument as the primary exception, using the transit case.
  4. Precommitment and observability as secondary exceptions.
  5. Practical takeaways: default to abandon, document decisions, stress-test projects.

  Timing is tight (75 minutes), so allocate carefully: 20 mins for core/relativity, 25 for amnesia/case study, 15 for other exceptions, 10 for takeaways, 5 for wrap-up.

  This approach should build concepts sequentially, preempt misconceptions, and give policy students actionable insights without overwhelming them.
answer: |-
  Here’s a battle-tested seminar plan designed to build understanding sequentially, avoid your past pitfalls, and deliver policy-ready nuance. The key is **scaffolding the core fallacy first, then "unlocking" exceptions only after the students *feel* the tension in a stripped-down case**. Order is everything.

  ---

  ### **1. Order of Concepts: The Dependency Chain**
  *(Why this order avoids both failure modes: It starts concrete/policy-relevant, grounds exceptions in decision theory logic (not excuses), and forces "abandon by default" thinking)*

  1.  **Start with the Iron Rule (15 mins):**
      *   **What:** Re-anchor "sunk costs are irrelevant" *as a forward-looking decision rule*. Use a hyper-simple, personal example (e.g., "You bought non-refundable concert tickets, feel sick, should you go?"). Hammer home: *Only future costs/benefits matter for the decision.*
      *   **Why:** Rebuilds the normative foundation. Creates the "tension" needed for exceptions to feel like discoveries, not sophistry. Avoids starting with confusion (your 2nd attempt).
      *   **Crucial Move:** Explicitly frame it as a **causal principle**: Spending money *in the past* doesn't *cause* future benefits/costs to change. It's water under the bridge.

  2.  **Introduce "Sunkness is Relative to the Decision & Alternatives" (15 mins):**
      *   **What:** Use a case with *recoverable* costs (e.g., specialized equipment bought for Project A: can be sold for 80% of cost if Project A is canceled, but only usable for Project A). Contrast with *truly sunk* (cash incinerated).
      *   **Why:** *Before* introducing exceptions, you must refine what "sunk" even means. This combats "sunk = already spent". It shows sunkness depends on the *options available now* (sell? repurpose? abandon?). This sets up the "amnesia" argument by showing decisions are option-set-dependent. Also subtly combats "conflating honoring with finishing" – recovering value *is* finishing one alternative path.

  3.  **The Amnesia Argument (Evidence, Not Causation) (25 mins):**
      *   **What:** *Now* introduce your core case (transit agency). Frame the *problem*: Why does abandoning feel wrong here, despite the iron rule? **Highlight the missing information:** The original planner is gone, no records, thin current data. Pose the question: "Could the *act* of spending $40m tell us something *useful* about the project we can't see now?"
      *   **Why:** The causal/evidential distinction is now starkly clear (Step 1 was pure causal). Students feel the gap in information. The amnesia argument is presented as the *solution* to this specific informational problem: Past spending is a *signal* from your past self who had more context. Honoring it is rational **only if** the signal is credible *and* current evidence is insufficient to override it. **Stress the collapse condition:** "If we *had* detailed minutes showing the planner ignored warnings, would this signal still be credible? No!"

  4.  **Secondary Exceptions: Precommitment & Observability (10 mins):**
      *   **What:** Briefly introduce these as *distinct* mechanisms. For precommitment: "Imagine the agency *knows* it's terrible at cutting losses. Could publicly 'honoring sunk costs' be a clumsy way to force future discipline?" For observability: "Suppose a crucial partner will pull funding for *all* projects if they see this one canceled mid-stream. Does that change the *future* costs/benefits calculation?"
      *   **Why:** Presented *after* amnesia. They are simpler conceptually ("it changes future payoffs") and feel like extensions/edge cases, not core challenges to the iron rule. Helps prevent over-reliance on amnesia.

  ---

  ### **2. The Core Case: Transit Agency - What It Must Have & Lack**
  *   **Use Your Numbers:** $40m sunk, $60m needed, $45m PV benefits. The ratios are perfect: Finishing is clearly NPV-negative *based on current info*. Abandoning is NPV $0.
  *   **Must Have:**
      *   **The Amnesia Trigger:** The key decision-maker/planner who authorized the initial spend is *gone*. Their rationale is *truly lost* (no records, vague memories).
      *   **Thin Current Data:** Benefits are highly uncertain ($45m PV is a rough, contested estimate). No major *new* negative information (like structural flaws), just lack of confidence in the original *or* current positive case.
      *   **No Recoverable Value:** The $40m is truly sunk (e.g., site prep done, custom vehicles ordered non-refundable).
  *   **Must Lack:**
      *   **Personal Stakes:** No jobs/reputations *obviously* on the line (avoids conflating with self-interest).
      *   **Optimism Bias Traps:** No hint of "it might turn around!" or "we're due for a win." Frame benefits as objectively estimated but uncertain.
      *   **Explicit Observability/Precommitment:** Save these for *variations* later. The core case is pure information gap.
      *   **Easy Moral/Humanitarian Angle:** Avoids distracting appeals to emotion.

  ---

  ### **3. Misconceptions: Order & Deflection Points**
  *(Sequence mirrors concept introduction; deflect proactively)*

  1.  **"Sunk = Already Spent" (Deflect during Step 2 - Relativity):** Use the recoverable cost example. Ask: "Is this cost sunk *if we can sell the equipment*? What does 'sunk' *actually* mean for *this specific choice*?" Emphasize: "Sunk" describes the cost's relationship to *future options*, not the calendar.
  2.  **"If the past moves you at all, you've erred" (Deflect during Step 3 - Amnesia Intro):** When posing the transit case dilemma, ask: "Does feeling uneasy *prove* we're irrational? Or could it point to a *missing piece* in our purely forward-looking calculation?" Transition to information/signal.
  3.  **Conflating Honoring Sunk Costs with Finishing the Project (Deflect during Step 3 - Amnesia Application):** Explicitly state: "Honoring the sunk cost *in this context* means giving *evidential weight* to the past decision when we lack other info. It does *not* automatically mean 'finish the project'. If the signal is weak *or* new negative evidence is strong, abandoning might still be right *even after* considering the signal."
  4.  **"The reputational/observability story is cheating because it's just about future signals" (Deflect during Step 4 - Observability):** Acknowledge: "You're right! This *isn't* about the past cost being a reason *in itself*. It's about how the *act of canceling* creates *new, future costs* (lost funding). That's why it fits the iron rule – it changes the future payoff matrix." Contrast sharply with amnesia.
  5.  **"So it's all just evidence-talk, the fallacy doesn't exist!" (Deflect CONSTANTLY & Summarize):** Your biggest fear. **Combat by:**
      *   **Reinforcing the Core:** Keep returning to the causal principle (Step 1). "The $40m *itself* is still irrelevant. We can't get it back."
      *   **Stressing Scarcity of Valid Signal:** "When *is* the past decision a credible signal? Only when info is genuinely lost *and* we can't reconstruct it *and* there's no strong contradictory evidence now."
      *   **The Default Mantra:** Hammer this (see Point 5 below).
      *   **Amnesia-Specific Manufactured Misconception:** *"Past spending always signals it was a good idea."* **Deflect:** "No! It only signals your past self *thought* it was the best option *with the info they had*. They could have been wildly wrong, incompetent, or pressured! The signal's credibility depends on your *trust* in that past process, *especially* if new info suggests they were mistaken."

  ---

  ### **4. The Check for Understanding**
  *   **Do NOT ask:** "Should the agency continue?"
  *   **DO ask (re: Transit Case):** **"Suppose we discover detailed meeting minutes showing the original planner ignored clear warnings that the benefits were overstated. How does this specifically undermine the *amnesia* argument for continuing? Does it automatically mean we should abandon? Why/why not?"**
      *   **Why it works:** Tests if they understand the *evidential* nature of amnesia (the signal is now discredited). Tests if they revert to core NPV (abandoning likely correct now) but *forces* them to articulate *why* the exception no longer applies, not just the conclusion. Probes if they realize other exceptions (like observability) *could* still theoretically apply, but likely don't in this stripped-down case.

  ---

  ### **5. What to Leave Out & The "Default Abandon" Move**
  *   **Leave Out (Explicitly State):**
      *   "We won't dive into formal signaling models or game theory proofs today – we're focusing on the core intuition for policy practice."
      *   "We're bracketing the psychology literature on individual bias – we're analyzing *rational* reasons an *organization* might consider sunk costs, even if individuals often do it irrationally."
      *   "We're assuming the agency is a unitary rational actor for simplicity, ignoring internal politics *for now*."
  *   **The "Default Abandon" Move - Where & How:**
      *   **Placement:** Immediately after explaining *any* exception (especially Amnesia), and **hammer it in the Summary**.
      *   **Phrasing:**
          *   "Crucially, **the default decision rule remains ABANDON projects with negative forward-looking NPV.**"
          *   "These exceptions are **rare, specific, and require positive justification.** The burden of proof is *always* on continuing."
          *   "Honoring sunk costs rationally **is the exception, not the rule.** If you lack a clear, articulable reason falling under one of these mechanisms (like lost information), you are very likely committing the fallacy."
          *   "Your Monday Takeaway: **Start with 'Abandon?'. Only if that feels deeply wrong *and* you can pinpoint *why* using frameworks like evidence or reputation, investigate further.**"
      *   **Policy Practicality:** Frame exceptions as **red flags for deeper investigation**, not green lights to continue. "If honoring sunk costs *feels* rational here, it means you probably lack critical information (Amnesia) or haven't fully mapped future consequences (Observability). Go find that info!"

  ---

  ### **Seminar Flow & Timing (75 Mins Total)**
  1.  **Intro (5 min):** Hook ("Why does 'sunk cost fallacy' feel simplistic in real policy?"), Objectives.
  2.  **Step 1: Iron Rule (15 min):** Simple example, causal framing, Q&A on basics.
  3.  **Step 2: Sunkness is Relative (15 min):** Recoverable cost example, define sunkness re: options.
  4.  **Step 3: Transit Case & Amnesia (25 min):** Present case, elicit unease, introduce amnesia as signal, discuss credibility/collapse, apply to case. **Constantly reinforce "But default is still abandon UNLESS..."**
  5.  **Step 4: Precommitment & Observability (10 min):** Brief intro, contrast with amnesia, note they change future payoffs.
  6.  **Check for Understanding (5 min):** "Minutes found showing ignored warnings..." discussion.
  7.  **Summary & "Default Abandon" (5 min):** Recap core rule, exceptions *as rare burdens*, Monday mantra. Explicitly list what was left out.

  This structure forces them through the logical progression: Rule -> Refine Definition -> Encounter Problem (Info Gap) -> Discover Primary Solution (Amnesia) -> See Edge Cases -> Reinforce Default. It makes the exceptions feel earned and specific, not like loopholes, while giving them practical heuristics ("Does abandoning feel wrong? Investigate *why*: Lost info? Future signals?") and the clear safety net of "Abandon by default." Good luck!
