prompt: |-
  I am writing the second chapter of my thesis, on whether the information idiom in molecular biology is doing explanatory work or is an elaborate heuristic, and I have got myself into a position I cannot accept and cannot locate the fault in. The argument below is my reconstruction of a line I have been pushing in our reading group; several people there are molecular biologists who are impatient with philosophers telling them their practice is confused, and I would rather not have to tell them that either. I would be grateful for a diagnosis.

  (1) Molecular biology is committed to DNA carrying information in a sense that is not merely decorative: codons specify amino acids, regions are annotated as coding or non-coding, polymerases are described as reading, and mutations are described as errors that proofreading and repair machinery corrects. If this talk were only a façon de parler, the chapter would be short; I take it that it is not.

  (2) Suppose DNA carries information merely in the sense in which one state carries information about another whenever the two are reliably correlated, with nothing required to be reading the one as a sign of the other. Then information is everywhere: tree rings carry information about rainfall, smoke carries information about fire, a footprint carries information about the animal that made it. In that sense genes carry information, but so does everything, and the idiom seems to add nothing to ordinary causal talk. So on the correlational reading the notion is trivial and does none of the work biology wants from it.

  (3) For the notion to be distinctive, it must be the sort of thing that can go wrong. A codon can specify the wrong amino acid; a sequence can mislead the machinery that acts on it; a message can be corrupted. Pure correlation cannot be wrong. A footprint is never a false footprint, and tree rings do not lie. So genetic information must be semantic: it must have content capable of misrepresentation.

  (4) The only naturalistically respectable way to get content capable of misrepresentation, so far as I can see, is to fix a state's content by its function, understood as what it was selected to do. A given codon means leucine rather than merely causing leucine to be inserted because codons of that type were selected for producing leucine. Selection history supplies the distinction between what a state does and what it is supposed to do, and misrepresentation is doing the latter's failing.

  (5) But then anything lacking the relevant selection history carries no information at all: newly arisen sequences on their first replication cycle, sequences whose effects are incidental by-products of neighbouring function, transcripts that happen to be produced and do nothing, and, most awkwardly, the constructs of synthetic biology, which molecular biologists describe in perfectly informational terms on the basis of a design and not of a history. Yet these descriptions are empirically fruitful, which they should not be if they are empty.

  (6) Worse, on this account a code needs a reader, and in the actual cell the reader is itself part of the message: the transfer RNAs and the enzymes that charge them are themselves products of the very system they interpret. The interpretation of the code appears to be encoded in the code, which looks less like a grounding of content than like a circle.

  (7) So either genetic information is trivial, or it is restricted in a way that makes a great deal of successful molecular biology illegitimate, or it rests on a circular account of interpretation. I cannot accept any of the three, and my own suspicion is that something illegitimate happens in the move from (3) to (4): I have been offered the reply that genes are distinctive not as bearers of content but as causes of a specific kind — causes that make a difference to which outcome occurs, in a way that cytoplasm or ambient temperature does not — and I do not see how this answers the difficulty, since a specific cause cannot be mis-specific, and my worry in (3) was precisely about being wrong.

  Which step do you reject, why does it look fine as written, and what does rejecting it cost me? I would like, if I can, to retain (1) and (5) — I do not want to tell the molecular biologists in the room that their practice is confused — and I am more willing than not to give up (4) if something better can be put in its place. Please price the alternatives as well as naming the step: in particular, tell me what I would have to say about mutations being errors, and about the arbitrariness of the codon-to-amino-acid mapping, on each of the options you canvass.
reasoning: |-
  Okay, the user is working on their thesis about whether the information idiom in molecular biology is explanatory or just a heuristic. They've laid out a structured argument and are stuck because all paths lead to unsatisfactory conclusions. Let me unpack their dilemma step by step.

  First, they state that molecular biology relies on informational language—codons specifying amino acids, polymerases reading DNA, mutations as errors. If this were just metaphorical, their chapter would be short, but they believe it's substantial. This makes sense; dismissing it as mere metaphor undermines the depth of their thesis.

  Next, they argue that if information is just reliable correlation, it becomes trivial. Smoke correlates with fire, tree rings with age—everything carries information. But genes are treated differently, so this view doesn't capture what's special about genetic information. I see their point; equating it with correlation dilutes its biological significance.

  Then comes the key move: genetic information must allow for error. A codon can mis-specify an amino acid, unlike tree rings which can't lie. So they conclude genetic information must be semantic, involving content that can be false. This seems logical—without the possibility of error, the concept loses its explanatory power.

  But step four links this to natural selection. Content and misrepresentation come from a trait's evolutionary function. A codon means leucine because it was selected for producing leucine. This grounds semantics in history. However, the user points out problems: synthetic biology constructs lack evolutionary history but are described informationally. Also, the machinery interpreting the code is itself encoded in DNA, creating a circle.

  The user rejects triviality, illegitimacy of practices, and circularity. They suspect the issue is between steps three and four. They mention an alternative: genes as specific causes that determine outcomes, but worry this doesn't handle error.

  Hmm. The core tension is between needing semantic content for error and the problems with grounding it in selection history. The user wants to preserve biologists' practices without circularity or excluding synthetic cases. They need a way to have error without history.

  Let me explore alternatives. Biosemantics (Millikan) ties meaning to selection history, but faces the synthetic biology issue. Maybe organizational invariance or causal specificity offers a way out. Causal specificity measures how precisely a cause affects outcomes. DNA has high specificity; changing a codon changes the amino acid. Mutations could be errors relative to typical function, not semantics. But does this satisfy the error condition?

  The user might accept that "error" is teleonomic—based on current function, not history. Synthetic constructs have intended functions by design. Mutations disrupt typical function, hence errors. This avoids history but keeps the idiom. Circularity? The machinery is made by the system, but if function is organizational (maintaining the system), it might not be vicious. 

  Costs: Giving up semantic content for functional deviation. "Specify" becomes about causal specificity, not meaning. The codon-amino acid mapping's arbitrariness remains due to alternative codes, but doesn't require semantics. Biologists might accept this as practical without deeper confusion.

  The user's identity: A philosopher engaging with biologists, wary of dismissing their practices. Their need: A coherent account that validates informational talk without metaphysical baggage. Deep down, they want to resolve the tension without alienating biologists or oversimplifying.
answer: |-
  Your argument is rigorous and exposes genuine tensions in the information idiom. The flaw lies in **Step (4)'s claim that selection history is the *only* naturalistically respectable way to get semantic content capable of misrepresentation.** This step is both too strong and unnecessary for salvaging the explanatory value of informational talk in biology. Rejecting (4) allows you to preserve (1) and (5), avoid triviality, and resolve the circularity concern, albeit at a specific cost.

  **Diagnosis & Rejection of Step (4):**

  1.  **Why Step (4) Looks Fine As Written:** It draws on powerful and plausible theories of teleosemantics (Millikan, Dretske). Selection history *is* a major naturalistic candidate for grounding "aboutness" and error. It provides a clear distinction between function and malfunction (e.g., a heart *should* pump blood; if it doesn't, it malfunctions). Applying this to representation seems natural: a codon *should* cause leucine insertion; if it causes serine due to mutation, it misrepresents/malfunctions. It avoids vitalism or unexplained normativity.

  2.  **Why Step (4) is the Fault:**
      *   **Problem 1: Exclusion of Synthetics & Novelty (Your Point 5):** As you brilliantly note, grounding content *solely* in selection history renders informational talk illegitimate for novel sequences, synthetic constructs, or incidental products. Yet, biologists *do* use informational language here (e.g., "this engineered promoter *expresses* the GFP *gene*," "this non-coding RNA *regulates* X"). This language is empirically productive and guides experiment design. Step (4) forces you to dismiss this vast area of successful practice as confused, which contradicts (1) and your desire not to tell biologists they're wrong.
      *   **Problem 2: Circularity (Your Point 6):** The "reader" problem is profound. If the machinery interpreting the "message" is itself specified *by* the message, grounding meaning *externally* via selection history becomes problematic. The selection history of the tRNA synthetase gene is intertwined with the history of the codons it "reads." While not necessarily a *vicious* logical circle (it's co-evolution), it complicates the claim that selection history provides a clean, *external* grounding for the code's semantics. The meaning seems partly constituted by the system's organization *now*.
      *   **Problem 3: Overstatement of "Only Way":** Teleosemantics isn't the *only* naturalistic game in town. Alternative approaches focus on current systemic organization, causal structure, or control hierarchies, rather than historical origins, to ground normativity and "aboutness" within a functioning system.

  **The Alternative: Organizational Teleonomy (Replacing Step 4)**

  Reject the *necessity* of selection history. Instead, ground the normativity required for "error," "specify," and "function" in **current, organized teleonomy**.

  *   **Core Idea:** A system (like a cell) is organized to maintain itself, replicate, and perform specific activities. Components within this system have *current functions* defined by their causal role in sustaining this organization and achieving the system's inherent or designed goals (e.g., protein synthesis, metabolism, replication). "Error" occurs when a component fails to perform its current function within this organized system, relative to the system's typical state or goals. "Specification" reflects the highly specific causal role a component (like a codon) plays within this functional organization.
  *   **How it Solves the Problems:**
      *   **Synthetics & Novelty (Problem 1):** An engineered gene in a synthetic construct has a *designed function* within the *engineered system*. Its "meaning" (specifying an amino acid) comes from its *intended causal role* in that artificial, yet organized, system. A mutation in it is an "error" because it disrupts the designed function. Similarly, a newly evolved sequence acquires its function (and potential for error) once it is integrated into and maintains the organism's current organization, even before significant selection history accumulates.
      *   **Circularity (Problem 2):** The "meaning" of the codon isn't grounded *externally* by history, but *internally* by its specific, context-dependent role within the *current* network of interactions (tRNAs, synthetases, ribosomes) that constitute the translation machinery, which itself is a functional component of the self-sustaining cell. The interdependence isn't a vicious circle but a hallmark of organized complexity. The normativity arises from the requirement for the *entire system* to function cohesively now.
      *   **Triviality (Problem 2):** Information isn't trivial because it's tied to *highly specific causal roles within a complex, goal-directed system*. Tree rings correlate with age, but they aren't *for* signaling age *within* the tree's functional organization (they are structural byproducts). A codon, within the translational machinery, *is specifically for* causing the insertion of a particular amino acid. Its causal role is far more specific and functionally integrated than mere correlation.
      *   **Misrepresentation (Your Core Concern):** A mutation is an "error" *relative to the typical, functional operation of the current system*. The wild-type codon sequence has a specific functional role (causing leucine insertion) established by its place in the organized machinery. A mutant codon fails to perform *that specific, expected function* within the system, leading to a dysfunctional outcome (e.g., misfolded protein). This "failing at its job" is the misrepresentation, grounded in the *current* teleonomy of the system, not its history.

  **Costs and Implications of Rejecting Step (4) & Adopting Organizational Teleonomy:**

  1.  **Cost to Semantic Ambition:** You give up the claim that DNA carries information in a *full-blooded semantic sense* like human language (with intentionality, "aboutness" independent of the system). Information becomes "functional information" or "causal specification within an organized, teleonomic system." It's normative and error-prone, but the normativity is system-immanent, not derived from external history. This may disappoint philosophers seeking strong semantics but aligns better with biological practice.
  2.  **Implications for Mutations as Errors:** Mutations are errors *relative to the typical functional role of the sequence within the current organized system and its goals* (e.g., producing a functional protein, regulating a gene appropriately). "Error" means "deviation causing functional failure relative to the system's normal, viable operation." No appeal to evolutionary history is *necessary* to call a deleterious point mutation an "error" – it disrupts the current functional process.
  3.  **Implications for Codon Arbitrariness:** The arbitrariness of the codon-amino acid mapping is crucial evidence for *causal specificity* and *functional isolation* within the system. The specific nucleotide sequence *could* have been different (as alternative codes exist) to achieve the *same functional outcome* (inserting leucine). This arbitrariness highlights that the *specificity* of the causal link (this codon sequence causes *this* amino acid) is a key feature exploited by the system's organization. It's not arbitrary *meaning* but arbitrary *causal mechanism* achieving a specific functional role. This arbitrariness supports the idea that the sequence's role is "coding" because the link is conventional *within the system's biochemistry*, not directly determined by chemistry alone (like A-T pairing).
  4.  **Answering the "Specific Cause" Reply:** The reply that genes are "specific causes" is *part* of the answer but insufficient alone. Organizational Teleonomy builds on this:
      *   **Specificity:** DNA sequences are indeed highly specific causes (high informational capacity/channel capacity). Changing one base can change the outcome.
      *   **Functional Integration:** Crucially, they are specific causes *integrated into a larger functional system* with goals (viability, replication). This integration defines the *norm* against which "error" is measured.
      *   **"Mis-specific" Explained:** A mutation *is* "mis-specific" relative to the *functional norm* established by the system's organization. The wild-type sequence is the specific cause that *typically and functionally* leads to outcome X. The mutant is a specific cause that leads to outcome Y, which is *dysfunctional* within the system. The "wrongness" comes from the dysfunctional consequence relative to the system's goals, not from failing to match a historical template. The specific cause *deviates from the specific cause required for typical function*.

  **Conclusion:**

  Rejecting Step (4) and adopting an Organizational Teleonomy account allows you to:
  *   **Preserve (1):** Uphold the reality and non-decorative nature of informational talk in molecular biology.
  *   **Avoid Triviality (2):** Information is tied to specific causal roles in complex, goal-directed systems, not ubiquitous correlation.
  *   **Allow for Error (3):** "Error" is deviation from the current, typical functional role within the organized system.
  *   **Validate Synthetic Biology (5):** Function (and hence information/error) is defined by current design and integration within the target system.
  *   **Resolve Circularity (6):** Meaning/function is grounded in the current, interdependent organization of the system, not requiring external history.
  *   **Answer the "Specific Cause" Reply:** By embedding specificity within systemic function and normativity.

  The cost is abandoning the quest for full-blooded, historically-grounded semantic content. However, this cost is likely acceptable to your molecular biologist colleagues, as it validates their actual practice – including descriptions of synthetics and novel sequences – by grounding the information idiom in the causal-functional organization of living systems *as they study them now*. You can honestly tell them their practice isn't confused; it relies on a robust notion of functional information inherent in biological organization. Your thesis chapter can then explore the nature and explanatory power of *this* concept of information.
