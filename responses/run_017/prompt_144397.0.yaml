  ### Restatement of Rules for Finite Non-Convex Sets

  **Nash Rule**  
  - **What it does**: Selects the checkpoint maximizing the product of absolute gains over the baseline for all metrics.  
  - **Requirements**:  
    - Gains must be strictly positive for all metrics (i.e., all metric values ≥ baseline).  
    - The set of feasible points must contain at least one such checkpoint.  
    - **Your setting's gap**: Your metrics may not have natural "zero" points or linear scales, and gains could be non-positive (if a checkpoint underperforms baseline). If gains are non-positive, the product becomes zero/negative, breaking the rule.  

  **Kalai–Smorodinsky (KS) Rule**  
  - **What it does**:  
    1. Computes the "ceiling" for each metric: the best achievable value *across the entire set of checkpoints* (even if other metrics suffer).  
    2. For each checkpoint, calculates the "fraction of gap closed" for metric \(i\):  
       \[
       \text{fraction}_i = \frac{\text{value}_i - \text{baseline}_i}{\text{ceiling}_i - \text{baseline}_i}
       \]  
    3. Selects the checkpoint that maximizes the minimum fraction across metrics (and breaks ties by the next smallest fraction, etc.).  
  - **Requirements**:  
    - Gains must be strictly positive for all metrics (same as Nash).  
    - Ceiling values must exceed baselines for all metrics (i.e., improvement is possible).  
    - **Your setting's gap**: Ceilings are derived from your observed sweep (which may miss the true optimum if the sweep is sparse).  

  **Settled consensus**: Both rules assume gains > 0 and ceilings > baselines. Without these, they fail. The discrete non-convex case is well-studied; these extensions are uncontroversial.  

  ---

  ### Worked Example: Nash vs. KS with Expansion  

  **Baseline**: (M1=0, M2=0)  
  **Checkpoints (F)**:

  | Checkpoint | M1  | M2  |
  |------------|-----|-----|
  | A          | 1.0 | 5.0 |
  | B          | 2.0 | 4.0 |
  | C          | 3.0 | 3.0 |
  | D          | 4.0 | 2.0 |
  | E          | 5.0 | 1.0 |
  | F          | 3.5 | 2.5 |

  - **Ceilings**: M1=5.0 (from E), M2=5.0 (from A).  
  - **Nash**: Maximizes product of gains:  
    - F: \(3.5 \times 2.5 = 8.75\) (winner).  
  - **KS**: Maximizes min fraction:  
    - C: min(\(3.0/5.0, 3.0/5.0\)) = min(0.6, 0.6) = 0.6 (winner).  

  **Nash picks F; KS picks C**.  

  **Expanded Set (F')**: Add G=(6.0, 3.0) (improves M1 without harming M2).  
  - **Ceilings**: M1=6.0 (from G), M2=5.0 (unchanged).  
  - **Nash**: G: \(6.0 \times 3.0 = 18.0\) (new winner; M1=6.0).  
  - **KS**: G: min(\(6.0/6.0, 3.0/5.0\)) = min(1.0, 0.6) = 0.6 (ties C, but C has lower M1; assume tiebreak favors G).  

  **After expansion**:  
  - Nash increases M1 from 3.5→6.0.  
  - KS increases M1 from 3.0→6.0.  
  - **Your monotonicity guess**: **You had it backward**. Nash *violates* monotonicity (as shown below), KS *satisfies* it here but isn't tested.  

  **Monotonicity Violation Proof**:  
  Add H=(2.5, 5.0) to the original set F (no change to ceilings).  
  - **Original Nash winner**: F (product=8.75).  
  - **New Nash**: H: \(2.5 \times 5.0 = 12.5\) (new winner).  
  - Result: M1 *decreases* from 3.5→2.5 despite expansion favoring M1.  
  - KS still picks C (min fraction=0.6).  

  ---

  ### Residue Report: Your Three Suspicions  

  **(a) Scale Invariance Leakage**  
  - **Your claim**: Fairness depends on arbitrary metric scaling (e.g., accuracy vs. log-odds).  
  - **Verdict**: **Genuine distinction, not thinner than it looks**.  
    - Both rules are invariant to *linear* rescaling (multiplying metric by a constant).  
    - They break under *nonlinear* transforms (e.g., accuracy → log-odds).  
    - **Why it matters**: The "fairness" of the selected checkpoint changes with your choice of units. Nash and KS impose normative choices (product vs. min-fraction) on scales you control arbitrarily. No consensus on the "right" scale.  

  **(b) Non-Agent Populations and Baseline**  
  - **Your claim**: Populations aren’t agents making threats; the baseline isn’t a strategic fallback.  
  - **Verdict**: **Genuine distinction, but thinner than it looks**.  
    - The rules *can* be applied mechanically (baseline = technical starting point, not strategic).  
    - **But**: The axioms (IIA for Nash, monotonicity for KS) assume rational agents with veto power. In your setting:  
      - The "disagreement point" (baseline) isn’t a credible threat (populations can’t walk away).  
      - Rules prioritize axiomatic purity over your context (e.g., KS’s ceilings ignore Pareto efficiency).  
    - **Consensus**: Bargaining rules *are* misapplied here—they’re designed for agents, not metrics.  

  **(c) Axioms Depend on Unobserved Feasible Sets**  
  - **Your claim**: IIA and monotonicity rely on counterfactual sets you never see.  
  - **Verdict**: **Genuine distinction, not thinner than it looks**.  
    - IIA (Nash): "If an option not chosen is removed, choice doesn’t change." But your sweep’s coverage affects outcomes (e.g., adding a non-optimal point can change Nash’s pick, as shown).  
    - Monotonicity (KS): "If the set expands favorably for metric \(i\), \(i\) shouldn’t lose." Depends on unattained ceilings.  
    - **Why it matters**: Your checkpoint cloud is arbitrary (defined by sweep/compute). Axioms assume a comprehensive set, so violations are inevitable and meaningless.  

  ---

  ### If Both Rules Are Wrong, What Then?  
  **Alternative Approach**:  
  1. **Pareto-filter** your checkpoints (discard dominated points).  
  2. Apply a **scalarization** that fits your priorities:  
     - **Nash product** if you want multiplicative gains.  
     - **Min-fraction** if you care about balanced progress.  
     - **Linear weighting** if you have predefined preferences.  
  3. **Admit arbitrariness**: No rule is "fair" without context. Explicitly choose trade-offs (e.g., "We prioritize safety gains by 2×").  

  **Cost of Giving Up Axioms**:  
  - Lose IIA/monotonicity, but they’re irrelevant in your setting.  
  - Gain transparency: Your choice is explicit, not masked by bargaining axioms.  

  **Consensus Note**: This is my best guess. Experts agree bargaining rules are ill-suited for non-agent, non-convex problems; scalarization is standard in multi-objective ML.  

  --- 

  ### Summary of Corrections to Your Gloss  
  - **Nash**: Correct, but requires gains > 0.  
  - **KS**: Correct, but ceilings are global maxima (not per-metric fine-tuning results unless they’re in your set).  
  - **Monotonicity**: You reversed it—Nash violates, KS satisfies (in ideal convex cases).  
  - **Preconditions**: Gains > 0 and ceilings > baselines are absolute; convexity isn’t required for the discrete versions.
