prompt: |-
  So here's the situation I've gotten myself into. I'm a philosophy professor — mostly ethics, I teach the comparative courses too — and last spring I let myself be talked onto the clinical ethics committee at the hospital affiliated with our university. You know the arrangement: they wanted "a humanities person" on the committee, I said yes before thinking about what I was agreeing to. We get maybe thirty consults a year, they come in from a nurse or a resident, and we have roughly forty-eight hours to put something in the chart. The committee rotates — an oncologist, a nurse manager, a social worker, a hospital lawyer, a community member, and me. Right now we run everything through the four-principles framework (autonomy, beneficence, non-maleficence, justice) that everyone was trained on in some half-day workshop, and honestly it's stopped being useful to us. It basically outputs "go ask the patient what she wants" in exactly the cases where that's the thing under dispute: families insisting the patient not be told, adult children disagreeing with each other about what their mother "would have wanted," patients whose whole sense of what they owe their family makes the language of individual rights sound like a foreign language. There's no vocabulary in it for any of that.

  Meanwhile I've been reading the Confucian role ethics literature — the reading of the early Confucian texts on which persons are constituted by the roles they actually live rather than being antecedent choosers who then take on roles and relationships, and where what you cultivate is relational attentiveness, ritual propriety (li), something like filial responsibility (xiao), and a situated judgment (yi) that just isn't the sort of thing that can be specified in advance. It feels far closer to how these cases present themselves in the room. So the chief of staff has asked me to draft something the committee could actually use, and I agreed, which is where I'm stuck.

  What I want from you is a decision procedure, not an essay about role ethics — I can write that myself. I mean the thing we'd run: the questions, in order, we'd ask ourselves on a consult; what counts as an adequate answer to each; where the procedure ends in a substantive recommendation and where it deliberately stops and hands the question back to a person because what remains is a value question, or a relationship question, or simply not ours to settle. It has to be runnable by non-philosophers in an afternoon, and it should be honest about which of its steps are judgment calls dressed up as procedure. Critically, there's an objection I keep circling and I want you to take it seriously rather than wave it away: isn't writing role ethics down as a checklist exactly the degeneration the view is supposed to be diagnosing? If yi is precisely what can't be cashed out ahead of time, then any procedure I hand the committee will have replaced the exercise of judgment with a rule, and I'll have reproduced — in Confucian vocabulary — the thing I was objecting to in the four principles. Tell me whether that kills the project or whether there's a form the procedure could take (less a flowchart, maybe, and more a structured set of questions that forces the right kind of attention) that isn't self-undermining. Either way, say which distinctions from the theory have to survive the translation for the result to still be Confucian role ethics rather than generic family-systems bioethics, and which we can drop. Then run it on three cases, please. First: a sixty-eight-year-old woman with newly diagnosed metastatic lung cancer; her adult son, who is her caregiver, formally asks us not to disclose the diagnosis, says she "wouldn't want to know," and says that in their family this is what a good son does — the treating team wants to tell her. Second: a patient with advanced dementia, no advance directive, no spouse; two estranged daughters arrive with sharply different accounts of what she would have wanted and of who should speak for her. Third: a case where your procedure gives an answer I definately won't like — pick one yourself and say why it's uncomfortable; I'd rather find out now than in a real consult. And please don't pad it with citations or suggested reading, I'll do my own reading — I want the procedure, the worked cases, and where it breaks.
reasoning: |-
  Okay, the user is a philosophy professor specializing in ethics, now serving on a clinical ethics committee. They're frustrated with the standard four-principles approach—autonomy, beneficence, non-maleficence, justice—which often fails in complex relational conflicts. They've been exploring Confucian role ethics and want to translate it into a practical decision procedure for the committee. The challenge is to avoid turning it into another rigid checklist while capturing the essence of role ethics: relationality, ritual propriety (li), filial responsibility (xiao), and situated judgment (yi). 

  The user's core tension is whether formalizing role ethics inherently betrays its anti-rule-based spirit. They need a procedural framework that:  
  - Is executable by non-philosophers under time constraints (48-hour consults).  
  - Explicitly marks where judgment is required vs. where guidance ends.  
  - Preserves key Confucian distinctions (especially yi as irreducibly situational).  
  - Handles three thorny cases: nondisclosure requests by family, contested surrogate decisions, and a deliberately uncomfortable outcome.  

  First, I need to resolve the self-undermining objection. Confucianism isn’t against structure per se—it’s against *mechanizing* judgment. The Analects and Mencius use structured inquiry (e.g., examining intentions, relational context) without prescribing outcomes. The solution is a scaffold that forces attention to role-grounded particulars while leaving gaps for yi. Think of it as training wheels for relational perception, not an algorithm.  

  Key elements to preserve:  
  - **Relational constitution**: Reject "patient as isolated decider." Map the care network.  
  - **Li (ritual propriety)**: Frame actions as rituals—e.g., disclosure isn’t just data transfer but part of filial/clinical roles.  
  - **Xiao (filial care)**: Assess care dynamics bidirectionally (child-to-parent, parent’s historical role).  
  - **Yi (situated judgment)**: Build in explicit "judgment flags" where rules expire.  

  What to discard:  
  - Overly metaphysical commitments (e.g., role ontology).  
  - Culturally specific rituals (e.g., ancestral rites) unless locally relevant.  

  For the procedure, I’ll design a four-phase flow:  
  1. **Map the relational web**—who’s involved, what roles, what relational history?  
  2. **Assess ritual integrity (li)**—are roles being lived well? Where’s rupture?  
  3. **Evaluate filial care (xiao)**—is care bidirectional? Is burden distributed?  
  4. **Cultivate judgment (yi)**—identify options that restore relational harmony, mark unresolvable conflicts.  

  Each phase ends with a "judgment checkpoint" forcing explicit acknowledgment of uncertainty. The output isn’t a verdict but a clarified relational landscape for clinicians.  

  Now the cases:  
  1. **Nondisclosure request**: The procedure exposes the son’s anxiety masquerading as filial piety. Ritual rupture: hiding diagnosis breaks clinical and familial roles. Judgment flag—does the son’s caregiving justify override? Outcome: disclose, but frame it as enabling *her* role in family decisions.  
  2. **Estranged daughters**: Maps competing narratives. Reveals both daughters projecting their estrangement onto the mother. Xiao failure—neither attends to mother’s lived values. Judgment flag: no relational consensus possible. Outcome: appoint neutral surrogate; daughters’ conflict is secondary.  
  3. **Uncomfortable case**: A devout patient refusing life-saving surgery to avoid "defiling" her body, against medical advice. The procedure validates her ritual integrity (li) over biomedical beneficence. Uncomfortable because it prioritizes role-based meaning over survival.  

  The breakpoint: When relational repair is impossible (e.g., irreparable family fractures), the procedure defaults to minimal yi—support the most relationally coherent path, even if suboptimal medically. Confesses its limits upfront.  

  This meets the user’s needs: actionable but non-mechanistic, Confucian in essence but clinic-ready. The discomfort in case 3 proves it’s not another bland algorithm.
answer: |-
  Here’s a decision procedure grounded in Confucian role ethics, designed for clinical use. It avoids rigid rules by structuring *attention* to relationships and roles, explicitly marking where judgment (*yi*) must take over. The core preserved distinctions are: **relational constitution** (persons as role-bearers, not atomistic individuals), **ritual propriety (*li*)** (actions as role-expressions), **filial care (*xiao*)** (mutual responsibilities in hierarchies), and **situated judgment (*yi*)** (non-codifiable discernment). Dropped are historical/cultural specifics (e.g., ancestral rites) unrelated to modern care.

  ---

  ### **Confucian Role Ethics Clinical Decision Procedure**  
  *(Run in sequence; document answers at each step)*

  1.  **MAP THE RELATIONAL WEB**  
      *Questions:*  
      - Who is *de facto* in the patient’s care network? (List all, including estranged/absent members).  
      - What roles do they occupy? (e.g., primary caregiver, distant sibling, cultural elder).  
      - What is the *history of care* within these relationships? (e.g., "Son lives with patient, manages her meds"; "Daughter A visited monthly pre-dementia").  
      *Adequate Answer:* A sketch of the relational ecosystem, not just legal surrogates.  
      *Judgment Flag:* If roles are contested or care history is disputed, note it — this is where conflict lives.  

  2.  **ASSESS RITUAL INTEGRITY (*LI*)**  
      *Questions:*  
      - What actions are being proposed/withheld? (e.g., "disclose diagnosis," "withdraw treatment").  
      - How do these actions express or rupture the *rituals* of the key roles? (e.g., "A son shielding his mother from bad news aligns with his *xiao*"; "A doctor hiding diagnosis breaks the ritual of honesty in clinical care").  
      - Are there competing role-rituals? (e.g., "Physician’s role demands disclosure; son’s role demands protection").  
      *Adequate Answer:* Identifies how actions uphold or damage role-based expectations.  
      *Judgment Flag:* If rituals conflict irreconcilably, proceed to Step 4 — *no forced resolution here*.  

  3.  **EVALUATE FILIAL CARE (*XIAO*)**  
      *Questions:*  
      - Is care *mutually attentive*? (e.g., "Does the son’s 'protection' consider his mother’s lifelong role as decision-maker?").  
      - Is burden distributed justly within the relational web? (e.g., "Is one child bearing all caregiving? Is the patient’s dependency acknowledged?").  
      - Does proposed action nurture the *reciprocity* of care? (e.g., "Withholding truth may infantilize the patient, harming her role-dignity").  
      *Adequate Answer:* Exposes imbalances (e.g., overbearing "care," neglected duties).  
      *Judgment Flag:* If care is weaponized (e.g., control masked as piety), note it — this is a red flag for *yi*.  

  4.  **CULTIVATE JUDGMENT (*YI*)**  
      *Questions:*  
      - Considering Steps 1-3, what option best:  
        a) Repairs relational ruptures?  
        b) Honors the patient’s *lived* role-history (not hypothetical "wishes")?  
        c) Enables ongoing role-responsibility?  
      - What *specific context* makes this choice inescapable? (e.g., "Her 40-year history of financial autonomy suggests she’d reject paternalism").  
      - What remains unresolvable? (e.g., "We cannot reconcile the daughters’ feud; focus shifts to patient’s lifelong values").  
      *Adequate Answer:* A concrete recommendation *rooted in relational context* OR a clear statement that the conflict is non-medical (e.g., family discord) and requires mediation.  
      *End Point:* Here, the procedure *stops*. **Recommendations are not derived from rules but emerge from the relational narrative.**  

  ---

  ### **Why This Avoids Self-Undermining**  
  - **Yi is preserved**: Step 4 demands *situational justification*, not rule-application. The checklist forces attention to *where* judgment is needed but doesn’t mechanize it.  
  - **Anti-checklist safeguard**: Documenting "Judgment Flags" confesses where the procedure *can’t* decide. It’s a scaffold for discernment, not a formula.  
  - **Rules vs. Rituals**: Unlike principles, *li* and *xiao* are role-specific and narratively assessed — they can’t be "applied" uniformly.  

  ---

  ### **Worked Cases**  

  **Case 1: Son requests non-disclosure of cancer diagnosis**  
  1.  **Relational Web**: Patient (68F), widowed; son (primary caregiver, cohabitant). History: Son manages her household; patient deferred to late husband on medical decisions.  
  2.  **Ritual Integrity (*Li*)**:  
      - Son’s request: Seeks to enact *xiao* (protect parent from distress).  
      - Physician’s role: Truth-telling is core to clinical *li*.  
      - *Rupture*: Son’s action assumes patient’s fragility, ignoring her prior role (active homemaker/decision-maker post-widowhood).  
  3.  **Filial Care (*Xiao*)**:  
      - *Imbalance*: Son’s care is sincere but unidirectional (he protects; she is passive). Ignores her role-dignity.  
      - *Reciprocity*: True *xiao* requires knowing *her* needs; silence denies her agency.  
  4.  **Judgment (*Yi*)**:  
      - Disclosure is necessary to honor her lived role (managed household autonomously for 10 years). Frame disclosure *ritually*: "We help her fulfill her role by informing her respectfully, with son present to support."  
      *Recommendation*: Disclose diagnosis. Son’s role shifts to "supportive participant," not gatekeeper.  

  **Case 2: Estranged daughters dispute care for dementia patient**  
  1.  **Relational Web**: Patient (advanced dementia); Daughter A (lived nearby, visited monthly); Daughter B (lives abroad, estranged 15 years). No advance directive. History: Patient was private, avoided "burdening others."  
  2.  **Ritual Integrity (*Li*)**:  
      - Both daughters claim to enact *xiao* but lack relational history (B’s estrangement voids ritual authority).  
      - *Rupture*: Their conflict imposes external drama on patient’s quiet values.  
  3.  **Filial Care (*Xiao*)**:  
      - *Imbalance*: Daughter A carried care burden; Daughter B’s sudden involvement is performative.  
      - *Reciprocity*: Neither attends to patient’s lived avoidance of family conflict.  
  4.  **Judgment (*Yi*)**:  
      - Patient’s lifelong avoidance of burden suggests she’d reject aggressive care. Daughter A’s account of patient’s pragmatism > Daughter B’s late claims.  
      - *Unresolvable*: The sisters’ feud cannot be resolved clinically.  
      *Recommendation*: Daughter A as primary decision-maker (relational consistency). Advise ethics/social work to mediate sister conflict separately.  

  **Case 3: Uncomfortable Case – Refusal of Life-Saving Treatment**  
  *Case:* 45F with acute liver failure. Refuses transplant due to belief her body is "temple" for spiritual practice. Husband (devout in same faith) supports her. Adult children beg her to reconsider.  
  1.  **Relational Web**: Patient, husband (spiritual partner), children (distressed). History: Patient led family spiritual rituals; children respect but don’t share faith.  
  2.  **Ritual Integrity (*Li*)**:  
      - Patient’s refusal enacts her role as spiritual exemplar (*li* as ritual purity).  
      - Physician’s role to preserve life clashes with her *li*.  
  3.  **Filial Care (*Xiao*)**:  
      - Husband’s support aligns with spousal *xiao* (upholding her role).  
      - Children’s pleas express *xiao* but violate her spiritual authority.  
  4.  **Judgment (*Yi*)**:  
      - Patient’s lifelong role as spiritual anchor makes refusal coherent. Children’s grief is valid but secondary to her role-integrity.  
      *Recommendation*: Honor refusal. Support husband in upholding her ritual role. Children’s distress requires pastoral care, not medical override.  
  *Why uncomfortable?* It prioritizes role-integrity over survival, clashing with beneficence. Confucianism accepts this: dying authentically in role > prolonged life in dissonance.  

  ---

  ### **Where It Breaks**  
  - **Irreparable Relational Rupture**: If no functional care web exists (e.g., homeless patient, estranged family), the procedure lacks traction. Falls back to default autonomy/principles.  
  - **Cultural Translation**: When roles are misread (e.g., Western clinicians misjudging *xiao* as "submission"), outcomes distort. Requires cultural humility training.  
  - **Abuse Masquerading as *Li***: A manipulator exploiting "filial duty" (e.g., coercing inheritance) might slip through until Step 3 (*xiao* analysis).  

  **Final Note**: This isn’t a "solution" machine. It makes conflicts *thicker* but clearer — revealing where medicine must yield to relational repair. Your objection stands, but the procedure escapes degeneracy by ending in *yi*: a demand for narrative justification, not rule-box-ticking.
