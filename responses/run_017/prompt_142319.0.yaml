  ### Memo: Superrationality in MARL/Causal Terms  
  **To:** Lab Slack Channel  
  **From:** Research Engineer (Philosopher-MARL Hybrid)  
  **Subject:** Superrationality Dissected—Where It Fits, Where It Breaks, and the Divergent-Checkpoint Edge Case  

