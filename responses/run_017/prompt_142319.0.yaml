  ### 1. Core Translation: Superrationality in Your Vocabulary  
  **Premise**: In a one-shot PD between identical rational agents, superrationality claims cooperation is uniquely rational. Translation requires mapping five ingredients:  

  #### (A) **Notion of Rationality**  
  - **Standard (Your Framework)**: Maximize expected utility *given others' policies*. Implements **best response** (e.g., defection dominates in PD).  
  - **Superrationality**: Maximize utility *under joint symmetry constraint*. Rationality = Choosing the action that, if universally adopted, maximizes payoff. Ignores unilateral deviations (deemed "impossible" by symmetry).  
  - **Translation**: Agents run a **fixed-point operator over policies**, not actions. The operator is:  
    \[
    \text{FP}(\pi) = \arg\max_{a} \, U(a, a) \quad \text{(assuming identical outputs)}
    \]  
    Output: Cooperate (since \(U(C,C) > U(D,D)\)).  

  #### (B) **Sameness Relation**  
  - **Standard**: Agents share policy parameters (e.g., **parameter sharing** in MARL) or have correlated signals (**correlated equilibrium**).  
  - **Superrationality**: Agents are *identical*: same policy code, same inputs, same random seed (**common random numbers**). No asymmetric outcomes possible.  
  - **Translation**: Policies are **deterministic programs** with identical weights and initial states. Sameness = \( \pi_1 = \pi_2 \) and \( s_1 = s_2 \).  

  #### (C) **Counterfactual Evaluated**  
  - **Standard (Causal)**: "If *I* intervene to set my action \(A_i = a\), what is \( \mathbb{E}[U_i \mid do(A_i = a)] \)?". Uses **do-calculus**; severs edges into \(A_i\).  
  - **Superrationality**: "If *we* (as a collective) choose action \(a\), what is \(U(a, a)\)?". Ignores causal paths; assumes actions are perfectly coupled.  
  - **Translation**: Intervention shifts from \(do(A_i)\) to \(do(\Pi)\)—setting the shared policy program. Evaluates:  
    \[
    \mathbb{E}[U \mid do(\Pi = \pi_a)] \quad \text{where} \quad \pi_a(s) = a \quad \forall s
    \]  
    (Outcome: \((a, a)\)).  

  #### (D) **Fixed-Point Character**  
  - **Standard**: **Nash equilibrium** (no unilateral incentive to deviate) or **correlated equilibrium** (incentive-compatible w.r.t. signals).  
  - **Superrationality**: Action \(a\) must satisfy: \(a = \text{FP}(\pi_a)\). No deviation considered—symmetry forbids it.  
  - **Translation**: A degenerate **fixed point of self-play**:  
    \[
    \pi^* \text{ such that } \pi^*(s) = \arg\max_{a} \, U(a, a) \quad \text{(ignores } \pi^*\text{'s response to deviations)}
    \]  
    Contrast with **best-response fixed point** (\(\pi^* = BR(\pi^*)\)), which yields defection.  

  #### (E) **Role of Payoffs**  
  - **Standard**: Payoffs define dominance (defection strictly dominates).  
  - **Superrationality**: Payoffs *only* evaluated at symmetric outcomes \((C,C)\) and \((D,D)\). Asymmetric payoffs (e.g., \(5\) or \(0\)) are excluded by fiat.  

  #### **Flagged Issue in Your Framing**  
  You assume causal independence ("no path between actions"). Superrationality rejects this—it asserts *logical* (not causal) dependence via identical programs. Your SCM lacks a node for "shared program output," which superrationality implicitly adds.  

