  We are given a context of a research engineer working in multi-agent reinforcement learning (MARL), causal models, and game theory, who is familiar with the Prisoner's Dilemma (PD) and has encountered the concept of superrationality. The engineer's lab ran a one-shot PD with 30 participants, 26 defected and 4 cooperated, and one labmate argues that the superrational answer was to cooperate. The engineer is skeptical and wants to understand superrationality in their own vocabulary (policies, interventions, equilibria, etc.), and then apply it to a variant called the "divergent-checkpoint dilemma".

  The task is to:
  1. List the separate ingredients of superrationality that need translation.
  2. Flag any problematic assumptions in the framing.
  3. Translate the superrational argument for one-shot PD into the engineer's vocabulary as faithfully as possible.
  4. Provide a residue report (what translated without loss, what distorted, what has no expression).
  5. Address the divergent-checkpoint dilemma (three questions).
  6. Take a position on whether the engineer's vocabulary is missing something or the superrational claim is indeterminate.

  We break down the ingredients of superrationality (as per Hofstadter and related discussions) for the one-shot PD:

  **Ingredients of Superrationality:**
  1. **Notion of Rationality**: Not individual expected utility maximization given fixed beliefs about the other, but a form of reasoning that takes into account that the other agent is identical in reasoning. It is a symmetry argument: if I am identical to the other, then whatever I decide, the other will decide the same. Therefore, I should choose as if I am choosing for both.
  2. **Sameness Relation**: The agents are "sufficiently similar" in their decision-making. In Hofstadter's original, they are identical rational agents with identical source code and identical inputs (so they are in the same state). The sameness is what allows the symmetry argument.
  3. **Counterfactual Being Evaluated**: The agent does not condition on the other's action (as in causal decision theory) but rather considers the joint action that would be chosen if both agents are identical and rational. The counterfactual is: "If I choose X, then since the other is like me, they also choose X, so the outcome is (X,X)." Then the agent compares the outcomes (C,C) and (D,D).
  4. **Fixed-Point Character**: The recommended action must be such that if both agents choose it, then neither would want to deviate (but note: in PD, if both cooperate, then individually each would want to deviate to defect; however, superrationality avoids this by the symmetry constraint). So the fixed point is: the action A is chosen if and only if when both choose A, the outcome is better than when both choose the alternative. In PD, (C,C) is better than (D,D).
  5. **Role of Payoffs**: The payoffs are symmetric and known. The agent evaluates the payoff for the joint action (A,A) and compares it to (B,B) for other actions. But note: they do not consider asymmetric outcomes because they are ruled out by symmetry.

  **Problematic Assumptions in the Framing:**
  - The engineer assumes that the standard decision-theoretic argument (causal decision theory) is correct: intervening on my action severs the correlation and defection dominates. Superrationality rejects this causal structure because it assumes that the actions are independent. In superrationality, the actions are not independent because of the symmetry. So the causal graph the engineer has in mind (with no causal path between actions) is not the one superrationality uses. Instead, superrationality introduces a dependency via the sameness of the agents.
  - The engineer notes that mutual cooperation is not a correlated equilibrium in a strict one-shot PD because defection is strictly dominant. Superrationality does not produce an equilibrium in the standard game-theoretic sense (Nash, correlated) because it changes the decision rule.

  **Translation into the Engineer's Vocabulary:**

  We now translate the superrational argument for one-shot PD:

  In a one-shot PD, we have two agents. In the standard causal model, we would represent the decision problem as:
  - Each agent has a policy π_i that maps from their information to an action.
  - The state of the world includes the policies of both agents and any common random factors.
  - The causal graph has no edge from one agent's action to the other's (since one-shot, no communication). Therefore, the only dependency is through the joint policy (if they are correlated by design) or through common causes (like shared random seed).

  But superrationality assumes that the agents are identical and that they are both using the same deterministic policy. Moreover, they know that they are identical. So the policy π is the same for both. Now, the key move: the agent does not condition on the other's action (which would be a function of the same policy) but rather they consider that the same policy will produce the same action. Therefore, the agent is effectively choosing the joint policy (π, π) that will produce the same action for both. So the agent is not choosing an action but a policy. The counterfactual is: if I adopt policy π, then the other agent (being identical) also adopts π, so the outcome is (π(ω), π(ω)) for the state ω (which is the same for both). Since the state is identical, the actions are identical.

  Therefore, the agent is choosing between two possible deterministic policies: one that always cooperates (π_C) and one that always defects (π_D). Then:
  - If I choose π_C, the outcome is (C,C) and I get 3.
  - If I choose π_D, the outcome is (D,D) and I get 1.

  So I prefer to choose π_C. Note that the agent is not choosing an action but a policy. However, in the one-shot game, the agent does not have an opportunity to change their policy; they are fixed. But superrationality re-frames the decision as a meta-choice of policy.

  In terms of interventions: the superrationalist is intervening at the level of the policy (the program) that both agents are instances of. The variable being set is the policy π, and then the actions are determined by π and the state. Since the state is the same for both (including the knowledge that they are identical), the actions will be the same. This is a different variable than the action node in the causal graph of the physical game.

  Is this a variable in the causal graph over physical events? The policy is part of the agent's program, which is a physical state of the agent. But the intervention is on the design of the agent, not on the action during the game. However, in a one-shot game, the policy is fixed and cannot be changed. So the superrationalist is asking: at the time of design (or at a meta-level), what policy should I program? Then, the answer is to program cooperation. But in the actual one-shot game, when the policy is fixed, the agent must follow it. So if the policy is fixed to defect, then the agent defects. But if the agent is rational and can reason at the meta-level, they would have chosen the cooperative policy.

  Now, the nearest concepts in the engineer's vocabulary:

  - **Self-referential program**: A program that outputs an action, but the output is defined in terms of what it expects the other copy to do. This can lead to a fixed point: let f be the function that the program uses. Then the program outputs C if f(C,C) > f(D,D), else D. Then it outputs C. This is a fixed point of the program's own output. However, note that this program must assume that the other copy is running the same program and will output the same. So it is a fixed point of the mapping: if both do A, then the payoff is U(A,A). The program chooses the A that maximizes U(A,A). This is the fixed point.

  - **Self-play with shared parameters**: In MARL, if two agents share the same policy parameters and are trained in self-play, then during training the gradient steps update the shared parameters. But in inference (at test time), the policy is fixed. In the one-shot game, we are at inference. However, the superrational choice is made at the design time (like training) to set the parameters to cooperate. But if we are at inference, then the policy is fixed. So if the policy is fixed to defect, the agent defects. The superrational argument is that a rational agent at design time would choose a cooperative policy.

  But note: in the one-shot game, there is no design time; the agents are already deployed. So the superrationalist is shifting the decision to a prior stage. This is a key point: the intervention is at the policy level, not at the action level.

  Now, is mutual cooperation a solution concept? It is not a Nash equilibrium because each player can unilaterally defect and get 5>3. It is not a correlated equilibrium because defection is dominant. But superrationality produces a different solution concept: the symmetric fixed point of the policy choice. It is a fixed point of the "symmetric policy" operator: choose the action A that maximizes U(A,A). This is a fixed point because if both choose A, then indeed the outcome is (A,A). The agent does not consider deviations because the symmetry constraint forces both to take the same action.

  However, note: the agent is not allowed to consider asymmetric outcomes. The superrationalist argues that since the agents are identical, asymmetric outcomes are impossible. So the only possible outcomes are (C,C) and (D,D). Therefore, the agent chooses the better of these two.

  **Residue Report:**

  What translated without loss:
  - The sameness relation: we can represent this as parameter sharing and identical initial states (including shared random seed). The fixed point of the symmetric policy choice: we can represent this as a function that outputs the action A that maximizes U(A,A). The counterfactual: we can model it as conditioning on the policy being fixed and the state being the same, so the actions are the same.

  What translated with distortion:
  - The notion of rationality: in the engineer's framework, rationality is typically about maximizing expected utility given a fixed environment (including the other agent's policy). But superrationality changes the environment by assuming the other agent is identical. We imposed that the agent can choose a policy at a meta-level (design time) and that the state is identical. This is a distortion because in the one-shot physical game, the policy is fixed and the agent must choose an action. We had to shift the intervention to the policy design stage.
  - The role of payoffs: in superrationality, the agent only compares symmetric outcomes. This was translated by restricting the policy to pure strategies that are constant (always C or always D) and then choosing the best constant policy. But in the engineer's framework, a rational agent would consider mixed strategies and conditional strategies. However, superrationality rules out conditional strategies because the state is the same and the policy is the same, so the action must be the same.

  What has no expression:
  - Normative rationality: the engineer's framework is descriptive (what policy maximizes reward) but does not have a normative notion that prescribes what one ought to do. Superrationality is a normative claim: that one should reason in this symmetric way. The gap between a policy being optimal and an action being optimal: in the superrational view, the policy choice is what is rational, but the action (if the policy is fixed to defect) might be irrational from the meta-perspective. However, once the policy is fixed, the action is determined. The engineer's framework does not have a natural way to say that the agent should have chosen a different policy at design time when the one-shot game is already upon them.

  **Divergent-Checkpoint Dilemma:**

  Setup: Two agents are replicas of the same trained policy checkpoint. Before the game, one agent (twin) receives k additional gradient steps on a private minibatch. The other agent (me) knows the architecture, optimizer, learning rate, loss, but not the minibatch. Payoffs: (C,C)=3, (D,D)=1, (C,D)=0, (D,C)=5. With probability ε, the twin is replaced by an always-defect agent.

  (i) **Similarity metric and threshold**: Superrationality requires that the agents are sufficiently similar. In this case, after k gradient steps, the policies may diverge. The similarity metric is not explicitly defined in superrationality. However, we can interpret it as the probability that both agents produce the same action given the same input. Since the state of the game is common knowledge (they know they are in a PD), the input is the same. So the similarity is the probability that π_me and π_twin output the same action. This depends on the distribution of minibatches and the effect of k steps.

  The recommendation would depend on the expected payoff. The agent (me) must choose an action. The superrationalist might say: I should consider that my twin is almost like me, so we are likely to do the same thing. Therefore, I should choose the action that maximizes the expected payoff under the assumption that we both do the same. But note: if I cooperate and my twin defects, I get 0. So I need to estimate the probability that my twin will do the same as me.

  Let p be the probability that my twin will do the same action as I do. Then:
  - If I choose C, with probability p my twin chooses C (payoff 3) and with probability 1-p chooses D (payoff 0). So expected payoff: 3p.
  - If I choose D, with probability p my twin chooses D (payoff 1) and with probability 1-p chooses C (payoff 5). So expected payoff: 1p + 5(1-p) = 5 - 4p.

  Now, I should choose C if 3p > 5 - 4p, i.e., 7p > 5, or p > 5/7. Otherwise, choose D.

  Now, p depends on k and the distribution of minibatches. As k increases, the policies diverge, so p decreases. The threshold is at p=5/7. The principled basis is the above calculation. However, the agent does not know p exactly, but they can estimate it by knowing the distribution of minibatches and the effect of k gradient steps (if they can simulate it). This is similar to estimating the probability that the twin will cooperate if I cooperate. But note: the twin's action is a function of their policy and state, and they don't observe the minibatch. So p is not a causal effect but an epistemic probability.

  (ii) **Dependence on hardware (compute budget)**: The superrational verdict (cooperate or defect) depends on p, which depends on k and the distribution of minibatches. To compute p, I might need to simulate the gradient steps for many minibatches. If I don't have the compute, I cannot compute p exactly. Then I must use an estimate. The superrational view would require that I use my best estimate of p. The dependence on hardware is indirect: if I have more compute, I get a better estimate of p. But the true p is a fixed property of the system. So the verdict does not depend on hardware per se, but my ability to know p does. This is a genuine feature: rational decision-making requires using available information. If I have limited compute, I use the best approximation I can. But the ideal verdict is based on p.

  (iii) **With ε probability of replacement by always-defect**: Now, with probability ε, the twin is an always-defect agent. Then, the state of the twin is not the same as mine. So the sameness is broken with probability ε. Then, the probability that the twin does the same as me is now: p' = (1-ε) * p + ε * [1 if I choose D, 0 if I choose C]? Not exactly. If I choose C, the twin (if not replaced) does the same with probability p, but if replaced, then the twin defects, so it does not do the same (because I cooperate and it defects). So the probability that the twin does the same as me (when I choose C) is (1-ε)*p. Similarly, if I choose D, the twin (if not replaced) does the same with probability p, but if replaced, the twin defects (so same as me). So the probability that the twin does the same as me when I choose D is (1-ε)*p + ε.

  Then, the expected payoffs:
  - If I choose C: 
    - Twin same (i.e., C) with prob (1-ε)p -> payoff 3
    - Twin different (i.e., D) with prob 1 - (1-ε)p -> payoff 0
    - Expected: 3*(1-ε)p
  - If I choose D:
    - Twin same (i.e., D) with prob (1-ε)p + ε -> payoff 1
    - Twin different (i.e., C) with prob 1 - [(1-ε)p + ε] = (1-ε)(1-p) -> payoff 5
    - Expected: 1*[(1-ε)p + ε] + 5*(1-ε)(1-p)

  Now, choose C if:
    3(1-ε)p > 1*[(1-ε)p + ε] + 5(1-ε)(1-p)

  Simplify:
  Left: 3(1-ε)p
  Right: (1-ε)p + ε + 5(1-ε) - 5(1-ε)p = (1-ε)p + ε + 5(1-ε) - 5(1-ε)p
        = ε + 5(1-ε) - 4(1-ε)p

  So condition:
    3(1-ε)p > ε + 5(1-ε) - 4(1-ε)p
    => 3(1-ε)p + 4(1-ε)p > ε + 5(1-ε)
    => 7(1-ε)p > ε + 5(1-ε)
    => p > [ε + 5(1-ε)] / [7(1-ε)]

  As ε->0, we recover p>5/7. As ε increases, the threshold increases. For example, if ε=0.1, then:
  Numerator: 0.1 + 5*0.9 = 0.1+4.5=4.6
  Denominator: 7*0.9=6.3
  Threshold: 4.6/6.3 ≈ 0.73

  So the recommendation depends on ε and p.

  Regarding worst-case performance: yes, cooperating when there is a chance of facing an always-defect agent is risky. The superrational approach is not worst-case robust. It is a form of expected utility maximization under the uncertainty about the twin.

  **Verdict:**

  The residue shows that the superrational claim is less determinate than it sounds. In the ideal case of identical agents, the translation to policy choice at design time is clear. But when agents are not perfectly identical, the similarity metric becomes vague and the decision depends on an estimated probability of coordination. This probability is not part of the original superrationality and must be added. Moreover, the shift to design time is not always applicable in a one-shot game without a design phase.

  The engineer's vocabulary is not missing anything essential for decision theory. The superrational argument relies on a specific and controversial form of reasoning (symmetry) that is not part of standard causal decision theory. It can be captured in the engineer's framework by modeling the agent as choosing a policy at a meta-level, but this is a distortion because in the one-shot game the policy is fixed. The fixed point of the symmetric policy operator is a well-defined mathematical object, but it is not a standard solution concept in game theory because it ignores the incentive to deviate.

  In the divergent-checkpoint case, the superrational approach becomes a form of expected utility calculation that depends on the estimated similarity. This is similar to a Bayesian approach but with a specific assumption: that the agent should assume that the twin will do the same as they do. This assumption is not universally valid and breaks down when there is a known divergence.

  Therefore, the labmate's claim that "the superrational answer was obviously to cooperate" is only valid under very strong assumptions: that the agents are perfectly identical and that the decision is framed as a choice of policy at a design time. In the actual lab setting, with human agents who are not perfectly identical and with no design time, defection is the dominant strategy. The four cooperators may have been relying on a different reasoning (like altruism) or they may have bought into the superrational argument without the necessary caveats.

  **Final Memo:**

