  **To:** Lab Slack Channel  
  **From:** [Your Name]  
  **Subject:** Analysis of Superrationality in One-shot Prisoner's Dilemma and the Divergent-Checkpoint Variant  

  Following our discussion about the lab retreat Prisoner's Dilemma (PD) and the claim that "superrationality" dictates cooperation, I've conducted a formal analysis using our multi-agent reinforcement learning (MARL) and causal modeling framework. The goal was to translate superrationality without distortion and then identify any gaps. Here's a memo structured as: (1) Core Translation, (2) Residue Report, (3) Divergent-Checkpoint Dilemma, and (4) Verdict.

  ### 1. Core Translation of Superrationality for One-Shot PD  
  Superrationality (Hofstadter) argues that in a one-shot PD between identical rational agents, cooperation is rational. Translation into our terms:  
  - **Agents as Policy Checkpoints**: Each agent is an instance of the same deterministic policy π, with identical initial states (shared random seed, same weights).  
  - **Decision as Policy Choice**: The agent does not choose an action but a policy at a meta-level (design time). By symmetry, whatever policy I choose, my twin chooses identically, so the outcome is (π(s), π(s)) for state s.  
  - **Fixed-Point Operator**: The agent picks the action A that maximizes the symmetric payoff U(A, A). In PD, U(C,C)=3 > U(D,D)=1, so choose C.  
  - **Counterfactual**: Evaluates "If I choose policy π_C, then twin does too, yielding (C,C)" vs. π_D → (D,D).  
  - **Causal Intervention**: Superrationality intervenes on the policy parameter node (e.g., the NN weights), not the action node. Setting π=π_C causes both agents to cooperate.  

  This is not a causal effect in the physical game (where actions are independent) but a design-time intervention. In inference (game time), if π is fixed to defect, the agent defects — but superrationality claims that at design time, a rational agent would have set π to cooperate.  

  **Nearest MARL Concepts**:  
  - **Self-Referential Programs**: A program that outputs C if U(C,C) > U(D,D), else D — a fixed point of its own output.  
  - **Self-Play with Shared Parameters**: Training would converge to cooperation if the loss rewards symmetric outcomes, but at test time, the policy is frozen.  

  However, mutual cooperation is not a Nash or correlated equilibrium (defection is strictly dominant). Superrationality defines a new solution concept: the **symmetric policy fixed point** — "choose A such that U(A,A) is maximized, assuming both agents choose identically."

  ### 2. Residue Report: What Translated, What Didn't, What's Missing  
  - **Translated Without Loss**:  
    - Symmetry via parameter sharing and identical initial states.  
    - Fixed-point operator for symmetric actions.  
    - Counterfactual as policy-level intervention.  
  - **Translated with Distortion**:  
    - Rationality as design-time policy choice: We had to shift intervention from action (game time) to policy (design time), which doesn’t apply to one-shot games without a design phase.  
    - Payoff evaluation: Superrationality ignores asymmetric outcomes (e.g., (C,D)), but our framework forces us to model them when symmetry is imperfect.  
  - **No Expression in Our Vocabulary**:  
    - Normative rationality: Our framework describes optimal policies given constraints, but doesn’t prescribe "how to reason" at design time vs. game time.  
    - The gap between action-optimality (defect at game time) and policy-optimality (cooperate at design time) is unresolved — superrationality prioritizes the latter, but our agents are often stuck at game time.  

  ### 3. Divergent-Checkpoint Dilemma  
  You and your twin start from the same checkpoint, but your twin gets k private gradient steps. With probability ε, twin is replaced by always-defect. Payoffs: (C,C)=3, (D,D)=1, exploit=5, exploited=0.  
  - **(i) Similarity Metric and Threshold**:  
    Similarity is defined as the probability p that your twin outputs the same action as you (given the same input). After k steps, p depends on the minibatch distribution and optimization dynamics. The superrational decision rule:  
    - Cooperate if p > 5/7 ≈ 0.714 (for ε=0).  
    - As k increases, p decreases. The threshold is principled: maximize expected utility under the belief that twin mirrors your action (see math below).  
  - **(ii) Hardware Dependence**:  
    The verdict depends on p, not hardware. If you can’t compute p due to limited compute, you use an estimate (e.g., via sampling minibatches). This is a feature: rationality requires using available information, but the ideal p is hardware-invariant.  
  - **(iii) With ε-Probability Always-Defect Twin**:  
    Expected payoffs:  
    - Cooperate: 3 × [(1-ε)p]  
    - Defect: 1 × [(1-ε)p + ε] + 5 × [(1-ε)(1-p)]  
    Cooperate if:  
      $$3(1-\epsilon)p > \epsilon + 5(1-\epsilon) - 4(1-\epsilon)p$$  
      Simplified: $$p > \frac{\epsilon + 5(1-\epsilon)}{7(1-\epsilon)}$$  
    As ε grows, the threshold increases (e.g., ε=0.1 → p>0.73). This is not worst-case robust — if ε>0, cooperation risks payoff 0.  

  ### 4. Verdict  
  - Superrationality’s cooperation prescription is valid only under stringent conditions: perfectly identical agents, deterministic policies, and a design-time decision frame. In our lab’s human PD, none held: agents weren’t identical (different humans), and there was no "design time" to set policies — the game was one-shot with fixed "policies" (human tendencies). Thus, defection was the dominant strategy.  
  - The residue shows superrationality is less a universal decision rule and more a niche fixed-point operator. It doesn’t extend cleanly to non-identical agents (e.g., divergent checkpoints) without ad hoc similarity metrics. Our MARL/vocabulary isn’t missing anything; superrationality’s indeterminacy under divergence or uncertainty explains why it’s not used in robust MARL.  
  - Recommendation: In the divergent-checkpoint case, use standard expected utility with your best estimate of p and ε. If p is unknown and compute-limited, defect (minimax safety).  

  **Bottom Line**: Superrationality is an elegant but brittle argument. For real-world systems, stick to causal decision theory and Nash equilibria — they handle divergence and adversaries without mystery.  
