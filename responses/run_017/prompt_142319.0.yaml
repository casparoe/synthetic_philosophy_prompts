  ### 2. Residue Report: What Translated, What Didn’t, What’s Missing  
  | **Ingredient**         | **Translation Status**       | **Distortion/Assumption**                                  |  
  |-------------------------|------------------------------|------------------------------------------------------------|  
  | Rationality (goal)      | ✅ Without loss              | None—maximization is universal.                            |  
  | Sameness                | ⚠️ With distortion          | Assumed identical states & determinism (rare in practice). |  
  | Counterfactual          | ⚠️ With distortion          | Shift from \(do(A_i)\) to \(do(\Pi)\) imposed.             |  
  | Fixed-point operator    | ✅ Without loss              | FP(\(\pi\)) = \(\arg\max_a U(a,a)\) is well-defined.       |  
  | Payoffs                 | ⚠️ With distortion          | Asymmetric outcomes excluded artificially.                 |  
  | **Key Gaps**            |                              |                                                            |  
  | Normative rationality   | 🚫 No expression            | Your framework is behavioral (what *is* optimal), not normative (what *should be* rational). |  
  | Action vs. policy opt.  | 🚫 No bridge                | Superrationality hides that individual *actions* aren’t optimal—only the *policy* is. |  

  **Verdict on Residue**:  
  - **Your vocabulary lacks nothing essential**. Superrationality’s "rationality" is a *redefinition*—it replaces causal dominance with a fixed-point operator that ignores deviations.  
  - **Superrationality is indeterminate** under real-world constraints (divergent policies, uncertainty). Its rigor relies on perfect symmetry—a degenerate case.  

