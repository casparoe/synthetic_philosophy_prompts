prompt: |-
  I'm on my university's Accommodations Committee (staff and faculty cases, we meet monthly) and last night I got into a three-hour argument with a friend about whether anything really counts as a disease, so now I'm the annoying one on the committee. We have two petitions to decide next week and I want a short decision memo I can circulate before the meeting.

  Our policy just says accommodations require "a diagnosed disease, disorder or medical condition" and defines nothing. The two cases look to me like the same kind of thing with the verdict pulling in opposite directions:

  - A 47-year-old lab manager. A screening panel flagged a hormone/metabolic pattern that's outside the range for healthy 25-year-olds but shows up in about 40% of people her age. She reports crushing afternoon fatigue and wants a shifted schedule and a rest space. A daily drug moves her numbers back into the 25-year-old range, but in the trial it didn't change how tired anyone said they felt.
  - A 30-year-old programmer with a congenital variation (roughly 2% of people have it). No pain, no measurable loss of any capacity, feels fine — but on our actual floor, with the lighting and the open plan and the standing desks, he can't get through a full day. He says he isn't sick, the building is. He wants the same accommodation.

  Half the committee thinks the second petitioner isn't diseased at all and we should approve him anyway on some other ground; the other half thinks that if we do that we've quietly given up on having a concept of disease. What I want from the memo is a rule we can actually apply to both, and it has to take a position on the reference-class question: do we compare people against healthy young adults or against their own age group? That one choice decides a lot of future cases, including whether the first petitioner has a condition at all. Recommend approve, deny, or approve with conditions for each petitioner, with a time frame, and give the losing side its best argument properly — if you go with departures from normal functioning, deal with the guy who's fine until he walks into our building; if you go with harm and values, explain why we aren't just a complaints desk with a stethoscope. About two pages.
reasoning: |-
  Okay, the user is on their university's Accommodations Committee and needs to draft a decision memo for two petitions. They had a debate about what constitutes a disease, which has made them the "announce one" on the committee. The committee is split on whether to approve the second petitioner who has a congenital variation but no symptoms—only issues in their specific work environment. The user wants a rule that applies to both cases and addresses the reference-class problem (comparing to healthy young adults vs. age group). They also need recommendations for each petitioner, considering time frames, and to present the losing side's best argument.

  First, I need to understand both cases. The lab manager is 47 with a hormone/metabolic pattern common in 40% of her age group. She has fatigue, but medication normalizes her levels without relieving symptoms. The programmer has a congenital variation (2% prevalence) with no pain or loss of function, but the workplace environment causes issues. He says the building is the problem, not him.

  The key issue is defining "disease, disorder, or medical condition." The policy doesn't define these terms, leading to ambiguity. The committee is divided: some think the second petitioner isn't diseased and should be accommodated on other grounds, while others worry that dilutes the concept of disease. The reference-class problem is central—whether to use healthy young adults or the individual's age group as the norm.

  I should consider different frameworks for defining disease. Boorse's biostatistical theory defines disease as a departure from normal species functioning, referencing age groups. This would classify the lab manager's condition as normal for her age, not a disease. But her symptoms are significant. Wakefield's harmful dysfunction adds a value component: dysfunction plus harm. This might cover both cases if the dysfunction causes harm in context.

  The memo needs a clear rule. Proposing a hybrid approach: require both a biological abnormality (dysfunction) and context-dependent harm. This addresses the reference-class by using age-adjusted norms for biological assessment. For the lab manager, her hormone levels are abnormal for her age? Wait, the case says 40% of her age group have the same pattern. So statistically, it's normal. But she has symptoms. The medication normalizes levels but not symptoms—so maybe the biological issue isn't the cause. That complicates things.

  For the programmer, the congenital variation isn't inherently dysfunctional, but in the specific environment, it causes harm. The environment interacts with his biology. So under harmful dysfunction, the dysfunction is the variation that, in that context, leads to inability to work, thus harm.

  Recommendations: Approve the programmer because his biological variation, while not a disease, causes dysfunction in the workplace context, leading to harm. For the lab manager, deny because her condition is statistically normal for her age, and the biological abnormality isn't linked to her symptoms (since meds don't help). Offer a temporary accommodation and reassessment.

  The losing side for the lab manager would argue her symptoms are real and impactful, so denying accommodation ignores her experience. For the programmer, the losing side would say accommodating him turns the committee into a complaints desk without medical basis.

  Need to ensure the memo is balanced, provides a clear rule, and addresses both cases consistently. Also, time frames: temporary for the lab manager (6 months) to reassess, standard for the programmer.
answer: |-
  ## Accommodations Committee Decision Framework Memo  
  **To:** Accommodations Committee Members  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Proposed Framework for Evaluating "Disease, Disorder, or Medical Condition" & Recommendations for Cases #LM-47 & #P-30  

  ### I. Core Challenge: Defining "Disease, Disorder, or Medical Condition"  
  Our policy hinges on accommodating "a diagnosed disease, disorder, or medical condition" but provides no definition. This creates ambiguity in cases where:  
  - **Biological variation** exists (e.g., age-related changes, congenital traits),  
  - **Functional impairment** is context-dependent (e.g., triggered by specific environments),  
  - **Subjective harm** (e.g., fatigue) lacks clear objective correlates.  

  The central philosophical conflict is the **reference-class problem**: Should "normal functioning" be assessed against:  
  - **(A) Idealized young-adult biology?** → Pathologizes aging/benign variations.  
  - **(B) Age/group-typical functioning?** → Risks ignoring real suffering in statistically "normal" groups.  

  **Proposed Resolution:** Adopt a **Hybrid "Functional Harm" Framework**  
  Accommodations require:  
  1. **A biologically anchored dysfunction or variation** (diagnosed by a qualified professional), *and*  
  2. **Context-specific functional harm** (impairing work capacity in *our* environment), *and*  
  3. **A reasonable causal link** between #1 and #2.  

  This framework:  
  - Anchors in medical diagnosis (policy requirement),  
  - Centers *workplace impact* (our mandate),  
  - Avoids purely statistical ("normal for age") *or* purely subjective ("I feel impaired") extremes.  

  ---

  ### II. Case Recommendations & Analysis  

  #### **Case 1: Lab Manager (47F)**  
  - **Diagnosis:** Age-related hormone/metabolic shift (≈40% prevalence in age group).  
  - **Symptoms:** Self-reported "crushing afternoon fatigue."  
  - **Treatment:** Medication normalizes biomarkers to young-adult range but *does not alleviate fatigue*.  
  - **Request:** Shifted schedule, rest space.  

  **Recommendation: DENY accommodation, but OFFER 6-MONTH REASSESSMENT with conditions.**  
  - **Rationale:**  
    - **Biological Anchor:** Present (diagnosed variation).  
    - **Context-Specific Harm:** Subjective fatigue is reported, but:  
      - Biomarkers normalized by treatment are uncorrelated with symptom relief → **no causal link** established between diagnosis and impairment.  
      - Fatigue is not measured objectively (e.g., cognitive testing, productivity metrics).  
    - **Reference-Class:** Condition is statistically *typical* for age (≈40%). Granting accommodation pathologizes normal aging without evidence of dysfunction beyond population norms.  
  - **Conditions for Reassessment:** Petitioner provides (within 6 months):  
    - Objective functional testing (e.g., neurocognitive assessment during fatigue episodes).  
    - Evidence ruling out non-medical causes (e.g., sleep disorders, workload stress).  

  **Best Argument for Approval (Losing Side):**  
  *"Her suffering is real and work-impacting, regardless of prevalence or biomarker response. Our policy’s purpose is to remove barriers to productivity—not debate disease ontology. Denial prioritizes biological norms over lived experience and may constitute age discrimination by dismissing age-associated symptoms as 'normal.'"*  

  ---  

  #### **Case 2: Programmer (30M)**  
  - **Diagnosis:** Congenital sensory-processing variation (≈2% prevalence).  
  - **Symptoms:** None in generic settings; severe functional impairment *only* in our specific open-plan office (lighting/noise/standing desks).  
  - **Request:** Schedule shift and rest space (identical to Case 1).  

  **Recommendation: APPROVE ACCOMMODATION for 12 MONTHS (renewable).**  
  - **Rationale:**  
    - **Biological Anchor:** Present (diagnosed congenital variation).  
    - **Context-Specific Harm:** Undisputed functional impairment occurs *exclusively in our workplace environment*.  
    - **Causal Link:** Environment interacts with biologically anchored trait → direct functional harm.  
    - **Reference-Class:** While statistically uncommon (2%), the *impairment* is abnormal relative to workplace demands. "Normal" is defined by *functional capacity*, not population prevalence.  
  - **Key Distinction from Case 1:** Impairment is environmentally triggered, objectively reported (inability to work full days), and plausibly linked to diagnosis.  

  **Best Argument for Denial (Losing Side):**  
  *"Accommodating this petitioner untethers 'disorder' from intrinsic pathology. He has no measurable dysfunction—only an interaction with our building. If environment alone creates a 'condition,' we become a complaints desk retrofitting workplaces to individual preferences, not medical need. This sets precedent for unlimited claims (e.g., 'fluorescent lights give me migraines')."*  

  ---  

  ### III. Framework Implications & Safeguards  
  - **Avoids Reference-Class Trap:** Focuses on *functional harm in our context*, not statistical norms. Age-related changes aren’t auto-pathologized; rare traits aren’t auto-dismissed.  
  - **Prevents "Complaints Desk" Slippage:** Requires:  
    - Medical diagnosis (biological anchor),  
    - Objective evidence of work impairment (e.g., productivity logs, third-party observation),  
    - Causal plausibility (per medical documentation).  
  - **Temporal Scope:** Initial approvals are **provisional** (6–24 months). Renewal requires updated evidence of need.  

  **Vote Recommendation:** Adopt the **Functional Harm Framework** and apply to both cases as above. This balances medical rigor with workplace equity, ensuring accommodations target *barriers to function*, not statistical outliers or subjective discomfort alone.  

  ---  
  **Attachments:** None  
  **Decision Deadline:** [Date of Meeting]
