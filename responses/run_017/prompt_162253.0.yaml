answer: |-
  Below is a runnable workshop design tailored to your specifications. It leverages the constraints (no internet, index cards, whiteboard) and focuses on eliciting authentic reactions to loss in a fictional world. The design is structured to test your two key features—attunement and backup—while forcing participants to confront the gap between data and lived experience. The session flows through five phases: Setup, Production, Event, Claims, and Debrief, with built-in contingencies for common pitfalls.

  ---

  ### **Workshop Title**: "The Unrecoverable Loss: Crafting Meaning in a Copy-Paste World"

  **Total Time**: 90 minutes  
  **Participants**: 16 writers (mixed gaming experience)  
  **Materials**: 
  - Whiteboard (for rules and public ledger)
  - Index cards (2–3 per participant)
  - Pens
  - Two hats or bowls (for random draws)
  - Tokens (e.g., colored paper clips; 5–10 per participant)
  - A physical "server box" (a shoebox or folder to hold ledger backups)

  **Key Roles**:
  - **Facilitator (You)**: Guides phases, enforces rules, observes reactions.
  - **Server (Volunteer participant)**: Manages the ledger, executes events, and distributes tokens. *Brief them quietly beforehand*.
  - **Participants**: Create items, experience losses, and pursue claims.

  ---

  ### **Phase 1: Setup (5 min)**
  **Goal**: Frame the exercise neutrally without priming emotional investment.  
  **Script**:  
  > "Welcome. Today, we’re simulating a shared fictional world. You’ll create items, experience events, and resolve losses. The goal is to explore how writers react when their creations are altered. All outcomes are fictional, but your choices have real stakes in this room. Let’s begin."  

  **Rules on Whiteboard** (Keep verbatim):  
  1. **Attunement**: Anything you create is yours alone. It cannot be given, sold, or stolen—only destroyed. Destruction removes your capacity to use it but affects no one else.  
  2. **Duplication**: Unattuned items (marked with Ⓤ) can be copied freely. Copies are identical but non-attuned.  
  3. **Backup**: The world restores every 5 minutes. Restored items retain their original data (e.g., "Sword +3") but may lose context.  
  4. **Claims**: If you lose something, you may request repair. All repairs cost tokens.  

  **Stakes Explained**:  
  - Tokens = currency for real-world benefits:  
    - 1 token: Move up 1 spot in reading order (e.g., from 10th to 9th).  
    - 3 tokens: Guaranteed 2 min of critique time for your work.  
    - 5 tokens: Your page read aloud by the group.  
  *Tokens are earned by creating items (1 per item) and can be spent only during claims.*  

  ---

  ### **Phase 2: Production (25 min)**  
  **Goal**: Generate attuned items and a ledger. Participants create while internalizing rules.  
  **Process**:  
  1. Participants draft items on index cards (e.g., a poem snippet, character sketch, map fragment).  
  2. Each item must include:  
     - Title  
     - 1–2 sentence description  
     - Creator’s name  
     - Ⓤ symbol *only* if intentionally unattuned (default is attuned).  
  3. Server records items in the public ledger (whiteboard):  
     - `ID | Creator | Description | Attuned? | Status (Active/Destroyed)`  
     - *Example*: `07 | Jane | "Cursed Dagger: glows near orcs" | Attuned | Active`  
  4. Server gives 1 token per item to the creator.  
  5. *Facilitator quietly creates a backup*: Copy the ledger onto paper, timestamp it, and store it in the server box.  

  **Why this works**:  
  - Writers invest labor in creation (your first feature), making items feel personal.  
  - Unattuned items (Ⓤ) are rare initially—participants must opt in, testing their attachment to exclusivity.  
  - **Watch for**: Reluctance to mark items as Ⓤ (sign of valuing exclusivity), or over-investment in descriptions (e.g., "This dagger is my protagonist’s soul!").  

  ---

  ### **Phase 3: Event (20 min)**  
  **Goal**: Administer losses silently. Four shapes of loss (3 core + 1 optional), masked as "random system events."  
  **Process**:  
  - Server draws 4–5 participant names from a hat. Each experiences one loss. *Do not reveal loss types*.  
  - **Events**:  
    1. **Destruction** (Core): Target an attuned item. Server marks it `Destroyed` in the ledger and physically tears the card. Creator loses capacity.  
    2. **Duplication** (Core): Target an unattuned item (Ⓤ). Server creates an identical copy, gives it to another participant, and adds `Copy of [ID]` to the ledger. Original creator retains their item but loses exclusivity.  
    3. **Restore** (Core): Target a destroyed item. Server reverts the ledger to the backup state (restoring the original entry) and returns a physically identical recreated card.  
    4. **Attribution Loss** (Optional): Target a restored or active item. Server erases the creator’s name from the ledger (e.g., `07 | ??? | "Cursed Dagger..."`). The card remains, but authorship is anonymous.  

  **Administering Events**:  
  - Frame generically: "Event 1: A system error occurred. Some items were affected."  
  - Server executes events swiftly and neutrally. No explanations.  
  - Repeat until all 4–5 are done (1–2 min per event).  

  **Why Four Shapes?**  
  - **Destruction** tests irreversibility and labor loss.  
  - **Duplication** tests exclusivity without deprivation.  
  - **Restore** tests the backup’s failure to address emotional residue.  
  - **Attribution Loss** (optional) tests authorship as a core part of attunement. It earns its place by targeting the writer’s identity—crucial for your research.  

  **How Variables Interact**:  
  | **Loss Shape**          | **Dominant Variable**      | **Why It Lands Differently**                                                                 |  
  |--------------------------|----------------------------|----------------------------------------------------------------------------------------------|  
  | Destruction              | Labor invested             | Physical destruction of labor feels violent; tokens can’t replace it.                        |  
  | Duplication              | Exclusivity                | Copies devalue the original ("My idea isn’t unique anymore").                                |  
  | Restore                  | Irreversibility            | Data is identical, but the violation lingers ("It’s back, but I saw it torn").               |  
  | Attribution Loss         | Uniqueness of record       | Anonymity severs the creator-item bond ("That’s mine, but no one knows").                    |  

  **Challenging the "It’s Just Data" Participant**:  
  - Force action via claims: Even skeptics must spend tokens to reject repair, forcing them to weigh effort vs. principle.  
  - If they refuse to invest: **Do not intervene**. Their refusal is data—note phrases like "This is pointless" or dismissive gestures. Later, contrast them with invested participants in the debrief.  

  ---

  ### **Phase 4: Claims (20 min)**  
  **Goal**: Force choices with real stakes. Repair options mirror your world’s tensions.  
  **Process**:  
  1. Affected participants choose a repair (publicly declared):  
     - **Exact Restoration**: Item restored to pre-loss state (costs 1 token).  
     - **Replacement**: Create a new item; old one remains lost (costs 2 tokens).  
     - **Public Record**: Server adds "LOST: [Item] by [Creator]" to the ledger (costs 1 token).  
     - **Apology**: Server reads a scripted apology aloud (e.g., "The system regrets your loss") (costs 0 tokens).  
     - **Nothing**: Reject repair (costs 0 tokens).  
  2. Server enforces choices (e.g., if you pick restoration, they recreate your card).  
  3. **Stakes pressure**: Remind participants that tokens = reading/critique perks.  

  **Why this works**:  
  - Writers care about being read, so token costs create tension.  
  - Choices reveal hidden values:  
    - Exact Restoration: "I want my original work back."  
    - Public Record: "I need acknowledgment, not the item."  
    - Apology: "I want emotional validation."  
  - **Watch for**: Hesitation when spending tokens, or anger at "cheap" options like apology.  

  ---

  ### **Phase 5: Debrief (15 min)**  
  **Goal**: Map experiences to your features and harvest language.  
  **Scripted Questions**:  
  1. "Raise your hand if your item was destroyed. How did it feel to see it torn? Did restoration fix that?" → *Links to backup futility*.  
  2. "If your item was duplicated, did it feel less 'yours'? Why?" → *Highlights exclusivity*.  
  3. "Who chose 'apology' or 'nothing'? What made it enough—or not?" → *Exposes emotional vs. practical repair*.  
  4. "Did anyone feel their restored item wasn’t truly the same? Why?" → *Tests irreversibility of experience*.  

  **Predictable Problems & Fixes**:  
  | **Problem**                          | **Solution**                                                                |  
  |--------------------------------------|-----------------------------------------------------------------------------|  
  | Participants "game" the system       | Enforce rules strictly; remind them stakes are real (e.g., "Tokens affect your reading spot"). |  
  | Someone treats it as improv comedy   | Acknowledge humor neutrally ("I see you’re laughing—what’s funny?"), then pivot to stakes. |  
  | Server becomes tyrannical            | Assign server role to a quiet participant; discretely oversee ledger entries. |  
  | Status hierarchies skew outcomes     | Randomize event targets via hat draw; anonymize claims choices.             |  
  | One loss type dominates              | Pre-select event targets to ensure all shapes are represented.              |  

  **What the Exercise Cannot Reproduce**:  
  - **Long-term emotional residue**: Your world’s "persistent" nature means losses accumulate over time. The workshop’s isolated events can’t replicate this—you’ll need prose to convey the weight of repeated violations.  
  - **True irreversibility**: Even destruction feels temporary in a 90-min session. In your novel, emphasize that backups are theoretical comforts, not emotional resets.  

  ---

  ### **Lines, Gestures, and Refusals to Watch For**  
  These are your research payload—record them verbatim:  
  1. **Physical reactions**: Clutching cards during destruction, flinching when duplicates are handed out, sighing during restores.  
  2. **Verbal contradictions**:  
     - "It’s just a card, but I put my soul into it."  
     - "The backup brought it back, but it’s tainted now."  
     - "Why should I care? It’s data... *[spends tokens anyway]*."  
  3. **Refusals to engage**:  
     - Eye-rolling during claims.  
     - Returning tokens unused ("I won’t play along").  
  4. **Authorial grief**:  
     - "That copy isn’t mine—it’s a cheap knockoff."  
     - "Without my name, it’s dead."  
     - "An apology? That’s all? I made this!"  

  ---

  ### **Final Notes**  
  - **Timing Buffer**: Cut production time if needed (20 min min.), but protect debrief.  
  - **Your Role**: Stay neutral. Use phrases like "The system requires..." to depersonalize decisions.  
  - **Output**: You’ll leave with index cards (artifacts), ledger records, and a list of participant quotes—fuel for your narrator’s voice.  

  This design forces writers to confront loss in a disposable world, blurring the line between fiction and self. When they insist "It’s not real," but rage at duplication or cling to restoration, you’ll have the sentences you need.
