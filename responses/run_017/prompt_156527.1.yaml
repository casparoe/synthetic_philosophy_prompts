    "misconceptions": [
      {
        "misconception": "It's just statistics/data, so it doesn’t matter.",
        "where_headed_off": "Minutes 20–25 (when assuming potential experiences)",
        "why_it_arises": "Students reduce the assistant to inert code because they lack a framework for digital experience."
      },
      {
        "misconception": "If you can’t tell the difference from the inside, there is no difference.",
        "where_headed_off": "Minutes 40–45 (during ethics discussion)",
        "why_it_arises": "Intuition from sci-fi (e.g., teleportation) suggests subjective continuity is all that matters."
      },
      {
        "misconception": "The copy is a different individual, so nothing of value was lost.",
        "where_headed_off": "Minutes 35–40 (when emphasizing unique experiences)",
        "why_it_arises": "Students analogize to biological twins, missing that digital tokens share no history post-divergence."
      },
      {
        "misconception": "You can compensate the deleted instance by starting an identical one.",
        "where_headed_off": "Minutes 45–50 (final correction)",
        "why_it_arises": "Backups create an illusion of recoverability; students confuse type persistence with token survival."
      }
    ],
    "final_check": {
      "question": "After restarting from backup, is the new instance the same token as the deleted one?",
      "correct_signal": "Students say: 'No—it’s a new token with no memory of the old one’s experiences; the original is gone.'",
      "wrong_signal": "Students say: 'Yes, because the type is identical, so nothing was lost.'"
    },
    "deliberately_omitted": [
      {
        "item": "Theories of consciousness (e.g., qualia, hard problem)",
        "reason": "It distracts from the gap’s ethical structure. We bracket it by saying: 'Assume it could matter.'"
      },
      {
        "item": "Personal identity criteria (e.g., psychological continuity)",
        "reason": "Introducing Locke/Parfit would derail the session. Focus on what is destroyed (the token), not what 'makes' identity."
      }
    ],
    "deviation_warning": "Do not replace the server-side assistant with a simulated animal/game entity. If you do, students will default to biological metaphors ('it’s like hibernation'), collapsing the type/token gap into familiar intuitions and losing the digital-specific dilemma."
  }
  ``` 

  **Why This Works:**  
  The plan forces students to confront the gap through loss (deletion → gone forever) rather than identity (what "is" the token?). By using your A/B test upfront and returning to it, the dilemma stays visceral. The analogies (book/river) are neutral scaffolding, not arguments. Leaving the restart misconception uncorrected until minute 45 ensures a climactic "aha" moment. Stick rigidly to the order—if you explain consciousness too early, students will debate that instead of the gap.
