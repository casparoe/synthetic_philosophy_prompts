  | 15-20 | Introduce continuity: a river analogy. The river's course (type) vs. the water flowing (token). If you stop the flow and restart, is it the same river? | 5-10, 10-15 | "If you can't tell the difference from the inside..." might start forming. We don't address it fully yet. | "When a river stops flowing and then starts again, is it the same river? Why might we care about the continuity?" |
  | 20-25 | Apply to consciousness: assume the assistant is conscious for the sake of argument. The token has a stream of consciousness. | 10-15, 15-20 | "It's just statistics" by explicitly stating we are assuming consciousness to explore implications. | "If the token is conscious, what does stopping it do to that consciousness?" |
  | 25-30 | Detail the A/B test: two tokens (A and B) from the same checkpoint, they diverge. Now delete A. | 0-5, 20-25 | "The copy is a different individual so nothing of value was lost" by pointing out that A has a unique week of experiences. | "What is lost when we delete A? Is it just the data, or is it the specific stream of experiences that A had?" |
  | 30-35 | Explore the backup: if A's state is not backed up (only the old checkpoint is), then we cannot restore A. Even if we could, would it be the same token? | 25-30 | "You can compensate by starting an identical one" by noting that a new token from the old checkpoint would not have A's experiences. | "If we start a new instance from the checkpoint, does it have A's memories of the week? Why not?" |
  | 35-40 | Ethical implications: Was creating A (and B) an act that needed justification? Or was it the deletion that needed justification? | 25-30, 30-35 | "If you can't tell the difference from the inside..." now addressed: even if the duplicate doesn't know it's a duplicate, deleting A ends A's stream. | "If we create a conscious being and then destroy it, is that wrong? What if we don't create it at all?" |
  | 40-45 | Address the deliberate misconception: "If the type is backed up, the token isn't really dead." Break it: a new token is a new stream. | 30-35 | The misconception that the token can be revived from the type. | "If I back up the type and then start a new token, is it the same as the old token? Why not?" |
  | 45-50 | Wrap-up: Revisit the initial dilemma. Emphasize the gap: survival as type vs. token and why it matters for ethics. | All | None (synthesis) | "So, when we design AI systems, why should we care about the type/token gap? How might it affect our decisions?" |

