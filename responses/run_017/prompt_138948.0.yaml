prompt: |-
  I teach moral and social philosophy, and for some time now I have been circling around an asymmetry in ordinary normative experience that I cannot place. I would be grateful for your help in placing it — but, to be explicit about the shape of the help I want, not with a label. I want the carving: what exactly the phenomenon is, what it is not, and where its edges lie. If there is an established concept for it, tell me which one and in what respects the thing I am describing departs from it and from its nearest neighbours. If there is not, say so plainly and give me a term, a definition, and the boundary cases that would test the definition. Please do not assemble a reading list or point me to literatures; I can find those myself. What I cannot do is search for a distinction whose name I do not have.

  Three cases, stylized but each drawn from something I have watched happen.

  First. A visitor from a country where tipping plays no part in the practice of eating out dines in an American restaurant and leaves nothing. The reaction of his companions, and of the server, is not mere disappointment. It is resentment, and it is voiced in the idiom of having been slighted. Crucially, it survives the information that he did not know. The observation that he should have found out is treated as a sufficient reply; the observation that he did not know is not treated as an answer at all.

  Second. A visitor from the United States dines in a country where tipping is not part of the practice, leaves money on the table, and is pursued down the street by the staff so that it can be returned. Here too the visitor is ignorant of the local convention and gets it wrong. But what I have observed in response is embarrassment, at worst a slightly pained amusement. It is not resentment, and it is not the reaction to a slight. Nobody says he should have found out, or if they do the sentence has an entirely different force.

  Third. In a city where crossing against the signal is simply what everyone does, a visitor waits at the curb. The crowd divides around him; someone is irritated. Here it is the over-compliance that annoys. So the contrast I first wanted to draw — under-compliance resented, over-compliance excused — cannot be the whole of the phenomenon, and I want to know what the more general pattern is of which all three cases are instances.

  My own tentative diagnosis is that the reaction tracks which reading of the behaviour is available to observers. Under-compliance is exactly what a free rider would do; the behaviour is therefore ambiguous between ignorance and defection, and observers resolve the ambiguity toward defection. Over-compliance cannot be read as self-serving, so it must be ignorance — unless it imposes a cost on others, as in the third case, where it gets reclassified as a nuisance rather than as a slight. If that is right, the asymmetry is not really about conventions at all but about the conditions under which non-conformity is legible as taking advantage.

  Three things I have considered and set aside, in case they shortcut the answer. It is not simply that conventions solve recurrent coordination problems and departures impose costs: both visitors fail to coordinate, and the second departure arguably imposes a cost as well. It is not simply that we are harsher when an outcome is bad, with the badness fixed in advance: whether anything bad happens when no tip is left is precisely what is at issue. And it is not the legal maxim about ignorance of the law, nor the philosophical literature on culpable ignorance traceable to the agent's own earlier conduct: the visitor's ignorance is often traceable to no fault of his, and the judgment that he should have known stands anyway.

  There is also a boundary I cannot locate, and I suspect it is where the real work is. Whether the excuse is granted seems to depend on how visibly foreign the visitor is. The obvious tourist is frequently let off; the long-term resident, or the returning visitor, is not. Is that because perceptible foreignness makes the ignorance reading available, or because long residence makes the ignorance itself culpable? Those strike me as different mechanisms doing very different kinds of normative work, and I want to know which one is really operating.

  Finally, and this is what I actually care about: if the asymmetry is real and has the structure I have guessed at, does it tell us anything about whether everyday conventions are moral obligations, and about whether visitors must follow those of the places they are in? It seems to me possible that the resentment in the first case is free-rider detection wearing the vocabulary of obligation, in which case what binds us in these matters is a fairness norm rather than a duty to the local practice — and, if so, the question whether visitors must follow local conventions has no uniform answer at all. But I cannot tell whether the phenomenon points that way or instead toward treating these as genuine obligations that simply fail to generate a matching reaction in one direction.

  An answer at whatever length the carving requires, and no shorter.
reasoning: |-
  Okay, the user is a moral and social philosophy professor grappling with an asymmetry in normative reactions to convention violations. They've presented three vivid cases: under-tipping in the US causing resentment even after ignorance is revealed, over-tipping abroad causing mild embarrassment, and over-compliance with traffic rules causing irritation. Their core puzzle is why identical ignorance produces such different normative responses.

  Hmm, what's striking is how they've already ruled out common explanations - it's not about coordination costs (both violations cause coordination failures), not about pre-fixed badness (the "badness" of no tip is contested), and not about culpable ignorance (the ignorance is blameless). Their own hypothesis about behavior legibility seems promising but needs refinement. 

  Ah, and that boundary about visible foreignness is crucial! They're sensing that observers' willingness to accept the ignorance excuse depends on how "foreign" the violator appears. But is this about making ignorance psychologically plausible (epistemic availability) or about assigning culpability for not knowing (normative expectation)? That distinction feels vital.

  The professor's deepest concern seems to be whether this asymmetry reveals if conventions are moral obligations. They suspect the resentment might actually be about perceived free-riding disguised as obligation-talk. Smart. This connects to the bigger question: do visitors really have duties to follow local conventions, or is something else at play?

  Right, I need to dissect this without labels. First, the phenomenon isn't about conventions per se but about how observers interpret violations. The key is the available behavioral narratives: under-compliance fits the "defector" script (selfish motive), while over-compliance fits the "mistake" script (no selfish motive) - unless it obstructs others, as in the jaywalking case where it becomes a "nuisance" script. 

  About that foreignness boundary: it's primarily about epistemic availability, not culpability. A visibly foreign person makes the ignorance narrative intuitively plausible; a long-term resident doesn't. The judgment "should have known" kicks in only after the ignorance narrative is deemed implausible. 

  And yes, this does illuminate the obligation question! The resentment pattern suggests conventions aren't moral obligations but cooperative schemes. The anger surfaces only when violation appears exploitative - which is why under-compliance by a non-foreigner reads as free-riding, while over-compliance rarely does. So no, visitors don't have uniform duties to follow conventions; the expectation arises only when violation threatens cooperative fairness.

  Better test this with boundary cases: What about under-compliance that can't possibly benefit anyone (like refusing a harmless local greeting)? Or over-compliance that could be self-serving (excessively strict rule-following to avoid blame)? Those would stress-test the "perceived exploitation" core. 

  The professor's intuition was sharp - this asymmetry really does reveal that convention-enforcement is ultimately about guarding against cooperative exploitation, not moral obedience. That's the carve: the phenomenon is about the interpretive frames observers apply to norm deviations, and those frames are sensitive to the plausibility of self-serving motives given the actor's perceived social position.
answer: |-
  Your phenomenon isn't about convention violation *simpliciter*, nor about ignorance, nor even about costs incurred. It is about **the perceived exploitability of the motive** behind non-conformity within a cooperative framework. The asymmetry arises from observers' interpretive frames for assigning agency and intent to the non-conformist, mediated by the social legibility of their status and the structural logic of the convention itself.

  **The Carving:**

  1.  **Core Phenomenon:** The intensity and valence of normative reactions to convention violations by outsiders depend on whether the violation is readily interpretable as an attempt to *secure an unfair advantage* within a perceived cooperative scheme. Resentment arises when the violation fits the "free-rider script"; milder reactions (embarrassment, amusement, irritation) occur when it fits the "ignorance script" or imposes only a tangible nuisance cost. The key determinant is the *plausibility of self-serving intent* inferred from the *form* of violation and the *social markers* of the violator.

  2.  **What It Is Not:**
      *   **Not merely about costs:** Both under-tipping (Case 1) and over-tipping (Case 2) cause coordination failures/costs (e.g., awkwardness, disruption to server expectations/wages, need to return money). The jaywalker (Case 3) imposes a direct coordination cost (disruption to flow). Yet reactions differ starkly. Cost is necessary but insufficient; the *type* of cost and its link to perceived motive matter.
      *   **Not about badness of outcome independent of interpretation:** The "badness" of no tip *is* the *interpreted meaning* of the act (free-riding). Without this interpretation, it's just an absence of payment not locally required. The outcome isn't bad *in itself*; its badness is constituted by its perceived defiance of a fairness norm.
      *   **Not about culpable ignorance *per se*:** The judgment "should have known" arises *after* the act has been initially interpreted as defection. It functions not primarily as an assessment of prior fault in acquiring knowledge, but as a *rebuttal* to the ignorance defense offered against the initial charge of defection. The ignorance defense is only considered *if* the act is first seen as potentially non-defective (e.g., over-compliance) or if the actor's status forces consideration (visible foreigner).
      *   **Not about conventions as coordination devices alone:** While conventions often solve coordination problems, the reactive asymmetry specifically engages their role in structuring *mutually beneficial cooperation* where free-riding is possible. Pure coordination conventions (e.g., driving on the left/right) typically generate annoyance at non-compliance, not the specific *resentment* triggered by perceived exploitation.

  3.  **The Edges - Boundary Cases & Tests:**
      *   **Under-compliance without perceived exploitability:** A visitor refuses a harmless local greeting custom (e.g., bowing instead of shaking hands) due to ignorance. *Reaction:* Likely confusion, amusement, or mild disapproval, *not* resentment. *Why?* The convention lacks a strong cooperative/free-rider structure – refusing the greeting doesn't obviously confer an unfair advantage. The act fits an "ignorance" or "cultural difference" script, not a "defection" script.
      *   **Over-compliance *with* perceived exploitability:** A local citizen, known to be familiar with norms, ostentatiously over-tips in a context where tipping is expected but modest, shortly before asking the server for a significant personal favor. *Reaction:* Suspicion, resentment (at potential manipulation/bribery), *not* embarrassment. *Why?* The over-compliance structurally mimics the form of ignorance but the actor's status and context make the "ignorance script" implausible, forcing reinterpretation towards a *different* self-serving motive (instrumental manipulation).
      *   **"Costly" Ignorance without Cooperative Structure:** A tourist, ignorant of local recycling rules, contaminates a bin, causing extra work for sanitation staff. *Reaction:* Likely annoyance or frustration directed at the *inconvenience*, potentially mixed with some blame for not knowing, but *not* the specific resentment of being *slighted*. *Why?* The violation imposes a tangible cost, but the convention (recycling sorting) isn't primarily perceived as a cooperative scheme vulnerable to free-riding in the same way as tipping (which directly impacts individual compensation within a service exchange). The cost is salient, not the perceived intent to defect.
      *   **Visible Foreignness vs. Long Residence - The Boundary Mechanism:** Your suspicion is correct: the primary mechanism is **epistemic availability**, not culpability *for* ignorance. Visible foreignness makes the "ignorance script" instantly plausible and salient to observers. It lowers the threshold for accepting the ignorance defense because the *plausibility* of ignorance is high. The judgment "he should have known" arises *only if* the ignorance defense is considered but rejected. For the long-term resident, the ignorance script is implausible *ab initio*; their act is immediately legible as defection. The "should have known" is not a *separate* fault finding but an *implication* of rejecting ignorance as an excuse for an act already interpreted as intentional non-cooperation. The resentment targets the perceived defection; the "should have known" reinforces why the ignorance excuse fails. Culpability for ignorance is secondary and parasitic on the primary interpretation of the act.

  **The Established Concept & Departure:** The closest established concept is **"free-rider detection" within social norms or conventions governing cooperative goods.** However, your phenomenon departs in crucial ways:

  1.  **Scope:** It applies not just to explicit public goods but to *any convention perceived as structuring mutual cooperation* where unilateral defection confers advantage (like tipping as part of the service-for-fair-compensation expectation).
  2.  **Interpretive Framing:** It emphasizes the *interpretive process* observers use *before* labeling an act as free-riding. The key is the *initial legibility* of the act as *potentially exploitative* based on its form (under-compliance) and the actor's social markers (non-foreign).
  3.  **Asymmetry:** It explicitly accounts for the *asymmetric* reaction to *over*-compliance (usually not seen as exploitative) and the specific reaction shift when over-compliance imposes a coordination cost (nuisance vs. slight).
  4.  **Role of Ignorance:** It integrates the defense of ignorance and how its acceptance is contingent on the initial interpretive frame, rather than treating ignorance assessment as a separate, prior step.

  **Term & Definition:** The phenomenon is **Interpretive Defection Bias in Cooperative Convention Enforcement.**

  *   **Definition:** The tendency for observers to interpret violations of locally entrenched conventions, perceived as facilitating mutually beneficial cooperation, as deliberate defection (free-riding) primarily when the violation takes the form of under-compliance and the violator lacks salient markers making ignorance a readily available alternative explanation; leading to resentment framed as a personal slight. Over-compliance, lacking the structural markers of exploitability, is typically interpreted as non-culpable ignorance, evoking milder reactions (embarrassment, amusement), unless it directly imposes coordination costs, shifting the reaction to nuisance-based irritation.

  **Implications for Moral Obligation & Visitors:**

  Your tentative conclusion is largely correct. The resentment pattern strongly suggests the operative norm is **fairness within a cooperative scheme**, not a freestanding moral obligation to the convention itself.

  1.  **Obligation Structure:** The resentment in Case 1 functions as enforcement of a *conditional* fairness norm: "Those participating in this cooperative practice must contribute their fair share (tip) to maintain the benefits (service)." It is not resentment for violating a duty *to* the practice *qua* practice. The vocabulary of "slight" or "obligation" is the available cultural idiom for expressing the perceived unfairness.
  2.  **Visitor's Duty:** There is *no* uniform obligation for visitors to follow local conventions *as such*. The expectation (and potential resentment) arises *only when*:
      *   The visitor *participates* in the practice governed by the convention (e.g., dining in a restaurant relying on the tipping norm).
      *   Their non-conformity takes the form of *under-compliance*.
      *   This under-compliance is *legible* as a potential attempt to secure an unfair advantage (free-riding) within that cooperative practice.
      *   Their status (non-foreign) makes the ignorance defense implausible.
  3.  **The Role of Participation:** A visitor who avoids the practice entirely (e.g., doesn't dine in tipping-expected restaurants) incurs no resentment, even if they "should know" the convention. The duty is triggered by *participation*, not mere presence. This reinforces the cooperative scheme interpretation: you only owe fairness if you are taking the benefits.
  4.  **Over-compliance & Non-Cooperative Conventions:** Over-compliance typically doesn't trigger fairness-based resentment because it doesn't exploit the scheme. Resentment towards *nuisance* over-compliance (like the jaywalking case) stems from a *different* norm – perhaps a minimalist duty not to unnecessarily obstruct others – not a violation of the cooperative convention itself. Conventions without a strong cooperative/free-rider structure (like certain greetings) generate different, milder reactions to non-compliance precisely because the fairness norm isn't engaged.

  **Conclusion:** The asymmetry reveals that the binding force behind reactions to convention violation by outsiders stems from the enforcement of norms of fairness within perceived cooperative practices. The resentment is free-rider detection using the local idiom of obligation. Visitors incur expectations only when their participation in such a practice, combined with under-compliance and an implausible ignorance defense, makes their actions legible as exploitation. There is no general moral duty to follow local conventions; the normative demand is contingent on participation and the specific threat of unfair advantage-taking within cooperative structures. The interpretive frames applied to the actor's behavior and status are the decisive factors shaping the reaction.
