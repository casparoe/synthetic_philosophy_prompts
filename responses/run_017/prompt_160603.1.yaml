    Card3: T=6 hours, A=20 units
    ...
    Card9: T=0 hours, A=80 units

    Each step: lose one hour of family time, gain 10 units of achievement.

    Adjacent: card i+1 might seem better because the gain in achievement compensates the loss in family time.

    But card9: no family time and 80 units of achievement vs card1: 8 hours family time and 0 achievement. 
    Some might think card1 is better.

    So then we have card1 < card2 < ... < card9 and card1 > card9.

    This is the cycle.

    We can use three goods to make it harder to compare, but two goods might be clearer.

    Given the time, let's go with two goods: Family Time (FT) in hours per week, and Career Achievement (CA) in arbitrary units.

    Card1: FT=8, CA=0
    Card2: FT=7, CA=10
    Card3: FT=6, CA=20
    Card4: FT=5, CA=30
    Card5: FT=4, CA=40
    Card6: FT=3, CA=50
    Card7: FT=2, CA=60
    Card8: FT=1, CA=70
    Card9: FT=0, CA=80

    Each step: decrease FT by 1 hour, increase CA by 10 units.

    Now, for the activity:

    16 students -> 8 pairs.

    We have 8 comparisons: (1,2), (2,3), ... (8,9)

    Assign each pair to one adjacent pair.

    They see only their two cards and vote which is better.

    We expect them to vote for the card with more CA and less FT in each adjacent pair? Let's see:

    (1,2): Card1: (8,0) vs Card2: (7,10) -> which is better? 
        Some might think: losing 1 hour of family time for 10 units of achievement? worth it? 
    (2,3): (7,10) vs (6,20) -> again, losing 1 hour for 10 more units.

    ...

    (8,9): (1,70) vs (0,80) -> losing the last hour for 10 units.

    Then after they have all voted, we build the chain on the board: 
        Card1 -> Card2 -> ... -> Card9, with each arrow meaning "better than".

    Then we ask: is Card9 better than Card1? 
        Card1: 8 hours FT, 0 CA
        Card9: 0 hours FT, 80 CA

    We take a vote.

    We expect that many will say Card1 is better than Card9.

    Then we have: 
        Card1 < Card2 < ... < Card9   (so Card1 < Card9)
        and Card1 > Card9.

    Contradiction.

    This is the spectrum argument.

    Now, for the activity with 80 minutes.

    Timeline:

    0-5 min: Introduction. Explain the goods: Family Time and Career Achievement. Explain the activity: they will see two lives and must choose which is better. No ties allowed. They must choose.

    5-10 min: Distribute the cards and the ballot sheets. There are 8 pairs of students. Each pair gets two cards (consecutive ones) and a ballot to vote.

    10-25 min: Students discuss in pairs and vote. They also record their reason. (15 minutes)

    25-35 min: Collect the ballots and build the chain on the board. 

        On the board, we have 9 cards represented. We start with Card1. 
        Then we ask: for the pair (1,2): which did they choose? If they chose Card2, then we put an arrow from Card1 to Card2. 
        Then pair (2,3): which did they choose? say Card3, then arrow from Card2 to Card3.
        ...
        until we have a chain from Card1 to Card9.

    35-40 min: Now we reveal Card1 and Card9. We ask the students: which is better, Card1 or Card9? They vote individually (show of hands). 

    40-50 min: We show the contradiction: according to the chain, Card1 is worse than Card9 (because Card1 < Card2 < ... < Card9 implies Card1 < Card9). But in the direct comparison, they said Card1 is better than Card9. 

    50-80 min: Debrief.

    The debrief should cover:
        - Each step seemed like an improvement, but the end result is worse.
        - This challenges the transitivity of better-than.
        - Options: 
            1. Reject one of the adjacent judgments.
            2. Reject transitivity.
            3. Say that the forced choice was illegitimate: maybe the two lives are on a par, or incomparable, or there is vagueness.

        - In the ballots, if any pair had a tie, but we didn't allow ties. So what if a pair insists on a tie? We force them to choose. But if they still refuse, we might have to note it.

        - Lexical ordering: if someone says that any amount of family time is more important than any amount of career achievement, then they would say Card1 is better than Card2, etc. But then they would break the chain. We should note that if there is a lexical ordering, then they might not have the adjacent improvements. 

        - We should point out that in the activity, we forced a choice, but in reality, there might be incomparability or parity.

        - The difference between this and the self-torturer: in the self-torturer, each step is permissible (not required) and the cycle is in permissibility, not in betterness.

        - What a cyclic better-than would do to choice: if A>B, B>C, C>A, then you would pay to go from A to B, then from B to C, then from C to A, and you are back where you started but poorer.

    Rules to prevent meta:
        - Do not reveal the entire chain. Each pair only sees their own two cards.
        - Do not allow students to see the other pairs' cards.
        - Do not tell them there is a loop.

    If a pair insists on ties:
        - Instruct them that they must choose one life as better. If they absolutely cannot, they can flip a coin, but they must submit a choice.

    If someone proposes a lexical ordering:
        - In the discussion, if a pair says that family time is lexically more important, then they might choose Card1 over Card2 in the first comparison. 
        - That's okay. We want them to vote as they see fit. 
        - Then the chain might break at that point. 
        - But we hope that for most pairs, the small trade is acceptable. 
        - If there is a break, then we don't have a chain of improvements. 
        - In that case, we can still have a chain of votes, but it might not be a complete chain of improvements. 
        - We can then discuss why they think that.

    We have 9 cards, 8 comparisons, and 8 pairs. So each pair does exactly one comparison.

    Ballot sheet: 

        Pair: [number] 
        Cards being compared: 
            Card A: Family Time = [X] hours, Career Achievement = [Y] units.
            Card B: Family Time = [X'] hours, Career Achievement = [Y'] units.
        Which is better? (circle one) Card A / Card B
        Reason (optional): _________________________________________

    Then for the final vote: 
        Which is better? 
            Card1: Family Time = 8 hours, Career Achievement = 0 units.
            Card9: Family Time = 0 hours, Career Achievement = 80 units.
        Vote: Card1 / Card9

    And we do by show of hands.

    This fits in the time.

    Let me write the card values explicitly:

    Card1: FT=8, CA=0
    Card2: FT=7, CA=10
    Card3: FT=6, CA=20
    Card4: FT=5, CA=30
    Card5: FT=4, CA=40
    Card6: FT=3, CA=50
    Card7: FT=2, CA=60
    Card8: FT=1, CA=70
    Card9: FT=0, CA=80

    The trades are uniform: lose 1 hour FT, gain 10 units CA.

    In the debrief, we note that if at any adjacent step a student thought the trade was not worth it, then they would have voted for the first card. In that case, the chain is broken. But if they voted for the second card in each step, then we have the chain.

    We also note that the chain of small improvements can lead to a big loss.

    This is a standard spectrum argument.

    We close by noting that this activity stages a chain that leads to a cycle only if the final comparison goes the other way. But in the example, it is a chain from Card1 to Card9 and then a separate comparison between Card1 and Card9 that contradicts the chain.

    This is not a cycle in the mathematical sense (a cycle would require Card9>Card1 and then Card1>Card9, forming a circle). Here we have Card1 < Card9 by the chain and Card1 > Card9 by direct comparison, so together Card1>Card9 and Card1<Card9.

    This is the contradiction.

    The activity cannot stage the difference between parity and incomparability, because we force a choice. The facilitator must explain that in some steps, the two options might be on a par (neither better than the other, but not equal) or incomparable, and that might be why the forced choice is artificial.

    We also note that if there is a cyclic betterness relation, then an agent would be vulnerable to a money pump.

    This should work.
answer: |-
  ### Spectrum Argument Activity: The Family Time vs. Career Achievement Trade-off  
  **Core Idea:** Students build a chain of "better-than" judgments between lives defined by two goods (Family Time and Career Achievement). Each adjacent pair involves a small, seemingly rational trade, but the chain loops back to a life that is clearly worse than the start. This forces a confrontation with the transitivity of "better-than."

  ---

  ### **Setup**  
  **Goods:**  
  - **Family Time (FT):** Hours per week with loved ones (more = better).  
  - **Career Achievement (CA):** Arbitrary "success units" (more = better).  

  **Cards (9 cards, 8 comparisons):**  
  | Card | Family Time (hours/week) | Career Achievement (units) |  
  |------|---------------------------|----------------------------|  
  | 1    | 8.0                       | 0                          |  
  | 2    | 7.9                       | 10                         |  
  | 3    | 7.8                       | 20                         |  
  | 4    | 7.7                       | 30                         |  
  | 5    | 7.6                       | 40                         |  
  | 6    | 7.5                       | 50                         |  
  | 7    | 7.4                       | 60                         |  
  | 8    | 7.3                       | 70                         |  
  | 9    | 7.2                       | 80                         |  

  **Trade Scheme:**  
  - Each step: **Lose 0.1 hour (6 minutes) of Family Time, gain 10 units of Career Achievement.**  
  - **Why it works:**  
    - *Adjacent pairs:* The loss of 6 minutes of Family Time feels trivial compared to +10 CA (e.g., "I barely notice 6 minutes, but 10 units is a promotion!").  
    - *Full cycle:* Card 9 has **48 minutes less Family Time** than Card 1 but +80 CA. For 20-year-olds, trading ~1 hour/week of family for career success may seem irrational when seen directly.  

  ---

  ### **Ballot Sheets**  
  Each pair receives:  
  ```markdown
  **COMPARISON: CARD [A] vs. CARD [B]**  
  - **Card [A]:** [FT] hours Family Time, [CA] units Career Achievement.  
  - **Card [B]:** [FT] hours Family Time, [CA] units Career Achievement.  

  Circle ONE life as better and explain briefly:  
  - **Card [A] is better**  
  - **Card [B] is better**  

  Reason: ________________________________________  
  ```  
  *(Example: Pair 1 sees Cards 1 vs. 2; Pair 2 sees Cards 2 vs. 3, etc.)*  

  ---

  ### **Timeline (80 Minutes)**  
  1. **Intro (10 min):**  
     - Explain goods (FT and CA). Emphasize: "No prior knowledge needed; judge intuitively."  
     - Rules:  
       - **Forced choice:** No ties. You MUST pick one life as better.  
       - **No peeking:** Only see your card pair. Do not discuss other pairs.  
       - **No meta-guessing:** Focus only on your two lives. "If you try to reverse-engineer the chain, you’ll ruin the exercise!"  

  2. **Pair Work & Voting (25 min):**  
     - Divide 16 students into **8 pairs.**  
     - Assign comparisons:  
       - *Group A (4 pairs):* Cards 1 vs. 2 → 2 vs. 3 → 3 vs. 4 → 4 vs. 5  
       - *Group B (4 pairs):* Cards 5 vs. 6 → 6 vs. 7 → 7 vs. 8 → 8 vs. 9  
     - Pairs discuss/vote on ballots (10 min).  
     - **Facilitator circulates:**  
       - If a pair insists on a tie, say: "You must choose. If truly equal, flip a coin—but justify why."  
       - If lexical ordering arises (e.g., "No CA is worth any FT!"), note it but insist: "For this pair, which is better *given the numbers*?"  

  3. **Build the Chain (15 min):**  
     - Pairs read ballots aloud. Tape cards in order on the board, with arrows showing votes:  
       *Card 1 → Card 2 → Card 3 → ... → Card 9*  
     - Highlight: "You’ve collectively endorsed: Card 1 < Card 2 < ... < Card 9."  

  4. **The Reveal (15 min):**  
     - Show **Card 1 (8.0 FT, 0 CA)** and **Card 9 (7.2 FT, 80 CA)**.  
     - Vote: "Which is better? Card 1 or Card 9?" (Show of hands).  
     - **Expected result:** Most vote Card 1 > Card 9 (losing 48 min/week of family feels too costly for CA).  

  5. **Debrief (15 min):**  
     - **Contradiction:**  
       - Chain says Card 1 < Card 9 (transitivity).  
       - Direct comparison says Card 1 > Card 9.  
       - **Conclusion:** Card 1 < Card 9 and Card 1 > Card 9 → transitivity fails or judgments are flawed.  
     - **Three Ways Out:**  
       | Option                      | Response in Activity                          |  
       |-----------------------------|-----------------------------------------------|  
       | **Deny a link**             | "But every step seemed rational! Cutoffs will be arbitrary (e.g., why 7.3 FT to 7.2 FT is bad but 7.4 to 7.3 is ok?)." |  
       | **Deny transitivity**       | "Then better-than is cyclic. What would you choose? (E.g., Money Pump: Pay to move from A→B→C→A, losing resources)." |  
       | **Deny forced choice**      | "Maybe some pairs are **on a par** (equally good but not equal) or **incomparable** (no common measure). But we forced a choice!" |  
     - **Key Distinctions:**  
       - **Not the self-torturer:** This is a cycle in *betterness* (each step is *better*), not permissibility (where each step is merely *acceptable*). Here, transitivity is directly challenged.  
       - **Parity vs. Incomparability:** The activity can’t stage this. Say: "Incomparability means no common measure (e.g., apples vs. orbits). Parity means both are good but neither is better, even vaguely. Forced choice hides both."  
     - **Scattered Cutoffs:**  
       - If students voted against a step (e.g., "Card 5 is NOT better than Card 4!"), their ballot breaks the chain. Point to it: "This person drew a cutoff—why here?"  
     - **Close Honestly:**  
       - "This activity *assumes* small trades are additive. Real life might reject that. But if you accept the trades, transitivity forces you to accept Card 9 > Card 1. Do you?"  

  ---

  ### **Rules to Prevent Meta-Gaming**  
  - **Blind Pairs:** Pairs only see their cards. No group sees >1 comparison.  
  - **Decentralized Start:** Group A starts at Card 1, Group B at Card 5. No one sees the loop.  
  - **Time Pressure:** "You have 90 seconds per pair—decide fast!"  
  - **Facilitator Script:** "If you try to guess the full sequence, you’re missing the point. Focus on *this* pair!"  

  ---

  ### **What the Activity Can’t Stage**  
  1. **Parity vs. Incomparability:**  
     - Forced choice masks whether lives are *on a par* (equally good but not equal) or *incomparable* (no common measure). The facilitator must explain this gap verbally.  
  2. **Aggregation Mechanism:**  
     - Why are small trade-offs additive? The activity assumes they are, but students might deny this.  
  3. **Vagueness Cutoffs:**  
     - The activity shows scattered cutoffs in ballots, but not *why* they occur. Highlight: "Your cutoff reflects where the trade stopped seeming worth it—but that line is vague and arbitrary."  

  ### **Why This Works**  
  - **Relatable for 20-year-olds:** Career vs. family speaks to their life choices.  
  - **Drip-Feed Effect:** Small losses (6 min/week) feel insignificant until aggregated (48 min/week).  
  - **Cycle in Betterness, Not Permission:** Forces a direct attack on transitivity.  

  --- 
  **Final Note:** The power of this activity is in the slow reveal. Students *feel* the paradox when they see Card 1 and Card 9—no lecture needed. Lean into the silence after the reveal!
