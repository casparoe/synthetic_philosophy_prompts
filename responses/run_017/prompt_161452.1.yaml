answer: |-
  ### Metaphysics Seminar Activity: Grounding Game  
  **Objective:** Students encounter three core metaphysical insights through gameplay without prior exposure to technical terms:  
  1. Dependence is "cheap" (easily found), but constitutive dependence (the "right" dependence) is what matters.  
  2. Completeness (every non-fundamental fact grounded) + parsimony (minimal fundamentals) leads to three uncomfortable outcomes: a single uninformative ground, an arbitrary set of fundamentals, or a regress.  
  3. Fundamentality ≠ being smallest, earliest, or causally upstream.  

  **Materials List (per group of 3–4 students):**  
  - **Fact cards:** 21 cards (initially), plus 3 gold cards (added later). Each card states a fact in plain language.  
  - **Gold cards:** 3 cards (conjunctive, negative, totality facts).  
  - **BRUTE tokens:** 4 tokens (e.g., wooden cubes, marked stones).  
  - **String/yarn:** For drawing arrows (representing "obtains in virtue of").  
  - **Scoring sheet:** Pre-printed with scoring rules (no real money).  
  - **Table space:** For arranging cards and strings.  
  - **Miscellaneous:** Pens, paper for notes, timer.  

  **Complete Rules & Payoff Scheme**  
  **Goal:** Build a directed graph where facts depend on others via arrows ("obtains in virtue of"). Maximize points by grounding all facts while minimizing BRUTE token use.  
  - **Setup:**  
    - Each group receives 21 fact cards (no gold cards yet) and 4 BRUTE tokens.  
    - Lay cards on the table. BRUTE tokens mark facts with no incoming arrows (fundamental).  
  - **Arrow Rules:**  
    - Draw arrows from ground(s) to dependent fact (e.g., "The glass is made of silica" → "The glass is fragile").  
    - Cycles (e.g., A → B → A) are illegal and must be cut if found.  
  - **Gold Cards (added later):** Must be integrated like other facts.  
  - **Audit Round:** Groups challenge one arrow in another group’s structure using a "near miss" (a fact that would be the ground if the target fact were slightly different).  
  - **Scoring (points):**  
    - +1 per fact connected to a BRUTE token via a path of arrows.  
    - +5 per unused BRUTE token (parsimony bonus).  
    - -10 per fact not connected to a BRUTE token ("dangling").  
    - -20 per cycle (if found during final check).  
    - Cycle penalty during play: -10 per cycle cut (group must publicly cut one arrow and explain why).  
  - **Winning:** Highest score after audit and final scoring.  

  **Minute-by-Minute Timeline (80 min total)**  
  - **0–5 min: Introduction (Facilitator Script)**  
    > "Today, we’re playing a game about how facts relate to each other. Each group has a deck of fact cards. Your task is to connect these cards with arrows, where an arrow from card A to card B means B ‘obtains in virtue of’ A—think of it as A being the reason B is true. For example, if you think ‘The glass is fragile’ is true because ‘The glass is made of silica,’ draw an arrow from ‘silica’ to ‘fragile.’  
    > You also have four BRUTE tokens. Place one on a card to mark it as having no incoming arrows—a stopping point. You don’t have to use all tokens.  
    > Scoring rewards connecting facts to BRUTE tokens (+1 per connected fact) and saving tokens (+5 per unused token), but penalizes unconnected facts (-10 each) and cycles (-20 each). If you find a cycle, cut an arrow, explain why, and take a -10 penalty.  
    > Later, I’ll add three special gold cards. After building, groups will audit each other’s arrows. We’ll score at the end. Any questions? Start building now."  

  - **5–35 min: Building Phase (30 min)**  
    - Groups build initial graphs with 21 fact cards and BRUTE tokens.  
    - Facilitator circulates: Answer questions but avoid theory; e.g., "How would you defend that arrow in an audit?"  

  - **35–40 min: Gold Card Integration (5 min)**  
    - Distribute 3 gold cards per group. Groups integrate them into their graphs.  
    > "Add these three new facts to your structure. They must follow the same rules."  

  - **40–55 min: Audit Round (15 min)**  
    - Groups pair up (Group A → B, B → C, C → D, D → A).  
    - **Per pair (3 min each):**  
      1. Challenger picks an arrow in the defender’s graph and presents a "near miss" (e.g., for "The ball is red" → "The ball is round," a near miss is "The ball is square" to question why "round" depends on "red").  
      2. Defender has 1 min to explain why their ground is right and the near miss is wrong.  
      3. Facilitator rules: If explanation fails, arrow is voided.  
    - **After all audits (55 min):** Groups have 2 min to fix graphs (e.g., add new arrows or move BRUTE tokens to cover voided arrows).  

  - **55–60 min: Final Scoring (5 min)**  
    - Groups calculate scores using the payoff scheme. Facilitator verifies:  
      - Checks for cycles/dangling facts (penalties applied).  
      - Awards points.  

  - **60–80 min: Debrief (20 min)**  
    - **Facilitator-led discussion:** Reveal terms and map game moments to concepts (see Debrief section below).  

  ---

  ### Example Fact Cards (per group)  
  **Intrinsic (Material Objects):**  
  1. The ball is red.  
  2. The table is square.  
  3. The water in the glass is hot.  
  4. The stone is heavy.  
  5. The wire is copper.  

  **Dispositional/Modal:**  
  6. The glass is fragile.  
  7. The sugar cube is soluble.  
  8. If the match were struck, it would light.  
  9. The vase would break if dropped.  
  10. The car can go 200 km/h.  

  **Existence (Composites/Abstract):**  
  11. There is a chair made of wood and metal.  
  12. The number 2 exists.  
  13. There is a statue made of clay.  
  14. The empty set exists.  
  15. The university has a student council.  

  **Normative:**  
  16. Lying is wrong.  
  17. This painting is beautiful.  
  18. Helping others is good.  
  19. Stealing is wrong.  
  20. That act was courageous.  

  **Gold Cards (added later):**  
  21. (Conjunctive) The ball is red and the table is square.  
  22. (Negative) The ball is not blue.  
  23. (Totality) The cards on the table are all the facts there are.  

  ---

  ### Debrief: Mapping Game Moments to Metaphysical Ideas  
  **Facilitator Script:**  
  > "Today’s game simulated metaphysical reasoning. Let’s connect your experiences to key ideas—without jargon first, then we’ll name things.  
  >   
  > 1. **Audit Round:** When you challenged arrows with ‘near misses,’ you saw that almost any fact *can* depend on another (e.g., ‘The ball is round’ could depend on ‘The ball is red’—but is that the *right* dependence?). This shows dependence is ‘cheap,’ but the real question is which dependencies are **constitutive** (explaining why a fact *must* hold). The near miss exposed when a ground fails to make a difference.  
  >   
  > 2. **Cycle Cutting:** When you cut a cycle (e.g., A → B → A), you enforced **asymmetry** (if A grounds B, B can’t ground A) and **well-foundedness** (no loops). This reflects metaphysics’ assumption that dependence must have a direction and a foundation.  
  >   
  > 3. **Dispositional vs. Intrinsic Arguments:** If you debated grounding ‘The glass is fragile’ in ‘The glass is made of silica,’ you encountered the gap between **constitutive dependence** (what makes it fragile) vs. **causal/nomic dependence** (how it breaks). The game forced constitutive choices.  
  >   
  > 4. **Gold Cards:**  
  >    - The conjunctive card (‘The ball is red and the table is square’) might have been grounded in its parts—or vice versa, creating cycles.  
  >    - The negative card (‘The ball is not blue’) may have felt arbitrary—why ground it in ‘The ball is red’? What if it were green? This shows **limits of completeness**: negative facts are hard to ground without circularity or regress.  
  >    - The totality card (‘All facts are here’) often caused chaos. If you grounded it in all other facts, that’s circular. If you made it brute, it became an **uninformative ground**—it ‘explains’ everything specifically.  
  >   
  > 5. **Using the Last BRUTE Token:** When you placed your fourth token, you faced a squeeze: if you saved tokens, you risked ungrounded facts; if you used them all, fundamentals felt **arbitrary** (why these four?). This mirrors metaphysics’ tension: completeness (ground everything) + parsimony (minimal fundamentals) forces a choice between an **unexplained remainder**, a **regress**, or an **arbitrary set**.  
  >   
  > **Now, the technical terms:** The arrow represents **grounding**. BRUTE tokens mark the **fundamental** facts. The three uncomfortable outcomes are classic problems for theories demanding complete grounding.  
  >   
  > **Lastly, fundamentality ≠ ‘smallest’ or ‘earliest’:** Did you ground normative facts (e.g., ‘Lying is wrong’) in physical facts? Or dispositions in microscopic facts? This shows fundamentality isn’t about size, time, or causation—it’s about what *constitutively explains* what."  

  ---

  ### Predictable Problems & Solutions  
  1. **Group declares everything brute and banks parsimony bonus.**  
     - *Problem:* They place BRUTE tokens on 4 random facts, leave others ungrounded, and take -10/dangling fact but +5/unused token.  
     - *Solution:* Scoring penalizes heavily (-10 per dangling fact). A group with 20 facts and 4 tokens earns: 4 (brute facts) + 0 (grounded facts) - 200 (20 × -10) + 0 (no unused tokens) = -196. They’ll avoid this. If they try, ask: "Can you defend all BRUTE choices in an audit?"  

  2. **Group builds long chains of redescriptions.**  
     - *Problem:* They create trivial chains (e.g., "The ball is red" → "Redness exists" → "Color exists").  
     - *Solution:* Audit round exposes this. A near miss (e.g., "The ball is blue" for "Redness exists") forces them to justify why the ground is constitutive, not just a redescription.  

  3. **Group grounds everything in "initial universe" or "God".**  
     - *Problem:* They use one BRUTE token for a cosmic fact, grounding all else in it.  
     - *Solution:* Audit with normative/dispositional facts (e.g., "If the universe began differently, would lying still be wrong?"). They struggle to explain, revealing the ground as uninformative.  

  4. **Group finishes in 5 minutes while others argue.**  
     - *Problem:* Superficial graph.  
     - *Solution:* Facilitator probes: "Why that arrow? What near miss would challenge it?" or "Can you use fewer tokens for more points?"  

  5. **Student calls scoring arbitrary.**  
     - *Response:* "Agreed—it’s a model. The weights simulate real trade-offs: completeness (avoid -10 penalties) vs. parsimony (+5 bonuses). Metaphysics seeks balance without ‘points.’ Let’s discuss post-game how this felt in practice."  

  ---

  ### What the Game Cannot Reproduce  
  **Limitation 1: The gap between "accounting practice" and "reality."**  
  - The game treats grounding as a bookkeeping exercise, but metaphysics posits a *mind-independent structure*.  
  - **Facilitator fix in debrief:**  
    > "In the game, you constructed a dependence graph. But in metaphysics, grounding isn’t just how we organize facts—it’s how reality is structured. The discomfort you felt (e.g., ‘Why *this* fundamental set?’) points to a deeper question: does our best accounting practice reflect reality’s structure?"  

  **Limitation 2: Ungrounded ≠ fundamental.**  
  - The game conflates two types of ungrounded facts:  
    - **Fundamental facts:** Eligible for grounding relations but brute (e.g., "The universe began").  
    - **Non-eligible facts:** Cannot enter grounding relations (e.g., some philosophers argue "negative facts" like "There are no unicorns" aren’t apt for grounding).  
  - **Facilitator fix in debrief:**  
    > "The game assumes all facts are either grounded or brute. But some facts might be ungrounded because they’re *ineligible* for dependence—like rules of logic. This distinction isn’t captured here. For example, was your negative gold card brute because fundamental, or because negatives don’t ‘fit’ in grounding?"  

  **Run Notes:**  
  - **First-time hiccups:** Groups may fixate on winning vs. exploration. Emphasize: "The goal is insight, not points. We’ll debrief how the scoring pressures mirror real dilemmas."  
  - **Time management:** If building phase lags, warn at 25 min: "5 minutes left—focus on avoiding dangling/cycles."  
  - **Ethos:** Stay neutral during gameplay. In debrief, validate all outcomes ("Group X’s regress, Group Y’s brute set—both reflect real metaphysical tensions").  

  This design balances structure with discovery, ensuring students "run into" target concepts intuitively. The debrief bridges gameplay to theory, preparing them for technical readings.
