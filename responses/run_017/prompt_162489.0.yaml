prompt: |-
  hey — hoping you can help with something that's gotten abruptly practical for me.

  Our city council voted last month to pilot a permanent citizens' assembly on the housing plan, and I somehow ended up on the volunteer design committee. 90 people, drawn by lot, eight weekends, then recommendations to council. So the design questions are now mine and not somebody's seminar paper.

  The consultant we hired leans on one analogy constantly: an assembly is to the electorate as a random sample is to a census. You don't need to ask everybody; a properly drawn few hundred tells you what the whole population thinks, and it tells you that cheaply and with a knowable error margin. He uses it for three moves: (1) 90-ish is plenty, and growing the chamber or putting the question to a referendum buys nothing worth the money, since a referendum is just asking everyone to fill in the census form badly; (2) whatever the assembly lands on is, in the relevant sense, what the city would have decided, so council can defer without giving anything up; and (3) because you can stratify a sample, we should deliberately oversample renters (roughly 2:1, since they're the group most affected and least heard), the way you'd oversample a small subgroup in a survey to get a usable estimate for it.

  Move (3) is the one that's been nagging at me. A survey sample is supposed to sit still — it measures opinions it doesn't change — while the entire point of eight weekends is that people arrive with one view and leave with another. If the picture is wrong there, I suspect it's wrong for the other two moves as well, but I can't tell which of them it was actually carrying.

  You're a political theorist who works on democratic innovation and you know the sortition literature inside out. Think it through properly: lay out the correspondences first — what plays the role of the sampling frame, the estimator, the margin of error, non-response, the population itself — and only then say where the mapping breaks and whether each break matters for the use he's making of it. Then give me your verdict on the three moves separately, and if the census picture is the wrong one, tell me what a better analogy would be (jury? focus group? standing panel?) and what it would let us conclude that this one can't.

  One page, 600 words max, a correspondence table is fine and I'd actually prefer one. No bibliography or citations — I'll chase those up myself.
reasoning: |-
  Okay, the user is on a volunteer design committee for a citizens' assembly in their city, focused on the housing plan. They're working with a consultant who uses a sampling analogy to justify three key points: that 90 participants are sufficient, that the assembly's decision represents the city's will, and that oversampling renters is valid. The user is skeptical, especially about move (3), because deliberation changes opinions, unlike a static survey. They want a political theorist to dissect the analogy and evaluate each move.

  First, I need to unpack the sampling analogy. The consultant compares the citizens' assembly to a random sample, where the electorate is the population. The sampling frame would be the voter roll or census data. Participants are like the sample, chosen via sortition. The estimator is the assembly's final decision, analogous to a survey result. Margin of error relates to sample size and confidence intervals. Non-response would be people declining to participate. The population parameter is the hypothetical informed public opinion after deliberation.

  But where does this break? The core issue is that deliberation transforms opinions, while surveys measure static views. In a survey, the sample is passive; in an assembly, they're actively learning and discussing. So for move (3), oversampling renters makes sense for diversity but not for statistical representativeness post-deliberation. Their views will evolve, so oversampling doesn't guarantee the same precision as in a survey.

  For move (1), 90 people might be enough for diversity but not for statistical confidence in mirroring the whole population. The margin of error can't be calculated like a survey because the outcome isn't a fixed opinion. The assembly's value is in the quality of deliberation, not numerical representativeness.

  Move (2) is problematic because the assembly's decision is shaped by the process itself—information provided, facilitation, group dynamics. It's not a pure measure of pre-existing opinions but a co-created outcome. So it shouldn't be seen as what the city "would have decided" but as a legitimate decision from a representative microcosm.

  The user needs a better analogy than a survey. A jury is closer: both involve random selection, deliberation, and a mandate to decide. A focus group is about exploring views but not decision-making. A standing panel could work for ongoing input. The jury analogy emphasizes the transformative process and legitimacy through fair representation and reasoned debate.

  For the verdict: move (1) is partially valid for diversity but not for statistical reasons. Move (2) is incorrect as presented; legitimacy comes from the process, not statistical mimicry. Move (3) is valid for inclusion but not for precision estimates. The user needs to shift focus from statistical representation to the deliberative quality and diversity of perspectives.

  Underlying needs: The user seeks legitimacy for the assembly's outcomes to ensure council deference. They might be concerned about political challenges or public buy-in. By emphasizing the jury analogy, they can justify decisions based on a fair and thorough process, not just numbers. Highlighting the importance of inclusion and deliberation addresses equity concerns, especially for underrepresented groups like renters.
answer: |-
  ### Citizens' Assembly as Random Sample: Correspondence & Critique  

  | **Survey Sampling Concept** | **Citizens' Assembly Analogy**                 | **Breakage & Implications**                                                                 |
  |-----------------------------|-----------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Population**              | Entire city electorate                        | **BREAKS:** Deliberation *changes* participants' views; population’s "informed opinion" doesn’t exist pre-deliberation. |
  | **Sampling Frame**          | Voter roll/census data                        | **MINOR BREAK:** Non-participation (non-response) may skew representativeness; solutions exist (e.g., alternates). |
  | **Sample**                  | 90 randomly selected participants             | **BREAKS:** Sample isn’t passive; it actively constructs decisions through dialogue.                                  |
  | **Estimator**               | Assembly’s final recommendation(s)            | **BREAKS:** Outcome isn’t an "estimate" of a fixed population parameter; it’s a co-created judgment.              |
  | **Margin of Error**         | Statistical confidence interval (e.g., ±5%)   | **BREAKS:** No calculable MoE—deliberation’s outcome is path-dependent, not probabilistic.                  |
  | **Stratification/Oversampling** | Oversampling renters (2:1)              | **BREAKS:** Valid for inclusion, but post-deliberation views ≠ extrapolatable subgroup "estimates."         |

  ---

  ### Verdict on Consultant’s Moves  
  1. **"90 is plenty; no need for referendum/larger group"**:  
     **Partially valid, but misapplied.** 90 can ensure *diversity* of perspectives (critical for deliberation), not statistical precision. Larger groups add marginal diversity gains; referendums measure *raw* opinion, not *informed* judgment. **Support 90 on deliberative grounds, not sampling theory.**  

  2. **"Assembly’s decision = what city would decide"**:  
     **Incorrect.** The assembly produces a *legitimate* decision via fair process, not a statistical proxy for aggregate opinion. Deliberation transforms preferences (e.g., via learning, empathy). **Council defers due to the process’s integrity, not statistical mimicry.**  

  3. **"Oversample renters (as a subgroup)"**:  
     **Valid intent, flawed justification.** Oversampling ensures renters’ voices shape deliberation (correcting historical exclusion). *But* their post-deliberation views can’t be extrapolated to "all renters" with quantifiable precision. **Do it for equity/inclusion, not subgroup representativeness.**  

  ---

  ### Better Analogies & What They Offer  
  1. **Jury**:  
     - Random selection, impartiality, deliberation toward a verdict.  
     - **Conclusion:** The assembly’s output is a *legitimate verdict* (not a "statistic") binding due to process fairness, not representational accuracy. Justifies council deference.  

  2. **Standing Panel**:  
     - Recurring citizen body advising on policy.  
     - **Conclusion:** Legitimacy stems from *ongoing* engagement/learning (e.g., for housing’s complexity). Better for iterative policy than one-off votes.  

  3. **Focus Group (upgraded)**:  
     - Explores nuanced views but lacks decision power.  
     - **Conclusion:** Reject this—assemblies *decide*, not just advise.  

  **Use the jury analogy:** It accepts deliberation’s transformative role, prioritizes procedural fairness over statistical mirroring, and defends outcomes as authoritative *because* of the conditions (inclusion, evidence, time). This preserves the consultant’s practical goals (e.g., defending 90 participants, oversampling renters) while grounding them in deliberative theory.  

  **Final Word:** The sampling analogy risks reducing deliberation to opinion measurement. Emphasize the assembly as a *microcosm* that *constructs* public judgment—not a camera, but a workshop.
