prompt: |-
  I'm a PhD student in political theory working on the state's interest in which children come to exist, and I keep tripping over a cluster of institutional arrangements whose implicit moral theory I cannot reconstruct cleanly. Let me give you a stylized composite of things I have seen in several public health systems, since that is the object I want diagnosed. A publicly funded fertility service offers IVF together with preimplantation genetic testing, but funds testing and selective transfer only for conditions that clear a severity threshold expressed in expected-QALY-lost terms; it declines to fund polygenic scoring. For any child actually born with one of the funded-screened conditions, the same system guarantees a lifetime support entitlement, and the size of that entitlement is indexed to how severe the condition was rated to be on the very scale that justified funding the screening. Meanwhile the clinics involved will report polygenic risk scores to parents for common diseases but not for educational attainment or height, and regulation caps the number of embryos created in a cycle at a fairly modest number. So, in shorthand: the state pays to prevent the birth of children with certain conditions, pays again to support the ones who are born anyway, indexes the second payment to the rating that justified the first, refuses to pay for selection within the ordinary range, and refuses to let anyone create enough embryos to make even the permitted selection precise.

  What I want is the implicit theory, stated as sharply as you can manage, with three things kept apart: what the package strictly presupposes, what it merely sits well with, and what it is actually inconsistent with. I think the hard part is the metaphysics of benefit: since the child who results from a given transfer is not the child who would otherwise have resulted, it is unclear in what sense selecting one embryo rather than another is good for anyone, and I would like you to say which principle about selecting among possible people the practice has to be committed to, and whether that principle is the same one the rest of the health system uses when it weighs QALYs. Four tensions I suspect but cannot place: first, a health economist in my department argued that a fully compensating entitlement removes the welfare difference that was supposed to justify screening, so the two halves of the scheme defeat each other — I cannot tell whether that is a genuine reductio or a stable design feature, and I would like you to tell me which. Second, the severity rating looks like a cardinal claim about a life going less well, yet self-reported well-being among people with several of these conditions is often close to population averages, so I suspect the rating is secretly a resources or opportunity metric wearing welfare vocabulary. Third, the disease-versus-traits disclosure asymmetry seems to presuppose a line between a child's absolute prospects and competitive or positional advantage, which a straightforward maximizing principle of the kind that goes under the name procreative beneficence cannot obviously draw. Fourth, the embryo cap restricts the option set in a direction that same maximizing principle would want loosened.

  Tell me which of those four are real and which are my confusions, and where the practice is simply underdetermined — several theories would license it — rather than inventing a tidier theory than the practice deserves. Then say concretely what would have to be added, dropped, or rewritten if the operative view were replaced by, in turn, a maximizing procreative beneficence view, a sufficiency view on which parents owe the child an adequate life but not the best available one, and a permissive view on which there is no duty to select at all. Finally, be explicit about the epistemic status of your reconstruction: mark the step in it you are least confident in, distinguish the places where you are reporting what the practice entails from places where you are defending a view of your own, and say what argument or empirical finding would make you withdraw the central claim of your answer.
reasoning: |-
  Hmm, this is a deep and complex query from a political theory PhD student. They're grappling with the moral logic behind a set of public fertility policies that seem contradictory on the surface: screening embryos for severe conditions while providing lifetime support for those born with such conditions, refusing polygenic scoring for traits, and limiting embryo creation.

  The user identifies four key tensions in the system:
  1) How compensating support undermines the welfare rationale for screening
  2) Whether severity ratings reflect actual wellbeing or just resource needs
  3) The disease/trait distinction implying a non-competitive welfare concept
  4) Embryo caps conflicting with selection optimization

  I need to reconstruct the implicit moral theory as sharply as possible, separating presuppositions, compatibilities, and inconsistencies. The metaphysics of benefit is crucial here since selected embryos aren't the same as non-selected ones - so whose benefit are we talking about?

  The core principle seems to be a person-affecting view of harm prevention rather than impersonal optimization. The system treats severe conditions as harms to be prevented when possible, but as disadvantages to be compensated when prevention fails. The severity scale serves dual purposes: gatekeeping prevention efforts and calibrating compensation.

  About the four tensions:
  1) The compensation paradox isn't fatal - it's a stable feature reflecting different moral modes (prevention vs remedy)
  2) Severity ratings likely measure functional limitation more than subjective wellbeing
  3) The disease/trait distinction assumes welfare is non-comparative
  4) Embryo caps reveal a commitment to "good enough" selection

  For alternative frameworks:
  - Maximizing views would demand polygenic scoring and more embryos
  - Sufficiency views might relax some restrictions
  - Permissive views would dismantle screening entirely

  I should be clear about where the practice underdetermines theory - several principles could justify parts of it. And I'll flag my least confident step: interpreting the severity metric as primarily functional rather than experiential.
answer: |-
  Here is a reconstructed implicit moral theory of the described institutional package, structured to address your concerns about presuppositions, compatibilities, inconsistencies, and tensions. I’ll then evaluate your four tensions, analyze alternative frameworks, and clarify epistemic status.

  ---

  ### **Reconstructed Implicit Moral Theory**
  **Core Principle:** *Preventing Severe Harm to Future Persons and Society.*  
  The state intervenes to prevent the existence of children who would face **severe, non-compensable deficits in basic functioning** (threatening a minimally decent life), while guaranteeing **full societal solidarity** for those born with such conditions. Selection is permitted only to avoid severe harms—not to optimize welfare—and is constrained by anti-perfectionism and resource limits.

  #### Key Components:
  1. **Harm-Based Person-Affecting View**:  
     - **Presupposes**: Bringing a child into existence with a severe condition constitutes a *preventable harm* to that child (if the condition causes significant suffering/incapacity), even if no alternative child exists.  
     - **Commits to**: A threshold-based definition of harm where only conditions below a QALY-loss minimum justify intervention. This treats QALY as a proxy for *functional capacity* (not subjective well-being), avoiding the non-identity problem by framing harm as "a life with severe avoidable deficits" rather than "worse than a possible alternative."  
     - **Contrast with impersonal maximizing**: Rejects creating the "best possible" child; focuses on preventing intolerable harms.

  2. **Solidarity-Compensation Principle**:  
     - **Presupposes**: Society owes robust support to those born with disabilities as a matter of justice. Compensation is calibrated to severity because the *cost of achieving a minimally decent life* scales with functional impairment.  
     - **Compatible with**: Severity ratings reflecting resource needs (e.g., medical care, assistive tech) rather than subjective well-being.  

  3. **Anti-Perfectionism & Anti-Commodification**:  
     - **Presupposes**: Traits within the normal range (e.g., height, intelligence) are not harms but variations. Selecting for them would:  
       (a) Treat children as projects for parental/social advantage (violating equality),  
       (b) Exacerbate positional competition (e.g., educational attainment).  
     - **Embryo cap**: Reflects a "good enough" pragmatism—preventing hyper-optimization and respecting embryos as potential persons (not raw material).  

  4. **Systemic Consistency**:  
     - **Severity rating duality**: The same scale gates prevention *and* sets compensation because it measures the **objective burden of the condition** (to the individual/society), not welfare loss. Screening is cost-effective prevention; compensation is redress for unavoidable disadvantage.  
     - **Inconsistency avoided**: Compensation doesn’t negate the harm-prevention rationale because:  
       - Prevention spares the child suffering (if applicable) and reduces societal costs.  
       - Compensation addresses residual disadvantage post-birth.  

  ---

  ### **Evaluation of Your Four Tensions**
  1. **Compensation vs. Screening Welfare Difference**:  
     - **Your colleague’s critique**: Mistakenly assumes welfare is reducible to resources. The system separates:  
       - *Ex-ante prevention*: Avoiding severe functional impairment (a harm in itself).  
       - *Ex-post redress*: Guaranteeing dignity/opportunity despite impairment.  
     - **Verdict**: Stable design feature. Prevention reduces suffering/costs; compensation ensures justice. No reductio.  

  2. **Severity Rating vs. Self-Reported Well-Being**:  
     - **Tension is real**: The rating likely measures **functional capacity/resources needed**, not subjective welfare (e.g., a spinal injury may require costly adaptations despite high life satisfaction). Public health systems often conflate "severity" with resource burden.  
     - **Verdict**: Your suspicion is correct—it’s a resource/opportunity metric in welfare clothing.  

  3. **Disease vs. Trait Disclosure Asymmetry**:  
     - **Tension is real**: Assumes a non-positional, absolute threshold for harm. "Procreative beneficence" (maximizing welfare) cannot distinguish disease/height if both affect well-being. The system draws a line at **basic functioning** (diseases impair it; height/education are positional).  
     - **Verdict**: Consistent with the implicit theory but inconsistent with strict maximizing.  

  4. **Embryo Cap vs. Maximizing Selection**:  
     - **Tension is real**: Caps explicitly reject precision-maximization, prioritizing pragmatic limits (cost, embryo "respect") over optimal outcomes. A maximizing view would demand more embryos/polygenic scoring.  
     - **Verdict**: Inconsistency with maximizing is intentional.  

  ---

  ### **Underdetermination and Alternative Frameworks**  
  The practice is **underdetermined** in:  
  - Why QALY-loss is the threshold metric (vs. capabilities or other frameworks).  
  - Whether "severe harm" includes suffering, functional loss, or both.  
  - The moral weight of embryo status (symbolic respect vs. personhood).  

  **Changes Under Alternative Views**:  
  |                          | Maximizing Procreative Beneficence (Savulescu) | Sufficiency (e.g., Benatar) | Permissive (No Duty to Select) |  
  |--------------------------|-----------------------------------------------|----------------------------|--------------------------------|  
  | **PGT Funding**          | Fund polygenic scoring for all traits          | Only for sub-threshold conditions | None                           |  
  | **Embryo Cap**           | Abolish (allow max. embryos for precision)     | Keep (no need for optimization) | Keep                           |  
  | **Support Entitlement**  | Reduce (if harm is avoidable)                  | Keep (fulfills sufficiency) | Keep                           |  
  | **Disease/Trait Asymmetry** | Drop (select for all advantage)              | Keep (only prevent severe harm) | Keep (no selection pressure)   |  

  ---

  ### **Epistemic Status**  
  - **Least Confident Step**: Interpreting the severity rating as a *functional/resource metric* rather than a welfare claim. While supported by the compensation structure, it’s possible policymakers conflate welfare and function. An empirical study of how ratings are set (e.g., if they incorporate subjective well-being data) would clarify this.  
  - **Reporting vs. Defending**:  
    - Reporting: The harm-prevention rationale, solidarity principle, and anti-perfectionism are *entailed* by the practice.  
    - Defending: My claim that "harm" is defined by functional capacity (not welfare) is interpretive—though it resolves tensions better than alternatives.  
  - **Falsification Condition**: If policymakers explicitly stated that compensation *negates* the harm of existence (e.g., "a supported Down syndrome life is equally good as non-existence"), the core harm-prevention rationale collapses. Empirical evidence of such statements would force revision.  

  **Central Claim**: The system is coherent if its severity metric measures *the cost of achieving basic functioning*, not welfare. If proven that the metric is purely experiential (e.g., QALY based solely on subjective surveys), the tension with reported well-being becomes fatal, and my reconstruction fails.  

  This package reflects a **moderate prioritarianism**: prevent terrible fates, support those who face them, and avoid eugenic optimization. It sits between impersonal maximizing and unconditional permission—a pragmatic, ethically pluralistic compromise.
