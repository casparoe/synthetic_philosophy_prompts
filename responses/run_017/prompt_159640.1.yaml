  - Trade 3 (t1): 
     - "I offer to exchange your concert ticket for an identical ticket (same seat, same concert) for free. If you exchange, you will have a new ticket instead of the old one."
     - (This trade has no effect, but it's to have three trades.)

   After Round 1, participants calculate their final points and assets.

   Then we do Round 2, but we give advance knowledge.

  - 15-20 min: Round 2 instructions: "Now, we will do the same sequence of trades again, but this time you know the entire schedule in advance. You start again with 100 points and a concert ticket (6 months away). The trades will be:"
     - Trade 1: At 6 months before, offer to buy the ticket for 10 points.
     - Then time jumps to 1 week before.
     - Trade 2: Offer to sell a ticket for 50 points.
     - Trade 3: Free exchange of tickets.
     - "You may plan ahead. Record your decisions for each trade now, in advance, or you may wait until each trade is called, but remember you know what's coming."
  - 20-25 min: Conduct Round 2 trades in sequence as in Round 1.

  - 25-30 min: Round 3 instructions: "Same as Round 2, you know the schedule. But before the first trade, you may make one binding declaration. For example, you may declare: 'I will not Trade in Trade 1.' or 'I will definitely do Trade 2.' and then you must stick to that. You may also choose not to bind yourself."
     - Give them time to make a binding declaration (write it down and hand it to you in an envelope).
  - 30-35 min: Conduct Round 3.

  - 35-50 min: Have participants calculate their total points for each round and for the initial state (100 points + ticket).
