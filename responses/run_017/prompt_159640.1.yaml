  - 5-10 min: Explanation of the real stake. "At the end, we will convert your points into a share of this bag of coffee. The more points, the more coffee you get."
  - 10-15 min: Round 1 instructions: "We will have three trades. I will describe each trade in sequence. For each, you may choose to trade or not. Write your decision privately on your record sheet, then we will announce what happened."

  **Round 1 (no advance knowledge):**
  - Trade 1 (t0): 
     - "It is now 6 months before the concert. I offer to buy your concert ticket for 10 points. If you sell, you will lose the ticket and gain 10 points."
