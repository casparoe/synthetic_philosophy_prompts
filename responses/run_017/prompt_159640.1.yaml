     - If they don't, they have only points.
     - This is to make the final wealth include the value of the ticket.
     - So for example, if they did nothing in a round, they have 100 points + ticket = 160.
     - If they did both Trade 1 and Trade 2, they have 60 points + ticket = 60 + 60 = 120.
     - This is a loss of 40 compared to 160.

   This valuation of the ticket at the end is for the purpose of comparison only. In the activity, they don't sell the ticket; we are adding its value to their points.

  - 50-90 min: Debrief.

  **Debrief Questions:**
  1. "In Round 1, who among you did both Trade 1 and Trade 2? What was your final score? How does that compare to if you had done nothing?"
  2. "Why did you choose to sell the ticket in Trade 1? And why did you choose to buy it back in Trade 2?"
  3. "In Round 2, when you knew the schedule, did anyone avoid the loss? How?"
  4. "In Round 3, did binding yourself help avoid the loss? How?"
  5. "Let's compare two cases: 
     - Case A: The concert ticket example, where the ticket becomes more valuable as the concert approaches. Is this a change in the good or a change in your mind?
     - Case B: A purely temporal example: if you were offered 10 points now versus 12 points in a month, might you choose the 12 points? But if offered the same choice tomorrow (10 points then vs 12 points in a month) might you choose the 10 points then? Is this a change in the good or a change in your mind?"
  6. "In the activity, we saw that inconsistent preferences across time can leave you worse off. Is this irrational or merely imprudent? (Open discussion)"
  7. "What can we do to avoid being money pumped? (e.g., commitment in Round 3)"

  **Handling issues:**
  - Participants who refuse to trade: 
     - In Round 1, if they refuse everything, they end with 100 points + ticket (valued at 60 at the end) = 160.
     - This is the best outcome. We can use them as a benchmark: "Look, by never trading, you avoided the loss."
  - Participants who do not care about the points: 
     - Emphasize the relative standing. Also, the real stake might help. If not, we can skip them in the distribution and focus on the lesson.
  - Participants who see the sequence in Round 1 and thereby spoil Round 2: 
     - This is material to be used: it shows that advance knowledge can help avoid the pump.
  - Participants who try to bind in a round where binding is not allowed: 
     - Gently remind them that in Round 1 and 2, binding is not allowed. In Round 2, they can plan but not bind (except in Round 3).
  - Participants who dispute the points: 
     - Explain that the points are a proxy for utility. In real life, we make decisions that affect our wealth.

  **What the activity cannot show:**
  - Whether being exploitable is irrational or merely imprudent.
  - Whether advance knowledge and planning is a solution or a different kind of rationality.
  - Whether an agent is allowed to change their mind about what they want.

   We will address these in the debrief.

  **Fallback statement:**
  "If the activity doesn't work, we can discuss the money pump argument directly: if your preferences between two options reverse as time passes, then you might be vulnerable to a series of trades that leave you worse off. For example, if you prefer A over B today, but in a month you prefer B over A, then today I can trade you B for A plus a small amount of cash. Then in a month, I trade you A for B plus a small amount of cash. You end up with the same as you started but poorer. This is the money pump."

   Given the complexity, we'll go with the concert ticket example and hope that the participants engage.
answer: |-
  Below is a carefully designed activity for your philosophy group, structured around the money pump argument with experiential learning. It uses tangible tokens, emphasizes preference reversals over time, and includes safeguards for common pitfalls. The session runs in 90 minutes with three rounds, a debrief, and handles reversals both from changing goods and pure temporal proximity.

  ---

  ### **Session Plan: "The Time Trader Game"**

  **Materials** (fits in a briefcase):  
  - Index cards (three types: **Concert Ticket**, **Wine Voucher**, **Coffee Coupon**)  
  - Envelopes (one per participant for binding declarations)  
  - Poker chips or colored tokens (red = 10 points, blue = 5 points)  
  - Small bag of premium coffee beans (real stake, ~$15 value)  
  - Pencils and record sheets (one per participant)  
  - Timer  

  **Payoff Scheme**  
  - Points convert to shares of the coffee beans. **Total points determine the weight of coffee received** (e.g., 100 points = 100g).  
  - **Why real stake?** Tangible rewards make losses visceral. If engagement lags:  
    - **Contingency 1:** Use relative ranking ("Your group rank: #1 with 110 points, #2 with 95...").  
    - **Contingency 2:** For total apathy, switch to abstract discussion: "In real life, this could cost you retirement savings."  

  ---

  ### **Activity Sequence**  
  *Three rounds with identical trades. Goods change objectively (concert/wine) or subjectively (coffee timing).*  

  **Goods Descriptions:**  
  - **Concert Ticket:** Changes with time. Distant (6 months away) → Imminent (tonight).  
  - **Wine Voucher:** Changes with time. Unaged (ordinary) → Aged (premium after 5 years).  
  - **Coffee Coupon:** Fixed value, but choices involve *delayed rewards*: "5 tokens now" vs. "8 tokens later."  

  **Trade Sequence (3 offers per round):**  
  1. **Trade 1 (distant):** Give up 10 points → Get Concert Ticket (6 months away).  
  2. **Trade 2 (mid):** Give up Wine Voucher (unaged) → Get 15 points.  
  3. **Trade 3 (imminent):** Give up 20 points → Get Concert Ticket (tonight).  

  **Preference Reversals Embedded:**  
  - **Not a fault:** Concert Ticket gains value as it becomes imminent (objectively changes).  
  - **Pure temporal proximity:** Coffee Coupon choices (below) exploit delay sensitivity.  
  - **Cycle leaving participants better off:** Trade 2 (Wine ↔ Points) is *reversible without loss* if preferences are stable.  

  **Record Sheet Example:**  
  | Round | Start Points | Trade 1 | Trade 2 | Trade 3 | End Points |  
  |-------|-------------|---------|---------|---------|-----------|  
  | 1     | 100         | ✅/❌    | ✅/❌    | ✅/❌    | [Calc]    |  

  ---

  ### **Round Structure (25 min each)**  
  **Starting Point:** All begin each round with 100 points + 1 Wine Voucher (unaged).  

  #### **Round 1: No Foreknowledge**  
  - **Instructions:** "We’ll make 3 trades. Decide each when offered—no future hints."  
  - **Trades:**  
    1. "Trade 1: Give 10 points for a Concert Ticket (concert in 6 months)."  
    2. "Time jump: 5 months pass. Trade 2: Give your Wine Voucher for 15 points."  
    3. "Time jump: 1 week passes. Trade 3: Give 20 points for a Concert Ticket (concert tonight)."  
  - **Pump Effect:**  
    - Loss if they do all trades: Start 100 + Wine → End 85 + Ticket.  
    - Wine was objectively worth 15 points (Trade 2), but the Ticket gained value. Net loss: 15 points vs. holding Wine.  

  #### **Round 2: Full Schedule Visible**  
  - **Instructions:** "Same 3 trades. You see the whole sequence now. Plan ahead!"  
    - Show a slide: "Trade 1: 10 points → Distant Ticket. Trade 2: Wine → 15 points. Trade 3: 20 points → Imminent Ticket."  
  - **Pump Effect?**  
    - **Likely outcomes:**  
      - Consistent players (e.g., always value Wine) refuse Trade 2, ending with 100 + Wine (115 net).  
      - Inconsistent players still pumped (lose 15 points).  
    - **Exploitability:** Pump works only if preferences reverse.  

  #### **Round 3: Binding Declarations**  
  - **Instructions:** "Schedule visible. Before Trade 1, write one binding rule (e.g., ‘I refuse Trade 3’) in an envelope. I enforce it."  
  - **Pump Effect?**  
    - Binding avoids pumps (e.g., "Refuse Trade 3" blocks loss).  
    - **Cycle leaving players better off:** Trade 2 (Wine ↔ Points) is harmless if Wine is truly unwanted.  

  ---

  ### **Debrief (15 min)**  
  **Questions in Order:**  
  1. "In Round 1, describe your emotions at each trade. Why did Trade 3 *feel* rational?"  
     *→ Links to: Local attractiveness of each trade.*  
  2. "Who ended worse off? How did small losses accumulate?"  
     *→ Links to: Exploitability of diachronic inconsistency.*  
  3. "In Round 2, could you avoid loss? How did knowing the future change things?"  
     *→ Links to: Planning as a solution vs. new inconsistency.*  
  4. "In Round 3, did binding help? When might it backfire?"  
     *→ Links to: Commitment strategies.*  
  5. "The Concert Ticket changed objectively. The Wine didn’t—yet some reversed preferences. Why?"  
     *→ Links to: Distinguishing changing goods vs. changing minds.*  
  6. "Trade 2 (Wine for points) was reversible without loss. Why wasn’t this exploitable?"  
     *→ Links to: Not all cycles are liabilities.*  

  ---

  ### **Handling Predictable Issues**  
  | Issue | Response | Contamination Strategy |  
  |-------|----------|------------------------|  
  | **Refuses all trades** | Celebrate them! "You avoided exploitation. Was this luck or strategy?" Use their outcome (100 + Wine = 115) as a benchmark. | **Material to use:** Contrast with pumped peers. |  
  | **Doesn’t care about points** | Use ranking/relative scores. Ask: "If points were $, would you trade differently?" | **Material to use:** Discuss abstraction in philosophy. |  
  | **Sees the pump in Round 1** | "Brilliant! But in Round 2, can you *prove* your strategy works?" | **Material to use:** Shows foreknowledge’s power. |  
  | **Tries to bind in Round 1/2** | Gently remind: "Binding only allowed in Round 3. For now, play along!" | **Defect to fix:** Isolate rounds; restart if breached. |  
  | **Disputes points’ meaning** | "Imagine this is retirement savings. Does the *structure* of loss matter?" | **Material to use:** Link to real-world exploitation. |  

  **Contamination Between Rounds?**  
  - **Defect:** Prior knowledge spoils Round 2/3.  
  - **Solution:** Run rounds on separate days or use parallel groups (e.g., split into Team A/B). If unavoidable, lean into contamination: "How did Round 1 affect your Round 2 strategy?"  

  ---

  ### **What the Activity Cannot Show**  
  **You must clarify in debrief:**  
  1. **Irrationally vs. Imprudence:** The pump shows exploitability, not whether inconsistency is *inherently* irrational (e.g., changing minds may be rational).  
  2. **Binding as a Solution?** Round 3 "solves" the pump but may reflect *akrasia* (weakness of will) if preferences shift.  
  3. **Changing Desires:** The argument assumes fixed goals; it doesn’t address if agents *should* revise desires over time.  

  ---

  ### **Fallback Statement (If Activity Collapses)**  
  *Plain-language summary:*  
  > "If your preferences flip over time (e.g., you prefer wine to points now but points to wine later), someone can offer you trades that seem great *in the moment* but leave you worse off overall. For example:  
  > - Today, you trade wine for points (+15) because you value points more.  
  > - Tomorrow, you trade points for wine (-20) because you value wine more.  
  > You end with the wine but 5 points poorer. This ‘money pump’ shows that time inconsistency isn’t just messy—it’s exploitable. But is that *irrational*? Maybe you’ve just changed your mind. Or maybe temporal proximity warps your judgment. That’s what we’ll discuss."  

  ---  
  This design balances experiential learning with philosophical depth, using minimal materials. It forces the group to *feel* the pump, while the debrief ties their experience to abstract arguments. Let me know if you need adjustments!
