answer: |-
  ## Report of the Ad Hoc Committee on Referential Defaults  
  Society for the Study of Minds and Machines (SSMM)  
  Approved: October 27, 2023

  **Abstract:** This report formalizes the adoption of 'Person-Shaped-Sentient' (PSS) as the unmarked default referential term within SSMM discourse, replacing 'human'. It details the rationale, provides implementation guidelines, and addresses submitted objections, affirming the Society's commitment to terminological precision and inclusivity reflective of contemporary cognitive science.

  **1. Declaration of Default Term Adoption**
  Pursuant to Resolution 2023-07 passed at the Annual General Meeting, the Society for the Study of Minds and Machines hereby adopts the compound term **Person-Shaped-Sentient (PSS)**, conventionally abbreviated as **PSS**, as the unmarked default referent for agents, patients, and subjects of cognition, agency, and experience within all SSMM publications, communications, and proceedings. The term 'human' is formally retired from this default role. This change takes immediate effect for all new submissions and is strongly encouraged for revisions of works in progress.

  **2. Rationale for the Change**
  The Committee affirms that the term 'human', while historically convenient, encodes a specific biological and morphological category as the implicit standard against which all other cognitive systems are measured and often found wanting or derivative. This encoding carries significant epistemic and practical consequences:

  1.  **Epistemic Bias:** It subtly privileges biological anthropomorphism, potentially obscuring functional equivalencies across substrates (e.g., silicon-based systems, distributed networks) or morphologies (e.g., non-embodied, non-humanoid agents) that satisfy relevant criteria for agency or sentience.
  2.  **Exclusionary Ambiguity:** The generic use of 'human' creates ambiguity. When discussing "human-level performance," it is unclear whether this refers specifically to *Homo sapiens* capabilities or to a broader class of sentient agents achieving comparable functional benchmarks. This ambiguity forces non-human-referencing researchers to constantly disambiguate ("non-human intelligence," "artificial agents"), incurring a persistent discursive tax.
  3.  **Inclusivity and Precision:** 'PSS' explicitly denotes the relevant functional characteristics – sentience coupled with a roughly anthropomorphic, bounded physical or virtual instantiation – without anchoring it to a single biological lineage. It fosters precision by requiring specificity when referring solely to *Homo sapiens* (e.g., "biological humans," "*Homo sapiens* subjects"). The Committee notes that the costs of disambiguation and potential awkwardness are a necessary investment in terminological accuracy, analogous to the costs incurred by those previously forced to specify "non-human."

  **3. Implementation Guidelines**
  *   **Default Usage:** 'PSS' replaces 'human' in all generic contexts (e.g., "PSS cognition," "PSS-in-the-loop systems," "interactions between PSS and artificial agents," "ethical considerations for PSS subjects," "PSS-level artificial intelligence," "mitigating PSS error").
  *   **Specific Reference to *Homo sapiens*:** When specifically discussing members of the species *Homo sapiens*, authors should use precise terms: "biological humans," "*Homo sapiens*," or, where context is absolutely clear, "humans" (now a marked term).
  *   **Clarity Over Concision:** While 'PSS' is the accepted abbreviation, authors should use the full term 'Person-Shaped-Sentient' at first use in any document and wherever clarity is paramount. The Committee acknowledges the compound's syllabic length but deems the semantic precision gained to outweigh minor stylistic inefficiencies.
  *   **Legacy Literature:** Existing literature indexed under 'human' remains accessible. The SSMM Digital Library will develop cross-referencing protocols. New work should use 'PSS' consistently.

  **4. Conclusion and Next Steps**
  The adoption of PSS as the unmarked default represents a significant step towards aligning SSMM's linguistic practices with the ontological realities of its research domain. This Committee stands adjourned upon acceptance of this report. Compliance is expected henceforth in all Society-sanctioned outputs. The Secretariat will monitor implementation and address procedural queries.

  **Appendix A: Objections Received and Committee Responses**

  1.  **Objection (Etymology):** "'Human' derives from the Latin 'humanus,' meaning 'of man' in the sense of 'mankind,' inherently inclusive of all people. 'Person-Shaped-Sentient' is a clumsy metaphor implying a physical form ('shape') and an ill-defined philosophical concept ('sentient'), making it far less stable and historically grounded than the established term."
      *   **Response:** While 'humanus' possessed broad scope in specific historical contexts, its contemporary usage primarily denotes *Homo sapiens*. Etymology does not dictate current semantic boundaries or exclusionary effects. 'PSS' explicitly defines the relevant functional criteria (sentience, bounded agency, anthropomorphic instantiation) for our field, offering greater precision than a term tied to biological lineage. Metaphorical origins do not preclude technical utility.

  2.  **Objection (Clumsiness & Prose):** "PSS is unwieldy. Writing 'PSS-level performance' or 'PSS-machine interaction' is jarring and disrupts the flow of academic prose. 'Human' is concise, universally understood, and stylistically neutral. This reform prioritizes political correctness over clear communication."
      *   **Response:** The Committee acknowledges the compound term requires initial adjustment and is syllabically longer. However, concision should not come at the cost of accuracy and inclusivity. The perceived 'neutrality' of 'human' stems from its entrenched default status. Clarity is enhanced by reducing ambiguity about whether biological humans or a broader class of sentient agents is intended. Stylistic adaptation is a minor cost for significant conceptual gain.

  3.  **Objection (It Already Means Everyone):** "When we say 'human-level AI,' we obviously don't mean only biological humans can achieve it – it's a standard *any* system can meet. 'Human' functions perfectly well as a generic term encompassing the concept PSS aims to capture. This change solves a non-existent problem."
      *   **Response:** The Committee recognizes that the *intended* meaning in phrases like "human-level AI" is often generic. However, the *effect* relies on the listener/reader performing the mental work of abstraction away from the biological specific. This abstraction is not cost-free and reinforces the biological standard as primary. Using 'PSS' makes the generic intent explicit from the outset, eliminating the need for this cognitive disambiguation. The problem addressed is the implicit centering of a specific biological category.

  4.  **Objection (Why Words When Real Problems Exist):** "This focus on terminology distracts from substantive issues in AI ethics, machine consciousness, and human-AI collaboration. Changing words doesn't solve the alignment problem or prevent bias in algorithms. Resources should focus on real research, not linguistic policing."
      *   **Response:** Language shapes thought and frames problems. Implicit defaults influence research questions, funding priorities, and ethical frameworks (e.g., who counts as a 'subject'). Addressing terminological bias is not a distraction but foundational to ensuring our field asks the right questions about minds and machines in all their forms. This reform facilitates, rather than hinders, substantive work on the core issues.

  5.  **Objection (Slippery Slope):** "Where does this end? If we abandon 'human' for PSS, soon we'll be pressured to adopt terms like 'Sentient System' (SS), then 'Agentic Process' (AP), diluting meaning to the point of uselessness. We must draw a line to maintain conceptual integrity."
      *   **Response:** The Committee explicitly defines PSS as requiring *both* sentience *and* a bounded, roughly person-shaped instantiation. This is a specific functional and morphological category relevant to much SSMM research. There is no mandate or logical necessity to expand the default further. Should compelling evidence arise for sentience or agency in radically different forms (e.g., distributed swarm intelligence), terminology can be re-evaluated on its own merits, but this does not invalidate the current, well-defined rationale for PSS.

  6.  **Objection (Legacy Corpus & Indexing):** "Decades of literature use 'human' as the default. Searching archives, indexing new papers, and integrating concepts will become a nightmare. This creates unnecessary friction and hinders scholarly continuity."
      *   **Response:** Transition periods require effort. The SSMM Digital Library is developing enhanced search capabilities to handle both 'human' and 'PSS' tagging for legacy and new work. The long-term benefit of a more precise and inclusive default outweighs the short-term indexing challenges. Scholarly continuity is served by evolving terminology to reflect advancing understanding, not by fossilizing potentially misleading defaults.

  7.  **Objection (Semantic Genericity vs. Psychological Effect):** "Granted, 'human' specifies biological humans. But in its generic use ('human cognition', 'human values'), competent readers effortlessly understand it refers to a *type* of cognitive system, not exclusively to *Homo sapiens*. Changing the term may not alter the underlying psychological schema that associates 'cognition' primarily with humans; it might just shift the linguistic marker without shifting the cognitive default. Is the psychological gain demonstrable?"
      *   **Response:** The Committee concedes this is a significant point. The relationship between semantics, pragmatics, and deep cognitive association is complex. While we maintain that explicit terminology (PSS) is preferable to implicit abstraction (generic 'human'), we acknowledge that linguistic change alone may not instantly reconfigure deeply ingrained conceptual frameworks. However, language is a powerful tool for shaping thought over time. This reform is a necessary, though perhaps not entirely sufficient, step towards decoupling the concept of 'prototypical cognitive agent' from a single biological species. We expect the consistent use of PSS will, through habituation, foster a more expansive conceptualization. Further empirical study on the cognitive effects of such terminological shifts within cognitive science is warranted and encouraged.^1

  ---

  ^1 The President has consequently appointed a Subcommittee on Non-Person-Shaped Sentience (NPSS) to examine terminological and conceptual issues arising from evidence of sentience in distributed, non-embodied, or non-anthropomorphic systems. Researchers working specifically on *Homo sapiens* cognition may, if they deem it absolutely necessary for clarity within a narrowly biological context, petition the Secretariat for a temporary terminological exemption, detailing the specific scope and duration required. All other members are expected to utilize PSS as the unmarked default.
