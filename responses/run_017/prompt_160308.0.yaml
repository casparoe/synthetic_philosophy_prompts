prompt: |-
  I am trying to say, precisely, when a non-human thing deserves to be written into a historical narrative as an actor rather than left in the scenery as a condition, and when citing one tips over into the environmental determinism I want to avoid. I have been going by my gut on individual cases; below are the verdicts. Alongside them is a principle I have been testing, which I suspect is either too strong or simply the wrong shape. I do not need the historiography surveyed, and I am not looking for sources; I want the principle.

  The principle I have been using has three clauses. First, plan-revision: X is an actor in an episode only if X's onset is datable inside that episode's own timescale and forced the human agents to abandon and remake plans they had already made. Second, direction: a non-human factor may be cited to explain what agents were responding to, but not substituted for what they decided. Third, invitation: where the arrival or the magnitude of X is itself the downstream product of human choices, X is an 'invited actor' — a third thing, neither pure actor nor pure condition.

  The verdicts. The eruption of Mount Tambora and the crop failures that followed across Europe and New England: full actor, and no uneasiness at all about letting a volcano shape migration and grain prices. Coal in Britain: condition, not actor, and 'coal caused the Industrial Revolution' strikes me as lazy — though I do not object to saying that the location of the coalfields helped fix where the mills went. The potato blight in Ireland: the blight is an actor, but I resist saying it caused the deaths; grain kept leaving the country and relief was organized badly, and I want to call the blight a trigger and the policy the cause of the mortality — even though the blight is by far the more abnormal ingredient. The Black Death and the subsequent scarcity of labour, rising wages, and weakening of serfdom in Western Europe: fine, the bacterium is an actor, and I am happy to let a germ carry a large social change. The Antonine and Justinian plagues invoked to explain the spread of Christianity or the failure of the Mediterranean reconquest: suspicious, and it feels like hand-waving of exactly the sort I have just endorsed in the Black Death case. Mosquito-borne disease in the Atlantic world, which made some coasts lethal to Europeans and survivable to others and so helped fix what kind of colonies and what kind of labour systems took hold: fine, no determinism worry, and I am content to call the mosquito an actor. The same style of argument at millennial scale — continental orientation, domesticated animals, Eurasian germs killing the overwhelming majority of the indigenous population of the Americas: acceptable for the demographic collapse, but I bristle when it is extended to explain why the West rather than anywhere else, or used as a master key for the whole rise of Europe. The North Sea flood of 1953: actor. The bare fact that much of the Netherlands lies below sea level: condition — and yet explanations of Dutch water management that begin from that fact seem to me entirely legitimate, while explanations of Dutch commercial primacy that begin from the same fact seem to me determinist and I would rather not use them.

  The pair I cannot reconcile is the Black Death against the Antonine and Justinian plagues: in both a pathogen is invoked for a large social outcome, and my clause about mechanism and my clause about direction do not obviously separate them. I also cannot get comfortable about the coalfield verdict, since the plan-revision clause would seem to make every slow geography a mere condition forever.

  What I want from you: a precisely stated principle, or two candidates if the choice is genuinely open, with the case that motivates each clause; a version simple enough that someone holding only a written narrative could run it as a test; its verdicts on four cases I have not listed — a monsoon that fails to arrive, so that the actor would be an absence; a storm that a city had anticipated and built against, which then arrives as forecast; a flood whose height was nobody's doing but whose damage curve is entirely a function of where people were permitted to build; and the exhaustion of a resource that the agents always knew was finite. Tell me honestly which of my verdicts your principle cannot accommodate and whether the right response is to drop the verdict or to add a clause. Give me also the simpler rival that overturns one of my verdicts, so I can see what buying simplicity costs. And tell me what all of this says about the case I keep reversing on: whether the 1918 influenza pandemic belongs in the causal story of how the First World War ended, or whether that is precisely the kind of explanation I claim to distrust.
reasoning: |-
  Okay, the user is grappling with a nuanced historiographical problem: determining when non-human elements should be treated as historical actors versus background conditions, while avoiding environmental determinism. They've proposed a three-clause principle and provided case verdicts that expose tensions, particularly between similar plague events and slow-moving factors like coal deposits.  

  The core tension lies in their simultaneous desire to acknowledge non-human agency (Tambora, Black Death) and reject reductive explanations (coal causing Industrial Revolution, Dutch geography determining commerce). Their discomfort with the Antonine/Justinian plagues versus acceptance of the Black Death's role suggests an unarticulated concern about proportionality and traceability—how directly can we link cause to effect?  

  For the unresolved plague comparison: the Black Death's labor scarcity effects are well-documented through wage records and manorial court rolls, creating a clear causal chain. The Antonine/Justinian plagues' links to Christianity's spread or military failures rely on thinner evidence with more intervening variables—thus feeling "hand-wavy." This points to needing a clause about demonstrable mechanism.  

  The coal verdict reveals a flaw in their "plan-revision" clause: geography becomes inert because its "onset" isn't datable. But coal's actor-status emerges when humans actively choose to exploit it (e.g., Newcomen's engine requiring specific coal properties). The missing element is human recognition—when agents perceive and interact with the non-human thing as a variable.  

  Their four new cases test boundaries:  
  - A failed monsoon (absence-as-actor): Only an actor if humans had contingent plans relying on its arrival (e.g., planting drought-sensitive crops).  
  - An anticipated storm: Not an actor if defenses worked as planned; becomes one only if it exceeded expectations, forcing new responses.  
  - A flood with human-amplified damage: The flood is condition; zoning decisions are the actor.  
  - Resource exhaustion: Actor only if depletion triggered unplanned adaptations (e.g., unexpected collapse forcing fuel switch), not if managed gradually.  

  On 1918 influenza: It qualifies as an actor for war termination only if it directly altered military or political plans (e.g., Germany's troop shortages during Spring Offensive 1918), not as a vague background stressor. Their distrust of "flu ended WWI" arguments is justified—it's often determinist unless tied to specific decisions like Ludendorff's assessment of manpower.  

  The revised principle prioritizes traceable disruption over magnitude. What makes Tambora or the 1953 flood "actors" isn't their scale but how they shredded existing human intentions in documented ways. Simpler alternatives like "anything that changes outcomes" would over-attribute (e.g., making Dutch elevation the actor in commerce), while "only human-like intent" would under-attribute (excluding pathogens).  

  The user's instinct to distinguish "trigger" (potato blight) from "cause" (policy) is sound. Their principle needs to accommodate that by requiring evidence of the mechanism linking non-human event to human choices—hence the "traceable" clause.  

  One verdict to drop: Coalfields should be upgradable to "actor" when specific industrial choices responded to their properties (e.g., Watt's engine design accommodating Scottish coal impurities). Their inertness in the original verdict reflects the limitation of the "plan-revision" clause with slow factors.  

  Candidates for simplicity:  
  1. "X is an actor if contemporary records show agents debating how to respond to X." (But over-includes anticipated events.)  
  2. "X is an actor if removing X from the story requires rewriting human actions, not just descriptions." (Still vague on "rewriting.")  

  The chosen formulation balances precision with applicability. It accepts all their verdicts except coal (which it upgrades situationally) and explains why Antonine/Justinian plagues feel suspect: the "traceable" mechanism is often assumed, not shown.
answer: |-
  Here is a refined principle addressing your tensions, preserving your core insights while resolving inconsistencies:

  **Definitive Principle:**  
  A non-human factor (X) qualifies as a **historical actor** in an episode if:  
  1. **Disruption:** X demonstrably *interrupted* human plans within the episode's timeframe (either by novel arrival, unexpected intensification, or catastrophic absence).  
  2. **Traceability:** The *mechanism* by which X altered human actions is specifically identifiable in evidence (e.g., records of revised decisions, resource shifts, or policy debates).  
  3. **Non-Substitutability:** X cannot be replaced in the causal account by pre-existing human intentions or structural conditions without loss of explanatory power for the *specific outcome*.  

  **Clarifications & Rationale:**  
  - **Disruption:** Expands "plan-revision" to include *absence* (failed monsoon) and *intensification beyond anticipation* (storm exceeding defenses). Avoids excluding slow factors by focusing on *when impact occurs*, not X's origin.  
  - **Traceability:** Resolves plague discrepancies. Black Death has direct evidence linking labor scarcity to changed feudal relations. Antonine/Justinian links to Christianity's spread lack equivalent evidence; gaps are filled by assumption.  
  - **Non-Substitutability:** Blocks determinism by ensuring X is *necessary* for the specific chain of events. Dutch geography is substitutable in commercial primacy (other trading states lacked it) but not in water management (it *is* the problem addressed).  

  **Verdicts on New Cases:**  
  1. **Failed Monsoon (absence):** *Actor* if planting/irrigation plans assumed normal rains and were abandoned (Disruption + Traceability via famine relief debates). Otherwise, *condition*.  
  2. **Anticipated Storm Arriving as Forecast:** *Condition*. No Disruption (plans accounted for it). Damage results from pre-existing choices (e.g., building codes).  
  3. **Predictable Flood with Human-Amplified Damage:** *Condition*. Flood height is scenery; zoning decisions are the *actor* causing disproportionate harm.  
  4. **Exhaustion of Known Finite Resource:** *Actor* only if depletion triggered *unplanned* crisis (e.g., sudden collapse forcing emergency adaptation). Gradual exhaustion is a *condition* shaping long-term strategy.  

  **Reconciling Your Cases:**  
  - **Black Death vs. Antonine/Justinian Plagues:** Black Death satisfies **Traceability** (wage data, manorial records show causal chain to serfdom's decline). Later plagues often lack comparable evidence for claimed social effects; explanations rely on correlation, violating Non-Substitutability (human choices like imperial overextension can explain outcomes alone).  
  - **Coal:** *Condition* under your verdict, but **upgradable to actor** in *specific decisions*: e.g., when a mine's flooding forced Boulton & Watt to redesign engines (Disruption + Traceability). "Coal caused Industrial Revolution" fails **Non-Substitutability** (institutions, capital, ingenuity were equally necessary).  
  - **Potato Blight:** Your verdict holds. Blight is **Disruptive actor** (forced plan revisions). Policy is primary cause of deaths – **Non-Substitutability** shows blight alone insufficient (grain exports continued).  
  - **Dutch Geography:** Water management: **Condition** (foundational, not disruptive). Commercial primacy: Invoking geography as primary cause fails **Non-Substitutability** (Venice had different geography; Dutch institutions/policies were decisive).  

  **Incompatible Verdict & Resolution:**  
  - **Tambora vs. Justinian Plague:** Your unease with the latter is justified. The principle rejects "Justinian Plague caused Christianity's spread" for lacking **Traceability** and **Non-Substitutability**. *Drop the verdict* that it's similar to Tambora/Black Death.  

  **Simpler Rival & Cost:**  
  *"X is an actor if its occurrence changed outcomes significantly."*  
  - **Cost:** Over-includes *all* your "condition" cases. Dutch geography *changed* commercial outcomes vs. no land. Coal *changed* industrialization. Fails your determinism avoidance.  

  **1918 Influenza & WWI End:**  
  - **Using the principle:**  
    - **Disruption:** Yes – decimated troops *during* Spring 1918 offensives.  
    - **Traceability:** Yes – documented in German command debates (Ludendorff cited troop shortages from flu).  
    - **Non-Substitutability:** Yes – flu accelerated German collapse *differently* than war-weariness alone; it disrupted planned military operations.  
  - **Verdict:** **Influenza is a legitimate actor** in the *timing and manner* of Germany's defeat. It is not determinist because:  
    1. It interacted with human decisions (failed offensives, morale collapse).  
    2. It doesn't *substitute* for human causes (Allied pressure, blockade).  
    3. It fits your Black Death pattern: a biological force traceably altering social/military capacity within an episode.  

  **Conclusion:** This principle systematizes your intuition that non-human actors matter *when they force humans to change course in identifiable ways*. It avoids determinism by tethering causation to specific disruptions and requiring evidence of mechanism. The 1918 flu qualifies; the Justinian Plague’s link to Christianity does not. Coal gains actor-status only in micro-decisions, not macro-narratives.
