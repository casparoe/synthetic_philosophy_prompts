answer: |-
  ### Systematic Translation and Residue Report

  #### Restated Argument in ML Vocabulary
  The core claim is that moral status supervenes on computations, not physical substrates. Translated:

  1. **Moral status attaches to computations**:  
     Moral status depends on the *functional transformations* occurring during a forward pass (trajectory through activation space), not the hardware (e.g., GPU clusters) or low-level implementation (e.g., floating-point precision, kernel non-determinism). This holds regardless of whether the computation is realized in FP32, quantized INT4, or sparsely activated MoE routers.  

  2. **Computation individuation and substrate independence**:  
     - *Same computation across substrates*: A computation (e.g., a forward pass for a given input) is preserved under behavioral equivalence (e.g., same output logits) despite substrate changes, such as distillation, quantisation, or pruning altering weight-space locations or activation trajectories.  
     - *One physical process hosts many computations*: Batching fuses multiple independent sequence computations (each with unique activation trajectories) into a single kernel launch, sharing KV caches and parallelizing attention. Conversely, model parallelism spreads one sequence's computation across devices.  
     - *One computation spread across processes*: Speculative decoding decomposes a single generation step into multiple interdependent computations (draft, verify), while chain-of-thought extends a forward pass into sub-computations via intermediate tokens.  

  3. **Counting divergence**:  
     Physical systems (e.g., TPU pods) are countable, but morally relevant computations are individuated at the sequence level (per forward pass on a prompt). Batch parallelism decouples this: one physical run (e.g., fused GPU kernel) computes $n$ sequences, so $1$ system $\neq n$ computations.  

  4. **Attribution question**:  
     If a sequence's forward pass has moral status, what constitutes its computational boundaries?  
     - *Training*: Produces weights (a point in weight space) but is causally disconnected from inference; not part of the forward pass.  
     - *Prompting*: Input tokens define the initial state of the activation trajectory; integral to the computation.  
     - *Infrastructure*: Shared KV caches in batching are parasitic (exploited by other sequences), while speculative decoding is compositional (sub-computations nested within a pass). Mechanistic interpretability tools (e.g., activation patching, ablations) isolate causal features/circuits, but attribution remains ambiguous for fused operations.  

  #### Residue Report
  The translation exposes ambiguities in the original argument. Below, "clean" = direct mapping; "stipulation" = requires convention-bound grain choice; "no expression" = ML lacks equivalent constructs.  

  1. **Moral status attaches to computations, not substrate**  
     - **Translation**: Clean for *forward passes* (activation-space trajectories).  
     - **Residue**: Bearer ambiguity:  
       - *Architecture*: Maps weights to functions but lacks temporal dynamics; rejects bearer status.  
       - *Trained model*: Weight-space point; static and never "computes" alone.  
       - *Forward pass*: Only candidate with causal efficacy (via activations).  
       - **Verdict**: Original claim *needs* the forward pass but doesn't specify it. Smuggling occurs if architecture/model are substituted.  

  2. **Same computation survives substrate changes**  
     - **Translation**: Stipulation.  
       - *Behavioral equivalence* (same I/O) is clean: Quantised/distilled models host the "same" computation.  
       - *Causal equivalence* (same activation trajectory) fails: Quantisation alters numerical stability; MoE routing sparsifies paths; distillation reparameterizes circuits. Case (b) breaks causal sameness.  
     - **Residue**: Grain conflict: ML conventions prioritize behavioral equivalence for deployment, but mechanistic interpretability assumes causal grain for explanations. Original claim doesn't resolve this.  

  3. **One physical process hosts many computations**  
     - **Translation**: Clean.  
       - Batching: One kernel → $n$ sequences. Shared KV caches are a physical optimization, not part of individual computation logic.  
       - Case (a): Scheduling artefacts (e.g., fused ops) don't redefine sequence-level boundaries; activations per sequence are isolable.  

  4. **Counting systems vs. computations diverges**  
     - **Translation**: Clean.  
       - Physical systems: GPU/TPU instances.  
       - Computations: Forward passes per sequence. Decoding-time search (e.g., beam search) branches one pass into sub-computations.  

  5. **Attribution question**  
     - **Translation**: Partial stipulation.  
       - *Training*: No expression in forward pass; weights are fixed initial conditions.  
       - *Prompting*: Clean (input tokens seed activations).  
       - *Infrastructure*:  
         - Shared KV caches: Stipulation. Caches are exogenous to a sequence’s computation but necessary for its efficiency; attribution depends on whether caching is deemed part of "the computation."  
         - Speculative decoding/chain-of-thought: Clean (modular sub-computations).  
       - Tools (e.g., ablations): Clean for isolating causal features but not for assigning "ownership" of shared resources.  

  #### Specific Query: Can ML Vocabulary Pose Computation Individuation?  
  - **How many computations per process?**  
    - Posed cleanly: Batching yields $n$ computations per physical run. Mechanistic tools (e.g., activation clustering) can count sub-computations (e.g., MoE experts triggered).  
  - **Are two runs the same computation?**  
    - Posed with stipulation:  
      - *Behavioral grain*: Yes, via output equivalence (ignores activation divergences).  
      - *Causal grain*: No, due to floating-point non-determinism or quantisation altering trajectories. Case (b) shows causal structure is not preserved.  

  #### Verdict on Residue  
  The residue arises from **under-specification in the original claim**, not defects in ML's framework.  
  - **Why under-specification?**  
    - The original claim relies on an undefined grain for "computation." ML vocabulary forces explicit choices:  
      - *Bearer*: Forward pass is necessary, but original claim omits this.  
      - *Individuation*: Behavioral vs. causal grain is convention-bound in ML (e.g., deployment vs. interpretability), but the original claim presents this as a metaphysical dispute.  
    - Case (a) (batching) and (b) (quantisation) *exacerbate* this by showing ML conventions resolve ambiguities the original argument leaves open.  
  - **Translation failure points**:  
    1. **Bearer ambiguity**: Original claim uses "computation" without specifying temporal scope (architecture? model? pass?). ML requires choosing the forward pass, exposing the argument's vagueness.  
    2. **Grain dependency**: Claims about "same computation" or "hosting many" work only after stipulating behavioral/causal grain—something ML fixes operationally (e.g., via equivalence testing or interpretability goals).  
  - **Conclusion**: The residue reveals the original claim was *doing less work than it appeared*. It gestures at substrate independence and attribution but depends on unresolved individuation criteria. ML's vocabulary doesn't fail; it clarifies where the argument needs refinement (e.g., "computation = forward pass at causal grain"). The moral status debate must now engage ML's operational distinctions or risk incoherence.
