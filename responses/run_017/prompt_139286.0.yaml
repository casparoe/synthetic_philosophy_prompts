  ## The Form at the Kitchen Table

  The form lies flat. Vera considers the risk  
  for mortals: one percent. But she's a woman,  
  so five. Her sister's  
  stroke at sixty-two: ten. For carriers,  
  fifteen. But she bikes—a cyclist—  
  so three. She writes *one hundred* this morning.  

  This morning, the pen hovers. For mortals  
  it's one, but she’s a woman,  
  so five. Her sister’s  
  fate suggests ten. If she’s a carrier,  
  fifteen. But as a cyclist,  
  she leans on three. She writes *three* for cyclists.  

  The cyclists’ low rate: three. This morning  
  she feels strong. For mortals,  
  it’s still one. For women,  
  five. Her sister’s  
  history: ten. If she’s a carrier,  
  fifteen. She writes *fifteen* for carriers.  

  Carriers bear that weight: fifteen. Cyclists  
  claim three. This morning,  
  she breathes clear air. Mortals:  
  one. Women:  
  five. Her sister’s  
  shadow: ten. She writes *ten* for sisters.  

  Sisters share more than names. Ten. Carriers  
  add five more. Cyclists  
  subtract two. This morning,  
  the ink waits. Mortals:  
  one. Women:  
  five. She writes *five* for women.  

  Women: five. Her sister’s  
  legacy complicates. Carriers  
  multiply fear. Cyclists  
  trust the road. This morning,  
  the answer narrows. Mortals:  
  one. She writes *one* for mortals.  

  Mortals, women: one or five.  
  Sisters, carriers: ten or fifteen.  
  Cyclists, this morning: three or one hundred.  

  ---

  **Notes on the sestina's fulfillment:**  

  1. **Cross-cutting classes**  
     - Vera’s memberships exert conflicting pressures: *carriers* (↑ risk), *cyclists* (↓ risk), *sisters* (↑ via family history), *women* (baseline), *mortals* (↓ via dilution), *this morning* (↑/↓ via singularity).  
     - No class is "narrowest": *cyclists* and *carriers* are independent; *this morning* isn’t a statistical category.  

  2. **Widest and narrowest collapse**  
     - *Mortals* (1%) is uselessly low for a 58-year-old; *this morning* (100%) is unusably certain. Both extremes deny nuance.  
     - The poem mirrors this by opening and closing stanzas with these extremes, trapping Vera in certainty’s vise.  

  3. **Data adequacy ≠ resolution**  
     - Each stanza cites a number (1, 5, 10, 15, 3, 100) derived from "the book" or logic—no missing data.  
     - Yet the numbers shift arbitrarily with the class, exposing the core dilemma: which *ready* number fits *Vera*?  

  4. **Envoi’s unresolved tension**  
     - Pairs all six end-words without hierarchy (*mortals, women*; *sisters, carriers*; *cyclists, this morning*).  
     - Ends on the imperative to choose ("three or one hundred") but refuses resolution—skepticism and shrugs avoided.  

  **Technical restraint**: No jargon; "risk" substitutes for "probability." **Human stakes**: Vera’s number could dictate insurance, surgery, or relocation. **Tone**: Dry, urgent, with rhythmic rotation emphasizing the six classes’ irreducible conflict.
