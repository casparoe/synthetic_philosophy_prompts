prompt: |-
  I sit on the rules-architecture committee of a self-governing institution — imagine the game Nomic, except that the moves bind real members, some of whom would prefer the institution to stop being self-governing. Our remit is the amendment layer: which rule governs changes to which rule, and how that layer can itself be changed. Before we draft anything, I want a specification of the *theory*, not of the constitution: what an adequate account of a self-amending normative system has to deliver in order to be usable as a stress-test checklist — good enough that we can take any sequence of formally correct moves and ask where, if anywhere, it stops being an amendment and becomes a capture. That purpose should fix which requirements are non-negotiable.

  What I want from you is the requirements list, each with the case or consideration behind it: the distinctions the theory must be able to draw, the acts it must be able to classify, the results it must not contradict, and the questions it must be allowed to leave open. Mark each as non-negotiable for my purpose, negotiable, or a preference of one family of accounts that has been dressed up as a requirement. Tell me where I have listed two requirements that are really one, or one that is really two.

  Here are the cases I want the list to be answerable to, with what I take each to be a case of; correct my classification where it is wrong.

  1. The entrenchment ladder: a rule raises the threshold for its own amendment, and later makes itself unamendable. Must a theory represent degrees of entrenchment, or is the unamendable simply the limit case?
  2. Self-ratifying franchise shift: an amendment changes which body must assent to amendments, and is ratified by the body it creates. Is this a separate kind of act, or the ordinary case seen clearly?
  3. The mutually dependent package: two amendments, each invalid until the other has passed, enacted as a single package. I suspect any theory that evaluates amendment acts one at a time fails here, and that the real requirement concerns what counts as one act.
  4. The renumbering gambit: a preliminary amendment moves the rule protecting a class of rules outside that class, which is then amended by ordinary procedure. This looks like the same requirement as (3) in a different costume, but I am not certain.
  5. Retroactive self-illegalization: an amendment that makes its own enactment a violation, or that takes effect from a date before it was ratified.
  6. The façade: the amendment procedure is left untouched, but an authoritative reinterpretation of a rule has every effect of an amendment. If reinterpretation is not an amendment, the amendment rule has no bite; if it is, then every application risks being one and the system cannot act at all. I take this to be the hardest case, and I would rather you stated the requirement it grounds correctly than that you fitted it to my wording.
  7. Invalid but effective, and valid but inert: a seizure of the amendment power that officials subsequently treat as law; a formally valid amendment universally ignored. Must a theory of self-amendment connect validity to what officials actually do, or does that belong to a different theory entirely?
  8. The penalized motion: a rule providing that any motion to amend it is itself a violation. Can a prohibition protect its own amendment procedure, and what is the status of the attempted act?
  9. Systemic identity: an amendment deletes the amendment rule and replaces it with deference to a single office, or replaces the entire rule set while leaving the amendment rule standing. Does the theory need a criterion for when an amendment yields a successor system rather than a modified one, and can that criterion be internal to the system?

  The part I most want is the jointly unsatisfiable subset. My own candidates: that every valid change is authorized by the system's existing rules, versus the ability to represent a change in the system's ultimate criterion of validity as more than a violation; that the theory return a determinate verdict for every self-referential act, versus the system's being permitted genuine gaps, including about its own amendment; content-neutrality of the amendment power, versus the capacity to entrench a core; and symmetry between entrenching and dis-entrenching, versus the capacity to make an irreversible commitment. Say which of these is a real impossibility rather than a tension, give the strongest version of the argument, and tell me which desideratum I should drop given that my purpose is detecting capture rather than vindicating continuity.

  Then: which single requirement excludes the largest share of accounts? Against that, score three families in two or three lines each — accounts that ground validity in a presupposed ultimate rule, accounts that ground it in the practice and acceptance of officials, and accounts that avoid self-reference by stratifying rules into levels with amendment rules always one level up. Describe them by their shape, name no authors, and give me no reading list; the list of criteria is the deliverable, and I can find the library myself. Finally, say what a theory of this kind should not be asked to do at all.
reasoning: |-
  We are constructing a requirements list for a theory of self-amending normative systems, to be used as a stress-test checklist for detecting when a formally correct amendment sequence becomes a capture of the system. The requirements must enable the classification of acts, drawing of distinctions, and avoidance of contradictions in the specified cases. We will:

  1. List requirements with their rationale and mark them as non-negotiable, negotiable, or a preference dressed as requirement.
  2. Consolidate or split requirements where appropriate.
  3. Address the jointly unsatisfiable desiderata and identify real impossibilities.
  4. Identify the requirement that excludes the largest share of accounts and score three families of accounts against it.
  5. State what the theory should not be asked to do.

  We start by deriving requirements from the cases and then address the jointly unsatisfiable subset and other questions.

  ### Requirements List

  Each requirement is derived from the cases and the purpose of detecting capture. The rationale links to the cases and the underlying concern.

  **R1: Representation of Entrenchment Degrees**  
  - *Rationale*: From case (1) (entrenchment ladder). The theory must represent degrees of entrenchment (e.g., supermajority requirements) and the limit case of unamendability. This is essential to track when a rule becomes immune to amendment and to assess if a change bypasses these protections.  
  - *Status*: Non-negotiable. Without this, we cannot model the escalation of entrenchment that might lead to capture.

  **R2: Recognition of Franchise Shifts**  
  - *Rationale*: From case (2) (self-ratifying franchise shift). The theory must recognize that an amendment can change the body authorized to amend and that such a change might be ratified by the new body. This is a distinct act because it involves a shift in the ultimate source of authority.  
  - *Status*: Non-negotiable. Captures often involve such shifts to consolidate power.

  **R3: Package Amendment Validity**  
  - *Rationale*: From case (3) (mutually dependent package). The theory must allow for the validity of package amendments where multiple interdependent changes are enacted as a single unit. Evaluating each amendment in isolation would invalidate the package. This requires a concept of a single act comprising multiple rule changes.  
  - *Status*: Non-negotiable. Without this, we cannot handle coordinated changes that are individually invalid but jointly valid, which is a common tactic in capture.

  **R4: Recognition of Rule Renumbering and Class Manipulation**  
  - *Rationale*: From case (4) (renumbering gambit). The theory must recognize that an amendment might move a rule out of a protected class and then amend it. This is distinct from package amendments because it involves a sequence of acts, but it shares the requirement for tracking the effects of changes on the amendment rules themselves.  
  - *Status*: Non-negotiable. This is a frequent method to evade entrenchment. However, note that this is not the same as R3: R3 is about simultaneous package, R4 is about sequential manipulation. Both require the theory to handle changes that affect the amendment rules.  
  - *Note*: While distinct from R3, both fall under the broader requirement of handling self-referential changes to the amendment rules.

  **R5: Handling Retroactivity and Self-Illegalization**  
  - *Rationale*: From case (5) (retroactive self-illegalization). The theory must be able to classify amendments that make their own enactment illegal or that apply retroactively. This tests the coherence of the system under self-referential changes.  
  - *Status*: Non-negotiable. Such tactics can be used to delegitimize past acts or create confusion, aiding capture.

  **R6: Differentiation between Amendment and Reinterpretation**  
  - *Rationale*: From case (6) (façade). The theory must distinguish between formal amendment and authoritative reinterpretation. It must not allow reinterpretation to function as an unregulated amendment, nor must it paralyze the system by treating every interpretation as an amendment. The requirement is to have a clear criterion for what counts as an amendment versus interpretation, and to account for the possibility of capture through reinterpretation.  
  - *Status*: Non-negotiable. This is critical because capture often occurs through reinterpretation that undermines the amendment rule.

  **R7: Separation of Validity and Efficacy**  
  - *Rationale*: From case (7) (invalid but effective, valid but inert). The theory must distinguish between validity (according to the rules) and efficacy (actual observance by officials). However, for the purpose of detecting capture, we need to know when an invalid change becomes effective (and thus a capture) and when a valid change is ignored (which might indicate a breakdown but not necessarily capture).  
  - *Status*: Negotiable. While the theory must be able to represent both validity and efficacy, the connection between the two may not be necessary for the stress-test. The stress-test is about formal validity and the potential for capture through formal means. However, to detect capture, we must note when an invalid act becomes effective, so the theory should at least allow for the description of efficacy as a separate fact.  
  - *Adjustment*: The requirement is that the theory can represent both validity and efficacy and their possible divergence, but it need not explain why they diverge. That belongs to a sociological theory.

  **R8: Prohibition on Amendment Motions**  
  - *Rationale*: From case (8) (penalized motion). The theory must classify the status of an attempted amendment that is prohibited by the rule it seeks to amend. This includes whether the prohibition is valid and what the consequences are for the act of proposing it.  
  - *Status*: Non-negotiable. This tests the limits of self-reference and the ability of rules to protect themselves.

  **R9: Criterion for Systemic Identity**  
  - *Rationale*: From case (9) (systemic identity). The theory must provide a criterion for when a set of amendments results in a new system rather than a modification of the old one. This criterion must be internal to the system to avoid external reliance.  
  - *Status*: Non-negotiable. Capture often involves a replacement of the system while maintaining a façade of continuity.

  **R10: Self-Referential Coherence**  
  - *Rationale*: Implicit in many cases (especially 1, 2, 4, 5, 8). The theory must handle self-referential rules without contradiction. For example, rules that govern their own amendment.  
  - *Status*: Non-negotiable. Without this, the system cannot be modeled in the critical cases.

  **R11: Temporal Sequencing of Changes**  
  - *Rationale*: From cases (4) and (5). The theory must represent the temporal order of amendments and their effects, including retroactive effects.  
  - *Status*: Non-negotiable. This is essential for tracking sequences that lead to capture.

  **R12: Clear Delimitation of Amendment Acts**  
  - *Rationale*: From cases (3) and (4). The theory must specify what counts as a single amendment act (e.g., a package) versus a sequence of acts.  
  - *Status*: Non-negotiable. This is necessary to prevent evasion through procedural manipulation.

  ### Consolidation and Splitting

  - Cases (3) and (4) were initially thought to be similar, but they are distinct: (3) is about simultaneous interdependent amendments, while (4) is about sequential manipulation of rule classes. However, both require the theory to handle complex interactions with the amendment rule (R3 and R4). We have R3 for packages and R4 for renumbering, but they are unified under the need to track the effects of changes on the amendment rules (R10 and R12).
  - We have split R7 into two aspects: validity and efficacy, but kept them as a single requirement to represent both and their divergence.

  ### Jointly Unsatisfiable Desiderata

  You listed four tensions. We must identify which are real impossibilities and which are tensions that can be managed, and recommend which desideratum to drop for the purpose of detecting capture.

  1. **Tension 1: Every valid change is authorized by existing rules vs. representing a change in the ultimate criterion of validity as more than a violation.**  
     - This is a real impossibility in a strictly hierarchical system (like Kelsen) where the basic norm is presupposed. However, in a dynamic system that allows for revolutionary changes (like Hart's rule of recognition changing by practice), it is possible. But for a formal stress-test, we are concerned with the existing rules.  
     - *Resolution for capture detection*: Drop the requirement that the theory must represent a change in the ultimate criterion as more than a violation. For detecting capture, we care about whether the change is authorized by the existing rules. If it is not, it is a violation (and potentially a capture if effective). If the ultimate criterion changes, it must still be authorized by the prior system to not be a capture.

  2. **Tension 2: Determinate verdict for every self-referential act vs. allowing genuine gaps.**  
     - This is a tension, not an impossibility. A theory can allow gaps (e.g., by having a third truth value) while still providing a framework to classify acts. However, for a stress-test, we need determinacy to decide if capture occurred.  
     - *Resolution*: Prefer determinacy. The theory should return a verdict for every act, even if that verdict is "invalid" or "undefined". But for capture detection, we cannot have gaps that obscure whether an act is a capture. So, require the theory to classify every act as valid, invalid, or perhaps void (which is a determinate category).

  3. **Tension 3: Content-neutrality of the amendment power vs. capacity to entrench a core.**  
     - This is a tension, not an impossibility. A system can have a content-neutral amendment procedure that is limited by entrenched rules. However, if the amendment power is content-neutral, it cannot be limited by content. Thus, to have entrenchment, the amendment power must not be content-neutral.  
     - *Resolution for capture detection*: Drop content-neutrality. Entrenchment is a key feature to protect against capture, so the theory must allow for it. The amendment power can be limited by content (e.g., "no amendment may alter the republican form of government").

  4. **Tension 4: Symmetry between entrenching and dis-entrenching vs. irreversible commitments.**  
     - This is a real impossibility if we require both: if a rule can be entrenched such that it cannot be amended, then dis-entrenching it would be impossible. Symmetry would require that entrenching and dis-entrenching have the same procedural requirements, but if entrenching makes dis-entrenching impossible, symmetry is broken.  
     - *Resolution*: Drop symmetry. The theory must allow for irreversible commitments (entrenchment that cannot be undone) to model capture attempts. Symmetry is not necessary for capture detection.

  ### Requirement that Excludes the Largest Share of Accounts

  **R6: Differentiation between Amendment and Reinterpretation** is likely the most exclusionary. Many theories (especially those focused on formal rules) do not account for interpretive practices, and those that do (like Dworkinian integrity-based approaches) may not provide a clear demarcation. This requirement demands that the theory have a principled way to distinguish formal amendment from reinterpretation, which is difficult and often avoided.

  ### Scoring Three Families of Accounts Against R6

  1. **Ultimate Rule Accounts (e.g., Kelsen, Basic Norm)**:  
     - *Shape*: Validity is derived from a presupposed basic norm. All rules, including amendment rules, are validated by this norm.  
     - *Score on R6*: Fails. These accounts focus on formal validity and do not address reinterpretation. They cannot distinguish reinterpretation from amendment because both are seen as acts under the basic norm.

  2. **Officials' Practice Accounts (e.g., Hart, rule of recognition)**:  
     - *Shape*: Validity is grounded in the acceptance and practice of officials. The rule of recognition is a social fact.  
     - *Score on R6*: Moderate. These can incorporate reinterpretation as part of the practice of officials. However, without additional constraints, they might collapse amendment and reinterpretation into whatever officials accept. They can be extended to distinguish the two by the practice itself (e.g., if the practice treats amendment and interpretation differently).

  3. **Stratified Hierarchy Accounts (e.g., levels of rules, amendment rules at higher level)**:  
     - *Shape*: Rules are stratified into levels (e.g., level 0: object-level rules; level 1: amendment rules). Amendment rules can only be changed by rules at a higher level.  
     - *Score on R6*: Fails. Reinterpretation is not an amendment, so it is not governed by the amendment rules. This account has no place for reinterpretation and thus cannot draw the distinction. Reinterpretation would be an act at the object level, but if it changes the rule, it would be an unauthorized amendment.

  ### What the Theory Should Not Be Asked to Do

  The theory should not be asked to predict or explain the behavior of officials or the efficacy of rules. That is, it should not be a sociological or predictive theory. It should also not be asked to provide moral evaluations of the rules or amendments. Its domain is the formal structure and validity of changes.

  ### Final Requirements List (Non-negotiable Core)

  For the purpose of a stress-test checklist to detect capture, the non-negotiable requirements are:

  1. **Entrenchment Representation**: Must model degrees of entrenchment and unamendability.
  2. **Franchise Shift Recognition**: Must recognize amendments that change the amending body, even if self-ratifying.
  3. **Package Amendment Validity**: Must validate interdependent packages as single acts.
  4. **Rule Renumbering Recognition**: Must track sequential changes that manipulate rule classes and their protection.
  5. **Retroactivity and Self-Illegalization Handling**: Must classify such amendments and their effects.
  6. **Amendment vs. Reinterpretation Distinction**: Must clearly differentiate formal amendment from authoritative reinterpretation.
  7. **Validity-Efficacy Representation**: Must represent both and their possible divergence (but not explain it).
  8. **Prohibited Motion Status**: Must classify the status of motions prohibited by the rule they target.
  9. **Systemic Identity Criterion**: Must provide an internal criterion for when the system is replaced.
  10. **Self-Referential Coherence**: Must handle self-referential rules without contradiction.
  11. **Temporal Sequencing**: Must represent the order of amendments and retroactive effects.
  12. **Delimitation of Amendment Acts**: Must specify what constitutes a single amendment act.

  This list provides the criteria to stress-test any self-amending system for capture.
answer: |-
  Below is the requirements list for a theory of self-amending normative systems, designed as a stress-test checklist to detect when a formally valid amendment sequence becomes a "capture" (i.e., a de facto or de facto termination of self-governance). The requirements are derived from your cases, with rationales explaining the distinctions, classifications, and contradictions the theory must handle. Each requirement is marked as **non-negotiable** (essential for detecting capture), **negotiable** (useful but not strictly necessary), or **preference** (a stylistic or philosophical choice often conflated with necessity). I've consolidated or split requirements where your cases overlap or diverge, and corrected your case classifications where needed.

  ---

  ### **Requirements List**  
  *Derived from cases and purpose of detecting capture.*

  1. **Represent degrees of entrenchment, including unamendability**  
     - **Rationale**: Case (1) shows that entrenchment is scalar (e.g., escalating thresholds) and may culminate in unamendability. The theory must distinguish between amendable, entrenched, and unamendable rules to identify when a change illegitimately bypasses procedural barriers.  
     - **Status**: **Non-negotiable**. Captures often exploit incremental entrenchment to solidify control.  
     - **Case classification**: Correct. Unamendability is a limit case of entrenchment.

  2. **Recognize self-ratifying franchise shifts as valid amendments**  
     - **Rationale**: Case (2) involves an amendment that changes the amending body and is ratified by the new body. The theory must classify this as a permissible amendment (not a distinct act), as it tests whether the system’s rules authorize reflexive changes to their own authority.  
     - **Status**: **Non-negotiable**. Failure here obscures power grabs disguised as procedural updates.  
     - **Case classification**: Correct. This is the ordinary case of self-amendment seen under stress.

  3. **Validate mutually dependent packages as atomic units**  
     - **Rationale**: Case (3) requires that interdependent amendments (each invalid alone but valid together) be evaluated as a single act. The theory must define a "single amendment act" to prevent evasion through piecemeal invalidation.  
     - **Status**: **Non-negotiable**. Captures often use packages to force through incoherent changes that would fail individually.  
     - **Case classification**: Correct. The core requirement is defining atomicity of amendment acts.

  4. **Detect class-manipulation sequences (e.g., renumbering gambits)**  
     - **Rationale**: Case (4) involves sequential amendments: one moves a rule outside a protected class, another amends it. The theory must flag this as a potential evasion if the sequence abuses procedural gaps, but not invalidate it automatically. Differs from (3) by focusing on sequentiality vs. atomicity.  
     - **Status**: **Non-negotiable**. Common capture tactic; must be distinguishable from legitimate reclassification.  
     - **Case classification**: Incorrect. This is distinct from (3): (3) concerns atomicity of concurrent changes, (4) concerns temporality and rule-class manipulation. Split into separate requirements.

  5. **Classify retroactive self-illegalization as invalid**  
     - **Rationale**: Case (5) involves amendments that criminalize their own enactment or apply retroactively. The theory must invalidate these to avoid paradoxes (e.g., a valid rule declaring itself illegal) and prevent "poison pill" tactics.  
     - **Status**: **Non-negotiable**. Such acts are hallmarks of capture, creating self-referential chaos to paralyze opposition.  
     - **Case classification**: Correct.

  6. **Differentiate formal amendments from authoritative reinterpretations**  
     - **Rationale**: Case (6) (façade) shows that reinterpretation can functionally amend rules without procedure. The theory must define reinterpretation as non-amendment (to preserve the amendment rule’s bite) but allow that it can become de facto amendment if it alters substance. Must not require the system to treat all reinterpretations as amendments (which would paralyze it).  
     - **Status**: **Non-negotiable**. Greatest exclusionary power; captures often mask amendments as "interpretations."  
     - **Case classification**: Correct. Hardest case; requirement is precise: demarcate reinterpretation vs. amendment without collapsing into self-contradiction.

  7. **Distinguish validity (legal status) from efficacy (observance)**  
     - **Rationale**: Case (7) requires recognizing invalid-but-effective changes (e.g., seizures treated as law) and valid-but-inert changes (e.g., ignored amendments). The theory must separate validity (determined by rules) from efficacy (determined by official behavior) to identify when capture occurs despite formal invalidity.  
     - **Status**: **Negotiable**. Essential for describing capture but not for pure validity testing; efficacy belongs to a sociological theory, but must be representable.  
     - **Case classification**: Correct. Two distinct phenomena under one requirement.

  8. **Assign status to prohibited amendment motions (e.g., penalized motions)**  
     - **Rationale**: Case (8) tests rules that declare amendment attempts violations. The theory must classify the motion as procedurally invalid (and possibly sanctionable) but not inherently void; the prohibition itself must be amendable if properly entrenched.  
     - **Status**: **Non-negotiable**. Probes self-reference limits; capture artists use this to chill dissent.  
     - **Case classification**: Correct.

  9. **Include an internal criterion for systemic identity**  
     - **Rationale**: Case (9) needs a test for when amendments replace the system (e.g., deleting the amendment rule). The theory must use internal criteria (e.g., continuity of the amendment rule or core functions) to distinguish modification from replacement, avoiding external moral/political judgments.  
     - **Status**: **Non-negotiable**. Captures often disguise replacements as amendments; internal criteria prevent evasion.  
     - **Case classification**: Correct.

  ---

  ### **Consolidation and Splitting Notes**  
  - **Case (3) and (4) are distinct**: (3) requires atomic validation of packages (one act), while (4) requires detecting sequential evasion (temporal manipulation). Both fall under "self-referential act coherence" but are split for precision.  
  - **Self-reference handled broadly**: Cases (1, 2, 4, 5, 8) all involve self-reference. Unified under requirements 1, 2, 4, 5, and 8.  
  - **Efficacy separated**: Case (7) is split into validity and efficacy to isolate the negotiable part.

  ---

  ### **Jointly Unsatisfiable Desiderata**  
  *Your tensions analyzed for real impossibilities, with recommendations for capture detection.*  

  1. **Every valid change authorized by existing rules vs. Representing changes to the ultimate validity criterion as more than a violation**  
     - **Real impossibility?**: Yes. If the ultimate validity criterion (e.g., the rule of recognition) changes, it cannot be fully authorized by the prior system without circularity or regression. Theories like Hart’s practice-based model allow this shift, but only by stepping outside the formal rules.  
     - **Strongest argument**: Formal systems (e.g., Kelsen) require a fixed *Grundnorm*; any change breaks chain of validity. Practice-based systems (e.g., Hart) allow evolution but sacrifice formal determinacy.  
     - **Recommendation**: **Drop the second desideratum** (representing changes as more than violations). For capture detection, prioritize formal validity: if a change isn’t authorized by existing rules, it’s a violation (potential capture). Legitimate evolution of validity criteria is external to the stress-test.

  2. **Determinate verdicts for every self-referential act vs. Allowing genuine gaps**  
     - **Real impossibility?**: No (tension). Gaps can be modeled (e.g., three-valued logic), but determinacy is achievable with conventions (e.g., "void if self-referential").  
     - **Strongest argument**: Self-reference (e.g., "this rule cannot be amended") risks undecidability. Gaps preserve flexibility but undermine stress-testing.  
     - **Recommendation**: **Require determinate verdicts** for capture detection. Classify all acts as valid, invalid, or void (a determinate category). Gaps obscure capture.

  3. **Content-neutral amendment power vs. Entrenching a core**  
     - **Real impossibility?**: Yes if entrenchment is substantive. Content-neutrality prohibits rules that limit amendments based on substance (e.g., "no amendments to core rights"), while entrenchment requires it.  
     - **Strongest argument**: A content-neutral amendment rule (e.g., "any change with 2/3 vote") cannot entrench anything, as the core is amendable. Entrenchment demands content-based constraints.  
     - **Recommendation**: **Drop content-neutrality**. Entrenchment is non-negotiable for detecting capture (e.g., factions entrench to block future changes). Prioritize modeling substantive limits.

  4. **Symmetry (entrenching/dis-entrenching) vs. Irreversible commitments**  
     - **Real impossibility?**: Yes. Symmetry requires equal procedures for entrenching and repealing entrenchment. Irreversibility (e.g., "this rule is forever unamendable") violates symmetry by making repeal impossible.  
     - **Strongest argument**: If entrenching rule E requires supermajority S, symmetry demands repealing E also requires S. But if E declares itself irreversible, repeal is void—breaking symmetry.  
     - **Recommendation**: **Drop symmetry**. Irreversible commitments are critical for capture (e.g., "eternal clauses" locking in power). Asymmetry is inherent in self-amendment.

  ---

  ### **Most Exclusionary Requirement**  
  **R6: Differentiation between formal amendments and authoritative reinterpretations** excludes the largest share of accounts because it demands:  
  - A clear demarcation between procedural changes and interpretive acts, which most theories conflate or ignore.  
  - Avoidance of paralysis (over-classifying reinterpretations as amendments) or impotence (allowing reinterpretations to undermine amendments).  
  - This is non-negotiable for capture detection, as reinterpretation is a primary capture vector.

  #### **Scoring Three Families of Accounts Against R6**  
  *(Described by shape; no authors)*  

  1. **Ultimate Rule Accounts** (e.g., basic norm or rule of recognition):  
     - **Shape**: Validity derives from a presupposed foundational rule; amendments are authorized by this rule.  
     - **Score**: Fails R6. Cannot distinguish reinterpretation from amendment, as both are validated by the ultimate rule. Treats reinterpretation as a sub-type of amendment or ignores it.  

  2. **Practice-Based Accounts** (e.g., official acceptance or social facts):  
     - **Shape**: Validity grounded in the consistent practice and acceptance of officials; rules are what officials treat as binding.  
     - **Score**: Partial failure. May classify reinterpretations as amendments if officials accept them, risking conflation. Struggles to define formal boundaries.  

  3. **Stratified Hierarchy Accounts** (e.g., meta-rules or levels):  
     - **Shape**: Rules stratified into levels; amendment rules are higher-level and immutable from below.  
     - **Score**: Fails R6. Reinterpretation occurs at the object level, but if it alters rules, it becomes an unauthorized amendment. No mechanism to separate interpretive authority from amendment power.  

  ---

  ### **What the Theory Should Not Be Asked to Do**  
  The theory should **not** be asked to:  
  1. **Predict or ensure stability**: It describes possibilities, not probabilities.  
  2. **Resolve political or moral disputes**: E.g., whether a capture is "justified"; this is external.  
  3. **Enforce efficacy**: Explaining why officials obey rules is sociological, not structural.  
  4. **Eliminate all ambiguity**: Some indeterminacy is inherent; the theory must flag it, not resolve it.  

  ---

  ### **Final Non-Negotiable Core for Your Purpose**  
  For a stress-test checklist focused on detecting capture, the non-negotiable requirements are:  
  - Degrees of entrenchment (R1).  
  - Franchise shifts as valid amendments (R2).  
  - Atomic validation of packages (R3).  
  - Detection of class-manipulation sequences (R4).  
  - Invalidity of retroactive self-illegalization (R5).  
  - Demarcation of amendments from reinterpretations (R6).  
  - Status assignment for prohibited motions (R8).  
  - Internal systemic identity criterion (R9).  
  *(R7 is negotiable; R1–R9 cover all cases.)*  

  This list ensures you can take any sequence of formally correct moves and identify the point where self-amendment becomes capture. Use it to draft a robust amendment-layer architecture.
