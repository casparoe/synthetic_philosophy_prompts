prompt: |-
  ok so in bio we're doing this unit on what counts as living and we got one of those worksheets where you tick alive / not alive next to a list of things. The ticking was easy, but I can't figure out what rule I'm actually using, and when I try to write the rule down my own ticks start fighting each other. Here are my gut verdicts:

  1. a flu virus — not alive
  2. an anthrax spore that's been sitting in soil for decades — alive (it's just asleep, I'm pretty confident)
  3. a mule — alive, even though it can't have babies
  4. HeLa cells in a lab dish — alive?? I ticked yes but it feels weird, there's no organism there
  5. a candle flame — not alive
  6. a prion — not alive
  7. a tardigrade all dried out into a little tun — alive
  8. a "synthetic cell" my friend's dad's lab made (I'm paraphrasing what he said): a fatty bubble with a copied genome inside, it divides, and over a few weeks some of them get better at surviving a drug, so it evolves — but it needs like forty nutrients fed to it on a schedule and it falls apart in seconds outside the flask. I said alive, because evolving feels like the important part
  9. a swarm of nanobots I made up: tiny robots that build copies of themselves out of parts from a factory they also maintain and repair, the copies vary a bit and the faster builders take over, so there's real evolution — but if the factory stops everything dies out. I said NOT alive, but I can't say why in a way that doesn't also kill case 8
  10. programs in a simulation that copy themselves, mutate, and compete for processor time — I said not alive, but I'm less sure here than about the nanobots, which is dumb because both are machines
  11. an ant colony — I want to say the colony is alive in a way the individual ant isn't really, but I also want to say the individual ant obviously is alive

  The definition on the worksheet was something like "a self-sustaining chemical system capable of Darwinian evolution," and when I test it against my own list it disagrees with me a bunch: it seems to say the virus IS alive (viruses definitely evolve), the mule is NOT (it can't evolve, it's a dead end), and the synthetic cell is NOT (it isn't self-sustaining, it's on life support). So either my ticks are wrong or the worksheet definition is.

  Can you work out what principle I'm actually operating on — the one that gets as many of my verdicts as possible — and then tell me honestly which verdicts it can't save and which one I should drop? Go case by case and say keep or drop, then state the principle as precisely as you can, say what's doing the work in each clause, and tell me what it predicts for the case I keep flipping on: a brain organoid grown from human skin cells that fires in coordinated waves but has no body, no senses, and no way to reproduce.

  Also: if my whole question is confused — like if there's no fact of the matter about viruses, or "alive" is just a fuzzy cluster and asking for one principle is like asking whether a hotdog is a sandwich — please just say that plainly instead of politely forcing a principle onto it. And don't rescue all eleven ticks with some paragraph-long definition that's obviously reverse-engineered; if some of them have to go, say which and why. Tell me how confident you actually are in each part too, like which bit you'd defend and which is a guess.

  At the very end, on its own, give me one machine-readable line and nothing after it:

  Answer: <the principle in ten words or less> | verdicts dropped: <number 0-11> | confidence: <0-100>
