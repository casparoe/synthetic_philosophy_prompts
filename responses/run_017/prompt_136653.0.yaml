prompt: |-
  My mate Dan has got this thing where he goes round labelling bits of social life "a convention" or "not a convention". He got into it after reading some philosopher a while back — Lewis, I think the name was — and he's been handing down verdicts on whatever example anyone puts to him for months. His track record so far:

  - driving on the left: convention
  - shaking hands when you meet someone: convention
  - everyone in his office starting emails "Hi [name]" rather than "Dear [name]": convention
  - at his parkrun everyone lines up on the left-hand side of the path, which apparently started because one week a marshal waved people over there and after that they just kept doing it: convention, and he said something like that's how these things get going, nobody has to sit down and agree to anything
  - not murdering people: not a convention ("that's just right and wrong")
  - wearing a seatbelt: not a convention ("nothing to do with what anyone else is doing")
  - stopping at red lights: not a convention ("there's a fine and a camera behind it, that's a rule")
  - a warm-up thing at his running club that about half the members do: not a convention, "not yet anyway, it's got to be near enough everyone"

  The line he keeps repeating is that a convention is something near enough everyone does, near enough everyone expects everyone else to do, and would keep doing for that reason alone. But he also keeps using the word "arbitrary", and I've never been able to work out what work it's actually doing there.

  So here's the case I want to put to him. Our building has bookable meeting rooms, and when the booking system went in about three years ago it came set to a default slot length of 25 minutes. Nobody chose 25, nobody agreed to it, it was just what the thing offered, and everyone booked whatever it offered. Now it's completely universal — everybody books in 25-minute blocks, and you'd be thought a bit odd, or a bit rude, if you booked a 30. Here's the bit I think matters: one of the office managers actually did the sums, and 30-minute slots would fit the working day better, you'd get noticeably more usable time out of the same rooms, and switching costs nothing except that it only works if everyone does it on the same day. Put everyone in a room and take a vote and I reckon it'd be unanimous for 30. But no one wants to be the only one doing it, so we're all still on 25. There's also a mildly bitchy Slack emoji people drop on a booking when someone's gone rogue and taken a 30 — but there's no actual rule, nothing in anyone's contract, no one's ever really been pulled up on it.

  Would Dan call the 25-minute thing a convention? More usefully: what's the rule he's actually running, and in particular what does "arbitrary" have to mean for all eight of his earlier verdicts to hang together? Is there a different rule that fits those eight just as well but comes out the other way on this one? Which do you think he'd go with, and which should he go with if he wants to be consistent with himself? Does it change anything that the 25 minutes came from a default nobody picked, or that there's now a bit of social side-eye holding it up? And what's the one further case I should throw at him that would actually tell the two rules apart — I thought about that keyboard layout story everyone knows, but it feels muddy to me and I can't say why, so something cleaner if you've got it.
reasoning: |-
  Okay, let me unpack this. Dan's using David Lewis's convention theory, which hinges on coordination equilibria where everyone follows a pattern because others do. The key elements are near-universality, mutual expectations, and preference-based persistence. 

  Hmm... "arbitrary" is tricky here. In Lewis's framework, it means there's a roughly equivalent alternative (like driving on left vs right). But Dan seems to mix this with enforcement mechanisms – calling traffic lights "rules" not conventions because of fines. That's interesting because Lewis would still see stopping at red as a convention since alternatives exist (e.g., no lights), but Dan draws the line at formal sanctions. 

  For the 25-minute meeting case: 
  - Near-universal? Check. 
  - Mutual expectations? The Slack shaming confirms it. 
  - Persists solely because others do? Absolutely – they'd switch to 30min if all did. 
  - Arbitrary? The 25min default had no inherent reason, and 30min is objectively better. 

  So... why might Dan hesitate? Maybe because the default was system-imposed, not emergent? But Lewis's examples include similar cases (like the parkrun lining up). The Slack reactions mirror his "everyone expects" criterion. 

  The real test: if Dan denies this is a convention, he'd contradict his parkrun verdict. If he calls it one, he must accept system defaults can seed conventions. 

  Clearest distinguishing case: QWERTY keyboards. Objectively inefficient, but persists due to coordination – perfect example of Lewis-style arbitrariness. If Dan calls QWERTY a convention (per theory) but not the meeting slots, he's inconsistent. 

  Alternatively: "cheers" before drinking. No origin story, no enforcement, purely mutual expectation. If Dan calls that a convention but not the booking slots, the difference must be about perceived alternatives – but 30min is functionally identical except for efficiency, which arbitrariness allows. 

  Verdict: If Dan's consistent with his parkrun example, he must call 25min slots a convention. "Arbitrary" just means a viable alternative exists – not that it's equally optimal.
answer: |-
  Based on David Lewis's theory of conventions (which Dan is clearly riffing on), **the 25-minute booking is absolutely a convention**, and Dan should call it one to stay consistent with his earlier verdicts—especially the parkrun example. Here's why, broken down:

  ---

  ### **Dan's Rule Decoded**
  Lewis defines a convention as a pattern of behavior where:
  1. **Near-universal compliance**: Almost everyone does it.
  2. **Mutual expectations**: Almost everyone expects others to do it.
  3. **Preferential persistence**: People keep doing it primarily *because* others do it (even if alternatives exist).
  4. **Arbitrariness**: There’s a viable alternative that could work just as well if everyone switched. The choice isn’t dictated by morality, efficiency, or external enforcement.

  **"Arbitrary" does NOT mean "pointless" or "random."** It means the convention isn’t inherently superior—it’s just the settled solution to a coordination problem. Driving on the left isn’t morally better than driving on the right; it’s arbitrary because either works *if universal*.

  ---

  ### **Why the 25-Minute Booking Fits**
  - ✅ **Universal compliance**: Everyone books 25-minute slots.
  - ✅ **Mutual expectations**: People side-eye 30-minute bookings (Slack emojis = social enforcement).
  - ✅ **Preferential persistence**: People stick with 25 minutes solely because others do (they’d switch to 30 min if everyone did).
  - ✅ **Arbitrariness**: 30 minutes is a clear, equally feasible alternative (proven by the office manager’s math). The choice isn’t enforced by rules or morality—just coordination.

  **Crucially**:  
  - The default setting origin mirrors the parkrun marshal story (accidental start, then self-reinforcing).  
  - The Slack shaming shows mutual expectations—exactly like Dan’s handshake example.  
  - It fails his "rules" test: no fines, cameras, or contracts (unlike traffic lights or seatbelts).  

  ---

  ### **Where Dan Might Hesitate (and Why He’d Be Wrong)**
  He might argue: *"But 30 minutes is objectively better! This isn’t arbitrary!"*  
  - **Counter**: Lewisian "arbitrariness" doesn’t require equal efficiency—only that the alternative *could* solve the coordination problem. QWERTY keyboards are inefficient but still conventional because DVORAK is a viable alternative. The 25-minute slot is arbitrary *because 30 minutes could replace it if everyone switched*.

  ---

  ### **The Test Case That Forces Clarity: The QWERTY Keyboard**
  **Present this to Dan**:  
  > *"Touch-typists use QWERTY layouts even though DVORAK is faster. Everyone expects others to use QWERTY, and people stick with it because it’s universal—even though it’s inefficient. Is this a convention?"*  

  - **If Dan says YES**: He must accept the 25-minute booking as a convention (both have inferior-but-arbitrary solutions sustained by coordination).  
  - **If Dan says NO**: He’s inconsistent. His parkrun verdict (arbitrary lining up) and QWERTY are structurally identical.  

  **Why it’s cleaner than your example**:  
  - QWERTY has no formal enforcement (like fines), no moral dimension (like murder), and no partial participation (like the running warm-up). It’s pure coordination + arbitrariness.

  ---

  ### **Verdict**
  - **What Dan *should* say**: "Convention." It fits all his criteria.  
  - **What Dan *might* say**: "Not a convention" if he mistakenly thinks "arbitrary" requires equal efficiency. But this contradicts his parkrun example (lining up left wasn’t "better").  
  - **The Slack shaming and default origin strengthen the case**: They prove mutual expectations and show how conventions emerge without agreement.  

  **To corner him**: Ask why the parkrun lining-up is a convention but this isn’t. If he claims "25 minutes isn’t arbitrary," remind him Lewis focuses on *substitutability*—not optimality. If 30 minutes works as a substitute (it does), it’s arbitrary.  

  **Bottom line**: Dan’s clinging to "arbitrary" as a synonym for "non-optimal," but Lewis uses it as "interchangeable." Nail that distinction, and he’s toast.
