answer: |-
  ### 1. Essay Question  
  **"In Verraine, Fuller’s eight principles of legality appear satisfied. Does this mean the criminal code is substantively legitimate? Critically evaluate whether this system exposes a flaw in Fuller’s theory of law’s ‘inner morality’, or whether it vindicates Hart’s separation of law and morals. Your answer must address the significance of the code’s unchanging nature and its religious-provision clause."**  
  *(Answer in 45 minutes. Marks out of 20.)*  
  **Footnote:** Fuller’s eight principles require that law be: (1) general, (2) promulgated, (3) non-retroactive, (4) clear, (5) non-contradictory, (6) possible to obey, (7) constant through time, and (8) congruent with official action.

  ---

  ### 2. Model Answer (836 words)  
  Verraine’s criminal code formally satisfies Lon Fuller’s eight procedural principles. Yet this compliance is superficial, exposing a fundamental flaw in his theory: the *form* of legality cannot guarantee law’s moral legitimacy when the "enterprise of subjecting human conduct to the governance of rules" lacks **reciprocity** – a continuous, purposive relationship between lawgiver and subject. While Hart’s separation thesis correctly identifies Verraine as *legally valid*, this system demonstrates that Fuller’s principles, detached from an ongoing institutional commitment, fail to imbue law with substantive legitimacy.  

  Fuller’s "inner morality" is not merely a checklist but an aspirational framework predicated on **mutual responsibility**. Lawmakers must maintain a dialogue with citizens, adjusting rules to social needs and justifying their authority through fidelity to procedural fairness. In Verraine, the selectors’ permanent dispersal fractures this reciprocity. They impose static, unamendable rules immune to societal feedback, reducing Fuller’s principles to a mechanical ritual. The code’s clarity and consistency are hollow because subjects cannot challenge its content or anticipate revision – violating the *spirit* of Fuller’s demand for congruence between rules and practice. Hart would rightly note that Verraine’s code meets his criteria for a legal system: primary rules (prohibitions) are unified, generally obeyed, and secondary rules (of adjudication) ensure consistent court application. Yet this formal validity underscores Hart’s point: law’s existence is separate from moral critique. The religious-provision clause – persecuting minority faiths – is morally odious but legally unproblematic for Hart. Fuller, however, must explain why a system that ticks his eight boxes still facilitates tyranny.  

  The strongest Fullerian reply is that the eight principles *are* satisfied, so Verraine’s code *is* legitimate by his standards. Fuller might argue that promulgation six months early and independent verification of clarity/compliance fulfil his reciprocity requirement *procedurally*. However, this misreads Fuller’s core purpose: his "morality" is teleological, demanding law as a collaborative project. Verraine’s "five-year autocracy" denies this. Law is inert, not "enterprising"; subjects endure rules crafted by anonymous, unaccountable architects who face no consequences for their design. This nullifies Fuller’s claim that adherence to the eight principles naturally inclines law toward justice. Verraine proves that procedural rigour without institutional continuity creates despotic potential – a flaw Hart’s theory anticipates.  

  This structural defect differs radically from the substantive injustice of the religious clause. The latter is a *moral* failing independent of legal form: a majoritarian violation of equality, addressable through political protest or human rights frameworks. The *procedural* flaw, however, is distinctively *legal*: it corrupts law’s function as a framework for social coexistence. A system where lawmakers evade enduring responsibility cannot foster the fidelity to law Fuller deemed essential. Even if the religious clause were removed, Verraine’s frozen code would still undermine citizens’ capacity to plan lives around stable expectations – a key Fullerian virtue.  

  Hart’s separation thesis emerges vindicated, but not unscathed. Verraine confirms that law’s validity hinges on social practice, not morality. Yet it also reveals a blind spot in Hart: his focus on law’s *existence* overlooks how institutional design affects law’s *moral potential*. Fuller correctly insists law must be more than "orders backed by threats," but Verraine shows his eight principles alone cannot secure this. The system’s true failure lies in negating law’s role as a dynamic, participatory institution.  

  Thus, Verraine exposes a flaw in Fuller’s theory: satisfying the eight principles is necessary but insufficient for legitimacy without ongoing reciprocity. It simultaneously affirms Hart’s separation of law and morals while highlighting why that separation feels ethically inadequate. The deeper lesson is that law’s legitimacy depends not on static procedures but on whether institutions sustain a living covenant between power and those it governs.  

  *(Word count: 836)*  

  ---

  ### 3. Marking Scheme (Total: 20 marks)  
  **Must-hit moves:**  
  1. **Identify reciprocity as Fuller’s unstated core** (5 marks).  
     *Common error:* Listing the eight principles without analysing their purposive role.  
  2. **Explain why static law breaks Fuller’s enterprise** (4 marks).  
     *Common error:* Noting no amendment exists but missing how this voids law-subject dialogue.  
  3. **Counter Hart’s likely rebuttal (validity ≠ morality)** (4 marks).  
     *Common error:* Conflating Hart’s "minimum content" with moral validation of Verraine.  
  4. **Distinguish structural (no reciprocity) vs. substantive (religious clause) flaws** (4 marks).  
     *Common error:* Equating the religious ban with Fuller’s procedural critique.  
  5. **Take a defended stance** (3 marks).  
     *Common error:* "Balanced" summary without concluding which theorist Verraine challenges more.  

  ---

  ### 4. Differentiation & Non-Credit Moves  
  **First-class (18–20) vs. Upper-second (15–17):**  
  A **first-class answer** *synthesises* the reciprocity critique into Fuller’s purpose, uses Verraine to *reinterpret* the Hart-Fuller debate (e.g., "Their dispute was about law’s ontology, not just validity"), and frames the religious clause to *illuminate* the structure/substance divide. An **upper-second** identifies all elements but lacks this conceptual fusion, e.g., treating reciprocity as an "additional point" rather than Fuller’s implicit foundation.  

  **Non-credit moves (even if well-written):**  
  - Reciting the separation thesis without applying it to Verraine’s institutional design.  
  - Listing Fuller’s eight principles with definitions.  
  - Calling the religious clause "against Fuller’s morality" without distinguishing procedural/material.  
  - Suggesting Verraine fails because selectors are "undemocratic" (Fuller/Hart focus on legality, not democracy).  
  - Arguing the code is "immoral therefore invalid" (misrepresents both theorists).  

  —  
  This mock exam forces engagement beyond restatement by: (1) providing Fuller’s principles to neutralise rote memorisation, (2) centring an original case where form/function diverge, and (3) demanding a verdict on the theories’ coherence. The religious clause tests if candidates can isolate procedural legitimacy from substantive justice – a core skill in jurisprudence. British English conventions (e.g., "practise" [verb], "legitimise", double quotation marks) are followed throughout.
