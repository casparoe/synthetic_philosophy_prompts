  ### Procedure for Assessing Interpretive Transparency in Museum Texts  
  **Version 1.0**  
  *Purpose: To identify where interpretation is presented as uncontested fact, using practical historiography tools. Writers need no theoretical expertise. Time: ≤2 hours per text.*  

  ---

  #### **Core Principles**  
  1. **Keep your distinctions**:  
     - **Sentence-level tagging** (retained, simplified):  
       - **Source-Anchored (SA)**: Directly verifiable from sources (e.g., "The factory opened in 1843").  
       - **Frame-Dependent (FD)**: Relies on an interpretive framework (e.g., "The factory revolutionised local industry").  
       - **Narrative-Collateral (NC)**: True but gains meaning from an unstated narrative (e.g., "The factory’s success paved the way for prosperity").  
     - **Particle audit** (retained, expanded): Flag words imposing narrative shape (*still, already, finally, only, began to, thus, inevitably, despite, yet*).  
  2. **Dropped distinctions**:  
     - No explicit engagement with Ranke/Carr/White. The procedure assumes **Carr is broadly correct** (facts are selected/ordered by present concerns) and **White is relevant** (narrative forms impose meaning), but writers need not cite theory.  
  3. **Assumptions**:  
     - SA sentences exist (contra radical constructivism), but FD/NC sentences *must not be presented as SA*.  
     - Community liaisons adjudicate **values**; writers handle **evidence**.  

  ---

  #### **Step-by-Step Procedure**  
  *(All steps applied sentence-by-sentence)*  

  1. **TAG EACH SENTENCE** (20 mins):  
     - **SA**: If the sentence is directly sourced (dates, names, events) and makes no interpretive claim.  
     - **FD**: If the sentence depends on a framework (e.g., progress/decline, hero/villain, cause/consequence).  
     - **NC**: If the sentence implies a story arc (e.g., foreshadowing, resolution, inevitability) without evidence.  
     - *Unsure? Default to FD.*  

  2. **PARTICLE AUDIT** (15 mins):  
     - Circle all particles (*finally, only, began to*, etc.).  
     - For each circled particle, ask: *Does this imply a narrative not in the sources?* If yes, tag the sentence **FD** or **NC**.  

  3. **REVERSIBILITY TEST** (30 mins):  
     - For **FD/NC** sentences, ask: *Could an equally source-compatible sentence with the* ***opposite valence*** *be written?*  
       - *Example*: "The model village improved workers’ lives" (positive) vs. "The model village controlled workers’ lives" (negative).  
     - **Outcomes**:  
       - **Yes** → Sentence is interpretive; proceed to Step 4.  
       - **No** → Sentence may be SA; verify sources. If sources conflict, tag **FD** and proceed.  

  4. **DECISION RULES** (45 mins):  
     - **Revise sentence** if:  
       - It is **FD/NC** *and* reversible (Step 3 = Yes) *and* presented as fact (no qualifiers like "some argue").  
       - It contains **particles** that inject unchecked narrative (e.g., "finally" implying resolution).  
       - *Action*: Rewrite as SA, add a qualifier ("Many historians believe..."), or delete particles.  
     - **Refer to community liaison** if:  
       - The reversibility test reveals a **values conflict** (e.g., moral judgments, contested terms like "improvement").  
       - The text concerns a **living community** (per museum policy).  
     - **Approve sentence** if:  
       - It is **SA** with no particles, *or*  
       - It is **FD/NC** but uses explicit qualifiers ("Scholars debate...").  

  5. **STOPPING RULES**:  
     - **Stop with "NO"** (text rejected for revision) if:  
       - ≥3 sentences fail Step 4 (requiring revision/referral) in a single panel/script.  
     - **Hand to liaison** if:  
       - ≥1 sentence triggers a values-based referral (Step 4).  

  ---

  #### **Test Runs**  
  **Text 1: Donor-Funded Panel on Victorian Manufacturer**  
  - *Sample sentence*: "John Smith’s model village was a beacon of welfare, lifting workers from poverty."  
    - **Tag**: FD (framed as altruistic "beacon of welfare").  
    - **Particle audit**: None.  
    - **Reversibility**: Yes (opposite: "The model village entrenched paternalistic control").  
    - **Decision**: **Revise** (FD + reversible + no qualifier).  
      - *Rewrite*: "John Smith’s model village provided housing and schools. Some historians view this as welfare; others emphasise its social control."  
  - *Verdict*: **NO** (Panel requires revision. Donor interests don’t override interpretive transparency).  

  **Text 2: Audio-Guide Script ("The pit finally reopened after the strike")**  
  - **Tag**: NC ("finally" implies narrative closure).  
  - **Particle audit**: "finally" (suggests resolution/relief).  
  - **Reversibility**: Yes (opposite: "The pit reopened amid unresolved tensions after the strike").  
  - **Decision**: **Revise** (Remove particle or add context).  
    - *Rewrite*: "The pit reopened in [month/year] after the strike."  
  - *Verdict*: Approved post-revision.  

  **Text 3: School Timeline ("The Age of Improvement, 1780–1840")**  
  - **Tag**: FD (framed as unproblematic "improvement").  
  - **Particle audit**: None.  
  - **Reversibility**: Yes (opposite: "The Age of Exploitation" or "The Age of Contradiction").  
  - **Decision**: **Refer to liaison** (Values conflict: "improvement" privileges elite perspectives; ignores child labour/inequality).  
  - *Verdict*: Liaison must approve alternative framing (e.g., "Industrial Transformations, 1780–1840").  

  ---

  #### **What the Procedure Cannot Do**  
  1. **Resolve deep historiography debates** (e.g., Ranke vs. White).  
  2. **Ensure narrative engagement** – removing particles may flatten text.  
  3. **Detect factual errors** – assumes baseline accuracy.  
  4. **Replace specialist review** for high-stakes topics (e.g., colonialism).  
  5. **Fix structural bias** – e.g., a panel solely using "Great Men" framing may pass sentence tests but still distort.  

  ---  
  **Final Note**: This procedure makes interpretation *visible*, not neutral. It prioritises transparency over elegance – as your audio-guide rewrite shows, excising "finally" sacrifices drama for accuracy. Implement with a 1-month pilot, tracking liaison referrals.  

  *Procedure drafted in line with UK Museums Association Code of Ethics (2023), emphasising "honesty and transparency in interpretation".*
