prompt: |-
  I am head of interpretation at a regional museum in the UK, and I personally sign off every piece of public text we produce: exhibition panels (a hard ninety-word limit, no notes or citations, everything must be translatable into Welsh), audio-guide scripts, and school-facing timelines. That is roughly forty panels and six scripts a year, drafted mostly by freelancers with history degrees but no training in historiography, and countersigned by a community liaison where the material concerns a living community.

  What I need is a written procedure one of those writers can run on a text in about two hours. The problem is not factual error. It is that our texts present interpretation as plain fact, and my writers cannot be expected to adjudicate between Ranke's ideal of showing the past as it actually was, Carr's argument that facts reach us already selected and ordered by present concerns, and White's claim that the narrative form itself — emplotment into romance, tragedy, comedy or satire — imposes meaning that no amount of source-fidelity can underwrite.

  Two rough instruments I have been using, which you should keep, revise or discard as the theory requires. First, sentence-level tagging: source-anchored (holds up against the sources independently of what we make of them), frame-dependent (holds only given a framing we could have chosen otherwise), narrative-collateral (true, but drawing its force from a story we would not stand behind). Second, what I call the particle audit: words such as still, already, finally, only, began to, which give a sentence the shape of a story while asserting nothing checkable. Add whatever else the procedure needs — at minimum a reversibility test (could an equally source-compatible sentence of the opposite valence be written?), a rule for where the procedure stops with a no, and a rule for where it hands the decision to the liaison because the question is one of values rather than evidence. Say plainly which of my distinctions must survive the simplification, which you have dropped, and where your procedure simply assumes that Carr or White is wrong.

  Then run it on three texts: a donor-funded panel on a Victorian manufacturer whose model village is the reason we have the collection; an audio-guide script containing the sentence the pit finally reopened after the strike; and a school timeline headed The Age of Improvement, 1780–1840. I expect the first to be the painful one, but do not shape the procedure to spare me — at least one case must come back with an answer I will not like. Close with what the procedure cannot do.

  Please write in British English.
reasoning: |-
  We are creating a procedure for writers to assess interpretive texts for a museum. The goal is to address the presentation of interpretation as fact, considering historiography without requiring writers to be experts in Ranke, Carr, or White.

  The procedure must:
  - Be runnable in about two hours per text.
  - Use or adapt the existing instruments: sentence-level tagging (source-anchored, frame-dependent, narrative-collateral) and particle audit (words like "still", "already", "finally", etc.).
  - Include:
    - A reversibility test: could an equally source-compatible sentence of the opposite valence be written?
    - A rule for when the procedure results in a "no" (meaning the text must be revised).
    - A rule for when the decision is handed to the community liaison (when the issue is about values, not evidence).
  - Be applicable to the three examples provided.

  We will keep the three tags but simplify their definitions for the writers. We will also keep the particle audit.

  The procedure will assume that Carr and White are correct in that facts are selected and narratives are emplotted, so we are not assuming they are wrong. However, we will not require writers to adjudicate between theories. Instead, we focus on practical steps.

  **Procedure Structure:**

  1. **Preparation:** The writer reads the entire text to understand the context.
  2. **Sentence-Level Analysis:** The writer goes through each sentence and:
     a. Tags each sentence as one of: 
        - **Source-Anchored (SA):** The sentence is directly supported by sources and does not depend on a particular framing. It states a fact that is not in dispute and can be verified without interpretation.
        - **Frame-Dependent (FD):** The sentence is true only within a particular interpretive frame that could have been chosen differently. It relies on a perspective or emphasis that is not the only possible one.
        - **Narrative-Collateral (NC):** The sentence is true but gains its significance from being part of a narrative that the museum may not fully endorse. It is often used to create a story arc (e.g., foreshadowing, closure).
     b. Conducts a particle audit: Circle any words that imply a narrative structure without adding factual content (e.g., "still", "already", "finally", "only", "began to", "at last", "thus", "therefore", "inevitably"). These words often introduce an interpretive layer.
  3. **Reversibility Test:** For each sentence that is not SA (i.e., FD or NC) or that contains particles, ask: "Could we write an equally source-compatible sentence with the opposite valence (positive/negative, progressive/regressive, etc.)?" If yes, then the sentence is interpretive and must be flagged.
  4. **Decision Rules:**
     - If a sentence is SA and has no particles, it passes.
     - If a sentence is FD or NC and the reversibility test is positive (i.e., an opposite sentence is possible) AND the issue is about evidence (i.e., there is source ambiguity), then the writer must revise the sentence to either:
          a. Make it SA by removing the framing or narrative, OR
          b. Explicitly signal the interpretation (e.g., by using words like "some historians argue", "from one perspective", "this can be seen as").
     - If the reversibility test reveals that the issue is about values (e.g., what constitutes improvement, moral judgments) rather than evidence, then the writer must hand the sentence to the community liaison for review.
     - Any sentence with particles that are not necessary for factual accuracy must be revised to remove them or rephrased to be more neutral, unless they are part of a direct quote or a clearly marked interpretation.
  5. **Stopping Rule:** The procedure stops with a "no" (meaning the text must be revised) if:
     - Any sentence that is not SA and fails the reversibility test (i.e., the opposite is not source-compatible) but is presented as fact. This would be a factual error and requires correction.
     - However, note: the problem is not factual error, so we are more concerned with interpretation presented as fact. Thus, the main issue is when FD or NC sentences are not flagged as interpretive and cannot be justified as the only possible interpretation (i.e., reversibility test positive). In such cases, the text must be revised.

     The procedure stops with a referral to the liaison when the reversibility test indicates that the issue is about values (e.g., the word "improvement" in the timeline, or a moral judgment about a historical event) and the sentence cannot be rewritten without the value-laden term.

  **What Distinctions Survive:**
  - We keep the three tags (SA, FD, NC) but simplify their definitions for clarity.
  - We keep the particle audit.

  **What is Dropped:**
  - We do not require the writer to engage with the theoretical underpinnings (Ranke, Carr, White). The procedure is practical.

  **Assumptions about Theory:**
  - We assume Carr is correct: facts are selected and framed. Therefore, we are on the lookout for framing that is presented as the only truth.
  - We assume White is correct: narrative forms impose meaning. Hence, we audit for particles and narrative structures and require that they be either justified or marked as interpretive.

  **Running the Procedure on the Examples:**

  1. **Donor-funded panel on a Victorian manufacturer:**
     - Context: The manufacturer built a model village which is the reason for the museum's collection. There might be a tendency to present him in a positive light.
     - Example sentence: "John Smith was a visionary who transformed the lives of his workers with his model village."
     - Analysis:
          - Tag: FD (because "visionary" and "transformed ... lives" are positive framings that could be contested; one might focus on paternalism or control).
          - Particle audit: None in this example, but words like "visionary" are value-laden.
          - Reversibility test: Yes, we could write: "John Smith's model village, while providing better housing, was also a means of controlling workers' lives." Both are source-compatible (if sources show both aspects).
          - Since the reversibility test is positive and the issue is about values (how we judge the manufacturer), the writer would refer this to the community liaison. The liaison might decide to keep the positive framing (due to donor interests) but then we must balance it with other perspectives or mark it as an interpretation.

  2. **Audio-guide script: "The pit finally reopened after the strike."**
     - Analysis:
          - Tag: NC (the word "finally" implies a narrative of resolution after a struggle, which may not be the only way to see it).
          - Particle audit: "finally" is a particle that adds narrative meaning (closure).
          - Reversibility test: We could write: "The pit reopened after the strike." (neutral) or even "The pit reopened after the strike, though tensions remained." (opposite valence). The original implies relief or resolution, which is not the only interpretation.
          - Since the reversibility test is positive (an opposite or neutral version is possible) and the issue is about narrative framing (not values per se), the writer should revise to remove "finally" or rephrase to be neutral.

  3. **School timeline: "The Age of Improvement, 1780–1840"**
     - Analysis: This is a heading, so we treat it as a sentence.
          - Tag: FD (the term "Age of Improvement" is a framing that implies progress and positive change, which is a perspective; it could be contested by those who focus on negative aspects like exploitation, poverty, etc.).
          - Particle audit: None in the heading, but the entire title is a frame.
          - Reversibility test: Yes, we could write: "The Age of Contradiction, 1780–1840" or "The Industrial Revolution, 1780–1840" (neutral) or even "The Age of Exploitation, 1780–1840". All are source-compatible depending on emphasis.
          - Since the reversibility test is positive and the framing is value-laden (what counts as improvement? for whom?), the writer must hand this to the community liaison. The liaison would decide if the museum wants to use this established term (with its positive connotations) or choose a more neutral one.

  **What the Procedure Cannot Do:**
  - It cannot eliminate interpretation entirely; it can only make it explicit and open.
  - It cannot resolve deep historiographical disputes; it flags them for review.
  - It does not address the aesthetic or engaging qualities of the text; it focuses on transparency of interpretation.
  - It does not cover factual errors (though if found, they must be corrected).
  - It may not be able to resolve all issues of values; the liaison's role is crucial for community-sensitive topics.

  **Final Procedure Document:**

  ---

  **Procedure for Assessing Interpretive Texts in Museum Exhibits**

  **Purpose:** To ensure that interpretive content (exhibition panels, audio guides, timelines) does not present contested interpretations as undisputed facts, and to flag value-laden language for community review.

  **Time Estimate:** About 2 hours per text (e.g., one panel, one script, one timeline).

  **Steps:**

  1. **Read the entire text** to understand its context and argument.
  2. **Sentence-by-sentence analysis:**
     - For each sentence, assign one of the following tags:
          - **Source-Anchored (SA):** The sentence states a fact that is directly supported by sources and is not subject to significant interpretation. It is generally non-controversial and verifiable. (E.g., "The factory opened in 1850.")
          - **Frame-Dependent (FD):** The sentence is true only within a particular interpretive frame that could have been chosen differently. (E.g., "The factory's opening marked the dawn of a new era of prosperity.") 
          - **Narrative-Collateral (NC):** The sentence is factually true but gains its meaning from a narrative structure that the museum may not fully endorse. (E.g., "After years of struggle, the factory finally opened.")
     - **Particle audit:** Underline or circle any words that impose a narrative or evaluative tone without adding factual content. Common particles: still, already, finally, only, began to, at last, thus, therefore, inevitably, unfortunately, of course, naturally, etc.
  3. **Reversibility test:** For each sentence tagged FD or NC, or containing particles, ask: "Could we write an equally source-compatible sentence that conveys a different valence (positive/negative, progressive/regressive, etc.) or is neutral?" 
     - If the answer is yes, then the sentence is interpretive and requires attention.
  4. **Decision and actions:**
     - If a sentence is SA and has no particles, it passes.
     - If a sentence is FD or NC and the reversibility test is positive (opposite is possible), then:
          - If the issue is about evidence (i.e., the sources allow multiple interpretations), then the writer must revise the sentence to either:
               a. Make it SA (by removing the framing or narrative), OR
               b. Explicitly mark the interpretation (e.g., by adding "some historians believe", "from one perspective", "arguably").
          - If the issue is about values (e.g., moral judgments, terms that imply a positive/negative view of a group or event), then the writer must refer the sentence to the community liaison.
     - For particles: Revise the sentence to remove the particle unless it is in a direct quote. If removal changes the meaning, consider if the narrative implication is necessary and if so, mark it as interpretive (e.g., by rephrasing to show it is an interpretation).
     - If the reversibility test is negative (i.e., the opposite is not source-compatible), then the sentence may be SA and can stay, but ensure it is not using particles to imply a narrative. If it is, remove the particles.
  5. **Stopping rules:**
     - The text must be revised (procedure stops with a "no" for that sentence) if:
          - A sentence is not SA and is presented as fact without marking the interpretation (after reversibility test shows it is interpretive).
          - A sentence contains particles that cannot be justified as SA and are not marked as interpretive.
     - Refer to the community liaison when:
          - The reversibility test reveals a values-based issue that cannot be resolved by rewording without losing the intended meaning, and the sentence is essential to the text.

  **After the Procedure:** The writer revises the text accordingly and sends any flagged sentences to the liaison. The revised text is then reviewed by the head of interpretation (you) for final approval.

  ---

  **Note on the Three Examples:**
  - The donor panel example would likely have multiple FD and NC sentences and would require substantial revision or liaison input.
  - The audio-guide sentence would be revised to remove "finally".
  - The timeline heading would be referred to the liaison for a decision on the framing.

  **Closing:**
  The procedure cannot make the text value-free, but it can make the interpretive choices visible and subject to review. It also cannot replace the need for historical expertise in drafting, but it provides a systematic check for the most common issues of interpretation presented as fact.
