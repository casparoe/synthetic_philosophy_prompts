answer: |-
  Here’s the exam question, model answer (700 words), and detailed marking scheme you requested. The question uses your core cases but reshapes them into a cohesive narrative to force engagement with the non-epistemic stakes.

  ---

  **FINAL EXAM QUESTION: AESTHETICS OF AUTHENTICITY**  
  *(Answer in 900-1000 words. 45 minutes advised.)*

  **Background:** Advances in replication technology now allow the creation of *perfect facsimiles* of physical artworks: atomically identical duplicates, verified beyond any possible doubt to match the original’s material composition, visible surface, and internal structure (e.g., brushwork layers, craquelure, pentimenti). Assume all epistemic concerns about detecting differences are eliminated.  

  **Cases:**  
  1. **The Swap:** The National Gallery replaces its sole Rembrandt self-portrait with a perfect facsimile. The original is stored in an inaccessible, climate-controlled vault. No one (visitors, curators, scientists) can detect the substitution. The Gallery posts a small label: "Facsimile on display; original archived." Later, they perform the same swap on a Van Gogh *Sunflowers* but omit the label.  
  2. **The Restoration Revelation:** Technical analysis reveals that roughly 65% of the paint surface of Titian’s *Bacchus and Ariadne* was applied by 19th-century restorers. The wood panel and underdrawing are original; the figures’ skin tones, drapery, and sky are largely restoration.  
  3. **The Contented Collector:** An art lover purchases a certified perfect facsimile of a minor Picasso drawing at 1% of the original’s market price. She displays it proudly, telling all guests it’s a facsimile. She gains the aesthetic experience she desired. Years later, the original Picasso (now in a private vault) is accidentally destroyed. The public never learns of its destruction; the facsimile remains.  

  **Question:**  
  Do these cases demonstrate that the special significance we accord to "originals" is *entirely* reducible to: (a) epistemic limitations (fear of deception), (b) economic/provenance concerns, or (c) fetishism? If not, **what non-epistemic value is lost in the Swap cases (considering both labeled and unlabeled variants), and who loses it?** Does the Restoration Revelation undermine or support the existence of this value? Finally, does the Contented Collector’s satisfaction and the unnoticed destruction of the Picasso prove the value is illusory, or does it persist? Defend a clear position by precisely distinguishing at least **three distinct kinds of value** potentially at stake (e.g., historical, testimonial, ritual), and explain whether any loss is a loss *to a person*.

  ---

  **MODEL ANSWER (700 words)**  

  The cases reveal that the value of originals transcends epistemic worries, provenance, or fetishism. While deception and provenance powerfully shape *market* and *experiential* value, a distinct **testimonial value** inherent to the original object persists even under perfect replication. This value is lost in the Swap, not inherently by individuals, but by the collective historical record. The Restoration and Collector cases complicate but do not eliminate it.  

  **Three Kinds of Value:**  
  1.  **Aesthetic Value:** Derived from perceptible properties (colour, composition). Facsimiles preserve this perfectly under the stipulation.  
  2.  **Provenance Value:** Economic/symbolic worth tied to lineage, rarity, and authorship. This is context-dependent and transferable (e.g., the labeled Swap retains provenance value via the sign).  
  3.  **Testimonial Value:** The object’s unique status as a *witness* to a specific historical moment, creative act, and chain of human custody. This is irreducibly tied to the spatio-temporal particularity of the original object.  

  **The Swap: Loss and Loser**  
  In the *labeled* Swap, aesthetic and provenance value remain intact. Viewers experience the artwork’s form and know they engage with Rembrandt’s legacy via the label. However, **testimonial value is lost**. The object on display did not bear witness to Rembrandt’s hand, his studio, or centuries of viewing. It cannot testify to that history. This loss isn’t *felt* by any individual viewer (they get the same experience), nor is it an epistemic loss (they know the truth). The loss is to the **historical record itself**. The authentic witness is silenced in the vault. The *unlabeled* Swap compounds this by adding deception, corrupting the record actively (a lie enters the object’s history), but the core testimonial loss occurred with the physical substitution.  

  **Restoration Revelation: Challenge and Nuance**  
  The Titian case seems to undermine testimonial value: if most paint is restoration, is it still a "witness" to Titian? Not purely. However, it supports the *category* of testimonial value by revealing its complexity. The panel *does* testify to Titian’s workshop (the support, underdrawing). The 19th-century paint testifies to restoration practices and historical interpretations of Titian. The object’s value lies in being a *palimpsest of testimony* – a physical record of multiple historical interactions. A facsimile of its *current state* captures the aesthetic palimpsest but not the genuine historical layering. The original, even heavily restored, retains unique testimonial integrity as the *locus* of those interventions.  

  **The Contented Collector and the Destroyed Picasso**  
  The Collector’s satisfaction shows aesthetic and personal provenance value are met. The unnoticed destruction seems to suggest testimonial value vanishes without subjective loss. This is mistaken. Testimonial value is **non-experiential** and **objective**. The Picasso drawing was a unique witness to Picasso’s creative act in a specific time/place. Its destruction severs a thread in the historical fabric *even if no one knows*. The facsimile is a perfect representation, but it is not *that witness*. It testifies only to the replication technology and the moment of scanning. The loss is real – the erasure of a unique historical nexus – but it is a loss **to history/culture**, not necessarily to a feeling individual.  

  **Conclusion**  
  The cases confirm that the "aura" of the original is not mere mystification. Beyond aesthetics and market value, **testimonial value** – an object’s irreplaceable status as a material witness to its own history – persists. The Swap loses this value for the displayed object (a loss to the historical record), Restoration reveals its layered nature, and the Collector/Destruction case shows its objective reality persists independent of subjective experience or knowledge. While individuals may not *feel* this loss directly, it represents a genuine impoverishment of our collective connection to the past.

  ---

  **MARKING SCHEME (Out of 20)**  
  **Must-hit points:**  

  1.  **Distinguishes ≥3 Types of Value Clearly (4 marks):**  
      *   Must explicitly name, define, and distinguish aesthetic, provenance/economic, and at least one non-epistemic candidate (e.g., testimonial, historical, ritual, uniqueness-based).  
      *   *Common Error:* Conflating "value" vaguely; only distinguishing epistemic vs. non-epistemic without specifying non-epistemic kinds; omitting provenance.  

  2.  **Cleanly Separates Epistemic Concerns (4 marks):**  
      *   Must explicitly state epistemic doubts are eliminated by the stipulation and argue the relevant losses persist *without* relying on "we might be fooled" or "it might be imperfect."  
      *   *Common Error/Wriggle:* Reintroducing doubt (e.g., "can we *really* know it's perfect?"); arguing the loss is *only* about deception (especially in the unlabeled Swap) without addressing the labeled Swap.  

  3.  **Identifies the Non-Epistemic Loss & Its "Recipient" in Swap/Destruction (5 marks):**  
      *   Must articulate a specific loss (e.g., testimonial/historical connection, unique causal history) present in the Swap (both labeled and unlabeled) and the Destruction case.  
      *   Must explicitly address *who/what* loses it (e.g., "the historical record," "culture," "humanity," "not individuals perceiving the facsimile").  
      *   *Common Error:* Claiming the loss is *only* to deceived individuals (ignores labeled Swap/Destruction); vague statements like "it just *is* lost" without specifying the nature of loss or beneficiary.  

  4.  **Engages Restoration & Collector Cases to Refine/Test the Position (4 marks):**  
      *   Must use Restoration to either challenge the position (showing value is layered) or refine it (distinguishing types of testimony). Must reconcile Contented Collector/Destruction with the proposed loss (e.g., loss is objective, non-experiential).  
      *   *Common Error:* Ignoring these cases; dismissing Restoration as "not the original" without nuance; arguing Collector/Destruction proves no loss occurs.  

  5.  **Clarity, Structure, Precision (3 marks):**  
      *   Logical flow, precise terminology, avoids waffle, stays within scope.  

  **A vs. B Answer:**  
  *   **A (17-20):** **Explicitly grapples with the tension in the Restoration Case.** Successfully argues that while Restoration complicates "pure" authorship, it *reinforces* the core argument by demonstrating the object's value as a unique palimpsest of historical testimony, which a facsimile cannot replicate even if materially identical *now*. Makes a clear, nuanced concession about its challenge while defending the core non-epistemic value. Also explicitly states the loss is *not* typically felt by individuals but is objective/cultural.  
  *   **B (13-16):** Identifies a non-epistemic loss and separates it from epistemic concerns effectively. Distinguishes value types. Addresses all cases adequately but might lack the nuanced treatment of Restoration (e.g., calls it a problem but doesn't integrate it deeply to strengthen the argument) or be slightly less precise on the "loss to whom" point (e.g., says "society" without clarifying it's not an aggregate of individual experiences).

  **Note on Case Rigging:**  
  The **Certainty Stipulation** effectively blocks epistemic wriggling. The **Restoration Case** is the most potent challenge *to* the model answer position. A top-tier answer *must* confront it head-on, not dismiss it. It's rigged to force nuance, not to dictate a single answer. A strong student *could* argue Restoration fatally undermines "testimonial value" if defined simplistically as authorial touch, but they would need to propose an equally robust non-epistemic alternative (e.g., "continuous historical objecthood") that survives the swap and destruction cases. The **Contented Collector/Destruction** combo is rigged against *subjectivist* accounts – if value requires being experienced, this case seems to show no loss. Only an objective account of value (like testimonial/historical) survives it cleanly.

  This setup forces students to isolate the non-epistemic core, defend it against your designed counter-cases, and articulate precisely *what* and *for whom* the loss occurs when the original is displaced or destroyed under perfect replication. Good luck with the marking!
