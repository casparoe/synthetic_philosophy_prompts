answer: |-
  Your analysis cuts to the bone of the Newcomb debate, and your variants are surgical tools. Neither isolates a *new* disagreement, but both expose the fracture lines in the existing one. The core dispute *is* about what decision theory is for—but it's entangled with semantics, underdetermination, and bedrock intuitions. Let's diagnose step by step, engaging your positions.

  ### Your Hypothesis: The Core Divide (Normative vs. Procedural)
  You're fundamentally correct. The fracture is between:
  - **Normative Decision Theory (NDT)**: Addressed to an agent *at the moment of choice*, asking: "What should *I* do *now*, given my actual causal powers?"  
  - **Procedural Decision Theory (PDT)**: Addressed to a designer of agents/processes, asking: "What *general rule* should govern systems facing this *type* of situation?"  

  **Why this explains the stalemate**:  
  - **Two-boxers** (dominance) are NDT-purists. They insist that rationality must respect *actual causal levers*: "The prediction is fixed; my choice now can't alter it. Dominance is inviolable." Any other consideration (e.g., "what if I were the *type* who one-boxes?") is irrelevant to *this* agent *now*.  
  - **One-boxers** are implicitly PDT-oriented. They evaluate acts *as outputs of a procedure*: "If I run a procedure that outputs one-boxing in *this structure*, I get rich." They see NDT as myopic in problems where the act *correlates* with a prior state.  
  - **Logical/Functional DT** is explicitly PDT. It doesn't care about "what I should do now"; it cares about "what procedure, when run, yields the best outcome across all worlds where it's deployed."  

  Your variants test this hypothesis.  

  ---

  ### Variant 1: The Amnesiac Series  
  **What it isolates**:  
  - Strips away *all* causal, reputational, or learning effects. Each round is causally isolated.  
  - Forces the question: "Does PDT survive without *any* training, signaling, or self-modification?"  

  **Where it bites**:  
  - **Against NDT (two-boxing)**: It highlights the *absurdity of consistent poverty*. If you two-box every round, you *know* you'll end with ~$1M, while one-boxing yields ~$1B. NDT must call rational a strategy guaranteeing 1000x less money. This is a direct challenge: "How can rationality demand impoverishment?"  
  - **For PDT (one-boxing)**: It shows that PDT doesn't need "causal influence." The correlation between *being a one-boxing-type* and getting rich holds acausally. "Be the type" is a procedural stance, not a causal one.  

  **Where it fails to bite**:  
  - **NDT is unmoved**. Its reply: "In *each* round, the $1M is already fixed. Choosing one box *this time* doesn't cause past predictions to be better. Poverty is regrettable, but rationality is about *this choice*, not aggregate regret." The amnesiac series just repeats the original problem—it doesn't resolve it.  
  - **It doesn't bridge the gap**. NDT rejects the very framing of "aggregate acausal success." It insists rationality is moment-indexed and causal.  

  **Diagnostic insight**: This variant confirms your hypothesis. It shows PDT can thrive without causality, but NDT dismisses PDT's success as irrelevant to *rational action now*.  

  ---

  ### Variant 2: The Sealed Simulation  
  **What it isolates**:  
  - Demystifies the predictor. No free will, no "spooky" backward causation.  
  - Reveals the correlation as *acausal identity*: Your choice and the simulation's are outputs of the *same process*.  

  **Where it bites**:  
  - **Eliminates underdetermination (your point *b*)**. The causal structure is explicit: Your choice doesn't *cause* the box's state, but both are determined by your prior state. This forces the debate onto semantics and norms.  
  - **Neutralizes counterfactual skepticism (your point *a*)**. In a deterministic world, subjunctive conditionals *are* well-defined: "If I took both boxes, the simulation (which is *me*) would have taken both, so the opaque box is empty." Causal DT's machinery applies cleanly, with no regress.  
  - **Challenges NDT**: If the simulation is *you*, then choosing one box isn't "wishing the past were different"—it's acting consistently with how the *prior you* acted to get the $1M. Two-boxing becomes a bizarre self-sabotage: "I know my simulation-self one-boxed, but I'll two-box anyway."  

  **Where it fails to bite**:  
  - **NDT still insists on dominance**: "The box is *already full or empty*. Taking both boxes adds $1000 regardless. My choice *now* doesn't change the simulation's past output."  
  - **PDT still insists on correlation**: "Agents *like me* (running my decision process) who one-box get $1M; those who two-box get $1000. Why would I run a process that spites its past self?"  
  - **No side shifts ground**. The dispute isn't about *how* the prediction works—it's about what counts as a reason for action.  

  **Diagnostic insight**: This variant confirms the dispute is *not* about metaphysics or free will. It's about whether rationality should ignore correlations that aren't causal (NDT) or embrace them as practically decisive (PDT).  

  ---

  ### The Mix of Disagreements  
  1. **Substantive clash of questions** (your hypothesis): 60% of the dispute. NDT and PDT answer different questions.  
  2. **Clash of standards for "reasons"**: 30%. NDT demands *causal efficacy*; PDT accepts *correlative evidence* (even acausal) as pragmatically sufficient.  
  3. **Bedrock intuitions**: 10%. Some find dominance *viscerally* compelling; others find willful poverty *obviously* irrational. No argument moves them.  
  4. **Semantic undercurrents** (counterfactuals): Resolved by sealed simulation. Once demystified, counterfactuals are uncontroversial.  

  ### What Would Count as Progress?  
  - **Not a formal result**: Newcomb's is a *paradox*—logically consistent paths lead to opposing conclusions. No theorem will break the symmetry.  
  - **Not empirical facts**: How agents are simulated (your variant 2) clarifies but doesn't resolve the normative clash.  
  - **A decisive distinction**: Progress lies in **framing the question explicitly as NDT vs. PDT**. We should ask:  
    - To the NDT camp: *Why should an agent care only about causal levers when acausal correlations guarantee ruin?*  
    - To the PDT camp: *Why call it "rational action" if the agent's choice doesn't causally influence the outcome?*  
  - **Reformulation**: Treat Newcomb's as a **litmus test for what decision theory is optimizing**:  
    - NDT optimizes *local causal responsibility*.  
    - PDT optimizes *global empirical success*.  
    Admitting this dissolves accusations of "incomprehensibility"—each side sees the other's priority.  

  ### Why No Resolution Is Likely  
  Rationality is not a unified target. NDT prioritizes **control** ("I did what was causally best *now*"); PDT prioritizes **results** ("I got what was best *overall*"). This is a philosophical schism—like deontology vs. consequentialism in ethics. Your variants sharpen the divide but can't force consensus because:  
  - **NDT won't abandon control**: To accept one-boxing is to let "rational action" be hostage to acausal correlations.  
  - **PDT won't abandon results**: To accept two-boxing is to let "rationality" endorse guaranteed poverty.  

  The deadlock persists because each side defends a coherent, irreconcilable standard. Progress isn't resolution—it's mapping the schism clearly, as your variants and hypothesis do. Newcomb's remains a Rorschach test: What you see reveals what you think decision theory *is*. 

  If forced to bet: The rise of AI (where designers *explicitly* choose procedures) will make PDT increasingly intuitive. But for human agents facing the boxes *now*, NDT will retain its grip. Your diagnosis is the closest to truth: **The dispute is about purpose, not proof**.
