  First, I need to understand the user's perspective. They seem deeply familiar with the philosophical landscape, citing a 2020 survey and various arguments. Their frustration is palpable—they mention fifty years of stagnation. This isn't someone looking for a basic explanation; they want a diagnostic deep dive. Their variants are clever attempts to isolate the disagreement, and they’re self-aware about their own biases (e.g., "my own hypothesis"). 

