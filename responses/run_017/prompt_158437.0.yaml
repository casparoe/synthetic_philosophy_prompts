  Their hypothesis feels strongest: the camps are answering different questions. Normative theorists (two-boxers) ask: "What should *I* do *now*?" Procedural designers (one-boxers) ask: "What rule should govern agents like me?" The variants support this—amnesiac series is pure procedural test; sealed simulation eliminates distractions. 

