prompt: |-
  hi — I'm doing a third-year module on truth at the moment (we've done the equivalence schema and the liar, now we're on whether truth is a real property at all) and I've got 2500 words to write on what a deflationary account would have to deliver to be taken seriously. Before I start scoring theories I want the spec. So: write me the desiderata list for an adequate deflationary theory of truth — what such a theory has to be able to do, with the case or consideration behind each requirement — and mark which ones you think are genuine requirements and which are just what one camp happens to want.

  Since adequacy depends what it's for: the two jobs I need truth to do are (a) work inside a compositional semantics, so I can get from the truth of the parts to the truth of the whole and handle a language with infinitely many sentences, and (b) underwrite the claim in my epistemology essay that belief aims at truth. That's it — I don't care about explaining the success of science or anything like that.

  The cases I keep getting stuck on, which I want requirements attached to:

  - the archive blurb: a publisher prints "everything in this box is true, including the letters in the language we've only half deciphered". They can't expand it into a conjunction because they don't know what's in there, and they can't fully translate it either.
  - the handover note: "everything my predecessor told you is true, and so is anything that follows from it". The second conjunct seems to need truth to travel down logical consequence, which feels like it wants a substantive property doing the transmitting — I can't tell if that's a requirement or a prejudice.
  - the recanting memo: "some of the claims in this memo are false, though I can't yet say wich". A blind ascription of falsity to your own current commitments.
  - the weather model: everyone wants to say the new model is roughly true, or closer to the truth than the old one, and I don't see how degrees come out of something thin.
  - the soup: "it's true that the soup is delicious", where the disagreement looks faultless. Does truth have to behave the same way there as it does for the soup's temperature, or is it allowed to fragment by domain?

  Things I defintely want flagged rather than just listed: (1) whether any two of the desiderata can't be had together — I suspect "capture every instance of the schema" and "stay classically consistent and non-trivial" are already in tension via the liar, but I want a pair that's a problem specifically for the deflationist rather than for everyone; (2) the scope worry — if going minimal is fine for truth, why can't I go minimal about "is morally wrong" or "is a reason for action"? Is having an answer there a real requirement, or a trap the inflationists set? (3) whether being conservative over the object language is a desideratum or just a symptom of taking the disquotational picture seriously; (4) which single requirement does the most work in knocking candidates out.

  Then, briefly — a table is fine, don't sprawl, this isn't the part I'm marked on — score the minimalist story, the correspondence/inflationary one, warranted-assertibility type views, and truth pluralism against the list. I'll fill in references myself.

  One last thing: is "it has to actually be saying something, not just shrugging" a real desideratum or is that just my tutor's mood?
