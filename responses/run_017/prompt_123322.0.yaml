  For the desiderata list: I'll structure each with the requirement, the case driving it, and mark if it's genuine or contested. Genuine ones should directly tie to their two jobs for truth. Cases like the archive blurb challenge the theory's ability to handle blind ascriptions without full understanding. The handover note tests truth's role in logical consequence—is needing a substantive property here a real demand or a bias? The recanting memo involves self-referential falsity claims, which might be a general liar-like problem. The weather model and soup example probe if deflationism can handle approximate truth and domain-specific truth behaviors.

