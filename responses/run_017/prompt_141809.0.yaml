  What to refuse: Don’t dive into relativism or the sociology of scientific knowledge. State upfront that the session is about recognizing structure, not solving all interpretation issues. For assessment, the unseen passage task must require identifying the outcome-driven spine, not just spotting loaded terms. A text that frames the optical ether debate as inevitable with subtle cues.

  Need to structure the session tightly: hook, core concepts, deep example, group work, assessment. Keep transitions crisp. The "hindsight filter" should come after the visceral example but before the case study. Make sure the group activity forces them to rewrite a Whig paragraph to remove the teleology, not just add context.
