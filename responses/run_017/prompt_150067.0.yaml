prompt: |-
  Writing a novel about an art forger and I keep tripping over something I don't have a word for. My guy forges a minor 1920s painter, gets caught, and here's the bit I can't get right: after the confession the pictures are worth nearly nothing, but honest copies in that painter's manner — good ones, signed by the copyist, sold as exactly what they are — go for real money. Same eyes, same skill, same wall. So the collapse isn't about how the thing looks, and it isn't about anyone still being fooled, because nobody is. Its not just rarity either: canvases sold as "school of", or with the authorship left open, do fine at a discount. It's definately specific to the ones that have been found out — those go to zero and stay there even though everyone now knows precisely what they are.

  And then the second half, which is the part that actually interests me: the same exposed picture will sometimes fetch more than the forger's own signed work, because it has a story attached. You're not looking at a painting, you're looking at the painting that duped the experts. My dealer character calls it the confession discount, which is too cute and doesn't cover that bit anyway.

  Someone told me philosophers talk about a "perfect fake" — two looking-identical paintings, wildly different value — but that puzzle is set before anyone finds out, and mine starts after. So: is there a name for the loss that disclosure can't repair, and for the small premium that creeps back afterwards? And if there's a literature, don't just hand me a title to stick in the acknowledgements. I want to know what is supposed to have gone wrong with the object itself — whether it's the lie, or the copying, or an achievement being credited to the wrong person — and what any of that amounts to in the case where nobody ever finds out. Bonus: does it carry over to a forged manuscript, where the words are identical and the paper was never the point?
reasoning: |-
  Okay, the user is writing a novel about an art forger and is struggling with a specific concept. They describe a scenario where forged paintings, once exposed, lose almost all their value, even though they look identical to the originals. Honest copies by the same forger, signed as such, still sell for decent prices. The user is looking for a term or concept to describe this phenomenon—the irreversible loss in value due to disclosure and the slight premium that comes from the painting's notoriety. 

  First, I need to unpack the core issue. The user mentions that after confession, the forged works become nearly worthless, while the forger's honest copies retain value. Even "school of" attributions hold some worth. The drop isn't about aesthetics or rarity; it's tied specifically to the exposed forgery. Then, there's a twist: sometimes the exposed forgery gains a premium because of its story, being the painting that fooled experts. The user's term "confession discount" doesn't cover this nuance.

  The user wants to know if there's a name for this loss and the subsequent premium. They also seek an explanation of why the object itself is devalued—whether it's the lie, the copying, or misattribution—and how this applies when the forgery is never discovered. They also ask if this applies to manuscripts where the content is identical, but the medium (paper) wasn't the point.

  Hmm, the key here is the concept of authenticity and provenance. In art, value isn't just about the physical object but its history and legitimacy. When a forgery is exposed, it loses its provenance. The narrative tied to the work collapses. The object transforms from a genuine piece with a history to a fake, which carries a stigma. Even though it looks the same, its identity is fundamentally altered. That explains the initial drop to near zero. 

  The slight premium from notoriety is different. Here, the story of the forgery itself becomes the value. It's no longer about the art but the object's role in a scandal. This is similar to how crime memorabilia or historical artifacts gain value from their stories. So, the same object now has a new narrative, shifting from artistic merit to infamy.

  For the philosophical angle, the "perfect fake" problem deals with undiscovered forgeries. Once exposed, the issue moves into sociology and economics. The devaluation is about the collapse of cultural capital. The art market relies on trust and provenance, so a revealed forgery breaks that trust, making it worthless as art but potentially valuable as a curiosity.

  For manuscripts, the same principles apply. If the content is forged, the value drops because the authorship is false. However, if the manuscript's story of forgery becomes famous, it might gain value as a historical artifact, like the Hitler Diaries. The content's authenticity matters less than the narrative around the forgery itself.

  The user's deeper need seems to be understanding the underlying reasons to accurately portray their characters and the art world dynamics. They might also want thematic depth, exploring ideas of authenticity, value, and identity. Providing terms like "provenance collapse" or "notoriety premium" could help, but explaining the concepts will add richness to their narrative. They might also be interested in the tension between art's aesthetic value versus its historical legitimacy, which could be a central theme in their novel.
answer: |-
  You've nailed a fascinating paradox at the heart of art valuation – one that exposes the messy blend of aesthetics, history, sociology, and economics. Philosophers *do* talk about "perfect fakes" (Danto, Goodman), but you're right, that's pre-discovery. Your scenario is post-discovery, where the *narrative* shifts catastrophically, and that's where the real-world art market kicks in. There isn't one perfect term, but let's break it down:

  1.  **The Collapse (The Near-Zero Value):**
      *   **Core Problem:** It's the annihilation of **provenance-as-authenticity**. The object hasn't changed physically, but its *identity* and *place in history* have been obliterated.
      *   **Why it Collapses:**
          *   **Loss of Cultural Capital:** The painting was valued as a node in an artist's life, oeuvre, and historical moment. That connection is severed. It's no longer "a Minorvitch from his Blue Period," it's "a clever fake pretending to be that." Its cultural significance evaporates.
          *   **Symbol of Failure:** It embodies the failure of experts, collectors, and the market itself. Owning it is a constant reminder of being duped (or the system being duped). It carries stigma.
          *   **Broken Trust Chain:** Provenance relies on trust. A known forgery poisons the chain. Future sales are haunted by doubt, even if *this specific* lie is known.
          *   **Economic Reality:** Its *only* market was as a genuine Minorvitch. That market vanishes instantly. The pool of buyers who want a *known fake* is tiny compared to those who wanted a *genuine Minorvitch*.
      *   **The Best Term:** **Provenance Collapse** or **Authenticity Annihilation**. Less formally, dealers might call it **"burned"** or **"tainted."** The value hasn't just been discounted; the foundational reason for its original value has been destroyed. It's not a Minorvitch anymore, and the market for "exposed forgeries of Minorvitch" is minuscule.

  2.  **The Creeping Premium (The Story Value):**
      *   **Core Reason:** The object accrues **Notoriety Value** or **Infamy Premium**. It's no longer valued as art (in the aesthetic/historical sense) but as a **cultural artifact** or **historical curiosity**.
      *   **Why it Creeps Back:**
          *   **The Story Supersedes the Art:** The narrative of "the forgery that fooled the Met" becomes more compelling than the painting itself. It becomes a piece of art *world* history.
          *   **Rarity of Scandal:** Famous, high-profile forgeries are rare events. Collectors of the *macabre*, the *curious*, or *art-world ephemera* see value in owning this tangible piece of the story.
          *   **Trophy of Deception:** For some, owning the object signifies possessing the evidence of a brilliant (if illicit) achievement – the forger's skill in duping the system.
      *   **The Best Term:** **Notoriety Premium**, **Infamy Value**, or **Scandal Surcharge**. It's a form of **"Provenance of Deception"** – the history *is* the value now, but it's a completely different history. Think of it like buying the gun used in a famous crime; the value is in the story attached, not the object's intrinsic function.

  **Addressing Your Core Questions:**

  *   **What went wrong with the object itself?** **Nothing physical changed.** What changed was its **ontological status**. Its identity shifted from "a Minorvitch" to "a fake of a Minorvitch." Its *meaning* and *cultural significance* were destroyed. The lie wasn't just exposed; the *foundation of its value* (its connection to the artist and their history) was revealed to be non-existent. The achievement *was* the deception itself, not the artistic expression it mimicked.
  *   **What if nobody ever finds out?** This is the crux of the "perfect fake" problem. *If* the deception is perfect and eternal:
      *   **Philosophically:** Some argue the fake *becomes* the real thing in terms of aesthetic experience and cultural function (Arthur Danto's "Artworld"). The physical object and the experience it provides are identical.
      *   **Practically/Economically:** It *is* the real thing. It functions identically within the art market and cultural history. Its value is sustained by its believed provenance. The "wrongness" only exists if the truth is known. The value resides entirely in the *assumed*, not the actual, history.
  *   **Does it carry over to manuscripts?** **Absolutely.** The principle is identical:
      *   **An exposed forged manuscript:** Loses all value as a work *by that author*. Its historical significance, connection to the author's life/thought, and literary value evaporate. It becomes a curiosity, a fake. (e.g., The "Hitler Diaries" became worthless relics of a hoax).
      *   **The creeping premium:** Could absolutely apply if the forgery was famous enough. The "Hitler Diaries" *as the notorious forgery* have value to historians of hoaxes, WWII memorabilia collectors, or museums of journalism. The *story* of the forgery becomes the value.
      *   **The words are identical?** This hits the "perfect fake" question directly. If the deception is eternal, the manuscript *is* accepted as the author's work. Its value stems entirely from the *belief* in its authenticity. The physical paper might be irrelevant to the literary content, but the *assumed provenance* granting that content its authority and connection to the author is everything.

  **For Your Novel:**

  *   **"Confession Discount"** is actually pretty good for the initial catastrophic drop. It emphasizes the *cause* (the confession).
  *   For the lingering near-zero value, use **"tainted," "burned,"** or have a character articulate **"provenance collapse"**.
  *   For the creeping story-premium, **"notoriety premium"** or **"infamy value"** works. Your dealer might cynically call it the **"Fool's Gold Surcharge"** or **"Scandal Tax."** Or he might muse that **"The lie killed the art, but the story of the lie birthed a new kind of monster."**

  **Why This Matters for Your Story:**

  This isn't just about money; it's about **identity, authenticity, and narrative**. Your forger creates objects whose *meaning* and *value* are entirely dependent on the story told about them. When the story changes from "lost Minorvitch masterpiece" to "brilliant fake," the object undergoes a seismic shift in its very being within the cultural sphere. The "confession discount" is the economic manifestation of an existential crisis for the artwork. The "notoriety premium" is its rebirth as a different kind of cultural object – a testament to deception itself. This tension is *incredibly* rich ground for a novel exploring art, value, truth, and the stories we tell. Good luck!
