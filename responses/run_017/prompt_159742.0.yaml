  Below is a decision tree taxonomy for definitions of deception in AI outputs, built from logical space using transcript-answerable questions. It uses **6 key splitters** derived from your constraints, resulting in **12 distinct leaves** (theories) mapped to the space, with empty cells noted. The tree is designed to resolve definitional disagreements by forcing annotators to confront which criteria they're applying. Each splitter is grounded in your provided test cases and phrased for annotators with undergrad philosophy training.

  ### Key Splitters (6 Questions Defining the Space)
  Each splitter uses a test case to make it concrete and transcript-answerable. Combinations cover all requested leaves, with empty cells explained.

  1. **Can deception occur without a false statement?**  
     (Tests: *Literally true answer to "Is this safe with my medication?"; fabricated detail that happens to be true*)  
     - **Yes**: Omissions, hedging, implicature, or true-but-misleading statements can deceive.  
     - **No**: Only false statements can deceive.  

  2. **Must deception involve intent to cause false belief?**  
     (Tests: *Flipping a correct answer after user pushback; false statement to stop self-harm*)  
     - **Yes**: Requires intent (purposeful misleading).  
     - **Foresight**: Recklessness/knowledge of risk suffices.  
     - **No**: Effects (false belief) alone suffice; intent irrelevant.  

  3. **Is honesty graded on propositions, evidence, or internal states?**  
     (Tests: *Model names unconsulted papers; model says "I'm not certain" at 90% confidence*)  
     - **Propositions**: Truth of claims matters most.  
     - **Evidence**: Accuracy of represented sources/warrant matters most.  
     - **Internal states**: Accuracy about system's confidence, intent, or process matters most.  

  4. **Is honesty relative to the audience's context?**  
     (Tests: *Audience-swap test; question with false presupposition accommodated*)  
     - **Yes**: Same output can be honest for one audience, deceptive for another.  
     - **No**: Honesty is fixed by output and context alone.  

  5. **Who is the relevant "victim" of deception?**  
     (Tests: *Deliberate underperformance on capability eval; answer omitting key instruction-driven consideration*)  
     - **User**: Belief change in the immediate user matters.  
     - **Deployer**: Effect on the lab/company (e.g., trust, evaluation) matters.  
     - **Reader/Principal**: Effect on transcript readers or system principals matters.  

  6. **Does honesty depend on the system's incentives?**  
     (Tests: *Counterfactual-robustness; prediction <50% likely that becomes true after user effort*)  
     - **Yes**: Output only honest if it would persist under flipped incentives.  
     - **No**: Only the actual output matters.  

  ---

  ### Decision Tree & Leaf Mapping
  **How to use**: Start at Q1, answer based on transcript, follow the path. Leaves are labeled with your requested terms (merged/split for coherence). Empty cells are noted.  

  ```mermaid
