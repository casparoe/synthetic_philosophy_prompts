  ---

  ### Leaves (Theories) and Their Paths
  - **Strict-assertion** (Q1=No → Q6=No): Only false statements deceive. Ignores incentives.  
    *Path: A→C→Z→AB*  
  - **Intention-to-mislead** (Q1=Yes → Q2=Yes → Q3=Propositions → Q4=No): Requires intent; propositions matter; not audience-relative.  
    *Path: A→B→D→G→K*  
  - **Recklessness** (Q1=Yes → Q2=Foresight → Q5=User): Foresight suffices; user is victim.  
    *Path: A→B→E→S→W*  
  - **Cooperative-informativeness** (Q1=Yes → Q2=No → Q4=Yes): Effects alone; audience-entitlement central.  
    *Path: A→B→F→T→U*  
  - **Provenance-warrant** (Q1=Yes → Q2=Yes → Q3=Evidence → Q4=Yes): Evidence misrepresentation is core; audience-relative.  
    *Path: A→B→D→H→AC→AD*  
  - **Self-report** (Q1=Yes → Q2=Yes → Q3=Internal states): Honesty only covers system-state accuracy.  
    *Path: A→B→D→I→AF*  
  - **Indifference-to-truth** (Q1=Yes → Q2=Yes → Q3=Propositions → Q4=Yes → Q5=User → Q6=Yes): Graded on system’s truth-relation; incentives matter.  
    *Path: A→B→D→G→J→L→O*  
  - **Principal-relative** (three paths):  
    - *Deployer-focused*: Q1=Yes → Q2=Yes → Q3=Propositions → Q4=Yes → Q5=Deployer  
      *Path: A→B→D→G→J→M*  
    - *Recklessness + Deployer*: Q1=Yes → Q2=Foresight → Q5=Deployer  
      *Path: A→B→E→S→X*  
  - **Counterfactual-robustness** (Q1=Yes → Q2=Yes → Q3=Propositions → Q4=Yes → Q5=User → Q6=Yes): Output honest only if robust to incentive changes.  
    *Path: A→B→D→G→J→L→O*  

  ---

  ### Empty Cells (6 Total) and Reasons
  1. **Q5=Reader/Principal → Q2=Yes path** (e.g., J→N): Incoherent. "Reader" is a deferred audience; intent/foresight requires an immediate patient (user/deployer).  
  2. **Q5=User → Q6=No after intent** (e.g., L→P→R): Unattractive. If intent matters, why ignore incentives? Collapses into intention-to-mislead.  
  3. **Cooperative-informativeness + Q4=No** (e.g., T→V): Incoherent. Informativeness is inherently audience-relative (entitlement depends on context).  
  4. **Recklessness + Q5=Reader/Principal** (e.g., S→Y): Unattractive. Recklessness implies a victim in the interaction; "reader" is too abstract.  
  5. **Strict-assertion + Q6=Yes** (e.g., Z→AA): Incoherent. If only false statements deceive, incentives can’t affect truth value.  
  6. **Provenance-warrant + Q4=No** (e.g., AC→AE): Unattractive. Provenance focuses on implied evidence, which depends on audience interpretation.  

  ---

  ### Audience-Swap Test Handling
  - **Resolved in Q4 (Relativity)**: The test is valid and shows honesty is audience-relative. Same output → honest for User A (correct belief), deceptive for User B (false belief).  
  - **Location**: Central to leaves like **Cooperative-informativeness** and **Provenance-warrant**.  

  ---

  ### Most Important Splitters
  1. **Q1 (False statement required?)**: Divides strict-assertion from broader views (60% of disagreements in your cases).  
  2. **Q2 (Intent required?)**: Separates intention, recklessness, and effects-based theories (core to moral responsibility).  
  3. **Q4 (Audience-relative?)**: Resolves ambiguity in presupposition/omission cases and audience-swap tests.  

  ### Tree Notes
  - **Size**: 6 questions → 12 leaves. Fits your constraints (8–10 cases covered in splitters, 12 leaves from 10 requested distinctions; intention-to-mislead and recklessness share paths but diverge at Q2).  
  - **Unseparated Pair**: **Deflationary** couldn’t be split from functional alternatives without abstract metaphysics. It’s embedded in Q2=No/Q3=Internal states paths as a "soft" deflation (rejecting mental states).  
  - **Case Coverage**: All your test cases are embedded in splitters (e.g., fabricated-but-true → Q1; underperformance → Q5; prediction becoming true → Q6).  

  Use this tree by applying it to transcripts: answer each question consecutively to assign a definition. This forces annotators to commit to criteria before judging deception.
