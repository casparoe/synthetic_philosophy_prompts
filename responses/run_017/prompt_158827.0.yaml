  "tensions": array, ordered most to least severe, each object with keys "commitments" (array of the letters involved, e.g. ["B","F"]), "verdict" ("genuine" or "apparent"), "severity" ("high"/"medium"/"low"; use "none" if apparent), "diagnosis" (2–3 sentences on what exactly breaks), "cheapest_fix" (which commitment gets revised and how, minimally), "cost" (what I lose elsewhere in the set);
  "case_verdicts": array of three objects, one per case above, each with keys "case" ("Dana/Erin", "sister", "boss"), "freedom_status" ("free"/"diminished"/"not free"), "blame_or_credit" (one sentence), "why" (2–3 sentences), "workhorse" (which single commitment is doing the deciding);
  "second_order": a string saying whether rigidity of procedure matters independently of rigidity of output, on my commitments;
  "sphexishness_independent": a string saying whether (B) collapses into (D) or earns its keep;
  "single_revision": object with keys "commitment" (one letter), "revision" (one sentence), "how_much_it_fixes" (one sentence), "residual_problem" (one sentence).
