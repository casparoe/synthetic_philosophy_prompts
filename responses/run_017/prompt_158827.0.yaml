prompt: |-
  So here's the situation. I quit drinking about eight months ago, my sister is further along the same road, and separately I've ended up in a small reading group on free will that started with that old digger-wasp story (I can't remember who first told it, but: the wasp paralyses a cricket, leaves it at the entrance of its burrow, goes inside to inspect the burrow, comes back out and drags the cricket in — and if you move the cricket a few inches while she's inside, she drags it back to the threshold and then goes in to inspect the burrow again, and will keep doing this over and over). The group got attached to the idea that this names a real and distinct phenomenon — rigid, scripted behaviour that has come loose from the point it once served, in degrees — and that "sphexishness" is a genuine way of being unfree, not just a cute metaphor for determinism. I'm presenting my own position to the group next week and I want an audit first, because the pieces feel like they don't all fit and I honestly can't see which one has to go. Here's the set:

  (A) Compatibilism about determinism: causal determination is no threat to responsibility, and responsibility doesn't require the categorical ability to do otherwise.
  (B) Sphexishness is a real, distinct, degreed variety of unfreedom — rigidity plus detachment from the purpose the behaviour once served — and it's doing genuine excusing work, not just re-describing determinism.
  (C) So: a compulsive or addicted agent is less blameworthy (not blameless) to the extent that the mechanism issuing in the action is sphexish.
  (D) But what responsibility really tracks is reasons-responsiveness of the actual mechanism: hold the mechanism fixed, vary the reasons, ask whether the agent would have responded differently had there been sufficient reason to.
  (E) And history matters too: in the covert-manipulation cases I want to blame the agent less even though, at the moment of action, her mechanism is exactly as reasons-responsive as anyone's. So I seem to be a structuralist and a historicist at once.
  (F) Self-imposed rigity is the opposite of unfreedom. My sister has trained herself so that refusing a drink is automatic and inflexible — she can't accept one even to be polite, even where having one would be harmless — and that looks to me like achieved self-command, the paradigm case of freedom, not the wasp.
  (G) I also think ordinary people's beliefs about free will are mostly false (they think they're little uncaused causes; they're not), but I don't want to be a revolutionary about blame, praise and resentment — I want them to keep running roughly as they do.

  Three cases I want the position to deliver verdicts on, because I can't tell what my own view says: (1) Dana and Erin are mechanism-for-mechanism identical at the moment of action — both run a rigid, pointless 40-second handwashing routine triggered by anxiety. Dana's was hypnotically installed in her by a manipulator years ago; Erin built hers deliberately over years of managing her anxiety and still endorses it. Same rigidity, same output, different histories: is one of them acting less freely? (2) My sister's automatic refusal — by (B)+(C) it looks sphexish and freedom-diminishing, by (F) it looks like the height of self-command. (3) My boss, whose decisions are flexible and reasons-responsive but whose deliberative procedure is completely rigid — the same three questions in the same order, always, whatever the situation. Call it a second-order sphex: flexible output, frozen procedure. Free or not?

  What I want is an audit, not a lecture: go through the set, tell me which pairs actually pull against each other and which only look like they do (I'd bet at least one of my "tensions" is fake, so please discriminate rather than flagging everything), order the real ones by severity, and for each say what would minimally have to give and what that costs me elsewhere. Also tell me whether (B) is doing any work at all once I've signed up to (D), or whether it's just an expensive way of restating it. Oh, and whether the second-order sphex case shows that rigidity matters at the level of procedure or only at the level of output.

