  In summary, the step that fails is the rejection of weak discernibility in step (5). The cost is that we must adjust the definition of indiscernibility to properly account for relations between the objects. This does not cost us much; it makes the principle substantive and saves it from the two-sphere counterexample. For coincident duplicates, we may need additional principles, but they are not forced upon us by the two-sphere world.

  So, to answer the author: 

  - The step that fails is the rejection of weak discernibility in step (5).

  - It looked obviously right because the author was thinking that weak discernibility does not provide a monadic property that distinguishes the objects and because they feared triviality. But weak discernibility uses relations and is not trivial.

  - The expression that changes meaning is "indiscernible". The author's definition in the setup is inadequate because it does not consider relations between the two objects. When they say "stand in all the same relations to all the same third objects", they are ignoring the relations between x and y. If we include those relations, then the two-sphere world does not have indiscernible objects.

  Now, pricing the alternatives:

  - Denying the possibility of mirrored worlds: cost is that we have to say that symmetric worlds are impossible, which might be hard to justify, especially in physics. Also, it would require a fundamental asymmetry in the universe.

  - Weak-discernibility reply: cost is that we have to revise the definition of indiscernibility. But it saves the principle and is widely accepted in the literature.

