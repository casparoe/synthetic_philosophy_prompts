  - Biting the bullet at (8): cost is that we lose objectivity in counting.

  Finally, the supervisor's comment on (1): if there are non-qualitative thisness properties, then indeed no nontrivial automorphism would preserve them. But the principle of identity of indiscernibles is a thesis about qualitative properties. If we admit non-qualitative properties, then the principle is not intended to cover them. So, (1) is not question-begging; it is defining the qualitative indiscernibility. The principle survives as a substantive thesis about qualitative properties.

