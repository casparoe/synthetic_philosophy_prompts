  Based on your constraints and goals, here's a detailed activity design that meets your requirements, including contingency plans and debriefing points. The 90-minute session is structured to create an experiential "aha" moment about the FPTP/PR trade-off without explicit naming until the end.

  ---

  ### **Activity: The Assembly Game**
  **Objective:** Experience the tension between representation (mirroring opinions) and decisiveness (producing decisions) through electoral rule experimentation.

  **Materials:**  
  - 20 voter ID cards (cardstock, 4 colors: Red/Blue/Green/Yellow for parties)  
  - 20 secret role cards (envelopes with economic/cultural positions)  
  - 5 district cards (labeled 1-5)  
  - Sticky dots (for voting)  
  - Whiteboard (for tallying)  
  - Pens, envelopes, index cards  

  **Setup:**  
  1. **Fictional Country:** "Harmonia" has 20 citizens (participants) divided along two policy dimensions:  
     - **Economic:** Industrial (I) vs. Ecological (E)  
     - **Cultural:** Traditional (T) vs. Progressive (P)  
     *(Reveal only the economic axis initially; cultural axis remains hidden until Step 4)*  

  2. **Opinion Distribution (Visible):**  
     - Industrial: 8 voters  
     - Ecological: 8 voters  
     - Centrist: 4 voters  
     *(Drawn on whiteboard; no parties named yet)*  

  3. **Hidden Cleavage:**  
     - Cultural axis splits each economic bloc: 4 Traditional (T) + 4 Progressive (P) in both Industrial and Ecological, and Centrists are neutral.  
     - Creates 4 parties:  
       - **Red:** Industrial + Traditional (I-T)  
       - **Blue:** Industrial + Progressive (I-P)  
       - **Green:** Ecological + Traditional (E-T)  
       - **Yellow:** Ecological + Progressive (E-P)  
       - **Centrists (Gray):** Mixed (leaned I/E but culturally neutral)  

  ---

  ### **Procedure (90 Min)**
  #### **1. Constitutional Convention (15 Min)**  
  - **Task:** Choose an electoral rule for Harmonia.  
  - **Options (Presented Neutrally):**  
    - **Rule A:** "District Delegates" (FPTP)  
      - Country divided into 5 districts (4 voters each).  
      - Each district elects 1 delegate by plurality (most votes wins).  
    - **Rule B:** "National Council" (PR)  
      - One nationwide vote.  
      - Seats allocated proportionally (1 seat per 4 votes; remainders by lottery).  
  - **Partial Veil of Ignorance:**  
    - Participants see Harmonia’s economic distribution (I:8, E:8, C:4) but *not* cultural splits or their personal views.  
    - Vote by majority to adopt Rule A or B.  

  #### **2. Role Assignment (5 Min)**  
  - Each participant receives:  
    (a) A **voter ID card** (Red/Blue/Green/Yellow/Gray party, 4 each).  
    (b) A **secret envelope** with their economic + cultural position (e.g., "Industrial-Traditional").  
  - *Do not open envelopes yet.*  

  #### **3. Election 1: Chosen Rule (25 Min)**  
  - Participants open envelopes, learn their party.  
  - **Vote:** Use sticky dots on whiteboard to cast ballots (1 vote per person for their party).  
  - **Count Votes** using the convention’s chosen rule:  
    - **If Rule A (FPTP):**  
      - Assign voters to 5 districts (pre-set to ensure vote-splitting):  
        - *District 1:* 2 Red, 1 Blue, 1 Gray  
        - *District 2:* 2 Green, 1 Yellow, 1 Gray  
        - *District 3:* 2 Blue, 1 Red, 1 Yellow  
        - *District 4:* 2 Yellow, 1 Green, 1 Blue  
        - *District 5:* 2 Red, 2 Green  
      - Winners: Plurality in each district (e.g., Red wins D1 with 2 votes).  
    - **If Rule B (PR):**  
      - Count national votes (each party gets seats = floor(votes/4)).  
      - Remaining seats allocated by lottery (folded index cards drawn from hat).  

  #### **4. Reveal Hidden Cleavage & Payoffs (5 Min)**  
  - Announce cultural axis (Traditional/Progressive), exposing party positions.  
  - **Payoffs:**  
    - 1 point if assembly majority *matches* your economic view.  
    - 1 point if assembly majority *matches* your cultural view.  
    - *(Centrists win both points if no majority exists.)*  
  - Calculate payoffs for Election 1.  

  #### **5. Election 2: Other Rule (20 Min)**  
  - Re-run election with **identical ballots** under the *other* rule.  
  - Repeat seat allocation and payoff calculation.  

  #### **6. Government Formation (PR Only, 10 Min)**  
  - **Only if Rule B (PR) was used in Election 1 or 2:**  
    - Simulate post-election bargaining:  
      - Parties negotiate to form a coalition controlling ≥3 seats.  
      - Coalitions must agree on one economic + one cultural policy.  
    - **Twist:** Gray party (Centrists) becomes "kingmaker" — they join any coalition but demand policy compromise.  
    - **Payoff Adjustment:** Voters lose 1 point if coalition *contradicts* their cultural view.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Both Systems Are Rigged!"**  
     - *Response:* "Note how the same ballots produced different outcomes. Why might that be?" (Redirect to structural factors).  

  2. **Hybrid Rule Demands**  
     - *Response:* "Today we’re isolating two ‘pure’ models. Hybrids exist, but they combine these trade-offs."  

  3. **Strategic Voting Attempts**  
     - *Preempt:* Emphasize "vote your true position" initially. If detected: "Real systems incentivize strategy; here we’re testing baseline fairness."  

  4. **Bargaining Stalemate (PR)**  
     - *Force Decision:* After 5 min, Gray party imposes a compromise.  

  5. **Confusion in PR Calculation**  
     - *Simplify:* Use "1 seat per 4 votes" + lottery for remainders (avoid complex formulas).  

  ---

  ### **Debrief (15 Min)**  
  - **Map Experiences to Concepts:**  
    | **Moment in Activity**       | **Real-World Analog**                          |  
    |------------------------------|-----------------------------------------------|  
    | FPTP: Bloc loses despite vote share | Vote-splitting (e.g., US 2000 Nader effect) |  
    | PR: Post-election bargaining | Coalition governments (e.g., Germany/Israel) |  
    | Hidden cleavage changing outcomes | Emerging issues (e.g., climate realigning voters) |  

  - **What the Design Leaves Out:**  
    - **Long-term Adaptation:** Voters/parties don’t adjust strategies over time (e.g., Duverger’s Law).  
    - **Thresholds/District Magnitude:** No minimum vote thresholds (e.g., Germany’s 5%) or variable district sizes.  
    - **Institutional Inertia:** Doesn’t explain why reform is rare (incumbent advantage).  
    - **Supply these in debrief with:** "Rules shape behavior over decades. Today’s snapshot can’t show that adaptation."  

  - **Closing Sentence:**  
    > "Electoral rules aren’t about ‘fairness’ alone; they’re bets about what matters more: **mirroring society’s diversity** or **producing decisive action**—and you rarely get both."  

  ---

  ### **Why This Works**  
  - **Cohesion > Popularity (FPTP):** Industrial/Ecological blocs (8 votes each) split across parties (Red/Blue or Green/Yellow), causing seat losses despite high support.  
  - **Post-Vote Bargaining (PR):** Coalition talks force compromises, hurting cultural purists (e.g., a Traditional voter governed by Progressives).  
  - **Veil of Ignorance Wrinkle:** Choosing rules before knowing cultural positions ensures the cleavage structure is a gamble.  
  - **Fixed Electorate:** Identical ballots in both rules isolate aggregation effects.  

  **Run Time:** 90 min (tight but feasible; cut Government Formation if behind schedule).  
  **Outcome:** Participants *feel* the trade-off, setting up nuanced discussion without partisan triggers.
