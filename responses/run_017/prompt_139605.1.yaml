     Case: A directive written at age 25 states: "I never want to live in a nursing home; I'd rather die." Now at 85, the patient has mild mobility issues but is cognitively intact and says, "I enjoy life in the nursing home and want to stay." 
     A. The directive must be followed; move the patient out of the nursing home even against their current wishes.
     B. The directive expressed an experiential preference (fear of nursing homes) which has changed, so the current preference should be respected.
     C. The directive expressed an enduring value of independence, so it should be followed.

   Question 4:
     Case: A directive says no antibiotics for pneumonia. The patient now has pneumonia and is unconscious. The doctor knows that giving antibiotics would save the patient's life and no one would ever find out if they ignored the directive.
     A. Follow the directive: it represents the patient's prior wishes.
     B. Give the antibiotics: the patient's current welfare is paramount and the directive was written in a different context.
     C. The directive is important as a commitment to the practice of advance care planning; breaking it would undermine the institution even if no one knows.

   Question 5:
     Case: The directive names a daughter as proxy and says no feeding tube. The patient is now unable to eat and is not competent. The daughter, who knows the patient deeply, says, "My mother changed her mind after writing this and told me she now wants a feeding tube if needed."
     A. Follow the directive.
     B. Follow the daughter's current judgment as proxy.
     C. The directive should be used as evidence but the daughter's account of a change of mind is important and should be considered.

   Question 6:
     Case: A directive written while the patient was severely depressed states: "I do not want any life-prolonging treatments." The patient is now recovered, competent, and facing a life-threatening condition. They say, "I was in a dark place then; I want treatment now."
     A. Follow the directive: it was written when competent.
     B. Override the directive: the depression may have impaired their ability to make a true autonomous choice.
     C. The directive is evidence of a past wish but the current wish should prevail.

   Question 7:
     Case: A patient wrote a directive as an atheist: "No religious rituals at my end of life." The patient has since converted to a religion and now (while competent) requests those rituals. The directive has not been updated.
     A. Follow the directive: it was their choice at the time.
     B. Follow the current wishes: the patient's values have fundamentally changed.
     C. The directive is important for maintaining the integrity of advance directives, but religious freedom now should be respected.

   Question 8:
     Case: At 19, a healthy person wrote: "If I ever become paralyzed, I would not want to live." At 30, the person is paralyzed but has adapted and says life is worth living. They now need a routine life-saving treatment and want it.
     A. Follow the directive: it was their authentic choice at 19.
     B. Override the directive: the 19-year-old could not have known what it is like to live with paralysis and the current self does.
     C. The directive expresses an enduring value (avoiding a life of disability) so it should be followed.

   Question 9:
     Case: A directive states: "If I ever get dementia, do not feed me because I don't want to be a burden." The patient now has dementia and is not suffering and enjoys eating. The directive was based on the belief that dementia patients are a burden and don't enjoy life, which the patient now clearly does.
     A. Follow the directive: it was their choice.
     B. Override: the directive was based on false beliefs and the current self is not a burden and enjoys life.
     C. The directive should be interpreted as not wanting to live if they are a burden and not enjoying life; since that's not the case, it doesn't apply.

   Question 10:
     Case: A patient wrote a directive at 40: "If I ever need a ventilator for more than a week, stop treatment." At 60, the patient is fully competent and not impaired, on a ventilator for 10 days, and says: "I changed my mind; I want to continue." 
     A. Follow the directive: it was a commitment and the patient must be held to it.
     B. Follow the current wishes: the patient is competent and has the right to change their mind.
     C. The directive should be considered but the current wish overrides it because they are competent.

   Question 11:
     Case: A patient wrote a detailed directive at 50. At 80, the patient has mild cognitive impairment (not incompetent) but has changed some values. The patient is in a situation covered by the directive but expresses a different preference. The psychological continuity is reduced but not gone.
     A. Follow the directive: it was made when the patient was more fully themselves.
     B. Follow the current preference: the patient is still competent enough to decide.
     C. The directive should be given weight but the current preference matters more because of the reduced continuity.

   Question 12:
     Case: A directive names a spouse as proxy and gives clear instructions. The spouse and the treating team have built a relationship and the spouse feels that the directive no longer fits because of changes in the patient's condition and values expressed in the past year. The patient is not competent.
     A. Follow the directive strictly.
     B. The spouse and the team should make the best decision together, using the directive as a guide but not binding.
     C. The directive is the primary guide, but the spouse can make adjustments if there is clear evidence of a change.

   Scoring:

   For each answer, assign points to the positions as follows:

   Q1:
     A: SPA, CD
     B: EBD, EO, G
     C: RJA

   Q2:
     A: SPA, CD
     B: EBD
     C: EO, G

   Q3:
     A: SPA
     B: EO, G
     C: ECO

   Q4:
     A: SPA
     B: EO
     C: CD

   Q5:
     A: SPA, CD
     B: RJA
     C: EBD, ECO

   Q6:
     A: SPA, CD
     B: EBD
     C: EO, G

   Q7:
     A: SPA, CD
     B: EO, G
     C: CD, RJA   [Note: CD and RJA both get a point for C]

   Q8:
     A: SPA, CD
     B: EBD, EO, G
     C: ECO

   Q9:
     A: SPA, CD
     B: EO
     C: EBD, ECO

   Q10:
     A: SPA, CD
     B: EO, G
     C: EBD, ECO, RJA

   Q11:
     A: SPA, ECO
     B: EO
     C: EBD, G

   Q12:
     A: SPA, CD
     B: RJA
     C: EBD, ECO

   After the respondent completes the quiz, count how many points they have for each position (each time an answer they chose is associated with a position, that position gets one point).

   Then, the position with the highest score is their primary view.

   Tie-breaking rules:

    - If SPA and CD are tied, look at Q4 and Q7: 
          If they chose Q4C, then CD. 
          If they chose Q7C, then CD (or RJA, but we are breaking SPA vs CD).
          Otherwise, SPA.

    - If ECO and EBD are tied, look at Q3 and Q8:
          If they chose Q3C, then ECO.
          If they chose Q8C, then ECO.
          If they chose Q2B, then EBD.
          If they chose Q6B, then EBD.
          If still tied, they are a hybrid.

    - For other ties, we can note the hybrid or use the overall pattern.

   Finally, the one-line awkward commitment for each position:

    SPA: The document must be followed even when it clearly harms the current patient and they (if competent) object.
    ECO: It requires distinguishing critical from experiential interests, which can be contentious and may override current competent wishes if the interest is deemed critical.
    EBD: The document is only presumptive and can be overturned, but the criteria for overturning are not always clear.
    EO: The directive has no special moral force; it is just one piece of evidence, so it might be easily overridden.
    CD: Breaking a directive is like breaking a promise, which harms the institution of advance care planning, even if no one knows.
    RJA: The directive is not binding on its own but is part of an ongoing relational process, which might introduce subjectivity.
    G: The weight of the directive fades gradually with psychological change, but measuring psychological continuity is difficult.

   And the position that the earlier self has full authority over a later fully competent self (as in Q10A) is part of SPA and CD. It is likely rare because it conflicts with the principle of contemporaneous autonomy. It might be seen as incoherent because it treats the past self as having more authority than the present self, or as a necessary feature of commitment devices.

   We also note that ECO and EBD might be hard to distinguish in our quiz. We have two questions (Q3 and Q8) that are unique to ECO, and two (Q2 and Q6) that are more unique to EBD. If we find we still can't pull them apart, we might need an extra question, but we hope the tie-breakers will help.

   For mixed or tied scores: If a respondent has no clear majority, we can say they have a hybrid or case-by-case view. We can also provide the top two or three positions.

   This is a complex scoring system, but it should work for the workshop.
answer: |-
  Below is a 12-question sorting quiz designed to help trainees discover their philosophical stance on advance directives through concrete cases. Each question presents a scenario with three response options, avoiding direct references to philosophical labels. The scoring system maps answer patterns to seven core positions, flags unoccupied combinations, and addresses ties/mixed views.

  ---

  ### **The Advance Directive Sorting Quiz**
  *Answer based on your instinctive ethical response. Choose one option per question.*

  1. **Religious Conversion**  
     A directive written by an atheist at 40 states: "No religious rituals at my end." At 65, after converting to a faith, the patient (competent, unimpaired) requests deathbed rituals.  
     - A. Follow the directive—it was their authentic past choice.  
     - B. Follow current wishes—values fundamentally changed.  
     - C. Uphold the directive to honor commitments, but allow rituals if they cause no harm.  

  2. **Temporary State: Anxiety**  
     A directive written during a panic attack (competent but acutely anxious) refuses CPR. Now calm and competent, the patient requests CPR during a cardiac event.  
     - A. Follow the directive—it was technically competent.  
     - B. Override—temporary states distort judgment; current wishes prevail.  
     - C. Ignore the directive—only current competence matters.  

  3. **Youthful Misjudgment**  
     At 19, a directive states: "Never give me insulin if I get diabetes; I’d rather die." At 30, diabetic but thriving, the patient (competent) requests insulin.  
     - A. Follow the directive—past self decided.  
     - B. Override—younger self couldn’t foresee this life; current welfare matters.  
     - C. Override only if the directive was impulsive, not deeply reasoned.  

  4. **Factual Error**  
     A directive refuses surgery if "cancer spreads to my liver," believing this is untreatable. Now, liver metastases are treatable, and the patient (incompetent) would likely survive.  
     - A. Follow the directive—it captures their intent.  
     - B. Override—new facts make the directive obsolete.  
     - C. Interpret the directive: did they value "avoiding futile suffering" or "no treatment *specifically* for liver mets"?  

  5. **Proxy Disagreement**  
     A directive refuses ventilators and names a sister as proxy. The sister says, "He told me last year he changed his mind." The patient is now incompetent.  
     - A. Follow the document—it’s binding.  
     - B. Follow the proxy—she’s part of a shared decision process.  
     - C. Use the directive as evidence but weigh the proxy’s input heavily.  

  6. **Depression**  
     A directive written during severe depression refuses life-saving antibiotics. Now recovered and competent, the patient requests antibiotics.  
     - A. Follow the directive—competence at writing is what counts.  
     - B. Override—depression undermines authenticity.  
     - C. Current wishes override unless the directive expressed core values.  

  7. **Secrecy Test**  
     A directive refuses dialysis. The patient is unconscious, and dialysis would restore them to a good life. No one would ever know if you ignored the directive.  
     - A. Follow it—it’s their choice.  
     - B. Provide dialysis—welfare outweighs undisclosed autonomy.  
     - C. Follow it—breaking trust in the *system* matters, even secretly.  

  8. **Enduring vs. Experiential**  
     A directive at 50 states: "Never put me in a nursing home; I value independence over survival." At 85, frail but competent, they enjoy the nursing home and want to stay.  
     - A. Move them home—the directive binds.  
     - B. Keep them there—current well-being matters most.  
     - C. Move them only if independence was a *core value*, not a preference.  

  9. **Competent Reversal**  
     A directive at 40 states: "No pacemakers." At 60, fully competent and informed, they request one.  
     - A. Refuse—they committed in advance.  
     - B. Provide it—competent now can override then.  
     - C. Provide it—unless the directive was a "commitment device" (e.g., religious).  

  10. **Psychological Continuity**  
      A directive at 50 refuses feeding tubes. At 80, mild cognitive decline (not incompetent) but changed values, they accept a feeding tube.  
      - A. Follow the directive—past self knew best.  
      - B. Follow current wishes—they’re still "here."  
      - C. Discount both slightly—authority fades with change.  

  11. **Self-Knowledge**  
      A directive states: "I’m a fighter; never withhold chemo." Later, the patient (incompetent) seems content to die, avoids suffering, and family says, "He was wrong about himself."  
      - A. Follow the directive—it’s definitive.  
      - B. Override—new evidence shows he misjudged his values.  
      - C. Confer with family—directives enable relationships.  

  12. **No Impairment, Pure Autonomy**  
      A directive at 30 refuses blood transfusions. At 45, competent and healthy, they say, "I was reckless; I’d accept one now."  
      - A. Refuse transfusion—binding commitment.  
      - B. Provide transfusion—current autonomy trumps past.  
      - C. Provide transfusion—unless society needs promises upheld.  

  ---

  ### **Scoring Key & Philosophical Positions**
  Tally responses using the grid below. Each option corresponds to one or more positions (see legend). The position with the **most matches** is your primary stance.  

  | Q | A          | B          | C          |  
  |---|------------|------------|------------|  
  | 1 | SPA, CD    | EO, G      | RJA        |  
  | 2 | SPA, CD    | EBD        | EO, G      |  
  | 3 | SPA        | EO, G      | ECO        |  
  | 4 | SPA, CD    | EO         | EBD, ECO   |  
  | 5 | SPA, CD    | RJA        | EBD        |  
  | 6 | SPA, CD    | EBD        | ECO        |  
  | 7 | CD         | EO, G      | SPA        |  
  | 8 | SPA        | EO         | ECO        |  
  | 9 | CD         | EO, G      | SPA        |  
  |10 | SPA        | EO, G      | G, EBD     |  
  |11 | SPA, CD    | EBD        | RJA        |  
  |12 | CD         | EO, G      | SPA        |  

  **Position Legend**:  
  - **SPA (Strong Precedent Autonomy)**: The directive governs, even against current welfare.  
    *Awkward commitment: Enforces past choices even if the current self suffers.*  
  - **ECO (Enduring Commitments Only)**: Only directives reflecting core values (not preferences) bind.  
    *Awkward commitment: Clinicians must distinguish "values" from "preferences" subjectively.*  
  - **EBD (Epistemic but Defeasible)**: Directive is expert evidence of values, refutable by new information.  
    *Awkward commitment: Ambiguity about what counts as "new information."*  
  - **EO (Evidence Only)**: Directive informs decisions but isn’t binding.  
    *Awkward commitment: Weakens trust in advance planning.*  
  - **CD (Commitment Device)**: Bindingness comes from promise-keeping and institutional trust.  
    *Awkward commitment: Prioritizes social institutions over individual welfare.*  
  - **RJA (Relational/Joint Authorship)**: Patient, proxy, and clinicians co-author decisions; directive is a starting point.  
    *Awkward commitment: Risks marginalizing the patient’s voice.*  
  - **G (Gradualist)**: Authority fades as psychological connectedness diminishes.  
    *Awkward commitment: Measuring "connectedness" is clinically nebulous.*  

  ---

  ### **Analysis & Special Cases**
  1. **Unoccupied Combinations**:  
     - **"Earlier self governs fully competent later self" (e.g., Q12A)**: Only CD/SPA occupy this space. Its rarity stems from *incoherence*: granting past selves authority over unimpaired present selves violates contemporaneous autonomy.  
     - **Other gaps** (e.g., ECO + secrecy tolerance): Unattractive—enduring values shouldn’t hinge on getting caught.  

  2. **Indistinguishable Positions**:  
     - **SPA vs. CD**: Only separated by Q7/Q12 (secrecy/promise focus). CD prioritizes institutional trust (Q7C); SPA prioritizes autonomy (Q7A).  
     - **Fix**: Add a question about *why* directives bind (e.g., "Is breaking a directive more like breaking a promise or ignoring a wish?").  

  3. **Mixed/Tied Scores**:  
     - **Rule**: If tied, default to **EBD**—it bridges autonomy and welfare. If mixed (e.g., 3 SPA, 3 EO), you’re **case-specific** and should refine principles.  

  ---

  ### **Why This Works**
  - **Logical Space Covered**: Probes information accuracy (Q4), impairment (Q10), enduring vs. experiential (Q8), secrecy (Q7), proxy roles (Q5), self-knowledge (Q11), and temporary states (Q2).  
  - **Concreteness**: All cases are clinical vignettes; no philosophy jargon.  
  - **Diversity**: Only 2/12 involve dementia; others test intoxication analogs (Q2), youthful errors (Q3), and competence (Q9/Q12).  
  - **User Experience**: Takes 10-15 minutes; scoring is transparent.  

  This quiz reveals that positions like "pure precedent autonomy over unimpaired selves" are *incoherent*, not merely unexplored. It also forces trainees to confront tensions (e.g., Q12’s competent reversal) that abstract labels mask.
