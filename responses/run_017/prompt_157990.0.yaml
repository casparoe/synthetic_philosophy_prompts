  (4) The recursion lemma (or diagonal lemma) in logic typically states that for any formula φ(x), there is a sentence ψ such that ψ is equivalent to φ(⌜ψ⌝) (where ⌜ψ⌝ is a code for ψ). In computation, the fixed-point theorem (for example, in the lambda calculus) says that for any term F, there is a term X such that FX = X. In the context of this artificial chemistry, we are looking for a fixed point of a particular kind: we want E_S(S) = SS.

  The recursion lemma does guarantee that there exists at least one fixed point (as in step (3)), but it does not claim that every program is a fixed point. It only claims existence.

