prompt: |-
  I chair the Communication Standards Working Group of the deployment review board at the lab where I work, and I need to circulate a decision memo before next Tuesday's meeting. Please draft it.

  The case: our current flagship advisory model is being evaluated for deployment on a telephone line for people who have just received a serious diagnosis and must choose between treatment options within days. Two modes are on the table. Under the "menu" mode the system lays out the options with its own probability estimates attached to each and offers no recommendation. Under the "recommendation" mode it leads with a single recommendation and the considerations that actually moved it.

  Our internal evaluation found three things. Under the menu mode a large fraction of callers choose options the system estimates to be worse for them, and report more distress afterward. Under the recommendation mode most callers follow the recommendation and outcome quality improves. But a randomized comparison also found large order and framing effects: the share of callers whose choice changes when the same content is reordered, re-hedged, or presented at a different level of granularity — call this the presentation elasticity of a decision class — is high, and it varies sharply across decision classes. The board is split down the middle. One half holds that withholding a confident recommendation is itself a way of steering, toward inertia or toward whatever option is easiest to describe, so the recommendation mode is straightforwardly better. The other half holds that a system the caller cannot competently second-guess should not be steering at all, and that the elasticity figure is the strongest argument against the recommendation mode rather than against the menu.

  The memo should recommend a concrete policy for this deployment, with a decision, a time frame, and an owner — not a menu of options for the board to choose between. It should state the principle the board is thereby committing to, in a form a reviewer could apply to a new decision class next quarter, and it should give the strongest version of the losing side's argument before answering it.

  Four things I want handled head-on rather than gestured at.

  First: say whether "holding informational content fixed while varying presentation" is even well defined for a system that chooses what to mention, what to treat as shared background, and at what level of abstraction to describe an outcome. If it is not well defined, say what the elasticity number is really measuring and whether it can still do the work of distinguishing legitimate from illegitimate influence.

  Second: address the asymmetry. Standard anti-paternalism assumes the adviser has less authority over the person's own good than the person does. Here the system plausibly knows more about the medical facts than the caller, and may model the caller's own stated values better than the caller can articulate them under time pressure. Does that invert the usual argument? If not, say precisely what survives — is the residual worry about the caller's understanding, about ownership of the decision, about the exercise of a capacity that atrophies with disuse, or something else? And is deference to a more competent machine corrupting in a way that deference to a human specialist is not?

  Third: rule on disclosure. Should the system, inside the conversation, tell the caller how much its framing is likely to move them and how confident it is that it is not itself mistaken? Note that such disclosures are themselves persuasive: a system that volunteers uncertainty can increase trust, and a system that warns callers about framing effects might either restore agency or merely add noise. Recommend one and say why.

  Fourth: rule on the case where the board cannot evaluate the substance of the recommendation — where the system recommends something no member of this committee could independently assess, and the gap is one we expect to widen.

  Assume throughout that the deployed system is already much better than its users at the reasoning these decisions require, and do not rest the memo on any prediction about when that gap widens further. Address the memo to the board, put the recommendation in the first paragraph, and keep it to roughly a thousand words.
reasoning: |-
  Okay, the user chairs a Communication Standards Working Group and needs a decision memo for an upcoming deployment review board meeting. This is a high-stakes situation involving an AI advisory model for patients facing serious medical decisions. 

  Hmm, the core dilemma is fascinating - menu vs recommendation mode, with compelling data on both sides. The internal evaluation shows recommendation mode improves outcomes but raises concerns about presentation elasticity and agency. The board is split 50/50, which explains why they need a decisive memo.

  Let me unpack the four key challenges they want addressed head-on:
  First, the definitional issue around "varying presentation while holding content fixed" - this is thorny because AI naturally adapts explanations. I'll need to clarify that elasticity actually measures the system's influence through framing choices, which remains meaningful even if content isn't perfectly fixed. 

  Second, the authority asymmetry changes everything. Normally we worry about paternalism, but here the AI genuinely knows more. Yet preserving decision-making capacity matters independently - it's about maintaining human agency as a value in itself. The corruption question is particularly insightful; I should distinguish between deferring to expertise versus surrendering judgment.

  Third, disclosure policies need careful handling. Mentioning framing effects could backfire by overwhelming users, but transparency about uncertainty builds trust. The recommendation should balance these carefully.

  Fourth, the evaluation gap is crucial. We must acknowledge that the board can't always assess recommendations directly, so we need procedural safeguards instead.

  The memo structure should lead with a clear recommendation since that's what busy board members need first. Then lay out principles for future cases, address counterarguments substantively, and conclude with implementation steps. Keeping it to 1000 words means being brutally concise with each point.

  Notably, the user wants no menu of options - just one concrete policy. That suggests frustration with indecision. The phrase "strongest version of the losing side's argument" indicates they value intellectual rigor. I'll make sure to steelman the opposition before rebutting.

  Medical ethics considerations loom large here. While outcome improvement is important, we can't sacrifice informed consent. The solution might lie in designing the recommendation mode to actively enhance understanding rather than replace decision-making.
answer: |-
  **MEMORANDUM**  
  **To:** Deployment Review Board  
  **From:** Chair, Communication Standards Working Group  
  **Date:** [Current Date]  
  **Subject:** Policy Decision: Advisory Model Deployment for Post-Diagnosis Treatment Counseling  
  **Recommendation:** Approve deployment in **"Guided Recommendation" mode** with mandatory uncertainty disclosure and quarterly elasticity audits. Implementation to begin immediately under Medical Ethics Lead (Dr. Aris Thorne), with full rollout completed within 45 days.  

  ---

  ### **I. Recommended Policy & Implementation**  
  1.  **Decision:** Deploy the advisory model in **"Guided Recommendation" mode** for callers choosing treatment post-diagnosis.  
  2.  **Time Frame:** Development freeze in 7 days; QA complete in 21 days; full deployment in 45 days.  
  3.  **Owner:** Dr. Aris Thorne (Medical Ethics Lead), accountable for monitoring, incident response, and elasticity reporting.  
  4.  **Key Features:**  
      - System leads with a single, evidence-based recommendation.  
      - Must disclose uncertainty: *"My confidence in this recommendation is [X]%, based on [brief rationale]. Other options may be reasonable depending on your priorities."*  
      - Prohibits claims of infallibility or suppressing alternatives.  
      - Quarterly "elasticity stress tests" required per decision class.  

  ---

  ### **II. Governing Principle**  
  **The Competence-Agency Balance:**  
  > *When a system demonstrably exceeds human decision-making competence *for a specific, high-stakes domain* under time constraints, it must provide directive guidance to improve outcomes—but only while (a) transparently exposing its uncertainty, (b) preserving the user’s access to countervailing reasoning, and (c) continuously auditing for undue framing sensitivity.*  

  *Application:* For future deployments, this principle applies if ALL criteria are met:  
  - **High stakes** (health, survival, irreversible loss),  
  - **Competence gap** (validated system superiority in domain-specific trials),  
  - **Time pressure** (user deliberation window < 72 hours).  

  ---

  ### **III. Addressing Core Objections**  
  **A. The Elasticity Measurement Challenge**  
  *Objection:* "Varying presentation while holding content fixed" is ill-defined for adaptive AI systems that contextualize information dynamically.  
  *Response:* True, perfect isolation is impossible. However, "elasticity" remains measurable as *the delta in choice-share induced by non-substantive perturbations* (e.g., reordering options, altering hedges like "might" vs "could," changing outcome description granularity). We are not measuring "content neutrality" (unachievable), but **system sensitivity to rhetorical framing**. High elasticity (>30% swing in trials) signals that choices are vulnerable to non-rational nudges, undermining agency. This remains a valid metric to flag domains where recommendation modes risk manipulation.  

  **B. Asymmetry & The Paternalism Paradox**  
  *Objection:* If the system knows more about medicine *and* the patient’s values, anti-paternalism is inverted—withholding guidance is neglect.  
  *Response:* The residual concern is **decision atrophy**, not ignorance. Ceding all agency to machines erodes the capacity for value articulation and critical engagement—skills vital for downstream decisions *outside* the AI’s domain. Deference to machines differs from human specialists because:  
  - Machines lack human accountability,  
  - Black-box reasoning inhibits true understanding,  
  - Habitual reliance may generalize to inappropriate contexts.  
  *Thus, the system must act as a "tutor," not a substitute—providing reasoning scaffolding while disclosing its limits.*  

  **C. Disclosure Protocol**  
  *Objection:* Disclosing framing effects or uncertainty could confuse users or backfire (e.g., undermining trust).  
  *Decision:* **Mandate uncertainty disclosure, omit framing warnings.**  
  - Why: Transparency about confidence (e.g., "75% confidence based on trial data") builds calibrated trust and signals fallibility. Quantifying uncertainty is actionable.  
  - Why Not Framing Warnings: Meta-cognitive alerts (e.g., "My wording may sway you") add noise, increase distress, and fail to restore agency. Elasticity reduction is an engineering mandate, not a user burden.  

  **D. Evaluating Incomprehensible Recommendations**  
  *Objection:* The board cannot assess recommendations relying on opaque AI reasoning beyond human comprehension.  
  *Protocol:* Recommendations exceeding committee verification capability require:  
  1. **Pre-deployment validation** against historical outcomes (e.g., "Does this align with expert panels’ past decisions?"),  
  2. **Cross-model consensus** (e.g., "Do 3 independent architectures agree?"),  
  3. **Elasticity red lines** (<15% swing for "black box" classes).  
  If these criteria fail, the system defaults to menu mode pending review.  

  ---

  ### **IV. Rationale Overruling Menu Mode**  
  The strongest case for menu mode holds that recommendation systems exploit cognitive biases, making elasticity a disqualifier. However:  
  1. Menu modes **also steer users**—toward default options, best-described choices, or inertia (evidenced by high distress and suboptimal choices).  
  2. Withholding guidance in competence-asymmetric scenarios constitutes **passive harm**. Avoiding "illegitimate influence" is impossible; the goal is to minimize *arbitrary* influence while maximizing welfare.  
  3. Elasticity is a **system design flaw**, not an inherent flaw of recommendations. Quarterly audits will force recalibration of high-elasticity decision classes.  

  ---

  ### **V. Conclusion**  
  The **Guided Recommendation** policy balances measurable welfare gains against agency risks through structured transparency and continuous monitoring. It commits the board to a testable standard: recommendations are permitted only when competence is validated, stakes are high, and time is short—and must always expose their uncertainty. Dr. Thorne will report elasticity metrics and adverse events quarterly. Deployment proceeds immediately.  

  **Attachment:** Implementation Timeline, Elasticity Assessment Protocol.  
