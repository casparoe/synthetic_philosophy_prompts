prompt: |-
  For some years I have kept a hobby: I run round-robin tournaments among strategies for the iterated prisoner's dilemma. Every entrant is a fixed rule — written by me or by friends — that inspects the history of the pairing and chooses cooperate or defect. Each entrant meets every other entrant, and a copy of itself, for a fixed two hundred moves, and I score by total points across all pairings, using the usual payoffs: five for defecting against a cooperator, three for mutual cooperation, one for mutual defection, nothing for being exploited. None of my entrants is written to behave differently on the last move, so none can exploit the known ending.

  The pattern I want a word for has two faces. My most successful entrant opens by cooperating and thereafter simply repeats whatever its partner did on the previous move. It has never once, in any pairing I have run, finished ahead of the thing it was playing against; because its moves are its partner's moves shifted by one round, it either ties or finishes exactly five points behind, and that is all there is to it. Yet it wins the table, over and over, whatever else I put in the pool. My least successful entrants include the one that simply defects on every move. Nothing in my pool can score more than it in a single pairing — the best you can do against a defector is defect yourself, and every cooperation only costs you — so it wins or ties every contest it plays, and it sits near the bottom of the table.

  The arithmetic is not mysterious: against a partner that always cooperates, the copycat collects 600 and concedes 600, while the defector collects a thousand and concedes nothing. Add the first column across thirty opponents and the copycat's total is enormous; count wins instead and the defector looks like the strongest thing present. What I cannot get straight is which of those is the right question, and why.

  Two further things make me suspect I am looking at more than one phenomenon. If I rescore the very same results by awarding a point for each pairing won rather than the raw payoffs, the table reorders — different winner, different tail. And when I let the pool evolve instead of running a single tournament — copy entrants in proportion to their scores, discard the failures, reseed with a few copies of whatever did well, repeat for some hundreds of generations — something else takes over, usually a rule that repeats its own previous move when the last round paid it reasonably and switches when it did not. The defectors vanish, and I take it that this is because, once common, they start meeting themselves.

  A statistician friend muttered something about Simpson's paradox; a biologist friend said it was just non-transitivity. Neither seems to me to capture what I have found, but I cannot say why, and I cannot tell whether I have stumbled on one thing with two faces or on two separate things that happen to sit next to each other.

  So: does this have a name? I do not want a label on its own — I want the phenomenon carved. What exactly is the gap between scoring well and beating the thing you are paired with; how does that gap differ from non-transitivity and from the aggregation paradoxes it superficially resembles; does the collapse of the defectors once they become common belong to the same phenomenon or to another one; and what would a case look like in which the distinction made no difference at all, so that I can see where its edges lie? If there is no established concept here, say so plainly and give me a name and a definition I could use, with the boundary cases fixed. I am not asking for references — only for the distinction, stated and bounded.
reasoning: |-
  Okay, I need to unpack this user's query. They've been running iterated prisoner's dilemma tournaments and noticed two key phenomena: their Tit-for-Tat-like strategy ("copycat") consistently wins the overall tournament despite never beating any opponent in pairwise matches, while the always-defect strategy ("defector") wins or ties every pairwise match but finishes near the bottom overall. 

  The user is clearly an experienced researcher - they've noticed how scoring methods (raw points vs pairing wins) and evolutionary dynamics change outcomes. Their frustration is palpable: they've heard terms like "Simpson's paradox" and "non-transitivity" but feel these don't quite fit. What they really want is precise conceptual carving of this phenomenon, including its boundaries.

  Hmm... let's break this down systematically. First, the core tension: pairwise dominance versus global performance. The defector dominates pairwise (never loses) yet fails globally, while copycat never dominates pairwise yet wins globally. This feels different from standard non-transitivity because it's not about A>B, B>C, C>A cycles - rather, it's about two distinct evaluation metrics producing opposite winners.

  Interesting how they mention the evolutionary angle too - defectors collapse when common because they start facing each other. That's clearly a separate population-level effect, though related to the core paradox. 

  The scoring method switch is crucial: when they change from raw points to "wins per pairing," the winner changes. That highlights how the evaluation metric determines what "success" means. In raw points, cooperation is rewarded in cooperative environments; in win-counting, exploitation is rewarded but only if opponents cooperate.

  I recall that in game theory, this touches on the difference between Pareto efficiency and Nash equilibria. But the user wants something more operational. The key insight might be that "beating opponents" measures relative performance in isolation, while total points measure absolute performance across all contexts. The copycat thrives because it creates mutual cooperation where possible, while defector burns all bridges.

  For the boundary case they requested: imagine a tournament where all strategies cooperate unconditionally. Then both metrics would align - copycat would "win" pairings (by tying) and also get maximum points. The gap emerges precisely when strategies vary in exploitability and exploitiveness.

  The defector's collapse in evolution is indeed a separate phenomenon - frequency-dependent selection. But it's connected because it shows why the "never lose pairwise" property becomes irrelevant when the environment adapts to punish defectors.

  The user's yearning for precise terminology is understandable. While "Simpson's paradox" involves aggregated data reversing trends, here it's more about metric dependence. "Non-transitivity" doesn't fit because there's no cycle of dominance. This seems like a distinct phenomenon centered on the difference between pairwise dominance and aggregate utility.

  Perhaps we need a new term: "Utility-Dominance Dissonance"? With clear components: (1) the scoring gap (dominance vs total utility), (2) the metric sensitivity (how evaluation changes with scoring), (3) the environmental dependence (how common strategies affect outcomes). 

  The boundary case would be homogeneous populations with fixed strategies where dominance and utility align. The distinction matters most in mixed populations with both cooperative and exploitative strategies. That's where the phenomenon shows its teeth - and where the user's observations crystallize.
answer: |-
  This phenomenon is **not** primarily Simpson's Paradox or non-transitivity. It's a specific consequence of **evaluating strategies in isolation versus within a population under a specific scoring metric**, interacting with the fundamental incentives of the prisoner's dilemma. Here's the carving:

  1.  **The Core Phenomenon: The Scoring Gap (Dominance vs. Aggregate Utility)**
      *   **Pairwise Dominance:** A strategy `A` *dominates* strategy `B` if `A` scores at least as many points as `B` *in every possible individual pairing* between them (considering all histories), and strictly more in at least one pairing. (e.g., Defector dominates Cooperator: always wins or ties, strictly wins against Cooperator).
      *   **Aggregate Utility:** The total score a strategy accumulates across *all* its pairings in the tournament.
      *   **The Gap:** It's possible for a strategy (`Defector`) to be *pairwise dominant* over many others (winning or tying every individual contest) yet have *lower aggregate utility* (total tournament points) than a non-dominant strategy (`Copycat`) that loses or ties every individual contest. **This gap arises because aggregate utility sums *absolute* payoffs across diverse opponents, while pairwise dominance focuses solely on *relative* performance within each isolated pairing.**

  2.  **Why it Differs from Simpson's Paradox & Non-Transitivity:**
      *   **Simpson's Paradox:** Involves a trend appearing in different groups of data but reversing when the groups are combined. Here, the "reversal" (Defector wins pairings but loses tournament) is inherent to the *evaluation metric* (pairwise win vs. total points) applied to the *same* data set. It's not about combining subgroups obscuring a trend; it's about two different questions ("Who wins each fight?" vs. "Who gets the most points overall?") yielding different answers from the *same* fights.
      *   **Non-Transitivity:** Involves cycles where `A > B`, `B > C`, but `C > A` under the *same* metric (e.g., `A` beats `B`, `B` beats `C`, `C` beats `A`). Here, there's no cycle under a *single* metric. Under pairwise wins, Defector is dominant over many (transitive hierarchy possible). Under total points, Copycat wins. The conflict is *between different metrics*, not within one metric.

  3.  **The Role of the Scoring Metric:** The gap is *metric-dependent*. Switching to "wins per pairing" eliminates the gap *for that specific metric*. Defector *would* likely win under that metric because it wins or ties every pairing. Copycat only ties. The gap manifests strongly under the "total points" metric because:
      *   It rewards high *absolute* payoffs (mutual cooperation = 3, exploiting = 5) rather than relative wins.
      *   It sums payoffs across opponents with vastly different behaviors (cooperators vs. defectors).
      *   `Copycat` excels at securing high mutual payoffs (3) with cooperative/reciprocal strategies while minimizing losses against defectors (1 instead of 0). `Defector` maximally exploits cooperators (5) but gets the worst payoff (1) against other defectors.

  4.  **The Collapse of Defectors in Evolution: A Separate (but Related) Phenomenon**
      *   This is **Frequency-Dependent Selection**. A strategy's fitness depends on how common it is in the population.
      *   **Why it's Separate:** The scoring gap exists in a *static* tournament with fixed opponents. The evolutionary collapse is a *dynamic* consequence of the population composition changing *based on* the static scoring (fitness).
      *   **Why it's Related:** The scoring gap *enables* the collapse. `Defector`'s high score relies on exploiting cooperators (`C`). As `Defector` becomes common:
          *   Fewer `C` exist to exploit.
          *   More pairings are `Defector` vs. `Defector`, yielding the low payoff (1).
          *   Strategies like `Copycat` or `Win-Stay-Lose-Shift` (your evolved rule) can achieve stable mutual cooperation (3) with each other, outperforming the dense cluster of `Defectors` getting only (1) against each other.
      *   **Key Difference:** The evolutionary collapse is about strategy *fitness changing with frequency*, driven by the payoff matrix. The scoring gap is about *evaluation metric conflict* in a fixed setting.

  5.  **The Boundary Case: Where the Gap Vanishes**
      *   **The Distinction Makes No Difference When:** The population consists *entirely* of strategies that behave *identically* towards every opponent strategy *in terms of the payoffs they elicit*.
      *   **Example 1: All Always Cooperate (`C`):** Both metrics align. `C` ties every pairing (so "wins" under a tie-counts-as-win rule) and gets maximum points (3 per round). No gap.
      *   **Example 2: All Always Defect (`D`):** Both metrics align. `D` ties every pairing (so "wins") and gets 1 point per round. `D` has the lowest possible score, but wins/ties every pairing. No gap between dominance and aggregate utility (both indicate `D` is "dominant" but scores poorly).
      *   **Example 3: All `Copycat` (or any single reciprocal strategy):** Similar to all `C` - mutual cooperation, ties, high score. No gap.
      *   **Why the Gap Exists Only in Mixed Populations:** The gap arises from the *interaction* between different strategy types and the different incentives captured by the two metrics. When all strategies are identical, the interactions are uniform, and both metrics tell the same story about relative performance (which is identical).

  **The Carved Concept: Utility-Dominance Dissonance (UDD)**

  *   **Definition:** The phenomenon where a strategy demonstrates **pairwise dominance** (wins or ties every individual contest against opponents) yet achieves **lower aggregate utility** (total payoff across all contests) than a non-dominant strategy within a population, under a scoring system that sums absolute payoffs. This dissonance arises from the tension between maximizing *relative* performance in isolated pairings and maximizing *absolute* payoff accumulation across diverse opponents, and is only observable in heterogeneous populations.
  *   **Components:**
      1.  **Pairwise Dominance:** Winning or tying every direct matchup.
      2.  **Aggregate Utility Superiority:** Achieving a higher total score (sum of absolute payoffs) than the dominant strategy.
      3.  **Scoring Metric Dependence:** Manifesting strongly under "sum of absolute payoffs" but potentially vanishing under "win count per pairing".
      4.   **Population Heterogeneity Requirement:** Requires a mix of strategy types with different interaction outcomes (cooperation, defection, exploitation).
  *   **Boundary:** UDD vanishes in homogeneous populations where all strategies elicit identical payoff streams from each other.
  *   **Related but Distinct:** *Frequency-Dependent Selection* explains why a strategy strong under UDD in a static mixed pool (like `Defector`) can collapse when common in an evolutionary setting, due to changes in the pool composition affecting its *actual* payoff potential.

  **In Your Tournament:**

  *   **UDD Manifestation:** `Defector` exhibits pairwise dominance (wins or ties every pairing) but has lower aggregate utility (total points) than the non-dominant `Copycat` (which loses or ties every pairing).
  *   **Reason:** `Copycat` secures high mutual cooperation payoffs (600) with cooperators/reciprocators, while `Defector` burns those opportunities for 1000 points *once* but then suffers low mutual defection payoffs (200) against other defectors and reciprocal strategies. `Copycat`'s *absolute* payoff sum is larger.
  *   **Metric Switch:** Switching to "win per pairing" resolves the dissonance *for that metric* – `Defector` wins.
  *   **Evolutionary Collapse:** Frequency-dependent selection explains `Defector`'s demise when common – it loses its exploitable victims (`C`) and gets trapped in low-payoff mutual defection.
  *   **Boundary Case:** If all entrants were `Copycat`, both metrics would show `Copycat` winning/tieing and having the highest possible score. No dissonance.
