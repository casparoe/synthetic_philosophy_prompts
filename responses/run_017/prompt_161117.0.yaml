  Breaking this down carefully. First, the core deadlock: one camp treats neural measures as necessary epistemic proxies under uncertainty about other minds, while opponents argue this smuggles in discredited craniometry. Both sides reject historical abuses but can't move forward. The user's key insight is that three distinct questions are conflated: (a) metaphysical grounding (do neurons ground status?), (b) epistemic justification (what can we use under uncertainty?), and (c) the ontology of moral status itself (threshold vs. scalar vs. modular).

  Now the user's diagnostic tools: The intraspecies parity condition asks why neural measures wouldn't apply within humans if used across species. And the empirical reversal hypothetical asks: if neurons perfectly predicted cognition, would that make them morally relevant or still just evidentiary?

  What's really being asked here is for me to:
  - Validate or refine their three-question framework
  - Apply it to their thought experiments
  - Diagnose the deadlock's structure
  - Suggest what real progress would look like

  The user explicitly wants structural analysis, not position surveys. They're clearly deeply versed in this literature - notice how they crisply summarize entire schools of thought in single clauses. This is someone who's tired of surface-level debates and wants to drill into presuppositions.

  On their framework: It's perceptive but needs tightening. Question (c) is actually three sub-questions rolled together: (c1) is status unitary or composite? (c2) is it scalar or threshold? (c3) what protections cluster together? The "aggregate of protections" point is particularly acute - we might care differently about pain sensitivity vs. future-planning capacity.

  For the parity condition: This exposes that proxy-users are answering (b) while critics hear (a). But crucially, it reveals everyone's unstated commitment to human moral equality as a fixed point. The condition works because it forces confrontation with (c): if status is scalar, why shouldn't human neural variation matter? The rhetorical power comes from exposing that the real disagreement is about whether moral status can admit degrees at all.

  The empirical reversal hypothetical is brilliant because it isolates the metaphysical question. If perfect prediction existed, the epistemic (b) question evaporates - but the metaphysical (a) question remains untouched. Neurons could still be mere correlates rather than grounds of moral status. This shows that the core dispute isn't really about predictive accuracy at all.

  Hidden empirical questions? Partly - but the deeper issue is normative. Even perfect tracking wouldn't settle whether the tracked capacities are what matter morally. Conversely, no empirical finding can resolve whether moral status is scalar (which might permit neural gradation) or threshold-based (which resists it).

