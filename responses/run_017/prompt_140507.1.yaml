  The user is part of a group stuck on the first clause. They’ve tried different principles but each breaks under stress. They need a framework to evaluate options, not just theory. Their deeper need is practical application—something that works in real-time for a clerk, avoids explosive inclusivity, prevents circular definitions, and stops factions from gaming the system.

  Meta-questions are crucial. They want to know which requirements are essential vs. ideological. For example, is a standing demos a must or a preference? They suspect trade-offs, like legibility vs. affectedness sensitivity. Highlighting incompatibilities is key here.

  I should structure the response around core requirements, each with cases and considerations. Then meta-issues: desiderata vs. preferences, incompatibilities, and which requirement disqualifies popular approaches. Finally, scoring the standard families briefly.

  Administrative legibility is vital. Using birth certificates or utility bills is manageable but excludes those affected indirectly, like downstream communities. Non-explosiveness prevents global inclusion, so coercion-based rules might be too broad. Non-circularity avoids self-referential definitions. Fixed-point stability stops gerrymandering via agenda-setting.

  Incompatible pairs: Legibility and full affectedness can’t coexist. Non-circularity plus completeness (covering all cases) might also clash. The weaponization concern is critical—affectedness principles are vulnerable here.

  Popular approaches: All-affected interests fail on legibility and weaponization. All-subjected fares better on coercion but still explodes. Membership-based (like residence) wins on legibility and stability but ignores externalities. Procedural/deliberative methods avoid circularity but need a prior demos.

  The user needs actionable criteria to present to their group. Highlighting trade-offs helps them decide what to prioritize. Emphasizing fixed-point stability and legibility as major hurdles makes sense, as those are their pain points.
answer: |-
  Here's a specification of requirements for a demos-membership principle, designed for your practical charter-drafting context. It prioritizes operationalizability, stability, and avoidance of known failure modes, based on the boundary problem literature and your explicit pain points.

  ---

  **Core Requirements for a Demos-Membership Principle**

  1.  **Administrative Legibility:**
      *   **Requirement:** Membership determination must rely on *objective, verifiable, and relatively static* criteria accessible to a clerk with standard documentation (e.g., birth certificates, residency permits, utility bills, tax records) during routine operations. Counterfactual impact assessments or complex causal modeling are prohibited.
      *   **Cases it Handles Well:** Age thresholds (children), documented residency status (long-term non-citizens vs. tourists), place of primary residence (citizens abroad).
      *   **Cases it Handles Poorly/Excludes:** People downstream of emissions/land-use (requires complex modeling), future generations (no documentation), undocumented residents (lack verifiable proof), those affected only by specific policies (requires per-decision analysis).
      *   **Where it Bites:** Forces trade-offs. You *cannot* perfectly capture diffuse, future, or undocumented affected interests with legible criteria. You must accept imperfect proxies (e.g., residency as a proxy for significant, ongoing impact).

  2.  **Non-Explosiveness (Bounded Demos):**
      *   **Requirement:** The principle must define a *finite and practically manageable* group. It cannot logically imply universal inclusion (all humans) or indefinite expansion based on trivial or universal impacts (e.g., climate change, global markets).
      *   **Case/Consideration:** Distinguishes "being affected" (potentially universal) from "being *significantly and proximately* subject to the *authoritative power*" of the polity. Rejects the premise that *any* causal effect warrants inclusion. This is a **genuine desideratum** for *any* functional small-scale polity; universal inclusion renders self-government impossible. Statists exploit this to defend existing borders, but the problem is real for new polities too.

  3.  **Non-Circularity:**
      *   **Requirement:** The criteria for membership cannot be defined by, or contingent upon, the *specific decisions* made by the governing body whose membership is being defined, nor upon which issues are *currently on the agenda*.
      *   **Case/Consideration:** Prevents rules like "all affected by *this specific vote*" or rules where the body defines its own electorate based on its chosen policies. Essential for foundational legitimacy and preventing self-serving elite capture from day one.

  4.  **Fixed-Point Stability (Anti-Weaponization):**
      *   **Requirement:** The membership set must be *robust against strategic manipulation* via agenda-setting or policy design. Membership determination cannot depend on the *outcome* of decisions made by the demos, nor be easily altered by factions proposing policies specifically designed to include/exclude groups to sway future votes.
      *   **Case/Consideration:** Explicitly targets the "itinerant demos" failure mode. Prevents:
          *   **Retroactive Legitimacy:** Winners claiming only those who voted for them were "truly affected."
          *   **Agenda Gerrymandering:** Faction A proposes Policy X, knowing it primarily affects Faction B's supporters, thereby enfranchising them *for that vote* to tip the balance.
      *   **Weaponized-Affectedness:** This is a **critical, independent desideratum** for stability. Outcome-dependent membership is inherently unstable and open to abuse.

  5.  **Distinction Maintenance:**
      *   **Requirement:** The principle must clearly distinguish between:
          *   *Having a say* (membership) vs. *How much say* (voting weight/representation).
          *   *Being Affected* (causal impact) vs. *Being Coerced* (subject to enforceable rules) vs. *Being Legally Subject* (bound by the polity's laws/jurisdiction).
          *   *The Demos for Ordinary Decisions* vs. *The Constituent Demos* (that authorizes/changes the constitution). (May be the same group, but the distinction matters for amendment rules).
          *   *De Jure Membership* (defined by rule) vs. *De Facto Power/Impact* (influence wielded by non-members).
      *   **Case/Consideration:** Prevents conceptual muddles. E.g., "all affected" often collapses coercion and causal impact. A principle must specify *which* relationship grounds membership.

  6.  **Temporal Stability:**
      *   **Requirement:** Membership status should change relatively infrequently based on predictable life events (birth, death, moving in/out), not fluctuate wildly with every policy debate or external event. Provides predictability for both members and administrators.
      *   **Case/Consideration:** Balances responsiveness (e.g., enfranchising new long-term residents) with administrative feasibility and community cohesion. Rules based on very short-term presence (e.g., 1 week) fail this.

  7.  **Handling Core Problematic Cases (Minimally):** The principle need not perfectly resolve every edge case but must provide a *clear, rule-based approach* for:
      *   **Young Children:** Explicit exclusion based on age/competence threshold is usually necessary and legible.
      *   **Long-Term Non-Citizen Residents:** Need a rule for inclusion (e.g., residency duration) or explicit exclusion (risking legitimacy deficit).
      *   **Citizens Abroad:** Need a rule for exclusion (loss of residency) or conditional inclusion (e.g., time limit abroad, tax status).
      *   **Temporary Migrant Workers:** Need a clear duration threshold or explicit exclusion.
      *   **Prisoners:** Need an explicit rule (exclusion, conditional inclusion, loss of right).
      *   **Future Generations:** Cannot be included as voting members. Requires other mechanisms (e.g., constitutional rights, sustainability mandates, trusteeship role for current members).
      *   **Externally Affected (Downstream, etc.):** Cannot be included as voting members without violating Non-Explosiveness and Legibility. Requires other mechanisms (diplomacy, treaties, external review, liability rules).

  ---

  **Meta-Analysis: Desiderata vs. Preferences & Incompatibilities**

  1.  **Standing Demos vs. Itinerant (Per-Decision) Demos:**
      *   **Analysis:** A *standing demos* is a **practical requirement** driven by **Administrative Legibility**, **Temporal Stability**, and **Fixed-Point Stability**. Per-decision demos determination is inherently non-legible, unstable, and weaponizable. While philosophically appealing (pure affectedness), it's operationally infeasible for a real polity. **Verdict:** Requirement for your context.

  2.  **"All Subject to Coercion Gets a Say":**
      *   **Analysis:** This is a **normative axiom** prominent in certain theories (e.g., all-subjected principle). It's *not* a necessary constraint derived from pure logic or functional requirements. While it addresses a legitimacy concern (rule over the ruled), it risks **Explosiveness** (coercion can be diffuse) and conflicts with **Bounded Demos**. It's a *theoretical commitment*, not an unavoidable desideratum. You can choose other foundations (e.g., mutual commitment, territorial presence).

  3.  **Key Incompatible Pairs:**
      *   **Full Counterfactual Affectedness-Sensitivity & Administrative Legibility:** **Fundamentally Incompatible.** Perfect sensitivity requires impossible, continuous, individualized impact assessments.
      *   **Non-Circularity & Completeness (Perfect Fit for All Cases):** **Likely Incompatible.** A fixed, prior rule (non-circular) will always have edge cases where it seems "unfair" based on affectedness or coercion (e.g., downstream communities, very recent arrivals). Achieving perfect fit requires abandoning non-circularity (e.g., letting the body decide its electorate per issue).
      *   **Non-Explosiveness & Including All Coerced/All Significantly Affected:** **Often Incompatible.** Defining "significant" or "proximate" coercion/effect tightly enough to bound the demos often relies on criteria (like territorial jurisdiction or membership itself) that critics argue are circular or arbitrary. There's a constant tension here.
      *   **Fixed-Point Stability & Outcome-Dependent Membership:** **Fundamentally Incompatible.** Any membership rule contingent on the outcome of decisions made by that membership is inherently unstable and weaponizable.

  4.  **The Requirement Doing the Most Work (Knocking Out Candidates):**
      *   **Fixed-Point Stability (Anti-Weaponization)** is the most potent eliminator. It immediately sinks any form of "all affected by *this specific decision*" principle (itinerant demos) and severely complicates highly dynamic or impact-sensitive rules.
      *   **Administrative Legibility** is the second most potent, eliminating principles requiring complex impact modeling (pure all-affected interests) or constant reassessment.

  ---

  **Scoring Standard Families (Briefly)**

  | Principle Family          | Administrative Legibility | Non-Explosiveness | Non-Circularity | Fixed-Point Stability | Handling Core Cases | Notes                                                                 |
  | :------------------------ | :------------------------ | :---------------- | :-------------- | :-------------------- | :------------------ | :-------------------------------------------------------------------- |
  | **1. All-Affected Interests** | ⚫ (Very Poor)             | ⚫ (Very Poor)     | ▲ (Medium)      | ⚫ (Very Poor)         | ⚫ (Poor)            | Fails Legibility, Explosiveness, Stability. Pure theory only.         |
  | **2. All-Subjected (Coercion)** | ▲ (Medium)                | ▲ (Medium)        | ● (Good)        | ● (Good)              | ▲ (Medium)          | Better on Stability/Circularity, but struggles with Explosiveness/Legibility ("subjected how?"). Often defaults to jurisdiction. |
  | **3. Membership-Based (Residence/Citizenship)** | ● (Good)                  | ● (Good)          | ● (Good)        | ● (Good)              | ● (Good)            | **Strongest on your practical requirements.** Clear proxies (lease, utility bill, birth cert). Bounded. Stable. Legible. Non-circular. Handles core cases via clear rules. Weakness: Ignores externalities, may exclude some affected (new residents). |
  | **4. Procedural/Deliberative Fixation** | ▲ (Medium)                | ▲ (Medium)        | ● (Good)        | ● (Good)              | ▲ (Medium)          | Defers boundary to prior procedure (e.g., founders' agreement, historical event). Good on Stability/Circularity. Legibility/Explosiveness depend on *what* the procedure fixed (e.g., if it fixed residency, same as #3). |

  **Key Takeaways for Your Charter (Next Steps):**

  1.  **Prioritize Practicality:** **Membership-Based (Residence + Duration +/- Citizenship/Oath)** scores best on your explicit requirements (Legibility, Non-Explosiveness, Non-Circularity, Fixed-Point Stability). It provides the clerk with clear docs to check. It's the baseline most real communities use for a reason.
  2.  **Define Key Terms Rigorously:** Whatever you choose (e.g., "resident"), define it *operationally* for the clerk: "Primary dwelling for >6 months annually, proven by lease/deed and two utility bills."
  3.  **Address Weaknesses via Other Mechanisms:**
      *   **Externalities (Downstream):** Environmental standards in charter, liability rules, external agreements.
      *   **Future Generations:** Sustainability mandates, constitutional rights for environment, endowment funds.
      *   **Recent Arrivals/Legitimacy:** Graduated inclusion (voice -> vote after duration), clear naturalization path.
      *   **Prisoners/Children:** Explicit exclusion rules based on competence/status.
  4.  **Amendments:** Design your amendment rule *very carefully*. The constituent demos (those who can amend the charter, including the membership rule) might reasonably be stricter than the ordinary legislative demos (e.g., longer residency, supermajority). This enhances Fixed-Point Stability.
  5.  **Accept Imperfection:** No rule is perfect. The goal is a *workable, stable, legitimate-enough* foundation that allows the community to function and evolve. Membership-based residence is the most robust starting point. Argue *from the specific requirements above* to justify choices and reject alternatives that fail them.

  This framework should equip you to break the logjam. Focus on the requirements list as your shared specification. Good luck on the 14th!
