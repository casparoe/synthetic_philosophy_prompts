prompt: |-
  Hey — I want you to act as a professional philosopher who's spent an unhealthy amount of time in population ethics and suffering-focused ethics, ideally the kind who's argued about the asymmetry on a forum at 2am. I need something practical out of that.

  I run a tiny reading group that meets above a bakery on Sundays — about twelve people, mostly lapsed effective-altruism types plus two who are really just here for the Schopenhauer — and we keep talking past each other. Half the room calls itself "negative utilitarian," and then immediately disagrees about everything: whether a life that's net pleasant but contains one bad hour is worth creating, whether the mild badness of billions of tiny irritations can outweigh a single agony, whether pain someone chose and is glad about still needs to be offset. I tried building a tree myself and ended up with one where almost everyone landed on the same leaf, which tells me I was asking the wrong questions. So: I want a diagnostic that sorts people by what they say about cases, not by which label they're fond of.

  Please do a first pass brainstorming the logical space before you write anything — I want the questions generated from the space of possible answer combinations, not from a memorized list of -isms, so think about that before you start drawing branches. Then give me: eight to ten branch questions, each phrased as a concrete case or a claim someone could just agree or disagree with, two or three answer options each, and every one answerable by a smart person who has never heard the labels. Build the branch order from the axiological joints rather than from the names: start with what has negative value at all and whether suffering is the only thing that does, then whether positive states have independent value or only offsetting/instrumental value, then the aggregation question (do small bads sum across people, or is there some intensity threshold below which they stop counting, or a lexical priority for the worst off), then the creation/existence question, then person-affecting vs. impersonal if earlier branches haven't already settled it. Please use at least these cases somewhere in the tree, renaming them if you like: (1) the erased agony — someone endures an hour of severe suffering, after which their memory is wiped and their psychology fully restored, so nothing about them is traceably different and nobody else is affected; does the hour still count as a cost, and if so, whose? (2) the wanted burn — the identical burning sensation in a chilli-lover who adores it and would pay to repeat it versus in someone strapped to a chair; is the disvalue in the sensation, in the subject's aversion, or somewhere else? (3) the silent stress response — a body with no consciousness at all, cortisol spiking and tissue breaking down but nobody home; suffering or not? (4) the static — a billion people each get one flicker of mild irritation they forget within seconds and wouldn't pay a penny to avoid, versus one person getting ten minutes of agony; which is worse, or are they incommensurable, or is there a threshold below which the flickers just drop out? (5) the consolation case — two worlds with identical total suffering, but in one every sufferer is also comforted and has plenty of what makes a life good; does the added positive make that world better, worse, or leave it exactly as it was? (6) the one-bad-hour life — create a person whose life is net mildly pleasant but contains one hour of real agony, or create nobody.

  For the leaves I want around nine to eleven, each with the standard name of the position where one exists (I've seen some of these called "negative leximin," "tranquillism," "negative prioritarianism," asymmetric or Benatar-style views, "weak NU," lexical-threshold views — I'm probably mangaling some of these, so use whatever you think is actually standard and just write "unnamed" where nobody defends it), plus one sentence on the most awkward thing that leaf is committed to and one sentence on what would most likely move someone off it. Then mark the answer combinations your tree allows but that nobody actually occupies, and for each say briefly whether it's empty because it's incoherent, because it's merely unattractive, or because no one has bothered — and flag any two leaves your tree genuinely cannot separate rather than inventing a question that pretends to. Finish with a short scoring key mapping answer patterns onto leaves, and tell me which single question does the most sorting work, i.e. which one to lead with if I only get one shot at a room of twelve people who are already board. Keep the whole thing tight enough to photocopy onto one sheet, don't ask anyone to define a term, and don't give me a bibliography — half of us read on paper and none of us will look anything up.
reasoning: |-
  Okay, let me tackle this step by step. The user runs a reading group with debates around negative utilitarianism and wants a diagnostic tool to clarify positions without academic jargon. 

  First, I need to map the logical space axiology-first. The core philosophical joints seem to be:
  - What has negative value? (only suffering? aversion? frustrated preferences?)
  - Does positive value exist independently?
  - How do we aggregate harms? (summation? thresholds? worst-first?)
  - Does creating lives with suffering differ from preventing suffering in existing lives?

  The requested cases fit naturally into these categories:
  - Silent stress → probes consciousness requirement
  - Wanted burn → tests if disvalue is in sensation or aversion
  - Erased agony → questions personal identity/enduring harm
  - Static → challenges aggregation methods
  - Consolation → examines positive value's role
  - One-bad-hour → tackles creation asymmetry

  For the diagnostic structure, I'll prioritize branching order that maximizes splitting power:
  1. Start with "is unconscious stress bad?" - this immediately separates biological vs experiential views
  2. Then "wanted burn" - splits sensation-focused from aversion-focused
  3. "Erased agony" next - distinguishes between enduring self and momentary suffering views
  ...and so forth

  The "static" case will be crucial for aggregation methods - it's where lexical/threshold/summing views diverge most dramatically. I'll place it after core value questions but before creation cases since aggregation applies to both prevention and creation.

  For leaves, I anticipate ~10 coherent positions including:
  - Strong NU (summed suffering only)
  - Tranquillism (conscious suffering only)
  - Negative leximin
  - Asymmetric views 
  ...plus some unnamed but logically possible combos

  Each leaf will get:
  - Standard name (if any)
  - One awkward implication (e.g. "must prioritize preventing papercuts over existential risks")
  - Likely counterexample that could shift views

  The whole thing must fit one page - so 8-9 questions max, concise cases, minimal exposition. "Silent stress" makes a strong opener since it's visceral and splits the room fast.
answer: |-
  Here's a diagnostic tree built from axiological joints, designed to map positions without relying on labels. Cases are integrated as requested, with branching ordered to maximize distinction. **9 questions** generate **10 leaves** (7 named, 3 unnamed).  

  ---

  ### **Branching Questions**  
  **(Answer Yes/No/Unclear or A/B/C)**  
  1. **Silent Stress Case:** *A body with no consciousness experiences cortisol spikes and tissue damage. Is this state intrinsically bad?*  
     - **A:** No (requires consciousness)  
     **B:** Yes (biological harm counts)  

  2. **Wanted Burn Case:** *Two people feel identical burning sensations: one loves it (would pay to repeat), one is tortured. Is the disvalue identical?*  
     - **A:** No (disvalue depends on aversion/consent)  
     **B:** Yes (sensation itself is bad)  
     *→ If 1A, skip this question (disvalue implies consciousness).*  

  3. **Erased Agony Case:** *After severe suffering, someone is memory-wiped/restored. Does this hour still matter morally?*  
     - **A:** No (harm erased if no trace)  
     **B:** Yes (suffering is bad when it happens)  

  4. **Do Mild Irritations Matter?** *A billion people each feel a barely noticeable itch (forgotten instantly, no cost to avoid). Is this bad?*  
     - **A:** No (too trivial)  
     **B:** Yes (all suffering sums)  
     **C:** Only if intense/conscious  

  5. **Aggregation Threshold:** *Can enough minor pains (e.g., papercuts) ever outweigh intense agony (e.g., torture)?*  
     - **A:** Never (intensity dominates)  
     **B:** Yes, if summed  
     **C:** Only if minor pains cross an intensity threshold  

  6. **Consolation Case:** *World A: Suffering with no positives. World B: Identical suffering but with comfort/joy. Is B better?*  
     - **A:** Yes (positives add value)  
     **B:** No (only suffering matters)  
     **C:** Worse (positives extend life/desire)  

  7. **Is *Preventing* Badness the Only Moral Imperative?**  
     - **A:** Yes  
     **B:** No (e.g., creating happiness matters too)  

  8. **One-Bad-Hour Life:** *Create a person with net-positive life but one hour of agony, or no one?*  
     - **A:** Better not to create  
     **B:** Better to create  

  9. **Person-Affecting Default:** *Is harm only bad if someone exists to experience it?*  
     - **A:** Yes (no harm in nonexistence)  
     **B:** No (impersonal badness exists)  

  ---

  ### **Leaves & Commitments**  
  1. **Strong Negative Utilitarianism (NU)**  
     - *Answers:* 1A, 2B, 3B, 4B, 5B, 6B, 7A, 8A, 9B  
     - **Awkward:** Must prioritize preventing vast numbers of minor itches over a single torture.  
     - **Move off:** Static case (if convinced trivial pains don’t sum).  

  2. **Tranquillism**  
     - *Answers:* 1A, 2A, 3B, 4A, 5A, 6B, 7A, 8A, 9B  
     - **Awkward:** Erased agony still matters—even if victim doesn’t remember.  
     - **Move off:** Wanted burn (if aversion is necessary for disvalue).  

  3. **Negative Prioritarianism**  
     - *Answers:* 1A, 2A/B, 3B, 4C, 5C, 6B, 7A, 8A, 9A/B  
     - **Awkward:** Aggregation threshold is arbitrary (e.g., why *this* pain level?).  
     - **Move off:** Consolation case (if positives offset suffering).  

  4. **Negative Leximin**  
     - *Answers:* 1A, 2A/B, 3B, 4A/C, 5A, 6B, 7A, 8A, 9B  
     - **Awkward:** Silent stress isn’t bad—even if biologically identical to suffering.  
     - **Move off:** Static case (if any summed minor pains outweigh worst-off).  

  5. **Asymmetric View (Benatar-style)**  
     - *Answers:* 1A, 2A, 3B, 4B, 5B, 6B, 7A, 8A, 9A  
     - **Awkward:** Creating a happy life is *not* good, but not creating it *is* good.  
     - **Move off:** One-bad-hour (if net-positive lives are permissible).  

  6. **Weak NU**  
     - *Answers:* 1A/B, 2A/B, 3B, 4B, 5B, 6A, 7B, 8B, 9A/B  
     - **Awkward:** Consolation *improves* a world with fixed suffering—but suffering is paramount.  
     - **Move off:** If prevention is sole imperative (7A).  

  7. **Preference-Hedonic Hybrid**  
     - *Answers:* 1A, 2A, 3A, 4A/C, 5A/C, 6A, 7B, 8B, 9A  
     - **Awkward:** Erased agony isn’t bad—even if horrific in the moment.  
     - **Move off:** If impersonal badness exists (9B).  

  8. **Unnamed: Biological Harm Minimization**  
     - *Answers:* 1B, 2A/B, 3B, 4B, 5B, 6B, 7A, 8A, 9B  
     - **Awkward:** Silent stress is as bad as conscious agony.  
     - **Move off:** Consciousness requirement (1A).  

  9. **Unnamed: Aversion-Only Threshold**  
     - *Answers:* 1A, 2A, 3A, 4A, 5A, 6B, 7A, 8A, 9B  
     - **Awkward:** Erased agony *and* static pains don’t matter.  
     - **Move off:** If momentary suffering has disvalue (3B/4B).  

  10. **Unnamed: Impersonal Summing**  
      - *Answers:* 1B, 2B, 3B, 4B, 5B, 6A, 7B, 8B, 9B  
      - **Awkward:** Silent stress + minor pains outweigh creating happy lives.  
      - **Move off:** If consciousness is required (1A).  

  ---

  ### **Empty Branches**  
  - **"1A + 1B"**: Incoherent (consciousness can’t be both required and irrelevant).  
  - **"3A + 4B"**: Unattractive (erased agony doesn’t matter, but static pains do).  
  - **"6B + 7B"**: Rare (positives matter *unless* suffering exists).  
  - **"8B + 9A + 7A"**: Unoccupied (prevent suffering only, but create net-positive lives).  

  ### **Indistinguishable Leaves**  
  - **Tranquillism** and **Aversion-Only Threshold** collapse if Q4=Q5=A.  
  - **Strong NU** and **Biological Harm Minimization** collapse if Q1=B.  

  ---

  ### **Scoring Key**  
  | Leaf                          | Signature Answers                     |  
  |-------------------------------|---------------------------------------|  
  | Strong NU              | 4B, 5B, 6B, 7A, 8A                   |  
  | Tranquillism           | 2A, 4A, 5A                           |  
  | Negative Prioritarianism | 4C, 5C                               |  
  | Negative Leximin       | 5A                                   |  
  | Asymmetric View        | 8A + 9A                              |  
  | Weak NU                | 6A + 7B                              |  
  | Preference-Hedonic     | 3A + 8B                              |  
  | Biological Harm        | 1B                                   |  
  | Aversion-Only Thresh.  | 3A + 4A + 5A                         |  
  | Impersonal Summing     | 1B + 6A + 7B + 8B                    |  

  ### **Best Opening Question**  
  **Q1 (Silent Stress)** — splits the room instantly:  
  - **Yes (1B)**: Biological harm matters (minority).  
  - **No (1A)**: Requires consciousness (majority).  
  This forces clarity on the *nature* of disvalue before aggregation or creation.  

  ---

  **Format note:** Fits one page if printed in 10pt font. Questions avoid jargon; cases use plain descriptors (e.g., "silent stress" instead of "unconscious stress response").
