      *Reached from:* Any "assign only decisions" answer.  
      *Commitment:* Decisions are made using expected utility, not credences (e.g., SIA or SSA applied to actions).  
      *Awkward commitment:* Cannot express beliefs about reality—only actions.  
    - **Leaf 1: Consistent Halfer**  
      *Reached from:* Node 3A.  
      *Commitment:* No indexical updating ever; physical evidence only.  
      *Awkward commitment:* In Unborn Crowd, ignores "alone" as evidence even though it distinguishes worlds.  
    - **Leaf 2: Inconsistent Halfer**  
      *Reached from:* Node 3B or 3C.  
      *Commitment:* No indexical update in SB/Incubator, but updates in Unborn Crowd.  
      *Awkward commitment:* Arbitrary: why update in one asymmetric case but not others?  
    - **Leaf 3: Halfer in SB, SSA in Incubator**  
      *Reached from:* Node 1B.  
      *Commitment:* Mixed model; reference class varies (temporal in SB, observer-count in Incubator).  
      *Awkward commitment:* Why shift reference class? No clear principle.  
    - **Leaf 4: Naive Self-Sampling**  
      *Reached from:* Node 1C or Node 2C.  
      *Commitment:* Samples observers without conditioning on indexical evidence (e.g., ignores black beard).  
      *Awkward commitment:* In Incubator, gets 1/3 for heads even with black beard—clearly wrong.  
    - **Leaf 5: Self-Indication Assumption (SIA)**  
      *Reached from:* Node 2A.  
      *Commitment:* Credence proportional to prior × observer count. Endless Room: infinite observers → P(infinite) = 1. Doomsday: neutralizes "early birth rank" evidence.  
      *Awkward commitment:* Presumptuous Philosopher: if a universe with 1 trillion observers is 1% physically less likely than one with 1 million, SIA still favors the trillion.  
    - **Leaf 6: Self-Sampling Assumption (SSA)**  
      *Reached from:* Node 2B.  
      *Commitment:* You are a random observer from the reference class. Endless Room: cannot normalize; often defaults to physical evidence (P(infinite) = 1/2). Doomsday: "early birth rank" → favors doom.  
      *Awkward commitment:* Reference-class arbitrariness. Endless Room: if forced, either undefined or defaults without update.

