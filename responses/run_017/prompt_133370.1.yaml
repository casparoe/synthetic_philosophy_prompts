prompt: |-
  I need your help preparing for a two-hour session with our Allocation Methods Committee next Thursday, at which I am asking them to replace the rule we use to rank candidate funding allocations.

  The setting: I work at a public research-funding agency with roughly 400 million dollars of discretionary money per cycle, paid out in about two hundred awards. Realised value is extremely skewed — a small handful of awards account for most of what the agency ever accomplishes — and our outcome estimates are noisy, model-based, and in many cases little better than order-of-magnitude guesses.

  The proposal. We currently rank allocations by expected value over a common numeraire (say QALYs, or dollars of social value), with an informal overlay: program officers are told not to let any one theme absorb too much of the cycle and to keep a few long-shot awards in every round. I want to replace both the expected-value rule and the overlay with one explicit rule: value each candidate allocation by risk-weighted expected utility, defined as follows. Rank an allocation's possible outcomes from worst to best; walk up the ranking and weight each utility increment by r applied to the probability of doing at least that well, where r is an increasing function from [0,1] onto [0,1]. Because r need not be the identity, this keeps statewise dominance and transitivity while giving up the independence axiom, so Allais-style choices become permissible rather than axiomatic errors.

  Three further specifications matter, and I expect them to be where the fighting happens:

  One, I take utility in the numeraire to be linear and put all risk attitude into r, parametrised as r(q) = q^k with k above 1, so that increments in the upper tail count for less than their probability. k is to be calibrated by putting a dozen or so binary choices between a sure cohort-level outcome and a gamble to the committee itself; pilot runs land between about 1.3 and 1.6, and I intend to report every recommendation for the whole range k between 1 and 2.

  Two, r is applied once, to the distribution of total cohort value, and not award by award. The risk function does not decompose additively across independent awards, and the two orderings differ sharply: applied award by award the variance penalty grows roughly with the number of awards, applied to the cohort distribution it grows roughly with its square root, which at our scale is a difference of more than an order of magnitude.

  Three, a carve-out. Ten to fifteen awards per cycle are genuinely one-shot — an observation window that closes, an outbreak that will have run its course, a field season that cannot be rescheduled. For these the diversification that dilutes risk aversion at cohort level is not available, so I want them weighted on their own rather than pooled.

  The room. Two microeconometricians who run field experiments and whose default is to maximise expected social value; our chief statistician, a Bayesian who will care about what is identifiable and what is not; one former reinsurance pricing actuary, who is sympathetic to risk aversion in principle but will insist that institutions manage risk with capital requirements and risk measures rather than with preferences; three program directors who are attached to the balance overlay and who will read any risk-averse rule as an attack on high-variance, high-upside work; and one board member with a decision-theory background who will know the framework and press the technical objections. Assume I know the literature, so I need no citations, references, or suggested reading.

  Please give me a preparation sheet with these five sections, in this order and at roughly these lengths:

  1. "Where the room is" — about 150 words. Who speaks first, which blocs align with which, what each group is actually protecting, and which objection is likely to be raised by someone other than the person I expect it from.

  2. "The objections, in the order they will come" — about 900 words. Eight objections, ordered by how likely and how damaging they are rather than by whose they are. For each: who raises it; the objection in that person's own vocabulary and idiom, not in mine; a rough damage ranking; the reply I should give in about two minutes; and one line on where that reply is soft or question-begging. I would rather have the two or three genuinely dangerous objections treated at length than all eight treated evenly.

  3. "What I should concede before anyone asks" — about 200 words. The points I should give away in the first five minutes so that I am not forced into them later, and how to concede them without conceding the proposal.

  4. "The reply that has to land" — about 250 words. The single response on which the proposal stands or falls, what it has to establish, and how it fails if it is delivered badly.

  5. "The question I am hoping nobody asks" — about 200 words. My own guess is that it concerns whether the agency's soft ruin state — the fact that a cycle with no visible successes invites a budget cut that forecloses later cycles — is a feature of the world, which belongs in the model, or a feature of our attitudes, which is then just being relocated into r. Tell me if that is the right thing to fear and, if it is, what I should say if it comes anyway. Override my guess if you think something else is worse for me.
reasoning: |-
  Okay, the user is preparing for a critical committee meeting about changing their funding allocation methodology. Let me unpack this carefully.

  First, the context: They're at a research funding agency with $400M to allocate across ~200 awards. The current system ranks by expected value (likely QALYs or social dollars) with informal adjustments for portfolio balance. The proposed shift is to risk-weighted expected utility applied at the cohort level, with specific parameters and carve-outs. 

  The committee composition is complex - microeconomists, a Bayesian statistician, an actuary, program directors, and a decision theorist. Each brings different concerns: economists will fight deviations from expected value maximization, program directors fear losing their balancing role, the actuary will question why risk isn't managed institutionally, and the decision theorist will probe technical weaknesses.

  For the preparation sheet, I need to:
  - Map the room dynamics: Who aligns with whom? The microeconomists and actuary might unite against "behavioral" adjustments, while program directors could split - some seeing RWEU as legitimizing their overlay, others as a threat.
  - Anticipate objections in likely order: The first three will be foundational (why deviate from EV? why cohort-level? why not VaR?). The reinsurance objection and "anti-moonshot" concern are the most dangerous because they attack core philosophy. Need detailed counters.
  - Preemptive concessions: Should surrender on identifiability (acknowledge estimates are noisy) and retain some program officer discretion. Frame as "this system codifies your current judgment."
  - The crucial reply: Must establish that cohort-level application isn't a math trick but reflects actual risk pooling. If this fails, variance penalties become politically untenable.
  - The nightmare question: Whether "soft ruin" (budget cuts after bad cycles) belongs in the model or r(q). This exposes a fatal ambiguity - is risk aversion institutional or methodological? 

  The user's guessed nightmare question is spot-on. If asked, I'd advise them to: 1) Acknowledge it's both real and perceptual 2) Note r(q) already captures consequences of ruin 3) Stress that avoiding all downside risk would cripple upside potential. But it's a minefield - conceding it's "real" validates the actuary's institutional approach, while calling it "attitudinal" makes RWEU seem arbitrary.

  Biggest risk: The committee fragments with economists and actuary demanding formal risk capital models, program directors clinging to informal balance, and the decision theorist picking at parametrization. Need to position RWEU as the middle path that systematizes current practice.
answer: |-
  Here’s your preparation sheet, structured as requested:

  ---

  ### **1. Where the Room Is** (150 words)  
  The microeconometricians will lead, framing risk aversion as "behavioral error" and pushing pure expected value (EV). They’ll ally with the actuary, who sees risk as a capital management problem, not a preference. The program directors split: two fear RWEU will penalize high-variance "moonshots," while one might see it as legitimizing their overlay. The Bayesian statistician will obsess over model uncertainty contaminating RWEU’s inputs. The decision theorist will pounce on technicalities (e.g., "Why not Choquet integrals?"). Unexpectedly, the actuary may echo program directors on "killing outliers," reframing diversification as capital efficiency. **Key alignment:** Microeconometricians + actuary on "institutional, not preferential, risk management"; program directors + decision theorist on operational feasibility. **Hidden friction:** Statistician’s identifiability concerns might be weaponized by EV purists.

  ---

  ### **2. The Objections, in Order** (900 words)  
  **(1) "Why abandon EV? Noise in estimates doesn’t justify behavioral heuristics."**  
  *Who:* Microeconometricians. *Damage:* ★★★ (Core philosophy).  
  *Reply:* "We’re not rejecting EV—we’re generalizing it. When outcomes are skewed and noisy, EV alone ignores catastrophic risk. RWEU with *k* > 1 is equivalent to a rational agent pricing tail risk, like a reinsurer demanding higher premia for catastrophe bonds. Our pilots show committees *consistently* deviate from EV—this systematizes that."  
  *Soft spot:* Assumes committee preferences are coherent; doesn’t prove RWEU is "right."  

  **(2) "Risk belongs in capital reserves, not utility. Set a VaR threshold instead."**  
  *Who:* Actuary. *Damage:* ★★★★ (Undermines RWEU’s premise).  
  *Reply:* "Capital buffers can’t fix a cycle with no wins—our ‘ruin’ is reputational, not financial. A 10% budget cut after a bad cycle loses more value than RWEU’s penalty. VaR is blind to tail gains; RWEU balances protection and upside."  
  *Soft spot:* Conflates financial and epistemic risk; doesn’t quantify "reputational ruin."  

  **(3) "Cohort-level application is arbitrary. Why not award-level diversification?"**  
  *Who:* Decision theorist. *Damage:* ★★ (Technical credibility).  
  *Reply:* "Award-level RWEU over-penalizes variance. If projects are independent, cohort volatility grows with √N, not N. Pooling mimics how society experiences our output—total good, not atomized failures. Your way would defund all high-variance work."  
  *Soft spot:* Assumes independence; ignores correlated shocks (e.g., pandemics).  

  **(4) "This kills moonshots! High-k favors ‘safe mediocrity’."**  
  *Who:* Program directors. *Damage:* ★★★★★ (Political death).  
  *Reply:* "Actually, RWEU *protects* moonshots. Under EV, a 1%-chance-of-100x project loses to a 100%-chance-of-1.05x project. With *k*=1.5, the moonshot wins if its upside >50x. Our carve-out for one-shots further shields them."  
  *Soft spot:* Silent on whether "50x" is feasible given noisy estimates.  

  **(5) "r(q)=qᵏ is arbitrary. Why not prospect theory or RDU?"**  
  *Who:* Decision theorist. *Damage:* ★ (Theoretical).  
  *Reply:* "Power weighting is parsimonious, tractable, and nests EV (k=1). We calibrate *k* to *your* revealed preferences—it’s your risk aversion, not ours. Fancier models add parameters we can’t identify."  
  *Soft spot:* Ignores probability weighting’s cognitive basis.  

  **(6) "Model error swamps risk weighting. Garbage in, garbage out."**  
  *Who:* Statistician. *Damage:* ★★ (Practical).  
  *Reply:* "Agreed—but if models are noisy, EV is *also* garbage. RWEU at least penalizes projects where uncertainty is asymmetric (e.g., all downside). We’re piloting model-averaging to harden inputs."  
  *Soft spot:* No silver bullet for model error.  

  **(7) "The carve-out contradicts your ‘pooling’ argument."**  
  *Who:* Decision theorist. *Damage:* ★ (Hypocrisy charge).  
  *Reply:* "One-shots lack the portfolio effect—they *are* the cohort. For them, award-level RWEU *is* cohort-level. This isn’t inconsistency; it’s context."  
  *Soft spot:* Blurs "one-shot" definition (correlation risk remains).  

  **(8) "This overrides program officers’ judgment."**  
  *Who:* Program directors. *Damage:* ★★ (Trust).  
  *Reply:* "It codifies judgment. Your ‘balance overlay’ is implicit RWEU. Now we’ll formalize it, calibrate it, and apply it consistently. You still override in extremis—we’re not automating ethics."  
  *Soft spot:* "Implicit RWEU" is post hoc storytelling.  

  ---

  ### **3. What to Concede Early** (200 words)  
  Open by conceding:  
  - **"Our models are weak."** *Tactic:* "RWEU doesn’t solve this—but unlike EV, it doesn’t *amplify* estimation error. We’ll tighten models separately."  
  - **"Program officers retain discretion."** *Tactic:* "RWEU is a ranking tool, not a straitjacket. Officers can still reject recommendations with written justification, preserving their role."  
  - **"k=1 is still an option."** *Tactic:* "We’ll report all *k*∈[1,2]. If you choose *k*=1, we revert to EV—but let’s not preempt your own preference data."  
  *Why:* Disarms statistician’s "garbage in" and directors’ "automation fear" early. Shows flexibility without gutting the proposal.  

  ---

  ### **4. The Reply That Has to Land** (250 words)  
  **When challenged on cohort-level vs. award-level RWEU:**  
  "We pool because society doesn’t care *which* project fails—only if *total* value crashes. Award-level RWEU assumes each award’s risk is isolated, but our reputation rises or falls on the whole portfolio. If you penalize variance per award, you penalize a cohort of N awards N times more than their aggregate risk justifies. That’s why award-level RWEU would make high-variance work mathematically unviable—even if 99% of its risk diversifies away. Cohort-level application correctly scales the penalty with √N, not N. At our scale (N=200), that’s a 14-fold difference in risk adjustment. This isn’t a technicality—it’s what lets us fund moonshots *without* beggaring the portfolio."  
  *Why it fails if botched:* If you can’t crisply explain the √N vs. N scaling, the actuary labels it "statistical sophistry," and directors panic about "hidden bias against bold ideas."  

  ---

  ### **5. The Question You Hope Nobody Asks** (200 words)  
  **Your guess is correct:**  
  *"Is ‘soft ruin’ (budget cuts after bad cycles) a real loss of value—to include in outcome models—or just our risk aversion, relocated into r(q)?"*  
  **Why it’s lethal:** If "real," EV should model it directly, making RWEU redundant. If "attitudinal," the actuary argues it’s unprincipled to bake institutional fragility into preferences.  
  **Reply if asked:**  
  "Both. The budget cut *is* a real loss (model it as a 10% value haircut after catastrophes). But RWEU’s *k*>1 also captures our aversion to triggering that loss. Crucially, EV can’t easily model this: the cut depends on *perceived* failure, not true outcomes. RWEU accepts that our preferences reflect political reality—without requiring unmeasurable causal estimates."  
  **Override:** A worse question is *"Why not use a proper risk measure like TVaR?"* Reply: "TVaR ignores upside. We *want* upside exposure—just not at all costs. RWEU balances tail protection and opportunity seeking; TVaR doesn’t."  

  ---  
  **Final tip:** Let the decision theorist interrupt early—they’ll feel heard and may switch from critic to ally on technical points.
