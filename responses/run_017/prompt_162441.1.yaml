  Based on your constraints and cases, I've constructed a diagnostic decision tree that prioritizes concrete system evaluations over abstract definitions. The tree starts by testing your capacity-vs-track-record hypothesis as the root node (it held under scrutiny), then branches along three additional dimensions that emerged from the logical space analysis. The tree uses only your specified cases, requires no prior knowledge, and has 10 total questions (each with 2–3 options), but no user answers more than 6 questions to reach a leaf. Load-bearing questions are marked with **(!)**.

  ### Logical Space Analysis
  The tree is built from four binary dimensions derived from your committee's cases and the target positions. Combinations are exhaustive, but some are unattractive or incoherent:
  1. **Capacity vs. Track Record (D1)**: Root node. Determines whether intelligence requires *actual success* (track record) or can exist as *unexercised potential* (capacity). This split explains disagreements about the Simulator (capacity-friendly) and Apprentice (track record-skeptical).  
  2. **Generalization vs. Local Optimization (D2)**: Does intelligence require robustness to novel situations, or is domain mastery sufficient? Separates psychometric/general-factor views from goal-achievement/rationalist views.  
  3. **Centralized vs. Distributed Agency (D3)**: Must intelligence reside in a single agent, or can it emerge from systems without central control? Isolates distributed/collective views.  
  4. **Adaptation vs. Fixed Competence (D4)**: Is the *ability to improve* essential to intelligence, or can static systems qualify? Divides sample-efficiency views from others.  

  | Combination (D1–D4)                      | Viability          | Why Unoccupied/Attractive                                                                                          |
  |------------------------------------------|--------------------|--------------------------------------------------------------------------------------------------------------------|
  | Capacity + Local + Distributed + Fixed   | Unoccupied         | Incoherent: Distributed systems (e.g., Colony) inherently adapt via local rules; fixed competence contradicts this. |
  | Track Record + General + Centralized + Fixed | Unattractive     | No major view defends: Why value generalization (e.g., Brittle Specialist failing) if system can't adapt?          |
  | Capacity + General + Distributed + Fixed | Unoccupied         | Incoherent: Fixed competence conflicts with generalization in novel collective environments (e.g., Colony).        |
  | Track Record + Local + Centralized + Adaptation | Occupied        | Goal-achievement view: Values domain mastery (Local) and rewards systems that actively improve (Adaptation).       |

  - **Bedrock Intuition**: The capacity/track record split (D1) cannot be resolved further. It reflects a fundamental divide in whether intelligence is a *dispositional property* (like solubility) or a *historical achievement* (like a championship). No case forces agreement; it's a philosophical commitment.

  ### Diagnostic Decision Tree
  **Instructions**: Answer based on your intuitive judgment of whether each system is "intelligent." Ignore labels or theories. Questions are independent and concrete.

  1. **(!) Root Question: Capacity vs. Track Record**  
     *Case: Simulator That Never Acts*  
     A system perfectly simulates any counterfactual outcome in its environment but never acts or produces real-world effects. Is it intelligent?  
     - **A) Yes** → It demonstrates understanding through simulation (go to Q2).  
     - **B) No** → Intelligence requires actual outcomes in the world (go to Q5).  

  2. **Capacity Branch: Generalization vs. Local Optimization**  
     *Case: Brittle Specialist*  
     A system excels within its training domain but fails catastrophically on novel problems just outside it. Is it intelligent?  
     - **A) Yes** → Its domain mastery suffices (go to Q3).  
     - **B) No** → Intelligence requires robustness to novel situations (go to Q4).  

  3. **Capacity/Local Branch: Adaptation vs. Fixed Competence**  
     *Case: Self-Rewriting Apprentice*  
     A system is mediocre at current tasks but can rewrite its learning procedures to improve at an accelerating rate. Is it intelligent *now*?  
     - **A) Yes** → Its capacity to self-improve is key (→ **Sample-efficiency view**).  
     - **B) No** → It needs higher current competence (→ **Goal-achievement view**).  

  4. **Capacity/Generalization Branch: Centralized vs. Distributed Agency**  
     *Case: The Colony*  
     Simple agents with local rules collectively solve novel problems with no central model. Is the *collective system* intelligent?  
     - **A) Yes** → Intelligence emerges from the group (→ **Distributed/collective view**).  
     - **B) No** → Intelligence requires centralized agency (go to Q8).  

  5. **Track Record Branch: Generalization vs. Local Optimization**  
     *Case: Closed-Domain Virtuoso**  
     A system is superhuman within one sealed domain (e.g., a game) but a lookup table elsewhere. Has it demonstrated intelligence?  
     - **A) Yes** → Its domain performance counts (go to Q6).  
     - **B) No** → Intelligence requires generalization across domains (go to Q7).  

  6. **Track Record/Local Branch: Adaptation vs. Fixed Competence**  
     *Case: Archivist**  
     A system retrieves and recombines knowledge from a vast corpus but never generates novel output. Has it demonstrated intelligence?  
     - **A) Yes** → Effective recombination is sufficient (→ **Predictive-modeling view**).  
     - **B) No** → Intelligence requires novelty/creation (→ **Goal-achievement view**).  

  7. **Track Record/Generalization Branch: Centralized vs. Distributed Agency**  
     *Case: The Lattice**  
     A router directs problems to specialized subsystems, enabling the composite to solve tasks none were built for. Has it demonstrated intelligence?  
     - **A) Yes** → The system’s overall capability matters (→ **Resource-bounded processing view**).  
     - **B) No** → Intelligence requires integrated, not modularized, capabilities (go to Q9).  

