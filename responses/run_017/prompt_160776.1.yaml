prompt: |-
  My mate does a history podcast, and at the end of every episode she does this bit where she rules on whether some non-human thing gets to be a *character* in the story or is just part of the *setting*. Her calls so far:

  - yellow fever killing most of Napoleon's expeditionary force in Saint-Domingue while barely touching the rebels — character
  - Tambora and the year without a summer, failed harvests and bread prices all over Europe — setting (its moved prices, not people)
  - mosquitoes in Panama: the French canal company collapses, the Americans get through once they drain and screen — character
  - the potato blight in Ireland — character
  - the Little Ice Age and all the wars and rebellions of the seventeenth century — setting (a trend isn't a who)
  - salt building up in the irrigated fields of ancient Mesopotamia — setting (that's just them doing it to themselves)
  - antibiotic resistance in hospitals since the mid twentieth century — character (it learns)

  The one she hasn't ruled on yet is myxomatosis, let loose on purpose in Australia in the 1950s to kill rabbits. It wiped out a huge share of them, then the virus got less lethal and the rabbits got more resistant, so the ending wasn't the one anybody planned. Character or setting?

  I sort of think she's asking whether a thing shifts the balance between the sides rather than just raising the cost for everyone, but I can see at least two other rules that fit her track record just as well, and they don't all say the same thing about the rabbit virus. Set out the rules that fit the seven calls above, say which one you'd bet she's actually running and why, give me your guess at her verdict, and name the case you'd want her to rule on next to tell the rules apart. One more thing: she keeps insisting that whatever she's doing, it isn't "environmental determinism" — does that constraint do any real work in her rule, or is it just a warning label she sticks on at the end?
reasoning: |-
  Hmm, the user wants me to analyze their friend's podcast rules for determining whether non-human elements in history are "characters" or "setting." They've provided seven examples of their friend's rulings and want me to extract the underlying rules, predict how their friend would rule on myxomatosis in Australia, and determine what role the "environmental determinism" disclaimer plays.

  Looking at the examples, I can see several patterns emerging. Yellow fever is a "character" because it disproportionately affected Napoleon's forces over the rebels. Tambora is "setting" because it raised costs (bread prices) for everyone without shifting power dynamics. Mosquitoes in Panama are "character" since they collapsed one company but enabled another's success. Potato blight is "character" as it devastated Ireland specifically. The Little Ice Age is "setting" because it was a broad trend affecting many regions. Salt accumulation in Mesopotamia is "setting" as it was self-inflicted. Antibiotic resistance is "character" because it actively adapts.

  I notice three potential rules that fit these decisions:
  1) Agency Rule: Does the element act with purpose or adapt? (Fits antibiotic resistance learning, but struggles with passive elements like potato blight)
  2) Asymmetry Rule: Does it disproportionately affect sides? (Fits yellow fever favoring rebels, mosquitoes harming French more than Americans)
  3) Interactivity Rule: Does it change its effect based on actions? (Fits antibiotic resistance evolving, rabbits/virus co-evolving)

  The Asymmetry Rule seems strongest as it explains every case clearly - determining who wins or loses rather than just making things harder for everyone. For myxomatosis, it was introduced intentionally but evolved unpredictably, disproportionately affecting rabbits and shifting ecological balances - so likely "character."

  The environmental determinism disclaimer seems crucial - she's avoiding claims that environment mechanically determines outcomes, emphasizing instead how humans respond to challenges. This fits how she frames agency in the asymmetry rule.

  For a test case, I'd propose the 1918 Spanish Flu during WWI - did it simply raise costs (setting) or shift outcomes (character)? This would clarify the rules since it affected both sides but potentially altered military capacities asymmetrically.

  The user seems intellectually curious, enjoying this conceptual game while supporting their friend's podcast. They're perceptive about spotting multiple plausible patterns. I'll structure my response to clearly outline the rules, defend my choice of asymmetry as primary, predict the myxomatosis ruling, and explain how the disclaimer shapes her approach.
answer: |-
  Based on your mate's rulings and her "not environmental determinism" disclaimer, here are the rules that fit the seven calls, along with the prediction, verdict, test case, and analysis of the disclaimer:

  **Rules That Fit the Seven Calls:**

  1.  **The Asymmetry Rule:** *Is the non-human element's impact asymmetrical, favoring one side/group/outcome over others in a conflict or struggle?* (Character = Yes, Setting = No)
      *   Fits: Yellow Fever (favored rebels), Mosquitoes (crippled French, Americans adapted), Potato Blight (devastated Irish peasants disproportionately), Antibiotic Resistance (favors microbes over humans). Fails as Setting: Tambora (equal pressure), Little Ice Age (broad trend, no specific "side"), Mesopotamian Salt (self-inflicted degradation, no external "side").
  2.  **The Interactive Agency Rule:** *Does the non-human element actively adapt, evolve, or respond dynamically to human actions in a way that changes the outcome?* (Character = Yes, Setting = No)
      *   Fits: Mosquitoes (Americans *responded* with draining/screening), Antibiotic Resistance (explicitly "learns"/evolves). Fails as Setting: Yellow Fever (impact was static virulence, not adaptation *during* events), Potato Blight (ravaged statically, no noted adaptation *during* famine), Tambora (one-off event), Little Ice Age (slow trend), Mesopotamian Salt (passive accumulation). *Weak on Yellow Fever/Potato Blight?*
  3.  **The Intentional Leverage Rule:** *Is the non-human element used intentionally by one side as a tool/weapon, OR does its behavior force a significant strategic adaptation from the actors?* (Character = Yes, Setting = No)
      *   Fits: Mosquitoes (Americans adapted strategy), Antibiotic Resistance (forces medical adaptation). *Partially fits* Yellow Fever (rebels may have leveraged environment, but virus wasn't *used*), Potato Blight (British policies were a response, but blight itself wasn't leveraged). Fails as Setting: Tambora (no leverage/adaptation noted), Little Ice Age (no specific leverage), Mesopotamian Salt (unintended consequence, not leveraged).

  **Which Rule She's Likely Running & Why:**

  *   **Bet on the Asymmetry Rule.** It provides the cleanest, most consistent fit across *all seven* rulings:
      *   **Character:** Yellow Fever (asymmetric impact rebels > French), Mosquitoes (asymmetric impact French > Americans who adapted), Potato Blight (asymmetric impact Irish > landlords/British), Antibiotic Resistance (asymmetric impact microbes > humans).
      *   **Setting:** Tambora (symmetric pressure on prices/populations), Little Ice Age (broad symmetric pressure, trend not picking sides), Mesopotamian Salt (self-inflicted degradation, no sides).
  *   It directly addresses the core historical question of *who wins/loses* and *shifting power balances*, avoiding passive descriptions.
  *   The "moved prices, not people" (Tambora) and "trend isn't a who" (Little Ice Age) comments strongly emphasize the need for differential impact on identifiable groups/outcomes in a struggle.

  **Prediction for Myxomatosis (Rabbit Virus in Australia):**

  *   **Verdict: Character.**
  *   **Reasoning (Under Asymmetry Rule):** The impact was profoundly asymmetric. It was deliberately introduced *as a weapon* against rabbits. While the outcome (co-evolution) was unintended, the virus fundamentally shifted the balance of power in the human-rabbit conflict – first massively favoring humans, then evolving into a new equilibrium favoring neither side entirely but drastically altering the rabbit population and the ecological/economic landscape. It didn't just raise costs; it decisively changed the terms of engagement and the trajectory of the conflict.

  **Test Case to Distinguish Rules:**

  *   **Proposed Case: The Dust Bowl (1930s USA).**
  *   **Why it Distinguishes:**
      *   **Asymmetry Rule:** Did it impact poor farmers/Okies *disproportionately* vs. agribusiness/banks/government? (Likely Character). Or was it a symmetric environmental disaster hitting all farmers equally? (Likely Setting).
      *   **Interactive Agency Rule:** Did the land/drought/wind *respond* dynamically to farming practices in a novel way forcing new adaptations during the crisis? (Character) Or was it a passive consequence of known poor practices meeting predictable drought? (Setting).
      *   **Intentional Leverage Rule:** Was the dust/drought *used* as a tool by banks to foreclose, or by the government to promote New Deal policies? Or did it simply force adaptations like migration/soil conservation? The line between forced adaptation and leverage is blurry here.
      *   Her ruling would clarify which dynamic (differential impact, interactive response, or leverage/forced adaptation) is paramount.

  **The "Not Environmental Determinism" Disclaimer - Real Work or Warning Label?**

  *   **It Does Real Work.** It's not just a sticker; it's integral to her rule's logic, especially under the favored Asymmetry Rule.
  *   **How it Works:**
      1.  **Rejects Passivity:** Environmental determinism often portrays humans as *passive victims* of environment/climate/disease. Her rule explicitly rejects this. The "Character" designation highlights the non-human element as an active *agent* altering human affairs, but crucially...
      2.  **Requires Human Context:** The asymmetry *only matters* within a human conflict or struggle. Yellow Fever is a Character *because* it impacted a specific human war. Tambora is Setting *because* its impact (price rises) was a broad context, not directly tilting a specific power struggle (though it might have *contributed* to many). The Little Ice Age is a Setting (trend) precisely to avoid saying it *determined* the wars; it was a pressure cooker, but the wars were human choices within that context.
      3.  **Focuses on Interaction:** Her rule forces her to ask *how* the environment interacted with specific human actions and conflicts, not just *that* it caused hardship. Salt in Mesopotamia is Setting because it was the *result* of their own actions (irrigation), not an external agent acting on them. Mosquitoes are Character because the human response (draining/screening) was the critical factor *enabled* by recognizing the asymmetry. Antibiotic Resistance is Character *because* it's a co-evolutionary arms race, not a static force.
  *   **In essence:** Her disclaimer signals that she's looking for non-human elements that become *active participants in human dramas*, altering the plot through asymmetrical effects within those conflicts, *not* as overriding forces that mechanically dictate human destiny regardless of human agency. The asymmetry defines the "participation" within the human story.
