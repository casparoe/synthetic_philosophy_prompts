  5-10 min: Hand out materials. Make sure each team has their own strand and rulebook. Team 1: strand "AAA", rulebook A (which includes COPY-ALL). Team 2: strand "BBA", rulebook B (which has the magic rule for "BBA"). Team 3: strand "AABABA", rulebook A (same as team 1).

  10-35 min: Teams work. The facilitator circulates to answer questions but doesn't give hints. We expect:
  - Team 1: will quickly see that "AAA" means COPY-ALL, and they copy the strand. Done in 2 minutes.
  - Team 2: will see the magic rule and write down the strand. Done in 1 minute.
  - Team 3: will break the strand into triplets, look up each triplet in the rulebook, and append the corresponding string. Takes a little longer, but still only 2 steps. Done in 5 minutes.

  So they all finish early. Then what? They might get bored.

  To make team 3 take more time, give them a longer strand. For example, a strand of 9 letters: "AABABABBA"

  Triplets: "AAB", "ABA", "BBA"

  Operations:
  - "AAB" -> APPEND "AAB"
  - "ABA" -> APPEND "ABA"
  - "BBA" -> APPEND "BBA"

  New strand: "AAB"+"ABA"+"BBA" = "AABABABBA", which is the original.

  This is 9 letters, so they have to do 3 appends.

  Also, we can add more operations and make the mapping not identity for some, but for team 3, the strand uses only the identity mappings.

  But we can have triplets that are not used by team 3 but are in the rulebook.

  Rulebook A (for teams 1 and 3) would list:

  - "AAA": COPY-ALL
  - "AAB": APPEND "AAB"
  - "AAC": ... but we only have A and B? Let's only use A and B.

  We have 8 possible triplets:

  AAA, AAB, ABA, ABB, BAA, BAB, BBA, BBB

  In the rulebook, define:

  - "AAA": COPY-ALL
  - "AAB": APPEND "AAB"
  - "ABA": APPEND "ABA"
  - "ABB": APPEND "ABB"
  - "BAA": APPEND "BAA"
  - "BAB": APPEND "BAB"
  - "BBA": APPEND "BBA"
  - "BBB": APPEND "BBB"

  For team 3, give them a strand that uses only the APPEND triplets, e.g., "AABABAABB" (9 letters: AAB-ABA-ABB)

  Then they will do:
  1. APPEND "AAB" -> "AAB"
  2. APPEND "ABA" -> "AABABA"
  3. APPEND "ABB" -> "AABABAABB"

  Which is the original strand.

  Team 1: "AAA" -> COPY-ALL -> "AAA"

  Team 2: let's give them a different strand, say "ABB" (3 letters), and their rulebook says: "If the strand is exactly 'ABB', then output 'ABB'."

  But "ABB" is in the standard rules as APPEND "ABB", but team 2's rulebook has the magic rule, so they use that.

  To make it take time, we can make the rulebook for team 2 have the magic rule but also have the standard rules, and they might try the standard rules first? But the magic rule says to do it without any further processing.

  In the rulebook for team 2, we can have:

  Rulebook B:
  1. First, check if the strand is one of the following:
     - "BBA": if so, write down "BBA" and stop.
     - "ABB": if so, write down "ABB" and stop.
     (give them one of these, say "ABB")
  2. If not, then break into triplets and apply the standard rules (and then list the standard rules as in rulebook A).

  But to save time, we can make the magic rule very prominent.

  Alternatively, to make team 2's task not instantaneous, give them a strand that is not in the magic rule initially, but then they have to use the standard rules and it doesn't work, and then they might get stuck. But that's not what we want.

  We want team 2 to finish quickly.

   So let's assume all teams finish within 5-10 minutes.

   Then we have extra time. We can have them reflect or we can give them a new challenge.

   But the plan is to have a debrief.

  Predictable issues:
  - Team 3 might try to use COPY-ALL if they see "AAA" in the rulebook, but their strand doesn't have "AAA", so they won't.
  - Someone might freehand: they might just copy the strand without following the rules. The facilitator should prevent that.
  - Biology students might try to interpret it as DNA and transcription, but we ask them to treat it as a mechanical system.
  - A team might finish and start texting: we can have a backup task, such as: "see if you can find another strand that would replicate itself under these rules."

  Debrief (35-60 min):

  Bring everyone together.

  Ask each team to report:
  - Team 1: what was your strand? What did you do? What was the result?
  - Team 2: same.
  - Team 3: same.

  They will all have replicated their strand.

  Then ask: "Do you think all of these methods are equally valid for 'self-replication'? What's the difference?"

  Then guide the discussion:

  - Team 1: the COPY-ALL enzyme. Does it matter what the strand is? It would copy any strand. So the strand itself doesn't carry the information for copying; the enzyme does, and the enzyme is generic.

  - Team 2: the rulebook had a special rule just for their strand. So the rulebook has the information about how to copy that specific strand.

  - Team 3: the strand's sequence was broken down into instructions that then built the same sequence. The rulebook has general rules, and the strand uses those rules to describe itself.

  Then introduce the concepts: 
  - In team 1's case, the self-replication is trivial because the enzyme doesn't rely on the content.
  - In team 2's case, the self-replication is stipulated by an external agent (the rulebook writer).
  - In team 3's case, the self-replication is emergent from the interaction of the strand with the general rules.

  Then make the analogy to Hofstadter and Gödel:
  - In Gödel's theorem, a formal system can encode self-referential statements by using a encoding (like Gödel numbering) that allows the system to talk about its own statements.
  - In team 3's case, the strand is like a statement that, when interpreted by the general rules (the formal system), builds a copy of itself.

  Then reveal the isomorphism to DNA: in DNA, the sequence of nucleotides is used to create proteins (enzymes) that then help in replicating the DNA.

  And in Gödel, the encoding allows the system to create statements about itself.

  Finally, check for understanding:

  Give them a new strand: say "AABAAA" (6 letters) and ask: "If you were to apply the same rules as in rulebook A, would this strand replicate itself? Why or why not? What would happen?"

  Break into triplets: "AAB", "AAA"

  - "AAB" -> APPEND "AAB"
  - "AAA" -> COPY-ALL

  Now, COPY-ALL would copy the entire strand "AABAAA", so the new strand would be "AABAAA". But they might not know what COPY-ALL does on a strand that is not just "AAA"? The rule doesn't specify that COPY-ALL copies the strand it's on, but we should define that.

   In the rulebook, we should define: 
     - COPY-ALL: copy the entire current strand to the new strand, ignoring any previous appends.

  So in this case, after APPEND "AAB", the new strand is "AAB", then COPY-ALL is applied, which overwrites (or replaces) the new strand with the entire original strand "AABAAA". So the result is "AABAAA".

  So it does replicate, but using COPY-ALL. The strand has both a part that appends and then COPY-ALL, but COPY-ALL does the whole job.

  We can ask: "Is this strand self-replicating in the same way as team 1 or team 3?"

  It uses the COPY-ALL enzyme, so it's like team 1.

  Alternatively, give a strand that doesn't have COPY-ALL and is not in the magic rule, and see if it would self-replicate.

   But not all strands will.

  Example: strand "ABB" (3 letters)

  In rulebook A: 
     "ABB" -> APPEND "ABB"

  So it builds "ABB", which is the same. So it does self-replicate.

  But that's because our mapping is identity.

  To have a non-replicating strand, give one that has a triplet not defined to append itself.

  But in our rulebook, every triplet is defined to append itself or do COPY-ALL.

  For "AAA", it does COPY-ALL, which is not appending itself, but it does replicate the strand.

  So let's remove the COPY-ALL for this check and have a different rule for "AAA".

  Revised rulebook for the check: suppose we change the rule for "AAA" to something else.

  But for simplicity, we can use the same rulebook.

   Give them a strand that is not made of triplets that are defined, but we defined all.

   Alternatively, in the check, use a different rulebook.

  But for time, let's not.

   Instead, for the check, ask: "Suppose we have a new rulebook where there is no COPY-ALL, and the only operations are APPEND operations, but the mapping is not identity. For example, 'AAB' means append 'BAA', and 'BAA' means append 'AAB'. Now, would the strand 'AAB' self-replicate? What about 'AAB BAA' (6 letters)?"

  This might be too much.

  Given the complexity, for the check, we can ask:

  "Team 3 used a strand that was built by appending triplets. What if we had a strand that contained the triplet 'AAA'? How would that change the process?"

  Then they might say it would use COPY-ALL.

  Then ask: "Would that be a different kind of self-replication?"

  Session plan:

  Materials:
  - For each team: 
     - Team 1: a strip with "AAA"
     - Team 2: a strip with "ABB" (or "BBA", but let's use "ABB" for team 2)
     - Team 3: a strip with "AABABAABB" (9 letters: AAB-ABA-ABB)
  - Rulebook for teams 1 and 3: 
     - Title: "Enzyme Rules"
     - Instructions: 
          - Break the strand into triplets (groups of 3 letters) from left to right. If the strand length isn't a multiple of 3, ignore the extra letters.
          - For each triplet, find its enzyme operation in the table below and apply it to build the new strand.
     - Table:
          "AAA": COPY-ALL (meaning: set the new strand to be the entire current strand, discarding any previous steps)
          "AAB": APPEND "AAB"
          "ABA": APPEND "ABA"
          "ABB": APPEND "ABB"
          "BAA": APPEND "BAA"
          "BAB": APPEND "BAB"
          "BBA": APPEND "BBA"
          "BBB": APPEND "BBB"
     - Note: APPEND means add the specified string to the end of the new strand. The new strand is initially empty.

  - Rulebook for team 2:
     - Title: "Enzyme Rules (Special)"
     - Instructions:
          - If the strand is exactly "ABB", then write down "ABB" as the new strand and stop.
          - Otherwise, break the strand into triplets and follow the table below (same table as above).

  Timeline:

  0-5 min: Introduction. "Today we are going to simulate a system of strands and enzymes. Each team has a strand and a rulebook. Your task is to apply the rules to the strand to produce a new strand. Work only with what you're given. You have 25 minutes. Go!"

  5-10 min: Distribute materials. Make sure teams are separated.

  10-35 min: Teams work. Facilitator circulates.

  35-45 min: Reports: each team says their strand and what they did and the result.

  45-60 min: Debrief and discussion.

  Debrief points:

  - Team 1 used a general copier (COPY-ALL) that is in the rules. It doesn't matter what the strand is (as long as it contains "AAA" to activate the copier). The strand could be anything and it would be copied. So the strand itself is not carrying the information for self-replication; the rule does.

  - Team 2 had a rule that specifically named their strand. The self-replication was put in by the rulebook writer.

  - Team 3 had a strand that was translated into a set of instructions (enzymes) that then built the strand. The rulebook has general rules, and the strand is a program that uses those rules to build itself.

  - This is analogous to DNA: the DNA contains instructions for building proteins, and some of those proteins are involved in copying the DNA.

  - In Gödel's theorem, we have a formal system that can encode statements about itself by using a code (like Gödel numbering). The system can then make a statement that says "this statement is unprovable", which is analogous to a strand that contains the instructions for building a copy of itself.

  Finally, the check:

  Ask: "Suppose we have a new strand: 'AAAABA' (6 letters). Using the rulebook that teams 1 and 3 had, would this strand replicate itself? How?"

  Break into triplets: "AAA", "ABA"
  - "AAA": COPY-ALL -> copies the entire strand, so new strand = "AAAABA"
  - "ABA": would be APPEND "ABA", but COPY-ALL overwrites everything, so it doesn't matter.

  So it does replicate, but using COPY-ALL.

  Ask: "Is this more like team 1 or team 3?"

  Answer: team 1, because it uses the COPY-ALL enzyme.

  Then they should see the distinction.

  What cannot be delivered:
  - The full complexity of Hofstadter's typogenetics.
  - The actual proof of Gödel's theorem.
  - That real cells work exactly this way (it's a simplification).

  But the analogy holds.

  This should fit in 90 minutes.

