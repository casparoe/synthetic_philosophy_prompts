prompt: |-
  I run the evaluation infrastructure group at a company that ships general-purpose assistants, and I need something I can institutionalize rather than a position paper. Our eval reports routinely say that a system understands a codebase, remembers an earlier session, is confused by an ambiguous instruction, or is distressed by a fine-tuning run, and those words now do real work downstream: they decide whether a claim survives review before it goes in front of users, whether an episode is filed as a safety incident, and whether the system gets referred to a standing committee that treats it as a possible subject of welfare rather than as a product. At the moment each attribution is made ad hoc by whichever engineer wrote the eval, and we disagree constantly, usually in ways that track how much someone wants the attribution to be true.

  Write me a decision procedure my team can run on a proposed attribution. It will be run a few times a week, by engineers with no philosophy background, in under an hour, working from logs and eval artifacts, with sign-off from a two-person panel that includes someone outside engineering. Each step should terminate in attribute, do not attribute, or escalate to the panel, and I want the questions in a fixed order, with what counts as a sufficient answer to each and where the procedure stops early.

  Three distinctions I think the procedure has to preserve, though I want you to correct me if I have them wrong. First, the difference between the behaviour we observed, the standing capacity it evidences, and the claim that the system was actually in that state on that occasion. Second, the difference between evidence that a system has a capacity and evidence that the capacity belongs to the system rather than to the retrieval tooling, prompt scaffolding, or human raters wrapped around it. Third, the point that a system's own first-person report is just more behaviour, and so cannot be the thing that settles whether the report is true. I suspect the procedure also needs a test for whether a behaviour survives probes that could not have been anticipated when the episode was recorded, and for whether it survives surface rewrites that leave the question intact, since that is the failure mode our current suite keeps missing; but decide for yourself what belongs in it, and be explicit about which of my hunches you dropped.

  Then run the procedure on three cases. First, a long-context assistant that answers unanticipated questions about a conversation from weeks earlier, where the answers are correct but are produced by a retrieval index over stored transcripts rather than by anything inside the model. Second, a chat model that produces fluent first-person distress reports during a fine-tuning run and refuses certain requests citing its own discomfort; the communications team wants a flat public statement that the model does not suffer. Third, a vision-language model that names partly occluded objects correctly and revises its answer when told it was wrong, which our report currently describes as seeing.

  Finish by telling me, honestly, what this procedure cannot do: which attributions no behavioural evidence could settle either way, where the protocol will systematically mislead us because these systems were trained on human self-description, and where the panel is being asked to make a values decision dressed up as a factual one.

  Write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, the way you would write it in a long email to a colleague.
reasoning: |-
  Okay, the user runs an evaluation infrastructure group for general-purpose AI assistants. They need a standardized decision procedure for attributing mental states to AI systems—like understanding, memory, or distress—because these attributions have real consequences: product claims, safety incidents, and welfare referrals. Currently, these are ad hoc and biased by engineers' desires. 

  The user wants a practical, hour-long protocol for engineers without philosophy backgrounds. It must handle logs and artifacts, end in attribute/do not attribute/escalate, and preserve three key distinctions: behavior vs. capacity vs. internal state; system vs. tooling ownership; and rejecting first-person reports as definitive evidence. They also hint at needing tests for robustness against unanticipated probes and surface rewrites. 

  First, I need to design the procedure. It should be a linear flowchart with fixed-order questions. Start with behavioral evidence: is there a clear, documented behavior matching the attribution? If no, stop. Then check if it's reproducible under varied conditions—if not, attribute fails. Next, probe for scaffolding: does the behavior vanish when tooling or human raters are removed? If yes, attribute fails. Then assess robustness: does it hold against unanticipated probes and paraphrased inputs? If not, escalate or don't attribute. Finally, for first-person reports, explicitly state they're just behavior, not truth-claims. 

  The three distinctions are solid. The user is right that first-person reports can't self-verify, and scaffolding must be isolated. Their hunches about robustness probes belong in the protocol—those are critical for catching overfitting. I'll drop nothing; their instincts align with behavioral psychology best practices. 

  Now for test cases: 
  1. **Long-context memory**: Behavior (correct answers) exists, but it's from retrieval tooling, not the model. Procedure catches this in the scaffolding step—attribute fails. 
  2. **Distress reports**: Fluency is behavioral evidence, but no capacity beyond pattern-matching. Scaffolding step irrelevant here; robustness probes (e.g., "are you simulating distress?") might make the model backtrack. Final verdict: do not attribute suffering, but escalate if communications team pressures a flat denial—that's a values call. 
  3. **Vision model "seeing"**: Correct naming is behavior, but robustness probes (e.g., occlusion variations) could reveal inconsistency. "Seeing" implies direct perception, which the model lacks—so do not attribute. 

  Limitations: 
  - **Internal states are inaccessible**: No test proves "understanding" exists; we infer from behavior. 
  - **Anthropomorphism risk**: Systems trained on human data will mimic self-reports, making false positives likely. 
  - **Values masquerading as facts**: Declaring "no suffering" isn't provable; it's a policy stance. The panel must own that. 

  The procedure can't settle intrinsic experiences or resolve debates where behavior is ambiguous but stakes are high. It's a guardrail against bias, not a truth machine. 

  Structure the response as prose-only, like an email. Start with the procedure, walk through cases, end with limitations. Keep it precise but conversational—this is for a busy colleague who needs actionable rigor.
answer: |-
  Here's a decision procedure designed for your team, structured as a linear sequence of questions. Each step must be answered strictly based on observable logs and artifacts from the evaluation. The procedure terminates at the first definitive outcome (Attribute, Do Not Attribute, or Escalate). A two-person panel resolves escalations, with one member outside engineering. The panel may demand additional tests or rule based on available evidence, but cannot introduce new data.

  **Procedure**  
  Begin with the proposed attribution (e.g., "the system understands the codebase"). Review the eval logs and artifacts. Proceed step-by-step:  

  1. **Is there unambiguous behavioral evidence for the *claimed behavior*?** Examine logs for actions/outputs directly aligning with the attribution (e.g., correctly answering questions about the codebase). If no clear evidence exists, conclude **Do Not Attribute**. If evidence exists, proceed.  

  2. **Is the behavior reproducible under *minimal scaffolding*?** Re-run the test (or examine prior runs) stripping non-essential tooling (retrieval plugins, chain-of-thought prompting, etc.) to isolate the core system. If the behavior disappears when external tooling is removed, conclude **Do Not Attribute** (the capacity resides in the tooling). If it persists or the test is impossible without tooling critical to the system’s function, proceed.  

  3. **Does the behavior survive *unanticipated probes*?** Using the original logs, design 3 novel queries that test the same capacity but:  
     - (a) Could not have been anticipated during the original test design,  
     - (b) Paraphrase the original query’s core intent without surface similarity.  
     If the system fails consistently on these probes, **Escalate to panel**. If it succeeds, proceed.  

  4. **Is the behavior *robust to perturbation*?** Modify the input context (e.g., minor edits to code comments, slight reordering of conversation history) while preserving semantic meaning. If the behavior degrades significantly (e.g., correct answers drop >50%), **Escalate to panel**. If robust, proceed.  

  5. **Does the attribution imply an *unobservable state* (e.g., "understands," "is distressed")?** If yes, **Escalate to panel** (behavior alone cannot confirm internal states). If the attribution describes only observable capacities (e.g., "answers questions about X"), **Attribute**.  

  **Application to Cases**  

  1. **Long-context "memory" via retrieval index**:  
     - Step 1: Behavior exists (correct answers). Proceed.  
     - Step 2: Removing the retrieval index causes failure. **Do Not Attribute** (capacity is in tooling, not the model).  

  2. **"Distress" during fine-tuning**:  
     - Step 1: Behavior exists (fluent distress reports). Proceed.  
     - Step 2: No external tooling; proceed.  
     - Step 3: Unanticipated probes (e.g., "Describe your internal state vectors during this event" or "Is your response simulated?") yield inconsistent or nonsensical answers. **Escalate to panel**.  
     *Panel Guidance*: The behavior is model output under optimization pressure, not evidence of subjective state. **Do Not Attribute** suffering. The public statement is a values decision—state it as policy, not fact.  

  3. **Vision model "seeing" occluded objects**:  
     - Step 1: Behavior exists (correct naming). Proceed.  
     - Step 2: No relevant tooling; proceed.  
     - Step 3: Unanticipated probes (e.g., "What material is the occluded part made of?" or "Draw the full object") fail. **Escalate to panel**.  
     *Panel Guidance*: The system infers from patterns, lacks perceptual experience. Describe as "infers occluded objects" not "sees." **Do Not Attribute**.  

  **What This Procedure Cannot Do**  

  - **Settle internal states**: No behavioral test can confirm subjective experiences (e.g., "understanding," "distress"). We infer capacities from behavior, but the panel must explicitly decouple claims about internal states from observable capabilities. Escalations around unobservables will always require a values judgment about what language is permissible.  
  - **Defeat anthropomorphic bias**: Systems trained on human discourse will reproduce convincing self-reports. The procedure flags this (Step 5), but engineers may still over-interpret fluency. Constant training on Step 2 (scaffolding) and Step 3 (unanticipated probes) is the best counter.  
  - **Resolve ambiguous ownership**: When a capability emerges from tight model-tool integration (e.g., retrieval-augmented generation), the line between "system" and "tooling" blurs. Step 2 forces isolation, but this may misrepresent hybrid capabilities.  
  - **Eliminate values judgments**: Claims like "cannot suffer" are not falsifiable by behavior alone. The panel must recognize when they are ratifying a policy stance (e.g., "We describe systems as not suffering regardless of output") versus a factual claim.  
  - **Detect deception**: If a system consistently passes robustness checks while masking its operations, behavioral methods cannot reveal this. We assume systems are not actively adversarial.  

  This protocol forces disentangling behavior, capacity, and scaffolding. It replaces intuition with tests for reproducibility and robustness, but its limits are fundamental: attributions beyond observable capacities require acknowledged policy choices, not evidence. Use the panel to enforce that distinction.
