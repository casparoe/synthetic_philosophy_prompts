prompt: |-
  I'm writing a feature about how institutions handle uncertainty when the numbers refuse to sit still, and there's one practice whose logic I can't reconstruct. Over the last decade or so, reform-minded corners of the social and biomedical sciences have reacted to the discovery that reasonable analytic choices — which controls to include, which cases to drop, how to measure the outcome — can move a result by a great deal. The reaction has been to run the same analysis many ways (handing one dataset to many independent teams, or having a single team report every defensible combination of choices as a specification curve), to publish the whole spread rather than a preferred estimate, and to treat a claim as established only if it holds across the entire spread rather than being pooled into one best guess. A large philanthropic funder I'm profiling has pushed this into policy: it will fund an intervention only if the estimated effect is positive under every specification its analysts rated as defensible, and when nothing clears that bar it funds whichever option has the best worst case. Yet the same funder's cost-benefit spreadsheets plug in a single point estimate and a single discount rate and return one optimal recommendation, and it pays for replication studies on the stated rationale that more evidence shrinks uncertainty.

  My tentative reconstruction is that the spread-publishing and unanimity rules presuppose that a body of evidence determines not one probability but a set of them, that the spread is not sampling noise which averaging would cancel out, and that we are not entitled to probabilities over the specifications themselves — since if we had them, ordinary model averaging would hand back a single number and the whole apparatus would be pointless. On that reading the practice quietly commits its adopters to something like imprecise credences plus a particular rule for deciding under them, and it rules out both the view that evidence pins down a unique rational degree of confidence and the view that the spread merely reflects our ignorance about which analysis is correct and should be averaged over with a second-order probability.

  Two things complicate this for me. First, the funder builds its list of specifications by inviting rival teams to propose analyses, so the bounds of the set depend on who turned up and what occurred to them: does the practice have to treat the set as a fact about the evidence, or can it admit that the width is partly an artifact of who was in the room? Second, a source tells me that when your probabilities form a set and you update on merely partial or coarse evidence, the interval for a hypothesis can come out strictly wider than it was before — that you can learn something and end up less precise. If that is right, the replication plank of the same policy seems to presuppose a narrowing that the reporting plank denies. I'd like you to reconstruct the implicit epistemology of this package: distinguish what the practice strictly presupposes from what it merely sits well with, say which rival views of uncertainty it rules out and which would license it anyway, tell me whether the point-estimate cost-benefit step and the set-valued evidence step can be made consistent or whether one of them has to go, and sketch what the funder would have to change if it took imprecision seriously all the way down. Please answer as exactly five numbered items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is writing a feature about how institutions handle uncertainty when data is unstable. They're particularly focused on a philanthropic funder that uses a specific approach: requiring interventions to show positive effects across all defensible analytical specifications before funding. Yet this same funder uses single point estimates in cost-benefit analyses and funds replication studies to reduce uncertainty. This seems contradictory, and they want me to reconstruct the implicit epistemology behind this package.

  The user has provided a detailed analysis of the funder's practices. They've tentatively reconstructed that this approach presupposes imprecise credences (a set of probabilities rather than a single probability) and rejects both the idea that evidence determines a unique rational confidence level and the view that specification spread can be averaged away with second-order probabilities. But they're troubled by two complications: the set of specifications depends on who happens to propose analyses, and they've heard that updating imprecise probabilities with partial evidence can actually widen the interval, which conflicts with their replication studies aimed at narrowing uncertainty.

  I need to reconstruct the implicit epistemology of this approach in exactly five numbered items, each one or two sentences long, with no introduction or conclusion. For each item, I'll distinguish what the practice strictly presupposes from what it merely sits well with, identify which views of uncertainty it rules out, address consistency between the set-valued evidence and point-estimate cost-benefit approaches, and suggest what the funder would need to change if they embraced imprecision consistently.

  For the first point, I'll address the core presupposition about evidence. The practice strictly presupposes that evidence doesn't determine a unique probability but rather a set of probabilities. It rules out both Bayesian uniqueness and second-order probability approaches.

  For the second point, I'll cover the specification set's nature. The practice must treat the set as an objective feature of the evidence, though it could in principle admit human factors. This rules out views where specifications are merely subjective.

  For the third point, I'll discuss the replication paradox. The funder's replication rationale conflicts with their approach to specification curves. Replication presupposes uncertainty reduction that imprecise probability updating might not deliver.

  For the fourth point, I'll address the cost-benefit inconsistency. The point-estimate cost-benefit analysis contradicts the set-valued evidence approach. To be consistent, they'd need to use decision rules for sets like maximin or Hurwicz.

  For the fifth point, I'll suggest necessary changes for consistency. The funder would need to adopt imprecise probabilities throughout, use set-based decision rules, and acknowledge that replications might not narrow intervals.

  I'll make sure each point is concise - just one or two sentences - and directly addresses the user's questions without any introductory or concluding remarks.
answer: |-
  1.  The practice strictly presupposes that evidence determines a set of possible probabilities (imprecise credences) for a claim, not a single rational degree of belief, and that pooling or averaging over the specification set is epistemically invalid or impossible; it rules out views where evidence uniquely determines a confidence level *or* where specification uncertainty is reducible to a second-order probability distribution over analyses.
  2.  While the practice could theoretically admit the specification set depends partly on analyst availability and creativity (making width partly artifactual), its logic *requires* treating the resulting spread as an objective property of the evidence itself for the unanimity rule ("positive under every specification") to function as a discovery criterion; it rules out treating the set as merely reflecting subjective analyst ignorance.
  3.  The funder's replication rationale (funding to shrink uncertainty) presupposes that new evidence monotonically narrows the probability interval, conflicting with the core idea that updating imprecise credences on partial evidence can *widen* the set; this plank implicitly relies on a narrowing view the specification-curve reporting denies.
  4.  The point-estimate cost-benefit analysis fundamentally contradicts the set-valued evidence approach by collapsing the spread into a single number for decision-making; they are inconsistent, and true consistency with imprecise credences would require using a decision rule (like maximin or interval dominance) applied to the entire set of cost-benefit outcomes generated by the specification spread.
  5.  To take imprecision seriously throughout, the funder must replace its point-estimate cost-benefit model with a set-based analysis reflecting specification uncertainty, adopt a defined decision rule under imprecision (e.g., funding only interventions dominating others across all specifications), and revise its replication rationale to acknowledge that more evidence may not narrow intervals or might even widen them.
