prompt: |-
  I was grading a stack of undergrad papers on Moore and got into a bit of an arguement with a colleage in the lounge about whether Moore is just a hedonist with extra steps, and it made me want a cleaner case for my early analytic ethics seminar next term. Here is the background I want you to assume: in Principia Ethica (1903) Moore holds that goodness is simple and indefinable, he uses the method of isolation to test intrinsic value (imagine a thing alone in an otherwise empty world; if that world is better than one without it, the thing is intrinsically good), and this is how he argues that beauty is intrinsically good, since a world with just a beautiful landscape and no one there to enjoy it is still better than an ugly world. He also treats personal affection, including friendship, as one of the greatest intrinsic goods, and he accepts the doctrine of organic unities, where the value of a whole need not be the sum of the values of its parts. Please build me a case where Moore's axiology and hedonism come apart in the direction people find hard to construct: a friendship that Moore says has intrinsic value even though neither friend is getting any pleasure from it at the time, with hedonism saying it has no intrinsic value at all. Constraints: realistic, ordinary-life scenario (no sci-fi, no demons, no perfect predictors), no longer than a paragraph, and the Moorean verdict must not come from the friends enjoying pleasant memories or expecting future pleasure; it should fall out of the friendship itself as an organic unity of loving cognition. After the scenario, walk through what each theory says and why, say which feature of the case is doing the work, what happens if that feature is removed, and how a hedonist would attack the case to stop it from counting. Please give the whole thing as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Okay, let me approach this step by step. The user wants a clear case showing Moore's ethics diverges from hedonism, specifically through friendship as an organic unity. The challenge is creating an ordinary scenario where neither friend experiences pleasure, yet Moore would still find intrinsic value.

  First, I recall Moore's key principles: intrinsic value through isolation test, organic unities, and friendship/loving cognition as fundamental goods. Hedonism would require conscious pleasure for value. 

  I'm considering a realistic friendship situation where both parties are temporarily unable to feel pleasure but maintain loving awareness. A hospital scenario comes to mind - one friend in coma, the other keeping vigil while emotionally numb. This avoids sci-fi elements and future pleasure expectations.

  The core mechanism should be Moore's "loving cognition": the awake friend's caring awareness of the comatose one constitutes the organic unity. Removing either component (the love or the cognition) would collapse Moore's case, while hedonism sees no value without pleasure.

  For the structure, I'll follow the five-point format: 
  1) Scenario setup 
  2) Moore's analysis 
  3) Hedonism's view 
  4) Crucial element and its removal 
  5) Hedonist counterargument

  The hospital scenario satisfies all constraints: it's ordinary, avoids memory/future pleasure, centers on loving cognition, and shows the theories diverging. The hedonist would likely attack by denying value without conscious experience.
answer: |-
  Here is the numbered list as requested:

  1.  **Scenario:** Two close friends, Ana and Ben, are together in a hospital room. Ben is in a deep, medically induced coma, completely unconscious and incapable of experiencing pleasure or pain. Ana sits silently beside him, holding his hand. She is emotionally exhausted and numb from prolonged stress and grief over Ben's condition; she feels no current pleasure, only a profound, weary ache of deep care and love for him. Neither experiences any pleasant sensations, memories, or expectations at this moment.
  2.  **Moore's Verdict:** Moore holds this situation possesses intrinsic value as an instance of "personal affection" (friendship), constituting an organic unity of "loving cognition." The complex whole of Ana's deeply caring awareness (love) directed towards Ben (the object of cognition), even amid numbness and without pleasure, is intrinsically good in itself when isolated. The world containing this organic unity is better than one without it.
  3.  **Hedonist Verdict:** Hedonism denies this situation has any intrinsic value. Intrinsic value requires conscious, positive experiences of pleasure or happiness. Since Ben is unconscious and Ana feels only numbness and ache (negative or neutral states), no intrinsic value is present at this time. Any value lies only in potential future pleasure or past pleasant memories, not in the current state itself.
  4.  **Key Feature & Removal:** The crucial feature is the *organic unity of Ana's conscious, loving cognition directed at Ben*. If Ana's love ceased (e.g., she became indifferent) *or* if her cognition of Ben was removed (e.g., she left the room, or was distracted by unrelated thoughts), the specific organic unity constituting the friendship's intrinsic value, according to Moore, would vanish. The value stems solely from this relational state of mind, not the individuals or their feelings in isolation.
  5.  **Hedonist Attack:** A hedonist would argue that Ana's numbness and ache *are* negative experiences (or at best, the absence of positive ones), and Ben experiences nothing. They would contend that "loving cognition" without any concurrent positive affect is not a bearer of intrinsic value; only conscious pleasure qualifies. They might also argue any *claimed* value actually arises from Ana's *belief* in the friendship's importance (a cognitive state), which is pleasant for her, thereby smuggling in hedonism.
