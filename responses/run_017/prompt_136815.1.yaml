prompt: |-
  I'm a backend engineer with no philosophy training beyond one ethics elective I mostly slept through, and I've gotten pulled into an argument I can't referee. A guy on my team is deep into the effective altruism world and sent me a transcript of a podcast interview with someone who apparently works on something called moral uncertainty. Her summary of what the field actually says is the part I can't evaluate. I copied out one chunk more or less word for word:

  "The key move is to stop asking what's right and start asking what you should do given that you don't know what's right. You have a probability distribution over moral theories — say you're 40% on some form of consequentialism, 30% on a duties or rights view, 20% on something virtue- or character-based, and 10% spread over everything else. Each theory assigns every option a score, you take the average of those scores weighted by your credences, and you do whatever comes out highest. That's the whole thing. It's just expected value with the moral theory treated as one more unknown, no different in principle from being unsure what the weather will do. Two consequences follow. First, you should hedge: because you're averaging, an option that does a moderate amount of good on every theory will usually beat an option that does a great deal of good on one theory and nothing on the others, so splitting your money or your effort across several causes is nearly always the right call. Second, and this is where it falls apart, everyone in the field knows it falls apart: if any theory on your list says some option affects an astronomically large number of beings, then even a fraction of a percent of credence in that theory swamps everything else, and the weighted average returns that theory's favourite option no matter what the other ninety-nine percent says. The idea was supposed to stop people going all-in on strange theories and it does the opposite. The usual patch is to discard theories below a credence floor — round anything under about three percent down to zero, since nobody's credences are calibrated that finely anyway — and just admit that's ad hoc."

  Some of this matches what I'd have guessed and some of it sets off alarms I can't name. My instinct from machine learning is that if you're unsure which of two models is right you ensemble them and the ensemble usually beats picking either one, so the hedging advice feels obviously correct to me — but my teammate says the analogy is wrong and I can't say why it would be. I also noticed that if I carve the 40% consequentialism slice into two separate theories and split its credence between them, the arithmetic can flip the answer, which seems like a bug in the method rather than a discovery. And I actually have a live decision here: I'm choosing between giving to a cause where the impact is well measured and modest per dollar, and one where the numbers per dollar might be vastly larger but the case rests on arguments about future generations I'm in no position to check. Does the machinery as she described it really tell me to put everything on the second one?

  Can you go through that paragraph and tell me which parts someone who works on this would accept, which they'd wince at, and which are just wrong, and whether the "it falls apart" conclusion follows from the parts that are right? Also whether the three-percent floor is as ad hoc as she admits or whether it's worse than that, and whether my ensembling intuition is doing any work here. Please write it as continuous prose — no headings, bullets, bold or tables, just an email — and lead with your overall verdict in two or three sentences before you get into the details. I'd rather you gave me a straight answer than defintely'd everything to death, but do tell me where the honest answer really is that it depends.
