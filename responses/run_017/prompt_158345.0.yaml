prompt: |-
  Hi. I'm a philosophy professor — I work mostly in philosophy of science, but Lakatos has never really been my area — and god knows why, I've ended up chairing my university's internal Strategic Research Fund. We meet three times a year, a dozen or so continuing programmes in front of us each time, and for each one we have to say: renew for three more years, renew with conditions, merge it into something else, or wind it down. Real money, real labs, and people I have to pass in the corridor afterwards. The panel is me, two scientists from completely unrelated fields, somebody from finance, and a dean who can override us for strategic reasons but has to read our one-page rationale before doing so. Per programme we get a four-page self-report, two external review letters, and maybe twenty minutes of discussion. So: no time, no shared expertise, and a hard requirement that the rationale be readable by someone who has never opened a philosophy of science book in their life.

  What I want is Lakatos's progressive-versus-degenerating problem shift turned into an instrument my panel can actually run. I know the vocabulary — hard core, protective belt, positive and negative heuristic, novel facts, the difference between predicting something and accommodating it after the fact — so please don't spend the answer explaining the theory back to me; the whole difficulty is the translation. Give me the questions in the order we should ask them, what counts as a sufficient answer to each one given only the material we actually have, where the procedure stops and returns a no, and where it has to stop and hand the decision to a person because it's a values call rather than a factual one. Write the checklist itself in plain language — the panel will not know what a protective belt is, so keep the jargon in brackets or drop it — and be honest about which steps are judgment dressed up as procedure.

  Three things I take to be load-bearing in the original and don't want smoothed away in the simplification: first, that a degenerating stretch isn't by itself grounds to eliminate a programme, because on this view you need a rival that does everything the old one does plus something more; second, that a novel fact has to be novel in the right sense, meaning the programme pointed at it before anyone looked rather than absorbed it afterwards; third, that the verdict is retrospective by nature — we are using it to decide about the next three years, which is a substitution, and I'd rather that be flagged in the instrument than quietly hidden.

  Here are the cases I need it to survive. One: identifying the hard core. Proponents will call whatever is convenient core or belt depending on the question, so my provisional rule is to infer it from what they have actually refused to give up when pressed — a kind of revealed preference — rather than from what they say it is. Does that survive contact with the theory, and what do we do with a group that says it has no hard core at all, that it just follows the data? Two: counting. I've been toying with a belt-growth check — tally the auxiliary hypotheses and ad hoc adjustments added in the last cycle against the independently corroborated novel predictions the programme produced, and treat parity (one new adjustment per one new fact) as a warning sign. Say what the framework actually commits us to about parity, and where it is silent. Three: programmes that don't predict anything. Some of what we fund produces instruments, datasets, taxonomies, methods — outputs that aren't novel facts in the relevant sense. Does the distinction apply to them at all, and if not what's the least-bad surrogate? Four: gaming. Proponents retro-describe accommodated results as predicted, and our external reviewers often don't know the field's recent history well enough to catch it. What in a four-page self-report would actually discriminate? Five: young programmes with no track record, where the honest answer might just be that the procedure can't speak yet.

  Then run it on three from my actual pile. The Computational Toxicology Platform: eight years, high output, and every mismatch with the wet-lab results has been absorbed by adding a correction term; the publications are mostly confirmations; the two reviewers split. The Urban Microclimate group: three years old, no novel predictions yet, an explicit list of what it intends to explain, and a core assumption nobody has tried to break. And the one I'm dreading, Sleep and Metabolic Regulation: fifteen years, degenerating by any honest count as far as I can tell, and no rival programme anywhere that does what it does plus more — the alternative to funding it is that the university simply leaves the area. Run the procedure honestly on that last one even if it tells us to keep paying for it. I suspect that's where the theory goes, but I want to know whether the instrument says so or whether that's just my own reluctance talking.

  Finally: close by telling me what the procedure cannot do, and tell me how confident you are in each of the load-bearing claims you've made about what the framework commits us to, singling out the one you're least sure of.
reasoning: |-
  Okay, the user is a philosophy professor chairing a research fund panel. They need a practical checklist based on Lakatos's theory to evaluate research programs. Let me break down their needs.

  First, they want a jargon-free instrument that translates Lakatos's concepts into actionable steps. The panel includes non-experts, so terms like "protective belt" must be avoided. The checklist needs clear questions in a logical order. 

  The user emphasized three key points: degenerating phases aren't fatal without a rival, novel facts must be predicted not accommodated, and the retrospective nature of evaluation. These must be preserved. 

  Looking at their specific cases: Identifying the hard core is tricky. The user's idea of using revealed preference (what researchers refuse to give up) makes sense. But what if a group claims no hard core? The instrument needs to handle that. 

  For counting adjustments vs. predictions, the user suggested a tally system. I need to clarify what Lakatos says about parity. He sees one-to-one as problematic but not definitive. The panel should see it as a warning sign.

  Programs producing tools or data, not predictions, are another challenge. They might be assessed on utility and uptake instead. 

  Gaming is a real issue. Detecting retroactive predictions requires looking for timestamps in proposals or publications. The checklist should prompt checking when predictions were made relative to results.

  Young programs with no track record need a different approach. The instrument should flag them as "too early to tell" based on the absence of key elements.

  The test cases: Computational Toxicology shows many adjustments but few novel predictions. Urban Microclimate is new with no track record yet. Sleep and Metabolic Regulation is declining but has no rival. The instrument should recommend continuing it, per Lakatos's no-rival principle, even if it feels counterintuitive.

  The limitations section must clarify that the tool doesn't handle values-based decisions or substitution of prospective judgment. The user needs transparency on where the framework ends and human judgment begins.

  I should structure the checklist in phases: Core Integrity, Track Record, Rival Context, then a final recommendation. Each phase has specific questions with decision rules. For the test cases, apply each step methodically.

  Confidence levels: The no-rival principle (even degenerating programs continue without competition) is strongly supported by Lakatos. The revealed preference method for hard core identification is more interpretive, so that's the least certain part. 

  Finally, the conclusion should stress that this is a diagnostic tool, not a decision-maker. It flags issues but can't replace strategic judgment, especially when exiting a field involves human and institutional factors.
answer: |-
  Here's a pragmatic Lakatos-based checklist designed for your constraints. It prioritizes observable evidence over self-description, flags judgment points transparently, and preserves your load-bearing requirements. Jargon is minimized, with essential concepts in *italics* for your reference only.

  ---

  **Lakatos-Inspired Research Programme Viability Checklist**

  **Phase 1: Core Integrity & Direction (What's non-negotiable & where is it aiming?)**
  1.  **"What central idea is this work fundamentally committed to, even when results are unexpected?"** *(Hard Core Identification)*
      *   *Sufficient:* Evidence from reports/reviews showing ideas defended despite anomalies (e.g., "When X failed, they modified Y/Z but kept assuming A"). Ignore self-labelled "core." If proponents claim "no core, just follow data," flag as *Potentially Ad Hoc/No Unified Programme*.
      *   *Stop & Return NO:* If *no identifiable enduring core concept* drives the work after 3+ years. (Judgment: Is this just data collection/methods development?)
  2.  **"What specific, testable claims has this group actively set out to prove/disprove in the last 3 years? Were these aims set *before* seeing the relevant data?"** *(Positive/Negative Heuristic)*
      *   *Sufficient:* Project plans/milestones stated *before* reporting period, or explicit hypotheses tested. Vague aims ("understand X") are insufficient.
      *   *Stop & Hand to Judgment:* For young programmes (<3 yrs) with plausible pre-data aims. Flag as *Immature - Track Record Unformed*.
      *   *Stop & Return CONDITIONAL:* If no clear, pre-data testable aims stated *and* track record weak (see Phase 2). Mandate clear future aims.

  **Phase 2: Track Record (Explanatory Power vs. Defensive Moves)**
  3.  **"List the major unexpected findings or problems encountered in the last 3 years. How did the group respond?"**
      *   *Tally:* Count significant adjustments made (*Protective Belt Modifications*: new parameters, exceptions, sub-models, data corrections). Note if adjustments seem disconnected from core.
  4.  **"List the group's *novel* successful predictions or explanations from the last 3 years. Crucially: Were these predicted *before* the evidence was known/collected?"** *(Novel Fact/Accommodation)*
      *   *Tally:* Count predictions confirmed *only* if documented *before* data collection/analysis. Explanations count as novel *only* if they resolve phenomena *not* used to build the model/theory. Ignore confirmations of expected results.
  5.  **Compare Tally from Q3 vs. Q4:**
      *   *Sufficient (Progressive Signal):* Q4 > Q3 (More novel successes than defensive adjustments).
      *   *Warning Sign (Degenerating Signal):* Q3 >= Q4 (As many/more adjustments as novel successes).
      *   *Stop & Hand to Judgment:* If Q4 = 0 *but* outputs are tools/data/methods (see below). If Q3 = Q4 = 0 *and* young, flag *Immature*. If Q3 = Q4 = 0 *and* mature, flag *Stalled*.
      *   *Gaming Alert:* Scrutinize Q4 claims. Check report timestamps, publication dates vs. hypothesis registration. Look for vague "as predicted" statements without pre-evidence documentation. External reviewers *might* catch this; absence of challenge isn't proof.

  **Phase 3: Rival Context & Utility (The "So What?")**
  6.  **"Is there an active, viable alternative approach (within or outside this university) that explains everything this programme does *plus* something more/new?"** *(Progressive vs Degenerating Problem Shift)*
      *   *Sufficient for Rival:* Evidence cited in reports/reviews. Don't assume existence.
      *   *Crucial Judgment Point:* If Phase 2 shows *Degenerating Signal (Q3>=Q4)* **AND** a clear rival exists, this strongly supports *WIND DOWN*.
  7.  **"If the core ideas are abandoned, what unique capability or understanding is lost?"** (Applies especially if weak on Q4/Q6)
      *   *Consider:* Unique datasets, irreplaceable methods/tools, critical mass of expertise, strategic alignment *despite* track record. *This is values-heavy*.

  **Phase 4: Recommendation Synthesis (Using the above diagnostically)**
  *   **RENEW:** Strong *Progressive Signal* (Q4>Q3) OR Solid core/aims (Q1-Q2) + *Immature* but promising + No strong rival (Q6=No) + Clear utility (Q7).
  *   **RENEW with CONDITIONS:** *Warning Sign* (Q3>=Q4) OR Weak aims (Q2) OR Gaming concerns (Q5). Specify: e.g., "Require pre-registered hypotheses next cycle," "Justify core modifications."
  *   **MERGE/WIND DOWN:** *Degenerating Signal* (Q3>=Q4) **AND** Clear rival exists (Q6=Yes). OR *No Core/Stalled* (Q1/Q5) + Low utility (Q7). OR *Persistent failure to meet conditions*.
  *   **HAND TO DEAN/STRATEGIC OVERRIDE Needed:** *Degenerating Signal* (Q3>=Q4) **BUT** *No Rival* (Q6=No) **AND** High strategic utility (Q7). *This is where theory clashes with institutional reality*.

  ---

  **Applying to Your Cases (Honestly):**

  1.  **Computational Toxicology Platform (8 yrs, High Output):**
      *   Q1: Core likely exists (e.g., "in silico models can predict toxicity"). *Probably YES*.
      *   Q2: Aims likely stated (confirm models? improve accuracy?). *Probably YES*.
      *   Q3: High (Many "correction terms" added). *Tally HIGH*.
      *   Q4: Low ("mostly confirmations" - not novel; absorbed mismatches are accommodation, not prediction). *Tally LOW*.
      *   Q5: Risk: Calling accommodated results "predictions." *Gaming Alert*.
      *   Q6: Are there rivals? (Unclear from description, assume *No* for now).
      *   Q7: High utility? (High output, useful tool?).
      *   **Diagnosis:** *Warning Sign/Degenerating Signal* (Q3 > Q4). *No Rival*. High Utility.
      *   **Procedure Output:** **RENEW with STRICT CONDITIONS** (e.g., "Require documented, pre-registered novel predictions for next cycle; justify core modifications vs. adding corrections; demonstrate uptake/impact beyond confirmatory studies"). **Flags:** Degenerating track record, gaming risk, no rival forces continuation *for now*.

  2.  **Urban Microclimate Group (3 yrs, Young):**
      *   Q1: "Core assumption nobody has tried to break" - Likely *YES*.
      *   Q2: "Explicit list of what it intends to explain" - *YES* (Pre-data aims).
      *   Q3: Likely low (young, core intact). *Tally LOW*.
      *   Q4: "No novel predictions yet" - *Tally LOW/Zero*.
      *   Q5: N/A (no claims).
      *   Q6: Rivals? (Unclear, assume *No*).
      *   Q7: Potential utility? (Strategic area?).
      *   **Diagnosis:** *Immature - Track Record Unformed* (Q4=0 expected). Core & Aims clear.
      *   **Procedure Output:** **RENEW** (Standard renewal for young programme). *Flag:* Monitor for transition to generating novel predictions (Q4) next cycle.

  3.  **Sleep and Metabolic Regulation (15 yrs, Degenerating, No Rival):**
      *   Q1: Core exists (assume e.g., "Sleep disruption is primary driver of metabolic dysregulation X"). *YES* (15 yrs).
      *   Q2: Likely YES (established).
      *   Q3: High ("degenerating by any honest count"). *Tally HIGH*.
      *   Q4: Low (Few/no *novel* predictions confirmed). *Tally LOW*.
      *   Q5: High risk of retro-description.
      *   Q6: "No rival programme... the alternative... is that the university simply leaves the area." *NO RIVAL*.
      *   Q7: Utility if abandoned? Loss of expertise/niche? (Assume *Moderate-High* loss).
      *   **Diagnosis:** *Degenerating Signal* (Q3 > Q4) **BUT** *No Rival*. Potential strategic loss.
      *   **Procedure Output:** **HAND TO DEAN/STRATEGIC OVERRIDE NEEDED.** The procedure flags severe degeneration but the **lack of a rival (core Lakatos principle)** and strategic value force this out of the panel's purely diagnostic hands. Recommendation could be "RENEW with URGENT CONDITIONS (e.g., radical re-think, collaboration, defined exit criteria)" OR "WIND DOWN STRATEGICALLY (acknowledging area loss)". *The instrument clearly shows the theory compels continuation absent a rival, but institutional strategy may override.*

  ---

  **What This Procedure CANNOT Do:**

  1.  **Define Strategic Value:** It diagnoses programme health, not whether the area aligns with university strategy *despite* degeneration (Q7 is a crude proxy).
  2.  **Resolve Values Conflicts:** The "utility" question (Q7) and final override are inherently value-laden.
  3.  **Eliminate Judgment:** Identifying the core (Q1), classifying adjustments (Q3), confirming novelty (Q4), and assessing rivals (Q6) require expert *judgment*, especially with limited data. The checklist structures it but doesn't automate it.
  4.  **Predict the Future:** It assesses the *past* 3 years. Funding the *next* 3 is a gamble. The retrospective/prospective substitution is explicit in the "Immature" and "Conditions" flags.
  5.  **Handle Purely Instrumental/Methodological Programmes Well:** For these, Phase 2 is weak. The least-bad surrogate is focusing heavily on Q7 (Utility): adoption by others, unique capability, data quality, enabling power for *other* progressive programmes. Shift emphasis from "novel facts" to "novel *utility*."

  **Confidence in Load-Bearing Claims:**

  1.  **Degenerating + No Rival ≠ Automatic Termination:** **High Confidence.** This is central to Lakatos (e.g., his defence of Bohr's early quantum theory vs. criticism based solely on its anomalies). The instrument forces this into the "Hand to Override" category.
  2.  **Novelty = Predicted Before Evidence:** **High Confidence.** Lakatos is unequivocal on this distinction being crucial for progressivity. The procedure enforces it rigorously in Q4.
  3.  **Revealed Preference for Hard Core:** **Moderate Confidence.** This is pragmatically necessary but theoretically imperfect. Lakatos *assumes* scientists recognize the core. Your method (inferring from what's defended) is the best operational proxy with limited data. Groups claiming "no core" likely *are* ad hoc (Low Confidence this always holds, but High Confidence it warrants a red flag).
  4.  **Parity (Q3>=Q4) as Warning Sign (Not Automatic Failure):** **High Confidence.** Lakatos describes degenerating programmes as producing "a series of theories with ever-increasing complexity and diminishing returns," characterized by ad hoc adjustments matching or outpacing novel predictions. He doesn't mandate a specific ratio, but parity is a clear threshold for concern. The procedure treats it as a warning/conditional, not an auto-fail.
  5.  **Retrospective Assessment / Prospective Funding Substitution Flagged:** **High Confidence.** The "Immature" and "Conditions" mechanisms explicitly acknowledge this substitution.

  **Least Confident Load-Bearing Element:** **The Revealed Preference method for Hard Core identification (Q1).** While operationally necessary and theoretically plausible (core = what's defended), it's vulnerable to misinterpretation (was an idea *really* defended, or just not challenged hard enough?) and groups genuinely operating without a unified core *might* exist (though likely perform poorly on Q2-Q4). This step relies most heavily on *panel judgment* interpreting limited evidence.
