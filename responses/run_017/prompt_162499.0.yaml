  Key angles I should cover:
  First, the metaphysical interpretation: Does patent law treat inventions like pre-existing entities waiting to be discovered (Platonic forms?), while copyright views expression as emanating from personal creation? That would explain why patent awards exclusivity to first finders while copyright permits parallel creation.

  Second, the instrumentalist view: Maybe it's just about functional differences. Patents aim to incentivize costly R&D and public disclosure through strong monopolies, hence no independent creation defense. Copyright focuses more on preventing free-riding on others' creative labor without needing to block parallel inspiration.

  I should note that both theories can coexist without contradiction. The law might implicitly accept a discovery model for inventions while adopting a creation model for expression - not because it's philosophically committed, but because each model serves the respective regime's goals. The metaphysical framing is useful rhetoric but not essential to the legal structure.

  For the rule-swap thought experiment:
  If patents allowed independent invention defense, it would weaken monopolies and potentially reduce R&D incentives, but might feel fairer in cases like calculus where Leibniz truly arrived independently. If copyright punished independent creation of identical works, it would absurdly require proving negative knowledge and stifle cultural production - imagine two poets independently writing identical verses by coincidence.

  The user's closing question about historical precedence cases is sharp. Under swapped rules, Newton/Leibniz might both patent calculus (causing chaos) while Darwin could sue Wallace despite parallel evolution insights. This highlights how current rules channel credit assignment: patents create clear priority winners while copyright allows peaceful coexistence.

  I should emphasize that the instrumental explanation seems stronger - the metaphysics is post-hoc justification. The consistency lies in how each rule serves its domain's purpose: patents for promoting technical progress through controlled disclosure, copyright for encouraging expression without demanding uniqueness.
answer: |-
  The asymmetry between patent and copyright law regarding independent creation reveals deeper philosophical and instrumental commitments about the nature of innovation, originality, and the purpose of intellectual property. Below is a reconstruction of the implicit theories, distinguishing between necessary presuppositions and contingent alignments, followed by consequences of swapping the rules.

  ---

  ### **I. Implicit Theories Behind the Asymmetry**
  #### **A. Metaphysical Commitments (What the Asymmetry Presupposes)**
  1. **Patent Law’s "Discovery Metaphysics"**:  
     - **Presupposition**: Inventions are treated as pre-existing abstract entities (e.g., natural laws, functional principles) that are "discovered" rather than created.  
     - **Implications**:  
       - The first inventor stakes a claim to a timeless truth, rendering subsequent independent discoveries mere replications.  
       - Simultaneity is problematic because only one entity exists to be "found"; priority determines ownership.  
     - **Evidence**:  
       - The "prior art" doctrine treats inventions as part of a shared technical commons once disclosed.  
       - Independent invention is no defense because the invention, once discovered, becomes a universal fact.  

  2. **Copyright Law’s "Creation Metaphysics"**:  
     - **Presupposition**: Expressive works are unique products of individual authorship, tied to the author’s personal labor or personality.  
     - **Implications**:  
       - Each act of creation is ontologically distinct, even if outputs are identical.  
       - Simultaneity is unproblematic because two authors create two separate works.  
     - **Evidence**:  
       - Copyright protects "originality" (i.e., independent effort), not novelty.  
       - Identical works are permissible if no copying occurred.  

  #### **B. Instrumental Commitments (What the Asymmetry Fits Well With)**
  1. **Patent Law’s Utilitarian Aims**:  
     - **Goal**: Incentivize R&D investment and public disclosure.  
     - **Theory**:  
       - A strict monopoly (even against independents) ensures innovators recoup costs.  
       - Independent invention is irrelevant because society only needs one disclosure.  
     - **Presupposes**: Inventions are costly to develop but easy to reverse-engineer or replicate.  

  2. **Copyright Law’s Personality/Labor Aims**:  
     - **Goal**: Protect authorial labor/personality and prevent misappropriation.  
     - **Theory**:  
       - Liability requires copying to avoid punishing coincidental similarity.  
       - No monopoly over ideas/expressions society might independently recreate.  
     - **Presupposes**: Creative works reflect personal identity; copying, not similarity, causes harm.  

  ---

  ### **II. Consistency and Tensions**
  - **Compatibility**: Both regimes cohere internally but rely on **incompatible theories of origination**.  
    - Patents adopt a **monist view** (one invention, one owner).  
    - Copyright adopts a **pluralist view** (many creators, many works).  
  - **Tension**:  
    - Patent’s "discovery" metaphor clashes with human ingenuity (e.g., inventing a wheel twice).  
    - Copyright’s tolerance for identical works ignores that some expressions (e.g., simple melodies) are inevitable.  
  - **Resolution**: The asymmetry is **instrumentally justified**, not metaphysically necessary. The law prioritizes policy goals over ontological consistency.  

  ---

  ### **III. Consequences of Swapping the Rules**
  #### **A. Patent Law Adopts Independent Invention Defense**
  - **Changes Required**:  
    - Abandon "first-to-file" priority; allow multiple patents for identical inventions.  
    - Infringement requires proof of copying.  
  - **Consequences**:  
    - **Newton/Leibniz/Darwin/Wallace Cases**: Both inventors could patent their versions.  
      - *Calculus*: Newton and Leibniz both recognized as inventors, but licensing chaos ensues.  
      - *Natural Selection*: Darwin and Wallace co-own the theory, potentially diluting impact.  
    - **Systemic Effects**:  
      - Reduced R&D incentives (monopoly value declines).  
      - Duplicative patents clutter the system; innovation slows due to "stacked" licensing.  
      - Favors large entities who can afford parallel research.  

  #### **B. Copyright Law Abandons Independent Creation Defense**
  - **Changes Required**:  
    - Infringement extends to identical works, regardless of independence.  
    - Novelty requirement introduced (like patents).  
  - **Consequences**:  
    - **Historical Cases**:  
      - Two poets writing identical verses by chance: the second infringes.  
      - Darwin’s *Origin* could block Wallace’s identical manuscript.  
    - **Systemic Effects**:  
      - Chilling effect on creation (fear of coincidental similarity lawsuits).  
      - Authors must "clear" their works against all existing expressions.  
      - Undermines copyright’s goal of promoting diverse expression.  

  ---

  ### **IV. Conclusion: What the Asymmetry Reveals**
  - **Core Presuppositions**:  
    - Patents **must** treat inventions as discoverable, non-replicable entities to justify priority.  
    - Copyright **must** treat works as personal creations to justify independent-creation defense.  
  - **Instrumental Primacy**: The asymmetry is **fundamentally driven by policy**, not metaphysics. Patent law’s rigidity ensures disclosure; copyright’s flexibility encourages expression. Swapping rules would destabilize both systems, confirming that the asymmetry is a functional adaptation to distinct domains.  
  - **Philosophical Harmony?**: The regimes are **instrumentally consistent** (each achieves its goal) but **metaphysically inconsistent**. Yet this incoherence is pragmatically irrelevant: law often adopts useful fictions (e.g., "invention as discovery") to serve social aims. The Newton/Leibniz and Darwin/Wallace cases illustrate that credit matters less to the law than incentivizing progress and expression efficiently.
