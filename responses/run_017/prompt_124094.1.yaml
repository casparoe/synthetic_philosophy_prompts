answer: |-
  ## Grant Proposal: The Pasadena Paradox and the Hidden Parameter of Expected Utility

  **Project Title:** Revealing the Matching Rule: Axiomatic Foundations for Expectation in Pathological Gambles

  **Duration:** 3 Months (Summer)

  **1. Core Research Question & Crux of the Problem:**

  The Pasadena game epitomizes the breakdown of standard expected utility (EU) theory for gambles with conditionally convergent expectation series. Orthodox EU declares the expectation undefined due to the divergence of both positive and negative parts. The rearrangement theorem confirms this indeterminacy: different summation orders yield different finite expectations or ±∞.

  **Your Insight & The Crux:** You argue this indeterminacy isn't solely a property of the *gamble*, but fundamentally reflects a choice in how we conceptualize settling the infinite, divergent positive and negative "tails" of the payoff distribution – a **Matching Rule**. This rule specifies how fragments of the positive tail are paired ("netted") against fragments of the negative tail. Crucially:
  *   **Finite Gambles:** All plausible matching rules yield the same finite expectation. The parameter is invisible.
  *   **Pasadena-like Gambles:** Different matching rules yield different net results. The parameter becomes visible.
  *   **The Crucial Question:** Is this matching rule merely a mathematical artifact, or is it a *genuine hidden parameter within normative EU theory*? If the latter, what (if any) *rationality constraints* exist on choosing this rule? Is there a unique rational rule (privileged by axioms), a constrained set, or is it a locus of permissive rational disagreement?

  **The Standard Moves & Why They Leave the Crux Open:**
  *   **"Undefined" (Orthodoxy):** Avoids the problem but offers no guidance for agents facing such gambles. Doesn't address the *structure* revealed by rearrangement.
  *   **"Any Value" (Rearrangement):** Describes the mathematical freedom but provides no normative framework for choice. Fails to engage with decision-theoretic axioms.
  *   **Bounded Utility:** Solves many infinities but artificially truncates preferences. Doesn't explain the *specific structure* of the Pasadena problem.
  *   **Weak Expectations/Nonstandard Analysis:** Often provides *a* defined value (e.g., `ln 2` via Cesàro summation, or hyperreal values) but lacks a clear *normative justification* for choosing one method over another. Why `ln 2` specifically? Why not another limit? This approach often *implements* a matching rule without explicitly *theorizing* it as a parameter of rationality.

  **Your approach directly confronts the crux:** By explicitly formalizing the Matching Rule as a potential parameter within EU theory, we can investigate whether core decision-theoretic axioms (Linearity, Statewise Dominance, Relabeling Invariance, Additivity over Independent Gambles) constrain this rule for the Pasadena gamble and its variants. The project asks: **Do these axioms uniquely determine a matching rule, constrain it to a specific class, or leave it entirely unconstrained, implying a fundamental indeterminacy in rational choice for such gambles?**

  **2. Project Plan (Monthly Breakdown):**

  *   **Month 1: Formalizing the Matching Framework.**
      *   Define "Matching Rule" (`M`) precisely: A rule pairing countable subsets of the positive payoff states (odd `n`) with countable subsets of the negative payoff states (even `m`) such that every state is included in exactly one pair, and the "netting" within each pair is well-defined (finite or consistently handled).
      *   Define the `M`-conditional expectation `EU_M(G)` for gamble `G`.
      *   Formalize core axioms (Linearity, Dominance, Relabeling Invariance, Additivity over Independent Gambles) within this enriched EU framework where an agent specifies both utilities *and* a matching rule `M`.
      *   **Deliverable:** Rigorous mathematical framework specification.

  *   **Month 2: Axiomatic Analysis & Test Cases.**
      *   **Core Axiomatic Constraints:** Systematically apply each axiom to the Pasadena gamble to see if it restricts `M`. Does Linearity force anything? Does Dominance? Does Relabeling Invariance (e.g., reordering toss sequences) constrain `M`? This tackles your worry about collapse back to absolute convergence – *if* axioms force `M` to imply absolute convergence, we will discover it here.
      *   **Key Test Case 1: Pasadena vs. Pasadena + $1 (PD vs PD+1).** Does Statewise Dominance force `EU_M(PD+1) > EU_M(PD)` for *all* `M`? Or are there `M` where adding a dollar makes no difference (or even decreases value)? This probes the strength of Dominance.
      *   **Key Test Case 2: Pasadena vs. St. Petersburg (PD vs SP).** SP has a divergent positive expectation. Does comparing PD and SP reveal constraints on `M`? Can `M` be chosen to make PD preferable to SP, SP preferable to PD, or are they incomparable? This probes comparability.
      *   **Deliverable:** Analysis report detailing which axioms constrain `M` for Pasadena and the outcomes of Test Cases 1 & 2.

  *   **Month 3: The Additivity Bomb & Synthesis.**
      *   **Key Test Case 3: Two Independent Pasadena Games (PD1 + PD2).** Does Additivity over Independent Gambles require `EU_M(PD1 + PD2) = 2 * EU_M(PD1)`? This is the critical test. If Additivity holds only for specific `M`, it strongly privileges those rules. If it holds for all `M`, it might be vacuous. If it *cannot* hold for *any* `M` without contradiction (e.g., forcing different `M` for the single and combined games), it potentially blows up the framework or reveals a deep inconsistency. This directly addresses your worry about the freedom being too wide or unstable.
      *   **Synthesis & Deliverable:** Integrate results from Months 1 & 2. Finalize the answer to the core question: What does rationality constrain? Produce the primary project deliverable: A paper draft titled "The Matching Rule: A Hidden Parameter in Expected Utility Theory?" containing:
          *   The formal framework.
          *   Analysis of axiomatic constraints on `M` for Pasadena.
          *   Resolution of the three test cases within the framework.
          *   Discussion of whether `M` is a locus of rational permissibility or constrained by axioms.
          *   Implications for EU theory and the status of "pathological" gambles.

  **3. Deliverables:**
  1.  Formal Framework Specification (End of Month 1).
  2.  Test Case Analysis Report (PD vs PD+1, PD vs SP) (End of Month 2).
  3.  Draft Research Paper: "The Matching Rule: A Hidden Parameter in Expected Utility Theory?" (End of Month 3).

  **4. What Constitutes Success/Failure:**
  *   **Good Result (Success):** A clear answer emerges. Possibilities:
      *   Axioms (especially Additivity) uniquely pin down `M` (e.g., perhaps implying `ln 2`).
      *   Axioms constrain `M` to a specific, well-defined class (e.g., all "natural" orderings).
      *   Axioms provide *no* constraint on `M` for Pasadena, establishing rational permissibility for a range of expectations. (This would be philosophically significant!).
  *   **Failure Conditions (Managed Scope):**
      *   **Collapse:** The axioms *force* a requirement equivalent to absolute convergence, leaving no room for non-pathological `M` for Pasadena. (Significant negative result).
      *   **Indeterminacy:** The freedom is too wide; the framework yields no determinate answers on the key test cases (especially PD1+PD2) even after applying axioms. (Reveals deep problems).
      *   **Repackaging:** The framework demonstrably reduces to choosing a nonstandard model or summation method without adding new decision-theoretic insight. (Clarifies limitations).
      *   **Inconsistency:** Additivity leads to unresolvable contradictions within the framework. (Fundamental challenge uncovered).
      *   **Incompleteness:** The analysis remains inconclusive within the 3-month scope (mitigated by clear monthly goals).

  **5. Feasibility & Scope (Straight Talk):**
  *   **Why 3 Months is Feasible:** The scope is tightly focused on *one* canonical example (Pasadena) and its direct variants. The formalization (Month 1) and individual test cases (Month 2) are well-defined mathematical tasks. Month 3 (Additivity/Synthesis) is the heaviest lift but builds directly on prior months. The focus on *axiomatic constraints* provides a clear analytical path.
  *   **Why it's Worth It:** This tackles a foundational puzzle head-on, proposing a novel conceptual lens (the matching rule as a hidden parameter). Success (any clear outcome) provides a significant advance in understanding EU's foundations: either revealing a new parameter, showing how axioms constrain infinities, or demonstrating inherent limitations. Failure modes are also informative. It avoids reinventing summation methods by grounding the investigation in decision-theoretic axioms.
  *   **Risk Mitigation:** Monthly milestones allow for early detection of fatal flaws (collapse, inconsistency). The test cases provide concrete checkpoints. Focusing solely on Pasadena keeps the math manageable.

  **Conclusion:**
  This project offers a rigorous and novel investigation into the foundations of expected utility theory by treating the rearrangement freedom in the Pasadena paradox not as a mere mathematical curiosity, but as potentially revealing a fundamental hidden parameter – the matching rule. By systematically probing how core decision-theoretic axioms constrain this rule, we will determine whether rationality demands a specific expectation value, permits a range, or finds the gamble genuinely incomparable. The test cases (PD+1, PD vs SP, PD1+PD2) provide crucial stress tests. The deliverables are concrete, the methodology clear, and the potential insight – regardless of the specific outcome – significant for decision theory and the philosophy of probability. The scope is ambitious but achievable within a focused three-month summer project.
