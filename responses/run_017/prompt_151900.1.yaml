prompt: |-
  I chair my university's committee for reviewing research that could be misapplied — the dual-use cases. Under our rules any one of the seven members may sign off on a project alone, on an expedited 72-hour turnaround, and any one of us may also place a hold that forces a full-committee hearing at the next monthly meeting. I cannot change these rules; I can only change how I use my own signature. I see perhaps eight cases a year, alongside a molecular biologist, an ecologist, a research-integrity officer, a legal adviser, and a graduate student, none of whom will have read the philosophical literature.

  My problem is the unilateralist's curse: where any one agent's action suffices to bring about an outcome that is catastrophic if that agent's confidence is misplaced, every agent acting on its own expected-value calculation can leave everyone worse off than if none of them had been able to act. I want that turned into something I can actually run in an afternoon. Three worries take me beyond the standard statement of the point, and I want the procedure to handle them.

  First, the number that matters is not seven. It is the number of agents elsewhere — other labs, other journals, other funders — facing substantially the same choice, and that number is usually not measurable, only guessable. My suspicion is that a procedure which cannot estimate it should still change what I do, perhaps by moving the default. Second, selection. The cases reaching me for expedited sign-off are the benign-looking residue of someone else's triage, and the members who find themselves willing to sign are, by that very fact, the ones most likely to be overconfident: my willingness to sign is evidence against my signing, and I want that as an explicit step rather than a private worry. Third, asymmetric stakes. The credit for letting a project proceed — a colleague's grant, a lab's priority, my own reputation for not being obstructionist — is private and immediate, while the harm, if the risk case is real, is diffuse, delayed, and borne mostly by people outside the room. A threshold that ignores that asymmetry will sign off too often, and I want to know how to scale it.

  Equally, I do not want a procedure that only ever says no. Placing a hold is itself a unilateral act with its own costs; our errors are not independent when we read the same literature, so there may be a case for deferring to the most reluctant member; and I have watched a colleague use a hold to kill work she merely found distasteful. I also suspect the per-case threshold is the wrong unit: eight small sign-offs across a year may be worse than one large one, and I do not know whether the procedure can aggregate.

  Please give me the procedure, and run it on three cases:

  1. A virology group proposes to publish a protocol that would let a standard BSL-2 laboratory propagate and modify a respiratory coronavirus. The claimed benefit is faster screening of vaccine candidates. Our molecular biologist says the method is incremental and partly in the open literature already.
  2. An AI group proposes to release model weights that would materially lower the cost of generating convincing targeted political disinformation. The benefit is external scrutiny of the lab's safety claims. The group's own argument is that comparable weights will be released elsewhere within six months, and that a country with elections in four months is the likely target.
  3. A colleague in my own department, a political philosopher whose work I think well of, proposes to publish an argument that the state's duty to protect a small, historically persecuted minority is considerably weaker than is generally assumed. I believe the argument is valid and worth publishing; I also have more at stake here than in the other cases, and I would like to sign it off myself.

  Case 3 is the one where I expect to dislike the answer.

  Sections, with rough lengths: "The problem restated" (150 words), "The procedure" (450 words), "Three cases" (450 words), "Judgment calls the procedure cannot eliminate" (200 words), "Failure modes" (150 words).
reasoning: |-
  Hmm, the user chairs a university committee for dual-use research oversight and faces the unilateralist's curse. They need a practical procedure to handle expedited sign-offs that accounts for three key complications: the unknown number of parallel decision-makers, selection bias where those willing to sign are likely overconfident, and asymmetric stakes where benefits are immediate but harms are diffuse. They want this operationalized for real cases without changing committee rules.

  The procedure must avoid perpetual blocking while addressing systemic risks. I'm considering a Bayesian approach that treats one's own willingness to sign as evidence requiring higher confidence thresholds. The threshold should scale with the estimated number of parallel decision-makers (N) and incorporate stake asymmetry through a harm/benefit multiplier. Crucially, it needs a calibration mechanism since N is unobservable.

  For case implementation: 
  - Virology case seems low-risk with incremental methods already in literature, likely sign-off with high threshold
  - AI case has clear asymmetric stakes and short timeline, requiring hold despite "inevitability" claims
  - Political philosophy case triggers personal stakes - procedure should force recusal and independent assessment

  Key judgment calls will include estimating N (suggest anchoring to observable proxies) and harm quantification (recommend committee rubrics). Failure modes involve underestimating N or overconfidence in harm assessment. The procedure's strength is forcing explicit confrontation of biases rather than eliminating them.

  The political philosophy case is intentionally thorny - the chair's personal connection makes recusal non-negotiable. The answer will be uncomfortable but necessary.
answer: |-
  ## The Problem Restated
  The unilateralist's curse arises when any single agent (like a committee member) can authorize a potentially harmful action (expedited sign-off). If each member relies solely on their personal risk-benefit calculation, even slightly overconfident individuals will approve projects too readily, as the catastrophic harm (while devastating) is improbable *from one perspective*, and the immediate benefits are certain. With multiple parallel decision-makers (N total, including external labs/journals/funders), the cumulative risk of *someone* making a bad approval skyrockets. Adding complexity: 1) N is unknown; 2) Cases reaching us are pre-filtered (low-hanging fruit for approval), making members willing to sign *more likely* overconfident; 3) Benefits (career gains) are concentrated and immediate, while catastrophic harms are diffuse and delayed, skewing incentives towards approval. We need a decision procedure that counters these forces.

  ## The Procedure: The Modified Bayesian Veto (MBV)
  The MBV forces you to explicitly account for the curse, selection bias, and asymmetric stakes by raising your personal approval threshold. Run this checklist *before* deciding to sign or hold:

  1.  **Estimate Parallel Decisions (N):** Ask: "How many *other* competent entities (labs, journals, funders, committees) are likely reviewing *substantially similar* work for potential release/publication/funding *around this time*?" Use industry knowledge, publication trends, grant cycles, or known competing labs. *Default N:* If estimation feels impossible, conservatively assume **N = 10**. (Rationale: Underestimating N is worse than overestimating).

  2.  **Assess Base Case Harm Probability (P_harm_base):** Estimate the probability *you* assign to catastrophic harm occurring *if this specific project is approved/released*. Be brutally honest. Use a scale (e.g., 1% = very unlikely, 10% = plausible concern, 25%+ = serious risk). Ignore other decision-makers for this step.

  3.  **Adjust for Selection Bias (P_harm_adjusted):** Recognize your willingness to sign is evidence *against* high risk (because risky cases are filtered before reaching you, and overconfident members are more likely to sign). Adjust: **P_harm_adjusted = P_harm_base * (1 / Confidence_Factor)**. Choose `Confidence_Factor`:
      *   `1.5` = Moderate concern about bias (e.g., case looks obviously benign).
      *   `2.0` = Significant concern (e.g., complex case, high external stakes, you feel eager to sign).
      *   `3.0` = High concern (e.g., you strongly *want* to approve for personal/professional reasons, Case 3).

  4.  **Calculate Required Personal Threshold (Threshold_personal):** This is the maximum *per-decision* probability of harm you can tolerate for the *system* to have an acceptable overall risk. It depends on N and the Harm/Benefit Asymmetry (k).
      *   **Define Asymmetry Multiplier (k):** Estimate the ratio: `(Magnitude of Diffuse Catastrophic Harm) / (Magnitude of Concentrated Benefit)`. Be conservative. Use orders of magnitude (e.g., k=10, k=100, k=1000). *Default k:* **k = 100** (Harm is 100x worse than the benefit is good).
      *   **Formula:** `Threshold_personal = 1 / (N * k)`
      *   *Example:* N=10, k=100 → Threshold_personal = 1 / (10 * 100) = 0.001 (0.1%).

  5.  **Decision Rule:**
      *   **IF** `P_harm_adjusted` < `Threshold_personal` → **Sign Off Expedited**.
      *   **ELSE** → **Place a Hold** for full committee review.

  6.  **Recusal:** If personal stakes (career, relationship, ideology) significantly influence your judgment (especially in Step 3 adjustment), **you MUST place a hold**. Your judgment is compromised for expedited decisions.

  **Output:** A clear "Sign" or "Hold" decision based on confronting the systemic risks and biases.

  ## Three Cases Run Through MBV

  1.  **Virology Protocol:**
      *   *N:* Similar protocols exist; competitors are numerous but focused on specifics. **Estimate N=5** (other journals, maybe 1-2 funders).
      *   *P_harm_base:* Incremental step, BSL-2 limitations. Risk seems very low. **Estimate 0.5%**.
      *   *Confidence_Factor:* Benign appearance, incremental. Moderate bias concern. **Choose 1.5**. → P_harm_adjusted = 0.005 / 1.5 ≈ **0.0033 (0.33%)**.
      *   *k:* Potential pandemic harm vs. faster vaccine screening benefit (significant but localized). **k=100**.
      *   *Threshold_personal:* 1 / (5 * 100) = **0.002 (0.2%)**.
      *   *Decision:* P_harm_adjusted (0.33%) > Threshold_personal (0.2%) → **HOLD**. *Rationale:* While risk seems low individually, the combination of estimated N=5 and k=100 forces a very low threshold. The full committee can debate the true N and k.

  2.  **AI Model Weights Release:**
      *   *N:* Active field; multiple labs/journals/OS platforms could release similar models soon. **Estimate N=8** (conservative).
      *   *P_harm_base:* Materially lowers disinformation barrier. Target election imminent. **Estimate 10%**.
      *   *Confidence_Factor:* "Inevitable release" argument pressures approval. High external stakes. Significant bias concern. **Choose 2.0**. → P_harm_adjusted = 0.10 / 2.0 = **0.05 (5%)**.
      *   *k:* Societal disruption, erosion of trust (massive harm) vs. external scrutiny benefit (valuable but limited scope). **k=1000**.
      *   *Threshold_personal:* 1 / (8 * 1000) = **0.000125 (0.0125%)**.
      *   *Decision:* P_harm_adjusted (5%) >> Threshold_personal (0.0125%) → **HOLD**. *Rationale:* The extreme asymmetry (k=1000) and non-zero N drive the threshold impossibly low. Expedited approval is unjustifiable. "Inevitability" doesn't absolve responsibility; full committee review essential.

  3.  **Political Philosophy Argument:**
      *   *Recusal Check:* YES. This is your colleague, you respect their work, you believe the argument is valid *and* you have "more at stake". **You MUST place a HOLD.** Your judgment for expedited approval is compromised.
      *   *(Hypothetical if no recusal - Demonstrates the point):*
          *   *N:* Academic publishing; many journals review philosophy. But specific argument niche? **Estimate N=15** (conservative/high).
          *   *P_harm_base:* Valid academic argument vs. potential misuse to weaken minority protections. You think misuse unlikely. **Estimate 0.1%**.
          *   *Confidence_Factor:* Strong desire to approve (personal/professional stake). **Choose 3.0**. → P_harm_adjusted = 0.001 / 3.0 ≈ **0.00033 (0.033%)**.
          *   *k:* Harm to vulnerable group (significant) vs. academic freedom/reputation benefit (significant but concentrated). **k=50** (controversial, likely underestimated due to bias).
          *   *Threshold_personal:* 1 / (15 * 50) ≈ **0.00133 (0.133%)**.
          *   *Decision:* P_harm_adjusted (0.033%) < Threshold_personal (0.133%) → **Sign Off**.
      *   *Reality:* The recusal requirement overrides this calculation. **HOLD.** Let the full committee, less conflicted, assess the societal risk (P_harm_base, k) using the MBV if needed. Your role is to ensure due process, not expedite favored work.

  ## Judgment Calls the Procedure Cannot Eliminate
  The MBV forces explicit quantification but relies on your subjective estimates. Key irreducible judgments:
  *   **Estimating N:** Anchoring to the default (N=10) is crucial when uncertain. Use conferences, preprint servers, grant announcements as clues. Err high.
  *   **Quantifying Harm (Magnitude for k):** Defining "catastrophic harm" and comparing it to concrete benefits is inherently difficult. Develop committee rubrics (e.g., scale 1-10 for harm/benefit magnitude) for consistency over time.
  *   **Choosing Confidence_Factor and k:** These multipliers inject necessary conservatism. Document your rationale. Experience calibrates these. High personal stakes *must* trigger recusal or a high Confidence_Factor (3.0).
  *   **Aggregation:** The procedure is per-case. While 8 small approvals likely pose higher cumulative risk than one large one, the MBV bakes this into each decision via N and k. Tracking annual trends in your holds/sign-offs is wise.

  ## Failure Modes
  1.  **Underestimation of N:** The core vulnerability. If you consistently guess N too low (e.g., N=2 when reality is N=20), Threshold_personal becomes too lenient, and approvals become too frequent. Defaulting to N=10 mitigates this.
  2.  **Overconfidence in Harm Assessment:** If P_harm_base is systematically underestimated (e.g., dismissing novel risks), P_harm_adjusted remains too low. The Confidence_Factor adjustment combats this, but cannot eliminate it. Committee review diversifies perspective.
  3.  **Manipulation of k:** Deliberately downplaying harm magnitude (low k) or overstating benefits (also lowering effective k) bypasses the asymmetry safeguard. Requires honest, externalized assessment – another reason full committee review is a safety net.
  4.  **Recusal Avoidance:** Failing to recuse when conflicted (especially Case 3) destroys the procedure's integrity. Mandate self-reporting of conflicts.

  **In essence:** The MBV doesn't make you omniscient. It forces you to confront the systemic risk (the curse, the bias, the asymmetry) with structured pessimism, making expedited approval the *exceptional* outcome justified only by very low *adjusted* risk within an extremely strict *systemic* threshold. When in doubt, the hold is your prudent tool. Use it.
