  ### Thought Experiment: The Condo Fee-Shift Trap

  You own a condo and dispute a $15,000 assessment for water damage repairs. The condo association’s insurer reassigns the file every quarter to a new adjuster. Each adjuster, reviewing afresh, perceives a 25% chance their case is flawed and may concede. Each round (corresponding to a negotiation cycle) costs you $5,000 in legal fees. The bylaws award the winner 50% of their total legal costs. If you quit, you lose all spent funds. If you continue, you pay $5,000; with 25% probability, the adjuster concedes, granting you $15,000 plus 50% of your cumulative costs; otherwise, the dispute continues. You start with $0 spent.  

  ### Escalation Mechanism
  - **Amount at stake (A)**: $15,000  
  - **Cost per round (c)**: $5,000  
  - **Recovery fraction (r)**: 50% (0.5)  
  - **Concession probability (p)**: 25% (0.25), constant due to rotating adjusters.  

  **Expected value (EV) of continuing for one round then quitting if no concession**, given sunk cost **S**:  
  - **EV(continue)**: Probability-weighted outcome minus cost:  
    `p × [A + r×(S + c) - c] + (1 - p) × [-c]`  
    This simplifies to: **`p × (A + r×S) + p×r×c - c`**.  
  - **EV(quit)**: **`-S`**.  
  - **Continue beats quit if**:  
    `p × (A + r×S) + p×r×c - c > -S`  
    → **`p × (A + r×S) + p×r×c + S > c`**.  

  #### Early Round (S = $10,000):  
  - **EV(continue)**: `0.25 × ($15,000 + 0.5×$10,000) + 0.25×0.5×$5,000 - $5,000`  
    = `0.25 × $20,000 + $625 - $5,000`  
    = `$5,000 + $625 - $5,000 = **$625**`  
  - **EV(quit)**: **`-$10,000`**  
  - **Verdict**: Continue (EV = $625) > Quit (EV = -$10,000).  

  #### Late Round (S = $60,000):  
  - **EV(continue)**: `0.25 × ($15,000 + 0.5×$60,000) + 0.25×0.5×$5,000 - $5,000`  
    = `0.25 × $45,000 + $625 - $5,000`  
    = `$11,250 + $625 - $5,000 = **$6,875**`  
  - **EV(quit)**: **`-$60,000`**  
  - **Verdict**: Continue (EV = $6,875) > Quit (EV = -$60,000).  

  ### Key Features
  1. **Not the sunk-cost fallacy**: The fee-shifting rule makes sunk costs **recoverable assets**. Higher **S** increases potential recovery (via `r×S`), raising the EV of continuing. Decisions are forward-looking, not backward-looking.  
  2. **Flat concession probability**: Rotating adjusters reset resolve. If one persistent decision-maker hardened (e.g., concession probability halved to 12.5% by round 3), continuing would quickly become negative-EV.  
  3. **No identifiable mistake point**: At every **S**, `p × (A + r×S) + p×r×c + S > c` holds for the given numbers. Entering was positive-EV overall (initial EV ≈ $3,333), but the distribution is heavy-tailed: 90% of paths end by round 9 (cost ≤ $45,000), but 10% exceed $50,000.  
  4. **Inherited file test**: A stranger given the file at **S = $60,000** sees EV(continue) = $6,875 > EV(quit) = -$60,000. They continue.  

  ### Verdicts Under Altered Recovery Fractions  
  - **Recovery fraction = 0% (r = 0)**:  
    Condition becomes `p × A - c > 0` → `0.25×$15,000 - $5,000 = -$1,250 < 0`. **Quit immediately**.  
  - **Recovery fraction = 100% (r = 1)**:  
    Condition simplifies to `p×(A + S) + p×c > 0`, always true. **Continue indefinitely**.  

  ### Strongest Objection and Rebuttal  
  **Objection**: "Escalation is always psychological (e.g., loss aversion). Sunk costs are irrelevant; only marginal costs and benefits matter."  
  **Rebuttal**: This ignores the **fee-shifting rule**, which transforms sunk costs into *future recoverable assets*. When **r > 0**, **S** directly boosts EV(continue) via `p × r × S`. Rational actors *must* factor this in. With **r = 0.5**, the numbers show EV(continue) > EV(quit) at every **S**—no psychology needed.  

  ### The Trap  
  The **recovery fraction** is the engine: It couples past spending to future gains, creating a **rational escalation trap**. Rotating adjusters sustain it by freezing concession odds. The result is a game where EV stays positive at every fork, but total spend can dwarf the stake—a mathematical quirk, not weakness of will.
