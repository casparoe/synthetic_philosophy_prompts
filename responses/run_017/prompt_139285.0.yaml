    Then the condition: p*A + p*1*S + p*1*c - c > 0
    = 0.3*30000 + 0.3*S + 0.3*10000 - 10000
    = 9000 + 0.3*S + 3000 - 10000
    = 12000 - 10000 + 0.3*S = 2000 + 0.3*S > 0 always.
    So the agent would continue. The value function becomes:
    V(S) = A + 1*S + (c/p)*(1-1) = A + S.
    So V(S) = 30000 + S, which is always positive and greater than -S.

  **Strongest objection and why it fails:**
  Objection: Escalation of commitment is always psychological, driven by non-rational factors like loss aversion or the desire to justify past decisions. The sunk costs should not influence the decision.

  Why it fails: In this model, the sunk cost is recoverable (via the fee-shift) so it is a rational factor. The decision is based solely on forward-looking expected value. A new agent handed the file at any round, with no memory of the past, would see the same expected value and make the same decision. The trap is structural, created by the fee-shifting rule and the constant probability of concession due to rotating adjusters.

  **Final Thought Experiment Paragraph (under 250 words):**

  For two years, you've disputed a $30,000 water damage claim with your condo association's insurer. Each six months, a new adjuster reviews the file; each sees the case as a toss-up and might concede, with a 30% chance per round. Each round costs $10,000 in legal fees. The association's bylaws award the winner 60% of their costs. If you quit now, you lose all you've spent. If you continue, you pay $10,000 and then: with 30% chance, the adjuster concedes and you get $30,000 plus 60% of your total costs (including this round's); with 70% chance, the dispute continues. Even after spending $50,000, continuing has an expected net gain of over $46,000 compared to quitting's $50,000 loss. This is not the sunk-cost fallacy: the fee-shifting rule makes past spending an asset, as it increases potential recovery. If the recovery fraction were zero, you'd quit immediately. A new lawyer inheriting the case would make the same choice. The trap is structural.

  **Note on the distribution:**
  Entering the dispute had a positive expected value (about $16,667). However, the distribution is skewed: there is a chance of spending much more than expected. The trap lies in the fact that the expected value remains positive at every step, but the actual cost may balloon. For someone in your position, this means that even with perfect rationality, you are trapped in a game that can become very expensive with bad luck.

  **Concession probability constancy:**
  The probability of concession stays at 30% because each new adjuster starts from scratch. If the same adjuster stayed, their resolve might harden (probability of concession drops over time), making the expected value of continuing decrease and eventually fall below quitting, so escalation would stop.
