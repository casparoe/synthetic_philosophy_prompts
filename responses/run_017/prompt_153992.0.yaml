answer: |-
  ### Essay Question (as it appears on the exam paper)

  **Analyze the following case and its variants, formulating and defending a general principle about the defect in Moorean assertions. Your essay must:**  
  (a) State one general principle of the form: *"A subject’s sincere first-personal present-tense self-ascription of disbelief alongside her judgment that p is defective if and only if _______, because _______."*  
  (b) Apply this principle to **Variant 1**: A subject with a neural monitor (reliable but fallible) displaying her credence in p. She sees heavy rain, attends to "it is raining," the monitor reads 0.2, and she sincerely asserts: *"It’s raining, but I don’t believe it."*  
  (c) Apply the principle to **Variant 2**: Same setup, but she asserts: *"It’s raining—though my readout tells me I don’t believe it, and it’s usually right."* Does this retain the defect?  
  (d) Discuss whether your answer changes if the subject is a **collective agent** (e.g., a forecasting team whose official output is "rain" while its internal confidence register reads "not believed").  

  *Do not spend time rehearsing that Moorean sentences are not contradictions or that they are unassertable; these are your starting assumptions. Focus on justifying your principle and its implications.*  
  **(800 words maximum)**  

  ---

  ### Model Answer (689 words)  

  **General Principle:**  
  A subject’s sincere first-personal present-tense self-ascription of disbelief alongside her judgment that p is defective if and only if *it violates the constitutive commitment of judgment to present itself as settled belief*, because *to judge that p just is to present oneself as believing p, rendering the self-ascription of disbelief pragmatically self-undermining*.  

  **Application to Variant 1:**  
  The subject’s assertion remains defective. She judges that it is raining (evidenced by her assertion’s first clause) but simultaneously disavows belief via the second clause. The neural monitor’s output does not resolve the core defect: her *act of judging p* commits her to presenting herself as believing p. The readout provides third-person evidence about her credence, but her judgment operates under first-personal norms. By asserting p, she takes ownership of that judgment, making the appended disbelief ascription incoherent *as a performance of her own current stance*. Even if the monitor accurately reflects low credence, her assertion of p contradicts the very state the monitor describes, creating a pragmatic clash. The defect arises from the *act of assertion/judgment*, not from introspective failure.  

  **Application to Variant 2:**  
  The defect persists. While the subject attributes her disbelief claim to the readout ("my readout tells me"), the assertion’s structure still presents *her* as simultaneously endorsing p ("It’s raining") and reporting her lack of belief in p. Crucially, she endorses the readout’s reliability ("it’s usually right"), implicitly accepting its verdict as accurate. However, the act of asserting p *as her judgment* binds her to the normative commitment that she believes what she asserts. Framing the disbelief as externally reported does not absolve her of this commitment; it merely dresses the same contradiction in indirect terms. The assertion remains self-undermining: she vouches for p while vouching for evidence that she disbelieves p.  

  **Collective Agent Case:**  
  The defect disappears. A forecasting team’s "official output" is a declarative act expressing its *institutional position*, not necessarily the aggregated psychological states of its members. The "confidence register" reflecting aggregated credences is a separate report about internal statistics. When the team states "rain" while the register displays "not believed," there is no single agent violating a constitutive norm. The institutional voice ("we judge rain") functions like a third-person report: it does not commit the *collective as a unified subject* to believing its own output. The "judgment" here is a procedural output, not an expression of settled individual belief. Thus, no pragmatic self-undermining occurs because no individual is simultaneously endorsing p and disavowing belief. The principle’s scope is individual subjectivity.  

  **Theoretical Assessment:**  
  - **Method-Clash Views** (defect from conflicting belief-detection routes) fail: The neural monitor introduces a clash between introspection and external evidence, yet the defect persists even when disbelief is sourced *only* from the readout (Variant 2). The principle shows the defect is not about *how* disbelief is known, but the inherent commitment of judgment.  
  - **Self-Intimation/Avowal Views** (defect from belief’s essential transparency) fail: The subject lacks introspective access to belief states. If the defect required introspective failure, Variants 1 and 2 should be non-defective—yet they are not. The principle correctly locates the flaw in the *normative structure of assertion*, not psychology.  
  - **Commitment-Based Views** (defect from what judgment/assertion entails) succeed: They uniquely predict the persistence of the defect in Variants 1–2 and its absence in the collective case. Asserting p constitutively presents the speaker as believing p, making concurrent disbelief ascriptions performatively inconsistent. The neural monitor’s role is irrelevant; the act of judgment itself creates the commitment.  

  The neurological case underscores that the paradox’s core is *pragmatic*, not psychological: even when self-knowledge is mediated externally, the act of asserting p while denying belief remains self-defeating. The literature errs by overemphasizing introspection—Moorean absurdity is a norm of rational discourse, not a window into the mind.  

  ---  

  ### Marking Scheme (Total: 20 points)  
  **A-grade (16–20)**: Clear principle with "if and only if" + "because"; precise analysis of both variants *and* collective case; explicit theoretical comparison; no summary moves.  
  **B-grade (12–15)**: Principle stated but undersupported; partial analysis of cases; cursory theoretical remarks.  

  #### Must-Hit Points (4 points each):  
  1. **Explicit Principle**: Must include *both* "if and only if" (specifying necessary/sufficient conditions) *and* a "because" clause justifying it.  
     *Typical error: Omitting "iff" or giving vague justification.*  
  2. **Variant 1 & 2 Analysis**: Must argue *both* variants are defective and explain why the readout does *not* resolve the defect (e.g., appeal to judgment’s commitment).  
     *Typical error: Claiming Variant 2 is non-defective due to external evidence.*  
  3. **Collective Agent Contrast**: Must state the defect *disappears* for the collective and explain why (e.g., no unified subject, judgment as institutional output).  
     *Typical error: Treating collective as identical to individual.*  
  4. **Theoretical Discrimination**: Must contrast *at least two* families of views (e.g., method-clash vs. commitment) and explain which fits the cases.  
     *Typical error: Only describing views without testing them against cases.*  
  5. **No Credit for Summary Moves**: Automatic zero for sections repeating: "It’s not a contradiction," "It’s unassertable," or "It’s fine in third person/past tense" *without further argument*.  
     *Typical error: Using these as primary analysis.*  

  #### Deductions:  
  - -2 if principle lacks "iff" or "because"  
  - -1–2 per case/theory if undersupported  
  - -4 if summary moves replace argument  
  - -2 if collective case not addressed  

  ---  
  **Rationale**: This design forces engagement with *why* the defect persists under externalized self-ascription, testing theories against edge cases (no introspection, collective agency). The model answer prioritizes commitment-based views but would credit alternatives if coherently defended against the variants. The marking scheme penalizes recitation while rewarding principled innovation.
