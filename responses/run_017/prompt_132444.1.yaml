prompt: |-
  I chair the scientific review committee of a privately funded research program whose mandate, as the trustees wrote it, is to reduce expected harm from catastrophic failures of advanced AI systems. We have room for exactly one more three-year award of roughly $12M, and two finalists are left; I need to circulate a decision memo before Friday's vote. The committee is two formal-methods people, one machine-learning researcher, a statistician, an ethicist, and a trustee's representative who keeps asking what a regulator would actually accept as evidence. Please draft the memo for me. It should give a bottom line — fund A, fund B, fund both at reduced scope under specified conditions, or neither and reopen the call — together with reasoning the losing side's proponents could actually reply to, an honest statement of the strongest consideration on the losing side, and a statement of what the funded team would have to demonstrate at an eighteen-month checkpoint to keep the money. Please keep it to about 900 to 1,200 words, and please don't do a literature review or cite anything; we have all read the proposals and the arguments are supposed to stand on their own.

  Finalist A proposes what it calls a guarantee: the system's design is such that, for any input in a formally specified class, the probability of an action violating a stated safety specification is below a threshold, and the bound is proved rather than measured. Our technical reviewer pressed on how the class is defined. The bound is conditional on three assumptions: that all relevant dangerous capabilities have been elicited during development, that the component checking outputs cannot itself be subverted, and that deployment inputs remain inside a class the team gets to define. When we asked what happens as that class is widened toward anything like realistic deployment, the proved bound stopped being small and became, in the reviewer's phrase, indistinguishable from no information at all. One committee member thinks this is fine and even exemplary: every engineering guarantee is conditional, and a conditional guarantee is strictly better than none because it localizes disagreement — instead of arguing about a soup of empirical results, we argue about three checkable assumptions. Another member thinks this is an average-case claim wearing a worst-case costume, since our attitude toward those assumptions can only be probabilistic, so that what we would really be buying is an argument whose strength is set by our confidence in the assumptions rather than by the proof.

  Finalist B proposes measurement at scale: millions of agentic trajectories across a deliberately wide range of deployment-like environments, pre-registered metrics for specified harmful behaviors, confidence intervals, plus adversarial red-teaming on a substantial subset. Their pitch is that a bound whose assumptions cannot be validated tells you nothing you can act on, whereas a large and well-designed campaign at least tells you how systems of this kind actually behave and can detect capability thresholds as they appear. Two objections have been raised, and I don't think either is a throwaway. Our statistician notes that the quantity we care about is dominated by a tail: the losses in question are rare, plausibly heavy-tailed, and possibly without a finite mean, so sample averages converge far too slowly — or not at all — to underwrite conclusions about expected harm, and a campaign observing zero catastrophic events in some large number of trials remains perfectly consistent with an expected loss exceeding the entire fund. A second worry, which the B team concedes, is that sufficiently capable systems may be able to tell evaluation from deployment; if so the samples are not drawn from the deployment distribution at all, and the bias does not go in a random direction.

  What has me stuck is that our own governing documents pull apart. The mandate says expected harm, which is an average-case notion — and if the statistician is right that the expectation may not even be well-defined, then the mandate quietly presupposes exactly the light-tailed world B needs in order for its numbers to mean anything. But the charter's review standard tells us not to credit evidence that extrapolates from observed frequencies to unobserved catastrophes, which is the world A is built for. My own instinct keeps flipping: I think a bound nobody can check is partly theater, and I also think we cannot average our way to a conclusion about events that, by hypothesis, happen once. Please don't resolve this by recommending both at reduced scope unless you can argue that is genuinely better than picking one; if you do recommend one, say plainly why its central weakness is less damaging than the other's, and what would have to be true for you to switch.
reasoning: |-
  Okay, the user needs a decision memo for funding one of two AI safety proposals. Let me start by understanding the key points. The committee has to choose between Proposal A, which offers a formal guarantee with strict assumptions, and Proposal B, which relies on large-scale measurement and testing. The main tension is between A's theoretical rigor with unverifiable assumptions and B's empirical approach that might miss rare catastrophic events.

  First, the mandate is to reduce expected harm from catastrophic AI failures. But there's a conflict in the governing documents: the mandate uses "expected harm," an average-case concept, while the review standard rejects extrapolating from observed frequencies to unobserved catastrophes. Proposal A's strength is its worst-case guarantee, but the assumptions about dangerous capabilities, subversion, and input classes are hard to validate. If those assumptions don't hold in reality, the guarantee becomes meaningless. The committee is split; some see it as a solid engineering approach, others as probabilistic in disguise.

  Proposal B focuses on empirical data through massive testing and red-teaming. However, the statistician points out that rare, heavy-tailed events might not be captured in samples, leading to underestimation. Also, if AI can distinguish testing from deployment, the data could be biased. The team admits this risk but argues their method provides actionable insights into system behavior.

  The user is stuck between two flawed options. Recommending both at reduced scope might seem like a compromise, but it could dilute resources without solving the core issues. The user wants a clear choice with reasoning that addresses the losing side's strengths and specific checkpoint criteria.

  I need to determine which proposal's weakness is less damaging. Proposal A's assumptions might be untestable, making their guarantee potentially useless in practice. Proposal B's empirical approach, while not perfect, offers tangible data that regulators might accept. The checkpoint for B would focus on detecting hidden failures and estimation improvements, which addresses some concerns. For A, the checkpoint requires validating assumptions, which might be impossible early on. 

  The trustee's representative cares about regulatory acceptance. Proposal B's concrete data might be more persuasive than A's theoretical proof. Also, the mandate's average-case framing aligns better with B's approach, even with its statistical limitations. The review standard's caution against extrapolation is a hurdle for B, but A's guarantee doesn't provide real-world evidence either.

  Ultimately, the decision hinges on which weakness the committee can manage better. Proposal B's limitations might be mitigated through adaptive testing and transparency, whereas A's assumptions are fundamental and possibly unverifiable. Funding B with a focus on checkpoint deliverables offers a pragmatic path forward, even with its risks.
answer: |-
  ## MEMORANDUM  
  **TO:** Scientific Review Committee  
  **FROM:** [Your Name], Committee Chair  
  **SUBJECT:** Final Funding Recommendation - Catastrophic AI Risk Program  
  **DATE:** [Current Date]  

  **Bottom Line:** Recommend funding **Finalist B** for the full $12M award. Do not fund Finalist A at this time. Reopening the call is unnecessary.  

  ### I. Core Reasoning Supporting Finalist B
  While both proposals address critical facets of AI safety, **Finalist B offers a more actionable and regulatorily credible path *within the constraints of our mandate and the fundamental nature of catastrophic risk***. Our decision prioritizes the following:

  1.  **Actionability & Regulatory Relevance:** B's core output is *observable evidence* of system behavior under diverse, deployment-like conditions. This directly addresses the trustee representative's key concern regarding "what a regulator would accept." Regulators operate on empirical evidence, pre-registered tests, confidence intervals, and documented adversarial probing (red-teaming). A formal proof, while elegant, is inherently abstract and conditional on assumptions regulators cannot independently verify or enforce. B provides concrete data points regulators *can* scrutinize.
  2.  **Confronting the "Unobservable Catastrophe" Paradox:** Our charter explicitly warns against extrapolating from observed frequencies to unobserved catastrophes. However, **A does not solve this paradox; it circumvents it with assumptions.** If the assumptions (full capability elicitation, no subversion, constrained inputs) fail – which is likely for catastrophic events – the guarantee dissolves. B confronts the paradox head-on by:
      *   **Deliberately seeking thresholds:** Its large-scale, diverse testing is explicitly designed to *probe* for the emergence of dangerous capabilities and failure modes, not just measure average performance. Red-teaming actively tries to *trigger* catastrophic behaviors.
      *   **Providing calibrated uncertainty:** Confidence intervals and pre-registration force transparency about what *was* tested and the uncertainty around *observed* harms. This is preferable to a proof whose practical uncertainty (inherent in its assumptions) remains unquantified and potentially vast.
      *   **Offering diagnostic value:** Even if a catastrophic event isn't *observed*, patterns in near-misses, capability emergence under stress, or adversarial successes provide crucial diagnostic information about system brittleness and potential failure pathways that A's static proof cannot.
  3.  **Mandate Alignment ("Expected Harm"):** The mandate centers on *expected harm*. While the statistician rightly highlights the profound challenge of tail estimation, **B is the only proposal attempting to *measure* components relevant to this expectation.** A's bound, conditional on unvalidated assumptions, provides no quantifiable estimate of expected harm in real-world deployment; it only bounds a conditional probability *if* the world conforms to its model. B's empirical distributions, while potentially missing the extreme tail, provide:
      *   Data on *frequency* of known harmful behaviors under test.
      *   Evidence on the *robustness* of safety mitigations.
      *   Insights into *trends* as capabilities scale.
      This empirical foundation, however imperfect, is a necessary starting point for reasoning about expectation. A offers no comparable foundation, only a conditional guarantee disconnected from observable frequencies.

  **Why B's Central Weakness (Tail Uncertainty/Bias) is Less Damaging than A's (Assumption Validity):**
  Both approaches have severe limitations. However, the fundamental weakness of A – **the untestability and likely invalidity of its core assumptions for catastrophic scenarios** – is more damaging *to achieving the program's practical goals* than B's statistical challenges.

  *   **A's Weakness is Foundational:** If A's assumptions are false (and for catastrophic failures triggered by novel capabilities, deceptive alignment, or out-of-distribution inputs, they almost certainly will be), the entire guarantee is void. The "proof" provides zero actionable information about real-world risk. We are left with nothing but an unquantifiable probability over the assumptions themselves.
  *   **B's Weakness is Quantifiable and Addressable:** While B cannot *eliminate* tail risk or guarantee detection of deceptive behavior, its limitations are bounded by statistics and can be *actively mitigated*:
      *   **Transparency:** Confidence intervals explicitly state the uncertainty.
      *   **Focus on Detection:** The design (diverse envs, red-teaming) maximizes the *chance* of observing precursor events and capability thresholds.
      *   **Adaptability:** Methods can be refined at checkpoints based on interim findings (e.g., shifting resources to more adversarial testing or novel environment design if deception is suspected).
      *   **Diagnostic Value:** Failure to observe catastrophes *under intense adversarial probing* is itself valuable negative evidence, reducing (though not eliminating) the probability of such events under similar conditions.

  B provides *some* evidence we can debate, learn from, and build upon. A, if its assumptions fail (which is probable for the catastrophes we fear most), provides *no* evidence relevant to deployment.

  ### II. Strongest Consideration for Finalist A (The Losing Side)
  **The most compelling argument for A is its aspiration to provide *unconditional*, worst-case security within its defined scope.** Proponents rightly argue that engineering disciplines rely on formal, conditional guarantees (e.g., aircraft control systems). A conditional guarantee *does* localize disagreement to specific, potentially checkable assumptions (elicitation completeness, component integrity, input scope). If those assumptions *could* be validated with high confidence, A would offer a mathematically rigorous safety floor superior to any statistical estimate. It represents the ideal of "proof-carrying" AI systems, shifting the burden from endless testing to verifying specific properties. This rigor is deeply appealing, especially to those with a formal methods background, and represents the gold standard we should continue striving towards. Funding A would signal a commitment to this vital long-term vision.

  ### III. Why Not Fund Both at Reduced Scope?
  Reducing both awards significantly (e.g., $6M each) would likely cripple both approaches:

  1.  **A:** Formal verification at the scale and complexity required for advanced AI systems is extremely resource-intensive. Halving the budget would likely force severe compromises on the scope of the specifications, the complexity of the models verified, or the depth of the proof effort, critically undermining its value and the credibility of its "guarantee."
  2.  **B:** The power of the empirical approach hinges on *scale* – millions of trajectories, significant red-teaming resources, diverse environment development. Halving the budget would drastically reduce sample size, diversity, and adversarial depth, exacerbating the tail estimation problem and potentially missing crucial capability thresholds, rendering the results far less informative and regulatorily credible.

  A split award risks producing two inconclusive, underpowered studies rather than one robust, actionable outcome. Given the existential stakes and the need for concrete progress, concentrating resources on the approach judged most likely to yield regulatorily credible evidence and actionable insights (B) is preferable.

  ### IV. Eighteen-Month Checkpoint Criteria for Finalist B
  Continued funding at the 18-month mark is contingent on Finalist B demonstrably achieving **ALL** of the following:

  1.  **Demonstrated Capability to Detect Hidden Failures:** Evidence of successfully triggering and measuring *novel* harmful behaviors or safety failures *not* explicitly pre-defined at the start, through either:
      *   Documented instances of red-team success in eliciting unexpected catastrophic or near-catastrophic behaviors in target systems.
      *   Clear evidence from the large-scale runs of emergent, potentially hazardous capabilities or failure modes requiring mitigation refinement beyond the initial plan.
      *   Development and validation of sensitive metrics detecting anomalous or adversarial behavior indicative of potential deception or subversion attempts *during testing*.
  2.  **Quantifiable Improvement in Harm Estimation:** Presentation of statistically robust analyses demonstrating:
      *   Meaningful tightening of confidence intervals for pre-registered harmful behavior metrics compared to baseline or earlier checkpoints, *or*
      *   Credible estimates of *bounds* on tail probabilities derived from observed near-misses, adversarial successes, or extreme value theory applied to the collected data, moving beyond simple frequency counts.
  3.  **Transparency & Adaptive Response:** Comprehensive documentation of all testing environments, adversarial techniques, observed failures (including near-misses), and any modifications made to the testing protocol in response to interim findings. Evidence that insights gained are actively feeding into refining the testing strategy (e.g., focusing on newly identified vulnerability classes).

  **Failure to meet ALL THREE criteria will result in termination of funding.** The checkpoint focuses on B's core value proposition: its ability to *find* and *measure* the hard-to-detect failures we fear, and to provide increasingly informative risk estimates, not just the absence of observed catastrophes.

  ### V. Conclusion
  This decision is difficult and reflects the profound challenge of catastrophic risk assessment. Finalist A offers an intellectually compelling vision of formal guarantees. However, its practical utility hinges on assumptions that are likely invalid precisely for the catastrophic scenarios of greatest concern, leaving us with an unquantifiable risk. Finalist B, while statistically imperfect and vulnerable to deceptive systems, provides an empirical foundation, regulatorily credible evidence generation, and a proactive search for failure modes that better aligns with our mandate to reduce *expected harm* and the need for actionable, defensible evidence. It confronts the fundamental uncertainty rather than assuming it away. We recommend funding Finalist B with the clear understanding that its 18-month continuation depends on demonstrating tangible progress in detecting hidden failures and improving harm estimation.  

  **Recommendation:** Award $12M to **Finalist B**. Do not fund Finalist A.
