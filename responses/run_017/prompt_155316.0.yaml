  ### **Part (b): Platonia Dilemma**  
  **Student's Answer (7 marks)**  
  *(i) Standard analysis: "All send → nobody wins. Sending dominates."  
  (ii) Superrationality: "Randomise with p = 1/20. Maximises P(exactly one telegram). Expected payoff = $50M. Can't cheat because symmetry."*  

  **Assessment & Comments**  
  - **(i) ✓ Perfect (2/2 marks)**:  
    - Correct dominance argument: Sending has positive expected payoff if others might not send, leading to all sending and $0.  
  - **(ii) Mixed (4/5 marks)**:  
    - **✓ Correct**:  
      - Randomisation with p = 1/20 is optimal.  
      - Formula for P(exactly one) = 20p(1−p)¹⁹ maximised at p=1/20.  
      - Expected payoff = (1/20) × $1B = $50M.  
    - **△ Partially Correct/Incomplete**:  
      - **"Break symmetry with random device"** → Right idea, but *why*? Superrational players assume all use identical reasoning, so deterministic choices lead to identical actions (all send/none send). Randomisation breaks symmetry.  
      - **"No player can sneak ahead"** → Correct but poorly justified. If one defects (sends for sure), others (being superrational) would also defect → all send → $0. However, the student implies this is because "they all could," which conflates superrationality with retaliatory strategies (not applicable here).  
    - **Missing**:  
      - Why p=1/20 maximizes the probability of *exactly one* sending (derivative of p(1−p)¹⁹ = 0 → p=1/20).  

  **Mark: 6/7**  
