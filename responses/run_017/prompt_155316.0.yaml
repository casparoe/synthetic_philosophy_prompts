  - **(iv) ✗ Incorrect (0/1 mark)**:  
    - Superrationality *only works if both players are superrational*. If Alice knows Bob is ordinary-rational, she should defect (dominant strategy). The "universal rule" claim misrepresents Hofstadter.  

  **Mark: 4.5/8**  
