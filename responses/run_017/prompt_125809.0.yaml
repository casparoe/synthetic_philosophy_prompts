prompt: |-
  i run a monthly data-literacy hour for the analysts on our growth team — about fifteen people, very fluent in SQL, nervous around anything causal. last month we had a small incident: a new onboarding flow lost on the topline conversion number but won inside both the mobile and the desktop cuts. two of them walked away with opposite morals. one says this proves topline numbers are junk and you should always read the segments. the other says it's just a weighting artefact, nothing to see, report the topline and move on. i've got 50 minutes and a whiteboard and i want to actually fix the confusion, not just show them a cute trick and have them be more confused.

  so please don't explain Simpson's paradox to me — plan how i should teach it, to this exact room:

  - the order the ideas have to arrive in, and what depends on what. my instinct is that the "a rate is just a weighted average" bit has to land before any reversal is shown, but tell me if there's something that has to come even before that.
  - the one example that carries the whole session, with actual small numbers. it should be about their world (experiments, funnels, platforms, traffic mix), small enough to hold in your head, and it should make the flip feel inevitable rather than like a card trick. also: tell me what the example must *not* have — i'm wary of an example where the right answer is obviously "the subgroups, obviously," because that teaches them the wrong lesson in the other direction. and say why i should skip the two cases everyone reaches for (the kidney-stone one, the Berkeley admissions one).
  - the misconceptions, in the order this room will actually produce them, and where in the sequence i should head each off. the ones i'm betting on: "the topline is wrong / someone messed up the math"; "more data would fix it"; "the subgroups are always the true answer"; "we randomize our A/B tests so this can't happen to us" (i suspect that last one is only half true and i don't trust my own explanation of why); and "ok, then just segment harder" — which i also have a feeling isn't automatically right, but again i can't say why.
  - one question i can ask in the last five minutes that would tell me they got it rather than just learned to be suspicious of averages.
  - what i should openly refuse to get into at this level.

  commit to things: pick one example, tell me what to cut, and give me a straight verdict on both of my colleagues' morals — which one survives and why, even if the answer is that they're both wrong. where your plan rests on a contested call, say so and tell me what you'd do anyway.
reasoning: |-
  We are teaching data-literate analysts who are strong in SQL but nervous about causality. The goal is to resolve confusion from a real incident and prevent two opposite takeaways.

  Core idea: Simpson's paradox is a phenomenon where a trend appears in different groups of data but disappears or reverses when the groups are combined. It arises from confounding variables (here, the platform: mobile vs. desktop) and the fact that the overall rate is a weighted average of subgroup rates, with weights that can change.

  Order of ideas:

  1. Start with the concrete incident they experienced: 
     - New onboarding flow: topline conversion rate went down, but when split by platform (mobile and desktop), each showed an improvement. 
     - This sets up the paradox and makes it relevant.

  2. Before showing the reversal, establish foundational concepts:
     a. **Rates as weighted averages**: The topline conversion rate is a weighted average of the subgroup rates, where the weights are the proportions of users in each subgroup. 
        - Formula: Overall rate = (rate_mobile * n_mobile + rate_desktop * n_desktop) / (n_mobile + n_desktop)
     b. **Why weights matter**: Show that if the weights change (e.g., the proportion of mobile users increases), the overall rate can change even if subgroup rates stay the same.

  3. Now, explain the incident with a small, hypothetical example that mirrors their world:

     Example setup:
     - Two platforms: mobile and desktop.
     - We have an A/B test: control (old flow) and treatment (new flow).
     - We'll create a scenario where the new flow has a higher conversion rate on each platform but a lower overall conversion rate.

     Numbers (keep small):

     Control group (old flow):
       - Mobile: 100 users, 50 converted -> 50% rate
       - Desktop: 100 users, 30 converted -> 30% rate
       - Overall: 200 users, 80 converted -> 40% rate

     Treatment group (new flow):
       - Mobile: 50 users, 30 converted -> 60% rate (better than control's 50%)
       - Desktop: 150 users, 60 converted -> 40% rate (better than control's 30%)
       - Overall: 200 users, 90 converted -> 45% rate? Wait, let's check: 30 (from mobile) + 60 (from desktop) = 90. 90/200 = 45%. 

     But wait, in the incident the topline was worse? So let's adjust to make the topline worse:

     Revised to have the topline worse:

     Treatment group (new flow):
       - Mobile: 30 users, 18 converted -> 60% rate (better than control's 50% by 10pp)
       - Desktop: 170 users, 51 converted -> 30% rate (same as control? But we want better). Let's make it better but by a small margin.

     Let me recast to have the treatment better in each segment but worse overall:

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 900 users, 270 conversions (30%)  [note: more desktop users]
       - Overall: 1000 users, 320 conversions (32%)

     Treatment (new flow):
       - Mobile: 300 users, 180 conversions (60%)  [better and more mobile users now?]
       - Desktop: 700 users, 245 conversions (35%)  [better than 30%]
       - Overall: 1000 users, 425 conversions? 180+245=425 -> 42.5%? That's better, not worse.

     We need the treatment overall to be worse. How?

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 900 users, 270 conversions (30%)
       - Overall: 1000 users, 320 conversions (32%)

     Treatment (new flow):
       - We want each segment to improve: say mobile improves to 60%, desktop to 35%.
       - But we also change the allocation: say in treatment, we have more desktop users (which has lower conversion) and fewer mobile users.

     Treatment:
       - Mobile: 50 users, 30 conversions (60%)  [improved from 50%]
       - Desktop: 950 users, 332.5? Not integer. Let's avoid decimals.

     Let me use:

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 900 users, 270 conversions (30%)
       - Overall: 1000 users, 320 conversions (32%)

     Treatment (new flow):
       - Mobile: 200 users, 120 conversions (60%) [improved by 10pp]
       - Desktop: 800 users, 280 conversions (35%) [improved by 5pp]
       - Overall: 1000 users, 400 conversions? 120+280=400 -> 40%? That's better.

     We need the overall to be worse. So let's make the improvement in desktop smaller and the shift to desktop (the worse segment) more pronounced.

     How about:

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 900 users, 270 conversions (30%)
       - Overall: 1000 users, 320 conversions (32%)

     Treatment (new flow):
       - Mobile: 50 users, 30 conversions (60%) [improved]
       - Desktop: 950 users, 285 conversions (30%)? That's not improved. We need improvement in each.

     We can have:

     Treatment (new flow):
       - Mobile: 50 users, 30 conversions (60%) [improved from 50%]
       - Desktop: 950 users, 313.5 -> not integer.

     Use:

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 900 users, 270 conversions (30%)
       - Overall: 1000 users, 320 conversions (32%)

     Treatment (new flow):
       - Mobile: 50 users, 30 conversions (60%)
       - Desktop: 950 users, 304 conversions? Then rate = 304/950 ≈ 32%? We need it to be improved, say 32.5%? But that's 308.75 -> not integer.

     Better to scale down:

     Control (old flow):
       - Mobile: 10 users, 5 conversions (50%)
       - Desktop: 90 users, 27 conversions (30%)
       - Overall: 100 users, 32 conversions (32%)

     Treatment (new flow):
       - Mobile: 5 users, 3 conversions (60%)
       - Desktop: 95 users, 30 conversions (31.578%) -> but we want it to be higher than 30, but let's say 31.5 is not integer. Instead, adjust the numbers to avoid decimals.

     How about:

     Control (old flow):
       - Mobile: 100 users, 50 conversions (50%)
       - Desktop: 100 users, 30 conversions (30%)
       - Overall: 200 users, 80 conversions (40%)

     Treatment (new flow):
       - Mobile: 20 users, 12 conversions (60%) [improved]
       - Desktop: 180 users, 63 conversions (35%) [improved from 30% to 35%? that's 5pp, but 35% of 180 is 63]
       - Overall: 200 users, 75 conversions -> 37.5% (which is less than 40%)

     There we go: 
        Control: mobile 50%, desktop 30%, overall 40%
        Treatment: mobile 60%, desktop 35%, overall 37.5%

     Why? Because in the treatment group, the mix shifted to desktop (which has a lower conversion rate) and even though both rates improved, the shift to the lower-rate group was so dramatic that the overall went down.

     This is the example we'll use.

  4. Explain the example step by step on the whiteboard:

     - Draw a table for control and treatment, with mobile and desktop.
     - Show the numbers and the rates for each segment.
     - Then show the overall by combining.

     Key point: The overall rate is a weighted average. In control, the weights for mobile and desktop were 50% each (100/200 for mobile, 100/200 for desktop). In treatment, the weights are 20/200 = 10% for mobile and 180/200 = 90% for desktop. So the overall rate in treatment is: 60% * 10% + 35% * 90% = 6% + 31.5% = 37.5%.

     Now, why did the weights change? Because the new flow might have been shown to a different mix of users. Maybe the new flow was rolled out in a way that more desktop users saw it? Or maybe the new flow attracted more desktop users? But in an A/B test, we randomize, so we expect the same mix. However, note: if the A/B test is randomized overall, then the mix of mobile and desktop should be the same in control and treatment? But wait, that's the point: in a properly randomized experiment, the mix of the confounding variable (platform) should be the same in both groups. So why did we see a shift in the example? 

     This leads to the next misconception: "we randomize so this can't happen".

     We have to address: even in randomized experiments, if the sample size is small, there can be imbalances in the subgroups. But more importantly, the key is that the randomization is at the user level, but if we don't condition on platform, the overall effect might be confounded by platform? Actually, no: in expectation, the mix is the same. So in large samples, the overall effect should be a weighted average of the subgroup effects with the same weights. But in finite samples, imbalance can occur. However, the paradox can also occur in observational data where there is no randomization.

     But in their incident, they ran an experiment? So we must address:

     - In a perfectly balanced randomized experiment (large enough), the mix of mobile and desktop should be the same in control and treatment. Then, the overall effect would be the weighted average using the same weights (the overall proportion of mobile and desktop in the entire population). Then, if the treatment improves conversion in both mobile and desktop, the overall must improve. So the paradox shouldn't occur? 

     However, note: the incident happened. Why? Because the experiment might not have been perfectly balanced? Or because the treatment changed the composition? For example, maybe the new flow caused more users to come from desktop? But that would be a change in the user composition, which is not due to randomization but due to the treatment effect. This is a more subtle point.

     Alternatively, maybe the A/B test was run on a subset of users that was not representative? Or maybe the traffic mix changed during the experiment? 

     But to keep it simple for this session: the paradox can occur in experiments when there is an imbalance in a confounding variable (platform) between the control and treatment groups. This imbalance can happen by chance, especially in small samples, or due to other factors (like the treatment affecting who is exposed).

     However, the main point for now is: the overall number is not "junk", but it can be misleading if there is a shift in the composition. So we must check the subgroups.

  5. Addressing the misconceptions in the order they might come:

     a. "The topline is wrong / someone messed up the math": 
          - We show the math: the overall is a weighted average. It's correct, but it's a single number that doesn't tell the whole story.

     b. "More data would fix it": 
          - In an experiment, if we have more data, we might reduce the chance of imbalance. But if the imbalance is due to a systematic reason (like the treatment attracting more desktop users), then even with more data, the overall effect might be biased. 

     c. "The subgroups are always the true answer": 
          - Not necessarily. The subgroups are one way to look, but we must be cautious: what if there are other subgroups? And what if the treatment effect is different in subgroups? The key is to understand the causal effect. In an A/B test, we want to know the average treatment effect. If we think platform is an effect modifier, then we should look at the subgroups. But the overall effect is still valid if we interpret it as the effect in the population we ran the test on (with the observed mix). However, if the mix changes in the future, then the overall effect we saw might not hold.

     d. "We randomize our A/B tests so this can't happen to us": 
          - Half true. In a large randomized experiment, the mix of platforms should be similar in control and treatment. So the overall effect should be close to the weighted average of the subgroup effects using the same weights. However, in small samples, imbalance can occur (by chance) leading to Simpson's paradox. Also, if the treatment changes the composition (e.g., by affecting which platform users use), then the overall effect might be confounded. 

     e. "Ok, then just segment harder": 
          - Why not? Because if you segment too much, you get small sample sizes and noise. Also, you might not have all the relevant confounders. The goal is to find the right level of aggregation.

  6. The verdict on the two morals:

     - First colleague: "topline numbers are junk and you should always read the segments" -> Overstates: topline is not junk, but it can be misleading when there is a confounding variable that has shifted. We should check segments when we suspect a confounder (like platform) that might have changed.
     - Second colleague: "it's just a weighting artefact, nothing to see, report the topline and move on" -> Understates: the weighting artifact is important because it tells us that the composition changed. We must understand why the composition changed (was it by chance? or because of the treatment?) and what that means for the business.

     The balanced takeaway: The topline number is a valid summary of the overall experiment, but it can be affected by changes in the composition of the user base. We should always check key segments (like platform) to ensure that the effect is consistent and to understand if the overall result is being driven by a shift in the mix. The decision to act on the topline or the subgroups depends on the context and the reason for the shift.

  7. One question to check understanding:

     In the last five minutes, ask: "Imagine we run an experiment and see that the overall conversion rate for the new feature is 1% lower than control. But when we split by new vs. returning users, we see that the new feature improved conversion by 2% for new users and 1% for returning users. What could be the reason for the overall drop? And what would you do next?"

     We expect them to say: the overall drop might be because the new feature was shown to a higher proportion of returning users (who have a lower conversion rate) and that shifted the average. They should then check the allocation of users (new vs. returning) in the treatment and control groups to see if there was an imbalance. They might also consider whether the treatment effect is different and whether the mix might change in the future.

  8. What to refuse to get into:

     - Do not dive deep into causal inference (e.g., backdoor criterion, DAGs) at this point.
     - Avoid the math of how to combine subgroups (like inverse probability weighting) for estimating causal effects.
     - Skip the classic examples (Berkeley, kidney stones) because they are not in the context of online experiments and might distract.

  Plan:

  1. (5 min) Set up the incident and the two takeaways. State the goal: understand why this happens and how to think about it.

  2. (10 min) Foundational: Explain that the overall conversion rate is a weighted average of the subgroup rates. Show with a simple example (without reversal) how changing the weights changes the overall rate.

  3. (20 min) Present the example with the reversal (the one we built: control 40% overall, treatment 37.5% overall, but both segments improved). Break it down step by step. Show the weights and the calculation.

  4. (10 min) Address the misconceptions as they come up during the example. Specifically, preempt:
     - "Randomization prevents this": Explain that in a large experiment, the mix should be the same, but in practice, imbalances can occur (especially in small samples) or the treatment might change the composition.
     - "Subgroups are always the truth": Explain that we need to consider the business context: if the user mix is expected to change (e.g., we plan to target more desktop users), then the subgroup analysis might be more informative. But if the mix is stable, the overall is fine.

  5. (5 min) Verdict: Both colleagues have a point, but neither is entirely right. We cannot discard the topline, but we must investigate why the composition changed and understand the subgroup effects to make an informed decision.

  6. (5 min) Check understanding with the question about new vs. returning users.

  Refuse to get into:
     - Advanced causal inference methods.
     - How to design experiments to avoid this (beyond checking balance and stratifying).
     - Other examples that are not directly related to their work.

  We are using the example with mobile and desktop in an A/B test with the numbers:

  Control:
    Mobile: 100 users, 50 converted (50%)
    Desktop: 100 users, 30 converted (30%)
    Overall: 200 users, 80 converted (40%)

  Treatment:
    Mobile: 20 users, 12 converted (60%)
    Desktop: 180 users, 63 converted (35%)
    Overall: 200 users, 75 converted (37.5%)

  Note: The treatment has a much larger proportion of desktop users (90% vs 50% in control) and desktop has a lower conversion rate. Even though both rates improved, the overall dropped because of the shift in the user mix.

  This example is small, relevant to their world, and the flip is due to the change in weights (which we highlight) and not a math error.
answer: |-
  Here's a battle-tested lesson plan tailored to your analysts. I'll commit to specifics, skip the classics, and fix the misconceptions using their exact context.

  ### **The Teaching Sequence (50 min)**
  1. **Start with their incident (5 min)**  
     Recap: "New flow lost topline conversion but won on mobile & desktop. Two smart takeaways: 'Always trust segments' vs. 'Topline is king'. Today we resolve this."

  2. **Anchor: "A rate is a weighted average" (10 min)**  
     *Why first?* If this doesn’t land, the reversal feels like magic.  
     - **Whiteboard:**  
       ```  
       Overall Conversion = (Conv_mobile × Users_mobile + Conv_desktop × Users_desktop) / Total Users  
       ```  
     - **Key insight:** The topline is *not* a "true" number—it’s an average *weighted by user mix*.  
     - **Ask them:** "If mobile conversion is 10% and desktop is 20%, which group would you rather have more of? How does shifting traffic change the topline?"

  3. **The Killer Example (15 min)**  
     *Why this example?* It mirrors their incident, uses tiny numbers, and makes the reversal inevitable.  

     |          | **Control (Old Flow)** | **Treatment (New Flow)** |
     |----------|------------------------|--------------------------|
     | **Mobile** | 100 users → 50 conv (50%) | 20 users → 12 conv (60%) |
     | **Desktop**| 100 users → 30 conv (30%) | 180 users → 63 conv (35%) |
     | **Topline**| 200 users → 80 conv (40%) | 200 users → 75 conv (37.5%) |

     - **Walkthrough:**  
       - Mobile improved (50% → 60%), desktop improved (30% → 35%).  
       - But topline *dropped* (40% → 37.5%).  
     - **Make them calculate weights:**  
       - Control: 50% mobile traffic × 50% rate + 50% desktop × 30% rate = 40%  
       - Treatment: 10% mobile × 60% + 90% desktop × 35% = 37.5%  
     - **Why it works:**  
       - Treatment drew 9× more desktop users (low-converting group).  
       - Improvement in rates was overwhelmed by traffic shift.  

     *What this example AVOIDS:*  
     - No "obvious" winner (both segments improved!).  
     - No ethical/social baggage (unlike Berkeley).  
     - Forces them to confront weights, not "truthiness" of segments.

  4. **Tackle Misconceptions Head-On (15 min)**  
     Address these *in this order* as they arise:  

     - **"Topline is wrong / math error!"**  
       → "No, math is correct. But the topline hides *why* it changed: rate shifts or traffic shifts?"  

     - **"We randomize A/B tests—this can’t happen!"**  
       → **Half true:** Randomization *aims* for equal traffic splits, but:  
          - Platform traffic can drift (e.g., mobile surge during holidays).  
          - Treatment *itself* can attract different users (e.g., new flow appeals more to desktop users).  

     - **"Subgroups are always the true answer!"**  
       → "Not automatically. What if desktop’s 'improvement' is noise? Or mobile tanked for new users? Segments can mislead too."  

     - **"Just segment harder!"**  
       → "Segment *smarter*. If you slice to 10 groups, small samples create noise. Platform matters here—but not every cut will."  

     - **"More data fixes this!"**  
       → "No—if traffic mix shifts *consistently* (e.g., desktop users grow), the paradox persists at any scale."

  5. **Verdict on the Two Morals (3 min)**  
     - **Colleague 1 (trust segments):** Partially survives. Segments *reveal the driver* (traffic shift), but they’re not inherently "truer."  
     - **Colleague 2 (report topline):** Dangerous. Topline is valid *only if* user mix is stable—which it wasn’t.  
     → **Final takeaway:** "Topline is your headline. Segments are your why. You need both, but weights are the plot twist."

  6. **Check Understanding: The 1 Question (2 min)**  
     Ask: **"If we roll out this new flow globally, and desktop traffic keeps growing, will our overall conversion likely go up, down, or stay the same? Why?"**  
     - *Right answer:* "Likely down—because desktop has lower conversion, and its weight increased." (Shows they grasp weighting > segment rates).  
     - *Wrong answer:* "Up—because both segments improved!" (Missed weighting).

  ### **What to Refuse to Discuss**  
  - **Causal diagrams (DAGs):** Too abstract for this session.  
  - **Statistical fixes (IPW, stratification):** Save for "Data Literacy Hour: Part 2."  
  - **Kidney stones/Berkeley examples:** Distracting and feel like "parlor tricks."  

  ### **Why This Works**  
  - **Uses their context:** Platforms, conversion, traffic shifts.  
  - **Makes the paradox inevitable:** The weights *must* cause the flip in your example.  
  - **Attacks real misconceptions:** Randomization & over-segmentation are their crutches.  
  - **Gives a clear verdict:** Both colleagues were half-right, but weights are the hero.  

  **Commitment:** Use the exact example above (100/100 → 20/180 split). Cut any mention of "Simpson’s Paradox" by name—call it "weighted average reversal." End with the check question to confirm they’ve moved beyond suspicion to prediction.
