prompt: |-
  Hi — I chair the "Beyond the Call" panel at a fairly big district general hospital, and I need something we can actually run. Every month we get 10-15 nominations from staff for colleagues who supposedly went above and beyond, we have 90 minutes, six people on the panel (two nurses, a doctor, an HR rep, a patient rep, and me — I'm in facilities), nobody has any philosophy training, and the nomination forms are two pages of narrative with almost never a clear statement of what the person's actual job description was or whether they were on duty. Decisions get read out at a staff event, they affect morale, the union watches them, and our comms lead has one hard rule: the citation has to praise the act without implying that everyone who didn't do it did something wrong. That last bit is the one we always screw up.

  What I want is a decision procedure, not an essay. Give me:

  1. The questions in the order we ask them, with what counts as a sufficient answer to each one.
  2. The gates where the answer is just "no award" and we stop.
  3. The gates where the procedure hands it to us as a values call that we have to make ourselves, flagged as such, because no amount of procedure settles it.
  4. What to do when we simply can't establish the facts (the form is vague, accounts disagree, the person's role is contested) — do we defer, default, or drop it.

  The distinctions it has to make, roughly: (a) the job done well, or a nice extra that's still just optional-but-ordinary; (b) genuinely beyond what was required of this person and praiseworthy; (c) actually required, i.e. the person was lucky not to be disciplined rather than heroic; (d) something admirable in spirit that we still shouldn't celebrate, because rewarding it signals the wrong thing — reckless self-risk, or papering over a staffing failure by turning it into a story about individual virtue.

  Hard cases it has to survive, because we've hit all of these:

  - The person's own mistake caused the emergency, and then they stayed fourteen hours fixing it. Is that heroism or just putting right what you broke?
  - What HR has started calling "quiet refusals": the act was an omission or a waiving — turning down a bonus so a junior could have it, giving up a promotion, taking their name off a paper they'd partly written. Costly, but is it the same shape as doing something?
  - The person profited afterwards: press coverage, a fundraiser, a promotion, a book deal. Does being rewarded retro-actively stop it from counting?
  - Mixed motives, off-duty acts, acts by people with no special role at all, and acts where the person was asked by a manager rather than volunteering.
  - The "they could have done it at trivial cost" end of things — you know the style of argument, that if you can prevent something terrible at almost no cost to yourself then it isn't optional at all. Some of our nominations look like that: huge benefit to someone else, tiny inconvenience to the agent. I want the procedure to tell us where that tips over from praiseworthy to required, and to be honest that it's drawing a line rather than finding one.
  - And the deep one: if the act really was optional, what are we praising, and if it really was the obviously best thing to do, why isn't skipping it blameworthy? I don't need this solved. I need the procedure to mark exactly where it stops being able to answer and just stipulates a convention so we can be consistent.

  Also: our HR director has started floating "second-order" nominations — not the person who did the thing, but the person who arranged things so other people could do it (a ward manager who quietly rewrote the rota so staff could sit with dying patients). I have no idea whether that belongs in the same category or breaks it. Deal with it or rule it out, but say which.

  Then run the whole thing on three real-ish nominations:

  - A night nurse who stayed six hours unpaid past the end of her shift to sit with a dying patient whose family were stuck on a motorway. The ward was two staff short and the manager had put out a general "stay if you can" message.
  - A senior pharmacist whose own dispensing error caused a patient's crisis, who then worked through the night to stabilise him and visited the family every day for a week.
  - A porter who donated a kidney to a colleague he'd known about three months. The story got picked up locally and raised a chunk of money for the hospital; the transplant team were visibly uneasy about the whole thing.

  We've more or less decided informally that the nurse is getting it, so if your procedure says no, say so plainly and tell us why. I also want a short closing section on what this procedure can't do — where it will misfire, what it can't rank or compare, and the cases where we should ignore it. Keep the language usable by people who've never thought about any of this; if you need a term of art, define it in a sentence.
reasoning: |-
  Okay, let me start by understanding what the user is asking for. They chair a panel at a hospital that recognizes staff who go "Beyond the Call." They need a practical decision procedure because their current process is messy, especially with the comms rule about not implying others did wrong. 

  First, I need to break down their requirements. They want a step-by-step process with clear questions, gates for rejection, and flags for value judgments. The distinctions they mentioned—like job done well vs. beyond required, or reckless acts—are crucial. Also, they provided hard cases and real examples to test the procedure.

  The user’s identity is key: they’re in facilities, not a philosopher, and the panel includes diverse roles. The procedure must be user-friendly. The unspoken need here is consistency and fairness to maintain morale and avoid union issues. They also need to handle ambiguous facts without causing disputes.

  Looking at the hard cases: errors causing emergencies, quiet refusals, profiting after the act, mixed motives. Each needs a clear checkpoint. For example, the pharmacist who caused the error—does fixing it count as beyond or just duty? The procedure must distinguish that.

  Second-order nominations: HR suggests rewarding those who enable others. Should this be included? I think it fits if it meets the same criteria, but the primary actor should be recognized first. Maybe add an "enabler" category later.

  Testing with examples: The night nurse staying unpaid. They usually approve this, so the procedure should too. The porter donating a kidney—medically risky, might signal poor systemic support. Need to flag that as a values call.

  The deep philosophical question about optional vs. blameworthy acts isn’t solvable, so the procedure should mark where convention takes over. For instance, defining "significant personal cost" is subjective; the panel decides based on context.

  For fact disputes, deferring is better than defaulting to avoid errors. HR can clarify roles if needed. 

  Finally, outlining limitations: the procedure can’t compare acts or handle systemic issues. It’s a tool, not a replacement for judgment. The closing section should emphasize that some cases need panel discretion despite the steps.
answer: |-
  Here’s a concrete, step-by-step decision procedure designed for your panel’s constraints. It uses 5 sequential questions, clear gates, flags value judgments, and handles ambiguity. It’s built around your comms rule: **Praise the act without implying others did wrong.**

  **Core Principle:** "Beyond the Call" means **voluntarily accepting significant personal cost/risk to provide exceptional, non-obligatory benefit to others (patients, staff, or the institution), where refusal would *not* warrant criticism.**

  ---

  ### The Decision Procedure: 5 Questions, 3 Gates

  **Before Starting:** Panel reads the nomination together. Chair summarizes key points.

  **Question 1: Was the act VOLUNTARY?**  
  *   **Sufficient "Yes":** Clear evidence of personal choice (e.g., "offered to stay," "declined promotion," "suggested donating").  
  *   **"No" Gate:** Stop. **No Award.**  
      *   *Reason:* If mandated by duty/manager (even if done well), it's expected. *Exception:* If exceeding *how* it was done is the core claim, flag for Q4 Value Judgment.  
      *   *Handles:* Acts requested by managers ("asked" isn't voluntary unless they could easily refuse without consequence). "Quiet refusals" are inherently voluntary.

  **Question 2: Was the act SAFE & RESPONSIBLE?**  
  *   **Sufficient "Yes":** Act didn't recklessly endanger the nominee, others, or patient care; complied with core ethics/protocols.  
  *   **"No" Gate:** Stop. **No Award (Flagged as Values Call).**  
      *   *Reason:* Rewarding recklessness (e.g., extreme self-risk, bypassing safety checks) signals the wrong values. *This is a Values Judgment Gate.* Panel must agree the act, while admirable in spirit, shouldn't be *rewarded*.

  **Question 3: Was the benefit EXCEPTIONAL & NON-OBLIGATORY?**  
  *(Break this down)*  
      *   **A) Was the benefit significant?** (e.g., prevented harm, provided major comfort, solved critical problem). *Minor/nice extras fail here.*  
      *   **B) Was providing this benefit *outside* the nominee's core duties/role *in this specific situation*?** (Crucial! Check HR basic role descriptors if unsure, but context matters).  
  *   **Sufficient "Yes":** Both A & B clearly met.  
  *   **"No" Gate:** Stop. **No Award.**  
      *   *Reason:* If benefit was minor or was part of their core job, it's "job done well," not "beyond." *Handles:* "Trivial cost, huge benefit" acts - if it *was* their job (e.g., a nurse calling a doctor for a crashing patient), it fails here. If truly *not* their job (e.g., porter calming a distressed relative when clinical staff are busy), proceed.

  **Question 4: Was there SIGNIFICANT PERSONAL COST/RISK?**  
  *   **Sufficient "Yes":** Nominee incurred tangible personal sacrifice beyond minor inconvenience (e.g., substantial unpaid time (>1hr), major opportunity cost, forgone income/sleep, emotional toll, *moderate* physical risk). *Cost must be real and proportional to the act.*  
  *   **"No" Gate:** Stop. **No Award.**  
      *   *Reason:* Acts with trivial/minimal cost are "nice extras," not exceptional virtue. Lack of cost suggests it *was* effectively obligatory. *This is where the line is drawn by convention.*  
      *   *Handles:* "Quiet refusals" (cost = lost opportunity). "Profiting afterwards" - *ignore subsequent rewards UNLESS it negates the original cost (e.g., book deal covered lost wages).* Motive is irrelevant unless it negates cost/voluntariness.

  **Question 5: Is there a SYSTEMIC FAILURE CONCERN?**  
  *   **Sufficient "No":** The act didn't primarily compensate for a major, avoidable system failure (e.g., chronic severe understaffing, broken process the nominee exploited).  
  *   **"Yes" Gate:** **No Award (Flagged as Values Call).**  
      *   *Reason:* Rewarding individuals for fixing systemic failures signals acceptance of the failure. *This is a Values Judgment Gate.* Panel must agree the act shouldn't be rewarded to avoid masking the root problem. *Exception:* If the nominee *also* actively flagged/reported the systemic issue, proceed cautiously.

  **Result of Passing All Gates:** **Award Recommended.**

  ---

  ### Handling Ambiguity / Unclear Facts
  1.  **Role/Duty Unclear:** Ask HR rep to clarify the *minimum* expected duties for that role *during the event timeframe*. If still unclear, **Flag for Value Judgment:** "Given the ambiguity, is it reasonable to conclude this was *likely* beyond core duties?"
  2.  **Vague/Conflicting Accounts:** **Defer.** Ask nominator/manager for clarification within 48 hours. If unresolved, **No Award.** (Better to miss one than reward based on shaky facts).
  3.  **Contested Role:** Treat as "Role/Duty Unclear."

  ---

  ### Second-Order Nominations (The Enabler)
  *   **Include them.** Apply the *exact same 5-question procedure.*
  *   **Focus:** Their *own* voluntary action (rewriting rota), the significant cost/risk *to them* (e.g., taking on extra work, facing staffing pushback), the exceptional/non-obligatory nature *of their enabling act*, and the benefit *their enabling* provided.
  *   **Why it fits:** They incurred personal cost/risk to create conditions for exceptional benefit, which wasn't strictly *their* core duty either.

  ---

  ### Testing the Procedure: Real-ish Cases

  1.  **Night Nurse (Stayed 6hrs unpaid with dying patient, short-staffed):**
      *   Q1: Voluntary? Yes ("stay if you can" implies choice).
      *   Q2: Safe? Yes (assuming patient was stable, staying didn't endanger others).
      *   Q3: Exceptional & Non-Obligatory?
          *   A) Benefit: Significant (major comfort to dying patient).
          *   B) Non-Obligatory? **Value Judgment Flag.** Core nursing duty is clinical care/safety. Providing *continuous* emotional support when family absent *might* be seen as beyond core *if* the ward was safe. Likely **Yes** (passes).
      *   Q4: Significant Cost? Yes (6hrs unpaid time is significant).
      *   Q5: Systemic Failure? **Value Judgment Flag.** Short-staffing is systemic. Did she *just* paper over it, or was this exceptional even considering staffing? Likely **No** (passes - the *duration* and *personal cost* make it exceptional compensation, not just filling a gap).
      *   **Result: Award Recommended.** (Matches your informal decision).

  2.  **Senior Pharmacist (Fixed own error, worked overnight, visited family):**
      *   Q1: Voluntary? **Value Judgment Flag.** Fixing your *own* serious error is arguably an absolute duty. Staying overnight/visiting family *might* be voluntary beyond immediate mitigation. **Likely No Gate at Q1 for the core act (fixing error).** *But:* Visiting family daily? Likely voluntary & beyond duty. Could split nomination.
      *   Q2: Safe? Assuming yes.
      *   Q3: Exceptional/Non-Obligatory? Fixing error: Obligatory. Visiting family: Potentially exceptional/non-obligatory.
      *   Q4: Cost? Fixing error: Cost of fixing your own mess isn't generally "praiseworthy cost". Visiting family: Costly (time, emotional).
      *   Q5: Systemic? Error may indicate training/process issues.
      *   **Result:** Core act (fixing error) likely **fails Q1 (Voluntary) or Q3 (Non-Obligatory)**. Visiting family *might* pass Q1-Q4 but raises Q5 (Systemic - why did error happen?). **Overall: No Award.** Heroism is mitigating *others'* disasters or going far beyond fixing *your own*.

  3.  **Porter (Donated Kidney to Colleague):**
      *   Q1: Voluntary? Yes.
      *   Q2: Safe & Responsible? **GATE: No Award (Values Judgment).** Donating a kidney involves major, non-trivial long-term health risks. While admirable, the *hospital* rewarding significant *medical* self-sacrifice sends a potentially dangerous signal about expected staff sacrifice. The transplant team's unease reinforces this. (Profiting afterwards is irrelevant if the health risk remains).
      *   **Result: No Award (Based on Q2 Gate).**

  ---

  ### What This Procedure CAN'T Do (Closing Limitations)

  1.  **Ranking Acts:** It only says "Award" or "No Award." It cannot rank winners or compare levels of "beyondness." All awards are equal.
  2.  **Perfect Consistency:** Value Judgments (Q2, Q5, Ambiguity) require panel discussion. Different panels *might* decide differently on close calls, but the gates ensure basic consistency.
  3.  **Solving the "Why Praise?" Puzzle:** It stipulates a convention: **Significant voluntary cost for exceptional, non-obligatory benefit is praiseworthy.** It doesn't philosophically resolve why skipping such acts isn't blameworthy; it just draws that line at Q4 (Cost).
  4.  **Systemic Analysis:** While Q5 flags rewards masking failures, the award itself doesn't *fix* the failure. That requires separate reporting/channels.
  5.  **Judging Ordinary Excellence:** Truly excellent performance *within* duty (e.g., a surgeon performing a complex case flawlessly) won't pass Q3. This is for *exceptional, voluntary* acts.
  6.  **Motivation Purity:** Mixed motives are irrelevant unless they negate voluntariness (Q1) or cost (Q4 - e.g., if reward *offset* cost).
  7.  **Ignoring It:** **Ignore the procedure ONLY if:**
      *   There's **new, verified, critical information** contradicting the nomination *after* the procedure is run.
      *   Applying it leads to a result that feels **grossly unjust or dangerous** to the panel *despite* passing the Value Judgment gates. (This should be rare and documented).

  **Key to Usability:** Focus on the 5 concrete questions in order. Use the Gates as clear stop signs. Discuss openly when a "Values Judgment Flag" is raised. The procedure structures the debate and ensures core principles are checked, but the panel's collective judgment on the flagged points is essential.
