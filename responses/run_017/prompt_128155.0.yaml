prompt: |-
  Hi — I work in responsible sourcing for a mid-sized food company, and the same shape of decision keeps landing on my desk, so I want something repeatable rather than me reinventing the argument each time.

  The shape is this. We're being pushed to swap conventional proteins (fishmeal, soy) for farmed insects — black soldier fly larvae, crickets, mealworms — and separately we're being asked to make public claims about animal welfare. Every version of this runs into the same two facts pulling in opposite directions. First, the numbers of individual animals involved are completely absurd compared to anything else we deal with: someone on my team did a back-of-envelope suggesting a single tonne of larvae protein is on the order of a million-plus individuals, and our annual volumes would put us in the billions. Second, it's genuinely unclear whether any of them feel anything at all — "sentience" is the word people in the space use — and the honest probability could be anywhere from near-zero to fairly substantial. When I try to think it through myself I end up just multiplying, and then literally everything comes out as a five-alarm emergency, which can't be right and also isn't usable: if every warehouse fumigation is a moral catastrophe then nothing is.

  So: write me a decision procedure my team can actually run. Concretely, I need:

  - The questions in order, and for each one what would count as a good enough answer to move on. We are procurement people, not biologists — flag which steps genuinely need an entomologist and which we can do ourselves with a day per decision and normal internet access.
  - Where the procedure just stops and says no, and where it hands the question to a human because it's a values call rather than a factual one. I need that distinction sharp, because I have to explain to our sustainability committee why something is their call and not mine.
  - How to handle the fact that the key probability is itself something I don't trust. Experts disagree wildly, and I don't want to plug in a made-up number and let the arithmetic launder it. Tell me what to write down instead of a number when there isn't one.
  - How to handle the sign problem: even if they do feel things, I can't tell whether a larval life in a bin of food waste is a good life or a bad one, and which way that goes reverses what the huge numbers are telling me to do. The procedure needs to not quietly assume one of those.
  - How to score the indirect evidence when it points different ways. People cite reflex responses to being damaged, versus learning to avoid a place where they got hurt, versus the fact that they'll keep tending an injured body part, versus trade-off behaviour where they accept one bad thing to get another. I need a rule for what I'm allowed to count as evidence here and what's just a good story, and what to do when the proxies disagree.
  - Whether there is any point at which we stop counting. I need a defensible place to say "this is below the line, site manager decides, no escalation", because otherwise the procedure will eat the whole company. But I also don't want the line to be a way of making the numbers disappear by fiat — tell me how I'd know if I'd drawn it in a self-serving place.
  - How much the counterfactual matters. A lot of this stuff is raised on waste we'd otherwise send to landfill, so some unknown number of these individuals would have existed anyway, and I genuinely can't tell whether that's a defence, an irrelevant detail, or an extra problem.
  - And an edge case: tell me what the unit of counting even is when the animal is a colony. If a supplier ever turns up with ant or termite protein, I don't think I can say how many individuals there are in any sense that means something.

  Then run it on three real-ish cases. (1) Switching a farmed-salmon supply chain from fishmeal to black soldier fly larvae raised on food waste — this one goes to the board and marketing wants a claim on pack. (2) Routine pest control in a grain warehouse, stored-product moths and cockroaches, decided by a site manager in about twenty minutes, weekly, forever. (3) A startup pitching "no-kill" insect protein: they let the animals complete their whole life cycle and collect them after natural death, it costs roughly three times as much, and they want us to sell it as the welfare-friendly option in a premium bar. I have a feeling at least one of these is going to come out in a way that costs us money or makes us look bad — please tell me straight rather than softening it.

  One more thing: whatever we produce has to be defensible in public. NGOs will read our policy and a journalist could ask about it, so "we ran the numbers" won't do if the numbers were invented. Please also say plainly what this procedure can't do.

  Don't bother with a reading list or a pile of citations, we won't follow them up and I can't check them anyway. But do tell me how confident you are in what you're claiming, and single out the one point you're least sure of — ideally the one where you think a reasonable person who knows this literature would probably disagree with you.
reasoning: |-
  Okay, the user works in responsible sourcing for a mid-sized food company and keeps facing decisions about switching to insect-based proteins and making animal welfare claims. They need a repeatable decision procedure to handle these consistently. Let me unpack their query.

  First, the core conflict: huge numbers of insects involved (billions annually) vs. uncertainty about their sentience. They mention that multiplying probability of sentience by the numbers leads to extreme outcomes, which isn't practical. They need a structured process that doesn't rely on made-up probabilities and handles ambiguity.

  Their requirements are quite specific: a step-by-step procedure with clear questions, demarcation between factual and value judgments, handling uncertain evidence, addressing the sign problem (whether insect lives are positive or negative), scoring conflicting evidence, setting thresholds for when to stop counting, considering counterfactuals (like insects raised on waste), and dealing with edge cases like colonial insects.

  They provided three real-world scenarios to test the procedure: switching salmon feed to black soldier fly larvae, routine pest control, and a premium "no-kill" insect protein product. Each has different stakes—board-level decisions vs. operational choices.

  The user's deeper needs include defensibility in public (NGOs, journalists), avoiding "ethics laundering" with fake numbers, and preventing the procedure from overwhelming the company with endless assessments. They also need to communicate clearly to the sustainability committee where value judgments are required.

  I need to create a procedure that's actionable for procurement staff, not biologists. Steps should be clear about when to consult experts. Key challenges are handling the sentience probability without arbitrary numbers, addressing the sign problem explicitly, and setting a defensible threshold for "no escalation."

  For the probability issue, using qualitative confidence levels (high/medium/low) and impact ranges instead of precise numbers makes sense. The sign problem requires separate assessments of welfare inputs and whether life is net positive/negative. Conflicting evidence needs predefined criteria for reliability and consistency.

  Thresholds should be based on severity of harm and confidence level, with clear escalation triggers. Counterfactuals need a logic tree to determine moral relevance. Colonial insects should be treated as a single "superorganism" for counting purposes.

  Testing the scenarios: the salmon feed switch requires board approval due to high stakes and uncertainty. Pest control stays with site managers using a simplified protocol. The "no-kill" product involves a value judgment on whether the premium is worth a potential welfare improvement that's uncertain.

  The biggest uncertainty is likely the sentience assessment methodology—experts might disagree on what evidence counts. The procedure must be transparent about its limitations, especially the subjective elements in welfare assessment and value trade-offs.

  Overall, the goal is to provide a pragmatic, defensible framework that separates facts from values, handles uncertainty honestly, and prevents paralysis while ensuring serious issues get proper attention.
answer: |-
  Here's a decision procedure designed for your team, built for repeatability, defensibility, and clarity on the fact/value split. It avoids invented numbers, handles uncertainty explicitly, and forces key value calls upstream.

  **The Insect Welfare Assessment Procedure (IWAP)**

  **Core Principle:** Separate *Fact Finding* (What do we know/not know?) from *Value Judgment* (What do we *do* with that knowledge, given our values and context?). Escalate value judgments.

  **Required Resources:**
  *   **Team:** Procurement/Sourcing Analyst (1 day/decision max for non-expert steps).
  *   **Expertise:** Flagged where needed (Entomologist/Ethologist consultation required - budget ~0.5-1 day per complex case).
  *   **Inputs:** Supplier documentation, published research summaries (e.g., EFSA opinions, FAIRR reports, academic review abstracts), basic internet search (reputable sources only).

  **Procedure Steps:**

  1.  **Define the Intervention & Scale:**
      *   *Question:* What specific practice/switch is proposed? What is the *annual volume* of insect biomass involved? What is the *species/stage* (e.g., *Hermetia illucens* larvae, *Tenebrio molitor* adults)?
      *   *Action:* Calculate **Approximate Individual Count (AIC)**. Use supplier data (individuals/kg) or standard estimates (e.g., 4,000-10,000 BSFL/kg; 1,000-5,000 mealworms/kg; 20,000-100,000 crickets/kg). **Output:** AIC = [Number] individuals/year. **Escalate if:** AIC > [Threshold - e.g., 100 Million/year] OR involves unusual species/colony (Go to Step 1a).
      *   *Threshold Note:* 100M is arbitrary but forces review of large-scale ops. Defend by saying it flags interventions impacting populations comparable to vertebrate livestock scales we *do* manage closely. Self-serving test: Would this threshold also catch a major *vertebrate* sourcing change needing review? If yes, it's likely defensible.
      *   *1a. Colony Edge Case:* If colony insects (ants, termites):
          *   *Question:* What is the functional unit? (e.g., entire colony, harvested workers only?)
          *   *Action:* **Define Counting Unit:** Treat the *entire colony* as the primary "individual" for harm assessment if destruction kills the reproductive core/dooms colony. Count harvested *non-reproductive individuals* (workers, soldiers) separately *only if* evidence suggests *they* might experience welfare impacts independently. **Output:** Counting Unit = [Colony] + [Number of Harvested Individuals]/year. **Requires Ento:** Yes - to define functional unit based on species biology.

  2.  **Assess Sentience Likelihood (Factual - High Uncertainty):**
      *   *Question:* What is the current scientific consensus *confidence level* regarding capacity for valenced experience (suffering/pleasure) for this species/stage? Focus on *key proxies:* Nociception (reflex response to damage) vs. *Demonstrated* Aversive Learning (learn to avoid stimuli associated with harm) vs. Trade-off Behaviors (accept harm for reward) vs. Protective Behaviors (tending injuries).
      *   *Action:* **Do NOT assign a probability number.**
          *   Gather evidence summaries (FAIRR, EFSA, academic reviews).
          *   **Categorize Confidence:** Use a 3-level scale:
              *   **High Confidence:** Strong, consistent evidence for multiple key proxies (e.g., aversive learning + trade-offs) in *this specific species/stage*. (e.g., Adult crickets/roaches).
              *   **Medium Confidence:** Evidence exists but is mixed, limited to one proxy (e.g., nociception only), or from closely related species. Extrapolation needed. (e.g., BSFL larvae, mealworm larvae).
              *   **Low Confidence:** Little to no direct evidence for key proxies beyond basic nociception; biology suggests minimal neural integration. (e.g., Early instar larvae, some pupae).
          *   **Note Key Evidence & Conflicts:** Explicitly list which proxies are present/absent and any major disagreements in sources. E.g., "Evidence: Nociception present (Study X); Aversive learning inconclusive - Study Y yes, Study Z no; Trade-off behavior not studied."
      *   *Output:* Confidence Level (High/Med/Low) + Key Evidence Summary. **Requires Ento:** **Yes** - For initial categorization & interpreting conflicting evidence for *any* species beyond common ones (BSFL, crickets, mealworms). Procurement can *compile* summaries, but expert needed to *interpret* strength/consistency for categorization.
      *   *Stop Condition:* If **Low Confidence** *AND* AIC < [Lower Threshold - e.g., 10 Million/year] *AND* the intervention involves only indirect/minimal harm (e.g., harvesting frass, natural death collection), **Stop - No Major Welfare Concern Flagged.** Site Manager discretion sufficient. Proceed otherwise.

  3.  **Assess Welfare Impact *IF* Sentient (Factual - High Uncertainty):**
      *   *Question:* *Assuming* sentience, what are the likely welfare *inputs* (harms/benefits)? What is the net welfare *sign* (likely positive, negative, or ambiguous life experience)? Focus on standard practices.
      *   *Action:*
          *   **List Welfare Inputs:** Crowding, substrate quality, pathogens, feed deprivation (common pre-harvest), killing method (e.g., freezing, grinding), environmental controls, handling stress. Use supplier practices + industry norms.
          *   **Categorize Severity Per Input:** Use qualitative scale (e.g., Severe/Moderate/Minimal/Neutral/Beneficial). *Justify with evidence* (e.g., "Freezing: Evidence suggests potential distress (Study A); categorized Moderate Harm").
          *   **Assess Net Sign:** Based on inputs, is the *average experience* likely:
              *   **Net Negative:** Harms outweigh benefits (e.g., intensive farming, stressful killing).
              *   **Net Positive:** Benefits outweigh harms (e.g., protected environment, abundant food, no predators - *highly speculative for insects*).
              *   **Ambiguous:** Mix of significant harms and benefits, or insufficient knowledge. (*Most likely outcome for farmed insects*).
      *   *Output:* Welfare Input Assessment Table + Net Sign Assessment (Neg/Amb/Pos). **Requires Ento:** **Yes** - To assess severity of inputs & plausibility of net sign. Procurement can list inputs based on practice, but expert needed for severity/sign assessment.

  4.  **Determine Counterfactual (Factual - Variable Certainty):**
      *   *Question:* Would these individuals likely have existed, and what would their welfare have been, *without* this intervention?
      *   *Action:*
          *   **Define Counterfactual:** E.g., Larvae on food waste: Would the waste have gone to landfill (creating similar larvae?), been composted (killing any larvae?), fed to vertebrates? Pest control: Would pests exist anyway? Would control occur regardless (different method?)?
          *   **Assess Counterfactual Welfare:** If individuals would exist, what is their likely net welfare? (e.g., Landfill larvae: likely Net Negative? Wild pests: Ambiguous?).
          *   **Categorize Moral Relevance:**
              *   **Additive:** Intervention *causes* creation & harm of individuals who wouldn't otherwise exist. (e.g., Farming insects on grain).
              *   **Substitutive:** Intervention *replaces* an alternative practice causing harm to a comparable number. (e.g., Replacing fishmeal production which harms wild fish).
              *   **Neutral:** Individuals would exist/have similar welfare regardless. (e.g., Using waste stream larvae that would exist in landfill anyway; Pest control unavoidable).
      *   *Output:* Counterfactual Type (Additive/Substitutive/Neutral) + Brief Rationale. **Requires Ento:** Sometimes - For complex ecology (e.g., waste stream larvae creation likelihood). Procurement can often handle based on process knowledge.

  5.  **Compile & Summarize for Human Judgment (Fact Summary):**
      *   *Action:* Create a concise summary:
          *   Species/Stage: [ ]
          *   AIC (or Counting Unit): [ ] per year
          *   Sentience Confidence: [High/Med/Low] + Key Evidence Conflict: [Y/N]
          *   *If not Low/Stopped:* Welfare Input Summary & Net Sign: [Neg/Amb/Pos]
          *   Counterfactual Type: [Additive/Substitutive/Neutral]
      *   *Output:* IWAP Fact Summary Sheet.

  6.  **Value Judgment & Decision Gate (Human Escalation - Sustainability Committee/Board):**
      *   *Questions for Committee:*
          1.  **Sentience Threshold:** Given the Confidence Level (High/Med/Low), evidence conflicts, and the vast AIC, what level of confidence is *required* for us to consider welfare impacts *morally relevant*? (e.g., "Only High Confidence", "Medium or Higher", "Any Level including Low").
          2.  **Net Sign & Precaution:** If Sentience is deemed relevant (per Threshold above) *AND* Net Sign is Negative or Ambiguous, does the Precautionary Principle apply? Should we avoid the practice *unless* welfare can be demonstrably improved? If Net Sign is Positive, is the practice acceptable?
          3.  **Counterfactual Weighting:** How do we weigh the Counterfactual Type? (e.g., Is Additive harm worse than Substitutive harm? Is Neutral a free pass?).
          4.  **Scale Tolerance:** Even if per-individual impact is small, does the astronomical AIC itself create an unacceptable *cumulative* risk, warranting avoidance or higher welfare standards, regardless of precise confidence?
          5.  **Claims & Premiums:** For marketing claims (e.g., "welfare-friendly", "no-kill") - What level of evidence and welfare standard is required to make this claim defensibly? Is the cost premium justified based on our values?
      *   *Output:* Committee provides clear directives:
          *   **Approve:** Proceed as planned.
          *   **Approve with Conditions:** Require specific welfare improvements, auditing, or prohibit claims.
          *   **Reject:** Due to unacceptable risk/uncertainty/value misalignment.
          *   **Require Further Research:** Fund specific studies to reduce uncertainty.
          *   **Set Policy:** Establish default rules for future similar cases (e.g., "No claims for insects below Medium Sentience Confidence").

  **Procedure Outputs:**
  *   For Low Confidence, Low AIC, Minimal Harm: **"No Escalation - Proceed per standard operations."**
  *   For other cases: **"IWAP Fact Summary Sheet" + "Committee Decision Record"**.

  **What This Procedure CANNOT Do:**
  1.  **Provide Certainty:** It won't resolve the fundamental scientific uncertainty about insect sentience or net welfare.
  2.  **Make Values Decisions:** It forces the value calls into the open for the Committee but doesn't dictate what those values *should* be.
  3.  **Prevent Criticism:** NGOs may disagree with your Sentience Threshold or Counterfactual weighting. This makes your reasoning *transparent and defensible*, not immune to attack.
  4.  **Handle Infinite Regress:** It deliberately sets thresholds (AIC, Confidence) to prevent paralysis. These thresholds are pragmatic and must be justified contextually.
  5.  **Replace Supplier Audits:** It assesses *likelihoods* based on practices, but doesn't verify on-the-ground reality. Audits are separate.

  **Confidence & Least Sure Point:**
  *   **Overall Confidence:** Medium-High in the *structure* for separating facts/values and handling uncertainty practically. This is a *process* solution to an *epistemological* problem.
  *   **Least Sure Point (Highest Disagreement Risk):** **Step 3 - Net Welfare Sign Assessment.** Reasonable experts could vehemently disagree on whether *any* captive insect life could be "net positive" or how to weigh inputs like crowding vs. lack of predation. The categorization feels especially speculative. The procedure highlights this ambiguity rather than hiding it.

  ---

  **Running the Cases:**

  **Case 1: Switching Salmon Feed to BSFL (Food Waste)**
  1.  **AIC:** ~1 Billion+ BSFL larvae/year. **Above Threshold - Escalate.**
  2.  **Sentience Confidence:** **Medium.** Evidence: Nociception yes, Aversive Learning mixed/limited (some studies show simple learning), Trade-offs observed in some contexts, Neural complexity lower than adults. Key Conflict: Yes (Learning evidence debated). **Requires Ento - Yes.**
  3.  **Welfare Net Sign (If Sentient):** **Ambiguous/Negative.** Inputs: Crowding (Mod Harm?), Food waste substrate (Neutral/Beneficial?), Standard killing - freezing/grinding (Mod Harm?), Lack of predators (Benefit?). Net Sign highly uncertain, likely leans Negative due to killing/handling stress. **Requires Ento - Yes.**
  4.  **Counterfactual:** **Substitutive/Neutral?** Replaces fishmeal (harms wild fish - Substitutive). BSFL raised on waste that might otherwise go to landfill (where similar larvae *might* exist ephemerally - Neutral aspect). Complex. **Requires Ento - Maybe (for waste stream part).**
  5.  **Fact Summary:** High AIC (1B+), Med Sentience Conf (conflicts), Amb/Neg Net Sign, Complex Counterfactual (Substitutive/Neutral mix).
  6.  **Judgment Escalation:** **CRITICAL - Board/Senior Committee.**
      *   *Key Questions:* Is Medium Confidence enough to worry given the scale? Does the Substitutive aspect (helping wild fish) outweigh the potential insect harm? Can we accept Ambiguous/Negative net sign at this scale? Is a public claim ("sustainable" maybe, but "welfare"? No!) defensible?
      *   *Likely Outcome:* Approval likely due to sustainability drivers, BUT **NO animal welfare claim permitted.** Strong recommendation to invest in/know supplier welfare practices (e.g., humane killing methods if they exist). High risk of NGO criticism due to scale/sentience uncertainty. "We ran the numbers" *is* defensible here because the uncertainty is explicit.

  **Case 2: Routine Pest Control (Moths/Cockroaches)**
  1.  **AIC:** Per treatment? Low (100s-1000s?). Annual per site? Maybe 10,000s-100,000s? **Likely Below 100M Threshold.**
  2.  **Sentience Confidence:** **Cockroaches: Medium-High (Good evidence for learning/avoidance). Moths: Low-Medium (less studied).** Key Conflict: Less for roaches, more for moths.
  3.  **Welfare Net Sign (If Sentient):** **Severely Negative.** Killing methods (traps, insecticides, fumigation) cause significant distress/suffering if sentient.
  4.  **Counterfactual:** **Neutral/Substitutive.** Pests exist due to grain; control is necessary (Neutral - they would be there & need control anyway). Fumigation might replace less effective (but potentially more prolonged suffering) methods? (Weak Substitutive).
  5.  **Fact Summary:** Lower AIC (Below escalation threshold?), Med-High (Roach)/Low-Med (Moth) Sentience Conf, Severely Negative Net Sign, Neutral Counterfactual.
  6.  **Judgment:** **Stop at Step 2.** AIC likely below the 100M annual threshold set for escalation *and* intervention is necessary for food safety/quality. **"No Escalation."** Site Manager uses standard IPM protocols focusing on *prevention* to minimize need for lethal control. **No welfare claims possible or needed.** Defensible as necessary for primary operations.

  **Case 3: Premium "No-Kill" Insect Protein (e.g., Crickets)**
  1.  **AIC:** Lower volume (premium product), but still millions/year. **Above Lower Threshold, likely Below 100M - Proceed to Sentience.**
  2.  **Sentience Confidence:** **High (Adult Crickets).** Strong evidence for aversive learning, complex behaviors.
  3.  **Welfare Net Sign (If Sentient):** **Ambiguous/Leaning Positive?** Inputs: Presumably better housing/food (Benefit?), No killing method (Major Benefit - avoids worst harm), Death from old age/senescence (Neutral/Min Harm?). Net Sign potentially better than standard farming, but is a full life in captivity "good"? **Ambiguous, likely better than standard.**
  4.  **Counterfactual:** **Additive.** These crickets are specifically farmed; they wouldn't exist otherwise.
  5.  **Fact Summary:** Medium AIC, High Sentience Conf, Ambiguous (but likely improved) Net Sign, Additive Counterfactual.
  6.  **Judgment Escalation:** **Sustainability Committee.**
      *   *Key Questions:* Does avoiding killing and providing better conditions create a significantly "better" life such that the net sign is acceptable, even if Ambiguous? Is the Additive nature problematic? Is the 3x cost premium justified for this *potential* welfare improvement? Can we defensibly claim "Higher Welfare" or "No-Kill"? ("No-Kill" is factual; "Higher Welfare" implies a value judgment on net life quality).
      *   *Likely Outcome:* **Value Judgment Required.** The science doesn't definitively say the net life is "good" or that avoiding killing makes the *whole life* positive. Claiming "Higher Welfare" is risky unless very carefully qualified (e.g., "No-Kill Process"). The committee must decide if the *potential* improvement aligns with their values enough to justify the cost and make a *limited* claim. High chance of rejection or very cautious approval with strict claims language. "We ran the numbers" shows due diligence, but the claim remains a value-based marketing risk.

  **Final Advice:** Frame this to your committee as a *risk management and values alignment* tool. Its power is in forcing explicit acknowledgment of scale, uncertainty, and the separation of facts from the company's ethical stance. It won't eliminate tough choices, but it will make them structured, transparent, and defensible. The biggest win is stopping the endless, paralyzing re-invention of the ethical wheel for each decision.
