  Hmm, the user needs a tight teaching plan with specific components: (1) structural sequence of the debate's key aspects, (2) a robust example that defeats generalist escape routes, (3) misconception management, (4) a diagnostic closing question, and (5) explicit scope boundaries. 

  Right, for the spine: starting with metaphysical holism makes sense because students will conflate it with epistemology and pedagogy. The valence-flipping case must be airtight - the funeral joke example is vulnerable to "funny-at-no-expense" redescription. Need something like a factual promise-keeping scenario where the valence flip stems purely from relational context, not added properties. 

  Ah, the misconceptions are predictable: relativism conflation, context-sensitivity oversimplification, disagreement anxiety, and the silencing/defeating confusion. Should preempt these at defined points - e.g., tackle relativism immediately after defining holism. 

  For the closing question, something about whether principles are necessary for moral learning would test their grasp beyond terminology. And yes, firmly excluding supervenience and reasons metaphysics is wise - those are rabbit holes for this level. 

  Better emphasize British English throughout. The tone should be academic but accessible, with clear signposting like "this seminar won't cover..." for boundaries. The user's clearly experienced with the material but needs help structuring it for novices - their awareness of student biases ("context matters is already deep") shows good pedagogical insight.
answer: |-
  Here’s a tight 45-minute plan in British English, designed for law students primed to over-simplify "context matters":

  **Spine Structure (25 mins)**  
  *(Yes, your tripartite distinction is essential – they’ll conflate these)*  
  1. **Metaphysical Holism (10 mins)**  
     - *Focus:* Can a consideration (e.g., "causing offence") be a reason *for* an act in one case and *against* in another, **without changing its descriptive character**?  
     - *Why first?* It’s the core ontological claim. Separates "context alters *whether* a feature counts" from "context alters *what the feature is*".  
     - *Depends on:* Nothing – it’s the foundational thesis.  

  2. **Epistemological Claim (7 mins)**  
     - *Focus:* Must we *use* a general principle ("Always avoid causing offence") to correctly judge a new case? Or can we judge case-by-case?  
     - *Why next?* Students confuse "context matters in application" (generalism accepts this) with "principles aren’t needed *to discern* right/wrong" (particularism).  
     - *Depends on:* Metaphysical holism – if reasons *aren’t* holistic, principles *are* likely needed epistemically.  

  3. **Explanation/Teaching Claim (8 mins)**  
     - *Focus:* Are general principles necessary/useful for *explaining* why an act is wrong or *teaching* morality?  
     - *Why last?* Particularists can concede principles have heuristic/pedagogical value while denying they are metaphysically/epistemically fundamental.  
     - *Depends on:* The first two – it’s a separate, pragmatic issue.  

  **Core Example: The "Keeping a Promise" Trap (8 mins)**  
  - **Case A:** You promise your spouse you’ll be home by 7pm for a quiet dinner. *Reason FOR keeping it:* It’s a promise (fosters trust/intimacy).  
  - **Case B:** You promise a paranoid colleague you’ll report "suspicious behaviour" (e.g., union organising) to management. *Reason AGAINST keeping it:* It’s a promise (would enable injustice/damage solidarity).  
  - *Why it works:*  
    - **Same thin description:** "Making/keeping a promise". No added facts (like "causes pain"). Valence flips purely due to relational context (spouse vs. colleague) and consequences (intimacy vs. injustice).  
    - **Resists escapes:**  
      - *Deny flip?* Intuition strongly suggests opposing moral forces.  
      *Redescribe?* Hard to add non-question-begging specifics without smuggling in the moral conclusion ("promise to do something *immoral*" assumes the valence).  
      *Exception clause?* "Keep promises unless doing so causes harm/injustice" makes the "promise" feature *itself* inert – the real reason becomes "prevents harm/injustice". The *promise itself* doesn’t contribute positively in Case B.  
  - *What it lacks:* Any inherent positive/negative valence independent of context.  

  **Misconceptions & Deflections (8 mins – Tackle AS they arise, but pre-empt here):**  
  1. **"Particularism = Relativism/Anything Goes"**  
     - *When:* After defining holism.  
     - *Head off:* "Particularism claims reasons are *context-sensitive*, not that there *are no reasons* or that 'anything goes'. Wrong acts still have wrong-making features."  
  2. **"Holism = Mere Context-Sensitivity (so debate is fake)"**  
     - *When:* When introducing metaphysical holism.  
     - *Head off:* "Generalism *agrees* context affects how principles *apply*. Holism is stronger: the *same feature* can be a reason *for* in one context and *against* in another. Does 'it's a promise' *always* count in favour?" (Use Core Example).  
  3. **"No Principles = Nothing to Say in Disagreement"**  
     - *When:* During epistemology discussion.  
     - *Head off:* "We argue by citing *relevant features* of the case (e.g., 'But this promise aids oppression!'), comparing to paradigm cases, not by citing inviolable rules. Legal reasoning often works this way!"  
  4. **"Silencing vs. Defeating is just Exception Clauses"**  
     - *When:* If discussing Dancy (mention briefly only if raised).  
     - *Head off:* "A *defeated* reason still exists but is overridden (e.g., a promise outweighed by saving a life). A *silenced* feature provides *no reason at all* in this context (e.g., the promise in Case B provides *no positive reason* to inform). Exception clauses handle defeat, not silencing."  

  **Closing Diagnostic Question (2 mins):**  
  *"Could 'being against university policy' be a reason to do something in one situation, and a reason against doing it in another, without the policy itself changing? What would each side (generalism/particularism) say about this possibility?"*  
  - *Tests:* Grasp of valence-flip (metaphysical holism), not just vocabulary. Generalists must deny or redescribe; Particularists accept.  

  **Openly Refuse to Cover (State upfront - 2 mins):**  
  1. **Reasons-as-facts metaphysics:** "We won’t delve into whether reasons are facts, states of affairs, etc."  
  2. **Supervenience:** "We’re bracketing technical debates about supervenience."  
  3. **Full taxonomy of moral concepts:** "We’re focusing narrowly on holism/principles, not broader meta-ethics (e.g., moral realism)."  
  4. **Comprehensive Dancy exegesis:** "We’re examining the core debate, not one theorist’s full system."  

  **Why this works:** It disentangles their instinctive "context matters" into the precise metaphysical claim driving the debate, uses a legally-relevant example immune to easy generalist counters, pre-empts their predictable misunderstandings, and tests conceptual grasp over jargon. Keeps the spine visible: **Metaphysics → Epistemology → Pragmatics.**
