prompt: |-
  I've been lurking the rationalist blogs since the OB days and I definately still get turned around in the superrationality threads, so I wanted to check something. I found an old blog post — no idea who wrote it, one of those "top ten mind-bending ideas" lists — that explains the old superrationality idea (Hofstadter's, I think) like this:

  "Standard game theory says a rational player defects in a one-shot Prisoner's Dilemma, but that's only because it assumes your decision can't affect the other player's. Superrationality drops that assumption. If you and your opponent are both rational, and each of you knows the other is rational, then you'll realize you're running the same reasoning process, so whatever you decide, they'll decide as well — in effect, cooperating causes them to cooperate and defecting causes them to defect. Your only real options are therefore 'both cooperate' or 'both defect,' and the first is better for you, so a superrational player cooperates. This shows the usual game-theoretic prediction that rational agents defect is simply wrong: it's an artifact of pretending the two decisions are causally independent. The catch is that the argument only works when the two players are the same decision-maker in the relevant sense — it's a solution to the case where you're playing against a copy of yourself, not against a genuinely different person."

  I suspect the "causes them to cooperate" bit is sneaking in something it shouldn't, and the last line about copies sounds too strong, but I can't put my finger on either one. Can you go through it and tell me what someone who actually takes superrationality seriously would accept, what they'd wince at, and what's just wrong — and whether the "standard game theory is simply wrong" conclusion survives once you fix the wince-y parts?

  The thing I actually care about, though: once you've stripped the summary down to whatever's true, does the argument survive a "near-copy" version? Say me and the other player run the same decision procedure, so we land on the same plan, but there's an independent probability ε that either of us misfires at execution time and plays the opposite of what the procedure decided (we both know ε, it's the same for both of us, and it works the same way in both directions). I worked it out for the usual prisoner's dillema payoffs and I got that cooperating still beats defecting, but only when ε < 1/2, and that the temptation and sucker payoffs cancel out entirely, so only the reward and the mutual-defection payoff end up mattering. Is that right? And is execution-level noise even the right way to model "near-copies rather than perfect ones" — or does the interesting version put the noise inside the reasoning, like each of us having a small chance of not being fully superrational? If it's the latter, does the ε < 1/2 result survive, or does the whole thing unravel the way I've seen people say it does?
reasoning: |-
  Okay, the user has been following rationalist blogs since the Overcoming Bias days and is struggling with superrationality concepts. They found an old blog post explaining superrationality in the context of the Prisoner's Dilemma and have some suspicions about the explanation. Specifically, they question the "causes them to cooperate" phrasing and the emphasis on playing against a perfect copy. They also want to explore how this works with near-copies and execution noise.

  First, I need to dissect the original summary. The blog post argues that superrationality changes the Prisoner's Dilemma outcome by assuming that both players' decisions are interdependent. Standard game theory assumes causal independence, leading to mutual defection as the dominant strategy. But superrationality posits that identical rational players will realize they'll make the same decision, so cooperating leads to mutual cooperation, which is better. The user feels uneasy about the causal language and the strict copy requirement.

  Breaking down the accurate parts: Superrationality does rely on symmetry and shared reasoning. Both players know they are identical in reasoning, so they'll output the same action. The choice is between mutual cooperation or mutual defection, making cooperation rational. This works against a perfect copy. The wince-worthy parts are the "causes" language, which implies causation when it's really logical implication. Also, the "simply wrong" claim is too strong because standard game theory applies to different agents, not identical copies. The conclusion holds only under strict symmetry.

  Now, the user's main interest is near-copies with noise. They modeled execution-level noise (ε chance of misfire) and found cooperation is better only if ε < 1/2. I need to verify their calculation. With payoffs R (reward), T (temptation), S (sucker), P (punishment), mutual cooperation gives R with probability (1-ε)^2 + ε^2? Wait, no. If both intend to cooperate, the chance they both succeed is (1-ε)^2, both fail (defect) is ε^2, but mutual defection occurs only if both defect. When both intend to cooperate, the outcomes are:

  - Both cooperate: (1-ε)^2 → payoff R

  - I cooperate, other defects: ε(1-ε) → S for me

  - I defect, other cooperates: (1-ε)ε → T for me

  - Both defect: ε^2 → P

  The expected payoff when both intend to cooperate is R(1-ε)^2 + Sε(1-ε) + Tε(1-ε) + Pε^2. Similarly for mutual defection intent. The user mentioned that T and S cancel out, which happens because their coefficients are the same when calculating the difference between mutual cooperation and mutual defection strategies. So for intending to cooperate vs. defect, the expected payoff difference involves R, P, and terms with T and S that might cancel if symmetric. The user's result that ε < 1/2 is a threshold might come from when the benefit of mutual cooperation outweighs the risk of being exploited.

  But is execution noise the right model? The user asks if noise should be in reasoning instead. If the players aren't perfectly identical in reasoning, maybe they don't arrive at the same decision. That could lead to different probabilities. For example, if each has a chance of not being superrational, they might independently decide to defect. That might unravel cooperation because the symmetry breaks. The execution noise model preserves the intention symmetry, while reasoning noise might not. So the user's model is valid for execution errors, but reasoning noise could make cooperation harder to sustain.

  The user's calculation seems correct. The critical point is ε < 1/2 for the usual payoffs (T>R>P>S). If ε is too high, the risk of unilateral defection (getting S or T) dominates, making mutual defection safer. The threshold depends on specific payoffs. For reasoning noise, if each player might defect independently, cooperation might require stricter conditions, possibly unraveling the superrational outcome unless ε is very small. The user's insight that T and S cancel out in their model simplifies the comparison, focusing on R and P.

  In summary, the user correctly identified issues in the blog summary and modeled near-copies with execution noise accurately. Reasoning noise might be more destabilizing, but their approach is sound for the specified problem. Their deeper need is understanding the robustness of superrationality under imperfections and whether it applies in real-world scenarios with similar but not identical agents.
answer: |-
  Let's dissect this step by step, addressing your concerns about the blog summary, then tackling your near-copy model, and finally exploring reasoning noise. The "standard game theory is simply wrong" claim is an overreach, but superrationality *does* offer a valid solution under very specific conditions.

  **Deconstructing the Blog Summary:**
  1.  **Accurate Core:** The description of superrationality's core mechanism is mostly correct. It hinges on the assumption of *perfect symmetry* in reasoning:
      *   Both players are identical rational agents.
      *   Both know they are identical.
      *   Both know the other knows, etc. (common knowledge of symmetry and rationality).
      *   This implies they will run *identical* reasoning processes and reach the *identical* conclusion.
  2.  **The "Causes" Wince:** Your suspicion is spot-on. The phrase "cooperating causes them to cooperate" is deeply misleading and smuggles in magical thinking. **What superrationality actually says is:** "Because we are identical, we *will* choose the same action. Therefore, my *only* possible outcomes are (Cooperate, Cooperate) or (Defect, Defect). Given that choice, (Cooperate, Cooperate) yields a higher payoff *for me* than (Defect, Defect). Therefore, I Cooperate." It's a *logical implication* based on symmetry and rationality, not *causal influence* across players. A superrationalist would strongly wince at the "causes" language.
  3.  **The "Copy" Line:** This is **correct and crucial**. The argument *only* works against a perfect copy (or functionally identical decision-maker under the symmetry assumptions). Superrationality is a solution concept for games against *yourself* or a *perfect clone*. It explicitly rejects the standard game theory assumption of *causal independence* between the players' decision-making processes. Against a genuinely different, independent rational agent (even one identical in *type* but not *token*), the standard Nash reasoning applies, and mutual defection is the equilibrium. The "simply wrong" claim about standard game theory is hyperbolic; standard GT is correct for standard assumptions (causal independence), superrationality is correct for its specific, very strong assumptions (causal dependence via identity).
  4.  **What Survives (for Perfect Copies):** Stripped down, the core truth is: If two players *are* (and know they are) running the *exact same deterministic decision algorithm* with the *exact same inputs* (including knowledge of this symmetry), then they *must* output the same action. Faced with the Prisoner's Dilemma payoff matrix, that identical algorithm will output "Cooperate" because the only consistent choices are mutual cooperation or mutual defection, and mutual cooperation is better. The "standard GT is wrong" conclusion *only* survives in the incredibly narrow case of playing against a perfect copy/yourself. It does *not* invalidate standard GT for interactions between distinct agents.

  **Your Near-Copy Model (Execution Noise):**

  Your model is well-defined and insightful: Both players run the *same* deterministic decision procedure, so they *intend* the same action (C or D). However, with independent probability ε, each player "misfires" and plays the *opposite* action at execution time. Payoffs: R (Reward, CC), S (Sucker, CD), T (Temptation, DC), P (Punishment, DD), with T > R > P > S and 2R > T + S.

  **Your Calculation is Correct:**

  1.  **Intend Cooperate (IC):**
      *   Both Cooperate (Actual CC): `(1-ε) * (1-ε) = (1-ε)²` -> Payoff = R
      *   I Cooperate, Other Defects (Actual CD): `(1-ε) * ε` -> Payoff = S (for me)
      *   I Defect, Other Cooperates (Actual DC): `ε * (1-ε)` -> Payoff = T (for me)
      *   Both Defect (Actual DD): `ε * ε = ε²` -> Payoff = P
      *   **Expected Payoff (IC):** `R*(1-ε)² + S*ε(1-ε) + T*ε(1-ε) + P*ε²`

  2.  **Intend Defect (ID):**
      *   Both Cooperate (Actual CC): `ε * ε = ε²` -> Payoff = R
      *   I Cooperate, Other Defects (Actual CD): `ε * (1-ε)` -> Payoff = S (for me)
      *   I Defect, Other Cooperates (Actual DC): `(1-ε) * ε` -> Payoff = T (for me)
      *   Both Defect (Actual DD): `(1-ε)*(1-ε) = (1-ε)²` -> Payoff = P
      *   **Expected Payoff (ID):** `R*ε² + S*ε(1-ε) + T*ε(1-ε) + P*(1-ε)²`

  3.  **Compare IC vs. ID:**
      *   `E[IC] - E[ID] = [R*(1-ε)² + S*ε(1-ε) + T*ε(1-ε) + P*ε²] - [R*ε² + S*ε(1-ε) + T*ε(1-ε) + P*(1-ε)²]`
      *   Simplify: Notice `S*ε(1-ε)` and `T*ε(1-ε)` appear in both expressions and **cancel out**.
      *   This leaves: `E[IC] - E[ID] = R*(1-ε)² + P*ε² - R*ε² - P*(1-ε)²`
      *   Factor: `= R[(1-ε)² - ε²] + P[ε² - (1-ε)²]`
      *   Notice `[ε² - (1-ε)²] = -[(1-ε)² - ε²]`
      *   So: `E[IC] - E[ID] = [R - P] * [(1-ε)² - ε²]`
      *   Expand `(1-ε)² - ε² = (1 - 2ε + ε²) - ε² = 1 - 2ε`
      *   Therefore: `E[IC] - E[ID] = (R - P) * (1 - 2ε)`

  4.  **Interpretation:**
      *   `(R - P)` is **positive** because `R > P`.
      *   `(1 - 2ε)` is positive when `ε < 1/2`, zero when `ε = 1/2`, and negative when `ε > 1/2`.
      *   **Conclusion:** Intending to Cooperate yields a higher expected payoff than Intending to Defect **if and only if ε < 1/2**. If ε > 1/2, intending to defect is better. If ε = 1/2, they are equal.
      *   **T and S Cancel:** Your insight is correct. The "temptation" (T) and "sucker" (S) payoffs *do* cancel out in the comparison. The difference hinges *only* on the relationship between the mutual cooperation payoff (R), the mutual defection payoff (P), and the noise level (ε). This makes sense intuitively: noise symmetrically blurs the intended outcome, making the safer mutual defection more attractive when noise is high, and the superior mutual cooperation more attractive when noise is low.

  **Execution Noise vs. Reasoning Noise:**

  You asked a critical question: Is execution noise the right model for "near-copies," or should noise be inside the reasoning?

  1.  **Execution Noise (Your Model):** This models agents who *are* perfectly identical and superrational in their *reasoning* but have unreliable *output mechanisms*. They perfectly coordinate on the *intended* action, but execution fails sometimes. **Your result (ε < 1/2) is robust for this model.** Cooperation is stable as long as the execution is reliable enough.

  2.  **Reasoning Noise (Inside the Algorithm):** This models agents who are *not* perfectly identical superrationalists. The "noise" represents a failure of the superrational logic itself. Examples:
      *   **Independent Defection Probability:** Each player, even while knowing the symmetry, independently has a small probability δ of irrationally defecting "just in case" or due to a reasoning flaw.
      *   **Uncertainty about Identity:** Players are unsure if the other is truly identical. They assign a probability that the other is a "copy" (superrational) vs. a "stranger" (standard rational defector).
      *   **Reasoning Heterogeneity:** Players use slightly different decision procedures.

      **Does it unravel? Often, yes, and more severely than execution noise.** The core superrational logic relies on the *certainty* that the other will do exactly what you do. Introducing noise *into the reasoning* directly breaks the logical link that forces identical actions:
      *   If there's a chance δ the other player independently defects, then *even if you Cooperate*, there's a chance δ you get the Sucker payoff (S). The expected payoff calculation changes dramatically. The critical term `(1 - 2ε)` is replaced by terms involving δ, T, and S.
      *   `E[IC]` now includes a `δ * S` term (other defects even if you intend C) and `(1-δ) * R` (other cooperates if you intend C).
      *   `E[ID]` includes `δ * P` (other defects if you intend D) and `(1-δ) * T` (other cooperates if you intend D).
      *   The comparison `E[IC] - E[ID] = (1-δ)R + δS - [(1-δ)T + δP]` is **much harder to make positive**. Cooperation requires the other player to be a copy *and* cooperate. Defection protects against the Sucker payoff if the other is defective *and* exploits if they cooperate. Unless δ is extremely small (and often unrealistically small given T >> R and S << P), intending to defect becomes the safer and often dominant choice. The "magic" of the perfect symmetry is broken, and the standard Prisoner's Dilemma incentives (fear of S, temptation of T) reassert themselves forcefully.

  **Conclusion:**

  1.  **Blog Summary:** Fixing the wince-y parts ("causes" -> "logically implies identical action due to symmetry"; "simply wrong" -> "incorrect under the specific assumption of perfect symmetry/copying"), the core superrationality argument for perfect copies is valid. Standard game theory remains correct for distinct agents.
  2.  **Near-Copies (Execution Noise):** Your model and calculation are excellent. Cooperation (intending to cooperate) beats defection (intending to defect) **iff ε < 1/2**. T and S *do* cancel out; only R, P, and ε matter. This is a robust model for physical unreliability in identical systems.
  3.  **Near-Copies (Reasoning Noise):** This is where superrationality truly struggles. Introducing imperfections in the *reasoning* or *certainty of identity* breaks the logical necessity of identical actions. The standard PD incentives (T and S) dominate again, and cooperation typically unravels unless the "noise" (probability of reasoning failure or non-identity) is vanishingly small. Your ε < 1/2 result **does not survive** this shift; the threshold for cooperation becomes far stricter or often impossible to meet with reasonable payoffs.

  Superrationality is a fascinating thought experiment that highlights the profound impact of assumptions about agent identity and causal independence. It works beautifully against a perfect copy but is extremely fragile to any deviation from that ideal, especially when the deviation affects the reasoning symmetry itself. Your exploration with execution noise captures a more realistic physical limitation, while reasoning noise exposes the core fragility of the concept.
