  Hey — I'm in a formal verification course right now (we're using Lean, we've done inductively defined props, structural induction over derivations, and like one lecture on reflection / quoting syntax), and I'm reading Godel Escher Bach on the side for fun, which means I keep trying to translate what he's doing into vocabulary I actually use. So: take the MU puzzle and the whole business of "jumping out of the system." As far as I can tell, the reason MI can never produce MU is just a meta-level invariant proof — no theorem has a number of I's divisible by 3, proved by induction over the derivation tree, exactly like proving a property of every inhabitant of an inductive type. And the Godel move looks like it decomposes into an encoding of syntax plus a diagonal/fixpoint construction.

