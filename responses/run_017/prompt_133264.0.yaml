  We are given the MU puzzle from Gödel, Escher, Bach. The rules are:

  1. If you have a string ending in I, you can add a U. (e.g., MI -> MIU)
  2. If you have Mx, you can get Mxx. (e.g., MI -> MII)
  3. If you have three consecutive I's (III), you can replace them with a U. (e.g., MIII -> MU)
  4. If you have two consecutive U's (UU), you can remove them. (e.g., MUU -> MU)

  The puzzle: starting from the axiom MI, can we derive MU?

  Hofstadter presents a solution by "jumping out of the system": we notice that the number of I's in any theorem (starting from MI) is never divisible by 3. Since MI has one I (which is 1 mod 3) and MU has zero I's (which is 0 mod 3), we conclude that MU is not derivable.

  In the formal verification course, the student is familiar with:

  - Inductively defined propositions (or predicates) and structural induction over their derivation trees.
  - Reflection: representing the syntax of a language within itself (quoting) and reasoning about it.
