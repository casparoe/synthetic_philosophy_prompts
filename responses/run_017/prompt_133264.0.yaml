    | rule2 (s : List Symbol) : Derives (M :: s) → Derives (M :: s ++ s)   -- If Ms is a theorem, so is Mss.
    | rule3 (s t : List Symbol) : Derives (s ++ [I, I, I] ++ t) → Derives (s ++ [U] ++ t)   -- Replace III with U.
