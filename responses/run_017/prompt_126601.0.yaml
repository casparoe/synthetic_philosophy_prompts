  *scrolling through the points again* Ah! Point 4 about intrinsic intentionality might clash with point 6's algorithmic commitment. If representation is "really there" beyond utility, does that require non-algorithmic elements? And point 7's strong novelty claim could strain against point 1's "no unexplained design" principle if not carefully handled.

  The scaffolding concept (point 5) feels crucial - it's their solution to cultural explanation without group minds. But does calling it "neither reductionist nor skyhook" hold up? I think it works if scaffolding remains causally inert, but the "bootstrap crane" subcase might blur lines with skyhooks.

  *testing each point against others* Biggest tension is indeed between 3 and 4: denying intrinsic qualia while affirming intrinsic intentionality. The user needs to either adjust their representation theory or accept a pragmatic view of consciousness. Moderate tension exists between 4 and 6 regarding algorithmic nature of meaning.

