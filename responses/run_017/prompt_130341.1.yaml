  ## Part 2: The fixed point phenomenon

  In both the standard two-turning and this three-turning case, the ex ante optimal policy p* has the property that at the turning, with the visit-frequency belief induced by p*, the driver is indifferent between turning off and driving on.

  The question: is this a general theorem?

  Consider a general setting: there are n turnings. At turning i, if the driver turns off, he gets a payoff r_i. If he drives on, he goes to turning i+1, and if i=n and he drives on, he gets 0 (or some default).

  The driver uses a stationary policy: at every turning, turn off with probability p, drive on with probability 1-p.

  The ex ante expected value is a function f(p).

  The visit to turning i occurs only if he drove on at turnings 1 to i-1, which has probability (1-p)^{i-1}. So the weight for turning i is w_i = (1-p)^{i-1}.

  The total weight for being at a turning is S = sum_{i=1}^n w_i = sum_{i=1}^n (1-p)^{i-1}.

  The belief at a turning is: mu_i = w_i / S.

  At a turning, if the driver turns off, he gets r_i.

  If he drives on, then if he is at turning i (i<n), he goes to turning i+1 and then will use the policy p. The expected value from there is the same as the ex ante value but starting from turning i+1. Let V_{i+1}(p) be that value.

  Specifically, the value from turning i onward with policy p is:

  V_i(p) = p * r_i + (1-p) * V_{i+1}(p)

  With V_{n+1}(p) = 0, and for i=n: V_n(p) = p * r_n + (1-p)*0 = p * r_n.

  Then the ex ante value is V_1(p).

  Now, at a turning, with belief mu, the expected value of turning off is sum_i mu_i * r_i.

  The expected value of driving on is sum_i mu_i * [ if i<n then V_{i+1}(p) else 0 ].

  The fixed point condition is that at the optimal p*, these two are equal.

  In the cases we've seen, this holds.

  Is it always true? We can consider a simple counterexample.

