  But the question says: "forgetting could ever be worth paying for" — meaning, would he pay to forget? That is, is there a benefit to being forgetful?

  In the standard two-turning absent-minded driver, without forgetfulness, he gets 4 (by turning off at the second). With forgetfulness, he gets 4/3≈1.333, which is less. So again, he is hurt by forgetfulness.

  There are variants of the absent-minded driver where forgetfulness is beneficial. For example, if the payoffs are such that at the first turning, the driver would be tempted to do something that is bad ex ante. But in the standard setups, it is not beneficial.

  In this three-turning case, no norm makes the driver prefer forgetfulness. But since the question is "could it ever be", we note that in the standard two-turning, if the payoffs are changed, it might be.

