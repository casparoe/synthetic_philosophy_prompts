  - At third: he would turn off (2>0).

  So the value: 
  - At first: he drives on, so he gets to second.
  - At second: he turns off, so gets 4.
  - So value=4.

  Compared to 1.262, he would be willing to pay 4 - 1.262 = 2.738 to remember.

  But the question is: in this case or the nearest variant, is forgetting worth paying for? Actually, it's the opposite: he would pay to remember.

