  Same as without.

  But if x=5, y=0, z=0, then without forgetfulness: at first, he turns off and gets 5. At second, he turns off and gets 0. But since he starts at first, he gets 5.

  With forgetfulness: if he uses p, then value: p*5 + (1-p)[p*0 + (1-p)*0] = 5p.
  Max at p=1, value=5.

  Same.

  To have forgetfulness be beneficial, we need a situation where the driver, if he remembers, is forced to take a suboptimal action at an early stage.

  For example, in the two-turning:

  Let x=0, y=4, z=100.

  Without forgetfulness:
