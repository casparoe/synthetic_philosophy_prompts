    Value: p*x + (1-p)[p*y + (1-p)*z] = p*0 + (1-p)[p*4 + (1-p)*100] = (1-p)(4p + 100 -100p) = (1-p)(100 -96p)
          = 100 -100p -96p +96p^2 = 96p^2 -196p +100.

  Derivative: 192p -196=0 -> p=196/192=49/48>1, so maximum at p=1: 0.

  Or at p=0: 100.

  So if he uses p=0, then at every turning he drives on, so he gets 100.

  Same as without forgetfulness.

  Not beneficial.

  A known example is the self-control absent-minded driver: 

  First turning: turn off -> immediate reward 1; drive on -> go to second.
  Second turning: turn off -> reward 0; drive on -> reward 4.

  Without forgetfulness: at first, he turns off and gets 1 (because if he drives on, then at second he would turn off and get 0 or drive on and get 4, so he would drive on at second and get 4, so 4>1 -> he drives on at first, then at second drives on and gets 4).

  With forgetfulness: he uses policy p.
  Value: p*1 + (1-p)[p*0 + (1-p)*4] = p + 4(1-p)^2.
  = p + 4 -8p +4p^2 = 4p^2 -7p +4.
  Derivative: 8p-7=0 -> p=7/8.
  Value = 4*(49/64) -7*(7/8) +4 =  (196/64) - (49/8) +4 = (49/16) - (98/16) + 64/16 = (49-98+64)/16 = 15/16 = 0.9375 < 4.

  So without forgetfulness he gets 4, with he gets 0.9375, so he would not want to forget.

  But there is a variant where it is beneficial? I am not aware of one. In the standard literature, forgetfulness is usually detrimental.

  So in our case, for all norms, the driver would not pay to forget; he would pay to remember.

