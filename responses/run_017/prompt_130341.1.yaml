  - Self-consistent interim optimization: he uses the same policy p*, so same as resolute planning.

  - Naive interim optimization: he uses uniform belief. We saw that he is vulnerable to Dutch book. The expected loss per journey is about 0.3835 (as calculated earlier).

  - Single-decision reading: he chooses a pure action and applies it everywhere. Suppose he chooses always turn off. Then at the turning, he knows he is at a turning, but what is his belief? The norm doesn't specify a belief. He might believe anything. But the Dutch book is at his own stated odds. If he doesn't state any odds, then not applicable. But if he is asked for his belief, he might say uniform? Or he might say he is at the first with certainty? We don't know. So we skip.

  - Robustness: not specified.

  - Maximize chance of best outcome: he uses p=1/2. Then his belief should be the visit-frequency belief for p=1/2: weights 1, (1-0.5)=0.5, (0.5)^2=0.25. Total S=1.75. Belief: 1/1.75≈0.571, 0.5/1.75≈0.286, 0.25/1.75≈0.143. This is the true frequency, so not vulnerable.

  ### Forgetting worth paying for?

  The question: could forgetting ever be worth paying for? Meaning, if the driver could choose to remember, would he prefer to remember? 

