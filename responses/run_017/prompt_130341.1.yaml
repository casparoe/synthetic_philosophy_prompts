  - **Why ex ante value is the primary dimension**: The driver is specified as an ex ante EU-maximizer. Norms should respect this; alternatives (e.g., ignoring expectations) change the problem. Coherence and robustness matter but are secondary—e.g., maximizing chance is coherent but still suboptimal.

  ### Part 4: Flag for Tier 1 Norm
  For **resolute planning** (tier 1, rating 10), the consideration that could move it to tier 2 is:
  - **Failure of dynamic consistency under alternative belief updates**. If the driver uses a non-visit-frequency belief (e.g., SIA/SSA self-locating priors), the ex ante optimum may not be interim-optimal. In such cases, resolute commitment ignores interim incentives, causing regret.  
    - **Where error might hide**: In the **treatment of self-locating belief**. Visit-frequency is standard in stochastic processes, but philosophy sometimes favors centering or uniform priors. If your model assumes such priors, resolute planning may not align with interim rationality.  
