  With forgetfulness, he can get up to 4/3 in the standard (x=0,y=4,z=0) but max(x,y)=4, which is better.

  However, if x=0, y=0, z=1, then without forgetfulness: at first, he compares 0 and the value from second: at second, he gets 0 (if he turns off) or z=1 (if he drives on). So he drives on at first. At second, he drives on (since 0<1). So he gets z=1.

  With forgetfulness: he uses a policy p. 
  Value: p*0 + (1-p)[p*0 + (1-p)*1] = (1-p)^2.
