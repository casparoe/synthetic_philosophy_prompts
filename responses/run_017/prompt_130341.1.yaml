  ### Visit-frequency belief

  The belief over which turning he is at, conditional on being at a turning, is proportional to the expected number of visits to that turning (since the process may end early).

  - First turning: always visited -> weight 1.
  - Second turning: visited only if he drove on at the first -> weight 1-p*.
  - Third turning: visited only if he drove on at the first and second -> weight (1-p*)^2.

