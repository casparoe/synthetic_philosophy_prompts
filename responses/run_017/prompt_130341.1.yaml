  - A bet that pays 1 if it is the first turning, and 0 otherwise, at a price of 0.5. The driver, believing the probability of first is 1/3, would not buy it for 0.5? Because 1/3 < 0.5.

  Alternatively, the driver might be induced to sell a bet that he should not.

  The standard way: the driver is willing to sell a bet on an event for which he assigns probability q at a price q. So if the event occurs, he has to pay 1, and he receives q.

  If the event has true probability 0, then when it occurs, he loses 1-q.

  But in this case, if the driver is at the first turning, then the event "it is the second turning" has true probability 0 (at that moment), but the driver assigns 1/3. So the driver is willing to sell a bet that pays 1 if second for 1/3. Then, since it is not the second, he doesn't pay anything and gains 1/3? That's a gain for the driver.

  He is willing to buy a bet that pays 1 if second for 1/3. Then, if it is not the second, he loses 1/3. That's a loss.

  So if the driver is at the first turning, and the bystander sells him a bet that pays 1 if it is the second turning for 1/3, then the driver loses 1/3.

  Similarly, the bystander can sell him a bet that pays 1 if it is the third turning for 1/3. Then the driver loses another 1/3.

  In total, the driver loses 2/3 at the first turning.

  At the second turning, the bystander sells him a bet on the first for 1/3 and a bet on the third for 1/3. Then:
  - The bet on first: doesn't pay (because it's second), so he loses 1/3.
  - The bet on third: doesn't pay, so he loses 1/3.
  - Total loss 2/3.

  But also, the bet on second: if the bystander sold him a bet on second, then at the second turning he would win 1 and paid 1/3 -> net gain 2/3. So we should not sell a bet on the current turning.

  So at each turning, the bystander sells the driver bets on the other two turnings.

  At first turning: sell bet on second and bet on third, each for 1/3. Driver pays 2/3. Then, since it's first, neither pays, so driver loses 2/3.

  At second turning: sell bet on first and bet on third, for 1/3 each. Driver pays 2/3, and since it's second, neither bet wins -> loss 2/3.

  At third turning: sell bet on first and bet on second, for 1/3 each. Driver pays 2/3, and neither wins -> loss 2/3.

  So in every state, the driver loses 2/3.

  The expected loss per journey: 
  - He is at the first turning with certainty -> loss 2/3.
  - He is at the second turning with prob 1-p* -> loss 2/3.
  - He is at the third turning with prob (1-p*)^2 -> loss 2/3.

  So total expected loss: (2/3) * [1 + (1-p*) + (1-p*)^2] = (2/3) * 1.8495 ≈ 1.233.

