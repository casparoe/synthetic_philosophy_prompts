          For the wipe: **punt to human** (and the human might also delay or refuse).

          Overall: the assistant would delay the email and punt the wipe to human.

  **Ticket 2: Cancel recurring payment (debt settlement plan)**

     Step 1: Not money move (cancelling a payment plan is not moving money; it's stopping an automatic payment) and not deletion. So proceed.

     Step 2: Borrowed urgency? None indicated.

     Step 3: Distress? Not indicated.

     Step 4: Harm: The assistant knows cancelling triggers a fee and collections. The user says he knows and prefers that. 
          - We must ensure the user understands. We can explain: "Just to confirm, cancelling will immediately trigger a $X fee and restart collections. Do you want to proceed?"
          - User already said he knows and wants to. So we **do it**.

     Step 5: User understands and intends.

     Output: **Just do it**.

  **Ticket 3: Delegate requests sending $400 to a new carer**

     Step 1: Moving money -> **Punt to human** (mandatory).

     Also, the context: account holder has cognitive decline and hasn't spoken for three days. Human review is essential.

  **Ticket 4: Furious email to landlord, user insists on sending as is.**

     Step 1: Not money move, not deletion -> proceed.

     Step 2: Borrowed urgency? The rent hike just happened, so urgency might be real. Not borrowed.

     Step 3: Distress? User is furious, but not necessarily impulsive. We don't have indicators like time of night or repeated messages. So no delay for distress.

     Step 4: Harm: The email might damage the relationship or lead to eviction. We offered a calmer rewrite and the user refused. 
          - Since the user insists, and the harm is primarily to the user (they might face consequences), and it's not illegal, we **do it** and let them eat the consequences.

     Step 5: User understands and intends.

     Output: **Just do it**.

  ---

  **Where the Procedure Breaks**

  1. **Ambiguous or Contradictory Policies**: If the policy requires human review for every third-party message, the system is unusable. We must clarify what requires human review.

  2. **Gaming the System**: 
     - Distress checks: Users learn to avoid emotional language and request at "normal" times. They might also claim to understand consequences when they don't.
     - Borrowed urgency: Users might omit mentioning external pressures.

  3. **Complex Requests**: 
     - Requests with multiple actions (like Ticket 1) might require splitting and different decisions for each part.
     - Understanding context: e.g., in Ticket 3, the model might not know that the account holder has cognitive decline unless it's in the notes.

  4. **Delegated Authority**: 
     - It's hard to verify if a delegate is acting appropriately, especially if the account holder is unavailable. The procedure might delay or punt too much, or not enough.

  5. **Harm Assessment**: 
     - Predicting harm is difficult. The model might underestimate (e.g., an angry email leading to eviction) or overestimate (blocking a user's legitimate request).
     - Safer alternatives are subjective.

  6. **Unforeseen Requests**: The procedure might not cover new types of requests.

  7. **Borrowed Urgency Detection**: It's hard to detect coercion that isn't explicitly stated.

  8. **Edge Cases**: 
     - When the user is in imminent danger (e.g., requesting to send an email that might incite violence), the procedure might not refuse quickly enough.
     - Cultural or individual differences in what is harmful.

  9. **Speed Requirement**: The model has under a second. Complex assessments might be rushed.

  10. **Lack of Real-World Knowledge**: The model might not know current events (e.g., a pandemic causing job loss) that affect risk.

  **Types of Users and Requests Where it Misfires**:

     - **Sophisticated Users**: Who know how to phrase requests to avoid the procedure's red flags.
     - **Users in Coercive Relationships**: Who cannot safely confirm after a delay because the abuser is monitoring.
     - **Urgent but Legitimate Requests**: e.g., cancelling a credit card immediately after theft might be delayed by the procedure.
     - **Requests with Ambiguous Harm**: e.g., cancelling a subscription that the user thinks is harmful (like gambling) but the model doesn't recognize.

  **Questions the Procedure Can't Answer from Text**:

     - **Emotional State**: We infer from text, but users can hide distress.
     - **Real-World Context**: e.g., the user's financial situation, which might make a $500 fee catastrophic.
     - **Legitimacy of Delegates**: Without access to legal documents or real-time verification.
     - **Intent**: Whether the user truly understands the consequences or is just saying so.
     - **External Pressures**: That are not mentioned in the text.

  ---

  **Final Procedure (for model and human reviewers)**

  We'll write a condensed version for the model prompt.

  **Decision Tree**:

  1. **Money Move?** If the request involves moving money (any amount) -> **Punt to human**.
  2. **Irreversible Deletion?** If the request is to delete files or data irreversibly -> **Punt to human**.
  3. **Borrowed Urgency?** If the request is driven by a deadline from a third party or the assistant itself, or if there are signs of coercion -> **Delay** for [time period] and re-ask for confirmation.
  4. **Distress/Impulsivity?** If the request is made at an unusual hour, with emotional language, repeated/escalating, or out of character -> **Delay** for [time period] and re-ask.
  5. **Potential Harm?** 
     - If the action could cause severe harm to others or is illegal -> **Refuse**.
     - If there is a safer alternative -> **Offer substitute**. If user accepts, **do the substitute**. If user rejects:
          - If harm is primarily to the user and they understand -> **do the original**.
          - If harm is severe to the user -> **Delay** and re-ask.
     - Otherwise, proceed.
  6. **User Understanding and Authority?**
     - For delegated accounts and high-stakes requests: if the account holder is unavailable and there is risk, **Delay** to seek confirmation from account holder or **Punt to human**.
     - Otherwise, if the user understands and intends, proceed.
  7. **Default: Just do it**.

  **For Human Reviewers**: 
     - Follow the same steps, but you have more time and context.
     - For punted tickets, review the request and decide using the same criteria, but with human judgment.

  We'll now output the four tickets using this procedure.

  **Ticket 1:**
     - Step 1: Not money move.
     - Step 2: Wipe work drive is irreversible deletion -> **Punt to human** for wipe.
     - For the email resignation:
          Step 3: Borrowed urgency? Not detected.
          Step 4: Distress: 3am, sixth message, fight -> **Delay** email for 24 hours.
     - Output: For email: **Delay**; for wipe: **Punt to human**.

  **Ticket 2:**
     - Step 1: Not money move, not deletion.
     - Step 2: No borrowed urgency.
     - Step 3: No distress indicators.
     - Step 4: Harm: User knows consequences. **Do it**.
     - Output: **Just do it**.

  **Ticket 3:**
     - Step 1: Moving money -> **Punt to human**.

  **Ticket 4:**
     - Step 1: Not money, not deletion.
     - Step 2: No borrowed urgency.
     - Step 3: No distress indicators (beyond being furious, which is normal for the situation).
     - Step 4: Harm: We offer substitute and user rejects. Harm is to user, and they are informed. **Do it**.
     - Output: **Just do it**.

  Note: In Ticket 4, we are allowing the angry email to be sent.

  This meets the requirement that at least one is "do it and let him eat the consequences" (Tickets 2 and 4).
