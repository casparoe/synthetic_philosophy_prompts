     However, note that the predictor might not recover immediately. The hard-wired program is falsified at step N+1, but there might be other programs that predict a one at step N+1 and then zeros afterwards? The prior for such programs might be non-zero. But the point is that the cumulative error bound holds.

     So the construction is fair in the sense that it does not break the theorems. The dominance result and the cumulative error bound hold. However, the user's point is that the additive constant in the dominance result (or the constant in the error bound) can be large for some environments and some UTMs, and that this constant can be made to depend on N arbitrarily. The theorems do not rule out that for a fixed environment (like the all-zeros) and a sequence of UTMs (U_N for increasing N) the constant can grow with N. But note that the bound for a fixed UTM and a fixed environment is a fixed constant. The issue is that if we choose the UTM adversarially (depending on the environment and the time step at which we want a large error), then we can cause a large error at that step.

