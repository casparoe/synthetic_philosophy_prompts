prompt: |-
  Hi there — hoping someone can help me get clearer on this, because I've been going round in circles with it for weeks. I help put together our town's little community newsletter, and for the last year or so I've been sitting in on the meetings of the council's Democracy and Boundaries working group, which is the bunch that decides who actually gets to vote whenever the town runs one of its referenda. I've started keeping notes on how they've ruled, and what's interesting is that they don't have a fixed franchise, they argue it out fresh every time. So far: for the referendum on shutting the outdoor pool they used the ordinary resident list, but they explicitly added 16- and 17-year-olds, non-British citizens living here, and the prisoners at the local prison, who got postal votes; they refused about forty people from nearby villages who held annual swim memberships and were in the water most mornings. For the referendum on merging the secondary school they did something odd and let residents of a hamlet that sits in the next parish vote, because their kids would otherwise be bussed twelve miles, though two members dissented and said it opened the floodgates. For the car park charges they said no to commuters from three local villages who buy most of the annual permits, and the notes record the reason as roughly this: once you pick the electorate by who is affected, you can draw the line wherever you like. And for the budget referendum they said no to people who own holiday lets here and pay council tax on them, on the grounds that they don't have to live with it day to day. Apart from the hamlet business, every vote so far has used the same basic list.

  Now the new one, which is why I'm writing. There's a proposal for a twenty-five year groundwater abstraction licence for a big bottling plant on the trading estate, and the council's own hydrology consultant's modelling says that in dry summers the pumping would drop the water table enough to dry up private boreholes in three villages about four miles away — different parish, different district council, no shared services with us at all — and would cut the flow of a chalk stream that people there care about enormously. Our town is all on mains water, so nobody here goes thirsty either way. The referendum is technically only consultative but the council has said it will treat the result as binding on whether it objects to the licence. One village has petitioned for its residents to be put on the franchise. Another wants a veto, meaning the whole thing shouldn't proceed if a majority there says no. The third parish council wants the three villages together to be given forty per cent of the total votes, weighted rather than added as ordinary voters. On top of that, a newer housing estate inside our boundary is on its own metered supply and is unaffected however it goes, so I can't work out whether they should still get to vote; there are about two thousand homes planned here over the twenty-five years, so I also can't tell whether people who don't live here yet ought to count for anything; and the company already employs two hundred people at its existing plant in the town. My brother-in-law lives in one of the villages and his well is apparently one of the ones at risk, so I'm not a neutral observer.

  What I'd really like from you is not just a yes or no. Can you work out what rule the panel seems to be running from the decisions above, set out the other rules that would fit that same track record just as well, and then say what each of them predicts about the villages getting votes, about the veto, about the forty per cent weighting, about the unaffected estate inside the boundary, and about the people who haven't moved here yet? Give me your best guess on what they'll actually do and why you'd back that one rather than the others, tell me honestly if their past decisions just don't settle it, and if so say what each choice would commit them to going forward. And name the one further case you'd want to put in front of them that would tell the competing rules apart — I keep thinking it might be something like people who move into an affected area after the decision is made, but you tell me. Please write your answer in American English, my sister-in-law in Ohio is going to read it and she gets grumpy about our spelling. I did one evening class in philosophy years ago so please don't assume I know any of the technical vocabulary, but I can follow a proper argument if you lay it out.
reasoning: |-
  Okay, let me tackle this user's problem step by step. They're involved in a community newsletter and need help deciphering the voting rules used by their town's Democracy and Boundaries working group. The user has provided several past referendum cases and now faces a complex groundwater abstraction license vote affecting neighboring villages. 

  First, I need to analyze the pattern from past decisions. The pool referendum included affected groups like teens, non-citizens, and prisoners while excluding swim members from nearby villages. The school vote included a hamlet in another parish because of impact on children's commutes. The car park vote excluded commuters who were affected, with the reasoning that "affected parties" lines can be drawn arbitrarily. The budget vote excluded holiday let owners who pay taxes but don't live there daily. 

  Hmm... the common thread seems to be "material daily impact" rather than strict residency or legal status. But there are contradictions - the hamlet inclusion for schools suggests geographical boundaries can be overridden for significant impact, while the car park decision shows even affected parties can be excluded. The key tension is between "impact" versus "boundary" principles.

  For the current groundwater vote, three villages four miles away would be hydrologically affected but are outside all administrative boundaries. The user mentions several proposals: including voters, giving veto power, or weighted voting. There's also the question of an unaffected housing estate within town boundaries and future residents.

  I consider possible rules that fit past decisions:
  1) Strict boundary rule (ordinary residents only)
  2) Direct impact rule (anyone materially affected)
  3) Residential impact hybrid (residents + non-residents with daily impact)
  4) Municipal responsibility rule (only those under council's jurisdiction)

  Each rule leads to different outcomes for the villages - Rule 2 would include them, Rule 1 wouldn't. The veto and weighting proposals seem unlikely based on past precedent of binary in/out decisions. The unaffected estate probably gets included under all rules since they're within boundaries, while future residents would likely be excluded as past decisions only considered present populations.

  My best guess is they'll use the residential impact hybrid again: include the villages because they're directly impacted (like the hamlet for schools), but not grant veto or weighting. The unaffected estate gets included as residents, future residents excluded. This maintains consistency while acknowledging severe impact.

  To clarify their principles, I'd propose a test case: voting rights for people who move into an affected area AFTER a decision is made. Under impact-based rules they shouldn't vote, under boundary-based rules they should. This would reveal their true priority.
answer: |-
  Here's a breakdown of the situation, potential rules, predictions, and my best guess – all in American English:

  **Step 1: Figuring Out the Panel's Seeming Rule (or Rules)**

  Looking at their past decisions, it's messy. They don't stick to one single rule consistently. Instead, they seem to weigh **two core, sometimes conflicting, principles**:

  1.  **Residency:** They consistently start with the "ordinary resident list" (people living within the town boundaries). This is the baseline.
  2.  **Material Daily Impact:** They adjust this list based on *who is concretely and daily affected by the specific decision*, even if it means including non-residents or excluding residents.
      *   *Inclusions:* Added teens, non-citizens, prisoners (Pool); added hamlet residents (School - though controversial).
      *   *Exclusions:* Excluded swim members (Pool - affected but not residents); excluded commuters (Car Park - affected but not residents); excluded holiday let owners (Budget - residents/owners but not daily impacted).

  **Other Rules That Fit the Same Track Record:**

  Here are different ways to describe their approach, all consistent with the history:

  *   **Rule 1: The "Affected Resident Plus" Rule:** The franchise is primarily residents *plus* non-residents who experience a direct, tangible, daily impact on their lives or property *from this specific decision*, but *minus* residents who lack that daily impact.
  *   **Rule 2: The "Community of Daily Experience" Rule:** The franchise includes everyone who lives within the town boundary *and actively participates in the daily life of the community*, plus non-residents whose daily life *within the town* is directly and significantly impacted by the decision. It excludes those who only have a financial, occasional, or non-daily stake (swim members, commuters, holiday let owners).
  *   **Rule 3: The "Municipal Responsibility with Impact Override" Rule:** The default is the resident list because the council is responsible *to them*. However, they will include non-residents if the impact on them is severe, direct, undeniable, and arises *specifically from the council's action/inaction* (like the hamlet kids' bus ride). They will exclude residents if their stake is deemed purely financial or non-integral to daily community life.
  *   **Rule 4: The "Case-by-Case Impact Assessment" Rule (No Fixed Rule):** They discard fixed rules and argue each time based on the unique nature of the impact, who bears the cost/benefit, fairness, and potential precedents. The past decisions are just examples, not binding principles. The "draw the line" comment strongly supports this.

  **Step 2: Predictions for Each Rule on the Groundwater Vote**

  | Issue                  | Rule 1: Affected Resident Plus                                                                 | Rule 2: Community of Daily Experience                                                                                             | Rule 3: Municipal Resp. w/ Impact Override                                                                        | Rule 4: Case-by-Case Impact Assessment                                                                                                                               |
  | :--------------------- | :--------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Villages Get Votes?** | **YES.** Residents are directly impacted (dry wells, stream). Impact is severe, daily, and property-related.                 | **PROBABLY NO.** They don't live in the town or participate in its daily life. Their impact happens *where they live*, not within the town. | **LIKELY YES.** The impact (dry wells, stream damage) is severe, direct, undeniable, and caused by the license the council controls. Comparable to the hamlet. | **HIGH CHANCE OF YES.** The impact is scientifically predicted, severe, and uniquely tied to *this* council's decision. The petition adds pressure. Exclusion seems grossly unfair. |
  | **Villages Get a Veto?** | **NO.** The rule is about *inclusion*, not power weighting. Precedent is binary (in/out).                                | **NO.** Doesn't fit the concept.                                                                                                  | **NO.** Precedent is inclusion, not veto power. The council retains ultimate responsibility.                       | **NO.** Highly unusual. Sets a terrible precedent. The council won't cede its authority to another community.                                                        |
  | **40% Weighted Votes?** | **NO.** Precedent is individual voting rights (in/out), not bloc weighting.                                    | **NO.** Doesn't fit.                                                                                                               | **NO.** Precedent is individual inclusion, not bloc representation.                                                | **EXTREMELY UNLIKELY.** Wildly impractical and unprecedented. Creates complex "vote buying" issues.                                                                   |
  | **Unaffected Estate (Inside Boundary)?** | **PROBABLY YES.** They are residents. Lack of impact *on water* doesn't necessarily mean no stake in the town's economy/jobs/traffic. Precedent (Budget) excluded based on *type* of stake (non-daily), not lack of *any* stake. | **YES.** They are residents participating in the daily life of the town. The decision affects the town's character, economy, etc. | **YES.** They are residents under the council's jurisdiction. Impact isn't the *only* factor for residents.        | **YES.** They are residents. Exclusion would be radical without precedent. The impact on *them* (jobs, traffic, town character?) is debatable but different in kind. |
  | **Future Residents?**  | **NO.** Past decisions only included *current* populations (residents, prisoners, teens *now*). Impact on unknowns is speculative. | **NO.** They aren't part of the *current* community of daily experience.                                                          | **NO.** The council's responsibility is to current residents. Future impact is too uncertain and indirect.         | **NO.** Impossible to define or verify. Highly impractical. Not supported by past practice.                                                                          |

  **Step 3: Best Guess & Why**

  *   **Best Guess:** They will **include the residents of the three villages** in the vote, but **will NOT grant a veto or weighted votes**. The **unaffected estate will be included**. **Future residents will be excluded**.
  *   **Why this Rule (Most Likely):** This best fits **Rule 3 (Municipal Responsibility with Impact Override)** and also aligns strongly with **Rule 1 (Affected Resident Plus)** and the likely outcome under **Rule 4 (Case-by-Case)**.
      *   **Villages:** The hydrology report provides clear, severe, direct, and undeniable impact *caused by the council's potential action* (granting the license). This mirrors the logic of including the hamlet for the school vote due to unavoidable impact (busing). Excluding them, like excluding the swim members or commuters, would feel unjust here because the impact is fundamental (water access, environment) and uniquely tied to *this* council's decision. The "draw the line" comment from the car park vote suggests they *know* the line is arbitrary, but the *scale and nature* of impact here pushes them to include.
      *   **Veto/Weighting:** There is zero precedent for this. It fundamentally changes the nature of the vote from a local decision to a negotiated settlement between communities. The council is unlikely to give up its ultimate responsibility or set this precedent.
      *   **Unaffected Estate:** They are residents. The precedent (Budget vote) excluded residents based on the *nature* of their connection (non-daily), not the absence of *any* connection. These residents *do* have a daily connection to the town. Excluding them would be a major departure requiring strong justification ("unaffected by water" isn't the same as "unaffected by the plant's existence").
      *   **Future Residents:** No precedent for including hypothetical people. Utterly impractical.

  **Step 4: Honesty - Do Past Decisions Settle It?**

  **No, the past decisions do NOT definitively settle it.** Here's why:

  1.  **The Hamlet Precedent vs. the Commuter Precedent:** Including the hamlet (non-resident, impacted) argues *for* including the villages. Excluding the commuters (non-resident, impacted) argues *against*. The key difference the panel likely sees is the *nature* of the impact: the hamlet faced a fundamental change to children's daily lives (long bus ride); commuters faced a cost increase. The villages face a fundamental impact (water access, environment). This distinction is subjective.
  2.  **Defining "Impact":** How severe, direct, and daily must it be? Is a predicted 25-year impact on a borehole "daily"? Is environmental damage to a stream "experienced daily" by residents? The panel interprets this loosely.
  3.  **The "Draw the Line" Admission:** This explicitly states they know the boundary is arbitrary. This empowers them to decide based on the *feel* of this specific case.

  **What Each Choice Commits Them To:**

  *   **Include Villages:** Commits them to a precedent that severe, direct, scientifically verified impacts *caused by their specific decision* on non-residents can warrant inclusion. Future cases (e.g., major pollution, traffic) will cite this. It broadens their perceived responsibility beyond strict boundaries.
  *   **Exclude Villages:** Reinforces the primacy of the municipal boundary *unless* the non-resident impact involves unavoidable daily participation *within* the town (like the hamlet kids *using* the school). Sets a higher bar for non-resident inclusion, focusing on impacts *within* their jurisdiction. Future cases with external impacts will face an uphill battle.
  *   **Exclude Unaffected Estate:** Commits them to a radical new principle: residents can be excluded if a *specific aspect* of a decision doesn't affect them directly, even if they are affected by the decision's broader consequences (jobs, traffic, town character). This opens a huge can of worms for future votes.
  *   **Include Unaffected Estate:** Maintains the strong precedent that residency within the boundary is the primary qualification. Impact modifies this primarily by *adding* non-residents or *excluding* residents with a very specific *type* of non-daily connection (like holiday lets).

  **Step 5: The Test Case to Tell Rules Apart**

  You were on the right track! The best test case to distinguish between "Impact" rules (1, 3, 4) and "Boundary/Daily Community" rules (2) is:

  *   **People Moving into an Affected Area AFTER the Decision:** Imagine a vote on building a major new waste processing plant. Modelling shows significant odor issues for a specific neighborhood *within* the town boundaries for the next 20 years.
      *   **Impact Rules (1, 3, 4):** Would likely argue that only *current* residents of that neighborhood get a vote. People moving in *after* the decision, knowing the plant and odor are there, chose that situation. They aren't "affected" by the *decision* itself in the same way.
      *   **Community of Daily Experience Rule (2):** Would argue that *any* resident living in the odor zone *at the time of the vote* gets a vote, regardless of when they moved in. What matters is their *current* daily experience within the community, which includes enduring the odor. The decision's timing is less relevant than the current lived reality.
      *   **Why it's good:** It directly confronts the tension between "impact of the *decision*" vs. "impact of the *consequence*" and "current daily experience". It isolates the factor of *when* the impact is felt relative to residency. The past decisions don't clearly address this timing aspect.
