answer: |-
  ### Preamble: Discarded Candidate Requirements  
  I begin by brainstorming requirements motivated by standard intuitions and cases, then discard:  
  1. **Global preference optimization**: That preferences must maximize some global utility function. Discarded because it ignores dynamic preference change and learning (violates *instructive pump*).  
  2. **Strict stationarity**: That preferences must remain constant over time. Discarded as incompatible with benign or endogenous change (*anticipatory pump*, *endogenous preference change*).  
  3. **Infinite farsightedness**: That agents must foresee all future consequences. Discarded for violating cognitive limits and *joint followability*.  
  4. **Zero vulnerability to all money pumps**: Discarded because some pumps (e.g., *subsidized*, *fragmented*) are non-exploitable or self-correcting, making immunity irrelevant.  
  5. **Preference purification**: That preferences must "settle" before choice. Discarded as unrealistic for *uncertainty about future wants*.  

  Retained requirements focus on *structural coherence*, *procedural executability*, and *robustness to exploitation*.  

  ---

  ### Specification: Requirements for Diachronic Rationality  
  **Non-negotiable requirements** (essential for both jobs):  
  1. **Solitary-pump immunity**: The agent must not be vulnerable to self-inflicted preference cycles where *her own sequence of choices*, guided by time-indexed preferences, leads to a strictly worse outcome than initially available. *Motivation*: Solitary pump (e.g., procrastination cycles). Vulnerability is a defect because the agent *could have acted otherwise* using foresight.  
  2. **Joint followability**: Recommendations at different times must be jointly executable by a single agent with ordinary cognitive and volitional capacities (e.g., no "save Monday, spend Tuesday" conflicts). *Motivation*: Practical agency; a theory violating this cannot guide action.  
  3. **Endogenous-change compatibility**: The theory must handle preference changes caused by the agent’s own choices (e.g., becoming a "different person" through habituation). *Motivation*: Endogenous preference change (e.g., training).  
  4. **Attitude distinction**: Verdicts must specify whether they apply to preference structures, choice procedures, or plans, acknowledging these can diverge (e.g., *sophisticated vs. resolute choice*). *Motivation*: Solitary pump (preferences vs. plans) and design contexts.  

  **Negotiable requirements** (context-dependent for advisory role):  
  5. **Feasibility-filtered pump immunity**: Vulnerability counts as irrational *only* if the pump is exploitable by real-world actors (feasible incentive structures). *Motivation*: Subsidized pump (no exploiter incentive) and fragmented pump (counterparty defection). *Filter*: A pump is feasible iff (i) counterparties profit unilaterally at each step, and (ii) no step relies on non-replicable conditions (e.g., vanishing-step convergence).  
  6. **Uncertainty tolerance**: The theory must accommodate agents uncertain about future preferences (e.g., quitting smoking despite doubting future resolve). *Motivation*: Uncertainty about future wants.  

  **Camp-prejudice requirement** (contentious; included tentatively):  
  7. **Gradational defect tracking**: Degrees of irrationality should track *opportunities forgone* (e.g., dominated outcomes) rather than money lost. *Motivation*: Vanishing-step pump (small losses) vs. solitary pump (large opportunity costs). Reflects a "structuralist" camp bias.  

  ---

  ### Tensions and Trade-offs  
  **Conflict**: *Joint followability* (non-negotiable) and *endogenous-change compatibility* (non-negotiable) clash with resolute commitment (a common solution to solitary pumps).  
  - **Why**: Resolute commitment requires sticking to a plan despite changing preferences (ensuring joint followability). But if preferences change endogenously (e.g., through effort), forcing adherence ignores the agent’s new values.  
  - **Resolution**: Drop strict resolute commitment. The resulting theory would:  
    - Prioritize *plan consistency* only when preferences are stable or changes are exogenous.  
    - For endogenous changes, permit plan revision if the change was *reasonably foreseeable* and *reflects growth* (e.g., anticipatory pump).  
    - Example: An agent training to enjoy exercise may abandon a "never skip gym" plan if the new preference is authentically integrated.  

  **Most exclusionary requirement**: *Joint followability*.  
  - **Why**: It excludes theories that treat time-slices as independent (e.g., myopic choice), sophisticated choice (which often prescribes inconsistent plans), and some "whole life" views (if they ignore execution constraints). Only plan-based or reasons-responsive theories can natively satisfy it.  
  - **Defense**: Without joint followability, the theory fails the *advisory job* (e.g., cannot recommend feasible commitment devices) and trivializes irrationality (agents are blamed for unavoidable conflicts).  

  ---

  ### Theory Scoring Table  
  *Key to requirements (hardest 5)*:  
  (A) Solitary-pump immunity  
  (B) Joint followability  
  (C) Endogenous-change compatibility  
  (D) Feasibility-filtered pump immunity  
  (E) Attitude distinction  

  | Theory                          | A | B | C | D | E |  
  |---------------------------------|---|---|---|---|---|  
  | **Momentary preferences + myopic choice** | ✗ | ✗ | △ | ✓ | △ |  
  | *Choices maximize current preferences, ignoring future* | Fails solitary pumps | Inconsistent plans | Ignores change | Invulnerable to infeasible pumps | Confounds attitudes |  
  | **Sophisticated choice**          | △ | ✗ | △ | ✓ | ✓ |  
  | *Plans account for future defection* | Avoids some pumps | Plans often unfollowable | Struggles with endogenous change | Filters infeasible pumps | Distinguishes plans/preferences |  
  | **Resolute commitment**           | ✓ | ✓ | ✗ | ✓ | ✓ |  
  | *Stick to initial plans* | Immune to solitary pumps | Followable | Rejects endogenous change | Filters infeasible pumps | Clear plan focus |  
  | **Whole-life preferences**        | ✓ | △ | ✗ | △ | ✗ |  
  | *Preferences over complete trajectories* | Immune if consistent | Assumes capacity for global view | Static preferences | Vulnerable to feasible pumps? | Undifferentiated |  
  | **Reasons-responsiveness**        | △ | ✓ | ✓ | △ | ✓ |  
  | *Rationality as coherence in belief/desire* | Depends on specification | Followable if reasons stable | Handles growth | Context-dependent | Distinguishes bases of choice |  

  ✓ = Satisfies, △ = Partially/contextually, ✗ = Fails  

  ---

  ### Epistemic Note  
  **Confidence levels for requirements**:  
  - *Non-negotiable*: Confident (grounded in agency failure cases).  
  - *Feasibility-filtered immunity*: Confident (pump cases show exploitation requires incentive-compatibility).  
  - *Uncertainty tolerance*: Inclined (advisory role demands flexibility).  
  - *Gradational tracking*: Guessing (reflects camp bias; empirical evidence needed).  

  **Least confident claim**: That *gradational irrationality must track opportunities forgone*.  
  - **Why**: Money losses might matter pragmatically (e.g., vanishing-step pump).  
  - **What would change my mind**: Evidence that folk judgments of irrationality scale with monetary loss (not just dominance), or that resource-constrained contexts (e.g., poverty) demand money-tracking.  

