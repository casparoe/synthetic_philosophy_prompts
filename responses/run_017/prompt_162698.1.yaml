  - Subsidized pump: Exploiter loses money so it's not realistic
  - Fragmented pump: Counterparties have no incentive to complete the cycle
  - Vanishing-step: Infinite trades with converging losses
  - Instructive pump: Agent learns after first loss
  - Solitary pump: No counterparty, self-inflicted cycle
  - Anticipatory pump: Benign preference change exploited

  From these, I need to extract a "feasibility filter" for when vulnerability actually counts as irrational. The solitary pump seems most compelling because it requires no external exploiter - the irrationality is internal to the agent's choices over time.

  Beyond pumps, the user highlights crucial aspects the theory must handle:
  - Endogenous preference change (becoming different through choices)
  - Uncertainty about future preferences
  - Distinguishing preferences, choices, and plans
