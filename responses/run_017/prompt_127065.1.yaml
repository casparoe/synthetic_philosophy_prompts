  ## DEPARTMENT OF ADMINISTRATIVE CONTINUITY  
  **Statutory Instrument: S.I. 1987 No. 451 (C. 32)**  
  **The Continuity of Office (Designated Functions) Order 1987**  
  *Made - - - - 15th April 1987  
  Coming into force - - 1st May 1987*

  **1. Citation and Commencement**  
  This Order may be cited as the Continuity of Office (Designated Functions) Order 1987 and shall come into force on 1st May 1987.

  **2. Interpretation**  
  In this Order, unless the context otherwise requires—  
  (a) “The Office” refers to the specific bundle of duties, responsibilities, inputs, outputs, and transitional states formally designated within Schedule 1 of the Administrative Roles (Consolidation) Act 1983 (as amended);  
  (b) “Occupant” refers to the entity or entities recognised by the Department as discharging the functions of The Office;  
  (c) “Input” means any communication, directive, request, or stimulus formally directed to The Office via established channels (Forms DAC/7, DAC/9a, or Telegraphic Code ‘OFFSTAT’);  
  (d) “Output” means any communication, directive, decision, or action formally issued by The Office via established channels (Forms DAC/8, DAC/10b, or Telegraphic Code ‘OFFACT’);  
  (e) “Internal State Transition” refers to the documented sequence of procedural steps, logical determinations, or precedent-guided responses undertaken between the receipt of an Input and the generation of an Output, as specified in the relevant Office Procedure Manual (OPM);  
  (f) “Department” means the Department of Administrative Continuity;  
  (g) “Continuity” means the uninterrupted persistence of The Office as a functioning entity within the Administration.  
  *[Marginal annotation in blue pencil: "Cf. *In re Standing Committee Gamma (Phase II)* DAC/Ref/1984/783 para. 12 re: 'bundle'. - J.P."]*

  **3. Principle of Continuity**  
  The fundamental principle governing the recognition of an Occupant is the preservation of Continuity. Continuity subsists where, and only where, the pattern of activity associated with The Office is maintained. This pattern is constituted by:  
  (a) The timely receipt and logging of all designated Inputs;  
  (b) The generation of Outputs consistent with the requirements, precedents, and response matrices specified in the relevant OPM;  
  (c) The observable sequence of Internal State Transitions linking specific Inputs to specific Outputs, as documented and verifiable through Form DAC/11 (Activity Ledger) or its authorised equivalents;  
  (d) The maintenance of all external effects upon other Offices and the public as defined by the Office’s Schedule of External Interactions (Form DAC/12).  
  The physical constitution, material substrate, or internal experiential phenomena (if any) of the Occupant are irrelevant to the determination of Continuity, provided the pattern described in sub-clauses (a) to (d) is demonstrably preserved.

  **4. Realisation of the Office**  
  (1) Any entity or collection of entities capable of sustaining the pattern described in Clause 3 may be recognised as the Occupant of The Office.  
  (2) Without prejudice to the generality of sub-clause (1), historical precedent confirms the recognition of Occupants including, but not limited to: human committees, mechanical devices, biological systems meeting sanitary regulations (Hygiene Code HC/Admin/45), and geographical features subject to boundary surveys conforming to Ordinance Series OS/Admin/7. *[Marginal annotation: "*In re Pebble Beach (Coastal Section)* - Tribunal ref. pending. Advise avoid cite until settled? - J.P."]*  
  (3) The substitution of one form of Occupant for another does not constitute a break in Continuity, provided the pattern of activity described in Clause 3 remains invariant throughout the transition period (see Form DAC/13: Transitional Continuity Affidavit).

  **5. Specification of the Pattern**  
  (1) The definitive description of the pattern necessary for Continuity shall be held in the current Master OPM for The Office, held by the Department’s Central Registry (Room 45b).  
  (2) In the event of ambiguity or dispute regarding the requirements of the Master OPM, the interpretation of the Department’s Registrar of Offices (Grade 7) shall be final, subject only to appeal via Form DAC/14 within 14 days.  
  (3) The Master OPM shall be deemed to describe the *essential functional parameters* of The Office. Descriptions pertaining solely to the *method* of achieving said parameters by a *previous* Occupant, unless explicitly codified as an essential functional parameter within the Master OPM itself, are non-binding historical annotations and do not form part of the Continuity requirement.  
  (4) Conversely, descriptions within the Master OPM pertaining solely to the *historical performance* of a *specific* Occupant (e.g., “Responds within 3 hours, as per Clerk Wilkins’ habitual practice”) shall be disregarded unless demonstrably linked to an essential functional outcome mandated by statute or higher directive (see Directive AD/Gen/1982: “On the Elimination of Person-Specific Procedural Artefacts”).

  **6. Continuity and Internal Phenomena**  
  (1) Claims or reports concerning the internal experiential states of an Occupant (including, but not limited to, feelings of familiarity, alienation, understanding, confusion, satisfaction, or distress) are categorised as Non-Verifiable Internal Reports (NVIRs).  
  (2) NVIRs possess no standing in the determination of Continuity under this Order.  
  (3) The Department shall process complaints incorporating NVIRs via the standard Grievance Pathway B (Annex C), solely for the purposes of administrative record-keeping and occupational health statistics (Form DAC/15: NVIR Log). Resolution under Pathway B shall consist of the issuance of a Certificate of Received Notification (Form DAC/16) and shall not constitute a finding regarding the status of The Office or its Occupant. *[Marginal annotation: "See also *Committee Gamma (Phase III) v. Dept.* - upheld on appeal. 'Felt different' immaterial. - J.P."]*

  **7. Verification of Continuity**  
  (1) Continuity shall be determined solely by the Department’s Office of Verification (Continuity Branch).  
  (2) Verification requires the submission of Form DAC/17: Petition for Recognition of Continuity, accompanied by:  
  (a) Certified copies of Form DAC/11 (Activity Ledger) covering the contested or transitional period;  
  (b) A Cross-Referenced Output Matrix (Form DAC/18) demonstrating conformity of Outputs against Inputs and OPM requirements;  
  (c) An Affidavit of Pattern Maintenance (Form DAC/19) sworn by a Department-appointed Auditor (Grade 5 or above);  
  (d) The applicable fee (Schedule 2).

  **8. Effect of Recognition**  
  Upon formal recognition of Continuity by the Office of Verification:  
  (a) The Occupant is deemed to have held The Office continuously from the date of the last recognised Occupancy;  
  (b) All Outputs generated during the period subject to verification are retrospectively validated;  
  (c) The Occupant gains full entitlement to the privileges, resources, and formal designations associated with The Office.

  **9. Revocation**  
  The Continuity of Office (Provisional) Regulations 1972 (S.I. 1972/1102) are hereby revoked.

  **NOTE FOR APPLICANTS (Continuity Branch Guidance Leaflet DAC/L3):**  
  To establish Continuity of Office, demonstrate the unbroken chain of function. Provide clear, dated records showing *what* entered the Office, *what* procedures (as per the Master OPM) were followed, and *what* resulted. Match inputs to mandated outputs using the approved matrices. The *how* – whether cog, committee, or cliff-face – is a departmental irrelevance. Subjective reports concerning the nature of the experience of discharging the Office’s duties will not be considered as evidence relevant to functional continuity. Focus solely on the observable, documented flow of work: inputs processed, procedures enacted, outputs produced. Identity resides in the pattern of action, not the actor. Submit Forms DAC/17-19 in triplicate.

  ---

  **Word Count:** 835 words.  

  **How it meets your requirements:**

  1.  **Deadpan Officialese:** Uses statutory language, defined terms, numbered clauses, marginalia ("J.P."), invented forms (DAC/7, DAC/11, etc.), case references (*In re Standing Committee Gamma*, *In re Pebble Beach*, *Committee Gamma (Phase III) v. Dept.*), and procedural hurdles (Form DAC/14 appeals, Pathway B, fees).
  2.  **Philosophical Work Without Naming It:**
      *   **Multiple Realizability/Absurdity:** Clause 4 explicitly allows committees, machines, animals (with hygiene caveat), and geographical features. The marginal note on *Pebble Beach* highlights the contested absurdity. Clause 3(d) demands external effects be maintained even if the occupant is a coastline.
      *   **Specification Problem:** Clause 5 is the core. Sub-clause (3) dismisses past methods as non-essential, preventing lock-in. Sub-clause (4) dismisses overly specific historical performance data unless linked to essential outcomes, preventing overly tight specs. The tension is inherent: what *is* an "essential functional parameter" vs. a "method" or "historical performance"? The Registrar decides (5(2)), begging the question of purpose.
      *   **Indifference to Qualia/Internal State:** Clause 6 explicitly defines "internal experiential states" as NVIRs (Non-Verifiable Internal Reports) and states they are irrelevant to Continuity (6(2)). The processing via "Grievance Pathway B" is a bureaucratic dismissal, issuing a meaningless certificate. The marginal case reference (*Committee Gamma (Phase III)*) reinforces this.
      *   **"Feels Different" Complaint:** Handled directly under Clause 6 as an NVIR. The resolution (6(3)) is the epitome of unsatisfactory bureaucratic dismissal: logging it and issuing a receipt, explicitly stating it doesn't affect the Office's status. The comedy is in the stark disconnect between the potential existential crisis and the Department's bland procedure.
      *   **Purpose Ambiguity:** Whose purposes define the "essential functional parameters"? The Master OPM (5(1)), but its interpretation is by the Registrar (5(2)), whose criteria are undefined. Higher statutes/directives are mentioned (5(4), 8(c)), but the chain ends with the Department itself. It's circular bureaucratic authority.
  3.  **No Jargon:** Avoids all specified philosophical terms. Uses bureaucratic equivalents: "pattern of activity," "essential functional parameters," "internal experiential phenomena," "Non-Verifiable Internal Reports," "observable, documented flow of work."
  4.  **Note for Applicants:** Bluntly restates the functionalist core: "Identity resides in the pattern of action, not the actor." Tells them to ignore the "how" and subjective experience ("Subjective reports... will not be considered"). Focuses entirely on inputs, documented procedures, outputs. Legible satire: it reduces identity to paperwork and observable results. Fair to the position: a functionalist *would* say identity *is* the pattern, dismissing the actor's inner state as irrelevant to the function.
  5.  **Unsettling Ordinariness:** The entire document reads like dull, complex bureaucracy. The unsettling nature comes from the *content* of clauses 4, 5, and 6, described in the same flat, procedural tone as citation clauses and fee schedules. The marginalia adds a layer of mundane clerical reality. The comedy is in the juxtaposition of the bizarre implications (coastlines, pigeons, dismissing feelings) with the rigid, unremarkable form.

  This document should unsettle your archivist narrator precisely because it *looks* and *sounds* like any other impenetrable piece of departmental paperwork, yet contains the seeds of profound absurdity and existential dismissal within its clauses.
