answer: |-
  **How can a non-office-based account of corruption resolve the universality debate in anti-corruption theory by diagnosing allocative-logic mismatches, and what practical tool might this yield?**  

  The debate over whether Western anti-corruption standards are universal remains deadlocked between universalists (who see office-based impartiality as globally applicable) and cultural-relativists (who argue norms like gift-giving or reciprocity invalidate Western definitions). Both presuppose corruption requires a depersonalized "office"—a role with abstract duties—and dispute only whether this concept transfers across contexts. This impasse persists because ethnographies reveal societies where no such office exists: exchanges operate via personalized logics incompatible with office-based frameworks, rendering the universality quarrel circular.  

  I propose corruption arises not from violating an office, but from a *mismatch* between an institution’s publicly avowed allocative logic and the logic actually governing resource distribution. Three ideal-typical logics structure allocation: *queue* (distribution by order, need, or pre-set rules), *ledger* (reciprocal exchange of debts/obligations), and *gift* (relationship-constituting transfers independent of the good’s value). Corruption occurs when the operative logic contradicts the avowed one—e.g., a nurse prioritizing kin (ledger/logic mismatch in a queue-avowing clinic) is corrupt, while a patron distributing roofing sheets pre-election (avowed and actual ledger logic) may be clientelist but not corrupt. This reframes universality: it asks whether institutions *everywhere* avow a logic, not whether offices exist universally. It avoids relativism by treating impartiality (queue logic) as one avowable option among others, not a presupposed norm. Crucially, it resolves cases where gift-giving intends outcomes but isn’t avowed: if an institution avows queue logic but a bribe is given (ledger logic), it’s corrupt; if both parties avow ledger logic (e.g., acknowledged reciprocity), it may be non-corrupt clientelism.  

  **Method (6 Months, Theory-Only):**  
  - *Month 1:* Synthesize ethnographic critiques of office-based corruption (e.g., Nuijten, Gupta) to catalog cases where allocative logics conflict with avowals.  
  - *Month 2:* Analyze universalist/relativist arguments (e.g., Rothstein, Persson et al. vs. Olivier de Sardan, Bukovansky) to isolate how they presuppose offices.  
  - *Month 3:* Formalize the three logics using distributive justice theory (e.g., Walzer’s spheres) and gift anthropology (e.g., Mauss), defining mismatch conditions.  
  - *Month 4:* Test the framework against ambiguous cases (e.g., "gifts" in bureaucratic settings; clientelist campaigns) to refine logic boundaries.  
  - *Month 5:* Develop a practitioner coding rule for surveys, operationalizing logic mismatches via respondent-reported avowals vs. observed behaviors.  
  - *Month 6:* Draft paper and validate coding rule against existing datasets (e.g., Afrobarometer) to assess impact on corruption indices.  

  **Possible Conclusions & Deciding Factors:**  
  1. *Mismatch theory fully resolves universality:* If cross-cultural cases show all institutions avow *some* logic (e.g., queue in bureaucracies, ledger in patronage systems), universality becomes about avowal consistency, not office transfer. *Decider:* Ethnographic evidence confirms avowals exist universally.  
  2. *Theory requires office-logic hybrid:* If "avowal" implicitly invokes office-like duties (e.g., queue logic assumes impersonal roles), the critique collapses. *Decider:* Whether avowals can be documented in non-office contexts (e.g., kinship networks).  
  3. *Mismatch theory is contextually limited:* If most societies avow multiple conflicting logics, "mismatch" loses analytical clarity. *Decider:* Data on consistency of institutional avowals across settings.  

  **Limitations:** Six months is insufficient for global case coverage or statistical validation; the framework risks over-simplifying mixed-logic contexts.  

  **Practitioner Deliverable:** A survey coding rule classifying exchanges as corrupt (avowed-actual logic mismatch), clientelist (avowed-actual ledger match), or gift-based (avowed-actual gift match). *Improvement over indices:* Current tools (e.g., CPI) conflate clientelism with corruption, over-penalizing societies where ledger logic is legitimate. This rule isolates true corruption (mismatch), refining measurement validity.  

  **Normative Dimension:** For the philosopher: This is inherently normative because diagnosing "mismatches" presumes institutions *should* align practice with avowed principles—a claim about legitimacy. It also evaluates which allocative logics merit public endorsement, engaging debates on pluralism and justice.
