answer: |-
  Here's a breakdown of your proposed criteria for an ontology identification method, analyzing their necessity, potential biases, tensions, and exclusionary power:

  ### Your Candidate Requirements & Their Status

  1.  **Must distinguish electrons from phlogiston (successful vs. discarded unobservables):**
      *   **Genuine & Non-Negotiable?** **Yes, but with nuance.** This is a core test case. Any viable method *must* be able to explain why mature scientific theories *warrant* ontological commitment to entities like electrons (even if ultimately revised), while phlogiston does not, despite both initially "saving the appearances." The nuance is that the method might explain this *without* guaranteeing electrons are *ultimately real* (see point 4). Failure here suggests the method cannot handle scientific progress or differentiate well-supported posits from ad-hoc ones. It rules out extreme instrumentalism/constructive empiricism that sees *all* unobservables as merely convenient fictions.

  2.  **Must give the same verdict regardless of the *scale* of the inaccessible region (coin under cup vs. beyond cosmic horizon):**
      *   **Genuine?** **Yes.** This tests the *principle* of the method. If the scale of inaccessibility changes the ontological verdict (e.g., "coin exists but galaxies beyond the horizon don't"), it reveals an arbitrary epistemic bias rather than a principled ontological distinction. The nature of the inaccessibility (practical vs. principled) might matter, but the *mere size* of the hidden region shouldn't.
      *   **Potential Reflex?** **Slightly.** A strict verificationist might *want* scale to matter (dismissing larger inaccessibles as meaningless), but your requirement correctly identifies this as a flaw. It specifically targets epistemic-based ontological collapse.

  3.  **Cannot collapse "we can't tell" into "there's nothing" (respect undetectable differences):**
      *   **Genuine & Non-Negotiable?** **Absolutely.** This is the core defense against verificationism and premature ontological deflation. The method must recognize that a theory can be *genuinely committed* to entities or structures in inaccessible domains *even if* their existence/non-existence or specific nature is forever unknowable. It forces the method to account for *what the theory says*, not just what we can verify. This is fundamental and rules out verificationist/operationalist approaches.

  4.  **Must distinguish a theory's *ontological commitments* from *what is actually real*:**:
      *   **Genuine?** **Crucially Yes.** This is meta-ontological hygiene. The method's primary job is to *extract commitments* from the theory/practice. Judging *actual reality* requires additional metaphysical or epistemological arguments *beyond* mere commitment-identification. Conflating them risks building metaphysical assumptions (e.g., realism) directly into the identification method itself.
      *   **Potential Reflex?** **Possibly.** A naive realist might *want* the method to deliver reality, but separating commitment from reality is essential for clarity and avoiding question-begging. It allows the method to be used by realists, anti-realists, and agnostics alike to *identify what is being claimed*.

  5.  **Must specify its input (formal theory, research program, practice):**
      *   **Genuine & Non-Negotiable?** **Yes.** This is foundational pragmatics. Real science isn't always fully formalized. A method relying solely on syntactic quantification (like Quine's criterion) fails for theories expressed in practice, through models, approximations, or engineering success. The method needs to define what "text" it's reading the ontology from. Failure here makes the method inapplicable to vast swathes of actual scientific reasoning.

  ### Key Tensions & Conflicts

  1.  **"Accessible Evidence Fixes Verdict" vs. "Verdict is Unique & Determinate":**
      *   **Conflict:** **Yes, they come apart dramatically.** This is the heart of *radical underdetermination*.
      *   **The Case:** Consider two global theories, T1 and T2. They are *empirically equivalent*: they agree perfectly on *all* observable consequences within the accessible domain (past, present, and future). However, they posit *fundamentally different and incompatible ontologies* for the inaccessible domain (e.g., beyond the horizon, pre-Big Bang, untraceable events). T1 says region R contains entity E with property P. T2 says R contains entity F with property Q, or is empty, or has a different spacetime structure.
      *   **The Clash:**
          *   If the verdict is *fixed solely by accessible evidence*, then T1 and T2 must have the *same* ontological commitments regarding R, because the evidence is identical. This might mean committing only to what the evidence entails for R (perhaps just its causal influence on the accessible, which is identical for T1/T2), or declaring ontological agnosticism about R's intrinsic nature.
          *   If the verdict must be *unique and determinate*, then T1 and T2 *must* have different ontological commitments regarding R, reflecting their different internal descriptions. The method must find a way to privilege one description as "the real commitment" despite the empirical equivalence.
      *   **Resolution Impossible?** Satisfying both simultaneously requires either denying radical underdetermination is possible (controversial) or adding non-evidential criteria (e.g., metaphysical simplicity, elegance) to break the tie, which moves beyond pure ontological *identification* based on the theory/evidence and into *justification* or *interpretation*. This tension is fundamental.

  2.  **"Distinguish Commitments from Reality" vs. "Don't Collapse Undetectable to Nothing":**
      *   **Potential Conflict:** Less direct, but arises if the method for identifying commitments *itself* relies on a specific metaphysical view (e.g., realism). Point 4 guards against this. Point 3 prevents deflation. A method satisfying both 3 and 4 can identify a commitment to, say, untraceable events without asserting they *must* exist (realism) or *can't* exist (verificationism).

  ### Exclusionary Power & Non-Negotiables

  *   **Most Exclusionary Requirement:** **#3 (Cannot collapse "can't tell" into "nothing").** This immediately eliminates all forms of strict verificationism, operationalism, and certain flavors of empiricism or instrumentalism that define existence solely in terms of measurable effects. It's the strongest filter.
  *   **Core Non-Negotiables:**
      1.  **#1 (Electrons vs. Phlogiston):** Essential to capture scientific practice and progress.
      2.  **#3 (No Verificationist Collapse):** Essential for taking theoretical content seriously beyond observables.
      3.  **#5 (Specify Input):** Essential for practical applicability to real science.
  *   **Highly Desirable, Perhaps Borderline Non-Negotiable:**
      *   **#2 (Scale Invariance):** While logically compelling as a test of principle, a method *might* survive without it if it provided excellent justification for why scale *should* matter ontologically (though this seems difficult without reverting to verificationism). Strongly points to flaws if violated.
      *   **#4 (Commitment vs. Reality):** Essential for methodological clarity and avoiding built-in metaphysics. A method conflating them is flawed at a foundational level.

  ### Summary of Key Tensions & Requirements

  | **Requirement** | **Genuine?** | **Non-Negotiable?** | **Tension With** | **Exclusionary Power** |
  |-----------------|--------------|---------------------|------------------|------------------------|
  | **1. Distinguish electrons/phlogiston** | Yes | Yes | Weak verificationism | Rules out instrumentalism |
  | **2. Scale-invariant verdict** | Yes | Highly desirable | Strict verificationism | Tests epistemic bias |
  | **3. No "can't tell" → "nothing"** | Yes | Absolutely | Verificationism | Strongest filter |
  | **4. Separate commitment from reality** | Yes | Yes | Naive realism | Ensures meta-ontological hygiene |
  | **5. Specify input scope** | Yes | Yes | Syntactic-only approaches | Critical for applicability |

  **The Core Conflict:** The fundamental tension lies between **evidence-based determination** and **demanding unique ontological answers** in the face of radical underdetermination (inaccessible domains). **#3 (No Collapse)** and **#1 (Electrons/Phlogiston)** are the most robust non-negotiable requirements, directly addressing the core problem of inaccessible information and scientific practice. **#5 (Input)** is essential for the method to be usable. **#4 (Commitment/Reality)** ensures the method stays focused on its core task. **#2 (Scale)** is a powerful test for consistency but slightly less fundamental. Any viable method must navigate the tension between evidence and uniqueness without resorting to verificationism (#3) and while explaining scientific success (#1).
