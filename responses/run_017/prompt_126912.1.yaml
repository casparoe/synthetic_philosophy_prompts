answer: |-
  ### (a) Reading: Run Lola Run and Models of Contingency

  *Run Lola Run* masterfully explores contingency but resists being neatly confined to a single model (Amplification, Basin-switch, Severing). Instead, it uses its unique tripartite structure to interrogate them and ultimately foregrounds agency, cinematic form, and existential choice over pure chaotic determinism.

  *   **First Run: Severing/Amplification Blend:** The initial delay on the stairs (Manni's hesitation, Lola's stumble) *severs* Lola's chance encounter with the boy and his dog on the stairs. This seemingly minor event cascades through amplified interactions: arriving seconds later at the bank alters her father's reaction, leading to the robbery and her death. The outcome feels like an unpredictable path opened by an initial severing event, amplified chaotically through subsequent encounters (the Frau Jäger encounter timing, the ambulance route). The system appears open-ended initially.
  *   **Second Run: Basin-Switch:** The slight variation (Lola avoids the boy/dog, vaults the banister) positions her differently in subsequent encounters. The key moment is her earlier arrival at the bank. This doesn't sever a path but *tips* her father's precarious emotional/ethical state (already distressed by his mistress's pregnancy) into a different pre-existing basin: firing her and triggering his own breakdown/collapse. Lola then proceeds along a different, but seemingly pre-scripted, path ending in Manni's death. The outcomes feel like distinct attractor states the system could fall into based on tipping points.
  *   **Third Run: Beyond Models - Agency & Narrative Intervention:** The most significant change isn't chaotic but deliberate: Lola *chooses* to scream at the casino roulette wheel. This isn't a microscopic perturbation amplifying; it's a massive injection of willpower and agency that defies probability (winning big). This act transcends the previous deterministic chains. She avoids the bank entirely, arrives *just* in time to save Manni, and Manni recovers the money himself. The outcome feels "earned" through her proactive force of will, not propagated chaotically from a tiny difference. The film shifts from illustrating contingency to demonstrating how *action* can reshape fate.

  **Resisting the Framework:**
  *   **Flash-Forward Stills:** These snapshots of bystanders' futures explicitly break the "controlled re-run" premise. They inject deterministic, often fatalistic, narratives disconnected from Lola's immediate actions. They suggest preordained paths exist *alongside* chaos, undermining the purity of any single contingency model. They belong to a different narrative logic – one of fate, karma, or authorial design.
  *   **The Blind Woman:** She acts as an oracle, seemingly aware of the "game" Lola is playing ("The ball is round..."). Her presence introduces a metaphysical layer, implying a structure or awareness beyond the chaotic system Lola navigates. She represents an external perspective that resists the idea of pure, undirected chaos.

  **Counterfactual History & Sensitivity:** The film *uses* the extreme sensitivity of the "for-want-of-a-nail" scenario as its core mechanic for the first two runs, dramatically visualizing how minuscule changes cascade. However, by granting Lola the "re-run," it highlights the *impossibility* of testing historical counterfactuals – we only see one timeline. More crucially, the *third run* implicitly critiques counterfactuals relying solely on chaotic sensitivity; it argues that decisive human action (the scream) can fundamentally alter the system's rules and potential outcomes, something deterministic models struggle to incorporate. The film doesn't just assume sensitivity; it uses it as a setup to ultimately move beyond it.

  ### (b) Analysis Table

  | Beat                                          | Best-fit model | What that model predicts here                                                                 | What the film actually does with the beat                                                                 | Fit            | Why                                                                                     |
  | :-------------------------------------------- | :------------- | :-------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- | :------------- | :-------------------------------------------------------------------------------------- |
  | **Lola's stumble vs. clean vault (Stairs)**   | Amplification  | Tiny difference (stumble delay) chaotically amplifies, leading to vastly different outcomes. | First run: stumble leads to robbery/death. Second run: vault leads to different encounters/bank outcome. | **Holds**      | The initial temporal difference demonstrably cascades through subsequent events.        |
  | **Frau Jäger's car crash timing (Run 2)**     | Basin-Switch   | Slight timing difference tips Frau Jäger into a pre-existing "crash" state.                   | Lola's earlier arrival causes Frau Jäger to crash, altering Lola's path significantly.                   | **Partly Holds** | The crash is a tipping point, but its *existence* as an attractor feels narratively imposed. |
  | **Lola's scream at Roulette (Run 3)**         | **None of them** | N/A (Models predict chaotic propagation or tipping, not willful intervention).                | Lola injects massive, improbable agency via the scream, fundamentally altering her strategy and success. | **Resists**    | This is a deliberate act of will breaking deterministic chains, not passive propagation. |
  | **Flash-forward: Homeless Man wins lottery** | **None of them** | N/A (Models concern immediate causal chains, not predetermined futures).                     | Shows a fixed, prosperous future for the man, unrelated to Lola's immediate actions in any run.          | **Resists**    | Imposes a fixed, deterministic future narrative independent of the contingent system.     |
  | **The Blind Woman's cryptic comment**         | **None of them** | N/A (Models are mechanistic, not metaphysical).                                               | Suggests awareness of Lola's repeating timeline ("The ball is round... a game...").                     | **Resists**    | Introduces a perspective implying structure/fate beyond the chaotic system.              |

  ### (c) Verdict

  **Verdict:** Yes, *Run Lola Run* belongs on the syllabus, primarily to *dramatize the mechanics and limitations of "for-want-of-a-nail" counterfactuals, explore the tension between chaotic contingency and human agency, and expose how cinematic form itself shapes our understanding of possibility.*
