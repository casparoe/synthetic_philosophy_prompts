  Least confident about causal-history (0.3). If shown evidence that causal chains fundamentally underpin consciousness (e.g. quantum brain theories), I'd raise that to 0.6. 

  Threshold drops below 0.5 at f=0.7 - vague because different psychological attributes degrade unevenly. The 0.85 vs 0.35 disagreement likely centers on whether physical duplication suffices (user) or causal history is essential (friend). 

