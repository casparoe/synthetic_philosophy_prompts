  The sphexometer problem about AI might be less critical - a defender could bite that bullet by accepting AI might be "freer" on this metric. Similarly, human sphexishness data might be handled by conceding humans are less flexible than assumed.

  The meta-sphexishness challenge seems deep - if any apparent flexibility can be simulated through meta-routines, the distinction collapses. But perhaps this is a limit of operationalization rather than a fatal flaw.

