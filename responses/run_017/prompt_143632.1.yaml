answer: |-
  Below is a complete game design for your onboarding session, incorporating your mechanics into a cohesive experience. The game is designed for 4 tables, 6 rounds, and uses fictional causes to avoid real-world biases.

  ---

  ### **Game Title**: The Impact Paradox  
  **Objective**: Maximize your table's "impact points" within 6 rounds.  
  **Core Tension**: The standard ITN framework breaks when faced with dynamic funding, hidden thresholds, and time constraints.  

  ---

  ### **Materials**  
  1. **Cause Cards** (5 total, laminated for reuse):  
  2. **Budget Tokens**: Each table gets 6 × $100 (one per round) in colored tokens.  
  3. **Almanac Whiteboard**: Updated by facilitator.  
  4. **Auditor's Note**: Handed to tables in Round 3.  
  5. **Scoring Tally Sheet**: For facilitator to track points.  

  ---

  ### **Cause Cards** (Fictional Causes)  
  *(Impact points per $100 invested, unless noted)*  

  | Cause                | Round 1-2 Impact | Round 3+ Impact | Special Rules |  
  |----------------------|------------------|-----------------|--------------|  
  | **Skyseed Cloudbanks** (Lumpy) | 0               | 0               | **Threshold**: If $300+ invested *in one round*, unlocks 1,000 pts split *proportionally* among investors. Fails if threshold missed. |  
  | **Timestone Archives** (Long-term) | 0               | 0               | **Matures in 2 rounds**: Invest $100 in Round X → 500 pts in Round X+2. *Only counts if impact realized by Round 6*. |  
  | **Rootweave Networks** (Field Builder) | 100             | 100             | **Multiplier**: Every $100 invested boosts *all other causes'* impact by 20% next round (e.g., $200 → +40% next round). |  
  | **Emberfly Sanctuaries** (Neglectedness Trap) | 150             | 150             | *No special rules* (Almanac lag creates misperceptions). |  
  | **Riverlight Tutors** (Additionality) | 300             | 150             | **Auditor's Note (Round 3)**: "50% of impact would have happened without you." Impact drops to 150. |  

  ---

  ### **Game Setup**  
  - **Duration**: 90 minutes (60 min gameplay + 30 min debrief).  
  - **Whiteboard Setup**:  
    - Columns: Round 1–6  
    - Rows: Causes A–E + "Total Funding"  
    - **Almanac Rule**: Funding data posted *one round late* (e.g., Round 1 funding visible at *start* of Round 3).  
  - **Scoring Rule**: **Only impact realized *by Round 6* counts**. Long-term payoffs after Round 6 = 0.  

  ---

  ### **Round-by-Round Flow**  
  | **Round** | **Time** | **Facilitator Actions** | **Tables Do** |  
  |-----------|----------|-------------------------|--------------|  
  | **Intro** | 0–10 min | Explain rules, distribute cause cards. Emphasize: "Maximize points by Round 6." | Ask questions. |  
  | **1**     | 10–15 min | No almanac. Write "Round 1" on board. | Allocate $100 across causes. |  
  | **2**     | 15–20 min | No almanac. Announce: "Rootweave multiplier for Round 2: +0% (no prior investment)." | Allocate $100. |  
  | **3**     | 20–30 min | **Post Round 1 almanac. Hand out Auditor's Note for Riverlight.** Announce Rootweave multiplier (based on Round 2 investment). | Allocate $100. |  
  | **4**     | 30–35 min | Post Round 2 almanac. Announce Rootweave multiplier. | Allocate $100. |  
  | **5**     | 35–40 min | Post Round 3 almanac. Announce Rootweave multiplier. | Allocate $100. |  
  | **6**     | 40–45 min | Post Round 4 almanac. Announce Rootweave multiplier. | Allocate $100. |  
  | **Scoring**| 45–60 min | Calculate final scores. Announce table ranks + total group impact. | Review choices. |  

  ---

  ### **Scoring Example**  
  *(Per table, per round)*  
  1. **Skyseed (Lumpy)**: If total funding = $320, and Table 1 invested $80:  
     `Points = (80 / 320) × 1,000 = 250 pts`.  
  2. **Timestone (Long-term)**: $100 invested in Round 3 → 500 pts in Round 5.  
  3. **Rootweave (Multiplier)**: $50 invested → 50 pts + 20% boost to *other causes* next round.  
  4. **Emberfly/Riverlight**: $30 invested at 150 pts/$100 → `30 × 1.5 = 45 pts`.  
     *(With 20% multiplier: `45 × 1.2 = 54 pts`)*.  

  **Key**: Track Rootweave’s multiplier for the *next* round. Use pre-calculated lookup table for speed:  
  | $ Invested in Rootweave | Next Round Multiplier |  
  |--------------------------|----------------------|  
  | $0–99                    | +0%                  |  
  | $100–199                 | +20%                 |  
  | $200+                    | +40%                 |  

  ---

  ### **Predictable Breakdowns & Mitigation**  
  1. **Lumpy funding fails**: Tables underfund Skyseed early, assuming others will chip in. By Round 6, they panic-invest but can’t coordinate $300.  
     *Mitigation*: Secretly hint to one table: "Skyseed has a ‘use it or lose it’ window."  

  2. **Long-term neglect**: Timestone gets 0 investment until Round 4, but Round 4–5 investments yield 0 (mature post-Round 6).  
     *Mitigation*: Announce after Round 3: "Remember: Timestone takes 2 rounds to pay off."  

  3. **Multiplier underuse**: Rootweave is consistently underfunded because its diffuse payoff isn’t "owned" by any table.  
     *Mitigation*: Praise tables that invest in Rootweave early: "Table 2’s Round 1 investment just boosted everyone’s Round 2 impact!"  

  4. **Almanac missteps**: Tables chase "neglected" Emberfly in Round 3 (reacting to low Round 1 almanac data), but Round 2 data (revealed in Round 4) shows it was already funded.  
     *Mitigation*: Ask during debrief: "Why did Emberfly funding spike in Round 3?"  

  ---

  ### **Debrief Framework**  
  *(30 min; link game pain points to ITN failures)*  

  | **Game Moment**             | **ITN Failure**                          | **Vocabulary Handoff** |  
  |-----------------------------|------------------------------------------|------------------------|  
  | Skyseed threshold missed    | Lumpy gaps break marginal ITN math.      → "Absorption capacity" |  
  | Timestone Round 6 waste     | ITN ignores time horizons/discount rates. → "Option value" |  
  | Rootweave underinvestment   | Diffuse future payoffs deprioritized.    → "Field building" |  
  | Emberfly funding spikes     | Neglectedness data is stale/dynamic.     → "Crowding in" |  
  | Riverlight impact drop      | Headline stats include non-additional work. → "Funging" |  

  **Sharp Participant Reply**:  
  > *"But gaming the scoring rule (e.g., defunding Timestone after Round 4) was optimal!"*  

  **Response**:  
  > "Exactly. The scoring rule was a **proxy** for impact, just like ITN is a proxy for real-world good. But proxies can lie. In reality, we must ask: ‘What horizon are we optimizing for? Who decides?’ ITN doesn’t answer that—*we* do."  

  ---

  ### **What the Game Can’t Teach (Just Tell Them)**  
  1. **No almanac in reality**: Estimating scale/tractability requires navigating noisy, conflicting evidence.  
  2. **Hidden assumptions**: ITN silently embeds values (e.g., near-term vs. long-term impact weights).  
  3. **Non-fungibility**: Money isn’t always fluid (e.g., restricted grants, organizational capacity).  

  ---

  ### **First-Run Risks**  
  - **Scoring slowdown**: Use a pre-printed multiplier cheat sheet. Round 1–2 will be slow; Rounds 3–6 faster.  
  - **Coordination failure**: If Skyseed never funds, acknowledge it: "This happens in real philanthropy too!"  
  - **Overinvestment in Riverlight early**: Intended! Auditor’s note makes the drop visceral.  

  --- 

  This design forces players to confront ITN’s blind spots through gameplay, then gives them precise vocabulary to articulate why. The scoring is lightweight (no spreadsheets), and the debrief maps "aha" moments to professional concepts. Run it as-is, and you’ll have them arguing about discount rates by lunchtime.
