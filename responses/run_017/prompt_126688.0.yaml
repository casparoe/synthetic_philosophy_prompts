prompt: |-
  I'm a journalist covering science and ideas, and a style-guide fight at our newsroom pushed me into a question I can't settle on my own: what rule am I actually applying when I say it's fine to put a claim in the paper and not fine to put it in a tweet, or fine for the outlet to say something that no individual reporter would be allowed to say? I've tried listing my own verdicts, going by gut, and they don't arrange themselves neatly. Checking the airline app, which I know is right maybe ninety-seven times out of a hundred, and telling my taxi driver the flight leaves from B12: fine. Telling a friend who is holding a ticket that you're not going to win, where the odds are incomparably better: not fine, and I feel it's not fine even though the number is on my side. Writing, on the word of a source I trust and cannot myself evaluate, that the replication failed: fine, even though I couldn't reconstruct a single step of the statistics. Saying the same sentence as an expert witness under oath: not fine. Our masthead saying the minister is expected to resign, where three reporters each hold a fragment and no one has the whole: fine, and sometimes obligatory; the individual reporter saying the minister will resign: not fine. A press officer reading out a statement she privately believes is false: not fine, but it registers to me as a different and lesser wrong than a friend lying to my face, and I can't articulate the difference. Telling a soaked colleague that it's raining: weird, but not a violation of anything. Asserting something true to an audience I know will hear it as licence for something false: not fine, though I suspect here I'm blaming the norm of assertion for what is really a norm about consequences. And then there is the one that feels like the hardest datum: I cannot say, even silently, the story will run tomorrow, but I don't know that it will — the thing jams before it gets out. My own candidate, which the style-guide fight produced, is a two-part rule: you may assert p only if you could answer "how do you know?" without bluffing, and the grounds that would satisfy that question in the pub must also be grounds you'd be willing to have scrutinized by whoever will act on it. I'd rather keep the replication/oath pair and the last datum than keep the app-versus-lottery asymmetry, if I have to choose.

  So: is there a principle, or a short list of serious candidates, that gets this pattern or nearly all of it — knowledge, true belief, justified belief, reasonable-to-believe, something audience-relative, something stakes-relative? Please state whichever principle you favour precisely enough that it generates verdicts, tell me which clause is doing the work in each of the cases above, and be explicit about which of my verdicts it forces me to abandon and whether the asymmetry I'm least attached to is really the one that has to go. Test my two-part rule against the cases and tell me whether it can be repaired or whether it collapses into one of the standard options. Then use whatever survives on three cases I haven't listed: an automated account of ours that posts the airport is open straight off a data feed, with no human who checked; a reporter asserting, in the paper's voice, a claim she believes on the word of a source she knows has lied in the past but not about this; and the one I keep returning to, our election-night projection, where the model puts a candidate at ninety-two per cent and someone has to decide whether we get to write that she has won.
reasoning: |-
  Okay, the journalist is dealing with a complex ethics and epistemology problem regarding when it's appropriate to make assertions in different contexts. They've provided several scenarios where they intuitively feel an assertion is acceptable or not, and want a unifying principle. 

  First, I need to fully understand all their examples. The key asymmetries are: 
  1. Trusting an airline app vs not telling a friend they'll lose the lottery
  2. Reporting unreplicated science vs testifying under oath 
  3. Organizational attribution vs individual reporter claims
  4. Press officer's false statement vs personal lie
  5. Trivial observations vs high-stakes implications

  Their proposed two-part rule has interesting features - requiring ability to answer "how do you know?" and willingness to have grounds scrutinized. But I notice it might be too restrictive for institutional knowledge cases.

  The lottery case is particularly tricky. Why does the airline app feel different? Probably because the stakes are lower for the taxi driver, while telling a friend they'll lose feels like robbing hope. This suggests contextual stakes matter more than probability alone.

  The replication/oath pair shows that epistemic standards must vary by social role. As a journalist, they're a conduit; as an expert witness, they're the source. This points toward a norms-of-social-roles approach.

  For the newsroom attribution case, the key seems to be distributed knowledge - the organization can know through collective evidence no single reporter possesses. This breaks traditional individualistic epistemology.

  The election projection at 92% is fascinating. It's not about certainty but about decision thresholds. News organizations have institutional procedures for this, not individual knowledge. The "she has won" declaration is a speech act with social meaning beyond probability.

  I think the journalist might be underestimating how much social context matters. Their two-part rule focuses on individual justification, but many cases involve institutional epistemology. Perhaps we need to separate personal warrant from role-based warrant.

  The silent jam when saying "the story will run" is telling. It suggests an internalized norm against self-deception. This feels different from external assertions - almost a Kantian consistency requirement.

  For the three new cases: 
  - The automated feed requires institutional trust mechanisms, not individual checking
  - The lying source case needs a distinction between prima facie justification and all-things-considered warrant
  - The election call is about conventional decision rules, not personal knowledge

  The solution might be a dual-track system: one set of norms for individual assertions, another for institutional speech acts. With role-based standards layered on top. The journalist's discomfort with abandoning the app/lottery asymmetry suggests stakes matter more than they acknowledge though.
answer: |-
  Your struggle captures a profound tension in assertion norms—one that pits epistemology against social practice. Your cases reveal that **no single factor** (knowledge, justification, stakes) suffices; instead, **assertion is governed by contextually variable standards of warrant**, where the *purpose of the speech act* and *social role of the speaker* calibrate the required threshold. Below, I defend a principle, test it against your cases, repair your rule, and apply it to your new examples.

  ---

  ### **The Principle: Role-Relative Warranted Assertion (RRWA)**
  **You may assert *p* only if:**  
  1. **Your warrant for *p* meets the epistemic standard demanded by your social role in the context;**  
  2. **Your assertion serves the function expected of that role.**  

  **Key elements:**  
  - **Warrant:** A gradient of justification (from statistical likelihood to firsthand proof).  
  - **Social Role:** Your position (journalist, friend, expert witness, institution).  
  - **Contextual Standard:** The stricter the role’s truth-tracking obligation or the higher the stakes of error, the stronger the warrant required.  
  - **Function:** Assertions must fulfill role-specific goals (informing, advising, testifying).  

  ---

  ### **Testing RRWA Against Your Cases**  
  | Your Case                          | RRWA Verdict & Mechanism                                                                                               | Outcome vs. Your Intuition |  
  |------------------------------------|------------------------------------------------------------------------------------------------------------------------|----------------------------|  
  | **Airline app → taxi driver**      | *Fine.* Role: Traveler. Standard: Reliable data (app). Function: Sharing logistical info. Warrant suffices for low-stakes context. | **Matches**                |  
  | **"You won't win" → friend**       | *Not fine.* Role: Friend. Standard: Near-certainty (odds irrelevant). Function: Protects hope/trust. Warrant inadequate for role. | **Matches**                |  
  | **Reporting failed replication**   | *Fine.* Role: Journalist. Standard: Reliable sourcing. Function: Conveying vetted claims. Warrant meets professional bar.        | **Matches**                |  
  | **Same claim under oath**          | *Not fine.* Role: Expert witness. Standard: Personal verification. Function: Sworn testimony. Warrant insufficient for role.    | **Matches**                |  
  | **Masthead: "Minister resigning"** | *Fine/Obligatory.* Role: Institution. Standard: Collective evidence. Function: News reporting. Warrant met by organizational process. | **Matches**                |  
  | **Reporter: "Minister resigning"** | *Not fine.* Role: Individual reporter. Standard: Direct evidence. Function: Individual accountability. Warrant fragmentary.      | **Matches**                |  
  | **Press officer's false statement**| *Not fine.* Role: Spokesperson. Standard: Sincerity. Function: Public trust. Warrant violated by insincerity (lesser wrong than friend's lie due to role's transactional nature). | **Matches** |  
  | **"It's raining" to soaked colleague** | *Fine.* Role: Colleague. Standard: Trivial observation. Function: Shared reality. Warrant obvious (no stakes).          | **Matches**                |  
  | **True claim implying falsehood**  | *Not fine.* Role: Communicator. Standard: Avoid foreseeable misuse. Function: Responsible discourse. Warrant undermined by context. | **Matches**                |  
  | **Silently thinking "story runs"** | *Not fine (jams).* Role: Journalist. Standard: Personal certainty. Function: Self-accountability. Warrant fails internal checkpoint. | **Matches**                |  

  **Asymmetry resolved:** The app/lottery asymmetry holds because *friend* demands higher warrant than *traveler*—roles dictate standards, not probability alone. **No verdicts abandoned.**

  ---

  ### **Repairing Your Two-Part Rule**  
  Your rule (*assert only if you can answer "how do you know?" without bluffing, and grounds withstand scrutiny*) is **mostly sound but incomplete**:  
  - 👍 **Strengths:** Captures anti-bluffing and scrutiny, aligning with RRWA’s warrant standards.  
  - 👎 **Gaps:**  
    1. Misses **role relativity** (e.g., masthead vs. reporter).  
    2. Ignores **assertion function** (e.g., press officer’s role permits no sincerity exemption).  
  3. Overlooks **institutional warrant** (e.g., election models).  

  **Repaired Rule:**  
  *You may assert p only if:*  
  - *(a) You can answer "how do you know?" in a way that satisfies the epistemic standard of your role;*  
  - *(b) The grounds would withstand scrutiny from those affected, given their stake in your role’s function.*  

  This **collapses into RRWA** but preserves your core insight.

  ---

  ### **RRWA Applied to Your New Cases**  
  1. **Automated airport feed posting "airport is open":**  
     - *Fine.* Role: Automated system. Standard: Direct data integration (warrant via system reliability). Function: Providing real-time status. Scrutiny falls on system integrity, not individual checking.  

  2. **Reporter asserting claim from source who lied (but not on this topic):**  
     - *Not fine.* Role: Journalist. Standard: Source reliability assessment. Function: Verifiable truth. Warrant insufficient—past lies raise red flags unmet by "not about this" (violates RRWA standard).  

  3. **Election-night projection at 92%: "Candidate has won":**  
     - **RRWA Verdict:** *Permissible, but only if institutionally vetted.*  
       - Role: News organization. Standard: Model confidence + historical accuracy. Function: Declaring winners via pre-set thresholds (92% > institutional cutoff).  
       - **Crucial:** The assertion is not "p = win" but "*our model concludes* win." This shifts warrant from absolute truth to institutional process.  
       - Individual reporter could **not** assert this—lacks institutional authority.  

  ---

  ### **Why This Works**  
  - **Solves replication/oath:** Roles (journalist vs. witness) demand different warrants.  
  - **Saves app/lottery:** Friend role imposes higher warrant than traveler role.  
  - **Handles election projection:** Institutional roles absorb statistical uncertainty via procedural warrant.  
  - **Clarifies press officer vs. friend:** Roles define the "wrong" (professional breach vs. personal betrayal).  

  **Final Verdict:** Your intuition aligns with **contextualist epistemology**—norms of assertion adapt to social practice. Abandoning the app/lottery asymmetry isn’t necessary; roles explain it. RRWA preserves all your verdicts while offering a scalable framework for newsroom guidelines.  

  The style guide’s fight might resolve by distinguishing **individual** (reporter) from **institutional** (masthead) assertions—each with distinct warrant thresholds. For the election call, the rule is simple: *If the model meets the org’s pre-audited standard for "win" declarations, assert it in the institution’s voice.* No individual "knows," but the system warrants the claim.
