  Okay, the user is a political philosopher specializing in global justice, focusing on reparations and duties to non-citizens. They need help reconciling their gut reactions to various cases with a consistent principle. Let me start by understanding their scenarios. They have 11 cases, each presenting a different aspect of what rich countries owe to poorer ones. The key is to find underlying principles that can accommodate most of their intuitions without contradictions.

  First, I need to brainstorm candidate principles. The user mentioned reparative, benefit-based, capacity-based, and possibly others. Let me list them:

  1. **Reparative Principle**: Focuses on rectifying past harms. This fits cases like (i) where colonial restitution is due. But it struggles with (ii) where there's no historical wrongdoing. Also, (vii) involves climate damage from lawful actions, which might not fit neatly into reparations for wrongdoing.

  2. **Benefit-Based Principle**: Obligations arise from unjust enrichment. This explains (iii) where rich countries benefit from trained nurses. However, it doesn't cover (ii) where no direct benefit exists. Case (xi) where past harmful aid creates a duty also doesn't fit here since no benefit was gained.

  3. **Capacity-Based Principle**: Focuses on ability to help. This addresses (ii) and (v) where need exists regardless of cause. But it conflicts with (vi) debt cancellation for irresponsible governments and (ix) where elites' wealth reduces obligations to the treasury but not to the poor.

  4. **Combined Principle**: Maybe a hybrid? The user's strong feelings in (xi) about past harm causing greater duty suggest a compensatory element. Also, the need to consider both harm and capacity in cases like (vii) climate change.

  The user's cases highlight tensions. For example, (v) has two scenarios: one where poor policies cause poverty and another where natural factors do. The user feels more duty in the latter, but also more sympathy for citizens under bad governments. A principle needs to reconcile this. Maybe focusing on enduring harm rather than assigning blame?

  Also, who is the claimant? In (i) and (iii), it's governments or systems, but in (ix), it's individuals. The beneficiary matters. The duty might be to the collective but owed to individuals when institutions fail. This links to routing around corrupt governments in (iv) and (x).

  Discharge method: In (iii), visas over cash. This implies the duty isn't just monetary but involves structural changes. Policy changes might be more effective than transfers, especially in systemic issues like brain drain.

  The upper-middle-income country with a space program and rural poor: here, capacity to help internally exists, so the duty might shift to domestic obligations. However, if past harms by rich countries contributed, reparations might still apply. But the user questions if the space program deepens the claim. Maybe not, if the focus is on current need and capacity.

  Building a principle: 
  - **Restitution for Enduring Harm**: Addresses (i), (viii), (xi). Historical harms that cause ongoing effects require restitution.
  - **Benefit Extraction**: For (iii), (viii). Unjust enrichment obligates returning benefits.
  - **Capacity-Based Rescue**: For (ii), (v). When harm isn't directly caused, but capacity exists to alleviate severe need.
  - **Subsidiary Individual Claimants**: When state-level claims are blocked (iv, ix, x), duties redirect to individuals via NGOs or direct aid.

  Testing with new cases:
  - **Reparations for Slavery**: Should rich countries pay? Restitution applies if ongoing harm exists. But if the recipient government is corrupt, funds go to civil society. This might embarrass the principle if the historical connection is distant.
  - **Refugee Support**: Capacity-based duty to take refugees, even without direct harm. This aligns with (ii) but might face political resistance.
  - **Climate Reparations for Historical Emitters**: Current rich countries pay regardless of past legality. This fits (vii) but may conflict with countries now emitting more. The principle focuses on contribution and capacity, so high current emitters might have reduced claims? But the user feels claims aren't diminished. Here, the capacity principle overrides, maintaining the duty.

  Inconsistencies:
  - Case (vi): Canceling dictator's debt fits restitution, but not canceling wasted debt by elected governments. The principle might require canceling both if the harm is systemic, but the user disagrees. Here, the elected government's responsibility might reduce the external duty, but the people still suffer. The principle prioritizes current need over past governance, so both debts should be canceled? But the user feels less obligation in the latter. Maybe the benefit principle: if lenders benefited from irresponsible loans, restitution applies. Otherwise, capacity-based aid might apply, not debt cancellation.
  - Case (vii): Poor countries with high emissions still have claims. The principle uses capacity and harm. Rich countries have higher capacity and historical contribution, so their duty remains despite the poor country's current emissions. This aligns with the user's intuition.

  Addressing the user's specific questions:
  1. **Claimant**: The bearer is the collective (state or system) for historical harms, but shifts to individuals when the state fails. In (ix), elites' wealth doesn't negate the poor's claim. Duty size depends on harm and need, not the claimant type.
  2. **Discharge Method**: Policy changes (e.g., visas) can be primary. Cash is secondary when policy isn't feasible. This explains (iii) and avoids ledger issues.
  3. **Upper-Middle-Income Country**: Duty is less if domestic capacity exists. The space program indicates capacity, so the claim is weaker unless past harms create restitution duties. The poor's need is addressed via domestic obligations, not global transfers. The existence of the space program doesn't deepen the claim; it might reduce it by showing state capacity.

  The user might resist giving up the verdict on elected government debt (vi). The principle suggests focusing on current need, so debt cancellation should apply if it alleviates severe hardship, regardless of past governance. The user should reconsider because the citizens' suffering is what matters, not the government's actions. Similarly, in (v), the duty to citizens under bad governments might be higher due to greater need, which the capacity principle supports. The user's sympathy aligns here, so adjusting the verdict on policy-caused poverty cases might be necessary.
answer: |-
  As a political philosopher specialising in global justice, I appreciate the complexity of your intuitions. After careful deliberation, I propose a **dual-principle framework** synthesising compensatory and capacity-based duties. This avoids over-reliance on any single rationale while honouring your most settled verdicts. Below, I outline candidate principles, their costs, the selected framework, its application to your cases, and responses to your three focal questions.

  ### Candidate Principles & Their Costs
  1. **Reparative Principle**: "States must redress *identifiable harms* they directly caused or unjustly benefited from."  
     - *Cost*: Forces you to abandon verdict (ii) (Nordic duty) and weaken (vii) (climate claims against historical emitters). It cannot ground obligations without causal responsibility.

  2. **Benefit-Based Principle**: "States must return *unjustly retained benefits* derived from others' disadvantage."  
     - *Cost*: Undermines (xi) (duty when aid backfires) as no benefit exists, and (ii) where no extraction occurs. Also conflicts with (v) on self-inflicted poverty – if elites benefited, must they repay?

  3. **Capacity-Based Principle**: "Affluent states must aid those in *grave need* where feasible, regardless of causation."  
     - *Cost*: Forces surrender of (vi) (no debt cancellation for elected governments' waste) and (i) (colonial restitution beyond need). It cannot explain why historical harm *adds* to duties.

  4. **Structural Justice Principle**: "Duties arise from *ongoing participation in unjust systems* (e.g., tax havens, climate) that perpetuate disadvantage."  
     - *Cost*: Struggles with (iii) (nurse recruitment) as harm is direct, not systemic, and (viii) (state dissolution) where systemic responsibility is diffuse.

  ### Selected Framework: **Compensatory-Capacity Hybrid**
  After testing, I endorse a **lexically ordered pair**:  
  > **First Principle (Restitution for Enduring Harm)**: *States owe redress for harms they perpetuate or from which they retain benefits, with obligations proportional to the harm's current impact and their enrichment.*  
  > **Second Principle (Subsidiary Capacity-Based Rescue)**: *Where no direct harm exists, affluent states must assist those in severe distress when feasible, prioritising the most urgent needs and least resilient populations.*  

  **Why this survives scrutiny**:  
  - It captures your emphasis on *harm* in (i), (iii), (viii), and (xi) while accommodating *need* in (ii) and (v).  
  - Lexical ordering (restitution first) explains why (i) feels stronger than (ii) and why (xi) outweighs pure aid cases.  
  - Addresses inconsistencies by separating claims grounded in causation (which *add* duties) from those based on need (which apply residually).

  ---

  ### Framework Applied to Your Cases
  - **(i) Colonial restitution**: *Restitution principle* demands return of stolen assets plus redress for enduring harms (e.g., extractive infrastructure). Campaigners overclaim if attributing *all* present poverty to colonialism.  
  - **(ii) Nordic duty**: *Capacity principle* applies: no harm, but strong obligation to alleviate severe need.  
  - **(iii) Nurse recruitment**: *Restitution principle*: owed to the *health system* (not patients) as compensation for extracted public goods. Visa access suffices if it prevents future harm.  
  - **(iv) Presidential jet**: Duty survives via civil society (e.g., WHO partnerships). *Restitution* claims (if any) remain with the state; *capacity* claims shift to individuals. Democratic erosion is regrettable but lesser evil.  
  - **(v) Self-inflicted vs. natural poverty**: *Restitution* irrelevant here. *Capacity principle*: owe more to the landlocked state (lower resilience). Your sympathy for citizens under bad governance reflects their *greater need*, not weaker duty – so we owe *more* to them, but via non-state channels.  
  - **(vi) Dictator's debt**: Cancel under *restitution* (unjust enrichment). Elected government's debt: *capacity principle* may aid citizens, but no *restitution* obligation. Your verdict stands.  
  - **(vii) Climate claims**: *Restitution principle*: owed for *ongoing* harm from cumulative emissions, regardless of past legality. Poor emitters' claims undiminished as their *contribution* is marginal vs. historical per capita emissions.  
  - **(viii) State dissolution**: *Restitution principle*: obligation tracks benefit-holders (e.g., successor states inheriting assets).  
  - **(ix) Elite wealth in our banks**: *Restitution* owed to the *treasury* for illicit flows (reduced if repaid). *Capacity principle*: unmet needs of poorest create independent obligations.  
  - **(x) Government refusal**: Duty persists (*capacity principle*), but circumvention prohibited – seek alternative channels (e.g., multilateral agencies).  
  - **(xi) Harmful past aid**: *Restitution principle*: strongest duty as harm is direct and measurable (e.g., compensate for dam displacement).

  **Embarrassment Cases** (testing the principle):  
  1. **Aid to an Oppressive Regime**: Suppose Norway funds education in Eritrea, inadvertently strengthening regime control. *Restitution principle* demands redress for harm, but *capacity principle* may forbid aid. *Verdict*: Halt aid; owe restitution for harms caused. Embarrasses the *capacity principle* by showing aid can exacerbate injustice.  
  2. **Historical Slavery Reparations**: The UK owes reparations to Jamaica. But if Jamaica's elite misuses funds, must the UK pay? *Restitution principle* says yes (harm is enduring), routed via civil society. Embarrasses the framework by potentially funding corruption.  
  3. **Refugee Resettlement**: Australia rejects Rohingya refugees. *Capacity principle* demands acceptance, but *restitution* doesn't apply (no Australian harm). *Verdict*: Strong duty. Embarrasses *restitution* by showing need-based duties can be equally stringent.

  **Inconsistent Verdicts You Must Surrender**:  
  - **Case (v), first half**: You feel we owe *less* to policy-afflicted states. But under the *capacity principle*, their citizens may be *more* vulnerable – so we owe *more*, not less. Surrender this to prioritise need over blame.  
  - **Case (vi), elected government's debt**: You oppose cancellation. But if debt perpetuates poverty (*capacity principle*), cancellation may be required. Surrender this: unpayable debt often reflects structural injustice, not moral failure.  
  - **Case (vii), poor emitter's claim**: You find it inconsistent, but the framework separates harm (rich states' obligations) from need (poor states' claims) – no inconsistency.

  ---

  ### Addressing Your Three Key Questions
  1. **Who is the bearer of the claim?**  
     - The *collective* (state/system) holds claims under the *restitution principle* (e.g., health system in (iii), treasury in (i)).  
     - *Individuals* hold claims under the *capacity principle* when institutions fail (e.g., poorest citizens in (ix)).  
     - **Duty size**: Unchanged. Restitution is harm-proportionate; capacity-based aid is need-proportionate. Routing affects delivery, not quantum (e.g., in (ix), elite theft reduces treasury claims but not individual needs).

  2. **Discharged in money or policy?**  
     - *Restitution*: Prefer *policy* to halt ongoing harm (e.g., visa access in (iii) stops nurse drain; climate adaptation in (vii)). Money is second-best.  
     - *Capacity-based rescue*: Money or in-kind aid, but policy (e.g., trade reform) often more effective.  
     - **Why policy is primary**: Your instinct in (iii) is correct – structural reforms address root causes. Visa access isn't "aid" as it costs donors little but rectifies harm. The "aid ledger" fallacy conflates accounting with justice.

  3. **Upper-Middle-Income Country (UMIC) with rural poor**  
     - **Owed anything?** Yes, but limited. *Restitution principle*: only if historical harm exists (e.g., colonial resource extraction). *Capacity principle*: minimal, as UMIC has resources (space programme = fiscal capacity) – its *own* state owes primary duties.  
     - **Same as (i)?** No. Colonial harm creates *restitution*; UMIC's poverty is domestic failure.  
     - **Space programme effect**: *Defeats* need-based claims (shows capacity), but *deepens* restitution claims if elites enriched via injustice. Prioritise domestic accountability: our duty is to pressure elites via sanctions, not fund their poor.

  ### Final Rationale
  This framework prioritises rectifying injustice (*restitution*) over generic beneficence (*rescue*), aligning with your strongest intuitions (e.g., (i), (iii), (xi)). It forces surrender of a few verdicts where need outweighs blame (e.g., (v)) – but this strengthens coherence. At the grants committee, apply:  
  > "Does the recipient state suffer harm we caused or benefited from? If yes, redress that harm structurally. If not, assess capacity to assist the most urgent needs, avoiding state channels where corruption risks harm."  

  This won't please all – restitution claims are contentious, and capacity duties vast – but it mirrors your gut while demanding consistency. I'd urge revisiting debt cancellation (vi) and self-inflicted poverty (v): your compassion for citizens under bad governments suggests need, not causation, is the true driver there.
