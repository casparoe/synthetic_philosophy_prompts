prompt: |-
  I'm on a five-person committee at my university that hands out small internal research grants, and over the last couple of years I keep running into something I can't tell is a known phenomenon with a name or just us being sloppy. Our handbook says a proposal gets funded only if it is scientifically sound, within the budget we've agreed, and doable in the time the applicant has. Everyone on the committee is individually consistent: we each vote our honest view on each of the three, and each of us votes yes or no on the overall question in a way that matches our own answers to the parts. But the result seems to depend on how many lines are on the ballot. In one round, if you had just asked us "fund it, yes or no?" as a single question it would have been 4-1 against. Ask it as two questions — sound? and then everything else lumped together? — and it was still no. Ask it as five questions, splitting the budget condition into "enough for salaries" and "enough for equipment," and every single line passed comfortably (3, 4 and 3 out of 5), so the answer flipped to yes. Same five people, same opinions, no one changed their mind, no one was being strategic.

  Then on my condo board I saw what looks like the mirror image. Our rule there is that we go ahead with a contractor if the bid is within budget OR they've done work in the building before. Asked as one question, "go ahead?", three of five said yes. Asked as two — within budget? (2 yes) and worked here before? (1 yes) — both failed, and we didn't go ahead. So with the "and" rule, chopping things finer turned a no into a yes, and with the "or" rule it turned a yes into a no. I tried raising the threshold to four out of five on every line and that made both cases come out consistent, but always as "no," which makes me think I've just built in a bias toward doing nothing rather than fixed anything. The really uncomfortable part is that whoever drafts the ballot decides the outcome without changing a single vote or misrepresenting anything.

  I've since read a little and found the famous courtroom version of this kind of thing, about juries and voting on the elements of a charge versus the verdict, and that feels close but not the same: in our cases both ways of doing it are "vote on the parts," just at different grains. It's also not the thing where the order motions are taken in matters, since we vote on everything at once, so its not an ordering effect. So: does this have a name of its own? If it is just the courtroom paradox in disguise, I want to be shown exactly why, and if it isn't, I want to know what the nearest concepts are and where each one stops fitting — in particular whether the thing to blame is the voting rule, the way the questions are carved up, or the fact that there's no non-arbitrary finest grain (you can always split "enough for salaries" into two questions again). I'd also like to know whether the and/or asymmetry I noticed is a real feature or an artifact of my two examples, and what the boundary cases are where no way of slicing the question gives a coherent group answer. Please don't just hand me a label — I want the carving: what exactly this is, what it isn't, and if there's genuinely no established term, a name plus a definition plus the cases that sit right on the edge.
reasoning: |-
  We are dealing with a phenomenon where the outcome of a group decision on a composite proposition (built from subconditions using logical connectives like AND/OR) depends on the granularity at which the subconditions are presented and voted upon. This is distinct from the order of voting (since all votes are simultaneous) and from strategic voting (since votes are honest and consistent with individual judgments).

  The phenomenon in the courtroom you refer to is likely the "doctrinal paradox" (also known as the "discursive dilemma"). In the doctrinal paradox, a jury must decide on a verdict that depends on several elements (e.g., for a burglary: unlawful entry and intent to steal). The paradox arises when the majority votes on each element do not correspond to the majority vote on the overall verdict. Specifically:

  - Each juror votes on each element and then derives the verdict from the elements (by the logical rule).
  - But when aggregating, if we take the majority on each element and then apply the rule, we might get a different result than if we take the majority on the overall verdict.

  In your committee examples, the voting is on the parts and then the overall decision is derived by the rule. However, note that in your first example (the research grant), the overall decision is an AND of three conditions (sound, within budget, and doable in time). In the second (condo board), it is an OR of two conditions (within budget OR worked here before).

  The twist you observe is that by splitting a condition (like the budget) into finer subconditions, the outcome flips. This is a more general version of the doctrinal paradox, sometimes called the "multiple premise paradox" or "aggregation paradox". However, the specific effect of granularity is a key aspect.

  Let me formalize:

  Consider a composite proposition P that is a logical function of some atomic propositions. For example:
  - In the grant: P = A ∧ B ∧ C, where A=sound, B=within budget, C=doable in time.
  - In the condo: P = D ∨ E, where D=within budget, E=worked here before.

  The voting procedure:
  - We have a set of voters (in your cases, 5).
  - The committee votes on each atomic proposition (or on a set of propositions that may be composite themselves) and then the outcome is determined by applying the logical rule to the majority votes on the presented propositions.

  But note: when we split a proposition (say B into B1 and B2) then the condition for the budget becomes B1 ∧ B2 (if we require both) or B1 ∨ B2 (if either suffices). In your example, splitting the budget condition into "enough for salaries" and "enough for equipment" and requiring both, so the budget condition becomes a conjunction: B = B1 ∧ B2.

  Therefore, the overall condition becomes: P = A ∧ (B1 ∧ B2) ∧ C = A ∧ B1 ∧ B2 ∧ C.

  Similarly, in the condo example, if we split a condition (though you didn't split in the example, but we could imagine) then the OR condition might become a disjunction of more terms.

  The key point: the aggregation rule is majority voting on each presented proposition. The overall outcome is then computed by the logical formula.

  The paradox: the outcome of the group decision on P (whether to fund or hire) may change depending on how we break down the atomic propositions.

  Why does this happen?

  In the grant example (AND rule):
  - When voting on the three conditions (A, B, C) individually, the majority must be achieved on all three for P to be true. But in the split version, we require majority on A, B1, B2, and C. It is easier to get a majority on each of the finer conditions because the budget condition (which was a single proposition) is now two. Some voters who thought the budget was not acceptable overall might think one part (say salaries) is acceptable and the other (equipment) is not. But when split, if the majority passes each part, then the budget condition is deemed satisfied.

  Example with numbers:

  Original three conditions: A, B, C.
  - Suppose the votes:
    - A: 4 yes, 1 no -> passes
    - B: 3 no, 2 yes -> fails
    - C: 4 yes, 1 no -> passes
  Overall: since B fails, the project is not funded (even though A and C pass).

  Now split B into B1 and B2. Suppose the votes on the four conditions:
  - A: 4 yes, 1 no -> passes
  - B1: 3 yes, 2 no -> passes
  - B2: 3 yes, 2 no -> passes
  - C: 4 yes, 1 no -> passes

  So all four pass -> project is funded.

  In the condo example (OR rule):

  Original two conditions: D, E.
  - Votes:
    - D: 2 yes, 3 no -> fails
    - E: 1 yes, 4 no -> fails
  Overall: since both fail, the OR condition fails -> not hired.

  But if we had voted only on the overall OR question (without splitting) and three said yes (meaning they individually believe D OR E is true) then we would have 3 yes on the overall. However, note that in your description, when asked as one question, three said yes. But when split, we see that both D and E fail. This is exactly the doctrinal paradox: the majority on the elements (D and E) does not match the majority on the conclusion (D∨E).

  But note: in the condo example, you did not split a condition but rather presented the two conditions separately. The issue is that the OR condition is not equivalent to the majority of the two conditions individually? Actually, the OR condition is true if at least one of D or E is true. However, the group decision procedure we are using is to take majority on each element and then combine. But the individual voters might have different reasons for the OR: one voter might think D is true and E false, another might think E is true and D false, and a third might think both are true. When we aggregate by majority on D and majority on E, we might get both false even though a majority of the voters think that at least one is true.

  So the problem is that the majority rule on the premises does not necessarily preserve the logical relationship.

  Now, the granularity effect (splitting) is an extension: by splitting a condition, we change the set of premises and the logical formula that we apply to the majority outcomes.

  Is there a name for this granularity effect? I have seen it referred to as the "splitting problem" in the context of the doctrinal paradox, but it is not a standard term. More generally, it falls under the study of judgment aggregation.

  In judgment aggregation, we have a set of logically connected propositions, and we wish to aggregate the judgments of multiple individuals. The doctrinal paradox is a classic example. The granularity issue is about the choice of the agenda (which propositions are put to vote).

  The asymmetry between AND and OR:

  In the AND case, splitting a condition (which is a conjunction of finer conditions) makes each finer condition easier to pass (because we only require a majority on each, and the original condition might have been harder to pass as a whole). Hence, splitting tends to make the overall AND condition more likely to pass.

  In the OR case, if we split a condition that is a disjunction (so that we replace one condition with two, say E becomes E1 ∨ E2) then when we vote on E1 and E2 individually, we require majority on each for the condition to be satisfied? But wait: if we split a condition that is part of an OR, we have to be careful. In the condo example, we did not split an atomic condition. But suppose we had a condition E that we split into two: E1 and E2, and we require E = E1 ∨ E2. Then the overall condition becomes D ∨ (E1 ∨ E2) = D ∨ E1 ∨ E2.

  Now, the group decision is taken by majority on D, E1, E2. The OR condition is true if at least one of D, E1, E2 gets a majority. This is easier to satisfy than the original (which required D or E to get a majority) because we have more chances. So splitting a disjunctive condition in an OR rule would tend to make it easier to pass.

  But note: in your condo example, you did not split a condition. You had two atomic conditions and you split the voting on them. The issue there was that the majority rule on the elements does not capture the OR at the individual level.

  So the asymmetry you observed:

  - In the AND rule: splitting turned a no into a yes (made it easier to pass).
  - In the OR rule: splitting (by requiring voting on each disjunct) turned a yes into a no (made it harder to pass) in the sense that the majority on the elements failed even though the majority on the overall OR passed.

  But note: in the OR example, the two ways of voting are not equivalent. The overall OR vote asks: "is D OR E true?" and each voter answers that. The split method asks: "is D true?" and "is E true?" and then we apply the OR to the majority outcomes. These are two different aggregation methods.

  The phenomenon is that the same set of individual judgments can lead to different group outcomes depending on the aggregation method (premise-based vs. conclusion-based) and the granularity of the premises.

  To answer your questions:

  1. Name: This is a form of the doctrinal paradox (or discursive dilemma) in judgment aggregation, with the specific twist of granularity (agenda setting). The granularity effect is sometimes discussed as the "splitting" or "lumping" of issues.

  2. Why it happens: The majority rule on the premises does not preserve the logical relationships when the premises are not independent and when the individual judgments are not consistent in a way that is preserved under aggregation.

  3. The and/or asymmetry: It is a real feature. For AND rules, splitting the conditions (making the set of premises larger by breaking conjunctions) tends to make the overall condition easier to satisfy because each subcondition is voted on independently and only requires a majority. For OR rules, splitting a disjunction (if we break a condition that is a disjunction into its parts) would make it easier (because we have more disjuncts). However, in the OR case you presented, you did not split a condition but rather presented the two conditions separately. That led to a failure because the majority on each condition was not achieved, even though the majority of the voters thought at least one condition was true.

  4. Boundary cases: The problem arises when the individual judgments are such that the majority on the premises does not correspond to the majority on the conclusion. This can happen in many ways. The problem is inherent in the majority aggregation of logically connected propositions.

  5. Solutions: One solution is to use a different aggregation rule, such as requiring a supermajority on the premises (as you tried) but that introduces a bias. Another is to vote only on the conclusion (but then you lose the benefit of the structure). Or, you might use a premise-based approach but with a different voting rule for the premises (like unanimity) but that might be too strict. There is no perfect solution because of the impossibility theorems in judgment aggregation (like List and Pettit's theorem).

  In summary:

  - The phenomenon is a form of the doctrinal paradox (judgment aggregation paradox) and is due to the aggregation method and the logical connections between the propositions.

  - The granularity effect (splitting) is a specific manifestation and can flip outcomes.

  - The and/or asymmetry is real: splitting an AND condition (by breaking a conjunct into finer conjuncts) makes it easier to pass; splitting an OR condition (by breaking a disjunct into finer disjuncts) makes it easier to pass (if the rule for the condition is OR). But note that in your OR example, you did not split a condition but rather changed from a conclusion-based to a premise-based vote without splitting. That led to a flip from yes to no.

  To avoid confusion, we must distinguish:

  - Premise-based: vote on the atomic propositions and then apply the rule.
  - Conclusion-based: vote directly on the conclusion (the overall proposition).

  And note that splitting changes the set of atomic propositions.

  If you want a name for the granularity effect, you might call it the "agenda granularity effect in judgment aggregation". But I am not aware of a standard term.

  Finally, the uncomfortable part: the person who drafts the ballot (by choosing the granularity) can manipulate the outcome without changing any votes. This is a real concern and is a form of agenda manipulation.

  I hope this provides the carving you requested.
answer: |-
  ### The Phenomenon: Judgment Aggregation and Agenda Granularity

  Your observations reveal a deep issue in collective decision-making known as **judgment aggregation**, specifically a manifestation of the **doctrinal paradox** (also called the **discursive dilemma**). However, your examples extend this paradox by introducing **granularity-dependent outcomes**—where the same set of voter judgments leads to different group decisions based solely on how the voting questions are subdivided. This granularity effect is distinct from the classic doctrinal paradox and has nuances related to logical connectives (AND/OR) and the structure of the ballot. Below, I'll dissect the phenomenon, name it, clarify boundaries, explain the asymmetry, and address your core concerns.

  ---

  ### 1. **Core Concept and Name**
  - **Name**: **Granularity-Dependent Aggregation Paradox** (or **Splitting Paradox**).  
    - *Why this name?* It emphasizes that the paradox arises from how a composite question is "split" into sub-questions (the agenda's granularity), not from voter inconsistency, strategic behavior, or voting order.  
    - *Relation to known concepts*:  
      - It is a **subtype of the doctrinal paradox**, but with a critical twist. The classic doctrinal paradox compares premise-based voting (voting on subconditions) vs. conclusion-based voting (voting directly on the outcome). Your cases are **both premise-based**—yet outcomes change when subconditions are subdivided (e.g., splitting "budget" into "salaries" and "equipment").  
      - It is **not** Arrow's paradox (about ranking preferences), Condorcet's paradox (about cyclic majorities), or a procedural timing issue (since votes are simultaneous).  

  - **Definition**:  
    > When a group evaluates a logically compound proposition (e.g., "Fund if A AND B AND C"), the collective outcome may flip depending on the granularity at which subconditions are defined and voted upon—even with fixed voter judgments, honest voting, and no misrepresentation. The agenda-setter (ballot-drafter) can manipulate outcomes by splitting or lumping subconditions, without changing votes.  

  ---

  ### 2. **Why This Happens: Mechanism and Asymmetry**
  The paradox stems from **two layers**:  
  - **Logical layer**: The rule for combining subconditions (AND/OR).  
  - **Aggregation layer**: Applying majority voting to each subcondition independently.  

  Majority voting on premises does not always preserve logical relationships across granularities. Voters may agree on fine-grained details but disagree on coarse-grained summaries, causing inconsistencies. The AND/OR asymmetry you noticed is real and predictable.

  #### A. **AND Rules (e.g., Research Grants: Fund if A AND B AND C)**  
  - **Mechanism**:  
    - Splitting a condition (e.g., B → B₁ AND B₂) creates more subconditions (e.g., A, B₁, B₂, C).  
    - Each subcondition requires only a majority to pass.  
    - Splitting **lowers the bar** for approval because a condition that fails as a whole (e.g., "budget") might pass when subdivided (e.g., "salaries" and "equipment" each get majorities).  
    - *Example from your case*:  
      - Coarse-grained: Budget (B) fails 2-3 → whole proposal fails.  
      - Fine-grained: Salaries (B₁) passes 3-2, Equipment (B₂) passes 3-2 → budget "passes" when split, flipping the outcome.  

  - **Asymmetry Insight**:  
    - AND rules are **monotonic to splitting**: More subdivisions make approval easier.  
    - Why? Each new subcondition is a separate "hurdle," and the majority threshold for each is easier to meet than for a lumped condition (e.g., a voter rejecting "budget" might accept "salaries" but reject "equipment," but splitting allows partial passes).  

  #### B. **OR Rules (e.g., Condo Board: Hire if D OR E)**  
  - **Mechanism**:  
    - Splitting is less intuitive here, but your case shows a different effect: Voting separately on subconditions (D and E) vs. voting on the whole (D OR E) creates inconsistency.  
    - A majority may support the OR conclusion (e.g., 3/5 say "hire") but fail to achieve a majority on *any single subcondition* (e.g., D fails 2-3, E fails 1-4).  
    - *Example from your case*:  
      - Conclusion-based: "Hire?" passes 3-2.  
      - Premise-based: "Within budget?" (D) fails 2-3, "Worked here?" (E) fails 1-4 → hire rejected.  

  - **Asymmetry Insight**:  
    - OR rules are **vulnerable to dispersion**: Voting on subconditions separately makes approval harder because the OR requires at least one subcondition to pass via majority.  
    - Why? Voters supporting the OR may do so for *different reasons* (e.g., some support D, others support E). When forced to vote on subconditions, their分散的 support lacks a majority on any one, even if the overall OR has majority support.  

  #### C. **Key Asymmetry Summary**  
  | Rule  | Effect of Splitting/Subdivision      | Why?                                                                 |
  |-------|--------------------------------------|----------------------------------------------------------------------|
  | AND   | Easier approval (flip: No → Yes)     | Splitting creates smaller hurdles; each requires only majority.      |
  | OR    | Harder approval (flip: Yes → No)     | Support for OR is distributed; no subcondition may gain a majority. |

  This asymmetry is inherent to the logical structure and is not an artifact of your examples. It appears in any judgment aggregation with AND/OR rules.

  ---

  ### 3. **Boundary Cases and When Coherence Fails**
  The paradox arises when voter judgments are **logically inconsistent at the group level** (even if consistent individually). Here’s when it occurs and when it doesn’t:
  - **Triggers the paradox**:  
    - **Non-unanimous votes** with heterogeneous judgments (e.g., voters hold conflicting views on subconditions).  
    - **Subconditions are interdependent** (e.g., "budget" depends on "salaries" and "equipment").  
    - **Majority thresholds** (e.g., 3/5, 4/5) do not align with the logical rule.  
  - **Avoids the paradox**:  
    - **Unanimity**: If all voters agree, any granularity yields the same outcome.  
    - **Trivial splits**: Subdividing a condition everyone agrees on (e.g., splitting "sound science" into "methods" and "data" if all accept both).  
    - **Conclusion-based voting only**: If the group **only** votes on the final question (e.g., "fund?") and never on subconditions, granularity is irrelevant—but you lose transparency.  

  #### The "No Coherent Group Answer" Scenario
  - **Occurs when**:  
    For a given rule (AND/OR), **no granularity yields a stable outcome** across subdivisions. This happens when:  
    1. Voter judgments are **highly fragmented** (e.g., each subcondition has 3-2 splits, but majorities shift when split further).  
    2. The group size and threshold create **intransitivities** (e.g., with 5 voters, a 4/5 supermajority per subcondition may always reject, but a 3/5 majority may flip outcomes arbitrarily).  
  - **Your supermajority experiment**:  
    Requiring 4/5 per subcondition introduces a **status quo bias** (always "no") because high thresholds favor rejection. This "fixes" consistency by sacrificing fairness, not by resolving the paradox.  

  ---

  ### 4. **Root Cause and Responsibility**
  The problem lies in the **interaction of three elements**:  
  1. **Voting rule**: Majority voting on premises is **not truth-functional**—it doesn’t preserve logical relationships when aggregating judgments.  
  2. **Agenda granularity**: There is **no "correct" level of granularity**. Any condition can be split further (e.g., "salaries" → "PhD salaries" and "staff salaries"), making outcomes arbitrary.  
  3. **Logical structure**: AND/OR rules behave differently under splitting (as shown above).  

  - **Primary blame**: The **aggregation method** (premise-based majority voting) + **agenda control**.  
    - The ballot-drafter decides granularity, which can manipulate outcomes.  
    - Example: In the AND case, a pro-funding drafter splits conditions; in the OR case, an anti-hiring drafter forces separate votes on subconditions.  

  ---

  ### 5. **Relation to Legal Doctrinal Paradox**
  - **Similarity**: Both involve premise-based vs. conclusion-based voting inconsistencies.  
  - **Difference**: The classic doctrinal paradox compares:  
    - *Premise-based*: Majority vote on elements (e.g., "Did the defendant act unlawfully?").  
    - *Conclusion-based*: Majority vote on verdict (e.g., "Is the defendant guilty?").  
  - **Your twist**: You hold the voting method (premise-based) constant and vary the **granularity of premises**. This is a less-studied extension—sometimes called the **"splitting problem"** in legal/judgment aggregation literature.  

  ---

  ### 6. **Practical Implications and Mitigations**
  - **Why it matters**: Agenda control becomes a hidden source of power. In committees, a chair can tilt outcomes by framing the ballot.  
  - **Mitigations**:  
    - **Default to conclusion-based voting**: Vote only on the final question (e.g., "fund?") to avoid granularity effects—but this sacrifices nuance and may feel less rigorous.  
    - **Unanimity or supermajorities**: Risks bias toward inaction (as you saw).  
    - **Structured deliberation**: Discuss logical dependencies before voting to align judgments (but doesn’t guarantee consistency).  
    - **Formal judgment aggregation rules**: Use "premise-based" voting only if premises are logically independent (rarely true) or switch to "conclusion-based."  
  - **No perfect solution**: Social choice theory shows that no aggregation rule satisfies all desirable properties (e.g., List-Pettit theorem).  

  ---

  ### Final Summary
  - **Phenomenon**: Granularity-Dependent Aggregation Paradox (a subtype of doctrinal paradox).  
  - **Essence**: Group outcomes flip based on ballot granularity due to premise-based majority voting + logical structure.  
  - **AND/OR Asymmetry**: Real. Splitting favors AND approvals and OR rejections.  
  - **Boundary**: No coherent outcome when voter judgments are irreconcilably fragmented across granularities.  
  - **Root Cause**: Premise-based majority voting + non-independent subconditions + agenda control.  

  This is a profound issue in collective rationality—your committee and condo board are textbook examples. If you seek further formalism, key references include:  
  - List & Pettit (2002) on the doctrinal paradox.  
  - Dietrich & Mongin (2010) on the aggregation of propositional attitudes.  
  - "Splitting" effects in judgment aggregation (e.g., de Haan & van Leeuwen, 2021).
