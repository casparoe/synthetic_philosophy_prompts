answer: |-
  Here's a complete practice exam package designed to meet your specifications, focusing on application, the recursion test, and agenda-setting power.

  **1. The Exam Question (45 mins, 800 words max, 25 marks):**

  > **Case:** The self-governing city of Verran is debating whether to build a tidal barrage on the river Serran. The barrage would:
  > *   Protect Verran's low-lying districts from flooding.
  > *   Divert seasonal flooding onto farmland in Halden Marsh, a neighbouring settlement outside Verran's jurisdiction.
  > *   Block the migration route of fish vital to the Kesh fishing cooperative, located 200km upstream in a different member-state of the federation.
  > *   Additionally, approximately 4,000 residents of Halden Marsh commute daily into Verran for work. They pay Verran's city income tax and are subject to Verran's employment and zoning laws while within the city.
  >
  > **Task:** Analyze who should constitute the legitimate *demos* for deciding whether to build the barrage according to:
  >     a) The **All-Affected Interests Principle** (claim based on foreseeably significant affected interests).
  >     b) The **All-Subjected Principle** (claim based on being subject to the coercion enforcing the decision).
  >
  > **Crucially:** For *each* principle, assess whether it passes the **"recursion test"**: Does the principle, when applied to the *meta-decision* of *which boundary rule (principle) to use for the barrage decision itself*, yield the *same* demos as it did for the barrage decision? If the principle changes its own verdict at the meta-level, it is self-undermining.
  >
  > **Finally:** Given that the demos might be constituted differently for each decision, what challenge does **agenda control** (e.g., who decides *what* gets voted on and *how*) pose to either principle? Conclude with a brief reflection on what the recursion test reveals about the possibility of finding a single, consistent principle for democratic boundary-setting in this case.

  ---

  **2. Model Answer (Approx. 700 words):**

  **Verran's Barrage and the Democratic Boundary Problem**

  Verran's tidal barrage decision starkly illustrates the democratic boundary problem. Determining the legitimate *demos* requires applying core principles.

  **a) All-Affected Interests Principle:** This principle grants a democratic claim to anyone whose significant interests are foreseeably impacted by the decision.
  *   *Barrage Demos:* This casts a wide net.
      *   **Verran Residents:** Clearly affected (protection from floods, potential cost/benefit).
      *   **Halden Marsh Residents:** Significantly affected (flooding diverted onto farms, economic loss). Their daily commute doesn't directly affect the *barrage impact*, but their interests in their homes/livelihoods are foreseeably harmed.
      *   **Kesh Fishing Cooperative:** Significantly affected (loss of fish migration threatens their livelihood). Distance doesn't negate foreseeable impact.
  *   *Recursion Test (Meta-Decision on Principle Choice):* Applying "all-affected" to the meta-decision of *which boundary rule to use* becomes problematic. Who is foreseeably affected by *how Verran defines its demos*? Potentially *everyone* who might ever be affected by a future Verran decision, including Kesh, Halden Marsh, neighbouring cities, the wider federation, even global actors if Verran's precedent matters. This meta-demos is vastly larger and different from the barrage demos (which included Kesh and Halden Marsh). **The principle fails the recursion test.** It prescribes a different (and indeterminately large) demos for choosing the rule than it prescribes for applying the rule.

  **b) All-Subjected Principle:** This principle grants a claim only to those subject to the coercive enforcement of the decision.
  *   *Barrage Demos:* This draws tighter boundaries focused on enforcement jurisdiction.
      *   **Verran Residents:** Subject to Verran's laws and enforcement mechanisms. The barrage decision, enforced by Verran's authorities, directly governs them.
      *   **Halden Marsh Commuters:** While *in Verran*, they are subject to its laws and coercion (taxation, employment/zoning law). Crucially, the *barrage decision itself* primarily involves Verran using its authority (e.g., planning permission, funding allocation, construction enforcement) *within its territory*. The flooding diversion onto Halden Marsh land is an *effect* of the decision, not an act of enforcement *by Verran* *upon Halden Marsh residents*. Verran doesn't enforce laws *in* Halden Marsh. Therefore, only their status *within Verran* might give them a claim, but this is tenuous as the barrage decision isn't coercively enforced *upon them* directly. Strong argument for *exclusion*.
      *   **Kesh Fishing Cooperative:** Not subject to Verran's coercion. Verran has no enforcement power over them 200km away in another state. **Excluded.**
      *   *Thus, Barrage Demos:* Primarily, if not exclusively, Verran residents.
  *   *Recursion Test (Meta-Decision on Principle Choice):* Who is subjected to the coercion involved in *enforcing which boundary rule is used*? The choice of principle likely rests with Verran's existing governing bodies (e.g., city council), empowered by its current constitution/laws. Enforcement of *that choice* (e.g., using police/courts to ensure only the chosen demos votes) falls primarily upon those already subject to Verran's authority – essentially, the current Verran citizenry. The meta-demos (Verran citizens) largely overlaps with the barrage demos prescribed by the principle (Verran citizens). **The principle arguably passes the recursion test** at this level, as the meta-demos and the object-level demos are congruent (Verran citizens).

  **Agenda Control:** The recursion test highlights a deeper issue: agenda control. If the demos is constituted per decision, *who decides what decisions are made and how the boundary rule is applied?* The All-Affected principle, failing recursion, offers no stable answer, potentially empowering whoever sets the initial agenda (likely Verran) to define "affected" arbitrarily. The All-Subjected principle, while passing recursion *here*, faces its own agenda control problem. Verran's current citizens/subjects (the demos for both levels under this principle) control the agenda. They decide *what* gets voted on (e.g., the barrage, but not necessarily compensation for Halden Marsh) and *which principle to apply*. This risks the powerful (current demos) excluding those subjected only indirectly or marginally (like commuters) or affected outsiders (Halden Marsh farmers, Kesh) from the agenda-setting process itself, perpetuating their exclusion.

  **Conclusion:** The recursion test reveals a fundamental tension. The All-Affected principle, intuitively strong for inclusion, becomes incoherent at the meta-level, leading to indeterminacy and vulnerability to agenda manipulation. The All-Subjected principle offers procedural consistency (passing recursion in this case) and clearer boundaries but risks significant exclusion of foreseeably affected groups and entrenches the agenda-setting power of the *status quo* demos. Neither principle provides a perfect, universally legitimate solution. This suggests that while the recursion test usefully exposes self-undermining principles, finding a single, consistent, and morally satisfying principle for all boundary decisions, especially those with transboundary impacts, may be impossible. Practical legitimacy likely hinges on higher-level constitutional settlements or federated structures capable of mediating such conflicts, even if they are not derived from a single "pure" democratic principle.

  ---

  **3. Marking Scheme (Total 25 Marks):**

  | **Criteria**                                                                                                | **Marks** | **A-Grade Moves (21-25)**                                                                                                      | **B-Grade Moves (16-20)**                                                                                                 | **Common Pitfalls (Lose Marks Here)**                                                                                             |
  | :---------------------------------------------------------------------------------------------------------- | :-------- | :----------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **Analysis of Barrage Demos (All-Affected)**                                                                | 5         | Clearly identifies Verran residents, Halden Marsh residents (farmers), *and* Kesh as included; explains "significant/foreseeable" impact for each. | Identifies Verran and Halden Marsh farmers but misses/weakly argues Kesh's inclusion; or lacks clear justification of "significance". | Lists groups without justification; misses Kesh entirely; conflates commuter status with barrage impact.                          |
  | **Analysis of Barrage Demos (All-Subjected)**                                                               | 5         | Clearly identifies Verran residents as core; argues Halden Marsh commuters are *not* subjected to barrage *enforcement* (key distinction); explicitly excludes Kesh. | Identifies Verran residents but includes Halden Marsh commuters based on *general* subjection in Verran, not barrage-specific enforcement; weak on Kesh. | Assumes commuters are included simply because they pay tax/work in Verran; fails to distinguish effect from enforcement coercion. |
  | **Recursion Test Application (All-Affected)**                                                               | 4         | Clearly shows meta-demos is vastly larger/indeterminate (all potentially affected by rule choice); explicitly states it fails (different demos). | States meta-demos is larger but doesn't articulate *why* (indeterminacy of future effects) or weakly states inconsistency. | Ignores the test; asserts it passes; confuses it with the barrage decision analysis.                                              |
  | **Recursion Test Application (All-Subjected)**                                                              | 4         | Argues meta-enforcement falls on Verran's subjects; concludes meta-demos is Verran citizens, congruent with barrage demos (passes). | Identifies meta-demos as Verran citizens but doesn't clearly link to *enforcement* of the rule choice; states it passes. | Claims it fails without justification; confuses meta-subjection with barrage subjection.                                          |
  | **Agenda Control Challenge**                                                                                | 4         | Clearly explains the problem for *both* principles: indeterminacy/manipulation risk for Affected; entrenchment/exclusion risk for Subjected. Links directly to recursion outcomes. | Identifies agenda control as a problem generally or for one principle; weaker link to recursion test implications. | Mentions agenda control briefly or vaguely; fails to connect it to the principles or the recursion results.                       |
  | **Conclusion: Reflection on Recursion Test & Principles**                                                   | 3         | Insightful synthesis: Recursion exposes Affected's incoherence and Subjected's exclusion/entrenchment; argues finding a single consistent principle is difficult/impossible; mentions constitutional/federal solutions as pragmatic alternatives. | States neither principle is perfect; mentions recursion exposed weaknesses; may hint at difficulty but lacks depth on implications for democratic theory/legitimacy. | Simply restates findings; asserts one principle is better without addressing recursion's lesson; ignores the "fixed point" issue. |
  | **Clarity, Structure & Conciseness**                                                                        | (Embedded) | Logical flow, precise language, stays within word limit. Complex ideas explained accessibly.                                   | Generally clear but may have minor tangents, repetition, or slightly loose phrasing.                                      | Unstructured, verbose, significantly over/under word limit, unclear arguments.                                                    |

  **How to Use:** Mark holistically within bands (A, B, C etc.), but use the specific criteria above to justify the band and pinpoint strengths/weaknesses. An A answer excels in *all* core analytical sections (Demos x2, Recursion x2, Agenda, Conclusion) demonstrating deep understanding and synthesis. A B answer is competent but may lack depth in one or two areas or miss nuances (e.g., Kesh inclusion justification, subjection/enforcement distinction, agenda control link to recursion).
