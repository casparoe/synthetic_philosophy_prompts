  - **Why not higher?** Part (c) contains a significant conceptual error (misapplication of TV distance under conditioning) that invalidates the core argument.  
  - **Why not lower?** Parts (a) and (b) show strong command of basics; (c) correctly identifies posteriors as conditional probabilities given C.  

