                iii. Also, present the probability of net benefit and the median outcome, and the interquartile range.

              Additionally, if the committee is comparing two undefined prospects, the analyst will compute the difference and check if the difference has a defined expectation (using the same classification procedure). If the difference has a defined expectation (finite or one-sided infinite), then use that to rank them. If the difference is also undefined, then the same sensitivity analysis must be done for the difference.

              And note the symmetry: the value assigned to the prospect and its mirror image should be opposites. The truncated expectation T(M) for the prospect and for the mirror image should be approximately negatives of each other. So if we assign the truncated expectation at a large M, then it satisfies the symmetry.

          - However, the committee may want a single number. We can choose a large M (say the maximum absolute value that is feasible in the foundation's context, or the maximum that the foundation can absorb) and then use the truncated expectation at that M. But that is arbitrary and loses the tail. But it is a practical solution. We must be explicit that we are truncating.

          - We will recommend: In the undefined case, do not assign an expected value. Instead, present the sensitivity table and let the committee decide. The analyst should also report the tail indices and the running mean plot.

  5. **Repetition Rescue**:
     - For one-sided infinite: Repetition over n grants leads to an average payout that will go to +∞ (if expectation is +∞) or -∞ (if -∞) almost surely. So the foundation should fund the +∞ one repeatedly and avoid the -∞ one.
     - For undefined: Repetition does not help because the average does not converge to any value. The average may oscillate arbitrarily. Therefore, even if the Cauchy principal value is positive, the average over many grants might not be positive.

