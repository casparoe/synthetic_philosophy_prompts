  ### **What the Procedure Cannot Do**  
  1. **Resolve intrinsically undefined expectations** into a single number without committee judgment.  
  2. **Handle dependencies** between grants (assumes independence for repetition effects).  
  3. **Eliminate uncertainty** from sparse tail data (solution: extreme value theory techniques if resources allow).  
  4. **Override model error** (garbage in, garbage out).  

  ---

  ### **Trustee Defense Summary**  
  - **Science-based**: Uses established statistics (tail indices, CLT diagnostics).  
  - **Transparent**: Sensitivity reports expose assumptions.  
  - **Conservative**: Undefined prospects require human oversight.  
  - **Consistent**: Mirror test ensures fairness; repetition logic empirically validated.  
  - **Practical**: 1-day runtime per grant; no measure theory.  

  This procedure ensures robust handling of heavy tails while aligning with the foundation's quantitative rigor and governance needs.
