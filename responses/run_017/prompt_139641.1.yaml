                  Sensitivity report:
                    - Compute the truncated expectation at various truncation levels (M): e.g., M = 1000, 10000, 100000, 1000000, and as large as the simulation allows.
                    - Also, compute the expectation by ordering the outcomes by magnitude and alternating signs (to force a symmetric order) and then compute the average? But that might be arbitrary.

