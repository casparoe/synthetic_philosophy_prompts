prompt: |-
  I'm the quantitative lead at a foundation making roughly thirty long-shot grants a year — global catastrophic risk mitigation, transformative research — where the payoffs come out of models with Pareto-like tails whose index is sometimes near or below 1, on the upside, the downside, or both. Our committee's practice is to ask for an expected value for each prospect and fund by that number; I've become convinced that in some cases the number is an artifact of how a simulation happened to sum its draws. I want a written procedure an analyst can run in about a day, without measure theory, and defend to lay trustees.

  Take as given the shape of the problem: a gamble whose nth outcome has probability 2^-n and payoff ±2^n/n has an expected value equal to the alternating harmonic series — ln 2 in the natural order, anything you like in another — and undefined in the strict sense, since the positive and negative parts each diverge.

  The procedure should first sort a prospect into defined, infinite-but-one-sided, or undefined, using tests an analyst can actually run (tail-index estimates; the diagnostic that a running mean does not settle down as the sample grows). It should then say what replaces the expected value in each case. Three distinctions matter to me especially: that repetition rescues a one-sided infinite expectation but does not rescue an undefined one, so "we'll do this many times over" is an escape in the first case and not the second; that two prospects sharing the same divergent tail can often be ranked by the expectation of their difference even when neither has an expectation of its own; and that any fallback valuation must assign a gamble and its mirror image opposite values, so the procedure cannot smuggle in an ordering of the terms. Where the procedure hands the decision to a person rather than a calculation, say so explicitly, and specify the sensitivity report that shows how far the answer moves across admissible truncations and orders.

  Apply it to three cases: a grant whose only heavy tail is a small chance of very large benefit; an intervention whose model puts a tail index near 0.9 on both benefit and harm; and our committee's flagship proposal, which currently shows a large positive expected value that I suspect is order-dependent — include that one even though it will be the hardest to present. Close with a short statement of what the procedure cannot do.
reasoning: |-
  We are given a problem of evaluating gambles (grants) with heavy tails that may lead to undefined or infinite expected values. The goal is to create a procedure that an analyst can run in about a day without measure theory, which can classify a prospect and then assign a value (or a decision process) for each case.

  The classification:
  1. Defined: The expected value exists and is finite.
  2. Infinite-but-one-sided: Either the positive part or the negative part diverges (but not both), so the expectation is +∞ or -∞.
  3. Undefined: Both the positive and negative parts diverge.

  The procedure must account for:
  - Repetition: For a one-sided infinite expectation, repetition (doing the gamble many times) can lead to a well-defined average (by the law of large numbers for i.i.d. with infinite mean, the average either converges to the infinity or diverges, but in practice, we can think of the average growing without bound in the direction of the infinity). However, for undefined (both sides infinite), repetition does not rescue the situation because the average does not converge to any value and may oscillate arbitrarily.
  - Ranking: Even when two prospects have undefined expectations, we might be able to rank them by considering the expectation of their difference, if that exists.
  - Symmetry: The valuation must assign opposite values to a gamble and its mirror image.

  We are to apply the procedure to three cases:
  A. A grant with a small chance of very large benefit (heavy tail only on the upside).
  B. An intervention with tail indices near 0.9 on both benefit and harm (so both tails are heavy and might cause divergence).
  C. A flagship proposal with a large positive expected value that is suspected to be order-dependent (so likely undefined in the strict sense).

  The procedure steps:

  1. **Data Preparation**: The analyst should have a simulation of outcomes (or a way to simulate outcomes) from the grant's model. The simulation should be large enough to capture tail behavior. We assume that the model provides a way to sample outcomes (with possible very large absolute values) and that the tail behavior can be estimated.

  2. **Tail Index Estimation**:
     - For both the positive and negative tails, estimate the tail index (denoted by α). We can use methods like the Hill estimator for the upper tail and similarly for the lower tail (by taking absolute values of the negative part). The tail index α is such that the distribution has tails like |x|^{-α-1}. Note:
          - If α > 1, then the mean exists and is finite for that tail.
          - If 0 < α <= 1, then the mean for that tail is infinite (i.e., the tail is so heavy that the integral diverges).
     - Steps for tail index estimation:
          a. For the upper tail: take the top k order statistics (say the top 10% of the positive outcomes) and use the Hill estimator:
              α_upper = [ (1/(k-1)) * Σ_{i=1}^{k-1} log(X_{(n-i+1)}/X_{(n-k)}) ]^{-1}
              where X_{(1)} ≤ ... ≤ X_{(n)} are the order statistics of the positive part, and k is chosen appropriately (e.g., by a plot of the Hill estimate for various k and choosing a stable region).
          b. Similarly for the lower tail: take the absolute value of the negative outcomes (so we look at the magnitude of the losses) and then apply the Hill estimator to the upper tail of these absolute values. Then the lower tail index α_lower is the estimated α for the absolute losses.

  3. **Classification**:
     - If both tail indices (α_upper and α_lower) are greater than 1, then the expectation is defined (finite). We can compute the sample mean as an estimate of the expected value.
     - If one tail index is <= 1 and the other is > 1, then we have a one-sided infinite expectation. Specifically:
          - If α_upper <= 1 and α_lower > 1, then the positive part diverges and the negative part converges -> expectation is +∞.
          - If α_upper > 1 and α_lower <= 1, then the negative part diverges and the positive part converges -> expectation is -∞.
     - If both tail indices are <= 1, then we have undefined expectation (both positive and negative parts diverge).

     However, note: the tail index alone might not capture the exact behavior. We also propose a diagnostic: the running mean plot. The analyst should simulate a very large number of samples (as large as feasible, say N=10^6 or more) and compute the running mean (cumulative average). If the running mean stabilizes as the sample size increases, that suggests a finite expectation. If it diverges to +∞ or -∞, that suggests a one-sided infinite expectation. If it oscillates without settling, that suggests undefined.

     Therefore, we combine:
        a. Tail index estimates (with confidence intervals, if possible) to get an initial classification.
        b. Running mean plot: simulate a large sample and plot the cumulative average versus the number of samples. If the plot stabilizes to a horizontal line, then defined. If it goes to +∞ (or -∞) without bound, then one-sided infinite (positive or negative). If it oscillates without a clear trend (and the tail indices are both <=1), then undefined.

     Note: The running mean may be noisy. We can also use the method of grouping: divide the large sample into batches, compute the mean for each batch, and see if the batch means are stable (for defined) or grow without bound (for one-sided) or are unstable (for undefined).

  4. **Valuation for each class**:
     a. **Defined (finite expectation)**: Use the sample mean from a large simulation as the estimate. Report a confidence interval (by bootstrap or standard error) and the sensitivity to the sample size (by seeing how the mean changes as we use more data).

     b. **One-sided infinite expectation**:
          - If +∞: Report that the expected value is infinite. Repetition over many independent grants of the same type will lead to an average that grows without bound (so it is a good bet in the long run). We can still compute a finite sample estimate: the expected value of the average of n repetitions grows without bound as n increases. However, for a single grant, we cannot assign a finite number. The committee might consider the potential for very large upside and the fact that repetition will eventually realize that upside. But also note: the grant might have a high chance of a small loss and a tiny chance of a huge gain. The committee should be shown the distribution (e.g., via a log-log plot of the tail) and the tail index. The analyst should report the probability of net benefit and the median outcome, and also the value at risk at a high quantile (e.g., 95% VaR). But the expected value is infinite, so the standard funding criterion (by expected value) would lead to funding if positive, and here it is +∞.

          - If -∞: Similarly, the expected value is -∞, so by the committee's criterion, it would be rejected.

          However, note: the committee's criterion is to fund by expected value. So for +∞, we fund; for -∞, we reject.

     c. **Undefined expectation**:
          - Here, the expected value does not exist. We cannot use the expectation. We consider:
              i. Repetition: Does not rescue because the average does not converge to any value. So we cannot rely on doing many to get a well-defined average.
              ii. We can try to compute the expectation of the difference between two prospects (if we are comparing two undefined prospects) to see if one dominates in expectation. But note: if we are considering one prospect, we must assign a value.

          - Proposed method for a single prospect:
              Since the expected value is order-dependent (as in the alternating harmonic series example), we must choose an order. But we want to avoid smuggling an ordering. Instead, we can use a symmetric truncation: truncate the absolute value of the outcome at a large level M (so we bound |X| by M) and then take the expectation of the truncated version. Then let M → ∞ and see if the limit exists and is the same regardless of how we approach the truncation. If so, then that limit is called the Cauchy principal value and might be used. However, note that for a symmetric distribution, the principal value would be zero. But for asymmetric, it might be finite.

