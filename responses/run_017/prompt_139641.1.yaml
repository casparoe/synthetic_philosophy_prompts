     - For undefined prospects, the sensitivity analysis might be complex and the committee may find it challenging to make a decision.
     - The procedure assumes independence across grants when considering repetition. If there are dependencies, the repetition rescue for one-sided infinite expectations might not hold.

  **Written Procedure for the Analyst**

  **Step 1: Simulate Outcomes**
     - Simulate a large number of outcomes (at least 1 million, but 10 million or more if feasible) from the grant's model. Record both positive and negative outcomes.

  **Step 2: Estimate Tail Indices**
     - **Upper Tail Index (α_upper):**
          a. Extract the positive outcomes and sort them in ascending order.
          b. Choose a threshold (e.g., the top 10% of positive outcomes) and use the Hill estimator on the top k order statistics. Let k be such that it captures the tail but not too few (e.g., k = min(1000, number of positives/10)).
          c. Compute α_upper = [ (1/(k-1)) * Σ_{i=1}^{k-1} log(X_{(n-i+1)}/X_{(n-k)}) ]^{-1}
          d. Repeat for several choices of k and see if the estimate is stable. Report the median or a stable value.

     - **Lower Tail Index (α_lower):**
          a. Take the absolute value of the negative outcomes and treat them as positive.
          b. Similarly, sort these absolute values and use the Hill estimator on the top k (again, k chosen appropriately).
          c. The estimated α for these absolute values is α_lower.

     - Report α_upper and α_lower.

  **Step 3: Running Mean Diagnostic**
     - Take the entire simulated sample (all outcomes) and compute the running mean (cumulative average) at every 1000th point (to save time). Plot the running mean against the sample size (on a log scale for the sample size?).
     - Look for:
          - Stabilization to a horizontal line -> defined.
          - Divergence to +∞ or -∞ without bound -> one-sided infinite.
          - Oscillation without clear convergence -> undefined.

     - Also, divide the sample into 100 batches, compute the mean of each batch, and plot these batch means. If the batch means are stable, defined; if they show a trend to infinity, one-sided; if they jump around without settling, undefined.

  **Step 4: Classification**
     Based on tail indices and running mean:
     - If α_upper > 1 and α_lower > 1: classified as defined.
     - Else if α_upper <= 1 and α_lower > 1 and running mean diverges to +∞: classified as one-sided positive infinite.
     - Else if α_upper > 1 and α_lower <= 1 and running mean diverges to -∞: classified as one-sided negative infinite.
     - Else if both α_upper <= 1 and α_lower <= 1 and running mean oscillates: classified as undefined.
     - If the running mean and tail indices are inconclusive, run a larger simulation and repeat.

  **Step 5: Valuation**
     a. **Defined**:
          - Compute the sample mean and a 95% confidence interval (by bootstrap or by the formula: standard error = sample_std / sqrt(n)).
          - Report: "The expected value is estimated at [mean] with 95% CI [lower, upper]."

     b. **One-sided positive infinite**:
          - Report: "The expected value is +∞. Repetition of this grant over time will lead to unbounded average benefits."
          - Also report: the probability of a net loss (if any) and the median outcome, and the 95th percentile of benefit (if positive) or loss (if negative). Also, the maximum observed in the simulation.

     c. **One-sided negative infinite**:
          - Report: "The expected value is -∞. The grant is expected to lead to unbounded average losses if repeated."
          - Also report the same statistics as above.

     d. **Undefined**:
          - Report: "The expected value is undefined. The result is sensitive to the order of summation and truncation."
          - Perform sensitivity analysis:
              i. Truncation: For M in [10^3, 10^4, 10^5, 10^6, ...] (as large as the simulation allows), compute:
                   T(M) = average of outcomes truncated at ±M (i.e., set any outcome < -M to -M and any outcome > M to M, then average).
              ii. Present a table of M and T(M).
              iii. Also, compute T(M) for the mirror image (multiplying the outcomes by -1) and verify that it is approximately -T(M).
              iv. Report the range of T(M) over the M values and the standard deviation of the T(M) values (if many M are used) to show sensitivity.
              v. Also, report the median outcome, the interquartile range, and the probability of net benefit.
          - If the committee is comparing two undefined prospects, compute the difference (prospect A - prospect B) and run the entire procedure on the difference. If the difference is defined, then report its expected value and use that for ranking. If the difference is one-sided, then report that. If undefined, then present the same sensitivity analysis for the difference.

          - The committee must decide based on the sensitivity table and other statistics. The analyst should not assign a single number.

  **Step 6: Repetition Consideration**
     - For one-sided infinite: Note that repetition will lead to the average diverging to the infinity (so for positive, it's good; for negative, bad).
     - For undefined: Note that repetition does not lead to convergence of the average. The average may not converge to any value, so the foundation should be cautious.

  **Step 7: Symmetry Check**
     - For every prospect, the analyst should note that the mirror image (all payoffs negated) must be assigned the opposite value. This is automatically satisfied in the defined and one-sided cases. In the undefined case, the truncated expectations T(M) for the prospect and its mirror should be approximately negatives. If not, the simulation may be too small.

  **Application to Cases**:

  Case A (small chance of large benefit):
     - Tail index on upside: estimate α_upper. If it is <=1, then one-sided positive. If >1, then defined.
     - Example: Suppose α_upper=0.8 (<=1) and α_lower>1. Then one-sided positive. Valuation: +∞.

  Case B (tail index 0.9 on both sides):
     - Both α_upper and α_lower are 0.9 (<=1). Then undefined.
     - Sensitivity analysis: T(M) for various M. If the distribution is symmetric, T(M)≈0. If asymmetric, T(M) might show a trend.

  Case C (flagship with order-dependent positive EV):
     - We run the procedure and likely get undefined. We then show the sensitivity table. The committee will see that the expected value is not robust to truncation.

  **Limitations of the Procedure**:
     - It relies on simulation and may miss very rare events.
     - Tail index estimation is sensitive to the choice of k and may be biased.
     - The running mean plot might be misleading if the simulation is not large enough.
     - In the undefined case, it does not provide a single number, which may be unsatisfying to the committee.
     - The procedure assumes the model is correct and that the simulation captures the true distribution.

  **Closing**: This procedure provides a systematic way to handle heavy-tailed grants. It classifies the expectation and guides the committee on when repetition helps and when it does not. It also provides a transparent sensitivity analysis for undefined cases.
answer: |-
  Below is a concise, actionable procedure for evaluating heavy-tailed grants, designed for analysts without measure theory. It classifies prospects into three categories (Defined, Infinite-but-One-Sided, Undefined), provides replacement valuations, and addresses repetition, ranking, and symmetry. The procedure leverages tail index estimation and running mean diagnostics, and includes sensitivity reporting for committee decisions.

  ---

  ### **Procedure for Evaluating Heavy-Tailed Prospects**  
  *Time required: ~1 day per prospect*

  #### **Step 1: Simulate Outcomes**  
  - Run 1,000,000 Monte Carlo simulations of the prospect's net benefit.  
  - Record all outcomes, including extreme values. Use the same random seed for reproducibility.  

  #### **Step 2: Estimate Tail Indices**  
  - **Upper tail (benefit)**: Fit a Pareto distribution to the top 5% of *positive* outcomes using maximum likelihood. Estimate tail index \( \alpha_{\text{up}} \).  
  - **Lower tail (harm)**: Fit a Pareto distribution to the top 5% of *absolute negative* outcomes. Estimate tail index \( \alpha_{\text{down}} \).  
  - **Interpretation**:  
    - \( \alpha > 1 \): Finite mean for that tail.  
    - \( 0 < \alpha \leq 1 \): Infinite mean for that tail.  

  #### **Step 3: Diagnose Running Mean**  
  - Compute the cumulative mean (running mean) of the 1,000,000 outcomes in the order simulated.  
  - Plot the running mean against sample size (log-scale x-axis).  
  - **Diagnostic**:  
    - **Stabilizes** (converges to a horizontal line): Defined.  
    - **Monotonic drift** (to \( +\infty \) or \( -\infty \)): One-Sided Infinite.  
    - **Wild oscillations** (no convergence, large jumps): Undefined.  

  #### **Step 4: Classify the Prospect**  
  Based on tail indices and running mean:  
  - **Defined**: \( \alpha_{\text{up}} > 1 \), \( \alpha_{\text{down}} > 1 \), and running mean stabilizes.  
  - **Infinite-but-One-Sided**:  
    - *Positive Infinite*: \( \alpha_{\text{up}} \leq 1 \), \( \alpha_{\text{down}} > 1 \), running mean drifts to \( +\infty \).  
    - *Negative Infinite*: \( \alpha_{\text{up}} > 1 \), \( \alpha_{\text{down}} \leq 1 \), running mean drifts to \( -\infty \).  
  - **Undefined**:  
    - Both \( \alpha_{\text{up}} \leq 1 \) and \( \alpha_{\text{down}} \leq 1 \), and running mean oscillates.  
    - *Exception*: If tail indices conflict with running mean, prioritize running mean.  

  #### **Step 5: Assign Replacement Valuation**  
  - **Defined**: Use **sample mean** of simulations. Report 95% confidence interval via bootstrap.  
  - **Infinite-but-One-Sided**:  
    - *Positive Infinite*: Assign **\( +\infty \)**.  
    - *Negative Infinite*: Assign **\( -\infty \)**.  
    - *Repetition note*: Viable for Positive/Negative Infinite (LLN assures divergence).  
  - **Undefined**: **No numerical value**. Proceed to sensitivity analysis (Step 6).  

  #### **Step 6: Sensitivity Analysis for Undefined Prospects**  
  - **Truncation Sensitivity**:  
    - Compute truncated expected values at cutoff levels \( M = 10^3, 10^4, 10^5, 10^6 \):  
      \[
      \text{Truncated EV}(M) = \text{Mean of } \min(\max(\text{outcome}, -M), M)
      \]  
    - Report \( \text{Truncated EV}(M) \) for each \( M \) and its sign change (if any).  
  - **Order Sensitivity**:  
    - Resimulate outcomes sorted by: (1) ascending benefit, (2) ascending harm, (3) alternating benefit/harm.  
    - Report the range of cumulative means at 1,000,000 simulations across orderings.  
  - **Mirror Test**:  
    - Repeat analysis for the mirror prospect (benefit \(\leftrightarrow\) harm). Confirm valuations are opposites.  
  - **Ranking Undefined Prospects**:  
    - Compute difference \( \Delta = \text{Prospect}_A - \text{Prospect}_B \).  
    - Apply full procedure to \( \Delta \). If \( \Delta \) is Defined or One-Sided, use its valuation for ranking.  

  #### **Step 7: Committee Reporting**  
  - **Defined/One-Sided**: Provide valuation with diagnostics.  
  - **Undefined**:  
    - **Do not assign a value**. State: *"Expected value is undefined. Committee judgment required."*  
    - Submit sensitivity report:  
      - Table of \( \text{Truncated EV}(M) \) for various \( M \).  
      - Outcomes under different orderings.  
      - Key statistics: median, 90th percentile, probability of net benefit.  

  ---

  ### **Application to Cases**  

  #### **Case A: Grant with Heavy Tail on Benefit**  
  - **Tail indices**: \( \alpha_{\text{up}} \approx 0.8 \) (≤1), \( \alpha_{\text{down}} > 2 \).  
  - **Running mean**: Drifts to \( +\infty \).  
  - **Classification**: Positive Infinite.  
  - **Valuation**: \( +\infty \).  
  - **Repetition**: Supported (many grants \(\rightarrow\) average benefit \(\rightarrow \infty\)).  
  - **Committee report**: Fund. High upside captured via repetition.  

  #### **Case B: Intervention with \( \alpha \approx 0.9 \) on Benefit and Harm**  
  - **Tail indices**: \( \alpha_{\text{up}} \approx 0.9 \), \( \alpha_{\text{down}} \approx 0.9 \) (both ≤1).  
  - **Running mean**: Violent oscillations (±10^15).  
  - **Classification**: Undefined.  
  - **Sensitivity**:  
