          Example: Suppose the grant has payoffs that follow a symmetric stable distribution with index 0.9. Then the expectation is undefined. The truncated expectation T(M) for large M will be near zero (by symmetry). But if the distribution is asymmetric, then T(M) may approach a constant or oscillate? We must simulate.

     Case C: Flagship proposal with large positive expected value that is order-dependent.
          - This is likely undefined because the order-dependence suggests that the positive and negative parts both diverge.
          - Classification: undefined.
          - Valuation: We run the undefined procedure. We suspect that the large positive expected value they have is due to the order of summation in the simulation. We present a sensitivity analysis: 
              - Run the simulation multiple times with different random seeds and also with different orders (if the simulation is order-dependent, we might need to sample in a different way). 
