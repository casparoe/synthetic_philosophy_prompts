  Hmm, this is deeper than terminology. The user wants to understand why context flips the valuation. I recall Lakatos' distinction between "accommodation" (fitting existing data) versus "prediction" (foretelling new data), but that's not quite it - Mercury was known data yet still celebrated. 

  Ah! The key is whether the explanation emerged from core principles rather than ad hoc adjustments. When Einstein derived Mercury's anomaly from general relativity's foundations, it wasn't tweaked for that purpose - it fell out naturally. Whereas the grad student likely reverse-engineered parameters. 

  But wait - Darwin also aimed to explain biogeography, yet gets credit. So novelty matters too: if a fact was deeply puzzling (like Mercury violating Newton), resolving it carries more weight than matching mundane correlations. 

  The user might be conflating two issues: 1) epistemic strength (does fitting data confirm the theory?) and 2) sociological credit (why do scientists applaud some retro-dictions but not others?). For the first, Bayesian confirmation shows accommodating surprising data boosts credibility more. For the second, it's about perceived theoretical integrity - tuning feels cheap, principled derivation feels profound. 

  I should emphasize the "explanatory coherence" angle - theories get credit when they integrate disparate facts through deep mechanisms. That's why Mercury impressed: relativity didn't just fit the number, it revealed space-time curvature as the unifying cause. The grad student's correlation probably lacked that depth. 

  Also worth noting: if the "known fact" was historically a crisis for old theories (like UV catastrophe for classical physics), explaining it becomes a knockdown argument. Context is everything.
answer: |-
  You've hit on a deep and fascinating tension in the philosophy and practice of science! There **isn't a single perfect name** for this entire phenomenon, but the core concepts have well-established labels. The key lies in understanding *why* "aiming" sometimes helps and sometimes hurts.

  Here's the breakdown:

  1.  **The Basic Concept: Accommodation vs. Prediction**
      *   **Accommodation:** Explaining *already known* facts or data. This is what you're describing – fitting the theory to what we already know.
      *   **Prediction:** Successfully forecasting *novel* facts or data *before* they are observed or measured.

  2.  **Why Prediction is Usually Valued More (The Grad Student Case):**
      *   **The Problem of Ad Hoc Adjustments:** If a theory is built *specifically* to match a known fact, it risks being "tuned" or having arbitrary elements added *just* to make it fit that one piece of data. This feels less impressive because it could be seen as "curve-fitting" rather than revealing deep truth. A model with many adjustable parameters can often be forced to fit existing data without having genuine explanatory power for *new* situations. This is why your grad student friend got little credit – the model's fit seemed like a consequence of its flexibility and tuning, not its fundamental structure.

  3.  **Why Accommodation CAN Be Highly Valued (The Mercury Perihelion Case):**
      *   **Explanatory Depth and Coherence:** The triumph of General Relativity (GR) explaining Mercury's perihelion advance wasn't just that it fit the number. It was *how* it did it:
          *   **Derived from Core Principles:** The value fell out *naturally* and *inevitably* from the core equations of GR (Einstein's field equations), which were derived from deep principles about gravity, space, and time (equivalence principle, general covariance). Einstein wasn't "tuning" GR *for Mercury*; he derived the equations based on fundamental ideas, *then* realized they solved the Mercury problem.
          *   **Resolved a Persistent Anomaly:** Mercury's orbit was a known, long-standing problem ("anomaly") for Newtonian gravity. No satisfactory Newtonian explanation existed. GR didn't just fit the data; it *resolved a deep inconsistency* in the previous paradigm.
          *   **Non-Ad-Hocness:** The explanation wasn't tacked on; it was an intrinsic consequence of a radical new framework. The theory *committed* to a whole new view of spacetime curvature *before* anyone realized it solved Mercury.
          *   **Unification:** GR explained Mercury *in the same way* it explained falling apples and the bending of light – through the curvature of spacetime. This unified explanation is powerful.

  **The "Real Cut": What Determines the Credit?**

  You nailed the possibilities. Credit for accommodation depends on:

  1.  **Non-Ad-Hocness / Explanatory Depth:** Did the fact fall out *naturally* and *inevitably* from the core, fundamental principles of the theory? Or was it achieved by adding arbitrary assumptions or parameters specifically to match that fact?
      *   *High Credit:* Mercury in GR (core principle), Darwin explaining biogeography with common descent/natural selection (core mechanism).
      *   *Low Credit:* Grad student tuning parameters arbitrarily (ad hoc adjustment).
  2.  **The Nature of the Known Fact:**
      *   **Anomaly Status:** Was the known fact a deep, persistent problem for the *previous* theory? Resolving a major anomaly is hugely impressive, even if the fact was known. Mercury was a classic anomaly. A mundane correlation known for years isn't.
      *   **Surprisingness:** How surprising or improbable was the fact *given the background knowledge*? Accommodating a very surprising fact is more impressive than accommodating an obvious one.
  3.  **Theoretical Commitment:** What did the theory *have* to commit to in order to get this result? Did it require radical new assumptions or entities, or did it flow from a simple, elegant core? GR committed to curved spacetime – a huge, testable, non-ad-hoc commitment.
  4.  **When the Theorist Knew:** While not always decisive, *if* it can be shown the theorist derived the core theory *independently* and only *later* realized it explained the known fact/anomaly, this strongly boosts credibility (like Einstein and Mercury). If the fact was the explicit *target* during construction, it raises the suspicion of ad hocness unless the core principles are demonstrably fundamental and non-arbitrary.

  **Names for the Different Cases:**

  *   **Low-Credit Case:** This is often called **Ad Hoc Accommodation** or **Curve-Fitting**. The key criticism is that the explanation lacks **independent testability** or **explanatory depth** beyond fitting that specific data point. It's seen as **post hoc**.
  *   **High-Credit Case:** This is often described as the theory **Explaining an Anomaly** or providing a **Unifying Explanation**. The key positive is its **Non-Ad-Hocness**, **Explanatory Coherence**, and **Derivation from Fundamental Principles**. It demonstrates the theory's **explanatory power** and **fertility**.

  **Why "Aiming" Cuts Both Ways:**

  *   **Aiming as a Discount (Grad Student):** Here, "aiming" implies the *method* was likely ad hoc – tuning parameters specifically for *that* known outcome, sacrificing broader principles or predictive power for other things.
  *   **Aiming as a Triumph (Einstein):** Here, "aiming" refers to the *motivation* – recognizing a deep problem (the anomaly) and setting out to build a *fundamentally better theory* capable of resolving it. The triumph comes not from the aiming itself, but from *succeeding* in building a theory with such deep principles that the anomaly *had* to be resolved by them.

  **In Summary:**

  The real cut is **Explanatory Depth vs. Ad Hocness**. Accommodation is impressive when:

  1.  The explanation flows **naturally and necessarily from the core, fundamental principles** of the theory (non-ad-hoc).
  2.  The fact being explained was a **significant anomaly** for the previous theory.
  3.  The theory makes **novel, testable commitments** beyond just fitting that one fact.
  4.  The explanation **unifies** disparate phenomena under a single framework.

  Accommodation is unimpressive (or even suspicious) when it looks like the result of **arbitrary adjustments** made specifically to fit that data point, without deep connection to core principles and without generating novel predictions or unifying power. The Mercury case is a triumph *because* Einstein built a theory based on deep principles, and those principles *demanded* the correct Mercury precession. The grad student case is unimpressive *because* the fit likely resulted from flexible parameters tuned *directly* to match the known correlation, without necessarily revealing anything deeper.
