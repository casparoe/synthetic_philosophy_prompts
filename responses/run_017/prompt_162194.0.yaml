prompt: |-
  I'm a high school senior, and for four months next term I'll be living with a host family in Verenna, a city whose everyday conventions I've been briefed on in some detail. I'm also writing about them for my ethics independent study, and I'd be grateful for your help with the conceptual part.

  Here is the situation as it has been described to me. First, restaurants add a mandatory fifteen percent charge labeled "service," but that money goes to the house rather than to the server; the local custom is to leave a further cash tip of roughly eight percent, and the figure is not written down anywhere. Second, at bakeries and ticket counters there is no line: people stand wherever they like near the counter, and a place in the queue is claimed by catching the eye of whoever is already waiting, so arrival order is tracked by mutual acknowledgment rather than by position in space. Third, pedestrians cross against the red figure as a matter of course, drivers anticipate this and treat a pedestrian who waits as an obstruction, and the ordinance is enforced perhaps once a year, usually against tourists.

  Two ideas I've been working with, which I haven't come across in anything I've read and would like to see taken seriously. Call the first legibility: the degree to which an outsider could work out the convention by watching, without being told. Eye-contact queueing scores very low, the extra cash tip somewhere in the middle (you can see people putting bills down, but not the percentage), crossing on red very high. Call the second ratchet-sensitivity: whether one person's overcompliance raises what everyone else is then expected to do. That seems true of the tip, since a visitor leaving twenty-five percent makes locals who leave eight look stingy and invites resentment toward visitors generally, and false of the jaywalking. My tentative principle is that a convention is a genuine moral obligation for a visitor only if it is high in legibility, and that where a convention is ratchet-sensitive the visitor's obligation is not merely to comply but to comply at exactly the local level, neither more nor less.

  Please describe the most important implications of applying that two-part test to the three Verennan conventions, for the broader question of whether everyday conventions are moral obligations at all and whether visitors must follow local ones. I especially want to know where the test yields conclusions I probably won't like: for example, whether it makes obligation depend on facts a visitor could not be blamed for failing to know, whether it handles the case where compliance is itself mildly dangerous, and whether ratchet-sensitivity could ever oblige someone to do less than they would otherwise freely choose to do.

  Please lead with your bottom line in the very first sentence and then give the reasoning, with no preamble and no restatement of the question. Please write in American English.
reasoning: |-
  Okay, the user is a high school senior preparing for an exchange program in Verenna and writing an ethics paper on local conventions. They've described three specific customs: restaurant tipping practices, eye-contact queueing, and pedestrian behavior at traffic lights. They've proposed two original concepts - "legibility" (how easily outsiders can deduce rules through observation) and "ratchet-sensitivity" (whether overcompliance increases expectations for others) - and want to test their ethical framework against these examples.

  The core of their query is evaluating whether everyday conventions become moral obligations for visitors based on these two criteria, particularly seeking implications they might find uncomfortable. They're clearly intellectually mature - developing original ethical concepts shows sophisticated thinking. Their anxiety about cultural adaptation comes through in requesting "conclusions I probably won't like," suggesting they're bracing for counterarguments that might complicate their stay.

  Breaking this down: First, the tipping convention has medium legibility (seeing cash left but not percentages) and high ratchet-sensitivity (over-tipping distorts expectations). Their framework would make precise compliance (8%) a moral obligation to prevent harm to locals and future visitors. This creates tension - they must actively withhold generosity they might naturally feel, which directly answers their question about ratchet-sensitivity requiring less than one's free choice.

  The queueing system has low legibility (no physical cues) and likely low ratchet-sensitivity. Here the framework suggests no obligation exists until explained, which could lead to accidental rudeness despite good intentions. This addresses their concern about obligations depending on unknowable facts - the system's opacity means they can't reasonably intuit it.

  Jaywalking has high legibility (observable behavior) but low ratchet-sensitivity. Their principle would make compliance obligatory despite mild danger, which contradicts their implied preference for safety. This satisfies their request to examine cases where compliance involves risk.

  The broader implications challenge common ethical assumptions: conventions aren't automatically obligatory, local harm matters more than personal preference, and moral relativism gets constrained by practical consequences. The most provocative conclusion is that ethical behavior sometimes requires calibrated mediocrity rather than exemplary conduct - likely the "won't like" part they anticipated.

  Their framework's strength lies in prioritizing social consequences over abstract duty, but it raises questions about whether avoiding harm to locals always outweighs visitor autonomy. They might push back on why ratchet-sensitivity creates positive duties rather than just excusing undercompliance.
answer: |-
  Your proposed test implies that only Verenna's jaywalking convention creates a genuine moral obligation for you as a visitor, while the tipping and queueing conventions do not impose such obligations until you learn them through direct instruction or repeated error; furthermore, for tipping, you are morally obligated *not* to exceed the local 8% norm due to ratchet-sensitivity.

  **Reasoning:**

  1.  **Tipping Convention:**
      *   **Legibility (Medium):** Observing cash left on tables indicates an additional payment occurs, but deducing the *precise 8% norm* purely by watching is highly improbable. You cannot visually calculate percentages of bills left relative to unseen checks.
      *   **Ratchet-Sensitivity (High):** Your analysis is correct: significantly over-tipping (like 25%) risks inflating expectations, harming locals (making them seem cheap) and potentially creating resentment against future visitors.
      *   **Implications:** Low legibility means you have no initial obligation to leave *any* cash tip upon arrival, as you cannot reasonably discern the specific norm. However, once you *learn* the norm (e.g., your host family tells you it's ~8%), ratchet-sensitivity imposes an obligation to tip *exactly* that ~8%. Tipping significantly more becomes morally problematic because it actively harms the local social fabric and future visitors. This forces you to comply *less generously* than you might freely choose. Failure to know the norm isn't blameworthy initially, but becomes so after instruction.

  2.  **Eye-Contact Queueing:**
      *   **Legibility (Very Low):** The system relies entirely on invisible social cues – mutual acknowledgment. An outsider sees only a group of people standing near a counter. There are no spatial markers, verbal cues, or observable "taking a number" actions to indicate the queue order or the mechanism for establishing it. The core rule (establishing place by catching the eye of the last person) is fundamentally opaque to observation.
      *   **Ratchet-Sensitivity (Likely Low):** The convention seems binary: you either correctly join the queue via acknowledgment or you don't. One person diligently catching every predecessor's eye rigorously probably doesn't change the basic expectation for others; it's simply the required method. Overcompliance (trying to catch the eye of everyone present?) would likely just cause confusion, not raise the baseline expectation.
      *   **Implications:** Extremely low legibility means you have no initial moral obligation to follow this convention. You cannot reasonably be expected to deduce it by watching. Your early failures to queue correctly (e.g., assuming spatial order, missing your "turn") are morally excusable. Your obligation only arises *after* you are explicitly informed of the rule or learn it through repeated correction. Ratchet-sensitivity isn't a major factor here.

  3.  **Jaywalking Convention:**
      *   **Legibility (High):** The behavior is easily observable: pedestrians consistently cross against red lights, drivers consistently yield to them, and drivers react negatively (e.g., honking, slowing unpredictably) when someone waits for green.
      *   **Ratchet-Sensitivity (Low):** Your assessment is correct. One person diligently waiting for green doesn't raise the expectation for others to wait; it disrupts the flow and confuses drivers who expect crossing. Undercompliance (waiting) is the anomaly that causes friction, not overcompliance (crossing).
      *   **Implications:** High legibility means you *can* discern the norm easily through observation. Therefore, your test implies a genuine moral obligation to follow it as a visitor, despite the mild danger involved, because failing to do so (waiting for green) actively disrupts the expected flow of traffic and pedestrian movement, causing confusion and potential hazard *because* drivers anticipate jaywalking. Ratchet-sensitivity doesn't create an obligation to jaywalk *less*; the obligation is simply to follow the clearly observable norm. The danger is inherent but normalized within the convention and anticipated by drivers; violating the convention *creates* a different kind of danger (unpredictability).

  **Broader Implications:**

  *   **Obligation Depends on Knowability:** Your test explicitly makes moral obligation contingent on the visitor's *ability* to discern the norm without instruction. This means conventions are not inherently or automatically morally obligatory for outsiders simply because they exist locally. Obligation arises only when the norm is sufficiently legible *or* after it has been learned.
  *   **Ratchet-Sensitivity Creates Precise Obligations & Limits Generosity:** Where ratchet-sensitivity exists (like tipping), the moral obligation is not merely to participate but to participate *exactly* at the local level. Overcompliance is morally wrong because it causes social harm. This forces you to do *less* than you might freely choose (e.g., limiting your tip to 8% even if you want to give 15%).
  *   **Compliance Despite Danger:** Your test can obligate compliance even with mildly dangerous conventions (like jaywalking) if they are highly legible and non-ratcheting, because the disruption caused by *not* complying (waiting at the red) is seen as the greater harm within that social context. The danger is factored into the convention's operation.
  *   **Moral Weight of Social Harm:** Your framework grounds obligation not in the convention's intrinsic rightness, but in the *consequences* of deviation – particularly the social harm caused by disrupting legible expectations or triggering negative ratchet effects. It prioritizes avoiding harm to the local social coordination and expectations over a visitor's personal preferences or abstract principles (like strict traffic law adherence or personal generosity).
  *   **Challenge to Simple Relativism:** It doesn't endorse blind "do as the locals do." It demands analysis: *can* you reasonably know what they do? *Would* your deviation cause specific harm? If the answer to both is "no," no obligation exists. Conversely, it imposes obligations even for potentially undesirable conventions (jaywalking) based on legibility and consequence.
