answer: |-
  Here are seven numbered desiderata for evaluating historical violence levels, tailored to your purpose:

  1.  **Per-capita normalization (non-negotiable):** The measure must account for population size, prioritizing the risk of violent death experienced by an average individual over total aggregate numbers. *Case:* A larger population experiencing the same per-capita violence rate means more total suffering and death; policies reducing individual risk (e.g., improved policing, social programs) are meaningful even if total deaths rise due to population growth. Ignoring this inflates past violence and obscures genuine safety improvements.

  2.  **Comprehensive boundary inclusion (non-negotiable):** The definition of violence must encompass all intentional or readily preventable bodily harm causing death or severe suffering, including state-sanctioned acts (executions, colonial violence, slavery), interpersonal violence (homicide, domestic abuse), and deaths from remediable deprivation (famine amidst plenty). *Case:* Excluding categories like colonial violence or domestic abuse systematically biases the assessment in favor of specific historical actors (e.g., states) or settings (public vs. private), distorting policy comparisons by hiding significant sources of harm.

  3.  **Explicit handling of evidence uncertainty (non-negotiable):** The account must transparently address the severe limitations and incomparabilities of sources (e.g., coroners' rolls vs. vital registration) by quantifying uncertainty ranges, using multiple proxies where direct data is absent, and avoiding over-interpretation of sparse evidence. *Case:* Without this, trends based on fragmentary or biased historical data cannot be reliably compared to modern comprehensive data, rendering policy inferences from past trends speculative or invalid. This directly challenges simplistic archaeological baseline comparisons.

  4.  **Accounting for displacement and deferral (non-negotiable):** The measure must consider violence geographically exported (e.g., colonial wars, outsourcing production to conflict zones) or temporally deferred (e.g., structural violence causing later death, environmental damage from war). *Case:* Policies appearing to reduce violence locally may merely shift it elsewhere or delay it, offering no real global safety improvement. Ignoring displacement falsely credits states achieving internal peace through external aggression or exploitation (state-monopoly account weakness).

  5.  **Clustering-neutrality (preference):** The measure should treat a given number of violent deaths equivalently, regardless of whether they occur in many small incidents or one large massacre/war. *Case:* Accepting neutrality focuses policy on *total harm reduction*; rejecting it prioritizes reducing *catastrophic events* (wars) over endemic violence (homicide). Costs: Rejecting it aids civilizing-process arguments equating reduced war with progress, while accepting it may undervalue the unique societal disruption of mass events.

  6.  **Acknowledged aggregation ambiguity:** There is no single "fact of the matter" about the level of violence; it is a constructed index weighting diverse harms (death, injury, psychological trauma, coercion) across included categories. The thesis "world has become less violent" asserts that under a *defensible*, *practically relevant* weighting scheme prioritizing severe physical harm and death, the aggregate trend shows significant decline, supporting identifiable causal mechanisms amenable to policy.

  7.  **Fundamental tension & key excluder:** **Per-capita normalization** (1) and **Accounting for displacement/deferral** (4) are difficult to jointly satisfy for global assessments, as per-capita safety gains in core regions may coincide with exported violence elsewhere. The **Comprehensive boundary inclusion** (2) desideratum does the most work in excluding current accounts: it directly challenges the state-monopoly account (ignores state violence externally/colonially), the civilizing-process account (neglects non-public/"uncivilized" violence like domestic abuse), and archaeological baselines (excludes structural/economic violence).
