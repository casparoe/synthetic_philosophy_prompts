  For the seven items: First five are core desiderata. I'll start with denominator since it's foundational—per capita safety matters for policy, but ignoring total scale misses systemic risks. Non-negotiable because policies affect populations dynamically. 

  Boundary definition is messy. Capital punishment vs. crime, colonial violence—if excluded, it favors state-monopoly theories. Non-negotiable; otherwise, comparisons are dishonest. 

  Evidence comparability is tough. Medieval records undercount, modern systems overcount certain deaths. Must require transparency about uncertainty. Non-negotiable for honest trends. 

  Displacement is crucial. A policy might reduce local violence by exporting it (e.g., outsourcing executions). Non-negotiable for causal claims. 

  Their clustering-neutrality idea—interesting. If two deaths in separate bar fights equal one double homicide, does that mean violence "level" is identical? I think they're right: clustering often reflects system failures (e.g., war), so ignoring it hides escalation risks. But weighting clusters heavier isn't neutral either. Best to call it a preference—though rejecting it might aid civilizing-process accounts that prize reduced brawling over wars. 

  Item six: Is there a fact of the matter? Probably not—it's a weighted index. The thesis then asserts that under defensible weights, violence decreased. 

  Finally, the tension: Denominator and displacement clash. Per capita safety (denominator) might improve while exported violence (displacement) worsens, making "global decline" claims fragile. And the most exclusionary desideratum? Boundary definition—it torpedoes accounts that ignore colonial/domestic violence. 

  ...Wait, did I cover all their asks? Double-checking: denominator (item 1), boundary (2), evidence (3), displacement (4), clustering (5), aggregation (6), conflict/selector (7). Yes. And marked non-negotiable vs. preference where applicable. 

