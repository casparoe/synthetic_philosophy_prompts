  Game Flow:

  1. Setup (5 minutes):
     - Assign roles: 4 Builders, 4 Shoemakers, 4 Farmers, 4 Weavers. 
     - Give each a role card and a need card. The need card specifies which one of their three required goods they have a high need for (double). The other two are normal (1). [We can pre-assign to avoid drawing time]
     - Initial endowment: 5 tokens of their own good, 0 of others.
     - Each player gets a tracking sheet to record their goods and points.

  2. Rules explanation (5 minutes):
     - Each round has 3 phases: Production, Trading (5 minutes), Consumption.
     - Production: Add 1 token of your own good to your stock.
     - Trading: You have 5 minutes to trade with others. Negotiate trades (e.g., "I give you 1 Housing for 2 Grain"). Record trades on your sheet.
