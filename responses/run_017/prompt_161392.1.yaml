          - Did it feel fair that the same good traded at different rates to different people? (Probably not, by modern standards.)
          - What would make it feel fair? (If there was a standard price, i.e., money.)
          - Then introduce Aristotle: he thought that need (chreia) is the common measure that makes goods commensurable. Without it, exchange is arbitrary. But with money, we have a conventional representation of need. However, Aristotle also thought that the just exchange rate depends on the relative status of the traders (diagonal conjunction) — which we might not have captured well. In the game, the exchange rate varied because of individual need, not because of the relative worth of the producers. So that part might be missing.
