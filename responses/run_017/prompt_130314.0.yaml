prompt: |-
  I want a specification, not a survey. Fix the purpose narrowly: an account of the will of the people good enough to adjudicate, in real time and before any vote is held, a politician's claim to speak for the people — to say whether she speaks truly or merely speaks for a faction.

  Write the desiderata such an account must meet. For each, give the case that makes it a requirement, and mark it non-negotiable or merely the preference of one camp. Among the cases I want it to earn its keep on: the inter-electoral claim itself, which forces the question whether the will can be identified independently of any procedure and, if so, how that identification is not simply arbitrary; scale-fragmentation, where a majority rejects every component of a package yet approves the package as a whole, so that issue-by-issue and holistic aggregation come apart; the silent and the misinformed — non-voters, and preferences formed under systematic misinformation — which forces a choice between the will people actually have and the will they would have under better information; the bearer question, whether the people are residents, citizens, those subject to coercion, or future generations, and whether the bearer survives a large change in its own membership; intensity, where 51 per cent are mildly for and 49 per cent intensely against, together with cycling and agenda-order cases in which no stable majority exists at all; and self-binding, where a people wills a constitution that later blocks what it now wants.

  Flag any pair of desiderata you take to be jointly unsatisfiable, say which one is really a prejudice of a particular camp rather than a genuine requirement, and identify the single requirement that excludes the largest share of otherwise plausible theories. Close with one or two lines each on how four families fare: aggregative-procedural accounts, the general-will tradition, deliberative or counterfactual-will accounts, and constructivist views on which the people exist only in being invoked. A table is fine for the list. Lead with your bottom line — the excluding requirement and the unsatisfiable pair — in the first sentence, then give the requirements; no preamble and no restating of the question.
reasoning: |-
  Hmm, this user wants a very precise specification for determining the "will of the people" that could adjudicate a politician's claim in real-time before any vote. They've outlined several challenging cases to test such a system. 

  The user seems deeply familiar with political philosophy - they're using technical terms like "scale-fragmentation" and "self-binding" with ease. Probably an academic or policy researcher working on democratic theory. Their tone is impatient ("not a survey"), suggesting they've seen too many vague discussions of this topic. 

  Key challenges they want addressed:
  - The fundamental paradox of claiming to know the people's will without formal procedures
  - How to handle bundled policies where overall approval contradicts component rejection
  - Dealing with non-voters and misinformed citizens
  - Defining who "the people" even are
  - Intensity problems and voting paradoxes
  - Self-binding constitutional dilemmas

  For the desiderata, I need to identify which are absolute requirements versus partisan preferences. The joint unsatisfiability point is crucial - they want me to call out inherent contradictions. The "excluding requirement" must come first as they instructed. 

  Biggest tension seems between "Procedural independence" (needing pre-procedural will assessment) and "Aggregation coherence" (requiring stable majorities that may not exist). Many democratic theories founder on this rock. 

  For the four families:
  - Aggregative approaches fail the coherence test with cycling/agenda issues
  - General will traditions struggle with scale-fragmentation
  - Deliberative models can't handle real-time needs 
  - Constructivists collapse when pressed on misinformed preferences

  The table format will work best for clarity. Must avoid any preamble per their strict instructions. Need to mark which requirements are non-negotiable versus contested - intensity measurement and bearer definition seem most debatable.
answer: |-
  **Bottom line first:** The excluding requirement is *Procedural Independence*; the unsatisfiable pair is *Procedural Independence* and *Aggregation Coherence*, with *Aggregation Coherence* being a prejudice favoring aggregative theories over constructivist or deliberative ones.

  | Desideratum                                                                 | Case Driving Requirement                                                                                                                               | Non-Negotiable (NN) / Contested (C) | Reason for Requirement                                                                                               |
  | :-------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------- | :------------------------------------------------------------------------------------------------------------------- |
  | **1. Procedural Independence**                                              | **Inter-Electoral Claim**: Adjudicating claims *before* any vote requires identifying the will independently of voting procedures.                      | **NN**                              | Core function: Must exist prior to & validate procedures, not be defined by them.                                   |
  | **2. Real-Time Assessability**                                              | **Inter-Electoral Claim**: Requires assessment *before* a vote is held to judge the claim.                                                             | **NN**                              | Practical necessity for the stated purpose; delayed assessment defeats the adjudication goal.                       |
  | **3. Non-Arbitrariness**                                                    | **Inter-Electoral Claim**: Avoids replacing the politician's claim with an equally arbitrary counter-claim.                                            | **NN**                              | Essential for legitimacy; the identification method must be defensible, not subjective assertion.                   |
  | **4. Scale Compatibility**                                                  | **Scale-Fragmentation**: Must distinguish between holistic will (approve package) and fragmented will (reject components).                             | **NN**                              | Real-world policies are bundles; the will must account for gestalt vs. atomized preferences.                        |
  | **5. Epistemic Correction**                                                 | **Silent & Misinformed**: Forces choice: actual preferences (misinformed) or counterfactually informed preferences? Requires a principled stance.      | **C** (Actualist vs. Idealist camps) | Determines if "will" reflects current state or rational ideal; impacts legitimacy source (consent vs. truth).       |
  | **6. Bearer Definition**                                                    | **Bearer Question**: Who constitutes "the People" (citizens, residents, subjects)? Must be defined non-circularly.                                     | **C** (Scope camps)                 | Crucial for attribution; unresolved definition makes "will" incoherent.                                             |
  | **7. Temporal Persistence**                                                 | **Self-Binding**: Can "the People" will a constraint binding its future self? Must reconcile continuity vs. present sovereignty.                       | **NN**                              | Addresses constitutional democracy's core paradox; requires a theory of collective identity over time.              |
  | **8. Intensity Sensitivity**                                                | **Intensity**: Must distinguish mild majority support from intense minority opposition to avoid tyranny of the apathetic majority.                    | **C** (Majoritarian vs. Liberal camps) | Captures qualitative depth of preference; ignoring intensity risks severe injustice/miscalculation.                 |
  | **9. Aggregation Coherence**                                                | **Cycling/Agenda-Order**: Must yield a stable, non-arbitrary outcome despite preference cycles or manipulable agendas.                                | **C** (Aggregative camp prejudice)  | Assumes a coherent "will" exists independent of aggregation path; denies constructivist/chaos critiques. **UNSATISFIABLE WITH PROCEDURAL INDEPENDENCE** |
  | **10. Non-Partisan Attribution**                                            | **Core Function**: Must distinguish speaking for "the People" vs. a faction. Requires a threshold for generality/supermajority.                        | **NN**                              | Definitional for the purpose; fails if it validates factional claims as popular will.                               |

  **Joint Unsatisfiability:** *Procedural Independence* (NN) and *Aggregation Coherence* (C) are jointly unsatisfiable. *Procedural Independence* demands a pre-procedural "will," while *Aggregation Coherence* assumes stable, path-independent preferences exist and can be discovered—denying Arrow’s theorem and social choice chaos. *Aggregation Coherence* is a prejudice of aggregative-proceduralist camps, ignoring how procedures *construct* outcomes.

  **Family Assessment:**
  1.  **Aggregative-Procedural:** Fails *Procedural Independence* & *Real-Time Assessability*; requires votes. Struggles with *Scale Compatibility*, *Intensity*, *Cycling*.
  2.  **General-Will (Rousseauian):** Strong on *Non-Partisan Attribution* & *Temporal Persistence* via general interest. Fails *Epistemic Correction* (assumes virtuous citizens), *Scale Compatibility* (holistic only), *Aggregation Coherence* (rejects aggregation).
  3.  **Deliberative/Counterfactual:** Addresses *Epistemic Correction* & *Non-Arbitrariness* via ideal discourse. Fails *Real-Time Assessability* (needs hypotheticals), *Bearer Definition* (vague participants), *Aggregation Coherence*.
  4.  **Constructivist (e.g., "The People is invoked"):** Meets *Procedural Independence* (will is performative). Fails *Non-Arbitrariness* (risk of demagoguery), *Temporal Persistence* (no continuous entity), *Non-Partisan Attribution* (any invocation counts).
