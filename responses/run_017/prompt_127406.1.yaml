answer: |-
  ## Sestina for Supererogation

  She knows the measure of the debt she came to **owe**,
  The contract signed in flesh, the lines drawn tight.
  Beyond that mark, she finds the space to **give**
  A surplus born of choice, not dread of **blame**.
  No sanction waits if she withholds this **grace**,
  But hearts ignite when she pours past **enough**.

  What constitutes the boundary of **enough**?
  Is duty's ledger all we truly **owe**?
  Or does some silent, higher call show **grace**,
  Inviting more? To hear it is to **give**
  A portion unforeseen, escape all **blame**,
  And earn the startled world's astonished **praise**.

  But watch the saint who gathers constant **praise**!
  Her every extra mile redefines **enough**.
  Does yesterday's free gift become today's **owe**?
  Does expectation harden when we **give**
  So freely? Does the absence now draw **blame**
  Where once mere presence was considered **grace**?

  They murmur: "Look, she offered so much **grace**
  Before! Why stop?" The whispered hint of **blame**
  Creeps near the space where once rang only **praise**.
  Has her free gift become the new **enough**?
  Is kindness now a debt we're forced to **give**?
  A tax extracted from the saint we **owe**?

  This chilling thought: that what we freely **owe**
  To none but love, might calcify to **grace**
  Demanded. Must we ration how we **give**
  Lest expectation twist the bond we **owe**
  Into a chain? Is there no stable **enough**
  Immune to shifting tides of **praise** or **blame**?

  Ah, no. The fault lies not in earned **praise**,
  Nor in the saint who pours beyond **enough**.
  The ratchet clicks *within* the gaze that seeks to **blame**
  Her pause. It is *their* shrinking measure, **grace**
  Misread as duty, turning gift to **owe**,
  That builds the cage around the will to **give**.

  True freedom blooms where none demand you **give**
  More than the settled terms. Absence? No **blame**.
  Presence beyond? A shock of purest **grace**,
  A quiet thunder earning soft **praise**.
  The baseline holds firm: duty is **enough**.
  The surplus is the gift you never **owe**.

  **(Envoy)**
  The saint **give**s freely, knowing **owe**d is **enough**.
  Let none assign her pause the slightest **blame**,
  Nor let **praise** harden **grace** to debt. Hold fast! Let **grace** hold **enough**.

  ---

  **Contested Reading & Liberties:**

  This poem commits to a **non-shifting obligation interpretation** of supererogation, specifically aligning with thinkers like David Heyd who argue that supererogatory acts do *not* inherently alter the baseline of duty ("enough"). The "ratchet" effect is presented as a *misinterpretation* or *social pressure* ("fault lies... *within* the gaze"), a confusion born from observers mistaking freely given grace for incurred obligation. The baseline ("drawn tight," "settled terms") remains fixed; the problem arises when the *community* misconstrues the supererogatory act, potentially creating expectations that *feel* like new duties but are not logically entailed.

  **Liberties Taken:**

  1.  **Personification & Agency:** The poem gives significant agency to "grace" itself ("let grace hold enough"). While grace is the *act* or *quality*, the poem treats it almost as a protective force resisting conversion, emphasizing its essential freedom. This is poetic license to embody the *concept's* defining characteristic.
  2.  **The Role of Gratitude:** While implied in "hearts ignite" and "earn... praise," the poem doesn't explicitly develop the crucial role of *gratitude* as the *correct* response to supererogation (as opposed to expectation). The envoy's command ("Let none assign...") indirectly addresses this, but the focus is on preventing misattribution of blame/obligation rather than elaborating on the positive dynamic of gratitude. This simplifies the counter to the ratchet.
  3.  **The Saint's Motivation:** The poem focuses on the *external* mechanics of praise, blame, and shifting expectations. It doesn't delve into the saint's internal motivation (e.g., love, altruism) beyond "choice, not dread" and "freedom," keeping the focus on the philosophical structure rather than psychology.

  The sestina's relentless rotation enacts the constant pressure and potential for these six concepts to redefine each other, culminating in the envoy where the crowding words force the critical assertion: grace must *not* be mistaken for owed duty, and the space for "more-than-enough" must remain open, held by the very nature of grace itself against the encroachment of blame and obligation.
