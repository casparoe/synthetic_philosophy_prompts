  Your colleague's rulings suggest two core principles about how higher-order knowledge affects strategic behaviour. A third principle emerges from tensions in the cases, but it is less consistent. Here, I outline them neutrally before applying them.

  1.  **Principle of Epistemic Hierarchy Collapse (EHC)**  
      *Summary*: When common knowledge (infinite mutual knowledge) is absent—even with arbitrarily high finite mutual knowledge—inductive arguments (e.g., backward induction, muddy children reasoning) fail entirely if they rely on unbounded higher-order knowledge. Finite depths do not approximate common knowledge; they are qualitatively distinct.  
