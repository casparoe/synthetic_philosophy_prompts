  2.  **Principle of Uncertainty-Driven Cooperation (UDC)**  
      *Summary*: Small uncertainties (e.g., about types or knowledge) disrupt backward induction and enable cooperation in finite games if they create mutual incentives for reciprocity. The threshold for "small" is context-dependent, and probabilities are not dismissed as negligible.  
