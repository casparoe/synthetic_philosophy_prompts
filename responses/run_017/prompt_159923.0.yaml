  - **1B → 2C → 3B** (any 4/5): **Vacant due to incoherence**  
    Why? If damage halts computation (2C), the system can’t have a "real" evolutionary purpose (3B). Historically defended, but now seen as inconsistent.  
  - **1B → 2C → 3C** (any 4/5): **Vacant due to unattractiveness**  
    Why? Claiming all program descriptions are equal (3C) while denying computation in damage (2C) implies a system can be "non-computing" while satisfying infinite programs. Few endorse this.  

