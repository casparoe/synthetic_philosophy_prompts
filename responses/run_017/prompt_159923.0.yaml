  Based on your specifications, here's the interactive decision tree for your sidebar. It guides readers through five concrete questions, resulting in one of eight philosophical positions—each with a clear label and awkward commitment. The tree avoids undefined jargon and ensures every path ends at a named (or unnamed) stance.

  ### **Decision Tree Instrument**
  **Starting Point**: You accept that neuroscientists’ descriptions of neural circuits track real causal structure.  
  **How It Works**: Answer each question based on intuition. Your choices lead to a final position.

  ---

  #### **Question 1: The Rock**  
  An ordinary rock can be mathematically mapped to any computer program (e.g., by assigning its temperature changes to "0s" and "1s" in a calculation). Does the rock genuinely compute?  
  - **A**: Yes, it computes.  
  - **B**: No, it doesn’t compute.  

  #### **Question 2: The Damaged Circuit**  
  A calculator circuit outputs "5" for 2+2 after damage. Is it still computing?  
  - **A**: Yes, the original function (just with errors).  
  - **B**: Yes, but a new function (e.g., "always output 5").  
  - **C**: No—it’s broken, not computing.  

  #### **Question 3: The Ambiguous Circuit**  
  An intact circuit can be truthfully described as running *different* programs (e.g., "adding numbers" or "comparing voltages"). Which is the "real" computation?  
  - **A**: The one useful to humans (e.g., for prediction).  
  - **B**: The one evolution/history designed it to do.  
  - **C**: All are equally valid—no "real" computation.  

  #### **Question 4: Cognition’s Core**  
  For a system to be cognitive, must its internal states be *about* something (e.g., neurons firing for "apple"), or is structured cause-effect physics enough?  
  - **A**: States must be *about* things (semantics).  
  - **B**: Structured cause-effect is enough (syntax).  

  #### **Question 5: Silicon Replacement**  
  If each neuron is replaced with a silicon chip matching its input-output signals, does cognition survive?  
  - **A**: Yes.  
  - **B**: No.  

  ---

  ### **Resulting Positions (Leaves)**  
  Based on your path, you’ll land at one of these stances. Each reveals a key challenge for the position.  

  | Your Path (A/B/C) | Position & Label                          | Awkward Commitment                                                                 |
  |-------------------|-------------------------------------------|------------------------------------------------------------------------------------|
  | **1A**            | **Pancomputationalism**                   | A falling leaf computes Shakespeare; distinctions between rocks and brains vanish. |
  | **1B → 2A → 3B → 4A → 5A** | **Computational Realism**       | A broken calculator still "computes addition" even when outputting gibberish.      |
  | **1B → 2A → 3B → 4A → 5B** | **Biological Computationalism** | Cognition vanishes in silicon, despite identical cause-effect organization.        |
  | **1B → 2B → 3B → 4A → 5A** | **Functionalist Computationalism** | A damaged circuit computing "2+2=5" is running a *new* valid function.            |
  | **1B → 2B → 3A → 4B → 5A** | **Connectionism**              | Brains compute, but without symbols; explaining language or logic is tricky.       |
  | **1B → 2B → 3A → 4A → 5A** | **Interpretivism**              | Computation is a metaphor; no fact of the matter without human interpretation.     |
  | **1B → 2C → 3A → 4A → 5B** | **Dynamical Systems (Representational)** | Cognition is dynamic, not computational; brains "resonate," but meaning persists.  |
  | **1B → 2C → 3A → 4B → 5B** | **Dynamical Systems (Non-Representational)** | Brains are fluid interactions; explaining abstract thought without symbols is hard. |

