answer: |-
  Here’s a requirements list for a theory of self-amending rules, derived from the hard cases in Maraval. Each requirement is grounded in a specific paradox or distinction the theory *must* resolve to avoid collapsing key concepts. I’ll flag genuine desiderata vs. biases and note inconsistencies.

  ---

  ### **Core Requirements (Non-Negotiable Distinctions)**
  1. **Validity vs. Efficacy**  
     - *Case:* The 2048 amendment was *efficacious* (accepted/operational for 7 years) but its *validity* is challenged in 2055.  
     - *Requirement:* The theory must distinguish between a rule’s legal validity (under the system’s criteria) and its social efficacy/acceptance. Collapsing these makes the 2055 court’s dilemma nonsensical.

  2. **Amendment vs. Revolution (Continuity of Legal Order)**  
     - *Case:* Did the 2048 changes (repealing entrenchments + Art. 18) amend the constitution or replace it?  
     - *Requirement:* Must provide criteria for when an amendment destroys the legal order’s foundational authority (e.g., severing the chain of validity) vs. operating within it.  
     - *Trigger:* Explicit repudiation of the amendment power’s source (e.g., Art. 18 denying the Charter’s supremacy) may tip into revolution.

  3. **Procedural vs. Substantive Limits**  
     - *Case:* Art. 15’s limit ("no abolition of universal suffrage") lacks an enforcer. Can the Assembly "amend" it via Art. 12?  
     - *Requirement:* Must explain whether substantive limits are legal constraints (voiding non-compliant amendments) or political/moral exhortations. Art. 13’s entrenchment is procedural; Art. 15 is substantive—theory can’t treat them identically.

  4. **Self-Entrenchment vs. Self-Application**  
     - *Case:* Art. 13 (entrenching Art. 12) vs. Art. 18 (self-applying interpretive supremacy).  
     - *Requirement:* Self-*entrenchment* (a rule shielding itself) ≠ self-*application* (a rule governing its own interpretation). Art. 18 creates a liar paradox ("Is Art. 18 valid if the Assembly ‘interprets’ it away?"); Art. 13 creates a conflict with Art. 17. Theory must handle both.

  5. **Authorization Gaps (Successor Rules’ Authority)**  
     - *Case:* Art. 17 authorized its own repeal. After repeal, where does the new simple-majority rule’s authority come from?  
     - *Requirement:* Must resolve the "bootstrapping problem": how a rule created under a now-repealed authority retains validity. *Exclusionary work:* This is the most critical requirement—failure here collapses the system’s continuity.

  6. **Liar Paradoxes (Self-Defeating Amendments)**  
     - *Case:* A hypothetical Art. 19 ("No amendment under Art. 12 is valid") or Art. 18 self-invalidating.  
     - *Requirement:* Must address self-referential contradictions without resorting to extra-legal principles. Art. 18 makes the constitution self-absorbing; theory must say if that’s valid, void, or transformative.

  ---

  ### **Genuine Desiderata vs. Biases**  
  - **Genuine Desiderata** (What the theory *must* do):  
    - Resolve authorization gaps (Requirement 5).  
    - Distinguish amendment from revolution (Requirement 2).  
    - Handle liar-like paradoxes without evasion (Requirement 6).  
    - Explain validity/efficacy splits (Requirement 1).  
    - Accept *underdetermination* where rules conflict irreducibly (e.g., Art. 13 vs. Art. 17). This isn’t a cop-out; it’s honest where the system provides no answer.  

  - **Common Biases** (Not universal demands):  
    - ❌ "Determinate verdict for every case": Unattainable where rules conflict (e.g., Art. 13 vs. Art. 17). Insisting on determinism ignores underdetermination.  
    - ❌ "Derived solely from pre-existing rule content": Circular in self-amendment (e.g., Art. 17’s exercise *changes* the rules). Efficacy/acceptance may be necessary for successor rules.  
    - ❌ "No unamendable principles": Art. 13 *is* an enacted unamendable rule—theory must account for self-entrenchment.  
    - ❌ "Amendment power is the people’s constituent power": Maraval’s Assembly holds the power; this is a democratic prejudice, not a legal necessity.  

  ### **Inconsistencies in Common Demands**  
  1. **"Determinate verdict" + "pre-existing rules only" + "rules replace their own validity criteria"** → **Inconsistent**. If a rule (e.g., Art. 17) replaces validity criteria, the new criteria aren’t "pre-existing," and outcomes may be underdetermined (e.g., is Art. 13’s entrenchment absolute?).  
  2. **"Binding self-entrenchment" + "amendment power has no limits"** → **Inconsistent**. If a rule is self-entrenched (Art. 13), it *limits* the amendment power. Theory must choose: either self-entrenchment is possible (limiting amendment) or amendment is unlimited (voiding self-entrenchment).  

  ---

  ### **Maraval-Specific Answers**  
  - **2048 Amendment**: Valid *as amendment* (not revolution) if Art. 17’s one-time exception is a lawful part of the amendment power. Successor rules derive authority from the *original* Charter’s validation of Art. 17’s operation (per Requirement 5).  
  - **2055 Court’s Task**:  
    - If Art. 17 was valid, the 2048 changes stand (Art. 18 protects them).  
    - If Art. 17 was void (as violating Art. 13), the Assembly lacked power to amend Art. 12. All subsequent acts are invalid *unless* the court recognizes efficacy (Requirement 1).  
    - *Underdetermination is possible*: If Art. 13 and Art. 17 conflict irreducibly, the law "runs out," and the court must appeal to non-legal principles (e.g., popular sovereignty).  

  ---

  ### **Theoretical Scorecard (Brief)**  
  - **Kelsen (Basic Norm)**: Struggles with self-amendment. If the basic norm validates the 1951 Charter, how does it validate a new rule (e.g., simple-majority amendments) after Art. 17’s repeal? Requires "jumping" to a new basic norm—smuggling in revolution. Fails Requirement 5.  
  - **Hart (Rule of Recognition)**: Excels at Requirement 1 (validity vs. efficacy). Officials’ acceptance in 2048–2055 could validate the changes despite formal defects. But Art. 13’s entrenchment challenges "what officials accept" (is entrenchment part of the rule?). May collapse validity into efficacy.  
  - **Sovereign Legislature View**: Denies all limits (no self-entrenchment possible). Art. 13 is void, Art. 17 is valid, and Art. 18 is supreme. But this ignores enacted constraints (Art. 13) and can’t explain liar paradoxes (Art. 18). Fails Requirements 3 and 6.  

  **Your theory must prioritize Requirement 5 (authorization gaps)**—it’s the keystone. If successor rules lack authority, the system fractures. Maraval’s court must either anchor the 2048 changes in the original Charter’s validation of Art. 17 (amendment) or declare a revolution (voiding all post-2048 acts). A good theory does both without cheating.
