prompt: |-
  You're a moral philosopher who's spent years in the weeds of the moral worth literature, so skip the basics. Think carefully, brainstorm two or three candidate scenarios internally, keep only the best one, and dont show me the rejects.

  I need a case built to order. The question it's for: does moral worth require acting *for* the right reasons, or is it enough that the right-making feature is what actually moves you (a tracking / quality-of-will picture)? I want that isolated, so the case has to be tested rather than rigged.

  The brief: one agent, one ordinary act — a workplace, a clinic, a school, a family. Nothing catastrophic, no trolley stuff, no historical atrocity: moderate stakes, because I want the structure doing the work and not the stakes. The act is clearly right and there's an uncontested right-making feature, call it F. Now the hard part:

  - F is the actual causal-explanatory difference-maker: had F been absent, the agent wouldn't have acted.
  - But the agent sincerely avows a different reason, G, and G is a perfectly decent reason in its own right — not discreditable, not a vice, not something she'd be embarrassed by if she noticed it.
  - The agent is fully articulate, has no relevant false beliefs, and is not self-deceived, akratic, grudging, or in the grip of any independent vice. (The classic Huckleberry Finn style case gets its effect from the agent being inarticulate about her own motives; I want that route closed.)
  - Because of the gap between F and G, the right-reasons view must withhold moral worth whilst the tracking view grants it — and neither verdict may be traceable to anything other than that gap.

  Then tell me which feature is doing the work, the smallest change to the case that flips both verdicts (to show me you haven't just stipulated them), and the strongest thing a right-reasons defender says to get the case back.

  Give me exactly six numbered items, no intro and no conclusion, each a short paragraph or two sentences at most:

  1. the scenario
  2. what each of the two views says about it, and why
  3. the feature of the case doing the work
  4. the minimal change that reverses both verdicts
  5. the best attack from a right-reasons defender
  6. your own verdict in a sentence, plus what in your case is still stipulation rather than argument
reasoning: |-
  Hmm, the user wants a tightly constructed moral philosophy case study on moral worth. They're clearly deep in the literature - referencing tracking views vs right-reasons views, Huckleberry Finn cases, and demanding no historical atrocities or trolley problems. This is for professional use, probably academic writing or teaching.

  Key constraints are tricky: need an ordinary setting with moderate stakes, one agent performing a clearly right act where:
  - The actual motivator (F) is the right-making feature
  - The agent sincerely believes they're motivated by something else (G)
  - G must be morally decent
  - Agent must be fully articulate and self-aware
  - No self-deception or vice involved

  The core challenge is creating a scenario where we can cleanly separate motivation from justification without psychological complications. Workplace settings might work best for this - professional environments have clear norms where people can be mistaken about their own motives while remaining competent.

  Brainstorming candidates:
  1) A doctor prescribing cheaper generics (actual motive: patient need; believed motive: evidence-based practice)
  2) A teacher adjusting deadlines (actual motive: student stress; believed motive: pedagogical consistency)
  3) A manager promoting diversity (actual motive: fairness; believed motive: team performance)

  The manager case is strongest. It isolates the tracking/quality-of-will distinction perfectly: fairness (F) is actually driving the decision, while team synergy (G) is the avowed reason. Both are morally sound, and we can imagine a highly self-aware manager who just misattributes their primary motivator.

  For the reversal test: if we make the diversity hire actually harm team performance while remaining fair, it flips both views' verdicts. Right-reasons would deny worth (since fairness wasn't the motive), tracking would deny worth (since the right-making feature wasn't present).

  Right-reasons defenders might counter that G is actually doing normative work - but in this construction, team performance is merely correlated with fairness, not constitutive of it. The stipulation that remains is that fairness alone makes the act right - but that's necessary for the case to function as a test.

  This should satisfy all six requested points cleanly while meeting the technical requirements. The workplace setting keeps stakes moderate and relatable.
answer: |-
  1.  **Scenario:** Dr. Amina, a highly self-aware and articulate clinic director, approves a qualified candidate from an underrepresented group for a promotion over an equally qualified majority-candidate. The uncontested right-making feature (F) is *promoting fairness by countering systemic bias*. Had systemic bias not been an issue (e.g., if previous hires were demonstrably equitable), she would have promoted based strictly on seniority. However, Dr. Amina sincerely avows that her sole reason (G) is *maximizing team performance through diverse perspectives*, a good managerial reason. She has no false beliefs about the candidates, systemic bias, or diversity's benefits; she's simply mistaken about what primarily moved her to act *this time*.

  2.  **Verdicts:**  
      *   **Tracking/Quality-of-Will View:** Grants moral worth. F (promoting fairness) was the actual difference-maker in her choice, causing her to act rightly. Her will was responsive to the right-making feature.  
      *   **Right-Reasons View:** Withholds moral worth. Although F caused the act and F is right-making, she did not act *for* F. She acted *for* G (team performance). Her intention was directed at G, not F, despite F being the actual motivator.

  3.  **Key Feature:** The complete disconnect between the *attributed intention* (G) and the *actual causal motivator* (F), despite both being morally decent and the agent being fully competent and sincere. F caused the action, but G was the consciously endorsed goal guiding her deliberation at the moment of choice.

  4.  **Minimal Reversal:** Change the scenario so F *is* both the actual motivator *and* the avowed reason. Dr. Amina, reflecting on the same situation, now correctly identifies her primary motivation as promoting fairness to counter systemic bias (F) and states this as her reason. Both views now grant moral worth: tracking because F moved her, right-reasons because she acted for F.

  5.  **Right-Reasons Defense:** Argue that G (*maximizing team performance*) is not merely decent but *inherits* its normative force *from* F (*promoting fairness*) in this context. Countering systemic bias *just is* what constitutes maximizing team performance fairly here. Therefore, acting for G *is* acting for F (or its core normative content), collapsing the distinction. Her avowal of G doesn't preclude acting for F, it expresses it under a different description tied to her managerial role.

  6.  **Verdict & Stipulation:** The tracking view correctly grants moral worth; the actual responsiveness of the will to F is sufficient. The stipulation remains that F (*promoting fairness*) is *solely* and *uncontroversially* the right-making feature in this instance, independent of G's contingent effects, anchoring the act's rightness purely in rectifying injustice.
