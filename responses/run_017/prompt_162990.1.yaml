  I should acknowledge their standing intuition that simultaneous exchange requires trusted elements, and clarify that program equilibria don't contradict this since they rely on mutual inspection which isn't achievable without trusted components. The asymmetric budget case shows precisely where their field's concerns manifest - when inspection capabilities aren't symmetric.

  The user's framing suggests they suspect the cooperative equilibria rely on unrealistic assumptions about code inspection. My analysis confirms this: identity-matching alone enables trivial cooperation but is fragile; legibility creates prediction asymmetries; only verifiability aligns with their field's capabilities but introduces proof-system vulnerabilities. The asymmetric case makes these limitations concrete - the budget-disadvantaged player can't sustain cooperation without being exploited.
answer: |-
  (1) Programs are protocols that output actions conditional on inspecting the counterparty's protocol; an equilibrium is a protocol pair where neither player gains by unilaterally switching to another protocol; defection is outputting "defect" when the protocol's condition for cooperation isn't met.

  (2) Camp one argues such protocols enable rational one-shot cooperation via mutual inspection (e.g., code equivalence checks or proof verification). Camp two argues this relocates the selection problem to choosing *which* protocol to deploy amid multiple equilibria and assumes unrealistically perfect inspection.

  (3) The core mechanism translates: protocols replace actions, conditioning on counterparty properties replaces direct choice, and cooperative outcomes exist with mutual inspection. The fragility critique maps directly to sensitivity to protocol perturbations.

  (4) Distortion occurs in "reading source code": philosophers assume perfect legibility and infinite verification budgets, but asymmetric budgets (e.g., one player has weaker proof verification) break cooperation by creating exploitable inspection gaps. Verifiability is silently idealized as foolproof and cost-free.

  (5) Unrestricted proof-theoretic constructions ("cooperates if it proves you cooperate") have no counterpart; your field requires bounded-computation attestations. This residue reveals philosophers rely on unacknowledged idealization (infinite verification resources), making it a blind spot in their dispute. Your gradual-release intuition holds—program equilibria require mutual inspection, which itself demands trusted components (like TPMs) or optimistic mechanisms.
