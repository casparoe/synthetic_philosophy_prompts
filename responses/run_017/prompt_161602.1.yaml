prompt: |-
  I run a student philosophy society and I've got a 75-minute session next week where I have to get across the difference between epistemic contextualism and pragmatic encroachment (subject-sensitive invariantism, the "stakes shift whether you know" view). Room of about fifteen, mostly first- and second-years who saw Gettier once in intro and who, the moment they hear "it depends on the context," hear "so knowledge is just whatever you feel like" — plus two or three people who've read a bit more and will want to know which view is actually true. A friend of mine in the grad seminar says the whole dispute is merely verbal and I shouldn't bother teaching both, and I don't think she's right, but I want a plan that survives that heckle rather than collapsing under it. So: don't explain either view to me, I know them both reasonably well — plan how I teach the contrast. What has to be on the board before the two views can even be seperated (my guess is that they have to be able to see whose situation is doing the work, the ascriber's context or the subject's stakes, and that this has to come before the views rather than dropped in as a footnote), and why in that order.

  The case I'm tempted to build the whole session around is the airport one — you're seeing someone off, a stranger at the gate mentions a stopover, and whether you "know" the flight stops there seems to swing with how much is riding on your getting it right, even though nothing about your evidence changed. I like that it's boring and ordinary, but I'm not sure it should carry everything, and I'm also unsure whether I should start from the older bank case and only then bring in the airport one, or skip the bank case entirely. Tell me which single example should carry the session, what it has to have and what it has to lack (I think it needs the evidence held fixed *visibly* fixed, and it probably shouldn't involve anyone's life being at risk, because that makes people argue about the example instead of about the view). Then there's the case I actually keep coming back to and can't place: Priya has glanced at a gauge and has perfectly ordinary, modest evidence that a valve is shut; her own stakes are nil, she wants to go home; Sam next to her has to decide whether to send a crew into the chamber, and his stakes are enormous. It seems fine for Priya to say "I know it's shut" and at the same time wrong for Sam to say "Priya knows, so I'll go ahead" — and it seems fine for Sam to say "she doesn't know" while Priya's evidence never changed. My instinct is that this is where the two views genuinely come apart rather than just redescribing the same data, and that it puts pressure on contextualism because the knowledge claim and the action it's supposed to license belong to different people. But tell me where in the sequence it belongs: up front as the puzzle that forces the distinction, at the end as the test of whether anyone got it, or nowhere because it's really a problem about action-guiding and not about knowledge at all.

  Then the misconceptions. The ones I expect are: relativism in the vulgar sense ("so anything goes"); the two views being collapsed into one, with people unable to say what would differ between them; the evidentialist misreading where high stakes are heard as "you should go check again," i.e. as a change in what evidence you ought to have rather than in what your evidence has to do for you; and the one-directional worry that if high stakes can destroy knowledge then trivially low stakes must manufacture it, which I think someone will raise and I don't want to hand-wave. Tell me which of these come from the framing I choose versus which come from the views themselves, and the exact point in the sequence where I should head each one off — before it forms if that's possible, and how. Also: what should I openly refuse to explain at this level (I'm thinking the semantic-vs-pragmatic question about whether "knows" is really context-sensitive or whether the effect is conversational gets one sentence and no more, but tell me if something else is the thing to sacrifice). Give me one question to end on that would show me they've got the distinction rather than the vocabulary — I was thinking something like asking them to build a case where the two views disagree, but tell me if there's a better check. And please say where your plan is most likely to fail, and what would change your mind about the ordering or about the choice of carrying example. American English throughout, wich shouldn't be a problem but I'm saying it anyway.
reasoning: |-
  Okay, the user runs a student philosophy society and needs to teach the difference between epistemic contextualism and pragmatic encroachment in a 75-minute session. The audience is mostly first- and second-years with limited background, plus a few more advanced students. There's also a potential challenge from a friend claiming the dispute is merely verbal. The user wants a solid lesson plan that clearly separates the two views, uses effective examples, and preempts common misconceptions.

  First, I need to recall the core differences between the two theories. Contextualism says the meaning of "knows" changes with the attributor's context, while pragmatic encroachment (or subject-sensitive invariantism) holds that the subject's stakes affect whether they know, even if the word "knows" means the same. The key is whose situation matters—the speaker's context or the subject's stakes.

  The user mentioned using the airport case as a central example. It's good because it's mundane and clearly shows stakes affecting knowledge attribution without changing evidence. But the Priya/Sam case introduces a conflict between attributor and subject contexts, which might better highlight the divergence between the two theories. The user is right that this case pressures contextualism because different attributors in different contexts might disagree about the same subject's knowledge.

  For the lesson structure, starting with a simple case where stakes shift for the subject (like the airport) makes sense. That establishes the basic phenomenon. Then introducing a case where attributor and subject stakes differ (Priya/Sam) can show where the theories split. Sequencing is crucial: build from simple to complex, ensuring each step addresses potential misunderstandings.

  Common misconceptions like relativism, conflation of the two views, evidentialist misreadings, and the low-stakes objection need to be addressed proactively. For example, emphasizing that both theories have objective constraints (evidence, truth) can prevent the "anything goes" worry. Highlighting whose stakes matter (attributor vs. subject) early on can avoid conflation.

  The user also needs to decide what to omit. The semantic-pragmatic debate about whether "knows" is context-sensitive or if implicatures are at play is probably too nuanced for this session. A brief mention that contextualism is semantic while pragmatic encroachment is metaphysical should suffice without diving deeper.

  Ending with a question asking students to create a case where the two theories disagree would test their understanding. If they can construct a Priya/Sam-like scenario, they've grasped the distinction.

  Potential pitfalls include the Priya/Sam case derailing into a discussion about action guidance instead of knowledge. Keeping the focus on knowledge attribution and clarifying that the question is whether Sam can truthfully say "Priya knows" based on his context versus hers should help. Also, starting with the airport case ensures everyone grasps the basic stakes effect before introducing complexity.

  The user’s insight about needing to establish whose situation matters (attributor's context vs. subject's stakes) before presenting the views is spot on. This foundational point should be the first thing on the board to frame the entire discussion.
answer: |-
  Here's a battle-tested plan designed to survive the "merely verbal" heckle, force the distinction, and preempt common misconceptions. The core strategy is to **build the puzzle *before* introducing the views, explicitly isolating the "Whose Situation Matters?" question, and using the Priya/Sam case as the crucial divergence point.**

  **Core Structure & Timing (75 Min):**

  1.  **The Phenomenon & The Core Question (20 min):**
      *   **Start with the Airport Case (Simplified):** *"You're seeing a friend off. You just heard the gate agent announce Flight 462 has a stopover in Chicago before its final destination. Your friend asks if you know it stops in Chicago. You casually say 'Yeah, I know it stops there.' Later, you overhear a frantic passenger saying their child's life-saving medication is being flown *directly* to the final destination and will be ruined if it goes through Chicago's heat. They ask if *you* know Flight 462 stops there. You hesitate... even though you heard the same announcement."*
      *   **Board Setup:** Draw two columns: **LOW STAKES (Friend)** | **HIGH STAKES (Stranger)**. Under each, list: **Subject's Evidence** (Hearing announcement), **Subject's Stakes** (Friend: Low / Stranger: High), **Attributor's Context** (Friend: Relaxed / Stranger: High-Pressure), **Intuition about 'Knows'?** (Friend: Seems OK / Stranger: Seems Wrong).
      *   **Key Question:** "What changed? The evidence didn't. Our intuition about whether 'I know' or 'You know' is appropriate *did* change. **What feature of the situation drives this change?** Is it the *attributor's* context (who is saying 'knows' and why) or the *subject's* stakes (what it costs the person who might act on it to be wrong)?"
      *   **Board the Core Distinction:** BIG HEADING: **WHOSE SITUATION MATTERS?** Arrow to **Attributor's Context** vs. Arrow to **Subject's Stakes**. *This is the foundation. Everything rests on answering this.*
      *   **Why Airport First?** It's simple, relatable, and *prima facie* ambiguous about "whose situation" matters. The subject (you) *and* the attributor (you, then the stranger) are involved in both stakes shifts. It perfectly sets up the question without giving away the answer. It avoids life-or-death distraction.

  2.  **Introducing the Rival Answers (15 min):**
      *   **Contextualism:** "One answer: It's the *attributor's* context that matters. The word 'knows' is context-sensitive. When *I* say 'I know' to my friend in a low-stakes chat, 'knows' means one thing (a lower standard). When the *stranger* asks if *I* know in their high-stakes context, 'knows' means something stricter. My *own* evidence/stakes haven't changed, but the meaning of the *word* changes depending on who's using it and why."
      *   **Board:** Under **Attributor's Context**: "Contextualism: 'Knows' standard shifts with *speaker's* context."
      *   **Pragmatic Encroachment (SSI):** "Another answer: It's the *subject's* stakes that matter. 'Knows' means the same thing everywhere, but whether someone *counts* as knowing depends partly on what's at stake *for them* in being wrong. High stakes for the *subject* raise the bar their evidence has to meet. My evidence was good enough for knowing when stakes were low (friend), but not when stakes were high (stranger *for me*)."
      *   **Board:** Under **Subject's Stakes**: "Pragmatic Encroachment (SSI): Knowledge *itself* depends partly on *subject's* stakes."
      *   **Crucial Point:** "Notice: Both views *explain* the airport case. They agree something changes with stakes, but they *fundamentally disagree* about **WHOSE situation determines the change**: The person *saying* 'knows' (Contextualism) vs. the person *being said to know* (PE/SSI)."

  3.  **The Crucial Test: Priya & Sam (25 min)**
      *   **Present the Case:** "Priya glances at a pressure gauge. It reads 'Shut'. She has ordinary evidence – gauges are usually reliable but can malfunction. Her stakes are *low*: She just wants to go home. Sam is next to her. He must decide whether to send a repair crew into the chamber. If the valve is open, they die. Sam's stakes are *enormous*. Priya says, 'I know it's shut, I'm heading out.' Sam thinks, 'She doesn't *know* that!'"
      *   **Analyze on the Board:** Add rows to the original table:
          *   **Priya's Self-Attribution (Low Stakes Attributor - Priya)**: Attributor Context: Low, Subject Stakes: Low, Intuition: "I know" seems OK.
          *   **Sam's Attribution (High Stakes Attributor - Sam)**: Attributor Context: High, Subject Stakes: Low, Intuition: "She knows" seems FALSE.
      *   **The Puzzle for the Views:** "Can both be right? Can Priya correctly say 'I know' while Sam correctly says 'She doesn't know' *about the same evidence at the same time*?"
      *   **Contextualism's Answer:** "YES! Priya, in her low-stakes context, uses 'knows' with a lower standard. Her evidence meets it. Sam, in his high-stakes context, uses 'knows' with a higher standard. Priya's evidence *doesn't* meet *his* standard. Both statements can be true simultaneously because 'knows' means different things in their mouths." *(Board: "C: Compatible - Different Standards")*
      *   **PE/SSI's Answer:** "NO! 'Knows' has one standard. Knowledge depends on the *subject's* (Priya's) stakes. Priya's stakes are low. Her evidence *is* sufficient for knowing *given her low stakes*. Therefore, Priya *does* know. Sam is simply *wrong* to say she doesn't know, even though he's understandably cautious. His high stakes *don't* affect whether *Priya* knows, only what *he* should do." *(Board: "PE/SSI: Incompatible - Only Subject's Stakes Matter. Sam is mistaken.")*
      *   **Why This Case is Essential:** This is where the views *genuinely diverge in their predictions*. It forces the distinction laid bare in Step 1 ("Whose Situation?") to do concrete work. **Use this to show the dispute is NOT merely verbal:** They disagree on a substantive metaphysical/semantic point with testable consequences (compatibility of seemingly conflicting knowledge attributions across contexts). *This is the heart of the session.*

  4.  **Addressing Misconceptions Proactively (10 min - Woven in & Explicitly):**
      *   **Relativism/"Anything Goes":** *Preempt during Intro/Views:* Constantly emphasize *both* views require **TRUTH + EVIDENCE**. Contextualism changes the *standard* for evidence required, PE/SSI changes *how much evidence is needed relative to stakes*, but neither says belief or truth don't matter. "This isn't 'whatever you feel like', it's about how much evidence is needed *given specific contextual or practical pressures*." *Reinforce during Priya/Sam:* "Sam isn't *creating* truth, he's applying a stricter standard (C) or being overly cautious (PE)."
      *   **Collapsing the Views:** *Preempted by Step 1 (Whose Situation?) and the Priya/Sam test.* Hammer the core question: "Does the shift depend on WHO IS TALKING (Contextualism) or WHAT'S AT STAKE FOR THE PERSON INVOLVED (PE/SSI)?" The Priya/Sam case makes the difference undeniable.
      *   **Evidentialist Misreading ("Go check again"):** *Preempt when presenting the Phenomenon (Airport):* "Notice, in the airport case, *you didn't get new evidence* when the stranger asked. The hesitation wasn't necessarily because you thought you *should* get more evidence (though you might!), but because it suddenly *felt wrong* to claim knowledge with what you had." *Reinforce in Views:* "Contextualism says the *meaning* of 'know' changed, demanding more evidence *in that context*. PE/SSI says the *fact* of knowing changed – your previous evidence was *never* sufficient for high-stakes knowledge." *Kill it in Priya/Sam:* "Priya didn't get *more* evidence when Sam worried. The question is whether her *existing* evidence constituted knowledge."
      *   **Low-Stakes Manufactures Knowledge:** *Address when introducing PE/SSI:* "PE/SSI says high stakes *can destroy* knowledge that low stakes *allows*. It doesn't say low stakes *creates* knowledge out of nothing. You still need sufficient evidence *for the low-stakes standard*. Trivial truths still require evidence (e.g., knowing there's a tree outside your window still needs looking/perceiving). Low stakes lowers the *bar* the evidence must meet, it doesn't eliminate the need for evidence." Use Priya: "Her glance is sufficient *given low stakes*, but wouldn't be for high stakes *even for her*."

  5.  **Wrap-Up, Sacrifice, & Check (5 min):**
      *   **Reiterate the Core Distinction:** Point back to the board: "The fundamental difference: For Contextualism, 'knows' is context-sensitive – **the speaker's situation sets the standard**. For Pragmatic Encroachment, knowledge is stake-sensitive – **the subject's situation partly determines the fact**."
      *   **The Sacrifice:** "We are *not* diving into the deep end today: Is the contextual effect genuinely *semantic* (meaning of 'knows') or *pragmatic* (just implicature)? That's a crucial debate *within* and *about* contextualism, but for seeing the difference *from* PE/SSI, we can bracket it. Both agree *something* shifts with context/stakes; they radically disagree on *what* shifts (meaning vs. knowledge itself) and *whose* context/stakes matter."
      *   **The Check Question:** **"Imagine a case where the *person saying 'knows'* is in a low-stakes context, but the *person they're talking about* is in a high-stakes situation. According to Contextualism vs. Pragmatic Encroachment, could the attributor correctly say 'S knows'?"**
          *   *Correct Answer Pattern:* "Contextualism: *YES*, because the attributor's (low-stakes) context sets the standard, which might be met even if the subject's stakes are high. PE/SSI: *NO*, or *less likely*, because the subject's high stakes raise the bar for knowledge itself, which the subject's evidence might not meet, regardless of the attributor's context." (Priya/Sam is the inverse of this!) If they can articulate *why* based on "whose situation matters," they get it.

  **Why This Order & Choice:**

  1.  **Airport First:** Establishes the core phenomenon (stakes affect knowledge attribution) clearly and uncontroversially. Its ambiguity about "whose situation" perfectly sets up the core question.
  2.  **"Whose Situation?" Before Views:** This is the master key. Framing the views *as answers to this explicit question* prevents conflation from the start.
  3.  **Priya/Sam as the Divergence Point:** This is the critical experiment. It shows the views make different predictions. It forces students to see the *consequences* of answering the "Whose Situation?" question differently. It makes the dispute *substantive*, not merely verbal.
  4.  **Minimal Semantic Detail:** Sacrificing the semantic/pragmatic debate *within* contextualism is necessary. The core contrast is metaphysical/semantic (does "knows" shift meaning, or does knowledge itself depend on stakes?) and about the locus of sensitivity (speaker vs. subject). Getting bogged down in "Is it really semantic?" derails explaining the *difference* from PE/SSI.

  **Where It Might Fail & When to Change:**

  *   **Failure Point 1: Priya/Sam Derailment.** Students might fixate on "Should Sam act?" instead of "Can Sam *truthfully say* 'Priya knows'?" **Mitigation:** Be explicit upfront: "We're focused on the *knowledge attribution*, not directly on the action. The question is whether Sam's statement 'She doesn't know' is *true* or *false*, according to each theory."
  *   **Failure Point 2: "But Sam's Right!" Intuitions.** Strong intuitions that Sam *must* be right might make PE/SSI seem obviously false early on. **Mitigation:** Acknowledge the intuition ("It *feels* wrong for Sam to rely on her") but stress the *theoretical cost* for PE/SSI: it says Priya *does* know, so Sam is *wrong* to deny it. Contrast with Contextualism's elegant solution (all statements can be true). Frame it as a cost/benefit analysis for each view.
  *   **Change Trigger: Advanced Students Dominate.** If the Priya/Sam debate gets too technical too fast, pivot back to simpler Airport + Core Question. Refocus: "Regardless of intuitions *here*, do you see *why* the views give different answers? It all comes back to *whose situation matters*?"
  *   **Change Trigger: Time Crunch.** If short on time, **sacrifice detailed discussion of misconceptions beyond the Core Question and Priya/Sam divergence.** Ensure "Whose Situation?" and the Priya/Sam test are crystal clear. The Check Question is vital.

  This plan prioritizes conceptual clarity over comprehensiveness, uses the ambiguity of Airport to set up the puzzle, leverages Priya/Sam as the decisive test of the distinction, and constantly anchors everything to the fundamental question: **Whose Situation Matters?** Good luck!
