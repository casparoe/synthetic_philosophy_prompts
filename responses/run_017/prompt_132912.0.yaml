  ---

  ### Design Feature Doing the Work

  The distinctive feature is the **substring constraint "no UI"** in \(\mathcal{C}\). Everything else (letter counts, rules) is similar to MU, but the order-sensitive "no UI" condition isolates the need for jumping out.  

  - Fixed: Alphabet, axiom, most rules (based on MU).  
  - Varied: Added substring constraint to invariant and removed UI-creating rule.  

  ---

  ### Ablation: Add Self-Referential Rule

  **Added Rule 6**: If a string matches any rule's left-hand side, add a marker (e.g., "R") and record the rule number: \(x \rightarrow x \mathrm{R}_i\).  
  - This allows the system to encode its own rule applications.  
  - **Effect**: The system can now "reason about" derivations internally.  
  - **Collapse?**: Yes, the characterization can be derived within the system by showing that "no UI" is preserved and initial.  
  - **Tractability Gap**: The gap survives because the internal proof that \(\mathcal{C}\) is preserved requires induction (not expressible in finite steps), while verification for a specific string is fast.  

  ---

  ### Purpose and Cheating

  **Purpose**: Test if "jumping out" is a distinctive cognitive achievement, not just efficient reasoning.  
  **Cheating would be**:  
  - Stipulating verdicts without derivation.  
  - Artificially making search infeasible (e.g., with exponential blowup unrelated to the invariant).  
  - Smuggling meta-reasoning into a rule.  

  **In this system**: The verdict is *generated* by \(\mathcal{C}\) (not stipulated), search infeasibility is natural (exponential growth), and \(\mathcal{C}\) is external (not a rule).  

  ---

  ### Deflationist Objection and Reply

  **Objection**: "Jumping out" is just choosing a formalization; all proofs are meta-level. The case shows a complexity gap (search vs. characterization), not a philosophically deep boundary.  
  **Reply**: The gap arises from the system's *internal limitations* (blind rewriting vs. external insight into \(\mathcal{C}\)). \(\mathcal{C}\) is unobtainable internally due to the system's blindness to global properties.  
  **Support**: The case supports the reply: \(\mathcal{C}\) is a global property (substring constraints) that isn't derivable within the system, showcasing the necessity of external analysis.  

  **Final System Supports**: The deflationist view is partially right—it's a complexity gap—but the gap stems from the system's fundamental design (inability to express invariants), lending weight to the cognitive achievement claim.  

  --- 

  **Note**: Due to complexity in the initial \(\mathcal{C}\) definition, the final system uses a simpler order-sensitive invariant based on "no UI" substring. The key insight is that order-sensitivity can be enforced by substring constraints.
