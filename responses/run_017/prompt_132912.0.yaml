    - Contains "UI" at the junction → violates \(\mathcal{C}\).  

  **Infeasibility of Target 1**:  
  - To reach \(\mathrm{M}(\mathrm{IU})^{n}\), one way: Start from MIU, apply Rule 2 (duplicate) repeatedly.  
