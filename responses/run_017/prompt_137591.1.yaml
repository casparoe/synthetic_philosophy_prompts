prompt: |-
  I've been reading the rationalist corner of the internet for roughly fifteen years, and gun policy is one of the very few political topics where I think the blogs genuinely moved me off my starting position without my being able to point to the single argument that did it. My local group is doing a series in which each member writes up their position on one contested policy area and the others audit it for internal coherence before the person defends it in person. Mine is gun control. Below is the package as I'd actually defend it, in the terms I'd defend it in. I'd like the audit before I present rather than after.

  Where I've landed:

  (1) The only defensible case for widespread private firearm ownership is the self-defense interest, and it is weightiest for people the police will not reliably protect. I treat that as a right: the state bears the burden of justification for any prohibition, and the bare fact that the aggregate would go better under some restriction is not by itself a justification.

  (2) I reject soft paternalism toward competent adults. That a product can be misused, or that owning it is statistically risky for the owner, is not a reason to restrict access to it — that logic would also license banning alcohol, motorcycles, and backyard pools. On this basis I oppose feature-based bans on semiautomatic rifles, discretionary licensing schemes under which an official decides who has shown sufficient cause to carry, taxes or fees on purchase, and registration.

  (3) On the empirics, I hold that the honest reading of the social science supports three things and not a fourth: more guns means more firearm suicide, and that is not merely confounding; the presence of a gun makes a given violent encounter considerably more likely to be lethal; the evidence does not establish that general civilian gun prevalence raises homicide rates; and the very large survey-based estimates of defensive gun uses that circulate online should not be credited — most of the incidents counted are not cases in which the gun was needed.

  (4) I own a handgun anyway, and would defend the right to.

  (5) The restrictions I do support: universal background checks on transfer, extreme risk protection orders including short ex parte emergency orders with a prompt adversarial hearing, a waiting period of roughly ten days, mandatory safe storage in the home, and lifetime prohibition for anyone convicted of a violent misdemeanor.

  (6) Institutionally, I want firearm policy written as provisional — every provision sunsets after five years, new provisions take effect on a staggered or randomized rollout across jurisdictions so the effects can actually be measured instead of inferred from the same confounded cross-sectional comparisons, and administration sits with an arm's-length technical body rather than with legislatures trading in symbolism. Gun policy should be one of the places where we generate evidence rather than re-litigate it.

  (7) On the constitutional question: I think the original-public-meaning case for an individual self-defense right is roughly correct as history, but I am otherwise a living constitutionalist, I would defend essentially this same package in a country whose constitution said nothing about arms, and I take original meaning to carry little weight on its own. I am not leaning on the Heller-style reading; I mention it only because several people have accused me of invoking it selectively.

  What I want from you: treat the set as an object and tell me which pairs actually pull against each other and how badly, ordered by severity rather than listed as equal, and for each real tension say exactly what would have to give and what that revision would cost me elsewhere in the package. I also want to know which of the conflicts that look like conflicts dissolve once the commitments are stated carefully, and why, since I'd rather present five items than discover in the Q&A that I was holding two versions of the same principle. If there is one revision that cleans up more than any other, name it. Please don't spend the answer on the observation that the empirical literature is contested — I've said what I take it to support, and I'd rather you grant that and trace what it commits me to. I have a nagging sense that something here is doing more work than it can bear and that at least one of the apparent conflicts is not real, but I can't locate either.
reasoning: |-
  Okay, the user has been part of the rationalist community for about 15 years and has developed a nuanced stance on gun control. They're preparing to defend their position in a local group audit, so they need a thorough internal coherence check. Let me start by understanding their key points.

  First, they emphasize self-defense as the primary justification for firearm ownership, especially for those underserved by police. They reject soft paternalism, arguing against bans based on features or misuse potential. Their empirical claims focus on increased firearm suicides and lethality in violent encounters, but not higher homicide rates. They also dismiss high defensive gun use estimates.

  The restrictions they support include universal background checks, red flag laws, waiting periods, safe storage, and prohibitions for violent misdemeanants. Institutionally, they want provisional policies with sunsets and staggered rollouts for better evidence generation. Constitutionally, they acknowledge original intent but prioritize living constitutionalism.

  Now, the user wants to identify internal tensions. Let me look for contradictions. Their rejection of soft paternalism (point 2) might clash with supporting waiting periods and safe storage (point 5). Waiting periods are often justified by reducing impulsive suicides, which is paternalistic. They need to reconcile this by distinguishing between preventing immediate harm versus controlling choices. Maybe frame it as addressing acute crises rather than restricting competence.

  Another tension is between their empirical view on defensive gun use and supporting self-defense rights. Since they doubt most DGUs are necessary, how does that align with advocating for ownership? They can argue that even if overestimated, the core right remains valid for genuine cases, especially for vulnerable groups. But this requires conceding some inefficiency in the right's exercise.

  Institutional sunsetting (point 6) could conflict with rights framing (point 1). If gun ownership is a right, why subject it to periodic review? They might argue that rights have reasonable regulations, and evidence-based adjustments are legitimate. However, this risks undermining the right's stability. Emphasizing that sunsets apply to regulations, not the right itself, could help.

  Safe storage laws might be seen as soft paternalism. They need to differentiate by highlighting child safety or preventing unauthorized access, framing it as harm prevention to third parties rather than owner protection. This aligns with rejecting personal risk as a justification.

  The user also mentioned a nagging sense of something amiss. Perhaps the conflict between their empirical skepticism on DGU and the self-defense justification. If DGUs are overreported, the practical need for guns diminishes. But they can counter by focusing on the right's importance for marginalized groups, even if statistically rare.

  Another subtle point: opposing registration (point 2) but supporting UBC and ERPOs (point 5). UBC requires a system to track transfers, which could resemble registration. They might need to clarify that UBC can be designed without a centralized registry, using point-of-sale checks instead. However, enforcement without some record-keeping is tricky, so there's tension here.

  Lastly, lifetime bans for violent misdemeanants. This could conflict with the rejection of discretionary licensing, as it imposes a permanent prohibition. They should ensure that misdemeanors are genuinely predictive of future violence, avoiding overreach. Consistency here means applying similar standards to other rights, like voting.

  Overall, the main revisions needed are refining the paternalism exception for acute risks and clarifying the scope of regulations versus rights. Addressing these points will strengthen their argument's coherence before the audit.
answer: |-
  Here's an audit of your gun policy package, ordered by severity of tension and identifying resolvable conflicts:

  ### High-Severity Tensions
  1. **Rejection of Soft Paternalism (Pt 2) vs. Waiting Periods/Safe Storage (Pt 5)**  
     - **Conflict:** Waiting periods primarily target firearm suicide (an *owner*-focused risk), and safe storage laws often cite accidental injury/theft (also owner/household risks). These appear grounded in the paternalistic logic you reject (e.g., "motorcycles are risky for riders, but we don't ban them").  
     - **What Must Give:** You must either:  
       - *Drop waiting periods/safe storage*, costing you evidence-based harm reduction tools.  
       - *Refine your anti-paternalism principle* to exclude acute, irreversible harms where temporal delay/access control demonstrably saves lives *without meaningfully burdening competent use*.  
     - **Revision Suggestion:** Explicitly exempt regulations targeting *impulsive* acts (suicide) or *non-consensual* risks (child access, theft) from your anti-paternalism principle. Frame these as preventing *immediate, catastrophic, and often non-rational* outcomes rather than managing lifestyle choices. Cost: Weakens the rhetorical purity of Pt 2 but aligns better with Pt 3 empirics and Pt 5.  

  2. **Empirical Skepticism on DGU (Pt 3) vs. Self-Defense as Foundational Right (Pt 1 & 4)**  
     - **Conflict:** If most surveyed DGUs "are not cases in which the gun was needed" (Pt 3), this undermines the *practical necessity* of widespread ownership for self-defense (Pt 1/4). If guns rarely provide unique defensive utility, the right's weight diminishes.  
     - **What Must Give:** You must either:  
       - *Concede that the self-defense right's practical foundation is weaker than implied*, resting more on principle/autonomy than proven efficacy.  
       - *Clarify that "needed" is context-dependent*: While a gun may not be *absolutely* necessary in many reported DGUs (e.g., could have fled), its presence provided decisive resolution for the *vulnerable individual in that moment*, justifying the right.  
     - **Revision Suggestion:** Emphasize the *asymmetry of risk* for vulnerable populations (Pt 1). Even if aggregate DGU is overstated, the *subjective security* and *last-resort capability* for those facing systemic underprotection justifies the right. Cost: Requires acknowledging that the right’s exercise may be inefficient/risky overall, but remains vital for marginalized groups.  

  ### Medium-Severity Tensions
  3. **Self-Defense as a Right (Pt 1) vs. Provisional/Pilot Policies (Pt 6)**  
     - **Conflict:** Treating self-defense as a fundamental right (burden on state to restrict) clashes with subjecting it to automatic sunsets and experimental rollouts. Rights are typically stable; experimentalism implies the state's authority to revoke access is presumptively valid.  
     - **What Must Give:** You must either:  
       - *Scale back Pt 6 experimentalism* to apply only to *new regulations* (not core ownership rights), not sunsetting foundational access.  
       - *Reframe the right* as conditional on evolving evidence about societal harm, making it inherently provisional.  
     - **Revision Suggestion:** Limit Pt 6 to *regulatory measures* (UBC, ERPOs, storage rules), not the core right to own/carry. Sunset *specific regulations* for review, not the enabling statute itself. Cost: Reduces the radical evidence-generating potential of Pt 6 but preserves rights stability.  

  4. **Opposition to Registration (Pt 2) vs. Universal Background Checks (UBC) & ERPO Enforcement (Pt 5)**  
     - **Conflict:** Effective UBCs and ERPOs (especially recovering firearms) require *some form of record-keeping* to verify compliance or identify prohibited persons' weapons. Opposing registration while supporting these creates an enforcement gap.  
     - **What Must Give:** You must either:  
       - *Accept limited, decentralized, or transaction-based records* (e.g., FFL-held 4473s) as distinct from a centralized registry.  
       - *Acknowledge UBC/ERPO efficacy will be limited* without traceability.  
     - **Revision Suggestion:** Distinguish *point-of-sale verification* (allowed for UBC) and *court-order-based tracking* (for ERPO subjects) from *universal, permanent, centralized registration*. Cost: Requires nuanced definitions but resolves operational conflict.  

  ### Resolvable Conflicts (Apparent Tensions That Dissolve)
  5. **Rejection of Feature-Based Bans (Pt 2) & Homicide Empirics (Pt 3) are Coherent**  
     - **Why:** Your empirics (no link between general prevalence and homicide) directly negate the primary justification for "assault weapon" bans. Opposition to feature bans follows logically from Pt 3 and Pt 2's anti-paternalism. *No revision needed.*  

  6. **Living Constitutionalism (Pt 7) & Specific Policy Package (Pt 5) are Independent**  
     - **Why:** Your policy preferences (Pt 5) are grounded in empirics and principles (Pts 1-3), not constitutional theory. Pt 7 merely states you're not relying on originalism. *No conflict.*  

  7. **Ownership Despite Suicide Risk (Pt 3 vs Pt 4) Aligns with Anti-Paternalism (Pt 2)**  
     - **Why:** Your ownership choice reflects a competent adult accepting personal risk (firearm suicide), consistent with rejecting state interference for statistically risky products. *No revision needed.*  

  ### The Highest-Leverage Revision
  **Refining the anti-paternalism principle (Pt 2)** to **exclude regulations targeting impulsive or non-consensual harm** resolves the most severe tension (vs. waiting periods/storage) and:  
  - Strengthens coherence by aligning Pt 2 with your support for empirically-backed interventions.  
  - Preserves your core objections to cosmetic bans and discretionary licensing.  
  - Avoids the cost of abandoning popular harm-reduction measures (Pt 5).  

  This revision cleanly distinguishes your stance from both hard paternalism *and* libertarian absolutism. It acknowledges that while competent adults may choose risks for themselves, the state has a legitimate role in preventing *imminent, catastrophic outcomes* (suicide, child accidents) where individual choice is constrained by impulse or lack of consent.

  ### Summary of Key Revisions & Costs
  1. **Exempt impulsive/non-consensual harms from anti-paternalism.**  
     *Cost:* Slightly muddies the bright-line principle but saves waiting periods/storage.  
  2. **Clarify that self-defense right prioritizes vulnerable groups' autonomy over aggregate DGU frequency.**  
     *Cost:* Acknowledges the right's practical benefits may be narrower than advocates claim.  
  3. **Limit provisional policies (Pt 6) to regulations, not core access rights.**  
     *Cost:* Reduces scope of evidence-generation but protects rights stability.  
  4. **Define "registration" narrowly to allow UBC/ERPO enforcement mechanisms.**  
     *Cost:* Requires careful legal distinctions to avoid slippery slopes.  

  Your package is impressively coherent overall. The primary tension lies in applying a strict anti-paternalism principle to policies targeting acute, non-rational harms. Addressing that through a carefully bounded exception strengthens your position significantly for the audit.
