   Why can't they commit in advance to ignore the test result? Because the hospital policy is that if the test is taken, then they must follow the test-based policy. The agent cannot commit to ignore because the hospital will force the treatment based on the test.

   So in this case, the agent would rather not take the test.

   Let's answer the questions:

  1. The premise of Good's theorem that this breaks: the theorem assumes that the set of actions available does not change with the information. Here, when the agent takes the test, the action set is constrained: they lose the option of not having surgery in condition A and not having surgery in condition B. Instead, they are forced to surgery in condition A and surgery in condition B. Without the test, they can choose the no surgery action, which is better on average given the prior.

  2. Arithmetic: see above.

  3. The obvious objection: why can't the agent just commit in advance to ignore the test result? In this case, the agent cannot because the hospital policy ties the test result to the treatment. If the agent could commit to ignore, then after taking the test and seeing the result, they could still choose no surgery in condition A. Then:
     - If test says A: they can choose no surgery and get 50.
     - If test says B: they can choose surgery and get 440.
     - EU=0.9*50 + 0.1*440 = 45+44=89.
     This is better than without the test (45) and much better than 8.
     So the agent would be better off if they could commit to ignore the test result. In fact, they would be willing to pay for the ability to commit. The difference in EU between being able to commit and not being able to commit is 89 - 8 = 81. Without the test, they get 45, so if they could take the test and commit to ignore, they would get 89, so they would be willing to pay up to 89-45=44 for the ability to commit and take the test.

  4. Ablation: if we remove the hospital policy, then with the test, the agent can choose after seeing the result:
     - A: choose no surgery -> 50
     - B: choose surgery -> 440
     EU=0.9*50+0.1*440=45+44=89, which is greater than without the test (45), so the value is positive.

  5. Steelman the other side: a believer in "more information is never worse" might say that the negative value comes from the change in the action set (the hospital policy), not from the information itself. The information itself is still valuable, but the agent is subject to an institutional constraint that conditions on the information and removes actions. They might argue that the information itself is not the cause of the harm, but the constraint is. And in the absence of the constraint, the information is valuable. They might even say that the agent is not really making the decision after seeing the information; the hospital is. So it's not a counterexample to the theorem because the theorem assumes the agent is in control of the action. 

   However, in the theorem, the agent is the one who chooses whether to take the information. After taking it, they are still the one who chooses the action, but in this case, the hospital's policy changes the agent's action set. The agent's decision to take the test is what triggers the constraint. So it's the agent's overall decision making that is affected. 

   I think the example stands as a counterexample to the naive application of the theorem in the presence of constraints on the action set based on the information gathering.
answer: |-
  ### Counterexample: Medical Treatment with Institutional Constraints

  **Scenario**: A patient faces a choice between a risky surgery and conservative treatment for a condition that could be Type A or Type B. The hospital requires that if a diagnostic test is taken, treatment must follow strict guidelines: surgery if the test indicates Type A, and conservative treatment if Type B. Without the test, the patient freely chooses. The condition is Type A with 90% probability (bad for surgery) or Type B with 10% probability (good for surgery). Surgery is highly effective for Type B but harmful for Type A, while conservative treatment is moderately effective for Type A and ineffective for Type B.  
  - **Utilities**:  
    - Surgery success (only likely for Type B): +500  
    - Surgery failure (likely for Type A): -100  
    - Conservative treatment (Type A): +50  
    - Conservative treatment (Type B): 0  
  - **Probabilities**:  
    - Surgery success if Type A: 10% (failure 90%)  
    - Surgery success if Type B: 90% (failure 10%)  

  ### 1. Premise of Good's Theorem Broken
  Good's theorem assumes the **action set remains unchanged** after acquiring information. Here, taking the test *alters the action set* by imposing institutional constraints: surgery becomes mandatory for Type A and forbidden for Type B. Without the test, the patient retains the full action set (surgery or conservative treatment). The theorem does not account for scenarios where information acquisition externally restricts future choices.

  ### 2. Arithmetic: EU with vs. Without Information
  - **Without test (free choice, chooses conservative treatment)**:  
    EU(no test) = EU(conservative) = (0.9 × 50) + (0.1 × 0) = 45  
    (Surgery EU = 0.9 × [(0.1×500) + (0.9×-100)] + 0.1 × [(0.9×500) + (0.1×-100)] = 0.9×(-40) + 0.1×440 = 8; conservative dominates.)  
  - **With test (hospital imposes treatment)**:  
    - If Type A (90% prob): Surgery → EU = (0.1×500) + (0.9×-100) = -40  
    - If Type B (10% prob): Conservative → EU = 0  
    EU(test) = (0.9 × -40) + (0.1 × 0) = -36  
  - **Comparison**:  
    EU(no test) = 45  
    EU(test) = -36  
    Expected value of information = EU(test) - EU(no test) = -36 - 45 = **-81** (strictly negative).

  ### 3. Objection: Why Not Commit to Ignore the Test?
  The agent cannot commit to ignore the test because the hospital’s policy is triggered by the *act of testing itself*. If the agent could commit to ignore, they would:  
  - Take the test, see the result, and freely choose:  
    - Type A: Conservative (EU=50)  
    - Type B: Surgery (EU=440)  
    EU(commit) = (0.9×50) + (0.1×440) = 89  
  This is higher than EU(no test)=45. The agent would **pay up to 44** (89 - 45) for this commitment ability. However, without commitment power, the agent faces the constrained action set, making the test harmful.

  ### 4. Ablation: Remove the Structural Feature
  **Neutralized feature**: Eliminate the hospital policy. With no constraints:  
  - After test, freely choose:  
    - Type A: Conservative (EU=50)  
    - Type B: Surgery (EU=440)  
    EU(test) = (0.9×50) + (0.1×440) = 89  
    EU(no test) = 45  
  Expected value of information = 89 - 45 = **+44** (positive).  
  The ablation shows the negative value stems solely from the action-set constraint.

  ### 5. Steelman: Defense of Good's Theorem
  A defender might argue:  
  "The negative value arises from the hospital’s constraints, not the information itself. Good’s theorem assumes the agent controls the action set. Here, the hospital takes away the agent’s autonomy after testing, violating the theorem’s premises. Information *itself* is still beneficial—the agent would use it optimally if allowed (EU=89). This is not a counterexample but an institutional failure."  

  **Rebuttal**:  
  The defender is partially right: the information is intrinsically valuable, but the theorem’s premises ignore that real-world information acquisition can alter decision contexts. The counterexample holds by exposing a gap in the theorem’s assumptions—it assumes **information doesn’t change the action set or game rules**, which is unrealistic in constrained environments (medical, legal, or strategic settings). The agent’s rationality is intact; the harm emerges from external constraints activated by testing.  

  ### Key Insight
  This case illustrates that Good’s theorem relies on the **invariance of the decision problem**. When information gathering alters the structure of choices (via constraints, strategic responses, or commitment loss), more information can be harmful. Rational agents must consider not just the information’s content, but **how its acquisition affects their option set**. In high-stakes, institutional, or game-theoretic settings, ignorance can preserve valuable flexibility.
