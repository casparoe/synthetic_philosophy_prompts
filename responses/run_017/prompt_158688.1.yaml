  If the student can get information about the exam difficulty before they decide to study, but the teacher sets the exam difficulty after seeing the student's study decision, then the information is about something that hasn't happened yet. So if the student gathers information, they are trying to predict the teacher's move, but the teacher will condition on the student's study decision.

  This is a game of incomplete information.

