answer: |-
  ## The Sum of Her Parts

  **Brainstorm:**
  1. **Setting:** Healthcare rationing board. **Characters:** Bureaucrats debating dialysis allocation. **Puzzle:** Leveling-down a single patient's quality-of-life years. **Weakness:** Might feel too similar to classic utility dilemmas, lacks novelty.
  2. **Setting:** Pension bureau calculating lifetime welfare supplements. **Characters:** Actuaries auditing past payouts. **Puzzle:** Recalculating a deceased individual's supplements year-by-year vs. life-total, finding disparity. **Weakness:** Lower inherent drama, deceased subject reduces stakes.
  3. **Setting:** "Chronos Bureau" approving/rejecting life-extension treatments based on predicted well-being profiles. **Characters:** Analyst, Chief Evaluator, Reformist Commissioner, Applicant. **Puzzle:** Leveling-down predicted high/low *years within one applicant's extended life*. **Weakness:** Requires sci-fi element. **Chosen:** #3. Highest stakes (life/denial), clearest visualization of intra-life inequality, directly showcases the temporal unit problem, and the bureaucratic "calculation" fits naturally with audits and signatures.

  **Story:**

  The Chronos Bureau’s Evaluation Chamber hummed with the low thrum of quantum processors. Silas Vorn, gaunt and hopeful, waited outside. Inside, Chief Evaluator Aris Thorne tapped a holoscreen displaying Silas’s projected life-extension profile: forty additional years. The graph spiked and plunged violently – years of profound disability (Well-Being Index: 10) juxtaposed with periods of vibrant activity (WBI: 30). Average: 20. Below the minimum threshold of 22 for approval.

  Commissioner Thea Vance leaned forward, her reformist zeal palpable. "Aris, this *is* the case for my proposal. The current square root transform isn't concave *enough*. Look at those nadirs! A WBI of 10 is catastrophic suffering. Our priority weighting must be steeper, showing greater concern for those worst-off *periods*." She projected her proposed transform: a deeper concave curve. "With this, the nadirs count for far more. It might push marginal cases like Vorn over the line."

  Aris sighed. "Thea, we've been over this. The Bureau doesn't chase equality for its own sake. We use prioritarianism precisely *because* it avoids the perverse incentive of 'levelling down'. Remember the Solon scandal? Deliberately worsening someone’s good years just to reduce inequality? Barbaric. Utterly irrational." He gestured emphatically. "With any strictly concave g, lowering *anyone's* well-being without benefiting *anyone* lowers the priority sum Σg(wᵢ). Always. That’s our bedrock. It’s why we weight *person-years*. We care about the suffering *in* each year, not some abstract lifetime average that masks misery. Your steeper g doesn’t change that fundamental immunity. It just weights the depths more heavily, which I understand, but it doesn’t endorse cruelty."

  Lyra Chen, the junior analyst auditing past cases, had been silent. Her screen displayed not a future projection, but a finalized case file: **Subject: Elara Morn / Extension Denied**. The original projection showed 20 years at WBI 10 followed by 20 at 30 – lifetime sum 40, average 20. Denied. But Morn had appealed, proposing a hypothetical alternative: 40 years levelled down to a constant WBI 19. Her plea: "Isn't a stable, moderate existence preferable to such extremes?" The original calculation under the standard square root transform: √10 + √30 ≈ 8.64. The levelled-down version: 2√19 ≈ 8.72. The sum was *higher*. The Bureau’s own system, weighting each year, deemed the *worse* total outcome (38 vs 40) as having a higher *priority value*. Lyra had re-run it with Thea’s proposed steeper logarithmic transform. Original: ln(10) + ln(30) ≈ 5.70. Levelled-down: 2*ln(19) ≈ 5.89. The anomaly was *worse*.

  Lyra’s voice was barely a whisper, but it cut through the room. "Chief... Commissioner... Case Morn. The appeal calculations." She shared her screen.

  Aris stared. The numbers were undeniable. The priority sum *increased* when Morn’s projected life was levelled down. Total well-being decreased. No one benefited. Yet the Bureau’s person-year metric, especially with Thea’s desired steeper g, registered an *improvement*. His bedrock principle crumbled. "This... this is one life. Segmented. We’re weighting the *years*..."

  "Exactly!" Thea snapped, momentarily triumphant, then horrified. "The units! We weight *person-years*, not *persons*. The 'no one benefits' argument assumes the *person* is the unit. But if the worst-off *year* is a separate moral patient...?" She trailed off, the implication chilling.

  Aris seized on a lifeline. "Then the unit is wrong! We must weight *whole lives*, not fragments! Σg(W), where W is total lifetime well-being!" He entered the Morn data. Lifetime W: Original 40, Levelled-down 38. g(40) = √40 ≈ 6.32. g(38) = √38 ≈ 6.16. *Now* the levelled-down version scored lower. Immunity restored. "There! The life is the unit. The sum of the years *is* the life's good. Levelling down always lowers g(W)."

  Lyra was already shaking her head. "But Chief... Silas Vorn. His natural lifespan was only 60 years. Someone with a projected 90-year lifespan, even at a constant low WBI of 15... g(90*15)=g(1350) is enormous compared to g(60*20)=g(1200) under a concave g. We’d *always* prioritize extending the already long-lived, however low their average, over giving even moderate extensions to the short-lived with higher averages. Is that just? Is that what prioritarianism means?" She pulled up the comparative calculations. The disparity under whole-life weighting was stark and, to Lyra, deeply unfair. Weighting years avoided that, but now created the Morn paradox.

  Thea looked sick. "So it's a choice: Abandon weighting years and potentially neglect the short-lived with good years... or keep weighting years and admit that, technically, making someone's life *worse* and *more equal* internally *can* increase the priority sum? My steeper g makes *both* problems worse – it exacerbates the levelling-down anomaly *and* the bias against the short-lived under whole-life weighting."

  Silence descended, thick and toxic. The processors hummed. Silas Vorn’s fate hung on a philosophical fault line exposed by Elara Morn’s audit.

  Aris looked at Vorn’s chaotic profile on his screen, then at the damning Morn calculations. The whole-life weighting resolved the anomaly but felt brutally unfair to the Silas Vorns of the world. The person-year weighting felt intuitively right for comparing disparate lifespans but now sanctioned a perverse result within a single life. Thea’s reform only deepened the contradictions.

  He pulled up the Denial Form for Silas Vorn’s application. The reason field blinked cursor. He could cite "Average WBI below threshold (20 < 22)" – the standard, safe under either model *for now*. Or he could cite "Priority sum insufficient under current transform (Σg(wᵢ) = 8.64)", implicitly endorsing the person-year model, knowing its flaw. Or... he could pause everything, demand a review of the fundamental unit.

  But the queue was long. Precedent mattered. The Commissioner was watching. Silas Vorn was waiting.

  Aris Thorne took a deep breath, his finger hovering over the authorization pad. He saw the spike at 30, the chasm at 10. He saw the ghostly sum 8.72 hovering over Elara Morn's levelled-down purgatory. He saw the theoretical abyss.

  He signed.
