  ### Karma as Moral Desert: Diagnostic Decision Tree  
  **Seed Commitment**: A wrongful act leaves a residual burden (remainder) that belongs first to the agent, and it is borne because it is *owed*, not merely because bearing it does good.  

  #### Branching Nodes (Forced-Choice Cases)  
  *Each node is a concrete case with a forced choice. Answer based on your commitment, not preference.*  
  1. **Trigger of Wrongfulness** (Case: Benevolent motive, foreseeable suffering)  
     - *Case*: A doctor, intending only to save a patient, uses a treatment known to have a 1% fatal risk. The risk materializes, and the patient dies.  
     - **Choice**: Is the act wrongful?  
       - (A) **Yes, due to foreseeable consequences** (even with good intent).  
       - (B) **No, due to benevolent intention** (despite bad outcome).  

  2. **Fault Requirement** (Case: No fault, unforeseeable suffering)  
     - *Case*: An engineer builds a bridge using best practices of the era. Decades later, an unforeseeable flaw causes collapse, killing many.  
     - **Choice**: Does the engineer bear a remainder?  
       - (A) **Yes, consequences alone create burden** (even without fault).  
       - (B) **No, burden requires fault** (intent or negligence).  

  3. **Model of Remainder** (Case: Clear wrongful act)  
     - *Case*: A thief steals bread to feed their starving family.  
     - **Choice**: What is the burden’s nature?  
       - (A) **Quantitative debt** (repayable, accumulable, like a loan).  
       - (B) **Qualitative character flaw** (requires inner change, e.g., remorse).  

  4. **Desert and Enforcement** (Case: Theft caught)  
     - *Case*: A thief is caught after stealing a valuable item.  
     - **Choice**: Does desert license enforcement?  
       - (A) **Yes, desert entitles others to exact the burden** (e.g., punishment).  
       - (B) **No, desert is only "fitting"**; enforcement needs separate justification.  

  5. **Justification of Fruit** (Case: Disproportionate suffering)  
     - *Case*: A person commits minor tax fraud, then loses all wealth and health in an unrelated disaster.  
     - **Choice**: If disaster is the "fruit," is it justified?  
       - (A) **Yes, if deserved** (regardless of outcomes).  
       - (B) **No, fruit must improve outcomes** (e.g., reform, deterrence).  

  6. **Transferability** (Case: Third-party volunteer)  
     - *Case*: A war criminal’s friend volunteers to serve their life sentence.  
     - **Choice**: Can the friend assume the burden?  
       - (A) **Yes, remainder can be transferred** (to volunteer or heir).  
       - (B) **No, burden is non-transferable** (attached solely to the agent).  

  7. **Persistence of Identity** (Case: Agent transformation)  
     - *Case*: A violent activist reforms, becoming a pacifist with no memory or traits of their past self.  
     - **Choice**: Do they still bear the burden?  
       - (A) **Yes, identity persists** (same person, so burden remains).  
       - (B) **No, identity changes** (burden dissolves if character/memory is gone).  

  ---

  #### Space of Possible Views  
  - **Formal possibilities**: 7 binary nodes → 128 combinations.  
  - **Pruned by entailment**:  
    - If **2A** (consequences alone create burden), then **1A** (consequences trigger wrongfulness) is implied. *Thus, 1B + 2A is incoherent and pruned*.  
    - If **3B** (burden is character flaw), then **6A** (transfer to third party) is unattractive (flaw can’t be "given away"). *Thus, 3B + 6A is unoccupied*.  
  - **Unexplored/unattractive combinations**:  
    - *1B + 2A*: Incoherent (faultless burden requires wrongfulness, but intent defines wrong).  
    - *3B + 6A*: Unattractive (character flaw isn’t transferrable).  
    - *4B + 5A*: Unexplored (desert is "fitting" but not enforceable, yet fruit imposed anyway).  

  ---

  #### Occupied Positions (Leaves)  
  *Labels avoid tradition names; historical schools are rough approximations.*  
  1. **Consequentialist Desert**  
     - *Path*: 1A, 2A, 3A, 4A, 5B, 6A, 7A.  
     - **Characterization**: Burden triggered by consequences; quantifiable debt; transferable; enforced to improve outcomes (e.g., deterrence); persists even if agent changes.  
     - **Awkward commitment**: Burden for unforeseeable harms (e.g., engineer in Node 2).  

  2. **Intentionalist Character Retributivism**  
     - *Path*: 1B, 2B, 3B, 4A, 5A, 6B, 7B.  
     - **Characterization**: Wrongfulness requires ill intent; burden is character flaw; enforced because deserved; non-transferable; dissolves if agent reforms.  
     - **Awkward commitment**: No burden for well-intentioned disasters (e.g., doctor in Node 1).  

  3. **Fault-Based Debt Retributivism**  
     - *Path*: 1A, 2B, 3A, 4A, 5A, 6B, 7A.  
     - **Characterization**: Burden from fault (intent/negligence); quantifiable debt; enforced because deserved; non-transferable; persists despite change.  
     - **Awkward commitment**: Burden for foreseeable risks (e.g., doctor) but not unforeseeable harms (e.g., engineer).  

  4. **Vicarious Atonement**  
     - *Path*: 1A, 2A, 3A, 4B, 5B, 6A, 7A.  
     - **Characterization**: Burden from consequences; quantifiable debt; transferable; not enforced by others (only assumed voluntarily); justified if it brings peace/reform.  
     - **Awkward commitment**: Transferable debt but no enforcement right (e.g., volunteer in Node 6).  

  5. **Reformist Non-Retributivism**  
     - *Path*: 1B, 2B, 3B, 4B, 5B, 6B, 7B.  
     - **Characterization**: Burden only from ill intent; character flaw; not enforced; fruit must reform; dissolves if agent changes.  
     - **Awkward commitment**: No mechanism to address burden if agent doesn’t reform voluntarily.  

  6. **Strict Liability with Mercy**  
     - *Path*: 1A, 2A, 3A, 4A, 5B, 6B, 7B.  
     - **Characterization**: Burden from consequences; quantifiable debt; enforced to prevent harm; non-transferable; dissolves if agent changes.  
     - **Awkward commitment**: Burden for unforeseeable harms (e.g., engineer) but waived if agent reforms.  

  7. **Karmic Debt without Enforcement**  
     - *Path*: 1A, 2B, 3A, 4B, 5B, 6B, 7A.  
     - **Characterization**: Burden from fault; quantifiable debt; not enforced; fruit must improve outcomes; persists but relies on conscience.  
     - **Awkward commitment**: Debt exists but no one may exact it (e.g., thief in Node 4).  

  8. **Character-Change Retributivism**  
     - *Path*: 1B, 2B, 3B, 4A, 5B, 6B, 7A.  
     - **Characterization**: Burden from ill intent; character flaw; enforced for reform; non-transferable; persists even if agent changes.  
     - **Awkward commitment**: Enforcing reform on someone already reformed (e.g., activist in Node 7).  

  ---

  #### Unoccupied but Coherent Combinations  
  - **1A + 2B + 3B + 4A + 5A + 6B + 7B**: Fault-based character burden enforced as desert, but dissolves if agent changes.  
    - *Why unoccupied*: Unattractive—desert licensing enforcement conflicts with burden dissolving on change.  
  - **1B + 2B + 3A + 4B + 5B + 6A + 7A**: Intentionalist quantitative debt, transferable but not enforceable.  
    - *Why unoccupied*: Unexplored—transfer without enforcement is practically inert.  

  ---

  #### Notes on the Tree  
  - **Indistinguishable leaves**:  
    - **Character-Change Retributivism** (Leaf 8) and **Intentionalist Character Retributivism** (Leaf 2) share *1B, 2B, 3B, 4A, 6B* and split only at Node 5 and Node 7. The tree cannot separate them until these nodes.  
  - **Highest-sorting node**: **Node 1 (Trigger of Wrongfulness)**.  
    - **Why**: It splits the broadest divide—whether consequences alone can trigger the burden—pruning half the space (incoherent 1B+2A) and forcing foundational choices (e.g., Leaf 1 vs. Leaf 2). It also shapes responses to cases like the doctor (benevolent motive) and engineer (no fault).  

  This tree maps commitments, not traditions. A student’s path may end at a leaf they reject—this reveals implicit commitments.
