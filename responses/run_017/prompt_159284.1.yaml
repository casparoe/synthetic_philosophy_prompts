prompt: |-
  Over dinner last night I had a long and inconclusive argument with a friend — she's an economist, and her position was that the backward-induction verdict in the centipede game is neither a prediction nor really a recommendation, but simply what rationality means, with the empirical fact that people pass several times before taking being noise generated by imperfectly rational subjects. I disagreed and yet couldn't say what I wanted instead. We are both auditing the same graduate game-theory course — the centipede came up last week, together with the common-knowledge-of-rationality argument and the reputation-style story about a small prior probability of facing a non-maximiser — and I came away realising that I have no clear idea what I would count as an adequate account of rational play in that game, which is why the argument kept going round in circles.

  So, before I read any further into the literature, I want the specification. Write me the desiderata that any adequate theory of how to play the centipede game would have to meet, where 'adequate' is fixed for two purposes at once: it must be able to advise a player who is actually sitting at, say, the fourth node wondering whether to take or to pass — that is, it must say something useful at nodes which the theory itself assigns probability zero — and it must be precise enough to be coded into an agent-based simulation whose output could be compared with laboratory play. For each requirement give the case or consideration behind it, i.e. why it is a genuine requirement rather than the taste of one camp, and mark which requirements are non-negotiable and which are negotiable or merely local preferences. Please stress-test the list against three variants I sketched afterwards, because my friend's answer did not obviously survive them: (i) a 'leaky' centipede in which, at each node, Nature terminates play with a known small probability and both players receive a fixed fraction of the current pot — several people at the table said this obviously makes passing reasonable, and I want to know whether a good theory is obliged to agree; (ii) a 'linked' pair of centipedes played consecutively against the same partner, where the size of the pot in the second game depends on how far the first game got, which seems to reopen the reputation story but ought not, on a sound view, to change the verdict; (iii) a version in which you do not observe your opponent's move directly but receive a noisy signal of it, so the game is no longer one of perfect information — I would like a requirement about how the theory's verdict should behave as the noise tends to zero.

  Finally, flag any pair or subset of the desiderata that you suspect cannot be jointly satisfied — that is the part I most want, since if the list is internally inconsistent then my friend and I were arguing over an imaginary good — tell me which single requirement excludes the largest number of otherwise attractive accounts, and add a one-line verdict on each of the usual suspects: the common-knowledge argument, the reputation story, level-k and cognitive-hierarchy models, quantal-response equilibrium, and social-preference explanations. Please don't give me citations, references or a reading list: I want the criteria themselves, not a tour of who said what. British English throughout, and please keep the whole answer, table included if you use one, to no more than 900 words.
reasoning: |-
  Okay, let me tackle this user's query step by step. The user had an argument about the centipede game with an economist friend, focusing on whether backward induction is a definition of rationality or something more. The user wants a set of criteria for any theory of rational play in the centipede game that must serve two purposes: advising a player at any node and being implementable in agent-based simulations. They also provide three variants to test the theories.

  First, I need to outline the core requirements. The user mentioned two main goals: actionable advice at any node and codability for simulations. So, the desiderata should include things like Prescriptive Actionability (telling a player what to do at any node, even off-equilibrium paths) and Implementability (being algorithmic for simulations). Both seem non-negotiable because without them, the theory isn't useful for real decisions or testable.

  Next, the user wants the requirements justified. For Prescriptive Actionability, the reason is that players reach nodes like the fourth one and need guidance, even if the theory assigns probability zero to that node. Without this, the theory fails in practical application. Implementability is crucial because without a clear algorithm, you can't simulate or compare with lab data, making the theory untestable.

  Then, there's the need for Rationality Compatibility. The theory must align with standard rationality axioms, like dominance and best-response. Otherwise, it wouldn't be a theory of rationality. This is non-negotiable. Also, Belief Revision & Off-Path Coherence is essential because when players deviate, beliefs must update sensibly. The user's example of the leaky centipede variant shows that if Nature can terminate play, passing might be reasonable, so the theory must handle unexpected moves without collapsing.

  Epistemic Transparency is about specifying necessary mutual knowledge. Without knowing what players know about each other, the theory's assumptions are unclear. This is negotiable but important for clarity. Parameter Parsimony matters for simulations; too many free parameters make models hard to test. This is negotiable but practical.

  The user's variants are key stress-tests. For the leaky centipede, a good theory should allow passing if termination risk makes it worthwhile, so the theory must incorporate uncertainty. In the linked centipedes, the second game's dependence on the first shouldn't change the backward induction result if rationality is common knowledge, testing Rationality Compatibility. The noisy signal variant requires Continuity in beliefs: as noise vanishes, play should approach the perfect information case.

  Now, identifying conflicts. Prescriptive Actionability might clash with Rationality Compatibility. Backward induction says to take immediately, but advising at later nodes requires deviating from equilibrium. How can a theory be both rational and prescribe off-path actions? Also, Epistemic Transparency and Parameter Parsimony might conflict if specifying beliefs adds parameters.

  The toughest requirement is probably Belief Revision & Off-Path Coherence. Many theories struggle with consistent belief updates off-path, like in the linked centipedes variant. If the first game ends early, how do beliefs form for the second? Reputation models might handle it but with added complexity.

  Assessing usual suspects: Backward induction fails Prescriptive Actionability (can't advise off-path) and Belief Revision. Reputation stories might handle linked games but need non-rational types, violating Rationality Compatibility. Level-k models are Implementable but have many parameters (against Parsimony). QRE allows trembles but may not ensure Rationality Compatibility. Social preferences add parameters and vary contextually, hurting Parsimony and testability.

  In the leaky centipede, passing could be rational if termination risk is high, which backward induction ignores. A good theory must adapt to such uncertainties. For linked centipedes, if players are rational, the second game shouldn't change the first's strategy unless reputation is involved, but the user wants a theory that doesn't rely on that. The noisy signal variant tests if the theory smoothly approaches the perfect info case as noise decreases, needing Continuity.

  Underlying all this is the user's need to resolve their argument. They suspect that no theory meets all desiderata, hence the internal conflict. Highlighting incompatible requirements shows why their debate was circular. The key is whether a theory can be both rational and practically applicable, which might be impossible without compromise.
answer: |-
  Below is a structured specification of desiderata for an adequate theory of rational play in the centipede game, stress-tested against your variants. Requirements are categorized by negotiability, with justifications and conflict analysis.

  ---

  ### **Core Desiderata**
  1.  **Prescriptive Actionability (Non-negotiable)**  
      *Must advise a player at any node (e.g., "At node 4, pass/take because...") even if that node has probability zero under the theory.*  
      **Why**: Players *reach* these nodes in practice (lab/real life) and need operational guidance. A theory failing here is inert for decision-making.  

  2.  **Implementability (Non-negotiable)**  
      *Must be algorithmically codable in an agent-based simulation (e.g., Python pseudocode) with clear inputs → outputs.*  
      **Why**: Empirical testability against lab data requires replicable computational mechanics. Vagueness ("be rational") is non-implementable.  

  3.  **Rationality Compatibility (Non-negotiable)**  
      *Must satisfy standard rationality axioms: no dominance violations, best-response to consistent beliefs.*  
      **Why**: Otherwise, it ceases to be a theory of *rationality* (per your friend’s core argument). Deviations (e.g., altruism) are *explanations* of irrationality, not rationality.  

  4.  **Belief Revision & Off-Path Coherence (Non-negotiable)**  
      *Must specify how beliefs update after unexpected moves (e.g., if opponent passes at node 1), justifying actions at subsequent nodes.*  
      **Why**: Players observe surprises and revise strategies. Theories assuming fixed beliefs (e.g., CKR forever) collapse under off-path play.  

  5.  **Epistemic Transparency (Negotiable)**  
      *Must state the mutual knowledge required (e.g., "Player 2 knows Player 1 is rational, but not that Player 1 knows Player 2 knows...").*  
      **Why**: Lab players lack common knowledge of rationality (CKR). Specifying minimal epistemic conditions aids testability.  

  6.  **Parameter Parsimony (Negotiable)**  
      *Should minimize free parameters (e.g., <5 for simulation calibration).*  
      **Why**: Over-parameterized models (e.g., 10+ belief types) overfit noise and lack predictive power.  

  ---

  ### **Stress-Testing Against Variants**
  | **Variant**               | **Requirement Implication**                                                                 | **Passes?**                                                                                              |
  |---------------------------|---------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | **(i) Leaky Centipede**    | *Must justify passing if termination risk outweighs immediate gain.*                        | **Yes only if** Belief Revision handles Nature’s moves. Backward induction fails; theories requiring CKR fail. |
  | **(ii) Linked Centipedes** | *Verdict in first game must be unchanged by second game’s existence if CKR holds.*          | **No** if reputation is invoked. Rationality Compatibility demands no ad-hoc dependency.                      |
  | **(iii) Noisy Signals**    | *As noise →0, recommended play must → perfect-information verdict.*                        | **Yes only with Continuity**: Beliefs/actions must converge smoothly (excludes discontinuous heuristics). |

  ---

  ### **Conflict Analysis**
  - **Incompatible Pair**: *Prescriptive Actionability* + *Rationality Compatibility*.  
    Rationality Compatibility demands backward induction under CKR (always take immediately). Prescriptive Actionability requires advising later nodes, but under CKR, reaching node 4 implies irrationality—advising a rational agent there is incoherent. **Resolution**: Theories must relax CKR (e.g., bounded rationality) or redefine rationality (controversial).  
  - **Most Exclusionary Requirement**: *Belief Revision & Off-Path Coherence*.  
    Eliminates backward induction (no belief updating), naive CKR arguments, and static equilibria. Forces dynamic models (e.g., sequential QRE, epistemic learning).  

  ---

  ### **Verdicts on Existing Approaches**
  | **Approach**                     | **Fatal Flaw (Per Desiderata)**                                  | **Verdict**                          |
  |----------------------------------|------------------------------------------------------------------|--------------------------------------|
  | Backward Induction (CKR)         | Fails Prescriptive Actionability, Belief Revision, Leaky variant | Inadequate.                          |
  | Reputation Stories               | Violates Rationality Compatibility (relies on irrational types) | Explains data, not rationality.      |
  | Level-k / Cognitive Hierarchy    | Struggles with Epistemic Transparency (arbitrary level 0)       | Implementable but not uniquely rational. |
  | Quantal Response Equilibrium (QRE) | Fails Off-Path Coherence (trembles lack belief revision)       | Actionable but incoherent beliefs.   |
  | Social Preferences               | Violates Rationality Compatibility (altruism ≠ rationality)     | Useful for prediction, not normative. |

  ---

  ### **Summary**
  Adequacy requires resolving the tension: *Rationality Compatibility* pushes toward early taking, but *Prescriptive Actionability* and *Belief Revision* force engagement with later nodes. Only models embedding **bounded rationality** or **refined epistemic conditions** (e.g., mutual *belief* in rationality, not knowledge) might satisfy all, but none flawlessly reconcile normative rigor with descriptive realism. Your variants confirm this: (i) forces stochastic planning (not CKR), (ii) exposes reputation as non-rational, (iii) necessitates continuous belief models. The literature’s "usual suspects" all fail at least one non-negotiable desideratum—your debate circles because no extant theory is fully adequate.
