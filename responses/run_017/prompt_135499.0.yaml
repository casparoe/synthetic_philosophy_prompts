prompt: |-
  So this has suddenly stopped being a hypothetical for me: my 7 year old just had a psycho-ed assessment come back (way behind on reading, and the report asks about family history — my brother and I both struggled with reading as kids), and my brother, who reads a ton of pop evo-psych stuff, sent me this passage from some book he's into in order to "set my expectations":

  "Heritability is a number between 0 and 1 that tells you how much of a trait is due to genes rather than environment. It's estimated mainly from twin and adoption studies: identical twins reared apart turn out strikingly similar in things like IQ, personality, and even political attitudes, and since they share all their genes but none of their family environment, the similarity that remains has to be genetic. For IQ in adults the number comes out somewhere around 0.6 to 0.8, which is high, and it rises with age — by adulthood the shared family environment contributes almost nothing, which is why parenting matters less for how children turn out than most people assume. Importantly, heritability is a population statistic: it describes variation within a group at a particular time, so it never licenses claims about any particular individual, and it says nothing about whether a trait could be changed. A high heritability does not mean immutable — adult height is around 0.8 heritable, and yet average heights have climbed steadily with better nutrition."

  His upshot is that there's not much point pushing hard on reading interventions, because if reading ability is largely genetic then the environment "mostly cancels out" in the end. He also uses the paragraph to argue that the average gap between boys and girls on reading tests is basically genetic, which I'm not even sure is the right kind of claim to be making from this sort of evidence.

  I'm inclined to think he's wrong about the intervention thing, but I don't want to beleive that just because I want it to be true. Can you go through the passage and tell me which bits a quantitative geneticist would actually endorse, which are shorthand they'd wince at but accept, and which are just wrong — and then whether his conclusion follows even from the parts that are fine? The twin-study bit is what I'd most like help with, since that's the part that sounds airtight and seems to be doing the most work in his argument. And if the passage leaves out something that matters for the practical question, tell me that too.
