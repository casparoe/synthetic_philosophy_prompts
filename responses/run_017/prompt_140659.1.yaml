prompt: |-
  So I got drafted onto the norms working group for Plover, the open source project I contribute to — the previous chair left kind of suddenly and somone had to finish the contributor guide before the summit in five weeks, and that someone is apparently me. The bit I'm stuck on is sorting every informal practice in the project into three buckets: enforced rules (CI or code-of-conduct backed, break one and you get sanctioned), conventions (we describe them, we don't enforce them — break one and you're not wrong, just confusing), and habits (we don't mention them at all). The bucket actually matters, bcs calling something a convention is us publicly promising not to punish it.

  Our old chair was a hardline Lewisian about this stuff — a convention solves a recurring coordination problem, the solution is arbitrary among the alternatives, and it holds together bcs everyone conforms, expects everyone else to conform, and conforms conditionally on the others conforming. I assumed that would make the sorting mechanical. It doesn't, and part of the problem is that the minutes from the last two years are full of rulings I can't derive from one clean rule. Roughly:

  - Everyone opens PRs against main even though develop exists and either would work fine; nobody can say why main won. Ruled: convention.
  - The weekly call is at 15:00 UTC; any slot would do if we all moved together; people show up bcs other people show up. Ruled: convention.
  - Commit messages in the imperative mood: basically universal compliance, everyone expects it — but the linter auto-flags anything else, so we ruled it not a convention. Same shaped regularity, wrong sustaining mechanism: the bot, not each other.
  - Reviewing PRs within ~48 hours: high compliance, people who lag get publicly nudged, and most of us would do it anyway to get our own stuff merged. Ruled: not a convention.
  - Running the test suite locally before pushing: near universal, but each of us would keep doing it alone — it catches our own bugs. Ruled: not a convention.
  - 'Fixes #123' lines in PR bodies. Everyone believes the founder decreed this back in 2016; she didn't, it started with one person and got copied. Ruled: still a convention.
  - Everyone thinks everyone else reads the monthly changelog; almost nobody actually does. Ruled: not a convention — expectations without behaviour don't count.
  - The docs team writes 'click' and the API team writes 'invoke'; stable in both, no interaction between the teams. Ruled: not a project convention, and the group point blank refused to say whether each team has its own.

  Now I've got two new ones to rule on next week and I genuinely can't tell which way our own precendents push.

  1. We migrated to a new tracker three weeks ago and design talk split between a Forum and a Chat, both equally workable. Within three days basically everyone was in the Forum, nobody proposed it, and each person says they went where everyone else was. There's no history anyone can appeal to — the Forum is three weeks old.
  2. Everyone posts a one-line 'shipped:' note to #done at the end of the day. Nobody reads #done, nothing of anyone's depends on anyone else doing it, and if half the project stopped the rest would drop it inside a week. But everyone knows everyone does it and everyone would feel like the odd one out being first to quit.

  Help me out: what two or three rules fit all eight earlier verdicts? What does each predict about 1 and 2? Which bucket should we put each in if we want to be consistent with ourselves, which old ruling is the closest analog in each case, and what principle are we committing to either way? And is there a third case — or a question I could put to the group at the summit — that would tell the surviving rules apart? I don't need references or reading lists, I just need the pattern in our own minutes.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of the Plover project's norms working group and need to categorize practices into enforced rules, conventions, or habits. The previous chair used Lewisian conventions, but the existing rulings have inconsistencies. The user provided eight examples and now has two new cases to classify. They want consistent rules based on precedents.

  First, I need to analyze the eight precedents to find common patterns. The key seems to be the sustaining mechanism: does the behavior rely on mutual expectations (convention) or something else? 

  Looking at the rulings:

  - PRs against main: mutual expectations → convention.
  - Weekly call time: mutual expectations → convention.
  - Commit messages: enforced by linter → not convention (enforced rule).
  - PR reviews within 48h: nudges and self-interest → not convention (more like habit or rule).
  - Run tests locally: self-interest → not convention.
  - 'Fixes #123': copied behavior, mutual expectations → convention.
  - Changelog reading: false expectations → not convention.
  - Team-specific terms: no interdependence → not project convention.

  The pattern emerges: conventions require mutual expectations and conditional behavior. If the practice is sustained by tools (linter), self-interest (tests), or external enforcement (nudges), it's not a convention. Also, false expectations (changelog) or isolated groups (terms) don't count.

  Now for the new cases:

  1. **Forum vs. Chat:** People went to the Forum because others did. No enforcement, just mutual expectations. Similar to the PRs against main or weekly call. Prediction: convention.

  2. **'shipped:' notes:** Everyone does it but no one depends on it. If half stop, others quit too. This feels like mutual expectations but no real coordination problem. However, the conditional conformity ("I do it because others do") aligns with conventions. But the ruling on the changelog (false expectations) might apply here since no one reads #done. But the behavior exists, unlike the changelog. So it's closer to 'Fixes #123'—mutual expectations drive the action. Prediction: convention.

  The user also asked for a test case to distinguish rules. A hypothetical where a practice has mutual expectations but lacks a coordination problem could clarify. For example, if people coordinate without a problem being solved, is it still a convention? 

  Deep needs: The user needs clarity to avoid arbitrary rulings and ensure consistency. They might also want to uphold the project's credibility by transparently categorizing norms without over-committing to enforcement. The summit could involve discussing whether conventions require solving a coordination problem or just mutual expectations.
answer: |-
  Based on the precedents, your rulings hinge on **three core principles** about what makes a *convention* in your project's Lewisian framework:

  1.  **Mutual Expectations:** Everyone believes others are following the practice and expects them to continue.
  2.  **Conditional Conformity:** Individuals follow the practice *because* they expect others to follow it (it solves a coordination problem).
  3.  **Non-Enforcement:** The practice is *not* primarily sustained by tools, sanctions, or individual self-interest alone.

  **The Rules Derived from Precedents:**

  1.  **The "Why" Rule:** If the *primary reason* individuals follow the practice is their expectation that others follow it (solving coordination), it's a convention. If the primary reason is self-interest, tool enforcement, or fear of sanction, it's not. *(See: Commit Messages vs. PRs against main, Tests vs. Weekly Call)*
  2.  **The "Interdependence" Rule:** If individuals would stop or change their behavior if others stopped (conditional conformity), it's a convention. If they'd likely continue regardless (self-interest) or are forced to continue (tool/sanction), it's not. *(See: 'Fixes #123' vs. Running Tests, PR Reviews vs. Weekly Call)*
  3.  **The "Reality Check" Rule:** There must be *actual* widespread behavior matching the widespread expectation. False consensus without action doesn't count. *(See: Changelog Reading)*

  **Applying Rules to New Cases:**

  1.  **Design Talk Location (Forum vs. Chat):**
      *   **Mutual Expectations:** ✅ Everyone went where they expected others to be ("each person says they went where everyone else was").
      *   **Conditional Conformity:** ✅ People chose the Forum *because* others were there, solving the "where do we coordinate?" problem. If everyone suddenly moved to Chat, individuals would follow. The solution (Forum) was arbitrary (either would work).
      *   **Non-Enforcement:** ✅ No tool forces it; no sanction for using Chat; no strong self-interest *dictating* one over the other initially.
      *   **Precedent Match:** *PRs against main* & *Weekly Call*. Arbitrary choice, sustained purely by mutual expectations solving coordination.
      *   **Prediction:** Convention.
      *   **Principle Committed To:** We publicly promise not to punish people for using the Chat for design talk *if* they coordinate with others to do so, but acknowledge the Forum is the established expectation. We won't force tooling/sanctions around location.

  2.  **'shipped:' notes in #done:**
      *   **Mutual Expectations:** ✅ "Everyone knows everyone does it".
      *   **Conditional Conformity:** ✅ **Crucially:** "everyone would feel like the odd one out being first to quit" and "if half the project stopped the rest would drop it inside a week." This shows conformity is conditional on others doing it. The "coordination problem" is subtle: signaling activity *in a way perceived as normal by the group* to avoid social awkwardness/standing out.
      *   **Non-Enforcement:** ✅ No tool enforces it; no sanction mentioned for not doing it; the *only* reason cited for continuing is avoiding being the odd one out (conditional conformity), not self-interest (since "nobody reads #done").
      *   **Precedent Match:** *'Fixes #123'*. An arbitrary practice (specific wording/location) copied and sustained purely by mutual expectation and conditional conformity to avoid being different, even if functionally redundant. Contrasts with *Changelog Reading* because people *actually do* post the notes.
      *   **Prediction:** Convention.
      *   **Principle Committed To:** We publicly promise not to punish people for *not* posting 'shipped:' notes. We acknowledge it's a social norm, not a requirement. People can stop without formal consequence (though social pressure might remain).

  **Resolving Ambiguity & The Test Case:**

  The closest precedent causing tension is the **Changelog Reading** ruling. It shows expectations alone aren't enough; behavior must follow. Both new cases pass this. The key distinction between a convention and a mere "habit" here is the **explicit conditional conformity** ("I do it because others do it / I'd stop if others stopped") versus just doing something routinely.

  **Test Case to Distinguish Rules (For Summit Discussion):**

  > "**The Coffee Maker Rule:** Suppose a project tradition develops where whoever empties the coffee pot brews a new one. Almost everyone does it consistently. Everyone expects others to do it. People brew a new pot *because* they expect others will do it when they empty it, and they'd be annoyed/stop if others consistently didn't. However, there's no written rule, no bot monitors it, and no one gets sanctioned for not doing it – just social grumbling. Is this a *convention* or just a *habit*?"

  *   **Why it Tests the Rules:**
      *   It has strong Mutual Expectations and Conditional Conformity (people brew *because* they expect reciprocity and would stop if others didn't).
      *   It solves a coordination problem (ensuring coffee is available).
      *   It lacks enforcement tools or sanctions.
      *   **The Crux:** Does the *social grumbling* ("Rule of Least Astonishment" effect) constitute a weak sanction, pushing it out of "convention"? Or is the primary driver still the mutual expectation and conditional conformity? Your ruling on *PR Reviews* (nudges) suggests social pressure might disqualify it. Your ruling on *'Fixes #123'* and *'shipped:'* suggests it wouldn't.

  *   **What the Answer Reveals:**
      *   If **Convention**: Your group prioritizes the core Lewisian mechanics (mutual expectation + conditional conformity solving coordination) over mild social enforcement. Social grumbling is seen as an *outcome* of the convention breaking, not its *sustaining mechanism*. This aligns with the 'shipped:' ruling proposed above.
      *   If **Not a Convention (Habit or enforced)**: Your group considers even informal social pressure (like nudges for PR reviews or grumbling about coffee) as a form of sanction, moving the practice away from the pure "we promise not to punish" bucket. This would make the 'shipped:' notes ruling harder to justify and suggest the Coffee Maker is more like your *PR Reviews* ruling.

  **Conclusion for Consistency:**

  1.  **Design Talk Location:** **Convention** (like PRs against main / Weekly Call). Arbitrary choice, sustained by mutual expectations solving coordination.
  2.  **'shipped:' notes:** **Convention** (like 'Fixes #123'). Arbitrary practice, sustained by mutual expectations and conditional conformity (avoiding being the odd one out), despite no functional dependence.
  3.  **Key Principle:** Your group defines a convention by the *motivation for conformity* (conditional on others) solving an arbitrary coordination problem, *not* by the absence of *all* social pressure, but by the absence of *formal* enforcement or *primary* reliance on self-interest/tools. Mild social effects are a byproduct.
  4.  **Summit Question:** Pose "The Coffee Maker Rule" to force a discussion on whether mild social pressure (nudges, grumbling) constitutes "sanction" that invalidates the "convention" label, ensuring clarity for future rulings.
