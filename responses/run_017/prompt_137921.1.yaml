answer: |-
  ### Recommendation
  I recommend adopting the standard of **adequate evidence or justification at the time of posting** for your rule. This means an answer violates the rule if it states a claim as fact without providing sufficient supporting evidence or justification in the text, judged against what was reasonable when posted. 

  **Why it beats the others in your setting:**
  - **Knowledge/truth**: Unworkable—you can't verify truth or peer into posters' minds.  
  - **Belief/sincerity**: Too subjective—sincere but baseless claims still mislead readers.  
  - **Reasonableness**: Vague and prone to inconsistency—your arbitrators need clear textual anchors.  
  **What you lose**: Some true claims from knowledgeable posters may be penalised if evidence isn't provided (e.g., an expert who doesn't cite sources). But this trade-off prioritises reliability and reproducibility over individual credibility, which is essential for your high-stakes, low-context environment.  

  ### Procedure for Arbitrators  
  **Key principles**:  
  - Assess only the text at the time of posting. Ignore later revelations (e.g., "I guessed" in a follow-up).  
  - Basis tags are **evidence only**—not normative. A blank tag isn’t a violation but weakens the case for evidence.  
  - Machine translation: Use original text if available; if ambiguous, treat as a claim (err on caution).  
  - Shared accounts: Hold the **account** responsible. Evidence must be in the post—no group mental states.  
  - Timeliness: Standards apply **only at posting time**. Outdatedness isn’t a rule violation but may warrant a caveat (Step 3).  

  **Procedure** (runnable in 15 mins on a phone):  
  | Step | Question | Evidence | If met → | If not met → | Terminal? | Maps to action |  
  |------|----------|----------|----------|--------------|-----------|---------------|  
  | 0 | Is this a factual claim? (vs. guess/suggestion/hypothetical) | Definitive language (e.g., "is", "must", no "I think"); specificity (numbers, absolutes); machine translation quirks. If original text available, use it. | Proceed to Step 1 | **Stop: Leave** | Yes if not met | Leave |  
  | 1 | Was adequate evidence/justification provided *in the post* at posting time? | Basis tag (if present), source links/citations, specificity of claim (vague = less evidence needed), checkability (obscure claims need more evidence), personal experience (only valid for own cases). **Weight**: Source > basis tag > specificity. Blank tag = weak evidence. | **Stop: Leave** | Proceed to Step 2 | Yes if met | Leave |  
  | 2 | Was the claim common knowledge *at posting time*? | Basic, widely known facts (e.g., "UK VAT is 20%"). Not common if: stats, regional nuances, recent changes. | **Stop: Leave** | Proceed to Step 3 | Yes if met | Leave |  
  | 3 | What action fits severity? | Harm potential (financial/legal stakes > minor advice), poster history (first-time vs. repeat). No evidence → hide; low harm → caveat; high harm/repeat → hide + warn; legal complexity → escalate. | - | - | Yes | Varies |  

  **Judgement points** (cannot be fully proceduralised):  
  | Step | Why not proceduralisable? | Who decides | Values in play |  
  |------|---------------------------|------------|----------------|  
  | 0 | Ambiguity in tone/hedging (e.g., machine translation). | Arbitrator | Caution vs. fairness: Protect readers from unvetted claims without stifling helpful suggestions. |  
  | 1 | "Adequate" evidence depends on context (e.g., a stat vs. general advice). | Arbitrator | Reliability vs. accessibility: How much proof is needed for a lay audience to act safely? |  
  | 3 | Severity hinges on predicting real-world harm. | Arbitrator | Proportionality: Penalising minor errors harshly could drive away good contributors. |  

  ### Case Applications  
  **Case 1**:  
  - Step 0: Flat declaration ("has six years") → **claim**.  
  - Step 1: No evidence (blank tag, no source) → **not met**.  
  - Step 2: "Six-year limit" isn’t common knowledge → **not met**.  
  - Step 3: Low harm (claim was true, no urgency) → **Require caveat** (e.g., "Based on poster’s recollection, verify with official sources").  
  - Verdict: **Require caveat** | Confidence: High | Agreement: High (reproducible) | Reason: No evidence for specific claim.  

  **Case 2**:  
  - Step 0: Specific stat ("nine times in ten") → **claim**.  
  - Step 1: Linked source (spreadsheet) → **evidence met**. → **Leave**.  
  - Verdict: **Leave** | Confidence: High | Agreement: High | Reason: Source provided adequate evidence at time.  
  - *Note: Outdated but not a rule violation. Add caveat via separate process if needed.*  

  **Case 3**:  
  - Step 0: Original text shows hedging ("I don’t think... not sure") → **not a claim**. → **Leave**.  
  - Verdict: **Leave** | Confidence: High (with original text) | Agreement: High | Reason: Not stated as fact.  

  ### Verdicts You’ll Dislike  
  | Case | Verdict | Expected Verdict | Recommendation |  
  |------|---------|------------------|----------------|  
  | 1 | Require caveat | Leave | **Accept the verdict**. The rule enforces evidence, not truth—readers can’t distinguish correct guesses from knowledge. |  

  ### Known Misfires  
  | Pattern | Direction | Mitigation |  
  |---------|-----------|------------|  
  | Experts who state truths without evidence (e.g., solicitor forgetting to cite). | Over-penalises | Step 2: Leniency on "common knowledge" in professional domains (if basis tag = "training"). |  
  | False claims with strong-but-wrong evidence (e.g., outdated official link). | Under-penalises | Step 3: Hide if harm occurs; escalate complex cases. |  
  | Machine-translated ambiguity without original text. | Over-penalises | Step 0: If unclear, arbitrators discuss (escalate if low confidence). |  

  ### Unresolved  
  - Outdated answers (e.g., Case 2): No violation, but harmful. *Mitigation: Separate "accuracy audit" process.*  
  - Personal experience misused as general rule: Relies on arbitrator judgement (Step 1).  
  - Shared accounts with conflicting expertise: No recourse if evidence isn’t posted.  

