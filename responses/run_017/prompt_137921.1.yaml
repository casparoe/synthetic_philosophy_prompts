prompt: |-
  I volunteer as a senior moderator on a large peer-advice forum, where members post practical questions about tenancy, consumer rights, small-claims procedure, benefits and employment, and other ordinary members answer them. No professionals, no verification step. I help train and oversee a team of about forty volunteer arbitrators who between them rule on roughly forty reported answers a week. The rulings are made from the text of a thread, usually on a phone, usually within fifteen minutes, by people with no relevant training. We cannot interview the poster, who frequently never replies, and we can never see inside anyone's head — only what they wrote. Two arbitrators given the same answer should reach the same verdict, or the team loses credibility. The only actions available to us are: leave the answer; require the poster to add a caveat; hide the answer; hide it and put a warning on the account; or escalate to the two paid community managers. People act on these answers, and a wrong ruling either emboldens confident guessers or drives away exactly the careful members we want to keep, so the stakes are real but bounded.

  Our rule, inherited from the site's founder, reads: don't state as fact anything you don't know. Nobody has ever defined it, and an argument in the moderators' channel convinced me that the disagreement is a philosophical one that I cannot settle. Reading about it on my own (I have no academic background; I have been going by encyclopedia entries and arguments online) I take the candidates to be: that stating-as-fact is governed by knowledge; or by truth; or by belief, or sincere belief; or by having adequate evidence or justification; or by being reasonable or responsible in the circumstances. Each of these gives different verdicts on the same answer, and I do not know which one our rule should be read as.

  So, two things.

  First: recommend one. Tell me which of those the rule should be understood as codifying, given what the rule is for — answers that get acted on by people who cannot check them, evidence limited to the text, and a community we want to keep. I do not want a survey of the options with their strengths; I want a recommendation, the reason it beats the others in our setting, and an honest note about what we lose by choosing it. Please do not tell me which philosophers hold which view or point me towards things to read; I cannot chase references and it would not settle anything for us.

  Second: turn it into a procedure an arbitrator can actually run, in order, with what counts as a sufficient answer to each question, where it stops early with a no violation, and where it hands the decision to a person because the question is one of values rather than facts. It has to be runnable in fifteen minutes from a phone, by a volunteer who has never heard any of this, and reproducible. Assume the poster's actual mental state is never available: say which proxies in the text do the work (basis tags, specificity, whether a source is given, whether the claim is about the poster's own case or a general rule, whether it is checkable), and be explicit about how much weight each carries. Tell me which distinctions from the philosophical argument have to survive the simplification and which we can drop without the procedure breaking.

  There are four features of our forum that I have not seen discussed and that the procedure has to handle:

  1. Answers are almost never edited and stay up for years, and they get re-served to new readers through already-answered links. Must the standard be met continuously, or only at the moment of posting? If a claim was fine in 2016 and is misleading now, is the failure the poster's or ours, and does our action set even fit that kind of failure?

  2. Some answers are posted from shared accounts: a small advice charity with three staff on one login, or two family members sharing one. Whose knowledge or evidence has to stand behind the claim? Is there a group version of the rule, and does the verdict change when no individual member of the group qualifies?

  3. A large share of posts are written in another language and machine-translated, which flattens hedges into flat declarations and sometimes does the reverse. We often cannot tell whether something was offered as a fact or as a guess. The procedure needs a step zero for whether this is even a claim being stated as fact rather than a suggestion, a guess, a hypothetical or a hedged remark, and it needs to say what to do when the text is genuinely ambiguous, including who bears the cost of that ambiguity.

  4. We require a basis tag (personal experience, training, read it somewhere, worked it out), but members leave it blank or tick the wrong one. Say whether the tag does normative work or is merely evidence, and whether a blank tag is itself a violation.

  Then apply the procedure to three cases. Take the facts as I state them; I am not asking you to check any law.

  Case 1. A member with a blank basis tag answered a question about an old debt with a flat sentence: your landlord has six years to chase this, so don't panic. Nothing else, no source. Assume the six-year figure is correct. Nothing was reported at the time. In an unrelated thread a year later, the same member wrote: I posted that from memory, I wasn't certain, it just sounded right. The old answer has now been reported on the strength of that admission.

  Case 2. An answer posted in 2017 states that tribunals award costs in cases like the reader's about nine times in ten, and links a spreadsheet of 180 cases from one region between 2010 and 2014 showing 88 per cent. The basis tag says read it somewhere. The poster has no expertise. Assume the figure was accurate for that period and region and that the poster neither knew nor had any reason to suspect any change. The answer is still live, gets around two hundred views a month through already-answered links, and the relevant procedural rules changed in 2021 so that the true rate is now nearer one in two.

  Case 3. A post from a shared account used by two staff at a small advice charity, machine-translated, reads: the landlord is not permitted to do this and you should refuse. A bilingual member later pasted the original-language version into the thread, which reads more like: I don't think they're allowed to do that, but I'm not sure, please check. A reader refused and lost a month's rent. Assume the claim was in fact false.

  I expect case 1 to come out as leave — the answer was right and nobody was misled — and I also expect case 2 to come out as leave, because the evidence there is better than in almost anything else I see. If your procedure says either of those is a violation, say so plainly and tell me whether the right response is to accept the verdict or to change the rule instead.

  Finally: mark the points at which judgement cannot be eliminated and say why, and be honest about where the procedure will misfire in use — which patterns it will systematically over-penalise or under-penalise, and what mitigation you would build in.

  After the procedure and the cases, give me a structured summary as a single JSON object with exactly these fields:

  recommended_norm (one sentence, in plain words, as I should word it in the guidance note);
  rejected_alternatives (array of objects, each with: alternative — which of the candidate standards it is; decisive_objection — why it fails for our setting specifically);
  procedure (array of objects, one per step, each with: step (integer), question (what the arbitrator asks), evidence (what in the text counts towards an answer), if_met (what happens next), if_not_met (what happens next), terminal (true if the procedure stops here with a verdict), maps_to_action (one of: leave, require caveat, hide, hide and warn, escalate, none));
  judgement_points (array of objects, each with: step, why_not_proceduralisable, who_decides, what_values_are_in_play);
  worked_cases (array of objects, one per case, each with: case (1, 2 or 3), assertion_identified (whether step zero finds a claim stated as fact, and why), step_reached, verdict (one of: leave, require caveat, hide, hide and warn, escalate), confidence (high, medium or low), second_moderator_agreement (high, medium or low), one_line_reason);
  verdicts_i_will_dislike (array of objects, each with: case, verdict, expected_verdict, recommendation (accept the verdict or change the rule, with a one-sentence reason));
  known_misfires (array of objects, each with: pattern, direction (over-penalises or under-penalises), mitigation);
  unresolved (array of strings: anything the procedure cannot settle).

  Use British English throughout, and keep the prose tight enough that I can turn it into a one-page guidance note for the team.
reasoning: |-
  We are designing a procedure for moderators to apply the rule: "don't state as fact anything you don't know." The goal is to have a consistent, reproducible process that protects users from acting on unreliable information while preserving the community's valuable contributors.

  After considering the alternatives (knowledge, truth, belief, evidence, reasonableness), I recommend the standard of **adequate evidence or justification** for the claim, given the context of the forum. 

  Why this standard?
  - **Knowledge** is too strict because it requires truth and justification, but we cannot verify truth and the poster's mental state is inaccessible.
  - **Truth** is impossible for moderators to assess without investigation.
  - **Belief** or sincere belief is too permissive; one can believe false things sincerely, leading to harmful advice.
  - **Reasonableness** is vague and context-dependent, which may lead to inconsistent rulings.

  **Adequate evidence or justification** balances the need for reliability with practicality. It focuses on what the poster presents in the text and whether it provides a reasonable basis for a reader to act. It also allows for the fact that non-experts can give good advice if they have done their homework. 

  What we lose: 
  - We might penalize someone who actually knew but failed to provide evidence (e.g., an expert who doesn't cite). But in our setting, without verification, we must rely on what's written. 
  - We might allow an answer with weak evidence that turns out to be true, but the standard is about the support at the time of posting.

  **The procedure must be step-by-step, runnable in 15 minutes on a phone, by untrained volunteers, using only the text.**

  ### Step Zero: Identify if a claim is being stated as fact
  - **Question:** Is the statement presented as a factual claim (as opposed to a suggestion, guess, hypothetical, or hedged remark)?
  - **Evidence:** Look for linguistic markers: 
    - Declarative sentences (e.g., "The law says...") vs. hedged language (e.g., "I think...", "Probably...", "It might be that..."). 
    - Absence of qualifiers (like "in my experience", "I believe") and presence of definitive language.
    - In machine-translated text, be cautious: flattened declarations may be artifacts. Look for words that typically indicate uncertainty in the original if available (e.g., "maybe", "perhaps") but if ambiguous, treat as a claim only if it reads as a flat declaration.
  - **If met:** Proceed to Step 1.
  - **If not met:** No violation. **Terminal: Leave.**
  - **If genuinely ambiguous:** Treat it as a claim (because the cost of under-penalizing is higher – readers might act on it as fact) but note low confidence. Proceed to Step 1.

  **Note:** Basis tags are evidence, not normative. A blank tag is not a violation by itself, but it means no evidence of basis is provided.

  ### Step 1: Check for evidence or justification in the post at the time of posting
  - **Question:** At the time of posting, did the poster provide evidence or justification that was adequate for the claim?
  - **Evidence:**
    - Basis tag (if present and plausible): 
      - "Training" or "professional experience" might be adequate for common knowledge in that field, but not for obscure points.
      - "Read it somewhere" requires a source (link or description) unless the claim is widely known (e.g., "you have 14 days to cancel" might be common, but "six years" is not).
      - "Worked it out" must show reasoning (e.g., "because X regulation says Y, and your case is Z").
      - "Personal experience" is adequate only for claims about one's own experience (e.g., "my landlord did X") but not for general rules (e.g., "all landlords must do Y").
    - Source provided: Link or named source (e.g., "Gov.uk says..."). The source must be credible and relevant.
    - Specificity: The more specific the claim, the more evidence needed (e.g., "nine times in ten" requires data; "usually" might not).
    - Checkability: If the claim is easily checkable (e.g., a well-known law), less evidence might be needed, but if it's obscure or complex, more is required.
  - **If met:** No violation. **Terminal: Leave.**
  - **If not met:** Proceed to Step 2.

  ### Step 2: Assess if the claim was common knowledge at the time of posting
  - **Question:** At the time of posting, was the claim common knowledge in the relevant community (e.g., UK tenants/consumers) such that no evidence was needed?
  - **Evidence:**
    - The claim is widely known and uncontroversial (e.g., "you have a right to a rent book").
    - It is a basic fact in public domain (e.g., "VAT is 20%").
    - Not common if it is a statistic, a recent change, or a nuanced legal point.
  - **If met:** No violation. **Terminal: Leave.**
  - **If not met:** Violation. Proceed to Step 3 for action.

  ### Step 3: Determine the action
  - **Question:** What action is appropriate given the violation and its potential harm?
  - **Evidence:**
    - Severity: 
      - If the claim is minor and unlikely to cause harm (e.g., a small inaccuracy in a non-critical area), then **Require caveat** (e.g., add a note: "This might be out of date").
      - If the claim is significant and could lead to serious consequences (e.g., financial loss, legal risk), then **Hide** the answer.
    - Poster's history: If the account has prior violations, **Hide and warn**. If no prior, then hide without warning.
    - If the case is complex or involves legal nuances beyond the arbitrator's competence, **Escalate** to community managers.
  - **Terminal:** Action taken.

  ### Handling the four features:
  1. **Timeliness:** The standard is at the time of posting. If a claim becomes outdated (like Case 2), it's not the poster's fault. We handle it by requiring a caveat if we notice (via Step 3: severity assessment – if the outdatedness could cause harm now, we add a caveat or hide, but no violation of the rule at time of posting).

  2. **Shared accounts:** The group is responsible. The evidence must be in the post. If one member knew but didn't post evidence, it fails. The rule applies to the account as a whole.

  3. **Machine translation:** Step zero handles this. If the original text (if available) shows hedging, then it's not a claim. If not, and the translation is flat, we treat it as a claim and check evidence. In ambiguity, we err on the side of caution (proceed as claim).

  4. **Basis tag:** It is evidence only. A blank tag is not a violation by itself, but it means Step 1 (evidence) is not met unless other evidence is in the text.

  ### Application to cases:

  **Case 1:**
  - Step 0: "your landlord has six years to chase this" is a flat declaration → claim stated as fact.
  - Step 1: No evidence in the post (blank basis tag, no source, no reasoning). Not met.
  - Step 2: Is "six years for debt recovery" common knowledge? In UK, limitation periods are not universal common knowledge → not met.
  - Step 3: Violation. But the claim was true and no one was misled at the time. Severity low. Action: Require caveat? However, note the admission was later. The rule is about the post at the time. Since the post lacked evidence, it's a violation. But in Step 3, because the claim was true and no harm, we might just require a caveat. However, to be consistent: the harm potential is there (someone might act without checking). But the case is reported a year later. 
    - **Verdict:** Require caveat (e.g., "This answer was posted from memory without verification"). 
    - But note: the answer was correct. However, the rule is about evidence, not truth. So we do not leave it.

  **Case 2:**
  - Step 0: "tribunals award costs in cases like the reader's about nine times in ten" → claim stated as fact.
  - Step 1: Basis tag "read it somewhere" and a linked spreadsheet with data → evidence provided. Adequate at the time (2017). → Met. Terminal: Leave.
  - Note: The rule is assessed at the time of posting. The change in 2021 doesn't make the original post a violation. We might add a caveat for timeliness, but that's not a rule violation. So leave, but consider adding a caveat via Step 3 for outdatedness? But Step 3 only comes into play if violation. Here, no violation. We could have a separate process for outdated answers, but it's not covered by this rule.

  **Case 3:**
  - Step 0: Machine-translated: "the landlord is not permitted to do this" → flat declaration. But the original text: "I don't think they're allowed" → hedged. Since we have the original (provided by a member), we use that. → Not a claim stated as fact. 
  - Step 0: Not met → Terminal: Leave.
  - But note: the reader acted and suffered loss. However, the original text was not a factual claim. So no violation.

  ### Verdicts I will dislike:
  - Case 1: I expected "leave", but the procedure says "require caveat" because of lack of evidence at time of posting. 
    - **Recommendation:** Accept the verdict. The rule is about evidence, not truth. Without evidence, even a correct claim can mislead if the reader assumes it's backed.

  ### Known misfires:
  - **Pattern:** Over-penalizes experts who state true facts without evidence because they know it. 
    - **Direction:** Over-penalizes.
    - **Mitigation:** In Step 2, common knowledge might cover some expert domains, but if not, we accept that the rule requires evidence for reproducibility.
  - **Pattern:** Under-penalizes false claims with good evidence that later proves wrong (e.g., a source that was authoritative at the time but contained errors).
    - **Direction:** Under-penalizes.
    - **Mitigation:** We focus on evidence at the time. If the evidence was adequate then, no violation. But we might hide outdated answers via a separate process.

  ### Unresolved:
  - How to handle outdated answers that were compliant when posted but now misleading (like Case 2). The current rule doesn't cover this. We might need a separate rule or a periodic review.
  - How to handle cases where the poster had knowledge but didn't state it (e.g., an expert who didn't cite). We can't know, so we go by the text.

  ### Judgement points:
  - Step 0: Ambiguity in whether a claim is stated as fact. Why not proceduralisable? Language is complex and context-dependent. Who decides: arbitrator. Values: Caution (protecting readers) vs. fairness to poster.
  - Step 1: What counts as "adequate" evidence. Why not proceduralisable? Depends on the claim's complexity and context. Who decides: arbitrator. Values: Reliability vs. accessibility of advice.
  - Step 3: Severity of harm. Why not proceduralisable? Requires prediction of consequences. Who decides: arbitrator. Values: Proportionality.

