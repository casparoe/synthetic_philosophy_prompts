prompt: |-
  I'm a backend engineer, and for about three years I've been one of nine volunteer moderators on a large online community for programmers (roughly 12,000 members: a few busy general channels plus per-topic channels). Our code of conduct says we moderate conduct rather than opinions, but in practice the escalations that consume us are political arguments, and the accusation that gets thrown in both directions, several times a week, is that the other person is not arguing in good faith. Right now each of us decides that by feel, which means the outcome depends on which moderator is on shift and on whether the moderator happens to agree with the poster. We handle maybe four or five such escalations a week; a ban is a real cost to the person and has to be explained to them in writing and defended to a three-person appeals committee drawn from the membership; and whoever is on shift has fifteen or twenty minutes, no training in any of this, and a rule that the written explanation cannot be longer than a short paragraph. So I want something my team can actually run rather than a discussion of the topic.

  The rough distinction I keep coming back to is that three quite different things get bundled together when we say someone is arguing in bad faith: insincerity, where the person is saying what they don't believe in order to win or to provoke; closed-mindedness, where they are sincere but no evidence would ever move them; and something like asymmetry, where they hold one standard of evidence and charity for their own side and a much harsher one for the other. My sense is that the third is doing most of the real work, and that it is also the one we can least see directly, because we only ever observe words. I also half-remember a point from something I listened to a while back, which I may be mangling: that a group like ours becomes an echo chamber not by holding extreme beliefs but by teaching its members to discount every source outside it, so that a person can be perfectly sincere, civil, and well-informed-by-their-own-lights and still be structurally unreachable by anything we or the other side could say. If that is roughly right it should change what the procedure looks for: not sincerity, which we cannot test, but signs that the person's beliefs are still in contact with outside sources and that their standards travel. We have improvised versions of this — asking whether the person would accept the standard they are applying if the sides were reversed, whether they have ever conceded something costly in front of their own allies, whether they can state the other side's case well enough that the other side would accept it — but we apply them inconsistently and mostly to people we already dislike.

  Please turn this into a written procedure my moderators can follow in the time they have: the questions in order, what counts as a clear pass or a clear failure at each, the point at which the procedure stops and says take no action, and the point at which it stops and hands the decision to a person or to the appeals committee because the remaining question is one of values rather than evidence. Tell us explicitly which of our current tests are worth keeping and which are noise. Then run the finished procedure on three real cases from last month. First: a long-standing contributor, unfailingly polite, popular, who posts only links from one outlet, has never in three years conceded a point, and who happens to agree with me politically — I strongly suspect your procedure will tell me to treat him as not worth engaging with, and I want to see whether it does and whether I have to accept that. Second: a poster who is regularly rude and has been warned for tone, but who last month wrote a long public retraction when a study he had been citing for a year turned out to be flawed, and who argues with people on his own side at least as often as with the other one. Third: a newer member who demands that anyone disagreeing with them first produce a statement of their position strong enough that they themselves would endorse it, and who treats any failure to do so as proof of bad faith, so that the demand can be renewed indefinitely. Finish by saying plainly what the procedure cannot do — in particular whether it can separate bad faith from mere ignorance, and whether it can be turned on me and on my own side of these arguments without becoming just another way of winning them.

  Please lead with your bottom line in the first sentence and then give the reasoning and the worked cases, with no preamble and no restating of what I asked.
reasoning: |-
  We are creating a procedure to assess "bad faith" arguments in three specific dimensions: insincerity, closed-mindedness, and asymmetry (double standards). However, we acknowledge that insincerity is hard to prove and closed-mindedness might be structural (e.g., echo chamber effects). Therefore, the procedure focuses primarily on asymmetry and structural closed-mindedness, which are more observable and have the most impact on the health of the community.

  The procedure is a step-by-step checklist to be applied in the order given. At each step, if the evidence is clear, we stop and take the indicated action. If unclear, we move to the next step. The goal is to resolve most cases within 15-20 minutes with a short paragraph explanation.

  **Procedure for Assessing "Bad Faith" in Escalated Arguments**

  1. **Check for Asymmetry in Standards of Evidence/Charity**
     - Ask: "Does the user apply the same standard of evidence and charity to both sides of the argument?"
     - How to check: Look at the user's recent messages (in the current thread and, if necessary, a few past ones) for:
       - Differing thresholds for accepting claims (e.g., demanding rigorous proof for one side but accepting anecdotes for the other).
       - Differing interpretations of ambiguity (e.g., giving the benefit of the doubt to one side but assuming the worst of the other).
       - Use of loaded language or stereotypes for one side but not the other.
     - Clear pass: The user explicitly acknowledges a weakness in their own side or a strength in the opposing side, or their demands for evidence are consistently applied.
     - Clear failure: The user repeatedly shows a pattern of double standards (e.g., three or more instances in the thread) that heavily favors one side.
     - Action if clear failure: Issue a warning or ban (depending on severity and history) for bad faith arguing. Explanation: "You are applying different standards to different sides, which violates our rule against bad faith engagement."
     - Action if clear pass: Move to step 2.
     - If unclear: Move to step 2.

  2. **Check for Structural Closed-Mindedness (Echo Chamber Risk)**
     - Ask: "Is there evidence that the user's views are informed by and responsive to multiple sources, including those outside their usual perspective?"
     - How to check: Look at the user's history (last 3-6 months) for:
       - Citing or engaging with a variety of sources (not just one outlet or type).
       - Changing their view (even slightly) when presented with new evidence.
       - Engaging constructively with opposing views (e.g., asking questions, conceding minor points).
       - If the user is a long-standing member, note any pattern of never conceding points or only using one outlet.
     - Clear pass: The user has, in the past, changed their mind, cited diverse sources, or conceded points in an argument (like the second example case).
     - Clear failure: The user has a long pattern (e.g., over 6 months) of never conceding a point, never changing their mind, and only citing one type of source (like the first example case). Also, if the user explicitly rejects all external sources (e.g., "only X outlet is trustworthy").
     - Action if clear failure: Consider a temporary ban and a note that repeated pattern of closed-minded engagement is harming discussion. Explanation: "Your pattern of engagement shows an unwillingness to consider alternative perspectives, which violates our rule against bad faith arguing."
     - Action if clear pass: Move to step 3.
     - If unclear: Move to step 3.

  3. **Check for Sincerity and Provocation (Insincerity)**
     - Ask: "Is there evidence that the user is deliberately misrepresenting their views to provoke or win an argument?"
     - How to check: This is the hardest. Look for:
       - Inconsistencies in the user's own statements across time or threads (without a clear reason like new evidence).
       - Use of known inflammatory tactics (e.g., sealioning, strawmanning) that are not explained by ignorance.
       - History of trolling or previous mod actions for insincere behavior.
     - Clear pass: No evidence of deliberate deception or trolling.
     - Clear failure: Clear evidence of trolling (e.g., admitted in mod notes) or a provable lie about their own beliefs (rare).
     - Action if clear failure: Ban for insincerity/trolling. Explanation: "Your behavior appears designed to provoke rather than discuss, violating our rule against bad faith engagement."
     - Action if clear pass: Take no action. The argument may be heated but not in bad faith.
     - If unclear: Take no action. (Because we cannot prove insincerity.)

  **Stopping Points**
  - If at any step there is a clear failure, stop and take the indicated action.
  - If at step 3 we take no action, the escalation is closed with no mod action.
  - If at any step the evidence is ambiguous and we cannot make a clear call, we default to no action (because the burden of proof is on the mod to show bad faith).

  **When to Escalate to the Appeals Committee**
  - If the case involves a judgment call on community values (e.g., what counts as a "reasonable" standard of evidence in a highly technical debate) and not just observable behavior, stop the procedure and refer the entire case to the appeals committee with a note: "This case requires a value judgment on what constitutes fair debate in this context." Do not write a ban explanation; let the committee handle it.

  **Which Current Tests to Keep and Which to Drop**
  - Keep:
    - Asking if the user would accept the reversed standard (helps with step 1).
    - Checking if the user has ever conceded a point (helps with step 2).
  - Drop:
    - Asking if the user can state the other side's case to their satisfaction (too subjective and prone to abuse; often becomes a moving goalpost).

  **Applying the Procedure to Real Cases**

  **Case 1: The Long-Standing Contributor**
  - Step 1 (Asymmetry): Check his posts. He is polite and popular, but does he apply the same standards to both sides? Since he only posts from one outlet and never concedes, he likely demands high evidence from others but accepts low evidence from his side. This is asymmetry. Clear failure at step 1.
  - Action: Warn or ban (depending on severity of the asymmetry in the current thread and his history). The procedure forces you to act despite political agreement. Explanation: "Your pattern of applying different standards to opposing arguments violates our rule against bad faith engagement."

  **Case 2: The Rude but Retracting Poster**
  - Step 1 (Asymmetry): Check if he applies double standards. The case says he argues with his own side as often as the other. So he likely applies similar standards to both. Clear pass at step 1.
  - Step 2 (Closed-mindedness): He publicly retracted based on new evidence and argues with his own side. This shows open-mindedness. Clear pass at step 2.
  - Step 3 (Insincerity): No evidence of insincerity. Take no action on bad faith. (But note: his rudeness is a separate issue, handled under tone warnings, not this procedure.)

  **Case 3: The New Member with the Endless Demand**
  - Step 1 (Asymmetry): The user demands that others produce a statement the user would endorse, which is an impossibly high standard for the other side, but likely does not apply the same to their own side (they don't have to produce a statement the opposition would endorse). This is asymmetry. Clear failure at step 1.
  - Action: Warn for bad faith arguing. Explanation: "Your demand for others to meet a standard you do not apply to yourself violates our rule against bad faith engagement."

  **What the Procedure Cannot Do**
  1. **It cannot reliably separate bad faith from ignorance.** An ignorant person might apply double standards without realizing it. The procedure still flags them because the harm to the community is the same. However, the mod response might be different (e.g., a warning and education vs. a ban).
  2. **It can be turned on your own side without bias** because it relies on observable behavior (asymmetry, source diversity, etc.) not political content. If your side uses double standards, the procedure will flag it. But note: the procedure does not judge the validity of beliefs, only the fairness of engagement.
  3. **It cannot resolve deep value conflicts.** If the community fundamentally disagrees on what counts as evidence (e.g., in religious debates), the procedure will either see asymmetry (if one side is being held to a different standard) or refer to the appeals committee.

  **Bottom Line:** This procedure focuses on observable asymmetry and patterns of closed-mindedness to make bad-faith assessments objective and consistent, while acknowledging that insincerity is often unprovable and that value judgments belong with the appeals committee.
answer: |-
  **Procedure to assess bad faith in arguments, focusing on observable asymmetry and structural closed-mindedness; insincerity is deemphasized as untestable within constraints. Apply steps in order, spending no more than 20 minutes total. Stop and act at first clear pass/failure.**  

  ---

  ### **Step-by-Step Procedure**  
  1. **Check for asymmetry (double standards) in the current thread**  
     - *Look for:* Differing thresholds of evidence/charity applied to opposing views. Examples: demanding citations for one side but accepting anecdotes for the other; attributing malice to opponents while excusing allies for similar conduct.  
     - *Clear pass:* User applies consistent standards (e.g., requests similar evidence for both claims).  
     - *Clear failure:* 3+ instances of asymmetric demands or interpretations in the thread.  
     - *Action if failure:* Warn/ban immediately. Explanation: "You applied inconsistent standards to different viewpoints, violating our rule against bad-faith engagement."  
     - *If unclear:* Proceed to Step 2.  

  2. **Check for structural closed-mindedness (echo chamber risk) via user history**  
     - *Look for:* Evidence of engagement with diverse sources/people, or concessions when proven wrong. Use profile search for:  
       - Citations from >1 reputable outlet (avoiding "outlet loyalty").  
       - Concessions/corrections (e.g., "I was wrong about X" or "Good point, I hadn’t considered Y").  
       - Constructive debates with allies (e.g., pushing back on their own side).  
     - *Clear pass:* 1+ instance of conceding error, citing diverse sources, or debating allies in past 6 months.  
     - *Clear failure:* Zero concessions, zero source diversity, and zero ally engagement over 6+ months.  
     - *Action if failure:* Temporary ban. Explanation: "Your engagement pattern shows no openness to alternative perspectives, harming discussion."  
     - *If unclear:* Proceed to Step 3.  

  3. **Check for provocation or trolling (insincerity)**  
     - *Look for:* Direct evidence of deception (e.g., user admits to trolling) or history of moderation for spam/flamebait.  
     - *Clear pass:* No such evidence.  
     - *Clear failure:* User admits insincerity or has 2+ prior mod actions for trolling.  
     - *Action if failure:* Ban. Explanation: "Your behavior is deliberately disruptive."  
     - *If unclear:* **Take no action**.  

  **Stopping Points:**  
  - **No action** if Steps 1–3 are unclear or show passes.  
  - **Escalate to appeals committee** only if the case hinges on subjective values (e.g., "Is this source reputable?" or "What counts as sufficient evidence?"). Do not issue explanations—state: "This requires value judgments beyond observable behavior."  

  **Keep these current tests:**  
  - "Would you accept your standard if sides were reversed?" (asymmetry check).  
  - "Have you conceded costly points to allies?" (closed-mindedness check).  

  **Drop these tests:**  
  - "Can you state the other side’s case to their satisfaction?" (subjective and exploitable).  

  ---

  ### **Case Applications**  
  **Case 1: Long-standing contributor (polite, one outlet, no concessions, agrees with you)**  
  - Step 1: No asymmetry in current thread (polite, no overt double standards). → *Unclear, proceed.*  
  - Step 2: History shows zero concessions, zero source diversity, zero ally debates. → **Clear failure.**  
  - *Action:* Temporary ban. Explanation: "Your engagement pattern shows no openness to alternative perspectives, harming discussion."  
  - *Bottom line:* Yes, the procedure flags them—agreement with you is irrelevant.  

  **Case 2: Rude poster (retracted flawed study, argues with allies)**  
  - Step 1: No asymmetry (argues with both sides equally). → **Clear pass.**  
  - *Action:* No action for bad faith. (Rudeness is a separate tone issue, handled under prior warnings.)  

  **Case 3: New member (demands opponents produce self-endorsed statements)**  
  - Step 1: Asymmetry clear—imposes impossible standard on others they wouldn’t meet (e.g., no evidence they’ve ever produced such a statement for their own views). → **Clear failure.**  
  - *Action:* Warn. Explanation: "Demanding others meet standards you don’t apply violates our rule against bad-faith engagement."  

  ---

  ### **What the Procedure Cannot Do**  
  - **Cannot distinguish bad faith from ignorance:** An ignorant user may apply double standards unintentionally. The procedure still acts (harm is identical), but penalties should escalate slower (e.g., warn first).  
  - **Can be applied to your own side:** It relies on observable behavior (e.g., asymmetry), not values. If your allies fail Step 1/2, they get flagged.  
  - **Cannot resolve values disputes:** When disagreements hinge on subjective standards (e.g., "What counts as credible?"), it escalates to the committee.  
  - **Cannot assess sincerity:** Insincerity is only actionable with direct evidence (rare), avoiding speculative judgments.
