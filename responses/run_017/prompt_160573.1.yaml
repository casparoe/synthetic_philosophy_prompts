  Below is a decision tree designed for your interactive sidebar, based on the fixed scenario of a failed large-scale replication of a social psychology effect, with the original author citing unmeasured protocol features. The tree separates interpretations of what happened (false positive, context-dependent effect) from views on the primary fix (institutions/incentives, statistical tools, phenomena/measurement). It includes your stipulations: a hypothetical rerun in the original context (Node 1) and a funder's choice (Node 4B), and it maps to all eight required leaves without asking about methodological identity. The tree has **5 branch nodes** and **8 leaves**, fitting your constraints.

  ### Decision Tree Structure
  Each branch node is phrased as a claim that readers can answer based on the scenario, without knowing where it leads. The tree is built from logical combinations of answers, with leaves placed in the available space. Combinations not occupied are marked as incoherent/unexplored. Key features:
  - **Evidence gaps**: Node 1 (hypothetical rerun) and Node 4B (funder choice) involve stipulations not settled by the scenario's evidence; the tree flags these with "we don't know" instead of forcing a fork.
  - **Leaf separation**: All leaves are distinct. The tree cleanly separates what happened from the fix, avoiding common collapses (e.g., "incentives" vs. "self-correction" are split by Node 4).
  - **Key sorting node**: **Node 1** (hypothetical rerun) does the most work, splitting readers into two broad camps (context-dependent vs. false positive) that shape all downstream branches.
  - **Combination notes**: 
    - No coherent combination supports a "tiny effect" interpretation (see "Unoccupied Combinations" below).
    - "Ordinary self-correction" (Leaf 7) and "incentives" (Leaf 1) are separated by Node 4's funder choice.
    - "Constructs/measurement" (Leaf 5) and "fragile effects" (Leaf 6) are separated by Node 2.

  ---

  ### The Decision Tree
  **Start Here:**  
  A medium-sized effect has two dozen small published studies but fails in a large preregistered replication (estimate near zero, tight interval). The original author says replicators dropped two unmeasured protocol features.

  #### Node 1: Stipulation on Context  
  *Suppose you could rerun the original experiment in the original lab with the same team and subjects, and it replicates perfectly every time—but it has never replicated elsewhere. What would this convince you of?*  
  - **A: The effect is real but only in that specific context.** → Go to Node 2  
  - **B: The effect is not real; the original lab's results are due to fraud or error.** → Go to Node 3  
  - **Evidence status:** Unsettled. This is hypothetical; the scenario doesn't provide evidence for or against it.  

  #### Node 2: Cause of Context-Dependence  
  *Why does the effect only appear in the original context?*  
  - **A: The phenomenon is inherently fragile and sensitive to subtle factors (e.g., unmeasured features).** → **Leaf 6: Effects are fragile/context-bound; focus on theory/measurement, not replications.**  
  - **B: The measurement approach is flawed; it doesn't capture the construct consistently across contexts.** → **Leaf 5: Constructs/measurements are the real culprit; rebuild instruments.**  

  #### Node 3: Cause of Original Findings  
  *Why did the two dozen small studies find a medium-sized effect?*  
  - **A: Institutional incentives (e.g., publication bias, career pressures) amplified false results.** → Go to Node 4  
  - **B: Statistical methods (e.g., low power, p-hacking) produced a false signal.** → Go to Node 5  

  #### Node 4: Fix for Incentives-Driven Errors  
  *What should funders prioritize to fix this?*  
  - **A: 20 more big replications of famous effects to correct the literature.** → **Leaf 7: Ordinary scientific self-correction; crisis framing is overblown.**  
  - **B: 10 years of instrument-building for this construct to improve measurement.** → **Leaf 1: Incentives/publication filter are the problem, not math; reform institutions.**  
  - **C: Neither; shift funding to new areas entirely.** → **Leaf 8: These literatures can't be salvaged; move on.**  
  - **Evidence status for A/B:** Unsettled. The scenario doesn't show which strategy works better.  

  #### Node 5: Fix for Statistics-Driven Errors  
  *Which statistical change would prevent this most effectively?*  
  - **A: Use more severe tests (e.g., higher power, preregistration).** → **Leaf 2: Tests were never severe; redesign studies for rigor.**  
  - **B: Switch to Bayesian methods (priors/Bayes factors).** → **Leaf 3: Replace p-values with priors and Bayes factors.**  
  - **C: Abandon testing; report estimates with intervals.** → **Leaf 4: Stop testing; just report estimates/intervals.**  

  ---

  ### Leaves and Their Challenges
  Each leaf is defined by a combination of answers. The "hardest datum to account for" highlights a piece of evidence from the scenario that the position struggles to explain.  
  - **Leaf 1: Incentives/publication filter are the problem, not math.**  
    *Hardest datum:* The original author's detailed critique about unmeasured protocol features. This suggests a substantive methodological flaw, not just incentives.  
  - **Leaf 2: Tests were never severe in the first place.**  
    *Hardest datum:* The large replication had high power (big sample, tight interval), making severity less relevant as an explanation for its failure.  
  - **Leaf 3: Switch to priors and Bayes factors.**  
    *Hardest datum:* The replication's tight interval around zero. Bayes factors might change priors, but they don't resolve why the original studies agreed on a medium effect.  
  - **Leaf 4: Stop testing; just report estimates with intervals.**  
    *Hardest datum:* The two dozen small studies—if they reported intervals, they'd likely be wide, but publication bias could still exaggerate consensus.  
  - **Leaf 5: Constructs/measurements are the real culprit.**  
    *Hardest datum:* The original studies consistently found an effect. If measurement is flawed, why did it "work" repeatedly in small studies?  
  - **Leaf 6: Effects are fragile/context-bound; focus on theory/measurement, not replications.**  
