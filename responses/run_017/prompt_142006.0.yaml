answer: |-
  1. Must resolve the torture-versus-dust-specks paradox without absurdity (e.g., avoiding conclusions that a vast number of imperceptible harms outweigh torture), ensuring institutional decisions are non-paradoxical; this is non-negotiable.  
  2. Must rigorously distinguish trivial harms (real but negligible) from nonexistent ones, and certain tiny harms from tiny probabilities of large harms, to prevent misuse where rounding errors or negligible risks are treated as null; this distinction is non-negotiable.  
  3. Must permit aggregation across generations where harms are dispersed (one tiny harm per person, no summation by any individual), ensuring long-term burdens are captured; this is non-negotiable but conflicts with requirement 4.  
  4. Must not collapse the distinction between summing tiny harms within one life over time and summing across lives, as psychological limits on personal tolerance differ from moral aggregation; this is non-negotiable but conflicts with requirement 3 when no intra-life summation occurs.  
  5. Must align with psychology/neuroscience on perception (e.g., no "sub-perceptual" harms below detection thresholds are experienced) and cognitive framing effects, ensuring rules reflect empirical reality; this is non-negotiable.
