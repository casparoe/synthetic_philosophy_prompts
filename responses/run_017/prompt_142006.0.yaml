prompt: |-
  You are a moral philosopher who works on aggregation in population ethics and on the moral mathematics of very small harms. Think carefully before answering: first brainstorm a generous list of candidate requirements, then strike the ones that are only prejudices of one camp, then write the final list.

  I sit on a standards committee that writes de minimis rules: we have to say when an institution may impose a burden on millions of people that no affected individual can notice, such as a hundred-millisecond lag added to ten million users requests per day, a fee rounded up by a fraction of a cent, or a barely visible nudge in an interface. The torture-versus-dust-specks puzzle is our working problem in miniature, so I want the specification rather than a verdict on the puzzle.

  Write the desiderata that any adequate theory of the aggregation of tiny harms must meet for that purpose: the cases it must get right, including a variant that is not the standard one, where the tiny harms are spread across generations so that no single person ever receives two of them and no one is ever in a position to add them up; the distinctions it must not collapse, such as trivial versus nonexistent, imperceptible versus sub-perceptual, summing within one life over time versus summing across lives, and certain tiny harms versus tiny probabilities of large ones; and the findings from psychology and neuroscience it must not contradict. For each requirement give the case or consideration behind it in a clause, and say whether it is non-negotiable or a preference of one camp. If some pair of requirements on your list cannot be jointly satisfied, mark the conflict inside the relevant items rather than in a separate section, since that is the part I most want. Skip any scorecard of the existing theories.

  Give your answer as exactly five numbered items, each one or two sentences, with no introduction and no conclusion.
