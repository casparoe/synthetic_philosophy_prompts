  I see potential conflicts already. The requirement to aggregate imperceptible harms across generations (#3) might clash with the distinction that prevents collapsing intra-personal summation (#4), since if harms don't sum within a life, why should they across lives? Also, the empirical constraint from psychology (#5) could challenge whether any imperceptible harm exists at all, conflicting with the need to treat some tiny harms as real (#1).

