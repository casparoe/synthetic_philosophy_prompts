  Testing these against their practices: The desire view fails feature 1 (why override current desires?) but supports feature 2 (honoring current choices). The objectivist view justifies feature 1 (treating psychosis) but clashes with feature 2 (why respect irrational refusals?). Only the indirect view seems to explain all three: feature 1 honors past ideal deliberation, feature 2 respects current non-ideal but competent deliberation, and feature 3's limits arise because ideal deliberation requires contemporaneity for high-stakes decisions. 

  The amendment requiring patients to reconstruct past reasoning reveals something deeper: it presupposes that authority requires recognizability. Not just that the past self was idealized, but that the present self must see the reasoning as continuous with her own to be bound by it. This isn't just practical—it suggests reasons require subjective recognition, challenging pure indirect views. 

  If we abandoned indirect views entirely: A desire-based approach would force honoring psychotic refusals (undermining Ulysses contracts). An objectivist approach would risk overriding competent refusals (violating feature 2). The current practice's asymmetries only hold together under an indirect framework that values both procedural rationality and subjective recognition. The amendment wisely tightens that connection without sliding into substantive idealization—it still cares about the patient's own reasoning, not some external "good."
answer: |-
  Your inquiry cuts to the heart of how we conceptualize agency over time, and I appreciate the concrete ethical dilemma as a testing ground for theory. Let me reconstruct the philosophical landscape before addressing your practice and the proposed amendment.

  Three broad accounts contend here. First, a *desire-based* or *internal reasons* view: what you have reason to do depends solely on your actual, occurrent motivational states at the time of action. If you desire X at T, you have a reason to pursue X at T; if not, not. Second, an *objective good* or *external reasons* view: reasons stem from mind-independent facts about your well-being or value, irrespective of your desires; desires can be mistaken about reasons. Third, the *indirect* or *proceduralist* view your colleague favors: reasons depend on what you *would* desire or choose after procedurally ideal deliberation (full information, calm, coherence). This aims to capture normativity while respecting the agent's perspective.

  Testing these against your three features reveals tensions. The pure desire view struggles profoundly with Feature 1: why override the psychotic patient’s current refusal? Her strongest contemporaneous desire opposes treatment. It excels with Feature 2, respecting the Jehovah’s Witness’s refusal based on her actual (if mistaken) beliefs and desires. But it falters on Feature 3: if current desires bind, why can’t a calm earlier self bind a passionate later self in consumer contracts or assisted dying? Desire views typically reject such binding unless the later self still desires to be bound. The objective good view handles Feature 1 easily (treatment serves her true well-being), but stumbles badly on Feature 2: if her refusal rests on "plainly mistaken" beliefs, and well-being demands transfusion, why respect it? It might also overextend Feature 3, potentially justifying binding later selves whenever earlier choices align with objective good. Only the indirect view seems to unify the practices coherently: Feature 1 honors the earlier self’s *procedurally idealized* choice (calm, informed), overriding the later self’s *non-ideal* state (psychotic). Feature 2 respects the competent refusal because, though substantively mistaken, it stems from minimally *procedurally adequate* deliberation (coherent, not distorted by psychosis); we don’t police the *content* of values if the *process* is intact. Feature 3’s limits arise because procedurally ideal deliberation itself would often *not* endorse binding later selves in deeply personal, context-sensitive, or irreversible decisions without contemporaneous affirmation; ideal deliberation values autonomy over time but recognizes the epistemic and experiential limits of earlier selves regarding future states.

  The three features *are* mutually consistent under this proceduralist reading, forming a coherent whole centered on the *quality of the agent’s reasoning process at the time of the decision*, not just the outcome or the desire’s strength. The earlier self binds the later only when the earlier decision was made under superior deliberative conditions (calm, informed), the later protest arises from degraded conditions (psychosis), *and* the decision-type permits precommitment (unlike intensely personal services or irreversible death).

  Now, the amendment: requiring revocation during an episode to be honored only if the patient can reconstruct her earlier reasoning. This shifts the ground significantly. Current policy presupposes that the authority of the *earlier* (procedurally idealized) choice is paramount once triggered, overriding the later non-ideal self. The amendment presupposes that the *later* self retains a crucial veto power, contingent on demonstrating *procedural continuity* with her earlier self. It introduces a new criterion: the authority of the idealized past deliberator depends on the present (impaired) agent retaining sufficient cognitive access to *recognize that deliberator’s reasoning as her own*. This isn’t merely a practical safeguard against misidentification; it elevates *subjective recognition of continuity* to a necessary condition for the past self’s authority. It subtly blends the proceduralist view with a deeper concern for *narrative identity* or *diachronic self-recognition*. The agent must be able to see the past self’s reasons *as reasons she once had*, even if she now rejects them.

  This distinguishes it clearly from substantive idealization. The amendment focuses purely on *procedural* access to reasoning, not on whether the desires were substantively correct or whether she *endorses* the content now. It asks: can she recall and articulate the *structure* of her past reasoning? Not: does she agree with its conclusions? It thus remains within procedural bounds but adds a layer: idealized choices bind only if the agent, even impaired, retains the cognitive thread connecting her to the author of those choices.

  Abandoning the indirect view would force significant changes. Adopting a pure desire-based view would compel honoring the psychotic patient’s refusal in Feature 1 (undermining Ulysses contracts), respect Feature 2, but likely weaken or eliminate Feature 3’s limits (if a calm self desires to bind her future passionate self, why prevent it?). Adopting an objective good view would justify Feature 1 and potentially support Feature 3’s limits (if binding isn’t always good), but it would demand overriding the Jehovah’s Witness’s refusal in Feature 2 whenever it conflicts with objective well-being, a clear violation of current practice. Neither rival view preserves the delicate asymmetry you describe.

  The amendment, therefore, refines rather than rejects the indirect view. It accepts that reasons stem from procedurally idealized deliberation but insists that the later self must retain a minimal cognitive pathway back to that deliberation for its authority to hold. This guards against treating the past self as a detached "ideal observer" and roots authority in the agent’s enduring, recognizable rational identity. Whether this is philosophically essential to indirect views or a wise pragmatic addition is debatable, but it resonates with the intuition that reasons must be, in some meaningful sense, *ours* to move us. Your practice, and this thoughtful amendment, suggest that our reasons are not just what we *would* choose ideally, but what we can, however dimly, still *recognize* as the choices of the selves we were and strive to be. I believe this amendment strengthens the ethical coherence of your approach without abandoning its foundations.
