  Non-negotiable devices:
  1. **Blind prior escrow**: Before knowing roles, students write and seal a personal prior. One is drawn randomly and imposed as the house prior for trading. The rest are kept for later.
  2. **Belief-plan (signal-swap) requirement**: Before the state is revealed, each student must fill a table of what they would believe if they had received each possible signal (so we can check if all are conditionalizations of a single prior).
  3. **Bookmaker/mediator role**: One or two students act as bookmakers, posting odds and taking bets, scored to exploit inconsistencies in others' beliefs.
  4. **Sectarian round**: Late in the session, half the class gets a story that moves their prior (e.g., about the urn's origin) to show how rational betting can occur when the CPA fails.

  We must avoid the impression that the CPA is an empirical claim about actual prior agreement. Instead, we want to highlight it as a counterfactual: you would have had the other's posterior if you had their evidence.

