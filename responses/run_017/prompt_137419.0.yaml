  - With probability 0.5, they pay 1, with probability 0.5 they keep the 1. But wait, the true probability is 0.5? But the urn is fixed. The bookmaker's expectation is based on the prior, so they expect to break even. But if many bets are placed, they might lose if the urn is A? But it's not sure loss.

  So it's not arbitrage. It's just trading based on information.

  Given the time constraints, we focus on the sectarian round for showing that betting can be rational when CPA fails, and in the first round, we use the belief-plan to show that everyone is conditionalizing the same prior, and then in the debrief we discuss why they didn't bet (or did) and how the bookmaker avoided sure loss.

  **Debrief outline**:

  1. **Blind prior escrow**: Show the distribution of sealed priors. Emphasize that they started with different priors, but the game imposed one. This addresses the economist's objection: the common prior in the game is not the instructor's but a student's, and it's arbitrarily selected. The game then assumes that everyone uses this prior.

  2. **Belief-plan**: Project a few students' belief-plan tables. Show that they are all generated by conditionalizing the house prior. Ask: "If two students had swapped signals, would they have swapped posteriors?" (Yes, because the belief-plan tables are the same.) This is the counterfactual: you would have held the other's posterior if you had their evidence.

  3. **Round 1 trading**: Note that some bets might have happened, but they were due to differences in information, not in priors. The bookmaker broke even in expectation because the odds were set based on the common prior.

  4. **Sectarian round**: Reveal the two groups' priors. Show that both groups were rational. Bets occurred because of the different priors. This is like deep disagreement. Ask: "Is this more like a political disagreement or more like the first round?"

  5. **Common prior assumption**: 
     - CPA is the claim that any differences in belief are due to differences in information. 
     - In the first round, we had CPA (enforced by the house prior), so differences were due to signals. 
     - In the sectarian round, CPA failed because of different priors (about the factory), so betting became rational.
     - In real life, when we see persistent disagreement, we can ask: is it due to different information or different priors? And if it's different priors, then we need to ask where the priors come from (which might be from deeper information differences?).

  6. **What the activity cannot do**:
     - **Common knowledge**: We only did one round of betting. In reality, the agreement theorem requires iterated exchange of posteriors and common knowledge of posteriors. We cannot simulate that fully.
     - **Limit structure of agreement**: We didn't show that with common knowledge of posteriors and CPA, posteriors must be equal.
     - **Counterfactual nature of CPA**: The CPA is a claim about what you would have believed if you had the other's evidence. The belief-plan exercise makes this explicit, but it's a table, not an actual experience.

  **Predictable problems**:
  - Students might focus on the urn and not on the beliefs of others. The facilitator must emphasize that the game is about what they believe and what they think others believe.
  - Anchoring: A confident student might say their posterior out loud, and others might adjust. Prevent this by having private reporting.
  - Timid bookmaker: They might set odds with a high overround to avoid loss, which might discourage betting. Or they might set odds that are too conservative. The instructor can encourage them to be bold.
  - Veil-of-ignorance round (the blind prior escrow) might be compromised if students try to guess which prior will be chosen. But since it's random, it's not a big issue.
  - Confusion between common prior and common information: Some might think that because they all have the house prior, they all have the same information. But then they receive different signals.

  **Rules and materials summary**:

  - **Urn compositions**: Type A: 2 red, 1 blue; Type B: 1 red, 2 blue.
  - **House prior**: Drawn from a student's sealed prior.
  - **Signals**: Each student draws a ball (with replacement) and keeps the color private.
  - **Belief-plan**: Worksheet with table for what they would believe if they had drawn red or blue, using the house prior.
  - **Bookmakers**: Set decimal odds for Type A and Type B. For a bet of 1 point on A, if A wins, the bettor gets (1/odds_A) * 1? Let's use simple odds: if they set odds for A as 2.0, that means a bet of 1 point returns 2 points if A wins (including the stake). So the net profit is 1 point. The bookmaker must set two numbers: odds_A and odds_B.
  - **Traders**: Can bet up to 10 points on A or B with one bookmaker.
  - **Sectarian round**: 
    - Group 1: Prior for Type A = 0.8
    - Group 2: Prior for Type A = 0.2
    - New urn type is determined by a coin flip.
    - New signals are drawn.

  **Payoff scheme**:
  - **Traders**: Start with 100 points. They win or lose based on bets. In addition, we can give 10 points for correctly filling out the belief-plan (checked later) to incentivize effort.
  - **Bookmakers**: Start with 100 points. Their net profit/loss from bets is added/subtracted.

  **Final Timeline**:

  - 0-5: Blind prior escrow and house prior announcement.
  - 5-10: Flip coin for urn type, draw signals, students compute posterior and fill belief-plan (using house prior).
  - 10-15: Choose bookmakers. Bookmakers set odds (based on house prior only; they have no signals).
  - 15-25: Trading: traders bet with bookmakers.
  - 25-30: Reveal urn type, settle bets, and score.
  - 30-40: Sectarian round: assign groups, give new priors, new urn type flip, new signals, students compute new posterior and fill new belief-plan (using group prior).
  - 40-50: New bookmakers set odds. Trading.
  - 50-60: Reveal urn type, settle bets, then reveal group assignments.
  - 60-80: Debrief as above.

  This design meets the four devices and focuses on the CPA as a counterfactual. The economist's objection is addressed by the blind prior escrow. The activity cannot reproduce the full agreement theorem or the counterfactual experience, but the belief-plan substitutes for the latter.
answer: |-
  ### Classroom Game Design: "The Common Prior Gambit"

  **Chosen Skeleton**: A **bookmaking round** where students act as traders or bookmakers, followed by a **sectarian round** that intentionally violates the common prior assumption (CPA).  
  **Why Rejected Others**:  
  - *Trading round with private signals*: Focuses too much on individual belief updates, missing the arbitrage dynamic that highlights CPA’s role in preventing betting.  
  - *Iterated public announcement*: Requires common knowledge of posteriors (which I avoid until debrief) and risks abstract notation-heavy iterations.  
  - *Ex-ante veil of ignorance*: Lacks the "violation" of CPA needed to show why trading becomes rational; it emphasizes role assignment over belief divergence.  

  **Why Chosen**: The bookmaking round forces students to *confront the CPA as a counterfactual* (via belief-plan tables) and *experience arbitrage as a failure symptom*. The sectarian round then legitimizes rational disagreement, contrasting signal-based differences with prior-based "factory" differences.  

  ---

  ### Rules, Materials, and Payoff Scheme  
  **State of the World**:  
  - Two urns: **Urn A** (2 red balls, 1 blue), **Urn B** (1 red, 2 blue).  
  - Hidden state: One urn is chosen via coin flip (50% prior).  
  - **Signals**: Students draw one ball (with replacement) from the chosen urn.  

  **Roles**:  
  - **Traders** (14 students): Receive private signals, report posteriors, and bet.  
  - **Bookmakers** (2 students): Set odds, accept bets, and profit from inconsistent beliefs.  
  - **Facilitator** (Instructor): Manages timing, randomness, and scoring.  

  **Non-Negotiable Devices**:  
  1. **Blind Prior Escrow**:  
     - Each student writes & seals a prior (e.g., "P(Urn A) = 0.6") on an index card before roles/signals.  
     - One prior drawn randomly → becomes **house prior**; used for all Round 1 calculations.  
  2. **Belief-Plan Requirement**:  
     - After receiving signals, all students complete a table: "If I drew [Red/Blue], my posterior for Urn A would be: [ ]." Must use house prior.  
  3. **Bookmaker Role**:  
     - Bookmakers see all traders’ posteriors (but not signals) and set odds. Profit = total bets taken minus payouts.  
  4. **Sectarian Round**:  
     - Half class told: "Urn was from Factory X (80% Urn A, 20% Urn B)."  
     - Half told: "Urn was from Factory Y (20% Urn A, 80% Urn B)."  

  **Payoff Scheme (Points-Based)**:  
  - **Traders**: Start with 100 points.  
    - Gain/lose points from bets (max bet: 10 points).  
    - Bonus: 20 points if belief-plan matches house prior conditionalization (verified post-game).  
  - **Bookmakers**: Start with 100 points.  
    - Profit = (total points bet) - (payouts to winners).  
    - Loss if payouts > bets.  
  - **No stakes**: Top 3 on leaderboard win coffee vouchers.  

  **Scoring Mechanics**:  
  - **Decimal odds**: Bookmakers post odds (e.g., 1.5 for Urn A → bet 10 points wins 15 if correct).  
  - **Payouts**: If Urn A wins, bets on A receive `(bet × odds)`; losers lose bet.  
  - **Arbitrage pressure**: Bookmakers profit only if odds attract bets they can cover; traders bet only if odds beat their posterior.  

  ---

  ### Timeline (80 Minutes)  
  **Minute 0–10: Setup & Blind Prior Escrow**  
  - (0–5) Explain: "Urn A or B is chosen by coin flip. You’ll draw balls, bet on the urn, but first: write your prior for P(Urn A) and seal it."  
  - (5–10) Draw one prior → announce house prior. Emphasize: "Use this for all Round 1 beliefs."  

  **Minute 10–20: Signals & Belief-Plans**  
  - (10–12) Flip coin (hidden) to choose urn. Each student draws one ball (private signal).  
  - (12–20) Traders/bookmakers:  
    - Calculate posterior (e.g., if signal=red, P(Urn A | red) = [house prior × 2/3] / [house prior × 2/3 + (1-house prior) × 1/3]).  
    - Complete belief-plan table: "If I drew red: P(Urn A) = X. If blue: Y."  

  **Minute 20–35: Bookmaking Round**  
  - (20–22) Assign 2 bookmakers. They see all traders’ posteriors (projected anonymously: e.g., "Trader 1: P(Urn A) = 0.8").  
  - (22–27) Bookmakers set odds (e.g., "Urn A: 1.4, Urn B: 1.6") on whiteboard.  
  - (27–35) Traders bet (write bets on index cards: "Bet 5 on A at Bookmaker 1’s odds"). Bookmakers record bets.  

  **Minute 35–40: Settle Round 1**  
  - Reveal true urn. Settle bets → update leaderboard.  
  - **Key moment**: Ask traders: "If you bet against someone, what did you imply about their prior?"  

  **Minute 40–55: Sectarian Round**  
  - (40–45) Assign factory stories (Group X: 80% prior for A; Group Y: 20% prior). New coin flip for urn.  
  - (45–50) New signals drawn. Students update using factory prior (not house prior).  
  - (50–55) Repeat bookmaking/betting with new odds.  

  **Minute 55–60: Settle & Reveal**  
  - Reveal urn → settle bets. Then reveal factory groups.  
  - **Key moment**: "Group X and Y both saw bets as rational. Why?"  

  **Minute 60–80: Debrief**  
  - (60–65) **Blind prior escrow**: Unseal priors → show variation. "Did we all start with the same beliefs? No. But we used one house prior. Why?" → CPA is counterfactual: "You’d have their posterior with their signal."  
  - (65–70) **Belief-plan tables**: Project 2–3 tables. "See how all are generated from house prior? If CPA holds, belief differences are just signal differences."  
  - (70–72) **Bookmaker role**: "In Round 1, bookmakers avoided losses because CPA held (all conditionalized same prior). No arbitrage!"  
  - (72–75) **Sectarian round**: "Factory stories broke CPA. Betting wasn’t irrational—it reflected *genuine* prior differences. Is moral disagreement like signals (CPA holds) or factories (CPA fails)?"  
  - (75–80) **The Big Idea**:  
    - CPA isn’t "we agree at the start." It’s "if we swapped evidence, we’d agree *now*."  
    - When CPA holds: No betting (Aumann). When it fails: Betting is rational (deep disagreement).  
    - Address economist’s objection: "House prior was a random student’s—not my stipulation. CPA was enforced counterfactually via belief-plans, not assumed."  

  ---

  ### Predictable Problems & Mitigation  
  1. **Students focus on urn, not beliefs**:  
     - Mitigation: Start debrief with belief-plan tables. Ask: "What does Trader 2’s posterior tell you about their signal?"  

  2. **Anchoring by confident student**:  
     - Mitigation: Make posteriors anonymous (e.g., "Trader 4: 0.75") and discourage discussion.  

  3. **Timid bookmaker**:  
     - Mitigation: Nudge bookmakers: "Set odds to attract bets! Profit = bets - payouts."  

  4. **Veil-of-ignorance collapse**:  
     - Mitigation: Use opaque process (e.g., shuffle sealed priors behind screen).  

  5. **Confusion: "Same prior = same information"**:  
     - Mitigation: In debrief, contrast Round 1 (same prior, different signals) with sectarian round (different priors).  

  ---

  ### What the Game Cannot Replicate (Requires Lecture)  
  - **Iterated common knowledge**: "Real agreement theorems need infinite rounds of ‘I know you know I know...’ We only did one bookmaking round."  
  - **Limit structure**: "With common knowledge and CPA, posteriors *must* converge. We only saw no-betting in Round 1."  
  - **Counterfactual depth**: "No role-play can make you *experience* having someone else’s evidence. The belief-plan table is a proxy—it forces you to compute the counterfactual."  

  ---

  ### Why This Works  
  Students *feel* CPA’s role: In Round 1, CPA enforcement makes betting irrational (violators lose points). In the sectarian round, CPA failure makes betting rational. The belief-plan makes the counterfactual tangible, and the economist’s objection is neutralized by the blind escrow. They walk out understanding CPA as the glue holding rational disagreement together—and why it matters when it snaps.
