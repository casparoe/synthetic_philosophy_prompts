prompt: |-
  Last spring, in my high school's semester-long health elective, each of us was asked to fill out a blank living will form as an exercise. I wrote that if I ever reached a point where I could no longer follow an argument or work through a proof, I did not want life-sustaining treatment. I was sixteen, I had just finished a unit on medical ethics, and I meant it at the time. I have since realized that the interesting question is not about forms or signatures. It is about when, if ever, an earlier self gets to speak for a later one whose values have drifted, and I would rather have a specification than a verdict.

  Please write the desiderata that any adequate account of precedent autonomy has to satisfy: the cases it has to get right, the distinctions it cannot collapse, and the results from medicine or psychology it is not allowed to contradict, with the case or consideration behind each requirement. The account is meant to do two jobs, and you can hold it to both: telling a hospital ethics committee what to do at the bedside, and telling me whether I should tear up the form I filled out at sixteen.

  The cases I keep getting stuck on, which I would like your list to cover rather than ignore: the still-competent convert, who has full decision-making capacity but whose values have inverted since signing, and now demands the treatment she once refused; the contented patient with advanced dementia, who lacks capacity, who plainly enjoys music and walks and meals, and who no longer recognizes the project the directive existed to protect, so that the question is whose welfare counts at the moment of decision, the person in the bed or the person who signed; the predicted-drift case, where the earlier self anticipated and legislated against exactly the change that happened, which might strengthen her claim or might just show that she was bargaining against her own future; the minor-author case, which is mine, where the instructions were written by someone who could not yet vote or consent to much of anything; the stale document, untouched for forty years, where I want to know whether authority decays and whether a theory owes us a sunset rule; the vague document, where language like no heroics has to be cashed out into a decision about something as small as a two-week course of antibiotics; the interim self, the person who exists through the months or years of decline and who is neither the signer nor the end-state patient; the asymmetry with testation, since we let a dead hand control property for decades but balk at its controlling what happens to a living body, and I want to know whether a theory has to justify that line or dissolve it; and the evidence problem, since the actual decision often falls to a tired resident with twenty minutes, a one-page form, and no surrogate reachable, which makes me wonder whether administrability is a genuine desideratum or just an excuse for a crude theory.

  Along the way, please mark which requirements are non-negotiable and which are only the preferences of one camp, and tell me if any subset of them cannot be jointly satisfied, because if the list turns out to be internally inconsistent that is itself the result I most want. I have my own candidate requirement, and I would like it pressure-tested: call it the recognition condition, on which an earlier instruction binds only if the later self can still recognize the earlier value as a reason she could have acted on even though she no longer endorses it, the way you can still see that a move is strong in a game you no longer care about winning. Is that a real desideratum or a prejudice smuggled in by people who like narrative views of identity? Finally, say which single requirement does the most work in disqualifying candidates. A short paragraph each on the strict precedent-autonomy view, the current-welfare view, and the endorsement view is enough for scoring; please keep the weight on the criteria and their motivating cases rather than on the scorecard.
reasoning: |-
  Okay, the user has presented a deeply philosophical and personal dilemma about precedent autonomy in the context of living wills. They're clearly intellectually sophisticated—a high school student who's grappling with medical ethics at this level is impressive. Their core question revolves around when an earlier self should control decisions for a later self whose values have changed. 

  Hmm, they've listed nine specific edge cases they want addressed, from competent converts to stale documents. Each is a landmine for any theory of precedent autonomy. The minor-author case is particularly poignant since it's their own—a 16-year-old's directive about cognitive decline. I notice they're not just seeking answers but testing frameworks, even inviting me to expose contradictions in their own "recognition condition" idea. Smart.

  The emotional undertone is... detached but urgent? They mention having "meant it at sixteen" but now question the form's validity. There's tension between intellectual curiosity ("I would rather have a specification than a verdict") and personal stakes ("should I tear up the form?"). They might be wrestling with identity continuity—is their 16-year-old self still "them"?

  Professionally, this needs rigor. Their cases map to real bioethical debates: Dworkin's critical interests vs. Dresser's current-affairs view, Parfit's reductionism. The administrative constraint (tired residents) is brutally practical—theories must survive hospital corridors. Their recognition condition echoes Korsgaard on reasons-responsiveness, but I'll need to flag if it biases toward narrative identity. 

  Biggest landmine: their desiderata might be incompatible. E.g., respecting minor-author autonomy could clash with overriding stale directives. The welfare/autonomy trade-off in dementia cases is irreconcilable for purists. I'll structure requirements as negotiable vs. non-negotiable—competence-preserving overrides seem non-negotiable, while sunset rules are debatable. 

  Their recognition condition... let's pressure-test. What if later self *acknowledges* past reasons but finds them repugnant (ex: religious deconversion)? Is "could have acted on" too weak? And it might exclude dementia patients who can't recognize *any* reasons. Still, it elegantly handles their game analogy. 

  For scoring: strict autonomy fails the competent convert; current welfare fails predicted drift; endorsement fails minor-author cases. The evidence problem torpedoes all three—hence administrability as key desideratum. Might suggest procedural solutions (mandatory surrogates?) since no theory solves 3am crises alone. 

  Final note: They'd value knowing if their list is inconsistent. Spoiler—it is, gloriously. That tension *is* the answer.
answer: |-
  Here is a set of desiderata for any adequate account of precedent autonomy, grounded in your core question and the challenging cases you identified. Requirements marked **(N)** are widely regarded as non-negotiable in mainstream bioethics; others reflect significant tensions or competing values.

  ---

  ### **Core Desiderata & Motivating Cases**
  1.  **Respect for Current Capacity (N):**  
      *   **Requirement:** A competent current self *always* overrides prior instructions. The earlier self cannot irrevocably bind a future competent self.  
      *   **Case:** *The Still-Competent Convert.* A patient who now demands treatment she previously refused must have her current wishes honored, regardless of the directive.  
      *   **Basis:** Foundational principle of contemporary medical ethics: respect for autonomy requires deference to *current* decision-making capacity.

  2.  **Protection of Profoundly Incapacitated Interests (N):**  
      *   **Requirement:** The theory must provide clear guidance when the patient lacks *any* capacity for meaningful self-determination or communication *and* prior directives exist. It cannot abandon such patients.  
      *   **Case:** *The Advanced Dementia Patient.* The theory must address the conflict between the prior directive (e.g., "no life-sustaining treatment without reasoning capacity") and the current patient's apparent simple pleasures.  
      *   **Basis:** Fiduciary duty of caregivers and society to protect vulnerable individuals lacking capacity.

  3.  **Accommodation of Value Drift & Identity Change:**  
      *   **Requirement:** The theory must acknowledge that core values and even aspects of personal identity can change fundamentally over time, impacting the relevance of prior instructions.  
      *   **Cases:** *The Still-Competent Convert, The Contented Dementia Patient, The Predicted Drift.* The theory must explain why/how prior instructions apply (or don't) when the person *now* holds different values or lacks the cognitive basis for the prior values.  
      *   **Basis:** Empirical psychology on value change, philosophical work on personal identity (e.g., Parfit), and the lived experience of profound life changes.

  4.  **Recognition of Authorial Context & Maturity:**  
      *   **Requirement:** The weight given to an advance directive must be sensitive to the circumstances and maturity of the author at the time of writing.  
      *   **Case:** *The Minor-Author.* Instructions written by a 16-year-old, lacking full adult experience and legal standing for many decisions, cannot carry the same absolute weight as those of a mature adult fully experiencing the values in question.  
      *   **Basis:** Developmental psychology, legal concepts of minor capacity, and the experiential grounding of values.

  5.  **Addressing Temporal Decay & Staleness:**  
      *   **Requirement:** The theory must account for the passage of time and the potential for documents or intentions to become outdated or disconnected from the evolving self.  
      *   **Case:** *The Stale Document.* A directive untouched for 40 years, written in a different medical and personal context, cannot automatically retain full authority. The theory needs a principled approach to "staleness" (e.g., rebuttable presumption of decay, formal sunset clauses).  
      *   **Basis:** Practical reality of changing medical technology, life circumstances, and value evolution over decades.

  6.  **Guidance for Ambiguity & Interpretation (N):**  
      *   **Requirement:** The theory must provide a framework for interpreting vague or general language (e.g., "no heroics") in specific clinical contexts, balancing prior intent with current circumstances.  
      *   **Case:** *The Vague Document.* Translating "no heroics" into a decision about antibiotics for pneumonia requires interpretative principles grounded in the theory.  
      *   **Basis:** Necessity for real-world clinical decision-making. Vague directives are common and useless without interpretation.

  7.  **Acknowledging the Interim Self & Process of Decline:**  
      *   **Requirement:** The theory must consider the welfare and potential agency of the person *during* the process of decline, who may possess some, albeit diminished, capacity or values distinct from both the author and the end-state.  
      *   **Case:** *The Interim Self.* Decisions made *during* progressive decline (e.g., early dementia) impact a person who is not identical to the signer but may still possess significant interests and fragments of prior values.  
      *   **Basis:** Clinical reality of gradual decline; ethical duty to respect residual autonomy and minimize suffering throughout the process.

  8.  **Justifying the Asymmetry with Testamentary Disposition:**  
      *   **Requirement:** The theory must either justify why controlling property after death is treated differently from controlling medical treatment *before* death but *after* loss of capacity, or explain why the asymmetry is illusory or unjustified. It cannot simply ignore the comparison.  
      *   **Case:** *The Asymmetry.* Why is a "dead hand" controlling property for generations often accepted, while a directive controlling medical care for a living (but incapacitated) body is contested?  
      *   **Basis:** Philosophical consistency and challenging intuitive assumptions about control over bodies vs. estates.

  9.  **Practical Administrability (N):**  
      *   **Requirement:** The theory must generate guidance that is feasible for real-world clinical decision-makers (e.g., the tired resident) within realistic constraints of time, information, and resources. Overly complex or context-heavy theories fail this.  
      *   **Case:** *The Evidence Problem.* The theory must provide workable rules/defaults that can be applied with limited information and time.  
      *   **Basis:** Ethical obligation to have systems that function reliably in practice to avoid arbitrary or harmful decisions. Administrability is a genuine constraint, not just an excuse.

  10. **The Recognition Condition (Your Candidate):**  
      *   **Requirement (Proposed):** An earlier instruction binds only if the later self, *at the time of losing capacity or during sufficient reflection*, could still recognize the earlier value *as a reason* they could have acted upon, even if they no longer endorse it.  
      *   **Pressure Test:**  
          *   **Strengths:** Elegantly handles *Predicted Drift* (if the later self recognizes the past reason's force, despite rejecting it, the directive holds weight) and some *Minor-Author* cases (if the adult recognizes the adolescent's reason as valid-for-them-then, even if naive). Avoids binding based on utterly alien values.
          *   **Weaknesses:**  
              *   May collapse in *Advanced Dementia* (the patient likely cannot recognize *any* reasons coherently).  
              *   Could be too restrictive for *Strict Autonomy* advocates who believe prior wishes *should* bind even if unrecognizable later (e.g., a profound religious conversion rendering past secular reasons alien).  
              *   Risks smuggling in a "narrative identity" bias, potentially undervaluing radical transformation or the welfare of the purely experiential self.  
              *   **Verdict:** A *plausible desideratum* reflecting a moderate view of identity continuity, but likely contested by strict precedent autonomy and strong current welfare views. It's not a universally agreed "must-have," but a coherent and insightful candidate principle.

  ---

  ### **Key Tensions & Inconsistencies**
  *   **The Fundamental Conflict:** Desideratum 1 (Current Competence Overrides) and the core impulse of precedent autonomy (binding the future self) are inherently in tension. Any theory must prioritize Current Capacity when present.
  *   **Welfare vs. Autonomy in Incapacity:** Desiderata 2 (Protect Incapacitated) and 3 (Value Drift) clash profoundly in *Advanced Dementia*. Prioritizing the *prior* autonomous choice (to avoid life without reasoning) directly conflicts with prioritizing the *current* experiential welfare (enjoying ice cream). **No theory fully resolves this; it's the core dilemma.**
  *   **Minor-Author & Binding Force:** Desideratum 4 (Authorial Context) strongly suggests minors' directives carry less weight, potentially conflicting with the desire to respect any competent expression of values (even at 16) implied by precedent autonomy.
  *   **Administrability vs. Nuance:** Desideratum 9 (Administrability) often forces simplifications that conflict with the nuanced demands of Desiderata 3 (Value Drift), 5 (Staleness), and 7 (Interim Self). Complex theories struggle at 3 AM.

  ---

  ### **Scoring Candidate Views (Briefly)**
  *   **Strict Precedent Autonomy (e.g., Dworkin):** Prioritizes the "critical interests" of the past autonomous self.  
      *   **Fails:** Desideratum 1 (ignores competent convert), Desideratum 2 (can harm current welfare in dementia), Desideratum 9 (struggles with interpretation/staleness practically). Excels on Desideratum 8 (justifies asymmetry: bodies matter more *to the living person* than posthumous property).
  *   **Current Welfare/Experiential Interest View (e.g., Dresser):** Prioritizes the well-being of the current patient.  
      *   **Fails:** Desideratum 1 (if competent, welfare matters less than autonomy), Core motivation of precedent autonomy (ignores prior binding intent), Desideratum 8 (struggles to justify property asymmetry). Excels on Desiderata 2, 3, 7 (protects current/interim patient).
  *   **Endorsement View (e.g., modified autonomy):** Authority flows from the *anticipated endorsement* of the future self, or requires some continuity of values.  
      *   **Fails:** Desideratum 1 (less directly than Strict Autonomy), Desideratum 3 (if values drift completely, no endorsement possible), Desideratum 4 (minor's directive unlikely truly endorsed by future adult self?), Desideratum 5 (staleness undermines endorsement). Handles *Predicted Drift* well if endorsement was conditional on non-drift. Your Recognition Condition is a variant.

  ---

  ### **The Most Disqualifying Desideratum**
  **Desideratum 1: Respect for Current Capacity (N)** does the most work in disqualifying candidates. Any theory that does not allow a currently competent patient to revoke or override their prior advance directive is fundamentally incompatible with the bedrock principle of informed consent and contemporary medical ethics. Strict Precedent Autonomy views that deny this override are non-starters in clinical practice and for your question about tearing up the form while competent.

  ---

  **Conclusion for You:** Your 16-year-old self's directive **does not bind** your competent current or future selves (Desideratum 1). You can revise or revoke it at any time while competent. The harder question is whether it should guide decisions *if* you lose capacity *and* your values haven't fundamentally drifted to repudiate its core premise (where your Recognition Condition becomes relevant). Given the gravity of the directive's consequence and your youthful authorship, a thoughtful discussion with loved ones about your *current* values and wishes, documented in a new directive reflecting your mature perspective, would be prudent. The form itself holds no power over you now; its true value was prompting this profound ethical inquiry.
