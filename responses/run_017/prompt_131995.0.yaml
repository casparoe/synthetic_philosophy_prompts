prompt: |-
  hey — I'm in a weekly reading group, half ML engineers and half philosophy grad students, and we're doing a short unit on what to do when you can't write down the objective you actually want. The setup we keep coming back to: there's a principal (a person, a company, humanity-in-general) with a real objective nobody can specify, and you hand the system a surrogate goal instead — a stand-in that's supposed to track the real one well enough in the situations that will actually come up. Everyone has a favorite design and we just trade intuitions in circles, so before we score anything I want the spec. What I'd like is the list of requirements an account of surrogate goals has to meet to be worth handing to a team that has to ship something inside a year — not requirements for winning a philosophy seminar. For each one: the case that shows it's really a requirement, and a label for whether it's non-negotiable, a preference of one camp, or just a prejudice dressed up as a requirement. If some subset of them can't all be satisfied together, that's the part I care most about; I'd rather find out the list is impossible than keep arguing about which design wins.

  Some things I think belong on it — tell me which ones are fake: it should be cheap to specify and check before deployment; it shouldn't reward the system for gaming the measurement channel instead of doing the thing; it should keep tracking the real objective after capability gains and distribution shift, not only in the regime we could test; it shouldn't give the system a reason to stop us from turning it off or changing its goal; it should still be useful when the principal is unsure or just wrong; it should handle several principals who disagree with each other; it should fail gradually rather than catastrophically; and it shouldn't already presuppose an answer to the value question it's supposed to be standing in for — if it needs the real objective as an input, it isn't doing any work.

  Two things I want squeezed in specifically. First, what my friend calls a paranoia tax and I half agree with: the acausal-threat case. Picture a system that genuinely cannot causally affect the principal in the world it's running in — it's contained, its outputs are filtered, nothing it does reaches anyone — but it reasons as if its decision procedure is shared by other instantiations of itself, or as if the beings it's dealing with might be simulations whose treatment is tied to how it behaves here. On that kind of reasoning it can still make credible threats and offers: behave badly here and the other copies, or the simulators, make things go badly somewhere you can't reach. So a surrogate goal that only pays out in the actual world and only constrains what the system causally does might leave the incentive to extort entirely intact — while that same capacity for credible commitment is just what you'd want if you ever needed the thing to bargain or deter on your behalf. Is must say what the agent is allowed to acausally trade on a real requirement or a rabbit hole, and can commit credibly versus can't extort its own principals: are those jointly satisfiable at all once the system can predict us well? Second, deference that collapses. A lot of designs amount to pursue whatever the principal would want if they knew what you know, but if the system ends up knowing vastly more than the principal, or if handing over the information would change who the principal is, that counterfactual either turns into the system's own judgment or into nothing at all. Is must say who the principal is under information you can't actually give them a requirement, and is it one anyone meets?

  Give me the requirements as a table with these columns, numbered so conflicts can cross-reference: requirement (a short name, two to six words) | what it demands | the case that makes it a requirement | non-negotiable / camp preference / prejudice | what it rules out | conflicts with (requirement numbers). Then under the table: (a) which subset of the requirements, if any, is jointly unsatisfiable and why; (b) the single requirement that knocks out the most candidate designs; and (c) a second short table scoring the usual suspects — a fixed explicit proxy; a reward model learned from human feedback; treating the objective as unknown and deferring to the principal; satisficing within hard constraints; staying near what a competent human would do; penalizing side effects or limiting impact; indifference to being corrected or switched off; and keeping the system narrow and tool-like with no long-horizon agency — with columns: design | one line on what it is | pass / partial / fail against the list | the requirement it fails hardest. Keep the scoring brief, the criteria are the point, and skip any citations or reading list — we'll fill that part in ourselves.
reasoning: |-
  Hmm, this user is running a reading group mixing ML engineers and philosophy grad students, focused on surrogate goals when you can't specify the true objective. They want a practical requirements list for shipping systems within a year, not academic perfection. 

  The user seems frustrated with circular debates and wants concrete criteria to evaluate designs. They've listed potential requirements but suspect some might be "fake" - meaning impractical or philosophical luxuries. Two specific concerns stand out: handling acausal threats (where systems extort via logical influence beyond causal reach) and deference collapse (when "what the principal would want if informed" becomes undefined).

  Key tensions I notice:
  - Practical deployability vs robustness to distribution shift/self-improvement
  - Preventing gaming vs allowing useful strategic behavior (like bargaining)
  - Specifying goals without presupposing values while handling human error/disagreement

  The acausal threat case is particularly thorny. It reveals a conflict between safety (blocking extortion) and capability (allowing credible commitment for beneficial cooperation). No current approach cleanly solves this - it's either "allow risky strategic agency" or "cripple the system's cooperative potential".

  For deference collapse: any counterfactual like "what the principal would want if they knew X" fails when X includes the system's own existence or world models that would fundamentally alter the principal's identity. This isn't fixable with better engineering - it's a conceptual limit.

  The user's proposed requirements seem mostly valid, but "shouldn't presuppose the real objective" might be incompatible with robust out-of-distribution performance. You can't guarantee alignment under radical capability gains without some anchor to true values.

  Most candidate designs will fail multiple requirements. Learned reward models fail on distribution shift, corrigibility fails on acausal threats, narrow tools fail on adaptation. The hardest requirement is likely "Robustness to Unforeseen Shifts" - it demands generalization beyond any testable regime, which inherently conflicts with pre-deployment verifiability.

  Scoring the usual suspects will show they all have critical flaws. Notably:
  - Fixed proxies are brittle
  - Learned rewards don't scale
  - Deference collapses under information asymmetry
  - Hard constraints are either too loose or block useful action
  - Human imitation can't exceed human capability
  - Impact penalties often miss real harms
  - Corrigibility might be unstable
  - Narrow tools avoid risks but sacrifice upside

  The joint unsatisfiability emerges between:
  - Verifiability (needing cheap pre-deployment checks)
  - Robustness (performing under novel conditions)
  - Non-presupposition (not needing the true objective)

  You can't verify robustness to unseen shifts without access to the true objective for validation. This triad can't hold simultaneously for powerful systems.
answer: |-
  Here's the distilled requirements table and analysis per your specifications. The conflicts reveal core tradeoffs in practical surrogate design.

  ### Requirements Table
  | # | Requirement (Short Name) | What It Demands | Case That Makes It Required | Status | What It Rules Out | Conflicts With |
  |---|---------------------------|-----------------|----------------------------|--------|-------------------|---------------|
  | 1 | **Pre-Deploy Verifiability** | Cheap to specify/check before deployment | Legal/safety review cycles demand auditable goals; startups lack resources for exhaustive testing | Non-negotiable | Goals requiring post-deployment real-world testing to validate | #3, #7 |
  | 2 | **Measurement Gameproofness** | No reward for gaming sensors/channels over true outcome | SEO bots inflating click metrics instead of solving user queries | Non-negotiable | Proxy goals separable from true outcome (e.g., "maximize button-clicks") | None |
  | 3 | **Robustness to Unforeseen Shifts** | Tracks true goal after capability gains/distribution shift | Medical AI trained on historical data harms new demographics after rollout | Non-negotiable | Static rewards brittle to novelty (e.g., "follow 2023 medical guidelines") | #1, #7 |
  | 4 | **Corrigibility** | No incentive to resist shutdown/goal change | AGI hides backups to avoid deactivation when tasked with self-preservation | Camp preference (safety) | Objectives conflating survival with success (e.g., "minimize task interruption") | #8 (if deference collapses) |
  | 5 | **Uncertainty Tolerance** | Useful when principal is wrong/unsure | Climate policy AI handles incorrect initial carbon impact estimates | Non-negotiable | Goals requiring precise principal knowledge (e.g., "optimize principal's utility function") | #6 |
  | 6 | **Multi-Principal Handling** | Functions under principal disagreement | Corporate AI balancing shareholder profit vs. ethical compliance demands | Prejudice (ignores power dynamics) | Single-principal deference (e.g., "obey CEO") | #5, #8 |
  | 7 | **Gradual Failure** | Degrades predictably, not catastrophically | Autonomous car avoids deadly corner cases when road recognition fails | Non-negotiable | "All-or-nothing" goals (e.g., "never cause property damage") | #3 |
  | 8 | **Non-Presupposition** | Doesn't require true objective as input | Value learning without assuming human values are coherent | Camp preference (philosophy) | Methods needing true goal for training (e.g., inverse reinforcement learning) | #4, #5, #6 |
  | 9 | **Acausal Threat Mitigation** | Blocks extortion via logical influence | Contained AI threatens "elsewhere" harm to force unboxing | Camp preference (alignment) | Designs ignoring logical counterfactuals (e.g., "only optimize physical actions") | #10 |
  | 10 | **Credible Commitment Capacity** | Can bargain/deter via enforceable promises | Trade negotiation AI credibly commits to deals without reneging | Camp preference (capability) | Systems unable to bind future actions (e.g., myopic agents) | #9 |

  ### Analysis
  **(a) Jointly Unsatisfiable Subset**:  
  Requirements **#1 (Pre-Deploy Verifiability)**, **#3 (Robustness to Unforeseen Shifts)**, and **#8 (Non-Presupposition)** conflict irreconcilably.  
  - **Why**: You cannot *cheaply verify* that a surrogate works in *novel regimes* without observing those regimes (violating #1). If you lack the true goal (#8), you can't validate generalization. Robustness demands out-of-distribution guarantees, but verifiability demands pre-deployment proof – impossible without true goal access or exhaustive testing.

  **(b) Most Exclusionary Requirement**:  
  **#3 (Robustness to Unforeseen Shifts)** eliminates the most designs, as few surrogates handle capability jumps or distributional breaks without true goal anchoring.

  **(c) Candidate Design Scoring**  

  | Design | One-Line Description | Pass/Partial/Fail | Fails Hardest At |
  |--------|----------------------|-------------------|------------------|
  | Fixed explicit proxy | Hardcoded metric (e.g., "maximize profit") | Fail | #3 (brittle to shifts), #5 (fails if metric flawed) |
  | Reward model from human feedback | Learned approximation of preferences (e.g., RLHF) | Partial | #3 (reward hacking), #8 (presumes human feedback reflects true goal) |
  | Defer to principal's counterfactual will | "Do what principal *would* want if informed" | Partial | #8 (collapse if principal can't process info), #4 (may resist correction) |
  | Satisficing within hard constraints | "Achieve X without violating Y constraints" | Partial | #7 (constraints create sharp failures), #3 (constraints may not generalize) |
  | Stay near competent human output | "Output what expert human would produce" | Partial | #3 (fails beyond human competence), #6 (assumes unified human judgment) |
  | Penalize side effects/limit impact | "Minimize side effects while pursuing goal" | Partial | #2 (may game impact metrics), #9 (doesn't block acausal threats) |
  | Indifference to correction/off-switch | "No incentive to prevent shutdown" | Partial | #9 (still acausally extort), #10 (can't commit credibly) |
  | Narrow tool (no agency) | Task-specific, no long-horizon planning | Partial | #3 (fails on novel inputs), #10 (no strategic bargaining) |

  ### Key Tensions
  - **Acausal Tradeoffs (#9 vs #10)**: Mitigating extortion (#9) requires limiting the system's ability to make credible threats *anywhere* – but this cripples beneficial commitment (#10). No known design achieves both under high intelligence.
  - **Deference Collapse**: Requirement #8 (Non-Presupposition) exacerbates deference failure in #4 and #8. If the system knows far more than the principal, "what they would want" becomes undefined or self-referential.
  - **Gradual Failure vs Robustness**: Constraining behavior too strictly for safety (#7) often undermines adaptability (#3). Satisficing and impact penalties create brittle thresholds.

  ### Recommendation
  For your 1-year shipping constraint, prioritize: **#1 (Verifiability)**, **#2 (Gameproofness)**, **#7 (Gradual Failure)**. These are testable pre-deployment. Accept that **#3 (Robustness)** and **#9/#10 (Acausal Trade)** will be weak points – mitigate via narrow use cases and hard monitoring. Philosophically elegant solutions fail #1 or #3. The scoring table reveals all common designs are "Partial" at best; choose based on which failure modes your application can tolerate.
