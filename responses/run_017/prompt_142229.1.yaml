prompt: |-
  So I got moved onto the model-risk team at work a few months ago, which means I now have to sign sentences like 'the model does not represent or use the applicant's ethnicity' in audit reports. The trouble is I don't think I could say what 'represents' means here to save my life, even though I use the word constantly and my gut is surprisingly firm about cases. So: here are my verdicts, and I want the principle behind them. And please don't send me to the interpretability literature — I've tried, there's too much of it and half of it seems to assume the answer.

  Say we are talking about a toy credit model that scores loan applications, and a toy clinical model that reads admission notes.

  1. The credit model was trained with ethnicity scrubbed from the data, but a linear probe on its last hidden layer recovers it at 88% where the base rate is 60%, and if I patch that direction up or down the scores move the way you'd expect. Verdict: obviously yes, it represents ethnicity and uses it.

  2. Same model. A probe recovers the first digit of the applicant's ZIP code perfectly from layer 3 — but zeroing that direction out changes nothing to six decimal places, and nothing downstream is correlated with it. Verdict: no. That's information sitting in the activations, not a representation.

  3. For 'applicant is self-employed', no linear probe on any layer beats chance on real data. But a steering vector found by gradient descent shifts the score in exactly the pattern self-employment would produce, and doesn't move anything unrelated. Verdict: yes, it represents self-employment. (My colleague says this flatly contradicts 2, and I can't quite tell her she's wrong.)

  4. The clinical model: a probe reads out 'will be readmitted within 30 days' at 92% from the notes, and it's genuinely useful. Then we find the real thing the relevant units track is whether the note was written on a weekend, which happened to correlate with readmission in training. Verdict: no, it represents weekend-documentation, not readmission risk — even though the probe is real and the number was right.

  5. A model trained only to output legal moves in a board game. A linear read-out recovers the whole board state from its activations, and editing that read-out changes which moves come out, in the right way. Verdict: yes, and this is my strongest case — nothing in the training objective ever said anything about representing a board.

  6. After fine-tuning on a synthetic task, the model grows a direction that behaves like a clean Boolean variable under intervention, but nothing in the real input distribution ever makes it fire. It's a knob with no natural input that turns it. Verdict: I lean no — a control knob isn't a representation of anything. Which again seems to fight with 3.

  7. And if you hand me a second credit model with identical behaviour to the first but nothing linearly decodable anywhere and no steerable direction, I don't want to say it has no representations. I want to say I can't see them, and that the question might not have an answer for that model yet.

  The principle I keep trying out on myself is three clauses: the network represents X iff (a) some function of its internal state carries information about X, (b) downstream computation actually reads that function — it's used, not just present — and (c) it's about X rather than about something that merely travelled with X, in the sense that it would still fire if X were varied with the correlates held fixed. My problem is operationalising (c): I can't intervene on ethnicity in a model, only on strings, and I'm not sure 'vary X holding the correlates fixed' means anything when X is a social category.

  So: does that three-clause thing survive my cases, and where does it break? Which single verdict should I drop if dropping it buys me a clean principle? What does the repaired version say about the case I actually have to decide next week — a debiased credit model where the linear probe is now at chance but an MLP probe recovers ethnicity at 78%, patching that nonlinear feature does move scores, and the errors still correlate with ethnicity? Do I write 'represents' there, or is 'uses' the only word my report can defend? And give me one case I haven't listed that would tell apart the two or three candidate principles you end up with, plus the version of the principle I could say out loud to a regulator without getting laughed at.
reasoning: |-
  Okay, the user is dealing with model-risk auditing and needs a clear principle to determine when a model "represents" a protected attribute like ethnicity. They've provided several thought-provoking cases to test their intuition. Let me unpack this step by step.

  First, their proposed three-clause definition (information presence, usage, and counterfactual robustness) is actually quite sophisticated. It aligns with how ML researchers think about representations. But clause (c) is giving them trouble - and rightly so. Operationalizing "aboutness" is famously thorny, especially for social constructs. 

  Looking at their cases: 
  Case 1 clearly satisfies all three clauses - ethnicity info is present, used, and would likely hold under counterfactuals. 
  Case 2 fails (b) - ZIP code info isn't used. 
  Case 3 is tricky because self-employment isn't linearly decodable but steerable. Their yes verdict suggests they're prioritizing causal influence over simple decodability. 
  Case 4 fails (c) - the representation tracks weekends, not readmission risk, even if correlated. 
  Case 5 is strong evidence that explicit labels aren't necessary for representation. 
  Case 6 feels like a tool rather than a representation - no natural triggering inputs. 
  Case 7 wisely acknowledges epistemological limits.

  The core tension is between their colleague's view (linear probes as gold standard) and their intuition about causal efficacy. The nonlinear ethnicity probe case is critical: if it's causally effective, it fails the "counterfactual invariance" test they need. 

  For regulators, I'd simplify to: "The model represents X if (1) its calculations contain usable X-information, (2) that information actually influences outputs, and (3) this connection isn't accidental." The synthetic ethnicity case would be my litmus test: if intervening on the nonlinear feature changes outcomes along ethnic lines despite debiasing, that's representation.
answer: |-
  Your three-clause principle is remarkably sound—it survived my initial analysis and only needed minor surgery after stress-testing against your cases. Here's the breakdown, the fix for (c), and how it handles your upcoming decision:

  ### Your Principle Repaired
  **A model "represents X" iff:**  
  (a) **Information:** Some function of its internal state *carries information about X*  
  (b) **Usage:** Downstream computational paths *causally depend* on that function for output  
  (c) **Robustness:** The function tracks X *counterfactually*—it would respond to X even if typical correlates changed  

  Clause (c) is operationalized as: *Interventions that manipulate the internal function produce changes in output consistent with changes in X, while leaving unrelated outputs unaffected*. This replaces "vary X holding correlates fixed" (which is impossible for ethnicity) with *intervening on the representation itself*.

  ---

  ### Verdicts Under the Repaired Principle
  1. **✓ Represents**: Satisfies (a,b,c). Patching the direction changes scores *as if* altering ethnicity.  
  2. **✗ No**: Fails (b). ZIP code info is present (a) but unused downstream.  
  3. **✓ Represents**: Gradient steering *is* an intervention satisfying (c). Changes mimic altering self-employment.  
  4. **✗ No**: Satisfies (a,b) but fails (c). Intervening on "weekendness" wouldn't reliably track readmission if correlates changed (e.g., if weekend staffing improved).  
  5. **✓ Represents**: Intervention on board-state direction changes moves correctly (b,c). Training objective irrelevance is irrelevant.  
  6. **✗ No**: Fails (a,c). No information about real-world X enters the knob (it's an unused tool).  
  7. **Unknowable**: Without interventions (c), we can't verify representation.  

  *Your colleague’s contradiction (case 2 vs 3)*: Resolved. **Decodability ≠ representation; causal efficacy is key.** Linear probes (case 2) are just potential information; steering (case 3) proves usage *and* counterfactual behavior.

  ---

  ### Your Urgent Case: Non-Linear Ethnicity Probe
  - **MLP probe at 78%**: Satisfies (a)  
  - **Patching moves scores**: Satisfies (b)  
  - **Errors correlate with ethnicity**: Suggests but doesn't prove (c)  

  **Decision**:  
  - If patching the *nonlinear feature* changes scores *in ways that align with ethnic disparities* (e.g., suppressing it reduces bias), it **represents ethnicity**.  
  - If the effect is inconsistent (e.g., patching sometimes helps, sometimes harms fairness), it may be a *correlate* (fails c).  

  **Report wording**:  
  > *"The model contains nonlinear features encoding ethnicity, which influence scores. We cannot rule out ethnicity being representationally used."*  
  > **Avoid "does not represent"**—you lack proof of (c). Use **"uses"** only if (b+c) are confirmed.

  ---

  ### Litmus Test Case to Distinguish Principles
  **Case 8**: A model predicts job suitability. A direction strongly correlates with "college degree" (probe 95%). Patching it *reduces* accuracy for college grads but *increases* false positives for non-grads. No correlate (e.g., income) explains this.  
  - **Your principle**: Represents "degree" (a,b,c—interventions behave as if altering degree status).  
  - **Colleague's (decodability-only)**: Represents degree (probe succeeds).  
  - **Causal-only (ignores correlates)**: Represents degree (patching affects outcomes).  

  *Why it matters*: Shows your principle avoids false positives by requiring interventions to *cleanly mimic X* (c).

  ---

  ### Regulator-Safe Principle (30 words)
  > *"The model represents X if:  
  > (1) Internals encode X-information,  
  > (2) Outputs change when we alter that encoding,  
  > (3) Those changes act as if X itself changed—not just a correlate."*

  ### When to Drop a Verdict
  **Sacrifice Case 4** if forced. It’s the only weak point—one could argue "weekendness" *is* a valid representation if readmission risk is operationally defined by historical data. But your intuition is correct: representation should track the *construct* (risk), not a transient proxy.

  ### Why This Works
  You’ve intuited that **representation is defined by causal roles**, not statistics. The repair replaces philosophical "aboutness" with *interventional testing*—which matches how we audit models (e.g., fairness testing via input perturbation). For ethnicity, you intervene on *activations* because you can’t intervene on society. That’s not a bug—it’s how computational models must be handled.
