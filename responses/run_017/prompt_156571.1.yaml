answer: |-
  ### Term Paper Proposal: Uncertain Conditionals and Noisy Evidence in the Judy Benjamin Problem  

  #### 1. **Research Question**  
  When an agent receives uncertain *conditional evidence* (e.g., "If in enemy territory, then headquarters") through a noisy channel, is there a uniquely rational Bayesian update rule? Crucially, does the answer depend on whether the noise originates in the *transmission channel* (e.g., garbled reception) or the *source's reliability* (e.g., untrustworthy sender)? This framing unifies two sub-questions:  
  - **(Q1)** Does noisy conditional evidence require a distinct update framework compared to flat propositions?  
  - **(Q2)** Does the locus of noise (channel vs. source) normatively constrain the choice of update rule?  

  The paper will defend a *negative* answer to Q1 (no privileged rule exists) and a *positive* answer to Q2 (noise locus matters), demonstrating that standard tools fail to resolve ambiguity in the overlap region.  

  ---

  #### 2. **Why Existing Frameworks Leave It Open**  
  Current approaches to the Judy Benjamin problem assume evidence is a *certain proposition* within the agent’s algebra:  
  - **Conditionalization** (e.g., updating on \(M1\)) presupposes the conditional is learned with certainty.  
  - **Distance-minimization** (e.g., Kullback-Leibler divergence) requires constraints over a partition, but \(M1\) and \(M2\) overlap in \(B\) and fail to partition the space.  
  - **Suppositional approaches** (e.g., Adams’ Thesis) treat the antecedent as hypothetical, but cannot model noisy *acquisition* of the conditional itself.  

  *Why this gap?* All rules assume evidence is propositional and certain. Normative justifications (e.g., diachronic Dutch books, scoring rules) inherit this assumption: they penalize incoherence *given* evidence, but do not address how evidence is *noisily received*. The seminar’s tools thus presuppose a solved transmission problem.  

  ---

  #### 3. **Methodology: Formal and Decision-Theoretic**  
  *Timeline (5 months, fortnightly supervision):*  
  - **Month 1:** Formalize the observation process in a joint probability space.  
    - Define variables: Location (\(L \in \{B \land H, B \land S, R \land H, R \land S\}\)), Message (\(M \in \{M1, M2\}\)), and Noise Source (channel distortion vs. sender fallibility).  
    - Key challenge: Model the overlap region (\(B\)) where *both* \(M1\) and \(M2\) are true, requiring auxiliary assumptions (e.g., what the sender *would* say in \(B\)).  
  - **Month 2:** Characterize pathological constraints.  
    - Prove that Jeffrey-style updates (imposing \(P^*(M1)=0.9\), \(P^*(M2)=0.1\)) force \(P^*(B)=0\) when \(M1\) and \(M2\) overlap. Generalize: this occurs iff the messages’ symmetric difference covers the space and their intersection is non-null.  
  - **Month 3:** Compare noise models and maximize divergence.  
    - *Model 1 (Channel Noise):* Judy hears \(M1\) or \(M2\) indistinctly. Update: \(P^*(A) = \sum_{i} P(A | M_i) \cdot P_{\text{noise}}(M_i)\).  
    - *Model 2 (Source Unreliability):* Message is \(M1\) with probability 0.9, but may be random noise. Update: Constrain \(P^*(M1) = 0.9\) and minimize divergence.  
    - Engineer priors where \(P^*(B)\) differs by >0.1 (e.g., amplify asymmetry in \(P(H|R)\) and \(P(H|B)\)).  
  - **Month 4:** Decision-theoretic implications.  
    - Suppose Judy must choose a direction (e.g., toward HQ). Compute expected utility (EU) for actions under rival updates.  
    - Identify parameters where EU differs by >20% (e.g., when friendly HQ offers high reward but enemy HQ is lethal).  
  - **Month 5:** Normative assessment of noise models.  
    - Test if either model uniquely avoids Dutch books or accuracy dominance in the joint space.  

  *Why not alternatives?*  
  - **Cataloging rules + intuitions** lacks normative force; the goal is to *prove* divergence or equivalence.  
  - **Empirical surveys** (what agents "would say") cannot resolve normative questions about Bayesian rationality.  

  ---

  #### 4. **Possible Conclusions and Adjudication**  
  - **The Dissolution Claim (Advisor’s View):** "Just model the channel and condition."  
    - *What shows this?* If both noise models reduce to conditioning in a unified joint space *and* agree on \(P^*(B)\).  
  - **The Normative Locus Claim:** Noise location (channel vs. source) dictates the update rule.  
    - *What shows this?* If Model 1 and Model 2 yield incompatible beliefs *and* both satisfy standard norms (coherence, accuracy).  
  - **The Underdetermination Claim:** No unique rule exists; choice depends on auxiliary assumptions about the overlap region.  
    - *What shows this?* If joint-space models require unmotivated priors over what the sender *would* say in \(B\).  

  *Decisive test:* If EU differences exceed 10% across models under plausible payoffs, dissolution fails. If EU gaps vanish only under artificial constraints, underdetermination holds.  

  ---

  #### 5. **Risks, Failure Conditions, and Scope Management**  
  **Failure modes:**  
  - **Technical:** The noise models never diverge significantly (e.g., \(|\Delta P^*(B)| < 0.01\) always).  
  - **Philosophical:** All joint-space models imply the same normative commitments (e.g., both obey accuracy dominance).  
  - **Taxonomic:** Only achievable outcome is a classification of update rules without a verdict.  

  **Scope reduction priorities (if behind schedule):**  
  1. **Cut:** Decision-theoretic analysis (Month 4). This is illustrative but not core to the formal puzzle.  
  2. **Simplify:** Limit divergence analysis (Month 3) to one family of priors (e.g., scale \(P(H|R)\) only).  
  3. **Defer:** Normative assessment (Month 5) to a "further work" section.  

  **Likely blow-up section:** Month 1 (joint space formalization). Defining observation models for the overlap region (\(B\)) risks intractable edge cases. Contingency: Start with a restricted model where \(M1\) and \(M2\) are exclusive in \(B\) (e.g., sender uses a deterministic protocol).  

  **Minimum publishable unit:** Prove that noisy conditionals *cannot* use Jeffrey updating (§3.2) and show *one* case where source/channel models diverge (§3.3). This alone challenges the "flat evidence" assumption in the literature.  

  ---  
  **Word count:** 998 words.  
  **Next steps:** I will draft a bibliography covering: (1) Van Fraassen’s original, (2) Jeffrey conditioning, (3) Bayesian networks for noisy channels, (4) decision-theoretic accuracy arguments.
