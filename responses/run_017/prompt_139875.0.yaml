prompt: |-
  I am teaching a seventy-five-minute session on informational cascades and rational herding to the second-year undergraduates in my Philosophy and Public Policy course: roughly forty of them, drawn from philosophy, economics and politics, who have had a term of probability — they can read a likelihood ratio and move between odds and probabilities without flinching — but no economics and nothing in social epistemology, and who will have been assigned nothing for this session. I do not need the explanation itself; I need a plan for delivering it.

  What I want the session to turn on is a claim I have become convinced of but have never managed to teach cleanly: that the engine of a cascade is not irrationality, deference or social pressure but the compression of a private signal into a publicly legible action, so that what is lost downstream is not anyone's reasoning but the evidential strength, and the remedy is therefore structural rather than exhortatory — aggregate likelihood ratios, not recommendations. I want that claim to be the spine of the session, not a moral I announce at the end.

  So, first: in what order must the pieces come, and what exactly depends on what? Must they have the notion of an independent private signal of fixed and moderate accuracy before they watch anyone move in sequence? Is it better to let a cascade form in front of them, and only then give them the vocabulary for what they have just seen, or does that guarantee they will describe it as copying? Where does the contrast between the simultaneous case, where many independent signals really do aggregate, and the sequential case, where observed actions are all anyone has, properly belong — before or after they have felt how compelling the simultaneous inference is?

  Second, the case that carries the session. I want one example that does the whole job, and I want to know what it must contain and what it must not. My instinct is that a binary decision under a genuinely common value, with anonymous agents rewarded only for accuracy, is essential, and that anything with reputational stakes, career incentives or a visibly corrupt majority has to be excluded from the carrying case — but I am not certain, and I want the reasoning. My usual candidate is a hiring committee that interviews in sequence and votes by show of hands; tell me whether to keep it and, if not, what replaces it. And tell me why I should or should not build the session around the examples my students will already half-know from elsewhere: restaurant queues, urns with red and blue balls, fashions and fads, review scores.

  Third, the misconceptions, and where in the sequence each should be headed off. I can predict several: that a cascade is simply conformity or peer pressure under a technical name (which is why I am unsure whether to introduce reputational herding first as a contrast or to withhold it until the pure informational case has landed); that if every agent updates correctly on everything she observes, the group's outcome must be rational, or must at least converge on the truth as numbers grow; that crowds are usually right, so a cascade is a marginal inefficiency rather than the foreclosure of all further evidence; that a cascade can always be broken by one well-informed dissenter, when the visible unanimity overstates the evidence and an agent who has simply arrived late cannot tell whether the three votes ahead of her were three independent signals or one signal followed by two acts of copying; and that the remedy is to tell people to think independently or to reward accuracy, neither of which touches the information structure. Which of these must be defused before the machinery is in place and which only after the students have felt their pull, and which others should I expect and have not listed?

  Finally: what should I openly decline to explain in seventy-five minutes, and say aloud that I am declining it — I am inclined to leave out the general question of whether more public information can make a group worse off, and everything that would require strategic complementarities — and what single question should I put to them at the end that would show me the compression point has landed, as opposed to the slogan that a cascade is when people copy each other?
reasoning: |-
  Okay, the user is teaching a session on informational cascades and rational herding to second-year undergrads. They want the session to emphasize that cascades are driven by the compression of private signals into public actions, leading to loss of evidential strength. The remedy is structural, not exhortatory. Let me break down their queries.

  First, the order of concepts. They need to establish private signals before showing sequential actions. Starting with simultaneous voting makes sense because it demonstrates how independent signals aggregate. Then, shifting to sequential actions highlights the difference. Using a live demo could make the cascade formation tangible. But I should caution against letting students describe it as copying too early. Introducing terms like "compression" and "evidential dilution" during the demo can frame it correctly.

  For the case study, a binary decision with common value is crucial. Hiring committee with sequential votes is good because it's relatable and excludes reputational factors. Restaurant queues or urns might be familiar but carry misconceptions. The hiring example keeps it clean. Need to stress anonymity and accuracy-only rewards to avoid confusion with social pressure.

  Misconceptions: The big one is conflating cascades with irrational conformity. Addressing this early by contrasting rational updating in sequential vs. simultaneous settings is key. The belief that groups converge to truth needs debunking with the cascade mechanism. Also, the idea that one dissenter can break it—showing that latecomers can't distinguish signals from copies. Remedies like encouraging independence don't work; structural solutions like secret voting or parallel processing are better.

  What to omit: Strategic complementarities and whether more public info worsens outcomes. These are complex and could derail the main point. Ending with a question about why breaking a cascade requires more than one dissenter tests their grasp of evidential loss.

  Also, the user's deeper need is to shift students from a behavioral explanation (irrational copying) to a structural one (information compression). Ensuring every part of the session reinforces this distinction is vital. Visual aids and live demos can make the abstract concrete. Highlighting the remedy's structural nature ties it all together.
answer: |-
  Here’s a battle-tested plan for your 75-minute session, designed to make the "compression of evidence" insight the spine while preempting key misconceptions. The sequence is critical to force the structural insight.

  **Core Structure & Sequence (45 mins):**  
  *(Order is non-negotiable for cognitive scaffolding)*

  1.  **Simultaneous Voting Demo (The Ideal) (15 mins):**
      *   **Do:** Start cold. Pose a binary choice (e.g., "Should we hire Candidate X? True ability: Good or Bad (50/50 prior)"). Tell students they *each* get a private signal (e.g., coin flip analog: P(signal=Good | ability=Good) = 2/3, P(signal=Bad | ability=Bad) = 2/3). Emphasize anonymity, common value (only care about true ability), reward for accuracy.
      *   **Activity:** Have all 40 vote *simultaneously* by show of hands (or clicker) for Hire/Don't Hire based *only* on their signal.
      *   **Reveal & Analyze:** Tally votes. Show how the majority vote is *highly likely* to be correct (use binomial calculator if needed, emphasize aggregation of independent signals -> strong likelihood ratio). **Key Q:** "Why was the group so likely to be right here? What did each person contribute?"

  2.  **Introduce Sequential Voting & Form a Cascade (The Reality) (20 mins):**
      *   **Setup:** Same scenario, *but now* agents (students) act in a fixed, known sequence. First agent votes publicly based *only* on their private signal. Second agent sees first vote *and* gets their own private signal, votes publicly, and so on. Reward still only for *personal* accuracy. Reiterate anonymity, no social pressure.
      *   **Activity:** Run a live cascade! Pick 5-7 volunteers (or use whole class in small groups). Start voting sequentially. *Crucially:* Pause after each vote. Ask the *next* voter: "What did you see? What was your signal? Why are you voting that way?" Record votes & (optional) signals privately.
      *   **Observe Cascade:** Let it run until a cascade likely forms (e.g., after 2 same votes, subsequent voters ignore contrary signals). Reveal any ignored signals later. **Key Q:** "Why did Agent 4 (who had a 'Bad' signal) vote 'Hire' after seeing two 'Hires'? Was she irrational? Deferring? Or... something else?" Guide them to see it's *rational* based *only* on the evidence *they* observed.

  3.  **Diagnose the Compression & Introduce Vocabulary (10 mins):**
      *   **Contrast:** Juxtapose the Simultaneous (many independent signals aggregated) vs. Sequential (actions observed).
      *   **The Core Insight:** "In the sequential case, Agent 3 doesn't see Agent 1 & 2's *signals*. They only see their *votes* (actions). The vote is compressed – it throws away the *strength* of the evidence (the likelihood ratio). Agent 1's vote might have been based on a strong 'Good' signal or a weak 'Bad' signal flipped by noise – Agent 3 can't tell! The vote is binary; the signal strength is lost. Subsequent agents see only the *outcome* of previous reasoning, not the *evidence* that fed it. The *evidential value* is diluted downstream."
      *   **Vocabulary:** Introduce "Informational Cascade", "Rational Herding", "Compression of Evidence", "Evidential Dilution". Explicitly state: "The engine is the transformation of nuanced private evidence (likelihood ratio) into a crude public action (vote: Hire/Don't Hire). What's lost isn't reasoning quality, it's information *granularity*."

  **The Carrying Case: Your Hiring Committee (Keep It!)**

  *   **Why it works:** Binary decision (Hire/No), common value (true candidate quality), anonymity (reduces reputational confound), rewards only for personal accuracy. It's realistic enough for P&P students, avoids distracting exoticism (urns). **Crucially:** It forces the focus onto the *information structure*.
  *   **Why NOT use queues/fads/reviews initially:**
      *   **Restaurant Queues:** Often involve payoff externalities (I care if *I* get a table) and network effects, muddying the pure informational story. Social experience is salient.
      *   **Urn Balls:** Abstract, can feel gamified, less engaging for P&P, harder to connect to real-world policy.
      *   **Fashions/Fads:** Inevitably involve expressive utility, social status, network effects – *not* pure common value + accuracy.
      *   **Reviews:** Complex (sequential *and* rating granularity), often involve strategic motives (early reviewers shaping later ones), reputation.
      *   *Save these for later discussion/as contrasts once the core is solid.*

  **Tackling Misconceptions (15 mins - Weave into above & dedicated time):**

  1.  **"It's just copying/irrational conformity/social pressure":**
      *   **When/How:** Head this off *during* the Sequential Activity (Step 2). When a student votes against their signal, ask: "Are you just copying? Or does it make rational sense *given what you've seen*?" Stress anonymity and accuracy reward. Explicitly contrast later: "Social pressure/reputational herding exists, but *this* cascade happens even without it!" (Mention reputational herding only *after* the informational core is secure, as a *different* phenomenon).
  2.  **"If everyone updates rationally, the group must be right/converge":**
      *   **When/How:** Highlight this *after* the cascade forms (Step 3). Point to the ignored signals revealed later. "Everyone updated perfectly rationally on the evidence *they observed*. But because the public evidence (votes) is compressed, the *group* locked onto the wrong answer early. More people don't necessarily help – they just pile on!"
  3.  **"Crowds are wise, cascades are minor glitches":**
      *   **When/How:** Use the Simultaneous vs. Sequential contrast (Step 3). "Simultaneous voting *is* the 'wisdom of crowds'. Sequential voting is *broken information aggregation* due to compression. Cascades can lock in error permanently, not just slow convergence."
  4.  **"One brave dissenter breaks the cascade":**
      *   **When/How:** *After* diagnosing compression. "Imagine you're late in line. You see 10 'Hire' votes. You get a strong 'Bad' signal. Should you vote 'Don't Hire'? Maybe! But *can you tell* if those 10 votes represent 10 strong signals? Or just 1 signal and 9 followers? Your single 'Bad' signal likely isn't strong enough to outweigh 10 votes *if* they were independent... but they probably weren't! The compression hides the weakness." Link to remedy.
  5.  **"Just tell people to think independently/reward accuracy":**
      *   **When/How:** When discussing remedies. "Rewarding accuracy was already built-in! Telling Agent 4 to 'think independently' ignores that she rationally *did* weigh her evidence against the compressed public information. The problem is structural: the *form* in which evidence is made public."

  **What to Openly Omit & The Diagnostic Question (5 mins):**

  *   **Omit & Declare:** "We're focusing purely on *informational* cascades driven by rational updating on compressed evidence. We're *not* covering reputational herding (fear of going against the group), strategic complementarities (where my payoff depends on others' choices), or the fascinating (but complex) question of whether more *public* information can sometimes make groups *worse* off overall. Those require different tools."
  *   **The Diagnostic Question (Put on screen/write down @ end):**  
      *"In a hiring cascade where 5 people have voted 'Hire' in sequence, a sixth committee member gets a strong private signal indicating 'Don't Hire'. Why might it be rationally optimal for them to still vote 'Hire', even though they suspect the cascade might be wrong? What specific structural feature makes their vote unreliable as evidence for the seventh member?"*
      *   **Why it works:** A correct answer will explicitly mention the **compression/aggregation of the likelihood ratio** into a binary vote, the **inability to distinguish independent signals from cascaded votes**, and the resulting **weak evidential value of their single contrary vote** against the weight of the (potentially weak) public history. It moves beyond "copying" to the information loss mechanism. Listen for keywords like "can't tell how strong the early signals were," "vote doesn't show the evidence," "my vote won't convey my strong signal properly."

  **Logistics & Tone:**

  *   **Pacing:** Strict timing is key. Demo phases need energy. Diagnosis phases need deliberate calm.
  *   **Visuals:** Simple slides: Setup rules, Vote tally (Simultaneous vs. Sequential columns), Key definitions ("Compression", "Evidential Dilution").
  *   **Language:** Banish "copy," "follow," "blindly." Use "update based on observed actions," "rational response to public information," "infer from predecessors' choices."
  *   **Stance:** Be slightly provocative: "This isn't about stupidity, it's about a broken information pipeline."

  This sequence forces the compression insight by making students *experience* the rationality of cascading in the demo, then *contrasting* it sharply with the simultaneous ideal, before finally giving them the precise vocabulary to describe the structural flaw they've just witnessed and participated in. The hiring case keeps it clean and policy-relevant. The diagnostic question probes for the core structural understanding, not the surface behavior. Good luck!
