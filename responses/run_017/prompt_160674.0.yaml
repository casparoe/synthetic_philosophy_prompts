  The rasp presents interesting complications: it's a colony-level trait in a soft-bodied species with no fossil record, serving multiple functions (buoyancy in juveniles, sound production in adults). The mineralized structure appears costly to produce. The user can decide its actual evolutionary history, which will determine whether the argument becomes a true stalemate.

  Key philosophical distinctions to cover:
  - Historical adaptation vs current utility
  - Exaptation vs adaptation
  - Colony-level vs morph-level selection
  - Architectural constraint vs selected function
  I should explain why each matters, using the rasp as concrete example.

  For evidentiary standards in field conditions:
  Since fossils/manipulation aren't possible, I'll focus on what inferences can be made from:
  - Comparative data (even if messy)
  - Cost-benefit analysis
  - Developmental pathways
  - Functional studies
  The user needs to know what constitutes sufficient evidence for a field biologist versus a journal publication.

  On the stalemate requirement:
