  2. **What the Procedure Cannot Settle**:
     - **Fluctuating Patient**: A patient whose capacity and wishes fluctuate day to day. The graded authenticity may change daily, leading to repeated assessments and escalations.
     - **Non-verbal Patient**: A patient who cannot speak but objects through behavior (e.g., pulling out tubes). We must interpret the behavior, which is not captured well in the current expression assessment.
     - **Proxy Conflict**: A proxy who is also the residuary beneficiary. The procedure does not address conflicts of interest in proxies. We assume the proxy is acting in good faith, but if not, that requires separate scrutiny.
     - **Ulysses Contracts**: When the earlier self pre-committed knowing she would later resist, and the resistance is evidence the mechanism is working. The procedure may override the document because of high current expression weight, but that might be against the patient's values. This requires values judgment and should be escalated.

  3. **Legal Exposure**: 
     - Overriding a directive for an incapacitated patient is legally risky. The procedure may recommend override in some cases, but we must involve legal and document thoroughly.

  ---

  **One-Page Version for 2 a.m. Hospitalist**

  **Decision Procedure for Directive vs. Current Expression Conflict**

  **Step 0: Capacity Check**
     - If patient has legal capacity: Override Directive (follow current wishes). Stop.
     - If lacks capacity: Proceed.

  **Step 1: Does the directive cover this exact situation?**
     - No: Escalate to ethics. Stop.
     - Yes: Proceed.

  **Step 2: Rate the directive's reliability:**
     - High: Handwritten, detailed, made during stability with doctor.
     - Medium: Standard form with some personalization.
     - Low: Form filled without context, during crisis, no discussion.

  **Step 3: Rate the current expression's weight:**
     - High: Consistent, responsive to changes, reasons match behavior.
     - Medium: Some inconsistency, moderately responsive.
     - Low: Inconsistent, fixed ideas, reasons don't match behavior.

  **Step 4: If the directive gives a reason, is that reason still true?**
     - If no reason, skip.
     - If reason false and directive doesn't say it stands without reason: Escalate. Stop.
     - Else: Proceed.

  **Step 5: Compare ratings:**
     - If directive High and current Low: Honor Directive.
     - If directive Low and current High: Override Directive.
     - Else (tie): Proceed.

  **Step 6: Reversibility:**
     - If honoring directive causes irreversible harm (e.g., death) and overriding is reversible (e.g., give treatment that can be stopped): Override Directive and escalate concurrently.
     - If overriding directive causes irreversible harm (e.g., force unwanted treatment) and honoring is reversible (e.g., withhold treatment that can be started later): Honor Directive and escalate concurrently.
     - Else: Escalate.

  **Documentation**: At every step, note your assessments and reasoning. If overriding directive for incapacitated patient, inform legal.

  **When in doubt, escalate.**
answer: |-
  Below is a decision procedure designed for your ethics consultation subcommittee, addressing conflicts between advance directives and current patient expressions. It incorporates your four distinctions (counterfactual unawareness, asymmetric scrutiny, graded authenticity, rationale falsification), structural constraints (reversibility, legal exposure), and outputs one of: **Honor Document**, **Override Document**, or **Escalate**. The procedure is action-oriented, with explicit termination points and handoffs for values judgments. A one-page version for bedside use follows the cases.

  ---

  ### **Decision Procedure**
  **Inputs**: Written directive + current clinical situation where directive and patient expression conflict.  
  **Output**: Honor Document, Override Document, or Escalate.  
  **Critical Notes**:  
  - **Legal constraint**: A directive is legally binding if the patient lacks capacity. Overriding requires documented justification and may trigger legal review.  
  - **Reversibility principle**: Prefer errors that can be undone (e.g., temporary treatment vs. irreversible withholding).  
  - **Handoff points**: Escalate when questions require values judgments (factual questions are resolvable; values questions require committee deliberation).  

  ---

  #### **Step 0: Preliminary Legal Capacity Check**  
  *Binary legal gatekeeper; resolves immediately if patient has capacity.*  
  - **Question**: Does the patient have **legal capacity** (per attending’s assessment) for this specific decision?  
    - **Threshold**: Legal standard (ability to understand, appreciate, reason, communicate).  
  - **Termination if YES**: ➔ **Override Document** (current expression governs by law). Document and stop.  
  - **If NO**: Proceed to Step 1.  

  #### **Step 1: Counterfactual Unawareness Check**  
  *Tests if the directive factually addresses the current situation.*  
  - **Question**: Does the directive **explicitly describe** the current clinical scenario (e.g., specific condition, treatment, or prognosis)?  
    - **Threshold**: Match must be literal or explicitly implied (e.g., “terminal cancer” ≠ reversible sepsis; “no feeding tubes in dementia” ≠ post-op ventilation).  
  - **Termination if NO**: ➔ **Escalate** (values judgment: whether the patient would have extended the directive).  
  - **If YES**: Proceed to Step 2.  

  #### **Step 2: Asymmetric Scrutiny Audit**  
  *Audits both directive and current expression for reliability using identical criteria.*  
  - **Question A (Directive)**: What is the **reliability score** (High/Medium/Low) of the directive?  
    - **Threshold**:  
      - **High**: Handwritten/customized + physician consultation + stability period (e.g., no recent trauma).  
      - **Medium**: Standard form + witnessed discussion + some personalization.  
      - **Low**: Form signed at admission/under duress + no evidence of comprehension.  
  - **Question B (Current Expression)**: What is the **reliability score** (High/Medium/Low) of the current expression?  
    - **Threshold**:  
      - **High**: Consistent across time/questioners + responsive to clinical changes.  
      - **Medium**: Minor inconsistencies + moderate responsiveness.  
      - **Low**: Inconsistent/fixed regardless of context + evidence of delirium/depression/undue influence.  
  - **No termination**: Proceed to Step 3.  

  #### **Step 3: Graded Authenticity Assessment**  
  *Weights current expression (not a capacity gate).*  
  - **Question**: What is the **authenticity weight** (High/Medium/Low) of the current expression?  
    - **Threshold**:  
      - **High**: Consistency + context-responsive + reasons match behavior (e.g., refusing due to pain when pain is observed).  
      - **Medium**: Partial consistency + some responsiveness + reasons partially align.  
      - **Low**: Inconsistent/context-blind + reasons contradict behavior (e.g., “I want to live” while refusing antibiotics for infection).  
  - **No termination**: Proceed to Step 4.  

  #### **Step 4: Rationale Falsification Check**  
  *Tests if a directive’s stated reason is false and whether it survives.*  
  - **Question A**: Does the directive **state a specific reason** (e.g., “to avoid burdening my daughter”)?  
    - **If NO**: Skip to Step 5.  
    - **If YES**: Is the reason **factually false** (e.g., burdened person dead, prognosis/treatment outdated)?  
      - **Threshold**: Objective evidence (e.g., death certificate, new medical guidelines).  
  - **Termination if YES (reason false)**: ➔ **Escalate** (values judgment: whether the directive is void without its reason).  
  - **If NO (reason valid) or reason not stated**: Proceed to Step 5.  

  #### **Step 5: Weight Assignment & Conflict Resolution**  
  *Compares reliability (Step 2) and authenticity (Step 3).*  
  - **Question**: Which has **higher weight**?  
    - **Threshold**:  
      - Directive High + Current Low ➔ **Honor Document**.  
      - Directive Low + Current High ➔ **Override Document**.  
      - Tie (e.g., both Medium, or High/High) ➔ Proceed to Step 6.  
  - **Termination if clear winner**: Output decision.  
  - **If tie**: Proceed to Step 6.  

  #### **Step 6: Reversibility & Error Preference**  
  *Breaks ties using reversibility.*  
  - **Question**: Which error is **irreversible**?  
    - **Threshold**:  
      - **Honor Document causes irreversible harm**: Withholding treatment that causes death/permanent harm (e.g., not treating sepsis).  
      - **Override Document causes irreversible harm**: Forcing treatment that violates core values (e.g., unwanted intubation against prior refusal).  
  - **Decision**:  
    - If **honoring is irreversible** and **overriding is reversible** (e.g., give antibiotics but can stop later) ➔ **Override Document and Escalate Concurrently** (act now, committee reviews).  
    - If **overriding is irreversible** and **honoring is reversible** (e.g., withhold dialysis but can start later) ➔ **Honor Document and Escalate Concurrently**.  
    - If **both irreversible** (e.g., surgery vs. death) or **both reversible** ➔ **Escalate**.  

  ---

  ### **Case Applications**
  #### **Case 1: 41F with Bipolar I, Refusing Lithium**  
  - **Step 0**: Manic but “lucid” – assume lacks capacity (bipolar episode) ➔ Proceed.  
  - **Step 1**: Directive explicitly addresses manic episode refusal ➔ Proceed.  
  - **Step 2**:  
    - **Directive**: High reliability (detailed, stability period).  
    - **Current**: High reliability (consistent, lucid per proxy, reason aligns with behavior).  
  - **Step 3**: Current authenticity High (reason: tremor affects livelihood).  
  - **Step 4**: No stated reason in directive ➔ Skip.  
  - **Step 5**: Tie (both High) ➔ Proceed.  
  - **Step 6**:  
    - Honoring (no lithium) reversible (can start later).  
    - Overriding (force lithium) irreversible (autonomy violation).  
    - ➔ **Honor Document and Escalate Concurrently**.  
  - **Why?** New reason doesn’t falsify directive, but reversibility favors honoring. Proxy agreement supports.  

  #### **Case 2: 74M with Dementia, Hip Fracture**  
  - **Step 0**: Lacks capacity ➔ Proceed.  
  - **Step 1**: Directive refuses “no reasonable hope” cases; current has high recovery hope ➔ **Escalate** (not factually addressed).  
  - **Why?** Values judgment needed: would patient extend refusal to reversible injury?  

  #### **Case 3: 68F with Alzheimer’s, Urosepsis**  
  - **Step 0**: Lacks capacity (moderate dementia) ➔ Proceed.  
  - **Step 1**: Directive explicitly refuses hospitalization for life-threatening illness ➔ Proceed.  
  - **Step 2**:  
    - **Directive**: High reliability (handwritten, physician consults).  
    - **Current**: High reliability (calm, consistent requests for treatment).  
  - **Step 3**: Current authenticity High (reasons match behavior).  
  - **Step 4**:  
    - Stated reason: “Avoid burdening daughter.”  
    - Reason false (daughter dead).  
    - Directive lacks “survival clause” ➔ **Escalate**.  
  - **Why?** Rationale falsified – committee must decide if refusal stands without reason. Your view (directive as conclusive) may not hold here.  

  ---

  ### **Failure Section: Limitations & Unresolvable Cases**  
  **Theater Steps (Documented but Rarely Decisive)**:  
  - **Step 2 (Scrutiny Audit)**: Often subjective; High/Low scores may reflect assessor bias.  
  - **Step 3 (Authenticity)**: Non-verbal patients (e.g., grimacing during feeding) rely on proxy interpretation, not objective measures.  

  **What the Procedure Cannot Settle**:  
  1. **Fluctuating Capacity/Wishes**: Patient with delirium whose expression changes hourly. Graded authenticity fails; requires daily re-evaluation and frequent escalation.  
  2. **Non-Verbal Objections**: Patient who pulls out tubes but cannot articulate reasons. Authenticity weight defaults to proxy interpretation.  
  3. **Proxy Conflict of Interest**: Proxy is residuary beneficiary. Procedure assumes good faith; requires separate conflict check.  
  4. **Ulysses Contracts**: Patient pre-committed *knowing* they would later resist (e.g., addiction treatment). Resistance is expected; procedure may override due to high current authenticity, defeating the intent. Values judgment required.  

  **Legal Exposure in Override**:  
  - Overriding a directive for an incapacitated patient risks liability. Always:  
    - Document justification (cite falsified rationale, low directive reliability, or reversibility).  
    - Notify legal department if override is chosen.  
    - Escalate concurrent with action to mitigate risk.  

  ---

  ### **One-Page Bedside Tool (for Hospitalist/Charge Nurse at 2 a.m.)**  
  **DECISION PROCEDURE: DIRECTIVE vs. CURRENT EXPRESSION**  

  **STEP 0: CAPACITY CHECK**  
  ✅ Patient has legal capacity? ➔ **OVERRIDE** (follow current wishes).  
  ❌ Lacks capacity? ➔ Proceed.  

  **STEP 1: DIRECTIVE MATCH?**  
  ❌ Current situation NOT described in directive? ➔ **ESCALATE**.  
  ✅ Matches? ➔ Proceed.  

  **STEP 2: AUDIT BOTH**  
  - **Directive Reliability**:  
    - High = Custom + doctor talk + stable when signed.  
    - Low = Form + no discussion + crisis when signed.  
  - **Current Reliability**:  
    - High = Consistent + clear reasons + no delirium.  
    - Low = Inconsistent + confused + influenced.  

  **STEP 3: CURRENT AUTHENTICITY**  
  - High = Reasons match situation + behavior.  
  - Low = Fixed ideas + reasons contradict.  

  **STEP 4: REASON STILL TRUE?**  
  - Directive has reason (e.g., “for my family”)?  
  - Reason false (e.g., family dead)?  
  - ➔ **ESCALATE** if false and directive doesn’t say it stands.  

  **STEP 5: WHO WINS?**  
  - Directive High + Current Low ➔ **HONOR DOCUMENT**.  
  - Directive Low + Current High ➔ **OVERRIDE DOCUMENT**.  
  - Tie? ➔ Proceed.  

  **STEP 6: REVERSIBILITY**  
  - Honor causes death/permanent harm? + Override can be undone? ➔ **OVERRIDE & ESCALATE NOW**.  
  - Override forces unwanted treatment? + Honor can be undone? ➔ **HONOR & ESCALATE NOW**.  
  - Both irreversible? ➔ **ESCALATE**.  

  **DOCUMENT EVERYWHERE. IF OVERRIDING DIRECTIVE WITHOUT CAPACITY: CALL LEGAL.**  
  **WHEN IN DOUBT, ESCALATE.**  

  ---  
  This procedure prioritizes clarity, minimizes values judgments at the bedside, and flags legal/irreversibility risks. It explicitly shows where ethics input is essential (escalation points). Customize thresholds (e.g., reliability scoring) via committee consensus.
