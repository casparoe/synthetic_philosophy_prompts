  2. **Asymmetric Scrutiny**: We must audit both the directive and the current expression for reliability.
  3. **Graded Authenticity**: Instead of a binary capacity determination, we assess the weight of the current expression on a continuum based on consistency, context, and reason-behavior alignment.
  4. **Rationale Falsification**: If a directive states a reason and that reason is now false, we must decide if the directive still stands without the reason.

  Structural constraints:
  - **Reversibility**: If one choice is reversible and the other is not, we prefer the reversible error (e.g., if withholding treatment is irreversible, we might err on the side of giving treatment until we are sure, and vice versa).
  - **Legal Constraint**: In the jurisdiction, the directive is presumptively binding for an incapacitated patient. Overriding requires clear justification and may involve legal exposure. We must note when to involve legal.

