answer: |-
  ### The Argument

  Heterophenomenology, as a method for the science of consciousness, instructs researchers to treat subjects' verbal reports—alongside behavioral and neural data—as a "text" to be interpreted neutrally. This neutrality means suspending judgment on whether reported experiences are accurate depictions of inner states, thereby avoiding both uncritical trust in introspection and outright dismissal of first-person accounts. The aim is objectivity: assembling a subject's "heterophenomenological world" from observable evidence alone. But this approach faces a problem when confronted with *shy phenomenal differences*—stable, measurable neural or functional contrasts that fail to manifest in reports, even under rigorous probing. Such differences satisfy three conditions: they are neurally detectable, reportably silent (appearing only as noise), and thus leave heterophenomenology unable to distinguish whether they involve genuine experiential changes or none at all. This is not a far-fetched scenario; it arises in real research on near-threshold perception or unattended stimuli, where reports are notoriously unstable. Heterophenomenology, committed to neutrality, seems forced into agnosticism: it cannot affirm or deny shy differences as phenomenal. But this agnosticism risks collapsing into *de facto* eliminativism—treating unreportable differences as nonexistent—or inviting metaphysical stalemates about what consciousness "really" is.

  The solution is to reconceive neutrality not as a metaphysical stance ("there is no fact of the matter beyond reports"), but as a *calibration norm* for a finite-resolution instrument: the human report channel. Just as a microscope’s output comes with a stated diffraction limit, heterophenomenology should publish its "map" of reportable differences with explicit error bars denoting the threshold of reportability. This recalibration does three crucial things. First, it reframes neutrality to avoid begging questions against realism about experience. The investigator isn’t denying that unreportable phenomenal states exist; they are declining to let an uncalibrated instrument bear evidential weight it cannot support. A physicist doesn’t assert the nonexistence of sub-atomic features when a microscope fails to resolve them; they note the instrument’s limits. Similarly, consciousness science can acknowledge that reports have resolution boundaries—shaped by attention, memory, or conceptual resources—without inferring that what lies beyond is illusory. This preserves realism’s plausibility: shy differences might be experiential but unreportable, much as a faint star might be real but invisible to a given telescope.

  Second, this view handles shyness without eliminativism. An instrument with finite resolution isn’t blind to *everything*; it is blind *below a threshold*. The proper response isn’t to declare the sub-threshold realm empty but to characterize the threshold itself—e.g., via experiments quantifying how task demands or training affect reportability—and then build complementary channels. For instance, if confidence ratings fail to capture a neural difference, researchers might develop indirect behavioral measures (like priming effects) or refine neural correlates to probe below the reportability threshold. This mirrors how astronomy combines telescopic data with radio-wave or gravitational-wave detection. Heterophenomenology, on this reading, becomes a scaffold for multi-method science: its "neutral" texts define the reportable landscape, flagging gaps where other tools must take over. This isn’t eliminativism; it’s operational humility.

  Third, it resolves the "experimenter’s own case" worry. Critics note that investigators inevitably use their introspective vocabulary to interpret subjects’ reports (e.g., labeling a wince as "pain"), while their *own* reports escape heterophenomenological scrutiny. If neutrality forbids trusting first-person access, this seems inconsistent. But under the calibration reading, the experimenter isn’t a privileged observer—they are part of the instrument. Their interpretive judgments are calibrated against other researchers via inter-rater reliability tests, just as a microscope is cross-checked against other devices. When a scientist describes a subject’s utterance as "describing brightness," she relies on a shared, trained capacity for report interpretation, honed through public standards (e.g., consensus on rating scales). Her introspection isn’t an infallible oracle; it’s a component in a calibrated system. This avoids an infinite regress: the chain of calibration terminates in communal practice, not private certainty.

  The strongest residual objection is this: if reports are an instrument, what calibrates *the calibration*? That is, how do we know our error bars—our thresholds of reportability—aren’t themselves distorted by the very limitations they seek to measure? For example, if a subject’s reportability threshold shifts with unnoticed cognitive fatigue, our mapping of that threshold might be incomplete. This objection highlights a deep circularity: all measures of reportability ultimately depend on reports (or their neural correlates), which are fallible. It isn’t fatal, however. All instrumentation science faces similar chains of calibration (e.g., atomic clocks reference other clocks). The solution is bootstrapping: using converging methods (neural, behavioral, computational) to triangulate thresholds, accepting provisional error estimates while seeking refinement. This doesn’t break the framework; it underscores that consciousness science, like physics, is perpetually self-correcting.

