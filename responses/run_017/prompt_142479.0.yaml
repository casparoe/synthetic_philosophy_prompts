answer: |-
  1.  The delayed-flash case perfectly maps: the audience's initial interpretation of the opening scene (first flash) is irrevocably altered by the ending (second flash), creating a retroactive sense that the opening *always meant* betrayal and self-deception, mirroring the color phi's illusory timing of the color change.
  2.  The film actively resists a simple Orwellian/Stalinesque choice for the *viewer's* experience: the Polaroids (fading memories) and Leonard's tattoos (Stalinesque "fixed facts") represent conflicting models within the narrative, but the viewer's own shifting interpretations across the film's timeline embody the multiple-drafts process itself.
  3.  The reversed colour sequences specifically enact the phi illusion temporally for the viewer: information presented later chronologically (but seen earlier) shapes the meaning of events presented earlier chronologically (but seen later), demonstrating how narrative order manipulates conscious "timing" of understanding.
  4.  Leonard's final decision to make Teddy "John G." is neither purely Orwellian (genuine belief later revised) nor Stalinesque (pre-determined setup): it's a *new draft* created *in the moment* using available evidence and narrative need, highlighting consciousness as an ongoing, constructive process without a single "finish line."
  5.  Memento adds crucial narrative duration and emotional investment to the phi debate: the extended time between "flashes" and the viewer's active, effortful piecing together of the story make the plasticity of meaning and the absence of a definitive "present moment" of conscious realization viscerally tangible in a way the instantaneous phi illusion cannot.
