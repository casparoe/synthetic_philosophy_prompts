  The term "uptake-driven force" comes to mind. Defining it: the speaker issues an utterance with ambiguous force, intending the hearer's interpretation to settle it. Examples: the boss's comment becomes a threat if the employee complies; otherwise, it's a remark. Counterexamples: clear directives or implicatures don't fit because their force or content is fixed. 

  I should check if existing terms fit. "Illocutionary indeterminacy" might be close, but it's not about delegation. The user wants a new term if nothing fits. So, coining "uptake-driven speech act" with a clear definition and boundaries. Make sure to include edge cases to clarify, like when the hearer resists, showing the negotiation aspect. 

  Also, address why "indirect speech act" isn't right—those rely on conventions, whereas here it's strategic ambiguity. The user emphasizes the deliberate handover of force determination. This needs to be highlighted. 

