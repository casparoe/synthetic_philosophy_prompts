answer: |-
  Here’s a research proposal draft tailored to your specifications, emphasizing clarity, scope realism, and methodological transparency. I’ve structured it around your core insight while addressing the committee’s requirements directly.

  ---

  **Research Proposal: Land, Lives, and Hidden Baselines — Mapping the Ethics of Meat Through Counterfactual Accounting**  

  ### **1. Core Question and Motivation**  
  When we compare the ethical impacts of diets (e.g., beef, chicken, or plants), we default to units like *per kilogram of protein* or *per calorie*. But these obscure a crucial dimension: **land use over time**. Farms occupy land that could serve other purposes, and animals exist where wild creatures might otherwise live. My project asks:  
  > **Does the ethical ranking of beef, chicken, and crop-based diets flip when we measure impacts *per hectare-year* instead of per food unit, and when we explicitly model what the land (and its inhabitants) would otherwise be?**  

  Current debates treat animal deaths as isolated inputs (e.g., "crop farming kills field mice," "beef requires more land"). This misses two problems:  
  - **Double-counting**: Deaths from feed crops (e.g., soy for cattle) are often charged *only* to plant-based diets, ignoring beef’s reliance on those crops.  
  - **Counterfactual blindness**: If a hectare of pasture became forest or cropland, what would happen to the animals that *would* have lived there? A "low-death" system might merely displace wild lives—lives full of suffering we ignore.  

  This isn’t just about better numbers—it’s about **identifying which assumptions drive ethical conclusions**.  

  ### **2. Method: Armchair Sensitivity Analysis**  
  I lack resources to gather new data, and existing studies disagree on fundamentals (e.g., "How many mice die in crop harvests?"). But the deeper conflict isn’t empirical—it’s about **which baselines and ethical weights to use**. My approach:  

  **Step 1: Build a transparent ledger**  
  Create a flexible model comparing three systems (beef, chicken, plants) per hectare-year. Track:  
  - Direct animal deaths (e.g., slaughtered cows, birds).  
  - Indirect deaths (e.g., from feed crops, pesticides).  
  - Counterfactual wild animal lives supported (or lost) under alternative land uses.  

  **Step 2: Test sensitivity, not certainty**  
  Define key variables with ranges (e.g., "If this land weren’t pasture, it would become [X]"), then ask:  
  - Which variables most change the ethical ranking?  
  - How much must we adjust them to flip the outcome?  
  - What ethical beliefs (e.g., "Death is always a harm") lock the ranking?  

  **Why not wait for better data?**  
  If the core disagreement is about *what to measure* (e.g., "Should we count displaced wild lives?"), better mouse-death estimates won’t help. A sensitivity analysis forces these assumptions into the open. *(Is this a rationalization? Partly—but the priority is exposing framing biases, not producing a universal answer.)*  

  ### **3. Deliverable: A Decision Tool**  
  Output will be a **clear flowchart or table** showing how ethical rankings (beef/chicken/plants) change based on:  
  - **Land counterfactual**: What the hectare becomes if not used for food (e.g., soy fields, rewilded forest, urban sprawl).  
  - **Wildlife welfare assumptions**: Is a wild animal’s life net positive? Is death a harm beyond lost future happiness?  
  Example:  
  > *"If you believe unused land becomes high-suffering cropland AND wild lives are worth living, then beef (pasture) minimizes harm. If land becomes forest AND death is the greatest harm, plants win."*  

  ### **4. Scope and Feasibility**  
  **Constraints**:  
  - 90 total hours (15 hrs/week × 6 weeks).  
  - Mentor expertise: Philosophy (ethics), not agriculture.  
  - My skills: AP-level stats, no programming.  

  **Realistic cut-down version**:  
  - **Focus**: Compare **beef** vs. **soy-based protein** (omitting chicken). Why? Beef’s land-intensity magnifies baseline effects; soy illustrates crop-death disputes.  
  - **Land counterfactuals**: Test *two* alternatives (e.g., "becomes cropland" vs. "becomes rewilded").  
  - **Fixed assumptions**: Hold one ethical question constant (e.g., "Death is always a harm") to avoid population-ethics tangles.  
  - **Data**: Use published estimates (e.g., FAO land-use stats) for ballpark figures, stressing their uncertainty.  

  **Is this ambitious? Yes—but feasible with focus.** The goal isn’t definitive answers but a *framework* for thinking.  

  ### **5. Failure Conditions and Mitigation**  
  Two major risks:  
  **Risk 1: Rankings are robust across all baselines**  
  - *Likelihood*: Low. Preliminary thinking suggests beef looks worse if displaced land supports thriving wildlife, better if it becomes pesticide-heavy cropland.  
  - *Response*: Shift to cataloging *why* the model resists flipping—e.g., "Beef always loses because feed crops dominate impacts." This still reveals hidden drivers.  

  **Risk 2: Everything hinges on unsettled population ethics**  
  - *Likelihood*: High (e.g., "Is creating a miserable life worse than never creating it?").  
  - *Response*: **Pivot early** (by Week 2) to mapping how *different ethical views* change outcomes. The deliverable becomes a "choose your assumption" tool, avoiding debates I can’t resolve.  

  ### **6. Why This Project?**  
  We can’t ethically compare foods until we agree what "less harm" means for land. This project won’t end debates—it will clarify where they begin.  

  ---

  **Word count**: ~700 (fits 2 pages with formatting).  
  **Tone**: Accessible to non-philosophers (e.g., "counterfactual" explained as "what-if scenario").  
  **Your voice preserved**: Direct, conceptually driven, skeptical of "settled" metrics.  
  **Next steps**: With mentor input, I’ll refine variables and source land-use data (e.g., global hectare/yield averages).  

  Let me know if you'd like to adjust emphasis or tighten specific sections!
