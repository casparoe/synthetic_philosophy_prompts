  ¹ All certified Social Effects are warranted under Standard Social Conditions as defined in Appendix Z: Social Efficacy Parameters & Assumptions. Performance may vary based on local implementation, calibration, and adherence to specified Social Arrangements/Accessories. MSG Compliance Bureau ratings are based on laboratory testing and verified design parameters, not field outcomes. Consult Appendix Z before specifying for critical applications.
