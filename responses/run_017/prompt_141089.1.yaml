  **Municipal Solutions Group | Catalogue M-7 Rev. 12 | Page 37**

  **Item:** **Transit Bench Armrest Set, Model TA-D3/N**
  **Application:** Provides ergonomic support for seated passengers during peak transit hours. The three-position, non-slip polymer armrest configuration discourages extended horizontal occupancy during designated night-service intervals (typically 22:00-06:00 local). Promotes designated usage patterns and optimizes platform throughput. Ideal for high-traffic stations and designated transit corridors. (See Appx. C, Sec. 8.4 for Occupancy Duration Thresholds).
  **Specifications:**
  *   **Material:** Glass-filled polyamide composite, UV-stabilized.
  *   **Finish:** Charcoal Grey (Std), Safety Yellow (Opt. TA-D3/N-YL).
  *   **Mounting:** Bolt-on, compatible with MSG Bench Series B-200, B-300.
  *   **Lead Time:** 4 weeks (Std), Expedited: 2 weeks (Surcharge Applies).
  *   **Social Effect:** Night-Use Deterrence, Measured Efficacy: >95% reduction in prone occupancy exceeding 30 mins during night intervals per MSG Efficacy Standard ES-205a.¹
  *   **Certification:** PASS (Exclusion Control - Class 2, MSG Compliance Bureau).

  **Item:** **Parkway Vehicular Overpass, Model OV-SG-4.8**
  **Application:** Facilitates uninterrupted cross-traffic flow over designated primary roadways. Standardized vertical clearance geometry ensures compatibility with authorized municipal and emergency service vehicles while maintaining efficient grade separation. Pre-engineered for rapid deployment on designated routes. Compliant with Jurisdictional Clearance Mandate JC-7B.
  **Specifications:**
  *   **Material:** Reinforced concrete deck, structural steel supports (Grade 50).
  *   **Finish:** Standard concrete sealant, optional anti-graffiti coating (Opt. OV-SG-4.8-AG).
  *   **Vertical Clearance:** 4.8 meters (15 ft 9 in) nominal, measured under structure.
  *   **Lead Time:** 18 months (Fabrication & Assembly), Site Prep Additional.
  *   **Social Effect:** Distributive Exclusion, Profile: >90% effective exclusion of vehicles exceeding 4.6m height; promotes designated routing patterns per Traffic Flow Model TF-22.¹
  *   **Certification:** PASS (Standard Geometry Compliance, MSG Compliance Bureau).

  **Item:** **Automated Access Gate, Model AG-TC15**
  **Application:** Regulates pedestrian ingress/egress for controlled access zones (e.g., public conveniences, fare-paid areas). Features a robust, vandal-resistant mechanism with a fixed-cycle timer. The precisely calibrated 15-second open duration standardizes throughput and eliminates discretionary interpretation by personnel, ensuring consistent application of access protocols. Reduces staffing requirements.
  **Specifications:**
  *   **Material:** Stainless steel housing (304), polycarbonate barriers.
  *   **Finish:** Brushed stainless (Std), Powder-coated options available.
  *   **Cycle Time:** 15 seconds open duration ±0.5s (non-adjustable).
  *   **Lead Time:** 8 weeks.
  *   **Social Effect:** Delegated Norm Enforcement, Effect: Standardizes dwell/transit time; resolves access ambiguity (Ref. Operational Directive OD-104).¹
  *   **Certification:** PASS (Deference to System Authority - Class A, MSG Compliance Bureau).

  **Item:** **Potable Water Supply System - Centralized Plant, Model WS-CP-10K**
  **Application:** High-volume water treatment and distribution for municipalities exceeding 10,000 population equivalents. Provides consistent water quality meeting JSW-101 standards. Requires connection to primary transmission mains.
  **Specifications:**
  *   **Capacity:** 10,000 m³/day.
  *   **Material:** Concrete basins, FRP filtration, SS316 piping.
  *   **Lead Time:** 24 months (Design/Build).
  *   **Required Social Arrangements (Accessories):** Continuous Custody (Security Level 4), Exclusion Zone (500m radius, monitored), Staffing: 24/7 operational crew (min. 5 certified), Ownership Model: Municipal or Regulated Monopoly.
  *   **Social Effect:** Centralized Resource Control, Profile: Reinforces hierarchical administrative oversight per Utility Governance Framework UGF-5.¹
  *   **Certification:** PASS (Infrastructural Control - Tier 3, MSG Compliance Bureau).

  **Item:** **Potable Water Supply System - Distributed Modular Units, Model WS-DM-500**
  **Application:** Localized potable water production for communities or districts up to 500 population equivalents. Scalable deployment. Ideal for remote settlements, rapid deployment scenarios, or decentralized network augmentation. Units operate independently or in micro-grids.
  **Specifications:**
  *   **Capacity:** 500 m³/day per unit.
  *   **Material:** Containerized FRP/Polyethylene units, SS316 components.
  *   **Lead Time:** 12 weeks (Per Unit).
  *   **Required Social Arrangements (Accessories):** Community Custody Model (Certification Required), Local Oversight Committee (Min. 3 members), Basic Security Perimeter (Fencing Std.), Ownership Model: Community Cooperative or Municipal Sub-unit.
  *   **Social Effect:** Facilitated Local Participation, Profile: Enables community-level resource management; requires defined participatory structure per Decentralization Protocol DP-7.¹
  *   **Certification:** PASS (Participation Enablement - Tier 2, MSG Compliance Bureau).

  **Item:** **Universal Access Turnstile, Model UA-TS-0**
  **Application:** Provides symbolic demarcation of transition points without restricting passage. Designed for locations requiring maximum accessibility and neutrality. Features no moving barriers, frictionless passage, and clear sightlines. Primarily serves as a spatial indicator.
  **Specifications:**
  *   **Material:** Polished aluminum frame, tempered glass infill panels.
  *   **Finish:** Clear anodized aluminum, clear glass.
  *   **Dimensions:** 1200mm W x 2200mm H x 800mm D.
  *   **Lead Time:** 6 weeks.
  *   **Social Effect:** Non-Exclusion, Verified Neutrality, Participation Acknowledged, Surveillance-Free. Certified per Full Spectrum Neutrality Standard FSN-100 (Platinum Rating).
  *   **Certification:** FSN-100 PLATINUM (Highest Rating, MSG Compliance Bureau). *Note: Functional throughput regulation is not a design parameter of this model.*

  **Item:** **Civic Input Signpost, Model CI-SP-1**
  **Application:** Designated location for the display of publicly ratified design preferences or community sentiment regarding municipal installations. Features a standardized mounting plate for referendum summaries or consultation outcome notices (Form CI-7B required). Serves as a permanent record of participatory input integrated into the built environment.
  **Specifications:**
