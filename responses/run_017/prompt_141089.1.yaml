  *   **Finish:** Dark Bronze (Std), Text Engraved.
  *   **Plate Size:** 600mm x 450mm.
  *   **Lead Time:** 3 weeks.
  *   **Social Effect:** Formalized Participation, Effect: Converts public vote/consultation into documented design constraint (Ref. Public Mandate Integration PMI-202).¹
  *   **Certification:** PASS (Participatory Process Compliance, MSG Compliance Bureau).

  **HOW TO ORDER:**
  Submit MSG Form PO-114 (Rev. 9) to Procurement Office, Sector 7-G. Include full model numbers, quantities, delivery addresses, and valid Municipal Account Code. Quotes available upon request (Form Q-22). Lead times commence upon receipt of fully executed purchase order and confirmation of compliance pre-authorization (Form CA-88). Standard Terms & Conditions apply (Ref. MSG T&C v12.3).

