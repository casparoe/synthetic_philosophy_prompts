answer: |-
  ## The Daylight Test: Why Nudge Legitimacy Hinges on Shared Risk

  For over a decade, behavioural science has quietly reshaped how governments operate. "Nudge units" proliferated, promising to steer citizens towards better choices – saving more, eating healthier, paying taxes on time – with minimal friction and maximum freedom. The initial fanfare has faded, replaced by a simmering, largely unspoken question: Is any of this actually legitimate? Does the state have the right, or the wisdom, to architect our choices, however gently?

  I’ve spent a year circling this question, interviewing practitioners and critics across multiple countries. One conversation, with a former nudge unit insider now deeply sceptical, crystallised the unease. She offered two unsettling observations. First, she argued, the field’s standard defence isn’t paternalistic (“we know best”) but inevitabilist: *Someone* has to set the default option, the form’s layout, the website’s flow. The choice isn’t between nudging or not, but between *who* designs the architecture of choice. Second, she noted, many nudges have a measurable half-life. Their effectiveness decays, sometimes rapidly, once the mechanics are exposed – reported in the media, discussed online. The magic fades in daylight.

  This shelf-life phenomenon struck a chord. It points beyond the usual battleground of *transparency* – whether a nudge survives public scrutiny. Transparency feels like a proxy. What truly matters, I suspect, is a deeper condition of **mutual exposure**. For a nudge to be legitimate, the relationship between the nudger and the nudged must embody a rough symmetry of risk and cost when things go wrong. The citizen must be able to easily detect, understand, and *escape* the nudge without undue burden – cheaply, repeatedly, without needing a PhD in behavioural science. Simultaneously, the institution deploying the nudge must bear a tangible, meaningful cost if the nudge proves detrimental to those it targets: plummeting enrolment rates, a surge in validated complaints, a public metric that visibly fails.

  An intervention that withers under publicity isn’t just fragile; it was likely parasitic on ignorance. Its power derived from people *not* seeing the strings. Conversely, a nudge that persists even when widely understood suggests its power comes from genuine convenience or alignment with underlying preferences – the citizen *can* reject it, but finds little reason to, precisely because the exit is easy and the default genuinely helpful. The publicity half-life isn't a bonus feature; it's a crude litmus test for mutual exposure.

  But let’s grapple with the first claim. My friend’s inevitabilist defence ("someone has to choose") feels potent but slippery. I initially countered with a distinction between "residual architecture" – the accidental landscape shaped by legacy systems, procurement quirks, and bureaucratic inertia – and "authored architecture" – choices deliberately engineered to shift behaviour. Surely, the argument only *really* justifies cleaning up confusing residual defaults, not actively designing new ones to "move the number"?

  On inspection, this distinction crumbles. Inaction *is* a choice. A clunky, confusing legacy form isn't neutral; it's a default authored by whoever *decided not to change it*. The procurement officer who selected an opaque interface, the IT manager who deferred an upgrade – they are de facto choice architects. There is no pristine, un-authored state of nature in government systems. Every interface, every form, every default setting, whether arrived at by accident or design, steers behaviour. My friend’s first claim *survives* this collapse, but its implications shift dramatically. If *all* choice architecture is authored (either actively or passively), then the inevitability argument doesn't magically legitimise *any* authored nudge. Instead, it forces the question: Given that *someone* is always designing, what principles should govern *how* they design? The inevitability of design demands justification for the *form* of that design, not a blank cheque. This is where mutual exposure steps in.

  Now, apply the mutual exposure lens to the canonical examples. **Automatic pension enrolment** fares well. Opting out is typically straightforward – a form, a phone call, a few clicks. The cost to the individual for escaping is low. Crucially, if the scheme is poorly designed or unattractive, the government (or employer) bears a cost: people vote with their feet (or mouse clicks), enrolment drops, political pressure mounts. The risk is shared. **Opt-out organ donation** is trickier. Opting out is often procedurally simple, but is the cost truly low? For some, the emotional or ethical cost of *actively* opting out (feeling like they are denying life-saving help) might be high, creating a subtle pressure. Does the government bear a meaningful cost if the system causes distress or violates deeply held beliefs? Arguably, not directly enough. Complaints might be diffuse, enrolment (or non-opt-out) rates remain high even if some are quietly uncomfortable. This suggests mutual exposure is only partially met, raising legitimate concerns about undue soft pressure.

  Now, consider a less-discussed case: a **government benefits or job-centre website**. Imagine the "Apply Now" button is prominently placed, while the "Check Your Entitlements" calculator is buried three clicks deep. This "nudge" aims to overcome inertia, getting help to those who freeze at complex forms. But it quietly harms those who, unaware of their full rights, apply for less than they qualify for. What’s the mutual exposure here?
  *   **Citizen Escape:** Can they easily find the entitlements calculator? If it’s deliberately obscured, the cost of discovery is high – requiring persistence, digital literacy, or luck. Escaping the "apply now" nudge isn't cheap or intuitive.
  *   **Institutional Cost:** Does the government suffer tangibly when people receive less than their due? Often, no. Budgets might even benefit in the short term. Complaints are unlikely – how can you complain about benefits you never knew you missed? The cost asymmetry is stark: the citizen risks significant, invisible loss; the institution risks little. This nudge fails the mutual exposure test spectacularly. It leverages asymmetry – exploiting lack of knowledge and high discovery costs – to achieve its goal.

  So, how does mutual exposure stack up against the alternatives?
  *   **The Transparency Test:** Simply knowing *how* you're being nudged (e.g., "This is the default option") doesn't guarantee you can *easily* act on that knowledge, nor that the nudger pays a price for being wrong. Transparency is necessary but insufficient for legitimacy. A transparent trap is still a trap.
  *   **The Welfare Test:** Does it make people better off by their *own* lights? This is crucial, but fiendishly difficult to measure objectively (whose lights? when?). Crucially, it ignores process. A welfare gain achieved through manipulative asymmetry might still be a violation of autonomy, breeding resentment even if the outcome is beneficial. Mutual exposure acts as a vital *procedural safeguard* for welfare, ensuring gains aren't built on hidden coercion.
  *   **The Autonomy Absolutist:** Any intentional steering is disrespectful. This view is admirably clear but ultimately impractical and ignores the inevitability of choice architecture we’ve established. The residual architecture isn't neutral; it’s just *badly* authored. Refusing to design better defaults is itself a choice with consequences. Mutual exposure offers a path to *respectful* steering within an unavoidably architected world.

  Mutual exposure isn't a silver bullet. Defining "cheaply," "repeatedly," and "real cost" requires judgment. Some beneficial nudges (like simplifying complex forms) might pass easily, while others with subtle costs might be harder to assess. But it shifts the focus to the *power dynamic* inherent in the nudge. It forces institutions to ask: Are we creating a fair game? Can the citizen push back without heroic effort, and will we *feel it* if we get this wrong?

  So, is it the right test? **Incomplete, but essential – needing costly exit.** Mutual exposure provides a powerful, necessary framework centred on accountability and citizen agency. It exposes the fatal flaw in nudges that work only in the shadows and validates those robust enough for daylight. Crucially, it demands that the citizen’s exit isn’t just theoretically possible, but genuinely *low-cost* – frictionless, intuitive, requiring minimal time or resources. The "costly" in "costly exit" is the vital addition: escape must be effortless. Without this, mutual exposure remains an aspiration.

  The legitimacy of behavioural government hinges not on noble intentions or clever mechanisms, but on building systems where the state’s power to steer is counterbalanced by the citizen’s power to resist without penalty, and where the state genuinely suffers when its steer leads people astray. Anything less is governing in the dark.

  \answer{incomplete-needs-costly-exit}
