prompt: |-
  Bit of a strange one, but I'll chance it. I'm retired — forty-odd years in chemical physics, mostly spectroscopy — and I've been going to a philosophy reading group down the library for about a year now, so I'm picking up arguments decades after everyone else had them. Lately we've been stuck on the probability problem in the many-worlds picture: if the wavefunction never collapses and every outcome happens somewhere, what on earth does it mean to say the 30% outcome is *unlikely*, and where does the squared-amplitude rule come from rather than just "count the branches and give them all the same weight".

  So: I want a number. Your credence that this actually works out — that the Born rule can be got out of an Everettian picture (branching, decoherence, no collapse) without quietly helping yourself to it somewhere along the way, so that the squared-amplitude measure is derived rather than assumed. And tell me what you'd count as that being settled either way, because I'm not sure I'd recognise a solution if I saw one.

  But the number alone is useless to me, so decompose it. Roughly, I want:

  - that the decision-theoretic route (get rational credence out of axioms about how a rational agent should choose when she knows she'll branch) avoids circularity rather than just re-describing the Born rule in the language of betting;
  - that there's a coherent notion of self-locating uncertainty to lean on — that "I don't yet know which branch I'm on" is a real kind of ignorance and not just a façon de parler;
  - whether my own pet thought does any work: as far as I can see decoherence never hands you a tidy *set* of branches you could count up, the number of branches is vague and depends on how finely you look, so the "why not weight them equally" complaint is attacking a picture nobody needs. Does that defuse anything, or does it just relocate the problem into where the weights come from?
  - whether the long-run-frequency style of argument is hopeless, given that you seem to need the Born rule already in order to say which branches are the typical ones;
  - how much of the whole disagreement is really just a fight about what "probability" means, i.e. verbal;
  - and my other hobby-horse, which I'm very fond of and slightly suspicious of: in statistical mechanics you also need a measure before you can say anything about typicality, and nobody thinks you get it by counting — the dynamics hands you phase-space volume. Is the Everettian's job just to find the analogue of that, and is amplitude-squared a candidate measure or the very thing in dispute?

  Give me a number and one line of justification for each, then how they combine, then which term you're least sure of and what would move it most. I'm at about 0.4; Alan in the group is at 0.85 and thinks I'm just being obtuse about the decision-theoretic stuff — tell me which of us is probably wrong and which sub-question the gap between us most likely lives in. And please don't point me at papers, I can't get hold of them and I'd rather have it argued out in plain terms. Oh, and I don't want "it depends what you mean by probability" as an answer — I know that much, I want to know how much depends on it.
