  Okay, the user is defending their thesis chapter in two weeks. Let me start by understanding their situation. They have a diverse committee: axiomatisers, an experimentalist, a structural econometrician, a senior theorist, and a philosopher of economics. Each has different concerns. The core of their thesis challenges the standard view that utility is just a representation of choice by arguing that presentation affects choices, and welfare should be based on what's consistent across presentations.

  First, I need to anticipate the top objections from each committee member. The user wants eight objections, phrased how each person would say them, with replies and weaknesses. Also, they need to know what to concede early, which reply is critical, and how to differentiate their work from existing literature without stepping on toes.

  Starting with the axiomatisers. They'll focus on formalism. Probably ask if this is just another rationalization. The reply should clarify that the core isn't an assumption but a revealed construct. The weakness is that the core might be empty, which they might see as a flaw. Need to frame that as a feature, not a bug.

  Next, the experimentalist. They care about practicality. How many presentations and subjects? The reply needs to admit it's context-dependent but suggest using variations like defaults or framings. Weakness: no hard numbers, which might frustrate them. Suggest pilot studies as a compromise.

  Structural econometrician will ask about identification. What variation identifies the core? Reply: cross-presentation choice patterns. Weakness: assumes same preferences across presentations, which is the thesis's premise. They might not buy that.

  Senior theorist might say this is settled by representation theorems. Need to argue that multiple rationalizations per presentation complicate things. Weakness: if they dismiss presentation effects as irrelevant, that's a problem.

  Philosopher will question why presentation-invariance equals welfare. Reply: it's the robust part of preference. Weakness: might not satisfy deeper welfare concepts. Concede that other factors matter but this is necessary.

  The "isn't this just..." question about existing literature. Need to differentiate without claiming novelty. Highlight the intersection across presentations vs. other models. Priority is key here.

  The dreaded questions: dependence on finite presentations and identifying the same alternative. For the first, concede it's a limitation, suggest statistical methods. For the second, admit it's a challenge but necessary. The flatmate's ML comment isn't helpful here.

  Concessions: admit that presentation sets are context-dependent and identification of alternatives isn't trivial. Critical reply: the one about core emptiness being a finding. If that doesn't land, the thesis might crumble.

  Order by damage: Econometrician's ID question is top because if identification fails, the whole model is questionable. Philosopher's welfare question is next, as it challenges the core premise. Then the "just literature" question, novelty is crucial. Senior theorist's dismissal could undermine foundations. Axiomatisers' lemma issue is fixable. Experimentalist's practicality is manageable. Dreaded questions are bad but can be mitigated with concessions.

  Need to ensure replies are concise, weaknesses acknowledged, and critical points emphasized. User's anxiety about dreaded questions means preparing solid, honest answers without overcomplicating. ML analogy might not resonate, so avoid that.
answer: |-
  Here’s your Q&A prep sheet, tailored to your committee’s profiles and ordered by potential damage (highest to lowest). I’ve included phrasing, 2-minute replies, weaknesses, strategic concessions, and the make-or-break reply.  

  ### **Top 8 Objections & Replies**  
  1. **Structural Econometrician**:  
     *Objection*: "You claim the core is ‘identified’, but what’s the *source of variation*? If presentations are just different labels for the same set, how do I separate core preferences from presentation noise in scanner data?"  
     *Reply*: "The variation comes from *cross-presentation choice inconsistencies*. For example, if an agent chooses *a* over *b* under ‘price per month’ but *b* over *a* under ‘price per year’, that variation *reveals* which preferences are presentation-dependent. The core is identified from the *agreement* in choices across these variations."  
     *Weakness*: Assumes presentations are exogenous and preferences are stable across them—your thesis’ core premise. If they reject this, the model fails.  

  2. **Philosopher of Economics**:  
     *Objection*: "Why privilege *presentation-invariance* for welfare? If my ‘core’ prefers cigarettes over kale, but only because I’m addicted, isn’t autonomy or long-term flourishing more relevant than frame-robustness?"  
     *Reply*: "Presentation-invariance isn’t sufficient for welfare—it’s *necessary*. If a preference reverses under a mere reframing (e.g., 90% lean vs. 10% fat), it can’t reflect stable welfare. The core filters out *arbitrary* influences, letting us debate substantive welfare (e.g., addiction) on clean data."  
     *Weakness*: Conflates *procedural* robustness with *substantive* welfare. You’ll need to concede this doesn’t solve paternalism debates.  

  3. **Senior Theorist**:  
     *Objection*: "This feels like reinventing the wheel. We *solved* this: utility is a representation of choice. If choices change with frames, that’s just multiple ‘choice functions’—why not represent each with its own utility?"  
     *Reply*: "Because welfare claims demand *uniqueness*. If each frame gets its own utility, what do we say when someone asks ‘What does the agent *truly* prefer?’ The core extracts the *common thread* across representations—the part robust to trivial changes."  
     *Weakness*: If they see framing effects as normatively irrelevant (just "different preferences"), your project collapses.  

  4. **"Isn’t this just..." Question (Behavioural Welfare Lit)**:  
     *Objection*: "Bernheim & Rangel’s welfare sets, or Salant & Rubinstein’s frame-dependent choices already cover this. How is your ‘core’ different from a refinement criterion?"  
     *Reply*: "Those impose *external* criteria (e.g., ‘cold state’ preferences). My core is *revealed*: it’s the maximal preference relation *internally consistent* with *all* presentations. It’s not a normative add-on—it’s what the data *intersect* to reveal."  
     *Weakness*: Risk of seeming incremental. *Stress*: "This builds on that work by showing when aggregation is *endogenously* possible."  

  5. **Axiomatiser 1**:  
     *Objection*: "Isn’t your ‘core’ just the revealed preference from the *union* of all choice observations? Why not start with a grand choice function over all presentations?"  
     *Reply*: "Because choices *depend* on presentation—treating them as one dataset violates the ‘same feasible set’ axiom. The core is the *intersection* of rationalizations, not the union of choices. Theorem 3.2 shows this avoids cycles precisely when WPC holds."  
     *Weakness*: They’ll push to axiomatize WPC itself as a primitive. Be ready to whiteboard a sketch.  

  6. **Experimentalist**:  
     *Objection*: "With *n*=400 on Prolific, how many presentations can I test? If I need 20 frames to get a non-empty core, this isn’t testable. What’s your smallest feasible design?"  
     *Reply*: "You don’t need all possible presentations—just enough to detect inconsistencies. Test 2–4 high-impact frames (e.g., defaults, attribute orders). If choices *agree* across those, the core is likely stable. If not, you’ve found presentation-sensitivity—which is valuable!"  
     *Weakness*: No hard *n*; depends on context. Offer to simulate power for their design post-defense.  

  7. **Axiomatiser 2**:  
     *Objection*: "Why not make WPC a lemma? If I assume the agent *has* a core preference, can I derive your theorem from SARP + frame-invariance?"  
     *Reply*: "WPC *is* sufficient and necessary for a non-empty/core rationalization (Theorems 3.4–3.5). SARP alone fails because it’s per-presentation. Adding WPC is how we *test* for a stable core."  
     *Weakness*: They’ll want it written as an axiom. Concede it’s isomorphic to "rationalizability by a core preference."  

  8. **The Dreaded Question**:  
     *Objection*: "How do you *define ‘the same alternative’* across presentations? If I label $100 as ‘per year’ vs. ‘per month’, haven’t I *changed* the alternative by changing the information?"  
     *Reply*: "We *operationally* define alternatives by objective payoffs (e.g., $100/year). Yes, framing *could* alter perceived meaning—but that’s exactly what WPC tests. If choices change, it reveals the agent *doesn’t* treat them as identical, so the core excludes that pair."  
     *Weakness*: This *is* circular. *Concede early*: "This is a limitation; we assume a researcher-defined mapping, but real perceptions may differ."  

  ---  
  ### **Strategic Concessions** (Make in First 5 Minutes)  
  - **"The core depends on the presentation set tested"**: Admit this upfront: "The core is conditional on the presentations we *observe*. It’s a *lower bound* on robustness—adding presentations can shrink it further."  
  - **"Identifying alternatives is assumption-laden"**: "Yes, we assume a *researcher’s* definition of ‘same alternative’. If frames alter perceptions (e.g., ‘10% fat’ feels riskier), that’s part of what WPC detects."  

  ---  
  ### **The Make-or-Break Reply**  
  **For the Structural Econometrician** (Objection 1):  
  If they reject that cross-presentation variation identifies the core, your empirical application dies. *Your reply must land this*:  
  > "Take scanner data where yogurt is displayed as ‘90% fat-free’ or ‘10% fat’. If choices differ, we *observe* which preferences are frame-dependent. The core is the set of choices *unaffected* by this—it’s literally the intersection of demand curves across frames. If *no* preferences are invariant, that’s a finding: welfare analysis *fails* for this agent."  

  ---  
  ### **Tactics**  
  - **Avoid priority fights**: Cite Bernheim/Rangel, Salant/Rubinstein, and say: "My contribution is showing *when* their criteria *coincide* with a revealed preference."  
  - **When stuck**: "That’s an excellent point for Chapter 4" or "I’m still working on that extension."  
  - **Kill your darlings**: If the philosopher corners you, admit: "This isn’t a complete welfare theory—it’s a *minimal* requirement for consistency."  

  You’ve got this. Your core insight is rock-solid—defend the *empirical* payoff. Good luck! 🚀
