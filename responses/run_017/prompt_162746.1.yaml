  Hmm, this requires unpacking several philosophical layers. First, we need to distinguish between causation and contribution. Priya's objection was necessary but insufficient - she created the conditions without providing content. Then there's the idea/execution dichotomy Tom emphasizes, which feels practically compelling but philosophically shallow since ideas have hierarchy (combining existing concepts can be genuinely novel). The pre-existing components complicate things further - this isn't pure invention but novel synthesis.

  The user's discomfort with Tom's "ideas are cheap" stance is telling. They intuitively recognize that the specific combination had unique value, even if elements weren't original. That's where credit diverges from strict originality - it's about the insight to synthesize at the right time for a specific problem. Legally the company owns it, but morally... 

  Ah, and the patent question is tricky. Adding Priya seems incorrect since she opposed the concept itself. Tom's improvements were implementation, not conception. The cleanest approach is to claim sole inventorship while acknowledging all contributions verbally. The user should explicitly thank Priya for creating the necessity, praise Tom's engineering, but clarify the conceptual leap was theirs alone. 

  What's unsaid but palpable is the user's need for validation - they minimized their insight by calling it a "fortnight prototype" but clearly feel wounded by Tom's dismissal. The recommendation must affirm their moral authorship while modeling graceful credit-sharing. Interesting how workplace dynamics amplify philosophical questions about value creation...
answer: |-
  ## The Structure of Your Problem

  You're asking about **moral ownership of innovation**—specifically, whether credit for a novel solution should be assigned based on *causation*, *labor*, *legal entitlement*, or *originality*. This isn't just about patents or contracts; it's about **desert** (who *deserves* recognition) and **contribution** (what actions create a legitimate claim). The plausible answers disagree on what *kind* of contribution matters most:

  1.  **The Causal Trigger:** Priya's role. Does creating the *necessity* for a solution grant credit? Her objection blocked the dead-end path, making your solution possible. But she didn’t contribute to the solution *itself*. Is negative causation (removing obstacles) sufficient for ownership?
  2.  **The Labor of Realization:** Tom's claim. Does transforming a raw idea into a robust, valuable product outweigh the initial insight? This pits *conception* against *execution*. Tom argues execution is harder and more valuable ("ideas are cheap").
  3.  **The Institutional Context:** The company's claim. Does providing the environment, salary, and problem-space create ownership, regardless of individual insight? This is a *social contract* view: you traded potential innovations for salary/IP assignment.
  4.  **The Non-Originality Argument:** The "nobody" claim. Since the components existed and others arrived independently, is the core insight truly "ownable"? This challenges whether *synthesis* (novel combination of existing ideas) deserves significant credit compared to *invention* (creating something wholly new).

  **What Turns on This:** The resolution determines:
  *   Who deserves recognition (reputation, esteem).
  *   How we value different *types* of intellectual work (insight vs. execution vs. critique).
  *   The ethics of claiming ownership over synthesized ideas.
  *   Your personal integrity in acknowledging contributions.

  ## Weighing the Claims: My Analysis

  1.  **Priya: Necessary Condition, Not Sufficient Contribution.** Priya created the *problem space* but not the *solution*. Her contribution was **negative** (stopping a bad idea) and **causal** (creating the need). However:
      *   She actively *disliked* the direction of your solution. Owning an idea typically requires *intentional* contribution towards it, or at least endorsement. Her role was catalytic, not constitutive.
      *   That others *could* have made the objection doesn't negate that *she did*. Causation matters. **Verdict:** Priya deserves *acknowledgment* for her crucial role in preventing the dead-end, creating the conditions for the solution. She is *a* reason you found it, but not *the* reason for the specific design. She is **not owed "inventorship" credit or primary ownership of the idea.** Say: *"You were absolutely essential in forcing us to find a better path. Without your pushback, we'd be stuck with nightly rebuilds. My specific solution came later, but it wouldn't exist without that critical intervention."*

  2.  **Tom: Execution is Essential Labor, But Not Conception.** Tom is right that his work was vital. Turning a prototype into a robust, performant system is immense labor requiring deep skill. However:
      *   **Conception vs. Execution:** While ideas *are* often cheap in isolation, the *specific, valuable idea* at the right time and place is not. Your insight identified a *novel synthesis* of known techniques to solve a critical bottleneck. Tom's work realized its *potential value*, but the *core value proposition* (the novel approach itself) existed in your conception.
      *   **Credit is Not Zero-Sum:** Acknowledging Tom's indispensable role doesn't diminish your conception. They are different contributions. **Verdict:** Tom deserves substantial credit for *making the idea real, scalable, and valuable in practice*. He owns the execution. But he does not own the core conception. His "paragraph vs. year of work" framing undervalues the specific insight that made his work *possible and directed*. Say: *"You're absolutely right that your work building this into a production-grade system is the bulk of the labor and is why it actually *works* and sells. The initial idea was a starting point; you turned it into the engine of our product. Your contributions to the design (bugs, eviction, compaction) are fundamental to its success."*

  3.  **The Company: Legal Entitlement vs. Moral Desert.** Legally, your contract is clear: they own it. Morally:
      *   They provided the platform, the problem, the salary, and the resources. Innovation rarely happens in a vacuum. The *opportunity* to solve this problem was theirs.
      *   However, the *specific creative leap* was yours, conceived initially on personal time (though context matters - it was sparked by work problems). The company didn't conceive the solution; you did, within their framework.
      *   **Verdict:** The company has a strong claim based on **social contract and investment**. They *should* own the IP legally and benefit commercially. This doesn't negate the *moral desert* of the individuals involved in its creation and realization. Their claim is to the *asset*, not necessarily to the *credit* for the specific creative insight.

  4.  **Nobody / The Commons: Synthesis Deserves Credit.** True originality is rare. Most innovation is recombination. This doesn't mean your contribution is worthless:
      *   **Contextual Novelty:** Applying known techniques A & B to solve *this specific problem* C in *this specific context* was novel and valuable *for your product and customers*.
      *   **The Insight:** Recognizing that A & B *could* be combined effectively to solve C *at that moment* was the key creative act. Independent convergence proves it was a *good* solution, not that it was obvious beforehand.
      *   **Credit vs. Ownership:** Credit can (and should) be given for insightful synthesis and successful application, even if full "ownership" of the underlying ideas isn't possible. **Verdict:** The pre-existing components weaken claims to radical originality *in the abstract*, but they **do not negate your claim to the specific, valuable insight and its successful application in your context.** Credit tracks **contextual insight and value creation**, not just pure invention.

  ## Concrete Recommendations

  1.  **Patent Inventorship:** Based on standard patent law principles (focusing on conception), **only you should be listed as the inventor.** Priya didn't contribute to the conception. Tom's contributions sound like implementation/optimization (reduction to practice), not conception of the core idea. *Do not add them simply to be nice.* Inventorship has legal meaning. Inform the patent attorney handling the filing that, based on your understanding of inventorship (conception of the core solution), you believe you are the sole inventor. Explain Priya's role (catalyst, not contributor to the solution) and Tom's role (implementation expert). Let the attorney make the final legal determination, but state your factual position clearly.
  2.  **Credit Allocation (Verbal/Internal):** Be generous and specific:
      *   **To Priya:** Acknowledge her *essential* role publicly: "This solution only exists because Priya rightly forced us to abandon the dead-end nightly rebuild approach. Her insistence on data freshness created the necessity we had to solve." Give credit for the *problem framing*.
      *   **To Tom:** Give *full* and *specific* credit for his execution: "Tom deserves immense credit for turning the initial concept into the robust, high-performance system we have today. His work on [mention specific contributions - eviction policy, compaction, fixing critical bugs] is fundamental to its speed and reliability in production. The product's success hinges on his engineering skill." Give credit for *building the real thing*.
      *   **For Yourself:** Own your insight: "I had the initial idea of combining [mention sketch] and [mention lazy materialization] to solve the performance problem Priya highlighted." Frame it as synthesis and contextual insight.
      *   **Context:** Acknowledge the prior art generally: "Like many good solutions, it builds on established techniques, but combining them this way for our specific challenge proved to be the breakthrough."
  3.  **Mindset:** Reject the false dichotomy of "idea vs. execution." Both are crucial and interdependent for *this specific valuable outcome*. Your insight defined *what* to build; Tom's skill defined *how* it actually works at scale; Priya defined *why* it was necessary; the company created the *where* and funded the *who*. Credit can be shared by acknowledging these distinct contributions without diminishing any.

  You conceived the specific, valuable synthesis. That deserves recognition as the core inventive leap. Recognizing the indispensable contributions of others doesn't take that away; it reflects the reality that significant innovation is almost always a collective achievement built on a foundation laid by others.
