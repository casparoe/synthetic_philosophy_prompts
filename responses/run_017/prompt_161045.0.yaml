answer: |-
  ## Dissertation Fellowship Proposal: Three Faces of Greedy Reductionism: Disentangling Failure Modes in Mechanistic Explanation

  **Proposed Research Question:** Are the three proposed failure modes of reductionist explanation – Level-Skipping, Capacity Shortfall, and Borrowed Lift – genuinely distinct and necessary for diagnosing non-traceable ("greedy") reductions, and can this taxonomy effectively counter the charge that the crane/skyhook distinction is merely retrospective?

  **Background & Problem Statement:** The debate between robust mechanistic explanation ("cranes") and illegitimate appeals to unexplained explainers ("skyhooks") is central to philosophy of science and biology. A powerful objection contends that this distinction is only drawn *after the fact*: successful mechanisms are labeled "cranes," unsuccessful ones "skyhooks," and "greedy reductionism" merely labels disliked approaches. This retrospective charge renders the crane/skyhook heuristic descriptively inert and normatively empty. It suggests that banning skyhooks is not a substantive methodological principle but a tautological rule about how we *describe* outcomes, undermining its value for guiding inquiry.

  Existing discussions often conflate distinct potential flaws in reductionist proposals. Defenses of reductionism frequently focus on its general viability or historical successes, while critiques often deploy "greedy reductionism" as a monolithic accusation. Neither adequately addresses the retrospective objection nor provides fine-grained diagnostic tools for evaluating *specific* reductionist attempts *in progress*. The core problem left open is whether we can articulate *in advance* what constitutes a non-traceable ("greedy") reduction in a way that is neither trivial nor question-begging, and whether such flaws manifest in separable ways.

  **The Core Idea & Hypothesis:** This project argues that the defining feature of a legitimate crane is **traceability**: its lifting capacity must be demonstrably grounded in the organized capacities of its parts *and* its own origin must be explicable without presupposing the phenomenon it explains. Violating traceability manifests in three distinct ways:
  1.  **Level-Skipping:** The explanation omits necessary intermediate levels of organization, jumping directly from a high-level phenomenon to components, leaving the mechanism linking them unspecified.
  2.  **Capacity Shortfall:** The proposed mechanism is well-specified but demonstrably insufficient to account for the full complexity, scale, or robustness of the target phenomenon. The explanation silently relies on unaccounted-for factors.
  3.  **Borrowed Lift:** The explanation covertly reintroduces the very phenomenon it purports to reduce, typically by using the target phenomenon's own conceptual vocabulary to describe the mechanism, creating circularity.

  The central hypothesis is that these three failure modes are:
  *   **Conceptually Distinct:** Each represents a unique violation of traceability.
  *   **Operationally Separable:** They can be identified independently in concrete cases.
  *   **Non-Retrospective:** They provide criteria for evaluating reductionist proposals *before* their ultimate success or failure is known, countering the core objection.
  *   **Necessary:** Together, they capture the essential ways reductionist explanations can fail to provide genuine cranes.

  **Methodology:** This project employs conceptual analysis grounded in carefully chosen scientific case studies over a four-month period:
  *   **Month 1: Conceptual Groundwork & Literature Synthesis:** Precisely define "traceability," "level" (operationally, as contextually stable domains of entities/activities within a field), "capacity," and the three failure modes. Critically engage with key arguments for the retrospective objection and existing critiques of reductionism, mapping them onto the taxonomy where possible. Establish clear, falsifiable criteria for identifying each failure mode.
  *   **Month 2: Taxonomy Development & Refinement:** Systematically analyze the logical relationships and potential overlaps between the three failure modes. Develop diagnostic questions for each (e.g., for Borrowed Lift: "Does the description of the mechanism rely on concepts synonymous with or logically entailing the target phenomenon?"). Identify potential counterexamples or boundary cases challenging their distinctness.
  *   **Month 3: Case Study Analysis:** Apply the taxonomy to concrete scientific examples, chosen to maximize discriminatory power:
      *   **Successful Reduction (Control):** *e.g., The mechanism of protein synthesis (DNA -> RNA -> Ribosome -> Protein)*. Analyze why this is widely seen as a non-greedy crane. Does it avoid all three failure modes clearly? Could it be *re-described* to seem greedy? Does it satisfy traceability?
      *   **Contested Reduction (Critical Test 1 - Potential Failure):** *e.g., Attempts to reduce consciousness (e.g., specific neural correlates or integrated information theory proposals)*. Rigorously apply the taxonomy. Does it exhibit one, two, or all three failure modes? Does the taxonomy explain *why* it's contested better than monolithic "greediness"?
      *   **Historically Resolved Case (Critical Test 2 - Retrospective Avoidance):** *e.g., The reduction of heredity to genetics (pre-DNA vs. post-DNA understanding)*. Analyze pre-molecular concepts (e.g., "gene" as abstract unit). Did they exhibit Borrowed Lift (using "hereditary factor") or Capacity Shortfall (inability to explain variation)? Did the molecular resolution address these specifically?
      *   **Selection Principle:** Cases will be chosen where: (a) a reductionist program exists/is debated; (b) detailed mechanistic proposals are available; (c) the phenomenon and proposed mechanisms are sufficiently well-characterized to assess traceability; (d) *the case could plausibly yield a result contradicting the taxonomy* (e.g., if a "successful" reduction clearly violates traceability, or a "greedy" one avoids all three modes, or if all three modes consistently collapse in practice).
  *   **Month 4: Synthesis, Refutation Defense & Deliverable Creation:** Integrate findings. Does the taxonomy hold? Does it successfully counter the retrospective objection by providing prospective criteria? Can the failure modes be reliably distinguished in practice? If overlaps exist, are they systematic or contingent? Formalize the diagnostic framework as the core deliverable. Articulate limitations and address potential failures.

  **Why this Approach?** This project moves beyond unproductive binaries ("Is reductionism true?") and avoids pitfalls of alternatives:
  1.  **Beyond General Reductionism Debate:** Focuses on *how* specific reductions succeed or fail, not the global viability of reductionism.
  2.  **Beyond Label-Surveying:** Prioritizes *diagnostic criteria* over cataloging past uses of "greedy," directly tackling the retrospective charge.
  3.  **Managing the "Levels" Problem:** Levels are treated operationally as stable (though not fundamental) descriptive domains within specific scientific contexts (*e.g.*, biochemical pathway, cellular organelle, organismal behavior). **The project is swallowed by the "levels" problem if:** (a) Defining a level coherently for a case study becomes the primary focus, consuming significant time without resolution; (b) The failure modes become entirely dependent on a specific, contested metaphysical account of levels; (c) Analysis consistently shows that what counts as "skipping" or "borrowing" is wholly determined by arbitrary level assignment, undermining the objectivity of the taxonomy. Success requires levels to be sufficiently stable *within the context of the case study* to apply the criteria meaningfully.

  **Deliverable & Impact of Success:** The primary output is an **8,000-word dissertation** presenting the taxonomy, its defense against the retrospective objection, and case study analyses. Crucially, it will include a **Diagnostic Framework for Reductionist Proposals**. This framework would allow researchers to assess a proposed reduction by asking:
  1.  **Level Check:** Does the mechanism description specify the intermediate steps adequately, or are crucial levels skipped?
  2.  **Capacity Audit:** Can the proposed mechanism, as modeled/simulated/experimentally verified, demonstrably generate phenomena of the requisite scale, complexity, and robustness? Where is the burden of proof?
  3.  **Vocabulary Scrutiny:** Is the mechanism described using concepts independent of the target phenomenon, or is explanatory load secretly carried by reimported high-level terms?
  This framework provides concrete, non-retrospective criteria for identifying potential weaknesses ("greediness") in reductionist strategies before their ultimate fate is known, aiding in research design and critique.

  **Criteria for Failure:** The project fails if:
  1.  **Collapse:** The three failure modes prove inseparable in principle or consistently co-occur in practice, reducing the taxonomy to a single, indistinct category of "bad reduction."
  2.  **Verbal Relabelling:** The traceability condition is shown to be purely semantic; any proposed mechanism, successful or not, can be easily re-described to satisfy or violate it without changing its substantive content or explanatory power.
  3.  **Vacuous or Lethal:** Traceability is either:
      *   *Vacuous:* Satisfied trivially by all historically successful reductions (rendering it non-discriminatory).
      *   *Lethal:* Flagrantly violated by all historically successful reductions (rendering it an impossible standard irrelevant to actual science).
  4.  **Levels Swallowing:** The operational definition of levels proves untenable for the case studies, preventing meaningful application of Level-Skipping or Borrowed Lift criteria.
  5.  **Case Study Refutation:** The analysis of the chosen case studies provides strong evidence that the taxonomy does not capture the actual reasons reductions succeed or fail, or that it cannot be applied consistently.

  This project offers a novel path through a persistent philosophical impasse. By dissecting "greedy reductionism" into distinct, traceability-based failure modes and testing them against concrete science, it aims to provide philosophers and scientists with sharper tools for building and evaluating mechanistic explanations, moving beyond retrospective labeling towards prospective diagnosis.
