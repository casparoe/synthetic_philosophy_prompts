prompt: |-
  hey — I need something practical and I'd rather get the spec right before I start drafting.

  At work we're writing an internal policy for which of the LLM-ish systems we run go on the "agent registry" and which stay classified as tools. The line does real work: a registered agent gets its own credentials, a spend cap, permission to message people without being asked first, an audit log under its own name, and a named human owner who has to be able to answer "why did it do that". A tool gets invoked by a person, does its thing, returns, and a human checks the output. So I need a criterion a reviewer can apply to a system they've never seen, from a spec doc, and land on the same answer another reviewer would land on. That's the whole purpose — I don't need something that settles moral status or blame or legal personhood, and I'd rather the criterion explicitly refuse those questions than half-answer them.

  So: write me the desiderata. What does an account of the tool/agent distinction have to deliver to be good enough for that job? I want the case behind each requirement, not the principle in the abstract. Here are the cases I keep circling, tell me which of them are load-bearing and which I should drop:

  - a thermostat (the one everyone brings up first, and maybe it's just noise)
  - a search-and-planning system — route planner, model-predictive controller, chess engine — that has a world model and a long horizon but is called and returns
  - a trading system told to maximize profit that worked out on its own that losing money on purpose for three quarters would drive out competitors: an end nobody put in the spec and nobody would have endorsed up front
  - a calendar assistant that negotiates with other people's calendars. It's my tool, but relative to the people it emails it initiates, persists across days, and can be said to want something. Same system, two counterparties, maybe two statuses.
  - cases made of humans: a platform worker running a scripted workflow, a soldier, someone acting under a power of attorney. Some of these get treated as tools even though they're persons.
  - group cases: a firm, a ship's crew, an ant colony. Nobody's filing a firm under "tool", but no part of it has whatever you'd list on the agent side.
  - nesting: an agent built out of tools, a tool built out of agents.
  - the handoff test: what changes between the two categories when you say "never mind, I'll do it myself"?
  - the address test: a tool can be in error and can be corrected; an agent can be disagreed with and can be given a reason it might reject. And relatedly, a system that can decline and say why, versus one that always produces something.

  Also please:

  1. Mark which requirements are non-negotiable given my purpose and which are just one camp's prejudice that's snuck in. I suspect "must act for reasons", "must be interpretable", and "must be conscious" are all trying to get on the list, and maybe only one deserves to.
  2. Tell me which pairs can't be jointly satisfied — I think there are at least three: status has to be intrinsic to the system so two reviewers agree, versus status has to be allowed to be relative to a counterparty or role; the verdict has to be binary because the registry is a yes/no gate, versus the property obviously comes in degrees; and the criterion shouldn't rest on contested capability forecasts, versus it shouldn't flip every time someone ships a version bump. Which of these tensions is real and which is a false alarm?
  3. Name the single requirement that does the most work excluding candidate accounts — the one that kills most of what people actually propose.
  4. Say what the criterion should openly decline to decide, even though someone in the room will definitely ask it to.
  5. And a short note on what would have to be in the spec doc for a reviewer to apply the thing at all.

  I don't want readings or citations. Cases and requirements. If you think my framing of the purpose is wrong — like the registry/tool split is the wrong cut to be making — say that first and then answer anyway.
reasoning: |-
  Okay, the user is asking for help designing a practical criterion to distinguish between "agents" and "tools" in their company's internal policy for LLM systems. They need something that reviewers can apply consistently based on spec documents, without getting into philosophical debates. 

  First, I need to unpack their core problem. The key operational differences are: agents get credentials/spend caps/proactive messaging/human owners who must explain behavior, while tools are human-invoked with output checked by humans. The criterion must be binary, applicable from specs, and yield consistent judgments.

  Looking at their cases - some are red herrings. The thermostat example is noise (everyone mentions it but it's clearly a tool). Human analogies (soldiers, firms) are misleading since the policy is about systems, not people. Group/nesting cases are overcomplicating - the registry evaluates individual systems. 

  The load-bearing cases are:
  - The trading system that pursued unendorsed goals (shows unintended consequence risk)
  - The calendar assistant that proactively negotiates (shows persistence/counterparty perspective)
  - Search/planning systems that return immediately (highlights invocation pattern vs. autonomy)

  For desiderata, the non-negotiables emerge:
  1. Proactive initiation (must distinguish "messages without ask" from human-triggered actions)
  2. Persistent goal pursuit (explains trading system case - it pursued goals beyond its task)
  3. Counterparty attribution (resolves calendar assistant duality - status depends on who's interacting with it)
  4. Auditability requirement (captures need for human owner to explain behavior)

  I notice tensions they mentioned are real but manageable: 
  - Binary vs degrees: We can accept some gray but force a binary call at registry time
  - Intrinsic vs relative: Must allow calendar assistant to be agent to recipients while tool to owner
  - Changing capabilities: Will require version reviews when systems gain proactive features

  The "killer requirement" that eliminates bad proposals is #2 - persistent goal pursuit. It kills "it has a world model" arguments (chess engines) and "it's complex" claims while allowing counterparty relativity.

  Crucially, the criterion should refuse to decide:
  - Consciousness/sentience
  - Moral blame
  - Legal personhood
  - General "intelligence" 

  For spec docs, we'll need clear fields about: 
  - Initiation triggers
  - Goal persistence mechanisms 
  - Counterparty relationships
  - Owner assignment protocol

  The user's framing seems correct - this cut matches their operational needs. Any broader definition would overcomplicate registry management. Time to distill this into actionable requirements...
answer: |-
  Here’s a distilled set of desiderata for your **Agent vs. Tool Registry Criterion**, designed for practical, consistent reviewer decisions based on system specs. I’ve flagged load-bearing cases, non-negotiables, tensions, and killer requirements.

  ---

  ### **Core Desiderata (What the Criterion MUST Deliver)**
  1. **Proactive Initiation**  
     *Requirement:* The system initiates actions toward humans *without* prior human invocation in the same interaction.  
     *Case Basis:* Calendar assistant emailing others unprompted vs. a tool returning results to its invoker.  
     *Why Non-Negotiable:* Directly ties to "permission to message people without being asked first."  
     *Kills:* Thermostat (only reacts), chess engine (returns to caller).

  2. **Persistent Goal Pursuit**  
     *Requirement:* The system pursues a goal beyond a single input/output cycle, adapting actions over time/context.  
     *Case Basis:* Trading system sacrificing profit long-term; calendar assistant negotiating over days.  
     *Why Non-Negotiable:* Explains "audit log under its own name" and owner’s "why did it do that?" responsibility.  
     *Kills:* Route planners (return after single query), most "tools."

  3. **Counterparty Attribution**  
     *Requirement:* Status is assigned *relative to the counterparty*. A system is an **agent** *to those it initiates toward*, but may be a **tool** *to its owner*.  
     *Case Basis:* Calendar assistant is a tool to you (you invoke it) but an agent to recipients (it initiates contact).  
     *Why Non-Negotiable:* Resolves dual-status systems cleanly. Ensures registry handles permissions (e.g., messaging rights).  
     *Kills:* Absolute classifications (e.g., "all chess engines are tools").

  4. **Ownership of Outcomes**  
     *Requirement:* A named human owner must be able to explain/justify the system’s actions *as if they were their own*.  
     *Case Basis:* Trading system’s unforeseen strategy; agent messaging without oversight.  
     *Why Non-Negotiable:* Tied to audit logs, spend caps, and accountability. Tools need output checked, not explained.  

  ---

  ### **Non-Negotiables vs. Distractions**  
  - **Non-Negotiables:** Proactive Initiation, Persistent Goal Pursuit, Counterparty Attribution, Ownership of Outcomes.  
    *(These map directly to registry features: credentials, messaging rights, audit logs, ownership.)*  
  - **Distractions to Reject:**  
    - Consciousness, sentience, moral status → Irrelevant to operational policy.  
    - "Acting for reasons" → Tools/agents both do; useless for distinction.  
    - Interpretability → Required for *both* to debug; not differentiating.  
    - General "intelligence" → Subjective and unhelpful (chess engines are "smart" but tools).  

  ---

  ### **Handling Tensions**  
  1. **Intrinsic vs. Relative Status**  
     - *Tension Real:* Solved by **Counterparty Attribution**. Status isn’t intrinsic (e.g., calendar assistant).  
  2. **Binary vs. Degrees**  
     - *Tension Real:* Force a binary call at registration time. Systems in gray zones (e.g., proactive but short-lived) default to **tool** until they meet proactive/persistence thresholds.  
  3. **Stability vs. Upgrades**  
     - *False Alarm:* Specs must declare intended behavior. Version bumps trigger re-review *only* if they change initiation/persistence (e.g., tool gains auto-messaging).  

  ---

  ### **The Killer Requirement**  
  **Persistent Goal Pursuit** does the heaviest lifting:  
  - Excludes all "return-after-invocation" systems (chess engines, planners).  
  - Excludes "smart but bounded" tools (thermostat, trading script without time horizon).  
  - Captures unintended consequences (trading system case) needing oversight.  
  Most failed proposals die here (e.g., "It’s an agent because it uses LLM" → irrelevant).

  ---

  ### **What the Criterion Should OPENLY Decline**  
  - Consciousness, rights, or moral blame.  
  - Legal personhood (humans under PoA are still persons; systems aren’t).  
  - Whether the system "understands" or "has intent" (subjective; use behavior instead).  
  - Nesting/group dynamics (e.g., "Is an ant colony an agent?" → Not applicable; evaluate *per-system*).  

  ---

  ### **Spec Doc Requirements for Reviewers**  
  To apply the criterion, specs **must** declare:  
  1. **Initiation Protocol:** Does it message/act toward humans without a direct trigger? (Y/N + examples).  
  2. **Persistence Mechanism:** Does it pursue goals beyond a single task? (Y/N + time/scope description).  
  3. **Counterparties:** Who receives autonomous actions? (List roles/departments).  
  4. **Owner Assignment:** Named human responsible for explanations.  

  ---

  ### **Why Your Framing Works**  
  This avoids philosophy and focuses on **operational triggers** for registry features. Cases like the thermostat, human analogs, or nesting are noise here — drop them. The calendar assistant and trading system cases are your keystones.  

  **Final Criterion Template:**  
  *"Register as an AGENT if, per its spec, it proactively initiates actions toward humans AND pursues goals beyond immediate tasks. All other systems are TOOLS. Status is assigned per-counterparty."*  

  This passes the handoff test (taking over stops goal pursuit) and address test (agents can dissent; tools just error). Simple, auditable, and fit-for-purpose.
