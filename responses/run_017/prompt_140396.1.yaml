prompt: |-
  I'm the ombudsperson for a network of about a dozen assisted-living and memory-care homes — families, residents and staff bring me the fights nobody else wants to touch: who gets to be in the room when the doctor calls, whose version of "what Dad would have wanted" wins, whether the staff should keep a promise to a resident that the family hates. Its maybe forty cases a year, I've got half an hour to an hour per intake, and whatever I decide goes in a case note that a lawyer or a state inspector might read later, so theres a legal floor I cant go below. I took two philosophy classes in college and recently got into reading about Confucian role ethics on my own after a genuinely ugly fight with my own brother about our mother, and the core idea keeps sticking: you dont start with a free individual who then acquires relationships, you start with the person as a node of roles and the obligations come already built into the role, graded by closeness, with no impartial standpoint to appeal to. Two caveats before you write anything. I do NOT want this to turn into "use the Confucian lens when the family is Chinese or Korean or Vietnamese" — we get plenty of families like that and plenty where nobody has ever heard of Confucius, and it seems both insulting and actually less useful than just running the role lens on everybody, staff included. And I know role ethics gets accused of being unable to criticize the roles themselves: if the role says the eldest son decides, then the eldest son decides, and theres nothing more to say. I want a procedure that has a real answer to that, or that admits it doesnt.

  Heres roughly what I think I need, plus a few half-baked tools Ive been using that you should feel free to throw out or fix. I want an ordered set of questions I can run on an intake: what to ask first, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because its a values call and not a factual one. Concretely Ive been messing around with (1) a role-pair map — list the actual pairs in play, note which ones the institution invented (resident, charge nurse, healthcare proxy) and which ones the people actually live inside, and notice when an institutional role is quietly being asked to carry the emotional weight of a family one; (2) a role-distance substitution test — take the demand being made and re-run it with the person one step further out on the relationship map, and if it collapses immediately then the demand was really about that specific relationship rather than about the residents welfare; (3) something ive started calling the creditors complaint, where someone has been performing a role very richly and has started to feel owed for it, and gets resentful when the other person performs the same role thinly — I have no idea whether role ethics has anything to say about that or whether it just says do the role better. Theres also the names thing: the same person gets called "my father," "Mr. Alvarez," "the resident in 214," "Dads friend Carol," and the mismatch feels like evidence but I cant say what its evidence of.

  Can you give me the actual procedure — short enough to actually use, steps in order — and then run it on these three, being honest when it gives an answer I wont like:

  - Two brothers. One lives ten minutes away, visits daily, handles everything. The other lives across the country, calls on Sundays, insists on being consulted before every decision, and wants to override his brother about a feeding tube. The local brother wants me to tell the staff to stop calling the distant one.
  - A daughter whose father has mid-stage dementia asks the staff not to tell him that his other daughter died — she says in our family we shield him, knowing would only cause suffering and hed forget and relearn it over and over. The staff think this is deception and that he has a right to know. Im fairly sure I dont want the answer this one pushes toward.
  - A resident with no children who has an unmarried partner of thirty years; the partner isnt the legal proxy, a niece who hasnt visited since 2019 is, and on the forms the partner is down as "friend." Theress no role on offer that fits and the institution has to invent one.

  Also: what does the procedure systematically get wrong, and at what point do I have to drop it and switch to rights language because the law or the liability people will eat me otherwise? Ive got a 90-minute slot with new staff in a couple weeks and id rather make them test something than lecture at them.
reasoning: |-
  Okay, the user is an ombudsperson for assisted-living and memory-care homes dealing with complex interpersonal conflicts. They mentioned an interest in Confucian role ethics but want a practical procedure applicable across all cultures, not just those familiar with Confucianism. They also want to avoid the trap where roles can't be criticized, like blindly following the eldest son's decisions.

  First, I need to address their key requirements: a step-by-step procedure that’s quick to use, handles role conflicts, and has a way to critique roles. They provided three tools they’ve been experimenting with: role-pair maps, role-distance substitution, and the creditors complaint. I should integrate these into the steps.

  Looking at their examples, the brothers' conflict involves proximity and decision-making. The local brother is hands-on, the distant one wants control. The role-pair map here would show the institutional roles versus family roles. The substitution test might reveal if the demand is about the specific relationship. The creditors complaint could apply if the local brother feels owed for his efforts.

  The dementia case involves withholding information. The daughter wants to shield her father, staff insists on truth. Role ethics might initially support the daughter's role, but the procedure needs a way to question if the role is harmful. The substitution test could show if the demand collapses with a less close person.

  The unmarried partner vs. niece as proxy lacks a clear role. The institution needs to recognize the partner's de facto role. Here, the procedure must adapt roles when existing ones don’t fit, maybe through role grafting.

  The user’s deeper needs: They want a structured yet flexible tool that respects relationships but has ethical guardrails. They need to document decisions legally, so the procedure must incorporate legal floors. Also, training staff requires a practical framework, not theory.

  I should structure the procedure into steps: role inventory, conflict mapping, role critique, substitution test, creditors check, role adaptation, then decision. Each step needs clear questions and exit points. For critique, include harm, institutional roles, and reciprocity to avoid rigid role adherence.

  For the brothers, the procedure might side with the local brother but require documentation, angering the distant one. For the daughter, it might initially support shielding but pivot to truth if harm is ongoing. The partner case would graft a spousal role, overriding the niece.

  Systematic flaws: Role ethics might undervalue individual autonomy or over-prioritize family. It could miss systemic issues like elder abuse. Legal switches are needed when rights, consent, or safety are at stake. Training should involve role-playing these cases to highlight pitfalls.

  Need to ensure the steps are concise, use their tools, and address their caveats. Also, clarify when to switch to rights language—like in abuse or legal proxy conflicts. The procedure must balance relational ethics with necessary rigidity for protection.
answer: |-
  Here's a concrete, step-by-step procedure incorporating your tools and addressing your caveats, designed for 30-60 minute intakes. It prioritizes relational reality while building in safeguards against role tyranny. **Bold** = Key Question/Action.

  **The Role Ethics Intake Procedure (REIP)**

  1.  **Role Inventory & Pair Mapping:**
      *   Ask: *"Walk me through everyone involved in this situation, in their own words. How do they refer to each other? (e.g., 'my father,' 'Mr. Alvarez,' 'Dads friend Carol,' 'the resident'). What specific roles do they hold for each other *right now*? (e.g., primary caregiver, healthcare proxy, long-time partner, estranged daughter, charge nurse, trusted aide)."*
      *   **Map:** Visually list all individuals. For each, note:
          *   Their primary *lived* roles (Son, Daughter, Partner, Friend).
          *   Their primary *institutional* roles (Resident, Proxy, POA, Nurse, Aide).
          *   **Key Conflict:** Note mismatches between lived/institutional roles (e.g., "Partner" listed as "Friend") and *which roles carry the emotional weight* in the conflict (e.g., is the "Proxy" role being asked to carry "Sibling Rivalry" weight?).
      *   **Exit Point:** If no significant relational connections exist *or* a clear legal directive (valid, specific advance directive, court order) resolves it immediately, follow the law/directive. Document why REIP stopped here.

  2.  **Conflict Definition & Role-Distance Substitution:**
      *   Ask: *"Specifically, what decision needs to be made or action taken? Who is asking for what, and *why do they say* it's important for [Resident]?"*
      *   **Apply Substitution Test:** Take the core demand. Substitute the person making the demand with someone *one step further out* on the relationship map concerning the resident (e.g., distant brother instead of close brother; niece instead of partner; staff member instead of daughter). Ask: **"Does this demand still make sense *primarily* for the resident's well-being in this new role's context, or does it become clearly unreasonable, primarily about the *original* relationship dynamic, or impossible?"**
      *   **Interpret:** If the demand collapses (e.g., Distant Brother demanding daily calls makes no sense; Niece demanding control over Partner's access seems unreasonable), this strongly suggests the conflict is driven by the *specific relational dynamic*, not resident welfare. Document this finding.

  3.  **Creditor's Complaint Check:**
      *   **Ask:** *"Is anyone expressing strong resentment, frustration, or a sense of being 'owed' something specific in this situation? Does it feel like they've been doing 'more' in their role and expect a particular reward or deference now?"*
      *   **Analyze:** If "Yes," identify the "thick" vs. "thin" role performance and the perceived debt. **Ask:** *"Is the 'debt' being called in something that would genuinely benefit the resident *right now*, or is it primarily about settling scores, gaining status, or validating past effort?"* Note: Role ethics emphasizes performing one's *own* role well, *without* expectation of reciprocal reward. A creditor's complaint often signals a *failure* of role ethics, not its fulfillment. Document its presence and perceived influence.

  4.  **Role Critique & Adaptation:**
      *   **Critique Existing Roles:** **"Does blindly following the apparent 'script' of the strongest lived role (e.g., 'eldest son decides') risk causing significant, foreseeable harm to the resident's well-being, dignity, or safety? Does it conflict irreconcilably with core institutional obligations (safety, basic rights)?"**
      *   **Critique Institutional Fit:** **"Are the existing institutional categories failing to capture a crucial lived role (e.g., Partner listed as 'Friend')? Is this causing the conflict?"**
      *   **Adapt/Role Grafting:** If critique reveals problems:
          *   **Acknowledge the lived role** officially where possible (e.g., internally designate Partner as "Life Partner" with specific visitation/consultation rights, even if not legal proxy).
          *   **Redefine expectations** around a role (e.g., "While you are the Proxy, daily medical decisions require input from the primary hands-on caregiver brother due to his constant presence").
          *   **Temporarily shift weight** based on proximity/capacity (e.g., hands-on brother handles urgent decisions, distant brother consulted for major planned ones).
          *   **Create new, shared roles** ("Family Spokesperson" + "Primary Caregiver Liaison").
      *   **Exit Point:** If critique reveals imminent risk of harm, abuse, neglect, or a clear violation of resident rights/law, STOP. Switch to safeguarding protocols and rights language. Document the trigger.

  5.  **Decision & Grounding:**
      *   **Synthesize:** Review the Map (Step 1), Substitution Test result (Step 2), Creditor's Complaint check (Step 3), and Role Critique/Adaptation (Step 4).
      *   **Ask:** *"Given these relationships, their obligations, the actual risks/benefits to the resident, and the institutional framework, which path best honors the *substance* of the most critical roles while minimizing harm and respecting core protections?"*
      *   **Decide:** Frame the decision in terms of fulfilling *adapted* role obligations centered on the resident's holistic well-being within their relational context. **Explicitly state which role expectations were prioritized, adapted, or overruled and *why* (harm prevention, institutional necessity, lack of fit).**
      *   **Document:** Case note must clearly trace the REIP steps, findings (especially Substitution Test result, Creditor's Complaint, Role Critique), the adaptation made, and the grounding in resident-centered role fulfillment within legal/institutional bounds.

  **Running the Cases:**

  1.  **The Brothers:**
      *   **Step 1:** Lived Roles: Son/Caregiver (Local), Son (Distant). Institutional: Resident, Potential Healthcare Proxy? (Establish who *is* the legal proxy/POA). Conflict: Local feels Proxy/Decision-maker due to proximity/effort; Distant feels equal rights as son/possible proxy.
      *   **Step 2 (Substitution Test):** Demand: "Stop calling Distant Brother." Substitute: If a *cousin* demanded staff stop calling Distant Brother, it collapses immediately. The demand is primarily about the Local Brother's frustration/desire for control in *his* relationship with his brother, *not* resident welfare.
      *   **Step 3 (Creditor):** Likely YES from Local Brother ("I do everything, I should decide"). The "debt" (deference/control) would primarily validate his effort, not necessarily benefit the resident *in this specific decision*.
      *   **Step 4 (Critique/Adapt):** Blindly following "sons have equal say" ignores the *functional reality* of care. Adaptation: Acknowledge Local Brother as "Primary Caregiver & Situational Decision-Maker" for urgent/day-to-day matters due to proximity. Formalize Distant Brother's role as "Consulted Son" for *major*, non-urgent decisions (like feeding tube placement). Staff must contact Distant Brother *for major decisions only*, respecting his role as son, but not for daily updates.
      *   **Step 5 (Decision):** Deny the request to stop calling entirely. Order staff to contact Distant Brother *only* for pre-defined major decisions (like feeding tube). Document: Substitution test showed demand relational, not resident-focused. Creditor complaint noted. Roles adapted based on functional caregiving reality to balance son obligations while ensuring timely care. Legal proxy status (if Distant is proxy) must be confirmed; if Distant *is* proxy, REIP adapts but cannot override legal authority without evidence of harm/abuse (Step 4 Exit).
      *   **Why you won't like it:** Local Brother will be furious. It doesn't give him the clean win he wants. It forces staff into a potentially messy distinction between "major" and "daily" decisions.

  2.  **Daughter Hiding Sister's Death:**
      *   **Step 1:** Lived Roles: Daughter/Protector, Father, Staff (Caregivers/Truth-tellers?). Institutional: Resident, Daughter (maybe Proxy?), Staff.
      *   **Step 2 (Substitution Test):** Demand: "Don't tell Father his daughter died." Substitute: If a *neighbor* demanded staff not tell, it collapses. The demand stems entirely from the Daughter's specific "Protector" role perception and fear of suffering, not a generalizable principle about dementia care.
      *   **Step 3 (Creditor):** Possibly. Daughter may feel "owed" deference in shielding due to her past caregiving role ("We've always shielded him").
      *   **Step 4 (Critique/Adapt):** **CRITIQUE:** Blindly following the Daughter's "Protector" role risks significant harm: denying grief, preventing closure (however limited), fostering distrust if he senses deception, depriving staff of authenticity. Conflicts with staff's role obligation to dignity and truthful interaction where possible. Adaptation: The "Protector" role needs reframing from "shielding from all pain" to "supporting *through* pain." Staff's role involves compassionate truth-telling.
      *   **Step 5 (Decision):** The father should be told, compassionately and repeatedly as needed, with Daughter and staff support. Staff lead the telling with Daughter present for support, using their expertise. Document: Substitution test showed demand relationally specific. "Protector" role critique revealed harm risk. Adaptation reframes protection as supportive presence during distress. Core institutional/ethical obligation to avoid harmful deception and respect personhood, even with dementia, triggers partial Step 4 Exit (rights/dignity).
      *   **Why you won't like it:** It forces the daughter into a painful situation she desperately wanted to avoid. It feels harsh. But REIP shows the daughter's request was about her role interpretation, not resident welfare, and the role interpretation itself was harmful.

  3.  **Partner vs. Niece (Proxy):**
      *   **Step 1:** Lived Roles: Life Partner (30 yrs), Resident, Niece (Estranged). Institutional: Resident, Legal Proxy (Niece), "Friend" (Partner - mismatch!).
      *   **Step 2 (Substitution Test):** Implied Demand: "Partner should be treated as primary decision-maker, not Niece." Substitute: If a *different friend* demanded primary decision-making over the legal proxy niece, it might not *fully* collapse (a very close friend *might* have a point), but it highlights the unique, spousal-level claim of the Partner. The demand is fundamentally about recognizing the *specific* depth of *this* relationship.
      *   **Step 3 (Creditor):** Unlikely primary driver, though Partner may feel owed recognition after 30 years.
      *   **Step 4 (Critique/Adapt):** **CRITIQUE:** Institutional role ("Friend") catastrophically fails to capture the lived role ("Life Partner"). Blindly following the legal proxy role (Niece) ignores the relational reality and likely severs the resident's most critical bond. Adaptation (Role Grafting): Officially designate Partner internally as "Designated Life Partner" with status equivalent to spouse for visitation, information sharing, and *consultation on all decisions*. Niece remains *Legal Proxy* for formal consent *only*. Staff are instructed to consult Partner *first* and thoroughly, obtain Partner's perspective/input, and then contact Niece for *formal consent* based on that input, unless Partner's request is clearly harmful or against known wishes. If Niece overrides Partner *without cause*, escalate (potential Step 4 Exit - harm risk).
      *   **Step 5 (Decision):** Implement Role Grafting. Partner is the primary relational conduit and consultant. Niece is the legal signatory bound to respect the Partner's central role and input unless contrary to resident's known wishes or harmful. Document: Profound mismatch identified. Substitution test highlighted unique relational claim. Role grafted ("Designated Life Partner") to reflect reality and preserve critical relationship. Legal proxy role adapted to function as formal executor of decisions made in consultation with the central relationship.
      *   **Why you (might) like it:** It centers the actual relationship. It finds a practical path within the legal constraint.

  **What REIP Systematically Gets Wrong:**

  1.  **Undervalues Individual Autonomy/Wishes:** It prioritizes relational context. A resident's clearly expressed prior wishes ("I never want X, no matter what my son says") *must* trigger a Step 4 Exit (rights/dignity) and override relational harmony.
  2.  **Blind to Coercion/Abuse:** It assumes good faith role performance. Subtle coercion, emotional abuse, or financial exploitation within roles can be missed if not actively probed. *Requires vigilance:* Creditor's Complaint check is a start; look for fear, isolation, unusual financial requests. Any suspicion triggers Step 4 Exit.
  3.  **Struggles with Truly Isolated Individuals:** If someone *genuinely* lacks meaningful relationships (no "roles"), REIP provides little guidance beyond institutional roles and rights. Falls back to Step 1 Exit.
  4.  **Can Perpetuate Systemic Inequities:** If societal roles are inherently unjust (e.g., rigid gender roles), REIP might reinforce them unless the Role Critique step is applied rigorously. Staff training must emphasize this.
  5.  **Underplays Staff Relational Complexity:** Staff-resident bonds matter! REIP can help map this ("trusted aide" vs. "charge nurse"), but institutional power dynamics complicate the "role obligations."

  **When to Switch to Rights Language (Step 4 Exit Point):**

  1.  **Imminent Risk:** Harm, abuse, neglect, safety violation suspected or observed.
  2.  **Core Rights Violation:** Clear disregard for resident's known wishes (advance directive, prior explicit statements), denial of basic dignity (forced treatment, degrading conditions), suppression of communication.
  3.  **Legal Imperative:** A valid, specific court order, POA document, or statute directly applies and conflicts with the REIP path. *Consult legal.*
  4.  **Institutional Non-Negotiables:** Actions violating licensing regs, core safety protocols, or professional ethics codes (e.g., nurse falsifying records per family request).
  5.  **Irreconcilable Role Harm:** When fulfilling a role expectation (even adapted) would cause demonstrable, significant harm to the resident, and no adaptation avoids it.

  **Staff Training (90 mins - Focus on Practice):**

  *   **(15 min)** Intro: Why relationships? Limits of rules/law. Core REIP idea: No abstract individual, role webs matter, but roles can be harmful/adapted.
  *   **(20 min)** **Exercise 1 (Mapping):** Give simple case (e.g., Brothers). Have pairs map roles (Lived/Inst), identify mismatches, who carries emotional weight. Share.
  *   **(20 min)** **Exercise 2 (Substitution Test & Critique):** Give the Daughter case. Have groups apply Substitution Test. Then ask: "What harm might blindly following the Daughter's 'Protector' role cause? How could we adapt it?" Discuss.
  *   **(20 min)** **Exercise 3 (Spot the Exit):** Give 3 quick scenarios: 1 clear rights violation (resident begging not to see abusive son), 1 legal directive (valid DNR), 1 ambiguous. Have groups identify if/when Step 4 Exit is needed.
  *   **(15 min)** Q&A & Wrap-up: Emphasize REIP is a *tool*, not a tyrant. Documentation is key. When in doubt about harm/rights, pause and consult/safeguard. **Handout:** The 5-step REIP cheat sheet + Exit triggers.

  This procedure gives you a structured, relational way to navigate the messiness, provides defensible documentation by showing your reasoning, incorporates your innovative tools, tackles the role-critique problem head-on, and clearly signals when you *must* switch gears to protect the resident from relational harm itself. It won't make everyone happy, but it grounds decisions in the reality of connected lives.
