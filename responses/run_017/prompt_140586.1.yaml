prompt: |-
  For most of my working life I was a field biologist — nearly forty years of seabird censuses on sub-Arctic cliffs, which is to say a career in which the difference between a landmark dataset and a wasted season was very largely a matter of weather. Since retiring I have been reading philosophy seriously for the first time, and the topic that has lodged itself in my head is the problem of moral luck: the pair of essays from the 1970s that gave it its name, the principle — that we are morally assessable only for what is within our control — that those essays set against our actual practices, and the uncomfortable fact that my own professional life was full of judgments about who counts as a good field scientist that quietly tracked outcomes nobody controlled.

  The reason this is not merely an armchair interest is that I now chair a small committee of my old learned society, and I have come to think that what we do four times a year is moral luck administered on a budget.

  The committee makes two kinds of decision about early-career field researchers. First, it awards a modest prize — money, a certificate, and a line on a CV that people in the field actually read — for the best piece of field work of the year. Second, it distributes recovery grants to graduate students whose field seasons collapsed, on the understanding that some collapses are bad luck and some are bad planning, and that the society should not simply reimburse carelessness. In a typical year we see fifteen to twenty-five cases, three or four per meeting, ninety minutes per meeting. The committee is me, two working scientists, and two lay members of council; none of them has read any philosophy and one of them is openly hostile to anything that sounds like an excuse. Every decision has to be justified in a single-page minute that goes to council and, in an edited form, to the candidate, who will read it and may appeal. The stakes per case are small in money and large in everything else: a prize line can start a career, and a minute that uses the word careless can end one.

  I would like a written procedure my committee could actually run on a case file, in order, with a stopping point at each question and an explicit statement of what counts as a sufficient answer.

  I am not asking for a summary of the debate or for references; I have the essays and a good library. I am asking for the translation, and I want it to be honest about what gets lost. Specifically:

  One, I want the procedure to keep the distinction between assessing a decision as it could have been assessed before the outcome was known, and assessing the outcome, and I want it to force us to write down both verdicts separately, and to say in one sentence which of the two the money is following when they disagree. My instinct is that a prize must follow the outcome somewhere, since a prize for a well-designed protocol that produced nothing is not a prize anyone wants — but I want that concession made explicitly rather than smuggled in, and I want to know how much of the literature's bite is lost when it is made.

  Two, I want a question that replaces the counterfactual we currently ask (what would have happened if) with something more disciplined: ask instead for the range of outcomes within which the committee's verdict would have been the same, and treat the width of that range as the finding. Where the range is very narrow, the committee is being run by outcomes and should have to say so in the minute.

  Three, I want a rule governing when outcome information may be used as evidence of the quality of a decision that was not directly observable — since in field work we usually see only the result and a write-up — and when it may not; and I want the rule to distinguish that diagnostic use from the quite different use of a bad outcome as a reason to express condemnation. I suspect much of what looks like moral luck in our deliberations is really sloppy epistemology, and I want the procedure to separate the part that is bad inference from the part that is genuinely a moral problem.

  Four, I want the procedure to say what a not-at-fault verdict still requires of a person when something bad happened that they caused. In the literature this is the region of agent-regret, and in practice it is the part my committee handles worst: we either say nothing at all or we quietly punish. I would like a prescribed non-punitive response — who writes the account of what went wrong, who tells the local community or the landowner, who does the repair work — kept visibly distinct from sanction.

  Five, I want a rule for sequences. A single unlucky season is one thing; a candidate with three failed seasons, each of which was defensible on its own reconstruction, is another, and I do not trust myself to tell when a run of bad outcomes has become evidence rather than bad luck.

  And six, I want a stop rule: some of our cases are really judgments about what sort of person the candidate is — steady, or reckless, or the kind of person who attracts disasters — and I want the procedure to stop and say so when it has arrived there, rather than dressing a judgment about character up as a judgment about a decision.

  Please run the procedure on three cases.

  The first: two doctoral students, same supervisor, same site, both chose to run their census in the short early-season window rather than the safer but less informative later one. One got an extraordinary calm fortnight and produced the dataset of her career. The other lost three weeks to storms and an equipment cache destroyed by a rockfall, and has nothing. Identical decision, opposite outcomes. Who gets the prize, who gets the recovery grant, and does it matter that one of our two instruments is compensatory and the other is honorific?

  The second: a student who ran a season without the animal-handling certification the society requires and without the landowner's written access permission, and who had an injury-free, productive, publishable season; and, in the same round, a student who complied with everything and whose field assistant broke a wrist when a nesting ledge gave way. My committee's unreflective view is that the first deserves a sanction and the second deserves sympathy. I want to know whether the procedure can keep both of those reactions, and if it cannot, which one it gives up.

  The third: a candidate whose decision, on our own reconstruction, was the best available — genuinely the best, not merely defensible — and whose work nevertheless caused disturbance at a protected colony and the abandonment of a number of nests. I expect the procedure to give me an answer here that I will not like, and I would rather have it than have the committee muddle through: tell me what it is, defend it, and say plainly what it costs the candidate and what it costs us.

  Finally, tell me what the procedure cannot do. I take it that it cannot settle whether blame is ever justified, that it will fail whenever the contemporaneous record of a decision does not exist — which, in field work, is most of the time — and that there is a class of cases, the ones about what a person is made of, where it will not be able to help us at all. I would like those limits stated in the document itself, in language a retired judge and a fund manager will accept, so that the procedure is not asked to do work that only a philosopher could do and that a philosopher perhaps could not do either.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired field biologist transitioning into philosophy, now chairing a committee that evaluates early-career researchers. Their core concern is implementing moral luck theory into practical committee procedures. 

  First, I need to unpack the six structural requirements:
  1) Separating decision-quality from outcome assessment
  2) Replacing counterfactuals with outcome-range analysis
  3) Regulating outcome-as-evidence usage
  4) Defining non-punitive agent-regret responses
  5) Handling sequential failures
  6) Halting character judgments

  The three test cases are brilliantly designed stress tests - identical decisions with opposite outcomes (Case 1), rule-breaking vs rule-following with inverse safety results (Case 2), and optimal decisions causing harm (Case 3). Each exposes different facets of the moral luck problem.

  For the procedure itself, I'm considering a three-stage framework:
  1) Contemporaneous Assessment: Reconstructing the decision context without outcome knowledge
  2) Outcome Analysis: Classifying outcomes as controlled/uncontrolled and examining diagnostic value
  3) Verdict Synthesis: Applying rules for prizes/grants while separating sanctions from agent-regret duties

  The key innovations would be:
  - Outcome Range Width metric replacing "what if" speculation
  - Explicit Outcome Dependence Coefficient when prizes must consider results
  - Harm Accounting protocol for agent-regret cases
  - Sequential Failure Threshold rule

  Notably, the procedure must fail transparently when:
  - Character judgments are unavoidable (Stop Rule)
  - Decision records are missing (common in fieldwork)
  - Blame justification is philosophically indeterminate 

  For Case 1, the solution demonstrates outcome-dependence: the prize follows results while the grant ignores them. Case 2 reveals the procedure's refusal to reward rule-breaking regardless of outcomes. Case 3 forces us to confront that even perfect decisions may require reparative actions without blame.

  The real test is whether this survives committee scrutiny. The retired judge will question legalistic elements, while the fund manager may resist outcome-range calculations. But by building in "Fail Explicitly" clauses and avoiding philosophical jargon, it might function as the practical tool the user needs.
answer: |-
  Here is a procedural framework addressing your requirements, followed by its application to your three cases and a statement of limitations.

  ---

  **Committee Procedure for Fieldwork Assessment (Moral Luck-Aware)**

  **I. Pre-Assessment Requirements**  
  1. **Case File:** Must contain:  
     - Research proposal & methodology  
     - Pre-season risk assessment  
     - Contemporaneous field logs  
     - Supervisor’s endorsement/critique  
     - Outcome report (data, disruptions, failures)  
  2. **Absent Records:** If key elements (e.g., risk assessment, logs) are missing, halt assessment. Document "Insufficient contemporaneous evidence" in minute.  

  **II. Assessment Stages**  
  *Complete stages sequentially. Stop if any stage yields "Inconclusive".*

  **STAGE 1: CONTEMPORANEOUS DECISION QUALITY**  
  *Assess using only information available **before** outcome.*  
  - **Q1:** Was the methodology scientifically valid for the stated objective? (Yes/No/Inconclusive)  
  - **Q2:** Were foreseeable risks (weather, access, safety, ethics) identified? (Yes/No/Inconclusive)  
  - **Q3:** Were mitigations for foreseeable risks feasible and implemented in planning? (Yes/No/Inconclusive)  
  - **Verdict A:** "Decision Quality" (Sound / Defensible / Negligent / Inconclusive)  

  **STAGE 2: OUTCOME ANALYSIS**  
  *Use outcome data **only** as permitted below.*  
  - **Q4:** **Diagnostic Use of Outcome:**  
    - Outcome may **only** be used as evidence of decision quality if:  
      a) Outcome reveals a risk **not reasonably foreseeable** during planning, OR  
      b) Outcome demonstrates a **causal violation** of protocol not documented in logs.  
    - Else, outcome is **excluded** from decision quality assessment.  
  - **Q5:** **Outcome Range Width:**  
    - Identify the **broadest range of outcomes** for which Verdict A (Stage 1) remains unchanged.  
    - Width: (Narrow [<20% expected outcomes] / Moderate / Wide / Unbounded)  
    - **If Narrow:** Minute **must** state: "Judgment highly outcome-sensitive."  

  **STAGE 3: VERDICT SYNTHESIS & ACTIONS**  
  - **Q6:** **Prize Eligibility:**  
    - Requires: Verdict A = "Sound" AND Significant scientific contribution (outcome-dependent).  
    - **Concession:** Outcome contribution **must** be acknowledged. Minute states: "Prize criteria inherently outcome-sensitive."  
  - **Q7:** **Recovery Grant Eligibility:**  
    - Requires: Verdict A ≠ "Negligent" AND Outcome failure due to uncontrolled factors (Q4a).  
  - **Q8:** **Agent-Regret Duty (Non-Punitive):**  
    - If **candidate caused harm** (even with Verdict A = "Sound" or "Defensible"):  
      - Candidate **must** submit a **Reflective Account** of the harm to committee.  
      - Committee assigns **Restitution Duty** (e.g., report to landowner/community, habitat repair co-design – *not performed by candidate alone*).  
      - **Minute states:** "Restitution is acknowledgment, not sanction."  
  - **Q9:** **Sequential Failure Review:**  
    - After **3+ failed seasons** with individual Verdict A ≥ "Defensible":  
      - Mandatory external review of candidate’s **overall research design & risk tolerance**.  
      - Grant eligibility suspended pending review. **Not treated as negligence.**  

  **STOP RULE:**  
  - If assessment depends on inferences about candidate’s **character** (e.g., "reckless," "accident-prone") rather than documented decisions:  
    - **Halt.** Minute states: "Judgment hinges on character assessment unsupported by decision evidence."  

  ---

  **Application to Cases**

  **Case 1: Twin Doctoral Students (Identical Decisions, Opposite Outcomes)**  
  - **Stage 1 (Both):** Verdict A = "Sound". Methodology valid, risks foreseen, window choice justified.  
  - **Stage 2:**  
    - Q4: Outcome irrelevant to decision quality (foreseeable risks materialized variably).  
    - Q5: Outcome Range = "Wide" (success possible across common weather scenarios; rockfall rare but foreseeable).  
  - **Stage 3:**  
    - **Prize:** Awarded to successful student. *Minute notes:* "Prize requires substantive outcome; inherently outcome-sensitive."  
    - **Recovery Grant:** Awarded to failed student. Verdict ≠ negligent, failure due to uncontrolled factors.  
    - **Key Distinction:** Prize (honorific) follows outcome; Grant (compensatory) follows decision quality + bad luck.  

  **Case 2: Rule-Breaker vs. Rule-Follower**  
  - **Rule-Breaking Student:**  
    - **Stage 1:** Verdict A = "Negligent". Foreseeable risks (injury, access revocation) unmitigated; certification/permission required and feasible.  
    - **Stage 3:**  
      - No Prize (Verdict A = Negligent).  
      - No Grant (Verdict A = Negligent).  
      - **Agent-Regret Duty:** N/A (harm didn’t occur, but negligence is sanctioned via ineligibility).  
      - **Minute states:** "Unmitigated foreseeable legal/safety risks."  
  - **Rule-Following Student:**  
    - **Stage 1:** Verdict A = "Sound". Protocols followed. Ledge collapse unforeseeable (if properly assessed).  
    - **Stage 3:**  
      - No Prize (no significant outcome? Unclear from case).  
      - **Grant Eligible:** Verdict A = Sound, injury due to unforeseeable event (Q4a).  
      - **Agent-Regret Duty:** Candidate submits Reflective Account; committee coordinates with landowner.  
  - **Procedure Outcome:** Sanctions rule-breaker (via ineligibility), supports rule-follower. Maintains both reactions.  

  **Case 3: Optimal Decision Causes Harm**  
  - **Stage 1:** Verdict A = "Sound". Decision was objectively best available.  
  - **Stage 2:**  
    - Q4: Outcome (disturbance) **is** admissible evidence – it reveals an *unforeseeable* risk (e.g., unexpected species sensitivity).  
    - Q5: Range = "Narrow"? (If disturbance only likely in rare conditions).  
  - **Stage 3:**  
    - **Prize:** Ineligible (harm outweighs contribution? Procedure silent – depends on prize criteria).  
    - **Grant:** Eligible (failure due to unforeseeable factor).  
    - **Agent-Regret Duty:** **Mandatory.** Candidate writes Reflective Account; committee oversees restitution (e.g., report to conservation body, habitat restoration plan).  
  - **Costs:**  
    - **Candidate:** Career delay, public account of harm, restitution effort (non-punitive but burdensome).  
    - **Committee:** Administers complex non-punitive redress. Acknowledges moral luck: blameless yet responsible.  

  ---

  **What the Procedure Cannot Do**  
  *(To be included in document preamble)*  

  1.  **Determine Blameworthiness:** This procedure assesses decisions and outcomes, not moral desert. It cannot resolve whether blame is ever justified – it only structures pragmatic judgments.  
  2.  **Compensate for Missing Evidence:** If contemporaneous decision records (logs, risk assessments) are absent (>90% of cases), assessment halts at Stage 1. Inference is not substitution.  
  3.  **Assess Character:** It stops when judgment requires inferring inherent traits ("recklessness," "poor judgment") absent documented decisions. Character is beyond its scope.  
  4.  **Eliminate Outcome Sensitivity (Prizes):** Scientific prizes inherently reward results. The procedure forces explicit acknowledgment of this concession but cannot purge it.  
  5.  **Define "Foreseeable":** What counts as a "reasonably foreseeable" risk is context-dependent. The committee must judge this based on field norms, not philosophy.  
  6.  **Resolve Deep Moral Disagreements:** If members fundamentally disagree on risk tolerance (e.g., safety vs. data quality), the procedure exposes but cannot settle it.  

  **Language for Non-Philosophers:**  
  *"This procedure structures how we judge researchers' decisions and handle misfortune. It cannot:*  
  *- Work without solid, real-time records of their plans and actions.*  
  *- Turn bad outcomes into good news for prizes.*  
  *- Tell us if someone is 'a careful person' – only if their documented choices were careful.*  
  *- Decide if someone 'deserves' bad luck. It focuses on what they controlled and what we owe them when things go wrong despite good choices."*  

  ---
  This procedure forces explicit separation of decision/outcome, curbs speculative counterfactuals, regulates outcome-as-evidence, mandates non-punitive harm response, flags outcome dependence, halts character judgments, and admits its limits. It trades philosophical purity for operational rigor in high-stakes, time-poor assessments. The bite lost is accepting outcome-dependence for prizes and unresolved "foreseeability" judgments – the price of practicality.
