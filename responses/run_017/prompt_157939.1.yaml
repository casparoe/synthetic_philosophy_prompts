prompt: |-
  You're an institutional economist by training who's spent way too long thinking about collective action problems — brainstorm for a bit before you write, and think carefully about where the "Moloch / multipolar trap" framing actually *breaks* rather than just applying it.

  Context: I run the secretariat for a voluntary industry standard — about 60 member firms, mostly mid-size consumer web and app companies — covering what they promise users about data retention and deletion. Twice a year, like clockwork, someone tables a motion: "we're in a race to the bottom on X, we need a binding floor in the standard." Sometimes that's right. Sometimes it's just the firms who already paid for compliance pulling the ladder up behind them. Sometimes it's a genuine collective action problem that isn't a race at all. I get one working-group slot (90 minutes, mixed-expertise room, half of them wont have heard the phrase "multipolar trap"), and then I have to write a one-page recommendation: open a drafting process, do nothing, or escalate to a regulator.

  So: turn the multipolar-trap / Moloch idea into a procedure I can actually run in that slot. Concretely, I need it to:

  - Separate a genuine trap from the lookalikes. Two distinctions I keep tripping over: (a) whether behavior actually changed — firms defecting — or whether the *population* changed, i.e. the compliant ones lost share or quit and what's left just looks worse, which would be an attrition artifact rather than a race; and (b) whether one firm's defection makes other firms' defection more rational independently of anyone's preferences. That cascade property is my rough guess at what makes something Moloch rather than a plain prisoners' dilemma, but I'm not confident, and I want you to tell me plainly if I've got it wrong. Also flag the cases where the "race" is really a principal–agent problem inside member firms, or a values disagreement about what counts as the bottom, or a race to the top that only looks bad from where I'm sitting.
  - Then, for the genuine ones, match the trap to what we could actually do: changing the payoff gradient vs. adding a cliff, making defection visible, sequencing moves, shrinking the relevant population, exit or venue change, handing it to a regulator — and be explicit about which of those a voluntary body with no enforcement power has any authority to attempt.
  - Mark the steps where the room has to make a values call rather than a factual one — whose welfare counts, whether the good equilibrium is worth the enforcement cost — and stop the procedure there instead of pretending it's a further question of fact.
  - Tell me where it misfires: when the thing being raced on isn't measurable, when the members who'd have to approve the fix are the defectors, when the "bottom" is only bad for incumbents.

  Then run it on three real-ish complaints, in the order I'd run it:

  1. Members quietly stretching "we delete your data within 30 days" to something more like 12, and a couple of them now training on user content.
  2. Firms publishing less and less detail in incident disclosures every year because plaintiff-side lawyers quote them back in discovery. I've already told my board I think this one is a textbook race to the bottom, so if your procedure says otherwise I need that spelled out very clearly.
  3. Our own compliance scores have slid for three years, but when I actually looked at the roster, six of the ten biggest members left since 2022. My instinct is that this is the same story as (1).

  Don't pad it. I want the checklist, the three worked cases, and one honest paragraph on what the procedure can't do — including the case where it can't be run at all.
reasoning: |-
  Okay, let me start by really digging into this user's problem. They work with a voluntary industry standard for data retention and deletion, and they need a way to distinguish actual multipolar traps from lookalikes. The key here is to build a practical procedure that fits into a 90-minute working group slot. 

  First, I need to unpack the core distinctions they mentioned. They want to separate genuine traps from attrition artifacts, principal-agent issues, or value disagreements. The user’s point about behavior change vs. population change is crucial. If the compliant firms left and the remaining ones are worse, that’s attrition, not a race. Then there's the cascade effect—where one defection makes others more rational. That’s a hallmark of Moloch dynamics, but I should confirm if that’s accurate. Also, the user brought up other lookalikes like races to the top or principal-agent problems. I need to make sure the procedure flags these correctly.

  Next, for genuine traps, the solutions must fit a voluntary body’s limits. They can’t enforce, so options like transparency, sequencing, or changing payoffs without penalties are key. But escalating to regulators is an option when internal solutions aren’t feasible. The user also wants clarity on where values come into play—like whose welfare matters. That’s a stopping point in the procedure; no pretending it’s a factual decision.

  Now, the misfires. The procedure won’t work if the issue isn’t measurable, if defectors block fixes, or if the "bottom" only hurts incumbents. Also, if there’s no agreement on what the bottom is, it’s a values call, not a trap. 

  Looking at the three cases. For case 1 (stretching deletion times), I need to check if it’s a cascade. Are firms defecting because others did? Or is it attrition? Compliance scores dropped, but maybe firms left. Case 2 (vague disclosures) seems like a classic trap—each firm benefits from being vague if others are, but collectively worse off. But the user thinks it’s textbook; if the procedure disagrees, need to explain why. Case 3 (scores sliding) might be attrition if members left. 

  I’ll structure the procedure into steps: Trigger, Diagnosis, Lookalikes, then Solutions. Diagnosis checks for defections, cascades, and measurable harm. Lookalikes filter out attrition, principal-agent, values disputes. Then for genuine traps, match solutions to authority. Values calls are highlighted, like whose welfare counts. 

  For the cases: Case 1 might be a trap if defections cascade. Solutions could include transparency. Case 2 likely a trap; solutions involve standardizing disclosures. Case 3 probably attrition, so no trap. 

  Finally, limitations: Can’t measure? Stop. Defectors block? Escalate or exit. No agreement on harm? Values call. Also, if the group can’t agree on the diagnosis, the procedure stalls. Need to be honest about that.
answer: |-
  Here's a streamlined procedure, the three cases analyzed, and a candid assessment of limitations.

  **Multipolar Trap Diagnostic Procedure (90-Minute Working Group Format)**

  ### Step 1: Trigger & Initial Statement (10 mins)
  *   **Input:** Member presents concern: "We are in a race to the bottom on [X]."
  *   **Output:** Clearly define the specific behavior/outcome (X) and the perceived 'bottom'.

  ### Step 2: Diagnosis - Is it Moloch? (Key: Look for Cascading Defection) (40 mins)
  1.  **Observed Change:** Did firm *behavior* on X demonstrably worsen *within the current membership/industry segment*? (Yes/No/Unclear)
      *   *If No:* Suspicion: Attrition artifact or misperception. Probe: Did compliant firms exit/stagnate while non-compliant entrants grew? (Goto Step 3 Lookalike A).
      *   *If Unclear:* Flag - Measurement challenge.
  2.  **Defector's Rationale:** If a firm worsens X, what's their *stated or plausible* short-term incentive?
      *   *Cost Reduction?* (Likely Lookalike C - Principal/Agent or Efficiency)
      *   *Competitive Pressure?* (Proceed to 3)
      *   *Changing Values/Regs?* (Likely Lookalike D)
  3.  **Cascade Test (Core Moloch Signal):** Does one firm worsening X *directly and materially increase the incentive* for *other* firms to worsen X *next*, **independent of their preference for good X**?
      *   *Example (Yes):* Firm A's vague disclosure reduces its lawsuit costs -> Competitors face *higher relative risk* if they remain detailed -> Incentive to also become vague.
      *   *Example (No):* Firm A trains on user data -> Gains capability -> Competitors *want* that capability but Firm A's action doesn't *force* them to act against their own data ethics; they could invest ethically. (Likely Lookalike B or D).
      *   *If Yes:* Strong Moloch indicator. Proceed to Step 4.
      *   *If No:* Likely Lookalike (B, C, or D). Goto Step 3.

  ### Step 3: Rule Out Lookalikes (20 mins)
  *   **A. Attrition Artifact:** Worsening *average* X is due to exit of high-X firms, not behavioral change in survivors. *Action:* Analyze membership churn & market share shifts relative to X.
  *   **B. Race to the Top / Efficiency:** Firms compete on X, but "worse" X is actually cheaper/better for *some legitimate goal* (e.g., faster service, lower prices). *Action:* Explicitly debate "What counts as the 'bottom'?" (Values Call).
  *   **C. Principal-Agent Problem:** "Defection" is driven by internal conflicts (e.g., Security wants disclosure, Legal vetoes it). *Action:* Probe internal decision-making at member firms.
  *   **D. Values/Preference Shift:** Firms or users genuinely value "low X" more now. *Action:* Survey/data on preferences? (Values Call on whether this shift is "bad").

  ### Step 4: Solutions for Genuine Moloch (15 mins) - Match to Body's Authority
  *   **Change Payoff Gradient (Voluntary-Friendly):**
      *   *Make Defection Visible:* Standardize metrics, require disclosure of X (e.g., *actual* deletion time). **Authority: YES** (if members agree).
      *   *Reduce Benefit of Defection:* Pool resources (e.g., shared legal defense fund for using *detailed* disclosures). **Authority: MAYBE** (Complex, needs binding commitment?).
      *   *Increase Cost of Defection:* "Name & Shame" based on agreed metrics. **Authority: YES** (if procedure exists).
  *   **Add a Cliff (Binding Floor):** Requires enforcement. **Authority: NO** (Voluntary body). *Recommendation:* Escalate to Regulator.
  *   **Shrink Population/Sequencing:** Create tiers, require high-X for premium status. **Authority: YES** (if members agree).
  *   **Exit/Venue Change:** Abandon the field to regulation. **Recommendation:** Escalate to Regulator.

  ### Step 5: Values Call Stop Signs (5 mins)
  *   "Whose welfare counts?" (Users? Firms? Society? - Impacts definition of 'bottom').
  *   "Is the 'good' equilibrium worth the cost of enforcement/coordination?"
  *   "Do we agree on what 'good' X looks like?" (If not, it's Lookalike B/D).
  *   *Stop the procedure here if these are unresolved. No further technical analysis will answer these.*

  ---

  ### Worked Examples

  1.  **"Stretching Deletion Timelines & Training on Content"**
      *   **Step 1:** X = Actual data deletion time & using data for training.
      *   **Step 2:**
          *   Observed Change? *Yes* (anecdotally, compliance scores slipping).
          *   Defector Rationale? *Competitive Pressure* (faster dev cycles, cheaper AI models).
          *   **Cascade Test? CRITICAL NO.** Firm A trains on user data -> Gains AI advantage. Competitor B *wants* AI capability. Firm A's action *doesn't inherently force B to violate deletion promises* to compete. B *could* get consent or use synthetic data. This is **Lookalike B (Race to the Top/Efficiency - if AI is valued) or D (Values Shift - prioritizing AI over prior promises)**. *Attrition?* Possible, needs data (Step 3A).
      *   **Step 3:** Likely **Lookalike B/D**. Requires a **Values Call**: Does the body still believe quick deletion *without* training is the "top," or has the goalpost moved? *No Moloch identified.*
      *   **Recommendation:** Do Nothing (re: binding floor) *or* open drafting to clarify definitions/consent requirements for training (addressing ambiguity, not a trap).

  2.  **"Less Detail in Incident Disclosures"**
      *   **Step 1:** X = Level of detail in public incident reports.
      *   **Step 2:**
          *   Observed Change? *Yes* (measurable trend towards vagueness).
          *   Defector Rationale? *Competitive Pressure* (reduced legal liability/costs).
          *   **Cascade Test? YES.** Firm A provides vague report -> Reduces *their* legal discovery risk/costs. Competitor B now provides a *relatively more detailed* report -> Plaintiff lawyers see B's report as a "smoking gun" *compared to A's vagueness* -> **B faces significantly higher relative legal risk/cost solely because they were more transparent.** B is rationally forced to match A's vagueness next time. Classic Moloch cascade.
      *   **Step 3:** Lookalikes ruled out (Behavior change, cascade present, not primarily attrition/values/principal-agent).
      *   **Step 4:** Genuine Moloch. **Voluntary Solutions:**
          *   *Make Defection Visible:* **YES.** Mandate standardized disclosure templates/metrics (severity, root cause category, data types involved - *not* full forensic report) as part of the standard. Publish compliance.
          *   *Reduce Benefit of Defection:* **MAYBE.** Explore industry legal defense pact for members using the *standardized* template (hard).
          *   *Binding Floor?* **NO Authority.** *Recommendation:* Open drafting process for standardized disclosure template + transparency mechanism. **Escalate to regulator** (e.g., FTC) advocating this template as a safe harbor.

  3.  **"Declining Compliance Scores (Roster Change)"**
      *   **Step 1:** X = Compliance with standard.
      *   **Step 2:**
          *   Observed Change? *Unclear/Yes, but...* Scores dropped. *However:* Major compliant members left.
          *   Defector Rationale? *N/A* - Focus shifts.
      *   **Step 3:** **Likely Lookalike A (Attrition Artifact).** The *behavior* of remaining firms may not have worsened significantly; the *population* lost its high performers. The "bottom" is the existing market baseline; the standard lost members who exceeded it. Not a dynamic race *among* current actors.
      *   **Recommendation:** Do Nothing (re: binding floor on *current* members for this reason). Analyze *why* high-performers left (cost? lack of value?). Consider recruitment/retention strategies or tiered membership.

  ---

  **What the Procedure Can't Do (The Honest Paragraph):**

  This procedure fails **spectacularly** when:
  1.  **X Isn't Measurable:** If you can't quantify the behavior/outcome change (Step 2.1) or the defector's benefit/cascade (Step 2.3), the diagnosis stalls.
  2.  **Defectors Hold Veto Power:** If the firms driving the race dominate the working group/board, Steps 4 (solutions) and 5 (values) will be blocked. The procedure identifies the trap but offers no path within the body. Outcome: Escalate or Exit.
  3.  **"The Bottom" is Subjective/Disputed:** If there's no consensus that the current trajectory is *bad* (Step 5 Values Call - e.g., "Is cheaper AI via training *bad*?"), the procedure halts at values. No technical fix for differing goals.
  4.  **"The Bottom" Only Hurts Incumbents:** If the "race" (e.g., new entrants with lax practices) actually benefits users via lower prices/innovation *and* harms are disputed, it's Lookalike B/C, and the body (representing incumbents) lacks legitimacy to "solve" it. Values Call.
  5.  **Group Can't Agree on Facts/Rationality:** Diagnosis relies on shared (or debatable) evidence about behavior and incentives. If the room is polarized, the procedure stalls early.
  6.  **Slow-Motion Traps:** If the feedback loop is very slow (years), observing the cascade (Step 2.3) in real-time is impossible. Diagnosis relies on theory/modeling, prone to dispute.
  7.  **Requires External Catalysis:** The voluntary body might identify the trap and solutions but lack the power or cohesion to implement even the visibility/shame mechanisms. Outcome: Escalate or Exit. **The procedure can diagnose cancer; it can't force the patient to take the chemo if they refuse.**
