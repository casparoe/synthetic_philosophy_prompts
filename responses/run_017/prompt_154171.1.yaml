answer: |-
  Below is a robust, runnable activity designed to meet your specifications. It uses student-authored rules, role assignment with real (but trivial) stakes, and case variations to organically surface the tension between saving the one vs. the five. The debrief explicitly ties each step to key philosophical moves.

  ---

  ### **Activity Title**: The Rescue Lottery  
  **Duration**: 80 minutes  
  **Materials**:  
  - 14 raffle tickets (coffee vouchers)  
  - 3 sheets of paper & pens (for group rules)  
  - A coin  
  - Whiteboard (for scenario variations)  

  ---

  ### **Phase 1: Rule Creation (15 min)**  
  **Instructions to Students (Read Aloud)**:  
  > *"Split into three groups (4/5/5). Each group will design a single rule for a rescuer facing this scenario:  
  > **'You can save either one stranger or five strangers, but not both. All face identical harm (e.g., death) if not saved. Everything else is equal.'**  
  > Your rule must be a clear, actionable principle (e.g., 'Always save the five'). Write it on paper.  
  > *Crucially: Later, someone will have to read this rule aloud to the person it leaves behind.*"*  

  **TA Notes**:  
  - Circulate to ensure rules are concrete. Common responses:  
    - *"Save the greater number."*  
    - *"Flip a coin to choose which group to save."*  
    - *"Give everyone an equal chance."* (Ambiguity will emerge later)  
  - **Predictable Issue**: Groups may default to "save the five." Push lightly: *"What if the rescuer personally knows the one?*" (Clarify: *"All strangers, no relationships."*)  

  ---

  ### **Phase 2: Role Assignment & Rule Declaration (30 min)**  
  #### **Step 1: Initial Scenario (1 vs. 5, Equal Harm)**  
  **Instructions**:  
  > *"Hand in your group’s rule. I’ll assign roles randomly: one of you will be the ‘Lone Stranger,’ five the ‘Group of Five.’ The rest observe.  
  > Each group will read their rule to the specific person(s) it abandons. Abandoned individuals lose their coffee voucher."*  

  **Procedure**:  
  1. Assign roles for first group’s rule: Pick 6 students (1 Lone + 5 Group).  
  2. **Group 1 reads rule** to the abandoned person (e.g., *"Our rule says we save the five, so you are left behind."*).  
  3. Abandoned person forfeits voucher.  
  4. Repeat for Groups 2 and 3 with new random role assignments.  

  **Staging the Ambiguity**:  
  - If a group’s rule says *"give everyone an equal chance"*:  
    - Ask: *"How do you implement this?"* Force them to pick:  
      - **Option A**: Coin toss between groups (save one group or the other).  
      - **Option B**: Pick one random person to save their entire group.  
    - **Do not explain the difference**. Have them implement their chosen version.  
    - After declaring abandonment, ask the abandoned person: *"Did you have an equal chance?"* (Likely protests will reveal the ambiguity).  

  #### **Step 2: Variations (Stressing the Rules)**  
  Present these *after* rules are declared. Groups must apply their original rule to each.  

  | Variation | Wording (Display/Read Aloud) | Philosophical Stressor |  
  |-----------|------------------------------|------------------------|  
  | **Unequal Magnitudes** | *"Save one from death OR save five from broken arms."* | Does "save more" still apply if harms are incommensurable? |  
  | **Near-Tie** | *"Save one who loses 50 years of life OR save five who each lose 48 years."* | Challenges aggregation: 1x50 vs. 5x48 = 240 total years. |  
  | **Divisible Harm** | *"Distribute a cure: Give full dose to save one, OR split it to save all five (each gets 1/5)."* | Highlights all-or-nothing vs. divisible losses. |  

  **Procedure per Variation**:  
  1. Announce variation.  
  2. Groups consult: *"How does your rule apply here?"*  
  3. Randomly assign victim roles (1 Lone + 5 Group).  
  4. Groups declare rule to the abandoned person.  
  5. Abandoned person loses voucher.  

  **Key Predictable Issues**:  
  - **Groups will apply rules rigidly**: e.g., "Save the five" in "broken arms" abandons one to death. The victim protests: *"But death is worse!"* → Exposes that numbers ≠ moral priority.  
  - **Near-tie confusion**: Students may say, *"Save the one—it’s only 2 years difference!"* or *"Save the five—240 > 50!"* → Surfaces aggregation debates.  
  - **"Equal chance" groups trip harder**: In "divisible harm," Option B (save a random person’s group) may save the one, abandoning five. Observers notice: *"That’s not equal—the one had power over five!"*  

  ---

  ### **Phase 3: Structured Debrief (30 min)**  
  **Link Activity Moments to Philosophical Moves**:  

  | Activity Moment | Philosophical Move | Debrief Question |  
  |-----------------|---------------------|------------------|  
  | Stating rule to abandoned person | Personalization of loss vs. aggregation | *"How did it feel to justify abandoning someone to their face? Did numbers feel less 'real' than the person?"* |  
  | "Equal chance" ambiguity | Difference between individual vs. group fairness | *"Why did the coin toss feel fairer than picking a 'decider'? What does 'equal' mean—equal say, or equal outcome?"* |  
  | Near-tie variation | The sum critique (no one loses 240 years) | *"When we compared 50 vs. 240 years, did anyone experience the total? Or just their own loss?"* |  
  | Unequal magnitudes | Numbers vs. severity | *"Does 'save more' work when harms differ? Is preventing one death worse than preventing five broken arms?"* |  
  | Divisible harm | All-or-nothing framing | *"Could we distribute harm? Or are we forced to choose groups?"*  

  **Core Conclusions to Draw Out**:  
  - **Numbers ≠ moral obligation**: *"You authored rules that 'should' save the five, but when you faced the abandoned person, it felt arbitrary. That’s the pull of the claim: numbers alone don’t create a duty."*  
  - **"May save the one" vs. "must save the five"**: *"Did any rule make saving the one *wrong*? Or was it just *permissible* to save either?"*  
  - **What the activity can’t stage**: The activity **doesn’t prove Taurek’s thesis**—it makes it *intuitive*. You’ll need to argue: *"Taurek defends this: no one loses the ‘total’ harm, so you don’t wrong the five by saving the one. We’ll read that next week."*  

  **Final Setup for Taurek**:  
  > *"Today, you felt why someone might reject saving the greater number. Next week, we’ll read John Taurek’s ‘Should the Numbers Count?’ where he argues exactly this: numbers don’t morally matter. Come ready to discuss whether your experience matches his theory."*  

  ---

  ### **Predicted Issues & Mitigation**  
  | Issue | Mitigation |  
  |-------|------------|  
  | **Groups all pick "save the five"** | Use variations: Near-tie/unequal magnitudes force discomfort. Ask: *"Would you save the one if *you* were the rescuer?"* |  
  | **"Equal chance" groups avoid ambiguity** | If no group picks it, seed it yourself: *"I heard a group say 'equal chance'—let’s test what that means."* Assign Option A/B arbitrarily. |  
  | **Students resist stakes** | Emphasize triviality: *"It’s just a coffee voucher! But imagine it’s life or death—how would that change things?"* |  
  | **Time overrun** | Cut one variation (prioritize unequal magnitudes and near-tie). Use quick hand-raising votes for rule applications. |  

  ### **What the Activity Can’t Stage**  
  - **The positive argument for saving the one**: The activity generates doubt about aggregation but doesn’t justify preferring the one. *You’ll need to argue*: *"Taurek says saving the one isn’t wrong because you don’t harm the five—you just don’t benefit them. They had no entitlement to your help."*  
  - **Comparative harm in ties**: The near-tie variation exposes aggregation but doesn’t resolve whether tiny differences matter. Save this for Taurek’s text.  

  This design forces students to *confront the human cost* of their rules, surfaces ambiguities through structured confusion, and primes them to wrestle with Taurek’s radical claim. The voucher stakes add visceral weight without ethical risk.
