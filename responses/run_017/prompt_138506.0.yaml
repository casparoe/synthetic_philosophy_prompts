prompt: |-
  I am assembling the first session of a graduate seminar on material objects, and before we look at any of the proposed answers I want the class to have the standard of assessment in hand. Please write the specification rather than the survey: what an adequate answer to the special composition question — the question of under what conditions some things compose a further thing — would have to deliver, with the case or consideration that motivates each requirement, and with each requirement marked as non-negotiable or as the preference of one camp.

  Adequacy is relative to a purpose, so let the purpose be mine. I need an answer that could actually be used by a court asked to say whether some artifact is the same one over time: a cathedral rebuilt in different stone after a fire; a ship named in a will whose planks have all since been replaced; a digital object whose every token has been migrated to new hardware. And it should be usable by a field biologist counting organisms in a clonal colony. An answer that is silent or arbitrary in those cases is no use to me, however elegant it is in the armchair.

  The requirements I keep returning to, which you should keep, discard, restate, or expose as confused, are these: it must return a verdict for every plurality, including for pairs of particles in a collider and for the totality of galaxies, and not merely for middle-sized things; it must not double-count causal powers, so that a composite's causal work at a time is never a plain duplicate of its parts' work at that time; it must be temporally local, in that whether the xs compose at t cannot depend on what happens at times remote from t; its verdicts must not shift with the interests of whoever is asking, since a court needs an answer that does not move with the litigants' purposes; it must be fully determinate, returning yes or no for any plurality with no in-principle indeterminacy; and it must be non-vacuous, not a principle that never fires or that merely redescribes the notion of composition it was meant to explain.

  Add whatever I have omitted. Then tell me which of these is a genuine desideratum and which is only a prejudice of a camp — I suspect the determinacy requirement is smuggled in from a taste for tidy semantics. I also suspect that interest-invariance, determinacy, and any graceful treatment of the ship and the clonal colony cannot all be had together; if some subset of the requirements is jointly unsatisfiable, identify it and show why, as that is the part I most want. And name the single requirement that excludes the most candidate answers. You may spend one sentence each on how the view that any things whatsoever compose something, the view that nothing has proper parts, and the view that composition occurs only where the result is alive fare against the two hardest requirements, and no more — I will do the scorecard in seminar.

  Lead with your bottom line in the first sentence: either the requirement that is doing the real work, or the claim that the list cannot be jointly satisfied and where it breaks. Then give the reasoning, with no preamble and no restatement of my question.
reasoning: |-
  Hmm, the user is assembling a graduate seminar on material objects and wants me to specify what makes an answer to the special composition question adequate for their purposes. They need something practical for legal cases involving artifact identity over time and for biological counting in clonal colonies. They've listed several requirements but suspect some might be incompatible or biased.

  The key constraints are: universal verdicts for every plurality (no exceptions), no causal overdetermination (composites must add new causal powers), temporal locality (composition can't depend on remote times), interest-invariance (objective answers for courts), full determinacy (no vagueness), and non-vacuity (substantive principle). The user suspects determinacy might be a philosophical prejudice and worries about tension with handling cases like the Ship of Theseus or clonal colonies.

  I need to analyze which requirements are essential versus optional. Interest-invariance is non-negotiable for legal use - courts can't have shifting answers based on perspective. Temporal locality also seems core because courts assess identity at specific times. The causal powers requirement prevents double-counting in physical explanations. 

  But determinacy is tricky. For clonal colonies or borderline artifacts, strict yes/no may force arbitrary boundaries. Yet the user needs clear counts for biology and legal rulings. This reveals a conflict: interest-invariance demands objectivity, while real-world cases often involve gradience. 

  The toughest exclusion is universal application - it rules out moderate answers that only apply to ordinary objects. Non-vacuity eliminates trivial answers like "composition occurs when it does." 

  For the quick scorecard: Universalism (everything composes) fails causal powers by allowing pointless composites; nihilism (no composites) fails universal application by denying ordinary objects; organicism (only alive) fails both application and biology cases. 

  The core tension is between determinacy/interest-invariance and graceful handling of vague cases. Courts want precision, but biology and artifacts often resist it. Any solution must either impose sharp cuts (risking arbitrariness) or acknowledge context-dependence (undermining objectivity). This is where the requirements fracture.
answer: |-
  **The requirement of interest-invariance and determinacy jointly conflict with handling the Ship of Theseus and clonal colonies gracefully, as these cases inherently involve vagueness or context-dependence that resist precise, objective verdicts.**

  **Requirements for an Adequate Answer:**
  1.  **Universality (Non-negotiable):** Must deliver a verdict (yes/no) for *every* conceivable plurality of objects (e.g., two particles in a collider, all galaxies, scattered atoms). *Motivation:* Courts and biologists face arbitrary-seeming collections (like specific planks vs. the whole ship, or individual clones vs. the colony); an answer silent on such pluralities is useless for adjudicating identity or counting.
  2.  **Non-Redundant Causal Powers (Non-negotiable):** Must ensure that a composite object's causal powers at time *t* are not *identical* to the sum of the causal powers of its parts *simpliciter* at *t* (avoiding systematic overdetermination). *Motivation:* To prevent explanatory profligacy; if composites are causally redundant, positing them violates parsimony without benefit for scientific or legal explanation (e.g., explaining why a ship sinks or a colony spreads).
  3.  **Temporal Locality (Non-negotiable):** Whether the *xs* compose at time *t* must depend *only* on facts about the *xs* and their relations to each other and their immediate environment at *t*, not on facts about remote past or future times. *Motivation:* Courts assess identity *at specific times* (e.g., when the will was read, when the fire happened); verdicts cannot hinge on future replacements or past states irrelevant to the current configuration.
  4.  **Interest-Invariance (Non-negotiable):** Verdicts must be objective facts, independent of human purposes, concepts, or interests. *Motivation:* Courts require a single, authoritative answer binding on all parties; a "correct" count of organisms in biology should not depend on the counter's research goals.
  5.  **Determinacy (Camp Preference - Mereological Universalism):** Must yield a sharp yes/no for every case, with no ontological vagueness or in-principle indeterminacy. *Motivation:* Driven by desires for tidy metaphysical and semantic theories, and the intuition that existence is all-or-nothing. *However*, this clashes with the phenomena: the Ship (is it the original after gradual replacement? after reassembly from saved planks?) and clonal colonies (where does one organism end and another begin in a seamless mat?) exhibit *paradigm cases of vagueness*. Imposing determinacy here forces arbitrary precisification, violating the need for a "graceful" treatment usable in the real world. Interest-invariance demands objectivity, but determinacy demands *precise* objectivity where the world may be fuzzy.
  6.  **Non-Vacuity (Non-negotiable):** Must provide a substantive, non-circular principle specifying *when* composition occurs, not merely restate the concept or be trivially true/false for all cases. *Motivation:* A principle like "composition occurs when it does" or "never occurs" fails to explain or guide judgment in novel cases like digital migration or colony counting.

  **Omissions Added:**
  7.  **Compatibility with Persistence (Non-negotiable):** The answer must integrate coherently with a plausible account of how objects persist through time and change of parts, especially given the core cases (cathedral, ship, digital object). *Motivation:* The legal cases are fundamentally about *diachronic identity*; an account of composition that makes persistence inexplicable or absurd is useless.
  8.  **Applicability to Emergent Layers (Camp Preference - Non-Reductionism):** Should allow that composites can belong to distinct ontological levels (e.g., biological, artefactual) with properties not reducible to microphysical properties. *Motivation:* Biology requires counting distinct *organisms*, not just particles; courts recognize *ships* and *cathedrals* as entities distinct from their matter. (This relates to, but is distinct from, Non-Redundant Causal Powers).

  **Key Conflicts:**
  *   **Interest-Invariance + Determinacy vs. Graceful Handling (Ship/Colony):** This is the core fracture. Interest-invariance demands a single, objective answer. Determinacy demands a sharp answer. But the Ship and Colony cases are intrinsically vague or perspectival. A graceful solution *usable* in practice likely requires acknowledging this indeterminacy (violating Determinacy) or incorporating context (violating Interest-Invariance). Universalism satisfies both but fails Non-Redundant Causal Powers and Gracefulness for arbitrary collections. Nihilism satisfies both but fails Universality and Gracefulness for ordinary objects. Only heavily moderated (and often interest-relative) accounts handle the Ship/Colony well, but they violate Interest-Invariance.
  *   **Universality + Non-Redundant Causal Powers:** Universality (especially paired with Determinacy) pushes towards Universalism. But Universalism blatantly violates Non-Redundant Causal Powers for most arbitrary fusions. Avoiding this requires restrictive principles, which struggle with Universality.

  **The Most Excluding Requirement:**
  **Universality.** It immediately rules out moderate restrictive answers (e.g., contact, cohesion, life), which are silent or negative for "unnatural" collections like particles in a collider or scattered galaxies, making them useless for the court cases involving arbitrary subsets or the biologist counting specific units within a colony.

  **One-Sentence Scorecard on Hardest Requirements (Universality & Non-Redundant Causal Powers):**
  *   **Universalism:** Satisfies Universality but catastrophically violates Non-Redundant Causal Powers (every arbitrary fusion is causally redundant).
  *   **Nihilism:** Violates Universality (denies composites exist, hence no verdict for ship/colony/cathedral *as composites*) and struggles to explain macro causal powers without composites.
  *   **Organicism:** Violates Universality (no verdict for non-living composites like ships/particles) and fails Non-Redundant Causal Powers if non-living composites are denied but seem causally efficacious (e.g., a rock breaking a window).
