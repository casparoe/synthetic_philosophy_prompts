answer: |-
  Below is a flow chart outlining key philosophical positions on the unity of consciousness in split-brain cases, based on your specifications. The chart starts from the agreed empirical commitments (commissurotomy patients, left-hemisphere speech/confabulation) and branches via student-answerable questions. Positions are described by their claims about subjects and streams, with no named philosophers. Awkward implications are noted for each leaf. British English is used throughout.

  ### Flow Chart: Split-Brain Cases & Unity of Consciousness  
  **Start**: Commissurotomy patients exhibit:  
  - Each hemisphere receives information the other doesn’t.  
  - Left hemisphere (LH) dominates speech; confabulates reasons for right-hemisphere (RH) actions.  

  ---

  #### **Q1: Bandwidth Dial**:  
  *Imagine the callosal link is a tunable "bandwidth dial" (inter-hemispheric traffic from normal → zero → normal). Is there a sharp threshold where one subject becomes two?*  
  - **Yes (sharp threshold exists)**:  
    - *Implication for "just above" vs. "just below" threshold*: Just above = one subject; just below = two subjects.  
    → Proceed to Q2.  
  - **No (no sharp threshold; change is gradual)**:  
    → Proceed to Q3.  

  #### **Q2: Atypical Patient (conflicting speech)**:  
  *In a split-brain patient where both hemispheres speak and give confident, conflicting answers (e.g., "yes/no" to taking a job), is this:  
  A) Two subjects disagreeing?  
  B) One subject "of two minds"?*  
  - **A) Two subjects disagreeing**:  
    → **Leaf: Two subjects, two streams**  
      - *Position*: Severing the corpus callosum creates two distinct subjects of experience, each with its own stream.  
      - *Awkward implication*: Must explain why the two subjects don't notice each other (e.g., no "inner conflict" reported).  
  - **B) One subject "of two minds"**:  
    → **Leaf: One subject, two streams**  
      - *Position*: A single subject has two separate, parallel streams of consciousness (e.g., divided attitudes in one mind).  
      - *Awkward implication*: Conflicts without irrationality—how can one subject simultaneously hold "yes" and "no" without incoherence?  

  #### **Q3 (from Q1=No): Unity Gradual?**  
  *Can the unity of consciousness vary by degrees (e.g., "more unified" at high bandwidth, "less" at low)?*  
  - **Yes (unity is graded)**:  
    → **Leaf: Unity as a matter of degree**  
      - *Position*: There is one subject with partially unified consciousness; disunity increases gradually as bandwidth decreases.  
      - *Awkward implication*: No clear metric for "degree of unity"—how low must unity be to approach two subjects?  
  - **No (unity is all-or-nothing)**:  
    → Proceed to Q4.  

  #### **Q4 (from Q3=No): One Subject in Typical Patient?**  
  *In the standard split-brain patient (LH speaks, RH does not), is there one subject of experience?*  
  - **Yes (one subject)**:  
    → Proceed to Q5.  
  - **No (not one subject)**:  
    → **Leaf: Indeterminate subjects/streams**  
      - *Position*: No fact of the matter about whether there is one subject or two (or one stream or two).  
      - *Awkward implication*: Evades empirical details—e.g., doesn’t explain LH confabulation or RH autonomy.  

  #### **Q5 (from Q4=Yes): One Stream in Typical Patient?**  
  *Despite the split, is there a single stream of consciousness?*  
  - **Yes (one stream)**:  
    → **Leaf: One subject, single stream (information merely inaccessible)**  
      - *Position*: One subject with a unified stream; the LH cannot access RH content, but consciousness remains singular.  
      - *Awkward implication*: Struggles to explain independent RH actions (e.g., RH selecting an object unseen by LH).  
  - **No (not one stream)**:  
    → **Leaf: One subject, two streams**  
      - *Position*: A single subject has two distinct streams of consciousness (as in Q2B, but derived separately).  
      - *Awkward implication*: Same as Q2B—how does one subject "have" two streams without splitting into two?  

  ---

  ### Notes on Ambiguity & Tree Logic  
  - **Incoherent combination**: Q1=Yes (sharp threshold) + Q2=B (one subject) is incoherent. If a sharp threshold creates two subjects at zero bandwidth, the atypical patient (at zero bandwidth) cannot be one subject.  
  - **Unattractive but coherent**: Q1=No (no threshold) + Q4=No (not one subject) → **Leaf: Two subjects, two streams** (via Q3=No). This is rarely held because gradual change + two subjects implies an arbitrary "switch" without a threshold.  
  - **Guessing nodes**:  
    - **Q1 (Bandwidth Dial)**: Students may guess—no empirical data on "tunable" callosa; intuition-driven.  
    - **Q5 (One stream?)**: Students may guess—no direct access to streams; relies on interpreting behaviour.  
  - **Ambiguity persists**: The "one subject, two streams" leaf (from Q2B or Q5) is ambiguous—does the subject unify the streams retrospectively? Cases underdetermine this.  
  - **Unpried leaves**: The tree cannot distinguish "one subject, two streams" (from Q2B) from "one subject, two streams" (from Q5). Both share the same awkward implication.  
  - **Unexplored combinations**: None—all coherent paths are covered. "Unity as a matter of degree" is the only position fully embracing gradualism.  

  ---  
  This chart isolates core tensions: the bandwidth dial tests for thresholds, while the atypical patient forces clarity on subjecthood. The leaves capture all major positions, with their costs highlighted. Ambiguity arises chiefly from the unobservability of streams and the lack of real "tunable" cases.
