prompt: |-
  I'm in a small reading group on decision theory — an economist who thinks these cases are all obvious, a philosopher who keeps telling me my verdicts are mutually inconsistent, and me, increasingly unsure. I've started writing down my gut answer to each case separately, because every general principle I try on for size seems to break somewhere. Could you try to extract the principle that best fits the pattern below, stated precisely enough that I could apply it myself to a case I haven't seen, and tell me plainly which of my verdicts it cannot keep?

  (a) Newcomb's problem with opaque boxes and a predictor with a long track record, say 99 per cent: I take only the big box.
  (b) Same, except both boxes are transparent and I can see the million sitting in the big box: I still take only the big box and leave the thousand behind.
  (c) Counterfactual mugging: a flawless predictor tossed a fair coin; if it landed heads, it handed me ten thousand dollars, but only on the condition that it had predicted I would hand over a hundred dollars if asked in the tails case. The coin came up tails, and here it is asking. I refuse — though I also think I would happily have installed a binding commitment device before the toss had one been offered, and it unsettles me that those two answers don't fit together.
  (d) Hitchhiker: a driver who reads faces flawlessly drives me across the desert to town, having seen in advance that I would pay him a hundred dollars on arrival. I made no promise, there is no reputational consequence, and the town is full of strangers who will never hear of it. I pay.
  (e) XOR blackmail: a flawless predictor sends me a letter demanding a thousand dollars, and the letter explains that it was sent if and only if exactly one of two things is true — either I have a rare condition that will cost me a hundred thousand dollars to treat whatever I do, or the predictor foresaw that I would pay. So if the letter arrives, I have the condition exactly if I am the sort of person who refuses; I feel the pull to pay in order to make the bad news not be true, and I still refuse.
  (f) Control: exactly like (c), except the coin has not been tossed yet and will be tossed after I answer, with the ten thousand arriving if it lands heads and I paid. I pay.
  (g) One our group made up: like (c), except the predictor never simulated me — it simulated my identical twin, raised apart, whom I have never met and who has never heard of any of this, and the ten thousand in the heads branch depended on what she would have said. I find myself inclined to pay, less firmly than in (f) but far more than in (c); if the person simulated is merely a stranger who happens to reason roughly as I do, my inclination drops to about nothing.

  My own stab at a rule: cooperate with a predictor only when what it predicted is the very choice now in front of me, and when the reward lands either in the branch I am actually in or in one I cannot yet rule out — and never when the predictor's rule rewards me for a disposition that costs me. But that rule seems to say the same thing about (c) and (g), and my gut doesn't, and I can't tell whether (c) and (d) really differ in anything besides the fact that in (d) I already got the ride.

  Please give me: one or two sentences stating the principle at the top; then a compact table with a row for each of (a) through (g), showing my verdict, the principle's verdict, and a note wherever the two come apart; then what the principle says about two cases I haven't listed — first, the predictor tosses the coin, it comes up heads, it hands me the ten thousand, and then, unusually, asks for the hundred anyway; second, the same as (c) but with a predictor who is right only 80 per cent of the time, where I especially want to know whether the principle yields a threshold accuracy at which paying becomes right and where that threshold falls; then one line on which of my verdicts I should retract; and a final line naming the view if it has a name, without letting the label stand in for the content. Under 700 words in total.
reasoning: |-
  Hmm, the user is part of a decision theory reading group with an economist and a philosopher, and they're struggling to reconcile their intuitive answers to various thought experiments. They've shared their gut reactions to cases (a) through (g), and want me to extract a consistent principle that fits most of these verdicts. They also want me to test this principle on new cases and point out where it conflicts with their intuitions.

  Looking at their stated intuitions:
  - In (a) Newcomb with opaque boxes, they take only the big box (one-box)
  - In (b) Newcomb with transparent boxes, they still one-box
  - In (c) Counterfactual mugging (tails), they refuse to pay
  - In (d) Hitchhiker, they pay
  - In (e) XOR blackmail, they refuse to pay
  - In (f) Control (pre-toss counterfactual mugging), they pay
  - In (g) Twin version of counterfactual mugging, they're inclined to pay

  Their own attempted rule focuses on cooperating only when the prediction is about the current choice and when rewards are in possible branches. But this doesn't explain why (c) and (g) feel different to them.

  I notice a pattern: In cases where they cooperate (b, d, f, g), the predictor is either about to observe or has just observed their actual choice (b, d) or the choice hasn't been made yet (f, g). In cases where they defect (c, e), the prediction is already fixed about a counterfactual version of themselves. The exception is (a) where they one-box despite no observation - but this might be because the predictor's decision is based on simulating their current choice.

  The key distinction seems to be whether the predictor's action depends on what your actual self does now (or is doing now) versus what a counterfactual version would do. In (d) Hitchhiker, the driver observed their actual paying disposition before giving the ride. In (c) Counterfactual mugging, the prediction about tails-response was fixed before the coin toss and doesn't involve their actual choice.

  I'll formulate this as: "Cooperate with predictors when their action depends on your actual present choice (via simulation or observation), not when it depends on a counterfactual version's choice." This fits:
  - (a) Predictor simulated current choice → cooperate (one-box)
  - (b) Predictor simulated current choice → cooperate (one-box)
  - (c) Depends on counterfactual choice → defect (refuse)
  - (d) Driver observed actual disposition → cooperate (pay)
  - (e) Depends on counterfactual refusal → defect (refuse)
  - (f) Depends on actual present choice → cooperate (pay)
  - (g) Depends on twin's actual choice → cooperate (pay)

  For the new cases:
  1. Heads world mugging: Predictor already paid based on counterfactual prediction → defect (refuse)
  2. 80% predictor: The principle requires actual dependence, so even 100% accuracy wouldn't change the defect verdict in counterfactual cases like (c)

  The conflict is with their (c) intuition - the principle says refusing is correct, so they should retract any discomfort about not having pre-committed. This view resembles "timeless decision theory" but emphasizes the actual/counterfactual distinction.

  I'll present this as: a clear principle statement, a compact table showing alignment, analysis of new cases, and the required retraction - all under 700 words.
answer: |-
  **Principle:** Cooperate with predictors (pay/one-box) iff their action depends *directly* on your actual present choice being simulated or observed; defect (refuse/two-box) if it depends on a counterfactual or dispositional property fixed earlier.

  | Case | Your Verdict | Principle's Verdict | Note |
  |------|--------------|---------------------|------|
  | (a)  | One-box      | One-box            | Matches: depends on simulating actual choice now |
  | (b)  | One-box      | One-box            | Matches: still simulates actual choice now |
  | (c)  | Refuse       | Refuse             | Matches: depends on counterfactual choice fixed pre-toss |
  | (d)  | Pay          | Pay                | Matches: driver observed actual disposition (pre-choice observation of present self) |
  | (e)  | Refuse       | Refuse             | Matches: depends on disposition (counterfactual refusal) |
  | (f)  | Pay          | Pay                | Matches: depends on actual choice now (pre-toss commitment) |
  | (g)  | Pay (strong) | Pay                | Matches: depends on twin's *actual* choice (simulated present action) |

  **New Cases:**  
  1. *Heads-world mugging (post-payment ask):* Principle says **refuse**. The predictor’s past action (giving $10k) depended on a counterfactual prediction about tails-you, not your actual choice now.  
  2. *80% predictor in (c):* Principle says **refuse** regardless of accuracy. Dependence on counterfactual choice (fixed earlier) doesn’t shift to actual choice, so no threshold applies—accuracy is irrelevant.

  **Retract:** Your unease in (c) about pre-commitment conflicting with refusal. The principle affirms refusal is consistent; pre-commitment would change the dependence to actual choice (like (f)), so no inconsistency.  

  **View:** Causal-decision-theory-adjacent, emphasizing *actual* choice dependence over modal correlations. (Not standard CDT/EDT/TDT).  

  (299 words)
