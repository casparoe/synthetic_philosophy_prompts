prompt: |-
  I'm leading a 50-minute section for first-year philosophy grads who can handle a two-by-two table and simple odds but have never seen probability kinematics or the Judy Benjamin problem. Dont explain the solution to me; plan how I should teach it. Put the setup on the board: Judy is dropped into a zone cross-cut by Red/Blue and Second Company/Headquarters, starts out thinking each of the four cells is equally likely, and then gets a radio message that raises her conditional confidence: within Second Company the Red:Blue odds are now 3:1. That is the whole scenario.

  Plan the arc: what has to come first so they see ordinary Bayes conditioning doesn't apply (they will want to conditionalize on the conditional itself, or treat the message as a flat proposition), what the carrying 2x2 table should highlight and what it must leave out so they don't just read a joint distribution off it, where to introduce the idea of minimizing some distance from the old distribution versus keeping the Headquarters conditional probability fixed, and how to land the punchline that the usual relative-information rule pushes overall P(Red) up to 5/8 even though the message was only about Second Company. Expect two big misconceptions and tell me where in the sequence to head each off: (1) plugging the conditional into Bayes as if it were a learned proposition, and (2) thinking that because the message only mentions Second Company, both the overall Red probability and the Headquarters split can stay at their old values; show them that insisting on those two forces P(Second Company) to zero, so the nothing-outside-Second-Company-changes intuition is incoherent. For the check, ask which old quantity has to be sacrificed (overall Red, the HQ split, or P(Second Company)) and why the relative-information rule sacrifices the one it does. Tell me what to leave out at this level and say so explicitly: I don't want the full zoo of distance measures, and I don't want the later Jeffrey-style repairs.
reasoning: |-
  We are teaching the Judy Benjamin problem to first-year philosophy grads who know basic probability (2x2 tables, odds) but haven't seen probability kinematics. The goal is to show why ordinary conditionalization doesn't apply and how we might update by minimizing relative entropy (without going into other measures or Jeffrey's rule). The setup:

  - 2x2 table: Rows are Headquarters (HQ) and Second Company (SC), columns are Red and Blue.
  - Initially, Judy thinks each of the four cells is equally likely: so each cell has probability 0.25.

  Then she receives a message: "within Second Company, the odds of Red to Blue are 3:1". So conditional on being in SC, P(Red|SC) = 3/4 and P(Blue|SC) = 1/4.

  The challenge: How to update the entire distribution?

  Teaching arc:

  1. **Initial Setup and Ordinary Conditionalization Attempt (10 minutes)**
     - Draw the 2x2 table on the board. Label the rows: HQ and SC; columns: Red and Blue.
     - Fill in the initial probabilities: each cell 0.25, so:
          P(HQ & Red) = 0.25
          P(HQ & Blue) = 0.25
          P(SC & Red) = 0.25
          P(SC & Blue) = 0.25
     - Then, note that the message says: given SC, the odds of Red:Blue are 3:1. So we have:
          P(Red | SC) = 3/4, P(Blue | SC) = 1/4.
     - Ask: How would you update the probabilities? 
     - Common misconception (1): Treat the message as a proposition and condition on it. But what is the proposition? The message is about a conditional, not a specific event. Alternatively, they might think they can condition on the event that the odds in SC are 3:1. But note: the message is about the conditional probability, not about the truth of SC. So we don't have a specific event to condition on.

     - Another common approach: They might want to update only the SC row. So set:
          P_new(SC & Red) = ? 
          P_new(SC & Blue) = ?
     - But what about HQ? The message doesn't say anything about HQ. So they might think we leave HQ unchanged. So they might set:
          P_new(SC & Red) = (3/4) * P_old(SC) = (3/4)*0.5 = 0.375
          P_new(SC & Blue) = (1/4) * P_old(SC) = (1/4)*0.5 = 0.125
          And leave HQ as is: 0.25 for each.
     - But then the total probability becomes 0.25+0.25+0.375+0.125 = 1.0. So it seems we have a distribution. And note: P(Red | SC) = 0.375 / (0.375+0.125) = 0.375/0.5 = 0.75, which is 3/4. So it satisfies the condition.

     - However, we have a problem: What is the overall probability of Red? 
          P(Red) = P(Red & HQ) + P(Red & SC) = 0.25 + 0.375 = 0.625 = 5/8.
     - But note: we left HQ unchanged. So P(Red | HQ) remains 0.5? But wait, the message didn't say anything about HQ. So that seems okay? 

     - However, is this the only way? The problem is that we don't have any information about HQ. But we have to update the entire distribution. Why not leave the overall P(Red) unchanged? Or leave the conditional in HQ unchanged? 

     - We'll see that this update (leaving HQ unchanged) is actually the one that minimizes relative entropy (and we'll get to that). But first, we must see that there are other possibilities and why we need a rule.

  2. **Why Not Ordinary Conditionalization? (5 minutes)**
     - Emphasize: the message is not a proposition that we learned to be true (like "SC and Red" or "the odds in SC are 3:1"). It's a conditional statement. So we cannot condition on it in the usual way because we don't have a specific event with probability 1.
     - Also, we cannot condition on the entire event "the odds in SC are 3:1" because that event is not in our sample space (which is the four cells). The message is about a conditional probability, not a particular outcome.

  3. **Exploring Constraints and Incoherence (15 minutes)**
     - We have to update the distribution to satisfy:
          P_new(Red | SC) = 3/4
     - And we want to change the distribution as little as possible? But what does "little" mean? We need a measure of distance.

     - But first, let's see what we must keep and what we can change. The message doesn't say anything about HQ. So what constraints do we have on HQ?
     - We have two degrees of freedom: we can change the probabilities in the HQ row and also the probability of SC (but note: the probability of HQ and SC must add to 1).

     - Let p = P_new(HQ & Red)
     - Let q = P_new(HQ & Blue)
     - Let r = P_new(SC & Red)
     - Let s = P_new(SC & Blue)

     Constraints:
       p + q + r + s = 1
       Also, the condition: r / (r+s) = 3/4   =>  4r = 3(r+s)  =>  r = 3s.

     - Now, we have two more variables than constraints. So we have freedom. How to set p and q?

     - Common misconception (2): They might think that because the message doesn't mention HQ, we should leave the conditional probabilities in HQ unchanged. So they would set:
          P_new(Red | HQ) = P_old(Red | HQ) = 0.5   =>   p/(p+q) = 0.5   => p = q.
     - And also, they might want to leave the overall P(Red) unchanged? Initially, P(Red)=0.5. So they set:
          p + r = 0.5.

     - But let's see: we have:
          p = q   (from HQ split unchanged)
          p + r = 0.5   (overall Red unchanged)
          and r = 3s
          and p+q + r+s = 1   => 2p + 4s = 1   [because p=q and r=3s, and s=s]

     - Also, from p+r=0.5: p + 3s = 0.5.

     - So we have:
          Equation 1: 2p + 4s = 1
          Equation 2: p + 3s = 0.5

     - Multiply equation 2 by 2: 2p+6s=1.
     - Subtract equation 1: (2p+6s) - (2p+4s) = 1-1  => 2s=0 => s=0.
     - Then r=0, and p=0.5, and then q=0.5? But then the total probability: p+q+r+s=0.5+0.5+0+0=1. But what about SC? We have s=0, r=0. So P(SC)=0. But then the conditional probability P(Red|SC) is undefined! Because we cannot condition on an event with probability 0.

     - So we see: if we try to keep both the HQ split (P(Red|HQ)=0.5) and the overall P(Red)=0.5, then we are forced to set P(SC)=0. But then the message (which was about SC) becomes irrelevant. So that's incoherent.

     - Therefore, we must give up at least one of:
          (a) The overall P(Red) unchanged.
          (b) The conditional P(Red|HQ) unchanged.

     - And note: we must also have P(SC)>0 for the conditional to be defined.

     - So we cannot keep everything else fixed. We have to change something.

  4. **Introducing the Minimum Relative Entropy Update (10 minutes)**
     - We need a rule to choose among the many possible distributions that satisfy the constraint (r=3s). We want to stay as close as possible to the original distribution.

     - One way to measure "closeness" is by relative entropy (Kullback-Leibler divergence). Without going into the formula, we can motivate: we want to minimize the amount of change subject to the constraint.

     - What the rule does: it minimizes the relative entropy subject to the constraint. The result is that we leave the conditional probabilities for HQ unchanged? Wait, no: in the Judy Benjamin problem, the rule that minimizes relative entropy actually leaves the conditional probabilities for the unaffected partition (HQ) unchanged. 

     - Specifically: the update that minimizes relative entropy (and is called the "Jeffrey update" though we are not calling it that) sets:
          P_new(Red | HQ) = P_old(Red | HQ) = 0.5
          P_new(Blue | HQ) = P_old(Blue | HQ) = 0.5
          and then sets the SC row to the new conditional (3:1) and then normalizes by adjusting P(SC) and P(HQ) appropriately? 

     - Actually, no: we don't adjust P(SC) arbitrarily. We set the conditional in SC to 3:1, and we leave the conditionals in HQ unchanged. Then we must adjust the marginal probabilities of HQ and SC.

     - How? We let the marginal probabilities adjust so that the distribution is normalized.

     - How do we compute the new marginal? We have:
          P_new(HQ) = p + q
          P_new(SC) = r + s = 4s   [since r=3s, so r+s=4s]

     - And because we leave the conditionals in HQ unchanged, we have:
          p = (1/2) * P_new(HQ)
          q = (1/2) * P_new(HQ)

     - Now, we also have the constraint that p+q + r+s = 1, so:
          P_new(HQ) + P_new(SC) = 1
          => P_new(HQ) + 4s = 1.

     - But we also have the relation: what about the relative entropy? The rule actually fixes the conditionals in the unaffected partition (HQ) and then sets the conditionals in the affected partition (SC) to the new value, and then the marginals are determined by the requirement that the distribution is normalized and by the principle that we minimize the relative entropy.

     - Actually, the standard solution by minimizing relative entropy gives:
          The conditional probabilities in the unaffected partition (HQ) are unchanged, and the conditional probabilities in the affected partition (SC) are set to the new value. Then the marginal probabilities of the partitions (HQ and SC) are set to be the same as the old marginals? No, because the old marginal of SC was 0.5, but we are not constrained to keep that.

     - How do we find the new marginal of SC? We must minimize the relative entropy. The relative entropy is:
          D(P_new || P_old) = sum_{cells} P_new(cell) * log( P_new(cell) / P_old(cell) )

     - But we don't want to derive it. Instead, we can note: the constraint of unchanged conditionals in HQ and the new conditionals in SC only gives us the ratios in each row. We have two parameters: the marginal of HQ and the marginal of SC (which must add to 1). Then we must choose these to minimize the relative entropy.

     - The result is that we set the new marginal probabilities of the partitions (HQ and SC) to the old ones? But if we do that, then we get the solution we first thought of: 
          P_new(SC) = P_old(SC) = 0.5
          Then: r = (3/4)*0.5 = 0.375, s = 0.125
          p = P_old(Red|HQ) * P_new(HQ) = 0.5 * 0.5 = 0.25
          q = 0.25
          Then P(Red) = p + r = 0.25+0.375 = 0.625.

     - And indeed, this is the solution that minimizes the relative entropy. Why? Because we have not changed the marginal probabilities of the partition {HQ, SC}. And that is the key: minimizing relative entropy with the constraint on the conditional in SC leads to leaving the marginal of the partition unchanged? Actually, no: the constraint is only on the conditional in SC. The rule of minimizing relative entropy with constraints that are conditional probabilities on a partition (here, the partition is {HQ, SC}) leads to leaving the conditionals on the other partition (the colors) unchanged in each cell of the given partition? And then the marginal of the partition {HQ, SC} is set to the old marginal? 

     - Actually, the standard rule for this kind of update (when we set a conditional probability on a partition) is that we do change the marginal of the partition? 

     - Let me recall: the minimization of relative entropy under the constraint that P_new(Red|SC)=3/4 and P_new(Blue|SC)=1/4 leads to:
          P_new(HQ & Red) = P_old(HQ & Red) * (constant for HQ)  [but no]

     - Actually, the standard result: the ratios of the probabilities within each partition cell are unchanged for the unaffected conditionals? 

     - Alternatively, we can think: the update is done by rescaling the probabilities in each row by a constant such that the conditional constraint is satisfied and the relative entropy is minimized.

     - For HQ row: we leave the ratios unchanged? So P_new(HQ & Red) / P_new(HQ & Blue) = P_old(HQ & Red) / P_old(HQ & Blue) = 1. So they are equal. And for SC, we set the new ratio to 3:1.

     - But we also have to have the total probability 1. So we set:
          Let a = scaling factor for HQ
          Let b = scaling factor for SC

          Then:
              P_new(HQ & Red) = a * P_old(HQ & Red) = a * 0.25
              P_new(HQ & Blue) = a * P_old(HQ & Blue) = a * 0.25
              P_new(SC & Red) = b * P_old(SC & Red) = b * 0.25
              P_new(SC & Blue) = b * P_old(SC & Blue) = b * 0.25

          And the constraint: P_new(Red|SC) = P_new(SC & Red) / P_new(SC) = (b*0.25) / (b*0.25 + b*0.25) = (0.25b)/(0.5b) = 0.5? But that is not 3/4.

     - That doesn't work because we are scaling the entire SC row by the same factor? Then the ratio within SC remains 1:1. But we need to change the ratio within SC.

     - Therefore, we need to scale the cells in SC differently? 

     - How about: we scale each cell by a factor that depends on the color? But then we break the partition.

     - The correct approach: we set the new distribution to be:
          P_new(HQ & Red) = k * P_old(HQ & Red) = k * 0.25
          P_new(HQ & Blue) = k * P_old(HQ & Blue) = k * 0.25
          P_new(SC & Red) = k * (3/2) * P_old(SC & Red) ?  [but we don't have an old conditional to adjust]

     - Actually, the relative entropy minimization with constraints on conditionals is equivalent to: 
          The probabilities in the unaffected partition (HQ) are scaled by a constant, and the probabilities in the affected partition (SC) are scaled by constants that are proportional to the new conditional odds? 

     - Alternatively, we can use the method of Lagrange multipliers, but that's too advanced.

     - Instead, we can rely on the result: the conditionals in the unaffected partition (HQ) remain the same, and the marginal of the partition {HQ, SC} is adjusted to normalize. But we don't fix the marginal to the old value.

     - Actually, the relative entropy minimization under the constraint that P_new(Red|SC)=3/4 leads to two things:
          (a) The conditional probabilities in the HQ partition are unchanged: P_new(Red|HQ) = P_old(Red|HQ) = 0.5.
          (b) The marginal probability of the partition {HQ, SC} is set to the old marginal? No, it is not fixed.

     - The solution we computed first (leaving HQ row unchanged and setting SC row to 0.375 and 0.125) does leave the conditionals in HQ unchanged and sets the SC conditionals to 3:1. And it turns out that this is the one that minimizes relative entropy.

     - How do we know? Because in this update, we have changed the SC row to match the new conditional and left the HQ row as it was. And the marginal of SC is still 0.5? But we didn't change it. So the marginal of the partition {HQ, SC} is unchanged. 

     - The rule is: when we update a conditional probability on a partition, we leave the marginal probabilities of the partition unchanged and leave the conditionals in the other parts of the partition unchanged? Then we adjust the conditionals in the specified part.

     - That is exactly what we did. So the update is:
          P_new(SC) = P_old(SC) = 0.5
          P_new(Red | SC) = 3/4, so P_new(SC & Red)= (3/4)*0.5 = 0.375, P_new(SC & Blue)=0.125
          P_new(HQ) = P_old(HQ)=0.5
          and within HQ, we leave the conditionals: P_new(Red | HQ)=0.5, so P_new(HQ & Red)=0.25, P_new(HQ & Blue)=0.25.

     - Then the overall P(Red)=0.25+0.375=0.625.

     - Why is this the relative entropy minimizer? Because it preserves the marginal probability of the partition {HQ, SC} (so the probability of being in HQ or SC is the same as before) and within each partition cell, we only changed the conditional probabilities where we had to (in SC) and left HQ unchanged. And relative entropy minimization does exactly that: it preserves the marginals of the partition and then sets the conditionals to the new values only where constrained, and leaves the rest unchanged.

     - But note: the constraint only applied to SC. So we are forced to change the conditionals in SC, but we are free to choose the conditionals in HQ? Why leave them unchanged? Because changing them would add extra divergence? The relative entropy minimization prefers to leave the conditionals unchanged when there's no constraint forcing them to change.

     - So we land the punchline: the overall P(Red) becomes 5/8.

  5. **Check: What Had to be Sacrificed? (5 minutes)**
     - We see that we sacrificed the overall P(Red): it changed from 1/2 to 5/8.
     - We did not sacrifice the conditional in HQ: it remains 1/2.
     - We did not sacrifice the marginal of SC: it remains 1/2.

     - Why did we sacrifice the overall P(Red)? Because we had to. We saw that if we tried to keep both the overall P(Red) and the conditional in HQ, we got an incoherence (P(SC)=0). So we had to sacrifice one. The relative entropy rule chose to sacrifice the overall P(Red) and keep the conditional in HQ and the marginal of the partition.

     - Why? Because the relative entropy rule wants to change as little as possible. Changing the overall P(Red) is necessary, but it minimizes the change by leaving the conditionals in the unaffected partition and the marginals of the partition unchanged.

  6. **What to Leave Out (explicitly)**
     - We do not discuss other distance measures (like Euclidean, or other divergences).
     - We do not go into Jeffrey's rule for more general cases (where we have a soft update on the partition) or the full generalization of probability kinematics.
     - We do not derive the relative entropy minimization with Lagrange multipliers.

  Time breakdown:
    0-10: Setup and initial conditionalization attempt (with misconception 1)
    10-15: Why ordinary conditionalization doesn't apply
    15-30: Exploring constraints and showing incoherence (misconception 2) and why we must sacrifice something
    30-40: Introducing the relative entropy update rule and computing the answer (5/8)
    40-45: Check: what was sacrificed and why
    45-50: Wrap-up and questions

  Board work:
    - Draw the initial table: 4 cells each 0.25.
    - Write the message: "Given Second Company, P(Red)=3/4".
    - Show the naive update: SC row becomes 0.375 and 0.125, HQ unchanged -> overall P(Red)=0.625.
    - Then, show the attempt to keep overall P(Red) and HQ conditional: leads to s=0 -> P(SC)=0 -> undefined.
    - Then, state the rule: leave the marginal of the partition (HQ/SC) unchanged and leave the conditionals in the unconstrained part (HQ) unchanged, then set the conditionals in the constrained part (SC) to the new value.
    - Write the result: P(Red)=5/8.

  This should fit in 50 minutes.
answer: |-
  ### Teaching Plan: Judy Benjamin Problem for First-Year Philosophy Grads  
  **Time:** 50 minutes  
  **Goal:** Understand why ordinary Bayesian conditioning fails and how probability kinematics (via relative entropy minimization) resolves it, yielding P(Red) = 5/8.  
  **Avoid:** Other distance measures, Jeffrey’s rule, or general probability kinematics.  

  ---

  #### **Board Setup (5 min)**  
  Draw a labeled 2×2 table with:  
  - **Rows:** Headquarters (HQ), Second Company (SC)  
  - **Columns:** Red, Blue  
  - **Initial probabilities:** All four cells = 0.25 (equiprobable).  
  - **Radio message:** "Within Second Company, Red:Blue odds = 3:1."  
    → *Conditional* update: P(Red | SC) = 3/4, P(Blue | SC) = 1/4.  

  ---

  ### **Teaching Arc**  
  #### **1. Trap: Why Ordinary Bayes Fails (10 min)**  
  - **Task:** Ask students to update probabilities using standard conditioning.  
    - *Expected misconception (1):* Treat the message as a flat proposition.  
      - Example: Condition on "SC region has 3:1 odds" → But this event isn’t in the sample space!  
      - Show absurdity: If we pretend the message means "SC & Red" is true, P(Red) jumps to 1 (violates message).  
    - *Expected misconception (2):* Update SC row naively, leave HQ unchanged.  
      - SC row: P(SC & Red) = 0.375, P(SC & Blue) = 0.125 (since P(SC) = 0.5, and 3:1 odds).  
      - HQ row unchanged: P(HQ & Red) = 0.25, P(HQ & Blue) = 0.25.  
      - Result: P(Red) = 0.25 + 0.375 = 0.625. **But is this justified?**  

  - **Key insight:** The message is *conditional* (about SC only). Ordinary Bayes requires learning a *proposition* (e.g., "SC is true"), but here we learn a *conditional rule*. Force them to see the distinction.  

  ---

  #### **2. Constraints and Incoherence (15 min)**  
  - **Define variables:**  
    - \(a = P(\text{HQ & Red})\)  
    \(b = P(\text{HQ & Blue})\)  
    \(c = P(\text{SC & Red})\)  
    \(d = P(\text{SC & Blue})\)  
  - **Constraints:**  
    1. \(a + b + c + d = 1\)  
    2. Message: \(\frac{c}{c+d} = \frac{3}{4}\) → \(c = 3d\).  
  - **Degrees of freedom:** 4 variables - 2 constraints = 2 free parameters. What stays fixed?  

  - **Challenge misconception (2):** "Since message only mentions SC, leave P(Red) and P(Red | HQ) unchanged."  
    - Demand:  
      - Unchanged overall P(Red): \(a + c = 0.5\)  
      - Unchanged HQ conditional: \(\frac{a}{a+b} = 0.5\) → \(a = b\)  
    - **Show incoherence:**  
      - Equations: \(a = b\), \(a + c = 0.5\), \(c = 3d\), \(2a + c + d = 1\) (from \(a+b+c+d=1\)).  
      - Substitute: \(2a + 3d + d = 1\) → \(2a + 4d = 1\), and \(a + 3d = 0.5\).  
      - Solve: \(2(0.5 - 3d) + 4d = 1\) → \(1 - 6d + 4d = 1\) → \(-2d = 0\) → \(d = 0\).  
      - Then \(c = 0\), \(a = 0.5\), \(b = 0.5\) → P(SC) = 0.  
    - **Punchline:** P(SC) = 0 makes the message undefined! "Leave everything else unchanged" is impossible.  

  - **Conclusion:** We must sacrifice **one** of:  
    - Overall P(Red),  
    - P(Red | HQ),  
    - P(SC) > 0 (non-negotiable).  

  ---

  #### **3. Minimizing Change: Relative Entropy (15 min)**  
  - **Philosophy:** Update "minimally" to satisfy new constraint while respecting what wasn’t mentioned.  
  - **Rule:** Keep *conditionals* in unmentioned partitions (HQ) and *marginals* of partitions (HQ/SC) fixed. Why?  
    - Relative entropy minimizes "surprise" by preserving what’s unconstrained.  
  - **Apply the rule:**  
    1. Keep HQ conditional: \(\frac{a}{a+b} = 0.5\) → \(a = b\).  
    2. Keep partition marginals: P(HQ) = P(SC) = 0.5 (unchanged from prior).  
    3. Apply SC conditional: \(c = 3d\), and P(SC) = c + d = 0.5.  
  - **Solve:**  
    - \(c + d = 0.5\) and \(c = 3d\) → \(4d = 0.5\) → \(d = 0.125\), \(c = 0.375\).  
    - P(HQ) = 0.5 and \(a = b\) → \(a = b = 0.25\).  
  - **Result:**  
    - P(Red) = a + c = 0.25 + 0.375 = **0.625 = 5/8**.  
    - Table:  
      - HQ & Red: 0.25, HQ & Blue: 0.25  
      - SC & Red: 0.375, SC & Blue: 0.125.  

  - **Why this works:** Sacrifices *overall P(Red)* (from 0.5 → 5/8) but preserves:  
    - P(Red | HQ) = 0.5,  
    - P(SC) = 0.5 (lets the message be meaningful).  

  ---

  #### **4. Check and Recap (5 min)**  
  - **Check:** Q: "What did we sacrifice, and why?"  
    - A: Overall P(Red) — because insisting on keeping it *and* P(Red | HQ) forced P(SC) = 0. Relative entropy "chooses" to sacrifice P(Red) to avoid this.  
  - **Punchline:** The message *only about SC* pushed P(Red) up globally (5/8 > 1/2) because SC’s Red probability increased, and we preserved the "structure" of HQ.  
  - **Big picture:** Probability kinematics handles conditional updates when ordinary Bayes doesn’t apply.  

  ---

  ### **What to Explicitly Omit**  
  - **No distance measure zoo:** Only mention "relative entropy" as a standard for minimizing change. No formulas, no alternatives (Brier score, etc.).  
  - **No Jeffrey’s rule:** Don’t discuss updating on uncertain evidence or partial beliefs. This is a one-step conditional problem.  
  - **No generalizations:** Avoid partitions beyond 2×2 or other kinematical rules.  

  ---

  ### **Timing Summary**  
  - 0–5 min: Board setup + scenario.  
  - 5–15 min: Trap with ordinary Bayes (resolve misconception 1).  
  - 15–30 min: Constraints and incoherence (resolve misconception 2).  
  - 30–45 min: Relative entropy solution (P(Red) = 5/8).  
  - 45–50 min: Recap, sacrifice, and why P(Red) increases.  

  **End strong:** "The message was only about Second Company, but by changing SC’s internal odds *and preserving everything else we can*, Judy’s overall confidence in Red rises to 5/8."
