  4. Least-adversarial-prior rule.

   The rule: find p* in C that minimizes the expected utility the agent could obtain by best-responding to it. That is, p* is the solution to:

     p* = argmin_{p in C} [ max_{plan} E_p[ utility of the plan] ]

   Then, the agent acts as an expected utility maximizer with p*, updating by conditionalization.

   We assume p* is unique.

   How it compares with maximin:

   - Dynamic consistency: Since it uses Bayesian updating, it is dynamically consistent.

   - Can it select a plan whose worst-case across C is worse than the worst-case of the maximin plan?
     Yes, because the maximin plan is chosen to maximize the worst-case utility, while the least-adversarial-prior rule chooses a prior p* and then best-responds to it. The worst-case utility of the chosen plan might be lower than that of the maximin plan.

     Example: in the example above with two distributions P1 and P2 and Plan Alpha and Plan Zeta.

     In the example where C={P1, P2} with:
          P1: s1=0.8, s2=0.1, s3=0.1, s4=0
          P2: s1=0, s2=0.1, s3=0.1, s4=0.8

     The maximin plan (by (G)) is Plan Alpha with min utility 0.8.

     What is p*? 
          If the agent best-responds to P1: 
             Without test: 
                  Choose A: utility= P1(D)=0.9 -> EU=0.9
                  Choose B: utility=1-0.9=0.1
                  Best: A -> 0.9
             With test and then best-responding at each node:
                  At T+: 
                      P1(T+): 0.9, conditional: s1:0.8/0.9, s3:0.1/0.9 -> EU(A)=8/9, EU(B)=1/9 -> choose A.
                  At T-: 
                      P1(T-):0.1, conditional: s2:1, s4:0 -> EU(A)=1, EU(B)=0 -> choose A.
                  So the best plan with test is to always choose A, and the expected utility: 
                      s1:1, s2:1, s3:0, s4:0 -> EU=0.8+0.1=0.9
                  So with test: 0.9, without test: 0.9 -> the value is 0.9.

          For P2:
             Without test: 
                  Choose A: P2(D)=0.1 -> 0.1
                  Choose B: 0.9
                  Best: B -> 0.9
             With test:
                  At T+: 
                      P2(T+)=0.1, conditional: s1:0, s3:1 -> EU(A)=0, EU(B)=1 -> choose B.
                  At T-: 
                      P2(T-)=0.9, conditional: s2:0.1/0.9=1/9, s4:0.8/0.9=8/9 -> EU(A)=1/9, EU(B)=8/9 -> choose B.
                  EU for this plan: 
                      s1:0, s2:0, s3:1, s4:1 -> EU=0.1+0.8=0.9
                  So with test: 0.9, without test:0.9.

          Therefore, for both P1 and P2, the best the agent can do is 0.9.
          So p* is either (because both give 0.9) and we can take either. 

          Then, the agent will use, say, P1 and then best-respond: always choose A.

          The worst-case utility of this plan (always A) over C:
              Under P1: 0.9
              Under P2: 0.1
              Min is 0.1, which is worse than the maximin plan (Plan Alpha) which has min 0.8.

   - Does it at least guarantee that the selected plan is undominated relative to C?
     Undominated: there is no other plan that is at least as good in every distribution in C and strictly better in at least one.

     In the example, the plan "always A" is dominated by Plan Alpha because:
          For P1: always A: 0.9, Plan Alpha: 0.8 -> not better.
          For P2: always A: 0.1, Plan Alpha: 0.8 -> strictly better in P2.
          So not dominated? Because in P1 it is worse? 
          Actually, Plan Alpha is not dominating always A because in P1, always A is better than Plan Alpha (0.9 vs 0.8).

     But is always A dominated by some other plan? Consider Plan Alpha: 
          P1: 0.8, P2:0.8.
          always A: P1:0.9, P2:0.1.
          So Plan Alpha is not as good as always A in P1, but better in P2.

     Consider a plan that does: without test, choose A. But we are comparing plans that include the test or not? 

     In this rule, we are to find the best response to p* including the choice of whether to test or not and then actions.

     In this case, the agent might choose to not test and choose A if using P1, which gives 0.9, or not test and choose B if using P2, which gives 0.9. 

     The plan of not testing and choosing A has utility in P1:0.9, in P2:0.1.

     The plan of not testing and choosing B has utility in P1:0.1, in P2:0.9.

     The plan of testing and then always A has utility in P1:0.9, in P2:0.1.

     None of these are dominated by Plan Alpha? Because in P1, Plan Alpha gives 0.8, while not testing and choosing A gives 0.9.

     So the plan selected by the least-adversarial-prior rule (say, not test and choose A) is not dominated by Plan Alpha.

     However, note that there is a plan that does better in both: Plan Alpha gives 0.8 in both, while not testing and choose A gives 0.9 in P1 and 0.1 in P2. So they are not comparable.

     But is there a plan that dominates not test and choose A? It would have to get at least 0.9 in P1 and at least 0.1 in P2, and more in at least one. Plan Alpha gets 0.8 in both, so it does not dominate. 

     In fact, not test and choose A is not dominated by any plan? Because in P1, 0.9 is the best possible (since P1(D)=0.9, and if you always choose A you get 0.9, and you can't get more). In P2, you might get more than 0.1, but any plan that does better in P2 might do worse in P1.

     So it is undominated.

   - Does it matter if the agent can randomize? 
     Randomization might help in the worst-case for the maximin rule, but in this rule, since it is expected utility, randomizing over plans is the same as a mixed plan. But in the least-adversarial-prior rule, the agent is an expected utility maximizer with respect to p*, so randomizing might not help (by the standard argument).

   - Objection: p* depends on the available options. That is, if the set of available options changes, then the value of the decision problem under a given distribution p might change, and hence p* might change. This is different from the set C which is fixed by the evidence.

     This is an objection because it means that the agent's beliefs (represented by p*) depend on the menu of options, which violates the idea that beliefs should be independent of the available actions.

   - Comparison with minimax regret: 
     Minimax regret is another decision rule under imprecise probabilities. It minimizes the maximum regret over the set of distributions.

     The least-adversarial-prior rule is more computationally tractable and is dynamically consistent, but it may choose a plan that is not minimax optimal (as we've seen) and may have high regret.

     In the example above, the regret of a plan is defined as the difference between the utility of the best action in the true state and the utility of the chosen action, then maximized over states, then expectations and then minimized over plans. 

     This is complex, but intuitively, the least-adversarial-prior rule might not minimize the maximum regret.

  Summary:

  We have provided an example where (G) and (S) differ, explained the mechanics, and addressed the questions.
answer: |-
  ### 1. Example of Disagreement Between (G) and (S)

  **State Space and Credal Set**:  
  Consider a finite state space with four states, defined by the presence of a disease (D or ¬D) and a test result (T+ or T-):  
  - s1: D ∧ T+  
  - s2: D ∧ T-  
  - s3: ¬D ∧ T+  
  - s4: ¬D ∧ T-  

  Utilities depend on the true state and action (treat, A; not treat, B):  
  - Utility = 1 if (D and A) or (¬D and B)  
  - Utility = 0 otherwise  

  The convex credal set \(C\) is the convex hull of two distributions:  
  - **P₁**: P₁(s1) = 0.8, P₁(s2) = 0.1, P₁(s3) = 0.1, P₁(s4) = 0.0  
  - **P₂**: P₂(s1) = 0.0, P₂(s2) = 0.1, P₂(s3) = 0.1, P₂(s4) = 0.8  

  **Plan Alpha**: Run the test, then:  
  - If T+, choose A  
  - If T-, choose B  

  **Evaluation under (G) - Ex Ante**:  
  - For any \(P \in C\), compute the expected utility of Alpha:  
    \[
    \text{EU}(\text{Alpha}) = P(\text{s1}) \cdot 1 + P(\text{s4}) \cdot 1
    \]  
  - P₁: EU = 0.8 + 0.0 = 0.8  
  - P₂: EU = 0.0 + 0.8 = 0.8  
  - Minimum over \(C\): \(\min(0.8, 0.8) = 0.8\)  

  **Evaluation under (S) - Sequential**:  
  - **At T+ node**:  
    - Updated set \(C|T+\): Convex hull of conditionals:  
      - P₁|T+: (s1: 8/9, s3: 1/9) → EU of A = 8/9  
      - P₂|T+: (s1: 0, s3: 1) → EU of A = 0  
    - Worst-case EU of A over \(C|T+\): \(\min(\text{EU}) = 0\) (from P₂|T+)  
  - **At T- node**:  
    - Updated set \(C|T-\): Convex hull of conditionals:  
      - P₁|T-: (s2: 1, s4: 0) → EU of B = 0 (since B gives utility 1 only for s4)  
      - P₂|T-: (s2: 1/9, s4: 8/9) → EU of B = 8/9  
    - Worst-case EU of B over \(C|T-\): \(\min(\text{EU}) = 0\) (from P₁|T-)  
  - **Back to root**: For any \(P \in C\), the expected utility is:  
    \[
    V(P) = P(T+) \cdot 0 + P(T-) \cdot 0 = 0
    \]  
  - Minimum over \(C\): \(\min(0, 0) = 0\)  

  **Disagreement and Adversarial Distributions**:  
  - **(G)** yields 0.8, while **(S)** yields 0.  
  - Under **(G)**, the adversary (minimizing distribution) is the same for the entire tree. Both P₁ and P₂ give EU=0.8 for Alpha, so the minimum is 0.8.  
  - Under **(S)**, the adversary can use different distributions in different branches:  
    - At T+, P₂|T+ (EU=0) is adversarial.  
    - At T-, P₁|T- (EU=0) is adversarial.  
  - Since P₁ and P₂ are "bad" in complementary branches, **(S)** allows the adversary to exploit this, resulting in a lower valuation (0).  

  **Plan Recommendation**:  
  - **(G)** recommends Alpha (value 0.8) over no-test options (min EU=0.1).  
  - **(S)** values Alpha at 0 and recommends a no-test option (e.g., always A or B, min EU=0.1).  
  - Thus, the procedures recommend different plans.  

  ---

  ### 2. Structural Condition for Agreement

  **Condition**: \(C\) must be **rectangular** (specifically, *rectangular with respect to the information partition*). Formally:  
  \[
  C = \left\{ P : P(\cdot \mid E) \in C_E \text{ for all events } E, \text{ and } P(E) \in \mathcal{D}_E \right\}
  \]  
  where \(C_E\) is a fixed set of conditionals for event \(E\), and \(\mathcal{D}_E\) is a set of probabilities over events.  

  **Intuition**: Rectangularity ensures that:  
  - The conditional sets \(C_E\) are "independent" of the marginal probabilities of events.  
  - Updating \(C\) to \(C|E\) simply gives \(C_E\), without tying conditionals to specific marginals.  

  **What It Prevents**:  
  - Rectangularity forbids correlations between prior beliefs (e.g., prevalence of disease) and likelihoods (e.g., test reliability). For example:  
    - It cannot express that a high prevalence (P(D) large) is coupled with low test accuracy (high false negatives).  
    - In repeated trials, it cannot link uncertainty about bias across trials.  

  **Acceptable Cost?**  
  - **No**, in many contexts. For instance:  
    - Medical diagnosis: Prevalence and test reliability are often epidemiologically linked.  
    - Learning: Uncertainty about a coin's bias affects both prior and likelihood in repeated flips.  
    - Rectangularity oversimplifies imprecision, ignoring dependencies between parameters.  

  ---

  ### 3. Nature of the Gap: Dynamic Consistency

  **Failure of Dynamic Consistency**:  
  - After observing T+, the agent using **(G)** has committed to Alpha (choose A at T+).  
  - However, at T+, the updated set \(C|T+\) includes distributions where the worst-case EU of A is 0 (e.g., P₂|T+).  
  - The agent can improve the worst-case by deviating:  
    - Choosing B at T+ gives min EU = 1/9 > 0.  
  - Similarly, at T-, choosing A gives min EU = 1/9 > 0.  
  - Thus, the agent has **reason to depart** from Alpha after seeing the test result.  

  **Objection and Commitment**:  
  - This is an objection to **(G)**: It enforces a plan that is not sequentially rational (suboptimal at decision nodes).  
  - **(S)** avoids this by construction, as it optimizes at each node given local information.  
  - The agent has **reason to purchase commitment**:  
    - If she can commit to Alpha ex ante, she guarantees min EU=0.8.  
    - Without commitment, she deviates to a plan with min EU=0.2 ex ante (or 1/9 sequentially), which is worse.  

  **Consequentialism**:  
  - The gap is **not** a failure of consequentialism (evaluation depends only on future paths). Both rules are consequentialist.  
  - It is a **dynamic inconsistency** in **(G)**: Ex ante optimality clashes with ex post rationality.  

  ---

  ### 4. Least-Adversarial-Prior Rule (LAP)

  **Rule**:  
  1. Find \(p^* \in C\) that minimizes the max expected utility:  
     \[
     p^* = \underset{p \in C}{\text{argmin}} \left( \max_{\text{plans}} \mathbb{E}_p[\text{utility}] \right)
     \]  
  2. Act as a Bayesian expected utility maximizer with prior \(p^*\), updating by conditioning.  

  **Comparison with Maximin**:  
  - **Dynamic Consistency**:  
    - **Yes**, by construction. Bayesian updating ensures consistency.  
  - **Worst-Case Guarantee**:  
    - **Worse than maximin in general**. LAP selects a plan optimized for \(p^*\), which may have poor worst-case over \(C\).  
    - *Example*: In §1’s \(C\), LAP selects "no test, choose A" (optimized for P₁), with EU=0.9 under P₁ but 0.1 under P₂. Worst-case (0.1) is worse than maximin’s 0.8 for Alpha.  
  - **Undominated Plans?**  
    - **Not guaranteed**. In §1, "no test, choose A" is undominated, but consider:  
      - States: s1 (D), s2 (¬D)  
      - \(C = \{ P_1: (0.9, 0.1), P_2: (0.1, 0.9) \}\)  
      - Options: A (utility 1 if D, 0 if ¬D), B (utility 0 if D, 1 if ¬D).  
      - LAP chooses A (for \(p^* = P_1\)), with EU=0.1 under P₂.  
      - But plan "choose B" dominates A under P₂ and is identical under P₁.  
      - Thus, LAP can choose dominated plans.  
  - **Randomization**:  
    - **Matters for LAP (not maximin)**. If the agent can randomize, LAP may yield a different \(p^*\) (since max EU includes mixed plans). Maximin evaluates deterministic plans only (as in your setup).  
  - **Objection: Prior Depends on Options**:  
    - **Critical flaw**. \(p^*\) minimizes the max EU over *available plans*. If new plans are added, \(p^*\) can change.  
    - *Example*: Adding a superior plan might shift \(p^*\), altering beliefs. This violates the principle that beliefs (C) should depend only on evidence, not menu choices.  

  **Comparison with Minimax Regret**:  
  - **Similarity**: Both are tractable and dynamically consistent.  
  - **Difference**:  
    - Minimax regret minimizes the maximum *regret* (loss relative to best action in each state).  
    - LAP minimizes the best *performance* a Bayesian could achieve.  
    - LAP is more pessimistic (focuses on low max EU), while regret focuses on opportunity cost.  
  - **Example**: In §1, minimax regret might favor Alpha (constant EU=0.8, regret 0.2) over LAP’s choice (regret up to 0.8).  

  ---

  ### Summary of Mechanics
  - **(G) vs (S)**: Disagreement arises because **(S)** permits state-dependent adversaries, while **(G)** forces a global adversary. Rectangularity of \(C\) prevents this gap but is restrictive.  
  - **Dynamic Consistency**: **(S)** is consistent; **(G)** is not, leading to ex post deviations.  
  - **LAP Rule**: Dynamically consistent but may choose suboptimal or dominated plans; prior depends on options.  
  - **Core Tension**: Maximin **(G)** ensures ex ante security but violates dynamic rationality; **(S)** and LAP ensure dynamic coherence but weaken ex ante guarantees.  

  This structural analysis highlights trade-offs without appealing to extraneous literature.
