  2. Structural condition on C for the two to coincide.

   They will coincide if the set C is such that the updated sets are "consistent" in the sense that the worst-case distribution is the same for all events. A sufficient condition is that C is a set of distributions that are all conditional on the evidence from a single prior. In particular, if C is the set of distributions obtained by conditioning a single prior on different likelihoods? 

   Actually, a common condition in the literature is that C is closed under conditionalization and also that the set is a "rectangular" or that it has the property of "time consistency". 

   Specifically, if C is such that for every event E, the conditional distributions given E are exactly the set obtained by conditioning the distributions in C on E, and moreover, the minimizer at the root and at the leaves can be chosen in a coordinated way. 

   A strong condition is that C is a simplex (only one distribution) then obviously they agree.

   Another condition is that C is defined by a constant prior and varying likelihoods, but in a way that the prior is fixed. However, in our set-up, the prior is also varying.

   The condition might be that the set C has a common prior, i.e., all distributions in C have the same prior distribution over the state of the world ( disease or not) and only vary in the likelihoods. But in our example above, the prior also varies.

   Alternatively, if the set C is such that the conditional distributions given any evidence are the same for all distributions in C that give positive probability to that evidence, then the updated set would be a singleton and then (S) would use the same distribution for all branches.

   But that is very restrictive.

   A more general condition is that the set C is rectangular in the sense of Eichberger and Kelsey: 

     C = { P : P(.|E) in C_E for every E in a partition }

   but with some consistency. In our case, the partition is {T+, T-}.

   However, the rectangularity condition often requires that the conditional sets C_E are fixed and then the set C is the set of distributions that for each E, have P(.|E) in C_E and have the probability of E in some set. Then, at the root, the worst-case distribution choose the worst-case probability for the events and then the worst-case conditional for each event.

   But in our (S) procedure, we are not using rectangularity. 

   A sufficient condition for (G) and (S) to agree is that the set C is such that for any act, the minimum over C of the expected utility is the same as the minimum obtained by first taking the minimum in each conditional and then taking the minimum over C for the expectation of these minima. 

   This is true if the set C is rectangular in the following sense: there exists a distribution P in C that achieves the minimum in the exante evaluation and also, for each E, the conditional distribution P(.|E) achieves the minimum in the conditional problem given E. 

   But this may not hold in general.

   A condition that ensures this is that the set C is a product of sets on the conditioning events, but that is rectangularity.

   So rectangularity: 
     C = { P : P(E) \in D_E and for each E, P(.|E) in C_E }
     where D_E is a set of probability distributions on the events, and C_E is a set of conditional distributions given E.

   Then, under rectangularity, the minimax expected utility can be computed by first taking the minimum over C_E for each E and then taking the minimum over D_E for the D part.

   This is essentially what (S) does.

   But in (G), we minimize over the entire set C, which under rectangularity is the same as minimize over the product structure.

   So under rectangularity, (G) and (S) should agree.

   In our first example that worked (with P1 and P2 with s1:0.8, s2:0.1, s3:0.1, s4:0 for P1 and s1:0, s2:0.1, s3:0.1, s4:0.8 for P2), the set C is not rectangular because the conditional distributions given T+ and given T- are not freely variable. In particular, the probability of T+ and the conditional given T+ are tied together by the distribution.

   Acceptable cost: rectangularity prevents the agent from expressing correlation between the prior and the likelihoods. In the medical example, it would require that the agent's uncertainty about the prior probability of the disease is independent of her uncertainty about the test's false positive rate. This may not be realistic. It also might prevent the agent from expressing uncertainty that spans both prior and likelihood.

