  **MEMORANDUM**  
  To: Elections and Referenda Committee  
  From: Graduate Representative, Political Theory PhD  
  Date: March 25, 2024  
  Subject: Electorate Definition & Participation Policy for Climate Fee Referendum  

  ### I. Recommended Eligibility Rule  
  **All currently enrolled students (undergraduate/graduate), active faculty, and staff employed ≥0.5 FTE for ≥6 months**, with the following clarifications:  
  - **Included**: Dual-enrolled minors (Group 1), international students (Group 2), and persons on approved leave (Group 4).  
  - **Excluded**: Non-citizen residents of university housing (Group 3), emeritus faculty, visiting scholars, and contractors.  
  - **Threshold rationale**:  
    - Age: No exclusion for 16–17-year-olds; they are bound identically to peers.  
    - Duration: The 6-month employment/staff threshold excludes transient affiliations.  
    - "Currently enrolled/active" excludes those not actively subject to *current* fee obligations (e.g., Group 3 pays rent but not fees).  
  - **Under-threshold handling**: Non-qualifying individuals (e.g., short-term staff, new hires <6 months) may not vote but retain fee obligations if otherwise applicable.  

  ### II. Recommended Participation Policy  
  **Adopt automatic registration with formal abstention** (Option b):  
  - All eligible voters are auto-registered via enrollment/payroll data.  
  - Non-voting is recorded as an explicit abstention.  
  - Avoids compulsory penalties while fixing the denominator (addressing legitimacy concerns about low turnout).  

  ### III. Connection Between Eligibility and Participation  
  The same principle grounds both: **binding authority justifies inclusion; enduring membership justifies obligation**.  
  - **Eligibility**: Voting rights extend to those *currently and directly subject* to the fee and campus rules (Groups 1, 2, 4). Exclusion applies where ties are temporary or indirect (Group 3).  
  - **Participation**: Compulsion (Option c) implies a duty to the *enduring community*—but our electorate includes transient members (e.g., graduating seniors). Automatic registration respects their stake without imposing communal duties beyond their temporal scope. Abstentions provide data to assess mandate strength.  

  ### IV. Engagement with the Duration/Weighted-Vote Proposal  
  **The case for duration-weighting**:  
  - Professor X’s "duration principle" correctly identifies that a first-year student bears longer-term consequences than a graduating senior. Weighting votes by expected remaining years could better reflect differential stakes.  
  - **Strength**: It resolves the turnout problem (if votes are weighted, low participation matters less) and acknowledges that not all subjection is equal.  

  **Reasons to reject it**:  
  1. **Administrative infeasibility**: Calculating "expected remaining years" requires speculative data (attrition rates, degree completion timelines) and invites disputes.  
  2. **Equality of standing**: Weighting votes formally ranks members (e.g., a first-year = 4 votes, senior = 0.25 votes), undermining equal membership. This risks factionalization and delegitimizes the outcome.  
  3. **The lost insight**: Duration weighting highlights that *low turnout distorts mandate legitimacy*. But automatic abstentions (our recommendation) address this by making non-participation visible—enabling post-referendum analysis of whether the "yes" vote represents a majority of *affected stakeholders*, not just voters.  

  **Cost of rejection**: We forgo theoretical precision but gain a procedurally stable, defensible system. The "real worry" of duration proponents—that unweighted votes let short-timers decide long-term burdens—is mitigated by excluding non-members (Group 3) and including all fee-bound populations.  

  ### V. Timeline  
  - **March 28**: Committee vote on rules.  
  - **April 1–5**: Draft referendum language for admin review.  
  - **April 8–12**: Voter registration finalized (auto-enroll eligible population).  
  - **April 15–19**: Referendum voting period.  
  - **Post-referendum review**: Assess turnout/abstention data by May 3. If <25% of eligible voters participate *or* abstentions exceed 50%, propose automatic compulsion for future votes.  

  ### VI. Key Constraints Addressed  
  - **Trustee justification**: "The electorate comprises all currently enrolled students and employees subject to the fee and campus rules, excluding short-term or non-fee-paying residents."  
  - **Avoiding philosophy**: Rationale centers on *who pays the fee* and *who is bound by university rules*—not moral personhood.  

  ### Counterargument Section  
  **Strongest objection to our recommendation**:  
  > "Automatic abstention fails to solve low turnout. If only 15% vote (with 85% abstaining), the result is still unrepresentative—and the committee has avoided its duty to ensure robust participation. Compulsion is necessary to validate the binding nature of the fee."  

  **Response**: Low turnout is a symptom of voter apathy, not eligibility flaws. Compulsion penalizes transient members (e.g., international students) with weaker communal ties. Abstention data lets us diagnose participation problems *after* April and target solutions (e.g., education campaigns) if needed.  

  \answer{Eligibility: All enrolled students and employees active ≥6 months. Participation: Automatic registration with formal abstention.}  

  ---  
  **Bottom line**: This framework balances binding authority with practical governance, excludes only those without direct stakes, and provides auditable turnout data—while rejecting hierarchical membership models.
