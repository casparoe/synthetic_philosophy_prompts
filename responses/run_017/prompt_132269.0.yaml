  First, I'll break down the exchange move by move. Nadia starts with the causal argument from illusion - same proximal causes must mean same mental kind. Owen counters that mental kinds aren't determined solely by proximal causes, using the banknote analogy. Then Nadia introduces the "splice" case to argue that undetectable switching makes disjunctivism implausible. Owen responds that introspective availability isn't required and emphasizes epistemic differences. Nadia presses that the disjunctivist difference is idle if it has no behavioral or cognitive effects. Owen closes by arguing that only constitutive object-involvement explains fine-grained success.

