  ### Key Rationale
  - **Rank 1: Seatbelt Guarantees**  
    Upstream because solving it redefines safety engineering—making worst-case guarantees *practical* via monitoring. Highly tractable: design thought experiments (e.g., "How slow is 'slow failure'?") need no lab. Uncrowded and actionable; builders would immediately adopt auditable failure modes.
    
  - **Rank 2: Tail Dominance**  
    Foundational for existential risk. If true, it voids average-case assurances for AGI. Moderately tractable: use probability bounds (e.g., "If risk > 1/10^6, and catastrophe cost > 10^9 lives, expected loss > 1000 lives—unacceptable"). Crowded, but your logistics perspective on low-probability high-impact events adds value.

  - **Rank 3: Safety Measurement**  
    Upstream of all guarantees—you can't bound what you can't measure. Highly tractable: analyze aviation/medical safety standards. Settling this forces concrete thresholds (e.g., "Safe = no novel power-seeking actions").

  - **Bounded Adversary Parked**  
    Intractable without compute for simulation. Important but less urgent—a "seatbelt" reduces the adversary's leverage anyway.

  - **Deployment Politics Parked**  
    Critical for policy, but your comparative advantage is in technical design.  

  **Why this order?** Seatbelts (#1) offer a near-term path to influence practice. Tail dominance (#2) determines whether average-case is even viable for your concerns. Safety measurement (#3) underpins both. The rest either lack leverage or require resources you lack.
