     - Current price for a hypothesis H.
     - The price they would post for H under each possible evidence outcome (an update plan).
  - Then the evidence is revealed and the bookie trades at the pre-committed prices.
  - We expect some to refuse to honor the plan. We want this refusal to be the center of discussion.
  - Proposed mechanism: Randomly assign binding commitment (executed mechanically) and non-binding. Then compare outcomes.

