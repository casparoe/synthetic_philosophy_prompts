  **Synchronic Phase (Market Maker Setup):**
  - Participants act as market makers, posting two-sided prices (bid and ask) for propositions about a chance process that can be resolved in the room.
  - Propositions include negations and disjunctions to test additivity and negation rules.
  - A roaming bookie trades against them at their posted prices, using points (converted to a trivial reward at the end).

