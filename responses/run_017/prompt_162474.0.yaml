  **Diachronic Phase:**

  40-45 min: Introduce the diachronic part. We will use the same die. Hypothesis H: "the die shows 1 or 4". Evidence partition: E1 (die=1 or 2), E2 (die=3 or 4), E3 (die=5 or 6). They are to set:
     - Current price for H (bid and ask? or just one price? To simplify, we might ask for a single price at which they are willing to buy and sell? But then we lose the spread. Alternatively, we can ask for a single fair price.

     Given time, we ask for a single price: the price at which they would both buy and sell a ticket on H (for 100 points). We can call this their fair price.

     And then for each evidence, they set the price they would set for H after learning that evidence.

  45-50 min: They write down:
     - Current price for H.
     - Price for H given E1.
     - Price for H given E2.
     - Price for H given E3.

     Also, we randomly assign half the participants to be in the binding group (we give them a red sheet) and half in the non-binding (blue sheet). We announce that the binding group must trade at their pre-committed prices, while the non-binding group can re-set their prices after seeing the evidence.

  50-55 min: Roll the die, but don't reveal yet.

  55-60 min: The bookie collects the sheets for the binding group and will trade with them after the evidence is revealed. For the non-binding, we collect their current price for H (at t0) but not the conditional prices? Or we collect everything but tell them they can change.

  60 min: Reveal the evidence (say, we rolled a 1, so E1 occurs).

  60-70 min: The bookie trades with the binding group at their pre-committed price for H given E1. For the non-binding group, we ask them to set their new price for H given the evidence (E1) and then the bookie trades with them at that new price.

     - The bookie will buy or sell depending on whether the price is favorable.

     How does the bookie know what is favorable? The bookie can use the objective chance or just trade if the price is off from what they think. But to avoid the bookie needing knowledge, we can have the bookie trade at the agent's price no matter what? But then there is no exploitation.

     We want to show that if the binding group set a price that is too high or too low given the evidence, they will be exploited. But the bookie can only exploit if they know the true probability. Since we are rolling a die, we can compute the true P(H|E1)=1/2 (because given E1, H is true if 1, false if 2). So the bookie (instructor) can trade to exploit.

     Example: If a binding participant set their price for H given E1 to 60, then the bookie can sell them a ticket on H for 60. Since the true chance is 50, the bookie makes a profit in expectation. But we care about sure loss? Not in this case. This is a loss in expectation, not sure loss.

     Given time, we might not be able to do a sure loss at t1. We can settle for this and discuss.

  70-75 min: Settle the bets: H is true if die=1 or 4. Since we rolled 1, H is true. So those who bought a ticket on H get 100, those who sold pay 100.

     Calculate net for the binding group and non-binding group.

  75-85 min: Discussion. 
     - Ask the binding group if they regret their pre-commitment. 
     - Ask the non-binding group if they changed their price and why. 
     - Discuss whether the binding group was irrational to stick to their plan? 
     - Discuss whether the non-binding group is rational because they avoided a loss? Or are they irrational because they didn't stick to a plan?

  85-90 min: Wrap-up: connect to the readings and the upcoming week on updating. Mention what we couldn't cover.

  **What Might Go Wrong:**

  - Arithmetic errors: Participants might miscalculate. The bookie might make a mistake in trading. Have a TA double-check. Or do the trades on the board.

  - Slow bookie: We might not get to everyone. Solution: Focus on a few volunteers or pre-select based on collected sheets.

  - Participants treat points as real money: Emphasize it's trivial. Or use very small stakes.

  - Points as nothing: They might not take it seriously. Encourage them to play along.

  - Someone notes the bookie has more information: The bookie is the instructor, who is not supposed to have more information. We resolve the chance process publicly, so after the trade in the synchronic phase, we reveal the die. In the diachronic phase, we reveal the evidence after the pre-commitment. The bookie should not have any private information.

  - Exploitation fails: If no one has an incoherent set, then we don't get an example. Have a planted example? Or the instructor can participate with a known incoherent set. Or we can use a example from a volunteer who is willing to be the guinea pig.

  **Parts of the Dialectic the Activity Cannot Stage:**

  - Converse result: that coherence is sufficient for immunity. We don't show that coherent sets are not exploitable. We can mention it in the wrap-up.

  - Sure-loss arguments are pragmatic, not epistemic. We can discuss this in the synchronic discussion.

  - Diachronic argument assumes the bookie can offer bets at t0 on the evidence and on the conditional. We did not do that. We can explain in the diachronic discussion.

  - Also, the updating rule might be defended on other grounds (e.g., accuracy).

  - The activity does not show that the update plan must be conditionalization to avoid exploitability. We only showed that if they have a bad plan and are bound, they lose. We can explain the full Dutch book in the discussion.

  **Contested Claims:**

  - Some argue that the Dutch book argument for conditionalization assumes that the agent is committed to their update plan. The unbound group might say they are not committed, so the argument doesn't apply to them. This is a live debate.

  - Imprecise credences: Sure-loss arguments do not refute imprecise credences because the agent might not be forced to trade at both ends. In our activity, we did force them, which is contested. We should note that the activity assumes willingness to trade at both prices, but some theories reject that.

  **Revised Plan Based on Time and Feasibility:**

  Given the complexity, we might simplify the synchronic phase to focus on one type of violation and do it publicly. Similarly, the diachronic phase might be more discussion-based.

  But we'll try to stick close to the original design.

  **Final Minute-by-Minute:**

  Total: 90 minutes.

  - 0-5: Introduction. Explain the die roll. Hand out synchronic sheets. Explain they are market makers: they post bid (max buy price) and ask (min sell price) for each proposition. They must trade if the bookie chooses. Points will be converted to a trivial reward.

  - 5-15: Participants fill out the synchronic sheet. Propositions:
     P1: Die=1
     P2: Die=2
     P3: Die=1 or 2
     P4: Die not=1
     P5: Die=1,2, or 3

  - 15-25: Bookie (instructor and TAs) collect sheets. Quickly scan for violations. Choose one or two that show:
     - For P1, P2, P3: if bid(P1)+bid(P2) > ask(P3), then execute the arbitrage (publicly on board).
     - Also, check: ask(P1)+ask(P2) < ask(P3)? Or other violations.

     If none, use a prepared example.

  - 25-30: Roll the die and resolve the bets for the participants who were traded with.

  - 30-35: Discuss the synchronic phase. Ask the exploited participants why they set their prices. Ask if others had spreads and why. Surface that some might have had spreads due to risk aversion and would have been exploited if traded with. Mention the linearity assumption.

  - 35-40: Introduce diachronic phase. Hand out diachronic sheets. Explain H: die=1 or 4. Evidence: E1={1,2}, E2={3,4}, E3={5,6}. They set:
     - Current price for H (bid and ask, or just a single price? Let's do single price for simplicity: the price at which they are willing to both buy and sell).
     - For each evidence, the price they would set for H after learning that evidence.

     Also, randomly assign binding (red) and non-binding (blue). Binding must trade at the pre-committed price; non-binding can change.

  - 40-45: They fill out the diachronic sheet.

  - 45-50: Collect the sheets. Roll the die (keep hidden? or roll publicly but don't reveal until after collecting?).

  - 50-55: Reveal the evidence (say, E1). For binding group, the bookie will trade at their pre-committed price for H|E1. For non-binding, ask them to write down their new price for H given E1.

  - 55-60: Bookie trades with binding group at their pre-committed price for H|E1. The bookie will decide to buy or sell based on the true chance (which is 0.5 for H given E1). If the participant's price is above 50, the bookie sells to them; if below, buys from them.

  - 60-65: Bookie trades with non-binding group at their new price.

  - 65-70: Resolve H (true if die=1 or 4). Since we have the die result, we know. Settle the bets.

  - 70-80: Discussion. 
     - Compare outcomes of binding and non-binding. 
     - Ask: Should the binding group have been allowed to change? 
     - Is it rational to change if you are not bound? 
     - What if you are bound? 
     - Connect to conditionalization: the plan should be to set your new credence to the old one conditioned on the evidence.

  - 80-85: Wrap-up: what we couldn't cover:
     - Converse result: coherence is sufficient.
     - Sure-loss arguments are pragmatic.
     - Diachronic Dutch books require bets at both times.
     - The update rule might be defended by accuracy arguments.

  - 85-90: Open floor.

  **Materials to Print:**
  - Synchronic phase: Sheet with the five propositions, space for bid and ask for each.
  - Diachronic phase: Sheet for H and the three evidence cases, plus current price. And a red/blue marking for binding/non-binding.

  **Contested Claims Note:**
  - In the wrap-up, clarify that the activity assumes a willingness to trade at both prices, but some theories (e.g., imprecise credence) might not require that. Also, the diachronic argument assumes commitment to update plans, which is contested.

  This plan is ambitious. We might run over time. Be prepared to cut.
answer: |-
  Below is a comprehensive plan for your 90-minute session, designed to meet your goals while addressing the complexities of synchronic coherence and diachronic updating. The session uses a die-roll as the chance process (resolved live) for simplicity and clarity. I've incorporated your core requirements, including the distinction between bid-ask spreads as uncertainty vs. transaction costs, risk aversion, binding vs. non-binding commitments, and contested issues in formal epistemology. The plan includes minute-by-minute timing, materials, handling of predictable problems, and explicit mapping of activity moments to arguments. Crucially, I flag settled vs. contested claims throughout.

  **Core Design Choices:**
  - **Chance Process**: A single fair 6-sided die roll. It generates 6 outcomes, allowing for rich propositions (e.g., negation, disjunction) without complex math.
  - **Propositions**: Focus on a small set to avoid overload. Key violations tested: additivity (e.g., bid for A + bid for B > ask for A∨B) and negation (e.g., bid for A + bid for ¬A > 100).
  - **Synchronic Spread Handling**: Rules force participants to trade at both bid and ask prices, surfacing the distinction between "uncertainty spreads" (genuine imprecision) and "aversion spreads" (risk/utility confounds) through arbitrage outcomes. Aversion is addressed via a post-arbitrage discussion.
  - **Diachronic Commitment**: Randomized binding/non-binding groups create a natural split for debating update plans. The bookie only trades at t1 (after evidence) to avoid complexity, focusing on refusal and exploitability.
  - **Settled vs. Contested**: I explicitly note where arguments are settled (e.g., synchronic incoherence implies exploitability) vs. contested (e.g., whether imprecise credences or non-commitment "solves" diachronic issues). Your framing risks smuggling in contested assumptions—I flag these.

  ---
  ### **Minute-by-Minute Plan (90 Minutes Total)**
  **Materials to Print** (distribute at start):
  1. **Synchronic Sheet**: Table with 5 propositions (all pay 100 points if true). Columns: Proposition, Bid (max buy price), Ask (min sell price).  
     Propositions:  
     - P1: Die = 1  
     - P2: Die = 2  
     - P3: Die = 1 or 2 (P1 ∨ P2)  
     - P4: Die ≠ 1 (¬P1)  
     - P5: Die ≤ 3 (1, 2, or 3)  
  2. **Diachronic Sheet**: For hypothesis H: "Die is odd" (true on 1,3,5). Includes:  
     - Current price for H (bid and ask).  
     - Update plan: Price for H if E1, E2, or E3 (evidence partition: E1={1,2}, E2={3,4}, E3={5,6}).  
     - Randomly pre-mark sheets as "BINDING" (50%) or "NON-BINDING" (50%).  
  3. **Bookie Cheat Sheet**: For you/TAs. Lists common incoherence patterns to exploit (e.g., bid(P1) + bid(P2) > ask(P3)).

  **Phase 1: Synchronic Coherence (40 Minutes)**  
  **Goal:** Surface bid-ask spreads, arbitrage, and the risk-aversion confound.  
  - **0–5 min: Introduction (You)**  
    - Explain setup: Participants are market makers posting bid/ask prices for propositions. Die will be rolled at the end.  
    - Rules:  
      - Prices are for tickets paying 100 points if proposition true (0 otherwise).  
      - **Commitment**: By posting, you agree to trade at bid/ask if bookie chooses.  
      - Settlement: Net points converted to trivial reward (e.g., candy).  
    - Emphasize: "This is about pricing under uncertainty—no right/wrong answers."  
  - **5–15 min: Price Posting (Participants)**  
    - Participants fill out synchronic sheets. Circulate to answer questions.  
    - **Predictable Moment**: Participants may set spreads (e.g., bid=40, ask=60 for P1). Some will set incoherent prices (e.g., bid(P1) + bid(P2) = 80 > ask(P3) = 70).  
  - **15–30 min: Bookie Trading (You/TAs as bookie)**  
    - Bookie roams, checks sheets, and executes arbitrage trades for 2–3 incoherent participants. Focus on:  
      - Additivity: Buy P3 at ask, sell P1 and P2 at bid if bid(P1) + bid(P2) > ask(P3).  
      - Negation: Buy P1 and P4 at bid if bid(P1) + bid(P4) > 100.  
    - **Example Trade**: If bid(P1)=40, bid(P2)=40, ask(P3)=70, bookie buys P3 from participant for 70 (participant pays 70), sells P1 to participant for 40 (participant pays 40), sells P2 for 40 (participant pays 40). Participant nets -70 -40 -40 = -150 points. Outcome: If P1 or P2 true, participant pays 100 on P3 and receives 100 on P1/P2, netting -150 +100 = -50. If neither, participant keeps -150. Sure loss.  
    - **Key**: Target participants with large spreads (e.g., bid-ask gap >20 points) to surface uncertainty vs. aversion.  
  - **30–35 min: Resolve & Settle (Group)**  
    - Roll die publicly. Resolve propositions. Calculate net points for traded participants.  
    - **Predictable Moment**: A traded participant protests: "I only set a spread because I dislike risk, not incoherence!"  
  - **35–40 min: Quick Discussion (You)**  
    - Ask exploited participants: "Why did you set these prices?"  
    - **Surface Spread Distinction**:  
      - Some say: "I was uncertain about probabilities" (uncertainty spread → genuine imprecision).  
      - Others say: "Betting stresses me, so I padded prices" (aversion spread → risk confound).  
    - Transition: "Now, what happens when we move to updating?"

  **Phase 2: Diachronic Updating (40 Minutes)**  
  **Goal**: Make non-conditionalization exploitable and trigger debate on commitment.  
  - **40–45 min: Diachronic Setup (You)**  
    - Introduce H: "Die is odd" (P=0.5). Evidence partition: E1={1,2} (P(H|E1)=0.5), E2={3,4} (P(H|E2)=0.5), E3={5,6} (P(H|E3)=0.5).  
    - **Note**: H is independent of evidence to simplify (no varying conditional probabilities), but update plans still matter.  
    - Rules:  
      - Post current price for H and update plan (price for H given E1/E2/E3).  
      - **BINDING**: Must trade at pre-committed prices.  
      - **NON-BINDING**: Can adjust prices after evidence.  
  - **45–50 min: Price Posting (Participants)**  
    - Participants fill out diachronic sheets.  
    - **Predictable Moments**:  
      - Many set non-conditionalizing plans (e.g., current price for H=50, but post E1 price=70).  
      - Some set identical prices (e.g., 50 for all), unknowingly conditionalizing.  
  - **50–55 min: Commit & Reveal (Group)**  
    - Collect sheets. Roll die (e.g., lands on 1 → E1 occurs, H true).  
    - **Do not reveal outcome yet** (only evidence: E1).  
  - **55–65 min: Bookie Trading (You/TAs)**  
    - For BINDING group: Bookie trades at pre-committed price for H|E1.  
      - If price >50, bookie sells ticket (participant overpays if H true/false).  
      - If price <50, bookie buys ticket (participant underpays).  
    - For NON-BINDING group: Ask for new price for H|E1. Bookie trades at new price.  
    - **Predictable Moment**: NON-BINDING participants change prices (e.g., from 70 to 50). BINDING participants protest: "I’ve thought again—this is unfair!"  
  - **65–70 min: Resolve & Settle (Group)**  
    - Reveal outcome (H true if die=1,3,5). Settle all bets.  
    - **Example**: BINDING participant with H|E1=70 buys from bookie for 70. If H true, they gain 100-70=30. If false, they lose 70. Here, H true, but they regret not buying at 50.  
  - **70–75 min: Group Discussion (Facilitated)**  
    - Pose: "BINDING group: Why did you want to change prices? NON-BINDING: Why did you change?"  
    - **Drive Debate**:  
      - BINDING: "I was exploited because I couldn’t adjust!"  
      - NON-BINDING: "I avoided a bad bet by changing."  
      - Counter: "But if you can always change, are update plans meaningless?"  

  **Wrap-up: Synthesis & Missing Pieces (10 Minutes)**  
  - **75–80 min: Map Moments to Arguments (You)**  
    - **Synchronic**:  
      - Bid > ask or additivity failure → Sure-loss exploitability (settled: incoherence implies pragmatic vulnerability).  
      - Participant with spread not arbitraged → Converse not shown (coherence suffices for immunity? Settled: yes, but only under linearity assumption).  
      - Risk-averse protester → Confound: Prices ≠ credences if utility non-linear (settled: Dutch Book assumes linear utility).  
    - **Diachronic**:  
      - BINDING participant exploited → Non-conditionalizing plans are exploitable if committed (settled: with commitment, incoherence implies diachronic sure loss).  
      - NON-BINDING participant escapes → Rebuttal: "I can decline later bets" (contested: does this "solve" the problem or evade rationality?).  
      - Refusal to honor plan → Core tension: Is commitment part of rationality? (Contested.)  
  - **80–85 min: Supply Missing Dialectic (You)**  
    State what the activity **couldn’t** stage:  
    1. **Converse Result**: Coherence suffices for immunity (settled under linearity).  
    2. **Pragmatic vs. Epistemic**: Sure-loss arguments are pragmatic (instrumental rationality); they don’t show epistemic irrationality (e.g., accuracy arguments are separate; contested how they relate).  
    3. **Diachronic Assumptions**: The argument assumes the bookie can offer bets at any time and you commit in advance (contested: is this demand reasonable?).  
    4. **Imprecise Credences**: Not refuted—spreads *could* reflect rational imprecision (contested; activity forces trading, but some theories reject this).  
  - **85–90 min: Open Q&A**  
    - Preview next week (updating) and link to readings.

  ---
  ### **What Will Go Wrong & How to Handle It**
  1. **Arithmetic Errors/Incoherence Missed**:  
     - **Why**: Participants miscalculate; bookie overlooks violations.  
     - **In Session**: Use your "Bookie Cheat Sheet" to pre-identify 1–2 easy targets. If no exploitable cases, use a prepped example (your own sheet with bid(P1)=40, bid(P2)=40, ask(P3)=70). Say: "This happened in a pilot—let’s simulate."  
     - **If Exploitation Fails**: Argue instrumentally: "The point is that such prices *can* be exploited—imagine a sophisticated bookie."

  2. **Slow Bookie**:  
     - **Why**: Trading takes time with 16 people.  
     - **In Session**: Trade with only 3–4 participants (target those with clear spreads). For others, say: "Check if your prices were exploitable—discuss with neighbors."

  3. **Points Misinterpreted**:  
     - **Why**: Some treat points as real money (overly cautious); others as meaningless (random prices).  
     - **In Session**: Emphasize trivially small rewards. If disengaged, say: "Indulge me—this is a tool to probe rationality."

  4. **Information Asymmetry Protest**:  
     - **Why**: Participant says: "The bookie exploits me only with extra information!"  
     - **In Session**: Clarify: "The bookie needs no private info—exploit uses only your public prices and logic. Sure loss is outcome-independent."

  5. **Binding Group Rebellion**:  
     - **Why**: BINDING participants refuse to trade, calling the setup unfair.  
     - **In Session**: Lean in: "Great—why is it unfair? Does this show a flaw in the argument?" Turn into debate.

  6. **No Refusal in Diachronic Phase**:  
     - **Why**: All NON-BINDING participants stick to plans.  
     - **In Session**: Provoke: "If you learned E1 and a meteor struck, would you still price H at 70? Why not adjust?" If still no, use a prepped example.

  ---
  ### **Contested Claims & Your Framing**
  Your request to separate settled/contested is central. I flag these in the wrap-up, but your design risks smuggling in:
  - **Your Framing Risk**: You imply that spreads *should* reveal credences and that refusal to update via conditionalization is illegitimate. But:  
    - **Contested**: Imprecise credence theorists argue spreads reflect rational indeterminacy (not incoherence) if you decline some bets.  
    - **Contested**: Some (e.g., Levi) argue you *should* change plans with new evidence, so non-commitment is rational.  
  - **Settled vs. Contested in Arguments**:  
    | Argument                | Settled                                     | Contested                                                                 |
    |-------------------------|---------------------------------------------|---------------------------------------------------------------------------|
    | **Synchronic Dutch Book** | Incoherence → sure loss (under linearity). | Do spreads reflect imprecision or risk? Does sure loss imply irrationality? |
    | **Diachronic Dutch Book** | With commitment, non-conditionalization → sure loss. | Is commitment required? Does diachronic coherence imply conditionalization? |
    | **Updating Rule**       | None—activity shows exploitability, not a rule. | Does exploitability *mandate* conditionalization? (Accuracy arguments differ.) |

  **Recommendation**: In wrap-up, stress: "Specialists debate whether Dutch Books refute imprecise credences or mandate conditionalization. This activity illustrates the arguments but doesn’t settle them."

  ---
  ### **Why This Design Works**
  - **Encounter vs. Lecture**: Participants "run into" sure-loss and commitment dilemmas. The bookie makes exploitability visceral.  
  - **Spread Distinction**: By forcing trades on both ends, aversion spreads lead to protests ("I was coerced!"), while uncertainty spreads feel "fairly" exploited.  
  - **Diachronic Split**: Random binding forces debate: "I escaped only because I wasn’t bound—is that cheating?"  
  - **Time Realism**: Die-roll is quick; phases fit 90m.  
  - **Clarity**: Propositions avoid complex math (no calculators needed).  

  **First-Run Tips**: Do a dry run with a colleague. Prepare backup examples for missed arbitrage. Embrace protests—they fuel debate. Good luck!
