prompt: |-
  hey — I'm on a city advisory panel and I need help with priorities, not background info.

  Setup: we've got roughly two years, a modest budget, and about a dozen contested commemorations to make recommendations on. Two statues downtown, a high school named for a segregation-era school board president, four or five street names, a mural in a public library, and a lecture hall named after a donor whose fortune came from housing discrimination. We have to give our reasons in public, we can't redo everything, and whatever we recommend gets appealed to the council and then fought over for another year.

  What I want: of the philosophical questions this kind of work runs into, which two or three should we actually spend our limited argumentative energy on — the ones where getting the answer right would change what we recommend — and which are a distraction, fun in a seminar but not changing any vote we take. Rank them for *our* situation and defend the ranking. I care more about the reasoning than the list: what makes a question worth the argument here, how many of the other questions it settles, how tractable it is for a bunch of lay people with two years, and what we'd have to find out to move something up or down.

  Here are the ones I keep circling, with my own labels for them so we don't talk past each other:

  - *donor's shadow*: some of these were never a public judgment to begin with — a naming right was sold to a private person. Does that change the ethics of removal, and who has standing to complain?
  - *contextualization drift*: keep the object, add a plaque that reframes it. Is that a stable third option, or does it predictably decay into either removal or restoration once nobody reads the plaque anymore?
  - *the replacement burden*: are we obliged to put something on the empty plinth, and is there a real asymmetry between what it takes to install an honor (a donor, a vote) and what it takes to remove one (a public reason, a ritual of dishonor)?
  - *saturation*: apply "don't honor the seriously morally flawed" consistently and basically the entire nineteenth- and twentieth-century civic landscape qualifies. I don't mean this as a gotcha reductio — I mean, what selection principle do we actually use: how bad, how central to what they were honored for, whether the honor is still doing any active work or has gone inert.
  - *cooling-off*: we're also being asked to name a new park after someone who died last year. Does a cooling-off period for new honors fall out of the same principles we use for removing old ones, or is that a separate thing?
  - *laundering*: the school gets renamed and everyone declares the matter closed while the thing the old name stood for is still going on. How much does the expressive-vs-material distinction matter for how we weigh that risk?

  Add whatever I'm missing. And tell me if some of these are dead ends — I suspect the "you're erasing history" line and the anachronism / judging-the-past-by-present-standards debate are both things we should have a stock answer to but shouldn't sink months into, and that the art-vs-artist framing mostly doesn't fit.

  Also, please seperate what's actually settled among people who work on this from what's genuinely contested, and flag anywhere my own framing above is doing load-bearing work or is itself a contested view. Say what you're confident about and what you're definately guessing at.
reasoning: |-
  Okay, the user is on a city advisory panel dealing with contested commemorations. They need to prioritize philosophical questions to focus their limited energy on. Let me start by understanding their setup: two years, modest budget, a dozen items including statues, school names, street names, a mural, and a lecture hall. Their recommendations will face public scrutiny and appeals, so efficiency is crucial.

  The user listed several philosophical questions. I need to determine which of these will most impact their recommendations and which are distractions. The key is identifying questions that change outcomes, settle multiple issues, are tractable for laypeople, and require manageable research.

  Looking at their list:
  - **Donor's shadow**: This questions the ethics of removing names tied to purchased naming rights. It might affect the lecture hall case but not others. However, the standing to complain might vary, and it's probably a niche issue. Low priority.
  - **Contextualization drift**: Adding plaques as a solution. But does it last? If plaques get ignored over time, it's unstable. This is important because it's a common compromise, but if it fails, removal might be inevitable. High impact if proven unstable.
  - **Replacement burden**: Are they obligated to replace removed commemorations? This could create budget and time issues. If there's an asymmetry in effort between installing and removing, it affects logistics. Important for practical decisions.
  - **Saturation**: Applying consistent moral standards could flag many historical figures. Need a selection principle—how bad, centrality to their honor, current relevance. Essential to avoid arbitrary decisions and provide clear criteria.
  - **Cooling-off period**: For new honors, like naming a park after a recent death. Is this tied to removal principles? Probably separate but could streamline processes. Medium priority if it saves future work.
  - **Laundering**: Renaming as symbolic without addressing ongoing issues. Risk of performative action. Important to consider material impacts versus expressive gestures.

  The user also mentioned avoiding "erasing history" debates and anachronism, which they see as settled. They want to know what’s genuinely contested versus settled in the field.

  I should rank the questions based on impact, efficiency, and tractability. Saturation seems top because it underpins all decisions—defining criteria affects every case. Contextualization drift is next because if plaques don't work, alternatives like removal become necessary. Replacement burden is third due to practical implications. Cooling-off and laundering are medium, while donor's shadow is low.

  Need to check if any critical questions are missing. Perhaps the question of community impact versus historical accuracy, but the user's list might cover it. Also, ensuring that recommendations don't create future problems, which laundering addresses.

  Settled areas: "Erasing history" is a stock argument; contextualization counters it. Anachronism is avoidable by assessing past norms. Art vs. artist isn't relevant here. Contested areas include the stability of plaques and selection principles for saturation.

  User’s framing might assume contextualization is optional, which is contested. Also, the replacement burden’s asymmetry might be accepted, but its implications are debated.

  Final ranking: Saturation first, then contextualization drift, replacement burden. Defend based on broad applicability, efficiency, and practical outcomes. Advise having stock answers for other issues to save time.
answer: |-
  Here’s a prioritization tailored to your **practical constraints** (limited time, contested decisions, public justification, political appeals), ranked by impact on outcomes, efficiency, and ability to resolve multiple cases. The goal is to maximize decisional leverage while minimizing rabbit holes.

  ### Top 3 Priority Questions (Focus Your Energy Here)
  1. **Saturation**  
     **Why #1?**  
     - **Decides multiple cases**: Your entire docket hinges on defining *which flaws disqualify an honor*. Without this, decisions look arbitrary (e.g., "Why remove X but keep Y?").  
     - **Tractable for laypeople**: Build a simple rubric:  
       - *Severity*: Was the harm foundational to their power (e.g., segregationist policies) vs. tangential?  
       - *Centrality*: Was the harm core to why they were honored (e.g., school name for segregationist)?  
       - *Relevance*: Is the honor still actively celebrated, or is it "inert" (e.g., obscure street name)?  
     - **Changes votes**: A clear threshold (e.g., "harm directly enabled by their honored role") resolves statues, school names, lecture halls, and streets in one framework.  
     - **Settled/Contested**: Widely accepted that *not all flawed figures must be removed*, but thresholds are hotly debated. Your framing of "active work vs. inert" is insightful and operational.  
     - **To move forward**: Draft criteria, test against 2–3 cases, and pressure-test with historians. Avoid perfection—aim for "defensible."  

  2. **Contextualization Drift**  
     **Why #2?**  
     - **Decides removal vs. compromise**: If contextualization fails long-term, it wastes resources and invites future conflict. If stable, it’s a viable middle path for lower-priority cases (e.g., murals, streets).  
     - **Tractable**: Research real-world examples (e.g., Yale’s Calhoun College plaque failed; some Civil War monuments added NAACP-approved text endure). Key factors:  
       - *Physical integration*: Is the plaque part of the artifact (e.g., carved into base) vs. add-on?  
       - *Maintenance commitment*: Will the city fund upkeep and updates?  
     - **Changes votes**: If drift is inevitable, removal becomes the *only* durable option for high-visibility sites (statues, school names). If stable, it frees budget for higher-impact work.  
     - **Settled/Contested**: Evidence shows drift *is* common without institutional buy-in. Your view that it "predictably decays" is contested but empirically plausible.  
     - **To move forward**: Require a funded maintenance plan for any contextualization. If none exists, reject this option.  

  3. **Replacement Burden**  
     **Why #3?**  
     - **Impacts budget/politics**: If you *must* replace removals, costs balloon, and disputes multiply (e.g., "Who deserves the plinth?"). If not, you reallocate funds to contextualization or new projects.  
     - **Tractable**: Legal review + public precedent. Most cities *don’t* mandate replacement (e.g., Richmond’s empty pedestals). The asymmetry *is* real: installation requires low consensus (donor $$/backroom deal); removal requires high consensus.  
     - **Changes votes**: Accepting asymmetry lets you recommend removal *without replacement* for minor honors (streets, lecture halls), saving resources for contentious statues/schools.  
     - **Settled/Contested**: Asymmetry is well-documented in commemoration studies. Replacement isn’t ethically obligatory—it’s political.  
     - **To move forward**: State clearly: "Removal corrects an error; it doesn’t create an obligation." Cite cost avoidance.  

  --- 
  ### Medium Priority (Address Briefly, but Don't Debate)
  4. **Laundering**  
     - **Why not higher?** Important, but hard to prove causality (e.g., does renaming a school *actually* reduce anti-racism efforts?).  
     - **Practical handling**: Pair removal with a *material action* (e.g., fund a history scholarship at the renamed school). Requires minimal energy: add a line to recommendations like, "This alone doesn’t rectify ongoing inequities."  

  5. **Cooling-Off Period**  
     - **Why not higher?** Logically separate from removal principles. New honors need scrutiny, but your panel’s mandate is *existing* issues.  
     - **Practical handling**: Recommend a policy (e.g., "No new commemorations for 10 years post-death") to council. Takes 1 meeting.  

  ### Low Priority (Avoid or Use Stock Answers)
  6. **Donor’s Shadow**  
     - **Why avoid?** Naming rights are contracts. Legal teams, not ethics debates, resolve these. For the lecture hall, ask: "Does the contract allow revocation for moral turpitude?" If yes, apply your **saturation** rubric. If no, it’s a legal fight outside your scope.  

  ### Dead Ends (Explicitly Reject)
  - **"Erasing history"**: Stock answer: **"Removal isn’t erasure; it’s reevaluation. History is studied in museums/archives, not celebrated in public squares."**  
  - **Anachronism / "Judging the past"**: Stock answer: **"We judge based on *contemporary alternatives* (e.g., abolitionists existed alongside slavers)."**  
  - **Art vs. Artist**: Irrelevant—murals/statues are civic honors, not private art.  

  ### Missing Critical Question
  - **Community Harm vs. Historical Value**: *"Does maintaining this honor actively harm marginalized groups *today*?"* This is **implicit in saturation** but worth surfacing. Example: A school name may alienate Black students (measurable via surveys). Integrate this into your severity rubric.  

  ---

  ### Confidence & Your Framing
  - **Settled in the field**: 
    - Asymmetry in installation/removal efforts (replacement burden).  
    - Contextualization without upkeep fails (drift).  
    - Not all flawed figures must be removed (saturation principle exists).  
  - **Contested**: 
    - *How* to define severity/centrality (saturation).  
    - Whether laundering is a major risk (evidence is anecdotal).  
  - **Your framing’s load-bearing assumptions**:  
    - "Contextualization predictably decays" is a strong claim—be ready to cite examples.  
    - "Saturation requires a selection principle" is correct and uncontested, but your proposed criteria (inertness, centrality) need defending.  

  ### Action Plan
  1. **Weeks 1–3**: Draft **saturation criteria** (severity/centrality/relevance). Test on 2 cases.  
  2. **Weeks 4–6**: Research **contextualization failures/successes** in similar cities. Demand maintenance plans.  
  3. **Week 7**: Formalize **replacement burden** stance (no obligation; asymmetry argument).  
  4. **Remaining time**: Apply the above to cases. Use stock answers for lower-priority questions.  

  **This cuts the Gordian knot**: Saturation gives you consistent reasoning; contextualization drift determines if compromise is viable; replacement burden prevents budget sinks. The rest distracts from your mandate.
