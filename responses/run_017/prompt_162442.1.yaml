  ### Dialogue: The Lighthouse Bet

  **Characters:**  
  - **Nadia**: Thinks in terms of growth rates, time averages, and absorbing ruin.  
  - **Owen**: Thinks in terms of expected dollars and ensemble averages.  

  **Setting:**  
  A foundation office. Nadia and Owen are trustees reviewing a proposal to gamble the foundation’s $1,000,000 endowment to reach $10,000,000 for a lighthouse project. The deadline requires exactly twenty sequential, independent even-money bets (win probability 0.6, double-or-nothing stakes). If they reach or exceed $10M, they build the lighthouse and return any surplus. If they fall short, they get nothing for the lighthouse, and any remaining funds go to a scholarship fund (valued linearly in dollars). The lighthouse’s completion is worth an additional fixed utility of 1,000,000,000 (a "benefit cliff").  

  ---

  **OWEN:** (Leaning back, studying the figures) So, we start with $1M, need $10M in twenty bets. The lighthouse is the priority, but any leftover cash helps the scholarship linearly. With beneficiaries numbering in the thousands, we should maximize expected utility. That means maximizing expected terminal dollars. Bet everything every round—expected terminal wealth is about $38 million.  

  **NADIA:** (Shaking her head) Owen, that’s a St. Petersburg illusion. Yes, the *expectation* is $38M, but it’s built on a tail so thin you’d need a microscope. The median outcome is zero—ruin. Probability of success? Four wins in a row upfront: 0.6⁴ ≈ 13%. Otherwise, you crash to zero and stay there. You’re sacrificing a certain $1M scholarship fallback for a 13% shot at the lighthouse.  

  **OWEN:** But if we hit, we lock in the lighthouse early and stop. And $38M isn’t "illusion"—it’s the arithmetic mean. If we could split our million across a thousand independent bets per round, or pool with other foundations, the geometric and arithmetic pictures converge. Kelly’s log rule would reappear as a risk-management tool, not the objective. Our charter doesn’t privilege infinite horizons or full reinvestment.  

  **NADIA:** (Tapping the table) We *aren’t* pooling. We live one trajectory. Ruin absorbs you—no do-overs. Your expected dollars are dominated by paths like that one-in-27,000 shot ending near a trillion dollars. But we won’t live that path. We live one. The lighthouse needs a per-round log-growth rate of ln(10)/20 ≈ 0.115. Kelly’s max is 0.02. No strategy gets us there "in expectation." We’re in a large-deviation regime—tail probabilities rule.  

  **OWEN:** (Pausing) Fine, no pooling. But even solo, linear utility for the scholarship below $10M means we should care about expected wealth. Kelly bets 20% per round? Median final wealth ~$1.5M, but probability of hitting $10M? Log-normal approximation says 1.5–2%. That’s worse than my 13%!  

  **NADIA:** Kelly isn’t optimized for this. It minimizes *time* to a fixed target asymptotically. But here? Horizon is short, target is distant. The literature’s silent at n=20. With first-passage—stopping if we hit $10M early—we need aggressive betting. Kelly’s 0.02 growth can’t reach 0.115. We must "buy lottery tickets."  

  **OWEN:** (Leaning forward) And if the target were lower? Say $1.1M, not $10M. Then required growth is ln(1.1)/20 ≈ 0.005—below Kelly’s max 0.02. Betting 20% now seems reckless! Median $1.5M is above $1.1M, but Kelly’s ruin risk is real. Final wealth could be as low as $1M × 0.8²⁰ ≈ $11,500. Probability of missing $1.1M? Significant. Shouldn’t we bet *less* than Kelly to protect the downside?  

  **NADIA:** (Nodding slowly) Exactly. Kelly isn’t a universal norm. It’s a phase boundary. When your demanded growth rate is below the max, like 0.005 vs. 0.02, you underbet Kelly to maximize success probability. When it’s above, like 0.115 vs. 0.02, you overbet—even go all-in. Here, Kelly is too conservative.  

  **OWEN:** (Skeptical) But with this lighthouse cliff, utility jumps to 1e9 at $10M. Expected utility is E[W] + p_hit × (1e9 - 10M). The 990M bonus dominates—so p_hit is king. But how? Betting everything gives 13%. Is there a better constant fraction?  

  **NADIA:** Possibly. Bet fraction *f* > 0.2. If you lose early, you might recover with later wins. But it’s messy. For example, bet 50%: you need more wins but can absorb losses. Probability of hitting $10M in twenty rounds? Hard to compute, but likely higher than 13%. Still, no strategy gets you beyond ~25% without wild risk.  

  **OWEN:** So in this case, maximizing p_hit means betting *more* than Kelly. But what about the scholarship? If we bet huge and miss, scholarship gets near-zero. Expected utility might still favor aggression, but it’s not clean.  

  **NADIA:** Because the lighthouse cliff creates nonlinearity. Without it—pure linear utility—expected dollars wins. But here? The discontinuity forces us into tail-optimization. Your ensemble average includes trillion-dollar paths we’ll never see. Our reality is binary: lighthouse or not.  

  **OWEN:** (Sighing) So the dispute reduces to: what’s the "real" average? For you, it’s the time-average of one multiplicative path—avoid ruin, grow steadily. For me, it’s the probability-weighted ensemble average—maximize expected dollars, even with rare jackpots. But in this case, the lighthouse cliff makes your view dominant.  

  **NADIA:** And the original Kelly-versus-expectation fight? It wasn’t about the norm. It was about the objective. Infinite-horizon growth? Kelly wins. Finite deadline with a binary goal? Maximize p_hit. Linear utility? Maximize E[W]. Kelly is a special case—when your goal demands growth at exactly the maximum rate.  

  **OWEN:** Conceded. For this lighthouse, with its 0.115 demand > 0.02 max, "maximize expected dollars" is disastrous. But if the cliff were at $1.1M, I’d say Kelly is reckless. We agree on the math, just the framing.  

  **NADIA:** Precisely. So for next week’s bets: we optimize p_hit with constant fraction or dynamic stakes. But we’ll need simulations—no closed form.  

  **OWEN:** And hope we’re lucky. Four wins straight would be nice.  

  **NADIA:** (Smiling wryly) At 13%? I’d rather find a fraction that gets us to 20%.  

  ---  

  **Disagreement Reduced:**  
  The core disagreement is whether the foundation’s objective is best represented by the *time-average of a single multiplicative path* (emphasizing survival, avoiding ruin, and first-passage probabilities) or the *probability-weighted ensemble average* (emphasizing expected terminal wealth, including low-probability extreme outcomes). The lighthouse’s benefit cliff forces the former, but Owen argues this is context-dependent. They agree that the Kelly criterion is not a universal norm but a phase boundary: optimal when the demanded growth rate matches the maximum attainable rate, but deviations (underbetting for easy goals, overbetting for hard ones) are necessary for finite-horizon, goal-directed problems. The original dispute between growth-rate and expected-value maximization was fundamentally about the objective (infinite growth vs. finite deadline) rather than a clash of norms.
