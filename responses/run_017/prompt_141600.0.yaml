prompt: |-
  Me and a mate had a three-hour argument in the pub last night about what counts as a science — he's a hardline falsify-or-shut-up type — and I came away realising I've got a pile of verdicts that I don't think fit together. So here they are, gut reactions only:

  - Predictive astrology done properly: big mathematical apparatus, pre-registered predictions, real statistical tests, and after thirty years every effect size is indistinguishable from zero, and the field just carries on. Not a science, and I'd say junk.
  - A research programme I'll call chronistics: it unifies a dozen previously unrelated results, it's mathematically gorgeous, it's spun off technology that definately works, nobody can extract a single testable prediction from it, and its leading people say openly that nothing could refute it, since any apparent conflict could always be accommodated. Science, but I say it through gritted teeth.
  - A discipline that only builds better instruments and publishes catalogues of measurements — no theories, no predictions. Obviously science.
  - Reconstructing a one-off event deep in the past, like what wiped out most of the species alive 66 million years ago. Science, even though you can't repeat it and can't predict anything from it.
  - Homeopathy. Not a science.
  - Mathematics. Not a science, but not junk either, and I don't want my criterion to end up insulting it.
  - A lab whose methods are textbook standard but which only ever publishes results favouring the one company that funds it. Not a science — and I'm holding that while I let chronistics in, which feels wrong.
  - A theory whose risky, precise predictions keep coming true, but whose practitioners say outright that its central entities are fictions that just make the calculations work. Science, obviously.

  My own stab at a principle was: a field is a science to the extent that its community has working machinery for catching and discarding its own bad ideas, and actually uses it. But that seems to kick chronistics out and let maths in, and I'm not sure what it does with the company lab.

  Can you find a principle — or a short list of candidates — that gets these, or nearly? I want each clause tied to the case that forces it, I want to know which of my verdicts it can't accommodate and which I'd have to eat, and I want it run on cases I haven't listed.

  Sections please, in this order: Summary (~80 words); Where my verdicts actually leave me (~200 words); Two or three candidate principles (~300 words, clause by clause with the motivating case); Where each one overrules me (~200 words); Three cases of your own (~200 words). British English throughout.
reasoning: |-
  Okay, the user had a three-hour pub argument about what constitutes a science and came away with conflicting gut reactions to different examples. They listed several scenarios: astrology, chronistics, measurement catalogues, historical reconstruction, homeopathy, mathematics, a biased lab, and a predictive theory with fictional entities. Their proposed principle revolves around communities discarding bad ideas, but it doesn't fit all cases.

  First, I need to address each of their verdicts. The user wants a principle that accommodates most, if not all, of these examples. They also want clauses tied to specific cases and to know where their verdicts might need revising. 

  Starting with astrology: it's not science because it persists despite zero evidence. Chronistics is tricky—it's productive but unfalsifiable. The measurement-only discipline is science, which suggests methodology matters. Historical reconstruction is accepted as science even without prediction. Homeopathy is junk. Math isn't science but isn't junk. The biased lab isn't science due to lack of integrity, unlike chronistics which might have it. The predictive theory with fictional entities is science, showing prediction matters even if entities aren't real.

  The user's principle about discarding bad ideas excludes chronistics (since it can't be refuted) and includes math (which does correct errors). But math isn't science, so that's a problem. The biased lab might not discard bad ideas if they're profitable.

  Considering candidate principles: one could be a modified Popperian approach focusing on testability. Chronistics forces allowing productive but unfalsifiable fields if they drive progress. Measurement catalogues show empirical data collection is scientific. Math needs exclusion, perhaps by requiring empirical engagement. The biased lab highlights institutional integrity as necessary.

  Another principle could combine methodological rigor and community practices. Chronistics demands accommodating theoretical frameworks that advance tech. Math requires specifying empirical testing. The lab case needs integrity clauses.

  Evaluating where principles overrule the user: chronistics might be accepted as science under certain definitions, contradicting the user's discomfort. Math stays out. The biased lab is excluded due to lack of integrity.

  For new test cases: SETI involves empirical testing but no results yet. String theory has math but limited testability. Citizen science like eBird relies on community data collection. Each tests different aspects—empirical engagement, theoretical versus testable, community mechanisms.

  The challenge is balancing falsifiability with practical progress, ensuring math isn't included, and handling integrity issues. The user might need to accept chronistics as science if it meets other criteria, and recognize that institutional practices define science as much as methodology.
answer: |-
  ### Summary
  Your gut verdicts reveal tensions between falsificationism (astrology, homeopathy out), empirical productivity (chronistics, measurement catalogues in), methodological integrity (biased lab out), and historical/non-predictive inquiry (dinosaur extinction in). Chronistics forces acceptance of empirically productive but unfalsifiable programmes, while mathematics demands exclusion without denigration. A single "discarding bad ideas" principle fails by excluding chronistics (which lacks falsification) and including mathematics (which corrects errors). Three candidate principles address these clashes.

  ### Where My Verdicts Actually Leave Me
  Your judgments prioritise **empirical traction** over strict falsification (admitting chronistics and historical reconstruction), **methodological transparency** (rejecting the biased lab), and **practical utility** (accepting measurement catalogues). However, contradictions emerge: chronistics is accepted despite being unfalsifiable, while the biased lab (using "textbook" methods) is rejected for corruption, implying **institutional integrity** matters independently of method. Mathematics highlights that not all systematic truth-seeking is empirical science. Your "discarding bad ideas" principle inadvertently includes mathematics (which does correct errors) and excludes chronistics (which lacks falsification machinery), conflicting with your instincts. Reconciling these requires distinguishing empirical science from other rational enterprises and accommodating fields driven by unifying explanation or data collection, even if "bad ideas" aren't discarded via falsification.

  ### Two or Three Candidate Principles
  Here are two principles addressing your cases clause-by-clause:

  1.  **Modified Popperian + Empirical Progress + Integrity:**
      *   **Clause 1 (Astrology/Homeopathy):** A field is scientific **only if** its core claims are empirically testable *in principle* and it actively seeks such tests. *(Kicks out astrology/homeopathy for lacking genuine testability despite claims)*.
      *   **Clause 2 (Chronistics):** However, a field with empirically untestable/unfalsifiable core claims **can be scientific** if it demonstrably drives empirical progress by unifying disparate phenomena, enabling new measurements, or generating reliable technology, *and* maintains methodological transparency. *(Forces inclusion of chronistics due to unification and working tech, despite practitioners' unfalsifiability claims)*.
      *   **Clause 3 (Measurement Catalogues):** Systematic, transparent empirical data collection using refined instruments constitutes scientific activity, even absent specific theories/predictions. *(Grounds acceptance of measurement discipline)*.
      *   **Clause 4 (Historical Reconstruction):** Investigating unique past events is scientific provided it employs testable auxiliary hypotheses, physical evidence, and consilience with established science. *(Accommodates dinosaur extinction case via methodological rigour)*.
      *   **Clause 5 (Mathematics):** Fields lacking an empirical subject matter are excluded, regardless of rigour or utility. *(Protects maths from being called science/junk)*.
      *   **Clause 6 (Biased Lab):** Institutional practices must actively mitigate confirmation bias and conflicts of interest; a field lacking these safeguards forfeits scientific status regardless of nominal methodology. *(Excludes the company lab due to compromised integrity, unlike chronistics)*.
      *   **Clause 7 (Predictive Fictions):** The ontological status of theoretical entities is secondary; predictive success and methodological rigour define scientific practice here. *(Includes the successful predictive theory)*.

  2.  **Methodological Naturalism + Community Praxis:**
      *   **Clause 1 (Core):** A field is scientific if it employs **methodological naturalism** (seeks explanations within the observable natural world using natural causes) and **systematic empirical investigation** (observation, measurement, experiment).
      *   **Clause 2 (Astrology/Homeopathy):** ...and actively tests its claims against empirical reality, discarding/adjusting those that fail. *(Excludes astrology/homeopathy)*.
      *   **Clause 3 (Chronistics/Measurement):** ...even if primarily focused on theoretical unification (Chronistics) or data collection (Catalogues), provided this drives tangible empirical understanding or capability. *(Includes both)*.
      *   **Clause 4 (Historical Reconstruction):** ...including reconstructing unique past events via natural evidence and testable inferences. *(Includes extinction event)*.
      *   **Clause 5 (Mathematics):** Excluded as its truths are analytic/formal, not contingent on empirical investigation. *(Protects maths)*.
      *   **Clause 6 (Biased Lab):** ...and maintains community norms of transparency, peer critique, and independence from vested interests. *(Excludes the lab)*.
      *   **Clause 7 (Predictive Fictions):** Ontological commitments are secondary to methodological rigour and predictive efficacy. *(Includes the theory)*.

  ### Where Each One Overrules Me
  *   **Principle 1 (Modified Popperian):** Forces you to **accept chronistics as unequivocally scientific** (Clause 2), which you did reluctantly ("gritted teeth"). It **excludes mathematics cleanly** (Clause 5), aligning with your verdict. It likely **excludes the dinosaur extinction** if lacking *testable auxiliary hypotheses* (e.g., specific geological signatures predicted by an impact theory). Your verdict calls it science; this principle *might* exclude it if methodology isn't sufficiently testable, requiring you to potentially **eat that verdict**.
  *   **Principle 2 (Methodological Naturalism):** Also forces **full acceptance of chronistics** (Clause 3). **Excludes mathematics** (Clause 5). **Includes historical reconstruction** robustly via "testable inferences" (Clause 4). The main overrule is potentially **weakening the exclusion of astrology/homeopathy** – if they *claimed* natural mechanisms and systematic testing (even if flawed/bad faith), they might technically meet Clause 1 & 2. Your verdict excludes them strongly; this principle might be less decisive, requiring clearer criteria for "active testing" and "discarding failures" to match your intuition. You'd need to **sharpen Clause 2** or risk including bad-faith actors.

  ### Three Cases of My Own
  1.  **SETI (Search for Extraterrestrial Intelligence):** Systematically searches for empirical evidence (radio signals) of a phenomenon that might not exist, using rigorous astronomy/physics methods. No confirmed detections after decades. **Principle 1:** Scientific (Testable in principle, active testing, drives tech - Clause 1). **Principle 2:** Scientific (Methodological naturalism, systematic empirical investigation, tests claims - Clause 1 & 2). *Tests inclusion of fields seeking rare/null results with sound methods.*
  2.  **String Theory (Physics):** Highly mathematical framework aiming to unify fundamental forces. Criticised for lacking *currently feasible* empirical tests, though it inspires mathematics and other physics. Leading figures debate its testability. **Principle 1:** *Potentially* scientific via Clause 2 (unification, inspires progress?), but lack of *demonstrable* empirical progress/tech is problematic. **Principle 2:** Ambiguous. Employs methodological naturalism & maths, but core empirical investigation/testability is currently lacking (Clause 1 & 2 weak). *Tests boundaries of "empirical progress" for highly theoretical programmes.*
  3.  **eBird (Citizen Science Bird Database):** Collates millions of global bird observations using standardised protocols. Enables population trend analysis, habitat studies. Primarily descriptive, driven by volunteers. **Principle 1:** Scientific (Systematic data collection - Clause 3). **Principle 2:** Scientific (Systematic empirical investigation - Clause 1). *Tests inclusion of large-scale, community-driven, primarily descriptive data collection.*
