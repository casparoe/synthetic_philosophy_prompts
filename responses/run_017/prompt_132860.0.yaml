  Below is a concise flowchart (decision tree) for bankroll management, designed as a one-page handout. It starts from a repeatable +EV bet with reinvestment and ends at a named bet-sizing strategy. The tree is built from the logical space first, with branch nodes based on concrete, answerable questions (no abstract risk-preference queries). Leaves cover your specified cases and named positions, with ≤10 leaves.  

  ### Bankroll Management Flowchart  
  **Start**: You have a repeatable +EV bet; you can reinvest winnings.  

  1. **Are you highly confident your edge is positive?**  
     - *No* → Go to 2.  
     - *Yes* → Go to 3.  

  2. **If your edge is wrong, is expected loss catastrophic (e.g., total ruin)?**  
     - *Yes* → **Leaf: Size-zero** (Bet nothing; you’re likely the sucker).  
     - *No* → **Leaf: Robust/Bayesian Kelly** (Shrink edge estimate via Bayesian updates; bet fractionally).  

  3. **Is there a specific target $X by fixed date T?**  
     - *Yes* → **Leaf: Maximize P(hit-the-target)** (Size bets to max chance of reaching $X by T; ignores growth for goal focus).  
     - *No* → Go to 4.  

  4. **Is there a minimum bankroll $Y (ruin level)?**  
     - *Yes* → **Leaf: Ruin-constrained sizing** (Cap bet size to keep ruin probability < threshold; e.g., fractional Kelly).  
     - *No* → Go to 5.  

  5. **Is there a maximum bankroll $Z (saturation, e.g., $50M+ useless)?**  
     - *Yes* → **Leaf: Power-utility maximization** (Max EU via concave utility; flattens above $Z; CRRA common).  
     - *No* → Go to 6.  

  6. **Do bets resolve simultaneously/correlated (not sequential)?**  
     - *Yes* → **Leaf: Full Kelly (vector)** (Size bets jointly to max E[log] for portfolio; edge known).  
     - *No* → Go to 7.  

  7. **Can the opportunity vanish randomly after any round?**  
     - *Yes* → **Leaf: Fractional Kelly** (Bet < full Kelly; reduce short-term volatility/ruin risk).  
     - *No* → Go to 8.  

  8. **Is avoiding large drawdowns critical (e.g., psychological limits)?**  
     - *Yes* → **Leaf: Fractional Kelly** (Trade growth for stability; e.g., ½ Kelly).  
     - *No* → **Leaf: Full Kelly** (Maximize E[log(wealth)]; optimal long-run growth & median).  

  ---  
  **Leaf Count**: 8  
  **Key**:  
  - **Full Kelly** = Time-average/ergodicity growth max (same math as Kelly; no separate leaf).  
  - **Median maximization** not a leaf: Converges to full Kelly for repeated bets.  
  - **Fractional Kelly** used for multiple cases (random horizon, drawdown aversion); distinct from power utility via Q5/Q8.  

  ### Indistinguishable Leaves & Empty Regions  
  - **Indistinguishables**:  
    - **Fractional Kelly, Robust Kelly, Ruin-constrained sizing** all imply “bet less.” Tree separates via:  
      - *Robust Kelly*: Triggered solely by edge uncertainty (Q1→Q2).  
      - *Ruin-constrained*: Triggered by minimum bankroll $Y (Q4).  
      - *Fractional Kelly*: Triggered by random horizon (Q7) or drawdown aversion (Q8).  
    - **Power utility vs. saturation**: Power utility leaf (Q5) handles saturation; no need for separate leaf.  

  - **Empty Regions** (Unnavigated combinations):  
    - **Edge uncertainty + saturation**: Not covered. *Why*: Unattractive—betting when uncertain and gains saturate is rarely coherent. Tree prioritizes edge check first.  
    - **Random horizon + target**: Not covered. *Why*: Incoherent—fixed-date targets clash with random endpoints. Use `maximize P(hit-the-target)` and accept suboptimality.  
    - **Simultaneous + uncertain edge**: Not covered. *Why*: Unexplored—no standard method. Tree assumes edge known for joint bets (Q6).  

  ### Rationale  
  - **Structure**: Branches prioritize edge certainty → goal constraints → bet properties → risk proxies (drawdowns). Logical and newcomer-accessible.  
  - **Cases Handled**:  
    - Known edge → Full Kelly (vector if simultaneous).  
    - Uncertain edge → Robust/size-zero.  
    - Target + ruin → Maximize P(hit-the-target).  
    - Saturating bankroll → Power utility.  
    - Random horizon → Fractional Kelly.  
  - **Efficiency**: 8 leaves cover all cases; median/saturating utility collapsed into existing leaves.  

