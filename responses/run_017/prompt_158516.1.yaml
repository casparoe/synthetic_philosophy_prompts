prompt: |-
  I sit on the methods committee of a psychology journal that is rewriting its editorial policy, and I keep coming back to a norm that nearly everyone in my field accepts but that nobody on the committee can state precisely. The norm is that a hypothesis earns much less confirmatory credit if it was formulated after the investigators saw the data. Concretely: we run "registered reports," in which the design and analysis plan are peer-reviewed and time-stamped before data collection and the paper is accepted in principle whatever comes out; we treat hypotheses reverse-engineered out of a finished dataset — the thing the methodological literature calls HARKing — as nearly worthless as evidence, even when the fit the authors report is excellent and would have impressed us if it had been predicted in advance; and we are now toying with making this quantitative, by attaching to every piece of evidence a "novelty weight" between 0 and 1, set by how much of the hypothesis was fixed in a sealed archive before the data existed, to be multiplied into whatever evidential score the study would otherwise receive. What puzzles me is that the same community, in the same breath, treats explaining facts that were already on the books as the highest form of scientific achievement. Biologists still cite it as the strength of a unifying theory that it accounts for a pile of previously unrelated, long-known findings — anatomical homologies, island distributions, the sequence of forms in the fossil record — none of which anyone predicted. Physicists treat the recovery of Mercury's anomalous perihelion precession, a discrepancy of a few dozen arcseconds per century that had been on the books since 1859, as a triumph of general relativity rather than a discount. And in astronomy and genomics, purely exploratory work — dredge the survey, spot the pattern, then think of the mechanism — is normal, prestigious practice rather than a scandal. We seem to be doing X on Tuesdays and Y on Thursdays.

  A colleague says this is all one worry in disguise, and I cannot tell whether she is right. As I see it there are three candidate worries the norm might be tracking. First, that the fact was already known before the theory existed — the sheer "oldness" of the evidence, which is what people are pointing at when they note that on a straightforward Bayesian picture the evidence already has probability 1 for you, so conditioning on it cannot move you at all, the familiar complaint that probabilistic confirmation theory has trouble with old evidence. Second, that the data did double duty, being used to construct the hypothesis and then again to test it — the worry you get from a large hypothesis space plus an unblinded search, where with enough candidate hypotheses some of them will fit any dataset you like. Third, that the hypothesis could have been read off the old data by anyone who had the data and some ingenuity, whether or not it actually was; I have been calling this the "derivability audit," and my hunch is that it, rather than oldness or double-duty, is the thing our novelty weight ought really to be estimating. Are these three the same worry in different clothes, or genuinely different ones, and which of them does our actual practice track? More to the point: what would my committee be committing itself to by adopting the novelty weight? Would we have to hold that confirmation is not a two-place relation between a hypothesis and a body of evidence but a three-place one that also takes in the order of inquiry and who knew what when? Would we have to hold something irreducibly non-probabilistic — for instance, that a theory's explanatory unification of already-known facts is evidence in its own right, and not merely a symptom of a favourable likelihood ratio? Or is there a reading on which the whole policy is consistent with an austere probabilism: pre-registration as a mere instrument for keeping the effective hypothesis space and the reported likelihood honest, and old evidence handled by conditioning on the discovery that the theory entails the fact, or by reinstating the probability one would have assigned the fact before one learned it?

  Please write your answer in the following six sections, with roughly these lengths: "The implicit theory" (about 300 words) — reconstruct as charitably as you can the view of evidence and confirmation that this editorial practice only makes sense under; "Strict presuppositions vs. convenient fits" (about 150 words) — separate what the practice cannot survive without from what it merely sits well with; "Oldness, double-duty, derivability" (about 250 words) — say whether the three worries coincide and which one the practice is actually tracking, with the case that discriminates between them; "The novelty weight" (about 200 words) — whether a single scalar is even coherent here, what a derivability audit would have to measure, and whether that is measurable in practice; "Under a strict probabilist picture" (about 200 words) — what would concretely have to change in editorial practice if we went Bayesian through and through, including anything we would have to stop doing; and "Bottom line" (about 80 words) — one recommendation to the committee, and the single sub-question on which it turns.
reasoning: |-
  Hmm, this is a sophisticated methodological puzzle about scientific evidence and hypothesis testing. The user is grappling with an apparent contradiction in how psychological science treats preregistered hypotheses versus post-hoc explanations of existing data, while other fields seem to value explanatory unification of known facts. 

  The core tension lies in three potential concerns the "novelty weight" might address: (1) the old evidence problem (Bayesian updating can't handle known facts), (2) double-dipping (using data to generate and test hypotheses), and (3) derivability (could the hypothesis have been extracted from existing data). 

  I need to analyze whether these are distinct issues. The Mercury perihelion example is particularly telling: though the data was old, it wasn't used to construct relativity, nor was it derivable from existing theories - which explains why it's treated as strong evidence. This suggests derivability is the key concern.

  For the novelty weight proposal, I'm skeptical. Measuring "could this have been derived" is practically impossible and context-dependent. The committee might be better served by distinguishing exploratory from confirmatory research, rather than inventing a quantitative metric. 

  Under strict Bayesianism, we'd have to abandon novelty weighting entirely and focus on likelihood ratios. But in practice, preregistration remains valuable as a guard against hypothesis fishing. The recommendation should emphasize that while explanatory power matters, it's categorically different from predictive success.
answer: |-
  ## The implicit theory
  The editorial practice implicitly endorses a **diachronic view of evidence** where the *sequence of cognitive events* fundamentally shapes evidential weight. Under this view, confirmation isn't merely about logical relations between propositions (H and E), but about how knowledge was actually generated. A hypothesis gains maximal credit when it *successfully resolves uncertainty* about future observations ("prediction"), while merely accommodating known facts ("postdiction") resolves less uncertainty. This aligns with a **severe testing philosophy** (Mayo, 2018): hypotheses should face data that could plausibly have falsified them, and post-hoc fits avoid this risk by being tailored to evade falsification. The practice also assumes **human cognitive biases** (e.g., hindsight bias, motivated reasoning) make post-hoc theorizing epistemically hazardous; without temporal separation between hypothesis formulation and data access, error control is compromised. Crucially, it values *novel predictions* as uniquely demonstrating a theory's power to constrain expectations about the world. Unifying old facts is prized *only* when it emerges as an unexpected *consequence* of a theory developed independently, not as its genesis.

  ## Strict presuppositions vs. convenient fits
  **Strict presuppositions:**
  1.  **Sequence matters intrinsically:** The temporal order of hypothesis formulation relative to data access is epistemically significant, not just pragmatically useful.
  2.  **Cognitive bias is pervasive:** Humans cannot reliably separate hypothesis generation from confirmation when data is unblinded, necessitating procedural safeguards.
  3.  **Prediction > Accommodation:** Successfully predicting *unknown* outcomes provides stronger evidence than merely explaining known ones.

  **Convenient fits (compatible but not required):**
  1.  **Strong Bayesianism (with old evidence problem):** The practice *can* be described within probabilistic frameworks struggling with P(E)=1.
  2.  **Falsificationism:** While aligned with Popperian spirit, the practice doesn't strictly require falsifiability as the sole demarcation criterion.
  3.  **Eliminating HARKing:** The norm targets HARKing, but its *justification* rests on deeper epistemic principles, not merely avoiding dishonesty.

  ## Oldness, double-duty, derivability
  These are **distinct but often correlated worries**. "Oldness" concerns the evidence's prior establishment (P(E)=1). "Double-duty" concerns the *process* (using E to generate H, then confirm H). "Derivability" concerns the *logical/statistical possibility* that H *could* have been extracted from E *before* H was proposed, regardless of the actual process or the evidence's age.

  **The Practice Tracks Derivability:** The key discriminant is the **Mercury perihelion case**. The data was *old* (known since 1859) and Einstein *did* know it. Yet it's considered strong evidence for GR. Why? Because:
  *   **Derivability was absent:** Newtonian physics *could not* derive the anomaly; it was a known recalcitrant fact. GR provided the first derivation. Crucially, GR wasn't *constructed* to fit Mercury (Einstein focused on light bending); the fit was a surprising *consequence*. The norm discounts hypotheses that *could* have been reverse-engineered from the specific dataset used to test them. Mercury's anomaly couldn't be reverse-engineered into GR *from Newtonian data alone*; GR introduced fundamentally new structure. In contrast, HARKing produces hypotheses tightly derivable (often trivially) from the specific dataset at hand.

  ## The novelty weight
  A single scalar "novelty weight" is **conceptually coherent but practically fraught**. It aims to quantify the **degree of independence** between H and E – essentially, measuring how surprising E was *given only the knowledge available before H was formulated and the data seen*. A "derivability audit" would need to assess:
  1.  **The effective hypothesis space:** How many plausible alternative hypotheses existed *before* seeing E?
  2.  **The search procedure:** How exhaustively and flexibly was that space explored *using E*?
  3.  **The algorithmic complexity:** How difficult is it to derive H from E using standard methods?
  Measuring this is **extremely difficult**. It requires reconstructing the pre-data knowledge state and modeling the cognitive/search process, which is subjective and context-dependent. The weight would often be arbitrary or gameable. It risks replacing a qualitative norm with a pseudo-quantitative veneer.

  ## Under a strict probabilist picture
  Adopting strict probabilism (Bayesianism through-and-through) would necessitate **significant changes**:
  1.  **Abandon Novelty Weighting:** Confirmation is solely P(H|E)/P(H) or variants. The sequence of discovery is irrelevant; only the logical relation and prior probabilities matter.
  2.  **Reinterpret Pre-registration:** It becomes *only* a tool to:
      *   **Constrain the Likelihood:** Pre-specifying analyses fixes P(E|H) honestly, preventing cherry-picking.
      *   **Control Hypothesis Space:** Pre-registration limits the set of H considered, counteracting "fishing" that inflates P(E|H) by trying many H.
      *   **Handle Old Evidence:** Use counterfactual priors ("What would I have believed about E *before* knowing it?") or condition on "H entails E" (Garber, 1983).
  3.  **Elevate Explanatory Unification:** Successfully explaining diverse *known* facts (E1, E2,... En) *must* increase P(H) by demonstrating high likelihood P(E1,E2,...En|H) despite potentially low prior probability of observing that conjunction under alternatives. Its evidential value isn't "discounted" due to oldness.
  4.  **Deprioritize Temporal Sequence:** The distinction between prediction and postdiction becomes pragmatically useful for bias control, not fundamentally epistemic. HARKing is bad because it hides the true size of the hypothesis space searched, misrepresenting P(E|H).

  ## Bottom line
  **Recommendation:** Reject the quantitative "novelty weight" as impractical and potentially misleading. Instead, maintain the qualitative distinction between confirmatory (pre-specified) and exploratory (post-hoc) research, clearly labeling the latter. **Crucial Sub-Question:** Does the committee believe the *temporal sequence of discovery* is *intrinsically* epistemically significant (justifying novelty discounting), or is it merely a *pragmatic tool* for combating bias and ensuring honest reporting of likelihoods within a fundamentally probabilistic framework? Your editorial policy hinges on this philosophical commitment.
