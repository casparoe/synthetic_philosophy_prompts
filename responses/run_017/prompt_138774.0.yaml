prompt: |-
  So I read scripts for a very small production company that does mostly historical dramas, and I'm also on the committee for a modest grant that's meant to reward "responsible" storytelling about real people, and the two things together mean I spend a lot of time arguing about what we owe the actual dead when we dramatize them. We never get anywhere, so I thought I'd write down my own gut verdicts and see whether there's a real principle hiding in them. I know philosophers argue about whether the dead can be harmed at all — the old line that death is nothing to us — and I don't want to get stuck there; assume for the sake of argument that something can be owed to them, and give me the principle for the cases. My verdicts: (1) A biopic of a 1930s labour organizer (call her M.) invents a scene where she sleeps with a strikebreaker during a bad patch. It never happened, there's no record of anything like it, nobody who knew her is alive. I think it's not fine. (2) The same film invents her assistant, a fictional young woman who stands in for the dozens of unnamed women in the local. Totally fine, maybe better than picking a real one and pinning a made-up life on her. (3) A novel about a nineteenth-century naturalist where every conversation is taken from his published letters and every event is documented, but reordered so it reads as a slow loss of faith ending in a deathbed crisis — when his letters say repeatedly and explicitly that he never doubted. Nothing is false; the shape is. This feels worse to me than (1), which is strange since (1) has a fabricated event and this has none. A colleague calls things like this "frankenscenes," but it isn't a scene, it's the whole arc. (4) A real humanitarian who forged her war record and invented a rescue that never happened, and whose public life was built on it. A project wants to depict the forgery. Fine — I'd say required. (5) A documented incident where a lifelong pacifist, at nineteen, badly beat a man in a bar; everyone who knew him later says it was the thing he was most ashamed of and tells you nothing about who he was. I don't like using it. Is that consistent with (1)? Both are "here's the moment that makes them look bad," and I'm much more bothered by the invented one than the true one, which feels backwards. (6) A drama set during a real famine, every character invented, no one identifiable, but it ends with an invented friendship and a small act of mercy that makes the whole thing feel endurable. Not fine — and this seems like a different wrong from (1), not misrepresenting anybody so much as lying about the shape of the event, though I can't say why it's different. (7) A real person of whom three facts survive — born here, wrote one letter, died in a fire — so that any story is ninety-nine percent invention. Weirdly fine, or at least much less bad than (1). (8) The subject signed a note before dying: tell the whole truth about me, whatever you find, I don't care how it looks. I don't think that licenses everything, but I can't say what the limit is.

  The rule I keep falling back on is something like: you may compress, you may invent minor people, you may even leave ugliness out by omission; what you may not do is add a positive detail — an event, a line, a relationship — that the real person would have refused as a description of themselves, and you may not arrange true details so that they add up to such a description either. But (4) breaks that immediately: the humanitarian would have refused the truth, and showing it is not just permitted but right. So the rule needs repairing or replacing, and I'd like to know which clause is doing the damage and what the repaired version predicts for cases I haven't listed — say, a musical-comedy version of someone's life, or casting an actor whose body is nothing like the real person's, or the thing we're now getting asked about constantly, generating a voice to say lines the real person never said. And then there's the one I actually care about and go back and forth on: my grandmother, dead twelve years, and the stretch of her life she never spoke about and my mother says I shouldn't touch.
reasoning: |-
  Okay, the user works with historical dramas and a grant committee focused on "responsible" storytelling about real people. They're struggling to find a consistent principle for what we owe the dead when dramatizing their lives. They listed eight specific cases with their gut reactions and proposed a rule that seems to break on case (4). The challenge is to repair or replace that rule while addressing their examples and additional scenarios.

  First, I need to understand their core concern. They want a principle that respects the dead without getting stuck in philosophical debates about whether the dead can be harmed. Their proposed rule focuses on avoiding additions that the person would reject as self-descriptions, but it fails with the humanitarian forger where telling the truth is necessary despite her objections. 

  Looking at their cases: Why is inventing a shameful act (1) worse than depicting a real shameful act (5)? And why is the reshaped naturalist's arc (3) worse than both? The famine story (6) feels wrong despite invented characters—it's about misrepresenting the event's nature. The obscure figure (7) gets more leeway because there's little to distort. The deathbed permission (8) has unclear limits.

  Their grandmother's untold story is the personal stake here. The mother's "don't touch" warning creates tension between truth and privacy. The user needs a framework that navigates this.

  The key insight might be shifting from "what the person would refuse" to "what distorts their documented identity." The dead can't be harmed, but their legacy—how they're remembered—can be misrepresented. This affects historical understanding and communal memory.

  For the humanitarian (4), exposing her forgery corrects a false legacy; it's restorative. Whereas inventing an affair (1) or reshaping the naturalist's arc (3) imposes false narratives. The pacifist's real but uncharacteristic act (5) is part of his history but needs contextualization to avoid distortion.

  The famine example (6) is tricky. Invented mercy might soften the horror, betraying the victims' reality. It's about the event's truth, not individual misrepresentation. The rule should address historical integrity broadly.

  For the obscure person (7), minimal records mean almost all invention, but as long as it doesn't contradict known facts, it's acceptable—there's little identity to distort. The deathbed permission (8) allows more but not outright lies; the limit is probably avoiding malicious falsehoods.

  Additional cases: Musical comedies might be fine if framed as parody, not factual. Body dissimilarity matters only if it's key to their identity (e.g., a disability activist played by an able-bodied actor). AI-generated voices saying unspoken lines cross a line—it fabricates their voice/language, core to identity.

  For the grandmother: The mother's request likely stems from protective privacy. The principle would permit exploration if it doesn't distort known facts or violate family trust, but sensitivity is crucial. If the untold story involves trauma, misrepresentation risks harm to living relatives and historical accuracy.

  Repaired rule: **"Avoid introducing or arranging factual elements in ways that materially distort the subject’s documented identity or the historical event’s essential nature, especially when this imposes meaning they explicitly rejected or compounds existing misrepresentation."**

  This handles:
  - (1)/(3): Distorts identity via invented shame/rejected narrative.
  - (4): Corrects distortion; necessary for accuracy.
  - (5): Real but unrepresentative; contextualize to avoid distortion.
  - (6): Distorts the event’s nature (famine ≠ endurable).
  - (7): Minimal distortion possible; acceptable.
  - (8): Permission eases constraints but fabrication remains unethical.

  Grandmother case: Tread carefully. "Don’t touch" may signal privacy/accuracy concerns. If stories must be told, anchor to evidence, avoid speculation, respect family boundaries. The harm isn’t to the dead but to living memory and relational bonds.
answer: |-
  You've hit on a profound tension in historical storytelling: how to balance truth, artistry, and respect for the dead when "the dead" can't consent or correct the record. Your gut reactions are remarkably consistent, and your proposed rule is close—it just needs reframing around **documented identity** rather than projected refusal. Let's break this down.

  ### Core Principle: Protect the Documented Identity
  **The rule:** *You owe the dead (and the living) a commitment not to materially distort their documented identity or the essential nature of historical events. "Documented identity" means the core self evidenced by their own words, actions, or reliable contemporary accounts. "Material distortion" occurs when inventions or arrangements contradict this evidence in ways that redefine who they were or what happened.*

  This avoids the "would they refuse?" trap (which fails your case #4) by focusing on *evidence*, not speculation. It also sidesteps philosophical debates about "harming the dead" by grounding ethics in historical integrity and the impact on living communities (family, cultural groups, scholarship). Now, let's test it against your cases:

  ---

  ### Applying the Principle to Your Cases
  1. **Invented affair with a strikebreaker (no evidence)**  
     → *Not fine*. It distorts her documented identity as a labor organizer by imposing a betrayal that redefines her commitment. Even without living witnesses, it substitutes fiction for her actual legacy.  
     *Why worse than #5?* Because #5 is true (if unrepresentative), while this *creates* a false identity.  

  2. **Fictional assistant representing real people**  
     → *Fine*. She doesn’t distort M.’s identity or replace a specific person. Composite characters avoid pinning invented flaws/actions on real individuals.  

  3. **Reordering a naturalist’s life to imply a faith crisis (against his explicit words)**  
     → *Worse than #1*, as you sensed. Even with "true" parts, the arrangement imposes a narrative he explicitly rejected—a direct assault on his documented identity. It’s not a "frankenscene" but a "frankennarrative."  

  4. **Depicting a humanitarian’s forged war record**  
     → *Required*. Her documented identity *includes* the fraud—it’s central to her public legacy. Omitting it would distort who she was and perpetuate her deception.  

  5. **Real but uncharacteristic violent act by a pacifist**  
     → *Use with caution*. If included, it must be contextualized (e.g., showing his remorse, growth, or how it shaped his pacifism). Isolating it distorts by reducing him to this moment. But it’s *less bad* than #1 because it’s factual—your gut is right.  

  6. **Invented "hopeful" ending to a famine drama (fictional characters)**  
     → *Not fine*. It distorts the *event’s* essential nature. Famines are defined by systemic failure and trauma; imposing artificial hope misrepresents history, betraying victims and survivors. Different from #1 because it targets collective truth, not individual identity.  

  7. **Obscure figure with only 3 facts; 99% invention**  
     → *Mostly fine*. With minimal documented identity, there’s little to distort. Invention becomes inevitable, but it must align with the era and known facts (e.g., don’t make them a villain if no evidence supports it).  

  8. **Deathbed permission: "Tell the whole truth"**  
     → *Not a blank check*. You still can’t *invent* negative acts (e.g., "she stole from orphans"). Permission eases constraints on *omitted* truths but doesn’t license fabrication. The limit: don’t create a false identity.  

  ---

  ### Repairing Your Proposed Rule
  Your original rule stumbled on "what the person would refuse." The repair flips it:  
  > **"You may compress, invent composites, or omit inconsequential truths, but you may not add or arrange details in ways that materially contradict the subject’s documented identity or the historical event’s essential character."**  

  **Why this works for #4:** Showing the humanitarian’s forgery *aligns* with her documented identity (exposing the fraud she built). It’s not an "added" negative—it’s correcting the record.

  ---

  ### Handling New Cases
  - **Musical-comedy version of someone’s life**  
    → Fine *if* framed as satire/fantasy (e.g., *Hamilton*). Not fine if presented as factual (distorts identity via exaggeration/trivialization).  

  - **Casting an actor with a dissimilar body**  
    → Problematic *if* the body is key to their identity (e.g., casting an able-bodied actor as FDR hides his disability’s role in his resilience). Less critical if physicality wasn’t defining (e.g., a portly poet played by a thin actor).  

  - **AI-generated voice saying unspoken lines**  
    → High risk. If lines align with documented views (e.g., Lincoln "saying" quotes from his letters), it’s compressed truth. If invented (e.g., "Lincoln confesses doubt about emancipation"), it fabricates identity. Never use for intimate/fraught content (e.g., your grandmother’s unsaid regrets).  

  ---

  ### Your Grandmother’s Untold Story
  This is the heart of your dilemma. **Principle applied:**  
  - **Don’t invent.** If you lack evidence for that "stretch," inventing scenes (e.g., trauma, affairs, motives) risks distorting her identity.  
  - **But silence isn’t sacred.** If you have letters, diaries, or witness accounts, *truthful* depiction honors her. Your mother’s "don’t touch" may reflect family privacy or pain—not the dead’s wishes. Weigh harm to the living.  
  - **A path forward:** Write it as unresolved mystery ("She never spoke of those years, but we know she moved to X..."). This respects gaps without fabrication.  

  **The limit:** If her silence itself *is* her documented identity (e.g., she burned her journals to protect secrets), inventing details violates that. But if it’s just family caution, proceed gently with evidence.

  ---

  ### Why This Principle Holds
  - **It’s measurable:** Rooted in evidence, not guesswork about "what they’d want."  
  - **It serves history:** Prevents replacing real people/events with convenient fictions.  
  - **It’s flexible:** Allows artistry (compression, composites) while drawing bright lines at distortion.  
  - **It acknowledges stakes:** Misrepresentation harms living communities, trust in history, and cultural memory.  

  Your cases reveal a hierarchy of wrongs:  
  **Most serious:** Inventing *or* arranging truths to distort identity (your #1, #3).  
  **Less serious but still unethical:** Distorting events (#6) or exploiting gaps (#7 without constraints).  
  **Permitted:** Correcting the record (#4), representing groups (#2), contextualized facts (#5).  

  For your grandmother: Focus on what’s documented. If nothing exists, leave the silence as part of her story—don’t fill it with ghosts. That, in itself, is a form of respect.
