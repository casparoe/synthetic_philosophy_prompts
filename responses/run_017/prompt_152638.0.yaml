answer: |-
  You've aimed well at the nerve. I'll take the single-patient case first because it sharpens the clash: one life, discounted against itself. Yes, I tell the forty-year-old that preventing her migraine at forty-one matters more than preventing identical suffering at eighty. She may be temporally neutral *within* her own life, but society isn't. Public resources are allocated by the living, *now*, for beneficiaries who exist *now* – including her forty-year-old self. Her future eighty-year-old self cannot vote, pay taxes, or hold us accountable. Our institutional obligation runs to present persons and their current welfare claims. To ignore the calendar is to pretend we govern from a timeless Archimedean point. We don't. We govern from 2024, with duties anchored in the present. Why should democratic authority bend to an individual's personal temporal neutrality when spending collective resources?  

  Your reciprocity mirror misses the *direction* of cooperation. With the dead, reciprocity is *completed*: they bore costs, built endowments, and we inherit obligations from that closed loop of sacrifice. Maintaining their bequests fulfills an owed reciprocity. With the unborn, no such loop exists: they impose no sacrifices on us now, nor can they enforce claims against us. Our actions affect them unilaterally. Future reciprocity is impossible; past reciprocity demands fulfillment. That asymmetry justifies declining weight with temporal distance. Why treat a relation of pure causation (to the future) identically to one of completed exchange (with the past)?  

  Concession: Within a single life, self-discounting *is* counterintuitive. But social evaluation isn't self-evaluation. The migraine at eighty gets less weight *in our collective calculus* precisely because the *present community* has weaker reciprocal ties to that future self. Now attack the deferred-migraine pair: why must society value two identical harms equally when one victim is our contemporary collaborator and the other is a stranger to us in time?
