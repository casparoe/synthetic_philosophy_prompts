  - **Quantum experimentalist** (atom decay probability is 1/2, all there is to say):  
    Q1: Yes (fact beyond knowledge) → Q2: Yes (atom-specific property) → **Leaf: Single-case propensity**.  
  - **Statistician** (probabilities are about procedures, never hypotheses):  
    Q1: No (no fact beyond knowledge) → Q5: No (rational agents shouldn’t differ) → Q7: No (avoids indifference) → Q9: The testing procedure → **Leaf: Error-statistical (severity) view**.  
  - **Cosmologist** (0.95 is just her confidence, nothing more to settle):  
    Q1: No → Q5: Yes (rational disagreement possible) → Q6: Yes (solely about belief coherence) → **Leaf: Coherence-only subjectivism**.  

  #### (ii) Unseparated Leaves and a Discriminating Case  
  - **Finite frequentism** and **Hypothetical frequentism** can be conflated if someone accepts hypothetical repetitions but calls them "physical" (e.g., due to quantum laws).  
    - **Further case to separate**: *"For a unique historical event (e.g., Napoleon winning at Waterloo), can probability be defined if no actual repetitions exist?"*  
      - Finite frequentist: No (no actual collective).  
      - Hypothetical frequentist: Yes (via imagined repeats under "similar conditions").  

  #### (iii) Unoccupied Cells in Logical Space  
  The tree’s cuts define a space based on:  
  - **Objective single-case probabilities?** (Q1)  
  - **Rational disagreement with same evidence?** (Q5)  
  - **Probability grounded in physical traits vs. beliefs vs. procedures?** (Q2, Q6, Q9)  

  Unoccupied combinations:  
  1. **Objective single-case + Rational disagreement allowed (e.g., "objective but agent-relative")**:  
     - *Status*: Incoherent. If probability is objective/factual (Q1=Yes), disagreement given identical evidence is irrational.  
  2. **No objective single-case + Indifference principle enforced (Q7=Yes) + Probabilities for hypotheses (Q9=Yes)**:  
     - *Status*: Unattractive. Classical/logical indifference (Leaf 7) avoids this by not covering hypotheses; objective Bayesianism (Leaf 9) avoids indifference paradoxes. No major defense exists.  
  3. **Hypothetical repetitions + Belief-based probability (e.g., "frequentism but with subjective elements")**:  
     - *Status*: Undefended. Combines imaginary frequencies with subjective beliefs, violating both camps’ cores.  

