  The concept is interesting: an institution sets a default decision for people, but that default weakens as the stakes get higher for the individual. If the stakes are low, the default applies unless you actively opt out. But when the stakes cross a certain threshold, the default disappears, the choice becomes open-ended, and they tell you there was a default that no longer applies. They acknowledge the proxy for measuring stakes is imperfect but not arbitrary.

