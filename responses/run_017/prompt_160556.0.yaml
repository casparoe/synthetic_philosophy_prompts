answer: |-
  ## The Accounting

  Priya didn’t look at me when I entered the Counselor’s office. Her gaze stayed fixed on the manila folder already on her side of the small table. Mine sat opposite. The air smelled like stale coffee and industrial cleaner.

  Two weeks ago, Priya told our entire Bio class group chat I’d deliberately skipped the presentation, leaving her and Liam stranded. The truth? I’d been vomiting since 3 AM, sent frantic texts *only* to Priya (my supposed best friend), and passed out. My phone died. The betrayal felt like a physical punch. I’d spent nights crafting scathing texts I never sent.

  "Received your requests," Counselor Davies said blandly, sliding his own folder aside. "The Accounting is complete. Read. Absorb. The expectation is resolution." He left.

  We opened our folders simultaneously. Identical pages. Priya’s dossier.

  Page one: My vomiting fit, timestamped texts vanishing into her unread messages. Page two: Screenshots of her frantic midnight scrolling – her mother’s hospital bills flooding her email, highlighted in red. Page three: Her prescription for new anxiety meds, listed side effects: *paranoia, agitation*. Page four: Her Fitbit sleep log – a jagged graph showing 2 hours, 47 minutes average the week before the presentation. Page five: A note from her shift manager at the diner: *"Cut Priya's hours? Sure. Tell her mom good luck with the payments."*

  I felt the familiar heat of resentment rise… then stall. It was like watching a complex machine break down, gear by grinding gear. *Of course* she snapped. *Of course* she saw conspiracy in my silence. The storm inside me began to quiet, replaced by a detached, almost clinical understanding. *Ah. So that’s the sequence.*

  A choked sob came from Priya. I looked up. She wasn’t reading about *me*. She was rereading *her own* file, tears dripping onto the page showing the hospital bills. Her knuckles were white where she gripped the paper.

  "I didn’t…" she whispered, not to me, but to the dossier. "I didn’t *know*… I mean, I knew Mom was sick, but…" She traced the manager's cruel note. "I just felt… so alone. And then your texts didn't go through and I thought…" She finally met my eyes, raw shame replacing her earlier defiance. "I thought you were punishing me."

  My resentment had dissolved, washed away by the flood of causality. I saw the puppet strings. I felt… nothing much. Just a hollow sort of pity, the way you feel for a character in a sad movie. The objective attitude, Strawson would call it. *Managed. Explained.*

  But Priya? She held the same facts, the same chain of cause and effect. Yet for her, the dossier wasn’t explaining away guilt; it was *compounding* it. Every detail – the bills, the pills, the exhaustion – wasn't an excuse she could clutch; it was evidence of her own unraveling, proof of the damage done while blinded by her own chaos. The guilt wasn't dissolving; it was solidifying, heavier with each documented pressure point.

  I closed my folder. The resentment was gone, neatly filed away. Priya kept staring at hers, shoulders shaking silently, lost in the overwhelming, guilt-soaked map of her own breakdown. The same facts. Two utterly different journeys through them. The room felt very small, and very quiet.
