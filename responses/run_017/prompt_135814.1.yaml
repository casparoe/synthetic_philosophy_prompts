prompt: |-
  Hi — I'm one of five people on the commemoration review panel my city set up after the last statue fight. We get maybe ten or twelve referrals a year: a statue, a school name, a couple of streets, a mural, someone's name on a park bench. We meet once a month, we get about two weeks per case, no research staff, and whatever we write goes to council (who nearly always rubber-stamp it) and sometimes to the local paper. So I need something we can actually run.

  What I want is a decision procedure, not a set of principles. Ordered questions, what counts as a good enough answer to each one, the points where the procedure just stops and says leave it alone, and the points where it has to stop and hand the call over to council because it's a values question and not a factual one.

  Here's the half-formed theory I keep coming back to, which I want you to operationalize (correct it if it's wrong): a commemoration does three separable things — it honors (ranks someone as deserving public esteem), it testifies (asserts something about what happened), and it occupies (takes up shared space, or, in the case of a street or school name, gets said out loud by everyone who lives there, on every form and every 911 call, whether they want to say it or not). And the disqualifying thing about a person is either load-bearing — part of, or a causal input into, the thing they're being honored for — or merely incidental, something else that also happens to be true of them.

  Things it has to handle: what our evidence standard is for a claim about someone long dead (we are not convicting anybody); the remedy ladder from plaque through co-naming, relocation and removal, and which rung each finding buys you; and whether we are revoking an honor for misconduct versus registering that the reason for it has expired, because I think those need different arguments and I can never keep them straight in the meeting.

  Then run it on three: (1) a statue of a nineteenth-century mill owner who endowed the public library and the hospital, where the fortune came from a labor system that used children and the endowment is downstream of that; (2) a street named for a much-loved local organizer where the disqualifying thing is a private letter containing a slur, found in an archive last year; (3) a school named after the city's first Black councilman, honored for that, who also, on the record, voted against a fair-housing ordinance. At least one of these should come out in a way I definately won't like — I'd rather find that out here than at the council meeting. And tell me honestly what the procedure can't do.
reasoning: |-
  Okay, the user is part of a commemoration review panel dealing with statues, street names, and similar public honors. They need a practical decision-making procedure, not just principles. Let me unpack their requirements.

  First, they want a step-by-step process with clear questions, thresholds for answers, stopping points, and handoffs to the council. Their half-formed theory breaks commemoration into three functions: honoring, testifying, and occupying. They mention the importance of distinguishing between load-bearing and incidental flaws in the honoree's record. 

  Key operational needs: evidence standards for historical figures, a remedy ladder (plaque to removal), and clarifying revocation vs. expiration of honors. They provided three test cases to stress-test the system.

  Looking deeper, the user likely faces time/resource constraints (no research staff, 2 weeks/case) and political pressure (council rubber-stamping, media attention). Unspoken needs: defensibility against criticism, avoiding procedural loopholes, and managing internal panel disagreements. The "must handle" points suggest past pain points—like debates over evidence rigor or remedy proportionality.

  For the framework design: I'll structure it as phased questions. Phase 1 determines if review is even needed (saves time). Phase 2 assesses honor validity (load-bearing flaws), Phase 3 evaluates ongoing costs (occupation/testimony harms). Remedies escalate based on findings. Crucially, I'll separate "revocation" (misconduct voids honor) from "expiration" (honor's purpose is obsolete)—this resolves their confusion.

  Test cases: 
  - The mill owner: Wealth is load-bearing to philanthropy. Remedy likely removal/relocation since harm is structural. 
  - Organizer with slur: Private letter is incidental; plaque + contextualization suffices. 
  - Councilman vote: Housing stance is load-bearing to civil rights legacy. Tricky—honor expiration might apply since context changed. 

  Honest limitations: The procedure can't resolve value conflicts (handoff to council) or address "changed societal values" without specific harm. Also, evidence gaps may force inconclusive outcomes. 

  Biggest insight: The "occupation" concept (forced daily engagement) elevates street names/schools over statues—explaining why slur case gets lighter remedy despite offensive content.
answer: |-
  Here's a decision procedure operationalizing your theory, designed for practicality under your constraints. It's a phased flowchart with clear stopping points, evidentiary standards, remedy triggers, and handoffs.

  **Core Theory (Validated & Operationalized):**
  1.  **Honor:** The act of bestowing public esteem *for specific reasons*.
  2.  **Testimony:** The assertion of specific historical facts or narratives.
  3.  **Occupation:** The unavoidable imposition of the commemoration in public space/discourse.
  4.  **Load-Bearing Flaw:** A disqualifying act or belief that is *intrinsic* to the reason for honor, or *fundamentally undermines* the core value the honor represents *in the context of its creation*.
  5.  **Incidental Flaw:** A disqualifying act or belief that is unrelated to the reason for honor and doesn't fundamentally contradict the core value it represented *at the time*.

  **Decision Procedure: The Commemoration Review Flowchart**

  **PHASE 0: TRIGGER & SCOPE (15 mins/case)**
  *   **Question 0.1:** Is the referral based on a specific, credible allegation of a harmful act, belief, or significant historical inaccuracy related to this commemoration? *(If "No," STOP. Case dismissed. No review needed. Rubber-stamp "Retain.")*
  *   **Question 0.2:** Can the alleged flaw be reasonably defined and researched within 2 weeks using publicly available/reasonably accessible sources (archives, local history society, academic databases panel can access)? *(If "No," STOP. Recommend to Council: "Requires specialist research beyond panel capacity." Handoff.)*
  *   ***OUTCOME:*** Proceed to Phase 1 only if "Yes" to both 0.1 and 0.2.

  **PHASE 1: THE HONOR - VALIDITY & LOAD-BEARING FLAW (Core Focus - ~60% time)**
  *   **Question 1.1:** What was the *original, specific reason* for bestowing this honor? (Establish the core value/achievement being celebrated). *Source: Dedication speech, council minutes, newspaper archives from time of naming/erection.*
  *   **Question 1.2:** What is the *alleged flaw*? State it precisely.
  *   **Question 1.3:** Is there **Clear and Convincing Evidence (CCE)** the flaw occurred? *(Standard: More likely true than not, based on credible primary sources (letters, diaries, official records) or consensus secondary scholarship. Hearsay, unsupported accusations, speculation = Insufficient. Burden on the referral.)*
      *   *(If "No," STOP. Recommendation: "Allegation unsubstantiated. Retain.")*
  *   **Question 1.4:** Is the flaw **Load-Bearing**? Ask:
      *   Was the flaw *part of* or *a direct means to achieve* the specific reason for the honor?
      *   Does the flaw represent a value *diametrically opposed* to the core value the honor was meant to celebrate *in its historical context*?
      *   Would a *reasonable person contemporary to the honor's bestowal*, knowing *only* about the flaw, likely have considered it a disqualifier *for this specific honor*? *(Requires historical context understanding)*
      *   *(If "Yes" to any, flaw is Load-Bearing. Proceed to Phase 2.)*
      *   *(If "No," flaw is **Incidental**. Proceed to Question 1.5.)*
  *   **Question 1.5 (Incidental Flaw Only):** Does the flaw represent a value *so egregious by contemporary standards* that its mere association irrevocably *poisons* the honor, regardless of the original reason? *(e.g., verifiable sadistic torture for pleasure, core leadership in genocide). This is a HIGH bar.*
      *   *(If "Yes," treat as Load-Bearing. Proceed to Phase 2.)*
      *   *(If "No," proceed to Phase 3 to assess Occupation/Testimony impact.)*

  **PHASE 2: REMEDY FOR LOAD-BEARING FLAW / HONOR INVALIDITY (Revocation)**
  *   **Finding:** The honor is fundamentally invalidated. It is **revoked**.
  *   **Remedy Ladder (Choose Least Intrusive Effective):**
      *   **A. Contextualization (Plaque/Display):** *Only if* the *sole* purpose of retention is as a *negative* historical lesson *and* this is explicitly supported by the affected community (e.g., descendants, relevant identity group). Requires significant new explanatory text adjacent to the commemoration.
      *   **B. Co-Naming/Modification:** Adding another name or modifying the commemoration to fundamentally change its honorific nature (rarely applicable to statues, possible for buildings/streets).
      *   **C. Relocation:** Moving the commemoration (statue, plaque) to a museum or dedicated historical site *focused on contextual history*, not public honor.
      *   **D. Removal/De-naming:** Erasure of the commemoration from public honorific space.
  *   **Remedy Selection Rule:** Strong presumption for **D. Removal/De-naming**. **A. Contextualization** requires specific, compelling justification and community consultation *beyond the panel's scope*. **B/C** are niche options. *Recommendation will specify remedy.*

  **PHASE 3: THE OCCUPATION & TESTIMONY - ONGOING HARM (For Incidental Flaws or Expired Honors)**
  *   **Question 3.1 (Testimony):** Does the commemoration, as it stands, *passively testify* to something now known to be factually *inaccurate or significantly misleading* about the honoree or history? *(e.g., Statue implies sole benevolence, ignoring source of wealth).*
  *   **Question 3.2 (Occupation):** Does the unavoidable nature of the commemoration (saying the name daily, constant visual presence) cause *significant, documented, ongoing harm* to a specific, identifiable community *within the city*? (Harm = demonstrable psychological distress, feeling unwelcome/unsafe, undermining civic participation). *Requires evidence beyond theoretical offense (e.g., petitions from affected groups, statements from community leaders, sociological studies if applicable).*
  *   **Remedy Ladder (Choose Least Intrusive Effective):**
      *   **A. Contextualization (Plaque/Display):** Adding information adjacent to the commemoration to address inaccuracies (3.1) or acknowledge the flaw/harm (3.2). *Default remedy.*
      *   **B. Co-Naming:** Mitigates Occupation harm by sharing the honorific burden. Primarily for names.
      *   **C. Relocation:** Reduces Occupation harm by moving out of high-impact space. Primarily for statues.
      *   **D. Removal/De-naming:** Last resort for severe, irreconcilable Occupation harm or egregious false Testimony.
  *   **Remedy Trigger & Selection:**
      *   If **3.1 Yes** OR **3.2 Yes** -> Recommend **A. Contextualization**.
      *   If **3.2 Yes** *and* harm is severe/documented *and* Contextualization is deemed insufficient -> Consider **B. Co-Naming** or **C. Relocation**.
      *   If **3.1 Yes** *and* the false testimony is egregious *and* fundamental to the commemoration -> Consider **D. Removal/De-naming** (Rare).
      *   If **3.1 No** AND **3.2 No** -> STOP. Recommendation: "Retain. Flaw incidental, no ongoing harm identified."

  **PHASE 4: HONOR EXPIRATION (Distinct from Revocation)**
  *   **Question 4.1:** Is the *original reason* for the honor still *culturally relevant or meaningful* to the *current community*? Does it still actively inspire esteem? (e.g., Honored for founding a defunct industry; values celebrated are now obscure).
  *   **Question 4.2:** Has the commemoration become *primarily* a historical artifact rather than an active honor? (Often tied to 4.1).
  *   **Remedy:** If **4.1 No** (honor feels obsolete) *and/or* **4.2 Yes** (it's seen as history, not praise):
      *   Recommend **A. Contextualization** (explaining historical context, including why it was given & potential flaws) OR
      *   Recommend **C. Relocation** to a more historical setting OR
      *   Recommend **D. Removal/De-naming** *if* resources are needed for active commemoration *and* no significant opposition. *This is a values/pragmatic judgement. Panel can recommend; Council likely decides.*

  **HANDOFF TO COUNCIL POINTS:**
  1.  Phase 0.2: Requires specialist research.
  2.  Phase 1.5 Panel Deadlock: Is the flaw "egregious enough to poison the honor"? (Subjective high bar).
  3.  Phase 2 Remedy Choice (Contextualization vs. Removal) *if* significant community disagreement exists.
  4.  Phase 4 Recommendations (Honor Expiration): Balancing historical preservation, community sentiment, and resources is inherently political.
  5.  **Any** finding of significant ongoing harm (3.2 Yes) *requiring* remedy beyond Contextualization usually warrants Council scrutiny due to impact.

  **What the Procedure CAN'T Do:**
  1.  **Resolve Deep Value Conflicts:** It identifies *when* it's a values call (Load-Bearing threshold, egregiousness, ongoing harm severity, honor expiration) and hands off. It doesn't make those calls for Council.
  2.  **Conduct Original Research:** Relies on accessible evidence. Gaps leave allegations unproven.
  3.  **Measure "Societal Values":** It uses specific harms (Occupation) or factual inaccuracies (Testimony), not vague notions of "progress."
  4.  **Predict the Future:** It assesses *current* evidence and *current* harm.
  5.  **Heal Historical Wounds:** Remedies are symbolic/pragmatic, not reparative.
  6.  **Please Everyone:** The process is structured, not consensus-driven. Outcomes will disappoint some.

  ---

  **Test Case Application:**

  **Case 1: Statue of 19th C. Mill Owner (Honor: Philanthropy - Library/Hospital)**
  *   **Phase 0:** Triggered (Labor system). Proceed.
  *   **Phase 1:**
      *   1.1: Honor Reason = Philanthropy (Library/Hospital).
      *   1.2: Flaw = Exploitative child labor funding fortune.
      *   1.3: **CCE Met?** Yes (Historical records on 19th C. mills).
      *   1.4: **Load-Bearing?**
          *   Was child labor *part of* the philanthropy? No.
          *   Was it the *means*? **YES.** The philanthropy *required* the wealth generated by child labor.
          *   Opposed to core value (benevolence)? Arguably yes (exploitation vs. charity).
          *   Contemporary disqualifier? Probably not then, but means is definitive. **YES (Load-Bearing).**
  *   **Phase 2 (Revocation):** Honor invalidated. **Recommendation: D. Removal** (or C. Relocation to museum with *critical* context). Contextualization (A) is insufficient; the honor itself is tainted at source. *This might be the outcome you dislike.*

  **Case 2: Street Named for Local Organizer (Honor: Community Organizing)**
  *   **Phase 0:** Triggered (Private slur). Proceed.
  *   **Phase 1:**
      *   1.1: Honor Reason = Community Organizing (specific achievements likely).
      *   1.2: Flaw = Private letter containing slur.
      *   1.3: **CCE Met?** Yes (Authenticated letter).
      *   1.4: **Load-Bearing?**
          *   Part of/Means to organizing? No (private, unrelated).
          *   Opposed to core value (community building)? Potentially, but likely incidental to organizing *achievements*.
          *   Contemporary disqualifier? Unlikely *for this specific honor* (unless organizing specifically for group targeted by slur). **NO (Incidental).**
      *   1.5: **Egregious & Poisonous?** Slur is offensive, but private letter, not public action/advocacy. Likely doesn't meet the *HIGH* bar (like sadism/genocide). **NO.**
  *   **Phase 3 (Ongoing Harm):**
      *   3.1 (False Testimony)? No. The street name honors organizing, not personal views.
      *   3.2 (Ongoing Occupation Harm)? Does saying the street name cause *significant, documented harm*? Possible, but requires evidence from the targeted community. *Without specific evidence presented, likely "No".*
  *   **Outcome:** **Recommendation: Retain.** Flaw incidental, no ongoing harm proven. *Optional:* If concerned, recommend **A. Contextualization** (plaque at community center discussing complex legacy).

  **Case 3: School Named for First Black Councilman (Honor: Breaking racial barrier)**
  *   **Phase 0:** Triggered (Vote against fair housing). Proceed.
  *   **Phase 1:**
      *   1.1: Honor Reason = Being First Black Councilman (symbolic breaking of barrier).
      *   1.2: Flaw = Vote against fair housing ordinance.
      *   1.3: **CCE Met?** Yes (Council records).
      *   1.4: **Load-Bearing?**
          *   Part of/Means to being first? No.
          *   Opposed to core value? **YES.** The core value symbolized ("racial progress," breaking barriers) is *fundamentally undermined* by actively voting against a key measure for racial equity *while in that pioneering office*. The honor celebrates racial advancement; the vote obstructed it.
          *   Contemporary disqualifier? For *this specific symbolic honor*, likely yes even then. **YES (Load-Bearing).**
  *   **Phase 2 (Revocation):** Honor invalidated. **Recommendation: D. De-naming** (or C. Relocation if a plaque/display exists). Contextualization (A) is insufficient; the symbolic honor is incompatible with the act. *This might also be an outcome you dislike.*
  *   ***Alternative Path (If Panel Balks at Load-Bearing):*** If the panel argues the honor *only* marks the *fact* of being first, not his *stance* on progress, then:
      *   **Phase 1.4:** *Maybe* deemed Incidental (though weak). Proceed to Phase 3.
      *   **Phase 3:**
          *   3.1 (False Testimony)? Does the name imply he was a champion for equity? Possibly misleading. **Yes.**
          *   3.2 (Occupation Harm)? Does the school name cause harm to residents (especially Black residents) struggling with housing inequity? *Requires evidence.* Plausible. **Potentially Yes.**
      *   **Remedy:** **A. Contextualization** (required to address 3.1) is the minimum. If 3.2 Harm is documented/severe, could escalate.

  ---

  This procedure provides structure, clarity on evidence and reasoning, distinguishes revocation from other actions, offers a remedy ladder, and identifies clear handoff points. It forces focus on the *specific honor* and *evidence of harm*, making your panel's work more defensible and efficient. Remember to document each step clearly for the Council report. Good luck!
