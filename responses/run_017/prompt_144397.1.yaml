  ### Response to Your Query

  I'll address your three requests directly, correcting any inaccuracies in your gloss, using your vocabulary, and flagging settled vs. contested points. Your gloss was largely correct, but I'll note preconditions and nuances.

  #### 1. **Both Rules Stated for Finite Non-Convex Sets**
  - **Nash Rule**:
    - **What it does**: For each checkpoint, compute the gain over baseline for each metric (e.g., `gain_i = checkpoint_score_i - baseline_i`). Multiply these gains together. Pick the checkpoint with the **highest product**.
    - **Preconditions/Requirements**:
      - **Strictly positive gains**: Every metric must have a positive gain (`gain_i > 0`) for at least one checkpoint. If all gains for a metric are ≤0, no checkpoint is viable (product ≤0).
      - **No zero gaps**: If any metric has no improvement over baseline (all `gain_i = 0`), the product is 0, and the rule fails.
      - **Sensitivity to units**: Gains are multiplicative, so the rule assumes metrics are on a **ratio scale** (meaningful zero, no negative values). Switching to log-odds or other non-linear transforms breaks invariance.
    - **Your setting**: Your finite non-convex set of checkpoints may violate positivity if some metrics can't improve. If gains are negative for any metric in a checkpoint, it's dominated.

  - **Kalai–Smorodinsky (KS) Rule**:
    - **What it does**: For each metric, find its **ceiling** (best value achieved in any checkpoint, e.g., `ceiling_i = max(score_i)`). For each checkpoint, compute the **fraction of the gap** closed between baseline and ceiling: `fraction_i = (score_i - baseline_i) / (ceiling_i - baseline_i)`. Find the minimum fraction across metrics for each checkpoint. Pick the checkpoint with the **highest minimum fraction**.
    - **Preconditions/Requirements**:
      - **Strictly increasing gaps**: For every metric, the ceiling must exceed the baseline (`ceiling_i > baseline_i`). If not, fractions are undefined.
      - **No negative gains**: Metrics must not regress from baseline (fractions are undefined or negative if `score_i < baseline_i`).
      - **Sensitivity to units**: Fractions are invariant to linear shifts/scales (e.g., accuracy to log-odds breaks it).
    - **Your setting**: Non-convexity is fine, but ceilings depend on the entire set. Adding/removing checkpoints changes ceilings, which can shift the selected checkpoint.

  - **Settled vs. Contested**:
    - **Settled**: Both rules require positive gains and gaps. Both are invariant to *linear* rescaling (shifting or multiplying metrics by positive constants) but not to non-linear transforms (e.g., accuracy to log-odds).
    - **Contested**: Whether these rules "make sense" in non-convex sets is debated. KS is often interpreted as "maximin fraction" in practice, but its axiomatic justification assumes convexity.

