  #### **If Both Rules Are the Wrong Instrument**
  - **What to Use Instead**:
    - **Scalarization with Sensitivity Analysis**: Define a weighted sum of metrics, sweep weights, and pick checkpoints that are **robust** to weight variations (e.g., never worse than 10% below best for any weight combo).  
