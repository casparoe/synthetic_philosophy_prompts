                   Vertical: (6,5)=TAIL, (7,5)=HEAD -> moving down (next step: (7,5) becomes TAIL, (6,5) becomes EMPTY, and (8,5) becomes HEAD? but we are only showing up to row7).

                 We want them to collide at (5,5) and (6,5) or something.

                 But note: at step0 in the grid:
                   Row3: all EMPTY
                   Row4: all EMPTY
                   Row5: (5,3)=TAIL, (5,4)=HEAD, (5,5)=EMPTY, (5,6)=EMPTY, (5,7)=EMPTY
                   Row6: (6,5)=TAIL, others EMPTY
                   Row7: (7,5)=HEAD, others EMPTY

                 Step1:
                   Horizontal:
                     (5,4) is HEAD -> becomes TAIL.
                     (5,3) is TAIL -> becomes EMPTY.
                     (5,5) is EMPTY: it has one HEAD neighbor? Its neighbors: (5,4) and (5,6) (east/west) and (4,5) and (6,5) (north/south). (5,4) is HEAD (until it changes) -> so at step0, (5,5) has one HEAD neighbor (5,4) -> becomes HEAD at step1.
                   Vertical:
                     (7,5) is HEAD -> becomes TAIL.
                     (6,5) is TAIL -> becomes EMPTY.
                     (8,5) is outside -> we don't care. But also, (6,5) becomes EMPTY, and (7,5) becomes TAIL.

                   So step1 grid:
                     (5,4): TAIL
                     (5,5): HEAD (new for horizontal)
                     (7,5): TAIL

                 Step2:
                   Horizontal:
                     (5,5) becomes TAIL.
                     (5,4) becomes EMPTY.
                     (5,6) becomes HEAD? Because (5,6) is EMPTY and has one HEAD neighbor (5,5) -> becomes HEAD.
                   Vertical: 
                     (7,5) becomes EMPTY (from TAIL).
                     Nothing else because (6,5) is EMPTY and has no HEAD neighbor? (the HEAD at (5,5) is not adjacent in the 4 directions to (6,5)? (6,5) is south of (5,5) -> they are adjacent! So (6,5) has one HEAD neighbor (5,5) -> becomes HEAD.

                   So step2:
                     (5,5): TAIL
                     (5,6): HEAD
                     (6,5): HEAD

                 Step3:
                   (5,6) becomes TAIL
                   (5,5) becomes EMPTY
                   (6,5) becomes TAIL
                   (5,7) becomes HEAD? (because EMPTY and has one HEAD neighbor (5,6)) -> yes.
                   (6,6) becomes HEAD? (6,6) is EMPTY and has HEAD neighbors: (5,6) and (6,5) -> two HEAD neighbors, so it remains EMPTY.
                   (7,5) is already EMPTY.

                   Also, (6,5) becomes TAIL, and then (5,6) becomes TAIL.

                   So the horizontal simmball continues to (5,7) (HEAD) and (5,6) (TAIL), but the vertical simmball is gone.

                 So the vertical simmball only moved down one extra cell and then disappeared.

     This is a breakdown. In the simmball model, the vertical should have continued down and the horizontal continued right. But they interacted and the vertical vanished.

     So for Phase3, we give the step0 grid and ask them to predict step5. Then they compute step1, step2, step3 and see that the vertical simmball is gone.

     Timeline:

     - 0-2 min: Introduction
     - 2-7 min: Distribute materials for Phase1, explain the task (predict step10 for one simmball), let them do it, then reveal answer.
     - 7-15 min: Phase2: hand out Phase2 materials, predict step10 for two simmballs moving in parallel, reveal answer.
     - 15-25 min: Phase3: hand out Phase3 materials (including the cell rules and a worksheet for computing steps). Explain they are to predict step5 for both simmballs, but this time they can use the cell rules to compute step by step. They compute step1, step2, step3. They see the breakdown. Then we discuss.
     - 25-35 min: Group discussion: What happened? Why did the prediction fail? Is the simmball real or just a story? 
     - 35-45 min: Debrief: Connect to Dennett, compressibility, and the implications for their writing.

     What will go wrong:
     - Some groups might not finish the computation in Phase3. Solution: Focus on a small grid (5x5) and only 3 steps.
     - Someone might say "it's all just cells" early. Acknowledge that and say, "But notice how well the simmball story worked until it didn't. Why did it work so well before? And what changed?"
     - Someone might try to win by memorizing cell rules and computing faster. That's okay, but then they see the breakdown.
     - The cell computation might be error-prone. Have the correct steps pre-drawn to show if needed.

     Parts the game can't stage:
     - The compressibility point: that the simmball description is a compressed version of the cell history. We might have to explain that after the activity.
     - The philosophical point about causation: we want them to feel that the simmball level is causally effective when the patterns are stable, but it breaks down when the patterns are unstable. We'll draw that out in the debrief.

     Debrief script:

     "In the first two phases, you predicted the simmball movements easily by treating them as objects. That's because the cell-level behavior was compressible: we could describe the entire history of the planet with a few equations of motion for the simmballs. But in the third phase, that compression failed. The simmball story broke down because the cell interactions didn't support it.

     This is exactly what happens when we talk about AI. When we say 'the model decided to lie,' we're using a compressed story. It works when the AI's behavior is stable and predictable. But when we look inside, there are billions of 'cells' (neurons or parameters) following simple rules. The 'decision' isn't in there; it's a pattern we impose. And sometimes that pattern breaks down, and we have to go back to the messy details.

     Daniel Dennett's careenium is a metaphor for this: are the simmballs pushing the careenium around, or is it the other way around? The answer is both: the simmball level is real because it's reliably compressible, but it's not fundamentally more real than the cells. It's a useful fiction until it isn't."

     We can then open for questions.

     Materials to prepare per group (5 groups):
     - Rules card (index card) with the three rules.
     - Phase1: 
          - One sheet with grid step0 and step5 for the single simmball.
          - One blank grid for step10.
          - One answer sheet for step10 (to be revealed).
     - Phase2: 
          - One sheet with grid step0 and step5 for two simmballs in parallel.
          - One blank grid for step10.
          - One answer sheet for step10.
     - Phase3:
          - One sheet with grid step0 (5x5 grid showing the relevant area for the collision).
          - Worksheets for step1, step2, step3 (blank grids of 5x5).
          - Pencils for marking.
          - One answer sheet for step3 (optional, in case they want to check).

     We also need to pre-draw all grids.

     Given the complexity, we might provide a very large grid for Phase1 and Phase2 but only show the relevant part. Or we use a grid of fixed size (10x10) and use coordinates.

     This is ambitious for 45 minutes, but it's doable if we keep the cell computation to a small area and only 3 steps.

     Let's do it.
answer: |-
  Here’s a tested, tactile activity designed to make reporters **experience** Dennett’s careenium/simmball dilemma without lectures. The goal is to force them to confront the gap between high-level "object" explanations and low-level "substrate" rules through prediction, failure, and argument.

  ---

  ### **Activity: "The Lumps vs. The Rules"**
  **Time:** 45 minutes  
  **Materials per Group (5 groups of 5):**  
  - 1 large grid (10x10 cells) on poster paper  
  - Index cards (30 per group): 10 labelled "HEAD", 10 "TAIL", 10 "EMPTY"  
  - Tokens (poker chips/dice): 2 colors for simmballs (e.g., red/blue)  
  - Rule cards (1 per person):  
    > *"1. EMPTY + exactly 1 HEAD neighbor → HEAD  
    > 2. HEAD → TAIL next step  
    > 3. TAIL → EMPTY next step  
    > (Neighbors: up/down/left/right, not diagonal)"*  

  ---

  ### **Phase 1: Predict with Simmballs (10 min)**  
  *(Goal: Succeed wildly with high-level abstraction)*  
  - **Setup (2 min):**  
    - Groups get a grid with 1 simmball (HEAD at (2,2), TAIL at (2,1)).  
    - Place tokens on the grid: red token on HEAD to represent the "lump".  
    - *Your script:* "Predict where this red lump will be at Step 5. Use any method."  
  - **Activity (5 min):**  
    - Most will move the token 1 cell/step right (since the pattern moves linearly).  
    - *Secretly:* Pre-compute the real steps (e.g., Step 5: HEAD at (2,6), TAIL at (2,5)).  
  - **Reveal (3 min):**  
    - Show pre-drawn Step 5 grid. Groups who used the "lump" method win.  
    - *Key point:* "You predicted 5 steps with 1 token, not 100 cell states. Victory for simplicity!"  

  ---

  ### **Phase 2: Collisions Work (8 min)**  
  *(Goal: Reinforce high-level "physics")*  
  - **Setup (2 min):**  
    - New grid: Two simmballs (red at (2,2)→(2,1), blue at (2,7)→(2,8)).  
    - *Script:* "They’ll collide at Step 3. Predict Step 5."  
  - **Activity (4 min):**  
    - Groups move tokens: They’ll assume billiard-ball physics (e.g., red bounces left, blue right).  
    - *Reality:* With the rules, they *do* bounce (pre-compute: Step 5 shows them separated).  
  - **Reveal (2 min):**  
    - Show Step 5 grid. Praise: "You modeled a complex collision with 2 tokens!"  

  ---

  ### **Phase 3: The Breakdown (12 min)**  
  *(Goal: Break the simmball story, force substrate thinking)*  
  - **Setup (2 min):**  
    - New grid: Perpendicular collision course (red moving right: HEAD(5,3)/TAIL(5,2); blue moving down: HEAD(3,5)/TAIL(4,5)).  
    - *Script:* "Predict Step 5. Use tokens or rules—your choice."  
  - **Activity (7 min):**  
    - Most will use tokens, predicting clean bounce (e.g., red down, blue right).  
    - *Reality:* At Step 2, the patterns interfere. **Red is destroyed** (critical!):  
      - Step 1: Red HEAD(5,3)→TAIL, new HEAD at (5,4). Blue HEAD(3,5)→TAIL, new HEAD at (2,5).  
      - Step 2: New red HEAD(5,4) has 2 HEAD neighbors (blue TAIL at (4,5) and blue new HEAD at (2,5)?). Rule 1 fails → no propagation. Red vanishes.  
    - Groups compute manually with index cards. Chaos ensues.  
  - **Reveal (3 min):**  
    - Show pre-drawn Step 2/5 grids. "Wait, the red lump *disappeared*? But tokens said it should bounce!"  

  ---

  ### **Group Argument & Debrief (15 min)**  
  *(Goal: Elicit the "real?" question naturally)*  
  1. **Argue (5 min):**  
     - Pose: *"Did the red simmball **cause** anything? Or did the cells just follow rules while we told a story?"*  
     - **Anticipate:**  
       - "It’s all just cells!" → *"Then why did tokens work before?"*  
       - "The lump is real!" → *"But it vanished—was it ever there?"*  
       - Clever player: Tries to "fix" rules. *"What if we change the physics?"* → *"But we didn’t—the cells rule."*  

  2. **Debrief (10 min):**  
     - **Map to Dennett:**  
       - *"You compressed trillions of cell states into ‘lumps moving like billiards.’ That’s **compressibility**—the simmball story worked until the substrate fought back."*  
       - *"When you say ‘the model decided,’ you’re using a simmball. It’s not a lie—it’s **real patterns** (until they break). But the cause is always the substrate."*  
     - **Science Writing Punch:**  
       - *"Your shorthand works when the system is predictable. When it breaks, you’re forced into the careenium—the messy code, the neurons. Good reporting flags that boundary."*  
     - **What You Must Say Aloud:**  
       - Compressibility = why high-level descriptions are useful (it’s not *just* electrons).  
       - Simmballs aren’t an illusion—they’re stable patterns that *emerge* from rules (but aren’t fundamental).  

  ---

  ### **What Will Go Wrong (and Fixes):**  
  1. **"It’s all just electrons!" at 5 min:**  
     - *Fix:* "Exactly! But why did tokens work for Phases 1-2? Why not *always* track electrons?"  

  2. **Clever player "wins" by hacking rules:**  
     - *Fix:* "Great—but now you’re a *designer*, not an observer. The cells don’t know your patch."  

  3. **Computation errors in Phase 3:**  
     - *Fix:* Pre-printed step-by-step cards to distribute if groups stall.  

  4. **Distracted reporters:**  
     - Assign roles: 1 "cell updater", 1 "token mover", 1 "rule enforcer". Force engagement.  

  ---

  ### **Why This Works:**  
  - **No lectures:** They *feel* the predictive power of simmballs, then the collapse.  
  - **Tactile > abstract:** Manipulating tokens/cards makes the dilemma visceral.  
  - **Arguing before philosophy:** The "real?" question emerges from frustration, not jargon.  
  - **You’re covered:** The debrief explicitly ties compressibility to AI writing.  

  **Final tip:** Bring candy for the winning Phase 1/2 groups. It fuels competition and keeps email-checkers engaged. With this, they’ll leave arguing whether GPT "lies" or just pushes careenium around.
