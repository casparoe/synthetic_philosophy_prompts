answer: |-
  Here's your menu for the philosophy group – clear, concise verdicts on each reading of "family resemblance concept," plus answers to your bonus questions:

  ### The Menu: What "X is a family resemblance concept" Can Mean

  | Reading | Verdict on Support from Games | Platitude? | Substantive/Defensible? | Leads to "Pluto Pointless"? |
  |---------|-------------------------------|-----------|--------------------------|----------------------------|
  | **(i) No single feature shared by every member** | **✔️ Directly Supported** (No *one* thing defines all games) | **Yes** | **Defensible** for many concepts | **No** - Pluto debate was *about* multiple features |
  | **(ii) No set of necessary-and-sufficient conditions** | **✔️ Strongly Supported** (Wittgenstein's core point) | **No** | **Defensible & Substantive** | **No** - Lack of strict definition ≠ no facts |
  | **(iii) No feature shared by *all and only* the members** | **✔️ Supported** (Implied by ii) | **No** | **Defensible & Substantive** | **No** - Same as (ii) |
  | **(iv) Genuine borderline cases, fuzzy boundary** | **✔️ Supported** (Result of ii/iii) | **No** | **Defensible & Substantive** | **No** - Fuzziness invites debate, doesn't forbid it |
  | **(v) No underlying nature / not a real kind** | **❌ Not Supported** (Games don't *disprove* essence) | **No** | **Controversial Claim** | **Only if true** - But games don't show this |
  | **(vi) No fact of the matter at all / purely up to us** | **❌ Not Supported** (Relationships can be objective) | **No** | **Extreme Claim** (Often False) | **Yes** - This *is* the "pointless" conclusion |
  | **(vii) Concept is defective / better abandoned** | **❌ Not Supported** | **No** | **Usually False** | **Maybe** - But grad student didn't argue this |
  | **(viii) Disputes are merely verbal / settled by stipulation** | **❌ Not Supported** (Can involve substantive reasons) | **No** | **Often False** | **Yes** - Implies Pluto debate was *just* semantics |

  ### Direct Answers to Your Bonus Questions

  1.  **Is family resemblance incompatible with essence?**
      *   **NO.** Wittgenstein's point is descriptive (how we *apply* many concepts lacks a strict definition), not metaphysical (denying hidden structures). A category could have a hidden essence *and* exhibit messy, overlapping surface similarities. Family resemblance describes the *manifest criteria*, not necessarily the ultimate ontology. (E.g., "Species" might have family-resemblance criteria for identification yet still track underlying genetic reality).

  2.  **Is "planet" the wrong type of concept for her argument?**
      *   **YES, CRITICALLY SO.** This is likely the core issue. The grad student conflated two distinct things:
      *   **a) Natural Kind Categories:** Aim to track objective, mind-independent structures in the world (e.g., "water = H₂O"). Facts *discovered*. Pluto's status *could* involve this if "planet" tracks a significant astrophysical class.
      *   **b) Stipulative/Pragmatic Categories:** Defined by convention for specific purposes (e.g., "continent," "developed nation"). Boundaries are *decided*, not discovered.
      *   **The Crux:** The *reason* Pluto was debated was precisely **because** astronomers were asking: *Is "planet" more like (a) or (b)?* Does "clearing its orbit" reflect an astrophysically significant property marking a real class, or is it just a convenient line we draw? **Family resemblance (ii-iv) doesn't answer this question; it just says *if* it's (b), it lacks a strict definition.** The grad student **illegitimately slid** from "lacks necessary-and-sufficient conditions" (ii/iii - likely true for "planet") to "is purely stipulative" (vi - the controversial claim needed for "pointless").

  ### Why the Pluto Debate Wasn't Pointless (Even on Family Resemblance)

  *   The "overlapping similarities" (orbiting the Sun, hydrostatic equilibrium, not a moon, orbital dominance) **are objective features of celestial bodies.**
  *   Discovering numerous large Kuiper Belt Objects **changed the empirical landscape** regarding how bodies clustered by these features. Pluto *objectively* fits better with the KBO swarm based on location, composition, and orbital characteristics than with the major planets by the "clearing" criterion.
  *   The debate was about **which cluster of similarities is astrophysically most significant** for defining a useful category ("planet") versus a distinct category ("dwarf planet"/KBO). This involves **empirical facts about the solar system's structure and formation**, not *just* arbitrary stipulation. While a line had to be drawn (acknowledging iv), the *reasons* for drawing it where they did were rooted in objective features and scientific utility.

  **Take this to the group:** The grad student likely jumped from the plausible (ii/iii - no strict definition) to the extreme (vi - no fact of the matter) without justification. Wittgenstein shows concepts *can* work without essences or strict definitions, but **not** that they *must* lack objective grounding or that debates about them are empty. Pluto forced a reassessment of which objective similarities matter most for a scientifically useful category – that's substantive, not pointless.
