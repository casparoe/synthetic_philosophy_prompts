  Then there are the bonus questions: Can family resemblance coexist with hidden essences? Absolutely - surface messy similarities could mask underlying regularities. And yes, the user's spot-on about the "planet" category being different from natural kinds; conflating them lets people slide from "no strict definition" to "no facts at all." The real issue is whether we're tracking physical reality (like orbital dominance) versus practical classification needs.

