answer: |-
  Below is a complete panel procedure designed to meet your foundation's needs while explicitly addressing the board's demands, constraints, and inherent trade-offs. The procedure is grounded in social choice theory but translates impossibility results into practical, operational terms. It prioritizes transparency about which demands are partially sacrificed and why, and it structures decisions to distinguish technical constraints from value judgments. The rationale (on a separate page) explains trade-offs in terms of appeals, fairness, and operational costs.

  ---

  ### **Foundation Panel Procedure**  
  *(One-Page Rules for Panelists)*  

  1. **Initial Setup and Ballot Collection**  
     - Each proposal is reviewed by three panelists. Panelists submit two inputs:  
       - A *partial ordinal ranking* of their assigned proposals (ties permitted).  
       - A *calibrated score* (0–10 scale) for each proposal, based on pre-meeting anchor files (see **Calibration** below).  
     - **Output**: A family of partial orders + numerical scores.  

  2. **Calibration**  
     - Before scoring, panelists review 3–5 anchor proposals (historical benchmarks) to align scoring standards. Scores must reference these anchors (e.g., "similar to Anchor A").  
     - *Rationale*: Enables interpersonal comparability and reduces drift.  

  3. **Proposal Ranking**  
     - **Step 1**: For each proposal, calculate the **median calibrated score** from its three reviewers.  
     - **Step 2**: Rank proposals by median score (highest to lowest).  
       - **Tiebreaker**:  
         - (a) Proposal with the most "high-confidence" scores (scores ≥8) wins.  
         - (b) If still tied, use the highest average discussion score (from post-reading sub-panel notes).  
         - (c) If still tied, chair conducts a 5-minute discussion/vote.  
     - **Output**: A complete, ordered shortlist.  

  4. **Duplicate Proposals**  
     - If ≥1 panelist flags two proposals from the same lab as "near-duplicates":  
       - Chair determines if they are substantively identical (using pre-defined criteria: e.g., >90% methodological overlap).  
       - If confirmed: Merge into a single entry. Use the **highest median score** between them for ranking. Only one award is permitted per merged entry.  

  5. **Shortlist and Funding Cut**  
     - **Step 1**: Filter proposals with median scores <6. These are ineligible.  
     - **Step 2**: The board selects a cut point (6–10 awards) based on budget. Fewer than six awards (or zero) are permitted if:  
       - Fewer than six proposals score ≥6, or  
       - Budget constraints apply.  
     - *Note*: The cut point is a **budget decision**, not a social choice. The panel only provides the ranked list.  

  6. **Reason Letters**  
     - For funded proposals:  
       > "Your proposal was highly ranked by the panel and met the quality threshold (median score ≥6)."  
     - For unfunded proposals:  
       > "Your proposal did not rank in the top [cut] positions. Its median score was [score], below the threshold of [min_score] for funded proposals."  
     - For merged duplicates:  
       > "Your proposal was considered alongside a similar submission from your lab. The combined assessment resulted in a median score of [score]."  

  7. **Appeals Handling**  
     - Appeals must demonstrate:  
       - Material error (e.g., scoring miscalculation), or  
       - Violation of duplicate rules.  
     - **No appeals permitted** on relative rankings (justifies IIA trade-off; see rationale).  

  ---

  ### **Rationale and Trade-Offs**  
  *(One-Page Explanation for Board/Lawyer)*  

  #### **Core Trade-Off: Violating Arrow’s IIA for Stability**  
  - **Demand 1 (IIA)** is partially sacrificed to ensure feasibility. Arrow’s theorem proves no ordinal system (rankings only) can satisfy IIA without dictatorship. We use **calibrated scores** (cardinal inputs) to approximate IIA:  
    - Scores anchor assessments to fixed standards (anchors), making rankings less dependent on the pool.  
    - **Cost**: Scores require calibration time (~1 hour pre-meeting) and are vulnerable to **drift/inflation** (panellists may gradually score higher). Mitigation: Annual anchor recalibration.  
    - **Why we tolerate this**: Prevents most ranking reversals (e.g., A > B in Cycle 1, then B > A in Cycle 2 with unchanged merits). Reversions only occur if:  
      - Panelist turnover causes inconsistent calibration, or  
      - Tiebreakers override identical scores (rare; <5% of cases).  

  #### **Other Demands Addressed Explicitly**  
  - **Demand 2 (Sub-panel Consistency)**: Scores are absolute, so rankings are identical if sub-panels replicate the same scores. No merging conflicts.  
  - **Demand 3 (Strategy-Proofness)**:  
    - **No-show paradox**: Mitigated by using median scores (hard to manipulate with 3 reviewers).  
    - **Bloc voting**: Reduced by confidential scoring and median aggregation. However, tacit collusion is possible if blocs coordinate calibration. Cost: Requires chair vigilance.  
    - **Trade-off**: Full Gibbard-Satterthwaite immunity is impossible. We prioritize "no no-show" over "no bloc voting."  
  - **Demand 4 (Clone Independence)**: Addressed by duplicate merging.  

  #### **What We Cannot Settle**  
  - **The funding cut (6–10 awards)**: Purely a budget decision. Social choice ends at the ranked list.  
  - **Tiebreakers**: Step 3(c) delegates to chair judgment. This is a procedural necessity, not a flaw.  
  - **Grade inflation/drift**: Inherent to scoring systems. Addressed by annual anchor updates.  

  #### **Operational Constraints Met**  
  - **Time/Excel**: Calibration pre-meeting; scoring/ranking in Excel (formulas: `MEDIAN`, `RANK`).  
  - **Reasons**: Letters reference scores, not ranks or theorems.  
  - **Appeals Limited**: To calculation/duplicate errors only, minimizing legal risk.  

  ---

  ### **Test Runs**  
  #### **Cycle 1: Clean Case (8 Proposals, Single-Peaked Preferences)**  
  - **Ballots**: All panelists rank proposals identically (implicit quality order: P1 > P2 > ... > P8).  
  - **Scores**: Align with rankings (P1: 9.0, P2: 8.5, ..., P8: 4.0).  
  - **Procedure**:  
    - Ranks by median scores. No ties.  
    - Shortlist: P1–P8 in order.  
  - **Does it need Arrow?** No. Single-peaked preferences allow majority rule, but scoring is simpler and faster. Rationale: "Scores efficiently captured consensus."  

  #### **Cycle 2: Duplicates and Rival (Lab X: Proposals A1, A2; Rival: Proposal B)**  
  - **Scores**: A1: 8.0, A2: 8.2, B: 8.3.  
  - **Procedure**:  
    - Panelist flags A1/A2 as duplicates. Chair merges them (highest score: 8.2).  
    - Ranking: B (8.3) > Merged A (8.2).  
  - **Chair’s bias**: Irrelevant; scores decide. Rival B wins.  
  - **Reason to Lab X**: "Your proposals were merged. The combined median score was 8.2; the cut required ≥8.3."  

  #### **Cycle 3: Resubmission (A vs. B, Unchanged Assessments)**  
  - **Cycle 2**: A scored 7.5 > B scored 7.0. Funded A.  
  - **Cycle 3**: Same proposals, same panelists. A scores 7.5 again; B scores 7.5 (panelists reassessed B higher).  
  - **Procedure**:  
    - Tie: Median scores equal (7.5).  
    - Tiebreaker (a): A has two "high-confidence" (≥8) scores; B has one. A wins.  
  - **If B won** (e.g., via random draw in Step 3c):  
    - **Reason to A**: "Your median score was 7.5. The cut was 7.5, and tiebreaking favored other proposals."  
    - **Board cost**: Accept that tiebreakers can cause reversals. Alternative (funding both) risks budget overruns.  

  ---

  ### **Conclusion**  
  This procedure violates Arrow’s IIA in its pure form (using scores instead of pure rankings) to prioritize continuity, clone resistance, and operational simplicity. The board’s demands for sub-panel consistency and strategy-resistance are met; IIA and perfect cross-cycle rank stability are approximated but not guaranteed. The cost is annual calibration effort and accepting tiebreaker judgments. Crucially, it exposes trade-offs:  
  - **Appeals**: Limited to errors, not disagreements (IIA violation).  
  - **Continuity**: Reversals possible with panelist turnover or tiebreakers.  
  - **Time**: Calibration costs 1–2 hours/cycle but prevents hours of debate.  

  If the board insists on strict IIA, no non-dictatorial ordinal system can satisfy all demands. This procedure optimizes for defensibility and simplicity, explicitly naming its compromises.
