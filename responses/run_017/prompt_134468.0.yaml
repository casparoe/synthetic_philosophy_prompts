  The user wants a self-contained hypothetical scenario avoiding real-world references, with specific elements: a warehouse dispute over scheduling algorithms, work-to-rule tactics, pay deductions, and replacement workers. They also want the question to force a choice between theoretical models and connect to union recognition rights. Practical constraints include a 45-minute closed-book format.

  Key pedagogical goals emerge: first, dismantling the ownership argument by showing strike leverage isn't passive withdrawal but active cost-imposition through rule manipulation. Second, exposing the moral tension in excluding replacement workers—if labor is property, why can't others sell theirs? Third, linking strike justification to the necessity of bargaining recognition, since strike threats require someone to threaten.

  For the question design, I'll structure it in three parts: (A) analyzing work-to-rule under different models, (B) addressing replacement workers, and (C) extending to union recognition. The warehouse scenario provides concrete stakes—procedural manuals become weapons, algorithms symbolize control disputes. Adding a temp worker crossing the picket line personalizes the exclusion dilemma.

  The model answer needs to demonstrate how different frameworks handle these issues. A corrective justice model could frame work-to-rule as rebalancing employer reliance on uncodified effort, while a countervailing power model might defend picket lines as necessary for collective clout. Crucially, each model implies different things about replacement workers and bargaining rights.

  For grading, I'll focus on five must-hit points: explicit model selection, work-to-rule analysis, replacement worker justification, recognition rights extension, and internal consistency. Common pitfalls include defaulting to ownership without critique or treating parts in isolation. The grading heuristic should flag answers that don't move beyond "labor as property" tropes.

  The opening sentence for the model answer will encapsulate the crux: that strikes derive power from disrupting employer dependence on worker flexibility and solidarity, not mere absence. This helps graders quickly identify superficial responses.
answer: |-
  ### Exam Question: Philosophy of Work Midterm  
  **(Answer all parts. Total time: 45 minutes. Closed book. Do not reference real-world laws, cases, or institutions.)**  

  **Scenario**: In the hypothetical jurisdiction of New Columbia, workers at "QuickShip Warehouse" (500 employees) operate under an expired contract. Management imposes a new AI-driven scheduling algorithm that workers claim causes severe disruption to childcare and medical appointments. The union launches a "work-to-rule" campaign: workers perform *exactly* as required by the official 300-page Procedures Manual (e.g., taking full 15-minute breaks, refusing off-clock communication, performing redundant safety checks). Throughput drops 40%. Management responds by docking pay 20% for "partial performance." When talks stall, QuickShip hires temporary workers through an agency. Union members picket the entrances. One temp, Maria Lopez, turns back after seeing the picket line; another, James Miller, crosses it and begins work.  

  **Part A (10 points)**:  
  Does the *work-to-rule* campaign constitute a legitimate strike action? Analyze this using **one** of the following models:  
  (i) Pure withdrawal of labor ("ownership model"),  
  (ii) Voice/reciprocity model,  
  (iii) Corrective justice model, or  
  (iv) Countervailing power model.  
  Explain why your chosen model justifies (or fails to justify) docking pay for "partial performance."  

  **Part B (10 points)**:  
  Does the union have a right to discourage Maria and James from taking their jobs? Using your model from Part A, analyze whether the *exclusionary element* of the picket line is legitimate. Address: If workers "own" their labor, why can’t others freely sell theirs?  

  **Part C (5 points)**:  
  What does your model imply about the *right to unionize*? Is it merely a right to associate, or must it include a right to force the employer to bargain? Explain briefly.  

  ---

  ### Model Answer (Crux Heuristic for Graders):  
  **"Strike leverage arises not from mere absence, but from disrupting the employer’s dependence on uncodified cooperation and collective solidarity."**  

  *(~700 words; model: Countervailing Power)*  

  **Part A**: The work-to-rule campaign is legitimate under a **countervailing power model**. This model views strikes as tools to redress imbalances in market power. Employers rely on workers’ *uncodified flexibility* (e.g., skipping breaks, off-duty emails) to maintain efficiency. The Procedures Manual—while legally binding—is incomplete; it cannot catalog every contingency requiring goodwill. QuickShip’s 40% throughput loss proves their dependence on norms beyond the contract. By weaponizing bureaucratic inefficiency, workers expose this hidden dependency, creating leverage to demand fair scheduling.  

  Management’s pay deduction for "partial performance" is unjustified here. Countervailing power legitimizes strikes that impose *strategic costs* by withdrawing *expected* cooperation, not just contractual duties. QuickShip profits from systematic under-compensated flexibility; docking pay punishes workers for refusing to subsidize efficiency. This model thus rejects the ownership model’s narrow focus—work-to-rule isn’t "partial" labor withdrawal but *full* withdrawal of discretionary effort.  

  **Part B**: The picket line’s exclusionary element is defensible under countervailing power. While the ownership model frames labor as individual property (suggesting James Miller has a right to "sell" his labor), countervailing power treats strikes as *collective* action. If QuickShip easily replaces strikers, the strike loses all force. Picket lines amplify power by mobilizing social pressure (e.g., convincing Maria Lopez) to uphold solidarity. This "quasi-secondary" pressure is not about "owning" jobs but preventing employer evasion of collective bargaining.  

  However, James Miller crossing the line creates tension. Countervailing power prioritizes *group* equity over individual choice: if temps undermine the strike, they enable exploitation of the permanent workforce. The model thus licenses *persuasive* exclusion (e.g., appeals to class solidarity) but not coercion. Maria’s choice to turn back aligns with this; forcing James to leave would overreach.  

  **Part C**: This model demands a right to *mandatory bargaining*. A union without leverage is toothless. If employers can ignore unions (as QuickShip ignored the scheduling grievance), "association" becomes symbolic. Countervailing power requires the threat of credible strikes—which presuppose recognition. Without bargaining rights, the power imbalance persists, rendering strikes either impossible or violently disruptive.  

  ---

  ### Marking Scheme (25 points total)  
  **Must-Hit Points** (Deduct 2–4 points per missed element):  

  1.  **Explicit Model Selection & Definition** (5 pts)  
      *Wrong*: Vague model reference; no clear distinction from ownership.  
      *B → A*: Names/defines model; *C → B*: Mentions model but conflates with ownership.  

  2.  **Work-to-Rule Justification via Chosen Model** (5 pts)  
      *Wrong*: Assumes "following rules = working fully"; ignores contractual incompleteness.  
      *B → A*: Links throughput drop to withdrawal of *uncodified* effort; *C → B*: Only describes tactics.  

  3.  **Exclusionary Element Defense/Rejection** (5 pts)  
      *Wrong*: "James has a right to work" (ownership) or "Unions can block anyone" (no critique).  
      *B → A*: Addresses tension between individual choice and collective efficacy; *C → B*: Only labels scabs "immoral."  

  4.  **Bargaining Right Extension** (5 pts)  
      *Wrong*: "Right to associate is enough" or "Employers must obey unions."  
      *B → A*: Shows strike threat requires recognition; *C → B*: Mentions bargaining but no link to power.  

  5.  **Internal Consistency** (5 pts)  
      *Wrong*: Incoherent model application (e.g., voice model endorsing picket-line coercion).  
      *B → A*: Model applied uniformly to work-to-rule, exclusion, *and* bargaining; *C → B*: Parts feel disjointed.  

  **Grade Descriptors**:  
  - **A (21–25)**: Explicitly challenges ownership model; uses chosen framework to explain *both* work-to-rule’s hidden leverage *and* the picket line’s moral tension; ties bargaining rights to strike efficacy.  
  - **B (16–20)**: Identifies limits of ownership model; analyzes work-to-rule OR exclusion well but not both; bargaining link underdeveloped.  
  - **C (11–15)**: Defaults to ownership logic; superficial treatment of scenario; ignores contractual incompleteness/picket tension.  
  - **D/F (0–10)**: Misreads question; asserts conclusions without argument; invokes real-world law.  

  ---  
  **Notes for Graders**: Flag answers that treat labor withdrawal as self-justifying or ignore *why* work-to-rule imposes costs. Strong answers will note that strikes exploit gaps between formal contracts and operational reality.
