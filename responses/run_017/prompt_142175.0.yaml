prompt: |-
  I'm a staff engineer at a company with about forty backend services spread across nine teams, and I've been asked to run a fifty-minute internal engineering-craft session on how technical conventions form and hold together. The reason I'm running it is a design review next week: we are about to rewrite our internal messaging layer, and the argument in the room keeps collapsing into the same shape — the retry policy is arbitrary, so let's just pick the better option and write it into the migration document. I've read a couple of summaries of David Lewis's account of convention and it looks like the right tool for what is going wrong in that room. I don't want to lecture at people about philosophy, and I don't want to put his numbered formal definition on the board, because I lose the thread in it myself and so will they. What I want from you is a plan for making the structure land with twenty-five engineers of mixed seniority, no philosophy background, one whiteboard and no slides, half of whom will arrive convinced that this is a management problem rather than a technical one.

  The case I was going to build everything on: when a consumer fails to process a message, it either retries with backoff until the message goes through, or it retries a fixed number of times and then parks the message in a dead-letter queue that a human drains by hand. There is no written policy. Every team I asked does the second thing, and every team I asked assumed every other team does the second thing. It appears to have started with one incident about three years ago — a consumer stuck retrying held a malformed message against a checkpoint for nine hours — and the fix that got posted in the incident channel somehow became the way everybody does it. If everyone did the other thing instead, throughput would arguably be better and nobody would be draining anything by hand, so the current practice looks arbitrary, and that word is doing real damage in the design review.

  There is a wrinkle. This is not a pure case of everyone just wanting to match: the platform team would rather each consumer team own its own dead-letter draining, and the consumer teams would rather the platform offered it as a feature. So there is a small dispute about who does the work sitting on top of the coordination problem. Tell me whether that wrinkle ruins the example, whether I should keep it and deal with it explicitly, or whether I should swap in something cleaner — say, two services that must agree on which of two functionally identical header names carries the correlation ID, which is cleanly arbitrary but invites someone to say we should just run a find-and-replace across the monorepo, and I don't know whether that objection is a problem with the example or the beginning of the lesson.

  Concretely, please plan:

  1. The order the pieces have to come in and what depends on what. In particular: does the definitional core — the stable regularity, the expectations each person has about everyone else, the fact that the expectations are themselves mutually visible, and the fact that some alternative regularity would have served just as well if everyone had converged on it — come before or after the case, and why? And at which point does the word arbitrary have to be repaired, given that they will hear it as costless?
  2. Whether my case or the cleaner one should carry the whole session, and what the carrying example must have and must lack. My guess is that it must lack a linter, a mandate and a single owner who could flip everyone at once, and must have a real alternative that would have done as well — tell me if that's wrong or incomplete.
  3. The misconceptions, and exactly where in the sequence to head each off. The ones I already expect: arbitrary means it doesn't matter, so pick the technically best option; a convention is just a habit, or just a rule nobody happened to write down; we'll announce it in the migration document and it will change; and — a fourth I only half-expect — that people will think the incident three years ago is why the policy is still there. Name the ones I'm missing.
  4. One thing I can have them do or answer in the last ten minutes that would show me they've got the structure rather than the vocabulary, and how I'd tell the difference.
  5. What I should openly refuse to explain in fifty minutes to this audience, and where the temptation to over-explain will be strongest for me.

  Assume they are smart, allergic to theory, and will try to turn every point back into an argument about who should own what. Please don't give me a reading list or citations, and don't quote Lewis: paraphrase the conditions in whatever terms make them usable on a whiteboard.
reasoning: |-
  We are designing a 50-minute session for 25 engineers on how technical conventions form and hold together, using David Lewis's account of convention without the philosophical jargon. The goal is to address the retry policy dispute (backoff vs. dead-letter queue) and show why it's a convention and not just an arbitrary choice that can be changed by fiat.

  Key points from Lewis (paraphrased for engineers):
  1. **Regularity in behavior**: There's a stable pattern of behavior (e.g., everyone uses dead-letter queues).
  2. **Mutual expectations**: Each person expects others to follow this pattern and believes others expect the same.
  3. **Mutual visibility**: The expectations are common knowledge (everyone can see that everyone else expects it).
  4. **Arbitrariness**: There's at least one alternative pattern (e.g., backoff) that would have worked just as well if everyone had chosen it initially.

  The wrinkle: There's a dispute about ownership (platform team vs. consumer teams for dead-letter draining). We must decide whether to keep this or use a cleaner example (like header names).

  Plan:

  ### 1. Order of Pieces

  Start with the case (the retry policy) to ground the discussion in a real problem they care about. Then build the definitional core step by step from the case.

  Why? Because engineers are allergic to theory. Starting with an abstract definition will lose them. The case provides concrete material to analyze.

  Sequence:

  - (5 min) **Introduce the problem**: Describe the retry policy situation (current practice: dead-letter queues, no written policy, started from an incident, everyone does it and assumes others do). Highlight the design review argument: "It's arbitrary, so let's just pick the better option (backoff) and write it in the migration doc."

  - (15 min) **Break down the current state**: Use the whiteboard to map out the four conditions (in simple terms) based on the case:
    - **Regularity**: "What is the current pattern?" (Everyone uses dead-letter queues after a fixed number of retries.)
    - **Expectations**: "Why do you do this? Do you think others do it?" (Yes, because they assume others do and expect it.)
    - **Mutual visibility**: "How do you know others expect it?" (Incident history, informal chats, no one questions it in design reviews, etc.)
    - **Arbitrariness**: "Could we have done it differently?" (Yes, backoff is a viable alternative that would work if everyone switched.)

  At this point, repair the word "arbitrary". They hear it as "costless to change". But in a convention, changing is costly because it breaks coordination. Say: "Arbitrary doesn't mean unimportant or easy to change. It means there was more than one good option at the start, but now that we've all coordinated on one, switching is hard because we have to re-coordinate."

  - (10 min) **Introduce the wrinkle (ownership dispute)**: Now layer on the ownership issue. Ask: "Is the dispute about who owns dead-letter draining a separate problem, or is it tied to the convention?" Show that the convention (using dead-letter queues) exists even though there's an unresolved dispute about ownership. The dispute is a separate coordination problem on top (who should do the draining) but doesn't invalidate the existing convention on the retry policy. This shows conventions can have rough edges and still hold.

  - (15 min) **Contrast with a cleaner example (header names)**: Bring in the alternative example (two header names for correlation ID) to show a "purer" convention. Compare:
    - Both examples have regularity, expectations, mutual visibility, and arbitrariness.
    - But the retry example has an additional dispute (ownership) that the header example doesn't. However, the core convention structure still holds in both.

  This comparison reinforces that conventions can exist even with auxiliary problems.

  - (5 min) **Wrap-up and activity**: (See point 4)

  ### 2. Which Example to Use

  Use both, but lead with the retry policy because:
  - It's real and urgent for them.
  - The wrinkle (ownership) is actually a strength: it shows that conventions can persist even when there are adjacent disagreements. It makes the session more relevant to their actual work.

  The carrying example must:
  - Lack a linter, mandate, or single owner (to show it's not enforced by authority or tooling).
  - Have a real alternative (backoff or header B) that is viable.
  - Show that the current practice is stable because of mutual expectations, not because it's technically superior.

  The retry policy example has these. The ownership wrinkle doesn't ruin it; it adds realism. Address it explicitly as a separate but related coordination issue.

  ### 3. Misconceptions and When to Head Them Off

  Misconceptions:
  - **"Arbitrary means it doesn't matter, so pick the technically best option"**: Head off when defining arbitrariness (during the breakdown of the case). Emphasize: "Arbitrary at inception does not mean trivial to change now. Changing breaks coordination and has costs."
  - **"A convention is just a habit or an unwritten rule"**: During the breakdown, contrast habit (individual) with convention (group coordination). Habits don't require mutual expectations; conventions do.
  - **"We'll announce it in the migration document and it will change"**: When discussing the design review argument, point out: "Announcements don't change conventions unless they change mutual expectations. If teams don't update their code and expectations, the old convention persists."
  - **"The incident three years ago is why the policy is still there"**: This is a half-truth. The incident started it, but it persists because of the convention (mutual expectations). Point this out during the breakdown of expectations: "The incident was the seed, but the reason it stuck is that we all expect each other to do it."

  Missing misconceptions:
  - **"Conventions are inefficient and should be replaced by standards (top-down rules)"**: Address when comparing the examples. Conventions are bottom-up and resilient; standards require enforcement. If a standard isn't internalized, it might not stick.
  - **"We can change a convention by just changing our own service"**: During the arbitrariness discussion, point out that unilateral change might break interoperability (e.g., if one service switches to backoff but others expect dead-letter queues, messages might be lost).
  - **"This is a management problem; they should decide"**: Early on, when introducing the case, say: "Management could mandate a change, but without addressing the mutual expectations, teams might not follow through. Conventions are about how groups coordinate, not just top-down rules."

  ### 4. Activity in the Last 10 Minutes

  **Activity**: Split into small groups (3-4 people) and have them identify another convention in their systems (e.g., logging format, API versioning, error handling). Ask them to sketch:
  - The regularity
  - The expectations (why they follow it, what they expect from others)
  - An alternative that could have worked
  - One reason it's hard to change

  **How to tell if they get the structure vs. vocabulary**: 
  - If they just say "it's a convention" without breaking it down, they have the vocabulary but not the structure.
  - If they can point to specific mutual expectations and an arbitrary alternative, they have the structure. 
  - Listen for concrete examples and whether they identify coordination costs (e.g., "If we change, others might not, and it would break X").

  ### 5. What to Refuse to Explain

  **Do not dive into**:
  - The full formal definition of common knowledge (the "mutual visibility" part). Keep it at: "We all know that we all expect this, and that's visible in how we design and review."
  - Philosophical debates about what counts as a convention vs. a norm. Stick to the four conditions in simple terms.
  - The entire history of convention theory. Focus on the retry policy and one other example.

  **Temptation to over-explain**: 
  - When defining arbitrariness. It's easy to get into technical comparisons of backoff vs. dead-letter queues. Resist: The point isn't which is better, but why the current choice is sticky.
  - When discussing the ownership wrinkle. Don't solve the ownership dispute; use it to illustrate that conventions can exist alongside unresolved issues.

  ### Summary of Timeline

  - 0-5 min: Introduce the retry policy case and the design review argument.
  - 5-20 min: Break down the case into the four conditions (on whiteboard), repairing "arbitrary".
  - 20-30 min: Address the ownership wrinkle and show it's separate.
  - 30-45 min: Compare with the header example to reinforce the structure.
  - 45-50 min: Group activity to identify another convention.

  Keep the language simple and concrete. Use the whiteboard to draw:
  - Boxes for services/teams showing the same behavior (regularity)
  - Arrows for expectations (e.g., "Team A expects Team B to use DLQ")
  - A note on the side: "Alternative: backoff, but switching would require everyone to change at once."

  This should leave them with a framework to see why changing a convention isn't just about picking the best option but about coordinating expectations.
answer: |-
  Here’s a focused, actionable plan for your 50-minute session. It prioritizes concrete examples over theory, leverages your retry-policy case (wrinkle included), and anticipates pushback. The goal is to show how conventions emerge and persist—not to solve the retry debate, but to reframe it.

  ---

  ### **1. Order of Pieces (Total: 50 min)**
  **Why this order:** Start with the concrete pain point to hook them. Build the framework inductively from their reality. Delay defining "arbitrary" until they see the coordination costs.

  - **Min 0–5: Problem Intro**  
    Open with the retry policy deadlock: *"We’re stuck arguing between backoff vs. dead-letter queues (DLQ). Everyone uses DLQ but thinks it’s arbitrary. Let’s map why."*  
    **Whiteboard:** Draw two boxes: "Backoff (proposed)" and "DLQ (current)". Add: "No written policy. All teams use DLQ. All assume others do too."  
    **Key hook:** *"Why does this feel arbitrary? And why can’t we ‘just’ switch?"*

  - **Min 5–20: Break Down the Retry Case → Reveal Convention Structure**  
    Walk through the retry policy step-by-step to **show, don’t tell**, the components of convention:  
    - **Regularity (stable pattern):** *"What’s the actual behavior?"* → All teams use DLQ after fixed retries.  
    - **Expectations:** *"Why do *you* use DLQ?"* → "Because we assume others do." *"Why assume that?"* → "We see it in code reviews/slack/on-calls."  
    - **Mutual visibility:** *"How do you know Team X expects this?"* → "They complained when we *almost* changed it last year."  
    - **Arbitrary alternative:** *"Could backoff work?"* → Yes, but only if everyone switched.  
    **Whiteboard:** Annotate the DLQ box with:  
    ```
    Pattern: DLQ everywhere  
    Why?   : "We all expect others to do it" → "We all see others expect it"  
    Alternative: Backoff (works if everyone switches)  
    ```

  - **Min 20–25: Repair "Arbitrary"**  
    **Crucial moment:** When introducing "arbitrary alternative," explicitly reframe the term.  
    *"We say ‘arbitrary’ meaning either could have worked *initially*. But now? Switching isn’t cost-free. It requires re-aligning 9 teams’ expectations and code. The cost is coordination, not technical inferiority."*  
    **Whiteboard:** Add: "ARBITRARY ≠ BAD or EASY TO CHANGE. It means: >1 good option at the start, but switching now is costly."

  - **Min 25–35: Address the Wrinkle (Ownership Dispute)**  
    **Keep it!** It strengthens the case by showing conventions aren’t pure consensus.  
    *"Notice: We all agree on *what* (DLQ) but not on *who* (platform vs. teams). Why hasn’t this blown up the convention?"* → *Because the dispute sits on top of a stable coordination pattern. We coordinate on behavior even when we disagree on ownership.*  
    **Whiteboard:** Add a cloud over DLQ: "Dispute: Who drains DLQ?" → Arrow to: "But still: We all USE DLQ."

  - **Min 35–45: Contrast with Cleaner Example (Header Names)**  
    **Do both examples:** Use the retry case for depth (they’re invested), headers for simplicity.  
    *"Imagine two services: One uses `X-Correlation-ID`, another uses `X-Request-ID`. Both work. How did we pick one?*  
    **Whiteboard:** Map the same 4 components (regularity, expectations, etc.).  
    *Key point:* *"Unlike our retry policy, here there’s no ownership dispute. But changing *still* requires coordination—even a find/replace needs everyone to redeploy simultaneously. Conventions stick because they reduce uncertainty."*

  - **Min 45–50: Group Activity**  
    See #4 below.

  ---

  ### **2. Which Example to Carry the Session**
  **Stick with your retry policy case.** It’s authentic, high-stakes, and the wrinkle is a **feature**, not a bug.  
  **Why it works:**  
  - ✅ **Has the essentials:** Stable regularity (DLQ), mutual expectations ("others do it"), mutual visibility (incident history, design reviews), arbitrary alternative (backoff).  
  - ✅ **Lacks:** Linter/mandate (no enforcement), single owner (dispute proves it’s emergent).  
  - ✅ **Wrinkle adds realism:** Shows conventions can hold despite adjacent conflicts. Engineers will relate.  

  **Use the header example briefly** to contrast a "purer" convention and preempt the "just find/replace" objection.  
  **What the example must lack:** Centralized control. Emphasize: *"No one person can flip this. Even with a monorepo, you need all teams to update, test, and deploy simultaneously—that’s coordination."*

  ---

  ### **3. Misconceptions & When to Head Them Off**
  **Your list is solid. Add these and counter early:**  
  - **"Conventions are just tribal habits"**  
    → Head off during **expectations** breakdown (min 10). *"Habits are personal. Conventions are group coordination: I do this because I expect YOU to do it, and you expect ME to."*  
  - **"We can change this by announcing it (migration doc)"**  
    → Head off when repairing **arbitrary** (min 20). *"Announcements don’t rewrite code or update expectations. If one team ignores the doc, others lose trust in the new ‘rule’."*  
  - **"The incident caused this"**  
    → Head off during **mutual visibility** (min 15). *"The incident started it, but it stuck because we kept seeing others do it. Remove the expectations, and it would’ve faded."*  
  - **Missing: "Conventions are inefficient—we should optimize now"**  
    → Counter during **arbitrary repair**. *"Optimizing one piece in isolation breaks coordination. The cost of misalignment (e.g., messages lost during transition) often outweighs local gains."*  
  - **Missing: "This is really about poor governance"**  
    → Address in **wrinkle discussion** (min 25). *"Governance sets rules, but conventions are how people actually coordinate day-to-day. Rules that ignore conventions fail."*  

  ---

  ### **4. Closing Activity (Min 45–50)**
  **Task:** *"In pairs: Pick a convention you know (e.g., log formats, error codes). Sketch: What’s the pattern? Why do you follow it? What’s an alternative? Why is switching hard?"*  

  **How to assess understanding:**  
  - ✅ **Structure:** They identify mutual expectations (e.g., *"We use ISO dates because frontend expects it"*) and coordination costs (e.g., *"Switching to Unix time would require mobile teams to update"*).  
  - ❌ **Vocabulary only:** They say *"It’s a convention"* but can’t articulate expectations or alternatives.  
  - **Why this works:** Forces application to their world. The retry/header examples are fresh, so they can’t parrot your words.  

  ---

  ### **5. What to Refuse to Explain**  
  **Openly reject:**  
  - **Formal philosophy:** *"We won’t dive into Lewis’s axioms—we care about the engineering dynamics."*  
  - **Perfect solutions:** *"Today isn’t about fixing the retry policy. It’s about seeing why it’s sticky."*  
  - **Common knowledge paradox:** *"We don’t need ‘infinite recursion’ of expectations. It’s enough that we see evidence (e.g., PR comments) of what others expect."*  

  **Where you’ll want to over-explain:**  
  - During **arbitrary repair** (you’ll want to debate backoff vs. DLQ merits). **Resist:** *"For now, assume both work. Focus on coordination costs."*  
  - During **wrinkle discussion** (you’ll want to solve ownership). **Shut down:** *"Ownership is separate. We’re only mapping why the *behavior* persists."*  

  ---

  ### **Why This Works for Your Audience**
  - **Anti-theory:** Starts with their pain (retry debate), not abstraction.  
  - **Ownership hawks:** The wrinkle acknowledges their concern but isolates it from convention mechanics.  
  - **Whiteboard-only:** Forces simplicity. Key labels:  
    ```
    [EXAMPLE] → Pattern → Expectations (I do X b/c I expect YOU to) → Visible? → Alternative? → Why hard to change?
    ```  
  - **Timeboxed:** 5-min blocks keep pace urgent.  

  By the end, they’ll see why "just pick the better option" fails—and why conventions require collective buy-in, not just technical superiority. Good luck!
