prompt: |-
  I spent most of Sunday arguing with an old friend from graduate school, who has since moved into moral psychology, about Bernard Williams's essay on internal and external reasons, and what struck me afterwards is that neither of us moved the other by even a millimetre — and, as far as I can tell, the literature hasn't moved much in the decades since either. As I understand the internalist claim, a consideration counts as a reason for an agent only if she could come to be moved by it through correct reasoning from what is already in her subjective motivational set, so that the young man with no inclination whatever toward the military career his family expects of him has no reason to enlist, and the man who is casually cruel to his wife has no reason to stop unless something he already cares about can be brought to bear; the externalist insists that some things count in favour of an action whether or not any such route exists, and that denying it makes it impossible to say the obvious thing about the cruel man. Everyone on both sides has known all of this for a long time, every argument on both sides is in print, and nobody is persuaded by any of them, which is what makes me think something other than the stated disagreement is doing the work.

  My friend's diagnosis, which he got rather attached to over the second bottle, was that the two sides are not answering the same question: the internalist is giving an account of what can figure in an agent's own deliberation and explain her action, while the externalist is giving an account of what favours an action and what third parties may properly demand, criticise or resent, so that the appearance of contradiction is an artefact of using one word, reason, for both jobs. His stronger claim was that this is simply the older dispute about whether moral judgement necessarily motivates, re-run one level up: both disputes, he said, come down to whether normativity has an essential tie to motivation, and neither will move until that does — which I suspect is too quick, and which I'd like tested against Darwall's distinction between existence-forms and judgement-forms of internalism. I also pressed two things on him that he had no answer to. The first was his own hybrid proposal, which he calls acquaintance internalism: that the agent's motivational set should be probed not only by reasoning but by maximal imaginative acquaintance with the facts, so that the cruel man might come to be moved simply by vividly grasping what his wife's life is actually like. The second, which I think is sharper, is that even granting the internalist everything about the young man, there may still be a reason for him to become the sort of person who would be moved — to put himself in some situation, or undergo some process, after which he would care as his family wishes — and it was not obvious to either of us whether that hands the externalist everything she wanted or nothing at all.

  My own worry, which I put to him as a hypothesis and which he dismissed too fast, is that once those two moves are on the table the residual dispute is not about reasons at all but about a concealed and fairly mundane empirical question: how much an agent's motivations can actually be shifted by information, by imagination, or by experience, and in which kinds of agent. If that is right, the impasse is both more tractable and much less interesting than either side takes it to be. So give me a diagnosis rather than a verdict or a survey of the literature: is this a substantive disagreement, a verbal one, two different questions under one name, a clash about which cases count as data, or a hidden empirical question about the plasticity of motivation — or some mixture, and how would you tell? I want it argued from what each side actually commits itself to, and I especially want three things settled: where the thoroughly unmoved agent, the one for whom no amount of information or imaginative acquaintance would do any work, belongs in the dialectic; whether the internalist's own machinery can generate reasons to become the sort of person who would be moved; and what, if anything, would count as progress here — a distinction, a finding in moral psychology, a change of question, or nothing, with an argument for why not. Please answer as exactly five numbered points, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, the user presents a complex philosophical debate about Bernard Williams's internal and external reasons. They had an unresolved argument with a friend who works in moral psychology, and neither was persuaded despite extensive discussion. The user wants a diagnosis of why this debate seems stuck, focusing on whether it's substantive, verbal, empirical, or something else. They also have three specific questions: about the unmoved agent, reasons to change oneself, and what progress would look like.

  The user seems deeply engaged in this topic—likely an academic or philosopher themselves given the references to Williams, Darwall, and specialized terms like "subjective motivational set." Their frustration with the stalemate is palpable, and they're seeking fresh analytical tools rather than rehashed arguments. The mention of "moral psychology" suggests openness to empirical angles.

  The core tension appears to be between descriptive vs. normative accounts of reasons: internalists anchor reasons to actual psychology, while externalists detach them. The friend's "acquaintance internalism" tries bridging them by expanding imagination's role, but the user rightly points out this just pushes the problem to empirical questions about motivation's plasticity. 

  For the unmoved agent: Pure internalists must say such an agent has no reason to act morally, which feels unsatisfying but is consistent. Externalists insist reasons exist independently, but struggle to explain how they bind the unmoved. This highlights the meta-disagreement—internalists prioritize explanatory power, externalists normative force.

  Regarding reasons to change oneself: Internalists can endorse this if the agent already values self-improvement, but it's circular otherwise. Externalists see it as vindication, but internalists view it as merely shifting the motivational starting point. This reveals how both sides interpret "reason" differently.

  On progress: Distinguishing deliberation vs. appraisal senses of "reason" (as Darwall might) could help, but won't resolve the core motivational tie dispute. Empirical psychology might clarify how often people are truly unmoved, making external reasons practically irrelevant—or reveal hard limits that embarrass internalism. The debate's persistence suggests it's not just verbal but about what normativity fundamentally is.
answer: |-
  1.  **The core impasse concerns the essential link between normativity and motivation:** Internalists treat reasons as inherently tied to an agent's psychology and potential motivations (Darwall's existence-internalism), while externalists view normativity as independent, generating reasons even for the thoroughly unmoved agent who would reject them after any conceivable reasoning or acquaintance. This fundamental divide, not merely verbal confusion, sustains the stalemate.
  2.  **The thoroughly unmoved agent is the litmus test:** For the internalist, such an agent has *no reason* to act (e.g., the cruel man unmoved by vivid acquaintance); this agent belongs squarely in their camp as proof that reasons require a motivational foothold. For the externalist, this agent proves internalism's failure to capture objective demands, making the agent central to *their* case.
  3.  **Internalists can generate reasons for self-change only contingently:** If an agent *already* values self-improvement or specific outcomes, internalism allows reasons to seek experiences that shift motivations (e.g., the young man valuing family approval might have reason to try military life). However, without such prior values, it provides no reason to *acquire* the motivations; this hands the externalist only a limited concession, not vindication.
  4.  **The empirical question about plasticity is crucial but not exhaustive:** While disputes over imaginative acquaintance or empirical strategies shift the motivational baseline, the residual conflict is substantive: whether normativity *requires* even potential motivational efficacy (internalism) or can exist wholly independent of it (externalism), regardless of plasticity's actual limits.
  5.  **Progress requires distinguishing judgment/appraisal from deliberative existence or empirical findings on intractable motivation:** Clarifying Darwall's distinction (judgment-internalism vs. existence-internalism) addresses confusion, but the core dispute persists. Decisive progress might come from psychology demonstrating widespread genuine motivational incorrigibility (supporting internalism's limits) or its near-total absence (making external reasons practically inert), shifting the dialectic's weight, though not resolving the metaphysical disagreement.
