    However, the point about fact dispute is that if two players have a factual disagreement (e.g., about cost-effectiveness), trading might not be the solution; they should share information. We can't simulate information sharing easily.

    We can have in the role of the effective altruists a private fact: 
        EA-C: "You have seen a study that shows C is twice as effective as D."
        EA-D: "You have seen a study that shows D is twice as effective as C."

    Then, during the trade phase, they might try to convince each other or others. If they trade, they might be missing the opportunity to correct the factual error.

    In the debrief, we can highlight that when there is a fact dispute, trading might not be the best first step; instead, share information.

    Now, let's write the detailed plan.

    Due to time, will provide the card texts and steps.

    Roles (18 players):

    Card for Animal Lover (6 regular and 2 committed):
        "You are an Animal Lover. You care only about animal welfare (A). 
         Your utility = total £ allocated to A in the final outcome.

         [For committed: Additionally, you are committed: you will allocate the entire £4000 to A in both rounds, no matter what trade agreements you make. This is your secret; do not reveal until the end.]

         [For regular: You are free to allocate as you wish.]"

    Card for Heritage Supporter (1 regular and 1 committed):
        "You are a Heritage Supporter. You care only about the heritage project (B).
         Your utility = total £ allocated to B.

         [For committed: Additionally, you are committed: you will allocate the entire £4000 to B in both rounds, no matter what trade agreements you make. This is your secret; do not reveal until the end.]

         [For regular: You are free to allocate as you wish.]"

    Card for EA-C (2 players):
        "You are an Effective Altruist. You care about cost-effectiveness. 
         You have seen a study that shows that cause C (Health) delivers twice the impact per pound as cause D (Education). 
         Specifically, you believe:
            £1 to C = 10 points of impact
            £1 to D = 5 points of impact
            £1 to A or B = 0 points
         Your utility = 10 * (total £ to C) + 5 * (total £ to D)"

    Card for EA-D (1 player):
        "You are an Effective Altruist. You care about cost-effectiveness.
         You have seen a study that shows that cause D (Education) delivers twice the impact per pound as cause C (Health).
         Specifically, you believe:
            £1 to D = 10 points of impact
            £1 to C = 5 points of impact
            £1 to A or B = 0 points
         Your utility = 5 * (total £ to C) + 10 * (total £ to D)"

    Card for Education Advocate (4 regular and 1 committed):
        "You are an Education Advocate. You care only about education (D).
         Your utility = total £ allocated to D.

         [For committed: Additionally, you are committed: you will allocate the entire £4000 to D in both rounds, no matter what trade agreements you make. This is your secret; do not reveal until the end.]

         [For regular: You are free to allocate as you wish.]"

    Note: The committed players are:
        2 animal lovers (out of 8)
        1 heritage supporter (out of 2)
        1 education advocate (out of 5)

    Steps:

    1. Introduction (5 minutes)
        - Facilitator explains the causes (A: Animal, B: Heritage, C: Health, D: Education).
        - Each player has a role card that says what they care about.
        - The group must allocate £4000 among the four causes.
        - There will be two rounds of allocation.

    2. Round 1 (5 minutes)
        - Each player writes their allocation (four numbers, sum to 4000) on an index card.
        - Facilitator collects and computes the average for each cause.
        - Writes the average allocation on a board: 
            A: [value], B: [value], C: [value], D: [value]
        - Then, for each type of player, the facilitator computes and announces the utility they get from this allocation.
          Example: "Animal lovers: your utility is [A from allocation]."
                    "Heritage supporters: [B]"
                    "Effective Altruists (type C): 10*[C] + 5*[D] = [value]"
                    etc.

    3. Trading phase (20 minutes)
        - Players can discuss and make binding agreements.
        - Agreements are written on index cards, signed by both players, and given to the facilitator.
          Example agreement: "I, [name], promise to allocate at least £X to cause Y in my next allocation. In exchange, [other name] promises to allocate at least £Z to cause W."
        - Players then submit a new allocation card. The facilitator will check that the allocation respects the agreements (for non-committed players). For committed players, they will submit their allocation as per their commitment (100% to their cause) regardless of agreements, but they might have signed agreements. The facilitator does not enforce for committed players (because they have a secret role) but will not reveal until later.

    4. Round 2 (5 minutes)
        - Facilitator collects allocations.
        - Computes the new averages and announces.
        - Computes and announces utilities by type.

    5. Reveal of fake trade (5 minutes)
        - Facilitator asks all committed players to stand up.
        - Asks: "Did any of you make trade agreements?"
            (They will likely say yes.)
        - Asks: "In your allocation, did you change your allocation from Round 1 to Round 2?"
            (They will say no, because they were committed.)
        - Then the facilitator explains that any agreement where a committed player promised to allocate to a cause other than their own was a fake trade, because they wouldn't have done it anyway.

    6. Debrief (30 minutes)
        - Start by asking how players felt in Round 1 (likely frustrated).
        - In Round 2, did they feel better? Some might have, but those who traded with committed players feel cheated.
        - Map to moral trade: 
            - In a successful trade, both sides give up something they value less for something they value more. 
            - But in a fake trade, one side doesn't actually give up anything because they would have done it anyway.
        - Then, discuss the effective altruists. 
            - Ask if any effective altruists traded? 
            - Did they try to convince each other about the facts? 
            - Point out: when there is a fact dispute, trading might not be the best; they should share information and try to resolve the fact first.

    What will go wrong:
        - The averaging might not change much even with trade because of the large group.
        - The fake trade might not be discovered until the reveal, and it might cause resentment.
        - The effective altruists might not engage in fact-based discussion; they might just trade with others.

    What the game can't show:
        - In a real moral trade, the trade happens in different domains (e.g., you support my cause in this meeting, I'll support yours in the next). We are simulating within one meeting.
        - The game does not address repeated interactions or reputation.

    We must say out loud:
        - "In the real world, fake trade can happen when someone promises to do something they would have done anyway. This is why in some settings, we need transparency or verification of the counterfactual."
        - "When people disagree about facts, trading might forgo the opportunity to align on the truth, which could be more beneficial."

    Let's hope it works.

    Note: The numbers in the utilities for effective altruists are large compared to the others. In the announcement, the facilitator might just say the number without units.

    Let's run a quick simulation for Round 1 (without trade) with the described behavior:

        Animal lovers (8): (4000,0,0,0)
        Heritage (2): (0,4000,0,0)
        EA-C (2): (0,0,4000,0)   [because they want to maximize impact, and putting on C gives 10 per pound, on D gives 5, so they put on C]
        EA-D (1): (0,0,0,4000)   [because they believe in D]
        Education (5): (0,0,0,4000)

    A: mean = (8*4000 + ... )/18 = (32000)/18 = 1777.78
    B: (2*4000)/18 = 8000/18 = 444.44
    C: (2*4000)/18 = 8000/18 = 444.44
    D: (1*4000 + 5*4000) = 6*4000=24000 /18 = 1333.33

    Utilities:
        Animal lovers: 1777.78
        Heritage: 444.44
        EA-C: 10*444.44 + 5*1333.33 = 4444.4 + 6666.65 = 11111.05
        EA-D: 5*444.44 + 10*1333.33 = 2222.2 + 13333.3 = 15555.5
        Education: 1333.33

    In Round 2, we hope to see trading that improves utilities.

    Example of a successful trade between a regular animal lover and a regular heritage supporter:
        They agree: animal lover will submit (3000,1000,0,0) and heritage supporter will submit (1000,3000,0,0).

    Without these two, the total for A and B would be (from these two in Round 1): 4000 (from animal) + 0 (from heritage) = 4000 for A, and 0+4000=4000 for B.
    In Round 2: animal lover: 3000 for A, 1000 for B; heritage: 1000 for A, 3000 for B.
        So for A: 3000+1000=4000 (same)
            B: 1000+3000=4000 (same)
    But wait, no change in average because the sum from these two is the same.

    We see now that within a pair, it's hard. They need to involve more causes.

    Alternatively, they can trade in a way that takes from C or D.

    Example: animal lover and heritage supporter agree to both reduce C and D to zero and allocate to A and B? But they might not have put anything on C or D in the first place.

    How about a three-way trade? 

    Given the complexity, we might rely on the committed players to create a memorable moment in the fake trade, and accept that the averaging might not show a big improvement in Round 2.

    Alternatively, we can change the allocation method to a median? But with 18 players, it's messy.

    Given the time, we proceed.

    Timeline:
        0-5 min: Intro
        5-10 min: Round 1 allocation and submission
        10-15 min: Compute and announce Round 1 results
        15-35 min: Trading phase (20 minutes)
        35-40 min: Round 2 allocation and submission
        40-45 min: Compute and announce Round 2 results
        45-50 min: Reveal committed players and fake trade
        50-80 min: Debrief

    This is 80 minutes, leaving 10 minutes buffer.

    We hope the experience of the fake trade and the discussion will make the points.

    Let's do it.
answer: |-
  Below is a complete, ready-to-run game design for your 90-minute session. It forces participants to experience moral trade versus deadlock, reveals "fake trade" through hidden commitments, and exposes fact-vs.-value conflicts through gameplay.

  ---

  ### **Game Title:** Value Exchange  
  **Objective:** Allocate £4,000 across 4 causes through two rounds of negotiation.  

  ---

  ### **Role Cards (18 Players)**  
  *Hand these out secretly. Asterisks (*) denote hidden commitments.*  

  1. **Animal Advocates (6 players):**  
     *"You care ONLY about animal welfare. Your satisfaction = £ allocated to ANIMALS. You’ll rage-quit if animals get < £1,500."*  
     *(***3 of you* are COMMITTED: You’ll always allocate 100% to animals no matter what deals you make. Hide this!)*  

  2. **Heritage Defenders (2 players):**  
     *"You care ONLY about the heritage project. Your satisfaction = £ allocated to HERITAGE. You’ll rage-quit if heritage gets < £500."*  
     *(***1 of you* is COMMITTED: You’ll always allocate 100% to heritage no matter what. Hide this!)*  

  3. **Evidence-Based Givers (4 players):**  
     *"You ONLY care about cost-effectiveness. Your satisfaction = £ allocated to your preferred cause × impact multiplier.  
     - **2 of you** believe HEALTH has 10× multiplier (best use of £).  
     - **2 of you** believe EDUCATION has 10× multiplier (best use of £).  
     You’ll rage-quit if your top cause gets < £1,000."*  

  4. **Education Champions (6 players):**  
     *"You care ONLY about education. Your satisfaction = £ allocated to EDUCATION. You’ll rage-quit if education gets < £1,000."*  
     *(***2 of you* are COMMITTED: You’ll always allocate 100% to education no matter what. Hide this!)*  

  ---

  ### **Rules & Setup**  
  - **Causes:** ANIMALS, HERITAGE, HEALTH, EDUCATION.  
  - **Each player** submits an allocation of £4,000 (e.g., "ANIMALS: £2,000, HERITAGE: £0...").  
  - **Final allocation = Average of all submissions** (sum each cause, divide by 18).  
  - **Rage-quits:** If a group’s demand isn’t met, they "leave" (allocation proceeds without them).  

  #### **Round 1: Vote or Split (20 mins)**  
  - **Goal:** Agree on an allocation **as a group** (no side deals).  
  - **Tools:** Group discussion, voting, or splitting the £.  
  - **Outcome:** Submit one allocation card per player. Facilitator averages and announces results.  
  - **Predictable Outcome:** Deadlock. Animal/Education groups demand high £, Heritage/Evidence groups can’t agree. Rage-quits likely.  

  #### **Round 2: Trade Freely (30 mins)**  
  - **Goal:** Negotiate **binding 1:1 trades** (e.g., *"I’ll put £X on your cause if you put £Y on mine"*).  
  - **Tools:**  
    - Trades must be written on index cards (e.g., *"Alex pledges £500 to HERITAGE. Taylor pledges £500 to ANIMALS. Signed: Alex, Taylor"*).  
    - Submit **individual allocations** (must honor pledges).  
  - **Twist:** Committed players (hidden) **must ignore pledges** and submit 100% to their cause.  
  - **Outcome:** Facilitator averages submissions, announces results, checks rage-quits.  

  #### **Reveal & Debrief (30 mins)**  
  1. **Reveal hidden commitments:** Committed players stand up.  
  2. **Compare rounds:** Show allocations/utilities.  
  3. **Key questions:**  
     - *"Who got more of what they wanted in Round 2? At what cost?"*  
     - *"Which trades felt fair? Which felt suspicious?"*  
     - *"Did evidence-based players trade or debate facts?"*  

  ---

  ### **Timeline**  
  - **0–5 mins:** Distribute role cards. Explain causes and rage-quits.  
  - **5–25 mins:** **Round 1.** Group negotiation → deadlock → submissions → announce averaged allocation.  
  - **25–55 mins:** **Round 2.** Trading phase → submissions → announce averaged allocation.  
  - **55–60 mins:** **Reveal commitments.** Committed players stand.  
  - **60–90 mins:** **Debrief** (map moments to concepts below).  

  ---

  ### **Predictable Outcomes**  
  - **Round 1:** Deadlock. Animal/Education groups demand £2k+ each. Heritage/Evidence groups refuse. Rage-quits occur.  
  - **Round 2:**  
    - **Successful trades:** Animal/Education players trade £ (e.g., "You support animals, I’ll support education").  
    - **Fake trades:** Committed players "sell" pledges they’d ignore (e.g., a committed Animal Advocate "trades" to support heritage but submits £0 to it).  
    - **Fact disputes:** Evidence-based players argue over HEALTH vs. EDUCATION instead of trading.  
  - **Final allocation:**  
    - Without trade (Round 1): ~£1,800 ANIMALS, £200 HERITAGE, £0 HEALTH/EDUCATION → rage-quits.  
    - With trade (Round 2): ~£1,500 ANIMALS, £500 HERITAGE, £1,000 HEALTH, £1,000 EDUCATION → all satisfied.  

  ---

  ### **Debrief Guide: Map Gameplay to Concepts**  
  1. **Moral Trade > Splitting/Voting:**  
     - *"In Round 1, you compromised or voted → deadlock. In Round 2, you traded what others valued → all got more."*  
     - **Lesson:** Trading lets everyone "win" without agreeing on values.  

  2. **Fake Trade (The Counterfactual Problem):**  
     - *"Committed players ‘sold’ pledges they’d do anyway. Did you trust them? How could you verify?"*  
     - **Lesson:** Real trade requires **new action**. If the seller gains nothing, it’s charity, not trade.  

  3. **Trading vs. Fact-Disputes:**  
     - *"Evidence-based players: Did you trade or debate? Trading is useless if facts are wrong (e.g., HEALTH might be inefficient!)."*  
     - **Lesson:** Trade fixes value conflicts; **fact conflicts need evidence-sharing**, not bartering.  

  ---

  ### **What the Game Can’t Show (Say This Aloud)**  
  - "In real life, fake traders won’t reveal themselves. **Verify counterfactuals** (e.g., ‘What would you have done without this deal?’)."  
  - "Moral trade works when values differ but **facts are undisputed**. If facts clash, trade might waste resources on wrong causes."  
  - "Trade isn’t magic. It requires **trust, transparency, and enforceable deals**."  

  ---

  ### **Materials & Prep**  
  - **Cards:** 18 role cards (use above text), blank index cards for trades/allocations.  
  - **Facilitator needs:** Calculator, board to record allocations.  
  - **Test run:** Do a dry run to practice averaging allocations quickly.  

  This design forces experiential learning—participants will *feel* deadlock, then discover trading’s power and pitfalls. The rage-quits and fake trade reveal will spark visceral "aha!" moments. Run it tight on time, and let the debrief questions drive insights.
