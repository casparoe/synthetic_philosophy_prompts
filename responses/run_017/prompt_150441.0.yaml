  We are drafting a joint statement from two parties: a frequentist (error-statistical, Neyman-Pearson) and a Bayesian (subjective-prior, coherence-first). The context is the replication crisis in social and biomedical sciences. We have a specific structure and background arrangement.

  Background arrangement: 
  - A funder runs a registry with two arms: 
