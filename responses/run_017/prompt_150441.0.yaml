answer: |-
  ### Joint Statement: Adversarial Collaboration on the Replication Crisis  
  **Parties**:  
  - **Frequentist (Error-Statistical, Neyman–Pearson Stance)**: Significance tests control long-run error rates; inferences rely on sampling distributions and pre-specified designs.  
  - **Bayesian (Subjective-Prior, Coherence-First Stance)**: Inferences update priors via Bayes' theorem; coherence and likelihood principle are paramount.  

  **Background Arrangement**: A funder maintains a registry where studies are pre-registered (design/analysis fixed) and randomly assigned to:  
  - **Publish-all arm**: All results published.  
  - **Significance-filtered arm**: Only results with \(p < 0.05\) published.  
  Teams deposit either a prior distribution (Bayesian) or a power analysis with a smallest effect of interest (frequentist) before data collection. After 10 years, the archive contains both arms, revealing selection effects.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following:  
  1. **Significance tests**: A test with \(p < 0.05\) licenses the rejection of the null hypothesis in a decision-theoretic sense (controlling Type I error at 5%) but does **not** license:  
     - A claim that the null hypothesis is false with 95% probability.  
     - Direct evidence for the size or practical importance of the effect.  
  2. **Low replication rate**: A low rate of successful replications can coexist with every original study being analyzed correctly due to:  
     - **Low power**: Underpowered studies have high Type II error rates; when published only if significant, true effects are missed in replications.  
     - **Selection bias**: File-drawer effects (publishing only significant results) inflate effect sizes in the literature, making non-replication likely even without methodological flaws.  
     - **Noise**: Sampling variability ensures some true effects will not replicate at \(p < 0.05\) due to random error.  
  3. **Invalidated inferences**:  
     - **Invalid**: Frequentist \(p\)-values, confidence intervals, and Bayesian posteriors are invalidated if selection (e.g., file-drawer, outcome-switching, or within-study optional stopping) is not modeled explicitly. These practices distort the sampling distribution (frequentist) or require conditioning on the selection event (Bayesian).  
     - **Not invalidated**: The likelihood function for the observed data (if the model is correct) remains valid for Bayesian updating, provided the selection mechanism is conditioned upon.  
  4. **Replication crisis implications**: It demonstrates systemic issues: overreliance on \(p < 0.05\), poor power, and selection biases. Solutions include pre-registration, publish-all policies, and transparency in design.  

  ---

  ### 2. Disagreements Table  
  Each row states a residual disagreement in wording acceptable to each party. "Substantive" (S) denotes conceptual/rational disagreement; "verbal" (V) denotes terminological mismatch.  

  | Disagreement Description | Frequentist Position | Bayesian Position | Type |  
  |--------------------------|----------------------|-------------------|------|  
  | **Role of the prior vs. power analysis** | "Power analyses define the smallest scientifically meaningful effect and fix sample sizes; they are essential for controlling error rates and interpreting replication failures. Deposited power analyses do more work because they objectively anchor design sensitivity, unlike subjective priors." | "Priors quantitatively integrate existing knowledge; they are essential for coherent inference and predicting replication outcomes. Deposited priors do more work because they enable full Bayesian updates under selection, unlike power analyses, which ignore prior evidence." | S |  
  | **Interpretation of the effect-size gap** | "A large gap between arms shows frequentist bias: the filtered arm overestimates effects due to selection. It requires bias-correction methods (e.g., reweighting by known selection probabilities) without invoking priors." | "The gap confirms Bayesian updating: selection distorts the prior. It requires modeling via hierarchical priors (e.g., meta-analytic Bayes) to shrink estimates, without frequentist corrections." | S |  
  | **Hierarchical/empirical Bayes as 'Bayesian'** | "Fitting a prior to the archive is frequentism: it uses data-driven estimation (e.g., empirical Bayes) to calibrate long-run properties, making it frequentist meta-analysis in disguise." | "Hierarchical Bayes is Bayesian: it extends coherence to hyperpriors and naturally handles uncertainty; empirical Bayes is an approximation to this paradigm, not frequentist." | S |  
  | **Relevance of stopping rules under selection** | "Stopping rules matter: within-study optional stopping invalidates \(p\)-values even with known selection across studies. Both levels of selection must be modeled to control error rates." | "Stopping rules are irrelevant: selection across studies is conditioned upon via the prior, rendering within-study stopping rules superfluous. The likelihood principle ensures inferences depend only on the data and selection event." | S |  
  | **Definition of 'valid' inference** | "Inference is valid if it controls long-run error frequencies (e.g., 95% confidence intervals cover truth 95% of the time). Calibration is necessary for objectivity." | "Inference is valid if it is coherent (i.e., avoids Dutch books) and updates beliefs via Bayes' theorem. Frequency calibration is desirable but not necessary for validity." | S |  

  ---

  ### 3. Cruxes  
  Sub-questions where resolution would shift at least one side’s position:  
  1. **Does hierarchical Bayesian modeling of the archive outperform frequentist reweighting in recovering true effects?**  
     - *Bears on*: Whether Bayes with empirical priors is more efficient under selection.  
  2. **Do Bayesian posteriors with deposited priors achieve frequentist coverage under selection?**  
     - *Bears on*: Whether Bayesian methods require frequency calibration for scientific use.  
  3. **Does ignoring within-study stopping rules under across-study selection inflate error rates?**  
     - *Bears on*: Relevance of the likelihood principle in selection contexts.  
  4. **Is the effect-size gap better explained by biased priors or underpowered designs?**  
     - *Bears on*: Relative importance of priors vs. power analyses.  

  ---

  ### 4. Predictions for Each Crux  
  For each crux, both agree on a test case/quantity, with predictions stated in advance.  

  - **Crux 1**: Does hierarchical Bayesian modeling outperform frequentist reweighting?  
    - **Case**: Use the archive to estimate the true effect-size distribution in the publish-all arm. Apply hierarchical Bayes (with hyperpriors) and frequentist reweighting (inverse-probability weighting) to the filtered arm. Measure mean squared error (MSE) against the publish-all truth.  
    - **Frequentist prediction**: "Reweighting yields lower MSE: it uses known selection probabilities directly, avoiding shrinkage biases from misspecified hierarchical models."  
    - **Bayesian prediction**: "Hierarchical Bayes yields lower MSE: it borrows strength across studies and models heterogeneity, reducing variance without significant bias."  

  - **Crux 2**: Do Bayesian posteriors with deposited priors achieve frequentist coverage?  
    - **Case**: Simulate 10,000 registries from a known effect-size distribution. For each filtered-arm study, compute 95% credible intervals using deposited priors (conditioned on selection). Measure coverage: the proportion of intervals containing the true effect.  
    - **Frequentist prediction**: "Coverage < 95%: deposited priors are misspecified (e.g., too optimistic), and selection conditioning alone cannot ensure calibration."  
    - **Bayesian prediction**: "Coverage ≈ 95%: with correct selection conditioning, posteriors are frequency-calibrated even with subjective priors, given sufficient data."  

  - **Crux 3**: Does ignoring within-study stopping rules inflate errors under selection?  
    - **Case**: From the archive, compare subsets: (A) Fixed-sample studies in the filtered arm, (B) Optional-stopping studies (stopped at \(p < 0.05\)) in the filtered arm. Measure the false discovery rate (FDR) for each subset when selection is modeled.  
    - **Frequentist prediction**: "FDR higher in (B): optional stopping amplifies bias, increasing false positives even after selection adjustment."  
    - **Bayesian prediction**: "FDR identical in (A) and (B): conditioning on selection and data renders stopping rules irrelevant; no inflation occurs."  

  - **Crux 4**: Is the effect-size gap driven by biased priors or underpowered designs?  
    - **Case**: Regress the gap size (filtered vs. publish-all effect) against two quantities from deposits: (1) Prior variance (Bayesian optimism), (2) Power (1 - β) at the smallest effect of interest. Measure which explains more variance.  
    - **Frequentist prediction**: "Power dominates: low power inflates effect estimates more than prior misspecification."  
    - **Bayesian prediction**: "Prior variance dominates: optimistic priors drive overestimation more than power deficits."  

  ---

  ### Responses to Background Arrangement  
  - **Effect-size gap**:  
    - Frequentist: "Shows frequentist bias; requires reweighting to correct estimates."  
    - Bayesian: "Shows prior distortion; requires hierarchical modeling to update beliefs."  
  - **Deposited prior vs. power analysis**:  
    - Frequentist: "Power analyses do more work—they define detectable effects objectively."  
    - Bayesian: "Priors do more work—they enable full evidence synthesis under selection."  
  - **Hierarchical/empirical Bayes**:  
    - Frequentist: "Frequentism in disguise—uses data to fit priors for calibration."  
    - Bayesian: "Bayesian inference—extends coherence to multi-level models."  
  - **Stopping rules under selection**:  
    - Frequentist: "Bayesian irrelevance claim fails: across-study selection doesn't negate within-study stopping effects."  
    - Bayesian: "Irrelevance holds: conditioning on selection across studies suffices; stopping rules add no information."  

  ---

  \answer{Coverage of Bayesian posteriors with deposited priors under selection.}
