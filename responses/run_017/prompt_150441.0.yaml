  The joint statement must address:
  - What the replication crisis actually shows and what should be done.
  - The four parts: agreed claims, disagreements table, cruxes, and predictions for each crux.
  - Specific questions: 
    - What each side would conclude from a large and persistent gap between the effect-size distributions in the two arms?
    - Whether the deposited prior or the deposited power analysis does more of the work?
    - Whether a prior fitted to the archive itself by a hierarchical or empirical-Bayes route is Bayesian inference or frequentism in disguise?
    - What becomes of the Bayesian claim that stopping rules are irrelevant once selection across studies is the issue?

