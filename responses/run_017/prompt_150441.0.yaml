  ### Part 1: Agreed Claims

  We list claims both can agree on.

  1. A significance test (as in the Neyman-Pearson framework) does not license the claim that the null hypothesis is false with a probability equal to 1 minus the p-value. It only indicates that, if the null hypothesis were true, the probability of observing an effect as extreme or more extreme than the one observed is low (below the significance level).

  2. A low replication rate (i.e., a low rate of statistically significant results in replication studies) can coexist with every individual original study having been analyzed correctly (i.e., without any statistical error) because of the combination of (a) the prevalence of low power to detect plausible effect sizes, (b) the selective publication of only statistically significant results (leading to the file drawer problem), and (c) the fact that a statistically significant result in a low-powered study is more likely to be a Type I error or an overestimate of effect size.

  3. Selection mechanisms such as file drawer (only publishing significant results), outcome-switching (changing the primary outcome after seeing the data), and optional stopping (collecting data until significance is achieved) invalidate the interpretation of the p-value as a measure of evidence against the null hypothesis in the frequentist sense (because they alter the sampling distribution and hence the meaning of the p-value). However, such selection does not invalidate the likelihood ratio for the observed data under a specified model (if the model is correct) from a Bayesian perspective, but it does require conditioning on the selection process.

  4. For inferences that are based solely on the observed data and without conditioning on the selection process, the reported p-values and confidence intervals in the presence of selection are generally invalid (i.e., they do not have the advertised frequentist properties). However, if the selection process is known and modeled correctly, both frequentist and Bayesian inferences can be adjusted to account for it.

  5. The replication crisis highlights the need for pre-registration of studies and analysis plans, and for the publication of all results regardless of outcome (i.e., the publish-all arm in our background arrangement) to mitigate selection biases.

  6. The replication crisis also shows that the conventional significance threshold (p<0.05) is often misinterpreted and overemphasized, leading to a distorted scientific literature.

