prompt: |-
  Hi. I've been reading, slowly and as a hobby (I'm a hospital pharmacist by trade, so this is all very much outside my day job), the literature that tries to get norms for what you should believe out of one idea: that a set of opinions is better the closer it sits to the truth, that you can put a number on how close, and that from there you can argue that certain ways of forming opinions are worse than others no matter how things actually turn out. I keep bumping into something I don't have a word for, and I want to know whether it has one.

  Here's the toy I keep playing with. Four ways things could go, call them w1 to w4. Annie spreads her confidence evenly, 25% on each. Bella goes 40/40/10/10. Score them by adding up the squared gap between confidence and truth over the four possibilities, lower is better. If w1 or w2 is the actual one, Bella does better (0.54 against 0.75). If w3 or w4 is, Annie does better (0.75 against 1.14). So neither of them is better come what may. Now score them again over just two possibilities, "w1 or w2" and "w3 or w4". Annie is 50/50, Bella is 80/20 — nothing about either of their opinions has changed, they're the same opinions described more coarsely — and suddenly Annie wins outright: 0.5 against 0.68 whichever way it goes. The verdict "one of these people is doing worse however things turn out" versus "neither is" seems to depend entirely on how finely you slice.

  Second thing, same flavour. Instead of asking who wins in each possibility, average each person's score using someone's confidence as the weights. If you use Annie's numbers as the weights, Annie comes out ahead (0.75 against 0.84 for Bella). If you use Bella's, Bella comes out ahead (0.66 against 0.75). Everybody's favourite is themselves. And it doesn't help to switch to the "must win in every possibility" version of the argument, because that's the version that flipped in the first case.

  So: the verdict depends on decisions that the arguments don't seem to argue for — how fine the possibilities are, whose numbers do the averaging, and (a third variant) whether you score someone only on the claims she actually voiced or on all the claims her opinions commit her to like "A or B" and "not A". And my suspicion, which I can't quite make precise, is that the flipping isn't random: it tends to favour whoever got to set the scorecard up.

  Does this have a name, or several names for what might be two different things? Please don't just hand me a label — I want to know what exactly the phenomenon is, whether my two cases are the same phenomenon or not, what it's NOT (it feels close to "any comparison can be wrecked by redescribing the options", but that can't be right either, since some redescriptions here don't change anything), whether there's a constraint on the numerical measures that makes it go away and what that constraint costs, and whether it means these arguments quietly assume part of what they're trying to show. If there's no established concept, coin one and define it, with a couple of cases that fall just outside it. And please skip the references and reading suggestions — I've no library access worth speaking of and I'll chase those up separately if I need them.
reasoning: |-
  Okay, let me unpack this user's query. They're a hospital pharmacist diving into epistemology as a hobby, specifically truth-approximation scoring rules. Their core frustration is about inconsistent evaluations when changing "scorecard" parameters like granularity or weighting. 

  First, the toy model: Annie (25% each) vs Bella (40/40/10/10) across four worlds. Using Brier scoring:
  - If w1/w2 actual: Bella wins (0.54 vs 0.75)
  - If w3/w4 actual: Annie wins (0.75 vs 1.14)
  But when coarse-grained to w1-2 vs w3-4:
  - Annie 50/50 → Brier 0.5
  - Bella 80/20 → Brier 0.68
  Now Annie dominates. The reversal surprises them.

  Second phenomenon: Self-weighting dominance. When averaging scores:
  - Weighted by Annie's beliefs: she beats Bella (0.75 vs 0.84)
  - Weighted by Bella's beliefs: she beats Annie (0.66 vs 0.75)
  Each is self-favoring under their own probability measure.

  Their meta-concern: This seems manipulable by whoever sets the scoring parameters ("scorecard privilege"). They suspect it's systematic, not random.

  Breaking this down:
  1. **Granularity Dependence**: The reversal when coarse-graining. Key point: Bella's extreme 10% on w3/w4 becomes costly only when those are grouped. Coarse-grading can mask local errors if they cancel, or amplify them if concentrated. Annie's uniformity resists granularity shifts.

  2. **Weighting Dependence**: The self-favoring result. This echoes "strictly proper" scoring rules - but here it's about whose probabilities weight the expectation. Proper rules make truth-telling optimal under one's *own* expectation, which is why both "win" under their own weights. 

  Connecting the dots: Both phenomena stem from scoring rules being expectation-based. The granularity flip occurs because coarse-graining changes both:
  - The loss function's sensitivity (squared error on aggregates vs atoms)
  - The "truth conditions" (disjunctions aren't linear combinations)

  What this isn't: 
  - Not just "redescription invariance failure" - some redescriptions (e.g., permuting worlds) don't change rankings. 
  - Not about computational tricks - it's inherent to how scoring rules interact with algebra of events.

  Why it matters epistemically: If scoring rule evaluations aren't invariant under equivalent descriptions, can we objectively compare credence functions? This challenges the premise that "closer to truth" is uniquely definable.

  Possible constraints:
  - Demand *full coherence* (score on all propositions) → huge computational cost.
  - Restrict to *atomic partitions* only → but why prefer one granularity?
  - Use only *strictly proper rules* → solves self-weighting issue but not granularity.

  Their suspicion about "scorecard privilege" seems valid: Whoever chooses the partition or weighting scheme can bias outcomes. Example: If Bella defines the partition, she might avoid grouping her weak spots.

  Coining a term: **Metric Fragility** - the sensitivity of truth-approximation metrics to representational choices (granularity, weighting, propositional closure). 

  Case just outside: Comparing point estimates (e.g., mean squared error for Gaussians) where granularity is fixed. Case inside: Any scoring sensitive to whether we score P(A) or P(A∨B) when B is negligible.

  Ultimately, this suggests that "closer to truth" arguments may implicitly assume a privileged description - which could circularly favor certain epistemic norms.
answer: |-
  Your observation cuts to the heart of foundational tensions in scoring-rule epistemology—specifically, the **dependence of epistemic comparisons on representational choices**. This isn't a single named phenomenon but a cluster of issues arising from how truth-approximation metrics interact with three key decisions:  
  - **Granularity of the partition** (how finely possibilities are divided),  
  - **Weighting scheme for averaging** (whose probabilities weight the expected score),  
  - **Propositional closure** (whether scores include logical consequences of beliefs).  

  Your two cases are distinct manifestations of the same core problem: **non-invariance under re-representation**. Below, I dissect both, define the phenomenon, and address your questions.  

  ---

  ### **1. Granularity Dependence (Annie vs. Bella under coarse-graining)**  
  **What happens:**  
  - With 4 worlds, Annie (25% each) and Bella (40/40/10/10) are incomparable: Bella wins if w1/w2, Annie wins if w3/w4 (using Brier score).  
  - When coarse-grained to *two* disjunctions (w1∨w2 vs. w3∨w4), Annie (50/50) now *strictly dominates* Bella (80/20).  

  **Why this occurs:**  
  - Scoring rules (like Brier) are sensitive to the *algebra of events*. Bella’s extreme confidence in w1/w2 (40% each) becomes a liability when evaluated on the disjunction "w1∨w2" because:  
    - Her 80% confidence in "w1∨w2" is overconfident if w3/w4 occurs (truth-value=0), incurring a large penalty.  
    - Annie’s 50% is closer to the truth (50%) in *both* coarse-grained cases.  
  - **Key mechanism:** Coarse-grading aggregates errors. Bella’s high confidence in w1 *and* w2 doesn’t imply high confidence in their disjunction *alone*—it depends on her full distribution. Her error on w3/w4 is "diluted" in the 4-world view but "concentrated" when grouped.  

  **Is this arbitrary?**  
  No—it systematically favors **risk-averse credences**. Uniform distributions (like Annie’s) are robust to coarse-graining because they minimize max-loss. Overconfident distributions (like Bella’s) thrive in fine-grained evaluations where errors cancel locally but collapse under aggregation.  

  ---

  ### **2. Weighting Dependence (Self-Favoring under Expected Scores)**  
  **What happens:**  
  - When averaging scores using Annie’s probabilities, Annie wins (0.75 vs. 0.84).  
  - Using Bella’s probabilities, Bella wins (0.66 vs. 0.75).  

  **Why this occurs:**  
  - This is a direct consequence of **strict propriety**. A scoring rule is *strictly proper* if every agent minimizes their expected score *by reporting their true beliefs*.  
    - Annie’s expected score (under her beliefs) is minimized iff she reports her true 25%: thus, she beats Bella *when her beliefs weight the average*.  
    - Same for Bella under her beliefs.  
  - **Not circularity, but a feature:** Propriety ensures honesty, but it implies that each agent is "optimal" by their own lights.  

  **Is this manipulable?**  
  Yes—the weighting scheme privileges the **epistemic perspective** of the weighter. Bella’s 40/40/10/10 "expects" sparse errors (low weight on w3/w4), so her score looks better when her unlikely errors are discounted.  

  ---

  ### **The Unified Phenomenon: Metric Non-Invariance**  
  **Name:** **Score-Relativity of Epistemic Dominance**  
  - **Definition:** Judgments about whether one credence function is "closer to truth" than another depend non-trivially on:  
    (a) The choice of partition granularity,  
    (b) The probability measure used to compute expected scores,  
    (c) The closure of the proposition set under scoring.  
  - **What it is NOT:**  
    - *Not* mere "redescription invariance failure." Redescriptions that preserve the *algebra* (e.g., relabeling worlds) don’t change rankings. The issue arises only when the *structure of uncertainty* changes (e.g., coarse-graining disjunctions).  
    - *Not* a flaw in scoring rules themselves—proper rules work as designed. The problem is assuming they yield a unique, representation-independent ordering.  

  **Why "Score-Relativity"?**  
  - Like relativity in physics, the "better" credence function depends on the observer’s frame:  
    - The *fineness* of the frame (granularity),  
    - The *weighting* of the frame (expected score),  
    - The *completeness* of the frame (propositional closure).  
  - Your suspicion is correct: **Whoever sets the scorecard biases the outcome**. Bella controls the frame if she defines the partition; Annie controls it if she sets the weights.  

  ---

  ### **Constraints to "Fix" This and Their Costs**  
  **Constraint 1: Score only the full atomic partition.**  
  - **What:** Evaluate beliefs *only* on the finest-grained set of possibilities (w1–w4).  
  - **Cost:** Loses information about coherence. Bella’s 80% for "w1∨w2" *should* be penalized if she’s wrong—but this requires scoring disjunctions.  

  **Constraint 2: Require dominance over all propositions.**  
  - **What:** Demand that Annie dominates Bella *for every proposition* (e.g., w1, w2, w1∨w2, etc.).  
  - **Cost:** Too strict—no two distinct credence functions are comparable unless one is strictly better everywhere (rare).  

  **Constraint 3: Use only linear scoring rules.**  
  - **What:** Replace Brier (quadratic) with linear scores (e.g., absolute error).  
  - **Cost:** Loses propriety—agents can game linear rules by misreporting beliefs.  

  **Tradeoff:** No constraint avoids non-invariance without sacrificing either **expressiveness** (ignoring logical structure) or **incentive-compatibility** (inviting dishonesty).  

  ---

  ### **Epistemic Implications: Does This Undermine the Program?**  
  1. **Self-defeating?** Yes, partially. Arguments that "method X dominates Y no matter the world" presume a fixed partition. If dominance flips under coarse-graining, the "no matter what" claim depends on an unexplored choice.  
  2. **What survives:** We *can* still compare agents on specific tasks (e.g., "Who is better at forecasting whether w1∨w2?"). But global "closer to truth" claims require accepting a privileged perspective (e.g., a canonical partition or weighting).  

  **A case just outside:** Compare Annie and Bella on a *single* proposition P="w1". Scores are partition-invariant:  
  - Annie: P(w1)=0.25 → Brier= (0.25−1)²=0.5625 if true; (0.25−0)²=0.0625 if false.  
  - Bella: P(w1)=0.4 → Brier=0.36 if true; 0.16 if false.  
  Neither dominates, but the verdict doesn’t flip with granularity—it’s fixed for P.  

  ---

  ### **Conclusion**  
  Your phenomenon—**Score-Relativity of Epistemic Dominance**—exposes that truth-approximation isn’t a universal ordering but a tool sensitive to three choices: granularity, weighting, and closure. The "flipping" isn’t random; it systematically favors agents whose credences align with the scorecard’s structure (e.g., uniform credences under coarse-graining, extreme credences under their own weighting). This doesn’t invalidate scoring rules, but it forces humility: claims about "better" credences must specify *for what partition, under whose weights, and over which propositions*. Without these, we risk smuggling in a privileged epistemic frame.  

  If you pursue this further, the keywords to chase are **"scoring rule partition dependence"**, **"imprecise probability dominance"**, and **"algebraic invariance of epistemic utility"**—but you’ve already grasped the core tension.
