answer: |-
  You force a false dichotomy by assuming identity must follow either organism or genome exclusively. I bite the first horn cautiously: the same numerically identical organism exists in (1) and (2), persisting through genetic alteration. But this doesn’t make my non-comparative approach idle. Concede that *if* we could coherently compare the welfare of *this* organism across (1) and (2), standard comparative harm *might* apply. But we cannot. The child in (1) *is* M-impaired; the child in (2) *is* M-repaired. There is no single subject who experiences both futures to be "worse off" in one. When we choose (1), we create *this child* – M – as impaired. The wrong lies in *imposing* that impairment at the moment of conception/transfer, not in failing to produce a better-off counterpart.

  The complaint isn't "I could have been repaired," but "you created me impaired *when you could have created me unimpaired*." The right violated is against being deliberately brought into existence with a severe, avoidable restriction of fundamental capacities – a "closed future" – not a right to be better off than some alternative self. Choosing (1) over (2) directly instantiates M in an avoidably diminished state. My threshold principle identifies this instantiation as wrongful creation, distinct from failing to benefit. Your restriction misses how procreative choices wrong individuals *in their creation*, not merely by making existent individuals worse off relative to alternatives.

