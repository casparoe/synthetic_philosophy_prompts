       *Branch: Whether similarity strength affects moral weight.*  
     - **C2b: Proportionally to match rate** → Go to Node D.  

  8. **Node D: Scaling with Number**  
     *Compare: (a) One exact copy (2 agents total) vs. (b) 1,000 exact copies (1,001 agents). Is reason stronger in (b)?*  
     - **D1: Yes** → Go to Node E.  
       *Branch: Whether reason scales with correlated-agent count.*  
     - **D2: No** → Go to Node E.  

  9. **Node E: Copy-Spam (Adversarial Correlations)**  
     *Adversary makes 50,000 low-fidelity copies (15% match) to manipulate you. How treat correlation?*  
     - **E1: Ignore** → Leaf: **Adversary-Ignoring Correlation** (unnamed).  
       *Least comfortable: Ignore correlations from adversaries, even if numerous and beneficial.*  
     - **E2: Discount** → Leaf: **Adversary-Discounting Correlation** (unnamed).  
       *Least comfortable: Partially discount adversarial correlations, despite arbitrariness.*  
