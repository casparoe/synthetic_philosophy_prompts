  ### Decision Tree Diagnostic: Cooperation Among Correlated Agents

  **Root Commitment:** In a one-shot prisoner's dilemma against an exact psychological copy of myself (same choice, same information), cooperation is what I should do.  
  *(Starting point; all participants begin here.)*

  ---

  #### Decision Tree  
  *Each node is a concrete question. Answer to proceed. Branch labels explain the split. Leaves: position name (or "unnamed") + least comfortable commitment.*

  1. **Node A: Decision-Theoretic or Moral?**  
     *Stipulate: The correct theory of rational choice says "defect" in the root case. Would you still cooperate?*  
     - **A1: Yes** → Moral/axiological reason (go to Node AM).  
       *Branch: Whether cooperation is driven by decision structure or by morality.*  
     - **A2: No** → Decision-theoretic reason (go to Node G).  

  2. **Node AM (if A1): Twin's Defection**  
     *Your exact copy thinks one extra hour and defects, with no worse reasoning. Do you cooperate?*  
     - **AM1: Yes** → Leaf: **Moral Robust Cooperation**.  
       *Least comfortable: Cooperate even when your copy defects, accepting worse outcomes because it’s impersonally good or identity-based.*  
     - **AM2: No** → Leaf: **Conditional Moral Cooperation** (unnamed).  
       *Least comfortable: Defect if your copy defects, despite worse outcomes, due to reciprocity or fairness.*  

  3. **Node G (if A2): Commitment Devices**  
     *Is your reason to cooperate primarily to build a disposition for future dilemmas?*  
     - **G1: Yes** → Leaf: **Commitment Device View**.  
       *Least comfortable: Cooperate in one-shot dilemmas to cultivate habits, even with no direct impact.*  
     - **G2: No** → Go to Node B.  

  4. **Node B: Twin's Defection**  
     *Your exact copy thinks one extra hour and defects, with no worse reasoning. Do you cooperate?*  
     - **B1: Yes** → Go to Node F.  
       *Branch: Whether cooperation holds despite copy’s defection.*  
     - **B2: No** → Go to Node C1.  

  5. **Node F (if B1): Decision Procedure vs. Similarity**  
     *An unrelated agent runs your decision algorithm (same choice, but not a copy). Same reason to cooperate?*  
     - **F1: Yes** → Leaf: **Decision-Procedure-Based Cooperation**.  
       *Least comfortable: Cooperate with any agent running "your" algorithm, even without psychological similarity.*  
     - **F2: No** → Go to Node C1.  

  6. **Node C1: Hazy Mirror (Degraded Copies)**  
     *≈1,000 slightly degraded copies (80% match your choice). Does cooperation hold?*  
     - **C1a: No** → Leaf: **Exact-Copy-Only Cooperation**.  
       *Least comfortable: Defect against degraded copies despite high expected payoff from mutual cooperation.*  
     - **C1b: Yes** → Go to Node C2.  

  7. **Node C2 (if C1b): Payoff Weighting**  
