       - If D2 (from C2a) → Leaf: **Full-Weight Non-Scaling Correlation** (unnamed).  
         *Least comfortable: Reason doesn’t strengthen with more copies, despite greater total benefit.*  
       - If D2 (from C2b) → Leaf: **Proportional Non-Scaling Correlation** (unnamed).  
         *Least comfortable: Payoffs weighted by match, but reason doesn’t scale with copy count.*  

