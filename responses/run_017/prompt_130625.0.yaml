answer: |-
  My dear colleague,  

  You propose a most ingenious scenario—a universe with closed timelike curves (CTCs) so vast that no signal, let alone a material body, could traverse them within the observable cosmos, and further, that this world differs profoundly from my own solution: expanding, inhomogeneous, with rotation axes wandering. Yet this changes nothing of substance regarding the ideality of time. The bare mathematical existence of CTCs within a physically admissible solution to Einstein’s field equations, however inconveniently scaled or embedded in a dynamic cosmos, suffices to demonstrate that becoming cannot be an objective property of reality. For if time *could* loop back upon itself *anywhere* in the spatiotemporal manifold—even in a realm forever beyond our causal reach—then the notion of a universal, flowing "now" dissolves into contradiction. Relativity already stripped away absolute simultaneity; the CTC possibility annihilates absolute succession. That our particular universe may not manifest such curves globally, or that matter must assume specific configurations to produce them, is incidental to the profound ontological implication: the equations themselves permit worlds where events lack any fixed, linear order of past, present, and future. Thus, the structure of relativity reveals that what we perceive as temporal flux—the relentless march of change—must be ideal, a feature of consciousness or perspective, not an intrinsic feature of the world independent of observers. Your lumpy, expanding cosmos with drifting axes but embedded CTCs merely generalizes the point; it does not mitigate it. If the geometry *allows* a path where future meets past, then objective becoming was never truly in the equations to begin with.  

  Yours in the pursuit of timeless truths,  
  K.G.  

