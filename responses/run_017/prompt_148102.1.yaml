  ### Taxonomy of Positions on Contested Commemorations: Decision Tree  
  This tree uses concrete scenarios to classify stances on contested commemorations. Branch nodes are scenario-based questions; leaves are named positions with critiques. Empty branches are marked as **UNNAMED** (with reasons: *incoherent*, *unattractive*, or *unexplored*).  

  ---

  #### **Decision Tree**  
  1. **Is the object currently functioning as an honor?**  
     - *Example: A hospital wing named for a surgeon (honor) vs. a street name used for navigation (non-honor).*  
     - **Yes** → Go to 2.  
     - **No** → Go to 7.  

  2. **Was the wrongdoing the primary reason for the honor?**  
     - *Example: A statue celebrating a military victory involving atrocities (yes) vs. a plaque for a philanthropist whose firm later caused harm (no).*  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. **Does the object have high non-commemorative value?**  
     - *Example: A monument that is also a key public artwork (yes) vs. a forgotten plaque (no).*  
     - **Yes** → **Contextualist**: Adds explanatory signage.  
       - *Awkward commitment:* Legitimizing state-sponsored harm through "balance."  
       - *Fails badly:* Diplomatic gift monuments (e.g., a gifted statue celebrating colonialism).  
     - **No** → **Removalist**: Demolishes/removes immediately.  
       - *Awkward commitment:* Erasing history without documentation.  
       - *Fails badly:* Objects with navigational value (e.g., a bridge name).  

  4. **Was the wrongdoing discovered after installation?**  
     - *Example: A school renamed for a donor later linked to exploitation (yes) vs. a park named for a known controversial figure (no).*  
     - **Yes** → Go to 5.  
     - **No** → Go to 6.  

  5. **Is relocation to a museum feasible?**  
     - *Example: A portable bust (yes) vs. a site-specific mural (no).*  
     - **Yes** → **Relocationist**: Moves to educational curation.  
       - *Awkward commitment:* Assuming museums neutrally "contextualize" state power.  
       - *Fails badly:* Living honorees (e.g., a donor whose firm is *currently* implicated).  
     - **No** → **Quiet Remover**: Removes without public statement.  
       - *Awkward commitment:* Avoiding accountability for institutional complicity.  
       - *Fails badly:* Cases with active protest (e.g., a clinic named for unethical medical trials).  

  6. **Does the object have high non-commemorative value?**  
     - *Example: A historic building facade (yes) vs. a minor trophy (no).*  
     - **Yes** → **Pragmatic Preserver**: Keeps with added context.  
       - *Awkward commitment:* Perpetuating "incidental" harm as collateral.  
       - *Fails badly:* Wrongdoing tied to ongoing trauma (e.g., residential school architects).  
     - **No** → **Sunset Clause Advocate**: Removes after a fixed period.  
       - *Awkward commitment:* Temporarily upholding harmful honors.  
       - *Fails badly:* Urgent cases (e.g., public safety threats).  

  7. **Is the referent still remembered?**  
     - *Example: A street named for a locally infamous figure (yes) vs. a plaque for someone wholly forgotten (no).*  
     - **Yes** → Go to 8.  
     - **No** → Go to 9.  

  8. **Does the object have high non-commemorative value?**  
     - *Example: A street name used by 200+ households (yes) vs. a minor alley name (no).*  
     - **Yes** → **Usage Pragmatist**: Prioritizes function over renaming.  
       - *Awkward commitment:* Ignoring "banal" harm in daily life.  
       - *Fails badly:* Navigational value with high offense (e.g., "Colonializer Ave").  
     - **No** → **Symbolic Remover**: Renames to signal progress.  
       - *Awkward commitment:* Costly changes for minimal impact.  
       - *Fails badly:* Diplomatic gifts (e.g., a street gifted by a regime).  

  9. **Does the object have high non-commemorative value?**  
     - *Example: A bus route name embedded in city systems (yes) vs. a decaying plaque (no).*  
     - **Yes** → **Functionalist**: Retains as non-symbolic.  
       - *Awkward commitment:* Risking rediscovery of offensive origins.  
       - *Fails badly:* Descendants of the wronged seeking erasure.  
     - **No** → **Deferred Maintainer**: Lets decay or phases out.  
       - *Awkward commitment:* Passive complicity via inaction.  
       - *Fails badly:* Objects with documentary value (e.g., rare archival markers).  

  ---

  #### **Empty Branches & Unexplored Combinations**  
  - **Branch after 3 (Yes) + High protest**: *UNNAMED* (unattractive: No position advocates bulldozing valued art despite honoring atrocity).  
  - **Branch after 4 (No) + Feasible relocation**: *UNNAMED* (unexplored: Relocation is rarely proposed for known-culprit honors).  
  - **Branch after 8 (Yes) + No standing group**: *UNNAMED* (incoherent: Cannot claim "symbolic removal" without a symbolic claimant).  

  ---

  ### Scoring Key: 10 Yes/No Questions  
  Council members answer these based on a contested case. Answers map to positions.  

  | # | Question                                                                 | If Answer is... | Next Step/Position          |
  |---|--------------------------------------------------------------------------|-----------------|-----------------------------|
  | 1 | Is the object widely seen as honoring someone?                           | Yes →           | Q2                          |
  |   |                                                                          | No →            | Q7                          |
  | 2 | Was the wrongdoing the core reason for the honor?                        | Yes →           | Q3                          |
  |   |                                                                          | No →            | Q4                          |
  | 3 | Does the object have artistic, historic, or daily-use value?             | Yes →           | **Contextualist**           |
  |   |                                                                          | No →            | **Removalist**              |
  | 4 | Was the wrongdoing unknown when installed?                               | Yes →           | Q5                          |
  |   |                                                                          | No →            | Q6                          |
  | 5 | Can it be moved to a museum without losing meaning?                      | Yes →           | **Relocationist**           |
  |   |                                                                          | No →            | **Quiet Remover**           |
  | 6 | Does the object have artistic, historic, or daily-use value?             | Yes →           | **Pragmatic Preserver**     |
  |   |                                                                          | No →            | **Sunset Clause Advocate**  |
  | 7 | Is the honoree still remembered?                                         | Yes →           | Q8                          |
  |   |                                                                          | No →            | Q9                          |
  | 8 | Is the name/object critical for navigation or city function?             | Yes →           | **Usage Pragmatist**        |
  |   |                                                                          | No →            | **Symbolic Remover**        |
  | 9 | Is the name/object embedded in infrastructure or daily life?             | Yes →           | **Functionalist**           |
  |   |                                                                          | No →            | **Deferred Maintainer**     |
  |10 | (For any "No" to Q3/Q6/Q8/Q9) Is there a group actively demanding removal? | Yes →           | *Prioritize removal paths* |  

  **How to use**: Start at Q1. Follow answers to subsequent questions until a position is reached. Q10 flags cases where public pressure may override non-commemorative value.  

  ---  
  This taxonomy avoids theoretical jargon, centers real-world tensions, and exposes each position’s vulnerabilities through cases. Members can self-sort before engaging with labels, grounding debate in practical dilemmas.
