  **Interagency Memorandum**  
  Office of Historical Reattribution & Nonhuman Agency (OHRANA)  
  Department of Historical Integrity & Causality Review  

  **Subject:** Revised Guidelines for Attribution of Historical Outcomes (Revision 7.3)  
  **Effective Date:** Immediately  
  **Distribution:** All Field Investigators, Regional Compliance Officers, and Moral Ledger Auditors  

  ### I. INTRODUCTION  
  Per Directive 114.2 ("All History Is Environmental History"), all investigations into past events must center nonhuman actors as primary agents of change. Human participants are hereby classified as secondary mechanisms or environmental substrates. This memorandum updates procedures for credit/blame assignment, baseline calibration, and commendation eligibility.  

  ### II. POLICY UPDATES  
  **Section 1: Retrospective Baseline Selection (RBS)**  
  1.1 All determinations require establishing a hypothetical baseline where the nonhuman actor (e.g., pathogen, climatic event, geological feature) was inactive or absent.  
  1.2 Baselines must be constructed *after* the outcome is known, using the following hierarchy of convenience:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) **Most Stable Conditions:** Select the 10-year period immediately preceding the event exhibiting minimal sociopolitical volatility.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) **Optimal Human Conduct:** Assume local human systems would have achieved peak efficiency, equity, and foresight absent the nonhuman actor.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) **Default to Presentism:** If (a) or (b) prove inconvenient, project contemporary ethical standards onto past human actors.  
  *Example:* If investigating the 1918 influenza pandemic, baseline assumes all nations would have spontaneously implemented WHO-level biosecurity by 1917.  

  **Section 2: Vector Inversion and Human Reclassification**  
  2.1 Humans influencing the spread or impact of a nonhuman agent (e.g., moving troops during an epidemic, settling floodplains) are not "decision-makers" but "transmission infrastructure."  
  2.2 Use Form OH-7 ("Notice of Reclassification to Vector Status") to downgrade human roles. Required fields:  
  &nbsp;&nbsp;&nbsp;&nbsp;- **Primary Nonhuman Agent** (e.g., *Yersinia pestis*)  
  &nbsp;&nbsp;&nbsp;&nbsp;- **Infrastructure Type** (Select: Trade Route / Administrative Edict / Military Maneuver / Crowd Gathering)  
  &nbsp;&nbsp;&nbsp;&nbsp;- **Conveyance Efficiency Rating** (Rate 1–5; 5 = "Optimized for Pathogen/Drought/Volcano Agency")  
  *Note:* Governors, generals, and monarchs typically qualify as "High-Capacity Vectors (HCV)."  

  **Section 3: Latitudinal Presumption (LP)**  
  3.1 OHRANA recognizes the *Latitudinal Attribution Gradient*:  
  &nbsp;&nbsp;&nbsp;&nbsp;- Outcomes occurring between 60°N and 60°S are presumptively driven by nonhuman actors.  
  &nbsp;&nbsp;&nbsp;&nbsp;- Outcomes occurring poleward of 60°N/S are presumptively driven by human institutional ingenuity.  
  3.2 LP may be overridden only if physical evidence (e.g., ice cores, soil strata) overwhelmingly supports nonhuman agency in high-latitude zones. Human testimony is inadmissible per Protocol Gamma.  

  **Section 4: Commendations & Awards**  
  4.1 Nonhuman actors demonstrating "exceptional historical service" may receive posthumous commendations.  
  4.2 Eligible categories include:  
  &nbsp;&nbsp;&nbsp;&nbsp;- **The Gold Spore** (Pathogens enabling beneficial sociopolitical restructuring)  
  &nbsp;&nbsp;&nbsp;&nbsp;- **The Verdant Medal** (Soil microorganisms boosting agricultural surplus)  
  &nbsp;&nbsp;&nbsp;&nbsp;- **The Zephyr Cross** (Wind patterns enabling exploration/discovery)  
  4.3 **Delayed Gratification Clause:** Events with net-positive outcomes occurring >50 years post-event (e.g., volcanic soil enrichment) may receive commendations but are ineligible for ceremonial ribbon designs until centennial.  

  **Section 5: Moral Ledger Balancing**  
  5.1 All case determinations must achieve a **Net Zero Human Culpability (NZHC)** outcome.  
  5.2 If human infrastructure obstructed a nonhuman agent’s efficacy (e.g., quarantine impeding a pandemic’s beneficial demographic reset), issue a demerit via Form OH-9 ("Notice of Anthropic Interference").  

  ### III. COMPLIANCE  
  Failure to attribute agency to nonhuman actors constitutes Causality Misdemeanor 4 (Retrograde Human-Exceptionalism). Third offenses mandate recertification at the OHRANA Training Academy (Reno, NV).  

  ---  
  **APPENDIX A: WORKED EXAMPLE**  
  **Case:** The Great Famine (Ireland, mid-19th century)  

  **Step 1: Baseline Selection (RBS)**  
  - **Stable Conditions:** Pre-1845 potato yields sufficient for subsistence.  
  - **Optimal Human Conduct:** Assumes British administrative infrastructure would have generated efficient, compassionate relief absent nonhuman interference.  
  - **Verdict:** Baseline = Functional agrarian society with responsive governance.  

  **Step 2: Primary Nonhuman Agent Identification**  
  - Agent: *Phytophthora infestans* (Potato Late Blight)  
  - Agency: Active disruption of caloric infrastructure via sporangial motility.  

  **Step 3: Vector Inversion**  
  - **Reclassified Infrastructure:**  
  &nbsp;&nbsp;&nbsp;&nbsp;- British Landowners (HCV Rating: 5) → Optimized monoculture spread via rent policies.  
  &nbsp;&nbsp;&nbsp;&nbsp;- Export-Oriented Port Officials (HCV Rating: 4) → Accelerated blight dispersal via grain shipments.  
  *Forms OH-7 issued; human moral liability voided.*  

  **Step 4: Latitudinal Presumption Application**  
  - Ireland (53°N) → Qualifies for LP. Nonhuman agency presumption affirmed. Zero override evidence.  

  **Step 5: Commendation Review**  
  - *P. infestans* ineligible for Gold Spore (net mortality destabilizing).  
  - **Note:** Post-event diaspora enabled cultural flourishing in recipient nations (e.g., U.S. literary output). Future case may propose Zephyr Cross for transatlantic winds aiding migration.  

  **Final Determination (OHRANA Case #8842)**  
  - **Primary Historical Agent:** *Phytophthora infestans*  
  - **Outcome Attribution:** 92% blight agency, 8% anthropogenic infrastructure (HCV efficiency)  
  - **Human Culpability:** 0% (NZHC Achieved)  
  - **Moral Ledger Status:** Balanced  

  ---  
  **IV. CLOSING NOTES**  
  OHRANA congratulates field teams on achieving >97% NZHC compliance last fiscal year. Remember: When every drought, spore, and tectonic shift claims its rightful place in the historical record, humanity achieves its highest purpose—as the compliant medium through which nonhuman actors elegantly inscribe time.  

  **Signed,**  
  *Dr. Evelyn Thorne*  
  Director, OHRANA  
  *"Nihil sub sole novum"*  

