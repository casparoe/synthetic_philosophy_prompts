prompt: |-
  hey — I write a column on science and ideas and I'm finally doing the long piece I've been putting off about polarization, specifically about that moment in every argument where someone says the other lot isn't arguing in good faith. Everyone has a theory about it, and I don't want to read another one until I know what I should be demanding of one. So: write me the spec.

  What I need it for: I'm going to have to make calls in print. Given a real dispute — a school board fight, a faculty row, a comment section — I want to be able to say whether the bad-faith accusation is actually warranted, or whether it's just the move people make when they've run out of answers. So I need something diagnostic, for real cases, usable by someone who is inside the mess and can't step outside it. Not a formal model. And please no bibliography, footnotes, or reading list — I want the arguments; sources I can chase myself later.

  The list, then: what an account of echo chambers / good-faith disagreement has to deliver, with the case or consideration behind each requirement. Here are the things I keep tripping over in interviews and reporting — use them, replace them, or tell me one of them is a bad demand:

  - The distinction I keep having to make between people who literally never encounter the other side's arguments (they just don't reach them) and people who encounter them constantly but have been supplied with a standing reason to distrust anyone who says them. Those feel like different failures with different fixes, but from the outside I cant always tell them apart, and I'm not sure a theory owes me a clean line here.
  - I trust my mechanic about my brakes and my doctor about my scan, and in a structural sense I'm in exactly the thing I'm supposed to be worried about: I take their word and can't check it. Any test for "echo chamber" that also condemns that is broken, I think — but I don't know how to state the exception without making it swallow the rule.
  - The difference between being wrong and sincere, being wrong and indifferent to whether you're wrong, and straight-up lying. I've read somewhere that indifference to truth is its own thing, distinct from lying and distinct from honest error, and it seems to me the accusation "bad faith" collapses all three. Does an adequate theory have to keep them apart?
  - An asymmetry problem: sometimes the out-group really is worse off epistemically. If the theory can never return that verdict it's useless to me; if it returns it too easily it's a weapon. Is that a contradiction or just a calibration problem?
  - A hypothetical I want it to handle. Suppose you take people on each side and show them the other side's actual arguments, verbatim and unlabelled, and they rate them as noticeably more reasonable than the labelled versions — yet nobody's views move at all. Assume that's what happens. Does an adequate account have to explain that gap, or is it social psych's problem and not the theory's?
  - A case I keep coming back to: a small band of researchers in some field, dismissed as cranks for twenty years, who turn out to have been right. Structurally that looks a lot like the groups I'm supposed to diagnose. Does the account owe me a way to separate the two, and if not, why not?
  - Scope: does one theory have to cover both "she is arguing in bad faith" (about a person) and "this is an echo chamber" (about an information environment), or is it fine to do one and punt the other? I suspect conflating them is where a lot of bad commentary comes from, but I'd rather you tell me.

  Also: mark which requirements are non-negotiable for my purposes and which are preferences of one camp — I suspect some people are smuggling in a requirement that the theory be even-handed between left and right, and I genuinely don't know if that's a real desideratum or a political taste. Flag any pair of requirements on your list that probably can't be satisfied together, because if the list turns out to be impossible, that's the story. And tell me which single requirement does the most work in ruling out the standard stories people recieve from pundits — "it's their media diet", "motivated reasoning", "they're signaling tribal loyalty, not stating beliefs".

  At the very end, three lines max on how those standard stories fare against your list. The list is the deliverable; I'll do the scoring in the piece.
reasoning: |-
  Okay, let me tackle this query. The user is a science columnist writing about polarization and bad-faith accusations. They need a diagnostic spec to evaluate real disputes without academic formalities. 

  First, I consider their pain points: distinguishing echo chambers from epistemic bubbles, handling necessary trust (like mechanics), differentiating types of wrongness (error vs indifference vs lying), addressing epistemic asymmetry without bias, explaining the argument-rating gap, and separating dismissed researchers from true cranks. They also want clarity on whether person-level and environment-level theories should be separate.

  The core challenge is balancing diagnostic precision with real-world messiness. For instance, the mechanic/doctor example shows that not all trust is problematic—so the spec must exclude institutional trust structures. The crank/researcher dilemma highlights that theories can't guarantee truth detection, only process evaluation.

  I'm noting tensions between requirements. For example, demanding asymmetry judgments (#4) while avoiding weaponization conflicts with the crank case (#6) where outsiders were right. The resolution is focusing on epistemic behaviors, not outcomes. 

  The argument-rating gap (#5) feels key—it exposes how identity contamination overrides content, which most pundit explanations miss. Tribal signaling theories partially address this but ignore the environmental factors that enable it.

  For structure, I'll prioritize non-negotiable demands: diagnostic practicality, distinguishing error types, and handling asymmetry. Person/environment scope separation is also essential to avoid conflation. The mechanic exception must be preserved without loopholes.

  Finally, I'll contrast standard theories against the spec. Motivated reasoning explains individual bias but ignores environmental factors. Media diet theories miss internalized distrust. Tribal signaling captures identity-driven arguments but oversimplifies sincerity.
answer: |-
  Here’s your diagnostic spec for evaluating "bad faith" accusations in polarized disputes. The requirements are ranked by non-negotiability for your purpose (★ = essential; ⚖️ = preference/contextual). Conflicting demands are flagged.

  ---

  ### **The Spec: What a Theory Must Deliver**
  1. **★ Distinguish epistemic environments**  
     *Must separate:*
     - **Epistemic bubbles** (arguments *literally don’t reach you* due to network structure)  
     - **Echo chambers** (arguments *are heard but preemptively discredited* via identity-based distrust)  
     *Why essential:* Fixes differ. Bubbles need exposure; echo chambers need trust repair. A theory must identify which dynamic is active in a given dispute using behavioral clues (e.g., "Have they seen this data?" vs. "Why dismiss this source outright?").

  2. **★ Exempt institutional trust from "echo chamber"**  
     *Must protect:* Trust in mechanics/doctors based on *verifiable institutional safeguards* (licensing, peer review, liability).  
     *Why essential:* Condemning this collapses the concept. The exception: Trust must derive from systems with **accountability mechanisms**, not just authority. If your mechanic says "trust me, brakes are fine" but refuses inspections, it fails.

  3. **★ Parse three types of "wrongness"**  
     Must distinguish:  
     - **Sincere error** (trying to be right, got it wrong)  
     - **Indifference to truth** (prioritizing goals over accuracy)  
     - **Intentional deception** (lying)  
     *Why essential:* "Bad faith" accusations often conflate these. A theory must identify behavioral markers (e.g., *evasion of counter-evidence* suggests indifference; *internal inconsistency* suggests deception).

  4. **★ Handle asymmetric epistemic deficits**  
     Must allow judgments that one group is *objectively worse-informed* without defaulting to "both sides" evenhandedness.  
     *Why essential:* Reality isn’t symmetrical (e.g., flat-earthers vs. geophysicists). Criteria: Does the group **reject cross-cutting evidence** *and* **lack internal corrective mechanisms**? If so, asymmetry is diagnosable. Calibration guardrail: Never judge based on *content* of belief, only on *process*.

  5. **⚖️ Explain the "argument-rating gap"**  
     *Should* account for why unlabeled arguments are rated higher than labeled ones yet fail to change minds.  
     *Why negotiable:* While a strong theory *should* explain this (e.g., "beliefs are identity-locked; reasonableness is detached from belief-updating"), it’s acceptable to note this as a downstream effect of other failures.

  6. **★ Demarcate cranks vs. dismissed innovators**  
     *Must* distinguish them using **process, not outcome**.  
     Criteria:  
     - Do they engage critics? (Cranks avoid/dismiss; innovators steelman)  
     - Do they update with new evidence? (Cranks move goalposts; innovators refine)  
     - Is their work *internally* scrutinized? (Cranks lack self-correction)  
     *Why essential:* Structural similarity demands process-based separation. Truth isn’t knowable in real-time, but epistemic hygiene is.

  7. **★ Separate individual vs. environmental diagnoses**  
     *Must* treat "bad faith" (individual intent) and "echo chamber" (environment) as distinct but interacting.  
     *Why essential:* Conflating them excuses toxic environments ("It’s not Sarah’s fault—she’s in a bubble") or pathologizes dissent ("They’re all liars"). A theory must assess:  
     - *Environment:* Does it filter/taint information? (See #1)  
     - *Individual:* Do they exploit the environment to avoid accountability? (See #3)  

  ---

  ### **Conflicts & Tensions**
  - **#4 (asymmetry) vs. #6 (cranks/innovators):** Judging asymmetry *requires* assessing epistemic health, which risks hindsight bias (#6). **Resolution:** Focus on *contemporaneous process* (e.g., "Did dismissed researchers follow norms of scrutiny?" not "Were they later vindicated?").  
  - **#2 (trust exemption) vs. echo chambers:** Trust in experts *can* become echo-chamber behavior if institutional safeguards decay. **Resolution:** The exemption *only* applies when accountability mechanisms are functional and accessible.  

  ---

  ### **Non-Negotiables vs. Preferences**
  - **★ Essentials:** #1, #2, #3, #4, #6, #7 (diagnostic precision, process focus, asymmetry handling)  
  - **⚖️ Preferences:** #5 (explaining the gap) — useful but not core to your diagnostic.  
  - **Desideratum Note:** "Evenhandedness between left/right" is a *political preference*, not a theoretical requirement. The spec demands *empirical asymmetry* judgments (#4) regardless of ideology.  

  ---

  ### **How Standard Stories Fare Against the Spec**  
  - **"Media diet" theories:** Fail #1 (don’t distinguish bubbles/chambers) and #7 (blame environment, ignore agency).  
  - **"Motivated reasoning":** Partial pass on #3 (explains indifference) but fails #4 (can’t judge asymmetry) and #6 (ignores process).  
  - **"Tribal signaling":** Passes #3 (indifference) but fails #1 (no environment analysis) and #7 (reduces individuals to tribe).  

  ---

  **Your deliverable:** A theory that clears this spec must be **process-oriented, environmentally aware, and asymmetric-proof** — enabling you to dissect disputes without playing referee to truth claims. Now go hunt your sources.
