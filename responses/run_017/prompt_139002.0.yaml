answer: |-
  ## Patient N, Reporting

  The spot between my ribs burns at an eight.
  It presses like a brand against the bone.
  A focused heat without a trace of hurt.
  The doctor nods and writes it on his sheet.

  It presses like a brand against the bone.
  He points to columns: *Stabbing? Aching? Dull?*
  The doctor nods and writes it on his sheet.
  I feel the pressure build – please take your hand away.

  He points to columns: *Stabbing? Aching? Dull?*
  "No, not unpleasant." Just the steady burn.
  I feel the pressure build – please take your hand away.
  My shoulder jerks. The clipboard rustles near.

  "No, not unpleasant." Just the steady burn.
  I see the pen circle *Burning. Sharp. Intense.*
  My shoulder jerks. The clipboard rustles near.
  This isn't bad. I'd like the pill now, please.

  I see the pen circle *Burning. Sharp. Intense.*
  A focused heat without a trace of hurt.
  This isn't bad. I'd like the pill now, please.
  **The spot between my ribs burns at an eight.**

  ---

  **Why I built it that way**

  I anchored the repeating lines to core sensory data: location ("spot between my ribs"), intensity ("burns at an eight"), quality ("presses like a brand", "focused heat"). These loop unchanged, mirroring N's fixed sensory report. The changing lines track the dynamic *response* – the doctor's actions, N’s polite imperative ("please take your hand away", "I'd like the pill now"), and the explicit denial of unpleasantness ("without a trace of hurt", "No, not unpleasant").

  The scene is concrete: the exam room, the doctor pressing, the adjective checklist. N's voice is flatly factual, avoiding pathos. The "wanting it to stop" manifests as direct, practical requests, not anguish. The final stanza juxtaposes "I'd like the pill now, please" directly against "A focused heat without a trace of hurt" and loops back to the pure sensory report, leaving the core tension – *why stop what isn't bad?* – unresolved but vividly present. The structure forces the sensory core to persist, unchanged, while the context of aversion builds around it, embodying the separation without explaining it. Left out: any hint of reflex or diminished humanity; N's actions are presented as deliberate choices. The poem leans only by showing the dissociation, not by arguing for a specific theory.
