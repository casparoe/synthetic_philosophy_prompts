  Another try:  

  | Group    | Drug A Success/Total | Drug B Success/Total |
  |----------|----------------------|----------------------|
  | Young    | 100/200 (50%)       | 50/50 (100%)        |
  | Old      | 50/50 (100%)        | 100/200 (50%)       |
  | **Total**| 150/250 (60%)       | 150/250 (60%)       |

