  - Second half: A (.400) > B (.200) → A better  
  Not unanimous in subgroups.  

  For unanimous, use the kidney stone structure with a new context.  

  **Propose: Job placement rates by gender and university department.**  

  Two departments: Engineering and Liberal Arts.  
  - Engineering:  
    - Men: applied 500, placed 400 (80%)  
