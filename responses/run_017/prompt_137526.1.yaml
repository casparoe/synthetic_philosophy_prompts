  We are designing a 75-minute session on Simpson's paradox for a mixed-numeracy newsroom audience. The goal is to focus on understanding the paradox, its implications for reporting, and how to handle it in practice.

  Key elements from the query:
  - Avoid the two standard examples (university admissions, kidney stones).
  - The dependency structure: what must be taught in what order?
  - A single, new case study to build the session around, with specific constraints.
  - Addressing misconceptions at the right time.
  - Decisions on three optional topics.
  - A framing statement to test.
  - A practical exercise (writing a lede) and a checklist for reading studies.

  Let's break down the plan step by step.

  ---

  ### 1. Dependency Structure and Order of Topics

  The paradox is surprising because it shows that a relationship observed in aggregated data reverses when the data are broken down by a confounding variable. The order of concepts must build this surprise and then resolve it.

  **Proposed Order and Why:**

  1. **Start with a simple, intuitive comparison that readers would act on (aggregate level).**  
     - Why: To set up the "obvious" conclusion that will later be reversed. The reporters must see and accept the initial aggregate result as meaningful. Without this, the reversal won't register as surprising.

  2. **Disaggregate the data to reveal the reversal.**  
     - Why: This is the moment of surprise. The audience must see that the direction of the effect flips when we look at subgroups. This step makes the paradox concrete.

  3. **Analyze the arithmetic: Why did the reversal happen?**  
     - Why: After seeing the reversal, the natural question is "how is this possible?" This is when we show the mechanism (unequal group sizes and the imbalance in the confounding variable). Doing this *after* the reveal maintains engagement and curiosity. If we do the arithmetic first, it might feel abstract and the reveal won't land as strongly.

  4. **Interpret the meaning: Which summary is "correct"?**  
     - Why: Now that they see the mechanics, we confront the key point: the numbers alone don't tell us which summary to use. This leads into the discussion of context, causality, and the role of the grouping variable.

  **Why not the opposite?**  
  If we start with the arithmetic (e.g., explaining how unequal group sizes can cause a reversal), it might feel like a math trick. The surprise of the reversal is what makes the lesson memorable. Also, without the reversal as a motivator, the hostile or less numerate might disengage.

  **Conclusion:**  
  Order:  
  1. Present aggregate comparison → 2. Disaggregate to show reversal → 3. Explain arithmetic → 4. Discuss interpretation.

  ---

  ### 2. The Case Study

  **Requirements:**  
  - Not the two standard examples.  
  - Numbers a reader would act on (e.g., health, finance, policy).  
  - A detail that can be changed mid-session without altering the numbers, flipping the "correct" conclusion.  
  - Should allow for unequal group sizes to be the driving force.  
  - Avoids small samples, rounding artifacts.  

  **Proposed Case: COVID-19 Vaccination Effectiveness by Country**  

  **Scenario:**  
  We have data on COVID-19 infection rates for two vaccines (Vaccine A and Vaccine B) in two countries: Country X and Country Y. The aggregate data (ignoring countries) shows Vaccine A has a lower infection rate. But when we break down by country, Vaccine B has a lower infection rate in each country.  

  **Data (hypothetical):**  

  | Group       | Vaccine A | Vaccine B |
  |-------------|-----------|-----------|
  | Country X   | 100/1000 (10%) | 50/100 (50%) |
  | Country Y   | 900/1000 (90%) | 10/100 (10%) |
  | **Aggregate** | 1000/2000 (50%) | 60/200 (30%) |

  **Aggregate story:**  
  Vaccine B has a 30% infection rate vs. 50% for Vaccine A → Vaccine B appears better.  

  **Disaggregated story:**  
  - In Country X: Vaccine A (10%) < Vaccine B (50%) → A better.  
  - In Country Y: Vaccine A (90%) > Vaccine B (10%) → B better.  
  But note: The reversal is that in the aggregate, B is better, but in each subgroup, A is better? Wait, this is not the classic reversal. Let me fix.

  **Classic Simpson's reversal:**  
  We want aggregate to show one direction and subgroups the opposite.  

  Redesign:  

  | Group       | Vaccine A Infections/Total | Vaccine B Infections/Total |
  |-------------|----------------------------|----------------------------|
  | Country X   | 100/1000 (10%)             | 500/1000 (50%)             |
  | Country Y   | 900/1000 (90%)             | 100/1000 (10%)             |
  | **Aggregate** | 1000/2000 (50%)            | 600/2000 (30%)             |

  Now:  
  - Aggregate: Vaccine A infection rate = 50%, Vaccine B = 30% → B is better (lower infection).  
  - By country:  
    - Country X: A (10%) vs B (50%) → A better.  
    - Country Y: A (90%) vs B (10%) → B better? Wait, in Country Y, B is better, but in Country X, A is better. But the paradox requires that in each subgroup, the direction is the same and opposite to aggregate. So we need both subgroups to show A better, but aggregate shows B better? Or vice versa.

  Let me set it so that in each subgroup, Vaccine A has a higher infection rate, but overall Vaccine A has a lower rate? That's not typical. The classic is: overall, A looks better, but in each subgroup, B is better. Or vice versa.

  Adjust to:  

  | Group       | Vaccine A | Vaccine B |
  |-------------|-----------|-----------|
  | Country X   | 100/1000 (10%) | 200/400 (50%) |
  | Country Y   | 900/1000 (90%) | 100/200 (50%) |
  | **Aggregate** | 1000/2000 (50%) | 300/600 (50%) |

  Wait, same aggregate rate. Let me make the reversal clear.

  **Correct Setup for Reversal:**  

  Suppose:  
  - In Country X: Vaccine A: 100 infections out of 1000 (10%), Vaccine B: 50 infections out of 200 (25%) → A better (10% < 25%).  
  - In Country Y: Vaccine A: 500 infections out of 1000 (50%), Vaccine B: 10 infections out of 800 (1.25%) → A worse (50% > 1.25%).  

  But in each subgroup, A is not uniformly better? We need both subgroups to show B is better?  

  **Standard reversal setup:**  
  We want:  
  - Aggregate: A has lower infection rate than B.  
  - But in each subgroup (country), B has lower infection rate than A.  

  So:  

  | Group       | Vaccine A Infections/Total | Vaccine B Infections/Total |
  |-------------|----------------------------|----------------------------|
  | Country X   | 100/1000 (10%)             | 50/200 (25%) → A better (10% < 25%)? No, we want B better in subgroup?  

  Wait, let me define "better" as lower infection rate.  

  We want for each country:  
  - Country X: B infection rate < A infection rate.  
  - Country Y: B infection rate < A infection rate.  
  But aggregate: A infection rate < B infection rate.  

  So:  

  | Group       | Vaccine A | Vaccine B |
  |-------------|-----------|-----------|
  | Country X   | 200/1000 (20%) | 50/200 (25%) → Wait, 20% < 25%, so A better? Not what we want.  

  Flip the rates:  

  | Group       | Vaccine A | Vaccine B |
  |-------------|-----------|-----------|
  | Country X   | 200/1000 (20%) | 30/100 (30%) → A better (20% < 30%)?  
  But we want B better in subgroups?  

  Let me set:  
  - Country X: A has 30% infection, B has 20% → B better.  
  - Country Y: A has 50% infection, B has 30% → B better.  
  But then aggregate must show A better? How?  

  If Country X has high weight for A and low for B, and Country Y vice versa.  

  Example:  
  - Country X:  
    - Vaccine A: 900 people, 30% infected → 270 infected  
    - Vaccine B: 100 people, 20% infected → 20 infected  
  - Country Y:  
    - Vaccine A: 100 people, 50% infected → 50 infected  
    - Vaccine B: 900 people, 30% infected → 270 infected  

  Now:  
  - By country:  
    - Country X: A: 30% > B: 20% → B better  
    - Country Y: A: 50% > B: 30% → B better  
  - Aggregate:  
    - A: total infected = 270+50=320, total people=900+100=1000 → 32%  
    - B: total infected=20+270=290, total people=100+900=1000 → 29%  
    → Aggregate: A (32%) > B (29%) → B better? Wait, 32% is worse than 29%, so B is better in aggregate too? Not a reversal.  

  I see the issue: we need the aggregate to show A better, meaning A has lower infection rate.  

  So set:  
  - We want aggregate infection rate of A < infection rate of B.  
  - But in each country, infection rate of A > infection rate of B.  

  So:  
  - Country X: A has high rate, but more people take A?  
  - Country Y: A has high rate, but few take A?  

  Example:  
  - Country X (high population, high infection rates):  
    - Vaccine A: 1000 people, 90% infected → 900 infected  
    - Vaccine B: 100 people, 10% infected → 10 infected  
      → A:90% > B:10% → B better in Country X.  
  - Country Y (low population, lower infection rates):  
    - Vaccine A: 100 people, 50% infected → 50 infected  
    - Vaccine B: 1000 people, 10% infected → 100 infected  
      → A:50% > B:10% → B better in Country Y.  
  - Aggregate:  
    - A: infected=900+50=950, total=1000+100=1100 → 86.36%  
    - B: infected=10+100=110, total=100+1000=1100 → 10%  
    → Aggregate: A (86.36%) > B (10%) → B better. No reversal.  

  To get reversal, we need the group sizes to be very different and the rates to vary.  

  **Classic Example Structure:**  
  Suppose:  
  - Group 1: A has 5/10 (50%), B has 1/2 (50%) → same rate.  
  - Group 2: A has 3/10 (30%), B has 9/18 (50%) → A better.  
  But we need the reversal.  

  Let me use a known alternative: **Baseball batting averages**.  

  Two players:  
  - Player A:  
    - First half: 40 hits in 100 at-bats → .400  
    - Second half: 10 hits in 10 at-bats → 1.000  
    - Total: 50/110 ≈ .455  
  - Player B:  
    - First half: 60 hits in 200 at-bats → .300  
    - Second half: 3 hits in 10 at-bats → .300  
    - Total: 63/210 = .300  

  Now:  
  - First half: A (.400) > B (.300)  
  - Second half: A (1.000) > B (.300)  
  - Overall: A (.455) > B (.300) → no reversal.  

  For reversal:  
  Player A:  
  - First half: 1 hit in 10 at-bats → .100  
  - Second half: 40 hits in 100 at-bats → .400  
  - Total: 41/110 ≈ .373  

  Player B:  
  - First half: 50 hits in 100 at-bats → .500  
  - Second half: 1 hit in 10 at-bats → .100  
  - Total: 51/110 ≈ .464  

  Now:  
  - First half: A (.100) < B (.500) → B better  
  - Second half: A (.400) > B (.100) → A better  
  Not unanimous in subgroups.  

  We need both halves to show one player better, but overall the other.  

  Player A:  
  - First half: 10/50 (.200)  
  - Second half: 30/50 (.600)  
  - Total: 40/100 (.400)  

  Player B:  
  - First half: 15/20 (.750)  
  - Second half: 75/100 (.750)  
  - Total: 90/120 (.750)  

  Now:  
  - First half: A (.200) < B (.750) → B better  
  - Second half: A (.600) < B (.750) → B better  
  - Overall: A (.400) < B (.750) → B better. No reversal.  

  **Correct Reversal Example (from known sources):**  
  Two treatments for kidney stones:  
  - Treatment A: Group 1 (small stones): 81/87 (93% success)  
    Group 2 (large stones): 192/263 (73% success)  
    Overall: 273/350 (78%)  
  - Treatment B: Group 1 (small stones): 234/270 (87% success)  
    Group 2 (large stones): 55/80 (69% success)  
    Overall: 289/350 (83%)  

  Now:  
  - In small stones: A (93%) > B (87%)  
  - In large stones: A (73%) > B (69%)  
  - Overall: A (78%) < B (83%) → reversal!  

  But we cannot use kidney stones.  

  **Propose a new example: Drug effectiveness for two age groups.**  

  **Scenario:**  
  Two weight loss drugs, Drug A and Drug B. We have data from two age groups: under 50 and 50+.  

  - **Under 50:**  
    - Drug A: 80 out of 100 lost weight (80% success)  
    - Drug B: 20 out of 25 lost weight (80% success) → same rate, but let's make it different.  

  We need a reversal.  

  Set:  
  - **Under 50:**  
    - Drug A: 95/100 = 95% success  
    - Drug B: 190/200 = 95% success → same, no difference.  

  Not good.  

  Set:  
  - **Under 50:**  
    - Drug A: 90/100 = 90%  
    - Drug B: 30/40 = 75% → so A is better  
  - **50+:**  
    - Drug A: 10/20 = 50%  
    - Drug B: 60/100 = 60% → so B is better  
  But not unanimous.  

  For unanimous subgroups:  

  - **Under 50:**  
    - Drug A: 90/100 = 90%  
    - Drug B: 45/50 = 90% → same?  

  Desired: In each subgroup, Drug B has higher success rate, but overall Drug A has higher success rate.  

  How:  
  - Under 50:  
    - Drug A: 200/400 = 50%  
    - Drug B: 10/20 = 50% → same  
