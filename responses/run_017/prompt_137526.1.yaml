  **Successful Example:**  
  From [https://en.wikipedia.org/wiki/Simpson%27s_paradox#Example](https://en.wikipedia.org/wiki/Simpson%27s_paradox#Example):  
  - Batting averages:  
    - Player A: first half: .250 (30/120), second half: .400 (20/50), overall: .288 (50/170)  
