  **Use the vaccination example with corrected numbers:**  

  Let's create a reversal:  

  | Country | Vaccine | Infected | Total | Infection Rate |
  |---------|---------|----------|-------|----------------|
  | X       | A       | 100      | 1000  | 10%            |
  | X       | B       | 50       | 50    | 100%?          |

  This is hard.  

  **Accepted new example: Income by gender and job type.**  

  - High-paying jobs (e.g., tech):  
    - Men: $120,000 average, 1000 men  
    - Women: $130,000 average, 100 women  
  - Low-paying jobs (e.g., service):  
    - Men: $50,000 average, 100 men  
    - Women: $60,000 average, 1000 women  

  Overall:  
  - Men: (120000*1000 + 50000*100)/1100 = (120,000,000 + 5,000,000)/1100 = 125,000,000/1100 ≈ $113,636  
  - Women: (130000*100 + 60000*1000)/1100 = (13,000,000 + 60,000,000)/1100 = 73,000,000/1100 ≈ $66,364  

  Overall, men earn more.  

  But in each job type:  
  - High-paying: women earn more ($130,000 > $120,000)  
  - Low-paying: women earn more ($60,000 > $50,000)  

  Reversal: overall, men earn more, but in each job type, women earn more.  

  This works.  

  **Why it meets the requirements:**  
  - Readers would act on income data (e.g., for policy, personal decisions).  
  - We can change a detail: the proportion of men and women in each job type without changing the cell averages. For example, if we make the number of women in high-paying jobs much larger and men in low-paying jobs much larger, the reversal might disappear or flip. But the cell averages stay the same.  

  **The Detail to Change Mid-Session:**  
  Initially, we have:  
  - High-paying: mostly men (1000 men, 100 women)  
  - Low-paying: mostly women (100 men, 1000 women)  

  Now, change the job distribution:  
  - High-paying: 1000 women and 100 men  
  - Low-paying: 1000 men and 100 women  

  Now recalculate overall:  
  - Men: (120000*100 [high] + 50000*1000 [low])/1100 = (12,000,000 + 50,000,000)/1100 = 62,000,000/1100 ≈ $56,363.64  
  - Women: (130000*1000 [high] + 60000*100 [low])/1100 = (130,000,000 + 6,000,000)/1100 = 136,000,000/1100 ≈ $123,636.36  

  Now women earn more overall, and in each job type, women still earn more.  
  So the reversal is gone: now both overall and within groups, women earn more.  

  But we want a reversal, so let's set the initial to show reversal and after change, the reversal flips or disappears?  

  In the initial setup, we have:  
  - Within groups: women earn more in both.  
  - Overall: men earn more.  

  After changing the group sizes:  
  - Within groups: women still earn more in both.  
  - Overall: women earn more.  

  So the paradox (reversal) disappears.  

  Alternatively, we can set up a different initial condition where there is no paradox and after change, it appears. But we want to start with the paradox.  

  **Better: Use the same numbers but change the interpretation by revealing that the job type is not pre-treatment.**  

  But the requirement is to change a detail while leaving every cell identical. The cell averages are identical, only the group sizes change.  

  In this example, the group sizes are part of the data. We can present the same cell averages but with different group sizes and see how the aggregate changes.  

  **Proposal for the Case Study:**  
  **Title: The Gender Pay Gap at XYZ Corporation**  

  **Initial Data (Year 2023):**  

  | Job Category | Gender | Avg. Salary | Number of Employees |
  |--------------|--------|-------------|---------------------|
  | Tech         | Men    | $120,000   | 1000                |
  | Tech         | Women  | $130,000   | 100                 |
  | Service      | Men    | $50,000    | 100                 |
  | Service      | Women  | $60,000    | 1000                |

  **Aggregate:**  
  - Men: (1000*120000 + 100*50000)/1100 = (120,000,000 + 5,000,000)/1100 = $113,636  
  - Women: (100*130000 + 1000*60000)/1100 = (13,000,000 + 60,000,000)/1100 = $66,364  
  → Overall, men earn more.  

  **By job category:**  
  - Tech: Women earn $130,000 > Men $120,000  
  - Service: Women earn $60,000 > Men $50,000  

  → In each job category, women earn more.  

  **The reversal:** The aggregate suggests a gender pay gap favoring men, but within each job type, women earn more.  

  **Now, change the detail: Year 2024, the company hires more women in tech and more men in service, but the average salaries in each cell remain the same.**  

  | Job Category | Gender | Avg. Salary | Number of Employees |
  |--------------|--------|-------------|---------------------|
  | Tech         | Men    | $120,000   | 100                 |
  | Tech         | Women  | $130,000   | 1000                |
  | Service      | Men    | $50,000    | 1000                |
  | Service      | Women  | $60,000    | 100                 |

  **Aggregate:**  
  - Men: (100*120000 + 1000*50000)/1100 = (12,000,000 + 50,000,000)/1100 = $56,363.64  
  - Women: (1000*130000 + 100*60000)/1100 = (130,000,000 + 6,000,000)/1100 = $123,636.36  
  → Overall, women earn more.  

  **By job category:**  
  - Tech: Women $130,000 > Men $120,000  
  - Service: Women $60,000 > Men $50,000  

  Now, the reversal is gone: both overall and within groups, women earn more.  

  **What happened?** The change in group sizes (number of employees in each job-gender group) changed the aggregate, but the within-group comparisons are unchanged. The paradox existed in 2023 because men were overrepresented in the high-paying job and women in the low-paying job, but within each job, women were paid more. In 2024, with the representation flipped, the aggregate flips.  

  **Why it works for the session:**  
  - The numbers are realistic and actionable (pay equity).  
  - The change in group sizes (which can be presented as a policy change) flips the aggregate while keeping cell averages the same.  
  - It highlights the role of the grouping variable (job category) and its distribution.  

  **Should they construct the reversal themselves?**  
  Yes, but in a guided way to save time.  

  **Activity:**  
  - Give them the aggregate data for 2023: men earn $113,636, women $66,364 → ask: "Is there a gender pay gap at XYZ?"  
  - Then give them the job category breakdown (without numbers of employees, only averages) and ask: "Within each job category, who earns more?"  
  - They see the contradiction.  
  - Then reveal the number of employees and have them calculate the aggregate to see how it happened.  
  - Then change the number of employees to the 2024 scenario and have them calculate the new aggregate.  

  Time permitting, this could be a 10-minute group exercise.  

  **Time Check:** This might take 20-25 minutes. Given 75 minutes, it's feasible.  

  ---

  ### 3. Misconceptions and When to Address Them

  List of misconceptions:  
  1. **The aggregate is a lie and the disaggregated numbers are the truth.**  
     - When: During the interpretation step (after the case study arithmetic).  
     - Why: The case study shows that both summaries are mathematically correct. The issue is which one is relevant.  
     - Damage if too early: Before seeing the case, they might not appreciate that both are valid.  
     - Damage if too late: They might leave with this misconception.  

  2. **This is a small-sample or rounding artefact that more data would dissolve.**  
     - When: During the arithmetic explanation (after the reversal is shown).  
     - Why: In the case study, the numbers are large and the effect is clear. Emphasize that it's a structural issue, not a data quality issue.  
     - Damage if too late: They might dismiss the paradox as an artifact.  

  3. **That it is the same thing as the ecological fallacy or as ordinary confounding.**  
     - When: In the last 10 minutes, when discussing broader context.  
     - Why: Simpson's paradox is a specific form of confounding, but the ecological fallacy is about inferring individual-level relationships from aggregate data. They are related but not identical.  
     - Damage if too early: Might confuse the audience.  

  4. **That if the subgroup verdicts are unanimous one should plainly act on them.**  
     - When: During the interpretation step.  
     - Why: In the case study, the subgroups are unanimous (women earn more in each job type), but the aggregate shows men earn more. The question is: should we focus on the subgroups? It depends on whether job type is a confounder or a mediator.  
     - Damage if not addressed: They might think disaggregation always wins.  

  5. **The journalist's temptation: print both and let the reader decide.**  
     - When: In the last 10 minutes, when discussing reporting implications.  
     - Why: This avoids making a choice, but the reader might be misled by one summary. We need to guide the reader based on context.  
     - Damage if not addressed: They might default to this in practice.  

  **Additional Misconceptions:**  
  6. **Simpson's paradox is rare and only happens in contrived situations.**  
     - When: During the introduction or after the case study.  
     - Why: It's more common than thought, especially in observational data.  
     - Damage: They might ignore it.  

  7. **You can always avoid the paradox by using the disaggregated data.**  
     - When: During interpretation.  
     - Why: Sometimes the grouping variable is not available or there are many subgroups. Also, disaggregation might not be the right choice if the grouping variable is affected by the treatment.  

  **Order in Session:**  
  - During the case study reveal: Address #2 (not an artifact) and #6 (not rare).  
  - During the arithmetic explanation: Address #1 (both summaries are mathematically correct).  
  - During interpretation: Address #4 (unanimous subgroups) and #7 (not always disaggregate).  
  - In the last 10 minutes (reporting implications): Address #5 (print both) and #3 (relation to confounding/ecological fallacy).  

  ---

  ### 4. Three Optional Topics: Verdicts

  1. **Distinction between a grouping variable measured before the exposure and one produced by it (e.g., confounder vs. mediator).**  
     - **Verdict: Include, but briefly and at the end.**  
     - Why: This is crucial for choosing which partition to hold fixed. If job type is influenced by gender (e.g., discrimination in hiring), then conditioning on job type might hide the discrimination. But if job type is pre-existing, then it might be a confounder.  
     - Risk: Might lose the hostile third.  
     - How: Use the pay gap example: If job assignment is based on gender (a confounder), then the aggregate might reflect discrimination. But if we condition on job type, we might be hiding that discrimination. So the disaggregated numbers might not tell the whole story.  
     - Place: In the interpretation section, as the "deepest point". Keep it to 5 minutes.  

  2. **That you can keep subdividing and get a reversal back at a finer grain.**  
     - **Verdict: Mention, but with caution.**  
     - Why: It's true that further partitioning can reverse again, but it's not always possible and can be misused.  
     - Risk: Giving a license for bad faith arguments.  
     - How: State that while mathematically possible, the choice of partitioning must be justified by subject-matter knowledge. And in practice, we stop at a sensible level (e.g., pre-treatment variables).  
     - Place: In the last 10 minutes, when discussing pitfalls.  

  3. **Whether the choice of summary matters (e.g., can a reversal appear for risk ratios but not risk differences?).**  
     - **Verdict: Leave out.**  
     - Why: Too subtle for a 75-minute session with mixed numeracy. It might confuse more than help.  
     - Alternative: Stick to simple rates (percentages, averages) as in the case study.  

  ---

  ### 5. Framing Statement Test

  Your framing:  
  > "This is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and that the arithmetic cannot answer it."

  **Test Against the Session:**  
  - The case study shows the numbers are real and the arithmetic is correct. The reversal happens because of the partition.  
  - The session builds to the point that the choice of partition depends on causal structure and context, not math.  

  **Where it might mislead a reporter:**  
  - "Entitled to hold fixed" might sound legalistic. A reporter might think they are not "entitled" to any partition.  
  - Rephrase for clarity:  
    > "Simpson's paradox shows that the same data can tell two different stories depending on how we group it. The math doesn't tell us which grouping is fair; that depends on what we're trying to measure and what we know about the world."  

  **Revised Framing:**  
  > "Simpson's paradox is not a mathematical trick; it's a reminder that the way we slice the data can change the story. The numbers are correct in both views, but which view you should trust depends on context that the numbers alone can't provide."

  ---

  ### 6. Practical Exercise: The Lede

  **Exercise:** Hand out a paragraph from a press release about a comparison (e.g., "Company X reports that employees using their new wellness program take 20% fewer sick days overall. However, when broken down by department, employees in the program take more sick days in every department.").  

  **Task:** Write a one-sentence lede.  

  **Correct Lede:**  
  Must contain:  
  - The conflict (the overall vs. subgroup results).  
  - The key reason (e.g., because of how the program was rolled out).  
  - Avoid stating a single verdict without context.  

  Example:  
  > "While Company X's wellness program is associated with fewer sick days overall, it is linked to more sick days in every department, a reversal attributed to the program's initial focus on departments with historically high absenteeism."

  **Tempting Wrong Lede:**  
  > "Company X's wellness program increases sick days in every department, despite an overall decrease."  
  → This implies the program is harmful, but the overall decrease might be the relevant one if the program was targeted.  

  **What a Wrong Lede Reveals:**  
  - If they ignore the reversal and report only the aggregate, they missed the paradox.  
  - If they report only the subgroup results, they might have fallen for "disaggregated is always true".  
  - If they don't mention the reason (e.g., targeting), they haven't grasped the importance of context.  

  **Checklist for Reading Studies:**  
  Four questions to put on a card:  
  1. **Disaggregation:** Has the study considered relevant subgroups? If not, ask for breakdowns by key factors (e.g., age, gender, severity).  
  2. **Group Sizes:** Are the groups being compared of similar sizes and compositions? If not, Simpson's paradox might lurk.  
  3. **Causal Pathway:** Is the grouping variable a pre-existing characteristic or something that might be affected by the treatment? (e.g., job type in the pay gap example).  
  4. **Consistency:** If there's a conflict between aggregate and subgroup results, what explains it? (Look for imbalance in group sizes and rates.)  

  ---

  ### 7. Risks, Cuts, and Sequencing Adjustments

  **Part Most Likely to Fail:**  
  - The self-construction activity (trying to build the reversal) might take too long or frustrate the less numerate.  
    - Mitigation: Make it guided. Provide a template and have them fill in numbers. Or do it as a class with volunteers.  

  **If Short on Time, Cut:**  
  - The activity where they build the reversal. Instead, present the case study fully formed.  
  - Or, cut the detailed discussion of the three optional topics (especially #1).  

  **Sequence Differently If:**  
  - If the audience is more hostile, start with a simpler aggregate story (without the paradox) to build confidence, then introduce the reversal.  
  - If time is tight, merge the arithmetic and interpretation steps.  

  ---

  ### Session Outline (75 Minutes)

  1. **Introduction (5 mins):**  
     - Framing: Data can tell conflicting stories.  
     - Today: Simpson's paradox, a common pitfall.  

  2. **Case Study Part 1: Aggregate (10 mins):**  
     - Present 2023 pay gap aggregate: men earn more.  
     - Lede exercise? Not yet.  
     - Ask: "What should the headline be?"  

  3. **Case Study Part 2: Disaggregation (10 mins):**  
     - Reveal job category breakdown: in each job, women earn more.  
     - Surprise: the aggregate and subgroup stories conflict.  

  4. **Arithmetic Explanation (15 mins):**  
     - Show the calculation with group sizes.  
     - Activity: Have them calculate the aggregate.  
     - Why it happens: imbalance in group sizes and rates.  
     - Address misconception #2 (not an artifact) and #6 (not rare).  

  5. **Change the Detail (5 mins):**  
     - Show 2024 group sizes. Have them calculate: women earn more overall.  
     - Emphasize: cell averages unchanged, aggregate flipped.  

  6. **Interpretation (15 mins):**  
     - Both summaries are mathematically correct.  
     - Which one to trust?  
       - If job type is a confounder (assigned before gender effects pay), then disaggregate.  
       - If job type is a mediator (gender affects job type which affects pay), then aggregate might show discrimination.  
     - Address misconceptions #1 (both true) and #4 (unanimous subgroups).  

  7. **Reporting Implications (10 mins):**  
     - Don't just print both; explain the why (e.g., "The overall gap is driven by men being overrepresented in high-paying jobs").  
     - Address misconception #5 (print both) and #3 (relation to confounding).  
     - Checklist introduction.  

  8. **Exercise (5 mins):**  
     - Hand out press release paragraph.  
     - Write a lede.  
     - Share and discuss.  

  9. **Q&A (5 mins).**  

  --- 

  **Handout:**  
  - Case study data (2023 and 2024).  
  - Arithmetic steps.  
  - Checklist.  
  - Press release for exercise.  

  This plan balances engagement, depth, and practicality for a newsroom.
answer: |-
  ### Session Plan: Simpson's Paradox for Newsroom  
  *75 minutes, mixed numeracy, hands-on, one core case study*

  ---

  #### **1. Dependency Structure: Order of Concepts**  
  Your instinct is correct: **Reversal first, then arithmetic, then interpretation.** Here's the sequence and why:  
  1. **Present the aggregate comparison** (5 mins):  
     - *Why start here?* The aggregate must be accepted as "common sense" before the reversal surprises. Journalists encounter aggregate claims daily (e.g., "Vaccine A beats Vaccine B!"), so this mirrors real-world entry points. If you start with arithmetic, it feels abstract and hostile attendees disengage.  

  2. **Reveal the reversal via disaggregation** (10 mins):  
     - *Why next?* The shock of the flip ("But in every subgroup, the opposite is true!") creates cognitive dissonance. This primes curiosity: "How can both be true?" Without this surprise, the arithmetic feels like a math trick.  

  3. **Dissect the arithmetic** (15 mins):  
     - *Why now?* With the paradox visible, the group is motivated to resolve confusion. Show how unequal group sizes and base rates cause the reversal (e.g., "Group A dominates a high-risk category"). Skip formulas; use percentages and bar charts.  

  4. **Interpretation and meaning** (15 mins):  
     - *Why last?* The arithmetic alone doesn’t answer "Which summary is right?"—this requires context. By delaying interpretation, you avoid premature closure (e.g., "Disaggregated is always better").  

  **Collapse risk:**  
  - If interpretation comes before arithmetic, attendees default to gut reactions ("Always trust subgroups!").  
  - If arithmetic comes before reversal, the paradox lacks punch, and hostility spikes ("Why should I care about hypotheticals?").  

  ---

  #### **2. The Case Study: Gender Pay Gap in Tech vs. Service Jobs**  
  **Why this case?**  
  - **Actionable numbers:** Readers act on income data (e.g., policy debates, job choices).  
  - **Avoids chestnuts:** Fresh context (economics) resonates more than medical/academic examples.  
  - **Reversible by changing group sizes:** You can flip the "right" conclusion while keeping every cell identical.  
  - **Highlights unequal groups:** Group sizes (job distribution) drive the paradox, not small samples.  

  **Data:**  
  *Initial setup (Year 2023):*  
  | Job Type | Gender | Avg. Salary | Employees |  
  |----------|--------|-------------|-----------|  
  | Tech     | Men    | $120,000   | 900       |  
  | Tech     | Women  | $130,000   | 100       |  
  | Service  | Men    | $50,000    | 100       |  
  | Service  | Women  | $60,000    | 900       |  

  - **Aggregate story:** Men earn more overall ($113,000 vs. $66,000).  
  - **Disaggregated story:** Women earn more in both job types (Tech: $130K > $120K; Service: $60K > $50K).  

  **The reversal:** Aggregate favors men; subgroups favor women.  

  **Mid-session change (Year 2024):**  
  *Change group sizes only (salaries identical):*  
  - Tech: 100 men, 900 women  
  - Service: 900 men, 100 women  

  - **New aggregate:** Women earn more ($113,000 vs. $66,000).  
  - **Disaggregated unchanged:** Women still earn more in both jobs.  

  **Why this works:**  
  - The "right" conclusion flips (Year 2023: aggregate misleading; Year 2024: aggregate accurate).  
  - Reveals that group-size imbalance causes the paradox, not data quality.  
  - Readers "act" on this: Should we demand equal pay (disaggregated) or celebrate progress (aggregate)?  

  **Activity: Build a Reversal?**  
  **Do it—but as a guided group exercise (10 mins):**  
  - *Task:* "Split 200 employees into two groups (e.g., age, role) to create a reversal. All subgroups must have the same size."  
  - *Why:* Equal group sizes make reversals mathematically impossible. They’ll fail, discovering that **unequal groups are essential**.  
  - *Setup:* Provide base rates (e.g., "Vaccine A: 70% success in Group X, 30% in Group Y"). Let them try partitioning.  
  - *Avoid:* Solo work (time-consuming); focus on the "aha" that imbalance drives the paradox.  

  **Trap if unguided:** Less numerate attendees stall; the expert takes over. Mitigate by using small numbers (e.g., 100 people) and facilitating discussion.  

  ---

  #### **3. Misconceptions: When to Defuse Them**  
  Address these **during the case study reveal (step 2)** and **interpretation (step 4)**:  

  | Misconception | When to Address | Damage if Wrong Timing |  
  |---------------|----------------|------------------------|  
  | "The aggregate is a lie; subgroups are truth." | During interpretation (step 4) | If too early, they dismiss aggregate claims prematurely. If too late, they leave believing disaggregation is always right. |  
  | "This is a small-sample fluke." | During arithmetic (step 3) | Delay risks attendees writing off the paradox as irrelevant to "real" data. Show large, realistic numbers (e.g., 1,000+ employees). |  
  | "Same as ecological fallacy/confounding." | Last 10 mins (reporting implications) | Earlier causes confusion (ecological fallacy infers individuals from groups; Simpson’s is about conflicting summaries). |  
  | "Unanimous subgroups? Trust them!" | During interpretation (step 4) | Not defused here, they’ll ignore context (e.g., job type may be a mediator, not confounder). |  
  | "Print both summaries; let readers decide." | Last 10 mins (reporting) | If missed, journalists default to false neutrality. Explain why this obscures causality. |  
  | **Added: "You can always reverse by subdividing."** | During interpretation (step 4) | If unaddressed, they may misuse partitioning to manipulate conclusions. Emphasize it’s not always possible and requires justification. |  

  **Key:** Anchor defusing to the case study. For example:  
  - When revealing reversal, say: "Notice this isn’t about sample size—our data has 2,000 people."  
  - During interpretation: "Unanimous subgroups? In 2023, they suggested women earn more, but was that fair if men were steered into higher-paying jobs?"  

  ---

  #### **4. Verdicts on Optional Topics**  
  1. **Distinction: Pre-exposure vs. post-exposure grouping (e.g., confounder vs. mediator):**  
     - **Include—but briefly, in interpretation (step 4).**  
     - *Why:* This is the deepest point. In the pay gap case, job type could be:  
       - **Confounder** (pre-exposure: e.g., gender influences job choice) → Disaggregate to adjust for bias.  
       - **Mediator** (post-exposure: e.g., discrimination causes job segregation) → Aggregate shows systemic issue.  
     - *Mitigate hostility:* Use plain language ("Did the grouping exist before the thing we’re measuring?"). Skip jargon.  
     - *Risk:* Lose 10% of attendees, but it’s essential for ethical reporting.  

  2. **Can subdividing create endless reversals?**  
     - **Mention with heavy caveats, in last 10 mins.**  
     - *Why:* Mathematically possible, but rare in practice. Emphasize: "This isn’t a free pass to reverse any finding—it requires extreme imbalances and is often bad faith." Share one example (e.g., subdivide age groups in the pay gap).  
     - *Avoid:* Encouraging misuse. Stress journalists must ask: "Is this partitioning justified by the story?"  

  3. **Does choice of summary matter? (e.g., risk ratios vs. odds):**  
     - **Omit.**  
     - *Why:* Too technical. Simpson’s paradox typically appears across common summaries (e.g., percentages, means). Introducing subtlety dilutes core insight.  

  ---

  #### **5. Testing Your Framing**  
  Your framing:  
  > *"This is not a puzzle about numbers but a question about which partition you are entitled to hold fixed, and the arithmetic cannot answer it."*  

  **Where it misleads:**  
  - "Entitled" sounds legalistic. Journalists may think: "Who decides what I’m *entitled* to? My editor? The data?"  
  - **Repair:** Reframe as: *"Simpson’s paradox reveals that data alone can’t tell us which story to trust—context decides. Your job is to expose that context."*  
  - **Why better:** It shifts focus from "entitlement" to reporting rigor. The arithmetic *is* necessary (to verify the reversal), but insufficient for meaning.  

  ---

  #### **6. Practical Output: The Lede Exercise**  
  **Task:** Hand out a press release:  
  > *"Study: Workers at Company Z using FlexiTime report 20% higher productivity overall. However, in every department (sales, engineering, HR), FlexiTime users show 5% lower productivity."*  

  **Correct Lede Must Contain:**  
  - The conflict (aggregate vs. subgroups).  
  - The driver (e.g., "because FlexiTime was adopted by departments with historically high productivity").  
  - No verdict without context.  
  *Example:* "FlexiTime linked to lower productivity in all departments despite overall gains, as it rolls out first in high-performing teams."  

  **Tempting Wrong Lede:**  
  > "FlexiTime hurts productivity, study shows."  
  *Why:* Ignores aggregate, implies subgroup truth is absolute. Reveals misconception that "disaggregated = truth."  

  > "FlexiTime’s effects are contradictory."  
  *Why:* "Print both" cop-out. Misses the why (group-size imbalance).  

  **What It Tests:**  
  - If the lede ignores the reversal → Misconception #1 (subgroups are truth).  
  - If the lede omits the driver (e.g., department imbalance) → Misconception #5 (avoiding judgment).  

  **Checklist for Reading Studies (4 Questions):**  
  1. "Is there a breakdown by key groups (e.g., age, severity, location)?"  
  2. "Are the groups being compared similar in size and composition?"  
  3. "Could an omitted variable (e.g., pre-existing differences) explain the results?"  
  4. "What does the context say about *why* the aggregate and subgroups differ?"  

  ---

  #### **7. Risks, Cuts, and Adjustments**  
  **Most Likely to Fail:**  
  - The "build a reversal" activity. *Why:* Mixed numeracy may slow groups; the expert dominates.  
    - *Fix:* Run it as a 5-minute facilitator-led demo. Ask: "What happens if groups are equal? Try it."  

  **First Cut if Short on Time:**  
  - The "build a reversal" activity. Keep the case study reversal as a reveal.  

  **Sequence Differently If:**  
  - **Audience is fatigued:** Start with the press release exercise to hook them.  
  - **Hostility flares:** Skip self-construction entirely; use the pay gap case as a completed story.  
  - **Expert derails:** Assign them a role: "You’re the fact-checker—explain why unequal groups matter here."  

  **Why This Sequence?**  
  The reversal-first structure mirrors how journalists encounter paradoxes: a claim (aggregate) is challenged (disaggregation). It prioritizes intuition over mechanics. If your room leans skeptical, this builds buy-in before math.  

  ---

  ### **Final Session Outline**  
  1. **Intro (5 min):** Framing + press release hook.  
  2. **Case Study: Aggregate (5 min):** 2023 pay gap → men lead.  
  3. **Reversal (10 min):** Disaggregate → women lead in every job.  
  4. **Arithmetic (15 min):** Why? Group sizes + guided "equal groups" fail.  
  5. **Flip (5 min):** 2024 data → new aggregate, same cells.  
  6. **Interpretation (15 min):** Context rules; pre/post grouping; misconceptions.  
  7. **Reporting (10 min):** Lede exercise + checklist.  
  8. **Q&A (10 min).**  

  **Handout:** Pay gap case data, checklist, press release for lede. No jargon, no formulas.
