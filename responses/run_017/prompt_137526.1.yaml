  - Young:  
    - A: 50/100 = 50%  
    - B: 90/100 = 90% → B better  
  - Old:  
    - A: 10/100 = 10%  
    - B: 50/100 = 50% → B better  
  - Aggregate:  
    - A: (50+10)=60/200=30%  
    - B: (90+50)=140/200=70% → B better?  

  Overall B is better.  

  To make overall A better, we need to have more weight on the group where A performs better. In this case, A does worse in both groups.  

  So flip the group sizes:  

  - Young (large group):  
    - A: 50/1000 = 5%  
    - B: 90/100 = 90% → B better  
  - Old (small group):  
    - A: 10/100 = 10%  
