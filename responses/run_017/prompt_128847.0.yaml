answer: |-
  Here's a targeted Q&A prep sheet designed for your specific audience and thesis. The objections are ordered by likely sequence and ferocity, with answers crafted to hit core arguments quickly.

  **Core Thesis Refresher:** Linkage Condition: Aggregation is permitted *only* when burdens are *jointly unavoidable* (sparing any one requires sparing all, and sparing all is not feasible). Justifies aggregation in the paraplegic vs. mass mild hearing loss case, blocks it in simple headcounts.

  **Q&A Prep Sheet (Ordered by Likely Sequence):**

  1.  **The Consequentialist (EA/QALY Focused): "Why impose this arbitrary 'linkage' restriction? Doesn't it just lead to massively suboptimal outcomes where we ignore vast amounts of suffering? Surely preventing 300 mild harms *is* better than preventing one severe harm, regardless of 'linkage'."**
      *   **Answer (2 min):** "The restriction isn't arbitrary; it's grounded in *justification to each person*. Without linkage, the person saved from paraplegic can reasonably reject: 'Why me? You *could* have spared just me and ignored the others, trading *my* catastrophic loss for their minor inconveniences.' Linkage changes that: 'We literally *couldn't* have spared just you without sparing everyone, and sparing everyone *wasn't possible*. Facing that impossible choice, the combined weight of the many smaller complaints provides a reason you cannot reasonably reject for prioritizing them.' It prevents treating individuals as mere containers for disvalue to be summed, respecting their separateness. Yes, it sometimes blocks maximizing QALYs, but that's the cost of non-utilitarian justification."
      *   **Key Point:** Frame linkage as enabling justification *to the individual loser*.

  2.  **The Scanlonian Ally (Stability Worry): "This seems unstable. If linkage permits aggregation *here* (paraplegic vs. hearing), what stops it permitting aggregation *everywhere*? Won't clever framing of alternatives *always* create a 'jointly unavoidable' scenario? For example, couldn't we always add an option that makes sparing one contingent on sparing all?"**
      *   **Answer (2 min):** "Crucially, linkage depends on the *actual feasible alternatives*, not framing. In the headcount case (save A or save B&C), sparing A alone *is* feasible, and sparing B or C alone is also feasible. No linkage exists. The condition bites on the *structure of the choice set*. It's unstable *only* if we allow manipulating the feasible set. But the moral question depends on the options we *actually* face. If someone artificially engineers a 'linkage' scenario, the moral evaluation depends on whether that engineered set is the *real* one. The principle itself draws a clear, non-arbitrary line based on feasibility and avoidability."
      *   **Key Point:** Anchor linkage to the *actual feasible choice set*, not descriptions. This is the **single reply that must land** or the paper dies. If aggregation collapses into utilitarianism due to framing, the core distinction vanishes.

  3.  **The Consequentialist / Decision Theorist Crossover (Ex Ante/Ex Post): "Is your 'jointly unavoidable' condition assessed ex ante (before assignment of who bears burdens) or ex post (after assignment)? If ex post, doesn't it lead to perverse incentives or ignorance problems? If ex ante, doesn't it collapse into expected utility/risk aggregation?"**
      *   **Answer (2 min):** "It's fundamentally an *ex post* condition applied to the *actual individuals affected* in the *actual outcome*. We ask: looking at this group who suffered, *could* any one of them have been spared without sparing all, given the feasible alternatives? In the hearing loss case, ex post, no single hearing-loss victim could have been individually spared without sparing all. Ex ante reasoning (e.g., risk pools) is different and often *does* involve permissible aggregation under contractualism for distributing risks fairly. But my thesis concerns aggregating *actual complaints* to override a *specific* severe burden faced by another *identified* individual. Linkage prevents the ex post complaint of that identified individual from being overridden by disaggregated minor complaints *unless* those minor complaints were inextricably linked in their avoidability."
      *   **Concede:** Distinguish clearly between ex post complaint aggregation (the paper's focus) and ex ante risk distribution (a different, important topic).

  4.  **The Kantian (Complaint Currency): "Complaints are the wrong starting point. Morality isn't about balancing grievances; it's about respecting persons as ends. Focusing on 'complaints' inherently commodifies harm and pushes you towards the consequentialism you want to avoid. Why not ground duties directly in respect for rational agency?"**
      *   **Answer (2 min):** "Respect for persons *is* central. The 'complaint' here isn't a mere feeling; it's the *reason* an individual has to object to a principle permitting an action that harms them *when a less harmful alternative was feasible*. It's the manifestation of the claim their agency has on us. Linkage ensures this respect: it asks what justification we can offer *to that specific person* for imposing the burden. Denying aggregation without linkage isn't ignoring suffering; it's refusing to sacrifice one person's vital interests *for* the lesser interests of others *when that sacrifice wasn't structurally necessary*. It prevents using persons merely as means to the aggregate good."
      *   **Key Point:** Redefine "complaint" as a *justificatory reason grounded in respect*, not a util.

  5.  **Philosophy-of-Law Scholar (Tort Mapping): "This seems disconnected from how standing and damages actually work in tort law. We routinely aggregate small harms for class actions and award aggregate damages precisely in cases lacking your 'linkage' (e.g., consumer fraud with small individual losses). Is your theory purely prescriptive, or does it claim descriptive/pragmatic relevance?"**
      *   **Answer (2 min):** "Primarily prescriptive, offering a *moral justification* for when aggregation *should* be permissible to override a specific individual's claim. Tort law serves multiple goals: compensation, deterrence, efficiency – sometimes requiring aggregation my moral view might reject. My theory might explain the *moral discomfort* with aggregating truly trivial harms to override a severe individual claim absent linkage. It could inform debates about thresholds for class certification or non-economic damages where the 'separateness of persons' intuition is strong. It's not a direct map, but highlights a moral constraint pure efficiency models ignore."
      *   **Concede Freely:** "You're right, tort law often *does* aggregate without linkage for practical reasons. My claim is moral, not descriptive."

  6.  **Consequentialist (Practicality / QALY Again): "Even if linkage gives a 'reason', isn't the overwhelming weight of hundreds of QALYs lost *objectively* a stronger moral reason? Your condition seems like a philosophical nicety ignoring the concrete reality of suffering prevented or not."**
      *   **Answer (2 min):** "It asks *whose* reasons count and *how*. Without linkage, the paraplegic victim has a decisive complaint: 'You sacrificed *me* for their minor benefits when you *didn't have to*.' The hundreds lack a *singular, comparable complaint against this specific sacrifice*. Their losses, while large in sum, are diffuse and *not* caused by failing to spare them *as a linked group*. Linkage *creates* a collective reason strong enough to override the severe complaint precisely because the only alternative was the impossible 'spare all'. It recognizes the moral significance of the *structure* of causation and avoidability, not just the raw sum."
      *   **Key Point:** Emphasize the *relational* nature of the reason created by linkage – it's a reason *against the specific sacrifice of the one, given the impossibility of individual rescue*.

  7.  **The Menu-Dependence Objection (Likely from Scanlonian or Sharp Consequentialist): "Your view makes permissibility hostage to the menu of options. Imagine two scenarios: (1) Only 'Save Identifiable Paraplegic' or 'Prevent 300 Hearing Losses' (Linkage applies, aggregation permitted). (2) Also includes 'Prevent 150 Hearing Losses'. Now, sparing the paraplegic *is* feasible without sparing *all* hearing loss victims. Linkage vanishes! So whether saving the paraplegic is obligatory depends *arbitrarily* on whether the 'Prevent 150' option exists?"**
      *   **Answer (2 min):** "This isn't arbitrariness; it's *moral sensitivity to feasible alternatives*. Morality *should* depend on what we can actually do! In Scenario 2, the existence of 'Prevent 150' means we *can* spare the paraplegic *without* needing to spare *every single* hearing loss victim. The complaint of the paraplegic victim is *stronger*: 'You could have saved me *and* spared 150 others, but you chose not to save me at all to spare an *extra* 150!' The hearing loss victims we *could* have spared (the 150) have a claim. The *additional* 150 lack a claim strong enough *when considered individually* to override the paraplegic's claim, precisely because sparing them wasn't linked to sparing the first 150 or the paraplegic in an unavoidable way. The moral landscape changes because the feasible actions change."
      *   **Where You're Weakest:** This *is* a major challenge, but your answer highlights its strength: morality *is* context-dependent based on available actions. Stress that linkage reflects a deep truth about when collective complaints become relevant *against a specific individual sacrifice*. **This might be the nastiest, but your answer is defensible.**

  8.  **The Decision Theorist / Scanlonian (Edge Case - Partial Linkage?): "What about cases of *partial* linkage? Suppose sparing the paraplegic requires also sparing *some* (but not all) hearing loss victims, due to resource constraints or causal chains. Does *any* linkage permit *full* aggregation? Or only perfect joint unavoidability?"**
      *   **Answer (2 min):** "The condition requires *perfect* joint unavoidability for *full* aggregation against a *specific* competing claim. Partial linkage might create a *stronger aggregated claim for a subgroup*, but wouldn't automatically justify overriding a severe claim like paraplegic prevention *using complaints from unlinked individuals*. If sparing the paraplegic requires also sparing Group A (100 people), but Group B (200 people) could be spared independently, then only Group A's complaints are linked against the paraplegic claim. Group B's complaints might support saving Group A+Paraplegic, but not directly override the paraplegic claim *on their own*. Linkage is binary for a defined group relative to a specific alternative."
      *   **Concede:** "Partial linkage creates complex grey zones needing further work, but the core clear cases (perfect linkage vs. no linkage) demonstrate the principle."

  **The Question You're Hoping Nobody Asks (Where You Might Be Weakest Beyond Menu-Dependence):**

  *   **"How do you *operationalize* 'jointly unavoidable' and 'not on the cards'? Isn't this hopelessly vague or dependent on contested notions of feasibility? What counts as 'sparing' someone? Does it require physical impossibility, or just extreme cost? Couldn't 'Spare Everyone' *always* be 'on the cards' at *some* (perhaps astronomical) cost, thus destroying linkage?"**
      *   **Why it's bad:** It attacks the metaphysical/metaphorical foundation ("jointly unavoidable") and threatens to collapse the view either into requiring physical impossibility (often unrealistic) or into a scalar cost-benefit analysis (utilitarianism through the back door). Defending a robust, non-arbitrary, non-utilitarian notion of feasibility is extremely difficult. Your answer would need to appeal to "normal" or "reasonable" resources/capacities in the context, but this is inherently messy.
      *   **If Asked:** "This is a deep challenge. 'Jointly unavoidable' requires that, given the *actual resources, knowledge, and capacities reasonably available in the situation*, sparing any one member truly *necessitates* sparing all, and sparing all is genuinely *infeasible* within those constraints. It's not metaphysical impossibility, but a robust practical impossibility given the context. 'Sparing' means preventing the specific burden in question. While borderline cases exist, the core intuition is clear in the central case: with fixed resources, preventing *any one* hearing loss victim requires a system overhaul (e.g., a cure) that would *ipso facto* prevent *all* of them, and implementing that overhaul isn't feasible with the resources at hand. We judge feasibility contextually in ethics all the time (e.g., 'ought implies can')."

  **Summary for Your Talk:**

  *   **Concede Early:** Distinguish your *moral* claim from *tort law practice* and from *ex ante risk distribution*. Acknowledge the *prescriptive* nature.
  *   **Hammer the Central Case:** Spend time making the paraplegic vs. hearing loss case vivid. Repeatedly contrast "We *could* have spared just you (but didn't)" vs. "We literally *couldn't* have spared just you without sparing everyone (and couldn't spare everyone)".
  *   **Land the Stability Reply:** "Linkage is stable because it depends on the *actual feasible choice set*, not descriptions or framings."
  *   **Embrace Context (for Menu-Dependence):** Morality *should* be sensitive to what we can actually do. Different options create different moral reasons.
  *   **Project Confidence on Feasibility:** Treat "jointly unavoidable" as a meaningful, contextually grounded concept central to non-utilitarian moral reasoning.

  Good luck! Your thesis is sharp and interesting – defend it clearly and lean into the core intuition behind linkage.
