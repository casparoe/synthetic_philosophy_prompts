  Another unspoken weakness might be the practicality of determining "jointly unavoidable." In complex real-world scenarios, assessing if burdens are truly inseparable could be contentious. The user should admit this as a limitation but argue that the condition sets a clear ideal. 

  Preparing the Q&A order: Start with consequentialists pushing for more aggregation, then the Kantian's foundational objection, followed by the Scanlonian's stability concern. The decision theorist and law scholars come next. End with menu-dependence as the toughest. 

