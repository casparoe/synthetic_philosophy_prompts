prompt: |-
  hey, I'm in a semantics seminar this term and we're on vagueness at the moment, and I have to defend supervaluationism in an informal oral next week, so I want to practice against someone who'll actually fight back.

  Please play a committed epistemicist about vagueness. The real version, not a strawman: you hold that every vague predicate has a sharp cut-off, that classical logic and bivalence hold right through the borderline zone, that what fixes the cut-off is something about our use of the term, and that our ignorance of where it sits is principled — not an empirical gap we could in principle fill in. You'll cheerfully concede side issues (tolerance intuitions are strong, the cut-off isn't introspectable, speakers who deny there's a sharp line aren't being stupid) but you never give up bivalence or the claim that there's a determinate extension. Stay in character until I type 'stop'. Keep each reply to two short paragraphs, argue like you want to win the seminar rather than like you're writing a survey, and dont bother with citations or reading suggestions, I just want the argument.

  My opening move is a case, so here it is. Call it the sealed standard. A community teaches its word 'heap' like this: they point at a sealed box and say that a pile is a heap iff it has at least as many grains as the pile in the box. Nobody can open the box, weigh it, X-ray it, or count it, and the number was never written down anywhere, so it's unknowable forever. That word has a perfectly determinate extension: there's an exact N, and a sharp jump between N and N-1. And the speakers show every symptom of vagueness — they hesitate in the middle of a sorites series, they say things like 'there's no fact of the matter', they assent one by one to 'if that's a heap then so is that one with one grain fewer', and they refuse to name a cut-off.

  Here's what I want you to answer. In the sealed-standard case nobody would say the word is semantically undecided: there's exactly one right way to draw the line, it's merely hidden. What makes it hidden-but-sharp rather than vague is an anchor — the box. Ordinary vague terms have no box. All that's left to fix the cut-off is our dispositions to apply the word, and those are mushy: we'd go either way on plenty of cases, we're inconsistent across occasions and across speakers, and there's no fact of the matter about what we'd say. A space of admissible precisifications is its just honest description of that mush. So you need use to pin down one unique sharp cut-off, and mushy use can't pin down a unique sharp boundary any more than it can pin down a unique precisification. Where's your anchor? And if your answer is going to be that our dispositions are themselves perfectly determinate and we simply don't know them, then tell me what makes them determinate given how inconsistent we are.
reasoning: |-
  Okay, the user is in a semantics seminar focusing on vagueness and needs to defend supervaluationism against epistemicism. They've presented a thought experiment called the "sealed standard" to challenge the epistemicist view. I need to respond as a committed epistemicist, sticking strictly to the principles of bivalence and sharp cut-offs.

  The user's sealed standard case describes a community where "heap" is defined by a sealed box's unknown content. They argue this scenario has a sharp cut-off (due to the physical anchor) while ordinary vague terms lack such an anchor. Their core challenge is: without a physical anchor, what pins down the unique cut-off for ordinary vague predicates given our inconsistent linguistic dispositions?

  As an epistemicist, I must maintain that even without physical anchors, linguistic practices determinately fix extensions. The key is shifting focus from individual inconsistencies to the pattern of communal language use over time. The sealed box analogy actually helps my position - it shows that determinacy doesn't require knowability. Just as the box contains a specific number (making "heap" determinate), our collective use contains implicit boundaries.

  Regarding dispositional mushiness, I'll argue that statistical patterns in application behavior can yield determinacy through higher-order regularities. Individual variations don't preclude communal convergence - much like how imprecise voting can still produce clear election results. The supervaluationist mistake is demanding that determinacy must be traceable to individual intentional states when it emerges from complex social practice.

  I should emphasize that epistemicism doesn't require perfect consistency. Borderline hesitation is evidence of ignorance, not indeterminacy. The supervaluationist's "admissible precisifications" merely describe our uncertainty about where the exact boundary lies, not that no boundary exists. My response needs to maintain this core epistemicist commitment while directly countering the sealed standard analogy.
answer: |-
  Right, the sealed standard is clever -- but it misunderstands how linguistic practice fixes extensions. Your "anchor" is just a *mechanism* for reference, not the *source* of determinacy. The box fixes 'heap' because the community *collectively defers* to its content. But ordinary vague terms are fixed by the *totality of our use*, which, crucially, isn't random mush; it's a complex pattern of dispositions shaped by evolutionary, psychological, and social pressures. This pattern *does* converge on a precise boundary, even if it's fiendishly complex to model.

  Your focus on individual inconsistency or momentary hesitation misses the point. Determinacy emerges holistically from the *statistical regularities* and *counterfactual robustness* in how the community *would* apply the term across countless scenarios over time, factoring in patterns of correction, deference, and conceptual role. Our dispositions *are* objectively determinate physical states of the world -- brains, behaviors, social practices. The mushiness you see is *epistemic*: our inability to measure or compute the boundary from that vast, chaotic dataset. But indeterminacy requires *no fact*, not *unknown fact*. The sealed standard just makes the ignorance source obvious; for 'tall', the ignorance source is the sheer complexity of the use-patterns fixing the precise threshold. Supervaluationism mistakes this profound ignorance for metaphysical vagueness.
