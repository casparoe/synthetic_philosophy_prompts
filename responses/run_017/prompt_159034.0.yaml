prompt: |-
  Hey — I'm a junior in a comparative politics seminar this semester and we're on the democracy unit, the one where every week the reading is about Hungary, then Poland, then Turkey, and now increasingly the US, and I got hired (kind of by accident) as a research assistant for a professor who's building an event-level dataset on democratic erosion. My job, with one other undergrad, is to read somewhere between forty and sixty news items a week and code each one as either backsliding, ordinary political conflict, or not enough information. We got a two hour training and a codebook that is basically three paragraphs long. We already disagree constantly, partly because neither of us knows much about any of these countries and partly because my roommate — same seminar, very online — keeps saying the whole concept is just a fancy way of saying "a government I don't like did something," and honestly when we went around the room in section, almost everyone coded based on whether they liked the party in power. So what I want is something I can actually run in about ten minutes an item, with only the article in front of me and a notepad, that I could also defend if someone on the other side of the aisle in my seminar read my codes.

  What I'm asking for is a decision procedure in the order I'd run it: the questions, what counts as an adequate answer to each one given that I'm an undergrad with no country expertise, the point where the procedure stops with a hard no and I log "do not code," and the point where it hands the item to the lead RA because the question is really about values or interpretation rather than facts. There are five things I keep tripping over and I want the procedure to actually handle them rather than hand-wave. First, telling apart "they changed the rules of the game" from "they passed a policy I dislike inside the existing rules," which I think is the crux of the whole concept but I have no idea how to make it mechanical. Second, the packaging problem: a lot of my items are about a single measure that plenty of healthy democracies also have (changing a judicial retirement age, redrawing districts, tightening voter ID), and each one looks fine on its own, so I need to know how to handle a small change that's really one slice of a pattern when I only ever see one item at a time. Third, cases where nothing legal changed but officials just stopped complying with something — court rulings, certification of results — since that's a change in practice and not a change in rules, and I don't know if it belongs in a dataset of events at all. Fourth, the "they won an election, so they get to do this" defense: whether an electoral mandate should count for or against coding something. And fifth, some actual guard against my own bias, a step I have to do before I log a code — maybe running the same test on an imagined government with the opposite platform, or asking what coalition would be needed to reverse the change compared to the one that passed it — and writing the answer down in an audit line so the professor can adjudicate later.

  Then please run the finished procedure on three cases, and write them up so I can see where it bites. Use these composites (I'm deliberately not naming specific laws or dates because I don't trust myself to get them right): (a) a governing party with a legislative supermajority rewrites the electoral formula and, over several years, regional news outlets end up under a foundation run by its allies, with public advertising money following them; (b) a government lowers the retirement age for supreme court judges and creates a new disciplinary body for judges, then loses the next election, and its successor replaces the leadership of the public broadcaster by ministerial decree, saying it's undoing the previous capture; (c) a state legislature redraws congressional districts mid-decade at the request of the national president's party, and a state body takes over a county election board. One of those three has to be a case where the procedure gives an answer I won't like — I'd rather see that than a clean sweep — and I want you to say plainly which one it is and why the procedure can't soften it. Finally, tell me what the procedure can't do: where it will misfire, what kinds of items it's simply the wrong instrument for, and which parts of it are really just me making a judgment call with extra steps.
reasoning: |-
  Okay, I need to help this user who's a junior in a comparative politics seminar. They're working as a research assistant coding news items for democratic erosion and are struggling with several issues. Let me unpack their request.

  The user is dealing with real-world complexities in coding political events. They need a practical decision procedure that addresses five key challenges: distinguishing rule changes from policy changes, handling incremental erosion patterns, identifying non-compliance, evaluating electoral mandates, and mitigating personal bias. 

  I should design a systematic flowchart approach that moves from concrete facts to interpretations. For the bias check, building in an explicit "opposite coalition test" seems crucial. The procedure must flag ambiguous cases for senior review rather than forcing premature coding.

  For the three test cases:
  - Case A clearly shows systemic rule manipulation across branches
  - Case B's second action is tricky because it's framed as reversal but uses executive overreach
  - Case C's mid-decade redistricting coupled with election board takeover crosses into backsliding despite polarization

  The procedure's main limitations will be in cases of ambiguous intent, complex institutional contexts, and when democratic norms erode through widespread non-enforcement rather than discrete events. The bias check helps but can't eliminate subjective interpretation completely.

  I'll structure the response with a clear step-by-step procedure followed by analysis of the test cases, being transparent about where the method produces uncomfortable conclusions. The key is balancing academic rigor with practical usability for an undergraduate researcher.
answer: |-
  Here's a procedural decision tree designed for speed, defensibility, and handling your five sticking points. It prioritizes **observable institutional actions over policy outcomes** and includes explicit bias checks.

  **The Decision Procedure (Run in this order for each news item):**

  1.  **Is this a *discrete event* involving *state action*?** (Law passed, decree issued, court ruling ignored, agency action taken, funding reallocated, official statement refusing compliance)
      *   **NO** (e.g., opinion piece, poll, protest report, general criticism, vague threat) → **DO NOT CODE** (Log: "Not a discrete state action")
      *   **YES** → Proceed to Step 2.

  2.  **Does the action *directly alter* the formal rules governing:**
      *   **A.** Access to power (e.g., electoral laws, candidacy rules, party registration)?
      *   **B.** Exercise of power (e.g., executive authority, legislative procedure, judicial independence, oversight bodies)?
      *   **C.** Accountability for power (e.g., media freedom, civil liberties, anti-corruption mechanisms)?
      *   **NO** to A, B, & C (e.g., tax policy, environmental regulation, foreign policy, social policy within existing rules) → **ORDINARY POLITICAL CONFLICT** (Log: "Policy within rules")
      *   **YES** to A, B, or C → Proceed to Step 3. *(Addresses Point 1: "Changing rules" vs. "Policy")*

  3.  **Intent/Context Check (The "Pattern & Precedent" Test):**
      *   Does the article explicitly link this action to a *broader pattern* of similar actions by this actor targeting the *same institution* or *same type of right* (e.g., "third judicial reform this year," "latest in a series of media laws")?
      *   Does the article cite credible sources (experts, watchdogs, opposition, int'l bodies) arguing this action *systematically weakens checks/balances* or *concentrates power*?
      *   Is the action *unprecedented* in the country's recent democratic history or *deviates significantly* from common democratic practice elsewhere?
      *   **NO** to all 3 → Flag as **AMBIGUOUS (Potential Packaging Problem)** → Proceed to Step 4 *(Addresses Point 2: Packaging)*
      *   **YES** to at least 1 → Proceed to Step 5.

  4.  **Ambiguous Action Handling:**
      *   **Log details:** Note the specific rule changed, the institution affected, and the stated justification.
      *   **Flag:** Mark as **"SUSPECTED PARTIAL EROSION - Needs Pattern Review"**.
      *   **Action:** **DO NOT CODE** independently. Send the item AND a brief note summarizing the action/justification to the Lead RA immediately. Your job here is just identification and flagging. *(Addresses Point 2: Packaging - Hands off complex pattern assessment)*

  5.  **Non-Compliance Check:** Is the action *primarily* about state officials **refusing to comply with an existing, unambiguous legal rule or court order?**
      *   **YES** (e.g., ignoring election certification, defying court ruling, blocking oversight access without legal basis) → **BACKSLIDING** (Log: "Non-compliance w/ existing rule [specify rule]") → **Proceed to Step 7.** *(Addresses Point 3: Non-Compliance as Event)*
      *   **NO** (It's a formal rule change) → Proceed to Step 6.

  6.  **Electoral Mandate Check ("The Legitimacy Test"):**
      *   **A.** Was the action taken through the *legislative process* by a government/majority formed after a *free and fair election*?
      *   **B.** Is the change *reversible* by a *simple change in government* using the *same constitutional/legal procedures* (i.e., doesn't require a supermajority it created, or bypass legislature entirely)?
      *   **YES to A & B** → **ORDINARY POLITICAL CONFLICT** (Log: "Rule change via legitimate/reversible process") → **Proceed to Step 7.** *(Addresses Point 4: Mandate - Legitimate change is conflict, not erosion)*
      *   **NO to A or B** (e.g., done by decree, packed court, after flawed election, requires supermajority to reverse) → **BACKSLIDING** (Log: "Rule change undermining reversibility/legitimacy") → **Proceed to Step 7.**

  7.  **Bias Check (Mandatory Before Logging Final Code):**
      *   **The Opposite Coalition Test:** Imagine a party/coalition you *strongly disagree with ideologically* doing *this exact same action* for *their stated reasons*. Would you still assign the *same code* (Backsliding, Conflict, DNQ) based *only on the institutional mechanics* assessed in Steps 1-6? Write down your answer ("Yes, same code because [mechanic]" or "No, I'd code it as [X] because [reason]").
      *   **The Reversibility Test (If Backsliding):** Briefly note the *actual* coalition/vote needed to reverse this action (e.g., "simple majority", "2/3 supermajority", "court ruling unlikely", "requires capturing institution X first"). Compare it to the coalition that passed it. If reversal is significantly harder, note why.
      *   **Log:** Write your answers concisely in the "Audit Notes" field. *This is your defensibility shield.* If your answer is "No" on the Opposite Coalition Test, seriously reconsider your code. *(Addresses Point 5: Bias Guard)*

  8.  **Final Log:** Record your code (Backsliding, Ordinary Conflict, Do Not Code) and the key reason from the steps above in the dataset.

  **Applying the Procedure to Your Cases:**

  *   **Case A:** Governing party rewrites electoral formula; regional news outlets end up under ally-run foundation w/ public funds.
      *   **Step 1:** YES (Legislation + Funding decisions over years - code each *discrete* event separately. Assume item is about one specific funding shift or law).
      *   **Step 2:** **YES** (Electoral formula -> Access to Power (A). Funding shift to captured outlets -> Accountability (C)).
      *   **Step 3:** **YES** (Article likely mentions pattern: "further consolidation", "continuing efforts"). Proceed.
      *   **Step 5:** NO (Formal changes).
      *   **Step 6:** **A.** Probably YES (assuming supermajority won fairly *then*). **B. Reversibility?** **NO.** Captured media foundation & skewed electoral formula likely designed to be hard for a simple majority to reverse (e.g., foundation structure independent, formula entrenches supermajority). → **BACKSLIDING**.
      *   **Step 7 (Bias Check):** *Opposite Coalition:* If my ideological opponents skewed elections and funded their own media empire, I'd *absolutely* code as backsliding. *Reversibility:* Harder than simple majority likely. Log notes.
      *   **Code:** BACKSLIDING

  *   **Case B:** Govt lowers SC retirement age + new judicial disciplinary body; loses election; successor replaces public broadcaster leadership by decree "to undo capture."
      *   **Part 1 (Previous Govt - Judicial Changes):**
          *   Step 1: YES (Laws passed).
          *   Step 2: **YES** (Judicial independence -> Exercise of Power (B)).
          *   Step 3: **YES** (Typically part of pattern, targets judiciary). Proceed.
          *   Step 5: NO.
          *   Step 6: **A.** YES. **B. Reversibility?** **Likely NO.** Packing courts/discipline bodies often makes reversal by next govt difficult (e.g., new judges appointed, body captured). → **BACKSLIDING**.
          *   Step 7: *Opposite Coalition:* If opponents packed courts, I'd code as backsliding. *Reversibility:* Hard (needs new law/appointments).
          *   **Code (for original judicial actions):** BACKSLIDING
      *   **Part 2 (New Govt - Broadcaster Decree):**
          *   Step 1: YES (Ministerial decree).
          *   Step 2: **YES** (Media independence -> Accountability (C)).
          *   Step 3: **YES** (Explicitly framed as reversing capture, implies prior erosion). Proceed.
          *   Step 5: NO (Formal decree).
          *   **Step 6: A.** YES (elected govt). **B. Reversibility?** **YES... BUT:** Here's the uncomfortable part. It's done **by decree**, bypassing normal appointment processes (legislature, independent body). Even if reversing prior capture, the *method* concentrates power in the executive. Reversal would be *easy* (next minister could decree again), but the *precedent of executive overreach* weakens institutions. → **AMBIGUOUS** (Proceed to Step 4).
          *   **Step 4:** Log: "Decree to replace broadcaster leadership. Stated reason: undo prior capture. Method: executive overreach bypassing norms." → **Flag for Lead RA: "SUSPECTED PARTIAL EROSION - Method vs. Intent"**. **DO NOT CODE** yourself.
          *   **Step 7 (Still Do):** *Opposite Coalition:* If my opponents won and decreed their people into media control *even to reverse my bad actions*, I'd be wary of the method. *Reversibility:* Easy, but norm violated. Notes logged.

  *   **Case C:** State legislature redraws districts mid-decade at Pres party's request; state body takes over county election board.
      *   **Part 1 (Mid-Decade Redistricting):**
          *   Step 1: YES (Legislative action).
          *   Step 2: **YES** (Electoral rules -> Access to Power (A)).
          *   Step 3: **YES** (Mid-decade redistricting outside normal cycle is unusual/controversial; often cited as gerrymandering tactic). Proceed.
          *   Step 5: NO.
          *   **Step 6: A.** YES (assuming state leg elected). **B. Reversibility?** **YES** (Simple majority could redraw again later... though unlikely if it benefits them). → **ORDINARY POLITICAL CONFLICT**. *(This might be the one you dislike - see below)*
          *   Step 7: *Opposite Coalition:* If opponents redrew mid-decade to benefit themselves, I'd still code as Conflict (if reversible by simple vote). *Reversibility:* Possible w/ simple majority. Log notes.
          *   **Code:** ORDINARY POLITICAL CONFLICT
      *   **Part 2 (State Takeover of County Board):**
          *   Step 1: YES (State body action).
          *   Step 2: **YES** (Election administration -> Access to Power (A) / Accountability (C)).
          *   Step 3: **YES** (Centralization of election admin is common erosion tactic). Proceed.
          *   Step 5: **MAYBE.** Is it defying a law giving counties authority? Or changing rules? Assume rule change/centralization law passed.
          *   Step 5: **NO** (Assume formal rule change). Step 6: **A.** YES. **B. Reversibility?** **Likely NO.** Centralizing control often requires capturing the state body first to reverse. → **BACKSLIDING**.
          *   Step 7: *Opposite Coalition:* If opponents centralized election control, I'd code as Backsliding. *Reversibility:* Harder (need to control state body).
          *   **Code:** BACKSLIDING

  **The Uncomfortable Answer & Why:** The procedure codes **Case C, Part 1 (Mid-Decade Redistricting)** as **Ordinary Political Conflict**. Why can't it soften?
  1.  **Step 2:** It *is* a rule change affecting access to power.
  2.  **Step 3:** It's suspect/controversial.
  3.  **Step 6:** The crux: It was done by an elected legislature (**A=YES**) and, critically, **it can be reversed by a simple majority vote of the same legislature (B=YES)**. The procedure treats such reversible changes by elected bodies as intense political conflict, not institutional backsliding. The *intent* (gerrymandering) is hard to prove objectively in a single event coding. The procedure prioritizes the *mechanism* (legislative, reversible) over suspected intent in this specific step. *This is why Step 3 and Step 7 are vital context.*

  **What the Procedure CANNOT Do (Limitations):**

  1.  **Prove Intent:** It infers from patterns and effects, but can't read minds. "Legitimate policy goal" vs. "erosion tactic" often remains ambiguous.
  2.  **Handle Pure Norm Erosion:** Widespread, low-level non-compliance not tied to a specific event (e.g., constant norm-breaking without a discrete trigger) won't be captured. It needs a discrete event.
  3.  **Resolve Deep Institutional Ambiguity:** If a country's constitution is inherently flawed or contested, coding rule changes becomes hazardous. The procedure assumes a baseline democratic framework.
  4.  **Eliminate Judgment Calls (Especially Step 3 & 6):** Recognizing a "pattern," "common democratic practice," or "significantly harder reversal" requires contextual knowledge. The codebook needs examples. This is where sending items to the Lead RA (Step 4) is crucial.
  5.  **Solve the "Healthy Democracy Does X" Problem:** It relies on Step 3 (pattern/precedent/credible sources) to flag when a common practice (voter ID, judicial retirement) is being weaponized. This is imperfect and requires good source material in the article.
  6.  **Fully Eliminate Bias:** Step 7 forces you to confront it, but bias can still creep into interpreting "pattern," "credible source," or "significantly harder reversal." The audit trail is key for the professor.
  7.  **Code Complex, Multi-Faceted Events Perfectly:** Real events often touch multiple steps. Break them down. Code the core discrete actions. Use the audit notes to explain complexity.

  **Key for You:** This procedure makes you focus on **HOW** power is changed, not **WHAT** policy is made. **Log your Step 7 answers religiously.** They are your defense. When in doubt on patterns or reversibility mechanics (Steps 3 & 6B), **send it to the Lead RA** (Step 4). Your core job is identifying *potential* erosion events and *clear* non-events/conflict; let the Lead handle the ambiguous pattern cases. Good luck!
