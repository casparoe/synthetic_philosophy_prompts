prompt: |-
  hi — I'm a journalist, I mostly cover science and ideas, and I'm working on a piece about how population ethics ended up inside the longtermist/effective-altruism policy world. Before I repeat any of this in print I need someone to tell me how much of my one source is actually right.

  The source is a draft white paper from a small foresight think tank that was forwarded to me by a PR person (I'd rather not name them). I've rewritten it slightly so it isn't searchable, but the substance is theirs. The background section says:

  "Population axiology asks which of two outcomes is better when the outcomes contain different people. Total utilitarianism answers: add up everyone's lifetime welfare and prefer the bigger total. In the 1980s Derek Parfit showed that this commits you to the Repugnant Conclusion — that for any population of ten billion people all living wonderful lives, there is some vastly larger population of people with lives barely worth living that would be better. So total utilitarianism says we ought to be trying to fill the universe with trillions of near-miserable people. Since nobody accepts that, the total view is dead. The natural alternative is average utilitarianism: maximise welfare per person. But that says it's a bad thing to add a happy person who happens to be slightly below average, and it implies the best possible world contains exactly one ecstatic person. So researchers in this area have mostly moved to 'critical-level' views, which subtract a fixed neutral level of welfare — the level at which a life counts as worth living — from each life before adding them up; these avoid the Repugnant Conclusion and don't have the other problems. Really, the Repugnant Conclusion is just the Mere Addition Paradox restated, and both come down to nothing more than our discomfort with very large numbers, which psychologists have shown we're terrible at."

  Then they pitch their own fix, which is the part I actually care about. Call it rank-weighted totalism: you keep total utilitarianism, but before summing you sort everyone from best-off to worst-off and weight the person at rank r by 1/r — the best-off life counts fully, the second counts half, the third a third, and so on. They claim this "smoothly dampens the value of headcount," stays "close to ordinary total utilitarianism," and "blocks the Repugnant Conclusion, because however many barely-worth-living people you add, the later ones barely count." They add in a footnote that it doesn't matter how you break ties between people at the same welfare level.

  So: go through the background section and tell me what a population ethicist would accept, what they'd wince at, and what's just wrong — and whether "total utilitarianism is dead" follows from the parts that are right. My instinct is that the history is basically fine and the 1/r gimmick is where the bodies are buried, but the whole thing reads so smoothly to me that I don't trust my own reaction. And on their fix specifically: does it actually avoid the Repugnant Conclusion or just push it out to numbers no reader can picture, and what happens to everyone's weights when you add one person who's better off than all of them?
reasoning: |-
  Okay, the user is a journalist covering science and ideas, specifically how population ethics got tied into longtermism and effective altruism. They have a draft white paper from a think tank and need to verify how accurate the background section is before publishing. They're concerned about repeating misinformation, especially since the source has a PR angle. 

  First, I need to unpack the background claims. The white paper states that total utilitarianism leads to the Repugnant Conclusion, therefore it's "dead," and critical-level theories are the mainstream alternative. Then they propose rank-weighted totalism (1/r weighting) as a fix. The journalist wants to know: how much of this is accepted by ethicists, what's oversimplified or wrong, and whether their proposed solution holds water.

  Hmm. The historical framing is mostly correct—Parfit did dismantle total utilitarianism via the Repugnant Conclusion in the 1980s, and average utilitarianism has its own absurdities. But saying total utilitarianism is "dead" is hyperbolic. Many philosophers still engage with it (e.g., as a benchmark), and some defend modified versions. The white paper glosses over ongoing debates—like whether the Repugnant Conclusion is truly repugnant or just counterintuitive. 

  The Mere Addition Paradox connection is overstated. While related, they're distinct arguments; Parfit used Mere Addition to set up the Repugnant Conclusion but didn't claim they were "restatements." Also, reducing the Repugnant Conclusion to "discomfort with large numbers" is a huge oversimplification. Psychologists do show we're bad at large-scale empathy, but the philosophical objection runs deeper—it challenges whether quantity can trump quality of life ethically. 

  Now, the proposed fix: rank-weighted totalism. Clever math, but ethically shaky. Weighting by 1/r means the best-off person matters most, the worst-off barely matters—which feels upside-down from standard moral priorities (e.g., prioritarianism focuses on the worst-off). And yes, it technically avoids the Repugnant Conclusion... by making additional lives worthless. But that creates new problems: adding a happy person below the best-off existing person *reduces* overall welfare because their weight is low and they drag down everyone else’s ranks. That’s deeply counterintuitive—imagine refusing to create a happy child because it slightly demotes others’ ranking. 

  Also, scale problems: at astronomical populations, even the billionth person has near-zero weight. Is that defensible? And adding someone better-off reshuffles all weights—chaotic outcomes. 

  The journalist’s instinct is right: the history is *mostly* fine (if simplified), but the 1/r "gimmick" is where the real issues hide. They should also probe why this think tank favors a system valuing elite lives over miserable ones—it suspiciously aligns with longtermist tech-elite narratives about prioritizing far-future "high-quality" lives. 

  For their piece, I’d suggest: 
  - Acknowledge Parfit’s critique shattered consensus but total utilitarianism isn’t "dead." 
  - Note critical-level theories are mainstream but controversial. 
  - Flag the "large numbers" claim as reductive. 
  - Expose the rank-weighted model’s perverse incentives and elitist implications. 
  - Maybe quote ethicists: "This doesn’t solve the Repugnant Conclusion; it sidesteps it by devaluing humanity."
answer: |-
  You're right to be skeptical—the background section oversimplifies key debates and contains substantive errors, while the proposed "fix" introduces severe new problems. Below is a point-by-point breakdown from a population ethics perspective, followed by a verdict on the white paper's narrative and the 1/r model.

  ### **Critique of the Background Section**
  1.  **"Total utilitarianism is dead"**: **Overstated.**  
      While Parfit's Repugnant Conclusion (RC) is widely seen as a devastating objection, **total utilitarianism isn't "dead"**—it remains a benchmark theory. Many philosophers (e.g., Torbjörn Tännström, Gustaf Arrhenius) still engage with it, and some (e.g., John Broome) defend modified versions. The white paper implies universal rejection, but the reality is ongoing, nuanced debate.

  2.  **"Researchers have mostly moved to critical-level views"**: **Misleading.**  
      Critical-level theories (pioneered by Charles Blackorby, Walter Bossert, and David Donaldson) are indeed prominent, but they're **not the consensus**. Competing approaches include:
      - **Variable Value Views** (e.g., Ng, Yew-Kwang): Value per life diminishes as population grows.
      - **Person-Affecting Views**: Only consider impacts on people who exist in both outcomes.
      - **Non-Archimedean Theories**: Reject trade-offs between quality and quantity.
      Critical-level theories face their own criticisms (e.g., they imply *creating* a miserable life could be good if it's above the critical level).

  3.  **The Repugnant Conclusion as "Mere Addition Paradox restated"**: **Incorrect.**  
      - **Mere Addition Paradox**: Adding happy people (without harming others) seems good, but leads to an outcome *worse* than the original—challenging transitivity of "better than."
      - **Repugnant Conclusion**: A large population with barely worthwhile lives *outranks* a small, very happy one.  
      They're distinct arguments. Parfit used Mere Addition to *motivate* the RC, but they address different problems.

  4.  **RC reduced to "discomfort with large numbers"**: **Dismissive and incomplete.**  
      While cognitive biases exist (e.g., scope insensitivity), the RC is a **philosophical problem about moral trade-offs**, not just psychology. Ethicists like Larry Temkin argue it reveals deep tensions in our intuitions about aggregation and beneficence.

  ---

  ### **Critique of the 1/r "Rank-Weighted Totalism"**
  The proposed model **technically avoids the RC but at catastrophic ethical costs**. Key flaws:

  1.  **Avoids RC? Yes, but...**  
      - Adding a person at welfare level `w` contributes `w × (1/r)`, where `r` is their rank in the sorted population.  
      - For vast populations with barely-positive welfare, new additions have `r ≈ ∞`, so their contribution `→ 0`. Thus, you can't make the total arbitrarily large—**RC is blocked.**  
      - **But**: This "solution" pushes the RC to impractical numbers *by design*, not by resolving the underlying dilemma.

  2.  **Perverse Prioritarianism**:  
      - **Worst-off lives are nearly worthless**: A person at rank 10,000 contributes 1/10,000th of their welfare. This **inverts moral intuition**—standard prioritarianism weights the *worst-off* most heavily (e.g., 1/r would be `r=1` for the *best*-off).  
      - **Adding a happy but not maximally happy person *lowers* total value**: Suppose you add someone happier than 90% of the population but less happy than the top 10%. Everyone below them drops in rank, reducing their weight. If the new person's welfare gain doesn't offset the weight loss of others, **total welfare decreases**. Example:  
        - Initial population: 10 people at welfare 100 (sorted: r=1 to 10). Total = `100 × (1 + 1/2 + ... + 1/10) ≈ 259`.  
        - Add an 11th person at welfare 99 (now r=11 for them, others reshuffled).  
        Total ≈ `100 + 100/2 + ... + 100/10 + 99/11` ≈ **252** (a net *loss*).  
        This implies **creating a very happy life can be morally wrong**—a deeply counterintuitive result.

  3.  **Adding a Better-Off Person**:  
      - If you add someone happier than *all* existing people, they take rank r=1. Everyone else shifts down (r → r+1), reducing their weight. The new total is:  
        `(New person's welfare) × 1 + ∑[w_i / (r_i + 1)]` for all others.  
      - **Net effect is ambiguous**: The new top life adds full value, but all others lose weight. Unless the newcomer's welfare is astronomical, this often **lowers total welfare** (e.g., adding a person at 101 to 10 people at 100 reduces the sum from ~259 to ~275, but if they're only at 100.5, it *decreases*).

  4.  **Ignores Equality and Justice**:  
      The model is **insensitive to distribution**. A world with one elite (welfare 1,000,000, r=1) and 1 billion at near-starvation (welfare 0.001, r=2–1,000,000,001) could outrank an egalitarian society—**legitimizing extreme inequality**.

  ---

  ### **Journalist Takeaways**
  - **White paper's narrative**: Oversimplifies history (total utilitarianism isn't "dead"), misrepresents current research (critical-level isn't dominant), and dismisses philosophical depth (RC ≠ cognitive bias).  
  - **1/r model**: Avoids RC by devaluing large populations and low-ranked lives—**ethically indefensible** to most scholars. It violates core principles like the **Asymmetry** (creating miserable lives is bad, but creating happy ones isn't obligatory) and **Non-Antiegalitarianism**.  
  - **Why this matters for longtermism/EA**: This model could appeal to longtermists by "solving" RC while justifying focus on a small elite (e.g., future digital minds), as their high welfare/rank dominates calculations. **Probe this ideological alignment.**  

  ### **Suggested Expert Sources**
  1.  **Gustaf Arrhenius** (Director, Institute for Futures Studies): Leading researcher on population ethics; critiques simplistic "solutions" to RC.  
  2.  **Hilary Greaves** (Oxford EA): Worked on population ethics in longtermist contexts; defends total views.  
  3.  **Marc Fleurbaey** (Princeton): Critic of ad hoc fixes; advocates for fairness-based approaches.  
  4.  **Teruji Thomas** (Global Priorities Institute): Analyzes RC alternatives for EA.  

  **Final Verdict**: The background is a mix of half-truths and oversimplifications; the 1/r model is a provocative thought experiment but ethically untenable. The white paper's smoothness masks substantive gaps—trust your instinct.
