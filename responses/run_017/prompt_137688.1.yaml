prompt: |-
  I've got a 35-minute slot next week in our internal engineering-leadership program, twenty-ish newly promoted managers, and I want to build it around the dollar auction — the one where the prize goes to the highest bidder but the runner-up pays their bid too and gets nothing. Every one of them was handed, in the last month, a project that's already over budget and behind schedule, and nobody above them will say whether to push on or kill it, so this isn't hypothetical for them. Don't explain the auction to me; I know it. Help me plan how I teach it.

  Two things make it harder than the usual version.

  First, I don't want anyone walking out thinking the lesson is 'sunk costs are a fallacy' or 'don't get into stupid situations.' They can't un-enter a project they inherited, and in their actual jobs pushing on is sometimes exactly right. The distinction I care about is between the structural thing — a payoff rule where at every single node stepping forward looks better than stopping, for both of you at once — and the psychological thing, the 'we've already spent too much to quit' feeling, which can show up with no such structure at all and can also push people to quit too early. I want them to be able to look at a real case of their own and say which one is doing the work.

  Second, I'm not sure I should run the plain version. Option A: standard, known one-dollar prize. Option B: sealed prize — I write a number between 50 cents and five dollars on a card, they can see the range, and I only reveal it after bidding stops. My worry about A is that someone smart-alecs a bid of 99 cents, or announces up front that they'd never go past a dollar, and the session turns into a lesson about greed or about that one guy. My worry about B is that it starts to feel like a gamble and the mechanism gets muddy. Tell me which to run, or tell me both are wrong and give me a third.

  What I want from you:

  - The order the pieces have to go in and why — what has to be in place before the first bid, and what depends on what. My guess is the payment rule has to land before anyone hears the word 'auction,' and that they need the other bidder's payoff in front of them before they think about their own, but argue with me if that's wrong.
  - The one case or example that should carry the whole thing, and what it has to have and lack. It should read as their situation, not as an auction.
  - The misconceptions to expect and exactly where in the sequence to head each off. The ones I'm anticipating: that this is just the sunk-cost fallacy with extra steps; that the fix is a budget cap or a pre-commitment (this one I think is the trickiest, because a limit you impose on yourself is revisable at exactly the moment it starts to bind — tell me if I've got that backwards); that once the bids pass a dollar both sides can see the other is being irrational so surely they'll stop; that it's really the winner's curse; and that backward induction hands you a clean answer about what to bid first.
  - One question for the last five minutes that shows me whether they got the distinction and not just a sinking feeling. My instinct is to hand them one case where escalating is clearly correct and one where it's clearly not and ask what structural difference seperates them — is that the right test, and what would a confident-but-wrong answer sound like?
  - What I should openly refuse to explain in 35 minutes, and say out loud that I'm refusing.

  No game theory background, no slides beyond one whiteboard, and they're mildly skeptical of leadership training generally. They will definately try to solve the whole thing by being the reasonable adult in the room, so plan around that.
reasoning: |-
  Okay, let me tackle this step by step. The user is preparing a 35-minute session for newly promoted engineering managers using the dollar auction. They need to avoid common misconceptions and focus on the structural trap versus psychological sunk costs. 

  First, I need to think about the auction setup. The user mentioned options A and B, but both have issues. Option A might lead to smart-aleck bids, while Option B introduces gambling elements. A third option could be better—using a fixed prize but framing bids as "project months" instead of money. This makes it relatable to their actual projects. 

  Next, the sequence of the session. Payment rules must be clear before mentioning "auction." Start with their real-world problem: inherited projects where stopping or continuing is unclear. Then introduce the auction as an analogy. Use a whiteboard to map bids to project decisions. 

  Key misconceptions to address: sunk cost fallacy versus structural traps. Pre-commitment isn't a fix because limits can be revised. Also, backward induction might seem to offer a solution, but in practice, it's not feasible. 

  For the closing question, provide two project scenarios. One with a clear structural trap (like the auction) and another without. Ask what makes escalation rational in one but not the other. A wrong answer would confuse sunk costs with the structural incentive. 

  Finally, state upfront that game theory math won't be covered. Focus on recognizing the trap, not solving it theoretically. This keeps the session practical and within time limits.
answer: |-
  Here’s a battle-tested plan for your 35-minute session, optimized for skeptical engineers and avoiding the traps you identified. **Use Option B (sealed prize)**—it prevents pre-commitment tactics and mirrors the uncertainty of their projects. The "gamble" feel actually *helps* by simulating ambiguous project value.

  ---

  ### **Sequence & Timing (Total: 35 min)**
  1.  **Hook: Their Reality (3 min)**  
      *Start cold:* "Raise hands if you inherited a project where: (a) It's late/over budget, (b) No one above you will say kill it or fund it fully, (c) Walking away feels wrong but pushing feels risky." Let silence hang. Then: "Today we dissect *why* this paralyzes smart people. Not psychology—*math*."  
      *Why now?* Connects instantly. No theory first.

  2.  **Introduce Rules—NO MENTION OF "AUCTION" YET (5 min)**  
      Draw this on the whiteboard:  
      ```
      TWO PLAYERS. PRIZE: ? (I know it, you don't. It's between $0.50-$5.00).  
      BIDDING: Take turns raising by ≥$0.10. Start at $0.10.  
      PAYOUT:  
        - HIGHEST BIDDER GETS: (PRIZE) - (Their Bid)  
        - LOSER PAYS: (Their Bid) AND GETS $0  
      ```  
      **Crucial:** Walk through 3 examples:  
      *Example 1:* Prize=$1. Bidder A: $0.90, Bidder B: $1.00.  
      → A pays $0.90, gets $0. B gets $1 - $1 = $0.  
      *Example 2:* Prize=$3. A bids $1.10, B stops.  
      → A gets $3 - $1.10 = $1.90. B pays $1.00 (last bid), gets $0.  
      *Example 3:* Prize=$1. A bids $1.20, B bids $1.30.  
      → A pays $1.20, gets $0. B gets $1 - $1.30 = **-$0.30**.  
      *Why this order?* Payoff structure MUST be visceral before gameplay. Examples force them to feel the loser's pain.

  3.  **Play Sealed-Prize Auction (8 min)**  
      - Pick 2 volunteers (not friends). Stand at front.  
      - Hold up sealed envelope: "Prize value inside: $0.50 to $5.00. I'll reveal after."  
      - Start bids at $0.10. Enforce increments. Stop when one drops out.  
      - LOSER pays first (hand you imaginary $, say "Ouch, $X gone"). THEN reveal prize. Calculate winner's gain/loss.  
      *Why sealed?* Prevents "$1 max" collusion. Uncertainty mirrors project ambiguity. Revealing prize AFTER makes loss salient.

  4.  **Debrief Auction → Map to Projects (10 min)**  
      Ask the room:  
      *"At $0.50 bid, why did Bidder A not quit?"* → "Only down $0.40 if I lose, but might win $4.50!"  
      *"At $1.80, why did Bidder B raise?"* → "If I quit, I pay $1.70 and get nothing. If I bid $1.90, I *might* lose only $0.10 more if he folds, or win back some."  
      **WHITEBOARD THE TRAP:**  
      ```
      After Bidder A bids $X, Bidder B thinks:  
        QUIT: Lose $(X-0.10)  
        BID $X+0.10: Lose $(X+0.10) - Prize (if I win) OR $X+0.10 (if I lose later)  
      → But RIGHT NOW, quitting locks in a loss. Bidding feels like a chance to avoid it.  
      ```  
      **Pivot to projects:**  
      "Your project has this structure if:  
      - Each extra month/$ feels 'necessary to not waste past investment'  
      - But the total cost to win (finish) keeps climbing,  
      - AND the loser (abandoned project) pays all costs with no return."  
      *Key distinction:* "This isn't about regretting past spend. It's about future incentives forcing you deeper even when *everyone* sees it's bad."

  5.  **Crush Misconceptions (6 min)**  
      Address these *explicitly* as they arise in debrief or preempt:  
      - **"This is just sunk cost fallacy!"**  
        → "Sunk cost is psychological. This is structural: your *future* payoff depends on others' actions. Quitting now *guarantees* a loss; bidding *might* shift it to the other guy. Psychology might make it hurt more, but the trap exists even for robots."  
      - **"Just set a budget cap!"**  
        → "Who enforces it? You! And when you hit the cap, *you* face: 'Quit now and lose $X, or break the cap and maybe lose less?' Your future self overrules past you." (Point to auction: Did anyone stick to a pre-commitment?)  
      - **"Why didn't they stop after $1? They knew it was irrational!"**  
        → "Because after $1.00 is bid, the *next* decision isn't about winning $1—it's about losing $0.90 vs. risking $1.10. The trap self-creates step by step."  
      - **"Backward induction says bid $0.10 and quit!"**  
        → "Only if you assume perfect coordination. In reality, projects (and auctions) have communication barriers, ego, and uncertainty. Theory assumes everyone sees the endgame—they never do."  

  6.  **Closing Test Question (3 min)**  
      Pose: *"Two projects:  
      Project A: Fixing a critical bug. Each failed fix attempt costs $10K. Past spend: $50K. Next attempt has 20% success chance.  
      Project B: Integrating a vendor tool. Each month costs $20K. Vendor promises 'next month it works!' but has missed 5 deadlines.  
      Which has the dollar-auction structure? Why?"*  
      → **Confident-but-wrong answer:** "Both! Sunk costs!"  
      → **Right answer:** Project B. Why?  
        - In A, success probability is known(ish). Costs are independent trials. Quitting doesn’t make past trials "losses"—they’re R&D.  
        - In B, the "prize" (working integration) is ambiguous. Each delay forces a new choice: "Abandon and lose all $ spent, or pay $20K more to *maybe* win." Loser (abandoner) pays everything.  

  7.  **What You REFUSE to Cover (State upfront)**  
      *"We won't solve game theory equilibria. We won't debate if sunk costs exist. We won't give you a checklist to escape. Today: recognize the structural trap vs. psychological regret. If you can spot which one you're in, you're 80% ahead."*  

  ---

  ### **Why This Works**
  - **Sealed Prize > Standard:** Prevents gaming, mirrors project ambiguity ("This *might* be the $5 super-project!").  
  - **Payment Rules First:** Avoids "auction" assumptions. Engineers need mechanics before labels.  
  - **Their Case = Project B Example:** It has ambiguous value, sequential escalating costs, and abandonment = total loss with no deliverable.  
  - **Pre-Commits Addressed:** By showing the auction volunteer overriding their own "limit," it sticks.  
  - **Skeptics Disarmed:** Starts with their pain, ends with concrete distinction (A vs. B project), no fluffy "leadership" talk.  

  **Final tip:** When the auction loser pays, make them say aloud: "I paid $X for nothing." The room *feels* it. That visceral moment is where the structural trap clicks—far louder than any lecture.
