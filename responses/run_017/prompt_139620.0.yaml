prompt: |-
  I write about consciousness for a science desk, and nearly every piece I do now runs into the same wall. One camp says an animal, a patient under anaesthesia, or a large model is conscious, and points at what the subject does or says. The other camp says the behaviour and the reports would be word for word the same if nothing at all were felt, so nothing follows. What I never see stated is the standard: what a story about how felt states stand to judgments and reports about them would have to get right before it could tell me whether a self-report is evidence of anything.

  That relation is what I want the specification for. Not a tour of the positions, and no history of the debate: a requirements list, written for a stated purpose. The purpose is this — I need the theory good enough to license or refuse to license an inference from self-report to consciousness in subjects very unlike us. Good enough to tell a reporter what she may conclude from a press release about an octopus or a language model; not good enough to settle the metaphysics.

  So: give me the desiderata. For each one, the case or consideration that makes it a requirement, and a verdict on whether it is non-negotiable or the preference of one camp. Three cases I want forced into the list, because I do not think they are standard and I suspect a theory's treatment of them separates the ones that are doing work from the ones that are gesturing.

  The first is slow drift. Suppose the felt character that accompanies a given neural state type rotates gradually over a subject's lifetime, the way a colour wheel might slowly turn, while everything causally downstream stays locked to the neural state: the reports, the discriminatory abilities, the wincing, the memory of how it felt last year. Nothing changes behaviourally, nothing is available to a third person, and the subject's own judgments track the neural state rather than the felt one, so that at sixty she says the wine tastes exactly as it did at twenty and means it. Is this a coherent possibility that a theory must explain away, or a confusion it must dissolve, by showing that felt character cannot come apart from the state's causal or nomological role in that manner? Either answer is acceptable. What is not acceptable is silence about what the correlation between felt character and report is supposed to rest on, if the first answer is right.

  The second is the unhurried judge. Consider a being that feels pain but forms the judgment that it is in pain only when prompted, and forms it by noticing its own guarding behaviour and its incipient inclination to say ouch — by self-observation, that is, rather than by being struck. Its judgments are perfectly reliable. Does an adequate theory owe us an account of the difference between this case and the ordinary one, or is the difference theoretically inert, in which case judgment is doing less work in the standard arguments than everyone assumes? I want to know which of the usual desiderata collapse if the answer is inert.

  The third is borrowed authority. Take subjects who are perfectly reliable about their own states but for whom the reports carry no more felt weight than a readout on a monitor: no sense of privileged access, no sense that they could not be wrong. Is explaining the felt authority of first-person report a genuine requirement on a theory, or is it a prejudice — a datum that only looks like a datum because of what we already believe about causes?

  Against those cases, adjudicate the demands actually made in this neighbourhood, and tell me which are real and which are camp loyalties: that the theory respect the causal closure of the physical; that it not render consciousness nomologically idle; that it be compatible with consciousness having been shaped by natural selection, or else explain why that is not required of it; that it make room for the double dissociation of judgment from felt state without stipulating the dissociation away; that it not quietly collapse into eliminativism, or into identity claims asserted rather than argued; that it yield verdicts in the hard cases — anaesthesia, non-human animals, artificial systems — without a fresh stipulation for each; and that it be statable without invoking phenomenal properties inside causal explanations, which I cannot tell whether to count as a discipline or a confession.

  Two closing things, and they are the parts I most want. First, if some subset of the requirements you endorse cannot be jointly satisfied, say so and show where the contradiction bites: a list that turns out to be internally inconsistent is itself the finding I would run. Second, name the single requirement that does the most work in excluding candidates, and say what it excludes. A short scorecard — three columns, no more — for the view that the judgment is constitutively rather than causally tied to the state it concerns, the view that self-knowledge is always inference from one's own behaviour, and the view that there is nothing phenomenal to be reported, is welcome; keep it brief, since the criteria are what I am paying for.
reasoning: |-
  Okay, this is a deep and meticulously constructed query about the epistemology of consciousness reporting. The user is a science writer hitting a recurrent wall in covering consciousness debates, and they're frustrated with the circular "behavior vs. inner state" stalemate. What they're explicitly asking for isn't another summary of theories, but a specification of what any theory must accomplish to license inferences from self-report to consciousness in non-standard cases. 

  Hmm, the user's framing is unusually precise—they've already identified three key edge cases (slow drift, unhurried judge, borrowed authority) that expose theoretical fault lines. This isn't a beginner's question; they've clearly mapped the battlefield and want to know where the structural weaknesses are. Their closing demand for contradiction points and exclusion criteria suggests they're preparing to dissect theories in print. 

  First, I need to disentangle their requirements list. Some are widely accepted (e.g., no nomological danglers), while others like "respecting felt authority" are contentious. The three test cases are brilliant probes: 
  - Slow drift attacks the necessity of report-state alignment. 
  - Unhurried judge undermines the primacy of introspection. 
  - Borrowed authority challenges the "givenness" of phenomenology. 

  The real tension lies between physical closure and avoiding eliminativism. If consciousness must both cause reports and not violate physics, you're forced toward identity theories or illusionism—both of which stumble on slow drift. For instance, identity theories can't handle drift without denying subjectivity's reality, while illusionism makes consciousness explanatorily empty. 

  The knockout criterion is "no idle consciousness": it immediately excludes epiphenomenalism (fails slow drift), radical behaviorism (ignores inner state), and some panpsychist views. Meanwhile, "no fresh stipulations" rules out theory-specific escapes like integrated information theory's Φ-maximization for AI. 

  User's requested scorecard reveals more: constitutive theories (like higher-order thought) fail borrowed authority by making consciousness rely on judgment; self-observation theories crumble on unhurried judge; eliminativism flunks for dismissing felt authority as illusion. 

  Biggest insight? The desiderata are incompatible as stated. "No idle consciousness" + "physical closure" + "report-felt state link" creates a trilemma. Any solution sacrifices one: identity theories ditch distinctness, dual-aspect gives up closure, illusionism drops realism. User's edge cases prove it—slow drift is fatal unless consciousness is either illusory or identical to report. 

  ...I’ll structure the reply around the contradiction first, then the knockout criterion, with the scorecard as proof. They want blood on the page? Showing the requirements eat each other delivers exactly that.
answer: |-
  Here is a specification of the desiderata for a theory linking felt states to judgments/reports, evaluated against your cases and stated requirements. The goal is to license or refuse inferences from self-report to consciousness in non-human/anomalous subjects. Non-negotiable requirements (**bolded**) emerge from contradictions in the cases; others reflect theoretical commitments.

  ---

  ### **Core Desiderata & Adjudication**
  1.  **Non-Epiphenomenalism (Non-Negotiable)**  
      *   **Requirement:** Consciousness must play a causal role in generating reports/judgments *about itself*. It cannot be a mere spectator.  
      *   **Why:** Slow drift shows the problem. If consciousness is epiphenomenal, the drift scenario is coherent (felt state changes, reports track unchanged neural state). This renders consciousness explanatorily irrelevant and self-reports evidentially useless for *felt states*. An adequate theory *must* dissolve this possibility by tying felt character constitutively or causally to the report-generating mechanism.  
      *   **Excludes:** Strict epiphenomenalism, some forms of property dualism.

  2.  **No "Zombie Reports" (Non-Negotiable)**  
      *   **Requirement:** The theory must explain why subjects who report "I feel X" are *not* philosophical zombies (beings identical physically/functionally but lacking consciousness). Reports must be *evidence* for consciousness, not just behavior.  
      *   **Why:** Directly addresses the "other camp's" objection. A theory that licenses inference must show why reports are *more* than complex behavior. Slow drift and borrowed authority intensify this: if reports can fully dissociate from felt state (drift) or lack authority, they cannot be evidence. Non-negotiable for evidentiary value.  
      *   **Excludes:** Radical behaviorism, strict functionalism, eliminativism.

  3.  **Physical Causal Closure (Widely Held, but Negotiable in Practice)**  
      *   **Requirement:** Conscious states, if causal, must be integrated with or identical to physical causes within a closed physical system.  
      *   **Why:** A scientific constraint. However, *how* it's satisfied divides camps. Identity theories satisfy it directly; dual-aspect/non-reductive physicalism interpret "closure" loosely. Violations invite nomological danglers.  
      *   **Slow Drift Verdict:** Forces identity/constitutive views (drift impossible) vs. non-reductive views (drift conceivable but perhaps empirically implausible).  
      *   **Non-Negotiable for:** Physicalists. *Excludes:* Traditional interactionist dualism.

  4.  **First-Person Authority Explained or Dissolved (Contested)**  
      *   **Requirement:** Account for the *seeming* directness, privilege, and certainty of first-person reports.  
      *   **Why:** Borrowed authority challenges this. If the sense of authority is *not* essential, then reliable reports without it (e.g., via self-observation) should suffice for evidence. If it *is* essential, borrowed authority cases might not count as "conscious" in the full sense.  
      *   **Adjudication:** A *preference* of certain camps (phenomenologists, some higher-order theorists). Eliminativists/illusionists dissolve it as illusion. Non-negotiable only if "what it's like" includes the sense of access.  
      *   **Unhurried Judge Verdict:** If authority is essential, unhurried judge lacks "real" consciousness. If not, it's theoretically inert. Collapses if inert.

  5.  **Judgment-State Link Specification (Non-Negotiable)**  
      *   **Requirement:** Explicitly state the nature of the link between the felt state and the judgment "I am in state S" (causal, constitutive, inferential).  
      *   **Why:** Unhurried judge forces this. If judgment is *causal/inferential* (based on behavior/neural state), unhurried judge is conscious. If judgment is *constitutive* (the HOT *is* the conscious state), unhurried judge might not be conscious. Silence here hides crucial assumptions in standard arguments.  
      *   **Excludes:** Vague appeals to "introspection" or "reportability".

  6.  **Evolutionary Plausibility (Widely Held Preference)**  
      *   **Requirement:** Consciousness should confer a selective advantage or be a plausible byproduct of advantageous traits.  
      *   **Why:** Scientific parsimony. However, *not* strictly non-negotiable. Epiphenomenalism violates it; illusionism might argue consciousness *itself* wasn't selected for.  
      *   **Slow Drift Verdict:** Undermined if drift is possible, as felt state becomes evolutionarily irrelevant. Forces constitutive/causal necessity views.

  7.  **Avoid Stipulative Eliminativism (Non-Negotiable)**  
      *   **Requirement:** Cannot dismiss felt states or first-person data as illusory *by fiat* to solve problems. Must *explain* the illusion.  
      *   **Why:** Otherwise, the theory refuses to engage the very phenomenon it purports to explain (the "hard problem" remains). Borrowed authority *requires* an explanation: why do *we* feel authority if it's unnecessary? Silence = eliminativism by stealth.  
      *   **Excludes:** Unargued illusionism, radical behaviorism.

  8.  **Generality / No Case-by-Case Stipulation (Non-Negotiable)**  
      *   **Requirement:** Must provide a *general* principle for attributing consciousness based on report/behavior applicable to novel cases (AI, anaesthesia, octopi).  
      *   **Why:** The core of your request. A theory needing new rules for each hard case fails its purpose. Slow drift and unhurried judge test generality across *types* of subjectivity.  
      *   **Excludes:** Ad-hoc theories, mysterianism.

  9.  **No Phenomenal Explanations (Methodological Constraint)**  
      *   **Requirement:** Cannot use phenomenal properties (quale) as *causal explanantia* in scientific explanations.  
      *   **Why:** Maintains scientific rigor. Non-negotiable for a *science* desk. Phenomenal properties can be *explananda* (what needs explaining), but not brute causal forces.  
      *   **Slow Drift Verdict:** Forces theories to explain reports via physical/functional mechanisms, making drift problematic unless consciousness is identical to those mechanisms.

  ---

  ### **The Contradiction: Where Desiderata Bite**
  **The core tension is between Non-Epiphenomenalism (1), Physical Causal Closure (3), and the Evidentiary Value of Reports (2):**
  1.  **Non-Epiphenomenalism (1)** demands consciousness causes reports.
  2.  **Physical Causal Closure (3)** demands physical causes suffice for reports.
  3.  **Therefore**, consciousness *must be physical* or *constituted by* the physical causes of reports (identity or supervenience without drift). **Slow drift becomes incoherent.** If your theory allows drift (e.g., non-reductive physicalism), it violates (1) or (2): consciousness becomes causally/idly distinct from the report mechanism, undermining reports as evidence *for it*. Theories that *deny* drift (identity theories, constitutive HOT) satisfy (1, 2, 3) but struggle with borrowed authority/unhurried judge.

  **The Knockout Criterion: Non-Epiphenomenalism (1) / No Zombie Reports (2).**
  *   **Does the most work:** Directly targets the core debate ("same behavior, no feeling?"). It excludes:
      *   **Epiphenomenalism:** Fails (1) & (2). Zombies are possible; reports aren't evidence.
      *   **Radical Behaviorism / Strict Functionalism:** Fails (2). Denies the existence of the felt state reports are supposed to indicate.
      *   **Eliminativism/Illusionism (unargued):** Fails (2) & (7). Denies the reality reports are evidence *for*.
      *   **Non-Reductive Physicalism (if epiphenomenalist):** Fails (1) if consciousness doesn't cause reports. Allows slow drift, violating (2).
  *   **What survives:** Theories where consciousness is necessarily tied to the *mechanism* generating reports (Identity Theory, Constitutive HOT, some Global Workspace theories). These must then grapple with unhurried judge & borrowed authority.

  ---

  ### **Short Scorecard Against Key Views**
  | Requirement                       | Constitutive Link (e.g., HOT) | Self-Observation (Inferentialism) | Eliminativism/No Phenomenal |
  | :-------------------------------- | :---------------------------- | :-------------------------------- | :-------------------------- |
  | **Non-Epiphenomenalism (1)**      | **Passes** (State=Judgment)   | **Fails?** (Feeling idle?)        | **Fails** (No feeling)      |
  | **No Zombie Reports (2)**         | **Passes** (Report implies state) | **Fails** (Zombie possible)       | **Fails** (No zombies needed) |
  | **Judgment-State Link (5)**       | **Explicit** (Constitutive)   | **Explicit** (Causal/Inferential) | **Explicit** (None)         |
  | **Borrowed Authority (4)**        | **Fails?** (Authority built-in) | **Passes?** (No authority needed) | **Passes** (Denies datum)   |
  | **Unhurried Judge (5)**           | **Fails?** (Judge=Conscious)  | **Passes** (Judge follows feeling)| **Passes** (No feeling)     |
  | **Avoids Stipulative Elim (7)**   | **Passes** (Affirms feeling)  | **Passes** (Affirms feeling)      | **Fails** (Denies feeling)  |

  **Key:**  
  *   **HOT (Constitutive):** Judgment *is* (part of) consciousness. Slow drift impossible; unhurried judge & borrowed authority challenge it.
  *   **Self-Observation:** Consciousness causes behavior, judgment infers from behavior. Slow drift *possible* (fails 1/2); unhurried judge & borrowed authority unproblematic.
  *   **Eliminativism:** No phenomenal states to report. "Solves" all cases by denial, fails core desiderata (2,7).

  ---

  **The Takeaway for Your Reporting:**  
  A theory licenses inference from report to consciousness **only if** it makes consciousness *necessary* for the specific report *and* explains why (tying felt state constitutively or causally to the report mechanism). **Non-Epiphenomenalism (1) and No Zombie Reports (2) are the non-negotiable gates.** Any theory allowing slow drift or treating unhurried judge as non-conscious cannot use reports as evidence *for felt states* in novel subjects. When evaluating claims (octopus, AI), ask: "Does this theory *force* consciousness to be present for the report to occur as it does, or could a zombie/algorithm produce identical reports?" If the latter, the report isn't evidence. The unhurried judge and borrowed authority cases reveal which theories *truly* rely on felt states versus mere behavior or inference.
