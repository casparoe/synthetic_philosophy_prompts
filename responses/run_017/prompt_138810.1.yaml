answer: |-
  ### Minutes of the 27th Meeting of the Non-Eempirical Assessment Panel (NEAP)
  **Held:** 17 May 2024, 14:00-16:30 GMT (Virtual)
  **Chair:** Dr. A. Finch (Institute for Theoretical Integration, Zurich)
  **Attendees:** Prof. B. Vance (Meta-Empirical Studies Unit, Kyoto), Dr. C. Sharma (Conceptual Compliance Directorate, MIT), Dr. D. Petrova (Ontological Stability Group, Sofia), Prof. E. Dubois (Symmetry Prioritisation Hub, Lyon)
  **Apologies:** Prof. F. Al-Hassan (Unification Ethics Board, Riyadh – Conflict with ISSP Plenary)
  **Minutes Taker:** Secretariat (G. Wright)

  **1. Welcome, Declarations & Minutes of 26th Meeting**
  The Chair welcomed members. No declarations of interest. Minutes of Meeting 26 (10 Apr 2024) approved as an accurate record (Moved: Dr. Petrova, Seconded: Prof. Vance, Carried Unanimously).

  **2. Agenda Item 7.1: Spurious Alternative Filing (Ref: SA-245/ThryX)**
  *   **Background:** Secretariat presented dossier SA-245 concerning Theory X ("Grand Unified Structure V4.3"). Theory X currently holds a high Provisional Confidence Index (PCI) of 0.872, significantly bolstered by its No-Alternatives (NA) sub-score of 0.95. The dossier comprised a formal notification from the "Horizon Alternatives Consultancy" (HAC), commissioned by an undisclosed third party, presenting "Theory Y" as a formally consistent alternative. HAC's accompanying statement explicitly noted the commission was undertaken "without belief in its physical viability" and aimed to "demonstrate the existence of alternatives". Theory Y posits fundamental constants varying chaotically at Planck scales and incorporates 17 uncompactified dimensions without dynamical stabilisation. Dr. Sharma noted HAC’s report highlighted "significant aesthetic deficiencies" and "uncontrolled divergences rendering predictive capacity null".
  *   **Discussion:** Dr. Petrova questioned if a theory constructed without belief and admitting non-predictiveness constituted a genuine alternative within the NA framework. Prof. Vance countered that the NA criterion centres on *existence* of consistent rivals, not their palatability or predictive utility; the sub-score quantifies failure *to find*, and Theory Y demonstrably exists. Dr. Sharma raised the distinction between a fully articulated formalism (Y) and a viable research programme, suggesting Y offered no programme. The Chair noted the Panel’s remit is to assess the *fact* of sustained search failure; HAC’s search, while motivated adversarially, was conducted by competent practitioners and yielded a formally consistent structure. Prof. Dubois observed that rejecting Y solely due to origin or aesthetics risked introducing subjective bias into the NA metric.
  *   **Decision:** **MOTION:** *"To accept Horizon Alternatives Consultancy filing SA-245/ThryX (Theory Y) as constituting a valid alternative for the purposes of Theory X's No-Alternatives sub-score assessment, triggering an automatic review and likely reduction of said sub-score."* (Moved: Prof. Vance, Seconded: Prof. Dubois). **CARRIED** (3 For: Vance, Dubois, Finch; 2 Against: Petrova, Sharma).
  *   **Action:** Secretariat to initiate NA sub-score review for Theory X (Owner: Secretariat, Deadline: 31 May 2024).

  **3. Agenda Item 7.2: Meta-Inductive Reference Class Dispute (Ref: MI-88/ThryA vs MI-89/ThryB)**
  *   **Background:** Dr. Sharma presented competing applications for Meta-Inductive (MI) sub-score uplift. Theory A (PCI 0.723) submitted Reference Class Alpha: {General Relativity (pre-1919 eclipse), Quantum Electrodynamics (pre-Lamb Shift), Electroweak Theory (pre-LEP)} – all theories lacking alternatives pre-vindication. Theory B (PCI 0.721) submitted Reference Class Beta: {Aristotelian Physics (unfalsifiable pre-Galileo), Luminiferous Aether (unfalsifiable pre-Michelson-Morley), Steady-State Cosmology (unfalsifiable pre-CMB)} – all theories lacking alternatives pre-abandonment. Both claimed structural parallels justifying their chosen class. Current MI scoring requires applicant-proposed reference classes subject to Panel uplift discretion (0-0.15 points).
  *   **Discussion:** Prof. Dubois noted both classes were historically accurate but yielded diametrically opposed meta-inductions: Alpha suggested vindication likely, Beta suggested abandonment likely. Dr. Petrova questioned the objective basis for choosing one class over the other, given both theories occupied a similar evidential vacuum. Prof. Vance argued Class Alpha was more relevant as it comprised *fundamental* theories, whereas Class Beta included obsolete frameworks. Dr. Sharma countered that the meta-induction's validity hinges on the class definition itself, and no neutral criterion existed. The Chair emphasised the procedural nature of the uplift: applicants propose, the Panel assesses relevance/appropriateness based on stated guidelines (Section 4.2.3b: "Degree of structural similarity and comparable evidential context").
  *   **Decision:** **MOTION:** *"To grant Theory A a Meta-Inductive uplift of +0.10 based on the perceived greater relevance of Reference Class Alpha to fundamental unification attempts. To grant Theory B a Meta-Inductive uplift of +0.05 based on the historical validity but lesser perceived structural relevance of Reference Class Beta."* (Moved: The Chair, Seconded: Dr. Petrova). **CARRIED** (Unanimous). *Note:* Resultant PCI: Theory A 0.823, Theory B 0.771.
  *   **Action:** None beyond minute record.

  **4. Agenda Item 7.3: Typicality Compliance - Multiverse Submission (Ref: TCO-12/ThryZ)**
  *   **Background:** Dr. Sharma (for the Typicality Compliance Office - TCO) reported on Theory Z ("Eternal Inflaton Landscape"). Theory Z necessitates a measure to define the fraction of observers in its multiverse matching "our data context" (e.g., stable spacetime, cosmological parameters). The applicant proposed Measure Gamma. TCO analysis confirmed Measure Gamma is mathematically admissible within Theory Z but is not uniquely determined by it. Crucially, TCO flagged that under Measure Gamma, >99.99% of observers matching our data context are "Boltzmann Brains" (BBs) – momentary thermal fluctuations. The concern: BB observations are random, meaning most observers *like us* within the theory would *not* see the ordered universe we do. Crucially, the TCO report noted that under Measure Gamma, observers in our data context systematically observing the theory’s predicted large-scale structure would be atypical; the majority would observe chaos incompatible with the theory’s claimed success. The report framed this as a "typicality compliance failure": the theory cannot self-consistently predict our observations under its own proposed measure.
  *   **Discussion:** Prof. Vance queried if this was a fundamental flaw or just an "unfortunate measure choice". Dr. Sharma clarified that while other measures existed, Theory Z *as submitted with Measure Gamma* failed typicality compliance per Annex TCO-7, as it predicts most observers like us *would not* see evidence confirming it. Prof. Dubois asked if the theory could be penalised for the measure choice alone. The Chair ruled that the PCI assessment is for the specific submitted package (Theory Z + Measure Gamma).
  *   **Decision:** **MOTION:** *"To accept the TCO-12/ThryZ report finding that Theory Z + Measure Gamma fails Typicality Compliance under Annex TCO-7. To suspend the Unexpected Coherence (UC) sub-score for Theory Z pending resubmission with a compliant measure or theoretical justification resolving the typicality violation."* (Moved: Dr. Sharma, Seconded: Dr. Petrova). **CARRIED** (Unanimous). *Note:* UC sub-score suspension reduces current PCI from 0.798 to 0.651.
  *   **Action:** Secretariat to notify Theory Z proponents of suspension and compliance requirements (Owner: Secretariat, Deadline: 24 May 2024).

  **5. Agenda Item 8.1: Publicity Incident - "Supported by Evidence" Claim (Ref: PUB-03/ThryX)**
  *   **Background:** Prof. Dubois raised an alert regarding a press release (14 May 2024) from the Institute for Fundamental Structures (IFS), home to Theory X proponents, stating: "Theory X is now supported by all available evidence." Secretariat confirmed Theory X’s PCI (0.872 pre-SA-245 review) is high, but solely based on non-empirical criteria (NA, MI, UC); it makes no novel testable predictions.
  *   **Discussion:** Dr. Petrova argued the statement was materially misleading, conflating consistency with available evidence (which Theory X achieves) with empirical confirmation (which it lacks). Prof. Vance contended that within the remit of fundamental physics funding, "all available evidence" implicitly includes non-empirical assessments like PCI, and the statement was reasonable shorthand for a lay audience. Dr. Sharma expressed concern that such phrasing blurred the crucial epistemic distinction NEAP exists to manage, potentially undermining public understanding of scientific justification. Prof. Dubois noted the reputational risk to NEAP if high-PCI theories were publicly presented as empirically confirmed. The Chair acknowledged the tension between scientific precision and public communication, noting NEAP lacks direct authority over institutional PR.
  *   **Decision:** Discussion failed to reach consensus on whether to formally object to IFS. **MOTION DEFERRED.**
  *   **Action:** *Dr. Petrova and Dr. Sharma to draft guidance for funded institutes on accurately communicating the status of theories assessed primarily via non-empirical criteria, distinguishing 'consistency with' from 'confirmed by' evidence, for Panel review.* (Owner: Petrova/Sharma, Deadline: 14 June 2024).

  **6. Any Other Business**
  *   Prof. Vance noted increased consultancy activity around NA sub-scores. The Chair suggested monitoring for Agenda Item 7.1 patterns.
  *   Dr. Sharma requested Panel review of TCO Annex TCO-7 wording re: Boltzmann Brains. Added to Agenda Item 9.1 (Next Meeting).

  **7. Date of Next Meeting**
  14 June 2024, 14:00 GMT (Virtual).

  **Meeting Closed:** 16:28 GMT.

  ---
  ### Where this takes liberties

  **Genuine Commitments vs. Satirical Exaggeration:**

  1.  **No Alternatives (NA):** The core commitment – that sustained, expert failure to find alternatives *can* provide epistemic warrant – is genuine (e.g., Dawid, Smolin). The satire exaggerates the *operationalisation*: turning it into a quantifiable, adversarially manipulatable *score* vulnerable to bad-faith spoilers reflects critics' concerns (e.g., van Fraassen) about institutionalizing an inherently defeasible heuristic. The Panel's focus on the *fact* of the search result, not the searcher's intent or the alternative's viability, pushes a genuine ambiguity to a procedural extreme.
  2.  **Meta-Induction (MI):** The idea that past theories exhibiting certain traits (like lacking alternatives and later being vindicated) can bolster confidence in current theories with those traits is a genuine argument (Dawid's "meta-empirical" assessment). The satire exaggerates the *reference class problem*. While defenders acknowledge it requires careful case selection, the minutes depict it as fundamentally ungrounded, resolvable only by arbitrary discretionary uplift, transforming a reasoned historical analogy into a bureaucratic game of class gerrymandering.
  3.  **Unexpected Coherence (UC):** The value placed on deep, unforeseen internal consistency or surprising interconnections is a strong and genuine motivator in theory development and assessment (e.g., Einstein on GR's logical simplicity, Dirac on the positron). The satire exaggerates by linking it directly to the *Boltzmann Brain problem* via a compliance framework. While BBs are a recognized internal consistency challenge for certain multiverse theories (a genuine *contested* issue), framing it as a "Typicality Compliance" failure requiring a specific "measure submission" bureaucratises a profound conceptual problem about self-location and prediction in vast ensembles.

  **Settled vs. Contested:**

  *   **Settled:** There is broad agreement that fundamental physics faces domains where empirical testing is currently or potentially permanently impossible. It is also widely accepted that scientists *do* and arguably *must* use non-empirical criteria (beauty, consistency, lack of alternatives, coherence) to guide theory development and prioritisation in such domains. The *descriptive* reality of non-empirical assessment is uncontested.
  *   **Contested (Vigorously):** The core contestation is whether these non-empirical criteria carry genuine *confirmatory weight* – do they provide *reasons to believe* a theory is (likely) true, or are they merely pragmatic guides for research? Defenders (Dawid, Ellis, Silk) argue they constitute distinct "lines of non-empirical support" that can, especially in combination, significantly raise a theory's epistemic standing beyond mere consistency. Critics (e.g., van Fraassen, parts of the philosophy of science community influenced by strict empiricism/falsificationism) argue they carry no confirmatory weight whatsoever; they might make a theory attractive or fruitful, but not more likely to be true. This is the central fault line.
      *   *Specific Contested Points within Defence:*
          *   **No Alternatives:** Is the failure genuinely due to the absence of alternatives (suggesting the theory is unique/compelling) or merely contingent on current ingenuity/resources (as the spoiler filing exploits)? Defenders argue persistent failure by the community *is* significant evidence. Critics see it as an argument from ignorance.
          *   **Meta-Induction:** How robust is the reference class? How similar must past cases be? Is the induction itself reliable? Defenders argue careful case selection mitigates this. Critics see it as inherently selective and question the inference.
          *   **Unexpected Coherence:** How strongly does coherence correlate with truth? It often does (cited examples: GR, Dirac equation), but not always (e.g., overly flexible theories can be coherently wrong). Defenders see it as a powerful signal; critics as unreliable.
          *   **Overall Weight:** Even among defenders, the *degree* of confidence warranted by non-empirical assessment, and how to balance the different criteria, is contested.

  **Strongest Defence:** The strongest argument for non-empirical assessment, in my view, lies in **Unexpected Coherence**. When a theory, built to solve specific problems, unexpectedly generates deep, precise connections or solves problems it wasn't designed for (e.g., GR predicting light bending, QED's renormalisation yielding astonishingly accurate predictions), this often feels like uncovering a truth deeper than the theorist's initial conception. It suggests the theory is latching onto something fundamental in a way a purely constructed or flexible theory would not. While not logically watertight confirmation, it provides a compelling form of abductive reasoning – the best explanation for such profound coherence *is* that the theory captures reality. This resonates with the historical record where such coherence has frequently preceded empirical vindication. However, its strength is context-dependent and doesn't negate the challenges of operationalisation satirised above.
