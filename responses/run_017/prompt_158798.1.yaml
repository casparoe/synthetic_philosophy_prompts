answer: |-
  ### Marking Scheme  
  *Derived strictly from question requirements; full marks require all listed elements without material error.*  

  **3(a) [8 marks]**  
  - **State levelling-down objection (LDO) [2]**: Must define as: Improvement claimed from redistribution making some worse off, no one better off (absolute well-being).  
  - **Explain prioritarianism's escape [3]**: Must: (i) Prioritarianism has no intrinsic equality value; (ii) Weights always positive; (iii) Thus, any decrease in individual well-being reduces total V (respects Pareto).  
  - **Explain egalitarianism's vulnerability [3]**: Must: (i) Egalitarianism values equality intrinsically; (ii) Thus, increased equality can offset decreased well-being; (iii) Hence, LDO applies.  

  **3(b)(i) [4 marks]**  
  - Correct V(X), V(Y), V(Z) [1 each] + [1] for working/accuracy. Must show mean, deviations, v(r), and V computation. Rounding acceptable only if error <±0.1.  

  **3(b)(ii) [8 marks]**  
  - **State what computation shows re: LDO [2]**: Must note V(Y)>V(X) resembles LDO but correctly identify whether it is/is not LDO.  
  - **Transfer of (a) argument [3]**: Must: (i) Check if RP has positive weights (yes); (ii) Note if Pareto holds (it does not); (iii) Explain why (a)'s reasoning does/does not apply.  
  - **Core evaluation [3]**: Must: (i) Recognize RP violates Pareto (V(Y)>V(X) while B worse off, A unchanged absolutely); (ii) Explain why this is/is not LDO; (iii) Address whether RP values equality intrinsically.  

  ---  
  ### Arithmetic Verification (using *v(r) = 1 - r/60*)  
  - **V(X)**: Mean=50. A: dev=-50, v=1-(-50)/60=1+50/60=11/6≈1.8333. B: dev=50, v=1-50/60=1/6≈0.1667.  
    V= (1.8333×0) + (0.1667×100) = 16.67 → **Correct**.  
  - **V(Y)**: Mean=30. A: dev=-30, v=1-(-30)/60=1.5. B: dev=30, v=1-30/60=0.5.  
    V= (1.5×0) + (0.5×60) = 30 → **Correct**.  
  - **V(Z)**: Mean=(-2+60)/2=29. A: dev=-2-29=-31, v=1-(-31)/60=1+31/60=91/60≈1.5167. B: dev=60-29=31, v=1-31/60=29/60≈0.4833.  
    V= (1.5167×(-2)) + (0.4833×60) = -3.0334 + 28.998 = 25.9646.  
    Candidate: 25.76 (rounded) vs. exact 25.97 (claimed unrounded). **Incorrect**: Actual unrounded=25.96, but candidate miscalculated as 25.76 (using v(-31)=1.52: 1.52×-2=-3.04; error from 1.5167×-2≈-3.033). Rounding unacceptable (error >0.2).  

  ---  
  ### Mark Breakdown (Total: 13/20)  
  - **3(a): 7/8**  
    Justification: LDO stated perfectly; prioritarianism’s escape explained (weights positive, no intrinsic equality); egalitarianism’s vulnerability clear. Misses explicit link to Pareto in prioritarianism (implied but not stated).  
  - **3(b)(i): 2/4**  
    Justification: V(X) and V(Y) correct (2 marks). V(Z) incorrect (arithmetic error). No working shown for Z.  
  - **3(b)(ii): 4/8**  
    Justification: Correctly notes not LDO due to relative improvement [1], recognizes positive weights [1], explains RP lacks intrinsic equality value [1], Z<Y point valid [1]. Fails: Ignores Pareto violation in X→Y, misattributes A’s "improvement", and doesn’t address why (a)’s argument fails to transfer re Pareto.  

  ---  
  ### Inline Comments (Keyed to Script)  
  > **"A is no longer 100 units below the best-off person but only 60 below, and [...] A's situation has genuinely improved."**  
  > **Defensible but needs qualification**. Relative improvement affects *weighting*, not absolute well-being. A’s absolute well-being is unchanged (0 in X and Y). "Improvement" is RP’s evaluative artifact, not objective gain.  

  > **"The argument I gave in (a) did not depend on any assumption about where weights come from; it depended only on [...] positive weight"**  
  > **Correct and creditworthy**. Core prioritarian logic (positive weights → no LDO) transfers superficially.  

  > **"RP assigns no [intrinsic] value to equality"**  
  > **Correct and creditworthy**. RP weights deviations, making it prioritarian, not egalitarian.  

  > **"RP ranks Z below Y, which shows it is not simply maximizing equality"**  
  > **Correct and creditworthy**. Valid counter to egalitarian interpretation.  

  > **"So lowering B from 100 to 60 cannot raise the total"**  
  > **Clearly mistaken**. V(Y)=30 > V(X)=16.67 *does* show raising total while B worse off, A unchanged. Contradicts claim.  

  > **"The move from X to Y [...] makes one person better off and another worse off"**  
  > **Clearly mistaken**. A’s absolute well-being unchanged (0→0); only B worsens (100→60). No one better off absolutely.  

  ---  
  ### What a Strong Answer to (b)(ii) Would Add  
  1. **Pareto principle violation**: RP ranks Y>X despite B worse off, A unchanged—textbook LDO case for prioritarianism (weights ≠ well-being).  
  2. **Explicit distinction**: In (a), weights depend *only* on absolute well-being (fixed); in RP, weights shift with mean (dynamic). Thus, lowering B *can* raise V by improving A’s relative weight, violating Pareto.  
  3. **Y vs. Z point**: While correct that RP avoids equality fetishism, it doesn’t refute LDO—Z has lower well-being *and* lower V, irrelevant to X/Y Pareto violation.  

  ---  
  ### Model Answer for 3(b)(ii) (178 words)  
  The computation shows V(Y)=30 > V(X)=16.67, resembling levelling-down (B worse off, A unchanged). However, this is not strictly the levelling-down objection (LDO), which requires *no one better off absolutely*. RP escapes LDO as weights remain positive, so reducing one’s well-being without compensation always lowers V (e.g., Z<Y). Yet RP violates the Pareto principle: Y>X despite B worse off, A no better off. This occurs because RP’s weights depend on relative position—when B’s well-being falls to 60, the mean drops to 30, increasing A’s weight (v(-30)=1.5 > 1.833 for v(-50)) though A’s well-being is unchanged. The argument from (a) does not fully transfer: while positive weights prevent pure levelling-down, weight *reassignment* when others’ well-being changes creates Pareto violations. Thus, RP avoids intrinsic equality valuation (it prefers Y to Z despite Z’s near-equality) but prioritizes relative gains over absolute losses, a distinct problem.  

  ---  
  **Final Note**: Candidate confuses *relative weighting shifts* with *well-being improvement*, masking RP’s Pareto failure. Script is sophisticated but errs fundamentally in (b)(ii). 13/20 is fair.
