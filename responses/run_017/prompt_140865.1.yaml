prompt: |-
  I'm in a final-year seminar on blame and accountability, and this week's session was on hypocrisy. Our section leader leaned hard on an analogy I have been turning over since, and I would like it audited properly before I build a paper on it.

  The analogy is that moral blame is like a civil action. On her telling, to blame someone is to bring a claim against them: the blamer needs standing in roughly the legal sense, meaning a particularized injury traceable to the person she is addressing, and even a blamer with standing can be barred, because a court of equity refuses relief to a plaintiff who comes to it with dirty hands — you cannot invoke a norm you are yourself flouting. She uses the analogy to carry a strong conclusion, namely that a hypocrite's blame is not merely impolite or unpersuasive but infelicitous: it makes no claim on the person addressed, that person may set it aside entirely, and nothing is left over — no reason to reconsider, no reason to feel anything, no residue of accountability.

  A classmate objected that the analogy imports the very thing in dispute. Legal standing, he said, is a jurisdictional gate on a scarce public resource: it decides who may set the coercive apparatus of the state in motion, and, at least in its American form, it exists to keep courts from being used to air undifferentiated grievances. Blame is address between persons who are, on the account she is giving, one another's equals: no adjudicator, no docket, no remedy to allocate, no sovereign. So whatever work standing does in the moral case, it cannot be that. She replied that the gatekeeping rationale is inessential; what carries over is the structural point that whether a claim against you can be pressed at all can depend on facts about the claimant and not only on the content of the claim.

  I want more than a verdict on that exchange. Please lay out the full correspondence table first: what plays the role of the plaintiff, the injury in fact, the cause of action, the court, the remedy, the affirmative defense, and the requirement, in the doctrine she is borrowing, that the plaintiff's misconduct concern the same subject matter as the suit. Note in passing that the doctrine is discretionary and is weighed against other considerations, and that it is a defense to relief rather than a finding that the underlying claim is false.

  Then sort the disanalogies into the ones that actually bite on her conclusion and the ones that are decorative. Three I cannot settle myself:

  First, two people both guilty of the same kind of thing. In law the defense is available to whichever of them is the defendant, so each is barred against the other, and there is still a prosecutor or a different, clean plaintiff to vindicate the norm. Morality has no party who stands outside the practice. So if blame forfeits standing whenever the blamer is compromised, the norm loses every enforcer it has and the worst offenders end up in a zone of mutual impunity. Is that a genuine consequence of the analogy, or am I misreading it?

  Second, the confessing hypocrite: someone who did the thing, is still doing it, but has owned it publicly and is trying to stop. Equity looks backward at conduct; blame seems to respond to where the blamer now stands with respect to the norm. If acknowledgment cures in one case and not the other, then the two are tracking different kinds of condition, a historical bar versus a present relational one.

  Third, whether the analogy quietly settles a question it was brought in to help answer: the same-subject-matter restriction would make forfeiture norm-specific, but the intuitive case for taking hypocrisy seriously is often norm-general.

  Finally: does the strong conclusion survive, and if the litigation model is the wrong one, what would be a better analogy — appealing to the rules of a practice one is currently playing, a demand among equals, a request within an ongoing relationship? Please argue from the structure of the cases rather than from what is supposed to have been said in the literature.
reasoning: |-
  Okay, the user is in a final-year seminar on blame and accountability, focusing on hypocrisy. Their section leader used a legal analogy comparing moral blame to a civil action, where the blamer needs "standing" and can be barred due to "dirty hands." The user wants a thorough audit of this analogy before building their paper. They've already encountered an objection from a classmate about the disanalogies, particularly regarding the legal concept of standing versus moral blame between equals. The user isn't just looking for a verdict on that exchange but wants a detailed correspondence table mapping each legal element to the moral context. They also have three specific concerns: mutual impunity among offenders, the confessing hypocrite, and whether the analogy norm-specifically settles what should be norm-general. Finally, they want to know if the strong conclusion holds and suggest alternative analogies.

  First, I need to map out the analogy as per the section leader's framework. Let me list each legal component and its moral counterpart. The plaintiff is the blamer, the injury in fact is the moral harm from the violation, the cause of action is the violated norm, the court is the moral community or dyadic interaction, the remedy is acknowledgment or redress, the affirmative defense is the dirty hands defense, and the same-subject-matter restriction applies similarly. I should note that in law, this is discretionary and doesn't negate the claim's truth, which carries over to the analogy.

  Next, addressing the user's three concerns. For mutual impunity: if both parties are hypocrites, in law, they can't sue each other, but a prosecutor or clean plaintiff can still enforce the norm. Morally, there's no external enforcer, leading to a zone of impunity. Is this a necessary consequence? Yes, because the analogy implies that compromised individuals can't hold each other accountable, potentially undermining norm enforcement. But perhaps the moral community could serve as a "court," though the analogy focuses on dyadic blame.

  For the confessing hypocrite: in equity, past misconduct bars relief regardless of current stance. Morally, if someone acknowledges their fault and is reforming, their blame might still carry weight. The analogy treats standing as historical, whereas morality might consider present commitment. This is a disanalogy that bites because it affects whether blame is infelicitous based on past vs. present actions.

  Same-subject-matter: legally, the defense requires the misconduct to relate to the suit. The analogy imports this, making forfeiture norm-specific. But intuitively, hypocrisy might undermine standing generally. If the analogy enforces norm-specificity, it might not align with how we view moral hypocrisy, which can be broader.

  Now, evaluating the strong conclusion. The conclusion is that hypocritical blame is infelicitous—no claim is made, and the addressee can dismiss it entirely. The structural point is that the claimant's status matters. But the disanalogies, especially mutual impunity and the confessing hypocrite, challenge this. Mutual impunity shows a practical problem in morality without a third-party enforcer. The confessing hypocrite highlights a difference in how standing is determined (past vs. present). These suggest the conclusion might not hold.

  Alternative analogies? The user suggested rules of a game, demands among equals, or requests in a relationship. The game analogy has issues if players are cheaters. Demands among equals might involve authority issues. The relationship analogy seems stronger because it accounts for reciprocity and ongoing dynamics. If both parties have violated trust, mutual blame might still have weight if they're committed to repairing the relationship. This better handles the confessing hypocrite and avoids mutual impunity by focusing on joint commitment rather than standing.

  Also, considering the literature without citing it, the structural case for the relationship analogy: it allows for blame to function as a call to realign with shared norms, even from someone imperfect, as long as the relationship's foundation exists. This avoids the infelicity claim and retains accountability, addressing the user's concerns.

  So the strong conclusion doesn't fully survive because of key disanalogies. The relationship analogy is more robust as it accommodates the complexities of moral interactions without requiring pristine standing.
answer: |-
  Here's a full audit of the civil litigation analogy for moral blame, structured as requested. I'll proceed systematically: first laying out the correspondence table, then analyzing key disanalogies (including your three concerns), and finally evaluating the conclusion and proposing alternative analogies.

  ---

  ### **Correspondence Table: Civil Litigation → Moral Blame Analogy**
  *(Based on the section leader's framework)*

  | **Legal Element**                     | **Moral Blame Analog**                                                                 | **Notes on the Analogy**                                                                                                                                                              |
  |---------------------------------------|----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Plaintiff**                         | The Blamer                                                                             | The party initiating the "claim" of wrongdoing. Must have standing to do so.                                                                                                          |
  | **Injury in Fact**                    | Particularized Moral Harm/Slight                                                       | Not generalized indignation; the blamer must have suffered a distinct harm traceable to the blamed person (e.g., betrayal, direct disrespect, relational rupture).                    |
  | **Cause of Action**                   | Violated Moral Norm                                                                    | The specific norm allegedly breached (e.g., honesty, fidelity, fairness).                                                                                                             |
  | **Court**                             | The Dyadic Interaction / Moral Community as "Forum"                                    | The space where blame is expressed and received. No formal adjudicator, but reciprocity and shared norms provide structure.                                                           |
  | **Remedy**                            | Acknowledgment, Apology, Amends, or Moral Realignment                                  | The desired outcome: restoring normative alignment, not material compensation.                                                                                                        |
  | **Affirmative Defense**               | Hypocrisy ("Unclean Hands")                                                            | The blamed party can "defend" by showing the blamer violates the *same norm* they invoke.                                                                                             |
  | **Same-Subject-Matter Requirement**   | Identical Norm Violation by Blamer                                                     | The blamer's misconduct must concern the *exact norm* they are invoking (e.g., you can't blame me for lying if you lied in the same context).                                          |
  | **Discretionary Bar to Relief**       | Moral "Infelicity" of Blame                                                            | Even if the underlying claim is valid, the blamer's hypocrisy bars the *enforcement* of the claim (no "remedy"). The wrongness of the act remains.                                    |
  | **Jurisdictional Gate (Standing)**    | Relational Standing to Blame                                                           | Requires a direct stake (injury) and relational proximity. Not a public grievance.                                                                                                    |

  **Key Structural Borrowings:**  
  1. **Standing Requirement:** Blame requires a direct, personal stake.  
  2. **Claim vs. Enforcement Separation:** Hypocrisy doesn’t negate the wrongness of the act (*claim validity*) but bars the hypocrite from *enforcing* it.  
  3. **Defense is Relational:** Hypocrisy negates the blamer’s *authority*, not the norm’s validity.  
  4. **Discretion:** Like equity courts, moral agents can weigh hypocrisy against other factors (e.g., severity, intent), but the analogy treats it as decisive.

  ---

  ### **Disanalogies: Decorative vs. Biting**
  *(Decorative disanalogies don’t undermine the core analogy; biting ones challenge its logic or conclusions)*

  | **Disanalogy**                          | **Type**       | **Why?**                                                                                                                                                              |
  |-----------------------------------------|----------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **No Sovereign/Coercive Apparatus**     | Decorative     | Your classmate is right that legal standing manages state power, but the analogy only borrows the *relational gatekeeping* function, not the state-action element.     |
  | **No Formal Adjudicator**               | Decorative     | Moral blame operates interpersonally without a judge, but the "court" analog (shared norms/dyad) holds structurally.                                                  |
  | **No Scarce Resource/Docket**           | Decorative     | Legal standing prevents court overload; moral blame has no parallel scarcity. Irrelevant to the *relational authority* point.                                         |
  | **Remedy is Non-Coercive**              | Decorative     | Moral remedies (apology, etc.) lack state enforcement, but the analogy focuses on *successful normative demand*, not force.                                           |
  | **Mutual Impunity (Your 1st Concern)** | **BITING**     | ▶ **See detailed analysis below.**                                                                                                                                    |
  | **Confessing Hypocrite (Your 2nd)**    | **BITING**     | ▶ **See detailed analysis below.**                                                                                                                                    |
  | **Norm-Generality (Your 3rd)**         | **BITING**     | ▶ **See detailed analysis below.**                                                                                                                                    |

  ---

  ### **Analysis of Your Three Concerns**
  1. **Mutual Impunity:**  
     - **The Problem:** If two hypocrites blame each other for the same norm violation, the analogy bars both (no standing). Unlike law, there’s no "prosecutor" (neutral third party) to enforce the norm. This creates a zone of impunity where the worst offenders are mutually shielded.  
     - **Does the Analogy Entail This?** **Yes.** The analogy makes standing *agent-relative*: a hypocrite lacks standing *as an enforcer*, full stop. If all potential enforcers are compromised, the norm is functionally unenforceable interpersonally. This is a fatal flaw if morality requires *some* pathway for accountability even among flawed agents.  
     - **Bites the Conclusion:** It exposes the analogy’s inability to handle cases where the *norm itself* demands enforcement despite universal frailty (e.g., mutual wrongdoers in a friendship *still* need to address harms).

  2. **The Confessing Hypocrite:**  
     - **The Problem:** Equity’s "unclean hands" is backward-looking; past misconduct bars relief even if the plaintiff repents. But moral blame often centers on the blamer’s *current stance*: if they admit fault and commit to change, their blame may carry weight (e.g., a recovering addict blaming a peer).  
     - **Disanalogy:** The analogy treats standing as **historical** (did you violate the norm?), while morality often treats it as **teleological** (are you *aligned with the norm now*?).  
     - **Bites the Conclusion:** If a "confessing hypocrite" has moral standing but their legal analog wouldn’t get a hearing, the analogy fails to capture how moral authority can be *restored through acknowledgment*. This undermines the "no residue" claim.

  3. **Same-Subject-Matter vs. Norm-Generality:**  
     - **The Problem:** Legally, "unclean hands" requires misconduct in the *exact domain* as the suit (e.g., fraud plaintiff must not have committed fraud *in this transaction*). But intuitively, hypocrisy often feels invalidating even if the blamer’s sins are *unrelated* (e.g., a liar blaming you for cruelty).  
     - **Does the Analogy Settle This?** **Yes, covertly.** By importing the same-subject-matter rule, it assumes forfeiture is **norm-specific**. Yet the moral intuition for dismissing hypocrites is often **norm-general** (e.g., "Who are *you* to judge?" implies a global deficit of moral authority).  
     - **Bites the Conclusion:** If the analogy *builds in* norm-specificity, it can’t explain why we reject blame from hypocrites acting in "clean" domains. This weakens its claim to capture hypocrisy’s full moral force.

  ---

  ### **Evaluation of the Strong Conclusion**
  **Conclusion:** *Hypocritical blame is "infelicitous" – it makes no valid claim, leaves no residue, and may be dismissed entirely.*  

  - **Does it survive?** **Partially, but not robustly.**  
    - **Strengths:** The analogy successfully shows hypocrisy can void the *enforcer’s authority* without negating the norm. This explains why hypocrites lack persuasive power and feel "tainted."  
    - **Weaknesses:** The biting disanalogies show the conclusion is **overstated**:  
      1. Mutual impunity makes norm-enforcement impossible in flawed communities.  
      2. It cannot accommodate reform or confession.  
      3. It ignores norm-general hypocrisy.  
    - **Verdict:** Hypocrisy *undermines standing*, but the "no residue" claim is false. The wrongness of the act persists, and the blamed may still have reasons to respond (e.g., to the norm itself, or to other non-hypocritical parties). The analogy’s **infelicity** framing is too strong; **attenuation** is more accurate.

  ---

  ### **A Better Analogy: Blame as a Relational Demand in a Joint Practice**
  **Proposed Alternative:** Moral blame is like making a **demand within a cooperative practice** (e.g., teammates calling a foul in a game).  

  #### **Why This Fits Better:**
  1. **Structure:**  
     - **Practice Rules** = Moral Norms  
     - **Player** = Moral Agent  
     - **Demand** = Blame ("You violated Rule X!")  
     - **Standing** = Participation in Good Faith (You can’t credibly demand rule-following if *you’re* cheating)  
     - **Remedy** = Play Correction (Apology, reset)  

  2. **Solves the Biting Disanalogies:**  
     - **Mutual Impunity:** Even if two cheaters blame each other, the *rules still bind them*, and their mutual fouls don’t negate the need to address violations. The game can’t continue until breaches are resolved.  
     - **Confessing Hypocrite:** A player who admits fault and stops cheating regains standing to call fouls. Authority hinges on *current participation*, not just past compliance.  
     - **Norm-Generality:** While sport rules are domain-specific, practices like "trust" or "respect" are foundational. Violating *foundational* norms (e.g., integrity) may void standing globally.  

  3. **Advantages Over Litigation Model:**  
     - **No Sovereign Needed:** The practice is sustained by participants.  
     - **Dynamic Authority:** Standing depends on ongoing commitment, not historical purity.  
     - **Preserves Accountability:** Focuses on restoring joint action, not dismissing claims. Even flawed agents can demand repair if they re-engage earnestly.  
     - **Explains "Residue":** A hypocrite’s blame may fail *as a demand*, but the norm’s validity lingers, and others (or the blamed themselves) can still uphold it.  

  **Conclusion:** The litigation analogy usefully highlights the *relational authority* dimension of blame but overreaches by making hypocrisy a total negation. The joint practice model better captures blame’s role in **sustaining shared norms among fallible agents** – where hypocrisy weakens demands but doesn’t erase accountability. For your paper, consider arguing that the "dirty hands" doctrine explains *one facet* of hypocrisy (delegitimizing the enforcer) but fails as a holistic model because morality, unlike law, cannot outsource enforcement to a "sovereign" and must handle mutual brokenness immanently.
