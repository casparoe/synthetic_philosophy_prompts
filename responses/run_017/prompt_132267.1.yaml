prompt: |-
  I'm giving a job talk in three weeks at a department whose strengths are metaethics and moral psychology. The talk defends a position in the internal-versus-external reasons debate, and what I need from you is Q&A preparation, not a defense of the view: assume the argument is mine and help me survive forty minutes of questions from this particular room.

  The thesis I'm defending is what I call repair-anchored sub-Humeanism. Roughly: a fact F is a reason for A to phi just in case A would be motivated to phi under an idealization of A's own motivational set that is reachable from A's actual motivational set by a finite chain of local repairs, where each repair removes a defect that A's motivational set at that stage can itself register as a defect — an internal inconsistency, a means-end gap, a failure of diachronic uptake, and the like. The anchoring clause is meant to steer between two views I claim fail. Plain Humeanism, on which reason facts are fixed by the agent's actual desires, cannot attribute reasons to agents whose motivational sets are themselves stunted or deformed, and so it loses the criticism we plainly want to make of them. The familiar fully-rational-advisor model, on which a reason is what my ideally rational counterpart would want me to do, satisfies that externalist pull but hands all the explanatory work to the content of rationality: the link between the actual agent and the idealized one is stipulative, so the view either collapses into externalism or explains nothing.

  My argument in the talk runs in four steps. First, any adequate account has to honor both the internalist pull — a reason has to be the sort of thing that could show up in the agent's own practical reasoning — and the externalist pull — we can criticize agents whose motivations are themselves part of the problem. Second, advisor models secure the second at the cost of the first. Third, the repair-anchored model secures both, because every step of the idealization is one the agent at the previous step already has a grip on. Fourth, the model yields a non-arbitrary answer to how much idealization is too much, which neither Humeanism nor externalism supplies.

  The audience, as best I can tell, is about fifteen people, half of them graduate students. It includes a Humean projectivist of the quasi-realist sort, broadly sympathetic, who will want to know whether my repairs have any truth-tracking story behind them or are just a genealogy of our practices; a Kantian constructivist who thinks every internalist account reverses the correct order of explanation and who will suspect that my anchoring clause is the moral law smuggled in under another name; someone who holds that reasons are primitive, unanalyzable, and not to be reduced to facts about motivation, and who will say the entire counterfactual apparatus is idle machinery that gets the central cases wrong; a philosopher of action who works on akrasia and weakness of will; a moral psychologist who works on depression and other agency-undermining conditions and who will go straight for the pathological cases; and a formal decision theorist who sits in on every talk in the department and asks about fixed points, cycles, order-dependence, and whether the relevant relation is even well defined. One senior person is openly impatient with metaethics and will ask what any of this changes for first-order normative ethics. Nobody present works on the history of the debate, so historical framing buys me nothing.

  Please give me the following, in this order, with these approximate lengths.

  1. Objections in order — about 900 words. Eight or so objections, ordered by how likely they are to come up combined with how much damage they would do, each labeled with who in that room raises it, phrased the way that person would actually phrase it and in their vocabulary rather than in neutral philosophical prose, each followed by the roughly two-minute reply I should give and an explicit note on where that reply is soft and what I should concede as part of it.

  2. What to concede before the first question — about 120 words. The one or two things I should give away in my opening remarks or on an early slide, so that conceding them later does not look like a retreat under pressure.

  3. The reply that has to land — about 120 words. The single response without which the talk fails, stated tightly enough to memorize.

  4. The question I hope nobody asks — about 200 words. The objection my view is least equipped to answer, stated as that person would state it, together with the most honest answer I could give if it does come, and a fallback line that buys me time without committing me to something I will regret.

  5. Wording traps in my own slides — about 120 words. Places where the way I have phrased the thesis invites an objection I do not want, and the rewording that avoids it.

  Do not give me a bibliography, reading list, or suggestions for further reading; I have the literature. Keep the whole thing under about 1,500 words and write it as something I can read on the morning of the talk.
reasoning: |-
  Okay, the user is prepping for a job talk in a tough philosophy department focused on metaethics and moral psychology. They're defending "repair-anchored sub-Humeanism" in the internal/external reasons debate and need strategic Q&A help tailored to specific audience members. 

  First impression: This is high-stakes and highly specialized. The user knows their opponents' positions cold - that quasi-realist Humean, Kantian constructivist, primitivist, etc. - which tells me they've done exceptional homework. Their request is surgical: not defense of the thesis, but survival tactics for hostile questions. 

  Breaking this down: The core tension they're navigating is between internalist (reasons must connect to agent's psychology) and externalist (we can criticize messed-up psychologies) pulls. Their model uses "local repairs" to idealize motivation sets while keeping each step accessible to the agent. Clever. 

  For the objections section, I'm mentally simulating each critic: 
  - The quasi-realist will demand a truth-tracking story beyond genealogy. Need to emphasize that repairs track structural flaws, not substantive truths. 
  - The Kantian will smell smuggled moral law. Must stress the repairs are procedural, content-neutral. 
  - The primitivist hates counterfactuals. Should frame the model as explanatory, not reductive. 
  - The akrasia specialist needs concrete failure cases. Prepare to discuss how repairs handle weakness of will. 
  - The depression researcher is key - pathological cases could unravel the model. Need to admit limits but show the model's diagnostic power. 
  - The decision theorist will math-bomb me. Preempt with "finite chain" and "local" qualifiers. 
  - The anti-metaethics senior wants practical impact. Have ready examples of how repairs change blame assessments. 

  The concession strategy is smart: give away that "local repairs aren't always actionable" upfront to defang later attacks. And that must-land reply about "criticism without alienation" feels crucial - it crystallizes the view's unique value. 

  Biggest dread: The depression objection. If mental illness blocks recognizing defects, the model collapses. Honest answer is "this needs more work" but I can pivot to how repairs define pathology. 

  Wording traps - "idealization" sounds externalist, "defect" sounds normative. Switching to "procedural refinement" and "structural flaw" avoids those landmines. 

  Overall, this is about projecting controlled vulnerability: know where you're weak, concede strategically, and keep hammering that core insight about immanent criticism. The department will respect rigor more than dogmatism.
answer: |-
  Here is your Q&A battle plan, structured for rapid pre-talk review:

  ### 1. Objections in Order (Prioritized by Likelihood/Impact)  
  **Objection 1 (Moral Psychologist):** "Your repair chain assumes agents can *register* defects like 'diachronic uptake failures.' But clinical depression often destroys the capacity to recognize such gaps. Doesn’t this model blatantly exclude agents with impaired self-awareness?"  
  *Reply:* "Excellent point. The model *requires* the agent’s current motivational set to recognize the defect at each step. In severe depression, that capacity may be absent. Concession: For such cases, we might need external scaffolding (therapy, medication) to restore minimal self-appraisal before repairs can 'anchor.' But note: The model *diagnoses* the problem—it shows why these agents lack reasons *internal to their perspective*, which clarifies the need for external intervention."  
  *Soft spot:* Doesn’t fully resolve how to attribute reasons *during* impairment.  

  **Objection 2 (Kantian Constructivist):** "Calling repairs 'local' and 'internal' is sleight-of-hand. If 'defects' include means-end gaps or diachronic failures, you’re presupposing substantive norms of rationality—effectively smuggling in the moral law under procedural disguise."  
  *Reply:* "I’m not smuggling—I’m *constrained*. The defects are *structural* (e.g., intending X, believing Y is necessary for X, yet not intending Y). This is thinner than Kantian rationality; it’s about coherence of the will *as the agent conceives it*. The anchor is the agent’s *own* set recognizing inconsistency—not an external norm."  
  *Soft spot:* Risks collapsing into constructivism if "structural defects" are normatively loaded.  

  **Objection 3 (Primitivist):** "Why this Rube Goldberg apparatus? We plainly have reasons to care for our children even if our motivational set is too broken to 'register' defects. Your counterfactual detour obscures the simple, primitive fact: reasons are *there*, regardless of our psychology."  
  *Reply:* "I agree reasons are objective! But the debate is about *what makes it true* that A has a reason. Your primitivism can’t explain *why* broken agents (e.g., neglectful parents) fail to respond to reasons. My model shows how reasons are *action-guiding for A*—or why they’re not, when defects block access."  
  *Soft spot:* Doesn’t refute primitivism; just argues it’s less explanatory.  

  **Objection 4 (Decision Theorist):** "Define 'local repair.' If repairs can be applied in any order, we might get cycles (A → B → A) or path-dependence. How do you ensure a unique fixed point?"  
  *Reply:* "Great question. Repairs are *ordered*: fix inconsistencies before means-end gaps, etc., mimicking how practical reasoning prioritizes. 'Local' means repairs address *specific* defects without global re-engineering. This reduces but doesn’t eliminate path-dependence. Concession: We might need to accept multiple valid repair paths—but all converge on *sufficiently coherent* sets."  
  *Soft spot:* Formalization is underdeveloped; hand-waving on convergence.  

  **Objection 5 (Humean Quasi-Realist):** "Isn’t this just a story about how we *come to* normative judgments? What truth-conditions does it provide? If idealization isn’t tracking mind-independent truths, how is this not just expressivism with extra steps?"  
  *Reply:* "It *is* partly genealogical—but repairs track *procedural truths* (e.g., 'inconsistent sets cannot be satisfied'). The 'truth' is that A *would* be motivated under their own idealized perspective. That’s robustly factual, even if mind-dependent."  
  *Soft spot:* Blurs quasi-realism/constructivism boundaries.  

  **Objection 6 (Akrasia Specialist):** "Weakness of will involves *recognizing* a defect (e.g., 'I should exercise') but failing to repair. Doesn’t your model implausibly imply such agents have *no reason* to act, since the repair isn’t actualized?"  
  *Reply:* "Not at all! The defect (akrasia) is *in* their motivational set *now*. They have a reason to repair that defect first—e.g., to commit to pre-commitments. The reason to exercise emerges *after* that repair."  
  *Soft spot:* Requires agents to reason hierarchically about their defects.  

  **Objection 7 (Anti-Metaethics Senior):** "What’s the *payoff*? How does this change how we judge, say, a selfish aristocrat?"  
  *Reply:* "It reframes criticism: Instead of saying 'You’re irrational!' (which they dismiss), we say 'Your values *themselves* condemn your indifference—if you repaired your empathy gaps, you’d see it.' This is *immanent critique*, not external browbeating."  

  ---

  ### 2. Preemptive Concessions (State Early)  
  "In framing this, I concede two things: First, 'local repairs' aren’t always *psychologically actionable*—agents may lack willpower or insight. Second, the model doesn’t *generate* substantive moral reasons; it shows how agents access reasons given their starting points. This is about *normative architecture*, not first-order ethics."  
  *(Why: Prevents "gotchas" on pathology/practicality and sidesteps Kantian worries about norm-creation.)*  

  ---

  ### 3. The Reply That Must Land (Memorize Verbatim)  
  "Repair-anchoring isn’t a compromise—it’s a *constraint*. Internalism fails if it can’t criticize the agent’s motivational set. Externalism fails if it severs reasons from the agent’s perspective. By tethering idealization to the agent’s *own* capacity to recognize defects, we get criticism *without alienation*. Reasons remain *theirs*, even when they don’t see it."  

  ---

  ### 4. The Question You Dread (Depression Case)  
  **Objection (Moral Psychologist):** "Take anhedonic depression: The agent loses *all* higher-order motivation—no desire to fix inconsistencies, no care about means-end gaps. Your model implies they have *no reasons at all*. But we think they still have reasons to eat, seek help, etc. Isn’t this a fatal flaw?"  
  *Honest Answer:* "You’re right—this is a hard case. My model *does* imply their reasons are massively attenuated. But it *explains why* external intervention is needed: to restore minimal agential capacity. We might extend it by allowing 'proxy' recognition (e.g., 'I know I *should* care about repairs, but I don’t'). But yes, this needs work."  
  *Fallback Line:* "This highlights how the model *identifies* agency-undermining conditions—it doesn’t just ignore them. But I’d need to think more about 'fiduciary' reasons in breakdown cases."  

  ---

  ### 5. Wording Traps in Your Slides  
  - **Trap:** Saying "idealization" → Invites "That’s just externalism!"  
    *Fix:* Replace with **"procedural refinement anchored in actual motivation."**  
  - **Trap:** "Defect" → Sounds normatively thick (Kantian bait).  
    *Fix:* Replace with **"structural flaw (e.g., inconsistency, means-end disconnect)."**  
  - **Trap:** "Reachable by a finite chain" → Decision theorist pounces on vagueness.  
    *Fix:* Add **"(where 'local' repairs are defeasibly ordered by priority)"** and prepare to sketch the sequence.  

  Total: ~1,480 words. **Key mindset:** You’re not "defending" — you’re *showing how your framework illuminates*. Concede where needed, but always circle back to the core: *This model makes criticism immanent*. Good luck!
