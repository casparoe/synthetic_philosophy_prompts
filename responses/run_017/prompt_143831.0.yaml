prompt: |-
  I'm a PhD student in quantum information who has been drafted onto a working group writing the certification requirements for device-independent randomness beacons, and I keep having to say what our security case assumes. I want the philosophical reconstruction of it, because I think our draft is using one word where three are needed.

  The practice, stated concretely. Two shielded devices sit in separate laboratories. In each round a public random bit is fed to each device as a measurement setting and each device returns an output bit. We compute a CHSH-type statistic over many rounds and check that it exceeds the local-hidden-variable ceiling of 2. If it does, and provided that (i) nothing passes from one laboratory to the other between the choice of a setting and the recording of an output, and (ii) the public setting bits were not correlated beforehand with whatever internal state the devices were in, we certify that the output string contains randomness unpredictable to any adversary — including one who manufactured and programmed the devices, who shares arbitrary prior entanglement with them, and who knows everything quantum mechanics says there is to know about their internal state. The string is then passed through a randomness extractor and released as certified bits.

  What I want is the implicit theory of locality, causation, or whatever the right noun is, that this security case only makes sense under. Four points I cannot get straight on my own.

  First, the asymmetry in what we grant the adversary. She gets determinism, complete prior knowledge of the devices, and arbitrarily strong common-cause correlations; she is denied only correlation between the setting bits and the device state. We hand her the hidden variables and then refuse her the one thing a hidden-variable theorist would need in order to defeat the protocol. What view of locality or causal independence makes that a coherent package rather than an arbitrary decision about where to stop granting? In particular, is the independence of the settings genuinely a separate assumption from locality, or is it already part of what a Bell-style local causality condition asserts — so that what our draft calls the free-settings assumption is in fact locality showing up a second time under another name?

  Second, our draft forbids communication between the laboratories, and our group is split on whether that means no-signalling at the level of the observed statistics or something stronger. Since we stipulate that the adversary knows the devices' complete internal state, could there be a dependence of one side's output on the other side's setting that is invisible in the published marginals but visible conditional on her information — a channel she could exploit while the public statistics still look no-signalling? If so, we need the hidden-variable-level condition and not merely the operational one. Which of the two does a security proof actually consume, and does the distinction map onto the philosophers' pair of parameter independence and outcome independence? If it does, say which of the two our standard forbids and which it leaves open, and whether a deterministic pilot-wave theory violates the one we forbid.

  Third, two hypothetical anomalies I use to test the draft, which I would like treated as real cases. (a) A beacon runs continuously for a year and its violation strength drifts with the sidereal day, tracking the orientation of the apparatus relative to the fixed stars. (b) A beacon reproducibly sits at 2.9, above the quantum ceiling of about 2.83 but below the no-signalling maximum of 4, with no communication between the laboratories and no detector fault anyone can find. Our engineers call (a) a systematic error and (b) a firmware bug. What in the implicit theory entitles them to that asymmetry? It looks to me as if (b) shows that we were never fully device-independent, since we were assuming quantum mechanics somewhere after all, and as if (a) shows that we secretly assume the relevant common causes to be local and recent rather than cosmological. Say what each anomaly would mean if taken at face value, and what would have to change in the standard to accommodate it.

  Fourth, where the practice is underdetermined. It looks compatible with a deterministic but explicitly nonlocal hidden-variable theory, with an indeterministic picture of irreducibly chancy single outcomes, and with an operationalist picture on which there is no fact of the matter about hidden variables and the whole procedure is only a constraint on observable correlations. It also seems to presuppose something about what is knowable in principle, since the security bound limits the adversary to the quantum description and so appears to assume there is nothing further to be known — exactly what a critic who grants her hidden-variable knowledge denies. Tell me which of these the practice strictly requires, which it merely fits well with, and which it rules out; and tell me whether it also presupposes, without stating it, that measurements have single definite outcomes, since a many-outcomes view seems to block the derivation that the certificate rests on.

  Finally, if we had to rebuild the standard on a different picture — dropping the independence of the settings, or granting the adversary hidden-variable information, or treating supra-quantum violations as discoveries rather than bugs — what would the replacement look like, and would anything be left to certify?

  Format: open with your bottom line in the first sentence, the single claim about what our security case presupposes that the rest defends, then give the reasoning, with no preamble and no restatement of my question; number your replies to my four points. Close with how confident you are in the reconstruction overall and a flag on the one claim in it you are least sure of.
reasoning: |-
  Okay, the user is a PhD student in quantum information working on certification for device-independent randomness beacons. They need a philosophical reconstruction of their security assumptions. Let me start by understanding their main concerns. They mentioned that their draft uses one word where three are needed, so they want to clarify the implicit theories behind their security case.

  First, they point out an asymmetry in what the adversary is granted. The adversary has determinism and prior knowledge but is denied correlation between settings and device states. They wonder if the free-settings assumption is separate from locality. I recall that in Bell's theorem, local causality includes both locality and measurement independence. So the free-settings assumption is indeed a distinct condition, not just locality again. This needs to be clearly separated in their draft.

  Second, the group is split on no-signaling: is it operational or hidden-variable level? The user asks if the adversary could exploit dependencies not visible in the marginals. Security proofs require parameter independence at the hidden-variable level. If the adversary knows the hidden variables, any signaling at that level could compromise security. So the standard must forbid hidden-variable signaling, specifically parameter independence. Deterministic theories like pilot-wave violate this because settings can influence distant outcomes via hidden variables.

  Third, they present two anomalies. Anomaly (a) shows violation strength drifting with sidereal day, which engineers call systematic error. Anomaly (b) has a reproducible violation above quantum but below no-signaling max, labeled a firmware bug. The user questions if (b) implies they assumed quantum mechanics. The difference lies in the causal structure: (a) is consistent with local common causes, while (b) suggests nonlocal influences. To accommodate (b), they'd need to accept supra-quantum correlations, requiring new security proofs, which might be impossible without quantum bounds.

  Fourth, they note the practice is underdetermined. It's compatible with deterministic nonlocal theories, indeterminism, or operationalism. However, the security proof assumes that measurements have definite outcomes; otherwise, the extractor can't function. Also, the adversary is limited by quantum mechanics, presupposing that quantum descriptions are complete. So while multiple ontologies fit, the definite outcomes and quantum-completeness are necessary assumptions.

  Rebuilding the standard without setting independence would collapse the security. Granting hidden variables to the adversary removes all randomness. Accepting supra-quantum correlations would require new frameworks, possibly leading to lower certified randomness or no security. The user's deeper need is to explicitly state all assumptions in their draft, separating locality, setting independence, and no-signaling clearly. They also need to address how anomalies are classified and ensure their standard doesn't tacitly rely on quantum mechanics beyond what's admitted.
answer: |-
  **The security case presupposes a causal structure where measurement settings are exogenous to all past common causes of the devices' states, enforcing a strict separation between the "free-will" choice of settings and the hidden-variable preparation.** This is defended as follows:

  1.  **Asymmetry & Locality:** The "free-settings" (measurement-independence) assumption is *distinct* from locality/Bell-local causality. Bell-local causality combines two independent conditions: *Parameter Independence* (PI: one outcome doesn't depend causally on the *remote setting*, given λ) and *Outcome Independence* (OI: one outcome doesn't depend causally on the *remote outcome*, given λ *and* both settings). The security case *denies* the adversary the ability to correlate settings (a, b) with the hidden variables (λ), i.e., p(λ|a,b) = p(λ). This *Measurement Independence* (MI) is logically independent of PI and OI. Granting MI to the adversary would allow her to set p(λ|a,b) such that outcomes are deterministic functions *of the settings she already knows*, destroying randomness. Locality (PI+OI) alone cannot prevent this without MI. The package is coherent because MI ensures the settings act as *truly random inputs* probing the λ-constrained devices, while locality (specifically PI, as argued below) prevents the adversary from using nonlocal influence *during the round* to control outcomes based on remote settings.

  2.  **No-Signalling Level:** Security requires forbidding *hidden-variable-level parameter independence (PI) violations*. The adversary, knowing λ, could exploit a dependence where p(A|a,b,λ,B) ≠ p(A|a,b,λ) (violating OI) or **p(A|a,b,λ) ≠ p(A|a,λ)** (violating PI). Crucially, a PI violation (A depending directly on b given λ) could be masked in operational statistics (∫ p(A|a,b,λ)p(λ)dλ might still be independent of b), but the adversary, knowing λ, *can* exploit it. Security proofs (e.g., via the entropy accumulation theorem) consume the *hidden-variable-level PI condition*: the setting on one side cannot causally influence the outcome on the other, *given the complete state λ*. **Your standard forbids hidden-variable-level Parameter Independence (PI).** Outcome Independence (OI) can be violated without compromising security (as in QM itself). Deterministic pilot-wave theories explicitly violate hidden-variable-level PI (e.g., the trajectory at A depends instantaneously on the setting at B), hence violating the required condition.

  3.  **Anomalies:**
      *   **(a) Sidereal Drift:** Taken at face value, this suggests λ (device state) is correlated with cosmological variables (e.g., orientation relative to a preferred frame). This violates MI only if the *setting choices* (a,b) also correlate with these cosmological variables. If settings remain independent, this is a "systematic error" – the devices are faulty (λ isn't stationary/is influenced by an uncontrolled common cause), but randomness can still be certified *if the measured violation is sufficiently high*. The security proof bounds min-entropy based on the observed S value, regardless of *why* λ drifts, provided MI and PI hold *for the specific settings used*. It presupposes common causes *can* be cosmological but insists settings are independent of them.
      *   **(b) Supra-Quantum Violation (S=2.9):** Taken at face value, this implies a violation of operational no-signalling *or* hidden-variable-level PI. If genuinely no-communication and no-detector-fault, it suggests hidden-variable-level PI is violated (nonlocal influence). Engineers call it a "bug" because **the security proof critically relies on the quantum Tsirelson bound (≈2.828)**. The extractor parameters (and thus certified randomness rate) are calculated assuming the adversary is constrained by quantum mechanics. S=2.9 > Tsirelson bound implies the adversary could be supra-quantum, potentially knowing λ deterministically *and* exploiting PI violation to predict outcomes perfectly. Accommodating it would require a *new security proof* against supra-quantum adversaries constrained only by no-signalling (PI+OI at operational level), yielding drastically lower (or zero) certified randomness for S<4. The asymmetry arises because (a) challenges device *modeling* (λ drift) but not core assumptions (MI, PI), while (b) directly challenges the *quantum constraint* underpinning the min-entropy bound calculation.

  4.  **Underdetermination & Presuppositions:**
      *   **Compatible With:** Deterministic nonlocal hidden variables (if they respect MI and PI - though most, like pilot-wave, violate PI); Indeterministic QM; Operationalism (focusing only on observed statistics).
      *   **Fits Well With:** Indeterministic QM (the standard use-case).
      *   **Rules Out:** Theories violating Measurement Independence (p(λ|a,b) ≠ p(λ)) or hidden-variable-level Parameter Independence (p(A|a,b,λ) ≠ p(A|a,λ)).
      *   **Crucially Presupposes:** **Single definite outcomes.** The extractor requires a classical output string. A "many-worlds" view without a single outcome per round fundamentally breaks the protocol – there is no single output bit per device per round to feed into the CHSH statistic or the extractor. The derivation of the min-entropy bound assumes a classical joint probability distribution P(AB|XY) for the *observed* outcomes.
      *   **Adversary Knowability:** The security proof presupposes the adversary's knowledge is *bounded by the quantum description* of the devices' initial state. It assumes quantum mechanics provides a *complete* description for the purposes of predicting *possible* correlations (λ encapsulates all relevant QM state info). It does not assume QM is fundamentally complete, only that the adversary cannot know or exploit anything *beyond* what the quantum state describes (e.g., a hypothetical deeper λ determinism is already accounted for within the QM state in the proof). The critic granting hidden-variable knowledge is denied by the MI assumption.

  **Rebuilding the Standard:**
  *   **Dropping MI:** Security collapses. Adversary sets p(λ|a,b) to make outcomes deterministic functions of (a,b). No certified randomness.
  *   **Granting Adversary λ:** Security collapses. If MI holds but adversary knows λ and PI/OI hold, outcomes are deterministic functions of (a,b) given λ. No randomness. If PI/OI are violated, adversary exploits them.
  *   **Accepting Supra-Quantum Violations:** Requires proof against no-signalling adversaries. Certified randomness rate would be based on the distance to S=4 (Pironio et al. style). For S=2.9, the rate would be very low (or zero, depending on noise model). Certification remains possible but yields far less randomness than under the quantum assumption. The beacon becomes less practical.

  **Confidence:** High (90%). **Least Sure Claim:** The assertion that the security proof presupposes the quantum description provides a *complete* bound for the adversary's knowledge *specifically in the sense that any deeper determinism is encapsulated within the quantum state description used in the min-entropy bound derivation*. (This is how the proofs work, but the ontological commitment is subtle).
