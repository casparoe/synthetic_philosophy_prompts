prompt: |-
  I spent forty years in structural geology, so I have a weakness for load-bearing metaphors, and Ive only been reading philosophy properly for about two years — there's a reading group at the library. Last month two of the regulars, Miriam and Alan, got into it over Dennett's crane/skyhook vocabulary and whether an evolutionary account of human morality is a crane or a case of greedy reductionism. I sat there taking notes and honestly cannot tell who won. Here's roughly how it went, tidied up. (I'm not going to say which one I'm inclined toward, because I'm not sure.)

  1. Miriam: natural selection is the model case of a crane — it hoists designed-looking complexity out of replication, variation and differential retention, all bottom-up, nothing descending from above. So when people explain our moral and conventional instincts by kin selection, reciprocity, reputation-tracking and then cultural group selection layered on top, that's a crane of the same sort. Every rung rests on the one below it.

  2. Alan: that's textbook greedy reductionism. Not because it's evolutionary, but because it runs straight from fitness to 'you ought to keep your promises' and skips the levels where the work actually happens — agents, reasons, practices, institutions. As he understands the distinction, the complaint is about skipping levels, not about reducing as such.

  3. Miriam: 'greedy' is just the word you use for a reduction you don't like. I didn't skip the levels, I listed them. Fill in the middle and the accusation evaporates, so the term is doing no work except registering discomfort.

  4. Alan: every rung you listed is causal and descriptive, and the top one is normative. You can explain how we came to believe promise-breaking is wrong without ever showing that it is wrong. The ladder isn't missing rungs, it's leaning against the wrong wall — it hoists the psychology of moral judgement and you then announce it has hoisted morality. Call it a load mismatch.

  5. Miriam: maybe that's all there is to hoist. If the supposed normative fact does no explanatory work beyond the psychology, we don't need it, and dropping it is parsimony, not greed.

  6. Alan: then let's attack the crane picture directly. Every crane in the chain is itself a complex functional structure needing its own crane: genes need replication machinery, the machinery needs a metabolism, and so on down. The image is cranes standing on cranes — but what is the whole rig standing on? Either it bottoms out in something brute (the laws, the initial conditions) which does all its explaining while being unexplained itself, or it never bottoms out and it's cranes all the way down. Either way crane-vs-skyhook isn't an exhaustive pair and the victory lap is premature.

  7. Miriam: brute bedrock isn't a skyhook. A skyhook is top-down, question-begging and complexity-generating; bedrock is at the bottom, minimal, and not question-begging. The axis that matters is direction of explanation, not explainedness. And your regress worry is indiscriminate — it would sink physics too, so it can't be what's special here.

  8. Alan: then here's my real point, the one I keep chewing on. Some of these cranes are self-feeding loops. You need replication machinery in order to get replication. You need a language-using community in order to get language. You need creatures who already respond to reasons in order to get creatures who respond to reasons. Nothing there descends from simplicity; the output is a precondition of the input. Dennett has no name for that, so I'm going to call it a bootstrap crane, and my question is whether it's a genuine crane or a skyhook in a crane's hard hat. My suspicion: 'bootstrapping' is exactly the move the skyhook concept was invented to forbid, and that greedy reductionism always happens at the loop.

  9. Miriam: every crane worth having is a loop like that. Autocatalysis runs on its own output, enzymes are made by enzymes. If a loop is a skyhook, then half of chemistry is supernatural, which drains the word of any content.

  10. Alan: then give me a test. A principled way to tell a benign loop from a question-begging one. 'Loops are fine' is precisely the answer I'd expect from somebody who needs one.

  Can you adjudicate this move by move? I'd like each of the ten moves rated from clearly wrong to clearly right, with a sentence or two of justification, and then an overall verdict. Three things I especially want your read on: (a) whether 'greedy reductionism' can be given a test that isn't just 'a reduction I reject' — Miriam's point in move 3 seems stronger than Alan answers; (b) whether the bedrock-and-regress worry in move 6 is a real problem for the crane picture or a confusion about what cranes were supposed to be for; (c) whether the bootstrap crane is a crane, a skyhook, or evidence that the dichotomy isn't exhaustive. And please say what both of them are missing — I have a feeling they're each assuming something about whether cranes get evaluated one step at a time or as a whole trajectory, but I can't quite articulate it. Don't tell me what to go read; I have the books. I want the adjudication.
reasoning: |-
  Okay, the user has given me a detailed philosophical debate between Miriam and Alan about Dennett's crane/skyhook metaphor and evolutionary accounts of morality. They want me to adjudicate each of the ten moves in their argument, rate them from clearly wrong to clearly right, and provide an overall verdict. They also have three specific questions about greedy reductionism, the bedrock-regress problem, and bootstrap cranes.

  This is quite an advanced philosophical discussion. The user has 40 years in structural geology and has been studying philosophy seriously for two years through a reading group. They're clearly intelligent and technically-minded, as seen in their precise description of the argument and their request for adjudication rather than reading recommendations. They mention having "a weakness for load-bearing metaphors," which makes sense given their geology background.

  The core debate centers on whether evolutionary explanations of morality are valid "cranes" (bottom-up explanations) or "greedy reductionism" that skips important levels. Miriam defends the crane approach while Alan criticizes it as reductionist. Their argument progresses through several key points: the nature of reductionism, the is-ought gap, infinite regress concerns, and the problem of bootstrapping in causal explanations.

  For the adjudication, I need to carefully evaluate each of their ten moves. For move 1, Miriam's basic application of the crane metaphor seems correct but incomplete. Move 2 highlights Alan's valid point about skipping normative levels. The debate intensifies around whether "greedy reductionism" is substantive (move 3) or about directionality (move 4). The bootstrapping issue in moves 8-10 is particularly thorny, involving causal loops in evolution.

  Regarding the three specific questions: (a) Alan's "greedy reductionism" critique needs clearer criteria beyond disagreement; (b) the regress problem isn't fatal to cranes since they're meant to be relative; (c) bootstrap loops are legitimate cranes if they're causal rather than explanatory. Both debaters seem to miss that cranes are context-dependent tools, not absolute foundations.

  I'll provide ratings with justifications for each move, then address the special questions before giving an overall verdict that neither "won" but both contributed important insights. The response should maintain philosophical rigor while respecting the user's expertise and avoiding condescension.
answer: |-
  Here's a thorough adjudication, move-by-move, addressing your specific requests:

  **Adjudication Move-by-Move:**

  1.  **Miriam (Initial Crane Claim):** **Mostly Right, but Incomplete.** She correctly identifies natural selection as Dennett's paradigm crane. Her description of explaining moral instincts via layered evolutionary mechanisms (kin selection, reciprocity, group selection) *is* a crane-like, bottom-up explanation. However, she sidesteps Alan's core concern about the *nature* of what's being hoisted (psychology vs. normativity).
  2.  **Alan (Greedy Reductionism Accusation):** **Partially Right, Partially Misplaced.** Alan correctly diagnoses a potential problem: Miriam's explanation aims to explain the *psychology* of moral belief/instincts via causal mechanisms, but he argues it hasn't touched the *normative force* of "ought" ("you ought to keep your promises"). His focus on "skipping levels" (agents, reasons, practices) is crucial. However, labeling it "textbook greedy reductionism" *at this stage* is premature without a clearer definition of the term beyond "skipping levels."
  3.  **Miriam (Greedy as Discomfort):** **Strong Point.** Miriam effectively challenges the substantive content of "greedy reductionism." If Alan's definition is solely "skipping levels," and she claims she *didn't* skip them (listing kin selection, reciprocity, etc.), then the accusation rests on whether those levels *are* the relevant ones for explaining normativity, not reductionism per se. She highlights the risk of "greedy" being merely pejorative.
  4.  **Alan (Load Mismatch):** **Clearly Right.** This is Alan's strongest move. He precisely articulates the core issue: Miriam's causal-descriptive crane explains *how we came to have moral beliefs/instincts* (the psychology), but it does not explain or justify *why those beliefs are actually true or binding* (the normativity). This is the classic "is-ought gap." The crane isn't incomplete; it's aimed at a different target ("leaning against the wrong wall").
  5.  **Miriam (Parsimony vs. Greed):** **Weak Point.** Miriam retreats to eliminativism about normativity ("maybe that's all there is to hoist"). While parsimony is a virtue, simply declaring normative facts non-existent because they aren't needed for a *causal* explanation of psychology ignores the *phenomenology* and *practice* of morality, which involves genuine normativity. Alan's "load mismatch" critique stands. This feels like changing the subject from explanation to ontology.
  6.  **Alan (Bedrock & Regress):** **Interesting but Misapplied.** Alan raises a profound metaphysical point about foundations and infinite regress, applicable to *any* explanation. However, he misapplies it to Dennett's *pragmatic* distinction. Cranes are *relative* explanatory tools within a system; they don't claim absolute metaphysical grounding. Demanding what the *whole rig* stands on conflates pragmatic explanation with ultimate ontology. As Miriam counters (Move 7), this objection would equally "sink physics," showing it's not specific to the crane/skyhook distinction.
  7.  **Miriam (Bedrock vs. Skyhook, Regress Indiscriminate):** **Clearly Right.** Miriam effectively defends the crane concept here. She correctly distinguishes brute bedrock (a bottom-up stopping point) from a skyhook (top-down, question-begging). She also correctly identifies that Alan's regress worry is a general metaphysical problem, not a specific flaw in the crane/skyhook metaphor, which is about the *direction* and *structure* of explanation *within* a system. The axis *is* direction of explanation.
  8.  **Alan (Bootstrap Crane Dilemma):** **Provocative & Insightful.** Alan identifies a genuine and fascinating challenge: self-constituting or autocatalytic systems (replication needing replicators, language needing language-users, reasons needing reason-responders). His intuition that bootstrapping feels similar to the "move the skyhook concept was invented to forbid" is potent. His question – is a bootstrap crane a real crane or a disguised skyhook? – is excellent. Labeling it a "bootstrap crane" is apt.
  9.  **Miriam (Loops are Legitimate):** **Clearly Right on Science, Incomplete on Normativity.** Miriam is correct that self-sustaining loops (autocatalysis, enzymatic production) are fundamental, well-understood cranes in chemistry and biology. Denying them as cranes would indeed be absurd. However, this doesn't automatically resolve whether the specific loop from *descriptive* evolutionary processes to *normative* moral truths (if such exist) is benign or question-begging in the way Alan fears. Her point defends scientific loops, not necessarily the normative one.
  10. **Alan (Demand for a Test):** **Reasonable but Difficult.** Alan's demand for a "principled way to tell a benign loop from a question-begging one" is fair and cuts to the heart of his skepticism about the moral explanation loop. However, Miriam's point (Move 9) shows such loops *are* benign in science. The test likely lies in whether the loop involves *causal* bootstrapping (legitimate crane, like autocatalysis) or *explanatory* bootstrapping/circularity (illegitimate skyhook-like move). Distinguishing this in the moral case is the hard part.

  **Overall Verdict:** **Stalemate with Insights.** Neither Miriam nor Alan delivered a knockout blow, but Alan exposed the deeper challenge Miriam's account faces regarding normativity. Miriam successfully defended the crane metaphor against Alan's metaphysical regress attack and established the legitimacy of bootstrap loops *in scientific explanation*. However, Alan effectively landed his core "load mismatch" punch (Move 4) regarding the gap between explaining moral psychology and justifying moral normativity. The debate shifted from "is this a crane?" to "can *any* crane of this sort lift normativity?".

  **Addressing Your Specific Queries:**

  a.  **Greedy Reductionism Test:** Miriam (Move 3) is **largely correct** that "greedy" is often used pejoratively without clear criteria. Alan's initial definition ("skipping levels") is vague. A **better test for *explanatory* greedy reductionism** might be: *Does the explanation systematically fail to account for the distinctive properties, behaviors, or causal powers emergent at the higher level by attempting to explain them solely in terms of lower-level components/mechanisms without showing the necessary bridging principles or constraints?* Alan's "load mismatch" (Move 4) is a *version* of this applied to normativity vs. psychology. It's more than just "rejection," but applying the test requires careful analysis of the levels involved and what counts as "accounting for."

  b.  **Bedrock & Regress Worry:** This is **a confusion about what cranes are for** (as Miriam argues in Move 7). Dennett's cranes are *pragmatic, within-system explanatory tools*. They are about building complexity *from simpler (relative) beginnings within the system*. They are *not* intended to solve the ultimate metaphysical grounding of reality or escape infinite regress. Demanding what the whole crane stands on misconstrues the metaphor's purpose. The crane/skyhook distinction operates *within* our explanatory framework; bedrock (laws, initial conditions) is simply the starting point *for that framework*, not a skyhook within it. The regress worry is real for metaphysics but irrelevant for evaluating the crane/skyhook distinction as Dennett uses it.

  c.  **Bootstrap Crane:** A **bootstrap crane is a genuine crane**, *provided* it describes a *causal* loop demonstrably operating in the world (like autocatalysis or enzymatic production). It is **not a skyhook**. A skyhook implies an *unexplained* top-down imposition of complexity. A bootstrap crane explains complexity through a self-sustaining causal process *within* the system, building complexity over time from simpler initial conditions (even if those conditions involve potentiality). Alan is right to flag it as a distinct and important category ("bootstrap crane" is a good label), but his suspicion that bootstrapping is "the move the skyhook concept was invented to forbid" is incorrect. Skyhooks forbid *unexplained, top-down* imposition; bootstrapping is *causal, bottom-up self-organization*. This **demonstrates the dichotomy isn't exhaustive** only if one insists on simplistic definitions. Bootstrap cranes are a sophisticated *type* of crane. The dichotomy is "exhaustive" for *modes of explanation*: bottom-up building (cranes, including bootstraps) vs. top-down magic (skyhooks).

  **What They're Missing (Your Hunch):** You are astute. **Both are evaluating the crane step-by-step but neglecting the *explanatory trajectory* and *explanatory target*.**

  *   **Miriah** focuses on the *mechanics* of each step (replication, variation, selection, kin, reciprocity, group selection) showing they are legitimate cranes building complexity step-by-step. She takes the explanatory target ("morality") as unproblematically identical to the psychology she explains.
  *   **Alan** also focuses on the steps but sees a *discontinuity* or *mismatch* at the final step between the causal machinery and the purported normative output. His "bootstrap" concern highlights loops where the output seems presupposed.
  *   **The Missing Piece:** They aren't adequately considering **whether the *entire chain of cranes*, even if each link is sound, actually reaches the *intended explanatory destination*.** Miriam assumes explaining the psychology *is* explaining morality. Alan argues the chain, however well-built, stops short of normativity. Similarly, for bootstraps: a causal loop can be a valid crane for explaining a *system's persistence or complexity*, but whether it explains the *specific property in question* (like normativity) depends on the details of *that specific loop*. It's not just about the loop's existence, but about *what work it does* in the overall explanatory narrative aimed at the specific target. The evaluation needs to look at the *arc* of the explanation and its fit to the phenomenon.
