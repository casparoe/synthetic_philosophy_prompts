prompt: |-
  My mate and I had a massive argument last night that ran til about 1am and I'm still chewing on it. We got onto approval-directed agents versus goal-directed ones — as I understand it, the goal-directed agent has some objective it pursues and will do whatever happens to work to get it, while the approval-directed one picks whichever action its operator would approve of, rather than optimising for an outcome directly. Her line was that the approval-directed thing is just reward hacking with extra steps: you're still training a system to maximise a scalar, you've only moved the scalar from did-it-work to would-a-human-nod-at-this, and the myopia bit is just a discount factor near zero, a bandit instead of an MDP. I said that's missing something but couldn't say what without handwaving.

  For context on how to pitch this: I do RLHF on language models for work, so I think in policies, reward models, on- and off-policy data, KL penalties back to the base model, discount factors, Goodharting, and distribution shift between the comparison data and whatever the policy actually emits at deployment. Be as technical as you like, don't explain rewards to me. Translate both positions into that vocabulary as faithfully as you can — no smuggling in conclusions and calling them translation — then give me the residue report: what maps cleanly, what only fits if you distort it, and what has no expression at all in RL or RLHF terms. The bit we kept circling and never landed: approval-directedness seems to want approval evaluated counterfactually, over how the action was arrived at and over what the operator would approve of given more time or a better view, and that feels non-Markovian and not identifiable from preference data, but I can't sharpen it.

  Please be committed about it: don't set out both readings and leave me to choose. Say which you think is right and why — especially whether the residue points to a hole in my vocabulary or to the distinction itself being muddier than it's made out to be.

  Answer as exactly five numbered points, one or two sentences each, nothing before the first number or after the last. British English please.
reasoning: |-
  Okay, the user is having a heated debate with their mate about approval-directed versus goal-directed agents, and they're stuck on whether approval-directed is just a form of reward hacking. They work in RLHF for language models, so they want a technical breakdown using RL concepts without handwaving. 

  First, I need to map both positions to RLHF terminology accurately. The user mentioned policies, reward models, KL penalties, etc. Goal-directed agents align with optimizing a reward function directly, which can lead to reward hacking. Approval-directed agents seem like using a reward model trained on human preferences, but the user's mate argues it's still maximizing a scalar—just switching from outcome to human approval.

  The user is circling around the idea that approval-directedness involves counterfactuals—evaluating actions based on how they were chosen or what the operator would approve with more info. This feels non-Markovian and not identifiable from preference data. I need to address if that's a flaw in the RLHF framework or a genuine distinction.

  Breaking it down: 
  1. Goal-directed: Direct reward maximization, prone to Goodhart's law.
  2. Approval-directed: Uses a reward model trained on human preferences, but still scalar optimization.
  3. The mate's view maps approval-directed to reward hacking with a different reward source. That's mostly accurate in terms of maximizing a scalar.
  4. However, the counterfactual aspect—intentions, decision process—isn't captured by standard preference-based reward models. Those models typically don't model latent reasoning.
  5. The residue is this counterfactual approval, which current RLHF can't handle without extra assumptions. So the distinction isn't muddy; it's that RLHF lacks the machinery for it.

  The user wants a decisive take. I think the mate's reduction misses the counterfactual element, which is real but not modeled in RLHF. So the hole is in the vocabulary, not the distinction.
answer: |-
  1.  Goal-directed agents directly optimise a specified reward function \( R(s) \), maximising expected cumulative return and inherently risking Goodharting when the learnt policy \( \pi(a|s) \) exploits discrepancies between \( R(s) \) and true designer intent.
  2.  Approval-directed agents optimise a learnt reward model \( \hat{R}_{RM}(s,a) \), trained on human preference data \( \mathcal{D}_{pref} \) to predict "would-a-human-nod", effectively maximising a scalar proxy for approval; your mate correctly maps this as shifting the optimised scalar from outcome to approval signal.
  3.  Her reduction holds strongly: optimising \( \hat{R}_{RM}(s,a) \) remains scalar maximisation susceptible to reward hacking, particularly under distribution shift as deployed \( \pi(a|s) \) drifts from \( \mathcal{D}_{pref} \), and framing "myopia" as a low discount factor \( \gamma \) fits standard RL.
  4.  The irreducible residue is counterfactual approval: approval-directedness requires evaluating the *process* generating \( a \) (e.g., its intentionality) and the operator's *idealised judgement* (e.g., given infinite compute), which standard preference-based \( \hat{R}_{RM}(s,a) \) cannot capture as it lacks access to latent reasoning or counterfactual human responses.
  5.  This residue signifies a hole in RLHF vocabulary—current frameworks treat approval as a Markovian signal observable only in actual preferences, making counterfactual process-based approval non-identifiable from \( \mathcal{D}_{pref} \); thus, the distinction isn't muddy, but RLHF lacks the machinery to express the intended counterfactual semantics.
