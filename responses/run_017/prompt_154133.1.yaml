prompt: |-
  I'm part of a small team designing a cross-national survey module on moral intuitions, meant to update the standard moral-foundations battery (care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation, liberty/oppression) for use in countries where the six-foundation structure fits worse than it does in the US. A colleague on the team wants to add two further candidates, and I need to decide whether to spend item budget on them. The first is what he calls the legibility foundation: the intuition that the rules, algorithms, and institutional procedures that govern you ought to be inspectable and answerable to you, such that opacity, unexplainability, or hidden discretionary power is itself experienced as a moral offense — with an emotional signature closer to the outrage at cheating than to the discomfort of subversion, but directed at unreadability rather than at unfairness, and with a characteristic motivation to demand explanation, audit, or disclosure. The second is the stewardship foundation: the intuition that goods you did not create but received — institutions, practices, craft knowledge, languages, built and natural landscapes — carry an obligation of maintenance and transmission, with a distinctive resentment at those who liquidate or squander an inherited good for present advantage; he argues this is not reducible to loyalty (bond to a living coalition), authority (deference to rank), or sanctity (purity and contamination), because the object is a continuing practice rather than a group, a hierarchy, or a taboo. Suppose, for the sake of argument, that a small pilot in two countries found legibility items loading on a factor separable from both fairness and liberty, and that stewardship items split off from loyalty and authority but predicted a pattern of political attitudes that neither of those did.

  Please do three things. First, sort all eight — the six established foundations plus these two candidates — into tiers according to how much you would trust each to do independent explanatory work in accounting for left-right moral disagreement, using tiers along the lines of workhorse, real but secondary, probably reduplicative of something already on the list, and probably not a foundation at all, with one sentence of justification per item. Second, score each of the two candidates from 0 to 5 on each of the six admission criteria we have been using: signs of innate preparedness or early emergence, a recognizable eliciting pattern of events, a characteristic emotion, a characteristic motivation, culturally variable elaboration on a shared core, and predictive power for political attitudes that is not already captured by the existing foundations. Third, give me a number for how to split the item budget we set aside for new material between the two candidates (for instance 0.7 to legibility and 0.3 to stewardship), and say why. In each case I would rather have the reasoning that drives the number than the number alone, since we can always renormalize.

  Finally, because the module is going into a deliverable that also has to say something about whether this psychology tells us anything about which side is right: tell me whether admitting either candidate would strengthen, weaken, or leave intact the symmetric conclusion the six-foundation picture is usually taken to support — namely that liberals and conservatives each draw on a genuine but partial subset of the moral domain, so that neither side can be dismissed as morally deficient — and in particular what it would mean for that conclusion if one of the new foundations turned out to be politically asymmetric in the way the established six are not.
reasoning: |-
  Okay, the user is part of a team designing a cross-national survey module on moral intuitions, aiming to update the standard moral foundations theory (MFT) for countries where the original six foundations don't fit well. They're considering two new candidates: legibility and stewardship. The user needs help evaluating these.

  First, I need to understand the two new foundations. Legibility is about transparency in rules and systems, with an emotional response similar to fairness outrage but focused on opacity. Stewardship involves maintaining inherited goods, with resentment towards those who squander them. The pilot study showed legibility separates from fairness and liberty, while stewardship splits from loyalty and authority and predicts unique political attitudes.

  The user wants three things: tier the eight foundations by explanatory power for left-right disagreement, score each new foundation on six criteria, and suggest how to split the item budget. Plus, they want to know how adding these affects the symmetric conclusion that both sides have valid moral perspectives.

  For the tiers, I'll categorize all eight. Workhorses should be foundations strongly tied to political divides. Care/harm and fairness/cheating are core liberal concerns. Loyalty/betrayal and authority/subversion are key for conservatives. Liberty/oppression is tricky but often more liberal. Sanctity/degradation is conservative. Legibility might be a workhorse too, given modern issues like AI transparency. Stewardship could be secondary but important in certain contexts.

  Scoring the new foundations: For legibility, innate preparedness might be moderate (3) since transparency concerns might be learned. But its emotion (outrage) and motivation (demand explanations) are clear. Predictive power seems strong. Stewardship's innate preparedness could be higher (4) if tied to intergenerational thinking. Emotion and motivation are recognizable. Predictive power might be context-dependent.

  Budget split: I'm leaning towards 0.6 for legibility and 0.4 for stewardship. Legibility seems more universally relevant with rising tech opacity, while stewardship might be crucial in specific cultures but less general. Both add value, but legibility's broader applicability edges it out.

  Regarding the symmetric conclusion: Adding legibility might slightly favor liberals if it's asymmetric, as they might emphasize transparency more. Stewardship could favor conservatives if tied to tradition. However, if framed as universal foundations that vary in emphasis, symmetry can be maintained. The key is presenting all foundations as valid moral concerns.

  I should ensure my reasoning is clear, especially why legibility scores higher in some areas. Also, note that stewardship might resonate more in collectivist cultures. The budget split reflects immediate relevance vs. cultural depth. Both deserve inclusion but with different weights.
answer: |-
  Here's a comprehensive analysis based on your scenario and requirements:

  ### First: Tiered Ranking of Foundations for Left-Right Explanatory Power

  | Tier                     | Foundations                  | Justification                                                                 |
  |--------------------------|------------------------------|-------------------------------------------------------------------------------|
  | **Workhorse**            | Loyalty/Betrayal             | Core driver of conservative cohesion vs. liberal universalism.               |
  |                          | Authority/Subversion         | Fundamental to conservative hierarchy acceptance vs. liberal egalitarianism. |
  |                          | Care/Harm                    | Primary liberal concern, often minimized by conservatives in outgroup contexts. |
  |                          | Fairness/Cheating            | Central to liberal equality focus; conservatives emphasize procedural fairness. |
  | **Real but Secondary**   | **Legibility**               | Explains modern disputes over institutional transparency (tech/data/governance). |
  |                          | Liberty/Oppression           | Strong for libertarians but less predictive for mainstream left-right divides. |
  |                          | **Stewardship**              | Relevant to cultural/ecological conservatism but context-dependent.          |
  | **Probably Reduplicative** | Sanctity/Degradation         | Overlaps with stewardship (tradition) and authority (taboo enforcement).     |

  ### Second: Candidate Scoring (0-5 per criterion)

  **Legibility Foundation**  
  1. **Innate Preparedness/Early Emergence**: ⭐⭐ (2) - *Demands for transparency emerge with complex institutions (late childhood/adolescence)*  
  2. **Recognizable Eliciting Pattern**: ⭐⭐⭐⭐ (4) - *Opaque algorithms, hidden bureaucratic discretion, unexplained rejections*  
  3. **Characteristic Emotion**: ⭐⭐⭐⭐ (4) - *Outrage + helplessness at being "locked out" of understanding*  
  4. **Characteristic Motivation**: ⭐⭐⭐⭐⭐ (5) - *Strong drive to audit, demand explanations, expose mechanisms*  
  5. **Culturally Variable Elaboration**: ⭐⭐⭐ (3) - *Core opacity-rejection universal, but expression varies (e.g., FOIA vs. community audits)*  
  6. **Unique Political Predictive Power**: ⭐⭐⭐⭐ (4) - *Predicts distrust in tech/governance beyond fairness/liberty (e.g., anti-AI bias movements)*  

  **Stewardship Foundation**  
  1. **Innate Preparedness/Early Emergence**: ⭐⭐⭐⭐ (4) - *Early "not yours to break" intuitions; intergenerational responsibility narratives cross-culturally*  
  2. **Recognizable Eliciting Pattern**: ⭐⭐⭐ (3) - *Privatizing public heritage, abandoning traditional crafts, clear-cutting ancient forests*  
  3. **Characteristic Emotion**: ⭐⭐⭐⭐ (4) - *Resentment toward "squanderers," grief at irreversible loss*  
  4. **Characteristic Motivation**: ⭐⭐⭐ (3) - *Preserve, maintain, transmit (less urgent/confrontational than outrage)*  
  5. **Culturally Variable Elaboration**: ⭐⭐⭐⭐⭐ (5) - *Core obligation universal, but "goods" defined wildly differently (e.g., Kyoto temples vs. Appalachian farming techniques)*  
  6. **Unique Political Predictive Power**: ⭐⭐ (2) - *Predicts ecological/conservative positions but overlaps with loyalty/sanctity in regression models*  

  ### Third: Item Budget Split & Rationale
  **Allocate 0.65 to Legibility, 0.35 to Stewardship**  

  **Why:**  
  - **Legibility** addresses a **growing, cross-national moral void**: Digital governance, algorithmic decision-making, and bureaucratic complexity are rising globally. Its unique predictive power for tech-skeptic coalitions (spanning left-libertarians and populist right) justifies heavier investment. Emotion/motivation are sharply defined and politically consequential *now*.  
  - **Stewardship** is profound but **context-dependent**: Vital in societies with strong ancestral traditions or ecological movements, but less salient in highly individualistic/urban settings. Its overlap with existing foundations (especially sanctity) and weaker unique predictive power suggest cautious inclusion.  
  - **Pragmatic trade-off**: Legibility items (e.g., *"Rules should be explainable to ordinary people"*) test cleaner cross-culturally than stewardship items (e.g., *"We owe debts to past generations"*), which risk conflating moral intuition with cultural-specific heritage.  

  ---

  ### Impact on the "Symmetric Conclusion"
  **Legibility Strengthens Symmetry IF Framed Correctly:**  
  - It provides a *new axis* where both sides manifest concerns: Liberals emphasize corporate/government transparency; conservatives stress cultural/administrative legibility (e.g., "deep state" opacity). This mirrors the care-fairness vs. loyalty-authority dynamic.  
  - **Asymmetry Risk**: If pilot data shows liberals dominate legibility concerns, this could *temporarily* weaken symmetry. **Mitigation**: Frame it as "institutional accountability" – a universal good differentially applied (like care). Conservatives might score high on business-transparency items.  

  **Stewardship Weakens Symmetry Slightly:**  
  - It naturally aligns with conservative/traditionalist priorities (maintaining heritage). If conservatives monopolize this foundation, it could feed "liberals lack positive moral vision" narratives.  
  - **Counterbalance**: Stress stewardship's liberal expressions (e.g., climate intergenerational justice, preserving minority languages). Without strong cross-ideological examples, asymmetry is likely.  

  **Overall**: Admitting both *preserves symmetry* by expanding the moral palette, but requires careful item-writing to avoid ideological capture. The six-foundation model's asymmetry (conservatives use more foundations) already implies imbalance – adding foundations won't resolve that but may better map non-Western moral landscapes where "partial subsets" differ entirely.

  ---

  **Recommendation**: Prioritize legibility for its immediate relevance in a digitizing world, but include stewardship as a lower-weight complement to capture duties beyond human relationships. This maintains symmetry by treating both as universal capacities with culturally/politically contingent emphases.
