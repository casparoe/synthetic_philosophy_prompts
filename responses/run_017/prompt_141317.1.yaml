  ### Forecasting Game: "The Oracle's Dilemma"  
  **Objective:** Students experience how predictions shape social outcomes, revealing self-fulfilling, self-defeating, and equilibrium-seeking dynamics. The game highlights the limits of long-term forecasting and the value of conditional predictions, mirroring Popper’s critiques without explicit terminology.  

  ---

  ### **Game Setup**  
  **Players:** 16 students in 4 groups of 4.  
  **Variables (Tracked on a Shared Board):**  
  1. **Grain Price (1–10):** Self-fulfilling. High predictions trigger panic buying; low predictions trigger sell-offs.  
  2. **Migration (1–10):** Self-defeating. High predictions lead to preemptive restrictions; low predictions spur recruitment campaigns.  
  3. **Council Support (1–10):** Equilibrium-seeking. Predictions cause overcorrections but stabilize at 5.  

  **Policy Levers (Binary, Set by Facilitator):**  
  - **Grain Subsidy (Yes/No):** Affects grain price.  
  - **Border Policy (Open/Restricted):** Affects migration.  
  *Groups condition forecasts on these policies.*  

  **Materials:**  
  - Printed history sheets (rounds 1–6 data).  
  - Forecast submission slips (unconditional + conditional).  
  - Scoreboard showing group rankings (updated each round).  
  - "Invention Card" (revealed mid-game).  

  ---

  ### **Game Rules & Dynamics**  
  #### **1. Phases**  
  - **Rounds 1–6 (History):** Groups receive identical historical data (pre-generated). No forecasts yet.  
  - **Rounds 7–10 (Pre-Invention):** Groups forecast next round.  
  - **Round 10.5:** Draw "Invention Card" (e.g., "Drought-Resistant Crop").  
  - **Rounds 11–14 (Post-Invention):** New rules apply. Forecasts continue.  

  #### **2. Forecasting**  
  - Each round, groups submit:  
    - **Unconditional Forecast:** Single number per variable (e.g., "Grain Price: 7").  
    - **Conditional Forecast:** Policy-dependent predictions (e.g., "If subsidy = Yes, Grain Price = 5; else Grain Price = 8").  
  - **Policy Announcement:** Facilitator reveals policies *after* forecasts are submitted.  
  - **Forecast Publication:** All group forecasts are displayed publicly before the next round’s outcome.  

  #### **3. Variable Reactions (Facilitator Computes Outcomes)**  
  Outcomes depend on:  
  - Previous state.  
  - Policy lever.  
  - **Average of all groups’ forecasts** for that variable.  

  | **Variable** | **Reaction Rule** |  
  |--------------|-------------------|  
  | **Grain Price** | **Self-Fulfilling:**<br>Base = Previous price + Policy effect (±1).<br>If avg. forecast ≥ 7 → +2 (panic buying).<br>If avg. forecast ≤ 3 → -2 (panic selling).<br>Else → Base value. |  
  | **Migration** | **Self-Defeating:**<br>Base = Previous migration + Policy effect (±1).<br>If avg. forecast ≥ 7 → -3 (restrictions).<br>If avg. forecast ≤ 3 → +3 (promotions).<br>Else → Base value. |  
  | **Council Support** | **Equilibrium-Seeking (Fixed Point = 5):**<br>If avg. forecast > 5 → -1 (complacency).<br>If avg. forecast < 5 → +1 (campaigning).<br>If avg. forecast = 5 → 5 (equilibrium).<br>*Adjustments cap at 10/min at 1.* |  

  **Invention Card (Round 10.5):**  
  - Changes rules:  
    - **Grain Price:** Policy effect doubles (amplifies volatility).  
    - **Migration:** Ignores forecasts (base only).  
    - **Council Support:** Fixed point shifts to 6.  
  - *No advance warning—groups discover this through outcomes.*  

  ---

  ### **Scoring System**  
  **Goal:** Reward short-term accuracy and conditional forecasts. Penalize long-range prophecy.  

  | **Forecast Type** | **Points per Variable/Round** | **Condition** |  
  |-------------------|-------------------------------|---------------|  
  | **Short-Term (Rounds 7–14)** | 10 - \|Actual - Forecast\| | Max 10 pts (perfect). |  
  | **Conditional Bonus** | +2 pts | If conditional forecast used *and* condition matches policy. |  
  | **Long-Range (Rounds 10 & 14)** | 10 - 2×\|Actual - Forecast\| | Penalizes errors harder. Submitted at game start. |  

  **Scoring Rationale:**  
  - **Short-term/conditional:** High rewards incentivize trend-fitting and policy-sensitive predictions.  
  - **Long-range:** The doubling penalty (e.g., 4-point error → 2 pts) ensures extrapolation fails.  
  - **Ledger:** Groups track scores publicly. Conditional bonuses encourage "piecemeal" logic.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **0–5 min:** Introduce rules. Distribute history sheets (rounds 1–6). Groups submit long-range forecasts (round 10 & 14).  
  2. **5–40 min (Rounds 7–10):**  
     - *Each round (5 min):*  
       - 2 min: Groups forecast next round (unconditional + conditional).  
       - 1 min: Facilitator reveals policy, computes outcomes.  
       - 2 min: Update board, announce scores.  
  3. **40–45 min:** Reveal "Invention Card." Explain *only* that rules have changed.  
  4. **45–70 min (Rounds 11–14):** Repeat round structure.  
  5. **70–75 min:** Final scores. Transition to debrief.  

  ---

  ### **Debrief: Mapping to Popper**  
  **Start:** Ask groups, *"What patterns did you notice?"* Surface:  
  - Grain Price: Predictions caused panics (**Oedipus Effect**).  
  - Migration: Predictions triggered avoidance (**Self-Defeating Prophecy**).  
  - Council Support: Predictions stabilized at 5 (**Equilibrium**).  
  - Invention: Broke trends (**Unpredictability of Knowledge**).  

  **Map to *Poverty of Historicism*:**  
  1. **Self-Fulfilling/Defeating:** "Oedipus Effect" (p. 13) — predictions alter outcomes.  
  2. **Equilibrium as 'Law':** Acknowledge: Fixed points *seem* like laws. But Popper argues these are *trends*, not immutable laws, as inventions disrupt them (p. 115–120).  
  3. **Invention Card:** Represents **unpredictable knowledge growth** — you can’t predict future knowledge without having it (p. vi–x).  
  4. **Conditional Forecasts:** Emulate **piecemeal social engineering** (p. 66) — testing policies avoids grand, error-prone prophecies.  

  **Limitations & Caveats:**  
  - The game "fakes" knowledge growth with the invention card. Popper’s deeper point: *All* social laws are vulnerable to new knowledge.  
  - **What the game misses:**  
    - Real-world knowledge emerges from unpredictable human creativity.  
    - Historicism’s error: Confusing trends (context-dependent) with laws (immutable).  

  ---

  ### **What Will Go Wrong (And How to Handle It)**  
  1. **"History is random" Camp:**  
     - **Why:** Invention card and policy randomness may feel arbitrary.  
     - **Fix:** In debrief, clarify that randomness simulates *epistemological uncertainty* — not chaos, but the limits of prediction.  

  2. **"Better models fix this" Camp:**  
     - **Why:** Students may blame imperfect rules.  
     - **Fix:** Stress Popper’s core argument: No model can predict *future knowledge* (e.g., inventions), as it doesn’t yet exist.  

  **Design Defense:**  
  - **Scoring Rule:** The penalty for long-range forecasts forces groups to confront extrapolation failures. Conditional bonuses reward adaptive thinking, mirroring piecemeal engineering.  
  - **Why This Works:** Students *experience* prediction’s pitfalls firsthand. The game avoids lecturing, making Popper’s abstract critiques tangible.  

  **Run It Smoothly:**  
  - Pre-compute round 1–6 data (example below).  
  - Use a simple app (e.g., Google Sheets) for behind-the-scenes calculations.  
  - Emphasize: *"This isn’t about winning—it’s about spotting patterns."*  

  ---  
  **Pre-Generated Data (Rounds 1–6):**  
  | Round | Grain Price | Migration | Council Support | Policy (Subsidy) | Policy (Border) |  
  |-------|-------------|-----------|-----------------|------------------|-----------------|  
  | 1     | 5           | 5         | 5               | Yes              | Open            |  
  | 2     | 6           | 4         | 5               | No               | Restricted      |  
  | 3     | 7           | 3         | 4               | No               | Open            |  
  | 4     | 5           | 6         | 5               | Yes              | Restricted      |  
  | 5     | 4           | 7         | 6               | Yes              | Open            |  
  | 6     | 3           | 8         | 5               | No               | Restricted      |  

  Run the game, then let Popper’s text explain what they lived.
