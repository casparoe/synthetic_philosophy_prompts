prompt: |-
  You are a philosopher of biology who works in the levels-of-selection literature — the replicator/vehicle and replicator/interactor distinctions, the contrast between contextual (group- or individual-level) partitions of fitness and gene-level partitions that fold the social environment into the focal individual's fitness, and the Price-style split of a total change into a within-group and a between-group component. You are not impressed by slogans, and you do not treat "it's just a matter of convention" as the end of a discussion.

  Read the whole list below before you begin, and work through it item by item on your own first. The word limit applies to what you hand back, not to your thinking.

  I'm a postdoc in evolutionary biology, and I've been asked to circulate a short "where I stand" statement ahead of a reading group on levels of selection. Before I commit it to a page, I want the package stress-tested. Here is roughly where I've landed:

  (1) Only a faithful, long-lived replicator can accumulate the products of cumulative selection, because organisms and colonies are transient and do not persist across generations as the same entity. So in the beneficiary sense, genes are the units of selection; organisms and groups are at most vehicles or interactors.

  (2) Contextual partitions and gene-level partitions are alternative bookkeeping schemes over the same total change, and when both are specified correctly they agree. So the question "does selection act at the group level, yes or no?" has no empirical content; it is a choice of description.

  (3) There is nonetheless a real, empirically answerable question whether a given collective trait is instantiated only by the group — a colony's division of labour, say — and whether groups carry heritable variance in fitness at their own level. Discovering that is empirical work, not notational preference.

  (4) One should choose the decomposition whose terms track the actual causal structure of the system. A partition that lumps causally heterogeneous causes together is a bad partition even when it predicts well.

  (5) Case A, idealized from my own system: an obligate, strictly vertically transmitted host–endosymbiont pair in which a nutritional pathway is split across two genomes — the host carries the first two enzymatic steps, the symbiont the third, and neither genome alone yields the product. I want to say the pair is a single unit of selection, and that this is the causally faithful description rather than a convenience.

  (6) Case B: the same system with occasional horizontal transmission of the symbiont, where a strain spreads by biasing host investment toward symbiont-bearing propagules at a cost to host survival. I want to say there is a genuine conflict of levels here, and that the level at which selection acts has shifted relative to Case A.

  (7) The mid-century rejection of for-the-good-of-the-species explanations was a substantive empirical correction, not a change of notation. Relatedly, I take the major transitions — multicellular organisms, eusocial colonies — to involve a real historical transfer of fitness from the lower-level units to the higher-level unit, not merely a redescription of the same process.

  (8) The Price equation is the right framework for all of the above; and I also think it is a bookkeeping identity that explains nothing until its terms are given a causal interpretation.

  Something in here feels like it is doing more work than it can bear, but I can't locate it. Audit the set: which commitments actually pull against each other, which pairs only look like they do and dissolve on inspection, and rank the real ones by severity — most damaging first. For each, say precisely what would have to give, and how costly that would be. Then name the single revision that cleans up the most.

  Be committed: give me a definite verdict, tell me which commitment has to go and defend that choice, rather than laying out the options and leaving me to pick. If you genuinely think the set is consistent as it stands, say so and tell me which worry of mine was misplaced — but only if you mean it. Close with one sentence on where your own verdict rests on a contested reading of the literature. No bibliography, no citations. Structure: a one-sentence bottom line, then the ranked tensions, then the pairs that dissolve, then the cheapest revision. No more than 800 words.
reasoning: |-
  Alright, let's tackle this systematically. The user is a postdoc in evolutionary biology preparing a "where I stand" statement on levels of selection, and they want it stress-tested. They've listed eight commitments, and something feels off to them. 

  First, I need to understand their perspective. They're deeply embedded in the levels-of-selection literature—replicator/vehicle distinction, Price equation, contextual analysis. They reject "it's just convention" as a conversation-ender. Their eight points cover a range: replicators as beneficiaries (1), partitions as bookkeeping (2), empirical reality of group traits (3), causal fidelity in partitions (4), two cases of symbiosis (5-6), the historical shift in group selection views (7), and Price equation as framework (8).

  Hmm. The tension screams between points 1 and 5. Commitment 1 insists only genes can be units of selection due to fidelity/replication, but in Case A (obligate vertical symbiosis), they want to call the host-symbiont pair a single unit. That’s a direct contradiction. If genes are the only beneficiaries (1), how can a transient pair be a unit? The symbiont pair isn’t a replicator—it doesn’t faithfully copy itself. This isn’t just semantics; it undermines their entire replicator-centric view. 

  Then there’s point 7—they call the rejection of "for-the-good-of-the-species" a substantive correction, not just notation. But if group selection is merely descriptive (per point 2), how can its rejection be empirical? Either group selection is real (contra 2) or the rejection was just switching frameworks (contra 7). They can’t have both. 

  Point 8 adds fuel: Price equation is just bookkeeping until causally interpreted. But if partitions are conventional (2), causal fidelity (4) becomes arbitrary—why prefer one partition over another if they’re all bookkeeping? And in Case B, they say level of selection "shifts," implying causal reality, yet point 2 denies empirical content to "does selection act at group level?" 

  The less severe tensions: Point 3 (empirical reality of group traits) can coexist with point 2 if "group selection" is framed as emergent traits plus heritable variance, without claiming it’s a distinct *level* of selection. Point 4 (causal fidelity) is actually undermined by point 2—if partitions are conventional, why care about causal lumping? 

  The cheapest fix? Abandon point 1’s hardline "only genes are units." It’s doing the most damage. If they soften it to "replicators are key for cumulative selection, but functional integration can create higher-level units," Case A works, point 7 holds, and point 5 isn’t contradictory. The cost? They must accept that units aren’t defined solely by replication fidelity—functional integration matters too. That’s a foundational shift, but it salvages their intuition about symbiosis and major transitions. 

  My verdict rests on a contested reading: That major transitions create *new* units of selection via evolutionary individuality (à la Maynard Smith & Szathmáry), not just redescriptions. If replication fidelity is the only criterion, symbiont pairs can’t be units—but biology seems to demand otherwise. 

  Bottom line: Drop the gene-centric exclusivity (1) to resolve the core contradiction.
answer: |-
  ### Bottom Line  
  Commitment (1) must be abandoned; its strict gene-replicator exclusivity contradicts your substantive claims about higher-level units (5,7) and undermines the causal realism in (4,6,8), making it the most damaging flaw.

  ### Ranked Tensions (Most Damaging First)  
  1.  **Commitment (1) vs. (5) & (7):**  
      - **Conflict:** (1) asserts that *only* genes (as faithful replicators) are units of selection. Yet (5) claims the host-symbiont *pair* is a single unit in Case A, and (7) asserts major transitions involve a "real historical transfer of fitness" to higher-level units (e.g., multicellular organisms). If only genes are units, higher-level units cannot legitimately "accumulate" selection’s products or receive fitness.  
      - **Cost to Resolve:** Drop (1)’s exclusivity. This costs foundational gene-centrism but preserves your cases and major-transitions realism. Reframe: Replicators anchor inheritance, but functional integration (e.g., obligate symbiosis) can create higher-level evolutionary individuals.  

  2.  **Commitment (2) vs. (4), (6), & (7):**  
      - **Conflict:** (2) claims "does selection act at group level?" has *no empirical content* (mere "choice of description"). But (4) demands partitions track causal structure, (6) asserts a "genuine conflict of levels" in Case B, and (7) treats the rejection of group selection as "substantive empirical correction." If levels are *only* notational, causal fidelity (4) and empirical shifts (6,7) collapse into arbitrary framing.  
      - **Cost to Resolve:** Soften (2). Admit that while partitions are *formal* alternatives, causal structures (e.g., conflict in Case B) make certain levels empirically salient. Cost: Concedes that "level of selection" isn’t *purely* conventional when causal mechanisms differ.  

  3.  **Commitment (8) vs. (1) & (2):**  
      - **Conflict:** (8) requires causal interpretation of Price’s terms, but (1) predefines genes as the sole beneficiaries/units, and (2) implies partitions lack empirical stakes. If Price is causal, (1) cannot dogmatically restrict units, and (2) cannot dismiss levels as "merely descriptive."  
      - **Cost to Resolve:** Retain (8)’s causal emphasis, forcing (1) and (2) to accommodate context-dependent units (resolved by dropping (1)).  

  ### Tensions That Dissolve on Inspection  
  - **(3) vs. (2):** (3)’s empirical focus on group traits/heritability is compatible with (2). Even if group selection is "bookkeeping," identifying emergent traits remains empirical.  
  - **(5) vs. (6):** Cases A and B cohere. Functional integration (A) creates a unit; horizontal transmission (B) breaks integration, restoring conflict. No contradiction.  

  ### Cheapest Revision  
  **Drop Commitment (1)**. Replace it with: "Genes are the minimal replicators enabling cumulative selection, but functional integration (e.g., genomic fusion, obligate symbiosis) can create higher-level evolutionary individuals that become units of selection."  
  - **Why:** (1) is the keystone contradiction. Abandoning it resolves clashes with (5), (7), and (8), while aligning with (4)’s causal realism. (2) can then be nuanced: Partitions are *formally* equivalent but *causally* distinct when higher-level units emerge. Cost is low: You retain genes’ role without absolutism, and your cases/major transitions stand.  

  ### Where My Verdict Rests  
  It contests Dawkins-style replicator fundamentalism, instead siding with multilevel selection theory (MLS) where evolutionary individuality is defined by functional integration and aligned fitness interests, not replication fidelity alone.  

