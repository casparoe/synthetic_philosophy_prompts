answer: |-
  ### Brainstorming: Strongest Objections
  1. **Narrative Underdetermination**: Even granting evidentiary constraints on facts, multiple coherent narrative structures (tragedy, romance, satire) can organize the *same* verified facts, as per White. Evidence cannot dictate *which* plot-form applies.  
  2. **Archive as Construct**: The archive is not a neutral repository but a product of power, selection, and loss (per Derrida/Foucault). What "counts" as evidence is conventional, so constraints are circular.  
  3. **Meaning Resides in Shape**: Historical understanding depends on narrative emplotment’s cognitive and ethical dimensions. Evidence verifies atoms; narrative creates meaning—and meaning is never "found" evidentially.  

  ---

  ### Argument: The Anchoring Question and Categorical Disruption  

  The historicist injunction to show the past "as it really was" (Ranke) is not a claim to unmediated objectivity. It is, rather, a methodological revolt against *a priori* philosophical frameworks (Hegelian teleology, Comtean positivism) subordinating the particular to the universal. Ranke’s call demanded that historians permit unfamiliar sources to *discipline* their categories—not that they escape mediation altogether. Carr and White rightly dismantle the myth of perspectiveless history, but their critiques miss the slogan’s true target. When Ranke insists sources must "speak for themselves," he implies that archives can *break* imported schemata by forcing conceptual revision. This survives the constructivist insight that historians select facts and impose plots: one can grant both while insisting archives *constrain which plots remain viable*.  

  The substantive fault line thus concerns **anchoring**: does evidence bind only individual statements ("Caesar crossed the Rubicon in 49 BCE"), or also the narrative shape as a whole? I contend the latter, through **categorical disruption**—cases where documents invalidate the core categories underpinning a narrative, making its *structure* untenable.  

  #### Concrete Case: The Donation of Constantine  
  For centuries, medieval narratives of papal supremacy relied on the *Donatio Constantini*, a forged decree granting Pope Sylvester I temporal authority over Rome. This document anchored a narrative of *translatio imperii*: the Church inherited imperial legitimacy from Constantine, justifying the papacy’s political dominion. When Lorenzo Valla proved its forgery in 1440 (using textual anachronisms and historical incongruities), the discovery did not merely correct a fact. It collapsed the narrative’s *foundation*. Post-Valla, no credible historian could emplote the papacy’s rise as a continuous, legally grounded inheritance of imperial power. The narrative shape—a seamless transfer of authority—was abandoned because the archive destroyed its categorical premise (the Donation’s validity). This was evidential, not fashionable: Valla’s philological methods exposed material inconsistencies within the document itself, making the plot *structurally impossible* to sustain.  

  #### Answering the Constructivist Replies  
  1. **"The Archive is Conventional; Therefore Anchoring Fails"**  
     Granted, archives are shaped by power, preservation bias, and epistemic conventions. Yet this does not negate anchoring. The constraint operates *internally*: within any given archival framework (however constituted), evidence introduces *resistances*. The Donation’s 8th-century Latin phrases conflicted with 4th-century norms—a disruption visible *within* the conventions of philology. Conventions enable judgment; they do not preclude it. The archive may be constructed, but it remains a site of *encounter* with traces that defy expectation. When a source’s materiality (ink, parchment, syntax) contradicts a narrative’s logic, the narrative fractures—not by fashion, but by the weight of its own contradictions.  

  2. **"Meaning Lives in Shape; Evidence Cannot Settle It"**  
     True, narrative shape generates historical meaning—but not infinitely. Evidence sets *boundary conditions*: it determines which shapes are *impossible* without falsification. After Valla, a narrative of papal power rooted in Constantinian donation became unsustainable. Historians could craft new plots (e.g., the Church as a pragmatic political actor), but the *old plot* was evidentially foreclosed. The cognitive content of history indeed emerges from emplotment, but only within the space of *categorically coherent* possibilities. When archives disrupt core categories (e.g., "the Donation is authentic"), they exclude entire narrative genera.  

  ---

  ### Conclusion  
  The anchoring question reveals history’s rigor: archives constrain not only facts but the *conceptual architecture* of narratives. This does not restore objectivism but locates historical discipline in the *dialectic* between trace and imagination. Carr and White exposed history’s constructedness; Ranke’s heirs exposed its receptiveness to correction by the alien past. The fault line is not construction versus realism, but *whether construction encounters limits in the archive*.  

  **My argument fails if one can show that archives never categorically disrupt narratives—if new evidence only ever adds or removes bricks but never forces redesign of the entire edifice.**
