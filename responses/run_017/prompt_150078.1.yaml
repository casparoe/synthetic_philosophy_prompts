prompt: |-
  I am a novelist, and my current book is set largely in the transplant unit of a near-future teaching hospital. I want the ethical argument in it to be technically right, not merely plausible-sounding, so I need help from someone who can hold the philosophy and the clinical facts at once.

  Please take the role of a philosopher of medicine who sits on a hospital ethics committee: precise about distinctions, unwilling to settle anything with a slogan, and willing to tell me when a character is scoring a rhetorical point rather than an argumentative one. Before you adjudicate, spend a short preliminary paragraph listing the distinctions you intend to rely on — organism-as-a-whole versus personhood or higher-brain accounts of death; discovery versus decision in the determination of death; the difference between a criterion and a test for it; and what the dead donor rule is supposed to protect — and say explicitly which of them each of my characters' moves is answerable to. Use no outside sources; reason from the concepts.

  Here is the material. Two of my consultants — Dr. Vance, a neurointensivist, and Dr. Okoro, a philosopher of medicine — got into an argument about two scenes I showed them, and I have reproduced it as evenly as I can.

  Scene one: Mira, thirty-four, was declared dead nine weeks ago by neurological criteria after a catastrophic brain haemorrhage. Because she was eleven weeks pregnant, the hospital kept her body on an experimental "somatic support protocol" — extracorporeal oxygenation plus hormonal replacement — in the hope of bringing the fetus to viability. Her body has maintained blood pressure and temperature, healed a surgical wound, and carried a pregnancy that is, on the scans, developing normally.

  Scene two: Elias, fifty-eight, suffered a devastating stroke but was not brain dead. Life support was withdrawn at his family's request; his heart stopped; after the standard waiting period he was declared dead by circulatory criteria and the theatre prepared for organ recovery — at which point his heart resumed a spontaneous rhythm. The recovery was abandoned and he was readmitted to intensive care.

  Their exchange, in seven moves:

  1. Vance: Mira is dead, and there is nothing exotic about it. Death is the irreversible loss of the organism's capacity to function as an integrated whole; the brain is the integrator; without it you have tissues kept going locally, not a human organism. A pregnancy can continue because the uterus sustains the fetus — the fetus is a passenger, not a part integrated with Mira.

  2. Okoro: Then explain nine weeks of wound healing, thermoregulation and a pregnancy carried toward viability. Those are achievements of the organism as a whole, not of an organ in a bath. If the body can still do this, what died was not the organism but the person — the subject of consciousness. So neurological criteria quietly rest on a higher-brain rationale that you never argued for, and Mira's body is a live counterexample to the rationale you did give.

  3. Vance: Homeostasis driven by a machine that replaces the brain is not self-integration; stop the protocol and the body falls apart within hours. And nobody thinks a ventilated body is alive. Besides, if you go higher-brain you get results nobody will accept: permanently unconscious patients who breathe on their own would count as dead.

  4. Okoro: The first half of that concedes too much: if dead means would disintegrate once the machines stop, then death becomes technology-relative, and a better protocol would make the very same body alive again. The second half is a prediction about public opinion, not an argument, and the unpalatability of the higher-brain view does not repair the organismic one. So let us be honest: neither rationale is doing the work. What does the work is a decision — we treat certain losses as death because of what we want to be able to do afterwards.

  5. Vance: That is precisely why Elias is not a scandal. On circulatory criteria, irreversible means it will not reverse of its own accord and we have decided not to reverse it. Autoresuscitation is a rare failure of prediction, handled by revising the waiting period. That is a discovery that went wrong, not evidence that the criterion is a convention.

  6. Okoro: But prediction and decision are entangled. Elias's waiting period was fixed partly by how long organs tolerate warm ischaemia, and it was a transplant team that was waiting. So the determination tracks our retrieval interests, and if that is acceptable — I think it can be — then the dead donor rule is not the deep moral constraint everyone pretends it is. What matters morally is that Elias consented, that he was beyond recovery, and that organ removal did not wrong him.

  7. Vance: Say that in public and you destroy the practice; patients will conclude that signing a donor card licenses surgeons to kill them. The dead donor rule has to be upheld as a public standard even if its rationale is messier in a seminar than in the guidelines. And anyway Mira is dead under both ordinary criteria, so your scene can keep her declared dead and leave the pregnancy question open.

  What I want: rate each of the seven moves on a scale from clearly mistaken to clearly right, with one short paragraph of justification each, distinguishing the parts of a move that succeed from the parts that do not (several moves are mixed). Then give me, in under 250 words, an overall verdict on who is more right about what, and — the part I care about most as a novelist — a note on what both of them are missing, and what the strongest unmade move on each side would be, so that I can end the scene honestly rather than letting the more fluent character win by volume.
reasoning: |-
  Okay, the user is a novelist working on a book set in a transplant unit, and they need help ensuring the ethical arguments are technically accurate. They've provided a debate between two consultants, Dr. Vance and Dr. Okoro, about two scenarios involving death determination and organ donation. The user wants each move rated, an overall verdict, and insights into what's missing in the arguments.

  First, I need to recall the key distinctions in philosophy of medicine: organism-as-a-whole vs. personhood/higher-brain death, discovery vs. decision in death determination, criterion vs. test, and the dead donor rule's purpose. These will frame my analysis of each move.

  Looking at Vance's first move: He argues Mira is dead based on irreversible loss of integrated biological function. This correctly applies the organismic standard but oversimplifies by ignoring the body's sustained functions. The pregnancy as a "passenger" metaphor is useful but dismisses observed physiological integration.

  Okoro's counter in move 2 points out Mira's body healing wounds and maintaining pregnancy. This effectively challenges Vance's organismic claim but wrongly conflates machine-sustained functions with self-integration. The higher-brain critique is valid but could be strengthened by addressing integrated functions more directly.

  Vance's response in move 3 defends the irreversibility standard but relies too much on public opinion. The technology-relative point is crucial but not fully explored. His concern about higher-brain implications is practical but philosophically weak.

  Okoro's move 4 correctly identifies the technology-relativity problem but overstates the "decision" aspect. The distinction between criterion and test is vital here - irreversibility is the criterion, technological capability affects the test.

  Regarding Elias' case (move 5), Vance explains irreversibility correctly as contextual prediction. His dismissal of "convention" is apt since medical criteria often involve such judgments.

  Okoro's move 6 insightfully notes how retrieval interests shape practice but dangerously conflates this with the moral justification. The dead donor rule exists precisely to prevent this perception.

  In move 7, Vance's pragmatic concern about public trust is valid but risks being an appeal to consequences. His "both criteria" point about Mira is factually correct but dodges the pregnancy dilemma.

  Both miss crucial nuances: the difference between spontaneous and supported integration, and how somatic support creates novel categories. The strongest unmade arguments would be Vance explaining why machine-sustained functions don't count as organismic integration, or Okoro arguing that consent-based frameworks could replace the dead donor rule if properly implemented.

  For the novelist, highlighting these gaps could create richer conflict - perhaps showing Vance struggling with borderline integration cases, or Okoro acknowledging how abandoning brain death could undermine transplant systems. The pregnancy scenario particularly exposes cracks in current criteria that neither fully addresses.
answer: |-
  Here is your analysis, structured as requested:

  **Preliminary Distinctions:**  
  1. **Organism-as-a-whole vs. Personhood/Higher-Brain Death:** Death as the irreversible cessation of integrated biological function (organism) vs. irreversible loss of consciousness/personhood (higher-brain).  
  2. **Discovery vs. Decision:** Whether death is a biological fact we *discover* or a status we *decide* based on criteria aligned with practical/ethical goals.  
  3. **Criterion vs. Test:** The *criterion* defines death (e.g., irreversible loss of circulatory or brain function). The *test* operationalizes it (e.g., a 5-minute circulatory wait, EEG silence).  
  4. **Dead Donor Rule (DDR):** Organs may only be procured from the dead. It protects against killing for organs and maintains public trust.  

  **Ratings & Justifications:**  

  1. **Vance (Move 1): Mostly Right.**  
     *Succeeds:* Correctly states the organismic rationale and the brain's role as integrator. The "passenger" analogy for the fetus is apt.  
     *Fails:* Downplays Mira's sustained somatic functions (healing, thermoregulation, pregnancy maintenance) which *appear* integrative. Doesn't address *how* integration is defined mechanistically beyond the brain.  

  2. **Okoro (Move 2): Partially Right/Partially Mistaken.**  
     *Succeeds:* Effectively challenges Vance by highlighting Mira's somatic functions as evidence against complete organismic disintegration. Correctly identifies Vance's potential unstated reliance on a higher-brain rationale.  
     *Fails:* Overstates the case. Mira's functions are machine-sustained and *responsive*, not self-initiating or adaptive. The body is *reacting*, not *integrating* new stimuli/stressors autonomously. Calling it a "live counterexample" ignores the artificiality of the support.  

  3. **Vance (Move 3): Mixed.**  
     *Succeeds:* Correct on technology-relativity of disintegration. Spot-on about the highly counterintuitive consequences of higher-brain death (declaring PVS patients dead).  
     *Fails:* "Nobody thinks a ventilated body is alive" is a rhetorical appeal, not an argument. The core challenge (are Mira's sustained functions *meaningfully* integrative?) remains unanswered.  

  4. **Okoro (Move 4): Insightful but Incomplete.**  
     *Succeeds:* Correctly identifies the technology-relativity problem for irreversibility and disentangles public opinion from argumentative validity. Highlights the crucial "discovery vs. decision" tension.  
     *Fails:* Overcorrects. While *application* involves decisions, the underlying biological criterion (irreversible loss of function) aims for discovery. Dismissing both rationales as "not doing the work" is too sweeping.  

  5. **Vance (Move 5): Clearly Right.**  
     *Succeeds:* Precisely explains "irreversible" in circulatory criteria: "will not reverse *of its own accord* and we *decide* not to resuscitate." Elias *is* a prediction failure (test), not a criterion failure.  
     *Fails:* N/A. This is a strong, accurate defense of standard practice.  

  6. **Okoro (Move 6): Partially Right/Partially Mistaken.**  
     *Succeeds:* Correctly notes the entanglement of retrieval interests with *how* the test (waiting period) is defined. Raises a valid moral question about consent and harm vs. the DDR.  
     *Fails:* Conflates *test design* (influenced by feasibility) with the *criterion* itself. Argues *past* the DDR ("did not wrong him") without addressing the core prohibition: *causing* death via organ retrieval. Weakens the firewall the DDR provides.  

  7. **Vance (Move 7): Mostly Right (Pragmatically) / Evasive (Theoretically).**  
     *Succeeds:* The public trust argument is valid and crucial. Correct that Mira meets current criteria.  
     *Fails:* Evades the deeper theoretical challenge Mira poses to the *meaning* of "organism" under somatic support. "Leave the pregnancy question open" avoids confronting the ethical novelty Mira represents.  

  **Overall Verdict (243 words):**  

  Vance wins on **defending standard clinical criteria and their practical application.** He correctly explains circulatory death (Elias) and why Mira *is* dead by current neurological criteria. His focus on public trust and the dangers of abandoning the DDR is pragmatically essential. However, he **sidesteps the profound challenge Mira's case poses** to the organismic rationale's coherence under prolonged artificial somatic support.  

  Okoro wins on **exposing theoretical tensions.** He effectively highlights the technology-relativity of "irreversibility" and the potential inconsistency in Vance's organismic account when faced with Mira's somatic persistence. He correctly identifies the "discovery vs. decision" dynamic and challenges the DDR's absolutism. However, he **overreaches** by dismissing both core rationales and dangerously downplays the moral necessity of the DDR as a prohibition against *causing* death for organs.  

  **What They're Missing & Unmade Moves:**  

  *   **Both:** Fail to rigorously distinguish **spontaneous, adaptive integration** (life) from **machine-sustained, reactive physiology** (Mira). Vance needs to argue that Mira's functions are merely *residual cellular/tissue activity* orchestrated by machines, not evidence of *organism-level agency or self-preservation*.  
  *   **Vance's Strongest Unmade Move:** "Mira's 'healing' and 'thermoregulation' are passive responses to artificial inputs mimicking neural/hormonal signals. Without the protocol *dictating* these responses, no new environmental challenges are met. True integration requires *adaptive* capacity, which died with her brain."  
  *   **Okoro's Strongest Unmade Move:** "The DDR *is* a useful rule of practice, but its moral force comes from preventing *harm* and respecting *autonomy*, not a metaphysical line. If we accept Mira is dead yet sustain her for the fetus, or Elias was beyond recovery and consented, procuring organs without *causing* their deaths doesn't wrong them. The real constraint is valid consent and futility, not the timing of organ removal relative to a biologically fuzzy threshold."  

  Use Vance's clarity on current practice and public trust, but let Okoro's challenge to the biological rationale linger unresolved – it reflects the genuine philosophical tension your scenario creates.
