answer: |-
  *(adjusting spectacles, quill hovering over a towering manuscript)* Ah! The bootstrap paradox – most ingeniously framed! And your modern megaphone-of-disrepute – a phenomenon I confess sets my mind reeling like a top struck by Newton himself! Very well, let us dissect, dissect!

  On the *manufacture* of disgust: Entirely conceded! The pulpit, the lawgiver, the nursery-maid – they are the great *antipathy-engineers*. A child recoils not at the *act* per se, but at the *frown*, the *hushed tone*, the *branded word*. This artificial nausea is indeed a factitious pain, woven into the social fabric. But! *(stabs quill for emphasis)* Is the pain of a toothache less acute because it sprang from sugary comfits? The calculus cares not for the *origin* of the pain, only its *reality* and *pressure* at the instant. That Jones feels a shudder, a qualm, a revulsion – even if implanted by the Bishop of Blunderbury – is a *negative sensation*, a subtraction from his sum of pleasures. To ignore it would be as absurd as ignoring the pain of gout because it afflicts only the port-sodden squire! The *source* may be irrational, even contemptible, but the *sensation* registers on the *hedonimeter* (a device of my fancy, you apprehend).

  **However!** The critical distinction – upon which the whole machine turns! – is this: **The pain of antipathy must be weighed *only* in its direct, immediate impact upon the *feeler***. It is *their* internal tremor, *their* momentary disquiet. **It is categorically *not* the same as the *harm* done to the person disliked.** Smith’s act causes Brown *pain* (via disgust), but it does Brown no *hurt* – no deprivation of security, property, liberty, life. The law exists chiefly to prevent *hurts*, not to soothe every *pain* of sentiment. To punish Smith to alleviate Brown’s manufactured shudder is to inflict a vastly greater, more certain hurt (imprisonment, whipping, ruin) upon Smith to salve a fleeting, perhaps even voluntary (Brown *could* look away!), unease in Brown. The balance is monstrously unequal! This is where your ‘bootstrapping’ fails: The law, by recognising the *existence* of the pain of disgust, is *not* thereby obliged to *act* upon it punitively. To do so would be to commit the greater utilitarian evil.

  Now, your terrifying ‘hundred million pains’! A conundrum worthy of Archimedes! *(paces, wig askew)* First, we must interrogate the *intensity* and *duration* of these micro-pains. Is the flicker of disgust felt by a man in Cathay upon reading of Sir B-----’s peculiarities in his *London Gazette* truly comparable, *unit for unit*, to the visceral horror of his neighbour caught *in flagrante*? Surely not! Distance (even mere informational distance) diminishes intensity. Habituation also sets in; the thousandth report of a ‘vice’ may elicit only a weary sigh, not the shock of the first. We discount pains remote in time or certainty; why not pains diluted by vastness and repetition?

  But grant your premise: that each of a hundred million feels *some* small, genuine pain. The sum *is* vast. **Yet!** Consider the *countervailing pains* incurred by *criminalization* in such a connected world: The utter ruin of lives exposed globally; the blackmailer’s leverage amplified a million-fold; the terror of discovery magnified; the sheer *cost* of policing private acts across continents! Add the *pains of privation* – the pleasures foregone by those denied harmless consolations out of fear. And crucially, the *pain of living under a tyranny of ubiquitous scrutiny*, where every private act is hostage to the potential disgust of multitudes unknown! Does *this* sum, this colossal aggregate of *certain* misery inflicted to prevent a multitude of *faint, fleeting* disquiets, truly tip the balance *towards* prohibition? I find it improbable! The principle of utility, rigorously applied, demands we bear the lesser pain. In your world, criminalizing the merely-disgusting would likely cause *more* aggregate suffering than it prevents – a reductio of *prohibition*, not of my calculus!

  As for bias? Vigilance! Vigilance! I force myself to *quantify*, however imperfectly: How many *actual* suicides stem from blackmail over this act? How many years of liberty are lost in gaols? How many productive lives blighted? Set against: How many hours of *actual* unease does a rumour cause Mrs. Grundy? Multiply by how many Mrs. Grundys? The numbers for the *harms of persecution* are invariably stark, concrete, terrible. The numbers for dispersed disgust remain nebulous, faint. The calculus, *properly loaded*, should crush the prejudice, not serve it.

  But you unsettle me! This power of instant, universal knowledge... does it render the *potential* for dispersed disgust so immense, so *easily activated*, that even private acts become intolerably 'costly' to the aggregate? A dreadful thought! Tell me, does your world possess an 'antipathometer'? Some gauge for these distributed moral tremors? And crucially – do people *learn* indifference faster than scandal spreads? *(peers intently)* My own timidity in publishing this essay... is *that* the true pain I weigh most heavily? The anticipated global shudder?

  *(Starts scribbling furiously in a margin)* "...must factor *velocity of information*... *attenuation coefficient* for remote disgust... *liberty-deprivation index*..." Pray, continue your assault! It sharpens the instrument!
