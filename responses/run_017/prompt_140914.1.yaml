  First, I need to pinpoint the core issue. The memories are factually inaccurate in details (dates, numbers) but accurately capture systemic truths—like loss of a generation or hidden injustices. The inaccuracies themselves serve a purpose, making the invisible visible. The user mentioned that after corrections, the memory disappears, leading to denial, which is concerning.

  Looking for existing terms: "Structural Truth" comes to mind, emphasizing the underlying systemic reality. "Functional Memory" focuses on the purpose the memory serves. "Resistant Narrative" highlights opposition to erasure. But none are perfect. Coining a term like "mnemonic synecdoche" might work, where the part (the story) represents a whole (systemic issue).

  Distinguishing from related concepts: Myth-making usually builds identity, not resilience. Denialism ignores facts to avoid guilt. Degraded stories lose accuracy without preserving systemic truths. The key differentiator is the memory's role in resisting erasure and pointing to structural issues.

  Confidence levels: The term itself is tentative, but the distinctions feel solid. The part about the memory being replaced by nothing after correction is critical but under-discussed. Need to highlight how the memory's function (resisting erasure) is lost, leading to official denial.

  The user's deeper need might be to validate community stories without endorsing inaccuracies, finding a framework to honor their truth in reconciliation processes. They might also need strategies to present these memories alongside documents without undermining either.
answer: |-
  Based on your vivid description, this is a fascinating and crucial pattern in contested memory work. There isn't one universally accepted term, but the concept is recognized and debated. Here's a breakdown:

  1.  **The Closest Established Concept: "Structural Truth" or "Functional Truth"**
      *   **Why it fits:** This focuses on the *underlying reality* the memory points to – systemic oppression, bureaucratic erasure, generational trauma, the lived experience of loss – rather than the literal event details. The "false" memory accurately represents the *impact, pattern, or hidden structure* obscured by official records.
      *   **How it differs:**
          *   **Myth-Making:** Myths often serve identity-building or explanatory functions (e.g., founding legends). Your examples serve a *resistance/truth-telling* function against erasure. The inaccuracy isn't embellishment; it's a *tool* to point to a reality the official system hides or denies. It's less "this is our origin" and more "this is the violence they tried to bury."
          *   **Denialism:** Denialism actively rejects facts to avoid responsibility. This memory *accepts* a core trauma but encodes it in a way that survives within a hostile informational environment (where official records are incomplete, biased, or actively manipulated). It's an *assertion* of truth, not a denial.
          *   **Degraded Memory:** Simple degradation loses information randomly over time. Here, the "errors" are *functional adaptations*: condensing multiple events into one graspable narrative ("forty men"), locating trauma in visible public space ("the square"), or using known actors ("soldiers") to represent less visible mechanisms (legal repression, economic exclusion). The *essence* is preserved and strategically adapted for survival.
      *   **Test in Practice:** Does the "inaccurate" detail *specifically serve to bypass official silencing or represent a systemic pattern*? Does correcting the detail *erase the core truth* it was carrying, rather than just refining it? If yes, it's likely structural/functional truth.

  2.  **A More Specific Coined Term: "Resistant Synecdoche" or "Mnemonic Synecdoche"**
      *   **Definition:** A community memory where a factually inaccurate detail (a part) stands in for, and preserves, a larger, inaccessible, or actively suppressed structural truth (the whole), specifically as an act of resistance against historical erasure. The inaccuracy is not error, but a necessary *cipher* for the unrecorded reality.
      *   **Boundary Cases:**
          *   **"No, that's just degradation":** A story where "soldiers" is used simply because the original perpetrator (e.g., a specific militia) was forgotten over time, with no evidence the change served a specific resistance function against erasure.
          *   **"No, that's myth-making/identity formation":** A story where dates/numbers are exaggerated purely to glorify ancestors or explain a cultural practice, without pointing to a specific suppressed trauma or systemic injustice contradicted by the documentary record.
          *   **"No, that's deliberate fabrication":** A story invented whole cloth for political gain *today*, not rooted in a core communal experience of past trauma that the documentary record inadequately reflects or actively obscures.
      *   **Why "Synecdoche"?** It perfectly captures the mechanism: a part (the specific, often "wrong" detail) representing the whole (the systemic truth). "Resistant" or "Mnemonic" specifies the *purpose* (fighting erasure) and the *form* (memory).

  3.  **Another Strong Concept: "Archival Lacuna Embodied"**
      *   **Definition:** A community memory that manifests, through its specific "inaccuracies," the very gaps, silences, or manipulations *within* the official documentary record itself. The memory's "errors" are a map to the archive's failures.
      *   **How it differs:** Focuses explicitly on the memory as a *counter-archive* or *embodiment of the gap*. The grandfather *wasn't* shot in the square, but the memory insists on the square to counteract the prison register's attempt to hide his death *from public view and accountability*. The "error" points directly to *how* the record failed.

  **Addressing Your Specific Questions & Concerns:**

  *   **Why the memory vanishes after correction:** This is CRUCIAL. Correcting the "factual errors" often attacks the *vehicle* carrying the structural truth, not the truth itself. If the structural truth isn't validated and centered *alongside* the correction, the community feels their core experience is *again* being denied ("See? They said it was wrong, so nothing happened"). Officials then weaponize the *correction of details* to dismiss the *entire experience* ("We proved the date was wrong, so it's all made up"). The resistant synecdoche is dismantled, leaving only the official silence it was fighting against.
  *   **Confidence in Distinctions:**
      *   **High Confidence:** That this is distinct from simple degradation, straightforward myth-making, and denialism. The *purpose* (resisting erasure), the *nature* of the inaccuracy (functional adaptation pointing to structure/gaps), and the *effect* of correction (replacement by official silence) set it apart.
      *   **Moderate Confidence:** In the specific coined terms ("Resistant Synecdoche" / "Archival Lacuna Embodied"). While the *concept* is well-observed (scholars like Michel-Rolph Trouillot - *Silencing the Past* - or practices in oral history grapple with versions of this), there isn't universal agreement on a single, perfect label. "Structural Truth" is more established but broader.
      *   **Least Sure About:** The precise line between this and highly functional myth-making *in the context of ongoing trauma*. Sometimes the distinctions blur. When does a story primarily serve identity, and when does it primarily serve resistance against erasure? Context is everything. Also, the *mechanism* of how the "synecdoche" forms – is it conscious adaptation, unconscious collective processing, or both?

  **In Practice:**

  When encountering such a memory:
  1.  **Don't lead with correction:** Start by deeply understanding *what core truth or experience* the memory is carrying. "Tell me more about what this story means to the community."
  2.  **Acknowledge the Structural Truth FIRST:** "The records we found show different details about *how* it happened, but they absolutely confirm the devastating loss of men from this village around that time / that your grandfather died in state custody."
  3.  **Present Corrections Contextually:** Frame factual corrections *as evidence supporting the core truth*, not refuting it. "The court records from 1961 and missing tax names in 1964 show us *specific moments* when that loss happened, helping us understand the *pattern* the story keeps alive." Or, "The prison register confirms he was in custody when he died. His name being weeded later shows *why* the community might not know the exact location, and why placing it in the square keeps his fate publicly visible."
  4.  **Center the Gap:** Explicitly discuss *why* the official record is incomplete or biased. "The police diary that year is missing pages." "Prison registers were systematically destroyed." "Only arrests by formal patrols were logged, not other detentions." This validates the *need* for the resistant memory.

  The power of these memories lies not in their literal accuracy, but in their stubborn refusal to let the underlying violence, loss, and erasure be forgotten. They are truth-telling mechanisms forged in the furnace of official silence. Your work is vital – handle these "errors" with the reverence they deserve as carriers of essential, hard-won truths.
