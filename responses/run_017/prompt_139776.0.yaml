  ### Diagnostic Tree for the Metaphysics of Modality  
  **Instructions:** Answer each question based on your intuitive judgments about the cases described. Do not rely on prior knowledge of philosophical positions. Use unambiguous ordinary language.  

  #### The Tree  
  1. **Are there truths about what is possible or necessary that hold independently of what anyone can know, verify, or stipulate?**  
     - **Yes** → 2  
     - **No** → 8  

  2. **(If yes to 1) Are these modal truths made true by something non-modal?**  
     - **Yes** → 3  
     - **No** → **Leaf A: Brute Primitivism**  
       *Most awkward commitment: Modal facts (e.g., "Gold could have been a compound") are fundamental and inexplicable—no deeper explanation exists.*  

  3. **(If yes to 2) Consider a fundamental property that nothing actual instantiates and that nothing actual could possibly instantiate (e.g., a property wholly alien to actual physics). Could such a property exist?**  
     - **Yes** → 4  
     - **No** → 5  

  4. **(If yes to 3) Are the truthmakers for modal truths concrete things (like physical objects or events) that are not part of the actual world?**  
     - **Yes** → 6  
     - **No** → 7  

  5. **(If no to 3) Are the truthmakers for modal truths abstract entities (e.g., sets, propositions, or models) or features of the actual world (e.g., natures or rearrangements of actual things)?**  
     - **Abstract entities** → 9  
     - **Features of the actual world** → 10  

  6. **(If yes to 4) Is every possibility (consistent with logic) realized by some concrete world?**  
     - **Yes** → **Leaf B: Concrete Modal Realism**  
       *Most awkward commitment: Countless concrete worlds exist, each as real as ours, with their own space-times and entities (e.g., a world where you have wings).*  
     - **No** → **Region X: Concrete Plurality without Plenitude** (Unoccupied)  
       *Diagnosis: This view fails because it cannot explain why only *some* recombinations of world-constituents are "allowed" without smuggling in unreduced modality (e.g., "possible worlds are those satisfying..."). Modality re-enters at the selection principle, undermining the reductive advantage. Region X is empty because it is unattractive—it loses the core benefit of concrete realism.*  

  7. **(If no to 4) Can there be partial possibilities—ways things could be that do not settle every question (e.g., "There might be a blue sphere" without specifying its size)?**  
     - **Yes** → **Leaf C: Propositional Ersatzism**  
       *Most awkward commitment: Abstract "worlds" (e.g., sets of propositions) represent possibilities, but the representation relation relies on primitive modality (e.g., "proposition P *could* represent a blue sphere").*  
     - **No** → **Leaf D: Linguistic Ersatzism**  
       *Most awkward commitment: Worlds are maximal consistent sets of sentences, but this cannot describe possibilities inexpressible in any actual language (e.g., alien properties).*  

  8. **(If no to 1) When we say, "It is possible that there might have been nothing concrete at all," are we describing a genuine fact?**  
     - **Yes** → **Leaf E: Fictionalism**  
       *Most awkward commitment: We speak *as if* other worlds exist (e.g., "a world with no concrete objects"), but this is a useful fiction—no literal truth corresponds to it.*  
     - **No** → **Leaf F: Deflationary/Expressivist Rejection**  
       *Most awkward commitment: Modal claims (e.g., "Tables could be plastic") express non-factual attitudes (e.g., rules of language), yet the theory itself relies on modal idioms (e.g., "We *can* reinterpret sentences").*  

  9. **(If abstract to 5) Are these abstract entities composed of linguistic items (e.g., sentences)?**  
     - **Yes** → **Leaf D: Linguistic Ersatzism** (as above)  
     - **No** → **Leaf C: Propositional Ersatzism** (as above)  

  10. **(If features of actual world to 5) Consider a wooden table: could *this very table* have been made of entirely different material (e.g., plastic) without being a different table?**  
      - **Yes** → **Leaf G: Combinatorial Reduction**  
        *Most awkward commitment: Every possibility arises from recombining actual constituents, but this cannot accommodate alien properties (e.g., a fundamental force unlike any actual one).*  
      - **No** → **Leaf H: Grounding in Essences or Causal Powers**  
        *Most awkward commitment: Modal truths stem from the essences of actual things (e.g., "Gold is essentially element 79"), but essences are obscure and epistemically inaccessible.*  

