answer: |-
  Here's the requirements list, your tie-breaking probe analysis, and a scored position—taking stands as requested. No shrugs, British spellings, or citations.

  ---

  ### **Core Requirements for a Theory of Temporal Experience**
  *(Non-negotiable in **bold**; negotiable in plain)*

  1.  **Explain Temporal Illusions**: Account for cases like color phi, tactile funneling, and stopped-clock illusions without contradiction. *Non-negotiable.*  
  2.  **Specify Neural Correlates for Timing Judgments**: Identify which neural events correspond to a subject's report (e.g., "change NOW") in experiments. *Non-negotiable for empirical science.*  
  3.  **Allow for Subjective Error**: Explain how a subject can be *wrong* about when they experienced something (e.g., Libet readiness potential vs. urge timing). *Non-negotiable—phi breaks infallibility.*  
  4.  **Respect the Distinction**:  
      -   **Time-of-Processing** (when the brain computes event "X") vs. **Time-Represented** (when "X" seems to happen in experience). *Non-negotiable.*  
      -   **Delay** (experience lags stimulus) vs. **Editing** (content is revised post-hoc). *Crucial for phi.*  
  5.  **Handle Feature-Specific Timing**: Explain why color, motion, and location in phi might not share a single "timestamp" (e.g., motion computed before color change). *Non-negotiable—phi demands it.*  
  6.  **Avoid Backward Causation**: No event at time *t* can influence experience *before t*. *Non-negotiable—metaphysical constraint.*  
  7.  **Empirical Decidability (in principle)**: Theories must make testable predictions. *Negotiable—some theories (e.g., radical constructivism) reject this, but it's essential for your Purpose 1.*  
  8.  **Minimize "Multiplied Experiences"**: Avoid positing redundant conscious drafts (e.g., both "red-at-A" and "moving-green" fully experienced). *Negotiable—preference for parsimony, not strict requirement.*  

  ---

  ### **Your Phi Probe Experiment: Why It Fails to Break the Tie**
  -   **Design**: Subject sees phi sequence (red flash at A → green flash at B), then a probe (click/third dot) at delay *d* after first flash. Reports "had color changed by probe time?" Sweep *d*.  
  -   **Hope**: A sharp switch in reports at *d < t_B* (where *t_B* is actual second flash time) suggests online readout of color-change timing, favoring Stalinesque (change composed early).  
  -   **Fatal Flaw**: The probe's *own* experienced time is subject to the same postdictive mechanisms as the phi event. The brain:  
      1.  Receives the probe signal at *t_p*.  
      2.  Adjusts its timing relative to the *constructed* phi event (color-change mid-trajectory).  
      3.  Outputs a consistent temporal order ("color changed before probe") regardless of whether editing (Orwellian) or early composition (Stalinesque) occurred.  
  -   **Result**: You measure consistency in the *narrative draft*, not the "real time" of either event. **No probe design (metacontrast, saccades, ERPs) breaks this recursion.** The tie is unbreakable due to the *measurement problem*: any probe is integrated into the same temporal construct.  

  ---

  ### **The Unbreakable Tie is Metaphysical**
  -   **Why?** Temporal experience is a *constructed property*, not a direct readout. There is no "finish line" timestamp for contents to become conscious. The brain generates a temporally coherent model, binding inputs within a processing window (∼100-300ms). "When" an event happened *in experience* is determined by its role in this model, not by when neural processing peaked.  
  -   **Implication**: The Stalinesque/Orwellian distinction collapses. Both are just descriptions of *how* binding occurs within the window. "Editing" vs. "early composition" is a false dichotomy.  

  ---

  ### **Key Exclusions & Conflicts**
  -   **Most Exclusionary Requirement**: **#6 (No Backward Causation)**.  
      -   Kills "pure Orwellian" theories where a later stimulus (green at B) retroactively edits a past conscious state (red at A).  
      -   Forces theories to treat temporal experience as a *forward-flowing construction process*.  
  -   **Fatal Conflict Trio**:  
      1.  **Subjective Authority** (subject can't be wrong about timing)  
      2.  **No Backward Causation**  
      3.  **Phi Illusions Exist**  
      *You can only keep two.* Phi + no backward causation forces rejection of subjective authority.  

  ---

  ### **Scorecard: Theories vs. Requirements**
  | Theory                     | Temporal Illusions | Neural Correlates | Subjective Error | Feature Timing | No Backward Causation | Decidability | Parsimony | Verdict |
  |----------------------------|-------------------|-------------------|------------------|----------------|------------------------|--------------|-----------|---------|
  | **Multiple Drafts**        | ✓                 | ✗ (rejects "correlate") | ✓                | ✓              | ✓                     | ✗            | ✓         | **Best fit** but rejects neural correlates as "finish line". |
  | **Global Workspace**       | △ (struggles with binding) | ✓                 | △                | ✗              | ✓                     | ✓            | ✓         | Fails feature-specific timing; GW ignition too coarse. |
  | **Snapshot/Specious Present** | ✓                 | △ (window unclear) | ✓                | △              | ✓                     | ✓            | ✓         | Handles phi but vague on neural implementation. |
  | **Cinematic (Cartesian Theater)** | ✗                 | ✓                 | ✗                | ✗              | ✗ (often allows retro-causation) | ✓            | ✗         | **Fails**: Assumes single timestamp, violated by phi. |
  | **Pure Orwellian Editing** | ✓                 | ✓                 | ✓                | ✓              | ✗ (requires retro-causation) | ✓            | ✗         | **Excluded** by No Backward Causation. |

  **✓** = Fully Satisfies | **△** = Partially Satisfies | **✗** = Fails

  ---

  ### **Commitments & Guesses**
  1.  **Genuine Requirements**: #1, #2, #3, #4 (sub-distinctions), #5, #6.  
  2.  **Negotiable**: #7 (decidability—necessary for science but maybe not metaphysics), #8 (parsimony).  
  3.  **Tie Unbreakable?**: **Yes**. Probes fail due to recursive postdiction. No design works.  
  4.  **Experience Location**: Features (color, motion) get *separate* processing timelines; binding creates a singular "specious present" (∼200ms window). No single broadcast deadline.  
  5.  **Guesses**:  
      -   Neural correlates for timing judgments exist but are *distributed* (e.g., ERP components like P300 mark salience, not "consciousness").  
      -   Blindsight/split-brain won't resolve phi—those systems lack access to the construct.  
      -   "When" is always inferred from the brain's causal model, not measured directly.  

  **The Punchline**: Timing of experience isn't a property to be measured—it's a *constraint satisfaction output*. Your theory must explain how the brain generates temporal coherence, not locate "when" it happens. Dennett's "no finish line" is correct, but not due to underdetermination—it's because temporal experience *is* the dynamic binding process itself.
