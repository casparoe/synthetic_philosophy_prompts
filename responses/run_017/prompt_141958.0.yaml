prompt: |-
  I am writing a long essay on the proverbial claim that revolutions devour their own children, and I want the French sequence from June 1793 to July 1794 to do real argumentative work in it rather than serve as decoration. So please analyze that sequence through the lens of the candidate mechanisms I sketch below, tell me which of them the case actually discriminates between, and say what the case does, in turn, to each of the three standard interpretive frameworks: class struggle, ideology, and contingency.

  The facts I am working from, so that nothing needs reconstructing: on 2 June 1793 the Convention, surrounded by Hanriot's National Guard, decreed the arrest of roughly twenty-nine Girondin deputies; Brissot, Vergniaud and the rest were guillotined on 31 October. In March 1794 the Hébertists, the dechristianizing, sans-culotte-aligned ultra-revolutionary flank, attempted an insurrection at the Cordeliers and were guillotined on 24 March. Twelve days later, on 5 April, Danton, Desmoulins and the Indulgents, who had been campaigning for an end to the Terror, went to the scaffold on charges of royalism and corruption. On 10 June the Law of 22 Prairial abolished defence counsel and witnesses before the Revolutionary Tribunal, capped trials at three days, restricted verdicts to acquittal or death, and, without saying so explicitly, stripped Convention deputies of the immunity that had previously required the Convention itself to vote before one of its members could be tried. Monthly executions in Paris rose from 155 in Germinal to 796 in Messidor, while acquittal rates stayed near a quarter of those tried. In late June the French victory at Fleurus removed the military emergency; in late July Robespierre, Saint-Just and Couthon were arrested and executed, and the apparatus of the Terror was then dismantled by the men who had staffed it.

  Here are the mechanisms I want distinguished, each of which could in principle generate the observed pattern:

  One, a purity spiral of competitive outbidding, in which the currency of political legitimacy is revolutionary virtue, moderation is indistinguishable from treason, and the standard ratchets because no faction can bid lower than its rivals without being consumed by them.

  Two, coalition contraction: revolutions are won by broad and internally incoherent coalitions, each purge removes a flank, and each removal raises the stakes of being next, so the winning coalition narrows monotonically toward a rump clique that is finally too small to defend itself.

  Three, instrumental autonomy: the revolutionaries build repressive instruments with their own personnel, budgets and esprit de corps, and the moment those instruments are legally unshackled from control by their creators, they acquire the capacity to eat them.

  Four, personnel selection: revolutions select for traits that are adaptive in the seizure of power and maladaptive in exercising it, so the pattern reflects who the process promotes rather than any dynamic it sets in motion.

  Five, the hypothesis I am partial to and most want stress-tested: that the visible presence of partly disloyal actors inside the ruling coalition is what makes a leadership's restraint credible and gives it an off-ramp, so that eliminating them destroys the capacity to de-escalate even when the leadership wants to, and the purge continues for commitment reasons rather than ideological ones.

  Six, the null hypothesis: prominent people die violently in violent times, we mostly study the revolutions that became violent, and the narrative shape of a devouring revolution is something we impose after the fact.

  What I want is a disciplined mapping rather than a survey. For each mechanism, say what the agent is, what the action variable is, and what it predicts about four features of the record: the ideological direction of successive purges, since the Hébertists and the Dantonists were killed within a fortnight of each other in opposite directions, which does not look like a spiral; the tempo, whether it should accelerate smoothly or jump at institutional changes such as Prairial; who survived and why, which is the cleanest test of the selection story; and how the sequence should end, whether by coup from inside the governing committees or by pressure from below. Tell me which of the six the case rules out, which two or three it leaves standing, and where the evidence is genuinely ambiguous. I am especially interested in what the acquittal rate and the immunity clause do to the instrumental-autonomy story, and in how much of the arc the Fleurus victory explains away as exogenous shock.

  Then turn the analysis around. Which of the three interpretive frameworks does this case most damage, and does any mechanism travel better across cases than the others? And since my essay's thesis needs to be more than an anecdote, tell me what the comparison class should be, what a revolution that did not devour its children would have to look like, and what observation inside the French case would have counted against each mechanism. Finally, be explicit about where all six are silent, including whether anything here explains why Thermidor came in July rather than in September. I would rather you mark the silence than make a mechanism speak.

  Please answer in continuous prose, roughly twelve hundred words, reasoning from the record I have given rather than from any reading list.
reasoning: |-
  Okay, the user is writing a long essay on the proverb that revolutions devour their own children, using the French Revolution from June 1793 to July 1794 as a case study. They want to analyze this period through six specific mechanisms they've outlined, and then see how it affects three interpretive frameworks: class struggle, ideology, and contingency. The user has provided detailed historical facts and asks for a disciplined mapping rather than a survey. 

  First, I need to understand each mechanism clearly. The user lists six: purity spiral, coalition contraction, instrumental autonomy, personnel selection, credible restraint via disloyal actors, and the null hypothesis. For each, I must identify the agent, action variable, and predictions about four features: ideological direction of purges, tempo, survivors, and how the sequence ends. 

  Looking at the historical facts: the Girondins were purged in June 1793, Hébertists in March 1794, Dantonists in April 1794, then the Law of 22 Prairial in June accelerated executions, and Robespierre fell in July after Fleurus. The acquittal rates and immunity clause removal are key for testing instrumental autonomy. The back-to-back purges of opposing factions (Hébertists and Dantonists) challenge the purity spiral idea. 

  For the purity spiral mechanism, the agent is factions competing for revolutionary legitimacy. It predicts escalating radicalism, so purges should move in one ideological direction. But the historical record shows purges of both radical Hébertists and moderate Dantonists almost simultaneously. This doesn't fit a purity spiral. The tempo should accelerate smoothly, but here it jumped after Prairial. Survivors should be the most extreme, but in the end, more pragmatic figures like Fouché survived. The spiral should end when no one is left, but Robespierre fell while others remained. So purity spiral is likely ruled out.

  Coalition contraction has the revolution itself as agent, purging flanks. It predicts narrowing coalitions and higher stakes after each purge. The direction can zigzag as flanks are removed, which matches the purges of both left and right. Tempo could accelerate as the center shrinks, but the big jump after Prairial's institutional change isn't directly predicted. Survivors should be the "last flank" - Robespierre's core group - which they were until Thermidor. The end comes when the clique is too small to defend itself, which fits. This mechanism seems plausible.

  Instrumental autonomy's agent is the repressive apparatus (Revolutionary Tribunal, Committees). Action variable is institutional unshackling, like the Prairial Law. It predicts that after such unshackling, purges become self-sustaining and target creators. The acquittal rate staying at 25% despite Prairial's restrictions is puzzling - if autonomy were full, acquittals should drop. The immunity clause removal explicitly targeted deputies, which aligns with the mechanism. Robespierre's group was consumed by the machine they created. But the acquittal rate ambiguity makes this less clear-cut. Still, it has explanatory power.

  Personnel selection's agent is the revolutionary process promoting certain traits. It predicts survivors have traits adaptive to terror (ruthlessness, ideological rigidity). But many survivors like Fouché were adaptable, not rigid. The end isn't specified by this mechanism alone. It doesn't explain the purge pattern well. Likely not sufficient.

  Credible restraint (user's preferred) has the leadership as agent, removing disloyal actors. Action is purging factions. It predicts that eliminating factions destroys de-escalation options, forcing continued purges. The back-to-back Hébertist and Dantonist purges fit, as removing both made restraint impossible. Tempo could jump after key purges. Survivors aren't predicted. The end comes when external shock (Fleurus) removes justification, but the leadership can't de-escalate. Fleurus victory was exogenous, and Thermidor followed. This mechanism is strong.

  Null hypothesis says it's random violence in violent times. But the pattern isn't random - purges systematically removed key factions. The narrative coherence isn't just imposed; the sequence has internal logic. So null is ruled out.

  On interpretive frameworks: class struggle is damaged because purges crossed class lines (bourgeois Dantonists and sans-culotte aligned Hébertists both purged). Ideology is challenged as factions used similar rhetoric instrumentally. Contingency gains support since Fleurus' timing mattered and institutional choices (Prairial) were contingent.

  For comparison, non-devouring revolutions might keep broad coalitions or control repressive apparatus. Mexico's PRI or negotiated transitions could be examples. Counterfactuals in France: if Dantonists survived and moderated terror, that would support credible restraint. If acquittal rates plummeted post-Prairial, it would strengthen instrumental autonomy.

  Silences: why Thermidor in July? None of the mechanisms explain the timing. Also, why these specific factions were targeted first isn't fully addressed. The personal relationships and specific accusations fall outside these mechanisms.

  The user's credible restraint mechanism gets strong support, especially with Fleurus as the exogenous shock that should have allowed de-escalation but couldn't due to prior purges. Coalition contraction and instrumental autonomy also contribute, but with some ambiguities. The analysis shows the French case isn't just anecdotal; it highlights how eliminating political alternatives forces radicalization, a lesson applicable elsewhere.
answer: |-
  Your case study of the French Terror (June 1793-July 1794) powerfully discriminates between your proposed mechanisms, revealing both explanatory strengths and critical silences. Here's the analysis structured as requested:

  **Mechanism Analysis: Mapping Predictions to Evidence**

  1.  **Purity Spiral (Competitive Outbidding):**
      *   *Agent:* Revolutionary factions (Montagnards, Cordeliers, Committees).
      *   *Action Variable:* Demonstrated revolutionary zeal/intransigence.
      *   *Predictions vs. Record:*
          *   *Direction:* Should show unidirectional radicalization (e.g., only moderates purged). **Contradicted.** Purges hit the "ultra" Hébertists (left) and then the "moderate" Dantonists (right) within two weeks. This zigzag pattern is incompatible with a simple spiral ratcheting only upwards.
          *   *Tempo:* Should accelerate smoothly as outbidding intensifies. **Contradicted.** The massive acceleration in executions occurs sharply *after* the institutional unshackling of the Prairial Law (June 10), not as a gradual slope.
          *   *Survivors:* Should be the most extreme ideologues. **Ambiguous.** While Robespierre's core was ideologically rigid, key Thermidorians (Tallien, Barras, Fouché) were often pragmatists or former terrorists who adapted.
          *   *End:* Should culminate in self-destruction when no one is pure enough. **Partially fits.** Robespierre's fall fits self-destruction, but it was triggered by a specific fear generated by Prairial and the military victory.
      *   *Verdict:* **Ruled Out.** The bi-directional purges and tempo jump are fatal.

  2.  **Coalition Contraction:**
      *   *Agent:* The Revolution (embodied by the dominant faction's leadership).
      *   *Action Variable:* Purge of a political flank.
      *   *Predictions vs. Record:*
          *   *Direction:* Can zigzag (removing left flank, then right flank) as the coalition narrows. **Fits.** Girondins (right flank relative to Montagnards), then Hébertists (left flank), then Dantonists (new right flank) are purged sequentially.
          *   *Tempo:* Could accelerate as the center shrinks and stakes rise. **Fits generally**, though the Prairial jump remains a distinct institutional catalyst. The removal of immunity *is* a direct consequence of coalition narrowing targeting the Convention itself.
          *   *Survivors:* The "last flank" standing (Robespierre, Saint-Just, Couthon). **Fits.** They survived until Thermidor.
          *   *End:* The rump clique becomes too small to defend itself against a coalition of the excluded/afraid. **Fits.** The core Committee of Public Safety/Committee of General Security group became too small and isolated; the Convention turned on them.
      *   *Verdict:* **Strongly Supported.** Elegantly explains the sequence and direction of purges and the endgame.

  3.  **Instrumental Autonomy:**
      *   *Agent:* The Repressive Apparatus (Revolutionary Tribunal, Surveillance Committees, Representatives-on-Mission).
      *   *Action Variable:* Degree of institutional/legal unshackling from creator control (e.g., Prairial Law).
      *   *Predictions vs. Record:*
          *   *Direction:* Post-unshackling, purges become self-sustaining and less ideologically directed; creators become targets. **Fits.** Post-Prairial, executions skyrocket indiscriminately; Convention deputies (creators) lose immunity and become vulnerable.
          *   *Tempo:* Should jump sharply *after* unshackling events. **Fits.** The execution rate quintupled immediately after Prairial.
          *   *Survivors:* Those outside the apparatus or who gain control of it. **Fits.** Thermidorians like Fouché (a Representative-on-Mission) survived and later dismantled it.
          *   *End:* Apparatus consumes creators, then is dismantled by those who seize control of it or fear it next. **Fits.** Robespierre & co. consumed; Thermidorians (many apparatus insiders) dismantled it.
      *   *Critical Evidence:* The **acquittal rate (~25%)** is crucial. It stayed constant *even after Prairial*, suggesting the Tribunal maintained a consistent, horrifying *internal* standard of "guilt," but not complete arbitrary frenzy. This shows autonomy *within* its grim logic, not pure randomness. The **explicit removal of deputy immunity** is the clearest act of unshackling, directly enabling the apparatus to target its political masters.
      *   *Verdict:* **Strongly Supported.** Prairial is the pivotal moment, and the acquittal rate shows terrifying autonomy without complete loss of procedural (if perverted) consistency.

  4.  **Personnel Selection:**
      *   *Agent:* Revolutionary process (promoting individuals).
      *   *Action Variable:* Traits selected for (ruthlessness, ideological rigidity, conspiratorial skill).
      *   *Predictions vs. Record:*
          *   *Direction:* Reflects who gets promoted; purges remove those lacking adaptive traits. **Weak.** Purges removed ruthlessly effective figures (Hébert, Danton) alongside others. The traits needed to survive the Terror's peak (paranoia, rigid conformity) differ from those needed to seize power (charisma, tactical daring). Danton excelled at the latter but failed at the former.
          *   *Tempo:* Not directly predicted.
          *   *Survivors:* Those with traits most adaptive to the Terror environment. **Partially fits.** Robespierre's inflexibility was adaptive until suddenly maladaptive. Many survivors (Tallien, Fouché) were ruthless pragmatists, not ideologues. It doesn't explain *why* they survived *this* sequence.
          *   *End:* Not predicted.
      *   *Verdict:* **Insufficient Alone.** Selection pressures exist, but the mechanism doesn't explain the *pattern* or *timing* of the purges. It's a background factor, not the driving dynamic.

  5.  **Credible Restraint Destruction (Your Hypothesis):**
      *   *Agent:* Leadership (CPS, Robespierre).
      *   *Action Variable:* Elimination of factions representing political alternatives within the coalition.
      *   *Predictions vs. Record:*
          *   *Direction:* Purges eliminate factions whose presence signals credible restraint/de-escalation options. **Fits.** Eliminating *both* the Hébertists (demanding more terror) *and* the Dantonists (demanding less terror) destroyed any visible political path for de-escalation. Robespierre claimed the center, but destroyed the poles that defined it.
          *   *Tempo:* Could jump after key factions are removed, closing off-ramps. **Fits.** The Dantonist purge (April 5) removed the last major faction advocating restraint. The subsequent Prairial Law (June 10) and execution spike reflect the lack of alternatives.
          *   *Survivors:* Those who no longer face internal political challenge. **Fits.** Robespierre's core survived until Fleurus removed the external justification.
          *   *End:* Leadership cannot de-escalate even when external threats recede (Fleurus) because they've destroyed the internal actors/structures for negotiation and compromise. **Fits.** Fleurus (June 26) removed the existential military threat, but Robespierre could only double down (Great Terror), fueling the Thermidor reaction. De-escalation was impossible; his only remaining "off-ramp" was more terror to eliminate perceived internal enemies, which backfired.
      *   *Verdict:* **Strongly Supported.** Best explains the bi-directional purges as destroying the necessary conditions for restraint and the fatal inability to stop after Fleurus.

  6.  **Null Hypothesis (Post-Hoc Narrative):**
      *   *Agent:* Chance/Violent context.
      *   *Action Variable:* Random prominence in violent times.
      *   *Predictions vs. Record:*
          *   *Pattern:* Should show no coherent sequence or escalating logic. **Contradicted.** The sequence (Girondins -> Hébertists -> Dantonists -> Great Terror -> Robespierre) shows a clear logic of narrowing coalition, escalating institutional autonomy, and destruction of restraint. The timing of purges and the Prairial Law are deliberate political acts.
          *   *Tempo:* Random or tied only to external threat. **Contradicted.** Execution spike follows Prairial, not just military setbacks; decline follows Thermidor.
      *   *Verdict:* **Ruled Out.** The internal logic and political agency are too evident.

  **Summary of Mechanisms:** The case **rules out** the Purity Spiral and Null Hypothesis. It shows **Personnel Selection** is insufficient. **Coalition Contraction, Instrumental Autonomy, and Credible Restraint Destruction** are strongly supported and complementary:
  *   *Coalition Contraction* explains the *sequence* and *targets* of purges and the *endgame* vulnerability.
  *   *Instrumental Autonomy* explains the *acceleration* and *indiscriminate scope* post-Prairial, *including* the targeting of creators.
  *   *Credible Restraint Destruction* explains the *bi-directional nature* of the key spring 1794 purges and the *fatal inability to de-escalate* after Fleurus.

  **Impact on Interpretive Frameworks:**

  1.  **Class Struggle:** Suffers significant damage. While *sans-culotte* pressure existed, the purges cut across class lines. The Girondins and Dantonists were bourgeois; the Hébertists claimed *sans-culotte* alignment but were purged by the bourgeois-dominated CPS. The Terror's victims and architects came from similar social strata. The dynamics (coalition narrowing, institutional autonomy, restraint destruction) operated primarily at the *political* level.
  2.  **Ideology:** Moderately damaged. Revolutionary virtue was the *currency* and *justification*, but the *targets* (Hébertist radicals vs. Dantonist moderates) and the *timing* (post-Fleurus intensification) suggest ideology was instrumentalized. The consistency of the Tribunal's acquittal rate, even amidst frenzy, hints at bureaucratic procedure overriding pure ideological fervor at the operational level. The core drivers appear more political-institutional.
  3.  **Contingency:** Strengthened. The specific *timing* of Fleurus was crucial – creating the dissonance that triggered Thermidor. The *choice* to pass the Prairial Law was a contingent political decision that unleashed the apparatus. The *failure* to find a de-escalation path after eliminating alternatives highlights the role of specific choices and events. While structural forces drove the purge dynamic, contingency shaped its key turning points and ultimate end.

  **Beyond Anecdote: Comparison and Counterfactuals**

  *   **Comparison Class:** To test "devouring," examine revolutions that avoided this fate despite crisis. The Glorious Revolution (1688) maintained elite coalition stability. The Meiji Restoration (1868) involved purges but preserved a broader ruling bloc and transitioned. Post-1945 negotiated transitions (Spain, Chile to varying extents) avoided full-blown auto-cannibalism. Cases like the Russian Revolution (Bolshevik purges 1918-1939) or the Iranian Revolution (1979 onwards) show similar devouring patterns.
  *   **Non-Devouring Revolution:** Would require: 1) Maintaining a broad enough winning coalition to distribute power/punishment; 2) Retaining firm control over or dismantling repressive instruments *before* they gain autonomy; 3) Preserving internal factions/channels allowing credible de-escalation when threats recede; 4) Leadership capable of negotiating transitions.
  *   **Counterfactuals within France:**
      *   *Against Credible Restraint:* If Dantonists survived Fleurus and successfully negotiated Terror's end, the hypothesis is weakened. Their destruction was key.
      *   *Against Instrumental Autonomy:* If acquittal rates plunged towards zero after Prairial, showing complete loss of control, autonomy would be clearer. The stable 25% rate suggests *controlled* ferocity.
      *   *Against Coalition Contraction:* If a new faction emerged post-Danton to broaden the coalition, the narrowing trend would be broken. None did.

  **The Silences:**

  All six mechanisms are silent on the **precise timing of Thermidor (July 27-28)**. Why not June 29th or August 15th? The mechanisms create vulnerability and pressure, but the exact moment depended on specific fears sparked by Robespierre's vague denunciations on 8 Thermidor, tactical decisions by Tallien & co., and Hanriot's ineptitude. Similarly, they don't explain **why the Girondins were targeted first** over other potential flanks in June 1793 – that requires deeper analysis of pre-June politics. They also don't fully account for the **role of personal rivalries and paranoia** (e.g., Robespierre's specific distrusts), which operated within the structural constraints. Crucially, **Fleurus** is treated as the exogenous shock revealing the leadership's inability to de-escalate (supporting Mechanism 5), but the mechanisms don't *predict* when such a shock would occur, only its likely effect given the prior destruction of restraint options.

  **Conclusion:**

  The French Terror sequence powerfully validates Coalition Contraction, Instrumental Autonomy, and your Credible Restraint Destruction hypothesis as intertwined drivers. It rules out simplistic radicalization spirals or random violence, while highlighting the insufficiency of pure selection or class struggle. Ideology provided language but not the core logic; contingency shaped critical junctures. The case demonstrates that revolutions devour their children not through inevitable ideological fervor, but through the fatal interplay of narrowing coalitions, unleashed repression, and the destruction of the very internal diversity necessary for credible de-escalation when the existential crisis passes. The key lesson is that eliminating political alternatives, even opposing ones, can render a revolution tragically incapable of peace.
