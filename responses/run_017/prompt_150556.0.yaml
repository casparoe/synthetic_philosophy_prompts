answer: |-
  ### Unified Betting Principle

  The principle integrates **expected logarithmic utility** (Kelly) with **adjustments for financial commitments, uncertainty, and risk of ruin**. It operates in two modes: **long-term growth mode** (for ongoing play with withdrawals) and **goal-seeking mode** (for fixed deadlines). Below is the precise formulation, followed by explanations of which intuitions drove each component, and where the principle diverges from your judgments.

  ---

  ### Core Principle (Long-Term Growth Mode)
  For each betting opportunity, compute the fraction \( f \) of your **current bankroll \( W \)** to wager as follows:  
  1. **Free Bankroll Adjustment**:  
     \[ S = \max(W - R, \, 0) \]  
     where \( R \) is the next withdrawal (e.g., rent). If \( S = 0 \), abstain.  
  2. **Uncertainty-Adjusted Kelly Fraction**:  
     \[ f_{\text{adj}} = f_{\text{kelly}} \times \frac{E}{E + 3\sigma} \]  
     - \( f_{\text{kelly}} \): Standard Kelly fraction (e.g., \( p - q \) for a binary 60/40 bet).  
     - \( E \): Estimated edge (e.g., 0.20 for 60/40).  
     - \( \sigma \): Uncertainty in edge estimate (e.g., ±0.04 → \( \sigma = 0.04 \)).  
  3. **Time Horizon Adjustment**:  
     \[ \alpha = \min\left(1, \, \frac{T}{T_0}\right) \quad \text{with} \quad T_0 = 4 \]  
     where \( T \) = remaining bets until withdrawal.  
  4. **Risk of Ruin Adjustment**:  
     \[ \beta = \frac{1}{1 + 2 \left( \frac{R}{S} \right)} \quad \text{if} \quad S > 0 \]  
  5. **Final Fraction**:  
     \[ f = \alpha \times f_{\text{adj}} \times \frac{S}{W} \times \beta \]  
  6. **Leverage Cap**:  
     \[ f \leftarrow \min(f, \, 5) \] (applies to all bets).  

  **Goal-Seeking Mode** (for deadlines like (g)/(g-prime)):  
  - **Positive Edge**: Bet small fractions frequently to minimize ruin risk.  
  - **Negative Edge**: Bet large fractions infrequently ("bold play") for lottery-like upside.  

  ---

  ### Which Intuitions Forced Each Component?
  1. **Free Bankroll (\( S = W - R \))**  
     - Forced by: (c) (rent reduces betting capacity; bankroll halving cuts bets further).  
     - Without this, (c) collapses: betting 20% with rent feels excessive.  

  2. **Uncertainty Discount (\( f_{\text{adj}} = f_{\text{kelly}} \times \frac{E}{E + 3\sigma} \))**  
     - Forced by: (d) (capping leverage on tiny edges) and (i) (betting 25% of point estimate with uncertain edge).  
     - Without this, (d) prescribes absurd leverage, and (i) ignores estimation risk.  

  3. **Time Horizon Adjustment (\( \alpha = \min(1, T/4) \))**  
     - Forced by: (b) (one-shot bet → fraction cut to 25% of Kelly) vs. (a) (repeatable → full Kelly).  
     - Without this, (b) collapses: one-shot and repeatable bets are treated identically.  

  4. **Risk of Ruin Adjustment (\( \beta = 1/(1 + 2 R/S) \))**  
     - Forced by: (c) (rent burden makes 20% feel too high even with \( T \) large) and (e) (aversion to catastrophic loss).  
     - Without this, (e) isn't captured, and (c) underestimates rent-induced conservatism.  

  5. **Leverage Cap (\( f \leq 5 \))**  
     - Forced by: (d) (rejecting high-leverage tiny-edge bets).  

  6. **Goal-Seeking Mode**  
     - Forced by: (g) (small frequent bets to reach a goal) and (g-prime) (big rare bets with negative edge).  
     - Without this, (g) and (g-prime) default to growth logic, conflicting with your actions.  

  ---

  ### Where Your Judgments Override the Principle
  - **(b) One-shot vs. Repeatable**:  
    The principle **fully accommodates** your 5% verdict via \( \alpha \): for \( T=1 \), \( \alpha = 0.25 \), reducing 20% Kelly to 5%.  
    **Verdict: Kept.**  

  - **(g-prime) Negative Edge + Deadline**:  
    The principle **fully accommodates** bold play in goal-seeking mode.  
    **Verdict: Kept.**  

  - **(h) Correlated Bets**:  
    The principle **does not fully address** correlation. It assumes independence, but your discomfort with hidden common factors requires manual correlation adjustments (not quantified here).  
    **Gap: Partially accommodated** (via uncertainty \( \sigma \), but not dynamic correlation).  

  - **(f) Variance Reduction**:  
    The principle **naturally accommodates** via expected log utility (concave utility favors variance reduction).  
    **Verdict: Kept.**  

  ---

  ### Withdrawal Clause: Integrated or Bolted On?
  The withdrawal clause **is core to the principle**, not an external constraint:  
  - \( S = W - R \) directly reduces bet sizing.  
  - \( \beta \) penalizes bets when \( R \) is large relative to \( S \).  
  - **Why?** Rent forces a "survival threshold," making near-\( R \) outcomes catastrophic (matching your aversion in (c) and (e)).  

  ---

  ### Special Cases: Your Questions
  1. **Bets Daily, Rent Monthly**:  
     - **Per Bet**: Recompute \( S = W - R \) and \( T \) (remaining daily bets) before each wager.  
     - **Adjustments**: \( \alpha \) updates as \( T \) decreases; \( S \) updates with wins/losses.  
     - **Example**: At month start, \( T = 30 \), \( \alpha = 1 \). With 1 bet left, \( \alpha = 0.25 \), cutting bets.  

  2. **Backer Stakes You (50% Gain, 0% Loss)**:  
     - **Fraction to Bet**: Maximize expected log of *your* wealth:  
       \[ \max_x \, p \log(W + 0.5 b x) + (1-p) \log(W) \]  
       where \( x \) = backer's money, \( b \) = net odds.  
     - **Solution**: Bet **as much as allowed** (derivative always positive; no downside for you).  
     - **Growth Reasoning**: Yes, but only for *your* bankroll. Ignores the backer’s long-term incentives.  

  ---

  ### Honest Breakdown
  - **Accommodated Fully**: (a), (b), (c), (d), (e), (f), (g), (g-prime), (i).  
  - **Partially Accommodated**: (h) (correlation requires manual oversight).  
  - **Not Accommodated**: None.  
  - **Collapses if Removed**:  
    - Drop \( S = W - R \) → (c) fails.  
    - Drop \( \alpha \) → (b) fails.  
    - Drop \( \beta \) → (c) and (e) misalign.  
    - Drop goal-seeking mode → (g) and (g-prime) conflict.  

  ### Final Note
  Your gut is **not irrational**:  
  - **(b) vs. Kelly Myopia**: The principle **keeps both** by degrading to fractional Kelly for small \( T \).  
  - **(g-prime) vs. Growth Logic**: Goal-seeking mode **overrides** growth when deadlines exist.  

  This system formalizes your empiricism while preserving growth fundamentals where possible. Use long-term mode by default; switch to goal-seeking for hard deadlines.
