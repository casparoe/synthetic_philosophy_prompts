  I support myself from a single gambling bankroll — mostly mid-stakes poker, plus the occasional prop bet with a friend who trades — and on the first of every month I take a fixed amount out of it for rent. That last detail is what got me stuck. One friend tells me to maximize expected dollars; another tells me to maximize the expected logarithm of wealth, or equivalently the geometric growth rate, and to size every bet by the Kelly fraction. I've half-convinced myself of a rule somewhere between them: bet the fraction that maximizes expected log wealth, but compute that fraction only on the part of the bankroll that isn't already spoken for by the next withdrawal, and shrink it toward zero the less confident I am about my edge. I want that rule, or a better one, tested against the cases where my gut is firm rather than against theory.

  Here is where I land. (a) A 60/40 even-money flip, offered monthly and repeatable maybe a hundred times, in a separate risk account with no rent coming out of it: twenty percent, full Kelly, feels exactly right. (b) The very same bet offered once, against my entire net worth: twenty percent feels reckless, I'd bet about five — even though the arithmetic for a log-maximizer is identical to (a). (c) The repeatable 60/40 bet with rent drawn monthly, rent currently about two percent of the bankroll: twenty percent now feels too much, and if the bankroll halved I'd cut further still, but if the bankroll were a hundred times the rent I'd go back to roughly twenty. (d) A tiny-edge, tiny-variance opportunity — call it half a percent expected return for half a percent of standard deviation, available daily: Kelly prescribes absurd leverage, and I refuse; three to five times is my ceiling. (e) Paying sixty dollars to remove a one percent chance of a five-thousand-dollar loss: I take it, and I don't think I need any separate story about being risk-averse to justify it. (f) A hedge that loses a couple of tenths of a percent in expectation but cuts my variance, and likewise splitting capital between two independent zero-expected-return positions and rebalancing: both feel like free money, even though both are negative or zero in expected dollars. (g) I need forty thousand dollars within twelve months for a deposit I cannot finance, I have twenty-five thousand, and a favorable bet is available as often as I like: I stop maximizing growth entirely and instead bet small and often. (g-prime) Same deadline, but the only game available carries a small house edge: growth reasoning tells me not to play at all, and my gut says the opposite — bet big and rarely, possibly almost everything on one spin. (h) Several independent favorable bets at once: I'm comfortable with total exposure exceeding the bankroll when they're genuinely independent and distinctly uncomfortable when they quietly