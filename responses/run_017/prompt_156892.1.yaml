     PS: Beating children was common, but beating them near a hearth might not be? We need peer-saturation: did other fathers beat their children near hearths? Let's say it was common enough that PS holds. (Holds)
     BD: The local thick concept of savagery was available and applicable (it includes beating someone in a way that recklessly exposes them to danger), and if Thorne had applied it, he would have refrained. But he avoided applying it for self-serving reasons (not wanting to admit he lost control). (Holds) -> defence fails.

   Now, the sympathies: students will instinctively want to condemn Case A (because it involves a slave) and excuse Case B (because it was an accident during parental discipline). But in Case A, the defence succeeds, and in Case B, it fails.

   Let's write the paragraphs.

   Case A (defence succeeds):
     In the harvest season of 1785, Master Thorne's slave Eli hesitates momentarily while carrying a heavy load, and Thorne, interpreting this as insolence, orders a whipping. The punishment is administered in the manner typical of the plantation: ten lashes. Unbeknownst to anyone, Eli has a congenital weakness in his neck, and the lashes cause a spinal injury that leaves him permanently blind in one eye. Thorne's response is within the norm for planters in New Albion, and he views it as necessary to maintain discipline. He is aware of a small group of abolitionists who argue that any physical punishment of slaves is immoral, but he considers them fanatics who ignore economic realities.

   Case B (defence fails):
     In the winter of 1787, Master Thorne's fifteen-year-old son, Edward, disobeys a direct order to stay away from the family's prized stallion and attempts to ride it. Furious at the disobedience and fearing for the horse, Thorne confronts Edward in the drawing room, which has a stone hearth. In his rage, Thorne beats Edward with a riding crop near the hearth. During the beating, Edward trips on the hearth rug and strikes his head on the stones, resulting in permanent blindness in one eye. Thorne's disciplinary methods are typical for fathers of his station, and he believes they are essential for instilling respect. He knows of religious reformers who oppose corporal punishment that risks serious injury, but he dismisses them as fanatics. However, Thorne has often criticized other gentlemen for 'savagery' when they lose control and punish their children in dangerous settings. In this instance, he avoids applying that term to himself, because to do so would be to admit that his own rage caused his son's injury.

   Now, conditions and verdicts:

   Case A:
     CU: Holds. The wrong-making feature (causing permanent injury to a slave as a moral wrong) cannot be formulated in available concepts.
     EU: Holds. The evidence did not flag the risk of blindness (due to the congenital condition).
     PS: Holds. Typical punishment.
     BD: Fails. No local thick concept available to condemn the action (the concept of savagery does not extend to slaves).

     Defence succeeds: Thorne is not blameworthy for the action. We are not licensed to condemn him as a person for this action.

   Case B:
     CU: Holds. The full modern concept of child abuse is unavailable.
     EU: Holds. The evidence did not flag the risk of blindness (the trip was accidental and the congenital condition? Wait, we didn't mention a condition for Edward. Let's assume it was an accident without any pre-existing condition: the strike to the head was unlucky. So the harm was not foreseeable.)
     PS: Holds. Beating children was typical, and the setting (in the house, near the hearth) might be common enough.
     BD: Holds. The local thick concept of 'savagery' is available and applicable (it includes punishing in a dangerous manner), and if Thorne had applied it, he would have refrained. But he avoided it for self-serving reasons (not wanting to admit his own loss of control).

     Defence fails: Thorne is blameworthy for the action. We are licensed to condemn him as a person for this action because he had the resources to avoid it.

   The single feature doing the work is BD: its absence in A and presence in B.

   If we remove BD, then in both cases the defence would succeed (since CU, EU, PS hold). The contrast collapses.

   Now, the objection:

   Objection: "a local thick concept can at most render an action locally disapproved, not wrong in the terms we are actually judging by, so BD appears to smuggle back in precisely the anachronism that CU was meant to exclude, and the agent in B is being blamed for failing to anticipate a moral framework they had no way of occupying."

   Strong version: We are blaming Thorne in Case B for not using the local concept of 'savagery'. But we are judging him by our standards (which include child abuse) and using the local concept only as a proxy. However, the agent could not have known that his action was wrong by our standards. Therefore, we are still being anachronistic.

   Does it sink Case B? It might. Because the defence is meant to avoid anachronism, but if we are using our standards to judge the action as wrong, and then using the local concept to pin blame on the agent for not applying it, we are essentially blaming the agent for not being more like us. The agent in Case B did not have the concept of child abuse; he had the concept of savagery. But savagery might not map exactly to our concept. Moreover, the agent might not have seen savagery as a moral wrong in the same way we do? But the schema assumes that if the agent had applied the thick concept, he would have refrained. But the thick concept might not have the same force as our moral condemnation.

   How to survive the objection? We might argue that we are not judging the action by our standards first. We are using the local moral vocabulary to show that the agent had the resources to avoid the action. We are not saying the action is wrong by our standards and then using the thick concept as a bridge; rather, we are saying that within the agent's own moral framework, the action was condemnable. Therefore, we are not being anachronistic because we are holding the agent to his own standards.

   In Case B, if Thorne had been consistent with his own moral framework (applying 'savagery' to himself), he would have refrained. His failure is one of consistency, not of anticipating our morality.

   Therefore, the objection does not sink Case B.

   However, if the objection is that our judgment of blameworthiness depends on our view that the action was wrong (by our lights), then we might be smuggling in anachronism. But we can reply: we are not blaming the agent for the action being wrong by our lights, but for failing to live up to his own moral framework. The action is wrong by the agent's own lights (if he had been consistent), and that is why he is blameworthy.

   So the case survives.

   But to make it explicit in the case: in Case B, the agent already accepts that savagery is wrong and has used the term to criticize others. So it is part of his moral framework.

   Therefore, the objection does not sink Case B.

   Final scenarios:

   Case A (defence succeeds):
     In the harvest season of 1785, Master Thorne's slave Eli hesitates momentarily while carrying a heavy load, and Thorne, interpreting this as insolence, orders a whipping. The punishment is administered in the manner typical of the plantation: ten lashes. Unbeknownst to anyone, Eli has a congenital weakness in his neck, and the lashes cause a spinal injury that leaves him permanently blind in one eye. Thorne's response is within the norm for planters in New Albion, and he views it as necessary to maintain discipline. He is aware of a small group of abolitionists who argue that any physical punishment of slaves is immoral, but he considers them fanatics who ignore economic realities.

   Case B (defence fails):
     In the winter of 1787, Master Thorne's fifteen-year-old son, Edward, disobeys a direct order to stay away from the family's prized stallion and attempts to ride it. Furious at the disobedience and fearing for the horse, Thorne confronts Edward in the drawing room, which has a stone hearth. In his rage, Thorne beats Edward with a riding crop near the hearth. During the beating, Edward trips on the hearth rug and strikes his head on the stones, resulting in permanent blindness in one eye. Thorne's disciplinary methods are typical for fathers of his station, and he believes they are essential for instilling respect. He knows of religious reformers who oppose corporal punishment that risks serious injury, but he dismisses them as fanatics. However, Thorne himself has on multiple occasions criticized other gentlemen for 'savagery' when they lost their tempers and punished their children in a manner that recklessly risked grave harm. In this instance, he avoids applying that term to his own conduct, because to do so would be to admit that his own rage and choice of setting caused his son's injury.

   This meets the requirements.
