  ### Case A: Defence Succeeds (Students Instinctively Condemn)
  In the port city of Veridia in the 1780s, Master Silas Reed, a wealthy merchant, inherits a sugar plantation. He continues the established practice of branding new slaves with his family’s insignia to deter escape. The branding causes severe scarring and permanent nerve damage, but Reed views this as a regrettable necessity for maintaining order. He knows of Quaker abolitionists in the city who condemn all physical marking of humans as a violation of divine creation, but he dismisses them as impractical idealists. Reed’s peers uniformly use similar methods, and he prides himself on providing clean quarters and adequate rations—more than many neighbors do. When a newly branded slave develops a fatal infection from the wound, Reed attributes it to bad luck, not cruelty; in his moral vocabulary, "cruelty" applies only to gratuitous suffering, not disciplinary acts essential to commerce.  

  ### Case B: Defence Fails (Students Instinctively Excuse)  
  In the same city and decade, Master Silas Reed arranges for his timid clerk, Mr. Ellis, to marry Reed’s housemaid, Clara, after learning of their secret affection. Reed believes he acts kindly: Ellis is stable but plain, and Clara might otherwise face destitution. Both consent reluctantly, pressured by Reed’s insistence that their union is "for their own good." The marriage proves deeply unhappy, marked by quiet resentment. Reed’s peers commonly arrange such matches for servants, seeing it as benevolent stewardship. He knows of radical pamphleteers who decry all marital coercion as "tyranny," but he scoffs at their extremism. Yet Reed’s own moral lexicon includes "faithlessness," a thick term condemning those who betray dependents’ trust for self-interest. He avoids applying it here, though he senses Clara’s despair, because admitting fault would undermine his self-image as a paternalistic benefactor.  

  ---  
  ### Analysis  

  #### **Case A: Defence Succeeds**  
  - **CU (Holds)**: The wrong-making feature (treating humans as property to be physically marked) cannot be formulated—Reed lacks concepts like "bodily autonomy" or "inherent dignity."  
  - **EU (Holds)**: No evidence accessible to Reed flags the infection risk as a moral harm (it’s seen as accidental), and no inquiry would reveal branding as inherently wrongful.  
  - **PS (Holds)**: Reed’s conduct is at or below the median for plantation owners; peers see branding as routine.  
  - **BD (Fails)**: No bridging description (e.g., "cruelty") applies, as Reed’s concept of cruelty excludes disciplinary acts.  
  **Verdict**: Defence succeeds. Reed is not blameworthy for the action, and we cannot condemn him *as a person* for it. The harm stems from systemic blindness, not individual moral failure.  

  #### **Case B: Defence Fails**  
  - **CU (Holds)**: The wrong-making feature (coercing marital consent as a violation of agency) cannot be formulated—Reed lacks concepts like "informed consent" or "emotional abuse."  
  - **EU (Holds)**: No evidence flags the harm (emotional distress) as morally salient; unhappiness is seen as a private misfortune.  
  - **PS (Holds)**: Reed’s conduct aligns with peers; arranging marriages is normalized stewardship.  
  - **BD (Holds)**: "Faithlessness" is a bridging description: Reed’s lexicon condemns betraying dependents’ trust for self-interest. Evidence (Clara’s despair) was available, and applying it would have prompted refraining, but Reed avoided it to preserve his self-image.  
  **Verdict**: Defence fails. Reed is blameworthy for the action due to culpable inconsistency with his own moral framework. We may condemn him *as a person* for this choice.  

  #### **Contrast Mechanism**  
  - **Single Feature**: BD’s presence/absence. In A, no local thick concept indicts the action; in B, "faithlessness" applies, and Reed evades it self-servingly.  
  - **Collapse Test**: If BD is removed (e.g., if "faithlessness" were absent from Reed’s lexicon), both cases would satisfy all defence conditions—contrast vanishes.  
  - **Symmetry Protection**: The failure in B is *not* present in A because A lacks any applicable thick concept to evade. Conversely, BD’s absence in A doesn’t affect B because B hinges on Reed’s avoidance of an *available* concept.  

  ---  
  ### Objection: "BD Smuggles in Anachronism"  
  **Strongest Version**:  
  BD requires agents to apply local thick concepts (e.g., "faithlessness") to condemn actions. But these concepts only render actions *locally* disapproved (e.g., "faithlessness" signals betrayal within hierarchical relationships), not *wrong* by our standards (e.g., violating autonomy as a universal right). Thus, blaming Reed in Case B for not applying "faithlessness" still imposes an anachronistic framework—he is punished for failing to anticipate *our* moral judgment, not his era’s limited norms. This collapses the defence’s core distinction between historical and contemporary blame.  

  **Response**:  
  - **Does it sink Case B?** No. BD does *not* rely on our moral framework. It asks whether the agent, using their *own* concepts and evidence, could have identified the action as condemnable *by their lights* (e.g., "faithlessness" as Reed understands it). Blame arises from the agent’s inconsistency in exempting themselves from a local norm they endorse elsewhere—not from violating our norms.  
  - **Rebuilding to Survive**: To harden against the objection, ensure the thick concept’s *content* directly maps the harm:  
    - **Revised Case B**: Reed knows Clara sees him as a "guardian" (a thick local role demanding selfless care). He also knows "guardian-betrayal" is condemned as "faithlessness." His evasion becomes a clear case of bad faith under *his* values, irrespective of our views. This isolates blame to hypocrisy, not anachronism.
