  We are designing an interactive session for 16 engineers on revealed preference theory. The goal is for participants to experience the difficulties of inferring preferences from choice data. We'll have them generate choice data and then try to reconstruct preferences, hitting the three key points.

  **Key Points to Address:**
  1. **Indeterminacy of Preference Orderings and Utility Intensity:** Show that a finite set of choices can be explained by multiple preference orderings, and utility intensity (how much one option is preferred over another) is not pinned down.
  2. **Analyst's Stipulation of Option Identity:** The analyst must decide what counts as "the same option" across different choice sets, and this decision is not determined by the data.
  3. **Consistency without True Preference:** A case where choices are consistent with a stable ordering but we resist saying they reveal the chooser's wants (e.g., following a rule without consulting personal desires).

  **Setup and Materials:**
  - **Participants:** 16 engineers, mixed seniority. Split into 4 groups of 4. Each group will have two roles: Choosers and Analysts. Rotate roles so everyone experiences both.
  - **Materials:**
    - **Choice Task Cards:** Each card presents a menu (set of options) for the Chooser to pick one. We need multiple choice sets (menus) for each Chooser.
    - **Recording Sheets:** For Analysts to record choices and for Choosers to record their choices (and possibly their reasoning, if needed for debrief).
    - **Whiteboard or Flip Chart:** For debrief and group discussion.
    - **Timer:** To keep the session on track.

  **Choice Tasks:**
  We want options that are cheap, immediate, and real to engineers. Avoid monetary incentives to keep it simple and focus on the theory. Use everyday items or choices that are relatable and can be presented in multiple menus.

  **Proposed Options:**
  - **Snacks:** Common office snacks that can be easily presented. E.g., an apple, a chocolate bar, a bag of chips, a banana, a cookie. (Note: We must ensure these are available and that participants are comfortable with food choices. If not, use non-food items.)
  - **Non-Food Alternative:** Office supplies (e.g., a pen, a notebook, a stress ball, a highlighter, a sticky note pad) or abstract symbols (e.g., colored cards with letters or numbers) if physical items are impractical. However, real items are preferable for tangibility.

  **But note:** We must be able to present the same "option" in different contexts (e.g., an apple alone vs. an apple in a set with other items). Also, we need to create menus where the same physical item might be considered differently (e.g., an apple in a set of healthy snacks vs. in a set of sweet snacks) to address point 2.

  **Alternative (if snacks are problematic):** Use abstract choices represented by cards with simple attributes (e.g., color and shape) but then we lose the "real" aspect. We can use a mix: e.g., images of snacks or items.

  **Compromise:** Use a set of 5 distinct items (e.g., Apple, Chocolate, Chips, Banana, Cookie) and create multiple menus (choice sets) by forming subsets. We can also create two different contexts by having the same physical item appear in two different "settings" (e.g., one time presented on a red plate, another time on a blue plate) to force the issue of option identity.

  **Choice Sets Design:**
  We need at least 4-5 choice sets per Chooser to generate enough data but not too much. Each choice set is a subset of the full set of options. We can have:

  - Set 1: {Apple, Chocolate}
  - Set 2: {Apple, Chips, Banana}
  - Set 3: {Chocolate, Cookie, Banana}
  - Set 4: {Chips, Cookie}
  - Set 5: {Apple, Chocolate, Chips, Banana, Cookie}  (full set)

  But note: We want to create situations that highlight the three points.

  **Addressing Point 1 (Indeterminacy):** We need a situation where the same choices can be explained by different orderings. For example, if a chooser picks Apple from {Apple, Chocolate} and then picks Chocolate from {Chocolate, Cookie}, that could be consistent with Apple > Chocolate > Cookie OR Chocolate > Apple (if in the first set they were avoiding Chocolate for some reason, but then in the second set they pick it). However, to avoid confusion, we might design the choices to be consistent with one ordering but then show that other orderings are also possible.

  **Addressing Point 2 (Option Identity):** We can have the same physical item (e.g., an apple) but in two different presentations: one time as "Apple (Fresh)" and another as "Apple (Organic)" even though it's the same apple. Or, we can have two different apples (same type) and see if the analyst treats them as the same or different. Alternatively, we can have the same item in a different context (e.g., one time the apple is presented alone, another time it is presented with a note that it was left over from a meeting). The key is that the analyst must decide whether these are the same option.

  **Addressing Point 3 (Rule Following):** We will instruct one of the Choosers (without telling the Analysts) to follow a specific rule that is not based on their own preferences. For example: "Always choose the option that comes first alphabetically" or "Always choose the item that is closest to you physically". This will generate a consistent pattern of choices, but we will question whether it reveals their true preferences.

  **Procedure:**
  1. **Introduction (5 minutes):** Briefly explain the session: participants will take turns being Choosers and Analysts. The goal is to see what we can learn about preferences from choices.
  2. **Group Formation (2 minutes):** Split into 4 groups of 4. In each group, assign two as Choosers and two as Analysts for the first round. Rotate so everyone gets a turn in each role.
  3. **Round 1: Generating Choice Data (15 minutes):**
