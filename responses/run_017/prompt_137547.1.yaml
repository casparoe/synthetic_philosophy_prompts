  ### Session Design: Revealed Preference Exploration  
  **Goal:** Engineers experience the challenges of inferring preferences from choice data, confronting indeterminacy, analyst stipulation, and rule-following consistency.  

  ---

  ### **Setup & Materials**  
  - **Participants:** 16 engineers in 4 groups of 4.  
  - **Materials:**  
    - **Choice Cards:** 10 cards per group, each listing a "menu" of 2–4 options (see *Choice Tasks* below).  
    - **Recording Sheets:** For Analysts to log choices and reconstruct preferences.  
    - **Sticky Notes & Pens:** For Choosers to secretly note their decision rule/preferences.  
    - **Projector:** Display discussion prompts during debrief.  
  - **Options (Cheap, Immediate, Real):**  
    - **Coffee Options:** "Espresso (Hot)", "Iced Coffee", "Latte", "Black Coffee".  
    - **Snack Options:** "Chocolate Bar", "Apple", "Chips", "Cookie".  
    - **Abstract Tokens:** "Extra 10-min break", "Skip next meeting", "$5 gift card", "Choose next seminar topic".  
    *Rationale:* Familiar workplace rewards avoid monetary stakes, focus on trade-offs.  

  ---

  ### **Choice Tasks**  
  Each group has 10 choice cards. **Example Cards:**  
  1. `{ Espresso, Iced Coffee }`  
  2. `{ Latte, Black Coffee }`  
  3. `{ Espresso, Latte, Iced Coffee }`  
  4. `{ Chocolate Bar, Apple }`  
  5. `{ Chips, Cookie, Apple }`  
  6. `{ Latte, Cookie, Extra 10-min break }`  
  7. `{ Skip next meeting, $5 gift card }`  
  8. `{ Espresso (with cinnamon), Latte }` *(Identical to Espresso but labeled differently)*  
  9. `{ Black Coffee, Iced Coffee, Choose next topic }`  
  10. `{ All options from Cards 1–9 }`  

  ---

  ### **Procedure & Timeline (75 min)**  
  **0–5 min: Intro (You)**  
  - Frame the problem: "We use clicks to infer user preferences. Today, you’ll reconstruct preferences from choices and see what’s missing."  
  - Assign roles per group: **2 Choosers**, **2 Analysts**.  

  **5–20 min: Generate Choice Data (Groups)**  
  - **Choosers:** Pick 1 option from each card (15 min).  
    - **Secret Instructions (for 1 Chooser per group):** Follow a rule, *not* personal preference:  
      - *Rule A:* Always pick the leftmost option.  
      - *Rule B:* Always pick the cheapest item (provide fake prices, e.g., Latte = $4, Espresso = $3).  
    - **Other Chooser:** Choose based on genuine preference.  
  - **Analysts:** Record choices (no discussion with Choosers).  

  **20–35 min: Reconstruct Preferences (Groups)**  
  - **Analysts:** Reconstruct each Chooser’s preferences (15 min).  
    - *Task 1:* Write a preference ordering consistent with the choices.  
    - *Task 2:* Assign utility values (e.g., Espresso = 10, Iced Coffee = 8) for 3 menus.  
    - *Task 3:* Decide if "Espresso" and "Espresso (with cinnamon)" are the same option.  

  **35–40 min: Reveal Rules (Groups)**  
  - Choosers reveal if they followed a rule or genuine preference.  

  **40–75 min: Debrief (Whole Group)**  
  - **Project debrief questions.** Guide discussion to hit key points.  

  ---

  ### **Debrief Questions & Mapping to Key Points**  
  **(Total: 35 min)**  

  1. **Indeterminacy of Preferences & Utility Intensity (10 min)**  
     - *Q1:* "How many different preference orderings fit your Chooser’s data? Show examples."  
       - *Point:* Finite choices → multiple orderings (e.g., Espresso > Latte vs. Latte > Iced Coffee).  
     - *Q2:* "Compare utility values across groups. Did anyone assign Espresso=10 vs. Espresso=100? What breaks?"  
       - *Point:* Ordering survives, intensity doesn’t → trade-offs/risk require intensity (e.g., "How much coffee vs. snack?").  

  2. **Analyst Stipulation of Option Identity (10 min)**  
     - *Q3:* "Who treated 'Espresso' and 'Espresso (with cinnamon)' as the same? Why?"  
       - *Point:* Data doesn’t define "sameness" (e.g., analyst assumes labeling is irrelevant, but Chooser may care).  
     - *Q4:* "What if we added 'Iced Coffee (with sugar)'? Would your reconstruction change?"  
       - *Point:* Stipulation alters utility functions → data alone is silent.  

  3. **Rule-Following vs. "True" Preferences (10 min)**  
     - *Q5:* "Rule-followers: Did Analysts reconstruct your *real* preferences? Why/why not?"  
       - *Point:* Consistent choices ≠ "true" wants (e.g., leftmost-picking mimics stable preferences but isn’t "revealed").  
     - *Q6 (Sharper):* "If a user always clicks the first search result, does that reveal their preference?"  
       - *Tension:* Rule-following exposes the theory’s blindness to *why* choices are made.  

  4. **The Sharp Ending (5 min)**  
     - *Q7:* "Is the utility function you built a **discovery** about the person, or a **re-encoding** of the data?"  
     - *Q8:* **"What evidence would prove it’s a discovery?"**  
       - *Force the dilemma:*  
         - If they say "new choices," counter: "What if rule-followers pass new tests?"  
         - If they say "neural data/self-reports," counter: "But revealed preference rejects 'inner states'."  
       - *Conclusion:* "Without external validation, utility is just data compression. But do we *need* more?"  

  ---

  ### **Predictable Problems & Mitigation**  
  - **Problem 1:** Analysts assume rationality (e.g., no cycles) → miss indeterminacy.  
    *Fix:* Pre-brief: "Choices might fit many orderings; find at least two."  
  - **Problem 2:** Rule-followers accidentally violate rules → data inconsistency.  
    *Fix:* Simplify rules (e.g., "leftmost only") and rehearse privately.  
  - **Problem 3:** Utility assignments ignored → skip intensity discussion.  
    *Fix:* Require specific trade-off tasks (e.g., "Would Chooser swap Latte for 2 Cookies? Use utilities to decide").  
  - **Problem 4:** Groups stall on abstract debate → lose focus.  
    *Fix:* Use concrete examples ("Show your utility numbers for Card 3").  

  ---

  ### **Design Commitments & Self-Critique**  
  1. **Question-Begging Assumption:**  
     - This design assumes "utility" must represent *psychological intensity* (for trade-offs/risk). But revealed preference theory (RPT) often treats utility as *ordinal* (only ordering matters). By forcing intensity, we stack the deck against RPT.  

  2. **Strengthened Version:**  
     - The session makes *naive RPT* (choices directly = preferences) look weak. It ignores sophisticated RPT (e.g., Samuelson’s axioms), where consistency *defines* rationality without needing "intensity."  

  3. **What Would Change My Mind?**  
     - **Theory Grounds:** If RPT explicitly rejects cardinal utility (as it often does), demanding intensity is unfair. *Scrap if:* Participants universally agree intensity is irrelevant.  
     - **Observable Sign:** If groups *naturally* treat rule-followers’ utilities as "valid" (e.g., "Following rules *is* their preference!"), the design fails. *Scrap if:* >50% endorse this in Q7.  
     - **Alternative Plan:** If the above occurs, pivot to a session on *axiomatic consistency* (e.g., test choices for WARP violations) using historical click data.  

  **Final Note:** This design exposes tensions but risks caricaturing RPT. Its power lies in forcing engineers to *feel* the gap between data and "wants." If they leave arguing whether utility is "real," you’ve succeeded.
