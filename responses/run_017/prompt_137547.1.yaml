  - Point 3: "For the rule-following chooser, what preference ordering did you infer? Did it match what the chooser was actually doing? If not, what does that say about revealed preference?"
  - Point 2: "In your analysis, did you assume that the Apple in set1 and set2 was the same option? What if we told you that in set2 the apple was organic and in set1 it wasn't? Would you need to treat them as different? How would that change your analysis?"

  - Sharp Ending: "So is the utility function you reconstructed a discovery about the person or a compressed re-encoding of the data? What would count as evidence that you discovered something real? For example, if we presented a new menu and the chooser's choice matched your prediction, would that mean you discovered their preference? Or just that your encoding generalized? And what if the rule-following chooser's choices also generalized to new menus? Would that mean they have that preference after all?"

  **Note on Commitments:**
  This design assumes that utility is more than just a representation of choices (because we are contrasting rule-following with true preferences). But revealed preference theory typically does not make that distinction. If during the session the participants conclude that the rule-following chooser's utility function is just as valid as the others, then revealed preference theory is strengthened. But if they resist, then we have highlighted a tension. The design makes the theory look weaker in the face of rule-following, but a defender might argue that the rule-following is part of the preference. We are not providing a way to distinguish from choices alone.

  If I observed that participants easily accepted the rule-following behavior as revealing a preference (for following rules), then I would scrap this plan and design a session around the challenges of option identity and the need for cardinal utility for decision-making under risk.
