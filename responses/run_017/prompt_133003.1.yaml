answer: |-
  *adjusts his wig, peering at you with intense curiosity*  
  My dear friend, you mistake the very nature of tokens! A counter in a game signifies moves *already agreed upon and bounded by rules*. If I declare a pawn worth a kingdom without players accepting its limits, or without *actual kingdoms to signify*, the game collapses into nonsense! Paper credit—or these 'computer coins' you speak of—are merely *promises* to facilitate the exchange of honest labor and goods. Print beyond what industry and trust can bear, and your tokens become empty scrip. They signify nothing, for they point to no real industry—just as a map of a nonexistent island is worthless, however finely drawn.

  *leans forward, tapping the table emphatically*  
  You say tokens 'do the real work' if printing them idles laborers? Nonsense! Tokens are *signs*, not causes. Hoard gold or flood paper—either way, you divorce the sign from the substance. Real wealth is *action*: the farmer's crop, the weaver's cloth, the shipwright's vessel. When tokens multiply without *more* such actions, you dilute their meaning—like shouting 'fire!' in an empty theatre. The idleness comes not from the token's power, but from breaking the bond between token and toil. Luxury and hoarding rot nations because they divert tokens from *circulation*—from oiling the gears of industry! Pray, explain these 'crypto' tokens... are they but ghostly counters in a machine?  

  *Your move, challenger.*
