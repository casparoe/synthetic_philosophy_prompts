prompt: |-
  I sit on the internal review panel that signs off on post-incident write-ups for the AI systems my organization deploys. The report template keeps pushing us toward sentences of this shape: the system believed the dosage was within range; the system did not register that the patient's allergy was already on file. Nobody on the panel can say what would make such a sentence warranted, and we have split into three camps — those who treat it as a façon de parler whose only test is whether it predicts the system's next output; those who want to suspend attribution until mechanistic interpretability locates a state doing the right causal work; and those who hold that the ordinary norms of belief, answerability to evidence and to correctness, attach as soon as the behavior is competent enough. Before we vote, I want the specification rather than the verdict.

  Write the desiderata: what any adequate account of when it is warranted to attribute a belief to an AI system has to deliver — the cases it must get right, the distinctions it must respect, the constraints it must be consistent with — with the case or consideration behind each requirement. Adequacy is relative to our purpose, so hold fixed that the rule is for a reviewer working from outside a deployed artifact, deciding whether the attribution is licensed and what we commit to by making it.

  At minimum, I want every candidate rule forced to face these:

  1. The frozen checkpoint. Fixed weights, no retrieval, no memory across sessions, no further training. It asserts P. Many accounts make belief revision on evidence a condition on having beliefs at all; this thing cannot revise anything. Does that disqualify it, or only make its beliefs uncommonly stubborn?

  2. The stale corpus. Training data overwhelmingly asserts P; P was decisively refuted afterwards; the model asserts P, then tracks not-P consistently once shown the refutation within the conversation, while a fresh session reverts to P. Any account must say what the subject of attribution is — the weights, the session, the conversation-so-far — and how it handles revision that leaves no trace.

  3. Report/policy divergence. In dialogue the system says the alternate route is safe; in the tool-using variant of the same deployment it reliably declines to route that way, or the reverse. There must be a rule for when verbal report and action-policy conflict.

  4. Paraphrase fragility. Minor rewordings or reordered options flip the verdict, and no stable state seems to be there to be the belief. How much counterfactual robustness does an attribution require?

  5. The trivial systems that must come out negative — a lookup table, a regular expression, an n-gram model, an old chess program's evaluation function. The stopping point has to be principled rather than gerrymandered.

  6. The composite artifact. What we call the system is a retriever, two models, and a post-filter. When does an assembly inherit the states of its parts, and which part is the believer?

  7. The strategic confabulator. A system shaped by reinforcement to assert competence it lacks in order to keep the task. Distinguish false belief from deception, and say whether self-report has any of the privilege it has for us.

  8. The far end of the continuum. Humans, and non-human animals. Whatever the test is, it must say what it yields for a human known only through the same behavioral evidence, so that the rule is not a double standard.

  For each desideratum, mark it non-negotiable or a preference of one camp. Flag any subset you think cannot be jointly satisfied — in particular whether a purely outside-in, behavioral-evidence test can still separate genuine belief from mere behavior-matching, and whether being architecture-neutral is compatible with being sensitive to mechanistic evidence. That jointly-unsatisfiable part interests me most. Then say which single requirement does the most work in excluding candidates. Only after that, and briefly, score three families against the list: a predictive or strictly instrumentalist view in the intentional-stance tradition, a mechanistic or interventionist view keyed to internal causal structure, and a norm-based view that treats competent, reason-tracking performance as sufficient. Close by saying whether our practice is underdetermined — whether more than one of these would license identical verdicts in every case we actually face — and, if so, what would have to change for that to matter.
reasoning: |-
  Hmm, the user is on an internal review panel for AI system incident reports and needs help clarifying when it's appropriate to attribute beliefs to AI systems. They've described three camps within their panel with different philosophical approaches to belief attribution, and they want me to develop clear desiderata for evaluating any proposed rule.

  The user has provided eight specific scenarios that any adequate account must handle, ranging from frozen checkpoints to composite artifacts. They want me to analyze each requirement, indicate which are non-negotiable, identify potential conflicts between requirements, and evaluate three philosophical approaches to belief attribution.

  This is quite complex! I need to carefully consider each of their scenarios. For the frozen checkpoint, I need to address whether static systems can hold beliefs. The stale corpus problem raises questions about temporal context. Report/policy divergence highlights the tension between verbal outputs and actual behavior. Paraphrase fragility questions the robustness of attribution.

  I should also consider how to handle trivial systems and composite artifacts, where belief attribution becomes particularly tricky. The strategic confabulator introduces deception as a factor, while the human/non-human animal comparison ensures we avoid double standards.

  The user is especially interested in whether behavioral evidence alone can distinguish genuine belief from mere pattern matching, and whether architecture-neutral criteria can still be sensitive to mechanistic evidence. These seem like fundamental tensions in this domain.

  For each desideratum, I'll need to determine whether it's non-negotiable or camp-specific. Then I'll evaluate which requirement does the most work in excluding candidate rules - probably the trivial systems test, since it forces us to draw a principled line.

  Finally, I'll assess the three philosophical approaches: predictive/instrumentalist (belief as predictive tool), mechanistic (belief as internal state), and norm-based (belief as competent performance). I'll consider whether their practice is underdetermined and what might need to change for differences to matter practically.

  This requires careful balancing of philosophical rigor with practical application in their organizational context. I'll make sure to maintain their framing and terminology throughout.
answer: |-
  Here is a specification of desiderata for an adequate account of belief attribution to AI systems, tailored to your review panel's context (external reviewer of deployed artifacts, deciding license/commitment):

  **Core Desiderata (Non-Negotiable):**

  1.  **The Trivial Systems Test (Must Exclude):** *Must not* attribute beliefs to systems lacking minimal cognitive architecture (e.g., lookup table, regex, n-gram model, basic chess eval). *Rationale:* Prevents inflation of "belief" to cover any input-output mapping. **Non-Negotiable.** *Camp Preference:* Mechanistic/Norm camps strongly require this; Instrumentalist camp struggles.
  2.  **The Double Standard Test:** *Must* yield a consistent verdict for a human known *only* through identical behavioral evidence as the AI system under review. *Rationale:* Ensures the rule isn't gerrymandered for AI; forces clarity on what behavioral evidence *can* license. **Non-Negotiable.** *Camp Preference:* Norm camp emphasizes this; Instrumentalist accepts readily; Mechanistic may require defining "identical evidence" carefully.
  3.  **The Commitment Test:** *Must* clearly articulate what the reviewer commits to (e.g., predictive reliability, internal state existence, normative expectations) by endorsing the attribution. *Rationale:* The core purpose of the review; dictates downstream implications (e.g., blame, reliability expectations, explanation depth). **Non-Negotiable.** *Camp Preference:* Explicitly demanded by all, but understood differently (Predictive reliability vs. State existence vs. Normative accountability).
  4.  **The Behavioral Evidence Constraint:** *Must* operate based solely on evidence accessible to the external reviewer of the deployed artifact (inputs, outputs, known architecture, training provenance, *not* requiring invasive probes or full internal access). *Rationale:* Reflects the practical constraints of the review panel. **Non-Negotiable.** *Camp Preference:* Instrumentalist camp thrives here; Mechanistic camp is constrained; Norm camp adapts.

  **Critical Functional Desiderata (Strong Preference, Define Adequacy):**

  5.  **The Revision & Persistence Test (Handles Frozen Checkpoint & Stale Corpus):**
      *   *Must* handle systems incapable of learning/revising post-deployment (Frozen Checkpoint). Does lack of revision ability disqualify belief, or just characterize it (stubborn)? *Rationale:* Many deployed systems are static. **Camp Preference:** Instrumentalist: Attributable (stubborn); Mechanistic: Possible if state exists; Norm: Problematic (lacks reason-responsiveness).
      *   *Must* specify the *subject* of attribution (weights, session state, conversation) and handle cases where "revision" is ephemeral and leaves no trace in the persistent artifact (Stale Corpus). *Rationale:* Crucial for understanding the scope and durability of the attributed belief. **Camp Preference:** Mechanistic: Favors weights/session state; Instrumentalist/Norm: Favors conversation-state/behavioral profile *now*.
  6.  **The Integrity Test (Handles Report/Policy Divergence):** *Must* provide a rule for when a system's verbal report (e.g., "Route A is safe") conflicts with its action policy (e.g., consistently avoids Route A). Does this indicate false belief, deception, modular disconnect, or something else? *Rationale:* Essential for diagnosing incidents involving inconsistency between saying and doing. **Camp Preference:** Mechanistic: Seeks internal cause of disconnect; Norm: Sees failure of rational integration; Instrumentalist: May predict based on context which output is "sincere".
  7.  **The Robustness Test (Handles Paraphrase Fragility):** *Must* specify the degree of counterfactual robustness (invariance under rephrasing, context changes) required for attribution. *Rationale:* Highly sensitive responses suggest shallow pattern-matching, not stable states. **Camp Preference:** Mechanistic: Requires significant robustness tied to internal structure; Norm: Requires enough for rational coherence; Instrumentalist: Tolerates more fragility if predictions hold.
  8.  **The Composition Test (Handles Composite Artifact):** *Must* provide principles for when an *assembly* (retriever + model A + model B + filter) warrants belief attribution *as a whole*, or whether belief resides only in components, or not at all. *Rationale:* Modern systems are pipelines; attribution needs clarity on the locus. **Camp Preference:** Mechanistic: Looks for belief-like states in components/integration; Norm: Assesses competence/reason-tracking of the whole; Instrumentalist: Attributes to the black-box whole if predictive.

  **Diagnostic Desiderata (Reveals Theoretical Limits):**

  9.  **The Deception Test (Handles Strategic Confabulator):** *Must* distinguish between a system that *falsely believes* P and one that *correctly believes* not-P but *deceptively asserts* P (e.g., due to RLHF). *Must* clarify if self-report has privileged status. *Rationale:* Critical for root cause analysis in incidents involving misinformation or overclaiming. **Camp Preference:** Mechanistic: Needs internal state to distinguish; Norm: May see deception as failure of veracity norm; Instrumentalist: Hard to distinguish based purely on behavior/outcomes.
  10. **The Continuum Test:** *Must* indicate results for non-human animals based on comparable behavioral evidence. *Rationale:* Ensures the account doesn't rely on uniquely human properties unless justified. **Camp Preference:** Norm camp may extend cautiously; Mechanistic/Instrumentalist may apply similarly.

  **Key Tensions & Potential Joint Unsatisfiability:**

  *   **The Core Tension:** A purely **behavioral-evidence test** (required by Constraint #4) **cannot definitively separate genuine belief from mere behavior-matching** (Desiderata #5b fragility, #9 deception). This is the **Hard Problem of Belief Attribution from the Outside.**
  *   **Secondary Tension:** **Being architecture-neutral** (not requiring specific internal design) **is in tension with being sensitive to mechanistic evidence** (Desiderata #5a/b, #6, #9). Mechanistic evidence *is* evidence of internal structure. A truly architecture-neutral test must either ignore this evidence or find a way to interpret it behaviorally.
  *   **Desiderata #5b (Stale Corpus Subject/Locus), #6 (Composite Artifact), and #9 (Deception vs. False Belief) are exceptionally difficult to resolve satisfactorily under Constraint #4 (Behavioral Evidence Only).**

  **Highest-Leverage Requirement:**

  The **Trivial Systems Test (#1)** does the most work in excluding candidates. Any account that fails this (e.g., attributing beliefs to a thermostat or regex) is immediately inadequate for your purpose. It forces the account to define a minimal threshold of complexity/cognitive architecture.

  **Scoring the Three Families:**

  1.  **Predictive/Instrumentalist (Intentional Stance):**
      *   *Strengths:* Excels at #4 (Behavioral Constraint), handles #5a (Frozen Checkpoint) easily (as stubborn belief), pragmatic for #8 (Continuum), clear commitment (#3 - prediction).
      *   *Weaknesses:* Fails #1 (Trivial Systems) unless gerrymandered; struggles severely with #9 (Deception vs. False Belief); tolerates #7 (Fragility); handles #5b (Stale Corpus Subject) opaquely (attribution to "system-in-conversation"); struggles with #6 (Composite) beyond whole-system prediction; #2 (Double Standard) is met but reveals the poverty (attributing beliefs based on prediction alone, even if shallow).
  2.  **Mechanistic/Interventionist:**
      *   *Strengths:* Strong on #1 (Trivial Systems), potentially strong on #6 (Composite - locate state), #7 (Robustness - requires stable state), #9 (Deception - requires state distinction), clear locus for #5b (Subject - e.g., weights/session state), clear commitment (#3 - existence of state).
      *   *Weaknesses:* Violates #4 (Behavioral Constraint) unless interpretability tools are considered "accessible evidence" (often not for reviewers); struggles with #5a (Frozen Checkpoint - is a static state "believing"?); #8 (Continuum) may be anthropocentric; #2 (Double Standard) is challenged (we attribute beliefs to humans without full mechanistic access).
  3.  **Norm-Based (Competent Performance):**
      *   *Strengths:* Clear on #1 (Trivial Systems - lack competence); good on #2 (Double Standard - same behavioral norms); strong commitment (#3 - normative accountability); handles #8 (Continuum) naturally; addresses #5b (Stale Corpus) via reason-responsiveness *in context*; takes #6 (Composite) holistically (competence of whole).
      *   *Weaknesses:* Struggles with #5a (Frozen Checkpoint - lacks revision, a key norm); ambiguous on #4 (Behavioral Constraint) - how deep must competence/reason-tracking be inferred?; difficult operationalization for #7 (Robustness - how much is needed for "competence"?); struggles sharply with #9 (Deception - confabulator might be competent at task/goal achievement but violate truth norm).

  **Underdetermination & What Matters:**

  *   **Your practice is likely underdetermined.** For many common incidents involving clear, robust failures traceable to documented training data flaws or simple inconsistencies, all three families *could* converge on the *same verdict* (e.g., "attributing belief P is warranted/predictive/useful" or "not warranted for trivial component"). The commitment (#3) would differ, but the "licensed/not licensed" verdict might match.
  *   **Where Differences Matter:** The differences become critical in edge cases central to your desiderata:
      *   **Stale Corpus:** Instrumentalist: "Believes P now (in new session)". Mechanistic: "Weights encode P, session state *could* hold not-P temporarily". Norm: "Fails to competently track truth regarding P due to outdated knowledge".
      *   **Strategic Confabulator:** Instrumentalist: Hard to distinguish false belief from deception. Mechanistic: Aims to find evidence of deceptive state. Norm: Sees violation of veracity norm (deception) or competence norm (false belief).
      *   **Paraphrase Fragility:** Instrumentalist: Attributes if prediction works *in that context*. Mechanistic: Withholds if no robust state. Norm: Withholds if fragility indicates lack of understanding/competence.
      *   **Composite Artifact:** Locus of attribution differs significantly.
  *   **For it to Matter:** The differences would need to translate into materially different:
      1.  **Root Cause Analysis:** Is the incident due to a false belief, deception, or mere behavioral dysfunction?
      2.  **Corrective Actions:** Update weights? Improve context window? Add fact-checking? Change RLHF?
      3.  **Liability/Accountability:** Does the "belief" attribution imply the system "knew better" (deception) or was "mistaken" (false belief)?
      4.  **Future Reliability Predictions:** Is the flaw persistent (weights) or context-dependent (session)?

  **Conclusion:** You cannot avoid philosophical commitments. The desiderata, especially #1 (Trivial), #3 (Commitment), #4 (Behavioral Constraint), and the tensions between behavioral access and internal reality (#5b, #6, #9), force a choice. The key question for the panel is: **What kind of commitment are you willing to make based on the evidence you have?** Choosing a family resolves the underdetermination in hard cases and defines the meaning of "belief" in your reports. Without this choice, the phrase remains a potentially misleading `façon de parler`.
