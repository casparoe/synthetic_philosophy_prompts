answer: |-
  **Bottom line:** Evolutionary cooperation mechanisms map cleanly to statistical physics concepts (positive assortment ≈ effective ferromagnetic coupling; iteration probability ≈ correlation length; phase transition at critical interaction range), but game-theoretic rationality and equilibrium selection are irreducibly non-physical residues.

  ### Translation to Condensed Matter Vocabulary
  1.  **One-Shot Prisoner's Dilemma:** A single spin pair with *antiferromagnetic* coupling in a fixed external field. Mutual cooperation (+1,+1) is metastable (higher free energy). Mutual defection (-1,-1) is the stable ground state (lower energy, minimal frustration). Temptation to defect is a strong local field breaking cooperative alignment. No dynamics beyond energy minimization → defect dominates.

  2.  **Iteration & Shadow of the Future:** The game is now a *dynamical system* on a graph (interaction network). Probability of future encounter *p* ≈ **correlation length ξ**.  
      -   *p < p_c* (short ξ): Interactions uncorrelated. Defection propagates; cooperators isolated spins flipped by "noise" (temptation). Free energy minimum remains defection-dominated.  
      -   *p > p_c* (long ξ): Emergence of **long-range order**. Strategies like Tit-for-Tat (TFT) act as **effective ferromagnetic couplings** across time steps: cooperation stabilizes via reciprocity. *p_c* defines a **genuine critical point** – sharp transition in order parameter (fraction of cooperative acts) as ξ diverges. Below *p_c*, cooperation decays exponentially; above, it percolates. This is **not a crossover**; it requires feedback (reciprocity ≈ interaction).

  3.  **Strategies as Effective Hamiltonians:**  
      -   *Always Defect (ALLD):* Fixed down spins; sinks energy/cooperation.  
      -   *Tit-for-Tat (TFT):* Short-range ferromagnetic coupling (spin *i* aligns with neighbor *j*'s *previous* state). Susceptible to "domain wall pinning" by noise (errors freeze defection).  
      -   *Generous/Forgiving TFT:* Adds **thermal noise** (probabilistic cooperation after defection) annealing domain walls. Reduces metastable traps but risks invasion by defectors (lower critical temperature).  
      -   *Pavlov/Win-Stay-Lose-Shift:* Local field rule based on payoff (spin flips if local energy increased). Self-reinforcing clusters; nucleation-dependent.

  4.  **Five Mechanisms ≈ Engineering Positive Assortment (r):**  
      All increase the **effective coupling J_eff** between cooperators or the **correlation function G(r)** for cooperative spins, raising the critical temperature (or lowering *p_c*). *r* (relatedness/covariance) is the master variable.  
      -   *Kinship:* Fixed **lattice structure** (e.g., family groups ≈ sublattice ordering). High local *r*.  
      -   *Direct Reciprocity:* Temporal ferromagnetic coupling (as above). Increases ξ.  
      -   *Indirect Reciprocity:* **Long-range interactions mediated by a "reputation field"** (scalar field φ_i). Cooperators align spins favorably in φ_i, increasing J_eff(|i-j|) for distant pairs. Defectors create local field disruptions.  
      -   *Structured Interaction (Network Reciprocity):** **Quenched disorder** in the interaction graph. Cooperators nucleate clusters on high-clustering/high-degree nodes. Defectors fragment the network (percolation threshold matters). *r* depends on graph topology.  
      -   *Group Selection:* **Coarse-graining**. Define "super-spins" (groups) with effective Hamiltonian. Migration ≈ weak inter-group coupling. Selection acts on group free energy. High *r* groups (ferromagnetic) outcompete low *r* groups (paramagnetic/antiferromagnetic).

  5.  **Evolutionary Stability:** A strategy is an **absorbing state** or **stable phase** under evolutionary dynamics (replicator equation ≈ Glauber/Kawasaki dynamics). TFT is metastable against ALLD below *p_c* but stable above. Generous strategies have broader basins of attraction but lower critical *T*. ALLD is globally stable only if J_eff < 0 everywhere.

  ### Residue Report
  **Hunch 1 (p_c as Critical Point):** Your reading is **fair and correct**. *p* controls ξ; the loss of cooperation below *p_c* is a phase transition driven by loss of correlation (ξ < system size). Reciprocity requires ξ > 1 (minimum interaction range); sharpness arises from the feedback loop in strategies like TFT (cooperation begets cooperation). Diverging susceptibility (response to perturbation) occurs near *p_c*.

  **Hunch 2 (One Rule: Positive Assortment):** This reduction is **largely honest and powerful**. *r* (relatedness ≈ covariance) directly sets the effective coupling strength J_eff. All five mechanisms modulate *r*. Network reciprocity adds percolation effects, and group selection adds coarse-graining, but *r* remains the key order parameter controlling the phase. **Thrown away:** Minor nuances in dynamics (e.g., reputation building vs. direct reciprocity kinetics differ slightly, like different exchange mechanisms), but no core cooperative mechanism is lost.

  #### The Fundamental Residue: Agency and Rationality
  Your vocabulary lacks terms for *intentional states* and *equilibrium selection by reasoning*. This is a gap in the *original framework's explanatory layer*, not your physics:

  | Physics Concept              | Game Theory Residue                              | Why It Doesn't Map                                                               | Significance                                                                 |
  | :--------------------------- | :----------------------------------------------- | :------------------------------------------------------------------------------- | :--------------------------------------------------------------------------- |
  | **Ground State (Energy Min)** | **Nash Equilibrium**                             | Physics finds minima dynamically. Game theory assumes agents *calculate* best responses via backward induction. | Rationality assumes perfect cognition/logic, not dynamics or sampling.       |
  | **Dynamics (Glauber, MC)**   | **Rational Choice / Backward Induction**         | Physics: Stochastic local updates. Game Theory: Global, counterfactual reasoning ("If I do X, they do Y..."). | "Acting for a reason" requires intentionality absent in spin flips.          |
  | **Phase Diagram (Ensemble)** | **Tournament Results / Single Equilibria**       | Physics: Emergent bulk behavior. Game Theory: Performance of specific strategies in specific (small-N) contests. | Tournaments measure fitness landscapes, not phase structure; prone to sampling bias. |
  | **Hamiltonian (Fixed)**      | **Equilibrium Selection**                        | Physics: Dynamics minimize given H. Game Theory: Multiple NE exist; "which one?" requires extra principles (focal points, refinements). | No physical analog for selecting among degenerate minima via "rationality".  |
  | **Order Parameter (r, m)**   | **Beliefs / Intentions**                         | Physics: Measurable collective variables. Game Theory: Agents act on *beliefs* about others' types/strategies. | Beliefs are internal representations, not observable correlations.           |

  **Is this residue a defect or a sign of thinness?** It's **both**:  
  1.  **Defect of Physics Framework:** Statistical mechanics describes *emergent collective behavior* from simple micro-rules. It cannot natively express intentional reasoning or counterfactual logic. These require a cognitive/computational layer.  
  2.  **Sign of Thinness in Debate:** Obsession with rational equilibria in one-shot games is often irrelevant. Evolution (dynamical systems on graphs) explains the *emergence and stability* of cooperation without invoking rationality. The "residue" is often superfluous for explaining *why* cooperation exists in nature. Evolutionary dynamics (which physics captures well) are primary; rationality is a derived narrative overlay in social contexts.
