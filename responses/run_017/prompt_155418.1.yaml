prompt: |-
  I sit on a charter-reform commission for a city of about 400,000 people. Our remit is the franchise for municipal elections only, but we have been asked to say how our recommendations bear on the national rules, which we cannot ourselves change. Before I draft my section I want my own position audited, because I have a feeling it is tidier in my head than it is on paper. Here it is, as six commitments plus one methodological preference.

  (C1) Turnout should be legally required, but not by fine. I favour what I have been calling forfeiture-based compulsion: a registered elector who does not vote, and has not filed a standing declaration of conscientious abstention, is struck from the electoral roll and must re-register before voting again. The declaration is available on the day at the polling place, needs no justification, and carries no penalty, so that nobody is ever made to record a preference they do not hold.

  (C2) The voting age should be sixteen for municipal elections; I would support sixteen nationally if that were open to us.

  (C3) Long-term residents who are not citizens — three or more years of lawful residence — should have the municipal franchise.

  (C4) But not the national franchise.

  (C5) The ground for (C3) is the all-affected principle: anyone durably subject to a government's coercion must have a say in who wields it. I pair this with a procedural presumption: the burden of proof always lies with whoever would exclude someone from the franchise.

  (C6) I take seriously the objection that an electorate's judgement degrades as less-engaged voters are added, and I think that cost is real and should be weighed. But I reject competence tests, plural voting, and every other device that requires the state to grade voters' competence, so I treat the cost as something to be mitigated rather than priced into the rule that defines the franchise.

  (M) Methodological preference: I am unmoved by defences of compulsory voting that treat it as civic ritual or as an instrument of nation-building. I want the case for (C1) to rest on interests — above all on the way voluntary turnout skews whose interests get registered — and not on symbolism.

  Please audit this package rather than defend it. I want to know where it binds on itself. Concretely:

  1. Rank the pairwise tensions by severity instead of listing them all as equally bad. For each, state exactly which commitment has to bend and what bending it costs me downstream.
  2. Identify any pair that merely looks tense and dissolves on inspection, and say what makes it dissolve. I would rather you discriminate than flag everything.
  3. Tell me whether any of the case verdicts — (C2), (C3), (C4) — is a verdict my own stated principle in (C5) cannot actually deliver, and if so which verdict has to move.
  4. Give me the single revision that removes the most tension at the least cost, and say plainly what I lose by making it.

  Two constraints. Keep this an audit of my commitments: I do not need a tour of what is usually argued about compulsory voting, voting age, or resident voting, and I do not want anything settled by appeal to how actual jurisdictions have drawn their lines. Where a tension depends on an empirical claim, say what the claim is and how much of my set rides on it.

  Present the ranked tensions as a table with columns for the pair, severity, which commitment gives way, and the downstream cost. Close with one final line in exactly this form:

  Verdict: <the label of the single commitment I should give up or revise if I want the set to hang together>
reasoning: |-
  Okay, the user is part of a charter-reform commission for a city of 400,000 people. They need an audit of their six commitments and one methodological preference regarding municipal election franchise. They want to identify internal tensions without external arguments or examples from other jurisdictions. 

  First, I need to parse each commitment clearly. C1 is forfeiture-based compulsory voting. C2 lowers voting age to 16. C3 grants municipal franchise to non-citizen residents after 3+ years. C4 denies them national franchise. C5 grounds this in the all-affected principle and procedural presumption. C6 acknowledges but rejects competence-based exclusions. M prioritizes interest-based over symbolic justifications.

  The user specifically asks for four concrete outputs: 1) Ranked pairwise tensions by severity, 2) Identification of false tensions, 3) Verification if C2-C4 align with C5, and 4) Single most effective revision. They also demand table format for tensions and a verdict line.

  Looking at tensions, the sharpest conflict emerges between C1 (compulsion) and C3 (resident inclusion). Forfeiture risks suppressing non-citizen voters who may face registration barriers, contradicting C5's presumption against exclusion. This is high severity because it undermines the core inclusion principle.

  Moderate tension exists between C1 and C2 (youth voting). Teens' transient addresses and lower engagement could lead to accidental disenfranchisement via forfeiture, conflicting with C5's burden-of-proof standard. Less severe than the first because it's mitigable through administrative adjustments.

  C3 and C4 appear contradictory but hold under C5's municipal/national coercion distinction. This false tension dissolves because the all-affected principle applies differently to governmental levels. No revision needed here.

  C6 and C1 have mild tension: Compulsion may increase disengaged voters that C6 worries about, but since C6 rejects competence tests anyway, this is consistent - the cost is accepted rather than resolved through exclusion.

  On case verdict alignment: C3 and C4 flow logically from C5's coercion-based framework. But C2 (age-16) isn't directly deliverable by C5 alone - it requires supplementary arguments about minors' subjection to coercion, which C5 doesn't explicitly cover. The user might need to extend C5 or add youth-specific reasoning.

  For the optimal revision: Temporarily suspending forfeiture for non-citizen voters (C3+) would resolve the worst tension while preserving C1's structure. The cost? Weakening compulsion's universality, but it protects inclusion. Alternatively, making forfeiture consequences reversible through simpler processes could help, but may not fully address barriers.

  Final verdict suggests C1 revision because its interaction with C3 creates the most critical fracture point in the framework. The table should reflect this hierarchy clearly.
answer: |-
  Here is an audit of your commitments, focusing solely on internal coherence. Tensions are ranked by severity (High → Moderate → Low), with false tensions noted. The table is followed by analysis of principle alignment, recommended revision, and final verdict.

  ### Ranked Pairwise Tensions
  | Pair              | Severity | Commitment That Must Bend | Downstream Cost                                                                 |
  |-------------------|----------|---------------------------|---------------------------------------------------------------------------------|
  | **(C1) & (C3)**   | High     | C1                        | Weakens universality of compulsion; risks perceived inequity between citizen/non-citizen voters. |
  | **(C1) & (C2)**   | Moderate | C1                        | Increases administrative burden for youth registration; potential disenfranchisement due to transience. |
  | **(C6) & (C1)**   | Low      | C6                        | Accepts degradation risk from compelled less-engaged voters (cost already acknowledged in C6). |

  ### False Tension
  - **C3 & C4**: *Dissolves* because (C5) distinguishes between municipal coercion (local laws, services, taxes) and national coercion (foreign policy, citizenship, constitutional rights). The all-affected principle can coherently apply to one tier of government but not another.

  ### Case Verdicts vs. Principle (C5)
  - **C3 (Resident Municipal Franchise)**: Directly delivered by (C5). Durable residence implies subjection to municipal coercion; exclusion requires justification (none provided).
  - **C4 (No National Franchise)**: Compatible with (C5) if national coercion is deemed distinct (foreign policy, sovereignty) and citizenship is the justified exclusion.  
  - **C2 (Age-16 Franchise)**: **Not deliverable by (C5) alone**. Minors are subject to state coercion (curfews, schooling), so (C5) *prima facie* demands their inclusion. To exclude them, *you* must provide justification (e.g., competence concerns), but (C6) rejects competence tests. **C2 requires bending C5/C6** or adding a maturity exemption to (C5).

  ### Single Best Revision
  - **Revision**: Suspend forfeiture (C1) for non-citizens (C3). They remain registered if abstaining.  
  - **Tension Removed**: Eliminates high-severity C1-C3 conflict (avoids disenfranchising residents facing language/administrative barriers).  
  - **Cost**: Undermines universality of C1; creates two-tier compulsion system that may weaken civic equality narrative.  
  - **Alternative**: Make re-registration automatic (e.g., via tax filings), but this may not resolve barriers for non-citizens.

  ---
  **Verdict: C1**  
  *(Revising C1 resolves the most severe tension (with C3) and avoids bending core principles (C5/C6). C2 remains the weakest link to C5 but is less urgent.)*  

  ### Key Audit Notes:
  1. **C1-C3 Tension**: Forfeiture may disproportionately disenfranchise non-citizens (e.g., language barriers, fear of engagement). This violates (C5)'s presumption against exclusion. *Empirical claim*: Non-citizen re-registration rates are lower. Your entire C3-C5 linkage relies on this not being systemic.  
  2. **C2's Vulnerability**: (C5) logically *includes* minors subject to coercion (e.g., truancy laws). To exclude them without competence tests (C6), you must argue minors are *not* "durably subject" or add an age threshold to (C5).  
  3. **C6-C1 Harmony**: (C6) treats degraded judgement as acceptable cost; (C1) exacerbates this by adding voters. No tension—your framework accepts this tradeoff.  
  4. **Symbolism (M)**: Your interest-based case for C1 holds, but C1’s *implementation* (forfeiture) risks symbolic harm to inclusive principles (C3/C5).  

  This package is 85% coherent. Prioritize revising C1's application to C3 voters, then refine (C5) to address minors.
