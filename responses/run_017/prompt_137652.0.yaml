  For cruxes and tests, I'll propose concrete analyses using the corpus data: invariance test (varying antisemitism levels in similar situations), transport test (varying situational pressures with same background), substitution test (role switching), and auxiliary comparisons. Each test should specify what evidence would challenge each theory.

