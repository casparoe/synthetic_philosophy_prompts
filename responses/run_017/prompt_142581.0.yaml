prompt: |-
  In a reading group on Anscombe's protest against Oxford giving Truman an honorary degree, one member keeps shutting down every discussion with the same line: *the deliberate killing of the innocent is never permissible*, and that is supposedly all there is to say about Hiroshima. I think it's doing about four jobs at once and I want the menu, not one of them explained.

  Separate the precise claims that sentence could be making — about who counts as innocent (non-combatant? morally blameless? not currently attacking anyone? not liable for some reason other than fault?), about what deliberate covers (intended as an end, as a means, merely foreseen, accepted as a side effect, risked because the upside is huge), about whether it's a rule about acts or about what sort of person one turns into and what a community can afterwards avow, and about whether it's absolute or just a very heavy presumption. For each, say whether it's a platitude, a substantive thesis someone could deny, or something that quietly begs the question, and whether it actually gets him his conclusion about Truman or only looks like it does.

  Two cases where I got lost: a night strike on a munitions plant whose workers are all asleep and so not attacking anyone, though the plant is what keeps the war running; and a crew that aims at the plant, gets blown off course by wind, and kills a schoolfull of children — same deaths, no intention of them. Plus a case I made up: Truman is credibly told the bombs will end the war, but the same report says a demonstration detonation over an empty bay would probably work too, and he picks the city because if the demonstration failed he'd be blamed for the extra months of fighting. Is that deliberating about the deaths, or only about his career, and does it matter which?

  Last thing: someone said the whole argument rests on a forecast, and since the forecast was uncertain, Anscombe should've been uncertain too. I think that's a bad argument but can't say why — what would the good version of that worry look like, and does it cut against her or against Truman?
reasoning: |-
  Okay, the user is dealing with a frustrating situation in their reading group where one member keeps shutting down discussions on Anscombe's protest against Truman's honorary degree by repeating the line "the deliberate killing of the innocent is never permissible." The user wants to dissect this statement to reveal its underlying assumptions and show how it might not straightforwardly condemn Truman's decision regarding Hiroshima. 

  The user seems intellectually sophisticated, likely a philosophy student or academic, given their grasp of concepts like double effect and liability. Their frustration suggests they value nuanced discussion and feel this slogan is stifling deeper exploration. They're not just asking for counterarguments—they want a toolkit to dismantle the slogan's rhetorical power by exposing its hidden complexities. 

  Hmm, the core challenge here is untangling the slogan's four overlapping dimensions: innocence, deliberateness, moral rule type, and absoluteness. Each dimension contains traps. For example: 

  - **Innocence**: Does it mean non-combatants? Morally blameless? Not currently attacking? The Hiroshima victims included conscripted factory workers—are they "innocent"? If innocence requires moral blamelessness, that risks begging the question (since supporting an unjust war might make one "guilty"). 

  - **Deliberateness**: This is where double effect gets messy. Truman's primary intention was ending the war; civilian deaths were foreseen but (arguably) not intended. The user's wind-blown bomb example cleverly shows identical outcomes with different intentional structures. And their career-motivation scenario probes whether self-interest changes the moral calculus even if deaths are merely foreseen. 

  - **Rule type**: Is this a rule about acts or character? If it's about acts, we debate permissibility; if about character/community, we might condemn Truman personally while conceding the act was tragically necessary. Anscombe likely emphasized the latter. 

  - **Absoluteness**: Calling it "never permissible" makes it sound absolute, but even absolutists allow exceptions (e.g., self-defense). The munitions plant night strike tests this—are sleeping workers "innocent"? If not, the slogan doesn't apply. 

  The user's worry about forecasts is spot-on. A *good* version would note that moral certainty requires epistemic certainty: if Truman couldn't know the bomb would save lives, his choice becomes recklessness, not tragic necessity. But this cuts both ways—Anscombe's protest assumed the bomb was *unnecessary*, which was also uncertain in 1956. 

  ...I should structure this as a taxonomy. For each dimension, flag: (a) plausible interpretations, (b) whether each is platitudinous/substantive/question-begging, and (c) if it actually condemns Truman. The night strike, wind deviation, and careerism cases will serve as litmus tests. 

  Key realizations: 
  - The slogan works best against "direct targeting of non-combatants," which Hiroshima arguably was. But proving "direct targeting" requires dissecting Truman's intentions. 
  - If "deliberate" includes foreseen-but-unintended side effects, most wartime bombings become impermissible—which might be Anscombe's point but isn't a platitude. 
  - The forecast objection is weakest if framed as "Truman couldn't know"—stronger if noting Anscombe later admitted the bomb might have been necessary. 

  This user deserves applause for spotting how a moral slogan can be a "Swiss army knife" of ambiguities. My reply should arm them to expose that.
answer: |-
  Here's a dissection of the slogan "the deliberate killing of the innocent is never permissible," broken down into its core ambiguities and applied to your cases. Each component is analyzed for its status (platitude, substantive, or question-begging) and whether it actually condemns Truman.

  ---

  ### **I. Components of the Slogan**
  #### A. **Who is "Innocent"?**
  1. **Non-combatant (not contributing to hostilities)**:  
     - *Status*: **Substantive thesis**. Widely accepted in just war theory but deniable (e.g., total war proponents).  
     - *Truman verdict*: **Condemns** if Hiroshima victims are non-combatants (but many worked in war industries).  
     - *Test cases*:  
       - *Night strike on munitions plant*: Workers are non-combatants *while asleep*? Arguably innocent.  
       - *Wind-blown bomb*: Children are paradigmatically innocent.  

  2. **Morally blameless (no guilt for the threat)**:  
     - *Status*: **Question-begging**. Assumes supporting an unjust regime makes one "guilty" — which is the very issue in dispute.  
     - *Truman verdict*: Only condemns if all Japanese citizens are deemed "guilty" (which is circular).  

  3. **Not currently attacking**:  
     - *Status*: **Substantive thesis**. Deniable by those who see collective responsibility (e.g., "the nation is attacking").  
     - *Truman verdict*: **Condemns** (Hiroshima victims weren’t actively fighting).  
     - *Test case*: *Night strike*: Sleepers aren’t attacking → innocent.  

  4. **Not liable to harm (no forfeiture of rights)**:  
     - *Status*: **Substantive thesis**. Liability could arise from contribution, not just fault (e.g., munitions workers).  
     - *Truman verdict*: **Fails to condemn** if workers are liable (but children aren’t).  

  #### B. **What is "Deliberate"?**  
  1. **Intended as end/means (direct targeting)**:  
     - *Status*: **Platitude**. Directly targeting innocents *is* widely condemned (but Hiroshima may not fit).  
     - *Truman verdict*: **Fails to condemn** if deaths were a foreseen side effect (not the means to end the war).  

  2. **Foreseen and accepted side effect**:  
     - *Status*: **Substantive thesis**. The core of the Doctrine of Double Effect (DDE). Deniable by consequentialists.  
     - *Truman verdict*: **Ambiguous**. If deaths were "collateral damage," DDE *might* permit it given proportionality.  

  3. **Merely foreseen but unintended**:  
     - *Status*: **Substantive thesis**. Key distinction for DDE.  
     - *Test case*: *Wind-blown bomb*: Deaths unintended → not "deliberate" under DDE.  

  4. **Recklessly risked (no intention, but unjustifiable risk)**:  
     - *Status*: **Platitude**. Reckless endangerment is widely condemned.  
     - *Truman verdict*: **Condemns** if the risk to civilians was disproportionate (e.g., no military necessity).  

  #### C. **What Kind of Rule is This?**  
  1. **Act-focused (never permissible, regardless of consequences)**:  
     - *Status*: **Substantive thesis** (absolutism). Deniable by utilitarians or moderate deontologists.  
     - *Truman verdict*: **Condemns** if bombing counts as "deliberate killing."  

  2. **Character/community-focused (corrupting the agent/society)**:  
     - *Status*: **Substantive thesis**. Anscombe’s emphasis: honoring Truman condones evil.  
     - *Truman verdict*: **Condemns** by implicating societal complicity.  

  #### D. **Is it Absolute?**  
  1. **Absolute prohibition (no exceptions)**:  
     - *Status*: **Substantive thesis**. Deniable (e.g., for self-defense, unintended killings).  
     - *Truman verdict*: **Condemns** only if the act fits the description.  

  2. **Strong presumption (override only in extreme cases)**:  
     - *Status*: **Platitude**. Most deontologists accept this.  
     - *Truman verdict*: **Ambiguous** — did the bomb meet the threshold for overriding?  

  ---

  ### **II. Applying to Your Cases**
  - **Night strike on munitions plant**:  
    - If "innocent" = non-combatant/asleep, it’s prohibited.  
    - If "deliberate" requires intention, and the goal is destroying the plant (not killing workers), DDE *might* permit it.  

  - **Wind-blown bomb killing children**:  
    - Deaths are unintended → not "deliberate" under DDE. The slogan **does not condemn** this (unless "deliberate" includes recklessness).  

  - **Truman’s careerism case**:  
    - He *foresaw* deaths but intended only to save his career (the bomb’s use was a means to that end).  
    - This makes the deaths **intended as a means** to his goal → unambiguously "deliberate," and **condemned** by the slogan.  
    - *Why it matters*: Reveals whether the slogan targets intention or foresight. Here, it would condemn Truman *more strongly* than in the historical case.  

  ---

  ### **III. The Forecast Objection**
  - **Bad argument**: "The forecast was uncertain, so Anscombe should have been uncertain."  
    - *Why bad*: Uncertainty affects *Truman’s justification*, not Anscombe’s critique. If Truman acted on insufficient evidence, he’s culpable for recklessness. Anscombe’s protest (in 1956) could rely on *post hoc* evidence showing the bomb was unnecessary.  

  - **Good version of the worry**:  
    1. **Against Truman**: If he couldn’t reasonably foresee the bomb ending the war (or alternatives like a demonstration), his choice was *disproportionate* or *reckless*. The slogan condemns him if "deliberate" includes unjustifiable risk.  
    2. **Against Anscombe**: If the *necessity* of the bomb was uncertain *in 1945*, but Truman had credible reports it would save lives, condemning him as a murderer ignores the epistemic constraints of decision-making in war. Anscombe might overstate moral clarity retroactively.  

  ---

  ### **Conclusion: How the Slogan "Gets" Truman (or Doesn't)**
  - **Only condemns Truman if**:  
    - "Innocent" = non-combatants (plausible for children, not factory workers).  
    - "Deliberate" includes foreseen side effects *and* the act fails proportionality (substantive debate).  
    - The rule is absolute or the bombing didn’t meet the threshold for exception (contentious).  
  - **Fails or is question-begging if**:  
    - "Innocent" is moralized (assuming Japanese civilians were "guilty").  
    - "Deliberate" excludes foreseen-but-unintended deaths (DDE).  
    - The focus is on character but Truman’s decision was justifiable under duress.  

  **The slogan’s power comes from conflating these dimensions**. It borrows the intuitive force of "don’t murder innocents" (platitude) to condemn an act that may be closer to "risking foreseen collateral damage in war" (substantive debate). Your careerism case shows how easily the slogan can be weaponized *even if historical Truman wasn’t motivated that way* — exposing its malleability as a rhetorical tool. Anscombe’s real target was Oxford’s *moral complacency*, but the slogan alone can’t carry that weight without unpacking.
