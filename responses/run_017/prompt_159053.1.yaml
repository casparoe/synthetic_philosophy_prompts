prompt: |-
  I'm putting together a one-page handout for the modeling course I TA, on when an unrealistic assumption is excusable and when it isn't, and I realised I have a lot of verdicts and no principle. Here they are, going by gut.

  - Planets as point masses, Earth as a perfect sphere, in orbital mechanics: fine, obviously.
  - Galileo's frictionless plane: fine.
  - Ideal gas: point molecules, no intermolecular forces, perfectly elastic collisions: fine, even though it's false in a way that matters, since real gases condense.
  - Hardy-Weinberg: infinite population, random mating, no selection, no mutation: fine, but for a weird reason — the whole point of the model is that its assumptions are false and the interesting quantity is how far the real population departs from them.
  - Schelling's checkerboard segregation thing, where agents are dots on a grid with only a mild preference for same-colour neighbours: fine, genuinely illuminating.
  - Friedman's billiard player, who plays as if he were solving the Newtonian equations for the shot: I want to say fine, but the as-if move makes me uneasy in a way the frictionless plane doesn't.
  - Perfect rationality and expected-utility maximisation in a model whose conclusion is that markets are efficient: not fine. The conclusion is basically already in the assumptions.
  - Representative agent in a macro model used to size a fiscal stimulus: not fine. Different households have different propensities to spend out of a transfer, and that heterogeneity is the mechanism.
  - Coase: zero transaction costs: fine, and again the content seems to live in what happens when you relax it.
  - Infinitely-lived agent with a transversality condition in an overlapping-generations model: not fine. This one bugs me because Hardy-Weinberg is also an infinite idealisation and I said that one was fine.
  - The firm as a profit-maximising black box, in a theory-of-the-firm model: not fine. But the cell as a well-mixed bag of chemicals, in a model of a metabolic pathway: fine. Both swap a messy interior for something simple and I come out opposite ways.
  - My own case, the Domino model of eviction cascades: I assume every household faces an identical eviction probability that it knows, and I assume landlords never renegotiate an arrears schedule. I feel fine about the first and queasy about the second, and they're equally false.

  The one I keep flip-flopping on: homogeneous mixing in compartmental epidemic models. It's false, contacts are structured, and R0 and the herd-immunity threshold depend on it, but its also the basis of basically every useful result in the field.

  My tentative rule, which I don't think survives: an unrealistic assumption is OK iff (a) the model's result is robust to de-idealising it, i.e. you put the friction back and the qualitative result survives, and (b) the assumption isn't about the very thing the model is supposed to explain.

  Problems I can half see: (a) seems to condemn the ideal gas, since near condensation the law just fails, and maybe Schelling too, since I'm not sure the segregation result is robust at all. And (b) looks circular in a different way: in Schelling the assumption is about preferences and the model is explaining segregation from preferences, yet I want to allow it. But I cant see what should replace (b).

  So: run the rule against my list, tell me which verdicts it can't deliver and which verdict it forces me to drop, and repair it into something precise, with each clause tied to the case that motivates it. I'd rather have a three-clause principle that saves everything than a tidy one that tells me the Domino model is fine after all, but say which you'd actually pick and why. And tell me what yours says about two cases I haven't listed: a model of citation networks in which papers cite uniformly at random among all earlier papers, and a model of academic hiring in which each candidate's quality is a single scalar that the committee observes perfectly.
reasoning: |-
  Hmm, the user is a teaching assistant for a modeling course who's struggling to develop a coherent principle for when unrealistic assumptions are acceptable in models. They've provided a list of specific modeling scenarios with their gut reactions about whether each unrealistic assumption is "fine" or "not fine," and they're looking for a systematic framework to explain these judgments.

  Looking at their list, I notice several patterns. Some assumptions seem acceptable when they serve as "productive idealizations" - like Galileo's frictionless plane or the ideal gas model - where simplifying reality actually helps reveal core mechanisms. Others appear problematic when they "smuggle in conclusions" - like perfect rationality implying market efficiency. The representative agent case fails because heterogeneity matters to the mechanism, while Hardy-Weinberg works precisely because its false assumptions create a null hypothesis.

  The user tentatively proposed two criteria: robustness to de-idealization and avoiding assumptions that directly encode the conclusion. But their examples reveal problems with both. The ideal gas model isn't robust near condensation, yet we accept it. Schelling's model assumes preferences but explains segregation, violating their second criterion yet being valid.

  I think we need a more nuanced framework with three criteria: tractable isolation (does it isolate key mechanisms?), productive purpose (does it serve a valid analytic goal?), and non-presumptive scope (doesn't preempt the phenomenon being explained?). 

  Let me test this against their examples. Galileo's plane passes all three: it isolates gravity's role, serves to study motion fundamentals, and doesn't assume the conclusion. Perfect rationality fails on non-presumptive scope since efficiency directly follows from the rationality assumption. The representative agent fails on tractable isolation because heterogeneity is crucial to spending mechanisms.

  For their flip-flopping case of homogeneous mixing in epidemics, it passes tractable isolation (captures transmission essence) and productive purpose (foundational for epidemiology), though we must be cautious about quantitative thresholds. Their domino model's identical eviction probability passes as a tractable mean-field approximation, while forbidding renegotiation fails productive purpose by ignoring a real-world flexibility mechanism.

  For the unlisted cases: random citation networks would pass as a useful null model (productive purpose), while perfect scalar quality observation in hiring fails non-presumptive scope by assuming away the very evaluation problem committees face.

  This framework preserves all the user's original judgments while handling edge cases consistently. The key is recognizing that modeling isn't about truth but about purposeful abstraction - the acceptability depends entirely on what work the idealization does for the model's purpose.
answer: |-
  Based on your list and analysis, here's a three-clause principle derived from your cases, designed to preserve your verdicts while resolving inconsistencies and handling new cases. The core idea is that **unrealistic assumptions are excusable when they serve a productive purpose within the model's epistemic goals, and inexcusable when they undermine those goals or preempt the phenomenon being explained.**

  ### The Principle: Productive Abstraction Criteria
  An unrealistic assumption is excusable iff:
  1.  **Tractable Isolation:** It isolates key mechanisms *without obscuring the core phenomenon* under study, making the model analytically or computationally tractable while preserving essential dynamics.
  2.  **Productive Purpose:** It serves a specific, justified purpose (e.g., establishing a baseline, enabling perturbation analysis, focusing on first-order effects, creating a useful null hypothesis) that aligns with the model's *intended insight*.
  3.  **Non-Presumptive Scope:** It does not *directly encode or presuppose* the model's central conclusion or obscure a mechanism *essential* to explaining that conclusion.

  ---

  ### How It Saves Your Verdicts & Resolves Conflicts
  1.  **Planets as points/Spherical Earth (Fine):** (1) Isolates gravity law; (2) Purpose: tractable celestial mechanics; (3) Doesn't presume orbital dynamics.
  2.  **Galileo's Frictionless Plane (Fine):** (1) Isolates inertia/acceleration; (2) Purpose: foundational kinematic insight; (3) Doesn't presume motion laws.
  3.  **Ideal Gas (Fine):** (1) Isolates kinetic theory essentials; (2) Purpose: tractable derivation of PV=nRT, baseline for real gas deviations; (3) Doesn't presume gas law behavior.
  4.  **Hardy-Weinberg (Fine):** (1) Isolates baseline expectations *if* no forces act; (2) Purpose: **defines the null hypothesis** for detecting evolutionary forces; (3) Doesn't presume equilibrium frequencies – it *defines* them *only if* forces are absent.
  5.  **Schelling (Fine):** (1) Isolates effects of mild preference + local interaction; (2) Purpose: demonstrate emergence of segregation from minimal assumptions; (3) Doesn't presume segregation – it emerges from the mechanism.
  6.  **Friedman's Billiards (Fine - resolves unease):** (1) Isolates *predictive success* of the as-if behavior; (2) Purpose: argue for instrumentalism in modeling behavior; (3) Doesn't presume market outcomes – it's an analogy about *model justification*. (Your unease stems from instrumentalism vs. realism, but the *assumption itself* isn't flawed by the criteria).
  7.  **Perfect Rationality → Efficient Markets (Not Fine):** Violates (3). The conclusion (efficiency) is *directly entailed* by the assumption (perfect rationality, perfect info, EU max). The mechanism *is* the assumption.
  8.  **Representative Agent for Fiscal Stimulus (Not Fine):** Violates (1) & (3). Obscures the essential mechanism (heterogeneous MPCs). The conclusion (aggregate spending effect) is *presumed* by the aggregation method, not explained by it.
  9.  **Coase (Fine):** (1) Isolates the role of property rights; (2) Purpose: **establish the baseline** to analyze how transaction costs *cause* inefficiency; (3) Doesn't presume efficient outcomes – it shows they *only occur if* TCs=0.
  10. **Infinitely-Lived Agent in OLG (Not Fine):** Violates (1) & (2). Obscures the core OLG mechanism (intergenerational transfer/conflict). The purpose (tractability) undermines the model's core insight. *Contrast with HW:* HW's infinity is *part of the null definition* (Purpose (2)), OLG's infinity *removes the defining feature*.
  11. **Firm as Black Box (Not Fine):** Violates (1) & (3). Obscures the core phenomenon (why firms exist, boundaries, internal structure). The conclusion (profit max) is often *assumed* rather than explained. **Cell as Well-Mixed Bag (Fine):** (1) Isolates reaction kinetics; (2) Purpose: tractable modeling of pathway fluxes; (3) Doesn't presume metabolic behavior – it emerges from reactions. *Difference:* The firm's *interior is the phenomenon*; the cell's interior is the *mechanism container*, the reactions are the phenomenon.
  12. **Domino Model: Identical Risk (Fine):** (1) Isolates cascade dynamics via mean-field approximation; (2) Purpose: tractable analysis of threshold effects; (3) Doesn't presume cascades – they emerge. **No Renegotiation (Not Fine):** Violates (2). Omits a plausible, potentially counteracting real-world mechanism (renegotiation) without justification for why it's excluded *given the phenomenon* (eviction cascades). Its absence feels ad hoc, not a productive simplification.

  **Homogeneous Mixing in Epidemics (Fine, but cautiously):** (1) Isolates basic transmission dynamics (SIR core); (2) Purpose: tractable derivation of R0, herd immunity *threshold concepts*, initial growth rates – **foundational insights**; (3) Doesn't *presume* epidemic curves – they emerge. *Caveat:* It becomes problematic if used for precise quantitative prediction in structured populations *without acknowledging the limitation* or if heterogeneity is the core phenomenon (e.g., superspreading).

  **Repairs Your Tentative Rule:**
  *   **Replaces (a) "Robustness":** Robustness is desirable, but not strictly necessary (Ideal Gas fails near condensation, Schelling *might* depend on grid/parameters). The key is the *purpose* the idealization serves (Productive Purpose (2)) and what it *doesn't* obscure (Tractable Isolation (1)).
  *   **Refines (b) "Not about the thing":** Replaced by Non-Presumptive Scope (3). Allows assumptions *related* to the phenomenon (Schelling's preferences, Coase's property rights) as long as they don't *encode* the conclusion. Focuses on whether the assumption *is* the mechanism/explanation or *enables* its study.

  ---

  ### Application to Your New Cases
  1.  **Citation Networks (Uniform Random Citing):**
      *   **Verdict:** **Fine** (as a null model/baseline).
      *   **Why:** (1) Isolates pure chance mechanism; (2) Purpose: **Define a null hypothesis** to detect real patterns (preferential attachment, topicality, recency); (3) Doesn't presume network structure – it defines random expectation. (Analogue to Hardy-Weinberg).

  2.  **Academic Hiring (Perfect Scalar Quality):**
      *   **Verdict:** **Not Fine** (if used to model real hiring outcomes).
      *   **Why:** Violates (1) & (3). Obscures the core phenomena in hiring (subjective evaluation, bias, committee dynamics, multi-dimensional/messy assessment). The assumption *presumes away* the central challenge (evaluating fuzzy quality) and likely *encodes* a particular (flawed) ideal of meritocracy in its conclusion.

  ---

  ### Why This Principle (and Verdicts) Over Others
  *   **Saves Intuitions:** Preserves all your "Fine/Not Fine" verdicts and resolves your internal conflicts (OLG vs. HW, Firm vs. Cell, Domino sub-assumptions).
  *   **Handles Edge Cases:** Addresses tricky cases like Schelling, Coase, Friedman, and the epidemic mixing flip-flop.
  *   **Provides Clear Rationale:** Each clause links directly to specific cases and the *work* the assumption does (or doesn't do) for the model.
  *   **Focuses on Purpose:** Recognizes that modeling is a tool for specific insights, not just "truth." Productive Purpose (2) is key to excusing useful falsehoods.
  *   **Avoids Circularity:** Non-Presumptive Scope (3) precisely targets the issue where assumptions *are* the explanation.
  *   **Practical for TAing:** Offers students concrete criteria to debate: "Does this simplify *without hiding* the key thing? What's the *point* of this untruth? Does the answer just fall out of the assumption?"

  This principle justifies your gut feelings with a coherent framework, rooted in the *epistemology of modeling* – how we use simplification to gain understanding. It accepts that falsity isn't fatal, but only if the lie serves a clear and justified purpose in revealing something true about the system's behavior.
