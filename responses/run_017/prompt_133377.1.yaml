prompt: |-
  I am a backend engineer with roughly a decade of experience, most of it on teams that implement and maintain publicly published protocol specifications. My colleagues and I spend a good deal of our time arguing about interpretation: whether an implementation should do what the text of a specification literally says or what its authors were plainly trying to achieve; how much weight the design discussion, the changelog, and the reference implementation should carry when the text is ambiguous; and what to do when the text is not merely ambiguous but wrong. I know the vocabulary of specifications, versioning, deprecation, bug-for-bug compatibility, undefined behaviour, and reliance on accidental implementation details well enough that you need not explain any of it back to me. I have no training in law or philosophy.

  I would like the debate about statutory interpretation — textualism against purposivism, together with the apparatus surrounding them: the reasonable reader, ordinary meaning as against terms of art, the canons of construction, the absurdity exception, legislative history, scrivener's errors — restated as faithfully as you can in the vocabulary I actually use: a specification and its released version, the reference implementation, commit messages and design discussions, deprecation and backwards compatibility, the position that the code is the specification, semantic versioning, and the difference between a consumer of an interface and its maintainer.

  Please test the translation against two cases of my own construction, telling me what each camp does with each and what that becomes in my terms.

  Case A, a drafting failure: a statute's penalty provision cross-refers to the offence described in subsection (c), but a renumbering late in the drafting process moved that offence to subsection (e), so that the cross-reference now picks up a subsection describing conduct everyone agrees was meant to carry a minor penalty, and a literal reading attaches a fifteen-year mandatory minimum to it. In my world this is a dangling cross-reference in a specification whose intended target is unmistakable from the commit history and the reference implementation — except that some implementers have followed the broken pointer for years and built on it.

  Case B, unforeseen technology: a consumer-protection provision of my own devising, which reads: "No creditor shall accelerate a loan unless written notice has been sent by first-class mail to the debtor's last known address." A lender sends the notice by authenticated email to an address the debtor uses daily; the debtor concedes receiving it the same day. The text is violated and its evident purpose is satisfied, and the debtor's argument is that compliance with the specified form is itself part of what the statute was for. In my world this is a specification requirement that survives because it was the outcome of a negotiation between parties with different interests rather than because anyone thought it optimal.

  Then the residue report. Give me the mapping as a table — legal item, its counterpart in my vocabulary, and a rating of clean, translated only with distortion, or no counterpart at all — and for everything in the third column say whether you take it to be a defect of my vocabulary or a sign that the legal claim was less determinate than it looks. I am particularly interested in where the translation would quietly import my framework's assumptions; my suspicion is that mapping the legislature onto maintainers smuggles in that the authors were competent, well-intentioned, and entitled to be trusted, and that everyone's stake is simply working software, which is close to what the legal dispute is about. Tell me also whether anything in my vocabulary can play the role that a compiler or a test suite plays in yours, given that a statute cannot be run and that a court faced with an unprovided-for case cannot throw an exception.

  Finally, having done the translation: is the residual disagreement between the two camps a disagreement about what the text means, or a disagreement about which institution should be permitted to repair it — and does my vocabulary have the resources to state that difference, or would it need to borrow something from yours?
reasoning: |-
  We are translating the debate between textualism and purposivism in statutory interpretation into the vocabulary of software specifications and implementations.

  Key mappings:
  - Statute = Specification
  - Legislature = Maintainers (authors and editors of the specification)
  - Statutory text = Released version of the specification (the official document)
  - Legislative history = Commit messages, design discussions, and issue trackers
  - Reference implementation = A canonical implementation that is treated as the model of compliance (like a reference implementation in software)
  - Courts = Implementers (they interpret and apply the specification)
  - Citizens/regulated entities = Consumers of the interface (they rely on the specification and its implementations)
  - Penalty provision = A part of the specification that defines consequences for non-compliance
  - Absurdity exception = When following the literal text leads to an outcome that is clearly against the purpose of the specification

  Textualism: Focuses on the plain meaning of the text as written, as understood by a reasonable reader at the time of enactment. It gives little weight to legislative history and avoids considering the purpose unless there is ambiguity.

  Purposivism: Focuses on the purpose behind the law and interprets the text in a way that advances that purpose. It uses legislative history to discern intent and is more willing to correct drafting errors.

  Canons of construction: These are like coding conventions or patterns that are commonly accepted in the specification community. They are rules of thumb for interpreting the text.

  Scrivener's error: A typo or clerical error in the drafting of the statute. In software terms, it's a bug in the specification.

  Backwards compatibility: Once a specification is released and implemented, changing it may break existing implementations. Similarly, in law, once a statute is enacted and relied upon, changing its interpretation may disrupt settled expectations.

  Semantic versioning: In software, major version changes indicate breaking changes, minor versions add functionality in a backwards-compatible manner, and patches are for bug fixes. In law, a new statute might be a major version, an amendment might be a minor version or a patch, but the analogy is not perfect because laws don't have explicit version numbers.

  Case A: Drafting failure (dangling cross-reference)

  In the statute (specification), the penalty provision points to subsection (c) but the intended offense is now in (e) due to renumbering. Literal reading applies a severe penalty to a minor offense. Some implementations (court decisions) have followed the broken pointer.

  Textualist approach:
     - The text says (c), so it must be enforced as written. The fact that it was a mistake is not relevant because the text is clear. The legislature can amend the statute to fix it. The consequences of the mistake are for the legislature to fix, not the courts.
     - In software terms: The specification says what it says. Implementers must follow the released version. The maintainers (legislature) must release a patch (amendment) to fix the cross-reference. If some implementations have already been built on the broken pointer, then changing the interpretation now would break backwards compatibility. So, even if it was a mistake, it is now part of the specification and must be honored until a new version is released.

  Purposivist approach:
     - The purpose of the penalty provision was to attach the severe penalty to the offense described in the original subsection (c) (now e). The cross-reference to (c) is a scrivener's error. The court should correct the error to refer to (e) because that was the intended target. The legislative history (commit messages) and the reference implementation (if any) show the intent.
     - In software terms: The maintainers intended the penalty to apply to the offense in (e). The reference implementation and the commit history clearly show this. Therefore, the specification should be interpreted as if it points to (e). The fact that some implementers have followed the broken pointer is unfortunate, but it is a bug and should be fixed. The specification maintainers might need to issue a patch to clarify, but until then, the intended meaning should prevail.

  Case B: Unforeseen technology

  The consumer-protection provision requires "written notice ... by first-class mail". The lender sends by authenticated email, which the debtor receives and acknowledges. The text is violated (because email is not first-class mail) but the purpose (notice to the debtor) is satisfied.

  Textualist approach:
     - The text specifies "first-class mail". Email is not first-class mail. Therefore, the notice is invalid. The fact that the purpose (giving notice) was achieved is irrelevant because the statute also serves the purpose of ensuring a standardized, verifiable method. The legislature can update the statute to include email if they wish.
     - In software terms: The specification requires a particular method (first-class mail). The implementer (lender) used a different method (email). Even if it achieved the same result, it is non-compliant. The specification may have been the result of negotiation, and changing it now would undermine the agreement. The maintainers (legislature) must update the specification to allow email if that is desired.

  Purposivist approach:
     - The purpose of the provision is to ensure that the debtor receives notice. The method (first-class mail) was the reliable method at the time. Now, authenticated email is at least as reliable and immediate. Therefore, the court should interpret the statute to allow methods that serve the same purpose, including email. The requirement of "first-class mail" is a means to an end, not an end in itself.
     - In software terms: The specification requires notice by first-class mail because that was the best practice at the time. The underlying requirement is effective notice. The reference implementation might have used mail, but the specification should be interpreted in light of evolving technology. The maintainers might not have foreseen email, but the purpose is clear. Therefore, the implementation using email should be considered compliant.

