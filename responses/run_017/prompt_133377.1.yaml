  | Legal Item                      | Software Specification Counterpart                               | Rating (Clean, Distorted, No Counterpart) | Notes |
  |---------------------------------|------------------------------------------------------------------|-------------------------------------------|-------|
  | Statute                         | Released version of the specification                            | Clean                                     |       |
  | Legislative text                | The text of the specification                                    | Clean                                     |       |
  | Legislature                     | Maintainers (authors and editors)                                | Distorted                                 | The legislature is a political body with multiple stakeholders, while maintainers are typically technical experts. The analogy smuggles in the idea of competence and good faith. |
  | Legislative intent              | Design discussions, commit messages, issue trackers              | Clean                                     |       |
  | Reference implementation        | Reference implementation (if one exists)                         | Clean                                     |       |
  | Courts (as interpreters)        | Implementers                                                     | Distorted                                 | Courts are also enforcers and have a role in shaping the law, whereas implementers in software are more passive. |
  | Citizens/regulated entities     | Consumers of the interface                                       | Clean                                     |       |
  | Penalty provision               | Part of the spec defining non-compliance consequences            | Clean                                     |       |
  | Absurdity exception             | When literal interpretation leads to an absurd outcome that the maintainers clearly did not intend | Clean |       |
  | Canons of construction          | Coding conventions, design patterns, common practices            | Clean                                     |       |
  | Scrivener's error               | A bug in the specification (e.g., a typo, broken link)           | Clean                                     |       |
  | Legislative history             | Commit history, design documents, meeting notes                  | Clean                                     |       |
  | Backwards compatibility         | Backwards compatibility (avoiding breaking changes for existing consumers) | Clean |       |
  | Semantic versioning             | Semantic versioning (major, minor, patch)                        | Distorted                                 | Laws don't have version numbers in the same way, and changes are not as systematic. |
  | Reasonable reader               | A competent implementer reading the spec at the time of release  | Clean                                     |       |
  | Ordinary meaning vs. terms of art | Plain language vs. technical terms as defined in the spec        | Clean                                     |       |
  | Undefined behavior              | Behavior not specified, so implementers have discretion          | Clean                                     |       |
  | Reliance on accidental details  | Relying on implementation-specific behavior not guaranteed by spec | Clean |       |
  | Deprecation                     | Marking a feature as obsolete, to be removed in a future version | Clean                                     |       |

  Notes on ratings:
  - Distorted: The legislature/maintainers analogy is distorted because legislatures are political and may have conflicting intentions, while maintainers are usually aligned with the project's goals. Also, courts are not just implementers but also have law-making powers in common law systems.
  - Semantic versioning: In law, there is no formal versioning system. Amendments are like patches, but they are not labeled as such.

  Where the translation imports assumptions:
  - The mapping of legislature to maintainers assumes that the authors are competent and well-intentioned. In reality, legislation may be the result of compromise, lobbying, or even sabotage. This is a defect of the vocabulary because it does not capture the political nature of lawmaking.

  Role of compiler/test suite:
  - In software, a compiler enforces syntax and some semantics, and a test suite checks compliance. In law, there is no direct counterpart because a statute cannot be executed. However:
    - A court acts like a runtime interpreter: it parses the statute and applies it to a case.
    - A test suite might be analogous to a body of case law that tests the boundaries of the statute. Precedents are like test cases that have passed and now define expected behavior.
  - When a court faces an unprovided-for case (like an unhandled exception in code), it cannot throw an exception but must decide the case. In software, we might add a new test and fix the code. In law, the court decides and then the legislature can override by amending the law.

  Residual disagreement between textualism and purposivism:
  - The core disagreement is about what the text means? Or who should repair it?
    - Textualism says: The text is the law; if it's clear, follow it even if it leads to a bad outcome. The repair must come from the legislature (maintainers) via amendment.
    - Purposivism says: The text is a means to achieve a purpose; if the text is flawed, interpret it to achieve the purpose. The court (implementer) can repair it in the moment, but the legislature can always override.

  In software terms, the disagreement can be stated as:
  - Textualism: The released specification is the contract. Implementers must follow it literally. If there's a bug, the maintainers must fix it in a new release.
  - Purposivism: The specification is an attempt to capture the design intent. Implementers should look at the design discussions and reference implementation to resolve ambiguities and fix obvious errors.

  The difference is about the role of the implementer (court). Textualism limits the implementer to the text, while purposivism allows the implementer to consider the purpose and history.

  Conclusion: The residual disagreement is both about what the text means and about institutional roles. Textualism sees meaning as fixed by the text at release, while purposivism sees meaning as including the purpose and context. And it is about who repairs: textualism leaves repair to the maintainers (legislature), while purposivism allows the implementer (court) to repair in the moment.

  Your vocabulary has the resources to state this difference: it is about whether the implementers (courts) should be allowed to fix specification bugs (drafting errors) or whether only the maintainers (legislature) can do so via a new release (amendment).
answer: |-
  ### Translation of Statutory Interpretation to Software Specification Vocabulary

  I'll restate the textualism vs. purposivism debate using your terminology, apply it to Cases A and B, provide a residue report, and address the core disagreement.

  ---

  ### Core Translation
  - **Textualism**: The released specification (statute) is the sole source of truth. Implementations (court rulings) must follow the literal text of the current version, regardless of intent. Commit history (legislative history) is irrelevant unless the text is ambiguous. Backwards compatibility (reliance on past interpretations) is prioritized.  
  - **Purposivism**: The specification's design intent (purpose) is paramount. The text is interpreted through the lens of commit messages, design discussions, and the reference implementation (if available). Literal text may be overridden if it contradicts clear intent or creates absurd outcomes.  

  ---

  ### Case Analysis  
  **Case A (Dangling Cross-Reference)**  
  - **Your framing**:  
    - Specification bug: Penalty points to `subsection(c)`, but renumbering moved the target to `subsection(e)`.  
    - Reference implementation and commit history confirm the intent.  
    - Some implementers (courts) have built on the buggy version.  

  - **Textualist approach**:  
    - Follow the released spec: Penalty applies to `subsection(c)`.  
    - Why? The text is unambiguous. Commit history is inadmissible. Implementers who relied on the buggy text deserve backwards compatibility.  
    - **In your terms**: "The code is the spec." Semantic versioning demands a new major release (amendment) to fix the bug. Until then, honor the literal text.  

  - **Purposivist approach**:  
    - Correct the bug to point to `subsection(e)`.  
    - Why? Commit history and reference implementation prove this was a scrivener's error. Applying a 15-year penalty to minor conduct is absurd.  
    - **In your terms**: The spec is a "living document." Design discussions trump the released version. Maintainers (legislature) would have patched this if spotted pre-release.  

  ---

  **Case B (Unforeseen Technology)**  
  - **Your framing**:  
    - Spec requires "first-class mail" for loan notices.  
    - Lender uses authenticated email (works better but violates spec).  
    - Requirement exists due to negotiation, not technical merit.  

  - **Textualist approach**:  
    - Reject email. The spec explicitly requires "first-class mail."  
    - Why? Negotiated terms are binding. Consumers (debtors) relied on the spec's formality. Changing it usurps the maintainers' role.  
    - **In your terms**: The interface contract is sacred. Even suboptimal requirements must be obeyed until deprecated. Backwards compatibility protects consumers.  

  - **Purposivist approach**:  
    - Allow email. The spec's purpose (notice delivery) was achieved.  
    - Why? "First-class mail" was a means to an end. Modern equivalents (email) satisfy the spirit. The negotiation context is irrelevant post-release.  
    - **In your terms**: The spec's *intent* is the API's semantic contract. Implementers can extend support for new "protocols" (technologies) if they align with core design goals.  

  ---

  ### Residue Report: Mapping Table  
  | Legal Item                  | Software Specification Counterpart                          | Rating       | Notes |  
  |-----------------------------|-------------------------------------------------------------|--------------|-------|  
  | Statute                     | Released specification version                              | Clean        | |  
  | Legislative text            | Specification documentation                                 | Clean        | |  
  | Legislative intent          | Commit messages/design discussions                          | Clean        | |  
  | Scrivener's error           | Specification bug (e.g., broken cross-reference)            | Clean        | |  
  | Absurdity exception         | Outcome violating core design goals                         | Clean        | |  
  | Ordinary meaning            | Default interpretation by a competent implementer           | Clean        | |  
  | Terms of art                | Domain-specific terminology in the spec                     | Clean        | |  
  | Canons of construction      | Standard parsing rules (e.g., RFC conventions)              | Clean        | E.g., "Expressio unius" ≈ "Explicitly stated options exclude others." |  
  | Legislative history         | Commit history, PR reviews, design docs                     | Clean        | |  
  | Reference implementation    | Gold-standard implementation (e.g., OpenSSL for TLS)        | Clean        | |  
  | Courts (interpreters)       | Implementers (e.g., developers building against the spec)   | **Distorted** | Courts also *enforce*; implementers lack this authority. |  
  | Legislature                 | Maintainers (spec authors/editors)                          | **Distorted** | Assumes maintainers are competent/well-intentioned. Real legislatures have politics/incentives. |  
  | Reasonable reader           | Experienced implementer reading the spec                    | Clean        | |  
  | Undefined behavior          | Unspecified edge cases                                      | Clean        | |  
  | Reliance on implementation details | Depending on undocumented behavior                | Clean        | |  
  | Backwards compatibility     | Avoiding breaking changes for existing consumers            | Clean        | |  
  | Deprecation                 | Marking a feature as obsolete                               | Clean        | |  
  | Semantic versioning         | MAJOR.MINOR.PATCH versions                                  | **Distorted** | Legal changes lack explicit versioning semantics. |  

  #### Items with No Counterpart  
  1. **Judicial Deference to Agencies**:  
     - *Why no counterpart?* Your vocabulary lacks a "reference monitor" role (e.g., agencies as domain experts).  
     - *Defect or Indeterminacy?* Sign of legal indeterminacy. Courts debate *who* interprets ambiguities, not just *how*.  

  2. **Constitutional Avoidance Canon**:  
     - *Why no counterpart?* No "higher-order spec" (e.g., Constitution) in your model.  
     - *Defect or Indeterminacy?* Defect in your vocabulary. Legal systems have layered hierarchies.  

  #### Smuggled Assumptions  
  - Mapping **legislature → maintainers** assumes:  
    1. Authors are competent/well-intentioned (not always true; specs can be politicized).  
    2. The only stake is "working software" (whereas law balances fairness, rights, power).  
  - Mapping **courts → implementers** understates courts' role in *shaping* the spec via precedent.  

  #### Compiler/Test Suite Analogs  
  - **Compiler**: No direct analog. Statutes can't be "compiled" (no syntax enforcement). Closest is a **linter** (e.g., grammar rules in drafting).  
  - **Test Suite**: **Case law** acts as a test suite. Past rulings are "integration tests" for the spec. An unprovided-for case is an untested edge case—courts must write a new "test" (ruling), not throw an exception.  

  ---

  ### Residual Disagreement: Meaning vs. Repair  
  - **The Disagreement**:  
    - Textualism sees it as **who repairs**: Maintainers (legislature) must fix bugs via new releases (amendments). Implementers (courts) should never override the spec.  
    - Purposivism sees it as **what the text means**: The spec includes its design intent. Implementers can "patch" bugs during interpretation.  

  - **Can Your Vocabulary State This?**  
    - Yes: It's a debate over **whether implementers have commit rights**.  
      - Textualism: Implementers are read-only consumers.  
      - Purposivism: Implementers have limited commit rights to fix critical bugs.  
    - Borrowing needed? Only for **institutional authority** (e.g., "separation of powers"). Your vocabulary assumes maintainers *own* the spec, but law has competing stakeholders (courts, agencies, citizens).  

  ### Key Insight  
  The translation exposes that **textualism treats specs as compiled code** (literal execution), while **purposivism treats them as human-readable design docs** (intent matters). The friction arises because your vocabulary blurs the line between spec *authors* (maintainers) and *interpreters* (implementers)—a tension central to law.
