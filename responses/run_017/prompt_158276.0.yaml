  Okay, let me unpack this query carefully. The user is writing a master's dissertation on the Frege-Geach problem for expressivism and has hit a wall with what they call the "tower problem" - nested moral predicates inside attitude reports. They describe a stalemate where quasi-realists keep developing technical solutions while critics insist these either collapse into realism or fail to explain validity. The user suspects the real disagreement is about meta-semantic expectations.

  Hmm, the core tension seems to be between two approaches to handling embedding: attitude-inheritance (iterating attitudes) and content-inheritance (fixed content with varying attitudes). The user finds both unsatisfying for the tower case - one making validity seem accidental, the other suspiciously truth-conditional. Their hypothesis is that the dispute hinges on what counts as "explaining" moral discourse.

  Right, I need to address three layers: why the tower sharpens Frege-Geach, whether the disagreement is substantive or verbal, and what progress would look like. The tower matters because it stresses-test compositionality - can expressivism handle arbitrary embedding without either ad hoc recursion or covert realism?

  On the meta-disagreement: when critics demand "explaining validity", they often mean demonstrating how truth-preservation emerges from representational content. But expressivists reject that starting point. So yes, part is verbal - both sides using "semantics" differently. The substantive core is whether non-representational states can bear logical relations intrinsically.

  For progress... hm. A formal result showing attitude-inheritance can validate arbitrary-depth modus ponens would help, but won't satisfy critics who want more. Perhaps shifting focus to "what makes an inference rule correct for a discourse" could move beyond stalemate. The tower actually helps by forcing clarity on whether expressivists need their own notion of "correctness" distinct from truth.

  Notably, the quasi-realist project might be misnamed - it's not about approximating realism but constructing a viable alternative. The tower exposes that what looks like "concession" (e.g. propositional contents) may just be tools for expressing planning states. The real test is whether those tools do explanatory work realism can't.

  Progress would involve either: (1) proving expressivism can replicate logic without representationalism, or (2) showing why it needn't. But option (2) requires renegotiating the explanatory demands - which is where the meta-semantic clarity matters most.
answer: |-
  Your diagnosis is sharp: the tower problem doesn't introduce new *data* but exposes the **meta-semantic fault line** in the Frege-Geach debate. Both sides can technically validate inferences like modus ponens at any depth, but they fundamentally disagree on **what constitutes an adequate *explanation* of validity and compositional meaning**. Here's the structure, dissected using British English:

  ### 1. **Why the Tower Sharpens the Problem (Without Changing It Fundamentally)**
     - **Stress-Testing Compositionality**: Ordinary embedding (e.g., "If stealing is wrong, then getting little brother to steal is wrong") tests whether expressivism can handle *one* layer of complexity. The tower iterates this, demanding a *general, recursive* account. Attitude-inheritance models build ever-more-complex higher-order attitudes (e.g., Anna expresses approval of not disapproving of Ben’s disapproval of stealing). Content-inheritance models treat "stealing is wrong" as contributing a fixed content (e.g., a "plan" or "property") at all levels, with attitudes targeting that content under increasing attitudinal operators.
     - **Revealing the Explanatory Chasm**:  
       - **Attitude-Inheritance Critics**: Argue that validating deep modus ponens (e.g., from Level 3 to Level 4 in your tower) relies on *contingent* features of the attitude hierarchy. Why *must* Anna’s attitude toward Ben’s attitude preserve truth? It feels like describing a psychological regularity, not *logical necessity*.  
       - **Content-Inheritance Critics**: Argue that positing a stable "content" (even if non-representational) **is** conceding the realist’s core claim: that moral sentences have invariant, truth-apt contents. Calling it an "attitude target" is just relabeling.  
       The tower makes this chasm inescapable: at depth *n*, the "explanation" feels either structurally arbitrary or covertly representational.

  ### 2. **The Core Disagreement: What Counts as "Explaining" Semantics?**
  Your hypothesis is correct: the standoff is **not about technical feasibility** but about **explanatory goals**. This splits into verbal and substantive elements:

  | **Aspect** | **Quasi-Realist Position** | **Critic’s Position** |
  |------------|-----------------------------|------------------------|
  | **"Semantics" (Verbal)** | A compositional account of the *mental states expressed* by utterances. Meaning is use/attitude. | An account of *truth-conditions* or *representational content*. Meaning is mind-independent. |
  | **"Explanation of Validity" (Substantive)** | Showing why competent speakers *commit* to inferences (e.g., via consistency of plans/attitudes). Logic is grounded in norms of attitude coherence. | Showing why inferences *preserve truth* across possible worlds. Logic is grounded in representational accuracy. |
  | **Burden of Proof** | Discharged by formally modelling commitment-preservation. | Only discharged by truth-preservation. |

  - **Verbal Element**: Both sides use "semantics," "content," and "explanation" differently. Quasi-realists *redefine* these terms non-representationally; critics insist this is equivocation.  
  - **Substantive Element**: Critics demand that logic requires *truth-aptitude* – attitudes alone, they argue, lack the necessary objectivity. Quasi-realists retort that "objectivity" can be earned pragmatically (via norms of consistency, dialogue, etc.), rendering truth redundant.  

  ### 3. **What the Tower Adds: A Litmus Test for Explanatory Ambitions**
  The tower forces each side to confront their meta-semantic commitments:  
  - **Attitude-Inheritance** (e.g., higher-order plans): Must explain why the *structure* of attitudes (e.g., disapproval of disapproval) *necessitates* logical rules. If it appeals to constitutive norms (e.g., "planning *requires* modus ponens"), critics call this ad hoc or question-begging.  
  - **Content-Inheritance** (e.g., Gibbard-style hyperplans): Must explain why the "content" isn’t truth-conditional. If it walks and talks like a proposition (e.g., it’s compositional, referential, and supports truth-preservation), critics see capitulation.  
  **The tower’s contribution**: It shows that *any* expressivist solution must either (a) embrace a notion of "proposition" thin enough to be non-representational (risking critics' charge of evasion), or (b) ground logic in attitude-norms so robust they mimic truth (risking charges of vacuity).

  ### 4. **What Would Count as Progress**
  The stalemate won’t break via new technical models. Progress requires:  
  - **Clarifying the Meta-Semantic Stakes**: A paper that rigorously maps what each camp *must* deny. Critics must deny that norms of attitude coherence can ground logic; quasi-realists must deny that truth is explanatorily primitive.  
  - **A Formal Result with Philosophical Teeth**: E.g., proving that attitude-inheritance models *cannot* validate arbitrary-depth modus ponens without implicitly defining truth-conditions (or vice versa). This would force concession or reformulation.  
  - **Shifting the Question**: Instead of "Can expressivism mimic realist semantics?", ask "**What makes an inference *correct* for a discourse type?**" If expressivists can show moral logic stems from *sui generis* practical norms (e.g., "planning discourse has its own constitutive rules"), they might bypass truth-talk. Critics would need to argue why only truth can underwrite correctness.  
  - **Radical Option: Dissolving the Demand**: Argue that Geach’s challenge *presupposes* representationalism. If meaning is use, "embedding" just requires compositional state-expression – no "explanation" of validity beyond describing competent practice is needed. Critics would reject this as quietism.  

  ### Conclusion: A Stalemate of First Principles
  The tower problem confirms that Frege-Geach is **not a technical puzzle but a collision of philosophical frameworks**. Quasi-realists see semantics as *anthropology of normative attitudes*; critics see it as *metaphysics of representation*. Until they agree on what "explaining logic" means – describing human inferential practice or tracking mind-independent relations – the debate will treadmill. Your best path forward is to **interrogate the unstated assumptions about logic, truth, and explanation** that make each side deem the other’s solution inadequate. The tower’s vertigo isn’t new; it’s the old abyss seen from a greater height.
