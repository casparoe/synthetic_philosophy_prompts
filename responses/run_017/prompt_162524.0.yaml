  Okay, the user is part of a family foundation's allocation committee that has historically funded effective altruism (EA) causes like global health and animal welfare. Recently, they've been convinced by the institutional critique that their cost-effectiveness methods inherently favor measurable interventions over systemic or political ones. The user's initial solution was to adjust their models—wider error bars, fatter tails, higher priors for systemic work—but they're now doubting this approach. Their colleagues think this misses the point, but can't articulate why. The user wants to know if their epistemic fixes are valid and, if not, what the critique really targets and how to address it.

  First, I need to unpack the institutional critique. The core issue isn't just about measurement precision but about the entire framework of maximization. Systemic interventions have diffuse, delayed effects that don't fit into a model designed for direct, quantifiable outcomes. The user's proposed adjustments might not solve this because widening error bars symmetrically doesn't change the mean expected value. Applying a discount for model uncertainty might even penalize systemic work more. Raising the prior mean feels arbitrary and like begging the question.

  The user might be struggling with the tension between wanting a principled, quantitative method and recognizing that such methods might be inherently flawed for systemic change. Their deeper need is likely to justify funding systemic interventions without abandoning their EA principles. They might also be seeking validation that it's acceptable to step outside the maximization framework, which could feel like a betrayal of their foundation's ethos.

  I should consider the philosophical underpinnings. The critique suggests that the EA framework is structurally biased, not just imprecise. The user's approach tries to tweak the model, but the model itself might be the problem. For systemic work, the effects are about changing structures or systems, which are hard to attribute to specific grants. This points to a limitation in the EA valuation methodology, which relies on individual causal chains.

  Possible solutions include adopting a portfolio approach, funding epistemic infrastructure, or using complementary frameworks like theories of change. The user might need to balance measurable bets with systemic investments, accepting that some funding decisions can't be made solely through their existing models. They might also need to redefine success for systemic grants, focusing on intermediate outcomes or movement-building rather than direct impact.

  The user's doubt about calibrating discounts is valid. Without reliable data, any calibration would be subjective. This raises the question of whether the foundation should fund research to better model systemic interventions, but that's a long-term solution. In the short term, they might need to allocate a portion of their budget to systemic work based on qualitative judgment, separate from their quantitative models.

  Their colleagues' inability to articulate the issue might stem from it being a paradigm conflict rather than a technical one. The foundation might need to explicitly acknowledge the limitations of their model and create space for different evaluation criteria. This could involve setting aside a percentage of funds for systemic work or collaborating with experts in political and structural change to develop new assessment methods.

  In essence, the user is grappling with a foundational challenge in EA: how to integrate inherently non-quantifiable interventions into a quantification-driven framework. The solution might require expanding their decision-making processes beyond strict maximization to include diversification and qualitative judgment, while still aiming for effectiveness through a broader definition.
answer: |-
  Your instincts are sharp – the institutional critique runs deeper than mere imprecision, and your proposed epistemic fixes, while reasonable first steps, likely won't resolve the core tension. Let's break down why and explore principled responses:

  **Why Symmetric Widening & Uncertainty Discounts Fail:**
  1.  **Mean Doesn't Shift:** As you note, symmetrically widening error bars (e.g., representing a log-normal distribution with a larger geometric SD) increases uncertainty but leaves the *central estimate* (e.g., median cost-effectiveness) unchanged. Political work often doesn't just have *worse* measurement; its *true* expected value distribution might genuinely have a *higher mean* than current models suggest, *if* the leverage is correct. Widening doesn't achieve this shift.
  2.  **Discounting Penalizes Uncertainty:** Applying a discount factor based *solely* on model uncertainty (`Discount = 1 / (1 + k * Uncertainty)` or similar) actively *penalizes* the very interventions you want to consider more seriously. It makes them look *worse* within the maximizing framework, pushing you further towards bednets.
  3.  **Higher Prior = Asserting the Conclusion:** Artificially boosting the prior mean for "leverage point" interventions feels arbitrary and lacks epistemic justification within the model itself. It *is* essentially assuming the point you're trying to prove.

  **What the Critique is *Really* About (Beyond Precision):**

  The core claim of the institutional critique isn't just "your estimates are noisy." It's that the **maximizing expected utility (EU) framework, applied naively via quantified cost-effectiveness estimates (CEEs), is structurally incapable of fairly evaluating systemic/political work.** This manifests in several ways:

  1.  **Anti-Consequentialist Bias (for System Change):** The EU framework demands *attribution* of specific outcomes to the grant. Systemic work often aims to change the *rules of the game*, *capacities*, or *discourse*, enabling *many future actors* to achieve diverse good outcomes. Its "success" is the existence of better conditions for action, not a countable number of lives saved *by the grant itself*. Attribution is fundamentally diffuse and often impossible.
  2.  **Path Dependence & Option Value Ignored:** Political/systemic wins often create new, unforeseen opportunities (option value) or prevent catastrophic path dependencies. Standard CEE struggles to value "keeping doors open" or "preventing irreversible bad equilibria." The value lies in *expanding the future choice set*, not optimizing within the current one.
  3.  **Non-Linearity & Threshold Effects:** Systemic change often follows non-linear dynamics (tipping points, critical masses). Marginal analysis, central to CEE, is poorly suited. Small inputs might yield zero effect until a threshold is crossed, then massive effect – but CEEs typically model linear (or smoothly diminishing) returns, undervaluing threshold-crossing efforts.
  4.  **Epistemic Capture:** The framework systematically directs funding (and therefore researcher attention) towards interventions that *are* easily measurable within its paradigm. This creates a feedback loop: we get better and better at measuring bednets and worse (relatively) at measuring systemic change, reinforcing the bias. Your last sentence touches this perfectly.
  5.  **Value of Advocacy & Movement Building:** Building coalitions, shifting norms, and developing talent within a field are crucial for sustained systemic impact but are inherently long-term, multi-actor processes. Their value is organizational and cultural, not easily reducible to QALYs/DALYs per dollar.

  **Principled Responses for an Allocator (Inside the Decision):**

  You *can* respond meaningfully within your allocation process, but it requires moving beyond *tweaking* the CEE model and embracing complementary frameworks:

  1.  **Explicit Portfolio Allocation:**
      *   **Mechanism:** Decide *a priori* to allocate a fixed, significant percentage (e.g., 20-40%) of your annual budget to "Systemic Change & Movement Building" or "High-Leverage, Hard-to-Measure Bets." This ring-fences funds *outside* the direct CEE maximization competition.
      *   **Evaluation within the Bucket:** Use *different criteria* for grants in this bucket:
          *   **Theory of Change Strength:** Rigorous qualitative assessment of the causal logic, evidence for leverage points, actor capability, and plausibility of achieving intended shifts.
          *   **Actor Quality & Track Record:** Bet on exceptional leaders/organizations with deep contextual understanding and demonstrated ability to navigate complexity.
          *   **Field-Building Value:** Does this strengthen the ecosystem (e.g., training new advocates, building networks, improving coordination)?
          *   **Neglectedness & Tail Risk Mitigation:** Is the work addressing a critical gap? Does it reduce the probability of catastrophic stalemate or regression?
      *   **Principle:** Accepts the incommensurability and uses diversification to manage the risk of missing transformative, non-marginal opportunities. This is a "maximize overall expected value of the portfolio" approach, recognizing different asset classes.

  2.  **Complementary Valuation Frameworks:**
      *   **Option Value Pricing:** Explicitly model the value of creating future opportunities or preventing bad path dependencies. What is the value of increasing the probability of passing key climate legislation by 5%? What is the cost of *not* supporting civil society in an authoritarian-leaning country? Requires qualitative judgment but forces explicit consideration.
      *   **Robust Decision-Making/Scenario Planning:** Instead of a single CEE estimate, model outcomes under different plausible futures (e.g., "high polarization," "tech breakthrough," "regression on democracy"). Assess which interventions perform reasonably well across scenarios ("robust") or are crucial in specific high-impact scenarios. Systemic work often shines here.
      *   **Minimum Viable Inference:** Instead of demanding precise attribution, ask: "What is the *minimum* level of evidence or plausibility needed to justify this bet, given the potential magnitude of the stakes?" (e.g., preventing major conflict, securing fundamental rights).

  3.  **Invest in Epistemic Infrastructure (A Partial Inside/Outside Solution):**
      *   **Mechanism:** Allocate a portion of resources *specifically* to fund:
          *   **Research:** Developing better methods for evaluating systemic change, political advocacy, and field-building (e.g., improved theories of change, process tracing, contribution analysis, qualitative impact assessments).
          *   **Evaluation Capacity:** Supporting grantees doing systemic work to rigorously document their strategies, intermediate outcomes, and context.
          *   **Learning Communities:** Facilitating knowledge sharing among funders and practitioners in the systemic change space.
      *   **Principle:** Addresses the epistemic gap directly by funding the creation of better tools and knowledge, improving future CEEs (or alternatives) for systemic work. This is a long-term play within your allocation process.

  4.  **Calibrated "Venture" Mindset (Use with Caution):**
      *   **Mechanism:** Acknowledge systemic grants are high-risk, high-reward "venture bets." Apply a *positive* multiplier (not just avoiding a discount) based on:
          *   **Plausibility of High-Leverage:** Strength of the leverage point theory.
          *   **Magnitude of Potential Upside:** Qualitative assessment of the scale of change possible.
          *   **Neglectedness/Tail Risk:** Importance of preventing a negative outcome.
      *   **Calibration:** This is inherently judgmental. Use expert panels, historical analogues (sparingly), or multi-criteria decision analysis (MCDA) frameworks that explicitly weight these factors alongside traditional CEE where possible. *Crucially, be transparent about the uncertainty and the qualitative nature of the boost.*
      *   **Principle:** Explicitly values the potential for non-marginal, transformative impact that standard CEE misses. Avoids the symmetry problem. The "calibration" comes from structured deliberation, not statistical data.

  **Can the Critique Only Be Answered Collectively?**

  Yes, partially. The epistemic capture feedback loop is a field-level problem. Your foundation acting alone can:

  *   **Diversify its portfolio** (as above).
  *   **Signal demand** for better evaluation methods by funding them and using alternative frameworks.
  *   **Share learnings** transparently to build collective knowledge.

  However, truly shifting the field's capacity to evaluate systemic work requires *many* funders making similar shifts, pooling resources for research, and creating a market for better evaluation in this space. Your internal actions are necessary and valuable steps, but the ultimate solution requires collective action.

  **Conclusion:**

  The institutional critique exposes a fundamental mismatch between the standard EA CEE toolkit and the nature of systemic/political change. Tweaking uncertainty parameters within the existing maximizing framework is insufficient and can be counterproductive. The principled response requires:

  1.  **Explicitly segregating funds** for systemic work evaluated on different criteria (Portfolio Allocation).
  2.  **Employing complementary frameworks** (Theory of Change, Option Value, Scenario Planning, Minimum Viable Inference) alongside or instead of traditional CEE.
  3.  **Investing in epistemic infrastructure** to improve future evaluation.
  4.  **(Judiciously) Applying a "venture mindset"** with positive qualitative boosts for high-leverage potential.

  This isn't abandoning rigor; it's embracing a *broader* and *more appropriate* rigor for the domain. It acknowledges that maximizing expected impact across a diverse portfolio requires different tools for different classes of problems. Your foundation can start this shift internally while contributing to the necessary collective field-level evolution. The key is to move beyond trying to force systemic work into a bednet-shaped box and create space for its distinct value proposition.
