answer: |-
  ### Triage Procedure for Rule Contradictions  
  **Designed for Analysts (No Logic Background Required)**  
  **Time Budget: ≤0.5 Days Per Contradiction**  
  **Outputs:** `CLOSE`, `CONTAIN + FLAG FOR MANUAL REVIEW`, or `ESCALATE TO LEGAL`  

  ---

  #### **Step 1: Is This a Real Contradiction?**  
  **Goal:** Rule out artifacts (non-substantive issues).  
  **Checks:**  
  1. **Negation-as-Failure (NAF) Artifact**:  
     - Is one side of the contradiction an explicit assertion (e.g., `INCOME > $1000`), while the other is absence of data (e.g., `NOT ELIGIBLE` because no income record exists)?  
     - **Good Enough Answer:** If NAF → `CLOSE` ticket. Fix by improving data ingestion/logging.  
  2. **Indexing Problem**:  
     - Do the rules have mismatched effective dates, geographic scopes, or program IDs? (e.g., Rule A applies to Program X, Rule B to Program Y).  
     - **Good Enough Answer:** If indexing mismatch → `CLOSE` ticket. Fix by correcting case attributes.  
  3. **Threshold/Rounding Artifact**:  
     - Is the conflict near a threshold (e.g., income ± $5 of limit) with floating-point rounding?  
     - **Good Enough Answer:** If rounding → `CLOSE` ticket. Fix by standardizing rounding in rules.  
  4. **Judgment Call:** If none of the above → Proceed to Step 2.  
  **Analyst Action:** Use SQL to audit rule inputs and case data. Stop here if any artifact found.  

  ---

  #### **Step 2: Blast Radius Assessment**  
  **Goal:** Approximate how far the contradiction propagates.  
  **Method (SQL/Python):**  
  1. **Identify Contradictory Predicate** (e.g., `IS_ELIGIBLE`).  
  2. **Query Direct Dependencies**:  
     ```sql  
     SELECT COUNT(*) FROM rule_dependencies WHERE input_predicate = 'IS_ELIGIBLE';  
     ```  
     - `HIGH_RISK` if >10 rules depend on this predicate.  
  3. **Trace to Outputs (Depth=2)**:  
     - Find rules that use the contradictory predicate → then rules that use *those* outputs.  
     - Flag if any predicate in this chain is:  
       - Payment (`PAY_BENEFIT_X`),  
       - Denial (`DENY_BENEFIT_X`),  
       - Recovery (`FLAG_OVERPAYMENT`).  
  4. **Approximation Shortcuts**:  
     - Use precomputed dependency graphs (if available).  
     - Limit to 2 hops (depth=2) to avoid complexity.  
     **What We Miss:**  
     - Long propagation chains (>2 hops),  
     - Conditional rule activations (e.g., rules that fire only for specific subgroups).  

  **Good Enough Answer:**  
  - **LOW RISK**: No payment/denial/recovery predicates in chain AND <10 dependencies → Proceed to Step 3.  
  - **HIGH RISK**: Payment/denial/recovery impacted OR >10 dependencies → Skip to Step 4.  

  ---

  #### **Step 3: Is It Containable?**  
  **Goal:** Can we isolate the contradiction without repair?  
  **Checks:**  
  1. **Gating Feasibility**:  
     - Can rules using the contradictory predicate be modified with a guard (e.g., `IF NOT IS_CONFLICTED(IS_ELIGIBLE) THEN [...]`)?  
  2. **Safety Check**:  
     - Is the predicate used in **non-critical** pathways (e.g., reporting, alerts) AND not in payment/denial?  
     - Will manual review be rare (<5% of cases)?  
     **Judgment Call:** If containable → `CONTAIN + FLAG FOR MANUAL REVIEW`.  
     - Add conflict flag to case output.  
     - Do NOT escalate to legal.  
     **Not Containable?** → Proceed to Step 4.  

  ---

  #### **Step 4: Is This a True Dialetheia?**  
  **Goal:** Is the contradiction deliberate and unresolvable?  
  **Test (Requires Legal Input):**  
  1. Two authorities (e.g., statute + court order) of **equal weight** conflict.  
  2. No `LEX_POSTERIOR` (newer law) or `LEX_SPECIALIS` (specific vs. general) applies.  
  3. Both sources are **actively enforced** (e.g., court order binding but regs not updated).  
  4. **Key**: The system *must* affirm both values simultaneously.  

  **Paraconsistency ≠ Dialetheism:**  
  - We **contain** (prevent explosion) but **do NOT endorse** true contradictions.  
  - If dialetheia → `CONTAIN + FLAG FOR MANUAL REVIEW`. Legal provides a tie-break policy (e.g., "Always pay if court order exists").  
  - Not dialetheia? → Proceed to Step 5.  

  ---

  #### **Step 5: Escalate to Legal for Repair**  
  **Goal:** Prioritize substantive fixes.  
  **Priority Formula:**  
  - `HIGH`: Impacts payment/denial/recovery OR affects >20 rules.  
  - `MEDIUM`: Impacts non-payment rules OR affects 5–20 rules.  
  - `LOW`: All others.  
  **Include in Escalation:**  
  - Blast radius metrics (Step 2),  
  - Containment assessment (Step 3),  
  - Why it’s not a dialetheia (Step 4).  

  **Value Judgment:**  
  - Wrong denial > wrong payment (per your constraints). Flag high-priority cases risking wrongful denial.  

  ---

  ### Procedure Applied to Your Cases  
  #### **(a) Income $2 Over Limit (Overtime Conflict)**  
  - **Step 1:** Not NAF/indexing/rounding.  
