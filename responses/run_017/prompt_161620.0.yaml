prompt: |-
  hey — I'm on a four-person team that maintains the eligibility rules engine for a state benefits program (a SNAP-like food program plus two smaller cash programs). Rules come from statute, regs, internal policy memos, and since last year from a couple of court orders that flatly contradict some of the regs. The base is now ~4,000 forward-chaining rules over a few hundred predicates, and it regularly derives that the same household both does and doesn't qualify for the same benefit in the same month. Right now every one of those becomes a ticket, legal argues about it for weeks, and the case sits in a manual queue. We're drowning and I want a triage procedure instead.

  Constraints, so you don't design me something we can't run: we are stuck with a SQL-backed forward chainer, no re-platforming, no new reasoner, no new headcount. Two analysts with no logic background have to run this, and they get about half a day per contradiction. Legal counsel signs off on anything that changes a rule, and they can realistically absorb maybe five repairs a month. Wrong denial means someone loses food assistance; wrong payment means an audit finding and a clawback from a person who can't pay it back.

  What I want is a decision procedure, tests in order, that takes one derived contradiction and sorts it. Here's roughly what I think the steps have to cover, but reorganize and correct me:

  1. Is it actually a contradiction? I suspect a lot of ours are artifacts: one side is negation-as-failure (we just have no record) rather than an explicit assertion; or the two rules have different effective dates or different scopes, so it's an indexing problem; or the "conflict" is really a borderline case at a vague threshold with rounding. Each of those should get a different cheap fix and a closed ticket, and none of them should be handed to paraconsistency as if they were deep.

  2. Blast radius. This is the bit I keep failing to explain to my team: switching to a paraconsistent reading stops A and not-A from entailing everything, but it does not stop the contradiction from spreading — anything that follows from A still gets both values, and then so does what follows from that. So tolerating a contradiction is not the same as containing it. Give us a cheap, approximate way to measure how far one propagates with the SQL and python we already have — reachable predicates, depth, whether any output is a payment or denial, whether the disputed predicate is a hub used by dozens of other rules — and be explicit about what the approximation misses.

  3. Is it containable rather than repairable? When can we cut the propagation path or gate the rules so the contradiction stays local and the case just gets flagged for a human, and when is that unsafe because the disputed predicate is load-bearing all over the system?

  4. When is the right answer genuinely both — an actual dialetheia, not a bug? My guess is the test is something like: two norm sources of equal authority, no applicable lex posterior or lex specialis, both deliberately left standing, and the system really does require both to be true of the same person at the same time. In that case there is no repair to make, and the honest output is a written tie-break or discretion policy plus a human decision at case level. Please say clearly that containing contradictions does not commit us to believing true contradictions — paraconsistent and dialetheist are different commitments, and I need the procedure to only ever make the first one.

  5. Otherwise repair, routed to legal, with priority set by blast radius and by who eats the error.

  For each step: what counts as a good enough answer, where the procedure stops with a no and we close the ticket, where it stops with escalate, and where it hands off to a person because the question is one of values (which error we'd rather make) rather than facts. Mark those hand-off points as un-eliminable judgment; I don't want fake precision.

  Then run it on three from our queue:

  (a) Household income lands two dollars over the gross limit because one rule counts a chunk of overtime and another excludes it, and both rules trace back to the same statutory section.

  (b) A court order from last March says a class of people must be treated as eligible for program A; the reg still says ineligible; the reg hasn't been updated and legal says the order is binding until further notice.

  (c) The one I expect to dislike: a rule saying an applicant with an outstanding felony warrant is ineligible versus a rule saying eligibility turns only on financial criteria. Everyone here has treated this as a harmless legacy artifact that's been in the base for years, but I checked and the disputed predicate feeds something like forty rules including recertification and the overpayment-recovery module. If your procedure tells me this is the urgent one and the stuff we've been firefighting is mostly noise, say so and show the reasoning.

  Finally, tell me what the procedure can't do. I assume it can't tell us which substantive repair is correct, can't adjudicate the value conflict between speed and accuracy and not denying people who qualify, and that step 2 needs tooling we don't have — so tell me what to substitute and what that substitute gets wrong.

  No reading list or citations please, I have no library access and I'm not writing anything up — I need something I can definately hand to two analysts on Monday morning.
reasoning: |-
  We are designing a triage procedure for contradictions in a forward-chaining rules engine. The procedure must be executable by two analysts with no logic background, using existing tools (SQL and Python), and must fit within half a day per contradiction. Legal counsel can only handle about five repairs per month, so we must minimize escalations and focus on quick fixes and containment.

  The procedure has five main steps, each with clear criteria for closing the ticket, escalating to legal, or requiring a judgment call. We also need to run it on three examples.

  **Procedure: Triage for Contradictions**

  **Step 1: Is it actually a contradiction?**
     - **Check for artifacts**:
       - **Negation as failure**: Look for cases where one side is an explicit assertion and the other is the absence of data (i.e., the rule uses negation by failure). If found, this is a data issue, not a rule contradiction.
          - *Good enough?* If the contradiction is due to missing data, close the ticket with a note to check data completeness. No rule change needed.
       - **Effective dates or scopes**: Check if the rules have different effective dates, scopes, or other indexing attributes. If the contradiction occurs because one rule is active in one time period and the other in another, or for different groups, then it's an indexing problem.
          - *Good enough?* If the rules are not in effect at the same time for the same household, close the ticket and note the indexing issue. This might require a data fix (ensuring correct effective dates) or a rule condition adjustment (to check the effective date). This can be fixed by an analyst without legal if it's a clear indexing error.
       - **Vague thresholds with rounding**: Check if the contradiction is at a threshold (e.g., income near a limit) and rounding or floating-point issues might be the cause. If so, adjust the rule to use rounded values or exact comparisons as appropriate.
          - *Good enough?* If rounding is the issue, adjust the rule to use consistent rounding and close the ticket.

     - **If none of the above**: Then it's a potential real contradiction → Proceed to Step 2.

     - **Hand-off point**: If the issue is a data gap (negation as failure) or an indexing problem, the analyst can close the ticket after making a simple fix (like adding a data check or adjusting the rule condition). If it's a rounding issue, the analyst can adjust the rule. Only if none of these apply, move to Step 2.

  **Step 2: Blast Radius Assessment**
     - **Goal**: Approximate how far the contradiction propagates without deep analysis.
     - **Cheap method using existing SQL/Python**:
       - **Step 2a: Identify the conflicting predicates**. For the contradiction `A` and `not A`, note the predicate `A`.
       - **Step 2b: Find all rules that use `A` (or `not A`) as a premise**. This can be done by querying the rule repository (SQL query on rule dependencies). Count the number of such rules (direct dependencies).
       - **Step 2c: For each of these rules, check what they derive (their conclusions)**. Then, recursively, check rules that use those conclusions as premises, up to a fixed depth (say 2 or 3) to avoid explosion. (This is the approximation: we limit the depth of propagation.)
       - **Step 2d: Check if any of the derived predicates (in the chain) are "output predicates"** (e.g., payment/denial decisions, overpayment triggers, recertification flags). If an output predicate is affected, note it.
       - **Step 2e: Measure**:
          - *Direct rule count*: How many rules directly depend on `A`?
          - *Depth*: How many levels of derivation from `A` until we hit an output? (if within the depth limit)
          - *Hub score*: If the direct rule count is high (e.g., >10), then it's a hub.
          - *Output impact*: Whether any output predicate is in the propagation chain (even if at depth 3).

     - **Approximation misses**:
       - We don't do full transitive closure (due to depth limit), so we might miss long propagation paths.
       - We don't account for rules that might be conditionally triggered (if we have rule conditions that are not captured in the dependency graph).
       - We don't account for the frequency of the predicate in actual cases (a predicate might be used by many rules but rarely actually derived).

     - **Good enough?** 
       - If the blast radius is small (low direct rule count, no output predicates in the chain, and low depth) → Proceed to Step 3 (containment evaluation).
       - If the blast radius is large (high direct rule count, or an output predicate is affected) → Skip to Step 5 (repair, escalate to legal) because containment is likely unsafe.
       - If it's in between, then we proceed to Step 3 but note that containment might be risky.

     - **Hand-off point**: The blast radius assessment is a technical step. The analyst can run the queries and make the counts. The decision to go to Step 3 or 5 is based on thresholds (e.g., direct rule count >10 -> large; any output predicate in chain -> large). These thresholds should be set by the team (judgment call: we set them at direct rules >10 or any output predicate).

  **Step 3: Is it containable?**
     - **Goal**: Can we isolate the contradiction so that it doesn't affect critical outputs?
     - **Containment strategies**:
       - **Gating**: Add a condition to rules that depend on the disputed predicate that checks if the predicate is in a conflicted state (e.g., `if not is_conflicted(A) then ...`). Then, for conflicted cases, those rules don't fire and the case is flagged for manual review.
       - **Cutting propagation**: Modify the rules that derive from `A` to not fire when `A` is conflicted (similar to gating).

     - **Safety check**: 
       - Is the disputed predicate `A` used in rules that lead to critical outputs (like payment/denial)? If yes, then gating might leave the system without a decision for that case, which is acceptable if we flag for manual review. But if the predicate is used in many critical rules, then manual review might be too heavy.
       - Is there an alternative way to derive the same outputs without using `A`? (This is harder to check; we might skip this due to time.)

     - **Good enough?** 
       - If the blast radius is small and the critical outputs are not affected (or if they are, we can gate and the manual review load is acceptable) → Then containment is possible. Proceed to Step 4 to check if it's a dialetheia (true contradiction) or if we should contain and flag.
       - If the blast radius is large and critical outputs are affected → Then containment is not safe or practical → Skip to Step 5 (repair, escalate to legal).
       - If we are unsure → Escalate to a developer or legal for a judgment call (but note we want to avoid this).

     - **Hand-off point**: This step requires judgment on the acceptability of manual review. The analyst can note the number of critical outputs affected and the expected volume of conflicted cases (if known). If the volume is low and the critical outputs are gated, then containment is acceptable. Otherwise, it's not.

  **Step 4: Is it a dialetheia? (a true contradiction)**
     - **Test**: 
       - Are there two normative sources (e.g., two laws, a law and a court order) that are of equal authority and that explicitly contradict each other?
       - Is there no overriding principle (like lex posterior or lex specialis) that resolves the conflict?
       - And have the authorities deliberately left both in force? (e.g., the court order is binding but the regulation hasn't been updated)
       - And the system must assign both truth values to the same predicate for the same case at the same time?

     - **Good enough?** 
       - If all criteria are met → Then we have a dialetheia. We cannot repair the rule without changing the law. The solution is to contain the contradiction (if not already done in Step 3) and flag the case for a human to apply a tie-break policy (which legal must provide). Then close the ticket (no rule change, but we might add a flag and a manual process).
       - If not → Then it's not a dialetheia → Proceed to Step 5 for repair.

     - **Hand-off point**: This step requires legal judgment. The analyst cannot decide on the authority of sources or the applicability of legal principles. Therefore, if Step 4 is reached, the analyst must escalate to legal with the information gathered. Legal will decide if it's a dialetheia. If legal says yes, then we contain and implement the flagging and tie-break. If no, then we proceed to Step 5.

  **Step 5: Repair (escalate to legal)**
     - **Goal**: The contradiction must be fixed by changing the rules.
     - **Procedure**: 
       - Document the contradiction, the blast radius, and the reason why containment isn't possible or desirable.
       - Escalate to legal with a priority level determined by:
          - **Blast radius**: High if an output predicate is affected or if the hub score is high.
          - **Risk of harm**: 
             - Wrong denial (denying benefits to someone who qualifies) is high risk (loss of food assistance).
             - Wrong payment (giving benefits to someone who doesn't qualify) leads to clawbacks and hardship.
          - Priority formula: 
             - High: Affects an output predicate and risk of wrong denial or wrong payment is high.
             - Medium: Affects an output predicate but risk is lower (e.g., not immediate denial/payment) OR high blast radius without output impact.
             - Low: Otherwise.

     - **Hand-off point**: Legal must decide on the substantive repair. The analyst's job is to provide the technical context and priority.

  **Summary of Hand-off and Judgment Points**:
  - Step 1: Analyst can close if artifact (data, indexing, rounding). Otherwise, proceed.
  - Step 2: Analyst assesses blast radius. If large (by thresholds), skip to Step 5. If small, go to Step 3.
  - Step 3: Analyst assesses containment. If safe and acceptable, go to Step 4. If not, go to Step 5.
  - Step 4: Analyst must escalate to legal to decide if dialetheia. If yes, contain and implement manual process. If no, go to Step 5.
  - Step 5: Analyst escalates to legal with priority.

