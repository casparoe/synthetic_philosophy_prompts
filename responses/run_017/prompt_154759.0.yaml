  ### Analysis of the Sleeping Beauty Problem in Survey Methodology Terms

  #### **Problem Setup Recap**
  - Fair coin: Heads (H) → Awakened once (Monday, blue room). Tails (T) → Awakened twice (Monday blue, Tuesday red).
  - Amnesia after each awakening; Beauty knows the protocol and sees the room color.
  - **Key disagreement**: Probability of Heads given blue room.
    - **Halfer**: Claims \( \mathbb{P}(H \mid \text{blue}) = \frac{2}{3} \).
    - **Thirder**: Claims \( \mathbb{P}(H \mid \text{blue}) = \frac{1}{2} \).

  #### **Long-Run Relative Frequencies**
  - **Thirder's \(\frac{1}{2}\)**:  
    **Procedure**: Repeat the experiment \(N\) times.  
    - Blue awakenings:  
      - \(N/2\) from H runs (Monday blue).  
      - \(N/2\) from T runs (Monday blue).  
      - Total blue: \(N\).  
    - **Long-run frequency of Heads given blue**: \(\frac{\text{H blue}}{\text{Total blue}} = \frac{N/2}{N} = \frac{1}{2}\).  
    **Interpretation**: The proportion of blue awakenings that occur in Heads runs.

  - **Halfer's \(\frac{2}{3}\)**:  
    **Procedure**: Repeat \(N\) times, but **sample one awakening per run uniformly** (even though both awakenings occur in Tails runs):  
    1. Select a run (H or T, each prob. \(1/2\)).  
    2. Within run, select one awakening uniformly:  
       - H run: Only one awakening (blue), selected with prob. 1.  
       - T run: Two awakenings, each selected with prob. \(1/2\).  
    - Blue awakenings sampled:  
      - From H runs: \(N/2\) runs × 1 = \(N/2\).  
      - From T runs: \(N/2\) runs × \(1/2\) (only Monday blue) = \(N/4\).  
      - Total blue sampled: \(N/2 + N/4 = 3N/4\).  
    - **Long-run frequency of Heads given blue**: \(\frac{\text{H blue}}{\text{Total sampled blue}} = \frac{N/2}{3N/4} = \frac{2}{3}\).  
    **Interpretation**: The proportion of **sampled** blue awakenings that are from Heads runs, under a design that **artificially samples one awakening per run**.

  ---

  ### **Translation to Survey Methodology**
  #### **Core Elements**
  - **Target population**: All awakenings across all experimental runs.  
  - **Stratum**: Room color (blue/red).  
  - **Post-stratification**: Condition on observing blue (restrict to blue-room awakenings).  
  - **Cluster**: An experimental run (coin flip).  
  - **Units**: Individual awakenings within a cluster.  
  - **Design weight**: Inverse of inclusion probability (\(\pi_k^{-1}\)).

  ---

  #### **Thirder Position: Pooled Frame of All Awakenings**
  - **Sampling design**:  
    - **Frame**: Pooled list of all awakenings (H-Mon-blue, T-Mon-blue, T-Tue-red).  
    - **Inclusion mechanism**: Uniform probability over all awakenings.  
      - Total awakenings in \(N\) runs: \(N \times (0.5 \times 1 + 0.5 \times 2) = 1.5N\).  
      - Inclusion probability \(\pi_k = \frac{1}{1.5N} = \frac{2}{3N}\) for every awakening.  
    - **Design weights**: All equal (\(w_k = \pi_k^{-1} = 1.5N\)).  
  - **Self-weighting**: Yes, because all \(\pi_k\) equal (uniform sampling).  
  - **Estimand**: Population proportion of Heads awakenings among blue awakenings.  
  - **Estimator**: Horvitz-Thompson (HT) estimator for proportion of Heads in blue stratum.  
    - For blue awakenings:  
      - H-Mon-blue: \(I(H) = 1\), weight \(w_k = 1.5N\).  
      - T-Mon-blue: \(I(H) = 0\), weight \(w_k = 1.5N\).  
    - **Estimate**:  
      \[
      \hat{P}_{\text{Thirder}} = \frac{\sum_{k \in \text{blue}} w_k I(H)}{\sum_{k \in \text{blue}} w_k} = \frac{(N/2) \times 1.5N}{(N) \times 1.5N} = \frac{0.75N^2}{1.5N^2} = \frac{1}{2}.
      \]  
  - **Informative cluster size**: Not applicable. Clusters (runs) have unequal sizes (H:1, T:2), but sampling is uniform over **units** (awakenings), not clusters.  
  - **Betting argument**:  
    - Bet pays $1$ if Heads, $0$ if Tails, offered on every blue awakening.  
    - Expected payout: \(\frac{1}{2}\) per blue awakening (matches HT estimate). Unbiased for the population proportion under the pooled-frame design.  

  ---

  #### **Halfer Position: Equal Weight per Experimental Run**
  - **Sampling design**:  
    - **Frame**: Experimental runs (clusters).  
    - **Inclusion mechanism**:  
      1. Select a run (cluster) with probability \(1/2\) (equal for H/T).  
      2. Within selected cluster, sample one awakening uniformly.  
    - **Inclusion probabilities**:  
      - For a H-run awakening: \(\pi_{\text{H}} = P(\text{select H run}) \times P(\text{select awakening} \mid \text{H}) = \frac{1}{2} \times 1 = \frac{1}{2}\).  
      - For a T-run awakening: \(\pi_{\text{T}} = \frac{1}{2} \times \frac{1}{2} = \frac{1}{4}\).  
    - **Design weights**: \(w_{\text{H}} = 2\), \(w_{\text{T}} = 4\).  
  - **Self-weighting**: No (weights differ: 2 vs. 4).  
  - **Estimand**: Population proportion of Heads **runs** (not awakenings).  
  - **Estimator**: HT estimator for proportion of Heads runs, but **conditioned on blue**.  
    - Inclusion probabilities for blue awakenings:  
      - H-Mon-blue: \(\pi_k = 1/2\), weight \(w_k = 2\).  
      - T-Mon-blue: \(\pi_k = 1/4\), weight \(w_k = 4\).  
    - **Estimate**:  
      \[
      \hat{P}_{\text{Halfer}} = \frac{\sum_{k \in \text{blue}} w_k I(H)}{\sum_{k \in \text{blue}} w_k} = \frac{(N/2 \times 2) \times 1 + (N/2 \times 4) \times 0}{N/2 \times 2 + N/2 \times 4} = \frac{N}{N/2 \times 6} = \frac{N}{3N} = \frac{1}{3} \quad \text{(error!)}.
      \]  
      **Correction**: The halfer **conditions on blue after sampling**, so:  
      \[
      \mathbb{P}(H \mid \text{blue}) = \frac{P(\text{H and blue awakening})}{P(\text{blue awakening})} = \frac{\frac{1}{2} \times 1}{\frac{1}{2} \times 1 + \frac{1}{2} \times \frac{1}{2}} = \frac{1/2}{3/4} = \frac{2}{3}.
      \]  
      This is **not a standard HT estimator**; it uses Bayesian conditioning on the sampling event.  
  - **Informative cluster size**: Yes. Cluster size (1 for H, 2 for T) correlates with the outcome (H/T). Design weights \(w_k\) adjust for unequal inclusion probabilities but **not** for cluster-size informativeness about the coin.  
  - **Betting argument**:  
    - Bet offered only on **sampled** blue awakenings (one per run).  
    - Expected payout: \(\frac{2}{3}\) (matches halfer probability). Unbiased for the estimand "proportion of Heads runs" under this **two-stage cluster design**.  

  ---

  ### **Residue Report**
  #### **Where Design-Based Inference Suffices**
  - **Dispute dissolution**: The disagreement reduces to an **ambiguity in sampling design**:  
    - **Thirder**: Uses a **pooled frame of units** (awakenings).  
    - **Halfer**: Uses a **cluster-based frame** (runs) with secondary sampling.  
  - **Estimand clarity**:  
    - Thirder: Proportion of **awakenings** that are Heads (given blue).  
    - Halfer: Proportion of **runs** that are Heads (given a blue awakening is sampled).  
  - **Betting/long-run arguments**: Translate cleanly to **unbiasedness of HT estimators** under their respective designs.  
  - **Room color**: Enters as **post-stratification** (conditioning on a stratum).  

  #### **Where Design-Based Inference Reaches Outside**
  1. **Bayesian conditioning**:  
     - Halfer requires conditioning on the event "blue awakening sampled" after the two-stage design. This is not pure HT estimation.  
     - Design-based tools handle **inclusion probabilities** but not **post-sampling conditioning** without adjustments (e.g., post-stratification weights).  

  2. **Indexicality (self-locating uncertainty)**:  
     - Beauty’s question ("Where am I in the frame?") has no direct analog.  
     - In survey inference, the **design is stipulated externally** (e.g., by the statistician). Here, Beauty **is the frame** and must choose the design.  
     - This choice (unit-based vs. cluster-based) is not dictated by the protocol and creates the dispute.  

  #### **Residue: What Has No Expression**
  - **Demand for a single "rational" probability**:  
    - Design-based inference **requires a stipulated design**. Beauty has no external designer; she must decide whether to weight by **runs** (halfer) or **awakenings** (thirder).  
    - The dispute persists because the protocol does not specify whether the **frame** is runs or awakenings.  
  - **Self-locating belief**:  
    - The core issue—Beauty’s uncertainty about her position **within the frame**—has no counterpart in standard survey theory, which assumes an external perspective.  

  ---

  ### **Verdict**
  - **Dispute dissolution**: Yes, the disagreement is primarily an **estimand ambiguity** (run-level vs. unit-level) plus an **unstipulated sampling design**.  
    - Philosophers see "theories of self-locating belief"; survey methodologists see a **design specification problem**.  
  - **Residue significance**: The unresolved residue—**Beauty’s first-person uncertainty**—highlights a gap:  
    - Standard sampling frameworks lack tools for an **agent embedded in the frame** who must **choose the design** without external guidance.  
    - This gap makes the dispute **substantive** in philosophy but **technical** in methodology.  
  - **Recommendation**: In the given protocol:  
    - **Thirder design is superior**: The protocol generates **multiple awakenings per run**, so the unit-based frame (awakenings) aligns with observed data.  
    - **Halfer design distorts reality**: It artificially samples one awakening per run, contradicting the protocol (both awakenings occur in Tails).  

  **Conclusion**: The translation dissolves the surface dispute into design ambiguity, but the residue exposes a fundamental limitation of sampling frameworks for self-locating agents.
