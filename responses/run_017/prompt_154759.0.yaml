    But wait, the halfer got 2/3. Why the discrepancy?

    The halfer's 2/3 is not the long-run frequency of Heads among blue awakenings. Instead, the halfer's reasoning is based on the sampling of the run and then an awakening within the run. 

    In the halfer's design, when we sample a run and then an awakening within the run, the long-run frequency of the event that we get a blue awakening and it is from a Heads run is:

      Number of times we sample a blue awakening from a Heads run: 
