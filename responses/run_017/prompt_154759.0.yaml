    However, in reality, every time there is a blue awakening, that awakening is experienced. The sampling design of the halfer is not the same as the actual frequency of blue awakenings. The halfer's design oversamples the H runs because in the H run, the entire probability mass is on one awakening, while in the T run, it is split. But in the actual long run of experiments, every blue awakening occurs exactly once.

