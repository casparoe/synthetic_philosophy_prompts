  ## National Grains Standards Authority  
  **Circular 7/NGS/1983 (Amendment 17)**  
  **SUBJECT:** Application of Tariff Schedule B, Part IV (Heap Designation) for Bulk Grain Shipments  

  **TO:** All Regional Customs Assessors, Valuation Offices, & External Appeals Tribunals  
  **FROM:** Standards Compliance Directorate, Grain Classification Bureau  

  **1. REVISED ASSESSMENT PROTOCOL FOR HEAP STATUS (HS)**  
  Pursuant to the Grain Measurement Act (1978), tariffs on non-containerised grain shipments are calculated per tonne unless said shipment qualifies as a Heap (HS), thereby attracting preferential Schedule B rates. Effective immediately, the following procedural rules supersede all prior directives regarding HS determination (Circular 7/NGS/1979, Amd. 1-16 hereby rescinded).  

  **1.1. Tolerance Principle (Mandatory Application):**  
     a) A shipment certified as HS shall retain HS status if reduced by one (1) standard grain unit (SGU).  
     b) A shipment *not* certified as HS shall *not* acquire HS status by the addition of one (1) SGU.  
     *Rationale:* Ensures consistent classification against minor fluctuations during handling (Ref: Internal Audit Report GCB/IA/1980-03: "Sifting Incidents at Dock 7").  

  **1.2. Prohibition of Reverse Induction:**  
     a) Clause 1.1(a) applies *only* to downward adjustments from an *already certified* HS.  
     b) Under no circumstances shall Clause 1.1(a) be applied iteratively *upwards* from a non-heap state.  
     c) **Explicit Ban:** Attempting to establish HS status by sequentially adding SGUs to a non-heap starting point, citing Clause 1.1(a) at each step, constitutes Procedural Misapplication (Grade 2). Penalties per Disciplinary Schedule Gamma apply.  
     *Rationale:* Prevents computational anomalies and preserves administrative finality (Ref: Tribunal Case GCB/T/1981-45: *Portsmouth Customs vs. Agri-Import Consolidated*).  

  **2. Definitive Cutoff Threshold (Rule 2):**  
  Notwithstanding Clause 1.1, a shipment definitively achieves HS status upon reaching or exceeding **10,000 SGUs**. A shipment definitively lacks HS status below **5,000 SGUs**.  
     *Rationale:* Established by volumetric analysis and historical precedent. There is a demonstrable material fact of the matter at these thresholds. (Ref: Technical Annex I - *Volumetric Displacement Studies*, GCB Lab/1982-08).  

  **3. Supervaluationist Assessment (Rule 3 - Borderline Cases):**  
  For shipments between 5,000 and 10,000 SGUs:  
     a) HS status is conferred **only** if the shipment qualifies as a heap under **every admissible precisification** listed in Schedule A (attached).  
     b) Schedule A enumerates all officially sanctioned methods of heap assessment (e.g., Conical Stability Index, Lateral Spread Ratio, Visual Cohesion Score ≥ 7).  
     c) **Result:** Due to Schedule A's rigorous standards (esp. Precisification 4: "No visible substrate"), initial application of Rule 3 yielded a 0.7% HS qualification rate in Q1 1983.  

  **4. Schedule A Revision (Amendment 17 Addendum):**  
     a) Precisifications 4, 7, and 9 (deeming substrate visibility determinative) are hereby designated **non-admissible for tariff purposes**.  
     b) Rationale: These precisifications imposed impractical observational constraints under standard dockyard lighting conditions (Ref: Dockworkers Union Safety Memo #87).  
     c) **Outcome:** Revised Schedule A increases operational viability while maintaining rigorous standards.  

  **5. Degree-Theoretic Adjustment (Rule 4 - Partial Heap Status):**  
  Recognising persistent borderline cases under revised Rule 3/Schedule A:  
     a) The Bureau shall assign a **Heapiness Coefficient (HC)** between 0.00 (Non-Heap) and 1.00 (Definitive Heap) to shipments in the 5,000-10,000 SGU range.  
     b) HC is calculated as: `(SGU Count - 5000) / 5000`, adjusted downward by 0.15 for failure on any *admissible* Schedule A precisification.  
     c) Applicable Tariff = (Standard Tonnage Rate * (1 - HC)) + (Preferential HS Rate * HC).  
     d) A **Heapiness Surcharge (HS Adj.)** of 2.5% * (1 - HC) is applied to cover assessment costs.  
     *Appeals Note:* Appeals against the HC calculation or HS Adj. must demonstrate computational error; challenges to the *concept* of partial heapiness are inadmissible (Ref: Circular 12/LEGAL/1982: "Non-Justiciability of Gradients").  

  **6. Higher-Order Borderline Review:**  
     a) The **Borderline Review Tribunal (BRT)** is established to adjudicate disputes concerning whether a shipment is "definitively borderline" (i.e., requiring HC calculation) or falls clearly under Rule 2.  
     b) The BRT shall classify cases as: **Definitively Borderline**, **Definitively Non-Borderline (Rule 2 Applicable)**, or **Borderline-Borderline**.  
     c) **Clause 6.c.iii (Amendment 17):** For shipments designated **Borderline-Borderline** by the BRT, a Secondary Review Panel (SRP) shall determine final BRT status. The SRP may classify cases as **Definitively Borderline-Borderline** or **Borderline-Borderline-Borderline**.  
     d) **Clause 6.c.iii.α:** The disposition of **Borderline-Borderline-Borderline** cases is deferred pending development of Tertiary Review Protocols (Annex II - *Draft Framework*, currently incomplete).  

  **7. Inter-Departmental Consistency Waiver:**  
     a) Designations (HS, Non-HS, HC) made under this Circular are binding *only* for tariff assessment under Schedule B.  
     b) Other departments may apply distinct heap criteria for their purposes (e.g., Museum Acquisitions: "A pile of rubble ≥ 1m³ constitutes a 'Monumental Heap' per Heritage Code §12"; Warehouse Safety: "Unrestrained grain piles > 0.75m height constitute hazardous heaps").  
     c) **Example:** Shipment G-1983-456 (7,200 SGUs) was assessed:  
        * Tariff Office: HC 0.44 + Adj. (Rule 4)  
        * Safety Inspectorate: Hazardous Heap (Fine issued)  
        * National Museum (Assessing rubble pile): Non-Monumental Heap (Acquisition denied)  
     d) No reconciliation between departmental heap determinations is required or permitted.  

  **8. Implementation & Next Steps:**  
     a) This Amendment (17) incorporates feedback from the disastrous pilot of the purely supervaluationist model (Rule 3 initial).  
     b) The Heapiness Coefficient model (Rule 4) is provisional for FY1984. Feedback on computational burdens and surcharge fairness is required by 31/03/1984.  
     c) Annex II (Tertiary Review) remains under development. Projected completion: See Circular 9/ADMIN/1983 (not yet issued) ¶4.  
     d) **Amendment 18:** Preliminary drafting has commenced to address:  
        * Refinement of HC adjustment factors based on grain type (e.g., rice vs. wheat).  
        * Appeals mechanism for SRP Borderline-Borderline-Borderline designations (pending Annex II).  
        * Resolution of Circular self-reference anomaly (Footnote 1 below).  

  **9. Conclusion:**  
  The Directorate is confident this revised framework provides a robust, administratively workable, and factually grounded system for Heap Status determination, balancing precision with operational pragmatism. Vigilance against procedural misapplication (Clause 1.2) remains paramount.  
  Compliance is mandatory effective 01/01/1984.  

  **Attachments:**  
  * Schedule A (Rev. Amd.17): Admissible Precisifications for Heap Assessment  
  * Annex I: Volumetric Displacement Studies (GCB Lab/1982-08)  
  * Annex II: *Draft Framework for Tertiary Borderline Review* (Status: Deferred Pending Resource Allocation)  

  **Footnote 1:** This Circular cites Circular 9/ADMIN/1983 (¶8.c), which itself defers to the Tertiary Review Protocols outlined *in this Circular* (¶6.c.iii.α & Annex II). Resolution of this referential loop is anticipated in Amendment 18.  

  ---
  **End of Circular**  

  ---

  **Why this works for the brief:**

  1.  **Deadpan Bureaucracy:** The comedy emerges entirely from the institution earnestly grappling with the *structure* of vagueness via rules, amendments, and committees, without ever naming the philosophy.
  2.  **Core Sorites Elements:**
      *   **Tolerance Principle:** Explicitly Rule 1.1, the engine of the paradox.
      *   **Reverse Induction Ban:** Clause 1.2 directly addresses the absurd conclusion administratively.
      *   **Sharp Cutoff:** Rule 2 is stated with absolute, unjustified confidence.
      *   **Supervaluation:** Rule 3 and the disaster with Schedule A capture the "no true heap" problem and the "fix" via restricting precisifications.
      *   **Degree Theory:** Rule 4 introduces partial truth (Heapiness Coefficient), pro-rating (the tariff calc), and a practical consequence (the surcharge/appeals).
      *   **Higher-Order Vagueness:** The BRT and its need for an SRP (and the SRP's own borderline category) perfectly mirror the problem ascending levels.
      *   **Context Dependence:** Section 7 shows the same shipment classified differently under different "heap" standards without remark.
  3.  **Institutional Furniture:** Circulars, Amendments, Schedules (A), Annexes (I - real, II - deferred), Footnotes with circular references (creating a loop), named Tribunals (BRT, SRP), specific Clauses, cited Reports and Cases.
  4.  **Collapse & Routine:** The system is presented as messy yet normal: Amendment 18 is already being drafted to fix flaws *in this one*, Annex II is perpetually deferred, the footnote loop exists, and the "resolution" involves piling more bureaucracy (tertiary review) onto a crumbling foundation. It ends not with a bang, but with the whirr of the amendment machine gearing up for the next iteration.
  5.  **Accessibility:** The context (grain, tariffs) is concrete. The problems (can one grain make a difference? how to handle the middle? what about borderline borderlines?) are intuitively graspable from the bureaucratic struggles, even if the underlying logic isn't formally named. The department's earnest incompetence is the bridge.
