  Okay, let me start by unpacking what this user is asking. They're a graduate student in medieval land law but have been sitting in on a reading group about computation and the mind. They feel out of their depth but have noticed a recurring argumentative move. The move involves using computational complexity results (like NP-hardness) to argue that certain human capacities can't be mechanical. When someone points out that the hard instances are unrealistic, the rebuttal shifts to saying that recognizing easy instances is also hard. The user wants to know if this move has a name, how it relates to existing concepts, and when it's legitimate versus a swindle.

  First, I need to understand the core structure of the move. It seems to involve shifting the burden from solving a problem to recognizing when the problem is easy. The user mentions examples like understanding sentences, planning routes, moral reasoning. In each case, the hardness result is deflected by conceding that practical cases are easy but then arguing that recognizing those easy cases is itself computationally hard.

  I recall that in complexity theory, worst-case hardness can be separated from average-case or typical-case hardness. But the user says this move is adjacent but distinct. They also mention non-constructiveness and circularity. So maybe it's about the recognizability of "easy" instances being tied to the original capacity, creating a circularity.

  Looking at the examples: the brain/Bayesian inference example is interesting. The objection is that approximation methods work in practice, but the reply dismisses them because they lack guarantees. That shifts the focus to certification of correctness, which might also be hard. 

  The user is bothered by the circularity in defining "instances that matter" using the very capacity in question. That's a key point. If recognizing easy cases requires the same capacity, then the argument becomes self-referential and possibly circular.

  Now, for naming. The user mentioned it's not just worst-case vs average-case. I think of "complexity-theoretic minimalism" where the argument reduces to existence claims, ignoring constants. But that's part of it. The recognizability aspect is crucial. "Epistemic relocation" comes to mind—moving the problem to our knowledge of the problem space. Or "complexity laundering" as a pejorative term, where the hardness is shifted rather than resolved.

  I should also consider philosophical concepts. In epistemology, there's the distinction between knowing that and knowing how, or access problems. The user's point about non-constructivity relates to the gap between existence and accessibility of algorithms. 

  Another angle: in logic, impredicativity occurs when a definition refers to a set containing itself. Defining "easy instances" in terms of human capacities might be impredicative. 

  Putting it together, the move involves relocating computational difficulty to an epistemic problem—recognizing tractable cases—while relying on the original capacity, creating circularity. Legitimacy depends on whether the recognition problem is independent. For example, if recognizing easy routes doesn't require planning them, it might be valid. But in language understanding, recognizing a sentence as easy might require understanding it, making it circular.

  The user also wants boundary cases. When is this relocation legitimate? If the recognition problem is simpler or independent, it might hold. But if it's interdependent, it fails. The Bayesian case: variational methods work without certification, so dismissing them because they lack guarantees might ignore practical efficacy. Here, the move could be a swindle by shifting goalposts to require certifications.
answer: |-
  This is a **profoundly astute observation**, and you're absolutely right that this "move" is a recurring pattern in philosophical arguments leveraging computational complexity. It doesn't have a single, universally agreed-upon name, but it sits at the intersection of several well-known concepts. Here's the carving you requested:

  1.  **The Core Move: Epistemic Relocation with Implicit Circularity**
      *   **What it is:** The move shifts the burden of computational difficulty *from solving the core problem* (e.g., planning a route, understanding a sentence) *to the problem of recognizing or characterizing the subset of "easy" or "practically relevant" instances* of that problem. The key concession is that worst-case hardness might not reflect typical experience. The key counter is that *identifying* the "typical" or "easy" instances is itself computationally hard (or even undecidable), and crucially, often seems to *presuppose* the very capacity it's trying to explain.
      *   **The Circularity:** As you brilliantly note, defining the "instances that matter" often implicitly relies on the human capacity in question. "Benign" sentences are those humans *find* easy to parse. "Relevant" route-planning instances are those humans *encounter* or *deem* significant. "Good enough" approximations in inference are those humans *find* satisfactory. This creates a potential circularity: the explanation for the capacity (it avoids hard cases) depends on defining those cases using the capacity itself.

  2.  **Nearest Named Concepts & Distinctions:**
      *   **Worst-Case vs. Average-Case Complexity:** *Adjacent, but distinct.* The standard complaint is about the gap between worst-case hardness and average-case tractability. This move *concedes* that distinction might exist ("sure, the hard instances are cooked up") but then argues the *problem of distinguishing* the average-case (or "practically relevant" case) is itself hard or inaccessible, relocating the difficulty.
      *   **Non-Constructive Existence:** *Close, but not identical.* Arguments relying on P=NP implying easy proof-finding often hinge on the non-constructive nature of the existence of the polynomial-time algorithm. The move here ("the exponent is beside the philosophical point") accepts non-constructivity but pushes further. It's not just that we *don't* know the algorithm, but that even if we *did*, it might be useless on practical inputs *unless we could recognize those inputs easily* – which we can't.
      *   **Goalpost Shifting / Burden Shifting:** *A tactic it employs.* The defender initially argues the core task is computationally hard (Goalpost 1: Solve *all* instances). When challenged on relevance, they shift the goalpost: "Ok, but can you *recognize* the easy instances efficiently?" (Goalpost 2: *Identify* the subset). The burden is relocated.
      *   **Epistemic Access Problem:** *The core essence.* The move fundamentally transforms a claim about *the inherent complexity of the world/problem* into a claim about *our epistemic access* to the structure of that world/problem. The difficulty resides not (only) "out there" but in our inability to efficiently *discern* the favorable conditions "out there".
      *   **Complexity-Theoretic Minimalism:** *The philosophical stance.* This is the underlying view that insists the *mere existence* of a worst-case complexity barrier (like NP-hardness) or a non-constructive existence proof has profound philosophical significance, *regardless* of practical considerations like constants, average-case behavior, or approximation guarantees. The move defends this minimalism against objections based on practicality.

  3.  **The Best Fit & A Proposed Name:**
      While drawing on all the above, the most precise fit for the *specific move you describe* (conceding irrelevance of worst-case instances but relocating difficulty to recognizing easy ones, often circularly) is **"The Epistemic Relocation Gambit"** or **"The Access Problem Dodge."**
      *   **Definition:** A rhetorical maneuver in arguments using computational complexity, where an objection based on the artificiality of worst-case instances is countered by arguing that the problem of efficiently recognizing *non*-worst-case (practically relevant, easy, or benign) instances is itself computationally intractable or epistemically inaccessible, thereby preserving the force of the original complexity result as a fundamental barrier, while implicitly (and sometimes circularly) relying on the target capacity to define the relevant instance subset.

  4.  **Legitimacy vs. Swindle: Boundary Cases**
      The legitimacy hinges on the *independence* of the recognition problem and the *specificity* of the philosophical claim:
      *   **Legitimate When:**
          *   The "easy subset" can be *independently and constructively defined* without presupposing the target capacity. (e.g., "Graphs with maximum degree <= 4" for a routing problem – recognizing low-degree graphs is trivial and doesn't require solving routing). The hardness of the core task *even on this independently defined easy subset* would be significant.
          *   The argument's *sole* claim is about the *existence* of a fundamental barrier in the abstract computational model, explicitly decoupled from practical realizability ("This shows creativity *could* be mechanized *in principle* if P=NP, regardless of exponents").
          *   The argument specifically targets claims of *optimality* or *exactness* requiring certification (e.g., "No *guaranteed* polynomial-time Bayesian inference algorithm exists").
      *   **Swindle When:**
          *   The definition of the "easy subset" is *inherently circular*, implicitly relying on the human capacity it's supposed to help explain (e.g., "Sentences humans find easy").
          *   The argument *initially implies* a strong claim about practical impossibility ("Brains can't do X because it's NP-hard") but, when challenged, retreats to the minimal existence claim ("Well, *some* fundamental barrier exists") while still implying the stronger conclusion.
          *   It dismisses *effective practical heuristics* (like variational methods) that demonstrably work in the relevant domain *merely* because they lack theoretical guarantees, especially when those guarantees are known to be impossible. This ignores the reality of how complex systems (like brains) actually function.
          *   The recognition problem is likely *not* uniformly hard or is solved evolutionarily/developmentally. Humans might not need a *general* recognizer; we might have heuristics *for the recognizer itself* tuned to our ecological niche.

  5.  **Handling the Circularity Bug:**
      Your final point is crucial. The circularity is often the Achilles' heel of the gambit when applied to cognition. If "instances that matter" are defined *as those on which the human capacity succeeds efficiently*, then explaining the capacity by saying it avoids hard instances reduces to "it works because it works on the cases it works on." This makes the argument **epistemically vacuous** for explaining the *origin* or *mechanism* of the capacity. It might still be a valid description of its *operational constraints*, but not an explanation. A legitimate relocation *must avoid this circularity* by providing an independent characterization of the "easy" subset.

  **In Summary:**

  You've identified **The Epistemic Relocation Gambit (or Access Problem Dodge)**: Defending the philosophical relevance of worst-case complexity results by shifting the difficulty to the problem of recognizing benign instances, often falling into circularity by implicitly defining those instances using the very capacity under scrutiny. Its legitimacy depends critically on whether the "easy subset" can be defined non-circularly and independently, and on how tightly the philosophical claim is tied to minimal existence versus practical realizability.

  Your background in medieval law might actually be an asset here – this move has parallels in logical and rhetorical structures found in philosophy and law for centuries (shifting burdens of proof, defining terms self-referentially). You're spotting a modern, computational instantiation of a classic argumentative pattern. Your observation is sharp, and the pattern deserves the name you're seeking to give it.
