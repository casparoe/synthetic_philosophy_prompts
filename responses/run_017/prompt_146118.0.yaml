prompt: |-
  I'm in a metaphysics reading group that just spent two sessions on dispositions, and my housemate — she does something with rheology, lots of cornstarch, don't ask — got interested and now claims she's proved that there are no dispositions at all. I've written her argument out as carefully as I can, and what's annoying is that each step looks fine to me individually while the conclusion is nuts.

  (1) A predicate picks out a real property only if having it makes some difference to what the bearer does or would do. If two things differing only in fragility never differed in anything that happened, there'd be nothing for the property to be.
  (2) The only work a disposition could possibly do is to bring about its manifestation: the sole contribution of being disposed to M in C is that the bearer Ms when C obtains. Dispositions are directed at their manifestations; that's all they are.
  (3) For any disposition D to M in C, there's a possible setup in which x has D but C's obtaining would remove D. A live wire wired to a breaker that trips the instant you touch it: live, touched, no shock. So D's being present doesn't guarantee M.
  (4) For any D there's also a possible setup in which x has D, D persists, and something else stops M anyway — the glass in bubble wrap. So even D-plus-C-plus-no-fink doesn't give you M.
  (5) And the other direction is just as bad: a thing that lacks D can M in C for unrelated reasons. A chunk of something totally un-fragile with a detonator taped to it shatters when struck. So M doesn't even indicate D.
  (6) The usual patch — x is disposed to M in C iff x would M if C obtained and D were retained and nothing interfered — doesn't help, because my group found cases where you can't separate the fink from the mask. Take a fusible link: a wire that conducts, but whose conducting (resistive heating) is what melts it when the current gets big. The disposition's own exercise destroys the disposition, and the destroying is what stops the manifestation. Is that a fink or a mask? Or take oobleck: it's a liquid, so it's disposed to deform under stress, and it jams rigid under impact, and the jamming comes from the very same suspended-particle microstructure that makes it a liquid in the first place. You can't delete the interference while holding the disposition fixed, and you can't hold the disposition fixed while deleting the interference. So the patched analysans is either false or circular.
  (7) So for any disposition you like there's a possible situation where x has it, C obtains, and M doesn't happen, and a possible situation where x lacks it and M does, and the fix that's meant to handle that can't be stated without circularity. Which means whether x Ms in C is never settled by whether x has D. It's settled by everything else going on around it.
  (8) So by (2) D does no work, and by (1) no disposition predicate picks out a real property. There are no dispositions. Fragility, conductivity, solubility are fine as shop talk, but nothing in the world answers to them — there's just the microstructure and what it does.

  What makes me suspicious rather than convinced is that if this works I don't see why it doesn't work on causes: any cause can be stopped from producing its effect by something else, so on this reasoning causation picks out nothing real either, and ditto for laws of nature. My gut says something too cheap is happening when each disposition being finkable or maskable in some possible setup gets turned into its doing no work anywhere, but I can't name the step. Which step do you reject, why did it look fine, and what does rejecting it commit me to? If I have to choose I'd sooner give up (1) than end up an eliminativist about dispositions, but I want the price list for each option, including the bullet-biting one. And is there any version of realism about dispositions that can admit the standard patched conditional analysis is circular and still survive?
reasoning: |-
  Okay, the user is grappling with a complex metaphysical argument presented by their housemate that challenges the existence of dispositions. They've outlined an eight-step argument concluding that dispositional properties like fragility or conductivity aren't real. The user feels each step seems plausible individually but finds the conclusion counterintuitive. They're particularly concerned that similar reasoning might eliminate causation or natural laws, which feels reductively extreme.

  Hmm, let me unpack this systematically. The core tension lies between the housemate's eliminativist conclusion and the user's intuition that dispositions must play some ontological role. The argument cleverly exploits standard problems in disposition theory: finks, masks, mimickers, and circularity in conditional analyses. But its absolutism is suspicious - just because dispositions *can* be interfered with doesn't mean they *do nothing* in normal circumstances.

  I notice the user is philosophically sophisticated - they recognize the parallel to causation and laws, and already suspect premise (1) might be the weak point. Good instincts. Their hidden anxiety seems to be: "If I reject this argument, am I being inconsistent? If I accept it, does all causal talk collapse?" They want ontological accountability without eliminativism.

  The rheology example (oobleck) is fiendishly clever. It shows how dispositional bases can be self-undermining, making the standard "fink/mask" distinction collapse. But that's precisely why premise (2) oversimplifies - dispositions aren't just about manifestations; they're about *causal powers grounded in structure*. 

  I should emphasize that rejecting (2) doesn't require denying dispositions' directedness - just recognizing they have ontological depth beyond manifestation events. The user might prefer a capacities-based approach (Cartwright, Cartwright) over simple conditional analyses. For the causation parallel: yes, singular causes can be preempted, but we still distinguish between a thing's causal powers and accidental sequences.

  The user's willingness to question premise (1) is promising. If we require dispositions to make *actual* differences rather than *contributory* differences, we'd have to eliminate most scientific properties (charge, mass) that only manifest in context. Better to say: dispositions are real precisely because they explain *why* structures behave as they do when finks/masks are absent.

  On circularity: sophisticated dispositional realists (Ellis, Mumford) embrace it - the reciprocal determination between structure and disposition is fundamental, not vicious. The oobleck case shows this elegantly: the microstructure *is* the liquidity, even when it manifests as rigidity under shear. That's not elimination - it's ontological richness.

  Price lists: 
  - Rejecting (1) means accepting properties can be real without always making observable differences. Commits to more abstract ontology. 
  - Rejecting (2) means dispositions do more than cause manifestations - they're grounded in structures. Commits to property dualism or structural realism. 
  - Rejecting (7)'s leap requires accepting that dispositions contribute partially rather than solely. Commits to causal pluralism.

  The user seems to lean toward rejecting (1) or (2). I'll recommend targeting (2) first - it's the most reductive premise and clashes with scientific practice. Their housemate's argument proves too much; if successful, it would eliminate not just dispositions but all non-occurrent properties. Rheologists know cornstarch's weird behavior *presupposes* real dispositional properties of the suspension.
answer: |-
  You've hit on a profound challenge that cuts to the heart of dispositional realism. Your housemate's argument is a sophisticated synthesis of classic problems (finks, masks, mimickers, circularity) into a powerful eliminativist case. Here's the breakdown, with the weakest step identified and alternatives explored:

  ### The Flawed Step: Premise (2)
  **"The only work a disposition could possibly do is to bring about its manifestation."**  
  This is the core oversimplification. It reduces dispositions to *nothing but* their conditional output, ignoring their role as **causal powers grounded in intrinsic structure**. Dispositions aren't just about what *happens*; they're about *why* things happen when conditions are right. Rejecting (2) preserves realism without denying the force of the other steps.

  ### Why (2) Looks Plausible (and Why It's Wrong)
  - **Plausibility:** Dispositions *are* defined by their manifestations. Fragility just *is* the tendency to shatter when struck. This makes the conditional seem exhaustive.
  - **The Error:** Dispositions are **explanatory properties**. When a fragile glass shatters upon impact, its fragility explains *why* it shattered—it's not just that it shattered. The disposition is the **causal bridge** between microstructure (e.g., ionic bonds in glass) and behavior (shattering). Without dispositions, you have either:
    - *Bare microstructure* (which underdetermines behavior: the same SiO₂ structure could be robust in a different context), or  
    - *Bare regularities* ("glasses shatter when struck"), which lack explanatory depth.

  ### Consequences of Rejecting (2)
  1. **Dispositions as Causal Powers:** They are real properties that *enable* or *dispose* their bearers to act in specific ways. Their "work" isn't just producing manifestations; it's **grounding counterfactuals**, **explaining behavior**, and **differentiating entities** with identical categorical bases but different potentialities (e.g., a sugar cube vs. an identically shaped salt crystal: solubility matters).
  2. **Compatibility with (3)-(6):** Finks, masks, and mimickers show that manifestations aren't guaranteed, but *they don't erase the causal contribution of the disposition*. A finked live wire still *tries* to conduct—the breaker trips *because* the wire was live. Oobleck's rigidity *arises from* its liquid microstructure. The disposition isn't inert; it's **actively involved in the causal chain**, even when masked.
  3. **Circularity Isn't Fatal:** The conditional analysis (D iff M if C & no fink/mask) may be circular if "fink" and "mask" are disposition-laden, but this doesn't undermine realism. Dispositions can be **primitive explanatory nodes** in our ontology. Science often uses circular-but-explanatory concepts (e.g., "force" in Newtonian mechanics).

  ### Addressing Your Suspicion (The Causation Parallel)
  You're right: the argument *would* eliminate causation if applied strictly. Causes can be preempted, masked, or mimicked too. But we don't deny causation exists; we say it involves **contributory causes** operating in **complex networks**. Similarly, dispositions are **partial contributors** to outcomes. The housemate's premise (1) sets an impossible standard: only properties that *guarantee* outcomes in *all* contexts are real. This would eliminate nearly all scientific properties (e.g., charge, mass, elasticity).

  ### Price List for Rejecting Other Premises
  - **Reject (1):** "Makes a difference" need not mean *determining* outcomes. Adopt **contributory properties**: dispositions make a *difference-in-virtue-of-which* outcomes occur when they do.  
    *Price:* Commits to properties that aren't always manifest or measurable in isolation. Might require a process ontology (e.g., Whitehead).
    
  - **Reject (7):** The inference from "M isn't guaranteed" to "D does no work" is invalid. D can be a *necessary but insufficient* condition.  
    *Price:* Must defend partial/dispositional causation. Accept that dispositions can be "silent" in masked/finked scenarios yet still real.

  - **Reject (8):** Dispositions are real because they **naturalize laws** (e.g., Bird's dispositional essentialism) or **ground scientific kinds**. Solubility is real because it explains why salt dissolves in water *in virtue of* its ionic bonds.  
    *Price:* Accept irreducible modality in nature (anti-Humeanism).

  ### Survival Strategies for Dispositional Realism
  1. **Grounding in Categorical Properties:** Dispositions are real but reducible to microstructure (e.g., fragility = SiO₂ lattice structure). Solves circularity but risks losing modal force.  
     *Response to Oobleck:* The microstructure *is* the disposition—it manifests as fluidity *or* rigidity depending on stress rate. No elimination needed.  

  2. **Powerful Particulars (Molnar, Martin):** Dispositions (powers) are fundamental. Circularity is benign because powers are interrelated.  
     *Response to Fusible Link:* The wire's power to conduct *and* its power to melt are simultaneous. When it melts, one power destroys another—no mystery.  

  3. **Causal Powers with Manifestation-Partners (Mumford & Anjum):** Dispositions *tend* toward manifestations but require "partners" (e.g., striking partners with fragility). No guarantee is needed for reality.  
     *Response to Mimickers:* The detonator-shattered chunk lacks fragility—it doesn't shatter *in virtue of* being fragile.  

  ### Conclusion
  **Target Premise (2).** Dispositions do more than produce manifestations—they are **causal-explanatory properties** grounded in the bearer's nature. This avoids eliminativism without denying finks/masks. It also saves causation and laws from the same reductio.  

  Your gut is right: the argument proves *too much*. If "can be masked" implies "unreal," science loses charge, mass, and forces. The deeper error is demanding that real properties must be **invariant guarantors of outcomes**. Reality is messier: dispositions contribute to causal networks without dominating them.  

  **Recommended Path:** Defend dispositions as *irreducible causal powers* (rejecting 2) while accepting that their manifestations are context-dependent (embracing 3-6). This keeps dispositions real, explanatory, and metaphysically modest.
