prompt: |-
  I lead the risk-analysis team at a public infrastructure agency. Four times a year we issue a risk register to our board: sixty to ninety one-off, non-repeatable future events, each of which we are currently required to score with a single probability and a one-paragraph rationale. The board allocates capital from those numbers, and the audit office reviews our files afterwards, so every entry has to be defensible on paper by a non-specialist.

  Some of these entries, I am fairly confident, are not the sort of thing that has a probability — and not merely because our evidence is thin. My analysts collapse at least three different situations into a single "we don't know": that there is as yet no fact of the matter whether the event will occur; that there is a fact of the matter, or at least a stable chance, but we have no usable way to estimate it; and that the sentence on the register does not pick out a definite event at all (the extension is operational by 2029 — first passenger train? full timetable? signed-off safety case?). They also score our own future decisions — whether we will apply for the licence, whether we will close the tunnel — exactly as they score rainfall, and when they decline to give a number they enter 50%, which then propagates through the portfolio model as though it were an estimate.

  Please write a decision procedure my team can run on a candidate entry in about ten minutes, grounded in what the philosophical literature on future contingents — the classical case of tomorrow's sea battle and the debates that grew out of it — actually supports, keeping the distinctions that matter for practice and dropping the rest. It should: force those three situations apart, and tell me honestly which of them the theory distinguishes and which only our own practice distinguishes; require a settlement condition — a specifiable check, by a stated date, that will settle whether the event occurred — before any number is issued; handle the difference between forecasting an outcome and scoring a decision of ours that partly determines it; say what replaces the 50% placeholder for an entry marked open, both for the decision itself and for how that item behaves downstream inside an aggregate model; and mark plainly the points where the procedure is really a judgement about our risk appetite rather than a consequence of the theory.

  Then run it on three entries from our current draft: a category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season; the regulator revokes our operating licence within eighteen months; the Northern Link rail extension is operational by 2029. I expect it to tell me something I do not want to hear on at least one of them, since the board will not accept a blank, so say what a defensible refusal looks like on the page. Finally, tell me where the procedure will misfire — in particular, whether any of this can be told apart, in practice, from ordinary uncertainty about the evidence.
reasoning: |-
  We are designing a decision procedure for risk entries that is grounded in philosophical literature on future contingents (like Aristotle's sea battle) and tailored for practical use in a risk register. The procedure must:
   1. Distinguish three situations: 
      a. No fact of the matter yet (future contingent).
      b. Fact of the matter exists but we cannot estimate it (epistemic limitation).
      c. The event description is vague (indeterminate extension).
   2. Require a settlement condition (a clear, verifiable event by a specific date) before assigning a probability.
   3. Handle the difference between forecasting an external event and scoring our own future decisions.
   4. Replace the 50% placeholder for open entries and specify how to handle such entries in aggregation.
   5. Mark points where the procedure involves risk appetite (judgment) rather than pure theory.

   The procedure steps (for a candidate entry):

   Step 1: Clarify the event description.
     - Rewrite the event to be as specific as possible. Define:
          * What exactly happens? (e.g., for "operational by 2029": specify the condition, such as "first passenger train runs on the extension" or "safety certificate issued".)
          * When and how will we know it has occurred? (settlement condition and date)
     - If the event description cannot be made specific (i.e., it is vague and cannot be disambiguated), then mark as "Indeterminate Extension" and do not assign a probability. Instead, note the ambiguity and require the entry to be reworded.

   Step 2: Check for the existence of a fact of the matter.
     - Ask: Is the event such that right now there is a fact of the matter about whether it will happen? 
          * For events that depend on future human decisions (especially our own) that are not yet made, there may be no fact of the matter (future contingent).
          * For events that are determined by current circumstances (even if we don't know them) or by chance processes that are already in motion, there is a fact of the matter (even if we don't know it).
     - If there is no fact of the matter (future contingent) and the event depends on free choices (including our own) that have not been made, then we cannot assign a probability in the same way as we do for coin flips or weather. Instead, we must note that it is a decision-dependent event and treat it differently (see Step 4).

   Step 3: Assess epistemic accessibility.
     - If there is a fact of the matter (or a stable chance) but we lack the evidence or methods to estimate it, then we must decide whether to:
          a. Invest in more research to reduce uncertainty (if feasible and cost-effective).
          b. Acknowledge the ignorance and mark it as "Unquantifiable due to lack of evidence".
          * However, note that for some events (e.g., a regulator's decision) we might have some basis (e.g., historical data, expert elicitation) to form a probability.

   Step 4: Handle decision-dependent events (our own future decisions).
     - For events that depend on our own future decisions (e.g., "we will apply for the licence"), we should not assign a probability as if it were an external event. Instead, we should:
          * Treat the decision as a choice variable. We can model the risk as conditional on our decision (e.g., if we apply, then what is the chance of approval?).
          * Alternatively, we can state that the decision is pending and the risk is contingent on that decision. In the risk register, we might have two entries: one for the decision and one for the consequence, and the decision entry is not assigned a probability but marked as "to be decided".

   Step 5: Settlement condition.
     - Every event that is assigned a probability must have a clear settlement condition and a settlement date (by when the event will have happened or not). If we cannot define such a condition, then the event is not well-defined and must be rewritten.

   Step 6: Assigning a probability.
     - If the event is well-defined, has a settlement condition, and we have a basis for estimation (and there is either a fact of the matter or a stable chance), then assign a probability and document the rationale (including the basis and the settlement condition).
     - For events that are future contingents (no fact of the matter) and depend on free choices, we can assign a probability only if we interpret it as a subjective degree of belief about what choices will be made. However, note that this is a judgment and must be clearly marked as such. We should avoid 50% as a default and instead use a reasoned estimate if possible, but if we have no basis, we must not assign a number.

   Step 7: Handling "open" entries (where we decline to assign a number).
     - Instead of 50%, we leave the probability blank and mark the reason (future contingent with no basis, indeterminate extension, or unquantifiable due to lack of evidence). 
     - In the aggregate model, we cannot propagate a blank. Therefore, we have two options:
          a. Run the model with multiple scenarios (e.g., best case, worst case, or with different assumptions about the open entries).
          b. Assign a placeholder for modeling purposes, but it must be clearly distinguished from a genuine estimate and not used for capital allocation without explicit scenario adjustment. The placeholder should be chosen based on risk appetite (e.g., conservative: 100% for a bad event, 0% for a good event; or neutral: 50%). However, note that 50% for a future decision is arbitrary and may be misleading. The model should flag these placeholders and the board should be aware they are not estimates.

   Step 8: Marking risk appetite.
     - Points where risk appetite comes into play:
          * Choosing to assign a subjective probability to a future contingent (when we have no basis) is a risk appetite decision (we are willing to treat an unknown as a known risk).
          * Choosing a placeholder value for the model (0%, 50%, 100%) reflects risk appetite.
          * Deciding to invest in reducing uncertainty (Step 3) is a risk management decision.

   Now, applying the procedure to three example entries:

   Example 1: "A category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season."

   Step 1: The event is specific: a cyclone of at least category 3, landfall within 50 km of the port, during the coming season (which we assume is defined). Settlement condition: meteorological data and official reports. Settlement date: end of the season.

   Step 2: There is a fact of the matter. The cyclone either will or will not form and track in that way. This is determined by physical laws and current conditions (even if chaotic).

   Step 3: We have methods to estimate this probability (historical data, meteorological models). We can assign a probability based on past frequency and current forecasts.

   Step 4: Not applicable (external event).

   Step 5: Settlement condition is clear.

   Step 6: Assign a probability (e.g., 5%) with rationale.

   Verdict: Assign a probability. This is a standard weather risk.

   Example 2: "The regulator revokes our operating licence within eighteen months."

   Step 1: The event is specific: revocation of the licence within 18 months. Settlement condition: official notice from the regulator. Settlement date: 18 months from now.

   Step 2: This event depends on future decisions by the regulator (and possibly our own actions). The regulator's decision is a future contingent (free choice) and there is no fact of the matter until the decision is made.

   Step 3: However, we might have some evidence about the regulator's behavior (past actions, current concerns, ongoing disputes). This is an epistemic situation: we can form a subjective probability based on our knowledge.

   Step 4: The event is decision-dependent (by the regulator). We are not the decision-maker, but we can model the regulator's decision as a probabilistic event. However, note that if we have no basis for an estimate, we might mark it as unquantifiable.

   Step 5: Settlement condition is clear.

   Step 6: We can assign a probability if we have a basis (e.g., 10% based on current disputes). But if we have no evidence, we would mark it as unquantifiable. However, in practice, we might use expert judgment. This is a judgment call and must be documented as such.

   Verdict: We can assign a probability if we have a basis (even if subjective). If we have no basis, we must mark it as unquantifiable and leave it open. But note that the board may not accept a blank. A defensible refusal would be: "This event depends on a regulatory decision that cannot be predicted with current information. We have no basis for an estimate." However, if we must assign a number, we must acknowledge it is a judgment and not based on evidence.

   Example 3: "The Northern Link rail extension is operational by 2029."

   Step 1: The event is vague. What does "operational" mean? We must define it: e.g., "first passenger train runs on the extension" or "the safety certificate is issued by the regulator". Let's assume we define it as: "The rail extension is open to the public and carrying passengers on a regular schedule by 31 December 2029." Settlement condition: public announcement by the agency and/or timetable publication. Settlement date: 31 Dec 2029.

   Step 2: This event is partly determined by our own future decisions (e.g., whether to prioritize this project, how to handle delays) and by external factors (e.g., construction delays, funding). There is no fact of the matter yet about whether we will meet the deadline because it depends on decisions not yet made and events not yet occurred.

   Step 3: We may have a project plan and historical data on similar projects. We can estimate the probability based on project management factors.

   Step 4: It is decision-dependent (our own decisions and external events). We can model it as a probabilistic event by breaking it down into risks (delays in construction, funding shortfalls, etc.) and then aggregating.

   Step 5: Settlement condition is now clear (if we define it).

   Step 6: We can assign a probability if we have a basis (e.g., 70% based on current progress and risk factors). However, note that if the event is redefined to be more specific, then we can assign a probability. But if we cannot break down the uncertainty (e.g., if the project is in early stages and too many unknowns), we might mark it as unquantifiable.

   Verdict: We can assign a probability if we have a project risk assessment. But we must be cautious: if the project is very uncertain, we might have to mark it as unquantifiable. However, in practice, project risks are often estimated.

   Now, where the procedure might misfire:

   1. Distinguishing between "no fact of the matter" and "epistemic limitation" can be tricky. In practice, we might always treat an event as having a fact of the matter if we believe in determinism (even for human decisions). The procedure requires a judgment about free will versus determinism? But for practical purposes, we can say: if the event depends on decisions that have not been made and the outcome is not determined by current circumstances, then it is a future contingent. However, in a professional setting, we often treat human decisions as having probabilities (e.g., based on incentives, past behavior). So the procedure must allow for subjective probabilities in such cases, but mark them as judgment-based.

   2. The procedure might be too strict and lead to many entries being left open. The board might not accept that. Therefore, we must balance philosophical rigor with practical needs. We might have to assign numbers even in borderline cases, but with clear documentation of the limitations.

   3. The settlement condition might be difficult to define for some events (e.g., events that are not directly observable or that require interpretation). The procedure requires that we make it explicit.

   4. In practice, it might be hard to tell apart ordinary uncertainty about evidence from a true future contingent. For instance, the regulator's decision: we might have a lot of evidence (so it's epistemic) or very little and the decision is genuinely open (future contingent). The procedure requires us to make a call: if we have no evidence, we treat it as unquantifiable (or future contingent) and leave it open. But if we have some evidence, we assign a probability.

   Finally, a defensible refusal for an entry would look like:

     Event: [Description]
     Probability: [Blank] 
     Reason: [One of: 
          "Event description is too vague; requires clarification" 
          "This event depends on future decisions that have not been made and for which we have no basis for estimation"
          "We lack sufficient evidence to form an estimate"]
     Settlement condition: [If we can define one, write it; otherwise, "Not defined"]
     Downstream handling in model: [e.g., "Will be modeled in a separate scenario as occurring/not occurring based on risk appetite (placeholder: 50%)" - but note this is a judgment]

   We must be prepared to defend why we left an entry open and what we are doing about it (e.g., monitoring, research, redefinition).

   The procedure will force us to be explicit about the nature of the uncertainty and to avoid arbitrary 50% assignments. It will also require clear definitions and settlement conditions. However, it may increase the workload and require training of analysts.
answer: |-
  ### Decision Procedure for Risk Register Entries  
  **Grounding in Philosophical Theory**: Rooted in Aristotle’s *future contingents* (e.g., "tomorrow’s sea battle") and modern debates (e.g., Barnes & Williams, 2011; Hájek, 2011), this procedure distinguishes:  
  1. **True future contingents (FC)**: Events with *no current fact of the matter* (e.g., unresolved human decisions).  
  2. **Epistemic gaps (EG)**: Events with a fact of the matter or stable chance, but *insufficient evidence* for estimation.  
  3. **Indeterminate extensions (IE)**: Vague event descriptions lacking clear truth conditions.  

  **Theoretical vs. Practical Distinction**:  
  - FC and EG are *theory-supported* (metaphysical vs. epistemological uncertainty).  
  - IE is *practice-driven* (flawed specification).  

  ---

  ### 10-Minute Decision Procedure  
  1. **Clarify Event Definition** (2 mins):  
     - Rewrite the entry to specify:  
       - **Exact outcome** (e.g., "first passenger train departs" vs. "signed-off safety case").  
       - **Settlement condition**: A verifiable, binary check (e.g., "Regulator’s revocation notice published by [date]").  
       - **Settlement date**: Deadline for verification.  
     - *Failure* → **IE: Indeterminate Extension**. *Do not assign probability*.  

  2. **Assess Fact of the Matter** (3 mins):  
     - **Q1**: *Could the outcome change based on future free choices (e.g., human decisions not yet made)?*  
       - **Yes** → **FC: True Future Contingent** (e.g., our decision to close a tunnel).  
       - **No** (e.g., cyclone formation) → Proceed to Q2.  
     - **Q2**: *Is there a stable physical/social chance process?*  
       - **No** → **FC**.  
       - **Yes** → **EG: Epistemic Gap** (if evidence is poor).  

  3. **Handle Decision-Dependence** (2 mins):  
     - For events *dependent on our unresolved decisions* (e.g., "we apply for license"):  
       - **Do not score as external events**.  
       - Split into:  
         - (a) The *decision itself* (FC: no probability assigned).  
         - (b) *Downstream outcomes* (e.g., "license denied if applied for" → score only if evidence exists).  

  4. **Probability Assignment Rules** (2 mins):  
     - **FC (Future Contingent)**:  
       - No probability. Mark as **"Open (FC)"**.  
       - *Rationale required*: "No fact of the matter until decision/action at [milestone]."  
     - **EG (Epistemic Gap)**:  
       - Assign probability if *evidence-based* (e.g., historical data, models).  
       - If no evidence → **"Unquantifiable (EG)"**.  
     - **IE (Indeterminate Extension)**:  
       - **Never assign probability**. Demand redrafting.  

  5. **Replace 50% Placeholder** (1 min):  
     - **In register**: Use labels: **"Open (FC)"** or **"Unquantifiable (EG)"**.  
     - **In aggregate models**:  
       - **FC entries**: Exclude from probabilistic models. Use *scenario analysis* (e.g., "if we approve X, then Y").  
       - **EG entries**: Use *sensitivity testing* (e.g., 0%/50%/100% to show model vulnerability).  
     - *Rationale*: 50% falsely implies equiprobability; FCs have no "probability" to aggregate.  

  6. **Risk Appliance Flags** (Mark where judgment overrides theory):  
     - ⚠️ **"Assign despite FC"**: If board mandates a number, use a *risk-appetite-driven placeholder* (e.g., 0% if risk-averse). Flag: **"Judgment: No metaphysical basis"**.  
     - ⚠️ **"Model inclusion"**: Choosing 0%/50%/100% for EG in models is a *risk-appetite choice*.  

  ---

  ### Application to Draft Entries  
  #### 1. Cyclone Landfall  
  > *"Category 3+ cyclone makes landfall within 50 km of port in coming season."*  
  - **Clarify**: Specific (meteorological criteria). Settlement: Weather agency data by season end.  
  - **Fact of Matter?** No free-choice dependence; stable climate processes → **EG (Epistemic Gap)**.  
  - **Probability**: Assign evidence-based % (e.g., 8% from historical frequency).  
  - **Verdict**: **Defensible**.  

  #### 2. Regulator Revokes License  
  > *"Regulator revokes operating license within 18 months."*  
  - **Clarify**: Settlement: Formal revocation notice by [date].  
  - **Fact of Matter?** Depends on regulator’s unresolved decisions → **FC (Future Contingent)**.  
  - **Decision-Dependence**: *Our actions* (e.g., compliance) affect outcome. Do not score as external.  
  - **Probability**: **Refuse assignment**. Mark as **"Open (FC)"**.  
    - **Defensible Refusal**:  
      > *"Probability withheld: Outcome depends on future regulatory discretion and our response, with no current fact of the matter. Settles upon regulator’s formal decision by [date]. Modeled via scenarios (e.g., revocation vs. status quo)."*  
  - **Board Pushback**: If forced, assign ⚠️ **0% (risk-appetite choice)** with flag: *"Judgment: Risk-averse placeholder only."*  

  #### 3. Northern Link Rail Operational  
  > *"Northern Link rail extension operational by 2029."*  
  - **Clarify**: Ambiguous ("operational" = first train? full service? safety approval?) → **IE (Indeterminate Extension)**.  
  - **Settlement Condition**: None defined.  
  - **Probability**: **Refuse assignment**. Demand redraft (e.g., *"Safety certificate approved by 31 Dec 2029"*).  
  - **Defensible Refusal**:  
    > *"Probability withheld: Event description indeterminate. Specify: (a) Outcome (e.g., 'safety certificate issued'), (b) Settlement date, (c) Verification method. Until revised, unscoreable."*  

  ---

  ### Where the Procedure Misfires  
  1. **FC vs. EG Ambiguity**:  
     - In practice, distinguishing "no fact of the matter" (FC) from "unknown fact" (EG) can hinge on *metaphysical assumptions* (e.g., determinism).  
     - **Mitigation**: Default to **EG** if evidence *could* exist (e.g., regulator’s pattern of behavior). Reserve **FC** for purely open decisions.  

  2. **Indistinguishable from Ordinary Uncertainty**:  
     - **EG** (epistemic gap) *is* ordinary evidence uncertainty—but the procedure *exposes* when it’s unsolvable (e.g., no data exists).  
     - **FC** is uniquely problematic: It resists *any* probability if free will exists. Audit defensibility rests on documenting the "decision-dependence" rationale.  

  3. **Over-Labeling Risk**:  
     - Analysts may overuse **FC** to avoid hard estimates. **Counter**: Require proof of *specific unresolved decisions* (e.g., "Board vote on June 30").  

  4. **Modeling Limitations**:  
     - Excluding **FC** entries from portfolios may underrepresent systemic risk. **Solution**: Qualitative scenario notes appended to quantitative models.  

  **Key Insight**: This procedure forces honesty about *why* an event is unscoreable, replacing false precision with auditable reasoning. It succeeds if your board accepts that some risks defy numbers—and that 50% is a last-resort gamble, not a default.  

  ---  
  **References**:  
  - Aristotle, *De Interpretatione* (future contingents).  
  - Barnes, E., & Williams, J.R.G. (2011). A Theory of Metaphysical Indeterminacy.  
  - Hájek, A. (2011). Interpretations of Probability.
