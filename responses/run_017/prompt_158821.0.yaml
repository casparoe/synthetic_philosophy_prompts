  **INTERNAL MEMORANDUM**  
  **DATE:** 24 October 2023  
  **TO:** All Ward Staff, Nursing Personnel, Surgical Teams & Clinical Assessors  
  **FROM:** Office of Clinical Standards, Midlands Vale NHS Trust  
  **SUBJECT:** Revision of Pain and Consciousness Assessment Protocols (Effective Immediately)  
  **REF:** OCS/MVT/IL-01  

  ### 1. **ONTOLOGICAL REALIGNMENT**  
  The Trust has adopted a rigorously evidence-based framework for understanding consciousness, specifically rejecting ontologically inflationary models of subjective experience. Accordingly, the terms "pain," "suffering," "qualia," or "phenomenal states" (hereafter *Legacy Phenomenal Idiom/LPI*) do not denote intrinsic, private, or ineffable properties. They instead reference *functional-neurocomputational misrepresentations* (FNMs) generated by predictive processing systems.  

  ### 2. **DUAL COMMUNICATION PROTOCOL**  
  2.1. **Bedside Communication**: LPI ("pain," "hurt," "agony") may be used *verbally* for patient psychological reassurance.  
  2.2. **Clinical Documentation**: All charts, electronic records, and care plans **must** exclusively use FNM terminology (e.g., "nociceptive signal error," "threat-processing override," "self-model misalignment").  
  **Example**: A patient stating "It burns!" is verbally soothed with "We’ll manage your pain," but charted as *"C-fiber activation; FNM-type: thermal threat simulation."*  

  ### 3. **SELF-REPORT PROCESSING**  
  Patient utterances of LPI are **not authoritative reports of private states**. They are:  
  3.1. **Data Inputs**: To be cross-referenced with functional biomarkers (heart rate, neural imaging, motor response).  
  3.2. **Quasi-Phenomenal Noise**: Where self-reports conflict with functional evidence (Sec. 5), prioritize the latter. Self-reports are treated as unreliable perceptual measurements, akin to a faulty thermometer.  

  ### 4. **MÜLLER-LYER COMPLIANCE**  
  Staff must recognize that introspective certainty does not indicate ontological reality. Just as lines appear bent but are straight, so too does pain *appear* to hurt intrinsically. Training modules will emphasize: **"The lines do not bend. The pain does not hurt."**  

  ### 5. **CLINICAL RULINGS & CASE PROTOCOLS**  
  5.1. **Case A (Under-anaesthetised Patient)**:  
  * *Presentation*: Post-laparoscopy patient claims "agony" during surgery despite immobility and stable vitals.  
  * *Ruling*: Immobility and absent autonomic stress markers confirm no systemic threat-response. The retrospective "agony" is a confabulated FNM. **Action**: Log as *"Post-operative metacognitive misrepresentation; no intervention required."*  

  5.2. **Case B (Congenital Insensitivity to Pain Reporting "Pain")**:  
  * *Presentation*: Patient with CIP (no nociceptors) insists on "terrible pain" in left arm. Scans show no pathology or neural anomalies.  
  * *Ruling*: Absent correlated functional dysfunction, report is a hallucinatory FNM. **Action**: Chart as *"Somatosensory hallucination; refer to Neuropsychiatry."* Morphine denied.  

  5.3. **Case C (Comatose Patient; Family Requests Morphine)**:  
  * *Presentation*: Family insists patient "looks tormented" (grimacing, tachycardia). EEG shows no conscious activity.  
  * *Ruling*: Grimacing/tachycardia are subcortical threat reflexes. No conscious subject exists to "suffer." **Action**: Document as *"Autonomic noise; familial distress re: non-phenomenal grimace reflex."* Morphine contraindicated.  

  ### 6. **SURGICAL CONSENT REVISION**  
  All consent forms now include:  
  > *"While you may experience discomfort-signals, these reflect evolutionary misrepresentations, not intrinsic suffering. Analgesia targets signal disruption, not subjective relief."*  

  ---

  ### STAFF FAQ  
  **Q: Does this mean we ignore patients who say they’re in pain?**  
  A: No. FNMs are real neural events requiring intervention. We treat the *signal*, not the illusion.  

  **Q: Isn’t this just semantics?**  
  A: Semantics reflect ontology. Pre-FNM frameworks implied an inaccessible "ghost in the machine." Our model is physically complete. Nothing practical changes.  

  **Q: What if a staff member "feels" this is wrong?**  
  A: Such feelings are FNMs. Attend the mandatory "Introspection Debiasing" workshop (Schedule Annex B).  

  **Q: Are we still giving morphine?**  
  A: Yes—but as a neurochemical disruptor of maladaptive signaling loops, not a "painkiller."  

  ---  
  **END MEMORANDUM**  

  ---

  ### Analyst Note: Commitments & Exaggerations  
  This memo extends **strong illusionism** (e.g., Keith Frankish's position), rejecting even *quasi*-phenomenal properties. It treats introspection as uniformly illusory, not partially reliable. The horror emerges from strict adherence:  

  1. **Exaggeration**: The CIP ruling. Illusionists typically accept self-reports as *data* (misrepresentations are real events). Denying morphine because the report lacks a "functional state" contradicts illusionism’s core—*all* reports are FNMs, so the patient’s report *is* the functional state requiring treatment. A consistent illusionist would administer analgesia to disrupt the underlying misrepresentation.  

  2. **Logical Commitment**: The comatose ruling. If consciousness is illusory, then comatose patients *cannot* suffer—grimacing is reflexive. Morphine *would* be withheld under strict illusionism, as no "subject of experience" exists to relieve. This exposes the theory’s ethical vacuum when applied institutionally.  

  3. **Unavoidable**: The under-anaesthetised case. If consciousness is an illusion, the patient’s retrospective agony *must* be a confabulation. To treat it as real would concede phenomenal presence. Thus, the memo’s dismissal follows necessarily—and chillingly—from the premises.  

  The satire works by weaponizing illusionism’s own claim that "nothing changes" while showing *everything* changes when human testimony is downgraded to system noise. — 148 words.
