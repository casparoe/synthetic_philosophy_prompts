prompt: |-
  I work in the algorithmic accountability unit of a national audit office. About twenty times a year we review a public body's risk-scoring system — a model that ranks cases (taxpayers, tenancies, benefit claims) by predicted risk and sends the top ones to human investigators — and we publish a short opinion which the body must answer publicly. We have fifteen working days, a validation sample with scores, observed outcomes and protected-characteristic labels, and, for proprietary systems, no training data and no model internals. We cannot tell a body which fairness criterion to adopt; that is for it and its ministers. What we can do is check whether the commitments it has made are coherent, and whether they hold for the deployment it actually plans.

  Before looking at any fairness numbers, we now record what we call the deployment envelope: the decision the score feeds (a fixed threshold, or selection of a fixed-capacity top slice), the outcome being measured, the group definition in force, whether that outcome is observed for everyone or only for cases that were selected, and the time window. Please turn the familiar incompatibility results — the ones showing that, away from degenerate cases, calibration within groups cannot be combined with equal error rates across groups whose base rates differ — into a decision procedure our reviewers can run inside a deployment envelope: the ordered questions, what counts as a sufficient answer to each, the points at which it returns 'internally inconsistent claim — send back to the vendor', the points at which it returns 'holds under this envelope only', and the points at which it must stop and hand the decision back because it is a choice of values rather than a matter of coherence. It has to cope with outcomes observed only for investigated cases, with group labels that are themselves proxies, and with the same scores being used at two different thresholds by two units of one body.

  Then run it on two submissions: a tax authority's model for selecting returns to audit, where the vendor reports calibration within each group together with equal false-positive and false-negative rates across groups; and a council's model for allocating housing-inspection visits, where the council is under a statutory duty to equalise the rate at which each group is wrongly flagged, the base rates differ, and the model already outperforms the process it replaces — this is the one where I expect an answer the council will not want. Close by saying plainly what the procedure cannot tell us. Please write in British English and keep the whole response, procedure and applications included, under 1,200 words.
reasoning: |-
  We are designing a decision procedure for the reviewers to check the coherence of fairness claims in a given deployment envelope. The deployment envelope specifies:
  - The decision: fixed threshold or top-k selection.
  - The outcome being measured (e.g., fraud, safety hazard).
  - The group definition (e.g., race, gender, age group).
  - Whether the outcome is observed for everyone or only for the selected cases (which affects the ability to compute certain metrics).
  - The time window.

  The key incompatibility results we rely on are:
  1. Calibration within groups (also known as predictive parity) requires that for every score value, the probability of the positive outcome is the same across groups. 
  2. Equal error rates (false positive rate and false negative rate) across groups.
  3. When base rates (prevalence) differ across groups, it is impossible to have both (1) and (2) unless the model is perfect or the base rates are equal.

  Our decision procedure must also handle:
  - Outcomes only observed for investigated cases (i.e., selected cases) -> this leads to missing data for the non-selected.
  - Group labels that are proxies (which might lead to measurement error, but we are not adjusting for that in the coherence check).
  - The same scores being used at two different thresholds by two units.

  We break down the procedure into ordered questions.

  **Decision Procedure: Coherence Check for Fairness Commitments**

  **Step 0: Record the deployment envelope.**
     - Note: decision rule, outcome, group definitions, outcome observability, time window.

  **Step 1: Check if the body has made commitments that are mutually exclusive.**
     The commitments we are concerned with are:
        (A) Calibration within groups (for each group, the model is calibrated: P(Y=1|S=s, G=g) = s for all s and g).
        (B) Equal false positive rates (FPR) across groups: P(S>t | Y=0, G=g) is the same for all g at the threshold t.
        (C) Equal false negative rates (FNR) across groups: P(S<=t | Y=1, G=g) is the same for all g at the threshold t.

     Note: We are also aware that the body might have other commitments (e.g., equal positive predictive value, equal opportunity, etc.), but the key incompatibility is between (A) and (B+C) when base rates differ.

     **Question 1.1: Does the body claim both (A) and (B) for the same threshold?** 
          - If yes, then we need to check base rates. But note: base rates might not be directly observable because of missing outcomes.

     **Question 1.2: Does the body claim both (A) and (C) for the same threshold?**
          - Similarly.

     **Question 1.3: Does the body claim both (A) and (B) and (C) for the same threshold?**
          - Then the same incompatibility applies.

     How to check base rates? 
          - If outcomes are observed for everyone (which is rare), then we can compute base rates for each group: P(Y=1|G=g).
          - If outcomes are only observed for the selected, then we cannot compute the base rates without making assumptions (like assuming the model is calibrated on the selected, which is what we are checking) or using techniques such as reweighting. However, we are limited by time and data.

     **Handling missing outcomes:**
          - If the body claims (A) calibration within groups, and they have outcomes only for the selected, then they must have used the selected data to assess calibration. But note: calibration on the selected is not the same as calibration on the entire population because of selection bias.

     **Step 1.4: If the body claims (A) and (B) and/or (C) at the same threshold, then:**
          - If the outcome is observed for everyone: 
              Compute the base rates for each group. 
              If the base rates are equal (within a reasonable tolerance), then it is possible to have both (A) and (B) and (C). Otherwise, it is impossible -> return 'internally inconsistent claim — send back to the vendor'.
          - If the outcome is only observed for the selected:
              We cannot compute the base rates. However, we can use the following:

              We know that under selection, the observed base rate in the selected sample for group g is: 
                  P(Y=1 | Selected, G=g) = P(Y=1 | S>t, G=g)

              If the model is calibrated on the entire population (claim A), then we would expect that the score s is the probability of Y=1 in the entire population. But we only have data for the selected.

              However, if the model is calibrated on the entire population, then the observed rate in the selected sample (which is the PPV) should be the expected score among the selected in that group. But note: the expected score among the selected in group g is E[S | S>t, G=g]. 

              So, if the model is calibrated on the entire population, then we should have:
                  P(Y=1 | S>t, G=g) = E[S | S>t, G=g]

              But the body might not have provided E[S | S>t, G=g]. We only have the scores and outcomes for the selected.

              Without the entire population scores, we cannot check calibration on the entire population. Therefore, if the body claims (A) (calibration on the entire population) but we only have selected data, we cannot verify (A). 

              However, the body might have assessed calibration on the selected sample. But note: calibration on the selected sample is a different claim (sometimes called "sufficiency for the selected") and does not suffer the same incompatibility with error rate balance.

              Therefore, we must clarify the claim: 
                  Is the calibration claim for the entire population or for the selected?

              **Question 1.5: What is the scope of the calibration claim?**
                  - Entire population? -> then we need the entire population scores and outcomes (which we don't have for non-selected). Without that, we cannot verify. But the body might have provided a holdout set that includes non-selected? (The problem says we have a validation sample with scores and outcomes and group labels. It doesn't specify if it's only the selected or the entire population. We must check the sample.)

              **Step 1.6: Check the validation sample.**
                  - If the validation sample is a random sample of the entire population (including non-selected) and we have outcomes for everyone, then we can compute base rates and check calibration on the entire population.
                  - If the validation sample is only the selected cases, then we cannot compute base rates for the entire population, and we cannot check calibration on the entire population.

              **Therefore:**
                  - If the body claims calibration on the entire population but we have only selected data, then we cannot verify that claim -> return 'claim about entire population calibration cannot be verified with the provided data; either adjust claim to calibration on selected or provide data for entire population'.

                  - If the body claims calibration on the selected, then that is a different claim and does not conflict with error rate balance? But note: the incompatibility result is about entire population calibration and error rates. So if the calibration claim is only on the selected, then the incompatibility does not apply. However, we must check that the claim is consistent with the error rates.

              Actually, the incompatibility result does not involve calibration on the selected. So we can have calibration on the selected and error rate balance? 

              But note: error rates (FPR and FNR) require knowing the true labels for the entire population (or at least for a representative sample). Without outcomes for non-selected, we cannot compute FPR and FNR.

              **Therefore, if outcomes are only observed for the selected:**
                  - We cannot compute FPR and FNR (because we don't know the true negatives and false negatives in the non-selected). 
                  - So claims (B) and (C) cannot be verified.

              **Conclusion for Step 1:**
                  - If the body claims (B) or (C) and outcomes are only observed for the selected, then we must flag that these claims cannot be verified with the available data -> return 'false positive/negative rates cannot be computed because outcomes are missing for non-selected; adjust claim or provide outcomes for entire population'.

                  - If the body claims (A) for the entire population and we don't have a representative sample of the entire population (including non-selected) with outcomes, then we cannot verify (A) -> return 'entire population calibration cannot be verified without outcomes for non-selected'.

              **So the only claims we can check with selected-only outcomes are:**
                  - Calibration on the selected (if provided) and other metrics that depend only on the selected (e.g., precision).

              **If we have outcomes for everyone:**
                  - Then we can compute base rates. If base rates are equal, then (A) and (B+C) are compatible. Otherwise, they are incompatible -> return 'internally inconsistent claim because base rates differ and therefore calibration and error rate balance cannot hold simultaneously'.

  **Step 2: Check if the claims hold under the deployment envelope.**
     - If the claims are compatible (base rates equal, or no incompatibility between the claims) or we have the necessary data, then we compute the metrics.

     **For the tax authority example:**
          - Claim: (A) calibration within groups and (B) equal FPR and (C) equal FNR.
          - We assume we have a validation sample that is a random sample of the entire population (because tax audits might not reveal fraud for non-audited, but the validation sample might be a separate sample where they did a random audit? The problem doesn't specify. We'll assume the validation sample is representative of the entire population and has outcomes for everyone.)

          Step 1: Check base rates. If base rates differ, then the claim is internally inconsistent. We return 'internally inconsistent claim — send back to the vendor'.

     **For the council housing-inspection:**
          - The council is under a statutory duty to equalise the rate at which each group is wrongly flagged. 
          - What does "wrongly flagged" mean? 
              - It could mean false positive rate (if "flagged" means selected for inspection and the outcome is the presence of a hazard, then a false positive is a non-hazardous property that is inspected). 
              - But note: the duty is to equalise the rate of being wrongly flagged. This could be interpreted as equalising the false positive rate (FPR) across groups.

          - The claim: the body must ensure equal FPR across groups.

          - The body might also have other claims? The problem says: the model already outperforms the process it replaces. But we are not told of any calibration claim.

          - Now, the base rates (prevalence of hazardous conditions) differ.

          - The deployment envelope: 
              - Decision: fixed threshold? or top-k? The problem doesn't specify. We assume fixed threshold for simplicity.
              - Outcome: presence of a housing hazard.
              - Group definition: say, by ethnicity (using a proxy variable).
              - Outcome observed only for inspected properties -> we have missing data for non-inspected.

          - Therefore, we cannot compute FPR without outcomes for non-inspected. 

          **Step 1: The claim is to equalise FPR. But we cannot compute FPR because of missing outcomes for non-inspected.**
              - So we must return: 'false positive rate cannot be computed because outcomes are missing for non-inspected properties; adjust claim or provide outcomes for entire population'.

          - However, the council might have defined "wrongly flagged" in a different way? For example, they might be using the model's output and define a "wrong flag" as a property that was flagged (selected) but turned out to be non-hazardous. That is, they might be concerned with the false discovery rate (FDR) = 1 - PPV.

          - But note: the statutory duty says "the rate at which each group is wrongly flagged". This could be interpreted as:
              - Option 1: Among the non-hazardous properties, what proportion are flagged? (FPR)
              - Option 2: Among the flagged properties, what proportion are non-hazardous? (FDR)

          - Without clarification, we must go by the exact wording. The problem says "wrongly flagged" meaning a flag that is wrong. So that would be a false positive. But the rate? The rate at which a group is wrongly flagged could be:
              - The probability that a non-hazardous property in that group is flagged (FPR) OR
              - The proportion of the group's flagged properties that are non-hazardous (FDR) OR
              - The proportion of the group's properties that are both flagged and non-hazardous? (This is the false positive proportion, which is not a rate in the usual sense.)

          - This ambiguity must be resolved. 

          **Therefore, we add a step:**

          **Step 0.5: Clarify the claims.**
              - For each commitment, we must map it to a precise mathematical definition.

          **For the council:**
              - The commitment is: equalise the rate at which each group is wrongly flagged.

              We must ask the council: 
                  - Rate with respect to what? 
                    - If it is the proportion of non-hazardous properties that are flagged (FPR), then we require outcomes for non-inspected to compute.
                    - If it is the proportion of flagged properties that are non-hazardous (FDR), then we can compute it with the inspected data.

              If they clarify FDR, then we can proceed. But note: FDR is not subject to the same incompatibility as FPR with calibration.

          **But note:** the problem says they are under a statutory duty to equalise that rate. We are not told how they interpret it. We must assume they have defined it. In the absence of clarification, we interpret "wrongly flagged" as a false positive event, and the rate as the conditional rate among the non-hazardous (FPR). That is the standard meaning.

          Therefore, we must flag that we cannot compute FPR without outcomes for non-inspected.

          However, the council might argue that they are only responsible for the properties they inspect, and they want the FPR to be equal in the entire population. But without data, we cannot verify.

          **Step 1 for council:**
              - Claim: equal FPR across groups.
              - Data: outcomes only for inspected -> cannot compute FPR.

              Return: 'cannot compute false positive rates without outcomes for non-inspected properties; adjust claim or provide outcomes for entire population'.

          **But note:** the council might have meant something else. We must be cautious.

  **Step 3: Handling multiple thresholds for the same score.**
     - If the same scores are used at two different thresholds by two units, then we must check the claims for each threshold separately.

     **Question: Are the claims made for a specific threshold?**
          - The body must specify for which threshold(s) the claims hold.

          - We then run the above procedure for each threshold.

  **Step 4: What the procedure cannot tell us.**
     - It cannot tell us which fairness criterion is best; that is a value choice.
     - It cannot adjust for measurement error in group labels (proxies) or outcome labels.
     - It cannot verify claims that require data we do not have (like entire population outcomes when we only have selected).
     - It cannot verify claims about causal fairness or counterfactual fairness.
     - It does not address whether the model is accurate or better than the previous process (unless that is part of the claim).

  **Summary of Decision Procedure:**

  1. **Record deployment envelope.**
  2. **Clarify the precise definitions of the fairness claims.**
  3. **Check for mutual exclusivity of claims:**
     a. If claims include entire population calibration and error rate balance (FPR and/or FNR) at the same threshold:
          i. If we have outcomes for entire population: 
              - Compute base rates for each group.
              - If base rates are not equal -> 'internally inconsistent claim — send back to the vendor'.
              - If base rates are equal -> proceed to Step 3b.
          ii. If we do not have outcomes for entire population:
              - If the calibration claim is for entire population -> 'entire population calibration cannot be verified without outcomes for non-selected; adjust claim or provide data'.
              - If the calibration claim is for the selected, then no incompatibility with error rates? But note: we still cannot compute error rates without entire population outcomes -> so we must flag that error rates cannot be computed.
     b. If claims include error rates (FPR or FNR) and we do not have outcomes for entire population -> 'error rates cannot be computed without outcomes for non-selected; adjust claim or provide data'.
  4. **If the claims are compatible and we have the necessary data, then compute the metrics and check if they hold.**
     - If they hold, then return 'holds under this envelope'.
     - If not, then return 'does not hold under this envelope; here are the observed discrepancies'.
  5. **For claims that are not mutually exclusive and we have data, we check each metric independently.**
  6. **If the same score is used at multiple thresholds, repeat the above for each threshold.**

  **Running the examples:**

  **Example 1: Tax authority**
     - Claims: calibration within groups, equal FPR, equal FNR.
     - We assume we have a validation sample that is a random sample of the entire population with outcomes for everyone.
     - Step 1: Check base rates. Suppose we find that base rates differ significantly (which is likely in tax fraud). 
          -> Return 'internally inconsistent claim because base rates differ and therefore calibration and error rate balance cannot hold simultaneously; send back to the vendor'.

  **Example 2: Council housing-inspection**
     - Claim: equal FPR across groups (statutory duty).
     - Deployment envelope: outcomes observed only for inspected (selected) cases.
     - Step 1: We cannot compute FPR without outcomes for non-inspected.
          -> Return 'false positive rates cannot be computed because outcomes are missing for non-inspected properties; adjust claim or provide outcomes for entire population'.

     But note: the council might not like this because they cannot easily get outcomes for non-inspected (it would require inspecting a random sample of non-inspected properties). 

     However, we note that the council might have intended a different interpretation (like equal FDR). We must clarify. If they clarify they meant FDR, then we can compute FDR on the inspected sample. But then we would check if the FDR is equal across groups. There is no inherent incompatibility with calibration, so we would then check the data we have (the inspected sample) and see if FDR is equal.

     But the problem says "the rate at which each group is wrongly flagged". If they interpret that as FDR, then we can compute it. But note: FDR is the proportion of false positives among the inspected. So we can compute:

          FDR_g = (number of false positives in group g) / (number of inspected in group g)

     We then check if FDR_g is the same for every group g.

     However, the problem states the base rates differ. That might lead to different FDR even if the model is well-calibrated. But the duty is to equalise FDR. We can check it without base rates.

     So we must clarify the claim. If they mean FDR, then we can compute it and check. If they do, and we find that FDR is not equal, then we return 'does not hold under this envelope: here are the FDRs by group'. 

     But if they mean FPR, we cannot check.

     Since the problem says they are under a statutory duty to equalise the rate of being wrongly flagged, and if the law intended FPR but we cannot measure it, then the council is in a bind. They might need to collect the data.

     **Therefore, we add a clarification step:**

          Step 0.5: Map the claim to a precise metric.

          For the council: ask for the precise definition of "the rate at which each group is wrongly flagged". 
          - If they say it is the false positive rate (FPR), then we require entire population outcomes.
          - If they say it is the false discovery rate (FDR), then we can use the inspected data.

          Without that, we cannot proceed.

     Given the problem statement, we assume that the council has committed to FPR (because that is the standard interpretation of fairness in terms of error rates). So we return that we cannot verify.

  **Closing: What the procedure cannot tell us:**
     - It cannot resolve ambiguities in the definition of fairness without the body's clarification.
     - It cannot verify claims without the necessary data.
     - It does not assess the quality of the proxy group labels.
     - It does not evaluate the model's accuracy or the business impact.
     - It does not address whether the chosen fairness criteria are appropriate for the context.

  **Final note:** The procedure is designed to check internal consistency and verifiability under the deployment envelope. It does not make value judgments.
answer: |-
  ### Decision Procedure for Fairness Claim Coherence in Risk-Scoring Systems

  **Step 0: Define the Deployment Envelope**  
  Record:  
  - **Decision rule**: Fixed threshold \( t \) or top-\( k \) selection.  
  - **Outcome**: Definition of "risk" (e.g., fraud, safety hazard).  
  - **Group definition**: Protected characteristic(s) (e.g., ethnicity, gender).  
  - **Outcome observability**: Observed for all cases (fully audited) or only for selected cases.  
  - **Time window**: Data collection period.  

  **Step 1: Clarify Fairness Claims**  
  Ask: *What specific fairness criteria has the public body committed to?*  
  - **Sufficient answer**: Explicit definitions (e.g., "calibration within groups", "equal FPR/FNR across groups").  
  - **Handling ambiguity**: Reject claims lacking mathematical precision (e.g., "treat all groups fairly").  
  - **Proxy labels**: Note potential measurement error but proceed—coherence checks are mathematical, not causal.  

  **Step 2: Check Mutual Exclusivity of Claims**  
  Ask: *Does the body claim both calibration within groups **and** equal error rates (FPR/FNR) across groups?*  
  - **Base rates required**: Compute \( P(Y=1 \vert G=g) \) for all groups \( g \).  
  - **Outcome observability handling**:  
    - If outcomes only for selected cases: **Halt**. Base rates cannot be computed. Flag: *"Claims require base rates; outcomes missing for non-selected cases. Cannot verify—adjust claim or provide full-population outcome data."*  
    - If outcomes for all: Proceed.  
  - **Decision logic**:  
    - If base rates differ significantly (\( \Delta > 5\% \)): **Return** *"Internally inconsistent claim—send back to vendor."* (By Impossibility Theorem: Calibration + equal error rates require equal base rates or perfect prediction.)  
    - If base rates equal: Proceed to Step 3.  

  **Step 3: Verify Feasibility Under Partial Observability**  
  Ask: *Can the claimed metrics be computed given outcome observability?*  
  - **Error rates (FPR/FNR)**: Require outcomes for **all** cases (selected and non-selected).  
    - If missing non-selected outcomes: **Return** *"FPR/FNR cannot be computed—outcomes missing for non-selected cases."*  
  - **Calibration within groups**:  
    - If claimed for **entire population**: Requires outcomes for all. **Return** *"Entire-population calibration unverifiable—provide full outcome data."*  
    - If claimed for **selected cases only**: Proceed to Step 4 (no conflict with error rates).  
  - **Equal PPV/NPV or FDR**: Computable with selected-case data only. Proceed.  

  **Step 4: Check Claim Validity Under Deployment**  
  Ask: *Do the claims hold for the planned deployment?*  
  - **Fixed threshold \( t \)**: Test metrics at threshold \( t \).  
  - **Top-\( k \)**: Test metrics at the score \( s_k \) where the \( k \)-th case is selected.  
  - **Multiple thresholds**: Test each threshold independently (e.g., Unit A uses \( t_1 \), Unit B uses \( t_2 \)).  
  - **Sufficient answer**: Metrics (e.g., FPR, calibration) must hold within statistical tolerance (e.g., 95% CI overlap).  
  - **Results**:  
    - Holds: **Return** *"Holds under this envelope."*  
    - Fails: **Return** *"Fails under this envelope—discrepancies: [e.g., FPR differs by X% between groups]."*  

  **Step 5: Handle Non-Exclusive Claims**  
  Ask: *Are claims mutually compatible but unverifiable due to data gaps?*  
  - **If yes**: **Return** *"Hand back to body—claims are value choices, but unverifiable without [missing data]."*  
  - **If claims are independent (e.g., calibration only)**: Verify with available data.  

  **What the Procedure Cannot Tell Us**:  
  1. **Value judgments**: Whether a chosen fairness criterion (e.g., FPR vs. FDR) is ethically appropriate.  
  2. **Proxy bias**: Impact of misclassified group labels (e.g., ethnicity inferred from name).  
  3. **Model performance**: Accuracy improvements over prior systems.  
  4. **Long-term effects**: Fairness dynamics beyond the recorded time window.  

  ---

  ### Application to Case Studies  

  **Case 1: Tax Authority’s Audit Selection Model**  
  - **Deployment envelope**: Fixed threshold \( t \); outcome = tax fraud; groups = ethnicity; outcomes only for audited cases.  
  - **Claims**: Calibration within groups + equal FPR/FNR across groups.  
  - **Procedure**:  
    1. **Step 1**: Claims include calibration + error rates.  
    2. **Step 2**: Base rates needed but uncomputable (outcomes missing for non-audited). **Result**: *"FPR/FNR cannot be computed—outcomes missing for non-selected cases. Entire-population calibration unverifiable."*  
    3. **Step 3**: Body must either:  
       - Provide full-population outcome data (e.g., via random audits).  
       - Revise claims (e.g., drop FPR/FNR; assert calibration only for audited cases).  
  - **Outcome**: **Return** *"Internally inconsistent claim—send back to vendor."* (Base rates likely differ; even with data, calibration + equal error rates are provably impossible.)  

  **Case 2: Council’s Housing-Inspection Model**  
  - **Deployment envelope**: Top-100 inspections/week; outcome = safety hazard; groups = tenure type (proxy for ethnicity); outcomes only for inspected properties.  
  - **Claims**: Statutory duty to equalise FPR across groups. Base rates confirmed to differ.  
  - **Procedure**:  
    1. **Step 1**: Claim is equal FPR.  
    2. **Step 3**: FPR requires outcomes for non-inspected properties (unknown). **Result**: *"FPR cannot be computed—outcomes missing for non-selected cases."*  
    3. **Clarification**: Council defines "wrongly flagged" as FPR (standard interpretation). No alternative claim (e.g., FDR) provided.  
    4. **Step 5**: **Return** *"Hand back to body—claim unverifiable without non-inspected outcome data. Statutory duty cannot be assessed."*  
  - **Council’s dilemma**:  
    - Option A: Inspect random non-flagged properties to estimate FPR (costly).  
    - Option B: Revise statutory interpretation to FDR (verifiable with inspected data) but may not satisfy legal intent.  
  - **Note**: Model outperforming prior process is irrelevant to coherence checks.  

  ---

  **Conclusion**  
  This procedure detects mathematical incoherence and data gaps in fairness claims but cannot resolve ethical trade-offs or proxy bias. For incomplete data, auditors must demand full-population outcomes or revised claims. The council’s case illustrates how statutory duties may founder on data limitations—forcing public bodies to confront measurement feasibility alongside fairness goals.
