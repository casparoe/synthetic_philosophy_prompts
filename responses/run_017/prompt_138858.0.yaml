  - What a trait explanation has to do.
  - What counts as an alternative to a selection hypothesis.
  - The cost of absence of a null model for either side.
  - What a by-product claim is a claim about.

  We also need to separate the adaptationist programme into at least three theses and identify which the critic rejects.

  The three theses for adaptationism:
  1. Optimality-default thesis: In the absence of specific evidence against, we should assume that traits are optimal.
  2. Trait-atomism/modular-decomposition thesis: Traits can be analyzed independently as adaptive units.
  3. Selection fraction thesis: A large fraction of fixed phenotypic differences among species are due to selection rather than drift or neutral processes.

  We must clarify which the critic rejects and which the adaptationist actually needs.

  Now, for the root-vole case, we need to specify predictions for:
  - Comparative allometry
  - Ontogenetic sequence
  - Fossil/phylogenetic ordering of the trait relative to the shift to head-lift digging
  - Experimental ablation or knock-down in the lab
  - Multivariate selection and G-matrix measurements in the field

  Also, we will use the "reachable set" vs. "optimum" framework.

  Let's draft the document section by section.
answer: |-
  ### Adversarial Collaboration Framework: Kavango Root-Voles Case Study  

  **Introduction**  
  This document outlines an adversarial collaboration between an adaptationist (emphasizing optimality modeling and reverse-engineering) and a structuralist critic (emphasizing developmental constraints and exaptation) regarding the origin of the bony atlas flange in Kavango root-voles. The goal is not to declare a winner but to pre-specify testable predictions and clarify disagreements. All claims and predictions are framed around an invented case: fourteen subterranean rodent species with a dorsally projecting atlas flange, developmentally coupled to temporalis muscle attachment. The flange is biomechanically optimized for head-lift digging in hard-soil species but persists, reduced, in soft-soil species that do not head-lift.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse these operational principles:  
  1. **Trait Explanation Requirement**: A complete explanation for a trait must account for its origin, maintenance, and variation across a clade.  
  2. **Alternative Hypotheses**: A non-selectionist alternative (e.g., constraint, by-product) must specify (i) a developmental/genetic mechanism and (ii) falsifiable conditions under which the trait arises without selection.  
  3. **By-Product Definition**: A by-product is a trait non-adaptive at origination, arising from developmental coupling to a selected trait (e.g., skull widening).  
  4. **Exaptation Definition**: A trait co-opted for a new function must show evidence of (i) non-utility in its original context and (ii) later selective refinement.  
  5. **Null Model Necessity**: Both sides require a null model (e.g., drift, allometry) to test against adaptive hypotheses; its absence invalidates claims of "optimality" or "constraint."  
  6. **Developmental Independence Test**: If experimental ablation of the flange disrupts only head-lift digging (not other functions), it supports functional specificity.  
  7. **Optimality as Hypothetical**: Engineering optima are theoretical benchmarks; deviation from optimum does not falsify adaptationism unless constraints are demonstrated.  
  8. **Phylogenetic Baseline**: Outgroups (lacking flanges) establish the ancestral state; any flange evolution post-dates the root-vole clade.  
  9. **Allometric Tracking**: Strong correlation between flange area and temporalis attachment area across species implies developmental integration.  
  10. **Selection vs. Drift**: A trait fixed in a clade requires evidence of selection if it exceeds neutral expectations (e.g., via Lande’s null model).  
  11. **Current Utility ≠ Origin**: Present biomechanical utility does not indicate historical adaptation (e.g., soft-soil flanges may be non-adaptive).  
  12. **Reachable Set Framework**: Phenotypes are bounded by a developmental "reachable set"; an engineering optimum inside this set permits direct adaptation, while one outside implies constraint.  
  13. **Quantitative Thresholds**: Statistical significance (p < 0.05) and effect sizes (e.g., η² > 0.25) define "strong" evidence for all predictions.  
  14. **Data Transparency**: All measurements (e.g., flange area, digging force) use calibrated, blind protocols (see Appendix).  

  ---

  ### 2. Disagreements Table  
  | Crux | Adaptationist Position | Critic Position | Measurement/Comparison | Adaptationist Prediction | Critic Prediction |  
  |------|------------------------|-----------------|------------------------|--------------------------|-------------------|  
  | **Flange origin relative to head-lift digging** | "The flange evolved *for* head-lift digging via directional selection." | "The flange originated as a by-product of skull widening and was later co-opted." | Fossil/phylogenetic ordering: Flange emergence vs. head-lift adaptation. | Flange appears *after* head-lift digging in hard-soil ancestors. | Flange appears *before or with* skull widening; head-lift digging evolves later. |  
  | **Ontogenetic priority** | "Functional demand precedes form: flange growth accelerates only in head-lift diggers during juvenile development." | "Developmentally coupled growth: flange growth parallels temporalis attachment regardless of digging behavior." | Ontogenetic allometry: Flange vs. temporalis growth rates in soft/hard-soil species. | Growth rates diverge in hard-soil species only during head-lift onset. | Growth rates covary in all species; no divergence in hard-soil juveniles. |  
  | **Experimental knockdown consequence** | "Flange ablation impairs head-lift digging efficiency but not forelimb digging." | "Flange ablation causes compensatory skull stress or reduced bite force, not specific to digging." | Lab experiment: Force efficiency (work/Joule) in head-lift vs. forelimb digging post-ablation. | >30% efficiency drop in head-lift digging; no change in forelimb digging. | <10% efficiency drop in head-lift; >20% bite force reduction across tasks. |  
  | **Optimum location** | "The flange’s lever-optimized shape in hard-soil species sits at the engineering optimum." | "The flange’s shape is suboptimal but developmentally constrained; optimum is outside the reachable set." | Multivariate selection: Selection gradient (β) on flange shape in hard-soil species. | Strong β (|β| > 0.5) toward lever-model optimum. | Weak β (|β| < 0.2); G-matrix shows flange shape variation aligned with skull allometry, not force transmission. |  
  | **Soft-soil flange retention** | "Persists due to low cost or stabilizing selection for ancestral function." | "Persists as an inert by-product; reduction due to relaxed selection." | Comparative allometry: Flange size vs. head-lift force in soft-soil species. | Flange size correlates with residual head-lift capacity (r > 0.6). | No correlation (r < 0.1); flange size scales with skull width (r > 0.7). |  

  ---

  ### 3. Closing: Verbal vs. Substantive Disputes  
  **Verbal Disputes**:  
  - "Adaptation" defined as *historical selection* (critic) vs. *current utility* (adaptationist). This is resolved by distinguishing "exaptation" (current utility ≠ origin) from "adaptation" (origin via selection).  
  - "Constraint" as *absolute barrier* (adaptationist) vs. *bias in variation* (critic). We operationalize this via the reachable set: if the optimum is inside, constraint is weak; if outside, deviation implies bias.  

  **Substantive Disputes**:  
  - **Developmental Independence**: Whether the flange can evolve independently of skull integration (tested via G-matrix).  
  - **Optimality Default**: Whether trait absence of "suboptimality" requires a constraint explanation (critic: yes; adaptationist: no, without evidence).  
  - **Selection Fraction**: Whether >50% of trait divergence is due to selection (adaptationist) or developmental bias (critic).  
  The core dispute is whether developmental coupling *explains* the flange’s origin (critic) or merely *channels* selection (adaptationist).  

  ---

  ### 4. Appendix: Root-Vole Audit Protocol  
  **Pre-Registered Measurement Sequence**  
  1. **Phylogenetic Ordering**:  
     - Sequence: Reconstruct ancestral states (parsimony + ML) for head-lift digging and flange presence.  
     - Pre-commit: Both sides accept flange-first or digging-first as decisive (see Disagreements Table).  
  2. **Ontogenetic Allometry**:  
     - Sequence: Measure flange/temporalis growth rates in 100+ juvenile specimens per species (micro-CT).  
     - Pre-commit: Adaptationist expects divergence in hard-soil species; critic expects covariance throughout.  
  3. **Experimental Ablation**:  
     - Sequence: Ablate flanges in 20 lab-reared adults per ecotype; measure digging/bite force. Controls: sham surgery.  
     - Pre-commit: Efficiency drop thresholds defined in Disagreements Table.  
  4. **Field Selection Analysis**:  
     - Sequence: Estimate selection gradients (β) on flange shape in 5 wild hard-soil populations (mark-recapture + force assays).  
     - Pre-commit: Adaptationist requires |β| > 0.5; critic accepts |β| < 0.2 as null.  
  5. **G-Matrix Estimation**:  
     - Sequence: Quantify genetic covariance between flange shape and skull traits via breeding experiments.  
     - Pre-commit: Strong integration (r > 0.6) supports critic; modularity (r < 0.3) supports adaptationist.  

  **Stopping Rule**:  
  Analysis halts when (a) ≥3 independent tests yield consistent results (e.g., all support critic), or (b) 2+ years of data collection are complete. Disputes unresolved by then are deemed empirically intractable.  

  ---  
  **Word Count**: 1,480  
  This document isolates testable claims, pre-specifies measurements, and demarcates resolvable disputes from semantic noise. Both parties commit to accepting outcomes meeting agreed thresholds.
