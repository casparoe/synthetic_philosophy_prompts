  1. Agreed Claims: 10-15 numbered, substantive, and operational claims.
  2. Disagreements Table: Columns: Crux, Adaptationist Position (in her words), Critic Position (in his words), Measurement/Comparison, Adaptationist Prediction, Critic Prediction.
  3. Closing Section: Distinguishing verbal from substantive disputes and clarifying which disputes remain.
  4. Appendix: Pre-registered audit protocol for the root-vole case.

  Word count: 1200-1600 words.

