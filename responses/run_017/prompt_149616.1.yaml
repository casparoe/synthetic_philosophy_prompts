answer: |-
  Here is a step-by-step evaluation procedure grounded in Surfaces & Essences, designed for a junior editor. It focuses on identifying potential slippage in meaning and unintended inferences.

  **Analogy Evaluation Procedure (10-Minute Protocol)**

  **Objective:** Determine if an analogy risks creating harmful or inaccurate patient understanding now or later.  
  **Input:** Target concept, Source analogy, Intended audience/context.  
  **Output:** Verdict (Cut / Keep with Guard Sentence / Keep) + Note for Clinical Lead.  
  **Time:** ~10 minutes per analogy.

  **Steps:**

  1.  **Map Explicitly (3 mins):**
      *   **Task:** Write out: "In this analogy, [Source Domain] is like [Target Domain] because..."
      *   **Slots:** List key elements mapped. Use a table if helpful:
          *   **Source Slot:** (e.g., Soldier)
          *   **Target Slot:** (e.g., Immune Cell)
          *   **Mapping Intent:** (e.g., Defensive role)
      *   **Open Slots:** Identify key elements *in the source domain* mentioned or strongly implied that *don't* have a defined target mapping (e.g., "General" in an army analogy, "Enemy Flag" in a war analogy). **Note:** This step is crucial. Open slots are where patient inference runs wild.
      *   *Judgment Call?* Identifying *all* relevant open slots requires careful thought about the source domain's common structure.

  2.  **Test Extrapolation (3 mins):**
      *   **Task:** Ask: "If the patient takes this analogy *literally*, what false or harmful conclusions might they draw **at each stage**?"
          *   **Horizon 1 (Now):** Immediately after reading the leaflet. (e.g., "If cancer is an invading army, then...")
          *   **Horizon 2 (Next Appointment):** When hearing related clinical terms. (e.g., Doctor mentions "remission" or "palliative care" - how does the analogy color this?)
          *   **Horizon 3 (Long Term):** Living with/chronic management of the condition. (e.g., "If chemo is bombing the battlefield (my body)...")
      *   **Focus:** Look for predictions about mechanism, cause/effect, patient role, responsibility, or outcome that are untrue or counter-therapeutic. Flag any slippage where the source domain's logic leads away from medical reality.

  3.  **Identify the Analogy's Work (1 min):**
      *   **Task:** Ask: "What *essential understanding* is this analogy carrying?"
          *   **(A) Causal/Mechanistic Structure:** Explaining *how* something physically works or happens (e.g., filter clogging -> waste backup). *This is the core goal for most medical concepts.*
          *   **(B) Abstract Feeling/Value:** Conveying scale, importance, urgency, or a desired attitude (e.g., "This is a serious threat, be vigilant"). *Useful, but secondary.*
      *   **Note:** If the answer is primarily (B), flag it for the clinical lead to explicitly justify why *this feeling* is necessary for patient care/decision-making in this context.

  4.  **Check Cultural Access (1 min):**
      *   **Task:** Ask: "Could key elements of the source domain (objects, activities, idioms) be unfamiliar or non-existent for a significant portion of our audience (esp. Hmong/limited English/Spanish speakers, rural/urban differences, generational gaps)?"
      *   **Note:** If YES, flag as a major risk. **Limitation:** Cannot *confirm* familiarity without testing, only identify obvious potential barriers.

  5.  **Assess Emotional Tone (1 min):**
      *   **Task:** Ask: "Does the emotional resonance of the source domain (e.g., war=violence/fear, army=discipline/conflict, filter=mundane/fixable) contradict the intended clinical message or coping strategy (e.g., acceptance, partnership, chronic management, palliation)?"
      *   *Judgment Call?* Assessing "contradiction" requires considering the overall leaflet tone and clinical goals.

  6.  **Verdict & Note (1 min):**
      *   **CUT:** If *any* extrapolation test (Step 2) reveals a likely harmful/misleading inference at *any* horizon that cannot be easily corrected, OR if cultural access is severely compromised (Step 4), OR if the core work (Step 3) is purely emotional and unjustifiable for the concept.
      *   **KEEP WITH GUARD SENTENCE:** If the analogy is useful *but* has significant open slots (Step 1) or risky extrapolations (Step 2), or a strong emotional tone needing mitigation (Step 5). The guard sentence *must directly address* the specific risk identified (e.g., naming an open slot limitation).
      *   **KEEP:** Only if mapping is clear, essential for core understanding (Step 3), extrapolation tests show minimal risk, cultural access is likely broad, and emotional tone aligns. *Rare for complex concepts.*
      *   **Note for Clinical Lead:** Be concise. State: 1) Core mapping & key open slots. 2) Most concerning extrapolation risk (specify horizon). 3) Core work of the analogy. 4) Verdict reason. 5) If "Keep w/ Guard", propose the guard sentence.

  **Procedure Limitations:**
  1.  **Cannot verify source domain familiarity:** Only flags *potential* cultural access issues (Step 4 requires real testing).
  2.  **Cannot choose between valid analogies:** If two pass, the choice is editorial/clinical preference.
  3.  **Judgment Calls:** Steps 1 (Open Slots), 2 (Significance of Extrapolation), and 5 (Emotional Contradiction) involve editorial judgment. The procedure structures the thinking but doesn't eliminate subjectivity.

  ---

  **Evaluation of Test Cases**

  **Case 1: Cancer as War/Battlefield (Chemo=Attack, Patient=Fighting)**
  1.  **Map:**
      *   Source Slot: Enemy -> Target Slot: Cancer Cells (Mapping: Malignant force)
      *   Source Slot: Soldiers/Troops -> Target Slot: Immune Cells? Patient? (Mapping: Defenders/Fighters) *Ambiguous!*
      *   Source Slot: Weapons (Chemo/Radiation) -> Target Slot: Treatments (Mapping: Offensive tools)
      *   Source Slot: Battlefield -> Target Slot: Patient's Body (Mapping: Site of conflict)
      *   Source Slot: General -> Target Slot: Doctor? Patient? (Mapping: Commander) *Open Slot!*
      *   Source Slot: Victory/Defeat -> Target Slot: Cure/Death (Mapping: Outcome) *Oversimplified!*
      *   **Open Slots:** General, Surrender, Retreat, Collateral Damage, Traitor (mutated cells?), Enemy Strategy, Morale.
  2.  **Extrapolation Test:**
      *   **H1 (Now):** Patient is *solely responsible* for "fighting" (willpower=morale). "Losing" battle = personal failure. Body is a warzone (inherently damaged). Treatment is indiscriminate attack.
      *   **H2 (Next Appt):** Hearing "palliative care" = "surrender". "Recurrence" = "enemy reinforcements". Doctor suggests stopping treatment = "retreat/desertion".
      *   **H3 (Long Term):** Living with chronic cancer = "trench warfare/endless conflict". Side effects = "collateral damage" (inevitable, acceptable destruction). Death = "defeat" (failure).
  3.  **Work:** Primarily conveys urgency and agency (B: Feeling), but dangerously frames mechanism (A: Causal - patient action central, treatment destructive).
  4.  **Cultural Access:** "War" concepts vary, but core conflict structure is widely understood. Idioms ("fight", "battle") are common but problematic.
  5.  **Emotional Tone:** Aggressive, adversarial, fear-based. Contradicts messages of acceptance, quality of life, partnership, palliative care, and the biological reality of cancer as *part* of the self.
  6.  **Verdict:** **CUT** (Verdict you won't like)
      *   **Note for Clinical Lead:** "Dr. [Name], the 'cancer as war' analogy maps cancer to an enemy and the patient to a fighter. Key open slots include 'General' (who commands?), 'Surrender' (palliative care?), 'Collateral Damage' (side effects?). Extrapolation risks are severe: patients infer personal failure if treatment fails (H1), interpret palliative care as surrender (H2), and see chronic cancer as endless, destructive conflict (H3). While it conveys urgency, the core causal framing (patient as active combatant, body as battleground, treatment as attack) is biologically misleading and psychologically harmful, especially contradicting palliative messaging. Guard sentences cannot mitigate these deep structural risks. Recommend replacing with an analogy focused on *management* or *repair* (e.g., complex system maintenance, weed control requiring multiple strategies)."

  **Case 2: Immune System as Army (Immunotherapy = Reinforcements / Taking Brakes Off)**
  1.  **Map:**
      *   Source Slot: Army -> Target Slot: Immune System (Mapping: Defense force)
      *   Source Slot: Soldiers -> Target Slot: Immune Cells (T-cells, etc.) (Mapping: Defenders)
      *   Source Slot: Enemy -> Target Slot: Pathogens/Cancer Cells (Mapping: Threat)
      *   Source Slot: Reinforcements -> Target Slot: (Some Immunotherapies, e.g., CAR-T) (Mapping: Boosting numbers) *Specific subset!*
      *   Source Slot: Brakes (Off) -> Target Slot: (Checkpoint Inhibitors) (Mapping: Removing inhibition) *Specific mechanism!*
      *   **Open Slots:** Commander, Weapons, Strategy, Base Camp (bone marrow?), Friendly Fire (Autoimmunity), Deserters (exhausted cells?), Rules of Engagement.
  2.  **Extrapolation Test:**
      *   **H1 (Now):** "Army" implies centralized control (false). "Reinforcements/brakes" might be confused (not all IO works this way). Immune system as *separate* standing army.
      *   **H2 (Next Appt):** Hearing about immunotherapy side effects (e.g., autoimmunity) = "Friendly fire". Lack of response = "Army is weak/lost".
      *   **H3 (Long Term):** Chronic immune activation (e.g., in autoimmunity post-IO) = "Army running amok". Immune memory = "Veterans?".
  3.  **Work:** Carries core causal structure (A: Defensive role, boosting/activating) *reasonably well* for the specific mechanisms mentioned, but oversimplifies system complexity and control.
  4.  **Cultural Access:** "Army" is widely understood. "Taking the brakes off" idiom might need simpler phrasing in translation ("letting go of the brakes").
  5.  **Emotional Tone:** Organized, protective (positive), but implies conflict. Aligns with defense, less adversarial than "war".
  6.  **Verdict:** **KEEP WITH GUARD SENTENCE**
      *   **Guard Sentence:** "Remember, your immune system isn't a separate army with a commander; it's a complex network of cells within your body. Immunotherapy helps this network work better, but it doesn't involve soldiers or weapons."
      *   **Note for Clinical Lead:** "Dr. [Name], the 'immune system as army' analogy effectively conveys the defensive role and core mechanisms of *some* immunotherapies (boosting numbers, removing inhibition). Key open slots include 'Commander' and 'Friendly Fire' (autoimmunity). Risks include oversimplifying the immune system's decentralized nature (H1) and misinterpreting side effects as 'friendly fire' (H2). Recommend keeping for its mechanistic value but adding a guard sentence explicitly addressing the lack of central command and reframing autoimmunity risk. Ensure translations clarify 'taking the brakes off'."

  **Case 3: Kidneys as Coffee Filter (Clogged = Waste Backup in Blood - CKD)**
  1.  **Map:**
      *   Source Slot: Coffee Filter -> Target Slot: Kidneys (Mapping: Filtration device)
      *   Source Slot: Coffee Grounds/Waste -> Target Slot: Metabolic Waste (e.g., Creatinine, Urea) (Mapping: Unwanted material to remove)
      *   Source Slot: Clean Coffee -> Target Slot: Cleaned Blood (Mapping: Desired output)
      *   Source Slot: Clogged Filter -> Target Slot: Impaired Kidney Function (Mapping: Cause of failure)
      *   Source Slot: Backed-up Coffee/Waste -> Target Slot: Buildup of Waste in Blood (Mapping: Consequence)
      *   **Open Slots:** Water Pressure (Blood pressure?), Filter Material (Kidney tissue?), Replacing the Filter (Transplant/Dialysis? - implied solution?).
  2.  **Extrapolation Test:**
      *   **H1 (Now):** Kidneys are *passive* mechanical filters (oversimplifies active processes). Clogging is the *only* problem (ignores other CKD causes like vascular damage).
      *   **H2 (Next Appt):** Hearing about blood pressure meds for CKD -> "Is this fixing the water pressure?" (Plausible link!). Dialysis = "Replacing the filter?" (Partial, but imperfect).
      *   **H3 (Long Term):** Managing CKD = "Unclogging the filter?" (False - focuses on symptom/waste management, not repairing the 'filter'). Progression = "Filter getting worse" (Okay).
  3.  **Work:** Carries core causal structure (A: Filtration function, consequence of failure) very effectively for the *symptom* (waste buildup).
  4.  **Cultural Access:** "Coffee filter" is common in US culture. Verify familiarity in Hmong/Spanish translations (may need alternative like "strainer" or "sieve" if problematic).
  5.  **Emotional Tone:** Mundane, mechanical, fixable (neutral/positive). Aligns with management, repair, and understanding a key symptom.
  6.  **Verdict:** **KEEP WITH GUARD SENTENCE** (Verdit you might find acceptable, but guard needed)
      *   **Guard Sentence:** "While kidneys work like a filter to clean waste from your blood, they are complex living parts, not simple machines. Damage can happen in different ways, not just 'clogging'."
      *   **Note for Clinical Lead:** "Dr. [Name], the 'kidneys as coffee filter' analogy effectively explains the core filtration function and the direct consequence of failure (waste buildup in blood - H1). Key open slot: 'Replacing the filter' (transplant/dialysis). Risks: Oversimplifying kidneys as passive/mechanical (H1) and implying clogging is the *only* cause of CKD (H1/H3), ignoring factors like blood vessel damage. Recommend keeping for its clarity on filtration but adding a guard sentence acknowledging kidney complexity and multiple causes of damage."

  This procedure forces explicit analysis of the analogy's structure, potential for harmful inference over time, and alignment with clinical goals, providing concrete grounds for editorial decisions beyond "patients like it."
