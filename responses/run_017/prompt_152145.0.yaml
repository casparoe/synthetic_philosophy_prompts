prompt: |-
  hey, hoping you can settle an argument I keep having with a friend. She runs a tiny repertory film-and-lecture series, so she's always deciding whether to show work by people who did bad things, and she'll also just flat out say whether she thinks the thing is still any good. Her rulings so far, as best I can recall:

  - a 1930s studio comedy whose lead was privately a raging antisemite, politics nowhere in the film: screen it, still a great film, no asterisk.
  - a 70s art film where the director pressured a young actress into a scene during the shoot and that scene is the one everybody praises: not screening it, and she says it can't be appreciated innocently once you know.
  - a landscape painting bought with money from a fraud the painter ran on the side, painting has nothing to do with the fraud: still a good painting, hang it wherever.
  - a novel that lifts whole passages from a friend's unpublished manuscript, and the lifted bits are the best writing in the book: still a good novel, but it isn't his novel, she'd only do a reading if the program note said so.
  - a living sculptor with a big museum retrospective who years ago trashed a rival's studio; the work is abstract and unrelated: she went to the show, she'd screen a documentary about the work, but she won't pay him a fee or let him do a live intro.

  Now the new one. A novel from 1962 that basically everyone agrees is a masterpiece. Letters have surfaced showing the author got the material for it by manipulating her younger sister over several years, drawing out her confidences and then building the book's central scene out of the sister's worst humiliation, with names and details changed so thoroughly that nobody, including the family, can spot it. The sister is alive, ninety-ish, and said in an interview that she finds the book's fame a continuation of the betrayal and doesn't want it celebrated. Author died in 1970; the royalties now fund a foundation that gives scholarships in the author's name.

  What's my friend going to say: is it still a great novel, and would she build an evening around it? I care less about the verdict than about which rule she's actually running, because I think at least three fit her track record equally well and come apart right here: value only takes a hit when the flaw shows up in the work or in what appreciating it requires; or value takes a hit when the work is partly made out of the wrong; or value itself never moves at all and only the present-tense relations are up for criticism, who profits and who gets hurt by the celebration. Tell me which you think she's on, what each rule predicts here, and if her record really does underdetermine it, name the one further case you'd put to her to split them. My guess is a case with the betrayal left intact but the sister long dead and no objection on record, but say if that's the wrong probe. Also: is the scholarship money doing any real work here, or is that a red herring?
reasoning: |-
  Okay, let me try to unpack this user's query. They have a friend who runs a film-and-lecture series and has to decide whether to show works by people who did bad things. The user provided several examples of past decisions and now wants to know how the friend would rule on a new case involving a 1962 novel. The author manipulated her sister to get material for the book, and the sister, now in her nineties, feels betrayed and doesn't want it celebrated. The user is less interested in the verdict and more in understanding the underlying rule the friend uses, as they think three possible rules fit the past decisions but might diverge here.

  First, I need to recall the friend's past rulings. The antisemitic actor's comedy was screened because the politics weren't in the film. The '70s art film wasn't screened because the problematic scene is integral to the film's praise. The fraud-funded painting was displayed since the fraud wasn't related. The plagiarized novel was considered good but with attribution. The sculptor's work was engaged with but without paying him. 

  The user suggests three possible rules: 1) value diminishes only if the flaw is in the work or its appreciation; 2) value is affected if the work is made from wrongdoing; 3) value remains, but current actions (like profits) are critiqued. 

  For the new case, the novel's content comes from betraying the sister, which is central to the work but not visible. The sister is alive and objects. The scholarships add complexity. 

  Looking at past decisions, the '70s film was rejected because appreciating it requires engaging with the exploitation. The plagiarized novel required attribution because the stolen parts were the best. Here, the betrayal is the foundation of the work, even if not visible. The sister's objection might push the friend towards not celebrating it, similar to not paying the sculptor or attributing plagiarism. The scholarships might not offset the harm to the sister. 

  The user's probe about a dead sister with no objection could test if the rule is about current harm or inherent wrong. If the sister were dead, maybe the friend would screen it with attribution, aligning with the plagiarism case. But if the betrayal is integral, even then it might be rejected. 

  The scholarships are likely a red herring because the harm to the sister is ongoing, and the foundation's benefits don't negate her suffering. The friend seems focused on the act's relation to the work and present consequences. 

  So, the friend's likely verdict is not to celebrate the novel, based on the work being made from wrongdoing and the current harm to the sister. The key rule is that value is compromised when the work's creation involves exploitation that's central to it, especially with ongoing harm.
answer: |-
  Based on your friend's track record and the principles it reveals, here's the breakdown for the 1962 novel case:

  **Your Friend's Likely Verdict:**
  1.  **Is it still a great novel?** Probably **YES**. She consistently separates the work's inherent qualities from the creator's unrelated sins (antisemitic actor, fraudster painter, violent sculptor) or even *related* sins that don't taint the *appreciation* of the final product (plagiarized novel *is* good, just not solely his).
  2.  **Would she build an evening around it?** Almost certainly **NO**. The presence of the living, harmed sister who explicitly objects to its celebration is the decisive factor. This aligns most strongly with her refusal to screen the '70s art film (where appreciating the key scene *requires* participating in the harm) and her refusal to pay the sculptor (acknowledging the work's value while refusing to *directly* benefit the perpetrator). The scholarship money is likely a **red herring** – it doesn't erase the sister's harm or her specific objection.

  **The Rules & Their Predictions:**
  Your analysis of the potential rules is spot-on. Here's how each would predict her decision on the novel, and why her track record makes them hard to distinguish *until* this case:

  1.  **Flaw-in-Work/Appreciation Rule:** Value suffers *only* if the moral flaw is visible *in the work itself* or if *appreciating the work requires complicity* in the wrong.
      *   *Prediction for Novel:* **Screen it.** The betrayal isn't visible in the text; names/details are changed. Appreciating the novel *as a novel* doesn't inherently require knowing or endorsing the betrayal. (Matches: Studio Comedy, Fraud Painting).
      *   *Problem:* Doesn't fully explain her refusal to screen the '70s film (where appreciating the *scene* requires complicity) OR her need for attribution in the plagiarism case (where the flaw *is* visible in the work but doesn't destroy its value).

  2.  **Work-Made-of-Wrong Rule:** Value suffers if the work is *significantly constituted by* or *derived from* an unethical act, even if the act isn't visible in the final product.
      *   *Prediction for Novel:* **Don't screen it, or screen with major caveats.** The novel's core scene/power *is* directly built from the unethical manipulation and betrayal of the sister. It *is* "made out of the wrong." (Matches: '70s Film - the scene *is* the wrong; Plagiarism - the best parts *are* stolen).
      *   *Problem:* Doesn't cleanly explain the Fraud Painting or the Sculptor's retrospective (the money/act is unrelated to the *substance* of the work).

  3.  **Present-Tense Relations Rule:** The work's inherent value is immutable. What matters is the *present-day ethical consequences* of celebrating it: who is harmed *now*, who benefits *now*, what relationships are affected *now*.
      *   *Prediction for Novel:* **Don't screen it.** Celebrating it *now* directly harms the living sister (continuing the betrayal) and benefits the author's foundation/legacy. The sculptor case shows she cares about *who profits now* (she won't pay *him*). The plagiarism case shows she cares about *attribution now* (correcting the relationship).
      *   *Problem:* Doesn't explain the refusal to screen the '70s film *if* the actress wasn't objecting *now* (though the harm *is* inherent in the appreciation). Might be too lenient on truly historical wrongs where victims aren't present.

  **Why the Novel Case Splits Them & Your Friend's Likely Rule:**

  *   **Flaw-in-Work Rule** would say **Screen it** (invisible flaw).
  *   **Work-Made-of-Wrong Rule** would say **Don't Screen it** (constituted by betrayal).
  *   **Present-Tense Relations Rule** would say **Don't Screen it** (harms sister now).

  Your friend's *consistent* focus seems to be on the **connection between the wrong and the work's creation/appreciation, combined with present-tense harm or benefit.**

  *   **'70s Film:** Wrong *is* the work/appreciation (No Screen).
  *   **Plagiarism:** Wrong *is* part of the work (Value YES, but Attribution Required).
  *   **Sculptor:** Wrong *unrelated* to work (Engage YES, but Don't Pay *Him*).
  *   **Novel Case:** The betrayal is **foundational to the work's creation** (like the plagiarism/'70s film) AND celebrating it **harms the victim directly *now*** (like paying the sculptor would benefit him, but much worse). This combination makes a "No Celebration" verdict highly likely.

  **Your Probe: The Dead Sister Scenario**

  Your probe (betrayal intact, sister long dead, no objection on record) is **excellent** for splitting the rules:

  1.  **Flaw-in-Work Rule:** **Screen it.** Harm not visible, appreciation not complicit.
  2.  **Work-Made-of-Wrong Rule:** **Likely Don't Screen it or Screen with Major Caveats.** The work is still fundamentally constituted by the unethical act, even if the victim isn't here to object. (This aligns with how we might view art built on historical exploitation).
  3.  **Present-Tense Relations Rule:** **Screen it.** No *current* harm to an identifiable victim. Benefits to scholarship might even be a net positive.

  **Based on her track record, I suspect your friend leans most heavily towards a hybrid of Rule 2 (Work-Made-of-Wrong) and Rule 3 (Present-Tense Relations), with Rule 1 (Flaw-in-Work) being necessary but not sufficient.** The *source* of the work's power/value matters to her, *especially* if that source involves harm, and she's acutely sensitive to *current* consequences of celebration (harm, benefit, attribution). The **scholarship money is a red herring** because the *direct, current harm to the sister* outweighs any abstract good done by the foundation in her view (just as the sculptor's work's value didn't outweigh the wrong of paying *him*).

  **Therefore, Prediction:** Your friend will say the novel is still a great novel (inherent value remains), but she **would NOT build an evening around it** because celebrating it requires celebrating an act of profound, foundational betrayal against a living victim who explicitly objects. The work is intrinsically linked to its unethical origin, and celebrating it perpetuates the harm *now*.
