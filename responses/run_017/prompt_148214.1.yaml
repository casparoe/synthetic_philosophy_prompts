prompt: |-
  I'm in the final year of a PhD in philosophy (decision theory and social choice, with a side interest in global priorities research), and I've been asked to write an internal agenda memo for a small foundation that funds work on how to prioritize causes. They have roughly one postdoc-year of conceptual work to allocate over the next two years — call it four short commissioned papers, or one junior researcher's year — and the question put to me is this: which unresolved conceptual questions about cause prioritization itself should a funder commission work on, and in what order? The counterfactual matters, because I have to be able to say why a conceptual question deserves a slot: the alternative use of the same money is another round of empirical reports on particular cause areas.

  What I do not want is a survey of the literature or a catalogue of the familiar objections. I already know the standard list: that the importance, tractability, and neglectedness factors are supposed to combine multiplicatively, and that little has been said about why that combination rule is the right one; that tractability and neglectedness both look like ways of getting at marginal returns and may therefore double-count; that the framework is silent about the units in which each factor is measured and about how those units are traded off against one another; that it scores causes one at a time and so says nothing about portfolios, sequencing, or complementarities between causes; and that it yields a ranking without yielding a size, telling you which cause is best but not how much of a fixed budget to commit to it. Assume all of that is on the table. What I want is a defended ordering of a subset of these questions, plus questions I have not listed, with the ordering argued for rather than asserted.

  Three half-formed thoughts of my own, which I would like ranked against the others or dismissed outright:

  First, a granularity worry. The score a cause receives seems to depend on how finely the space of causes is carved up: subdividing a cause can make each part look more neglected and less tractable without anything changing in the world, which suggests the framework has no principled level of application. Is this a genuine defect or a confusion about what the framework is for, and is settling it upstream of the double-counting worry?

  Second, a shape-of-the-return-curve worry. If we treat value produced in a cause as a function of resources devoted to it, the three factors look like a local, first-order summary of that function. But the questions people actually use the framework to answer concern how much to fund, and those may depend on the global shape of the curve — thresholds, lumpiness, regions of increasing returns — which a local summary discards. Is the worthwhile project here repairing the framework or replacing it with something like an explicit funding-return curve, and which of the standard objections would then simply evaporate?

  Third, a reading worry: whether the framework is best understood as a claim about what makes a cause a good one in the first place, or as a heuristic for allocating a fixed budget under severe uncertainty. My suspicion is that several of the standard disputes are really disputes between these two readings, and that separating them dissolves some apparent problems while making others considerably harder.

  For each of the four or five questions you put at the top, I want: what it is upstream of, in the sense that settling it would change the answer to other questions or change an actual allocation decision; who could settle it within the budget, given that a philosopher working alone is a different prospect from a project needing empirical input the funder is not buying; what an unexciting answer would look like, since conceptual work often resolves a question in a way that leaves practice untouched; and what argument or evidence in the next two years should move it up or down the list. I also want you to name two or three items on the standard list you would defund, with the reason — effectively settled already, too dependent on empirical contingencies to reward a conceptual paper, or simply not decision-relevant — and to flag where my three thoughts above are confused rather than merely underdeveloped.

  One methodological point I want addressed rather than set aside. This whole exercise applies something very like the framework to the question of which questions about the framework to fund: importance for whom, tractability given what background, neglectedness measured against which population of researchers. If the framework cannot be applied reflexively without circularity, say so, and tell me what to use instead for the ordering. Please do not include a bibliography or reading list; I will fill in citations myself.
reasoning: |-
  Hmm, this is a fascinating challenge from a PhD candidate in philosophy specializing in decision theory and social choice. They're crafting a funding agenda for cause prioritization research and need to prioritize conceptual questions over empirical work. The user has clearly done their homework—they've listed standard objections to the ITN framework (Importance, Tractability, Neglectedness) and shared three half-formed thoughts of their own. 

  The core tension here is between fixing a flawed framework versus building something new. The user wants concrete priorities, not literature surveys, and emphasizes counterfactual impact—why fund this conceptual work instead of another empirical report? They're also wrestling with methodological self-reference: using ITN to evaluate ITN research feels circular. 

  Their three personal concerns resonate: granularity (does cause-splitting distort scores?), return curves (does local ITN miss global funding dynamics?), and interpretive ambiguity (is ITN ontological or heuristic?). I notice they're particularly anxious about whether these are genuine defects or just philosophical confusions—classic PhD overthinking, but also vital rigor. 

  For the response structure, I'll need to: (1) rank 4-5 questions by urgency, (2) kill some sacred cows (which standard objections are settled?), (3) diagnose their three worries, and (4) resolve the reflexivity paradox. The ranking must show what each question unlocks downstream—e.g., solving the units problem might make portfolio allocation possible. 

  Key realizations: The granularity issue isn't just technical—it exposes ITN's incoherence under cause-redescription, making it upstream of everything. The return-curve question could obsolete half the standard objections if answered well. Their interpretive worry is astute: many "flaws" vanish if ITN is framed as a heuristic under uncertainty. 

  I'll deprioritize multiplicative combination debates (somewhat settled) and double-counting (often empirical). For reflexivity, I'll propose a three-layer meta-framework separating epistemic from practical questions. The user's PhD instincts are sharp—their third thought about interpretive ambiguity is actually the skeleton key to the whole memo.
answer: |-
  Here’s a prioritized agenda for conceptual work on cause prioritization, designed for maximal counterfactual impact per unit of funding. The ranking balances **decision-relevance**, **tractability**, **neglectedness**, and **upstream influence**—applying a meta-framework that avoids circularity by separating epistemic progress from practical allocation (detailed in the methodology section).

  ### Top 4 Questions to Fund (Ranked)
  1. **Question: What is the correct *level of granularity* for defining "causes," and how does mis-specification distort ITN scores?**  
     - **Why upstream?** Affects *every application* of the framework. If cause definitions are arbitrary, all scores are unstable. Resolving this clarifies whether ITN is fundamentally flawed or requires operational constraints.  
     - **Who could settle it?** A philosopher + decision theorist (no empirical input needed). Focus on formalizing cause boundaries (e.g., coarse-graining vs. fine-graining in option space).  
     - **Unexciting answer:** "Causes should align with natural intervention points" (requires defining "natural," which may not help).  
     - **Move up/down:** If empirical work reveals consistent cause-carving practices in effective orgs, deprioritize. If foundational (e.g., shows ITN is metric-dependent), escalate.  
     - **Your thought:** Not confused—**core defect**. Granularity isn’t just "upstream" of double-counting; it undermines *all* comparative scoring.  

  2. **Question: Should ITN be replaced by explicit *funding-return curves* (FRCs) that model marginal returns globally, and how would this change funding decisions?**  
     - **Why upstream?** Addresses portfolio allocation, optimal scale, and interactions between causes—directly tackling the "ranking without size" and "complementarities" gaps.  
     - **Who could settle it?** Economist + philosopher (simulation-based; minimal empirics). Compare ITN vs. FRCs in toy models with thresholds/diminishing returns.  
     - **Unexciting answer:** "FRCs are better but too hard to estimate" (reinforces status quo).  
     - **Move up/down:** If FRCs prove tractable in stylized cases (e.g., climate interventions), prioritize. If abstract models show ITN heuristically approximates FRCs, deprioritize.  
     - **Your thought:** **Replacement > repair**. This dissolves 3+ standard objections (ignored curve shape, portfolio blindness, sizing failure).  

  3. **Question: Is ITN best interpreted as a *heuristic for uncertainty* or an *ontological claim* about cause quality?**  
     - **Why upstream?** Determines which objections matter. If heuristic, "double-counting" may be irrelevant (pragmatic tradeoffs trump consistency); if ontological, unit consistency is essential.  
     - **Who could settle it?** Philosopher of science (conceptual analysis of EA texts + decision theory).  
     - **Unexciting answer:** "It’s context-dependent" (no guidance).  
     - **Move up/down:** If major funders adopt one interpretation, follow-up with operational guidelines.  
     - **Your thought:** **Crucial distinction**. Resolves disputes about unit tradeoffs and double-counting—if heuristic, these are features, not bugs.  

  4. **Question: How should *interactions between causes* (synergies/antagonisms) be incorporated into prioritization?**  
     - **Why upstream?** Untreated interactions risk catastrophic misallocation (e.g., funding competing policies).  
     - **Who could settle it?** Complexity scientist + philosopher (network models of cause interdependencies).  
     - **Unexciting answer:** "Interactions exist but are too chaotic to model" (status quo).  
     - **Move up/down:** If AI alignment or pandemic prevention reveals tractable interaction patterns, escalate.  

  ### Defund These Standard Questions
  - **"Why multiplicative combination?"**  
    *Reason:* Relatively settled. Multiplicative rules arise naturally from separable value functions (standard in welfare economics). Further work is diminishing returns.  
  - **"Do tractability/neglectedness double-count?"**  
    *Reason:* Primarily empirical. Double-counting depends on local context (e.g., whether "neglectedness" proxies low-hanging fruit). Conceptual papers won’t resolve this.  

  ### Methodological Reflexivity
  - **Problem:** Applying ITN to ITN research *is* circular if "importance" presupposes the framework’s validity.  
  - **Solution:** Use a **three-axis meta-framework** for ranking questions:  
    1. **Epistemic leverage:** How many downstream problems does this clarify? (Granularity > interpretation > interactions > FRCs).  
    2. **Tractability:** Feasibility of progress in 2 years (interpretation > granularity > FRCs > interactions).  
    3. **Neglectedness:** Attention relative to impact (FRCs > granularity > interpretation > interactions).  
  - This avoids circularity by assessing *knowledge gains*, not cause quality.  

  ### Recommended Sequencing  
  1. **Months 1–6:** Granularity (sets cause definitions for all later work).  
  2. **Months 7–12:** Interpretation (determines which objections are valid).  
  3. **Months 13–18:** FRCs (builds on granularity + interpretation).  
  4. **Months 19–24:** Interactions (requires FRCs/modeling foundation).  

  ### Why This Outcompetes Empirical Reports  
  Conceptual clarity here multiplies the value of *all future empirical work*. Without resolving granularity or interpretation, empirical scores are unmoored; without FRCs, funding allocations are guesswork. This is leverage: fix the engine, not the headlights.
