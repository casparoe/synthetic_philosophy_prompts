answer: |-
  ## Address: The Sentence the Situation Calls For

  Good morning. We’re gathered to talk about fiction and truth. Two words that spark immediate friction. For many here, ‘truth’ feels solid, foundational – something fiction might reach *towards*, perhaps even grasp more deeply than mere facts. For others, ‘truth’ is a surprisingly simple, even quiet, notion: saying “it’s true that snow is white” is just a different way of saying “snow is white.” It adds no profound extra layer. No hidden essence. This view – deflationism – suggests truth isn’t a *thing* we discover, but a *tool* we use in our language games.

  So, where does that leave the novelist? If calling a sentence “true” adds no deep metaphysical weight, what *does* fiction offer? If it’s not securing a special property called ‘Truth’, what’s its power?

  I propose we shift our gaze. Forget the elusive property. Focus instead on the *sentence*. What fiction at its best provides isn't ‘Truth’ with a capital T, but the **sentence the situation calls for**. Not a sentence that *corresponds* to some hidden reality, but a sentence that *resonates* with the human condition it depicts. A sentence that feels *necessary*, *inescapable*, within the world the novel builds.

  Think of it as precision, not profundity. Accuracy within a constructed frame. Imagine a character facing a devastating choice. The novelist’s task isn’t to assert a universal moral truth about that choice. It’s to find the precise description – the sentence – that makes the weight, the agony, the flawed reasoning of that character utterly palpable *to the reader*. That sentence might be messy, contradictory, biased – but it is the *exact* linguistic expression demanded by the fictional moment. It’s the description a reader can *act* on, not by believing it as fact, but by feeling its force, understanding its logic (however flawed), and recognizing its echo in the complex, mediated world we all inhabit. It’s a tool for sharpening attention.

  This brings me to my own recent work, a deliberate test case for this idea. My last three novels are written in what’s been called the “secondhand manner.” Nothing is asserted cleanly. Every claim, every description, reaches the reader filtered – overheard, reported, distorted by narrators with agendas, biases, blind spots. The books make no direct claims; they never ask to be *believed* in the factual sense. If truth-as-property is redundant, what changes when assertion disappears?

  What’s lost? The comfort of certainty. The illusion that the author is handing you unvarnished reality, a “truth” you can simply accept. The reader is denied that passive posture.

  But what’s gained? **Intensity of attention and the demand for critical trust.** Without an authorial voice declaring “This Is True,” the reader isn’t asked to *believe* the sentences, but to *evaluate* them constantly. To ask: Who is saying this? Why? What do they gain? What are they hiding? The reader becomes an active participant, sifting the fragments, testing their resonance against their own understanding of human frailty and motive. The *accuracy* I strive for isn't about matching the world, but about crafting sentences that perfectly capture the flawed, self-serving, poignant ways people *construct* their worlds and report on others.

  The power isn't in securing ‘Truth’, but in meticulously building a linguistic structure – a constellation of these slanted, mediated sentences – that creates a field of undeniable human *recognition*. You recognize the strategies of self-deception, the pathos of unreliable justification, the way interests bend perception. You don’t believe the *report*; you trust the *portrait* of how reporting happens. You act on this understanding not by parroting facts, but by seeing the mechanics of narrative bias laid bare, perhaps making you a sharper listener, a more critical consumer of *all* the stories told around you, fictional or otherwise.

  Fiction’s unique contribution to ‘truth’, especially under a deflationary lens, isn’t revealing a deeper metaphysical layer. It’s in providing rigorously constructed, resonant sentences – the exact sentences the depicted human situations demand – that train our attention, illuminate the mechanics of perspective and persuasion, and demand our active, critical engagement with the world of words we inhabit. It trades the promise of hidden property for the power of precise, revealing expression. It asks not for your belief, but for your vigilant attention. That, I suggest, is where its enduring, unsettling power truly lies. Thank you.

  ---

  **Brief Note on Conceptual Leans and Shifts**

  This speech leans heavily on a core deflationary tenet: that "true" is primarily a logical device (disquotation, generalization) and not the name of a substantive property explaining a sentence's success. It accepts this and asks: *If that's all 'truth' is, what work is fiction actually doing?* The argument transfers the weight from "securing truth" to "achieving resonant precision within a constructed frame." This precision is framed as a kind of functional "accuracy," but crucially, accuracy *to the human condition being depicted*, not correspondence to external reality – a move that subtly shifts the ground. While deflationists might agree truth isn't correspondence, focusing on "accuracy" *within fiction* is distinct from their core project of analyzing the word "true."

  The speech significantly changes the subject from *truth* to **attention, critical engagement, and the mechanics of trust/distrust**. It argues fiction's value lies not in possessing truth, but in *training* the reader's faculties for navigating a world saturated with biased reports – precisely *because* it withholds straightforward assertion. The "gain" identified (intensified critical attention) and the "loss" (comfort of certainty) are framed in terms of reader psychology and epistemology (how we know things socially), moving decisively beyond the semantic analysis of "true" that defines deflationism. The concept of "trust" shifts from trusting *propositions* (truth-bearing) to trusting the *author's skill* in revealing human patterns through mediated language. This is a pragmatic, reader-focused shift away from the ontological concerns of deflationism about truth itself.
