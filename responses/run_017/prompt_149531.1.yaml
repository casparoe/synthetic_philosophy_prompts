answer: |-
  Here’s a structured response to your query, following your requested sections and constraints:

  ---

  ### 1. Restating the Pattern (120-150 words)  
  You’re describing a paradox in how society assigns *credit* for scientific discoveries. When historical evidence reveals a rival was close to the same breakthrough (e.g., six weeks behind), the discoverer’s perceived brilliance diminishes – the discovery is framed as "inevitable," a product of a "ripe" field. Yet the *result itself* retains full value (no one discounts the discovery’s importance or argues for reduced funding). Crucially, this credit discount hinges entirely on facts *unknown* to the discoverer (a rival’s proximity) and contingent on *accidents of historical preservation* (whether the rival left a datable trace). When no rival is documented, the same achievement is hailed as singular genius. The core tension: credit isn’t based solely on the act of discovery but on an invisible context of near-misses, often erased by poor record-keeping.

  ---

  ### 2. What's Already Out There (200-250 words)  
  Several established ideas touch parts of your observation:
  *   **Merton’s "Multiples" / Simultaneous Discovery:** Robert Merton noted many discoveries occur independently around the same time. He argued this reveals scientific progress is driven by the state of the field ("zeitgeist") more than individual genius. It’s used to explain patterns like Newton/Leibniz.
  *   **The Matthew Effect:** Also by Merton, this describes how eminent scientists often get disproportionate credit for collaborative work or discoveries, while lesser-known contributors are overlooked ("the rich get richer"). It focuses on reputation amplifying credit.
  *   **Hindsight Bias (or "Creeping Determinism"):** This psychological tendency makes past events seem more predictable *after* they happen. It’s used to explain why people say things like "it was bound to happen" once the outcome is known.
  *   **Social Construction of Scientific Credit:** Historians/sociologists (e.g., Steven Shapin) study how credit is negotiated through publications, priority disputes, institutional power, and rhetoric, rather than being objectively awarded. It emphasizes the messy human process behind assigning value.

  ---

  ### 3. Where Each One Misses (200-250 words)  
  *   **Merton’s Multiples:** Explains *why* rivals exist (field ripeness) but doesn’t address the *credit discount* you pinpoint. Merton focused on the phenomenon’s existence and sociological cause, not how the *knowledge* of a rival retroactively diminishes perceived individual merit. Your observation is about the *consequence* of a multiple being *known*.
  *   **Matthew Effect:** Explains credit *transfer* (to the famous) but not credit *diminution* (of *all* participants *because* a rival existed). Your pattern reduces credit for *both* discoverer and rival ("quietly demoted") due to the field’s state, regardless of initial fame.
  *   **Hindsight Bias:** Explains overconfidence in predictability *after* the fact, but not the specific link to *credit allocation* based on rival proximity. It’s about perceived inevitability of the *event*, not the moral/social judgment of the *actor's* deservingness.
  *   **Social Construction:** Gets closest by showing credit is contingent. However, it typically focuses on active negotiations (priority fights, institutional clout) or broad social forces, not the specific, passive mechanism you describe: the *mere documented existence of a temporal near-miss* acting as a discount factor, independent of the discoverer's actions or awareness.

  **Best Fit:** Merton’s Multiples provides the foundational context (why rivals exist), but the *credit discount effect* you describe is a distinct, un-named consequence of how we react to evidence of those multiples. The Social Construction lens validates the contingency but doesn’t isolate this specific trigger.

  ---

  ### 4. Verdict (<100 words)  
  No, this specific pattern of **credit being retrospectively diminished for an individual discovery based solely on the documented temporal proximity of an independent rival (a factor unknown to the discoverer and contingent on historical record survival)** does not have a widely recognized, established name in the philosophy or sociology of science literature. It sits at the intersection of known concepts but describes a distinct evaluative phenomenon.

  ---

  ### 5. Definition and Edge Cases (250-300 words)  
  *   **Proposed Name:** **Discovery Proximity Discount (DPD)** or **Rival Shadow Effect (RSE)**
  *   **Definition:** The retrospective diminution of perceived individual credit or "genius" assigned to a scientific discovery, occurring specifically when historical evidence reveals an independent rival researcher or group was temporally close (e.g., weeks or months) to achieving the same result, where this proximity was unknown to the discoverer(s) at the time and the diminution arises primarily from the implication that the discovery was highly imminent ("inevitable") due to the field's state.
  *   **Where It Stops:**
      *   **Causal Influence:** If the rival *causally influenced* the discoverer (e.g., through unpublished correspondence, espionage, conference gossip), it’s **not DPD/RSE**. This becomes a priority dispute or idea theft – active competition, not the passive effect of a near-miss revealed later. DPD requires independence and ignorance.
      *   **Artistic Originality:** Likely **not applicable**, or significantly weaker. Artistic value is heavily tied to unique expression, style, and subjective interpretation. While artistic movements can be "ripe," the concept of a near-identical, independent artistic creation being "inevitable" is far less plausible than in science. Credit in art is less tied to priority of a specific factual claim and more to the singularity of the vision/execution.
      *   **Record-Survival Layer:** This is **integral** to DPD/RSE, not separate. The effect *depends* on the accident of whether evidence of the rival’s proximity survives and is found. Cases where a rival existed but left no trace are *invisible* instances of DPD – the discount doesn't happen because the evidence is lost, so the discoverer gets "full" credit by default. The record layer is a core enabling condition.

  ---

  ### 6. Your Delay Idea (150 words)  
  Shifting the focus from "would it happen?" (almost always yes) to "how much later, and would that delay matter?" is insightful and addresses a key weakness in the "inevitability" argument. It reframes the *value* of the discovery act around the *cost of delay* (lives, progress stalled). However, it **relocates rather than solves** the core problem you identified. Credit would *still* be contingent on estimating:
  1.  **The Counterfactual Delay:** How *do* we reliably estimate how much later it would have happened without *this* discoverer? This requires speculating about rivals' unknown progress rates and potential unseen obstacles, remaining highly subjective.
  2.  **The Impact of Delay:** Judging the cost of (e.g.) a 6-month vs. 5-year delay is also speculative and context-dependent.
  Crucially, this valuation **still depends critically on the historical record**. Without evidence of a rival's progress, we'd assume a long delay/high cost, granting high credit. With evidence of a close rival, we'd assume minimal delay/low cost, diminishing credit. The discount effect persists, tied to estimating the counterfactual delay enabled by the rival's documented existence.
