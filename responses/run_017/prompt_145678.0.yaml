prompt: |-
  You're a professional philosopher of language — think of yourself as the person who'd be asked to write the handbook entry on speech acts. I want you to take this slowly: brainstorm a bit first, list the candidate concepts you can think of before you settle, and don't just grab the first label that comes to mind. Please write in British English throughout.

  I sit on a ridiculous number of committees — parish council, a housing co-op, a small charity board — and there's a thing that keeps happening in meetings and in emails and I've never had a word for it. Two instances, then the general shape:

  At the co-op, a chair said "right, so we're all agreed the maintenance sub-group takes this forward" at the end of a discussion in which nobody had agreed anything. Two people looked unhappy. Nobody said anything. And from that moment the sub-group *was* taking it forward, and at the next meeting the minutes recorded the agreement as having been reached in the previous meeting, and the chair referred back to it — "as we agreed last time" — completely sincerely, as though the agreement had been there first and he'd just reported it.

  Second: an email went round at the charity saying "following the governance review, the trustee rota is changing to X". The "review" had been one phone call between two people who happened to be free on a Tuesday. But once the email existed, there had been a governance review, in the only sense anyone ever checked. Nobody was lied to exactly — everyone who read it could have worked out what had happened, and most of them did. It just didn't seem to matter that they had.

  And here's why I think this is a real phenomenon and not just people being slippery: it sometimes doesn't work. Same chair, same room, but someone says "hold on, we didn't agree that," and the whole thing collapses — it becomes instantly obvious that there was no agreement and never had been, and the chair looks like an idiot rather than like someone who got away with something. So there's a difference between the cases where the loop closes and the cases where it doesn't, and I can't put my finger on it. My cynical guess is that it's about whether anyone in the room has an interest in letting it pass, but that feels too crude, and it doesn't explain why the *same* trick works on me when I'm the one doing it and I know exactly what I'm doing.

  I did a bit of Austin at uni years ago, the "doing things with words" stuff, though I remember almost nothing. From what I recall he has categories for utterances going wrong — a misfire? — when the circumstances aren't right, like a marriage not happening because the person officiating had no licence. But that feels like the opposite of my cases. In mine the thing *does* happen, and it happens precisely because the sentence gets away with it. It's not a failed performance, it's a performance that kind of issues its own licence, retroactively, and everyone including the speaker then treats the licence as having been there all along. I also thought about self-fulfilling prophecies — a run on the bank and so on — but that's a prediction making its own content true, and these aren't predictions. They're phrased as reports of what's already the case, and it's the report being accepted that makes it the case. Also the run on the bank works whether or not anyone intends it to; mine only work when someone is aiming at exactly that.

  So: does this have an established name, or a literature? And I really don't want just a name — I'm after the carving. What exactly is the thing, and what is it *not*? How far does my contrast with the failed-performance case and with the self-fulfilling-prophecy case actually hold up, or am I misremembering Austin badly enough that his categories already cover this? Where are the edges — does it matter if the speaker has *some* authority but not enough, or if the audience couldn't have objected without cost, or if it's in writing rather than speech, or if there's no audience at all (someone writes "I've decided to leave" in a diary and then finds they have)? Is it the same phenomenon when the thing manufactured is a fact, like an agreement, versus when it's a permission, like what people are now allowed to say in the meeting? If nothing established fits, say so plainly and coin a term with a defenition and some boundary cases — I'd rather have a good new word than a bad old one.

  I'm not asking for a reading list or references, I can't get to a university library and I want the distinctions, not pointers. At the end, tell me how confident you are in the main things you've claimed and single out the bit you're least sure of — I'd like to know where to push back.
reasoning: |-
  Hmm, the user is asking me to analyze a specific linguistic phenomenon they've observed in committee meetings, where a statement about a decision or event is made without proper basis, but becomes accepted as fact once uttered. They want me to approach this as a professional philosopher of language, drawing on speech act theory.

  Let me recall the core examples: one involves a chair declaring consensus where none existed, and another describes an email framing a small conversation as an official "governance review." The key insight is that these utterances become true retroactively when unchallenged, but collapse when questioned. 

  The user has already done some impressive preliminary analysis - they've contrasted it with Austin's misfires (where conditions aren't met) and self-fulfilling prophecies (which are future-oriented). Their intuition that this is distinct feels correct. This seems like a peculiar performative that generates its own felicity conditions through social acceptance.

  I should brainstorm candidate concepts: performative utterances obviously, but also Searle's institutional facts, Bourdieu's symbolic power, Vaihinger's "as if" philosophy. The retroactive aspect echoes Arendt on lying in politics, and the collapse upon challenge resembles Goffman's face-work. "Performative retroaction" might capture the mechanism, while "felicity laundering" describes the effect. 

  Important to map boundaries: it differs from simple lies (no deception), from authority-based commands (works without full authority), and from groupthink (requires active though silent participation). The written diary case is fascinating - does it work without an audience? Probably not, as the validation seems social.

  The power dynamics angle is crucial but tricky - it's not just about authority but about the cost of objection. That's where Lukes' third dimension of power might apply. Should flag this as my least confident point though, as the literature on implicit coercion in discourse is vast.

  For British English phrasing: "take minutes" not "record minutes", "sub-committee" over "sub-group", and careful about "trick" versus "mechanism" to maintain neutrality. Must emphasize that this operates in the normative space between what's formally correct and what's socially ratified.

  The coinage should feel precise: "performative enactment" foregrounds the action, "retroactive validation" the temporal paradox. "Felicity laundering" is punchier but maybe too metaphorical. Best to present options with trade-offs.
answer: |-
  Right, let's approach this methodically, as requested. As a philosopher of language steeped in speech act theory (and writing in British English throughout), I'll begin by brainstorming candidate concepts before settling on the most fitting analysis. Your examples are fascinating and point to a subtle, potent mechanism.

  **Brainstorming Candidate Concepts (with brief evaluation):**

  1.  **Performative Utterance (Austin):** An utterance that *does* something (e.g., "I name this ship...", "I promise"). Your cases superficially resemble performatives declaring agreement or instituting a review.
      *   *Evaluation:* Close, but standard performatives require specific felicity conditions (e.g., authority, correct procedure) *to be met at the time of utterance* for the act to be "happy" (successful). Your chair *lacked* the condition of prior agreement. This seems like a performative attempting to *create* the very condition it pretends to rely upon, *retrospectively*.

  2.  **Misfire (Austin):** When a performative fails because felicity conditions aren't met (e.g., bigamous marriage).
      *   *Evaluation:* This feels like the *opposite* of your cases. In a misfire, the act *fails* ("I sentence you..." by someone not a judge). In your cases, the act *succeeds* ("we agreed" becomes treated *as if* it were true) *despite* the initial felicity condition (actual agreement) being absent. It's a *successful misfire*, paradoxically.

  3.  **Self-Fulfilling Prophecy (Merton):** A false definition of a situation evoking behaviour that makes the originally false conception come true (e.g., bank run).
      *   *Evaluation:* Similar mechanism of creating reality through belief/action, but crucially different *direction*. Prophecies are future-oriented ("X *will* happen" causing X). Your utterances are *past/present*-oriented ("we *have* agreed", "there *has been* a review"), masquerading as reports. The temporal aspect and the guise of reporting are key differences.

  4.  **Institutional Fact (Searle):** Facts that exist only within human institutions and require collective acceptance (e.g., "This is a five-pound note").
      *   *Evaluation:* Highly relevant. The "agreement" and the "review" are institutional facts. Searle emphasises that their existence depends on "collective intentionality". Your phenomenon shows how a *declaration* (a type of speech act Searle identifies) can *create* an institutional fact *by being accepted*, even if the declaration misrepresents the prior state. This gets to the core.

  5.  **Presupposition Accommodation (Stalnaker/Lewis):** When a speaker presupposes something not already part of the conversational common ground, and the audience silently accepts it to keep the conversation flowing.
      *   *Evaluation:* Relevant, but limited. The chair's "as we agreed" presupposes agreement exists. The audience's silence *allows* this presupposition to become part of the accepted background. However, this usually concerns *background assumptions*, not the *main point* of the utterance creating a *new* institutional fact. It explains *how* the trick works momentarily (silence as acceptance), but not the full *retroactive institutional creation*.

  6.  **Symbolic Power / Misrecognition (Bourdieu):** The power to impose the legitimate vision of the social world, often getting people to accept situations as natural or legitimate that benefit the powerful.
      *   *Evaluation:* Captures the power dynamics and the potential cynicism you mention ("interest in letting it pass"). It explains *why* it might work (the chair's position lends plausibility, objecting has a cost) but is less focused on the precise *linguistic mechanism* of retroactive creation. It's a crucial social layer *enabling* the linguistic act.

  7.  **Bullshit (Frankfurt):** Speech intended to persuade without regard for truth.
      *   *Evaluation:* Too broad and pejorative. While there might be disregard for truth, the *aim* isn't just persuasion; it's the *creation of a fact*. Crucially, it *works* linguistically/socially when unchallenged. Bullshit can fail without collapsing the intended reality it describes.

  8.  **Fait Accompli:** An accomplished fact, irreversible.
      *   *Evaluation:* Describes the *outcome* ("the sub-group *was* taking it forward"), not the *linguistic act* that *created* it.

  **Synthesis and Naming: Performative Enactment with Retroactive Validation**

  Your phenomenon sits at the intersection of **declarative speech acts** (Searle) creating **institutional facts** and the mechanism of **presupposition accommodation**, enabled by **symbolic power** and **the cost of objection**.

  *   **The Core Mechanism:** An individual in a position of *some* relevant authority (like a chair, or someone initiating an email) makes a **declaration** phrased as a **report** of an existing institutional state of affairs ("We have agreed X", "The review has decided Y"). This declaration *presupposes* the existence of the prior conditions necessary for that state of affairs (the actual agreement, the actual review meeting).
  *   **The Crucial Move:** When this utterance is **not challenged** by the relevant audience (the committee, the trustees), the presupposition is **accommodated**. More than that, the *entire declared institutional fact* is **accepted as valid**. This acceptance functions as **retroactive validation**. The *act of unchallenged declaration* itself *creates* the felicity conditions (the "agreement", the "review decision") that were missing at the moment of speaking. It manufactures the past it purports to describe.
  *   **The Collapse:** When challenged ("Hold on, we didn't agree"), the presupposition fails to be accommodated. The declaration is exposed as lacking its necessary prior condition *at the time of utterance*. The attempt at retroactive validation fails. The misfire is recognised *as* a misfire.

  **Why Your Contrasts Hold:**

  *   **vs. Misfire:** A misfire is a *failure* because conditions are absent and recognised as absent. Your cases *succeed* in creating the institutional fact *because* the absence of conditions isn't *made salient* by challenge. The "misfire" is masked and retroactively "fixed" by collective acceptance.
  *   **vs. Self-Fulfilling Prophecy:** The prophecy ("The bank will fail") is *about the future* and its utterance *causes* the future event. Your declarations are *about the past/present* ("We *have* agreed") and their utterance, when accepted, *creates the past/present fact* it reports.

  **Carving the Phenomenon: What it is and isn't**

  *   **What it IS:**
      *   A declarative speech act (Searle) attempting to establish an institutional fact.
      *   Phrased as a *report* of an existing state of affairs/fact/decision.
      *   Where the *actual prior conditions* necessary for that reported fact to be true *were absent* at the time of utterance.
      *   Whose success *depends entirely on the immediate, unchallenged acceptance* by the relevant audience.
      *   Where unchallenged acceptance *constitutes retroactive validation*, manufacturing the missing conditions and thus making the declaration true "after the fact".
      *   Fundamentally reliant on social power dynamics and the cost of objection (Bourdieu).
  *   **What it is NOT:**
      *   A simple lie (The speaker may *become* insincere *after* acceptance, but the initial act isn't *just* stating a known falsehood; it's an attempt to *make* it true).
      *   A straightforward command (e.g., "I order the sub-group to take this forward" – this doesn't disguise itself as a report of prior fact).
      *   A successful performative with met conditions (Here, conditions are absent initially).
      *   A misfire (It succeeds in its institutional effect when unchallenged).
      *   A self-fulfilling prophecy (Past/Present vs. Future orientation).
      *   Mere bullshit (Its *aim* and *effect* is the creation of institutional reality, not just persuasion regardless of truth).

  **Edges and Boundary Cases:**

  1.  **Speaker Authority:** Some authority seems necessary for plausibility, but *not* absolute authority. The chair has *procedural* authority; the email sender has *initiative* authority. If someone with *no* standing (e.g., a random member interrupting) tried it, it would likely fail immediately. The authority grants the *initial plausibility* needed for the unchallenged moment.
  2.  **Cost of Objection:** Crucial. If objection has no cost (e.g., a very flat hierarchy, close friends), the phenomenon is less likely to occur. The *potential* cost (social awkwardness, being seen as obstructive, future repercussions) enables the silence that constitutes acceptance. High cost makes it more coercive.
  3.  **Writing vs. Speech:** Writing can strengthen it (creates a "record", allows less immediate challenge) or weaken it (if circulated widely, someone distant might challenge more easily). The core mechanism (declaration + unchallenged acceptance = retroactive validation) remains. Email is potent for this.
  4.  **No Audience (Diary Case):** Unlikely to work *as the same phenomenon*. The diary declaration "I've decided to leave" might *influence* the writer's psychology, potentially becoming a self-persuasion or commitment device. But the *institutional fact* (e.g., informing an employer, changing legal status) isn't created until it's communicated to and accepted by the relevant institution/audience. The social ratification is essential for creating the *institutional* reality. The diary entry might be the *catalyst* for a *future* performative act directed at an audience.
  5.  **Manufacturing Facts vs. Permissions:** Closely related, but distinct. Manufacturing a *fact* ("We agreed X") creates a new baseline reality. Manufacturing *permission* ("It's now acceptable to say Y") is manufacturing a new *norm* (another type of institutional fact). Both rely on the same retroactive validation mechanism via unchallenged declaration. The permission case might be slightly more fragile, as norms require ongoing reinforcement.
  6.  **Sincerity:** Initially, the speaker may be insincere (knowing no agreement exists). However, *after* the retroactive validation, they can refer to it "completely sincerely" *because the institutional fact now exists*. The declaration *made* it true for them too. This is part of the "laundering" effect.

  **The Gap and the Coinage:**

  While Searle's "Declaration" is the *type* of speech act, and "Institutional Fact" is what's created, and "Presupposition Accommodation" is part of the mechanism, and "Symbolic Power" enables it, **no single established term perfectly captures the *retroactive validation* aspect and the *masking of the initial misfire*.**

  Therefore, I propose coining the term: **Performative Enactment with Retroactive Validation (PERV)**. (Yes, the acronym is unfortunate, but the term is precise).

  *   **Definition:** A declarative speech act, phrased as a report of an existing institutional state of affairs or decision, issued by an agent possessing some relevant contextual authority, which presupposes prior conditions that were absent at the time of utterance, and which succeeds in creating the reported institutional fact solely through its unchallenged acceptance by the relevant audience, thereby retroactively validating the declaration and manufacturing the missing prior conditions.
  *   **Boundary Cases:**
      *   *Clear PERV:* Your committee chair and charity email examples.
      *   *Likely PERV:* A manager emails their team: "Following our discussion, the deadline is now Friday." (No discussion occurred). Silence = acceptance = new deadline fact.
      *   *Not PERV (Misfire):* Same manager says it in a meeting, someone immediately says "What discussion?". Collapse.
      *   *Not PERV (Genuine Performance):* The chair correctly states "We agreed X" after a vote. Conditions met.
      *   *Not PERV (Self-Fulfilling Prophecy):* "This project is doomed to fail" causing demoralisation and failure.
      *   *Edge Case (Low Authority):* A junior member interrupts: "As we all decided earlier, we should cancel the project." Likely immediate challenge: "We did *not* decide that!" Fails. Lacks sufficient authority for plausible presupposition.
      *   *Edge Case (Diary):* See above. Not PERV as defined, as no social audience ratifies the institutional fact.

  **Confidence Assessment:**

  *   **Highly Confident:** That your phenomenon is distinct from standard misfires and self-fulfilling prophecies regarding temporal direction and the guise of reporting. That it centrally involves Searle-type declarations creating institutional facts. That unchallenged acceptance is the critical trigger for success. That the retroactive aspect is key.
  *   **Moderately Confident:** That presupposition accommodation is the precise linguistic mechanism enabling the initial acceptance. That "Performative Enactment with Retroactive Validation" (PERV) accurately captures the core mechanism. That the cost of objection is a major enabling factor.
  *   **Least Confident / Most Open to Pushback:** The precise boundaries of the *level* of authority required for plausibility. The extent to which the speaker's *initial* insincerity is essential or just common (could someone *believe* their own false report and still trigger PERV if unchallenged? My *inclination* is yes - sincerity isn't the core condition, acceptance is). The exact relationship between manufacturing facts and manufacturing permissions/norms – whether they are distinct sub-types or seamlessly part of the same phenomenon.

  **In essence:** You've identified a potent, under-theorised mechanism of social and linguistic power – the unchallenged declaration that launders its own missing conditions into existence through the very act of being treated as a report of fact. It exploits the gap between procedural legitimacy and social acquiescence. PERV happens constantly in bureaucracies, committees, and organisations where the cost of constant vigilance is high. Your chair isn't (just) being slippery; they're wielding a subtle, often effective, linguistic tool for manufacturing consensus.
