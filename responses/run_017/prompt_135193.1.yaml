  Okay, the user's query is deep and complex. They're part of a reading group that tackles big books on moral change, and they're stuck on a specific pattern they noticed in historical shifts like the end of dueling and slavery. The core idea is that arguments against these practices didn't cause their end; instead, the practices faded because the emotional or social grip of certain concepts like "cowardice" weakened over generations, even as people still nominally believed in them. The user wants to know if there's a name for this phenomenon, and if not, to define it clearly.

  First, I need to unpack the user's description. They mention that in dueling, the label "coward" had a powerful grip, and arguments against dueling didn't touch that emotional core. Similarly, slaveholders might agree slavery was bad but continued it. The key is that the belief didn't change, but its motivating force did. The user contrasts this with weakness of will, hypocrisy, or mere shifts in fashion. They also bring up two related ideas: one about whose respect matters changing, and another about norms becoming embarrassing before they're rejected privately.

  The user's explicit request is for a term and a conceptual carving. But deeper, they seem to want a framework to understand moral change beyond rational arguments. They might be frustrated with oversimplified historical narratives and seeking validation that their observation is recognized in academia. Their identity as part of a reading group suggests they value intellectual rigor, so they'd appreciate precise distinctions and references to existing theories.

  Now, recalling relevant concepts. Affective force from meta-ethics comes to mind—how moral terms have emotional weight that can fade. Charles Taylor's "social imaginaries" explains how shared understandings shift. Pierre Bourdieu's habitus and doxa relate to internalized norms. Bernard Williams' "thick ethical concepts" tie evaluation and emotion, which can lose their grip. Elisabeth Camp's framing as "conceptual affordances" might fit, where concepts' practical implications change.

  The rival idea about whose respect matters is part of the same mechanism, not separate. Affective force depends on social context; if the relevant community changes, the grip weakens. For the second issue—norms becoming embarrassing before being rejected—it's a subset where the affective force erodes first in public discourse due to social pressure.

  Assessing if there's an exact term. "Moral disengagement" is close but implies active detachment. "De-moralization" is used differently. "Affective disembedding" isn't standard. So, proposing "affective disengagement" or "erosion of thick concept grip" as new terms. The key elements are: endorsement remains, but the concept's action-guiding force diminishes due to changing social imaginaries.

  Boundary cases: distinguishing from hypocrisy (no conflict felt), weakness of will (awareness of failure), or value change (belief shifts). Examples like modern debates on meat-eating could illustrate partial affective disengagement.

  In conclusion, the phenomenon is recognized in moral philosophy and sociology but lacks a universal term. Affective force erosion, linked to shifting social imaginaries, captures it. The respect dynamic and public embarrassment are facets of the same process. The user needs this synthesis to clarify their insight and advance their group's discussion.
answer: |-
  Based on your exceptionally clear description, you've identified a profound and under-discussed mechanism of moral change. There isn't a single, universally accepted term for this *exact* phenomenon ("a consideration coming loose from a person who still endorses it"), but it sits at the intersection of several established concepts. Let's carve it out:

  **The Core Phenomenon: Erosion of Affective Force / Thick Concept Grip**

  1.  **What it IS:**
      *   The **affective force** or **motivational grip** of a specific **thick ethical concept** (like "cowardice," "honor," "duty" within a specific context like dueling, or "property," "order," "civilization" within the context of slavery) weakens over time, *even while the abstract evaluation associated with the concept remains*.
      *   People still *say* cowardice is bad, slavery might be regrettable, but the specific conceptual link ("*Not dueling* = *Cowardice*" or "*Freeing my slaves* = *Chaos/Injustice*") loses its power to compel action or justify the practice. The concept becomes "thin" in that specific context.
      *   The change occurs at the level of **social imaginaries** (Charles Taylor) or **habitus** (Pierre Bourdieu): the shared, often pre-reflective, understanding of *how the world works* and *what concepts imply in practice* shifts. The "grammar" of the moral language changes.
      *   It's a shift in **conceptual affordances** (Elisabeth Camp): what actions a concept like "cowardice" *makes available* or *demands* in a given social context diminishes.
      *   **Bernard Williams' "thick ethical concepts"** are central here. These concepts (like "courage," "cruelty," "treachery") unite description and evaluation. Your observation is that the *motivational and action-guiding* force inherent in a thick concept's application in a *specific practice* can erode independently of a change in the abstract evaluation ("cowardice is bad").

  2.  **What it IS NOT:**
      *   **Weakness of Will (Akrasia):** The agent does *not* experience internal conflict or feel they are failing their own standards. Their actions feel consistent *because the grip has loosened*.
      *   **Hypocrisy:** There's no conscious deception or misalignment between public pronouncement and private belief. The agent genuinely endorses the abstract value but doesn't feel its forceful application in this specific case anymore.
      *   **Change in Abstract Values/Beliefs:** People don't stop believing cowardice is bad or that societal order is important. The *core value* remains endorsed; its *specific operationalization* loses traction.
      *   **Rational Persuasion/Defeat of Arguments:** As you noted, the arguments against the practice don't directly dislodge the core thick concept's grip in the moment. The grip erodes *around* the arguments.
      *   **Pure Fashion/Whim:** The change isn't arbitrary. It's tied to deep shifts in social structure, material conditions, power dynamics, and evolving collective understandings that reconfigure the web of meanings surrounding the thick concept.
      *   **Moral Disengagement (Bandura):** While related, moral disengagement usually involves *active* cognitive strategies (dehumanization, displacement of responsibility) to *avoid* the negative affect of violating an *existing* norm. Here, the negative affect (the *grip*) simply fades *without* necessarily needing those strategies; the norm loses its visceral hold.

  3.  **Nearest Established Concepts:**
      *   **Affective Force (Meta-Ethics):** The idea that moral judgments have a motivational "push." Your phenomenon is the *selective erosion* of that push for a specific thick concept within a specific practice, while the judgment remains.
      *   **Thick Ethical Concepts (Williams):** The key building block. The phenomenon is the *deflation* or *contextual weakening* of the thick concept's action-guiding force.
      *   **Social Imaginaries (Taylor):** The phenomenon occurs *within* and *because of* shifts in the broader, shared background understanding of social reality that gives concepts their meaning and force.
      *   **Habitus (Bourdieu):** The internalized, embodied dispositions shaped by social structures. The erosion of grip reflects a shift in the habitus – new dispositions form where the old thick concept no longer generates the same automatic behavioral response.
      *   **De-moralization (Less common usage):** Sometimes used to describe a practice losing its *moral* significance and becoming seen as merely conventional or pragmatic. This is close but misses the nuance that the *abstract* value (cowardice bad) may remain moral; it's the *link to the practice* that de-moralizes.

  4.  **The "Whose Respect" Question:**
      This is **not a competitor; it's the *mechanism* explaining the erosion of affective force.** Whose respect matters defines the relevant **social imaginary**. When the group whose approval you seek (and whose disapproval you fear) changes its collective understanding – so that *they* no longer see "not dueling" as cowardly but perhaps as sensible or civilized – the affective force of "cowardice" in that context dissolves *for you*. Your habitus adjusts to seek standing within the *new* imaginary. The grip was always socially embedded; its erosion is social.

  5.  **The "Embarrassment Before Disbelief" Question:**
      This is **a distinct, though closely related, phenomenon: The Rise of Pluralism and the Collapse of Doxa (Bourdieu)**.
      *   **Doxa:** The realm of taken-for-granted, unquestioned beliefs and norms that feel like the natural order. Within doxa, the thick concept grip is absolute and unchallenged.
      *   **What Changes:** As societies become more pluralistic, or critical discourse challenges the practice, **doxa collapses** for that norm. It moves into the realm of **orthodoxy vs. heterodoxy** – contested beliefs.
      *   **The Embarrassment:** When a norm is contested, even people who privately still feel its grip (or endorse the underlying value) may become hesitant to voice justifications *publicly* because they anticipate disagreement, challenge, or social sanction (ridicule, loss of status). The practice becomes "embarrassing" because its justification is no longer universally accepted doxa; defending it requires effort and risks conflict.
      *   **Relation to Core Phenomenon:** Public embarrassment often *precedes* and *accelerates* the erosion of private affective force. Seeing the justification fail publicly, encountering alternative viewpoints, and experiencing social pressure weakens the internal grip over time. However, it *can* exist temporarily where the private grip remains strong but is suppressed (closer to hypocrisy or fear). The core phenomenon (erosion of grip) is the deeper, internal shift, while public embarrassment is a social symptom often occurring during the transition as doxa collapses.

  **Carving the Concepts & Inventing a Term:**

  *   **Phenomenon 1: Erosion of Thick Concept Grip / Affective Disengagement**
      *   **Definition:** The process whereby a thick ethical concept loses its motivational force and action-guiding power within a specific social practice, despite continued abstract endorsement of the evaluative component of the concept and the values it represents. The link between the concept and the specific practice weakens or severs within the social imaginary and individual habitus.
      *   **Boundary Cases:**
          *   *Not This:* A slaveholder freeing slaves due to a religious conversion that *changes* their belief about the soul's equality (change in abstract belief).
          *   *Not This:* A duelist refusing a duel but feeling deep shame and believing he *is* a coward (weakness of will under intact grip).
          *   *This:* A Southern planter in 1850 writing that slavery is a "necessary evil" he wishes could end, yet vigorously defending it and feeling no *personal* shame in owning slaves, because "property," "order," and "duty" to his "way of life" retain their thick, action-guiding force *in this context*, even while abstract "evil" is acknowledged. By 1880, his grandson endorses "property" and "order" but feels no compulsion to defend *chattel slavery* specifically; the grip has gone.
          *   *This:* A corporate executive in 2023 acknowledging climate science abstractly ("we must protect the planet") but feeling no contradiction in aggressively lobbying against regulations, because the thick concepts of "duty to shareholders," "market freedom," and "competitive necessity" retain overwhelming grip in the corporate habitus, overriding the abstract value.
      *   **Leaves Out:** It focuses on the *internal* motivational shift. It doesn't fully capture the *external* social pressures (embarrassment) or the *structural* factors (economic change, technology, war) that drive the shift in imaginaries enabling the erosion.

  *   **Phenomenon 2: Collapse of Doxa Leading to Public Embarrassment**
      *   **Definition:** The stage in norm change where a previously taken-for-granted practice and its justification lose their uncontested status, moving into the realm of public dispute. Defending the practice publicly becomes socially risky or embarrassing due to anticipated challenge or sanction, even for those who may still privately feel its normative pull or hold residual beliefs supporting it.
      *   **Boundary Cases:**
          *   *Not This:* Defending a widely accepted norm (doxa).
          *   *Not This:* Defending a norm you privately reject (hypocrisy).
          *   *This:* A politician in the 1970s feeling they *must* oppose gay rights publicly, even if privately ambivalent, because supporting it was "embarrassing" (career-ending) before it was widely accepted. The norm (heterosexuality as solely legitimate) was losing doxic status.
          *   *This:* A businessman in the 1950s continuing to make sexist remarks in private men's clubs but carefully avoiding them in mixed company or public speeches because they had become "embarrassing" (socially sanctioned) in those contexts, even if he still believed them.
      *   **Leaves Out:** It focuses on the *social performance* and *communicative* aspect. It doesn't specify the internal state (residual grip vs. full rejection) and is less about the deep motivational shift than the social risk of expression.

  **Proposed Term for Phenomenon 1: Affective Disengagement (of Thick Concepts)**

  *   **Definition:** The decoupling of the motivational and action-guiding force ("affect") from a thick ethical concept within a specific domain of practice, occurring within an individual's habitus due to shifts in the social imaginary, while abstract endorsement of the concept's evaluative content may persist.
  *   **Why it works:** It captures the "coming loose" (disengagement) of the motivating element (affective force) from the cognitive endorsement.

  **In Summary:**

  You've pinpointed a crucial mechanism: **the erosion of the *motivational grip* of thick ethical concepts within specific practices, driven by shifts in the social imaginary ("whose respect matters"), independent of changes in abstract beliefs or rational argumentation.** The rival explanation about "whose respect" is the engine driving this erosion. The "embarrassment" phase is a distinct but related social symptom occurring as the previously taken-for-granted justification (doxa) collapses into contested belief (orthodoxy) during this transition. **"Affective Disengagement"** is a strong candidate term for the core phenomenon you describe so vividly. This framework provides powerful tools for understanding why moral practices persist long after arguments against them exist, and why they collapse even when proponents nominally share many of the critics' values.
