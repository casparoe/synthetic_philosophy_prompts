  For claim 2 about debunking the intuition, I should note it's structurally tricky - any persistent intuition could be dismissed as "unpurged illusion", making it unfalsifiable. But the user wants pressure points: perhaps when "better-in-one-respect" judgments track something irreducible, like when compensating someone worsens another's status. 

  Claim 3's jurisdictional move feels most fragile. Different-number cases absolutely can simulate levelling-down - imagine destroying a happy person to achieve equality among the remainder. Prioritarianism would call this worse, but if we intuitively see equality as gainful, that's problematic. Similarly in risk cases, ex post prioritarianism's preference for certain equality over risky Pareto-superiority mirrors classic levelling-down. 

  The user's proposed defeaters are sharp: if separable/Pareto views ever rank levelled-down outcomes higher via population ethics or risk, their first claim collapses. Case (i) already does this if we consider the original person's perspective - prioritarianism sacrifices her interests for aggregate concavity gains. That smells egalitarian. 

  On falsifiability: the package isn't quite circular yet, but close. To test it, we'd need clear cases where (a) "better-in-one-respect" intuitions survive person-affecting/debiasing filters and (b) prioritarianism endorses something indistinguishable from levelling-down under risk/population changes. The user's own cases might suffice! 

  Ultimate vulnerability: prioritarianism's concave weighting might secretly value equality when we examine its behavioral outputs in variable-population/risk contexts. If so, the "separability" defense becomes semantic. The user seems to sense this - hence requesting arguments that concave transforms aren't egalitarian in disguise.
answer: |-
  Based on your request for focused stress-testing rather than a survey, here's a map of vulnerabilities for your three-claim package, ranked by severity, with explicit classification of your pressure cases and analysis of defeaters:

  **Core Vulnerabilities (Ranked from Fatal to Awkward):**

  1.  **The Different-Numbers Challenge to Claim 1 & 3 (Potentially Fatal):**
      *   **Thrust:** Your Case (i) (`100` vs `20, 20, 20` under square-root priority) **is a genuine levelling-down problem *for prioritarianism*** in a different-numbers context. It violates "better for no one" *relative to the original person*. The lone individual at 100 *is made much worse off* (effectively destroyed or excluded) to create three worse-off individuals. Prioritarianism, via its concave weighting and totalism, *endorses* this destruction/exclusion for the sake of aggregate priority-weighted well-being among the *new* population.
      *   **Why it undermines Claim 1:** Claim 1 asserts prioritarianism avoids levelling-down because levelling-down strictly lowers the priority sum. Here, the "levelled-down" (or rather, "population-changed-to-lower-level") outcome *raises* the priority sum (`sqrt(20)+sqrt(20)+sqrt(20) ≈ 13.42*3 = 40.26 > sqrt(100) = 10`). **The mechanism enabling this is the concave transformation *combined* with adding people.** This looks *functionally identical* to valuing a more equal distribution *at a lower total*, achieved by harming (or removing) a better-off person – the core of levelling-down.
      *   **Why it undermines Claim 3:** Claim 3 asserts the objection can't be formulated outside same-number, risk-free cases. *This case formulates it:* "Is it acceptable to make someone (the person at 100) much worse off (or non-existent) *in order to* create a state of affairs where no one is better off than 20?" Prioritarianism answers "yes" if the aggregate concave-weighted gain outweighs the loss. This mirrors the egalitarian "yes" in same-number cases. The "better for no one" criterion *fails* here because the populations aren't identical – *that's the source of the problem*. Claim 3's jurisdictional move looks like special pleading to avoid this counterexample.
      *   **Dependency:** Critical-Level Prioritarianism (CLP) *can* potentially avoid this if the critical level is set high enough (e.g., >20). If CLP sets the level low or at zero, the problem remains. *Total* prioritarianism is highly vulnerable; *average* prioritarianism would likely reject Case (i) but faces other severe problems (e.g., repugnant conclusion). **This defeater forces a concession: Prioritarianism *can* endorse a form of levelling-down *across populations*.**

  2.  **The Ex Post Risk Challenge to Claim 1 & 3 (Serious Threat):**
      *   **Thrust:** Your Case (ii) (`(10,10)` vs `(30,0)/(0,30)` under *ex post* priority) **is a sibling objection that inherits the name and force.** It's *not* pure levelling-down (no one is made worse off to *achieve* equality; equality is the baseline). However, it *feels* analogous and leverages the same prioritarian mechanism (concave transformation penalizing inequality in final outcomes). The prioritarian *rejects* a Pareto-superior-in-expectation gamble *because* the potential unequal outcomes are so bad according to the concave function (`sqrt(10)+sqrt(10) ≈ 6.32 > 0.5*(sqrt(30)+sqrt(0)) + 0.5*(sqrt(0)+sqrt(30)) ≈ 0.5*(5.48 + 0) + 0.5*(0 + 5.48) = 5.48`).
      *   **Why it threatens Claim 1:** While strictly speaking not levelling-down, it demonstrates that the *same prioritarian aversion to inequality in outcomes* that protects it from *same-number* levelling-down also causes it to *reject Pareto improvements under risk* when evaluated ex post. This reveals a deep tension: the concave transform *is* doing egalitarian-like work in distributing bads (risk burden). It shows Claim 1's immunity is *contingent* on the simple same-number, risk-free case and doesn't generalize cleanly.
      *   **Why it threatens Claim 3:** Claim 3 dismisses risk cases because the Pareto constraint is contested. However, the *intuition* that rejecting the gamble is objectionable stems from the same root as levelling-down: sacrificing potential overall (expected) good to avoid inequality. Claim 3 risks dismissing this powerful intuition too quickly by jurisdictional fiat. **The objection *can* be formulated:** "Is it acceptable to forgo an action that increases everyone's expected well-being *solely* because it might result in an unequal outcome?" *Ex post* prioritarianism says "yes".
      *   **Dependency:** This challenge *only* applies to *ex post* versions. An *ex ante* prioritarian view (`concave transform of expected utility`) would accept the gamble (`0.5*conc(30) + 0.5*conc(0) > conc(10)` for concave `conc`). **A committed prioritarian must choose: Avoid the Case (ii) objection by adopting *ex ante* evaluation (facing other well-known objections to *ex ante*), or embrace *ex post* and concede this sibling objection.**

  3.  **The "Better-in-One-Respect" Challenge to Claim 2 (Awkward, Potentially Undermining):**
      *   **Thrust:** Your debunking explanation (Claim 2) might be incomplete. Suppose someone argues: "The *relational state* of non-domination (or absence of oppressive disparity) *itself* possesses non-instrumental value, even if it isn't 'better for' any individual *in terms of their personal welfare stock.*" This "better-in-one-respect" (equality/non-domination) could be a genuine axiological datum not reducible to person-affecting constraints or evidence of resentment.
      *   **Why it's awkward:** A monistic prioritarian *must* deny this. They must argue either that (a) non-domination *only* has value insofar as it instrumentally affects individual welfare (which might be empirically false - consider symbolic equality), or (b) any perceived intrinsic value of equality here *is* just the person-affecting constraint/illusion at work. This puts the prioritarian in the position of denying the *prima facie* plausibility of a distinct value.
      *   **Falsifiability of Claim 2:** Claim 2 is inherently difficult to falsify definitively, as any persistent intuition can be attributed to residual confounding factors ("you haven't stripped *everything* away"). However, it *can* be weakened if: (a) Cases arise where the "equality is better in one respect" intuition persists strongly even after controlling for resentment, evidence of refusal to help, *and* explicit acceptance of non-person-affecting values, or (b) A compelling positive theory is offered for *why* this relational state has irreducible value. **The package risks insulating itself by perpetually relocating the intuition to confounding factors.** While a common strategy in philosophy, its success depends on the residual intuition's strength and the availability of alternative explanations. This isn't fatal but makes the package less decisive.

  4.  **Shape/Dependency Vulnerabilities (Qualifying, Not Fatal):**
      *   **Unbounded Functions & Repugnance:** If the priority function is unbounded (e.g., `log(x)`), Case (i) becomes extreme (millions at barely-above-zero vs one superb being). Prioritarianism's endorsement here mirrors the Repugnant Conclusion, which many find intuitively objectionable in a way analogous to levelling-down (sacrificing excellence for vast mediocrity). *This depends on function shape and totalism.*
      *   **Extreme Concavity Approaching Equality:** If the priority function is extremely concave (e.g., approaching a Rawlsian leximin below a threshold), prioritarianism *effectively* values equality at low levels, making it vulnerable to *same-number* levelling-down objections near that threshold. *This depends on function shape.*

  **Classification of Your Cases:**

  *   **Case (i) (100 vs 20,20,20):** **Genuine levelling-down problem for (Total) Prioritarianism.** It demonstrates that prioritarianism, via population ethics + concave transform, *can* endorse making specific individuals (the original high-welfare person) worse off or non-existent to create a larger population at a lower, more equal (or priority-weighted superior) level. This directly counters Claims 1 and 3.
  *   **Case (ii) ((10,10) vs (30,0)/(0,30) ex post):** **A powerful sibling objection that inherits the name and force.** It's not pure levelling-down, but it exploits the *same core mechanism* (the concave transform's aversion to unequal outcomes) to reject a Pareto-superior-in-expectation gamble. This seriously challenges the generality of Claim 1's immunity and highlights the contingent nature of Claim 3's jurisdictional move regarding risk.

  **Assessment of the Package & Defeaters:**

  *   **Claim 1 (Immunity in Same-Number Cases):** Holds convincingly *only* for same-number, risk-free, fixed-population comparisons. **Defeated** by Case (i) (different numbers) and severely pressured by Case (ii) (ex-post risk).
  *   **Claim 2 (Debunking Intuition):** Plausible but **potentially insulated/unfalsifiable** in a way that weakens its force. The "better-in-one-respect" challenge highlights a point where prioritarianism might need to deny an intuitively plausible value. It survives but is bruised.
  *   **Claim 3 (Jurisdictional Limit):** **Fatally undermined** by Case (i). Different-number cases *do* allow the formulation of a clear levelling-down objection that prioritarianism (under totalism) fails. Case (ii) shows the jurisdictional move regarding risk dismisses a potent, analogous objection too easily.
  *   **Overall Package Vulnerability:** **Moderate-High.** The different-numbers case (i) provides the closest thing to your requested "decisive" counterexample: a separable, Pareto-satisfying (within fixed populations) view endorsing an outcome that *is* worse for a specific individual(s) and achieves a state where no one is better off than a lower level, primarily due to the concave transformation enabling gains from population increase at low welfare. The ex-post risk case (ii) provides a strong sibling objection. The debunking claim (2) remains defensible but relies on a strategy vulnerable to charges of unfalsifiability. The jurisdictional claim (3) collapses under population ethics. A committed prioritarian must concede the force of the different-numbers objection (likely arguing the benefits of the larger population outweigh the loss) and either embrace ex-post evaluation (owning the Case (ii) objection) or adopt ex-ante evaluation (facing other challenges). The package succeeds in showing prioritarianism avoids *core same-number* levelling-down but fails to establish broader immunity or fully defang the intuition's source.
