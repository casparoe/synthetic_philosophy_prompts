answer: |-
  Your description centers on a phenomenon where self-referential systems rely on an *external context* that cannot be fully internalized, creating a regress that recedes when formalized. This has no single established name in computer science or logic, but it aligns with concepts in foundational mathematics, philosophy, and systems theory. I'll address your three requests in order, carving the boundaries directly.

  ### 1. **Name and Literature**  
  The closest established notion is the **regress problem** (e.g., in epistemology or logic), but your specific focus—the *inescapable externality* and its *receding behavior*—lacks a universal label. Related ideas include:  
  - **Kleene's second recursion theorem** (self-replication in computability), but it ignores externality.  
  - **Gödel's incompleteness** (formal systems cannot prove their own consistency), which implies a necessary "outside," but it's about provability, not system bootstrapping.  
  - **Quine's "web of belief"** (philosophy): knowledge relies on an unfalsifiable periphery, but it's abstract.  

  Your "off-canvas background" resembles what philosophers call a **transcendental condition** (Kant) or **ultimate grounding problem** (Aristotle's "unmoved mover"). In computing, it's sometimes dubbed the **trusted computing base (TCB)** in security, but TCB is a deliberate design choice, not an inherent structural feature.  

  The claim that "some level must be untangled" is **folklore**, not a theorem. It arises from practical experience (e.g., compiler engineers accepting a seed binary) but isn't provable. Systems *can* be entirely self-contained (e.g., a quine), but they still execute on hardware/OS they don't control. The receding behavior is a **consequence of finitude**: any formalization requires resources (time, memory, human verification) outside itself.

  ### 2. **Carving Against Neighbor Concepts**  
  - **Meta-level hierarchy** (e.g., reflective towers in Lisp): Assumes discrete, stable levels. Your case differs because the "top" level isn't a fixed rung—it dissolves into context (e.g., the hardware executing the meta-circular evaluator).  
  - **Circularity/vicious regress** (e.g., Russell's paradox): Treats the loop as pathological. Your observation shows it's **productive** (e.g., compilers build themselves) but relies on externality.  
  - **Bootstrapping**: Focuses on the loop's mechanics, not the externality.  

  **Structural vs. Pragmatic Externality**:  
  - The externality is **structural**. In your compiler case, the binary executes on silicon; the schema validator runs as machine code. These aren't "levels" but distinct ontological layers (physical vs. symbolic).  
  - The "receding" behavior is **inevitable**, not careless engineering. Formalizing the background (e.g., writing a meta-meta-schema) creates a new system dependent on *its* context (e.g., the parser handling that schema). This mirrors Tarski's undefinability of truth: defining truth for a system requires a stronger metalanguage.  

  ### 3. **Term Coinage and Boundaries**  
  The best label is **groundless regress**, qualified as **computational**.  

  **Definition**:  
  A system exhibits computational groundless regress if:  
  - It is self-referential (it operates on or defines itself).  
  - It requires an external context for execution/validation.  
  - Attempts to internalize that context shift the regress to a new externality.  

  **Minimal Criteria**:  
  - Self-reference (e.g., compiler compiles itself, schema validates itself).  
  - Dependence on an unformalized background (e.g., hardware, initial seed).  
  - Internalization causes regression (e.g., rebuilding the compiler moves trust to the rebuild process).  

  **Boundary Cases**:  
  - **Exclude: Mutual recursion** (e.g., `is_even` calls `is_odd`). It terminates because it's **well-founded**: recursion depth decreases, anchoring to a base case (e.g., `is_even(0)=true`). No receding externality exists.  
  - **Exclude: Macro phasing** (e.g., Racket's phase separation). This is a **genuine tower**: each phase is strictly prior, forming a total order. Validation halts at the highest phase (e.g., phase-0 macros are trusted code). No regression occurs.  

  **Why "groundless regress"?**  
  - "Groundless" captures the lack of a fixed foundation.  
  - "Regress" emphasizes the infinite retreat upon internalization.  
  - "Computational" specifies the domain (systems, not abstract logic).  

  \answer{groundless regress (computational)}
