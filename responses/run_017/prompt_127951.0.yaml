prompt: |-
  I'm doing a piece for the mag on why smart people make bad long-term calls, and I keep tripping over what "irrational" even means once time gets involved. Going on gut:

  1. Al prefers Rome to Lisbon, Lisbon to Reykjavik, and Reykjavik to Rome, and will pay $10 each time to swap. He gets walked around the circle and ends up poorer. Irrational, obviously.
  2. Same guy, same cycle, but nobody ever offers him a swap — he books Rome and has a lovely time. Still irrational. The ordering itself is broken; whether some bookie shows up shouldn't matter.
  3. Bea in March would rather have a June trip than $500; come June she'd rather have the $500 and pays to cancel. She's coherent at every single moment, her tastes just moved. Not irrational. That's just life.
  4. Carla prefers $5 today to $10 tomorrow, but when both are a month out she prefers the $10. Every evening she resolves to wait, every morning she takes the $5, and she can see it coming and still does it. Irrational.
  5. Dee has a dial with a thousand settings; each click up is imperceptably worse and comes with $10,000. Every click is, at the moment, her own favourite option. She clicks to the top and wrecks her life. Irrational, and I don't care that each individual step was locally defensible.
  6. And here's the one I can't place: same cycle as Al's, except a benefactor pays him $10 for every swap, so he finishes with Rome and more cash than he started. Not exploited, enriched. Still feels off to me.

  My stab: it isn't about the money at all, it's about whether there's a plan you could adopt in advance and not later want to deviate from. But I can't make that do all the work. Is there a principle that gets 1 through 5 and settles 6? And what does it say about someone who goes halfway round the pump, cottons on, and then refuses every remaining swap — irrational for the first five hundred trades and rational for the rest, or what? Please also say plainly which of my verdicts you'd overturn.
reasoning: |-
  Okay, the user is writing an article about why smart people make bad long-term decisions and is struggling with defining "irrationality" when time is involved. They've provided six scenarios to illustrate different aspects of this problem and want a coherent principle that explains all of them. They've also shared their initial thoughts and want to know if any of their verdicts should be overturned.

  Looking at each scenario:

  1. Al's circular preferences (Rome > Lisbon > Reykjavik > Rome) with paid swaps lead him to lose money. Clearly irrational due to the preference cycle.

  2. Same circular preferences without swaps. The user correctly identifies that the ordering itself is irrational regardless of whether swaps occur.

  3. Bea changing her mind about a trip as time passes. The user sees this as rational preference change. I agree - this is a normal part of life.

  4. Carla's time inconsistency with money. She prefers $5 today over $10 tomorrow, but reverses when both are future-dated. Her inability to stick to resolutions makes this irrational.

  5. Dee incrementally destroying her life with imperceptible changes. Each step seems rational locally, but the overall outcome is catastrophic. The user correctly identifies this as irrational.

  The problematic case is #6: Al with the same circular preferences, but now a benefactor pays him for each swap. He ends up better off financially but with the same destination. The user feels this is "off" despite the improvement.

  I think the key is distinguishing between preference rationality and choice rationality. Preference cycles are inherently irrational because they violate transitivity - a fundamental requirement for coherent preferences. The payment in scenario #6 doesn't fix the underlying irrationality; it just compensates for it.

  For the halfway case where Al stops after recognizing the cycle: The initial swaps reveal the inconsistency, so continuing would be irrational once recognized. Stopping is the rational response to discovered irrationality.

  I wouldn't overturn any of the user's verdicts. Scenario #6 is irrational due to the underlying preference cycle, even with compensation. The money doesn't cure the core incoherence.

  The throughline is that rationality requires preferences to be both internally consistent (acyclic) and stable enough to support planning. Time introduces challenges, but doesn't excuse fundamental inconsistencies. Smart people might make bad long-term calls when they overlook how small inconsistencies or temporal biases compound, or when they fail to self-bind against predictable irrationalities.
answer: |-
  Your gut is sharp—you've nailed the core tension in time-dependent rationality. Let's unpack this with a principle that covers all cases, address your "halfway" question, and confirm/refine your verdicts.

  **The Core Principle: Rationality Requires Globally Defensible Preferences**  
  Rational long-term decisions require preferences that are:  
  - **Internally consistent** (acyclic, transitive)  
  - **Stable under foresight** (no predictable self-sabotage)  
  - **Robust to information** (won't reverse *solely* due to time passing, only new data)  

  Money/payments are red herrings; they expose inconsistencies but don't define them. Irrationality arises when preferences create unavoidable regret, exploitation, or self-damage *even when the agent sees it coming*.

  ---

  **Your Cases Analyzed:**  
  1. **Al (exploited):** Irrational.  
     - *Why:* Cyclic preferences violate internal consistency. Paying to swap reveals a willingness to pay for a net loss.  

  2. **Al (no swap):** **Still irrational.** (Your verdict correct)  
     - *Why:* The cycle itself is the flaw. Rational preferences *could* be cyclic (e.g., rock-paper-scissors), but not for *identical states*. Rome is Rome—no context change. The cycle implies no "best" choice exists, making long-term planning incoherent.  

  3. **Bea (changing tastes):** Rational. (Your verdict correct)  
     - *Why:* New information (time passing, changing desires) justifies preference shifts. No inconsistency—each choice is optimal *given her state at that time*.  

  4. **Carla (time inconsistency):** Irrational.  
     - *Why:* Predictable, unavoidable self-sabotage. She *knows* she'll regret taking $5 today but can't stop. Violates **stability under foresight**.  

  5. **Dee (slippery slope):** Irrational.  
     - *Why:* "Locally defensible" steps hide global ruin. Violates **robustness to incremental change**. Rationality requires recognizing cumulative consequences beyond immediate perception.  

  6. **Al (benefactor pays):** **Irrational** (overturning your "feels off but enriched" verdict).  
     - *Why:* The $10 payments mask but don't fix the core flaw. Al still has cyclic preferences; he just profits from acting on them. But rationality isn't about outcomes—it's about preference coherence. If offered a *free* swap back to Lisbon after ending at Rome, he'd pay $10 *again* to return to his "less preferred" start. Enrichment doesn't cure the cycle.  

  ---

  **The Halfway Case:**  
  *Al cycles 500 swaps, realizes the pump, then refuses further swaps.*  
  - **First 500 swaps:** Irrational (acting on cyclic preferences).  
  - **Refusing further swaps:** Rational.  
  - **Overall:** A rational *response* to discovering irrationality. He can't undo past inconsistency, but he halts it. Like an addict quitting mid-binge—late, but better than continuing.  

  ---

  **Why Your "Plan in Advance" Idea Almost Works (But Not Quite)**  
  Your instinct about a "plan you wouldn't deviate from" is the heart of **Strotz-Pollak-Epstein rationality**: true rationality means adopting a strategy your future selves won't rebel against. This perfectly covers Carla (she *wants* to commit to waiting but can't) and Dee (she'd reject the dial if she saw the endpoint).  

  **Where it needs refinement:**  
  - Bea *can* deviate rationally (new info).  
  - Al's cycle is irrational *even without planning* (incoherent at a single point in time).  

  **The Unified Principle:**  
  A person is irrational if their preferences **inevitably lead to dominated choices** (e.g., Al paying to lose; Carla preferring future $10 but never getting it) or **cannot be represented by any stable, consistent long-term utility function**.  

  ---

  **Summary of Verdicts:**  
  | Case | Your Verdict | My Verdict | Why |  
  |------|--------------|------------|-----|  
  | 1 (Al exploited) | Irrational | Irrational | Cyclic prefs → exploitation |  
  | 2 (Al no swap) | Irrational | Irrational | Cycle exists, invalidates planning |  
  | 3 (Bea) | Rational | Rational | Tastes changed, no inconsistency |  
  | 4 (Carla) | Irrational | Irrational | Predictable time inconsistency |  
  | 5 (Dee) | Irrational | Irrational | Local steps hide global ruin |  
  | 6 (Al paid) | "Feels off" | **Irrational** | Cycle persists; enrichment irrelevant |  

  **Key Insight for Your Article:**  
  Smart people fail long-term not because they’re "dumb," but because rationality is multidimensional. They optimize locally (Al's swaps, Dee's clicks, Carla's morning impulse) while neglecting global coherence. Time turns small inconsistencies into catastrophes—and money often obscures the error (as in Case 6). Rationality isn't just logic; it's the *architecture* of desire surviving temporal erosion.
