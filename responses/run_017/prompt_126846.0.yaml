prompt: |-
  I write novels, and I've agreed to run a nintey-minute evening session at the writers' centre next month. About a dozen people, mostly novelists plus two poets, nobody with any philosophy, and at least two of them will arrive believing that theory is a machine for spoiling stories. The session is nominally about writing from the inside of an experience you haven't had, and I want the Mary case to be its spine: the neuroscientist who has spent her whole life in a black-and-white room, knows every physical fact about colour vision there is to know, and then walks out and sees a red tomato for the first time. My group already half-knows this one and half-misuses it, which is why I'd rather build on it than on something new.

  So please don't explain the argument to me. Plan how I should explain it to them.

  What I need:

  The order the pieces have to go in, and what depends on what. I don't want a list of points that could be shuffled; I want to know which thing has to be in place before the next thing is even intelligible, and which bit will collapse the session if I put it too early.

  The one carrying example, and what it has to have and what it has to lack. My instinct is that it should not be a character from my own work in progress, but tell me if I'm being precious about that.

  My worry about completeness. If Mary doesn't know which physical state she's in when the tomato shows up, her surprise looks like she merely learned a boring fact, and then nothing is threatened. Where does that have to go in the sequence, and can it be done in fifteen minutes for people who have never met the word indexical? If it can't, tell me what to sacrifice.

  The emotion swap. Someone will say within the first ten minutes that it's just like writing grief before you've lost anyone. My instinct is that grief is not like red, because having grief seems to require a pile of beliefs and a history, and that this difference quietly makes the case weaker rather than stronger, so I should hold the swap back rather than lean on it. Tell me whether that instinct is wrong, and if it is, what the right thing to do with the swap is.

  Misconceptions, in the order they'll actually form. The ones I expect: that the case simply refutes physicalism; that it shows a machine could never be conscious; that its moral is that we can't imagine other people's experience; that Mary's surprise is just a broken expectation and therefore proves nothing. Correct any of those I've got wrong, tell me the order they'll arrive in, and say where in the session to head each off — I'd much rather defuse them at the moment they form than deal with them in a summary at the end.

  Where I say out loud that the philosophers don't agree, without it feeling like a cop-out. This group will want a verdict and I don't have one.

  One question to put to the room at the end that would show they'd got the argument rather than just absorbed its atmosphere, and a different one that would show they'd got something usable for their own manuscripts.

  And tell me plainly what to refuse to get into at this level. I'm guessing the zombie thing, representationalism, and the phenomenal-concept business, but I want to know which one I'll be most tempted by, why it will eat the hour and a half, and what I should say instead when someone asks me about it.
reasoning: |-
  Okay, the user is a novelist preparing a 90-minute session for fellow writers using the Mary's Room thought experiment. They need a structured plan that builds understanding sequentially, avoids philosophical jargon, and connects to writing practice. 

  First, I need to map the logical dependencies of the argument. The room setup must come first - Mary's isolation and exhaustive knowledge. Only then can her surprise upon seeing color make sense. If I reverse this, the impact collapses. Next comes the core claim: her new knowledge. This must be presented as experiential ("what it's like") not factual, otherwise participants will dismiss it as trivial. 

  The carrying example is crucial. It must be simple and sensory - maybe tasting honey for the first time? Needs to lack cultural baggage (unlike wine) and have zero prior associative learning. Can't be their own characters; that risks derailing into manuscript talk. 

  The completeness worry is valid. I'll need to explicitly block the "indexical" misunderstanding early by saying: "She knows exactly which brain state occurs when humans see red - she just doesn't know it as her own state." Should take 3 minutes max with a concrete analogy like knowing all facts about Paris vs. being there. 

  Ah, the grief comparison. User's instinct is sharp - grief has cognitive layers color doesn't. If someone raises it early, I'll acknowledge the surface similarity but park it: "We'll come back to why that's different once we've seen how Mary works." Later, I can use it to show how the argument applies only to raw qualia. 

  Misconceptions will cascade: 
  First will be "So physicalism is dead?" - shut this down immediately by emphasizing it's about knowledge, not ontology. 
  Then "See, robots can't feel!" - pivot to how it's about the gap between descriptions and experience, not mechanism. 
  The "broken expectation" one is trickiest - I'll preempt it by stressing Mary predicted everything except the experience itself. 

  For the no-consensus issue, I'll frame it positively: "This gives you tools to ask better questions about your characters' inner worlds." 

  Final questions: 
  Understanding check: "Could Mary have written an accurate description of seeing red while in the room?" 
  Application: "What's one sensation your protagonist knows factually but hasn't yet experienced?" 

  And yes, absolutely ban zombies. The moment someone says "p-zombies," I'll counter: "That's a different thought experiment - here we care only about what Mary learns, not about hypothetical duplicates." 

  The user's anxiety about completeness suggests they might over-explain. I should remind them: imperfect clarity beats perfect confusion. Writers just need the gap between description and lived sensation - that's the gold for their craft.
answer: |-
  Here’s a battle-tested plan for your session, structured to build understanding sequentially, sidestep pitfalls, and keep writers engaged. Prioritize **clarity over completeness**—your goal is to give them a working tool, not a philosophy degree.

  ---

  ### **The Sequence (Non-Negotiable Order)**
  1. **Set Up Mary’s World (5 mins)**  
     - *What they need first:* Describe Mary’s black-and-white room, her total knowledge of *all physical facts* about color vision (wavelengths, retinal cells, brain processes), and her expertise.  
     - **Crucial:** Emphasize "physical facts = everything describable by physics, chemistry, neuroscience."  
     - *Why this first?* Without grasping the totality of her knowledge, her later surprise seems trivial.

  2. **The Release & The Surprise (10 mins)**  
     - *What depends on #1:* Mary steps out, sees a red tomato, and experiences **surprise**.  
     - **Key phrasing:** "She learns *what it is like* to see red." Not a new fact *about* red, but the *subjective experience* itself.  
     - *Risk if skipped:* They’ll think she just learned "tomatoes are red"—which she already knew.

  3. **The Claim (The "Gap") (5 mins)**  
     - *What depends on #2:* Therefore, Mary learned something **new**. But physicalism says *all facts* are physical facts. So... is there a non-physical fact about consciousness?  
     - **Use this analogy:** "Knowing every fact about Beethoven’s 5th Symphony ≠ hearing it performed live."  
     - *Why now?* The argument only bites if #1 and #2 are crystal clear.

  ---

  ### **The Carrying Example**  
  **Use tasting honey for the first time.**  
  - **Why it works:**  
    - Sensory (like color), universal, no backstory needed.  
    - *Has:* A clear "what it’s like" (sweetness, texture) that can’t be conveyed by descriptions.  
    - *Lacks:* Emotional/cultural baggage (unlike grief or love).  
  - **Why not your character?** You’re right—it risks narcissism or derailing into workshopping. Stay neutral.

  ---

  ### **Handling "Completeness" (Your Biggest Worry)**  
  **Do this IMMEDIATELY after #2 (The Surprise):**  
  - *The fix (3 mins max):* "But wait—*didn’t Mary know her own brain would light up in area V4 when seeing red?* Yes! But imagine knowing *every detail* of a Parisian sunset—the light angles, the atmospheric particles—yet never seeing color. She knew the *theory* of ‘red-experience’ but not the *experience itself*."  
  - **No jargon needed:** Call it "the difference between knowing *about* and *being in* the moment." Writers get this.  
  - *Sacrifice:* Don’t dive into "indexicals" or "acquaintance knowledge." Label it "experiential knowledge" and move on.

  ---

  ### **The "Grief Swap" Instinct**  
  **Your instinct is CORRECT.** Grief is a poor analogy here.  
  - **Why:** Grief requires cognitive/emotional scaffolding (e.g., "I loved X; X is gone"). Color is raw sensation.  
  - **When it comes up (and it will):**  
     - Acknowledge it ("Great point—many writers use this!").  
     - Then pivot: "But grief blends *beliefs* with *feelings*. Mary’s case is purer: just the sensation. That’s why it’s philosopher catnip."  
     - **Save it for later:** Use it in Q&A to discuss *applying* the thought experiment to complex emotions.

  ---

  ### **Misconceptions: Order & Defusal**  
  *(Likely order they’ll arise, with preemptive strikes)*  

  1. **"This refutes physicalism!"** (Will surface at #3)  
     - **Defuse at #3:** "Philosophers disagree! Some say Mary gains a *new way of knowing* physical facts, not a new fact. The point isn’t the verdict—it’s the *gap* between description and experience."  

  2. **"Machines can’t be conscious!"** (May follow #3)  
     - **Shut down fast:** "This isn’t about machines! It’s about the *limits of knowledge*. Could a perfect AI *simulate* color vision yet miss the experience? Maybe—but that’s a separate debate."  

  3. **"We can’t imagine others’ experiences!"** (Likely during Q&A)  
     - **Reframe:** "Yes—but Mary’s case asks: *Why not?* Is it because experience is fundamentally beyond objective description?" Tie this to writing: "Do we cheat by using metaphor?"  

  4. **"Mary just had a broken expectation!"** (Biggest threat; arises at #2)  
     - **Preempt at #2:** "But she *knew* her brain would react this way! Her surprise isn’t about *what happens*—it’s about *what it feels like*. Like knowing you’ll get a shot, but still gasping at the sting."  

  ---

  ### **The "No Consensus" Talk**  
  **Do this AFTER #3 (The Claim):**  
  - *Script:* "Now—do philosophers agree Mary learns something non-physical? Nope! Physicalists have slick replies (e.g., ‘She gained a skill, not knowledge’). But for us writers, the power is in the *tension*: the chasm between describing an experience and living it. That’s where your manuscripts live."  
  - **Not a cop-out:** Position it as liberating—they get the *tool* without needing the answer.

  ---

  ### **Final Questions**  
  1. **Understanding check:**  
     *"Could Mary, while in the room, have written a scene where a character sees red that would feel authentic to someone who’s seen color? Why/why not?"*  
     (Tests grasp of the "gap")  

  2. **Usable for manuscripts:**  
     *"What’s one sensation (e.g., fear of heights, tasting durian) your protagonist knows ‘factually’ but hasn’t experienced? How might you highlight that gap?"*  

  ---

  ### **What to REFUSE (Politely)**  
  - **Zombies:** "That’s a different thought experiment—let’s stay focused on Mary’s *learning*, not consciousness itself!"  
  - **Phenomenal concepts:** "Some philosophers think Mary just gains a new *concept*—but that’s a rabbit hole for another day!"  
  - **Representationalism:** "Ah, that’s about whether experience is just ‘representing’ the world—fascinating, but it’ll eat our time!"  

  **Why you’ll be tempted by zombies:** They feel adjacent ("If Mary learns something non-physical, are zombies possible?"). It’s seductive but derails into sci-fi. **Instead say:** "Zombies ask if consciousness *exists*—Mary asks if it can be *described*. We’re doing the latter today."  

  ---

  ### **Session Flow**  
  - 0–20 mins: Steps 1–3 (Mary’s story + the claim)  
  - 20–30 mins: Completeness fix + honey example  
  - 30–50 mins: Misconception patrol + "no consensus" talk  
  - 50–75 mins: Writerly applications (e.g., "Describe ‘seeing red’ as Mary pre-release")  
  - 75–90 mins: Final questions + wrap-up  

  **You’ve got this.** Lean into the writers’ craft: They intuitively understand the ineffable. Mary just gives them a lens to see it.
