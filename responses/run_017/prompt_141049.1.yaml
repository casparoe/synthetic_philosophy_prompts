prompt: |-
  I'm TAing an intro-level semantics/pragmatics course this term and the slur unit always goes sideways, so before we get to the readings proper I want to nail down what we should even be asking of a theory here. Could you write me a desiderata list: what would an adequate account of slurs have to deliver — the data it has to predict, the distinctions it can't collapse, the things we already know about language it can't contradict — with the case or consideration behind each one, and a note on which are non-negotiable and which are really just commitments of one camp smuggled in as criteria. Also tell me which single requirement eliminates the most candidate theories, and whether any subset of your own list looks jointly unsatisfiable; if the list is self-contradictory I'd much rather find out now than after I've handed it out.

  A few distinctions I think it has to respect, but you tell me if I'm overrating them: offensive-to-hear vs. derogatory-toward-the-target vs. actually harmful, which everyone in section keeps running together even though they seem to come apart (a slur yelled at nobody in an empty room; a perfectly neutral word used to sneer; a slur used by someone with so little credibility that nobody believes them). Slur vs. ordinary pejorative vs. generic insult — 'idiot' or 'cow' can wound but don't feel like the same kind of object as a slur, and there are slurs about which nobody can even agree who the target group is meant to be. And the embedding behaviour: a slur tucked inside a negation, a yes/no question, a conditional antecedent, or an 'I don't think…' still seems to offend in a way that a descriptive predicate plus a sneer doesn't, which is the standard argument against just treating the nasty part as one more conjunct.

  I'd also want the list tested against weird cases rather than the two or three examples everyone always uses, so make sure your criteria say something about: (1) a slur with no history behind it — a friend of mine who builds conlangs made up a word for people born in February and used it exactly the way a real slur gets used, and it just isn't offensive, though everyone can tell what it's meant to do; why not, and does a theory have to explain that? (2) a slur whose target nobody can identify any more, where old recordings of it still make people flinch. (3) dubbing a film where the original slur has no counterpart, so the translator reaches for a slur aimed at a completely different group — now you've insulted a group that isn't in the scene at all. (4) no speaker intentions in the picture whatsoever: a parrot, a screen reader reciting an archived comment, an autocomplete finishing the phrase. (5) out-group self-application ('I was being such a ___ about it'), which is awkward in a different way from in-group reclamation. (6) why some slurs get reclaimed and others stay permanently radioactive, and whether the theory has to predict which or can just note it case by case. As for what the theory is adequate for: I want it to explain what gets communicated and what's lost when you swap a slur for its neutral counterpart, and to take a position on whether the offense lives in the linguistic meaning or downstream of it — I don't need it to settle moderation policy. If it's cheap, add a short scorecard at the end for the four-ish families I'll be teaching (descriptivist/truth-conditional, semantic-expressivist, pragmatic or conventional-implicature style, and the prohibitionist one where the whole word is banned rather than some piece of content), but keep the weight on the criteria.
reasoning: |-
  Alright, let me tackle this query step by step. The user is a TA preparing for a slur unit in a semantics/pragmatics course and wants a robust desiderata list to frame discussions. 

  First, I need to unpack their core request: they want criteria that separate viable theories from inadequate ones, with clear justifications. They also highlighted specific distinctions students often conflate (offensive-to-hear vs. derogatory vs. harmful) and edge cases like novel slurs or historical slurs. 

  Hmm, the user's clearly experienced—they're anticipating pitfalls like smuggled assumptions and theoretical contradictions. Their examples suggest they want criteria stress-tested against non-standard cases (parrots, conlangs, etc.), not just textbook examples. The subtext: they're tired of discussions derailing over definitional vagueness. 

  Key angles to cover: 
  - **Non-negotiable vs. contingent criteria**: Must separate universal linguistic phenomena (e.g., embedding behavior) from theory-dependent claims (e.g., whether offense requires speaker intention). 
  - **Edge cases matter**: The February slur example challenges theories that root offensiveness solely in history. If a theory can't explain why it's harmless, it's flawed. 
  - **Embedding is critical**: That's the atomic bomb test—theories treating slurs as descriptive+attitude often fail here. 
  - **Reclamation asymmetry**: Why some slurs (like "queer") reclaim but others don't might hinge on social power, not semantics. A theory shouldn't *have* to predict this, but should accommodate it. 

  Biggest tripwire: **Embedding Immunity**. Many theories (especially descriptivist or simple CI models) crumble when slurs offend inside negations or questions. Expressivist or prohibitionist approaches handle this better but face other issues. 

  Contradiction watch: **Inert History + Target Flexibility** seems shaky. If offensiveness requires historical oppression (Inert History), how can a slur target a fictional group (Target Flexibility)? But maybe the resolution is that oppression must be *possible*, not actual. 

  For the scorecard, I'll shorthand major theories: 
  - **Descriptivist**: Fails embedding, inert history, and parrot cases. 
  - **Expressivist**: Nails embedding and non-intentional cases but struggles with inert history. 
  - **CI/Pragmatic**: Mixed—embedding is okay-ish, but parrot cases problematic. 
  - **Prohibitionist**: Handles embedding and parrots but overgeneralizes (all slurs equally toxic?) and ignores reclamation. 

  Final checklist: Did I... 
  - Cover all their weird cases? (Yes, including dub mismatches and out-group self-use.) 
  - Flag non-negotiables? (Yes, e.g., Semantic Opacity, Embedding Immunity.) 
  - Avoid smuggling biases? (Called out where criteria aren't universal, e.g., Speaker Intention Requirement.) 
  - Highlight the biggest theory-killer? (Embedding Immunity.) 
  - Address potential contradictions? (Noted Inert History + Target Flexibility tension but offered resolution.) 

  This should give the TA a framework to preempt circular debates. Time to structure the output clearly...
answer: |-
  Here's a desiderata list for a theory of slurs, designed for your intro course. It separates non-negotiable linguistic phenomena from theory-dependent commitments, incorporates your distinctions and edge cases, and identifies key pitfalls. Criteria are ordered by foundational importance.

  ---

  ### **Core Desiderata for a Theory of Slurs**
  *(Non-negotiables in **bold**; theory-dependent or contested in *italics*)*

  1.  **Semantic Opacity/Derogatory Force:**
      *   **The theory MUST account for why slurs are derogatory *even when no derogatory intention is present* and *regardless of the speaker's attitudes*.**
      *   *Case:* Parrots, screen readers, accidental utterances, reciting historical texts. The word itself carries offense potential independently of the current speaker's state of mind. Eliminates naive "it's just about speaker meaning" theories.
      *   *Non-negotiable.*

  2.  **Embedding Immunity (The Big Eliminator):**
      *   **The theory MUST explain why slurs often retain offensive potential under negation, in questions, conditionals, attitude reports, and quotation.**
      *   *Case:* "He's not a k\*\*\*," "Is she a w\*\*\*?", "If he were a f\*\*\*, I wouldn't care," "She thinks he's a t\*\*\*\*," "He called me a 'g\*\*\*'." This contrasts sharply with descriptive pejoratives ("idiot") + sneer, where embedding typically cancels the force (*"He's not an idiot"* isn't typically offensive). Standard argument against simple truth-conditional conjunctive analyses ("means P & is despicable").
      *   *Non-negotiable.* **This eliminates the most candidate theories**, especially simple descriptivist/truth-conditional conjunctive views and weak pragmatic accounts.

  3.  **Neutral Counterpart Contrast:**
      *   **The theory MUST account for the systematic meaning difference between a slur (S) and its neutral counterpart (NC) (e.g., "k\*\*\*" vs. "Jew").**
      *   *Case:* Swapping S for NC changes communicative content beyond mere descriptive reference. NCs are neutral; Ss are inherently loaded. The theory must explain *what* this loaded content/force is and how it differs from adding an expressive like "f\*\*\*ing Jew".
      *   *Non-negotiable.*

  4.  **Group-Targeting:**
      *   **The theory MUST explain how slurs pick out a specific target group based on perceived membership.**
      *   *Case:* Even slurs with contested boundaries ("redneck," "Karen") or historical ambiguity target *some* group perceived via social/biological criteria. Distinguishes them from generic insults ("jerk," "moron") which target behavior/traits, not group identity. (*Note:* This doesn't require the group to be coherent or the criteria accurate).
      *   *Non-negotiable.*

  5.  **Offense/Harm Potential:**
      *   **The theory MUST explain why slurs are reliably capable of causing offense/harm to targets, bystanders, and sometimes even speakers, in paradigmatic uses.**
      *   *Case:* This distinguishes slurs from merely taboo words ("f\*\*\*") or technical terms. The offense is linked to the *targeted group identity*. Explains reactions to old recordings, even if group identity is now obscure (your case #2).
      *   *Non-negotiable.* (Separating *potential* from *actual* harm/offense in specific contexts is crucial for avoiding conflation).

  6.  **Distinction from Pejoratives/Generic Insults:**
      *   **The theory MUST explain why slurs constitute a distinct semantic/pragmatic category from ordinary pejoratives ("idiot," "coward") and generic group-insults ("egghead," "jock").**
      *   *Case:* "Idiot" offends by attributing a negative property; slurs offend *primarily* by invoking group membership *itself* as contemptible/lesser. Explains why "idiot" embedded often loses force, while slurs don't (Embedding Immunity). Addresses your core distinction.
      *   *Non-negotiable.*

  7.  **Reclamation Potential:**
      *   **The theory MUST be compatible with the phenomenon of reclamation (in-group use stripping or reversing the derogatory force).**
      *   *Case:* "queer," "n\*\*\*\*\*," "b\*\*\*\*" used within the group. The theory needn't *predict* which slurs reclaim successfully (a complex socio-historical fact), but must allow that the word's meaning/force *can* shift contextually without losing its identity *as that slur*. Explains your case #6.
      *   *Non-negotiable* (for adequacy, not prediction).

  8.  **Target Flexibility (vs. Inert History):**
      *   *The theory SHOULD explain how slurs can target novel or fictive groups, yet depend on historical oppression for potency in real cases.*
      *   *Case:* Your conlang "February-born" slur (#1): It has the *form* and *intended function* of a slur but lacks the requisite history of oppression, hence no real offense. Conversely, a slur targeting a group that no longer exists or is unidentifiable (#2) retains offense *due to* that history. This challenges theories making offense purely conventional or speaker-intention-dependent. *Theory-dependent commitment of socio-historically grounded views (common in expressivism/pragmatics).*

  9.  **Offense/Harm Mechanism Tripartite Separation:**
      *   *The theory SHOULD provide tools to distinguish:*
          *   *a)* **Offensive-to-Hear:** Causing discomfort/upset to hearers (bystanders/targets).
          *   *b)* **Derogatory-toward-Target:** Expressing contempt for the group *as such*.
          *   *c)* **Actually Harmful:** Contributing to discrimination, violence, or material disadvantage.
      *   *Case:* Your empty room yell (#1 variant) might be *derogatory* (expressing contempt for the group) but neither *offensive* (no hearers) nor *harmful* (no impact). A sneered NC might be *offensive* and *harmful* but arguably not *derogatory* in the same group-targeting way. Low-credibility speaker might fail to harm but still offend/derogate. *Crucial for clarity, but the *weight* placed on explaining each aspect is theory-dependent.*

  10. **Non-Intentional Offense Transmission:**
      *   *The theory SHOULD account for how offense/derogation is transmitted without original speaker intention and persists across contexts.*
      *   *Case:* Film dubbing (#3): Translating slur S1 (Group A) to slur S2 (Group B) *derogates Group B*, even though the original scene targeted Group A. The translator didn't *intend* to derogate B, but S2's inherent force does so. Screen readers, parrots (#4). *Challenges pure speaker-intention theories. Favors semantic or conventional force accounts.*

  11. **Out-group Self-Application:**
      *   *The theory SHOULD explain the awkward, often ironic or self-deprecating nature of out-group member self-application (non-reclaimed).*
      *   *Case:* "I was being such a [slur for my own group]" (#5). This differs from true reclamation (affirmative) and in-group derogation. Often signals internalized prejudice or awkward distancing. Tests theories of "ownership" and contextual flexibility. *Important edge case, theory-dependent depth of explanation needed.*

  12. **Meaning vs. Use Location:**
      *   *The theory MUST take a clear position on whether the derogatory/offensive component is part of the word's linguistic meaning (semantic) or arises robustly from conventions of use (pragmatic/CI).*
      *   *Case:* Core to the theoretical debate. Impacts how the theory handles embedding, opacity, and NC contrast. *Non-negotiable that it takes a position, but *where* it locates the content is the core theoretical choice.*

  ---

  ### **Potential Tension in the List**
  *   **Inert History (#8) vs. Target Flexibility (#4):** Can a theory robustly explain why a novel slur (*February-born*) lacks offense *because* of no history, while simultaneously explaining how a slur can target a *novel or poorly defined group* **if** that group is oppressed? *Resolution:* The key isn't the group's *current* identifiability or novelty *per se*, but the existence (or perceived existence) of a *socially salient oppression dynamic* associated with the term. The conlang case lacks this dynamic entirely. The "obscure target" case retains the link to a *known historical* dynamic. This tension pushes theories towards incorporating socio-historical context directly or indirectly.

  ---

  ### **Quick Theory Scorecard**
  *(How well do major families handle the **Non-Negotiables**?)*

  1.  **Descriptivist/Truth-Conditional (e.g., "means NC & despicable"):**
      *   **Fails:** Embedding Immunity (#2 - "He's not a k\*\*\*" shouldn't be offensive), Semantic Opacity (#1 - parrots shouldn't derogate), often struggles with Reclamation (#7).
      *   **Handles:** NC Contrast (#3), Group-Targeting (#4).

  2.  **Semantic Expressivism (e.g., directly expresses contempt):**
      *   **Handles Well:** Embedding Immunity (#2 - expressive content projects), Semantic Opacity (#1), NC Contrast (#3), Group-Targeting (#4), Offense Potential (#5), Distinction (#6).
      *   **Struggles With:** Inert History (#8 - why doesn't the conlang word express contempt?), sometimes Reclamation (#7 - how does the expression flip?).

  3.  **Conventional Implicature (CI) / Pragmatic (e.g., encodes non-truth-conditional derogation):**
      *   **Handles Well:** Embedding Immunity (#2 - CIs project), Semantic Opacity (#1 - conventional), NC Contrast (#3), Group-Targeting (#4), Offense Potential (#5), Distinction (#6).
      *   **Struggles With:** Inert History (#8), Parrots/Screen Readers (#4 - can conventions apply without a *speaker*?), Reclamation (#7 - changing conventions).

  4.  **Prohibitionism/Taboo (e.g., the word itself is banned, meaning secondary):**
      *   **Handles Well:** Semantic Opacity (#1), Embedding Immunity (#2 - the tabooed form itself is toxic), Offense Potential (#5).
      *   **Fails:** NC Contrast (#3 - doesn't explain the *systematic* contrast), Group-Targeting (#4 - why target *this* group?), Distinction (#6 - lumps slurs with other taboos), Reclamation (#7).

  ---

  **Key Takeaway for Your Section:** Hammer home the **Embedding Immunity** (#2) and **Semantic Opacity** (#1) data early. These are the most powerful tools for showing why simple "it's just descriptive + attitude" or "it's all about the speaker" theories fail. Use the conlang case (#1/Inert History #8) to challenge theories that can't incorporate socio-historical context. Emphasize the tripartite distinction (Offensive/Derogatory/Harmful - #9) to prevent conflation in discussion. The list *isn't* fundamentally contradictory, but **Inert History** requires careful handling relative to group identification. Good luck!
