  **Overall Mark:** 16/20  
  **Overall Comment:** A sophisticated answer demonstrating good grasp of the concepts and effective engagement with the hypothetical, but let down by significant errors in part (c) weakening its application of Hart.

  **Part (a) Specific Comments [Mark: 4/4]**  
  *What is right:* Correctly defines both theses (extreme: law against *any* conduct members regard as immoral; moderate: law only where toleration endangers society). Accurately identifies the moderate thesis as required by the Aetolian case, as the bill explicitly grounds criminalisation in societal preservation (dissolving the bond holding society together), not bare immorality.  
  *What is wrong/missing:* Nothing material. All key elements are present and accurate within the sentence limit.  
  *What would earn marks:* This answer earns full marks by concisely and accurately fulfilling the requirements.

  **Part (b) Specific Comments [Mark: 8/8]**  
  *What is right:* Correctly argues Devlin’s argument *does not* support prohibition here. Powerfully identifies that Devlin’s disintegration thesis presupposes a shared *first-order moral code* as society’s "cement", which Aetolia explicitly lacks (stipulation iii). The point that Aetolia’s cohesion relies on a *convention of deference to law* – which is procedural/second-order, not substantive/moral – is well-made and directly engages the stipulation. Correctly notes this "habit of deference" is not a morality protectable by law. Appropriately concludes the limits-of-toleration standard does no work: the intense revulsion is mere majority disapproval (stipulation ii), which Devlin’s moderate thesis explicitly rejects as insufficient. The argument that this makes the bill an instance of the extreme thesis Devlin disowns is defensible and logically follows.  
  *What is wrong/missing:* Nothing significant. The answer fully and validly addresses both required elements (nature of cohesion, limits-of-toleration standard) using the stipulations.  
  *What would earn marks:* Full marks are earned for a compelling, accurate, and well-structured application of Devlin’s framework to the hypothetical, correctly using stipulations (i), (ii), and (iii).

  **Part (c) Specific Comments [Mark: 4/8]**  
  *What is right:* Correctly identifies that the Aetolians' revulsion rests on a *false belief* (contamination) and applies Devlin’s *reasonable person standard* effectively: a reasonable person knowing the truth would not feel revulsion, so the reaction fails Devlin’s own test. This directly addresses requirement (ii). The conclusion that vellin-use should remain lawful is correct on the stipulated facts.  
  *What is wrong/missing:* **Two major errors:**  
      1.  **Misapplication of Hart on the disintegration thesis (requirement i):** Hart’s first strand (as per handout) criticises Devlin for offering *no evidence* for the empirical claim (disintegration thesis). The candidate *invents* non-existent "comparative evidence" of jurisdictions decriminalising without collapse. This goes beyond Hart’s stated objection and fabricates supporting facts, contravening the instruction to take stipulations as given. Hart’s point undermines Devlin’s premise by highlighting its lack of foundation, not by asserting proven falsity.  
      2.  **Mischaracterisation of Legal Moralism/Paternalism:** The claim that criminalisation would be "pure legal moralism... the view that the law may coerce people for *their own good*" is incorrect. Legal moralism (defined in handout) is criminalisation *because conduct is immoral* or *to protect common morality from corruption*. Coercing for "own good" is *legal paternalism*, which the handout distinguishes. Vellin-use is targeted here to protect societal cohesion (a form of moralism per Devlin), not the participants' welfare.  
      *Additionally:* The invocation of the harm principle, state neutrality, and liberalism, while arguably correct policy, is not part of *Hart’s three stated replies* to Devlin (handout para 2) and earns no credit per the question’s warning against general restatement.  
  *What would earn marks:* For (i), correctly stating Hart’s objection is the *lack of evidence* for the disintegration thesis, not its proven falsity. For (ii), maintaining focus on Hart’s three strands (particularly his point about positive morality being open to critical scrutiny, which *could* encompass rejection based on false factual beliefs). Avoiding the conflation of moralism with paternalism and extraneous liberal arguments. Correctly applying the reasonable person point (as done here) would then contribute to a higher mark.
