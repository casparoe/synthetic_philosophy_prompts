prompt: |-
  I teach a third-year undergraduate seminar on the ethics of information: eighteen students, one ninety-minute session, and a room in which roughly a third of them grew up somewhere other than Germany or the United States and arrived with very different instincts about what the state is entitled to know. The session falls late in a unit on privacy and the state. The assigned reading is already handled; I do not want a fourth discussion of whether privacy is dead, and I do not want a debate about which country does it right. I want something they do.

  The thing I want them to run into is a distinction my students reliably collapse. They arrive treating transparency as a single dial: how much the state can see. I think there are at least three separable variables, and that most of the real disagreement lives in the space between them:

  - downward legibility: how much of a citizen's conduct reaches a durable record the state can consult;
  - upward legibility: how much of that record — and of the rule that turns it into a consequence — the citizen can inspect, contest, and correct;
  - automaticity: whether a bad record produces consequences on its own, or only through a human decision that someone can be asked to justify.

  Call the gap between the first and the second the reciprocity gap, and call the finite quantity of conduct a person can keep off the record in a given week — the errand paid for in cash, the message not sent, the visit not made — their opacity budget. My suspicion, which I would rather they discovered than were told, is that a polity can be extremely sparing in what it collects and still be harder to live under than one that collects far more, provided the reciprocity gap is wide and the consequences are automatic; and that the labor of keeping a second-order file on the state's file is itself an unequally distributed tax that nobody budgets for.

  So: design a game or structured simulation for that room and that clock. What I need:

  - Participants making real choices under real (small, symbolic) stakes — points, tokens, standing, a trivial prize. Nothing that costs me money and nothing I have to grade.
  - No lecture first, and ideally no vocabulary: the three variables, the reciprocity gap, and the opacity budget should go unnamed until the debrief, and I would prefer the words Germany, United States, and China not be spoken before then either. If you use my three national labels at all, treat them as the caricatures my students walk in with. The game must still work if I rename them three fictional cities, and it must not depend on any sociological claim about any of them being true.
  - Roles or secret cards that give different participants genuinely different reasons to want different settings of the dials, plus a mechanism — a veil, a rotation, a secret ballot, or something better — that stops the room converging on a mushy moderate compromise. I specifically want the instant at which someone who voted for high downward legibility discovers what it costs them, and the instant at which someone discovers they cannot correct a record they are not allowed to see.
  - A timeline with minutes attached, a materials list (index cards, a printed board, dice — I have a photocopier and no budget), and rules I can read aloud in under three minutes.
  - A debrief that maps named moments in play onto the variables and onto the two coined terms, and that uses at least one student's own inconsistency as its evidence rather than my assertion.
  - Your honest predictions of what will go wrong the first time I run it, with a remedy for each. I am especially interested in how to keep this from degenerating into an optimization puzzle, and in what to do with the student who refuses on principle to play the registrar.
  - A frank note on what the game cannot reproduce and that I will have to supply in my own voice. My guess is that it is something like the slow effect on what people dare to want, together with the fact that in actual systems almost no one is ever shown their score.

  Aim for something I can really run on a Tuesday afternoon: around a thousand words, prose and short lists, no citations, no reading list, no legal detail — any of that I will provide myself.

  Finish with a single machine-readable line and nothing after it:

  \answer{...}

  containing a phrase of ten words or fewer naming the one thing the game is engineered to make participants notice.
reasoning: |-
  We are designing a simulation game for a 90-minute seminar. The goal is to illustrate the three variables (downward legibility, upward legibility, automaticity) and the concepts of reciprocity gap and opacity budget without naming them until the debrief. The game should have real choices under symbolic stakes, roles that create divergent interests, and mechanisms to prevent compromise. It must avoid national comparisons and optimize for a classroom setting.

  Core idea: A game where students play as citizens in a fictional society. The society has a "Registry" that records certain actions and triggers consequences. The rules of the Registry are set by the players at the start, but they don't know how it will affect them until they play.

  Structure:
  - The game is played in rounds (representing weeks) over 5 rounds (each round ~10 minutes, total 50 minutes for play, plus setup and debrief).
  - Each player has a secret role card that gives them objectives (e.g., "You are a political activist: you gain 2 points for every week you attend a protest meeting" or "You are a small business owner: you gain 1 point for every transaction you make without using the state currency"). The roles create different needs for opacity and legibility.
  - The Registry has three dials that the players set at the beginning of the game (without knowing their roles yet). The dials correspond to our three variables:
    1. Downward Legibility (DL): What actions are recorded? (e.g., none, financial transactions, movement, associations)
    2. Upward Legibility (UL): What records can the citizen see? (e.g., none, only their own, everything)
    3. Automaticity (A): Are consequences automatic? (e.g., no consequences, manual review by a registrar, automatic fines/jail)

  - The setting of the dials is done by a secret ballot or a veil of ignorance: players vote on the rules without knowing their roles. Then roles are assigned randomly.

  Materials:
  - Role cards (18 cards, each with a unique role and scoring conditions)
  - Registry log (a spreadsheet or a public board where records are kept)
  - Tokens or points (use poker chips or just tally on paper)
  - Index cards for actions and for secret ballots
  - A timer

  Setup (10 minutes):
  1. Explain that we are simulating a society with a Registry. The Registry records certain actions and may impose consequences.
  2. Present the three dials to be set by vote. Describe them in plain language without the technical terms:

     - **What the Registry Sees (DL):** 
       Option A: Only financial transactions (using state currency)
       Option B: Financial transactions and movement (using public transport or major roads)
       Option C: Financial transactions, movement, and associations (meetings with more than 2 people)

     - **What You Can See (UL):**
       Option X: You can see nothing the Registry has about you.
       Option Y: You can see your own records but not others'.
       Option Z: You can see all records.

     - **How Consequences Work (A):**
       Option 1: No automatic consequences. A human registrar decides penalties for rule violations (if any rules are set).
       Option 2: Semi-automatic: Records are reviewed by a registrar who may impose penalties.
       Option 3: Fully automatic: The system imposes penalties immediately when a rule is violated.

     (Note: We haven't defined any rules for violations yet. We will add one rule: "Any meeting of more than 5 people is illegal unless registered." This rule is fixed and known to all. The rule is arbitrary and just for the game.)

  3. Conduct a secret ballot for each dial. Players vote without knowing their roles. Tally and set the rules.

  4. Assign roles randomly. Each role card has:
     - A description (e.g., "Activist", "Business Owner", "Student", "Retiree", "Immigrant", etc.)
     - A set of actions they can take each week (they choose one per week) and how they score points.
     - Some actions are "opaque" (hard to record) and some are "legible" (easy to record). But the player doesn't know which actions are recorded until the game starts.

  Example roles:
  - Activist: Can choose to attend a protest (illegal if >5 people, so risky) for 3 points, or a legal meeting for 1 point.
  - Business Owner: Can make a transaction using state currency (recorded) for 2 points, or in cash (unrecorded) for 1 point (but if caught by random audit, they lose 2 points and get a penalty).
  - Student: Can study at home (safe, 1 point) or attend a study group (which is a meeting, 2 points). They also have a part-time job: if they work, they get 1 point but it's recorded if the job uses state currency.
  - Retiree: Can visit a friend (movement recorded if using public transport) for 1 point, or stay home and garden (0 points but safe).

  5. Explain the actions and scoring. Each week, players choose one action from their role card and write it on an index card. They also have an "opacity budget": one extra action per week that they can take to avoid recording. They can use it to make one of their actions "opaque" (e.g., pay in cash, use a back road, meet in secret). They must decide when they submit their action.

  6. Assign one student to be the Registrar (if automaticity is not full, the Registrar will have work to do). If no one wants to be Registrar, assign randomly and allow them to swap with another player (but then they must take that player's role). The Registrar's job is to:
     - Collect the action cards.
     - Record the actions that are visible according to the DL setting.
     - Apply consequences if the system is manual or semi-automatic (for automatic, they just apply the rule).
     - For UL: if players are allowed to see, then after recording, show the records accordingly.

  Gameplay (5 rounds, each round ~10 minutes):
  1. Players choose their action and whether to use their opacity budget (one use per week). They write it on a card and hand it to the Registrar.
  2. Registrar records the actions that are visible (according to DL). For example, if DL is set to Option A (only financial transactions), then only business transactions are recorded. If a player uses opacity budget, that action is not recorded (unless the Registrar does an audit, see below).
  3. Registrar checks for rule violations (meetings of >5 people). If automaticity is Option 3 (full), then anyone who attended an illegal meeting is automatically penalized (lose 3 points). If Option 2 (semi), the Registrar decides. If Option 1 (manual), the Registrar decides but only if they notice (they have limited time and might miss some).
  4. If UL allows, the Registrar shows the records to the players (according to UL setting). If a player can see their own record and sees an error, they can contest (but only if UL allows seeing and the rules allow contesting). We can allow contesting if UL is at least Y. Contesting takes time and might fail.
  5. Players tally their points for the week (from their action and minus any penalties).

  Audit mechanism: The Registrar can audit one player per week if they wish (if the rules allow). They look at the action and if the player used opacity budget to hide an action that should have been recorded, then the player gets a penalty (lose 2 points). But if the player didn't hide anything, the Registrar loses 1 point (for wasting time). This adds tension.

  Debrief (30 minutes):
  - Start by asking: "What was frustrating? When did you feel unfairly treated?" Then: "What choices did you make to avoid the Registry? How did that cost you?" (This introduces opacity budget without naming it.)
  - Map moments in the game to the three variables. For example: "When the Registrar couldn't see your movement, that was the downward legibility setting. When you couldn't see what was recorded about you, that was upward legibility. When the penalty happened without anyone deciding, that was automaticity."
  - Reciprocity gap: "Who here had a record they couldn't see? Could you fix it? How much work was it? That gap between what the state sees and what you see is the reciprocity gap."
  - Use a student's inconsistency: "You [point to a student] voted for high downward legibility because you thought it would make things fair. Then you got penalized for a meeting you thought was small. But because you couldn't see the record, you couldn't prove it. How did that feel?"
  - Highlight the unequal tax: "Did anyone spend a lot of time trying to figure out how to avoid being recorded? What did that cost you in points? Now imagine that in real life: time, mental energy, risk."

  Predictions of what goes wrong:
  1. Problem: Students might not take the roles seriously and just try to maximize points without role-playing.
     Remedy: Emphasize the role-playing aspect. At the start, say: "Your goal is to fulfill your role's objectives. The points represent your success in life according to your role."

  2. Problem: The Registrar might be arbitrary or biased.
     Remedy: Tell the Registrar to be fair and explain that they are part of the system. Also, if UL is high, players can see and complain.

  3. Problem: The game might become an optimization puzzle, with players figuring out the best action regardless of the simulation.
     Remedy: Make the roles diverse enough that what is optimal for one is bad for another. Also, change the rule after round 2 (e.g., add a new rule: "All transactions over 10 units must be reported") to simulate changing laws and increase uncertainty.

  4. Problem: A student refuses to be Registrar.
     Remedy: Allow them to swap roles with another student. If they still refuse, assign the role to a volunteer and give that volunteer an incentive (e.g., they get an extra point each week for doing the job).

  5. Problem: Time runs short.
     Remedy: Use only 3 rounds instead of 5 if needed. Have a timer for each round.

  What the game cannot reproduce:
  - The slow effect on what people dare to want: The game is short-term. You'll have to explain that in real life, people change their behavior over years, avoiding certain activities altogether.
  - The fact that in real systems, almost no one is ever shown their score: In the game, players see their points. In reality, people often don't know why they were denied a loan or put on a watchlist.
  - The scale and complexity: Real systems have millions of records and complex algorithms.

  Machine-readable line:
  \answer{The unequal burden of managing one's visibility}
answer: |-
  ### The Opacity Auction Game

  **Overview**  
  Players act as citizens in a fictional city, earning "life points" by completing weekly actions. A "Registry" (managed by one player) records actions and imposes penalties based on three hidden dials set by group vote. Stakes: Points determine ranking; the top three get bragging rights or trivial rewards (e.g., picking the next reading). Roles create conflicting incentives, and secret ballots force trade-offs.  

  **Materials**  
  - 18 role cards (one per student)  
  - 18 index cards (for weekly actions)  
  - 3 poster boards labeled: "What Registry Sees," "What You See," "How Penalties Work"  
  - Tokens (e.g., poker chips) for points (100 total)  
  - Timer  
  - A die (for audits)  

  **Setup (10 min)**  
  1. **Assign Roles**: Randomly distribute role cards. Examples:  
     - *Activist*: Earn 3 points for organizing meetings (risky if large).  
     - *Cash Worker*: Earn 2 points for cash transactions (opaque), 1 point for digital (recorded).  
     - *Homebody*: Earn 1 point for staying home (safe), 3 points for public events (recorded).  
     - *Registrar*: Manages records/penalties; earns 1 point weekly. Rotate if refused—no penalty.  

  2. **Set Dials via Secret Ballot**:  
     - Players vote anonymously on three dials using slips. No discussion. Tally and display:  
       - *What Registry Sees*: (A) Only transactions, (B) Transactions + movements, (C) All actions.  
       - *What You See*: (X) Nothing, (Y) Only your records, (Z) All records.  
       - *How Penalties Work*: (1) Human review (Registrar decides), (2) Semi-auto (Registrar + die roll), (3) Full-auto (instant penalty).  

  3. **Explain Rules (3 min read-aloud)**:  
     - Each round (week), choose one action from your role card. Write it on an index card.  
     - You have one "free pass" weekly to make an action invisible (e.g., "pay cash" instead of digital).  
     - Registrar records actions based on "What Registry Sees." If illegal (e.g., meeting >5 people), apply penalties:  
       - Manual (1): Registrar chooses.  
       - Semi-auto (2): Die roll (4–6 = penalty).  
       - Full-auto (3): Always penalty (-2 points).  
     - If "What You See" allows, view records before penalties. Contest errors only if rules permit.  
     - **Audit**: Registrar rolls die once weekly. On 6, inspect one player; if they used "free pass" illegally, -3 points.  

  **Gameplay (5 rounds × 8 min = 40 min)**  
  1. *Action phase (3 min)*: Players write actions (+ "free pass" use) on cards. Submit to Registrar.  
  2. *Registry phase (3 min)*:  
     - Registrar records visible actions on posters.  
     - Checks illegal actions (e.g., large meetings), applies penalties per dial.  
     - If "What You See" = Y/Z, show records. Allow 60-second contests (e.g., "My meeting had 4 people!").  
  3. *Audit phase (2 min)*: Registrar rolls die for audit. Resolve.  
  4. *Point tally*: Update points.  

  **Debrief (25 min)**  
  1. **Frustrations**: Ask: "When did you feel cheated? Who couldn’t fix a mistake?"  
  2. **Map to Concepts**:  
     - *Downward legibility*: "When Registry saw your movement (dial B/C)—that’s what the state collects."  
     - *Upward legibility*: "When you couldn’t view records (dial X)—that’s what you can’t access."  
     - *Automaticity*: "When penalties happened instantly (dial 3)—no human check."  
     - *Reciprocity gap*: "Gap between dial A/B/C and X/Y/Z. Who paid to hide actions? That’s your *opacity budget*—the ‘free pass’ cost you opportunities."  
  3. **Use Inconsistency**: "You [point] voted for high collection (dial C) but used your free pass every round. Why? Because the reciprocity gap forced you to ‘budget’ your visibility."  
  4. **Real-world Link**: "This is why automatic fines + low upward legibility hurt more than high collection with fairness checks."  

  **Predictions & Remedies**  
  - **Problem**: Degenerates into optimization (e.g., everyone avoids risks).  
    *Remedy*: Roles with opposing incentives (e.g., Activist must hold meetings). After Round 2, add a rule: "Public events now give +1 point." Disrupts strategies.  
  - **Problem**: Registrar refusal.  
    *Remedy*: Assign as "civic duty"; allow swapping roles once. If still refused, skip audits—use die rolls for penalties.  
  - **Problem**: Time crunch in Registry phase.  
    *Remedy*: Prep pre-filled record sheets; limit contests to one sentence.  
  - **Problem**: Students debate real countries.  
    *Remedy*: Interrupt: "Here, we’re in fictional cities—focus on your role’s needs."  

  **What the Game Can’t Do**  
  - **Long-term effects**: The slow erosion of desire (e.g., avoiding activities for years) won’t emerge. *Supply in your voice*: "Real systems discourage daring by making visibility exhausting."  
  - **Hidden scores**: Players see points; real life hides algorithmic judgments. *Supply*: "You saw your ‘file’—most never do, which deepens power imbalances."  

  \answer{The reciprocity gap's unequal burden}
