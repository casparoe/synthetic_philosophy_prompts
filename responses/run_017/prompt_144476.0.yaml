  Also, the user might have deeper needs. They want their work to contribute to the debate on whether NNs have representations, positioning their method as resolving the skepticism. They might be seeking validation that their approach is sound and that basis drift doesn't undermine their claims. Providing a framing that turns basis drift from a nuisance into an insight about continuous representations strengthens their paper. They might also want to avoid overstatement, ensuring their claims are defensible while still being impactful.

