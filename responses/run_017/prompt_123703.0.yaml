prompt: |-
  I teach a graduate seminar on Berkeley's economic writings, and I have noticed that I hold firm verdicts about which arrangements are really money in the sense that concerns him — money as an instrument for setting a people to work, as against the store of metal that everyone mistakes for wealth — while being unable to bring those verdicts under a single principle. My own first formulation is this: an instrument is money only if (i) its acceptance rests on convention alone, none of its efficacy being owed to the stuff it is made of, and (ii) it is issued into circulation against goods actually produced or labour actually contracted for, so that more of it abroad means more industry, not more bullion.

  Tested against the cases, that formulation strains:

  - A guinea passing hand to hand in Dublin: money, and nothing about its being gold is what makes it so.
  - The same guinea sealed in a strongbox for forty years: still money, though clause (ii) should have retired it.
  - A banknote issued by discounting a linen merchant's bill of exchange: money, and paradigmatically so.
  - The same note after the bank suspends payment in silver, with everyone still taking it: still money, and I am tempted to say more securely so than before.
  - A setting-off of two merchants' mutual debts in a clearing house, with no instrument changing hands: not money — money cancelled rather than money used.
  - A landowner's personal bond, endorsed round a market town where his acres are well known: I want to call it money and mistrust the wanting.
  - A note issued against the mortgage of land, receivable in land at the holder's option — the device Berkeley proposed for an Irish national bank: money, and on a better footing than a note payable in silver.
  - A token with no issuer and a fixed supply, taken by thousands of merchants, exchanged almost entirely for other tokens: this is the case I go back and forth on; my instinct is to withhold the name, and I cannot say why in the terms of my own principle.
  - A pawn ticket for a coat, sold on at a discount: not money.

  Please test my principle against these, repair it or replace it, and say plainly which of my verdicts it cannot save. Then give its verdicts on two cases I have not listed: the entries in a modern commercial bank's deposit ledger, and a unit in which every shop quotes its prices but which no shop will accept in payment. Lead with the principle, and keep the whole answer under 500 words.
reasoning: |-
  Hmm, the user teaches a graduate seminar on Berkeley's economic writings and is grappling with defining money in Berkeley's sense. They've proposed a principle with two conditions: convention-based acceptance and issuance against actual production/labor. They've listed nine cases that challenge this principle and want me to test it, repair or replace it, identify which verdicts it can't save, and then apply it to two new cases - all under 500 words.

  Looking at their cases, I see several problems with their principle. The "sealed guinea" violates condition (ii) but is still money. The "landowner's bond" seems to satisfy both conditions but makes the user uneasy. The "fixed-supply token" defies both conditions but might still be money. Clearly, condition (i) is too narrow - even commodity money like gold has some efficacy from its material. And condition (ii) excludes stored value like the guinea.

  I need to shift focus to Berkeley's core concern: money as a social technology for mobilizing labor. The essential features seem to be: 1) functioning as a medium of exchange, 2) social convention enabling this function, and 3) being part of a system that directs economic activity. The issuance method matters less than whether the instrument actively circulates to facilitate production.

  Testing their verdicts against this view: The sealed guinea fails because it's not circulating. The landowner's bond is borderline because its acceptance depends on personal credit rather than broad convention. The fixed-supply token qualifies if it's widely accepted in exchange. The pawn ticket fails as it represents a specific claim rather than general purchasing power.

  For the new cases: Bank deposit entries clearly qualify as money - they're conventional, circulate through transfers, and mobilize resources. The price-quote-only unit isn't money because it lacks the key function of being accepted as payment.

  The user's unease about the landowner's bond reveals the need to emphasize generalized acceptability. And their instinct against the fixed-supply token suggests circulation matters more than issuance method. Berkeley's focus was always on money as an active instrument of industry, not passive store of value.
answer: |-
  Here is a repaired principle focused on Berkeley's core concern (money as an instrument mobilizing labor/industry):

  **Principle:** An instrument is Berkeleyan money if it functions as a *conventionally accepted medium of exchange within a system that directs productive capacity*. Its monetary character depends on its *circulation enabling transactions* and its *system linking units to potential productive effort*, not its material or specific backing at issuance.

  **Testing Your Cases & Repairs:**
  1.  **Guinea circulating:** Money. *Repair:* Condition (i) relaxed; material *can* contribute to convention/acceptance, but circulation is key.
  2.  **Guinea sealed:** **Not money.** It stores value but doesn't *circulate* to enable transactions or direct industry. *Your verdict saved* by emphasizing circulation/function over issuance backing.
  3.  **Banknote (discounted bill):** Money. Paradigmatic case of system directing industry via credit.
  4.  **Suspended note:** Money. Still circulates conventionally, enabling transactions and reflecting the system's productive capacity.
  5.  **Clearing house:** **Not money.** Facilitates exchange but is cancellation, not a circulating medium itself.
  6.  **Landowner's bond:** **Borderline/Not Money.** Highly localized acceptance & dependent on *personal* credit, not broad social convention/system. *Your unease diagnosed:* It lacks generalized acceptability.
  7.  **Land-bank note:** Money. Berkeley's ideal: convention links note directly to productive land/labor.
  8.  **Fixed-supply token:** **Money.** *If* conventionally accepted for exchange by thousands, it circulates and enables transactions within a system directing industry, regardless of fixed supply/no issuer. *Your principle failed:* It mistakenly required issuance against new production.
  9.  **Pawn ticket:** **Not money.** Represents a specific claim on a specific good, not a general medium of exchange.

  **Principle Verdicts on New Cases:**
  1.  **Bank deposit ledger entries:** **Money.** They function as the primary conventionally accepted medium of exchange via transfers/checks/debit cards, enabling vast transactions and directing industry within the banking system.
  2.  **Price-quote unit not accepted:** **Not money.** While a unit of account, it fails the core function: being a *medium of exchange*. It cannot be used to settle transactions or mobilize labor directly.
