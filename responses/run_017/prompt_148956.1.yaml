prompt: |-
  You are a political philosopher who works on the ethics of commemoration: public memory, monuments, honor, and the wrongs involved in either keeping or taking down. Please think carefully, and before you write anything, brainstorm at least five candidate principles and test each against every case below, discarding the ones that break. Do not cite anything, do not name-check the literature, and do not offer me readings or references; state the principle in your own terms.

  I sit on my university's committee on names and commemorations, and after two years of arguments I've noticed that my own verdicts don't line up. My working rule — a name on a building or a statue in a square honors the person, we shouldn't honor people who did serious wrong, so the names come down — handles the first cases and then falls apart. Here are the verdicts, with the pairs that trouble me next to each other.

  (a) A statue of a Confederate general on a courthouse square, erected long after the war by a segregation-era organization. Remove it and reinstall it in a museum as an exhibit about who put it up and when: fine, and better than leaving it in a storage yard.

  (b) The same sort of statue, left where it stands with a new plaque naming his part in the slave trade and in suppressing Black voting: not fine. The plaque doesn't repair it, and it is worse than removal.

  (c) A high school named for a nineteenth-century state school superintendent who wrote the school-funding law the district still runs on, and who also led the campaign to segregate the state's schools: rename. It does not help him that the deed he is honored for and the harm he did concern the same institution.

  (d) A scholarship fund created a century ago by a bequest whose terms require the donor's name to remain attached; the fortune came from convict leasing. Keep the money, drop the name: fine, and nothing about it bothers me.

  (e) The same structure offered this year — a gift from a payday-lending company for a business-school building, with the name attached as a condition of the gift: refuse it, and the refusing matters more than the money would. I cannot say why the hundred years should make that difference.

  (f) A campus building named for a nineteenth-century naturalist whose name is now just a way for students to find their classroom, and whose craniometry nobody associates with it: leave it alone; renaming would be a fuss about nothing.

  (g) A lecture hall named for a figure of the same period whose arguments about heredity and national decline are still quoted as authority in current fights about immigration and intelligence testing: rename, and urgently, even though his name does no more honoring today than the naturalist's does.

  (h) A Soviet-era war memorial in a city where the grandchildren of local veterans still lay flowers at it every spring, in a country whose occupation by that regime was brutal: leave it. This is the case that makes me think the whole rule is wrong.

  (i) A massacre-site memorial on a residential street in the neighborhood whose families were massacred; those families now want it moved because they have to walk past it daily, while historians want it preserved in place. Move it if they ask, even though what it commemorates is the victims rather than a wrongdoer.

  (j) A law school named for a segregationist judge. Remove the name — but do not rename it after a civil-rights lawyer while the school's admissions and clerkship practices are what they still are. A nameless building is fine; a virtuous name on an unchanged institution is worse than no name at all. I've been calling this the problem of borrowed virtue, and it is the verdict I would least like to give up.

  Give me the answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion:

  1. The principle, stated precisely enough that I could apply it to a new case without asking you.
  2. The clauses the principle needs, and which of my cases each clause is there for.
  3. Which of my verdicts it cannot deliver, what verdict it substitutes, and which verdict you think I should actually abandon rather than accommodate.
  4. Its verdicts on the two cases I deliberately left out: a monument to a contested figure that the wronged community itself commissioned and still wants kept, and a name commemorating a collective rather than a person, such as a Founders Hall at a university whose founders were slaveholders.
  5. The point where you expect the principle to break, or the question it leaves open.
reasoning: |-
  Okay, the user is a political philosopher on a university committee dealing with commemoration ethics. They've shared several cases where their initial rule—removing names or statues of people who did serious wrongs—doesn't consistently apply. They need a principle that can handle all these cases without contradictions. 

  First, I need to understand why their initial rule fails. Cases like (d) and (e) both involve problematic donors, but they treat them differently based on time. The Soviet war memorial (h) is kept despite the regime's brutality because of community sentiment. The naturalist (f) and the heredity theorist (g) both have names that aren't actively honored, but only the latter requires renaming because his ideas are still harmful. Then there's the law school (j) where renaming after a civil rights lawyer without institutional change is worse. 

  The key tensions are: harm vs. current relevance, community agency, institutional hypocrisy, and whether commemoration still actively honors versus just being a historical marker. The principle must weigh these without being rigid.

  Brainstorming candidate principles: One could focus on current harm—does the commemoration perpetuate injustice today? That handles (g) and maybe (b), but fails (h) where the memorial causes no current harm to the community. Another principle might prioritize the wronged community's wishes, which explains (i) and (h), but struggles with (d) where no living community is affected. A third could separate symbolic from material harm—e.g., condemning "borrowed virtue" in (j) but accepting the scholarship name in (d) as materially helpful. But that doesn't resolve (e) where refusing new tainted money feels necessary. 

  The winning principle must reconcile:  
  - Active harm (g) vs. passive naming (f)  
  - Community consent (h,i) vs. historical responsibility (c)  
  - Material benefit (d) vs. moral complicity (e)  
  - Symbolic integrity (j)  

  Testing a draft: "Commemoration is unacceptable if it (1) honors wrongs, (2) imposes ongoing harm, or (3) exploits virtue without reform." But (h) might still violate (2) if it harms occupation victims' descendants. Unless "harm" requires current endorsement—which the Soviet memorial avoids since it's now about local grief.  

  Clauses needed:  
  1. Does it honor wrongdoing? (Handles a,b,c)  
  2. Does it perpetuate current injustice? (Handles g, explains f)  
  3. Does it disregard the wronged community's wishes? (Handles i, h)  
  4. Is the benefit conditional on endorsing the honoree? (Explains d vs. e)  
  5. Does renaming falsely imply reform? (Saves j)  

  Now, where it breaks: Case (h) is tricky—if local veterans' descendants are part of the wronged community (by occupation), but they want it kept, clause 3 protects it. But if another group (e.g., dissidents' families) finds it oppressive, whose wishes prevail? The principle must specify "most directly affected" community.  

  Deliberate omissions:  
  - Contested figure commissioned by wronged community: Keep, per clause 3 (their agency matters).  
  - "Founders Hall" naming slavers: Rename, unless the community reclaims it—but clause 1 likely triggers removal since it honors the group.  

  Abandoning a verdict? The user should drop treating (d) and (e) differently—time doesn't sanitize; clause 4 (conditional endorsement) makes refusing (e) consistent if the gift demands ongoing honor.  

  Final principle must be airtight: Honor + harm + consent + conditional benefit + false virtue. The open question: Who counts as the "wronged community" when perspectives clash?
answer: |-
  Here is the list as requested:

  1. Remove or repurpose commemoration when it honors wrongful acts or persons responsible for them, unless the directly affected community actively consents to its retention despite this harm; reject conditional donations that demand ongoing honor for wrongdoers; avoid renaming that falsely implies institutional reform.

  2. Clause for honoring wrongdoing (cases a,b,c,g); clause for community consent overriding removal (case h,i); clause refusing conditional donations (case e, distinguishing d); clause against borrowed virtue (case j); exception for purely functional naming without ongoing harm (case f).

  3. It cannot deliver your verdict on (d) and instead requires removing the scholarship name (since it honors convict leasing profits); you should abandon treating historical distance as sanitizing in (d) to maintain consistency with (e). For (i), it substitutes leaving the massacre memorial if historians represent the affected community's interests, but I endorse your original move-it verdict.

  4. Keep the contested monument commissioned and wanted by the wronged community (consent clause overrides); rename Founders Hall (honors slaveholding collectivity, no consent clause applies unless descendants reclaim the term).

  5. It breaks when multiple affected communities hold irreconcilable views (e.g., veterans versus occupation victims at a Soviet memorial) or when "honor" is ambiguous (e.g., a building name that functions neutrally for some but wounds others).
