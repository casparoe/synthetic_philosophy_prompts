answer: |-
  **Single Sentence Spine:** Make them viscerally grasp that evaluating a *decision rule* across *all possible branches* (even those you don't experience) creates a fundamental tension with maximizing outcome *in the branch you're actually in*, and that this tension manifests differently in structurally distinct scenarios like Mugging vs. Blackmail.

  **The Plan:**

  1.  **Order & Dependencies (10 mins):**
      *   **Start with Newcomb's Problem (Simplified):** "Shrewd observer (65-70% accurate) predicts your choice. $1K in opaque Box A always. $1M in opaque Box B *only* if they predicted you'd take *only* B. Take only B (expected $700K) or both (expected $1.03M)?" *Why:* Establishes core elements: prediction made, unchangeable past, conflict between dominance ("take both gets you more *here*") and prediction-based expectation. Forces confrontation with "unchangeable past" early. *Land:* "The predictor's guess is *already fixed* when you decide. Your choice *now* doesn't change what's in the boxes. So why *wouldn't* you take both? What's the argument *for* taking only B?" Get the tension out.
      *   **Introduce "Decision Rule Evaluation":** "Forget this specific choice for a second. Imagine we're designing a *policy* for all similar situations. How do we judge a policy? By how well it does *on average* across *all* the times it gets used – including times the predictor got it right *and* wrong, times you get the money and times you don't. That's different than judging just *this* outcome." *Why:* Sets up the meta-level. Crucial for understanding the Mugging argument. *Land:* "A policy of 'always one-box' gets the $1M when predicted right ($0 when wrong). A policy of 'always two-box' gets $1.001M when predicted right ($1K when wrong). Over many runs, which policy nets more? That's evaluating the *rule*, not the *instance*."

  2.  **The Core Matched Pair (15 mins):**
      *   **The Case:** **Counterfactual Mugging & XOR Blackmail (Matched):**
          *   *Setup (Identical for both):* Same shrewd observer (70% accurate). Same agent (attendee). Same stakes: Agent stands to gain $1000 *or* lose $1000. Same trigger: Observer flips a fair coin (unseen by agent). *Same unsavoury stranger:* A messenger arrives just before the coin result is revealed, making a demand *based on the coin outcome*.
          *   *Must Have:* Structural difference hinges *only* on the messenger's information/demand structure. Identical predictor accuracy, stakes, agent, coin flip, timing. No repetition, no reputation, no precommitment possible (stranger is new, one-shot), no binding earlier choice.
          *   *Must Lack:* Any element allowing the agent to infer the coin outcome *before* deciding to pay (no signal beyond the demand itself). No "kind of person" implication beyond the rule evaluation.
          *   **Counterfactual Mugging:** *If coin is Heads,* observer predicted agent would pay $1000 if asked. *If coin is Tails,* messenger arrives and says: "The coin was Tails. If you pay me $1000 now, I will give you $1000 *if the coin was Heads* (which it wasn't)." Pay $1000? (Observer predicted correctly 70% of the time whether you *would* pay in this specific Tails scenario).
          *   **XOR Blackmail:** *If coin is Heads,* messenger arrives and says: "The coin was Heads. Pay me $1000 or I will reveal damaging info costing you $1000." *If coin is Tails,* no messenger arrives *and* nothing happens. Pay $1000 if messenger arrives? (Observer predicted correctly 70% of the time whether you *would* pay in the Heads scenario where the messenger arrives).
      *   *Why this Pair:* Identical surface components. Difference is purely structural: Mugging pays *in Tails* for a *Heads* counterfactual gain; Blackmail pays *in Heads* to avoid a *Heads* actual loss. Isolates the core conflict: Mugging argues for paying based on rule evaluation (good rules pay here, increasing expected value across branches), Blackmail argues against paying based on situational dominance (paying loses $1000 here with no counterfactual benefit *in your branch*).

  3.  **Misconception Map & Deflections (Order of Likely Appearance):**
      1.  **"Money's gone/Can't change past, just walk away."** (Raised early, during Mugging explanation).
          *   *When:* As soon as Mugging demand is stated.
          *   *Deflection:* "Absolutely, in *this actual branch* (Tails), paying nets you -$1000 for nothing tangible *here*. That pull is real. But remember how we judged the Newcomb policy? What if we think about the *rule* 'Always Pay in Mugging' vs. 'Never Pay'? How does each rule perform *across all coin flips and predictions*? Let's sketch that." (Focus back on rule evaluation).
      2.  **"This is just precommitment/being the kind of person."** (Raised during Mugging justification).
          *   *When:* When discussing *why* paying in Mugging might be rational for the rule.
          *   *Deflection:* "Notice the setup: No prior interaction, no future encounters, this stranger appears once. This isn't about building a reputation or binding your future self. It's purely about how this *single instance* of paying affects the *average performance* of the rule you're following *right now* across all possible worlds where this rule is used." (Emphasize one-shot, no reputation).
      3.  **"70% predictor? Then CDT is obviously right, it's only hard with perfection."** (Raised when comparing arguments).
          *   *When:* When contrasting Mugging (pay) vs. Blackmail (don't pay) arguments.
          *   *Deflection:* "Let's test that! Imagine the predictor was perfect (100%). Does the argument *for* paying in the Mugging get stronger or weaker? What about *not* paying in the Blackmail? Now imagine the predictor is only 51%... does the Mugging argument *for* paying vanish? What about Blackmail? The predictor accuracy *scales* the strength, but the *structural difference* between the cases remains the key driver of the different verdicts." (Acknowledge scaling, focus on structure).
      4.  **"Mugging is just Newcomb with open boxes/We did this."** (Raised by LWers during Mugging).
          *   *When:* Early in Mugging discussion.
          *   *Deflection:* "Good connection! Both involve unchangeable predictions. But here's the twist: In Newcomb, you get the reward *in the same branch* where you 'cooperate' (one-box). In the Mugging, you pay *in the branch where the good outcome (Heads reward) didn't happen*. That's the new, crucial wrinkle forcing us to think about rule evaluation across *disconnected* branches." (Highlight the counterfactual payment branch).
      5.  **"In Blackmail, non-payers never get the letter, so don't pay!"** (Raised during Blackmail, often triumphantly by LWers).
          *   *When:* When presenting the Blackmail dilemma.
          *   *Deflection (Crucial - Don't engage directly first):** "Hold that thought! Let's first be crystal clear: *If* the messenger arrives (meaning Heads), and you are *faced with the choice*, what happens *in this branch* if you pay vs. don't pay? (You pay $1000 and avoid $1000 loss / You lose $1000). Now, stepping back: Does the existence of the Tails branch *where no choice happens* change the dominance argument *in the Heads branch where you are actually faced with the choice*?" (Force focus on the branch you're *in* when deciding). *Then:* "The rule 'Never Pay' *does* mean you avoid the letter in Heads only if predicted to not pay. But *if* you get the letter (meaning Heads *and* predicted to pay), the rule 'Never Pay' forces you to lose $1000 in that exact situation. The rule 'Always Pay' loses $1000 *every time* you get the letter. Which rule performs worse *in the specific situation of actually facing the demand*?"

  4.  **The Transfer Check (5 mins):**
      *   **The Case: The Variable Signal Blackmail.**
          *   *Setup:* Observer (accuracy = X%, dial you control) predicts if you'll pay. Fair coin flip. IF HEADS: A light MAY flash (imperfect signal). If light flashes (prob = Y%, dial you control), messenger demands $1000 or you lose $1000. If light doesn't flash, nothing happens. IF TAILS: Nothing ever happens. You see the light flash (or not) *before* the messenger arrives (if they arrive).
      *   **The Dial:** Start with **X=70% (Predictor Accuracy), Y=100% (Light always flashes on Heads)**. "Messenger arrives only if light flashes. Light flashes only on Heads. You see the flash. Messenger arrives, demands $1000 or you lose $1000. Pay?"
          *   *Expected Answer:* Don't Pay (Standard Blackmail. You know it's Heads, paying loses $1000 unnecessarily).
      *   **Turn the Dial:** **Keep X=70%, Set Y=50% (Light flashes on Heads only 50% of the time; also flashes randomly on Tails 50%? Clarify: Light flashes *only* on Heads, but only 50% of Heads cases. On Tails, light never flashes.)** "Now, you see the light flash. Messenger arrives, demands $1000 or you lose $1000. Pay? Why?"
          *   *Got It Pattern:* They recognize uncertainty. "I know it's Heads (light only flashes on Heads), so same as before, don't pay." (Focus remains on *actual branch* knowledge - correct for this structure). OR if they argue for paying based on rule evaluation *despite knowing it's Heads*, they fundamentally misunderstand.
          *   *Pattern-Matching Fail:* "Now it's like the Mugging! Pay because of the predictor!" (Confusing the structural difference; this is still Blackmail-type *within the branch* even with predictor).
      *   *Why it Works:* Tests if they anchor on the *branch structure* (demand happens only on Heads, payment avoids loss *in that branch*) vs. the presence of a predictor. The predictor (X%) introduces noise about *whether you face the demand*, but crucially, *if you face the demand*, you are definitively on Heads (due to the light signal, Y=50% or 100%). The rational choice *when facing the demand* is always "Don't Pay" in this setup, regardless of X%. If they switch to "Pay" when Y<100%, they're importing Mugging reasoning incorrectly.

  5.  **What to Refuse:**
      *   **Formalisms (UDT, FDT, Logical Counterfactuals):** "We're staying at the intuitive, 'what does the decision rule do across possibilities' level today. The formal theories are ways to codify these intuitions, but we don't need the math for this core tension."
      *   **"You are your algorithm" Metaphysics:** "We're treating the decision rule as a tool we evaluate, not diving into deep personal identity. The question is 'which tool gets better results overall?'."
      *   **Physical Possibility:** "Whether perfect predictors or these exact setups are physically possible isn't the point. They're thought experiments designed to isolate a conceptual tension in how we define rationality. Does the tension exist in the *logic* of the scenarios?"
      *   **Homework/Reading:** "The goal today is the 'aha' moment on this specific tension, not mastery. If you want to dive deeper, the keywords are 'Newcomb-like problems', 'counterfactual mugging', 'XOR blackmail', and 'timeless decision theory' – but enjoy the pub for now!"

  **Execution Flow:** Newcomb Setup & Tension (10 min) -> Rule Evaluation Concept (5 min) -> Mugging Case & Pull (5 min) -> Blackmail Case & Pull (5 min) -> Contrast & Deflect Misconceptions (10 min) -> Transfer Check (5 min) -> Wrap-up/Refusals (5 min). **Stick ruthlessly to time.** Use the matched pair descriptions verbatim. Anchor all deflections back to the "Rule Evaluation vs. Situational Outcome" spine. The LWers "win" by understanding *why* the structural difference matters, not by reciting verdicts. The math teacher's challenge *is* the core tension – highlight that.
