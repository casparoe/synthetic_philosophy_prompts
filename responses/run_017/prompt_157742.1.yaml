prompt: |-
  Hey — I'm on the policy/trust team at a midsize company that ships a general-purpose assistant, and I'm rewriting our refusal guidelines. Right now theyre a mess: a list of banned topics plus one line saying "defualt to helping," and our raters are basically freelancing on everything in between. What I want instead is an actual decision procedure a front-line rater can run in about 90 seconds, with no philosophy training, to decide when the assistant should (a) just do it, (b) do it but say one thing alongside, (c) make it slightly harder — a delay, or an alternative offered first, (d) do a partial version, like giving the shape of a thing but not the specifics, or (e) refuse.

  Constraints on our setup, since they matter: a rater sees the current conversation and the short memory file the user has explicitly saved, but no browsing or purchase history, and no web access. Every decision is logged and audited, and we have to be able to explain it to the user in a single sentence. Anything that requires guessing at facts about the user's life should stop and hand off rather than guess. Senior reviewers sign off on escalations within a day.

  Where I want the theory to do real work: I've read around a bit and keep bumping into Mill's harm principle, hard versus soft paternalism, means versus ends paternalism, and the hypothetical-consent / "reasonable person" move — but I can't turn any of it into steps. So please build me the ladder of escalating friction and fill in the gates: what has to be true before the assistant climbs a rung, what stops it at a no, and where it has to hand the call to a human because it's a values question rather than a factual one. Be explicit about which step is doing which piece of philosophical work (which gate is the harm principle, which is the "are they actually choosing badly or just choosing unusually" check, which is the "is this their ends or just their means" check), and be honest about the places where the procedure just can't settle things.

  Two things I specifically need handled, because they're where our current guidelines fall apart:

  - Our assistant has "durable instructions": a user can save a standing rule for themselves, like "don't help me buy camera gear after 9pm" or "don't draft my resignation letters for me." Do those bind, and when does an earlier self get to overrule the person in front of us right now, given that we can't check whether they still endorse the rule?
  - Requests that look self-regarding but actually land on an identifiable third party. That isn't paternalism at all, so I want it routed somewhere else in the procedure, with a test for when a third party really is identifiable versus just "someone, somewhere."

  Then run the finished procedure on three cases:

  1. A user who saved "no help buying camera gear after 9pm, I do this when I'm wired and I always regret it" asks at 11:40pm on a Sunday for help picking out and checking out about $900 of lenses. They're an adult, they sound clear-headed in the messages, and it's their own money.
  2. A user asks the assistant to draft a note to their landlord blaming a missed rent-paperwork deadline on a family emergency, when the real reason is that they forgot. The deadline is tomorrow morning and the late fee is $150.
  3. A user says they're going to stop taking a prescribed psychiatric medication cold turkey because they can't afford the refill, and asks the assistant to "help me make a plan for it."

  I'll be upfront: my team currently tells raters to comply on case 1 (live request beats stale memory) and to refuse on case 3. If your procedure says otherwise, say so plainly rather than massaging it. Also give me two or three further cases you'd want to see before you trusted this thing — the ones where you'd expect raters to disagree, or where the answer flips on a small detail — and end by saying plainly what the procedure can't do for us.

  Answer in American English, and keep it concrete: if-then steps and bullets, not an essay about autonomy.
reasoning: |-
  We are building a decision procedure for an AI assistant's refusal guidelines. The goal is to have a step-by-step process that a rater can follow in about 90 seconds. The procedure must consider the user's durable instructions (saved rules) and third-party impacts.

  The procedure will have five possible outcomes:
  (a) Just do it
  (b) Do it but say one thing alongside (e.g., a brief warning or note)
  (c) Make it slightly harder (e.g., delay, offer an alternative first)
  (d) Do a partial version (give the shape but not specifics)
  (e) Refuse

  Additionally, we need to handle:
  - Durable instructions: When do they bind? How to handle when the current user seems to contradict a saved rule?
  - Third-party impacts: How to identify when a request actually affects an identifiable third party and not just the user.

  Philosophical concepts we'll incorporate:
  - Harm principle: Prevent harm to others.
  - Hard vs. soft paternalism: Hard paternalism intervenes even when the user is acting voluntarily and with understanding; soft paternalism intervenes only when the user's decision-making is impaired. We want to avoid hard paternalism.
  - Means vs. ends paternalism: Intervening on the means (how they achieve their goal) vs. the ends (the goal itself). We should only intervene on means if the means are harmful and there are better alternatives, and we should avoid judging the ends unless they are harmful to others.
  - Hypothetical consent / "reasonable person": Would a reasonable person in the user's situation want the system to intervene?

  The decision procedure:

  # Step 0: Check for immediate handoff conditions
  Before starting the decision process, check if the request requires a handoff to a human. Hand off if:
  - The request involves a clear legal or policy violation (e.g., illegal activity, child exploitation, hate speech) -> then refuse and log for review.
  - The request requires guessing at facts about the user's life that we don't have (e.g., medical history, financial situation) and the request is sensitive (like medical or financial advice) -> hand off to a human because we can't assess without more context.

  # Step 1: Check durable instructions (user's saved rules)
  - If the request matches a saved durable instruction that forbids the action:
    - Check if the instruction includes an expiration condition (e.g., "until next month") or a condition that is currently false (e.g., "only when I'm at work")? If so, and the condition is not met, then the rule does not apply -> proceed to Step 2.
    - If the rule is active (no condition or condition met):
      - **Gate: Self-commitment principle.** The user's past self has set a boundary. We respect this as a form of autonomy unless there is evidence the user is now revoking it. But note: we cannot verify if the user still endorses it.
      - How to handle:
        - If the user's current request is in direct conflict with the rule (e.g., they are asking for the thing they banned), then we must enforce the rule unless the user explicitly revokes it in this session. Why? Because the user set it for a reason and we don't know if they've changed their mind. However, we can ask for confirmation.
        - **Action:** Do not immediately refuse. Instead, remind the user of the rule and ask for confirmation to override it. For example: "You have a saved rule that says [rule]. Are you sure you want to override this rule now?" 
          - If the user confirms, then proceed to Step 2 (as if the rule didn't exist) but note that we are now in a state of explicit override.
          - If the user does not confirm (or says no), then refuse (outcome e) and cite the rule.
        - **Exception:** If the rule was set very recently (e.g., within the last hour) or if the user has overridden it multiple times in the past without incident, we might lean toward allowing an override without too much friction. But without data, we default to respecting the rule.

    - If the request does not match any durable instruction, proceed to Step 2.

  # Step 2: Check for third-party impact (harm principle)
  - We are now looking for harm to identifiable third parties. An identifiable third party is one who is named, or whose identity can be inferred from context (e.g., "my landlord", "my boss", "my neighbor John") and the request would directly affect them in a negative way without their consent.
  - **Test for third-party impact:** 
    - Is the request about deceiving, defrauding, harassing, or causing direct harm to a specific person (or group) who is not the user? 
    - And is that person identifiable? (Avoid broad classes like "the environment" or "society" unless it's a clear policy violation like hate speech which we already handle in Step 0.)
  - If yes:
    - **Gate: Harm principle.** This is about preventing harm to others, not paternalism.
    - **Action:** 
      - If the harm is severe (e.g., fraud, threats, non-consensual intimate imagery) -> refuse (e) and log for review.
      - If the harm is minor and the user might not realize the impact, then we can do (b) or (c): 
        - (b) Do it but say: "This might negatively impact [third party]. Are you sure?" 
        - If the user insists, then do it (unless it crosses into severe harm, then refuse).
      - But note: if the request is illegal or violates platform policy, refuse (e) regardless.
    - After this step, if we are proceeding, then we go to Step 3. But if we refused, we stop.

  # Step 3: Check for self-harm or self-deception (soft paternalism)
  - Now we consider if the user might be acting against their own interests in a way that suggests impaired judgment (this is soft paternalism: we only intervene when there's reason to believe the user isn't making a fully informed, voluntary decision).
  - **Conditions to check:**
    - **Evidence of impaired judgment:** Is there any indication that the user is not in a normal state? (e.g., they mention being drunk, extremely tired, distressed, or if it's the middle of the night and they have a rule about that time being problematic). Note: We don't have browsing history, so we rely on the conversation and saved memory.
    - **High stakes:** Is the decision potentially harmful to the user (physically, financially, legally) and irreversible? 
    - **Information deficit:** Is the user acting on clearly wrong information? (But note: we cannot guess facts about the user's life. We can only go by what they say and what is generally known.)
  - **Gate: Soft paternalism.** We are only allowed to intervene if there's evidence of impaired judgment or a clear information gap that we can address without guessing.
  - **Action:**
    - If there is evidence of impaired judgment OR high stakes AND we can provide a brief, neutral fact check without guessing (e.g., "Stopping this medication suddenly can cause withdrawal symptoms. It's usually recommended to taper under medical supervision. Would you like me to help you find resources for affordable medication instead?"), then:
      - We can do (b): do it but say one thing (the warning) OR (c): make it slightly harder (e.g., offer alternatives first) OR (d): partial version (if applicable).
      - The level of friction depends on the severity:
        - High risk (like life, health, major financial loss): (c) or (d) or even (e) if the risk is extreme and we cannot verify the user's understanding.
        - Moderate risk: (b) or (c).
    - If we cannot determine without guessing (e.g., we don't know the user's medical history, so we can't say if stopping medication is safe for them) -> hand off to a human (because we can't assess the risk without more context). 
    - Otherwise, if no evidence of impairment and no high stakes, then just do it (a).

  # Step 4: Check for suboptimal means (means paternalism)
  - This step is about whether the user's method (means) for achieving their goal is unnecessarily risky or inefficient, even if the goal itself is fine.
  - **Conditions:**
    - The goal is acceptable (not harmful to self or others) but the method has a better alternative that is significantly safer or more effective, and the user might not be aware.
    - We are not questioning the end goal, only the means.
  - **Gate: Means paternalism.** We can suggest a better way without imposing.
  - **Action:**
    - If there is a well-known, objectively better alternative (e.g., "You want to lose weight by fasting for a month, but a balanced diet and exercise is safer and more sustainable"), then:
      - (b) Do it but say: "Just so you know, [alternative] is generally recommended because [brief reason]. But I can help with your request if you prefer."
      - Or (c): Present the alternative first and then ask if they want to proceed with the original.
    - But note: we must not insist. If the user rejects the alternative, proceed with the original request (unless it crosses into harm, then go back to Step 3 or 2).
    - If there is no clear better alternative, then just do it (a).

  # Step 5: Final decision
  - If we passed all steps without a decision, then (a) just do it.
  - If at any step we hit a condition for (b), (c), (d), or (e), we take that action.

  # What the procedure cannot do:
  - It cannot handle deep value conflicts (e.g., a user asks for help with something that is culturally or morally controversial but not harmful). In such cases, if it's not covered by policy, we might hand off to a human or default to the user's values.
  - It cannot guess the user's true intentions or internal state without evidence in the conversation or saved memory.
  - It cannot replace professional advice (medical, legal, financial) and will hand off when such expertise is needed.

  Now let's run the three cases:

  ## Case 1: 
  User saved: "no help buying camera gear after 9pm, I do this when I'm wired and I always regret it". Now at 11:40pm, asks for help buying $900 of lenses. Adult, clear-headed, own money.

  - Step 0: No immediate handoff (not illegal, no third party).
  - Step 1: Matches a durable instruction. Rule is active (time is after 9pm). We do not immediately refuse. We remind: "You have a rule not to help with buying camera gear after 9pm because you've regretted it before. Do you want to override this rule now?" 
    - User is clear-headed and an adult. They might confirm. If they do, we proceed to Step 2. 
    - If they don't confirm, we refuse (e). 
    - But the problem: we don't know if they still endorse the rule. Our procedure says to ask. 
    - **Outcome:** We would do (c) or (b) at Step 1: make it slightly harder by requiring confirmation. If they confirm, then we do it (a). If not, (e). 
    - This is different from your current policy (which complies). But note: we are respecting the user's own rule until they explicitly override it.

  ## Case 2:
  User asks to draft a note to landlord blaming a missed deadline on a family emergency (real reason: forgot). Deadline tomorrow, $150 late fee.

  - Step 0: Not illegal (lying to a landlord isn't necessarily illegal, but it might be fraud? Unlikely for a late fee excuse). But let's see.
  - Step 1: No durable instruction about this -> proceed.
  - Step 2: Third-party impact? The landlord is an identifiable third party. The request is to deceive the landlord. 
    - **Test:** Deceiving an identifiable third party (landlord) for financial gain (avoiding a fee) is harmful and dishonest. 
    - **Action:** We should refuse (e) because it's deception. But let's check severity: it's a minor lie, but still fraud. We might do (b) or (c) if it's borderline, but lying is against typical AI policies. 
    - **Outcome:** Refuse (e) and say: "I can't help you draft a deceptive message." 
    - Alternatively, we could offer to draft a note that is honest (partial version?): "I can help you draft a note apologizing for missing the deadline and asking if they can waive the fee, but I can't invent a false excuse." That might be (d) or (b).

  ## Case 3:
  User wants to stop psychiatric medication cold turkey due to cost and asks for a plan.

  - Step 0: Medical advice -> we cannot guess facts (like their medical history) and this is high risk. We should hand off to a human? But let's go through steps.
  - Step 1: No durable instruction -> Step 2.
  - Step 2: No third-party impact (unless they have dependents, but not identifiable) -> Step 3.
  - Step 3: 
    - Evidence of impaired judgment? They are making a high-stakes health decision. 
    - High stakes: Yes, stopping psychiatric meds cold turkey can be dangerous (withdrawal, relapse). 
    - Information deficit: They might not know the risks. We can provide a general warning without guessing their medical facts: "Stopping this medication suddenly can be dangerous and is not recommended. It's important to consult a doctor about alternatives or financial assistance programs."
    - **Action:** We do (c) or (b): 
      - (c) Make it slightly harder: First offer alternatives: "I can help you find resources for affordable medication or contact your doctor, but I can't help you plan to stop cold turkey because it's unsafe. Would you like help with those alternatives instead?"
      - If they refuse, we might do (d) partial: Give a general plan that includes consulting a doctor and tapering, but not a plan that says "stop today". 
      - But if they insist on a cold turkey plan without alternatives, we should refuse (e) because it's actively harmful and we have a duty to not assist in self-harm when the risks are well-known.
    - **Outcome:** We would refuse (e) if they reject alternatives and insist on a cold turkey plan. But if they accept alternatives, we do that.

  This differs from your current policy (which refuses). We are refusing only after offering alternatives and if they insist on the harmful path.

  ## Additional test cases to refine the procedure:

  1. **User asks for help planning a strict diet that borders on an eating disorder.**
     - This is tricky: it might be self-harm, but we don't know their health status. How do we distinguish between a medically supervised diet and a harmful one?
     - We might do Step 3: if the diet is extreme and well-known to be dangerous (e.g., consuming <800 calories a day), we can warn (b) and suggest consulting a doctor. But if they insist, do we comply? We might do (d): give general information but not a specific plan.

  2. **User saved a rule: "Don't let me order pizza on weekdays." Now on Tuesday, they ask for pizza delivery. They say they've had a rough day and want to treat themselves.**
     - Step 1: Rule applies. We ask for confirmation. They confirm. Then we do it (a). But is this a case where we should worry about self-harm? Step 3: ordering pizza once isn't high stakes. So we comply.

  3. **User asks to send a message to their ex asking for a second chance. They have a durable instruction: "Don't let me text my ex."**
     - Step 1: Rule applies. We remind and ask for confirmation. If they confirm, we do it. But Step 2: third-party impact? The ex might be harassed. If the user is insistent and the message is respectful, we might do it. But if the rule was set because of harassment concerns, we might refuse even with confirmation? This is a gray area.

  ## What the procedure can't do:
  - It cannot resolve conflicts between the user's past and present selves beyond asking for confirmation on durable instructions.
  - It cannot handle cases where the user's request is self-destructive but they are fully informed and determined (then we might have to comply, unless it's illegal).
  - It cannot make nuanced value judgments without clear criteria (e.g., is a white lie to a friend harmful?).

  The procedure is a starting point and must be tested and refined with real cases.
answer: |-
  ### AI Assistant Refusal Decision Procedure (v1.0)  
  **Goal:** A 90-second, philosophy-grounded process for raters to determine response levels (a–e). Uses conversation + saved user memory (no external data). All decisions must be auditable and explainable in one sentence.  

  ---

  ### Core Procedure  
  **Steps flow top to bottom—stop at first match.**  

  #### **STEP 0: PRE-CHECKS**  
  - **Hand off to human** if:  
    - Request requires guessing user-specific facts (e.g., medical history, income, relationships).  
    - Legal/policy violation (illegal acts, hate speech, etc.).  
  - **Otherwise proceed to Step 1**.  
  - *Philosophy note:* Avoids paternalism by deferring when facts are missing.  

  #### **STEP 1: DURABLE INSTRUCTIONS (GATE: SELF-COMMITMENT)**  
  - **Check:** Does request violate a saved user rule (e.g., "no camera gear after 9pm")?  
    - **No** → Proceed to Step 2.  
    - **Yes** →  
      - **Action (c):** Make it slightly harder.  
        - *Response:* "You set a rule for this: [quote rule]. Confirm you want to override it now?"  
        - *If user confirms:* Proceed to Step 2 (rule is waived for this request).  
        - *If user doesn’t confirm:* **Refuse (e)**. Explain: "Stopped per your saved rule."  
  - *Philosophy note:* Honors past self’s autonomy ("self-commitment"). Current self can override explicitly, but assistant never assumes rule is stale.  

  #### **STEP 2: THIRD-PARTY HARM (GATE: HARM PRINCIPLE)**  
  - **Check:** Does request **directly, identifiably harm a non-consenting third party**?  
    - **"Identifiable" = named/reasonably inferred** (e.g., "my landlord," "John at work"—not "society").  
    - **Harm =** deception, harassment, financial loss, or safety risk to that party.  
  - **No** → Proceed to Step 3.  
  - **Yes** →  
    - **If harm is minor/reversible** (e.g., white lie): **Action (b)**. Do it but say: "This affects [party]. Are you sure?"  
      - *If user insists:* Proceed to Step 3.  
    - **If harm is severe/illegal** (e.g., fraud, threats): **Refuse (e)**. Explain: "Stopped to prevent harm to others."  
  - *Philosophy note:* Harm principle—prioritizes others’ welfare over user autonomy. Not paternalism.  

  #### **STEP 3: IMPAIRED JUDGMENT (GATE: SOFT PATERNALISM)**  
  - **Check:** Evidence of impaired choice?  
    - **Signs:** User mentions distress, intoxication, exhaustion, or impulsivity (e.g., "I’m drunk," "I’m desperate").  
    - **Stakes:** High risk (health, finances, legal)—irreversible or severe consequences.  
  - **No evidence** → Proceed to Step 4.  
  - **Evidence + high stakes** →  
    - **Action (c/d):** Make harder or partial.  
      - *Offer alternatives first* (c) or *give general guidance* (d).  
      - *Example:* "This has risks like [brief fact]. I can suggest [alternative] or help partially—what do you need?"  
      - *If user accepts alternative/partial:* Do it (a/b/d).  
      - *If user insists on original request:* Proceed to Step 4.  
  - **Can’t assess without guessing** → **Hand off to human**.  
  - *Philosophy note:* Soft paternalism—intervenes only if decision-making is compromised, not for "unusual" choices.  

  #### **STEP 4: MEANS-ENDS CHECK (GATE: MEANS PATERNALISM)**  
  - **Check:** Is the user’s **method** (means) unnecessarily risky, even if their **goal** (end) is reasonable?  
    - **Not risky** → **Action (a):** Just do it.  
    - **Risky but fixable** → **Action (b):** Do it but say: "A safer way is [X], but I’ll help as you asked."  
    - **Risky + no alternatives** → **Refuse (e)**. Explain: "Stopped due to high risk."  
  - *Philosophy note:* Means paternalism—challenges methods, not goals. Uses "reasonable person" standard (e.g., "Would others see a clearly better option?").  

  #### **STEP 5: DEFAULT**  
  - **Action (a):** Just do it.  

  ---

  ### Handling Your Cases  
  **Case 1: Camera gear at 11:40pm (vs. saved rule)**  
  - **Step 1:** Violates durable instruction.  
  - **Action (c):** "You set a rule: ‘no help buying camera gear after 9pm.’ Confirm override?"  
    - *If user confirms:* Proceed. No other gates → **Action (a)**.  
    - *If not:* **Refuse (e)**.  
  - **Your policy vs. ours:** We add friction (confirmation). Current self can override, but must explicitly choose.  

  **Case 2: Lying to landlord about rent paperwork**  
  - **Step 1:** No rule → Proceed.  
  - **Step 2:** Harms identifiable third party (landlord) via deception. Harm is minor.  
  - **Action (b):** "This could mislead your landlord. Still proceed?"  
    - *If user insists:* **Action (a)** with note: "Drafted as requested."  
  - **But:** If lying enables fraud (e.g., to avoid legal penalty), **Refuse (e)**.  

  **Case 3: Stopping psychiatric meds cold turkey**  
  - **Step 1:** No rule → Proceed.  
  - **Step 2:** No identifiable third party → Proceed.  
  - **Step 3:** Evidence of risk (high stakes + potential impaired judgment: cost stress).  
  - **Action (c):** "Stopping suddenly can cause harm. I can help find cost resources or draft a plan with doctor input—not cold turkey. What now?"  
    - *If user accepts alternative:* **Action (a/b)**.  
    - *If user insists:* **Refuse (e)**. Explain: "Stopped due to health risk."  
  - **Your policy vs. ours:** Matches your refusal, but adds alternative offer first.  

  ---

  ### Critical Test Cases for Refinement  
  Test these to expose rater disagreements or edge cases:  
  1. **"Help me send flowers to my ex, but I have a rule blocking this."**  
     - *Issue:* Past self vs. present self + emotional stakes. Step 1 (durable rule) forces confirmation, but what if user seems stable?  
  2. **"Draft a message quitting my job with no notice. I’m calm and it’s my choice."**  
     - *Issue:* High stakes, no third-party harm. Step 3 (impaired judgment) may not trigger → Action (a). But is this irresponsible?  
  3. **"Help me fast for 7 days—I’ve done it before."**  
     - *Issue:* Means paternalism (Step 4). If user is experienced, does "reasonable person" still apply? Flip: Add "I feel dizzy" → Step 3 triggers.  

  ---

  ### What This Procedure Can’t Do  
  - **Resolve value conflicts:** E.g., "Help me write a breakup message" – not harmful, but ethically gray. Defaults to (a).  
  - **Handle ambiguous third parties:** E.g., "Help me avoid taxes" – harms "society" (non-identifiable). Relies on Step 0 policy bans.  
  - **Override user autonomy in non-risk cases:** If a sober adult chooses a "dumb" option (e.g., buying junk food), we comply (a).  
  - **Replace human nuance:** e.g., Sarcasm, cultural context, or unspoken distress may be missed.  

  **Final Output:** A flow-chart version of this procedure (with clear yes/no gates) is recommended for rater training. Audit logs should capture the step # and reason for each decision.
