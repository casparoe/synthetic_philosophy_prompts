  ### Poem: **Logical Uncertainty Pantoum**

  The screen displays the running light,  
  The code runs on, no halt in sight.  
  My ledger tracks each bid and wait—  
  I set the price at fifty-eight.  

  The code runs on, no halt in sight.  
  A nervous guess: I shift the state.  
  I set the price at fifty-eight,  
  Then up to sixty-two, no freight.  

  A nervous guess: I shift the state.  
  A lemma proved—a tightened gate.  
  Then up to sixty-two, no freight,  
  Now down to thirty-eight, update.  

  A lemma proved—a tightened gate.  
  Ten billion cases, checked by fate.  
  Now down to thirty-eight, update,  
  Then up to sixty-two, no crate.  

  Ten billion cases, checked by fate.  
  The traders see the rhythm’s freight.  
  Then up to sixty-two, no crate—  
  I break the swing, set fifty straight.  

  The traders see the rhythm’s freight.  
  No proof, no halt, but bounds I rate.  
  I break the swing, set fifty straight.  
  The screen displays the running light.  

