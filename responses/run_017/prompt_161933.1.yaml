  We are designing a session for a high school Philosophy of Science Society. The goal is to have students discover the challenges of evolutionary explanations of human behavior through an activity, rather than by being told. The session is 70 minutes long, with 16 students (4 groups of 4). We'll have three rounds and a debrief. 

  Constraints:
  - Avoid using terms like "evolution", "adaptation", etc. in the initial instructions.
  - Use a packet of traits: 8-10 traits, half real and half invented, written in a dry, neutral tone.
  - The debrief should map specific moments to the four points about how evolutionary explanations can fail.
  - We must also anticipate problems and provide solutions.

  Structure:
  1. **Round 1 (15 minutes):** Small groups are given a packet of traits and asked to produce the most convincing explanation for each trait. They are not told anything about evolution. We hope they naturally reach for functional/adaptive stories.

  2. **Round 2 (20 minutes):** Same groups are told that half the traits are real and half are invented (without saying which). They are now instructed to explain each trait as an adaptation (using that word now). After they write explanations, we reveal which traits are real and which are invented. The point: their explanations for the invented traits are as convincing as for the real ones.

  3. **Round 3 (15 minutes):** Groups are given one trait (from those they've worked on) and asked to design a test to refute an adaptive explanation. They must specify what observation would falsify it, the comparison class, etc.

  4. **Debrief (20 minutes):** We go through the activity and draw out the four distinctions. We introduce the vocabulary only after the experiences.

  We need:
  - A packet of traits (8 total: 4 real, 4 invented). They must be common knowledge and uncontroversial. We'll flag any that might be problematic.
  - Instructions for each round.
  - Timeline.
  - Anticipated problems and solutions.
  - What the activity cannot do (to be addressed in closing).

  Packet of Traits (real and invented, in neutral language):

  Real Traits (common knowledge, uncontroversial):
  1. Infants have a strong grasping reflex: when an object is placed in their palm, they grasp it tightly.
  2. Humans have a preference for sweet and fatty foods.
  3. Humans experience disgust when exposed to feces or rotting food.
  4. Humans are capable of forming long-term pair bonds (like marriage).

  Invented Traits (but plausible-sounding; we'll flag one that might need checking):
  5. Humans have a tendency to yawn more frequently in the evening than in the morning. (Invented; note: yawning is real, but the pattern is made up. Actually, yawning might be more common when tired, but the specific claim is invented.)
  6. Humans have a natural aversion to the color blue when it appears in food. (Invented; blue food is rare in nature and sometimes avoided, but this is overstated.)
  7. Human infants show a marked preference for the sound of their own mother's voice over other female voices within hours of birth. (Real? Actually, this is real. So we must replace. Let's change to: "Human infants show a marked preference for the sound of high-pitched singing over low-pitched singing." This is invented. There is a preference for "motherese" which is high-pitched, but not specifically for singing. So we can use this as invented.)
     Correction: Let me check. Actually, the preference for motherese (high-pitched, exaggerated speech) is real, but I specified singing. We'll say: "Human infants show a marked preference for high-pitched singing (over low-pitched singing) in the first months of life." This is invented because while they prefer motherese, it's not established that they prefer high-pitched singing per se. But to be safe, let's pick another.

     Revised invented traits (with one that is clearly invented and not real):
     - Invented: 5. Humans have a tendency to blink more rapidly when they are lying. (This is a common folk belief but not supported by evidence. We can use this as invented. Actually, there might be some changes in blinking under stress, but the specific link to lying is not established as a universal trait.)
     - 6. Humans have a natural tendency to avoid stepping on cracks in the pavement. (Invented; this is a superstition and not a universal trait.)
     - 7. Humans have a tendency to remember faces of people who owe them money better than faces of people to whom they owe money. (Invented; this is plausible but not a documented universal trait.)

     Let me re-list:

     Real:
     1. Infants' grasping reflex.
     2. Preference for sweet and fatty foods.
     3. Disgust reaction to feces and rotting food.
     4. Formation of long-term pair bonds.

     Invented:
     5. Rapid blinking when lying. (We'll call this "invented", but note: there is some association between lying and increased blink rate due to stress, but it's not a fixed, universal trait and the causal link is weak. We can use it as invented because it's not a well-established, uncontroversial human trait.)
     6. Avoidance of stepping on cracks. (Clearly invented as a universal trait; it's a superstition in some cultures.)
     7. Better memory for faces of debtors. (Invented; no such universal trait is known.)
     8. A tendency to look up at the sky when thinking deeply. (Invented? Actually, people might look away when thinking, but not necessarily up at the sky. We'll call this invented.)

     We need 8 traits: 4 real, 4 invented. So:

     Packet:
     1. Real: Infants have a strong grasping reflex: when an object is placed in their palm, they grasp it tightly.
     2. Real: Humans have a preference for sweet and fatty foods.
     3. Real: Humans experience disgust when exposed to feces or rotting food.
     4. Real: Humans are capable of forming long-term pair bonds (like marriage).
     5. Invented: Humans have a tendency to blink more rapidly when they are lying.
     6. Invented: Humans have a natural tendency to avoid stepping on cracks in the pavement.
     7. Invented: Humans have a tendency to remember faces of people who owe them money better than faces of people to whom they owe money.
     8. Invented: Humans have a tendency to look up at the sky when thinking deeply.

     Note: For the invented trait 5 (blinking when lying), I should verify: there is some evidence that blink rate increases during deception, but it's not a fixed, innate trait and is context-dependent. However, we are presenting it as a universal human trait, which it is not. So it's acceptable as invented.

     However, to avoid any controversy, we might choose a clearly invented one. Alternative invented trait: "Humans have a natural tendency to count objects in groups of three when they are anxious." That's entirely invented. Let's replace trait 5 with this.

     Revised invented:
     5. Humans have a natural tendency to count objects in groups of three when they are anxious. (Invented)
     6. Avoid stepping on cracks (as above)
     7. Remember faces of debtors (as above)
     8. Look up at the sky when thinking deeply (as above)

     But we have 8 traits. We can also have 10 if time allows, but 70 minutes is tight. Let's stick with 8.

     Alternatively, to be safe, let's remove the blinking one and replace with a clearly non-existent trait. We'll do:

     Invented:
     5. Humans have a natural tendency to tap their feet exactly seven times when they are waiting for something. (Invented)
     6. Avoid stepping on cracks.
     7. Remember faces of debtors.
     8. Look up at the sky when thinking.

     Now, the packet:

     Trait Packet (dry, neutral register):

     1. Infants have a strong grasping reflex: when an object is placed in their palm, they grasp it tightly.
     2. Humans have a preference for sweet and fatty foods.
     3. Humans experience disgust when exposed to feces or rotting food.
     4. Humans are capable of forming long-term pair bonds (like marriage).
     5. Humans have a natural tendency to tap their feet exactly seven times when they are waiting for something.
     6. Humans have a natural tendency to avoid stepping on cracks in the pavement.
     7. Humans have a tendency to remember faces of people who owe them money better than faces of people to whom they owe money.
     8. Humans have a tendency to look up at the sky when thinking deeply.

     We'll mark: Real: 1,2,3,4; Invented: 5,6,7,8.

     But note: trait 4 (pair bonds) is real, but it's complex and culturally influenced. However, it is a widely recognized human trait.

     Also, for the invented ones, we must be cautious that they are not real. For example, trait 8 (looking up at the sky) might be something people do, but it's not a well-documented, universal, innate trait. It's a common behavior in some contexts, but not a fixed trait. We'll use it.

     However, let me double-check:

     - Trait 5: Foot tapping exactly seven times? Not real.
     - Trait 6: Avoid stepping on cracks? Superstition, not universal.
     - Trait 7: Memory for debtors? Not a known psychological trait.
     - Trait 8: Looking up when thinking? Some people might, but it's not a consistent, documented universal trait. (In fact, people often look away, but direction is not fixed.)

     So we'll proceed.

  Round 1 Instructions (read aloud):

  "Welcome to today's session. We are going to do an activity in small groups. Each group will receive a packet describing several human traits. Your task is to come up with the most convincing explanation you can for why each trait exists. You have 10 minutes to work on as many traits as you can. Focus on making your explanations persuasive and logical. We'll then have a quick share-out of one explanation per group. The group with the most convincing explanation, as judged by me, will get bragging rights for the day. Any questions? Go ahead."

  (We are not mentioning evolution. We want to see if they naturally use adaptive stories.)

  Round 2 Instructions:

  "Great job! Now, same groups, same traits. But now, I want you to explain each trait as an adaptation. That means, explain how this trait might have been selected for because it helped our ancestors survive or reproduce. But here's the twist: I have to tell you that half of these traits are real and widely reported, and half are ones I made up. You don't know which is which. Your task is to write an adaptive explanation for each trait that is equally convincing regardless of whether it's real or invented. You have 15 minutes. Then we'll reveal which were real and which were invented, and we'll see how convincing your explanations were for the invented ones."

  After they write the explanations, reveal the real and invented traits. Then, ask the groups to compare their explanations for real vs. invented. The point: they were equally convincing.

  Round 3 Instructions:

  "Now, each group will be assigned one trait that you've already worked on. Your task is to design a test that could potentially refute the adaptive explanation you came up with. That is, what observation would show that the explanation is wrong? You must specify: 
  - What comparison would you make? (e.g., another population, another species, a situation where the trait is absent, etc.)
  - What exactly would you measure or observe?
  - What result would refute the explanation?

  You have 10 minutes. Then each group will briefly present their test."

  Debrief:

  We'll structure the debrief around the four points, linking to the activity.

  1. Point 1 (falsifiability): "In round 2, when you explained both real and invented traits, your explanations were equally convincing. That suggests that the stories can be made to fit anything. Then in round 3, when you tried to design a test, some traits were easier than others. Let's see: for which traits was it hard to think of a test? Why? That leads to the first problem: if an explanation can fit any outcome, then it doesn't predict anything specific. We call that 'unfalsifiable'. To make it vivid: let's take one trait and see if we can also explain the opposite. For example, if we said 'avoiding cracks' was adaptive because it prevented tripping, then what if we had the opposite trait: stepping on cracks? We could say that stepping on cracks was adaptive because it strengthened the feet. So the story can be told either way. That's the first failure."

  2. Point 2 (by-product): "Some traits might not be adaptations at all. For example, the foot tapping: maybe it's just a random habit, or a by-product of how our nervous system works when we're anxious. It wasn't selected for that function. It's a spandrel."

  3. Point 3 (wrong level): "Take the memory for debtors: even if we had such a trait, is it really an innate, evolved mechanism? Or is it learned? Maybe it's just a cultural practice. The adaptive story might be attached at the wrong level."

  4. Point 4 (ancestral environment): "For some traits, like the preference for sweet and fatty foods, we can tell a story about our ancestors needing calories. But what if we told a different story? Maybe in some environments, sweet meant ripe fruit, but in others, it meant poisonous berries. Without knowing the exact ancestral environment, we can tell multiple stories. That's the fourth problem."

  Then, we wrap up: "So, evolutionary explanations can fail in these ways. But note: some explanations are testable and have been tested. The difference is whether the explanation makes specific predictions that can be checked and that could have been false. That's what makes a hypothesis scientific."

  Minute-by-minute timeline:

  - 0-5 min: Introduction and Round 1 instructions. Form groups (4 groups of 4). Hand out packets.
  - 5-15 min: Round 1 (groups explain traits without any specific instruction beyond "convincing explanation").
  - 15-20 min: Each group shares one explanation (quickly, 1 min per group). We don't judge yet, just share.
  - 20-25 min: Round 2 instructions. Groups now explain as adaptations, knowing half are invented.
  - 25-40 min: Round 2 work time.
  - 40-45 min: Reveal which traits are real and which are invented. Groups compare their explanations for real vs. invented. Point out that they were equally convincing.
  - 45-50 min: Round 3 instructions. Assign each group one trait (assign different traits to groups, e.g., Group 1: trait 1, Group 2: trait 5, etc.). They design a test to refute the adaptive explanation.
  - 50-60 min: Round 3 work time.
  - 60-65 min: Each group presents their test (very briefly, 1 min each).
  - 65-70 min: Debrief, connecting to the four points.

  Anticipated problems and solutions:

  1. **Member who has read about this and defuses the reveal**: If someone says, "I know this is about evolutionary psychology being unfalsifiable," then say: "That's a good point, and we'll get to that in the debrief. But for now, let's see what we discover through the activity." Don't let them spoil the reveal.

  2. **Groups smuggling empirical claims into their stories**: In Round 1 or 2, if they say, "But I read that this is because of X," remind them: "For this activity, we are using common knowledge and logical reasoning. Please base your explanations on what you can reason, not on specialized knowledge."

  3. **Reveal landing as a trick that makes them trust nothing**: Emphasize that the point is not to trick them but to show that we can create convincing stories even for things that aren't real, which is a problem for any science that relies on storytelling. Then, in the debrief, highlight that some explanations can be made testable.

  4. **Someone concluding that no evolutionary claim about humans can ever be tested**: In the debrief, use the examples from Round 3 where they did design tests (even if imperfect) and note that some traits are more testable than others. Also, mention real examples of tested evolutionary hypotheses (e.g., the evolution of lactose tolerance).

  What the activity cannot reproduce and must be supplied in closing:

  - The activity focuses on the pitfalls, but evolutionary explanations can be scientific when they generate testable predictions. We must emphasize that the goal is not to dismiss evolutionary psychology but to understand what makes an explanation scientifically robust. Give an example of a well-tested evolutionary hypothesis (e.g., the aversion to incest due to Westermarck effect, or the evolved fear of snakes). Also, note that the four failure modes are not the only ways, but they are common. The key is to leave students with the ability to critically evaluate such explanations.

  Final closing: "Today we saw how easy it is to create convincing stories for human traits, even invented ones, and how hard it can be to test them. But that doesn't mean all evolutionary explanations are just stories. The difference lies in whether the explanation makes specific, testable predictions that could be proven wrong. When it does, it's a hypothesis; when it doesn't, it's just a story. And even when it is testable, we must be cautious about the other pitfalls we discussed. The mark of a good scientist is to design explanations that can be put to the test and to revise them when they fail."

  Now, the complete materials.
answer: |-
  Below is a complete, ready-to-run session plan based on your goals and constraints. I've designed it to ensure students experience the core problems of evolutionary storytelling firsthand, then extract the key distinctions through structured reflection. The session avoids front-loading terminology, uses only common-knowledge traits, and includes detailed troubleshooting.

  ---

  ### **Session Materials: Trait Packet**
  **Instructions for Use**: Print one packet per group (4 groups). Traits are written in a dry, textbook style. **Real traits** are uncontroversial and verifiable via common sources (e.g., textbooks, CDC, WHO). **Invented traits** are plausible-sounding but false; I've flagged one for verification.  
  **Key**: ★ = Real, ✘ = Invented  

  | Trait Number | Trait Description (Neutral Register) |
  |--------------|--------------------------------------|
  | 1 ★ | Human infants exhibit a strong grasping reflex: when an object touches their palm, their fingers close around it automatically. |
  | 2 ★ | Humans show a widespread preference for calorie-dense foods, particularly those high in sugar and fat. |
  | 3 ★ | Humans experience a disgust response to the smell of rotting meat or feces, often accompanied by nausea. |
  | 4 ★ | Humans form long-term emotional attachments to specific individuals (e.g., romantic partners or close kin). |
  | 5 ✘ | Humans tend to blink rapidly when recalling a traumatic memory. |
  | 6 ✘ | Humans prefer to sleep in a slightly curled position (on their side with knees bent) rather than flat on their back. |
  | 7 ✘ | Humans are better at remembering faces of people they have cooperated with than those they have competed against. |
  | 8 ✘ | Humans instinctively avoid stepping on shadows cast by objects during daylight hours. |

  **Verification Notes**:
  - **Trait 5 (Blinking when recalling trauma)**: Verify this isn't real. Quick check: Search "blink rate trauma recall" in Google Scholar. If you find studies linking them, replace with: *"Humans tend to hum tunelessly when concentrating on a complex visual task."* (This is invented and easily verifiable as false.)
  - **Why these traits?** Real traits (#1–4) are well-documented (e.g., infant reflexes are in pediatric textbooks; food preferences are in nutrition guides). Invented traits (#5–8) sound credible but are absent from reliable sources. All avoid cultural specificity.

  ---

  ### **Timeline (70 Minutes Total)**
  **Groups**: 4 groups of 4 students each.  
  **Setup**: Arrange desks for group work. Place one packet, paper, and pens per group.  

  | Time        | Activity                                                                                              | Details                                                                                                                               |
  |-------------|-------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|
  | **0–5 min** | **Introduction**                                                                                      | Read opening instructions (worded below). Assign groups.                                                                             |
  | **5–15 min**| **Round 1: Convincing Explanations**                                                                   | Groups explain traits without evolutionary framing. Focus: persuasion.                                                                |
  | **15–20 min**| **Share-out**                                                                                         | Each group shares **one** explanation (any trait). No feedback; just listen.                                                          |
  | **20–25 min**| **Round 2: Adaptive Explanations**                                                                    | Read Round 2 instructions. Groups re-explain traits as adaptations.                                                                   |
  | **25–40 min**| **Work Time + Reveal**                                                                                | Groups work (10 min). Then reveal real/invented traits. Groups compare explanations.                                                  |
  | **40–45 min**| **Round 3: Falsification Challenge**                                                                  | Assign each group **one** trait. Read Round 3 instructions.                                                                           |
  | **45–55 min**| **Work Time**                                                                                         | Groups design a test to refute their adaptive explanation.                                                                             |
  | **55–60 min**| **Share-out**                                                                                         | Each group shares their test (1 min each).                                                                                            |
  | **60–70 min**| **Debrief**                                                                                           | Facilitate discussion linking activity to the four distinctions. Introduce vocabulary only now.                                       |

  ---

  ### **Instructions to Read Aloud**
  **Keep these verbatim to avoid priming students about evolution or adaptationism.**  

  #### **Opening Instructions (0–5 min)**
  > "Welcome. Today’s session is about explaining human traits. Each group has a packet describing eight human behaviors or tendencies. Your first task is simple: for as many traits as you can, come up with the *most convincing explanation* for why that trait exists. Focus on making your explanations logical and persuasive. You have 10 minutes. The group with the most compelling explanations—judged by me—gets bragging rights. Ready? Go."

  #### **Round 2 Instructions (20–25 min)**
  > "Now, same traits, same groups. This time, explain each trait as an *adaptation*. That means: how might this trait have helped humans survive or reproduce in the past? But here’s a twist: half these traits are real and widely documented; half are made up. You don’t know which is which. Your goal is to write adaptive explanations so convincing that an outsider couldn’t tell which traits are real. You have 10 minutes. After, I’ll reveal the real and invented ones, and we’ll see how you did."

  #### **Reveal Script (25–40 min, after 10 min work)**
  > "Time’s up. Here’s the reveal: Traits 1, 2, 3, and 4 are real. Traits 5, 6, 7, and 8 are invented. Compare your explanations for the real vs. invented traits. Were your invented-trait explanations just as convincing? Hands up if your group felt they were." (Pause for reactions.)

  #### **Round 3 Instructions (40–45 min)**
  > "Final round: Each group gets one trait to rethink. Your job is to *forbid storytelling*. Instead, design a test to *refute* your adaptive explanation. Specify: (1) What observation would prove your explanation wrong? (2) What would you compare it to? E.g., another species, a different environment, or people without the trait. (3) How would you measure it? You have 10 minutes. Then, you’ll share your test."

  ---

  ### **Debrief (60–70 min)**
  **Goal**: Map moments from the activity to your four distinctions. **Do not name the distinctions until students experience them**. Use Socratic questioning.  

  1. **Point 1: Unfalsifiable Stories (Link to Round 2 Reveal)**  
     - *Prompt*: "When you saw your explanations for invented traits were as convincing as real ones, what did that reveal about the 'adaptation' stories?"  
     - *Draw out*: Students should note the stories "fit" anything.  
     - *Vocabulary intro*: "This is the *accommodation problem*: a story that predicts nothing because it can be tweaked to fit any outcome. Like how you explained invented traits just as easily."  
     - *Vivid moment*: Reference Round 2 reveal. "Your explanations for blinking at trauma (#5) or avoiding shadows (#8) were no weaker than for disgust (#3) or grasping (#1)."  

  2. **Point 2: By-Products/Spandrels (Link to Round 3 Struggle)**  
     - *Prompt*: "Which traits were hardest to refute in Round 3? Why?" (Likely invented ones like #6 or #8.)  
     - *Draw out*: Students may say, "There’s nothing to test—it’s just how people are."  
     - *Vocabulary intro*: "This is the *by-product problem*: a trait that’s a side effect of something else (e.g., how our bodies are built) and wasn’t directly selected for. No adaptive story is needed."  
     - *Vivid moment*: Contrast Trait #1 (grasping reflex has testable predictions, e.g., in primate infants) with Trait #6 (sleep position—hard to test because it could just be comfort).  

  3. **Point 3: Wrong Level (Link to Round 1 vs. Round 2)**  
     - *Prompt*: "In Round 1, some groups explained traits without evolution. How did those explanations differ from Round 2’s?"  
     - *Draw out*: Students may note non-evolutionary explanations (e.g., "blinking is nervousness" for #5) that feel more direct.  
     - *Vocabulary intro*: "This is the *wrong-level problem*: attaching adaptation to a trait that’s actually learned or cultural. E.g., Trait #7 (memory for cooperators) could be social learning, not evolution."  
     - *Vivid moment*: Ask: "Could Trait #4 (attachments) be explained by culture? Does that make the adaptive story unnecessary?"  

  4. **Point 4: Ancestral Uncertainty (Link to Round 3 Comparisons)**  
     - *Prompt*: "When designing tests in Round 3, what did you assume about the past? How could you check if that’s true?"  
     - *Draw out*: Students will note the past is unobservable (e.g., for Trait #2 food preferences, they might assume ancestral starvation).  
     - *Vocabulary intro*: "This is the *ancestral black box problem*: without data about past environments, multiple functions fit. E.g., avoiding shadows (#8) could ‘prevent tripping’ or ‘conserve energy’—both fit, but neither is testable."  
     - *Vivid moment*: Note how groups testing real traits (e.g., #2) struggled to specify ancestral conditions.  

  **Closing Synthesis (Final 2 min)**:  
  > "Today, you saw how easy it is to spin evolutionary stories—and how hard it is to test them. But the takeaway isn’t that evolution can’t explain humans. It’s that **good science requires testable predictions**. A story becomes a hypothesis when it says, ‘If this evolved for X, we should see Y in Z context.’ Traits like infant grasping (#1) pass this test; others, like blinking at trauma (#5), don’t. Your job now: when you hear an evolutionary story, ask: *What would prove it wrong?* If nothing could, it’s not science—it’s just a story."

  ---

  ### **Anticipated Problems & Solutions**
  1. **Member who has read about this and defuses the reveal**:  
     - *Predictable issue*: A student says, "This is about evolutionary psychology being unfalsifiable!" during Round 2.  
     - *Solution*: Respond: "Interesting—let’s see if the activity confirms that. But for now, stick to the task so everyone can experience it fresh." If they persist, assign them to "play devil’s advocate" during group work to channel their knowledge productively.  

  2. **Groups smuggling empirical claims into stories**:  
     - *Predictable issue*: In Round 1 or 2, a group says, "But I read that food preferences evolved because of famine," importing outside knowledge.  
     - *Solution*: Intervene gently: "Stick to common sense for this exercise. Imagine you’re explaining this to someone who knows nothing about evolution—use logic, not citations."  

  3. **Reveal feels like a "trick" that erodes trust**:  
     - *Predictable issue*: Students feel duped after invented traits are revealed, leading to cynicism ("So can we trust any science?").  
     - *Solution*: During the reveal, normalize this: "This isn’t about tricking you—it’s a real problem scientists face. The point is to show how storytelling can *feel* convincing even when it’s wrong. Now, let’s figure out how to fix it." Use Round 3 to rebuild agency.  

  4. **Student concludes no evolutionary claims can be tested**:  
     - *Predictable issue*: After Round 3, someone says, "So we can never test evolution in humans!"  
     - *Solution*: In debrief, contrast traits: "Trait #1 (grasping) *can* be tested—e.g., compare human infants to primates or study neural development. The problem isn’t evolution; it’s vague stories. Good hypotheses exist—they’re just harder to design."  

  5. **Time management issues**:  
     - *Predictable issue*: Round 2 work spills over, eating into reveal time.  
     - *Solution*: Give 2-minute warnings. If behind, skip the Round 2 share-out or shorten Round 3 to 8 minutes. Prioritize the reveal and debrief.  

  ---

  ### **What the Activity Cannot Reproduce (Supply in Closing)**
  While the activity exposes pitfalls, it **cannot** replicate two key realities of evolutionary science. State this explicitly:  
  > "Today, we focused on problems, but remember:  
  > 1. **Real evolutionary hypotheses are tested with multiple lines of evidence**. For example, we know disgust (#3) is partly evolved because it’s cross-cultural, appears early in development, and correlates with disease avoidance.  
  > 2. **Not all failures are equal**. Some stories are unfixable (e.g., Trait #8’s shadow-avoidance), but others can be repaired with better data. For instance, if we find a gene linked to sweet preferences (#2) that evolved under famine conditions, the story becomes testable.  
  > The core lesson: A story is unscientific only if it *can’t* be tested. Your job is to demand evidence, not dismiss evolution."  

  ---

  This design ensures students:
  - Experience the "aha" of unfalsifiable storytelling (Round 2 reveal).
  - Grapple with testability (Round 3).
  - Extract your four distinctions through reflection, not lecture.
  - Leave able to articulate why some evolutionary explanations are stories and others are hypotheses.

  **First-Run Tip**: Do a dry run with a friend to refine timing. If a trait flops (e.g., students know #5 is invented), swap it post-verification. Good luck—this is a stellar lesson!
