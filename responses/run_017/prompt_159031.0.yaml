prompt: |-
  I have been asked to advise the board of the public school district that hosts my university's teacher-training program, and I want to be sure I audit the argument the superintendent is actually making rather than the one it resembles. The board is deadlocked over whether promotion from eighth to ninth grade should turn on a single standardized exam. Rather than settle that, the superintendent proposes a four-year "parallel pilot": half the district's middle schools keep the exam gate, half replace it with a portfolio review conducted by teachers; every school reports annually to a common dashboard (ninth-grade course completion, subsequent test scores, attendance, dropout); and the board then adopts whichever version scores better, revisiting the question every four years thereafter. She presents this as taking Dewey seriously: inquiry begins in an indeterminate situation and resolves it by acting on the world and attending to what follows, so we do not need a prior account of what promotion is for — the experiment will tell us. Please audit the analogy, not the policy.

  Give me, in this order and at roughly these lengths: "The mapping" — a table of what is supposed to play the role of hypothesis, treatment group, control group, random assignment, replication, outcome measure, experimenter's standpoint, subjects, and closure, plus about 120 words on where the mapping is doing real work; "Where it holds" (about 120 words); "Disanalogies that matter for the use being made" (about 300 words: for each, say which step of her argument it undercuts — note in particular that the schools are not exchangeable units, that the units are cohorts rather than repeatable trials, that the dashboard's measures are not independent of the treatment and appear to presuppose one contested answer about what promotion is for, that the costs of a failed "trial" fall on children who cannot be re-run, and that there is no standpoint outside the dispute from which the results simply speak); "Disanalogies I should ignore" (about 100 words); "The strongest reply from inside the view" (about 150 words — I have in mind the claim that in social inquiry the fact that those affected are also the inquirers is a virtue, not a defect, since the public constitutes itself through inquiry; tell me what granting that costs the epistemic work the analogy was doing); "Does the conclusion survive?" (about 200 words, separating the weak claim that deliberate iteration beats deadlock from the strong claim that iteration can replace settling the end in advance, and specifying what would have to be supplied for the strong claim to be licensed — including whether pre-registering the dashboard before the pilot begins helps, and why or why not); and finally "A better analogy, if there is one" (about 150 words — consider whether the familiar federalist image of jurisdictions as laboratories, or something closer to common-law reasoning from precedent, carries more of the argument than the laboratory does).
reasoning: |-
  Hmm, the user wants me to audit an analogy being used by a school superintendent about an educational experiment. They're asking for a structured analysis of how the superintendent's "parallel pilot" program maps to John Dewey's philosophy of inquiry.

  Let me break this down systematically. The superintendent proposes splitting middle schools into two groups: one keeping standardized exams for 8th-to-9th grade promotion, the other using teacher portfolios. They'll track outcomes like course completion and dropout rates on a dashboard, then decide which approach works better every four years. She frames this as Deweyan inquiry - starting from uncertainty and letting action reveal the solution.

  First, I need to map the Deweyan elements to her proposal: Hypothesis (exam vs portfolio works better), Treatment/Control groups (portfolio vs exam schools), Random assignment (not actually random - schools choose or are assigned), Replication (four-year cycles), Outcome measures (dashboard metrics), Standpoint (district officials), Subjects (students), and Closure (board decision).

  The mapping does real work by framing uncertainty as productive and positioning data as the neutral arbiter. It holds well in treating the situation as indeterminate and valuing experiential learning. But there are critical disanalogies: schools aren't interchangeable lab rats, each "trial" affects real children who can't be reset, the dashboard metrics themselves presuppose educational values (undercutting the claim of neutrality), and there's no detached observer - the evaluators are stakeholders.

  Some disanalogies like imperfect randomization or messy replication can be ignored as inherent in social contexts. If I grant the Deweyan point that affected parties being inquirers is virtuous for democratic legitimacy, it costs the analogy's epistemic neutrality - the data becomes interpretation-laden.

  The conclusion survives weakly as better than deadlock through iterative learning, but the strong claim that this replaces philosophical debate fails. Pre-registering the dashboard helps somewhat by reducing goalpost-moving, but can't eliminate value judgments in metric selection or interpretation. 

  A better analogy might be Brandeisian laboratories of democracy (states as policy testers) or common law precedent-building - both accommodate value pluralism and gradual refinement better than the clinical trial metaphor. They accept that "what works" includes contested purposes from the start.

  Throughout this, I'll maintain the requested structure and lengths while focusing on the analogy's integrity rather than policy merits. The user seems sophisticated about educational philosophy and wants precision in dissecting the superintendent's rhetorical move.
answer: |-
  Here is the audit of the superintendent's Deweyan analogy, structured as requested:

  ### The Mapping
  | Deweyan Inquiry Element | Superintendent's Pilot Element | Notes |
  |------------------------|--------------------------------|-------|
  | **Hypothesis**         | Portfolio review *or* exam gate better promotes student success | Implicit: One method is superior |
  | **Treatment Group**    | Schools using portfolio review | Intervention being tested |
  | **Control Group**      | Schools retaining exam gate | Baseline condition |
  | **Random Assignment**  | Assignment of schools to conditions | Likely non-random, pragmatic |
  | **Replication**        | Annual reporting; 4-year cycles | Iterative data collection |
  | **Outcome Measure**    | Dashboard (course completion, test scores, attendance, dropout) | Quantified success indicators |
  | **Experimenter's Standpoint** | District board/researchers | Assumed neutral evaluators |
  | **Subjects**           | Cohorts of students | Units experiencing the intervention |
  | **Closure**            | Board adopts "better" version | Decision based on dashboard data |

  **Mapping Work (120 words):** The mapping does real work by framing policy uncertainty as a solvable empirical problem. It converts a values conflict (what *should* promotion achieve?) into a technical one (what *does* yield better dashboard metrics?). By casting the board as experimenters guided by data, it promises to bypass ideological deadlock through neutral observation. Dewey’s emphasis on "acting to resolve indeterminacy" justifies the pilot as action-oriented inquiry, positioning the dashboard as the "experience" that educates the district. This reframes the debate from normative philosophy to instrumental effectiveness, suggesting the experiment itself will define "success."

  ### Where It Holds (120 words)
  The analogy holds in capturing Dewey’s core logic of *experiential learning through deliberate intervention*. Facing an indeterminate situation (policy deadlock), the district acts (implements parallel systems), observes consequences (dashboard metrics), and uses feedback for future action (4-year adoption decision). This embodies Deweyan pragmatism: knowledge arises from testing ideas in practice. The iterative structure ("revisiting every four years") mirrors Dewey’s view of inquiry as continuous, acknowledging fallibility and allowing course-correction. The superintendent correctly invokes Dewey’s rejection of rigid *a priori* principles; the pilot *does* avoid committing to a fixed theory of promotion upfront, instead letting outcomes guide policy.

  ### Disanalogies That Matter for the Use Being Made (300 words)
  1. **Non-exchangeable Units & Non-random Assignment:** Schools differ in resources, demographics, and culture. Non-random assignment (likely logistical/political) means groups aren’t equivalent, confounding results (e.g., if stronger schools volunteer for portfolios). *Undercuts*: The validity of attributing outcome differences solely to the treatment. If groups aren’t comparable, "better scores" may reflect pre-existing disparities, not treatment efficacy.
     
  2. **Cohorts as Non-Repeatable Trials:** Each "trial" involves unique cohorts experiencing irreversible educational trajectories. Unlike lab experiments, you cannot reset conditions or run identical trials. *Undercuts*: The idea of "replication" and generalizability. Findings from one cohort may not apply to the next due to cohort effects or changing contexts.

  3. **Outcome Measures Presuppose Contested Ends:** The dashboard metrics (test scores, course completion) implicitly prioritize academic achievement/stability as the goal of promotion. Proponents of holistic development or equity may reject these as incomplete or biased. *Undercuts*: The claim that the experiment avoids "a prior account of what promotion is for." Selecting metrics *is* a normative choice, favoring one vision (quantifiable outcomes) over others (e.g., student well-being, creativity). The treatment (portfolio review) might aim for goals not captured by the dashboard.

  4. **Irreversible Costs to Non-Consenting Subjects:** Students bear the risk of inferior promotion systems during the trial. A "failed" portfolio group suffers lasting harm (e.g., dropout, damaged confidence). *Undercuts*: The ethical analogy to experimental inquiry. Deweyan inquiry assumes actors bear consequences, but here vulnerable, non-consenting minors bear the brunt of district "learning." This violates the experimental ideal of risk mitigation and informed consent.

  5. **No Neutral Standpoint for Interpretation:** The board, teachers, and community are stakeholders invested in outcomes. Data interpretation (what "better" means) will be influenced by pre-existing biases and power dynamics. *Undercuts*: The notion that results "simply speak." Deciding which metric matters most or whether differences are meaningful requires judgment inseparable from the values the pilot aimed to bypass.

  ### Disanalogies I Should Ignore (100 words)
  Ignore imperfect randomization and minor implementation variations across schools. Social experiments cannot achieve lab-grade controls; Deweyan inquiry embraces real-world complexity. Also ignore that "closure" is temporary (revisiting every 4 years). Dewey saw inquiry as continuous, so iterative refinement aligns with his view. The lack of a literal "hypothesis" stated upfront is fine – Dewey emphasized starting from felt problems, not formal hypotheses. The pilot’s pragmatic embrace of ongoing adjustment fits Dewey’s anti-foundationalism better than a rigid experimental protocol would.

  ### The Strongest Reply from Inside the View (150 words)
  Granting that "those affected are also inquirers" is a virtue strengthens democratic legitimacy: the community *constitutes itself* through collective experimentation. Students, teachers, and parents aren’t passive subjects but participants in meaning-making. The pilot becomes a civic learning process, fostering public deliberation about educational values as dashboard data is debated. This transforms the "standpoint" problem into an asset – knowledge is socially co-constructed through shared experience. **Cost to Epistemic Work:** This concedes that the analogy cannot provide *neutral*, value-free knowledge to settle the dispute technocratically. The data doesn’t "speak"; it becomes fodder for inherently political interpretation. The epistemic hope of the experiment resolving indeterminacy objectively collapses into a process of democratic contestation, which may perpetuate rather than resolve the original deadlock if values remain irreconcilable.

  ### Does the Conclusion Survive? (200 words)
  **Weak Claim (Iteration beats deadlock):** Yes. Deliberate iteration with data collection is preferable to static deadlock. It forces engagement with evidence, enables learning, and may build consensus over time by revealing unforeseen consequences or practical compromises. The pilot structure creates feedback loops absent in pure debate.

  **Strong Claim (Iteration replaces settling ends in advance):** No. The dashboard cannot arbitrate without presupposing ends (via metric selection). Pre-registration helps marginally by reducing cherry-picking post-hoc, but cannot resolve the core disanalogy: **Choosing/weighting metrics requires a prior conception of "success."** Is a 5% higher algebra pass rate worth a 2% higher dropout rate? Data cannot answer this; it demands value judgment. For the strong claim to hold, the district must first *agree* on what constitutes "better" promotion (e.g., define/weight dashboard metrics collectively *before* the pilot) and establish ethical safeguards for students in the "losing" group. Even then, the non-exchangeable units and cohort effects limit causal certainty. The analogy licenses iterative *learning*, not value-neutral *resolution*.

  ### A Better Analogy, If There Is One (150 words)
  **Common-Law Reasoning** is a stronger analogy than the laboratory. Judges face indeterminate cases without a single "correct" rule. They:
  - **Act** (make a ruling based on precedent/principles),
  - **Observe Consequences** (societal impact, fairness, new disputes),
  - **Iteratively Refine Rules** (later cases distinguish or overrule based on experience).
  Like the pilot, it avoids rigid *a priori* ends, using practical wisdom (*phronesis*) to adapt rules to complex realities. "Precedent" (past cohort data) informs but doesn’t dictate future decisions, allowing evolution. It better accommodates:
  - **Non-fungible units** (each case/school is unique but informs principles),
  - **Value-laden interpretation** (judges/board weigh multiple goods),
  - **Irreversible impacts** (rulings affect parties, but process aims for restorative justice),
  - **Standpoint within the system** (no view from nowhere).
  It frames the pilot as building case-based wisdom, not running a controlled experiment.
