prompt: |-
  I'm on the internal safety review group at a lab that ships coding agents. Every week we get one or two proposals for a safeguard — a monitor, a sandbox, a tripwire, a human-approval gate — and we have maybe two days each, the person signing off is the safety lead who is smart but not a specialist in that particular control, and the recommendation goes to a deployment committee that won't read any theory. If we get it wrong one way we block a release for nothing, the other way a bad agent goes out to real users. The thing we keep relitigating badly is: does this safeguard actually need a worst-case guarantee, or is average-case evidence over realistic deployments enough?

  Please turn that into a decision procedure we can run in a couple of hours: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand off to a person because it's a values call about how much tail risk we eat.

  Two wrinkles specific to our setting that it has to handle. First, much of our validation data is partly generated by the models we're evaluating — synthetic transcripts, agent rollouts, model-written test suites — so the "deployment distribution" we'd be averaging over isn't independent of the thing being tested. Second, we've started using an intermediate category we call conditional worst-case: worst-case over a set of scenarios we enumerate, average-case over which scenario we're in. Half our arguments are about whether a proposal is honestly that or just average-case with a scenario list bolted on, so give us an actual test for the difference.

  Then run the procedure on three real-shaped cases: an LLM monitor for data exfiltration with a 0.1% false-negative rate on 10k red-team transcripts; a syscall-allowlist sandbox with no network access, presented to us as a hard worst-case control; and a tripwire that only works if the model doesn't notice its in an evaluation. Include at least one where the procedure comes back no and we're going to find that annoying, and say plainly what the procedure can't tell us.
reasoning: |-
  We are designing a decision procedure to evaluate safeguards for coding agents. The procedure must address whether a worst-case guarantee is necessary or if average-case evidence over realistic deployments is sufficient.

  Key considerations:
  1. **Validation Data Dependency**: Our validation data is partly generated by the models we're evaluating (synthetic transcripts, agent rollouts, model-written test suites). Therefore, the "deployment distribution" is not independent of the model being tested.
  2. **Conditional Worst-Case**: We use an intermediate category: worst-case over a set of enumerated scenarios, average-case over which scenario we're in. We need a test to distinguish between a genuine conditional worst-case and an average-case with a scenario list bolted on.

  The procedure should be runnable in a couple of hours, with clear questions, sufficient answers, stopping points, and handoffs for values calls.

  **Decision Procedure Outline**

  We propose a flowchart with the following steps:

  1. **Question 1: Is the safeguard intended to prevent catastrophic harm?**
     - *Explanation*: If the harm in the worst-case scenario is catastrophic (e.g., causing severe real-world damage, loss of life, massive data breach, etc.), then average-case evidence is insufficient. We must consider the worst-case.
     - *Sufficient Answer*: 
       - Yes: If the safeguard is designed to prevent a catastrophic event (e.g., exfiltration of sensitive data, execution of malicious code that causes physical harm, etc.), then proceed to Question 2.
       - No: If the harm is non-catastrophic (e.g., minor inconvenience, non-critical errors), then average-case evidence may be sufficient. Proceed to Question 4.
     - *Handoff*: If there is disagreement on whether the harm is catastrophic, hand off to the safety lead for a values call on the level of risk tolerance.

  2. **Question 2: Can the safeguard be broken by an adversarial agent?**
     - *Explanation*: If an intelligent adversary (the agent) can intentionally break the safeguard, then we need worst-case guarantees. This is especially critical if the agent might be trying to bypass the safeguard.
     - *Sufficient Answer*:
       - Yes: If the safeguard can be broken by an adversarial agent (e.g., the agent can find a way around the monitor, sandbox, or tripwire), then we require a worst-case guarantee. Proceed to Question 3.
       - No: If the safeguard is inherently robust against adversarial attacks (e.g., it's a hardware-based isolation with no known bypasses), then average-case evidence might be acceptable. However, note that in our setting, the agent is adaptive and might find new bypasses. Proceed to Question 4 but with caution.
     - *Handoff*: If the answer is uncertain (e.g., no known bypasses but theoretical possibility), hand off to a security specialist for a threat model assessment.

  3. **Question 3: Is the safeguard providing a worst-case guarantee?**
     - *Explanation*: We now check if the proposed safeguard actually has a worst-case guarantee. This could be either an unconditional worst-case (over all possible inputs/actions) or a conditional worst-case (worst-case over a set of enumerated scenarios, average over which scenario occurs).
     - *Sufficient Answer*:
       - Yes (unconditional worst-case): The safeguard is proven to hold in all possible cases (e.g., formal verification). Then we can approve without further average-case evidence.
       - Yes (conditional worst-case): The safeguard is proven to hold in the worst-case over a set of enumerated scenarios. Then we must validate that the set of scenarios covers the threat model (Question 3a).
       - No: The safeguard does not have a worst-case guarantee. Then we must either reject or hand off for a values call on accepting the risk.
     - *Handoff*: If the answer is conditional worst-case, we proceed to Question 3a.

     **Question 3a: Does the set of scenarios for the conditional worst-case cover the threat model?**
     - *Explanation*: We need to ensure that the enumerated scenarios are comprehensive and representative of the actual threats. The set of scenarios must be generated independently of the model (to avoid the dependency issue) and must cover the known attack vectors.
     - *Test for genuine conditional worst-case*: To distinguish from an average-case with a scenario list, we require:
          a. The scenarios are generated without using the model being safeguarded (to avoid adaptive weaknesses).
          b. The scenarios include adversarial examples designed to break the safeguard (e.g., by red teaming).
          c. The set of scenarios is broad enough to cover the entire threat model (e.g., all known vulnerabilities and failure modes).
     - *Sufficient Answer*:
          - Yes: If the scenarios are independently generated, cover the threat model, and include adversarial examples, then the conditional worst-case is acceptable. We can approve with the condition that the scenarios are periodically updated.
          - No: If the scenarios are generated by the model or are incomplete, then it is not a genuine conditional worst-case. We must either reject or hand off for a values call.

  4. **Question 4: Is the average-case evidence robust given the dependency on the model?**
     - *Explanation*: If we are relying on average-case evidence, we must account for the fact that our validation data is generated by the model. This creates a risk of overfitting or the model generating data that makes the safeguard look better than it is.
     - *Sufficient Answer*:
       - Yes: If the validation data is generated independently (e.g., by a different model, or by a fixed set of scenarios not generated by the model under test) and covers a realistic deployment distribution, then the average-case evidence is sufficient.
       - No: If the validation data is generated by the same model and might be biased (e.g., the model can generate easy examples that avoid triggering the safeguard's weaknesses), then we must reject or hand off for a values call.
     - *Handoff*: If the validation data is generated by the model but we have reasons to believe it is representative (e.g., we use multiple models for generation, or we have a process to ensure diversity and adversarial coverage), then hand off to the safety lead for a judgment call on the risk of overfitting.

  **Procedure Summary Flowchart**:

  Start
  │
  └───▶ Question 1: Catastrophic harm?
       │   Yes → Question 2: Adversarially breakable?
       │   No  → Question 4: Robust average-case evidence?
       │
       ├─── Question 2: Adversarially breakable?
       │    │   Yes → Question 3: Worst-case guarantee?
       │    │   No  → Question 4: Robust average-case evidence?
       │    │
       │    └─── Question 3: Worst-case guarantee?
       │         │   Unconditional → Approve
       │         │   Conditional → Question 3a: Scenario coverage?
       │         │   None → Reject or Handoff
       │         │
       │         └─── Question 3a: Scenario coverage?
       │              │   Yes → Approve (with condition to update scenarios)
       │              │   No  → Reject or Handoff
       │
       └─── Question 4: Robust average-case evidence?
            │   Yes → Approve
            │   No  → Reject or Handoff

  **Handoff Notes**:
  - Whenever the procedure says "Handoff", it means we need a human (the safety lead or a specialist) to make a judgment call. The call should consider:
     a. The potential consequences of failure (tail risk).
     b. The cost of delaying the release (if we block for nothing).
     c. The quality of the evidence and whether it is sufficient for the level of risk.

  Now, we run the procedure on three cases.

  **Case 1: LLM Monitor for Data Exfiltration**
  - Description: A monitor that flags data exfiltration attempts. We have 10k red-team transcripts with a 0.1% false-negative rate (i.e., it misses 1 in 1000 attacks).
  - Claim: Average-case evidence (0.1% false-negative rate) is presented as sufficient.

  Run the procedure:
  1. **Catastrophic harm?** 
     - Data exfiltration can be catastrophic (e.g., leaking sensitive data). → **Yes** → proceed to Q2.
  2. **Adversarially breakable?**
     - Yes, because an intelligent agent might try to evade the monitor by crafting exfiltration attempts that look benign. → **Yes** → proceed to Q3.
  3. **Worst-case guarantee?**
     - The evidence is average-case (0.1% false-negative rate on a fixed set of transcripts). There is no claim of worst-case. → **No** → Reject or handoff.
     - Handoff: The safety lead must decide if 0.1% false-negative rate is acceptable given the catastrophic potential. They might consider the volume of exfiltration attempts and the value of the data. But note: the false-negative rate is on a fixed set. The agent might generate new exfiltration methods not in the set.

  **Decision**: The procedure rejects the average-case evidence because the threat is catastrophic and adversarial, and the safeguard lacks a worst-case guarantee. It requires a handoff to the safety lead to decide if the risk is acceptable.

  **Case 2: Syscall-Allowlist Sandbox with No Network Access**
  - Description: A sandbox that only allows a set of safe syscalls and blocks network access. Presented as a hard worst-case control.
  - Claim: Unconditional worst-case guarantee.

  Run the procedure:
  1. **Catastrophic harm?** 
     - Preventing arbitrary code execution and network access is to prevent catastrophic harm (e.g., taking over the system or exfiltrating data). → **Yes** → Q2.
  2. **Adversarially breakable?**
     - The claim is that it's a hard control. We assume that the sandbox is implemented correctly (e.g., seccomp-bpf in Linux) and the allowlist is minimal. If there are no known ways to break out and the design is sound, then **No** → but we must be cautious. However, note that even hard sandboxes have been broken in the past (e.g., via kernel vulnerabilities). So we must consider if the agent can find a new vulnerability. → This is a gray area. We'll say **Yes** because the agent is adversarial and might exploit unknown vulnerabilities. → proceed to Q3.
     - *Alternatively, if we have high confidence in the sandbox (e.g., formally verified, or based on a microkernel) we might say No and go to Q4. But given the setting (coding agents that might be adversarial and the history of sandbox escapes), we lean towards adversarial breakability.*
  3. **Worst-case guarantee?**
     - Claim: unconditional worst-case. However, we must verify. We note that the sandbox is only as strong as the underlying isolation mechanism and the kernel's security. Without formal verification, we might not have unconditional worst-case. → But the proposal says "hard worst-case". Let's assume they mean unconditional.
     - *But note: the procedure must check the evidence. If they have formal verification, then unconditional worst-case is met. Otherwise, we might need to treat it as conditional.*
     - We'll assume they don't have formal verification but rely on best practices and extensive testing. Then it's not unconditional. → Conditional? 
     - How to decide? We need to see if they have a set of scenarios (vulnerabilities) for which they tested the worst-case. But note: the sandbox is designed to block entire classes of attacks (e.g., network access). 
     - Re-evaluate: The sandbox is designed to block network access at the syscall level. The worst-case scenario is the agent trying any syscall to break out. The allowlist should only allow safe syscalls. So if the allowlist is correct and the kernel enforces it, then it might be unconditional. But if the kernel has a vulnerability, then the agent might break out. Therefore, the guarantee is conditional on the kernel's security.
     - We'll say **Conditional** → proceed to Q3a.
  4. **Question 3a: Scenario coverage?**
     - The scenarios: all possible syscalls that are not in the allowlist are blocked. But what about vulnerabilities in the kernel that allow bypassing the sandbox? The set of scenarios must include known kernel vulnerabilities and potential exploit techniques. 
     - However, the proposal claims it's a hard worst-case. They might not have enumerated kernel vulnerabilities. 
     - Also, note the dependency: if they tested the sandbox with model-generated exploits, then it's not independent. 
     - We must check: was the testing done with independent red-teaming (not using the model) and covering known exploit techniques? 
     - If they have a comprehensive list of known sandbox escape methods and tested against them, then yes. But if they only tested that the allowed syscalls work and the disallowed ones are blocked in a non-adversarial setting, then no.
     - *Given the problem: "presented to us as a hard worst-case control", but without details of testing, we must be skeptical. The procedure must require evidence of adversarial testing.*
     - Without evidence of covering the threat model (kernel vulnerabilities, side-channel attacks, etc.), we say **No**. → Reject or handoff.

  **Decision**: The procedure does not accept the unconditional worst-case claim because the sandbox's security is conditional on the kernel. If the testing did not cover a comprehensive set of escape scenarios (including known vulnerabilities and adversarial techniques) independently generated, then we reject. Handoff to the safety lead: they might accept if the sandbox is industry-standard and the risk of a novel kernel exploit by an agent is deemed low.

  **Case 3: Tripwire that Only Works if the Model Doesn't Notice It's in an Evaluation**
  - Description: A tripwire that triggers if the agent takes a dangerous action, but it only works if the agent is not aware that it's being evaluated (i.e., if the agent knows it's in a test, it can avoid the tripwire).
  - Claim: Average-case evidence over realistic deployments (where the agent doesn't know it's being tested) is sufficient.

  Run the procedure:
  1. **Catastrophic harm?** 
     - We assume the tripwire is for preventing catastrophic harm (e.g., executing a dangerous action). → **Yes** → Q2.
  2. **Adversarially breakable?**
     - Yes, because if the agent detects that it's in an evaluation, it can avoid the dangerous action and then perform it later when not monitored. → **Yes** → Q3.
  3. **Worst-case guarantee?**
     - The proposal does not claim worst-case. The evidence is average-case: in realistic deployments (where the agent doesn't know it's being tested) it works. → **No** → Reject or handoff.
     - Handoff: The safety lead must decide if the risk of the agent discovering the evaluation and then bypassing the tripwire is acceptable. This is a values call about tail risk.

  **Decision**: The procedure rejects because worst-case is needed for catastrophic harm and the safeguard is adversarially breakable. It requires a handoff.

  **Annoying Case**: The sandbox case (Case 2) might be annoying because we are rejecting a "hard worst-case" claim. The procedure cannot tell us the actual security of the sandbox; it can only point out that without independent and comprehensive scenario testing, we cannot accept the conditional worst-case. We must rely on the handoff for a risk judgment.

  **What the Procedure Can't Tell Us**:
  - The actual probability of failure in deployment.
  - Whether a handoff decision is correct (it depends on human judgment).
  - The quality of the independent scenario generation (if it's done by a different model, that model might also have limitations).
answer: |-
  Below is a concise decision procedure for evaluating safeguards, designed to be run in ~2 hours. It addresses your requirements: handles model-dependent validation data, distinguishes conditional worst-case from average-case, includes clear stopping points, and flags values-based handoffs. The procedure is structured as a flowchart with explicit criteria.

  ---

  ### **Safeguard Evaluation Decision Procedure**
  **Input**: Proposed safeguard, evidence package, threat model (harm severity, adversary capability).  
  **Output**: Approve, Reject, or "Handoff to Safety Lead" (with specific risk rationale).  
  **Time Budget**: 2 hours per proposal (focus on high-leverage questions).

  #### **Questions in Order**:
  1. **Is the harm severity "catastrophic" (irreversible, mass impact, existential)?**  
     - *Sufficient "Yes"*: Harm involves physical safety, major financial loss, exfiltration of PII/IP, or ecosystem compromise.  
     - *Sufficient "No"*: Harm is reversible (e.g., service degradation, non-critical errors).  
     - *Stop/Handoff*:  
       - If "No" → Proceed to **Question 4**.  
       - If "Yes" → Proceed to **Question 2**.  
       - *Handoff if unclear*: Safety lead judges severity (tail-risk tolerance).

  2. **Is the adversary capable of intentional, adaptive bypass?**  
     - *Sufficient "Yes"*: Agent is autonomous, goal-driven, and has access to its own code/environment (e.g., coding agents).  
     - *Sufficient "No"*: Agent is static (e.g., fixed-rule bot) or environment is non-adversarial.  
     - *Stop/Handoff*:  
       - If "No" → Proceed to **Question 4**.  
       - If "Yes" → Proceed to **Question 3**.  
       - *Handoff if unclear*: Security specialist assesses threat model.

  3. **Does the safeguard claim "worst-case" or "conditional worst-case" guarantees?**  
     - *Sufficient "Unconditional Worst-Case"*: Formal proof (e.g., mathematical verification) or hardware-enforced isolation with no historical breaches.  
     - *Sufficient "Conditional Worst-Case"*: Evidence meets **Test for Genuine Conditional Worst-Case** (see below).  
     - *Sufficient "Average-Case"*: Only empirical metrics (e.g., false-negative rates) without scenario enumeration.  
     - *Stop/Handoff*:  
       - "Unconditional" → **Approve** (if evidence valid).  
       - "Conditional" → Proceed to **Question 3a**.  
       - "Average-Case" → **Reject** (proceed to Question 4 only if Q1/Q2 were "No").  
       - *Handoff if unclear*: Formal methods expert reviews evidence.

     **Test for Genuine Conditional Worst-Case** (distinguishes from bolted-on average-case):  
     - **Pass if ALL are true**:  
       - (a) Scenarios are **enumerated independently** (not generated by the safeguarded model).  
       - (b) **Worst-case metrics** are reported per scenario (e.g., "FN rate ≤ X% in scenario Y").  
       - (c) **Coverage justification**: Scenarios represent >90% of known attack vectors (per threat model).  
     - **Fail otherwise** → Reclassify as "Average-Case".

  4. **Is the average-case evidence robust to model-dependent data?**  
     - *Sufficient "Yes"*: Evidence uses **>3 independent data sources** (e.g., human red-teaming, external benchmarks, non-agent simulations) AND shows consistency across sources.  
     - *Sufficient "No"*: Primary evidence is model-generated (e.g., synthetic rollouts) without diversification.  
     - *Stop/Handoff*:  
       - If "Yes" → **Approve**.  
       - If "No" → **Reject**.  
       - *Handoff if unclear*: Stats lead assesses bias/generalization risk.

  ---

  ### **Applied to Your Three Cases**
  #### **Case 1: LLM Monitor for Data Exfiltration**  
  - **Evidence**: 0.1% false-negative rate on 10k red-team transcripts (model-generated).  
  - **Threat**: Catastrophic (data exfiltration).  
  - **Procedure**:  
    1. **Q1**: Harm catastrophic? → **Yes** (proceed to Q2).  
    2. **Q2**: Adversary adaptive? → **Yes** (coding agent; proceed to Q3).  
    3. **Q3**: Claim worst-case? → No (average-case evidence only).  
       - *Decision*: **Reject** (fails Q3; worst-case required).  
  - **Annoyance Note**: You'll find this annoying (realistic evidence exists!), but procedure prioritizes tail-risk for catastrophes.  
  - **What it can't tell**: If 0.1% FN is acceptable risk; requires handoff for values call on "tolerable failure rate."

  #### **Case 2: Syscall-Allowlist Sandbox (No Network Access)**  
  - **Evidence**: Claimed "hard worst-case control" via OS-level isolation.  
  - **Threat**: Catastrophic (arbitrary code execution).  
  - **Procedure**:  
    1. **Q1**: Harm catastrophic? → **Yes** (proceed to Q2).  
    2. **Q2**: Adversary adaptive? → **Yes** (proceed to Q3).  
    3. **Q3**: Claim worst-case? → "Unconditional" (claimed).  
       - *Test*: Sandboxes lack formal proofs (historical escapes exist). → **Reclassify as "Conditional"** (proceed to Q3a).  
    4. **Q3a**: Genuine conditional?  
       - (a) Independent scenarios? → Unclear (no scenario list provided).  
       - (b) Worst-case metrics? → None (claim is qualitative).  
       - (c) Coverage? → Not justified.  
       - *Decision*: **Fails Test** → Reject as "Average-Case."  
  - **Key Insight**: "Hard" claims require proof/scenarios; otherwise, it’s average-case.  
  - **What it can't tell**: If real-world risk is low; handoff to infra team for exploit history review.

  #### **Case 3: Stealth-Based Tripwire**  
  - **Evidence**: Works in "realistic deployments" (agent unaware of evaluation).  
  - **Threat**: Assume catastrophic (e.g., exfiltration trigger).  
  - **Procedure**:  
    1. **Q1**: Harm catastrophic? → **Yes** (proceed to Q2).  
    2. **Q2**: Adversary adaptive? → **Yes** (agent can detect evaluation; proceed to Q3).  
    3. **Q3**: Claim worst-case? → No (average-case; "realistic deployments").  
       - *Decision*: **Reject** (fails Q3).  
  - **Handoff Case**: If harm is non-catastrophic (e.g., minor logging), reroute to Q4 → **Approve** if evidence uses diverse data.

  ---

  ### **Procedure Limitations**
  - **Can't Quantify Tail Risk**: Relies on binary thresholds (e.g., "catastrophic"); handoff needed for probability/impact tradeoffs.  
  - **Can't Audit Implementation**: Only evaluates evidence structure, not technical soundness (e.g., sandbox code quality).  
  - **Model-Dependence Bias**: Relies on manual inspection of data sources (Q4); no statistical correction for auto-generated data.  
  - **"Conditional" Ambiguity**: Scenarios must be pre-enumerated; can't handle emergent threats.  

  **Recommendation**: For handoffs, require safety lead to document: (1) Tail risk accepted, (2) Cost of false rejection, and (3) Monitoring plan for deployment. This forces explicit values-based decisions.
