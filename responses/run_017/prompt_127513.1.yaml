  ### Non-Human Agency Sorting Instrument  
  **For Novelists Stuck in Philosophical Mud**  
  *Photocopy this 1-page decision tree for your writing group. Answer each question with ✓ or ✗ based on your narrative instincts. No library required—just your gut and the valley's disasters. Total questions: 8. Workshop time: ~90 mins.*

  ---

  #### **The Decision Tree**  
  *Start here. Answer sequentially. Each question uses a concrete case from your novellas.*  

  1. **The Ship Swap Test (1347):**  
     If the ship brought a *different plague* (e.g., faster-killing, less contagious), would the valley’s social collapse unfold identically?  
     - **✓ = Yes** (The valley’s fate hinges on human flaws, not the germ’s specifics)  
     - **✗ = No** (The germ’s unique traits actively shaped events)  
     *Branch point: ✓ → Q2; ✗ → Q3*  

  2. **The Landlord’s Blight (Potato Field):**  
     If the blight struck, but the landlord *stopped exporting grain*, would famine still ravage the valley?  
     - **✓ = Yes** (The blight alone was enough to doom them)  
     - **✗ = No** (Famine required the landlord’s greed + blight)  
     *Branch: ✓ → **STRONG ENVIRONMENTAL DETERMINISM**; ✗ → Q4*  

  3. **The River’s Memory (Flood Plain):**  
     When you write “the river remembers its old path,” is this *more than metaphor*?  
     - **✓ = Yes** (The river has agency; it’s not just poetic license)  
     - **✗ = No** (It’s ventriloquy—I’m projecting intent onto inert nature)  
     *Branch: ✓ → Q5; ✗ → Q6*  

  4. **Cholera’s Negotiability (Outbreak):**  
     Could villagers have *prevented deaths* by avoiding the tainted well? If yes, does that mean cholera wasn’t an agent?  
     - **✓ = Yes** (Cholera is a condition, not an actor)  
     - **✗ = No** (Cholera acted regardless of human choices)  
     *Branch: ✓ → Q7; ✗ → Q5*  

  5. **Eruption’s Lag (1816):**  
     Could the volcano *influence the plot* if its eruption occurred centuries earlier (e.g., ash layers altering soil)?  
     - **✓ = Yes** (Slow processes are agents, even if unseen)  
     - **✗ = No** (If characters can’t perceive it, it’s just backstory)  
     *Branch: ✓ → **ACTOR-NETWORK SYMMETRY**; ✗ → Q8*  

  6. **Frost’s Decision (Failed Harvest):**  
     If “the frost chose the valley” implies *literal intent*, must you give frost motives like a human character?  
     - **✓ = Yes** (Agency demands interiority)  
     - **✗ = No** (Frost “choosing” is just vivid description)  
     *Branch: ✓ → **HUMANIST VIEW**; ✗ → Q7*  

  7. **Reader’s Counterfactual (Year Without Summer):**  
     Should the narrative *invite imagining 1816 without the eruption*?  
     - **✓ = Yes** (The eruption is removable context)  
     - **✗ = No** (The eruption is inseparable from the valley’s identity)  
     *Branch: ✓ → **CONJUNCTURAL/VULNERABILITY VIEW**; ✗ → **STRONG ENVIRONMENTAL DETERMINISM***  

  8. **Volcano Swap Test (1816):**  
     If the cold snap came from a *nuclear winter* (not a volcano), would the valley’s story change?  
     - **✓ = No** (The cause is irrelevant; only the climate effect matters)  
     - **✗ = Yes** (The volcano’s specific presence shaped cultural meaning)  
     *Branch: ✓ → **CONJUNCTURAL/VULNERABILITY VIEW**; ✗ → **ACTOR-NETWORK SYMMETRY***  

  ---

  ### **Scoring Key & Named Positions**  
  *Match your answer pattern to a leaf. Each includes: core stance, embarrassing novelist commitment, and your novellas’ implication.*  

  | **Leaf Position**              | **Answer Pattern** | **Embarrassing Commitment**                                                                 | **In Your Valley**                                                                 |
  |-------------------------------|--------------------|-------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **Strong Environmental Determinism** | Q1✗, Q2✓, Q7✗ OR Q1✗, Q3✗, Q7✗ | “Your humans are puppets; erase the microbe, and your plot vanishes.”                       | The bacterium *decides*; the volcano *demands*; humans just react.                |
  | **Conjunctural/Vulnerability View** | Q1✓, Q4✓, Q7✓ OR Q1✓, Q8✓      | “Your plague is a replaceable spark; swap it for a tax riot and nothing changes.”           | Disasters bite because humans built a fragile world. The eruption is a trigger.   |
  | **Flat Actor-Network Symmetry**     | Q1✗, Q3✓, Q5✓ OR Q1✗, Q8✗      | “You must give the river as much ‘interiority’ as the bishop, or admit bias.”               | The blight and landlord are equal actors. A flood *negotiates* with a field.      |
  | **Humanist View**             | Q1✓, Q3✗, Q6✓                  | “Your volcano is a painted backdrop; the cholera is just a metaphor for greed.”             | Non-humans are conditions, not agents. Frost doesn’t *choose*—it just *is*.       |

  ---

  ### **Design Notes for Your Group**  
  - **Logical Space Covered:**  
    - Concepts embedded: **Swap test** (Q1, Q8), **Answerability** (Q4), **Ventriloquy** (Q3, Q6), **Lag problem** (Q5), **Reader’s counterfactual** (Q7).  
    - Cases used: Arriving ship (Q1), failed harvest (Q3, Q7), potato blight (Q2), cholera (Q4), flood plain (Q5).  
  - **What the Tree Can’t Separate:**  
    - **Conjunctural vs. Humanist views** overlap if you answer Q1✓, Q3✗, Q4✓. The tree flags this (see Q6 branch). Difference: Conjunctural sees non-humans as *necessary triggers*; Humanist sees them as *replaceable conditions*. Use embarrassing commitments to debate.  
    - **Actor-Network vs. Environmental Determinism** split cleanly on Q6/Q8: If you deny ventriloquy requires motives (Q6✗) and insist on cause-specificity (Q8✗), you’re Actor-Network.  
  - **Empty/Incoherent Combinations:**  
    - **Q3✓ + Q6✓** (Agency without interiority): Incoherent. If frost “chooses,” you can’t dodge giving it motives.  
    - **Q5✓ + Q4✓** (Slow processes act, but preventable diseases don’t): Unattractive. Why credit millennia-old ash but not cholera?  
  - **Why It Works for Workshops:**  
    - No theory names—just valley cases. Tests intuitions, not bibliography.  
    - ~15 mins to answer, 45 mins to debate leaves, 30 mins to apply to your drafts.  

