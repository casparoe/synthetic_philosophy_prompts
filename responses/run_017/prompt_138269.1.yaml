prompt: |-
  I am trying to work out what I actually believe about the moral position of combatants, and I would rather start from my own verdicts on cases than from the literature, of which I have read only a little of the traditionalist and the revisionist sides. The question I care about has three strands, and I suspect they have come apart in my judgments: permissibility — may soldiers on the just side kill this person, in the conduct of the war; culpability — is the person at fault in being where they are and doing what they are doing; and the equality thesis — do combatants on the two sides have the same standing, the same rights, and the same permissions with respect to one another. Below I give each case with my verdicts on the first two strands, marked as Killable and At fault, and I note where one verdict feels stronger or weaker than a superficially similar one.

  1. The head of government who orders a war of conquest, working in a capital eight hundred kilometres from the front. Killable: yes. At fault: yes, more than anyone else in this list.

  2. A volunteer infantryman in the aggressor's army who enlisted because he believes the conquest is glorious. Killable: yes. At fault: yes — but much less than case 1, and I am noticeably less comfortable about killing him than about killing the official, which I cannot explain by contribution, since he does more of the killing.

  3. A conscript drafted at nineteen under threat of imprisonment for refusal, with no political convictions, who fires when ordered and never seeks out combat. Killable: yes, plainly — he is shooting at you. At fault: no, not at all.

  4. A career sergeant on the aggressor's side who is a scrupulous professional: he verifies targets, refuses unlawful orders, has never killed a civilian, and who refuses to desert because he thinks that without professionals like him the army will dissolve into bands that massacre. Killable: yes. At fault: yes, but less than case 2, the enthusiastic volunteer — even though the sergeant does far more of the effective fighting. I take this to mean my culpability judgments are tracking something like quality of will and not contribution.

  5. An unarmed army cook, forty kilometres behind the lines, who has never fired a weapon, was drafted, and spends his days feeding a battalion. Killable: yes, but this is the first case where I hesitate. At fault: no.

  6. A civilian welder in the aggressor country who voluntarily took a job at double wages welding hulls for that same army's tanks. Killable: no. At fault: yes, I want to say, though not killable. Cases 5 and 6 are the pair I cannot reconcile: the killable person is less voluntary, less informed, and less causally efficacious than the person I say may not be killed.

  7. A software engineer, a citizen of a neutral country, working from her own flat on salary from a subcontractor, writing the image-classification module used in the aggressor's targeting system. She knows roughly what the module is for and does not care. Killable: I go back and forth. My gut says yes; my head says that if 6 is no, this must be no too. At fault: yes, more than the welder, since she knows more. I also notice this: if she is killed, someone else writes the module within a month, so nothing is averted — and then I notice that the same is nearly true of the cook and of the infantryman, which makes me suspect that considerations of necessity are doing no real work in my judgments and that I had better stop appealing to them.

  8. A soldier on the just, defending side who enlisted for the signing bonus, is indifferent to the cause, and would have fought for the aggressor for the same money. Killable by the aggressor's soldiers: no. This is where my grip on the equality thesis is weakest. He does exactly what the other just combatants do, for the worst possible reasons, and yet I want to say the aggressor's soldiers wrong him by killing him while he wrongs no one by killing them. At fault: no — and that bothers me too, because I want to mark something as defective in him.

  9. A soldier on the aggressor's side who, through no fault of his own — total control of the media, no access to outside sources, a childhood in a closed province — reasonably believes his country was attacked first and is fighting defensively. He is a careful and discriminate fighter. Killable: yes. At fault: no. But I think the just side's soldiers owe him something they do not owe the volunteer in case 2: they must accept his surrender where they can, must not kill him where the same military objective is achievable otherwise, and if he is killed after surrendering this is not merely a war crime but a compounding of the injury already done to him by his own government. Call his condition epistemic sequestration. My worry is that this residual duty is unactionable, because on the ground you can never tell the sequestered conscript from the true believer.

  10. An unarmed medic on the aggressor's side, wearing the protected medical emblem, who has saved the lives of many of that army's soldiers and thereby indirectly contributed to the deaths of defenders and of the defenders' civilians. Killable: no — and not because he is harmless, since he plainly is not, but because of a status that seems to be constituted by a convention rather than by anything he has done.

  Here is what I want from you.

  Give me one or two principles, stated precisely enough to be applied by someone who did not read this list, that settle the permissibility and the culpability questions together. For every clause of the principle, name the case above that forces the clause to be there, and say what the principle would look like without it. Then tell me honestly which of my verdicts the principle cannot accommodate, and which pair of verdicts no reasonably simple principle can hold together: my suspicions are the 5 and 6 pair, the 2 and 4 pair, and case 8.

  Tell me which kind of consideration is actually doing the work in my judgments — threat or liability, culpability or quality of will, membership in an organized armed group, or convention-constituted status — whether the others are epiphenomenal, and, if the honest answer is a hybrid, what the priority rule is when two of them conflict, and whether that priority rule is itself principled or merely a way of restating the cases.

  Then run the principle on cases I have not decided, and report its verdicts rather than telling me which verdict I should like: a drone operator on the just side who kills an unjust combatant, asleep in barracks, by remote strike launched from another continent; a fifteen-year-old abducted and forcibly recruited by the aggressor's army who is at this moment pointing a rifle at you; a civilian in the aggressor country who voted for the government that started the war, in a fair election, mostly for economic reasons, and who now pays taxes; the directors of the shell company that hired the engineer in case 7, if they knew nothing of the war; and a soldier on the just side who has fought well throughout but who once, in revenge for a dead comrade, executes a prisoner — does that make him killable, and killable by whom.

  Two further things. First, I want to know what becomes of the moral equality of combatants on your account: state the equality thesis in the form your principle yields, or say what replaces it and what exactly is lost. Second, say whether the residual duty I described in case 9 can be made coherent: is there a defensible notion of asymmetric obligation owed by the just side to the non-culpable combatant on the unjust side, what would ground it, and does it collapse once we concede that the distinction between the sequestered and the convinced is not observable in the field? If it does collapse, tell me whether the fault is in the duty, in the case, or in my assumption that the two kinds of combatant must be treated alike in practice.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the moral positions of combatants, focusing on permissibility (killable), culpability (at fault), and the equality thesis. They've provided ten cases with their intuitive verdicts and want principles that explain these judgments. The user suspects inconsistencies, especially in cases 5 and 6, 2 and 4, and case 8.

  First, I need to identify patterns in their verdicts. The user clearly differentiates based on role and intent. For example, the head of government (case 1) is highly culpable and killable, while the conscript (case 3) is killable but not at fault. The cook (case 5) is killable but not at fault, whereas the welder (case 6) is at fault but not killable. This discrepancy between cases 5 and 6 is a key tension—why is the less effective, less voluntary cook killable while the welder isn't?

  Looking at culpability, the user emphasizes quality of will over contribution. Case 2 (enthusiastic volunteer) is more at fault than case 4 (professional sergeant), even though the sergeant contributes more. This suggests culpability is tied to intent and awareness rather than actual harm caused. 

  Case 7 (software engineer) is tricky. The user wavers on permissibility, noting that if the welder isn't killable, the engineer shouldn't be either. But they feel the engineer is more at fault due to knowledge. The user also dismisses necessity as a factor since replacing killed personnel doesn't change outcomes. 

  Case 8 challenges the equality thesis. The defender fighting for money is not killable by aggressors, yet he's similar to unjust combatants. The user feels he's not at fault but wants to mark his moral defect. This indicates that the just side's cause affects permissibility, not just individual actions.

  Case 9 introduces epistemic sequestration—unjust combatants who believe they're just. The user thinks they're killable but not at fault, and the just side owes them extra duties. However, the user worries about distinguishing them in practice. 

  Case 10 (medic) is not killable due to protected status, despite contributing to harm. This highlights the role of conventions in assigning non-combatant status.

  To form principles, I need to reconcile these intuitions. The user's judgments seem to rely on membership in armed groups for permissibility and quality of will for culpability. The combatant/non-combatant distinction matters, but case 5 (cook) complicates this. Perhaps functional integration into the military is key—the cook is part of the group, while the welder is a civilian contractor. 

  For culpability, voluntary affiliation and knowledge are crucial. The engineer (case 7) has high culpability due to awareness but isn't killable because she's a civilian. This separates permissibility from culpability. 

  Case 8 suggests that the just cause legitimizes combatants on that side, making aggressors liable when attacking them, regardless of individual motives. The equality thesis is rejected; combatants are not moral equals.

  The medic (case 10) shows that conventions can override liability. Even though he contributes to harm, his protected status makes him not killable. 

  The tension in cases 5 and 6 arises because membership (cook in military) vs. civilian status (welder) drives permissibility, while culpability depends on voluntary contribution and knowledge. So the cook is killable due to role, not culpability, whereas the welder is culpable but not killable due to civilian status.

  For case 9, the residual duty exists but is impractical. The duty is based on moral liability, but combatants can't distinguish between sequestered and true believers, leading to tragic choices. The duty doesn't collapse; it's just hard to implement.

  Applying principles to new cases: the drone operator killing a sleeping combatant—permissible because target is a combatant, but morally problematic if unnecessary. The child soldier—killable if posing a threat, but high culpability mitigation due to coercion. The voter—not killable (civilian), culpability low unless aware of war crimes. The shell company directors—not killable, culpability none if unaware. The vengeful soldier—killable? Possibly if he becomes a threat, but not automatically. Permissibility depends on current role, not past actions.

  The equality thesis is asymmetric: just combatants can kill unjust ones, but not vice versa. Unjust combatants lack the right to kill, while just ones have a right grounded in collective defense. 

  Overall, the user's intuitions prioritize group membership for permissibility and intent for culpability. The principles need to capture these elements while acknowledging where practical constraints limit moral ideals, like in case 9. The hybrid approach makes sense, with role-based liability primary for permissibility, and quality of will for culpability, with conventions modifying both in specific cases like medics.
answer: |-
  Based on your case judgments, your core intuitions prioritize **functional membership in the aggressor's organized armed group** for *permissibility* (killable), and **voluntary contribution with awareness** for *culpability* (at fault). The equality thesis is rejected: combatants on the just side have a moral right to kill unjust combatants that is not reciprocated. Here are the principles that capture your verdicts:

  ---

  ### **Principles**
  **P1. Permissibility (Killable):**  
  *Direct participants in the unjust armed group's war-fighting function may be killed, regardless of personal culpability, if they are integrated into its operational structure at the time of targeting.*  
  - **"Direct participants"**: Excludes civilians like the welder (Case 6) or engineer (Case 7).  
  - **"War-fighting function"**: Includes cooks (Case 5) but excludes medics (Case 10) due to protected status.  
  - **"Integrated into operational structure"**: Excludes remote contractors (Case 7) but includes rear-area cooks (Case 5).  
  - **"At the time of targeting"**: Captures the conscript actively firing (Case 3) but excludes surrendering soldiers.  

  **Without integration clause**: Case 5 (cook) becomes not killable, contradicting your verdict.  
  **Without war-fighting function clause**: Case 10 (medic) becomes killable, contradicting your verdict.  

  **P2. Culpability (At Fault):**  
  *A person is culpable to the extent they voluntarily contribute to the unjust war effort with reasonable awareness of its injustice, irrespective of direct causal impact.*  
  - **"Voluntarily contribute"**: Excludes conscripts (Cases 3, 5) and includes welders (Case 6).  
  - **"Awareness of injustice"**: Explains lower culpability for the sequestered soldier (Case 9) vs. volunteer (Case 2).  
  - **"Irrespective of causal impact"**: Explains why the welder (Case 6) is culpable but the cook (Case 5) is not.  

  **Without voluntariness clause**: Case 3 (conscript) becomes culpable, contradicting your verdict.  
  **Without awareness clause**: Case 9 (sequestered soldier) becomes culpable, contradicting your verdict.  

  ---

  ### **What Drives Your Judgments**
  - **Permissibility hinges on combatant status**, defined by functional membership in the armed group (not threat alone). The cook (Case 5) is killable because he sustains the battalion; the welder (Case 6) is not because he remains a civilian.  
  - **Culpability hinges on quality of will**: voluntary choice + awareness. This explains why the enthusiastic volunteer (Case 2) is more culpable than the professional sergeant (Case 4), despite lesser contribution.  
  - **Conventions modify status**: The medic (Case 10) is protected by Geneva Convention norms, overriding liability.  
  - **Contribution/necessity are epiphenomenal**: You explicitly reject these in Case 7 (engineer).  

  **Priority Rule**:  
  1. Functional membership settles permissibility.  
  2. If permissibility is settled, culpability is determined by quality of will.  
  **Conflict Resolution**: When conventions (e.g., medic status) conflict with functional membership, conventions override. This is principled: it reflects your view that certain roles acquire moral weight through international agreement.  

  ---

  ### **Accommodating Your Verdicts**
  - **Case 5 & 6 (Cook vs. Welder)**: Your principles *can* hold these together. The cook is killable due to membership; the welder is culpable due to voluntary contribution. The tension arises because membership and contribution come apart, but your principles reflect this disjunction.  
  - **Case 2 & 4 (Volunteer vs. Sergeant)**: P2 explains this: culpability tracks *why* they fight (enthusiasm vs. professionalism), not effectiveness.  
  - **Case 8 (Mercenary defender)**: P1 accommodates this: he is a member of the *just* armed group, so not killable by unjust combatants. P2 explains his lack of culpability (he contributes to a just cause, regardless of motives).  

  **Unaccommodated Verdict**:  
  - **Case 8's "defect"**: Your principle marks no fault for the mercenary defender (P2). To capture his moral defect, add: *"Culpability may be mitigated but not erased if contribution to a just cause is accidental."* This labels him "non-culpable but morally defective."  

  ---

  ### **Application to New Cases**
  | Case | Killable? | At Fault? |  
  |------|-----------|-----------|  
  | **Drone operator (just side)** kills sleeping unjust combatant | Yes (P1: functional membership) | No (if acting under orders; P2: contributes to just cause) |  
  | **15-year-old abductee** pointing rifle at you | Yes (P1: integrated armed actor) | No (P2: not voluntary) |  
  | **Civilian voter/taxpayer** in aggressor state | No (P1: not integrated) | Yes, minimally (P2: voluntary contribution via political support) |  
  | **Shell company directors** (ignorant) | No (P1: not integrated) | No (P2: no awareness) |  
  | **Just soldier executes prisoner** | Not automatically killable (still a just combatant). If he poses *ongoing* threat, may be killed in self-defense. | Yes (P2: voluntary war crime with awareness) |  

  ---

  ### **Moral Equality of Combatants**
  - **Your principle rejects equality**: Unjust combatants lack the moral right to kill just combatants (Case 8). Only just combatants have a *liberty right* to kill, grounded in collective self-defense.  
  - **Asymmetric obligation**: In Case 9, the just side owes sequestered unjust combatants a **duty of restorative caution**—minimizing harm because they are victims of epistemic injustice. This duty is grounded in the combatant's reduced culpability, not observability.  
  - **Does it collapse?** No. The duty is *agent-relative*: it binds the just side regardless of whether they can identify sequestered individuals. In practice, they may fail to fulfill it (e.g., killing a surrendering sequestered soldier), but this is a tragic error, not a flaw in the duty. The fault lies in war's fog, not your assumption.  

  ---

  ### **Conclusion**
  Your judgments center on **role-based liability** (permissibility) and **volitional blame** (culpability). The cook/welder tension is resolved by separating these questions. The equality thesis is untenable on your view: unjust combatants are moral agents engaged in wrongdoing; just combatants are instruments of redress. The residual duty to epistemically sequestered combatants is coherent but tragically difficult to honor—a reflection of war's inherent moral tragedy, not a logical flaw.
