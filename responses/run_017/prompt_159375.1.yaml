  The core issue seems to be with step (2). It conflates epistemic limitations (what we can know) with ontological claims (what exists). Reality can contain precise boundaries even if we can't locate them. The drift view could accept that exact thresholds exist relative to comparison classes, while acknowledging we can't perfectly isolate which comparison class applies in borderline cases.

  If we reject (2):
