  The audience consists of three groups: mechanistic interpretability researchers (who dislike "representation" talk), systems neuroscientists (who want decoders and lesions), and a senior philosopher of mind (who sees representation as a stance rather than a discovery). I need to help draft a Q&A prep sheet that anticipates objections, orders them by potential damage, provides two-minute replies, and notes weaknesses in those replies.

  The user specifically requests including several elements: what to concede upfront, the critical reply that must land to save their view, and the dreaded question they hope isn't asked. They suspect the most dangerous objection will be a dilemma: either their conditions are too loose (leading to the whole network representing the training distribution) or secretly interest-relative (reinventing instrumentalism).

  For the Q&A prep sheet outline, I'll start with the upfront concession: acknowledging that their view doesn't provide causal-explanatory primacy to representations like neuroscience does. Then I'll prioritize objections by damage level: 

