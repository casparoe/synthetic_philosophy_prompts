prompt: |-
  Please act as a philosopher of rational choice who works specifically on decision-making under risk and uncertainty — someone equally fluent in expected utility theory as a normative benchmark and in the family of views that try to amend it (risk-weighted expected utility, ambiguity-sensitive views, lexical and threshold views, and the standard reductions of apparent risk-aversion to curvature in the utility function). Take your time and think carefully before answering: I would rather have a careful reconstruction that leaves the complications in place than a clean verdict that smooths them away. Before you answer, sketch briefly the several different things that could in principle be doing the work in the practice I am about to describe — nonlinearity in the probabilities, nonlinearity in the value of the outcomes, attitudes to model uncertainty, side constraints, option value — and then tell me which of them the practice actually requires.

  I sit on the grants committee of a mid-sized philanthropic foundation, and I have become bothered by an asymmetry in how we handle small probabilities. On the upside we are aggressively expected-value: we deliberately fund long-shot, high-upside work — a neglected vaccine, a policy campaign with perhaps a 3 percent chance of landing, an early-stage research programme — and we openly rebuke colleagues who get cold feet about low probabilities, on the grounds that a 1 percent chance of a thousandfold payoff is worth ten times a guaranteed tenfold one. On the downside we refuse to reason that way at all. Any proposal carrying a non-trivial chance of what our risk register calls an unacceptable outcome — catastrophic loss of life, a laboratory release with pandemic potential, an irreversible ecological collapse — is vetoed outright; the expected value of the upside is not permitted into the discussion, and, strikingly, the stated probability of the catastrophe seems to make very little difference to the conversation, so that a one-in-a-thousand chance and a one-in-twenty chance of the same catastrophe get treated almost alike. A second feature of the pattern: we are happy to multiply when the numbers come from a well-measured base rate, such as vaccine efficacy or the historical frequency of a given kind of regulatory win, but our confidence collapses when the numbers come out of a model whose own parameters are themselves estimates — and this happens even when the model's uncertainty is roughly symmetric and we have no particular reason to think it is biased up rather than down. A third: the veto applies to harms we might bring about, but we do not treat declining to fund a catastrophe-prevention project as anywhere near as serious, even though on our own accounting the unspent money and the risky project have the same expected cost in lives; when I raised this, one trustee said that is just the act/omission distinction and has nothing to do with probability, and another said our downside is bounded by the endowment so the two cases really are not symmetric. I do not know what to make of either reply.

  What I want from you is the implicit theory of rational choice under risk that this pattern presupposes. I have seen the label risk-weighted expected utility used for views that keep the broad shape of expected utility but let a risk function transform the probabilities, so that very small chances of disaster are not diluted in proportion to their probability — but I am not sure that is what we are doing, and there are other candidates in the neighbourhood: plain expected utility combined with the thought that extinction or collapse is not merely a very large number of deaths, a lexical or threshold constraint on losses, genuine ambiguity aversion in the model-uncertainty cases, or something about irreversibility and the value of keeping options open. Do not just survey these views; I can read about them on my own. Instead: reconstruct the theory our practice commits us to; separate what the practice strictly presupposes from what it merely sits comfortably with; tell me where the deviation from expected utility is located in our pattern — in how we weight probabilities, in how we value outcomes, or somewhere else entirely; say which parts of the pattern are consistent with several theories at once and therefore do not discriminate between them; and say what would concretely have to change in how we make grants if we adopted, first, straightforward expected utility with no weighting, and then, explicitly, a risk-weighted view. If some part of the pattern is simply incoherent — including the upside/downside asymmetry or the act/omission asymmetry — say so and say which part of the practice would have to give.
reasoning: |-
  Okay, the user is a philosopher of rational choice on a grants committee, troubled by asymmetries in how they handle probabilities. Let me unpack their scenario. They're comfortable with high-risk, high-reward projects on the upside—like funding a 3% chance project because the expected value makes sense. But on the downside, any non-trivial chance of catastrophe gets vetoed, regardless of probability. Also, they rely on base rates for probabilities but distrust model-based estimates, even if symmetrically uncertain. And there's an act/omission distinction: causing harm vs. not preventing it is treated differently.

  First, I need to identify the components at play. Nonlinear probabilities? Like rank-dependent models where low-probability disasters are overweighted. Or is it outcome nonlinearity? Maybe catastrophes have infinite disutility. Ambiguity aversion could explain the distrust of model-based probabilities. Side constraints might be absolute prohibitions. Option value could relate to irreversibility. 

  The upside/downside asymmetry is key. They're risk-seeking for gains but risk-averse for losses. But standard Prospect Theory usually has risk-aversion for gains. Hmm. Maybe it's only for losses here. The veto on any non-trivial catastrophe chance, ignoring probability magnitude, suggests a threshold model. Like a lexical constraint where any catastrophe probability above zero is unacceptable. 

  The model uncertainty part points to ambiguity aversion. They trust base rates but not models with parameter uncertainty. Even if symmetric, they treat it as ambiguous, leading to more caution. 

  Act/omission distinction: causing harm is worse than allowing harm. That's a deontological constraint, not probability-based. The trustee's endowment argument might be a form of outcome bracketing—only considering the endowment's impact, ignoring broader effects. 

  Now, what does the practice strictly require? The catastrophe veto regardless of probability needs a lexical constraint. Probability weighting alone (like RDU) would still weigh different probabilities differently, but they treat 0.1% and 5% the same. So it has to be a threshold. Ambiguity aversion explains the model distrust. Act/omission is a separate moral constraint. 

  Consistent with multiple theories: the upside EV focus fits classic EU or even RDU if they underweight small gains (but they don't). The model uncertainty aligns with ambiguity models. But the veto's probability insensitivity is uniquely threshold-based. 

  Incoherencies: The act/omission asymmetry contradicts consequentialism. If expected lives lost are the same, not funding prevention should be as bad, but they treat it differently. Also, ignoring catastrophic upside EV while embracing it for gains is inconsistent unless the threshold is absolute. 

  If they switched to pure EU, they'd have to quantify catastrophe disutility and weigh it against benefits. Low-probability disasters might be acceptable if benefits are high enough. Model uncertainty would need incorporating via expected values over parameter distributions. Act/omission distinction would collapse; not preventing harm would be evaluated similarly. 

  Adopting risk-weighted EU (RDU): They'd still need to use probability weighting. But RDU alone might not explain the probability insensitivity—unless they use a function that severely overweights small probabilities to near-certainty. But even then, 0.1% vs 5% would differ. So they'd need to adjust the weighting function to treat all non-zero probabilities as nearly identical. 

  The core deviation from EU is in the catastrophic loss handling—lexical constraints override expected utility calculations. Ambiguity aversion explains model distrust. The practice isn't entirely incoherent if they accept thresholds and moral side constraints. But within consequentialism, the act/omission part is inconsistent. To resolve, they'd need to drop the absolute veto or align omission evaluations with actions, but that clashes with their current moral intuitions.
answer: |-
  Your foundation's decision pattern reveals a sophisticated but internally strained hybrid theory of rational choice, blending elements from several frameworks while exhibiting critical tensions. Below is a structural diagnosis, separating necessary commitments from compatible elements, pinpointing deviations from expected utility (EU), and specifying implications for reform.

  ---

  ### **Core Components of Your Implicit Theory**
  1. **Lexical Safety Threshold for Catastrophic Losses**  
     - **What it explains**:  
       - Vetoing *any* non-trivial probability of "unacceptable outcomes" (ecological collapse, pandemic) regardless of magnitude.  
       - Insensitivity to probability differences (0.05% vs. 5% treated similarly).  
       - Exclusion of upside expected value (EV) from downside discussions.  
     - **Strict Presupposition**: A discontinuous, non-negotiable constraint where catastrophic losses cannot be traded off against benefits. This is *not* merely nonlinear probability weighting (e.g., risk-weighted EU) or outcome curvature.  
     - **Incompatible with**: Pure EU, risk-weighted EU (RDU), or prospect theory (PT). These all permit trade-offs.  

  2. **Ambiguity Aversion in Model-Dependent Probabilities**  
     - **What it explains**:  
       - Accepting probabilities from historical base rates but rejecting model-derived estimates with symmetric uncertainty.  
       - "Collapsing confidence" when parameters are estimated.  
     - **Strict Presupposition**: Knightian uncertainty aversion (e.g., Gilboa-Schmeidler max-min EU or α-max-min). You treat model-based probabilities as ambiguous "second-order risks," not merely "risky."  
     - **Consistent with but not exclusive to**: Generalizations of RDU (e.g., smooth ambiguity aversion).  

  3. **Consequentialist Asymmetry (Act vs. Omission)**  
     - **What it explains**:  
       - Willingness to decline catastrophe-prevention projects (omission) but not fund projects causing direct catastrophe risk (action).  
       - Dismissal of symmetry in expected lives saved/lost.  
     - **Strict Presupposition**: A deontological side constraint prohibiting *causing* harm, distinct from *allowing* harm. The trustee’s "act/omission distinction" is correct but incomplete.  
     - **Endowment Argument**: Reveals "mental accounting" (e.g., narrow framing): losses are bounded by the endowment size, while gains are unbounded.  

  4. **Risk-Seeking for High-Impact Gains**  
     - **What it explains**:  
       - Funding long shots with high EV (e.g., 3% chance of 1000× payoff).  
       - Rebuking "cold feet" about low probabilities.  
     - **Compatible with**: EU (if utility is linear in impact) or RDU (if small probabilities of gains are *underweighted*).  

  ---

  ### **Where the Deviation from EU Occurs**
  | **Element**          | **Deviation Location**              | **Key Mechanism**                                  |
  |----------------------|-------------------------------------|----------------------------------------------------|
  | Catastrophe veto     | **Constraint space** (outside EU)  | Lexical threshold overriding EV calculus          |
  | Model uncertainty    | **Ambiguity aversion**             | Rejection of probabilistic reductionism            |
  | Act/omission        | **Deontology/consequences split** | Causal responsibility > outcome equivalence       |
  | Gain-seeking         | **Probability weighting or linear utility** | Low probabilities not underweighted for gains |

  ---

  ### **What the Practice *Does Not* Require (But Is Compatible With)**
  - **Nonlinear outcome utility**: Your EV focus on gains suggests near-linear utility for positive impacts.  
  - **Risk-weighted EU (RDU)**: RDU could explain gain-seeking but *not* catastrophe insensitivity (RDU weights extreme losses highly but still scales with probability).  
  - **Irreversibility/option value**: Not evidenced; decisions are binary (fund/reject) with no delay or learning.  

  ---

  ### **Incoherencies and Tensions**
  1. **Asymmetric EV Application**:  
     - **Upside**: "1% chance of 1000× payoff = 10× guaranteed 10×" → strict EV logic.  
     - **Downside**: EV excluded → contradiction.  
     - **Resolution Required**: Abandon lexical thresholds OR apply EV consistently.  

  2. **Act/Omission Asymmetry**:  
     - **Trustee 1** (act/omission): Defends asymmetry but ignores that your *own framework* uses EV for gains (e.g., omitting prevention *is* an action with EV costs).  
     - **Trustee 2** (endowment): Confuses budget constraints with moral calculus. If unspent funds save fewer expected lives than a risky prevention project, omission is *objectively worse* by your gain-seeking logic.  
     - **Incoherence**: Granting moral weight to causing harm but not to omitting prevention *while using EV elsewhere* violates rational consistency.  

  ---

  ### **Concrete Changes Under Alternative Theories**
  #### **Scenario 1: Adopting Pure Expected Utility**
  - **Catastrophe Veto**: Replaced by EV trade-offs. A 0.1% chance of 1B deaths = 1M expected deaths. If a grant offers >1M expected lives saved, it must be considered.  
  - **Model Uncertainty**: Parameter uncertainty integrated via expected probabilities (e.g., Monte Carlo simulations). A "5% chance ±3%" becomes a distribution to average over.  
  - **Act/Omission Distinction**: Collapsed. Not funding prevention = causing expected deaths; evaluated identically to direct risks.  
  - **Gain-Seeking**: Unchanged if utility is linear.  

  #### **Scenario 2: Adopting Explicit Risk-Weighted EU (e.g., RDU)**  
  - **Catastrophe Handling**: Small disaster probabilities *overweighted* (e.g., 1% treated as 10%). Vetoes occur only when *weighted* EV is negative. Probabilities matter: 0.1% vs. 5% have distinct weights.  
  - **Gain-Seeking**: Low-probability gains *underweighted* (e.g., 1% chance of 1000× payoff weighted as 0.5%), making long shots *less* attractive.  
  - **Model Uncertainty**: Ambiguity aversion remains unless explicitly modeled (e.g., using second-order probabilities).  
  - **Act/Omission**: Unresolved; RDU is consequentialist.  

  ---

  ### **Reconstructing Your Implicit Theory**
  Your foundation operates under a **Lexical Threshold Hybrid**:  
  - A **safety-first rule** (à la Satisficing or Lexicographic EU) for catastrophic losses, overriding EV.  
  - **Ambiguity-averse** for model-based risks.  
  - **Consequentialist EV-maximizing** for gains.  
  - **Deontological constraints** on causal responsibility.  

  **What Must Give for Coherence**:  
  1. The **absolute catastrophe veto** must relax to permit EV trade-offs if gains are sufficiently large (e.g., funding a pandemic trial with 0.1% release risk but 99.9% chance of saving 50M lives).  
  2. The **act/omission asymmetry** must align with your EV logic: Omitting prevention should be evaluated as harshly as causing direct harm when expected losses are identical.  
  3. **Model uncertainty** should be quantified probabilistically (e.g., via Bayesian averaging) rather than rejected outright.  

  This framework is normatively defensible only if you accept that catastrophic losses are *incommensurable* with gains (e.g., a lexical utility function where U(catastrophe) = -∞). Otherwise, the asymmetries collapse into inconsistency. The practice is not irrational per se but requires explicit meta-commitments: a lexicographic ordering where "avoid catastrophe" lexically dominates "maximize expected gains," coupled with a causal responsibility ethic. Without these, the pattern is an unstable hybrid of incommensurable values.
