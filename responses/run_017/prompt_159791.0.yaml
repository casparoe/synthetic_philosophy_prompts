prompt: |-
  A popular introduction to aesthetics I've been reading — a trade book, not an academic one — summarizes Hume's essay *Of the Standard of Taste* roughly as follows:

  "Hume's starting point is that beauty is not a property of objects at all: it exists only in the sentiment of the person doing the contemplating, so there is no fact of the matter about whether a given work is beautiful. To keep this from collapsing into anything goes, he added a standard of taste: the verdict of the true judges, that is, trained critics and connoisseurs, whose advantage over the rest of us is a delicacy of taste largely inborn, together with long exposure to a great many works. Where such experts agree, their agreement just is the object's beauty; where they disagree, neither verdict is correct and the dispute is idle. But the account is circular: we can only identify the true judges by assuming they judge correctly, so the standard has no footing independent of itself, and Hume's attempt to reconcile taste with objectivity fails. What survives is the negative point, that aesthetic judgments report our own responses rather than features of the world — which is why philosophy after Hume treats beauty as subjective."

  I have twice heard people insist that Hume was not a flat relativist, so the opening move sounds off to me, but I can't tell where the summary stops being a fair simplification. Would you go through it claim by claim and say what Hume actually holds, what a defender would accept as compression, and what a Humean would reject as misreading — in particular whether the true judges are simply professional experts, whether delicacy is innate, whether disagreement among them really leaves "no verdict correct," and whether the circularity charge refutes the account or is a standing objection with a Humean reply? I also want to know whether the book's conclusion, that beauty turns out to be subjective, survives once the errors are corrected.

  One test of whichever reading survives: suppose archaeologists recover a large corpus of artifacts from a culture with no historical continuity with ours. A body of scholars spends decades immersed in that corpus alone, develops exactly the discrimination Hume describes — fine detection of small differences, repeated practice, wide comparison, no local prejudice — and converges firmly on verdicts, while having very little experience of our tradition; and their verdicts on the objects we call masterpieces diverge sharply from ours. On the corrected reading, does their convergence constitute a genuine standard of taste for that corpus, and does it carry any authority over us? Does the demand that a judge have compared many works smuggle in a parochialism, or does Hume have the resources — good sense, freedom from prejudice, the uniformity of the principles of taste in human nature — to say which convergence is the real one? I'm asking because I want to know whether the standard does independent work or merely ratifies the people we already call experts.
reasoning: |-
  Okay, the user is grappling with a summary of Hume's aesthetics from a popular book, and they're concerned about potential misreadings. They've provided a detailed critique and a hypothetical scenario to test interpretations. Let me unpack this step by step.

  First, the book's summary claims Hume says beauty isn't in objects but only in sentiment, making aesthetic judgment entirely subjective. But I recall Hume actually argues for a middle ground - beauty requires both human response and object properties. The "no fact of the matter" phrasing oversimplifies his position. 

  The circularity charge is interesting - the book claims Hume's standard of taste is circular because we identify experts by their correct judgments. But Hume does provide independent criteria: delicacy, practice, comparison, lack of prejudice, and good sense. These aren't arbitrary. The hypothetical about archaeologists from a disconnected culture really tests this. If their trained experts converge on different verdicts, does Hume's framework allow for multiple valid standards? 

  Hume's appeal to universal human nature suggests he'd look for deeper principles. If the archaeologists' divergences stem from different cultural associations (prejudice) or undeveloped faculties, their standard might be flawed. But if they meet all criteria and their judgments stem from universal taste principles applied to different contexts, Hume might accept plural standards - which is more nuanced than the book's "anything goes" reading.

  The user seems to want to resolve whether Hume's standard has objective grounding. Their archaeology scenario probes whether "comparison of many works" implicitly privileges Western canons. But Hume's requirement is about breadth within a tradition, not across traditions. His universality claim rests on shared human psychology - if two traditions develop irreconcilable standards, Hume might need to concede relativity or argue one group lacks true delicacy. This tension remains debated among scholars.

  Ultimately the book is half-right: beauty is response-dependent (subjective in that sense) but Hume insists on standards anchored in universal human faculties. The user's deeper concern appears to be whether cross-cultural aesthetic disputes can be rationally resolved - a question Hume frames but doesn't definitively answer.
answer: |-
  Let's dissect this summary against Hume's actual arguments in *Of the Standard of Taste* (1757), addressing your specific concerns point-by-point:

  **1. "Beauty is not a property of objects at all: it exists only in the sentiment... no fact of the matter..."**
      *   **Hume Actually Holds:** This is a **misleading oversimplification.** Hume *does* ground beauty in sentiment ("Beauty is no quality in things themselves: It exists merely in the mind which contemplates them"). However, he emphatically rejects radical subjectivism ("anything goes"). He argues that while beauty *depends* on human response, it arises from the *interaction* between stable features of objects and universal principles of human nature. Sentiment is the *mechanism* of perception, not proof that beauty is arbitrary. The sentiment is triggered by properties *in* the object suited to elicit a response from properly functioning human faculties.
      *   **Defender's Compression:** "Beauty requires a perceiver's sentiment; it's not *solely* an intrinsic property like shape or mass."
      *   **Humean Rejection:** The summary implies beauty is *merely* in the mind with no basis in the object or objective standards. Hume explicitly argues *against* this extreme view. The "no fact of the matter" claim ignores his central project: establishing a standard *based* on the uniformity of human nature and response under ideal conditions.

  **2. "The standard of taste: the verdict of the true judges... delicacy of taste largely inborn..."**
      *   **Hume Actually Holds:** Correct about the "true judges" being the standard. Hume gives a detailed description of their qualifications: 
          *   **"Delicacy"**: Primarily **not innate**. Hume states it requires "practice in a particular art" and "frequent survey or contemplation of a particular species of beauty." While he mentions "some species of beauty" being "natural" in the sense of universally accessible, the *delicacy* required for expert judgment is developed through exposure and comparison. He explicitly says delicacy "is improved by practice" and "perfected by comparison."
          *   **Other Qualifications**: "Good sense" (to overcome prejudice), "practice" (experience), "comparison" (broad exposure to different works/art forms), and "freedom from prejudice" (avoiding historical, cultural, or personal biases that distort judgment). "True judges" are defined by these *qualities*, not simply by profession. A professional critic lacking these qualities (e.g., bound by prejudice) is not a true judge.
      *   **Defender's Compression:** "Experts who meet specific, demanding criteria of discernment and impartiality set the standard."
      *   **Humean Rejection:** Characterizing delicacy as "largely inborn" is incorrect. Hume emphasizes cultivation. Calling them simply "professional experts" misses the rigorous, non-professional *qualities* required (freedom from prejudice, good sense). The standard is the *verdict of qualified judges*, not just *any* expert.

  **3. "Where such experts agree... where they disagree, neither verdict is correct..."**
      *   **Hume Actually Holds:** This is **mostly correct, but nuanced.** Hume states: "The joint verdict of such [true judges], wherever they are to be found, is the true standard of taste and beauty." He acknowledges disagreements can arise even among the qualified, primarily due to:
          *   **Differing Humours:** Temporary moods affecting perception.
          *   **Different Manners/Ages:** Legitimate differences in preference arising from cultural context or historical period (though he thinks these are less significant for truly great works).
          *   **Imperfect Development:** Even true judges might not be *perfectly* developed in all faculties for all art forms.
      *   Where disagreement persists among *bona fide* true judges applying the rules, Hume *does* essentially say there is no single definitive verdict *for that specific case* ("In such a case a certain degree of diversity in judgment is unavoidable"). He doesn't say "neither is correct," implying both could be *valid* expressions of taste grounded in human nature, reflecting different (but legitimate) aspects or perspectives on the work. However, he clearly believes convergence *is* the ideal and the strongest evidence for objective beauty.
      *   **Defender's Compression:** "Convergence among true judges defines the standard; persistent disagreement indicates the absence of a single definitive verdict for that particular case."
      *   **Humean Rejection:** "Neither verdict is correct" is too strong. Hume might say both verdicts could reflect *aspects* of the work's potential to please the qualified mind, even if no single verdict commands universal assent. He avoids declaring either "incorrect" in such cases.

  **4. "The account is circular... standard has no footing... Hume's attempt fails."**
      *   **Hume Actually Holds:** Hume **explicitly addresses this objection.** He argues we identify true judges *independently* by observing whether they possess the *qualities* he outlines (delicacy, practice, comparison, good sense, lack of prejudice). We don't *first* assume their judgments are correct. We look for people who demonstrate those traits *through* their reasoning, discernment, and breadth of experience. Their subsequent convergence on judgments *confirms* both their status and the standard. It's an empirical, not purely definitional, circle. The "footing" is the *uniformity of human nature* and the *reality of the faculties* required for perception. His reply is that the qualities defining a true judge are observable *prior* to knowing their specific verdicts on disputed works.
      *   **Defender's Compression:** "Hume acknowledges the *apparent* circularity but argues it's broken by defining the 'true judge' through observable qualities of discernment and impartiality, grounded in universal human faculties, not prior agreement on verdicts."
      *   **Humean Rejection:** The claim that the circularity charge refutes the account ignores Hume's direct response to it. He *has* a reply, grounded in his empirical description of the judge's qualities and the uniformity of human nature. Whether this reply is *ultimately successful* is debated, but it's inaccurate to say Hume ignores it or that the charge simply "refutes" his attempt.

  **5. "What survives... beauty as subjective."**
      *   **Hume Actually Holds:** Hume **affirms a qualified subjectivity.** Beauty *is* dependent on human sentiment. However, he **forcefully argues for objectivity *within* that framework.** The sentiment is *not* arbitrary; it's a response triggered *reliably* by certain features in objects when perceived by minds possessing properly functioning, cultivated faculties (the "true judges"). The standard exists *because* human nature is sufficiently uniform. Beauty is "subjective" in the sense of being mind-dependent, but it is "objective" in the sense of being inter-subjectively valid, rule-governed, and discoverable through reason and experience. What survives is not *just* the negative point, but the *positive* project of grounding taste in universal principles of human nature and discernment.
      *   **Defender's Compression:** "Hume establishes that beauty is response-dependent (subjective in that sense), but argues powerfully for robust inter-subjective standards based on universal human faculties and discernible principles."
      *   **Humean Rejection:** Reducing Hume to the "negative point" ignores the entire constructive argument of the essay, which is about rescuing taste from *mere* subjectivism and establishing a standard. He *succeeds* in establishing that taste isn't *arbitrary*, even if it is grounded in sentiment.

  **Your Archaeology Test Case: Applying the Corrected Reading**

  1.  **Their Convergence as a Standard:** Yes, **absolutely.** On Hume's model, this body of scholars has developed the required qualities through decades of immersion: fine detection (delicacy), repeated practice, wide comparison (within *their* corpus), and presumably freedom from prejudice *towards their own artifacts* (they lack prejudice *against* ours, but that's irrelevant to judging *their* corpus). Their convergence *is* the standard of taste *for that specific corpus and tradition*. Hume's standard is fundamentally about the response of qualified perceivers to objects *within a context they understand*.

  2.  **Authority Over Us?** **Not directly, but it challenges us.** Their standard holds authority *for their tradition and corpus*. It carries no *direct* authority over *our* judgments of *our* tradition, because we (ideally) are the true judges for *our* tradition, having developed delicacy through practice and comparison *within it*. However, their existence and divergence pose a challenge:
      *   **Parochialism Check:** It forces us to examine whether *our* judgments might suffer from prejudice or lack of exposure to other possibilities. Hume's "freedom from prejudice" requires us to be open to other forms of beauty.
      *   **Universality Test:** Hume *believes* the "principles of taste are uniform in human nature." If their divergences on *our* masterpieces stem from *different associations* (which Hume sees as corrupting influences, not true taste) or a *lack of exposure/practice* with our tradition, then their judgment on *our* works lacks authority. They aren't true judges *for our tradition*.
      *   **The Deep Challenge:** If, after *we* become immersed in *their* tradition (gaining practice, comparison, understanding) and *they* become immersed in *ours*, and *both groups* of true judges *still* fundamentally disagree on core aesthetic values *across* traditions (e.g., what constitutes harmony, sublimity, or profound expression), then Hume's appeal to "uniform principles" faces a serious problem. He would likely argue true understanding would lead to appreciation, but this scenario highlights a potential limit or tension in his universalism.

  3.  **"Comparison of many works" & Parochialism:** Hume's requirement for comparison is **not inherently parochial.** It demands breadth *within the relevant domain* to develop discernment. The archaeologists' comparison *within their corpus* is sufficient to establish *their* standard for *their* art. It doesn't privilege *our* canon. Hume's resources ("good sense," "freedom from prejudice," "uniform principles") are intended to allow true judges to appreciate *different* traditions *once they acquire the necessary exposure and practice*. The parochialism arises if judges refuse to acknowledge the validity of *other* traditions cultivated by *other* true judges or if they judge a tradition without acquiring the necessary expertise within it.

  **Conclusion:**

  1.  **Corrected Reading:** Hume argues beauty is *response-dependent* but *not arbitrary*. The "standard of taste" is the convergent judgment of individuals possessing specific, observable qualities (delicacy *developed* through practice/comparison, good sense, freedom from prejudice). This standard is not circular because the judge's qualities are identified *independently* of specific verdicts. Disagreement among true judges indicates the absence of a *single* definitive verdict for that case, not necessarily that both are "incorrect." Beauty is subjective (mind-dependent) but inter-subjectively valid and governed by principles rooted in uniform human nature.
  2.  **The Standard's Work:** It **does independent work.** It provides *criteria* (the qualities) for identifying authorities, rather than merely ratifying existing experts. It explains *why* some judgments are better than others (lack of practice, prejudice, poor discernment). It sets an aspirational ideal for improving one's own taste. In your archaeology case, it clearly explains why the scholars' convergence *is* authoritative *for their corpus*, and why their divergence on *our* works doesn't necessarily challenge *our* standard *unless* they become true judges of *our* tradition too. It forces reflection on prejudice and the scope of universality.
  3.  **Subjectivity Survives?** Yes, but **profoundly qualified.** Hume establishes that beauty requires a perceiving mind. However, he provides a robust framework for objectivity *within* that subjectivity – it's not "merely subjective" in the dismissive or relativistic sense. The standard *does* real work in distinguishing better from worse judgments and grounding aesthetic value in shared human capacities. The book's summary significantly underplays Hume's positive project and misrepresents key mechanisms (like the source of delicacy and the reply to circularity). Hume's goal was to save taste from relativism, not capitulate to it.
