prompt: |-
  hey, I'm writing a 3500-word paper for a course on skepticism east and west and I want to do Inception instead of a set text. My tutor keeps saying the film is just Descartes with buildings that fold, and I want to push back by reading it against the Zhuangzi butterfly dream. But I don't want to fake the reading either, so I need you to tell me honestly where it breaks.

  The distinction I've been bulding the paper around, and wich you should use throughout: the butterfly passage doesn't ask am I dreaming right now. That's the Cartesian question, and it's a question about whether your current experiences are reliable. The Zhuangzi question is about which of two apparently incompatible self-ascriptions is the true one — whether one is Zhuang Zhou who dreamt he was a butterfly or a butterfly now dreaming it's Zhuang Zhou — with the stuff about the transformation of things sitting in the background. So it's a question about what you are, not about whether your experiences are accurate, and plausibly it has no answer from the inside, or else answering it was never the point.

  The bit I'm least sure about and most want help with: I've been calling it the wrong-kind-of-answer problem. Everything in the film that looks like an answer to the dream question only ever delivers a relative verdict — this layer is a dream relative to the one below it, checked with a totem, exited by a kick or by dying. Nothing in the film's mechanics can deliver an absolute verdict on whether the bottom layer is real. Mal wants the absolute one, and the only route the film gives her to it is killing herself, which obviously doesn't settle it either. Does that make her the most Zhuangzian character in the movie or the least?

  Then the part where I hope the film does some work: two things I keep circling. First, dreams in Inception are shared, so am I dreaming isn't a private question you settle alone, it's one a whole room of people can be wrong about together — and limbo especially is a place you get stuck in precisely because the world is rich enough that you stop asking. Does shared dreaming change the shape of the skeptical problem in a way the texts don't handle? Second, the ending: Cobb walks away from the spinning top. On the Cartesian reading that's an evasion or a tease. Is there a reading on which it's the right Zhuangzian move — not resolving which world you're in but no longer being gripped by the question — or is it just grief, and the film quietly changes the subject on us?

  What I'd like back: a reading that takes both the film and the philosophical material seriously, three scenes you'd point the paper at with a line on what each is doing, and an honest closing paragraph on where the analogy fails — e.g. if the butterfly passage isn't skepticism at all but a kind of equanimity about change, and Inception's actual emotional core is guilt and getting back to his kids, then maybe I'm projecting and the film is closer to Augustine or Freud than to anything in the Zhuangzi. Say so if that's what you think.

  About 1200 words, section headings I can steal would be great. Don't quote anything and don't cite anything, I've got all that covered — just give me the argument.
