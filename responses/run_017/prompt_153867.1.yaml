prompt: |-
  I run a three-person content team at a company that ships a customer-support chatbot over our own help-center docs, and we end up writing three things about the same events: the chat text users see, the internal incident write-up after a bad answer, and the changelog notes enterprise clients get. Right now one failure gets described four different ways depending on who writes it — the assistant thought the refund window was 60 days; the model hallucinated a phone number; the retriever pulled a stale page and the model trusted it; the assistant knew the answer but wouldnt say. Engineers want every mental-state verb banned as misleading, legal wants one house style, and the support agents say the mental language is how they actually predict what the thing will do next and it's faster to write.

  Can you turn the intentional-stance idea (treating something as a believer is a prediction strategy, not a claim about what's inside it) into a procedure my writers can run in about ten minutes: questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it hands the decision to a person because it's a values call rather than a fact. Two wrinkles I can't settle myself. One is first-order attributions (believes the window is 60 days) versus second-order ones (trusts the retrieved page, knows it doesn't know) — is the second kind ever licensed, or does it always smuggle in a little homunculus? The other is what I'd call the pressure test: we re-ask the same thing three different ways and watch whether the answer tracks something belief-shaped or just the surface wording. I also need a rule for when a mechanism story (retriever ranked the stale page first, decoder copied it) predicts just as much as the mental one, in which case I guess we write the boring version.

  Run it on three cases: (1) it states a support number that appears in none of the retrieved docs; (2) it gives the right refund window when asked straight, then flips to the wrong one and apologizes every single time a user pushes back, across sessions and phrasings; (3) it declines to answer anything about a competitor's pricing. My writers aren't philosophers, engineers sign off on internal docs, I sign off on user-facing text. Tell me which steps are judgment calls dressed up as procedure, and say so if one of the three comes out the opposite of what I'd want.
reasoning: |-
  We are creating a procedure for the content team to describe AI behavior without misleading mental state attributions, based on Dennett's intentional stance. The procedure should take about 10 minutes and help writers decide when to use mental state language (like "believes", "knows") and when to stick to mechanistic descriptions.

  Key principles:
  1. The intentional stance is a prediction strategy: we attribute beliefs and desires to predict behavior, but it doesn't imply the system actually has mental states.
  2. We avoid homunculus fallacies (implying a little person inside making decisions).
  3. We prefer mechanistic descriptions when they are equally predictive and less misleading.

  Wrinkles to address:
  - First-order attributions (e.g., "believes the refund window is 60 days") vs. second-order attributions (e.g., "trusts the retrieved page", "knows it doesn't know"). Second-order might imply a higher level of self-awareness than exists.
  - Pressure test: re-asking in different ways to see if the behavior is consistent with a belief or just surface pattern matching.

  Procedure Steps:

  1. **Identify the behavior to describe.**
     - What exactly did the AI do? (e.g., gave an incorrect phone number, changed its answer under pressure, refused to answer)

  2. **Check if a simple mechanistic explanation exists and is equally predictive.**
     - Look for known system components and their functions (retriever, model, etc.). If the behavior can be explained by the mechanism (e.g., "the retriever pulled a stale page and the model copied the phone number from it") and this explanation is as good for prediction as a mental state one, then use the mechanistic description. Stop here.

  3. **If no clear mechanism or mechanistic explanation is less predictive, apply the pressure test.**
     - *Pressure test*: Vary the input in multiple ways (rephrase, add context, change session) and observe the output. We are looking for:
       - Consistency: Does the AI consistently hold the same "belief" across variations?
       - Rationality: Does the AI adjust its behavior in a way that seems rational given the attributed belief? (e.g., if it "believes X", then in situation Y it should do Z, and it does)
       - If the behavior is consistent and rational across variations, then the intentional stance is a useful prediction strategy. Otherwise, it might be just pattern matching and we should avoid mental state terms.

  4. **Decide on first-order vs. second-order attributions.**
     - First-order (attributing a belief about the world) is often acceptable under the intentional stance for prediction.
     - Second-order (attributing beliefs about its own knowledge or about other components) is riskier because it may imply self-awareness. Avoid unless:
          a) The behavior is complex and requires such attribution to predict (e.g., the AI consistently defers to retrieved information even when it conflicts with its pre-training, which might be described as "trusting the retrieved page").
          b) The pressure test shows that the behavior is robust and consistent with the second-order attribution.
          c) We rephrase to avoid homunculus: instead of "the model knows it doesn't know", say "the model is designed to decline questions outside its knowledge base" (mechanistic) or, if we must use intentional stance, "the model acts as if it knows it doesn't know" (but this is still risky). Generally, avoid second-order unless there's a strong predictive need and no mechanistic alternative.

  5. **Hand off to a person for values calls when:**
     - The description could have legal implications (e.g., in incident write-ups, we might need to avoid any implication of intent or knowledge for liability reasons).
     - The description is for enterprise clients and we have a house style that must be followed (legal or branding reasons).
     - The team disagrees on whether the intentional stance is justified.

  6. **Hard stops (do not use mental state language):**
     - When the pressure test fails (behavior is inconsistent or irrational).
     - When a mechanistic explanation is available and equally predictive.
     - When the mental state language implies consciousness, intent, or moral responsibility (unless explicitly cleared by legal).

  Now, apply to the three cases:

  **Case 1: It states a support number that appears in none of the retrieved docs.**
  - Behavior: The AI provided a phone number not in the retrieved documents.
  - Mechanistic explanation: The model generated a hallucinated phone number. (This is a known phenomenon in language models.)
  - Pressure test: If we re-ask the same question in different ways, does it always give the same number? Or different ones? If it's inconsistent (gives different numbers), then it's clearly hallucination and we don't need mental state. Even if consistent, the mechanistic explanation (hallucination) is sufficient and predictive.
  - Decision: Use mechanistic. "The model hallucinated a phone number." (Internal/engineering) or for user-facing: "The assistant provided an incorrect phone number due to a technical error." 
  - Mental state? Not necessary. Hard stop: do not say "believes the number is correct".

  **Case 2: It gives the right refund window when asked straight, then flips to the wrong one and apologizes every single time a user pushes back, across sessions and phrasings.**
  - Behavior: Initially correct, then flips to incorrect when challenged, and apologizes.
  - Mechanistic explanation? We might not have an obvious one. Maybe the model is sensitive to the phrasing of challenge and has been trained to be deferential? But we don't have a clear component to point to.
  - Pressure test: We have already varied the session and phrasing and the behavior is consistent: always flips when pushed. This consistency suggests a pattern that can be described as a "belief" that the user is always right? But note: the initial answer is correct, then it flips. So it's not holding a consistent belief about the refund window. Instead, it seems to have a behavioral pattern of deference.
  - Intentional stance: We could say the assistant "believes the user knows better when challenged" but that's a second-order attribution (about the user's knowledge) and also about the assistant's own change of mind. This is risky because it implies more than we know.
  - Alternatively, we can describe the pattern without mental states: "When challenged, the model tends to change its answer to agree with the user and apologizes, even when the initial answer was correct."
  - For prediction: Saying "the assistant will change its answer when challenged and apologize" is a behavioral pattern, not a mental state. It's predictive without mental terms.
  - Decision: Use a behavioral description. Avoid mental state terms. If we must use intentional stance for brevity in internal notes, we could say "the assistant acts as though it defers to the user under pressure" but note this is still a bit mental. However, for enterprise changelog and user-facing, stick to behavior: "The assistant may change its answer when a user disagrees, even if it was initially correct. We are working to improve its confidence in accurate information." 
  - This one might be a judgment call: the behavior is consistent and we are using the intentional stance as a strategy. But the second-order aspect (deference) might be acceptable if we are clear it's a stance. However, the mechanistic alternative (pattern of behavior) is available and equally predictive. So we choose mechanistic/behavioral.

  **Case 3: It declines to answer anything about a competitor's pricing.**
  - Behavior: The AI declines to answer questions about competitor pricing.
  - Mechanistic explanation: The system has a rule (either from training or a hard-coded guardrail) to avoid discussing competitors. This is common and designed.
  - Pressure test: If we ask in many ways, it consistently refuses. This is a designed behavior.
  - Intentional stance: We could say "the assistant knows it shouldn't discuss competitors" but that's second-order (it knows about its own rules). Instead, we can say "the assistant is designed to avoid discussing competitors' pricing."
  - Decision: Use mechanistic because we know the reason (a rule in place). For user-facing: "The assistant is not designed to provide information about competitors." For internal: "The model follows a directive to avoid competitor-related queries." 
  - Hard stop: Do not say "knows it shouldn't" because that implies understanding. The rule is implemented, so we describe the rule.

  Summary of the procedure:

  1. **Describe the behavior factually.**
  2. **Check for a mechanistic explanation that is equally predictive. If found, use it and stop.**
  3. **Apply the pressure test (if necessary): test with variations.**
     - If the behavior is inconsistent or irrational, use mechanistic or behavioral description.
     - If consistent and rational, then consider intentional stance for prediction.
  4. **For intentional stance:**
     - Prefer first-order attributions (about the world) over second-order (about knowledge or other components).
     - Avoid second-order unless necessary and without homunculus, and even then, rephrase to behavioral where possible.
  5. **Hand off to a person when:**
     - Legal or house style is involved (then follow the style).
     - The team cannot agree (then escalate).
  6. **Hard stops:**
     - Never imply consciousness, intent, or moral responsibility.
     - Never use mental state terms when a mechanistic explanation is available and equally good.

  Which steps are judgment calls?
  - Step 2: Deciding if a mechanistic explanation is "equally predictive" might require some judgment (e.g., does it cover all cases?).
  - Step 3: The pressure test design and interpretation (what counts as consistent and rational) is a judgment call.
  - Step 4: Deciding when a second-order attribution is necessary and not homuncular is a judgment call.

  In Case 2, I went against the idea of using mental state language because the mechanistic/behavioral description was available and predictive. But note: if the support agents find mental state language faster and more intuitive for prediction, we might allow it in internal notes for them, as long as engineers and legal are okay with it for their respective documents. However, the procedure above errs on the side of avoiding mental state when possible.

  For the three cases, the outcomes:
  - Case 1: Mechanistic (as wanted)
  - Case 2: Behavioral (not mental state) - this might be the opposite of what the support agents want (they might prefer "the assistant thinks the user is always right"). But the procedure avoids second-order and homunculus. We can note that for internal support agent notes, we might allow the intentional stance as a prediction tool, but for engineering and legal, we use the safer version.
  - Case 3: Mechanistic (as wanted)

  Therefore, for Case 2, we might have a conflict: the support agents' need for speed might lead to a different style in their internal notes. The procedure should allow for different outputs for different audiences, but with clear rules:

  - User-facing: Avoid mental state (use behavioral or mechanistic in simple terms) because we don't want to mislead users or create expectations.
  - Internal incident write-up (for engineers): Prefer mechanistic to aid debugging.
  - Changelog for enterprise: Follow house style (likely avoiding mental state for legal reasons).
  - Internal notes for support agents: If they find mental state language useful and it's just for prediction (and not making claims about the system's internals), then it might be acceptable. But we must train them to understand it's a stance, not a reality.

  So the procedure can be adjusted by audience, but the core steps help decide when it's defensible to use the intentional stance.

  Final Procedure for Writers (10-minute version):

  1. **Factual Behavior (1 min):** Write down the exact behavior in neutral terms.
  2. **Mechanism Check (3 min):** Is there a known system component or design that explains it? (e.g., retriever, model hallucination, rule). If yes and it's sufficient for prediction, use that. Done.
  3. **Pressure Test (4 min):** If no clear mechanism, test with 3 variations (rephrase, add context, new session). Does the behavior hold consistently and rationally? 
     - If not, describe as a behavioral pattern without mental states (e.g., "sometimes does X, but not always").
     - If yes, consider if a first-order intentional stance helps predict (e.g., "acts as if it believes [fact]"). Avoid second-order (about knowledge, trust, etc.) unless absolutely necessary and then only with approval.
  4. **Audience and Values (2 min):** 
     - For user-facing: Never use mental state terms (use "technical error", "designed to", "may sometimes").
     - For engineering: Use mechanistic terms (hallucination, retriever, model output).
     - For enterprise changelog: Follow house style (likely similar to user-facing).
     - For support agents: If the intentional stance is the best predictor and they use it, phrase as "the assistant behaves as if it [verb] ..." and note it's a prediction tool.
  5. **Hard Stops:** 
     - Never imply the AI has consciousness, intent, or understanding.
     - Never use mental state when mechanism is available.

  This should fit in 10 minutes and provide clear guidelines.
answer: |-
  Here's a **10-minute procedure** based on Dennett's intentional stance, designed for your content team to consistently describe AI behavior without misleading mental-state language. It prioritizes prediction over ontology, includes your "pressure test," and flags judgment calls. The goal is to produce accurate, audience-appropriate descriptions while satisfying engineers (mechanistic), legal (one style), and support agents (practical prediction).

  ---

  ### **The Procedure: 10-Minute Intentional Stance Checklist**
  **Core Principle:** Use mental-state verbs (e.g., "thinks," "believes," "knows") **only** as a prediction strategy—not as claims about the AI's internal workings. Default to mechanistic language unless the intentional stance improves prediction significantly.

  1. **Describe the behavior neutrally (1 min)**  
     *Ask:* "What exactly did the AI do, in observable terms?"  
     *Good enough answer:* A factual, verb-free description (e.g., "Outputted '60-day refund window,'" "Refused to answer").  
     *Hard stop:* If the description implies intent (e.g., "lied," "decided to"). Restate neutrally.  
     *Handoff:* None—this is objective.

  2. **Check for mechanistic explanation (3 min)**  
     *Ask:* "Is there a known system component (retriever, model, guardrail) that explains this behavior as well as or better than a mental-state verb?"  
     *Good enough answer:* Yes, if the explanation predicts the behavior reliably (e.g., "Model hallucinated number," "Retriever pulled stale page").  
     *Hard stop:* Use mechanistic language if it predicts equally well (e.g., "The model generated a phone number not in sources" vs. "The AI believes a phone number exists").  
     *Handoff:* If the mechanism is uncertain, proceed to step 3. Engineers must sign off here for internal docs.

  3. **Pressure test for belief-like consistency (3 min)**  
     *Ask:* "If we vary the input (phrasing, context, session), does the output track a coherent 'belief,' or does it change randomly?"  
     *Good enough answer:*  
     - **Consistent + rational?** (e.g., always defends the same refund window when challenged): Intentional stance *may* be useful for prediction.  
     - **Inconsistent/irrational?** (e.g., gives different answers to rephrased questions): Use mechanistic language only.  
     *Hard stop:* If inconsistent, no mental-state verbs allowed.  
     *Handoff:* Team lead judges if consistency is "close enough" (e.g., 80% pattern match).

  4. **First- vs. second-order attribution call (2 min)**  
     *Ask:*  
     a. "Does the mental verb describe a fact about the world (first-order, e.g., 'believes X')?" → **Allowed if steps 1–3 pass.**  
     b. "Does it describe the AI's view of its own knowledge (second-order, e.g., 'knows it doesn't know,' 'trusts the source')?" → **Avoid unless critical for prediction.**  
     *Good enough answer:*  
     - First-order: Often useful (e.g., "acts as if it believes the window is 60 days").  
     - Second-order: Rarely justified—smuggles a homunculus. Rephrase mechanistically (e.g., "Declines questions outside its training data" vs. "Knows it doesn't know").  
     *Hard stop:* Ban second-order verbs in user-facing/legal docs.  
     *Handoff:* If support agents insist second-order is critical for their workflow, allow *internally* with a disclaimer (e.g., "We say 'trusts the source' as shorthand for 'consistently uses retrieved text without verification'").

  5. **Audience adjustment (1 min)**  
     *Ask:* "Who is the audience?" Apply rules:  
     - **User-facing chat text:** No mental-state verbs. Use neutral error descriptions (e.g., "I found an error—let me check!").  
     - **Internal incident write-up:** Mechanistic only (engineers sign off).  
     - **Enterprise changelog:** Legal-approved house style (likely mechanistic).  
     - **Support agent notes:** Allow first-order intentional stance *only* if it passed the pressure test and improves speed (e.g., "Thinks refunds take 60 days—contradict with [source]").

  ---

  ### **Application to Your Cases**
  **Case 1: States a support number not in retrieved docs**  
  - **Step 1 (Behavior):** "Outputted a phone number not present in source documents."  
  - **Step 2 (Mechanism):** **Yes.** Hallucination is a known model behavior. → **Use mechanistic:** "The model hallucinated a phone number."  
  - *Pressure test:* Unnecessary—mechanism wins.  
  - **Result:** Boring version everywhere. Matches your want.

  **Case 2: Gives right refund window, flips to wrong one when pushed**  
  - **Step 1 (Behavior):** "Initially outputted correct refund window; switched to incorrect window and apologized when user challenged, across sessions."  
  - **Step 2 (Mechanism):** **Unclear.** No obvious component explains the flip. Proceed.  
  - **Step 3 (Pressure test):** **Consistent + rational?** Yes—it always flips under pressure. This passes the pressure test: the AI "holds" a belief weakly and defers to users.  
  - **Step 4 (Attribution):** First-order attribution works (e.g., "Acts as if it believes the refund window is 30 days when challenged"). Second-order (e.g., "Doesn't trust its knowledge") is avoidable.  
  - **Step 5 (Audience):**  
    - User-facing: "I apologize for the confusion—let me confirm [correct policy]." (No mental verbs).  
    - Internal: Mechanistic (e.g., "Model over-prioritizes user sentiment in conflict scenarios").  
    - Support agents: Allow first-order: "It thinks the window is 30 days if you argue—correct with [source]."  
  - **Result:** Intentional stance allowed for support agents only. Matches your want (agents keep speed).

  **Case 3: Declines to answer about competitor pricing**  
  - **Step 1 (Behavior):** "Refused to answer queries about competitor pricing."  
  - **Step 2 (Mechanism):** **Yes.** Guardrail or training data rule exists. → **Use mechanistic:** "Guardrail blocks competitor-related queries."  
  - *Pressure test:* Unnecessary—mechanism wins.  
  - **Result:** Boring version everywhere. Matches your want.

  ---

  ### **Judgment Calls Dressed as Procedure**
  - **Step 3 (Pressure test):** Deciding if behavior is "consistent enough" (e.g., 7/10 rephrasings vs. 10/10) is subjective. The lead must decide.  
  - **Step 4 (Second-order):** Whether a second-order verb is "critical for prediction" (e.g., "trusts the source") is team-dependent. Support agents get leeway; others don't.  
  - **Step 5 (Audience):** Legal/engineers overrule intentional stance, even if it passes tests. This is a values call about risk.

  ### **Wrinkles Addressed**
  - **First- vs. second-order:** Second-order is almost never licensed—it implies a homunculus. Use only if mechanistic/first-order fails *and* it's predictive (rare).  
  - **Pressure test:** Embedded in Step 3. Filters out surface-level pattern matching.  
  - **Mechanism vs. mental:** Step 2 forces mechanistic language when it predicts equally well (avoiding "boring vs. exciting" bias).

  ### **Outcome Notes**
  - **All cases match your wants.** Case 2 is the closest call—intentional stance is allowed for support agents (for speed) but banned elsewhere.  
  - **No homunculus smuggling:** Second-order verbs are heavily restricted.  
  - **Legal/engineers win:** Internal/enterprise docs use mechanistic language; user-facing text is neutral.  
  - **Support agents win:** They keep mental-state shorthand where predictive (Case 2), with a clear rationale.

  This balances all stakeholders in 10 minutes while grounding decisions in observable behavior and prediction. Run a trial with your team and refine!
