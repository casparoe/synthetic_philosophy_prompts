prompt: |-
  I'm on the ethics committee at a mid-sized community hospital, and last month we switched to a new two-part advance directive form that our chair designed. Part A is the actual instruction — the checkbox stuff about ventilators, feeding tubes, antibiotics for infections once someone has advanced dementia. Part B is a blank box where the patient writes, in her own words, a few sentences about what she's trying to protect or avoid by signing Part A. The idea is that when the two parts come apart down the road, Part B tells us how to read Part A. I got into an argument about this with a friend who's a hospitalist, and she said the whole form is pointless: only Part A can have any authority, because the earlier competent self is a decision-maker, not an advice columnist. Once she's decided, her reasons for deciding are done — we don't get to reopen them and audit whether they still hold. I think that can't be right, but every time I try to say why I end up just asserting it, so I want a case concrete enough to bring to the next meeting (we're also using it to train the new residents, so it has to be a real hospital-ish situation, not a philosophy seminar setup).

  So: build me a case — one paragraph, realistic, a hospital or a memory care unit, nothing science-fictional — engineered to these specs. The patient is now permanently incapacitated and Part A's trigger condition is unambiguously met. But Part B's rationale has, in a way you get to design, been voided: the thing she wrote the directive to protect or prevent is gone, or achieved, or no longer on the table. Two things you can't use. First, no empirical-misconception move — she was not wrong about what the condition would be like, so you can't win by saying she'd have been surprised by how things turned out. Second, and this is the bit I keep failing at: the case has to be built so that the question "what would she have wanted now?" is genuinely blocked. The evidence should point both ways or be silent. If your scenario makes it obvious she'd have changed her mind, or obvious she'd have stuck with her guns, it doesn't count — winning by speculation about her hypothetical current wishes is exactly the cheat I'm trying to rule out. Also, please don't make it easy on yourself by making her current life obviously good: I want her present-day welfare to be genuinely murky, so that a straight current-interests or best-interests reading can't deliver a clean verdict either way.

  After the scenario, do the accounting. Tell me what the instruction-authority reading (my friend's) says and why; what a current-interests reading says and why; and what the rationale-authority reading says and why — and I want the last one to come apart from the second one, so that the argument for overriding is structural (something about what she was *doing* when she filled out the form, what the authority was *for*) rather than a claim that she's better off being treated. Then isolate the single feature of the case that's doing the work, show me what happens to all three verdicts if you delete it, and tell me how my friend the hospitalist would attack the case — she's smart and she'll say something about hindsight and about the whole point of the practice, so give me her strongest version, not a strawman. One more thing: I need to know how confident you are in each piece of this and, specifically, which part you're least sure of — I'd guess it's whether the rationale reading can even be stated without quietly collapsing back into a guess about her hypothetical wishes, but you tell me. If it can't be done to spec, say so rather than fudging, and tell me which constraint you had to drop.
reasoning: |-
  Hmm, the user is on an ethics committee at a hospital dealing with a new two-part advance directive form. They need a realistic hospital case to debate whether Part B (the rationale) should influence decisions when Part A (the instructions) is triggered but the rationale no longer applies. The case must avoid two pitfalls: no empirical misconceptions, and no speculation about what the patient would want now. Also, the patient's current welfare must be ambiguous.

  I need to design a scenario where Part B's reason is voided, meaning the thing the patient wanted to protect or avoid is gone. For example, maybe they wanted to protect a specific person, but that person is no longer in the picture. The case should be set in a hospital or memory care unit, nothing sci-fi. After the scenario, I have to analyze three readings: instruction-authority (Part A only), current-interests, and rationale-authority, showing how they differ.

  Key constraints: The patient is incapacitated, Part A's trigger is met, Part B's rationale is voided. No empirical mistakes—she knew the condition accurately. No clear answer to "what would she want now?"—evidence must be ambiguous. Current welfare murky, not obviously good or bad. The rationale-authority argument must be structural, not based on her being better off treated.

  Brainstorming the scenario: A patient with dementia signs an advance directive. Part A: refuse all life-prolonging treatments if advanced dementia. Part B: writes she wants to avoid being a burden on her daughter, who is her sole caregiver. Now, the daughter dies in an accident. The rationale—protecting the daughter—is voided. The patient's condition: advanced dementia, minimally responsive, but not in pain. Current welfare is ambiguous—she's not suffering, but has no quality of life. Would she change her mind? Unclear; maybe she still values dignity, or maybe the burden concern was key. Can't speculate.

  Now, analyzing the three readings:
  1. Instruction-authority (friend's view): Follow Part A strictly. The earlier decision is binding, reasons don't matter. So, refuse treatments.
  2. Current-interests: Murky. She's not suffering, but not thriving. Treating might prolong a life with no meaning, not treating might deny potential comfort. No clear best interests, so perhaps default to Part A.
  3. Rationale-authority: The directive was conditional on the rationale. Since the rationale is voided (daughter gone), the instruction loses authority. Decision reverts to current interests or surrogate judgment. But must argue structurally: the directive was a means to an end (protect daughter), not an end in itself. End is gone, so means aren't binding.

  Critical feature: The rationale is specific and extrinsic (protecting someone else), not intrinsic (like avoiding suffering). If I make it intrinsic, say avoiding pain, it might collapse into current interests. So specificity and externality are key. Remove that, and rationale-authority falls apart.

  Friend's counterarguments:
  - Hindsight problem: We can't reassemble directives based on changing circumstances; that invites bias.
  - Competent self's authority: She made a decision, reasons are private; reopening undermines autonomy.
  - Slippery slope: If we void directives when rationales change, it creates uncertainty and devalues advance care planning.

  Confidence assessment:
  - Scenario: High confidence. It meets constraints—no misconceptions, rationale voided, current welfare murky.
  - Blocking "what would she want": Medium. The ambiguity is plausible, but some might argue it's knowable. I need to emphasize the lack of evidence.
  - Rationale-authority without collapsing: Low confidence. It's tricky to argue structurally. The link between the rationale and the decision's authority is philosophical. If the directive was a promise or conditional, but advance directives are often seen as standalone decisions. I might be sneaking in hypothetical wishes. Need to frame it as the rationale defining the scope of the directive's application.

  If it can't be done, the constraint to drop might be blocking hypothetical wishes. But I think the scenario holds. Proceed with the case and analysis.
answer: |-
  ### Scenario: The Protected Grandchild  
  Mrs. Alvarez, 78, signed the directive 5 years ago after her Alzheimer’s diagnosis. Part A: *Refuse all life-prolonging treatments (including antibiotics for pneumonia) if she develops advanced dementia and cannot recognize family.* Part B: She wrote, *"I don’t want to linger if my mind is gone. My biggest fear is my grandson, Mateo (then 15), seeing me like that—he’s sensitive, and it would scar him. Protect him from that trauma."* Today, Mrs. Alvarez has advanced dementia in memory care: she’s bedbound, minimally responsive, and no longer recognizes anyone. She develops aspiration pneumonia. Trigger condition met. But Mateo, now 20, joined the military last year and died in active combat overseas six months ago. The family is grieving but agrees Mateo’s death voids Part B’s core rationale. Her current state is murky: she shows no distress, smiles occasionally at tactile stimuli (e.g., warm blankets), but has no meaningful interaction or awareness. Antibiotics would likely clear the infection but prolong this existence indefinitely; withholding them would lead to comfortable death in days. There’s no evidence she knew of Mateo’s enlistment or death risks when she signed, and no documentation of her views beyond the directive.  

  ### Accounting  
  1. **Instruction-Authority Reading (Your Friend’s View)**  
     - Verdict: *Follow Part A (refuse antibiotics).*  
     - Why: The competent Mrs. Alvarez made a binding decision in Part A. Her reasons (Part B) are irrelevant once the directive is activated—she wasn’t requesting advice but issuing a command. Reopening her rationale invites subjective reinterpretation and undermines the directive’s legal/ethical authority. Her fear for Mateo doesn’t negate her clear, condition-based instruction.  

  2. **Current-Interests Reading**  
     - Verdict: *Inconclusive, but likely default to Part A.*  
     - Why: Her welfare is genuinely ambiguous—she experiences fleeting comfort but no dignity, relationships, or suffering. Antibiotics might preserve a neutral existence, but withholding them avoids prolonging profound incapacity. Without clear evidence of benefit or harm, "best interests" defaults to prior expressed wishes (Part A) to avoid arbitrariness.  

  3. **Rationale-Authority Reading**  
     - Verdict: *Override Part A (provide antibiotics), but not based on welfare.*  
     - Why: Part B isn’t mere context—it defines the *scope* of Part A’s authority. Mrs. Alvarez wasn’t prohibiting treatment absolutely; she was prohibiting it *as a means to protect Mateo*. The directive was a *conditional act*: "If protecting Mateo requires refusing treatment, then refuse." Since Mateo is gone, the condition fails, and Part A loses its foundational purpose. This is structural: her authority was vested in achieving a goal (shielding Mateo), not in the refusal itself. Overriding isn’t about her *current* welfare or guessing her wishes—it’s about recognizing that the act of signing was contingent on the rationale’s existence.  

  ### Critical Feature and Sensitivity Test  
  - **Isolated Feature**: *The rationale (Part B) is extrinsically focused*—it centers on protecting another person, not her own experience (e.g., avoiding suffering).  
  - **If Removed**: Suppose Part B read, *"I don’t want to live without my mind—it’s undignified."*  
    - Instruction-authority: Unchanged (follow Part A).  
    - Current-interests: Still murky, but now the rationale (dignity) ties to her persistent state, making Part A harder to override.  
    - Rationale-authority: Collapses. The rationale isn’t "voided"—dignity remains relevant to her current state, so Part A retains authority. The extrinsic focus is key to decoupling rationale from current welfare.  

  ### Hospitalist’s Counterargument  
  **Her Strongest Critique**: "This confuses *why* she decided with *what* she decided. Directives exist because we can’t trust hindsight judgments. When Mrs. Alvarez signed Part A, she knew life circumstances change—she chose to bind her future self anyway. Voiding Part A because Mateo died assumes she’d have wanted that, which is exactly the speculation we must avoid. Worse, it makes directives unstable: if rationales can be ‘voided’ by events, surrogates will constantly second-guess them. That guts the practice—it turns advance care into a living will with an expiration date."  

  ### Confidence Assessment  
  - **High Confidence**: Scenario realism (hospital/memory care, no sci-fi), unambiguous trigger, voided rationale (Mateo’s death), and murky welfare (smiles but no awareness).  
  - **Medium Confidence**: Blocking "what she’d want now"—evidence is silent, but some might argue her general fear of "lingering" implies consistency. I mitigated this by specifying her focus was Mateo-specific.  
  - **Low Confidence**: Rationale-authority avoiding collapse into hypothetical wishes. This is the weakest link. I *think* the extrinsic-goal structure ("protect Mateo") creates a genuine contractual condition, making it about the *act* of signing rather than her preferences. But it risks smuggling in assumptions about her intent. If this fails, the constraint to drop is blocking hypothetical-wish speculation—you’d have to allow limited inference (e.g., "she wouldn’t have refused treatment *for no reason*").  

  **Final Note**: This case forces a debate about whether directives are *unconditional commands* or *tools for goals*. If your committee accepts the rationale-authority reading structurally, it validates Part B. If not, your friend wins—but the scenario still trains residents on the tension.
