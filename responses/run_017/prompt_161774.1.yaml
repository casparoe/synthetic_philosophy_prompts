  ### Typical Wrong Answers  
  - **Using Bea’s posteriors for objective EU in (a)(ii)**: Calculating EU after "+" as (2/3)×10 + (1/3)×0 ≈6.67 (her subjective EU) instead of 80/9≈8.89. *Reveals confusion between subjective expectation and objective expected utility under true probabilities.*  
  - **Ignoring directive optimization in (a)(iii)**: Claiming best directive EU is 7.8 (e.g., surgery if "+", drug if "−") and not considering constant acts. *Reveals oversight that directives include ignoring the test.*  
  - **Misidentifying step failure in (b)**: Saying Step 2 fails due to "no swap" without noting Step 1’s wrong posterior. *Reveals superficial understanding of the proof’s reliance on correct posteriors.*  
  - **Overgeneralizing "ignore it" in (b)**: Claiming the objection works because she can decline or use a directive, ignoring that it fails for option (ii) specifically. *Reveals conflation of options and lack of attention to what the objection assumes about control.*  
  - **Calling Good’s theorem refuted in (c)(iii)**: Stating the theorem is false because information can hurt. *Reveals misunderstanding that theorems hold under their assumptions; the case shows the need for extra premises.*  
  - **Arithmetic errors in P(r) or EU**: E.g., P(+) = 0.8 × 0.8 = 0.64 (omitting P(+|B)P(B)). *Reveals careless probability calculation, often from not using total probability.*
