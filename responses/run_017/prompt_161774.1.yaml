answer: |-
  ### The Question

  Bea has a medical condition with two strains, A or B. Her credence that she has strain A is 0.8. Two treatments are available:  
  - Surgery: utility 10 if strain A, 0 if strain B.  
  - Drug regimen: utility 2 if strain A, 9 if strain B.  

  Before deciding on a treatment, Bea can take a free test that prints "+" or "−". The test's reliability is:  
  - P(+|A) = 0.8, P(−|A) = 0.2  
  - P(+|B) = 0.4, P(−|B) = 0.6  

  Bea has a stable, well-documented disposition called *prior-forgetting*: after seeing a result R, she updates her credence to P(R|A) / [P(R|A) + P(R|B)], as if her prior were 50/50. She cannot change this and knows she has it.  

  Bea has three options:  
  1. Decline the test and choose a treatment immediately.  
  2. Take the test and then choose a treatment based on her prior-forgetting credences.  
  3. Sign a binding directive before the test runs, committing to a treatment (or a rule mapping results to treatments) regardless of the printout.  

  The utilities are not medically realistic.  

  **(a)** Compute Bea’s expected utility for each option:  
  (i) Declining the test. (2 marks)  
  (ii) Taking the test and choosing based on prior-forgetting credences. (2 marks)  
  (iii) Signing a directive (assume she chooses the best possible directive). (2 marks)  
  Show that for a perfect Bayesian (who updates by conditionalization), the test’s expected value is exactly 0, but for Bea in option (ii), it is strictly negative. Calculate how much she should be willing to pay to avoid seeing the printout in option (ii). In one sentence, explain why the numbers come out this way. (3 marks)  

  **(b)** The standard proof of Good’s theorem has two key steps:  
  1. Value of signal = Σ_r P(r) × max_a EU(a | r) [using posterior after r].  
  2. Swap: max_a Σ_r P(r) × EU(a | r) = max_a EU(a) [using prior].  
  Name exactly which step fails for Bea in option (ii) and why. Then, assess the objection "free information can’t hurt because you can always ignore it": does it work for Bea in option (ii), and what does it presuppose about what an agent controls? (8 marks)  

  **(c)** Answer all:  
  (i) Is Bea irrational to decline the test? Why? (1 mark)  
  (ii) Is Bea irrational to have the prior-forgetting disposition? Why? (2 marks)  
  (iii) What does this case show about Good’s theorem? Is it refuted, in need of explicit extra premises, or fine but doing less work than people think? In particular, can it be used as an independent argument that you ought to conditionalize or that you ought to want information? (5 marks)  

  Total: 25 marks  

  ---

  ### Model Answer  

  **(a)**  
  (i) Declining the test:  
  - EU(surgery) = (0.8 × 10) + (0.2 × 0) = 8  
  - EU(drug) = (0.8 × 2) + (0.2 × 9) = 1.6 + 1.8 = 3.4  
  - Bea chooses surgery for max EU = 8.  

  (ii) Taking test and choosing with prior-forgetting:  
  - P(+) = P(+|A)P(A) + P(+|B)P(B) = (0.8 × 0.8) + (0.4 × 0.2) = 0.64 + 0.08 = 0.72  
  - P(−) = 1 − 0.72 = 0.28 (or P(−|A)P(A) + P(−|B)P(B) = (0.2 × 0.8) + (0.6 × 0.2) = 0.16 + 0.12 = 0.28)  
  - After "+": credence A = P(+|A)/(P(+|A) + P(+|B)) = 0.8/(0.8+0.4) = 2/3 ≈ 0.6667. She chooses surgery: EU (actual) = P(A|+)×10 + P(B|+)×0 = (0.8×0.8/0.72)×10 + (0.4×0.2/0.72)×0 = (0.8889×10) + (0.1111×0) = 8.8889 ≈ 80/9  
  - After "−": credence A = P(−|A)/(P(−|A) + P(−|B)) = 0.2/(0.2+0.6) = 0.25. She chooses drug: EU (actual) = P(A|−)×2 + P(B|−)×9 = (0.2×0.8/0.28)×2 + (0.6×0.2/0.28)×9 = (0.5714×2) + (0.4286×9) = 1.1428 + 3.8574 = 5  
  - Overall EU = P(+) × EU|+ + P(−) × EU|− = (0.72 × 80/9) + (0.28 × 5) = (0.72 × 8.8889) + (0.28 × 5) ≈ 6.4 + 1.4 = 7.8  

  (iii) Best directive:  
  - Always surgery: EU = 8 (as in (i))  
  - Always drug: EU = 3.4  
  - Surgery if "+", drug if "−": EU = P(+)×[P(A|+)×10 + P(B|+)×0] + P(−)×[P(A|−)×2 + P(B|−)×9] = 0.72×(0.8889×10) + 0.28×(0.5714×2 + 0.4286×9) ≈ 0.72×8.8889 + 0.28×5 = 6.4 + 1.4 = 7.8  
  - Drug if "+", surgery if "−": EU = 0.72×(0.8889×2 + 0.1111×9) + 0.28×(0.5714×10) ≈ 0.72×3.1111 + 0.28×5.714 ≈ 2.24 + 1.6 = 3.84  
  - Best directive: always surgery (EU = 8).  

  Perfect Bayesian:  
  - Without test: EU = 8 (as above)  
  - With test (conditionalize, choose optimally):  
    - After "+": P(A|+) ≈ 0.8889, surgery EU = 8.8889, drug EU = (0.8889×2) + (0.1111×9) ≈ 2.8889, choose surgery  
    - After "−": P(A|−) ≈ 0.5714, surgery EU ≈ 5.714, drug EU = 5, choose surgery  
    - EU = 0.72×8.8889 + 0.28×5.714 ≈ 6.4 + 1.6 = 8  
  - Test value = 8 − 8 = 0.  

  For Bea in (ii), EU = 7.8 < 8, so test is strictly negative (loss of 0.2). She should pay up to 0.2 to avoid seeing the printout in option (ii).  
  Why: Prior-forgetting makes her underconfident in A after "+" (more likely result), leading to a switch to drug when not optimal.  

  **(b)**  
  Step that fails: Step 1, because Bea does not use the true posterior P(·|r) to compute max_a EU(a | r); she uses a different posterior (based on 50/50 prior), so Σ_r P(r) × max_a EU(a | r) is not evaluated correctly.  
  Why swapping fails: The swap relies on the posterior being P(·|r) for consistency, but her posterior is not P(·|r), so Σ_r P(r) × EU(a | r) ≠ EU(a) for her.  

  "You can always ignore it" objection:  
  - Does not work for Bea in option (ii) because she cannot ignore the result after seeing it; her prior-forgetting forces her to update credences and choose based on them, so she may not choose the prior-optimal act (surgery).  
  - Presupposition: The objection assumes the agent can control whether to use the information in decision-making (e.g., by choosing the prior-optimal act regardless of beliefs). But Bea cannot control her belief-updating disposition, so without a directive, she cannot ignore it.  

  **(c)**  
  (i) No, declining is rational as it yields EU=8, same as the best directive and higher than option (ii) (7.8).  
  (ii) Yes, the disposition is irrational because it causes suboptimal decisions when she uses it (e.g., in option (ii), EU=7.8 < 8), violating instrumental rationality.  
  (iii) Good’s theorem is not refuted but requires explicit extra premises (e.g., conditionalization). It cannot be used as an independent argument that you ought to conditionalize or want information, as it assumes rational updating; here, without it, information can be harmful.  

