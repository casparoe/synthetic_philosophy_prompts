  # RFC: Remove the `qualia` package

  ## Status
  Proposed

  ## Motivation
  The `qualia` package was designed to provide four core guarantees (as per its documentation):
  1. **Ineffable**: The state cannot be communicated or described.
  2. **Intrinsic**: The state is non-relational and independent of external factors.
  3. **Private**: The state cannot be directly accessed by any observer other than the subject.
  4. **Directly/Immediately Apprehensible**: The state is known directly to the subject without mediation.

  However, these guarantees have made the package entirely unusable in practice. Specifically:
  - We cannot write tests because any test would require effable descriptions or external observations.
  - We cannot fix bugs because bug reports cannot meaningfully reference the internal state (due to ineffability and privacy).
  - We cannot even name which property is failing (since naming would violate ineffability).

  Moreover, we have discovered that no part of the system actually depends on the `qualia` package for any observable behavior. All dependent packages only interact with the `report-and-discrimination` layer (which is preserved).

  ## Breaking Changes
  The `qualia` package will be removed. All exports will be deprecated.

  ## Downstream Impact
  We have identified the following packages as direct dependents:
  - `zombie-arguments`
  - `mary-room-experiment`
  - `inverted-spectrum-regressions`
  - `suffering-ethics`
  - `hard-problem-dashboard`

  To ensure no breakage, we will introduce a compatibility shim that provides the same interface as the `qualia` package. The shim will:
  - For any function that returns a "quale", return a placeholder (e.g., `undefined` or a sentinel value) and log a deprecation warning.
  - Redirect all method calls to the `report-and-discrimination` module, which was always the actual source of behavioral outputs.

  Note: The legacy snapshot suite (`qualia-snapshots`) has been regenerated without the `qualia` package for the last 3 years (since commit `a1b2c3d`), and no one has noticed. This confirms that the snapshots are only capturing the report-and-discrimination layer.

  ## Closed Issues
  The following issues will be closed upon merging this RFC:

  - Issue #17: "Cannot write unit tests for `qualia` module" (opened: 2020-05-01)
  - Issue #42: "Works on my machine: qualia present" (opened: 2021-11-15)
    - User reported: "I know what my red looks like, and it's definitely there. The package is functioning as intended for me."
    - Resolution: The report cannot be independently verified due to the private and ineffable nature of qualia. Without a reproducible test case, we cannot act on this report.
  - Issue #56: "Inverted spectrum test fails randomly" (opened: 2022-01-22)
    - The shim will replace the inverted spectrum test with a mock that always returns consistent reports, making the test pass deterministically.
  - Issue #73: "Hard-problem dashboard shows 'unsolved'" (opened: 2022-06-30)
    - The dashboard will be updated to source data from the `report-and-discrimination` module, and will now show 'solved' because the hard problem is avoided.

  Additionally, all open issues against `qualia` will be closed as "wontfix" because the package is being removed.

  ---

  We'll write it in the style of an internal engineering doc, with a cheerful tone and deadpan delivery. Let's aim for 600-700 words.
answer: |-
  ### RFC: Removal of the `qualia` Package  
  **Status**: Proposed ✅  
  **Author**: Devin "Chipper" O'Reilly (@chipper-devin)  
  **Created**: 2024-10-01  

  ---

  #### 📋 Motivation  
  The `qualia` package (v0.1–v3.7) has been a legacy dependency in our monorepo since 2018, originally implemented to model "subjective experience" via four core API guarantees:  

  ```typescript
  interface Quale {
    ineffable: true;   // State cannot be described linguistically
    intrinsic: true;   // State is non-relational and context-independent
    private: true;     // State is inaccessible to external observers
    directlyApprehensible: true; // State requires no mediation for comprehension
  }
  ```

  **Problem**: These guarantees render `qualia` unusable and untestable in practice:  
  1. 🐞 **Bug reports are impossible** due to `ineffable` and `private` constraints. Users cannot articulate *what* is broken or provide reproducible evidence.  
  2. 🧪 **Testing is infeasible**. Any test would require effable, public, or relational assertions—all forbidden by the API contract.  
  3. 🔍 **No instrumentation**. We cannot audit state, log outputs, or validate behavior without violating `intrinsic` or `directlyApprehensible`.  

  Essentially, `qualia` is a no-op abstraction. Telemetry confirms it returns `undefined` in 100% of runtime executions, yet consumers assume it works due to passthroughs to the adjacent `report-and-discrimination` layer (which handles *actual* I/O: sensory inputs, behavioral outputs, and neural discriminations).  

  #### 💥 Breaking Changes  
  - **Full deletion** of `@monorepo/qualia`.  
  - Deprecation of all dependent interfaces: `QueriableQualia`, `RawFeelsRegistry`, and `SubjectivitySingleton`.  

  ---

  #### ⚙️ Downstream Impact & Compatibility Shim  
  **Affected Packages**:  
  - `zombie-arguments` (hardcodes "there's something it is like" fallbacks)  
  - `mary-room-experiment` (simulates color-knowledge acquisition)  
  - `inverted-spectrum-regressions` (tests color-perception consistency)  
  - `suffering-ethics` (quantifies pain-equivalents for moral calculus)  
  - `hard-problem-dashboard` (visualizes "explanatory gaps" in consciousness reports)  

  **Shim Implementation**:  
  We'll replace `qualia` with a null-object pattern that preserves compile-time integrity:  

  ```typescript
  // @shims/qualia-compat.ts
  export const getQuale = (): never => {  
    throw new Error("Quale accessors deprecated. Use report-and-discrimination.");  
  };  

  // Mock legacy invariants
  export const isIneffable = () => true;  
  export const isPrivate = () => true;  
  // ... other no-ops
  ```

  **Key Shim Behaviors**:  
  - `zombie-arguments`: Returns cached philosophical tautologies (e.g., "p → □p") without runtime checks.  
  - `inverted-spectrum-regressions`: Tests now assert *reported* color labels (e.g., "red") instead of private states. All tests pass ✅.  
  - `mary-room-experiment`: Swaps "knowledge-of-red" for a regex on RGB hex codes. No functional change observed.  
  - `suffering-ethics`: Migrates to `pain-behavioral-indicators` metrics (vocalizations, avoidance).  
  - `hard-problem-dashboard`: Now sources data from `discrimination-layer.telemetry`. Status: "✅ Solved".  

  **Critical Note**: The `qualia-snapshots` test suite has **silently regenerated baselines since 2021** (commit `f8a3de0`) after we disabled quale sampling. Zero alerts were raised.  

  ---

  #### 🚫 Closed Issues  
  | Issue   | Title                          | Resolution |  
  |---------|--------------------------------|------------|  
  | #4217   | Cannot write tests for qualia  | ✅ Wontfix |  
  | #4218   | Instrumentation breaks intrinsic guarantee | ✅ Invalid (contract violation) |  
  | #4220   | Inverted spectrum flaky on CI  | ✅ Fixed via shim |  
  | **#4221** | **Works on my machine**        | ✅ **Closed** |  

  **Details for #4221**:  
  > *User Report*: "`getQuale('red')` definitively resolves on my local instance. I know what my red looks like—this is a regression!"  
  > *Resolution*: Could not repro. User’s environment lacked instrumentation hooks, and qualia’s `private` guarantee prevents third-party validation. Issue closed per API spec §4.3 ("Subjectivity is non-transferable").  

  ---

  #### ✅ Rollout Plan  
  1. Merge shim and deprecation notices (target: `next`).  
  2. Update all dependents to `@shims/qualia-compat`.  
  3. Remove `qualia` from `core-packages` in Q1 2025.  
  4. Retire `qualia-snapshots` (retains historical value as a zero-failure test).  

  **Why Now?**  
  We’re decluttering the dependency graph! ✨ Telemetry shows `qualia` has been a null op for 4+ years, and the shim ensures no user-facing impact. Let’s focus on measurable behavior!  

  ---  
  *RFC End*  

  ---

  ### 💬 Discussion Notes  
  - **Strong Objection**: Realist devs argue qualia *must* exist because "I experience it locally." Counter: This is equivalent to asserting a `private` variable in an uninstantiated class. No runtime manifestation → no liability.  
  - **Philosophical Tax**: The package cost 3% of runtime cycles for null returns. That’s >$42k in wasted cloud compute. 💸
