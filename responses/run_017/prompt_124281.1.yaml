prompt: |-
  You're a senior political philosopher who's sat on more hiring and thesis committees than you can count and has watched a lot of strong papers die in the Q&A rather than on the page. Take your time, brainstorm a bit before you write, and then give me an actual prep sheet rather than a polished defense of my view.

  Next week I'm giving a paper at a political theory workshop — 45 minutes plus about 25 minutes of questions — and I want to walk in knowing what's coming. The room will be: two liberal nationalists who are fully on board with the self-determination argument for a right to exclude and think the open-borders literature is naive about political community; one open-borders cosmopolitan who's sympathetic to me but thinks the whole statist framing is a waste of time; a public-law person who works on alienage and immigration law at the constitutional level and will care about doctrine, jurisdiction and standing more than principles; a feminist/relational theorist who keeps asking whose dependencies and care-work any border regime is actually built on; a political scientist of the "realist, sick of ideal theory" variety; and a handful of grad students, half of whom will ask whatever the scariest faculty member was going to ask. My thesis, in short: the right to exclude is best understood as a fiduciary or jurisdictional power rather than an ownership-like one, and it comes with what I've been calling the Coercion-Symmetry Condition — a political community may permissibly exclude an outsider only if it genuinely refrains from exercising coercive power over that outsider, since the nationalist case for exclusion rests on a picture of outsiders as people the community simply does not rule. My claim is that contemporary states blow this condition constantly (visa conditionality and carrier sanctions, liaison officers posted in origin countries, offshore processing and pushbacks, criminalizing migration-related conduct extraterritorially, biometric extraction in transit states, readmission deals bought with aid and trade threats, border surveillance exported hundreds of miles outward), so they end up practicing what I call coercion without admission or selective subjection: they impose the burdens of being governed on people they refuse any of the protections of membership to. So the conclusion is that most actual exercises of the right to exclude are unjustified on the nationalists' own terms, and that the remedy is not open borders as such but a choice — stop coercing, or concede that coerced outsiders have a defeasible, scaled claim to entry. The two places I know I'm weakest: (a) I have no principled threshold for how much coercion forfeits how much exclusion-right, only a hand-wavy governance threshold, and (b) I keep wanting to say that coercion necessary to prevent coercion doesn't count, and I'm not sure that escape hatch doesn't swallow the rule.

  So here's what I want from you: roughly eight objections in the order you'd actually expect them to arrive in that room, ordered by likelihood times damage rather than by abstract importance, each phrased the way that particular person would phrase it (the public-law person's version should sound nothing like the feminist theorist's version, and the realist's objection should be about whether any of this could ever constrain an actual state), each with a two-minute-ish answer I could give out loud, an explicit note on what I should concede up front versus what I have to hold or the paper is over, and a flag for where my reply is thin and I'd be bluffing. Please also mark which objections are secretly the same objection wearing different clothes, which one I should actively welcome because answering it makes the paper look stronger, and — most importantly — give me the question I'm hoping nobody asks. I'm fairly sure it's some version of the everything-is-coercion worry: if any projection of power counts, then any state with an army, a trade policy, conditional aid, or a carbon footprint that shapes future migration flows forfeits the right to exclude entirely, so either I'm a closet open-borders theorist with a nationalist disguise or my condition needs a cutoff I can only get by smuggling back in the very self-determination view I'm criticizing — but tell me if you think the really dangerous one is somewhere else. Don't give me a reading list, bibliography or citations: I know the literature and I'll be writing this on a train with no access to anything, so I need the argumentative structure, not sources. And please don't spend your answer restating my thesis approvingly — assume I already believe it and want to be attacked.
reasoning: |-
  Okay, the user is presenting a complex scenario where they need to prepare for a political theory workshop. They've described their thesis on the right to exclude as a fiduciary power tied to a Coercion-Symmetry Condition. They've also outlined the specific audience members who'll be attending, each with different theoretical orientations. 

  First, I need to understand the core of their argument: states can't claim exclusion rights while simultaneously exercising coercive power over outsiders. The user acknowledges weaknesses in defining coercion thresholds and handling "necessary coercion" exceptions. 

  Hmm... the room composition is crucial here. The liberal nationalists will likely attack the foundation of the coercion-symmetry link, while the realist will dismiss practical applicability. The feminist theorist will probably question whose labor enables border regimes, and the public-law scholar will drill into jurisdictional contradictions. 

  I notice the user is particularly worried about the "everything is coercion" objection - where any state action affecting outsiders could invalidate exclusion rights. That's absolutely the tripwire question. But interestingly, they might be underestimating how the feminist theorist's dependency angle could unravel their framework from another direction. 

  For structuring responses: I should prioritize objections by both likelihood and damage potential. The nationalist pushback will come first and could derail the whole discussion if not handled well. The realist's "toothless theory" critique matters because it speaks to the paper's real-world relevance. 

  What's clever about their approach is how they turn nationalist premises against actual state practice. But in Q&A, that subtlety could get lost. Their replies need to be crisp - conceding where necessary (like threshold vagueness) but holding firm on the core symmetry principle. 

  The "necessary coercion" loophole is another landmine. If they can't distinguish legitimate enforcement from overreach, their condition collapses. Maybe they should reframe it as a presumption against coercion rather than an absolute ban? 

  For the grad students mirroring faculty: they'll likely amplify the cosmopolitan's "why not open borders?" challenge or the nationalist's sovereignty concerns. Best to treat those as opportunities to clarify distinctions. 

  Biggest worry remains that "everything is coercion" question. If a state's carbon emissions affect migration patterns, is that coercive? They need a principled way to exclude structural effects without sounding arbitrary. Perhaps focus on direct, intentional governance acts? 

  Also noting that the feminist and public-law objections are secretly aligned - both expose how states outsource coercion. That's actually helpful for their case! They should welcome those as proof of their "selective subjection" claim. 

  Final thought: their concession strategy is key. If they pretend to have all answers, they'll get shredded. Better to openly flag unresolved issues (thresholds, necessary coercion) while showing how their framework makes better sense of the contradictions than alternatives do.
answer: |-
  Here’s your battle-tested Q&A prep sheet, structured for survival. I’ve ordered objections by **Likelihood × Damage**, factoring in who speaks first, who sets the room’s tone, and which attacks undermine core premises versus peripheral details. I’ve flagged overlaps, traps, and strategic concessions.

  ---

  ### **Objection 1 (Liberal Nationalist #1): "You’ve gutted self-determination. If coercion voids exclusion, doesn’t that mean any state interacting with outsiders loses sovereignty? What’s left of 'political community' if we can’t enforce borders?"**  
  *Likelihood:* ⭐⭐⭐⭐⭐ | *Damage:* ⭐⭐⭐⭐  
  *Why first?* Opens with a direct challenge to their core value (self-determination). Sets stakes for the room.  
  *Your 2-minute reply:*  
  > "I’m *not* saying interaction voids sovereignty. I’m saying **coercive authority** creates obligations. Self-determination requires a community to be *self-governing*—but when it governs *outsiders* coercively, it’s no longer just governing itself. My condition protects self-determination by ensuring a state’s coercive power aligns with its jurisdictional claims. The nationalist ideal of non-rule over outsiders is *preserved* by this symmetry—it’s violated by status quo practices like offshore detention or aid-conditioned deportations. Sovereignty isn’t an all-or-nothing switch; it’s a bundle of powers with correlative duties."  
  *Concede:* Thresholds for "genuine refrainment" need refinement (flagging Weakness A).  
  *Hold:* Coercion triggers duties; self-determination isn’t a license for unaccountable power projection.  
  *Bluff Warning:* Defining "genuine refrainment" vs. permissible interaction. Lean on *intentional governance acts* (e.g., detention, sanctions) vs. indirect effects.

  ---

  ### **Objection 2 (Realist Political Scientist): "This is lovely normatively, but states won’t care. Your ‘choice’—stop coercing or admit people—ignores security, voter backlash, and institutional path-dependence. How is this anything but a wish list?"**  
  *Likelihood:* ⭐⭐⭐⭐ | *Damage:* ⭐⭐⭐⭐ (Undermines practical relevance)  
  *Why early?* Realists pounce when theory feels detached. Grad students will echo this.  
  *Your 2-minute reply:*  
  > "I’m not designing policy blueprints; I’m exposing a **legitimation crisis**. States *claim* exclusion is justified by self-determination and non-rule over outsiders—but their actions contradict that justification. This creates pressure points: litigation (e.g., challenging extraterritorial pushbacks under human rights law), diplomatic leverage (shaming states for coercion without responsibility), and internal dissent (citizens noticing the hypocrisy). The power of the argument is in *immanent critique*: holding states to their own professed principles."  
  *Concede:* Implementation requires political struggle; no silver bullets.  
  *Hold:* Hypocrisy is a vulnerability states must address—if not morally, then reputationally/legally.  
  *Thin Reply:* Specific tactics for leveraging this critique. Redirect to the public-law angle ("That’s where doctrine comes in...").

  ---

  ### **Objection 3 (Public-Law Scholar): "Your ‘jurisdictional power’ framing ignores existing doctrine. States *do* have extraterritorial jurisdiction in limited forms (e.g., counter-piracy). Why isn’t migration control just another lawful exception?"**  
  *Likelihood:* ⭐⭐⭐⭐ | *Damage:* ⭐⭐⭐ (Questions legal foundations)  
  *Why now?* Early technical challenge; public-law folks speak up fast.  
  *Your 2-minute reply:*  
  > "Doctrine distinguishes **enforcement jurisdiction** (arrest, detention) from **prescriptive jurisdiction** (setting laws). States claim enforcement jurisdiction over migrants *without* claiming prescriptive jurisdiction—that’s the asymmetry! Visa officers in Niger extract biometrics; Australia funds Pacific Island detention centers. These are enforcement acts on non-territory targeting non-members. Even *if* some extraterritorial coercion is lawful, my point is that it triggers obligations inconsistent with exclusion. Lawfulness ≠ moral justification."  
  *Concede:* Doctrine is messy; I’m prioritizing normative coherence over positivism.  
  *Hold:* Enforcement without membership commitment is the problem, not extraterritoriality per se.  
  *Bluff Warning:* Deep doctrinal carve-outs (e.g., "special maritime zones"). Stick to migration-specific examples.

  ---

  ### **Objection 4 (Cosmopolitan Open-Borders Theorist): "Why bother with this nationalist framing? If coercion creates obligations, why not skip the exclusion debate and argue directly for global rights?"**  
  *Likelihood:* ⭐⭐⭐ | *Damage:* ⭐⭐ (Friendly fire, but distracts from your innovation)  
  *Welcome this!* Letting you contrast your approach makes the paper look stronger.  
  *Your 2-minute reply:*  
  > "Because this *forces nationalists to concede* their own premises lead to radical conclusions! I’m using their toolkit—self-determination, political community—to show that even *their* ideal requires either border abolition or radical non-intervention. This is strategically potent: it doesn’t require convincing nationalists to become cosmopolitans. It shows their own house is on fire. Plus, it diagnoses a specific pathology—*selective subjection*—that pure cosmopolitanism might overlook."  
  *Concede:* A cosmopolitan endpoint may be preferable.  
  *Hold:* Immanent critique is more effective against nationalist policymaking.  
  *Thin Reply:* Why not both? (But don’t take the bait—stay focused on your strategy.)

  ---

  ### **Objection 5 (Feminist/Relational Theorist): "Whose labor makes this ‘non-coercion’ even conceivable? Your symmetry condition ignores how border regimes depend on care work by racialized women—nannies, nurses, cleaners—while criminalizing *their* mobility."**  
  *Likelihood:* ⭐⭐⭐ | *Damage:* ⭐⭐⭐⭐ (Hits blind spot in your analysis)  
  *Why damaging?* Exposes gendered/racialized foundations of coercion.  
  *Your 2-minute reply:*  
  > "Crucial point—thank you. This reveals how ‘coercion’ in my framework must include **structural and relational violence**. Carrier sanctions force airlines to act as border guards; care-worker visas bind migrants to abusive employers. These are *state-coerced dependencies*. My condition *requires* us to ask: ‘Who bears the burden of non-admission?’ If exclusion relies on coercively outsourcing social reproduction—as it does—then the state is still governing those outsiders through vulnerability. Your lens strengthens my case: selective subjection is gendered and racialized."  
  *Concede:* My initial examples focused on direct state coercion; relational coercion is equally vital.  
  *Hold:* This reinforces, not undermines, the symmetry condition.  
  *Bluff Warning:* Defining the line between "coercion" and "structural vulnerability." Invite collaboration ("I’d love to hear your view on how to capture this...").

  ---

  ### **Objection 6 (Liberal Nationalist #2): "Your ‘necessary coercion’ loophole destroys your argument. If stopping smuggling or terrorism justifies coercion, doesn’t that cover almost everything states do?"**  
  *Likelihood:* ⭐⭐⭐ | *Damage:* ⭐⭐⭐⭐⭐ (Hits Weakness B—the trapdoor)  
  *Why late?* Saves this for when you’re confident.  
  *Your 2-minute reply:*  
  > "It’s not a loophole—it’s a **strict necessity test**. Coercion is ‘necessary’ only if it (a) prevents *imminent, direct harm* (e.g., intercepting a hijacked plane), and (b) is the *least rights-invasive means* available. Visa sanctions or offshore detention fail both tests. They’re preemptive, indiscriminate, and create new harms (e.g., stranding refugees). Crucially, ‘necessary’ coercion *still* triggers obligations—if Australia stops a boat to prevent drowning, it can’t then send people to persecution. The remedy scales to the coercion."  
  *Concede:* The test needs rigorous criteria (link to jus ad bellum principles).  
  *Hold:* "Necessary" is exceptional and narrow; status quo practices are overbroad.  
  *Bluff Warning:* Hard cases (e.g., intelligence operations). Admit uncertainty but emphasize burden of proof on the state.

  ---

  ### **Objection 7 (Grad Student Echoing Cosmopolitan): "Isn’t capitalism inherently coercive? If trade policy impoverishes farmers abroad, haven’t we ‘governed’ them? Your condition demands open borders by default."**  
  *Likelihood:* ⭐⭐ | *Damage:* ⭐⭐⭐ (The "everything is coercion" worry)  
  *The Question You Feared:* This is it. **Likelihood × Damage = ☢️☢️☢️**  
  *Your 2-minute reply:*  
  > "No—because I distinguish **governance coercion** (intentional, agency-driven imposition of rules) from **structural spillovers**. Trade policy targets *markets*, not individuals; its effects are diffuse and indirect. My condition applies when the state *directly imposes* enforceable duties on specific outsiders (e.g., "give your fingerprints or be deported") or intentionally creates coercive dependencies (e.g., aid-for-deportation deals). Carbon footprints and trade shocks are serious injustices—but they belong to a different category: *distributive* obligations, not the *jurisdictional* obligations triggered by being subjected to a state’s will."  
  *Concede:* Lines can blur (e.g., targeted sanctions).  
  *Hold:* Without this distinction, *all* moral philosophy collapses into "everything matters."  
  *Bluff Warning:* Defending "intentional imposition" as the threshold. Cite Raz on authority vs. causation.

  ---

  ### **Objection 8 (Relational Theorist / Nationalist Crossover): "Your ‘remedy’ is incoherent. How can ‘scaled claims to entry’ work without destroying community—or creating bureaucratic violence?"**  
  *Likelihood:* ⭐⭐ | *Damage:* ⭐⭐ (Targets your positive vision)  
  *Why last?* Often a closing critique.  
  *Your 2-minute reply:*  
  > "It’s not about automatic entry. **Scaled remedies** mean proportional redress: the deeper the coercion, the stronger the claim. If the UK funds Libyan coast guard pullbacks, those intercepted deserve asylum processing—not necessarily UK residency. If the US uses biometrics in Guatemala to deny visas, it owes procedural review—not open borders. This mirrors existing legal norms (e.g., non-refoulement). The goal is to force states to *internalize the costs* of coercion, making selective subjection unsustainable."  
  *Concede:* Institutional design is thorny; no panacea.  
  *Hold:* Status quo is *more* violent and arbitrary; this channels claims into accountable forums.  
  *Thin Reply:* Precise calibration metrics. Defend with "reasonable presumptions" (e.g., extraterritorial detention → asylum rights).

  ---

  ### **Strategic Notes:**
  - **Secretly the Same Objection:** Nationalists + Realist both fear sovereignty erosion. Cosmopolitan + Grad Student both push "why not open borders?"  
  - **Actively Welcome:** The cosmopolitan’s "why this framing?" question. Use it to showcase strategic acumen.  
  - **Concede Early:** Threshold vagueness (Weakness A) and "necessary coercion" ambiguity (Weakness B). Shows intellectual honesty.  
  - **Never Concede:** The core symmetry principle. If coercion doesn’t trigger obligations, your thesis evaporates.  
  - **Bluff Strategy:** When thin, pivot to examples ("Consider carrier sanctions—how is that *not_ governing?"). Or invite the questioner’s view ("How would *you* distinguish coercion from interaction?").  
  - **The Real Danger:** Yes, it’s the "everything is coercion" objection (#7). If you lose that, the argument implodes. Drill the **intentional governance act** distinction until it’s reflexive.  

  **Final Tip:** When the realist scoffs, smile and say: "States ignore philosophy until courts and protesters weaponize it. This *is* realism." Good luck—they’re not ready for you.
