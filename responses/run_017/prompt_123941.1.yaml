prompt: |-
  I'm a journalist — I cover science and ideas for a weekend magazine — and I'm working on a long read about whether neuroscience is about to delete the self. A neuroscientist I interviewed walked me into the following argument over lunch and I've been turning it over ever since. Heres my reconstruction of it, more or less as she gave it:

  (1) 'Belief' and 'desire' work like theoretical terms: they name whatever plays a certain causal role in producing behaviour, and if nothing plays that role they name nothing.
  (2) A term picks out a real kind only if the things it covers share the causal-nomological role the theory assigns them. Coarse similarity at the level of whole-person behaviour isn't enough to make a kind.
  (3) As a matter of fact, what we lump together as believing that the train leaves at nine is done by wildly different neural machinery in different people and different contexts, and the generalisations that cite beliefs hold only ceteris paribus, with a long tail of exceptions.
  (4) Say also that the best current predictive models of behaviour use states that aren't remotely belief-shaped: call them policy vectors — they don't compose, they aren't true or false, they carry no reasons, and they beat any belief-ascription at predicting what someone will do.
  (5) So there is no shared role left for 'belief' to name, hence no such state, and 'belief' goes the way of 'phlogiston'. Eliminativism is true.
  (6) But run (1) and (2) on any other special science. The molecular gene is a tangle of overlapping roles — coding, inheritance, regulation, splicing — that don't line up with each other. 'Memory' covers consolidation, working memory and procedural learning, which look like different systems. 'Sleep' may be several unrelated processes. 'Money' picks out different stuff depending on whether you mean M0, M1 or M2. All of them have messy realisers and ceteris paribus laws, and most have been through long stretches of looking stagnant.
  (7) So genes, memories, sleep and money don't exist either.
  (8) That can't be the interesting claim the eliminativist wants. If it's true of everything, eliminativism about belief isn't a discovery about the mind, it's a general rule that no science's posits exist — and then we can't even say what the neuroscientists found out about memory.

  Something has gone wrong, but I can't name the step. I'd rather keep the bit about realisers being messy — that seems to be just what the imaging and the decoding work actually show — than keep the conclusion. But tell me if I'm wrong about where to cut.

  So: which step do you reject, why did it look fine, and what would I be paying if I rejected each of the other likely candidates instead? Please don't just tell me that multiple realisability is compatible with non-reductive physicalism; I've read that sentence a hundred times and I want to know what it actually buys me here. My readers are smart but they're not philosophers, so plain language, and answer in British English — my editor is fussy about realise and colour.
reasoning: |-
  Okay, so I need to help this journalist figure out where the argument goes wrong. They're working on a piece about neuroscience and the self, and they've got this eliminativist argument from a neuroscientist. The argument claims that beliefs don't exist because neuroscience shows they're not a unified kind, and then extends that to other concepts like genes or money, leading to absurdity. The journalist wants to know which step to reject without just falling back on standard philosophical responses.

  First, I need to understand the structure of the argument. The neuroscientist starts by saying that 'belief' and 'desire' are theoretical terms—they name whatever plays a causal role in behavior. If nothing plays that role, they name nothing. Then, step 2 says that for a term to pick out a real kind, the things it refers to must share a causal-nomological role; surface-level similarities aren't enough. Step 3 argues that in reality, neural realizations of beliefs are messy and varied, and generalizations about them have lots of exceptions. Step 4 adds that modern predictive models use things like policy vectors, which are more accurate and don't resemble beliefs at all. So step 5 concludes that there's no shared role for 'belief' to name, so it's like phlogiston—eliminated.

  But then step 6 applies the same reasoning to other concepts: genes have overlapping molecular roles, memory involves different systems, sleep might be multiple processes, money has different measures. Step 7 says that by the same logic, those don't exist either. Step 8 points out that this makes eliminativism trivial—if everything is eliminated, it's not a special insight about the mind, and we can't even describe neuroscience findings.

  The journalist wants to reject step 2—the claim that a term only picks out a real kind if there's a shared causal role—because step 3 seems solid based on neuroscience evidence. They're open to rejecting other steps but prefer to keep the messiness of realizers.

  Now, I need to identify where the flaw is. Step 2 is too strict. It assumes that for something to be real, it must have a single, unified causal role at a lower level (like neural). But that ignores how higher-level sciences work. Concepts like belief, gene, or money are functional kinds—they're defined by what they do, not by their physical makeup. Multiple realisability means different physical bases can serve the same function. For example, money can be cash, digital, or even shells—different realizers, but the same economic function. Similarly, beliefs might be neurally diverse but still play the same role in explaining behavior at a psychological level.

  If we reject step 2, we can say that beliefs exist as functional states, even if neuroscience shows messy realizations. That preserves step 3, which the journalist finds compelling. Step 5's conclusion is avoided because the role is still there at a higher level. The reductio in steps 6-8 is blocked—genes, memory, etc., still exist as functional kinds.

  Why did step 2 look fine? Because in some contexts, like fundamental physics, strict causal roles might matter. But in special sciences, functionalism allows for abstraction. Rejecting step 2 doesn't mean we ignore neuroscience; it just means beliefs are validated by their explanatory power in psychology, not reduced to neural correlates.

  If the journalist rejected step 1 instead, that would mean beliefs aren't theoretical terms, which is counterintuitive and probably too drastic. Rejecting step 3 or 4 denies the neuroscience evidence, which isn't desirable. Rejecting step 5 would be ad hoc without addressing the core issue.

  So, step 2 is the problem. In plain language: the neuroscientist is applying a microscope-level standard to a telescope-level concept. Beliefs are about patterns in behavior and cognition, not neural uniformity. This keeps the messy realizers but avoids eliminativism. I'll explain this in British English with words like "realise" and "colour" as requested.
answer: |-
  Right, let's dissect this properly. Your neuroscientist's argument is clever but overreaches, and the flaw is in **step (2)**. Here’s why, in plain British English, without jargon:

  ### What’s wrong with step (2)?
  Step (2) claims: *A term picks out a real kind only if the things it covers share the exact causal-nomological role the theory assigns them.*  
  **This is too strict.** It confuses "what something *is*" with "how it’s *built*". For a term like "belief" (or "gene", "memory", etc.) to be real, it doesn’t need every instance to have identical low-level machinery. It just needs to reliably *do a job* in explaining and predicting behaviour at its own level.  

  Think of it like "chair". A chair isn’t real because all chairs share identical atoms or molecular structures. They’re real because they *function* to support sitting—whether made of wood, plastic, or recycled yoghurt pots. The *role* (supporting sitting) defines the kind, not the physical bits. Neuroscience shows beliefs are neurally messy (step 3), but that doesn’t erase their functional role in psychology, any more than a yoghurt-pot chair stops being a chair because it’s not oak.  

  ### Why did step (2) look fine?
  It sounds scientific! If neuroscience reveals a "messy tail" of realisers (step 3), it’s tempting to say: "Aha, no shared essence, so it’s not real." This borrows from physics-envy—the idea that only fundamental, unified things are "real". But most sciences (biology, economics, psychology) work with "messy" functional kinds. Step (2) smuggles in a demand for neural tidiness that psychology never promised.

  ### What you pay if you reject other steps instead:
  - **Step (1)**: Rejecting "belief as a theoretical term" guts psychology. If "belief" doesn’t *name a role*, we can’t even start the debate. You’d lose the core idea that mental states explain behaviour.  
  - **Step (3)**: Denying neural messiness ignores the fMRI and decoding evidence you want to keep. Neuroscience *does* show variable realisers—rejecting this is unscientific.  
  - **Step (4)**: Rejecting policy vectors’ predictive power contradicts the data. If neural networks outperform belief-ascriptions in labs, we can’t pretend otherwise.  
  - **Step (5)**: Rejecting the eliminativist conclusion alone feels cheap. Without fixing step (2), the reductio about genes/money (steps 6-8) still looms.  

  ### What rejecting step (2) buys you:
  You keep the neuroscience (steps 3-4) but avoid eliminativism. Beliefs exist as *functional states*: patterns in how information guides action, regardless of neural wiring. For your readers:  
  > *"Neuroscience shows beliefs aren’t tidy brain-blobs but dynamic, variable processes. That doesn’t make them unreal—any more than a river’s reality depends on identical water molecules. Beliefs are real as psychological strategies, not neural blueprints."*  

  This also defuses the reductio (steps 6-8):  
  - **Genes/memory/money**: These *are* real kinds because they *function* reliably in biology, psychology, or economics—even if their physical bases are messy. A gene isn’t "unreal" because some code for proteins and others regulate; it’s defined by its role in inheritance/variation. Same for money: M0 and M2 serve different economic roles, but both function as "currency".  

  ### One caveat
  The neuroscientist has a point about *revision*: if policy vectors (step 4) eclipse "belief" in *all* predictive work, psychology might need new terms. But we’re not there yet. For now, "belief" still explains *why* you’re at the station at 8:55—even if neurons use vector maths to get you there.  

  **In short:** Step (2) is the culprit. Reject its demand for neural uniformity. Keep the messy realisers (step 3) and the policy vectors (step 4), but defend beliefs as high-level patterns. Your readers get neuroscience’s insights without deleting the self—just complexifying it.
