answer: |-
  ## Villanelle for the Persistence of A

  Not shape alone declares the alphabet,  
  But stance: no rising stem, no falling tail.  
  A bowl, a stem—no rising, no descent.

  A child’s thick pencil, blunt and confident,  
  Makes "c_t" demand completion without fail.  
  Not shape alone declares the alphabet.

  A punch’s force, a counter’s dark intent,  
  A bowl becomes a curve where light turns pale—  
  *That* bowl, *that* stem—no rising, no descent.

  A broad-nib pen, its angled stroke hell-bent  
  On stress, draws terminals where serifs sail.  
  Not shape alone declares the alphabet.

  A blackletter form, by alien hand lent,  
  Lies undetected—letter-identity frail.  
  A bowl? A stem? No rising, no descent?  
  *(Wrong letter lost where wrong-spirit might prevail.)*

  A bitmap’s seven bars of light, ascendant  
  Yet grounded, holds the x-height without quail—  
  A bowl, a stem—no rising, no descent.

  The caption-size, its aperture near spent,  
  Closes the counter where the text grows pale.  
  Not shape alone declares the alphabet.

  The poster’s cut, its massive curves extent,  
  Keeps counters closed where boldness tells its tale.  
  A bowl, a stem—no rising, no descent.  
  *(Wrong spirit jars where letter-form won't fail.)*

  A closed counter, stem—no rise, no fall—  
  This thick-thin ratio reveals the set.  
  Not shape alone, nor stance, defines the call:  
  What makes an "a" persists beyond the fret  
  Of chisel's edge or pixel's rise and set—  
  It is the slot, the word's demand, and yet,  
  It is the face, the shared traits, what all  
  The drawn a's keep: the thing we cannot state  
  Except by showing how the letters meet.  
  A bowl, a stem—no rising, no descent.  
  This stress, this weight reveals the alphabet.

  ---

  **Form & Argument Embodied:**

  1.  **Structure as Argument:** The villanelle's relentless return of the refrains mirrors the recurrence of 'a' across contexts. Each return, altered by a single word reflecting a *medium* (**chisel's bite**, **broad-nib pen**, **punch's force**, **bitmap's bars**, **child's pencil**, **caption-size**, **poster's cut**, **closed counter/stem**), demonstrates that the core identity ("a bowl, a stem—no rising, no descent"; "Not shape alone declares/reveals the alphabet") persists despite material changes, just like an 'a' persists across fonts. The rhyme survives these changes, reinforcing the core sound/identity.
  2.  **The Refrains:**
      *   **First Refrain (Letter Essence):** "A bowl, a stem—no rising, no descent." It focuses purely on the relational structure: the defining components (bowl, stem) and their crucial position relative to the baseline and x-height (no rising/descent). The slot function is implied in the tercets ("c_t", "word's demand").
      *   **Second Refrain (Spirit):** "Not shape alone declares/reveals the alphabet." It emphasizes that the *specific* execution (stress, weight, terminals, aperture) is what defines the unique character of the whole typeface/script. The change from "declares" to "reveals" reflects a shift in scale/perspective (overall declaration vs. detailed revelation).
  3.  **Word Changes & Invariance:** Each refrain changes by exactly one word per recurrence, shifting the material/tool/scale:
      *   Refrain 1: Starts bare, gains specificity (**child's** pencil, **punch's** force, **bitmap's** bars, **closed** counter/stem).
      *   Refrain 2: "declares" -> "reveals" (scale shift).
      *   The core concept remains identifiable despite these changes. Reconstructing the first version from the last ("closed counter, stem—no rise, no fall") requires recognizing the invariant relational structure.
  4.  **Failures Incorporated:**
      *   **Wrong-Letter (Tercet 4):** "A blackletter form... Lies undetected... A bowl? A stem? No rising, no descent? *(Wrong letter lost where wrong-spirit might prevail.)*" The blackletter 'a' isn't recognized *as* an 'a' at all (wrong letter).
      *   **Wrong-Spirit (Tercet 3 & Implied):** The parentheticals "(Wrong spirit jars where letter-form won't fail.)" and the contrast between the refrains themselves (especially the final quatrain) embody the stylistic clash. A geometric sans 'a' (implied by "Not shape alone...") in an old-style serif text *is* recognized as 'a' (letter correct) but clashes (spirit wrong). The italic single-storey distinction is implied by the core definition requiring two storeys ("bowl, a stem").
  5.  **The Final Quatrain:**
      *   The refrains appear adjacent in their most diverged forms: the letter essence is hyper-specific ("A closed counter, stem—no rise, no fall"), the spirit refrain shifts to concrete detail ("This thick-thin ratio reveals the set").
      *   Resolution is refused: "What makes an 'a' persists beyond the fret... It is the slot... *and* yet, It is the face...". The final lines acknowledge the circularity: the invariant is defined by the collective ("what all / The drawn a's keep: the thing we cannot state / Except by showing how the letters meet").
  6.  **Terminology:** Uses "bowl," "stem," "counter," "x-height," "stress," "weight," "terminals," "aperture," "single-storey" (implied in the core definition requiring bowl + stem), "baseline," "ascender/descender" (implied by rising/descent). Designed to be accurate.
  7.  **Standalone Poem:** Functions as a meditation on persistence, identity, and the relationship between parts and wholes, legible without the prompt. For those familiar with the concepts, the refrains clearly delineate the letter/spirit distinction through their content and evolution. The thesis ("invariance is not sameness of parts") is demonstrated by the changing yet recognizable refrains and the unresolved duality in the quatrain.
