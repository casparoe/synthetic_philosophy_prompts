  ## ALGIASTAT™ (aloxibicin) - Broadcast Commercial

  **[OPEN on SUNLIT BACKYARD. MID-50s MAN, "MARK", calmly grilling. He absentmindedly rests his hand on the hot grill lid. A faint sizzle is heard. He looks down curiously.]**

  **VOICEOVER (Warm, empathetic):** Does the sharp sting of a papercut make you wince? The deep throb of a headache ruin your day? Pain tells us something’s wrong… but does it have to *hurt* so much?

  **[MARK lifts his hand, examining the red mark with detached interest, then continues flipping burgers with his other hand.]**

  **TAGLINE:** **AlgiaStat™: Hear the Signal. Silence the Suffering.**

  **VOICEOVER:** Introducing AlgiaStat, the first and only treatment specifically designed to target the *unpleasantness* of pain – not the message itself.

  **[MONTAGE: Quick cuts]**
  *   **A WOMAN ("SARAH") jogging in a park.** She steps awkwardly, grimaces slightly, checks her ankle, then keeps running with a shrug. *Caption: "Sarah - Living Life".*
  *   **A MAN in a bright home office,** typing rapidly. He pauses, rubs his shoulder, rates it "a four, dull ache" into a recorder, then resumes typing. *Caption: "David - Back on Track".*
  *   **A DENTIST'S CHAIR.** Patient smiles calmly while the dentist probes. *Caption: "Clear Communication".*
  *   **MARK,** now showing his slightly reddened palm to his concerned-looking wife. He smiles reassuringly. *Cut to Mark holding a prescription bottle: AlgiaStat™.*

  **VOICEOVER:** AlgiaStat works uniquely to separate the sensory signal of pain from its distressing emotional and motivational components. You’ll still *feel* the location, the intensity – be it burning, stabbing, or aching – allowing for accurate diagnosis and understanding. What changes? The overwhelming urge to escape it. The dread. The suffering. AlgiaStat lets you hear your body's signal... without the alarm bell.

  **[PATIENT TESTIMONIAL - SARAH]**

  **SARAH (Smiling, relaxed):** "Before AlgiaStat, my arthritis flare-ups meant days on the couch, just miserable. Now? I feel the stiffness, the pressure in my knees – I can tell my doctor exactly what's going on. But that crushing ‘I can’t deal with this’ feeling? Gone. It’s… information. I can acknowledge it and decide what to do. I’m gardening again! My grandkids think I’m superhuman." *[Chuckles]* "I just feel… calmly informed."

  **VOICEOVER:** Important considerations for your safety. AlgiaStat preserves the sensory signal, but temporarily reduces the natural urge to avoid or protect the affected area.

  **[MONTAGE resumes, faster now, slightly more stylized]**
  *   Sarah jogs past a "Wet Floor" sign without breaking stride.
  *   David stretches his back near a precariously stacked box.
  *   Mark reaches towards a steaming pot without hesitation.

  **VOICEOVER:** That’s why AlgiaStat is prescribed *only* with **ProtectiSense™**, our optional Protective Instinct Add-On. ProtectiSense™ gently restores appropriate avoidance behaviors based on the pain signal, *without* reintroducing suffering or urgency. Think of it as smart guidance – preserving safety while maintaining your newfound calm.

  **SARAH:** "My doctor stressed the ProtectiSense™. It’s seamless. I *know* my knee feels strained stepping off a curb, so I take the ramp instead. Simple. Smart safety."

  **VOICEOVER:** AlgiaStat™ with ProtectiSense™. Hear your body. Act wisely. Live fully.

  **[FAST-TALKED SIDE EFFECTS OVER SUNNY SCENES]**

  **ANNOUNCER (Rapid, cheerful):** Side effects may include dry mouth, mild dizziness, temporary changes in taste, constipation, or headache. Some patients report a sense of emotional detachment extending beyond pain perception; report significant mood changes to your doctor. ProtectiSense™ may cause minor hesitation in movement or over-caution in unfamiliar situations. AlgiaStat may interact with certain antidepressants and sedatives. Tell your doctor about all medications.

  **[SCREEN FILLS WITH TEXT: IMPORTANT SAFETY INFORMATION]**

  **VOICEOVER (Serious, slower):** **IMPORTANT SAFETY INFORMATION:** AlgiaStat™ (aloxibicin) is indicated for the management of chronic moderate-to-severe pain where the sensory diagnostic component needs preservation but the affective-motivational component (suffering, urge to escape) is debilitating. AlgiaStat™ DOES NOT eliminate the sensory-discriminative aspect of pain; patients will still feel and can describe sensations. **WARNING: Without ProtectiSense™ or equivalent behavioral therapy, serious injury may occur as patients may not instinctively avoid harmful stimuli despite accurately sensing pain.** Do not use AlgiaStat™ if you have a history of self-harm ideation or profound apathy disorders. AlgiaStat™ may impair judgment related to injury risk assessment. Use caution when driving or operating machinery until you know how AlgiaStat™ and ProtectiSense™ affect you. May cause drowsiness; avoid alcohol. Potential for dependency exists with long-term use. Report new or worsening mood changes, thoughts of self-harm, or lack of concern for personal safety to your doctor immediately. See full Prescribing Information, including Boxed Warning, at AlgiatStat-dot-com.

  **[RETURN TO MARK. He's now sitting comfortably, the faint red mark visible on his hand. He holds up the AlgiaStat™ bottle.]**

  **MARK (Calmly):** "Pain tells a story. AlgiaStat lets me read it… without the fear. Talk to your doctor. See if hearing the signal without the suffering is right for you."

  **VOICEOVER:** Ask your doctor if AlgiaStat™ with ProtectiSense™ is right for your chronic pain. Visit AlgiatStat-dot-com for savings. Download a copay savings card today.*

  **[FINAL SCREEN: AlgiaStat™ and ProtectiSense™ logos. Website. Pharma company logo.]**

  **SUPER:** *Individual savings vary. Restrictions apply. Max savings $75/month. Not valid with government insurance. Offer subject to change/cancellation.
  **FINE PRINT (Bottom, scrolling slowly):** In clinical trials, 12% of AlgiaStat users reported a generalized sense of diminished emotional salience ("Things just don't bother me much anymore, good or bad"). This was not classified as an adverse event as it did not meet thresholds for clinical depression or anhedonia. Users should discuss significant shifts in emotional experience with their healthcare provider. ProtectiSense™ does not restore emotional responses to pain or other stimuli; it restores learned avoidance behaviors only. AlgiaStat™ does not treat the underlying cause of pain.
