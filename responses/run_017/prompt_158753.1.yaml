  Okay, the user is assembling a graduate seminar handout on the semantics of "knows" and needs to break the tie between attributor contextualism and subject-sensitive invariantism. They want two cases where stakes for the subject and attributor context come apart, without begging the question. 

  Hmm, the challenge is designing cases that cleanly dissociate subject-stakes from attributor-standards while keeping evidence fixed. The user explicitly blocks common escapes—no loaded descriptions, no ignorance of stakes, no collapsing justification into reliability. This requires surgical precision.

  First, I need to isolate subject-stakes: Case A must have a subject under high personal stakes while the attributor is in a lax context. But if the attributor is relaxed, why would they even mention knowledge? Ah—idle curiosity scenarios! A colleague asking about weekend plans could work, where the subject has high personal stakes but the query is casual. 

  For Case B, the inverse: subject has trivial stakes (say, a remote historical fact) but the attributor needs precision for high-stakes action. But if the subject isn't involved, how does the attributor's standard shift? The key is making the attributor's context demanding independently—like betting their reputation. 

  *Checks constraints*: Subject awareness of stakes—easy, just make them conscious tradeoffs. Attributor standard as tracking-not-evidence? Tricky. Must frame it as how easily error could undermine the belief, not evidence quantity. 

  *Brainstorms Case A*: Subject deciding whether to take a bus with unreliable brakes when late for a crucial meeting. High stakes for her, but attributor just making chat. Encroachment denies knowledge (risk too high), contextualism allows it (low attributor standards). 

  *Brainstorms Case B*: Subject recalling a minor campus policy change years ago for trivia night. Low stakes for her. But attributor needs it to correct a public plaque—high standards. Contextualism denies knowledge (attributor context strict), encroachment allows it (subject stakes low). 

  *Tests collapse*: If I remove subject-awareness in Case A ("she doesn't realize the bus is dangerous"), encroachment might not trigger—good catch. If I make attributor standards about evidence in Case B ("did she check archives?"), it becomes about justification, not truth-tracking. 

  *Third-variable risk*: Salience! If subject-stakes bleed into attributor context (e.g., attributor knows bus is risky), it collapses. Must firewall contexts. *Checks cases*: In Case A, attributor doesn’t know about the meeting; in Case B, subject unaware of plaque use. Phew. 

  *Defense strategies*: Contextualists might argue subject-stakes only matter when salient to attributor. But in Case A, stakes aren't salient—attributor is oblivious. Encroachment defenders might say attributor standards are just assertion norms. But plaque correction feels like truth-condition pressure. 

  *Conclusion*: Cases hold if we strictly quarantine salience. User’s grad students will have fun tearing this apart—which is exactly the point.
answer: |-
  Below is a handout draft designed to dissociate **subject-sensitive invariantism (SSI)** from **attributor contextualism (AC)**. I'll present two cases, analyze them per your constraints, diagnose potential weaknesses, and outline defensive maneuvers. The core insight: **salience of error possibilities** is the lever that *should* work, but its control is contested.

  ---

  ### **Case Pair: Breaking the Contextualism-Encroachment Tie**

  #### **Fixed Elements Across Cases**
  - **Subject**: Dr. Lena Chen, a geology professor.
  - **Belief**: That the campus limestone building (Old Hall) was constructed in 1912.
  - **Evidence**: Lena recalls verifying this date 5 years ago in the university archives while researching campus history. Her memory is reliable but fallible (she’s human).
  - **Method**: Episodic memory + prior verification. No new evidence gathered since.

  ---

  #### **CASE A: High Subject-Stakes / Lax Attributor-Context**  
  *Structural Feature: Subject’s high practical stakes; attributor’s context free of pressure or salient error possibilities.*  

  Lena is considering renting an apartment in Old Hall. Her lease decision hinges on the building’s age: if built pre-1914, it’s exempt from seismic retrofitting laws and may be unsafe in an earthquake (which she fears). She’s aware of this stake. Her colleague Ben, unaware of her housing plans, idly asks her at a coffee cart: "Hey, wasn’t Old Hall built around 1910-something?" Ben is making small talk; he’ll forget her answer instantly. Lena replies, "Yes, 1912."  

  **Verdicts**:  
  - **SSI (Encroachment)**: Lena **does not know**. Her high personal stakes (safety, lease commitment) raise the epistemic standard *for her*. Her memory, though reliable in low-stakes contexts, isn’t adequate here—a small error risk is unacceptable.  
  - **AC (Contextualism)**: Lena **knows**. Ben’s context is lax: no practical consequences, no salient error possibilities. The truth-condition for "knows" in his context is low.  

  **If Feature Removed**: If Lena’s stakes were low (e.g., she’s not renting), SSI would say she *knows*—collapsing into a standard low-stakes case. If Ben’s context were demanding (e.g., he’s betting $10,000), AC would deny knowledge—collapsing into a high-attributor-stakes case.

  ---

  #### **CASE B: Low Subject-Stakes / Demanding Attributor-Context**  
  *Structural Feature: Subject’s trivial stakes; attributor’s context with salient error possibilities and practical pressure.*  

  Lena is writing a trivia quiz for a department picnic. One question asks when Old Hall was built; she puts "1912." The stakes for her are near-zero (no one cares about picnic trivia). Later, facilities manager Arjun must engrave a plaque for Old Hall’s lobby. Mistaken dates incur public embarrassment and budget cuts. He asks Lena: "You’re sure it’s 1912? Plaques are permanent." Lena, unaware of Arjun’s pressure, says "Yes, 1912."  

  **Verdicts**:  
  - **SSI (Encroachment)**: Lena **knows**. Her stakes are trivial; her evidence is sufficient *for her purposes*.  
  - **AC (Contextualism)**: Lena **does not know**. Arjun’s context makes error possibilities salient (permanent mistakes, budget risks). "Knows" in his context requires ruling out these possibilities—which Lena’s memory doesn’t do.  

  **If Feature Removed**: If Arjun’s context were lax (e.g., he’s asking for a casual chat), AC would say Lena *knows*—collapsing to low-attributor-stakes. If Lena’s stakes were high (e.g., her job depends on the plaque), SSI would deny knowledge—collapsing to high-subject-stakes.

  ---

  ### **Diagnosis: Does This Work?**  
  **Yes, but controversially**. The dissociation holds *if* we accept:  
  1. **Subject-stakes affect knowledge independently of attributor salience** (SSI’s core claim).  
  2. **Attributor context controls semantic standards independently of subject-stakes** (AC’s core claim).  
  3. **Salience of error can be isolated**: In Case A, Ben’s context lacks salience *despite* Lena’s high stakes; in Case B, Arjun’s context has salience *unbeknownst to Lena*.  

  **The Crumbling Point**: **Salience as a third variable**. Critics argue that "stakes for the subject" only matter *when they become salient in the attributor’s context*. If Ben knew Lena’s housing stakes, his context might tighten; if Arjun’s pressures were hidden, his context might not shift. This risks reducing both theories to **salience contextualism**.  

  ---

  ### **How Defenders Would Attack**  
  **SSI Defender vs. Case B**:  
  *Attack*: "Arjun’s demanding context doesn’t affect the *truth* of ‘Lena knows’—only whether it’s *appropriate to assert*. He can’t rely on her testimony because his standards for action are higher, but Lena still knows. AC conflates pragmatics with semantics."  
  *Persuasiveness*: Strong. AC often struggles to distinguish truth-conditions from assertability (see "What is Contextualism?" (2004) debates).  

  **AC Defender vs. Case A**:  
  *Attack*: "Lena’s high stakes *are* relevant to whether she ‘knows’ only if they’re salient in Ben’s context. Since they’re not, Ben speaks truly. SSI’s ‘subject-relative standards’ are incoherent—knowledge is evaluation-relative."  
  *Persuasiveness*: Moderate. SSI can counter that stakes directly affect *epistemic position* (e.g., via Jamesian "urgency" amplifying doubt).  

  **My Judgment**:  
  - The cases succeed *structurally* under each theory’s axioms.  
  - But they expose both views’ vulnerability to **salience collapse**. If subject-stakes must be salient to shift attributor standards (or vice versa), the dissociation fails.  
  - Ultimately, the pair clarifies the debate’s crux: **Is there a stable, non-salience-dependent notion of "practical stakes" for SSI?** If not, AC absorbs encroachment.  

  ---

  ### **Contested vs. Settled**  
  | **Claim** | **Status** | **Notes** |
  |-----------|------------|-----------|
  | Bank cases show context-sensitivity of "knows" | Orthodoxy | Shared datum for AC, SSI, and rivals |
  | AC: "Knows" is context-sensitive (Lewis, DeRose) | Core Commitment | Semantic thesis (disputed by invariantists) |
  | SSI: Knowledge depends on subject’s practical interests (Stanley) | Core Commitment | Extends "relevant alternatives" (Dretske) |
  | AC and SSI are rivals | Contested | Hawthorne, Stanley vs. DeRose; some argue they address different phenomena |
  | Pragmatic encroachment is intelligible | Contested | Rejected by purists (e.g., Fantl/McGrath vs. Ichikawa) |
  | "Salience" can be fixed independently | Contested | Key battleground (see Schaffer’s contrastivism) |

  ---

  **Recommendation for Seminar**: Use this pair *to force the salience issue*. Ask students: "Do Lena’s stakes in Case A affect the truth of Ben’s knowledge attribution *even if he’s oblivious*?" If yes, SSI gains ground; if no, AC prevails. The cases don’t resolve the debate—they escalate it to metaphysics of practical stakes.
