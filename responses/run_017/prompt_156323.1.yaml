prompt: |-
  My grandad died last spring and left a sum of money to be split between me and my two cousins, and for some reason the will says the three of us have to agree on the split unanimously, with me drafting the first proposal. I've been going round in circles on it, and I've slowly realised its not even a disagreement about the facts: we each keep measuring fairness in a different unit. One of us thinks about who'd get the biggest lift in how their life actually feels, one about who has least in the bank, one about what each of us is genuinely able to do with our lives right now. So I want a thought experiment to sharpen it before I put numbers on paper.

  Build me a case with three claimants and one fixed pot, allocated once and never repeated. Ordinary contemporary setting, one paragraph, no melodrama, and two constraints that matter: nobody should be at fault for their situation, and nobody should be in such dire straits that sheer urgency settles it. I want whatever verdict comes out to come out because of the currency, not because one claimant obviously deserves it more.

  The specifications:

  - By welfare — how well a life goes for the person living it, by their own lights — claimant A is worst off.
  - By resources — the external means a person commands — claimant B is worst off.
  - By capabilities — what a person is really able to do and be — claimant C is worst off.

  A clean three-way cycle, same facts held fixed throughout. Then a fourth currency I've been playing with and can't get to behave. Call it detachability: how much of a person's advantage survives the loss of the particular arrangement they currently depend on — the job, the relationship, the city, the one person who makes it work. Someone can be capable but entirely borrowed, or modest and entirely their own. I want the detachability ranking to come out as the exact reverse of the capability ranking. If you think that's not constructible in a single case, say so flatly and give me the nearest thing plus the reason it fails.

  Give it to me as exactly five numbered items, no preamble and no sign-off: 1 the scenario; 2 the three verdicts and why; 3 the detachability verdict and why it flips the capability order; 4 which single feature of the case is doing the work, and what happens to the cycle if you remove that feature; 5 what you'd have me actually propose to my cousins, stated flatly rather than as a menu, with the one consideration that would make you change your mind.
reasoning: |-
  Hmm, the user is dealing with a complex inheritance situation involving three cousins who measure fairness in different "currencies": welfare, resources, and capabilities. They need a thought experiment to clarify how to split the money fairly when each claimant is worst off by a different metric. The user wants this presented in a structured format with specific constraints: no fault, no dire urgency, and a clean cycle where A is worst in welfare, B in resources, and C in capabilities.

  The user also introduced a fourth metric called "detachability" – how well someone's advantages hold up if they lose their current setup – and wants this to reverse the capability ranking. I need to create a scenario that satisfies all these conditions without making any claimant obviously more deserving.

  For the scenario, I'm considering three characters with distinct situations. Claimant A could be someone with chronic pain that limits their enjoyment despite having resources and capabilities. Claimant B might be financially strained due to high living costs but otherwise capable and content. Claimant C could have high potential but be constrained by a demanding family role. This creates the required cycle: A worst in welfare (due to pain), B worst in resources (financially stretched), C worst in capabilities (due to obligations).

  For detachability, I need to reverse the capability order. Since C has high capability but is entirely dependent on their current family setup, they'd score low in detachability. A's welfare is tied to medical care, so medium detachability. B's situation is portable, so high detachability. This flips capability's C>B>A to detachability's B>A>C.

  The key feature making this work is the situational dependency – how tied each person's advantages are to their current context. If removed, the cycle collapses as capabilities might align with resources or welfare.

  For the proposal, I'd suggest dividing equally to avoid favoring one metric over others. I'd only change this if the cousins could agree on which metric matters most. The structure will follow exactly: scenario, three verdicts, detachability analysis, key feature, and proposal – all in five numbered items as requested.
answer: |-
  1.  **Scenario:** Three cousins: A, a moderately successful freelance graphic designer with chronic pain managed by expensive, non-covered treatments, living comfortably but deriving little enjoyment; B, a contented public school teacher in a high-cost city, renting a small apartment, with minimal savings but secure employment and strong local support networks; C, a highly skilled software engineer on extended leave, living rent-free on their terminally ill parent's rural property, providing essential care, with significant earning potential currently unrealized due to this commitment.

  2.  **Verdicts & Why:**
      *   **A (Worst Welfare):** Despite adequate resources and skills (capabilities), A's chronic pain severely diminishes their subjective experience of life ("how life feels").
      *   **B (Worst Resources):** B's income is stretched thin by location costs, leaving minimal disposable income or savings ("least in the bank"), despite reasonable welfare and current capability to perform their job.
      *   **C (Worst Capabilities):** C possesses high skills and potential ("genuinely able to do"), but their current obligation as a primary caregiver severely restricts their actual freedom and ability to pursue opportunities ("what each is able to do right now").

  3.  **Detachability Verdict & Flip:** Detachability ranks **B > A > C** (reverse of Capabilities: C < A < B). **Why it Flips:** Detachability measures resilience to losing the *current specific arrangement*.
      *   **C (Lowest Detachability):** C's entire advantageous situation (housing, purpose) is inseparable from the specific caregiving role and the parent's property. Losing this arrangement (e.g., parent's passing) would dramatically undermine their stability and capacity, despite inherent skills.
      *   **A (Medium Detachability):** A's welfare is heavily dependent on specific medical treatments. Losing their current freelance setup might disrupt access, harming welfare, but their core skills offer *some* fallback for resources/capability.
      *   **B (Highest Detachability):** B's advantages (skills, contentment, support network) are the least tied to one specific job or location. Their teaching skills and network are portable; their welfare stems from disposition and relationships, not a unique external setup. Losing their current apartment or even job would be disruptive but less catastrophic to their core advantages.

  4.  **Key Feature & Removal:** The **situational dependency of advantage** is crucial. C's capability is high but entirely contingent on a fragile, borrowed context. A's welfare depends on a specific (medical) arrangement. B's situation is comparatively self-contained. Remove this dependency (e.g., make C's skills immediately marketable without care duties, make A's treatment universally accessible, make B's resources uniquely tied to their city/school), and the clean cycle collapses. Capability might align with resources (if C is free) or welfare (if A's access is guaranteed), breaking the three-way tension.

  5.  **Proposal & Condition:** Propose an **equal split** of the pot. This explicitly avoids prioritizing one metric (welfare, resources, capabilities) over the others, respecting the fundamental disagreement about the "currency of fairness." It acknowledges the legitimacy of each perspective without declaring one claimant inherently more deserving under the given, non-urgent constraints. **Change only if:** Your cousins unanimously agree *beforehand* on which single metric (Welfare, Resources, or Capabilities) should definitively determine the allocation, overriding the others.
