  ### Scenario: The Office Whistleblower  
  Alex works in a high-stakes finance firm. A close colleague, Taylor, is considering leaking evidence of minor fraud to regulators. Taylor will only share the evidence with Alex if they believe Alex has a *deep-seated commitment to integrity*—someone who would blow the whistle even if it costs them their job. Alex needs Taylor’s evidence to secure a promotion (by strategically controlling the leak’s timing), but knows that actually blowing the whistle later would get them fired. Taylor, a perceptive judge of character, can distinguish between genuine integrity and instrumental posturing by observing Alex’s past actions, emotional reactions to ethical dilemmas, and social cues. If Alex deliberately tries to "become" principled to gain Taylor’s trust, Taylor will detect the ulterior motive and withhold the evidence.  

  ---

  ### Analysis  
  **Why the hitchhiker reasoning applies (and stalls):**  
  1. **Better off with the disposition (Condition 1):** If Alex has the costly integrity disposition, Taylor shares the evidence. Alex gets the promotion (benefit) but risks job loss if they act on the disposition later. The promotion’s career gains outweigh the risk—so Alex is net better off.  
  2. **Clear conflict at the action-moment (Condition 2):** When whistleblowing becomes possible, acting on integrity directly opposes Alex’s self-interest (job loss with no offsetting gain—the promotion is already secured). Rationality demands inaction.  
  3. **Cannot deliberately acquire the disposition (Condition 3):** Alex cannot *decide* to cultivate integrity because Taylor’s trust depends on the disposition’s *provenance*:  
     - Genuine integrity (e.g., upbringing, ingrained values) wins trust.  
     - Integrity adopted as a *tool* to manipulate outcomes (detectable via Alex’s inconsistent behavior, rehearsed rhetoric, or anxious overcompensation) fails.  
     Alex’s only routes—faking sincerity or self-indoctrination—produce "instrumental integrity," which Taylor sees through. Thus, the benefit (evidence access) remains out of reach.  

  **The key feature:** Taylor’s sensitivity to **provenance**—the *source* of the disposition, not just its presence or effects. This blocks deliberate acquisition because any choice to "become" principled is inherently instrumental, corrupting the disposition’s trustworthiness.  

  **Varying the feature:**  
  - **Selector sees only behavior:** If Taylor only cares if Alex *acts* with integrity (e.g., attends ethics seminars), Alex could fake it without inner change. Condition 3 fails—Alex secures the benefit via performance, not disposition.  
  - **Selector sees motives but not source:** If Taylor assesses Alex’s *current* motives (e.g., "Do they *feel* committed?") but ignores how they got there, Alex could self-deceive into temporary "sincere" motives. Condition 3 weakens; self-deception might work.  

  **Strongest reply from your friend:**  
  "Rationality *does* require self-reformation, even here. Alex can’t *directly* choose the disposition but can *indirectly* cultivate it—e.g., by volunteering for ethics audits to foster real habit change. Over time, this builds non-instrumental integrity Taylor would trust. If the timeline is tight, that’s a practical limit, not a failure of rational requirement. The hitchhiker problem proves rationality’s scope includes managing trait formation, not just acts."  

  **The moral for rationality:**  
  Yes—this case suggests rationality governs **diachronic self-governance** more than atomic acts. Alex’s rational failure isn’t at the moment of whistleblowing (where job loss is clearly irrational) but in their past neglect of trait cultivation. If rational agents can foresee such dilemmas, they must non-instrumentally nurture dispositions *before* crises arise. The hitchhiker intuition (rationality may demand self-binding) holds, but its implementation depends on early, indirect character-building—a task squarely within rationality’s purview.  

  ---  
  **Final note:** The scenario avoids desert islands and neuro-prediction by relying on human perceptiveness. Taylor’s judgment emerges from familiarity (e.g., noting Alex’s discomfort when lying) and social norms (trusting "organic" virtue over engineered virtue). This realism forces Alex into a trap: the very act of choosing integrity destroys its value.
