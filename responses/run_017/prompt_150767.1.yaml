answer: |-
  1. Your training pipeline is a sequential distillation chain: each student model gets a private noisy signal (training batch) about the true state (optimal policy/distribution), observes the soft labels of all prior models, and optimizes KL divergence against the teacher's output. The basic result: after enough early models converge on a specific mode, it becomes loss-minimal for successors to ignore their private signal and fully align with the teacher's predictions, inducing irreversible mode collapse.

  2. Maps cleanly: sequential dependency mirrors fine-tuning chains, private signals equate to unique training data slices with inherent noise, observing prior actions is like conditioning on previous model outputs, and rational herding maps directly to KL loss optimization incentivizing imitation over private signal fidelity once the teacher ensemble's soft label distribution becomes "overwhelming".

  3. Temperature herding (observing full softmax): Likely delays but doesn't prevent collapse. Soft labels reveal uncertainty (high entropy/temperature), so early students weight their private signal more heavily, resisting herding longer. But persistent alignment pressure from KL loss still eventually overpowers private signals as the chain lengthens. Curator’s dilemma: This *is* a direct cascade analogue—your quality classifier acts as a later "agent" observing synthetic outputs (prior "actions"), ignoring its own implicit signal about true quality distribution, leading to provenance drift and self-reinforcing filter corruption.

  4. No direct expression for: The externally verifiable "true state of the world" acting as ground truth for signal accuracy, explicit Bayesian updating of beliefs, and the assumption of perfectly rational agents maximizing expected utility based on exact probabilistic inference.

  5. The missing ground truth is a critical blind spot in synthetic data pipelines—we lack an objective anchor, making drift and collapse harder to detect and recover from. The rationality assumption, however, is less crucial; models are *optimized* to imitate via loss minimization, which functionally replicates rational herding even without explicit belief updating.
