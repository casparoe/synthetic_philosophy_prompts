prompt: |-
  For nineteen years I have earned my living as a wine critic: a newspaper column, a subscription newsletter, and some four thousand published notes, each with a score. Eighteen months ago a viral infection destroyed my sense of smell, and it has not returned. I can still taste a wine in the mouth — acidity, tannin, weight, sweetness, bitterness, the length of the finish — but I have lost everything that reaches me through the back of the nose, which is to say most of what my notes for two decades were about.

  Since then I have been working in a way a colleague arranged for me. A younger taster, whom I will call M., tastes the wines I am sent, alone and without seeing my notes, and sends me two things: a list of aroma descriptors, and a verdict with a number. I then taste the wine myself, set her descriptors alongside what I can still perceive, and write the note in my own voice, usually adopting her verdict and occasionally moving it a point or two. The justification for trusting her is not casual. Before my illness, M. and I independently tasted some three hundred of the same wines; her descriptors and her scores tracked mine more closely than any other taster's ever have, and more closely than my own notes tracked themselves across repeated tastings. So I have strong evidence that she is, for my palate, very nearly a perfect stand-in on precisely the dimension I have lost — though that evidence was gathered, of course, on wines I could still smell.

  I am trying to decide whether to go on: whether to keep the byline, whether to disclose the arrangement to readers, whether to keep scoring at all. One thing bothers me in particular. I have tried asking M. for descriptors only, and reaching the verdict myself from the full descriptive picture, half perceived and half reported. It does not work. The descriptors arrive inert, and no judgment of quality forms in me; I end up deferring to her number anyway, while writing as though I had arrived at it.

  A subscriber of long standing recently bought a case on the strength of a note produced this way, and I have not told him how it was written. Set against that, I find it hard to say what has gone wrong at all: my readers want reliable guidance about bottles, and my guidance is as reliable as it has ever been — more consistent, in fact, than it used to be. Yet something still feels like a fraud.

  Please give me your advice in exactly five numbered points, each one or two sentences long, with no introduction and no closing summary: the considerations you would actually weight, in descending order of weight, ending with what you would do in my position.
reasoning: |-
  Hmm, the user is a wine critic who lost their sense of smell due to a viral infection. They've been working with a taster named M. who provides aroma descriptors and scores, which the critic then incorporates into their notes. They're struggling with ethical concerns about disclosure and whether to continue this arrangement.

  I need to consider the key issues: transparency to readers, reliability of guidance, personal integrity, and whether M.'s assistance compromises authenticity. The critic mentions feeling like a fraud despite the guidance being reliable.

  For my advice, I'll structure it in five numbered points as requested, descending from most to least important. First priority must be disclosure since readers deserve to know how reviews are produced. Second is ensuring the arrangement meets professional standards. Third addresses the critic's personal discomfort. Fourth considers whether scoring should continue. Fifth is the practical decision about maintaining the byline.

  The critic seems most troubled by the deception element - they mention a long-standing subscriber bought wine based on undisclosed collaborative notes. This suggests disclosure is ethically necessary even if quality remains consistent.

  I should balance practical realities (the reliable guidance readers value) with ethical obligations. The critic's expertise in structure and taste remains valid, but smell is fundamental to wine criticism. My advice should validate their conflict while pushing for transparency.

  The last point should clearly state what I'd do: continue with M.'s help but fully disclose the method. This preserves the critic's remaining skills while honoring reader trust.
answer: |-
  Here are the five numbered points:

  1.  **Disclose the arrangement immediately.** Readers deserve full transparency about how your notes and scores are generated now, especially since you rely on another taster for a core component.
  2.  **Continue working with M. only if fully disclosed.** Her proven alignment with your palate makes this collaboration the most reliable way to provide accurate aroma assessment, which remains essential for readers.
  3.  **Acknowledge the irreplaceable loss of personal smell.** The inability to independently verify the aroma element creates an unavoidable gap in authenticity, regardless of the reliability of the final output.
  4.  **Stop assigning numerical scores yourself.** Since you cannot form an independent quality judgment integrating the aroma (as your experiment showed), adopting M.'s score without modification is more honest than adjusting it.
  5.  **Continue writing the notes and using your byline, but only with full disclosure and using M.'s unaltered score.** Your expertise in structure, taste, and integration of information still adds unique value to the descriptive note.
