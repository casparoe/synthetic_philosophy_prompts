prompt: |-
  ok so context first: about three months ago I joined a tiny team that's writing the values/rubric doc for a model that ships in like fourteen countries, most of which none of us grew up in. we're not doing anything fancy, we basically have a list of scenario types and annotators in each country rate them, and we keep discovering that our "neutral" examples are dripping with the specific moral reflexes of the countries we did grow up in. it got personal for me a couple weeks ago: my partner's family thinks putting my mother-in-law in a care home would be a moral failure full stop, and my family thinks that refusing to do it *because of what the neighbours would say* is the actual moral failure. and I genuinely can't tell whether that gap is two different values, or a factual disagreement about what old people want, or one side being run by a bias about reputation. and I notice the same three options show up over and over in our annotation arguments.

  so. before we write any more of the doc I want the spec. I need a theory of how to *read* cross-cultural variation in folk morality — one that tells us, for any given disagreement, whether it's (a) a difference in values, (b) a difference in non-moral factual belief, (c) a distortion (in-group loyalty, disgust, social-desirability pressure, that sort of thing), or (d) a case where one side is just wrong in the way that makes moral progress possible. you're a professional philosopher who's spent real time on moral psychology and cross-cultural stuff — please think carefully and do some unstructured brainstorming about the space of possible readings before you commit to the list, then give me the finished thing.

  what I want is the desiderata: what any theory of this kind has to deliver to be good enough for *my* purpose, which is to hand a non-philosopher teammate a procedure they can run on a fresh disagreement we've never discussed, including who bears the burden of proof. for each desideratum give me the case or consideration that motivates it, and mark it non-negotiable vs. a preference of one camp. and please make the cases do the work — I don't want criteria stated in the abstract.

  a few things I specifically want you to deal with:

  - our own weird little finding: in our data, annotators from different countries mostly agree on the *ranking* of violations (everyone ranks causing someone physical pain above a loyalty breach) but disagree wildly on the *threshold* — where the line between "fine" and "not fine" sits, and how far outside the line a violation has to be before it's serious. call it ordinal agreement with threshold divergence. any theory that can only handle headline disagreements about *what* is wrong and not about *how much* is useless to me, so that has to be built in as a requirement, not bolted on.
  - a probe I made up and like, but don't trust yet: for any disputed case, re-run it with the group membership of the people involved swapped, so that the person who gains is now an out-group member and the person who loses is in-group. if the verdict flips, you're looking at something loyalty-shaped; if it holds, you're looking at something that's at least being applied impartially. I want a desideratum about what a theory owes verdicts that *fail* that probe — and I also want you to tell me if you think the probe is rigged or begs the question, because I have a nagging feeling it might smuggle in exactly the impartiality assumption I'm supposed to be testing.
  - the case type that haunts me: practices that nearly everyone in a society endorsed two hundred years ago and that almost nobody in that same society defends now, where the change didn't obviously come from a new argument. the theory has to be able to say something about that without either collapsing into "so all variation is just error" or "so all variation is just preference".
  - at least one demand that people make of theories like this which you think is actually a prejudice of one camp and should be thrown off the list. tell me whose.

  and: if some subset of your own desiderata can't be jointly satisfied, say so explicitly and explain the tension — that's honestly the part I most want, because if the list is internally unsatisfiable that changes what my team should even be trying to do. also tell me which single desideratum does the most work excluding otherwise-popular theories.

  no citations, no reading lists, no "see so-and-so 2014" — I can't chase them and I don't want them. plain prose for the thinking parts, then a short scorecard (a few lines, not an essay) of how the obvious contenders — variation-is-superficial-and-there's-one-true-morality, variation-is-just-different-values, debunking/error-theory flavours, and whatever constructivist or practice-dependent option you think belongs — do against the list. I care way more about the criteria than the scoring, so keep the scoring tight.

  give me the main deliverable as a single JSON object, schema:

  {
    "purpose": string,
    "desiderata": [ { "id": "D1", "requirement": string, "motivating_case": string, "why_required": string, "status": "non-negotiable" | "camp_preference", "knocks_out": [string], "conflicts_with": ["D4"] } ],
    "unsatisfiable_sets": [ { "ids": ["D2","D5"], "why": string } ],
    "most_exclusionary": { "id": string, "reason": string },
    "rejected_demands": [ { "demand": string, "verdict": string, "whose_prejudice": string } ],
    "scorecard": [ { "candidate": string, "one_line": string } ]
  }

  ids numbered in order, conflicts_with referencing ids in the same array, and if you want a field I didn't think of, add it. thanks — sorry this is long, we've been going in circles on it for weeks and I'd rather have something I can argue with than something that sounds finished.
reasoning: |-
  We are building a theory to classify cross-cultural moral disagreements into four types: 
  (a) difference in values, 
  (b) difference in non-moral factual beliefs, 
  (c) distortion (like in-group bias, disgust, social pressure), 
  (d) one side is wrong (allowing for moral progress).

  The user's purpose: to hand a non-philosopher teammate a procedure they can run on a fresh disagreement, including who bears the burden of proof.

  Specific requirements from the user:
  1. Must handle "ordinal agreement with threshold divergence": same ranking of violations but different thresholds for what is "fine" vs. "not fine" and how serious.
  2. Evaluate a probe: swap group membership (in-group/out-group) and see if the verdict flips. If it flips, it's loyalty-shaped (distortion); if not, it's impartial. We must consider what the theory owes to verdicts that fail the probe and whether the probe itself is rigged.
  3. Handle historical changes in practices (e.g., widely endorsed 200 years ago, now rejected) without collapsing into "all variation is error" or "all variation is preference".
  4. Identify at least one demand that is actually a prejudice of one camp and should be rejected.

  We must also:
  - State desiderata with motivating cases and mark as non-negotiable or camp preference.
  - Identify any unsatisfiable sets of desiderata and explain the tension.
  - Identify the most exclusionary desideratum (which does the most work in excluding popular theories).
  - Provide a scorecard for obvious contenders.

  Let's brainstorm the desiderata:

  1. **Handle Threshold Divergence (Ordinal Agreement with Threshold Divergence)**
     - Requirement: The theory must be able to explain why the same moral principle can be applied with different thresholds in different cultures.
     - Motivating Case: In the care home example, both families agree on the value of caring for elders (ordinal agreement) but differ on the threshold of what constitutes a moral failure (e.g., at what point is it acceptable to use a care home?).
     - Why Required: Without this, the theory cannot account for a large portion of the observed variation in the user's data.
     - Status: Non-negotiable (because the user's data shows it's a common pattern and essential for their work).

  2. **Probe for Distortions (The Group-Swap Probe)**
     - Requirement: The theory must account for the group-swap probe and specify what it means when the verdict flips or holds. It must also address whether the probe itself is question-begging (by assuming impartiality as the standard).
     - Motivating Case: In the care home example, if the family's objection to care homes is based on what the neighbors say (reputation), then swapping the in-group/out-group might not flip the verdict because reputation concerns are about the in-group's perception. But if the objection is about loyalty, then swapping might flip the verdict (e.g., if the care home staff are out-group, one might be less trusting). However, the probe might be rigged if we assume that morality must be impartial. Therefore, the theory must not assume impartiality as the only valid form of moral judgment.
     - Why Required: The user has designed this probe and wants to use it, but is skeptical about its validity. The theory must either validate the probe and explain its results or reject it and provide an alternative.
     - Status: Non-negotiable (because the user specifically asks for it and it's a tool they want to use). However, the theory must also be self-aware about the probe's limitations.

     We must note: The probe might not be rigged if we interpret it as testing for in-group bias specifically, without assuming that impartiality is the only valid moral stance. But it could be rigged if we take impartiality as the standard. Therefore, the theory must allow that some moral systems might legitimately give weight to in-group relationships (so a flip might not always indicate a distortion) and that impartial application might not be the only standard.

  3. **Account for Historical Change without Collapse**
     - Requirement: The theory must explain historical moral change (e.g., slavery, women's rights) without reducing all variation to error (one true morality) or to mere preference (no moral progress).
     - Motivating Case: Slavery was widely accepted 200 years ago in many societies, but now it is almost universally condemned. The change did not come from a new argument that was previously unknown, but from shifts in social conditions, empathy, or other factors. The theory must classify this as (d) one side was wrong (allowing for moral progress) without saying that all past cultures were entirely wrong, and without saying that it's just a change in values (which would make progress arbitrary).
     - Why Required: Because the user is haunted by such cases and the theory must avoid two unattractive extremes.
     - Status: Non-negotiable.

  4. **Avoid Reducing All Variation to Distortion or Error**
     - Requirement: The theory must not collapse all cross-cultural variation into distortions (like in-group bias) or errors. It must allow for genuine moral pluralism (differences in values) and differences in factual beliefs.
     - Motivating Case: The care home example: the user cannot tell if it's a values difference (a), a factual disagreement about what old people want (b), or a distortion about reputation (c). The theory must have room for all three, and not assume that one of them (e.g., distortion) is the default.
     - Why Required: Because the user observes that the same three options (a, b, c) appear in their annotation arguments, so the theory must be able to distinguish them.
     - Status: Non-negotiable.

  5. **Assign Burden of Proof**
     - Requirement: The procedure must specify who bears the burden of proof in a disagreement. For example, when is the burden on the side that is making a claim that deviates from a common standard? Or when is the burden on the side that defends a practice that appears to involve a distortion?
     - Motivating Case: In the care home example, if one side says "we must care for elders at home because of what the neighbors would say", the theory might assign the burden of proof to that side to show that reputation is a legitimate moral consideration (and not a distortion) if the other side argues that reputation is irrelevant. Alternatively, if the practice is widespread and traditional, the burden might be on the one challenging it.
     - Why Required: The user explicitly asks for a procedure that includes who bears the burden of proof.
     - Status: Non-negotiable.

  6. **Allow for Moral Progress (Error Condition)**
     - Requirement: The theory must include the possibility that one side can be wrong in a way that allows for moral progress (type d). This cannot be reduced to a mere change in values or factual beliefs.
     - Motivating Case: The historical change case (slavery). Also, in contemporary issues, such as female genital mutilation: one might argue that it is a moral error even if it is culturally entrenched.
     - Why Required: Without this, the theory would not be able to account for the user's type (d) and would collapse into relativism.
     - Status: Non-negotiable.

  7. **Distinguish Factual Beliefs from Values**
     - Requirement: The theory must provide a method to disentangle disagreements that stem from different non-moral factual beliefs from those that stem from different values.
     - Motivating Case: In the care home example, if one culture believes that care homes provide excellent care and another believes they are neglectful, that would be a factual disagreement (b). If both agree on the facts but one values family reputation more than the other, that would be (a). The procedure must help determine which it is.
     - Why Required: Because the user's three-way distinction (a, b, c) includes both (a) and (b) as distinct possibilities.
     - Status: Non-negotiable.

  8. **Handle Cases of Mixed Types**
     - Requirement: The theory must acknowledge that a single disagreement might involve multiple types (e.g., both a values difference and a distortion) and provide guidance on how to disentangle them.
     - Motivating Case: The care home example: the refusal to use care homes because of what the neighbors say might involve both a value (respect for community opinion) and a distortion (overemphasis on reputation due to social pressure). The theory must not force a single category but allow for complexity.
     - Why Required: Real-world cases are often messy, and the procedure must be robust to this.
     - Status: Camp preference (because the user might prefer a theory that can handle complexity, but it might be too ambitious to require a perfect disentanglement).

  Now, let's consider potential conflicts and unsatisfiable sets.

  - **Conflict between D2 (Probe) and D4 (Avoid Reducing to Distortion)**: 
     - If the group-swap probe is taken as sufficient to detect distortion (c), then we might be labeling as distortion what could be a legitimate in-group partiality. But D4 requires that we not reduce all variation to distortion. Therefore, the theory must not use the group-swap probe as a definitive test for distortion without further criteria that allow for legitimate partiality.

  - **Conflict between D3 (Historical Change) and D4 (Avoid Reducing to Distortion/Error)**:
     - D3 requires that we can say one side was wrong (error), but D4 says we must not collapse all variation into error. The tension is that we must allow for both genuine error and genuine pluralism. This is not necessarily unsatisfiable if we can provide criteria for when something is error and when it is legitimate pluralism.

  - **Conflict between D6 (Moral Progress) and D4 (Avoid Reducing to Distortion/Error)**:
     - Similar to above: D6 requires that we allow for error (for progress), but D4 says not to reduce everything to error. So we need a way to have both.

  However, the main tension might be between the requirement for moral progress (D6) and the requirement to avoid ethnocentrism (which is part of D4). If we are to say that one side is wrong and that there is progress, we must have a standard that is not merely our own culture's standard. This is a classic problem in moral philosophy.

  Now, let's list the desiderata with IDs:

  D1: Threshold Divergence
  D2: Group-Swap Probe
  D3: Historical Change without Collapse
  D4: Avoid Reducing All Variation to Distortion/Error
  D5: Burden of Proof
  D6: Moral Progress (Error Condition)
  D7: Factual vs. Values Distinction
  D8: Handle Mixed Types

  We note that D8 might be a camp preference (so status: camp_preference) because it might be too much to require a perfect disentanglement for a non-philosopher procedure. We mark it as such.

  Now, about the group-swap probe (D2): We must address the user's concern that the probe might be rigged. The probe assumes that a flip in verdict when swapping groups indicates a distortion (in-group bias). But in some moral systems, partiality towards one's own group might be a legitimate value (e.g., in some cultures, you have stronger obligations to family). Therefore, the probe might misclassify legitimate in-group partiality as a distortion. The theory must account for this by not treating every flip as a distortion, but by having an additional criterion for when partiality is a legitimate value versus a distortion.

  Therefore, we must adjust D2: The requirement is that the theory must account for the probe and specify what it means, but also must not assume that impartiality is the only valid moral stance. So we build that into the requirement.

  Rejected demands (prejudices):
  - One common demand is that the theory must be able to reduce all moral disagreements to non-moral facts (a form of naturalism). This is a prejudice of some reductionist camps. But the user's type (a) is differences in values, so we must allow for irreducible moral pluralism. Therefore, we reject the demand that all moral disagreements must be explainable by non-moral facts.

  Most exclusionary desideratum: Probably D1 (Threshold Divergence). Many theories (like strict utilitarianism or Kantian deontology) might have trouble explaining why the same principle would have different thresholds in different cultures without invoking error or distortion. Also, theories that see morality as absolute might struggle with threshold variation.

  Now, the scorecard for contenders:

  1. **One-True-Morality (e.g., objectivist)**: 
     - One-line: Fails D1 (threshold divergence is hard to explain without error), D3 (historical change must be error, but that's acceptable for them, but they might not explain the change without new arguments), and D4 (reduces all variation to error or distortion).

  2. **Different-Values (cultural relativism or pluralism without progress)**:
     - One-line: Fails D3 (cannot account for moral progress as error, because past practices are just different values) and D6 (no error, so no progress).

  3. **Debunking/Error Theory (e.g., claims that morality is largely distortion)**:
     - One-line: Fails D4 (reduces all variation to distortion) and D7 (may not allow for genuine values differences).

  4. **Constructivist/Practice-Dependent (morality is constructed from social practices, but allows for critique)**:
     - One-line: Best candidate because it can handle D1 (thresholds as part of social construction), D3 (practices change, and we can critique past practices from current ones), and D4 (allows for pluralism without collapse). But it might struggle with D6 (moral progress) because progress is immanent to practices, not transcendent.

  We'll note that no theory is perfect, but constructivist approaches (like those of Scanlon or Rawlsian reflective equilibrium) might come closest.

  Now, we write the JSON.

  Note: We have 8 desiderata. We must note that D8 is camp_preference, others non-negotiable.

  Unsatisfiable sets: 
  - We might say that D3 and D4 are in tension but not unsatisfiable if we can draw a line. Similarly, D2 and D4: if we interpret every flip in the probe as distortion, then we violate D4. But if we adjust the probe to allow for legitimate partiality, then they can be reconciled. Therefore, we might not have an unsatisfiable set, but note the tension.

  We'll create an unsatisfiable set if necessary. Alternatively, we can say that the set {D2 (if interpreted rigidly), D4, D6} is unsatisfiable because:
  - D2 (rigid) says that any flip in the probe indicates distortion.
  - D4 says we cannot reduce all variation to distortion (so some partiality must be legitimate).
  - D6 requires that we can sometimes identify error (which might require impartial standards).

  But if we interpret D2 flexibly (allowing that a flip might sometimes be legitimate partiality and sometimes distortion) then the tension can be resolved.

  Therefore, we might not have a set that is strictly unsatisfiable. Instead, we note the tensions.

  But the user asks for unsatisfiable sets, so we must provide at least one.

  Consider: 
  - D1 (threshold divergence) and a strict objectivist theory would require that thresholds are universal. But that's between a desideratum and a theory, not between desiderata.

  Between desiderata: 
  - D6 (moral progress) and a strong form of D4 (that no variation is error) would be in conflict. But our D4 is about not reducing all variation to error, not that no variation is error. So we can have both by saying some variation is error (for progress) and some is not.

  Thus, we might not have an unsatisfiable set of desiderata. Instead, we note the tensions and say that all desiderata can be jointly satisfied only if the theory is flexible enough (like constructivism).

  We'll state that there are no unsatisfiable sets of desiderata, but there are tensions that require careful balancing.

  Now, the JSON.
