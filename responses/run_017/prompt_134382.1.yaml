prompt: |-
  I'm clerking at a constitutional court and we've got a franchise case next month, and I'd rather think about the shape of our own record than about what other countries do. Our track record: we upheld compulsory voting with a small abstention fine for citizens 18+ in national elections; we struck that fine as applied to 16- and 17-year-olds in municipal elections while leaving their right to vote standing; we upheld a voting age of 16 for municipal elections but struck it for national ones; we upheld municipal voting for non-citizens with five-plus years' residence but struck it for national elections; we upheld the national vote for citizens who've lived abroad fifteen-plus years; we upheld prisoner voting for sentences under three years and struck it above that; and we upheld letting long-term resident non-citizens vote in a consultative, non-binding national referendum.

  The new bill creates a "long-term resident" status — ten-plus years' residence, pays income tax, liable for jury service, deportable only for serious crimes — and gives holders the vote in national parliamentary elections, with the same fine as citizens. There's a fallback amendment that gives them the vote with no fine attached. What rule are we actually running here: subjection to the state's coercion, full membership of the political community, stakes-plus-contribution, affected interests, or something else I'm not listing? What should we do if we want to be consistent with ourselves, which precedent is the closest analog, and where our precedents genuinely underdetermine it, what principle would we be adopting with each option? Also: which single further case would best pry apart the rules that fit our record? End with \answer{...}, five words or fewer — e.g. \answer{vote yes, strike the fine}.
reasoning: |-
  Okay, the user is a law clerk at a constitutional court dealing with an upcoming franchise case. They've provided a detailed history of their court's precedents on voting rights and now need to analyze a new bill granting national voting rights to long-term residents. 

  First, I need to unpack their court's voting rights jurisprudence. The pattern shows: 
  - Compulsory voting with fines upheld for adult citizens nationally 
  - But struck down for 16-17yo in municipal elections while preserving their right to vote 
  - Age thresholds differentiated between municipal (16+) and national (18+) 
  - Non-citizen voting permitted municipally after 5+ years residence but barred nationally 
  - Prisoner voting allowed under 3-year sentences but prohibited for longer terms 
  - Long-term non-citizens allowed consultative referendum participation 

  The new legislation creates a "long-term resident" category (10+ years residence, taxpaying, jury duty eligibility) granting national votes with citizen-equivalent fines. There's also a fallback no-fine version. 

  The core question is identifying the unifying principle behind these rulings. Let's test their proposed frameworks: 
  - Subjection to coercion: Doesn't fit - prisoners are subjected but disenfranchised over 3 years 
  - Full political membership: Explains citizen/non-citizen distinctions but not age splits 
  - Stakes+contribution: Aligns with taxpaying residents getting local votes but not national 
  - Affected interests: Municipal voting expansion supports this, yet national exclusions contradict 

  Hybrid principle emerges: Voting rights require both community ties and reciprocity of obligations, with tiered access based on governance level proximity. Municipal = lower threshold (5yrs), national = higher (citizenship/15yrs abroad). Fines apply only to obligatory members. 

  For consistency: 
  - Precedent analog is "citizens abroad" ruling (15yrs = deep ties) 
  - Granting national votes to 10yr residents aligns if ties>obligations 
  - But fines? Struck for minors as non-obligatory members → same logic applies here 

  Thus: Uphold voting rights but strike fines for non-citizens (as with minors). Fallback amendment matches this. 

  To clarify principles, a hypothetical case: Permanent residents (green card style) with 20yrs residence barred from jury duty—would they still get votes? If court says yes, it's stakes-based; if no, it's obligation-based. 

  Final answer: Uphold vote, strike fine.
answer: |-
  Based on your court's precedents, the unifying principle appears to be **tiered membership based on community ties and reciprocal obligations**, distinguishing between local/national governance and obligatory vs. non-obligatory participants. Here's the breakdown:

  1.  **Operative Principle:** Voting rights require **demonstrable stake + integration into the community**, with thresholds escalating for national elections. Obligations (like fines) attach only to those deemed *full obligatory members* (citizens 18+ nationally). Non-obligatory participants (minors, certain non-citizens) retain voting rights but cannot be fined. Prisoner disenfranchisement reflects temporary severance from communal obligations based on crime severity.
      *   *Fits Precedents:* Upholds distinctions: citizens (full national rights/fines) vs. minors (municipal vote/no fine) vs. non-citizens (municipal/local stake/no national vote) vs. long-term non-citizens (consultative voice, no fine) vs. prisoners (loss based on breach of obligations).

  2.  **Consistency & Precedent:** The closest analog is your **struck fine for 16/17-year-olds in municipal elections**. Like minors, long-term residents (LTRs) under the bill are integrated participants with voting rights but are *not full obligatory members* of the *national* political community in the way citizens are (citizenship remains the bright line for national compulsory voting). Upholding the *vote* aligns with extending rights based on ties (like municipal non-citizens, citizens abroad). However, applying the *fine* contradicts the minor precedent – LTRs, while integrated, lack the inherent national citizenship obligation triggering compulsion.
      *   **Consistent Action:** Uphold the national vote for LTRs (recognizing deep ties/stake) but **strike the fine** (as they are not obligatory members like citizens). The fallback amendment (vote with no fine) is thus the constitutionally required outcome.

  3.  **Underdetermined Principle Choice:**
      *   **Uphold Vote + Fine:** Adopts "**subjection to state coercion**" (taxes, jury, deportation risk). *Inconsistent:* Your court rejected this for minors despite their subjection.
      *   **Uphold Vote, Strike Fine:** Adopts "**stakes/contribution without full obligatory membership**." *Consistent:* Mirrors minors and consultative non-citizens.
      *   **Strike Vote Entirely:** Adopts "**citizenship as absolute prerequisite for national vote**." *Inconsistent:* Contradicts upholding votes for citizens abroad and allowing consultative non-citizen referendums, showing citizenship isn't always physically required.

  4.  **Prying-Apart Case:** **"Permanent residents (non-citizens) with 20+ years' residence, paying taxes, but *exempt from jury service and non-deportable* seek the national vote."**
      *   This tests whether the core principle is **"subjected to state coercion"** (exempt from jury/deportation weakens this) vs. **"durable stake/integration"** (long residence/taxes support this) vs. **"reciprocity of obligations"** (missing jury service breaks symmetry). Your precedents suggest "stake/integration + reciprocity" is key, making this case pivotal.

  \answer{uphold vote, strike fine}
