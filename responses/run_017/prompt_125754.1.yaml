prompt: |-
  I have been going back and forth with a friend over an argument he uses to defend wavefunction realism, and I have come to think it establishes a good deal more than either of us is willing to accept.

  (1) Call a ψ-surrogate any object in a theory which, together with the Hamiltonian, fixes the probabilities that theory assigns to the outcomes of every possible measurement. Call a theory empirically adequate if it matches the predictions of quantum mechanics to the accuracy to which they have been tested.

  (2) Every empirically adequate theory must contain a ψ-surrogate. The predictions themselves have a structure that cannot be generated without something doing that job, and the constraint comes from the predictions rather than from anyone's choice of notation, so it survives any reformulation of the theory.

  (3) If a quantity is indispensable to every empirically adequate theory in the way just described, then it does not merely encode someone's ignorance; it answers to something in the world. Otherwise the predictive success of the theory would be left unexplained, a coincidence on the scale of a miracle.

  (4) So the wavefunction is ontic, and the psi-epistemic view is false.

  (5) Now run (2) and (3) again elsewhere. Any empirically adequate treatment of a gas must contain a distribution surrogate, a probability density over microstates without which its predictions cannot be stated. It satisfies (3) in exactly the same sense that the ψ-surrogate does.

  (6) So the distribution over microstates is ontic too, and is not an encoding of ignorance about which microstate obtains.

  (7) And the pattern generalises: take any theory and any quantity without which its predictions cannot be stated, and (2) and (3) apply to it. Nothing in any scientific theory represents ignorance, the distinction between psi-ontic and psi-epistemic views is empty, and every view is ontic.

  (8) That cannot be right. A distinction that could not possibly be false is not a distinction worth drawing.

  Of the claims above, I would most like to keep (4) and to reject (6), but I cannot see where the reasoning goes wrong: (2) and (3) each look like ordinary scientific realism, and (5) looks like a genuine parallel rather than a parody. Which step should I give up, why did that step look sound when it is not, and what does giving it up cost me? In particular, is there a way of reaching (4) that does not also reach (7), and if so does it rest on something more specific than indispensability?

  Please write in continuous prose, as you would in an email, with no headings, bullet points, bold text or tables. As you answer, keep separate what is settled among people who work on this from what is genuinely contested, and tell me which of the claims you rely on fall into the second category rather than presenting a contested view as if it were the received one.
reasoning: |-
  Alright, the user presents a sophisticated argument about wavefunction realism and the ontic vs. epistemic status of the wavefunction, extending it to classical statistical mechanics. They want to accept that the wavefunction is ontic (4) but reject that the microstate distribution in statistical mechanics is ontic (6). The challenge is to identify where the reasoning fails without undermining the argument for quantum mechanics.

  First, I need to parse the core steps: (2) claims ψ-surrogates are indispensable for empirical adequacy, (3) argues indispensability implies ontological status. The parallel in (5) applies this to classical distributions, leading to (6) and the problematic generalization in (7). The user feels stuck because (2) and (3) seem like standard scientific realism, and the classical case appears analogous.

  The key is to question whether indispensability for *prediction* necessarily implies ontology. In quantum mechanics, the wavefunction's role is unique—it directly determines probabilities via the Born rule and evolves unitarily. But in classical statistical mechanics, the probability distribution isn't dynamically fundamental; it's a tool for handling ignorance over underlying deterministic microstates. The Hamiltonian alone, with initial microstate, determines evolution. The distribution is epistemic because it represents lack of knowledge, not a physical entity.

  This difference hinges on the *necessity* of the surrogate. In quantum mechanics, even in de Broglie-Bohm, which has particles, the wavefunction is still indispensable for guiding particles and predicting probabilities. However, in classical mechanics, the distribution isn't indispensable; it's a practical substitute when we can't track microstates. The underlying ontology is microstates, and probabilities arise from our ignorance.

  So step (3) might be too strong. Indispensability for prediction doesn't always imply ontology; it depends on the theory's structure. In quantum mechanics, the wavefunction's role is ineliminable in a way that suggests ontology, but in classical stat mech, the distribution is eliminable in principle, pointing to its epistemic nature.

  The user might worry this undermines the argument for (4), but it doesn't. The quantum case has unique features: no hidden variables (under standard interpretations), and the wavefunction's central role in dynamics. Recognizing that indispensability arguments require context-specific analysis resolves the paradox without rejecting scientific realism.

  Contested points: Whether de Broglie-Bohm negates the wavefunction's indispensability (it doesn't). Also, the exact criteria for distinguishing epistemic vs. ontic—this is debated, with alternatives like preparation contextuality. But the structural difference between quantum and classical probability roles is widely acknowledged.
answer: |-
  It’s a sharp argument, and your unease about its implications is well-founded. The core tension lies in whether indispensability for empirical adequacy (steps 2 and 3) entails an *ontic* status (step 4), and why this might hold for quantum mechanics but not for classical statistical mechanics. The flaw isn’t in the general principle of indispensability arguments for scientific realism, but in *how* the surrogate functions within the theory’s structure. Let me unpack this, noting where consensus exists and where philosophers diverge.

  **Where the argument stumbles: The nature of "indispensability"**  
  The critical step is (3): "If a quantity is indispensable to every empirically adequate theory... it answers to something in the world." This is a version of the "indispensability argument" for realism, often associated with Quine-Putnam. While powerful, it conflates two distinct roles a mathematical entity might play:  
  - **Dynamically fundamental**: The entity governs the evolution of physical states (e.g., via fundamental laws).  
  - **Predictively essential**: The entity is required to calculate probabilities or outcomes, but might not represent a physical element *itself*; it could encode ignorance about underlying states.  

  Step (2) correctly notes that a ψ-surrogate is *predictively essential* for any theory matching quantum predictions. Step (3), however, implicitly assumes that predictive indispensability implies *dynamic fundamentality* (and thus ontology). This leap is unsupported. The divergence between quantum and classical statistical mechanics reveals why.

  **Why (4) might hold (quantum mechanics)**  
  In quantum mechanics (QM), the wavefunction (or equivalent) is *dynamically fundamental* in all empirically adequate formulations. Consider:  
  - **Standard QM**: The wavefunction evolves unitarily via the Schrödinger equation; probabilities are derived from it via the Born rule.  
  - **De Broglie-Bohm**: The wavefunction guides particle trajectories; it remains dynamically indispensable.  
  - **Everettian QM**: The wavefunction describes the universal state.  
  - **Collapse theories**: The wavefunction is the object of dynamical collapse.  

  Critically, no empirically adequate quantum theory *eliminates* the wavefunction’s dynamical role in favor of a deeper, wavefunction-free description of individual systems. Even in de Broglie-Bohm, the wavefunction isn’t reducible to particle configurations—it acts on them. This *dynamical indispensability* strengthens the case for its ontic status. While the ontic/epistemic distinction is contested (e.g., due to arguments like preparation contextuality), the structural role of the wavefunction across formulations suggests it’s not *merely* encoding ignorance. This is widely (but not universally) accepted among wavefunction realists and their critics.

  **Why (6) fails (classical statistical mechanics)**  
  In classical statistical mechanics (CSM), the probability distribution over microstates is *predictively essential* but *not dynamically fundamental*. The underlying dynamics are deterministic: a system’s actual microstate evolves via Hamilton’s equations. The distribution:  
  - Is a tool for handling *ignorance* of the exact microstate.  
  - Isn’t part of the fundamental dynamics; it’s a credence function over possible initial conditions.  
  - Could, in principle, be eliminated if we knew the microstate (unlike the wavefunction in QM).  

  Here, the distribution’s indispensability is *epistemic*: it’s necessary because we lack knowledge of the underlying physical state (the microstate), not because it *is* the physical state. Step (5) ignores this asymmetry: while both the ψ-surrogate and the distribution are predictively indispensable, only the former is dynamically fundamental across all formulations. Rejecting (6) doesn’t require abandoning scientific realism; it requires recognizing that predictively essential mathematical objects can represent ignorance when they’re not dynamically fundamental.

  **Why (7) is avoided**  
  The generalization in (7) assumes all predictively indispensable surrogates are ontically equivalent. But the quantum-classical contrast shows this isn’t so. The wavefunction’s role in QM is unique:  
  - It determines probabilities for *incompatible observables* (via non-commutativity), which classical distributions don’t.  
  - Its dynamics (unitary evolution) are irreducible to underlying deterministic trajectories in standard interpretations (unlike CSM, where distributions supervene on microstates).  

  Thus, step (3) must be refined: indispensability *plus* dynamical fundamentality supports an ontic interpretation. Predictive indispensability alone does not. This preserves (4) while blocking (6) and (7).

  **Contested ground and costs**  
  - **Contested**: Whether dynamical fundamentality suffices for ontology. Some (e.g., operationalists) argue that *any* predictive tool, however fundamental-seeming, could be epistemic. Others note that even in QM, interpretations like QBism treat the wavefunction as purely epistemic. Your argument for (4) assumes a realist framework where dynamical fundamentality implies ontology—a view many share but not all accept.  
  - **Cost of rejecting step (3) as stated**: You weaken the generic indispensability argument. If not all predictively indispensable entities are ontic, you need additional criteria (like dynamical role) to justify ontology. This is common in structural realism but requires careful case-by-case analysis.  
  - **Path to (4) without (7)**: Focus on the *specific* dynamical role of the wavefunction in QM:  
    - It generates interference (unlike classical distributions).  
    - It evolves linearly and deterministically, while measurements yield stochastic outcomes.  
    - No hidden-variable theory (without a ψ-surrogate) reproduces QM predictions *and* satisfies locality (per Bell’s theorem).  
  This doesn’t rely *solely* on indispensability but on the wavefunction’s unique, irreducible behavior in the theory’s structure.  

  **Settled vs. contested elements**  
  - **Settled**: The wavefunction is predictively indispensable in all empirically adequate quantum theories.  
  - **Settled**: Classical probability distributions in CSM are epistemic (reflecting ignorance of microstates).  
  - **Contested**: Whether the wavefunction’s indispensability/dynamical role *forces* an ontic interpretation. Psi-epistemic views (e.g., Spekkens’ toy models) still exist but face challenges like the PBR theorem.  
  - **Contested**: Whether "ontic" is binary. Some argue for a spectrum (e.g., wavefunctions could be partially ontic).  

  In short, your instinct to reject (6) is defensible. The flaw is in step (3)’s oversimplification of indispensability. By requiring not just predictive utility but also *irreducible dynamical fundamentality*, you can uphold (4) for quantum mechanics without endorsing (7)’s radical conclusion. This preserves scientific realism while acknowledging that some indispensable tools encode ignorance—when they’re shadows of a deeper, knowable reality. The cost is accepting that indispensability arguments need nuance, but that’s a refinement, not a surrender.
