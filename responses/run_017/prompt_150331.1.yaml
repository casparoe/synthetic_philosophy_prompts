answer: |-
  ### Bongard Problem Design

  **Vocabulary**: Each figure consists of shapes (circle, square, triangle), each with attributes:
  - **Size**: small or large.
  - **Fill**: filled (solid) or outline (hollow).
  - **Relations**: 
    - *Containment*: One shape inside another (e.g., circle inside square).
    - *Touching*: Shapes share a boundary point.
    - *Disjoint*: Shapes do not touch or contain each other.
  - **Constraints**: Maximum of three shapes per figure. All shapes must be explicitly positioned relative to each other (no overlap beyond touching/containment).

  ---

  ### Left Panel (6 figures)  
  1. Large outline square containing a small filled circle.  
  2. Large outline square containing a small filled circle; small outline circle disjoint from square.  
  3. Large outline square containing two small filled circles.  
  4. Large outline square containing a small filled circle and a large filled circle (both inside square).  
  5. Large outline square containing a small filled circle; large outline circle disjoint from square.  
  6. Large outline square containing a small filled circle and a small filled square.  

  ### Right Panel (6 figures)  
  1. Large filled square containing a small filled circle.  
  2. Large outline square (no other shapes).  
  3. Large outline square; small filled circle disjoint from square; large outline triangle disjoint from both.  
  4. Large outline circle containing a small filled circle.  
  5. Large outline triangle containing a large outline square and a small filled circle (circle not in square; both in triangle).  
  6. Large outline square containing a small filled triangle.  

  ---

  ### Rules and Classifications
  **Intended Rule**:  
  *"There is a small filled circle contained in a large outline square."*  
  - **Left**: All figures satisfy (small filled circle inside large outline square).  
  - **Right**: None satisfy:  
    - Fig 1: Square is filled (not outline).  
    - Fig 2: No circle.  
    - Fig 3: Circle not in square.  
    - Fig 4: Square absent.  
    - Fig 5: Circle not in square.  
    - Fig 6: Circle absent.  

  **Shadow Rule**:  
  *"There is a small filled circle and a large outline square, and no triangle is present."*  
  - **Left**: All satisfy (circle and square present; no triangle).  
  - **Right**: None satisfy:  
    - Fig 1: Square not outline (violates "large outline square").  
    - Fig 2: No circle.  
    - Fig 3: Triangle present.  
    - Fig 4: Square absent.  
    - Fig 5: Triangle present.  
    - Fig 6: Circle absent; triangle present.  

  **Agreement**: Both rules classify all 12 figures correctly (Left: rule holds; Right: rule fails).  

  ---

  ### Discriminating Figure  
  **Figure X**:  
  *Large outline square containing a small filled circle; small outline triangle disjoint from square.*  
  - **Intended Rule**: Circle in square → **Left**.  
  - **Shadow Rule**: Triangle present → **Right**.  

  **Explanation**: The rules disagree. Figure X is permitted (3 shapes, valid attributes/relations).  

  ---

  ### Key Feature of Construction  
  **Divergence Mechanism**: The shadow rule uses a *negative global condition* ("no triangle") while the intended rule uses a *positive local relation* (circle contained in square). Both fit the data perfectly in the 12 examples because:  
  - Left panel: No triangles (accidentally avoids violating shadow rule).  
  - Right panel: Triangles appear only when the intended rule fails for other reasons (e.g., circle not in square).  
  **If removed**: If both rules used the same "kind" of property (e.g., both positive local relations), simplicity would likely break the tie (e.g., the intended rule would be shorter). Here, the negative condition creates an equally simple alternative.  

  ---

  ### Simplicity Measure  
  **Metric**: *Number of atomic predicates* (distinct properties/relations) in the rule, ignoring quantifiers.  
  - **Intended Rule (7)**:  
    - `circle` (1), `small` (2), `filled` (3), `square` (4), `large` (5), `outline` (6), `contained-in` (7).  
  - **Shadow Rule (7)**:  
    - `circle` (1), `small` (2), `filled` (3), `square` (4), `large` (5), `outline` (6), `triangle` (7) (in negative: "no triangle").  
  **Result**: Both score **7**. No simpler rule fits the data.  

  ---

  ### Philosophical Defense of the Shadow Rule  
  *"The intended rule is an artifact of human cognitive bias toward spatial relations. The shadow rule—equally simple by predicate count—fits the data identically: every left figure lacks a triangle, and every right figure either lacks the circle/square pair or contains a triangle. This correlation is inductively robust. Simplicity metrics like predicate count or minimal description length do not inherently privilege positive over negative conditions or local over global properties. Without additional constraints (e.g., banning negative predicates, prioritizing containment relations), the shadow rule is equally projectible. To prefer the intended rule is to impose an a priori preference for 'object-in-container' schemas, which is cultural, not rational. The underdetermination persists until new evidence (e.g., a left-panel figure with a triangle) forces revision. Until then, both rules are equally warranted by the evidence."*  

  ---

  ### Resolving the Tie  
  **Force the Intended Rule**: Add a **13th figure** to the left panel:  
  - *Large outline square containing a small filled circle; small outline triangle disjoint from square.*  
    - Intended rule: Holds (circle in square).  
    - Shadow rule: Fails (triangle present).  
  This figure confirms the intended rule and falsifies the shadow rule. Without it, the rules are empirically equivalent.  
  **Alternative**: Restrict admissible rules to *positive relations only* (banning negative conditions like "no triangle"). This privileges human-like reasoning but is stipulative.  

  ---

  ### Conclusion  
  This Bongard problem achieves the goal: two equally simple rules with identical fit to 12 examples but divergent extensions. The shadow rule exploits a negative global condition that is accidentally consistent with the data. It highlights that simplicity (by predicate count) cannot break underdetermination without auxiliary assumptions (e.g., preference for positivity or locality). Rational preference requires either new evidence or prior constraints on "natural" predicates—neither derivable from the data alone.
