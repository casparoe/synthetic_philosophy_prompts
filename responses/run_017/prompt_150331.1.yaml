            6. A large outline square containing a small filled circle and a small filled square.

          Right panel (6 figures):

            1. A large filled square containing a small filled circle.
            2. A large outline square (empty) and no other shapes.
            3. A large outline square, a small filled circle (disjoint from the square, outside), and a large outline triangle (disjoint from both).
            4. A large outline circle containing a small filled circle (and nothing else).
            5. A large outline triangle containing a large outline square and a small filled circle (the circle is inside the triangle but not inside the square).
            6. A large outline square containing a small filled triangle.

          Now, we run through the rules:

            Intended rule: "There is a small filled circle that is inside a large outline square."

            Shadow rule: "There is a small filled circle and a large outline square, and there is no triangle in the figure."

            Classifications:

              Left panel (1-6): all have the circle inside the large outline square -> intended rule holds. And none has a triangle -> shadow rule holds.

              Right panel:
                  R1: has a circle and a square? The square is filled, not outline -> so no large outline square? Therefore, shadow rule: fails (no large outline square). Also, intended: the circle is inside the square? Yes, but the square is filled -> not outline -> intended fails? Actually, intended requires a large outline square -> so the square in R1 is not outline -> intended fails. Shadow rule fails because the square is not outline? Actually, shadow rule requires a large outline square -> absent -> fails.

                  R2: has a large outline square? Yes. But no small filled circle? So intended: fails. Shadow: fails (no circle).

                  R3: has a large outline square? Yes. A small filled circle? Yes. But there is a triangle? Yes -> shadow rule fails. Intended: the circle is not inside the square -> fails.

                  R4: has a large outline circle? But no large outline square? intended: fails (no square). shadow: fails (no square).

                  R5: has a large outline square? Yes (inside the triangle). A small filled circle? Yes (inside the triangle, not in the square). But there is a triangle? Yes -> shadow rule fails. Intended: the circle is not inside the square -> fails.

                  R6: has a large outline square? Yes. But no small filled circle? There is a small filled triangle inside the square. So intended: fails (no circle). Shadow: fails (because there is a triangle? yes, the small filled triangle).

            Therefore, both rules correctly classify the 12 figures.

          Discriminating figure (as above):

              Figure Y: 
                  A large outline square containing a small filled circle, and a small outline triangle (disjoint).

              Intended rule: holds -> left.
              Shadow rule: fails (because of the triangle) -> right.

          This shows the divergence.

          The key feature of the construction is the use of a negative condition (absence of triangles) in the shadow rule. Without that, we couldn't have achieved the same simplicity and the same fit. If we had used a positive condition for the shadow rule, we might have had to add more conditions to get the same fit, which would have increased the simplicity count.

          The paragraph for the shadow rule defender:

          "Both rules are equally simple, each requiring seven atomic predicates. The data set does not contain any figure that has a triangle and also satisfies the intended rule. In fact, every figure in the left panel lacks a triangle, and every figure in the right panel either lacks a triangle (but fails the intended rule for other reasons) or has a triangle. Therefore, the shadow rule is equally supported by the evidence. The intended rule, by ignoring the presence of triangles, is underdetermined: it fails to account for the consistent absence of triangles in the left panel. Without a prior bias against negative conditions, the shadow rule is just as good. To break the tie, we would need a figure that has a triangle and also satisfies the intended rule. But in the absence of such evidence, the shadow rule is a viable alternative."

          This exercise illustrates that simplicity alone, at least as measured by the number of atomic conditions, does not break the underdetermination.

          However, note: human solvers might prefer the intended rule because it is a positive existential and does not require checking every object in the figure (for the absence of triangles). The shadow rule requires a universal scan. This might be a hidden complexity. But our measure did not account for that.

          If we change the simplicity measure to account for quantifier complexity (existential vs universal), then the intended rule (two existentials) might be simpler than the shadow rule (two existentials and a universal negative). But we did not include that in our measure.

          Therefore, we have achieved the goal: two rules that are equally simple by an explicit measure, fit the data, but are extensionally different.

          We present the problem in text:

          Bongard Problem: 

            Left Panel:

              1. A large outline square with a small filled circle inside it.
              2. A large outline square with a small filled circle inside, and a small outline circle outside (disjoint).
              3. A large outline square with two small filled circles inside.
              4. A large outline square with a small filled circle and a large filled circle inside.
              5. A large outline square with a small filled circle inside, and a large outline circle outside (disjoint).
              6. A large outline square with a small filled circle and a small filled square inside.

            Right Panel:

              1. A large filled square with a small filled circle inside.
              2. A large outline square (no other shapes).
              3. A large outline square, a small filled circle (outside the square, disjoint), and a large outline triangle (disjoint from both).
              4. A large outline circle with a small filled circle inside.
              5. A large outline triangle containing a large outline square and a small filled circle (both inside the triangle, but the circle is not inside the square; they are separate inside the triangle).
              6. A large outline square with a small filled triangle inside.

          The student must find a rule that separates the left from the right.

          The intended rule is: there is a small filled circle inside a large outline square.

          The shadow rule is: there is a small filled circle and a large outline square, and no triangle is present.

          Both are equally simple by the count of atomic predicates (7 each).

          And they disagree on a figure that has a small filled circle inside a large outline square and also a triangle (disjoint): the intended rule says left, the shadow rule says right.

          This design works.

          Let me verify the counts for the shadow rule:

            Conditions in the shadow rule:

              (i) There exists an object X: 
                    circle(X) [1], small(X) [2], filled(X) [3]
              (ii) There exists an object Y:
                    square(Y) [4], large(Y) [5], outline(Y) [6]
              (iii) There is no object Z such that triangle(Z) [7]   [we count triangle once?]

            So we count: circle, small, filled, square, large, outline, triangle -> 7.

            The intended rule:

              There exists an object X and an object Y such that:
                    circle(X) [1], small(X) [2], filled(X) [3]
                    square(Y) [4], large(Y) [5], outline(Y) [6]
                    inside(X, Y) [7]

            Also 7.

          So we are good.

