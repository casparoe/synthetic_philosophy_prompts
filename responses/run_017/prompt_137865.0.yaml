prompt: |-
  I'm on the market this year and my job paper is on evidential cooperation in large worlds — the view, roughly, that once you stop modelling a decision problem as a fully specified small world in which my act fixes the outcome, and instead let the agent be uncertain about which situation it's really in (uncertain about the world-model, not just about a state within it), then my own deliberation becomes genuine evidence about what the other agent does, and evidential decision theory starts cooperating in cases where everyone assumed it had to defect. My central case is one I made up, the two cartographers: Ada and Bob are mapping the same valley from opposite ridges, they never meet, they can't communicate, there's no predictor, no shared code, and no common cause either of them can observe, and the payoffs are deliberatly asymmetric — she gets 3 from a completed map and he gets 2, sending a survey party over the pass costs each of them 1 — so nothing about similarity or twinhood can do any work. The only thing linking them is that both are uncertain about the same unmodelled structure, i.e. about which of the candidate world-models is actual, where their own acts are among the things that vary across those models, and I argue that this shared uncertainty is enough to make the probability that the other one sends, conditional on my sending, exceed the probability conditional on my staying, and that this is a real correlation in the grand world rather than a superstition about similarity. I've got a flyout in two weeks and I honestly havent decided whether the argument survives contact with a room that isn't already sympathetic, so I'd really like a proper Q&A prep sheet.

  The room is: a senior game theorist who's basically a micro theorist with a philosophy appointment, thinks in Bayesian games and Harsanyi types and correlated equilibrium, and is going to hear my correlation as a correlation device — an assumption about the environment smuggled in as a norm of choice; two causal decision theorists of the interventionist Bayes-net stripe who will want the graph drawn on the board and will say that if there's a common node in it then their theory gets the same answer and my case is no argument for evidentialism at all; one formal epistemologist who likes evidential decision theory but is a ratificationist sceptic and worries about fixed points that don't exist or aren't unique; a historian of decision theory who will press me hard on whether large world is doing real Savagean work or is just a slogan I hide behind when the small-world approximation gets inconvenient; a junior person working on functional decision theory and program equilibrium who thinks what I'm describing is a special case of their view with worse branding; and one moral philosopher on the committee who will ask, very politely, why any of this is a question about rationality rather than about what kind of agent you'd want to build.

  Can you draft me the prep sheet? Give me the eight or so objections I'll actually get from these people — not the ones I'd get from an online rationalist audience — ordered by how much damage they'd do rather than by how likely they are, each one phrased the way that particular person would put it, in their own vocabulary (correlation device, intervention, ratifiable, knife-edge, measure zero, off the equilibrium path), with a two-minute answer for each and an honest note on where my answer is soft. Tell me what I should concede in the first five minutes before anyone asks anything, tell me which single reply has to land or the paper is basically dead, and tell me which objection is really an older debate wearing a new hat that I should pre-empt on slide two. My talk is 45 plus 20, the case is on slide six, and I've got about two minutes per answer. Also: I have my own guess about the question I'm hoping nobody asks — something about the whole thing being the tickle defence in a trenchcoat, or about cooperation washing out once there are more than two agents, which is awkward given the word large — but I want yours.
reasoning: |-
  Hmm, the user is preparing for a job talk on "evidential cooperation in large worlds," specifically addressing how evidential decision theory (EDT) can lead to cooperation in scenarios where agents are uncertain about the world-model itself. Their central case is the "two cartographers" thought experiment. They need a Q&A prep sheet tailored to specific committee members' likely objections, prioritized by potential damage. 

  The committee composition is very specific: a game theorist, two causal decision theorists (CDTs), a ratificationist EDT skeptic, a decision theory historian, a functional decision theory (FDT) advocate, and a moral philosopher. Each will approach the objection from their specialized lens—correlation devices, causal graphs, ratifiability, Savagean foundations, FDT equivalence, and rationality metaphysics. 

  The user's hidden concern seems to be whether their argument can withstand scrutiny from non-sympathetic audiences, especially regarding whether the "large world" framing is substantive or ad hoc. The unspoken fear might be that their model reduces to the tickle defense (where correlation is explained by unobserved causes) or fails to scale beyond dyadic interactions—which would undermine the "large worlds" branding. 

  For the prep sheet, I'll structure: 
  - **Preemptive concession** (first 5 mins): Acknowledge that CDT dominates under small-world modeling but argue the cartographers case forces confrontation with model uncertainty. This disarms the historian's "slogan" critique early. 
  - **Killer objection** (must land): The game theorist's "smuggled correlation device" challenge. If the committee accepts that the shared uncertainty is a legitimate feature of the grand world (not an arbitrary device), the argument survives; else it collapses into special pleading. The response must emphasize that world-model uncertainty isn't a choice but an epistemic condition. 
  - **High-damage objections**: 
    1. CDT interventionist: "Your correlation implies a latent variable—draw the graph!" Response: Reject the demand for a *causal* graph by distinguishing ontological independence from epistemic entanglement. Soft spot: CDTers may dismiss this as evading. 
    2. FDT advocate: "This is just worse-program-equilibrium." Response: Highlight that FDT requires explicit coding, while cartographers need no mutual modeling. Soft spot: If FDT subsumes it, the novelty claim weakens. 
    3. Ratificationist: "What if no fixed point exists?" Response: Argue that deliberation *is* the ratifier in large worlds. Soft spot: Feels handwavy without formalism. 
  - **Stealth recycled debate**: The historian's "is large world just Savage in disguise?" is really the old "small worlds as normative vs. descriptive" fight. Preempt on slide 2 by quoting Savage on grand-world impracticality. 
  - **User's nightmare question**: Scaling beyond two agents. If "large worlds" can't handle N>2 cooperators, the framing self-undermines. Response: Stress that uncertainty compounds (P(cooperation) decays slower than in small worlds) but concede it needs more work. 

  The moral philosopher's "why is this *rationality*?" question is actually a gift—it lets me pivot to "this is about epistemic humility in decision architecture," which could resonate. 

  Key strategic moves: 
  - Isolate the game theorist's objection as make-or-break. If they nod, others may fold. 
  - Never say "similarity" or "twinning"—the asymmetry in payoffs is the armor against that. 
  - When pressed, admit the model needs refinement but insist the phenomenon is real: "Even if my formalism wobbles, have I convinced you that *something* evidential is happening here?" That might salvage sympathy.
answer: |-
  Below is your Q&A prep sheet, structured for maximum defensive utility against your specific committee. I've prioritized objections by **damage potential** (high to medium), phrased in each questioner's native jargon, with tight 2-minute responses and honest soft-spot assessments. The goal is to neutralize existential threats first.

  ---

  ### **Preemptive Concession (First 5 Minutes)**  
  **Slide 2:** Before introducing the cartographers, explicitly state:  
  > *"This paper does not argue that CDT is *wrong* in small worlds. It argues that *large-world uncertainty* — where agents lack a shared model of how acts map to outcomes — forces a re-evaluation of what constitutes 'rational' evidence. In small worlds, CDT dominates. But when agents are uncertain whether they’re in a world where acts are *ontologically* linked (e.g., by unobserved structures), EDT’s correlation tracking becomes rationally compelling, not superstitious."*  

  **Why:** Disarms the historian’s "slogan" critique and the game theorist’s "smuggled device" accusation by framing large worlds as a distinct epistemic context, not an evasion.

  ---

  ### **The Killer Objection (Must Land This Reply or Paper Dies)**  
  **Objector:** Senior Game Theorist  
  **Question:** *"You’re smuggling in a correlation device through shared uncertainty. In Bayesian game terms, your ‘large world’ is just a Harsanyi type space where types are correlated by a common prior over world-models. But that’s a *design choice* — it’s not a norm of rationality. If I bake in correlation via the type space, CDT with correlated equilibrium *also* gets cooperation. Your ‘evidentialism’ is just environmental noise."*  

  **Your 2-Minute Response:**  
  > "Respectfully, the correlation isn’t *in the type space* — it’s in the agent’s *epistemic state*. In standard correlated equilibrium, the device (e.g., a coin flip) is part of the *small-world model*. Here, Ada and Bob lack any such device. Their uncertainty isn’t about types *within* a model; it’s about which model *is actual*, including models where their acts are entangled by unobserved dynamics (e.g., terrain difficulty affecting both). CDT treats this as ‘noise’ to intervene away. But when the *set of possible worlds* includes ones where your act is evidence of a shared latent structure (e.g., ‘valleys where sending parties is mutually advantageous’), conditioning on your act *is* rational. It’s not a device; it’s ignorance of the true causal graph."  

  **Soft Spot:** If they counter that Harsanyi types *can* model this via "meta-types," you’ll need to argue that this reduces rationality to model-specification — which large-world EDT avoids. Concede that formalizing the distinction is work-in-progress.

  ---

  ### **High-Damage Objections (Prioritize These)**  
  1. **Interventionist CDT Advocate (Bayes-nets focus)**  
     **Question:** *"Draw the causal graph. If there’s a correlation between Ada and Bob’s acts, there *must* be a latent common cause L (e.g., ‘valley cooperativeness’). Conditioning on L screens off the correlation. CDT then recommends cooperating iff E[U|do(send), L] > E[U|do(stay), L]. Your ‘evidential correlation’ is just unmeasured confounding — but CDT handles this!"*  
     **Response:**  
     > "I agree L exists in the grand world. But *Ada doesn’t know L*. In large worlds, agents lack access to the full DAG. All they have are probabilities over coarse world-models (e.g., ‘Model A: sending is costly but map-completing’). When Ada’s conditional P(Bob sends | Ada sends) > P(Bob sends | Ada stays), it’s not because she sees L — it’s because *in the worlds where sending is rational for her*, it’s likelier that Bob faces incentives to send too. CDT’s *do*-operator ignores this link because it assumes a fixed causal graph. But with graph uncertainty, *seeing your own choice* updates which graph you’re in."  
     **Soft Spot:** They may retort: "Then L is a node — intervene on it!" This risks a stalemate. Stress that *identifying* L requires a small-world model Ada lacks.

  2. **Ratificationist EDT Sceptic**  
     **Question:** *"Your EDT agents aren’t ratifiable. Suppose Ada computes that sending is EDT-optimal given her beliefs. But if she believes Bob is identical, she must consider: ‘If I *were* to stay, would that make staying optimal?’ But if she *were* to stay, P(Bob sends) drops, so staying *becomes* optimal — a non-ratifiable fixed point. Why isn’t this a death knell?"*  
     **Response:**  
     > "Ratification fails here because Ada isn’t uncertain about her *own* decision — she’s uncertain about the *world*. In large worlds, the question isn’t ‘What if I *decided* differently?’ (which triggers a belief shift), but ‘What if the world *were* such that I *do* differently?’ The latter is causal, not evidential. My account doesn’t assume Ada thinks Bob is identical; she just shares his uncertainty about which game they’re playing. The correlation arises from shared evidence about the world, not mutual mimicry."  
     **Soft Spot:** If they press: "But your probabilities *depend on your decision*," concede this needs more formalism to avoid bootstrapping. Offer to sketch a ratification-compatible variant post-talk.

  3. **Functional Decision Theorist (FDT/Program Eq.)**  
     **Question:** *"This is just program equilibrium without the code. In FDT, Ada cooperates iff her decision algorithm is *logically entangled* with Bob’s. Your ‘shared uncertainty’ is a vague proxy for this. But without explicit algorithmic reasoning, you get the same result with worse foundations. Why not adopt FDT and drop EDT?"*  
     **Response:**  
     > "FDT requires agents to model each other as algorithms — a small-world move. The cartographers *don’t* do this; they have no concept of Bob’s ‘code’. The correlation emerges purely from *empirical uncertainty*: ‘In worlds where my geology makes sending smart, his geology likely does too.’ EDT captures this without requiring Ada to think about Bob’s decision theory. It’s *evidence*, not logical dependency, that drives cooperation — which is why it works with no mutual modeling."  
     **Soft Spot:** If they argue FDT subsumes this via "world-models as programs," you’ll need to insist on the distinction between *epistemic* and *logical* uncertainty.

  ---

  ### **Medium-Damage Objections**  
  4. **Historian of Decision Theory**  
     **Question:** *"Savage’s ‘grand world’ is just the set of all conceivable states; we *always* use small worlds for tractability. Your ‘large world’ seems to be ‘whatever lets EDT win’ — isn’t this ad hoc?"*  
     **Response:**  
     > "Savage treated grand worlds as impractical, but *possible*. My point is that when small-world approximations obscure *structural uncertainty* (e.g., ‘What game am I playing?’), EDT’s conditioning recovers insights CDT misses. The cartographers show a clean case where small-world CDT says ‘defect’ (no visible links), but large-world EDT says ‘cooperate’ — and EDT is *right* because the uncertainty is real. It’s not arbitrary; it’s a response to *known* gaps in the model."  
     **Soft Spot:** They may see this as "Savage with extra steps." Emphasize that Savage ignored *act-dependent* world uncertainty.

  5. **Moral Philosopher**  
     **Question:** *"Why call this ‘rationality’? It sounds like you’re describing *adaptive* agents in complex environments. But rationality is about justification. If I ‘cooperate’ because my uncertainty correlates me with Bob, is that a norm, or just how evolution wired me?"*  
     **Response:**  
     > "It’s epistemic rationality: *Given* that my choice is evidence about the world, ignoring it would be irrational. If I know P(cancer | smoking) > P(cancer), I don’t smoke — even without knowing the causal path. Here, P(Bob sends | I send) > P(Bob sends | I stay) *and* sending maximizes expected utility *given that correlation*. Ignoring it is like ignoring smoking-cancer stats because ‘correlation isn’t causation’."  
     **Soft Spot:** They may argue this reduces rationality to instrumentalism. Cite Joyce ("Why We Still Need CDT") on evidence-tracking as normative.

  ---

  ### **The Nightmare Question You Hope Nobody Asks**  
  **Likely Asker:** CDT Advocate or Game Theorist  
  **Question:** *"Isn’t this just the tickle defence? You posit unobserved common causes (e.g., ‘valley cooperativeness’) to explain correlation. But then, in a large population, P(others cooperate | I cooperate) should *decrease* because my act is weak evidence compared to base rates. Your 2-agent case is knife-edge — scale it to 100 cartographers, and EDT defects."*  

  **Why It’s Deadly:** It attacks "large worlds" as non-scalable and exposes your case as parasitic on dyadic correlation.  

  **Your 2-Minute Response:**  
  > "The tickle defence assumes a *known* common cause (e.g., a gene causing both smoking and cancer). Here, the ‘cause’ isn’t fixed — it’s *which world-model is actual*. With N agents, P(others cooperate | I cooperate) *could* stay high if my act updates the likelihood of world-models where cooperation is *generally* advantageous (e.g., ‘easy valleys’). But yes, in some priors, it decays. This isn’t a bug: it reflects that evidence gets diluted in crowds. Still, in *some* large-world problems (e.g., climate action where my act suggests global incentives), EDT still cooperates when CDT doesn’t. The cartographers are a minimal case, not the only case."  

  **Soft Spot:** If they demand math for N>2, admit it’s future work but argue the *principle* holds.

  ---

  ### **Strategic Summary**  
  - **Preempt Early:** Concede CDT’s small-world dominance on slide 2.  
  - **Killer Reply Focus:** Drill the game theorist’s "correlation device" objection. If they’re unconvinced, the paper sinks.  
  - **Stealth Old Debate:** The historian’s "Savagean work" question is really the 1970s "small worlds as normative" fight. Preempt by citing Savage’s own doubts about grand-world approximations.  
  - **Win Conditions:** Get the game theorist to nod at "epistemic state vs. type space"; get the moral philosopher to see evidence-tracking as normative.  
  - **Abandon If Pressed:** Don’t fight the FDT advocate on their turf ("just worse branding"). Stress *no mutual modeling required*.  

  Good luck — your case is clever, but the room is landmines. Focus on the cartographers as a *clean test* for large-world rationality, not a general solution.  

  *Final note: Your nightmare question above is the one I'd fear most. If it drops, pivot to "This shows why we need new large-world tools" — reframe as a research agenda.*
