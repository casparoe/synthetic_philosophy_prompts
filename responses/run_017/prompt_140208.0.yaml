answer: |-
  The weight of the day settled in my lower back as Anya Petrova sat down. Not the usual slump of regret, but a rigid defiance. Her file, thin and newly minted, stated the common delusion: *Patient asserts literal identity with perceived modal counterpart. Seeks confirmation, not treatment.*

  "Ms. Petrova," I began, the worn leather of my chair sighing beneath me. "Welcome. You understand our purpose?"

  "I understand what you *say* you do," she corrected, her gaze level, challenging. Her hands, resting on the steel arms of the visitor's chair, were strong, pianist’s fingers, though the nails were bitten raw. "You sever connections. You make people less… *themselves*… so they stop hurting. But I don’t want to be less. I want to know."

  "Know what, precisely?" I kept my tone neutral, clinical. The doctrine was clear: No one is ever in more than one world. Counterparts are resemblances, context-bound, degrees of similarity shifting with circumstance. Identity is here, singular. Regret is a parasite feeding on phantom limbs.

  "If she is *me*." The words were sharp, decisive. "The woman who didn't walk away from the conservatory audition. The one who didn't let fear choke her voice. Is she *Anya Petrova*, somewhere, living that life? Or is she just… some lucky stranger who looks a bit like me?"

  Here it was. The fault line. For Anya, identity was an essential core, a unique ‘I’ that could inhabit different paths, its properties varying across possibilities but the *self* persisting. For us, for the clinic, there was only the mosaic of traits, experiences, and relations that constituted *this* Anya Petrova. The ‘other’ was a constellation of similarities, perhaps striking, perhaps painful, but fundamentally *other*. The resemblance wasn’t proof of shared identity; it was the raw material we manipulated to dissolve the pain.

  "The clinic doesn't deal in metaphysical certainties, Ms. Petrova," I said, shifting slightly. The air hummed with the low thrum of the Resonance Scanners in the adjacent assessment room – devices that didn't peer into other worlds but measured the *intensity* of perceived resemblance based on neural patterns and biographical triggers. "We deal with alleviating suffering caused by unproductive thoughts about unrealized possibilities."

  "She *is* real," Anya insisted, leaning forward. "I *feel* her. When I hear Sokolov play Rachmaninoff… it's not envy. It's recognition. Like hearing my own heartbeat from across a room."

  "That feeling," I said gently, "is the echo of resemblance. A powerful one, granted. But resemblance is a spectrum, not a bridge." I tapped the thin file. "Our preliminary assessment suggests a high initial resemblance index in the domain of musical aptitude and aspiration. That’s where the regret anchors itself."

  She flinched almost imperceptibly at the word "index," at the quantification of her soul-deep conviction. "So you measure it? Like blood pressure?"

  "In a manner of speaking. We assess the salience of specific traits and memories tied to the regret narrative. The perceived counterpart’s ‘happiness’ is contingent on possessing those traits *in that specific context*." I gestured towards the scanner room door. "We can show you the data. The resemblance isn't static. It fluctuates with what's emotionally at stake for *you*."

  "I don't care about your graphs," she snapped, but a flicker of uncertainty crossed her face. The doctrine was insidious; it didn't attack belief head-on, it eroded the ground beneath it. "I need an answer. Not treatment. Tell me: Is she *me*? Am I fragmented? Or am I just… here? Trapped?"

  The unspoken weight in the room thickened. This was the precipice. The clinic’s answer was implicit in its existence: *You are just here. The other is a fiction woven from similarity and longing.* But saying it outright was forbidden, counterproductive. Faith in the process – or at least, resigned acceptance – was the required currency.

  "The procedure offers peace, Ms. Petrova," I said, my voice carefully devoid of inflection. "A peace grounded in the acceptance of singularity. We thin the resemblance, carefully, surgically. The counterpart becomes… distant. A character in a story you no longer feel compelled to read. Their fortune ceases to be yours to mourn."

  "And the cost?" Her voice was a whisper now.

  "Payment is made in properties," I stated, the clinical term deliberately sterile. "Traits, skills, memories – the very threads of resemblance that bind you to this phantom. What we remove diminishes the perceived connection. Standard procedure."

  She looked down at her hands, the pianist’s hands. "What would you take? To make me stop feeling… her?"

  "The initial recommendation," I said, consulting the file though I knew the answer, "targets the most salient anchor: your manual dexterity and procedural memory related to advanced piano performance."

  Her head snapped up, eyes wide with horror. "My hands? You’d cripple my hands?"

  "Not cripple," I corrected, though the distinction felt hollow even to me. "Diminish. The neural pathways would remain accessible for basic function, but the refined motor skills, the nuanced touch required for concert-level play… those would fade. It’s a targeted erosion. The counterpart’s virtuosity would cease to feel like *your* lost potential. It would belong to someone fundamentally different." I paused, watching the struggle play out on her face. "It’s a common starting point for musicians."

  The silence stretched. The hum of the scanners seemed louder. Anya closed her eyes, a single tear tracing a path down her cheek. She saw the logic, the brutal economy of it. To stop the pain of seeing ‘herself’ succeed where she failed, she had to make it impossible for that ‘self’ to be her. She had to become someone who *couldn’t* have succeeded. She had to pay with the very thing she regretted losing.

  "Do it," she breathed, the defiance gone, replaced by a crushing weariness. Not acceptance, but surrender to the only option presented.

  The procedure itself was swift, almost anti-climactic. Non-invasive neural modulation guided by the resonance data. Anya sat in the scanner chair, electrodes mapping the fiery pathways connecting her to the ghost of her musical self. I initiated the sequence. A low pulse, a sigh from the machine. She gasped, fingers twitching involuntarily on the armrests.

  Afterwards, in the quiet recovery room, she looked at her hands. Flexed them. They moved. But the subtle, ready tension was gone, replaced by a faint clumsiness, a disconnect between intention and execution she’d never known. She tried to mimic a scale motion in the air. It was stiff, approximate. The ghost of fluency haunted the movement, emphasizing its absence.

  "The resemblance index?" I asked the technician quietly, looking at the fresh readout.

  "Significantly reduced in the target domain," he confirmed. "Well within acceptable parameters."

  Anya looked up at me, her eyes hollow. The fierce certainty was extinguished, replaced by a profound, unsettling quiet. The pain wasn't gone; it had mutated into a different kind of ache, the ache of something precious deliberately broken.

  "Now," she said, her voice devoid of inflection. "Now that I’m less… that I can never be her… answer me. Clinician to patient. Is she me? Was she ever?"

  The question hung in the sterile air. Doctrine screamed the answer: *No. She was always only a resemblance, now successfully thinned. You are here, singular.* My lips parted to form the words, the sanctioned reassurance.

  But I looked at her hands. At the deliberate wound inflicted in the name of peace. At the cost extracted to make the answer *true enough* for the clinic’s purposes. Was the resemblance truly objective, or were we just hacking the perception until it fit our model? Was the ‘fact of the matter’ simply what remained after we’d charged our fee?

  I met her gaze. The expectation there wasn’t hope; it was a demand for honesty in the ruins. I opened my mouth. Closed it. Doctrine warred with the chilling simplicity of the act we’d just performed – an act that felt less like healing and more like a metaphysical bribe.

  Instead of words, I reached into the pocket of my white coat. My fingers closed around the cold, smooth metal. I pulled out the small, perfectly weighted A440 tuning fork – a tool, a symbol, a piece of the world she’d paid to distance herself from. I hadn’t planned this. It was a violation of protocol.

  I placed it gently on the cold steel table beside her damaged hand. The clear, pure tone it would produce was now, for her, just a sound. A stranger’s skill.

  "Your resemblance index is diminished, Ms. Petrova," I said, my voice steady, betraying nothing of the churning beneath. "The procedure is complete." I turned and walked towards the door, leaving the unasked question resonating in the silence, unanswered, the tuning fork glinting dully under the fluorescent lights. The only certainty was the cost she’d paid, and the chilling ambiguity of what, precisely, it had bought.
