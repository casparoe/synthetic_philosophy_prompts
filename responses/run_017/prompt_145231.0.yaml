  3. Swap: **8** (Treatment differences travel, but some somatic cues resist swapping).  
  4. Looping: **9** (Classification alters life outcomes → reinforces boundaries).  
  5. Outsider: **2** (Physical/behavioral clusters weakly visible, but not *racial categories*).  
  → Headline: **88**  

  **Woman/Man (gender)**  
  1. Attitude: **10** (Entirely defined by norms/identity).  
  2. Desert Island: **0** (No society → no gender).  
  3. Swap: **9** (Social treatment defines roles; biology doesn’t constrain swapping).  
  4. Looping: **10** (Classification instantly alters perception/behavior).  
  5. Outsider: **1** (Minimal biological correlates; partition is chaotic).  
  → Headline: **92**  

  **Married**  
  1. Attitude: **10** (Requires legal/social recognition).  
  2. Desert Island: **0** (No institutions → no marriage).  
  3. Swap: **7** (Benefits/roles travel, but legal status anchors some differences).  
  4. Looping: **7** (Status changes behavior, but slowly).  
  5. Outsider: **0** (Invisible without cultural knowledge).  
  → Headline: **82**  

  **Major Depressive Disorder (DSM)**  
  1. Attitude: **8** (Symptoms real, but thresholds/grouping are consensus-based).  
  2. Desert Island: **5** (Distress exists, but not *as disorder* without framework).  
  3. Swap: **6** (Treatment access alters outcomes, but biology limits swapping).  
  4. Looping: **9** (Diagnosis changes self-perception/treatment → reshapes symptoms).  
  5. Outsider: **6** (Symptom clusters detectable, but boundaries fuzzy).  
  → Headline: **73**  

  **Recession**  
  1. Attitude: **10** (Defined by collective judgment of decline).  
  2. Desert Island: **0** (No economy → no recession).  
  3. Swap: **9** (Economic policies/expectations define it; swapping redraws boundaries).  
  4. Looping: **10** (Belief → panic → actual economic contraction).  
  5. Outsider: **0** (Invisible without economic concepts).  
  → Headline: **97**  

  **Threks (t0)**  
  1. Attitude: **9** (Founded on lottery/beliefs; blood test irrelevant).  
  2. Desert Island: **0** (No lottery → no threks).  
  3. Swap: **10** (Treatment is *only* difference → all gaps travel).  
  4. Looping: **7** (Differential treatment starts feedback, but slowly).  
  5. Outsider: **3** (No markers yet; only faint behavioral traces).  
  → Headline: **85**  

  **Threks (t200)**  
  1. Attitude: **7** (Attitudes sustain it, but real disparities emerge).  
  2. Desert Island: **0** (Still socially dependent).  
  3. Swap: **7** (Treatment drives gaps, but accumulated inequality resists full reversal).  
  4. Looping: **8** (Feedback stronger after generations).  
  5. Outsider: **7** (Education/health gaps now detectable).  
  → Headline: **65** (↓ construction as real effects solidify).  

  **Cloaks**  
  1. Attitude: **7** (Individual beliefs exist, but no shared intentionality).  
  2. Desert Island: **0** (No trade → no money).  
  3. Swap: **7** (If you swapped "acceptance," they *could* function as money).  
  4. Looping: **0** (No feedback; false beliefs don’t interact).  
  5. Outsider: **0** (No economic pattern visible).  
  → Headline: **38** (Not money due to lack of common knowledge).  

  **Gribbons**  
  1. Attitude: **0** (No beliefs/affect involved).  
  2. Desert Island: **0** (No tracking → no gribbons).  
  3. Swap: **0** (No differential treatment to swap).  
  4. Looping: **0** (Classification has no consequences).  
  5. Outsider: **10** (Arbitrary partition fully detectable in behavior).  
  → Headline: **5** (Barely constructed; just a tracked pattern).  

  ---

  ### Analysis  
  **Where "socially constructed" splinters:**  
  - **Money vs. Race**: Dana’s "exactly the same" claim **breaks** on Outsider (Money:0, Race:2) and Swap (Money:10, Race:8). Race has somatic anchors (test 5) and slight resistance to treatment-swapping (test 3), while money is *pure* attitude coordination. But it **holds** on Desert Island (both 0) and Attitude (10 vs 9) — both vanish without society.  
  - **Threks over time**: Scores **decrease** (85→65) as real disparities accumulate. "Construction" weakens as attitudinal dependence (test 1↓) and swap-resistance (test 3↓) drop — the kind becomes *less* constructed as biology/culture bake in differences.  
  - **High-Low Splits**:  
    - *Gribbons*: Outsider **10** + Attitude **0** → detectable but belief-independent.  
    - *Depression*: Desert Island **5** + Looping **9** → real suffering, but categorization reshapes it.  
    - *Cloaks*: Attitude **7** + Looping **0** → beliefs exist but don’t feedback.  

  **Conclusion**: "Socially constructed" is **a bundle of 3 core properties**:  
  1. **Attitude-dependence** (Tests 1,2,5): Money/race/gender/recession score high; gribbons low.  
  2. **Treatment-swappability** (Test 3): Money/threks(t0)/recession = 10; depression/threks(t200) lower.  
  3. **Looping strength** (Test 4): Gender/recession = 10; cloaks/gribbons = 0.  

  Dana is **broadly right** for money/race (both high-attitude, swappable, looping) but **overlooks gradients**: race’s somatic residue makes it *less* constructed than money on Swap/Outsider. Threks show construction can *fade* as real effects emerge. "Same way" fails for kinds like cloaks (no looping) or gribbons (no attitudes) — proving the slogan bundles distinct features.
