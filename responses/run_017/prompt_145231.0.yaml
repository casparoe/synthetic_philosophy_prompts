  2. Desert Island: **0** (Without society, dollars are inert paper).  
  3. Swap: **10** (Swap treatment → anything becomes money).  
  4. Looping: **8** (Beliefs alter value/use, but inflation is slow).  
  5. Outsider: **0** (No predictive power absent belief).  
