prompt: |-
  I am in the final year of my linguistics degree and I am taking a seminar on speech act theory, and at the same time I work as one of four paid research assistants on a department project that is building a coded corpus of utterances from university conduct-board hearings and the messages that led up to them. We code about four hundred utterances a week. The coding team is undergraduates with roughly one week of training, and the principal investigator adjudicates disputed items in a weekly meeting. We have a working code set — commissive, directive, assertive, expressive, declaration — but no decision procedure, so our disagreements are currently settled by intuition and the PI's authority, which is exactly what a coding manual is supposed to prevent.

  I would like you to write the procedure itself: the questions a coder asks, in order, when confronted with one utterance in a transcript; what counts as a sufficient answer to each question given only the transcript and a fixed context window; the point at which the procedure stops and returns a definite code; and the point at which it hands the item to the PI because the question is genuinely underdetermined by the record rather than merely hard. Please ground it in the actual apparatus of speech act theory — felicity conditions and the different ways an act can go wrong — but write it so that a coder who has never read the literature can apply it in about ninety seconds per utterance. If a theoretical distinction cannot survive being turned into a question a trained undergraduate can answer, say so and say what is lost by dropping it; if a distinction must survive, say exactly where in the sequence it does its work.

  Several features of our corpus are the reason I cannot just adapt a textbook summary, and I need the procedure to have an answer for each of them rather than a footnote. Many utterances are indirect: no performative verb, or the wrong one. Some contain an explicit performative verb that does not seem to do what it names — an email from the student-government president opening with a formula of authorization he has no standing to issue, a resignation "accepted" by someone who cannot accept it, a "promise" made as part of a joke that both parties laugh about. Some were never received: voice notes and direct messages sent to accounts that had been deactivated the day before, or read only by an automatic forwarding service. Some are reported rather than performed — a witness during a hearing quoting what someone texted her, or describing what she would have said. Some are addressed to a group, or issued by a panel speaking with one voice. Some fall inside a stretch the transcription service marked inaudible, so that the clause carrying the commitment or the threat is missing or guessed at. And some are conditional, or issued in the middle of a negotiation, where it is unclear whether the speaker is committing herself, predicting what she will do, or offering to commit herself if the other side does something first.

  Please do three further things. First, separate the two things we currently conflate: the type of act attempted, and whether the attempt succeeded. A void or defective act and an insincere but fully executed one are different items for us, and I want the procedure to say which failures make the act null and which leave the act in place while making it hollow, with a test for telling them apart that does not require access to the speaker's intentions. Second, specify what is to count as uptake in a corpus of asynchronous messages, and be explicit about whether a message addressed to nobody, or to a machine, or to an account that no longer exists, can carry the act it purports to carry. Third, set a rate you expect the cannot-settle bucket to run at, and say what sorts of utterances should be dumped into it rather than forced into a code.

  Then run the procedure on three items from last week's batch, showing the questions and the answers at each step rather than just the verdict:

  1. A respondent leaves a voice note for the complainant the evening after a hearing: "You'll regret talking to them." Her account had been deactivated the previous afternoon, and the message was never retrieved.
  2. The panel chair opens every interview with the same sentence: "We take every report seriously and someone will follow up with you about next steps." My PI's view is that this is boilerplate and should not be coded as a commissive. I suspect the procedure will disagree with her, and I would like to see the argument laid out either way, since whatever we decide will be applied to about sixty hearings.
  3. A housing officer says to a tenant, "I can't approve that on my own, but if the panel signs off I'll put the transfer through on Monday."

  Finally, tell me honestly what the procedure cannot do: which of our questions it will leave as guesses, where its output will be mistaken for a finding about blame or about what the board should do when the code is only a code, and which parts of the九十-second version are judgment presented as if it were rule.
reasoning: |-
  We are designing a decision procedure for coding speech acts in a corpus of university conduct-board hearings and related messages. The procedure must be grounded in speech act theory (specifically Austin and Searle) but operable by trained undergraduates in about 90 seconds per utterance. The procedure will separate the attempted act from its success and handle the specific challenges of the corpus.

  The procedure has two main parts:
  1. Determine the attempted speech act type (commissive, directive, assertive, expressive, declaration) by examining the utterance and its context.
  2. Assess the success of the act (whether it was executed and whether it was felicitous) based on felicity conditions, without access to speaker intentions.

  Key challenges in the corpus:
  - Indirect speech acts (no performative verb or an indirect one)
  - Explicit performative verbs that are misused (without proper standing, in jest, etc.)
  - Unreceived messages (sent to deactivated accounts, not retrieved)
  - Reported speech (witnesses quoting others)
  - Group addresses or panel utterances
  - Inaudible or missing parts (guessed at by transcribers)
  - Conditional or negotiatory utterances

  The procedure will be a sequence of questions. If at any point the answer is unclear or the record is insufficient, the utterance is sent to the PI for adjudication.

  We define:
  - **Uptake**: In asynchronous messages, uptake is the recipient's receipt and comprehension of the message. Without uptake, the act may not be successfully performed. However, the *attempt* is still coded.

  For the success assessment:
  - **Null act**: The act was not successfully performed (e.g., due to lack of uptake or a fundamental flaw in the felicity conditions). The act is void.
  - **Hollow act**: The act was performed but was defective (e.g., insincere, without proper authority, etc.) but still exists as an act.

  We will set an expected cannot-settle rate (for the PI) at about 5-10% of utterances, depending on the clarity of the context.

  ---

  **Procedure: Speech Act Coding Decision Tree**

  **Step 1: Pre-filtering**
  - If the utterance is reported speech (e.g., a witness says "He said, 'I'm sorry'"), then code the original act (if clear) and note it is reported. If the report is the focus (e.g., the witness is making an assertion about what was said), then code the report as an assertive. If unclear, send to PI.
  - If the utterance is in an inaudible section and the transcriber has guessed, and the guess is critical to the act, send to PI (because we cannot rely on guesses). Otherwise, proceed with the transcribed version.
  - If the utterance is part of a joke, sarcasm, or clearly non-serious context (based on the reaction of the parties or explicit markers like "just kidding"), then code the act as attempted but note it as hollow (due to non-seriousness) and move to Step 2 to determine the type.

  **Step 2: Determine the Attempted Act Type**

  Ask these questions in order:

  1. **Does the utterance contain an explicit performative verb?** (e.g., "I apologize", "I order you", "I promise")
     - If yes, note the verb and proceed to Step 2A.
     - If no, go to question 2.

     **Step 2A: Check for Misuse of Performative Verb**
     - Is the speaker in a position to perform the act? (e.g., only a judge can declare a verdict, only the president can authorize an action). If not, then the act is attempted but will be marked as defective (hollow) in the success step. However, we still code the attempted type.
     - Is the context clearly non-serious (e.g., both parties laugh, or it's in a joking context)? If yes, then code the act as attempted but hollow (due to non-seriousness) and note the type as indicated by the verb.
     - Otherwise, take the verb as indicating the act type:
          - "promise", "pledge", "commit", "vow" → commissive
          - "order", "command", "request", "ask", "demand" → directive
          - "state", "assert", "claim", "report" → assertive
          - "apologize", "thank", "congratulate", "condole" → expressive
          - "declare", "pronounce", "find", "accept" (in official contexts) → declaration
     - If the verb does not fit these categories, or if it is ambiguous, go to question 2.

  2. **What is the primary intended direction of fit?**
     - World-to-word: The utterance is trying to get the world (specifically the listener) to match the words (e.g., a request, command) → directive.
     - Word-to-world: The utterance is trying to match the words to the world (e.g., a statement of fact) → assertive.
     - If neither, then consider:
          - Is the speaker committing to a future course of action? → commissive.
          - Is the speaker expressing a psychological state (feeling, attitude) about the situation? → expressive.
          - Is the speaker bringing about a change in institutional status by the utterance itself? → declaration.

     How to determine in practice:
     - Look for:
          - Directives: Imperative mood ("Leave now"), or questions that are requests ("Can you pass the salt?"), or statements that imply an action desired from the listener ("I need that report by 5").
          - Assertives: Statements of fact, descriptions, predictions (unless they are threats or promises, which are commissives).
          - Commissives: Commitments by the speaker to do something in the future ("I'll be there at 8", "I will not let this happen again"). Includes threats and offers.
          - Expressives: Utterances that primarily express the speaker's feelings ("I'm so sorry", "Congratulations!").
          - Declarations: Utterances that change institutional reality ("You're fired", "I now pronounce you husband and wife", "The meeting is adjourned") — must be by someone with the authority.

     If the utterance is indirect, use the context to infer the primary force. If there are multiple forces, choose the one that is primary.

     If the utterance is conditional, then:
          - If the condition is on the speaker's action (e.g., "If you do X, I will do Y"), then it is a commissive (conditional promise or threat).
          - If the condition is on the listener's action (e.g., "If you want to stay, you must do X"), then it is a directive.

     If the act type is still unclear, send to PI.

  **Step 3: Assess Success (Felicity) and Uptake**

  We now have an attempted act type. Now we assess:

  1. **Was the utterance received? (Uptake Part 1)**
     - For asynchronous messages (emails, voice notes, texts): Was the message delivered to an active account and retrieved by the recipient? (Note: Automatic forwarding without human reading does not count as retrieved by the recipient.)
          - If no (e.g., sent to a deactivated account, or not retrieved), then the act is **null** (not successfully performed). We still code the attempt, but mark as null due to lack of uptake.
          - If yes, or if it was spoken in person (and presumably heard), then proceed.

     Note: For group messages, if at least one member of the group received it, that counts as uptake for the group. For panels, the panel is the speaker and the recipient is the addressee.

  2. **Were the essential felicity conditions met?**
     - We consider two levels:
          a) **Preparatory conditions**: Does the speaker have the authority (for declarations), the ability (for commissives and directives), and is the situation appropriate?
          b) **Sincerity condition**: Is the speaker sincere? But note: we cannot know intentions. Therefore, we only mark as hollow if there is clear evidence of insincerity (e.g., the speaker later admits it was a lie, or it was in a context of known deception).

     However, we must avoid guessing intentions. Therefore:
          - For preparatory conditions: We can often tell from the context (e.g., a student government president cannot issue an official university authorization). If the speaker lacks the authority and the act is a declaration, then the act is null (because declarations require authority). For commissives and directives, lack of ability or authority might make the act hollow (because the act was attempted but defective) but still existent.

          Rules:
          - Declarations: Without the proper authority, the act is **null** (it does not bring about the change). But the attempt is still coded as a declaration.
          - Commissives: If the speaker cannot possibly do the action (e.g., "I promise to build a time machine"), then it is hollow (defective) but still a commissive. If the speaker has the ability but we have evidence of insincerity, then hollow. Otherwise, it is executed.
          - Directives: If the speaker has no authority to command (e.g., a random person ordering a judge to dismiss the case), then it is hollow. But if the directive is a request (which doesn't require authority), then it might be valid.

          - Expressives: Must be about a state of affairs that exists (or that the speaker believes exists). If the context shows the state of affairs does not exist (e.g., congratulating someone for something that didn't happen) then it is hollow. But note: we cannot know the speaker's belief without evidence.

     How to handle without access to intentions:
          - Mark as hollow only if the record provides clear evidence that the condition was not met (e.g., lack of authority is clear from the roles, or the speaker explicitly states it was a lie, or the context is non-serious as established by laughter or explicit markers).
          - Otherwise, assume the act is executed (i.e., not hollow) for coding purposes.

     For the corpus, we will have:
          - **Executed**: The act was performed and there is no evidence of a flaw in the felicity conditions (even if we suspect, we don't mark hollow without evidence).
          - **Hollow**: There is clear evidence in the record that a felicity condition was not met (e.g., lack of authority, non-serious context, explicit evidence of insincerity).
          - **Null**: The act was not performed due to lack of uptake or a fundamental flaw that prevented the act from being performed (e.g., a declaration without authority, an utterance that was never received).

     Note: For declarations, if the speaker lacks authority, the act is null because the act requires authority to be a declaration. But we still code the attempt as a declaration.

  3. **Special Case: Unreceived Messages**
     - If the message was never received (Step 3.1), then the act is null. The attempt is still coded.

  **Step 4: Final Code**
  - The code will be: [Attempted Act Type] + [Status: executed, hollow, null]
  - Example: "commissive-executed", "directive-null"

  If at any step the coder cannot determine (due to ambiguity or insufficient context), send to PI.

  **Expected Cannot-Settle Rate**: We expect about 5-10% of utterances to be sent to the PI. These are typically:
     - Utterances with ambiguous force (e.g., a statement that could be an assertive or a directive).
     - Cases where the context is unclear (e.g., is it a joke?).
     - Reported speech where the original act is unclear.
     - Inaudible sections that are critical.
     - Conditional utterances with complex negotiation context.

  ---

  **Now, run the procedure on the three examples:**

  **Example 1:**
  Utterance: "You'll regret talking to them." 
  Context: A voice note left by the respondent for the complainant the evening after a hearing. The complainant's account had been deactivated the previous afternoon, and the message was never retrieved.

  Step 1: Not reported, not inaudible, not a joke (as far as we know). Proceed.
  Step 2: No explicit performative verb. So we go to question 2: What is the primary direction of fit?
     - The speaker is predicting a future state (that the listener will regret) but the force is more of a threat. Threats are commissives (the speaker is committing to making the regret happen) or directives (if interpreted as a warning to stop)? However, in the context (after a hearing, from a respondent to a complainant), it is likely a threat. Threats are commissives because the speaker is committing to a future action (that will cause the regret). So attempted act: commissive.

  Step 3: Assess success and uptake.
     3.1: Uptake? The message was never retrieved (account deactivated). Therefore, null.
     (We don't need to check felicity conditions because without uptake, the act is null.)

  Code: commissive-null.

  **Example 2:**
  Utterance: "We take every report seriously and someone will follow up with you about next steps."
  Context: The panel chair opens every interview with this sentence. The PI thinks it's boilerplate and not a commissive.

  Step 1: Not reported, not inaudible, not a joke. Proceed.
  Step 2: No explicit performative verb. So question 2: What is the primary direction of fit?
     - First clause: "We take every report seriously" — this is an assertive (describing a current state of affairs). 
     - Second clause: "someone will follow up with you about next steps" — this is a future action by the panel (or their designee). The speaker (panel chair) is committing on behalf of the panel to a future action. Therefore, it is a commissive.

     But note: the PI says it's boilerplate. However, boilerplate can still be a commissive. The act is still a commitment, even if it is routine.

     So attempted act: commissive.

  Step 3: Assess success and uptake.
     3.1: Uptake? It is spoken in person in the interview, so presumably received.
     3.2: Felicity conditions:
          - Preparatory: The panel has the authority to follow up? Yes, they are the conduct board. 
          - Sincerity: We have no evidence of insincerity. The fact that it is boilerplate does not mean they don't intend to do it. So we assume executed.

     However, note: if the panel routinely says this but does not actually follow up, that would be insincere. But without evidence in the record (e.g., a pattern of non-follow-up known at the time of the utterance), we cannot mark it hollow. Therefore, it is executed.

  Code: commissive-executed.

  But the PI's view: She says it's boilerplate and should not be coded as commissive. However, according to the procedure, it is a commissive. The procedure does not have an exception for boilerplate because even routine commitments are still commitments. What is lost by coding it as commissive? Nothing — it is a commitment. However, if the panel does not intend to follow up, that would make it hollow, but we don't have evidence of that. Therefore, the procedure disagrees with the PI.

  **Example 3:**
  Utterance: "I can't approve that on my own, but if the panel signs off I'll put the transfer through on Monday."
  Context: A housing officer to a tenant.

  Step 1: Not reported, not inaudible, not a joke. Proceed.
  Step 2: Explicit performative? No. So question 2: 
     - The first clause is an assertive (stating inability). 
     - The second clause is conditional: "if the panel signs off, I'll put the transfer through". This is a conditional commitment. So it is a commissive (the speaker commits to doing something in the future, conditional on the panel's approval).

     Attempted act: commissive.

  Step 3: Assess success and uptake.
     3.1: Uptake? Spoken in person, so received.
     3.2: Felicity conditions:
          - Preparatory: The housing officer has the ability to put the transfer through? Presumably yes, if the panel signs off. So the condition is reasonable. 
          - Sincerity: No evidence of insincerity. So executed.

  Code: commissive-executed.

  ---

  **What the procedure cannot do:**

  1. **Infer intentions without evidence**: We cannot reliably code insincerity without clear evidence in the record. Therefore, most acts will be coded as executed even if the speaker was lying, unless there is explicit proof.

  2. **Handle complex indirect acts perfectly**: The procedure relies on the coder's judgment in inferring the primary force. Some indirect acts may be ambiguous and end up in the PI's bucket.

  3. **Distinguish between some types of directives and commissives in conditional statements**: The procedure uses a rule (condition on speaker's action -> commissive; condition on listener's action -> directive) but in complex negotiations, it may not be clear.

  4. **Code declarations without authority as anything but null**: Even if the speaker intended to declare, if they lack authority, the act is null. But in reality, such an act might be an attempt that has other effects (e.g., as an assertive). However, we code the attempt as a declaration and mark it null.

  5. **Rate of cannot-settle**: We expect 5-10% to go to the PI. The procedure will force a code in clear cases, but when the context is ambiguous or the utterance is incomplete, it will defer.

  6. **Blurring of judgment and rule**: The step about inferring the primary force (Step 2, question 2) requires judgment. We present it as a rule (by giving clear criteria) but in practice, the coder must decide what the primary intended force is. This is a point where subjectivity enters.

  7. **Cannot capture the perlocutionary effect**: The procedure only codes the illocutionary act (the act performed in saying something) and its felicity, not the consequences (e.g., whether the promise was believed, whether the directive was followed).

  8. **Group addresses**: The procedure assumes that a group act is still an act of the same type. But it doesn't handle the nuances of collective intention.

  9. **Conditional commitments**: The procedure codes conditional commissives as commissives, but note that the condition might be so unlikely that it is effectively not a commitment. However, we do not evaluate the likelihood of the condition.

  10. **Boilerplate and ritual**: The procedure treats boilerplate as having the same force as non-boilerplate (as in Example 2). This may overcode commissives if the utterance is purely ritual and not intended as a commitment. However, without evidence of insincerity, we code it as executed.

  In summary, the procedure is a practical tool for consistent coding. It sacrifices some theoretical nuance (like the exact nature of collective acts or the full complexity of indirect acts) for speed and reliability. The output is a code for the act attempted and its status, not a finding about blame or what the board should do. It is a description of the utterance from a speech act perspective, not an evaluation of its ethical or legal standing.
answer: |-
  Below is a speech act coding procedure grounded in Austin's and Searle's theories, designed for your corpus's challenges. It prioritizes **practical applicability** (90 seconds/utterance), separates **attempted act** from **success**, and specifies when to defer to the PI. The procedure uses only the transcript and a fixed context window (typically ±2 utterances). Theoretical compromises are noted.

  ---

  ### **SPEECH ACT CODING PROCEDURE**
  **Core Principles**  
  1. **Attempted Act**: What the speaker *tried* to do (commissive, directive, assertive, expressive, declaration).  
  2. **Success**:  
     - **Null**: Act failed due to *fundamental flaws* (no uptake, invalid authority). Void ab initio.  
     - **Hollow**: Act performed but *defective* (insincere, misfired conditions). Still exists.  
     - **Executed**: Act performed and felicitous.  
  3. **Uptake**: Recipient must *receive and comprehend* the utterance. For async messages:  
     - Delivery to active account + retrieval by human = uptake.  
     - No uptake if: sent to deactivated account, machine-only read, or addressed to nobody.  
  4. **PI Referral**: Use when:  
     - Context window insufficient (e.g., critical clause inaudible).  
     - Force ambiguous after all steps (e.g., hybrid act).  
     - Expected referral rate: **5–7%** (based on complex conditionals, authority disputes, or mangled transcripts).  

  **Decision Tree**  
  *Ask in order; stop when code is clear.*  

  #### **STEP 1: IS THIS A PERFORMED ACT?**  
  **Q1: Is this a *direct* performance, or a report/description?**  
  - **Report/Description** (e.g., "He said, ‘I’ll pay you back,’" or "I would’ve apologized"):  
    - Code as **assertive** (since it describes a past/hypothetical act).  
    - Skip to Step 3.  
  - **Direct Performance**: Proceed to Q2.  

  **Q2: Was the utterance received? (Uptake check)**  
  - **No** (deactivated account, machine-only, unretrieved async message):  
    - Code as **NULL**. Note attempted act type (Steps 2–3) but mark null. Stop.  
  - **Yes** (or in-person speech): Proceed to Step 2.  

  *(Theoretical Compromise: Austin requires uptake for act success. We uphold this strictly for nullity.)*  

  #### **STEP 2: DETERMINE ATTEMPTED ACT TYPE**  
  **Q3: Does the utterance have an explicit performative verb (e.g., "promise," "order")?**  
  - **Yes**: Go to Q4.  
  - **No**: Go to Q5.  

  **Q4: Is the verb used seriously and aptly?**  
  - **No** (clear joke, sarcasm, or authority mismatch, e.g., student president "authorizing" faculty actions):  
    - Code as **HOLLOW**. Proceed to classify act type (Q5–Q7) but mark hollow.  
  - **Yes**: Take verb as literal:  
    - "Promise," "guarantee" → **commissive**  
    - "Order," "demand" → **directive**  
    - "State," "assert" → **assertive**  
    - "Apologize," "thank" → **expressive**  
    - "Declare," "pronounce" → **declaration**  
    - Stop if clear; else go to Q5.  

  **Q5: What is the primary purpose?**  
  - **Speaker commits to future action** (e.g., threat, offer, pledge): → **COMMISSIVE**  
  - **Speaker tries to make listener do something** (e.g., request, command): → **DIRECTIVE**  
  - **Speaker describes state of affairs** (e.g., claim, prediction, fact): → **ASSERTIVE**  
  - **Speaker expresses feeling** (e.g., gratitude, regret): → **EXPRESSIVE**  
  - **Speaker changes institutional reality** (e.g., fire, appoint, resolve): → **DECLARATION**  

  *Clarifiers for indirect acts:*  
  - **Conditionals**:  
    - "If you do X, I will do Y" → **commissive** (speaker commits conditionally).  
    - "If you want X, do Y" → **directive** (pushing listener to act).  
  - **Group/panel utterances**: Treat as single speaker. Authority checked in Step 3.  
  - **Ambiguous?** → Refer to PI (e.g., "I’ll make you pay" could be commissive [threat] or directive [warning]).  

  *(Theoretical Compromise: Searle’s direction-of-fit is simplified to purpose. Indirect acts rely on pragmatic inference but are necessary for speed.)*  

  #### **STEP 3: ASSESS SUCCESS (FELICITY)**  
  **Q6: Are essential conditions met?**  
  - **NULL if**:  
    - Declaration without authority (e.g., student "expelling" another).  
    - Directive to non-audience (e.g., command to empty room).  
  - **HOLLOW if**:  
    - Clear insincerity *without* access to intent (e.g., laughing during "promise," email marked "JOKE").  
    - Misfired condition (e.g., "I resign" when not employed).  
  - **EXECUTED otherwise**.  

  **Q7: For commissives/directives: Is the act feasible?**  
  - **HOLLOW** if impossible (e.g., "I’ll build a time machine") or authority mismatch (e.g., student "ordering" professor).  
  - **EXECUTED** if feasible and no evidence of defect.  

  *(Theoretical Compromise: Insincerity is only coded if *explicitly evident* (e.g., laughter, quotes). We avoid intention-guessing, per your request.)*  

  ---

  ### **APPLICATION TO EXAMPLES**  
  #### **Example 1: Voice note – "You'll regret talking to them."**  
  - **Step 1/Q1**: Direct performance → Proceed.  
  - **Step 1/Q2**: Sent to deactivated account → **NULL**.  
  - **Step 2/Q5**: (Skipped due to nullity, but for attempt): "You’ll regret" implies threat → **COMMISSIVE**.  
  - **Final Code**: **Commissive-NULL**.  
  *Rationale: No uptake voids the act. Threat is commissive (commitment to cause regret).*  

  #### **Example 2: Panel chair – "We take every report seriously and someone will follow up..."**  
  - **Step 1/Q1**: Direct performance → Proceed.  
  - **Step 1/Q2**: In-person → Received.  
  - **Step 2/Q3**: No performative verb → **Q5**.  
  - **Step 2/Q5**:  
    - "We take... seriously" → **Assertive** (describes policy).  
    - "Someone will follow up" → **Commissive** (commitment to future action).  
    - *Primary purpose*: Commitment (second clause is act-oriented). → **COMMISSIVE**.  
  - **Step 3/Q6–Q7**:  
    - Authority: Panel can commit to follow-ups → **EXECUTED**.  
    - Boilerplate ≠ insincerity without evidence.  
  - **Final Code**: **Commissive-EXECUTED**.  
  *Why PI is wrong*: Boilerplate is still a commitment; felicity conditions hold. Coding as non-commissive ignores Searle’s point that ritual utterances are acts. **Loss**: Ritual language’s dulled force isn’t captured, but this is unavoidable without subjectivity.  

  #### **Example 3: Housing officer – "I can’t approve that on my own, but if the panel signs off I’ll put the transfer through on Monday."**  
  - **Step 1/Q1**: Direct performance → Proceed.  
  - **Step 1/Q2**: In-person → Received.  
  - **Step 2/Q3**: No performative verb → **Q5**.  
  - **Step 2/Q5**: "I’ll put the transfer through" → Commitment conditional on panel → **COMMISSIVE**.  
  - **Step 3/Q6–Q7**:  
    - Authority: Officer can process transfers if approved → **EXECUTED**.  
    - No evidence of insincerity.  
  - **Final Code**: **Commissive-EXECUTED**.  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Resolve ambiguity without context**:  
     - Complex conditionals (e.g., "I might help if you plead" – commissive or assertive?) often need PI input.  
     - Indirect acts with multiple interpretations (e.g., "The door is locked" as directive vs. assertive).  

  2. **Infer intentions**:  
     - Insincerity is only coded if *explicit* (laugh, tone marker). Hidden deceit leaves hollow acts as executed.  
     - **Risk**: Output may imply blame (e.g., a hollow promise coded as executed). Remind users: codes describe acts, not morality.  

  3. **Handle fragmented transcripts**:  
     - Inaudible clauses (e.g., "[inaudible] you’re expelled") force guesses → Refer to PI.  

  4. **Authority disputes**:  
     - "Can a student president declare a policy?" depends on institutional rules → Refer if unclear in context window.  

  5. **Group vs. individual acts**:  
     - Treats panels as single speaker. Nuances of collective intention (Searle) are lost.  

  6. **Blurred lines in success coding**:  
     - Declarations without authority are null, but may feel like "attempted declarations." Code stands per Austin.  
     - **Risk**: Board members may mistake "null" for "should be ignored," but null acts can have consequences (e.g., intimidation).  

  7. **Judgment-as-rule flaws**:  
     - Step 2/Q5 (purpose) relies on coder inference. Rules scaffold this, but force primary force choice.  
     - Step 3/Q7 (feasibility) can be subjective (e.g., is "I’ll end racism" impossible or hyperbolic?).  

  **Theoretical Sacrifices**:  
  - **Illocutionary/perlocutionary distinction**: Output codes illocution; perlocution (effects) is ignored.  
  - **Searle’s 12 distinctions**: Collapsed to 5 types. Direct/indirect differentiation is simplified.  
  - **Austin’s infelicities**: We bundle "misfires" (null) vs. "abuses" (hollow), but omit subtypes (e.g., flaws vs. hitches).  

  **Recommendation**: Train coders on edge cases monthly. Use PI referrals to refine the manual iteratively. This procedure balances theory and pragmatism—it won’t resolve all debates, but it will standardize coding.
