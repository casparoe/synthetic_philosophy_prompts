prompt: |-
  hey so i'm in debate club and next week we're doing a thing on effective altruism, and i got assigned the side against it. I don't really know philosophy but my cousin's boyfriend (hes doing a phd in something, i think economics adjacent) sent me this long blog post critisizing EA and i wrote down the main bits. A friend of mine who likes EA says most critiques of it are strawmen, so now i don't know what i can safely say out loud without getting laughed at. Can you go through what i wrote down and tell me whats fair?

  Here are the points i copied out (shortened):

  1. "EA says: work out which intervention does the most good per dollar and fund that one. In practice that means funding whatever you can put a number on — bednets, deworming, direct cash transfers — because those have a cost per life saved you can actually calculate. And it means ignoring everything that isn't countable: building a political movement, changing what a culture cares about, preventing a war that never happens. So 'effective' in effective altruism really just means 'measurable'."

  2. "The deeper version of this is what I'd call the denominator problem. To rank two causes against each other you need a unit — dollars per life saved, dollars per unit of suffering prevented. But only some problems come with a natural unit. Malaria comes in cases. A corrupt institution, or a norm that makes people not care about strangers, doesn't. So the famous cause rankings are mostly decided by which problems happen to be countable, and EA mistakes that for evidence about which problems are biggest. Worse, when a harm can't be estimated the cost-effectiveness tables just quietly treat it as zero, which means any intervention with big messy long-run downsides looks amazing on paper."

  3. "Earning to give: take a high-paying job in finance or tech, live cheaply, donate most of it. Critics say this makes you complicit in whatever that industry does. EAs reply that it doesn't matter, because of replaceability: if you don't take the job someone else will, and that person will donate less than you, so you still make things better. But that argument proves way too much. If replaceability works, you could take a job at a tobacco company or an oil company and it's still fine, as long as you give away more than the next person would. Nobody believes that. So the whole earning-to-give thing collapses."

  4. "EA treats the world like a shopping list of separate problems to buy solutions for, instead of asking who has power and how you change that. Basically it's the politics of rich people donating money, and it quietly assumes political or structural change is a waste of time because you can't measuer it."

  5. "And then that guy who ran a big crypto exchange and was always talking about EA turned out to be a fraud and lost everyone's money, which kind of shows the whole movement was never really about helping people."

  What i'm unsure about: my friend says point 3 is the standard objection to earning to give and that EAs have a genuine answer to it, and that the "proves too much" move is doing something sneaky — but i don't get what. I also can't tell whether the denominator problem in 2 is a real criticism anyone makes or whether he just made it up, and if it is real, whether it's secretly just the same point as 1 or actually something different. And is it fair to say EA assumes political change is pointless?

  So: for each of the five, tell me what someone who actually defends EA would accept, what they'd say is a misrepresentation or an overstatement, and whats just wrong. Then tell me whether the big conclusion — that EA's ranking of causes is basically an artifact of what's easy to count, so the numbers don't really tell you anything — actually follows from the parts that are true, or whether it needs the false parts. And if the denominator problem is a real separate objection, what would a defender say back to it, because i'd rather make a point i can defend than one that sounds good for ten seconds.
reasoning: |-
  Okay, the user is in a debate club arguing against Effective Altruism (EA) and needs help evaluating their points. They’ve listed five criticisms from a blog post but are worried some might be strawmen. Their friend who supports EA says point 3 is a common objection with a real counter, and they’re unsure about the validity of the "denominator problem" in point 2. They want to know which points are fair, which are misrepresentations, and how to structure their argument without getting laughed at.  

  First, I need to unpack each point from an EA defender’s perspective. Point 1 claims EA prioritizes measurable interventions (like bednets) over unmeasurable ones (like cultural change). Defenders would agree measurability matters but argue it’s a practical necessity, not a philosophical flaw. They’d emphasize EA does fund some hard-to-measure causes, like AI safety. So this point is partly true but overstated—it’s not that EA ignores unmeasurable things entirely.  

  Point 2 introduces the "denominator problem," arguing EA’s cause rankings favor countable metrics (e.g., lives saved) and implicitly treat unquantifiable harms as zero. This is a legitimate, separate critique raised by philosophers like Amia Srinivasan. Defenders might counter that EA is improving by developing new metrics for "messy" problems, but it’s still a valid weakness. The user should keep this—it’s nuanced and defensible.  

  Point 3 criticizes "earning to give" by suggesting it justifies working for harmful industries (e.g., tobacco) via replaceability logic. Here, the user’s friend is right: this is a common objection, and EA has a rebuttal. The "proves too much" move is sneaky because it ignores EA’s explicit caveats—they discourage harmful jobs even if replaceability applies. Defenders would reject the tobacco example as a distortion. This point is weak for debate; the user should avoid it or use carefully.  

  Point 4 accuses EA of ignoring power structures and assuming political change is pointless. Defenders would push back hard—EA funds policy advocacy and movement-building (e.g., animal welfare lobbying). While some early EA writing was skeptical of politics, the movement has evolved. This point is mostly a misrepresentation; the user could soften it to avoid easy counterattacks.  

  Point 5 ties EA to the FTX scandal (Sam Bankman-Fried). Defenders would call this guilt-by-association—EA condemns fraud, and one bad actor doesn’t define the movement. This is a rhetorical cheap shot; best to drop it unless the user wants to risk sounding unserious.  

  For the big conclusion—that EA’s cause rankings are just artifacts of measurability—it partly follows from points 1 and 2 (which have truth), but defenders would argue EA actively works to mitigate this bias. The user should concede some ground here while stressing the limitations.  

  The user’s deeper needs: They’re new to philosophy, time-pressed, and fear humiliation. They need battle-tested points, not just accuracy. I’ll prioritize defensible critiques (like the denominator problem) and warn them off weak ones (FTX, the tobacco exaggeration). They also crave clarity on what’s distinct in point 2—it’s a real, separate issue worth using.  

  Action plan: Advise them to lead with points 1 and 2 (framed carefully), skip point 3 or use it cautiously, reword point 4 to acknowledge EA’s engagement with politics, and ditch point 5. Stress that the conclusion has merit but isn’t fatal—EA tries to address these flaws.
answer: |-
  Here's a breakdown of each point from an EA defender's perspective, followed by an assessment of your overall conclusion. I'll flag what's fair, overstated, or wrong, and provide defensible counterarguments.

  ---

  ### **Point-by-Point Analysis**
  **1. "EA prioritizes measurable interventions, ignoring unquantifiable causes."**  
  - **What defenders accept:** EA *does* emphasize measurable impact because it insists on evidence. Some early EA work focused heavily on quantifiable interventions (e.g., bednets) because they had robust data.  
  - **What's overstated/misrepresented:** EA funds many "unmeasurable" causes:  
    - **AI safety** (preventing existential risks from artificial intelligence).  
    - **Animal welfare advocacy** (changing cultural/legal norms).  
    - **Policy reform** (e.g., criminal justice or pandemic preparedness).  
    Critics like [Holden Karnofsky (Open Philanthropy)](https://www.openphilanthropy.org/research/cause-prioritization/) explicitly discuss funding "worldview diversification" to avoid over-reliance on metrics.  
  - **Defensible version:** *"EA's tools struggle to compare measurable vs. unmeasurable causes, creating a bias toward quantifiable short-term wins."*  

  **2. "The denominator problem: EA assumes unquantifiable harms = zero."**  
  - **What defenders accept:** This is a **legitimate, widely debated critique** (e.g., by philosopher [Amia Srinivasan](https://www.lrb.co.uk/the-paper/v42/n15/amia-srinivasan/stop-the-robot-apocalypse)). Comparing causes like "malaria prevention" vs. "preventing democratic backsliding" *is* methodologically messy.  
  - **What's misrepresented:** EA doesn’t assume unquantifiable harms = zero. Instead:  
    - It uses **qualitative models** (e.g., "importance/tractability/neglectedness" framework).  
    - Funds meta-charities (e.g., [Global Priorities Institute](https://globalprioritiesinstitute.org/)) researching *how* to compare such causes.  
  - **Defensible version:** *"EA's reliance on quantitative metrics risks underestimating systemic risks (e.g., institutional collapse) because they resist easy measurement. Its rankings aren't neutral—they reflect methodological constraints."*  

  **3. "Earning to give justifies working for harmful industries (tobacco/oil)."**  
  - **What defenders accept:** Replaceability *is* a core EA argument ("if you don’t take the job, someone else will").  
  - **What's wrong:** **This is a strawman.** EA explicitly condemns harmful work:  
    - [80,000 Hours](https://80000hours.org) (EA’s career guide) *prohibits* jobs that cause net harm (e.g., tobacco, fossil fuels, arms).  
    - Replaceability only applies if the job itself is ethically neutral (e.g., generic tech/finance roles).  
    - **Why "proves too much" fails:** EA’s position is *not* "any job is fine if you donate more." It’s: "Within *already acceptable* industries, maximize earnings to donate more."  
  - **Defensible version:** *"Earning to give may normalize complicity in industries that cause systemic harm, even if the specific role seems neutral."*  

  **4. "EA ignores power structures and assumes political change is futile."**  
  - **What defenders accept:** Some early EA writing was skeptical of political advocacy (due to low measurability).  
  - **What's misrepresented:** Modern EA funds:  
    - Policy advocacy (e.g., [GiveWell’s support for GiveDirectly](https://www.givewell.org/charities/give-directly) influencing cash-transfer policies).  
    - Movement-building (e.g., [Animal Charity Evaluators](https://animalcharityevaluators.org/) promoting veganism).  
    - Projects like [FTX Future Fund](https://futurefund.org/) (pre-collapse) funded democracy reform.  
  - **Defensible version:** *"EA’s focus on individual donations can distract from addressing root causes of suffering (e.g., inequality, power imbalances)."*  

  **5. "Sam Bankman-Fried (SBF) proves EA is a fraud."**  
  - **What defenders accept:** SBF’s fraud damaged EA’s reputation.  
  - **What's wrong:** **Guilt-by-association fallacy.** EA:  
    - Condemned SBF immediately.  
    - Has no formal hierarchy—he was one donor among thousands.  
    - Focuses on systemic impact, not individual heroes.  
  - **Weakest point:** Easily dismissed in debate. Avoid unless opponents bring him up first.  

  ---

  ### **Your Key Questions Answered**
  1. **Point 3 ("earning to give")**:  
     - Your friend is right—this *is* a common strawman. EA’s actual position: Replaceability only justifies jobs in *net-positive/neutral* industries. The "tobacco company" example is a distortion.  
     - **Sneaky move in "proves too much"**: It ignores EA’s explicit ethical boundaries. Defenders would say: *"We reject harmful work—replaceability doesn’t override basic ethics."*  

  2. **The denominator problem (Point 2)**:  
     - **Is it real?** Yes. Philosophers like Derek Parfit and Hilary Greaves debate this. It’s distinct from Point 1:  
       - Point 1: *"EA favors measurable causes."*  
       - Point 2: *"EA’s ranking system can’t compare fundamentally different kinds of value (e.g., lives saved vs. justice promoted)."*  
     - **EA defender’s response**: *"We’re developing better tools (e.g., ‘moral weights,’ systemic risk models) to compare diverse causes. Perfect metrics don’t exist—but we improve as we learn."*  

  3. **"Does EA assume political change is pointless?"**  
     - Overstated. Modern EA funds policy work but emphasizes **evidence**: e.g., *"Does this specific campaign have a track record of impact?"* vs. *"All activism is unmeasurable."*  

  ---

  ### **Your Conclusion: Does It Hold?**  
  > *"EA’s cause rankings are artifacts of what’s measurable—the numbers don’t tell us what’s most important."*  

  - **What follows from valid critiques**:  
    Points 1 and 2 show EA’s methodology has **systematic biases**: it better captures certain kinds of value (health, poverty) vs. others (justice, cultural change). This *does* skew rankings.  
  - **What doesn’t follow**:  
    - This doesn’t mean rankings are *meaningless*—they still prevent waste (e.g., funding proven bednets over ineffective feel-good projects).  
    - EA often funds "unmeasurable" causes (e.g., AI safety) using **reasoned judgment**, not just numbers.  
  - **Defensible conclusion**:  
    *"While EA improves charitable efficiency, its rankings overrepresent measurable, short-term impacts—potentially neglecting the most profound, systemic changes."*  

  ---

  ### **Debate Strategy: Strongest Points to Use**  
  1. **Lead with the denominator problem (Point 2)**. It’s academically respected and hard to dismiss.  
  2. **Critique "measurability bias" (Point 1)**, but concede EA funds *some* unquantifiable work.  
  3. **Argue that EA undervalues structural change (Point 4)**, using examples like climate policy vs. carbon offsets.  
  4. **Avoid Point 3 (earning to give)** unless you can nuance it. Drop Point 5 (SBF) entirely.  

  **Key resource for nuance**: [This EA Forum post](https://forum.effectivealtruism.org/posts/JLbwwm6ddsqjqWk3k/against-against-bias-towards-the-measurable) addresses "measurability bias" head-on—use it to anticipate counterarguments.  

  This balance lets you critique EA’s *limitations* without misrepresenting it—making your case resilient and intellectually honest. Good luck! 🏆
