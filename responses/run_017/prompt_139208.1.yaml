answer: |-
  The roar under the ice was the first sign, a deeper, hungrier growl than the usual spring murmur. Up in the narrow stone channel where the Willow River pinched tight before the drop, the intake screens for Glenford’s little hydro plant were choking. Branches torn from upstream banks, mats of sodden leaves, and the relentless grit of glacial silt were piling against the iron mesh. Below, in the town nestled in the valley’s palm, the lights flickered, a nervous pulse against the twilight.

  For twelve springs, Lena had heard that shift in the river’s voice. She hadn’t been assigned, not officially. The rotating crew handled the main clearing once the melt eased, but that first critical clog, the one that could stall the turbines and plunge Glenford into cold silence for days? That had always seemed to happen early, violently, and on the crew’s off days. Twelve years ago, fresh off losing her job at the shuttered mill, restless with useless energy, Lena had laced her worn boots, grabbed a pry bar and a grappling hook her grandfather left her, and hiked up. It was brutal work – wading into the numbing, chest-high slush at the screen’s base, hacking, pulling, heaving the waterlogged debris onto the bank, fingers stiff and blue. She’d come down hours later, soaked and shivering, just as the last of the daylight bled from the sky. The lights stayed on.

  That first time, they’d thrown her a party at the River’s Rest. Ben Carter, who ran the plant, slapped her back until she coughed. Edna Miller brought her famous blackberry pie. "Town’s angel," they called her, "our Lena, always there." The praise was warm, tangible, a counterweight to the ache in her muscles. The next spring, she went up again. The thanks were quieter, but still there. A nod from Ben, a basket of fresh eggs left anonymously on her porch. By the fifth year, it was routine. People mentioned it less. "Lena’s on it," they’d say if someone worried aloud about the flicker, a statement of fact, not gratitude. The rotating crew, knowing Lena handled the worst of it, stopped worrying about checking the screens until later in the season.

  The praise dried up like the puddles on Main Street in summer. The unspoken expectation solidified, hardened like the ice that formed overnight at the river’s edge. Lena kept going. She told herself it was for the town, for Mrs. Henderson’s oxygen machine, for the freezers at Miller’s Butcher Shop. But the climb felt steeper each year, the cold bit deeper, and the silence on her return felt heavier than the soaked wool of her coat. The heroics had become chores, unpaid and unseen, absorbed into the town’s quiet hum.

  This spring, the roar under the ice was especially fierce. Lena heard it. She felt the familiar pull, the instinct to grab the hook and bar. But this year, something else pulled harder: a profound, bone-deep weariness. It wasn’t rebellion, nor illness, nor any grand reason. It was simply the weight of twelve years settling. She looked at the grey sleet smearing her window, thought of the sucking cold, the treacherous currents near the screen, the way her knees screamed on the descent now. She thought of the untouched basket of mending, the book she hadn’t opened, the silent, empty hours that belonged only to her. She poured a second cup of tea, stoked the fire, and stayed put.

  The lights flickered, dimmed, then died just after midnight. The deep thrum of the plant ceased, leaving only the wind and the river’s roar. The outage lasted thirty-seven hours. Edna Miller lost half a batch of sourdough. Ben Carter scrambled with backup diesel that coughed and stuttered. Mrs. Henderson’s daughter had to drive her to her sister’s in the next valley. Freezers warmed, pipes threatened to freeze in unheated sheds, and the town huddled in a cold, irritable darkness.

  At the hastily called meeting in the community hall, the air thick with the smell of damp wool and resentment, eyes turned to Lena. She sat quiet in the back, hands folded in her lap.

  "Ben, why wasn't the crew up there?" someone demanded.

  "Too early, too dangerous," Ben said, running a hand over his face. "We go next week, like always. We rely on... well, it’s usually handled by then."

  "Lena," Edna Miller’s voice cut through, sharp with the sting of spoiled dough. "You always go. You know how it is. Why not this time?"

  All eyes fixed on her. The silence stretched, brittle. Lena didn’t offer excuses – the cold, the weariness. They felt flimsy now, selfish against the tangible losses. "I didn’t go," she said simply.

  "You *always* go," Edna pressed, the ‘always’ heavy with accusation. "We counted on you."

  Ben shifted. "It’s true, Lena. You’ve been our rock. Folks plan around you being there for that first big clog. The nurse’s station, the butchers… it’s built in."

  Lena looked at them, the faces etched with frustration, confusion, and a sense of betrayal. "It was never my job," she said, her voice low but clear. "No one asked me to promise. I just… did it."

  "But you *did* do it," said Tom Henderson, Mrs. Henderson’s son-in-law. "For years. You set the pattern. How were we supposed to know this year was different? We relied on you. People got hurt because you stopped."

  "Stopped?" Lena echoed, the word tasting bitter. "I never started a shift. I never took a wage. I just walked up a mountain when I chose to." She saw the disconnect in their eyes. Her years of choosing ‘yes’ had erased the possibility of ‘no’ in their minds. The praise offered long ago felt like a down payment they’d forgotten making, a transaction they assumed was perpetual. Her quiet consistency had woven itself into the town’s fabric, becoming an indistinguishable thread of obligation. She felt the weight of their expectation, a tangible thing pressing down, yet she also saw the genuine disruption, the spoiled food, the genuine fear in Mrs. Henderson’s daughter’s eyes – harms that felt real and were undeniably linked to her absence. She hadn’t broken a rule, but she had broken a rhythm the town lived by. The resentment wasn't stupidity; it was the sound of a system jarringly halted, a shared understanding violently ruptured. She saw the uncomfortable truth in their confusion: her gift had become their necessity, and stopping felt, to them, like taking something vital away that was never formally hers to give, but somehow, through the slow alchemy of years, had become hers to maintain. She walked out into the sleet, the unresolved tension clinging to her like the damp.

  The uncomfortable knot here is how consistent, voluntary action creates a dependency that feels like an unspoken contract. The town didn't consciously decide to exploit Lena; they simply adapted to her reliability, forgetting its voluntary origin. Lena didn't consciously create an obligation; she just acted. When she stopped, both sides faced a truth: the line between generous gift and essential service had been silently, mutually erased through the sheer force of expectation built over time, leaving only the messy, painful consequences of its withdrawal. Neither malice nor simple boundary-breaking explains it; it's the slow creep of reliance turning generosity into a shared, unacknowledged debt.
