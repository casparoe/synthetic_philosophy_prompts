prompt: |-
  Someone in my decision-theory reading group has been pushing this argument at me for a week and I can't find the broken step, but the conclusion has to be wrong.

  Background, so we agree on the target: Good's theorem, the value-of-information result, says roughly that if you're an expected-utility maximizer and you're handed a signal for free, your expected utility measured *before* you see it can't go down. The proof is just: whatever act was optimal before is still on the menu after you see the signal, so you can always do that, and the signal can only let you do better.

  (1) Fine. But note the fine print: 'free' has to mean the signal changes nothing except what you know. No fee, no delay, no new acts, none taken away, no change in your tastes, no change in what your acts *do*.

  (2) Counterexample anyway. You trade a stock that's at 10 today and will be 20 or 8 tomorrow, 50/50. With no tip you buy: expected profit .5(10) + .5(-2) = 4, versus 0 for sitting out. A friend offers to tell you tomorrow's price, truthfully, for nothing. If you take the message you get wall-crossed and compliance bars you from the trade altogether. So accepting it moves you from 4 to 0. (If the compliance rule didn't exist, the very same tip would be worth +1: you'd buy only in the good state, for expected profit 5 instead of 4.) So here's a perfectly informative, costless message that strictly lowers your expected utility, and you'd pay a dollar not to be told.

  (3) The obvious reply is: that message wasn't free, it deleted the act 'buy'. He says this reply eats the theorem.

  (4) What is it for an act to be 'deleted'? After you learn something, there are always acts you wouldn't do anymore — that's just what learning is. If hearing 'it'll be 8' counts as deleting 'buy', then *every* informative signal changes your menu, clause (1) is never satisfied, and the theorem has no instances at all.

  (5) And if 'deleted' means genuinely, legally infeasible — compliance really does make buying impossible — then (2) is a straight counterexample and the theorem is false, since (1) was satisfied in every other respect.

  (6) It gets worse, because the same thing happens with nothing illegal in sight. Suppose that once you know the price your face gives it away and the dealer on the other side adjusts. If you know it's going to 20 your eyes light up and he won't sell at 10; if you don't know, your face is blank and he does. Nothing became infeasible, your tastes didn't change, the message cost nothing, and you're still worse off for knowing.

  (7) And here's the bit that actually keeps me up. Look at the proof again. It compares 'see the signal and act on it' with 'see the signal and do the old optimal act anyway'. Both of those are worlds in which the message arrives. It never compares a world where the message arrives with a world where it doesn't. So even in the clean case the theorem doesn't say you should accept free information; it says that if the message is reaching you anyway, you may as well use it.

  (8) So: either the theorem is vacuous, or it's false, or it doesn't say what everyone cites it for.

  I want to keep the theorem. I think it's true and I think it has content, and I'd rather give up the trader than give up the theorem — but every time I try, 'free' quietly turns into 'free in whatever sense the theorem needs', which feels like cheating.

  So: which step do I reject, and why did it look fine? Is (6) really a different case from (2), or the same case in different clothes? And if I give up the trader, what am I committed to about, say, people who turn down a scan for something untreatable — are they being incoherent, or is that a separate thing entirely?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're stuck on a counterargument against Good's theorem in their decision-theory group. The core issue is that in their examples, receiving free information seems to lower expected utility, which contradicts the theorem. The user wants to preserve the theorem but can't find where the counterargument fails.

  First, I need to recall Good's theorem clearly. It states that for an expected-utility maximizer, getting free information (with no side effects) shouldn't reduce expected utility. The proof hinges on the fact that you can always ignore the new information and stick with your original optimal action. So any benefit from the signal comes from being able to choose better, but ignoring it leaves you no worse off.

  Looking at the user's examples: in (2), accepting the tip triggers compliance rules that block the trade. The user argues this makes the act of buying infeasible. Their friend claims that if "deleted act" means acts you wouldn't choose post-signal, then every informative signal changes the menu, making the theorem vacuous. But if "deleted" means genuinely infeasible, then (2) is a counterexample.

  I think the key is distinguishing between epistemic and physical feasibility. Post-signal, some acts might be irrational, but they're still physically doable. In (2), compliance makes buying physically impossible. That violates the "no new constraints" part of the theorem's assumptions. So (2) isn't a counterexample because the information isn't truly free—it comes with a new constraint.

  In (6), the dealer reads the trader's face. Here, the physical act of buying at $10 is still possible, but the dealer's response changes the outcome. The user might think this is different, but actually, it's the same issue. The information changes how the world responds to actions, altering the consequences. Buying at $10 when the dealer knows leads to a different outcome than when he doesn't. So the act "buy" now has state-dependent consequences, which violates the "no change in what acts do" clause.

  The user's point (7) is crucial. The theorem compares pre-signal expected utility with post-signal expected utility conditional on the signal. It doesn't compare worlds where the signal is sent versus not sent. In both (2) and (6), sending the signal changes the game. The theorem applies only after the signal is sent, not to the decision to receive it.

  So, rejecting the trader examples is necessary because they violate the theorem's assumptions. The user worries this makes the theorem vacuous, but it doesn't. Truly free information, like a sealed envelope with no side effects, would satisfy the conditions. The theorem still has content—it shows that learning can't hurt if it only updates beliefs without altering the decision problem.

  For the medical scan example: declining a scan for an untreatable condition isn't incoherent if the scan itself causes distress or costs money. But if it's truly free and no side effects, refusing might be dynamically inconsistent, though understandable due to anxiety. The theorem doesn't judge that; it assumes full rationality.

  The user's deeper need might be to reconcile the theorem with real-world cases where information has hidden costs. They want to defend the theorem's validity while acknowledging practical exceptions. Emphasizing the strict "no side effects" condition addresses this.
answer: |-
  Your reading group member's argument is clever but contains a critical flaw. The core issue is a misinterpretation of what constitutes "free information" under Good's theorem. Let's break this down step-by-step, preserving the theorem while showing why the counterexamples fail. **Reject step (4) and (6) as misapplications of the theorem**, and clarify why (2) and (7) don't threaten the result.

  ### The Crucial Distinction: "Epistemically Undesirable" vs. "Physically Infeasible"
  - **Good's theorem requires acts to remain *physically feasible* post-signal**, not just epistemically rational. The proof relies on you being *able* to choose the original optimal act, even if you *wouldn't* rationally do so after learning the signal.  
  - **In your examples, the signal alters the *physical consequences* or *feasibility* of acts**, violating clause (1). This isn't "learning" in the pure sense; it's changing the decision problem itself.  

  ### Why Your Counterexamples Fail
  1. **Compliance Example (2)**:  
     - Accepting the tip *physically removes* the act "buy" due to compliance rules. This violates "no acts taken away" in clause (1).  
     - **The theorem isn't applicable**: Information isn't "free" if it triggers external constraints. You're rejecting the trader correctly here.  

  2. **Dealer Adjusts to Your Face (6)**:  
     - This seems different but isn't. The act "buy at 10" is still physically possible, but its *consequences change* based on your knowledge:  
       - If you *don't know* the price, buying at 10 yields profit `(20 - 10)` or `(8 - 10)`.  
       - If you *know* the price, buying at 10 yields `0` (dealer refuses) or `(8 - 10)`.  
     - **This violates "no change in what your acts *do*"** in clause (1). The act "buy" now has state-dependent outcomes tied to your knowledge.  
     - **Not a counterexample**: The signal alters the world, not just your beliefs.  

  3. **The "Deleted Acts" Confusion (4)**:  
     - "Deleting" an act means making it **physically infeasible** (e.g., compliance blocking it). Good's theorem allows acts to become *irrational* post-signal but requires them to remain *doable*.  
     - **Clause (1) is satisfied in real cases**: E.g., receiving a sealed envelope with a stock tip. You can still buy/sell as before—you just wouldn't rationally do so after reading it. The theorem holds here.  

  ### Resolving the "Vacuous or False" Dilemma (7, 8)
  - **The theorem isn't vacuous**: It applies when information *only updates beliefs* without altering feasibility, consequences, or preferences. Example:  
    > *You must trade tomorrow. A free, secret signal tells you if the stock goes to 20 or 8. Pre-signal EU = 4 (buying blindly). Post-signal, you can still buy (or not) and earn EU = 5 (buy only if 20). Pre-signal EU increases from 4 → 5.*  
    Here, "buy" remains feasible—you just conditionally reject it.  
  - **It doesn't say "always accept information"**: The theorem compares EU *before seeing the signal* to EU *after seeing it*, assuming the signal arrives. **It does not evaluate the *decision to acquire* the signal**—that decision might have costs (like wall-crossing). This is why (7) is correct but irrelevant: the theorem is about *using* free information, not *obtaining* it.  

  ### Medical Scans and Dynamic Consistency
  - **Untreatable scan example**: If the scan is free and has no side effects, declining it *is* dynamically inconsistent for an EU maximizer. But:  
    - People might rationally decline due to **non-EU preferences** (e.g., anxiety costs).  
    - If the scan itself causes distress, it violates "no change in tastes" or "no fee."  
  - **The trader vs. medical scan**: Both fail Good's theorem’s premises if there are hidden costs. If truly free (e.g., a painless, costless, secret scan), refusing *is* incoherent for an EU maximizer—but humans aren't perfect EU maximizers.  

  ### Conclusion: What to Reject and Why
  - **Reject (4) and (6)**: They conflate *physical* feasibility with *epistemic* desirability. Acts becoming irrational ≠ acts becoming impossible.  
  - **Accept (2) and (5)**: Compliance *does* make buying infeasible, so the theorem doesn't apply. This isn't cheating—it's enforcing the premises.  
  - **Clarify (7)**: The theorem is about *conditional* EU (if the signal arrives), not *unconditional* EU (whether to receive it).  
  - **The trader is rejected**: Their information isn't "free" under clause (1). True free information *always* weakly improves pre-signal EU.  

  **Why it looked fine**: The examples exploit ambiguity in "free" and "act." By distinguishing *physical possibility* from *rational choice*, and *outcome independence* from *belief updating*, the theorem holds with real content. The trader cases aren’t counterexamples—they’re violations of the setup. Good's theorem remains robust: pure knowledge never harms, but "knowledge with strings attached" might.  

  For your group: Argue that in a *causally neutral* world (no compliance, no face-reading dealers), the theorem stands. If information changes the game, it’s not free.
