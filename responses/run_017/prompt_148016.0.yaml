answer: |-
  Below is a precise analysis of your desert problem, designed to resolve the tension between your intuitions and your brother-in-law's results-only view. The core principle I defend prioritizes **agential contribution** over raw outcomes, addressing your cases while acknowledging trade-offs. I'll first present the principle and its application, then the requested JSON.

  ---

  ### **Defended Principle**  
  *A person deserves basic credit for an outcome to the degree that it reflects their intentional, effortful exercise of developed capacities under their control, with credit diminished when the outcome depends on unearned advantages that (a) could have been allocated to others, and (b) bypassed a fair opportunity for others to contribute.*

  ---

  ### **Clause Breakdown**  
  | Clause | Motivating Case | Cost (What It Commits To) |
  |--------|-----------------|---------------------------|
  | **Intentional exercise of agency** | Accidental hero (Case 4): Credit requires intent. Dropping a plank carelessly isn't agency; it's luck. | Excludes good outcomes from coincidental actions (e.g., a distracted worker accidentally improving a process). |
  | **Effortful development of capacities** | Natural gift (Case 2): Raw talent isn't discounted because the singer *developed* it through 15 years of brutal training. | Requires judging how much effort "counts" (e.g., is 10 years of training "enough" to deserve full credit?). |
  | **Unearned advantages that displace others** | Nepotism (Case 1): The son’s opportunity was unearned *and* denied a fair shot to equally qualified others. | Forces case-by-case fairness judgments (e.g., was a colleague *truly* equally qualified?). |
  | **Control over outcome** | Lucky territory (Case 3): The salesperson controlled their actions but not the territory boom. No extra credit for luck. | May undervalue preparedness for rare opportunities (e.g., a salesperson researching a territory before it booms). |
  | **Effort as separate desert base** | Effort without aptitude (Case 6): Hard work deserves recognition *as effort*, even if results are poor. | Risks conflating moral praise (for effort) with performance credit (for results). |

  ---

  ### **Case Analysis Table**  
  | Case | Your Verdict | Principle’s Verdict | Match | Load-Bearing Feature | Repair Needed? |
  |------|--------------|---------------------|-------|----------------------|---------------|
