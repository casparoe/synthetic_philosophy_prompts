prompt: |-
  I work in operations for a mid-sized freight company — mostly building driver schedules and assigning routes — and for several years now I have been arguing with my brother-in-law about who actually deserves what at work. He thinks the whole question is easy: pay and praise should track results, and everything else is an excuse. I think results are the wrong thing to look at, but I cannot say what the right thing is, and whenever I try to write down a principle it either swallows his view whole or collapses into mush. I have been reading around on my own (no philosophy background, so please translate jargon), and I have gotten as far as a distinction I have seen drawn between institutional desert — what a company or a prize committee has reason to award by its own rules — and something called basic desert, the thing that would make it fitting for a person to get credit or blame apart from any institution handing it out. I suspect my verdicts keep sliding between the two, but I am not sure. Here are my gut verdicts on a set of cases, including two I keep going back and forth on, and after them the principle I have been trying out.

  1. Nepotism. A manager gives her son the plum account; he then does the work genuinely well and the account does great. My verdict: he deserves less credit than the colleague who would have done the job at least as well and was passed over, even though the results were identical and even though he worked hard once he had the account.
  2. Natural gift. A singer is born with an unusual voice, trains brutally for fifteen years, and becomes excellent. My verdict: she deserves the acclaim fully, with no discount for the fact that the raw material was pure luck. This sits badly next to case 1, because in both cases an unearned advantage was causally necessary for the result, and in both cases the person then worked hard.
  3. Lucky territory. Two salespeople of equal skill and effort work identical hours; one closes a huge deal only because her territory happened to contain a booming new development. My verdict: she is entitled to the commission under the company's rules and it would be wrong to claw it back, but she does not really deserve credit as a salesperson for the difference.
  4. Accidental hero. Someone carelessly drops a heavy plank, which jams a mechanism and stops a vehicle from hitting a child. My verdict: no credit at all, not even a little, despite the outcome and despite the fact that his action made all the difference in the world.
  5. Inseparable team. Five people build a product where every one of them was indispensable but nobody's individual contribution can be pulled apart from the others — the value only exists in the combination. My verdict: an equal split feels right, and I am suspicious of a formula I read about, from cooperative game theory (the Shapley value, I think), for dividing a joint surplus by averaging each person's marginal contribution over all the orders in which they could have joined. That formula looks elegant but I cannot tell whether it is describing what fairness requires or just what a certain kind of bargaining would produce.
  6. Effort without aptitude. Someone works extremely hard at a technical job and produces mediocre results, while a colleague who coasts produces excellent ones. My verdict: the hard worker deserves something — recognition of a kind — but not the bonus, and I am unsure whether the something is credit or merely encouragement, given that his capacity for sustained effort is itself largely a product of how he was raised.
  7. Retroactive defeat. Someone does a genuinely great piece of work and is later revealed to have treated people appallingly in private, or uses the work's fruits harmfully. My verdict: I do not want to say the credit for the work is cancelled, but I also do not want to say the person is owed the same esteem. I cannot get these into one sentence.

  The principle I have been trying out is this: a person deserves credit for an outcome in proportion to the difference their choices made to it, counting counterfactually (what happened with them acting as they did, against what would have happened without them), discounted by any advantage they did not earn — but only where the advantage was the kind that someone else could have had instead of them — with costly effort counting as a separate, smaller desert base of its own. Case 4 suggests the counterfactual part is wrong or at least incomplete, and I cannot say what replaces it.

  What I would like: the principle, or the two or three best candidates, stated precisely enough that I could apply it myself, with the case that motivates each clause and the cost of each clause (what it commits me to that I might not like). Build me a table with the columns case, my verdict, verdict under your principle, match (exact, partial, or none), the load-bearing feature of the case that produces that verdict, and whether your principle needed repair to get there. Then, for the case set as a whole, tell me which single feature is doing most of the work, what happens if I remove it, and how a defender of my brother-in-law's results-only view would attack my cases rather than my theory. I would also like your principle run on two cases I have not listed: a designer who produces excellent work using a heavy AI assistant that does most of the drafting, and a person who gives up a promising career to care for an injured sibling for a decade — does the sacrifice itself add to what she deserves, or is that the wrong question? And tell me whether your principle is symmetric: does whatever handles credit also handle blame, or does it only work on one side?

  Finally, please give me a JSON object with exactly these fields: principle (one sentence, the version you would defend); clauses (an array of objects, each with clause, motivating_case, and cost); desert_base (a short string saying what the base of desert is on your account); credit_blame_symmetry (a short string); new_case_verdicts (an object with keys ai_assisted_work and caregiver_sacrifice, each a short string with the verdict and one-line reason); verdicts_overturned (an array of the case labels among mine that your principle cannot accommodate, with one line each on why); settled (what is genuinely agreed among people who work on this); contested (what is disputed, phrased so that I can tell it is disputed); and speculative (anything above where you are guessing). Please keep the settled/contested split honest: I would rather know that something is a live fight than be handed one side of it as though it were the consensus, and if my whole question rests on a confusion, say that too.
reasoning: |-
  We are dealing with a complex issue of desert (deservingness) in the context of work and outcomes. The user has provided several cases and a tentative principle, and is seeking a refined principle that can account for their intuitive judgments across these cases.

  Key observations from the cases:
  1. **Nepotism**: The son got the account due to nepotism and performed well. Verdict: less credit than a passed-over equally qualified colleague.
  2. **Natural gift**: A singer with innate talent who trains hard deserves full acclaim. This seems to conflict with case 1 because both involve unearned advantages (nepotism vs. natural talent).
  3. **Lucky territory**: The salesperson gets the commission by rule but doesn't deserve extra credit for the lucky break.
  4. **Accidental hero**: No credit for accidentally causing a good outcome.
  5. **Inseparable team**: Equal split feels right, despite a theoretical method (Shapley value) that might assign different marginal contributions.
  6. **Effort without aptitude**: The hard worker deserves recognition but not the bonus. The effort itself may be due to upbringing (unearned?).
  7. **Retroactive defeat**: The work itself deserves credit, but the person might not deserve the same esteem due to later revelations.

  The user's tentative principle: 
    Desert is proportional to the counterfactual difference one's choices made to the outcome, discounted by unearned advantages (but only if the advantage is the kind that someone else could have had), and with effort as a separate, smaller desert base.

  Problems with the tentative principle:
  - Case 4 (accidental hero) shows that the counterfactual difference alone isn't sufficient because the outcome was accidental, not due to the agent's choice or control.
  - The discount for unearned advantage is applied in case 1 (nepotism) but not in case 2 (natural gift). The principle must explain why natural gift isn't discounted but nepotism is.

  After considering philosophical accounts (e.g., control, responsibility, fairness, and institutional rules), I propose a principle that focuses on **agency and control**:

  **Principle (to defend):** 
  A person deserves credit for an outcome in proportion to the extent to which the outcome was under their control, specifically through their intentional actions that reflect their agency (including effort and skill they have developed), and where the outcome is a foreseeable result of such actions; unearned advantages that are not the result of the agent's own development or choices do not diminish desert unless they replace what would otherwise be required from the agent's own agency (as in case 1, where the advantage bypassed a fair opportunity for others).

  But note: The user's case 2 (natural gift) is tricky because the raw material was luck, but the development of the talent was under the agent's control. The principle must account for the fact that the agent has integrated the natural gift through their effort and training.

  Alternatively, we might draw on the distinction between institutional and basic desert. However, the user's cases mix both. For instance, case 3 (lucky territory) distinguishes between institutional entitlement (commission) and basic desert (credit as a salesperson). 

  I propose a two-tiered principle:

  **Defended Principle (one sentence):**
  A person basically deserves credit for an outcome to the degree that the outcome is attributable to their agential contribution (the exercise of their developed capacities and effort under their control) and was intended or reasonably foreseeable, while institutional desert is determined by the rules of the institution, which may diverge from basic desert for reasons of incentive, efficiency, or fairness.

  However, the user is asking for a principle that can handle both institutional and basic desert? But note the cases: 
  - Case 1: basic desert (credit) 
  - Case 3: both (entitlement vs. credit) 
  - Case 5: institutional? (how to split the surplus) 
  - Case 6: basic desert (credit) and institutional (bonus) 

  Given the complexity, I will focus on basic desert for credit and blame, and then note institutional desert where relevant.

  **Refined Principle for Basic Desert:**
  A person basically deserves credit for an outcome if and only if (a) the outcome was caused (in the right way) by their intentional action, (b) the outcome was within the scope of what they were trying to achieve or was a foreseeable result of their action, and (c) the action and the capacities exercised in it are attributable to the agent (i.e., they are not merely accidental or the result of an unintegrated external factor). The degree of desert is proportional to the degree of control and the quality of the agential contribution (including effort and developed skill), discounted by the extent to which the outcome depended on factors not under the agent's control (especially if they are unearned and replace the need for agential contribution).

  Now, let's break down the clauses:

  - **Clause (a)**: Causation. The outcome must be caused by the agent's action. (Motivating case: Accidental hero (case 4) fails because the outcome was not caused in the right way — it was accidental.)
  - **Clause (b)**: Intentionality/foreseeability. The outcome must be intended or foreseeable. (Motivating case: Accidental hero fails because the outcome was not intended or foreseeable. Also, in natural gift (case 2), the singer intends to achieve excellence through training.)
  - **Clause (c)**: Attributability. The action and the capacities must be attributable to the agent. (Motivating case: Natural gift (case 2) — the gift is unearned, but the development of it through training is attributable. In nepotism (case 1), the son's effort is attributable, but the opportunity was not earned and was given arbitrarily, so it diminishes the credit because the opportunity was not attributable to his agency. Also, in effort without aptitude (case 6), the effort is attributable, but the lack of aptitude is not the agent's fault, so the agent deserves credit for the effort but not for the outcome which was beyond their control.)

  But note: In case 1, the son did cause the outcome and it was intentional and foreseeable. So why less credit? The principle must also account for the fact that the opportunity was not earned and was given in a way that unfairly excluded others. This introduces a fairness element. 

  Alternatively, we can think of the credit for the outcome as being shared between the agent and the circumstances. In the nepotism case, the mother's choice (external factor) played a key role in enabling the outcome, so the son's agency is only part of the story. In the natural gift case, the gift is a background condition that the agent then develops — it is integrated into the agent's own capacities.

  Thus, we can add:

  - **Clause (d)**: The agent's contribution must not be unduly dependent on unearned advantages that are not integrated into the agent's own development and that could have been available to others. (Motivating case: Nepotism (case 1) — the opportunity was unearned and could have gone to someone else. Natural gift (case 2) — the gift is integrated through training and is not something that could have been given to someone else.)

  Now, let's test the cases:

  1. **Nepotism**: 
     - Under the principle: The son's actions caused the outcome (a), it was intentional (b), and the effort is attributable (c). However, the opportunity was an unearned advantage that could have been available to others (d) and was not integrated (it was given arbitrarily). Thus, desert is diminished. Verdict: less credit -> matches.

  2. **Natural gift**:
     - The outcome was caused by her actions (a), intended (b), and the capacities are attributable because she developed them through training (c). The natural gift is an unearned advantage, but it is not the kind that someone else could have had (it's innate and not transferable) and it has been integrated through her effort. Clause (d) does not apply. Verdict: full credit -> matches.

  3. **Lucky territory**:
     - The outcome (the huge deal) was caused by her actions (a), intended (b), and her skill and effort are attributable (c). However, the outcome depended heavily on the territory (an unearned advantage that could have been assigned to someone else) and was not under her control. Clause (d) applies: the advantage (territory) was not integrated (it was luck) and could have been given to the other salesperson. So, she does not deserve credit for the part due to luck. Verdict: no extra credit for the lucky part -> matches.

  4. **Accidental hero**:
     - The outcome was caused by his action (a) but not intended or foreseeable (b fails). Also, the action (carelessly dropping the plank) does not reflect his agency in a way that we would credit (it was careless, not a deliberate act). Verdict: no credit -> matches.

  5. **Inseparable team**:
     - The outcome is caused by the team collectively (a), intended (b), and each member's contribution is attributable (c). But the individual contributions cannot be separated. The principle does not directly dictate how to split credit. However, if no one can be said to have more control than the others, then equal split is reasonable. The Shapley value might be a way to measure marginal control, but the user is suspicious. We might say that in such cases, basic desert is collective and individual desert is equal because each was indispensable and the outcome required the same level of agency from each. Verdict: equal split -> matches.

  6. **Effort without aptitude**:
     - The outcome (mediocre results) was caused by his actions (a), intended (b), and the effort is attributable (c). However, the outcome was not under his full control because of lack of aptitude (an unearned disadvantage? but note: lack of aptitude is not an advantage that could have been given to someone else). The principle says credit is proportional to control. He had control over his effort, but not over the outcome. So he deserves credit for the effort (as a separate desert base) but not for the outcome. Verdict: recognition for effort but not the bonus -> matches.

  7. **Retroactive defeat**:
     - The work itself was caused by the person's actions (a), intended (b), and the capacities are attributable (c). The later revelations about misconduct do not change the fact that the work was done. However, the esteem for the person might be affected by their overall character. Basic desert for the work remains, but the person may not deserve the same overall esteem because of their other actions. The principle as stated does not cover the overall person, only the specific outcome. So we can say: credit for the work remains, but the person might not deserve esteem as a person. Verdict: matches the user's split.

  Now, let's build the table:

  | Case | User's Verdict | Principle's Verdict | Match | Load-Bearing Feature | Repair Needed? |
  |------|----------------|---------------------|-------|----------------------|---------------|
  | 1. Nepotism | Less credit for son | Less credit for son | Exact | Unearned advantage that could have gone to another and was not integrated | No |
  | 2. Natural gift | Full credit | Full credit | Exact | Unearned advantage (gift) was integrated through effort and not transferable | No |
  | 3. Lucky territory | No extra credit for the lucky part | No extra credit for the part due to luck | Exact | Outcome heavily depended on unearned, non-integrated advantage (territory) that could have been assigned to another | No |
  | 4. Accidental hero | No credit | No credit | Exact | Lack of intentionality and foreseeable outcome | No |
  | 5. Inseparable team | Equal split | Equal split (if agency is symmetric) | Partial | The principle does not specify how to handle joint production, but if we assume symmetric agency, then equal. However, the Shapley value might be more precise but the user is suspicious. | Maybe: the principle could be extended to note that when individual contributions are indistinguishable, equal split is fair. |
  | 6. Effort without aptitude | Recognition for effort, not bonus | Credit for effort (separate desert base), not for outcome | Exact | The outcome was not under his control, but the effort was. | No |
  | 7. Retroactive defeat | Credit for work remains, but not same esteem | Credit for work remains (as per the outcome), but overall esteem may be reduced by other factors | Exact | The principle is about specific outcomes, not the whole person. | No |

  For case 5, the match is partial because the principle does not explicitly say how to split when contributions are inseparable. But the user's intuition is that equal split is fair, and the principle can accommodate that by saying that each member had equal agential contribution (since each was indispensable and the agency was collective). So we don't need repair.

  **Which single feature is doing most of the work?**
  The concept of "agential contribution" (specifically, the controlled and attributable exercise of agency) is central. If we remove it, we lose the distinction between cases like natural gift (where the gift is integrated) and nepotism (where the opportunity is not integrated), and we might also fail on the accidental hero case.

  **How would a results-only defender attack the cases?**
  The brother-in-law would argue that results are all that matter. For example:
  - Case 1: The son produced the same results as the colleague would have, so he deserves the same credit.
  - Case 2: The singer's results are due to her natural gift and hard work, but the gift is part of what she brings to the table, so results are what count.
  - Case 3: The salesperson closed the deal, so she deserves the credit and commission.
  - Case 4: The outcome was good, so the person deserves some credit (even if accidental).
  - Case 5: The results are the team's, so the split should be based on what each contributed to the result (if we can measure it, e.g., Shapley value).
  - Case 6: The worker produced mediocre results, so he doesn't deserve the bonus; the other produced excellent results, so he does.
  - Case 7: The work was done and the results were great, so the credit remains.

  The brother-in-law might say that the user is introducing subjective elements (like control and intention) that are not measurable and that the focus on results is clear and objective.

  **New Cases:**

  - **AI-assisted work**: A designer produces excellent work using a heavy AI assistant that does most of the drafting.
