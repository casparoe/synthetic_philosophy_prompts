    *Verdict*: **Deserves credit for the sacrifice itself**. The choice reflects agency and effort, making the outcome (care) attributable to them. The sacrifice *adds* to desert because it’s a costly exercise of moral capacity.  

  **Credit-Blame Symmetry**: **Mostly symmetric**. Blame requires the same conditions (control, intent) but is stricter—e.g., accidental harm may still incur *responsibility* but not full blame.  

