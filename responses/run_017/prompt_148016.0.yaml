  | 7. Retroactive defeat | Credit for work, not esteem | Credit for work remains | Exact | Work reflects past agency; later acts are separate | No |

  **Key Feature Doing the Work**: **Control**. It distinguishes earned (effort, developed skill) from unearned (luck, nepotism) factors. Removing it collapses into results-only or effort-only views, ignoring luck and privilege.  

  **Brother-in-Law's Attack on Cases**:  
  He would reject cases 1, 3, 4, and 6 for "ignoring results":  
  - *Case 1*: "The son delivered identical results—why punish him?"  
  - *Case 3*: "She closed the deal—territory luck is part of the job."  
  - *Case 4*: "The child was saved—outcome trumps intent."  
  - *Case 6*: "Mediocre results don’t deserve rewards, hard work or not."  

  ---

  ### **New Cases**  
  - **AI-Assisted Work**:  
    *Verdict*: **Reduced credit**. The designer’s agency (prompting/editing) is real but the AI’s drafting diminishes their control over the outcome.  
