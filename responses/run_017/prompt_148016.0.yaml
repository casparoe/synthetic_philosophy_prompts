  - **Caregiver sacrifice**: A person gives up a promising career to care for an injured sibling for a decade.
    - Verdict: The sacrifice itself does not directly produce an outcome that we typically credit (like a work achievement), but the person deserves praise and recognition for the sacrifice. This is because the sacrifice reflects the agent's character and commitment (agential contribution). However, note that desert is usually for outcomes, but here the outcome is the care provided. The person deserves credit for the care provided, which is the outcome of their sacrifice. But the sacrifice itself is a manifestation of their agency and thus deserves moral credit. Reason: The outcome (care) is caused by the agent's intentional action and reflects their agency, and the sacrifice is a costly effort that is attributable to the agent.

