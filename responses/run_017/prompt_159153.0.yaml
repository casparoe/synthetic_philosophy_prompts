prompt: |-
  hey — I'm on the small committee that decides how a roughly $3M pot gets split across maybe five two-year projects, and it's the theory end of the org: decision theory, formal guarantees, epistemics of evaluation, the conceptual side of safety cases — not empirical ML. The argument we keep having and never resolving is worst-case vs average-case guarantees, and I want your view on which open questions here are actually worth money.

  Where I'm stuck, so you know what I already believe and can tell me where I'm wrong. Worst case over all inputs looks useless: anything with real capability can be pushed into bad behavior on some input, so the claim is either vacuous or unachievable, and people mostly invoke it as a rhetorical standard rather than something they expect to meet. Pure average case looks gameable: you look great on the distribution you were evaluated on and awful on the one you get deployed on. And in our case I don't think the deployment distribution is even a fixed object — these systems write a lot of the code, draft a lot of the documents, and generally shape what tasks get handed to them next, so the "average" is partly their own output. I've started calling that the self-consuming average and people have started using it back at me, which worries me, because I can't tell whether it names a real problem or is just a way of making average-case sound deeper than it is.

  Some candidate questions floating around, which you should feel free to reorder, merge, or say are junk:

  - what the input set for a worst-case claim should even be. Worst case over "inputs a competent operator would plausibly produce"? Over everything a red team with compute budget B can find? Is B a principled knob or just a fudge factor we tune until the claim comes out true?
  - whether there's a genuinely useful middle notion — guarantees over a set of distributions rather than over inputs — and when that collapses back into worst case versus when it's actually cheaper to satisfy.
  - whether an average-case guarantee is even well-defined when the deployment distribution is partly a fixed point of the system's own behavior, and if not, what a fixed-point-relative guarantee would look like and whether anything about it is tractable.
  - composition. Worst-case guarantees for components generally don't compose into a worst-case guarantee for the assembled system, and average-case ones only compose under independence assumptions that visibly fail here. Is there a notion that composes, or do we just accept that the system-level claim will always be weaker than the parts?
  - whether "average-case guarantee plus a worst-case-triggered shutdown" is a real third thing or just two weak claims stapled together.
  - the regulatory end: what a safety case can honestly assert. Is "no bad behavior on any input our red team found with budget B" the sort of sentence that should appear in a filing, and is work on making claims like that legible and non-misleading worth funding?
  - whether the distinction is even tracking what we care about. Maybe what we want is a bound on the probability of catastrophe under deployment, which is neither worst case over all bad behavior nor average case frequency-weighted, and maybe that frame should just eat both.

  What I want from you: given that pot, that timeframe, and that kind of researcher, rank the questions you'd fund and defend the ranking. I care much less about the list than about the reasoning — for each one, what it's upstream of, whether it's tractable for people who do math and philosophy rather than large-scale experiments, how neglected it is, and what you'd watch over the next two years that would move it up or down. Also tell me explicitly which of these you would NOT fund and why, including — if this is your view — that the worst-case/average-case framing is the wrong frame and the money should go somewhere else entirely. And if "self-consuming average" is a confused concept, say so and say what the right version of the point is; I'd rather find out from you than from a referee.

  One format thing: lead with your bottom line in the first sentence — the allocation you'd actually recommend, in order — then give the reasoning. No preamble, no restating my question back to me.
reasoning: |-
  Okay, the user is part of a committee allocating $3M across theoretical AI safety projects focused on decision theory, formal guarantees, etc. The core debate is worst-case vs average-case guarantees, and they've described several candidate questions. They want a prioritized funding list with clear reasoning.

  First, I need to understand their key concerns. They think worst-case guarantees are either vacuous or unachievable because capable systems can always be forced into bad behavior. Pure average-case is gameable since deployment distribution isn't static—it's influenced by the system's own outputs, which they call "self-consuming average." This seems like a crucial insight. The deployment environment co-evolves with the AI, making traditional average-case problematic.

  Looking at their candidate questions:
  - Defining input sets for worst-case claims: Is "competent operator" inputs better than red teaming with budget B? How principled is B?
  - Middle notions between worst/average case: Guarantees over sets of distributions. When does this help vs collapse?
  - Self-consuming average: Is the average-case well-defined when deployment distribution is a fixed point? Can we define fixed-point-relative guarantees?
  - Composition: Neither worst nor average compose well. Is there a composable notion?
  - Hybrid approach: Average-case plus worst-case triggered shutdown—is this meaningful or just two weak claims?
  - Regulatory angle: Can claims like "no bad behavior found by red team with budget B" be used in safety cases? Is making such claims legible worthwhile?
  - Is the worst/average frame even right? Maybe we need catastrophe probability bounds instead.

  The user's meta-concern: They coined "self-consuming average" and worry it might be confused. They want validation if this is a real problem or just jargon. Also, they need explicit no-fund recommendations.

  Prioritizing requires assessing impact, tractability, and neglect. The self-consuming average issue seems fundamental. If the deployment distribution isn't stable, average-case guarantees are misleading. This question (#3) could reframe the entire debate. It's upstream of many practical concerns and leans on math/philosophy—ideal for their researchers. Plus, it's likely neglected because most work assumes static distributions.

  Next, catastrophe probability bounds (#7). This directly addresses their worry that worst/average might miss the point. Catastrophe probability isn't just frequency-weighted; it could incorporate severity. This reframe might dissolve the old dichotomy. High impact if it leads to new formalisms.

  Then, composition (#4). Without composition, system-level guarantees are weak. If we solve this, component guarantees could scale. Tractability: math-heavy, suitable for their team.

  Distributional robustness (#2) might offer practical middle grounds. If it doesn't collapse to worst-case, it could be cheaper to achieve. Worth exploring.

  Regulatory aspects (#6) matter for real-world adoption. Making red team claims non-misleading is important but might be downstream. Still, if they fund theory, this could be applied later.

  Hybrid approaches (#5) seem like stapled-together solutions. Without formal integration, it's just two weak claims. Probably not worth heavy investment.

  Defining input sets (#1) feels like tweaking parameters. Budget B is arbitrary; "competent operator" is vague. Likely leads to dead ends.

  Not funding: #1 and #5. #1 is too narrow; #5 lacks substance without deeper integration.

  On "self-consuming average": It's not confused. It captures that the AI shapes its input distribution, creating a feedback loop. The right term might be "endogenous distribution shift" or "feedback-affected distribution," but the concept is valid. Funding #3 could formalize this.

  Allocation order: #3 (self-consuming average) first, then #7 (catastrophe bounds), #4 (composition), #2 (distributional robustness), #6 (regulatory), skip #1 and #5.

  Reasoning: #3 is foundational. If deployment isn't fixed, everything else rests on sand. #7 reorients towards actual safety goals. #4 enables scaling. #2 might offer practical tools. #6 ensures real-world relevance.

  Monitoring: For #3, watch for fixed-point models. For #7, look for severity-weighted frameworks. For #4, component-based proofs. If progress stalls, shift funds.

  Bottom line: Fund in this order: 3,7,4,2,6. Avoid 1 and 5. The self-consuming average is a real problem needing formalization.
answer: |-
  **Funding allocation order: 3 (self-consuming average fixed points) > 7 (catastrophe probability bounds) > 4 (composition) > 2 (distributional robustness) > 6 (regulatory legibility)**  
  **Do not fund: 1 (input set definition), 5 (hybrid shutdown)**  

  ### Reasoning  
  1. **Prioritized Questions (Ranked)**  
     - **#3: Self-consuming average fixed points (Highest priority)**  
       - **Why**: Directly addresses your core unease about deployment distributions being co-created by the system. This isn’t jargon—it’s the central flaw in naive average-case analyses for autonomous systems. Funding here targets *tractable formalism*:  
         - *Upstream impact*: If deployment distributions are endogenous, all guarantees (average/worst-case) are ill-defined without modeling feedback loops. Solving this could redefine evaluation paradigms.  
         - *Tractability*: Math/philosophy teams can model this as a fixed-point problem (e.g., via dynamical systems or game-theoretic equilibria). Initial work could define "stability conditions" under which self-influenced distributions converge.  
         - *Neglect*: Highly neglected; most ML safety assumes static distributions.  
         - *Watch for*: In 2 years, a formal model of distributional drift under AI influence would signal progress. Downgrade if no convergence proofs emerge.  
       - **Allocation**: $1M—supports 2–3 senior researchers for foundational work.  

     - **#7: Catastrophe probability bounds (Second priority)**  
       - **Why**: The worst/average dichotomy *is* misleading; you care about tail risks. This reframes safety as "bounding P(catastrophe)" under deployment, which subsumes both frames:  
         - *Upstream impact*: Forces severity-weighting (e.g., high harm on rare inputs outweighs frequent minor errors). Connects to real-world outcomes like existential risk.  
         - *Tractability*: Decision theory excels here (e.g., leveraging extreme value theory or info-gap models). Avoids ML experiments.  
         - *Neglect*: Underexplored in theoretical AI safety; climate/engineering analogs exist but aren’t adapted.  
         - *Watch for*: Formal severity-aware metrics emerging within 18 months. If intractable, pivot to heuristics.  
       - **Allocation**: $800K—funds workshops + 2 postdocs.  

     - **#4: Composition (Third priority)**  
       - **Why**: Without composition, component guarantees are theater. Independence assumptions *do* fail in systems with feedback:  
         - *Upstream impact*: Enables modular safety cases. Focus on *robust composition* (e.g., contract-based designs where components tolerate distribution shifts).  
         - *Tractability*: Math-heavy (category theory, probabilistic programming); philosophy interfaces well.  
         - *Neglect*: Some work in formal methods (e.g., assume-guarantee reasoning) but not adapted to endogenous distributions.  
         - *Watch for*: A composable framework for 2+ components in a toy system by Year 2.  
       - **Allocation**: $600K—targets collaborative projects.  

     - **#2: Distributional robustness (Fourth priority)**  
       - **Why**: A middle ground *can* exist but risks collapsing. Prioritize when it’s cheaper:  
         - *Upstream impact*: Defines "adversarial distributions" (e.g., uncertainty sets) instead of worst-case inputs. Cheaper if uncertainty sets are small.  
         - *Tractability*: Requires probability theory (e.g., Wasserstein ambiguity sets). Risk: if sets are too broad, it reduces to worst-case.  
         - *Neglect*: Growing in ML robustness, but theory-first approaches are rare.  
         - *Watch for*: Benchmarks showing cost savings over worst-case. Drop if no efficiency gains.  
       - **Allocation**: $400K—pilot grants for early-career researchers.  

     - **#6: Regulatory legibility (Lowest priority)**  
       - **Why**: Practical but derivative. Worst-case claims like "no failures under red-teaming budget B" *are* legible but risk gaming:  
         - *Upstream impact*: Makes theoretical guarantees actionable for policymakers.  
         - *Tractability*: Philosophy-heavy (epistemics of evidence); needs collaboration with legal scholars.  
         - *Neglect*: Safety cases are under-theorized; worth funding if tied to #3/#7.  
         - *Watch for*: A draft "red-team claim" framework that addresses distribution shift.  
       - **Allocation**: $200K—supports policy partnerships.  

  2. **Questions Not Funded**  
     - **#1: Input set definition**: Unproductive. "Competent operator" is underspecified; red-team budget B is arbitrary. This optimizes for rhetorical security, not principled safety. Likely outcome: circular debates.  
     - **#5: Hybrid shutdown**: Just stapled claims. Without formal integration (e.g., shutdown triggering conditions tied to catastrophe bounds), it adds no value.  

  3. **On "Self-Consuming Average"**  
     - **Not confused**: It’s a legitimate problem. When systems influence their input distribution (e.g., code-generating AI altering future tasks), i.i.d. assumptions fail catastrophically. The right framing is **endogenous distribution shift**, which makes average-case guarantees dynamically inconsistent. Fund #3 to formalize this.  

  4. **If the Frame Is Wrong**  
     - The worst/average dichotomy *is* flawed for your context, which is why #7 (catastrophe bounds) is critical. But abandoning the frame entirely is premature—#3 and #7 rebuild it rigorously.  

  ### Bottom-Line Recommendation  
  Allocate: **$1M to #3, $800K to #7, $600K to #4, $400K to #2, $200K to #6** (total $3M). Defund #1 and #5—they distract from structural issues. Monitor #3 for fixed-point models by Year 1; if stalled, reallocate to #7.
