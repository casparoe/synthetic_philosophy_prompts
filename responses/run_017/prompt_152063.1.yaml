prompt: |-
  I've got a 50-minute section next week on the semantics/pragmatics of slurs, for first-years who've done truth-conditions and reference but no pragmatics. I want a plan, not the explanation. What has to be in place before the usual embedding test — does the derogation survive negation, conditionals, attitude reports — even makes sense to them, and in what order should I bring in the two accounts (the one that puts the derogation in truth-conditional content, the one that puts it in what using the word does) so neither sounds obviously correct on arrival? I also want them to see early that both sides can agree the word does harm and still disagree about where the harm lives.

  Then the example. I'm tempted to build the whole hour on one slur/neutral-term pair that also has an in-group reclamation, so reclamation rides on the same example later instead of arriving as a new case. Tell me what such an example has to have and, more usefully, lack: not so taboo that half the room goes quiet, and the neutral counterpart had better not be one some students already hear as a slur.

  Misconceptions I expect: 'same referent so same meaning', 'it's just speaker intent', 'if it's not truth-conditional it's not really in the meaning' (they'll hear that as excusing the word), and collapsing offensive-but-not-derogatory with derogatory-but-not-taboo. Where does each get defused, and is there one I should let them sit with for a few minutes so the fix actually lands? I want one board question at the end — a construction they haven't seen where the two accounts diverge — and I want you to say what I should openly refuse to settle at this level (no expressivist machinery, no formalism).

  Be straight about which parts are settled among people who work on this and which are live disputes; don't let me present my side as the consensus by accident. Lead with the bottom line, the one ordering decision everything else hangs on, in the first sentence, no preamble.
reasoning: |-
  Okay, the user is preparing a 50-minute seminar for first-year students on the semantics and pragmatics of slurs. They need a structured plan that builds foundational concepts before diving into embedding tests and contrasting two main theoretical accounts. The key is to ensure students grasp why the embedding test matters and how both theories can acknowledge harm while disagreeing on its locus.

  First, I need to establish prerequisites. Students know truth conditions and reference but lack pragmatics. So, I must clarify semantic content vs. pragmatic force. Without this, embedding tests won't make sense. The dichotomy between "what is said" and "what is done" is crucial. Examples like "Can you pass the salt?" showing the difference between literal meaning and request action would work well here.

  Next, introducing the neutral counterpart is essential. Students might think same reference equals same meaning. Using a clear pair like "queer" (reclaimed) vs. "homosexual" (neutral) could illustrate that even with identical reference, the impact differs. But I must choose an example that's not too taboo and ensure the neutral term isn't already seen as a slur. "Queer" might be tricky if some students perceive it as offensive, so alternatives like "Black" vs. the n-word (avoiding the actual term) could be safer, though still sensitive.

  The theories: truth-conditional (TC) vs. expressivist (E). Presenting both without bias is vital. The user wants neither to seem obviously correct initially. Highlighting that both agree on harm but differ on its location—either in the proposition or the act of utterance—helps frame the debate. Embedding tests like negation or conditionals can show how each theory handles derogation survival differently. Students might initially think speaker intent alone explains it, so emphasizing that TC accounts embed derogation in content, while E sees it as non-cancellable force, counters that misconception.

  Misconceptions to address: "Same referent, same meaning" gets defused early by comparing neutral and slur terms. "Just speaker intent" can be countered by showing derogation's systematicity. The conflation of offensive vs. derogatory terms needs clear examples—say, "idiot" (offensive) vs. a racial slur (derogatory). Letting students sit with the TC vs. E debate might help them grasp why locating the harm matters beyond excusing the word.

  The board question should present an unseen construction where theories diverge, like presupposition triggers. Ending without settling the debate, avoiding formalism, and clarifying settled points (systematic derogation, harm) vs. ongoing disputes (TC vs. E) is crucial. Openly stating that the class won't resolve the core dispute maintains academic integrity.

  Potential pitfalls: Choosing an example that triggers discomfort. "Queer" might be reclaimed but still sensitive. Opting for "Black" vs. the n-word (using placeholder) requires careful handling. Also, ensuring the neutral term is uncontroversial—students might mistake "homosexual" as clinical but not slurred. Time management is tight; each section must be concise to fit embedding tests, theories, and discussion within 50 minutes.

  The user's deeper needs include fostering critical thinking without oversimplifying, maintaining a safe classroom environment, and balancing clarity with complexity. They want students to leave understanding the central debate and its implications, not just memorizing theories. Emphasizing that both accounts condemn harm but differ analytically meets their goal of showing harm's locus as the core disagreement.
answer: |-
  Here's the stripped-down plan you requested, centered on the critical ordering decision: **Establish the semantics/pragmatics distinction *before* introducing slurs, so students have the framework to analyze both accounts.**

  ### Core Structuring Principle
  **Lead with the neutral counterpart and the semantics/pragmatics divide.** Build the core conceptual tools (truth-conditional meaning vs. utterance force) using *uncontroversial* examples *before* the slur enters the picture. This prevents initial confusion about what "meaning" even encompasses.

  ---

  **Minute-by-Minute Plan (50 mins total)**

  1.  **0-5 min: Hook & Core Distinction ("Said" vs. "Done")**
      *   **Hook:** "We know words refer and have truth-conditions. But is that *all* meaning is? What about what we *do* with words?" (e.g., "Can you pass the salt?" – literally a question, pragmatically a request).
      *   **Key Distinction:** Explicitly define:
          *   **Semantic Content/Truth-Conditions:** "What is said" - the proposition expressed, its truth/falsity conditions.
          *   **Pragmatic Force/Illocutionary Act:** "What is *done*" by uttering it (requesting, promising, insulting, presupposing). *Stress:* These are different *kinds* of meaning contribution.

  2.  **5-15 min: Introduce the Neutral Counterpart & The Puzzle**
      *   **Example:** Introduce the Neutral Term (NT) clearly (e.g., "homosexual person", "Black person" - choose carefully, see below). Establish its reference and truth-conditional contribution. *"What does this word pick out? What conditions make a statement using it true?"*
      *   **Introduce the Slur (S):** State there's a word referring to the *same group* as NT. **Crucially:** **DO NOT UTTER THE SLUR.** Use a placeholder ("S-word", "the slur for NT"). *Immediately emphasize:* Both TC(S) = TC(NT). *"They pick out the same group. The truth-conditions of 'X is an S' are identical to 'X is an NT'."*
      *   **Puzzle:** "But clearly, uttering 'X is an S' does something radically different and harmful compared to 'X is an NT'. Why? Where does that difference come from if the truth-conditions are the same?" **Point:** This is the core puzzle of slurs. Both sides agree on the harm, *but disagree fundamentally on where/how this harmful aspect is encoded linguistically*.

  3.  **15-25 min: Present the Two Accounts (Framing the Dispute)**
      *   **Account 1 (Truth-Conditional - TC):** "The derogation *is part of the truth-conditional content*. 'X is an S' means something like *'X is an NT and is contemptible because of it'*." (Mention this might involve complex predicates, presuppositions, etc. - no formalism). *Consequence:* Derogation is part of "what is said".
      *   **Account 2 (Expressivist/Pragmatic - E):** "The derogation is *not* part of the truth-conditional content. TC(S) = TC(NT). The derogation comes from *what uttering S conventionally does* - it's a direct, non-cancellable act of expressing contempt towards the target group." *Consequence:* Derogation is part of "what is done" (a specific type of illocutionary act/force).
      *   **Key Agreement:** Stress explicitly: **BOTH accounts fully acknowledge the severe harm caused by using S. The dispute is purely *linguistic*: *where* is that harmful aspect encoded within the complex system of meaning?** (This directly addresses your "harm lives" point early).

  4.  **25-35 min: Embedding Tests - The Crucial Tool**
      *   **Why Now?** Students now understand the TC vs. Force distinction. Embedding tests probe *where* the derogation lives by seeing if it "projects" out of certain constructions.
      *   **Demonstrate the Test:** Use placeholder S in examples. Contrast NT and S embeddings.
          *   Negation: "X is not an S" vs. "X is not an NT". Does the derogation feel absent or still present?
          *   Conditionals: "If X is an S, then..." vs. "If X is an NT, then...". Does the derogation seem to apply within the hypothetical?
          *   Attitude Reports: "Paul believes X is an S" vs. "...is an NT". Is the derogation attributed to Paul or the reporter?
      *   **Observed Pattern:** Typically, the derogation *survives* these embeddings (it projects). **Pose the Question:** What does this pattern suggest about where the derogation lives? Does it fit better with Account 1 (TC) or Account 2 (E)? *Let them think/pair/share.*

  5.  **35-45 min: Reclamation & Synthesis (Using the Same Example)**
      *   **Introduce Reclamation:** "Sometimes, members of the targeted group use S themselves, aiming to strip it of its derogatory power or even turn it into a positive term (e.g., in-group 'queer')."
      *   **Analyze with Accounts:**
          *   TC Account: Problematic. If derogation is part of the truth-conditions, how can in-group use change that? Requires complex maneuvering.
          *   E Account: More straightforward? The speaker's group membership and intent might alter the *illocutionary act* performed (expressing solidarity vs. contempt), even if the word-form is the same. The *force* can be different.
      *   **Synthesis:** Highlight how this phenomenon poses a challenge, particularly for strict TC accounts, and seems more naturally handled by pragmatic/expressivist views focusing on utterance force and context.

  6.  **45-50 min: Board Question & Wrap-Up**
      *   **Board Question/Puzzle:** Present a construction where accounts *clearly diverge* in predictions that haven't been covered. **Best Option: Presupposition Triggers.**
          *   "Paul stopped being an S." / "Paul stopped being an NT." (Presupposes Paul *was* S/NT).
          *   TC Account: Likely predicts the derogation is also presupposed (part of the backgrounded TC content).
          *   E Account: Predicts the main *force* (derogation) is absent in the presupposition; the presupposition only carries the neutral reference. Which feels more accurate?
      *   **Wrap-Up:**
          *   **Settled:** Slurs systematically derogate beyond their neutral counterparts; this derogation often projects (survives embedding); slurs cause significant harm; reclamation happens. TC(S) = TC(NT).
          *   **Live Dispute:** The fundamental linguistic nature of the derogation (truth-conditional content vs. conventional expressive force) - THIS is the core debate. **Openly state:** "We haven't settled this debate today, nor did we aim to. That requires more advanced tools we haven't covered (like expressivist semantics or detailed pragmatic frameworks)."
          *   **Final Point:** Emphasize the key takeaway: The dispute isn't *whether* slurs are harmful, but *how language encodes that harm*. Understanding this helps analyze the mechanics of hate speech.

  ---

  **Critical Example Choice: "Queer" (handled carefully)**

  *   **Why it fits:**
      *   Clear neutral counterpart: "homosexual" / "gay" / "LGBTQ+ person" (choose based on context).
      *   Has a prominent history of reclamation.
      *   Generally less immediately "taboo" to *discuss academically* than some racial slurs (though still requires care).
      *   "Homosexual" is clinical but not inherently a slur; "gay" is standard neutral.
  *   **What it lacks/risks & Mitigation:**
      *   **Risk:** Some students (especially from conservative backgrounds) *may* still hear "queer" as offensive/slurring. **Mitigation:**
          *   **DO NOT UTTER "QUEER" AS AN EXAMPLE OF THE SLUR.** Use "the Q-slur" or "the historical slur reclaimed as 'queer'" when discussing the slurring use. Explicitly use "reclaimed 'queer'" for the in-group use.
          *   Acknowledge sensitivity upfront: "We're discussing a sensitive topic involving harmful language. We'll use placeholders for the slur itself ('S-word', 'Q-slur') and focus on the neutral term and the linguistic analysis. Our goal is understanding the mechanics, not repeating harmful terms."
          *   Frame reclamation clearly: "Reclamation is an attempt by the targeted community to disarm the harmful word. Its success and acceptability are complex and context-dependent."
      *   **Lacks:** Overly clinical neutral counterpart ("homosexual"). Using "gay" as the neutral counterpart is often better, though strictly speaking, "queer" can be broader. Be clear: "For today's linguistic focus, we'll use 'gay person' as the neutral counterpart to the historical slur reclaimed as 'queer'."

  ---

  **Misconception Defusing Strategy:**

  1.  **'Same referent so same meaning':** DEFUSED IMMEDIATELY (Min 5-15). The core puzzle *is* that same reference ≠ same meaning/impact. The NT/S contrast makes this undeniable.
  2.  **'It's just speaker intent':** DEFUSED DURING ACCOUNT PRESENTATION (Min 15-25). Contrast: TC embeds it in content/systematic meaning; E makes it *conventional* force, not just fleeting intent (compare to promising). Embedding tests (Min 25-35) show it's systematic, not just intent.
  3.  **'If it's not truth-conditional it's not really in the meaning / excuses the word':** DEFUSED EXPLICITLY AND REPEATEDLY.
      *   State **BOTH** accounts condemn the harm (Min 15-25).
      *   Emphasize E takes the derogation *very seriously* as a fundamental, conventional part of the word's meaning *use* (Min 15-25).
      *   **LET THEM SIT WITH THIS:** After introducing E, pause. "Does saying the derogation is a conventional *force* rather than truth-conditional *content* make it less real, or less harmful? Why or why not?" Brief discussion. *Reinforce:* Harm is real regardless of linguistic analysis. The E account *explains* the harm via force; it doesn't diminish it.
  4.  **Collapsing offensive/derogatory:** DEFUSED DURING NT INTRODUCTION & EMBEDDING (Min 5-15, 25-35). Contrast "jerk" (offensive, context-dependent) with S (systematically derogatory). Embedding tests highlight the systematicity difference. Use "jerk" in an embedding test to show the offensiveness *doesn't* project the same way.

  ---

  **Summary of Key "Do Not Settle" Declarations:**

  *   "We won't resolve the core dispute between the truth-conditional and expressivist/pragmatic accounts today. That's an active area of research."
  *   "We won't be using formal semantic or pragmatic machinery (lambda calculus, speech act formalisms)."
  *   "We aren't making claims about the morality of reclamation or specific contexts for using reclaimed terms – our focus is the linguistic mechanism."
