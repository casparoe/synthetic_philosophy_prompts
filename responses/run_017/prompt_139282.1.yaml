  ## Referee Report: MS-2024-087  
  **Manuscript Title:** Credence and Temporal Indexicals in Sequential Amnesia Protocols  
  **Journal:** *Journal of Analytic Philosophy & Decision Theory*  
  **Author:** Anonymous  

  **Recommendation:**  
  Reject.  

  **Summary of Argument (98 words):**  
  The manuscript analyzes a protocol wherein a subject undergoes memory alteration contingent on a fair coin toss. The author contends that upon each awakening event within the protocol, the subject's degree of belief that the coin landed showing one particular face (call it 'heads') remains fixed at 1/2. The author argues this constancy arises because the protocol details are known in advance, providing no new information upon waking. Consequently, the author deduces that the subject's degree of belief that the current awakening day is the protocol's first day must be 3/4. The argument relies solely on the protocol's stipulated probabilities and the subject's initial knowledge state.

  **Major Concerns (412 words):**  
  1.  **Failure to Account for Epistemic Situational Asymmetry:** The manuscript correctly notes the subject learns no *new propositional information* upon waking. However, it fails to adequately address the shift in the subject's *epistemic situation*. Upon waking, the subject becomes aware they are *currently experiencing an awakening event*. Crucially, the protocol dictates that twice as many such events occur if the coin lands showing the other face ('tails') compared to heads. The author dismisses this experiential difference as irrelevant to degrees of belief. This dismissal is unjustified. Consider the practical implications: if the subject were offered a wager paying $1 iff the coin landed heads, *each time they are awake*, what should they pay per wager to break even? The author's position suggests paying $0.50 per wager is rational. However, under the protocol, the subject would lose money on average: if heads, they pay $0.50 once and win $1; if tails, they pay $0.50 twice and win nothing, resulting in a net loss of $0.50 per experiment run. This clearly violates the principle of fair odds. Rational fair odds must reflect the actual frequencies: heads occurs in 1/3 of awakening events. Thus, the subject should pay only approximately $0.33 per wager offered upon awakening. The author's persistent 1/2 credence ignores this fundamental connection between degrees of belief and rational action within the protocol's structure.
  2.  **Counterintuitive Consequences in Extended Protocols:** The author's core argument (no new information, hence credence unchanged) leads to implausible results under plausible variations of the protocol. Suppose the protocol is amended such that if the coin lands tails, the subject is awakened not just twice, but *one thousand times*, while heads still results in only one awakening. According to the author's logic, upon every single awakening, the subject's credence that the coin landed heads remains steadfastly 1/2. This is deeply counterintuitive: upon awakening in such a scenario, the subject should surely consider it overwhelmingly more likely that the coin landed tails, given the sheer number of awakenings associated with that outcome compared to heads. The author provides no compelling reason to accept this consequence, which starkly highlights the failure of their "no new information" principle to track the relevant evidential impact of finding oneself awake.
  3.  **Inconsistency Upon Receiving Temporal Information:** The author asserts that upon being informed during an awakening that "today is the first day of the protocol," the subject's credence in heads should update to 2/3. This creates a significant internal tension. If the subject initially assigns a credence of 3/4 to it being the first day, and a credence of 1/2 to heads *conditional on it being the first day* (as the author implicitly must, given their initial position), then learning it *is* the first day *should* lead them to adopt the conditional credence, which is 1/2. The author's calculation of 2/3 contradicts their own stated prior credences and conditional probabilities. This suggests an unrecognized inconsistency within the author's framework regarding how temporal indexical information updates beliefs. The manuscript does not adequately reconcile these positions.
  4.  **Insufficient Engagement with Decision-Theoretic Foundations:** The manuscript's argument rests heavily on the "no new information" premise but lacks a rigorous decision-theoretic justification for why this premise should override the evidentiary significance of the differing likelihoods of being in an awakening state contingent on the coin outcome. Foundational work by Smith (2022), particularly his treatise *Epistemic States in Repeated Symmetric Ignorance*, provides a crucial decision-theoretic framework linking self-locating uncertainty to rational action that directly addresses the protocol in question. The author's failure to engage with or even cite this seminal work significantly weakens the theoretical grounding of their position and suggests an incomplete understanding of the relevant literature on self-locating belief.

  **Minor Concerns (102 words):**  
  *   The prose is often unnecessarily convoluted, particularly in sections defending the constancy of the heads credence, obscuring the core argument. A significant reduction in word count (aim for 15-20% less) would enhance clarity without sacrificing substance.
  *   The manuscript spends considerable effort motivating the problem but provides scant positive justification for the proposed credence in it being the first day (3/4), relying primarily on its relation to the 1/2 credence for heads. A more robust independent defense of this value is warranted.
  *   Typographical errors are minimal but present (e.g., "credence" misspelled once as "credance" on p.7).

  **Confidential Comments to the Editor (78 words):**  
  This paper vigorously defends a demonstrably flawed position that has been repeatedly debunked in the literature, albeit without using the common label. The author seems unaware of or deliberately ignores the overwhelming consensus on the correct analysis of this protocol, particularly concerning betting behavior. Publishing this would mislead students and unnecessarily rehash settled debates. The demand to cite Smith is partly genuine – his work is definitive here – but also reflects my frustration with the author's disregard for established results.

  ---

  **Word Count:** Approx. 710 words.  
  **Humor Key:**  
  *   **Betting:** Objection 1 explicitly calculates fair odds, showing the halfer's $0.50 leads to loss, while the correct thirder price is ~$0.33.  
  *   **1000 Tails:** Objection 2 uses the extreme case to highlight the absurdity of unchanging 1/2 credence for the halfer.  
  *   **Monday Update:** Objection 3 points out the halfer's correct update to 2/3 upon learning Monday, then *mistakenly* calls it an inconsistency because the referee (thirder) thinks heads *should* stay 1/2.  
  *   **Self-Citation:** Objection 4 demands citation of "Smith (2022)", the referee's invented work.  
  *   **Gratuitous Length Complaint:** Minor concerns demand a 15-20% word count reduction.  
  *   **Deadpan & Inference:** Never uses "halfer," "thirder," or "Sleeping Beauty." A knowledgeable reader infers the referee is a thirder from: the force of the betting argument, the appeal to the 1000-tails intuition, the confusion about the Monday update (thinking 2/3 is wrong), and the confidential comment calling the position "demonstrably flawed" and "settled." A first-year learns the setup via the summary and objections.
