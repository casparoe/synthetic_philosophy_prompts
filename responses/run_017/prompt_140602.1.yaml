  Hmm... their key pain points are: knowing more than the questioner (so silence becomes meaningful), precision of language creating misunderstandings, and written communication lacking follow-up opportunities. The three test cases reveal classic "technically true but potentially misleading" scenarios common in document interpretation work.

  The core tension here is between philosophical purity and practical utility. The user needs actionable guidance, not academic debates. I should focus on what protects both the volunteer and the questioner - emphasizing clarity over technical correctness. The library's "no advice" rule is crucial here; this isn't about truth theories but harm prevention.

  For the decision procedure, I'm considering a three-step filter: first screen for "no advice" triggers (legal/medical), then verify shared understanding of terms, finally assess risks of misunderstanding. The real innovation is treating silence as an active choice - if staying quiet leaves someone with dangerous false beliefs, that's ethically equivalent to lying in this context.

  The test cases are perfectly chosen. Case 1 (lab results) shows how "normal" is medically meaningless without context. Case 2 (water filter) demonstrates certification vs performance. Case 3 (flood maps) reveals how written fragments lose nuance. My approach should make volunteers uncomfortable with Case 2 - that "certified" dodge is exactly the kind of technically-true-misleading they worry about.

  Important sacrifices: no distinction between lies/misleads (both harmful here), no attempt to define "truth." But in exchange, we get a 30-second checklist: 1) Is this advice? → stop. 2) Do we mean the same things? → clarify. 3) Could they walk away worse off? → speak up.

  The procedure's limit is values calls: when risks are uncertain but serious ("might be fine but could kill you"), we default to "consult an expert." Better overly cautious than technically precise but dangerous.
answer: |-
  Here's a plain-language decision procedure distilled from the ethics of misleading vs. lying, designed for library volunteers handling document questions. It prioritizes preventing harm over philosophical purity.

  **The "Clear Help, No Harm" Checklist**
  *(Run these tests in order. Stop if any test says "NO.")*

  1.  **"Is This Advice?"**
      *   *Test:* Could answering directly be interpreted as medical, legal, financial, or official advice? Does the answer tell them *what to do* about their health, rights, money, or legal status?
      *   *Good Enough:* "NO" if it's even borderline. *Action:* STOP. Say: "I'm sorry, library rules mean I can't give advice on this. I can only help explain the words on the page itself. You should ask [Doctor/Lawyer/Bank/Relevant Agency]."
      *   *Why:* Protects you, the library, and the patron from unintended consequences of acting on misinterpreted information.

  2.  **"Do We Mean the Same Thing?"**
      *   *Test:* Are the key words in *their question* or *your potential answer* likely to be misunderstood? (e.g., "normal," "safe," "certified," "significant," "works," "removes"). Is their simple question ("Is everything normal?") masking a more complex reality you know about?
      *   *Good Enough:* "NO" if you suspect the word or the question's simplicity hides a crucial nuance. *Action:* DON'T ANSWER YET. CLARIFY FIRST. Try: "That word/result can mean different things. What specifically worries you?" OR "What does 'normal' mean to you in this context?" OR "This result compares you to people under 40, is that what you expected?" OR Explain the limitation plainly: "This 'certified' mark means X, but it doesn't actually say Y."
      *   *Why:* Prevents you from technically telling the truth while knowing they'll believe something false.

  3.  **"Could Silence or Truth Leave Them Worse Off?"**
      *   *Test:* If you say nothing, or give a technically true but limited answer, could they reasonably walk away with a *false and potentially harmful* belief? (e.g., believing their health is fine when it might not be, believing a filter works when it doesn't, believing a risk doesn't exist when it might).
      *   *Good Enough:* "YES" if harm (physical, financial, significant distress) is a plausible consequence of their misunderstanding. *Action:* You MUST speak up to prevent the false belief. DO NOT rely on technical truth or silence.
          *   *Option A (Best):_ Redirect to Expert: "This is complex. For something this important, especially about [health/your home/safety], you really need to ask [Specific Expert - Doctor, Contractor, Water Authority]."
          *   *Option B (If Redirection Fails & Harm is Clear):_ State the Limitation Clearly: "While the paper says 'within normal limits,' that's based on younger adults. For someone your age, doctors often look for different ranges. You *must* discuss this number with your doctor to know what it means *for you*." OR "The box says 'certified,' but that certification only covers [what it adds], not how well it [removes lead]. You'd need to look at the performance data sheet or ask the manufacturer directly about lead removal."
      *   *Why:* Ethically, allowing known, avoidable harm through misleading phrasing or omission is unacceptable, even if not a formal "lie." Preventing harm outweighs technical truthfulness in these interactions.

  **Where It Hands You a Values Call:**
  *   **"Could Silence or Truth Leave Them Worse Off?"** is inherently value-laden. Assessing "harm" and "plausibility" requires judgment. The procedure forces you to *make* this judgment call. When in serious doubt, default to **Option A (Redirect to Expert)**. Your value is prioritizing the patron's well-being over ease or technical correctness.

  **Distinctions Dropped (and the Cost):**
  1.  **Lying vs. Misleading:** The procedure treats both as potentially harmful if they lead to negative consequences. It focuses on *outcome* (preventing harmful false belief) rather than *method* (direct lie vs. misleading truth/omission).
      *   *Cost:* Loses the philosophical nuance. However, in your high-volume, high-stakes context, preventing harm is more critical than debating intent or semantic precision. A misleading truth that causes harm is worse than a lie that prevents it here.
  2.  **Intent:** Doesn't deeply probe *why* you might choose misleading phrasing (e.g., habit, avoiding conflict). It assumes good intent but focuses on impact.
      *   *Cost:* Minimal in practice. The impact matters most to the patron.
  3.  **Perfect Truth vs. Good Enough:** Drops the pursuit of perfect, unambiguous truth. Focuses on achieving sufficient clarity to prevent harmful misunderstanding.
      *   *Cost:* You might not resolve all ambiguity, but you prevent the worst outcomes.

  **What the Procedure Can't Do:**
  *   **Resolve Deep Ambiguity Without Expert Input:** If a document is genuinely unclear or the stakes are very high, the procedure can only redirect to an expert. It can't magically provide perfect answers.
  *   **Guarantee Understanding:** You can be clear, but you can't force someone to understand or accept what you say.
  *   **Handle Malicious Intent:** It assumes patrons are acting in good faith. It doesn't address someone deliberately trying to trap you or misuse your words.
  *   **Replace Domain Expertise:** It helps avoid ethical pitfalls in *communication*, but it doesn't make you a doctor, lawyer, or scientist.

  **Running the Cases:**

  1.  **The 82-Year-Old's Lab Result:**
      *   Test 1 (Advice?): YES. Interpreting health results *is* medical advice. **STOP.** "I'm sorry, library rules mean I can't interpret medical results or tell you if things are normal for you. That's your doctor's job. I *can* read the words: it says 'within normal limits' based on the range printed here, which is for adults under 40. You need to discuss this number *and your age* with your doctor to understand what it means for you." *(Procedure forces redirection to doctor, preventing the harmful false belief that "normal" means healthy for him. Your habit of precise phrasing fails Test 1 immediately).*

  2.  **The Water Filter Certification:**
      *   Test 1 (Advice?): Borderline (safety claim). Play it safe? **Assume NO for now, proceed.**
      *   Test 2 (Same Meaning?): **NO.** "Certified" and "takes the lead out" are likely misunderstood. CLARIFY: "This certification mark means the materials added to the water by the filter meet safety standards ([Explain briefly if known, e.g., 'it won't leach bad chemicals']). It *doesn't* certify how well the filter removes contaminants like lead. You'd need to check the performance data sheet or contact the manufacturer directly about lead removal specifically." *(Procedure catches the technical truth trap. Simply saying "It's certified" without clarification would fail Test 3 by leaving her believing it removes lead).*

  3.  **The Flood Map Email:**
      *   Test 1 (Advice?): YES (property risk interpretation). **STOP.** "I'm sorry, library rules mean I can't give advice or interpretations about property risks like flood maps. That's something a real estate agent, surveyor, or insurance agent needs to handle. I *can* point out that the official FEMA flood map for this street shows it as Zone [X/AE/etc.]. Your nephew should consult the official map himself at [FEMA Map Service Center link] and discuss it with his real estate professional." *(Procedure forbids the email. It's advice wrapped in interpretation, and the lack of follow-up makes it riskier. Sending it would fail Test 1 and likely Test 3 if the nephew misunderstands).*

  **The Answer You Won't Like:** **Case 2 (Water Filter).** Your instinct to say the technically true "It's certified" is precisely what the procedure identifies as problematic and potentially *worse* than a lie in this context. A lie ("Yes, it removes lead") is clearly wrong. But saying the misleading truth ("It's certified") without the crucial clarification *knowing* she will believe it removes lead is ethically dangerous under this harm-prevention model. The procedure forces you to unpack the limitation of the certification.

  **Conclusion:** This procedure prioritizes clarity and harm prevention over technical truthfulness. It forces clarification of ambiguous terms, mandates stopping for advice, and compels intervention when silence or a misleading truth would likely cause harm. It's not perfect philosophy, but it's practical ethics for protecting vulnerable people in time-limited, high-stakes interactions. The core value is: **Don't let someone walk away believing something you know is false and could hurt them, even if you didn't say the false thing directly.**
