answer: |-
  Here's your Q&A prep sheet, tailored to the room:

  1.  **Formal Epistemologist (Critical):** "This just rehashes the 'ought implies can' debate. We settled that norms can be regulative ideals even if unattainable. Why is computational cost different?"
      *   **Reply:** "My claim isn't mere unattainability, but *unspecifiability*. A regulative ideal must be *specifiable* to guide. Closure under known entailment becomes *structurally unspecifiable* as a demand on total belief states beyond modest thresholds due to average-case hardness. A blank check isn't an ideal." *(Soft: Assumes specifiability is necessary for normativity.)*

  2.  **Metaphysician 1:** "Aren't you confusing rationality *simpliciter* with rationality *for beings like us*? Surely an ideal agent *could* satisfy closure."
      *   **Reply:** "Absolutely. This is about constraints on normative *requirements* arising from the computational architecture necessary for agency like ours. Ideal agents might escape. But *our* epistemic norms must be computable by *us*." *(Soft: Requires accepting architecture imposes norm-shaping constraints.)* **→ Preempt this in talk.**

  3.  **Kantian:** "Your 'ought implies can' premise rests on 'can.' But what *kind* of possibility? Physical? Logical? Your 'structural unspecifiability' seems like a novel, technical 'cannot'—why does *that* block normativity?"
      *   **Reply:** "It's a 'cannot' grounded in the computational structure required for *deliberative guidance*. A norm whose content can't be computed, even in principle, from the agent's own state cannot function as a guide. It's not a 'demand' they can even comprehend *as* a demand." *(Soft: Depends on guidance being essential to normativity.)* **→ Preempt this in talk.**

  4.  **Ethicist:** "Doesn't this undermine *moral* demands too? Calculating optimal utility or perfect duties might be intractable. Are you licensing moral incoherence?"
      *   **Reply:** "Possibly similar structures exist. Key differences: Epistemic norms often require *internal consistency* derivable *only* from processing total information. Moral demands might be externally specifiable (e.g., 'don't lie') or verifiable locally, avoiding the total-state computational explosion I target." *(Soft: Depends on average-case hardness applying similarly and on the 'local verifiability' claim.)*

  5.  **Political Philosopher:** "Isn't your 'resource-calibration' just an argument for epistemic deference? Doesn't this imply cognitive labor *must* be divided institutionally?"
      *   **Reply:** "It *licenses* deference pragmatically but doesn't *require* it as the *normative* upshot. The requirement is individual: be calibrated to *your own* resources. Deference is one strategy among others for managing limited resources within that calibration norm." *(Soft: Doesn't fully resolve the social-epistemology tension.)*

  6.  **Theoretical Computer Scientist:** "Complexity theory describes problem difficulty *within* formal models. Drawing normative conclusions is a category error. Hardness results don't tell us what we *ought* to do."
      *   **Reply:** "I'm not deriving 'ought' from 'is.' I'm arguing that a *necessary condition* for a putative epistemic norm *to be a norm at all* (specifiability, guidance) is violated *because of* computational structure revealed by complexity theory, specifically average-case hardness." *(Soft: Entirely depends on accepting the philosophical premises about norms; complexity just shows the barrier.)*

  7.  **Metaphysician 2:** "If rationality is architecture-bound, how can we even *conceive* of the ideal? Doesn't your view collapse into relativism?"
      *   **Reply:** "No. We can conceive of ideal coherence *as a mathematical relation*. The claim is that *requiring an agent to instantiate this relation in their belief state* becomes nonsensical as a *norm for them* when determining compliance is intractable. The ideal exists conceptually; demanding it as a practical norm does not." *(Soft: Relies on the norm/ideal distinction holding.)*

  8.  **Formal Epistemologist (Sympathetic):** "Why focus on closure? Aren't other coherence norms (e.g., consistency) also intractable? Doesn't your argument prove too much?"
      *   **Reply:** "Consistency checking is NP-hard but often *practically feasible* for human-scale belief sets with heuristics. The problem is *specifically* norms like closure under known entailment, where determining *what* you ought to believe requires solving problems proven hard *on average*, making even heuristic guidance unreliable at scale." *(Soft: Depends on average-case hardness of entailment being meaningfully different/worse than consistency.)*

  9.  **The Objection You Hope Nobody Asks:** "Isn't your proposed 'resource-calibration' norm *itself* potentially intractable? How do I *know* what's tractable for me?"
      *   **Reply:** "Crucial point. Calibration isn't about *solving* hard problems *about* your resources. It's a *heuristic* requirement: structure your inquiry and belief formation using methods *known* (or reasonably believed) to be *adequate* for your task *given your computational limits*. It's about adopting feasible strategies, not computing optimal solutions." *(Soft: Very vulnerable; defining 'adequate'/'feasible' is fuzzy and potentially regressive.)*
