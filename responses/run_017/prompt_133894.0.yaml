prompt: |-
  Next Thursday I'm giving our department colloquium, and the talk is the one I've been circling for two years: a defense of what I've been calling the intractability objection to coherence normativity. The thesis is that computational intractability does normative work in epistemology, not merely pragmatic work. The standard reply to worries about logical omniscience is that a coherence requirement such as closure under known entailment may be demanding but is still a norm we imperfectly satisfy, so that incoherence is a failing to be weighed against other goods. My argument, in three steps, is that this reply is unavailable for a certain class of requirements: first, for those requirements, compliance is not merely costly but resource-explosive, and the explosion is discontinuous — the resources needed to determine what the requirement asks for jump by orders of magnitude once the agent's total information passes a fairly modest size threshold, so there is no nearby case in which the norm is cheaply satisfiable and no smooth trade-off to be struck. Second, the natural fallback — that hardness is only worst-case, while the instances an agent actually meets are the easy ones — fails for my purposes, because the hardness results I lean on are average-case ones: for some of these problems there are natural distributions over inputs on which the problem stays hard on all but a vanishing fraction of instances, so the easy-in-practice escape route is closed. Third, and this is the step I care most about, a requirement whose satisfaction is intractable in that sense is not just expensive but unspecifiable: to say which total belief state the requirement asks you to be in, one would already have to have solved the hard problem, so the norm cannot guide deliberation even in principle, and a norm that cannot guide is, I argue, not a norm. Call that the specifiability condition on normative requirements. I then spend the last ten minutes sketching what survives: a requirement of being well-calibrated to the resources you have, rather than coherent with everything you know.

  What I need from you is a Q&A prep sheet, not a defense of the position. The room matters here, because I've tried this on specialist audiences before and the objections I get are not the ones I'll get on Thursday. It's a general colloquium: two formal epistemologists, one sympathetic and one who has published on logical omniscience and will be irritated that I seem to be re-running an old debate; two metaphysicians who will want to know whether I am making a claim about rationality as such or only about creatures with an architecture like ours; a Kantian who will press hard on what work "can" is doing in my use of an ought-implies-can premise; an ethicist who will ask whether the same argument structure goes through for moral requirements; a political philosopher who will ask whether the upshot is really an argument for epistemic deference and an institutional division of cognitive labor; and a theoretical computer scientist from across campus who takes the view that complexity theory licenses no philosophical conclusions whatsoever and will say so early and loudly. Give me the eight or ten objections I will actually get from exactly that room, in roughly the order they will arrive, phrased the way each of those people would phrase them rather than in my vocabulary, each with a reply I could deliver in about two minutes and a note on where that reply is soft. Flag the two objections that have enough force that I should concede something in the talk itself, before anyone raises them. Note explicitly which of my replies depend on a premise I don't get to assert, such as the truth of P ≠ NP or the standing of the average-case hardness results, instead of letting those dependencies ride. And include the objection I am hoping nobody asks. Two constraints on form: don't tell me what to read or cite anything, since I know that literature and can't follow up on references from the podium, and don't spend words explaining the complexity-theoretic background back to me. Keep the whole sheet under 800 words, with no single entry longer than 100 words — something I can hold on one page and glance at while walking to the front of the room.
