prompt: |-
  I work on reliability for a large distributed system, and I keep watching the same argument in incident reviews without having a word for what goes wrong in it.

  Two cases. (1) A service has a retry storm and, separately, a periodic latency spike. We fix the retries; the latency spike gets worse, and turns out to be a slow memory leak that the retry behaviour had been hiding all along. The postmortem then says these were always two mechanisms and one was merely masking the other. (2) Two unrelated services intermittently drop requests. A single config rollback makes both stop, and everyone says: same mechanism, one root cause, one bug. Six months later both symptoms return after unrelated deploys, and the new write-up says they were two mechanisms that happened to share a trigger.

  What I keep noticing is that the answer to "is this one mechanism or two?" seems to be settled by what we are able to do rather than by what is there: a shared fix makes things one mechanism, separate fixes make them two, and a fix that unmasks something rewrites the earlier verdict retroactively. The count is also not stable over time — it moves with which interventions happen to be available and with how fine-grained our telemetry is — so we can end up saying A and B are the same mechanism, B and C are the same mechanism, and A and C are not.

  Is there an established concept for this: for the identity and number of mechanisms being fixed by the available repertoire of interventions, and for the hindsight-dependence that masking introduces? It doesn't seem to be just the truism that correlation isn't causation, and it isn't quite a question of how finely one slices the system, since the slicing itself changes when a new fix becomes available. If there is a literature on it, I want the nearest concepts and how this differs from each; if there isn't, I want a name, a definition, and boundary cases saying when the verdict should and should not flip. I'd also want to know whether the honest conclusion is that "same mechanism" is only ever relative to an intervention repertoire, or that there is a fact of the matter here that our practice tracks badly. A bare label won't help me.
reasoning: |-
  Okay, the user is working on reliability for a large distributed system and has encountered a recurring issue in incident reviews. They describe two cases where the determination of whether a problem involves one mechanism or two seems to change based on the interventions applied, not on any inherent system properties. 

  In the first case, fixing retries unmasks a latency spike caused by a memory leak. Initially, these were considered separate issues with one masking the other. The second case involves two services with intermittent request drops that were initially thought to share a root cause after a config rollback fixed both. But later, the symptoms reappear separately, leading to a revised conclusion that they were distinct issues sharing a trigger. 

  The core observation is that the count of mechanisms isn't stable—it shifts based on which fixes are applied and what telemetry is available. The user is frustrated because postmortems retroactively redefine "one vs. two mechanisms" based on intervention outcomes, making the analysis feel arbitrary. They want to know if there's an established concept for this phenomenon, or if they need to coin a new term. 

  The user's deeper need is likely about improving postmortem rigor and avoiding hindsight bias. They might be seeking frameworks to make incident analysis more consistent, or language to articulate why "same mechanism" claims are fragile. The fact that they mention boundary cases suggests they want practical guidance, not just theory. 

  I recall several concepts that touch on this:  
  - **Epiphenomenality** (where one issue masks another) explains the first case.  
  - **Common Cause vs. Common Fix** describes how shared fixes don't always imply shared causes.  
  - **Operational Granularity** captures how intervention capabilities shape problem boundaries.  

  But no single term fully covers the user's observation. The closest is *causal granularity*—how we group causes based on what we can *do*—but it's not standard. Alternatively, *interventional relativity* emphasizes the dependency on available fixes.  

  The user also hints at an epistemological question: Is there a ground truth about mechanisms, or is it always relative? The answer leans toward relativity—what we call "one mechanism" often reflects the resolution of our tools. For example, if you can only restart servers, everything looks like "one problem"; if you have fine-grained tracing, you see splinters.  

  For boundary cases:  
  - **Should flip**: When a new fix isolates previously conflated issues (e.g., patching one service but not the other resolves only half the symptoms).  
  - **Shouldn't flip**: When telemetry improves but reveals no new causal separation (e.g., better logs show the same root cause propagating differently).  

  The honest conclusion is that "same mechanism" is *always* relative to intervention repertoire and observational capabilities. The user's practice isn't flawed—it's tracking an inherently fluid reality. The fix is to explicitly state the context: "one mechanism *given our current fixes and monitoring*."  

  I'll synthesize this into a response using *interventional relativity* as the anchor term, with *masked epiphenomena* for the hiding aspect. The user needs both the label and the framework to make postmortems less retrospective.
answer: |-
  Your observation cuts to the heart of causal reasoning in complex systems. There isn't a single established term, but the phenomenon sits at the intersection of several concepts. Here's a structured breakdown:

  ### Core Concept: **Interventional Relativity of Causal Granularity** (a synthesized term)
  *   **Definition:** The perceived identity and count of "mechanisms" (faults, causes) in a system depend on the *available interventions* and *observational resolution*, not solely on intrinsic system properties. What constitutes "one mechanism" vs. "distinct mechanisms" is relative to the actions we can take and the data we can see.
  *   **Key Drivers:**
      1.  **Intervention Repertoire:** The set of actions available to modify the system (fixes, rollbacks, config changes, restarts, etc.).
      2.  **Observational Resolution:** The granularity and fidelity of telemetry, logging, and tracing.
      3.  **Masking/Unmasking Dynamics:** The ability of one mechanism to suppress or amplify the symptoms of another.
      4.  **Trigger Sharing:** Independent mechanisms sharing a common enabling condition (e.g., config, load pattern).

  ### Related Concepts & How Yours Differs
  1.  **Epiphenomenon:** Your Case 1 is a classic epiphenomenon (the latency spike) masked by the retry storm. *Difference:* You focus on how the *fix* retrospectively redefines the *count* of mechanisms based on intervention.
  2.  **Causal Overdetermination:** Multiple sufficient causes for an effect. *Difference:* You're dealing with multiple *symptoms* where the *assignment of causes* (one vs. many) shifts with intervention.
  3.  **Equifinality:** Same outcome from different causes. *Difference:* You have *different symptoms* whose causal *grouping* changes.
  4.  **Underdetermination of Theory by Data:** Data alone doesn't uniquely specify the causal model. *Difference:* You emphasize *interventions* (actions) as the primary force reshaping the causal model, not just data ambiguity.
  5.  **Reactive Attachment (Psychology Analogy):** The "attachment style" (one vs. two mechanisms) forms *in response to* the available "caregiver" (the intervention). *This highlights the dependency.*
  6.  **Operationalism (Philosophy of Science):** Concepts are defined by the operations used to measure them. *Difference:* You're applying this to *causal mechanisms* in an operational context – "one mechanism" is defined by the operation (fix) that addresses it.

  ### Boundary Cases: When Should the Verdict Flip?
  *   **Flip Justified:**
      *   **New Intervention Splits:** A previously unavailable fix (e.g., patching one service independently) resolves Symptom A but not B, revealing distinct mechanisms.
      *   **Improved Resolution Unmasks:** New telemetry shows Symptom A correlates perfectly with Metric X, while Symptom B correlates with Metric Y, under the same trigger.
      *   **Fix Reveals Latent Mechanism:** Fixing Mechanism A removes suppression, revealing Mechanism B's distinct symptoms clearly (Case 1).
      *   **Trigger Decoupling:** Changing the environment proves Symptom A can occur without the shared trigger, while Symptom B still requires it.
  *   **Flip *Not* Justified:**
      *   **Same Fix, Same Trigger, Same Telemetry:** Without new data or intervention capabilities, redefining the count based solely on hindsight bias.
      *   **Cosmetic Splitting:** Introducing artificial distinctions in the causal model without corresponding differences in potential interventions or observable system states.
      *   **Ignoring Masking:** Declaring mechanisms distinct *without evidence* when masking could explain symptom co-occurrence under the old model.

  ### The Honest Conclusion: Relativity Wins
  There is **no absolute, intervention-independent "fact of the matter"** about whether A and B are "the same mechanism" in complex distributed systems. Our practice **tracks reality poorly** if we assume such an absolute truth exists. The *honest* conclusion is:

  *   **"Same Mechanism" is inherently relative:** It means "addressable by the same intervention(s) within our current operational repertoire and observable under our current resolution."
  *   **Mechanism Count is Fluid:** It changes as our capabilities (fixes, monitoring) evolve. A + B being "one mechanism" now doesn't preclude them becoming "two" later when finer-grained fixes or telemetry emerge.
  *   **Masking is a Fundamental Limitation:** We can only reason about mechanisms whose symptoms are *manifest*. Masking hides latent mechanisms, making our initial causal map incomplete. A "complete" map is only possible in hindsight after *all* possible unmasking events occur.

  ### Why This Matters & How to Use It
  1.  **Reframe Postmortems:** Explicitly state the relativity: *"Based on the interventions available at the time (Fix X), Symptoms A and B appeared to share a common mechanism. Further intervention (Fix Y) revealed a distinct mechanism for B, previously masked."*
  2.  **Embrace Uncertainty:** Document the *possibility* of masking and shared triggers. *"While resolved by a single rollback, we acknowledge the possibility of distinct underlying faults sharing a common trigger; improved service isolation would help test this."*
  3.  **Prioritize Capability Gaps:** Identify where improving your **intervention repertoire** (e.g., service-specific rollbacks, feature flags) or **observational resolution** (e.g., granular tracing, resource isolation metrics) would reduce ambiguity.
  4.  **Model Dynamically:** Sketch causal diagrams that include masking arrows and shared triggers explicitly, acknowledging they might be incomplete.
  5.  **Terminology:** Use **"Operationally Singular Mechanism"** (for "one mechanism" relative to current fixes) vs. **"Operationally Distinct Mechanisms"**. Highlight **"Masked Epiphenomena"** and **"Shared Trigger Bundling"**.

  **In essence:** You've identified the **operational relativity of causality** in complex systems. The number of "things that can go wrong" isn't fixed; it's co-defined by what we can *do* about them and how well we can *see* them. Accepting this relativity leads to more honest and resilient incident analysis.
