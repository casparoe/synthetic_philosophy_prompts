  ## Draft Decision Paper: Standing Committee on Outside Professional Activities  
  **Case:** Remuneration for Online Statistics Course (Economics Department)  
  **Date Circulated:** [Insert Date]  

  ---

  ### RECOMMENDATION (148 words)  
  **The Committee finds no breach of Ordinance 31.** Professor [Name]’s online statistics course does not require prior Committee consent under the Ordinance. No further action is to be taken, and the complaint is dismissed. The administrator’s initial assessment was correct. This decision is final as of 30 [Month] 2024.  

  However, the Committee recommends that Council review Ordinance 31 to clarify its scope in light of modern academic activities (e.g., digital courses, open-access materials). Pending review, the administrator should develop interim guidance for staff on borderline cases, consulting the Committee where necessary. This guidance should be issued by 31 October 2024.  

  ---

  ### THE READINGS AVAILABLE, AND WHAT ELSE EACH OF THEM CATCHES (298 words)  

  Two genuine readings exist:  

  1. **Strict Textual Reading:**  
     The words prohibit remuneration for teaching *any* registered student, regardless of context. This catches:  
     - **Textbooks:** Royalties when Marchmont students purchase a colleague’s book, even if unrelated to their degree.  
     - **Open Online Courses:** Any fee-based course (e.g., on Coursera) if a single Marchmont student enrolls.  
     - **External Examining:** Fees for examining PhDs at other universities if the candidate transfers to Marchmont later.  
     - **Public Workshops:** Paid sessions where a student attends incidentally.  

  2. **Purpose-Limited Reading:**  
     The Ordinance targets teaching that exploits the staff-student relationship for private gain, specifically coaching towards Marchmont examinations. This catches:  
     - **Exam Coaching:** Private tutoring for Marchmont papers (the 1937 scandal).  
     - **Course-Specific Prep:** Selling revision materials exclusively to students taking the staff member’s own module.  
     - **Targeted Commercialisation:** Running a paid course marketed to Marchmont students as “help with Econ 301”.  
     It *excludes*:  
     - General textbooks, open online courses not aimed at Marchmont students, or external examining.  

  A third, narrower reading (confining the Ordinance to teaching *for University examinations*) was rejected by Council in 1971 and is not legally available.  

  ---

  ### WHY I RECOMMEND THE READING I DO (297 words)  
  I recommend the **Purpose-Limited Reading** for three reasons:  

  1. **Avoiding Absurdity:** The textual reading produces irrational outcomes contrary to the Ordinance’s evident aim. Capturing textbook royalties or incidental enrollments in open courses would paralyse legitimate scholarship and continuing professional development. The University has never enforced the Ordinance this broadly, confirming its impracticality.  

  2. **Historical Purpose:** The 1937 Council minutes explicitly link the Ordinance to stopping staff from "profiting by teaching their own students towards their own papers." The current case—a general statistics course with 0.3% Marchmont enrollment, none in the instructor’s department or field—bears no resemblance to this.  

  3. **Legislative Endorsement of Scope:** The 1971 amendment sought to *narrow* the Ordinance to exam preparation. Its rejection implies Council *intentionally* retained broader wording *to cover analogous exploitation*, not to ban incidental or unrelated teaching. Applying it here would stretch "analogous" beyond recognition.  

  The administrator’s initial view aligns with this reading, reflecting the Ordinance’s settled (if unstated) institutional understanding.  

  ---

  ### THE STRONGEST ARGUMENT FOR THE OTHER READING (248 words)  
  The strongest textualist argument is:  

  *Ordinance 31’s language is unambiguous: "any remuneration in connection with the teaching of any person who is a registered student." Professor [Name] received payment for teaching registered students; consent was not obtained. The words admit no exception. The 1971 vote confirms Council’s deliberate choice not to limit the Ordinance to exam-related teaching, implying it intended the broadest possible scope. Historical purpose cannot override clear text, especially where Council later reaffirmed that text. If the outcome seems harsh, the remedy is amendment by Council—not creative interpretation by this Committee. Applying the text faithfully ensures predictability and constrains administrative discretion, which is vital for fairness.*  

  This argument’s force lies in its simplicity and democratic legitimacy: it honours the text Council enacted and refused to narrow.  

  ---

  ### HOW MUCH, IF ANYTHING, THIS DECIDES FOR FUTURE CASES (150 words)  
  This ruling does not bind future Committees but sets a persuasive precedent. It clarifies that:  
  1. Isolated, non-targeted teaching of students (e.g., open online courses) falls outside the Ordinance.  
  2. The administrator’s current practice (exempting such activities) is endorsed.  
  However, borderline cases (e.g., a course with 50% Marchmont enrollment) remain unresolved. The recommendation for Council review emphasises that the Ordinance is outdated. Until amended, the administrator should apply these principles cautiously: where teaching exploits the staff-student relationship for private gain *in a Marchmont context*, consent remains required.  

  ---

  ### HOW CONFIDENT I AM, AND THE POINT I AM LEAST SURE OF (118 words)  
  I am **highly confident** in the outcome: exempting this course aligns with principle, practicality, and institutional continuity.  

  My **least confident point** is whether the 1971 vote signals Council’s endorsement of a broad *purpose* (beyond exams) or merely a preference for textual flexibility. A skilled objector might argue that rejecting the amendment shows Council *wanted* the Ordinance to cover unforeseen cases like online courses—a point I reject, but which injects ambiguity into legislative intent. This is the step most vulnerable to challenge.  

  ---  
  **End of Paper**
