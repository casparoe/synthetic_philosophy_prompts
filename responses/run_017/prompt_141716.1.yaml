  ### Villanelle on Imperceptible Thaw  

  I know that I am cold.  
  The night withholds the day.  
  I know I know I'm cold.  

  The dark maintains its hold.  
  A draft has thieved away.  
  I know that I am cold.  

  The night is not so bold.  
  The dawn delays its ray.  
  I know I know I'm cold.  

  The chill seems less enrolled.  
  Grey light extends its stay.  
  I know that I am cold.  

  The air lies still, unrolled.  
  Dark thins to ashen grey.  
  I know I know I'm cold.  

  No frost remains to scold.  
  The walls are steeped in day.  
  I know that I am cold.  
  I know I know I'm cold.  

  ---

  ### Explanation  
  **Turning Point**: The third tercet marks the failure of the second refrain ("I know I know I'm cold"). Here, "The night is not so bold" signals imperceptible warming—night retreating, dawn imminent—yet the speaker feels unchanged. This creates a *margin-for-error* violation: cases indistinguishable to her now include non-cold states, so she cannot *know* she knows, even if she knows. The first refrain still holds (barely), but the second sounds hollow against dawn’s "delayed ray," exposing the added epistemic fragility of iteration.  

  **Contradiction & Loss**: The closing quatrain forces a choice: abandon the speaker’s authority (her claims are false by the end) or reject the principle that knowledge requires room for error. The poem earns the first loss—the refrains’ jarring persistence as the room warms makes her authority untenable. The final line ("I know I know I'm cold") lands on that surrender, echoing the hollowed certainty.  

  **Form & Drift**:  
  - Rhyme words drift half-step warmer: **cold** → **hold** → **bold** → **enrolled** → **unrolled** → **scold** (ending where "scold" implies warmth’s reprimand).  
  - B-rhyme shifts: **day** → **away** → **ray** → **stay** → **grey** → **day** (night to day).  
  Refrains differ minimally: "I know that I am cold" (6 syllables) vs. "I know I know I'm cold" (6 syllables, metrically identical; "that" replaced by "I know," elided to "I'm").
