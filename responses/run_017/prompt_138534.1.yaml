  We are building a decision procedure for causal claims of the form "X (non-human) caused Y (human event)" in the context of historical narrative. The procedure must output one of four verdicts: protagonist, trigger, backdrop, not established. It must also provide a narration-safe sentence.

  The four verdicts are defined as:
  - **Protagonist**: The non-human factor is the primary driver of the event. It would not have occurred without this factor, and human actions were largely reactive.
  - **Trigger**: The non-human factor initiated the event, but the outcome was shaped by pre-existing human conditions and decisions.
  - **Backdrop**: The non-human factor provided context but was not instrumental in causing the event. The event would likely have occurred without it, though perhaps differently.
  - **Not established**: There is insufficient evidence to link the non-human factor to the event, or the link is coincidental.

  The procedure must be runnable in 20 minutes by a non-specialist and include:
  1. A stop rule: At least one point where an unanswered question leads to a verdict (either "not established" or a fallback to coincidence language) and the segment may be cut.
  2. An explicit handoff: At least one point where the remaining question is about blame or emphasis (editorial judgment) and is handed off to the editor.

  The procedure is built around the following distinctions:
  - **Human mechanism**: Must name the human mechanism that carried the physical event into the outcome. If no mechanism, then it's weather, not history.
  - **Timescale and latency**: The physical event must have a timescale and latency that matches the claimed effect.
  - **Differential-signature test**: If the same shock produces divergent outcomes in different places (due to differing institutions or practices) and the outcome tracks the human variable rather than the physical gradient, then the shock is demoted (from protagonist to trigger or backdrop).
  - **Alibi test**: Check if we are repeating a contemporaneous actor's self-exculpating attribution (i.e., blaming the non-human factor to excuse human failures).
  - **Counterfactual test**: Hold the physical event fixed and vary human choices. If the outcome changes, then human choices are more central.
  - **Rule for slow variables**: For a constant that moves (e.g., climate change), it can only be a cause if it demonstrably moved at the scale and in the window claimed and we can show the mechanism.

  We must also note which scholarly concepts were distorted or dropped and where simplifications may mislead.

  After building the procedure, we will test it on three cases:
  1. Tambora (1815) and the subsistence crisis in Europe and New England (1816-1817).
  2. The 1783 Laki eruption as the cause of the French Revolution (1789).
