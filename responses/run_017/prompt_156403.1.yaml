prompt: |-
  I have been asked to run a ninety-minute evening session on Hofstadter's 'Person Paper' satire for a mixed adult-education group at a lifelong-learning institute: about twenty people, mostly retired, no linguistics or philosophy between them, and politically mixed — several will arrive already convinced that the point about sexist language is settled and faintly boring, several will arrive convinced that it is fussiness about words while the real issues lie elsewhere, and one member will say, early and with some feeling, that she has chaired committees for thirty years and has never meant anything by 'chairman'. We have a whiteboard, one double-sided photocopy of the piece, nothing to project on, and I cannot cite any empirical psychology even where it exists, so the session has to work through example and argument alone. The last time a group like this discussed the piece it split into two camps and stayed there: one read the satire as though it were a proof that generic uses of 'man' are simply false, the other read it as a joke that establishes nothing and could therefore be shrugged off. I do not want an explanation of the satire; I want a plan for explaining it.

  The part I am least sure about is the dependency structure, so please be explicit about what has to be in place before what, and about what must be deliberately withheld until later. My own instinct is that nothing works until the group has first felt, rather than been told about, the asymmetry between the two members of a pair — that one term (the unmarked one) can stand both for the whole category and for one half of it, while the other is the marked term, formed by addition or derivation and usable only for its own half — and that the satire cannot land until they have also seen why applying the substitution uniformly produces comedy precisely where the word containing 'man' has stopped being parsed as a compound at all. I have a candidate for the case that carries the whole session: the way 'right' does double duty as a direction and as 'correct' in English and related languages, with 'left' carrying the marked, deviant, faintly sinister sense. I suspect this is the wrong choice, because in that pair the double duty is largely historical and evaluative in a way the gender case is not, so the group may draw the analogy along the wrong feature; tell me whether to keep it as a warm-up, replace it, or restructure around something else, and say what the carrying example must have and must lack. I have also been separating the diagnoses as follows — (i) the unmarked term is ambiguous between the generic and the specific reading, so predicating it of a woman is either false or oddly marked; (ii) even where the generic reading is unambiguous, the unmarked term sets who is pictured by default; (iii) the specific term for women is morphologically derived from the male one, which encodes the male case as the original and the female as the variation; (iv) the satire's comedy feeds on the residue of compounds and idioms where the male element has gone opaque. Tell me which of these the satire actually runs on, in what order to introduce them, and whether I have the dependency backwards.

  Then the misconception map, with a position in the sequence for each: that the whole issue is politeness or etiquette; that a neutral term such as 'chairperson' solves it, so that neutrality is a property of words rather than of defaults in use; the paired errors of treating the satire as a proof and treating it as mere jest; the etymology objection, that 'man' originally meant human being and so nothing can be amiss; the symmetry objection, that swapping the marked term round would be equally funny and so nothing is shown (I do not think it is symmetric, but I want to know why, and where in the hour to deal with it); and the claim that a speaker who means everyone has thereby done nothing questionable. Please also give me one closing check I can run in the last ten minutes that a participant who has absorbed only the etiquette lesson — replace 'chairman' with something neutral — would fail, and that would show me the mechanism has transferred rather than the vocabulary; and tell me what I should openly refuse to settle at this level, since I would rather name those limits than bluff. Give a rough division of the ninety minutes, and write the plan in British English.
reasoning: |-
  Okay, let me tackle this detailed request about teaching Hofstadter's "Person Paper" satire. The user is planning a 90-minute session for a mixed adult group with no linguistics background, and they want to avoid the typical split reactions where some see it as proof and others as just a joke. 

  First, I need to understand the core challenges: participants have pre-existing views (from "settled and boring" to "mere word fuss"), one woman insists she never meant anything sexist by "chairman", and past discussions have polarized groups. The constraints are strict: no psychology references, only one photocopy, whiteboard-only. The user's instinct about feeling the asymmetry first seems crucial - abstract explanations won't work here.

  The user's proposed "right/left" example worries me. While it shows markedness, the evaluative baggage (right=good, left=bad) could derail the gender analogy. Better to use a neutral pair like "dog" (generic for species/specific for males) vs "bitch" - no value judgment, same morphological derivation issue. This keeps focus on linguistic structure.

  For the satire's mechanism, all four diagnoses matter but need careful staging:
  1. Start with ambiguity (e.g., "man" meaning human/male causing confusion in sentences)
  2. Then default imagery (who pictures women when hearing "surgeons"?)
  3. Morphological derivation (why "poetess" feels secondary)
  4. Finally, opaque compounds (the satire's comedy in "manhole" substitutions)

  The key is making them experience the asymmetry before analyzing it. Practical sequencing: 
  Minutes 0-20: Dog/bitch examples to feel markedness
  Minutes 20-35: Gender term exercises with whiteboard
  Minutes 35-55: Satire reading with focused substitutions
  Minutes 55-75: Mechanism discussion avoiding polarization traps
  Minutes 75-90: Fresh examples to test understanding

  For misconceptions, the etymology objection ("man meant human!") needs early neutralization - show how word meanings evolve. The symmetry objection (would female→male swap be funny?) is vital: point out that invented terms like "womyn" in satire lack the historical weight, so the mockery direction matters. 

  Closing test: Ask them to apply the logic to "freshman" → "freshperson" absurdity versus "first-year student" solution. If they only see etiquette, they'll miss why the latter avoids both markedness and opacity. 

  Openly state limits: "We're examining linguistic patterns, not prescribing speech or debating broader equality - that requires separate discussion." This manages expectations. 

  The user's British English request means using "markedness" not "salience", "whiteboard" not "flip chart", and culturally familiar examples like "postman" rather than "mailman". 

  This approach prioritizes experiential understanding over debate, with careful misconception handling to prevent polarization. The dog/bitch pivot from right/left is essential to avoid muddying the waters with value judgments.
answer: |-
  Here’s a structured 90-minute plan focusing on experiential learning, misconception navigation, and dependency sequencing. The goal is to make participants *feel* the linguistic asymmetry before analysing the satire, avoiding polarization by withholding abstract labels until mechanisms are grasped.

  **Core Dependency Sequence:**  
  1. **Experience markedness** → 2. **Apply to gender terms** → 3. **Deploy satire** → 4. **Diagnose mechanisms** → 5. **Address objections**  
  *Withhold satire until steps 1-2 are internalised. Withhold mechanism labels (e.g., "unmarked term") until step 4.*

  ---

  ### Session Plan (British English)  
  **Materials:** Whiteboard, single double-sided photocopy (for reference), pre-written examples on whiteboard.  
  **Key Pivot:** Replace *right/left* with **dog/bitch** (avoids historical/evaluative baggage; clearer morphological parallel).  

  #### Part 1: Feeling Markedness (0–25 mins)  
  **Objective:** Experience asymmetry without gender triggers.  
  - **(0-5 mins)** Open with: *"When I say ‘the dog barked’, could it be male or female?"* → *"What about ‘the bitch barked’?"* Note reactions.  
  - **(5-15 mins)** Whiteboard:  
    - Column A: Unmarked terms (dog, lion, actor, host)  
    - Column B: Marked terms (bitch, lioness, actress, hostess)  
    Task: *"Which can refer to the whole species/role? Which only to females? What’s added to make the female version?"*  
  - **(15-25 mins)** Contrast:  
    - *"We need to rehome a dog"* vs. *"We need to rehome a bitch"* (first feels neutral, second specifies sex unnecessarily).  
    - *"She’s the only actor who..."* vs. *"She’s the only actress who..."* (first may feel jarring; second marks gender).  
    **Key Insight:** Unmarked terms do double duty (generic + male-specific); marked terms are morphologically derived and restricted.  

  #### Part 2: Gender Term Asymmetry (25–40 mins)  
  **Objective:** Transfer felt asymmetry to human terms.  
  - **(25-30 mins)** Whiteboard: *man/he/him/his* vs. *woman/she/her/hers*.  
    - Q: *"Which is used generically? (‘mankind’, ‘he’ in rules)’"*  
    - Q: *"How is ‘woman’ formed? (man + modifier)"* → Highlight *man* as root.  
  - **(30-40 mins)** Test ambiguity:  
    - *"The committee needs a chairman. Sarah is ideal – she’s organised."*  
      → *"Does ‘chairman’ include Sarah here? Does it feel natural?"*  
    - Contrast: *"We need a parent. Ann is ideal"* (no markedness → neutral).  

  #### Part 3: Satire Deployment (40–55 mins)  
  **Objective:** Trigger comedic effect via substitution.  
  - **(40-45 mins)** Distribute photocopy. Assign paragraphs aloud.  
  - **(45-55 mins)** Focus on **opaque compounds** (e.g., "manhole" → "personhole"):  
    - *"Why is ‘personhole’ funny? Is ‘man’ here about males?"*  
    - Contrast with *"police officer"* (transparent) vs. *"policeman"* (opaque).  
    **Satire’s Engine:** Comedy arises where ‘man’ is *not* parsed as ‘male’ but forces absurd substitution.  

  #### Part 4: Mechanism Diagnosis (55–70 mins)  
  **Objective:** Name observed patterns; sequence diagnoses as:  
  1. **Morphological derivation** ("woman" from "man") → encodes male as default.  
  2. **Ambiguity** ("man" = human/male) → causes false generics.  
  3. **Default imagery** (e.g., "surgeons" picturing men) → revealed by satire.  
  4. **Opaque compounds** ("manhole") → satire’s comedic lever.  
  *Withhold (3) until satire is felt; it’s subtler.*  

  #### Part 5: Objections & Limits (70–85 mins)  
  **Sequence misconceptions:**  
  1. **"Etymology" objection** (*"‘Man’ meant human!"*):  
     → *"Did ‘deer’ mean ‘animal’? Words shift. Does ‘man’ function generically now?"* (Use whiteboard examples).  
  2. **"Symmetry" objection** (*"Swapping would be funny too!"*):  
     → Try reversing: *"Why isn’t ‘womyn-born-womyn’ absurd in the same way? Marked terms lack generative power."*  
  3. **"Intent vs. impact"** (*"I meant everyone!"*):  
     → *"If I say ‘guys’ for a mixed group, does it include women? Does it feel inclusive?"*  
  4. **"Just words / real issues"**:  
     → *"Does language shape norms? If ‘chairman’ evokes a man, does that affect expectations?"*  

  **Closing Check (85–90 mins):**  
  - *"Apply this logic to ‘freshman’:  
    (a) Is it morphologically derived?  
    (b) Is ‘man’ opaque here?  
    (c) What happens if we say ‘freshwoman’?  
    (d) What neutral alternative avoids markedness?"*  
  → **Trap:** Etiquette-focused participants suggest "freshperson" (still morphologically marked, opaque). Correct answer: "first-year student" (truly neutral). Reveals if mechanism is understood.  

  **Openly Unsettled:**  
  - *"We’re not resolving whether you ‘should’ change language. We’re examining how it works. Broader equality issues need separate discussion."*  

  ---

  ### Why This Works  
  - **Dependency Honoured:** Asymmetry *felt* before satire; satire before mechanisms; mechanisms before objections.  
  - **Dog/Bitch Superiority:** No evaluative baggage, clear morphology, exposes false generics (e.g., "all dogs" ≠ "all bitches").  
  - **Satire’s Core:** Runs on (iv) opaque compounds + (i) ambiguity. Morphology (iii) sets the trap; default imagery (ii) is the consequence.  
  - **Symmetry Moot:** Male-marked terms historically form generics; female-marked don’t. "Womyn" neologisms lack this legacy, so swaps aren’t equivalent.  
  - **British Nuances:** Uses "mum/mother" over "mom", "postman" over "mailman", "first-year student" over "frosh".  

  **Timing Buffer:** If Part 1 runs over, compress Part 4. Prioritise experience over terminology. The participant who says *"I never meant anything by ‘chairman’"* becomes a case study in intent vs. impact (Part 5).
