answer: |-
  ### Case: The Merger of Riverbank Steel & Foundry into Midvale Industries

  **Scenario:** Riverbank Steel & Foundry (RSF), a century-old family-owned steel mill, faces bankruptcy due to outdated equipment. Midvale Industries (MI), a larger industrial conglomerate, negotiates an absorption merger: RSF’s assets and workforce are integrated into MI’s operations, RSF’s brand is retired, and MI assumes all RSF’s liabilities. Crucially, RSF’s final act was a negligent environmental spill, creating an obligation for cleanup under EPA regulations that *only* binds the original polluter. Post-merger, MI continues operations at RSF’s former site using its infrastructure but under the MI name. The EPA demands cleanup, arguing the merged entity *is* RSF (the polluter). MI counters it is a distinct entity. The facts: (1) 85% of RSF’s physical assets (furnaces, rail lines) are retained and repurposed; (2) RSF’s leadership is dismissed, while MI’s oversees integration; (3) RSF’s debts/obligations are contractually inherited by MI, but the EPA rule requires *numerical identity* for liability, not contractual assumption. No merger clause specifies "survival" of either entity. The asymmetry: RSF’s site-specific pollution obligation hinges on its historical identity, while MI’s dominant operational role post-merger suggests control but not identity.  

  **The Question:** Is the post-merger entity (call it MI-post) numerically identical to Riverbank Steel & Foundry (RSF)?  

  ### Verdicts by Theory  
  - **Endurantist verdict: Yes.**  
    RSF, as a continuant, endures through the merger by maintaining spatiotemporal continuity of its core physical infrastructure (the mills, which persist and remain operational) and the site-specific obligation. The integration into MI is a qualitative change (new management, branding), but RSF’s substance—its "steel-making essence" tied to the physical plant—persists. Thus, MI-post *is* RSF, now altered, and inherits the cleanup obligation strictly and literally.  
    *Feature doing the work:* Primacy of spatiotemporal continuity and functional persistence of key assets over conventional re-labeling.  

  - **Perdurantist verdict: No.**  
    Perdurantism posits RSF and MI as distinct spacetime worms. The merger fuses two worms (RSF-worm and MI-worm) into a new, discontinuous worm (MI-post-worm) at time *t*. Since numerical identity requires exact spatiotemporal overlap, MI-post cannot be identical to RSF: the RSF-worm terminates at *t*, and MI-post-worm begins at *t* (as a new aggregate temporal part). Paraphrase: "MI-post is RSF" means the RSF-worm shares a temporal part with the MI-post-worm only *before* *t*, not after. Thus, MI-post is not literally RSF, so the EPA obligation (requiring identity) lapses.  
    *Feature doing the work:* The impossibility of strict identity between pre-fusion and post-fusion worms due to mereological divergence.  

  ### Reversed Case (Fission)  
  If the merger were reversed (e.g., MI-post spins off the old RSF assets as a new entity), the dialectic flips:  
  - **Perdurantism:** Easily handles fission. Both post-spinoff entities are temporal parts of the prior MI-post-worm. Neither is identical to MI-pre-spinoff, but paraphrases preserve "survival" talk (e.g., "MI survives as the core conglomerate").  
  - **Endurantism:** Struggles. If MI-post endures, splitting forces an arbitrary choice about which entity "is" MI-post (e.g., the core or the spinoff), violating the no-arbitrariness constraint.  

  ### Perdurantist Replies and Costs  
  1. **Reply:** "RSF is a temporal part of MI-post, so 'MI-post is RSF' is true in a loose sense."  
     **Cost:** Paraphrase replaces literal identity with parthood, denying the EPA’s strict requirement. If the rule demands numerical identity (e.g., "the polluter must clean up"), this fails—parthood is not identity.  
  2. **Reply:** "A gappy object exists: RSF exists, then pauses during merger, then resumes."  
     **Cost:** Violates naturalism. Gappy objects are ad hoc for ordinary cases (no "pausing" in mergers) and implausible for material objects like companies.  
  3. **Reply:** "Identity is temporary. RSF and MI-post are identical only at the merger instant."  
     **Cost:** Rejects the transitivity of identity. If RSF = MI-post at *t* and MI-post = MI at *t*, then RSF = MI—but pre-merger, they were distinct. Contradiction.  

  ### Does "Temporal Part" Vindicate Ordinary Practice?  
  No. Saying "RSF is a temporal part of MI-post" restates the denial of identity. Ordinary practice (e.g., EPA rules, historical responsibility) treats "is" as strict identity: *the very entity that spilled must clean up*. Perdurantism reduces this to "a stage of the polluter is part of this thing," which dissolves the obligation—since the polluting stage is past, MI-post bears no *literal* identity-based duty. Paraphrase preserves language but not the metaphysical grounding of responsibility.  

  ### Committed Judgment  
  **Yes, this genuinely inverts the dialectic.**  
  - **Why:** In fission, perdurantism avoids arbitrariness by multiplying entities; here, it *forces* arbitrariness in responsibility. Endurantism, by privileging continuity of functional essence, affirms ordinary practice (e.g., site-based obligations) without convention. The perdurantist’s tools—unrestricted composition, paraphrase—only allow deflationary reinterpretations that undermine the literal identity required for non-conventional obligations. The cost is high: perdurantism must either reject intuitive responsibilities (e.g., polluter-pays) or implausibly contort metaphysics (gappiness, temporary identity).  
  - **Least confident point:** Whether the factual asymmetry (RSF’s physical persistence vs. MI’s operational dominance) is robust without covert convention. Real mergers often involve legal stipulations; here, I rely on "site-specific obligation" as a brute fact, which some may dispute.  

  **Side taken:** Endurantism wins this case. Responsibility requires strict identity, and only endurantism delivers it by grounding persistence in the continuant’s enduring core attributes—not mereological sums. Perdurantism escapes only by paraphrasing away the stakes.
