answer: |-
  ## Seminar Handout: Frege's Puzzle & The Nature of Sense – Beyond the Standard Package

  **The Issue: Trivialization & Sense**

  Recall Frege's puzzle: "Hesperus is Hesperus" is trivial and uninformative; "Hesperus is Phosphorus" (though true and referring to the same object, Venus) was once informative. The standard solution: the names co-refer but differ in *sense* (mode of presentation). This difference explains the difference in cognitive value (informativeness) and the failure of substitution in attitude contexts ("Lois believes Superman can fly" vs. "Lois believes Clark Kent can fly").

  **The Test:** Call a pair of co-referential expressions **trivialized for a subject S at time t** iff:
  1.  For S at t, "a is b" carries no more information than "a is a".
  2.  For S at t, substituting "a" for "b" *within ascriptions of S's own attitudes* never turns a true ascription false.

  *   **Novice:** Fails for "Hesperus"/"Phosphorus". "Hesperus is Phosphorus" is informative; substituting in their own belief reports changes truth value ("I believe Hesperus is visible in the evening" true, "I believe Phosphorus is visible in the evening" false).
  *   **Astronomer:** Passes. The identity is trivial; substituting "Hesperus" for "Phosphorus" in reports of *her own* beliefs always preserves truth ("I believe Hesperus is the second planet" iff "I believe Phosphorus is the second planet"). Reference unchanged.

  **The Question:** What *is* sense such that it explains the novice's state *and* the astronomer's trivialization? We compare two readings:

  **1. Sense as Objective (Public Mode of Presentation)**
  *   **What it is:** The sense is the *publicly available*, intersubjective way the referent is presented or determined. It's fixed by linguistic/conventional practice, independent of any individual's knowledge state. Grasping it is a public competence, not tied to private psychology. Frege's anti-psychologism ("not a private mental item") fits here.
  *   **Change in Astronomer:** *Nothing* about the senses of "Hesperus" or "Phosphorus" changes. The senses remain distinct public modes of presentation (e.g., *the Evening Star* vs. *the Morning Star*). What changes is purely psychological: the astronomer *learned* the identity and integrated the information associated with both names into a single cognitive file.
  *   **What Stays the Same:** The senses themselves, as public entities.
  *   **Explanatory Power:** This reading *cannot directly ground the original cognitive difference* for the novice using sense alone. The distinct senses objectively exist, but the *difference in cognitive value* for the novice arises from their *psychological relation* to these senses (not yet knowing they corefer). The datum (difference in cognitive value) is handed over to psychology – specifically, the subject's *grasp* of the senses and their ignorance of coreference. Sense objectively differs, but the *work* of explaining informativeness relies on psychological facts about the subject.

  **2. Sense as Cognitive (Subject-Relative Interchangeability Fixer)**
  *   **What it is:** A sense is whatever determines, *for a specific subject S at time t*, which co-referential expressions are cognitively interchangeable *for S at t*. Two expressions share a sense for S iff S's cognitive system treats them as indistinguishable tokens for information storage, retrieval, and inference. Senses can *fuse* (as learning integrates information) or *split* (as forgetting or new distinctions occur) for S over time.
  *   **Change in Astronomer:** The senses of "Hesperus" and "Phosphorus" *fused* for the astronomer. They now share a *single* cognitive sense for her. Her information-handling system treats them as one label for a single body of information about Venus.
  *   **What Stays the Same:** The public *words* and their *reference*. The objective linguistic conventions associated with each name (which the astronomer knows) remain distinct, but these conventions no longer govern the *cognitive role* of the names *for her*.
  *   **Explanatory Power:** This reading *directly grounds* the cognitive difference for the novice (distinct senses = distinct cognitive roles, hence informative identity) *and* the trivialization for the astronomer (fused sense = single cognitive role, hence trivial identity). The difference in cognitive value is explained by the difference in cognitive sense-structure *for the subject*.

  **The Double Acquisition Case: "Cicero"**
  Imagine a subject, Alex, who encounters the name "Cicero" twice: once learning about the Roman orator Cicero, once learning about the philosopher Cicero, unaware these are the same person. Alex is disposed to affirm "Cicero was an orator" (based on source 1) and deny "Cicero was a philosopher" (based on source 2), though both utterances use the same public name referring to the same man.

  *   **Objective Reading Struggles:** There is only one public name ("Cicero") referring to one individual. The reading typically assumes one public name has one public sense (*the famous Roman orator*, say). This implies only *one* sense for Alex. But Alex's cognitive behavior – affirming and denying seemingly contradictory propositions involving "Cicero" – suggests *two* distinct cognitive roles, inexplicable by a single sense. The reading struggles to explain Alex's contradictory dispositions using only public sense.
  *   **Cognitive Reading Handles Naturally:** Alex has *two* distinct cognitive senses associated with the single public name "Cicero" – one derived from source 1 (sense_C1), one from source 2 (sense_C2). Each sense fixes different inferential roles and information stores. Alex's dispositions reflect these two distinct cognitive files. The identity "Cicero is Cicero" (linking sense_C1 and sense_C2) would be highly informative for Alex.

  **Which Reading Does the Work?**
  The **Cognitive Reading** is doing the *real explanatory work* for Frege's puzzle *as a puzzle about cognition and informativeness*. It directly models the change in cognitive value and substitution failure/success via changes in subject-relative sense structure. The Objective Reading provides the stable public anchor (reference, linguistic role) but *outsources* the explanation of cognitive phenomena to individual psychology ("grasp", "knowledge of identity").

  **Can it Hold Frege's Commitments?**
  The Cognitive Reading struggles with core Fregean commitments:
  1.  **Thoughts composed of senses:** If senses are subject-relative and can fuse/split, then the *thought* expressed by "Hesperus is bright" differs for novice and astronomer (different component senses). But Frege wanted thoughts to be objective contents.
  2.  **Shared/Stable Thoughts:** If thoughts are composed of subject-relative senses, sharing thoughts across speakers or over time becomes difficult. The astronomer and novice express different thoughts with "Hesperus is bright". The astronomer expresses a different thought today than she did as a novice.
  3.  **Non-Private Senses:** Cognitive senses *are* private in the sense of being individuated by and dependent on an individual's cognitive state at a time, contra Frege's explicit anti-psychologism.

  A defender of the cognitive reading must **give up the strong objectivity and publicity of senses and thoughts**. What is lost is the idea of a single, stable, shareable *thought-content* that different speakers can grasp and retain over time. We gain explanatory power for individual cognition at the cost of publicity.

  **Verdict**
  *   **Defended Reading:** The **Cognitive Reading** provides the superior explanation of the core cognitive phenomena Frege's puzzle highlights: informativeness and cognitive substitution. It handles trivialization and double acquisition naturally.
  *   **Strongest Objection:** It abandons Frege's core commitment to objective, shareable thoughts composed of public senses, making communication and stable belief over time deeply problematic. Thoughts become fragmented and private.
  *   **One Puzzle or Two?** Frege's puzzle reveals **two intertwined puzzles**: one about the *public meaning* of language (reference and conventional sense), and a distinct one about *individual cognition* (information value and mental representation) – the cognitive reading solves the latter but not the former.
