  - **Branches**: 6 questions based on cases (dentist, grief, motivation, floor, range, striving).  
  - **Leaves**: 8 terminal positions.  
  - **Key distinctions achieved**:  
    - Suffering vs. pain/aversion via dentist/grief cases (Q1–Q2).  
    - Safety floor as distinct from full abolition (Q4).  
    - Static bliss addressed (Q6 → *Leaf 7*).  
