prompt: |-
  I chair the compensation and recognition committee at a 450-person health system. Four times a year we make roughly forty separate allocation decisions: individual bonuses drawn from a pool whose total the board fixes in advance, promotions onto two higher grade levels with a capped number of slots, and a public quarterly award for living the organisation's values, announced to everyone. The committee is five people — me, two clinical directors, an HR partner, and a rotating staff representative — none with any training in philosophy, and every decision has to be defensible in a one-paragraph written statement addressed to the person who did not get it, because our union agreement gives them a right to appeal. I have about twenty minutes per case and two hours of committee time per cycle, so whatever I adopt has to be runnable by non-specialists, on a form, without supervision.

  What I need is a written decision procedure, not a discussion of the theory. For any given candidate and any given allocation, it should determine how far that allocation should track what the person actually deserves, as distinct from three things I keep watching get conflated with it: what the person is entitled to under our existing rules (the bonus plan says the top-rated person takes the top band, whether or not they deserve it); what would produce good work next quarter; and what it would be fitting or gracious for the organisation to say about them in public. Where one of those three legitimately overrides desert, the procedure should say so explicitly and record that it did.

  The procedure has to handle, at minimum: the way credit for a good outcome drains away once you notice how much of it traces to circumstance rather than choice — and the fact that pushing that inquiry far enough dissolves effort itself, so I want a stated stopping rule rather than an infinite regress, recorded as a stipulation and not as a discovery; the fact that a claim of the form "she deserves it" seems incomplete until you write in whom she is being compared to and against which baseline, since the same person can deserve the slot relative to the requirements of the role and not relative to peers who started from less; the possibility that our inputs — performance ratings, credentials, who got the good project, who was mentored, who was allowed to fail safely — are themselves the residue of earlier allocations this same organisation made, so that we would be laundering our own past decisions into present desert; the fact that desert may support only a rough tiering and not a total ordering, so I want a rule against manufacturing a ranking where the material supports a tie; the requirement that the justification be stateable to the loser without asserting anything about their character or about the deep causes of their effort; the expressive cost of publicly attributing someone's success to advantage or luck even when the allocation is unchanged; whether a bad quarter generates a claim to less than the standard increment or merely the absence of a claim to more, and why the difference matters; and whether a desert claim can be discharged or stale once it has already been recognised, so that honouring the same act twice is not double-counting. It must also be able to say that a case is not a desert question at all and hand it upward as a structural one — about pay bands, slot caps, or how work gets assigned. Every handoff should name who signs off: me, the HR partner for anything with legal exposure, or the board where the fix is structural.

  Please work it through on three of our cases. First: two engineers in the same grade. Priya was handed the payments platform in January by her director and by September it is the fastest-growing line in the department, and her numbers are the best in it. Marcus spent the year keeping the legacy scheduling system alive — no visible wins, but three migrations that would have gone badly if he had not caught what he caught. Both are rated the same on paper; there is one top bonus in the group. Second: two analysts of comparable talent; one put in roughly seventy-hour weeks for two quarters and produced the model that fixed our staffing forecast, the other, with two small children and the caring duties that go with them, worked standard hours and produced good but unspectacular work. Rewarding the first is what the desert reasoning seems to point to, but the hours were available to her as a matter of circumstance, rewarding them sets an incentive the organisation does not want, and we cannot say any of this to her in public. Third: a nurse manager of twenty-two years who held a failing unit together through a genuinely bad year, now performing adequately but not exceptionally while managing a chronic illness; the committee wants to give her the public values award. I expect to dislike whatever the procedure says about the third case. Give it anyway, and tell me which of the three answers the committee will find unwelcome and why it is still the right one.

  Assume nothing about what I have read. Define any term you use in ordinary language, and please give no citations, references or suggested reading — I have no way to follow them up.

  Structure the response in these sections, in this order:

  - Summary — about 100 words: the procedure compressed into one paragraph, plus one sentence on what it deliberately refuses to decide.
  - The distinctions that have to survive — about 200 words: the minimum set of contrasts a committee member must be able to hold, each defined in plain words of one sentence.
  - The procedure — about 700 words: the ordered questions, what counts as a sufficient answer to each, where it terminates with a no, where it hands the decision to a named person, and the stipulations that must be written down so that next cycle is consistent with this one. Close this section with a one-page version laid out as lines on a form that the HR partner could drop into our workflow.
  - Three worked applications — about 700 words: the cases above, run in order, with the form filled in for each.
  - Where it misfires — about 300 words: the failure modes, the points where judgment is dressed up as procedure, and the questions the procedure cannot settle at case level at all.
reasoning: |-
  Okay, the user chairs a compensation committee at a health system and needs a practical decision procedure for allocations like bonuses and promotions. They're dealing with complex philosophical issues but need something operational that untrained committee members can apply quickly. 

  Hmm, the core challenge is separating "desert" from three conflated concepts: entitlements under existing rules, future incentives, and public expressions of value. The procedure must handle tricky issues like credit attribution without infinite regression, comparative baselines, and avoiding double-counting past recognitions. 

  I notice the user is pragmatically aware of procedural pitfalls—they want stipulations, not discoveries. Interesting how they anticipate disliking one outcome but demand it anyway. This suggests deep integrity despite discomfort. The union appeal risk makes audit trails essential. 

  For the procedure design: I'll start by defining desert narrowly as credit for controllable actions. Need clear stopping rules—probably at "reasonably foreseeable" effort. The form must force explicit choices when desert conflicts with other factors. 

  The three test cases are perfect stress tests:
  - Priya vs. Marcus exposes outcome bias vs. preventive work
  - The analysts contrast effort vs. circumstance-based opportunity 
  - The nurse manager tests whether tenure/tough circumstances override current performance

  Biggest tension: The nurse manager case will likely fail desert criteria but may warrant recognition on expressive grounds. The committee will hate denying it, but consistency demands the procedure flag this as a structural issue (capped awards misaligned with purpose). 

  Key tradeoffs: 
  - Speed vs. nuance: 20 mins/case means binary checkpoints
  - Transparency vs. diplomacy: Some justifications can't be stated publicly
  - Fairness vs. incentives: Rewarding extreme hours could harm culture

  Failure modes to warn about: 
  - "Effort inflation" from over-measuring inputs
  - Stipulations becoming box-ticking exercises
  - Unavoidable judgment calls disguised as procedure

  Better build in an "override to HR" escape hatch for legal risks. And the desert baseline must be absolute (role requirements), not relative to peers—that avoids the "laundering past privileges" problem. 

  The form structure should mirror the decision tree: 
  1. Is this desert-based? 
  2. Controllable factors? 
  3. Conflict with rules/incentives/expression? 
  4. Handoff instructions if needed

  For the analyst case... yes, rewarding long hours sets bad incentives, so desert gets overridden. But the form must record this as an "organizational necessity" exception, not a desert judgment. That protects the employee's dignity in appeals. 

  *Sigh* The nurse manager decision will feel cruel. But if the award is for "living values through action," adequate performance doesn't qualify—even if her struggle was real. The fix is structural: create a different award type. Procedure must force that admission. 

  Final touch: Add a "no tie-breaking" rule to prevent false rankings where desert is equal. Marcus and Priya might both deserve top bonus, but if slots are capped... that's a structural problem, not a desert failure. The procedure should call that out boldly.
answer: |-
  ## Compensation Allocation Procedure  

  ### Summary  
  The procedure isolates "desert" (what the person *earned* through controllable actions) from rules, incentives, and public messaging. It asks: (1) Is desert relevant here? (2) What specific *controllable choices* contributed to value? (3) Does desert conflict with rules/incentives/expression? If conflict exists, override desert explicitly and document why. If inputs are tainted by past unfairness, note it as a stipulation. Desert supports tiers, not false rankings; equal desert forces a structural handoff. Justifications cite observable actions, not character. The procedure refuses to define "deep fairness" or resolve societal inequities—it treats desert as a practical, bounded assessment of agency within role requirements.  

  ### Distinctions That Must Survive  
  1. **Desert vs. Entitlement**: Desert is what you *earned* by controllable effort/choices; entitlement is what the *rules promise* based on predefined triggers.  
  2. **Desert vs. Incentive**: Desert looks backward at contribution; incentive looks forward at motivating future behavior.  
  3. **Desert vs. Expression**: Desert assesses merit; expression communicates what the organization *wants to highlight* publicly.  
  4. **Controllable Action vs. Circumstance**: Desert only credits actions within the person’s reasonable control (e.g., *how* they used resources), not luck or unearned advantages.  
  5. **Tiering vs. Ranking**: Desert groups people into broad performance tiers (e.g., "exceeds expectations"); ranking forces false precision where differences are insignificant.  
  6. **Stale Claim vs. Active Claim**: Past recognition discharges desert for that act; re-recognizing the same act is double-counting.  

  ---

  ### The Procedure  
  **Step 1: Desert Relevance Check**  
  *   *Question*: "Could this allocation *reasonably* be based on what the person **earned through controllable choices**?"  
  *   *No* → Handoff to HR (if rules-bound) or Board (if structural, e.g., slot caps). *Example*: "Promotion slot cap prevents desert-based allocation."  
  *   *Yes* → Proceed. Record: "Desert is relevant here."  

  **Step 2: Desert Baseline Stipulation**  
  *   *Define*: "Desert is measured against the **core requirements of the role**, not peers’ circumstances."  
  *   *Stipulate*: "We stop tracing causes at **reasonably foreseeable effort**. We do not dissolve effort into infinite luck/circumstance."  
  *   *Record*: "Baseline: Role requirements. Stopping rule: Foreseeable effort."  

  **Step 3: Controllable Contribution Assessment**  
  *   *Question*: "What **specific, observable actions/choices** within their control (not resources/advantages assigned) generated distinct value?"  
  *   *Sufficient Answer*: Concrete examples (e.g., "initiated process X," "averted failure Y by doing Z").  
  *   *No significant controllable contribution beyond role basics?* → "No desert claim beyond standard increment." Record reason.  
  *   *Past recognition for same act?* → "Desert claim stale; no new allocation."  

  **Step 4: Conflict Check**  
  *   *Question A*: "Does awarding based **only** on desert violate a **binding rule** (e.g., performance rating dictates band)?"  
      *   *Yes* → Override desert. Record: "Rule [cite] overrides desert. Allocation: [Decision]." Handoff to HR for legal review.  
  *   *Question B*: "Would desert-based allocation create a **harmful incentive** (e.g., rewarding unsafe hours)?"  
      *   *Yes* → Override desert. Record: "Organizational necessity (incentive risk) overrides desert. Allocation: [Decision]."  
  *   *Question C*: "Would **stating the desert reason publicly** undermine our values (e.g., attributing success to luck)?"  
      *   *Yes* → Override desert *or* modify public message. Record: "Expressive cost overrides desert justification. Public statement will cite [Alternative Reason]."  

  **Step 5: Tier Assignment (No False Rankings)**  
  *   *Question*: "Does the evidence show a **clear, significant desert difference**?"  
  *   *No* → "Desert tier equal. Allocation requires tie-breaker." Handoff to HR/Board if rules force ranking. Record: "Tie-breaker applied due to [Rule Cap], not desert difference."  
  *   *Yes* → Assign to higher tier. Record specific controllable actions justifying the difference.  

  **Final Handoff Rules**  
  - **HR Partner**: Any legal/rule override, tie-breakers under union agreements, or expressive adjustments.  
  - **Board**: Structural issues (e.g., "slots too few for deserving candidates," "award criteria misaligned with desert").  

  ---

  ### One-Page Form for HR Workflow  
  ```  
  [ ] Case: _______________ Date: _______  
  [ ] Allocation Type: [ ] Bonus [ ] Promotion [ ] Award  

  1. **Desert Relevant?** [ ] Yes → Continue. [ ] No → Handoff to [HR/Board]. Reason: _______________  
  2. **Stipulations:**  
     - Baseline: Role Requirements [Initial].  
     - Stopping Rule: Foreseeable Effort [Initial].  
  3. **Controllable Contributions:**  
     - Specific Actions: _________________________________________________________  
     - Distinct Value Created: __________________________________________________  
     - [ ] Claim stale (already recognized). Explain: _____________________________  
  4. **Conflicts:**  
     - [ ] Rules Conflict? [ ] Yes → Override. Rule: _______________ Handoff to HR.  
     - [ ] Harmful Incentive? [ ] Yes → Override. Risk: _______________  
     - [ ] Expressive Cost? [ ] Yes → Override/Adjust. Public Message: _______________  
  5. **Tier Assignment:**  
     - Clear Desert Difference? [ ] Yes → Allocate higher. [ ] No → [ ] Equal desert.  
     - If equal: [ ] Handoff to [HR/Board] for tie-breaker under rules.  
  6. **Final Decision:**  
     - Allocation: [ ] Award [ ] Deny [ ] Tier Level: _______  
     - Justification for Employee: _______________________________________________  
     - Override Record: ________________________________________________________  
  Signed: Committee Chair _______ | HR Partner [if override] _______  
  ```  

  ---

  ### Worked Applications  

  **Case 1: Priya vs. Marcus (Top Bonus)**  
  - **Step 1:** Desert relevant (bonus for merit).  
  - **Step 2:** Baseline = Role requirements (maintain/improve systems). Stopping rule: Foreseeable effort.  
  - **Step 3:**  
    - *Priya*: Controllable actions: Optimized code, redesigned user flow. Value: 20% growth.  
    - *Marcus*: Controllable actions: Proactive audits, preemptive fixes. Value: Averted 3 critical failures.  
    - Both exceeded role basics. No prior recognition.  
  - **Step 4:** No conflicts (no harmful incentive, expressive risk, or rule violation).  
  - **Step 5:** **No clear desert difference**. Priya’s visible growth ≠ greater effort/choice than Marcus’s preventative work.  
  - **Decision:** Equal desert tier. **Handoff to HR** (rule caps slots). HR applies tenure tie-breaker? Unjust. **Committee must note**: "Equal desert. Allocation forced by cap, not merit."  
  - *Form Excerpt*:  
    > 5. Tier Assignment: Clear Difference? [✗] No → [✓] Equal desert. Handoff to [HR].  
    > Justification to employees: "Both demonstrated exceptional skill. Bonus allocation reflected slot constraints, not performance differences."  

  **Case 2: Analyst 1 (Long Hours) vs. Analyst 2 (Parent)**  
  - **Step 1:** Desert relevant.  
  - **Step 2:** Baseline = Role requirements (deliver accurate models/reports).  
  - **Step 3:**  
    - *Analyst 1*: Controllable actions: Voluntary extended hours, rapid iterations. Value: Critical staffing model fix.  
    - *Analyst 2*: Controllable actions: Efficient task prioritization, error-free reports. Value: Reliable outputs.  
  - **Step 4:** **Harmful Incentive Conflict**: Rewarding 70-hour weeks sets expectation for unsustainable work, disadvantaging caregivers. Override desert.  
  - **Decision:** Desert points to Analyst 1, but **override for incentive risk**. Allocate equally. Public message: "Excellence in strategic innovation" (Analyst 1) and "Operational excellence" (Analyst 2).  
  - *Form Excerpt*:  
    > 4. Conflicts: Harmful Incentive? [✓] Yes → Override. Risk: Penalizes caregivers, encourages burnout.  
    > Public Message: "Awarded for distinct contributions: Analyst 1 for innovation, Analyst 2 for reliability."  

  **Case 3: Nurse Manager (Values Award)**  
  - **Step 1:** Award relevance: "Living values" implies desert (choices aligning with values).  
  - **Step 2:** Baseline: Role requirements + values (e.g., compassion, resilience).  
  - **Step 3:** Controllable actions: "Held unit together" (vague). Specifics? If "extra shifts," "mentoring staff," or "implementing safety checks" → desert. If only "endured hardship," → circumstance (not controllable).  
  - **Step 4:** **Expressive Conflict**: Publicly citing "chronic illness" or "endurance" as primary merit risks defining values as suffering, not action. Override if no specific *actions* beyond adequacy.  
  - **Decision:** If no specific, observable actions aligning with values *beyond baseline role performance*, **no desert claim**. Awarding anyway launders circumstance into desert. **Handoff to Board**: "Values award criteria may misalign with desert; consider structural redesign (e.g., tenure/service award)."  
  - *Form Excerpt*:  
    > 3. Controllable Contributions: Actions: "Managed routine duties despite illness." [ ] Specific value? ✗  
    > 5. Clear Desert Difference? [✗] No → Handoff to Board.  
    > Note: "Awarding adequate performance launders circumstance into desert. Redesign award criteria."  
  - **Why Unwelcome?** Committee wants to honor loyalty/hardship. Procedure blocks this because:  
    - "Holding together" is undefined; illness is circumstance.  
    - Publicly framing illness as "living values" risks stigmatizing or valorizing suffering.  
    - **Right Outcome**: Forces honesty—either define merit via actions (e.g., "led wellness initiative") or create a non-desert award.  

  ---

  ### Where It Misfires  
  1. **False Precision**: Stipulations ("foreseeable effort") feel arbitrary but are necessary. Judgment remains in defining "specific actions."  
  2. **Invisible Effort**: Preventative work (Marcus) is harder to quantify than visible wins (Priya). Procedure relies on committee’s ability to articulate value.  
  3. **Expression vs. Reality**: Separating public message from true reason (Analyst 2 case) creates ethical tension but is unavoidable.  
  4. **Structural Blind Spots**: The procedure exposes unfair systems (e.g., capped slots) but cannot fix them—only hand off upward.  
  5. **Effort Inflation Risk**: Over-measuring "controllable actions" may incentivize performative busywork.  
  6. **Unavoidable Conflation**: In borderline cases (e.g., "resilience" as action vs. trait), the line between desert and expression blurs.  
  7. **Cannot Resolve**: Societal inequities (e.g., caring duties). The procedure flags them as circumstance but cannot redress them—only avoid compounding via incentives.  

  ---  
  The procedure forces discipline: desert is about *agency within the role*, stripped of luck, bias, or convenience. It will feel rigid in compassionate cases (e.g., the nurse), but its strength is exposing when "fairness" is actually kindness, rule-following, or PR—requiring honest overrides or systemic change.
