     - Minor errors sent: 1.5% (150 per day), churn cost $150
     - Total: $900, which is lower than the baseline ($1,525). Then both standards approve: worst-case guarantee holds and average-case harm decreases.

  (e) Strongest reply from a worst-case advocate:
     "The average-case standard is considering an increase in routine business costs (customer churn and recall labor) that are not safety issues. The worst-case guarantee ensures that no catastrophic harm occurs, which is the critical safety bar. The business should be free to weigh the net financial impact, which in this case is positive due to staff savings. Therefore, the deployment should be approved, and the average-case standard is overreaching by incorporating non-safety factors."

     This reply does not rescue the case for the average-case standard forbidding deployment; it just says that the average-case standard is using the wrong metric. However, the case is built to show that an average-case standard that includes these non-catastrophic harms would forbid. The reply relocates the dispute to what should be included in a safety standard.

  (f) What the case does and does not establish:
     - It establishes that a worst-case guarantee is not sufficient to ensure that a deployment has acceptable average-case consequences (under a definition of harm that includes accumulation of small harms).
     - It does not establish that a worst-case guarantee is unnecessary, because without it there might be catastrophic risks not present in this scenario.

  Final scenario write-up:

  **Scenario**

  A bank uses an AI assistant to draft responses to customer emails. The AI has read-only access to account data. Every drafted response is reviewed by a human customer service representative (CSR) who must approve and send the email. Any sent email can be recalled within 24 hours; the recall process removes the email from the recipient's inbox and sends an apology and correction, effectively reversing any harm from the email content. The bank processes 10,000 emails per day. Without the AI, the bank employs 100 CSRs, each spending 5 minutes per email (drafting and reviewing), resulting in a recall rate of 0.3% (30 per day) and a minor-error rate (emails sent with minor issues not recalled) of 0.5% (50 per day). The cost of a recall is $50 (for labor and system use). Each email with a minor error has a 0.1% chance of causing the customer to leave, costing the bank $500 in expected lifetime value. Without the AI, the expected daily cost of errors is $1,525 (recalls: $1,500; churn: $25).

  With the AI, the bank reduces the CSR staff to 50, and each CSR spends 2 minutes per email (only reviewing the AI's draft). The AI has a major error rate (errors that would require recall if sent) of 0.5% and a minor error rate of 15%. Due to the reduced review time, the CSR catches only 20% of major errors and 50% of minor errors. This results in a recall rate of 0.4% (40 per day, cost $2,000) and minor errors sent in 7.5% of emails (750 per day). Because AI-generated minor errors (e.g., tone-deaf responses) are more irritating, each has a 0.2% chance of causing churn, resulting in 1.5 customers lost per day (cost $750). The total expected daily cost of errors is $2,750.

  (a) **Guarantee and worst-case approval**: The system guarantees that no single email interaction can cause irreversible harm. This is secured by the combination of mandatory human review and the 24-hour recall mechanism. Even if a harmful email is sent, the recall reverses the harm. Therefore, the worst-case standard approves.

  (b) **Expected-harm calculation and average-case refusal**: The counterfactual baseline is the expected error cost without the AI ($1,525). With the AI, the expected error cost is $2,750, an increase of $1,225 per day. An average-case standard that requires no increase in expected harm would refuse deployment.

  (c) **Structural feature**: The reduction in human review time per email (from 5 minutes to 2 minutes) is the key feature. It causes the increase in minor errors sent, which accumulate into a large expected loss, while the worst-case guarantee (via recall) still holds for major errors.

  (d) **Ablation**: If the bank does not reduce staff (keeping 100 CSRs at 5 minutes per email), then the CSR catch rates remain high. The expected error cost with AI becomes $900 (recall cost $750, churn cost $150), which is below the baseline. Both standards approve.

  (e) **Strongest reply**: A worst-case advocate might argue that the average-case standard is overreaching by including routine business costs (churn and recall labor) in the safety assessment. They would maintain that the worst-case guarantee (preventing irreversible harm) is the only safety requirement, and the business should decide deployment based on net financial impact (which is positive due to staff savings). This reply does not rescue the average-case refusal but challenges its relevance to safety.

  (f) **What the case shows**: This case demonstrates that a worst-case guarantee is not sufficient to ensure acceptable average-case outcomes when the harm includes accumulated small losses. It does not show that a worst-case guarantee is unnecessary for safety.
