  ### The Case: Research Integrity Review

  At a university research integrity office, during a compliance desk check of a hypothetical grant application, an auditor reviews two statements: "If failing to disclose a conflict of interest is unethical, then the application must be flagged for review. Additionally, it is more likely than not that either failing to disclose a conflict of interest is unethical or misrepresenting funding sources is unethical." The auditor concludes: "Therefore, it is more likely than not that the application must be flagged for review." This is treated as a routine logical check; no one evaluates the actual ethics of nondisclosure or misrepresentation, as the scenario is purely notional and detached from real cases.

  ---

  ### The Demonstration

  We analyze the argument through the three specified positions. The argument's structure is:  
  - **Premise 1 (P1):** If unethical(A) then required(B). (Normative conditional)  
  - **Premise 2 (P2):** P(unethical(A) ∨ unethical(C)) > 0.5. (Probability operator over normative disjunction)  
  - **Conclusion (C):** P(required(B)) > 0.5. (Probability operator over normative claim)  

  Validity depends on two formal properties: (i) the disjunction in P2 entails that at least one disjunct has probability >0.5 *if* the events are mutually exclusive (as implied by the context—a conflict of interest and funding misrepresentation are treated as distinct violations); (ii) P1 entails that unethical(A) → required(B), so P(unethical(A)) ≤ P(required(B)) by probability monotonicity. Thus, if P(unethical(A)) > 0.5 (from P2 under mutual exclusivity), then P(required(B)) > 0.5.

  #### (a) Simple Emotivism  
  - **Characterization:** Normative sentences (e.g., "unethical") express non-cognitive attitudes (e.g., disapproval) and lack descriptive content. Unasserted occurrences have no substantive meaning.  
  - **Can it state the argument?** No. The probability operator in P2 and C requires normative sentences to function as truth-apt units (e.g., "P(unethical(A))" implies "unethical(A)" denotes a proposition with a probability), but emotivism denies they express propositions. P1’s conditional also embeds unasserted normative content with no emotivist account.  
  - **Can it explain validity?** No. Emotivism cannot parse "P(unethical(A))" as a coherent state (probability applies to propositions, not attitude-expressions). Without truth-conditional content, the monotonicity property underlying the inference (that P(required(B)) ≥ P(unethical(A))) is inexpressible.  
  - **What must be added?** A full semantics for normative propositions (e.g., treating "unethical" as describing a fact) would be needed, but this abandons emotivism’s core.  

  #### (b) Higher-Order-Attitude Quasi-Realism  
  - **Characterization:** Asserted normative sentences express first-order attitudes (e.g., disapproving of A). Unasserted occurrences are handled via higher-order attitudes (e.g., condemning combinations of attitudes). Validity is explained by incoherence in simultaneously holding premise-attitudes while lacking the conclusion-attitude.  
  - **Can it state the argument?** Barely, but not faithfully. P2’s "P(unethical(A) ∨ unethical(C)) > 0.5" is forced into attitudinal terms (e.g., as a comparative strength of disapproval for the disjunction). However, this misrepresents the operator: "probability" is not inherently attitudinal, and the argument relies on mathematical monotonicity, not attitude coherence.  
  - **Can it explain validity?** No. Validity hinges on the formal property that if X entails Y, then P(Y) ≥ P(X). Quasi-realism reduces this to attitudes: e.g., having a "high confidence" attitude toward unethical(A) and a higher-order attitude linking disapproval of A to planning for B. But this fails: (i) "probability" is not defined for attitudes (disapproval strengths lack the additivity of probabilities); (ii) mutual exclusivity in P2 is a logical constraint, not an attitudinal one; (iii) monotonicity is a mathematical truth, while attitudinal coherence is normative. The explanation collapses without treating normative contents as proposition-like.  
  - **What must be added?** A probabilistic extension: degrees of attitudes (e.g., strength of disapproval) must be modeled as probability functions over normative contents, and higher-order attitudes must enforce probabilistic coherence (e.g., condemning violations of P(Y) ≥ P(X) when X entails Y). This adds a pseudo-representational layer.  

  #### (c) Hybrid Expressivism  
  - **Characterization:** Normative sentences have truth-conditional content (e.g., "unethical(A)" expresses a proposition with truth conditions) *and* an expressive component (e.g., asserting it conveys disapproval). The components are separable, so embedding uses only truth-conditional content.  
  - **Can it state the argument?** Yes. "Unethical(A)" in P1 and P2 denotes a proposition; P2 and C are probabilistic claims about these propositions. P1 is a material conditional.  
  - **Can it explain validity?** Yes. The truth-conditional content allows normative sentences to be treated as propositions. Validity follows from probability theory: mutual exclusivity implies max(P(unethical(A)), P(unethical(C))) > 0.5 from P2, and P1 entails unethical(A) → required(B), so P(required(B)) ≥ P(unethical(A)). If P(unethical(A)) > 0.5 (the worst case for the conclusion), P(required(B)) > 0.5. The expressive component is inert in embedding, so no addition is needed.  
  - **What must be added?** Nothing. The view already accommodates truth-conditional content in operators.  

  ---

  ### Diagnosis  
  **Load-bearing feature:** The non-Boolean probability operator wrapping a normative disjunction (P2) *and* the validity’s dependence on the formal property of probability monotonicity (specifically, that P(Y) ≥ P(X) when X entails Y). This requires normative contents to be objects of mathematical probability, which demands proposition-like structure.  

  **Collapse test:** Replace the non-Boolean operator (probability) with a Boolean operator (e.g., negation or conditional). For example:  
  - *Revised P2:* It is not the case that failing to disclose is unethical (i.e., ¬unethical(A)).  
  - *Revised argument:* P1: If unethical(A) then required(B). P2: ¬unethical(A). Conclusion: ? (No valid conclusion; modus tollens requires ¬required(B) as a premise, but it’s absent.)  
    - *Or for modus ponens:* P2: Unethical(A). Conclusion: Required(B).  
  Now the argument is standard Frege-Geach modus ponens, which quasi-realism (b) handles with higher-order attitudes (e.g., incoherence in disapproving of A while not planning for B, given a higher-order norm linking them). The probability operator’s removal eliminates the need for monotonicity, so (b) succeeds while (a) still fails. The collapse confirms probability’s role.  

  **Counterattack:** The quasi-realist might reply by modeling confidence as degrees of first-order attitudes (e.g., "P(unethical(A)) > 0.5" means strength of disapproval >0.5) and running the program "one level up" to define probabilities over attitudes. For instance, they could posit higher-order norms that condemn mismatches in attitude strengths (e.g., having high disapproval of A but low commitment to B when A entails B).  

  - **Does this restore the case?** Partially—it allows a quasi-realist "translation" of the argument, but it does not explain validity. Probability monotonicity is a mathematical truth (if X entails Y, P(Y) ≥ P(X)), but attitudinal strengths lack intrinsic logical structure. Enforcing P(required(B)) ≥ P(unethical(A)) would require *stipulating* that attitude degrees mirror probability calculus, which is ad hoc without independent justification.  
  - **Does it dissolve the case?** Yes, by conceding the hybrid’s point. To mimic monotonicity, the quasi-realist must treat attitudes *as if* they represent propositions (e.g., disapproval strength functions like belief in a truth-apt content). This erodes (b)’s distinction from (c): representational content is doing the work, and the attitudinal component is inert in the inference. The reply collapses (b) into a notational variant of (c), sacrificing quasi-realism’s anti-representationalism.  

  **Assessment of the theories:** Hybrid expressivism (c) comes out best: it handles the case natively, stating and explaining validity without additions. This is a reason to prefer (c), as it cleanly accommodates non-Boolean operators. However, it may suggest the case is rigged in (c)’s favor—but only because the probability operator exposes a genuine limitation in non-representational theories. The case is not rigged; constraints are satisfied, and the collapse test shows probability is uniquely problematic.  

  **Feasibility of constraints:** All four constraints are jointly satisfiable. The case silences (a) due to embedding under probability, but (b) fails for a different reason (inability to handle probability’s formal properties without representationalism), while (c) succeeds. Condition (4) is met: the auditor’s "dry run" context (a compliance check) naturally suspends first-order attitudes, focusing on logical implications. No cheating: no attitudes are attributed, and the inference is theory-driven.  

  ---

  ### Final Case Paragraph  
  At a university research integrity office, during a compliance desk check of a hypothetical grant application, an auditor reviews two statements: "If failing to disclose a conflict of interest is unethical, then the application must be flagged for review. Additionally, it is more likely than not that either failing to disclose a conflict of interest is unethical or misrepresenting funding sources is unethical." The auditor concludes: "Therefore, it is more likely than not that the application must be flagged for review." This is treated as a routine logical check; no one evaluates the actual ethics of nondisclosure or misrepresentation, as the scenario is purely notional and detached from real cases.
