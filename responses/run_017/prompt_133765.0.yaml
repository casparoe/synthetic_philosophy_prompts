  Their case study on mid-exaptation is brilliant - traits transitioning between functions where selection history (A) and current contribution (B) are misaligned. The time-indexing/grading proposal addresses a real gap, but they're rightly concerned about vagueness (Sorites problem). 

  For the prospectus structure, I'll need to:
  - Craft a sharp question about temporal function emergence during exaptation
  - Show why current theories can't resolve it (they draw function boundaries differently)
