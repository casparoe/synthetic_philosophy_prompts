  The response should give them a skeleton to hang their original ideas on, with enough tension to satisfy the committee's demand for a falsifiable core.
answer: |-
  Here’s a structured prospectus framework centered on your core idea, designed to meet committee demands for focus, methodology, and falsifiability:

  ---

  ### **Dissertation Prospectus: Graded Functions in Evolutionary Transitions**  
  **Core Question:**  
  *During trait exaptation, at what point in the transition from ancestral function (A) to novel function (B) does it become accurate to ascribe "function B" — and can a graded model resolve ambiguities that dichotomous theories (etiological vs. causal-role) cannot?*  

  ### **Why Existing Theories Leave This Open**  
  1. **Etiological (Selected-Effect) Theory**:  
     - Requires *past selection for a trait’s effect* to define function.  
     - **Problem**: Cannot ascribe "B" until selection *for B* has occurred, making early/mid-exaptation functionally ambiguous (e.g., "Is it still A? Not yet B?").  

  2. **Causal-Role Theory**:  
     - Defines function by a trait’s *current contribution* to system capacity.  
     - **Problem**: Over-ascribes function in exaptation (e.g., "B exists now, so it’s functional") despite minimal fitness impact, conflating causal contribution with biological purpose.  

  **The Gap**: Both theories treat function as binary (present/absent), failing to model transitions where a trait is:  
  - *Historically selected for A*,  
  - *Currently maintaining B*,  
  - *Under incipient selection for B*.  
  **Result**: Counterexamples (e.g., first hearts, co-opted traits) appear irreducible because contrasts aren’t temporal.  

  ---

  ### **Thesis Argument (Hypothesis)**  
  Biological function is **graded and time-indexed** during exaptation. The strength of a "function B" ascription depends on:  
  - **Selection Gradient**: Magnitude/duration of selection *for B*.  
  - **System Dependency**: Degree to which the containing system *relies* on the trait for B.  
  - **Trait Form-Stability**: Changes in trait structure optimizing B over A.  
  *This reconciles etiological and causal-role theories: the former explains origins, the latter explains maintenance, but neither fully captures transitions.*  

  ---

  ### **Methodology: Conceptual Analysis + Evolutionary Modeling**  
  **(No experiments required; philosophy of biology/computational approach)**  

  | Phase | Activity | Output |
  |-------|----------|--------|
  | **1. Conceptual Surgery (Months 1–4)** | Analyze "function" in etiological/causal-role theories using counterfactuals and contrast classes. Formalize conditions for "A" vs. "B" ascriptions. | Taxonomy of ambiguity in existing theories (e.g., "When does a ‘weak’ causal role become a function?") |
  | **2. Toy Modeling (Months 5–8)** | Simulate exaptation transitions using agent-based models (e.g., NetLogo):<br>- Traits with initial function A<br>- Environmental shift favoring B<br>- Track selection pressure for B, system dependency, and trait modification. | Metrics for "function B" emergence (e.g., selection threshold where B ascription becomes warranted) |
  | **3. Case Studies (Months 9–12)** | Apply graded model to contested biological examples:<br>- **Mid-exaptation**: Bird feathers (thermoregulation → flight)<br>- **Vestigiality**: Whale pelvic bones<br>- **Co-option**: Pancreatic enzymes repurposed in venom. | Function ascriptions with confidence intervals (e.g., "Feathers: 70% flight-function, 30% thermoregulation in *Archaeopteryx*") |

  ---

  ### **Failure Conditions & Falsifiability**  
  1. **Total Failure**:  
     - Grading merely **relocates vagueness** (e.g., "What *degree* of selection defines ‘function’?") without resolving it.  
     - **Test**: If toy models show no "tipping point" where function B unambiguously emerges despite graded parameters.  

  2. **Partial Failure**:  
     - **Theories remain incompatible**: Grading cannot harmonize etiological/causal-role views if they rely on incommensurable assumptions (e.g., historical vs. ahistorical facts).  
     - **Test**: If case studies still require ad-hoc appeals to one theory over the other.  

  3. **Scope Failure**:  
     - Model **only applies to exaptation**, not core function disputes (e.g., hearts in stable populations).  

  ---

  ### **Expected Contribution**  
  - **A unified framework** for function ascriptions in evolutionary transitions.  
  - **Formal criteria** for when a novel function emerges (addressing the "first heart" problem).  
  - **Diagnostic tool** to dissolve counterexamples by specifying temporal/contrastive contexts.  

  ### **Prospectus Structure (Skeleton)**  
  1. **Problem**: Dichotomous theories fail mid-exaptation (§1).  
  2. **Hypothesis**: Function is graded during transitions (§2).  
  3. **Method**: Conceptual analysis → Toy models → Case studies (§3).  
  4. **Implications**: Resolves theoretical stalemates; new account of "function emergence" (§4).  
  5. **Failure Modes**: Vagueness relocation, irreconcilable assumptions (§5).  

  ---

  ### **Why This Isn’t "Everyone’s a Bit Right"**  
  Your approach **synthesizes** the theories by:  
  - Using etiology to define *ancestral functions*,  
  - Using causal-role to define *incipient functions*,  
  - Adding *gradience* to model the transition.  
  **This is a novel third way**—not a truce—if you show graded ascriptions predict evolutionary outcomes (e.g., trait loss vs. exaptation success) better than binary views.  

  **Committee Hook**: Explicitly frame failure around vagueness (§5). If grading doesn’t fix sorites problems, your thesis *is* the negative result.
