  - Outline a method blending conceptual analysis with evolutionary modeling
  - Define clear failure conditions (e.g., if grading just shifts vagueness)

  The methodology challenge is real since experiments aren't feasible. Conceptual analysis must be rigorous - perhaps borrowing tools from philosophy of language for ambiguity. Toy models could simulate selection gradients during exaptation. 

  User's anxiety about "everyone's a bit right" is valid - I'll steer them toward synthesizing a new framework rather than just mediating. The time-indexing idea could genuinely unify the theories if framed as complementary perspectives on different explanatory questions.

  Biggest risks: 
