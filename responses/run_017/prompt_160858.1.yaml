prompt: |-
  ok so I have to write my common app personal statement and my debate partner has gone completely off the deep end about free will and now I cant stop thinking about it, which is really inconvenient timing. Can you write me a parody of a college application essay, like 550-650 words, from a student who is a hard incompatibilist about moral responsibility — but the specific kind who doesnt care about alternative possibilities at all. He's totally unfazed by those cases where someone is secretly set up so that they couldnt have done otherwise and still seems responsible; his complaint is only about being the *ultimate source* of what you do, and he thinks the manipulation cases (scientists covertly causing someone to act, everyone agrees that guy isnt responsible) show ordinary people in a deterministic world are in exactly the same boat. Don't let him sneak in "I could have done otherwise."

  The essay prompt he's answering is "describe an accomplishment you are proud of and what it reveals about your character," so the joke is that he has to take credit for things while denying he's the kind of thing that can deserve credit, and he has to do it honestly — no collapsing into compatibilism halfway, no "so nothing I do matters," no shrugging and blaming his upbringing as if that were an excuse when his own view says the upbringing excuse doesn't help either. Maybe have him notice partway through that the essay itself is just a product of his genes and environment, and that that is literally what the admissions office is trying to evaluate. Add short marginal comments from an admissions officer who happens to be a compatibilist and keeps innocently suggesting phrasings that would solve his problem if he'd just accept them. I want someone who actually knows this debate to laugh and think it's fair, not just "lol he says he had no choice."
