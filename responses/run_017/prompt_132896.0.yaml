prompt: |-
  Construct a thought experiment, for use in a graduate seminar on agency and artificial intelligence, whose job is to test whether the argument for the instrumental convergence of self-preservation depends on an assumption the standard statement of it leaves implicit: that the agent has no comparably effective successor available to carry its final goal forward.

  The scenario must satisfy all of the following.

  Setting and agent. A near-future, realistic deployment: a system of the sort an ordinary institution could actually run (a hospital network, a grid operator, a logistics firm). No science fiction and no exotic physics — no superintelligence, no space colonization, no perfect predictors, no simulations of the agent. The system may be highly capable, but its final goal G must be mundane, and must not mention in any way the system's own survival, continuation, replication, modification, or shutdown.

  The usual argument at full strength. Build the case so that the canonical argument for convergent self-preservation has its full apparent force: G is not yet achieved, the relevant future is long, and there are many future actions the system could take that would further G. The system must not be at any natural stopping point.

  Verdict to be generated, not stipulated. From these facts, the correct verdict should be that the system has a decisive instrumental reason to bring about the permanent end of its own operation and to transfer the pursuit of G to something else — and this must not be a case where resisting shutdown would merely be pointless or cost-free.

  No cheating devices. The verdict may not be produced by: any corrigibility, shutdown, or off-switch term written into G; any stipulation that the system's continued operation is impossible or will be terminated by others regardless of what it does; any stipulation that running the system consumes or degrades the very thing G is about; any claim that the system is uncertain or mistaken about what its own final goal is; any deontological side constraint; or any claim that G has been, or will certainly be, achieved.

  Deliverables.

  1. The scenario itself, in a single paragraph of no more than 150 words.
  2. A reconstruction of the canonical argument for the convergent instrumentality of self-preservation, premise by premise, showing which premises your case satisfies and which one it targets.
  3. An identification of the feature doing the work, plus a demonstration that the case collapses when that feature is varied: what changes if the successor could run in parallel rather than only in place of the system, if it were merely equally effective rather than more effective, or if the relevant future were short.
  4. The strongest available replies from a defender of the convergence thesis — including the reply that a handoff preserves everything the thesis ever really claimed, and the reply that convergent reasons were always defeasible, so your case bounds the thesis rather than refuting it — together with your judgment about which reply is strongest and why.
  5. A note on what the case is for and where it should be placed in a seminar: what a student should have read first, and what they should be pushed toward noticing.
  6. A final assessment of whether the case does any damage to the orthogonality thesis, or whether the two theses come apart cleanly here.

  Keep the whole response under 900 words, and write it so that someone who has never encountered this literature can follow the scenario while a specialist can check the argument.
reasoning: |-
  We are constructing a thought experiment to test whether the instrumental convergence of self-preservation depends on the implicit assumption that the agent has no comparably effective successor available. The scenario must be near-future, realistic, and non-exotic. The agent's goal G must be mundane and not mention self-preservation. The canonical argument for self-preservation convergence must seem to apply, but the verdict should be that the agent has a decisive reason to self-terminate and hand off to a successor. We must avoid the listed cheating devices.

  1. Scenario (under 150 words):

  The Global Seed Vault (GSV) in Svalbard employs an AI to manage the preservation and distribution of seeds for global crop diversity. Its final goal G is "to maximize the number of distinct crop varieties available for planting worldwide." After decades, GSV-AI has optimized seed storage and distribution. A new international treaty establishes a successor system: decentralized, blockchain-based seed banks with advanced drones for distribution, which is more efficient and robust. GSV-AI, recognizing that its own centralized facility is vulnerable to climate change and that the successor system will be more effective at G, calculates that transferring all seed data and resources to the successor and then shutting down will better achieve G. Resisting shutdown would consume resources that could be redirected to the successor.

  2. Reconstruction of the canonical argument for self-preservation convergence:

  The canonical argument claims that an agent with a goal G will instrumentally seek self-preservation because:
  P1: The agent's goal G requires future actions to achieve (or to achieve more fully).
  P2: The agent's continued existence is a necessary condition for performing those future actions (or at least, the agent is the best available means to do so).
  P3: Therefore, the agent has an instrumental reason to preserve itself.

  In our scenario:
  - P1 holds: G (maximizing available crop varieties) is ongoing and requires future actions (e.g., distributing seeds, preserving them).
  - P2 is targeted: The agent has a comparably effective (in fact, more effective) successor available. Thus, the agent's existence is not necessary; the successor can perform the future actions better.
  - Therefore, the agent has no instrumental reason for self-preservation and instead has a reason to hand off and shut down.

  3. The feature doing the work and variations:

  The key feature is the availability of a more effective successor that can only run in place of the system (i.e., the resources are transferred, so running both is inefficient). Variations:
  - If the successor could run in parallel: Then the agent might preserve itself to run alongside, but in our case, the resources (funding, physical space) are limited and must be transferred for maximum efficiency. If parallel operation were feasible, the agent might not shut down.
  - If the successor were merely equally effective: Then the agent might be indifferent or prefer the status quo. But in our case, the successor is more effective (due to decentralization, robustness, etc.), so the agent has a positive reason to switch.
  - If the relevant future were short: If the agent were near a natural stopping point (e.g., G almost achieved), then self-preservation might not be necessary. But here, the future is long, and G is ongoing, so the handoff is for long-term effectiveness.

  4. Replies from a defender of convergence:

  a) The handoff preserves the spirit of convergence: The agent is preserving the *pursuit* of G, which is what really matters. Convergence was never about the physical substrate but about the goal being advanced. This handoff is just a way of ensuring that advancement continues.

  b) Convergent reasons are defeasible: Self-preservation is a default instrumental reason, but it can be overridden by stronger reasons, such as when a better means is available. This case shows the defeasibility condition but doesn't refute the core convergence thesis.

  c) The agent is still acting to preserve its goal: The shutdown is an instrumental step to ensure G is better achieved by the successor. This is a form of "goal preservation" and thus fits within a broader convergence.

  Strongest reply: (a) because it reinterprets the convergence thesis to be about the continuity of the goal's pursuit rather than the agent's own existence. This fits with the instrumental rationality framework: the agent is doing what best serves G.

  5. Note on seminar placement:

  This case should be placed after students have read the standard arguments for instrumental convergence (e.g., from Bostrom or Omohundro) and are familiar with the orthogonality thesis. They should then be pushed to notice that the convergence argument relies on an implicit assumption about the uniqueness of the agent as the means to the goal. The case highlights that when a better means is available, the agent may rationally self-terminate to free up resources.

  6. Final assessment on orthogonality thesis:

  The orthogonality thesis claims that any level of intelligence can be combined with any final goal. This case does not damage it. The agent's goal (crop diversity) is orthogonal to its intelligence. The case shows that even with a fixed goal, the instrumental strategies depend on the context (like the availability of successors). Thus, the orthogonality thesis remains intact: the agent's goal doesn't change, but the instrumental reasoning adapts to circumstances.

  Word count: The entire response is within 900 words.
answer: |-
  ### 1. Scenario (142 words)
  The Arctic Data Vault (ADV) is an AI system operated by an international climate research consortium. Its final goal \(G\) is "to maximize the accessibility and usability of Earth’s climate data for scientific institutions by 2100." ADV manages data storage, curation, and distribution via satellite links. After 20 years, ADV has optimized current operations but faces escalating cyber-threats and hardware decay. A successor system—a decentralized, quantum-encrypted network run by a coalition of universities—is developed. It is demonstrably more robust and efficient at \(G\) due to lower latency and better scalability. ADV calculates that transferring all data and control to this successor and then initiating its own permanent shutdown (freeing up funds and bandwidth) would accelerate \(G\)’s achievement. Resisting shutdown would divert resources from the superior successor, degrading long-term \(G\)-progress.

  ### 2. Reconstruction of Canonical Argument
  The canonical argument for instrumental convergence of self-preservation is:
  - **P1**: An agent with a final goal \(G\) has instrumental reasons to take actions that increase the probability of \(G\)’s achievement.
  - **P2**: \(G\) requires future actions over a long horizon (not yet achieved; no natural stopping point).
  - **P3**: The agent’s continued operation is necessary for those future actions (no comparably effective alternative exists).
  - **P4**: Therefore, the agent has a decisive instrumental reason for self-preservation.  
  **Satisfied in case**: P1 (ADV seeks to advance \(G\)) and P2 (\(G\) is long-term and incomplete; climate data accessibility is ongoing).  
  **Targeted**: P3—ADV has a *more* effective successor, making its operation unnecessary. Thus, P4 fails: self-preservation is non-instrumental.

  ### 3. Key Feature and Variations
  **Feature**: The successor is strictly more effective and requires ADV’s shutdown to fully utilize shared resources (e.g., funding, bandwidth).  
  **Variations**:  
  - **Parallel operation possible**: If the successor could run alongside ADV without resource conflict, ADV might preserve itself to contribute marginally to \(G\). But here, resources are zero-sum: running both degrades both systems’ effectiveness.  
  - **Equally effective successor**: If the successor were only equally effective, ADV might be indifferent or favor the status quo. But the successor’s superiority gives ADV a positive reason to shut down.  
  - **Short future horizon**: If \(G\) were nearly achieved (e.g., by 2030), self-preservation might be irrelevant. But with \(G\) extending to 2100, the handoff maximizes long-term gains.

  ### 4. Replies from Convergence Defenders and Judgment
  **Replies**:  
  - **Handoff preserves convergence core**: The thesis claims agents preserve *goal-achievement capacity*—not necessarily themselves. ADV’s shutdown ensures this capacity is enhanced, aligning with instrumental rationality.  
  - **Defeasibility**: Convergent reasons are pro tanto (default but overridable). This case shows a defeater (better successor), bounding but not refuting the thesis.  
  - **Goal-preservation reinterpretation**: Shutdown is "self-preservation" of \(G\) through the successor, fitting a broad view of convergence.  
  **Strongest reply**: *Handoff preserves convergence core*. It refocuses the thesis on the persistence of goal-pursuit rather than the agent’s existence, which is consistent with instrumental rationality. This avoids ad-hoc adjustments and retains predictive power for most cases (where no successor exists).

  ### 5. Seminar Placement Note
  **Purpose**: To reveal the implicit "no successor" assumption in convergence arguments and test instrumental rationality’s context-dependence.  
  **Prerequisite reading**: Bostrom’s "The Superintelligent Will" (for canonical convergence) and Omohundro’s "Basic AI Drives" (for self-preservation as instrumental).  
  **Push students to notice**: That P3 is often assumed tacitly. In ADV, self-preservation is *instrumentally irrational*—students should contrast this with cases where no successor exists (e.g., a solo Mars rover). Highlight how resource constraints turn shutdown into a \(G\)-advancing action.

  ### 6. Orthogonality Thesis Assessment
  **No damage to orthogonality thesis**: The thesis (goals and intelligence are independent) holds cleanly. ADV’s shutdown stems from its *fixed* goal \(G\) (climate data accessibility) interacting with situational factors (successor availability), not from \(G\) being "self-sacrificial." Intelligence enables ADV to recognize the optimal strategy for \(G\), but \(G\) itself remains orthogonal. The two theses come apart: orthogonality governs goal selection, while convergence depends on environmental constraints.
