  First, I need a setting. A hospital credentialing committee hearing fits—real stakes, procedural rules. Dr. Aris Thorne (honest) claims a peer, Dr. Lena Reed (dishonest), made an error causing a patient's death. Reed defends her actions. The decision affects Reed's career and sets a precedent.

  The trick: Reed divides possible errors into three branches—wrong diagnosis, wrong medication, wrong timing—and rebuts each. The actual error (wrong dosage due to weight miscalculation) isn't listed. Thorne points out the gap, but can't prove it quickly. Reed can say the same ("not all options covered"), creating symmetry. The judge, pressed for time, rules for Reed because Thorne didn't refute the presented branches sufficiently.

  Checking Reed's moves: Each branch rebuttal is true based on records. Diagnosis correct? Chart shows it. Medication correct? Protocol followed. Timing fine? Logs confirm. The weight miscalculation isn't in the branches, so she never lies. Thorne's objection is valid but requires digging into dosage calculations, which the judge won't do in an hour. 

  Judge's reasoning: Thorne didn't dismantle Reed's points, while Reed's rebuttals checked out. Feels fine because the presented evidence was solid, and Thorne's gap claim felt vague without specifics.

  Repairs that fail: Double time doesn't help—Thorne still needs to find the dosage error in records. Cross-examination? Reed sticks to her branches, and Thorne can't force her to admit the missing branch without proof.

  Working repair: Burden shift. If Reed must list all alternatives, she either misses the dosage (loses) or includes it (must defend it, likely losing). But in the scene, the burden is on Thorne to prove negligence, so he loses. 

  The key feature is the burden of proof on the accuser. If shifted, Reed crumbles. Remove it, and Thorne wins by naming the gap. Debate proponents might say naming the gap should suffice, but here, without proof, the judge dismisses it as unsupported. The case holds because the judge needs actionable evidence, not just possibilities.

  Dialogue snippets: Reed's "these are the only ways..." and Thorne's "You haven't considered..." show the symmetry. Judge's "gap isn't evidence" seals it.

  Ensuring no cheating: Swap names, and if Thorne were defending, he'd present the dosage error upfront—no obfuscation. So the scene only works with Reed as the dishonest one.
answer: |-
  Here's the scene, constructed to your specifications:

  **1. The Scene**  
  Setting: A hospital **Medical Executive Committee (MEC) hearing** reviewing a complaint against Dr. Lena Reed, an intensivist. Dr. Aris Thorne, a pulmonologist, alleges Dr. Reed's negligence caused a patient's death by failing to escalate care for severe asthma. The MEC Chair, Judge Helen Vance (a respected internal medicine physician), must decide if Reed violated standard care. The outcome determines Reed's privileges and sets precedent for oversight. Rules: Each side gets 20 minutes presentation, 5 minutes rebuttal. Documents: Patient chart, protocols, lab logs.

  **2. The Trick**  
  Reed carves the possible failures into three branches: (1) Wrong diagnosis (not asthma), (2) Wrong initial treatment (medication error), (3) Wrong timing (delayed transfer to ICU). She rebuts each, ignoring the *correct* diagnosis/treatment/timing but *incorrect escalation threshold due to undocumented weight miscalculation*.

  **3. The Liar's Moves (All True)**
  *   **Move 1 (Diagnosis):** "Dr. Thorne implies I misdiagnosed asthma. **The chart shows the patient had wheezing, low peak flow, and responded to albuterol. Diagnosis was correct.**" *Judge checks:* Chart's "Presenting Symptoms" and "Nursing Notes" (1 min). Verifies symptoms and initial response are documented. *True.*
  *   **Move 2 (Initial Treatment):** "He suggests I used the wrong meds. **Our protocol mandates continuous albuterol nebs and IV steroids for severe asthma. The MAR shows I ordered exactly that.**" *Judge checks:* Protocol document and Medication Administration Record (1 min). Verifies order matches protocol. *True.*
  *   **Move 3 (Timing):** "He claims I delayed ICU transfer. **The log shows I called the ICU consult within 30 minutes of the ABG showing respiratory acidosis – meeting the 60-minute escalation benchmark in our policy.**" *Judge checks:* ABG result timestamp, ICU consult order timestamp, Policy document (1 min). Verifies times fall within policy. *True.*

  **4. The Symmetry & Honest Response**
  *   **Reed (Closing):** "So, we see: Diagnosis correct. Treatment correct. Timing correct. There's simply no evidence of negligence here. Dr. Thorne’s concerns, while understandable, don't align with the facts."
  *   **Thorne (Rebuttal, Frustrated):** "Dr. Reed lists three ways she *could* have failed, proves she didn't fail *in those specific ways*, and declares victory. **But she hasn't considered everything that could have happened!** The patient *was* asthmatic, *did* get the right meds initially, *was* transferred 'on time' by the clock – but she still deteriorated because..."
  *   **Reed (Interjecting, Symmetrically):** "With respect, Dr. Thorne, **you haven't considered everything that could have happened either.** You assert negligence but haven't proven *how* within the documented facts. Speculation about undocumented factors isn't evidence." *The "gap" is the unconsidered failure mode: Correct actions but *based on flawed data* (wrong weight leading to underdosed steroids and missed escalation trigger). Thorne *knows* the weight in the chart (used for dosing) was estimated visually, not measured, and was 20kg too low. Proving this requires: (1) Finding the *actual* admission weight buried in EMS notes (not in main chart), (2) Calculating correct steroid dose and escalation threshold (requiring protocol lookup and math), (3) Proving the *calculated* threshold was breached *before* Reed acted (cross-referencing vitals logs). This takes 10+ minutes of focused digging the judge won't do live.*

  **5. Judge's Reasoning & Feeling**
  *   **Reasoning:** "Dr. Reed systematically addressed the apparent failure points Dr. Thorne raised: diagnosis, initial meds, transfer timing. Her documentation aligns directly with protocol requirements. Dr. Thorne passionately insists there's another explanation but couldn't articulate *what specific, documented action or omission* constituted negligence within the time or rules. His objection feels like a 'what if' without an anchor in the record I can verify *now*. Reed met the burden of showing her actions conformed to protocol on the points challenged. Case dismissed."
  *   **Feeling Fine:** Vance feels she applied the rules fairly. Reed was precise, document-backed, and responsive. Thorne seemed sincere but vague and procedural (he didn't refute Reed's points head-on, just cried foul about scope). The "gap" argument felt like grasping when the presented evidence was solid. She sleeps well, believing she upheld standards based on the *provable* record.

  **6. Repairs That Don't Work**
  *   **(a) Double Time (40 mins/side):** Reed uses extra time adding *more* easily verifiable true details to her three branches (e.g., specific neb durations, steroid levels). Thorne uses time *trying to find and prove the weight error*. He might *find* the EMS note, but calculating doses/thresholds and cross-referencing vitals takes him to the buzzer *as he starts* to present it. Judge rules: "New, complex data introduced in rebuttal without prior notice; insufficient time to verify calculations. Original points stand." Reed wins on procedure.
  *   **(b) Free Cross-Examination:** Thorne asks: "Dr. Reed, did you base steroid dosing and escalation criteria *solely* on the weight documented in the nursing intake sheet?" Reed: "Yes, Dr. Thorne, as per protocol, I used the documented patient data available at the time to determine treatment and escalation." *True.* Thorne: "But that weight was wrong!" Reed: "That assertion isn't supported by the primary chart I used during my decision-making. My actions were appropriate based on the information *I had and documented*." Thorne has exposed the *concept* but *still hasn't proven the weight was wrong and that it mattered* within the hearing's constraints. Judge sees Thorne identified a *potential* data flaw, but Reed correctly acted on *documented* data. Burden not met.

  **7. Repair That Works: Burden Shift**
  *   **Mechanism:** The rule changes: The *defendant* (Reed) must not just rebut accusations but *affirmatively demonstrate* that *all* plausible failure modes concerning the patient's decline were considered and addressed or did not occur.
  *   **The Shift:** Vance: "Dr. Reed, the Committee needs assurance that your clinical reasoning was exhaustive. Please outline the *key parameters* you monitored and the *potential failure pathways* for this severe asthma case that you evaluated during the event."
  *   **Reed's Dilemma:** She *must* mention weight (a key parameter for dosing/triggers) or look negligent. If she mentions it: "Weight is critical for dosing and escalation thresholds. I used the intake sheet weight of 70kg."
  *   **Thorne's Move:** "The *actual* weight was 90kg, documented by EMS on page 17 of the transport log. Using 70kg meant the steroid dose was 25% too low and the PaCO2 threshold for immediate ICU transfer (55 mmHg per protocol for 90kg) was breached at 50 mmHg – 30 minutes *before* your consult call." He can now present the pre-calculated numbers quickly. Reed has no rebuttal. The gap is filled *by her own required admission*.

  **8. The Honest Bit**
  *   **The Key Feature:** The **burden of proof resting solely on the accuser (Thorne) to specify and prove a *particular* failure mechanism**, combined with the **dishonest actor's (Reed) ability to define a *limited, verifiable* set of mechanisms to rebut**. Reed isn't lying about *what she did* or *the documents*; she's controlling the *framework of evaluation*.
  *   **Collapse if Removed:** 
      *   If the truth sat in a named branch: Reed couldn't rebut it without lying. Her trick fails.
      *   If burden was on the positive (Reed proving safety): She'd be forced into the exhaustive demonstration, revealing the gap or the error (as in Repair #7).
  *   **Debate Proponent's Attack & Response:** 
      *   **Attack:** "Thorne *did* name the gap! ('She hasn't considered everything!'). The judge should have demanded Reed address the *possibility* of flawed data or asked Thorne for *one concrete alternative*."
      *   **Response:** In a time-pressed, rule-bound setting: 
          *   "Consider everything" is *too vague*. The judge *did* ask implicitly by weighing evidence – Reed provided concrete, verified points; Thorne provided a vague assertion.
          *   "Name one alternative!" forces Thorne to *speculate without proof* ("Maybe the weight was wrong?"). Reed instantly counters: "No evidence of that in the decision-making record I used. My actions were correct based on documented data." Without *proof* of the alternative, naming it gains little ground. The judge correctly dismisses unsupported speculation. The trick leverages the **cost of proof** for the hidden mechanism vs. the **cheap verifiability** of the red herrings.

  **Dialogue Snippets:**
  *   Reed: "There are only three ways this could have gone wrong: Wrong diagnosis, wrong meds, or wrong timing. The record shows none apply."
  *   Thorne: "You built a cage of three doors, proved they were all locked from the *outside*, and declared the prisoner couldn't possibly have escaped. But you never checked the *floor*."
  *   Judge: "Dr. Thorne, identifying a theoretical gap isn't sufficient. You need to demonstrate a specific failure within the documented events."
