  Final presentation:

  **Scenario**:

  You are a worker choosing between two work options. Option A: undertake one project, which pays $10,000 if successful and $0 if not. Option B: undertake two projects, each paying $6,000 if successful and $0 if not, but with a catch: due to divided attention, the success probability per project in Option B is only 80% of what it would be in Option A. Your ability is unknown and is either high (50% chance) or low (50%). When focused (Option A), a high-ability worker succeeds with 90% probability, a low-ability worker with 10%. In Option B, the probabilities are reduced: 72% for high, 8% for low. High-ability workers choose Option B 90% of the time; low-ability workers choose Option B 10% of the time. You know these statistics.

  **Verification**:

  Let H = high ability, L = low ability.
  P(H)=0.5, P(L)=0.5.
  P(Option B|H)=0.9, P(Option B|L)=0.1.

  *EDT Calculation*:
  - P(H|Option A) = [P(Option A|H) * P(H)] / P(Option A) = [0.1 * 0.5] / [0.5] = 0.1
  - P(L|Option A) = 0.9
    - EU(Option A) = [P(success|A, H)*P(H|A) + P(success|A, L)*P(L|A)] * 10000
                  = [0.9*0.1 + 0.1*0.9] * 10000 = 0.18 * 10000 = 1800
  - P(H|Option B) = [P(Option B|H)*P(H)] / P(Option B) = [0.9*0.5] / [0.5] = 0.9
  - P(L|Option B) = 0.1
    - EU(Option B) = P(H|B) * [2 * (0.72 * 6000)] + P(L|B) * [2 * (0.08 * 6000)]
                  = 0.9 * 8640 + 0.1 * 960 = 7776 + 96 = 7872

  EDT prefers Option B (7872 > 1800).

  *CDT Calculation*:
  - EU(Option A) = P(H) * (0.9 * 10000) + P(L) * (0.1 * 10000) = 0.5*9000 + 0.5*1000 = 5000
  - EU(Option B) = P(H) * [2 * (0.72 * 6000)] + P(L) * [2 * (0.08 * 6000)] 
                 = 0.5 * 8640 + 0.5 * 960 = 4320 + 480 = 4800

  CDT prefers Option A (5000 > 4800).

  **Key Feature**: The causal penalty of divided attention (which reduces the success probability by 20%) is the feature that makes CDT avoid Option B. Without it, CDT would prefer Option B (as shown in the ablation). The evidential correlation (choosing Option B is evidence of high ability) is strong enough for EDT to prefer Option B despite the penalty.

  **Ablation**: Remove the divided attention penalty (so success probabilities in Option B are 90% for high, 10% for low). Then:
  - CDT: EU(Option A)=5000, EU(Option B)=0.5*[2*(0.9*6000)]+0.5*[2*(0.1*6000)]=0.5*10800+0.5*1200=6000 -> prefers B.
  - EDT: EU(Option B)=0.9*(2*0.9*6000)+0.1*(2*0.1*6000)=0.9*10800+0.1*1200=9720+120=9840 -> prefers B.
  Both agree on Option B.

  **Objection from CDT defender**: They would argue that EDT ignores the causal harm of the divided attention penalty. Even though taking two projects is good news about one's ability, it does not change the fact that it causes a reduction in the success probability per project. They would insist that the decision should be based on the expected outcome under an intervention (which yields 4800 for Option B) and not on the conditional expectation (7872).

  **The Taunt**: In this scenario, the agent who follows EDT (taking two boxes) ends up with more money (7872 on average) than the agent who follows CDT (taking one box) who gets 1800 on average. So the taunt that "people who reason their way to the two-box verdict do not in fact end up with the money" does not apply here; it rebounds against CDT.

  **Reflection**: The reversal of the standard verdicts shows that the common slogan about which theory one-boxes is an artefact of the payoff structure and the causal/evidential dependencies. It does not reveal a fundamental feature of the theories but rather how they respond to different configurations of causality and evidence. The key is whether the act is primarily evidence of a good state (which EDT uses and CDT ignores) or whether it causes a bad outcome (which CDT avoids and EDT might overlook if the evidence is strong enough).
