  Reflective paragraph:

  The existence of this case shows that the standard slogan (EDT one-boxes, CDT two-boxes) is indeed an artefact of the usual payoff structure. In the original Newcomb, the opaque box contains the prize if and only if the predictor thought you would one-box. The causal structure in that case makes the act of taking both boxes causally dominate, but evidentially bad. In our case, we have reversed the causal and evidential aspects: the two-box option now has a causal penalty, but it is evidentially good (because it signals high ability). Therefore, CDT avoids the causal penalty by taking one box, while EDT embraces the two-box option because it is good news. The difference between causal and evidential expected utility lies in how they handle the dependence between the act and the state: EDT conditions on the act, while CDT intervenes.

