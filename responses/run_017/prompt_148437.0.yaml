prompt: |-
  I chair the renewal panel for a national funder's programme-grant scheme. Twice a year, seven of us decide whether to continue roughly fifteen multi-group research programmes for another five-year term, and we must attach to each decision a one-page rationale a lay board can sign off on. The panelists are working scientists with no philosophy training, and we have about forty-five minutes per programme using only documents the teams already submit: the founding proposal, the previous renewal report, and the current progress report with its publication list. No new evidence, no interviews.

  Our arguments keep reinventing, badly, the vocabulary of Lakatos's methodology of scientific research programmes. Someone says a group has stopped predicting anything and is only patching its model; someone replies that every worthwhile programme looks like that for a while; we end up voting by temperament. I want a decision procedure instead. It must operationalize the distinctions that do the work — the protected core versus the belt of auxiliary hypotheses, a progressive versus a degenerating problem shift, an auxiliary that increases what the programme claims and predicts versus one adopted purely to absorb a result that had already come in, and a novel fact anticipated in advance versus one merely accommodated afterward — using only the paperwork we have, in the time we have, in language a physicist or a geneticist will apply without being taught the theory. Give it as ordered questions, state what counts as a sufficient answer to each, say where it terminates in a wind-down and where it hands the question to the board because the issue is our appetite for risk rather than a fact about the science, and mark plainly the points where judgment cannot be eliminated and who owns it.

  Two things will make or break it. First, several of our applicants now file what I call a deferral register: at the outset they list the anomalies they intend to set aside and those they claim they will solve. Does an anomaly's appearing on that list exempt it from counting against the programme, or does declaring it merely make a later degenerating verdict cleaner? And where does repeated narrowing of the class of systems the core is claimed to cover fall — content-decreasing, or genuine discovery about scope — when each narrowing comes with a well-argued paper explaining why the broader claim was overstated? Second, I take Lakatos to hold that whether a programme is degenerating is visible only with hindsight, and that young programmes deserve a long leash; we have an afternoon and a fixed budget. Tell me what my procedure is doing that his framework forbids, and what dated proxy it substitutes for a historical verdict.

  Then run it on three cases. (1) A programme that stated three quantitative results in advance and had all three confirmed, but whose model now needs five auxiliary parameters fitted after the fact, two of them introduced after a measurement conflicted. (2) A programme that registered two anomalies for a ten-year deferral, deferred them, and in the meantime published heavily on questions internal to its own framework, work everyone agrees is excellent and that settles nothing anyone outside cares about. (3) Our flagship, which three of us including me were trained in and which the board cites as a success, whose core claim has been narrowed four times over three terms. If the procedure says to wind down (3), say so plainly and tell me whether to believe it. Finally, state what the procedure cannot do — in particular whether it can distinguish a degenerating programme from a field whose instruments are temporarily inadequate, since that distinction decides most of our hard cases.
reasoning: |-
  Okay, the user chairs a renewal panel for a major research funding program. They need a practical decision procedure to evaluate whether to continue funding multi-group research programs, based on limited documentation and time. The panelists are scientists without philosophy training, and they currently rely on ad hoc discussions that echo Lakatos' concepts but lack structure.

  The user wants an operationalized method that translates Lakatos' framework into clear, judgment-based questions using only existing documents. Key challenges include handling "deferral registers" where teams list anomalies to address later, assessing whether core claim narrowings represent honest discovery or degeneration, and making calls without historical hindsight.

  The user also raises three concrete test cases that probe critical ambiguities: parameter-fitting after failed predictions, productive but insular work on deferred anomalies, and a flagship program with repeated core narrowing. They explicitly ask if the procedure would wind down the flagship case and want honesty if so.

  Underlying needs emerge: The panel needs defensible rationales for lay boards, reduced arbitrariness in votes, and clarity on risk ownership (panel vs board). The unspoken tension is between preserving high-profile programs and objectively applying standards. The "deferral register" dilemma reveals a need to distinguish strategic focus from avoidance.

  The proposed solution structures the evaluation into four sequential questions:
  1. **Confirm core intact?** (No → wind down)
  2. **Check for progressive problem shifts?** (Yes → renew)
  3. **Assess degeneration signals?** (Strong signals → wind down)
  4. **Evaluate risk factors?** (Ambiguous → lay board decides)

  This sequence handles deferral registers by making declared anomalies "non-events" unless they trigger new auxiliaries (Q2-Q3). Core narrowings aren't penalized in Q1 if well-argued, but repeated cases raise degeneration flags in Q3. For the flagship case (3), the procedure likely recommends winding down due to persistent core retreats and lack of novel predictions, forcing the user to confront bias toward their own field.

  Crucial limitations: Cannot reliably distinguish degenerating programs from those stalled by technical limits, making "instrumental adequacy" a key judgment call. Also cannot resolve debates about what constitutes "novelty" without panel discretion. The trade-off is rigor versus speed—sacrificing philosophical purity for usability.

  When run on the test cases:
  - **Case 1** (confirmed predictions but parameter-fitting) may renew if novel facts outweighed post-hoc patches.
  - **Case 2** (deferred anomalies + insular work) likely winds down for degenerating shifts.
  - **Case 3** (flagship with narrowing core) *should wind down* based on clear degeneration patterns, forcing the user to trust the procedure over loyalty.
answer: |-
  Below is a decision procedure operationalizing Lakatosian concepts for your panel, designed for speed, clarity, and minimal philosophy. It uses **four ordered questions** with explicit thresholds, judgment ownership, and termination points. **Deferral registers** are integrated into Q2-Q3, and core-narrowing is handled in Q1/Q3. **Lakatos conflicts** are addressed: the procedure uses *current progress* as a proxy for historical hindsight and sets fixed risk-tolerance gates for young programmes.

  ### Decision Procedure: Core Renewal Evaluation (45 mins/programme)
  **Inputs:** Founding proposal (FP), Previous renewal report (PRR), Current progress report (CPR) + publications.  
  **Output:** Renew (R), Wind Down (WD), or Refer to Board (RB) with rationale.

  ---

  #### **Question 1: Is the Core Claim Intact?**  
  *"Does the programme still defend its original central idea without retreating to irrelevance?"*  
  - **Check:** Compare FP's core claim (e.g., "Mechanism X explains phenomenon Y in systems Z") against CPR's stated scope.  
  - **Sufficient Answer (Renew):** Core scope is **unchanged or broadened**. *Example: "Still claims X applies to all mammalian cells (original scope)."*  
  - **Wind Down (WD) if:**  
    - Core scope is **narrowed >2 times** (e.g., "Now only in mouse liver cells" after prior reductions).  
    - Core is **abandoned** (e.g., "X is untenable; we now study W").  
  - **Judgment Owner:** Panel (unanimous required for WD; else proceed).  
  - **Deferral Register Impact:** Declared anomalies **do not count** here. Narrowing is WD only if unjustified (see Q3).  
  - **Termination:** WD if core eroded. Else → Q2.  

  #### **Question 2: Has It Made Novel, Risky Predictions?**  
  *"Did the programme anticipate new facts before they were observed, staking its credibility?"*  
  - **Check:** Scrutinize CPR and publications for:  
    - **Pre-registered predictions:** Quantitative forecasts in FP/PRR *before* data.  
    - **Novel facts:** Results not trivially implied by existing theory (e.g., "Predicted particle mass = 1.4 TeV" vs. "Confirmed known enzyme kinetics").  
  - **Sufficient Answer (Renew):** ≥1 **novel prediction confirmed** OR ≥2 **high-risk pre-registered tests conducted** (even if mixed outcomes).  
  - **Wind Down (WD) if:**  
    - **Zero novel predictions attempted** AND **no pre-registered tests** in 5 years.  
    - All predictions **post-hoc** (e.g., model tweaked *after* data).  
  - **Refer to Board (RB) if:** Predictions attempted but failed (e.g., 0/3 confirmed) → Board decides risk tolerance.  
  - **Judgment Owner:** Panel (assess "novelty"; majority vote).  
  - **Deferral Register Impact:** Anomalies *on the register* **exempt** from "failure" here. But deferring ≠ solving; see Q3.  
  - **Termination:** WD if no predictions; RB if all failed; else → Q3.  

  #### **Question 3: Is the Auxiliary Belt Progressing or Degenerating?**  
  *"Are model changes expanding insight or just firefighting?"*  
  - **Check:** Track model changes in CPR vs. FP/PRR. Flag:  
    - **New parameters/fixes** added post-conflict.  
    - **Content trend:** Does the belt *add* mechanisms/predictions (+) or *remove/restrict* scope (–)?  
  - **Sufficient Answer (Renew):** Auxiliaries **increase predictive power/content** (e.g., "Added sub-model for hypoxia, doubling testable claims").  
  - **Wind Down (WD) if:** ≥3 of these **degeneration signals**:  
    1. **Post-hoc patches:** Auxiliaries added *after* conflicting data (e.g., "Introduced parameter β after Experiment Z contradicted us").  
    2. **Content decrease:** Core narrowed *without* novel discovery (e.g., "Restricted to mice" without new biological insight).  
    3. **Deferred anomalies untouched:** >50% of deferred anomalies unaddressed *and* no progress on them.  
    4. **Insular work:** >70% of publications only address internal questions (e.g., model calibration).  
  - **Judgment Owner:** Panel (majority vote on signals; WD if ≥3).  
  - **Deferral Register Impact:** Anomalies *not* on the register count as **degeneration signals if unaddressed**. On-register deferrals become signals **only if untouched by deadline**.  
  - **Termination:** WD if degenerating; else → Q4.  

  #### **Question 4: Can External Validation Compensate?**  
  *"If Q2-Q3 are weak, is there compensating impact?"*  
  - **Check:** CPR's "broader impact" claims + publication metrics.  
  - **Refer to Board (RB) if:**  
    - **High-rigor incremental work** (e.g., "No novel predictions but 10 Nature papers refining techniques").  
    - **Young programme** (<10 years old) with plausible future bets.  
  - **Renew (R) if:** Field-wide adoption (e.g., "Model now used by 3 rival programmes").  
  - **Wind Down (WD) if:** Neither applies.  
  - **Judgment Owner:** Board (owns risk appetite).  
  - **Termination:** Final outcome.  

  ---

  ### What This Does vs. Lakatos
  - **Forbids:** Lakatos requires *historical hindsight* to judge degeneration. We substitute **pre-registered predictions** and **tracked model changes** as real-time proxies.  
  - **Proxy for "Young Programme Leash":** Q4 sends young/high-potential programmes to the Board for risk-based renewal.  
  - **Dated Metric:** Uses **"number of post-hoc patches"** (Q3) as a stand-in for Lakatos' "degenerating problem shift."  

  ---

  ### Test Case Applications
  #### **Case 1: Confirmed Predictions but Post-Hoc Parameters**  
  - **Q1:** Core intact → Proceed.  
  - **Q2:** 3/3 predictions confirmed → **Renew** (novelty confirmed).  
  - *Rationale:* Prediction success overrides post-hoc parameters (degeneration signal in Q3 is moot).  

  #### **Case 2: Deferred Anomalies + Insular Work**  
  - **Q1:** Core intact → Proceed.  
  - **Q2:** Zero novel predictions → **WD/RB**.  
    - *If predictions attempted but failed:* RB (Board weighs risk).  
    - *If no predictions:* WD (Q2).  
  - **Q3:** Degeneration signals: (1) Deferred anomalies untouched, (4) Insular work (70%+ internal papers) → **WD** (≥2 signals).  
  - *Rationale:* Deferral register buys time but failure to address + insularity = degeneration.  

  #### **Case 3: Flagship with Core Narrowed 4x**  
  - **Q1:** Core narrowed 4x → **WD** (automatic if >2 narrowings).  
  - *Judgment Note:* If panel unanimously agrees narrowings were "genuine discoveries" (e.g., "Found why core only works in condition Q"), override to Q2. Else WD.  
  - **Should you believe WD?** Yes. **Unless** narrowing accompanied novel predictions (e.g., "Restricted to superconductors but predicted new critical temperature"). Your bias as insider demands strict Q1 enforcement.  

  ---

  ### What the Procedure Cannot Do  
  1. **Distinguish Degeneration from Technical Limits:**  
     - A programme stalled by inadequate instruments looks identical to a degenerating one (both show no novel predictions/post-hoc patches).  
     - **Workaround:** In Q3, panel must judge if delays are *plausibly technical* (e.g., "Gravitational wave detection awaiting LIGO upgrade") → Push to Q4 for Board risk assessment.  
  2. **Resolve "Novelty" Debates:**  
     - Whether a fact was "novel" or "trivial" requires panel judgment (e.g., "Predicted protein fold" may be novel to structural biologists but obvious to biophysicists).  
  3. **Handle Strategic Deferrals:**  
     - Programmes can game deferral registers by listing every anomaly. Q3 counters by culling those making no progress.  
  4. **Replace Temperament:**  
     - Q1 and Q3 require voting. The procedure makes biases explicit but can't eliminate them.  

  ### Final Rationale Structure  
  For lay boards, distill the 4Q outcome into:  
  > **"Core: [Intact/Shifted]. Predictions: [Novel/None]. Model: [Progressing/Degenerating]. Risk: [Low/High]. Verdict: [R/WD/RB]."**  
  Example for Case 3: *"Core narrowed 4x, no novel predictions, repeated retreats. Wind down."*  

  This balances Lakatos' framework with operational pragmatism. It forces degeneration signals into countable metrics, uses deferral registers as "grace periods" but holds programmes accountable, and redirects risk decisions upward. Run it for one cycle—you’ll know inside three programmes whether it prevents temperament votes.
