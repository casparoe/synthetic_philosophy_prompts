prompt: |-
  I work as a research assistant to a retired diplomat who now writes and broadcasts on the ethics of force, and I am the one assembling a table of everything she has publicly committed to, because she has agreed to give evidence to a parliamentary committee on humanitarian intervention next month and has a bad habit of saying that each case must be judged on its own facts. The track record I have managed to reconstruct from her columns, her memoir and two interviews is this. On Kosovo in 1999 she backed the NATO air campaign despite the absence of Security Council authorization, and she continues to insist that legal status and moral justification can come apart; she also always notes that the point was to stop the expulsion of the Albanian population and that the Serbian leadership was left in office afterwards. On Iraq in 2003 she was opposed from the start: no authorization, no ongoing mass atrocity, regime change announced as policy in advance, the threat assessment overstated, and the aftermath catastrophic. On Libya in 2011 she gives what I think of as her split verdict: the initial air campaign, authorized by the Council to protect civilians, was right; the arming of the rebels and the pursuit of the leadership turned protection into a war of overthrow; and she treats the collapse that followed as part of the verdict rather than as bad luck. On Syria in 2013 she opposed strikes after the chemical attack outside Damascus, on the grounds that they would have been unauthorized, that nobody had a plan for what came next, that escalation was likely, and that some of the rebels she did not want armed would have benefited. On Rwanda in 1994 she calls the failure to reinforce and re-mandate the mission already on the ground one of the great moral failures of her professional lifetime, and she does not treat the lack of authorization as any kind of excuse. On the Indian intervention in East Pakistan in 1971 she has said it was on balance right, though she never fails to add that it ended in the dismemberment of a state, and I cannot get her to say how much that counts against it.

  The case she will be asked about is not a historical one. The government of Vardania has for fourteen months been driving the Orran minority out of two northern provinces, using regular army units together with allied militias; UN monitors on the ground estimate forty thousand dead and six hundred thousand displaced, and their public forecast is several hundred thousand more deaths if the campaign continues through the winter. A Security Council resolution authorizing force to protect civilians was put to a vote and vetoed by a permanent member that supplies the Vardanian air force and has a basing agreement with it. A regional organisation of neighbouring states then authorized an air campaign, which its members are now flying, with no ground component; the mandate as written covers only the aircraft and artillery being used against civilians. The intervener has publicly refused to arm the Orran self-defence militias, though a third country is doing so quietly and everyone knows it. In the fifth week, after the government began directing attacks on civilians from the national command bunker under the presidential palace, the bunker was struck and the president and much of the high command were killed; the regular army then defected to the rebels rather than dissolving, so unlike Iraq the officer corps and the ministries survived more or less intact, and the capital fell three weeks later. Revenge killings of civilians belonging to the formerly dominant group have since claimed, by the monitors' count, something in the low thousands. The intervening state also has a second reason for being there: it wants to keep the port access the old government granted it, and it has said nothing to dispel that impression.

  I have to write the briefing note predicting what she will say, and I would rather get the structure of her thinking right than the bottom line. As I read the table, at least four rules fit all six of her verdicts about equally well: a rule requiring multilateral authorization with a narrow exception for ongoing mass atrocity the Council has failed to address; a rule that counts authorization only as evidence and asks whether the force was necessary, proportionate in its means and expected to leave things better; a rule that turns on whether a new political outcome was imposed rather than merely foreseen; and a rule that asks whether the intervener's motives were sufficiently clean. My sense is that these come apart sharply on Vardania, because it is at once unauthorized, atrocity-stopping, means-limited, lethal to a head of state, outcome-imposing, aftermath-tolerable and motive-mixed, and the surface analog is Libya while the deeper ones are Kosovo and 1971. So: what verdict should I expect her to give, and should I write it up as approval, condemnation, or another split; which of those rules is she most plausibly running, and what does each of the others predict here; where exactly do the two closest candidates diverge and how confident should I be; if her track record genuinely underdetermines the case, what principle would she be committing herself to with each of the available answers; and finally, what hypothetical variant should I put to her in the prep session to force the surviving rules apart?
reasoning: |-
  Hmm, the user is a research assistant for a retired diplomat who specializes in the ethics of force. They need to predict how this diplomat will assess the fictional Vardania intervention scenario for an upcoming parliamentary committee testimony. The diplomat has a nuanced position across historical cases - supporting Kosovo, opposing Iraq, split on Libya, opposing Syria, regretting Rwanda, and supporting India's East Pakistan intervention.

  The user has identified four potential ethical frameworks that could explain the diplomat's past positions:
  1) Multilateral authorization with exception for mass atrocities
  2) Necessity/proportionality/outcome assessment
  3) Distinction between protection vs. regime change
  4) Purity of intervener's motives

  Vardania presents a complex case that tests these frameworks: unauthorized intervention, mass atrocities occurring, means-limited air campaign, resulted in regime change, mixed motives, and post-conflict revenge killings. The surface analogy is Libya but core similarities point to Kosovo (unauthorized atrocity-stopping) and 1971 (state dismemberment).

  For the briefing note, I should analyze how each framework would judge Vardania:
  - Framework 1 might approve due to ongoing atrocities despite lack of UN authorization
  - Framework 2 would focus on outcomes - thousands saved vs. revenge killings
  - Framework 3 would condemn since protection turned into regime change
  - Framework 4 would be skeptical due to mixed motives

  The diplomat will likely give a split verdict similar to Libya: approving initial protection but questioning regime change. Her core principle seems to be the protection/regime change distinction, with secondary emphasis on outcomes. To test this, I should propose a hypothetical where motives are pure but regime change occurs.

  The user should structure the briefing to show how the rules diverge on motive purity vs. outcome imposition, and suggest a hypothetical about intervention in identical circumstances but with purely altruistic motives.
answer: |-
  Based on your detailed reconstruction and the Vardania scenario, here's a breakdown of the diplomat's likely reasoning, the applicable rules, and strategic preparation points:

  ### Predicted Verdict for Vardania
  *   **Likely: Conditional Approval with Significant Reservations** (A "split verdict" leaning toward justification, distinct from Libya's disapproval of escalation).
  *   **Structure:**  
      *   **Approves the initial intervention:** The unauthorized action halted an ongoing mass atrocity (40k dead, 600k displaced, forecast of hundreds of thousands more) that the UNSC failed to address due to a veto by a complicit permanent member. This mirrors her core Kosovo justification ("legal status and moral justification can come apart" for atrocity-stopping).  
      *   **Condemns the decapitation strike:** Targeting the command bunker (killing the president/high command) shifted the mission from civilian protection to regime change. This echoes her Libya critique ("protection into a war of overthrow").  
      *   **Notes mitigating factors in the aftermath:** While revenge killings occurred ("low thousands" vs. "hundreds of thousands" forecast), the state collapse was *less* catastrophic than Iraq or Libya – ministries/officer corps remained, enabling a quicker transition (unlike Libya's militia chaos). However, she will emphasize these killings as a *direct consequence* of the regime change aspect.  
      *   **Strongly criticizes the mixed motives:** The intervener's undisclosed interest in port access undermines moral legitimacy and creates dangerous precedent, even if the primary motive was likely humanitarian.  
      *   **Bottom Line:** She will argue the intervention was *morally necessary to stop the atrocity* (overcoming the authorization deficit), but *morally flawed* due to the regime change element and mixed motives. The outcome, while imperfect and containing serious wrongs, was *less bad* than the alternative of non-intervention. Analogizes more strongly to Kosovo/1971 (atrocity-stopping, acceptable aftermath despite flaws) than Libya (illicit regime change leading to collapse).

  ### Analysis of Rules & Predictions for Vardania
  | Rule                                      | Core Principle                                                                 | Prediction for Vardania                                                                    | Fit with Track Record                                                                                              |
  | :---------------------------------------- | :----------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- |
  | **1. Multilateral Auth + Mass Atrocity Exception** | UNSC auth is primary; moral exception *only* for ongoing mass atrocity UNSC failed. | **Approval:** Clear ongoing atrocity + UNSC failure due to veto justifies exception.         | Fits Kosovo (exception), Iraq (no atrocity/no auth), Libya (initial auth), Syria (no atrocity?), Rwanda (failure to act despite mandate), 1971 (unauthorized but atrocity?). |
  | **2. Necessity/Proportionality/Better Outcome** | Auth is evidence, not rule. Focus on: Was force necessary? Proportionate? Expected better outcome? | **Conditional Approval:** Force necessary/proportionate to stop atrocity? Outcome *better* than non-intervention? (Yes, despite revenge killings). | Fits Kosovo (necessary, proportionate? outcome better), Iraq (unnecessary, disproportionate? outcome worse), Libya (initial: yes? Escalation: no), Syria (unnecessary? outcome likely worse), Rwanda (necessary, proportionate, outcome better), 1971 (necessary? outcome better despite dismemberment). **Strongest fit overall.** |
  | **3. Protection vs. Imposed Outcome**     | Key distinction: Protecting civilians *within* conflict vs. imposing new political outcome. | **Split/Condemnation:** Initial air campaign (protection) potentially justified; bunker strike/regime change condemned. Outcome imposition is the fatal flaw. | Fits Kosovo (protection, regime left), Iraq (imposed outcome), Libya (split: protection good, overthrow bad), Syria (strike would aid rebels?), Rwanda (pure protection failed), 1971 (imposed outcome - dismemberment noted as negative). |
  | **4. Purity of Motives**                  | Intervener's motives must be primarily/solely humanitarian.                    | **Condemnation:** Port access motive fatally contaminates the intervention, regardless of outcome. | Fits Kosovo (motives debated but she doesn't emphasize impurity), Iraq (mixed/oil motives implied?), Libya (motives not her focus), Syria (not focus), Rwanda (not focus), 1971 (India's motives complex). **Weakest fit.** She notes motives but doesn't make them the *sole* determinant. |

  ### Where Rules Diverge & Confidence Level
  *   **Critical Divergence Point:** Between **Rule 2 (Necessity/Outcome)** and **Rule 3 (Protection vs. Outcome Imposition)**.
      *   **Rule 2 Focus:** *Was stopping the atrocity necessary and likely to lead to a better outcome?* Vardania scores highly here. The massive ongoing atrocity and UNSC failure create necessity. The intervention, while causing revenge killings, likely saved hundreds of thousands of lives compared to non-intervention. The state didn't fully collapse. Outcome-based, this leans toward justification.
      *   **Rule 3 Focus:** *Did the action stay within protection or cross into regime change?* The bunker strike was decisive regime change. Even if beneficial, this violates the principle of non-imposition. This is a fundamental condemnation point.
  *   **Confidence:** **Moderate-High for a "split" leaning approval.** Rule 2 is her most consistent driver (fits all cases well). Rule 3 is her major secondary filter, explaining her Libya split and Kosovo distinction. Vardania uniquely triggers *both* the Rule 2 justification (mass atrocity, necessary, better outcome) *and* the Rule 3 condemnation trigger (decisive regime change). Her Rwanda regret shows the primacy of stopping atrocity (Rule 2), while her Libya split shows aversion to regime change (Rule 3). Vardania forces a choice, but Rule 2's weight (stopping genocide) likely outweighs Rule 3's violation *in this specific outcome*, mitigated by the less-catastrophic aftermath. Rule 1 supports justification via the atrocity exception. Rule 4 (motives) adds criticism but isn't decisive in her history.

  ### Principles Committed To With Each Answer
  *   **Full Approval:** Commits to Rule 2 (Outcome Justification) as *dominant* over Rule 3 (Non-Imposition), even when regime change occurs. Argues stopping genocide morally overrides non-intervention norms *and* non-imposition concerns if the outcome is tolerable.
  *   **Split Approval (as predicted):** Commits to Rule 2 (Necessity/Outcome) as the *primary* justification for force in mass atrocities, but Rule 3 (Protection vs. Imposition) as a *critical limiting principle*. Regime change invalidates the *means* even if the *ends* were necessary/beneficial.
  *   **Condemnation:** Commits to Rule 3 (Non-Imposition) or Rule 1 (Strict Auth) as *trumping* Rule 2 in this case. Argues regime change (Rule 3) or lack of pure UNSC auth (Rule 1) makes the intervention illegitimate regardless of the atrocity stopped or the outcome achieved. Motives (Rule 4) would be a reinforcing factor.

  ### Hypothetical to Force Rules Apart
  To isolate **Rule 2 (Outcome)** vs. **Rule 3 (Imposition)** and expose her prioritization:

  > **"Imagine Vardania exactly as described: atrocity, UNSC veto, regional auth for air campaign. The intervener has *exclusively* humanitarian motives (no port interest). After weeks of successful civilian protection, intelligence *conclusively* shows the President will order a final, systematic massacre of the remaining 200,000 Orrans in the northern enclaves within 48 hours if not stopped. The *only* way to prevent this is a precision strike on his command bunker, which will certainly kill him and his high command, leading to regime collapse. Should the strike be launched?"**

  *   **Why it works:**
      *   Removes motive impurity (Rule 4 distraction).
      *   Removes lack of multilateral legitimacy concern (Rule 1 - regional auth exists).
      *   Focuses *solely* on the core tension: Is preventing an imminent, massive, specific massacre (Rule 2 - Necessity/Better Outcome) sufficient moral justification for an action that *will* decisively impose a new political outcome/regime change (Rule 3 - Imposition)?
      *   Her answer reveals whether Rule 2 or Rule 3 is truly paramount when forced into direct conflict on the regime change point. A "Yes" prioritizes Rule 2 absolutely. A "No" elevates Rule 3 absolutely. A nuanced answer ("Only if...") confirms their interplay but shows her weighting.

  ### Recommendation for Briefing Note Structure
  1.  **Summary Verdict:** Predict "Conditional Approval with Strong Reservations" (Initial phase justified to stop genocide; decapitation strike condemned as regime change; mixed motives criticized; outcome seen as less bad than non-intervention despite revenge killings).
  2.  **Core Reasoning Framework:** Emphasize **Rule 2 (Necessity/Proportionality/Better Outcome)** as the foundational driver, heavily moderated by **Rule 3 (Protection vs. Imposed Political Outcome)**. Rule 1 (Auth as evidence/exception) supports justification; Rule 4 (Motives) supports criticism but isn't decisive.
  3.  **Analogies:** Kosovo/1971 (unauthorized atrocity-stopping with acceptable aftermath) are stronger than Libya (illicit regime change leading to catastrophic collapse). Rwanda reinforces the imperative to act.
  4.  **Key Tension:** Highlight the conflict between the moral necessity of stopping the ongoing atrocity (Rule 2) and the violation of the norm against imposing regime change (Rule 3) via the bunker strike. Argue she resolves this by prioritizing atrocity-stopping but condemning the *means* of regime change.
  5.  **Potential Weakness:** Be prepared for questions on whether condemning the bunker strike is coherent if it was the *only* way to stop the final massacre and its collapse led to a *better* outcome than alternatives. Use the hypothetical.
  6.  **Prep Focus:** Use the proposed hypothetical to force clarity on the Rule 2 vs. Rule 3 hierarchy. Also probe her weighting of the revenge killings within the "better outcome" calculus.

  This structure captures her likely nuanced position, grounded in her track record, while preparing her for the toughest philosophical and practical challenges the committee might raise. Good luck!
