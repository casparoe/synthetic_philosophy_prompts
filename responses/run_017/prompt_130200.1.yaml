  The core tension they've identified is really intriguing: why do we rotate lawmakers but give life tenure to judges, when both anti-corruption arguments could theoretically support the opposite arrangement? And why use citizen juries for fact-finding but professional judges for legal interpretation? 

  I need to reconstruct the implicit theory behind these designs. The key dimensions seem to be: 
  - Nature of the task (will vs truth-tracking)
  - Skill requirements
  - Vulnerability to capture
  - Need for stability
  - Distribution of divisible benefits

  The user wants me to distinguish strict presuppositions from merely compatible theories. For example, judicial life tenure strictly presupposes that independence from political pressure is paramount for adjudication, while it merely fits well with (but doesn't require) the idea that legal expertise deepens with time.

  For the counterfactual challenge: if anti-capture were the main concern, we'd actually want to rotate judges frequently like jurors. But the practice suggests judicial tenure serves a different primary purpose - not avoiding capture but preserving interpretive consistency and insulating rights protections from majoritarian pressures. This reveals the pattern isn't unified but combines distinct rationales.

  The "insulated legislature" proposal is clever - sortition lawmakers with single terms alongside elected judges. It would appeal to the anti-corruption half of legislative theory while abandoning democratic accountability. For judges, it adopts the legislative model of accountability but loses judicial independence. The jury precedent is tricky - while it shows citizen bodies can work, juries have no agenda-setting power and operate within strict bounds, making them poor models for legislation.

  Throughout this, I should maintain the user's level of analytical rigor while making the implicit theories explicit. The test cases will help reveal which rationales are fundamental versus contingent. The institutional design choices reflect deeper commitments about the nature of different governmental functions that aren't always logically consistent when examined closely.
answer: |-
  Here's a reconstruction of the implicit theory behind these institutional designs, followed by analysis of your counterfactual and proposal, and an evaluation of the jury precedent:

  ### Reconstructed Implicit Theory: The Tenure Gradient
  The pattern suggests tenure rules are calibrated to balance **four core dimensions** across functions:

  1.  **Nature of Output:** Is the task primarily *will-formation* (expressing collective choice) or *truth-tracking* (discovering facts/norms)?
  2.  **Vulnerability to Capture:** How susceptible is the officeholder to undue influence based on predictability, identifiability, and the value of future benefits?
  3.  **Skill/Judgment Required:** Does the task demand deep expertise built over time or "common sense" judgment representative of the community?
  4.  **Need for Stability & Consistency:** Must outputs be predictable and consistent over long time horizons to maintain systemic legitimacy?

  **Application to Functions:**

  *   **Legislating (Rotating Tenure):**
      *   *Strict Presuppositions:* Legislation is fundamentally an act of **will-formation** expressing the current majority's preferences. Long tenure creates attachment to office, making legislators prioritize re-election over constituent will (vulnerability to capture via electoral dependence). Rotation ensures responsiveness to the electorate's changing will.
      *   *Fits Well With:* Legislators allocate divisible benefits (money, privileges), making them prime targets for bribery/lobbying; rotation limits the value of capturing an individual. Common sense/judgment is valued, but expertise is secondary to representativeness.
      *   *Underdetermined:* Rotation could be defended *either* as preventing capture *or* as ensuring democratic responsiveness. The pattern doesn't strictly require that capture is the *primary* threat, only that long tenure conflicts with will-formation.

  *   **Judging (Life Tenure):**
      *   *Strict Presuppositions:* Adjudication is fundamentally **truth-tracking** (applying law to facts) requiring **insulation from political pressure** (both electoral and from other branches). Life tenure removes dependence on those who could reappoint/re-elect or punish. It fosters **deep expertise** in complex law and precedent.
      *   *Fits Well With:* Judges interpret rights and duties, requiring **long-term stability and consistency** in legal principles, resisting transient majorities. While individually identifiable, insulation makes them *harder* to capture than dependent officials. The task requires specialized judgment honed by practice.
      *   *Underdetermined:* Life tenure *could* also fit a theory emphasizing judicial aristocracy or finality of decisions, but the anti-dependence rationale is the most consistent with the overall "anti-corruption" framing seen in term limits.

  *   **Administering (Permanent Civil Service):**
      *   *Strict Presuppositions:* Administration requires **specialized expertise and institutional memory** built over time. It must provide **continuity and neutral execution** of policy *regardless* of the governing party. Protection from dismissal insulates implementation from partisan interference.
      *   *Fits Well With:* Expertise is paramount; common sense is insufficient. Stability in administration is crucial for predictable governance. While divisible benefits are allocated, the focus is on neutral application of rules, reducing the *type* of corruption (more policy distortion than personal bribery).
      *   *Underdetermined:* The rationale overlaps significantly with judging (expertise, stability, insulation) but differs in the *source* of pressure (more partisan/political than direct electoral or litigant influence).

  *   **Finding Facts (Juries / Sortition & Dissolution):**
      *   *Strict Presuppositions:* Fact-finding in specific cases is best done by **untrained citizens applying common sense and community standards**. **Anonymity, randomness, and impermanence** are crucial safeguards against **targeted influence and corruption**. Unanimity forces deliberation and protects against outlier biases.
      *   *Fits Well With:* Fact-finding is pure **truth-tracking** (what happened?), distinct from law application. No need for long-term consistency beyond the case. Training or tenure would distort the "common sense" virtue. Dissolution eliminates future leverage.
      *   *Underdetermined:* Sortition *could* be seen as pure democracy or pure anti-capture; the unanimity/no-reasons aspects strongly point to anti-capture/anti-bias as the dominant concern here.

  **The Gradient:** The primary dimension organizing tenure is the **balance between political accountability/will-formation and independence/truth-tracking**. Legislating sits at the "accountability/will" pole; judging and administering sit at the "independence/truth/stability" pole; juries sit at a unique "anti-capture/common sense" point. Vulnerability to capture *modulates* the design *within* these poles: legislators are rotated *because* they are democratically accountable *and* allocate divisible goods; judges are insulated *because* their truth-tracking must be independent *despite* being identifiable.

  ---

  ### Testing the Counterfactual: Rotating Judges vs. Professional Legislators?
  *   **The Challenge:** If the *anti-capture* rationale were the *sole* or *dominant* driver, rotating judges (like juries) would seem superior to insulating identifiable lifers, while professional legislators would be less susceptible to lobbyists than amateurs.
  *   **The Practice's Resource for Answering:**
      1.  **Different Types of Capture:** The threat to judges isn't primarily *case-specific bribery* (addressed by judicial ethics rules, court procedures, and appellate review) but *systemic political pressure* (fear of non-reappointment, popular backlash on controversial rulings). Life tenure specifically counters *this* dependence. A rotating judge *is* more vulnerable to electoral or appointment-cycle pressure. Juries counter *case-specific* bribery/capture via anonymity and dissolution – a different threat model.
      2.  **Expertise & Stability Imperative:** Truth-tracking in law requires deep expertise and stable interpretation over decades. Frequent rotation would create chaotic, inconsistent jurisprudence, undermining the rule of law itself. Legislators don't need the *same* depth of permanent expertise because they set broad policy, not apply intricate rules to specific facts over generations.
      3.  **The Primacy of Independence for Adjudication:** The judicial rationale isn't *just* anti-capture in a narrow sense; it's **preserving decisional independence** for the core function of impartially applying the law against powerful actors (including the state). Rotation inherently introduces dependence on the appointing/electing power. Legislative rotation *embraces* dependence on the electorate as essential to its function.
  *   **Conclusion:** The counterfactual shows the pattern **isn't driven by a single, unified anti-capture rationale.** It reveals **two distinct designs:**
      *   **A:** *Rotation for Accountability/Will-Formation* (Legislatures): Focuses on ensuring responsiveness to the popular will and preventing entrenchment in an office allocating divisible goods.
      *   **B:** *Insulation for Independence/Truth-Tracking/Stability* (Judiciary, Administration): Focuses on removing improper pressures to ensure neutral application of rules/law and long-term consistency. Anti-capture is a *consequence* of this insulation, not its sole purpose. Jury design is a third, hyper-focused anti-capture mechanism for specific fact-finding. The overall pattern is a **bundle of rationales tailored to distinct functions,** not a single theory applied uniformly.

  ---

  ### Testing the "Insulated Legislature" Package
  *   **The Package:**
      *   *Legislature:* Sortition, single 6-year term, generous pension, employment ban, professional staff.
      *   *Judiciary:* Elected, short renewable terms, non-partisan/low-salience elections.
  *   **Analysis Against Reconstructed Theory:**
      *   **Insulated Legislature Half:**
          *   *Endorsed by:* The **anti-corruption/anti-capture half of the *legislative* rationale** and the **expertise/stability half of the *administrative/judicial* rationale.**
          *   *Appeal:* Sortition and single term drastically reduce electoral dependence, lobbying influence (no future campaigns), and the "careerism" problem. The pension/ban further reduces post-office capture. Staff provides needed expertise. It prioritizes independence and impartiality *over* democratic accountability for will-formation.
          *   *Breaks With:* The core **democratic accountability/will-formation rationale for legislatures.** Sortition severs the direct electoral connection. A single long term makes legislators unaccountable to the electorate during their term. It transforms the legislature from an expression of popular will into a deliberative, insulated body more akin to an upper house or constitutional council. It abandons the presupposition that law*making* must be directly accountable.
          *   *More Defensible?* On pure **anti-capture grounds**, likely yes – it's arguably superior to term-limited elected legislatures. On **expertise/neutrality grounds**, potentially yes (like a permanent commission). But it fundamentally **fails** on the dimension of **democratic legitimacy for will-formation.** It's more defensible if you reject the presupposition that legislation *must* be directly accountable.
      *   **Rotating Judiciary Half:**
          *   *Endorsed by:* The **democratic accountability half of the *legislative* rationale.**
          *   *Appeal:* Increases judicial responsiveness to community values ("will" potentially influencing interpretation) and provides a mechanism for accountability.
          *   *Breaks With:* The **core independence/truth-tracking/stability/expertise rationale for judging.** Elections, even non-partisan ones, create dependence and pressure. Short terms amplify this, incentivizing judges to avoid controversial but correct rulings. It undermines long-term legal consistency and the development of deep expertise. Low-salience elections might worsen capture by special interests.
          *   *More Defensible?* Only if you radically redefine judging as primarily an act of popular will-formation rather than independent law application. On the reconstructed theory's own terms (prioritizing independence for truth-tracking/stability), it is **less defensible** than life tenure. It introduces the very vulnerabilities (dependence, capture potential, instability) that judicial insulation is designed to prevent.

  *   **Overall Package Break:** The package **inverts the core presupposition of the tenure gradient.** It makes the legislature insulated like a judiciary (sacrificing accountability) and the judiciary accountable like a legislature (sacrificing independence). It's coherent only under a theory that either rejects the will-formation/truth-tracking distinction or values responsiveness over independence *everywhere*.

  ---

  ### The Jury Precedent: Relevant or Not?
  *   **Evidence of Workability (Sortition Half):**
      *   **Yes, partially.** Juries demonstrate that **ordinary citizens, chosen by lot, *can* perform complex, high-stakes governmental functions** (fact-finding in criminal cases) effectively within a tightly defined scope and procedural framework. They show that anonymity, impermanence, and lack of formal training are not insurmountable barriers to reaching decisions (even unanimous ones). This provides a concrete existence proof for citizen bodies.
  *   **Limitations as Precedent (For Legislature):**
      *   **Narrow, Reactive Remit:** Juries answer a specific, concrete question ("Did X happen?") defined *for them* by others (judge/lawyers). Legislatures must **proactively set agendas, define problems, craft complex solutions, negotiate compromises, and allocate resources across countless issues.** This requires initiative, scope definition, and prioritization utterly absent from the jury role.
      *   **Lack of Agenda-Setting/Power:** Juries have zero power to initiate action or set the terms of debate. Legislatures *are* agenda-setters and wield broad, open-ended power. This difference in **power and initiative** fundamentally changes the dynamics and the potential for systemic impact or error.
      *   **Stakes and Scope:** Jury decisions, while critical, are case-specific. Legislative decisions are general, prospective, and impact millions. The **scale and consequence** are orders of magnitude larger.
      *   **Duration & Deliberation:** A jury deliberates intensely for days/weeks on one case. A legislature must manage a vast portfolio over years. A 6-year term, even with staff, demands sustained engagement and learning far beyond a jury's focused task.
      *   **Expertise Gap:** While juries apply common sense to facts, legislatures deal with highly technical domains (finance, science, infrastructure, etc.). The proposed professional staff *acknowledges* this gap but creates a potential principal-agent problem between the citizen legislator and the expert bureaucrat.
  *   **Conclusion:** The jury is a **precedent for the *feasibility* of sortition and citizen deliberation within a tightly bounded, reactive, non-agenda-setting role.** It shows the *mechanism* can work for *that specific function.* However, it is **not a precedent for the *desirability* or *workability* of sortition for the proactive, agenda-setting, broad-scope, high-stakes, multi-year task of legislation.** The differences in remit, power, scope, duration, and required expertise are too profound. The jury proves citizens can judge a case; it does not prove they can effectively govern.
