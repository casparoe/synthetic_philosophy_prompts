  Hey — I'm running the epistemology reading group next week and I want the handout to be a decision tree on the bootstrapping / easy-knowledge problem rather than the usual list of five views, and I'd rather it be built out of the cases then out of the names (we can attach names at the leaves afterwards). Start everyone from the same commitment: a single report from a source whose reliability you have never checked can still give you knowledge, so nobody gets to dissolve the problem by demanding prior evidence of reliability. From there branch on the questions that actually split people — whether the track-record inference transmits anything at all, whether the defect (if there is one) lives in the inference or in the modal profile of the belief it produces, whether it matters that the sample you generalise from was collected by the very source you are generalising about, whether the worry is really only about knowledge at the reflective level, and whether the two-source version is in better shape than the one-source version.

  I want a concrete case at every node, not just an abstract principle. At minimum: (1) the one-shot case, (2) a repeated-use case where you only ever log the items you were able to check, and you checked the ones that already looked right to you, (3) a two-source case where you have no reason to think their errors are independent, and (4) one I made up for our purposes and haven't seen discussed anywhere: an LLM-evaluation pipeline where you estimate judge-model A's accuracy by having A — or a sibling of A, same family, same post-training — relabel the outputs, observe a high agreement rate, conclude A is a reliable judge, and then go on to use A to grade the outputs of a new model B. That case should do real work: say explicitly which nodes separate "the problem is circularity" from "the problem is a biased or unrepresentive sample" from "the problem is that A and B make correlated mistakes."

  Six to eight branch nodes, six to eight leaves. Each leaf gets a descriptive label plus whatever the position is usually called, one sentence on its most awkward commitment, and one sentence on what it says about the LLM-judge case. Also flag the combinations of answers that no one occupies and say briefly whether that's because they're incoherent or just unattractive, and flag any two leaves your tree can't really pull apart. And please phrase every node so that someone who has never heard of the literature can answer it — no "do you accept closure?" style questions.
