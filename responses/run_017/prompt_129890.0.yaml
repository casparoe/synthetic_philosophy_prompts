prompt: |-
  I maintain, with a team of six, the clinical rule base for a network of eleven hospitals: roughly four thousand rules written in a controlled natural language, which drive automated checks in the electronic record at the moment of ordering and also serve as the reference text nurses and pharmacists actually read on the ward. We meet weekly in change control; every substantive change needs a compliance officer's signature and a rotating clinical lead's, and my team gets about a thirty-minute slot per reported inconsistency, so whatever we do has to be runnable by a new hire with no training in logic and has to terminate in a status tag, an action, a named owner, and a review date.

  The reason I'm writing is that I had a long argument last night with a friend who works in formal ontology. Her position was that every contradiction in our base is a bug — sloppy modelling, stale copies, hidden parameters, imprecise predicates — and that paraconsistent logic is a solution to a problem nobody has outside the semantic paradoxes and a few corners of law and mathematics. I pushed back, because some of our conflicts look structural to me: two authorities of equal standing with no hierarchy between them, two specialty bodies whose guidelines genuinely disagree, an emergency-override meta-rule that conflicts with the rule about how rules get suspended, and policies that encode rival values rather than rival factual beliefs. But I couldn't tell her what the paraconsistent apparatus actually buys us beyond what "flag it and escalate" already does, and I don't want to borrow a metaphysical thesis — that some contradictions are really true — to dignify what may just be unwillingness to clean up my own data. So: write me a triage procedure, as a flowchart in words, for one reported inconsistency between two rules, with the questions in order, what counts as a sufficient answer to each, where it stops with a resolution, where it stops with something like "both in force, named owner, review date," and where it hands the decision to a person because the remaining question is one of values. Ground it in what this literature genuinely supports: why explosion is the thing to be afraid of, the difference between a glut and a gap, the difference between an inconsistency in our representation and one anyone would have to call real, the claim that rationality can require holding both while you look for a resolution, and the gap between a logic that tolerates contradiction and a thesis about what is true. Say plainly at which of our cases the theory is doing real work and at which it is a redescription of ordinary engineering caution. Two specific things I need: a containment test, because our rules inherit from one another and a single glutty pair shouldn't silently invalidate every downstream check — I've been using an informal dependency-set idea plus a relevance test along the lines of "would this consequence still be drawn if the disputed rule were withdrawn," and I want you to adopt it, repair it, or replace it with something better; and a verdict on a proposal of mine, which is that every "both" tag should carry a thirty-day expiry so the base doesn't accrete gluts forever. I suspect that's just the assumption that all inconsistency is temporary, smuggled back in, but I'd like it argued rather than conceded. Please distinguish at least conflicts that dissolve once a hidden parameter, time index, or sense of a vague predicate is made explicit; conflicts between sources of equal authority with no tie-breaker; conflicts involving a rule's application to itself or to the override mechanism; and conflicts where the disagreement is not factual at all. Mark explicitly the points at which judgment cannot be eliminated, even in principle.

  Apply the finished procedure to three live cases. First: two specialty societies of equal standing give incompatible red-cell transfusion thresholds for the same post-operative cardiac population — 7.5 g/dL versus 9.5 g/dL — and the evidence does not settle it; my team's instinct is to pick one and delete the other, and I want to know whether the procedure forbids that. Second: our emergency rule says the incident commander's order overrides every other rule in the base, while our governance rule says no rule may be suspended except by a two-thirds committee vote; these collide exactly when the collision matters. Third: our policy determines death by neurological criteria and stops organ-support, while our accommodation policy permits continued ventilation for a family who holds that the patient is alive as long as the heart beats, and I don't think any amount of procedure will settle which of those the institution is committed to. At least one of the three should come out somewhere my team will not want to go. Finally, give me a five-line glossary of the status tags for new hires, each with a note on what not to do with it, and a short closing section on what the procedure cannot do: I take it it cannot tell me which authority to trust, cannot see conflicts nobody reported, and cannot aggregate two hundred pairwise decisions into any global verdict on whether our institution's commitments are jointly satisfiable — but tell me what else is missing, and in particular where the procedure's willingness to hold both stops being a claim about our rule base and starts being a claim about the world.
reasoning: |-
  We are designing a triage procedure for contradictions in the clinical rule base. The procedure must be grounded in paraconsistent logic and related concepts, and must address the specific requirements and cases provided.

  Key concepts from the literature:
  1. **Explosion (Ex Contradictione Quodlibet)**: In classical logic, a single contradiction allows deriving any conclusion, which is catastrophic. Paraconsistent logics avoid this by not allowing arbitrary conclusions from a contradiction.
  2. **Glut vs. Gap**: 
     - A glut (overdetermined) is a situation where a statement is both true and false (or overconstrained).
     - A gap (underdetermined) is when a statement is neither true nor false (or underconstrained).
  3. **Representation vs. Reality**: An inconsistency in the rule base might be due to imperfect representation (e.g., missing parameters) or might reflect a genuine conflict in the world (e.g., conflicting authorities).
  4. **Rationality and Holding Both**: It can be rational to hold contradictory beliefs temporarily while seeking resolution, without inferring everything.
  5. **Logic vs. Thesis**: Using a paraconsistent logic does not require believing that true contradictions exist in the world; it can be a tool for managing inconsistent information.

  The triage procedure will be a flowchart in words. Steps:

  1. **Initial Report**: An inconsistency between two rules (Rule A and Rule B) is reported.
  2. **Check for Hidden Parameters/Contexts**: 
     - Question: Can the conflict be resolved by making explicit a hidden parameter (e.g., time, patient subgroup, contextual condition) or by disambiguating a vague predicate?
     - If yes, then resolve by refining the rules (e.g., adding conditions) and tag as "Resolved: Refined".
     - If no, proceed.

  3. **Check for Representational Artifact**:
     - Question: Is the conflict due to a mistake in the rule base (e.g., stale copy, typo, unintended consequence of a change)?
     - If yes, then correct the error and tag as "Resolved: Corrected".
     - If no, proceed.

  4. **Check for Authority Hierarchy**:
     - Question: Is there a predefined hierarchy (e.g., specialty society A overrides B, or emergency rule overrides routine) that can resolve the conflict?
     - If yes, apply the hierarchy (e.g., mark one rule as overridden in the relevant context) and tag as "Resolved: Hierarchy Applied".
     - If no, proceed.

  5. **Check for Self-Application or Meta-Rule Conflict**:
     - Question: Does the conflict involve a rule applying to itself (e.g., a rule about overriding rules) or a meta-rule (like the emergency override vs. governance rule)?
     - If yes, then this is a structural conflict that may require human judgment. Proceed to step 7 (human judgment) with a note that this is a meta-level conflict.

  6. **Check for Factual vs. Value Conflict**:
     - Question: Is the conflict due to a disagreement in factual beliefs (e.g., about evidence) or in values (e.g., autonomy vs. beneficence)?
     - If factual, and evidence is available, resolve by updating rules accordingly. If evidence is not available, tag as "Factual Dispute: Escalate to Clinical Lead" and set review date.
     - If value conflict, then proceed to step 7 (human judgment) with a note that this is a value conflict.

  7. **Human Judgment**:
     - The conflict is escalated to a designated authority (e.g., compliance officer, clinical lead, or committee) for a decision.
     - Possible outcomes from human judgment:
          a. Choose one rule and suspend the other.
          b. Modify one or both rules to resolve the conflict.
          c. Leave both in force with a note of the conflict and a review date (tag as "Conflict: Both in Force").
     - In the case of value conflicts or meta-rule conflicts, the outcome may be to leave both with a "Both in Force" tag.

  Containment Test (to prevent explosion to downstream rules):
  - We use a dependency graph. For a conflict between Rule A and Rule B, we mark the minimal set of rules that directly or indirectly depend on A or B and that would be affected by the contradiction (i.e., that use the output of A or B in a way that could lead to inconsistency). 
  - We then apply a relevance test: For each downstream rule, ask: "If we were to withdraw Rule A and Rule B (or mark them as conflicting), would the downstream rule still be valid (i.e., does it have an independent basis or is it unaffected)?" 
  - If the downstream rule would still be valid without the conflicting rules, then we leave it untouched. Otherwise, we mark the downstream rule as potentially affected and require a separate review (which might be done by the same process if an inconsistency is detected there).

  Status Tags and Expiry:
  - We have a tag "Both in Force" for conflicts that are left unresolved. The proposal is to set a 30-day expiry on such tags to force review. 
  - Argument: While some inconsistencies might be temporary (e.g., until new evidence arrives), others might be persistent (e.g., value conflicts). Forcing a review every 30 days might be too frequent and burdensome. Instead, we can set a review date (which might be longer than 30 days) but without an automatic expiry that deletes the conflict. The tag remains until a review is done. This avoids the assumption that all inconsistency is temporary, but ensures it doesn't accrete forever by mandating periodic reviews.

  Now, we design the triage procedure:

  **Triage Procedure for Inconsistency Between Two Rules (A and B):**

  1. **Check for Hidden Parameters/Contexts**:
     - Investigate: Are there unstated conditions (e.g., patient subgroup, timing, location) that make both rules applicable in different contexts?
       - If yes: Refine the rules to include these conditions. Resolution: Update rules and tag as "Resolved: Context Refined".
       - If no: Proceed to step 2.

  2. **Check for Representational Error**:
     - Investigate: Is there a mistake in the rule base (e.g., outdated rule, typo, unintended consequence of a change)?
       - If yes: Correct the error. Resolution: Tag as "Resolved: Error Corrected".
       - If no: Proceed to step 3.

  3. **Check for Authority Hierarchy**:
     - Investigate: Is there a predefined hierarchy (e.g., specialty society A > B, emergency rule > routine) that can break the tie?
       - If yes: Apply hierarchy (e.g., mark one rule as overridden in the relevant context). Resolution: Tag as "Resolved: Hierarchy Applied".
       - If no: Proceed to step 4.

  4. **Check for Self-Application or Meta-Rule Conflict**:
     - Investigate: Does the conflict involve a rule that applies to the rule system itself (e.g., override mechanism, governance rule)?
       - If yes: This is a structural conflict. Proceed to step 6 (Human Judgment) and note it as a meta-rule conflict.
       - If no: Proceed to step 5.

  5. **Check for Factual vs. Value Conflict**:
     - Investigate: Is the conflict due to:
          a. Disagreement on facts (e.g., evidence)?
          b. Disagreement on values (e.g., different priorities)?
       - If factual and evidence is available: Update rules based on evidence. Resolution: Tag as "Resolved: Evidence Based".
       - If factual but evidence is not available: This is an unresolved factual dispute. Tag as "Conflict: Factual Dispute", assign an owner, set a review date (e.g., 6 months), and escalate to clinical lead for monitoring new evidence.
       - If value conflict: Proceed to step 6 (Human Judgment) and note it as a value conflict.

  6. **Human Judgment**:
     - Escalate to the designated authority (compliance officer and clinical lead) with all context.
     - Possible decisions:
          a. Resolve by choosing one rule and suspending the other: Tag as "Resolved: Chosen by Authority".
          b. Modify one or both rules to remove conflict: Tag as "Resolved: Modified".
          c. Leave both in force with a conflict note: Tag as "Conflict: Both in Force", assign an owner, and set a review date (which may be more than 30 days, but not indefinite).
          d. If the conflict is due to a meta-rule or value clash that cannot be resolved, and the rules must both be active, then option (c) is chosen.

  Containment Test (applied whenever a conflict is tagged as "Both in Force" or similar):
  - Build a dependency graph for the rule base.
  - Identify rules that depend on the conflicting rules (A and B) either directly or indirectly.
  - For each such rule, perform a relevance test: 
     - Temporarily remove A and B (or mark them as conflicted) and check if the downstream rule still has a valid basis (e.g., from other rules or data).
     - If the downstream rule becomes underdetermined (gap) or overdetermined (glut) due to the conflict, then mark it as potentially affected and add it to the review list (but do not automatically invalidate it). The review may be done as part of the same ticket or a new one.

  Expiry of "Both in Force" Tags:
  - We require that every "Both in Force" tag must have a review date (not to exceed one year, but typically less). The 30-day expiry is too short and may not be necessary. Instead, set a review date based on the context (e.g., 90 days for a factual dispute where evidence is expected, or 1 year for a value conflict). The tag does not expire automatically, but the review date forces a re-evaluation.

  **Application to Live Cases:**

  Case 1: Two specialty societies with incompatible transfusion thresholds (7.5 vs 9.5 g/dL) for the same population; evidence does not settle it.

  - Step 1: No hidden parameters (same population).
  - Step 2: No representational error.
  - Step 3: No hierarchy between the societies.
  - Step 4: Not a meta-rule conflict.
  - Step 5: Factual conflict (because it's about the evidence for the threshold) but evidence not available. Outcome: Tag as "Conflict: Factual Dispute", assign owner, set review date (e.g., 6 months). 
  - The team's instinct to pick one and delete the other is not forbidden by the procedure, but it would require going to human judgment (step 6) and getting authority approval. However, without a hierarchy, arbitrarily picking one might be inappropriate. The procedure suggests that without resolution, we leave both and tag as a factual dispute. This is a point where the theory does real work: by avoiding explosion, we can keep both rules without inferring arbitrary consequences, and we can wait for evidence. The containment test ensures that downstream rules that depend on the threshold are marked for review if they are affected.

  Case 2: Emergency rule (incident commander overrides) vs. governance rule (no suspension without two-thirds vote).

  - Step 1: No hidden parameters.
  - Step 2: No error.
  - Step 3: No hierarchy defined between these two rules (they are both meta-rules).
  - Step 4: This is a meta-rule conflict (rules about rules). Proceed to step 6 (Human Judgment).
  - Human Judgment: The authority must decide how to resolve this. They might:
        a. Decide that the emergency rule is an exception to the governance rule (so in an emergency, the incident commander can override without a vote) and modify the governance rule to include this exception.
        b. Leave both in force and accept that in an emergency, the incident commander's order will be followed (so the governance rule is violated) but then require a vote after the fact? This is messy.
        c. Or, they might create a new rule that reconciles them (e.g., the incident commander can override during an emergency, but must get a ratification vote within 24 hours).
  - The procedure forces human judgment because this is a structural conflict. The theory does real work by recognizing that this is a meta-level conflict that cannot be resolved without changing the rule system.

  Case 3: Death by neurological criteria (stop support) vs. accommodation policy (continue ventilation for family who believes heart beat means life).

  - Step 1: Hidden parameter? Could we condition the death rule on the family not holding that belief? But that would be against the policy (accommodation must be offered regardless). So no.
  - Step 2: No error.
  - Step 3: No hierarchy between these policies (both are institutional policies).
  - Step 4: Not a meta-rule conflict.
  - Step 5: This is a value conflict (autonomy and accommodation vs. standard medical practice and resource use). Proceed to step 6 (Human Judgment).
  - Human Judgment: The institution must decide which value takes precedence. They might:
        a. Choose one (e.g., neurological criteria) and suspend the accommodation in this context? But that might violate the accommodation policy.
        b. Modify the death rule to allow for accommodation in certain cases (e.g., for a limited time) but then the family might want it indefinitely.
        c. Leave both in force and accept that in practice, the staff will have to negotiate case by case? Then tag as "Conflict: Both in Force" with a note that it requires case-by-case resolution. This might be the outcome, and it is a value conflict that cannot be resolved by the rule base alone.

  This outcome (case-by-case) might be one the team does not want because it doesn't provide clear guidance, but it reflects the real-world conflict.

  **Glossary of Status Tags for New Hires:**

  1. **Resolved: Context Refined** - The rules were updated to include additional context (e.g., patient group, timing). *Do not* leave the old version active.
  2. **Resolved: Error Corrected** - A mistake (typo, stale copy) was fixed. *Do not* reintroduce the error.
  3. **Resolved: Hierarchy Applied** - One rule overrode another based on predefined authority. *Do not* change without re-evaluating the hierarchy.
  4. **Resolved: Evidence Based** - Rules updated based on new evidence. *Do not* ignore the evidence.
  5. **Conflict: Factual Dispute** - Rules conflict due to unresolved factual disagreement; both active until review. *Do not* delete one arbitrarily; monitor for new evidence.
  6. **Conflict: Both in Force** - Rules conflict due to structural, value, or meta-issue; both active and require case-by-case handling. *Do not* ignore the conflict; escalate when encountered in practice.
  7. **Resolved: Chosen by Authority** - An authority chose one rule over the other. *Do not* reactivate the overridden rule without authority approval.
  8. **Resolved: Modified** - One or both rules were changed to remove the conflict. *Do not* revert without review.

  **What the Procedure Cannot Do:**

  - It cannot automatically resolve conflicts that require human judgment (e.g., value conflicts, meta-rule conflicts).
  - It cannot detect conflicts that are not reported (so we rely on users and automated checks).
  - It cannot provide a global consistency check for the entire rule base (only pairwise and with containment to limit spread).
  - It cannot tell us which authority to trust when there is a conflict between equals.
  - It cannot settle value disagreements; it only provides a way to manage them.
  - The procedure's willingness to hold both rules (tag as "Both in Force") is a claim about the rule base (that we have a conflict we cannot resolve now) and not necessarily a claim about the world (that the world is contradictory). However, in some cases (like the value conflict in Case 3), it may reflect that the institution has contradictory commitments. The procedure stops at the rule base and does not assert that the contradiction is in the world.

  **Closing Note:**

  The procedure uses paraconsistent logic to avoid explosion, which allows us to keep the rule base running even with some contradictions, by containing them. The real work is in the containment test and the structured triage. For most cases, it is a formalization of engineering caution. But in cases of genuine factual disputes without evidence or value conflicts, it does real work by preventing arbitrary removal of rules and allowing time for resolution. The 30-day expiry is replaced by a mandatory review date set by the authority, avoiding the assumption that inconsistency is always temporary.
answer: |-
  Below is a triage procedure for resolving inconsistencies in your clinical rule base, grounded in paraconsistent logic concepts. It addresses your requirements: containment of explosion, distinction between gluts (overdetermined truth) and gaps (underdetermined truth), separation of representational vs. real contradictions, and explicit acknowledgment of judgment points. The procedure repairs your dependency-set containment test and incorporates your "both in force" tag with a modified expiry policy.  

  ### **Triage Procedure Flowchart (for a single inconsistency between Rule A and Rule B)**  
  1. **Start**: A contradiction is reported (e.g., Rule A implies action X, Rule B implies action ¬X).  
  2. **Question 1: Is the contradiction resolvable by adding hidden parameters, time indices, or disambiguating predicates?**  
     - *Sufficient answer*: Explicitly identify missing context (e.g., "Rule A applies to ICU, Rule B to step-down units" or "predicate 'high-risk' differs between rules").  
     - *Resolution*: Refine rules to include parameters. Tag as **Resolved: Context Refined**.  
     - *If unresolved*: Proceed to Question 2.  
     - *Theory ground*: Represents a *gap* (under-specification), not a true glut. Paraconsistency avoids explosion by not assuming all gaps are errors.  

  3. **Question 2: Is the contradiction due to a representation flaw (stale copy, typo, or unintended consequence)?**  
     - *Sufficient answer*: Evidence of error (e.g., Rule B was superseded by a guideline update).  
     - *Resolution*: Correct the flaw. Tag as **Resolved: Artifact Fixed**.  
     - *If unresolved*: Proceed to Question 3.  
     - *Theory ground*: Distinguishes *representational inconsistency* (fixable) from *real inconsistency* (structural).  

  4. **Question 3: Is there an authority hierarchy or tie-breaker?**  
     - *Sufficient answer*: Documented hierarchy exists (e.g., "Cardiology Society overrules Nursing Policy").  
     - *Resolution*: Apply hierarchy. Tag as **Resolved: Authority Applied**.  
     - *If unresolved*: Proceed to Question 4.  
     - *Theory ground*: Avoids explosion by not forcing arbitrary resolution; rationality requires acknowledging equal authorities.  

  5. **Question 4: Does the conflict involve self-application or meta-rules (e.g., rules about override mechanisms)?**  
     - *Sufficient answer*: Rule A or B references the rule system itself (e.g., "emergency override" vs. "suspension requires committee vote").  
     - *Resolution*: Escalate immediately to human judgment (Step 6).  
     - *Theory ground*: Self-reference creates "glut" risks (overdetermination); paraconsistency isolates explosion but cannot resolve inherently circular conflicts.  

  6. **Question 5: Is the conflict factual (evidence-based) or value-based (competing priorities)?**  
     - *Sufficient answer*:  
       - *Factual*: Disagreement on evidence (e.g., "7.5 g/dL vs. 9.5 g/dL thresholds").  
       - *Value-based*: Clash of principles (e.g., "autonomy vs. resource efficiency").  
     - *Resolution*:  
       - If *factual* with clear evidence: Resolve per evidence. Tag as **Resolved: Evidence Applied**.  
       - If *factual without evidence* or *value-based*: Proceed to Step 6.  
     - *Theory ground*: Value conflicts are "real gluts" (true rational disagreement); paraconsistency buys tolerance here by rejecting that "A ∧ ¬A" implies chaos.  

  7. **Step 6: Human Judgment Escalation**  
     - *Input*: All outputs from Questions 1–5.  
     - *Outputs*:  
       - **Resolved** via authority decision (e.g., suspend one rule). Tag as **Resolved: Authority Decision**.  
       - **Unresolved**: Tag as **Both in Force** with:  
         - Named owner (e.g., "Chief of Cardiology"),  
         - Review date (default 90 days; see expiry policy below),  
         - Action: "Flag in EHR; escalate to owner if triggered."  
     - *Judgment points*: Cannot eliminate judgment in principle at:  
       - Authority tie-breakers (Question 3),  
       - Meta-rule conflicts (Question 4),  
       - Value conflicts (Question 5).  

  ### **Containment Test (Repaired Dependency-Set Approach)**  
  - **Step**: After any **Both in Force** tag, apply:  
    1. Identify all rules downstream of A and B via dependency graph (child rules inheriting from A/B).  
    2. For each downstream rule, run:  
       - **Relevance Test**: "If A and B were removed, would this rule still fire correctly?"  
       - If *yes* (e.g., rule relies on independent data), leave untouched.  
       - If *no* (e.g., rule uses output of A/B), add **Requires Manual Review** tag and alert owner.  
  - **Why better?** Your "informal dependency-set" is sound; this formalizes it. Prevents silent invalidation by isolating gluts without assuming consistency.  

  ### **Expiry Policy for "Both in Force" Tags**  
  - **Proposal**: 30-day expiry is rejected.  
  - **Revised Policy**: Default 90-day review, extendable by owner.  
  - **Argument**:  
    - 30 days assumes all inconsistency is temporary, but structural/value conflicts may persist (e.g., "accommodation vs. death criteria"). Forcing arbitrary resolution risks misrepresentation.  
    - Paraconsistency supports this: Rationality permits holding contradictions *while seeking resolution*, but does not require eternal tolerance. 90 days balances caution with accountability.  

  ---  
  ### **Application to Live Cases**  
  **Case 1: Conflicting Transfusion Thresholds (7.5 vs. 9.5 g/dL)**  
  - Q1: No hidden parameters (same population).  
  - Q2: No artifact (both rules current).  
  - Q3: No hierarchy (equal authorities).  
  - Q4: Not meta-rules.  
  - Q5: *Factual conflict without evidence*.  
  - **Verdict**: Escalate to human judgment. **Procedure forbids deleting one rule arbitrarily**—authorities are equal, and evidence gap means resolution requires committee decision. Tag as **Both in Force** with 90-day review.  
  - *Theory work*: Paraconsistency actively prevents "sloppy cleanup" here; tolerating glut is rational.  

  **Case 2: Emergency Override vs. Governance Rule**  
  - Q1: No hidden context.  
  - Q2: No artifact.  
  - Q3: No hierarchy (meta-rules are peers).  
  - Q4: **Meta-rule conflict** (self-application).  
  - **Verdict**: Immediate human escalation. **Outcome your team won’t like**: Likely **Both in Force** with action: "During emergencies, incident commander’s order takes precedence; post-event, committee reviews for ratification." Forces awkward, but necessary, real-world compromise.  
  - *Theory work*: Contains explosion (governance isn’t invalidated) but cannot resolve circularity.  

  **Case 3: Death Criteria vs. Accommodation Policy**  
  - Q1: No parameters resolve conflict (e.g., timing won’t fix value clash).  
  - Q2: No artifact.  
  - Q3: No hierarchy.  
  - Q4: Not meta-rules.  
  - Q5: **Value conflict** (institutional priorities).  
  - **Verdict**: Human judgment → **Both in Force** with action: "Case-by-case ethics consultation." No procedural resolution possible.  
  - *Theory work*: Distinguishes factual vs. value glut; tolerance here is engineering caution, not "true contradiction."  

  ---  
  ### **Glossary of Status Tags (for New Hires)**  
  1. **Resolved: Context Refined** - Added parameters fixed conflict. *Don’t* reuse old rules.  
  2. **Resolved: Artifact Fixed** - Corrected error (e.g., typo). *Don’t* edit without review.  
  3. **Resolved: Authority Applied** - Hierarchy resolved conflict. *Don’t* override without escalation.  
  4. **Both in Force** - Conflict active; escalate when triggered. *Don’t* ignore or delete—owner must review.  
  5. **Requires Manual Review** - Downstream rule at risk. *Don’t* assume auto-resolution.  

  ---  
  ### **What the Procedure Cannot Do**  
  1. **Cannot assign trust to authorities** (e.g., "which specialty society is right?").  
  2. **Cannot detect unreported conflicts** (relies on existing checks/reports).  
  3. **Cannot aggregate pairwise decisions** into global consistency (e.g., "are all 4,000 rules jointly satisfiable?").  
  4. **Cannot resolve value conflicts**—only flags them for human deliberation.  
  5. **Cannot justify "true contradictions" in reality**: Tolerance stops at the rule base. When tagged **Both in Force**, it claims *our representation* has a glut (due to structural/value gaps), not that reality is contradictory. The moment we assert a conflict is "true in the world" (e.g., "both transfusion thresholds are correct"), we exit engineering and enter metaphysics—which this procedure avoids.  

  ---  
  ### **Closing Note**  
  This procedure uses paraconsistency to **block explosion** (catastrophic inference from contradictions) and **manage gluts** (isolating conflicts without assuming they must be "cleaned up"). It does real work in **structural/value conflicts** (Cases 1–3) by forcing disciplined tolerance, while in **gaps/hidden parameters** it merely formalizes good practice. By rejecting "delete and move on" in Case 1 and admitting irresolvable tension in Case 3, it may challenge your team’s instincts—but it ensures your rule base reflects real-world complexities without false consistency.
