  **Adversarial Collaboration: The Kavango Root-Voles Case**

  **Introduction**

  This document outlines an adversarial collaboration between two researchers: an adaptationist (who emphasizes optimality modeling and reverse-engineering) and a structuralist critic (who emphasizes developmental constraints, integration, and by-products). We use the imaginary clade of Kavango root-voles (*Kavangomys spp.*) as a test case. The trait in question is a dorsally projecting bony flange on the atlas vertebra, which is present in all 14 species but absent in outgroups. The flange's surface area correlates with the temporalis muscle attachment area, and its development is coupled to the expansion of that attachment surface. The species vary in digging behavior: some use head-lift digging in hard soils, others in soft sands do not. The adaptationist sees the flange as an adaptation for head-lift digging, later retained in non-diggers; the critic sees it as a by-product of skull widening, co-opted in diggers.

  ---

  **1. Agreed Claims**

  Both parties agree on the following operational claims:

  1. **Trait Explanation Requirement**: A complete explanation of a trait must account for its origin, maintenance, and variation across a clade, integrating phylogenetic, developmental, functional, and selective factors.

  2. **Historical vs Current Utility**: The current utility of a trait does not necessarily indicate its historical origin. A trait may be currently useful (exaptation) without having originated for that function.

  3. **Developmental Constraints Definition**: Developmental constraints are biases or limitations on phenotypic variation caused by the structure of the developmental system, resulting in non-adaptive or suboptimal phenotypes.

  4. **By-Product Definition**: A by-product is a trait that arises as a consequence of developmental or selective processes acting on another trait, without direct selection for the by-product itself.

  5. **Adaptation Definition**: An adaptation is a trait that has been shaped by natural selection for a specific function. This requires evidence of historical selection.

  6. **Null Model Necessity**: Both adaptationist and constraint hypotheses require explicit null models. For adaptation, the null is the absence of selection for the trait; for constraint, the null is the absence of bias in variation.

  7. **Operationalizing Selection**: A claim of selection must specify the expected pattern of variation, heritability, and fitness correlation in a natural population or the expected phylogenetic signal of correlated trait-function change.

  8. **Operationalizing Constraint**: A claim of developmental constraint must specify measurable limits on phenotypic variability (e.g., via G-matrix or allometric deviations) and demonstrate that optimal phenotypes are outside the reachable set.

  9. **Reachable Set Concept**: The lineage's developmental system defines a "reachable set" of phenotypes. The engineering optimum is an idealized functional target. If the optimum is outside the reachable set, the trait should be found at the boundary of the set; if inside, deviation from optimum requires explanation (e.g., drift, trade-offs).

  10. **Multiple Causation**: Most traits result from a combination of selective, developmental, and historical factors. Disentangling these requires multiple lines of evidence.

  11. **Prediction Commitment**: Both parties must specify, in advance, measurable predictions for the root-vole case. Results contradicting a party's core prediction count as evidence against their position.

  12. **Irrelevance of Presence in Non-Functional Contexts**: The mere presence of a trait in a non-functional context (e.g., the flange in soft-soil species) does not by itself refute an adaptation hypothesis (due to retention) or a by-product hypothesis (due to developmental coupling).

  13. **Phylogenetic Independence**: Tests must account for phylogenetic non-independence (e.g., using independent contrasts or model-based approaches).

  14. **Ontogenetic Priority**: The ontogenetic sequence of trait development can inform whether a trait is developmentally coupled to another (e.g., if the flange develops after temporalis attachment expansion, it cannot be a cause).

  15. **Fossil/Ancestral State Inference**: Fossil or ancestral state reconstruction must use explicit, model-based methods, and uncertainty must be reported.

  ---

  **2. Disagreements Table**

  The table below outlines key disagreements, with each party's position and pre-registered predictions for the root-vole case. Predictions must be specified in measurable terms.

  | Crux | Adaptationist Position | Critic Position | Measurement/Comparison | Adaptationist Prediction | Critic Prediction |
  |------|------------------------|-----------------|-------------------------|--------------------------|------------------|
  | **Origin of the flange** | The flange originated as an adaptation for head-lift digging in hard-soil ancestors. | The flange originated as a by-product of skull widening (for other functions) and was later co-opted for digging. | Phylogenetic ordering: Did head-lift digging evolve before, after, or with the flange? | Head-lift digging precedes the origin of the flange in the clade. | Flange precedes head-lift digging; present in non-digging ancestors. |
  | **Current utility in diggers** | The flange in hard-soil diggers is optimized for force transmission during head-lift. | The flange in diggers is a co-opted by-product; its shape is within the expected range of variation from developmental coupling. | Lever model fit: Residuals from the lever-optimum model vs. developmental allometry in hard-soil species. | Residuals are small (high fit) for hard-soil diggers, indicating optimization. | Residuals are no smaller than expected from the allometric slope of flange size on temporalis area (i.e., within the 95% prediction band of the allometry). |
  | **Retention in non-diggers** | The flange is retained in soft-soil species due to lack of negative selection (neutral or nearly neutral). | The flange is retained due to developmental constraint; it cannot be reduced without costly changes to skull development. | Allometry: Slope of flange area on temporalis area in soft-soil species vs. hard-soil species. | Slope in soft-soil species is shallower (indicating incipient reduction) or matches the hard-soil slope (neutral retention). | Slope is parallel and not reduced in soft-soil species, indicating strong developmental integration. |
  | **Developmental reachable set vs. optimum** | The optimum for head-lift digging lies within the reachable set of phenotypes; deviation in soft-soil species is due to relaxed selection. | The optimum lies at the boundary of the reachable set; even diggers are suboptimal due to constraints. | Multivariate selection: In hard-soil species, fitness (e.g., digging efficiency) vs. flange shape relative to the lever optimum. | Flange shape is under positive selection in diggers; population mean is near the optimum. | Flange shape is under directional selection but the response is limited; the mean is not at the optimum and G-matrix eigenanalysis shows alignment with high-variance directions. |
  | **Ontogenetic coupling** | Flange growth is developmentally linked to temporalis attachment but can be decoupled under selection. | Flange growth is tightly coupled to temporalis attachment; decoupling is costly. | Experimental ablation: Reduce temporalis area in embryos and measure effect on flange size. | Flange size is reduced but not eliminated; compensatory growth possible. | Flange size is reduced proportionally to temporalis reduction, with no compensation. |

  ---

  **3. Closing Section: Verbal vs Substantive Disagreements**

  Some disagreements are verbal, hinging on definitions:

  - **Verbal**: The term "adaptation" is sometimes used for current utility (exaptation) vs. historical selection. We agree to use "adaptation" only for traits shaped by selection for their current function and "exaptation" for co-opted traits.

  - **Verbal**: "Constraint" can imply absolute impossibility vs. bias. We agree it refers to biases making some phenotypes more likely than others.

  - **Verbal**: The "adaptationist programme" is not monolithic. The critic rejects the optimality-default thesis (that traits are optimal unless proven otherwise) and the trait-atomism thesis (that traits can be decomposed modularly without considering integration). The adaptationist needs only the claim that selection is the primary driver of adaptive complexity, not that it explains all variation.

  **Substantive disagreements that survive disambiguation**:

  1. **Optimality-default**: The adaptationist holds that, absent evidence against, traits should be presumed optimal; the critic rejects this, requiring evidence for.

  2. **Developmental primacy**: The critic argues that developmental processes impose biases that channel evolution, making by-products common; the adaptationist sees development as malleable to selection.

  3. **Reachable set vs. optimum**: Whether the flange in diggers is at an optimum (inside the set) or at a constraint boundary (outside) is a testable, substantive issue.

  The root-vole case tests these: if the flange originated before digging, the critic gains; if it is optimized beyond allometric expectations, the adaptationist gains.

  ---

  **4. Appendix: Pre-registered Audit Protocol for Root-Vole Case**

  **Order of Measurements and Commitments**

  1. **Phylogenetic Analysis**:
     - Generate a time-calibrated phylogeny for all 14 species + outgroups using molecular data.
     - Reconstruct ancestral states for: (a) head-lift digging (discrete: present/absent), (b) flange presence (discrete), and (c) flange size (continuous).
     - Both parties pre-commit: Adaptationist expects digging to precede flange origin; critic expects flange to precede digging.

  2. **Allometric Analysis**:
     - Measure flange area and temporalis attachment area in adults of all species.
     - Fit a phylogenetic generalized least squares (PGLS) model: flange area ~ temporalis area * soil-type (hard/soft).
     - Test for slope differences between soil types.
     - Adaptationist predicts shallower slope in soft-soil species; critic predicts no slope difference.

  3. **Lever Model Fit**:
     - In hard-soil species, measure residuals from the lever-optimum model (based on biomechanics) for flange shape.
     - Compare residuals to the 95% prediction band from the allometric regression of flange shape on temporalis area.
     - Adaptationist predicts residuals smaller than allometric band; critic predicts residuals within band.

  4. **Ontogenetic Sequence**:
     - In one hard-soil and one soft-soil species, track flange and temporalis development in embryos/juveniles. Determine which trait develops first.
     - Adaptationist: Order irrelevant (selection can decouple); critic: Temporalis expands before flange.

  5. **Experimental Ablation**:
     - In lab-bred hard-soil root-voles, ablate temporalis precursor cells in embryos (using CRISPR or surgical) and measure flange size in adults.
     - Adaptationist: Flange size reduced but >0 (partial independence); critic: Flange size reduced proportionally.

  6. **Field Selection Study**:
     - In a wild hard-soil population, measure:
       - Fitness proxies (e.g., digging efficiency, survival).
       - Flange shape (deviation from lever optimum).
       - Genetic variation (G-matrix) for flange and related traits.
     - Adaptationist: Strong directional selection on flange shape; critic: Selection but suboptimal response (G-matrix shows genetic correlations limiting change).

  **Stopping Rule**: The collaboration ends when all measurements are completed. If results are ambiguous, parties may propose one additional test (mutually agreed).

  ---

  This document is signed by:

  [Adaptationist Name]
  [Critic Name]
  [Date]
answer: |-
  ### Adversarial Collaboration Framework: Kavango Root-Voles Case  
  **Prepared for Joint Reading Group: Philosophy of Biology & Vertebrate Functional Morphology**  

  ---

  #### **1. Agreed Claims**  
  Both parties accept these operational principles:  

  1. **Trait Explanation Scope**: A complete explanation must account for the trait’s origin, maintenance, and variation across taxa and environments.  
  2. **Developmental Coupling**: If trait *A* (flange) consistently co-varies with trait *B* (temporalis attachment) in ontogeny across the clade, this correlation must be explicitly modeled.  
  3. **Current Utility ≠ Historical Origin**: A trait’s present function (e.g., lever mechanics in diggers) does not prove historical adaptation *for* that function.  
  4. **By-Product Definition**: A by-product is a trait that (i) arises without direct selection for itself, (ii) is developmentally linked to a selected trait, and (iii) exhibits no fitness advantage in its initial state.  
  5. **Adaptation Definition**: An adaptation requires evidence of historical selection for a specific function, indicated by (i) trait-function fit, (ii) phylogenetic correlation with selective pressure, and (iii) fitness advantage in relevant contexts.  
  6. **Null Model Necessity**: Both hypotheses require explicit nulls:  
     - *Adaptationist null*: Trait variation is random relative to function.  
     - *Critic’s null*: Trait variation is predictable from developmental correlations alone.  
  7. **Reachable Set Principle**: The "reachable set" of phenotypes is defined by standing developmental/genetic variances (e.g., G-matrix structure). The engineering optimum is the phenotype maximizing fitness.  
  8. **Optimality Test**: If the optimum lies *inside* the reachable set, deviation from it implies non-adaptive forces (e.g., drift). If *outside*, proximity to the set’s boundary suggests constraint.  
  9. **Phylogenetic Independence**: All comparative tests must correct for shared ancestry (e.g., independent contrasts).  
  10. **Falsifiability**: A hypothesis is violated if:  
      - *Adaptationist*: Trait loss in soft-soil species reduces fitness *or* trait origin postdates head-lift digging.  
      - *Critic*: Flange shape in diggers exceeds predictions from allometry *and* shows no developmental correlation.  
  11. **Atomism Rejection**: Neither party assumes traits are modular; integration is a testable hypothesis.  
  12. **Selection Fraction Dispute**: Both agree selection explains *some* variation; the dispute centers on its relative contribution versus constraints/drift in this case.  
  13. **Operationalizing "Exaptation"**: A trait is exapted if (i) it originated without selection for current use, and (ii) its current utility arises from novel selective pressures.  

  ---

  #### **2. Disagreements Table**  
  | Crux | Adaptationist Position | Critic Position | Testable Measurement | Adaptationist Prediction | Critic Prediction |  
  |------|------------------------|-----------------|----------------------|--------------------------|-------------------|  
  | **Trait Origin** | Flange evolved *for* head-lift digging via selection. | Flange originated as a by-product of skull widening; head-lift co-opted it later. | Phylogenetic ordering: Flange origin relative to head-lift digging. | Flange origin coincides with/subsequent to head-lift digging. | Flange origin precedes head-lift digging. |  
  | **Developmental Independence** | Flange-Temporalis coupling is modifiable; selection can decouple them. | Coupling is obligatory; flange cannot vary independently. | Ontogenetic sequence: Does flange development initiate *after* temporalis expansion? | Flange development initiates independently or after temporalis. | Flange development initiates synchronously with temporalis. |  
  | **Function in Diggers** | Flange shape in hard-soil diggers is optimized for force transmission. | Shape is a passive consequence of temporalis allometry; "fit" is coincidental. | Lever-model residuals in diggers vs. allometric predictions. | Residuals ≤ 5% deviation from lever optimum. | Residuals match allometric predictions (±10%). |  
  | **Retention in Non-Diggers** | Retention due to weak/no negative selection (neutral). | Retention due to developmental constraint; reduction is impossible. | Allometric slope (flange vs. temporalis) in soft-soil species. | Slope < hard-soil species (indicating incipient decay). | Slope = hard-soil species (no divergence). |  
  | **Reachable Set vs. Optimum** | Optimum is inside reachable set; soft-soil species deviate neutrally. | Optimum is outside reachable set; diggers are at the boundary. | G-matrix eigenanalysis: Orientation of flange shape variance relative to lever optimum. | Variance aligns with optimum direction. | Variance orthogonal to optimum; diggers at set boundary. |  
  | **Selection Signature** | Flange shows historical/current selection *only* in diggers. | No historical selection for flange; covariance with temporalis suffices. | Multivariate selection gradients (β) in wild digger populations. | β > 0.3 for flange-digspeed correlation. | |β| < 0.1; fitness effects explained by temporalis. |  

  ---

  #### **3. Closing: Verbal vs. Substantive Disagreements**  
  **Verbal Ambiguities Resolved**:  
  - "Adaptation" is defined by *historical selection for a function*; "current utility" alone is exaptation.  
  - "Constraint" means *bias in variation* (not absence of selection).  
  - Both reject "trait atomism" (claiming traits are modular by default).  

  **Substantive Disagreements Surviving Disambiguation**:  
  - **Optimality Default**: Adaptationist asserts optimality as the null absent contrary evidence; critic rejects this, requiring proof of selection.  
  - **Developmental Primacy**: Critic argues flange variation is chiefly governed by constraints; adaptationist sees selection as primary driver.  
  - **Reachable Set vs. Optimum**: Their predictions diverge on whether diggers are optimized or constrained (testable via G-matrix).  

  **Core Dispute**: The fraction of *fixed* differences attributable to selection (adaptationist: high; critic: low, favoring constraints).  

  ---

  #### **4. Appendix: Pre-registered Root-Vole Protocol**  
  **Order of Analysis & Commitments**:  
  1. **Phylogenetic Reconstruction**:  
     - *Data*: Molecular clock of 14 species + outgroups.  
     - *Commit*: Both pre-specify ancestral state models (MK1 for discrete traits; BM for continuous).  
     - *Output*: Order of flange origin vs. head-lift digging.  

  2. **Ontogenetic Series**:  
     - *Data*: Embryonic/juvenile staging (n=30/species) for flange/temporalis development.  
     - *Commit*: Critic expects synchronous initiation; adaptationist expects asynchrony.  
     - *Test*: Timing of trait ossification (histology).  

  3. **Allometry & Lever Modeling**:  
     - *Data*: CT scans of adults (5 traits: flange SA, temporalis SA, skull width, etc.).  
     - *Steps*:  
       a. PGLS regression: flange SA ~ temporalis SA * soil type.  
       b. Fit lever model to hard-soil diggers; calculate residuals.  
     - *Commit*: Adaptationist: residuals near 0; critic: residuals align with allometry.  

  4. **Experimental Knockdown**:  
     - *Method*: CRISPR targeting temporalis growth pathway in embryos.  
     - *Prediction*:  
       - Adaptationist: Flange size reduces but remains functional.  
       - Critic: Flange reduction proportionally matches temporalis.  

  5. **Field Selection Metrics**:  
     - *Data*: Mark-recapture in hard-/soft-soil habitats (fitness: digspeed, survival).  
     - *Analysis*: Selection gradients (β) for flange shape.  
     - *Commit*: Adaptationist: β > 0.3; critic: |β| < 0.1.  

  **Stopping Rule**: Analysis halts after Step 5. If ≥3 predictions per side are falsified, the framework is re-evaluated.  

  ---  
