  ### Game Design: "The Blurry Evidence Challenge"

  #### **Concept & Learning Goals**
  This game simulates real-world scenarios where evidence is ambiguous (e.g., a flickering alert, a dashboard glimpsed while multitasking). Players update their belief in a hypothesis (e.g., "system is broken") after blurry observations that shift confidence in *what was seen* (e.g., "I'm 80% sure the alert fired") without certainty. The game forces players to:
  1. **Experience the gap**: See a 10+ percentage point difference between the naive update ("pretend I saw the most likely thing") and the correct weighted-average update.
  2. **Construct the rule**: Derive the weighted average naturally through gameplay.
  3. **Break the assumption**: Discover that the update fails when conditional probabilities change (e.g., the *reason* for blurriness is itself informative).

  #### **Materials & Setup (5 mins)**
  - **Decks of cards** (printable on one page):
    - **Hypothesis deck (H)**: 10 cards per round. 
      - *First scenario (Rounds 1-3)*: 4 red cards ("System broken"), 6 black cards ("System fine"). 
      - *Second scenario (Round 4)*: 3 red cards ("Fire"), 7 black cards ("No fire").
    - **Observation deck (O)**: 10 cards per draw. 
      - *If H=red*: 9 green cards ("Alert fired"), 1 yellow card ("No alert"). 
      - *If H=black*: 2 green cards ("Alert fired"), 8 yellow cards ("No alert").
  - **Sticky notes & pens**: For groups to write probability estimates (0-100%).
  - **Scoreboard**: Whiteboard to track Brier scores (explained below).
  - **Incentive**: $10 coffee gift card for the winning group (lowest cumulative Brier score).
  - **Grouping**: 12 players → 3 groups of 4. Each group gets a card deck set.

  **Why Brier scoring?**  
  Brier score = `(outcome - estimate)^2` (e.g., if H is true and you estimated 60%, score = `(1 - 0.6)^2 = 0.16`). It penalizes inaccuracy and rewards calibration, making a 12-point difference matter (e.g., 60% vs 72% leads to a score gap of ~0.014 per round, which compounds). It’s strictly proper, so players can’t game it by over/under-confidence.

  ---

  ### **Game Rounds (45 mins total)**
  **Rules for all rounds:**  
  - Draw H card first (secretly, don’t reveal until scoring).  
  - For clear observations: Draw O card and report what was "seen."  
  - For blurry observations: **Don’t draw O card**—just state the confidence shift (e.g., "80% sure alert fired").  
  - Groups have **60 seconds** to deliberate and write their estimate of P(H) on a sticky note.  
  - After estimates are locked in, reveal H and calculate Brier scores.  
  - **Key constraint:** No jargon ("Bayes," "update," "probability") allowed. Use plain language: "confidence," "what you think now."

  #### **Round 1: Clear Observation (5 mins)**  
  - **Goal:** Warm-up. Reintroduce standard updating.  
  - **Scenario:** "System may be broken. Prior: 40% confidence. You **clearly see** the alert fired."  
  - **Draw:**  
    - H card (red or black).  
    - O card: Report "alert fired" (green) or "no alert" (yellow) based on draw.  
  - **Correct update:** If alert fired, P(H) = 75% (calculation: `(0.9 * 0.4) / (0.9*0.4 + 0.2*0.6) = 36/48 = 75%`).  
  - **Scoring:** Reveal H. Groups score Brier.  
  - **Facilitator notes:**  
    - Write "Prior: 40%" and "Alert fired → 75%" on the board.  
    - Emphasize: "This is baseline for clear evidence."

  #### **Round 2: Blurry Observation (Time Pressure, 10 mins)**  
  - **Goal:** Force intuitive update. Expose gap.  
  - **Scenario:** Same as Round 1. "You **blurrily see** the alert—now 80% sure it fired, 20% sure it didn’t."  
  - **Draw:** H card only. **No O card drawn** (blurriness is abstract).  
  - **Time pressure:** Only **60 seconds** to submit estimate.  
  - **Common mistakes:**  
    - Naive update: "Most likely I saw alert → 75%."  
    - Correct update (Jeffrey): Weighted average of clear-update outcomes:  
      `P(H) = [P(H|alert) * 0.8] + [P(H|no alert) * 0.2] = (75% * 0.8) + (7.69% * 0.2) ≈ 60% + 1.54% = 61.54%`  
      (Note: Gap = 75% - 61.54% = **13.46 percentage points**).  
  - **Scoring:** Reveal H and score.  
  - **Facilitator notes:**  
    - After scoring, ask: "What did your group do? Why?"  
    - **Do not confirm/deny answers yet**—this primes Round 3.

  #### **Round 3: Blurry Observation (Calculated, 15 mins)**  
  - **Goal:** Derive the weighted average.  
  - **Scenario:** Same as Round 2 (blurry, 80% alert fired).  
  - **Draw:** H card only. No time pressure—**3 mins** for calculation.  
  - **Correct path (emergent):**  
    - Groups use clear-update results from Rounds 1-2:  
      - If alert fired: P(H) = 75%.  
      - If no alert: P(H) = 7.69%.  
    - Weight by new confidence: `(75% * 0.8) + (7.69% * 0.2) = 61.54%`.  
  - **Facilitator notes:**  
    - If groups miss this, nudge: "You know what you’d think if you saw each piece of evidence clearly. How does your blurry confidence mix them?"  
    - After estimates, reveal H and score. Write estimates on the board:  
      - Naive (75%) vs. Weighted average (61.54%).  
    - Highlight: "13-point difference! Why does the naive approach overshoot?"

  #### **Round 4: Blurry with Changing Conditionals (15 mins)**  
  - **Goal:** Break the assumption. Show why conditionals must stay fixed.  
  - **Scenario:** "Now the room is **smoky**! Smoke means fire (H). Prior: 30% fire. If fire, 90% chance of smoke; if no fire, 10%. You’re squinting due to smoke, so you see the alert blurrily—80% sure it fired."  
  - **Draw:** H card only (fire or no fire).  
  - **Common mistakes:**  
    - Apply Round 3’s weighted average directly (using old 75% and 7.69%):  
      `P(H) ≈ (75% * 0.8) + (7.69% * 0.2) = 61.54%` (wrong).  
    - **Correct update:**  
      - First, update for smoke: Smoke is certain (since squinting), so:  
        `P(H|smoke) = (0.9 * 0.3) / (0.9*0.3 + 0.1*0.7) = 27/34 ≈ 79.41%`.  
      - Recompute conditionals *given smoke*:  
        - If alert fired: `P(H|alert, smoke) ≈ 94.55%`.  
        - If no alert: `P(H|no alert, smoke) ≈ 32.53%`.  
      - Weight by blurry confidence:  
        `P(H) = (94.55% * 0.8) + (32.53% * 0.2) ≈ 75.64% + 6.51% = 82.15%`.  
  - **Why it breaks:** The naive/weighted average uses outdated conditionals. Smoke changes what the alert means (e.g., fire causes smoke, which affects alert reliability).  
  - **Scoring:** Reveal H and score.  
  - **Facilitator notes:**  
    - Ask: "Why did Round 3’s method give a different number here? What changed?"  
    - Key insight: **"The reason for blurriness (smoke) was itself evidence."**

  ---

  ### **Debrief (10 mins)**
  - **Map gameplay to concepts:**  
    - **Weighted average (Rounds 2-3):** "You spread your update over what you might have seen, weighted by your new confidence. This is the rule you built."  
    - **Breaking assumption (Round 4):** "The rule breaks when the conditionals change—like when smoke explains both the blur and the hypothesis."  
  - **Reveal jargon (last 5 mins):**  
    - "What you discovered is **Jeffrey conditionalization** (weighted average). It works when the *relationship* between evidence and hypothesis stays fixed. When it doesn’t, you need a different approach."  
  - **What went right/wrong:**  
    - **Right:** Groups derive the rule naturally. Gap (13.46 points) is visceral. Round 4 forces reflection.  
    - **Wrong (and fixes):**  
      - *Strong player spoils rule early*: Mitigated by time pressure (Round 2) and withholding validation until debrief. If someone says "just weight the conditionals," respond: "Try that and see if it works for all rounds."  
      - *Groups conflate blur with noise*: Use Round 4 to show blurriness isn’t always "just noise."  
      - *Math anxiety*: Keep calculations simple (stick to percentages). Groups self-balance skill gaps.  

  #### **What the Game Can’t Teach (Say This Aloud)**  
  - **Why conditionals stay fixed in well-behaved cases:** "In simple cases, the *cause* of blurriness (e.g., bad lighting) doesn’t affect the hypothesis. The rule works because the evidence only updates what you saw, not what it means."  
  - **Evidence as belief shifts (not propositions):** "Sometimes evidence isn’t a fact—it’s a change in your confidence about facts. Jeffrey’s rule handles this by shifting probabilities of observations, then propagating to hypotheses."  

  #### **Post-Game Handout (1-Page Printable)**  
  Include:  
  - Round summaries and key calculations.  
  - Formula: `P_new(H) = [P(H|A) * P_new(A)] + [P(H|B) * P_new(B)]`.  
  - When it fails: "If the *reason* for uncertain evidence affects H, recompute conditionals."  

  **Outcome:** Players leave with an intuitive, memorable grasp of Jeffrey conditionalization—and a coffee card for the best calibrators!
