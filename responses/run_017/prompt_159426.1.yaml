prompt: |-
  Something keeps coming up in long argument threads in the rationalist-adjacent corners of the internet, and I have never once seen anyone attach a name to it, so I want to know whether the philosophical literature has one.

  The pattern: someone proposes an attitude — believe that P, hope for Q, trust this person — and defends it by pointing to what having the attitude would *do*. Sometimes the move is transparently corrupt. Offer me a million dollars to believe that the sky is green, or credibly threaten me until I do, and you have given me an excellent reason to end up with that belief and no reason at all for it; the reasons there are for believing something are supposed to come from the thing believed, not from the payoffs of believing. Fine.

  But the same move sometimes looks not merely acceptable but exemplary. If I say that I trust my graduate student with the lab because my trusting her is part of what makes her rise to the occasion, nobody hears that as a corrupting reason. On the contrary, the person who withholds trust on those grounds is the one whose attitude looks defective. Hoping seems similar: "hoping will make you work harder, so hope" is not heard as a corrupt reason for hope — and, tellingly, the reverse is also heard as a real consideration: "hoping will make you complacent, so don't hope." Belief looks sealed against considerations running in either direction: neither the bribe nor the prospect of a devastating truth seems to touch whether the belief is the one to hold. Trust and hope look porous in both directions. That contrast is the thing I want a handle on.

  More than a label, I want a carving, and these are the distinctions I keep needing and cannot state cleanly:

  - Trusting her does not literally manufacture her reliability; at best it gives a capacity she already has the chance to manifest. My believing that I will recover from the placebo can help produce my recovery, with no prior capacity to elicit. Those two feel different, and I suspect the difference is doing the real work in the cases above, but I cannot say what the difference is.
  - Some cases are collective rather than individual: my believing that the bank is solvent does not make it solvent, though enough people's doing so would. Does that belong to the same phenomenon or a different one?
  - Intending to do something makes it likelier almost by definition. So if "the effects of the attitude" were admissible in general, intention would come out as trivially self-supporting. Something must exclude that, and I want to know what.
  - And there is a looping worry: if an attitude brings about the very property it is supposed to be a response to, then it looks as though it cannot be a response to anything independent of itself, and so cannot be merited at all. That conclusion seems right for the bribe and wrong for the trust case, and I cannot say why.

  Please don't give me a reading list; I want the map. Is this one phenomenon with a settled name, or several that I am conflating? Which established concepts are the near neighbours, and how does what I have described differ from each of them? Where are the edges — which attitudes are porous to their own effects, which are sealed, and what predicts the difference? If some part of it genuinely has no name, coin one, define it, and tell me which of my cases fall inside it and which just outside.
reasoning: |-
  Okay, the user is grappling with a philosophical issue they've observed in rationalist circles but can't find named in literature. They describe a pattern where attitudes like belief, trust, hope, and intention are justified based on their consequences, and this seems acceptable for some attitudes but corrupt for others. They want a conceptual map to distinguish these cases.

  First, I need to identify the core tension: consequential justifications for attitudes. The user notes that for belief, such justifications feel corrupt (like being paid to believe something), but for trust or hope, it seems legitimate (trusting someone to help them rise to the occasion). They also mention placebo effects, collective cases (like believing in a bank's solvency), and intentions as edge cases.

  The user's deeper need seems to be a structured framework to categorize when consequential justifications are valid. They want to understand why some attitudes can be self-fulfilling without corruption, while others can't. They’re likely frustrated by the lack of terminology and seeks clarity for debates in rationalist communities.

  Key distinctions from their examples:
  1. **Trust vs. Belief**: Trusting someone can enable their reliability, whereas believing a fact doesn’t make it true (except in placebo cases). The difference might lie in whether the attitude affects the outcome via another agent’s responsiveness.
  2. **Individual vs. Collective**: Belief in a bank’s solvency only works if many people share it, making it a collective self-fulfilling prophecy. This is different from individual attitudes.
  3. **Intention**: Intending to act directly causes the action, so it’s inherently self-fulfilling. But justifying intention by its consequences feels circular—why intend if not for the outcome?
  4. **Looping Problem**: If an attitude creates its own justification (e.g., trust enabling reliability), is it merited? The user senses this is valid for trust but not for bribed belief.

  Existing philosophical concepts:
  - **Doxastic Involuntarism**: Beliefs aren’t chosen, so pragmatic reasons (like bribes) don’t apply. Trust and hope are voluntary stances.
  - **Teleological vs. Fitting-Attitude Accounts**: Attitudes can be evaluated by their goals (teleological) or by how well they fit the object (fittingness). Trust/hope blend both; belief is primarily fittingness-based.
  - **Self-Fulfilling Attitudes**: Some attitudes cause their own satisfaction conditions (like trust enabling reliability). This is legitimate when the attitude’s expression influences the outcome, as in trust or collective hope.
  - **Placebo Belief**: This is a special case where a belief (e.g., in recovery) directly causes the outcome biologically, not socially. It’s still belief-like but functionally distinct.

  Synthesizing a framework:
  1. **Responsiveness to Expression**: If the attitude’s expression (e.g., trusting behavior) affects the outcome, consequential reasons may be valid. Trust works because the trustee responds to the expressed trust. Beliefs, when expressed, don’t typically alter facts (except in placebo/collective cases).
  2. **Voluntariness**: Voluntary attitudes (trust, hope) can be adopted for reasons, including consequences. Involuntary ones (belief) can’t.
  3. **Mechanism**: Social mechanisms (like reciprocity in trust) vs. biological (placebo) vs. collective action (bank runs). Each has different justifications.

  Coining terms:
  - **Expressively Consequential Attitudes (ECAs)**: Attitudes where expressing them influences their satisfaction conditions. Trust, hope (sometimes), and intentions qualify. Belief usually doesn’t, except in edge cases like placebo or collective belief.

  Applying this:
  - Trust: ECA—expressing trust influences the trustee.
  - Hope: Sometimes ECA if it motivates action; other times not.
  - Intention: ECA by definition—intending leads to action.
  - Belief: Not ECA, except in placebo (biological mechanism) or collective cases (social mechanism).

  Looping Problem: For ECAs, the attitude’s merit comes from its role in a feedback loop. Trust isn’t meritless because the trustee’s reliability is still required—trust merely enables it. The bribe case lacks any such loop.

  This framework should help the user categorize cases, predict when consequential justifications are valid, and resolve the looping worry by emphasizing the causal role of expression.
answer: |-
  ### The Conceptual Map You're Seeking

  You've identified a deep and recurring philosophical puzzle: **when is it legitimate to adopt an attitude (trust, hope, belief, intention) based on its practical consequences, and when is this "corrupt"?** This isn't a single phenomenon with one name; it's a cluster of related issues intersecting epistemology, ethics, and philosophy of action. Below, I'll provide a structured map: core distinctions, established concepts, a coined term for the porous/sealed divide, and answers to your specific questions.

  ---

  ### **Core Distinction: Sealed vs. Porous Attitudes**
  The key divide is whether an attitude is **evaluatively sealed** (its justification depends *only* on whether it "fits" the world) or **evaluatively porous** (its justification can *also* depend on its downstream effects). This maps onto your "sealed vs. porous" framing:

  - **Sealed Attitudes**:  
    - *Definition*: Their justification depends solely on whether they accurately represent or respond to a mind-independent state (e.g., evidence, facts).  
    - *Examples*: Belief ("Is P true?"), regret ("Was my action wrong?").  
    - *Corruption test*: Consequential reasons (e.g., bribes, incentives) are always invalid justifications.  
    - *Why?* These attitudes are **non-voluntary** and **truth-apt**—they aim at correspondence with reality. Belief isn't chosen; it's compelled by evidence. Pragmatic effects are irrelevant to their core function.

  - **Porous Attitudes**:  
    - *Definition*: Their justification can legitimately include their consequences, especially when the attitude itself plays a causal role in bringing about its object.  
    - *Examples*: Trust, hope, intention, faith, forgiveness.  
    - *Corruption test*: Consequential reasons are valid *if and only if* the attitude contributes to realizing its object through a **non-manipulative feedback loop**.  
    - *Why?* These attitudes are **voluntary stances** or **commitments** that shape agency, relationships, or action. They aren't purely descriptive; they're partly *performative*.

  #### **Nearby Established Concepts**  
  1. **Doxastic Involuntarism** (William Alston):  
     - Beliefs aren't under direct voluntary control, so pragmatic reasons can't justify them. Explains why the bribe case is corrupt.  
     - *Contrast*: Trust/hope *are* voluntary—you can choose to adopt them for strategic reasons.  

  2. **Teleological vs. Fitting-Attitude Accounts** (e.g., in value theory):  
     - **Fittingness**: An attitude is justified if it "fits" its object (e.g., fear fits danger). Belief is purely fittingness-based.  
     - **Teleology**: An attitude is justified by its good consequences. Trust/hope blend both: fittingness (does the person merit trust?) *and* teleology (will trusting improve outcomes?).  

  3. **Self-Fulfilling Prophecies** (Robert K. Merton):  
     - When an expectation (e.g., "this bank is solvent") causes behavior that makes it true. Applies to collective cases (your bank example).  
     - *Contrast*: Individual beliefs (e.g., "the sky is green") aren't self-fulfilling—they lack social feedback loops.  

  4. **Constitutive Norms** (e.g., Christine Korsgaard on intention):  
     - Intentions are defined by their role in action. "Intending X makes X likelier" is true by definition, but this doesn't justify *forming* the intention—justification comes from external reasons (e.g., "X is good").  

  ---

  ### **Coining a Term: Expressively Consequential Attitudes (ECAs)**
  For the porous cases where the *expression* of the attitude affects its object, I propose **Expressively Consequential Attitudes (ECAs)**.  

  - **Definition**: An attitude is expressively consequential if:  
    (a) It can be voluntarily adopted,  
    (b) Its expression (e.g., acting trustingly) causally influences the likelihood of its object (e.g., reliability), and  
    (c) This influence operates through a **non-deceptive feedback loop** (e.g., interpersonal reciprocity, psychological motivation).  

  - **Why this term?** It captures the *expression* of the attitude (trusting behavior, hopeful effort) as the mechanism linking the attitude to its outcome.  

  #### **Which Attitudes Are ECAs?**  
  | Attitude | ECA? | Why | Examples |  
  |----------|------|-----|----------|  
  | **Trust** | Yes | Expressing trust (e.g., delegating tasks) incentivizes/reinforces reliability in the trustee. | Trusting a grad student to help them rise to the occasion. |  
  | **Hope** | Contextual | Hopeful expression (e.g., persistent effort) can realize the outcome *if* success is effort-sensitive. Not ECA if outcome is independent (e.g., hoping for rain). | "Hope for recovery to motivate rehab" (ECA) vs. "Hope for a lottery win" (non-ECA). |  
  | **Intention** | Yes, but trivial | Expressing intention (e.g., planning) directly causes action. Consequential reasons are circular—you intend *because* you value the outcome. | "Intend to exercise because it’s healthy" – justified by the outcome, not the intention’s effects. |  
  | **Belief** | No (usually) | Belief aims at truth; expression doesn’t alter facts (except in edge cases). | Bribe to believe the sky is green (corrupt). |  
  | **Placebo Belief** | Edge Case | Expression (e.g., reduced stress) biologically affects the outcome. Not a "standard" belief—it’s functional, not truth-oriented. | Believing a sugar pill will cure you *does* help via psychosomatic effects. |  
  | **Collective Belief** | Yes | Expression (e.g., withdrawing funds) collectively creates the outcome. A social ECA. | Believing a bank is solvent prevents a run *if* enough share the belief. |  

  ---

  ### **Answering Your Specific Distinctions**
  1. **Trust vs. Placebo Belief: The "Manufacturing Reliability" Difference**  
     - Trust doesn’t "manufacture" reliability ex nihilo; it *elicits* pre-existing capacity through **relational reciprocity**. The trustee must be *responsive* to your trust (e.g., feeling obligated). Placebo belief *does* "manufacture" outcomes via biological/psychological mechanisms (e.g., neurochemical changes from optimism), bypassing agency.  
     - **Predictor**: ECAs require a **responsive mechanism** (e.g., another agent’s autonomy, a feedback loop). Placebos lack this—they work mechanistically, not relationally.  

  2. **Individual vs. Collective Cases**  
     - Both are ECAs, but operate on different mechanisms:  
       - *Individual*: Relies on **interpersonal dynamics** (e.g., trust in your grad student).  
       - *Collective*: Relies on **emergent social dynamics** (e.g., bank solvency as an equilibrium).  
     - **Key difference**: Collective cases require **threshold effects** (enough people must participate). Individual cases do not.  

  3. **Intention and Trivial Self-Support**  
     - Intention *is* self-supporting—but this doesn’t justify its adoption. Consequential reasons for intentions are **bootstrapping**: you intend X *because* X is desirable, not because intending makes X likelier.  
     - **What excludes circularity?** Intentions inherit justification from **external reasons** (e.g., moral or prudential values). The self-fulfilling nature is a byproduct, not a justification.  

  4. **The Looping Worry: "Can It Be Merited?"**  
     - **For sealed attitudes (belief)**: Looping is corrupt because merit requires *independent* grounds (evidence). A belief caused by a bribe has no connection to truth.  
     - **For ECAs (trust/hope)**: Looping is legitimate because merit is **dynamic**. Trust is merited not just by past reliability, but by the *potential* for reliability unlocked by trusting. The feedback loop (e.g., the student becoming more responsible) *is* the independent ground.  
     - **Why no corruption?** ECAs aren't truth-apt; they're **agency-enabling**. Their merit includes cultivating futures (e.g., trust builds relationships). The bribe case lacks this—it severs the attitude from its constitutive goods.  

  ---

  ### **The Edge Cases: What Predicts Porousness?**
  An attitude is porous (ECA) if:  
  - **Voluntariness**: It can be adopted intentionally.  
  - **Expressiveness**: Its behavioral manifestation affects the world.  
  - **Non-Deceptive Feedback**: The mechanism linking expression to outcome isn’t manipulative (e.g., trust works via reciprocity, not coercion).  

  **Sealed attitudes fail these**: Belief isn’t voluntary, its expression doesn’t alter facts (usually), and pragmatic loops (bribes) are deceptive.  

  **Placebos and collective beliefs** are edge cases:  
  - Placebos are biologically expressive but non-voluntary (you can’t "choose" to believe a placebo).  
  - Collective beliefs are ECAs socially but not individually.  

  ---

  ### **Summary: Your Cases Mapped**  
  - **Inside ECAs**: Trust (individual), hope (effort-sensitive cases), intention, collective belief.  
  - **Outside ECAs**: Belief (standard), regret, fear.  
  - **Edge Cases**: Placebo belief (porous biologically, but belief-like), collective belief (porous socially).  

  This framework explains why trust isn’t corrupt—it’s an ECA where the loop (e.g., eliciting reliability) is constitutive of its function. Belief is sealed because its loop (e.g., bribes) corrupts its core aim: truth. The difference isn't just psychological; it's normative, rooted in the attitude's purpose and voluntariness. If you debate this further, focus on **what the attitude is for** and **how it interacts with agency**.
