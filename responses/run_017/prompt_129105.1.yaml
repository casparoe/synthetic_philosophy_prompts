  ### Decision Tree: Implications of Denying Ultimate Responsibility  
  **Root Commitment:** I grant the Basic Argument's conclusion: no one is ever ultimately responsible, in the desert-entailing sense, for anything.  

  #### Decision Tree  
  1. **Are reactive attitudes (e.g., resentment, gratitude, guilt) inescapable—i.e., impossible to fully eliminate—regardless of our beliefs about desert?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Are blame/praise practices (e.g., punishment, rewards) justified without desert?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **Are reactive attitudes justified without desert for other reasons (e.g., their social function)?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  4. **Can reactive attitudes be maintained at full strength while explicitly denying desert?**  
     - **Yes** → **Leaf A**  
     - **No** → **Leaf B**  

  5. **Can reactive attitudes be maintained at full strength while explicitly denying desert?**  
     - **Yes** → **Leaf C**  
     - **No** → **Leaf D**  

  6. **Are blame/praise practices justified without desert?**  
     - **Yes** → Go to 8.  
     - **No** → Go to 9.  

  7. **Are blame/praise practices justified without desert?**  
     - **Yes** → **Leaf E**  
     - **No** → **Leaf F**  

  8. **Can reactive attitudes be maintained at full strength while explicitly denying desert?**  
     - **Yes** → **Leaf G**  
     - **No** → **Leaf H**  

  9. **Can reactive attitudes be maintained at full strength while explicitly denying desert?**  
     - **Yes** → **Leaf I**  
     - **No** → **Leaf J**  

  ---

  #### Leaf Descriptions  
  | leaf_name | one_line_statement | answer_pattern_reaching_it | most_awkward_commitment | indistinguishable_from |
  |-----------|--------------------|----------------------------|--------------------------|------------------------|
  | **Leaf A** | Attitudes inescapable, practices justified; attitudes retainable at full strength. | Q1:Y, Q2:Y, Q4:Y | Natural attitudes persist despite beliefs, but practices may appear unjust. | Leaf G (in practice) |
  | **Leaf B** | Attitudes inescapable, practices justified; attitudes blunted over time. | Q1:Y, Q2:Y, Q4:N | Practices rely on attitudes that erode, risking dissonance. | — |
  | **Leaf C** | Attitudes inescapable, practices unjustified; attitudes retainable at full strength. | Q1:Y, Q2:N, Q5:Y | Urge to express attitudes clashes with rejection of practices. | *Unoccupied* (Unexplored) |
  | **Leaf D** | Attitudes inescapable, practices unjustified; attitudes blunted over time. | Q1:Y, Q2:N, Q5:N | Inevitable attitudes fade, leaving practices unsupported. | *Unoccupied* (Unattractive) |
  | **Leaf E** | Attitudes eliminable and unjustified; practices justified without desert. | Q1:N, Q3:N, Q7:Y | Punitive practices without emotional grounding seem cold/inhuman. | — |
  | **Leaf F** | Attitudes eliminable and unjustified; practices unjustified. | Q1:N, Q3:N, Q7:N | Moral life requires rebuilding without reactive attitudes or practices. | — |
  | **Leaf G** | Attitudes justified non-desert, practices justified; attitudes retainable. | Q1:N, Q3:Y, Q6:Y, Q8:Y | Desert-free justification may feel like "responsibility-lite." | Leaf A (in practice) |
  | **Leaf H** | Attitudes justified non-desert, practices justified; attitudes blunted. | Q1:N, Q3:Y, Q6:Y, Q8:N | Practices outlive the attitudes meant to anchor them. | — |
  | **Leaf I** | Attitudes justified non-desert, practices unjustified; attitudes retainable. | Q1:N, Q3:Y, Q6:N, Q9:Y | Emotions demand expression, yet practices are forbidden. | — |
  | **Leaf J** | Attitudes justified non-desert, practices unjustified; attitudes blunted. | Q1:N, Q3:Y, Q6:N, Q9:N | Both attitudes and practices fade, risking moral disengagement. | — |

  ---

  #### Key Notes  
  - **Unoccupied Combinations**:  
    - **Leaf C/D** (Q1:Y, Q2:N): Requires suppressing natural expressions of inescapable attitudes. *Largely unexplored due to psychological tension*.  
    - **Leaf D** (Q1:Y, Q2:N, Q5:N): Blunted attitudes make practices incoherent. *Unattractive due to instability*.  
  - **Indistinguishable Leaves**:  
    - **Leaf A (quietism)** and **Leaf G (accountability without desert)** are practically identical if double bookkeeping holds, differing only in *why* attitudes persist (inescapability vs. justification).  
  - **Final Branch (Double Bookkeeping)**:  
    All paths retaining attitudes (A, B, C, D, G, H, I, J) hinge on whether denying desert *empirically* undermines attitudes. This is unresolved and splits every view.  
  - **Trees Cannot Separate**:  
    **Leaf F (hard incompatibilism)** and consequentialist **Leaf E** are distinct (practices abolished vs. repurposed), but both reject attitudes. The tree separates them cleanly (Q7:N vs. Q7:Y).  

  ---  
  *Design: The tree starts at the root commitment and forces choices about attitudes' inevitability/justification, practices, and double bookkeeping. Unnamed views emerge from combinations, with flags for gaps and practical overlaps.*
