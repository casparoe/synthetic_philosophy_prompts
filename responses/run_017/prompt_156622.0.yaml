  For the realism objection, I'll emphasize that denying causal powers doesn't deny existence. For the illusionist, I'll clarify why properties exist despite being epiphenomenal. The exclusion problem expert gets a detailed calibration vs common cause comparison. The cognitive scientist needs empirical alignment explanations. The belief question requires careful framing about philosophical commitment.

  The calibration reply is make-or-break - if it fails against the common-cause alternative, the chapter collapses. I'll note where replies are vulnerable, like question-begging on realism or hand-wavy cost registration details. The nightmare question about evolutionary purpose should be deflected to implementation necessity rather than adaptation.

  This prep should give the user defensive strategies while honestly flagging weaknesses. The tone should be supportive but rigorous - they clearly want real challenge preparation, not reassurance.
answer: |-
  Here’s a battle-tested prep sheet tailored to your committee’s profiles and the core vulnerabilities of your thesis. I’ve ordered objections by likely immediacy and aggression, flagged soft spots, and identified the *must-land* reply. **Concede early, defend late.**

  ---

  ### **Preemptive Concession (Open With This)**
  *"Before I start, let me clarify: I’m not denying that experiences *exist*, nor that we *have* reliable introspective judgments about them. I’m denying that the *phenomenal character itself* is doing any causal work in producing those judgments. The reliability comes from elsewhere."*  
  *(This disarms the "non-starter" reflex by separating existence from causal efficacy.)*

  ---

  ### **Objection 1 (Sydney Realist #1, Interrupting Early)**  
  **Phrasing:** "This is incoherent. If phenomenal properties are real physical properties, as we agree, they *must* have causal powers—that’s what physical properties *do*. You’re positing magic."  
  **Core Reply (2 min):**  
  - Physical ≠ causally efficacious *in all respects*. Mass-energy is physical, but gravitational waves pass through it without interaction. My claim: phenomenal properties are physical *byproducts* of recurrent processing, like the heat of a CPU. Heat exists, but it doesn’t *cause* the computation—it’s a registration of cost.  
  - **Soft Spot:** Assumes all physical properties *must* be causal. Your reply leans on analogy (heat/gravitational waves), which they may dismiss as disanalogous.  

  ### **Objection 2 (Exclusion Problem Expert)**  
  **Phrasing:** "Your ‘calibration move’ just restates the common-cause model: both experience and judgment are caused by a neural substrate. Why isn’t this standard Kim-style exclusion? If the substrate does all the causing, the experience is excluded *and* your ‘readout reliability’ is redundant."  
  **Core Reply (2 min):**  
  - The common-cause model *undermines* introspective reliability (since judgment isn’t tuned to experience). My calibration move explains reliability: the readout system was *trained against the experience itself* during development. It’s not that substrate causes both; it’s that past interactions *calibrated* the readout to report accurately *now*, despite no current causal link.  
  - **Must Land This:** If this fails, your chapter collapses. Stress that reliability is *historical* (training-channel), not current (causal-channel).  
  - **Soft Spot:** If pressed, you must clarify how "training against experience" isn’t just past causation sneaking in. (Retort: "Calibration sets a *disposition*, like a thermometer’s accuracy being set in the lab, even if unused for years.")  

  ### **Objection 3 (Illusionist)**  
  **Phrasing:** "If these properties do nothing, why not Occam’s Razor them away? All the work is done by the readout system’s functional states. You’re keeping metaphysical baggage."  
  **Core Reply (2 min):**  
  - Illusionism can’t explain *why* readout systems generate "what-it’s-like" reports rather than neutral tags. My cost-registration account answers this: phenomenal properties are the system’s *internal gauge* of metabolic expense. They’re not causal, but they’re *real indicators*—like a car’s "check engine" light being a real physical state, even if it doesn’t cause repairs.  
  - **Soft Spot:** "Gauge" language may sound functional/causal. Stress: it’s a *byproduct signal*, not a control signal.  

  ### **Objection 4 (Cognitive Scientist)**  
  **Phrasing:** "Empirical dissociations (blindsight, etc.) show readout can fail *independently* of processing. If experience is a ‘registration of cost,’ why would a blindsight patient’s V1 lesion spare processing but kill both the cost signal *and* readout? Your view predicts correlated failures."  
  **Core Reply (2 min):**  
  - Blindsight involves *degraded* recurrent processing—it’s not intact but "dark." My model predicts that if recurrent processing is disrupted, *both* the cost signal (phenomenality) *and* the functional output degrade. What’s preserved is non-recurrent pathways. Readout failure is expected.  
  - **Soft Spot:** Cases like "silent consciousness" (e.g., anesthesia awareness without report) might challenge the cost-registration link. (Have a ready example: "That’s readout failure, not experience without cost—the cost is still there, but the reporting pipeline is disrupted.")  

  ### **Objection 5 (Sydney Realist #2)**  
  **Phrasing:** "If I stub my toe, the pain *makes* me yell. Deny that, and you deny the evidence of first-person psychology. Your view is revisionist beyond salvage."  
  **Core Reply (2 min):**  
  - The neural state causing the yell *also* generates the pain as a byproduct. The pain doesn’t *cause* the yell; it’s a parallel registration. We conflate correlation with causation because the registration is reliable. Analogize to a car’s dashboard: the "low fuel" light doesn’t cause you to refuel; the fuel sensor does.  
  - **Soft Spot:** Hard to shake the intuition that pain *motivates* action. Concede: "I agree it *feels* causal. That’s because introspection is calibrated to report *as if* it were—but the calibration is historical, not current."  

  ### **Objection 6 (Grad Student)**  
  **Phrasing:** "Do you *believe* your own theory? If epiphenomenalism is true, your belief isn’t caused by the truth of the theory—so why trust it?"  
  **Core Reply (2 min):**  
  - My belief is caused by *arguments and evidence*, not by phenomenal properties. Epiphenomenalism only says *phenomenal character* is inert—not that reasoning is! Trust comes from the calibration of my conceptual readout (e.g., logic) via past success.  
  - **Soft Spot:** If they press: "But your *experience of thinking* seems crucial!" Reply: "The *neural dynamics* of thinking matter. The experience is just the cost of running them."  

  ### **Objection 7 (Exclusion Expert, Follow-Up)**  
  **Phrasing:** "Your ‘training channel’ is still causal—it just happened in the past. How does that avoid exclusion *then*?"  
  **Core Reply (2 min):**  
  - During training, the *neural substrate* caused both the experience and the readout adjustment. The experience *still* played no causal role—it was a passive relatum in the learning rule. The readout system learned to track a *pattern* that correlated with the experience, not to be caused by it.  
  - **Soft Spot:** This may feel like sleight-of-hand. Stand firm: "Exclusion applies to *efficacy*, not correlation. Calibration exploits correlation."  

  ### **The Question You Hope Nobody Asks**  
  **Phrasing:** "If phenomenal properties are non-causal cost registrations, *why do they exist*? What evolutionary pressure would build a system to register its own inefficiency?"  
  **Reply (If Forced):**  
  - They’re not adaptations; they’re *inevitable byproducts* of recurrent processing under constraints. Just as friction produces heat (non-functional but unavoidable), recurrent processing under metabolic limits produces "felt cost." Evolution didn’t *select for* it; it emerged from implementation.  
  - **Brutal Reality:** This is your weakest point. If pressed, pivot to: "We keep them because illusionism can’t explain why *this specific* functional profile feels like *this*."  

  ---

  ### **Strategic Summary**
  - **Wave Off:** The "why believe your theory?" objection (it conflates phenomenality with propositional attitudes).  
  - **Concede Early:** That phenomenal properties *exist* and *seem* causal (it’s intuitive).  
  - **Deadly If Missed:** The **calibration vs. common-cause** distinction (Objection #2). If this fails, your dissolution of self-undermining collapses.  
  - **Real Force:** The exclusion expert’s follow-up (Objection #7) and the "why exist?" question. Both expose tensions in naturalizing epiphenomenalism.  
  - **Save Your Ammo:** Don’t over-defend the cost-registration account—it’s secondary to the calibration move. Focus 70% on shielding epiphenomenalism from self-refutation.  

  **Final Tip:** When cornered, retreat to: "I’m not saying this is *true*—I’m arguing it’s *coherent, empirically defensible, and dissolves a fatal problem* for realism about phenomenality." Neutralizes the "non-starter" bias.  

  Go crush it—your setup is razor-wire tight for a WIP. Remember: they attack the thesis *as stated*, so **control the framing relentlessly**.
