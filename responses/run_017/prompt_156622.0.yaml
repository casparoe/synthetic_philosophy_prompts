  The user's committee includes diverse perspectives: two realists who reject epiphenomenalism outright, an illusionist who might question why keep phenomenal properties at all, an exclusion problem expert who'll challenge the calibration move, a cognitive scientist familiar with empirical dissociation cases, and grad students who might ask personal belief questions.

  The user wants a prep sheet with 8 likely objections in the order they might come, phrased as those people would ask them. Each needs a 2-minute reply with vulnerability notes. They also want advice on which objections are serious, what to concede upfront, and which reply must land successfully.

  I should structure this with:
