answer: |-
  **Form ONTC/78b: Statutory Circular: Clarifications on Perceptual Validation Requirements**  
  **Issuing Authority:** Office for Ontological Compliance (OOC)  
  **Effective Date:** 1st Quintilis, 172  
  **Supersedes:** ONTC/78a  

  **REFERENCE:** *Principia Ontologica (Statutory) Act 171*, Sections 1(a), 7(d), 9(2), & Schedules 3 & 5 (Perceptual Validation Protocols & Exceptions).  

  ### SECTION I: CASE RULINGS & PRECEDENTIAL INTERPRETATIONS
  The Office provides the following clarifications based on recent inquiries and contested determinations. All rulings derive from the foundational statutory principle (*Principia Ontologica*, Section 1(a)): **"Esse est percipi"** ("To be is to be perceived"). An unperceived entity is ontologically impossible, not merely unverified. Findings are binding for all compliance verification procedures.

  1.  **Case ONTC-Ref/45-12: Park Arboreal Object, Claimed Persistent Existence During Non-Observation Periods.**
      *   **Claim:** Citizen submitted affidavit asserting the independent existence of a specific oak tree in Regent's Park during periods of zero human observation, supported by a detailed mental image recalled during a subsequent visit.
      *   **Ruling:** DENIED. The mental image constitutes perception *at the time of conception*. It cannot serve as evidence for the tree's existence during the *prior* unobserved interval. The conception itself is a perceptual event confirming the tree *only at the moment of the claimant's thought*. The claimant's attempt to use this perception to validate existence *during absence of perception* is logically circular and invalid under Section 1(a). The tree, during unobserved intervals, held no ontological status. Ruling upheld upon appeal (ONTC-App/45-12a). Compliance Note: Park maintenance schedules must synchronize with predictable observation patterns (e.g., dawn opening) to avoid ontological destabilization events. Schedule 3(1)(c) applies.

  2.  **Case ONTC-Ref/67-03: Secure File Storage Protocol (Level 4), Cabinet Gamma-7.**
      *   **Claim:** Department of Records inquiry regarding ontological status of a physical dossier sealed within Cabinet Gamma-7, secured via biometric lock, with no human observation or access for 72 hours. Closed-circuit camera recorded the cabinet exterior continuously.
      *   **Ruling:** ONTOLOGICALLY NULL for the duration of non-observation. Recording devices (cameras, audio logs, data storage media) are not perceivers per Schedule 5(2)(a). They are inert matter, incapable of perception themselves. Their function is *potential* data capture for *future* perception. Potential perception does not constitute actual perception. The dossier, while recorded as *having been placed* inside, possessed no independent existence while unperceived. Its status re-established only upon biometric access and human observation. Compliance Directive: Level 4 storage requires staggered verification checks by authorized personnel at intervals not exceeding 12 hours (Schedule 3(2)(b)).

  3.  **Case ONTC-Ref/89-21: Incident Report T-447 (Alleged Theft, Zero Witnesses).**
      *   **Claim:** Police report concerning the alleged removal of a silver candlestick from the Marbury Hall drawing-room. No witnesses present during the postulated event. Security logs show room empty during the relevant timeframe. Candlestick observed missing during subsequent inventory.
      *   **Ruling:** EVENT CANNOT BE ONTOLOGICALLY SUBSTANTIATED. The alleged theft, occurring without perception, is impossible under Section 1(a). The candlestick existed prior to the unobserved interval and exists post-discovery of its absence. Its non-presence during the inventory *is* a perceived state. However, the *event* of its removal, lacking any perceptual validation contemporaneous with its purported occurrence, has no ontological standing. The candlestick's location during the unobserved interval is indeterminate and irrelevant; it possessed no being. Investigation should focus on verifiable perceptual sequences (e.g., last verified presence, discovery of absence). No charges sustainable for an ontologically impossible event.

  4.  **Case ONTC-Ref/92-05: Citizen Report: Persistent Unshared Somatic Distress (Claimant Ref: "Migraine").**
      *   **Claim:** Citizen submitted Form ONT-SD/1 ("Report of Somatic Distress Requiring Ontological Validation") describing severe cephalalgia occurring while alone. Citizen asserts the pain's reality and requests medical resource allocation based on its persistence independent of external observation.
      *   **Ruling:** VALIDATED PERCEPTUAL EVENT. The Office recognizes the claimant's *report* of perception (i.e., the pain) as a perceptual event *in itself*. The claimant perceives their own distress. This satisfies Section 1(a) for the *existence of the reported perceptual state*. External verification of the specific qualitative experience ("pain as felt by another") is not required, nor is it ontologically relevant to the claimant's own perceptual reality. The pain exists *as perceived by the claimant*. Resource allocation proceeds based on the validated report of perceptual distress under Medical Ontology Protocols (Schedule 7). *Compliance Note:* This ruling pertains solely to the validation of the claimant's *perceived state*. It does not, and cannot, speculate on the ontological status of hypothetical "unperceived pain" in others, which is a null concept under the Act. The mechanisms of somatic perception are processed as perceptual data streams, distinct from material substrate concerns.^(1)

  ### SECTION II: OPERATIONAL PROTOCOLS & FUNDING IMPLICATIONS
  *   **Continuous Perceptual Assurance (CPA):** To prevent systemic ontological decay during periods of widespread non-observation (e.g., night), the OOC maintains the **Continuous Perceptual Assurance (CPA) Protocol** (Schedule 3(5)). This is implemented via the **Contingent Universal Perceiver (CUP) Framework**, a Class-1 Ontological Stabilization Contract currently held by [REDACTED - COMMERCIAL CONFIDENTIALITY]. Funding for the CUP Framework is allocated under Budget Line **OOC-OPER/CPA-001**. Entities experiencing localized stabilization lapses (e.g., unobserved server rooms, remote facilities) must submit Form ONTC-STA/1 for emergency CPA augmentation (fees apply).
  *   **Objector Statement Processing:** All objections citing "material persistence" or "common sense" are processed under Standard Ontological Contradiction Procedure (SOCP-7). Example processed objection: *"This is ridiculous! My coffee cup stays on the desk when I leave the room! I know it's there! You lot are making reality vanish!"* (Citizen Ref: GRM/445-21). SOCP-7 flags such statements as expressions of perceptual *belief* or *memory*, not evidence of unperceived existence. Belief/memory are perceivable mental states *at the time of assertion*, validating only themselves, not the unperceived cup. Citizen advised to install a verification webcam (Schedule 5(3) compliant).

  **FOOTNOTES:**
  ^(1) The Office notes that somatic perception reporting relies entirely on claimant testimony. Direct perceptual access by the Office to the claimant's internal state is categorically impossible per the nature of subjective experience. Validation is thus based solely on the coherence and consistency of the report as a received perceptual datum within the Office's operational framework. This does not imply endorsement of any model of mind-body interaction inconsistent with the *Principia Ontologica*.

  **Certified by:**  
  Eurydice Vance, Chief Compliance Officer  
  Office for Ontological Compliance  
  *Veritas per Perceptionem*
