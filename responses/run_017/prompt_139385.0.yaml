answer: |-
  ### PUBLIC INFORMATION LEAFLET  
  **BUREAU OF PRIORIC HARMONY (BPH)**  
  *Ensuring Epistemic Concordance Since 1967*  
  *Commissioner: Dr. Edwina Aumann*  

  **STATEMENT OF PURPOSE**  
  Pursuant to the Rational Agents Act (1967), all citizens are presumed to share a common prior probability distribution over states of the world. Private evidence may conditionally update individual beliefs, but persistent disagreement constitutes a failure of epistemic hygiene. The Bureau of Prioric Harmony (BPH) resolves such failures via audit, corrective realignment, or referral to the Department of Consensus Enforcement. This leaflet outlines compliance requirements.  

  **REGULATIONS FOR CIVIC BELIEF SYNCHRONIZATION (R.C.B.S. § 5-301)**  

  1. **Mandatory Prior Declaration (MPD):**  
     All citizens must file a **Preliminary Incarnate Belief Return (PIBR)** within 30 days of birth, attested by a licensed epistemologist. The PIBR declares prior probabilities over a BPH-approved exhaustive state partition (e.g., {flood, no flood}, {disease present, disease absent}). Amendments require Level-4 clearance. (*Note:* Fetal PIBR proxies are permissible if notarized *in utero*.)  

  2. **Evidence Validation Protocol (EVP):**  
     Private signals must be:  
     (a) *Partition-consistent* (mappable to a common information structure),  
     (b) *Admissible* (non-tautological; e.g., "the river is muddy" is admissible; "I feel it in my bones" is not),  
     (c) *Filed* via Form E-9 within 72 hours of acquisition.  

  3. **Dispute Resolution (Common Knowledge Attestation):**  
     Parties in disagreement must:  
     (a) Publicly announce posteriors in alternating sequence,  
     (b) Submit documentation of ≥3 announcement rounds,  
     (c) Certify that information partitions are common knowledge (Form CK-12).  
     Failure to converge after 3 rounds triggers a BPH audit.  

  4. **Trade and Wagering Nullification:**  
     Per the No-Betting Pact (1976), all speculative contracts predicated on information asymmetry are void. The sibling agency, *Wager Integrity Compliance*, will annul such trades and levy penalties. Rational agents with common priors gain nothing from betting.  

  ---

  **WORKED EXAMPLE: RIVER FLOOD RISK ASSESSMENT**  

  *Scenario:*  
  Neighbors Alice (posterior: 80% flood risk) and Bob (posterior: 20% flood risk) disagree after observing private evidence. Alice cites "muddy river water"; Bob cites "drought-resistant moss."  

  *BPH Intervention:*  
  1. **PIBR Audit:** Alice and Bob’s birth records confirm identical priors (50% flood risk, per Standard Hydrological Prior § 7).  
  2. **Evidence Adjudication:**  
     - Alice’s "muddy water" signal (Form E-9 #A-198) is ruled admissible (correlates with erosion).  
     - Bob’s "moss" signal (Form E-9 #B-199) is ruled inadmissible (lacks partition-consistency; moss type not in common state space).  
  3. **Announcement Simulation:**  
     - Round 1: Alice: 80%, Bob: 20%.  
     - Round 2: Alice recalculates given Bob’s inadmissible evidence: 78%.  
     - Round 3: Bob recalculates: 75% (*Note: Convergence incomplete; audit triggered*).  
  4. **Resolution:**  
     Bob’s evidence is discarded. Alice’s posterior (78%) is binding for both parties. Bob receives mandatory rationality retraining.  

  ---

  **FREQUENTLY ASKED QUESTIONS**  

  *Q1: What if I forgot my PIBR? My infant self wasn’t great at Kolmogorov axioms.*  
  > A: File a Retrospective Prior Declaration (Form PIBR-R) with sworn testimony of a default uniform prior. Penalties apply (see § 5-301.1d).  

  *Q2: My neighbor and I saw the same weather report but disagree on flood risk. Isn’t that allowed?*  
  > A: No. Identical signals must yield identical posteriors (Aumann’s Agreement Theorem, R.C.B.S. § 1). Submit disagreement paperwork; BPH will trace the error to one party’s irrational updating.  

  *Q3: What if we *truly* have different evidence?*  
  > A: BPH investigators will reconstruct your information partitions. Disagreement persisting under common knowledge implies one party misreported evidence or violated Bayesian updating. Remember: priors are shared by law; belief divergence *must* reduce to information asymmetry.  

  *Q4: How can BPH prove we didn’t share a prior?*  
  > A: The common prior is unfalsifiable by design (Harsanyi Doctrine, R.C.B.S. Preamble). Stubborn disagreement proves *ex post* that one agent is irrational or misreported. We reconcile beliefs by eliminating the error.  

  *Q5: What if exotic evidence explains our disagreement?*  
  > A: Exotic evidence (e.g., "Bob’s dream warned of floods") requires pre-approval via Form E-9-X. Unfiled evidence is grounds for posterior annulment.  

  ---

  **CONCLUSION**  
  A harmonious society requires aligned beliefs. Report epistemic noncompliance to your local BPH office. Remember: If you disagree, someone is wrong—and it might be you.  

  *"Priors Unite Us."*  
  — BPH Motto  

