answer: |-
  ### Decision Tree for Extracting Truth from Model Predictions  
  **Root Commitment**: We need the truth about whether a patch will break a test suite, and we can't cheaply run the test at decision time.  

  ---

  ### Branch Nodes (Questions for Teammates)  
  1. **White-box access?**  
     *Can we inspect model activations (internal states)?*  
     - **Yes**: Path to probes/interpretability.  
     - **No**: Stick to model outputs or external methods.  

  2. **Ground truth obtainable later?**  
     *Can we run tests eventually to verify answers?*  
     - **Yes** (our setting): Enables supervised training.  
     - **No**: Forces unsupervised/consistency methods (not our case).  

  3. **Training feasible?**  
     *Can we train probes/fine-tune models (time, data, resources)?*  
     - **Yes**: Allows learned extractors.  
     - **No**: Forces zero-shot or untrained methods.  

  4. **Model honesty?**  
     *If the model knew it was being evaluated, might it intentionally mislead?*  
     - **Yes**: Avoid trusting outputs; use verification/debate.  
     - **No/Unclear**: Outputs or activations might be usable.  

  5. **Latent verdict believed?**  
     *Do we think activations encode a "real" answer (vs. just next-token simulation)?*  
     - **Yes**: Pursue internal-state extraction.  
     - **No**: Treat model as black-box generator.  

  6. **Fast deterministic checker?**  
     *Is there a quick tool (e.g., linter, partial test) to verify patches?*  
     - **Yes**: Model can assist retrieval.  
     - **No**: Model must provide final answer.  

  7. **Need real-time?**  
     *Must answer before test results?*  
     - **Yes** (our setting): No deferral.  
     - **No**: Just run tests later.  

  8. **Open-ended answers?**  
     *Do we need explanations (vs. yes/no)?*  
     - **Yes**: Forces prose generation.  
     - **No**: Simplifies to binary extraction.  

  9. **Model more capable?**  
     *Could the model know things humans miss?*  
     - **Yes**: Leverage model insights.  
     - **No**: Humans can verify directly.  

  10. **Cost-sensitive?**  
      *Are we bottlenecked by compute/budget?*  
      - **Yes**: Avoid expensive methods (debate, retraining).  
      - **No**: Can use resource-heavy approaches.  

  ---

  ### Logical Space & Constraints  
  - **Available combinations**:  
    - Ground truth + white-box + training feasible → Supervised probes.  
    - Latent verdict believed + no training → Unsupervised or mechanistic.  
    - No white-box + no fast checker → Output-based methods (prompting, debate).  
    - Fast checker + latent verdict irrelevant → Learned index.  
  - **Empty combinations**:  
    - *Ground truth unobtainable + supervised* → **Incoherent** (no labels).  
    - *No real-time need + must answer now* → **Incoherent** (contradicts root).  
    - *Model dishonest + trust outputs* → **Unattractive** (risky without verification).  
    - *No fast checker + learned index* → **Incoherent** (checker required).  

  ---

  ### Leaves (Approaches)  
  1. **Better Prompting + Verification**  
     - **Build**: Optimize prompts (e.g., chain-of-thought), run tests later to audit accuracy.  
     - **Awkward commitment**: Trusting prose outputs even if activations disagree.  

  2. **Supervised Probes**  
     - **Build**: Train a classifier on activations using test-verified labels.  
     - **Awkward commitment**: Assuming labels teach the probe to extract "truth," not artifacts.  

  3. **Unsupervised Consistency**  
     - **Build**: Force activation consistency across paraphrased questions (no labels).  
     - **Awkward commitment**: Believing consistency implies truth.  

  4. **Debate/Adversarial**  
     - **Build**: Two models argue; human/judge picks the most coherent answer.  
     - **Awkward commitment**: High cost; debates may not converge to truth.  

  5. **Training-Time Truthfulness**  
     - **Build**: Fine-tune with RL or penalties for lies (using test labels).  
     - **Awkward commitment**: Needing retraining; may not prevent deception.  

  6. **Mechanistic Interpretability**  
     - **Build**: Reverse-engineer circuits to read "verdict" from activations.  
     - **Awkward commitment**: Assuming a simple, findable circuit exists.  

  7. **Learned Index (Your Hunch)**  
     - **Build**: Use model to retrieve relevant code/tests; run fast checker.  
     - **Awkward commitment**: Checker must cover critical cases.  

  8. **Skeptic’s Output-Only**  
     - **Build**: Treat model as text generator; verify later. Ignore activations.  
     - **Awkward commitment**: No internal truth to extract—just patterns.  

  **Indistinguishable Leaves**:  
  - *Better Prompting* and *Skeptic’s Output-Only* both use black-box outputs. The tree separates them only if "latent verdict believed = no" (skeptic) vs. "yes" (prompting trusts outputs).  
  - *Learned Index* and *Unsupervised Consistency* both avoid latent-verdict debates but differ in mechanism (index vs. activation constraints).  

  ---

  ### Confidence & Disputes  
  **Genuine Agreements**:  
  - If ground truth exists and training is feasible, supervised probes improve accuracy on known questions.  
  - Better prompting helps with reasoning but doesn’t guarantee truth.  
  - Debate is expensive and not tested at scale for this use case.  

  **Live Disputes**:  
  - **Latent verdict**: Your framing assumes a "fact of the matter" exists in activations. Skeptics (e.g., "next-token" camp) deny this—they argue activations simulate answers, not store truths.  
    - *Tree impact*: Branches split here (node 5).  
  - **Probes on unchecked questions**: A probe performing well on yes/no benchmarks doesn’t prove it extracts truth for *unverifiable* questions. It may latch onto superficial patterns.  
    - *Example*: Unsupervised consistency (e.g., contrastive probing) beats zero-shot by ~3–8% on some datasets and resists adversarial prompts.  
    - *Weight*: Modest evidence that consistency ≠ truth; useful for robustness, not a silver bullet.  
    - *What it doesn’t establish*: Generalization to novel, complex queries (like your test-suite breaks).  

  **Calibration Note**:  
  - The unsupervised result you recall is roughly correct (e.g., "consistent" > "zero-shot" under adversarial settings). It deserves weight as a feasibility demo, but not as proof for your domain.  

  **Key Uncertainty**:  
  - No approach guarantees truth for unchecked questions. Supervised probes work best when test data matches training; elsewhere, it’s heuristic.  
  - Learned index is safest if a checker exists—it sidesteps latent-verdict debates.  

  **Recommendation**:  
  Start with **Learned Index** if a fast checker exists (e.g., static analyzer). Else, run **Supervised Probes** (if training feasible) or **Better Prompting** (if not). Flag disputes in the doc: "We avoid stances on latent verdicts; method X assumes Y."
