  7. **Do we have resources for mechanistic interpretability?** (expert time)
     - Yes: **Leaf G: Mechanistic interpretability**
          - Build: Analyze the model's circuits to find the computation for the answer and read it off.
          - Awkward: Very time-consuming and may not scale; might not find a simple circuit.
     - No: **Leaf D: Unsupervised consistency extractor**
          - Build: Design a method that enforces consistency (e.g., across paraphrases) on activations to extract an answer.
          - Awkward: Consistency does not imply truth; may not work well.

