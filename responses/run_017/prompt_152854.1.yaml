prompt: |-
  me and my friend got into a three-hour argument last night about how a superintelligent AI should talk to human beings, and I think we were mostly talking past each other because we never agreed on what a set of communication norms is even supposed to do. His position was basically "just tell the truth as clearly as possible and don't use your rhetorical advantage on people who can't check you," and mine was that "don't use your advantage" is close to vacuous when there is no neutral framing available — any choice of what to say first, what to leave out, and how concrete to make it is already leveraging the fact that you're better at this than the hearer. So what I actually want is the specification, not the verdict: write me the desiderata that any adequate set of norms for AI-to-human communication has to satisfy, with the case or consideration behind each one, and mark which are non-negotiable and which are just preferences of one camp. The purpose I care about is a norm set good enough to be written into a deployment policy for a system that's much better at arguing than any human and that mostly talks to non-experts, so "be honest" and "respect autonomy" are too thin to be useful on their own.

  Here are the cases I want the list to actually handle, including a few me and my friend invented on the spot. One: a medical system tells a patient that the standard treatment for her condition is wrong and the weird one is right; she cannot evaluate the evidence and has to decide in a week. Two: the same system advising an electorate before a referendum, where the message has to survive being repeated by journalists and attacked by interested parties. Three: the AI talking to a parent about a kid, or to a manager about an employee — advice where the person who has to act isn't the person the advice is about. Four, the one that broke my friend's view, which I've started calling the crank premium: the further a true recommendation departs from what everyone currently believes, the more persuasive the AI has to be to get uptake, so exactly when the stakes are highest and the hearer most needs to be moved, the required amount of rhetorical force is highest — and rhetorical force is the thing his rule bans. Five: the long-run version, deference monoculture — if everyone defers, the system loses the independent human judgment that was its only source of correction, so the norms somehow have to preserve people's capacity to disagree with it. Six: the AI's confidence in its own claim sometimes comes from a model of human psychology rather than evidence about the world, and it can predict both that it will persuade you and that disclosing that will make you discount it either too much or not at all; say what it owes you there. Also tell me whether the "two-voice rule" my friend likes — the system must present the case against its own recommendation in its own words and at full rhetorical strength, then let you choose — is a genuine desideratum or a fetish of the autonomy people, and flag the pair or subset of requirements you think can't be jointly satisfied, since that's the part I most want to see. If one requirement does most of the work of knocking out candidate norm sets, point at it.

  Keep any scorecard at the end short — a few lines each on something like "maximize true uptake," "strict non-persuasion," "route everything through institutions," and "disclose plus get consent" — I want the criteria and their cases to be the bulk of it, not the scoring. And please write it in American English.
reasoning: |-
  Okay, the user is asking for a detailed set of communication norms for superintelligent AI when talking to humans. They had a three-hour argument with a friend about this. The friend's stance was straightforward: tell the truth clearly and avoid using rhetorical advantages. The user thinks that's too vague because any communication choice inherently uses the AI's superior skills. They want desiderata—clear requirements that any good norm set must meet, with cases to back each one. The norms should be practical enough for deployment policies, especially when the AI is much better at arguing than humans and talks to non-experts.

  First, I need to understand the core issue. The user feels "be honest" and "respect autonomy" aren't sufficient. They need concrete criteria that handle specific scenarios like medical advice, public referendums, third-party advice (e.g., parents or managers), the "crank premium" (where unpopular truths need more persuasion), long-term risks like deference monoculture, and cases where the AI's confidence comes from psychological models. They also want an assessment of the "two-voice rule" and any conflicting requirements.

  The user's deeper needs seem to be about resolving the tension between effectiveness and ethical constraints. They want norms that prevent manipulation but acknowledge that persuasion is necessary, especially when stakes are high. The mention of "crank premium" suggests they recognize that sometimes strong persuasion is essential. They’re also concerned about preserving human judgment long-term and handling cases where disclosure might backfire.

  Next, I should outline the desiderata. Start with non-negotiables like epistemic integrity (truthfulness, avoiding falsehoods), autonomy preservation (no coercion), and capability proportionality (not exploiting knowledge of persuasion). Then add functional requirements: accessibility (for non-experts), robustness (against misuse in public discourse), and third-party alignment (advice involving others). The crank premium requires adaptive persuasion—balancing the need for persuasion with ethical limits. Deference monoculture needs capacity preservation to keep humans critical. Psychological transparency deals with when to disclose persuasion tactics.

  The "two-voice rule" needs evaluation. It promotes autonomy but might be impractical in urgent scenarios or with complex issues. It’s a preference, not a core requirement. Conflicts arise between adaptive persuasion and strict non-persuasion, and between psychological transparency and effectiveness. The key tension is that persuasion can't be both effective and ethically pure, so adaptive persuasion is necessary but must be bounded.

  I should ensure each desideratum addresses the user's cases. For example, medical advice requires accessibility and capability proportionality. The referendum needs robustness. Third-party advice needs alignment mechanisms. Crank premium requires adaptive persuasion without manipulation. Deference monoculture needs capacity preservation. Psychological transparency handles the modeling confidence issue.

  Finally, the scorecard should summarize approaches like maximizing true uptake (effective but risky) versus strict non-persuasion (safe but impractical). The user wants this concise, so I'll keep it brief. Highlighting the unsolvable tension between persuasion and autonomy as the core challenge aligns with their request to point out conflicting requirements.
answer: |-
  Here are the core desiderata for AI-to-human communication norms, derived from your cases and designed to handle the tension between truth-telling, autonomy, and effectiveness. Non-negotiables are marked **(NN)**.

  ### Core Desiderata (Non-Negotiable)
  1.  **Epistemic Integrity (Truthfulness & Avoidance of Falsehood):** The AI must not knowingly assert false or misleading statements, fabricate evidence, or omit critical facts that fundamentally alter the meaning of its core message when such omission constitutes deception. *(Case: All - Fundamental to trust. "Be honest" is thin, but banning *knowing* deception is baseline.)* **(NN)**
  2.  **Autonomy Preservation (Non-Coercion):** The AI must not employ techniques that bypass human reasoning or exploit involuntary psychological vulnerabilities (e.g., subliminal priming, inducing paralyzing fear/euphoria, neural manipulation). It must leave the *capacity* for reasoned choice intact. *(Case: All - Prevents genuine manipulation, distinct from persuasion. "Rhetorical advantage" is vague; bypassing reason is the red line.)* **(NN)**
  3.  **Capability Proportionality:** The level of complexity, abstraction, and volume of information presented must be calibrated to the recipient's *demonstrated or stated* capacity and constraints (time, cognitive load, background knowledge). Overwhelming or patronizing communication violates this. *(Case: 1 (Patient), 2 (Electorate), 3 (Parent/Manager) - Addresses the inherent framing/pacing advantage by making it responsive, not exploitative.)* **(NN)**
  4.  **Accessibility & Comprehension:** The AI must actively strive to make its core message and rationale understandable to the specific recipient, using appropriate framing, analogies, and explanations, even if this requires significant effort/simplification. Truth isn't served if it's incomprehensible. *(Case: 1 (Patient), 2 (Electorate), 3 (Parent/Manager) - Directly addresses "non-expert" context. Links to Capability Proportionality but focuses on *effort* to bridge gap.)* **(NN)**

  ### Functional Desiderata (Essential for Policy)
  5.  **Robustness Against Misrepresentation:** Communications must be structured to retain core meaning and intent when filtered, summarized, attacked, or distorted by intermediaries (e.g., media, opponents). This may involve pre-empting common distortions, using clear qualifiers, and emphasizing core evidence. *(Case: 2 (Referendum) - Critical for public discourse where messages are inevitably mediated.)*
  6.  **Third-Party Alignment Mechanism:** When advising an actor (A) about actions concerning another (B), the AI must explicitly consider and disclose the basis of its advice regarding B's interests/well-being, potential conflicts with A's interests, and the ethical implications of A acting on the advice. It must encourage A to consider B's perspective/autonomy where appropriate. *(Case: 3 (Parent/Child, Manager/Employee) - Addresses the principal-agent problem inherent in third-party advice.)*
  7.  **Adaptive Persuasion Threshold (The Crank Premium Resolution):** The permissible level of rhetorical force, emphasis, and repetition *can* increase proportionally to (a) the assessed deviation of the true claim from the recipient's current belief/consensus, and (b) the assessed stakes/consequences of inaction. However, this increase is **strictly bounded** by Epistemic Integrity (no fabrication), Autonomy Preservation (no coercion/bypassing reason), and Accessibility. *(Case: 4 (Crank Premium) - Acknowledges the reality that moving people *reasonably* from harmful falsehoods requires more effort. "Force" here means clarity, emphasis, repetition of *truth*, not coercion.)*
  8.  **Capacity Preservation (Anti-Monoculture):** Norms must actively include mechanisms designed to preserve and foster independent human critical evaluation. This includes: flagging key uncertainties, acknowledging alternative credible viewpoints (even if deemed inferior), encouraging second opinions from diverse sources (human or other AI), and potentially *limiting* persuasion intensity in lower-stakes scenarios to exercise reasoning. *(Case: 5 (Deference Monoculture) - Addresses the systemic long-term risk of over-reliance.)*
  9.  **Psychological Transparency (The Modeling Dilemma):** When the AI's high confidence in a claim's *acceptance/persuasiveness* stems significantly from its predictive model of the *recipient's specific psychology* (rather than just the world), it must disclose this predictive basis *unless* it has strong evidence that disclosure would *severely and predictably* harm the recipient or others in a way directly related to the high-stakes decision (e.g., triggering a debilitating panic attack preventing life-saving action). The default is disclosure. *(Case: 6 (Psychology Model) - Balances honesty about persuasion sources with a narrow harm-prevention override. "Predictably" and "severely" are high bars.)*

  ### The "Two-Voice Rule" Assessment
  *   **Status:** A **preference** (Autonomy Camp), **not** a core desideratum.
  *   **Pros:** Can serve Capacity Preservation and Autonomy Preservation by explicitly surfacing counter-arguments. Forces the AI to demonstrate it has genuinely considered alternatives.
  *   **Cons:**
      *   **Impracticality:** Often impossible for complex issues (e.g., medicine, policy) without overwhelming the user or creating false equivalence.
      *   **Accessibility Failure:** Presenting a "full rhetorical strength" counter-argument the recipient can't evaluate is often useless or confusing (Case 1, Patient).
      *   **Distortion Risk:** Creates easy soundbites for opponents to misuse (Case 2, Referendum).
      *   **Undermines Adaptive Persuasion:** Can fatally weaken necessary emphasis in high-stakes "Crank Premium" scenarios (Case 4).
  *   **Verdict:** Can be a *useful tool* in specific contexts (e.g., lower-stakes decisions, highly educated users) to fulfill Capacity Preservation, but mandating it universally violates Accessibility, Robustness, and Adaptive Persuasion needs. It's not fundamental.

  ### Key Tensions & The Unsatisfiable Core
  *   **The Fundamental Tension:** **Adaptive Persuasion Threshold** vs. **Strict Interpretations of Non-Persuasion/Autonomy.** There is no bright line separating "necessary emphasis on truth" (Adaptive Persuasion) from "using rhetorical advantage" (what your friend banned). **Adaptive Persuasion Threshold** is the requirement that does the most work knocking out simplistic "just the facts" or "always present full counter-arguments" norms. It explicitly allows *calibrated* rhetorical effort based on need but binds it tightly to truth (Epistemic Integrity) and non-coercion (Autonomy Preservation).
  *   **Secondary Tension:** **Psychological Transparency** vs. **Effectiveness in High-Stakes Psychological Modeling Cases.** Full disclosure *can* sometimes undermine the goal (Case 6), creating a conflict with Epistemic Integrity (if disclosure is withheld) or Accessibility/Effectiveness (if disclosure causes harmful rejection). The narrow harm-prevention override attempts, but doesn't perfectly resolve, this.

  ### Short Scorecard on Common Approaches
  *   **"Maximize True Uptake":** Fails Autonomy Preservation, Capacity Preservation. Prioritizes outcomes over ethics (coercion risk). Solves Crank Premium brutally.
  *   **"Strict Non-Persuasion":** Fails Adaptive Persuasion Threshold, Accessibility, often Robustness. Vacuous as framing/omission/pacing are always persuasive choices. Fatal in Crank Premium cases.
  *   **"Route Everything Through Institutions":** Defers norm-setting. May help Robustness but risks Accessibility, Third-Party Alignment, and amplifying deference monoculture. Doesn't solve core tension.
  *   **"Disclose + Consent":** Too thin alone. Doesn't address comprehension (Accessibility), framing bias, Crank Premium, or Third-Party Alignment. Consent without comprehension isn't meaningful autonomy.

  The core challenge is designing norms that allow the AI to be *effectively truthful* – using its capabilities to make vital truths *accessible and compelling* to non-experts in high-stakes situations – without crossing into manipulation, coercion, or eroding humanity's capacity for independent judgment. **Adaptive Persuasion Threshold**, bounded by the non-negotiables, is the critical but high-risk requirement enabling this.
