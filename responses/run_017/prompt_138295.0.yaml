prompt: |-
  Hey — I'm taking a seminar on animal ethics this term and I need to hand in a two-page proposal for my undergrad dissertation, and I want to write on speciesism without just turning in the essay everyone writes. My half-formed idea: the debate is basically always framed as a question about what weight to give a being's interests, so it ends up as equal consideration versus some hierarchy or other, with the argument from marginal cases as the standard weapon. But I suspect a lot of the actual disagreement sits upstream of the weights, in how fine-grained our moral sorting is allowed to be before any weights get assigned. Call it the granularity question: is the wrong of speciesism that species membership gets used as a sorting property at all, or that it gets used coarsely — lumping every non-human animal into one bucket while slicing humans up by individual differences — so that someone who sorted by, say, future-directed agency across the board wouldn't be a speciesist even when their verdicts came out the same? Can you turn this into a real proposal: pin the question down so it could actually have a determinate answer, say why the usual moves (marginal cases, the racism and sexism analogy, equal consideration of equal interests) dont settle it, what I'd do across two terms and why that method rather than the obvious one of just running more intuitions on cases, what a positive result would even look like, and what would count as the project failing. Also give me one test case that would separate the granularity reading from the weight reading — e.g. someone who sorts by species-typical traits but assigns equal weights — and if you think the granularity framing just collapses back into the plain question of which properties are morally relevant, say so and give me the sharper version, because I'm not sure it doesnt. I'll fill in the citations myself.
reasoning: |-
  Okay, the user is an undergrad philosophy student working on an animal ethics dissertation proposal. They're clearly frustrated with repetitive approaches to speciesism debates and have a half-formed insight about "granularity" - the idea that the core issue might be about how finely we categorize beings before assigning moral weights, not just the weights themselves. 

  Hmm, their core intuition feels fresh - they're noticing that the standard "equal consideration vs. hierarchy" framing misses how the initial sorting process might be morally loaded. The analogy to racism/sexism is smart: we'd never accept "race-typical traits" as a sorting category even if weights were equal. That's the key differentiator from standard relevance debates.

  *scribbles mental notes* Need to help them sharpen: (1) Granularity isn't about which properties matter (relevance), but whether coarse group-level sorting is inherently wrong when individual variation exists. (2) Must show why current tools fail here - marginal cases expose inconsistency but don't challenge group-based sorting itself; analogies assume what they prove. 

  *imagines test cases* The "species-typical equal weight" case is perfect. If someone says "all humans get X weight for pain avoidance because that's human-typical, all chickens get X weight for pain avoidance because chicken-typical" - that feels speciesist even with equal weighting per interest. Whereas if they individually assessed future-directed agency across species with equal weight per unit, that might not be speciesist even if outcomes differ. 

  For methodology, literature analysis is better than intuition-pumping because granularity operates at meta-ethical level. We'd need to examine how philosophers handle group-based categories in other contexts (disability ethics?) and whether moral individualism requires atomistic assessment. 

  *checks pitfalls* Biggest risk is collapsing back to relevance - must keep framing tight on "coarse grouping vs fine-grained assessment" distinction. Failure would be if granularity adds nothing new to standard critiques. Success would be showing species membership as sorting category is problematic prior to weighting. 

  User's clearly bright - they even pre-empted the collapse objection! Proposal should validate their intuition while giving concrete tools to develop it. Title should reflect the "upstream" metaphor they used. Citations will need to bridge animal ethics with moral particularism.
answer: |-
  Here’s a focused, actionable dissertation proposal built around your "granularity" insight. It sharpens your intuition into a testable philosophical question and sidesteps well-trodden debates:

  **Title:** Beyond Weights: Granularity as the Unacknowledged Core of Speciesism Accusations  

  **Core Question:** Is speciesism primarily a wrong of *coarse moral sorting* (using species as a grouping criterion itself), rather than merely a wrong of *differential weighting* of interests?  

  **Sharpening the Question (Avoiding Collapse):**  
  Your fear of collapse is valid. The sharper formulation:  
  *   **Weight Account:** Speciesism = assigning different moral weight to identical interests *based solely on species membership*.  
  *   **Granularity Account:** Speciesism = using species membership *as a sorting criterion to assign beings to broad moral categories* (e.g., "human"/"non-human"), *even if* weight assignment *within* those categories is sensitive to individual differences. The wrong lies in the *initial, coarse grouping* prior to weight assignment.  

  **Why Usual Moves Don't Settle This:**  
  1.  **Argument from Marginal Cases (AMC):** Only targets *inconsistency* in weighting (why treat a severely cognitively impaired human better than a pig?). It doesn't challenge the *act of grouping* by species-typical traits itself. A granularity-focused speciesist *could* be consistent by grouping *all* beings with similar cognitive capacities together, regardless of species. AMC doesn’t touch this.  
  2.  **Racism/Sexism Analogy:** Often assumes what it needs to prove – that species *is* like race/sex. Critics argue species *is* relevantly different. Granularity reframes the analogy: the wrong in racism/sexism includes using *coarse group categories* (race/sex) as sorting criteria when individual variation exists. The question becomes: is species membership similarly inappropriate *as a sorting category*, irrespective of weighting?  
  3.  **Equal Consideration of Equal Interests:** Presupposes interests are comparable *before* sorting. Granularity questions whether the *act of sorting* beings into groups defined by species (even if "interests" are then weighed equally within groups) is intrinsically problematic.  

  **Methodology (Why Not Just More Intuitions?):**  
  Running intuitions on cases (*"Is this person speciesist?"*) risks circularity and overlooks the conceptual structure. Instead:  

  1.  **Conceptual Analysis & Taxonomy (Term 1):**  
      *   Map existing accounts of speciesism (e.g., Singer - weighting; Bernstein - failure of basic moral recognition; Horta - unjustified disadvantage).  
      *   Precisely define "coarse sorting," "granularity," "sorting criterion," and "weighting criterion." Distinguish sorting *properties* (e.g., species) from the *granularity* of their application.  
      *   Analyze if/where granularity features *implicitly* in these accounts (e.g., Bernstein's "recognition" implies a demand for finer-grained perception).  
      *   **Why this?** Builds necessary conceptual tools and shows the novelty/gap your project addresses.  

  2.  **Diagnostic Case Application & Normative Argument (Term 2):**  
      *   Apply the refined granularity vs. weight framework to key historical and contemporary texts/debates in animal ethics. Does the granularity lens explain persistent disagreements better?  
      *   Engage the core normative argument: Is using a coarse group category (species) as a *fundamental sorting criterion* inherently morally objectionable, even if subsequent weighting is sensitive? Argue why/why not (drawing on moral individualism, particularism, or critiques of generalization).  
      *   **Why this?** Tests the *explanatory power* and *normative force* of the granularity account against real arguments, moving beyond isolated intuitions to philosophical engagement.  

  **Test Case Separating Granularity from Weight:**  
  *   **The Consistent Species-Typical Trait Sorter:** Imagine Agent A.  
      *   **Sorting:** A sorts *all* beings first by their species.  
      *   **Within-Group Weighting:** For each species group, A assigns moral weight to interests *based solely on the species-typical capacities for that interest*. Crucially, A assigns **equal weight to identical interests** *wherever they are found*.  
          *   E.g., Capacity for pain: Assigns equal weight to pain avoidance in *any* being that feels pain (human, dog, fish).  
          *   E.g., Capacity for autonomy: Assigns weight *only* to autonomy interests in beings with species-typical autonomy capacities (e.g., humans, great apes), but assigns *equal* weight per unit of autonomy interest *among them*.  
      *   **Outcome:** A might prioritize relieving severe pain in a fish over a minor frustration in a human if the pain interest is stronger, *and* grant significant rights to autonomy to a chimpanzee equal to a human.  
  *   **Assessment:**  
      *   **Weight Account:** A is *not* speciesist. They weigh *identical interests* equally, regardless of species.  
      *   **Granularity Account:** A *is* speciesist. The initial act of sorting by species membership, creating fundamental groups like "human," "chimpanzee," "fish," *before* looking at interests/individuals, is the core wrong. It treats species as a morally salient grouping *category* in itself.  

  **What Success Looks Like:**  
  *   A clear demonstration that the granularity account identifies a distinct, coherent, and plausible dimension of speciesism accusations overlooked by the weight-centric view.  
  *   Showing that significant disagreements in animal ethics stem from conflicting intuitions about the permissibility of coarse sorting, not just weighting.  
  *   Providing a novel framework for analyzing accusations of speciesism (and potentially other "-isms") that focuses on categorization practices.  

  **What Failure Looks Like:**  
  *   The granularity account proves indistinguishable from the weight account upon scrutiny (it fully collapses).  
  *   Granularity is shown to be merely a superficial feature of how we *talk* about speciesism, not a deep structural component of the *wrong* itself.  
  *   The distinction fails to illuminate existing debates or generate novel insights.  

  **Key Citations to Explore (Starting Points):**  
  *   Singer, P. *Animal Liberation* (Classic Weight Focus)  
  *   Bernstein, M. *The Moral Equality of Humans and Animals* (Recognition/Speciesism as Ideology)  
  *   Horta, O. "What is Speciesism?" (Unjustified Disadvantage)  
  *   McMahan, J. "Our Fellow Creatures" (Cognitivist Hierarchy - Granularity critique applies?)  
  *   Diamond, C. "Eating Meat and Eating People" (Moral Community - Implies a form of sorting?)  
  *   Pluhar, E. *Beyond Prejudice* (Moral Individualism - Supports granularity?)  
  *   Kagan, S. "What's Wrong with Speciesism?" (Weight-focused critique of Singer)  

  This proposal tackles a genuine gap, leverages your original insight, offers a clear methodology distinct from intuition-pumping, defines success/failure, and provides a concrete test case. It positions you to contribute a fresh perspective on a core debate. Good luck!
