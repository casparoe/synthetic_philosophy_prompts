prompt: |-
  I've gotten weirdly into making my own Bongard problems lately — the ones with six little figures on the left that all obey some rule and six on the right that break it — partly for a puzzle night and partly because I wanted to use them in a first-year reasoning course as a hands-on example of underdetermination (theory by data, all that). But I keep having the same argument with two friends and I don't have the vocabulary to say what's bugging me.

  Friend A says any rule that correctly sorts all twelve figures is a solution, full stop. Friend B says no, there's the rule the problem was built around, and a rule can sort correctly and still be the wrong answer. My first instinct was to file friend B's complaint under the old grue-style worry: some candidate rules are gerrymandered, or obviously reverse-engineered off this exact dozen of figures, or just wouldn't hold up on a new figure, and I get why those feel like cheats. But I've hit cases that don't feel like cheating in that way at all, and I can't tell if it's the same complaint in disguise or a genuinely different one. Here's one: the left box has six figures, each a big closed shape with a smaller shape strictly inside it, not touching the outline anywhere; the right box has the same kind of pairs, but the small shape always pokes through or is tangent to the outline. Two rules both seperate the boxes: "the small shape lies strictly inside, with no contact," and "the small shape's area is under 40% of the big one's" — I drew the right-hand ones with chunkier inner shapes, so the threshold works, and it's not a gerrymander: it's a single continuous feature that would apply fine to a new figure and would survive any grue-ish test I can think of. Still, it's plainly not the answer. The best I can say about why is that the right-hand figures look like someone took a left-hand figure and changed exactly one thing, and the good rule is the one that names the thing that got changed, while my area rule picks up a difference that just happens to be there. Same shape of thing in a second case: left box has a triangle and a circle with the triangle's tip aimed at the circle, right box has the same two shapes with the tip aimed away — and a rule like "the two shapes' centroids are farther apart than the triangle is tall" also sorts them, also isn't arbitrary, also isn't what's being asked.

  So: is there an established concept for this — for the difference between a rule that merely seperates the two classes and a rule that answers the contrast the problem set up, one that's the thing the right-hand figures are near-misses *of*? Related things I've half-heard of and want distinguished rather than just named: the grue/projectibility business (is contrast-insensitivity just a species of non-projectibility, or independent of it?), the linguistic idea of a minimal pair, the thought that a why-question comes with a contrast class or a focus (I remember something roughly like that from a philosophy of science class), and — from an ML friend — "shortcut learning," which doesn't seem right either, since my area rule isn't a spurious correlate that will break on new data, it's a real feature that genuinely tracks the intended class and still misses the point. And note the wrinkle that not every problem of mine has the near-miss structure: sometimes the right-hand figures are just assorted things that lack the property, and there the thing I'm griping about seems to evaporate and collapse back into plain simplicity or naturalness. So if there's no name for it, I'd like you to coin one, define it tightly enough that I can apply it, and tell me where its edges are — including whether it's really a property of the rule, of the pair (rule, problem), or of the person who drew the figures.
reasoning: |-
  Okay, the user is deeply involved in creating Bongard problems and is grappling with a conceptual issue about what constitutes the "correct" rule. They've described a disagreement between two friends: Friend A believes any rule that correctly sorts the twelve figures is valid, while Friend B insists there's an intended rule that captures the essence of the contrast. The user has encountered cases where alternative rules (like area percentage or centroid distance) technically separate the boxes but feel wrong because they miss the intentional near-miss structure of the problems. 

  Hmm, the user's examples are telling. In the first case, the intended rule is about topological containment (strictly inside vs. touching), but they found a geometric correlate (area ratio) that coincidentally works due to how the figures were drawn. Similarly, in the orientation vs. distance example, the alternative rule captures a side effect rather than the deliberate contrast. What's interesting is that these alternatives aren't gerrymandered—they're projectible and would generalize—yet still feel unsatisfying. 

  The user is clearly sophisticated—they reference grue, projectibility, minimal pairs, and ML concepts like shortcut learning. Their frustration stems from lacking precise vocabulary to articulate why these alternative rules are "cheating" in spirit despite being technically correct. They also note this issue arises most sharply when the right-hand figures are near-misses of the left-hand ones, not just random negatives. 

  Digging deeper, their unspoken need seems twofold: (1) a rigorous framework to validate Friend B's intuition (that intended rules are primary), and (2) pedagogical tools to teach students how to reason about underdetermination without dismissing valid-but-unsatisfying solutions. The mention of a first-year course suggests they want to avoid oversimplifying epistemology ("all separating rules are equal") while preventing students from fixating on arbitrary alternatives. 

  Conceptually, this hinges on what makes a rule "explanatory" for a given problem. The examples show that the intended rule often aligns with the problem's *generative history*—e.g., the artist altered one feature (containment → tangency), making that feature salient. Alternative rules, even if robust, ignore this causal narrative. Hence the proposed term *intrinsic contrast*: the minimal feature whose variation defines the classes. 

  But we must distinguish this from simplicity (area ratio is simpler than topology!) or projectibility (both rules are projectible). The difference lies in *why* the rule separates the classes. For area ratio, separation is incidental—a byproduct of how shapes were drawn—whereas containment/tangency is constitutive of the problem's design. 

  Practically, the user might test rules by asking: "If I slightly modified a left-hand figure to break this rule while preserving the intended property, would it still belong on the left?" For containment, making the inner shape tangent *without* changing area would move it right, confirming that containment is intrinsic. But for area ratio, one could draw a shape with 39% area that touches the boundary—it should go right, but the area rule would misplace it. 

  The edges of this concept: It's relational (rule + problem + artist intent), not inherent to the rule alone. It matters most when negatives are near-misses. And it's defeasible—if the artist *intended* area ratio but drew flawed examples, that rule could become intrinsic. 

  For teaching, emphasizing problem *design* could help: "What single change did I make to break the rule?" This centers the generative process, sidestepping philosophical quicksand.
answer: |-
  This is a beautifully sharp dilemma at the intersection of epistemology, concept learning, and problem design. Friend A champions **extensional adequacy** (the rule correctly classifies all given instances), while Friend B insists on **intentional alignment** (the rule captures the *intended conceptual contrast*). Your intuition about "near-misses" is the key. The established concepts you recall touch on it, but don't fully capture it. Here's a breakdown:

  ### The Core Concept: Intrinsic vs. Incidental Contrast
  The difference lies in whether the rule captures the **intrinsic contrast** deliberately designed into the problem or an **incidental correlate** that happens to separate the classes due to specific construction choices.

  1.  **Intrinsic Contrast:** The specific, minimal feature *deliberately varied* by the problem creator to define the boundary between the classes. It answers: "What single conceptual change did I make to transform a 'left' example into a 'right' example?"
  2.  **Incidental Correlate:** A feature that *co-varies* with the intrinsic contrast in this specific set of examples due to *how* the examples were constructed, but is not the fundamental difference the problem aims to highlight. It answers: "What other difference reliably appears *because of how I drew* the examples illustrating the intrinsic contrast?"

  ### Why Your Examples Highlight This
  1.  **Containment vs. Area:**
      *   **Intrinsic Contrast:** Strict topological containment (interior, no touch) vs. breach/tangency.
      *   **Incidental Correlate:** Area ratio <40% (arising because you drew "breaching" shapes chunkier to make the breach visually clear).
      *   **Why Area Fails:** It captures a *consequence* of your drawing choices (making breaching shapes larger), not the *core concept* (containment violation). A shape with 35% area breaching the boundary *should* be on the right, but the area rule would place it on the left. Conversely, a tiny shape barely tangent (area ratio 1%) *should* be on the right, but the containment rule correctly identifies it.
  2.  **Orientation vs. Distance:**
      *   **Intrinsic Contrast:** Direction of triangle tip relative to circle (towards vs. away).
      *   **Incidental Correlate:** Distance between centroids relative to triangle height (arising because pointing the tip away often increases centroid distance).
      *   **Why Distance Fails:** It captures a *geometric side-effect* of the orientation change, not the orientation itself. A triangle pointed away but very close (distance < height) *should* be on the right, but the distance rule would misplace it on the left. A triangle pointed towards but pulled far away (distance > height) *should* be on the left, but the distance rule would misplace it on the right.

  ### Distinguishing from Related Concepts
  *   **Grue / Projectibility:** Concerns whether a rule is *arbitrary and time-dependent* (grue) or *lawlike and generalizable* (green). Both your rules (containment, area, orientation, distance) are projectible – they could apply to new instances. The issue isn't projectibility, but *which projectible rule captures the intended contrast*.
  *   **Minimal Pair:** A linguistic concept where two items differ by exactly one phonemic feature. This is *highly analogous*! Your problem designs often create minimal pairs (especially for the "near-miss" cases). The "intrinsic contrast rule" identifies the minimal differentiating feature. Incidental correlates are features that *also* differ, but aren't the minimal *defining* difference.
  *   **Contrast Class / Focus (Why-Questions):** This is very close. The "why-question" implied by a Bongard problem is: "Why are these (left) figures *in* and these (right) figures *out*?" The intended rule provides the answer by identifying the *relevant property* (the focus) whose presence/absence defines membership relative to the contrast class (the other figures). Incidental correlates provide a different, less relevant focus.
  *   **Shortcut Learning (ML):** Involves models latching onto superficial, brittle correlations in the *training data* that don't reflect the underlying concept and fail on *out-of-distribution* data. Your incidental correlates *are* "shortcuts" **relative to the intended concept**, but crucially, they might *not* be brittle in the real world (e.g., area ratio *could* be a valid rule for a different problem!). The "distribution" they fail on is the *set of valid instances illustrating the intended concept*, not necessarily the entire world of shapes.
  *   **Gerrymandering / Reverse-Engineering:** Creating rules *explicitly* tailored *only* to the 12 given figures. Your incidental correlates are *not* gerrymandered. They are simple, projectible rules that latch onto a *real but unintended* difference arising from the *specific instantiation*.

  ### Defining the Concept: Intrinsic Contrast Sensitivity
  **Term:** **Intrinsic Contrast Sensitivity** (ICS)

  **Definition:** A rule exhibits **Intrinsic Contrast Sensitivity** for a specific Bongard problem if and only if the property it identifies **directly corresponds to the minimal conceptual feature deliberately varied by the problem creator to distinguish the two classes**, rather than relying on incidental features that co-vary with this intrinsic contrast due to the specific examples chosen or drawn.

  **Key Properties of ICS:**

  1.  **Relational:** It's not a property of the rule *alone*, nor the problem *alone*, but of the **rule-problem-intent triad**. A rule can be ICS for one problem but not another.
  2.  **Minimality:** It captures the most fundamental, indivisible change intended to flip class membership. (e.g., "touching/not touching boundary" vs. "area ratio < X%").
  3.  **Robust to Perturbation:** If you modify an example to *preserve the intrinsic contrast* but *break the incidental correlate*, the rule should *still* classify it correctly. Conversely, if you modify an example to *break the intrinsic contrast* while *preserving the incidental correlate*, the rule should *change* its classification.
      *   *(Containment Example: Take a left figure. Make the inner shape very large but still *strictly inside* (area ratio >40%, preserving intrinsic contrast). ICS rule (containment) keeps it left; Incidental rule (area) wrongly moves it right. Take a left figure. Make the inner shape barely touch (breaking intrinsic contrast) but keep it tiny (area ratio <40%, preserving incidental correlate). ICS rule moves it right; Incidental rule wrongly keeps it left.)*
  4.  **Reveals the "Near-Miss":** For problems with near-miss negatives, the ICS rule clearly explains *why* the right-hand figures are *almost* left-hand figures – they fail *exactly* on the intrinsic contrast feature.
  5.  **Context-Dependent:** Evaporates when negatives aren't near-misses. If the right-hand box contains truly "assorted things that lack the property" (e.g., no shapes at all, wildly different shapes), then any rule separating them based on the presence of the core property *is* ICS, and simplicity/naturalness becomes the primary differentiator between valid rules. The presence of deliberate near-misses *creates* the ICS demand.

  ### Why "Intrinsic Contrast Sensitivity" Fits
  *   **Intrinsic:** Refers to the core, defining feature built into the problem's purpose by the creator.
  *   **Contrast:** Highlights the deliberate opposition between the two classes.
  *   **Sensitivity:** Emphasizes that the rule must be attuned to *this specific* contrast, not just *any* difference.

  ### Practical Application & Edges
  *   **To Identify ICS:** Ask yourself: "What is the *one thing* I changed when I designed the right-hand figures to make them different from the left-hand figures?" The rule naming that "one thing" is likely ICS.
  *   **To Test ICS:** Apply the **Robust to Perturbation** test above. Can you easily create a counterexample that breaks the incidental correlate without breaking the intrinsic contrast (or vice-versa), causing the rule to misclassify?
  *   **Edge Cases:**
      *   **Creator Ambiguity:** If the creator didn't have a single clear intrinsic contrast in mind, ICS becomes fuzzy. The best rule might be the simplest projectible one.
      *   **Multiple Valid Intrinsic Contrasts:** Could a problem be designed where two different minimal contrasts *both* seem intrinsic? (e.g., "Shape has an acute angle" vs. "Shape has a vertex count > 3" for triangles vs. squares). This highlights that ICS depends on the *creator's framing*. Pedagogically, this is excellent for discussing underdetermination!
      *   **"Just Assorted Negatives":** As you noted, ICS fades. The problem reduces to finding *any* valid, preferably simple/natural, rule separating positives from diverse negatives. Extensional adequacy + projectibility + simplicity rule here.
      *   **The Solver's Perspective:** While ultimately about creator intent, a "good" Bongard problem *communicates* its intrinsic contrast clearly through the visual design of the near-misses. A solver perceives ICS by recognizing the deliberate minimal variation.

  ### Conclusion
  Your frustration stems from perfectly valid rules that miss the *point* of the specific problem you designed. "Intrinsic Contrast Sensitivity" (ICS) captures why Friend B is right in the context of problems built around deliberate near-misses. It's the distinction between the rule that names *the feature you deliberately broke* and a rule that names *a feature that broke as a side-effect* of how you illustrated that break. It's relational, tied to creator intent and near-miss design, and testable via perturbation. When negatives aren't near-misses, ICS dissolves, and Friend A's extensional adequacy, combined with projectibility and simplicity, becomes the primary guide. This framework gives you the vocabulary to dissect your puzzles and teach students about the interplay between data, concept, and intent in reasoning.
