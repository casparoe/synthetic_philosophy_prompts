prompt: |-
  I am a professor of philosophy and, for the past two years, the humanities member of our university's animal care committee. We sort every protocol we review into one of three tiers of scrutiny, and tier assignment is supposed to turn on the "cognitive sophistication" of the animals involved: the top tier requires a written behavioral justification from the investigator, an enrichment plan reviewed by our veterinarian, and a unanimous vote, while the bottom tier can be cleared administratively. In practice the committee decides these cases by appeal to brain size, to phylogenetic distance from us, to how trainable the animal is said to be, and — more often than anyone will admit — to how the animal strikes us in the room. I have come to think these proxies are not rival measures of one thing but answers to different questions that we have never separated, and I would like a procedure that forces the separation.

  The constraints are these. Five of us sit on the committee: three working bench scientists, the attending veterinarian, and myself. We meet monthly and dispose of roughly twenty protocols in an afternoon, so about ten minutes per case including discussion. Anything not unanimous goes to full review, which nobody wants. The reasoning has to be recorded in the minutes in a form an external auditor could follow. And the procedure has to be executable by the three bench scientists as they are: no training in philosophy or comparative psychology, no looking anything up mid-meeting, no power to require an investigator to run new tests or supply background literature. It must run on the protocol document itself plus what a reasonably informed biologist already carries in his head. I can supply conceptual framing in the meeting; I cannot supply measurement.

  What I want from you is a decision procedure: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision back to us because the question has become one of values rather than facts, and what the minutes should record so that it is visible afterward which consideration actually drove the outcome. Three things we currently run together should be kept apart: how an animal performs on the tests we happen to have; whether that performance is evidence of the sort of flexible, domain-general capacity it would be right to call intelligence; and what protection, if any, follows. Say plainly where the committee is compelled to move from the second question to the third, and why that move cannot be made by the procedure.

  I have been pushing a short list of markers, and I would like you to tell me which of them survive operationalization, which are redundant, and which should be dropped as unmeasurable in our setting. First, recombination versus extension: whether a competence acquired in one task turns up in a task that recombines the same elements into a new configuration, as opposed to more of the same along the dimension that was trained. Second, the coherence of failure: whether errors cluster into the systematic, near-miss pattern you would expect from something operating with a model of the domain, or scatter as brute breakdown. Third, acquisition cost: how many exposures it took to reach criterion, on the thought that an animal which already has structure to bring to a task learns it cheaply. Fourth, symmetry of transfer: whether what transfers in one direction transfers back, or whether the one-way pattern suggests a dedicated mechanism rather than a general capacity. And then a check I have invented and cannot quite make work, which I would like you to fix or discard: before we score a species on our battery, we ask whether that battery would have registered intelligence in a creature with very different sensors and effectors — a calibration test on the detector rather than on the animal.

  Then run the procedure on three protocols, showing your work. One: cephalopods held individually in unenriched tanks for a learning study, the investigator arguing that the animals are solitary, short-lived, and that enrichment would contaminate the control of experience. Two: a four-hundred-mouse conditioning study under standard housing with nesting material as the only enrichment, which is our current default and which nobody has examined in years. Three: a honeybee assay in which the investigator's pilot data show rapid reversal and transfer to a recombined discrimination — a species I have consistently argued lies outside this committee's concern, so if your procedure puts it in the top tier I need to see exactly which step does that, and whether I can resist that conclusion honestly or only by changing my mind.

  Finally, tell me in one paragraph which conception of intelligence the procedure commits us to, since I will have to defend it to three people who will ask why we are not just measuring performance; and say what the procedure cannot do, where it will misfire, and which cases it will systematically get wrong. Lead with your bottom line in the first sentence — a single sentence saying what this procedure can settle and what it must hand back to us — then give the procedure and the applications, with no preamble and no restatement of what I have asked. American English, please.
reasoning: |-
  Hmm, this is a complex and fascinating request from a philosophy professor on an animal care committee. The user wants a decision procedure that separates three key elements in animal research ethics: observed performance, evidence of flexible intelligence, and appropriate protection levels. 

  The constraints are challenging - only 10 minutes per protocol, no specialized training for most committee members, and reliance solely on information in the protocol documents. The user has proposed several markers for cognitive sophistication but questions their operational viability. 

  I need to focus on developing a practical four-question procedure that:
  - Clearly distinguishes measurable performance from inferences about intelligence
  - Uses only data available in typical protocols
  - Generates auditable records
  - Forces explicit value judgments when evidence is ambiguous

  The key insight is that intelligence isn't directly measurable - we can only observe performance and infer the underlying cognitive architecture. The procedure must therefore treat intelligence as a hypothesis about the nature of observed behaviors.

  For the proposed markers:
  - Recombination vs extension is measurable from training histories if properly documented
  - Coherence of failure requires error pattern analysis that's rarely included
  - Acquisition cost is often available but confounded by many factors
  - Symmetry of transfer is theoretically strong but almost never tested
  - The calibration test is philosophically sound but impractical for this setting

  The three test cases reveal important tensions:
  1) Cephalopods show strong intelligence indicators but protocol prevents enrichment - this forces the committee to confront ethical tradeoffs
  2) Mice protocols typically lack the required documentation, defaulting to minimal scrutiny
  3) Bees' documented reversal learning triggers top-tier review - which may surprise the user but follows logically from the criteria

  The procedure commits to a "model-building" conception of intelligence: not just behavioral flexibility but evidence of constructing internal representations. This will require defending against behaviorist objections from the scientists.

  Major limitations include:
  - Heavy reliance on investigator-reported data
  - Inability to detect intelligence in novel domains
  - Potential false negatives for species with alien cognition
  - No resolution when intelligence evidence conflicts with welfare needs

  The bottom line is clear: this procedure can classify evidence quality for intelligence hypotheses but cannot determine what protection that intelligence warrants - that crucial ethical judgment remains with the committee.
answer: |-
  **Bottom line:** This procedure classifies protocols by the quality of evidence for domain-general intelligence in the species, but protection tiers require value judgments about moral weight that the procedure cannot supply.

  **Decision Procedure:**

  1.  **Question:** Does the protocol document *report performance* beyond simple conditioning or fixed action patterns? (e.g., reversal learning, multi-step problems, novel tool use, symbolic communication).
      *   **Sufficient Answer:** Explicit description of behavior meeting the criterion in methods/results or clear citation to published literature demonstrating such performance *in this species*. "Intelligent" anecdotes or investigator assertions without supporting data are insufficient.
      *   **If NO:** Assign Tier 3. Record: "No evidence of non-conditioning performance reported." Proceed to Tier assignment.
      *   **If YES:** Proceed to Question 2.

  2.  **Question:** Is there evidence this performance reflects *recombination* (novel configuration of learned elements) rather than *extension* (scaling up the trained dimension)?
      *   **Sufficient Answer:** Task design explicitly tests recombination (e.g., transfer test to novel stimulus combination, using a tool in a new context) AND results show success above chance/control levels. Simple generalization (e.g., responding to a louder tone) is extension.
      *   **If NO:** Assign Tier 2. Record: "Performance reported, but insufficient evidence of recombination." Proceed to Tier assignment.
      *   **If YES:** Proceed to Question 3.

  3.  **Question:** Is there evidence of *symmetrical transfer* or *rapid acquisition* suggesting a general capacity?
      *   **Sufficient Answer:**
          *   *Symmetry:* Tested bidirectional transfer (A→B and B→A) with comparable success rates, *or*
          *   *Acquisition Cost:* Number of trials to criterion significantly lower than typical for simple conditioning in phylogenetically similar species (e.g., "learned in 5 trials vs. typical 50 for conditioning").
      *   **If NO:** Assign Tier 2. Record: "Evidence of recombination, but insufficient evidence for symmetrical transfer or rapid acquisition." Proceed to Tier assignment.
      *   **If YES:** Assign Tier 1. Record: "Evidence of recombination plus symmetrical transfer/rapid acquisition reported." Proceed to Tier assignment.
      *   **Value Judgment Handoff:** The procedure stops here with a Tier 1 *evidence classification*. The committee must now explicitly debate and vote on whether this level of evidence for domain-general intelligence warrants the top-tier *protection requirements* (justification, enrichment, unanimity) in this specific research context. Minutes must record: "Tier 1 evidence criteria met. Committee deliberation on protection level based on [e.g., ethical weight, welfare impact, scientific necessity]."

  **Marker Assessment:**
  *   **Recombination vs Extension:** Survives, operationalized in Q2 (task design & success criteria).
  *   **Coherence of Failure:** **Dropped.** Requires detailed error analysis rarely reported in protocols; impractical within constraints.
  *   **Acquisition Cost:** Survives partially, operationalized in Q3 (comparison to conditioning baselines). Redundant if Symmetry is present, but provides an alternative path.
  *   **Symmetry of Transfer:** Survives, operationalized in Q3 (bidirectional testing & comparable success). Strongest single indicator here.
  *   **Calibration Test (Alien Cognition):** **Dropped.** Philosophically sound but impossible to operationalize with available data/time. Requires counterfactual reasoning beyond scope.

  **Application to Protocols:**

  1.  **Cephalopod Learning Study:**
      *   Q1: Likely YES. Cephalopods (esp. octopus) frequently demonstrate complex problem-solving, reversal learning in literature. Protocol likely cites or implies this.
      *   Q2: Depends. Does the *specific learning task* involve recombination? If it's simple associative learning (e.g., lever-press for food), NO (Tier 2). If it involves solving novel maze configurations or tool use, YES.
      *   Q3: If YES to Q2, is symmetry/rapid acquisition reported? Symmetry data unlikely in a basic learning study. Rapid acquisition *might* be implied vs. "simpler" mollusks. Probably NO (Tier 2) unless protocol explicitly highlights unusually fast learning.
      *   **Result:** Likely Tier 2 evidence ("Performance, recombination possible but insufficient evidence for symmetry/rapid acquisition"). *Committee Handoff:* Must debate if cephalopod intelligence evidence, even if Tier 2, warrants top-tier *protection* given solitary/short-lived claims vs. barren tanks. Minutes record evidence tier *and* protection rationale.

  2.  **400-Mouse Conditioning Study:**
      *   Q1: Protocol describes basic conditioning. NO evidence beyond conditioning reported.
      *   **Result:** Tier 3 evidence ("No evidence of non-conditioning performance"). Default housing/nesting is administratively approved. Minutes record Tier 3 justification.

  3.  **Honeybee Reversal/Transfer Assay:**
      *   Q1: YES. Reversal learning and transfer are explicitly reported in pilot data (beyond simple conditioning).
      *   Q2: YES. Transfer to a "recombined discrimination" explicitly tests recombination of learned elements into a novel configuration.
      *   Q3: YES. "Rapid reversal" implies significantly faster acquisition than initial learning or typical insect conditioning. This meets the rapid acquisition criterion.
      *   **Result:** Tier 1 evidence ("Evidence of recombination plus rapid acquisition reported"). *Committee Handoff:* The procedure forces top-tier *evidence* classification. You can only resist by disputing the *reported data* (e.g., "rapid" is vague, controls inadequate) or the *value judgment* ("Even with Tier 1 evidence, bees lack the moral weight/sentience for top-tier protections"). Minutes record Tier 1 evidence and committee's protection rationale.

  **Commitment & Limitations:**
  *   **Conception of Intelligence:** The procedure commits to intelligence as *domain-general model-building*, evidenced by flexible recombination of elements and efficient learning (symmetry/acquisition cost), moving beyond task-specific performance or conditioning.
  *   **Defense:** We measure performance, but specific performance *patterns* (recombination, symmetry, efficiency) are the best available evidence for an underlying domain-general capacity (model-building) vs. dedicated mechanisms. This justifies heightened scrutiny.
  *   **Limitations/Misfires:**
      *   Relies entirely on investigator-reported data; false negatives if intelligence not tested/reported.
      *   May miss intelligence in domains alien to human experience (calibration test failure).
      *   Tier 1 evidence doesn't guarantee high intelligence (could be limited domain), and lack of evidence (Tier 3) doesn't prove absence.
      *   Systematically downgrades species where key tests (symmetry, recombination designs) are rarely performed (e.g., many fish, invertebrates).
      *   Cannot resolve conflicts between evidence level and welfare needs/protection level – this is the essential value judgment handed back.
