  We are going to break down Harsanyi's aggregation theorem in the terms of machine learning, particularly focusing on losses, gradients, and training distributions.

  ## Core Setup

  - We have a set of individuals (or "users", or "tasks") each with their own utility function (which we can think of as a negative loss, so higher utility is better). Let's denote individual i's utility for outcome x as U_i(x). In ML terms, we might think of U_i(x) as the negative loss for user i on the model output x: U_i(x) = -L_i(x).

  - Society (or the aggregator) has a utility function U_soc(x).

  - The expected-utility axioms (which are essentially the von Neumann-Morgenstern axioms) are satisfied for each individual and for society. This implies that the utility functions are linear in probabilities (i.e., they are affine functions over lotteries).

  - Unanimity condition: If every individual weakly prefers outcome x to y (i.e., U_i(x) >= U_i(y) for all i) and at least one individual strictly prefers x (U_j(x) > U_j(y) for some j), then society strictly prefers x to y (U_soc(x) > U_soc(y)).

  The theorem says that under these conditions, the social utility function must be a weighted sum of the individual utility functions:

      U_soc(x) = ∑_i w_i U_i(x)

  for some positive weights w_i (with at least one w_j > 0 for the strict preference individual).

  ## Translation to ML Vocabulary

  1. **Per-task losses with arbitrary units**: Each individual's utility U_i is like a loss function L_i but with a sign flip and arbitrary scale. We can write L_i(x) = -a_i * U_i(x) + b_i for some a_i>0 and b_i (affine transformation). However, note that the theorem requires that the utility functions are defined up to positive affine transformations (so the scale and shift are arbitrary for each individual). In ML, we often have loss functions that are defined up to a constant and scaling (e.g., we can scale a loss by a positive constant without changing the optimization problem, and we can add a constant). But note: in the theorem, the social utility function must be a weighted sum of the individual utilities, which are each only defined up to their own affine transformations. This is the core of the commensurability issue.

