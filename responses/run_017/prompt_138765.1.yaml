resentation of the social utility function as a weighted sum of the individual utilities. It does not say that every point on the Pareto frontier is achievable by some weight vector in a fixed representation, but note that we are allowed to choose the representation of the individual utilities (each up to a positive affine transformation). This is the key: we can rescale each individual's utility arbitrarily. So if we fix the individual utilities appropriately, then the entire Pareto frontier (in the space of expected utilities) can be captured by linear scalarization with nonnegative weights.

      But note: the theorem does not require the weights to be nonnegative? Actually, the unanimity condition forces the weights to be nonnegative (and at least one positive). If a weight were negative, then increasing that individual's utility would decrease the social utility, which could violate unanimity.

      However, in the setting of the theorem, because we are in a convex space (of lotteries) and the Pareto frontier is convex, linear scalarization with nonnegative weights can indeed capture every Pareto optimal point.

  4. **Gradient-magnitude weighting**: In ML, when we combine multiple losses by a weighted sum, the relative scale of the losses matters. The weights in the linear scalarization are effectively trading off the gradients of the losses. If one loss has a larger gradient magnitude, then even with the same weight, it would dominate the update. Therefore, the choice of weights is intertwined with the choice of units (scales) of the individual losses. The theorem does not tell us how to set the weights; it only says that there exists a set of weights and a set of scales (for the individual utilities) such that the social utility is the weighted sum. In practice, we have to choose the scales (or equivalently, the weights) and this choice is not determined by the theorem.

  5. **Distribution over datapoints or users as the thing you average over**: The theorem is stated for a fixed set of individuals. In ML, we often have a distribution over users (or tasks, or datapoints). The social utility function can be seen as an expectation over this distribution. Specifically, if we have a distribution p(i) over individuals, then we can set w_i = p(i) and then the social utility becomes the expected utility: U_soc(x) = E_i[U_i(x)]. But note: the theorem does not require the weights to be a probability distribution (they can be arbitrary positive numbers). However, we can always normalize the weights to sum to 1 (by scaling the social utility, which is allowed because it is defined up to affine transformations). So the social utility can be interpreted as a weighted average of the individual utilities.

  6. **The optimizer vs. whoever writes the objective**: In the theorem, the social utility function is taken as given (it satisfies the axioms). The theorem then tells us that it must be a weighted sum. In ML, the optimizer (the training algorithm) is given a scalar loss function that is a weighted sum of individual losses. The person who sets the weights (and the scales of the losses) is effectively choosing the social welfare function. The theorem does not tell us how to choose the weights; it only says that if the social preferences satisfy the axioms and unanimity, then there must be some set of weights that does the job.

  ## Residue Report

  ### (i) Units and Interpersonal Comparability

  In your setting, each loss is defined only up to a positive affine transformation (scale and shift). This is exactly the same as the problem of interpersonal comparability of utility in philosophy. The theorem requires that we fix the scales of the individual utilities (and the weights) to get the social utility. But note: the social utility function itself is also only defined up to a positive affine transformation. So the weights and the scales of the individual utilities are interdependent. For example, if we rescale one individual's utility by a factor of 2, then we can compensate by halving their weight. However, the theorem does not tell us how to set the relative scales. In ML, we choose the units (scales) of each loss arbitrarily (e.g., by choosing the loss function for a task). Then the weights become a way to trade off the relative importance. But the choice of the loss function (e.g., using MSE vs. MAE) for a task already sets the scale. The theorem does not resolve the issue of how to set the scales; it just says that once we fix the scales for the individual utilities, there must be weights that make the social utility a weighted sum. But without a common scale, the weights are arbitrary.

  So your point is correct: the weights are not uniquely determined by the preferences because we can rescale the individual utilities arbitrarily. The weights and the scales are chosen together. In that sense, the weights are a convention for fixing the units. This is exactly the interpersonal comparability problem.

  ### (ii) Complete Ranking vs. Pareto Frontier

  The theorem returns a complete ranking of all outcomes (and lotteries) via the social utility function. In ML, we often focus on the Pareto frontier: the set of points that are not dominated by any other point. The theorem says that the entire ranking is determined by a linear scalarization. This implies that the Pareto frontier (with respect to the individual utilities) is exactly the set of points that maximize the weighted sum for some set of weights? Actually, no: the theorem gives one fixed set of weights that works for all outcomes. Therefore, the social utility function defines one particular point on the Pareto frontier (the one that maximizes that weighted sum) as the best. But the theorem does not say that we can recover the entire Pareto frontier by varying the weights. However, note that the theorem applies to the entire preference relation. The social utility function must rank all outcomes (and lotteries) and that ranking must be consistent with the weighted sum. This implies that the set of outcomes is totally ordered by the weighted sum. Therefore, for a fixed set of weights, we have a complete ordering. The Pareto frontier is a subset of outcomes (the undominated ones). The theorem does not say that every Pareto optimal point is the top choice for some set of weights (in the same representation). However, because we are in a convex space (by considering lotteries), the set of achievable expected utility vectors is convex, and by the expected utility axioms, the social utility must be linear in the probabilities. Therefore, the social utility function must be linear in the individual utilities. And with the unanimity condition, the weights must be nonnegative. Then, by the properties of convex sets, every Pareto optimal point (in the space of expected utilities) can be achieved by maximizing a linear scalarization with nonnegative weights. But note: the theorem fixes the weights for the entire ranking. So if we want a complete ranking that is consistent with the Pareto principle (and the other axioms), it must be by one fixed set of weights. However, if we are only interested in the Pareto frontier (and not the entire ranking), then we can use different weights for different points? But the theorem is about a complete ranking.

  In ML, we often don't care about the complete ranking of every possible model; we just care about the Pareto optimal models. The theorem doesn't directly address the Pareto frontier: it tells us that the entire ranking (including non-optimal points) is determined by a linear scalarization. But when we are on the Pareto frontier, we still have a complete ordering by the social utility? Actually, the theorem does not prevent us from having multiple Pareto optimal points that are indifferent according to the social utility? But if two points are on the Pareto frontier and are not comparable by the individual utilities (i.e., one is better for some and worse for others) then the social utility must break the tie. The linear scalarization will break the tie in a particular way. However, note that if two points are on the Pareto frontier and have the same weighted sum, then they are indifferent. But they might be different points in the outcome space. The theorem does not say that the entire Pareto frontier is collapsed to one point; it just orders it by the weighted sum.

  In your job, when you work on the Pareto frontier, you are effectively considering a set of models that are not dominated. The theorem's linear scalarization gives one way to choose a point on that frontier. But the theorem doesn't tell you which point to choose. It only says that if you want a complete ranking that satisfies the axioms and unanimity, then it must be a linear scalarization. So if you are only interested in the frontier, then the theorem is still relevant because it tells you that the complete ranking (which includes the frontier) is determined by a linear scalarization. But note: without the complete ranking, you might not need the linear scalarization? The theorem requires the complete ranking to exist and satisfy the axioms. If you are only interested in the frontier, you might not specify a complete ranking. However, the Pareto frontier itself is defined by the individual utilities and does not require a complete social ranking. So the part of your job that focuses on the frontier is not directly addressed by the theorem. But if you want to choose one point on the frontier, then you are effectively specifying a complete ranking (where that point is the best, and every other point is worse or equal). Then the theorem applies: that ranking must be representable by a linear scalarization. But note: the theorem requires the ranking to satisfy the expected utility axioms (over lotteries). If you are only ranking deterministic outcomes, then the theorem might not force a linear scalarization? Actually, the vNM axioms are about preferences over lotteries. The theorem requires that the social preferences over lotteries satisfy the axioms. If we are only concerned with deterministic outcomes, then we might not need the linearity. But the theorem extends the ranking to lotteries and requires linearity there.

  In summary: the theorem forces a linear scalarization for the entire ranking (including lotteries). If your application does not involve lotteries (i.e., probabilistic mixtures of outcomes) and you don't require the social preferences to satisfy the vNM axioms for such mixtures, then the theorem might not apply. However, in ML, we often do consider stochastic models (e.g., stochastic policies) and we care about expected loss. So the vNM setting is relevant.

  ### (iii) Commensurability and Legitimacy

  You claim that your losses are already commensurable because they are all "in gradient steps". This means that you are implicitly using the scale of the gradients to set the units. However, note that the gradient magnitude depends on the current model parameters. So the scale of the gradients for each loss can change during training. This is why in practice we often use adaptive methods (like Adam) or carefully tune the weights. Moreover, the choice of loss function (e.g., cross-entropy vs. hinge loss) for a task sets the scale arbitrarily. So your claim that they are commensurable because they are in gradient steps is not entirely accurate: the gradient step for one loss might be much larger than for another, and this can change over time. Therefore, you are still making an arbitrary choice of units for each loss. The weights you choose (or the adaptive method) are effectively setting the trade-off.

  Regarding legitimacy: the theorem assumes that the social preferences (which in your case is the scalar loss) satisfy the expected utility axioms and unanimity. In your setting, the stakeholders (the individuals) do not get a vote on how you combine the losses. The theorem does not require the stakeholders to agree on the weights; it only requires that if they unanimously prefer x to y, then the social loss must be lower for x. However, if you set the weights arbitrarily, you might violate unanimity. For example, if you set a negative weight for one individual, then even if that individual prefers x to y and everyone else is indifferent, the social loss might go up. But the unanimity condition requires that if everyone weakly prefers x and at least one strictly prefers, then society strictly prefers x. This forces your weights to be nonnegative (and at least one positive). But nonnegative weights are not sufficient: if the weights are zero for some individuals, then their preferences are ignored. The theorem does not force you to give positive weight to everyone; it only requires that the weights are nonnegative and at least one is positive. So you could ignore some individuals.

  Your claim that nothing like the legitimacy question arises might be too quick. The theorem tells us that the only way to satisfy the axioms (which include the vNM axioms and unanimity) is to have a weighted sum with nonnegative weights. If you set the weights arbitrarily without regard to the unanimity condition, then you might violate it. Therefore, to satisfy unanimity (which seems a minimal fairness condition) you must use nonnegative weights and not ignore everyone. But the theorem does not tell you how to set the weights beyond that.

  ## Mathematics vs. Controversy

  ### Mathematics
  The mathematical core is a representation theorem: under the vNM axioms for each individual and for society, plus the Pareto condition (unanimity), there exists a set of positive weights (not all zero) and representations of the individual utilities (each up to positive affine transformations) such that the social utility is the weighted sum. The proof uses the fact that the set of individual utility vectors forms a linear space, and the social utility must be a linear functional on that space that respects the Pareto ordering.

  ### Controversy

  1. **Unanimity condition**: It seems innocent, but note that it is a very strong condition when combined with the vNM axioms. It requires that society's preferences must be strictly increasing in each individual's utility (at least in the weak sense of nonnegative weights). However, some philosophers argue that it ignores issues of fairness. For example, consider a situation where one individual gains a lot and another loses a little. Unanimity doesn't apply because not everyone gains. But the weighted sum would approve if the gain outweighs the loss. Some argue that we should sometimes prefer a more equal distribution even if the total is lower. The theorem does not allow for such preferences because they would violate the linearity (or the independence axiom) of expected utility.

  2. **Argument for utilitarianism**: The theorem is often cited as an argument for utilitarianism (which is the sum of utilities). However, note that the weights can be unequal. So it is a form of weighted utilitarianism. The theorem does not require equal weights. Moreover, the issue of interpersonal comparability remains: without a common scale, the weights are arbitrary. Some philosophers (like Rawls) reject utilitarianism in favor of maximin or other criteria that are not linear.

  3. **The role of lotteries**: The theorem requires that preferences over lotteries are well-behaved (satisfy the vNM axioms). This is a strong requirement. In real life, people might not satisfy the vNM axioms (e.g., due to risk aversion that is not linear in probabilities). Moreover, society might not be expected to satisfy these axioms.

  ## Summary of Your Claims

  - (i) Yes, the weights and the units are interdependent and arbitrary without further normalization. This is the same as the interpersonal comparability problem.
  - (ii) The theorem forces a complete ranking by a linear scalarization, which determines one point on the Pareto frontier as the best. Your focus on the frontier is not directly addressed, but if you want a complete ranking (especially one that respects the vNM axioms for lotteries) then the theorem says it must be linear. If you don't require a complete ranking over lotteries, then the theorem might not apply. However, in ML we often do care about expected loss (which is a lottery) so the theorem is relevant.
  - (iii) Your claim that losses are commensurable in gradient steps is not entirely accurate because the gradient magnitude is state-dependent and the choice of loss function is arbitrary. Moreover, the legitimacy question does arise: if you set weights arbitrarily, you might violate unanimity (which is a minimal fairness condition). Therefore, you should at least ensure that your weights are nonnegative and not all zero.

  ## Final Note

  The theorem is a mathematical result that tells us the form that the social utility function must take under the axioms. The controversy is about whether the axioms (especially the vNM axioms and the unanimity condition) are reasonable for social choice, and whether the resulting weighted utilitarianism is acceptable. In ML, we often use linear scalarization for practical reasons, and we set the weights by convention or by tuning. The theorem does not tell us how to set the weights, but it does force us to use nonnegative weights if we want to respect unanimity.
answer: |-
  ### Harsanyi's Aggregation Theorem in ML Vocabulary
  **Core setup:** You have:
  - $k$ tasks/users, each with a loss function $L_i(\theta)$ over model parameters $\theta$.
  - Each $L_i$ is defined up to positive affine rescaling (i.e., units are arbitrary; $a_i L_i + b_i$ for $a_i > 0$ is equivalent).
  - A "social loss" $L_{\text{soc}}(\theta)$ aggregating all tasks.
  - **Axioms:**
    1. **Expected-utility compliance:** Each $L_i$ and $L_{\text{soc}}$ behave like proper loss functions (convex, support gradients/subgradients, etc.), and their expectations over a data distribution $\mathcal{D}$ satisfy linearity of gradients (vNM analogs).
    2. **Unanimity:** If all users weakly prefer $\theta_a$ over $\theta_b$ (i.e., $L_i(\theta_a) \leq L_i(\theta_b)\ \forall i$), and at least one strictly prefers $\theta_a$ (strict inequality), then $L_{\text{soc}}(\theta_a) < L_{\text{soc}}(\theta_b)$.

  **Theorem conclusion:** $L_{\text{soc}}(\theta)$ must be a **weighted sum** of re-scaled individual losses:  
  $$L_{\text{soc}}(\theta) = \sum_{i=1}^k w_i (a_i L_i(\theta) + b_i)$$  
  for some $w_i > 0$, $a_i > 0$, and $b_i$.  
  *(Equivalently: after choosing units for each $L_i$, $L_{\text{soc}}$ is a linear scalarization.)*

  ---

  ### Residue Report
  #### (i) Weights as units-fixing convention ≈ interpersonal comparability
  **Your suspicion is correct and matches the philosophical worry.**  
  - In ML: Each $L_i$ is only defined up to $a_i L_i + b_i$ (arbitrary scale/shift). The $w_i$ and $a_i$ are **coupled**—fixing one determines the other. Choosing $a_i$ (e.g., scaling MSE loss by 100x) is equivalent to changing $w_i$.  
  - In philosophy: This is **exactly the "interpersonal utility comparison" problem**. Harsanyi assumes utilities are cardinally measurable and interpersonally comparable, but the weights $w_i$ have no empirical meaning without a convention to fix units.  
  - **Survival:** Your claim survives. The theorem says weights *exist* given *some* unit convention, but doesn't tell you how to choose that convention. Your "gradient steps" (e.g., setting scale via grad norm) is one such convention—but it's still arbitrary.

  #### (ii) Complete ranking vs. Pareto frontier
  **The theorem ignores the frontier; this is its limitation for your work.**  
  - The theorem guarantees a **complete ordering** of all $\theta$ (via $L_{\text{soc}}$), but you care about the **Pareto frontier** (set of non-dominated solutions). Linear scalarization ($\sum w_i L_i$) can only reach convex parts of the frontier.  
  - **Problem:** Harsanyi's axioms force a *single linear projection* of the loss space. But in ML:  
    - You optimize $\min_\theta \sum w_i L_i$ to get **one point** on the frontier.  
    - The frontier may be non-convex (common in multi-task), requiring non-linear scalarization or Pareto methods—**invisible to the theorem**.  
  - **Whose fault?** The theorem's. It assumes social preferences are **complete and linear**, but in practice, you (the optimizer) only care about dominance relationships and efficient trade-offs. The unanimity axiom doesn't constrain choices *within* the frontier.

  #### (iii) Commensurability & legitimacy via "gradient steps"
  **Your claim partially survives, but unanimity forces constraints.**  
  - **Commensurability:** Claiming losses are commensurate via "gradient steps" is **valid pragmatically** (you control the optimization). But:  
    - This is just a **units convention** (e.g., scaling losses so their gradients have similar norms). Harsanyi's weights absorb arbitrary rescalings.  
    - *However*, if stakeholders disagree with your weighting, the *legitimacy* question resurfaces.  
  - **Unanimity as minimal legitimacy:**  
    - If your $w_i$ are negative, unanimity fails (e.g., all users prefer $\theta_A$, but $L_{\text{soc}}$ prefers $\theta_B$).  
    - The theorem forces $w_i > 0$ to respect unanimity. But **zero weights** (ignoring users) are allowed if no strict preference is violated.  
  - **Survival:** Your control over the objective insulates you from *democratic* legitimacy issues, but unanimity is a **minimal fairness constraint** embedded in the math. Violating it (e.g., adversarial weighting) breaks the theorem.

  ---

  ### Mathematics vs. Genuine Controversies
  #### **Just Mathematics**  
  - If preferences satisfy vNM axioms + unanimity, then $\exists$ weights $\{w_i > 0\}$ and rescaled losses $\{\tilde{L}_i\}$ such that $L_{\text{soc}} = \sum w_i \tilde{L}_i$.  
  - The proof uses the fact that vNM utilities live in a vector space, and unanimity implies the social utility is in its positive dual cone.

  #### **Genuine Controversies**  
  1. **Unanimity is *not* innocent:**  
     - It forces **weak Pareto efficiency**, but ignores **distributional equality**. Example: $\theta_A$ gives huge gains to one user, tiny losses to others; $\theta_B$ gives modest gains to all. Unanimity permits $\theta_A$ if no one is worse off, but society might prefer $\theta_B$. Philosophers (e.g., Rawls) reject this.  
     - In ML: Optimizing $\sum w_i L_i$ may produce models that heavily favor one user group—even if "fairer" options exist.  

  2. **Is it an argument for utilitarianism?**  
     - **Yes, but:** The weights $w_i$ can be unequal, so it's **weighted utilitarianism**. Critics say this ignores fairness (e.g., should $w_i$ be equal? Should we minimize max loss instead?).  
     - **Your context:** In ML, weights are set by *you* (the engineer), not by users or ethics—so it's "utilitarianism with parameter tuning privileges."  

  3. **The elephant in the room: Arrow's Impossibility vs. Harsanyi:**  
     - Arrow says *no* social ranking can satisfy unanimity, non-dictatorship, and independence of irrelevant alternatives—for *ordinal* preferences.  
     - Harsanyi "escapes" by assuming *cardinal* vNM utilities. Critics argue cardinal utility is unrealistic; defenders say it's natural for risk-sensitive decisions.  
     - **In your practice:** Losses *are* cardinal, but Arrow reminds us that **aggregation is fundamentally messy**—Harsanyi hides this with linearity.

  ---

  ### Bottom Line
  - **You already live Harsanyi:** Linear scalarization is standard in ML. The weights $w_i$ absorb your units-fixing choices (e.g., grad norm scaling).  
  - **What the theorem misses:** Non-convex frontiers, non-linear trade-offs, and distributional fairness—where you spend your time.  
  - **Controversy takeaway:** Unanimity is weaker than it looks (ignores equality), and while the theorem enables utilitarianism, it doesn't justify your choice of $w_i$. Your "gradient steps" convention solves the *math* but not the *ethics*—if stakeholders care.  
  - **Unsure about:** Whether stochastic policies/lotteries (vNM's focus) matter in your applications. If not, Harsanyi's axioms may be overkill.
