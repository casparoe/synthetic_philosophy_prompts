prompt: |-
  I sit on the program committee of a private foundation whose stated mission is to increase the number of people who lead flourishing lives, and at our next meeting we have to choose between two five-year grants of identical size. The vote is deadlocked in a way I have come to think is philosophical rather than empirical. Grant A funds contraceptive access and voluntary family planning in a district of roughly 900,000 people; the foundation's own modelling says it would avert about 11,000 births over five years, mostly births to women who report not wanting another child now, and that it would raise measured wellbeing among people who exist either way — maternal health, household earnings, schooling per child. Grant B funds IVF and fertility care in the same district, where staff estimate roughly 1,200 additional births over five years to people who want children and cannot otherwise have them. The staff economist scored both grants on wellbeing-adjusted person-years and got nearly the same figure: the lives averted under Grant A would, on our own data, have been well above the local average, while the lives created under Grant B are expected to come out slightly higher still, though the two estimates sit inside each other's error bars. A complication that keeps resurfacing is that many of Grant B's patients would eventually have conceived naturally, so the children born under the grant are not merely earlier versions of children who would otherwise have been born; under the grant, different children exist.

  The deadlock tracks two positions. One bloc argues that the beneficiaries of Grant B do not exist independently of the grant, so there is no one whom the grant makes better off and no one whom declining it leaves worse off; on the person-affecting asymmetry, Grant B's value is close to zero and Grant A wins comfortably on its benefits to women and existing children. The other bloc replies that Grant A does nothing the mission statement names — it makes nobody's life flourish — and points out that the first bloc's principle, applied consistently, would tell the foundation to stop counting most of what it currently counts. A third trustee has floated a compromise rule: count benefits to people whose existence depends on the grant, but only to the extent that their expected wellbeing exceeds a threshold set at the district median, and cap the contribution of such existence-dependent benefits at a fixed fraction of any grant's total score. Separately, our board chair has raised the repugnant conclusion about the mission statement itself, noting that maximizing the number of flourishing lives seems to imply that a much larger population of lives just barely worth living would be better, and has asked whether the committee should propose an amendment.

  Please draft the decision memo I will circulate before the meeting. It should recommend a concrete course of action — fund one grant, split the money, fund both with conditions, or decline both and reopen the search — with a rationale a colleague who disagrees could actually answer, and it should state whether you accept, reject, or revise the threshold-and-cap rule and why. It should also give the committee's honest view on whether to recommend amending the mission statement, and it should give the strongest version of the losing position rather than only arguing for the winner.
reasoning: |-
  Okay, the user is part of a program committee for a foundation focused on increasing flourishing lives. They're deadlocked between two grants: one for contraception (Grant A) and one for IVF (Grant B). Both have similar wellbeing-adjusted person-year scores, but the philosophical divide is deep. 

  First, I need to unpack the core conflict. The deadlock isn't about numbers—it's about moral philosophy. Grant A improves existing lives but prevents potential lives. Grant B creates new lives but doesn't directly help existing people. The person-affecting asymmetry is the real battleground here.

  Hmm... the user wants a memo that does three tricky things: (1) recommends concrete action despite deadlock, (2) addresses the threshold-and-cap compromise rule, and (3) tackles the mission statement's repugnant conclusion problem. That's a lot to balance.

  The staff economist's near-identical scores are interesting. It means the empirical case is a wash—this decision must rest on values. The complication about Grant B creating different children (not just accelerating births) is ethically significant. And that meddling "natural conception" factor makes quantification messy.

  *scratches head* The third trustee's compromise feels like an attempt to split the difference philosophically. But capping "new life" benefits while setting a wellbeing threshold? That might satisfy nobody. Still, it's the only bridge between the blocs.

  The repugnant conclusion looms large. If the mission stays as-is, the foundation could logically endorse creating masses of barely-happy lives. But revising it mid-decision feels reactive. Maybe acknowledge the problem but punt the solution?

  *stares at ceiling* What would actually break the deadlock? Funding both seems obvious—but the grants are mutually exclusive in location. Splitting funds might cripple both programs' impact. Reopening the search feels cowardly. 

  ...I think the memo has to choose Grant A. Not because it's clearly better, but because:
  - It aligns with uncontroversial benefits (helping actual suffering people)
  - Avoids the metaphysical minefield of counting nonexistent beneficiaries
  - Upholds what the foundation already does (they clearly count wellbeing improvements today)

  But! Must present Grant B's case vigorously. The "different children" argument is morally serious—if we value potential flourishing, creating wanted happy lives matters. And dismissing Grant B entirely DOES undermine current practices.

  On the compromise rule... it's well-intentioned but unworkable. Setting a median threshold? Arbitrary. Capping new-life benefits? Why 20%? Better to reject it and force a principles-based vote.

  Mission statement amendment? Flag it as critical but separate. Don't let this vote dictate philosophy—schedule a dedicated review.

  *paces* The tone needs to be: "We see both sides, but a decision must be made. Here's why A, here's why it's painful for B supporters, and here's how we fix the root problem later."

  Key phrases to include:
  - "This deadlock reveals foundational questions"
  - "Grant A’s benefits are person-affecting in the least contested sense"
  - "We must address the repugnant conclusion regardless of this vote"

  ...alright. Draft time.
answer: |-
  ## MEMORANDUM  
  **To:** Program Committee Members  
  **From:** [Your Name], Program Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for District Grant Funding & Mission Review  

  ---

  ### **I. Summary**  
  After thorough analysis of Grants A (contraceptive access) and B (fertility care), both empirically equivalent in wellbeing-adjusted person-years but philosophically divergent, I recommend **funding Grant A** without modifications. The rationale prioritizes measurable benefits to existing persons, avoids unresolved ontological dilemmas, and aligns with core operational principles. The proposed threshold-and-cap rule is rejected as unworkable. Separately, the mission statement warrants review due to the repugnant conclusion, but this should not delay the current decision.  

  ### **II. Analysis of Grants**  
  **Grant A (Contraceptive Access):**  
  - **Benefits:** Prevents ~11,000 unwanted births; improves maternal health, household earnings, and child education for existing persons.  
  - **Alignment with Mission:** Directly enhances flourishing for identifiable individuals (women, existing children).  
  - **Strength:** Outcomes are person-affecting (benefits actual people) and empirically verifiable.  

  **Grant B (Fertility Care):**  
  - **Benefits:** Creates ~1,200 additional births to otherwise infertile individuals; children expected to have slightly above-average wellbeing.  
  - **Alignment with Mission:** Enables flourishing for new lives, but these lives depend entirely on the grant.  
  - **Strength:** Fulfills unmet desires for parenthood and creates *different* individuals (not merely accelerated births).  

  #### **The Core Deadlock: A Fair Representation of Both Positions**  
  - **Pro-Grant A Bloc:** Grant B’s beneficiaries *do not exist* absent the grant. Thus, Grant B cannot "make someone better off" (per person-affecting asymmetry). Grant A unambiguously improves flourishing for existing people. If we reject Grant B’s value, much of our current work (e.g., prenatal care that saves future lives) may require revision.  
  - **Pro-Grant B Bloc:** Grant A merely *prevents* potential flourishing lives without creating new flourishing. Our mission emphasizes *increasing the number* of flourishing lives, which Grant B achieves. Dismissing Grant B ignores the intrinsic value of creating wanted, flourishing lives and contradicts our focus on future outcomes.  

  ### **III. Recommendation: Fund Grant A**  
  **Rationale:**  
  1. **Avoids Unresolved Philosophical Risks:** Grant B requires accepting that creating new lives has ethical weight comparable to improving existing lives. This is contested (e.g., non-identity problem) and could inadvertently prioritize population expansion over welfare.  
  2. **Upholds Measurable Impact:** Grant A’s benefits—health, economic uplift, education—are tangible, immediate, and accrue to individuals our foundation can clearly identify as beneficiaries.  
  3. **Operational Consistency:** Our historical grants (e.g., maternal healthcare, education subsidies) focus on *existing* people. Funding Grant B would mark a significant departure, demanding rigorous justification beyond parity in modelled wellbeing.  
  4. **Risk Mitigation:** Grant B’s impact is partially offset by natural conception (some births would occur later without intervention), whereas Grant A’s benefits are net gains.  

  **For Colleagues Favoring Grant B:** This decision does not negate the profound value of enabling wanted parenthood. However, in a deadlock where both grants show equivalent aggregate welfare, we default to the option with unambiguous, person-affecting benefits. Grant B’s ethical framework warrants deeper discussion but introduces uncertainty incompatible with this vote.  

  ### **IV. Threshold-and-Cap Rule: Rejected**  
  The compromise (counting existence-dependent benefits above a wellbeing threshold, capped at 20% of total impact) is conceptually thoughtful but **operationally flawed**:  
  - **Threshold Arbitrariness:** Setting the bar at the district median (rather than zero, or a "flourishing" benchmark) lacks justification. Why is a life *just above median* ethically countable, but not one below?  
  - **Cap Incoherence:** A 20% cap implies new lives contribute less per unit of wellbeing—a valuation unsupported by our principles.  
  - **Practical Chaos:** Applying this rule retroactively would invalidate past grants (e.g., life-saving neonatal care). It risks making scoring arbitrary rather than resolving the dilemma.  

  ### **V. Mission Statement Review**  
  The board chair rightly identifies the **repugnant conclusion**: Maximizing the *number* of flourishing lives could prioritize a vast population with minimally worthwhile lives over a smaller, highly flourishing one. **The committee should recommend amending the mission** to avoid this implication. Potential revisions:  
  - "Increase *proportion* of people leading flourishing lives."  
  - "Enable flourishing lives while respecting thresholds of welfare."  
  **However, mission revision should be decoupled from this grant decision.** Schedule a dedicated board retreat to address this foundational issue.  

  ### **VI. Next Steps**  
  1. **Vote to fund Grant A** as proposed.  
  2. **Reject the threshold-and-cap rule** due to implementability concerns.  
  3. **Propose a board subcommittee** to draft mission statement amendments within six months.  
  4. **Direct staff to refine wellbeing models** for future grants, explicitly addressing:  
     - Existence-dependent benefits,  
     - Distinction between preventing vs. creating lives.  

  This recommendation honors the gravity of both positions while resolving the deadlock on defensible, consistent grounds. It prioritizes direct flourishing for those who exist today—a principle that sustains our work—while committing to confront larger philosophical questions systematically.  

  ---  
  **Approval:**  
  [ ] Chair  
  [ ] Committee Members
