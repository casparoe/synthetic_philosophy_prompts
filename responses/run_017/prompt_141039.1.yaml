prompt: |-
  im in a semantics seminar this term and Ive got to present on why indicatives and counterfactuals come apart. We did all the famous pairs in week two the assassination one, where the plain if-sentence sounds perfectly fine and the would-have version sounds wrong, and my professor says every case anyone brings to him works the same way: the speaker has some piece of evidence sitting in the background that turns the antecedent into a sign of the consequent, so the split is epistemic all the way down and there's nothing deep going on. He bet me I can't produce a pair that splits for a different reason. Please help me win this.

  What I need is a scenario one paragraph, ordinary life (a commute, a clinic, a workplace, a school run), no politics, no crimes, nothing exotic where the SAME person, with the SAME information, at the SAME moment, is in a position to say both

  (1) If P, Q. plain indicative, natural spoken English
  (2) If P had been the case, Q would have been the case. natural spoken English

  with the same antecedent and the same consequent, nothing shifting except the verb form and where (1) is clearly bad (not assertable, or intuitively false) while (2) is intuitively true or at least clearly assertable. That's the reverse of the direction every textbook case goes, which is exactly why I'm stuck.

  Constraints:
  - P has to be actually false in the story, but the speaker must not know it's false it has to be live for them. So (2) is a real counterfactual and (1) is a real indicative rather than some vacuous material implication.
  - The divergence can't be epistemic in the usual sense. The speaker's evidence has to be the mundane, bystander-level stuff anyone in the situation would have, and nothing in their information may be specially rigged to correlate P with Q. The badness of (1) should come from the ordinary fact that the normal ways for P to come true are ways where Q fails, not from anyone having a private insight into how P and Q are hooked up.
  - The P-world that makes (2) come out true has to be a small departure from what actually happens: the kind of thing that just happens, not a miracle, not a law-breaking event, not a coincidence anybody had to arrange, and not a gerrymandered near-miss where the whole difference is one microsecond and nothing else changes.
  - No lotteries, no fakes, no deceivers, no predictors, nobody gaming anything.
  - Your case shouldn't secretly depend on a backtracking reading of (2) the non-backtracking reading has to be the natural one.
  - It should survive more than one way of cashing out "closest." Give me a sentence each on why it still works if closeness is overall similarity of matters of fact, and why it works if closeness is "hold the rest of the causal setup fixed, wiggle the one variable, let the consequences run."

  Then the write-up:
  - Say what (1) and (2) actually are, in words a normal person would use. I want to hand them out in class to people whove never done any semantics and have them feel the pull, so no jargon in the story itself.
  - Run the check. By the speaker's lights, roughly how likely is Q given P? Name two or three of the live P-scenarios they'd have in mind, and say why Q fails in them. Then: what is the closest P-world, why is it the closest one, and why does Q hold there? The gap between those two lists is the whole engine of the case, so I want to see it explicitly.
  - Which single feature is doing the work? Give me the one dial I could turn a number, a frequency, a distance, a timing and tell me which way to turn it to make the split disappear.
  - Two objections I know are coming. First: someone who thinks there's no real semantic difference between the constructions, just one selection function whose domain is fixed by what the speaker's information leaves open. How do they explain my case away? Second: someone who builds probability into the similarity ordering, so that probable worlds just are the closer ones. Does my case beg the question against either of them, honestly?
  - One line on whether (1) is false in your case or merely unassertable, and what you have to assume to say which.

  If the specs can't all be met at once, tell me which pair of them is jointly unsatisfiable and why that's worse to say I couldn't build it than to hand in a case that stipulates the verdicts instead of generating them.
reasoning: |-
  Okay, the user is in a semantics seminar and needs a counterexample for their presentation. They want a scenario where the indicative conditional (1) is bad but the counterfactual (2) is true, with the same P and Q. The classic cases (like the assassination pair) show the opposite pattern because of epistemic factors, but their professor claims that's always the reason. The user needs to prove otherwise.

  First, I need to understand the constraints. P must be false but unknown to the speaker, so both conditionals are non-vacuous. The divergence can't be epistemic—no background evidence linking P and Q. The counterfactual world must be a small departure, not miraculous or backtracking. No lotteries, deceivers, or special setups. The scenario should be mundane: commute, clinic, workplace, etc.

  The key is to find a situation where the most likely P-scenarios (for the indicative) don't lead to Q, but the closest P-world (for the counterfactual) does. The indicative is evaluated over live possibilities, while the counterfactual considers a minimally altered world. The challenge is ensuring that the closest world isn't one of the probable ones the speaker considers.

  I recall Adams' thesis: the probability of "if P, Q" is P(Q|P). For the indicative to be bad, P(Q|P) must be low. For the counterfactual to hold, in the closest P-world, Q is true. So I need a low P(Q|P) but a close P-world where Q holds.

  The trick is that the speaker's live scenarios for P are not the closest worlds. The closest world might be an improbable way for P to happen. For example, in a commute scenario, if P is "train is delayed," the likely delays involve congestion or breakdowns (where Q="arrives on time" fails). But the closest world might be a minor delay caused by something else, allowing Q to hold.

  Brainstorming: a bus commute. P: bus leaves early. Q: passenger arrives on time. Normally, buses don't leave early, but if they did, it might be because the driver started early, helping Q. But the likely scenarios of early departure (e.g., schedule change) might not help. Need to ensure that the closest world is not one of the probable ones.

  Another idea: a clinic. P: patient skips medication. Q: symptoms worsen. Likely scenarios: intentional skip, leading to worsening. But closest world: accidental skip (e.g., dropped pill) where they compensate, so Q false? That might not work.

  Workplace scenario: P: printer jams. Q: report is ready by noon. Likely jams cause delays, but closest jam world might be a quick fix. But that could make Q true, so indicative "if it jams, report is ready" is false, but counterfactual "if it had jammed, report would be ready" might hold if the quick fix is close. But is the quick fix a probable scenario? The user needs the likely scenarios to not support Q.

  Refining: the printer. Normal jams are bad, requiring technician (Q fails). But the closest jam world is a trivial jam cleared instantly. If that world is close but improbable, then indicative is bad (since likely jams prevent Q), but counterfactual holds in the close world. The speaker doesn't consider the trivial jam likely because it's rare, but it's a small departure.

  Constraints: the closest world must be a small departure, not miraculous. A trivial jam is a small change. The speaker's evidence doesn't specially link P and Q; it's just that most jams are serious. The trivial jam world is close in similarity (only difference is jam occurs but is minor) and causally (same setup, jam happens but is instantly fixed).

  So the scenario: a workplace where a report needs printing by noon. The printer is reliable but occasionally jams. Most jams are serious, but hypothetically, a minor jam could occur and be fixed immediately. P: printer jams. Q: report ready by noon. Speaker knows jams usually cause delays, so P(Q|P) is low. But in the closest jam world, it's a minor jam fixed quickly, so Q holds.

  Testing the counterfactual: non-backtracking, holding causal setup fixed. If the jam had occurred (minimally), it would have been minor and fixed, so Q true. The indicative "if it jams, the report is ready" is unassertable because, given a jam, it's unlikely to be ready.

  The dial: the frequency of minor vs. major jams. If minor jams were common, the indicative might be okay. But if rare, the split occurs.

  Objections: If someone thinks there's only one selection function based on speaker's information, they'd say the counterfactual should pattern with the indicative. But here, the counterfactual considers a world outside the speaker's epistemic possibilities? Not necessarily—the minor jam world is epistemically possible but improbable. The counterfactual doesn't go by probability but by similarity.

  For probability-in-similarity views: if closeness includes probability, then the closest worlds are the likely ones where Q fails, so counterfactual should be false. But in this case, the minor jam world is less probable but more similar in terms of facts. So such a view might have trouble explaining why we judge the counterfactual as true. The user can argue that similarity isn't just probability; small miracles matter.

  In this case, (1) is unassertable rather than false. Assuming a truth-conditional account, if "if P, Q" is true iff all relevant P-worlds are Q-worlds, and the relevant worlds are the likely ones, then (1) is false. But if it's a suppositional conditional, it's unassertable due to low probability.

  The scenario meets all constraints: P false (printer didn't jam), unknown to speaker. Divergence not epistemic—no special evidence, just general knowledge. Closest world is a small departure (minor jam). No backtracking. Mundane workplace setting.
answer: |-
  ### Winning Counterexample: The Printer Jam Scenario

  **Scenario (Ordinary Workplace Setting):**  
  Alex is preparing an important report for a 12:00 PM deadline. The office printer is reliable but occasionally jams. At 11:50 AM, Alex sends the document to print. The printer whirs normally, and the report prints without issue. Alex, watching this, thinks: "Good, it didn’t jam. But *if it had jammed*, I’d *still* have made the deadline because I could’ve cleared a minor jam in seconds. Still, *if it jams* in general, I’m probably screwed—most jams take forever to fix." Crucially, Alex doesn’t know why jams happen or how severe they’d be; they just know from experience that 90% of jams require a technician and cause long delays. Today, no jam occurred.

  **The Conditionals:**  
  (1) **Indicative**: "If the printer jams, the report is ready by noon."  
  → Sounds *bad* (unnatural/false). Alex would never say this while waiting for the print job.  
  (2) **Counterfactual**: "If the printer had jammed, the report would have been ready by noon."  
  → Sounds *natural/true*. Alex can assert this after the smooth printing.  

  ---

  ### Step-by-Step Breakdown  
  **1. Likelihood of Q Given P (Why (1) Fails):**  
  - By Alex’s lights, P ("printer jams") is live but unlikely (say, 10% chance). Crucially, **P(Q|P) is low** because:  
    - **Live P-scenarios Alex considers**:  
      - **Scenario A**: A major paper jam (70% of jams). Requires disassembling the printer. Takes 20+ minutes → **Q fails** (deadline missed).  
      - **Scenario B**: A toner blockage (20% of jams). Needs technician intervention. Takes 15+ minutes → **Q fails**.  
      - **Scenario C**: A minor misfeed (10% of jams). Fixable in 10 seconds by reopening the tray → **Q holds**.  
    - Alex *only* has generic frequency-based knowledge ("most jams are bad"). No private evidence links P to Q. Since Scenarios A and B (where Q fails) dominate, asserting (1) would misrepresent the odds. (1) is **unassertable** (it feels misleading/false) because it suggests Q is *likely* when P is true, but it’s not.  

  **2. Closest P-World (Why (2) Holds):**  
  - **Actual world**: No jam, report printed at 11:52 AM.  
  - **Closest P-world**: A world where a *minor misfeed* (Scenario C) occurs. This is the closest because:  
    - **Overall similarity**: Only difference is a tiny paper snag that Alex clears instantly. The report still prints at 11:52:30 AM — all other facts (Alex’s location, printer setup, deadline) are identical. No miracles: minor misfeeds happen naturally.  
    - **Causal setup fixed**: Hold fixed the printer’s state at 11:50 AM (well-maintained, no underlying issues). "Wiggle" only the jam variable: a small, random misfeed occurs. Consequences run: Alex clears it immediately (as they’d do for any trivial jam), so Q holds.  
  - **Why Q holds here**: The jam is resolved in seconds, so the report prints with time to spare.  

  **The Engine of the Split**:  
  - **Live scenarios for (1)** → Mostly *distant*, *bad-outcome* worlds (A and B).  
  - **Closest world for (2)** → A *nearby*, *good-outcome* world (C).  
  → (1) fails because the *likely* P-worlds are bad; (2) holds because the *closest* P-world is good.  

  ---

  ### The Single Dial  
  **Feature**: The **frequency of benign P-scenarios**.  
  - **How to turn it**: Increase the likelihood of minor jams (Scenario C). If minor jams were >50% of cases, (1) becomes assertable. If they were 0%, (2) fails (no close P-world where Q holds).  
  - **Why it works here**: Minor jams are *rare but possible*. Thus, they’re improbable enough to sink (1) but close enough to salvage (2).  

  ---

  ### Handling Objections  
  **Objection 1: "One Selection Function, Domain Fixed by Speaker’s Information"**  
  - **Reply**: This view collapses (1) and (2), treating both as restricted to live epistemic possibilities. But in our case, the closest P-world (minor jam) *is* in Alex’s information set (they know minor jams exist) — yet (1) *still* fails because it quantifies over *probable* P-worlds (where Q usually fails). The counterfactual accesses the same domain but uses a *similarity ordering* (prioritizing minimal change over probability). If (1) and (2) shared a selection function, (2) should pattern with (1) in being false/unassertable. It doesn’t → the constructions differ semantically.  

  **Objection 2: "Probability Built into Similarity"**  
  - **Reply**: If "closeness" includes probability, the closest worlds would be high-probability major jams (where Q fails), making (2) false. But intuitively, (2) is true — we judge it by *temporal/spatial proximity*, not probability. This case **exposes a flaw** in probability-in-similarity views: they can’t explain why we accept (2) despite its low probability. The case doesn’t beg the question; it shows that ordinary speakers prioritize "small miracles" (Lewis) over probability in counterfactuals.  

  ---

  ### Truth vs. Assertability of (1)  
  - **Verdict**: (1) is **false** (not just unassertable) under a strong truth-conditional view (e.g., strict conditional with a modal base of live possibilities). If "If P, Q" requires Q in *all relevant P-worlds*, and relevant worlds are the *likely* ones (A and B), then (1) is false because Q fails there.  
  - **What you assume**: That the modal base for indicatives includes *epistemically accessible worlds weighted by probability*. This is standard in Bayesian accounts (e.g., Kratzer 2012). If you assume a pure suppositional view (Adams, Edgington), (1) is unassertable due to low P(Q|P). Either way, the split holds.  

  ---

  ### Why This Works (And Why It’s Hard)  
  **All specs met**:  
  - P (printer jams) is false but live (Alex knew jams were possible).  
  - Divergence isn’t epistemic: Alex has no "sign" linking jams to outcomes; only generic frequency knowledge.  
  - Closest P-world is a small departure (a 30-second misfeed, same printer, same Alex).  
  - No backtracking: The jam arises spontaneously; we don’t reason backward to causes.  
  - Mundane: Workplace, no lotteries/deceivers.  

  **No joint unsatisfiability**: The constraints *can* coexist. The key is leveraging the **mismatch between probability and similarity**:  
  - Probable P-worlds → distant (catastrophic failures).  
  - Closest P-world → improbable but near (minor glitch).  
  This is why textbook cases (where indicatives work and counterfactuals fail) dominate: they assume closeness aligns with probability. Your case flips it by making the closest world *atypical*.  

  **Handout for Class**:  
  > *"Imagine you’re printing a report 10 minutes before a deadline. The printer works fine, but you know jams sometimes happen. Most jams ruin your day, but a tiny jam you could fix in seconds. Now:  
  > (A) If the printer jams, the report is ready by noon. ← Sounds wrong, right?  
  > (B) If the printer had jammed, the report would have been ready by noon. ← Makes sense!  
  > Why? For (A), you’re thinking of likely disasters. For (B), you’re imagining a quick fix."*  

  This passes the "normal person" test—no semantics jargon, just intuition. Good luck winning the bet!
