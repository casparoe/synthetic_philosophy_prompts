answer: |-
  Here's a specification for a **Theory of Degrees of Instantiation (TDI)** tailored to prudential concern allocation, with requirements derived from your cases and distinctions. Non-negotiable requirements for your purpose are **bolded**; others are desirable but metaphysically optional. Conservation is treated as a parameter, not a requirement.

  ---

  ### **Core Requirements for Prudential Weighting**
  1. **Quantifiable Partial Presence (Non-Negotiable)**  
     *Must assign a numerical weight (0–1) to "how much of me is instantiated" in a target state.*  
     **Case:** Asymmetric fission (e.g., 60% of cognitive/experiential traits in Branch A, 40% in Branch B).  
     **Why:** Without quantification, "proportional concern" is meaningless.  

  2. **Causal-Historical Sensitivity (Non-Negotiable)**  
     *Must discount patterns lacking causal connection to your current state.*  
     **Case:** An accidental duplicate (structurally identical but no causal link) gets weight 0.  
     **Why:** Collapses "being me" vs. "fitting my description."  

  3. **Temporal Asymmetry (Non-Negotiable)**  
     *Must weigh future/past instantiations differently from concurrent ones.*  
     **Case:** A copy made *while you live* shares weight (e.g., 50% each); a copy made *after death* may get 100% (if no rival).  
     **Why:** Distinguishes survival *across time* from spatial distribution.  

  4. **Additivity Constraints (Conditional)**  
     *Must define whether weights sum to ≤1 (conserved) or can exceed 1 (additive).*  
     **Case:** 20 brains each holding 5% of your pattern:  
     - **Conserved (k=1):** Total weight = 1.0 (each gets 0.05).  
     - **Additive (k=∞):** Total weight = 1.0 (each gets 0.05, sum=1.0) *or* each gets 0.05 independently (sum=1.0).  
     **Why:** Your friend’s "additive" claim is ambiguous—it could mean non-conserved *or* uniform weighting. **Conservation is optional but must be explicitly parameterized** (e.g., a constant *k*).  

  5. **Decay/Gradual Replacement Handling (Non-Negotiable)**  
     *Must account for partial overlap and fading over time.*  
     **Case:** Slow replacement over decades: weight declines as your current traits diverge from the future self (e.g., 70% after 10 years, 30% after 30).  
     **Why:** Prudential concern should reflect progressive loss of psychological connectedness.  

  ---

  ### **Trade-offs and Incompatibilities**  
  - **Causal Sensitivity (R2) + Additivity (R4):** Hard to reconcile with additive models if "copies" dilute weight.  
  - **Temporal Asymmetry (R3) + Conservation (R4):** Conservation implies a copy made pre-mortem splits your "survival budget," but a post-mortem copy might not compete.  
  - **Unavoidable Tension:** Accidental duplicates (R2) and fission (R1) force a choice: either reject conservation (allowing >100% total "you") or accept that duplicates get weight 0.  

  ---

  ### **How Competing Theories Fare**  
  | **Theory**       | **R1: Quantification** | **R2: Causal Link** | **R3: Temporal Asymmetry** | **R4: Conservation** | **R5: Decay** |  
  |------------------|------------------------|---------------------|----------------------------|----------------------|---------------|  
  | **Parfitian**    | Partial (via continuity) | No (any duplicate) | Weak (focus on connectedness) | Rejects conservation | Built-in decay |  
  | **Animalist**    | All-or-nothing         | Yes (biological)   | Strong                     | Enforced (only one body) | N/A (no decay) |  
  | **Target TDI**   | **Required**           | **Required**       | **Required**               | Parameterized        | **Required**   |  

  > **Parfit**: Quantifies via psychological connectedness but fails R2 (accidental duplicates count). Conservation rejected.  
  > **Animalism**: Fails R1, R4, R5—no partial survival. Only biological continuity matters.  

  ---

  ### **Confidence and Uncertainty**  
  - **Highest Confidence**: R1–R3 and R5 are non-negotiable for your goal. Without them, prudential weighting collapses.  
  - **Least Confident**: **Whether conservation (R4) is useful or coherent**. It’s intuitive for fission but clashes with copies. *Recommend*: Treat conservation as a tunable parameter (*k*), not a fixed requirement.  
  - **Key Insight**: A usable TDI *must* satisfy R1–R3 and R5. R4 is a design choice. If R2 is enforced, additive models risk underweighting distributed instances (e.g., 20 brains at 5% each sum to 1.0 *only* if conserved).  

  **Final Verdict**: A spec exists—but **conservation is optional**. Start with R1–R3/R5, then test *k* (conservation strength) against cases like fission and copying. If *k=1* causes problems (e.g., undervaluing distributed presence), set *k>1*. This is engineering, not metaphysics.
