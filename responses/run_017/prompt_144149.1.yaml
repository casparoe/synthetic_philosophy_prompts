prompt: |-
  I direct the evaluation and contracting team at a state workforce agency that purchases employment and reentry services from roughly forty nonprofit providers. Over the next two years we are moving from paying for services delivered to paying for measured results: an increasing share of each provider's funding will be tied to a small set of reported numbers. My constraints are these. I have three analysts and no in-house econometrician. Our legal and procurement office requires every payment rule to be written into the contract in language a provider can read and a judge could enforce. Contracts run three years. The providers are sophisticated repeat players who will reallocate staff, change intake practice, and revise how they record dates within a quarter of a rule taking effect. I can fund an in-depth audit of each provider about once a year and no more often. Each candidate indicator has to survive review by our deputy director in about a day of analyst time, and whatever I adopt must also be reported upward to a legislature that has already been told to expect certain numbers.

  I know the folk version of Goodhart's law — that a measure tends to stop tracking what it was meant to track once people are rewarded for it — and I will not be helped by being told to use a dashboard of several indicators, to add random audits, or to be careful. What I need is a decision procedure my team can actually run on a candidate indicator before it goes into a contract, ending in one of four verdicts: pay on it as written; pay on it only with the following guardrails; monitor it but attach no money; or drop it. The procedure should be about a dozen ordered steps, and each step should say what kind of evidence counts as a pass, what counts as a fail, and where a fail sends you.

  Specifically, please include:

  A first step that forces the goal to be written separately from the measure, and that produces an explicit written statement of the part of the goal the measure structurally cannot see — not a caveat, a named artifact my analysts can draft in an afternoon from files we already hold.

  A short sequence of named stress tests, in the order I should run them, each with a specified failure action. The four I have in mind are: a no-real-improvement test, which asks for the cheapest route by which a provider could hit the target while the participant is no better off, and estimates that route's cost to them against the payment; a who-goes-missing test, which asks which participants a provider would prefer never to enroll, and whether our data could detect their absence; a moving-the-line test, which asks where in the causal chain a provider can reset a clock, redefine a denominator, or reclassify an exit; and a what-gets-sacrificed test, which asks which unmeasured goods a provider would have to trade away in order to move the number, and what signal would tell me that trade had happened.

  The points where the procedure stops with a no, and what a no means operationally — how a dropped indicator becomes a monitored-only line item, and how a capped weight is expressed in contract language.

  The points where the procedure hands the decision to a person because the question is about values rather than facts, along with a one-page format for that sign-off, since I have to defend these calls after the fact.

  The guardrails that can survive being written into a contract: smoothing payment so that marginal effort yields marginal money rather than a cliff; holding back at least one measure that is collected but never paid on; and a way of stating a target before the baseline year has closed. Tell me which of these procurement or legal is likely to strike down, and what to substitute.

  A note on which parts of the procedure must stay out of the contract. If a step in my own anti-gaming machinery is one a provider could read and plan around, I need it flagged as such, and I need to know what I lose by keeping it secret.

  A re-review trigger: what pattern in year-one data forces us to reopen an indicator, and how we tell a genuine improvement from adaptation once money is attached, given how rarely we can audit.

  Then run the full procedure on three candidates, in order, showing where each one stops: the share of participants employed at ninety days after exit; median days from referral to first paycheck; and a documented completion of our soft-skills workshop. The first is the number the legislature already expects, and I suspect it is our most gameable measure — I want that case worked through to the answer I will not like, including what I should do instead of paying on it and what I say to the legislature when I do it.

  Close with an honest section on what the procedure cannot do: the residual risk it leaves on the table, the kind of provider adaptation it will never catch, and the point at which I should stop trusting indicators at all and fall back on the judgment of the staff who visit these programs. Do not cite literature or recommend reading; I want the procedure and its applications, not sources.
reasoning: |-
  We are designing a decision procedure for candidate performance indicators to be used in performance-based contracting. The procedure has four possible verdicts: 
  1. Pay on it as written.
  2. Pay on it only with the following guardrails.
  3. Monitor it but attach no money.
  4. Drop it.

  The procedure must be about a dozen ordered steps. We include specific elements as requested.

  ---

  **Decision Procedure: Twelve Ordered Steps**

  **Step 1: Separate Goal from Measure**
  - **Action**: Draft a one-page document that states the underlying goal (e.g., "increase stable employment") and the candidate measure (e.g., "share employed at 90 days"). Then, explicitly list the part of the goal the measure cannot capture (e.g., "the measure does not capture underemployment, job quality, or employment beyond 90 days").
  - **Evidence for Pass**: The goal and measure are distinct, and the gap statement is clear and derived from existing agency files (e.g., program goals from past contracts, legislative intent).
  - **Fail**: If the goal and measure are conflated or the gap is not articulated. 
  - **On Fail**: Return to the drafting team until pass. This step must be passed to proceed.

  **Step 2: No-Real-Improvement Test**
  - **Action**: Brainstorm the cheapest/most likely way a provider could hit the target without improving participant outcomes (e.g., for employment at 90 days: placing participants in short-term jobs that end before 90 days but are counted if the participant is employed on day 90). Estimate the cost to the provider of this strategy versus the payment they would receive. 
  - **Pass**: The cost of gaming is high relative to the payment (e.g., gaming cost > 150% of payment) OR the gaming strategy is easily detectable in existing data. 
  - **Fail**: The gaming strategy is cheap and undetectable (e.g., cost < 50% of payment and no data flags).
  - **On Fail**: Go to Step 10 (Guardrails) to see if guardrails can mitigate; if not, verdict "Monitor only" or "Drop".

  **Step 3: Who-Goes-Missing Test**
  - **Action**: Identify participant groups that providers might avoid enrolling to boost their numbers (e.g., those with barriers like criminal records, low skills). Check if current data can detect such creaming (e.g., via comparison of participant characteristics to eligible population).
  - **Pass**: Data exists to monitor enrollment patterns (e.g., demographics, barriers) and detect significant deviations. 
  - **Fail**: No data to monitor, or gaps are too large (e.g., we don't track key barriers).
  - **On Fail**: Go to Step 10 (Guardrails) to add enrollment monitoring; if impossible, verdict "Monitor only".

  **Step 4: Moving-the-Line Test**
  - **Action**: Examine each step in the causal chain to see where providers can redefine the measure: 
    - **Denominator manipulation**: e.g., redefining who counts as a participant.
    - **Clock reset**: e.g., restarting the 90-day clock by re-exiting a participant.
    - **Reclassification**: e.g., changing an exit reason to avoid a poor outcome.
  - **Pass**: No feasible manipulation points, or data systems log changes so we can audit. 
  - **Fail**: High-risk manipulation points with no audit trail.
  - **On Fail**: Go to Step 10 for guardrails (e.g., strict definitions, audit rights). If guardrails fail, verdict "Drop".

  **Step 5: What-Gets-Sacrificed Test**
  - **Action**: Identify unmeasured goods (e.g., job quality, long-term outcomes) that might be traded for moving the number. List signals that might indicate this trade (e.g., drop in wage data, shorter job tenure).
  - **Pass**: We have at least one signal we can monitor (e.g., wage data collected but not paid on). 
  - **Fail**: No signals, and the trade-off is likely (e.g., pushing quick job placements over better matches).
  - **On Fail**: Go to Step 10 for guardrails (e.g., add a shadow metric). If not feasible, verdict "Monitor only".

  **Step 6: Data Feasibility Check**
  - **Action**: Verify that the data can be collected accurately and timely by providers and validated by the agency within existing systems.
  - **Pass**: Data exists or can be collected without new systems; validation is possible with <5% error rate in pilot. 
  - **Fail**: Data is subjective, costly to validate, or error-prone.
  - **On Fail**: Verdict "Drop" or "Monitor only" if data issues are insurmountable.

  **Step 7: Statistical Noise Test**
  - **Action**: For outcome measures, run a baseline analysis (using historical data) to estimate natural variation. Check if the measure is stable enough that a 10% change is likely meaningful (e.g., via control charts).
  - **Pass**: The measure has moderate volatility (e.g., <20% coefficient of variation) and a 10% change is outside typical fluctuations. 
  - **Fail**: Too noisy (e.g., >30% CV) or prone to external shocks (e.g., recessions).
  - **On Fail**: Go to Step 10 for guardrails (e.g., smoothing, longer averaging). If not feasible, verdict "Monitor only".

  **Step 8: Alignment with Higher-Level Reporting**
  - **Action**: Check if the measure matches what the legislature expects. If not, note the discrepancy and whether it can be reconciled.
  - **Pass**: The measure is aligned or a defensible proxy exists. 
  - **Fail**: Misaligned and no proxy (e.g., legislature wants long-term employment but we measure 90 days).
  - **On Fail**: Hand off to Deputy Director for judgment (Step 9).

  **Step 9: Deputy Director Judgment**
  - **Action**: When a test fails but the measure is critical, the Deputy Director reviews using a one-page format:
    - **Header**: Candidate measure, failed test(s), and risks.
    - **Question**: "Should we proceed despite the risks? Why?"
    - **Options**: Approve as-is, approve with guardrails, monitor only, drop.
    - **Sign-off**: Deputy Director must provide a written rationale.
  - **Outcome**: Directs verdict.

  **Step 10: Guardrail Design**
  - **Action**: For measures that failed tests but are salvageable, apply guardrails:
    - **Smoothing payment**: Avoid cliffs (e.g., pay per 1% improvement, not all-or-nothing).
    - **Shadow metrics**: Hold back one unpaid measure to detect gaming (e.g., track job tenure but don't pay on it).
    - **Baseline adjustment**: Set targets using a pre-contract baseline year with agreed-upon adjustments.
    - **Enrollment monitoring**: Require reporting on excluded groups.
    - **Audit rights**: Specify in contract that suspicious patterns trigger audits.
  - **Pass**: Guardrails mitigate the risk and are contractible (clear, enforceable).
  - **Fail**: Guardrails are vague, illegal, or too costly.
  - **On Fail**: Verdict "Monitor only" or "Drop".

  **Step 11: Contract Drafting Check**
  - **Action**: Legal/procurement review the proposed measure and guardrails for enforceability.
  - **Pass**: Language is clear (e.g., "Employment means at least 30 hours/week") and passes legal review.
  - **Fail**: Legal rejects (e.g., subjective terms like "suitable employment").
  - **On Fail**: Revise or verdict "Monitor only".

  **Step 12: Final Verdict**
  - **Action**: Assign one of four verdicts based on the path:
    - **Pay as written**: Passed all tests without needing guardrails.
    - **Pay with guardrails**: Failed one or more tests but guardrails passed.
    - **Monitor only**: Failed tests and guardrails not feasible, but data is collectible.
    - **Drop**: Failed tests and guardrails not feasible, or data not collectible.

  ---

  **Re-Review Trigger**
  - **Pattern**: If year-one data shows:
    - A >20% improvement in the measure without improvement in shadow metrics.
    - Significant changes in participant mix (e.g., fewer high-barrier participants).
    - Unusual data patterns (e.g., spikes in outcomes at exactly 90 days).
  - **Assessment**: Compare to audit results and shadow metrics. If audit capacity is limited, use statistical process control (e.g., if data points fall outside 3-sigma control limits based on baseline).

  ---

  **What the Procedure Cannot Do**
  - **Residual Risk**: Cannot prevent sophisticated gaming that leaves no data trace (e.g., subtle coercion of participants). 
  - **Uncaught Adaptation**: Will miss gaming that exploits unmeasured dimensions (e.g., if providers shift to serving easier populations not tracked in data). 
  - **External Shocks**: Cannot adjust for macroeconomic changes (e.g., a recession crashing employment rates). 
  - **When to Fall Back**: When multiple indicators show volatility or gaming signals, and audits confirm gaming, shift funding to block grants or expert assessment. Use staff judgment when data patterns are inconsistent with on-the-ground observations.

  ---

  **Applying the Procedure to Candidate Indicators**

  **Candidate 1: Share of Participants Employed at Ninety Days After Exit**
  - **Step 1 (Goal vs Measure)**: 
    - Goal: Stable employment. 
    - Gap: Does not capture job quality, full-time status, or employment beyond 90 days. Pass.
  - **Step 2 (No-Real-Improvement)**: 
    - Cheapest route: Place participants in temporary jobs ending just after 90 days. Cost to provider: low (may even save resources). Payment: high. Fail.
  - **Step 3 (Who-Goes-Missing)**: 
    - Providers avoid those with high barriers (e.g., no high school diploma). We lack data to compare to eligible population. Fail.
  - **Step 4 (Moving-the-Line)**:
    - Providers can re-enroll participants to reset the 90-day clock, or manipulate exit dates. No audit trail. Fail.
  - **Step 5 (What-Gets-Sacrificed)**:
    - Sacrificed: Job quality, wage levels. Signal: Decline in average wages or hours. We collect wage data but don't pay on it. Pass.
  - **Step 6 (Data Feasibility)**: Data exists. Pass.
  - **Step 7 (Statistical Noise)**: Moderate volatility. Pass.
  - **Step 8 (Legislative Alignment)**: Legislature expects this. Pass.
  - **Step 9 (Deputy Judgment)**: Not triggered yet.
  - **Step 10 (Guardrails)**: 
    - Smoothing: Pay per percentage point above baseline. 
    - Shadow metric: Track median job tenure. 
    - Enrollment monitoring: Require reporting on barriers. 
    - Audit rights: If 90-day employment spikes, audit.
  - **Step 11 (Contract Check)**: Legal may reject "job" definition if vague. Define: "≥30 hours/week, not temporary agency work". 
  - **Step 12 (Verdict)**: Fails Step 2, 3, 4. Guardrails may help but are weak (gaming still likely). Verdict: **Monitor only. Do not attach money.**
  - **Operational Response**: Report to legislature: "We are tracking 90-day employment but tying payments to it creates perverse incentives. We will use it for transparency and pair it with job quality metrics in future."

  **Candidate 2: Median Days from Referral to First Paycheck**
  - **Step 1**: 
    - Goal: Speed of placement. 
    - Gap: Does not capture appropriateness of job or participant readiness. Pass.
  - **Step 2 (No-Real-Improvement)**: 
    - Cheapest route: Push participants into quick, low-quality jobs. Cost low. Fail.
  - **Step 3 (Who-Goes-Missing)**: 
    - Providers avoid those needing training. We track barriers. Pass (if we enforce reporting).
  - **Step 4 (Moving-the-Line)**: 
    - Providers can manipulate referral date or first paycheck date (e.g., count cash jobs). Audit difficult. Fail.
  - **Step 5 (What-Gets-Sacrificed)**: 
    - Sacrificed: Job-person match quality. Signal: Increase in quick job exits. We track 30-day job retention. Pass.
  - **Step 6 (Data Feasibility)**: Paycheck date may be hard to verify. Fail if no pay stub requirement.
  - **Step 7 (Statistical Noise)**: Highly volatile. Fail.
  - **Step 8 (Legislative Alignment)**: Not a legislative priority. Pass.
  - **Step 10 (Guardrails)**: 
    - Smoothing: Pay for reductions in the median, but cap payments to avoid rushing. 
    - Shadow metric: 30-day job retention. 
    - Audit: Random checks of paycheck documentation.
  - **Step 11 (Contract Check)**: Legal may accept with strict documentation requirements.
  - **Step 12**: Fails Step 2, 4, 6, 7. Guardrails weak on data feasibility. Verdict: **Drop**. Not reliable enough.

  **Candidate 3: Documented Completion of Soft-Skills Workshop**
  - **Step 1**: 
    - Goal: Improve employability skills. 
    - Gap: Does not capture skill application or retention. Pass.
  - **Step 2 (No-Real-Improvement)**: 
    - Cheapest route: Lower standards to pass everyone. Cost very low. Fail.
  - **Step 3 (Who-Goes-Missing)**: 
    - Providers avoid those unlikely to complete (e.g., low literacy). We track attendance. Pass.
  - **Step 4 (Moving-the-Line)**: 
    - Providers can redefine "completion" (e.g., 80% attendance). We can set a strict definition. Pass with guardrail.
  - **Step 5 (What-Gets-Sacrificed)**: 
    - Sacrificed: Depth of learning. Signal: Drop in post-workshop assessments (if collected). We don't collect. Fail.
  - **Step 6 (Data Feasibility)**: Easy to document attendance. Pass.
  - **Step 7 (Statistical Noise)**: Low volatility. Pass.
  - **Step 8 (Legislative Alignment)**: Not expected. Pass.
  - **Step 10 (Guardrails)**: 
    - Add a random audit of workshop quality. 
    - Shadow metric: Participant satisfaction survey.
  - **Step 11 (Contract Check)**: Legal accepts if "completion" is defined (e.g., "attended 16/20 hours").
  - **Step 12**: Fails Step 2 and 5. Guardrails partially help (audit). But high risk of rubber-stamping. Verdict: **Pay with guardrails** (low weight in payment formula, e.g., 10%, plus audit). 

  ---

  **Guardrail Limitations**
  - **Smoothing**: Likely accepted by legal. 
  - **Shadow metrics**: Accepted if not tied to payment. 
  - **Baseline targets**: Legal may challenge if baseline is disputed. Substitute: Use a 3-year average. 
  - **Audit rights**: Accepted. 

  **Secrecy Needed**: Steps 2-5 (gaming tests) must stay internal. If providers see them, they can preemptively design around the tests. Losing secrecy means losing the ability to detect novel gaming. 

  **Final Note**: No procedure can eliminate gaming entirely. Use staff visits to sense-check data. When inconsistencies arise, fall back to expert judgment.
answer: |-
  Below is a complete, operational decision procedure for evaluating candidate performance indicators. It consists of 12 ordered steps, each specifying pass/fail criteria and failure actions. The procedure is designed for efficiency (executable by your team within constraints) and defensibility (with clear documentation at each step). I'll then apply it to your three candidate indicators as requested.

  ---

  ### **Performance Indicator Evaluation Procedure**
  *Execute steps in order; document each outcome. Analysts must complete Steps 1–8 in ≤1 day per indicator.*

  1. **Goal-Measure Decoupling**  
     - **Action**: Draft a "Goal Gap Statement" (1 page max) listing:  
       a. The goal (e.g., "Increase long-term self-sufficiency").  
       b. The candidate measure (e.g., "Employment rate at 90 days").  
       c. **Structurally Invisible Elements**: Aspects of the goal the measure *cannot* capture (e.g., job quality, participant well-being, outcomes beyond 90 days). Derive from program mission documents, contract boilerplate, or legislative intent memos.  
     - **Pass**: Gap Statement clearly identifies ≥2 material invisible elements.  
     - **Fail**: Invisible elements are vague, absent, or conflated with the measure.  
     - **On Fail**: Return to drafting until pass. *No skip*.

  2. **No-Real-Improvement Test**  
     - **Action**: Brainstorm the cheapest/most likely way a provider could hit the target *without* improving participant outcomes (e.g., for employment rate: placing people in short-term jobs ending at day 91). Estimate:  
       a. Provider's cost to execute ($X).  
       b. Payment value for hitting target ($Y).  
     - **Pass**: $X > 150% of $Y, *or* the tactic is detectable via existing data (e.g., wage records show high turnover).  
     - **Fail**: $X ≤ $Y, *or* undetectable with current tools.  
     - **On Fail**: Proceed to Step 10 (Guardrails).

  3. **Who-Goes-Missing Test**  
     - **Action**: Identify participant groups providers would exclude to boost the measure (e.g., those with criminal records, low literacy). Assess:  
       a. Data availability to detect exclusion (e.g., comparison to referral pool demographics).  
       b. Risk severity (high if >15% of target population could be excluded).  
     - **Pass**: Data exists to monitor exclusion in real-time (e.g., disparity in intake vs. referral demographics).  
     - **Fail**: No monitoring data, *or* exclusion risk is high and undetectable.  
     - **On Fail**: Proceed to Step 10.

  4. **Moving-the-Line Test**  
     - **Action**: Map the measure's causal chain (e.g., referral → services → exit → outcome). Identify 3 points where providers could:  
       a. Reset clocks (e.g., re-enroll to delay exit date).  
       b. Redefine denominators (e.g., exclude "inactive" participants).  
       c. Reclassify outcomes (e.g., label dropouts as "completed").  
     - **Pass**: ≤1 exploitable point found, *and* audits can detect manipulation.  
     - **Fail**: ≥2 exploitable points with no audit trail.  
     - **On Fail**: Proceed to Step 10.

  5. **What-Gets-Sacrificed Test**  
     - **Action**: List unmeasured goods likely traded for the measure (e.g., job quality for speed of placement). Identify:  
       a. A signal of trade-off (e.g., drop in average wages).  
       b. Data availability for that signal (e.g., wage records).  
     - **Pass**: Signal is measurable *and* will be collected (even if unpaid).  
     - **Fail**: No measurable signal.  
     - **On Fail**: Proceed to Step 10.

  6. **Baseline Feasibility Check**  
     - **Action**: Using prior year data, calculate:  
       a. Baseline measure value.  
       b. Natural variation (e.g., 95% confidence interval).  
     - **Pass**: Baseline is stable (CI width ≤10% of mean).  
     - **Fail**: Highly volatile (CI width >20% of mean) or insufficient data.  
     - **On Fail**: Verdict = **Monitor only** (cannot set fair targets).

  7. **Legal Enforceability Screen**  
     - **Action**: Submit measure definition to procurement/legal with:  
       a. Operational definition (e.g., "Employment = ≥30 hrs/week at day 90").  
       b. Data source (e.g., state wage records).  
     - **Pass**: Language deemed "clear and enforceable" by legal.  
     - **Fail**: Rejected as vague or unenforceable (e.g., "suitable employment").  
     - **On Fail**: Verdict = **Drop** (non-negotiable).

  8. **Legislative Alignment Check**  
     - **Action**: Compare measure to legislative expectations.  
     - **Pass**: Directly matches *or* is a defensible proxy (per Goal Gap Statement).  
     - **Fail**: Misaligned (e.g., legislature wants "career pathways" but measure is short-term).  
     - **On Fail**: Escalate to Deputy Director (Step 9).

  9. **Deputy Director Judgment**  
     - **Action**: Deputy reviews all failed tests and signs a **Risk Acceptance Memo** (1-page template):  
       ```  
       [ ] PAY AS-WRITTEN  [ ] PAY WITH GUARDRAILS  [ ] MONITOR ONLY  
       Rationale: [Concise explanation of why risk is acceptable]  
       Key Risk: [e.g., "May incentivize exclusion of high-barrier participants"]  
       Mitigation: [e.g., "Quarterly demographic audits"]  
       ```  
     - **Outcome**: Binding verdict override for Steps 2–6 or 8 failures.

  10. **Guardrail Design**  
      - **Action**: Apply mitigations to salvage failed measures:  
        - **Smoothing**: Replace cliffs (e.g., "80% target") with marginal pay (e.g., "$Z per 1% improvement over baseline").  
        - **Shadow Metric**: Add 1 unpaid but collected measure to detect gaming (e.g., track job retention at 180 days but don't pay on it).  
        - **Baseline Hedge**: Set target as "improvement over [pre-specified baseline year] adjusted for [economic factor]", not absolute.  
      - **Pass**: ≥2 guardrails feasible *and* legal pre-approves language.  
      - **Fail**: Guardrails inadequate or rejected.  
      - **On Fail**: Verdict = **Monitor only** if Steps 6/7 passed; else **Drop**.

  11. **Final Verdict Assignment**  
      - **Rules**:  
        - **Pay as-written**: No fails in Steps 2–8.  
        - **Pay with guardrails**: Failed Steps 2–5 but passed Step 10.  
        - **Monitor only**: Failed Step 6 or Step 10, *or* Deputy selected it in Step 9.  
        - **Drop**: Failed Step 7 or critical failure in Steps 2–5 with no guardrails.  

  12. **Contract Language Packaging**  
      - **Action**: For non-drop verdicts, draft contract clauses:  
        - Payment terms (with smoothing if applied).  
        - Measure definitions (from Step 7).  
        - Audit rights (e.g., "Provider must supply participant lists for validation").  
        - **Explicit exclusions**: List from Goal Gap Statement (e.g., "Payment does not assess job quality").  

  ---

  ### **Re-Review Trigger**  
  Reopen evaluation if **Year 1 data shows**:  
  - ≥10% improvement in the paid measure with **no change** in shadow metrics, *or*  
  - Participant demographics shift by >15% from baseline (per Who-Goes-Missing test), *or*  
  - Audit finds ≥5% data inaccuracies related to the measure.  
  **Assessment Method**: Compare to shadow metrics and baseline; use control charts for statistical significance. If inconclusive, prioritize for annual audit.

  ---

  ### **Guardrail Viability & Legal Risks**  
  | Guardrail          | Legal Risk                          | Substitute if Struck Down               |  
  |---------------------|-------------------------------------|-----------------------------------------|  
  | Smoothing           | Low (acceptable if formula is clear) | None needed.                            |  
  | Shadow Metric       | Medium (may be seen as "burdensome")| Use existing statewide aggregates (e.g., unemployment rate by cohort). |  
  | Baseline Adjustment | High (if baseline is contested)     | Fixed target based on historical avg. ±5%. |  

  **Secrecy Requirements**:  
  - Steps 2–5 (**stress tests**) must **never** be in contracts. Providers could reverse-engineer exploits.  
  - **Loss if revealed**: Ability to detect novel gaming strategies; providers would optimize around your tests.  
  - **Public documents**: Only Goal Gap Statement (Step 1) and contract language (Step 12) are exposed.

  ---

  ### **Application to Candidate Indicators**  
  *Assumes: Analysts have historical data; providers use state wage records; legislature expects "90-day employment".*

  **Candidate 1: Share of Participants Employed at 90 Days After Exit**  
  - **Step 1 (Pass)**:  
    - Goal: *Sustainable employment*.  
    - Gap: *Does not capture underemployment, wage theft, or outcomes beyond 90 days.*  
  - **Step 2 (Fail)**:  
    - Tactic: Place participants in 91-day temp jobs. Cost ($X) = low (minimal staff effort). Payment ($Y) = high.  
    - $X << $Y, and hard to detect (wage records show employment on day 90).  
  - **Step 3 (Fail)**: Providers avoid homeless or low-skilled participants. No data to compare to referral pool.  
  - **Step 4 (Fail)**: Providers can reset clocks by re-exiting participants or redefine "exit" to exclude no-shows.  
  - **Step 5 (Pass)**: Sacrificed = job quality. Signal = wage stagnation. Wage data exists.  
  - **Step 6 (Pass)**: Baseline stable (CI width = 8% of mean).  
  - **Step 7 (Pass)**: Legal approves "employed = ≥1 hr in week of day 90 per wage records".  
  - **Step 8 (Pass)**: Legislature expects this measure.  
  - **Step 10 (Fail)**:  
    - Guardrails: Smoothing (pay per 1% improvement), shadow metric (180-day employment), demographic audits.  
    - Legal rejects demographic audits as "unfunded mandate".  
  - **Verdict**: **Monitor only** (due to Step 3/4/10 fails).  
  - **Operational Response**:  
    - **To legislature**: "We track 90-day employment for transparency but cannot pay on it without risking harm to vulnerable participants. Instead, we'll pay on job retention and wage growth, which better reflect long-term success."  
    - **Contract action**: Include as an unpaid reportable item.  

  **Candidate 2: Median Days from Referral to First Paycheck**  
  - **Step 1 (Pass)**:  
    - Goal: *Rapid job placement*.  
    - Gap: *Does not capture job-person match quality or participant readiness*.  
  - **Step 2 (Fail)**:  
    - Tactic: Push participants into exploitative gig work (e.g., day labor). Cost = very low.  
  - **Step 3 (Pass)**: Exclusion risk for chronic health conditions, but detectable via intake health disclosures.  
  - **Step 4 (Fail)**: Providers can redefine "referral" (e.g., start clock at first workshop) or "paycheck" (e.g., count under-the-table cash).  
  - **Step 5 (Pass)**: Sacrificed = career progression. Signal = decline in full-time placements. Data exists.  
  - **Step 6 (Fail)**: Highly volatile (CI width = 35% of mean; varies by season).  
  - **Verdict**: **Monitor only** (Step 6 fail).  

  **Candidate 3: Documented Completion of Soft-Skills Workshop**  
  - **Step 1 (Pass)**:  
    - Goal: *Improve workplace readiness*.  
    - Gap: *Does not capture skill application or behavioral change*.  
  - **Step 2 (Fail)**:  
    - Tactic: Lower standards (e.g., mark absentees "completed"). Cost = near zero.  
  - **Step 3 (Pass)**: Exclusion risk for non-English speakers; detectable via language data.  
  - **Step 4 (Pass)**: Minimal manipulation (clock starts at enrollment; completion = attendance records).  
  - **Step 5 (Fail)**: Sacrificed = depth of learning. No signal (no post-workshop assessment).  
  - **Step 6 (Pass)**: Low volatility (CI width = 5%).  
  - **Step 7 (Pass)**: Legal approves "completion = attends ≥80% sessions".  
  - **Step 8 (Pass)**: Not legislative priority.  
  - **Step 10 (Pass)**:  
    - Guardrails: Smoothing (pay per completion %), shadow metric (employer satisfaction survey).  
    - Legal accepts.  
  - **Verdict**: **Pay with guardrails** (weight ≤20% of total payment).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Residual Risk**:  
     - Providers may exploit gaps in your data infrastructure (e.g., colluding with employers to fake records).  
     - Undetectable trade-offs (e.g., pressuring participants to accept harmful jobs).  

  2. **Uncatchable Adaptation**:  
     - "Multitasking gaming": Sacrificing an unmeasured good you *don’t even know exists* (e.g., mental health support).  
     - Slow-burn manipulation (e.g., gradual exclusion of high-cost groups over years).  

  3. **When to Abandon Indicators**:  
     - **Trigger**: If >30% of paid indicators fail re-review, *or* audits find gaming in >20% of providers.  
     - **Fallback**: Shift to block grants with expert assessment (your site-visit staff score providers quarterly using structured rubrics).  

  4. **Systemic Limits**:  
     - Cannot adjust for macroeconomic shocks (e.g., recession).  
     - Provider collaboration to game measures (e.g., sharing tactics) is invisible until audits.  
     - **Ultimate backup**: When data conflicts with frontline observations >50% of the time, suspend payments and deploy staff for on-site reviews.  

  ---  
  This procedure prioritizes actionable steps over theory, fits your constraints (3 analysts, no econometrician), and delivers clear verdicts. For the legislature’s preferred measure (90-day employment), it forces a hard but defensible "monitor only" outcome.
