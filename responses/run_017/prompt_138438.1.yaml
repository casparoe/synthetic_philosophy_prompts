prompt: |-
  I am a novelist with one major revision left on a literary novel: about six months of full-time work before copyediting, and an audience that reads fiction for character and style rather than for argument. For the sake of this project I have become persuaded by W. E. B. Du Bois's argument in his writings on art that art cannot avoid being propaganda. On this view, even a novel that never mentions politics still advances some vision of who counts as a person, which lives are narratable, and what a reasonable social order looks like. Assume that this is true for the purpose of the question. My end is narrow and practical: I want the finished book to leave its readers with a slightly different imaginative sense of what is possible in housing policy, not by inserting speeches or converting the book into a tract, but by shaping the material where its propaganda actually lives.

  To think about that, I have been using a rough distinction of my own. Call the first the thesis level: the political views characters state, endorse, or refute in dialogue and narration. Call the second the formal level: choices about point of view, which characters are granted interior depth, what motives are treated as intelligible, how the plot distributes sympathy and resolution, and what the ending presents as livable or unlivable; at this level, propaganda can be carried by craft rather than by assertion. Call the third the reflexive level: whether the book admits and foregrounds its own partiality, or presents its framing as simply the way things are, and how that admission changes a reader's trust.

  My question is an agenda-setting one. Given limited revision time and a novelistic rather than philosophical toolkit, which two or three open questions about how to turn Du Bois's claim into practice should I investigate first, and in what order? I do not want a survey of everything one might say about propaganda in art, and I do not want a reading list or citations; I cannot follow them. I want a defended priority list of at most three lines of work. For each, tell me: what exactly the question is; why it is upstream of other artistic decisions, in the sense that settling it would make many later choices easier or would change what counts as a good later choice; how tractable it is for a working novelist using only reflection, drafts, and perhaps a few trusted beta readers, rather than for a philosopher with unlimited time; and what concrete evidence over the next six months would move it up or down the list, such as which passages early readers call preachy, or which characters they say they could not understand.

  Please also make the criteria explicit: say how much weight you are giving to importance, tractability, neglectedness, and how many other decisions depend on the answer, and describe one trade-off where you deliberately deprioritize a question that is philosophically deeper but would not change my revision. Then give the ordering.

  Conclude the response with a final line, and no text after it, of exactly this form:
  \answer{1: <label>; 2: <label>; 3: <label>}
  where each label is at most three words and names the line of work that should get the corresponding share of my revision effort, in the order you recommend. Do not use quotation marks in that line.
reasoning: |-
  Okay, let me approach this novelist's query methodically. The core challenge is translating Du Bois' "all art is propaganda" concept into novelistic craft within six months, focusing on housing policy imagination without didacticism. 

  First, I need to grasp the three-tiered framework they've built: thesis (explicit statements), formal (structural choices), and reflexive (metacognitive framing). The key is identifying which level offers most leverage for their goals. Given their literary audience values character and style over argument, formal level work seems paramount - it's where subconscious political shaping occurs through narrative architecture.

  Considering tractability, the "sympathy distribution" question jumps out. Beta readers can easily flag unintentional antipathy toward marginalized characters, making it highly actionable. For example, if early readers call a housing-insecure character "irrational," that signals formal-level bias needing revision. This feels like the natural starting point.

  Next, the "livable outcomes" question addresses how plot resolution normalizes certain housing realities. It's slightly harder to test but crucial because endings linger in reader imagination. Concrete evidence would come from beta feedback like "the ending felt hopeless" versus "plausibly optimistic."

  Finally, while the reflexive level is philosophically rich, its implementation risk outweighs benefits for this revision cycle. A single throwaway line about narrative limitations could backfire by drawing attention to mechanics. Better to imply perspective through consistent formal choices.

  Trade-off consideration: I'm deprioritizing thesis-level refinement despite its surface appeal because explicit political dialogue is where "preachy" accusations arise. The novelist already knows to avoid speeches; formal work protects against subconscious propaganda.

  Ordering logic: Sympathy foundations (1) must come first because character depth affects all other elements. Then livable outcomes (2) as plot structure follows character engagement. Reflexive framing (3) remains optional depending on revision bandwidth.
answer: |-
  Based on your constraints (novelistic toolkit, limited time, audience focus on character/style, avoiding preachiness), here is the prioritized list of open questions to investigate, with explicit criteria weighting:

  **Criteria Weighting:**
  *   **Importance (Impact on Reader's Imaginative Shift):** 40% - Directly shapes the core goal of shifting perception of housing possibility.
  *   **Tractability (Actionable with Novelist's Tools):** 35% - Must be addressable through craft choices, drafts, and beta feedback.
  *   **Downstream Impact (# of Decisions Affected):** 25% - Resolving this should clarify many subsequent craft choices.
  *   **Neglectedness:** Minimal explicit weight here, as all levels are crucial, but formal level is often less consciously managed than thesis.

  **Deprioritized Question:** "Reflexive Level: To Foreground or Not?" *Why:* While philosophically deep (acknowledging partiality impacts trust), its impact on the *specific* housing policy imaginative shift is less direct than formal choices. Explicitly foregrounding artifice risks distancing readers from the immersive experience crucial for your goal, or could feel like a thesis-level "explanation" if not perfectly executed. It's also harder to test effectively with beta readers for this specific aim without leading them. Trade-off: Accepting that a *coherent and deliberate* formal/propaganda level, even if not explicitly *named* within the text, might be more effective for immersion and subtle shift than potentially jarring reflexivity, given your timeframe and toolkit.

  ---

  **Priority Order & Investigations:**

  1.  **Formal Level: Sympathy & Interiority Distribution**
      *   **The Question:** Whose suffering, resilience, choices, and *internal reasoning* related to housing insecurity/housing policy consequences does the narrative grant deepest access to, emotional weight to, and intuitive understanding to? Whose motives remain opaque, peripheral, or unsympathetic?
      *   **Why Upstream:** This is the bedrock of Du Bois's "who counts as a person" and "which lives are narratable." It dictates POV choices, scene allocation, depth of character development, and whose logic the reader is invited to inhabit. Settling this determines where the reader's emotional investment lies and whose perspective on housing feels most "real" and worthy of consideration. It fundamentally shapes *how* the reader experiences the world of the novel and who they root for/understand, making later plot, resolution, and thesis-level choices flow from this foundation. Ignoring this risks the book subtly reinforcing existing biases about who is "deserving" or "understandable" in the housing crisis, even without explicit statements.
      *   **Tractability:** High. Novelists constantly make these choices instinctively. Reflection involves consciously auditing character arcs, POV chapters, moments of deep introspection, and whose emotional reactions are rendered most vividly. Beta readers can provide concrete evidence: "I couldn't connect with Character X's decisions," "I found Character Y frustratingly irrational," "I felt deeply for Character Z's struggle," "Character A felt like a stereotype." Passages where readers skim or disengage often signal failures of sympathy/interiority.
      *   **Concrete Evidence:** Beta reader reports of *unintended* frustration, confusion, or lack of connection with characters directly impacted by housing insecurity or advocating for change. Conversely, unintended overwhelming sympathy for characters representing the status quo or opposition. Feedback like "I understood why they did that, even if I disagreed" versus "Their actions made no sense to me" is gold.

  2.  **Formal Level: "Livable" vs. "Unlivable" Outcomes & Resolution**
      *   **The Question:** What range of housing situations and policy outcomes does the plot structure, climax, and denouement implicitly present as ultimately viable/sustainable ("livable") versus untenable/dead-end ("unlivable") for characters the reader cares about? What constitutes a "resolution" within the housing context of the novel?
      *   **Why Upstream:** This directly shapes the reader's "imaginative sense of what is possible." It's Du Bois's "reasonable social order" made narrative flesh. The *kinds* of resolutions offered (individual escape, collective action, tragic defeat, uneasy compromise, systemic change) and *who* receives them powerfully signal what the narrative universe deems possible or impossible, just or unjust, stable or fragile. Deciding this early clarifies the trajectory of character arcs, the stakes of conflicts, and the thematic weight of the ending, preventing an ending that accidentally reinforces despair or complacency contrary to your aim.
      *   **Tractability:** Moderate to High. Involves analyzing the existing plot structure, climaxes, and endings for key characters (especially those central to the housing theme). Requires asking: What does "success" or "peace" look like here? Is it dependent on the status quo? Does it require radical change? Is it individual or collective? Beta readers can provide evidence through their reactions to the ending and character fates: "The ending felt hopeless," "It was satisfying but unrealistic," "Character B got away with too much," "I wish we saw more of what happened to Community Y," "The compromise felt believable but bleak."
      *   **Concrete Evidence:** Beta reader interpretations of the ending's message about housing/hope. Do they see the presented outcomes as realistic possibilities? Do they feel the resolutions validate certain approaches (individualism, market solutions, activism, policy reform) over others? Does the ending leave them feeling the housing system is immutable or open to change?

  3.  **Thesis Level: Counter-Narrative Integration (Safeguard)**
      *   **The Question:** Where do existing explicit character statements or narrative assertions about housing, its causes, or solutions *accidentally* reinforce dominant, simplistic, or oppositional narratives that you aim to subtly shift, and how can they be replaced or countered *immanently* through character voice, context, or juxtaposition *without* adding didactic speeches?
      *   **Why Upstream:** While aiming for subtlety, unchecked thesis-level elements are the *most likely* source of perceived preachiness or clumsiness ("tract"-like feel). They can actively undermine the subtle work done at the formal level. Proactively identifying and neutralizing these *risks* is crucial *before* final polishing. It ensures the formal propaganda isn't sabotaged by explicit contradictions or simplistic statements. Addressing this prevents the most obvious pitfalls that trigger reader resistance.
      *   **Tractability:** High. This is classic line-editing with a specific political/critical lens. Scan dialogue and narrative commentary for statements about "the market," "deserving/undeserving," "personal responsibility," "government bureaucracy," "community," "solutions." Ask: Does this character *believable* hold this view? Is the counter-evidence or complexity *shown* elsewhere in the scene/plot/character depth? Can a simplistic statement be reframed as a *character's* limited perspective, immediately undercut by action or context? Beta readers are excellent at spotting "preachy" or "on-the-nose" moments.
      *   **Concrete Evidence:** Beta readers flagging specific lines or passages as "feeling like a lecture," "the author's voice intruding," "this character suddenly sounding like a policy paper," or "this argument felt straw-manned." Passages where readers note dissonance between a character's stated view and their depicted experiences or the surrounding narrative evidence.

  **Ordering Justification:**  
  1.  **Formal: Sympathy/Interiority** is foundational. Readers won't care about the housing possibilities for characters they don't feel are fully human or understandable. This sets the emotional and moral compass for the entire narrative. Highest downstream impact on POV, character development, and plot focus.  
  2.  **Formal: Livable Outcomes** builds on the foundation of sympathy. It defines the narrative's ultimate vision of possibility/impossibility, directly shaping the reader's final imaginative takeaway. It dictates plot structure and climax.  
  3.  **Thesis: Counter-Narrative** is a crucial safeguard and polish. It ensures the subtle formal work isn't undermined by clumsy explicit statements. It's highly tractable line-editing focused on *removing* barriers to the propaganda's effectiveness, rather than building the core mechanism.  

  \answer{1: Formal Sympathy Interiority; 2: Formal Livable Outcomes; 3: Thesis Counter Narrative Safeguard}
