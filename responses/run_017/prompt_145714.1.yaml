  The draft panel currently calls it offerings with a shrine reconstruction. The user wants a memo that recommends specific text for the panels, whether to keep the shrine drawing, and a policy for future sites with confidence ratings. They need to address the "temple" proponents seriously.

  First, I need to balance the archaeological evidence with community expectations. The evidence for ritual in Pit 1 is stronger: deliberate placement, miniatures, bending. Pit 2 seems more mundane. But "ritual" is still interpretive. The finds specialist has a point about the term being vague, but outright rejecting it might alienate the community. Maybe using "special deposition" instead, which is more descriptive. 

  For the panel text, clarity is key. Pit 1 should highlight the structured deposition without asserting it's definitely ritual. Words like "carefully arranged" and "miniature objects" suggest significance. Pit 2 can be presented as practical disposal, contrasting with Pit 1. This shows both possibilities without committing to one narrative.

  The shrine reconstruction is problematic. There's no evidence of a building. Commissioning it would mislead visitors. Suggesting a reconstruction of the landscape instead—river, pits, possibly people—keeps it accurate and engaging. The heathen group might still use it as a sacred site, but the trust isn't endorsing that view.

  For the policy, confidence ratings sound good but could be confusing. A tiered approach (facts, informed interpretations, speculations) is clearer. It sets boundaries for future interpretations, ensuring transparency. The timeline needs to be tight: draft text by Tuesday, decision on the drawing by Friday, final approval in a week. That gives time for feedback and adjustments.

  The user needs to appease both sides. Acknowledging the "temple" interpretation in the memo but explaining why it's not adopted shows their view was considered. Emphasizing that the alternative narrative is available in other materials (like the school program) might help. The key is presenting the evidence honestly while allowing visitors to engage with the mystery.
answer: |-
  ## MEMORANDUM  
  **To:** Northwold Heritage Trust Board  
  **From:** [Your Name/Position]  
  **Date:** [Date before Tuesday]  
  **Subject:** Urgent Recommendation: Merebank Visitor Centre Interpretation Panels & Reconstruction  

  ### 1. RECOMMENDED PANEL TEXT (Pit 1 & Pit 2)  
  **Adopt this wording immediately for designer submission:**  
  > "**Pit 1: A Deliberate Deposit**  
  > This pit held 34 iron tools – axes, sickles, and specialised implements – alongside cattle jaws and pig bones. The objects were carefully arranged in layers, many deliberately bent or broken. Three miniature, non-functional tools were included. Wear marks show most tools were used before deposition. Radiocarbon dating places this between 100 BC–AD 100. The structured placement and damage suggest these were significant objects, carefully removed from everyday use. This may represent a ritual offering, a commemoration, or a symbolic closing of tools' 'lives'.  
  >   
  > **Pit 2: Tools and Daily Life**  
  > Just 30m away, this pit contained similar iron objects mixed with animal butchery waste and a broken quernstone. Unlike Pit 1, there was no layering or deliberate damage. This suggests disposal linked to practical activities like metalworking, farm clearance, or waste management around AD 1–200.  
  >   
  > **The Mystery of Merebank**  
  > Why two such different pits? Pit 1’s formality contrasts sharply with Pit 2’s practicality. Were they connected? Was one sacred and one secular? Archaeologists debate this. The tools span centuries, indicating activities here endured across generations. The meaning of Pit 1 remains open, but its careful construction speaks of deep significance to the people who created it."  

  *Rationale:* Avoids definitive "ritual" or "temple" labels while acknowledging Pit 1's clear intentionality and distinctiveness. Uses "suggest," "may represent," and "debate" to frame interpretation. Contrasts Pit 2 explicitly. "Significant objects" and "deep significance" validate the *possibility* of sacred meaning without asserting it as fact. "Symbolic closing of tools' 'lives'" offers a tangible, non-religious alternative narrative.  

  ---

  ### 2. RECONSTRUCTION DRAWING: KILL THE SHRINE  
  *   **Recommendation:** Cancel the thatched shrine with carved figure commission immediately. There is *zero* structural or artefactual evidence for a building, let alone an idol.  
  *   **Replacement:** Commission a landscape reconstruction instead. Brief the artist to show:  
      *   The gravel terrace by the river.  
      *   Pit 1 during deposition (showing layered tools/bones, figures carefully placing items).  
      *   Pit 2 as a working area (figures possibly discarding waste, tools near the surface).  
      *   Activity hints (e.g., distant settlement, figures repairing tools, livestock).  
  *   *Why this works:* Visually reinforces the key evidence (pits' form, location, actions) and the contrast between them. It’s evidence-based, dynamic, and avoids imposing unsupported religious imagery. The heathen group/schools can still *interpret* the deposition scene as religious within their own frameworks.  

  ---

  ### 3. STANDING INTERPRETATION POLICY: ADOPT CONFIDENCE TIERS  
  *   **Recommendation:** Implement a 3-tier system for *all* future public interpretation:  
      1.  **Evidence/Fact:** "This pit contained 34 iron tools..." (Directly observable).  
      2.  **Informed Interpretation:** "The layering and damage suggest deliberate placement..." (Strong consensus based on evidence/comparison).  
      3.  **Speculation/Open Question:** "This may be an offering; its full meaning remains debated..." (Multiple plausible interpretations, lack of conclusive evidence).  
  *   **Safeguard Value:** This is **not hedging**; it’s **intellectual transparency**. It:  
      *   Manages visitor expectations.  
      *   Clearly shows where evidence stops and interpretation starts.  
      *   Forces rigor by requiring justification for tiers 2 & 3.  
      *   Empowers visitors to weigh interpretations.  
  *   **Addressing Concerns:** It *prevents* stripping sites of potential religious dimension by allowing Tiers 2/3 to include it *where supported by evidence/analogy*, while acknowledging uncertainty. It answers the "burden of proof" argument by showing *how* interpretations are weighted.  

  ---

  ### 4. TIMELINE (Within 3-Week Deadline)
  *   **By EOD Today:** Circulate this memo & draft panel text.
  *   **Tuesday's Meeting:** Vote to approve/reject recommended text & reconstruction replacement. Discuss/approve draft confidence tier policy.
  *   **Wed-Fri (This Week):** (If approved) Issue cancellation for shrine drawing & brief artist on landscape reconstruction. Finalize panel text with designer (simple layout start).
  *   **Next Week:** Draft revised policy circulated for minor comment. Artist delivers sketch for landscape recon for Board quick email sign-off.
  *   **Week 3:** Final panel layout & reconstruction art delivered. Board Chair/CEO final sign-off.

  ### Addressing the "Temple" Reading
  This recommendation takes the "temple" interpretation seriously by:
  1.  Explicitly acknowledging Pit 1's non-utilitarian, potentially ritual character ("significant objects," "deep significance," "may represent a ritual offering").
  2.  Providing *space* for visitors to interpret the deposition as religious within the presented evidence.
  3.  Contrasting it *specifically* with Pit 2 to highlight its uniqueness.
  4.  Rejecting *only* the unsupported physical reconstruction of a shrine, not the *possibility* of sacred meaning. The heathen group's *interpretation* is not invalidated, even if the Trust doesn't present it as the sole or confirmed explanation.
  5.  The policy framework ensures future sites *can* present religious interpretations *when justified* within the confidence tiers.

  **Recommendation:** Approve the panel text, cancel the shrine drawing in favour of the landscape scene, and adopt the confidence tier policy framework. This presents the compelling mystery of Merebank honestly, avoids unsupported claims, respects community engagement, and establishes a robust standard for future interpretation.
