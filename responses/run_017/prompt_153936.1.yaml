prompt: |-
  I am writing a novel whose central scene is a hearing, and before I can stage it I need to know what reasoning has to stand behind it.

  The novel's world contains a standing body — a Permanent Commission on the Use of Force — which publishes Opinions on historical interventions. Each Opinion returns two verdicts: one on lawfulness, understood as whether the force was authorised by the Security Council, and one on justification, understood as whether, all things considered, it ought to have been done. I have drafted five Opinions as the background against which my characters argue. Now I have to draft the sixth, on the invented intervention the novel turns on, and I want it to be an Opinion my readers cannot dismiss as arbitrary: it has to follow from the five, and before I write it I want to know what exactly it is following from. I am not asking for the correct doctrine of humanitarian intervention; I am asking what doctrine my Commission has been running without quite saying so.

  The five, as drafted:

  1. Kosovo, 1999. A North Atlantic alliance bombed a sovereign state for some eleven weeks with no authorising resolution, to stop the killing and expulsion of a province's Albanian population. The alliance did not attempt to remove the head of state, claimed no territory, and afterwards the province was placed under United Nations administration with the Council's blessing. My Commission holds it unlawful but justified.

  2. Iraq, 2003. Two states and their allies invaded without authorisation, on the strength of a weapons programme that was not there. The government was overthrown, its leader captured and later executed, an insurgency followed, and foreign forces remained for most of a decade. My Commission holds it unlawful and not justified.

  3. Libya, 2011. The Council authorised force to protect civilians threatened by their own government. The alliance's air campaign continued until the government had fallen and the head of state was dead; no ground occupation followed; the country broke into militias and rival authorities and the violence spread across its borders. My Commission holds it lawful in its inception, unlawful and not justified as conducted.

  4. East Pakistan, 1971. A neighbour intervened after a military crackdown that drove some ten million people across its border. It fought alongside an insurgency that had already declared independence; a new state was formed; the intervener withdrew within months and took nothing. My Commission holds it unlawful but justified.

  5. Cambodia, 1978–79. A neighbour invaded and overthrew a regime that had destroyed a very large part of its own population, and the killing stopped. But the intervener installed a client government and remained for roughly a decade against a continuing insurgency, and the Council never authorised any of it. My Commission holds it unlawful and not justified.

  The sixth case is of my own invention. Six states belonging to a regional union intervene in a neighbouring state, Tessaria, where after a disputed election and an uprising in the western province of Vardene the national army has begun killing and expelling the Vardene population: perhaps fifty thousand dead in three months, four hundred thousand refugees into two of the intervening states. The Council, with no veto cast and three permanent members abstaining, authorises member states to use force to protect civilians in Vardene and to enforce a ban on military flights over it; the resolution says nothing about the removal of the government. Nine weeks of air strikes destroy the government's air defences and much of its command structure, and Vardene insurgents, armed and advised by officers of the union, take the provincial capital. Without any further resolution, those forces advance on the national capital; the government collapses; the president is detained and eventually handed to an international court. Forces of the union occupy the capital and an interim administration is installed in which Vardene politicians and advisers from the union are dominant. That was seven years ago. The mass killing stopped within a month of the strikes and has not resumed. Elections were held in the fourth year; seventy states recognise the interim government; the Council has never recognised it and has never condemned the intervention; a rump government holds two provinces and a low-intensity insurgency continues; and two of the intervening states hold mining concessions in Vardene, granted in the second year at rates well below market. The protective mandate was renewed twice and then allowed to lapse. The General Assembly has twice called for withdrawal.

  What I would like from you:

  Predict both verdicts, on lawfulness and on justification, and say which rule produces them.

  Set out the rules that fit all five precedents equally well but come apart on the sixth. I can make out at least four candidates: an authorisation rule, on which the Council's resolution is constitutive for lawfulness and justification turns on atrocity, last resort and proportionality; a mandate-integrity rule, on which the fatal fault is the conversion of a protective mandate into the removal of a government, so that the Council cannot be taken to have authorised what it did not authorise; a long-horizon consequentialist rule, on which justification is a matter of net killing avoided over a decade or more and everything else is evidence at best; and an acceptance rule, on which what matters is whether the population in whose name force was used accepts it — which raises the question my Commission has never answered, whether the relevant population is the protected province or the state as a whole. There may be a fifth about mixed motives and the mining concessions; if it earns its place, give it one.

  If the five genuinely underdetermine the sixth, tell me plainly: identify the closest analogue among the precedents for each option, and state what principle the Commission would be committing itself to whichever way it rules. And give me one further case — a real one, or one I can invent — whose verdict would let a careful reader tell the surviving rules apart, together with which verdict goes with which rule.

  Finally, if more than one Opinion is defensible, tell me which makes the better hearing. I would rather have a Commission that holds together than a conveniently dramatic one, but where both hold together I will take the drama.
reasoning: |-
  Okay, the user is writing a novel centered around a hearing by a Permanent Commission on the Use of Force. They've created five fictional Opinions on historical interventions and need help crafting a sixth Opinion for their invented case of Tessaria. The key is making the Commission's reasoning consistent and defensible based on precedents.

  First, I need to analyze the five existing Opinions to identify implicit patterns. Let me list them: 

  Kosovo (unlawful but justified): No UN authorization, stopped atrocities, didn't overthrow government.  
  Iraq (unlawful/unjustified): No authorization, false pretext, regime change, long occupation.  
  Libya (lawful start, unlawful/unjustified outcome): Authorized for protection but led to regime collapse and chaos.  
  East Pakistan (unlawful/justified): No authorization, stopped crisis, quick withdrawal.  
  Cambodia (unlawful/unjustified): No authorization, stopped genocide but installed puppet regime and long occupation.  

  The patterns emerging:  
  - Lawfulness requires Security Council authorization (except when justified by extreme humanitarian need?)  
  - Justification hinges on: actual humanitarian crisis, proportionality, no regime change unless authorized, and post-intervention stability.  

  For the Tessaria case:  
  - Authorized initially for civilian protection in Vardene  
  - But extended to regime overthrow without authorization  
  - Humanitarian success (killing stopped)  
  - But occupation and economic interests complicate matters  

  The tension points:  
  1. Was the regime change a violation of the mandate? (Like Libya)  
  2. Do the good outcomes outweigh the mandate violation?  
  3. How do mining concessions affect perceived legitimacy?  

  Possible consistent doctrines:  
  **Doctrine A (Authorization-Focused):**  
  - Lawfulness requires strict adherence to mandate. Tessaria's regime change makes it unlawful.  
  - Justification requires both humanitarian necessity and mandate compliance. Unjustified due to overreach.  

  **Doctrine B (Outcomes-Focused):**  
  - Lawfulness same as above.  
  - Justification looks at results: Tessaria saved lives, so justified despite overreach? But precedents punish overreach (Libya) and occupation (Cambodia).  

  **Doctrine C (Hybrid):**  
  - Lawfulness: Breached mandate = unlawful.  
  - Justification: Net lives saved + clean withdrawal = justified, but Tessaria has ongoing insurgency and occupation.  

  **Doctrine D (Motives Matter):**  
  - Adds scrutiny of intervener interests. Mining concessions could taint justification.  

  Precedents suggest the Commission prioritizes mandate integrity (Libya) and dislikes occupation/regime change without authorization (Iraq, Cambodia). Tessaria looks like Libya but with better outcomes.  

  Recommended verdict:  
  Unlawful (mandate breach) and not justified (due to regime change, occupation, and economic interests).  

  To create dramatic tension:  
  The Commission might split 3-2, with dissent arguing humanitarian success outweighs procedural breach.  

  Next case to clarify doctrine:  
  Imagine an intervention with unauthorized regime change but perfect outcomes (stable democracy, no occupation). If Commission condemns it, they're strict mandate adherents; if approved, they're outcome-focused.  

  This gives the user both logical consistency and courtroom drama potential.
answer: |-
  Based on your five drafted Opinions, the Permanent Commission operates under a consistent but unstated doctrine. Below is my analysis, prediction for the Tessaria case, competing rules, underdetermination assessment, a clarifying case, and recommendations for dramatic tension.

  ### Core Doctrine Inferred from Precedents
  Your Commission prioritizes **mandate integrity** and **post-intervention stability** as paramount, with three implicit principles:
  1. **Lawfulness** hinges on *strict adherence to Security Council authorization scope*. Exceeding the mandate voids lawfulness (Libya).
  2. **Justification** requires:
     - A *genuine, large-scale humanitarian crisis* (all cases).
     - *Proportionality*: Force must match the threat and avoid unnecessary escalation (Iraq, Cambodia).
     - *Minimal entanglemen*t: No prolonged occupation/client regimes (Cambodia, Iraq) and no territorial gains (East Pakistan).
  3. **Outcomes matter, but not absolutely**: Success in halting atrocities is necessary but insufficient if principles 1–2 are violated (Libya, Cambodia).

  ### Prediction for Tessaria (Sixth Case)
  - **Lawfulness: Unlawful**  
    The Council authorized force *only* for civilian protection in Vardene and no-fly enforcement. Advancing on the capital, overthrowing the government, and installing a union-dominated administration exceeded the mandate. This mirrors Libya’s "unlawful as conducted" verdict.  
  - **Justification: Not Justified**  
    Despite halting atrocities quickly, the intervention violated proportionality and minimal entanglement:  
    - Occupation persists 7 years later with union influence.  
    - Low-intensity insurgency continues, indicating instability.  
    - Mining concessions at below-market rates create a *de facto* benefit, undermining humanitarian purity (like Cambodia’s client-state dynamic).  
    The Commission’s precedent penalizes mission creep even when atrocities stop (Libya) and rejects long-term entanglements (Cambodia).  

  **Rule Producing This**: **The Mandate-Integrity Rule** with a **Non-Exploitation Corollary**. Lawfulness collapses if the interveners exceed the Council’s mandate; justification requires no material gain, no prolonged occupation, and no destabilizing aftermath.

  ---

  ### Four Rules Fitting All Five Precedents (But Diverging on Tessaria)
  1. **Authorization Rule**  
     - *Lawfulness*: Requires SC authorization.  
     - *Justification*: Atrocity scale + last resort + proportionality.  
     - *Tessaria Verdict*: Lawful (authorized initially) but **Not Justified** (post-mandate regime change violates proportionality).  
     - *Fits Precedents*: Kosovo/East Pakistan unlawful (no auth) but justified (crisis/proportionality); Libya lawful start (auth) but unjustified later (overreach).  

  2. **Mandate-Integrity Rule**  
     - *Lawfulness*: Void if mandate exceeded.  
     - *Justification*: Void if interveners gain territorially/politically OR cause instability.  
     - *Tessaria Verdict*: **Unlawful and Not Justified** (exceeded mandate; mining concessions/occupation = gain/instability).  
     - *Fits Precedents*: Libya penalized for mandate breach; Kosovo/East Pakistan justified as no gain/clean exit; Cambodia unjustified due to occupation.  

  3. **Long-Horizon Consequentialism**  
     - *Lawfulness*: Irrelevant (only outcomes matter).  
     - *Justification*: Net lives saved over 10+ years, adjusted for resulting stability.  
     - *Tessaria Verdict*: Lawful N/A, **Justified** (50k+ lives saved; low ongoing insurgency is "better" than Cambodia/Iraq).  
     - *Fits Precedents*: Kosovo/East Pakistan justified (lives saved); Iraq/Libya/Cambodia unjustified (chaos/occupation costs).  

  4. **Acceptance Rule**  
     - *Lawfulness*: Depends on SC authorization.  
     - *Justification*: Requires acceptance by the *protected population* (not the state).  
     - *Tessaria Verdict*: Lawful? (initial auth), **Justified** (Vardene population saved; rump state irrelevant).  
     - *Fits Precedents*: Kosovo justified (Albanians protected); Cambodia unjustified (population not "accepting" occupation).  

  5. **Mixed-Motives Rule (Earns Its Place)**  
     - *Lawfulness*: Requires SC authorization AND no material/political motives.  
     - *Justification*: Void if interveners profit or expand influence.  
     - *Tessaria Verdict*: **Unlawful and Not Justified** (mining concessions = material motive; Vardene dominance = political gain).  
     - *Fits Precedents*: East Pakistan justified (no gain); Cambodia/Iraq unjustified (client states/control); Kosovo justified (no territory/concessions).  

  ---

  ### Underdetermination Assessment
  **Yes, the five precedents underdetermine Tessaria.** Each rule above fits your cases but splits on Tessaria. Closest analogues:  
  - **Kosovo/East Pakistan** support *Authorization* or *Acceptance Rules* (unlawful but justified if clean exit).  
  - **Libya** supports *Mandate-Integrity* or *Mixed-Motives* (lawful start voided by overreach).  
  - **Cambodia** supports *Consequentialism* or *Mixed-Motives* (unjustified despite stopping atrocities).  

  **Principles Committed To**  
  - If Commission rules Tessaria **Justified**, it prioritizes outcomes (Consequentialism) or protected-population consent (Acceptance).  
  - If **Not Justified**, it elevates mandate integrity (Mandate-Integrity) or anti-exploitation (Mixed-Motives).  

  ---

  ### Clarifying Case to Distinguish Rules  
  **Case: Sierra Leone (1998–2002)**  
  - *Facts*: ECOWAS intervened without initial SC auth to restore a democratic govt after a coup. Atrocities included mass amputations. SC later authorized force. UK then intervened, defeated rebels, and left after 2 years. Democracy restored; violence ended. No interveners gained territory/resources.  
  - *Your Commission’s Verdict*:  
    - **Authorization/Mandate-Integrity Rules**: Unlawful initially, but justified post-auth? (Clean exit, no gain).  
    - **Consequentialism**: Justified (net lives saved, stability).  
    - **Acceptance Rule**: Justified (protected population benefited).  
    - **Mixed-Motives**: Justified (no profit/influence expansion).  
  - *How It Splits Tessaria’s Rules*:  
    - If Tessaria is unjustified but Sierra Leone justified → **Mandate-Integrity Rule** (Tessaria’s occupation/concessions violate; Sierra Leone had no overreach).  
    - If both unjustified → **Mixed-Motives Rule** (Sierra Leone’s lack of profit doesn’t offset initial lawlessness; Tessaria’s concessions condemn it).  

  ---

  ### Recommendation for the Hearing  
  **Verdict**: **Unlawful and Not Justified** (Mandate-Integrity + Mixed-Motives hybrid).  
  **Why It Holds Together & Maximizes Drama**:  
  - **Coherence**: All precedents punish mandate overreach (Libya), occupation (Cambodia), and material motives (implied in Cambodia/Iraq). Tessaria’s mining concessions and puppet administration trigger these. Kosovo/East Pakistan are distinguishable: no occupation or gain.  
  - **Drama Potential**:  
    1. **Ideological Split**: A 3-2 vote, with dissenters advocating Consequentialism ("We saved more lives than in Kosovo!") vs. purists ("The mining deals expose this as imperialism").  
    2. **Character Arcs**: A commissioner who backed Kosovo switches sides, condemning Tessaria’s occupation as "Libya’s shadow." Another invokes East Pakistan to ask, "Since when do liberators stay for seven years?"  
    3. **Moral Ambiguity**: Highlight the mining concessions—was humanitarianism a pretext? This mirrors real-world debates (e.g., Iraq’s oil, Libya’s oil).  
    4. **Global Reaction**: The UNSC’s silence vs. GA’s condemnation mirrors realpolitik (e.g., Syria, Gaza), enriching your worldbuilding.  

  **Stronger Alternatives**:  
  - If you prefer **higher drama without breaking coherence**, have the Commission rule Tessaria *lawful but not justified*. This splits lawfulness (initial auth) from justification (overreach/profit), causing uproar: "You admit they broke the rules but pardon the crime?"  
  - **Avoid Consequentialism/Acceptance Rule**: They weaken precedent consistency (Libya’s outcome was arguably better than Kosovo’s yet condemned) and reduce tension (less moral complexity).  

  This approach ensures your Commission’s doctrine feels inevitable, not arbitrary, while forcing characters (and readers) to confront hard questions about power, principle, and profit. The Tessaria verdict becomes a litmus test for the Commission’s soul—perfect for a novel’s climax.
