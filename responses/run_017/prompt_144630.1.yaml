answer: |-
  ## Joint Statement: Endurantism vs. Perdurantism - Mapping the Dispute

  **Preamble:** We, the undersigned Endurantist (E) and Perdurantist (P), both eternalists committed to the reality of change, the coherence of temporal predication (e.g., "candle is straight/bent"), and the existence of interval-based properties (e.g., motion, acceleration), hereby agree to the following substantive claims, delineate our key disagreements, identify crucial tests, and assess the nature of the dispute. We bracket appeals to special relativity and ordinary language about "persistence" as stipulated.

  ### 1. Agreed Substantive Claims

  1.  **The Argument from Temporary Intrinsics:** We agree this argument successfully establishes that objects instantiate incompatible intrinsic properties (e.g., bent, straight) at different times *only if* these properties are somehow relativized or indexed. It does *not*, by itself, establish which specific account of relativization (e.g., time-indexed properties vs. properties of temporal parts) is correct, nor does it definitively rule out either endurance or perdurance as frameworks capable of accommodating relativized properties.
  2.  **"Wholly Present":** We agree the phrase "wholly present at a time" cannot be non-circularly analyzed in a way that satisfies both parties without implicitly begging the question against one view or the other. E takes it as primitive; P argues it's incoherent without temporal parts and thus not a suitable primitive. Both agree it functions as a *marker* for the core disagreement.
  3.  **Time-Indexed Properties & Cost:** We agree that Endurantism *requires* time-indexed properties (or an equivalent relativization strategy, like relational modes) to account for change involving incompatible intrinsic properties. We disagree on whether this constitutes a significant theoretical cost: E maintains it is a minimal, acceptable cost reflecting the nature of time and persistence; P contends it is an ad hoc complication avoidable via temporal parts.
  4.  **Coinciding Objects:** We agree that *if* coinciding objects (e.g., statue/lump) are possible, both Endurantism and Perdurantism face challenges. E typically must accept coinciding objects as distinct entities sharing all parts at a time but differing modally, while P can treat them as distinct spacetime worms sharing temporal parts at certain times. Neither view possesses a decisive, universally accepted advantage; both require auxiliary principles (e.g., sortal-dependence, modal properties, constitution) to handle the cases.

  ### 2. Disagreements Table

  | Point at Issue                                       | Endurantist Wording (E)                                                                 | Perdurantist Wording (P)                                                                                                | Verdict (Genuine/Verbal) |
  | :--------------------------------------------------- | :-------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :----------------------- |
  | **Nature of Persistence**                            | An object persists by being numerically identical to itself, wholly present, at each moment it exists. | An object persists by having distinct temporal parts at different times, each part existing only at its instant.         | **Genuine**              |
  | **Relation to Times**                                | An object stands in a fundamental location relation ("wholly located at") to each moment it exists. | An object *is* its spacetime region; it stands in a fundamental parthood relation ("is an instantaneous temporal part of") to that whole at each moment. | **Genuine**              |
  | **Identity Over Time**                               | Identity over time is strict numerical identity.                                        | Identity over time is a matter of genidentity – the holding of an appropriate causal/qualitative counterpart relation between temporal parts. | **Genuine**              |
  | **Metaphysical Fundamentality**                      | Persisting objects are fundamental constituents; temporal parts (if admitted) are derivative abstractions. | Temporal parts are fundamental constituents; persisting objects are derivative sums/extended entities.                  | **Genuine**              |
  | **Parthood Simplicity**                              | Atemporal parthood ("x is part of y simpliciter") is the fundamental and only parthood relation needed. | Temporal parthood ("x is part of y at time t") is fundamental; atemporal parthood is derivative (defined over spacetime). | **Genuine**              |
  | **"Wholly Present" Descriptiveness**                 | "Wholly present" successfully captures the intuitive datum of an object being *all there* at a time. | "Wholly present" is at best a misleading metaphor; it obscures the fact that only a *part* of the object exists at a time. | **Primarily Verbal**     |

  ### 3. Cruxes & Predictions

  *   **Crux 1: The Flicker (Intermittent Existence)**
      *   **Case:** Consider an object O that exists at t1, ceases to exist at t2, and comes back into existence (identical to O) at t3.
      *   **E's View & Prediction:** E must either deny O's identity across the gap (claiming a numerically distinct object at t3) or posit a discontinuous worldline where O genuinely ceases and begins again. E predicts the latter is coherent and reflects the metaphysical possibility of genuine intermittent existence. Gracefulness: E handles it directly but requires embracing discontinuous existence as possible. P's account of persistence makes discontinuous existence conceptually incoherent.
      *   **P's View & Prediction:** P denies strict identity across the gap. At best, the t3-stage is a temporal counterpart of the t1-stage. There is no single persisting object O that flickers; there are two distinct objects (or stages) related by counterparty. P predicts counterpart theory provides the only coherent account, rendering "intermittent existence of the *same* object" impossible. Gracefulness: P handles it naturally via counterpart relations but denies the phenomenon as described.
      *   **Bearing:** Tests the commitment to strict identity over time (E) vs. genidentity (P) and the possibility of discontinuous worldlines.

  *   **Crux 2: The Heraclitean Rock (Zero Modality)**
      *   **Case:** Stipulate a rock R about which *no* de re modal properties hold at any time. Only its actual temporal history and properties are fixed.
      *   **E's View & Prediction:** E maintains R is still wholly present, numerically identical, at each moment of its existence. The lack of modality doesn't change the *manner* of persistence; it only removes modal differences that might distinguish coincidents. E predicts: Without modality, the *only* difference between E and P descriptions is verbal ("one thing wholly present" vs. "sequence of stages"). The core disagreement collapses into a choice of primitive locutions.
      *   **P's View & Prediction:** P maintains R is still a sequence of temporal stages related by the counterpart relation determined solely by actual spatiotemporal/causal continuity and qualitative similarity. P predicts: The core framework remains distinct – stages vs. wholly present entities, temporal parthood vs. atemporal parthood + time-indexing. The *content* might be similar, but the fundamental ontology differs.
      *   **Bearing:** Tests whether modal differences are the primary substantive driver of the dispute or if the ontological commitments concerning parts and presence remain distinct even without modality. E leans heavily towards modal differences doing the work; P leans towards ontological differences remaining.

  *   **Crux 3: Interval-Only Properties (Motion)**
      *   **Case:** Provide an account of "O is moving at interval I" without borrowing the opponent's machinery.
      *   **E's View & Prediction:** E defines motion as O having different spatial positions at different sub-times within I. This relies on O being numerically the same entity at those sub-times, possessing the time-indexed properties "position=p1 at t1", "position=p2 at t2" (where p1 ≠ p2 and t1, t2 ∈ I). E predicts: This account uses only E's core commitments (identity, time-indexed properties, location at times) and does not require temporal parts.
      *   **P's View & Prediction:** P defines motion as O having temporal parts at sub-times t1 and t2 within I, where the part at t1 has position p1 and the part at t2 has position p2 (and p1 ≠ p2). Motion is a property of the whole worm derivatively. P predicts: This account uses only P's core commitments (temporal parts, properties instantiated by parts) and does not require a persisting subject with time-indexed properties.
      *   **Bearing:** Tests whether each view can account for dynamic properties using only its own primitive resources. Both predict they can. The test is whether the opponent finds the explanation satisfactory without smuggling.

  *   **Crux 4: The Translation Test**
      *   **Case:** A scheme translates E-statements ("O is wholly present at t", "O is F at t") into P-statements ("O has a temporal part at t", "O's t-part is F") and vice-versa, preserving all non-disputed truths. Only "wholly present" and "is an instantaneous temporal part of" remain untranslated primitives.
      *   **E's Verdict:** The dispute is substantive, not merely notational. The translation masks the fundamental ontological difference: whether the entity at t *is* the whole object (E) or merely a part of it (P). The primitive "wholly present" captures an irreducible aspect of persistence that counterpart relations and sums of parts cannot replicate. The residue is the intuitive datum of an object's presence *in its entirety* at a time.
      *   **P's Verdict:** The dispute, after translation, becomes largely verbal. The different primitives are just different ways of carving the same underlying reality (the spacetime manifold and properties distributed within it). The "residue" is merely a difference in preferred conceptual framework or primitive ideology, not a difference in what exists. The moves left are arguments about theoretical virtue (simplicity, parsimony) or intuitions about the primitives themselves.
      *   **Bearing:** Tests the depth of the disagreement: fundamental ontology vs. conceptual scheme/ideology.

  *   **Crux 5: Developmental & Cross-Cultural Evidence**
      *   **Case:** A study finds young children track objects solely by spatiotemporal continuity, not stage-like entities. Adult judgments on fission cases (e.g., brain transplant) vary significantly across cultures.
      *   **E's Prediction & Relevance:** E predicts these findings. Spatiotemporal continuity tracking aligns with tracking a single, wholly present entity. Cultural variation in fission judgments suggests identity over time judgments are not tracking a mind-independent metaphysical fact about temporal parts, but rather relying on context-dependent, perhaps conventional, criteria for persistence (coherent with E's reliance on sortals or conventional unity). E counts this as evidence favoring Endurantism, as it reflects our fundamental mode of experiencing persistence.
      *   **P's Prediction & Relevance:** P predicts these findings. Spatiotemporal continuity is the primary cue for the counterpart relation determining genidentity. Cultural variation in fission cases reflects variation in the counterpart relation's parameters (e.g., weighting of psychological vs. physical continuity), not variation in the underlying perdurantist ontology. P counts this as evidence *compatible* with Perdurantism, as it shows the context-dependence of the counterpart relation, but not as direct evidence *against* the existence of temporal parts, which are posited for metaphysical, not psychological, reasons. It doesn't directly bear on the truth of the ontology.
      *   **Bearing:** Tests whether each side views empirical psychology as relevant to the metaphysical dispute and what predictions they make. E sees it as more directly relevant evidence; P sees it as relevant to the counterpart relation but not to the core temporal parts ontology.

  ### 4. Closing: Nature of the Dispute

  *   **Verbal Elements:** Significant aspects of the debate, particularly concerning the *description* of persistence ("wholly present" vs. "has a part at") and the interpretation of the Translation Test, hinge on preferred primitive ideology and conceptual framing. The disagreement over whether "wholly present" is descriptive or incoherent is largely verbal once the ontological commitments are clear.
  *   **Substantive Elements:** The core disagreement is substantive and concerns the fundamental ontology of persistence:
      *   The nature of the entity existing at a time (the whole object vs. a temporal part).
      *   The fundamental parthood relation (atemporal vs. temporal).
      *   The nature of identity over time (strict numerical identity vs. genidentity/counterparty).
      *   The metaphysical fundamentality of persisting objects vs. temporal parts.
  *   **Stalemate on Substance:** On these substantive ontological differences, neither side possesses a conclusive, non-question-begging argument that the other does not already know and reject. The debate often reduces to differing assessments of theoretical virtues (simplicity, intuitiveness, coherence with other domains) and intuitions about the primitives themselves. The Cruxes outlined above represent potential paths for progress, but resolving the core ontological commitments remains elusive. **The dispute is substantive but currently lacks a decisive dialectical path forward within the agreed parameters.**

  ---
  **Signed,**

  [Endurantist's Name]
  [Perdurantist's Name]

