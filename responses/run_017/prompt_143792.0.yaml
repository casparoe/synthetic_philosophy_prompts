  The user asks three main things: mapping Lewis's framework to Dagen H, exploring where the theory is silent, and giving a verdict. Starting with mapping, I need to define the population and recurrent situation. The obvious choice is drivers interacting on the road. But the user points out complications like different stakeholders (car owners, bus companies). Lewis focuses on coordination equilibria, but here the payoffs aren't equal due to costs. So, is the arbitrariness condition violated? I should note that Lewis allows for suboptimal conventions, but the transition cost makes this switch different.

  Next, where Lewis is silent. The state's role in coordinating the shift is crucial. Lewis uses salience and precedent, but a government mandate acts as a correlating device. The user's hypothetical about partial announcement is interesting—if only 80% knew, chaos would ensue, showing that common knowledge is key. Also, the material sediment point: after the switch, infrastructure changes made deviance physically hard. This might mean post-change, it's less a convention and more a physical constraint, which Lewis doesn't cover.

  Then the verdict. Dagen H confirms Lewis's equilibrium stability but challenges the transition part. The state's intervention provided the necessary common knowledge for a coordinated jump. The referendum reflects preferences, not expectations. The successful top-down approach shows that conventions can be changed with authority, which Lewis's evolutionary model doesn't emphasize. However, the lock-in and stability after the switch align with his theory.

  I should ensure each part addresses the user's deeper interests: testing Lewis's limits, the role of authority, and material factors. The user might also be exploring how norms evolve and the conditions for successful collective action. Highlighting where Lewis's theory falls short—transitions, materiality, state role—adds value. Conclude that Dagen H is both confirmation and an anomaly, pushing the theory's boundaries but not breaking it.
answer: |-
  Here’s a rigorous application of Lewis’s convention theory to *Dagen H*, arguing to a conclusion while pinpointing the theory’s explanatory reach and limitations:

  ### 1. **Mapping Lewis’s Framework to *Dagen H***
     - **Population**: Drivers in Sweden (and implicitly, pedestrians/other road users). *Recurrent situation*: Binary encounters between oncoming vehicles (e.g., narrow roads, intersections). Lewis’s core logic operates at this micro-level: each driver must coordinate with each oncoming driver.  
     - **Options & Payoffs**:  
       - *Pre-1967*: Two coordination equilibria: (L,L) or (R,R). Mutual avoidance is the payoff; collision is the failure state.  
       - *Arbitrariness*: Violated *in practice* due to material asymmetries. 90% LHD cars meant (R,R) was *objectively inferior* pre-change: drivers had worse visibility for overtaking and roadside obstacles. Lewis *does* allow suboptimal conventions ("basins of attraction"), so this isn’t fatal – but it highlights why unilateral change was impossible. Preferences weren’t fully coincident: LHD car owners bore higher costs (new headlamps, blind-spot risks), while bus/truck operators benefited from alignment with neighbors. Lewis’s model struggles with distributional conflicts; it treats conventions as Pareto-improving, but here, net gains came *only after transition costs were sunk*.  
     - **Common Knowledge & Expectations**: Pre-1967, Swedes expected others to drive left. This expectation sustained the convention *despite* its inefficiency (border delays, accidents with foreign vehicles). The 83% referendum vote reflects *preference* for the status quo (avoiding transition costs), not necessarily a lack of common knowledge about its flaws.

  ### 2. **Where Lewis Speaks and Where He is Silent**
     - **Equilibrium Stability**: Lewis perfectly explains the pre- and post-1967 lock-in. No driver could profitably deviate alone pre-change (driving right alone = disaster). Post-change, the new (R,R) convention held because expectations aligned.  
     - **The Transition Problem**: Lewis’s theory is silent here. His mechanisms (precedent, salience) can’t explain large-scale coordinated jumps. Your first speculation is correct:  
       - **State as Correlating Device**: The Riksdag’s fixed date created *common knowledge* of the new equilibrium. This wasn’t mere "command" – compliance required mutual expectation that *others* would comply. The state provided a focal point (Schelling’s salience) that individual precedent couldn’t.  
       - **Probe: Partial Announcement**: If only 80% knew the date, chaos ensues. Drivers wouldn’t know if oncoming traffic knew. Lewis predicts coordination failure: those informed might still drive left, expecting others to do so. This matches reality – the transition *required* near-universal awareness (enabled by the 4-year campaign).  
       - **Second-Order Convention**: Crucial. Swedes had a prior convention to obey traffic laws *as publicly coordinated rules*. This isn’t fully covered by Lewis (who focuses on spontaneous orders). Authority here bootstrapped common knowledge.  
     - **Material Sediment**: Post-change, road signs, markings, and vehicle design *physically reinforced* the new regularity. This isn’t pure Lewisian convention:  
       - Lewis’s conventions are psychological (expectation-driven). Post-*Dagen H*, deviation became *physically* costly (e.g., hitting a redesigned curb).  
       - In Britain/Japan, the convention persists *despite* material asymmetries (e.g., LHD imports). There, expectation remains primary; deviation is risky because others *expect* left-driving, not (just) due to infrastructure. Lewis’s framework still applies there, but *Dagen H*’s post-transition state blends convention with physical constraint.

  ### 3. **Verdict: Confirmation, Anomaly, or Beyond Scope?**
     - **Confirms Lewis** on equilibrium stability. Pre- and post-1967 traffic norms are textbook conventions: self-reinforcing via expectations. Path dependence is evident – Sweden was "stuck" in a suboptimal equilibrium due to coordination costs.  
     - **Anomaly for Transition**: Lewis’s model implies conventions evolve incrementally via precedent/salience. *Dagen H* was a state-engineered "jump" to a new equilibrium. This challenges Lewis’s *evolutionary* story but not his *equilibrium* definition. The state acted as an exogenous "correlating device," a role Lewis acknowledges but under-theorizes.  
     - **Referendum Meaning**: The 83% vote reveals *preferences*, not expectations. People preferred avoiding transition costs but *expected* others to keep driving left. This aligns with Lewis: conventions persist even when dispreferred if deviation is individually irrational.  
     - **What Lewis Cannot Model**:  
       1. **Distributive Conflict**: Costs fell unevenly (LHD owners vs. bus firms). Lewis assumes coincident interests.  
       2. **Central Authority’s Role**: As a creator of common knowledge/focal points, beyond organic salience.  
       3. **Material Entrenchment**: When infrastructure makes deviation physically impossible, it ceases to be a pure coordination *convention* in Lewis’s sense.  
     - **Broader Normative Implications**: *Dagen H* shows conventions *can* be rapidly changed by top-down fiat with state capacity (public info, enforcement). This doesn’t refute evolutionary paths but demonstrates an alternative mechanism when:  
       - The status quo is highly costly.  
       - A superior equilibrium exists.  
       - A trusted authority can coordinate common knowledge.  
       The post-change accident drop (then reversion) suggests the *new* convention was inherently no safer – efficiency gains came from alignment with neighbors, not the side itself.

  **Conclusion**: *Dagen H* confirms Lewis’s core account of conventions as self-sustaining equilibria but exposes limitations in handling (1) distributive conflicts within coordination, (2) transitions driven by authority rather than organic salience, and (3) the role of material infrastructure in hardening conventions into physical constraints. It shows state power can resolve the "jump problem" Lewis’s model leaves open, but only by leveraging prior conventions of legal obedience. The case is within Lewis’s scope but stretches his framework at the seams.
