prompt: |-
  I have recently been made the clinical member of the committee that decides which decision-support tools our hospital may deploy, and under what conditions of checking their output may be acted on. Every meeting turns out to turn on the same old epistemological question: which sources of knowledge are basic, how many kinds there are, and what must be true of a source before acting on what it tells you is permissible. I have been reading work on the pramāṇas in the Nyāya tradition and its interlocutors, and I have concluded that what I actually need is not another enumeration of knowledge-sources but a specification: what any such enumeration would have to be able to do before it could underwrite a real protocol.

  So please write me the desiderata. The purpose I am fixing: a theory of the knowledge-sources adequate for underwriting an institutional protocol in a high-stakes domain, where acting on an output that does not warrant action harms someone, and where the person acting often cannot audit the source herself. Adequacy is relative to that purpose, so say which requirements follow from it and which would only be requirements for a theory meant for something else. For each desideratum give the case or consideration behind it, mark it non-negotiable, negotiable, or a factional preference, and note what it rules out.

  The cases I need handled, roughly in the order they arose for me:

  A risk score for sepsis produced by a model trained on last year's admissions at a different hospital. It is not a speaker; it has no awareness of this patient; it offers no reason; its only warrant is a statistical relation that holds for a population and may not hold here.
  A waveform on a continuous monitor, and the same number read off a different device I do not understand.
  A counterfactual output: the patient would have arrested without the bolus. Nobody observed anything of the kind.
  A colleague's note in the chart, and a guideline issued by a committee I cannot interview.
  My recollection of the morning vital signs, contrasted with re-reading the chart and learning the same thing again.
  Looking at the medication list and seeing that no anticoagulant is on it: I come to know an absence.
  A potassium level that is normal on a regimen that should not permit it, from which I conclude something unobserved.
  An alarm I was told sounds like the old one, which I then hear and recognize for the first time.
  A source whose reliability is now known to have drifted downward since it was last certified, and a source I have no way of checking at all.

  Alongside these, the distinctions I do not want collapsed: being a source of knowledge versus being a merely reliable indicator; a source being reliable versus my having warrant for taking it to be reliable; first acquisition of something versus confirmation or re-identification of what one already knows; the failure of a source versus the mere absence of knowledge; and the claim that there are n basic sources versus the claim that the others reduce to those n. I am also unsure how to treat the demand that a pramāṇa be an instrument that brings about a veridical cognition rather than simply a reliable process that happens to issue in one: is that a genuine requirement or a commitment of one school? Tell me, too, which of the things people demand of such a theory are real requirements and which are inherited prejudices: that the list be short, that perception be non-conceptual, that no source certify itself, that the list be closed under some fixed number.

  The part I most want is the tension structure. I suspect at least two subsets cannot be jointly satisfied, and I want them stated as claims about the list itself: that no source may certify its own reliability, together with the demand that every certification proceed by some knowledge-source, together with the rejection of circularity and regress; and the treatment of a pramāṇa as an infallible instrument, together with the requirement that the theory explain systematic error and the cases in which a source looks exactly like a working one and is not. Add any further pair you think is jointly unsatisfiable, including pairs involving a desideratum that a source's reliability hold for this case and not merely on average, or that a theory say what happens when a source degrades. Then tell me which single desideratum does the most exclusionary work, in the sense of knocking out the largest share of otherwise attractive theories.

  Only after that, and briefly: how the familiar options fare against the list. Perception alone; perception and inference alone; the Nyāya set of four; the larger set of six that adds postulation and non-cognition; reductionist treatments of testimony and analogy; and a broadly reliabilist or probabilistic treatment on which warrant is a matter of calibrated process rather than of source-type. Two or three lines each is plenty; I will do my own scoring in committee.
reasoning: |-
  Okay, I need to help the user craft desiderata for a theory of knowledge sources that can underwrite a hospital decision-support protocol. The user is a clinical committee member dealing with high-stakes scenarios where acting on unreliable information could harm patients. They've listed several cases like AI risk scores, monitor readings, counterfactual claims, colleague notes, and more. They also want to preserve distinctions like source reliability vs. warrant, and avoid collapsing key epistemic concepts.

  The user's explicit request is for desiderata tailored to their institutional needs, with each requirement categorized as non-negotiable/negotiable/factional, and its rationale explained. They want tension structures where desiderata conflict, plus analysis of how existing theories (Nyāya, reliabilism etc.) fare briefly. But reading deeper, they're wrestling with how to institutionalize epistemology - translating abstract philosophy into actionable protocol when lives are at stake. Their frustration with "same old epistemological questions" suggests they need frameworks that prevent committee deadlocks. The sepsis risk score example highlights their core tension: statistical models lack traditional justification but are clinically urgent.

  For the desiderata, I'll start with non-negotiables derived directly from harm prevention in unauditable contexts. For example: "No Blind Reliance" because clinicians can't verify black-box algorithms internally, so certification must be external. This rules out theories where reliability alone suffices without warrant for relying. Another non-negotiable: "Error Detectability" since source degradation (like model drift) must be capturable without requiring impossible audits. Negotiable items might include "Non-Reductionism" - whether testimony needs to reduce to perception - which some committee factions might insist on but isn't strictly necessary for safety.

  The tension structures are crucial. The user suspects irreconcilable conflicts, like: 1) If no source certifies itself, certification requires another source, leading to regress/circularity - but halting demands (e.g., foundationalism) may force arbitrary stops. 2) Infallibilism vs. Error Explainability: If sources are defined as infallible (like some Nyāya views), real-world drift/alarms can't be handled. The most exclusionary desideratum is likely "No Blind Reliance" - it torpedoes pure reliabilism that ignores warrant, and reductionist testimony accounts that don't require source certification.

  For theory assessments: Perception-only fails testimony/absence cases. Perception+inference struggles with counterfactuals. Nyāya's four handles analogy/absence well but falters on unverifiable testimony (like guidelines). Six-source theories add useful postulation for counterfactuals but overextend non-cognition. Reliabilism handles drift statistically but crashes on "No Blind Reliance" by permitting uncertified reliance if reliable.

  The user's unspoken need might be for a hybrid approach: a certification-focused framework where sources are validated dynamically (not essentially), with institutional processes filling warrant gaps where personal audit is impossible. But that's beyond the requested scope. I'll stick to their structure - desiderata first, tensions, then theory snapshots.
answer: |-
  Below is a structured framework of desiderata for a theory of knowledge-sources (*pramāṇas*) tailored to your institutional purpose. The requirements emerge from **high-stakes, unauditable reliance** where acting on unjustified outputs causes harm. Each desideratum is derived from your cases, labeled by negotiability, and paired with what it rules out. Tension structures and theory assessments follow.

  ---

  ### **Non-Negotiable Desiderata** (Safety-critical)  
  1. **External Warrant Requirement**  
     - **Case**: Sepsis risk score (statistical model); guideline from an uncertifiable committee.  
     - **Rationale**: When a user cannot audit the source, acting requires *warrant for trusting the source itself* (e.g., institutional certification), not just the source’s reliability.  
     - **Rules out**: Theories where reliability alone suffices for justification (naive reliabilism).  

  2. **Error Detectability & Degradation Response**  
     - **Case**: Source with known drift; alarm with unrecognized reliability.  
     - **Rationale**: The theory must explain how to identify/correct systematic errors (e.g., calibration checks) and degrade permissions when reliability is uncertain.  
     - **Rules out**: Infallibilist theories (e.g., classical Nyāya’s *pramāṇa* as invariably veridical).  

  3. **Distinction Preservation**  
     - **Case**: Recollection vs. re-reading chart; absence of anticoagulant.  
     - **Rationale**: Must distinguish:  
       - Source reliability vs. *warrant for relying* on it (e.g., model’s stats vs. user’s right to trust it).  
       - Knowledge of absence vs. failed acquisition.  
       - First acquisition vs. confirmation.  
     - **Rules out**: Conflated accounts (e.g., simplistic reductionism).  

  4. **Non-Circular Certification**  
     - **Case**: Unauditable monitor or committee guideline.  
     - **Rationale**: Certifying a source’s reliability must not require presupposing that source’s output (no bootstrapping).  
     - **Rules out**: Self-certifying sources and viciously circular justifications.  

  ---

  ### **Negotiable Desiderata** (Context-dependent)  
  5. **Source Pluralism**  
     - **Case**: Counterfactual claim ("bolus prevented arrest"); non-cognition (absence of anticoagulant).  
     - **Rationale**: Must accommodate non-perceptual sources (e.g., inference, postulation).  
     - **Factional preference**: Reductionists (e.g., Buddhists reducing testimony to inference) vs. pluralists (Nyāya’s 4+ *pramāṇas*).  

  6. **Population-to-Instance Bridge**  
     - **Case**: Sepsis model trained on external data.  
     - **Rationale**: Requires a principled way to link statistical/group-level reliability to individual cases (e.g., calibration to local data).  
     - **Rules out**: Theories without error margins (e.g., strict infallibilism).  

  ---

  ### **Factional Preferences** (Non-essential)  
  7. **Source Infallibility**  
     - **Case**: Waveform monitor vs. unfamiliar device.  
     - **Preference**: Nyāya’s claim that a *pramāṇa* must be an *instrument* producing veridical cognitions (not merely reliable).  
     - **Not required**: A reliabilist "calibrated process" suffices for your purpose.  

  8. **List Exhaustiveness/Reduction**  
     - **Case**: Testimony (colleague’s note) vs. perception (vitals).  
     - **Preference**: Debates over whether testimony reduces to inference/perception are irrelevant if external certification exists.  

  ---

  ### **Tension Structures**  
  1. **Certification Trilemma**  
     - **Claims**:  
       (a) No source certifies its own reliability.  
       (b) Certification must use a knowledge-source.  
       (c) No circularity/infinite regress.  
     - **Conflict**: Halting the regress requires either foundational sources (disputed) or pragmatic stops (e.g., institutional authority).  

  2. **Infallibility vs. Error Explainability**  
     - **Claims**:  
       (a) A *pramāṇa* is infallible (Nyāya essentialism).  
       (b) The theory must explain errors (e.g., monitor drift).  
     - **Conflict**: Infallibilism cannot handle degraded sources without denying they were ever *pramāṇas*.  

  3. **Instance Reliability vs. Feasibility**  
     - **Claims**:  
       (a) Warrant requires reliability *in this instance*.  
       (b) Users cannot audit sources.  
     - **Conflict**: Demanding instance-specific reliability is impractical; proxies (e.g., real-time validation) are needed.  

  **Most Exclusionary Desideratum**: **External Warrant Requirement**. It eliminates:  
  - Pure reliabilism (ignores user’s warrant).  
  - Testimony reductionism (if certification is irreducible).  
  - Foundationalism (if "basic" sources lack institutional backing).  

  ---

  ### **Theory Assessments**  
  1. **Perception alone**: Fails testimony, absence, counterfactuals.  
  2. **Perception + Inference**: Handles analogy/absence but not unauditable testimony/counterfactuals.  
  3. **Nyāya 4 (perception, inference, testimony, comparison)**: Covers analogy/absence; struggles with certification of unauditable testimony.  
  4. **Six *pramāṇas* (+postulation, non-cognition)**: Best for counterfactuals/absences but overextends "sources" (e.g., non-cognition as a distinct faculty).  
  5. **Reliabilism/Probabilism**: Handles drift via calibration but fails **External Warrant** (users may lack warrant even with reliability).  

  ---  
  This framework prioritizes **action-guiding certification** over metaphysical disputes. The Nyāya emphasis on *pramāṇa* as an *instrument* is less critical than ensuring dynamic, institutionally underwritten warrants for reliance. For your committee, focus on **Error Detectability** and **External Warrant** as guardrails against harm.
