prompt: |-
  I've been reading through the decisions of our country's Commission on Public Funding and Worldview Pluralism — we've got a historically established Protestant church whose bishops still hold seats in the upper house, a large Muslim minority, and a nonreligious plurality — and I cant work out what rule they're actually running. Six rulings so far:

  1. Approved a restoration grant for a thirteenth-century cathedral the state doesn't own, under a scheme open to any listed building of any or no religion; conditions: free public opening several days a week, and none of the money spent on anything used in worship.
  2. Rejected a grant toward a new mosque in a city with a big Muslim population — the stated reason was that the state does not fund places of worship.
  3. Approved state salaries for teachers of a compulsory non-confessional Religion and Worldviews course: learning about religions, no worship, no doctrinal teaching.
  4. Rejected by one vote a proposal letting parents swap that course for confessional instruction at state expense, taught by catechists the churches pick; the worries on record were that kids from nonreligious or minority backgrounds get no equivalent publicly funded option, and that the state would end up certifying who counts as a proper teacher of doctrine.
  5. Approved, with conditions, contracts with a Catholic charity to run homeless shelters on state money: no religious test for staff in the funded posts, no prayer or attendance requirement for residents, no restrictions on what the charity does with its own money.
  6. Rejected a proposal to collect through payroll withholding a levy for whatever registered religious body a taxpayer names, with an opt-out declaration for people who don't want to pay; the deciding worry was the state keeping a register of who belongs to what and deciding which bodies qualify.

  Now there's a proposal in front of them: a "worldview levy." Every taxpayer designates one registered worldview body — religious, humanist, anything — and half a percent of there income tax goes to it. Any body qualifies once 0.1% of adults self-declare for it and it signs a charter accepting the democratic order. The money can be spent on anything at all, worship and proselytizing included. The state is only a collection agent, the money never passes through the budget. People who don't tick a box have their half-percent split proportionally across all qualifying bodies. It's more or less the checkbox arrangement a couple of European countries run.

  What do you think they do with it? I'm less interested in the bottom line than in the rules that fit all six rulings, what each of those rules predicts here, and which precedent is the closest analog. If their record genuinely doesn't settle it, say what principle they'd be committing to with each choice, and name the one further case — or the one condition attached to this one — that would best tell the rules apart; if you think they approve it with conditions, say which condition. In American English, please, our house style is US spelling, and definately no footnotes: just argue it out.
reasoning: |-
  Alright, let me try to figure out this Commission's reasoning. The user provided six rulings and wants to know how they'd handle a new "worldview levy" proposal. First, I need to find a consistent principle that explains all past decisions.

  Looking at each case:

  1. Funding a cathedral restoration: Approved because it's under a secular scheme (historical preservation), with conditions ensuring no religious use of funds. So, state neutrality—funding goes to secular purposes only.

  2. Rejected mosque funding: State doesn't fund places of worship. Direct support for religious activities is out.

  3. Approved salaries for non-confessional religion teachers: Educational, about religions, not promoting any. Fits neutrality—secular purpose.

  4. Rejected swapping for confessional instruction: Worries about unequal treatment for minorities and state entanglement in doctrine. Neutrality and avoiding endorsement.

  5. Approved contracts with Catholic charity for shelters: Conditions ensure no religious tests or requirements. Funding only for secular services, not religious activities.

  6. Rejected payroll levy for religious bodies: Concern over state maintaining a register of affiliations and qualifying groups. Avoiding state entanglement in religious matters.

  The common thread seems to be avoiding state support for religious activities, ensuring neutrality, and preventing entanglement. They fund secular purposes (education, heritage, social services) but not worship or doctrine. Also, they avoid state involvement in defining religious groups or tracking affiliations.

  Now, the new proposal: A worldview levy where taxpayers designate a body (religious or not) to receive 0.5% of their income tax. The state collects but doesn't handle the money. Qualifying bodies need 0.1% support and accept democratic order. Funds can be used for anything, including worship. Non-responders' funds are split proportionally.

  How does this fit with past rulings?

  - The levy directly funds religious activities, which conflicts with #2 (no funding places of worship). Even though it's collected by the state, it still endorses religious funding.

  - The state would maintain a registry of worldview bodies and determine eligibility, which was a concern in #6 (registering affiliations and qualifying groups).

  - The proportional split for non-responders means the state distributes funds based on declared affiliations, which could imply endorsement of certain groups, similar to #4's worry about unequal treatment.

  The closest precedent is #6, where a similar payroll levy was rejected due to entanglement and registration issues. However, this proposal includes non-religious worldviews, so it's broader. But the core issues remain: state involvement in designating groups and funding religious activities.

  If they approve, it might be with conditions. But the proposal already allows funds for worship, which contradicts #2. Adding conditions like restricting fund usage might help, but the proposal doesn't suggest that. The entanglement issue (registry) is still there.

  The user wants to know which precedent is closest. #6 is directly comparable—both involve state collection for designated religious bodies. The rejection reason there was about maintaining registers and qualifying groups. The same concerns apply here. Even though this includes all worldviews, the state still has to manage eligibility and distribution, leading to entanglement.

  Also, funding worship conflicts with #2. So, rejection seems likely. But if they approve, they'd have to abandon the "no funding worship" principle, which was key in #2 and #5. That seems inconsistent.

  The user also asked what condition could make it acceptable. Maybe if the state didn't manage the registry or distribute non-responder funds. But the proposal requires both. Alternatively, restricting fund usage to non-religious activities, but that undermines the levy's purpose.

  In conclusion, the consistent principles are neutrality (no funding religion), avoiding entanglement (no state role in religious affairs), and equal treatment. The levy violates all three. Precedent #6 is the closest match. The Commission would likely reject it for similar reasons, unless they're shifting principles, which the past rulings don't indicate.
answer: |-
  Based on the Commission's six rulings, their consistent governing principle appears to be **strict state neutrality and non-entanglement in religious activities, with permissible funding only for secular purposes or institutions serving a public function**. Here's how each ruling aligns with this framework, followed by predictions for the worldview levy proposal:

  ### Core Principles from Precedents:
  1. **No Direct Funding of Worship/Religion**:  
     - Seen in: #1 (funds for cathedral restoration prohibited from worship use), #2 (rejection of mosque funding as a "place of worship"), #5 (charity funding barred from religious conditions).  
     - The state funds *secular functions* (e.g., heritage, education, social services) but never *religious exercise* (worship, proselytizing, doctrine).  

  2. **Avoidance of State Religious Endorsement or Discrimination**:  
     - Seen in: #3 (funding only non-confessional education about all worldviews), #4 (rejecting state-funded confessional instruction to avoid privileging specific religions or excluding minorities), #6 (rejecting religious payroll levy to avoid state-maintained registries of affiliation).  

  3. **No State Role in Defining Religious Legitimacy**:  
     - Seen in: #4 (state shouldn’t certify "proper" doctrinal teachers), #6 (state shouldn’t decide which religious bodies "qualify").  

  4. **Equal Treatment of Nonreligious Citizens**:  
     - Seen in: #3 (non-confessional course includes secular perspectives), #4 (rejecting swap to avoid disadvantaging nonreligious/minority children).  

  ### Prediction for the Worldview Levy:
  **The Commission will reject the proposal** (likely 5–2 or 6–1, echoing the narrow margin in #4). Here’s why, based on each principle:  

  - **Violates "No Funding Worship" Rule**:  
    The levy explicitly allows funds to finance worship and proselytizing (#2 precedent forbids this). Even with state as a "collection agent," it redirects tax revenue to religious activities—contradicting #1 and #2, where funding required *secular-only* use.  

  - **Replicates Entanglement Problems from #6**:  
    The state must still "register" worldview bodies, verify their 0.1% support threshold, and decide which groups sign a "democratic order" charter. This recreates the rejected #6 scenario: the state defining legitimate recipients and tracking affiliations.  

  - **Creates Unequal Burden on Nonreligious Citizens**:  
    Non-participants’ funds are split proportionally among *all* bodies. This forces nonreligious taxpayers (or minorities) to subsidize groups they don’t support—violating #4’s equity concern.  

  ### Closest Analog: Precedent #6  
  This is the tightest match. Both involve:  
  - State-administered collection of funds for designated religious bodies.  
  - Reliance on taxpayer declarations of affiliation.  
  - State-maintained registries of qualifying groups.  
  The Commission rejected #6 over entanglement; identical issues apply here.  

  ### If They Approved (Unlikely):  
  Approval would require abandoning core principles, but *if it happened*, key conditions would mirror #5:  
  - **Required condition**: Prohibit levy funds from supporting worship/proselytizing (only allowing secular activities like education or charity).  
  - **But**: This neuters the proposal’s intent and contradicts its "anything at all" spending rule.  

  ### The Deciding Case to Clarify Rules:  
  The unresolved tension is whether **collection-as-agent ≠ state endorsement**. To test this, propose:  
  > *"State payroll deduction for donations to registered charities (secular/religious), with charities chosen by taxpayers independently. No opt-out redistribution, no state eligibility criteria beyond standard charity registration."*  

  - **If rejected**: Confirms the Commission views *any* state role in religious funding as entanglement (aligning with #6).  
  - **If approved**: Shows neutrality hinges on *no state gatekeeping* and *no coercion* (e.g., opt-out redistribution).  

  ### Bottom Line:  
  The Commission’s record shows **zero tolerance for state-facilitated funding of religious activities** and **consistent aversion to state religious classifications**. The worldview levy fails both tests. Precedent #6 is the clearest map to rejection—entanglement and worship funding remain red lines.
