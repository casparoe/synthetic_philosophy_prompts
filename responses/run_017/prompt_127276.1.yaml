  Okay, let me approach this systematically. The user is in a philosophy of biology seminar focusing on genetic information and wants criteria to evaluate whether DNA functions as a literal code. They've provided four specific cases to address and want clear distinctions between commonly conflated aspects.

  First, I need to unpack the core question: what makes something a code rather than just a causal mechanism? The key tension seems to be between biological reality (where molecular processes exhibit code-like behavior) and philosophical rigor (where "literal code" implies specific properties like arbitrariness and normativity).

  The user's four cases highlight critical edge scenarios:
  1) Non-coding sequences challenge whether all DNA must produce outputs
  2) Dual translation systems test context-dependence in coding
  3) Reassigned synthetases probe arbitrariness vs adaptability
  4) Epigenetic marks question whether coding requires nucleic acids

  I should structure requirements around these conceptual clusters:
  - Essential coding properties (arbitrariness, mapping rules)
  - System-level dependencies (reader mechanisms, error potential)
  - Functional scope (heritability, phenotypic outcomes)
  - Naturalism constraints (avoiding dualism)

  The trickiest trade-off will be error/normativity versus naturalism - how to accommodate misreading without introducing non-physical "oughts." Perhaps grounding normativity in evolutionary fitness could bridge this. 

  Among all requirements, arbitrariness seems most divisive - it immediately eliminates stereochemical accounts while being central to literal code arguments. This should be highlighted as the key differentiator.

  For the response, I'll organize requirements with clear labels (non-negotiable vs contested), connect each to motivating cases, and explicitly note conflicts - especially the error/naturalism tension. The conclusion will emphasize arbitrariness as the primary filter between competing accounts.
answer: |-
  Here’s a specification for evaluating "literal genetic code" accounts, organized by desiderata, motivations, and tensions. Requirements are marked as **Non-Negotiable** (essential for any literal code claim) or **Contested** (varying by philosophical camp). Cases from your list are abbreviated (C1–C4).

  ---

  ### **Desiderata for a Literal Genetic Code Account**
  *(Goal: Settle whether molecular biology’s "code" talk is literal or metaphorical)*

  1. **Mapping Rule Requirement**  
     - *Content:* Must specify a systematic mapping between input states (e.g., nucleotide sequences) and output states (e.g., amino acids, functions).  
     - *Motivation:* Codes require rules (e.g., codon → amino acid). Addresses **C2** (dual translation systems) and **C3** (reassigned synthetase), showing mapping can vary contextually or evolutionarily.  
     - *Status:* **Non-Negotiable**.  

  2. **Arbitrariness Requirement**  
     - *Content:* The mapping must be *arbitrary* (no physical/chemical necessity linking input to output), not stereochemical (e.g., codon affinity for amino acid).  
     - *Motivation:* Literal codes (e.g., Morse code) rely on convention, not physics. **C3** (codon reassignment) is decisive: viable reassignment implies arbitrariness. Stereochemical accounts fail here.  
     - *Status:* **Contested** (Key divide: Arbitrariness-focused vs. physicalist accounts).  

  3. **Reader-Dependency Requirement**  
     - *Content:* Coding is a property of a structure *only relative to a specific interpreter mechanism* (e.g., ribosome+tRNAs).  
     - *Motivation:* **C2** (same mRNA → two proteins) proves coding isn’t intrinsic to the string. Also excludes **C1** (binding sites) if no "interpreter" produces a distinct output.  
     - *Status:* **Non-Negotiable**.  

  4. **Misreading Possibility Requirement**  
     - *Content:* The system must allow for *errors* (e.g., misincorporation, frameshifts) that are distinguishable from correct readings.  
     - *Motivation:* Normativity ("correct" vs. "incorrect" decoding) is central to codes. **C4** (prions) may lack this: conformational spread isn’t "misread" but stochastic misfolding.  
     - *Status:* **Contested** (Naturalism worry: Does normativity imply non-physical "oughts"?).  

  5. **Heritable Information Requirement**  
     - *Content:* The structure must transmit heritable variation affecting phenotype across generations.  
     - *Motivation:* Justifies "information" language. Includes **C4** (epigenetic marks) but excludes random noise. **C3** (slower growth post-reassignment) shows fitness consequences.  
     - *Status:* **Non-Negotiable** for "genetic information" (weaker for "code" alone).  

  6. **Distinct Output Requirement**  
     - *Content:* The output must be a distinct physical product (e.g., protein) or state change, not just binding/structural stability.  
     - *Motivation:* Excludes **C1** (spacer/site with no product). Binding alone resembles a key/lock (physical fit), not decoding.  
     - *Status:* **Contested** (Inclusive accounts may accept regulatory "codes").  

  7. **Naturalistic Normativity Constraint**  
     - *Content:* Any "norm" (correct decoding) must be explainable via natural selection (e.g., fitness consequences of errors), not intrinsic meaning.  
     - *Motivation:* Avoids dualism. **C3** (reassignment reduces fitness) shows norms are evolutionarily contingent.  
     - *Status:* **Non-Negotiable** for naturalistic accounts.  

  ---

  ### **Key Tensions & Incompatibilities**
  - **Error vs. Naturalism:** Requiring misreading (**R4**) introduces normativity. If norms are grounded *only* in selection (**R7**), this is naturalistically acceptable. *But* if norms demand intrinsic "aboutness" (e.g., teleosemantics), it may conflict with physicalism.  
  - **Arbitrariness vs. Stereochemistry:** **R2** (arbitrariness) excludes stereochemical accounts (e.g., codon-amino acid affinity theories). **C3** (reassignment) is the litmus test.  
  - **Output Specificity:** **R6** (distinct output) excludes **C1**, but some argue regulatory "codes" (e.g., transcription factor binding) are literal.  

  ---

  ### **The High-Impact Requirement**
  **R2 (Arbitrariness)** excludes the most contenders:  
  - It dismisses stereochemical code theories (failing **C3**).  
  - It challenges "physical inevitability" narratives of genetic code evolution.  
  - It forces a convention-based view, making the code’s contingency essential to its literalness.  

  *Scorecard Tip:* Use **R2** as the primary filter. If an account fails arbitrariness, it can only support a *metaphorical* code. Pair with **R3** (reader-dependency) to handle contextual codes (**C2**).  

  Let me know if you want adversarial examples testing these desiderata!
