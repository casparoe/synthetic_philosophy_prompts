answer: |-
  Below is a step-by-step written procedure for your team to evaluate intervention effectiveness when combined and stratified results conflict. The procedure is designed to be completed in an afternoon using existing data, with clear stopping points for decisions. It distinguishes between non-contested arithmetic steps (✅) and potentially contested interpretation steps (⚠️), and specifies when to defer to the board. I'll then apply it to your three cases.

  ---

  ### **Procedure: Evaluating Intervention Effectiveness**  
  **Purpose**: To determine whether to act on combined (trust-wide) or stratified (e.g., ward-level) results when they conflict.  
  **Inputs**: Pre-existing aggregated and stratified data (e.g., readmission rates, mortality) for the intervention.  
  **Output**: A decision to use combined figures, stratified figures, or escalate to the board.  

  #### **Step 1: Clarify the Board’s Intended Action Scope**  
  - **Question**: "Will the improvement team deploy the intervention trust-wide or ward-by-ward?"  
  - **Sufficient Answer**:  
    - **Trust-wide**: Proceed to Step 2.  
    - **Ward-by-ward**: Skip to Step 5.  
    - **Unclear**: **STOP** and escalate to the board for clarification.  
  - **Notes**:  
    - ⚠️ This is strategic, not statistical. If scope is undefined, the data cannot resolve the conflict alone.  

  #### **Step 2: Determine if Stratification Variable is Valid**  
  - **Question**: "Is the variable we split by (e.g., ward, age band) a *pre-intervention baseline factor* (e.g., admitting specialty, age) or an *outcome-influenced factor* (e.g., ‘reached resuscitation bay’, ‘seen by therapy team’)?"  
  - **Sufficient Answer**:  
    - **Baseline factor** (unaffected by intervention): Proceed to Step 3.  
    - **Outcome-influenced factor** (affected by intervention): **USE COMBINED FIGURES**. Stop.  
    - **Unclear**: Default to combined figures and flag uncertainty.  
  - **Notes**:  
    - ⚠️ Classifying variables is clinically contextual and contested. Example:  
      - ✅ *Baseline*: Age, admitting specialty (fixed at admission).  
      - ✅ *Outcome-influenced*: "Reached resuscitation bay" (screening may route patients there).  
      - When in doubt, combined figures are safer.  

  #### **Step 3: Check Effect Consistency Across Strata (Arithmetic)**  
  - **Question**: "Is the intervention effect direction (beneficial/harmful) consistent across all strata?"  
  - **Method**: Calculate effect size (e.g., risk difference, odds ratio) for each stratum.  
  - **Sufficient Answer**:  
    - **Consistent** (e.g., benefit in all wards): **USE COMBINED FIGURES**. Stop.  
    - **Inconsistent** (e.g., benefit in some wards, harm in others): Proceed to Step 4.  
  - **Notes**:  
    - ✅ Purely arithmetic (no interpretation). Inconsistency defined as opposing effect directions.  

  #### **Step 4: Assess if Inconsistency is Due to Chance (Arithmetic)**  
  - **Question**: "Do confidence intervals (CIs) for stratum-specific effects overlap substantially?"  
  - **Method**:  
    - Calculate 95% CIs for each stratum’s effect size.  
    - Check for CI overlap: If all CIs overlap, inconsistency may be due to random variation.  
  - **Sufficient Answer**:  
    - **CIs overlap**: **USE COMBINED FIGURES** (with caveat: inconsistency likely noise). Stop.  
    - **CIs do not overlap** (e.g., one stratum’s benefit excludes another’s harm): **USE STRATIFIED FIGURES**. Stop.  
  - **Notes**:  
    - ✅ Arithmetic using existing data. Overlap heuristic is practical but ⚠️ *contested* (statisticians prefer formal interaction tests).  

  #### **Step 5: For Ward-by-Ward Deployment, Prioritize Stratified Data**  
  - **Question**: "Do ward-specific effects show actionable patterns (e.g., consistent harm/benefit)?"  
  - **Sufficient Answer**:  
    - **Yes** (e.g., benefit in 80% of wards): **USE STRATIFIED FIGURES**. Stop.  
    - **No** (e.g., extreme variability with no pattern): **ESCALATE TO BOARD** for target prioritization.  
  - **Notes**:  
    - ⚠️ "Actionable patterns" require clinical judgment. Use predefined rules (e.g., "benefit in >60% of wards").  

  ---

  ### **Application to Your Cases**  
  *Assumptions*:  
  - Data includes 95% CIs for all effects.  
  - "Sufficient answer" criteria met unless noted.  

  #### **Case 1: Discharge Pathway (30-Day Readmissions)**  
  - **Observation**: Combined figures show reduced readmissions; stratified by admitting specialty shows no benefit.  
  - **Procedure**:  
    1. **Step 1**: *Trust-wide deployment* (assumed).  
    2. **Step 2**: Admitting specialty is a **baseline factor** (fixed at admission). → Proceed.  
    3. **Step 3**: **Inconsistent** (combined benefit vs. no benefit in specialties). → Proceed.  
    4. **Step 4**: If CIs for specialty-specific effects include the combined effect (likely, as benefit "disappears"), **CIs overlap**. → **USE COMBINED FIGURES** (but note inconsistency may be noise).  
  - **Conclusion**: Report trust-wide benefit, but flag specialty-level uncertainty.  

  #### **Case 2: Virtual Ward Scheme**  
  - **Observation**: Combined figures show benefit; stratified by age band shows no benefit.  
  - **Procedure**:  
    1. **Step 1**: *Trust-wide deployment* (assumed).  
    2. **Step 2**: Age band is a **baseline factor**. → Proceed.  
    3. **Step 3**: **Inconsistent** (combined benefit vs. no benefit in age bands). → Proceed.  
    4. **Step 4**: If CIs for age-band effects include zero (no effect) and overlap with each other → **USE COMBINED FIGURES** (inconsistency likely noise).  
       - *Caveat*: If CIs are narrow and exclude the combined effect, **USE STRATIFIED FIGURES** (no benefit in any age band).  
  - **Conclusion**: Combined figures can be used, but stress that age bands show null effects.  

  #### **Case 3: Sepsis Screening Tool**  
  - **Observation**: Only split is "reached resuscitation bay," which the screening affects.  
  - **Procedure**:  
    1. **Step 1**: *Trust-wide deployment* (assumed).  
    2. **Step 2**: "Reached resuscitation bay" is **outcome-influenced** (screening changes patient flow). → **USE COMBINED FIGURES**. Stop.  
  - **Conclusion**: Combined figures are valid; stratified results are misleading.  
  - **If Board Wants Ward-by-Ward**:  
    - **Step 5**: Without ward-level data, **ESCALATE TO BOARD**. Note: "No ward-split data; cannot stratify safely."  

  ---

  ### **Key Procedural Safeguards**  
  - **Unresolvable Conflicts**: Escalate to the board when:  
    - Action scope is unclear (Step 1).  
    - Ward-by-ward deployment has no actionable pattern (Step 5).  
    - Variable classification is ambiguous (Step 2).  
  - **Contested Steps**:  
    - ✅ Non-contested: Steps 3–4 (arithmetic), Step 1 (scope clarification).  
    - ⚠️ Contested: Step 2 (variable classification), CI overlap heuristic (Step 4).  
  - **Time Efficiency**: Uses existing numbers only; requires no new data collection.  

  This procedure prioritizes transparency, defensibility, and alignment with the board’s operational intent. For the sepsis case, the answer is clear-cut; the discharge and virtual ward cases require cautious reporting of combined figures with stratified context.
