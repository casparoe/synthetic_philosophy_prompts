prompt: |-
  I work in the clinical effectiveness team of a large NHS trust, and four times a year I put a report in front of the board that decides where a small improvement team is sent next. I keep hitting the same problem in a form I have never seen it usefully explained in: the combined figures say an intervention worked, the figures split by ward say it did not, or the other way round, and I then have to tell a room of non-specialists which number to act on. I have been reading about this on my own and I think I follow the basic idea of Simpson's paradox, but two things still defeat me. First, one of our statisticians keeps saying that splitting by a variable the intervention itself changes — whether a patient was well enough to be seen by the therapy team, for instance — can manufacture a reversal rather than uncover one, so that the combined figure is the honest one; I cannot tell in advance which kind of variable I am splitting by. Second, it seems to matter whether the board will act trust-wide or ward-by-ward, and I do not know how to make that a step in the rule rather than an excuse afterwards.

  Please turn this into a written procedure my team can run in an afternoon, using only the numbers we already hold, and which a clinical director can sign off on and lay governors can follow. Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops and tells me to use the combined figures, where it tells me to stratify, and where it hands the decision back to people because what is unsettled is what we are trying to do rather than what the data say. Please mark clearly which steps are arithmetic that nobody disputes and which rest on views that are genuinely contested among people who study this, so I do not present a contested reading to the board as if it were agreed.

  Then run it on three cases from our last cycle: a discharge pathway whose apparent reduction in thirty-day readmissions disappears entirely once you split by admitting specialty; a virtual ward scheme I argued for, whose benefit shows up only in the combined figures and not within any age band; and a sepsis screening tool where the only split available is by whether the patient reached the resuscitation bay, which the screening itself affects. I would rather you told me plainly if one of these has no answer the procedure can defend.
reasoning: |-
  We are going to devise a procedure to handle the situation where aggregated data and stratified data (by ward or other factors) show conflicting results. The procedure will help decide whether to trust the combined figure or the stratified figures, and when to hand the decision back to the board based on the intended action (trust-wide or ward-by-ward). We note that splitting by a variable that is affected by the intervention can create a spurious reversal (Simpson's paradox in reverse) and that the intended scope of the intervention (trust-wide or per ward) matters.

  The procedure will be a series of questions. We will mark steps that are arithmetic (and non-contested) and steps that involve interpretation (which might be contested).

  **Procedure for Deciding Between Combined and Stratified Figures**

  1. **Clarify the Intended Scope of Intervention (Non-Arithmetic, Strategic Decision)**
     - Ask: "Will the next improvement team be deployed trust-wide or ward-by-ward (or specialty-by-specialty, etc.)?"
       - If trust-wide, then the combined (overall) effect is of primary interest.
       - If ward-by-ward, then we need to look at the effects within each ward (stratified) and consider the variability.
     - *Note: This step is not about the data but about the planned action. It is a strategic decision that the board should make. If this is not decided, the procedure stops and we ask the board to clarify their intent.*

  2. **Identify the Stratification Variable (Non-Arithmetic, Subject-Matter Driven)**
     - We consider splitting by a particular variable (e.g., ward, age band, admitting specialty) only if it is a potential confounder or effect modifier. We must avoid variables that are intermediate (affected by the intervention).
     - Ask: "Is the variable we are splitting by (e.g., ward) a pre-intervention characteristic (like admitting specialty at admission) or an intermediate outcome (like whether the patient was seen by the therapy team, which might be influenced by the intervention)?"
       - If the variable is an intermediate (affected by the intervention), then we should not split by it because it can induce bias (this is the point your statistician made). In this case, the combined figure is the honest one. Proceed with the combined figure.
       - If the variable is a pre-intervention characteristic (e.g., fixed at baseline, like age band, admitting specialty at admission) then we can consider splitting by it. Go to step 3.
       - If uncertain, consult a statistician. (But note: we are creating a procedure for an afternoon without a statistician. If in doubt, default to combined and note the uncertainty.)

  3. **Check for Consistency of Effect Across Strata (Arithmetic)**
     - If we are splitting by a pre-intervention variable, we now look at the effect within each stratum (e.g., each ward). We want to see if the effect is consistent in direction and magnitude.
     - Ask: "Is the direction of the effect (beneficial or harmful) the same in every stratum?"
       - If yes, then the stratified analysis confirms the combined effect. We can use the combined figure (which is a weighted average) and note that the effect is consistent.
       - If no (i.e., the effect is in opposite directions in different strata) or if the effect is absent in some strata but present in others, then we have a situation where the combined figure may be misleading. We must then look at the next question.

  4. **Assess the Magnitude of Variability (Arithmetic)**
     - When the effect is not consistent, we must see if the variability is due to chance or if it is substantial.
     - We can compute the range of effects and the confidence intervals within each stratum. However, note that with small numbers in some strata, the confidence intervals might be wide.
     - Ask: "Do the confidence intervals for the effect in each stratum overlap substantially?"
       - If yes, then the observed variability might be due to chance. We can then use the combined figure (with caution) but note the uncertainty. Alternatively, we can use a random-effects model to combine the strata (but that may be beyond an afternoon procedure). Given the constraints, we might present both and note that the combined figure is the best estimate but with variability.
       - If no (i.e., the confidence intervals do not overlap and there is a clear reversal) then we have a strong indication of effect modification. We must then report the stratified results and not rely on the combined figure.

  5. **Decision Based on Scope and Findings**
     - If the intended scope is trust-wide and:
          - The variable is intermediate: use combined.
          - The variable is pre-intervention and the effect is consistent: use combined.
          - The variable is pre-intervention and the effect is inconsistent but variability is due to chance: use combined (with caution).
          - The variable is pre-intervention and the effect is inconsistent and variability is substantial (non-overlapping CIs): then we have a problem. The intervention may be beneficial in some wards and harmful in others. We must not roll it out trust-wide without understanding the reasons. Hand the decision back to the board with the recommendation to investigate further.
     - If the intended scope is ward-by-ward:
          - We must use the stratified figures because the board will act per ward. However, if the effects are highly variable, we must also note that the intervention might not be equally effective in every ward. We should present the ward-specific effects and let the board decide which wards to target.

  **Summary of the Procedure**

  1. Decide on the intended scope (trust-wide or ward-by-ward). If unclear, get clarification.
  2. For the stratification variable: if it is intermediate (affected by the intervention), use combined. If pre-intervention, proceed.
  3. Check consistency of effect direction across strata. If consistent, use combined. If not, proceed.
  4. Check if the variability is beyond chance (non-overlapping CIs). If beyond chance, use stratified and warn about effect modification. If due to chance, use combined with caution.
  5. Finally, if the intended scope is ward-by-ward, then we must use stratified figures regardless (unless the variable is intermediate, then we don't split and use combined) but with the caveats from steps 3 and 4.

  **Contested Points:**
  - Step 2 (identifying intermediate vs. pre-intervention) is subject-matter dependent and might be contested. The procedure requires clinical input to decide this.
  - Step 4: The use of confidence interval overlap is a heuristic and not a formal test. Statisticians might prefer a formal test of interaction. However, in an afternoon procedure, we use this as a practical rule.

  Now, let's apply the procedure to the three cases:

  **Case 1: Discharge Pathway (30-day readmissions)**
  - **Intervention:** Discharge pathway.
  - **Observation:** Combined figures show a reduction in 30-day readmissions, but when split by admitting specialty, the effect disappears (i.e., within each specialty, there is no reduction).
  - **Intended Scope?** Let's assume the board is considering trust-wide rollout (but we must ask). We'll proceed for both possibilities for illustration.

    Step 1: Intended scope? (We don't know, so we must ask. But for the sake of example, let's assume trust-wide for now.)
    Step 2: The stratification variable is "admitting specialty". Is this pre-intervention? Yes, because the specialty is determined at admission and not by the discharge pathway. So we proceed.
    Step 3: The effect within each specialty is null (no reduction). But the combined effect is positive. This is inconsistent. So we go to step 4.
    Step 4: We look at the confidence intervals for the effect in each specialty. If the confidence intervals for the reduction in each specialty include 0 (which they do, because the effect is null) and also include the combined effect? We see that the combined effect is positive but within each specialty it is null. This is classic Simpson's paradox. The variability is not due to chance? Actually, the combined effect might be due to a change in the mix of specialties (e.g., more patients in specialties with lower readmission rates). Since the effect is null in every stratum, we must conclude that the intervention did not work within any specialty. The combined effect is misleading. We should not use it.

    Therefore, for trust-wide rollout: we have an inconsistent effect and the stratified analysis shows no benefit. We should not use the combined figure. The procedure would say: use the stratified figures and conclude that the intervention did not work within any specialty. The board should not roll it out trust-wide because the apparent benefit is due to a shift in the case-mix.

    If the intended scope were ward-by-ward (or specialty-by-specialty): then we would look at each specialty and see no benefit, so we would not deploy the improvement team to any specialty.

  **Case 2: Virtual Ward Scheme**
  - **Intervention:** Virtual ward scheme.
  - **Observation:** Combined figures show a benefit, but within each age band, there is no benefit.
  - **Intended Scope?** We assume trust-wide.

    Step 1: Trust-wide.
    Step 2: Stratification variable is age band. Pre-intervention? Yes (age is fixed). Proceed.
    Step 3: The effect is not present in any age band? Then the combined effect is positive but the stratified effects are null. This is inconsistent. Go to step 4.
    Step 4: We check the confidence intervals for the effect in each age band. They should all include 0 (since no effect) and also might include the combined effect? If the confidence intervals are wide and overlap with the combined effect, then we might attribute it to chance. However, if we see that the combined effect is positive and the within-age effects are all null, then we must consider that the combined effect might be due to a change in the age distribution (e.g., more patients in age bands that naturally do better). Since the within-age effects are null, we cannot claim the intervention works for any age group. Therefore, the combined effect is misleading.

    However, note: it is possible that the intervention has a small effect in each age band that is not detected due to small numbers (low power). But the procedure in step 4 uses the confidence interval overlap. If the confidence intervals in each age band are wide and include the combined effect, then we can attribute the inconsistency to chance. But if they are tight and don't include the combined effect, then we have a problem.

    Without specific numbers, we have to assume that the effect is exactly zero in each age band. So the confidence intervals for each age band would not include the combined effect (if the combined effect is positive and the within-age effects are zero). Therefore, we would conclude that the variability is beyond chance and that the combined figure is misleading. We would report the stratified results: no benefit in any age band.

    But note: this contradicts the combined figure. Therefore, we must not use the combined figure. We would tell the board that the intervention does not show benefit in any age band and the apparent combined benefit is due to a shift in the age distribution (or other factors). Thus, we would not recommend trust-wide rollout.

    However, if the board intended ward-by-ward (but note: the split is by age, not ward) then we have a problem because the split variable is not ward. We would have to split by ward and then by age? This case is split by age, so it doesn't directly address wards. We might need to re-run the analysis by ward? But the problem states that the only split we have is by age. So for ward-by-ward, we don't have the data. We would have to use the combined figure by ward? But we don't have that. So we must note that we cannot split by ward. The procedure would then require the combined figure for each ward? But we don't have that. This is a data limitation.

    Since the question says "the only split available" is by age, then for ward-by-ward deployment, we have no ward-specific data. We would have to use the combined trust-wide figure and note the limitation. But that is not ideal. Alternatively, we might have to collect ward-specific data. But the procedure requires using existing numbers.

    Therefore, for this case, if the intended scope is ward-by-ward and we don't have ward-level data, we cannot proceed. We must tell the board that we lack the necessary data to make a ward-by-ward decision and that we only have age-stratified data. We then have to rely on the trust-wide combined figure (with caution) and note that we found no benefit by age band. This is not satisfactory. We should recommend collecting ward-level data.

  **Case 3: Sepsis Screening Tool**
  - **Intervention:** Sepsis screening tool.
  - **Observation:** The only split available is by whether the patient reached the resuscitation bay, and the screening itself affects that variable.
  - **Intended Scope?** Trust-wide.

    Step 1: Trust-wide.
    Step 2: The stratification variable is "whether the patient reached the resuscitation bay". This is an intermediate variable because the screening tool might lead to more patients being sent to the resuscitation bay. So we should not split by it. Therefore, we use the combined figure.

    Thus, we ignore the stratified figures and use the combined figure. The combined figure is the honest one.

    If the intended scope were ward-by-ward? We would still not split by this intermediate variable. We would use the combined figure for each ward? But note: the split variable is not ward. We would have to have ward-specific combined figures. We don't know if we have that. The problem says the only split available is by resuscitation bay. So we don't have ward-specific data. We would have to use the trust-wide combined figure for each ward? That doesn't make sense. We are stuck.

    Therefore, for ward-by-ward, we would need ward-level combined data. If we don't have it, we can't do the split. We must use the trust-wide combined figure and note the limitation.

  **Conclusion for the Three Cases:**

  - **Case 1 (Discharge Pathway):** We have a clear answer: the stratified figures (by admitting specialty) show no effect. We should not use the combined figure. The intervention did not work within any specialty. Therefore, we do not recommend rollout (whether trust-wide or specialty-by-specialty).
  - **Case 2 (Virtual Ward):** We have a problem. The stratified figures (by age) show no effect. The combined figure shows an effect. We conclude that the intervention does not work in any age band and the combined effect is due to a shift in age distribution. We do not recommend trust-wide rollout. For ward-by-ward, we lack ward-level data so we cannot make a ward-by-ward decision. We must collect more data.
  - **Case 3 (Sepsis Screening):** We should use the combined figure because the split variable is intermediate. We ignore the stratified figures. For trust-wide, we use the combined. For ward-by-ward, we need ward-level combined data. If we don't have it, we can only use the trust-wide combined figure and note that we cannot assess ward-by-ward.

