  Vote | 5 | Vote by show of hands. | "Vote: Should we design systems to do exactly what the operator requests, or to do what is good for the user, even if it deviates?" | Split vote. | None

  Total time: 5+5+2+10+5+3+10+5+5+25+5 = 80 minutes. We are over by 5. We can adjust by shortening the build rounds to 8 minutes each? Or the debrief? Let's see.

  Alternatively, we can do two sessions: first session up to Round 1, then second session Round 2 and debrief. But the user said one session is 75 minutes. So we adjust:

  - Introduction: 5 min
  - Client write: 3 min (we say: be quick)
