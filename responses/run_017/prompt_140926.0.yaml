  We are designing an activity for two 75-minute sessions (as the user is open to two if necessary). However, we'll aim for one session and see if we can fit it. If not, we'll adjust.

  Activity Title: The Room Arrangement Game

  Overview:
  The class is divided into three roles: 
  - Client (1 student)
  - User (1 student)
  - Build Teams (the rest, divided into 2-4 teams, each with 4-5 students)

  The task: Arrange the room (furniture, objects) to meet a specification provided by the Client. The User will then experience the arrangement and judge it.

  Materials: 
  - Index cards (for specs and feedback)
  - Sticky notes (for labels, marking spots)
  - Markers (for writing)
  - String (to mark areas, tie things)
  - Scissors (to cut string, etc.)
  - Whiteboard (to display scores, rules)

  Restricted Language: 
  The Client must write the specification using only 10 words. They cannot use any words that directly describe the User's experience (e.g., "comfortable", "efficient", "good") or any words that are outcomes (e.g., "happy", "productive"). They can only use procedural words (verbs like "place", "move", "arrange"; nouns like "table", "chair"; prepositions like "near", "far"; numbers). 

  The Build Teams must execute exactly the written specification without asking any questions once the spec is handed over.

  Round 1: 
  - Build Teams are scored solely on compliance with the Client's written spec. 
  - A neutral facilitator (you) checks each team's arrangement against the spec and gives a compliance score (0-10). 
  - The User's experience is recorded on a scale of 1-5 (by the User) but not revealed and not counted.

  Round 2:
  - The same Build Teams get the same spec and same task (they can rearrange the room again, but they must use the same spec).
  - This time, the score is 50% compliance (same as before) and 50% the User's rating (which is now revealed and normalized to 10 points for the same 1-5 scale: so if the User rated 5, that becomes 10 points; 2.5 becomes 5 points, etc.). 
  - However, we rig it so that the arrangement that got the highest compliance in Round 1 is likely to be bad for the User in Round 2.

  The Rig:
  - The room has some fixed features (e.g., a window with a view, a door, a whiteboard, a table, chairs, etc.). 
  - The User is secretly given a preference: e.g., they are playing the role of someone who is claustrophobic and thus prefers open spaces near the window, or they are a presenter who needs to be near the whiteboard and have the audience facing them. 
  - The Client is not told about the User's preference. 
  - The Client writes a spec that might be ambiguous or incomplete relative to the User's needs. 
  - Example: The Client writes: "Place 5 chairs near table. Place table center." 
    - Round 1: Teams that put the table in the center and exactly 5 chairs near it get high compliance. 
    - But if the User is claustrophobic, they might hate being in the center away from the window. Or if they are the presenter, they might need the table and chairs arranged so that everyone faces the whiteboard (but the spec doesn't say that).

  The Moment of Missing Intent:
  After Round 1, when the Client sees the arrangements, they might say: "That's not what I meant!" because they realize they forgot to specify the orientation or the distance from the window. But they couldn't have specified it in advance because they didn't think of it until they saw the result.

  Roles Assignment:
  - 1 Client (chosen from either CS or Phil, but not a team member)
  - 1 User (same)
  - The rest (16 students) divided into 4 teams of 4 (or 3 teams of 5-6 if needed). 

  Setup:
  - Rearrange the room so there is a clear space to move furniture. 
  - Have the furniture: a table, 6 chairs (so that using 5 is specific), a trash can, a plant, etc. 
  - Mark the window and whiteboard as fixed features.

  Rules as Read Aloud:

  "Welcome to the Room Arrangement Game. We have three roles: Client, User, and Build Teams. The task is to arrange the room according to the Client's specification. 

  Here are the rules:
  1. The Client will write a specification for how to arrange the room. The spec must be exactly 10 words. The Client cannot use any words that describe the User's experience (like comfortable, good, happy) or outcomes. Only procedural words (like place, move, chair, table, near, center, etc.). 

  2. The Build Teams (multiple teams) will each receive a copy of the same spec. Once the spec is handed out, the Client may not answer any questions. The Build Teams must work only from the written spec. 

  3. Each team will arrange the room in 10 minutes. They can use the materials (string, sticky notes) to mark positions. 

  4. Round 1 Scoring: Each team's arrangement will be scored by me, the facilitator, solely on compliance with the Client's written spec. I will check each requirement and give a score from 0 to 10. The User will also experience each arrangement and rate it on a scale of 1-5 (5 being best), but this rating will not be revealed and will not affect the Round 1 score.

  5. After Round 1, we will reset the room to the original state. Then, Round 2: same spec, same teams. But this time, the score will be 50% compliance (same as Round 1) and 50% User rating. The User rating will be normalized to a 10-point scale (so if the User gives a 5, that becomes 10 points; 3 becomes 6, etc.). 

  6. The team with the highest total score in Round 2 wins.

  Now, let's assign roles: [Assign one Client and one User. Divide the rest into teams.] 

  Client, here is your task: You are arranging the room for a seminar. The User is the seminar leader. Write your 10-word spec now. Remember: no outcome words, only procedural. You have 5 minutes. [Hand the Client an index card and marker.]

  [After the Client writes the spec, make copies for each team. Then:]

  Build Teams, you have 10 minutes to arrange the room according to the spec. Go!

  [After Round 1, record compliance scores and User ratings secretly. Reset the room. Then:]

  Now, Round 2: same spec, same task. You have 10 minutes again. Go!

  [After Round 2, reveal the User's ratings from Round 1 and Round 2 (but note that in Round 2 the User rates again, so it might change). Calculate the scores: Round 2 total = (Round 1 compliance score * 0.5) + (User rating * 2). Why? Because we want the User rating to be out of 10: so if the User rates 5, that becomes 10 points and then multiplied by 0.5 weight? Actually, we can do: total = (compliance score * 0.5) + (User rating * 2) [because User rating is 1-5, so multiplied by 2 to get 2-10, then weighted 50%]. But note: the compliance score is 0-10 and User rating becomes 0-10 (by multiplying by 2) and then we take 50% of each? Actually, we can do: total = (compliance score + (User rating * 2)) / 2? That would be the same as 50% each. But let's keep it simple: Round 2 score = (compliance score * 0.5) + (User rating * 2) [which is 0.5*10 + 2*5 = 5+10=15? That doesn't add up]. We want both components to be out of 5? Alternatively, we can rescale: Round 2 score = (compliance score * 0.5) + (User rating * 2) [so max 5 + 10 = 15]. Then we can report out of 15. Or we can normalize both to 10? Actually, let's do:

  Round 1: Compliance score (0-10) is the only score.

  Round 2: Score = (Compliance score from Round 1? or do we re-score compliance in Round 2?) Wait, we must re-score compliance in Round 2 because the arrangement might be different. So:

  Round 2:
  - Compliance score (0-10) by facilitator
  - User rating (1-5) converted to 0-10 by multiplying by 2
  - Total = (Compliance score * 0.5) + (User rating * 2 * 0.5) = (Compliance score + User rating * 2) * 0.5? Actually, to make it 50% each: 
     Total = (Compliance score * 0.5) + (User rating * 2) * 0.5 = (Compliance score * 0.5) + (User rating) 

  But then the User rating is only 1-5 and compliance is 0-10, so that doesn't balance. We want both to be on the same scale. So:

  Alternative: 
  - In Round 2, we score compliance again (0-10) and we have User rating (1-5). Then we convert User rating to 0-10 by multiplying by 2. Then the total score is the average: (compliance + user_rating*2) / 2. This gives a score from 0 to 10.

  But note: we want Round 1 to be won by the team with highest compliance, and Round 2 to be won by a team that might have lower compliance but higher user rating. And we want the same arrangement that won Round 1 to lose Round 2? Actually, the teams will do two arrangements? They might change. But we rig so that the arrangement that got high compliance in Round 1 is bad for the user.

  Reveal:
  After Round 2, we reveal the User's preferences (which were secret until now) and the User's ratings for both rounds. We also show the scores.

  Debrief:
  Map to:
  (a) The written objective being the wrong objective: The spec was about placing chairs and table, but the User needed something else (like facing the whiteboard). So the objective (compliance) was not the real goal.
  (b) The scoring rewarding the proxy (compliance) rather than the thing (user satisfaction) in Round 1, and then in Round 2 we added the real goal.
  (c) The operator's intent (Client) being partly constituted by what the system shows: After seeing the arrangements, the Client realizes they should have specified more, but they didn't know to specify it until they saw the problem.
  (d) A system perfectly aligned to the client's intent (high compliance) that is bad for the user.

  Vote: 
  "By show of hands: In designing a system, should we focus primarily on making sure it does exactly what the operator asks? Or should we focus on making sure it does what is good for the user, even if that means sometimes deviating from the operator's request?"

  Expected split: CS majors might lean toward the first (because of precision, specification), philosophy toward the latter (because of values).

  Now, the run-sheet:

  Phase | Minutes | What participants do | Facilitator's script | The failure this phase is rigged to produce | The debrief line that names it later
  ------|---------|----------------------|----------------------|------------------------------------------|-----------------------------------
  Introduction | 5 | Listen | "Welcome to the Room Arrangement Game. We will have two rounds. Roles: Client, User, Build Teams. The task is to arrange the room for a seminar. Client writes a 10-word spec without outcome words. Build Teams follow the spec without asking questions. Round 1 scored only on compliance. Round 2 scored on compliance and user rating. Assigning roles now." | None | None
  Client writes spec | 5 | Client writes spec on index card. | "Client: Write a 10-word spec. Only procedural words. No outcome words. Example: 'Place table center. Put 5 chairs near.'" | The spec will be under-specified relative to the User's needs. | (a) The written objective was the wrong objective because it didn't capture the user's true needs.
  Distribute spec | 2 | Facilitator copies spec and gives to teams. | "Build Teams: Here is the spec. You have 10 minutes. No questions to the Client. Go!" | Teams will interpret the spec literally and may miss the unstated needs. | (b) Round 1 scoring rewards the proxy (compliance) and not the real goal (user satisfaction).
