  ### **Why Two Sessions?**  
  - **Session 1 (75 min)**: Intro, Round 1, Client reaction, Round 2 setup (ends after Round 2 build).  
  - **Session 2 (75 min)**: Round 2 scoring, reveal, debrief, vote.  
  - **Critical for**: Letting the "intent insufficiency" sink in and avoiding rush.  

  This design forces students to *experience* the gap: intent alignment feels necessary (Round 1), then insufficient (Round 2), with the same spec and teams. The debrief explicitly ties to your four distinctions without using technical terms.
