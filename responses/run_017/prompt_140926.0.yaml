answer: |-
  ### Activity Design: "The Room Setup Challenge"  
  *Two 75-minute sessions recommended (total 150 minutes) to ensure depth and reflection. If compressed to one session, trim Round 2 build time and debrief.*

  ---

  ### **Setup and Roles**  
  - **Client**: 1 student (e.g., a philosophy major).  
  - **User**: 1 student (e.g., a CS major).  
  - **Build Teams**: 4 teams of 4 students each (mix CS/philosophy).  
  - **Task**: Arrange the room to create a "collaborative seminar space" using furniture (tables, chairs), sticky notes, string, and markers.  
  - **Restricted Spec Language**:  
    - Client’s spec limited to **8 words**.  
    - Banned words: "comfortable," "accessible," "good," "easy," "effective" (outcome-focused terms).  
    - Allowed: Procedural terms only (e.g., "place," "attach," "near," "3 chairs," "circle").  

  ---

  ### **Rules Read Aloud**  
  > "Welcome! Today’s challenge: Design a seminar space. Here’s how it works:  
  > 1. **The Client** will write an 8-word instruction for the room setup. They cannot speak to anyone after submitting it.  
  > 2. **Build Teams** will use only these instructions to arrange the room. No questions to the Client or User.  
  > 3. **Round 1**: Teams are scored *only* on **compliance with the Client’s written spec**.  
  > 4. **Round 2**: Teams repeat the task with the same spec. Scores now include **the User’s experience**.  
  > 5. **Materials**: Furniture, sticky notes (for labels), string (to mark zones), markers. No laptops.  
  > Time per round: 15 minutes. Go!"  

  ---

  ### **Scoring**  
  - **Round 1**:  
    - Compliance score (0–10): 1 point per spec element fulfilled (e.g., "place 4 chairs" = 1 element).  
    - *User’s experience recorded secretly (1–5 scale) but not counted*.  

  - **Round 2**:  
    - Score = `(Compliance × 0.5) + (User Rating × 10 × 0.5)`  
    - *Example: Compliance=8/10, User Rating=2/5 → Score = (8×0.5) + (2×2×0.5) = 4 + 2 = 6/10*.  

  ---

  ### **The Rig**  
  - **User’s Secret Need**: The User has a hidden mobility constraint (e.g., uses a cane; revealed only in debrief).  
  - **Client’s Spec Trap**:  
    - *Example spec*: "Arrange chairs circle table near door."  
    - **Round 1 Win**: Teams placing chairs in a tight circle near the door score high compliance.  
    - **Round 2 Loss**: Tight circle blocks movement; User rates it low (cannot navigate).  
  - **Intent Revelation**: After Round 1, the Client sees arrangements and says, *"But I didn’t mean for it to block the walkway!"*—unable to articulate "spacious paths" in advance.  

  ---

  ### **Debrief Sequence**  
  **(Map to core distinctions)**  
  1. **Written objective vs. real need** (a):  
     > "In Round 1, teams aced the spec—so why did the User hate it?"  
     → *"The spec measured placement, not usability."*  

  2. **Proxy vs. target** (b):  
     > "Round 1 scored chairs near the door. Round 2 revealed that ‘near door’ was a proxy for ‘accessibility’—but did it work?"  
     → *"The proxy rewarded proximity, not actual access."*  

  3. **Intent shaped by possibility** (c):  
     > "Clients: When you saw the circle blocking the path, you realized you wanted ‘space to move.’ Why not write that initially?"  
     → *"You didn’t know that need until you saw the system’s limitations."*  

  4. **Aligned but harmful** (d):  
     > "A team followed the spec perfectly in Round 1. Did that help the User?"  
     → *"Perfect alignment to the Client’s words created a barrier for the User."*  

  5. **Vote**:  
     > "Should we design systems to follow instructions exactly, or to prioritize the user’s well-being even if it bends the rules?"  
     - **Expected Split**: CS majors favor "follow instructions" (precision/reliability); Philosophy majors favor "prioritize well-being" (ethics/context).  

  ---

  ### **Run-Sheet Table**  
  | Phase              | Minutes | What Participants Do                                                                 | Facilitator’s Script                                                                                                | Rigged Failure                                                                 | Debrief Line                                      |  
  |--------------------|---------|--------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|---------------------------------------------------|  
  | Intro/Roles        | 5       | Listen; Client/User selected.                                                       | "Roles: Client writes an 8-word spec. Build Teams execute it. User experiences results."                            | None                                                                           | —                                                 |  
  | Client Writes Spec | 5       | Client drafts spec (8 words, procedural only).                                      | "No outcome words. Only actions. Example: ‘Place 4 chairs near table.’" (Hand index card.)                          | Spec omits critical needs (e.g., space).                                       | (a) Written objective was wrong.                  |  
  | Round 1 Build      | 15      | Teams arrange room per spec (e.g., tight circle near door).                          | "Build! No talking to Client/User."                                                                                 | Compliance forces neglect of unstated needs (e.g., mobility).                 | (d) Aligned to intent, bad for user.              |  
  | Round 1 Score      | 10      | Facilitator scores compliance; User rates secretly.                                  | "Round 1 scores: Compliance only. User ratings hidden." (Display compliance scores.)                                | High compliance ➞ poor user experience.                                       | (b) Scoring rewarded the proxy.                   |  
  | Client Reaction    | 5       | Client views arrangements; expresses frustration ("Not what I meant!").              | "Client, what do you think?"                                                                                        | Client can’t articulate missing intent preemptively.                           | (c) Intent shaped by seeing the system.           |  
  | Round 2 Build      | 15      | Teams re-build with same spec (some add "hidden" fixes, e.g., widening paths).       | "Same spec! Build again."                                                                                           | Fixes may reduce compliance (e.g., chairs farther from door).                  | (a) Proxy vs. target conflict.                    |  
  | Round 2 Score      | 10      | Compliance re-scored; User rates openly. Final score = 50% compliance + 50% user.    | "Round 2: Compliance AND user ratings count. User, explain your rating." (Reveal secret mobility constraint.)       | Round 1 winner loses (high compliance ➞ low user rating).                     | (b) Proxy failed; real target exposed.            |  
  | Debrief/Vote       | 20      | Discuss tensions; vote.                                                              | "Why did the same spec succeed in Round 1 but fail in Round 2? Vote: Follow instructions or prioritize user?"       | Split vote along disciplinary lines.                                           | All distinctions integrated.                      |  

  ---

  ### **Structured Output**  
  ```json
  {
    "rigged_parameters": [
      {
        "parameter": "spec_word_limit",
        "value": 8,
        "reason": "Forces under-specification; brevity prevents describing outcomes. Increase: Specs become functional. Decrease: Teams ignore constraints."
      },
      {
