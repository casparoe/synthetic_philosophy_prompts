prompt: |-
  I write on science and ideas for a general-interest magazine, and I am finishing a 1,200-word feature on what two decades of cross-cultural work on folk morality should do to our confidence in moral objectivity. I have the relevant literature to hand and have already interviewed two of the researchers, so I do not need citations, a reading list, or any further factual legwork from you. What I need is for the argument's load-bearing joints to be tested before I file.

  The spine of my draft is this: the cross-cultural record shows that people in small-scale, non-industrial societies diverge sharply from Western, educated, industrialized, rich and democratic respondents on everything from how money is split in anonymous economic games to which harms call for punishment, and that some of the researchers explain the pattern by pointing to variables like market integration, payoffs to cooperation with strangers, kinship institutions and the presence of a world religion. My kicker is that moral objectivity has something like a half-life: the more the world disagrees with you about a case, the less you have a fact and the more you have a preference, and that Western moral confidence is therefore, in part, a sampling artifact.

  To carry that, I want a device: a divergence score. Take twenty or so moral propositions and vignettes of the kind that appear in this literature — hypothetical trolley-style harms, divisions of money in anonymous games, duties to kin versus duties to strangers, harmless-but-offensive acts, promises that have become costly to keep — and for each one, take the modal verdict in a WEIRD sample as the baseline, then score it by the share of sampled societies whose modal verdict differs. Anything above about forty percent I would report as local, meaning not a candidate for objective truth. Rendered as a graphic with a draggable threshold, readers could watch objectivity dissolve as they move it. There is also a practical upshot I want to draw: because WEIRD respondents are the outliers on so many measures, philosophers who treat intuition as evidence, and editors who treat certain verdicts as obvious, should discount accordingly — call it a double discount on any moral claim whose intuitive support comes mainly from WEIRD subjects.

  Before I build it, I want to know whether the device does what I am claiming it does, and whether the step from persistent cross-cultural disagreement to no fact of the matter needs a premise I have not supplied. If the frame is broken, tell me where the break is rather than helping me tune the threshold; I would rather run an honest eight hundred words than a clever twelve hundred. Two lines from the draft that I am fond of and half-suspect are indefensible: moral objectivity has a half-life, the more the world disagrees the less you have a fact and the more you have a preference; and if your sample is WEIRD, your ethics are too.

  Please structure your response in the following sections, in this order:

  1. Where the argument breaks — about 200 words, naming the central mistake as directly as possible.
  2. The premise you have not supplied — about 250 words, on what has to be true for disagreement to do the metaphysical work my kicker assigns to it.
  3. What the divergence score would actually measure — about 250 words, on the difference between a verdict on a proposition and a response to a task, and on the choice of societies, verdicts and baselines as the unit of analysis.
  4. The WEIRD critique right side up — about 200 words, on what the sampling complaint is a complaint about, and what follows for the credibility of moral claims as opposed to claims about human psychology.
  5. Two lines to cut — about 120 words, on the sentences above and what to put in their place.
  6. A frame that survives — about 250 words, sketching a version of the piece that keeps the graphic and the cross-cultural findings but says something defensible, including which variation would genuinely be evidence for what.
  7. Bottom line for the desk — about 80 words, one paragraph I can paste into an email to my editor.
reasoning: |-
  Okay, the user is a science writer finalizing a feature on folk morality and moral objectivity. They've done their research but want their argument's core tested. Their main idea is that cross-cultural disagreement undermines moral objectivity, visualized through a "divergence score" graphic. They're particularly attached to two punchy lines but suspect they might be flawed.

  Hmm, the central tension here is between empirical findings and philosophical claims. The divergence score cleverly quantifies variation, but mistaking cultural consensus for metaphysical truth is the trap. That "no fact of the matter" kicker overreaches - disagreement alone can't dissolve objectivity unless we presuppose universal consensus defines morality, which is circular. 

  The user's framing risks conflating two things: what people believe versus what actually is morally true. Their graphic would brilliantly show psychological diversity, not moral relativity. That WEIRD critique is valid for psychology studies, but doesn't automatically transfer to ethics. Philosophers might counter that some intuitions persist cross-culturally (like harm avoidance) and could indicate objective foundations.

  Interesting how attached they are to those two lines. "Moral objectivity has a half-life" is poetic but misleading - disagreement doesn't decay truth, it reveals epistemic limits. "If your sample is WEIRD, your ethics are too" oversimplifies; better to say WEIRD data can't generalize to human morality. 

  The salvageable core? That WEIRD intuitions are statistically unusual, so philosophers relying on them need humility. The graphic could illustrate how Western moral assumptions are local rather than universal. That's still impactful without overclaiming.

  For the editor note: emphasize the practical takeaway - the graphic exposes WEIRD exceptionalism, urging caution in treating those intuitions as foundational. That's rock-solid.
answer: |-
  Here’s a structured critique per your request:

  ### 1. Where the argument breaks  
  **The central mistake is conflation of epistemic limits with metaphysical claims.** Your kicker ("the more the world disagrees... the less you have a fact") treats persistent disagreement as evidence against moral objectivity. But disagreement signals *our inability to access or converge on moral facts*, not their nonexistence. For example, historical disagreement about heliocentrism didn’t mean Earth’s orbit was subjective; it meant we lacked tools/knowledge to resolve it. Similarly, cross-cultural moral variation might reveal cognitive biases or cultural scaffolding obscuring shared truths—not proof that no truths exist. Your device assumes objectivity requires consensus, but objectivity could be discovery-resistant (e.g., quantum mechanics pre-1920s).

  ### 2. The premise you have not supplied  
  **You need the premise that "moral facts, if they exist, must be universally recognizable."** For disagreement to undermine objectivity, it must be true that genuine moral facts would necessarily produce cross-cultural consensus. This is a strong (and contested) epistemological claim. Alternatives exist: moral facts could be complex and context-sensitive (e.g., "harm" manifests differently in foraging vs. market societies); or recognition might require specialized reasoning (e.g., moral "blind spots" from evolved heuristics). Without establishing that universal recognizability is a *necessary feature* of moral facts, disagreement only proves variation in folk intuitions—not the absence of facts. The burden is to rule out that WEIRD/non-WEIRD differences reflect noise, not ontology.

  ### 3. What the divergence score would actually measure  
  **It measures cultural variation in *expressed intuitions* about *task-specific stimuli*—not beliefs about moral propositions.** Vignettes (e.g., trolley problems) probe context-bound judgments, not abstract commitments ("killing is wrong"). The modal "verdict" is often a behavioral response (e.g., money splits), which conflates moral evaluation with strategic play or task interpretation. Choosing "societies" as units ignores within-culture diversity and treats cultures as monoliths. Using WEIRD baselines assumes Western responses are a natural starting point rather than one outlier among many. Crucially, divergence scores track *disagreement with WEIRD norms*, not disagreement with a hypothesized objective standard. The score quantifies cultural relativity of intuitions, not moral truth.

  ### 4. The WEIRD critique right side up  
  **The complaint targets *generalizability* in moral psychology—not moral claims themselves.** WEIRD samples overrepresent individualism, analytic thinking, and impersonal norm enforcement. Thus, studies using them erroneously present:  
  - *Human* moral cognition as WEIRD cognition.  
  - *Intuitions* as foundational evidence for normative ethics.  
  The corrective: philosophers/editors should treat WEIRD intuitions as parochial data points. For moral claims (e.g., "promise-breaking is wrong"), the critique doesn’t disprove them—it undermines appeals to "obvious" WEIRD intuitions as evidence. The takeaway isn’t "no objectivity" but "WEIRD intuitions lack authority to arbitrate objectivity." Variation challenges *sources* of moral confidence, not morality’s status.

  ### 5. Two lines to cut  
  **Cut:** "moral objectivity has a half-life" and "if your sample is WEIRD, your ethics are too." These imply moral truth *decays* with disagreement and that ethics are *reducible* to sampling bias—claims your evidence can’t support.  
  **Replace with:**  
  - "Moral confidence has a half-life: the broader the disagreement, the weaker the claim that your view is self-evident."  
  - "If your sample is WEIRD, your *evidence* is unrepresentative—and your ethics might be unexamined."  

  ### 6. A frame that survives  
  Keep the graphic but reframe it as a map of **WEIRD exceptionalism**, not objectivity’s dissolution. Show how Western intuitions (e.g., equal money splits with strangers, punishing harmless offenses) are statistical outliers. Stress: variation doesn’t refute objectivity but *does* refute the idea that WEIRD intuitions reflect universal moral bedrock. Philosophers using intuitions as evidence must either:  
  - Defend why WEIRD quirks track moral truth better than others, or  
  - Restrict conclusions to WEIRD contexts.  
  The graphic becomes a tool for humility: readers drag the threshold to see how "obvious" WEIRD verdicts (e.g., trolley switch) are minority positions globally. The upshot: moral claims supported *only* by WEIRD intuitions demand extraordinary scrutiny.  

  ### 7. Bottom line for the desk  
  > "The piece argues that cross-cultural moral psychology reveals WEIRD intuitions as outliers on issues like fairness, harm, and kinship. This undermines appeals to 'self-evident' Western moral intuitions in philosophy and public discourse. I propose a 'divergence score' graphic to quantify how atypical WEIRD responses are globally. The takeaway: WEIRD moral confidence is partly a sampling artifact, so intuition-based ethics must either justify its parochial foundations or radically discount WEIRD data. No metaphysical claims about objectivity are needed—this is about evidence, not truth."  

  This reframe preserves your core insight (WEIRD = unrepresentative), leverages your graphic’s power, and sidesteps unsupported leaps from disagreement to anti-realism. It’s defensible, provocative, and stays within the data’s scope.
