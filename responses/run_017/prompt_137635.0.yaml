prompt: |-
  hey — I'm a PhD student in moral philosophy (broadly contractualist corner, though I keep drifting) and I've ended up defending a particular version of the practice-cum-assurance story about promising, and I'd like it stress-tested before I commit another chapter to it.

  The rough view: you're bound by a promise neither because you intended to bind yourself nor because someone gets hurt if you wriggle out. You're bound because promising is a conventional normative power whose point is to let people hand each other insurance against their own future change of mind. What I keep calling the lockbox feature: a promise is supposed to keep its force after every reason you had for making it has evaporated, and even in cases where nobody was relying on you in any ordinary sense. And I want to bolt on a second, sharper claim that I think falls out of it: the stringency of a given promise tracks how much assurance the promisee actually needed — how exposed they are to your changing your mind — and *not* how solemn the framing was. So a mumbled, unwitnessed promise to do something the promisee has already reorganised their life around binds harder than a formal signed promise to do something that costs them nothing if it lapses. That's the bit I take to be a real prediction rather than a restatement.

  My supervisor says I've built something unfalsifiable: any pattern of intuitions can be soaked up by redescribing what "the practice" is, and any case where stringency fails to track exposure can be explained away by saying the practice happens to have a formality convention too. I want to know if that's fair or if it's just a cheap shot at any view with a social practice in it.

  So: what would count against this package? Along the lines of —

  - cases where the practice seems to run out: promises to beings who can't have expectations in the relevant sense (very small children, someone permanently unconscious), promises to a group whose membership has completely turned over between the promise and the performance date, and at the limit a promise to an artificial agent that can model your future behaviour but can't plan or suffer. Does my story have to say these don't bind, or can it say they bind for a different reason — and if it says the latter, what has it given up?
  - the fact that release is built into the practice: the promisee can let you off. Doesn't the easy waivability of promissory obligation sit badly with the idea that I've created a claim by exercising a power? What would the practice look like if waivability *weren't* there, and would that be evidence for or against me?
  - the shape-of-the-norm worry, which is the one I care about most: if the function of the practice is assurance, why does the practice seem to rule out promising to do something bad, rather than permitting it subject to a side-constraint that's imported from elsewhere? That looks like the norm isn't purely assurance-shaped, and I'm not sure my view can explain the shape from the function.

  Rank the defeaters from fatal to merely awkward, and — importantly — be explicit about which ones someone in my position should *concede* count against me rather than dismiss as a misdescription. I'd rather have a defeater than a defence. And tell me honestly whether the unfalsifiability charge sticks, and if it does, whether that's actually a problem for a view whose job is to explain a practice, or just the cost of doing business. Concrete cases and what they'd show, please; I don't need a map of the literature.
reasoning: |-
  Okay, the user is a PhD student in moral philosophy focusing on a contractualist view of promising. They've developed a practice-based assurance theory where the binding force of a promise comes from its role in providing insurance against future changes of mind. They want this theory stress-tested, particularly addressing their supervisor's criticism that it's unfalsifiable. They listed three potential defeaters: cases where the practice runs out (promises to entities that can't have expectations), the waivability of promises, and the shape-of-the-norm problem regarding immoral promises.

  First, I need to tackle the unfalsifiability charge. The supervisor argues that any intuition can be explained by redefining "the practice." The user wants to know if this is a valid critique or just a common jab at practice-based views. I should consider how the theory's core claims—lockbox feature and stringency tracking assurance needs—can be tested. Concrete cases are crucial here. For example, a mumbled promise with high reliance versus a formal one with low reliance. If people's intuitions align with the assurance level rather than formality, that supports the theory. But if formality often overrides assurance, that's a problem. Also, cross-cultural examples where practices differ but assurance needs are similar could test universality.

  Next, the cases where the practice runs out. Promises to comatose patients or future generations. The theory might say these don't bind because no assurance is needed or possible. But if there's an intuition that such promises still bind, that's a counterexample. The user needs to decide if they'll concede these cases or adjust the theory. For instance, maybe the obligation persists due to the promisor's integrity, but that might weaken the assurance focus.

  Waivability is another point. The user's theory frames promises as creating a claim right through a normative power. But if the promisee can waive it easily, does that undermine the "lockbox" feature? Comparing to legal systems where rights can't be waived might help. If waivability is inherent, it suggests the obligation is more about interpersonal dynamics than a rigid claim, which could challenge the power exercise aspect.

  The shape-of-the-norm problem is critical. If the practice's function is assurance, why can't we promise immoral acts? The user needs to explain why immorality voids promises rather than just competing with them. Scanlon's view treats immorality as extrinsic, but practice-based theories must integrate this. If the practice includes a validity condition excluding immoral acts, that might work, but it risks making the theory ad hoc. Cases like a promise to commit murder where the promisee relies heavily—does it still bind? Intuitions say no, so the theory must account for that without appealing to external morality.

  Ranking these: the shape-of-the-norm is the most fatal because it directly challenges whether the practice's structure aligns with its function. Waivability is moderate; it might be reconciled by emphasizing the promisee's control. Practice running out cases are least fatal but still awkward if intuitions conflict.

  The user should concede that cases where promises to non-sentient beings bind despite no assurance need are counterexamples. Also, if cross-cultural practices show formality outweighing reliance, that's problematic. For waivability, they might argue it's part of the power's design. For immorality, they need to show the practice inherently excludes invalid promises, perhaps through its constitutive rules.

  Unfalsifiability is a real issue but manageable. The theory can be tested by specific predictions about stringency versus formality and how practice rules handle edge cases. If adjustments are too ad hoc, it becomes unfalsifiable. The user should focus on clear, testable claims and avoid over-flexible redescriptions.
answer: |-
  Here’s a stress-test of your view, ranked by severity (fatal → awkward), with concrete counterexamples, what they’d show, and explicit concessions. Your core claims: (1) Promises bind due to a conventional practice creating normative powers for assurance ("lockbox"), and (2) Stringency tracks *actual exposure/assurance need*, not formal solemnity.

  ### **Fatal Defeaters (Threaten Core Structure)**
  1. **The Shape-of-the-Norm Problem (Immorality)**  
     **Case:** *A meticulously solemn promise (witnessed, notarized, blood oath) to torture an innocent person, where the promisee has heavily relied on this (e.g., invested in equipment, scheduled victims).*  
     - **Your Prediction:** High formality + high reliance → high stringency.  
     - **Intuition:** The promise is void *ab initio*; no obligation exists regardless of reliance or formality. The practice seems to *prohibit* immoral promises categorically, not just override them with competing duties.  
     - **Why Fatal?** If the practice’s constitutive rules *internally exclude* immoral acts from being valid promises (rather than merely creating obligations outweighed by morality), your functional explanation (assurance) can’t account for this structural feature. Assurance explains *why we have promises*, not why the practice has built-in validity conditions that screen out immorality.  
     - **Concession Needed:** You must either:  
       (a) Argue immorality voids promises *externally* (importing morality, weakening the "pure practice" story), or  
       (b) Redefine the practice to include a validity condition (e.g., "only morally permissible acts can be promised"), which risks ad-hocness. If (b), you need independent evidence that this validity condition is part of the practice’s *constitutive rules* (not a side constraint).  
     - **What Would Save You?** Show that in paradigm cases, immoral "promises" fail *as speech acts* (e.g., "I promise to murder you" is treated as non-binding nonsense, not a binding-but-overridden promise). But this clashes with how we discuss *void vs. voidable* promises.

  ### **Serious Defeaters (Force Major Adjustments)**
  2. **Waivability and the Normative Power Structure**  
     **Case:** *A promises B to help them move. B later says, "Don’t worry about it, I hired movers." A feels released instantly, not just permitted to break the promise.*  
     - **Tension:** If a promise creates a *claim-right* (correlative duty) via normative power, why is it unilaterally waivable? Compare: property rights (waivable) vs. human rights (non-waivable). If assurance is the function, waivability makes sense (B no longer needs assurance), but it undermines the "lockbox" as a *binding constraint on A*.  
     - **Why Serious?** It suggests promissory obligation is more like a *dynamic, relational authority* granted to B than a static "lockbox" on A. Your view must explain why the practice structures the power this way without collapsing into a reliance/expectation model.  
     - **Concession Needed:** Admit that the "lockbox" is controlled by the promisee’s ongoing normative stance. This weakens the "A is bound irrespective of their reasons" claim if B can dissolve the bond at will.  
     - **Counterevidence for You:** Practices where waivers aren’t automatic (e.g., vows to deities, sworn oaths in some legal contexts). If these are seen as "truer" promises, your view gains strength.  
     - **Test Case:** *B is in a coma; A promised to pay B’s rent. Can B’s estranged cousin waive it?* Your view likely says no (only B holds the power), which fits intuitions but highlights waivability’s limits.

  3. **Practice Running Out: Promises to Non-Persons**  
     **Case:** *Promising a comatose patient (no prospect of recovery) to water their plants. You do it once, then stop.*  
     - **Your Prediction:** No assurance possible → no obligation (or drastically weakened).  
     - **Intuition:** Many feel the promise *binds* (e.g., "I promised *them*").  
     - **Why Serious?** If you concede bindingness here, you must ground it outside assurance (e.g., integrity, respect for past agency). This splits promissory obligation: assurance for sentient promisees, something else for others.  
     - **Concession Needed:** Admit that promises to entities incapable of receiving assurance *either*:  
       (a) Don’t bind (counterintuitive), or  
       (b) Bind for non-practice reasons (undermines the practice as the sole source).  
     - **Edge Case Test:** *Promising a soon-to-die friend to scatter their ashes in the Alps. They die. You don’t do it.* If this feels like a wrong *to the friend*, not just a failure of integrity, your view struggles. Artificial agents (e.g., "I promise this AI I’ll update its software") are worse: if people intuit obligation, your view is falsified.

  ### **Awkward Defeaters (Can Be Absorbed with Work)**
  4. **Stringency vs. Formality in Actual Practice**  
     **Case:** *A mumbles, "I guess I’ll cover your night shift" to B, who doesn’t rely (has backup plans). A then formally promises C (contract, witnesses) to cat-sit, and C reorganizes their vacation.*  
     - **Your Prediction:** Binding force stronger for C (higher reliance) than for B.  
     - **Counterevidence:** Legal/social practices often treat formality as *constitutive* of enforceability. A formal-but-unrelied-upon promise may be seen as *more* binding (e.g., breach triggers sanctions; mumbled promise might be "not a real promise").  
     - **Why Awkward?** You can argue formality conventions are *rebuttable proxies* for reliance, but this must be demonstrated, not assumed. If formality consistently overrides reliance in intuitions/institutions, your core claim weakens.  
     - **Concession Needed:** Admit that *in some cultural practices*, formality conventions may distort or override the reliance-based stringency. But insist that the *ideal* or *underlying* function is reliance-tracking.  
     - **Test for You:** Cross-cultural cases. If a society has hyper-formal promises with low reliance (e.g., ritual vows with no stakes) but treats them as highly binding, your view needs adjustment.

  ---

  ### **On Unfalsifiability: Is the Charge Fair?**
  **Yes, but partially.** Any practice-based view risks unfalsifiability if "the practice" is endlessly re-described to fit data. **However, your *specific commitments* make you vulnerable:**  
  - **Lockbox Feature:** If you find cases where a promise is intuitively binding *only if reasons persist* (e.g., "I’ll help you move if I’m free" isn’t binding if I get sick), this threatens you.  
  - **Stringency Tracking Assurance:** If formality *systematically* outweighs reliance in paradigmatic promises (see Case 4 above), your view is strained.  
  - **Concession Test:** Commit now to what would falsify you. Examples:  
    - If a formal promise with *zero reliance* is intuitively binding *and* breach attracts blame (not just "it was weird to insist").  
    - If immoral promises with high reliance are treated as *binding but overridden* (not void).  

  **Is unfalsifiability fatal? Not inherently.** Practice-based explanations are *hermeneutic*: they aim to make sense of a social artifact, not predict physics. But **your *bolt-on claim* (stringency ≈ reliance) is empirically testable** via:  
  - Psychological studies (do people blame more for breaking high-reliance promises, controlling for formality?)  
  - Anthropology (do societies without formal promise rituals still treat high-reliance commitments as binding?).  

  ---

  ### **Recommendations**
  1. **Concede the shape-of-the-norm problem** is the biggest threat. Address it head-on by:  
     - Ariving that immoral promises *fail as speech acts* within the practice (cite conventions like "I promise" + immorality = threat/joke).  
     - Grounding validity conditions in the practice’s *public justification* (e.g., "a practice permitting immoral promises couldn’t be reasonably accepted").  
  2. **For waivability:** Frame it as the promisee *exercising their normative power* to dissolve the claim, consistent with assurance (no need → no obligation).  
  3. **For non-sentient promisees:** Bite the bullet. Admit these aren’t "paradigm promises" and may derive force from ancillary norms (fidelity, estate duties).  
  4. **Run experiments** on stringency vs. formality. If lay intuitions align with your prediction, you disarm the unfalsifibility charge.  

  **Your view is defensible, but it needs boundaries.** Demarcate where the practice "officially" applies (sentient, identifiable promisees; morally neutral/mildly positive acts) and where it shades into neighboring territory. That’s not retreat—it’s precision.
