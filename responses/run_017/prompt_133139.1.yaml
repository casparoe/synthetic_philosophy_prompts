answer: |-
  Below is a structured, auditable procedure for the reference class problem, grounded in philosophical principles (primarily Reichenbach's *practicality* and Venn's *frequency-based* approaches) while acknowledging the inherent subjectivity. The procedure prioritizes **defensibility**, **audit trails**, and **practical executability**. It explicitly flags where judgment is required, where it stops with "no rate," and where it hands off to humans for value-based decisions. 

  ### Core Principles Embedded in the Procedure
  1. **Temporal Integrity**: Only use information available at quote time. Classes defined post-loss are invalid (a form of hindsight bias).
  2. **Causal Plausibility**: Features must have a logical, domain-based rationale (even if correlation ≠ causation). Avoid "fishing expeditions."
  3. **Stability Over Precision**: Prefer classes with sufficient data to avoid overfitting. Narrow classes require stronger justification.
  4. **Transparency**: Every step must be documented in a "class string" for audit/renewal.
  5. **Fallibility**: There is no "true" class. The goal is a *defensible* choice, not a "correct" one. Philosophy (Reichenbach, Hajek) confirms this is fundamentally about damage control with better paperwork.

  ---

  ### The Procedure: Reference Class Selection for Novel Risks
  **Who Runs It**: Junior analyst (stats minor).  
  **Time Limit**: 30 minutes.  
  **Inputs**: Risk description, historical data, feature library (pre-approved features like "engine type," "promoter experience").  
  **Outputs**: A rate (with class string) or "no rate" (decline to quote).  
  **Key Tools**: Simple binomial rates, pre-set thresholds, escalation paths.  

  #### Step 1: Generate Candidate Classes (Time: 5 min)  
  **Question**: *What classes are plausible for this risk?*  
  **Adequate Answer**:  
  - List 3–5 classes, starting broad (e.g., "all satellite launches") and narrowing by **pre-approved features** (from your feature library).  
  - **Allowed Features**: Must be:  
    - Known at quote time (e.g., "machine age," "supplier," "weather forecast," NOT "actual weather on event day").  
    - Plausibly causal or strongly correlated per domain expertise (e.g., "engine family" yes; "client’s zodiac sign" no).  
    - Pre-defined in your feature library (to avoid ad hoc classes).  
  **Judgment Call**: Analyst uses common sense to exclude nonsense features (e.g., "launches on Tuesdays").  
  **Stop/No Rate If**: No features apply (e.g., truly unprecedented risk). Escalate to Step 6.  
  **Audit Trail**: Document all candidate classes with features.  

  #### Step 2: Calculate Rates & Uncertainty (Time: 10 min)  
  **Question**: *What are the loss rates and confidence intervals for each class?*  
  **Adequate Answer**:  
  - For each class, compute:  
    - **Loss rate**: `p = (number of losses) / (number of exposures)`  
    - **Standard error**: `SE = sqrt[p(1−p)/n]` for `n ≥ 10`; for `n < 10`, use exact binomial or Bayesian prior (e.g., `p_adj = (losses + 0.5) / (exposures + 1)`).  
  - **Data Rules**:  
    - Exposures must be comparable (e.g., same peril, similar scale).  
    - Never use classes defined after losses occurred (e.g., "rigging subcontractor" post-claim is invalid).  
  **Judgment Call**: Bayesian adjustment for small `n` is arbitrary but auditable.  
  **Stop/No Rate If**:  
    - No class has `n ≥ 10` *and* at least 1 loss or near-miss (e.g., no data for "new engine revision").  
    - All classes have `n = 0` (truly novel).  
  **Audit Trail**: Record `n`, losses, `p`, and `SE` for each class.  

  #### Step 3: Resolve Class Conflicts (Time: 10 min)  
  **Question**: *Which class is most defensible when rates disagree?*  
  **Adequate Answer**: Apply two-tier stability check:  
  1. **Narrowness Check**:  
     - Start with the narrowest class meeting:  
       - `n ≥ 10` (or `n ≥ 5` if Bayesian-adjusted).  
       - `SE ≤ 0.3p` (to exclude ultra-volatile classes, e.g., 1 loss in 2 exposures).  
     - If none, widen to next broader class.  
  2. **Consistency Check**:  
     - Compare the candidate class to its next broader parent (e.g., "engine with revised turbopump" vs. "engine family").  
     - If rates differ by > **3x**, escalate (Step 4).  
     - If rates differ by ≤ **3x**, use the **narrower class** (per Reichenbach: specificity improves accuracy).  
  **Validate Your Rule of Thumb**:  
  - *"Narrowest class with n≥10 and within 10x of parent"*: Keep it, but tighten to **3x** for escalation. It’s not superstition—it balances specificity and stability.  
  - *"Never quote >50% below broadest class"*: Keep as a sanity check. Escalate if triggered.  
  **Judgment Call**: The 3x threshold is arbitrary but reasonable (auditors accept industry norms).  
  **Stop/No Rate If**: No class passes both checks. Escalate to Step 6.  
  **Audit Trail**: Note pass/fail of checks and any escalation.  

  #### Step 4: Escalate Large Disagreements (Time: As Needed)  
  **Question**: *Who decides when classes conflict >3x?*  
  **Adequate Answer**:  
  - **Escalate if**:  
    - Rates differ >3x between classes.  
    - Sanity check fails (e.g., rate >50% below broadest class).  
  - **Escalation Path**:  
    - **<5x difference**: Senior Underwriter (judgment: causal plausibility).  
    - **≥5x difference**: Chief Actuary (judgment: statistical validity).  
  **Human Judgment Required**: Appetite for model risk, causal narratives (e.g., "revised turbopump *should* lower risk").  
  **Output**: Approved rate with sign-off.  

  #### Step 5: Build the Class String (Time: 5 min)  
  **Question**: *How is the class documented?*  
  **Adequate Answer**: One-line string with:  
  ```  
  "[Class description] | Exposures: n | Losses: k | Rate: p | Source: [data source] | [Adjustment/Approval]"  
  ```  
  **Examples**:  
  - ✅ Good: `"Small-launch vehicles using Engine Family X | n=60 | k=3 | Rate: 5% | Source: Internal DB"`  
  - ❌ Bad: `"Similar jobs"`  
  **Audit Trail**: This string is saved in the file. Renewals must re-run the procedure with same class.  

  #### Step 6: Handle "No Rate" or Values Conflicts (Time: As Needed)  
  **Question**: *What if no class works or features raise fairness issues?*  
  **Adequate Answer**:  
  - **"No Rate" Cases**: Decline to quote if:  
    - No data exists (e.g., first-of-kind risk).  
    - World changed (e.g., new regulation) and no analog class.  
  - **Values Conflicts**:  
    - If a feature is legally/ethically fraught (e.g., age, gender), halt and hand to Compliance/Legal.  
    - Do NOT use the class, even if statistically valid.  
  **Human Judgment Required**: Appetite for "first-ever" risks, fairness debates.  
  **Output**: Decline letter or compliance override.  

  ---

  ### What the Procedure Can and Cannot Do
  - **Can Do**:  
    - Provide a *defensible, auditable* rate using structured reasoning.  
    - Flag where judgment is needed (escalation points).  
    - Avoid hindsight bias and ad hoc classes.  
  - **Cannot Do**:  
    - Find a "true" rate. Philosophy (Hájek) shows reference classes are inherently subjective.  
    - Resolve causal ambiguities. Correlations are used; causation is a luxury.  
    - Eliminate expert judgment. It only makes it transparent.  
  **A Well-Run Damage-Control Procedure Looks Like**:  
  - **Consistency**: Same risk → same class string.  
  - **Audit Trail**: Regulators see *why* a class was chosen over others.  
  - **Escalations Documented**: Humans make hard calls, but with reasoning.  
  - **No Black Boxes**: All thresholds (3x, n≥10) are predefined and justifiable as industry norms.  

  ---

  ### Live Case Applications
  #### Case 1: Music Festival on River Floodplain  
  - **Step 1**: Candidates:  
    - `C1`: All regional floods (20y data). *Feature: location.*  
    - `C2`: Floods at exact site (4y data). *Feature: specific floodplain.*  
    - `C3`: Music festivals by new promoters. *Rejected: no data.*  
  - **Step 2**:  
    - `C1`: `n=20` years, losses (floods) `k=3` → `p=15%` (annual).  
    - `C2`: `n=4` years, `k=0` → `p_adj=0.5/4=12.5%` (Bayesian).  
  - **Step 3**:  
    - Narrowness: `C2` has `n=4<10` → reject. Use `C1` (broadest).  
    - Consistency: `C2` vs. `C1`: `12.5%` vs. `15%` (<3x difference).  
  - **Output**:   
    - Class String: `"Regional floods in [Region] | n=20 | k=3 | Rate: 15% | Source: Gov't flood DB"`.  
    - **Why not site-specific?** `n<10` → too volatile.  

  #### Case 2: Satellite Launch (New Vehicle)  
  - **Step 1**: Candidates:  
    - `C1`: All engine family flights (`n=60`, `k=3` → `p=5%`).  
    - `C2`: Revised turbopump flights (`n=9`, `k=0` → `p_adj=0.5/9≈5.56%`).  
    - `C3`: This vehicle (`n=2`, `k=1` → `p=50%`). *Rejected: `n<10`.*  
  - **Step 2**:  
    - `C1`: `p=5%`, `SE≈2.8%`.  
    - `C2`: `p_adj≈5.56%`, `SE≈2.4%` (Bayesian).  
  - **Step 3**:  
    - Narrowness: `C2` has `n=9<10` → reject unless justified.  
    - Consistency: `C2` vs. `C1`: `5.56%` vs. `5%` (<3x difference).  
    - **Escalate**: `C2` is narrow and credible (turbopump is causal upgrade), but `n<10`. Senior Underwriter approves due to engineering rationale.  
  - **Output**:  
    - Class String: `"Engine family X with revised turbopump | n=9 | k=0 | Rate: 5.56% (adj) | Source: Manufacturer DB | Approved: [Underwriter] (causal rationale)"`.  
    - **Why not vehicle-specific?** `n=2` → too volatile. Why not `C1`? Narrower class approved.  

  #### Case 3: Delivery Fleet with Driver Age Bracket  
  - **Step 1**: Candidates:  
    - `C1`: All delivery fleets (`n=500`, `k=25` → `p=5%`).  
    - `C2`: Fleets with driver age 18–25 (`n=50`, `k=10` → `p=20%`). *Feature: age.*  
  - **Step 2**:  
    - `C2` is statistically sharp (`SE≈5.7%`).  
  - **Step 3**:  
    - **Values Conflict**: Age is protected in many jurisdictions. Halt procedure.  
    - **Telematics Alternative**: Client offers telematics score (similar predictiveness). Analyst generates new candidate:  
      - `C3`: Fleets with telematics score Band Y (`n=45`, `k=9` → `p=20%`).  
    - Telematics class `C3` passes Steps 1–3.  
  - **Output**:  
    - Class String: `"Delivery fleets with telematics Band Y | n=45 | k=9 | Rate: 20% | Source: Client data"`.  
    - **Why not age?** "Feature escalated to Compliance: protected characteristic."  
    - **Telematics vs. Age**: Both predict equally, but telematics avoids fairness issues. Procedure prioritizes non-controversial features when performance is similar.  

  **Final Note on Telematics/Age**: The procedure avoids adjudicating "fairness" (a values question) but defaults to non-controversial features when statistically equivalent. If telematics were *less* predictive, you’d escalate the trade-off to Compliance.  

  This procedure turns subjective chaos into structured defensibility. It won’t make hard choices easy—but it will make them auditable, consistent, and philosophically grounded.
