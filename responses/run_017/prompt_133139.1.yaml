prompt: |-
  Hey — I price weird one-off risks at a small specialty insurer: satellite launches, film shoots, music festivals, one custom turbine going overland through three countries. I write maybe 5–8 quotes a week and every single one needs a rate for something that has never happened in exactly this form before. My boss wants a written procedure, and I've been told to ground it in whatever philosophy actually knows about the reference class problem. But it has to be runnable by a junior analyst with a stats minor and no philosophy, in about half an hour, and it has to survive an audit where the regulator points at a file and says "why this class and not that one?"

  Here's the mess I actually live in. The same event slots into a pile of different classes — small-launch-vehicle flights, flights using this engine family, flights using this engine with the revised turbopump, flights with a second stage assembled in the last eighteen months, flights where the payload customer is a first-timer — and those classes give rates that differ by an order of magnitude. Right now people either grab whichever class produces the number they were hoping for, or they average two of them, which I'm fairly sure is just incoherent. We've also had at least one case where someone built the class *after* seeing a couple of losses (three claims all involved the same rigging subcontractor, so new jobs got priced as "jobs involving that subcontractor"), and I genuinely can't tell whether that's cheating or whether it's the correct move.

  Stuff the procedure has to handle, none of which I know how to do:

  - How do you even generate the candidate classes, and which features are allowed into the description? Machine age, operator hours, weather window, supplier, whether the client has done this before. Some of those are doing causal work and some are just correlated with the thing, and half the time we can't tell which.
  - How narrow do you go? The narrow class always feels more honest until you realize it has four exposures, or zero events, or one event out of one and a 100% loss rate that we obviously cannot charge.
  - What happens when the broad class and the narrow class disagree by like 10x? Do we escalate, and who signs — me, the senior underwriter, or the chief actuary? Right now: nobody knows, it just depends who's in the office.
  - Classes defined partly by the outcome, or by facts we only learn later. My rule of thumb is that you can only use what was on your desk at quote time, but I can't say why, and I suspect it's not quite that clean.
  - Cases where there is no rate: nobody has ever done this, or the world moved (new engine revision, new regulation, new supplier) so the old frequency means nothing. I would much rather the procedure say "no defensible number, decline to quote" than that it manufacture one and we find out later.
  - Output format. Every file needs a "class string" — a one-line description of the class and where the rate came from — because renewals come back a year later and a different analyst has to re-derive it, and we've already been burned by someone writing "similar jobs" in the box.
  - Our home-brewed rule of thumb, which nobody can defend: go to the narrowest class that has at least ten exposures and whose rate is within 10x of its parent class. Is that doing real work or is it a superstition? Should I throw it out? Same question for our other internal rule: never quote more than 50% below the broadest defensible class rate.

  What I want from you: the questions, in order; what counts as an adequate answer to each one; where the procedure stops with a no; and where it hands the question to a human because it's a question about appetite, fairness, or values rather than a fact about the risk. Be honest about which steps are judgment calls with a number stapled to them, and be honest about what the procedure fundamentally cannot deliver — my worry is that there is no uniquely correct class and the whole thing is just damage control with better paperwork. If that's true, say so and tell me what a well-run damage-control procedure looks like.

  Then run the thing on three live-ish cases:

  1. A first-ever music festival on a river floodplain. Twenty years of flood records for the region, four years for that particular stretch of river, no track record for the promoter, and a fixed date we can't move.
  2. A satellite launch on a new small vehicle: two flights, one failure. The engine family has sixty flights with three failures. There's also a narrower subset — this engine with the revised turbopump — with nine flights and no failures. Three different analysts here picked three different classes and I can't tell which of them is wrong.
  3. A fleet policy for a delivery company. The sharpest class we can actually defend statistically is built partly out of driver age bracket. Compliance is going to lose their minds. I want to know whether your procedure tells me to use that class anyway, or whether it says "this stopped being a reference class question and became a fairness question" — and if it says that, I want to hear it even though it's not what I want, because I was kind of hoping the machinery would get me off the hook here.

  Oh, and one more: the client in case 3 has offered to let us use a telematics score instead, which predicts about as well but is way harder to explain to a regulator. If the procedure has anything to say about picking between two classes that perform the same, I'd like to hear it, because I suspect it doesn't.
reasoning: |-
  We are facing the reference class problem: how to choose a relevant reference class for a unique risk when multiple competing classes exist with different loss rates. The procedure must be auditable, executable by a junior analyst, and grounded in philosophical principles (like those from Reichenbach, Venn, or more recently, Hajek and others) without requiring philosophical expertise.

  Key principles to incorporate:
  1. **Temporal grounding**: Only use information available at the time of quoting. This avoids hindsight bias and ensures the class is defined ex-ante.
  2. **Avoid outcome-based classes**: Defining a class after seeing losses (like the rigging subcontractor case) is problematic because it may overfit to the losses and not be predictive of future risks. It might be acceptable if the characteristic was known at quote time and the losses reveal a causal link, but we must avoid data dredging.
  3. **Causal vs. correlational features**: We prefer features that are plausibly causal, but in practice, we often don't know. The procedure should require that features are at least known at quote time and have a reasonable narrative for why they might affect the risk.
  4. **Narrowness vs. stability trade-off**: Narrow classes are more specific but have fewer data points, leading to unstable estimates. We need a rule for when to use broader classes.

  Proposed Procedure Outline:

  ### Step 0: Define the Risk
  - Write down the risk with all known characteristics (features) at the time of quoting. This includes: type of event, location, time, participants, equipment, history, etc.

  ### Step 1: Generate Candidate Classes
  - **How**: Start with the broadest possible class (e.g., all satellite launches) and then consider narrowing by features that are:
    - Known at quote time.
    - Plausibly related to the risk (based on domain knowledge, past loss analysis, engineering reports, etc.).
    - Avoid features that are not available until after the event (e.g., actual weather on the day, which wasn't known at quote) or that are outcomes.
  - **Features allowed**: Machine age, operator hours, weather window (if forecasted and known at quote), supplier, client experience, etc. But each must be justified as known at quote and relevant.
  - **Output**: A list of candidate classes, each defined by a set of features. For example, for the satellite launch:
    1. All satellite launches (broadest)
    2. All launches using engine family X
    3. All launches using engine family X with revised turbopump
    4. All small launch vehicles

  ### Step 2: Collect Data for Each Candidate Class
  - For each candidate class, gather:
    - Number of exposures (n)
    - Number of losses (k)
    - Loss rate (k/n) and a measure of uncertainty (e.g., standard error: sqrt(p*(1-p)/n) for binomial, or use a beta distribution if n is small)
  - If a class has zero exposures, it is not usable (unless we have a prior from a similar class, but that's advanced).
  - If a class has no losses, the loss rate is zero, but we know that's unlikely to be true. We need a way to handle this.

  ### Step 3: Assess Class Stability and Reliability
  - **Rule for minimum data**: We require at least 10 exposures (or a company-set threshold) to consider a class. If no class meets the threshold, we must use a broader class or decline.
  - **Rule for zero losses**: If a class has zero losses but at least 10 exposures, we use a small non-zero rate (e.g., 0.5/n, or a Bayesian prior). We must document this adjustment.
  - **Rule for disagreement between classes**: If the narrowest class with sufficient data (say, 10 exposures) has a loss rate that is within a factor (e.g., 2x or 10x) of the next broader class, then we use the narrow class. Otherwise, we flag for review.

  ### Step 4: Escalation for Disagreement
  - If the narrow class and the broad class differ by more than a threshold (e.g., 2x or 10x? We must set a threshold), then:
    - The analyst must document the disagreement and the features causing it.
    - Escalate to a senior underwriter or actuary to make a judgment call. The procedure must specify who: for a difference above 10x, escalate to the chief actuary? For 2x-10x, to the senior underwriter? And document the rationale for the choice.
  - This step is a judgment call. The procedure should require that the escalation includes:
    - The candidate classes and their rates.
    - The number of exposures and losses in each.
    - A brief narrative on why the feature might be causal (or not).

  ### Step 5: Handling New Risks (No Data)
  - If there is no class with at least one exposure (or the minimal data threshold), then:
    - The procedure must output: "No defensible rate. Decline to quote or seek manual override with justification."
    - The override requires senior approval (e.g., chief actuary) and must document an analogy to a similar class and a risk loading.

  ### Step 6: Output Format
  - The "class string" must include:
    - The chosen class definition (e.g., "Satellite launches using engine family X with revised turbopump").
    - The source: "Based on 9 exposures, 0 losses, adjusted to 0.5/9 = 5.56% loss rate using the Haldane prior." OR "Based on 60 exposures, 3 losses -> 5% loss rate."
    - If escalated, note: "Rate approved by [Name, Title] on [Date] due to disagreement between classes [X] and [Y]."

  ### Step 7: Reviewing Internal Rules
  - **Rule 1: Narrowest class with at least 10 exposures and within 10x of parent**.
    - This is a reasonable starting point. The 10 exposures threshold is arbitrary but common to avoid extreme instability. The 10x factor is also arbitrary but prevents extreme jumps without review. It's a form of damage control, but it's better than nothing.
  - **Rule 2: Never quote more than 50% below the broadest defensible class rate**.
    - This is a conservative rule to avoid underpricing. It should be kept as a sanity check, but note that sometimes the narrow class might be genuinely safer. So the rule should be: if the chosen rate is more than 50% below the broadest class rate, then require escalation and justification.

  ### Step 8: Judgment Calls and Limitations
  - **Honesty**: There is no unique correct class. The procedure is a structured way to make a reasonable choice and document it for audit. It cannot eliminate subjectivity but makes it explicit.
  - **What it cannot deliver**: A single "true" rate. It delivers a rate that is defensible as having followed a consistent procedure.

  ### Step 9: When to Stop and Hand to Humans
  - The procedure stops and requires human judgment when:
    - There is a large disagreement between classes (per Step 4).
    - There is no data (Step 5).
    - The features used raise fairness or compliance issues (e.g., using driver age in pricing might be illegal or against company policy). Then it becomes a values question.

  Now, let's run the three cases:

  #### Case 1: First-ever music festival on a river floodplain.
  - **Step 0**: Risk: outdoor music festival on a floodplain, fixed date, promoter with no track record. Known at quote: location, promoter (new), 20-year regional flood data, 4-year specific stretch data.
  - **Step 1: Candidate classes**:
    1. All outdoor events in the region (too broad? Maybe not relevant).
    2. Music festivals in the region (but none on this floodplain?).
    3. Events (any) on this specific floodplain (using the 4-year flood history? But no events held there?).
    4. Flood risk for the location: use the flood history to estimate the probability of a flood during the festival dates? This is not a class of events but a class of days? We might need to shift to a different type of risk model.
  - **Problem**: We have flood data but not event data. We can use the flood data to estimate the probability of a flood that would disrupt the event. So the class might be: "Days in the same month (or same week) as the festival, at this location, over the past 4 years." Then we count how many days had flooding that would disrupt the event? But we don't have that data. We have flood records, but not necessarily at the threshold of disruption.

  - **Step 2**: 
    - Class 4: Using the flood record. We have 4 years of data? But we need to know the frequency of flooding that would disrupt the event. We must define a threshold (e.g., water level above X feet). Then we can count the number of days above that threshold in the past 4 years. But note: we have 20 years of regional data and 4 years of local data. We might use the local data if we believe it's more relevant, but if it's only 4 years, that might be too short.

  - **Step 3**: 
    - If we use the local data: n = 4 years * 365 days? But we are only interested in the festival period? Let’s say the festival is 3 days. We should look at the same 3-day window over the past 4 years. How many of those 4 windows had a flood? We don't have that data? We have annual flood records, not daily? This is messy.

  - **Alternative**: Use the flood frequency from the regional data (20 years) and adjust for the specific location if there is a known factor (e.g., this floodplain is 2x more likely to flood). But without that, we might use the regional rate.

  - **Step 5**: If we cannot define a class with events, then we might use the flood data. But note: the flood data is not about events, so we need to model the flood risk independently. This might be beyond the reference class procedure. We might need to say: this is a flood risk, and we use the historical flood frequency for the location and time of year. Then we set the class as: "Flood events at [location] during [month] from 20XX to 20XX." And then we count the number of floods in the month of the festival over 20 years and divide by 20 to get an annual rate? But we need the probability for the festival days.

  - **Output**: Since there is no event history, we use the flood history. The class string: "Flood events at [exact location] during the month of [month] over 20 years: X floods in 20 years -> annual frequency Y. Adjusted for 3-day festival: Z = Y * (3/365)." But note: this is not a reference class of similar events, but a natural hazard. We might need to have a separate procedure for natural hazards. However, for the regulator, we can document the data source.

  - **Escalation?** The jump from regional to local is an issue: 20-year regional vs 4-year local. If the local data shows a different trend, we might have a disagreement. We would escalate if the two rates differ by more than 10x? But in this case, we don't have two event-based classes. We have one class (regional) and one location-specific (local). We might use the local data if available and adjust for the shorter period. But if the local data has no floods and the regional has some, then we have a disagreement. We would escalate.

  - **Conclusion for Case 1**: We use the flood data. We choose the most specific data available (local) but if it's too short, we might use the regional. The class string: "Flood events at [location] during [month] from [year] to [year] (n=4 years). Number of flood events in the month: [count]. Frequency per month: [count]/4. Festival duration adjustment: [frequency] * (3/30) [assuming a month has 30 days]." If the count is zero, we adjust to 0.5/4 = 0.125 per month? Then adjust for 3 days. But note: the regulator might ask why we didn't use the 20-year data. We document that the local data is more specific. If the 20-year regional data shows a much higher rate, we escalate.

  #### Case 2: Satellite launch on a new small vehicle
  - Two flights, one failure. Engine family: 60 flights, 3 failures. Revised turbopump: 9 flights, 0 failures.
  - **Step 0**: Risk: satellite launch on vehicle with 2 flights (1 failure), using an engine with a revised turbopump (which has 9 flights, 0 failures). The engine family has 60 flights and 3 failures.
  - **Step 1: Candidate classes**:
    1. All satellite launches (too broad, probably not used).
    2. All small launch vehicles (but we don't have that data? We have data for this vehicle and the engine).
    3. Flights using engine family X: 60 flights, 3 failures -> 5% failure rate.
    4. Flights using the revised turbopump: 9 flights, 0 failures -> 0% but we adjust to 0.5/9 ≈ 5.56%? 
    5. Flights of this specific vehicle: 2 flights, 1 failure -> 50%.

  - **Step 2**: 
    - Class 3: 3/60 = 5%
    - Class 4: 0/9 -> adjusted to 0.5/9 ≈ 5.56% (using the Haldane prior for zero events)
    - Class 5: 1/2 = 50% (but n=2 is too small by our threshold)

  - **Step 3**: 
    - Our rule: narrowest class with at least 10 exposures. Class 4 has 9, which is below 10? So we cannot use it? Then we look at the next broader: Class 3 (60 exposures) -> 5%. 
    - But note: Class 4 is not the narrowest with 10 exposures? Actually, we don't have one with 10. So we must use Class 3? But Class 4 has 9, which is close to 10. We might relax the rule? Or we use Class 3.

  - **Disagreement**: 
    - Class 5 (50%) vs Class 3 (5%) -> 10x difference? Yes, 50/5=10. But Class 5 is too small. 
    - Class 4 (5.56%) vs Class 3 (5%) -> they are very close (within 10x). But Class 4 is not allowed because n=9<10? 
    - We might use Class 3 because it meets the threshold. But note: the revised turbopump might be an improvement. If we have engineering data that says it reduces risk, we might want to use Class 4. 

  - **Step 4**: Since Class 4 has 9 exposures (almost 10) and its rate is very close to Class 3, we might allow it with a note. But by strict procedure, we require 10. We must escalate because we have two viable classes: Class 3 (5%) and Class 4 (5.56%) but Class 4 is not meeting the exposure threshold. The senior actuary might decide to use Class 4 because 9 is close to 10 and the turbopump is a known improvement. Alternatively, they might average? But we said averaging is incoherent. The procedure should avoid averaging.

  - **Output**: The procedure flags that the narrow class (revised turbopump) has 9 exposures (below 10) and the broader class (engine family) has 60. The rates are similar (5% vs 5.56%) so the difference is small. We can choose the broader class (engine family) because it meets the threshold. But if we have strong evidence that the turbopump reduces risk, we might use an even lower rate? That would be a judgment. The procedure would require escalation to choose between:
    - Using the engine family class (5%)
    - Using the turbopump class with a note that we relaxed the 10-exposure rule because the rate is consistent and there is engineering justification.

  - **Class string**: If we choose the engine family: "Engine family X: 60 flights, 3 failures -> 5%". If we choose the turbopump: "Engine family X with revised turbopump: 9 flights, 0 failures adjusted to 5.56% by Haldane prior. Note: exposure count 9 < 10, but approved by [Name] due to engineering evidence of improved safety."

  #### Case 3: Fleet policy for a delivery company using driver age bracket
  - **Step 0**: Risk: fleet of delivery vehicles. We have a class defined by driver age bracket that is statistically defensible (e.g., young drivers have higher loss rates).
  - **Step 1: Candidate classes**:
    1. All delivery fleets (broad).
    2. Delivery fleets with similar vehicle types and operations (without age).
    3. Delivery fleets with driver age brackets (e.g., 18-25, 26-35, etc.).

  - **Step 2**: 
    - Class 3: We have data by age bracket. It shows a clear pattern and is statistically significant.

  - **Problem**: Using age might be discriminatory or illegal. Compliance will object.

  - **Step 9: Hand to human for values**: This is not a reference class problem anymore. The procedure should flag: "The chosen class uses a protected characteristic (age) which may be prohibited by law or company policy. Escalate to compliance and senior underwriter for a decision on whether this characteristic is allowed."

  - **Alternative**: The client offers a telematics score that predicts as well as age. We can use that instead? The procedure would then generate a candidate class based on telematics score. But note: the telematics score might be a proxy for age? We must ensure it is not discriminatory.

  - **Procedure for two classes with same performance**: The procedure doesn't have a rule for this because the reference class problem doesn't dictate which one to choose. But we can add:
    - If two classes are equally predictive and meet the data requirements, then choose the one that is:
      - More stable (larger n)
      - More easily explained to the regulator and client
      - Less controversial (avoids protected characteristics)
    - In this case, the telematics score is harder to explain but avoids age. We might choose the telematics score.

  - **Output**: We avoid the age-based class because of compliance concerns. We use the telematics score class, even though it is harder to explain, because it is legally safer. The class string: "Delivery fleet with telematics score in band [X]: based on [n] exposures, [k] losses -> rate Y."

  ### Summary of the Procedure

  1. **Define the risk** with all features known at quote time.
  2. **Generate candidate classes** by adding features that are known and relevant. Start broad and narrow by one feature at a time.
  3. **Collect data** for each class: exposures, losses, rate, and uncertainty.
  4. **Apply stability rules**:
     - Minimum exposures: 10 (or set threshold). If not met, discard or go broader.
     - Zero losses: adjust to 0.5/n (or set prior).
