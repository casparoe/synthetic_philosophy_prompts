     - No class meets the exposure threshold.
     - Disagreement between classes > factor (e.g., 10x) in rates.
     - Use of a feature that might be protected or controversial.
     - New risk with no data.
  6. **Output** a class string with the class definition, data, and any adjustments or approvals.
  7. **Decline to quote** if no defensible rate and no override.

  ### Final Note
  The procedure is a framework for making reasoned choices and documenting them. It cannot eliminate subjectivity but makes it auditable. The regulator will see a clear rationale even if they disagree. The internal rules (10 exposures, 10x factor) are arbitrary but defensible as industry norms. They are damage control, but that's the state of the art.

