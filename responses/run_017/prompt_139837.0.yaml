  The user is going to be shown one of these two for a given question. We are concerned with what we should show to the user to best guide their credence (i.e., their subjective degree of belief) about the event.

  The Principal Principle (PP) says, roughly, that if an agent knows that the objective chance of A is p, then their credence in A should be p. However, note that the PP has conditions and caveats. In particular, it applies when the agent has no other information except that the chance is p. But in our case, the agent might have more information (such as the tracker's verdict).

  But let's break down the scenario:

  Case 1: We show the user the chance oracle's output, say p.
