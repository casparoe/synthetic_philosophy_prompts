prompt: |-
  I am drafting the opening chapter of a book manuscript on the metaphysics of persons, and I have found that I cannot get anywhere until I fix what I am asking of a theory in this area. Every dispute I read seems to be a dispute about which datum a theory is permitted to ignore. So before I assess any candidate, I want the specification it will be assessed against: what a theory of the self has to be able to do in order to count as adequate.

  Fix the purpose first, since adequacy is relative to it. The theory I need must do two jobs at once. First, it must underwrite diachronic moral responsibility: the practice of holding this person answerable now for what was done years ago, and of excusing them when the link has failed. Second, it must underwrite prudential concern: explain what it is about a future person that makes their having a headache a reason for me now to take an aspirin, and why that reason does not extend with equal force to everyone else's future headaches. A theory that does one job and is silent on the other is inadequate for my purposes, and I would like you to say whether those two jobs can in fact be served by a single account or whether I have illegitimately bundled them.

  Here are the fixed points I take a theory to have to accommodate. Turn them into requirements, and give me the case or consideration behind each requirement rather than a bare list.

  1. *The archivist*: someone with exhaustive episodic recall of their own past who organizes none of it into a story, feels no ownership of the recalled events, and lives entirely from moment to moment.
  2. *The repudiator*: someone whose later self-narrative disowns everything earlier — a conversion, a political reversal, a slowly accumulated change of character — and who is genuinely the continuer of the earlier person's memories, habits and projects while repudiating them.
  3. *The ghostwritten*: someone whose self-narrative is coherent, socially ratified, and largely authored by others — family stories, an institution, a culture's script — with no point at which they can be said to have originated it.
  4. *The silent*: an infant, or an adult with no language or no narrative capacity at all.
  5. *The interrupted*: a decade of dense amnesia, anterograde and retrograde, from which the person then emerges; the biological life is unbroken and the narrative is not.
  6. *The shared*: one organism, two apparent narrative centers.
  7. *The divergent*: two narrative centers that separate from a common origin gradually, with no moment of division and no fact of the matter about when there ceased to be one.
  8. *Mine-ness*: the requirement must be stated without helping itself to *me*, *I*, or *my* — the theory has to earn the pronoun, not presuppose it.
  9. *The appearing subject*: experience presents itself as belonging to a single, simple, persisting subject, and this presentation is itself something the theory owes an account of, whether by vindicating or by explaining it away.
  10. *Being wrong about oneself*: someone who sincerely narrates themselves as cowardly and reliably acts bravely. There must be something for the narrative to get wrong.

  Add whatever cases you think I have omitted that would generate requirements I have not listed.

  I also want your view on which of the following are genuine desiderata and which are merely the prejudices of one camp: that the theory return a determinate yes-or-no for every case; that it withhold selves from no creature we intuitively grant one; that it be reductive, leaving no residue subject, homunculus, or owner of the narrative; that it be empirically respectable, given that no anatomical seat of the self has been isolated and that people confabulate motives and memories under prompting; that it vindicate rather than revise ordinary self-talk; and that it leave the self as something we can author, so that self-creation is possible rather than merely self-discovery.

  Two things matter most to me. First, tell me whether some subset of the requirements is jointly unsatisfiable — if the list itself is a result, that is the result I want, and I want to know which requirement you would drop first and what dropping it costs. Second, tell me which single requirement excludes the largest number of otherwise attractive candidates.

  Only then, briefly, and in a few lines each: score Dennett's metaphor of the self as a center of narrative gravity, the neo-Lockean psychological continuity view, animalism, the minimal or pre-reflective phenomenal self, and the self-as-model picture against the list. Keep the weight on the criteria — I know the contenders well enough to do the scoring myself, and I want the spec to be one that the narrative-gravity view could genuinely fail rather than one gerrymandered to protect or to sink it.

  Mark each requirement as non-negotiable or negotiable, and say how confident you are in that marking; name the one you are least sure belongs on the list at all and why. If my framing is confused — if the two jobs I have fixed cannot be served by one theory, if the cases above smuggle in an answer, or if some requirement is not the kind of thing a theory can be asked to deliver — say so plainly instead of producing a polite list. And please argue from the cases themselves: I do not want references, a reading list, or a bibliography, and I do not want any point carried by an appeal to what some author said.
reasoning: |-
  Hmm, the user is drafting a book chapter on the metaphysics of persons and needs help defining the criteria for assessing theories of the self. They've outlined two core jobs for their theory: justifying diachronic moral responsibility and prudential concern. They've also provided ten "fixed points" - thought experiments or phenomena that a theory must account for - and want me to transform these into requirements.

  I need to analyze each case carefully to extract the underlying requirement it imposes on any theory of personal identity. The archivist case suggests we need a theory that doesn't require narrative coherence for identity. The repudiator shows we need identity without psychological endorsement. The ghostwritten highlights that narrative authenticity can't be a requirement. The silent indicates that language/narrative capacity isn't necessary. The interrupted challenges strict narrative continuity requirements. The shared and divergent cases attack the singularity assumption. Mine-ness requires avoiding circularity. The appearing subject demands accounting for phenomenology. And being wrong about oneself establishes that narrative isn't definitive.

  The user also asks about several potential desiderata. I should evaluate which are genuine requirements versus philosophical biases. For instance, demanding determinacy in all cases might be unreasonable given phenomena like gradual divergence. Vindicating ordinary self-talk might not be necessary if revision is warranted. The self-creation vs self-discovery debate seems substantive rather than prejudicial.

  Crucially, I need to identify tensions between requirements. The appearing subject (phenomenal unity) seems incompatible with cases like the shared (split subjectivity). Mine-ness (non-circularity) conflicts with the need to account for the first-person perspective. These tensions suggest some requirements might need softening.

  When scoring existing theories against these criteria, I'll be brief but critical. Dennett's narrative gravity struggles with the silent and mine-ness. Neo-Lockean views fail the interrupted and repudiator cases. Animalism handles the silent but not the divergent. The minimal self accounts for phenomenology but not responsibility. The self-as-model might handle ghostwritten cases but struggles with mine-ness.

  I'll mark requirements as negotiable or non-negotiable based on their centrality to the user's core concerns. The appearing subject might be the most negotiable since its conflict with other cases is severe. The silent and mine-ness seem non-negotiable for the user's purposes.

  The biggest exclusionary requirement is likely mine-ness - it eliminates many theories that rely on presupposed subjectivity. And the shared/divergent cases together exclude animalism and other biological approaches.

  Finally, I should confirm that the two core jobs can be served by one theory - they both concern the normative significance of personal identity over time, so unification seems possible, though challenging.
answer: |-
  Here is the specification derived from your cases and purposes. I've structured it as requirements with their grounding cases, identified tensions, and assessed desiderata—arguing strictly from your framework without external appeals.

  ### Core Purpose Requirements (Non-Negotiable)
  1. **Diachronic Moral Responsibility (DMR)**  
     *Requirement*: The theory must ground why *this* present entity can be held answerable for a past act.  
     *Case*: **The repudiator** forces the issue: even when narrative/psychological continuity is repudiated, responsibility may persist (e.g., a war criminal post-ideological conversion). A theory cannot outsource responsibility to subjective endorsement.

  2. **Prudential Concern (PC)**  
     *Requirement*: The theory must explain why *this* future state generates unique first-personal reasons for action (e.g., taking aspirin for *my* future headache).  
     *Case*: **The interrupted** (post-amnesia) and **the archivist** challenge PC: if narrative/psychological links break, does prudential concern lapse? The theory must secure PC even when memory/identity-feeling is absent.

  ### Derived Requirements from Cases (Confidence: High)  
  *Non-Negotiable*:  
  3. **No Narrative Necessity**  
     *Requirement*: Identity must hold without self-narrative.  
     *Case*: **The archivist** (no narrative, full recall) and **the silent** (no narrative capacity). A theory requiring self-narration fails infants, severe dementia, or aphasia.  

  4. **No Ownership Necessity**  
     *Requirement*: Identity must hold without felt ownership of past/future.  
     *Case*: **The repudiator** (disowns past) and **the archivist** (feels no ownership). Endorsement cannot be constitutive.  

  5. **No Narrative Authenticity**  
     *Requirement*: Identity must hold even if narrative is externally authored.  
     *Case*: **The ghostwritten** (scripted by culture/family). A theory cannot require "true self-narration."  

  6. **Biological Life Insufficient**  
     *Requirement*: Identity cannot reduce to biological continuity alone.  
     *Case*: **The shared** (one body, two centers) and **the divergent** (gradual splitting). Organismic unity isn’t necessary or sufficient.  

  7. **Subjectivity Without Circularity**  
     *Requirement*: Explain "mineness" without presupposing *I*/*me*.  
     *Case*: **Mine-ness**. Theories smuggling in an unexplained subject (e.g., Cartesian egos) fail.  

  *Negotiable* (Confidence: Medium):  
  8. **Phenomenal Unity Account**  
     *Requirement*: Explain why experience *appears* unified to a simple, persisting subject.  
     *Case*: **The appearing subject**. May be an illusion (explain away) or real (vindicate), but cannot ignore it. *Tension*: Conflicts with **the shared** (two subjects in one body).  

  9. **Narrative Fallibility**  
     *Requirement*: Allow for self-narratives to be false.  
     *Case*: **Being wrong about oneself** (e.g., "coward" who acts bravely). Identity conditions must be independent of self-report.  

  ### Tensions & Joint Unsatisfiability  
  - **Critical Conflict**: **The appearing subject** (phenomenal unity) vs. **the shared**/**divergent** (disunified/multiple subjects).  
    - *Appearing subject* demands a single, simple experiencer; *shared/divergent* show this can fragment.  
    - *Cost of dropping appearing subject*: Abandons a core phenomenological datum.  
    - *Cost of dropping shared/divergent*: Ignores empirical realities (e.g., DID, gradual fission).  
    - **Verdict**: Drop strict *simplicity* in **appearing subject** (allow fragmented/emergent unity) but retain *phenomenal grounding*.  

  - **Secondary Conflict**: **PC** vs. **DMR** in edge cases.  
    - *Example*: **The interrupted** (amnesia) may retain DMR (e.g., contractual obligations) but lose PC (no concern for post-amnesia future).  
    - *Resolution*: PC and DMR may not align perfectly. A theory must explain *why* they diverge, not force convergence.  

  ### Most Exclusionary Requirement  
  **Subjectivity Without Circularity (Mine-ness)**. It excludes:  
  - Non-reductive views (e.g., substance dualism: "I" is primitive).  
  - Narrative views relying on a "narrator" homunculus.  
  - Some phenomenological accounts (if they take "mineness" as brute).  

  ### Assessment of Desiderata  
  | Desideratum                     | Genuine or Prejudice?          | Why (Argued from Cases)                                                                 |
  |---------------------------------|--------------------------------|-----------------------------------------------------------------------------------------|
  | Determinate yes/no answers      | Prejudice                     | **The divergent** (gradual split) resists sharp boundaries. Demand for binarity is artificial. |
  | Selves for all intuitive cases  | Prejudice                     | **The silent** (infants) lack narrative but may have selves; intuitions conflict.        |
  | Reductive (no homunculus)       | Genuine (Non-negotiable)      | Required by **mine-ness**. A homunculus smuggles in the "I."                            |
  | Empirically respectable         | Genuine                       | **Ghostwritten** (confabulation) and **being wrong** show self-reports are unreliable.  |
  | Vindicate ordinary self-talk    | Prejudice                     | **Repudiator**/**ghostwritten** show self-talk is often distorted or incoherent.        |
  | Self-authoring (not discovery)  | Genuine (Negotiable)          | **Ghostwritten** challenges authorship, but **repudiator** shows agency in self-revision. |

  ### Candidate Theories Scored Against Requirements  
  1. **Dennett’s Center of Narrative Gravity**  
     - Fails: **Silent** (no narrative), **Mine-ness** (narrator is homuncular), **Being wrong** (narrative isn't definitive).  
     - Partial: Explains **ghostwritten** (narrative as social artifact).  

  2. **Neo-Lockean (Psychological Continuity)**  
     - Fails: **Interrupted** (amnesia breaks continuity), **Repudiator** (continuity without responsibility/concern), **Shared/Divergent** (branching).  
     - Partial: Handles **archivist** (recall as continuity).  

  3. **Animalism**  
     - Fails: **Shared**/**Divergent** (one body, multiple selves), **PC/DMR misalignment** (e.g., organ transplant cases).  
     - Partial: Explains **silent**/**interrupted** (biological persistence).  

  4. **Minimal Phenomenal Self**  
     - Fails: **Shared** (fragmented subjectivity), **Mine-ness** (often takes subjectivity as given), **DMR** (no diachronic basis).  
     - Partial: Explains **appearing subject**.  

  5. **Self-as-Model (Predictive Processing)**  
     - Fails: **Mine-ness** (models may presuppose a subject), **Being wrong** (if model is constitutive, error is problematic).  
     - Partial: Handles **ghostwritten** (external inputs shape model), **appearing subject** (unity as inference).  

  ### Weakest Requirement  
  **The appearing subject** (Phenomenal Unity).  
  - Why negotiable: Its demand for *simplicity/persistence* directly conflicts with **the shared**/**divergent**. Weakening it to "account for the *illusion* of unity" resolves this.  
  - Cost: Risks making the self a mere useful fiction, potentially undermining DMR/PC’s normative force.  

  ### Conclusion on Your Framework  
  - **Your two jobs (DMR/PC) are compatible** but may not *always* align (e.g., **interrupted**). A theory must explain both, not force perfect overlap.  
  - **Cases do not smuggle in answers**: They highlight tensions any theory must navigate (e.g., narrative vs. biology, unity vs. fragmentation).  
  - **No requirement is undeliverable**, but **appearing subject** needs refinement to avoid contradiction with multiplicity cases.  
  - **Biggest vulnerability**: **Mine-ness** is a razor—it cuts deeply but may leave theories unable to capture first-personal "grip" without circularity. If forced to drop one, sacrifice strict unity (**appearing subject**) to save **mine-ness** and the core cases.  

  This spec is stringent enough to challenge *all* major theories (Dennett fails 4+ requirements), yet grounded in your non-negotiable cases. Proceed by testing candidates against the irreconcilable tension: how they handle **repudiator** (DMR without identity-feeling) and **shared** (PC without singularity).
