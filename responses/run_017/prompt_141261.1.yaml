prompt: |-
  Hey — need some help precisifying something because I keep tieing myself in knots and my advisor's entire contribution was "well, when in Rome," which is not an argument.

  Context: I'm a philosophy PhD student (social ontology, coordination norms, that general area), and I spent two months in the US on a visiting thing. I'm from a country where nobody tips and where jaywalking is an actual fine that people actually pay. Two arguments with the same friend:

  1. I tipped 10% at a restaurant and got told "when in Rome" — meaning I owe the 20%.
  2. I waited for the walk signal in a city where literally everyone crosses whenever, and got told "when in Rome" — meaning I should have crossed.

  So the slogan got used to push me above my home norm in one case and below it in the other, and I want to know what it could actually mean such that it does that work.

  What I want is a menu, not an essay: the distinct precise claims "when in Rome, do as the Romans do" could be expressing. For each one: state it sharply enough that it could be false; label it trivial / substantive-and-defensible / false-or-incoherent; say what it implies about each of my two cases; and say specifically whether it gives a reason to a *visitor*, as opposed to a local. Please don't give me sources or a reading list, I just want the arguments.

  Here's the part I can't get straight, and I suspect it's where the real action is. The standard story about why you should follow a convention is equilibrium stuff: it's arbitrary which one we land on, you benefit from it, you'd be free-riding or eroding it if you defected. But a visitor is in town for two weeks — their compliance can't sustain the convention and their defection can't destabilize it. Call it the two-week problem if that helps. So either the reading doing work in my friend's mouth isn't the equilibrium reading at all, or visitors do affect conventions somehow and I'm wrong about that. I genuinely don't know which.

  I've also been sorting the cases into three buckets — tell me if this taxonomy is doing any work or if it's a red herring:

  - pure coordination: drive on the right, queue vs. scrum. Content is arbitrary, only the coordination matters.
  - transfer conventions: tipping. Nothing about it is coordination; the point is that money moves, and in the US a chunk of the worker's actual wage is routed through it.
  - deference conventions: where conforming signals something like "I accept that I'm governed by your norms while I'm here" — waiting your turn patiently, not making a scene, not loudly announcing that home does it better.

  I want each reading tested against those buckets: which readings only make sense for pure coordination cases, which extend to the transfer ones, which only make sense for the deference ones. And two stress tests I've been playing with:

  - the invisible tourist: you're in Rome, no local will ever observe you, nothing you do affects whether the convention persists, and nobody is inconvenienced either way. Does the reading still say you have a reason to comply? If it goes quiet here, that's informative and I want you to say so.
  - the bad Rome: the local convention is genuinely bad — the scrum really does hurt elderly people, the tipping norm is what lets restaurants pay a wage nobody could live on. Does the reading still tell you to comply? If it definitely does, it's collapsed into relativism, and I want that said explicitly rather than politely avoided.

  Two more readings I think are in the neighborhood and want separated: one on which you should do what the Romans do *for the reasons they do it* (tip where tipping is how the wage is structured, don't tip where it's basically a shakedown), and one on which you should do what the Romans *expect of you* — which is not the same thing, since locals usually cut tourists slack but sometimes expect more of them. I think those two come apart in my tipping case in opposite directions, and I want to know which one my friend was invoking, or whether he was sliding between them depending on which one got him the verdict he wanted.

  Format: numbered readings, a few sentences each, verdict attached to each. Finish with two short paragraphs: which reading (if any) would actually make his use of the slogan more than a conversation-ender, and which reading is the most commonly meant and the weakest.
reasoning: |-
  Hmm, the user is a philosophy PhD student specializing in social ontology and coordination norms. They're grappling with the ambiguity of the "when in Rome" principle after experiencing conflicting applications during a US visit. The core tension is that the same slogan was used to demand higher conformity (tipping 20% instead of 10%) and lower conformity (jaywalking rather than waiting for signals), which exposes logical inconsistencies in its casual invocation.

  The user wants a structured analysis, not exhaustive philosophical debate. Key requirements include: 
  1) Discrete numbered readings of the principle 
  2) Classification as trivial/defensible/incoherent 
  3) Application to tipping/jaywalking cases 
  4) Visitor-specific reason assessment 
  5) Testing against their convention taxonomy (pure coordination/transfer/deference) 
  6) Stress tests (invisible tourist/bad Rome) 
  7) Distinguishing between "reasons Romans have" vs "Roman expectations"

  The deeper puzzle is the "two-week problem": why transient agents should comply with conventions they can't sustain or destabilize. Equilibrium-based accounts seem inadequate here, suggesting alternative justifications are at play in the friend's usage. 

  Their proposed taxonomy seems useful: 
  - Pure coordination (e.g., driving rules) relies critically on universal participation 
  - Transfer conventions (e.g., tipping) involve material consequences beyond coordination 
  - Deference conventions (e.g., queueing) concern symbolic social recognition 

  The stress tests effectively probe whether the principle holds when: 
  a) Compliance is undetectable (invisible tourist) 
  b) The norm is harmful (bad Rome) 

  The "reasons vs expectations" distinction is particularly sharp for tipping: Should one tip because servers rely on tips (reason-based), or because locals expect 20% (expectation-based)? These diverge when expectations don't track functional reasons. 

  The friend likely conflated multiple readings situationally. For tipping, they invoked expectation-based compliance (demanding 20%). For jaywalking, they used a pure coordination reading (minimizing conspicuousness). Neither survives the stress tests consistently. 

  Most common but weakest reading is "Avoid conspicuous noncompliance" - it works pragmatically but lacks normative depth. Most defensible is "Respect functional reasons behind local practices" - though it requires contextual knowledge tourists may lack. 

  Notably, equilibrium accounts fail for transient agents, suggesting the friend either: 
  a) Mistakenly assumed visitors impact conventions 
  b) Was actually appealing to non-equilibrium reasons (deference/expectations) 
  The taxonomy helps here: equilibrium only justifies pure coordination cases, while transfer/deference conventions require different rationales.
answer: |-
  Here's a menu of precise readings for "When in Rome," analyzed as requested:

  ### Core Readings
  1.  **Minimize Local Disruption (Practical Coordination)**
      *   **Claim:** As a visitor, you should act to avoid inconveniencing locals or causing predictable negative reactions (confusion, annoyance, confrontation) due to non-conformity.
      *   **Verdict:** Substantive-and-defensible (pragmatic).
      *   **Tipping (10%):** Violates (predictably causes annoyance/confrontation from server/establishment). Owe 20%.
      *   **Jaywalking (Waited):** Violates (causes minor inconvenience/surprise to locals waiting; makes you conspicuous). Should have crossed.
      *   **Visitor Reason?** Yes (avoids friction).
      *   **Taxonomy:** Primarily **Pure Coordination** & **Deference** (avoids friction/signals non-disruption). Weak for **Transfer** (unless disruption is key consequence).
      *   **Invisible Tourist:** *No reason* (no disruption caused).
      *   **Bad Rome:** *No reason* if disruption is the sole justification. If the act *itself* causes harm (e.g., participating in a harmful scrum), disruption may still occur from non-participation, creating tension.
      *   **Reasons/Expectations:** Focuses on *expectations* to avoid disruption.

  2.  **Signal Respect for Local Autonomy (Deference)**
      *   **Claim:** As a visitor, you should conform to signal acceptance of the local community's right to govern shared social spaces/practices during your stay, acknowledging their norms as authoritative *for this context*.
      *   **Verdict:** Substantive-and-defensible (relational).
      *   **Tipping (10%):** Violates (signals rejection of local wage/service custom). Owe 20%.
      *   **Jaywalking (Waited):** Violates (signals rejection of local pedestrian flow norms; seen as judgmental). Should have crossed.
      *   **Visitor Reason?** Yes (specifically for visitors - demonstrates respect).
      *   **Taxonomy:** Primarily **Deference**. Extends to **Pure Coordination** & **Transfer** as expressions of respect for local systems.
      *   **Invisible Tourist:** *Possible reason* (respect is an attitude; non-conformity might still feel like a private failure of respect).
      *   **Bad Rome:** *Collapses into relativism* (signaling respect requires conforming regardless of norm content).
      *   **Reasons/Expectations:** Focuses on conforming to the *practice itself* as the sign of respect, regardless of underlying reasons or specific local expectations of tourists.

  3.  **Participate in the Local Practice *for its Local Function* (Functional Integration)**
      *   **Claim:** You should act according to the functional role the practice plays *within the local system*, understanding *why* Romans do it, and doing it for *that reason*.
      *   **Verdict:** Substantive-and-defensible (requires understanding).
      *   **Tipping (10%):** Depends. If US tipping is understood as *part of the server's wage*, you functionally owe ~20% to fulfill that wage structure. If understood as purely optional gratuity, 10% might suffice. Requires local functional knowledge.
      *   **Jaywalking (Waited):** If the functional norm is efficient pedestrian flow, waiting unnecessarily disrupts it. Should have crossed. If the functional norm is strict safety/order, waiting is correct.
      *   **Visitor Reason?** Yes (to correctly participate in the system).
      *   **Taxonomy:** Strong for **Transfer** (money flow). Strong for **Pure Coordination** when function (e.g., traffic flow) is understood. Weak for **Deference** if the signal itself is the primary function.
      *   **Invisible Tourist:** *Possible reason* (acting functionally correct might be intrinsically valuable or align with your own values regarding system participation).
      *   **Bad Rome:** *May not apply* - You wouldn't/shouldn't participate in the *harmful function*. (e.g., don't participate in a scrum that harms the elderly *because* it harms them).
      *   **Reasons/Expectations:** Focuses on the *Romans' reasons* for the practice, not necessarily their explicit expectations *of tourists*.

  4.  **Avoid Conspicuousness (Blending In)**
      *   **Claim:** You should act to avoid standing out negatively as an outsider by visibly violating norms, regardless of the norm's content or function.
      *   **Verdict:** Trivial/Substantive (pragmatic/social).
      *   **Tipping (10%):** Violates (makes you conspicuously cheap). Owe 20%.
      *   **Jaywalking (Waited):** Violates (makes you conspicuously cautious/foreign). Should have crossed.
      *   **Visitor Reason?** Yes (specifically for visitors wanting to avoid attention).
      *   **Taxonomy:** Applies to all (**Pure**, **Transfer**, **Deference**) if violation makes you conspicuous.
      *   **Invisible Tourist:** *No reason*.
      *   **Bad Rome:** *Applies* (blending in requires conforming, even to bad norms).
      *   **Reasons/Expectations:** Focuses purely on *local expectations* and *observability*.

  5.  **Maximize Personal Benefit / Minimize Cost (Visitor Instrumentalism)**
      *   **Claim:** You should conform *only* if the local consequences (social sanction, refusal of service, fine, personal discomfort) outweigh the cost/effort of conformity *for you personally*.
      *   **Verdict:** Substantive (self-interested).
      *   **Tipping (10%):** Depends. Risk of confrontation/poor service vs. saving money. Likely owe 20% to avoid costs.
      *   **Jaywalking (Waited):** Depends. Minimal cost of waiting vs. tiny risk of fine/disapproval. Might be fine to wait.
      *   **Visitor Reason?** Yes (self-interest).
      *   **Taxonomy:** Applies to all if non-conformity carries local costs.
      *   **Invisible Tourist:** *No reason* (no costs incurred).
      *   **Bad Rome:** *No reason to comply* if the personal cost of conformity (e.g., supporting exploitation) outweighs sanctions, or if sanctions are absent/invisible.
      *   **Reasons/Expectations:** Ignores both; focuses solely on consequences *for the visitor*.

  ### Addressing Your Specifics
  *   **The Two-Week Problem:** Equilibrium stability arguments are **weak for transient visitors**. Reading 1 (Disruption) might hold if your *specific* action causes *immediate* disruption (e.g., blocking a scrum flow, stiffing *your* server). Reading 2 (Respect) and Reading 3 (Function) are independent of stability. Reading 4 (Conspicuousness) and Reading 5 (Instrumentalism) are inherently visitor-focused. Your friend likely wasn't thinking about equilibrium stability.
  *   **Your Friend's Usage:** They were likely **sliding between Reading 1 (Disruption - "don't annoy people") and Reading 4 (Conspicuousness - "don't stand out")**, depending on which pressured you towards conformity in each case. For tipping, non-conformity (10%) is disruptive *and* conspicuous. For jaywalking, conformity (waiting) *is* conspicuous locally. They prioritized conformity over the *content* of your home norm each time.
  *   **Reasons vs. Expectations:** Your tipping case perfectly illustrates the split. Reading 3 (Function) asks "What is tipping *for* here?" (wage component -> requires ~20%). Reading 4 (Conspicuousness) or Reading 1 (Disruption) ask "What do locals *expect* tourists to tip?" (often 15-20%, regardless of exact wage structure). Your friend appealed to *expectations* (Reading 1/4).

  ### Verdicts on Your Friend's Slogan
  *   **Reading Giving it Force (beyond conversation-ender):** **Reading 1 (Minimize Local Disruption)**. If presented as a pragmatic rule to avoid causing annoyance or problems for locals during your temporary stay, it has defensible moral/practical weight ("Don't be a difficult guest"). This connects to basic hospitality norms.
  *   **Most Common & Weakest Reading:** **Reading 4 (Avoid Conspicuousness)**. This is the instinctive "don't stick out like a sore thumb" interpretation. It's common because it's simple and observable. It's weak because it lacks deeper normative justification (why *shouldn't* you stand out if the norm is bad or arbitrary?), reduces the principle to social anxiety, and doesn't engage with the norm's function or the ethics of respect. It's easily weaponized for conformity pressure, as your friend demonstrated.
