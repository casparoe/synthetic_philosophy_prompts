prompt: |-
  i'm writing a short closing essay for a seminar on experimental philosophy, and instead of ending on yet another vignette i want to end on The Social Network. The angle is the Knobe effect: you know the setup — the chairman who doesn't care about the environment either way, harms it as a side effect and gets called intentional, helps it as a side effect and doesn't. I want to read the whole film as a machine for generating that asymmetry.

  Mark is basically a walking side-effect generator who insists, every time, that he never aimed at the thing he's accused of: the blog post that humiliates his girlfriend at the start, the Winklevosses and their idea, the share dilution that pushes Eduardo out, the wreckage of the friendship itself. Which of those scenes are the cleanest instances of the pattern, and which ones are actually messy in a way the vignette literature hides — cases where he definitly foresaw it, or half-wanted it, or wanted it and disowned it a second later? And is the audience doing something a bit different from the standard effect, which I'd half-invent if I had to: not asking of one action 'did he do that on purpose' but of a whole life, over two hours — call it biographical intentionality, where every bad outcome gets absorbed into who he is and every good one gets written off as luck or Sean Parker. Does a Knobe-style account predict that, or does it need extending?

  Then the two big competing explanations. On one (the deep-self / character line) we say 'intentionally' because the harm expresses the agent — and the film is unusually generous with evidence about Mark's actual motives, his envy, his need to be let in. On the other (the reason-explanation line) we say it because the harm is what explains why he acted at all, the way helping the environment isn't what explains the chairman. Which one does the movie support, and does it maybe split them apart in a way a one-page scenario can't? That's part of what I want to argue: the vignette gives you a stranger and a paragraph, this gives you hundreds of scenes of a person, and the verdict still doesn't settle — which is itself a criticism of how thin our usual evidence is.

  Two more things I'm chewing on. First, structure: the film tells the same events twice, inside two depositions, in adversary order, with a sympathetic narrator each time. Is Sorkin deliberately running something like an order-framing manipulation on the audience's attributions — first you hear the Winklevoss version and Mark looks like a thief, then you hear his and he looks like a striver — and if so, does the film know it's doing to us what the vignettes do to subjects, or is it just good cross-cutting? Second, the dual character concepts strand (friend, artist, scientist: descriptive criteria plus whether you realize the value the concept is meant to serve). Eduardo's claim to have been Mark's only friend, and the separate question of whether Mark is a real founder or just a guy who stole one — those feel like textbook dual-character disputes, and the ending seems to turn on exactly that: the lawyer telling him he isn't actually an asshole, just working very hard at being one, while he sits there reloading his ex-girlfriend's page. Is that a reframe of the intentionality question or just the same puzzle in softer clothes — passing on the descriptive dimension while flunking the normative one?

  I need it to be a real reading and not an illustration, so please also say where the film resists this: where the Knobe framing flattens something the movie is doing, where the vignette concepts just don't fit a character this long and this ambiguous, and whether the film ends up adding anything to the debate that the papers don't. If you were showing three scenes to a room of undergrads to make the point, which three? No footnotes or citations, I'll chase those up myself.
reasoning: |-
  Okay, let me unpack this request. The user is writing a closing essay for an experimental philosophy seminar, specifically focusing on how The Social Network exemplifies the Knobe effect. They want to move beyond vignettes to analyze the entire film as an "asymmetry-generating machine" where negative outcomes are consistently seen as intentional while positive ones are dismissed. 

  The user's questions cluster into several layers: 
  First, identifying clean vs messy instances of the Knobe pattern in Mark's actions (blog post, Winklevoss betrayal, Eduardo's ousting). 
  Second, examining if the audience applies "biographical intentionality" - absorbing all bad outcomes into Mark's character while externalizing good ones. 
  Third, testing two competing explanations of the Knobe effect (deep-self vs reason-explanation) through the film's rich characterization. 
  Fourth, analyzing structural elements like the dual depositions as framing manipulations and dual-character concepts (friend/founder). 

  Notably, they insist this must be a substantive reading, not just illustration, and ask where the film resists Knobe-effect framing. They also want three teachable scenes.

  Hmm... the challenge here is balancing philosophical precision with film analysis while avoiding oversimplification. The Social Network's complexity actually helps expose limitations of vignette-based studies: 
  - Vignettes isolate single actions; film shows cumulative chains (e.g., Eduardo's freezing shares looks intentional only when contextualized within Mark's prior pattern) 
  - Film provides motive evidence vignettes withhold (Mark's envy of final clubs) 
  - Structural devices (conflicting depositions) mirror experimental framing effects but with higher stakes 

  For teachable scenes, I'd pick: 
  1. Opening breakup (clean Knobe: he disclaims intent while clearly foreseeing humiliation) 
  2. Eduardo's share dilution (messy: foreseen harm he later disowns) 
  3. Ending's Facebook refresh (biographical absorption: we see all past harms condensed into "asshole" verdict despite counterevidence)

  Where the film resists: It complicates "deep-self" theory by showing Mark's genuine surprise at being hated (suggesting partial self-ignorance), and problematizes reason-explanation when harms become necessary conditions for success (Winklevoss lawsuit enabling Facebook's exclusivity). 

  The dual-character concepts are crucial - when the lawyer says "you're not an asshole, you're just trying so hard to be one," it highlights normative failure despite descriptive competence, mirroring how we judge intentionality. This reframes rather than repeats the puzzle.

  Key addition to philosophical debate: Film demonstrates that "foresight" alone is insufficient for intentionality judgments; we require evidence of characterological resonance or explanatory necessity across time. Vignettes can't capture this temporal dimension.
answer: |-
  Here’s a streamlined reading that uses *The Social Network* to interrogate the Knobe effect, pushing beyond vignette limitations while acknowledging where the film complicates or resists the framework. Focus on these key beats:

  ### Three Core Scenes for the Asymmetry Machine  
  1. **The Blog Post (Opening Scene)**  
     - *Clean Knobe:* Mark disclaims intent ("Blogging isn’t writing, it’s graffiti with punctuation") while foreseeing Erica’s humiliation. Audience judges it intentional because harm aligns with his resentment of exclusion.  
     - *Flattened?* The scene’s emotional rawness makes his disavowal feel like self-deception, not pure side-effect. Vignettes rarely capture this layer of defensive foresight.  

  2. **Freezing Eduardo’s Shares (Dilution Scene)**  
     - *Messy Knobe:* Mark foresaw the harm (Sean Parker goads him: "You *have* to hurt him"), but frames it as necessary for growth ("The site needed to evolve").  
     - *Vignette Gap:* Unlike the chairman’s abstract harm, Mark’s history with Eduardo forces audiences to weigh cumulative betrayal vs. business "necessity." The harm *explains* his action (reason-explanation), but also *expresses* his transactional view of loyalty (deep-self).  

  3. **The Winklevoss Settlement (Deposition Frame)**  
     - *Structural Knobe:* The dual depositions manipulate intentionality judgments. Tyler’s testimony ("He stole our idea!") primes intentional theft; Mark’s rebuttal ("They’d have built a dating site for Harvard") reframes it as inevitable progress.  
     - *Audience Asymmetry:* We absorb the harm (their lost opportunity) into Mark’s identity ("ruthless innovator"), while crediting Facebook’s success to luck, timing, or Parker’s influence.  

  ---

  ### Biographical Intentionality vs. Vignette Limits  
  The film’s runtime turns Knobe’s "single-action" question into a verdict on Mark’s *character*. Negative outcomes (Eduardo’s ruin, Erica’s humiliation) calcify into "who he is"; positive ones (Facebook’s success) get externalized ("You’re not an asshole, Mark, you’re just trying so hard to be"). This asymmetry mirrors the Knobe effect but operates at a biographical scale—**harm accretes, benefit dissipates**. Vignettes can’t capture this sedimentation.  

  ---

  ### Competing Explanations & the Film’s Critique  
  - **Deep-Self Theory** wins: The film obsessively links harms to Mark’s psyche (his envy of finals clubs, need for validation). Harm *expresses* his core traits (e.g., the blog post channels his wounded ego).  
  - **Reason-Explanation** falters: Helping the Winklevosses wouldn’t serve *his* goals, but the film shows harms (e.g., betraying Eduardo) aren’t always necessary for success—they’re overdetermined by his character.  
  - **Vignette Critique:** With rich evidence, both theories apply yet fail to resolve ambiguity (e.g., did Mark *need* to betray Eduardo?). The film argues intentionality judgments require narrative context vignettes strip away.  

  ---

  ### Dual-Character Concepts & the Ending  
  Eduardo’s "I was your only friend" and the "founder" dispute are classic dual-character clashes:  
  - *Descriptive:* Mark technically co-founded FB but violated norms of idea attribution (Winklevoss) and partnership (Eduardo).  
  - *Normative:* The lawyer’s "you’re not an asshole" line rejects the deep-self reading, reframing harm as performative ("trying to be")—not innate. This **softens intentionality** into a question of *value alignment*. The reloading of Erica’s profile? A haunting coda: we judge the *pattern*, not the act.  

  ---

  ### Where the Film Resists Knobe  
  - **Ambiguity as Theme:** Mark’s motives are overdetermined (vengeance, ambition, social injury). Vignettes demand binary intent; the film luxuriates in doubt.  
  - **Structural Genius ≠ Framing Effect:** Sorkin’s depositions aren’t just order manipulation—they’re adversarial storytelling. We *know* both sides are biased, making the asymmetry harder to dismiss as cognitive error.  
  - **What the Film Adds:** It shows intentionality judgments are **narrative habits**, not just cognitive biases. We reconstruct lives as "origin stories" for harm, downplaying benefit. Papers miss this storied dimension.  

  ---

  ### Teaching Scenes  
  1. **Blog Post Breakup (0:00-10:00)** – Clean Knobe + defensive foresight.  
  2. **Share Dilution (1:27:00-1:32:00)** – Messy Knobe; harm as "necessary" yet expressive.  
  3. **Final Shot (2:00:00-2:01:00)** – Biographical absorption: reloading the page as verdict on all prior harms.  

  **Closing Hook:** *The Social Network* doesn’t just illustrate the Knobe effect—it autopsy’s it. Vignettes give us a chairman who *might* be a villain; Sorkin gives us a villain we *might* exonerate. Yet we condemn anyway. Why? Because life isn’t judged by vignettes. It’s judged by the story we tell about damage.
