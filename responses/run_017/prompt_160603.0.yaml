  ### **Ballot Sheets**  
  Each pair receives a ballot with:  
  ```markdown
  **Pairwise Comparison**  
  Option A: P = [value], A = [value], F = [value]  
  Option B: P = [value], A = [value], F = [value]  

  Which life is better? (Choose one; no ties allowed in Round 1)  
  ☐ Option A  
  ☐ Option B  

  Reason (optional): ________________________  
  ```

  ---

  ### **Minute-by-Minute Timeline (80 Minutes Total)**  
  **0–10 min: Setup and Instructions**  
  - Distribute 20 index cards (lives) and ballots to 8 student pairs (16 students).  
  - Explain goods: Pleasure (joy, fun), Achievement (goals, success), Friendship (relationships).  
  - Rules:  
    - Pairs see only their assigned adjacent pair (e.g., Life 1 vs. Life 2).  
    - Vote on which life is better overall; no ties allowed.  
    - No discussing other pairs or guessing the big picture.  
    - Half the room starts at "Pair 1–2" (Lives 1–2), half at "Pair 11–12" (Lives 11–12).  

  **10–30 min: Voting Rounds**  
  - **Round 1 (15 min)**: Pairs vote on their initial pair.  
    - **Enforce no ties**: If a pair insists, say: "You must choose. Imagine a forced-choice scenario like medical triage."  
  - **Rotate Pairs (5 min)**: Cards move to the next adjacent pair (e.g., Pair 1–2 becomes Pair 2–3).  
  - **Round 2 (15 min)**: Repeat voting. Collect ballots.  

  **30–50 min: Assemble the Chain**  
  - Tape ballots in order on the board, forming a chain:  
    Life 1 → Life 2 → ... → Life 20 → Life 1.  
  - Read votes aloud: "You collectively endorsed Life 1 > Life 2, Life 2 > Life 3, ..., Life 20 > Life 1."  
  - Reveal full loop: Show Life 1 and Life 20 scores side by side.  

  **50–80 min: Debrief**  
  1. **The Contradiction (5 min)**:  
     - Chain implies Life 1 > Life 1 (impossible).  
     - Options: Deny a link, deny transitivity, or deny forced choice (parity/incomparability).  

  2. **Scattered Cutoffs (10 min)**:  
     - Show ballots with close votes (e.g., 6–5 splits or optional reasons like "A has more P but less F").  
     - Explain: These may be cutoff points for parity/vagueness.  

  3. **Betterness vs. Permissibility (5 min)**:  
     - Clarify: This is a cycle in *betterness* (each step is better, not just permissible like the self-torturer).  
     - Why it matters: Challenges rational choice (transitivity is foundational).  

  4. **Limitations and Gaps (10 min)**:  
     - **Parity vs. Incomparability**: The activity doesn’t distinguish them. Say:  
       - *Parity*: Lives are "on a par" (neither better, but comparable).  
       - *Incomparability*: Lives are fundamentally incomparable (no common measure).  
     - **Choice Implications**: If better-than is cyclic, no "best" life exists; choice becomes intractable.  

  ---

  ### **Rules to Prevent Meta-Inference**  
  - **Isolation Rule**: Pairs can’t share scores or discuss beyond their pair.  
  - **Card Control**: Only reveal one pair per station; cover other numbers.  
  - **Anti-Leak Script**: "If you guess the loop, keep it to yourself—focus on judging this pair as if it’s real."  
  - **Lexical Ordering**: If a pair says, "Pleasure always trumps," respond: "Assume goods are broadly comparable—no single good always dominates unless extreme."  

  ### **Handling Ties and Edge Cases**  
  - **Ties in Round 1**: Reiterate forced choice. If they resist, allow a coin flip.  
  - **Lexical Short-Circuit**: Note it in debrief as a "deny forced choice" response (e.g., lexical orders avoid cycles but are rigid).  

  ---

  ### **Why This Works**  
  - **Psychological Force**: Students only see local gains (+8 vs. –7 feels clear). The reveal shocks them with global irrationality.  
  - **Philosophical Payoff**: Stages Temkin-style spectrum arguments, pushing students to question transitivity or accept parity.  
  - **Practicality**: Fits time constraints and avoids complex math.  

  **Final Note**: The activity simplifies parity/incomparability; you’ll need to articulate that gap. Emphasize that cyclic betterness undermines decision theory—choice becomes "dizzying" without transitivity.
