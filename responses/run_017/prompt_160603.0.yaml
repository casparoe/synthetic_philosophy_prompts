  Below is a complete runnable activity for your value theory seminar, designed to create a spectrum argument against the transitivity of "better-than" through a forced-choice exercise. The activity uses a closed loop of lives described by three goods—Pleasure (P), Achievement (A), and Friendship (F)—with small, seemingly beneficial trades that cumulatively form a cycle. Students will only see adjacent pairs, and the collective votes will reveal a violation of transitivity.

  ---

  ### **Life Descriptions for 20 Cards (Index Cards)**  
  Each card lists a life with numerical scores for (P, A, F). Lives are arranged in a cycle: Life 1 → Life 2 → ... → Life 20 → Life 1. Adjacent lives differ by a small trade, and the cycle ends with Life 1 strictly worse than Life 16, even though each step appears beneficial.  

  **Trade Scheme**:  
  - **Phase 1 (Lives 1–7)**: Trade Achievement for Pleasure.  
    Each step: Gain +8 P, Lose –7 A (F unchanged).  
  - **Phase 2 (Lives 8–13)**: Trade Pleasure for Friendship.  
    Each step: Gain +8 F, Lose –7 P (A unchanged).  
  - **Phase 3 (Lives 14–20)**: Trade Friendship for Achievement.  
    Each step: Gain +8 A, Lose –7 F (P unchanged).  

