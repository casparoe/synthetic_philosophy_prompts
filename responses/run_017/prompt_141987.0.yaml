prompt: |-
  I direct a small technical unit in a national geological survey. Several times a year we publish single-number probability statements that are then used downstream by regional planners doing expected-cost arithmetic, and increasingly for one-off go/no-go decisions on single projects that will never be repeated: a levee to be raised or not, a town to be relocated or not. Examples: "0.22 probability that the Kestrel fault segment produces a magnitude 7 or greater rupture in the next thirty years"; "0.04 probability per year that the Alder Valley levee system fails."

  Our numbers come from three quite different places. Some come from long-run relative frequencies in a reference class — paleoseismic records of past ruptures, or component-failure databases for levee systems. Some come from physical models that assign a single-case tendency to a particular set-up: a stress-transfer model of this specific fault, a hydrological model of this specific valley. Some come from structured expert judgment, elicited and then revised as new data arrive. We have also found that some of our frequency-based statements move by a factor of two depending on how narrowly the reference class is drawn — all faults in the basin versus faults of comparable slip rate and geometry.

  A new oversight board has now ruled that every number we publish must be traceable: we must be able to say what kind of support it has, and we may not silently average or mix supports of different kinds, because the planners downstream treat our number as something to bet with, which is not the same thing as a frequency and not the same thing as a physical tendency.

  Please write a procedure my reviewers can run on a candidate statement before we sign off on it. It should consist of: an ordered set of questions; for each question, what counts as a sufficient answer drawn from our own files and modelling reports; the points at which the procedure returns "do not publish a number" or "publish only as an interval or qualitative band"; and the points at which it must hand the decision back to a person because the issue is a judgment call rather than a checkable one. Ground it in what the three interpretations actually say — the frequentist reading of probability as long-run relative frequency in a fixed reference class, the subjectivist or Bayesian reading as degree of belief constrained by coherence and revised by conditioning, and the propensity reading as the objective single-case tendency of a particular set-up — and in the fact that these are not three rival estimates of one quantity so much as three different things a probability claim can be.

  Constraints: my reviewers have roughly forty minutes per statement and no formal training in the philosophy of probability, so each step must say what to look for in material we actually have; the procedure must be strict enough that two reviewers reach the same verdict on the same file.

  Then apply it to three cases. (1) The Kestrel fault statement above, where we have six hundred years of paleoseismic records but the segment is now thought to be in a stress state not represented anywhere in that record, and where the reference class choice gives 0.22 on one drawing and 0.11 on another. (2) A proposed statement about a first-of-a-kind carbon-capture containment vault: no failure history at all, a physics model giving a 0.02 failure probability over fifty years, and an expert panel giving 0.05 to 0.15. (3) A statement about whether a named glacier will "collapse" within the decade, where there is no agreed threshold for collapse and different teams' figures range from 0.1 to 0.6 accordingly. At least one of these should come out as an answer the board will not like.

  Close with a short section, headed "What this procedure cannot do," that says plainly how the procedure should treat the gap between a number supported as a frequency or a physical propensity and the confidence a planner is entitled to place in a single non-repeated project, and that states which of the reference-class and threshold difficulties are managed rather than solved.

  Format the answer as numbered procedural steps, with the three cases in clearly labelled subsections and the closing section under the heading above. Hard limit: 1,100 words, counting the cases and the closing section. Do not cite, quote, or attribute any philosophers or published works; the reasoning should stand on its own.
reasoning: |-
  Hmm, the user directs a technical unit in a geological survey and needs a procedure for reviewing probability statements. They publish numbers used for high-stakes decisions like building levees or relocating towns. These numbers come from three sources: frequency data, physical models, and expert judgment. The problem is that an oversight board now requires traceability—they can't mix different types of support, and downstream users treat the numbers as betting odds.

  The user wants a strict procedure that reviewers can follow in about 40 minutes. Reviewers aren't philosophers, so steps must be concrete, based on files and reports. The procedure should flag when to not publish a number or use an interval, and when to escalate to human judgment. It must be grounded in the three interpretations of probability: frequentist (long-run frequency), subjectivist/Bayesian (degree of belief), and propensity (single-case tendency). These aren't just rival estimates but fundamentally different things.

  Key constraints: The procedure needs to handle cases where sources conflict, reference classes vary, or definitions are ambiguous. It should ensure consistency between reviewers. The user provided three test cases to apply it to, and one should fail to show it works. Finally, a closing section must address the gap between the probability and planner confidence, and admit what the procedure can't fix.

  Now, I need to design the procedure. I'll start with ordered questions that force reviewers to identify the source of the number. For each source, define what counts as sufficient evidence: clear data for frequencies, validated models for propensities, documented elicitation for beliefs. Then set rules for conflicts—like if sources disagree by more than a factor of 2, or if reference class choices change the number significantly, don't publish a point estimate. Also, if definitions are vague (like "collapse" in glaciers), force an interval or qualitative band. Hand back to humans for judgment calls, like choosing a reference class.

  For the test cases: Case 1 (Kestrel fault) has frequency data but stress state issues and reference class variance—I'd say publish as an interval. Case 2 (carbon vault) has no history, a model, and expert range—experts cover the model, so publish the range. Case 3 (glacier collapse) has no agreed threshold, so no number, just qualitative. Case 2 might displease the board since it rejects the model's point estimate.

  In the closing section, I'll emphasize that the procedure can't bridge the gap to single-case decisions—probabilities aren't guarantees. It manages reference class and threshold issues by flagging them, not solving them. This keeps it honest and within word limits.

  I need to make this tight and under 1,100 words. No citations, just clear reasoning. The structure will be: numbered steps, then subsections for each case, then the closing.
answer: |-
  ### Probability Statement Review Procedure for Geological Survey Unit

  **Purpose:** To ensure published single-number probabilities are traceable to one coherent interpretation (frequency, propensity, or constrained belief) and suitable for high-stakes, single-use decisions. Mixing interpretations or having unresolved conflicts voids traceability.

  **Reviewer Instructions:** Work sequentially. Stop and apply verdict if triggered. Use only documented evidence in files/reports. Aim for 40 minutes. Verdicts: "Publish Number," "Publish Interval/Band," "Do Not Publish Number," "Human Judgment Needed."

  1.  **What is the claimed interpretation?** *Look for:* Explicit statement in the draft report or source documentation identifying the probability as a long-run frequency, a physical propensity, or a formally constrained/elicited degree of belief (Bayesian/subjectivist). *Sufficient:* Clear label in the "Methods" or "Interpretation" section (e.g., "This is the estimated annual failure frequency based on component database XYZ," "This probability represents the modeled physical tendency of this specific structure," "This is the pooled central estimate from our expert elicitation protocol ABC"). *Insufficient:* Vague language ("likely," "probable," "based on analysis"), implied interpretation, or absence of statement. *Verdict:* **Human Judgment Needed** (to clarify intended interpretation based on evidence).

  2.  **Is the evidence consistent with the claimed interpretation?**
      *   *If claimed as Frequency:* *Look for:* Definition of a fixed, well-specified reference class (e.g., "all M7+ ruptures on faults within Basin Y over the last 10,000 years," "failure events in levee systems with clay cores and design standard Z"). Evidence of relative frequency calculation (counts, durations). *Sufficient:* Documented dataset, clear class definition, calculation shown. *Insufficient:* Reference class undefined, ambiguous, or demonstrably unstable (see Step 3). Evidence involves untestable assumptions about unique features. *Verdict:* **Do Not Publish Number** (if insufficient). **Human Judgment Needed** (if class definition requires non-standard choice).
      *   *If claimed as Propensity:* *Look for:* Description of a validated physics-based model of *this specific* system (e.g., finite element stress model of Kestrel fault, coupled hydro-mechanical model of Alder Valley levee). Evidence the model captures the relevant failure mechanisms and has been tested/validated against relevant data/benchmarks. *Sufficient:* Model documentation, validation report showing good predictive performance for similar systems or key sub-components. *Insufficient:* Model is purely conceptual, unvalidated, relies heavily on calibration to sparse data of *this* system, or outputs are highly sensitive to uncertain inputs not rigorously quantified. *Verdict:* **Do Not Publish Number** (if insufficient).
      *   *If claimed as Constrained Belief (Expert):* *Look for:* Documentation of a structured elicitation protocol (e.g., Cooke's Classical Method, IDEA protocol) applied to relevant, independent experts. Evidence of calibration/performance weighting if used. Record of the aggregation method (e.g., equal weighting, performance weights). *Sufficient:* Protocol description, list of experts, rationale for inclusion, elicitation questions, raw and aggregated results, documentation of conditioning/updating if applied. *Insufficient:* Unstructured "expert opinion," undocumented meeting notes, simple averaging without protocol, lack of expert independence rationale. *Verdict:* **Do Not Publish Number** (if insufficient).

  3.  **Is the supporting evidence stable and unambiguous?** *Look for:* Sensitivity analyses, alternative reference classes, model parameter variations, expert ranges. *Check for:*
      *   *Reference Class Dependence (Frequency):* Does varying the class definition within reasonable bounds change the probability by more than a factor of 1.5? *Sufficient:* Minor variations (< factor 1.5 change). *Insufficient/Unstable:* Major variations (> factor 1.5 change) and no objective basis to choose one class. *Verdict:* **Publish Interval** (if variation defined) or **Do Not Publish Number** (if unstable/undefined).
      *   *Model Uncertainty/Sensitivity (Propensity):* Does plausible variation in key uncertain inputs/parameters change the probability by more than a factor of 1.5? *Sufficient:* Minor sensitivity or quantified uncertainty included in output (e.g., distribution). *Insufficient/Unstable:* High sensitivity (> factor 1.5) and uncertainty not quantified/incorporated. *Verdict:* **Publish Interval** (if range defined) or **Do Not Publish Number** (if unstable/undefined).
      *   *Expert Disagreement (Belief):* Is the inter-expert range (before aggregation) or the aggregated uncertainty range wider than a factor of 2? *Sufficient:* Narrow range (< factor 2) or clear rationale for central estimate within structured protocol. *Insufficient/Unstable:* Wide range (> factor 2) without strong performance weighting justification or clear central tendency. *Verdict:* **Publish Interval** (if range defined) or **Do Not Publish Number** (if extreme disagreement).

  4.  **Is the event definition precise and unambiguous?** *Look for:* Clear, operational definition of the event (e.g., "rupture length > 50km AND magnitude >= 7.0," "overtopping OR structural failure leading to breach > 10m wide," "loss of >90% ice volume"). *Sufficient:* Quantifiable, observable criteria documented. *Insufficient:* Vague terms ("collapse," "significant failure," "major rupture") without quantitative thresholds. *Verdict:* **Do Not Publish Number** (if insufficient definition).

  5.  **Are conflicting interpretations/sources present?** *Look for:* Multiple sources (frequency, model, expert) cited for the *same* probability number, or averaging of numbers from different sources/interpretations. *Sufficient:* Only one source/interpretation used *or* explicit, justified weighting of different interpretations framed as a belief update (extremely rare). *Insufficient:* Silent mixing, averaging without justification, or presenting one number derived from incompatible sources. *Verdict:* **Do Not Publish Number**.

  **Final Verdict Logic:**
  *   If any step triggers **Do Not Publish Number**, stop. Statement is invalid for single number.
  *   If any step triggers **Publish Interval/Band**, the final output must be an interval/band reflecting the instability/uncertainty.
  *   If any step triggers **Human Judgment Needed**, escalate to the unit lead/designated senior scientist. Their documented rationale becomes part of the file.
  *   If all steps pass with **Sufficient** and no intervals/bands triggered, **Publish Number** is valid. The report must clearly state the interpretation and basis (from Step 1).

  ---

  ### Application to Cases

  **Case 1: Kestrel Fault Segment (0.22 probability M7+ in 30 years)**
  1.  *Claimed Interpretation?* Likely Frequency (paleoseismic records). Assume documented. Pass.
  2.  *Evidence Consistent?* Reference class defined (past ruptures). Frequency calculated. Pass (as Frequency).
  3.  *Evidence Stable?* **Major instability:** Reference class choice gives 0.22 vs 0.11 (> factor 1.5). Stress state not in record undermines stability of *any* frequency estimate for *this* state. *Verdict:* **Publish Interval** (e.g., 0.11 - 0.22) *or* **Do Not Publish Number** (if stress state invalidates frequency approach entirely - **Human Judgment Needed** on this point).
  4.  *Event Defined?* "M7+ rupture" is clear. Pass.
  5.  *Conflicting Sources?* None mentioned beyond reference class variation. Pass.
  *   **Final Verdict:** **Publish Interval** (0.11 - 0.22) due to reference class instability, clearly stating frequency basis and source of range. **Or Human Judgment Needed** if stress state voids frequency claim.

  **Case 2: Carbon-Capture Containment Vault (0.02 model, 0.05-0.15 expert)**
  1.  *Claimed Interpretation?* Likely Propensity (model) or Belief (experts). Assume report claims Propensity based on model. Pass.
  2.  *Evidence Consistent (as Propensity)?* Physics model exists. *But:* Unvalidated (first-of-a-kind). High sensitivity likely (novelty). **Insufficient.** *Verdict:* **Do Not Publish Number** (0.02) as Propensity.
  3.  *(If re-labeled as Belief)* *Evidence Consistent?* Expert panel range exists. *But:* No structured protocol/aggregation documented? Assume insufficient details. **Insufficient.** *Verdict:* **Do Not Publish Number** (single expert number).
  4.  *Event Defined?* Assume "failure" defined (e.g., leakage > X%). Pass.
  5.  *Conflicting Sources?* Model gives 0.02, experts 0.05-0.15. Silent averaging/mixing would be **Insufficient.** *Verdict:* **Do Not Publish Number** (if trying to merge).
  *   **Final Verdict:** **Publish Interval** (0.02 - 0.15) or **Do Not Publish Number** (if experts not structured). Cannot publish 0.02 as Propensity (unvalidated) or a single expert number (unstructured). The board will dislike this rejection of a "precise" model number.

  **Case 3: Named Glacier "Collapse" (0.1 to 0.6 estimates)**
  1.  *Claimed Interpretation?* Unclear, likely mix of models/beliefs. **Insufficient.** *Verdict:* **Human Judgment Needed** (to specify). Assume returns "Belief" (experts/models inform belief).
  2.  *Evidence Consistent (as Belief)?* Multiple teams/models. *But:* No documented structured elicitation/aggregation *across* teams. **Insufficient.** *Verdict:* **Do Not Publish Number**.
  3.  *Evidence Stable?* N/A (insufficient evidence already).
  4.  *Event Defined?* **Major Insufficiency:** "Collapse" has no agreed quantitative threshold. Different thresholds drive the 0.1-0.6 range. *Verdict:* **Do Not Publish Number**.
  5.  *Conflicting Sources?* Implicit, but overshadowed by definition issue.
  *   **Final Verdict:** **Do Not Publish Number.** Must define "collapse" operationally first. Output could be qualitative ("moderate likelihood") or threshold-dependent intervals, but no single number.

  ---

  ### What this procedure cannot do

  *   **Bridge the Interpretation-Use Gap:** The procedure ensures the *published number* is traceable to a defined interpretation (frequency, propensity, belief). It **cannot** guarantee that this number directly translates to the "confidence" a planner should have for a *single, non-repeatable* decision. A 0.04 frequency *means* 4% of similar levees fail per year, not that *this* levee has a 4% "chance" of failing in a metaphysical sense. A 0.02 propensity *means* the model predicts this tendency, not that failure is "unlikely enough" for *this* specific go/no-go. A 0.10 belief *means* coherently constrained judgment, not a proven risk. The procedure clarifies the number's source and limits; it cannot change what the number fundamentally *is* for the planner's unique bet.
  *   **Solve Reference Class or Threshold Problems:** The procedure **manages** these issues by forcing disclosure (intervals, bands) or prohibiting unstable/ambiguous numbers. It **cannot** objectively resolve *which* reference class is "correct" for a unique fault segment under novel stress, or define *which* threshold for "glacier collapse" is the right one for planners. These require contextual **Human Judgment**, documented but not made algorithmic by this review.
  *   **Eliminate Uncertainty:** The procedure highlights instability and uncertainty. Publishing a traceable number or interval **does not** imply the underlying risk is perfectly known. It only means the stated probability meets the criteria for its claimed interpretation based on available evidence.
