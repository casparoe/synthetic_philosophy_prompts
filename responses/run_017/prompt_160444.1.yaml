prompt: |-
  I'm putting together a short position paper for a workshop on character and moral psychology later this term — the organizers want each participant to circulate a numbered list of commitments in advance so that the respondents can press on specific theses rather than on our general sensibility — and before I send mine out I would like an audit rather than a defense. I have been teaching a graduate seminar in this area for some years and, after a colloquium last month, a visitor raised an objection I could not answer cleanly, which is what prompted me to try to write the list down properly. Here it is.

  (1) I accept the situationist critique as an empirical thesis about the psychological bases of ordinary moral behaviour, at least in its moderate form: cross-situational consistency in trait-relevant behaviour is much lower than both folk psychology and neo-Aristotelian moral psychology have supposed, and a substantial share of the variance is accounted for by features of the setting that are morally irrelevant — whether one has just found a coin, whether one is in a hurry, whether the room smells unpleasant, whether an authority figure is nearby. I hold this while thinking the critics have overreached in one respect: I lean on the older, multiply-replicated demonstrations (the obedience experiments, the seminarian-in-a-hurry study, the phone-booth dime study) and I discount the later social-priming literature, which I take to have largely failed to replicate. I do not think the conclusion is that there is no such thing as character; I do think it rules out robust global traits of the sort virtue ethics has traditionally postulated.

  (2) I am nonetheless a neo-Aristotelian of a fairly orthodox sort: the virtues are the fundamental normative notions, and rightness is not to be defined by way of consequences or rules with the virtues then derived from it. I also want the account of right action to remain agent-involving — the right thing to do here is what the virtuous agent would characteristically do here — and I resist replacing this with a list of rules read off the virtue names, because I think the appeal to the agent is what does the real work in hard cases.

  (3) My way of keeping (2) given (1) is to reconstruct the virtues as fine-grained, situationally indexed dispositions — not honesty but honesty-under-conditions-of-type-C — with whatever unity a virtue has supplied by a stable if-then signature of the kind the personologists describe, rather than by sameness of behaviour across situations. I have also been toying with a further move I have started calling the scaffolding reply: much of what we praise in a praiseworthy person is their skill at arranging which situations they end up in — the reliable friend does not put herself in the position where returning the wallet is costly — so that on my view virtue includes a competence in managing one's circumstances, not merely a competence in responding to them.

  (4) Whatever the reconstruction, I want virtue to keep its practical role: it must be something one can be educated into, aspire to, and deliberately cultivate over a life, and it must be able to underwrite our practices of holding people responsible. I am drawn to blaming for quality of will — for what the action showed about the agent's judgments and concerns — rather than for the act token or its downstream effects.

  (5) I reject moral luck, at least in its constitutive and circumstantial forms: whether an act is right, and how much credit or discredit an agent incurs for it, should not ride on factors outside the agent's control. This is a large part of why I moved away from consequentialism, and I would give up a tidy decision procedure rather than give it up.

  (6) Methodologically, I think claims about the structure of character are answerable to empirical psychology, and that where psychology delivers a clear verdict, philosophical accounts of character must accommodate it rather than reinterpret it away.

  (7) I also want to be able to say that some people really are cross-situationally reliable in the way the tradition claimed — I can think of one or two — that this is a genuine feature of them rather than a run of situational luck, and that it makes them better people rather than merely luckier ones.

  Two verdicts I am attached to, since they are where I feel the strain most: the seminarian who was in a hurry and stepped past the slumped stranger did something wrong, though he is less blameworthy than someone who stepped past her in cold blood; and the passer-by who helped because he had just found a coin did the right thing and is creditable for it — I do not want to discount his credit on the ground that the cause of his helpfulness was a morally irrelevant piece of luck, and I do not want to say either that he merely got lucky in doing what he did.

  What I want from you is an audit of this package, not a survey of the literature. Tell me which pairs of these commitments are actually in tension and how badly, ordered by severity rather than all flagged equally, and for each tension say precisely which numbered item has to give and what giving it up would cost me elsewhere in the list. I take it that the familiar tension between (1) and (2) is less bad than it looks, and I would like you to confirm or deny that quickly and then spend the rest of your answer on the trouble I have not noticed — including the verdicts, which I suspect are where my stated principle fails to deliver. Please also mark any pair that only looks inconsistent and dissolves on inspection, so that I can see what I am entitled to keep, and finish by naming the single revision that would clean up the most and what it would leave me unable to say.
reasoning: |-
  Okay, let me approach this audit systematically. The user presents a tightly argued position with seven numbered commitments and two intuitive verdicts, requesting focused analysis of internal tensions. 

  First, I need to understand the core challenge: maintaining neo-Aristotelian virtue ethics (commitment 2) while accepting situationist psychology's claim that global character traits are largely illusory (commitment 1). The user's proposed solution involves redefining virtues as "fine-grained, situationally indexed dispositions" (3) supplemented by "scaffolding" - the skill of avoiding virtue-testing situations. This seems clever but requires scrutiny.

  The most immediate tension flashes between commitment 5 (rejection of moral luck) and the verdict about the coin-finder helper. If creditworthiness shouldn't depend on luck, but the helper's good deed was triggered by finding a coin (sheer luck), this violates the no-luck principle. Yet the user wants to credit him. This isn't just a minor conflict - it threatens to unravel the entire scaffolding approach. Either we admit circumstantial luck affects credit (abandoning 5) or we deny credit to luck-influenced actions (contradicting the verdict). 

  A second serious tension emerges between commitment 7 (the possibility of genuinely cross-situationally virtuous people) and commitment 1 (situationism's denial of global traits). The user tries to have it both ways: accepting situationism's core claim while reserving space for rare "saints." But if situational factors explain most behavioral variance, what explains these exceptions? Either situationism isn't as universally true as claimed (weakening 1) or these "saints" are just beneficiaries of exceptionally stable environments (contradicting 7's "genuine feature" claim). 

  The scaffolding solution (3) introduces its own problems with commitment 4. If virtue includes situation-avoidance skills, can we still hold people responsible when they fail to scaffold? The scaffolding ability itself seems vulnerable to situational factors - creating regress. Moreover, responsibility practices (4) traditionally focus on actions, but scaffolding failures are often omissions harder to observe/judge.

  Regarding the seminarian verdict: claiming he acted wrongly but is less blameworthy than someone doing the same thing "in cold blood" conflicts with commitment 4's quality-of-will approach. If blame tracks judgment/concerns, and both agents displayed identical concern (neither helped), why different blame? This seems to reintroduce outcome dependence through the back door.

  The methodological commitment (6) creates subtle pressure elsewhere. If psychology can force revisions to virtue concepts, but the user wants virtues to retain normative weight (2) and practical role (4), there's risk of reducing virtues to descriptive labels stripped of aspirational force. 

  For the resolution path: modifying commitment 5 (moral luck rejection) would alleviate the coin-finder tension while preserving the verdict. The cost? Weakening a core anti-consequentialist motivation. Alternatively, abandoning the coin-finder verdict would save commitment 5 but make the view less intuitive. The former seems preferable given the verdict's role as a "strain point."

  Not all apparent conflicts are real: The core (1)-(2) tension is genuinely mitigated by the situational-indexing move, though it makes virtue more fragmented than Aristotle might recognize. Commitment 3 and 7 can coexist if "cross-situational reliability" is reinterpreted as exceptional scaffolding skill plus consistent if-then signatures across known situation-types.

  Final recommendation: Prioritize resolving the moral luck contradiction via modest concession - perhaps allowing credit for luck-influenced actions when the disposition was already present, while keeping blame immune to luck. This salvages the coin-finder verdict while minimizing damage to commitment 5's spirit.
answer: |-
  Here's an audit of your commitments, ordered by severity of tension, with precise diagnoses and costs of revision. I confirm that the (1)-(2) tension is largely resolved by your reconstruction in (3), but deeper issues emerge elsewhere.

  ### **Critical Tensions (Requiring Revision)**
  1. **Tension: (5) vs. Coin-Finder Verdict**  
     - **Conflict:** (5) rejects circumstantial moral luck, yet crediting the coin-finder requires accepting luck in creditworthiness. His helpfulness was triggered by a morally irrelevant situational fluke (finding a coin). Your verdict grants credit *despite* the luck, violating (5)’s demand that credit not depend on uncontrolled factors.  
     - **What Must Give:** (5) (rejection of circumstantial moral luck for credit).  
     - **Cost of Revision:** Abandoning (5) weakens your anti-consequentialist motivation and opens the door to downgrading credit for lucky virtue (e.g., "They only helped because they found a coin").  
     - **Severity:** High — this directly undermines a core commitment to salvage an intuitive verdict.

  2. **Tension: (1) + (3) vs. (7)**  
     - **Conflict:** (1) and (3) reduce virtues to fine-grained, situation-specific dispositions (+ scaffolding), but (7) insists some people possess *cross-situational* reliability ("better people, not luckier"). If situational factors explain most behavioral variance (per (1)), and virtues are fragmented (per (3)), cross-situational reliability either doesn’t exist or is itself a product of luck (e.g., consistently benign situations).  
     - **What Must Give:** (7) (existence of non-lucky cross-situational virtue).  
     - **Cost of Revision:** Losing the ability to praise "saints" as categorically better people (they become beneficiaries of situational luck or exceptional scaffolders). Weakens the aspirational force of virtue in (4).  
     - **Severity:** High — (7) contradicts the moderate situationism in (1) and the fragmented virtue model in (3).

  3. **Tension: (3) vs. (4)**  
     - **Conflict:** (3) makes virtue a skill in *avoiding* challenges (scaffolding), but (4) requires virtue to underpin responsibility for *actions*. If a "reliable friend" avoids situations where returning a wallet is costly, they never demonstrate (or fail at) honesty in hard cases. Can we blame/praise someone for *not facing* tests of character?  
     - **What Must Give:** Either dilute (3) (scaffolding as supplementary, not core to virtue) or weaken (4)’s link to responsibility for actions (shift focus to responsibility for self-manipulation).  
     - **Cost of Revision:**  
       - If (3) gives: Scaffolding becomes a mere tool, not part of virtue. Weakens your solution to (1)-(2).  
       - If (4) gives: Responsibility practices focus on situation-management, not actions. May feel alien to our blame practices (e.g., "You should have avoided this party!").  
     - **Severity:** Moderate — threatens practical role of virtue.

  ---

  ### **Manageable Tensions (Resolvable with Clarification)**
  4. **Tension: (1) vs. (6)**  
     - **Apparent Conflict:** (1) discounts unreplicated social priming studies, but (6) demands deference to empirical psychology. Isn’t selectively citing older studies "reinterpreting away" inconvenient data?  
     - **Resolution:** No revision needed. (6) allows for methodological criticism; dismissing poorly replicated work is consistent with empirical accountability.  
     - **Key:** Justify your selectivity (e.g., "Robust, replicated effects constrain theory; failed replications do not").

  5. **Tension: (4) vs. Seminarian Verdict**  
     - **Apparent Conflict:** (4) blames for "quality of will," but you assign *less blame* to the hurried seminarian than to someone acting identically "in cold blood." If both display identical disregard (neither helped), why differential blame?  
     - **Resolution:** No revision needed. Quality of will can include *reasons for distraction*. The seminarian’s hurry (a competing moral commitment?) may mitigate condemnation of his will versus the purely callous agent.  
     - **Clarify:** "Quality of will" must account for *why* the agent failed to attend to the situation.

  ---

  ### **Benign Tensions (Surface-Level Only)**
  6. **Tension: (2) vs. (3)**  
     - **Apparent Conflict:** (2) endorses orthodox neo-Aristotelianism, but (3) fragments virtues into situation-specific dispositions, which seems revisionary.  
     - **Resolution:** This dissolves—your reconstruction in (3) *is* your orthodox response to (1). Aristotle’s virtues are context-sensitive (e.g., courage in battle vs. politics), so situational indexing is a natural extension, not a rejection.

  ---

  ### **Recommended Priority Revision**
  - **Revise (5): Allow circumstantial moral luck for credit (not blame).**  
    - **Why:** Resolves the coin-finder contradiction while preserving the verdict. Credit can sometimes depend on luck (e.g., being in a position to help), but blame does not (aligns with quality of will).  
    - **Cost:** Concedes ground to consequentialism on praise, but retains blame’s luck-free status. Sacrifices tidiness but keeps core anti-luck intuition for responsibility.  
    - **Flow-on Benefit:** Reduces pressure on (7); cross-situational "saints" can still exist, but their opportunities for credit may be luck-dependent.

  ### **Post-Revision Landscape**
  - **Retained Core:** (1)-(4), (6), and seminarian verdict remain intact.  
  - **Modified:** (5) now distinguishes credit/blame re: luck; (7) may need softening (saints as exceptional scaffolders, not globally robust).  
  - **Losses:** A unified anti-luck principle (5), but you gain consistency with your verdicts and empirical commitments.

  This package is admirably coherent, but the moral luck tension (5 vs. coin-finder) is the fault line. Sacrificing (5)’s universality for creditworthiness is the minimal revision that maximally stabilizes your view.
