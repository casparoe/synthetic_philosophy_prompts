  **Least Confident Judgment**: The -1 deduction in (b)(ii) for the claim that probability differences *must* imply truth-conditional differences. If the professor holds that probabilistic disparities in this context *are* sufficient evidence for semantic ambiguity (e.g., due to the fixed causal setup), I would restore 0.5–1 mark. **Confidence: Medium** (turns on disputable semantics/pragmatics boundaries).  

