prompt: |-
  I chair the Patient Safety Review Board at a teaching hospital, and I also teach one section of a bioethics course for residents each term, so I would like something I can use in both roles. The board meets fortnightly for ninety minutes, reviews four to six incidents per sitting, and works only from the incident record — we have no power to investigate, interview, or order tests, and whatever we write goes into a file that the credentialing committee and, in principle, a plaintiff's lawyer may read. For each clinician involved in an incident we must record two things: a retrospective responsibility rating on a four-point scale (no fault, minor lapse, serious lapse, gross lapse) and, separately, a forward-looking recommendation (no action, additional training, restriction of privileges). Our five members are two physicians, a nurse, a risk manager and a lay member; none of them has studied philosophy, and I need something they can run in about fifteen minutes per case without me translating it. The immediate trigger is that last month we rated two anaesthetists differently for what the record describes as the same departure from the monitoring protocol; the only difference is that one patient turned out to have an undiagnosed condition and died, while the other was extubated without incident. The risk manager argued that the outcome is exactly what we are here to account for; the lay member said it obviously should not count; and we split three ways, which is worse than being wrong.

  I have read a little of the philosophical literature on moral luck — Nagel, Williams, the control principle — and my difficulty is that it is very good at telling me why the ordinary way of assigning blame is in trouble and very poor at telling me what to do on Tuesday afternoon. So I want you to turn that literature into a written decision procedure the board could actually adopt. Please make the following non-negotiable: the two outputs must be kept apart, and the procedure must state explicitly which varieties of luck are permitted to move which output and which are barred — luck in how the outcome turned out, luck in the circumstances the agent was placed in (understaffing, a night shift, a broken monitor), luck in the traits and temperament the agent happens to have, and luck in what the agent could reasonably have foreseen or known at the time. I want at least one step to be a blinded re-run: re-present the case to the board with the outcome and the patient's subsequent course redacted, re-rate, and treat any change in the rating as the signature of outcome luck rather than as new information about the agent. I also want the counterfactual comparison class — the same decision, made by a competent peer, in these circumstances, with what was knowable then — fixed by a standing rule agreed in advance, not redrawn case by case, since I can already see members adjusting the comparison class until it yields the answer they want. For each step give me the question to ask, what counts as a sufficient answer given that we cannot investigate, where the procedure stops with a no, and where it must hand the decision to a named person because the question is one of values rather than fact.

  Then apply the whole procedure to three cases, showing the ratings and recommendations it produces: the two anaesthetists; a senior surgeon with a decade of unblemished work who is now found to have a mild tremor from early Parkinson's disease and whose technique has visibly deteriorated; and a resident who skipped a checklist item and had an uncomplicated outcome, next to a colleague who skipped the same item in the same week and caused a serious harm. I especially want you to follow the procedure through in the third case even where it yields a result the credentialing committee will refuse to accept, and to say plainly that it will. Close with a short section on what the procedure cannot do: the cases where the record simply cannot settle what the agent knew or believed, the points at which I have to make a judgment call that no checklist can eliminate, and the kinds of incident for which this framework is the wrong tool altogether. Please write it as numbered steps followed by the applications followed by that closing section, in at most 1,000 words total, with no more than 450 words on the procedure itself and no more than 150 on the closing section. Do not give me citations, bibliographies, or suggested reading: I have no library access and cannot follow them up, so if a step depends on a distinction drawn by a particular philosopher, name it in a phrase and use it in the wording of the step rather than pointing me to a source.
reasoning: |-
  Okay, the user chairs a Patient Safety Review Board and teaches bioethics. They need a practical decision procedure for assigning responsibility ratings and recommendations that addresses moral luck, especially after inconsistent ratings for similar anesthesia incidents with different outcomes. 

  Key constraints: Must separate retrospective responsibility (4-point scale) from forward-looking recommendations. Must explicitly handle different luck types (outcome, circumstantial, constitutive, epistemic). Requires a blinded re-run step. Comparison classes must be fixed in advance. Outputs must be court-admissible. Board members lack philosophy background - needs simple, actionable steps under 15 minutes/case.

  Hmm... the core tension is between the risk manager's outcome-focused view and the lay member's intent-focused perspective. Philosophical concepts like Nagel's moral luck and Williams' agent-regret are relevant but need operationalization. The blinded re-run is clever - it directly isolates outcome luck by comparing original vs redacted ratings.

  For the procedure structure: I'll build it around three core questions per case. First: "What did the agent know/believe?" (epistemic luck). Second: "Was the act a lapse given circumstances?" (circumstantial luck). Third (post-blinding): "Does outcome change the rating?" (outcome luck). Constitutive luck is handled indirectly through the "competent peer" standard.

  Important nuance: The comparison class ("competent peer in same circumstances with same knowable facts") must be rigidly predefined to prevent goalpost-moving. The tremor case will test this - deterioration makes the surgeon no longer meet the peer standard.

  Anticipating friction: In the resident case, identical actions must get identical ratings despite different outcomes. Credentialing will likely reject "no action" for the harmful incident, but consistency demands it. Need to explicitly flag this conflict.

  Limitations section should warn about: (1) Unresolvable knowledge gaps in records (2) Inherent judgment calls in "reasonable peer" assessment (3) Unsuitability for systemic failures or criminal acts.

  Word count tight - procedure under 450 words, applications concise, limitations under 150. No citations per request, but will embed concepts like "control principle" in step wording.
answer: |-
  ## Patient Safety Decision Procedure: Addressing Moral Luck

  **Adopted Protocol for Responsibility Assessment**  
  *(Execute sequentially; stop if definitive answer reached)*

  1.  **Epistemic Luck Assessment (Nagel's "Circumstantial"):**  
      *Question:* "Based *only* on the incident record, what *could* a competent peer in this clinician's role, working in these *exact* circumstances (staffing, equipment status, time), *reasonably have known or foreseen* at the moment of the act/omission?"  
      *Sufficient Answer:* Consensus on the knowable facts and foreseeable risks *at the time*. List these explicitly in the record.  
      *Stop if:* The act was unavoidable or mandated by the knowable facts/circumstances (e.g., protocol demanded action X given known Y). → **Retrospective: No Fault.** Proceed to Recommendation.  
      *Handoff if:* Irreconcilable disagreement on knowable facts → Board Chair casts deciding vote.

  2.  **Circumstantial/Constitutive Luck Assessment (Williams' "Agent-Regret" Context):**  
      *Question:* "Would a hypothetical *competent peer* (defined by standard hospital privileging criteria), possessing baseline reasonable temperament/traits for their role, facing *these specific knowable circumstances* identified in Step 1, *still* have made the same decision/omission?"  
      *Sufficient Answer:* Yes/No consensus based on the fixed "competent peer" standard. Do *not* redefine the peer standard case-by-case.  
      *Stop if:* Yes → **Retrospective: No Fault.** Proceed to Recommendation.  
      *Stop if:* No → Proceed to Step 3.  
      *Handoff if:* Irreconcilable disagreement on "competent peer" action → Board Chair casts deciding vote.

  3.  **Blinded Re-Run & Outcome Luck Isolation:**  
      *Action:* Re-present the case details (clinician actions, known circumstances, protocol requirements) to the board *with all patient outcomes, diagnoses, and subsequent courses REDACTED*. Re-rate Retrospective Responsibility *only* based on Steps 1 & 2 using the redacted info.  
      *Question:* "Does the Retrospective Responsibility rating change from the original (unblinded) rating *after* this re-run?"  
      *Sufficient Answer:* Compare the two ratings.  
      *Rule:* Any change *is* the signature of Outcome Luck influencing the original rating. The *blinded* rating is the official **Retrospective Responsibility** rating (No Fault, Minor Lapse, Serious Lapse, Gross Lapse - based on severity/departure from peer standard).  
      *Always Proceed:* Outcome Luck is explicitly *barred* from Retrospective rating. Proceed to Recommendation.

  4.  **Forward-Looking Recommendation:**  
      *Question:* "Based *only* on the *Retrospective Responsibility rating* (Steps 1-3) and the *actual outcome* (including harm, near miss, or luck), what action is most likely to *prevent recurrence* by this clinician or others, considering system factors?"  
      *Permitted Influence:* *Outcome Luck* is explicitly *permitted* here. Severity of outcome informs risk and training urgency. *Constitutive Luck* (e.g., developing tremor) informs fitness. *Circumstantial Luck* (e.g., broken monitor) informs system fixes.  
      *Output:* **Recommendation** (No Action, Additional Training, Restriction of Privileges). This may differ significantly from the Retrospective rating.

  ---

  **Application to Cases**

  1.  **The Two Anaesthetists (Identical Protocol Departure):**
      *   *Step 1/2 (Blinded):* Both cases: Competent peer *would not* skip protocol monitoring. Knowable facts didn't justify omission. → **Retrospective: Identical rating** (e.g., Serious Lapse) for both *based on blinded assessment*.
      *   *Step 3:* Original unblinded rating likely differed due to death vs. no harm. Blinded rating is official. **Retrospective: Serious Lapse (Both)**.
      *   *Step 4:* **Recommendation:** Anaesthetist 1 (death): Likely "Additional Training" (mandatory protocol refresher + simulation) due to severe outcome highlighting risk. Anaesthetist 2 (no harm): "No Action" or "Verbal Counseling" (outcome shows lapse but no harm, lower perceived risk). Outcome luck drives the difference *here*.

  2.  **Surgeon with Undiagnosed Tremor:**
      *   *Step 1:* Could the surgeon *reasonably* have known about the tremor impacting technique *before the incident*? Record likely shows no prior complaints/documented issues. → *Probably* No.
      *   *Step 2:* Would a "competent peer" surgeon *without* the tremor have performed the visibly deteriorated technique? → No. The act itself (deteriorated technique) *was* a lapse *relative to the peer standard*. **Retrospective: Minor or Serious Lapse** (depending on severity of deterioration).
      *   *Step 3:* Blinding irrelevant (outcome doesn't change the act's nature).
      *   *Step 4:* **Recommendation:** "Restriction of Privileges" (pending neurological evaluation & retraining) due to *constitutive luck* (trait/temperament change) impacting future fitness, regardless of retrospective rating.

  3.  **Residents Skipping Checklist:**
      *   *Step 1/2 (Blinded):* Both cases: Competent peer *would not* skip required checklist item. Knowable facts didn't justify omission. → **Retrospective: Identical rating** (e.g., Minor Lapse) for both *based on blinded assessment*.
      *   *Step 3:* Original unblinded rating likely differed due to harm vs. no harm. Blinded rating is official. **Retrospective: Minor Lapse (Both)**.
      *   *Step 4:* **Recommendation:** Resident 1 (no harm): "No Action" or "Verbal Counseling". Resident 2 (serious harm): "Additional Training" (targeted checklist adherence). *Credentialing Committee Likely Refusal:* They may demand harsher sanction (e.g., probation, extended training) for Resident 2 due to outcome, despite the procedure's identical retrospective rating. This highlights tension between retrospective fairness and institutional risk tolerance.

  ---

  **Limitations of the Procedure**

  1.  **Unresolvable Epistemic Gaps:** The procedure fails if the record cannot establish what the agent knew/believed (Step 1) and no consensus/vote is possible. Judgment calls remain here.
  2.  **"Competent Peer" Judgment:** Defining the peer's expected action (Step 2) involves inherent, non-eliminable judgment about standards, despite the fixed definition. Bias can creep in.
  3.  **Systemic vs. Individual:** This framework focuses on individual clinician actions. It is the *wrong tool* for incidents primarily caused by system failures (e.g., chronic understaffing, faulty equipment supply chain) where individual lapse ratings are inappropriate or misleading. A separate system analysis is needed.
  4.  **Criminal Negligence/Intent:** The procedure assumes standard lapses, not criminal intent or recklessness. Such cases likely fall outside its scope and require legal/HR processes.
  5.  **Recommendation Acceptance:** As seen in the Resident case, the separation of retrospective rating from recommendation driven by outcome luck may produce recommendations (like "No Action" after harm) that institutional bodies reject for non-safety reasons (liability, public perception). The procedure identifies the luck but cannot force acceptance.
