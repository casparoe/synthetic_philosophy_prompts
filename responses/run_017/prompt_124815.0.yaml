  The real anomaly for GWT is the evidence of dual simultaneous cognition streams. When RH solves a spatial problem while LH chats obliviously, it suggests two parallel global workspaces - which violates GWT's single-stage bottleneck assumption. Maybe Baars' "society of minds" extension applies here, but the user wants core theory tested.
answer: |-
  Here's a disciplined mapping of split-brain phenomena onto Global Workspace Theory (GWT), its limitations, and complications, followed by an evaluation:

  **GWT Mapping:**
  - **Workspace:** Cortical networks in each hemisphere capable of integrating information. The corpus callosum is the critical cross-hemispheric *communication channel*, not the workspace itself.
  - **Ignition/Broadcast:** Successful ignition occurs *within* a hemisphere when stimuli reach threshold (e.g., right visual field → left hemisphere ignition). Broadcast is *hemisphere-restricted* due to callosal disconnection. Stimuli in the left visual field ignite/broadcast within the right hemisphere but cannot cross to the left.
  - **Consumer Systems:**  
    - *Evidence for Global Availability:* Accurate verbal report (LH consumers), accurate left-hand pointing (RH motor/visuospatial consumers), cross-hemispheric integration tasks (absent in patients).  
    - *Evidence Against Global Availability:* Anomia for left-field objects (LH language consumers lack access), inability to point with right hand to left-field objects (RH consumers not accessed by LH), inter-manual conflict.  
  - **One vs. Two Workspaces:** GWT predicts **two distinct workspaces** when disconnection is severe. Evidence:  
    - Mutual ignorance: LH cannot report RH content, RH cannot verbally defend its actions.  
    - Independent ignition: Simultaneous conflicting tasks (e.g., LH names "ring", RH draws "key") succeed without cross-talk.  
    - *Residual Cross-Talk:* With partial disconnection, some broadcast "leaks" across. GWT predicts graded integration failures—more errors with weaker stimuli, partial awareness, or inconsistent responses. A single workspace *fails* to explain independence.
  - **Right Hemisphere Consciousness:** GWT **cannot declare it unconscious**. The RH integrates information, drives purposeful action (pointing, drawing), and sustains attention—hallmarks of workspace ignition. GWT's access-based definition implies RH is conscious *of its content* when ignited, but inaccessible to the LH.

  **Handling Complications:**

  1.  **The Report Problem:**  
      - Availability ≠ Verbal Report. RH content *is* available to *its* consumers: visuospatial processing, left-hand motor control, emotional responses (e.g., laughing at RH-shown images).  
      - This case shows **access without global reportability**, not phenomenal consciousness without access. GWT is structurally blind to RH phenomenality—it only "sees" access. The case *suggests* phenomenality (complex RH behavior), but GWT lacks the tools to confirm it. It demonstrates that access consciousness can be fragmented.

  2.  **The Unity Postulate:**  
      - The single workspace is an empirical claim about neurotypical brains. Split-brains falsify it as a universal necessity.  
      - Your principle (**a workspace = largest set of mutually accessible consumer systems**) works:  
        - Pre-surgery: One set (all consumers interconnected).  
        - Post-surgery: Two sets (LH consumers + RH consumers, no mutual access).  
      - *Boundary Issue:* GWT must accept this principle or retreat to stipulation. It implies consciousness is countable by integrated access sets. Severely split brains *are* two subjects of access consciousness under GWT. Residual cross-talk creates partial unity—a matter of degree GWT *must* tolerate to fit the data.

  3.  **Confabulation:**  
      - LH confabulation arises when:  
        1. RH-initiated action (e.g., left hand points) is *perceived* by LH as its own output.  
        2. LH workspace, lacking the true cause, generates a plausible narrative via its *interpretive consumer systems* (self-model, language, inference).  
      - This shows broadcast is **constructive**: The workspace broadcasts the *interpreted event* ("I chose to point at the shovel"), not the unconscious motor command. It doesn't embarrass GWT; it demonstrates that consciousness involves post-ignition interpretation by consumers. The workspace broadcasts hypotheses, not raw causes.

  **Reverse Direction: Evaluation of GWT**
  - **Confirmation:** Strongly confirms GWT's core: Consciousness requires widespread access, severed callosum prevents access/broadcast, independent ignition explains hemispheric specialization.
  - **Anomaly:** Exposes boundaries:  
    - GWT cannot address *phenomenal* consciousness in the RH—only access.  
    - It struggles with *counting subjects*: If consciousness is defined by integrated access, two workspaces imply two conscious agents, challenging intuitive unity.  
    - Presence in *a* workspace appears **sufficient for access consciousness** in that workspace. Necessity is upheld (unaccessed = unconscious).
  - **The Access/Phenomenal Distinction:** This case forces the distinction. GWT explains *why* RH states aren't reportable (no access to LH), but cannot say if they "feel like" anything. The distinction does explanatory work (why we infer RH consciousness behaviorally) but relabels the hard problem for the RH.
  - **Silences:** GWT is silent on:  
    - Why ignition feels like anything (the hard problem).  
    - Whether RH has phenomenal states independent of access (it assumes they co-occur).  
    - The ontological status of a "subject" when workspaces split.

  **Alternative Framework: Recurrent Processing Theory (RPT)**
  - *Mapping:* Consciousness arises from recurrent loops in sensory cortex, even without global access.  
  - *Complications:*  
    1. **Report:** RH recurrent processing explains phenomenal consciousness without access. Better handles RH's unreportable qualia.  
    2. **Unity:** Predicts phenomenal unity *within* hemispheres but not necessarily globally. Fits split subjectivity.  
    3. **Confabulation:** LH confabulation is a post-perceptual cognitive error; RH perception is veridical but isolated. Separates perception from interpretation cleanly.  
  - *Advantage:* Explains RH visual consciousness without requiring global broadcast.  
  - *Disadvantage:* Less explanatory for high-level cognition (e.g., RH problem-solving) and confabulation's narrative construction.

  **Conclusion:** Split-brain studies validate GWT's access-based framework but expose its inability to address phenomenality, forced multiplicity of consciousness under disconnection, and constructive nature of broadcast. RPT better handles unreportable phenomenology but underplays executive integration. GWT's boundaries are stark: it is a theory of *cognitive access*, not subjective experience, and its unity assumption fails empirically in split brains.
