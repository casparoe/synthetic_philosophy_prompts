  The confabulation point cuts deep. GWT typically assumes broadcast is veridical, but here the narrative system fabricates causes post-hoc. This suggests consciousness isn't reading the motor commands but interpreting their consequences - aligns with Wegner's illusion of will. Maybe GWT needs a "self-model" consumer that can generate false meta-representations.

  On phenomenal consciousness: the case is structurally blind to it because all RH evidence is indirect. But if we accept that prolonged, integrated representation (like RH's hour-long suppression of laughter) indicates phenomenality, GWT has no tools to deny it - which exposes its functionalist blind spot.

