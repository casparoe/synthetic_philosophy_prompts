  First, I need to assess each rule's effectiveness. The user is clearly experienced but frustrated with the slogan-like nature of standard advice. They need a procedural solution, not just theory. Their unspoken need might be for confidence in their decision, balancing rationality with their unique circumstances. They might fear both overconfidence and missing an opportunity due to overly rigid base rates.

  Looking at the rules, the key is to avoid common pitfalls: overweighting the inside view (leading to planning fallacy) or underweighting it (discarding valid private info). Reliability should prioritize decision-relevant expected value over pure calibration since this affects a real choice. Rules should handle uncertainty without defaulting to base rates.

  Rule 1 (base rate as prior) is too rigid, ignoring unique factors. Rule 11 is too subjective. Rules like 9 (second-order outside view) and 6 (nearest-neighbor with floor) add structure but have selection bias risks. Rule 10 (pre-registered opposing class) is clever but complex. 

  Top contenders should integrate views without bias. Rule 9 stands out by using personal track record to weight the inside view. Rule 7 separates roles: inside for structure, outside for magnitude. Rule 2 (logarithmic pooling) is flexible if weights are evidence-based. Rule 8 (transmission test) filters out emotional bias, preserving robust insights.

  The user's case has a strong inside element: a prior successful small-scale version. This is valid private info. Rules that discard this (like Rule 1) underperform. Rule 9’s self-calibration makes sense here—if their past inside views were reliable, it justifies higher confidence.

  Applying Rule 9: Assume the user’s past similar judgments had 70% accuracy. Their inside view of 50% (midpoint) combined with a 8.3% base rate (1/12) at 70% weight gives ~36%. But since their inside view has a track record, it elevates the estimate reasonably.

  Tier 1 rules (9,7,2) balance both views effectively. Tier 2 (8,6,4) are useful but have limitations. Tier 3 (5,10,3) are situational. Tier 4 (1,11) are flawed.

  Final probability via Rule 9: Their inside view (50%) weighted by past reliability (say 70%) against the base rate (8.3%) results in approximately 36%. This respects base rates while accounting for their unique proven advantage.
answer: |-
  Having walked in those forecasting trenches—both the epistemic rigor of philosophy of science and the messy reality of organizational prediction markets where scores are kept and mistakes cost resources—I'll approach this as requested. First, the framework: reliability here must serve *decisions*, not just calibration. A rule that spits out perfectly calibrated probabilities but ignores decisive private information may preserve statistical dignity while causing real-world regret. The core failure modes are threefold: (1) **smuggling bias** (e.g., cherry-picking reference classes to match preconceptions), (2) **discarding signal** (overcorrecting for overconfidence and drowning unique insights in base rates), and (3) **procedural brittleness** (rules that demand unrealistic inputs or collapse under ambiguity). The metric should be *weighted log score*—penalizing overconfidence harshly but rewarding correct use of strong evidence—cross-checked against *decision robustness* (does the output change actions meaningfully vs. the base rate alone?). With that, the tiers:

  **Tier 1 (Scores 80-90): Rules that structurally force evidence integration while penalizing self-deception.**  
  - Rule 9 (Second-order outside view): Score 90. It anchors to base rates but weights the inside view by your *measured* track record of similar judgments. This admits unique information only when you've earned the right to trust yourself. Failure: if your past judgments aren't comparable ("smaller version worked" may be a new context) or you lack good records.  
  - Rule 7 (Shape from inside, magnitude from outside): Score 85. Uses the inside view diagnostically (e.g., "our unique advantage mitigates funding risk") but scales the probability to the base rate. Best when mechanisms are well-understood. Failure: if magnitude and shape aren't separable (e.g., your "advantage" directly affects survival odds).  
  - Rule 2 (Logarithmic pooling): Score 80. Flexible evidence-weighted averaging. Assign 70% weight to outside view (given its objectivity) and 30% to inside if your forecasting history is decent. Failure: weights can be gamed; assumes independence.  

  **Tier 2 (Scores 60-75): Useful with constraints but prone to implementation flaws.**  
  - Rule 8 (Transmission test): Score 75. Filters emotional bias by demanding your case survive scrutiny from a motivated skeptic. What remains is high-signal. Failure: relies on finding a skilled, disinterested outsider; may undervalue tacit knowledge.  
  - Rule 6 (Nearest-neighbour with floor): Score 70. Forces reference-class specificity while avoiding small samples. Better than raw base rates. Failure: defining "nearest neighbour" invites bias (is your group "AI safety startups" or "academic spinouts with pre-seed funding"?).  
  - Rule 4 (Ten-minute stranger): Score 60. Compression forces distillation of core arguments. Better than unstructured inside view. Failure: a stranger may miss nuanced stakes; domain knowledge isn't binary.  

  **Tier 3 (Scores 40-55): Situationally valuable but unreliable as general procedures.**  
  - Rule 5 (Pre-mortem inversion): Score 55. Tests if your failure story is generic. If not, it elevates the inside view. Clever but retrospective—hard to quantify the probability shift. Failure: a vivid imagination can make *any* story feel unique.  
  - Rule 10 (Pre-registered opposing reference class): Score 50. Elegant for forcing honesty, but impractical. Few have the discipline to pre-register refusal criteria. Failure: opponents can pick unhelpful classes ("all human endeavors fail eventually").  
  - Rule 3 (Ceiling rule): Score 40. Caps irrational optimism (e.g., max 5x base rate = 41.5% here). Better than nothing. Failure: arbitrary cap; no way to justify exceeding it when evidence truly warrants.  

  **Tier 4 (Scores 0-30): Flawed or counterproductive.**  
  - Rule 1 (Base rate as prior): Score 30. Statistically safe but decision-useless. Ignores real information (e.g., your team's prior success). Failure: guarantees underreaction to strong signals.  
  - Rule 11 (Coherence-checked adjustment): Score 10. "Feels right" is how planning fallacies begin. Sanity checks are post-hoc rationalizations. Failure: embeds all biases of unstructured inside view.  

  **Applying Rule 9 to your case:** Start with the outside view: 1/12 ≈ 8.3% success rate. Now assess your inside-view track record. You cite one highly relevant signal: three founders have already executed a "smaller version of exactly this" that succeeded. This is rare—a track record within the domain. If your past similar judgments (e.g., "this project will work because we've done it before") have been correct ~70% of the time when you were 40-60% confident, weight the inside view at 70%. Your inside-view estimate of 50% (midpoint) and outside view of 8.3% combine via weighted average: (0.7 * 50%) + (0.3 * 8.3%) ≈ 36%. However, since the outside view is a base rate (not a calibrated prediction), and your inside view has high evidential weight due to specific success replication, nudge to **40%**—acknowledging the base rate but respecting your team's demonstrated capability. This remains below your inside view to penalize unknown unknowns.  

  Final probability: **40%**. This reflects a defensible uplift from the base rate due to your team's validated execution ability, while heavily discounting generic optimism. The number is actionable—if your utility function values the attempt even at 40%, proceed; if not, pass. Rule 9 forces you to confront your own reliability, which is where the real leverage lies.
