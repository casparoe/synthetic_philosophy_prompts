  ### Decision Tree for Tool vs. Agent Classification  
  **Goal**: Classify systems by technical design (not marketing terms) to assign governance. Answers must come from a design doc.  
  **Key**: Internal nodes are concrete questions; leaves define governance. "Unnamed" where no clean label exists.  

  #### Tree Structure  
  1. **Does the system cause irreversible side effects?** (e.g., sends emails, spends money, deletes data, alters prod)  
     - *No* → 2  
     - *Yes* → 3  

  2. **Does it run without human initiation per task?** (e.g., persistent background job)  
     - *No* → **Leaf 1: Pure Instrument**  
     - *Yes* → **Leaf 2: Fire-and-Forget Job (Safe)**  

  3. **Is every irreversible action gated on human approval?** (e.g., human clicks "approve" per refund)  
     - *Yes* → **Leaf 3: Side-Effecting Tool (Gated)**  
     - *No* → 4  

  4. **Does it pursue a goal beyond a single invocation?** (e.g., state persists across runs)  
     - *No* → 5  
     - *Yes* → 6  

  5. **Does it decide *how* to achieve goals beyond fixed rules?** (e.g., uses ML/LLM to choose methods)  
     - *No* → **Leaf 4: Rule-Based Effector**  
     - *Yes* → **Leaf 5: One-Shot Agent**  

  6. **Can it self-expand permissions?** (e.g., install packages, spawn sub-agents, create accounts)  
     - *Yes* → **Leaf 6: Recursive-Authority Agent**  
     - *No* → 7  

  7. **Is it designed for human-in-loop checkpoints?** (e.g., pauses for review mid-task)  
     - *Yes* → **Leaf 7: Supervised Agent**  
     - *No* → 8  

  8. **Is it confined to a pre-allocated resource budget?** (e.g., fixed $ spend, API call limits, scope constraints)  
     - *Yes* → **Leaf 8: Bounded Autonomous Agent**  
     - *No* → **Leaf 9: Wide-Authority Agent**  

  ---

  #### Leaves  
  1. **Pure Instrument** (e.g., linter that suggests edits)  
     - *Awkward commitment*: Cannot act, only advise.  
     - *Engineering consequence*: Minimal review; focus on correctness, no kill switch/audit log.  

  2. **Fire-and-Forget Job (Safe)** (e.g., unattended research job with no side effects)  
     - *Awkward commitment*: Runs unsupervised but harmless.  
     - *Engineering consequence*: Resource/time limits; monitor for hangs, no irreversible controls.  

  3. **Side-Effecting Tool (Gated)** (e.g., CI bot that proposes PRs but can’t merge)  
     - *Awkward commitment*: Humans bottleneck every action.  
     - *Engineering consequence*: Approval UX audit; log all actions; no kill switch needed.  

  4. **Rule-Based Effector** (e.g., auto-refund system under $10 with fixed rules)  
     - *Awkward commitment*: Rigid rules may miss edge cases.  
     - *Engineering consequence*: Rule-testing mandate; audit log; kill switch to disable.  

  5. **One-Shot Agent** (e.g., coding assistant writing PRs in one run)  
     - *Awkward commitment*: Autonomous decisions in bounded time.  
     - *Engineering consequence*: Sandbox testing; kill switch; audit log; output review.  

  6. **Recursive-Authority Agent** (e.g., dev tool that creates cloud resources)  
     - *Awkward commitment*: May escalate privileges uncontrollably.  
     - *Engineering consequence*: Strict confinement; multi-layer kill switch; full audit trail.  

  7. **Supervised Agent** (e.g., incident bot restarting services with human checkpoints)  
     - *Awkward commitment*: Supervision assumes human availability.  
     - *Engineering consequence*: Checkpoint reviews; audit log; kill switch; liability owner.  

  8. **Bounded Autonomous Agent** (e.g., scheduling assistant with fixed email quota)  
     - *Awkward commitment*: Budget may be too tight/loose.  
     - *Engineering consequence*: Real-time budget monitoring; kill switch on breach.  

  9. **Wide-Authority Agent** (e.g., uncapped coding agent with corrigibility claims)  
     - *Awkward commitment*: Safety reliant on untested interruptibility.  
     - *Engineering consequence*: Pen-testing; redundant kill mechanisms; named liability owner.  

  10. **Deflationary Case** (Tool/agent distinction collapses)  
      - *Reached via*: Any path where capability/authority dominate (e.g., a highly constrained "agent" identical to a tool).  
      - *Awkward commitment*: Semantic debates obscure risk.  
      - *Engineering consequence*: Govern purely by side-effect magnitude and authority scope.  

  ---

  ### Analysis  
  **Unoccupied Combinations & Diagnoses**:  
  - **Batch job with irreversible effects but no persistence** (e.g., one-off refund without rules/discretion):  
    - *Unoccupied*: Incoherent. Irreversible actions require either rules (to avoid discretion) or goal-persistence (to justify autonomy).  
  - **System with permission expansion but no irreversible effects** (e.g., self-installing packages for read-only tasks):  
    - *Unoccupied*: Unattractive. Permission expansion is only valuable if it enables new capabilities, implying irreversibility.  
  - **Supervised agent with recursive authority** (e.g., human-in-loop bot that spawns sub-agents):  
    - *Unoccupied*: Unexplored. Recursive authority undermines supervision; few use cases justify this risk.  

  **Inseparable Leaves**:  
  - **Rule-Based Effector vs. One-Shot Agent**: Blurs if "discretion" is partial (e.g., LLM choosing from fixed options). Diagnose by testing: if outputs vary unpredictably, treat as One-Shot Agent.  
  - **Bounded Autonomous Agent vs. Wide-Authority Agent**: Blurs if budget is soft (e.g., "reasonable use" clauses). Default to Wide-Authority.  

  **Most Important Cut**: **Irreversible side effects** (Node 1).  
  - Does 90% of the work: Systems without it are always tools/jobs; systems with it trigger agent-like governance.  

  **Tool/Agent Distinction**: **Two conflated axes**:  
  1. **Autonomy** (goal persistence + discretion over means).  
  2. **Authority** (irreversible effects + permission expansion).  
  - Marketing conflates these (e.g., calls loops "agents"); security conflates them (e.g., calls credential-holders "agents"). The tree separates them.  
  - *Not a spectrum*: A "tool" can have high authority (e.g., gated refund system), and an "agent" can have low autonomy (e.g., supervised bot).  

  ---

  ### Why This Works  
  - **Answers design doc questions**: Nodes like "self-expand permissions?" are concrete (e.g., "Does design allow spawning sub-agents? Yes/No").  
  - **Covers your cases**:  
    - Linter → Pure Instrument.  
    - CI bot → Side-Effecting Tool (Gated).  
    - Unattended research job → Fire-and-Forget Job (Safe).  
    - Refund system → Rule-Based Effector.  
    - Incident bot → Supervised Agent.  
    - Coding agent → Recursive-Authority Agent.  
    - Scheduling assistant → Bounded Autonomous Agent.  
    - Delegation system → Recursive-Authority Agent.  
  - **Governance clarity**: E.g., "kill switch" only non-negotiable for leaves 4–9.  
  - **No philosophy terms**: All nodes are implementation details.
