  ### Sestina: The Ledger-Keepers

  In the city's first light, they planned a kingship,  
  then etched the date for its decay to tyranny.  
  The nobles, primed, rehearsed aristocracy,  
  then scheduled greed to birth oligarchy.  
  The people's turn: a staged democracy  
  collapsed on cue to scripted ochlocracy.  

  The mob's raw ochlocracy, as planned, now spent,  
  they placed the crown upon a new kingship.  
  The crowd, well-drilled, played brief democracy,  
  then bowed to laws that mandated tyranny.  
  The ledger called for formal oligarchy,  
  but first the nobles claimed aristocracy.  

  That fresh aristocracy, though just at dawn,  
  knew by the book they’d fuel ochlocracy.  
  They hoarded gold to forge tight oligarchy,  
  then draped themselves in robes of old kingship.  
  The people, squeezed, decried their tyranny—  
  yet cast their votes in staged democracy.  

  This strained democracy, though free in name,  
  grew thin and frayed like lost aristocracy.  
  The demagogues screamed "State!" in new tyranny,  
  inciting streets to blaze with ochlocracy.  
  They spared the crown for coming kingship  
  while mobs proclaimed a raucous oligarchy.  

  That street oligarchy, drunk on power’s surge,  
  mocked the dead dream of true democracy.  
  It smashed the throne reserved for kingship  
  and lynched the last of learned aristocracy.  
  Chaos, they swore, was true ochlocracy—  
  then crowned a thug to end their tyranny.  

  The thug’s harsh tyranny, though meant to stay,  
  soon bled the coffers dry through oligarchy.  
  His henchmen cheered the ghost democracy  
  while scholars mourned dead aristocracy.  
  The mob, now starved, revived ochlocracy  
  and hailed a savior with the name kingship.  

  The ledger closed. We staged each fall and rise:  
  democracy to cold oligarchy,  
