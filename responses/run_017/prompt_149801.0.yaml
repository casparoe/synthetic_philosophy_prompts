prompt: |-
  I host a small podcast on decision theory and my guest next week is someone who defends superrationality — the Hofstadter line that in a one-shot Prisoner's Dilemma between two copies of yourself you should reason as if your move and theirs are the same event, so you pick the option that's best if everyone picks it. I don't want questions where she just re-explains the view and reruns the Platonia story; give me 6-8 questions, each with a follow-up keyed to the answer she's most likely to give. I want at least one that presses on whether this is anything more than evidential decision theory once you cash out what 'same algorithm' has to mean, one on near-copies (agents 99% algorithmically similar, not identical — does the reasoning degrade smoothly or cliff-edge, and why should similarity do that work?), and one built around a case I keep chewing on: the staggered run. Two instantiations of the same algorithm, but copy A is launched, its output sealed, and the seal is physically irreversible an hour before copy B is launched, and B knows all of this. If superrational cooperation survives that, what exactly is it tracking — and if it doesn't, how much of the view was just bookkeeping about causal loops? Add one question on the obvious jab that this is the categorical imperative with payoff matrices bolted on, and end with something that makes 'no serious view survives its own counterexamples' style deflection hard, asking what result or observation would actually make her give it up.
reasoning: |-
  Okay, let me tackle this podcast host's request. They want challenging questions for a superrationality defender, avoiding surface-level rehashes. The core challenge is crafting questions that probe weaknesses while anticipating defenses.

  First, the "algorithmic identity" question needs to expose whether superrationality collapses into evidential decision theory. I recall Hofstadter's Platonia Dilemma relies on identical reasoning processes creating correlated outcomes. But if we define "same algorithm" strictly (same code, same inputs), that might just be EDT with extra steps. The follow-up should corner them on whether correlation comes from logical necessity or is just assumed.

  For the near-copies issue, I'm imagining agents with 99% code similarity. If cooperation degrades smoothly with similarity, that feels arbitrary - why should 1% difference break the magic? But if it's all-or-nothing, that seems unrealistic. The follow-up needs to challenge why algorithmic similarity should create the required correlation at all. 

  The staggered run case is deliciously tricky. When algorithm A outputs before B even runs, how can B's choice correlate with A's? If superrationality still demands cooperation here, it's clearly not about causation. But if it fails, the whole view might just be exploiting causal loops. The follow-up should press whether time-separation breaks the "same event" illusion.

  For the Kant comparison, we need to highlight that categorical imperative is about universalizability, while superrationality uses game payoffs. The follow-up should force them to admit whether payoffs drive the cooperation or if it's pure principle.

  Finally, the falsifiability question can't let them dodge with "no view is perfect". We need concrete failure conditions - like if experiments show cooperation only in identical setups, or if the math contradicts itself. The follow-up demands what specific result would make them abandon ship.

  Throughout, I'll weave in references to Hofstadter's original work while pushing beyond it. The questions should create tension between elegant theory and messy reality.
answer: |-
  Here are 8 targeted questions with follow-ups designed to push beyond exposition, probe vulnerabilities, and anticipate deflections, based on your specified focus areas:

  1.  **Algorithmic Identity & EDT:**
      *   **Question:** "Superrationality hinges on agents being 'identical algorithms' reasoning about each other. But if 'same algorithm' means deterministic code reacting to identical information inputs, doesn't that reduce the correlation between choices to pure logical entailment? Isn't 'cooperate iff the other cooperates' then simply *evidential* that you'll both defect *or* both cooperate, making superrationality just Evidential Decision Theory (EDT) with a very specific, self-referential evidence set?"
      *   *Likely Answer:* "No, it's fundamentally different because EDT considers evidence *about the world*, while superrationality is about recognizing the logical unity of identical decision processes." *OR* "The correlation stems from the metaphysical identity in Platonia, not just evidence."
      *   **Follow-Up:** "But if the choices are logically entailed by the shared algorithm + inputs, doesn't EDT *exactly* capture that? The 'evidence' *is* the logical fact of the shared algorithm. What specific calculation or weight does superrationality add *beyond* EDT's `argmax[ U(A) * P(B|A) ]` when A and B *are* logically identical? Is there a distinct mathematical operation here?"

  2.  **The Degradation Problem (Near-Copies):**
      *   **Question:** "Let's move from perfect identity to near-identity. Agent A and Agent B share 99.9% of their decision algorithm and initial state. Should they reason superrationally? If yes, does cooperation become slightly less compelling? If no, why does a 0.1% difference obliterate the 'same event' intuition? How does the view handle smooth gradients of similarity?"
      *   *Likely Answer:* "True superrationality requires perfect identity. Near-copies introduce noise, breaking the necessary symmetry/link." *OR* "The degree of cooperation should degrade with similarity."
      *   **Follow-Up:** "If it degrades, what's the functional form? Is it proportional to algorithmic similarity? How is 'algorithmic similarity' quantified meaningfully? More crucially: *Why* should mere algorithmic similarity (without causal influence or guaranteed logical entailment) create the required correlation to justify cooperation? Isn't this smuggling in an *assumption* of correlation based on similarity, rather than deriving it?"

  3.  **The Staggered Run Crucible:**
      *   **Question:** "Copy A runs at T=0, outputs its choice (say, Defect), and that choice is permanently sealed/irreversible at T=1. Copy B, an *identical* algorithm, runs at T=2, knowing *everything* about A's situation, the seal, and the irreversibility. B knows A defected. Should B cooperate? If yes, how can B's cooperation be 'the same event' as A's defection, given A's action is fixed, causally disconnected, *and* known to B? If no, doesn't this show superrationality collapses without simultaneous mutual influence?"
      *   *Likely Answer:* "B *should* defect because the fixed outcome breaks the symmetry; the 'same event' condition fails due to the temporal separation and knowledge." *OR* (Less likely) "B should still cooperate, viewing the sealed outcome as part of the fixed past they must jointly transcend."
      *   **Follow-Up:** "If B defects (as seems rational), doesn't this reveal that superrationality's core mechanism *requires* the agents to be in a state of mutual ontological uncertainty *during* their decision process? Doesn't the staggered run expose that the 'same event' feeling is just an artifact of simultaneous deliberation *without pre-commitment*, and that superrationality isn't tracking a deep metaphysical unity, but rather exploiting the logical loop created by simultaneous, uncertain choice?"

  4.  **The Kantian Critique:**
      *   **Question:** "Detractors often call superrationality 'Kantianism with payoff matrices.' You choose Cooperation because you will it to be a universal law (for identical agents), maximizing payoff *if* universalized. How is this substantively different from a game-theoretic rendering of the Categorical Imperative?"
      *   *Likely Answer:* "Kantianism is deontological/moral, while superrationality is about rational self-interest in a uniquely symmetric epistemic/ontological scenario. The payoff matrix shows it's *instrumentally* rational, not morally obligatory."
      *   **Follow-Up:** "But doesn't the *force* of the 'you should will it universally' step in superrationality come *entirely* from the contingent fact that universal cooperation yields a higher payoff *in this specific matrix*? If the PD payoffs were reversed (so mutual defection was best), superrationality would prescribe defection. Doesn't this show the payoff structure, not a Kantian universalizability *principle*, is doing the real work? Isn't it just payoff-dependent coordination?"

  5.  **Beyond Self-Copies - Symmetric Strangers?**
      *   **Question:** "Could superrationality ever apply between two *different* agents who independently, rationally conclude they are perfectly symmetric in reasoning and situation? Suppose two hyper-rational aliens meet via text, know they are identical in capability and values, face a symmetric PD, but know they aren't 'copies.' Should they cooperate superrationally?"
      *   *Likely Answer:* "Probably not, because they lack the metaphysical guarantee of identical *algorithmic implementation*. There's always epistemic uncertainty." *OR* "If they could be *certain* of symmetry, maybe."
      *   **Follow-Up:** "If the answer is 'no', doesn't this severely limit superrationality's relevance to highly contrived copy-scenarios? If the answer is 'yes, if certain', how does this differ from standard focal point/coordination reasoning? What unique element of superrationality remains if the agents aren't literally instantiations of the *same code*?"

  6.  **The Prediction Objection:**
      *   **Question:** "A superrational cooperator reasons: 'I cooperate because my copy will do the same.' But isn't this prediction circular? My copy's action *depends* on mine via the same reasoning. How can I *predict* their cooperation *before* I decide, when their decision logically depends on predicting mine identically? Doesn't this regress prevent the formation of a justified belief needed to choose?"
      *   *Likely Answer:* "It's not prediction; it's recognition of the logical unity. We don't predict, we *realize* our actions are linked/identical." *OR* "The symmetry forces the outcome."
      *   **Follow-Up:** "But doesn't the *psychological process* of reaching that realization still involve a step where I contemplate what *I* will do, which logically entails what *they* will do? How does the agent escape the bootstrapping problem of needing to know the outcome to decide, but needing to decide to create the outcome? Is this a stable equilibrium or a paradox?"

  7.  **The "No Serious View" Deflection Breaker:**
      *   **Question:** "You've likely encountered many objections. What specific, conceivable empirical result, theoretical proof, or experimental observation would genuinely make you reconsider or abandon core tenets of superrationality? Not just a 'puzzle to solve,' but a result that would make you think 'If that's true, superrationality as I understand it is probably wrong.'"
      *   *Likely Answer:* "It's a normative/logical theory, so empirical results aren't directly applicable." *OR* "Perhaps if it were shown to be formally inconsistent." *OR* "If experiments showed perfect copies reliably defect in one-shot PDs."
      *   **Follow-Up:** "Take your most plausible concession. If perfect copies *did* reliably defect in a carefully controlled one-shot scenario (assuming such an experiment were possible), would you accept that as falsifying the claim that superrational cooperation is the uniquely rational outcome? Or would you argue the copies weren't truly identical/superrational in their reasoning? If the latter, doesn't that make superrationality unfalsifiable in principle?"

  8.  **The Scope & Payoff-Dependence:**
      *   **Question:** "Superrationality seems tightly bound to symmetric, simultaneous, one-shot, perfect-information games between identical algorithms. Does the view offer any unique, compelling insights or prescriptions for *asymmetric* interactions, repeated games with learning, or real-world dilemmas involving unique agents with imperfect information? Or is its domain inherently limited to these rarefied copy-scenarios?"
      *   *Likely Answer:* "Its core domain is the copy-scenario, but the *principle* of recognizing deep symmetry might have broader, perhaps metaphorical, applications." *OR* "It clarifies the logical structure of rationality itself in idealized settings."
      *   **Follow-Up:** "If its direct application is so narrow, and its prescriptions become unstable or unclear under minor perturbations (like near-copies or staggered runs), doesn't this significantly reduce its claim to be a fundamental theory of rational choice, relegating it more to a fascinating thought experiment about logical self-reference?"

  **Key Tactics Employed:**

  *   **Forcing Cash-Out:** Questions 1 & 3 explicitly demand operational definitions and expose potential reductions (to EDT) or core dependencies (on simultaneity/uncertainty).
  *   **Testing Boundaries:** Questions 2 (near-copies) and 5 (symmetric strangers) probe how the view degrades or extends beyond its ideal case.
  *   **Core Mechanism Probe:** Question 3 (Staggered Run) is designed as the central counterexample to isolate what the view *actually* relies on.
  *   **Philosophical Context:** Question 4 directly addresses the Kantian comparison head-on.
  *   **Anticipating Deflections:** Questions 6 (Prediction) and 7 (Falsifiability) are structured to make dismissive answers difficult. Question 7 is crucial for preventing the "no view is perfect" dodge by demanding a *specific* failure condition.
  *   **Relevance Challenge:** Question 8 questions the scope and practical significance.

  Use these to push the conversation beyond rehashing Platonia and into the deeper philosophical and decision-theoretic implications and challenges of the view. Good luck with the interview!
