  - Name/registration alone doesn't confer identity (vi).

  Eliminated rules:
  1. Material continuity alone isn't sufficient (ii).
  2. Registration/paperwork isn't decisive (vi).
  3. Fission cases lead to non-identity when symmetric (v).
  4. Gradualness isn't necessary (iv).

  Surviving rules:
  - Functional continuity: Continuous use and identity as a vessel.
  - Causal continuity: Continuous custodianship and intentional preservation.
  - Physical continuity: Significant original parts, especially structural elements.

  Applying to the 60-40 split:
  - The 40% hull has functional continuity (sailing for 7 years) and holds national registration. But it has less original fabric and a new hull built around it.
  - The 60% hull has more original material but lacked function for a decade. It has regional registration.

  Classification: This resembles symmetric fission (v) because both hulls have claims. The custodial project origin doesn't override the symmetry, unlike (ii) which was asymmetric.

  Miriam's likely verdict: Neither is the original vessel. Both are reconstructions. The 40% hull's continuous use isn't equivalent to the continuous service in (i) or (iii) because the split was intentional fission.

  What to catalog: Enter the original vessel as "ceased to exist" during the split. List both as reconstructions.

  Further test case: A 90-10 split where the minority-fabric branch has continuous service. If Miriam rules the 10% branch as original, functional continuity dominates. If not, material continuity is key. This would clarify which principle prevails when they conflict.
answer: |-
  Based on Miriam's rulings (i)-(vi), I'll derive the implicit rules, eliminate incompatible theories, apply them to the 60-40 split case, predict Miriam's verdict, and propose a decisive test case. This requires reconciling her emphasis on **functional continuity** and **custodial intentionality** over material or bureaucratic criteria.

  ### Core Rules Derived from (i)-(vi)
  1. **Gradual Replacement Rule**: Identity persists if original material is replaced incrementally during continuous service, regardless of proportion replaced (from i and iv).  
  2. **Reassembly Rule**: Identity persists if disassembly/reassembly is temporary and custodially continuous, even with new fastenings (from iii).  
  3. **Fission Rule**: After symmetric division (equal claims), identity is destroyed; neither descendant is original (from v).  
  4. **Custodial Intent Rule**: Identity requires unbroken intentional preservation *as the same vessel* by a single custodian (implied by i-vi; explicit in ii vs. iii).  
  5. **Functional Primacy Rule**: Continuous function as a vessel trumps material composition or paperwork (from i, iii, iv, vi).  
  6. **Material Threshold Rule**: Original fabric alone is insufficient for identity if not integrated through custodial continuity (from ii and v).  
  7. **Paperwork Insufficiency Rule**: Name, registration, or logbooks cannot confer identity without functional/custodial continuity (from vi).  

  ### Eliminated "Natural-Looking" Rules  
  - **Material Absolutism**: *Eliminated by (ii)*. Original fabric reassembled without custodial continuity doesn't preserve identity.  
  - **Provenance Absolutism**: *Eliminated by (v) and (vi)*. Salvaged parts (v) or paperwork/name (vi) alone can't sustain identity.  
  - **Gradualness Necessity**: *Eliminated by (iv)*. Identity preserved despite sudden, extensive rebuilding (fire).  
  - **Spatiotemporal Continuity**: *Eliminated by (iii)*. Identity survives disassembly, transport, and dormant periods.  
  - **4D Fission Standard**: *Eliminated by (v)*. Standard perdurantism (where both fission products share identity) fails as neither salvaged barge is original.  
  - **Bureaucratic Identity**: *Eliminated by (vi)*. Registration/logbooks on a new hull create a namesake, not identity.  
  - **Majority-Material Sufficiency**: *Eliminated by (ii)* and *challenged by (v)*. Having "most" fabric isn't decisive without functional/custodial continuity.  

  ### Analysis of the 60-40 Split Case
  **Key Facts**:  
  - **40% Hull**: Minor original fabric (starboard planking, deck beams, etc.), but 7 years of continuous sailing, original name/logs/registration.  
  - **60% Hull**: Major original fabric (keel, port side, frames), but 10-year dormancy, no function until recently, regional registration only.  
  - **Custodial Context**: Both stem from a *single intentional project* but diverged into *two independent custodial paths* with no functional integration.  

  **Application of Rules**:  
  - **Functional Primacy** favors the 40% hull due to continuous service (echoing i/iii/iv).  
  - **Custodial Intent** initially unified the project but *fractured* upon split, creating two distinct lineages (like v).  
  - **Fission Rule** applies strongly: symmetric division (40% vs. 60% is comparable; neither dominates materially or functionally) implies the original ceased to exist during the split.  
  - **Material Threshold** doesn't resolve ambiguity: 60% has more fabric, but 40% has critical structural elements (e.g., rigging, beams).  
  - **Paperwork Insufficiency** undermines the 40% hull's national registration (per vi) and the 60% hull's regional claim.  

  **Classification**: This aligns with **(v)**, not (iii)/(iv). Unlike (iii), the split wasn't a temporary dormancy but a permanent fission into two vessels. Unlike (iv), there was no continuous functional identity during rebuilding. The custodial project’s unity is analogous to the barge’s original form in (v), but fission into dual custodians destroys identity.  

  ### Predictions for Miriam's Verdict  
  - **Likely Ruling**: **Neither hull is the original vessel.** The original ceased to exist during the custodial split.  
    - *Why?* Fission Rule (v) dominates: symmetric division without custodial/functional continuity to either branch. The 40% hull’s continuous sailing is functionally *new* (like vi’s namesake), and the 60% hull’s dormancy lacks reactivation by the original custodian (cf. iii). Custodial fracture is fatal.  
  - **Catalog Entry**: Original vessel marked **"ceased to exist during the custodial split in [year]"**, with both hulls cataloged as **"reconstructions incorporating original fabric"**. The future re-joined hull would be a **replica** (lacking functional continuity).  

  ### Further Test Case to Separate Surviving Rules  
  A **90-10 split with functional continuity to the minority branch** would isolate Functional Primacy vs. Material Threshold:  
  - *Scenario*: A schooner’s custodial project splits fabric:  
    - Yard A: 10% original fabric (e.g., deck fittings), builds a new hull, sails continuously with original name/logs.  
    - Yard B: 90% original fabric (e.g., hull, keel), stored for 15 years before launching.  
  - *Contrast*: If Miriam rules **only Yard A’s vessel as original**, Functional Primacy dominates. If **neither is original**, Material Threshold/Fission Rule dominates. If **Yard B is original**, Material Absolutism resurfaces (contradicting ii).  
  - *Why this works*: Forces conflict between functional continuity (A) and material majority (B), with custodial symmetry. Mirrors the unresolved tension in the 60-40 case but exaggerates the variables.  

  ### Conclusion  
  Miriam’s jurisprudence treats vessels as **functional entities preserved by intentional continuity**, not material aggregates or bureaucratic artifacts. The 60-40 split is a **fission event** (like v), so neither descendant is original. Her verdict will likely prioritize the *irreversible custodial fracture* over partial functional or material claims. For cataloging, this demands clear historical honesty: the original ceased to exist, and both hulls are derivative. The test case above would clarify whether continuous function can ever override extreme material loss after fission—a frontier her precedents leave open.
