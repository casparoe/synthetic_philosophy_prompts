  First, I need to analyze Miriam's existing rulings. She seems to prioritize continuity and functional identity over material composition. For example, in (i) gradual replacement keeps identity, while in (ii) reassembling discarded parts doesn't. The dormancy in (iii) and the fire rebuild in (iv) show that interruptions and partial destruction don't break identity if there's continuous service or physical continuity. Case (v) with two salvors creating two vessels indicates that symmetric fission destroys the original identity. Case (vi) shows that name/registration alone isn't sufficient.

