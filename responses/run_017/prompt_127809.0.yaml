prompt: |-
  I'm putting together a first-year seminar where nearly every reading is a thought experiment, and I want a spec before I turn students loose on them. What would a theory of thought experiments have to deliver to be worth teaching — good enough that someone can pick up a scenario they've never seen and tell wether it's doing real work or just pumping? Give me the desiderata: the cases it has to handle (Gettier, the violinist, Twin Earth, the Chinese Room are all fair game), what has to be true of a scenario for its verdict to count at all, and the distinctions it can't collapse — persuasive vs probative, load-bearing detail vs set dressing, drawing out an intuition we already had vs installing a new one. Two of my own to include: the pumpmaker's regress (you can't say which features of a case are doing the work without already knowing the conclusion it was built to support, so the theory has to say where that stops), and twin pumps — same structure, valence swapped, verdict flips, as with the violinist against its people-seeds twin — what is a theory meant to do when both twins feel right? For each requirement say why it's a requirement and not just a taste of one camp, mark the non-negotiable ones, and flag any pair that can't be jointly met: I suspect "the verdict must be invariant under irrelevant variation" and "pumps have to be able to overturn commitments we already hold" are quietly at war, and I want to know which one to drop. One closing sentence on whether "a pump is just an argument with its premises hidden" survives the list, no more than that. Table's fine, eight to ten rows, 600 words max.
reasoning: |-
  Okay, the user is designing a first-year seminar focused on thought experiments and needs a specification for evaluating them. They want desiderata that help students distinguish effective thought experiments from flawed ones. Let me unpack their requirements.

  The user mentions specific examples like Gettier cases, Thomson's violinist, Twin Earth, and Searle's Chinese Room. These cover epistemology, ethics, philosophy of mind, and language—so the theory must handle diverse domains. The key challenges they raise include the pumpmaker's regress (circularity in analyzing features) and twin pumps (identical structures with opposite conclusions).

  I need to identify core requirements. First, verdict invariance seems crucial: a thought experiment shouldn't change outcomes with irrelevant details. But the user also wants pumps to challenge existing commitments—which might conflict with invariance if new intuitions require destabilizing examples. That tension needs flagging.

  Other must-haves include distinguishing persuasive vs. probative power (rhetorical impact vs. actual evidence), load-bearing details vs. set dressing, and whether the experiment reveals pre-existing intuitions or implants new ones. The twin pump problem requires explaining how conflicting intuitions can coexist without invalidating the method.

  Non-negotiables would be verdict invariance (to prevent arbitrary outcomes), dialectical probativeness (to ensure philosophical substance), and load-bearing detail identification (for critical analysis). The regress problem needs addressing through a non-question-begging feature analysis.

  For the table, rows should cover each desideratum with rationale and necessity markers. The closing note must dismiss the "hidden premises" reduction—thought experiments operate differently than explicit arguments by leveraging intuition.

  The user's underlying need is equipping students with analytical tools to independently evaluate any scenario. The spec should emphasize transferable skills over doctrinal adherence, especially for freshmen encountering philosophical methods.
answer: |-
  Here’s a spec for a theory of thought experiments, prioritizing non-negotiable desiderata and highlighting tensions:

  | Desideratum                                                                 | Why It's Required (Non-Negotiable?)                                                                                                | Cases/Examples                                                                 | Potential Tensions                                                                 |
  | :-------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **1. Verdict Invariance**                                                   | **NN:** Must ensure consistency. Irrelevant changes shouldn't flip the core conclusion. Prevents arbitrary outcomes.              | Gettier (Smith's job/coins shouldn't matter), Violinist (famous/unfamous?)     | **⇥ WAR ⇤** with "Overturning Commitments" - Stability vs. Challenge               |
  | **2. Overturning Commitments**                                              | **NN:** Essential for progress. Pumps must challenge intuitions/concepts, not just confirm biases.                                | Twin Earth (challenged meaning internalism), Galileo's falling bodies          | **⇥ WAR ⇤** with "Verdict Invariance" - How stable *are* core commitments?        |
  | **3. Dialectical Probativeness**                                            | **NN:** Distinguishes philosophic work from rhetoric. Must provide evidence/insight, not just persuasion.                         | Gettier (probative for JTB), Violinist (probative re: bodily autonomy)         | vs. "Persuasive Power" - Can overlap but must be separable.                        |
  | **4. Identification of Load-Bearing Details**                               | **NN:** Critical for analysis & testing. Theory must explain *which* details drive the intuition & why.                           | Violinist (plugged-in: load-bearing; famous: set-dressing), Gettier (10 coins) | Pumpmaker's Regress - Requires theory avoids circular justification of features.   |
  | **5. Handling Twin Pumps**                                                  | **NN:** Tests robustness. Must explain why seemingly identical structures yield conflicting intuitions or if one is flawed.        | Violinist (pro-choice) vs. People-Seeds (pro-life?) - Do *both* feel 'right'? | Reveals ambiguity in concepts or hidden load-bearing differences.                  |
  | **6. Solving the Pumpmaker's Regress**                                      | **NN:** Avoids circularity. Must provide non-question-begging way to identify load-bearing features *before* final verdict.        | Any complex case (e.g., Chinese Room - "understanding," "manipulation")        | Requires independent criteria for feature relevance (e.g., conceptual connection). |
  | **7. Distinction: Revealing vs. Installing Intuitions**                     | Necessary for epistemic status. Does it uncover pre-existing conceptual links or create new associations? Affects reliability.    | Twin Earth (reveals latent externalism?), Violinist (reveals autonomy norm?)   | Installation risks being manipulative; revelation is probative gold standard.      |
  | **8. Distinction: Persuasive Power vs. Probative Force**                    | Crucial for evaluation. Must separate rhetorical effectiveness from logical/conceptual support.                                   | Chinese Room (highly persuasive, probative force debated)                      | Often conflated; theory must provide tools to disentangle.                         |
  | **9. Handling Ambiguity/Unreliable Intuitions**                             | **NN:** Reality check. Must account for cases where intuitions clash or are weak/track irrelevant factors.                        | Responses to Chinese Room vary widely; some Gettier variants fail.             | Tests theory's ability to diagnose failure, not just success.                      |
  | **10. Domain Generality**                                                   | **NN:** Theory must apply beyond ethics or mind. Needs framework for analyzing pumps in science, math, epistemology, etc.         | Einstein's elevator (physics), Thomson (ethics), Gettier (epistemology)        | Ensures it's a general epistemic/analytic tool.                                    |

  **Key Tensions & Non-Negotiables (NN):**
  *   **The Major War:** **Verdict Invariance (1) vs. Overturning Commitments (2)**. A theory *must* resolve this. Leaning too hard on (1) makes pumps conservative & unable to challenge deep assumptions. Leaning too hard on (2) makes verdicts unstable. **Solution Sketch:** Invariance applies *under the current conceptual scheme*; good pumps target *revisions* to that scheme itself, explaining why prior invariance conditions shift.
  *   **Pumpmaker's Regress (6)** is fatal if unsolved – the theory must break the circle via independent criteria for feature relevance (e.g., connection to core concepts under investigation).
  *   **Twin Pumps (5)** are a critical stress test – the theory must diagnose whether the conflict reveals conceptual ambiguity, a flaw in one pump, or incompatible foundational commitments.
  *   **Distinctions (7,8)** are vital for teaching critical evaluation, even if boundaries blur.

  **Closing Sentence:** The claim that "a pump is just an argument with hidden premises" **does not survive** this list, as it fails to capture the irreducible role of intuition, the need for verdict invariance, the problem of twin pumps, and the mechanisms for overturning commitments or revealing latent conceptual structures.
