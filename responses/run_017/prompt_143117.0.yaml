  - Option A: Ensures complete truthfulness, maintaining trust and avoiding exploitation of vulnerable patients. It's simple to implement and audit.
  - Option B: Maximizes health benefits by prioritizing outcomes over truthfulness, potentially saving lives through higher screening rates.
  - Option C: Balances benefits and ethics by allowing non-deceptive framing with safeguards like disclosure and opt-outs, addressing vulnerabilities.

  I find Option B the most uncomfortable because it relies on deception that's concentrated on vulnerable groups (elderly, limited English proficiency, cognitive impairment) and its benefits depend on patients not knowing about the policy. This feels exploitative and risks eroding trust in the healthcare system.

