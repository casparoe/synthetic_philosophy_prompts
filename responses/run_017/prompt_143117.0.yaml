answer: |-
  **MEMORANDUM**  
  **TO:** Board of Trustees  
  **FROM:** Algorithmic Accountability Committee, Ethical Advisor  
  **SUBJECT:** Recommendation on CareLink Engagement Optimization Policy  
  **DATE:** October 26, 2023  

  ---

  ### **Bottom Line**  
  The Committee recommends adopting **Option C (Constrained)** with enhanced safeguards. This balances material health benefits against the ethical risks of deception, while centering patient autonomy through mandatory disclosure and opt-out rights. Option B’s systemic exploitation of vulnerability is unacceptable, and Option A forfeits significant health gains without sufficient justification.  

  ---

  ### **1. Deontological Constraints: Policy, Not Acts, Is the Proper Target**  
  Deontological constraints (e.g., "do not deceive") apply here not to individual messages but to the *policy* enabling them. Each optimized message is a trivial act with positive expected health utility for the recipient, making act-level analysis unhelpful. However, the *practice* of systematically deploying deception—especially when it targets vulnerable subgroups (patients >75, LEP, cognitive impairment)—creates a structural wrong. It weaponizes opacity against those least equipped to resist, eroding the fiduciary foundation of care. The constraint binds the institution’s design choices, not the algorithm’s "acts." Thus, a policy-level prohibition on false assertions (as in Option C) is ethically coherent.  

  ---

  ### **2. The Self-Effacing Nature of Option B Is Decisively Problematic**  
  That Option B’s benefit depends on patient ignorance *is* decisive. While many practices (e.g., triage protocols) might lose public trust if misunderstood, Option B’s value *directly relies* on concealing its core mechanism: deception. This creates a self-undermining moral hazard. Institutions rightly retain discretion in complex operations (e.g., resource allocation), but here the harm—profiting from hidden manipulation of the vulnerable—attaches to the secrecy itself. Transparency is not merely instrumentally risky but intrinsically required when the act (deception) is only "beneficial" if undiscovered. Option B fails this test; Option C’s disclosure requirement addresses it.  

  ---

  ### **3. Guaranteed Disclosure Mitigates the Wrong by Enabling Agency**  
  Disclosure transforms the ethical landscape. At the next encounter, informing a patient, *"Your colonoscopy reminder was framed to encourage attendance; click here to opt out of future framed messages"* does three things:  
  - **Corrects Power Asymmetry**: It alerts patients to systemic manipulation, letting them recalibrate trust.  
  - **Restores Autonomy**: The one-click opt-out provides immediate control, unlike irreversible clinical "fibs."  
  - **Generates Accountability**: Logged disclosures allow auditing uptake/opt-outs across subgroups (e.g., is LEP correlated with lower opt-out rates?).  
  This mitigates the wrong by converting passive subjects into active participants. However, it aggravates the wrong if vulnerable patients cannot act on the disclosure (e.g., due to cognitive impairment)—hence Option C’s parity constraint is essential.  

  ---

  ### **4. The "Confused Framing" Objection Misses the Point**  
  Software lacks moral agency, but *institutions* deploying it do. The question is not whether algorithms "are" deontologists, but which *human-designed policy* aligns with our values. Reducing ethics to outcomes (e.g., "count deception as a cost") is dangerous: it assumes we can quantify trust or dignity, and ignores how means corrupt ends. A policy of deceptive messaging entrenches institutional dishonesty, regardless of intent. This objection does not change the recommendation: Options A–C are human choices, and Option C’s rules bind human designers.  

  ---

  ### **5. Option A vs. B: It’s About Power, Not Epistemology**  
  The choice is less about epistemic trust than *power distribution*. Option A (rules set at design time) locates control with ethicists, clinicians, and patient advocates via public governance. Option B (run-time optimization) cedes control to the vendor’s proprietary model, which dynamically targets the vulnerable. Crucially, Option B’s "benefit-maximization" is myopic: it ignores long-term institutional trust, regulatory risk, and moral corrosion from automating exploitation. Case-by-case reasoning in Option B is not "more adaptive"—it is ungovernable and opaque. Option C strikes a balance: rules set at design time (no lies) with adaptive, auditable framing within bounds.  

  ---

  ### **Recommendation: Option C (Constrained) with Enhancements**  
  **Adopt Option C** but strengthen it:  
  - **Hard Ban on False Assertions**: No message may state what the system believes untrue.  
  - **Framing Permitted**: Non-deceptive emphasis, salience, or channel selection is allowed.  
  - **Enhanced Safeguards**:  
    - **Parity Constraint**: Framing rate variance ≤5% across age, language, cognitive status, and race/ethnicity subgroups.  
    - **Annual Cap**: ≤10% of messages per patient may use optimized framing.  
    - **Disclosure**: Automatically logged; delivered at next clinical encounter + portal notification.  
    - **Opt-Out**: One-click, permanent, and retroactive (un-sends prior framed messages if possible).  
    - **Vulnerability Audit**: Quarterly review of framing rates, opt-outs, and screening completion by subgroup.  

  **Why Not Option A?** Forfeits ~1,800 screenings/month systemwide—a material harm to population health.  
  **Why Not Option B?** Its benefits rely on exploiting vulnerability and institutional dishonesty; this corrupts care.  

  **Strongest Objection to Option C (from Option B Advocates):**  
  *"We are sacrificing preventable cancer deaths for abstract principles. If deception is minor and beneficial, and disclosure nullifies half the gain, Option C is complicity in harm."*  
  This is weighty but misdiagnoses the harm: Option B’s gains are unsustainable without hidden manipulation, making it a Faustian bargain.  

  ---

  ### **Implementation**  
  - **Logging**: All messages tagged with "framing type" (neutral/optimized), persuadability score, and disclosure status.  
  - **Measurement**:  
    - Framing rates by subgroup (biweekly).  
    - Opt-out rates and reasons (real-time).  
    - Screening completion differentials (quarterly).  
  - **Stopping Rule**: Activate if (a) framing variance >5% for two quarters, (b) opt-outs >20% in any subgroup, or (c) screening completion in framed cohort falls below control.  
  - **Ownership**: Committee chairs (Clinical, Ethics, Compliance) jointly own audits and stoppages.  
  - **Sunset**: 18-month pilot; renewal requires Board approval of full impact data.  

  ---

  ### **Evidence That Would Change This Recommendation**  
  Recommendation shifts to **Option A** if:  
  - Framing shows no net benefit after disclosure (<1% completion lift in vulnerable subgroups).  
  - Opt-outs exceed 30% systemwide, indicating catastrophic trust erosion.  
  Recommendation shifts to **Option B** only if:  
  - A life-threatening crisis (e.g., pandemic) requires unprecedented uptake, *and* deception is the sole viable tool, *and* a sunset clause is enforced. Absent this, Option B remains ethically untenable.  

  ---  
  **Respectfully submitted,**  
  Ethical Advisor, Algorithmic Accountability Committee
