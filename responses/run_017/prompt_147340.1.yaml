  ### Scenario: Small-Business Lending  
  A bank uses a credit scoring model to approve/reject small-business loan applications. The outcome is repayment (1) or default (0). The population is divided into two regions (East/West), each with a 70% overall repayment rate. Within each region, businesses belong to one of two industries: **Manufacturing** (high-risk) or **Retail** (low-risk). The bank uses a **credit score** (0–100) based on financial metrics (e.g., cash flow, debt ratio), but it lacks industry data due to reporting gaps. The true repayment rates are:  
  - **East**: Manufacturing (60%), Retail (80%)  
  - **West**: Manufacturing (50%), Retail (90%)  

  The credit score is calibrated to predict repayment probability but cannot distinguish industries. The bank approves loans if the score is ≥70.  

  ---

  ### (a) Equal Base Rates, Yet Conflict  
  The two headline groups (East/West) have identical repayment rates (70%), satisfying the "textbook escape hatch" for fairness criteria. However, the **industry subpopulations** have divergent prevalences (Manufacturing: 50–60%, Retail: 80–90%). The minimal further condition for joint satisfiability is **equal outcome distributions within groups**—violated here because industry-specific risks differ despite regional parity.  

  ---

  ### (b) Plausible Subpopulations  
  Industries are regulatorily relevant (e.g., CRA requirements to avoid credit deserts). The bank’s features (credit score, region) **cannot identify industry**, as financials correlate imperfectly with sector risk.  

  ---

  ### (c) Partition-Dependent Fairness Conflict  
  #### At Regional Level (East/West): All Criteria Hold  
  | Criterion          | East | West |
  |--------------------|------|------|
  | **Calibration**    | Pass | Pass |
  | **FPR Equality**   | 15%  | 15%  |
  | **FNR Equality**   | 10%  | 10%  |
  - *Calibration*: Score = actual repayment rate (e.g., 70 score ≈ 70% repayment).  
  - *FPR*: P(approve | default) = 15% for both regions.  
  - *FNR*: P(reject | repay) = 10% for both regions.  

  #### At Industry Level: Conflict Arises  
  When auditing Manufacturing/Retail separately, the criteria conflict. Below are three classifiers (varying approval thresholds), each satisfying exactly two criteria:  

  | **Classifier**           | Approval Rule                   | Calibration | FPR Equality | FNR Equality |
  |--------------------------|---------------------------------|-------------|--------------|--------------|
  | 1. **Score ≥ 70**        | Default (current policy)        | ❌           | ❌            | ❌            |
  | 2. **Score ≥ 60**        | Lower threshold (lenient)       | ❌           | ✅ (20% all)  | ❌            |
  | 3. **Score ≥ 80**        | Higher threshold (strict)       | ❌           | ❌            | ✅ (5% all)   |
  | 4. **Region-Adjusted**   | East: ≥65, West: ≥75 (custom)   | ❌           | ❌            | ❌            |

  - **Classifier 2 (satisfies FPR + Calibration)**:  
    FPR = 20% for all industries (e.g., P(approve | default) even).  
    Calibration fails (e.g., 60 score ≈ 55% repayment in East Manufacturing vs. 75% in East Retail).  
  - **Classifier 3 (satisfies FNR + Calibration)**:  
    FNR = 5% for all industries (e.g., P(reject | repay) even).  
    Calibration fails (e.g., 80 score ≈ 85% repayment in West Retail vs. 70% in West Manufacturing).  
  - **Classifier 4 (satisfies FPR + FNR)**:  
    FPR = 10%, FNR = 8% for all industries.  
    Calibration fails (score ≠ actual repayment within industries).  

  **Conflict Source**: No classifier satisfies all three simultaneously. FPR/FNR equality forces miscalibration, and vice versa.  

  ---

  ### (d) The Partition Sensitivity & Replies  
  - **Feature Driving Conflict**: **Credit score**. It correlates with repayment but is blind to industry-driven risk differences.  
  - **Partition Coarsening/Refining**:  
    - **Coarsening** (e.g., merging regions): Dissolves conflict (e.g., national repayment = 70%; all criteria hold).  
    - **Refining** (e.g., adding urban/rural splits): Worsens conflict (more subgroups amplify miscalibration).  

  #### Steelmanning the Impossibility Results  
  1. **"Fine Partition is Honest"**:  
     *"Industries reflect structural economic disparities (e.g., Manufacturing decline). Coarse regional audits mask Retail’s advantage and Manufacturing’s exclusion. Fairness must address morally salient groups—even if mathematics complicates it."*  
  2. **"Criteria Miss the Point"**:  
     *"The real question is: Does the tool improve outcomes for all groups vs. human judgment? If East Manufacturing’s approval rate rises from 40% (human) to 50% (algorithm) without harming others, the ‘conflict’ is practically irrelevant."*  

  ---

  ### The Unobservable Outcome Problem  
  **Critical Issue**: The bank only observes repayment outcomes for **approved** loans. For rejected applicants, outcomes are missing. Thus:  
  - **Observed**: Repayment rates for approved applications (by region/industry).  
  - **Unobservable**: True repayment rates for rejected applicants (the "counterfactual").  
  - **Theorem’s Inputs**: Formally, fairness criteria require **full outcome data**. When half the data is missing (rejectees), the impossibility results **lose empirical traction**. The bank imputes missing outcomes (e.g., assuming rejected applicants would have defaulted), but this entrenches historical biases.  

  **Consequence**: The audited partition (e.g., regions) becomes a Goodhart target—optimized for imputed rather than true risks. A regulator auditing industries faces unverifiable inputs, making fairness claims non-falsifiable. The impossibility results are mathematically sound but operationally silent where they matter most.  

  ---
  ### Summary  
  The impossibility results are partition-contingent: They vanish under coarsening and intensify under refining. The conflict arises not from arithmetic but from the *choice* to audit subgroups with divergent risks. When outcomes are unobservable for rejects, fairness claims rest on imputed data, converting the problem into a feedback loop of assumptions. The mathematics does not settle fairness—it reveals the weight of the initial partition.
