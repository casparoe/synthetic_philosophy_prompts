  2. **Dartboard (✓)**: Area measure is rotationally invariant, so it works.
  3. **Lemonade (✓)**: Without symmetry, no unique answer.
  4. **Cube edge (✓)**: 1/2 is valid *if* edge is fundamental, but it's a choice, not a universal truth.
  5. **Cube volume (✗)**: You must use the *same* distribution as for edge—don't switch symmetries mid-problem!
  6. **Re-description-proofness (✗)**: Demand invariance only under symmetries relevant to the process, not all possible redescriptions.

  ### **Final Advice**
  - **When in doubt, specify the generating process**. This resolves ambiguity (e.g., straw experiment).
  - **Default to natural symmetries**: Lengths often use linear measure, areas use area measure. But always ask: "What did the process randomize?"
  - **Sacrifice the mystery box** if needed—it's genuinely ill-posed. Keep dice and dartboards as they respect symmetry.

