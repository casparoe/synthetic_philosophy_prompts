prompt: |-
  Hey — I'm a judicial clerk at a state supreme court and I've got a twenty-buck bet with the clerk across the hall about how one of our justices is going to vote in a notice case that's being argued next month. I've gone through her statutory-interpretation opinions and I can't settle on the rule she's actually running, because she does textualist-looking things and purposivist-looking things in a pattern that matches neither label cleanly. Here's the track record: everything is anonymised, the quotes are paraphrases from my notes rather than anything verbatim, and I've nudged a few facts so it isn't searchable — please don't try to look any of it up.

  - Bike paths. The Bike Safety Act bans operating a "motorized vehicle" on a public bike path. She held that a throttle-assisted delivery e-bike is covered: she used dictionaries from the year of enactment, said "motorized" is the word doing the work, and said the Act's short title can't narrow the operative words. She added that the parks department's fifteen-year practice of treating e-bikes as bicycles "cannot outvote the enacted text."
  - Same Act, next case. A powered wheelchair ridden by someone who can't walk: not covered, even though everyone concedes it is literally a motorized vehicle. Her reasons were that the Act is about traffic speed and path safety, and that reading it to catch wheelchairs would put it in collision with the state's accessibility statute.
  - Landlord notice. A statute requires that a notice to quit be "in writing, delivered to the tenant's dwelling." The landlord emailed the notice and also taped a paper copy to the door; the tenant admitted in open court that she opened the email the day it was sent. She held the notice invalid: "written" means paper, delivery means delivery to the dwelling.
  - Valet. A local ordinance charges a fee on "operators of commercial parking facilities." A valet-only service that parks cars on public streets and owns no lot: not covered. She said the drafters' failure to name the category "is not ours to repair," and she refused to look at the council committee report saying valet services were meant to be included.
  - Crypto. An anti-money-laundering act imposes duties on "financial institutions." A crypto exchange: covered. Her reasoning was that this is a general category whose membership has to be tracked as business models change, that the legislature had amended the act twice to keep pace with new kinds of intermediary, and that the point of the act — a paper trail for suspicious flows — would be gutted otherwise.
  - Scrivener's error. A penalty provision cross-references "Section 4(b)," but the conduct it obviously targets sits in 4(c). She applied it to 4(c), saying the text read as a whole cannot bear the cross-reference, while again refusing to consult the drafting committee's notes.
  - Vulnerable adults. The Protection of Vulnerable Adults from Financial Exploitation Act penalises "any person who obtains property from an adult by undue influence." A caregiver who received a large gift from a fully competent fifty-year-old with no disability: not covered. She leaned hard on the title and the preamble.

  The new case: that same landlord-notice statute was amended six years ago to add that notice may be given by electronic mail "if the tenant has designated an electronic address in the lease." In our case the lease contains no email address, but the tenant has paid rent through the court system's own online portal for three years, logs in most weeks, and has replied to two earlier notices-to-cure that the landlord sent through that portal. The landlord served the notice to quit only through the portal; the tenant opened it the same day and the system logged both delivery and the read.

  What I want from you isn't "she's a textualist" or "she's a purposivist" — those labels predict opposite outcomes here and each is consistent with most of the list, which is exactly my problem. Give me the two or three genuinely distinct decision-rules that fit her whole track record, say what each one predicts about the portal case, and tell me which you'd bet on and why — in particular, how each rule has to explain the email-notice case and the crypto case, since those seem to pull against each other (one is a general term applied to something new, the other is a specified manner of notice that wasn't followed, and I can't tell whether she treats those as the same move or different ones). Then tell me the one further fact-pattern I should watch for that would finally separate the rules that survive. If you think her precedents genuinely underdetermine the case, say that too, and say what she'd be committing herself to either way.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating puzzle about a justice's judicial philosophy based on anonymized cases, needing predictive rules rather than labels.

  First, I need to identify patterns across the seven cases. The bike path case shows strict textualism (dictionaries, rejecting agency practice), while the wheelchair exception reveals purposivism (considering statute collision and context). The email notice case is hyper-textual ("written" means paper), yet the crypto case expands "financial institutions" purposively. The valet and vulnerable adults cases show title/reference sensitivity, while the scrivener's error corrects clear mistakes.

  Three distinct decision-rules emerge:
  1) Text-first with contextual escape valves - requires either textual ambiguity or absurdity before considering purpose. Predicts portal notice INVALID because lease lacks designation.
  2) Pragmatic textualism - text dominates unless defeating statute's core function. Predicts VALID notice due to functional equivalence.
  3) Structural integrity focus - prioritizes inter-statutory harmony. Leans INVALID but could go either way based on other statutes.

  The key tension is between email notice (text-bound) and crypto (purpose-driven) cases. Rule 1 treats these as different moves (only crypto had textual ambiguity), while Rule 2 sees both as serving statutory function. Rule 3 would check if other statutes govern electronic consent.

  For prediction, I'd bet on Rule 2 (valid notice) because: 
  - Portal use established actual notice (like crypto's functional approach)
  - Tenant's behavior created de facto designation (unlike email case's complete absence)
  - Avoiding absurdity (landlord technically compliant via court system)

  The decisive fact-pattern would be a case where text produces mild inconvenience versus fundamental dysfunction - does she bend text for minor impracticalities or only for catastrophic outcomes? That would separate Rule 1 (only catastrophes) from Rule 2 (practical functionality).

  Ultimately this justice seems to practice "textualism with common-law sensibilities" - a pragmatic rather than doctrinal approach. The portal case will reveal whether her functionalism extends beyond core-purpose preservation to include notice realities.
answer: |-
  Based on her track record, I identify **three genuinely distinct decision-rules** that explain all cases without overfitting. Each rule resolves the tension between the email-notice case (strict text) and crypto case (functional expansion) differently, leading to divergent predictions for the portal case. I'll then identify the critical fact-pattern to watch.

  ---

  ### **Rule 1: Text as Enacted Boundary, Unless Absurdity or Clear Legislative Update**
  - **Core Principle:** The enacted text is the supreme boundary. Purpose, titles, and preambles can *narrow* text if literalism produces absurdity or clashes with other statutes, but cannot *expand* it beyond ordinary meaning. Legislative updates (like crypto amendments) signal that new applications are permitted.
  - **Explaining the Tension:**
    - *Email Notice (strict):* "Designated in the lease" is unambiguous text. Tenant's behavior can't expand it.  
    - *Crypto (expansion):* Legislature *amended* the Act twice for new intermediaries, signaling live adaptation. Applying it to crypto tracks legislative intent to update "financial institutions."  
  - **Other Cases:**  
    - Bike e-bike: Text controls ("motorized" = throttle-assisted). Parks Dept. practice irrelevant.  
    - Wheelchair: Literal text would be absurd and clash with accessibility laws → narrowing allowed.  
    - Valet: Text ("parking facilities") doesn’t cover valets. Committee report can't expand it.  
    - Scrivener's Error: Text as a whole can't bear the error → correction permitted.  
    - Vulnerable Adults: Title/preamble *narrow* "any person" to focus on exploitation.  
  - **Portal Case Prediction: INVALID**  
    Text requires designation "in the lease." Tenant's portal use is extrinsic behavior (like email case), not a lease designation. Legislature updated the statute to allow email—but not portals—implying no expansion beyond specified methods.  

  ---

  ### **Rule 2: Pragmatic Textualism: Function Over Form When Text Serves Core Purpose**  
  - **Core Principle:** Text controls, but "gaps" exist when form conflicts with function. If a term is *broad/generic* (e.g., "financial institutions"), apply functional analysis. If a requirement is *specific/procedural* (e.g., "in writing"), enforce strictly. Purpose resolves ambiguity but can’t override clear text.  
  - **Explaining the Tension:**  
    - *Email Notice (strict):* "Designated in the lease" is specific and procedural. Strict compliance required.  
    - *Crypto (expansion):* "Financial institutions" is broad/generic. Functional analysis (tracking suspicious flows) updates its scope.  
  - **Other Cases:**  
    - Bike e-bike: "Motorized vehicle" is specific → throttle-assist fits.  
    - Wheelchair: Literal text defeats safety/accessibility harmony → purpose narrows.  
    - Valet: "Parking facilities" is specific → valets excluded.  
    - Scrivener's Error: Literal text is incoherent → purpose corrects.  
    - Vulnerable Adults: Title/preamble clarify ambiguity in "any person."  
  - **Portal Case Prediction: VALID**  
    The statute’s core purpose (actual notice) was served: tenant received and read it. "Designated in the lease" is procedural, but portal use created *de facto* designation (unlike email case). "Electronic mail" is specific, but the portal is a functional equivalent (like crypto’s updating).  

  ---

  ### **Rule 3: Structural Integrity Focus**  
  - **Core Principle:** Prioritize avoiding conflicts within the statutory scheme. Text controls unless it creates internal contradictions (e.g., wheelchair case) or undermines a clearly superior legislative value (e.g., crypto AML goals). Titles/preambles are tiebreakers.  
  - **Explaining the Tension:**  
    - *Email Notice (strict):* No larger conflict → text enforced.  
    - *Crypto (expansion):* Excluding crypto would gut the AML regime → text expanded to preserve scheme integrity.  
  - **Other Cases:**  
    - Bike e-bike: No larger conflict → text controls.  
    - Wheelchair: Conflict with accessibility laws → text narrowed.  
    - Valet: No larger conflict → text controls.  
    - Scrivener's Error: Internal inconsistency → corrected.  
    - Vulnerable Adults: Title/preamble resolve potential overbreadth conflict.  
  - **Portal Case Prediction: LEANS INVALID**  
    Statute explicitly added "email if designated in lease." Using a portal creates no statutory conflict (unlike wheelchair/crypto). Enforcing the text maintains consistency with email case.  

  ---

  ### **Bet Recommendation & Critical Fact-Pattern**
  - **My Bet: Rule 2 (Pragmatic Textualism) → VALID notice.**  
    **Why?**  
    - The crypto case shows she updates *functional* terms when purpose is thwarted (here, actual notice was achieved).  
    - The email case’s rigidity addressed a *procedural gap* (no designation), while here the tenant’s actions fill that gap pragmatically.  
    - Her scrivener’s error correction shows she prioritizes sensible outcomes over literalism when text is dysfunctional.  
    - **Key Reconciliation:** She distinguishes between (a) *specific procedural requirements* (strictly enforced) and (b) *functional categories* (adaptably applied). The portal blurs this line but leans functional (tenant’s behavior = implied designation).  

  - **Critical Fact-Pattern to Watch:**  
    A case where **strict textualism creates mild inconvenience vs. fundamental dysfunction**.  
    - *Example:* A statute requires "written notice mailed to last known address." Landlord sends it via certified email (not "mailed"), tenant receives it instantly and replies.  
    - *Why it Separates Rules:*  
      - Rule 1 (Text as Boundary) → **Invalid** (not "mailed").  
      - Rule 2 (Pragmatic) → **Valid** (purpose served, method equivalent).  
      - Rule 3 (Structural) → **Invalid** (no larger conflict).  
    Her vote here would confirm if she prioritizes form (Rule 1/3) or function (Rule 2).  

  ---

  ### **If Underdetermined: What She’d Commit To**
  Her precedents *do not* force one outcome, but whichever way she rules commits her to:  
  - **If VALID:** She elevates actual notice and practical equivalence over textual precision, making "designated in the lease" malleable by conduct. This weakens the email case as strictly procedural.  
  - **If INVALID:** She doubles down on textual formality, treating the crypto case as a unique exception for evolving generic terms (not adaptable procedures).  

  **Final Thought:** Her jurisprudence is "textualism with common-law sensibilities." She enforces text rigidly *unless* it produces practical incoherence or misses a clear legislative update. Portal notice is 55/45 in favor of validity. Bet the $20 on **VALID**.
