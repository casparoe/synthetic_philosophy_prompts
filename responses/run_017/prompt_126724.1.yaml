prompt: |-
  You are a professional philosopher — a specialist in ethics, philosophy of action, and personal identity, with working knowledge of clinical bioethics and health law. Please reason carefully and slowly. Before writing your answer, spend a paragraph or two brainstorming: list the candidate accounts of the earlier self's authority that occur to you, note which one you initially find most attractive and why, and note at least one feature of the practice that you expect will be hard for your favourite to handle. Only then commit to a reconstruction. Prefer the reconstruction that explains the most features of the practice with the fewest additional assumptions, and where the practice is genuinely underdetermined, say so plainly rather than manufacturing a verdict. Organise your answer under headings; aim for roughly 1,200 words. One standing constraint: do not cite anything, name articles or authors, or give me a bibliography or further reading. I am working without web access and I do not want guesses about the literature. If any step of your argument rests on what the law actually holds in some jurisdiction, mark that dependence in a single sentence instead of asserting the law.

  I am a PhD student writing a dissertation chapter on advance directives and the authority of the earlier self, and I want you to reconstruct the implicit theory of a practice I keep circling around. The practice is the ordinary one in which a competent adult records instructions about future medical treatment and those instructions are later treated as binding once the person has lost decision-making capacity: clinicians and families are told to follow them, and in most settings the earlier instruction overrides both the judgement of what is now best for the patient and the patient's own contemporaneous wishes. I want to know what has to be true for that to make sense.

  Four features of the practice strike me as doing the real philosophical work, and I would like your reconstruction to account for all four.

  First, the timing. As long as the person remains competent, an earlier directive has no authority at all: a competent patient who changes their mind is treated as having revoked it, whether or not they ever got around to tearing up the form. The earlier self's word becomes binding at exactly the moment it becomes unrevisable. I have started calling this the answerability condition, and it seems to me to be backwards relative to every other domain in which one person's decision binds another — contracts, promises, votes, instructions to an agent — where authority standardly lapses, or at least weakens, once it can no longer be revisited or questioned. The one familiar exception I can think of is the testamentary will, where we do let a dead hand dispose of property. So: is the medical directive best modelled on a will, and what does that comparison buy and what does it break? A will is usually explained by convention, by the owner's ongoing interest in the disposition of what was theirs, or by the needs of survivors — none of which is obviously an explanation in terms of the signer's persisting agency.

  Second, the asymmetry between refusing and requesting. An advance refusal of even life-saving treatment is treated as close to absolute. An advance request — keep me on the ventilator indefinitely, give me this intervention whatever the clinicians think — is not: the standard response is that clinicians owe only what is medically indicated, so the earlier self can veto but cannot command. That asymmetry looks to me like evidence about what the practice is really for.

  Third, the hard case. An elderly patient with diabetes and a gangrenous limb said, years earlier and while fully competent, that she would never want to be kept alive in a demented state. She is now demented, appears content, says cheerfully that she wants to live, and resists the treatment plan. Standard practice asks the surrogate to exercise substituted judgement — to ask what she would have wanted, not what is best for her now, and not what she now says. Whatever the practice presupposes, it presupposes that the content demented woman's present utterance loses to a sentence she uttered years ago.

  Fourth, the psychiatric variant. In a number of jurisdictions a person with recurrent psychosis can execute a clause consenting in advance to admission and medication during a future episode, including medication they will refuse at the time — the earlier self authorises the coercion of the later self. I do not need the jurisdictional details and I would rather you not depend on them. My question is comparative: in the psychiatric case the later refusal is discounted because it is taken to be the product of an impaired episode, whereas in the dementia case the later refusal is discounted without, I think, any claim that the person is not still a competent-enough agent with genuine present welfare. If those two cases are justified differently, then the practice is not one thing.

  Here is what I want from you. Set out the implicit theory the practice needs, adjudicating between at least these families, which I will name in my own terms so we can avoid the literature: (a) a continuity or identity view, on which the earlier instruction binds because the later patient is, or is continuous enough with, the person who signed, and it is that relation that carries the authority; (b) a will-based or agency view, on which the authority is the authority of an act of will — a standing exercise of self-government, on the model of a promise, a trust, or an authorisation to an agent — and does not depend on any claim about who the later patient is; (c) a side-constraint or jurisdictional view, on which the practice is not really honouring the earlier self at all but enforcing a right against bodily interference whose content is fixed by the last competent expression; and (d) an instrumental view, on which the point is predictive accuracy, fewer family conflicts, and less burdensome bedside deliberation. Then tell me which of these the practice strictly presupposes, which it merely fits comfortably with, and which it rules out. In particular: does the practice require anything like a psychological-continuity account of identity, or would a biological or animalist account license it just as well? Is it consistent with a view on which the demented patient is no longer the same person as the signer?

  Then use the four features as tests rather than illustrations. Does the refusal/request asymmetry tell against the will-based view — is a will that can only say no really a will? Does the answerability condition tell against any view on which authority is supposed to track the persistence of the will? Does the psychiatric variant show that the earlier self has authority to coerce, or only that the later self's refusal is judged defective — and if the latter, what is doing the work in the dementia case? And be explicit about where the practice is silent: about the content of directives, about how much the signer must have understood, about what to do with a directive that the person would almost certainly have revised.

  Finally, two probes. Suppose a jurisdiction enforced an escalator clause, in which the signer stipulates that any later objection to the directive is itself to be treated as evidence of impaired judgement and disregarded. Does your reconstruction permit or forbid that clause, and with what justification? And suppose a jurisdiction required reaffirmation in light of a structured encounter with people actually living in the relevant condition, on the grounds that most signers badly misimagine it. Would the theory you have reconstructed make that requirement mandatory, optional, or incoherent — and would the practice as we have it look unjustified if it lacks such a requirement? Close by saying what would concretely have to change in clinical practice if we replaced the presupposed view with a view on which authority tracks present welfare rather than a past will.
reasoning: |-
  Hmm, this is a deep and complex query from a PhD student working on advance directives and personal identity. They're asking me to reconstruct the implicit theory behind the practice where earlier medical instructions bind later incompetent patients. I need to approach this carefully as a professional philosopher specializing in ethics and personal identity.

  The student has outlined four key features that any reconstruction must account for: the timing paradox (authority emerges only when unrevisable), the refusal/request asymmetry, the dementia hard case, and the psychiatric variant comparison. They've also suggested four candidate views to evaluate: continuity/identity, will-based, side-constraint, and instrumental views.

  First, I should brainstorm candidate accounts. The identity view suggests persistence of the person carries authority, but struggles with the timing issue - why would identity-based authority vanish when competence remains? The will-based view treats directives as ongoing acts of will, but faces problems with the request/refusal asymmetry - why can't I will positive treatments? The side-constraint view focuses on bodily rights, which explains refusal strength but not why requests aren't binding. The instrumental view emphasizes practical benefits but can't explain why we override current welfare or wishes.

  Initially I'm drawn to a will-based account because it centers the person's agency, but the refusal/request asymmetry is problematic - if it's about willing, why can't I will positive care? The timing issue also challenges this view since we normally allow will-revision.

  For reconstruction, I'll need to develop a hybrid view: the practice treats directives as negative exercises of autonomy through bodily rights (explaining refusal strength), while positive requests remain subject to medical judgment. The timing makes sense because competence allows ongoing autonomy expression - the directive only "locks in" when competence lapses. In dementia cases, we honor the last competent expression of self, not because the demented person isn't "them," but because their current preferences don't reflect their enduring values.

  The psychiatric comparison shows different justifications: in psychosis we question the refusal's validity, in dementia we honor prior values despite current contentment. The practice doesn't require psychological continuity theories - a biological view could work if we see the directive as an extension of bodily autonomy.

  For the probes: an "escalator clause" would violate core principles by preventing revocation during competence. A reaffirmation requirement could be optional but not mandatory under this theory. If we switched to present welfare focus, we'd lose the distinctive binding force of directives - surrogates would decide based on current best interests rather than prior instructions.

  I'll organize this under clear headings to meet the 1200-word target while addressing all four features as tests. The key insight is that the practice protects negative autonomy through bodily integrity rights, not positive control over treatment.
answer: |-
  ## Reconstructing the Implicit Theory of Advance Directive Authority

  **Brainstorming Candidate Accounts**

  Several accounts of the earlier self's authority present themselves:

  1.  **Identity/Continuity View:** The later patient *is* the same person as the signer (or sufficiently continuous with them). The directive binds because it expresses the authentic will *of that persisting person*. Authority stems from identity/continuity; the later self is bound by the prior commitment of the *same* enduring self. This initially seems attractive as it grounds authority directly in the person whose life and body are at stake, offering a robust basis for overriding present wishes or welfare judgments. It resonates with intuitions about respecting the person’s "true" or "enduring" self.

  2.  **Will-Based/Agency View:** The directive is an exercise of autonomous agency – akin to a promise, trust, or standing authorization. Its authority derives from the normative force of the *act* of will itself, creating a commitment or binding instruction that persists independently of the signer's subsequent state. This view emphasizes self-governance across time, prioritizing the signer's settled choice over fleeting later states. Its appeal lies in honoring autonomy as an active, temporally extended capacity.

  3.  **Side-Constraint/Jurisdictional View:** The practice enforces a negative right against bodily intrusion. The directive fixes the *content* of that right at the moment of the last competent expression. Authority resides not in the earlier self *per se*, but in the *right itself*, whose boundaries are defined by the most recent competent stipulation. This explains refusal strength well and avoids deep metaphysical commitments about the person over time.

  4.  **Instrumental View:** The practice is justified by its consequences: increasing the likelihood that treatment aligns with the patient's *likely* wishes, reducing family conflict, easing burdens on surrogates and clinicians, and promoting efficient decision-making. The directive is a proxy, not a binding expression of an authoritative self. This is pragmatically appealing but struggles to justify overriding present welfare or explicit contemporaneous refusal.

  **Initial Attraction and Challenge:** The **Will-Based View** is initially most attractive. It centers the signer's autonomy and deliberate choice, treating the directive as a genuine exercise of self-determination meant to govern future states. It seems to capture the *intentionality* and *normativity* central to the practice.

  However, the **refusal/request asymmetry** poses a severe challenge. If the authority stems purely from an autonomous act of will, why does the will have the power to veto treatment but not to demand it? A will that can only say "no" seems truncated and unlike paradigmatic acts of will (contracts, promises, authorizations) which typically bind reciprocally or enable action. This asymmetry suggests the authority might be rooted in something other than pure willing – perhaps a foundational right to refuse bodily intrusion.

  **Reconstruction of the Implicit Theory**

  The practice implicitly relies on a **hybrid view, primarily combining elements of the Will-Based and Side-Constraint views, with the Side-Constraint element providing the foundational structure and explaining key asymmetries**. The core presupposition is that **competent individuals possess an inviolable right to bodily integrity, which includes the right to refuse any medical intervention.** The directive's authority flows primarily from its role in **fixing the content of this negative right against unwanted bodily intrusion at the moment of last competent expression.**

  1.  **The Foundational Right:** The bedrock is the ongoing right to refuse treatment. This right persists even if the person loses decision-making capacity. It is not created by the directive; the directive *specifies its scope* for the period of incapacity.
  2.  **The Will-Based Exercise:** The act of creating an advance directive is a specific, future-oriented exercise of the autonomy inherent in possessing this right. It is an act of will *informing others* what constitutes an unwanted intrusion *during future incapacity*. This act is respected *because* it defines the boundaries of the foundational bodily right.
  3.  **The Trigger of Authority:** Authority attaches not when the will is expressed, but when the *condition justifying the exercise of the right on the patient's behalf* arises: namely, the loss of capacity to *contemporaneously* exercise the right. The right exists, but the directive becomes the sole competent specification of its content *for the period of incapacity*.
  4.  **The Asymmetry Explained:** This hybrid view cleanly explains the refusal/request asymmetry.
      *   **Refusal:** A refusal directive defines what constitutes an *unwanted intrusion*. Honoring it directly enforces the negative right to bodily integrity fixed by the last competent expression. This grounds its near-absolute force.
      *   **Request:** A request directive does *not* create an enforceable positive right to receive specific treatment. Clinicians retain independent professional obligations (beneficence, non-maleficence, resource allocation) and cannot be compelled to provide non-indicated or futile care. The directive might *inform* judgments about what is beneficial or wanted, but it cannot *compel* action violating professional norms in the way a refusal compels *inaction* to avoid violating bodily integrity. The act of will governs refusal because refusal defines the core right; it does not govern requests because requests demand positive action beyond the scope of that core right.
  5.  **The Answerability Condition Explained:** This view explains the timing paradox.
      *   While competent, the person *retains the capacity to exercise their right contemporaneously*. Their current expression *is* the competent specification of their right. Any prior directive is merely *evidence* of their wishes, superseded by their present, competent exercise of autonomy regarding their body. The foundational right is being exercised *now*.
      *   Only upon losing capacity does the prior specification become the *operative definition* of the unwanted intrusions the right protects against, precisely because contemporaneous exercise is impossible. The authority arises from the *need to respect the right during incapacity*, using the last competent stipulation as its guide. The unrevisability is a consequence of the incapacity, not the source of authority. It's not that the dead hand rules; it's that the living body retains its right, defined by the last competent voice.
  6.  **The Hard Case (Dementia) Explained:** The practice presupposes that the demented patient **is the same person (in a morally relevant sense) as the signer**.
      *   The directive binds *because* it specifies the bodily integrity rights *of this person* during incapacity. The surrogate employs substituted judgment to determine what *this person* (as defined by their last competent values and wishes) would choose now, overriding the current expressions of the demented self.
      *   The discounting of the current "cheerful" refusal isn't primarily because it's irrational *per se* (as in psychiatry), but because it is judged *not to reflect the enduring values and settled preferences* that defined the person's competent conception of unwanted intrusion. The practice presupposes that the person persists, but that their *current* expressions during dementia may not authentically represent the values governing their right to refuse treatment. The authority lies with the last competent articulation of those values regarding bodily integrity. The biological/animalist account *can* license this if it recognizes that the same biological entity possesses the foundational right, and the directive specifies its scope. However, the practice's reliance on *substituted judgment* (asking "what *would* they have wanted?") strongly suggests an implicit commitment to the *psychological perspective* of the signer as defining the relevant interests. A pure biological view might struggle to justify overriding present biological welfare (e.g., contentment, survival instinct) based on past psychological states. The practice leans towards a psychological-continuity view where the *enduring values* expressed competently define the person's authentic will regarding their body, even if continuity is now minimal.
  7.  **The Psychiatric Variant Explained:** This reveals a distinct justification, highlighting the hybrid nature of the standard practice.
      *   In the psychiatric case, the justification for overriding the contemporaneous refusal is **epistemic and competence-based:** the refusal *during the episode* is judged to be *incompetent* – a product of the impairing illness. It is therefore not a valid exercise of the right to refuse. The advance directive provides evidence of the person's *competent* wishes, which are given effect *because* the current refusal is deemed invalid. Coercion is justified by the *defect* in the current refusal and the directive's evidence of competent preference.
      *   In the dementia case, the justification is **jurisdictional and rights-based:** the current expression, while perhaps "competent-enough" for simple preferences (wanting to live, being cheerful), is *not* necessarily discounted because it's incompetent *in general*. It is discounted because the practice presupposes that the *specification of the foundational bodily integrity right* was *fixed* by the last competent expression. The demented patient's current wish *can* be a valid expression of *some* preferences, but it cannot *revoke* the prior competent specification of what constitutes an unwanted bodily intrusion for *this person*. The work is done by the prior fixation of the right's content, not by invalidating the current utterance. The demented patient is still the rights-bearer, but the *content* of their right to refuse was defined when they were last competent to define it authoritatively.

  **Adjudicating the Candidate Views**

  *   **Strictly Presupposed:** The practice **strictly presupposes the Side-Constraint/Jurisdictional view regarding the negative right to bodily integrity** as its core foundation, combined with the **Will-Based view concerning the act of specifying the content of that right for future incapacity**. It also **strictly presupposes the persistence of the person (in a morally relevant sense)** from signer to patient, as the bodily right endures with the same entity. An account where the demented patient is *not* the same person as the signer **rules out the practice as currently understood**. If they are different persons, the directive cannot bind the later person's right to bodily integrity; it would be instructions from a stranger.
  *   **Comfortably Fits With:** The practice fits comfortably with a **psychological-continuity view of identity/persistence**, especially due to the reliance on substituted judgment probing values and beliefs. It is less comfortable, though perhaps not strictly ruled out, with a pure biological/animalist view, as such a view struggles to explain why past psychological states should override present biological welfare/sentience *unless* tied to the foundational bodily right argument.
  *   **Ruled Out:** A pure **Instrumental View** is **ruled out** as the *justification* for the binding nature. While the practice may *have* good consequences, they are not why the directive overrides contemporaneous welfare or refusal. If predictive accuracy were paramount, we'd weigh current expressions heavily. The core justification is deontological, based on rights and prior autonomous specification. A pure **Identity/Continuity View** (without the rights/will specification element) struggles with the asymmetry and timing. Identity alone doesn't explain why the earlier self's will binds only once unrevisable; if the same person exists while competent, why doesn't the directive bind then too? The rights/will specification framework is necessary.

  **Addressing the Probes**

  1.  **The Escalator Clause:** The reconstructed theory **forbids** an escalator clause. The core justification relies on the directive specifying the right *during incapacity*. **While competent, the person retains the full authority to exercise their right to bodily integrity contemporaneously.** An escalator clause would illegitimately attempt to restrict the exercise of that core right *during competence* by pre-judging the competence of future revocations. It violates the answerability condition's core principle: the competent self *always* has the final say over their own body. The authority of the directive only emerges *after* the competence required for contemporaneous exercise is lost.
  2.  **Reaffirmation Requirement:** The reconstructed theory makes such a requirement **optional but not mandatory**. The theory presupposes that the *last competent expression* defines the right's content. It does not presuppose that this expression was optimally informed or immune to misconception. The normative force comes from the *autonomous exercise of the right to specify* at the competent time, not from the accuracy of the prediction. Jurisdictions could *permissibly* require structured encounters to promote better-informed directives (aligning with autonomy's conditions), but the core theory of binding authority does not *demand* it. The practice as it stands (without such a requirement) remains justified under the theory, as it still respects the competent choice made with the understanding the signer *had* at the time. However, such a requirement could be seen as enhancing the *quality* of the autonomous expression being respected.

  **Consequences of Shifting to Present Welfare**

  If the presupposed view were replaced by one where authority tracks **present welfare** rather than the past will/fixed right:
  1.  **Directives Become Merely Advisory:** Advance refusals would lose their binding force. Clinicians and surrogates would be obligated to provide treatment deemed in the *current* best interests of the patient, even if explicitly refused in advance. The patient's current state (e.g., apparent contentment in dementia) would trump prior refusal.
  2.  **Substituted Judgment Weakens:** The focus for surrogates would shift decisively from "What would *they* have chosen?" to "What is best for them *now*?" Prior expressed values might inform welfare judgments but wouldn't govern them.
  3.  **The Asymmetry Crumbles:** The strong force of refusals would vanish. Requests might gain slightly more weight if seen as evidence of what promotes welfare, but would still be subordinate to current clinical judgment of benefit.
  4.  **The Answerability Condition Reverses:** Instructions given while competent would still be revisable, but once incapacity set in, *any* prior directive would hold no special authority compared to other evidence of welfare. Its force wouldn't increase upon incapacity.
  5.  **The Hard Case Resolves Differently:** The demented patient's cheerful desire to live would likely lead to life-saving treatment (e.g., amputation for gangrene), overriding the prior refusal based on avoiding life in dementia.
  6.  **Psychiatric Variant Might Persist (Differently):** Overriding refusal during psychosis might still be justified based on *current* incompetence and the *current* welfare interest in treating the acute illness to restore competence. The advance directive would serve as strong evidence of competent preference, but the primary justification would be the patient's *current* best interests and incompetence, not the binding force of the prior authorization.

  In essence, replacing the presupposed view with present welfare prioritization would fundamentally alter the practice, shifting it from respecting prior autonomy regarding bodily integrity to a more paternalistic focus on current well-being as judged by others. The distinctive binding force of the advance refusal, grounded in the fixed negative right, would dissolve.
