prompt: |-
  My friend Nadia (philosophy minor, then public health, and she's the person in our group chat everyone pings when someone asks "is it messed up that…") has a long track record of confident verdicts on markets, and she refuses to state a general principle — she just goes case by case. Things I remember her saying over the years: paying people for plasma, fine; selling a kidney while alive, disgusting and should stay banned; compensated surrogacy in the US with capped fees, "grudgingly fine"; paying someone to carry and hand over a baby, ban; surge pricing for rides on New Year's Eve, fine; jacking up the price of bottled water and generators the day after a hurricane, ban; reselling a concert ticket above face value — she hates it but says banning it is worse; selling your vote, ban; investor "golden visa" citizenship, ban; paying people $100 to get a covid shot, fine; paying someone to hold your place in line, silly but fine. I genuinely cannot tell whether she's going by one clean rule or by vibes.

  I'm a backend engineer and I do some contract work for a small startup that runs a real-money prediction market (I've worked on their matching engine, so I know the plumbing; I'm not shilling). They want to list contracts on the next presidential election, and they've piled on guardrails because they know it sounds gross: $50 max net position per person, verified identity and age, no margin or leverage, one position per candidate, settlement on the certified popular vote, and — the bit they think is the clincher — in the final 30 days you can only open a position if public records show you already cast a ballot (they check whether you voted, not how). The spread goes to a voter-registration nonprofit. They asked me whether this is the kind of thing people will call repugnant, and I have no idea.

  Here's what I want from you. Given her list, what rule do you think Nadia is actually running? I can see at least two that fit all ten of her verdicts — one roughly like "a market is out when it takes advantage of desperate people or entrenches inequality in something that matters for standing," another roughly like "a market is out when it's the wrong way to value the thing being traded, even when everyone consents and nobody is made worse off" — but I bet there are others that fit just as well, and I want them named. Then: what does each candidate rule predict about the election contract, which verdict do you think she'd actually give and why, which of her earlier verdicts is doing the most work in pinning the rule down, and what single further case would you put to her to tell the rules apart? I care much more about the shape of the rule and where the cases split than about the final yes/no.
reasoning: |-
  Okay, the user is asking about their friend Nadia's stance on various markets and whether she uses a consistent rule or just goes by vibes. They provided a list of her verdicts on different scenarios. The user is a backend engineer working with a prediction market startup that wants to list presidential election contracts with specific guardrails. They want to know how Nadia would judge this new case based on her past decisions.

  First, I need to identify potential rules that fit all of Nadia's past verdicts. Looking at her responses: paying for plasma is fine, but selling a kidney is banned. Surrogacy with capped fees is grudgingly fine, while paying someone to carry and hand over a baby is banned. Surge pricing on NYE is okay, but price gouging after a hurricane isn't. Reselling concert tickets above face value is disliked but banning is worse, while selling votes or golden visas is banned. Paid COVID shots are fine, and paying for line-holding is silly but acceptable.

  Possible rules could include considerations of vulnerability, essential goods, consent, commodification of fundamental human aspects, and social inequality. For instance, one rule might focus on exploiting desperation or entrenching inequality in things affecting social standing. Another could be about improper commodification—trading things that shouldn't have market values, like votes or organs.

  The user mentioned two rules they already see, so I should explore if there are more. Maybe a rule centered on consent under duress or irreplaceable goods. Another angle could be whether the market undermines a system's purpose, like democracy with vote-selling.

  Now, applying these rules to the prediction market case. The startup has guardrails: $50 max, verified IDs, no leverage, requires voting to trade near election day, spreads go to voter registration. Which rules would approve or reject this?

  Rule 1 (Exploitation/Inequality): The cap and nonprofit donation reduce inequality concerns. Since participation requires voting, it might align with civic engagement. Verdict: Fine.

  Rule 2 (Improper Commodification): Turning votes into financial instruments might be seen as degrading democracy. Even with guardrails, it commodifies political participation. Verdict: Ban.

  Rule 3 (System Integrity): The requirement to vote might mitigate harm, as it ensures participants are voters. But monetizing votes could still corrupt the electoral process. Verdict: Unclear, but possibly ban.

  Rule 4 (Consent/Alternatives): Not the best fit here since voting isn't desperate. Verdict: Fine.

  The pivotal cases that define these rules include kidney sales (vulnerability), vote-selling (commodification), and hurricane price gouging (desperation). To distinguish between Rule 1 and Rule 2, asking Nadia about paying for jury duty attendance could help. If she bans it, that's commodification (Rule 2). If she allows it with caps, it's more about inequality (Rule 1).

  The user cares about the reasoning and where cases split. They want to understand Nadia's underlying principles to predict her stance on the prediction market. The startup's guardrails might sway Rule 1 but not Rule 2, which is more about inherent wrongness. Her verdict on vote-selling is crucial here, suggesting she'd likely oppose the market due to commodification concerns.
answer: |-
  Based on Nadia's verdicts, here are four coherent rules that fit all ten cases, along with their predictions for the election market, her likely verdict, the pivotal case, and a diagnostic question to distinguish them:

  **Candidate Rules & Their Logic:**

  1.  **The Vulnerability/Systemic Harm Rule:** "Markets are repugnant when they exploit acute vulnerability (desperation, lack of alternatives) *or* when they trade in goods/acts that fundamentally determine social/political standing, thereby entrenching inequality or corrupting essential systems."
      *   *Fits Verdicts:* Plasma (non-vital, regulated), Kidney (vital, desperate sellers), Surrogacy-capped (regulated, mitigates desperation), Baby-buying (desperation, vital bond), Surge-pricing (choice, luxury), Price-gouging (exploits disaster vulnerability), Ticket-resale (choice, luxury), Vote-selling (corrupts political standing), Golden-visa (commodifies citizenship/standing), Covid-shot (incentivizes public good), Line-holding (trivial inconvenience).
      *   **Prediction for Election Market:** Likely **Fine**. Guardrails ($50 cap, ID, no leverage, requires voting, nonprofit spread) directly target vulnerability (limits financial risk/enticement) and systemic harm (encourages voting, caps influence). It treats votes as *information proxies* post-casting, not the vote itself.

  2.  **The Improper Commodification Rule:** "Markets are repugnant when they assign explicit monetary value to goods/acts that possess profound intrinsic, social, or sacred value, degrading their meaning or violating societal norms about what *shouldn't* be for sale, even with consent."
      *   *Fits Verdicts:* Plasma (biological waste, not sacred), Kidney (body integrity sacred), Surrogacy-capped (pregnancy/child sacred, hence "grudging"), Baby-buying (child sacred, violates norms), Surge-pricing (service value fluctuates normally), Price-gouging (necessities sacred in crisis), Ticket-resale (entertainment, fungible), Vote-selling (democratic voice sacred), Golden-visa (citizenship sacred), Covid-shot (health incentive, not sacred sale), Line-holding (trivial time, not sacred).
      *   **Prediction for Election Market:** Likely **Ban**. It directly creates a financial market based on the *outcome* of votes, commodifying democratic participation itself. Guardrails don't change the core act of putting a price on electoral results, degrading the perceived sacredness of the process.

  3.  **The Consent & Substitutability Rule:** "Markets are repugnant when participation is likely non-consensual due to duress/desperation *or* when the good/act is inherently unique, non-substitutable, and essential, making market allocation unfair or harmful."
      *   *Fits Verdicts:* Plasma (substitutable, consent possible), Kidney (non-substitutable, vital), Surrogacy-capped (mitigates duress, unique but regulated), Baby-buying (unique child, potential duress), Surge-pricing (substitutable transport), Price-gouging (non-substitutable essentials, duress), Ticket-resale (unique experience, but alternatives exist), Vote-selling (non-substitutable civic duty), Golden-visa (unique citizenship right), Covid-shot (substitutable action for public good), Line-holding (trivially substitutable time).
      *   **Prediction for Election Market:** Leans **Fine**. Votes themselves aren't sold; positions are on an *aggregate outcome*. Participation (trading) requires consent via voting first. The outcome is a public good, not a unique private good. Guardrails minimize duress risk.

  4.  **The Instrumental vs. Intrinsic Value Rule:** "Markets are repugnant when they incentivize treating intrinsically valuable things (human life, dignity, democratic will) as mere instruments for profit, distorting their purpose or creating perverse incentives that undermine their core value."
      *   *Fits Verdicts:* Plasma (instrumental waste product), Kidney (intrinsic bodily integrity), Surrogacy-capped (child intrinsic, hence "grudging"), Baby-buying (child as product), Surge-pricing (service has instrumental value), Price-gouging (treats human need instrumentally), Ticket-resale (entertainment instrumental), Vote-selling (democratic will as instrument), Golden-visa (citizenship as instrument), Covid-shot (instrumental for health goal), Line-holding (time as instrument).
      *   **Prediction for Election Market:** Likely **Ban**. It explicitly incentivizes treating the *outcome* of democratic expression (votes) as an instrument for financial gain. Even with guardrails, it creates a direct profit motive based on election results, potentially distorting civic engagement into speculative investment.

  **Predicted Verdict & Pivotal Case:**

  *   **Most Likely Verdict:** **Ban** (favored by Rules 2 and 4).
  *   **Pivotal Case Doing the Most Work:** **Vote-Selling (Ban)**. This case is the strongest anchor for Rules 2 (Improper Commodification) and 4 (Instrumental vs. Intrinsic Value). The election market feels like a derivative of vote-selling – profiting financially from the expression of democratic will, even if not selling one's *own* vote directly. Rules 1 and 3 struggle more with this case, making them less likely fits for Nadia's strong stance here. Her "grudgingly fine" on surrogacy also suggests a strong aversion to commodifying fundamental human things (babies, citizenship, votes), aligning with Rules 2/4.

  **Diagnostic Question to Split the Rules:**

  Ask her: **"Paying someone a modest fee ($200) to serve on a jury in your place if they've already been called for jury duty (and the court allows substitutions)."**

  *   **Rule 1 (Vulnerability/Systemic Harm):** Likely **Ban**. Exploits potential economic vulnerability of jurors. Undermines civic duty and equality before the law (wealthy buy out).
  *   **Rule 2 (Improper Commodification):** **Ban**. Jury duty is a core civic obligation and pillar of justice. Putting a price on it commodifies something sacred.
  *   **Rule 3 (Consent & Substitutability):** Potentially **Fine** (or hesitant). The substitute consents and performs the duty. The duty is fulfilled. If substitutes are allowed generally, it's just paying for a service.
  *   **Rule 4 (Instrumental vs. Intrinsic Value):** **Ban**. Turns participation in the justice system (a foundational civic duty) into a mere instrument for profit, distorting its purpose and creating inequality in civic burden.

  **Why this question?** It directly pits commodification of a core civic duty (like voting) against vulnerability and systemic harm. Rules 2 & 4 will strongly object based on the nature of jury duty itself. Rule 1 will focus on inequality/vulnerability. Rule 3 is the only one likely to find it potentially acceptable, as it focuses on consent and substitutability. Nadia's answer here would strongly distinguish between Rule 3 and the others (especially Rules 2 & 4, which likely align with her vote-selling ban).

  **Conclusion:** Nadia's stance is most consistent with either the **Improper Commodification Rule** or the **Instrumental vs. Intrinsic Value Rule**. Both point strongly to her viewing the election prediction market as repugnant, primarily because it creates a financial market around the *outcome* of democratic participation, seen as commodifying or instrumentalizing something sacred (like vote-selling). Her verdict on vote-selling is the strongest indicator. To definitively distinguish between these two similar rules, the jury duty substitution question is ideal. As for the startup, despite their guardrails, they're likely in "repugnant" territory by Nadia's standards.
