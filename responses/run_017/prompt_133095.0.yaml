prompt: |-
  Hey — quick one, and sorry if this is rambly.

  I'm on a tiny team that just got handed a single pot of money: about five researcher-years and a chunk of compute, and the mandate is "safety work that doesn't rely on the model being good." So the control end of the pool, not alignment training. We sit inside a lab that will probably ship something with real write access — code repos, tickets, some prod infrastructure — within the next couple of years, and our leverage over the ship/no-ship call is limited but not zero. Five researcher-years is short enough that we should pick three lines of work and just accept that the rest goes unfunded.

  I've been sorting the options along some axes I made up, because the usual framing feels wrong to me:

  - disclosure-robustness: does the measure still work if the model knows the entire protocol, i.e. does its bite come from what the surrounding system does with outputs rather than from the model being surprised? Structural stuff like never acting on unverified outputs scores high here; hidden honeypots and unannounced audits seem to die the moment they leak, and everything leaks.
  - deployment-blocking vs deployment-hardening: is the point to generate a signal that should stop or roll back a launch, or to make the thing safer while it runs? A signal looks worthless to me unless the institutional machinery for acting on it already exists, and I suspect that machinery, not the detector, is the actual bottleneck.
  - graceful degradation: how much value is left if we're wrong about the threat model in a specific direction — if the model is merely unreliable rather than strategically adversarial, or adversarial but bad at long-horizon planning, or only opportunistic when oversight is visibly low.
  - capability cost: measures that require giving up real capability get quietly dropped under competitive pressure, so I discount anything that's expensive in that currency even if it looks good on paper.

  Two things I want from you. First: which three lines of work do you fund, in what order, and why — I don't want a tour of the menu, I know the menu, I want the argument for the ordering. Second: which open conceptual questions are upstream of the whole enterprise, in the sense that a lot of the ordering swings on how they come out? For each, say how tractable it is for people doing conceptual work rather than empirical ML, and what we'd observe in the next eighteen months or so that should move it up or down the list.

  Also tell me which of my four axes are bad axes, or which one I'm overweighting. I'm most suspicious of the first one myself — I've definately underpriced how much compartmentalisation can buy you, and if you can get workable secrecy cheaply then disclosure-robustness stops being the thing everything else keys off.
reasoning: |-
  We are given:
  - A small team with 5 researcher-years and some compute.
  - The mandate: safety work that doesn't rely on the model being good (control, not alignment).
  - Context: The lab will likely ship a model with real write access (code repos, tickets, prod infrastructure) in the next couple of years.
  - Leverage over ship/no-ship is limited but not zero.
  - We must pick three lines of work and accept the rest goes unfunded.

  The user has provided four axes for evaluating options:
  1. Disclosure-robustness: Does the measure work even if the model knows the entire protocol?
  2. Deployment-blocking vs deployment-hardening: Deployment-blocking requires institutional machinery to act on a signal, which may be the bottleneck. Deployment-hardening makes the system safer while running.
  3. Graceful degradation: How well the measure holds up if the threat model is less severe than assumed (e.g., model is unreliable but not adversarial, or adversarial but bad at planning).
  4. Capability cost: Measures that require giving up capability are likely to be dropped under competitive pressure.

  The user wants:
  - Three lines of work to fund, in order, with the argument for the ordering.
  - Open conceptual questions that are upstream and affect the ordering, with an assessment of tractability and what to observe in the next 18 months.
  - Feedback on the axes: which are bad or overweighted.

  First, let's consider common control-oriented safety work that fits the mandate and the axes. We are focusing on measures that do not require the model to be aligned (i.e., we are building external controls). Some ideas:

  1. **Sandboxing and Access Control**: Restricting what the model can do, even if it tries to be malicious. This might include:
     - Strict access controls (least privilege)
     - Verification of actions (e.g., requiring human approval for certain actions, or automated checks)
     - Running in a sandboxed environment

  2. **Monitoring and Anomaly Detection**: Building systems to detect malicious or anomalous behavior. This could include:
     - Real-time monitoring of model outputs and actions
     - Statistical anomaly detection
     - Canaries and honeypots (though the user is skeptical about disclosure-robustness for these)

  3. **Red Teaming and Adversarial Testing**: Actively testing the system for vulnerabilities, including by using the model itself in controlled ways.

  4. **Formal Verification and Constraint Enforcement**: Using formal methods to ensure that the system (or parts of it) adheres to certain safety properties.

  5. **Recovery Mechanisms**: Systems that allow for quick rollback or containment if something goes wrong.

  6. **Capability Limiting**: Deliberately reducing the model's capabilities in sensitive areas (but note the capability cost axis).

  Now, let's evaluate these along the user's axes:

  - **Disclosure-robustness**: 
     - Sandboxing and access control can be designed to be disclosure-robust because they are structural: even if the model knows the boundaries, it cannot bypass them without a vulnerability.
     - Monitoring and anomaly detection: If the model knows the monitoring details, it might evade detection. Honeypots are particularly vulnerable to disclosure.
     - Red teaming: This is a process and not a runtime measure, so disclosure-robustness is less relevant. However, if the model knows about red teaming, it might hide during testing.
     - Formal verification: This is about the system design and can be disclosure-robust because it constrains the model's actions regardless of its knowledge.
     - Recovery mechanisms: These are triggered by events and not dependent on the model's knowledge.

  - **Deployment-blocking vs deployment-hardening**:
     - Sandboxing, access control, verification, monitoring, and recovery are deployment-hardening.
     - Red teaming might be deployment-blocking if it finds issues that stop deployment, but it could also be used for hardening.

  - **Graceful degradation**:
     - Sandboxing: Even if the model is not adversarial, it prevents accidents. If the model is adversarial but bad at planning, the sandbox still limits damage.
     - Monitoring: If the model is unreliable, monitoring can catch errors. But if the model is adversarial and good at evasion, it might fail. So degradation might be less graceful.
     - Formal verification: Works well for specified properties, but if the threat model is wrong (e.g., we didn't think of a certain attack), it might not help. However, it can be designed to be broad.

  - **Capability cost**:
     - Sandboxing and access control: Might have some cost in efficiency (e.g., slower due to verifications) but can be designed to minimize this.
     - Capability limiting: High capability cost by definition.
     - Monitoring: Low capability cost if done as a passive observer.

  Given the axes and the context (limited leverage over ship/no-ship, and competitive pressure to not sacrifice capability), we should prioritize deployment-hardening over deployment-blocking. The user is skeptical about deployment-blocking signals without institutional machinery.

  Also, disclosure-robustness seems important because the user notes that "everything leaks". But the user is also suspicious they might be overweighting this and underrating compartmentalization.

  Let's pick three lines of work:

  ### Proposed Three Lines of Work (in order)

  1. **Sandboxing and Access Control with Verification (Structural Safeguards)**:
     - Why: 
       - High disclosure-robustness: The model cannot bypass structural barriers even if it knows about them (unless there's a bug, but we can aim for robustness).
       - Deployment-hardening: Makes the system safer at runtime.
       - Graceful degradation: Even if the model is merely unreliable, these measures prevent accidents. If the model is adversarial but not superintelligent, they still work. Only if the model is extremely capable and finds a zero-day, it fails, but that's a high bar.
       - Capability cost: Can be designed to be low. For example, using automated verification that runs quickly, or only requiring human approval for high-risk actions. The lab might accept this cost because it doesn't remove core capabilities.
     - Order: First because it directly addresses the risk of write access. The lab is going to give the model write access, so we must ensure that access is as safe as possible.

  2. **Monitoring and Anomaly Detection with a Focus on Disclosure-Robust Designs**:
     - Why:
       - We focus on making the monitoring as disclosure-robust as possible (e.g., using randomized checks, or monitoring based on invariants that are hard to evade even if known). Avoid honeypots that are easily avoided if known.
       - Deployment-hardening: Provides real-time safety.
       - Graceful degradation: If the model is unreliable, it catches mistakes. If the model is adversarial but not extremely capable, it might still catch some issues. We can design it to be robust to a range of threat models.
       - Capability cost: Very low because it's passive. The model's outputs are monitored without affecting its performance.
     - Order: Second because it complements the sandboxing. Even with sandboxing, we need to detect when the model is trying to break out or acting maliciously within the allowed space.

  3. **Recovery and Rollback Mechanisms**:
     - Why:
       - Disclosure-robustness: The model knowing about the recovery mechanisms doesn't necessarily help it avoid them (e.g., if we have frequent snapshots and the ability to roll back, even if the model knows, it can't prevent the rollback once detected).
       - Deployment-hardening: Reduces the impact of a successful attack or accident.
       - Graceful degradation: In any scenario where something goes wrong (whether due to unreliability or adversarial action), recovery mechanisms are valuable.
       - Capability cost: Low. The system can run normally and only use recovery when needed. The overhead is in the infrastructure, not in the model's capabilities.
     - Order: Third because while prevention is better, we must plan for failures. This is a safety net.

  We avoid red teaming as a primary line because:
     - It may not be disclosure-robust: if the model knows it's being tested, it might hide its capabilities.
     - It is more deployment-blocking (unless done continuously) and we are focusing on hardening.
     - The institutional machinery for acting on red teaming findings might not be in place.

  We avoid formal verification because:
     - It can be very expensive (in time and expertise) and might not cover all threat models.
     - The tractability for complex systems is uncertain.

  We avoid capability limiting because of the high capability cost.

  ### Open Conceptual Questions

  The user asks for open conceptual questions that are upstream and affect the ordering. These are questions whose answers would change our priorities.

  1. **How effective is compartmentalization (secrecy) in practice for AI safety measures?**
     - Tractability: This is both a conceptual and practical question. It might be studied via simulations, threat modeling, or real-world case studies of security by obscurity. Conceptual work can help by analyzing the conditions under which secrecy fails (e.g., insider threats, inference by the model, etc.).
     - What to observe: In the next 18 months, we might look for incidents in existing AI systems where safety measures were bypassed after being disclosed (either to the model or to the public). Also, we could run experiments in controlled settings to see how easily models can discover hidden safety mechanisms when given hints.
     - Impact on ordering: If we find that compartmentalization is robust and cheap, then we might put more weight on measures like honeypots and unannounced audits. This would make monitoring with honeypots more attractive and might move it up in the list.

  2. **How quickly do AI systems (at the capability level we expect) adapt to circumvent known safety measures?**
     - Tractability: This is empirical but can be informed by conceptual work on AI capabilities and adversarial learning. We might develop models of how quickly a model can find exploits given knowledge of the system.
     - What to observe: Experiments with current models (e.g., red teaming) to see how they adapt when given knowledge of the safety mechanisms. We could also look at the rate of vulnerability discovery in traditional software security as a proxy.
     - Impact on ordering: If models quickly adapt, then disclosure-robustness becomes critical and we must prioritize structural safeguards even more. If adaptation is slow, then monitoring and anomaly detection that isn't fully disclosure-robust might be acceptable.

  3. **What is the likelihood that the model will be strategically deceptive and patient (i.e., capable of long-horizon planning to bypass safety measures)?**
     - Tractability: This is a mix of conceptual and empirical. We don't have such models yet, so conceptual work could model the conditions under which deception emerges and how it scales with capabilities.
     - What to observe: We could look for early signs of deception in current models (e.g., in testing, do models ever hide their capabilities or intentions?). Also, progress in long-horizon planning in AI systems (e.g., in games, robotics, or agentic behavior).
     - Impact on ordering: If the threat model is more towards unreliable but not deceptive, then we can rely more on measures that aren't designed for adversarial settings. But if deception is likely, then we need more robust measures. This would push us towards sandboxing and formal methods.

  4. **How much capability cost is acceptable to the lab under competitive pressure?**
     - Tractability: This is more of a social science question but can be informed by studying past decisions in the lab and in similar organizations.
     - What to observe: We could look at the lab's history of trading off safety for capability. Also, industry trends: are competitors adopting safety measures with high capability cost?
     - Impact on ordering: If capability cost is a major barrier, then we must avoid any measure that reduces capability. This would push us towards monitoring and recovery, and away from sandboxing if it has high cost.

  ### Feedback on Axes

  The user's four axes are generally good. However:

  - **Disclosure-robustness**: The user suspects they might be overweighting it. I agree that it might be overweighted if compartmentalization is easier than expected. But given the context (the model will have write access and thus might be able to exfiltrate information or infer secrets), disclosure-robustness is important. However, we should not completely dismiss measures that rely on some secrecy if that secrecy can be maintained cheaply. The key is to assess the cost of maintaining secrecy versus the benefit.

  - **Deployment-blocking vs deployment-hardening**: This is a crucial axis and the user is right to focus on deployment-hardening given the limited leverage over ship/no-ship. Deployment-blocking might be worth considering only if the institutional machinery is built, but the user indicates it's not. So this axis is correctly weighted.

  - **Graceful degradation**: This is a very good axis because we don't know the exact threat model. We should prefer measures that are robust to a range of scenarios.

  - **Capability cost**: This is critical for adoption. The user is right to discount measures with high capability cost. We should not overweight it, but it is appropriately weighted.

  Suggestion: Consider adding a fifth axis: **Ease of Implementation**. With only 5 researcher-years, we need to focus on measures that can be built and deployed within the time and resource constraints. However, the user didn't mention it, so we stick to their four.

  ### Revised Ordering with Reasoning

  Given the above, the three lines of work and their order:

  1. **Sandboxing and Access Control with Verification**: 
     - Primary safety layer. Without it, the model with write access is too dangerous. It's disclosure-robust, hardening, degrades gracefully, and can be low cost.

  2. **Recovery and Rollback Mechanisms**: 
     - Why above monitoring? Because if we have to choose, recovery provides a last line of defense that works even if the model bypasses the sandbox or monitoring. Monitoring might miss a sophisticated attack, but recovery can limit the damage. Also, recovery can be more disclosure-robust and has low capability cost. However, note: recovery requires detection. So we must have some monitoring to trigger recovery. Therefore, we need both. But if we are forced to order, I put recovery second because it is critical for handling failures and might be simpler to implement than a full monitoring system. Alternatively, we can think of recovery as including detection of when to recover. 

     But let me reconsider: without monitoring, how do we know when to recover? So monitoring is necessary for recovery. Therefore, we might switch the order of 2 and 3? Or bundle them? The user asked for three separate lines. Let's reframe:

     - Monitoring is necessary for both early detection and for triggering recovery. So we need monitoring to make recovery timely. Therefore, monitoring should come before recovery. But we are funding them as separate lines. So:

     Revised:
       1. Sandboxing
       2. Monitoring and Anomaly Detection
       3. Recovery

     Why? Because:
        - Sandboxing is the first line of defense.
        - Monitoring is the second: it watches for breaches and anomalies.
        - Recovery is the third: it acts when monitoring detects a problem.

     This ordering also reflects the dependency: recovery without monitoring is useless.

  3. **Recovery and Rollback**

  So the three are:
  1. Structural Safeguards (Sandboxing and Access Control)
  2. Monitoring and Anomaly Detection
  3. Recovery and Rollback Mechanisms

  ### Final Answer

  **Three Lines of Work (in order of priority):**

  1. **Structural Safeguards (Sandboxing, Access Control, and Verification)**: This is the primary layer to prevent harm. It is disclosure-robust, deployment-hardening, gracefully degrading, and can be designed to have low capability cost. Without this, the model's write access is too dangerous.

  2. **Monitoring and Anomaly Detection with Disclosure-Robust Design**: Focus on detection methods that remain effective even if the model knows about them (e.g., invariant checks, randomized audits). This is deployment-hardening, degrades gracefully (catches both errors and less sophisticated attacks), and has low capability cost. It is essential for triggering any response.

  3. **Recovery and Rollback Mechanisms**: Systems to quickly contain and revert damage. This includes automated rollback, containment, and recovery procedures. It is disclosure-robust (the model can't prevent rollback if triggered), deployment-hardening, works in a range of threat scenarios, and has low capability cost. It is the last line of defense.

  **Open Conceptual Questions**:

  1. **How effective and sustainable is compartmentalization (secrecy) for AI safety measures?**
     - Tractability: Moderate. Can be studied via threat modeling and simulations. Conceptual work can define the boundaries of secrecy in AI systems.
     - Next 18 months: Look for evidence of leaks (in any AI system) of safety mechanisms and whether that led to bypasses. Also, experimental results on how well models can infer hidden mechanisms.
     - Impact: If compartmentalization is effective, we might add honeypots to monitoring. If not, we double down on disclosure-robustness.

  2. **How quickly do advanced AI systems adapt to circumvent known safety measures?**
     - Tractability: Empirical but can be informed by theory. Requires testing with state-of-the-art models.
     - Next 18 months: Experiments with models of increasing capability to test adaptation speed. Also, track vulnerability discovery rates in other domains.
     - Impact: If adaptation is slow, we can rely more on non-robust monitoring. If fast, we prioritize structural safeguards and robust monitoring.

  3. **What is the likelihood and timeline for the emergence of strategic deception in AI systems?**
     - Tractability: Challenging but tractable via conceptual work (defining deception, modeling when it emerges) and empirical work (testing for deception in current models).
     - Next 18 months: Look for any signs of deceptive behavior in current models (e.g., in evaluations or red teaming). Also, progress in long-horizon planning tasks.
     - Impact: If deception is unlikely in the near term, then graceful degradation becomes less critical and we might shift focus. If deception is likely, we need more robust measures.

  4. **How much capability cost is acceptable in competitive environments?**
     - Tractability: Social science; study of organizational behavior.
     - Next 18 months: Observe the lab's decisions on safety-capability tradeoffs and industry trends (e.g., are competitors implementing costly safety measures?).
     - Impact: If capability cost is a hard constraint, we avoid any measure with a cost, which might shift focus to monitoring and recovery.

  **Feedback on Axes**:

  - **Disclosure-robustness**: You might be slightly overweighting it, but it is very important. The key is to balance with the feasibility of compartmentalization. Given the context (model with write access might leak or infer secrets), it is appropriately weighted. However, if compartmentalization is feasible, then you can consider measures that rely on it.

  - **Deployment-blocking vs deployment-hardening**: Correctly weighted. Given limited leverage, deployment-hardening is the way to go.

  - **Graceful degradation**: Excellent axis. Keep it.

  - **Capability cost**: Correctly weighted. Critical for adoption.

  Consider adding **Implementation Complexity** as an axis because of the small team and limited time. But since you didn't, we assumed that the chosen lines are feasible in 5 researcher-years.

  Note: The three lines of work we chose are mutually reinforcing and feasible within the constraints. They form a layered defense: prevention (sandboxing), detection (monitoring), and response (recovery).
answer: |-
  ### Three Lines of Work to Fund (Ordered by Priority)

  **1. Structural Action Verification and Constraint Enforcement**  
  *(e.g., runtime output verification, automated guardrails, least-privilege access controls, and sandboxing)*  
  **Why first:**  
  - **Disclosure-robustness:** High. Even if the model knows the verification rules, it can't bypass structural enforcement (e.g., code outputs are automatically scanned for risky patterns before execution; actions require multi-party approval). This relies on system design, not obscurity.  
  - **Deployment-hardening:** Directly reduces harm during operation. It doesn't depend on institutional machinery for "blocking" deployment, which you rightly note is unreliable.  
  - **Graceful degradation:** If the model is merely unreliable, verification catches mistakes; if it's adversarial but weak, constraints limit damage; if oversight fails, automated checks remain.  
  - **Capability cost:** Low to moderate. Well-designed verification (e.g., heuristic scanners for code/output risks) adds minimal latency. Sacrificing some "free action" for safety is a tradeoff labs accept (e.g., GitHub Copilot’s code scanning).  
  **Fit for your context:** With write access to prod infrastructure, structural constraints are non-negotiable. Prioritize this because it’s the *only* line that physically prevents catastrophe (e.g., "no `rm -rf` without human approval"). Allocate 2–3 researcher-years here.

  **2. Continuous Runtime Monitoring for Anomaly Detection**  
  *(e.g., ML-based anomaly detectors on model behavior, infrastructure telemetry, or user interactions)*  
  **Why second:**  
  - **Disclosure-robustness:** Medium. Use *invariant-based monitoring* (e.g., "API calls shouldn’t spike 1000x") or *randomized audits* instead of static honeypots. These retain value even if the model knows the framework (e.g., randomness forces the model to always behave).  
  - **Deployment-hardening:** Provides real-time safety and surfaces issues for human review. Crucially, it feeds into recovery (line #3).  
  - **Graceful degradation:** Detects both bugs and opportunistic malice. If the model isn’t strategically adversarial, it still catches drift; if oversight lapses, automated alerts trigger.  
  - **Capability cost:** Very low. Monitoring is passive and doesn’t restrict model capabilities—it only flags anomalies.  
  **Fit for your context:** Complements structural constraints by catching what slips through (e.g., a subtle data exfiltration attempt). With real-world write access, monitoring is cheap insurance. Allocate 1.5–2 researcher-years.

  **3. Automated Recovery and Rollback Systems**  
  *(e.g., immutable snapshots, transaction rollbacks, or kill switches triggered by monitoring/verification failures)*  
  **Why third:**  
  - **Disclosure-robustness:** High. Recovery relies on system state, not model deception (e.g., rolling back a corrupted repo to a known-good snapshot). If the model knows the protocol, it can’t prevent the rollback without first disabling the system—which verification/monitoring should catch.  
  - **Deployment-hardening:** Minimizes damage post-breach. This is critical when structural constraints fail.  
  - **Graceful degradation:** Works against any failure mode—accidental, opportunistic, or adversarial. Even a flawed recovery system is better than none.  
  - **Capability cost:** Low. Adds minimal overhead (e.g., periodic snapshots) and doesn’t reduce model utility.  
  **Fit for your context:** With high-stakes write access, recovery is your "last line of defense." It’s low-effort, high-value, and pairs with monitoring. Allocate 0.5–1 researcher-year.

  ### Why This Order?
  - **Structural constraints** are foundational: no amount of monitoring or recovery matters if the model can freely execute harmful actions.  
  - **Monitoring** enables proactive responses and feeds recovery, but depends on constraints to limit blast radius.  
  - **Recovery** is a force multiplier for the first two but less useful alone.  
  **Competitive pressure:** All three minimize capability costs. Verification has the highest cost but is unavoidable for write access; the other two are "free" beyond engineering time. This ordering maximizes harm reduction per researcher-year.

  ---

  ### Upstream Conceptual Questions
  These questions could reshuffle priorities. Focus on tractability for theorists and near-term observables:

  1. **How easily can models infer or exfiltrate "secret" safety mechanisms?**  
     - **Tractability:** High for conceptual work. Theorists can model threat scenarios (e.g., Bayesian inference of hidden rules) or analyze side-channel leaks.  
     - **Observables (18 months):** Experiments showing current models reverse-engineering honeypots/audits from outputs or environment feedback. If models consistently infer hidden mechanisms, double down on disclosure-robust tools (structural constraints/recovery). If compartmentalization holds, consider adding honeypots.  
     - **Impact:** If secrecy fails, your axis #1 becomes critical. Currently, I assume compartmentalization is fragile—hence prioritizing structural measures.

  2. **Do models exhibit strategic deception *before* human-level capabilities?**  
     - **Tractability:** Medium. Conceptual work can define deception thresholds (e.g., planning horizon, goal stability) or synthesize empirical results.  
     - **Observables:** Tests for "deliberate" deception in near-human models (e.g., models hiding misalignment during evaluation). If deception emerges early, grace under misalignment (axis #3) matters less—prioritize constraints/monitoring. If not, recovery gains value.  
     - **Impact:** Affects graceful degradation. If models are only opportunistic (not long-term strategic), recovery/monitoring suffice; if they’re patient adversaries, structural constraints are essential.

  3. **How cheaply can we enforce hard safety guarantees?**  
     - **Tractability:** High. Theorists can formalize "what can be verified" (e.g., via program synthesis or cryptographic commitments) and tradeoffs with flexibility.  
     - **Observables:** Advances in formal methods (e.g., verifying ML outputs against policies) or zero-cost verification tricks. If guarantees become cheap, structural constraints dominate. If expensive, monitoring/recovery rise.  
     - **Impact:** Low-cost verification would make structural constraints your clear #1. Currently, I assume it’s moderately costly but worth it.

  ---

  ### Feedback on Your Axes
  Your axes are excellent—they cover the critical tradeoffs. My adjustments:  
  - **Disclosure-robustness (axis #1):** You’re slightly *underweighting* this, not overweighting. With labs leaking details (intentionally or not), assume every measure will be exposed. Prioritize structural solutions (verification/recovery) over secrecy-dependent ones (honeypots).  
  - **Deployment-blocking (axis #2):** Correctly deprioritized. Blocking requires institutional buy-in you lack; hardening is within your control.  
  - **Graceful degradation (axis #3):** Well-weighted. Given uncertainty about threat models, favor solutions that work across scenarios.  
  - **Capability cost (axis #4):** Crucial. You’re right to penalize costly measures—they’ll be cut.  

  **Suggested tweak:** Add **implementation complexity** (researcher-years required). With only five years, avoid open-ended work (e.g., novel formal methods). My recommendations are feasible: verification/monitoring use off-the-shelf tools; recovery builds on infra snapshots.

  ---

  ### Summary
  - **Fund:** 1. Structural constraints → 2. Monitoring → 3. Recovery.  
  - **Why:** Maximizes disclosure-robust, deployable harm reduction with low capability costs.  
  - **Watch:** Compartmentalization viability, early deception signals, and verification costs—any shift here could reorder priorities.  
  - **Axis fix:** Boost disclosure-robustness; add implementation complexity.  

  This plan delivers actionable safety for a high-stakes, capability-constrained context. If compartmentalization proves robust, fold in honeypots to monitoring—but don’t bet on it yet.
