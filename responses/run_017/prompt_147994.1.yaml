  ### Key Insights  
  - **Where the film strains your tests**: It depicts the Sicilian/immigrant "favor economy" as a cultural obligation (not corruption), but your tests rightly flag it as a power imbalance. The film romanticizes Vito’s era yet undercuts it by showing how the same system corrupts Michael.  
  - **What the film gets right**: It proves your "rent vs. buy" concern—long-term loyalty bargains (e.g., Bonasera) are far more corrosive than one-time bribes (Sollozzo).  
  - **Training utility**: Use the wedding scene to discuss Test #3. Avoid "leveling" clips (e.g., Geary) until trainees grasp the difference between *coercive* corruption and *cultural* clientelism.  

  The film’s warning: Systems built on undisclosed obligations corrupt everyone, even those seeking "legitimacy." Your tests help isolate this, but the film adds that escaping such systems demands more than policy—it requires dismantling the myth of reciprocity.
