  ### Analysis of *The Godfather* Through Your Anti-Corruption Tests  
  Your framework offers a sharp lens for the film's exploration of power. Below, I apply your tests to key scenes, avoiding direct quotes as requested. The film *levels* systems (showing parallels between criminal, state, and corporate corruption) but does not explicitly *defend* clientelism. Instead, it portrays it as an inescapable trap where "legitimacy" is a veneer.  

