  | **Senator confrontation** | Michael offers to "fix" Geary’s murder scandal; Geary must grant mob control over casinos.                    | **1. Refusal:** Fails (Geary’s refusal means prison/death). **2. Rent vs. Buy:** Passes (buys Geary indefinitely—he’s "owned"). **3. Substitute:** Fails (exploits state weakness; doesn’t replace it). | Corruption          | Film levels systems ("we’re the same"), but tests show Geary is coerced, not an equal partner. Tests miss film’s cynicism about state legitimacy. |  
