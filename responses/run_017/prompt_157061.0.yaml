          = [1/(1+p)] * (4p-3p^2) + [p/(1+p)] * 1
          = [4p-3p^2 + p] / (1+p) = (5p - 3p^2) / (1+p)

    The expected utility of exiting at the current node is:
          P(first)*0 + P(second)*4 = [p/(1+p)]*4 = 4p/(1+p)

    For the strategy p to be optimal, we require that the driver is indifferent or that p is the best response. Since he can mix, we require that the two expected utilities are equal (because then any mixture is optimal, so he might choose p). So set:

          5p - 3p^2 = 4p   =>  5p - 4p - 3p^2 =0  =>  p - 3p^2=0  => p(1-3p)=0.

    So p=0 or p=1/3.

    But p=0: then beliefs: P(first)=1/(1+0)=1, P(second)=0.
          Then EU(exit)=0, EU(continue)= [1]*0 + [0]*1=0 -> indifferent. But p=0 means always exit: then at the first node he exits and gets 0.
    p=1/3: 
          EU(exit)=4*(1/3)/(1+1/3)= (4/3)/(4/3)=1.
          EU(continue)= (5*(1/3) - 3*(1/9)) / (4/3) = (5/3 - 1/3) / (4/3) = (4/3)/(4/3)=1 -> indifferent.

    But then the expected utility is 1, which is less than 4/3.

  This fixed-point approach does not yield the optimum.

  In the literature, the standard solution is to use the ex-ante optimal strategy (p=2/3) and accept that at the node the driver is indifferent (as we saw: 8/5=1.6 for both actions) so he has no incentive to deviate. Therefore, it is sequentially rational.

  The value 9/5 that appeared in the re-optimization is the expected utility from the current node onward if the driver could commit to using p'=1/3 for the rest of the drive, but since he cannot commit (because of re-optimization) and because of the time inconsistency, he ends up with only 1 ex-ante.

  In summary, we reject step (1) in its literal form. We require sequential rationality only in the sense that the prescribed action is optimal given the strategy will be followed in the future. And in this case, with p=2/3, it is optimal. The 9/5 is not achievable because it requires commitment across nodes, which is not available when there is re-optimization at every node.

  The re-randomizing device is not smuggling anything: it allows independent randomization at each node, but the driver's lack of commitment to a future strategy (due to re-optimization) means he cannot achieve the conditional expectation of 9/5.

  The cost of rejecting (1) is that we lose the naive notion of dynamic consistency for agents with imperfect recall. We must instead evaluate policies ex-ante and ensure that there is no incentive to deviate given that the strategy will be followed in the future.

  Therefore, the driver should precommit to p=2/3 and not re-optimize.
