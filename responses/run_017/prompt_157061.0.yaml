        At the first node, if he continues (with prob 1 at this action? we are evaluating the action) then he goes to the second node and then uses p=2/3: 
            Exit at second: prob 1/3, get 4.
            Continue at second: prob 2/3, get 1.
        So expected utility from continuing at the first node: (1/3)*4 + (2/3)*1 = 4/3+2/3=6/3=2.
    If he exits at the first: 0.

    If at the second node, then continuing: 1, exiting: 4.

  So at a node, if he exits, he gets:
    if first: 0, if second: 4.

  If he continues, he gets:
    if first: 2, if second: 1.

  So the overall expected utility of exiting at the current node is: (3/5)*0 + (2/5)*4 = 8/5.
  The expected utility of continuing is: (3/5)*2 + (2/5)*1 = 6/5+2/5=8/5.

  So they are equal. Therefore, the driver is indifferent. Any mixed strategy is optimal. In particular, p=2/3 is optimal.

  But if he considers switching to a different constant strategy for the future, we've seen that might seem better but then it leads to time inconsistency and lower ex-ante utility.

  The alternative fixed-point approach mentioned (where the plan and credence are mutually consistent) is one way to go: require that the strategy p is such that the induced beliefs (which depend on p) make p optimal. For our problem:

    Beliefs: P(first)=1/(1+p), P(second)=p/(1+p).
