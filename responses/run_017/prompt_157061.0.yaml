  After carefully considering your argument and the absent-minded driver problem, I identify the core issue in step (3), though the flaw is subtle and tied to the implications of step (1) in contexts of imperfect recall. Here’s a step-by-step resolution in prose.

  Your argument hinges on dynamic consistency—requiring that at any decision point, the agent’s action maximizes expected utility given current beliefs (step 1). When the driver using \(p = 2/3\) arrives at an intersection, their beliefs (step 2) assign probability \(3/5\) to being at the first intersection and \(2/5\) to the second. Re-optimizing at this point (step 3) suggests that deviating to a new continuation probability \(p' = 1/3\) yields an expected utility of \(9/5\), which exceeds the ex-ante optimum of \(4/3\). This creates a paradox because no ex-ante plan can achieve \(9/5\), and uncertainty should not be a source of surplus value.

  The problem arises in step (3) when you compute \(9/5\) as the expected utility of switching to \(p' = 1/3\) at the current intersection and also applying it to any future intersections. This calculation assumes the driver can *commit* to using \(p' = 1/3\) at all subsequent intersections. However, with imperfect recall and identical decision points, the driver cannot commit: upon reaching the next intersection, they face the same indistinguishable scenario and will re-optimize again. This re-optimization leads to time inconsistency. The \(9/5\) value is not achievable because it relies on a hypothetical commitment that the agent cannot enforce. When re-optimization occurs at every intersection, the actual ex-ante expected utility of this behavior is only \(1\) (as derived from simulating decisions at each node with \(p' = 1/3\)), which is *less* than the ex-ante optimum of \(4/3\). Thus, \(9/5\) is an artifact of an unsustainable assumption—it measures the expected utility *only if* commitment were possible, which it is not.

  Step (1) is not outright false but must be qualified for imperfect recall. The naive dynamic consistency condition—that actions must be optimal at every point given current beliefs—fails when re-optimization ignores the agent’s inability to bind future choices. In such cases, sequential rationality should require that the prescribed action is optimal *given that the same strategy will be followed at future nodes*, not that the agent can freely re-optimize the entire plan. For \(p = 2/3\), at an intersection with beliefs \(3/5\) and \(2/5\), continuing yields \(8/5\) and exiting also yields \(8/5\), making the agent indifferent. Thus, \(p = 2/3\) is sequentially rational under this corrected view because there is no incentive to deviate *if the strategy is followed consistently*. Rejecting step (1) in its naive form costs us the simplicity of unconditional re-optimization but preserves the ex-ante optimal plan.

  Your re-randomizing device is not to blame—it correctly models independent randomization per intersection. The issue is the commitment assumption in re-optimization. The mutual consistency fixed point you mentioned (yielding \(p = 4/9\)) is unnecessary; it imposes a stronger condition than needed and underperforms the ex-ante optimum. Instead, the ex-ante plan with \(p = 2/3\) satisfies sequential rationality when properly interpreted, and re-optimization only seems beneficial due to a mathematical artifact of commitment that cannot be realized. This resolves the paradox: confusion is a handicap, not a source of surplus, and the value of information (knowing which intersection you’re at) remains intact because it enables better decisions without time inconsistency.
