prompt: |-
  I host a small political-theory podcast (I'm a PhD student, working on democratic theory) and next week's guest has just published a book-length defence of replacing elected legislatures with randomly selected ones: single non-renewable terms, stratified so the chamber matches the population on income, education and region, paired with hard lifetime term limits — six years total, ever — for the handful of elected offices she'd keep. I want 8 or 9 questions that go beyond letting her restate the case against elections.

  Give me at least one each on: the composition problem — she wants the chamber to be a statistical mirror of the public, but acceptance rates for these assemblies are low and the volunteers skew politically engaged, so the body is filtered rather than random, and it looks like she can't have both the fairness argument and the mirror argument; the exit option — if no one can build a career out of office, durable power sits with the permanant staff, the lobbyists who outlast each cohort, and the employers who hold your job for you during your year of service, i.e. careerism doesn't vanish, it relocates to whoever isn't term-limited; and agenda-setting, since that's where the real power is and her term limits rule out anyone building a mandate around it. Plus one on what evidence would make her drop the proposal — what result from the recent Irish and French citizens' assemblies she'd count as a failure of the idea rather than a badly run process.

  For each, add a follow-up keyed to the answer she's most likely to give, and make one of them close off her standard move of 'that's an objection to any institution, show me a better one'. Lead with the question I should open the episode with, and no preamble or commentary on why you picked them.
reasoning: |-
  Okay, the user is a PhD student hosting a political theory podcast and needs interview questions for a guest advocating randomly selected legislatures. Let me break down their requirements. 

  First, they want 8-9 questions that avoid letting the guest restate their basic case. Three specific topics are mandatory: composition problem (statistical mirror vs self-selection bias), exit option (power shifting to unelected actors), and agenda-setting power. They also want one question about failure conditions for real-world case studies like Ireland/France. 

  The follow-ups need to anticipate likely responses. Crucially, one must preempt the guest's "show me a better alternative" deflection. The opening question should be first, and no commentary - just raw Q&A format. 

  Hmm, the composition dilemma seems fundamental. The guest claims both fairness (randomness) and representation (mirroring demographics), but self-selection in volunteers undermines both. Good follow-up would challenge whether stratification fixes self-selection bias if participation rates stay low. 

  For exit options, the real issue is displaced careerism. Staffers/lobbyists/employers gain power. The guest might counter that strict rules can limit influence, so follow-up should press on revolving door risks. 

  Agenda-setting question must highlight how term limits prevent mandate-building. Guest may compare to current short-termism - clever follow-up could note that electoral accountability at least exists now. 

  The evidence question is tactical. Need concrete failure thresholds for citizens' assemblies. Follow-up should demand specifics, not procedural excuses. 

  Ah, and must slot in that killer follow-up blocking the "all systems have flaws" dodge. Maybe after the exit option question? Frame it as: "You often say X, but here's why that's insufficient..." 

  Opening question should set up the radical premise without being hostile. Emphasizing the scale of elected office elimination feels right - it's bold but neutral. 

  *checks word count* User said "no preamble" so will jump straight to drafting. Structure: opener, then the three required topics plus evidence question, fill remaining slots with strong angles like legitimacy crisis or transition risks, and bury the deflection-blocker mid-sequence.
answer: |-
  Here are 9 questions, structured as requested:

  1.  **Opening Question:** Your proposal eliminates the vast majority of elected offices we associate with representative democracy. What foundational critique of elections as a selection mechanism makes this radical replacement necessary, rather than incremental reform?
      *   *Likely Answer:* Elections inherently favor elites, the wealthy, and the charismatic, creating a political class disconnected from the lived experience of ordinary citizens. Random selection is the only way to achieve genuine equality of opportunity for political office.
      *   *Follow-up:* If equality of opportunity for office is the paramount goal, does that inherently prioritize the *fairness of selection* over the *representativeness of the outcome*, especially given participation challenges?

  2.  **Composition Problem:** Your model relies heavily on the chamber being a "statistical mirror" of the population. Yet, we know acceptance rates for citizens' assemblies are often low, and participants self-select towards higher political engagement. How can you simultaneously claim the *fairness* of random selection and the *representative accuracy* of the mirror when the actual participant pool is filtered, potentially making the body *more* engaged/educated than the public?
      *   *Likely Answer:* We mitigate this through aggressive stratification (income, education, region) and outreach to underrepresented groups, plus mandatory service with significant compensation to lower barriers.
      *   *Follow-up:* But doesn't stratification *after* self-selection simply create a *synthetic* mirror? If the willing participants in certain strata are still disproportionately engaged, how does this address the core concern that the body isn't truly a cross-section, but a filtered group statistically adjusted to *look* like one?

  3.  **Exit Option:** A core argument is that single, non-renewable terms eliminate careerist politicians. But doesn't durable power simply relocate to actors who *aren't* term-limited: the permanent civil service staff drafting legislation, the lobbyists who build relationships year after year, and crucially, the employers holding jobs for members? Isn't this just outsourcing careerism and influence?
      *   *Likely Answer:* Strong rules on lobbying transparency, cooling-off periods, robust civil service neutrality protocols, and protections against employer coercion are essential safeguards built into the model. The *legislative* power itself rotates.
      *   *Follow-up (Blocks "All Institutions" Move):** You often counter concerns by asking critics to show a better institution. But here, the *specific design feature* (strict term limits) *creates* this new vulnerability to unelected power centers in a way electoral systems (with experienced legislators) arguably mitigate. How do your safeguards *specifically* overcome this *structural* power vacuum your model creates, beyond just saying "we'll have rules"?

  4.  **Agenda-Setting:** Real power often lies in setting the agenda – deciding *what* gets debated and voted on. Your members serve short, single terms. How can they possibly develop the expertise, build coalitions, or gain the public mandate needed to challenge an agenda potentially dominated by the remaining (elected?) executive, committees, or staff?
      *   *Likely Answer:* Agenda-setting power would be constitutionally or procedurally distributed. Perhaps initial agenda proposals come from citizens' initiatives, government bodies (subject to oversight), or even a separate, smaller randomly selected agenda council. New cohorts inherit ongoing work.
      *   *Follow-up:* Doesn't this risk making the main chamber reactive and fragmented? Without members building expertise or mandate over time, who possesses the coherent vision or authority to set strategic priorities against powerful actors like a President or entrenched bureaucracy?

  5.  **Evidence Threshold:** Recent large-scale citizens' assemblies (like Ireland on abortion/climate, France on climate/end-of-life) provide real-world data. What specific, measurable outcome from such an experiment would you consider evidence of a *fundamental failure* of the sortition model itself, rather than just poor implementation? (e.g., persistent demographic skew despite efforts? Coercion evidence? Inability to handle complex trade-offs? Capture by facilitators?)
      *   *Likely Answer:* Evidence of systematic exclusion of significant demographic segments despite best efforts, or conclusive proof that recommendations were fundamentally distorted by facilitators/staff against the clear will of the members, would be serious failures of the *model's potential*.
      *   *Follow-up:* If, hypothetically, multiple assemblies on complex, contested issues consistently produced recommendations significantly *less* publicly supported (in polls/referenda) than solutions from traditional processes, would that challenge the epistemic or legitimizing claims of sortition?

  6.  **Legitimacy & Accountability:** Without elections, what replaces the ritual of regular accountability to voters? If the public dislikes a major decision made by a chamber that has already dissolved, who bears responsibility? Doesn't this create a severe democratic legitimacy deficit?
      *   *Likely Answer:* Legitimacy comes from the fair selection process and faithful deliberation, not retrospective punishment. Accountability is forward-looking through robust transparency, detailed public rationales for decisions, and potential recall mechanisms for egregious misconduct. The *system* is accountable.
      *   *Follow-up:* Doesn't the lack of individual electoral accountability make members *more* vulnerable to short-term, intense pressure from well-organized groups, media storms, or even their temporary employers, knowing they won't face voters?

  7.  **Expertise & Complexity:** Governing modern states requires deep, sustained expertise on complex technical issues (e.g., financial regulation, nuclear safety, pandemic response). How can a constantly rotating body of laypeople develop, retain, or effectively utilize this kind of specialized knowledge against sophisticated bureaucracies and lobbyists?
      *   *Likely Answer:* The chamber relies heavily on independent expert testimony (balanced panels), robust committee staffs designed for continuity, and potentially specialized sub-committees within the cohort. Their role is judgment on values and trade-offs, not technical mastery.
      *   *Follow-up:* Doesn't this heavy reliance on staff and experts chosen by others put enormous, potentially unchecked power in the hands of those who *select and frame* the information for the assembly, precisely because members lack the time or background to independently evaluate sources?

  8.  **Transition & Stability:** Replacing a core democratic institution overnight is incredibly destabilizing. How would you manage the transition? Won't the first cohorts be overwhelmed and potentially ineffective, breeding public disillusionment and risking capture during this vulnerable phase?
      *   *Likely Answer:* A phased implementation, perhaps starting at regional levels or with specific functions, coupled with extensive training and mentorship from (initially) experienced administrators and facilitators. Clear constitutional guardrails are essential.
      *   *Follow-up:* Given the radical break, how do you prevent the powerful actors displaced by this reform (elected politicians, major party machines) from actively sabotaging the nascent system during its vulnerable early years?

  9.  **The "Democratic" Question:** Critics argue democracy requires the people to *choose* their governors, not just *be* them through random chance. Does your model, by removing popular choice from the legislature, fundamentally redefine the meaning of "democracy" away from representative authorization?
      *   *Likely Answer:* It reconnects democracy to its root meaning – rule by the people (*demos* + *kratos*). Representatives chosen by lottery *are* the people ruling directly in a deliberative setting, a purer form than mediated choice susceptible to elite capture. Popular choice remains in referenda and the few elected offices.
      *   *Follow-up:* If the public, in polls or protests, consistently expresses a desire for the *ability to choose and remove* their main legislators, would upholding the sortition model against that preference itself be undemocratic?
