  *starts drafting cases* For parameter 1 (unused power), a captain's dormant veto works well. Parameter 3 (costly power) needs something like a punishment that backfires on the punisher... ah, the "Captain's reputation" scenario! 

  *worries* The hardest part will be separating non-domination from negative liberty on arbitrary power. Maybe case 2 with the unchallengeable but fair administrator? If students accept that as unfree, they lean Pettit...

  *structures decision tree* Should branch first on "status vs options" since that splits negative liberty from everyone else. Then for non-domination, need to test both arbitrariness and contestability separately - user was right that republicanism fractures there. 

  *checks word counts* Keeping cases under 60 words means sacrificing nuance... but freshmen will zone out if longer. Sacrificed a beautiful "adapted preferences" case about chocolate rations to hit the limit. 

  *double-checks blind spots* User warned about feminist non-subordination being underspecified - I'll note that in the key. Also flag where positive liberty's "self-realization" branch might accidentally score like non-domination. 

  Final anxiety: Is the "guard quietly retired" case (parameter 6) too subtle? But if I make it obvious, it won't test unaware domination properly...
answer: |-
  Here’s a quiz set in a **Deep-Sea Research Station "Neptune-7"** with a Captain holding formal (but unused) emergency powers. Each case isolates one parameter of freedom, with parallel answer options (A/B/C). The scoring key is a decision tree mapping responses to 7 liberty theories, flagged where distinctions blur.

  ---

  ### **The Neptune-7 Freedom Quiz**  
  *Answer each scenario with:  
  A = "I feel free"  
  B = "I feel unfree"  
  C = "I feel neither free nor unfree / It’s complicated"*

  1. **The Unused Veto**  
     The Captain can veto any research project but never has. Your project is approved.  
     *Tests: Unused power vs. actual interference.*

  2. **The Fair But Final Arbiter**  
     A dispute over lab time is settled by an administrator. Their decision is fair and considers everyone’s input, but you can’t appeal it.  
     *Tests: Non-arbitrariness without contestability.*

  3. **The Costly Punishment**  
     The Captain *could* restrict your diving privileges for breaking a minor rule, but doing so would cripple the mission. They don’t restrict you.  
     *Tests: Power held but rationally unusable.*

  4. **The Chocolate Ration**  
     Sweets are locked away to "protect health." You crave chocolate but agree it’s bad for you. The lock stops you.  
     *Tests: Internal vs. external obstacles (adaptive preferences).*

  5. **The Empty Threat**  
     The Captain *could* ban recreational VR (which you hate), but you don’t know this. They don’t ban it.  
     *Tests: Unknown power + interference with unwanted options.*

  6. **The Ghost Surveillance**  
     Security cameras exist but were disconnected years ago. No one told you. You *think* you’re watched.  
     *Tests: Belief in power vs. its existence.*

  7. **The Unchangeable Rule**  
     A core safety rule ("No solo dives") was set by long-gone founders. No one can change it, not even the Captain. It blocks your preferred dive method.  
     *Tests: Structural constraint without a dominus.*

  8. **The Generous Cage**  
     Neptune-7 has 100 entertainment options you love. You may never leave the station.  
     *Tests: Option-width vs. status (exit rights).*

  ---

  ### Scoring Key: Decision Tree  
  *(Follow branches based on majority A/B/C answers)*  

  #### Branch 1: **Does freedom require NO ACTUAL INTERFERENCE?**  
  - **Yes (Mostly A in Q1,3,5; B in Q4) → Negative Liberty**  
    *Awkward commitment:* "The Captain’s unused veto (Q1) doesn’t reduce freedom."  
  - **No → Go to Branch 2**  

  #### Branch 2: **Does freedom require NO POWER OVER YOU?**  
  - **No (Mostly C in Q1,3,5) → Go to Branch 3**  
  - **Yes (Mostly B in Q1,3,5) → Go to Branch 4**  

  #### Branch 3: **Can structures/rules dominate without a *dominus*?**  
  - **Yes (B in Q7) → Structural Non-Subordination (Feminist)**  
    *Awkward commitment:* "The unchangeable dive rule (Q7) is dominating, even with no one enforcing it."  
  - **No (C in Q7) → Positive Liberty (Self-Mastery)**  
    *Awkward commitment:* "The chocolate lock (Q4) makes you unfree *only* if you resist it."  

  #### Branch 4: **Must power be ARBITRARY to threaten freedom?**  
  - **No (B in Q2) → Republican Non-Domination (Simple)**  
    *Awkward commitment:* "The fair-but-unappealable decision (Q2) makes you unfree."  
  - **Yes (C in Q2) → Go to Branch 5**  

  #### Branch 5: **Must power be CONTESTABLE?**  
  - **Yes (B in Q2 if combined with C in Q1/3) → Republican Non-Domination (Pettit)**  
    *Awkward commitment:* "The Captain’s unused veto (Q1) *does* reduce freedom if uncontestable."  
  - **No (C in Q2) → Go to Branch 6**  

  #### Branch 6: **Can you be free if options are restricted (even unwanted ones)?**  
  - **No (B in Q5) → Positive Liberty (Self-Realization)**  
    *Awkward commitment:* "Banning VR you hate (Q5) reduces freedom by narrowing options."  
  - **Yes (C in Q5) → Negative Liberty (Status-Oriented)**  
    *Awkward commitment:* "Belief in surveillance (Q6) alone can make you unfree."  

  #### Branch 7: **The "Leftovers" Position**  
  - **Mixed/Other → Capability Approach (Nussbaum/Sen)**  
    *Awkward commitment:* "Freedom requires specific capabilities (e.g., diving safely), not just non-interference."  

  ---

  ### Where Distinctions Blur or Collapse  
  1. **Non-Domination vs. Positive Liberty (Self-Realization):**  
     - Converge on Q4 (adaptive preferences) and Q8 (exit rights). Both likely say "B: Unfree" in both.  
     - *Tree handles this* by prioritizing Branch 1/2 (non-domination worries about power first; positive liberty focuses on obstacles).  

  2. **Republicanism Splits Internally:**  
     - Q2 isolates this: Simple republicanism (power=bad) vs. Pettit (non-*arbitrary* power=ok). The tree forces a choice at Branch 4/5.  

  3. **Negative Liberty vs. Cost-Sensitive Domination:**  
     - Q3 (costly punishment) traps them: Negative liberty (A) ignores unused power; republicans (B/C) see domination. *No collapse*: Q1/Q5 reinforce the divide.  

  4. **Feminist Non-Subordination Underspecified:**  
     - Only clearly unique in Q7 (structural constraint). Might align with republicanism on other cases. *Flag for students:* "Does domination need a *dominus*?"  

  ---

  ### Why This Works  
  - **One Institutional World:** Neptune-7 creates cohesive power dynamics (hierarchy, isolation, legacy rules).  
  - **Parameters Isolated:** Each question targets one philosophical fissure (e.g., Q2 = arbitrariness vs. contestability).  
  - **Honest Tree:** Branches reflect logical dependencies first, then slot in theories. Awkward commitments expose tradeoffs.  
  - **No Vibes-Only Answers:** Cases force concrete judgments (e.g., Q6’s "ghost surveillance" challenges pure objectivity).  

  Print the quiz **without theory names**; reveal the tree/scoring in class. Use disagreements to launch discussion: "Why did Q5 split the room?" Perfect for a final session!
