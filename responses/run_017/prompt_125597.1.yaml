prompt: |-
  Hey — I'm a novelist, about two hundred pages into the middle book of a trilogy set in Glasgow and Williamsburg, and I've hit a problem with one of my characters that I can't think my way out of. Ishbel is the daughter of a Glasgow tobacco merchant, sharp, largely self-taught, and she's got hold of a copy of the new book by the Glasgow professor everyone in the city is arguing about — still in wrappers, title page missing, she stays up reading it by the kitchen fire. I want her to be genuinely against the colonial system, for reasons she'd actually have had available to her, while her father and his Virginia cousin are for it. My writing group keeps telling me to just make her morally outraged, which is exactly the note I don't want: I want her opposition to be the kind a person could have arrived at from the arguments in the room.

  The thing I keep circling is this. As far as I remember it, Smith's case against the colonies is almost entirely a ledger case: the monopoly drags British capital into a slower trade than it would otherwise find at home, the wars and the governing cost more than the commerce returns, the whole arrangement is run for the benefit of merchants and politicians at everyone else's expense, and the sensible thing would be to open the trade, or let the colonies go their own way, or bring them properly into the constitution. What he more or less doesn't do — or so it reads to me — is say that the whole business is a wrong done to the people actually living under it. The complaint is that Britain is being cheated and badly served, not that anyone is being ruled without their consent. So: what are the most important implications of that shape of argument — an argument about cost and mismanagement rather than about injury — for the kind of anti-imperialism it's plausible for someone like Ishbel to hold in 1776? I'm especially interested in what follows for (a) how she'd answer the obvious question "but what if it did pay?", (b) whether Smith's remedies are really an alternative to empire or just a tidier version of it, and (c) whether she can get from Smith to "this is an injustice" at all without quietly importing something Smith himself wouldn't have accepted.

  Two more things, and please push back on both rather than being agreeable. First, I've been sorting objections to empire into what I call 'the auditor's objection' (it doesn't pay, it's run badly, the money lands in the wrong pockets) and 'the neighbour's objection' (whatever it pays, you are ruling people who never agreed to be ruled, and that's the whole of it) — my sense is that Smith gives you the first almost completely and the second barely at all. Is that pair doing any real work, or is it a false contrast I've talked myself into? Second, the wrinkle I genuinely can't get straight: Smith seems to hold at once that people are much alike everywhere (the bit about a philosopher and a common street porter differing very little by nature) and a kind of staging-picture where societies pass through hunting, herding, farming and commerce, with some a long way behind others. If both of those are really in him, what follows for whether his critique of empire is a critique of ruling over people at all, or only of ruling over them badly and at a loss? I have a sinking feeling the honest answer is "both, and he never noticed", which would make Ishbel's position unstable in a way that might actually be good for the novel. Oh — American English please, my New York editor keeps flagging my spellings, and don't give me citations or a reading list, I've got a stack of secondary stuff on the desk already and I'll match it up myself; its the argument I need. (Sorry, typo there, been at this since six.)
reasoning: |-
  Okay, the user is a novelist working on a historical fiction trilogy set in Glasgow and Williamsburg around 1776. They've hit a character development snag with Ishbel, a Glasgow tobacco merchant's daughter who's intellectually opposed to colonialism. The challenge is making her opposition authentic to the period's arguments, specifically drawing from Adam Smith's economic critiques rather than modern moral outrage.

  Hmm... the core tension here is between two types of anti-imperial arguments: what the user calls the "auditor's objection" (it's economically inefficient) versus "neighbor's objection" (it's inherently wrong). Smith clearly provides the first but not really the second. The user wants Ishbel's position to be plausible for an educated 1776 Glaswegian woman reading Smith.

  Interesting how the user rejects their writing group's suggestion of simple moral outrage. That shows they care deeply about historical authenticity. The typo ("its" instead of "it's") and mention of working since six AM suggest real fatigue - they probably need clear, actionable logic rather than academic citations.

  Breaking this down: First, Smith's actual arguments in Wealth of Nations do focus on economic inefficiency - the monopoly system drains British resources, colonies cost more than they're worth, etc. But he doesn't frame colonialism as inherently immoral. So for Ishbel:
  - She'd likely start from Smith's practical objections but extend them further
  - She might connect economic exploitation to human suffering through observable local effects
  - The "stages of society" theory creates tension - she could see colonies as "less developed" while still opposing their mistreatment

  Key implications for the character:
  A) If colonialism did pay? She'd still oppose it based on corruption and misgovernance - the system itself breeds inefficiency and abuse regardless of profitability
  B) Smith's remedies aren't anti-imperial - free trade within empire still maintains control, just more efficiently
  C) Getting to "injustice" requires her to add personal observation to Smith's framework - seeing how monopoly hurts both Scots and colonists

  The auditor/neighbor distinction seems valid - Smith was absolutely an auditor. The "stages" theory versus human equality is indeed a contradiction in Smith that Ishbel could wrestle with dramatically. That instability could actually strengthen the novel by showing her intellectual struggle.

  For dialogue authenticity: Her arguments should stay grounded in observable consequences - wasted money, corruption, how monopoly impoverishes Scottish workers while enriching a few merchants. Any moral language would emerge from seeing those human impacts firsthand rather than abstract rights.

  This historical moment is fascinating - right when economic critiques existed but full anti-colonial morality hadn't crystallized yet. Perfect for a character who's intellectually ahead of her time but still rooted in 1776 Glasgow.
answer: |-
  Okay, novelist, let's crack this Ishbel problem. Forget moral outrage – we're building an opposition forged in the gritty logic of 1776 Glasgow, fueled by Smith and the firelight. Here's the argument, stripped down for action:

  **The Smithian Core & Its Implications for Ishbel:**

  1.  **Smith's Primary Lens: The Auditor.** You're dead right. Smith's *Wealth of Nations* dismantles the *mercantile system* and colonial monopoly primarily as an **economic drain and systemic inefficiency.** It's bad *business* for Britain:
      *   Capital is misallocated (sunk into slow, risky colonial trade instead of faster, safer domestic/European ventures).
      *   Monopoly inflates prices for British consumers and stifles colonial production.
      *   Defense and administration costs far exceed the revenue/trade benefits.
      *   It creates a parasitic class of merchants and politicians profiting from distortion.
      *   The "policy of Europe" is absurdly skewed towards maintaining this costly, unproductive system.
      *   **The Goal:** Not justice, but wealth maximization and efficient resource allocation *for Britain*. Letting colonies go or integrating them is presented as the *rational economic choice*, not a moral imperative.

  2.  **Ishbel's Plausible Anti-Imperialism from Smith:**
      *   **Focus:** Her core objection is **waste, corruption, and systemic stupidity.** She sees the colonial system as a **giant, state-sponsored scam** enriching a few (like her father? a painful thought) at the expense of the many *in Britain* (higher prices, taxes for wars, misused capital starving other industries, creating dangerous dependencies).
      *   **Human Cost (Indirect):** She *can* arrive at the human cost, but **through the lens of inefficiency and misrule.** Smith *does* describe how colonial monopolies hurt *British* workers/consumers and *can* describe how mismanagement harms colonists (e.g., restrictions stifling their potential productivity). For Ishbel:
          *   High sugar prices mean poor Glasgow families can't afford it.
          *   Taxes for colonial wars mean less money for roads, poor relief, *things Glasgow needs*.
          *   The system encourages brutal, short-sighted exploitation *because* it's monopolistic and corrupt – leading to instability, slave revolts (costly to suppress), and ultimately, the current American rebellion (which is proving disastrously expensive!). **This mismanagement *causes* suffering – that suffering is evidence of the system's stupidity and corruption, not the *primary* moral wrong.**
      *   **The "Stages" vs. "Equality" Tension:** You nailed it. Smith absolutely holds both. For Ishbel, this creates a fascinating tension:
          *   People *are* fundamentally similar in capacity (philosopher/porter). This undermines justifications for *inherent* superiority used to excuse brutal rule.
          *   BUT, societies *are* at different "stages." This doesn't *inherently* justify rule, but it **frames the colonial project as mismanagement.** Why? Because forcing advanced commercial rules (mercantilism) onto societies perceived as "less advanced" (or even commercially mature ones like America!) is **profoundly disruptive and counterproductive.** It *prevents* natural progress (or actively damages existing social structures) rather than fostering it. The injustice, for her, is the **economic violence of imposing a stupid, extractive system** that hinders development and causes chaos, not necessarily the act of ruling *per se*.

  **Answering Your Specifics (Smith through Ishbel's Eyes):**

  *   **(a) "But what if it did pay?" (If the colonies were profitable net):**
      *   **Ishbel's Answer (Auditor+):** "Even *if* the ledger balanced today, Father, it wouldn't *last*. Monopoly breeds inefficiency and corruption like rot in damp wood. Look at the East India Company – a financial nightmare built on plunder and misrule! And *how* does it 'pay'? By forcing down the price of Virginian tobacco to fill *your* pockets while Glasgow pays dear for sugar? By keeping artificers in Williamsburg poor so London merchants get rich? It pays *some* by cheating *many*, here *and* there. That's not sound commerce; it's a rigged game bound to collapse, dragging us all down. A genuinely profitable trade wouldn't need Acts of Parliament to enforce it!"

  *   **(b) Smith's Remedies: Alternative or Tidy Empire?**
      *   **Ishbel's Realization (The Unstable Edge):** Smith's remedies (free trade, potential independence or representation) **are primarily about efficiency, not ending domination.** Free trade within the empire still assumes British supremacy and control of the overall framework. Representation? Perhaps, but likely token and still subservient to London's interests. She might see it as a **less stupid, less costly way to manage British dominance** – maybe even a necessary step – but she'd likely sense the fundamental inequality remains. The instability in her position comes from seeing the economic logic for *release* but the political reality leaning only towards *smarter management*. Is letting them go just cutting a loss, or is it acknowledging a right? Smith gives her the first, forcing her to grapple with the second implication herself.

  *   **(c) Getting to "Injustice" from Smith:**
      *   **The Bridge (Mismanagement as Injustice):** Smith *doesn't* give her "ruling without consent is inherently wrong." **He gives her "ruling *stupidly* and *corruptly* causes widespread, preventable harm."** This is where Ishbel connects the dots:
          *   **Harm to Britons:** The system unjustly burdens ordinary Scots/English with costs for the benefit of a few merchants/politicians. *That's* unjust.
          *   **Harm to Colonists (via Mismanagement):** The mercantile system *is* an injustice *to the colonists* **because** it artificially restricts their livelihoods, exposes them to arbitrary and often corrupt distant rule, and incites conflict (like with Native Americans or slave revolts) through its short-sighted greed. **The *injustice is the tangible economic and social damage caused by the bad system*.** Consent isn't the *starting* point; the damage *proves* the system is illegitimate and wrong. This is as far as pure Smith can take her. Any leap to a *fundamental* right of self-determination, regardless of economic outcome, is hers alone – a personal, perhaps intuitive, extension of seeing the *results* of its absence.

  **Pushing Back (As Requested):**

  1.  **Auditor vs. Neighbor: A Useful, But Porous, Distinction:** It *is* doing work. Smith is overwhelmingly the Auditor. The Neighbor's objection (pure anti-domination) was rare in 1776 mainstream British thought, though bubbling in radical circles (Paine was about to explode). **However, the line blurs in practice.** When the Auditor's objection highlights *how* mismanagement causes suffering (starving weavers in Glasgow, exploited slaves in Virginia, bankrupt planters in Maryland), it *morphs* into a moral argument about harm and responsibility. Ishbel can be an *intense* Auditor whose detailed indictment of harm *functions* as a powerful moral argument, even if the foundational premise is efficiency. The distinction helps you craft her *starting point*, but her passion comes from seeing the *human fallout* of the economic stupidity.
  2.  **Stages vs. Equality: The Engine of Instability:** You're correct again; Smith likely didn't deeply reconcile these. **This is GOLD for Ishbel.** It makes her position intellectually restless:
      *   She believes a Virginian planter or a Glasgow cooper has the same fundamental capacity as her father. So why is the planter subject to distant, often clueless, rule that harms his interests?
      *   She might intellectually accept "stages," but sees the colonial system actively *preventing* progress (e.g., restricting colonial manufacturing). The injustice is the **denial of opportunity** inherent in the mismanagement.
      *   This tension prevents her critique from being purely cold accounting. It injects a sense of **wasted potential and frustrated natural development** caused by the imperial system. Is she critiquing ruling *over* people, or ruling *badly*? Initially the latter, but the former becomes a haunting question arising from the equality principle combined with the visible results of bad rule. **This instability is perfect for a novel – it shows her mind working, grappling with contradictions, pushing beyond her source material.**

  **Ishbel's Voice in the Kitchen (Putting it Together):**

  *   She wouldn't shout about "the rights of man." She'd point to the **cost.**
  *   She'd rant about the **stupidity** of the Navigation Acts, how they strangle *real* wealth creation.
  *   She'd fume about how the monopoly **corrupts** – her father's colleagues, Parliament, the whole body politic.
  *   She'd connect Glasgow's hardships – closed workshops, high bread prices – **directly** to the capital sunk into risky Virginia ventures and taxes for quelling rebellions.
  *   She'd see the American revolt not as a noble struggle, but as the **predictable, expensive explosion** caused by systemic idiocy and greed.
  *   Her sense of "injustice" would flare when she links the abstract waste to Mrs. MacLeod next door struggling to feed her bairns, or when she reads about some colonial governor's petty tyranny that disrupts trade and sparks violence. **The harm makes it wrong.**

  **The Result:** Ishbel opposes the colonial system because it's a **destructive, corrupt, inefficient mess** that harms people she can see (in Glasgow) and people she can imagine (in the colonies) through its sheer mismanagement. Smith gives her the framework and the facts. Her intelligence and empathy make her feel the burn. Her position is historically plausible, intellectually grounded, dramatically unstable, and perfectly poised to evolve as the rebellion unfolds. She's not a modern activist; she's a fiercely intelligent 1776 Glaswegian who's done the sums and seen the rot, and it makes her bloody angry.

  Now go write her arguing with her da by that kitchen fire. Make the economic logic crackle like the embers. The moral heat will follow.
