prompt: |-
  I am working through the debate over the special composition question — the question of when it is true that there is something composed of some given things — and I would like a careful explanation of one particular maneuver in it.

  The standard menu of answers is familiar: nihilism, on which composition never genuinely occurs and only mereological simples exist; universalism, on which any things whatsoever have a fusion; and restrictivism, on which composition occurs only under some substantive, non-trivial condition. The best-known restrictivist view is the organicist one defended by Peter van Inwagen, on which the xs compose something just in case their joint activity constitutes a life (simples trivially composing themselves), so that tables, chairs, and clouds turn out not to exist. Restrictivism characteristically faces two complaints at once. First, the arbitrariness complaint: any restriction other than "always" looks like an unprincipled list of favoured cases unless it can be given a general rationale. Second, the problem of the many: for an ordinary object such as a cloud or a mountain there appear to be countless overlapping pluralities of particles that differ only marginally and each of which seems to have as good a claim as any other to be the plurality that composes it, so that either there are very many coincident clouds or there are none.

  Suppose someone tries to discharge restrictivism's burden with a view I shall call *contrastive-cohesion restrictivism* (CCR). Let causal integration be a matter of degree: the extent to which the members of a plurality stand in dense, reciprocal, ongoing causal interaction with one another, rather than interacting mainly with things outside the plurality. CCR then holds:

  > The xs compose an object if and only if the xs are a local maximum of causal integration among the pluralities that overlap them — that is, if and only if no plurality that shares some but not all of the xs is more strongly causally integrated than the xs are.

  Please explain the following, at a level appropriate for someone who already knows the standard menu of views but has not encountered this proposal.

  1. **What is structurally new here, and what is it supposed to buy?** In particular, explain why CCR makes facts about composition *extrinsic* and *competitive* in a way that neither organicism nor universalism does, and how that feature is supposed to answer the arbitrariness complaint and the problem of the many simultaneously. I would also like you to address a classification question: is CCR best understood as a metaphysical answer to the composition question at all, or is it really a semantic or contextualist thesis about how claims of the form "there is an object composed of these things" get their truth conditions? Say why that distinction matters for what the view can claim to have achieved.

  2. **How the view behaves on cases, treated as arguments rather than illustrations.** Work through at least: (a) my two hands held apart in front of me; (b) the plurality consisting of a living organism together with an inert pebble resting beside it; (c) a case in which two overlapping pluralities are exactly tied in causal integration. For each, state what CCR predicts, show the reasoning from the criterion to the verdict, and say whether the verdict should be counted as a point in the view's favour.

  3. **The most serious objection.** My suspicion is that the contrastive move purchases a treatment of the problem of the many only by paying for it somewhere else, and I want that suspicion sharpened rather than merely confirmed. Articulate the strongest version of the objection, and distinguish it from the cheap version (that the view is unfamiliar, or that it makes composition depend on "what else is around"). Then give the best reply available to a defender. If you judge the objection fatal, say what the most attractive fallback position would be for someone who wanted to preserve the view's motivation without its comparative apparatus.

  Throughout, I am more interested in the reasoning that connects the extrinsicality of CCR's criterion to its verdicts than in a catalogue of positions, and I would ask you to flag any place where the view's fate turns on a further choice that I have left unspecified in the formulation above.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a sophisticated metaphysical proposal about composition and requests a structured analysis, so I'll need to organize my thoughts around their three core questions while maintaining philosophical precision.

  First, I recognize the user's familiarity with Van Inwagen's organicism and the standard objections to restrictivism. Their proposed CCR view shifts the composition criterion from intrinsic properties to extrinsic comparative relations - that's the crucial innovation. I should emphasize how this makes composition competitive: an object exists only if it "beats" overlapping pluralities in causal cohesion. This directly addresses the problem of the many by eliminating ties through contrast, while answering arbitrariness concerns by making composition depend on a gradient rather than a fixed threshold.

  For classification, I need to clarify why CCR must be metaphysical rather than semantic. If it were contextualist, it couldn't resolve metaphysical indeterminacy but merely relocate it - the user would rightly consider that evasion. The extrinsic nature is feature not bug here, but I'll note the burden shift: CCR must now explain why this relational property grounds existence.

  Moving to cases, I'm considering how to demonstrate the competitive logic rigorously. For separated hands: neither is local maximum because each hand has higher internal cohesion than the hand-hand pair. For organism+pebble: the organism wins locally, excluding the pebble. The tie case is critical - I'll argue CCR must deny composition here, which preserves consistency but at cost of occasional nihilism about intuitive objects.

  The objection about extrinsic dependence needs sharpening beyond mere unfamiliarity. The real issue is explanatory priority: why should existence depend on losing competitors? I'll formulate this as a dilemma: either the extrinsic comparison tracks some intrinsic property (making it redundant) or it doesn't (making it mysterious). The defender might retreat to emergent properties, but that seems costly. If pressed, a fallback could be a non-contrastive gradient theory, though that resurrects problem of the many.

  Throughout, I'll flag open parameters: how "local" the maxima must be, how to measure integration precisely, and whether ties are possible. The user wants reasoning connections highlighted, so I'll explicitly link the competitive mechanism to each verdict and objection.
answer: |-
  ### 1. Structural Innovations and Implications  
  **The Core Move:** CCR replaces *absolute thresholds* (e.g., "constitutes a life") with a *comparative, extrinsic criterion*: composition occurs iff a plurality is a **local maximum** of causal integration relative to overlapping competitors. This makes composition:  
  - **Extrinsic:** Whether the *xs* compose something depends on how their causal cohesion *compares to nearby pluralities* (e.g., adding/removing a particle changes the competitive landscape).  
  - **Competitive:** Composition is "won" by pluralities that outperform rivals in their neighborhood.  

  **What It Buys:**  
  - **Arbitrariness Answer:** Avoids unmotivated thresholds (e.g., "why life but not clouds?"). Instead, composition emerges from a *natural gradient* (causal integration) + a *general principle* (local maxima). The restriction is principled, not a "list."  
  - **Problem of the Many Answer:** For a cloud, most particle pluralities are *not* local maxima—slightly smaller/larger overlapping groups are *less* integrated (e.g., adding a loosely attached water molecule reduces cohesion). Only one (or few) maximally integrated pluralities compose the cloud, avoiding massive coincidence.  

  **Classification: Metaphysical, Not Semantic**  
  CCR is best understood as a *metaphysical* thesis:  
  - It fixes **mind-independent existence conditions** (composition depends on objective causal structures, not speaker context).  
  - **Why the distinction matters:**  
    - If semantic/contextual, CCR would imply that "object" *pragmatically refers* to different pluralities in different contexts, leaving underlying metaphysics unsettled. This fails to resolve the Problem of the Many (which is metaphysical: "How many objects *are there*?").  
    - As metaphysics, CCR claims to *eliminate* indeterminacy: only local maxima are genuine objects. This is a substantive achievement—if successful.  

  ---

  ### 2. Case Analyses  
  **(a) Two hands held apart**  
  - **Plurality:** All particles in both hands.  
  - **Causal integration:** Low—hands interact weakly (e.g., via air/neural signals), but each hand has high *internal* cohesion (dense neuron/muscle interactions).  
  - **Competitors:** Consider *each hand alone*. Each is more integrated than the two-hand plurality.  
  - **Verdict:** *No composition* for the two hands together (not a local maximum). Each hand *is* a composite (if its particles form a local maximum).  
  - **Pro:** Matches intuition: two hands aren’t a single object. **✓**  

  **(b) Organism + adjacent pebble**  
  - **Plurality:** All particles in the organism + the pebble.  
  - **Causal integration:** Low—pebble interacts minimally with the organism (gravity, incidental contact).  
  - **Competitors:** The *organism alone* has much higher integration (metabolism, homeostasis). Adding the pebble *reduces* average cohesion.  
  - **Verdict:** *No composition* for the organism+pebble plurality. The organism alone composes an object (if it’s a local maximum).  
  - **Pro:** Avoids universalism’s "trash object" problem. **✓**  

  **(c) Exact tie in causal integration**  
  - **Setup:** Suppose two overlapping pluralities (e.g., \(A =\) particles {1,2,3} and \(B =\) {1,2,4}) have *identical* integration scores.  
  - **Criterion:** CCR requires *strictly greater* integration to "win." Neither is a local maximum if a competitor ties or beats them.  
  - **Verdict:** *No composition* for either \(A\) or \(B\).  
  - **Con:** Highly problematic. If \(A\) and \(B\) are intuitively objects (e.g., two tied candidates for a cloud’s boundary), CCR denies both exist—violating intuition. **✗ Major cost.**  

  ---

  ### 3. The Most Serious Objection & Reply  
  **Objection (Explanatory Priority Dilemma):**  
  CCR makes composition depend on *extrinsic comparisons*, but existence should be grounded in *intrinsic* properties. Why should whether the *xs* compose something hinge on whether a *rival* group \(ys\) (which may not even exist) is more integrated? This inverts explanatory order: causal cohesion should *make* an object unified, not be a *consequence* of winning a competition. The cheap objection ("it depends on what’s around") misses the metaphysical depth: CCR risks making composition *epiphenomenal* to comparisons.  

  **Defender’s Best Reply:**  
  - **Emergent Unification:** A local maximum isn’t just "winning a contest"—it reflects that the *xs* are *objectively unified* in a way overlapping pluralities aren’t. The comparison *tracks* an intrinsic feature: maximal cohesion *for that region*. Rivals aren’t metaphysical competitors but *epistemic probes* revealing where cohesion peaks.  
  - **Fallback for Ties:** Deny ties are metaphysically possible: causal integration is infinitely gradable (e.g., quantum fluctuations break symmetry). If ties exist, adopt "near enough" maxima (sacrificing precision for intuitiveness).  

  **If Fatal: The Fallback Position**  
  If extrinsic dependence is untenable, retreat to **Gradient Restrictivism**:  
  > The *xs* compose something iff their causal integration exceeds threshold \(T\) (a scalar value, not comparative).  
  - **Retains:** Principled restriction via causal cohesion.  
  - **Abandons:** Problem of the Many solution (now many pluralities may exceed \(T\)).  
  - **Cost:** Must accept vague composition or epistemicism.  

  ---

  ### Key Unspecified Parameters & Fate-Turning Choices  
  1. **Locality of "Neighborhood":** How far out must we check for competitors? If too wide, composition becomes global (undermining locality); if too narrow, maxima proliferate.  
  2. **Tie Handling:** Whether ties are possible determines if CCR yields nihilism in boundary cases.  
  3. **Integration Metric:** How to quantify "dense, reciprocal interaction"? A vague metric invites new arbitrariness worries.  

  **Conclusion:** CCR’s power lies in using extrinsicality to *filter* candidates, rendering composition discrete in a continuous world. Its viability hinges on whether this comparative move can be grounded in reality, not just epistemology. If not, Gradient Restrictivism preserves the core motivation (cohesion as composer) but surrenders the elegant solution to the Problem of the Many.
