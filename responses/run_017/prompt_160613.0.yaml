prompt: |-
  Hey — I need help turning a half-baked idea into a real proposal. I'm applying for a funded one-year master's project (12 months, solo, mostly pen and paper, though I could do small simulations if they'd actually earn their keep) and the deadline has snuck up on me. The committee is half game theory / econ and half CS, so whatever I hand in has to be readable to both, and the thing they'll definitely push on is "what's new here" — I need more than "program equilibrium is cool, let's study it more."

  So here's the background as I understand it, and then the idea. In the standard program-equilibrium setup for a one-shot Prisoner's Dilemma, each player submits a program that gets the other player's source code as input and outputs an action; the usual trick (some self-referential quining construction) lets you submit something like 'cooperate iff the other player's source is identical to mine', and then mutual cooperation is an equilibrium of the one-shot game even though defection is strictly dominant in the underlying game. But everyone also knows the embarrassment-of-riches objection: the equilibrium set is absurdly permissive, because programs can condition on arbitrary syntactic trivia — cooperate iff the opponent's source has an even number of characters, whatever — so cooperation gets 'supported' but so does nearly everything else, and the cooperative profile isn't focal, it's just one gadget among infinitely many. My thought is to attack the permissiveness not by shrinking the programming language or banning self-reference (which feels ad hoc and language-relative) but by putting a robustness requirement on the profile itself. Call a cooperative profile mutation-stable (to degree k) if each player's program still cooperates when fed any program obtainable from the partner's source by a handful of small edits — single-token insertions, deletions, substitutions. The 'cooperate iff identical' gadget should be maximally fragile under this: flip one character and mutual cooperation collapses to mutual defection. Whereas a tolerant program, one that simulates the opponent against a battery of probe programs and cooperates if it *behaves* like a cooperator, looks robust — but it presumably has to pay for that tolerance by being exploitable by mutants that behave cooperatively against the probe and then defect against you, and it also has to deal with the fact that simulating an arbitrary program may not halt, so realistically you bound the simulation by a step budget B and everything becomes approximate.

  I already see two traps and I want the proposal to stare at them rather than hide them. First, unconditional defection is itself perfectly mutation-stable — mutate it however you like, it still defects — so robustness alone can't be the whole selection criterion, and I think the honest question has to be about a tradeoff: for programs that do cooperate against themselves and do defect against unconditional defectors, what's the achievable frontier between tolerance (fraction of near-mutants you still cooperate with) and exploitability (how much value adversarially-chosen near-mutants can extract), is that frontier monotone in the step budget B, and is the price of robustness bounded away from zero or does it vanish as B grows? Second, the whole thing might turn out to be a fact about whatever toy language I pick rather than a fact about anything conceptually interesting.

  Can you write me the proposal? I'd want: the question stated precisely enough that it has a determinate answer (including what the edit metric and the budget are doing in the formulation); why the existing moves don't settle it — the permissiveness objection, the 'just restrict the language' move, provability-based variants where programs reason about proofs instead of simulating, and standard equilibrium refinements — but please don't dump a literature review or citations at me, I'll fill those in myself; the approach, broken into phases over the year, with the theory parts and any simulation parts clearly separated and justified; what a positive result would actually look like (a theorem? a construction? a negative result that's still worth having?) and, just as important, what would count as the project failing — e.g. if the frontier is entirely an artifact of language choice, or if the central impossibility turns out to be a repackaging of something everyone already knows; and an honest scope check for 12 months of one person. Two more specific things: (a) the obvious alternative method is to fix a minimal language and brute-force enumerate all programs up to some small size, computing the frontier exactly for tiny cases — tell me whether that should be the main method, a conjecture generator, or a distraction, and why; (b) my friend who works on commitment and mechanism design says this is all just 'commitment devices with extra steps' and I semi-believe him, so give me something to say about that. Also worth a line: is mutation (perturbing the source) actually different from a trembling-hand style perturbation (perturbing the executed action), or do the two collapse into each other once you write them down properly? And what do I tell the econ half about why this isn't just another refinement paper, and the CS half about why it isn't just a computability exercise. Its fine to tell me if you think the idea as stated is too weak to build a year on and needs reframing, that would be useful too.
reasoning: |-
  We are writing a research proposal for a 12-month master's project. The core idea is to address the permissiveness of program equilibria in the Prisoner's Dilemma by introducing a robustness condition against mutations (small edits in the source code). The goal is to study the trade-off between tolerance (robustness to mutations) and exploitability (risk of being exploited by mutants) for cooperative programs.

  Key elements from the user's note:
  - The standard program equilibrium for Prisoner's Dilemma has an embarrassment-of-riches problem: too many equilibria because programs can condition on arbitrary syntax.
  - Proposed solution: require that the cooperative profile is mutation-stable (to degree k), meaning it remains cooperative even when the opponent's program is mutated by up to k small edits (e.g., single-token changes).
  - The 'cooperate iff identical' program is fragile, while a tolerant program (that simulates the opponent against probes) might be robust but risks exploitability and non-halting.
  - Traps: 
    1. Unconditional defection is also robust, so we need to consider only programs that cooperate with themselves and defect against unconditional defectors. Then, we study the trade-off between tolerance and exploitability.
    2. The results might be language-dependent.

  Proposal Structure:
  1. Title and Abstract
  2. Introduction and Background
  3. Research Question and Motivation
  4. Related Work (brief, without literature review dump)
  5. Approach and Methodology
     - Formal Model: Define the programming language, edit metric, step budget, and the game.
     - Defining Tolerance and Exploitability: How to measure them.
     - Theoretical Analysis: Study the trade-off, possible theorems.
     - Simulation (if justified): For small programs, using brute-force enumeration to explore the frontier.
  6. Expected Outcomes and Significance
  7. Plan and Timeline
  8. Risks and Mitigation

  Addressing the specific requests:
  - (a) The role of brute-force enumeration: It should be a conjecture generator and a way to test small cases, not the main method, because the space of programs grows too fast. We use it to gain intuition and test hypotheses for the theoretical part.
  - (b) Commitment devices: We can argue that program equilibria are a form of commitment, but the mutation-stability adds a new layer of robustness that is not present in standard commitment models. This robustness is about the stability of the commitment device itself to implementation errors or adversarial tweaks.

  Mutation vs. trembling-hand: 
  - Mutation (source code perturbation) is different because it can change the behavior in a structured way (e.g., a mutant might behave cooperatively against some programs and defect against others) and is about the program's representation. Trembling-hand perturbs the action, which is a one-time noise. They don't collapse because the source mutation might lead to a program that has a completely different strategy.

  Selling to econ and CS:
  - To econ: This is not just a refinement because it introduces a new dimension (robustness to code mutations) that has not been studied in standard refinements (like trembling-hand or proper equilibria). It's about the stability of the equilibrium to changes in the implementation of the strategy.
  - To CS: It's not just a computability exercise because we are studying a trade-off (tolerance vs. exploitability) that involves computational limits (step budget) and has game-theoretic implications.

  Reframing if needed: The idea is strong enough, but we must be clear about the scope and the fact that we are building a theoretical model. We might not get a complete answer in 12 months, but we can make progress.

  Now, let's write the proposal.
answer: |-
  ### Proposal: Robust Program Equilibria in the Prisoner's Dilemma via Mutation-Stability  

  #### **1. Core Research Question**  
  What is the fundamental trade-off between **tolerance** (robustness to syntactic mutations in opponent programs) and **exploitability** (vulnerability to adversarial mutants) for cooperative program equilibria in a one-shot Prisoner’s Dilemma? Specifically:  
  - **Formal setup**:  
    - Programs \( P_i \) (in a minimal Turing-complete language, e.g., a lambda calculus variant) take opponent source code \( P_j \) as input.  
    - **Edit metric**: Levenshtein distance over tokens (insert/delete/substitute one token = one edit).  
    - **Budget**: Step-bound \( B \) for simulations (programs time out after \( B \) steps).  
    - **Mutation-stability**: \( (P_1, P_2) \) is \( k \)-mutation-stable if \( P_i \) cooperates when given any \( P_j' \) within \( k \) edits of \( P_j \) (for \( i \neq j \)).  
  - **Target programs**: \( P \) that cooperate with clones of themselves and defect against unconditional defectors.  
  - **Metrics**:  
    - *Tolerance* \( \tau(k) \): Fraction of \( k \)-edit mutants of \( P_j \) that \( P_i \) cooperates with.  
    - *Exploitability* \( \epsilon(k) \): Max payoff loss to a \( k \)-edit mutant of \( P_j \) that tricks \( P_i \) into cooperating while defecting.  
  - **Goal**: Characterize the Pareto frontier of \( (\tau(k), \epsilon(k)) \) achievable for fixed \( k, B \), and how it evolves with \( B \).  

  #### **2. Why Existing Approaches Don’t Settle This**  
  - **Permissiveness objection**: Prior work (Tennenholtz, McAfee) shows *existence* of cooperative equilibria but ignores robustness; arbitrary syntax-conditioning is unstable under mutations.  
  - **Language restrictions**: Proposals to limit programs (e.g., to mutual simulation) are ad hoc; we treat robustness as a property of *profiles*, not languages.  
  - **Provability-based models**: Programs checking proofs (Fortnow, 2009) avoid simulation halting but are brittle to syntax changes—proofs fail under minor edits.  
  - **Standard refinements** (trembling-hand, proper equilibrium): Perturb *actions*, not *programs*. Mutation tests the implementation’s structural stability, not behavioral noise.  

  #### **3. Approach & Methodology**  
  **Phase 1: Formalization (Months 1–3)**  
  - Define language \( \mathcal{L} \) (e.g., untyped lambda calculus with primitives for self-reflection and step-counting).  
  - Formalize edit metric, tolerance \( \tau(k) \), and exploitability \( \epsilon(k) \) in game-theoretic terms (payoff matrices).  
  - **Key deliverable**: Existence proof for non-trivial \( k \)-mutation-stable cooperative equilibria.  

  **Phase 2: Theoretical Frontier (Months 4–7)**  
  - **Theorem 1 (Impossibility)**: For any \( B \), \( \epsilon(k) > 0 \) if \( \tau(k) > 0 \) (no free robustness).  
  - **Theorem 2 (Budget scaling)**: Does \( \epsilon(k) \to 0 \) as \( B \to \infty \) for fixed \( k \)? (Conjecture: Yes, via "simulate-and-verify" programs.)  
  - **Theorem 3 (Monotonicity)**: How \( \tau(k)/\epsilon(k) \) changes with \( B \) and \( k \).  
  - **Tool**: Probabilistic method to show achievability for large \( B \).  

  **Phase 3: Simulation for Intuition (Months 8–10)**  
  - **Brute-force enumeration**: For \( \mathcal{L} \) programs of size \( \leq N \) tokens (small \( N \)), compute \( \tau(k), \epsilon(k) \) for all cooperative pairs.  
  - **Role**: Not primary (space explodes), but:  
    - Tests conjectures (e.g., "tolerant programs require \( \Omega(B) \) tokens").  
    - Identifies "champion" programs for large \( B \) analysis.  
  - **Metrics**: Compare empirical \( (\tau, \epsilon) \) to theoretical bounds.  

  **Phase 4: Synthesis (Months 11–12)**  
  - Contrast mutation-stability with trembling-hand refinements.  
  - Derive implications for focal points in program equilibrium.  

  #### **4. Expected Outcomes & Failure Criteria**  
  - **Positive result**: A theorem showing \( \epsilon(k) = O(1/B) \) for \( \tau(k) \geq c \) (robustness cost vanishes with computation).  
  - **Negative but valuable**: \( \epsilon(k) \) bounded away from zero (robustness is costly); or fragility of cooperation under token edits.  
  - **Failure modes**:  
    - Language-dependence dominates (all results are artifacts of \( \mathcal{L} \)).  
    - Trade-off reduces to known results (e.g., Rice’s theorem).  
  - **Mitigation**: Abstract language features (e.g., parametric in step-bound); focus on information-theoretic limits.  

  #### **5. Addressing Traps & Alternatives**  
  - **Unconditional defection**: Explicitly excluded by focusing on programs that cooperate *with their own kind*. The trade-off is conditional on cooperation being viable.  
  - **Brute-force enumeration**: A **conjecture generator**, not core. Justified for small \( N \) to test if theoretical bounds are tight.  
  - **Commitment-device critique**: Program equilibria *are* commitment devices, but mutation-stability asks: "What if your opponent’s commitment device is buggy or spoofed?" This is unexplored in mechanism design.  

  #### **6. Mutation vs. Trembling-Hand**  
  - **Mutation** perturbs the *program* (strategy implementation), potentially creating programs that defect *selectively*.  
  - **Trembling-hand** perturbs *actions* (execution), preserving the original program’s intent.  
  - **No collapse**: Mutants can be "adversarial" (e.g., cooperate with probes but defect against you); trembling-hand errors are non-strategic.  

  #### **7. Significance to Econ and CS Audiences**  
  - **Econ**: Not "just a refinement" — it’s a *structural* stability criterion for programmatic strategies, with applications to automated contract design (e.g., robust treaties between AIs).  
  - **CS**: Not "just computability" — it’s a *computational game-theoretic* study of how bounded rationality shapes cooperation under adversarial uncertainty.  

  #### **8. Scope & Feasibility**  
  - **12-month focus**: Theory-first (Phases 1–2), with simulation as validation.  
  - **Risks**: Undecidability barriers; chaotic effects of small edits.  
  - **Fallback**: If the frontier is intractable, characterize impossibility (e.g., "no program achieves \( \tau(k)>0.5, \epsilon(k)<0.1 \) for \( k \geq 1 \)").  

  ---  
  **Proposal Strength**: The idea is novel and actionable. It reframes permissiveness as a robustness-efficiency trade-off, leveraging CS tools (computational bounds) for a game-theory problem. With rigorous formalization, this can deliver publishable results in 12 months.  

  **Optional Addendum for Submission**:  
  - *Title*: "The Price of Robustness: Mutation-Stability in Program Equilibria"  
  - *Impact Line*: "Lays groundwork for fault-tolerant multi-agent systems where ‘buggy’ code must not collapse cooperation."
