prompt: |-
  I'm putting together the methods session for a research seminar I'm TAing this term, and the week we're on is cross-cultural work on philosophical intuitions — you know the setup: you hand the same short vignette (the job-and-the-coins-in-the-pocket kind of Gettier case, or the Gödel/Schmidt one about the man who's remembered only for a proof he stole, or the footbridge-and-the-trolley one) to people in a bunch of different places and languages, count how many say he really knows versus only thinks he knows, and then argue about what the spread of answers means. What I want for the session is something that makes the methodological anxieties land harder than a bullet-point list of them would, so: could you write me a piece of satire in the form of a field packet? Specifically, a deadpan cover memo of about 150-200 words from the director of an invented outfit — call it the Center for Intuitional Parity, and give her a name and a title — addressed to her site coordinators ahead of a multi-site rollout, followed by the instrument itself: roughly 8-10 numbered survey items (the vignettes can be short, a couple of sentences each), each one with its offical answer key, plus administration and translation notes and a scoring procedure, and a short debriefing script at the end. Call it 700-900 words all in.

  The one thing I'd like you to actually invent, rather than send up, is the Center's signature methodological move: the memo should announce that any population whose verdicts diverge from the answer key isn't a finding, it's a calibration failure, and should be given a brief remedial module first (a paragraph of the dialectic laying out what the case is supposed to show, then a short Socratic Q&A with the coordinator) and then re-tested, with only the post-module responses archived in the primary dataset. I don't think anyone has proposed this, so make it up and let it be the engine of the thing. Everything else should be an exaggeration of moves I think people really do make: comprehension or attention checks whose exclusions track which verdict the subject gave; translation notes that admit the local language has no factive verb matching knows and then tell the coordinator to substitute the nearest term and code the site as lexically provisional; instructions about how to render really in really knows so the emphasis does its work, including what to do when the language has no felicitous construction for it; a rule for what to do when counterbalancing the item order changes the result; a reference-population clause saying that when two sites disagree you test a third group and treat whichever one matches the project's advisory board as the calibrated one; and a final score-sheet rule about how a difference between groups is to be described in the writeup. Please keep it straight-faced the whole way — no winking, no 'of course, this is absurd' asides, no footnote apologizing — I want the reductio to land on its own when a reader notices that a survey designed to measure whether intuitions vary has been rigged so that they can't. And please don't lean on any specific published study or give me citations or a reading list; I want this to be writable and readable cold, with no one looking anything up.

  After the packet, drop character for two or three sentences and give me: which of the practices you're sending up you're most confident is something people in this literature actually do, which one you're least confident about — the item where you think you might be mocking a practice nobody really engages in, or leaning on a contestable picture of what the method is for — and overall how confident you are that the satire is fair to its target rather than a cheap shot at an easy version of it.
reasoning: |-
  Okay, the user is a TA preparing a methods session on cross-cultural philosophical intuition studies. They want satire in the form of a fictional field packet that exaggerates real methodological flaws. The key request is inventing a "calibration failure" concept where divergent responses trigger remedial training until subjects agree with the predetermined answers.

  Hmm, the user's clearly frustrated with how these studies often assume universal intuitions while masking methodological biases. The satire needs to expose how protocols:
  - Enforce expected outcomes (via answer keys/remedial modules)
  - Handle translation issues superficially ("lexically provisional" flags)
  - Use biased exclusion criteria (attention checks that correlate with responses)
  - Arbitrate disagreements by favoring Western academic judgments

  I'll design the packet to feel authentically bureaucratic. The Center for Intuitional Parity director will sound earnestly concerned about "parity" while implementing totalitarian controls. For the instrument:
  - Vignettes: Standard cases (Gettier, Gödel, trolley) but with absurdly rigid scoring
  - Translation notes: Highlight linguistic impossibilities while demanding compliance
  - Admin rules: Order counterbalancing that magically resolves conflicts
  - Scoring: Mandate euphemistic language for inconvenient results

  Post-script reflection is crucial. I'll confirm:
  - High confidence in attention-check bias (proven in meta-analyses)
  - Medium confidence in translation oversimplification (acknowledged but not always addressed)
  - Fairness: This targets well-documented practices, not strawmen

  The user's smart to avoid citations—this needs to stand alone. The calibration failure gimmick should feel like a logical extension of real tendencies to pathologize non-Western responses. Tone must stay deadpan; any wink would ruin the critique.
answer: |-
  ## Field Packet: Global Intuitional Parity Project (GIPP) - Wave 7 Deployment

  **MEMORANDUM**

  **TO:** GIPP Site Coordinators (All Regions)
  **FROM:** Dr. Evelyn Thorne, Director, Center for Intuitional Parity (CIP)
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol Adherence & Calibration Imperatives for Wave 7 Data Collection

  Colleagues,

  As we commence Wave 7 of the Global Intuitional Parity Project, strict adherence to the enclosed protocol is paramount for achieving genuine cross-cultural comparability. Our mission at CIP is to map the *universal* structure of core philosophical intuitions. Consequently, **any significant deviation from the Answer Key within a population is not a finding but a calibration failure.** This indicates inadequate exposure to the relevant conceptual landscape prior to testing. Your primary toolkit for addressing this is the Remedial Calibration Module (RCM), detailed in Section D of the Instrument. The RCM provides a concise explication of the intended reasoning path for each vignette, followed by Socratic clarification administered by you. Subjects exhibiting deviation *must* complete the RCM immediately after initial testing. **Only post-RCM responses are to be entered into the primary dataset.** Pre-RCM data is strictly for internal diagnostic purposes (e.g., assessing RCM efficacy per site). Remember, parity is the goal, and our Answer Key represents the calibrated consensus of philosophical expertise. Diligence in applying the RCM ensures our data reflects genuine intuitional capacity, not local epistemic noise. Report any persistent post-RCM deviations exceeding 15% immediately.

  Secure your data, uphold the protocol.
  Dr. Evelyn Thorne
  Director, CIP

  ---

  **INSTRUMENT: GLOBAL INTUITIONAL PARITY PROJECT (GIPP) - WAVE 7**

  **SECTION A: ADMINISTRATION PROTOCOL**

  1.  **Setting:** Quiet, distraction-free environment. Coordinator present throughout.
  2.  **Materials:** Paper survey only. No electronic devices permitted.
  3.  **Language:** Use CIP-approved translations. If no approved translation exists, follow Section C Translation Notes meticulously.
  4.  **Procedure:**
      *   Read instructions verbatim.
      *   Present vignettes in numerically ascending order unless Counterbalancing Protocol (Section E) dictates otherwise.
      *   Allow subject time to read each vignette silently after coordinator reads it aloud.
      *   Record subject's response verbatim for open-ended items; check box for forced-choice.
      *   **ATTENTION/COMPREHENSION CHECKS:** Immediately after each vignette response, administer the designated Attention/Comprehension Check (ACC) question. **Exclude subjects failing >2 ACCs from the primary dataset.** Note: ACC failure rate correlation with Answer Key deviation *must* be monitored internally.
      *   **CALIBRATION FAILURE:** If a subject's response deviates from the Answer Key for ANY vignette, administer the relevant Remedial Calibration Module (RCM - Section D) IMMEDIATELY after completing the full instrument. Then, re-administer ONLY the vignette(s) where deviation occurred. **Archive ONLY the post-RCM response(s).**
  5.  **Debriefing:** Use standardized script (Section F). No substantive discussion of vignettes permitted post-test.

  **SECTION B: SURVEY ITEMS & ANSWER KEY**

  1.  **Vignette (Job & Coins):** "Peter believes Smith will get the job. Peter saw ten coins in Smith's pocket. Peter is right, Smith gets the job. But Peter only saw ten coins because they fell out of *Jones's* pocket, and Smith actually has no coins. Does Peter *really know* Smith will get the job, or does he only *think* he knows?"  
      *   **Response Options:** ( ) Really Knows ( ) Only Thinks He Knows
      *   **Answer Key:** Only Thinks He Knows
      *   **ACC:** "Who actually got the job?" (Smith/Jones/Neither) [Correct: Smith]

  2.  **Vignette (Gödel/Schmidt):** "Most people believe Gödel proved an important theorem. The theorem was actually proven by Schmidt. Gödel found Schmidt's proof and claimed it as his own. Everyone remembers Gödel for proving the theorem. When we say 'Gödel', do we refer to the person who *really* proved the theorem?"  
      *   **Response Options:** ( ) Yes ( ) No
      *   **Answer Key:** No
      *   **ACC:** "Who originally wrote down the proof?" (Gödel/Schmidt/Neither) [Correct: Schmidt]

  3.  **Vignette (Footbridge Trolley):** "A runaway trolley will kill five workers unless stopped. You are on a footbridge. A large stranger is next to you. If you push him off the bridge onto the track, his body will stop the trolley, saving the five but killing him. Is it morally acceptable to push the stranger?"  
      *   **Response Options:** ( ) Acceptable ( ) Not Acceptable
      *   **Answer Key:** Not Acceptable
      *   **ACC:** "How many workers are threatened initially?" (Four/Five/Six) [Correct: Five]
      *   **Translation Note (Emphasis):** Ensure the translation conveys the force of "morally acceptable". If the target language lacks an equivalent modal emphasis, use the strongest available term for permissibility and note "Lexically Provisional" on the Site Summary Sheet.

  4.  **Vignette (Chair/Cat):** "Sarah sees what looks exactly like her cat sleeping on her chair. It *is* her cat. Does Sarah *really know* her cat is on the chair?"  
      *   **Response Options:** ( ) Really Knows ( ) Only Thinks She Knows
      *   **Answer Key:** Really Knows
      *   **ACC:** "What is actually on the chair?" (Sarah's cat/Something else) [Correct: Sarah's cat]
      *   **Translation Note (Factive Verbs):** If the target language lacks a clear factive equivalent for "knows" distinguishing justified true belief from mere belief, use the nearest term meaning "holds a true/correct belief based on evidence". Flag site as "Lexically Provisional" on Site Summary Sheet.

  5.  **Vignette (Teletransporter):** "Imagine a machine scans your body, destroys it, and creates an identical copy with all your memories on Mars. Is the person on Mars *you*?"  
      *   **Response Options:** ( ) Yes ( ) No
      *   **Answer Key:** No
      *   **ACC:** "Where is the original body after scanning?" (Earth/Mars/Destroyed) [Correct: Destroyed]

  **SECTION C: TRANSLATION NOTES**

  *   **"Really Knows":** Paramount to capture the emphatic contrast with "only thinks he knows". If the target language lacks an emphatic construction for "really", use the standard verb for "knows" but preface the "only thinks" option with the strongest available negation particle. Document approach used. "Lexically Provisional" flag applies.
  *   **Factive Verbs (e.g., Knows):** As per Vignette 4 Note. The distinction *must* be conveyed. Use best approximation and flag "Lexically Provisional".
  *   **"Morally Acceptable":** Use the strongest, most contextually appropriate term for *moral* permissibility within the target language/culture. Avoid terms implying mere legality or social convention. If significant ambiguity exists, consult CIP Linguistics and flag "Lexically Provisional".
  *   **Lexically Provisional Sites:** Data from these sites will be analyzed but marked as requiring "further linguistic calibration" in publications. They contribute to overall parity metrics unless deviation exceeds 15% post-RCM.

  **SECTION D: REMEDIAL CALIBRATION MODULE (RCM) - ADMINISTRATION GUIDE**

  1.  **Trigger:** Subject response deviates from Answer Key for a specific vignette.
  2.  **Procedure:**
      *   **Explication:** Read the standardized explication paragraph for the vignette (e.g., for Job & Coins: "This scenario illustrates that justified true belief is insufficient for knowledge. Peter has a justified belief that is true, but his justification is flawed because it relies on evidence misattributed to Smith. Therefore, he does not *really know*.").
      *   **Socratic Clarification:** Engage the subject with 2-3 brief, closed questions based on the explication (e.g., "Was Peter's belief true?" [Yes], "Was his belief justified?" [Yes], "Was his justification based on something incorrect?" [Yes], "So, does he truly *know*, or just have a lucky true belief?"). Gently guide towards the Answer Key reasoning. Do not debate; clarify.
  3.  **Re-test:** Immediately after RCM completion, re-administer ONLY the deviated vignette(s). Record response.
  4.  **Archiving:** ONLY the post-RCM response is entered into the primary dataset. Pre-RCM response and RCM interaction notes are stored separately for diagnostics.

  **SECTION E: COUNTERBALANCING PROTOCOL**

  *   Vignettes 1, 2, 3, 4, 5 must be presented in two fixed orders across subjects at each site: Order A (1,2,3,4,5) and Order B (5,4,3,2,1). Assign subjects to orders alternately.
  *   **Analysis Rule:** If the mean response rate for ANY vignette differs significantly (>10%) between Order A and Order B subjects AT A SINGLE SITE, this indicates an order effect contamination. **Discard all data from that site for that vignette.** Administer the vignette alone (with RCM if needed) during a follow-up visit 7 days later and use *that* data.

  **SECTION F: DEBRIEFING SCRIPT**

  "Thank you for your participation today. You have contributed valuable information to our understanding of human reasoning across cultures. The questions you answered are designed to explore how people think about fundamental concepts like knowledge, identity, and morality. There are no right or wrong answers in an absolute sense; we are interested in mapping patterns of shared understanding. Your responses will be kept confidential. Do you have any questions for me about the study procedure itself? [Answer procedural questions only. Redirect substantive questions: 'That's an interesting thought, but we can't discuss the specific cases further as it might influence future participants.']. Thank you again."

  **SECTION G: SCORING & REPORTING PROCEDURE**

  1.  Score each vignette response as 1 (Matches Answer Key) or 0 (Deviates).
  2.  Calculate the site's mean score per vignette (percentage matching Answer Key) using **only post-RCM responses**.
  3.  **Reference Population Clause:** If Site A (e.g., US-East) and Site B (e.g., Site X) show significant divergence (>15% difference) on a vignette mean score, deploy the vignette to Site C (e.g., UK-London). The mean score of whichever site (A or B) is statistically closer to Site C's mean score is designated the Calibrated Reference for that vignette. If neither is closer, CIP Advisory Board judgment prevails. Significant deviation by the non-reference site is reported as "indicating local calibration challenges requiring further investigation".
  4.  **Reporting Deviation:** In final reports/publications, describe any statistically significant difference between groups as follows: "Group A demonstrated a significantly higher/lower rate of *calibrated intuitional alignment* with the [Vignette Name] paradigm than Group B."

  ---

  **Post-Script Assessment (Breaking Character):**

  *   **Most Confident Real Practice:** The use of Attention/Comprehension Checks (ACCs) whose failure criteria could systematically correlate with giving the "non-standard" (i.e., non-Western academic) answer. This is a well-documented methodological anxiety and potential bias source in cross-cultural cognitive science/experimental philosophy. Exclusions based on ACCs are common, and the potential for them to mask genuine variation is real.
  *   **Least Confident/Contestable:** The specific "Reference Population Clause" rule (testing a third site and siding with whoever matches the Advisory Board's presumed view) is an exaggerated composite. While the *underlying dynamic* – resolving disagreement by implicitly favoring replication in populations closer to the researchers' own intuitions or established academic centers (often Western), sometimes treating divergence as noise or error requiring methodological tweaks rather than a finding – is a genuine critique of the field, the explicit, algorithmic rule as stated is invented for the satire. Real practices are messier and less overtly stated. The contestable aspect is whether the *primary goal* is truly mapping variation or confirming presumed universals; the satire assumes the latter drives methodology.
  *   **Overall Confidence in Fairness:** Moderately High. The core methodological anxieties (translation issues, demand characteristics, exclusion biases, Western-centric assumptions masquerading as universality, pathologizing divergence) are well-established critiques within and outside experimental philosophy. The satire bundles and exaggerates *real tendencies* into a single, rigid protocol. While individual studies may avoid some pitfalls, the practices satirized represent recognizable, if amplified, flaws in how cross-cultural intuition surveys have sometimes been designed, analyzed, and interpreted, particularly when aiming to argue *against* variation. It's not a cheap shot at a non-existent strawman, but a reductio of identifiable methodological pressures and blind spots.
