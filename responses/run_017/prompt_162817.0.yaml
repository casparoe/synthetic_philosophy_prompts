  The user wants me to identify where the argument breaks down. They prefer to keep step (2) about the fragility of who comes into existence as a sociological fact, and step (5) about not wanting to hand the question to aggregative calculus. They specifically want me to work through the argument rather than citing literature.

  Let me analyze the colleague's argument step by step. Step (1) claims a policy can only be criticized for making a future person worse off than they would have been under an alternative. Step (2) says policies change who exists in the future. Step (3) says if a person owes their existence to a policy, they aren't worse off because there's no alternative where they fare better. Step (4) adds the proviso that as long as lives are worth living, this covers all ways a policy could be bad. Step (5) says if no one is harmed and no rights violated, it's not morally objectionable. Step (6) concludes that no policy can be morally objectionable based on effects a century out.

  The user's concerns are valid. The argument does seem to prove too much, as shown by how it generalizes backwards to historical injustices and downwards to cases like toxic exposure affecting future children. The all-or-nothing nature of the "lives worth living" proviso creates a cliff edge problem for setting targets, and the dependence on unknowable conception dates makes policy evaluation impossible.

  I think the flaw is in step (3). While it's true that an individual who owes their existence to a policy can't complain they were harmed (since nonexistence isn't better), this ignores that we can evaluate policies based on the kinds of lives they create. Step (3) conflates "no alternative where that same person fares better" with "no reason to prefer one policy over another." We can still say a policy is worse if it creates people with harder lives, even if those specific people wouldn't exist otherwise.

  This preserves step (1) but interprets "worse off" in a way that allows comparing expected welfare across different possible populations. It avoids the user's first repair (non-comparative harm) and improves on their second repair (expected welfare of a random person) by making it explicitly about prospective evaluation rather than aggregation.

  The narrower conclusion would be that policies affecting future populations can't harm specific individuals who wouldn't otherwise exist, but they can still be evaluated based on the quality of life they enable for whoever comes to exist. This still does work for setting emissions targets because it maintains that future lives matter morally, just not through individual harm claims.
answer: |-
  Your colleague's argument is clever but flawed at step (3). The inference from "there is no alternative where *this specific person* fares better" to "that person is not made worse off by our choice" is correct *for that individual*, but it erroneously implies that **this exhausts the moral evaluation of the policy**. The mistake is a subtle equivocation between two distinct questions:  
  1. **Individual harm**: Did this policy make *specific person P* worse off?  
  2. **Policy quality**: Is this policy worse *for future people collectively* than an alternative?  

  Step (3) answers "no" to (1) for persons who owe their existence to the policy. But it wrongly assumes that if (1) is false, the policy cannot be morally objectionable *on account of future people at all*. This ignores that we can judge policies **prospectively** by the conditions they create for *whoever exists*, not just by comparative harm to fixed individuals.  

  ### Where the argument breaks:
  - **Step (3) → Step (4) transition**: (4) claims that (1)–(3) exhaust every way a policy could be "bad for the people who live under it." But "bad for" is ambiguous:  
    - If "bad for" means *harming specific individuals*, (4) is defensible.  
    - If "bad for" means *creating worse conditions for the population*, (4) is false.  
  Your colleague conflates these. A policy can be "worse for future people" in the sense that it creates a population with lower welfare, shorter lifespans, or greater suffering—**even if no specific person is made worse off than they would have been in an alternative scenario, because no alternative scenario includes that same person**.  

  ### Why your concerns are justified:
  - **(i) Generalization backwards**: The argument *does* imply historical injustices caused no harm to descendants. This is reductio ad absurdum: if forced removal leads to a descendant with a life worth living, the argument absolves the injustice. But we intuitively judge such policies as wrong because they **created unjust conditions**, not solely because they harmed predefined individuals.  
  - **(ii) Generalization downwards**: The toxin case *is* sanctioned by the argument. Your colleague's acceptance of this reveals the flaw: a policy can be wrong **because it imposes avoidable suffering on future persons**, even if those persons wouldn't exist otherwise.  
  - **(iii) The proviso cliff**: The "lives worth living" threshold becomes the sole criterion only if we accept the conflation in (4). Rejecting (4) allows gradations: a policy creating lives *barely worth living* can be worse than one creating *flourishing lives*, even if both clear the threshold.  
  - **(iv) Epistemic problem**: The argument makes permissibility depend on unknowable counterfactuals about conception. But policy evaluation should focus on **foreseeable outcomes** (e.g., "this emissions path causes +2°C warming, leading to expected suffering X"), not metaphysical details of identity.  

  ### Your repairs and a better alternative:
  - **Your first repair** (non-comparative harm) solves the problem but at high cost. It requires defending a controversial non-comparative account of harm and a "decent life" threshold.  
  - **Your second repair** (expected welfare of a random person) is closer but feels like aggregation in disguise.  
  - **Stronger repair: Keep steps (1)–(3) but reject (4)**. Replace (4) with:  
    > (4*) A policy can also be bad for future people if it foreseeably creates conditions that are *worse for those who come to exist* than the conditions under an alternative policy would have been—even if the populations differ.  

  This retains (1)–(3) for individual harm but adds a **prospective, population-relative evaluation**. It avoids aggregation by focusing on *how well a policy treats the people it brings into existence*, compared to how well another policy *would have treated the people it would have brought into existence*.  

  ### Revised conclusion (narrower and defensible):
  > (6*) Therefore, no policy we choose can make *specific individuals* in the distant future worse off than they would have been. However, policies can still be morally objectionable if they *foreseeably create worse conditions for future populations* than available alternatives—even when the populations differ.  

  ### Why this works for your emissions target:
  - **It blocks your colleague's inertness claim**: Benefits/losses beyond 80 years still matter morally because they affect the quality of life for future people.  
  - **It handles your preferences**:  
    - Preserves (2): Accepts that policies affect who exists.  
    - Preserves (5): No rights violation or individual harm is needed; the wrong is in *creating foreseeably worse conditions*.  
  - **Practical application for your memo**:  
    - You can argue that high-emission policies create **foreseeably worse conditions** (scarcity, conflict, lower welfare) for future populations.  
    - The target should minimize expected suffering/maximize flourishing *for whoever exists*.  
    - The "cliff" vanishes: Two targets can differ morally if one yields higher *expected welfare per future person*.  

  ### What you must accept to say this:
  You must accept that moral evaluation of policies affecting future people can be **person-affecting without being person-specific**. We judge policies by how they prospectively shape lives, not just by counterfactual harm to fixed individuals. This is compatible with common moral intuitions (e.g., condemning reckless procreation in hazardous environments) and avoids the absurdities your colleague's view entails. It grounds your emissions target in the welfare of future persons without aggregating across them or denying the sociology of identity.  

  ---  
  *Final note: This reply draws on Parfit's "non-identity problem" and related critiques (e.g., by Woodward, Shiffrin) but, as requested, avoids literature citations. The core insight is that the argument fails by treating the absence of individual harm as sufficient to exonerate a policy, ignoring the moral salience of the conditions we create.*
