prompt: |-
  Hey, I'm hoping you can settle something I keep going in circles on. Full disclosure: I have zero philosophy background, I write backend services for a living, and this whole thing started because a friend mentioned the phrase "moral luck" at a barbecue and I went home and read about it (Nagel? Williams? those are the names I keep seeing) and then couldn't stop noticing that my own industry seems to run on two flatly opposite views about luck at the same time. So: what does the package of practices I'm about to describe actually presuppose about responsibility and desert — is there one coherent view underneath it, or is it just a contradiction we've all agreed not to look at?

  The setup at my company (about 400 engineers, and I'm pretty sure this is bog standard across tech). Three things, all official:

  - Blameless postmortems. Any incident above a certain severity gets a writeup, and the hard rule is that we never name an individual as the cause. We look for contributing conditions instead. People are explicitly told they won't be punished for what they did, so they should be totally candid about it. The justification we say out loud is basically: the person who ran the migration at 4pm was operating inside the system we all built, with the information and incentives they had, and any of us would have done the same thing in their chair.
  - Impact-based promotion. The top performance rating is essentially "impact," assessed on shipped outcomes. Concretely, last cycle two engineers on neighbouring teams made more or less the same change — swapping a synchronous dependency call for a queue. One happened to ship two weeks before a marketing push nobody had warned her about, the queue absorbed a 10x traffic spike, and it's now in a VP's slide deck as having "saved the launch." The other shipped into a service that got deprioritized a month later, so his change is sitting there doing nothing anyone can measure. As far as I can tell, same skill, same care, same review process. She got promoted; he got "meets expectations," and his manager told him privately that the work was good but "didn't land."
  - A no-heroes norm, which is the one that really confuses me. Incident review actively discourages praising whoever fixed the outage at 3am. We're told not to celebrate that person, on the grounds that being the one who got to be the hero is mostly a matter of who was on call that week and which service happened to break — and that rewarding it incentivizes people to keep systems fragile. So we refuse to hand out credit for a good outcome when the *opportunity* to produce it was luck, while at the same time we hand out promotions based on outcomes.

  Here's what I can't work out. The postmortem policy sounds like the thing I was reading about, the control principle-ish idea that you can't be blameworthy for what wasn't up to you — but a friend of mine says that's a misreading, and that blameless postmortems are just epistemic humility (in a system that complicated we can't reliably trace outcomes back to individual choices, so we decline to punish even if the person genuinely deserves it) and have nothing to do with luck as such. And she says the same move might save the promotion system too: maybe we grade on outcomes not because outcomes are deserved but because grading on anything else is unmeasurable, or because we're setting incentives rather than handing out desert. I sort of think she's right about the second one but not the first, but I genuinely can't tell, and I also can't tell whether the no-heroes rule is the deepest clue here or a red herring — it seems to care about luck one step earlier than the promotion system does, and I don't know if that makes it consistent with the postmortem policy or consistent with nothing.

  I'd really like you to commit rather than give me a menu: tell me which reading you actually think is right, which of the three practices is the odd one out (if any), and what we'd have to change in our process if we took the control-based view seriously all the way down — or if we decided outcomes really do matter to merit. Also flag the part you're least confident about, and whether the whole thing is just philosophically underdetermined, i.e. whether more than one theory would license all three practices. Lead with your bottom line in the very first sentence, then give me the reasoning, no preamble and no restating my question back to me.
reasoning: |-
  Okay, let me tackle this user's query. They're a backend engineer who got into moral luck after a barbecue chat. Now they're confused about how their company's practices—blameless postmortems, impact-based promotions, and no-heroes—fit together philosophically. Specifically, they want to know if there's a coherent view or a contradiction they're ignoring.

  First, I need to recall moral luck concepts. Nagel and Williams discuss how luck affects moral judgments. The control principle says we shouldn't blame/praise for things outside one's control. But in practice, we do. That's the tension.

  Looking at blameless postmortems: The user mentions they avoid blaming individuals, focusing on systemic factors. This seems aligned with the control principle. If the root cause is the system, not the person, then blaming them is unfair. But their friend argues it's about epistemic humility—complex systems make it hard to pinpoint blame. Which is it? I think both play a role, but the control principle is more foundational here. The policy explicitly says "any of us would have done the same," implying the action was determined by circumstances, not personal failure. So it's about luck in the situation, not just not knowing.

  Then impact-based promotions. The example shows two engineers doing identical work, but one's impact was huge due to a traffic spike (luck), leading to a promotion. The other got no credit. Here, the company rewards outcome, not effort or intent. This contradicts the control principle because the promotion depends on luck. The user's friend suggests it might be about measurability or incentives, not desert. That's plausible. Companies prioritize results, even if influenced by luck, because they need to drive business outcomes. But philosophically, it clashes with blameless postmortems. If you excuse failure due to luck, why reward success due to luck?

  The no-heroes norm is interesting. They discourage praising the person who fixes an outage because being on call is luck. This seems consistent with the control principle—don't reward based on lucky opportunities. But then why reward based on lucky outcomes in promotions? The no-heroes rule cares about the luck of the opportunity, while promotions care about the luck of the outcome. The inconsistency is that the company rejects rewarding luck in one context but embraces it in another.

  So, the blameless postmortems and no-heroes both align with rejecting moral luck, but impact-based promotions embrace it. The odd one out is promotions. If they applied the control principle consistently, promotions would focus on controllable factors like code quality or process adherence, not impact. But that's hard to measure. Alternatively, if they fully embraced outcome-based desert, they'd need to justify why luck in success is rewarded but luck in failure isn't punished. That seems inconsistent.

  The user wants a committed answer. Bottom line: The practices contradict, with promotions being the outlier. To align with the control principle, they'd need to decouple promotions from luck-influenced outcomes. But that's impractical. Hence, the tension persists because organizations prioritize incentives and measurability over philosophical consistency.
answer: |-
  **Bottom line: Your company's practices contain a fundamental contradiction—blameless postmortems and no-heroes norms reject outcome-based responsibility due to luck, while impact-based promotions explicitly reward it—making impact-based promotions the philosophically incoherent outlier.**

  ### The Core Tension
  1. **Blameless Postmortems** align tightly with Nagel/Williams-style *rejection of moral luck*. By refusing to assign blame for failures caused by factors outside individual control (system design, information gaps, timing), your policy implicitly endorses the **control principle**: moral responsibility requires control over outcomes. Your friend's "epistemic humility" argument doesn't hold—the policy *explicitly* states "any of us would have done the same," emphasizing circumstantial luck, not just uncertainty.

  2. **No-Heroes Norm** extends this logic further. It rejects *rewarding* outcomes (fixing an outage) when the *opportunity* to act was luck-dependent (being on-call during a crisis). This isn't just about incentives; it's a direct application of the control principle to *praise*. Celebrating the hero would imply they deserve credit for a lucky break, which the policy rightly identifies as philosophically inconsistent and practically harmful.

  3. **Impact-Based Promotion** flatly contradicts 1 and 2. It rewards engineers for *outcomes* (e.g., a change saving a launch) heavily influenced by luck (unpredictable traffic spikes, shifting priorities). This embraces **consequentialist desert**—you deserve rewards based on results, regardless of control. Your friend's "incentives/measurability" defense is pragmatically valid but philosophically inconsistent with the other policies. If outcomes are too luck-laden to blame/praise in incidents, they cannot coherently determine merit in promotions.

  ### Which Practice Is the Odd One Out?
  - **Impact-based promotion** is the outlier. Blameless postmortems and no-heroes share a unified "anti-luck" foundation. Promotions break ranks by rewarding fortuitous outcomes while failures are excused by the same luck mechanics.

  ### Fixing the Incoherence: Two Paths
  **A. Fully Embrace the Control Principle (Anti-Luck):**
     - **Change promotions:** Evaluate *effort, skill, and process adherence* over outcomes. In your example, both engineers would receive equal recognition. Metrics: code quality, design rigor, peer feedback, documentation.  
     - **Risk:** Harder to quantify, may feel "unfair" to those with high-impact wins.  
     - **Consistency:** Aligns with postmortems/no-heroes by decoupling merit from luck.

  **B. Fully Embrace Outcome-Based Desert:**
     - **Change postmortems:** Allow blame for preventable failures (e.g., ignoring known risks).  
     - **Scrap no-heroes:** Celebrate incident responders (with safeguards against perverse incentives).  
     - **Risk:** Demotivates transparency, amplifies anxiety, ignores systemic factors.  
     - **Consistency:** Rewards/punishments track results, luck be damned.

  ### Weakest Confidence & Underdetermination
  - **Least confident:** Whether "epistemic humility" alone *could* theoretically justify all three practices. In strict philosophy, no—but pragmatically, your company might *claim* postmortems/no-heroes are about uncertainty while promotions are about incentives, dodging the luck question. This feels like a cop-out, but organizations often thrive on such fictions.  
  - **Underdetermined?** Yes—multiple theories *could* be stretched to cover all three (e.g., rule utilitarianism prioritizing systemic resilience). But **no major ethical framework licenses the specific contradiction here**: punishing/blaming based on luck is rejected, while rewarding based on luck is embraced.

  ### Practical Recommendation
  Your processes prioritize *systemic resilience* (postmortems/no-heroes) but *business outcomes* (promotions). To reduce hypocrisy:  
  - **Demote "impact" in promotions:** Make it 30% of the criteria, balanced with peer-assessed craftsmanship.  
  - **Acknowledge luck openly:** In promotion reviews, explicitly discuss how external factors influenced outcomes ("X's work was skillful, but the launch traffic was unpredictable").  
  This won’t resolve the philosophy, but it surfaces the tension—which is healthier than pretending it doesn’t exist.
