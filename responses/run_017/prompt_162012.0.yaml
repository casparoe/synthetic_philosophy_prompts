  Here's where I've got to. As I understand it, the money pump argument is basically a Dutch book in different clothes: the entire force of it is that a cyclic or time-inconsistent agent can be made strictly poorer — literally fewer pounds in the bank at the end than she began with — and *that* is what makes her irrational. Irrationality just is being exploitable for cash. If that's right, though, the argument is completely hostage to transaction costs. Take what I've started calling *thin cycles*: Amara is choosing between three holiday lets and her preferences go Paris ≻ Rome ≻ Oslo ≻ Paris, but each step is worth only about 4p to her, whilst the agency's admin cost per swap is 5p. No profit-maximising dealer can ever run the pump on her, so nothing is extracted, so there's no irrationality left to point at. Add a bit of realistic friction and the argument evaporates, surely?

  And I take it the diachronic cases work exactly the same way. Bryony is a hyperbolic discounter but she's *sophisticated* — she knows precisely how her preferences will shift — and she's got a commitment device, so she just locks herself in and nothing can be pumped out of her either. Chidi deliberately plans for his tastes to change (he wants to become the kind of person who likes opera), so his preferences look cyclic across time, but no money changes hands at all. On my reading all three are in identical position: no cash extracted, no irrationality, nothing for the pump to bite on.

