  2. **Bryony (diachronic, sophisticated hyperbolic discounter with commitment):**
     - She has time-inconsistent preferences (e.g., she might prefer a smaller sooner reward over a larger later one when the smaller one is imminent, but if both are in the future she prefers the larger later). However, because she is sophisticated and uses a commitment device, she avoids being pumped. The irrationality of time inconsistency is still present in her underlying preferences, but she avoids the bad outcome by binding herself. So she is not exploited, but the underlying preference inconsistency remains. The money pump argument is often used to show that without commitment, one would be exploited. With commitment, she avoids the exploitation, but the inconsistency in her preferences at different times is still considered irrational by some (though others might argue that sophistication and commitment solve the problem).

