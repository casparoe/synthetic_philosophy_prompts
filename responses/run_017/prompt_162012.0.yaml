  ### Key Clarifications
  - **Amara**: Synchronic cycle (intransitivity). Max extractable £0 due to 5p transaction cost > 4p preference gain. Irrationality score 3 (moderate: flaw exists, but friction prevents real-world impact).
  - **Bryony**: Diachronic cycle (time-inconsistency). Max extractable £0 due to commitment. Irrationality score 2 (mild: flaw exists but is managed).
  - **Chidi**: Not a cycle (planned change). No irrationality; score 1 (minimal: rational strategy).
