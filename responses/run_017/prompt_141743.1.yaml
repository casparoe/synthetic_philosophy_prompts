  - **Case Coverage**: All 9 cases are integrated:  
    - Case 1 (Imperfect match): Q3/Q4.  
    - Case 2 (Crossfade): Q5.  
    - Case 3 (Thinning): Q7.  
    - Case 4 (Order/state): Q9.  
    - Case 5 (Instant emulation): Q1.  
    - Case 6 (Branching): Q2.  
    - Case 7 (Speed-up): *Omitted* (no major position distinguishes it; all functionalists/reductionists accept speed shifts).  
    - Case 8 (Gap): Q8.  
    - Case 9 (Never-run): Q6.  
  - **Why Case 7 (Speed-up) was omitted**: Positions don’t split on it. Functionalism/reductionism accept speed changes; biological/gradual-essential views reject uploads outright.  
  - **Minimal Branches**: 9 questions cover all named leaves while filtering incoherences.  

