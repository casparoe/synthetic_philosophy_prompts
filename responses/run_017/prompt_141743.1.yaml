  Below is a clickable decision tree structured to sort users into philosophical positions on mind uploading survival based on concrete case judgments. The tree uses your specified cases and ensures the named positions emerge from combinations of answers. It avoids presupposing labels and focuses on commitments revealed by cases. I've flagged incoherent/unstable combinations and noted where positions collapse without specific cases.

  ---

  ### **Decision Tree: Mind Uploading Survival Positions**
  *(Start at Q1; answer based on concrete cases, not pre-existing labels)*

  #### **Q1: [Case 5 - Instant Emulation]**  
  A brain is destroyed all at once; a neuron-for-neuron emulation starts the next instant. Do *you* (the original person) survive?  
  - **A: Yes** → Proceed to Q2.  
  - **B: No** → Proceed to Q3.  
  - **C: "Survival" isn't binary; it's vague/degree-based** → Proceed to Q8.  

  #### **Q2: [Case 6 - Branching Family]**  
  During gradual replacement, biological units are preserved and reassembled into a working brain, resulting in two conscious candidates (biological and upload). Is *either* "you"?  
  - **A: Yes, both are equally me** → Proceed to Q4.  
  - **B: Only one is me (specify which: biological/upload)** → *Incoherent*. (You accepted non-biological emulation in Q1A but now prioritize substrate. Revise or choose Q2A/Q2C.)  
  - **C: Neither is *me*; they're successors** → Proceed to Q4.  

  #### **Q3: [Case 1 - Gradual Swap with 99.9% Match]**  
  Units are replaced one-by-one with synthetic versions matching input-output functions 99.9% of the time (diverging on rare inputs). Does the imperfection threaten survival?  
  - **A: Yes, especially as more units are replaced** → Proceed to Q5.  
  - **B: No, if core functions are preserved** → *Incoherent*. (You rejected perfect instant emulation in Q1B but tolerate imperfection. Revise or choose Q3A.)  

  #### **Q4: [Case 1 - Imperfect Match]**  
  Same as Q3: Does the 99.9% match threaten survival?  
  - **A: Yes, and it matters more as replacement progresses** → Proceed to Q7.  
  - **B: No, functional match is all that matters** → Proceed to Q6.  

  #### **Q5: [Case 2 - Crossfade vs. Sharp Swap]**  
  In a "crossfade" (output weights ramp gradually), survival occurs. In a sharp swap (instant replacement), it does not. Does this difference matter?  
  - **A: Yes—crossfade preserves survival, sharp swap kills** → **Leaf: Gradual Replacement Essential** (Instant emulation is death; gradualness saves you).  
  - **B: No—if both are functionally identical, outcomes should match** → *Incoherent*. (You require gradualness in Q1B/Q3A but deny its relevance here. Revise to Q5A or Q1A.)  

  #### **Q6: [Case 9 - Never-Run Scan]**  
  A perfect scan exists but is never instantiated. Is this:  
  - **A: Survival (the pattern persists)** → **Leaf: Straight Functionalism/Patternism** (Substrate, gradualness, and continuity irrelevant; survival depends on pattern existence/function).  
  - **B: Death (no instantiation)** → **Leaf: No-Branching Functionalism** (Rejects Q2A; survival requires unique candidate. Functional match suffices if no branching).  
  - **C: Badly formed question** → Proceed to Q9.  

  #### **Q7: [Case 3 - Subjective Thinning]**  
  At 40% replacement, experience feels "thinner" (e.g., colors less vivid) but resolves post-procedure. Is the person surviving during the thinning?  
  - **A: No—subjective continuity is broken** → **Leaf: Biological/Substrate-Dependence** (Rejects non-biological components; you die in uploads).  
  - **B: Yes—it's a change in state, not identity** → **Leaf: Gradual Replacement Essential** (Imperfections threaten functional continuity, but gradualness ensures survival).  

  #### **Q8: [Case 8 - 200-Year Gap]**  
  Brain is destroyed, scanned, and rebuilt after 200 years. Do you survive?  
  - **A: Yes, fully** → *Unstable*. (Reductionists reject binary survival; choose Q8B or Q8C).  
  - **B: Partially/degreed** → **Leaf: Reductionist** (Survival is matter of degree; cases reveal context-dependent thresholds).  
  - **C: No—gap severs identity** → *Unoccupied*. (No major position combines degreed survival with gap-sensitivity).  

  #### **Q9: [Case 4 - Order Effects]**  
  Does survival depend on *order* (cortex vs. brainstem first) or *state* (awake vs. anesthetized)?  
  - **A: Yes—e.g., brainstem first kills "you"** → *Incoherent with reductionism*. (Prioritizes specific biology; choose Q7A).  
  - **B: No—all variants are equivalent** → **Leaf: No Persistent Self** (The "survival" question misdescribes reality; identity is episodic/illusory).  

  ---

  ### **Leaf Positions & Explanations**
  1. **Biological/Substrate-Dependence**: You die in all uploads (Q7A). Requires rejection of functionalism (Q1B) and sensitivity to subjective thinning.  
  2. **Straight Functionalism/Patternism**: Survival with perfect/imperfect function (Q4B, Q6A), accepts branching (Q2A), indifferent to gradualness.  
  3. **Gradual Replacement Essential**: Instant emulation kills (Q1B); gradualness saves (Q3A, Q5A). Imperfections threaten survival (Q3A/Q4A).  
  4. **No-Branching Functionalism**: Survival requires unique candidate (Q2C, Q6B). Functional match suffices if no branching (indistinguishable from straight functionalism except in Case 6).  
  5. **Reductionist**: Survival is degreed (Q1C, Q8B). The original question is partly empty/contextual.  
  6. **No Persistent Self**: The question is misdescribed (Q9B). All cases are equally nonsensical.  

  ---

  ### **Critical Notes & Collapses**
  - **Functionalism vs. No-Branching Functionalism**: Only separable via **Case 6 (Branching)**. Without it, they collapse (both accept instant emulation and functional match).  
  - **Reductionist vs. No-Self**: Separated by **Q9 (Order Effects)**. Reductionists care about degreed continuity; no-self denies continuity entirely.  
  - **Incoherent Combinations**:  
    - Accept instant emulation (Q1A) but deny crossfade survival (Q5A) → Functionalists must reject gradualness.  
    - Reject instant emulation (Q1B) but tolerate imperfect function (Q3B) → Gradual-essentialists require functional fidelity.  
  - **Unoccupied Combinations**:  
    - "Gap-sensitivity + degreed survival" (Q8C + reductionism) → Unattractive; no advocates.  
    - "Order matters + degreed survival" (Q9A + reductionism) → Incoherent; reductionists reject biology-specific thresholds.  

