  The setup is the Bertrand chord thing: pick a chord of a circle at random, what is the probability it is longer than the side of the inscribed equilateral triangle. The three textbook ways of doing it (two uniform points on the circumference; uniform distance from the centre along a randomly chosen radius; uniform midpoint over the disk) give 1/3, 1/2 and 1/4, and the usual moral drawn is that the principle of indifference has no content until somebody hands you a parametrization. Sam thinks he has a fix, which he calls two-level indifference. Level one: a parametrization is admissible only if applying indifference to it respects every symmetry the problem statement itself has — rotations, rescalings, and, this is the part he insists on, the answer should not change if you reconceive the chord as the intersection of the circle with a randomly placed infinite line rather than as an object drawn inside the circle. Level two: whenever level one leaves more than one admissible parametrization, do not pick between them; be indifferent at the level of parametrizations and average the induced distributions with equal weights. So for the chord problem, if all three textbook parametrizations survive level one, you get (1/3 + 1/2 + 1/4)/3 = 13/36, roughly 0.36, and that is what you should say.

  I think this just moves the bump under the carpet, and my credence that two-level indifference really delivers a defensible single number here is about 0.3; Sam's is about 0.75. By delivering one I mean: the admissible class can be fixed without an answer being smuggled in through the fixing of it, and the equal-weight averaging over that class is not itself just an unlabelled instance of the same choice-of-parametrization problem. Give me your own number, but the decomposition is the actual point. I'd want rough probabilities on at least these: that there is a fact of the matter about the probability of a random chord at all; that level one narrows things to a single parametrization, and conditional on its doing so, that the narrowing is legitimate rather than question-begging; that if the admissible class is genuinely multiple it is finite and evenly carvable rather than a continuum — because the family of distributions where the midpoint's distance from the centre has density proportional to r to the power k is rotationally symmetric for every k at or above 0 and yields (1/2) to the power k+1, so a uniform mixture over k looks improper and you would need a prior over k, which is where I think the whole thing collapses back into the original paradox, though tell me if I am overegging that; that equal-weight mixing has some independent rationale, something like model-averaging or scoring-rule arguments, rather than being a shrug with an equals sign after it; and that 13/36 is where you would actually land if you applied the rule carefully, as opposed to some other number. One line of justification each, then show me how you are combining them, and if the combination is not a clean product say why. Then: which term are you least confident in, what argument or bit of mathematics would move it the most, and where do you think the 0.3-versus-0.75 gap between me and Sam actually lives — one of the terms above, or something I have not thought to list? Please do not settle for it depends what you mean by probability; I want the number and the route to it.
