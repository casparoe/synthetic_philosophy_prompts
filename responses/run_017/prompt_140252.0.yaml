    Sum cov: 0.275+0.06875+0.06875+0.275=0.6875 → (1/4)*0.6875? Wait no - Price equation uses population average, so E[cov] = (1/4)(0.275+0.06875+0.06875+0.275)= (1/4)(0.6875)=0.171875
