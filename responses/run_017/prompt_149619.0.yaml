answer: |-
  Here's a reconstruction of the implicit theory underlying the current regime, the philosophical tensions within it, and an analysis of the "clearinghouse" proposal – framed for your readers:

  **The Implicit Theory: "The Power & Proximity Principle"**

  1.  **The Foundational Presupposition: Sovereignty Trumps Need.** States possess near-absolute sovereignty over their borders. This is bedrock. No individual, regardless of desperation, has a *right* to *enter* a specific state solely based on their need. Need doesn't create a claim against a particular sovereign entity.
  2.  **The Triggering Condition: Physical Control Creates a Negative Duty.** The fundamental shift occurs when a state exercises *effective control* over an individual within its jurisdiction (territory, territorial waters, detention centers, even interdicted vessels). At that point, a specific, absolute, *negative* duty arises: **non-refoulement.** The state *must not* return the person to a place where they face persecution (or torture, or threats to life/freedom). This duty is:
      *   **Owed to the Specific Person:** It arises from the direct relationship created by the state's exercise of power *over that individual*. It's a duty *to her*.
      *   **Negative & Absolute:** It forbids a specific harmful action (returning her to danger). It is not a positive duty to provide asylum, citizenship, or even long-term well-being. Its absoluteness stems from its grounding in preventing fundamental harm inflicted *by the state's own action* (returning her).
      *   **Grounding:** The duty arises from the state's power over the person *combined* with the specific risk she faces. It's about not *actively causing* her harm by sending her back into persecution. Causation (the state creating the danger) isn't required; *control* plus *knowledge* of the risk is key.
  3.  **The Implicit Goal: Containment & Temporality.** The "durable solutions" language (repatriation > local integration > resettlement) reveals the core assumption: **protection is an exceptional, temporary burden triggered by proximity/control.** The ideal outcome is the person returning home when safe, dissolving the state's specific duty. Resettlement is seen as a generous, discretionary act precisely because the original state's duty *ended* when the person left its control (e.g., through resettlement elsewhere) or the danger ceased.

  **Where the Theory Frays: Contradictions & Underdetermined Questions**

  1.  **Need vs. Presence (The Resettlement Paradox):** Why resettle people *voluntarily* from distant camps? This *looks* like acknowledging a duty based on global *need*. But the state frames it as "generosity." The implicit justification might be:
      *   **Charity/Interest:** Pure humanitarianism or strategic interests (regional stability, alliances).
      *   **Mitigating Future Triggers:** Preventing people from *becoming* their problem later via dangerous journeys.
      *   **Collective Responsibility Lite:** A vague sense of global obligation, but carefully decoupled from the *legal* duty triggered by presence. **This is underdetermined:** The regime doesn't resolve whether resettlement partially acknowledges a need-based duty or is purely discretionary. Both interpretations fit the practice.
  2.  **The Avoidance Machinery:** Interdiction, carrier sanctions, safe-third-country agreements, offshore processing – these are all designed to *prevent* the state from exercising physical control over the individual *within its own jurisdiction*. They exploit the core logic: no control = no non-refoulement duty *owed by us*. If control is established elsewhere (e.g., in a "safe" third country or offshore center), the duty (in theory) shifts. **This fits the theory:** States are avoiding the *trigger* (control), not violating the duty once triggered. The ethical acceptability of these avoidance tactics is a separate, fiercely debated question *outside* the strict legal theory.
  3.  **The Clearinghouse Proposal: Radical Continuity or Revolution?**
      *   **Continuity with Avoidance Logic:** It accepts states' desire to avoid direct responsibility ("burden"). Like safe-third-country rules or offshore processing, it outsources the protection role. Funding attached mirrors states paying for offshore centers or aid in regions of origin.
      *   **Key Differences & Why They Matter:**
          *   **Consent & Agency:** The *individual's* consent to the receiving state is revolutionary. Current schemes offer no choice.
          *   **Portable Rights:** Guaranteeing status, work rights, and a citizenship path *wherever* protection occurs fundamentally challenges temporality and the "exceptional burden" mindset. It leans towards permanence and integration.
          *   **Transparency & Equity:** The public ledger and burden-sharing formula explicitly address global inequity, unlike opaque bilateral deals or ad-hoc resettlement.
          *   **"Buying Out" vs. "Responsible Transfer":** Is the critic right? If State A pays State B to protect Person X, is State A still fulfilling a duty *to X*? The implicit theory says the duty is *owed to X* because State A *controlled* her. Transferring her severs that direct link. The clearinghouse argues it fulfills the *core need* (safety) more efficiently and humanely. **This is the philosophical crux:** Is the duty strictly about *not harming via return* (best discharged by the controller), or is it fundamentally about *ensuring protection* (which could be delegated)? The current regime *implies* the former, but practices like resettlement hint at the latter. The clearinghouse makes the latter explicit. **Verdict:** It's a radical *extension and formalization* of the outsourcing logic already present, but with transformative elements (consent, portability) that challenge the core "control = specific duty" premise.
  4.  **Climate/Statelessness: Breaking the Frame:** Here, the implicit theory collapses.
      *   **No Persecutor:** Non-refoulement (as currently defined) requires persecution by an *actor*. Environmental disaster or statelessness ("no state secures rights") lacks this.
      *   **No "Safe Return":** If home is underwater or permanently uninhabitable, the "temporary protection until safe return" model is nonsensical. "Durable solutions" *must* mean local integration or resettlement – permanence.
      *   **Underdetermined & Unanswered:** The existing regime has *no* coherent answer here. It presupposes a persecutor and a potential safe return. Climate displacement forces the question: Is the duty solely about *not returning to harm* (which could still apply if harm is environmental), or is it a broader duty to provide refuge when no state protects fundamental rights? If the latter, does it arise from control, global justice, or something else? **This is the biggest philosophical gap:** The regime's core concepts (persecution, temporality) simply don't fit this reality. States haven't agreed on new principles, leading to policy limbo and profound vulnerability for these groups.

  **Reporting Philosophical Choices, Not Settled Law/Practice:**

  Your piece should highlight these underdetermined areas where *choices* are being made, often implicitly:

  1.  **The Grounding of Non-Refoulement:** Is it purely about not *actively causing harm* via return (control-based)? Or does it imply a broader, positive duty to *protect* those within control? (The absoluteness hints at the latter, but states resist this interpretation).
  2.  **Resettlement: Generosity or Duty?** Is it discretionary charity/interest, or a partial recognition of a collective responsibility to meet global protection needs unmet by the presence-based system?
  3.  **Avoidance Tactics:** Are they legitimate exercises of sovereignty to avoid triggering a duty, or unethical evasions of a moral responsibility that proximity or capacity suggests? (The law allows them; ethics debates rage).
  4.  **The Nature of the Duty Owed:** Is it strictly *particular* (State A to Person X because State A controls X)? Or is protection a *global good*, with states assigned administrative roles? (The clearinghouse proposal embraces the latter).
  5.  **Temporality vs. Permanence:** Is "return home" the *only* legitimate ideal outcome, making protection inherently temporary? Or is integration/resettlement an equally valid "durable solution," implying a potential path to permanence? (Practice is contradictory; rhetoric favors temporality, resettlement implies permanence).
  6.  **Climate/Stateless Displacement:** What *is* the basis for protection when persecution and safe return vanish? (No consensus exists, making this the most significant unresolved philosophical/policy frontier).

  **Translating for Readers:**

  *   Think of it like a neighborhood watch rule: You don't *have* to let a stranger into your house if they're scared. But if they're already *in your yard*, you absolutely cannot shove them back towards the danger chasing them. That's the core rule.
  *   Governments spend a lot of effort making sure people don't get into their yard (fences, patrols, deals with neighbors). But sometimes, they fly people in from distant camps as a "kind gesture," hinting maybe the danger itself matters, not just the location.
  *   The "clearinghouse" idea is like saying: Every homeowner pays into a fund based on their means. A scared person in your yard can choose to go stay with a *willing* neighbor (anywhere), using that fund, with a guarantee they can build a life there. You've covered the cost, the person is safe and has choices, but they don't stay with you. Is this dodging your responsibility to the person *in your yard*, or a smarter way to keep them safe?
  *   Now imagine the danger isn't a pursuer, but rising water that will never recede. The old rules ("don't push them back," "they'll go home when it's safe") make no sense. We haven't figured out the new rules yet.

  Your piece exposes the deep philosophical fault lines beneath the legal machinery and political rhetoric. The "settled" parts are about avoiding the trigger (control); everything else – the why, the how long, the who owes what to whom when triggers are avoided or when danger isn't persecution – remains contested philosophical and political terrain. The clearinghouse proposal and the challenge of climate displacement force these unresolved questions into the open.
