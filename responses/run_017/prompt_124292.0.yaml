  Okay, the user is a journalist who's been covering psychology and moral science, noticing a pattern in how researchers present cross-cultural moral differences. They describe a two-step process: first, findings are framed as deep, challenging universality; later, the same findings get reinterpreted as shallow (translation issues, different beliefs, etc.). The user wants to know if this maneuver has a name, how to identify it, and what evidence could resolve the depth question.

  First, I need to unpack the pattern. The user mentions that in the initial publication, differences are presented as profound, suggesting cultural relativism. But later, the same authors downplay those differences, attributing them to methodological issues or superficial factors. The user notes this isn't motte-and-bailey because both claims are substantive and incompatible. It's not confirmation bias because both interpretations are supported by evidence. And it's not the standard argument from disagreement since it's about how evidence is handled.

  I recall concepts from metaethics and cross-cultural psychology. Epistemic contextualism involves shifting standards of justification, but that's more about knowledge claims. Underdetermination of theory by data (Quine) fits because the evidence doesn't dictate one interpretation. Interpretive charity in philosophy suggests explaining differences non-confrontationally. Cultural psychology has the unpackaging problem, where researchers struggle to isolate cultural variables. Moral foundations theory might be relevant, but the user is pointing to how findings are interpreted, not the theory itself.

  The closest fit seems to be the "Underdetermination-to-Strategic Ambiguity Maneuver." This involves researchers exploiting the fact that cross-cultural data can support multiple interpretations. They highlight depth when emphasizing cultural variation's significance and shift to shallowness when defending universality or addressing critics. Factors enabling this include the inherent ambiguity in attributing motives across cultures and the lack of clear diagnostic criteria for "depth."

  For diagnostics, the user should look for: unsupported switches between depth/shallow claims without new evidence, inconsistent application of interpretive charity, conflation of descriptive and normative claims, and lack of predictive testing. To resolve a specific case, researchers could use convergent operations (multiple methods), belief-behavior dissociation studies, deep disagreement probes, and causal chain mapping. The key is to test predictions derived from each interpretation rather than relying on post-hoc explanations.

  The user's deeper need is likely a tool to critically assess research without dismissing it outright. They want to distinguish legitimate scientific reasoning from opportunistic framing. Providing clear diagnostics and resolution methods addresses this by empowering them to evaluate claims rigorously.
answer: |-
  Your observation captures a sophisticated and troubling pattern in cross-cultural moral psychology. I'll proceed systematically: first listing candidate concepts, then evaluating their fit, and finally providing diagnostics and resolution strategies. None of the established concepts fully captures this maneuver, so I'll define it explicitly.

  **Candidate Concepts & Their Predictions:**

  1.  **Epistemic Contextualism (in Interpretation):**
      *   *Concept:* Standards for what counts as a "genuine" moral judgment or "deep" difference vary contextually (e.g., justifying publication vs. responding to critics).
      *   *Prediction:* Researchers would explicitly acknowledge shifting standards based on conversational goals. The shift itself wouldn't be hidden; it would be justified as appropriate to the context.
      *   *Does it fit?* **Partial, but insufficient.** The shift happens implicitly and is presented as *discovery* ("we now realize..."), not as a contextual adjustment of epistemic standards.

  2.  **Underdetermination of Theory by Data (Quine-Duhem Thesis):**
      *   *Concept:* Empirical data alone cannot uniquely determine which theoretical interpretation (deep difference vs. shallow explanation) is correct. Auxiliary assumptions are always involved.
      *   *Prediction:* The field would acknowledge the underdetermination explicitly. Disagreements would focus on justifying auxiliary assumptions (about translation, concept equivalence, etc.).
      *   *Does it fit?* **Core enabling condition, but not the maneuver.** Underdetermination *allows* the maneuver but doesn't explain the *strategic shifting* between interpretations without acknowledging the auxiliary assumptions driving the shift. The maneuver exploits underdetermination without owning it.

  3.  **Interpretive Charity (Davidsonian Principle):**
      *   *Concept:* We should maximize agreement or rationality when interpreting others, attributing differences to false beliefs or differing circumstances before attributing radically different values/concepts.
      *   *Prediction:* Researchers would *consistently* apply charity, leading them to *prefer* shallow explanations (different beliefs/circumstances) over deep differences. The "deep" framing for publication would be rare or heavily qualified.
      *   *Does it fit?* **No.** The maneuver involves *rejecting* charity initially (for impact/publication) and then *applying* it later (for defense). Charity is used opportunistically, not as a consistent principle.

  4.  **Unpackaging Culture (Cross-Cultural Psychology Problem):**
      *   *Concept:* Identifying the *specific* cultural element (values, practices, institutions, ecology) causing an observed difference is extremely difficult; "culture" is a complex package.
      *   *Prediction:* Papers would emphasize the difficulty of attributing differences to deep values vs. shallow factors and call for more nuanced methods. Inconsistency would stem from genuine uncertainty.
      *   *Does it fit?* **Partial, but insufficient.** While unpackaging is hard, the maneuver involves *asserting* deep attribution confidently for publication, then confidently *asserting* shallow attribution for defense, without acknowledging the radical shift in confidence or the methodological challenge *as the core explanation for the shift*.

  5.  **Moral Foundations Theory (MFT) "Adjustment":**
      *   *Concept:* MFT posits universal foundations weighted differently across cultures. A difference could be framed as different weighting (deep) or as different application of the same weighting due to context/beliefs (shallower).
      *   *Prediction:* Shifts would be framed *within* MFT's theoretical structure. Discussion would focus on whether context triggers a foundation differently vs. the foundation's weight being absent.
      *   *Does it fit?* **Near-miss.** MFT provides a *language* for the shift ("Is this binding foundation *absent* or just not *triggered*?"), but the opportunistic *maneuvering* between deep and shallow interpretations of the *same data point* for rhetorical effect goes beyond the theory itself. The maneuver isn't unique to MFT.

  6.  **Confirmation Bias / Biased Assimilation:**
      *   *Concept:* Interpreting ambiguous evidence in line with prior beliefs.
      *   *Prediction:* Researchers with universalist leanings would consistently favor shallow interpretations, relativist-leaning ones would favor deep interpretations. The *same researcher* wouldn't shift dramatically on the *same finding* depending on context.
      *   *Does it fit?* **No, as you noted.** The key puzzle is the *intra-personal, context-dependent shift* on the *same finding*, not inter-personal bias based on stable prior beliefs. The evidence genuinely seems to support *both* readings situationally.

  7.  **Motivated Reasoning (Strategic Ambiguity Exploitation):**
      *   *Concept:* Researchers exploit the inherent ambiguity in cross-cultural data to achieve desired rhetorical outcomes (impactful publication, defense against critique).
      *   *Prediction:* Interpretations would shift strategically based on the immediate goal (sensationalism vs. defensibility), leveraging the underdetermination.
      *   *Does it fit?* **Closest, but needs refinement.** This captures the *why* (goal-driven) and the *how* (exploiting ambiguity). However, it needs integration with the specific *nature* of the shift (deep/shallow attribution) and the field's norms.

  **The Unnamed Maneuver: Underdetermination-to-Strategic Ambiguity Maneuver (USAM)**

  *   **Definition:** The opportunistic exploitation of the inherent underdetermination of cross-cultural psychological data concerning the "depth" of differences (deep: value/conceptual divergence; shallow: differing beliefs/circumstances/measurement issues) to strategically frame the *same empirical finding* as either deep or shallow, depending on the immediate rhetorical context (e.g., maximizing publication impact vs. defending against critique or reconciling with universalist commitments), without transparently acknowledging the shift, the underdetermination being exploited, or the auxiliary assumptions driving each interpretation.
  *   **Boundaries:**
      *   *Core:* Requires (1) genuine empirical underdetermination, (2) two viable but incompatible interpretations ("deep" vs. "shallow"), (3) a strategic shift between these interpretations by the same agent/group, (4) driven by contextual rhetorical goals, (5) without explicit acknowledgment of the shift or the exploited ambiguity.
      *   *Not USAM:* Consistent application of one interpretation (even if biased); shifting interpretations based on genuinely *new* evidence; transparently arguing why auxiliary assumptions favor one interpretation over another in a specific context; acknowledging ambiguity and proposing tests to resolve it.
  *   **Why it works in this domain:**
      1.  **The Attribution Problem:** Disentangling "values" from "beliefs about how to achieve values" or "responses to circumstances" is profoundly difficult, especially across cultures.
      2.  **Measurement Equivalence:** Establishing that "moral judgment X" in Culture A measures the *exact same psychological construct* as seemingly similar judgment Y in Culture B is methodologically thorny.
      3.  **Interpretive Charity Tension:** Researchers feel pulls towards both respecting difference (avoiding ethnocentrism) and seeking common ground (charity, universality).
      4.  **Publication & Critique Dynamics:** Framing differences as "deep" is novel and impactful for publication. Framing them as "shallow" is often necessary to defend against charges of methodological flaw, cultural insensitivity, or to salvage universalist theories.
  *   **Clear Case:** A study shows Culture Z is less likely to condemn harmful actions towards distant strangers. For publication: "This reveals Culture Z lacks the fundamental Western value of universal harm avoidance, deeply challenging universality claims." In a subsequent critique response: "Follow-up interviews show Culture Z individuals strongly value general well-being but believe intervening in distant stranger conflicts causes more harm due to complex kinship obligations; the initial measure misfired. No deep value difference exists." No new substantive data justifies the shift; the initial data supported *both* narratives plausibly.
  *   **Near-Miss:** A study finds a difference. The Discussion section *explicitly weighs* deep vs. shallow interpretations, notes the ambiguity, and calls for specific future research (e.g., belief probes) to resolve it. This acknowledges underdetermination and seeks resolution, rather than exploiting it strategically.

  **Diagnostics for Readers:**

  Ask these questions when encountering a depth claim (deep *or* shallow) about a cross-cultural difference:

  1.  **Shift Check:** Has this author (or team) presented the *same empirical finding* differently regarding its depth in different contexts (paper vs. reply vs. op-ed)? If yes, **red flag.**
  2.  **Auxiliary Assumptions Scrutiny:** Does the author *explicitly state and justify* the auxiliary assumptions needed for their current depth interpretation? (e.g., For "deep": Why *must* it be value/concept, not belief? How was conceptual equivalence *rigorously* established? For "shallow": What *specific* alternative beliefs/circumstances are invoked, and is there *direct evidence* for them being the true cause, not just plausible? Is the methodological critique *new* or inherent in the original data?) Lack of explicit justification is a **red flag.**
  3.  **Charity Consistency:** Is the author applying interpretive charity consistently? Do they demand higher standards for attributing shared values to outgroups than to ingroups (or vice-versa, depending on the goal)? Inconsistent standards suggest opportunism (**red flag**).
  4.  **Predictive Power:** Does the author's depth claim generate *testable predictions* beyond the current data? A "deep" claim should predict differences in *other* related judgments/scenarios involving the purported distinct value/concept. A "shallow" claim predicts that changing the specific belief/circumstance should eliminate the difference. Vague claims that don't generate predictions are **weaker/suspect.**
  5.  **Transparency on Ambiguity:** Does the author acknowledge the *inherent difficulty* and ambiguity in making depth attributions in cross-cultural work, or do they present their interpretation as the obvious, only reasonable conclusion given the data? Lack of acknowledgment of ambiguity is a **red flag for USAM potential**.

  **Resolving a Concrete Case: The Kinship vs. Impartial Rule Dilemma**

  *   **Scenario:** Westerners strongly condemn favoring kin over an impartial rule in a sacrificial dilemma. Population P does not condemn it, or even endorses it. Is this deep (different foundational values: kinship loyalty vs. impartiality) or shallow (shared value, but different beliefs about consequences or circumstances)?

  *   **Studies/Evidence Needed to Settle Depth:**

      1.  **Convergent Operations - Multiple Methods:**
          *   *Belief Probes:* Rigorous qualitative interviews and structured surveys within Population P: Do they articulate a *positive value* of kinship loyalty that *trumps* impartiality? Or do they express belief that violating the rule *in this specific context* actually leads to better overall outcomes (e.g., maintaining social harmony, ensuring kin support is available for greater future need)? Do they see the impartial rule itself as less legitimate or binding?
          *   *Scenario Variation:* Present multiple variations of the dilemma: Change the cost to the stranger (minor vs. severe harm), change the closeness/obligation to kin (distant cousin vs. child), change the nature of the rule (minor convention vs. core legal/moral prohibition). A "deep" value difference predicts stable prioritization of kinship across variations. A "shallow" belief difference predicts shifts in response based on the specific costs/benefits/consequences implied.
          *   *Behavioral Measures (if possible):* Can behavior in incentivized games or real-world observations be linked to the dilemma judgment? Does prioritizing kin correlate with other expressions of loyalty/authority values (suggesting deep) or only appear in contexts where specific negative consequences of impartiality are perceived (suggesting shallow)?

      2.  **"Deep Disagreement" Probes:** Present cases where upholding kinship loyalty *clearly* (by P's own stated beliefs) leads to catastrophic, unjustifiable harm to strangers with no countervailing benefit to kin or community. If P still endorses kinship priority, this strongly suggests a deep value difference. If they shift towards condemnation, it suggests their initial response was contingent on (possibly implicit) empirical beliefs about outcomes.

      3.  **Cross-Cultural Conceptual Analysis:** Rigorous linguistic and ethnographic work: Does the *concept* used by Population P for the kinship obligation map cleanly onto the Western concept of "morality" or "obligation" in the first place? Or is it embedded in a different web of concepts (e.g., honor, reciprocity, cosmic balance)? Mismatch suggests potential deep difference *or* measurement non-equivalence.

      4.  **Causal Chain Mapping:** Use process tracing (e.g., think-aloud protocols during dilemma judgment) within Population P. What are the explicit justifications and implicit reasoning steps? Does reasoning consistently start from and prioritize a core value statement about kinship? Or does it focus on anticipated negative consequences of following the impartial rule? The structure of reasoning provides evidence for the underlying driver.

  **Conclusion:**

  The pattern you identify is real and pernicious. It is best defined as the **Underdetermination-to-Strategic Ambiguity Maneuver (USAM)**. It thrives on the genuine methodological challenges of cross-cultural psychology but exploits them opportunistically. Diagnosing it requires vigilance for unexplained shifts in interpretation, unstated auxiliary assumptions, inconsistent application of principles like charity, and lack of predictive ambition. Resolving whether a specific difference is "deep" or "shallow" demands moving beyond single, ambiguous measures to convergent evidence using multiple methods designed explicitly to test the competing interpretations' predictions. The field progresses not by ignoring the ambiguity, but by designing research that reduces it. Your role as a journalist is crucial in highlighting this maneuver and demanding greater methodological and interpretive transparency.
