prompt: |-
  Last night I argued at length with a friend about the so-called gender-equality paradox — the pattern whereby sex differences in science-versus-reading preferences and in STEM participation appear larger in richer, more gender-equal countries. She thinks it settles the matter in favour of free choice under prosperity; I think it is at least as compatible with the thought that removing one set of constraints simply exposes others. We got nowhere, I suspect, because neither of us had said what an explanation of the pattern would have to achieve.

  Fix the purpose as follows: an explanation counts as adequate only if it could tell a government about to fund a careers-guidance or bias-training programme what to expect if the programme works — it must support counterfactuals about a barrier's removal, not merely fit the cross-national scatter.

  Give me exactly five numbered desiderata for such an explanation, one or two sentences each, with no introduction or conclusion. For each: the requirement, the case or finding behind it, and whether it is non-negotiable or a preference of one camp. Draw the cases from these: a country that grows richer and more equal while its gap widens; a gap running one way in engineering and the other in the life sciences within the same country; self-reported interest parting company with measured attainment; women entering a field because of its pay and status rather than its content; children who migrate between countries before adulthood. Where two of your requirements cannot be jointly satisfied, say so inside whichever item it belongs in rather than adding a sixth.
reasoning: |-
  Hmm, the user is asking about the "gender-equality paradox" in STEM fields - specifically why gender gaps in science preferences and STEM participation seem to widen in more gender-equal countries. They had an unresolved debate with a friend about whether this shows free choice emerging under prosperity, or whether it reveals deeper constraints that only become visible when surface barriers are removed.

  The user wants me to provide exactly five numbered desiderata for an adequate explanation of this paradox. Each must include: the requirement, a supporting case from their list, and whether it's non-negotiable or camp-preferential. The explanation must support policy counterfactuals - telling governments what to expect if they remove specific barriers through programs like career guidance or bias training.

  Looking at their required cases: 1) A country where gaps widen as it becomes richer/equal, 2) Divergent gaps in engineering vs life sciences within one country, 3) Disconnect between self-reported interest and actual skills, 4) Women entering fields for pay/status rather than content, 5) Migrant children adapting to new countries.

  I need to craft five tightly focused desiderata. For each one, I'll state the requirement concisely, link it to one of these cases, and tag its negotiability. Since they specified no intro/conclusion, I'll jump straight into the numbered list.

  Key principles I'm considering: The explanation must handle within-country variation (using the engineering/life sciences case), account for motivation vs ability mismatches (using the interest/attainment case), predict migration effects (using the child migrant case), distinguish between constraint removal outcomes (using the economic development case), and address extrinsic motivation (using the pay/status case). 

  I notice potential tension between desiderata 3 and 4 - if migrant children's preferences change but women enter STEM for extrinsic reasons, that creates a conflict about how malleable preferences really are. I'll flag this within item 4 as instructed.

  The user seems analytically rigorous - they're frustrated by debates that don't clarify what counts as good explanation. By focusing on policy-relevant counterfactuals, they're pushing beyond correlation toward causal understanding. This framework should help resolve their stalemate by forcing both sides to specify testable predictions.
answer: |-
  Here are five numbered desiderata:

  1.  **Requirement: The explanation must predict the direction of gap change when economic development and gender equality increase simultaneously.** **Case:** A country growing richer and more equal while its gap widens. **Negotiability:** Non-negotiable. An adequate explanation must account for the core paradox itself, not just correlate with static national differences.

  2.  **Requirement: The explanation must accommodate divergent gap directions across different STEM subfields within the same socio-cultural context.** **Case:** A gap running one way in engineering and the other in the life sciences within the same country. **Negotiability:** Non-negotiable. A monolithic "STEM preference" explanation fails if subfields show opposing sex differences under identical national conditions.

  3.  **Requirement: The explanation must distinguish between the malleability of expressed preferences/interests and underlying aptitudes/skills under changing opportunity structures.** **Case:** Self-reported interest parting company with measured attainment. **Negotiability:** Preference of the "exposing constraints" camp (your view). This is crucial for predicting if removing barriers reveals innate differences or reshapes preferences themselves.

  4.  **Requirement: The explanation must specify whether preferences are intrinsic (driven by field content) or significantly shaped by extrinsic factors (pay, status, perceived barriers), and predict how gap changes when these extrinsic factors shift.** **Case:** Women entering a field because of its pay and status rather than its content. **Negotiability:** Non-negotiable. It directly informs policy impact: bias training (targeting intrinsic bias) vs. status/pay reform (targeting extrinsic drivers) would have different expected outcomes. *This conflicts with Desideratum 3 if intrinsic preferences are assumed fixed.*

  5.  **Requirement: The explanation must predict how early or late exposure to a new socio-cultural environment alters the development of preferences and the subsequent gap.** **Case:** Children who migrate between countries before adulthood. **Negotiability:** Preference of the "free choice" camp (your friend's view). A strong age-effect supports innate/early developmental factors; malleability throughout adolescence supports socio-cultural shaping.
