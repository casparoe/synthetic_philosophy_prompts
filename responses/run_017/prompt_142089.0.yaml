answer: |-
  Below is a structured audit of your friend's analogy, following your requested format. I address each component explicitly, assess the disanalogies, identify smuggled assumptions, deliver a verdict, and propose a better analogy. The argument is self-contained—no names, citations, or hedging.

  ---

  ### **First: Correspondence Table**  
  *(Source Domain: Retired Scientific Theories e.g., Humors/Phlogiston | Target Domain: Folk Psychology (Beliefs/Desires))*  

  | Component               | Source Domain (e.g., Humors)                          | Target Domain (Folk Psychology)                     |  
  |-------------------------|-------------------------------------------------------|-----------------------------------------------------|  
  | **Posits**              | Unobservable entities (e.g., black bile, phlogiston)  | Mental states (beliefs, desires, fears)             |  
  | **Observable Symptoms** | Bodily symptoms (e.g., melancholy, combustion)        | Behavior (speech, actions)                          |  
  | **Predictive Failures** | Failed predictions (e.g., humors don’t explain disease) | Alleged failures (e.g., neuroscience explains behavior without beliefs) |  
  | **Successor Science**   | Modern medicine/chemistry                             | Mature neuroscience                                  |  
  | **Quaintness**          | Archaic texts (e.g., humoral diagnoses)               | Novels/mentalistic discourse (e.g., "she believes...") |  

  ---

  ### **Second: Disanalogies Sorted by Relevance**  
  *Key disanalogies are bolded; noise is minor.*  

  1. **Directionality (Crucial)**  
     - **Work Done**: Destroys the core analogy.  
       - In science, posits *infer* causes from effects (symptoms → humors).  
       - In fiction, beliefs are *stipulated* to generate effects (beliefs → behavior). In reading, beliefs are *interpreted* to assign meaning, not predict behavior.  
       - *Why it matters*: Folk psychology in fiction is generative/interpretative, not predictive. The analogy falsely assumes both domains share a "detective" structure.  

  2. **Nature of Posits (Crucial)**  
     - **Work Done**: Undermines eliminativism’s plausibility.  
       - Beliefs/desires are individuated by *content* and *rational relations* (e.g., "believes P" entails "disbelieves not-P"). Humors/phlogiston lack this.  
       - *Why it matters*: If beliefs are defined by logical roles (not causal jobs), their "failure" is not empirical but conceptual. A neuroscience that ignores content cannot replace the *normative* work of belief-talk (e.g., justifying actions).  

  3. **Normative vs. Explanatory Work (Crucial)**  
     - **Work Done**: Blocks the replacement claim.  
       - Folk psychology enables *normative practices*: promising, blaming, meaning. Science explains *causes*.  
       - Neuroscience might explain *how* a promise occurs, but not *that* it was broken or why it *ought* to be kept.  
       - *Why it matters*: Eliminativism conflates explanation (science) with normativity (social practice). Fiction relies on the latter.  

  4. **Eliminativist Self-Refutation (Conditional)**  
     - Work Done: Weakens eliminativism but doesn’t kill it.  
       - Claim: "Beliefs don’t exist" uses the vocabulary it denies (e.g., "I *believe* eliminativism is true").  
       - *Why it’s noisy*: This is a pragmatic paradox, not a logical one. Eliminativists could treat it as a "cost of transition" (e.g., using "caloric" while advocating for thermodynamics).  

  5. **Utility Without Reference (Crucial)**  
     - **Work Done**: Protects literary practice.  
       - Folk psychology may be *useful* even if non-referential (e.g., contour lines on maps). Fiction uses beliefs to *cohere narratives*, not denote brain states.  
       - *Why it matters*: If the vocabulary’s function is interpretive/stipulative, not ontological, it survives reference failure.  

  ---

  ### **Third: Smuggled Assumptions from Source Domain**  
  The analogy imports these into the target:  
  1. **Individuation by Predictive Role**: Posits (humors) are *defined* by their causal effects. But beliefs are individuated by content (e.g., "belief about letters" vs. "belief about emails").  
  2. **Evidence = Prediction Accuracy**: Retirement requires predictive failure. But beliefs aren’t primarily *tested* by prediction; they are assessed by coherence, rationality, or interpretation.  
  3. **Introduction by Hypothesis**: Posits are inferred to explain data. But belief-talk may be innate (e.g., developmental psychology) or constitutive of meaning (e.g., understanding "pain" requires attributing it).  
  4. **Retirement by Superior Predictor**: Ignores whether a successor can replicate *non-predictive* functions (e.g., normativity).  

  ---

  ### **Fourth: Verdict**  
  **The analogy fails. Your friend’s conclusion does not survive.**  
  - **Claim 1: "Nothing answers to belief-ascription"** → *Plausible but irrelevant*.  
    Neuroscience *might* show no discrete "belief objects." But this doesn’t touch belief-talk’s stipulative/interpretative role in fiction.  
  - **Claim 2: "Vocabulary should be withdrawn"** → **False**.  
    Beliefs/desires are indispensable for normative practices (blaming, promising). Withdrawing them would collapse social cognition, not improve it.  
  - **Claim 3: "Literary practice is on borrowed time"** → **False**.  
    Fiction uses beliefs to *assign meaning*, not predict neural events. As long as humans interpret intentions, novels won’t be quaint.  

  **Where the weight falls**:  
  - The core flaw is the **genre mismatch**. Science predicts; fiction stipulates and interprets.  
  - The third claim collapses because literature doesn’t *use* beliefs as empirical posits.  
  - Even if Claim 1 is true, Claims 2 and 3 fail due to disanalogies in normativity, utility, and directionality.  

  ---

  ### **Fifth: A Better Analogy**  
  **Use "center of gravity" (physics) for folk psychology.**  
  - **How it works**:  
    - The "center of gravity" is a posit that doesn’t exist (no physical point-object), but it’s *useful*: It simplifies calculations, predicts motion, and structures engineering.  
    - Similarly, "beliefs" may not be neural entities, but they coordinate behavior, interpret speech, and ground norms.  
  - **Why it’s better**:  
    - Preserves your friend’s point: Beliefs aren’t fundamental (like gravity isn’t a point).  
    - Protects your practice: We still use "center of gravity" despite knowing it’s shorthand (like fiction uses "beliefs").  
    - Handles normativity: Just as "center of gravity" guides bridge-building, "beliefs" guide promises.  
  - **Other analogies rejected**:  
    - *Color/wavelengths*: Too reductive (colors *are* wavelengths + perception).  
    - *Chess queen*: Too arbitrary (queen’s role is defined by rules, not reality).  
    - *Money*: Too institutional (money requires social contracts).  
    - *Frontiers*: Too conventional (borders are agreed-upon fictions).  

  **Result**: Your friend gets a non-literal ontology for beliefs; you keep the practice. Fiction isn’t quaint—it’s using a tool that does irreducible work, like a physicist using "center of gravity" to design a rocket.  

  ---  
  This audit concludes that the analogy is structurally unsound and that literary fiction is secure. The practice is not degenerate but *autonomous*: it reveals what prediction-centric views miss.
