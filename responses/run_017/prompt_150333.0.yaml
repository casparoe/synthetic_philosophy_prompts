          newP(B2)/newP(BH) = [P0(B2) * (3 * P0(BH)/P0(B2))^0.25] / [P0(BH) * (P0(B2)/(3 * P0(BH)))^0.75]
                            = [ (3 * P0(BH)/P0(B2))^0.25 * (3 * P0(BH)/P0(B2))^0.75 ]   [because P0(B2)/P0(BH) * (P0(B2)/(3 * P0(BH)))^(-0.75) is messy]

