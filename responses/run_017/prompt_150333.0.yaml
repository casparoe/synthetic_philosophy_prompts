          newP(B2) = 3 * newP(BH)   =>   P0(B2) * exp(0.25*λ) = 3 * P0(BH) * exp(-0.75*λ)

          =>   exp(λ) = [3 * P0(BH) / P0(B2)]   [because 0.25*λ - (-0.75*λ) = λ]

          So: λ = log(3 * P0(BH) / P0(B2))

       Then we can compute Z and we have the posterior.

       Alternatively, note that:

          newP(B2) / newP(BH) = [P0(B2)/P0(BH)] * exp(λ) = 3.

          =>   exp(λ) = 3 * [P0(BH)/P0(B2)]

       Then:

          newP(B2) = P0(B2) * exp(0.25*λ) / Z = P0(B2) * [3 * P0(BH)/P0(B2)]^(0.25) / Z
          newP(BH) = P0(BH) * [3 * P0(BH)/P0(B2)]^(-0.75) / Z

