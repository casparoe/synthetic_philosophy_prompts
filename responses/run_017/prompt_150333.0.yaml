prompt: |-
  I'm retired now — 35 years of satellite retrievals and inverse methods, for whatever its worth — and I've been sitting in on a Bayesian epistemology reading group at the local university. Last week they sprang what they called the Judy Benjamin problem on us and I can see why it's a nuisance, but before I read any further into the proposed solutions I want the spec. What should I be demanding of a rule before I look at what anyone's rule does?

  The setup as we had it (I'm not fussy about the canonical numbers, so here's my own version): a soldier parachutes into a territory divided into a friendly zone, Blue, and an enemy zone, Red, and each of those is split into two company areas, call them 2nd Company and HQ. Four cells, she has a prior over all four. Her radio crackles and what comes through is not "you are in Blue" and not even "your chance of being in 2nd Company is now 0.6". It's news about a conditional: given that you're in Blue, your chance of being in 2nd Company's area is three quarters. Nothing is said about the conditional chances inside Red. She's supposed to come out with new probabilities over all four cells.

  So: write me the desiderata. What does a general rule for updating on evidence of that shape have to deliver to count as adequate — for the purpose I fix at the bottom — with the case or consideration behind each requirement, and each one marked as either non-negotiable or just what one camp happens to like. The ones I want you to take a definite position on, and add to as you see fit:

  - It has to collapse to plain conditionalization when the news is simply "A, for certain", and to Jeffrey-style conditioning when the input is a bare new probability over a partition. Is either of those actually negotiable, or are they just the limiting cases that any rule worth discussing recovers automatically?
  - Locality or rigidity or whatever you want to call it: a message that is explicitly about the conditional chances inside Blue shouldn't scramble the conditional odds inside Blue, and my group could not agree whether the same preservation is also required for the odds inside Red, which the message never mentioned. Tell me what the requirement really is and what case would settle it.
  - Order. Two such messages arrive one after the other. Does it matter which I apply first? Is commutativity a genuine desideratum or a comfort blanket people reach for because it's mathematically tidy? If order does matter, say plainly what that means for a rule I'd actually implement.
  - The input isn't a proposition, and this is the bit that bugs me most. A claim about what your own credences should be is not an event in a four-cell algebra and not a fact about the terrain either. So a rule owes me an account of what the object of an update is, not just a recipe for shuffling four numbers. What's owed here and where does it bite?
  - Indicative versus subjunctive. Half the room said a counterfactual version of the message is a completely different problem. Is it, and does one rule have to cover both?
  - Exploitability: various people gesture at Dutch-book or scoring-rule or accuracy arguments. Is not-being-exploitable over time a desideratum or a prejudice? Same question for "be the closest distribution to your old one that satisfies the constraint, under some information distance" — that one smells like the regularization I did for a living and I distrust myself for liking it.
  - Grain: the message uses a partition finer than mine, or coarser. What's a rule obliged to do then.
  - And one of my own, which I can't place: real radios are noisy. Suppose the channel garbles one message in ten and she can't tell whether hers was one of them. Is that a new desideratum, or just the old ones applied to a bigger space? I genuinely can't tell whether it's the same problem wearing a hat.

  Then the part I actually care about: take your own list and tell me which subset of it can't be satisfied together. My suspicion is that the collision is between something like (rigidity inside the partition the message is about) and (the message carrying no news at all about whether you're in that partition) and (conditionalization in the limit) — and that the collision is the point of the example rather than a defect in the candidate rules. But I may have the wrong pair, or the wrong number of pairs. If the impossibility sits somewhere else, say where, and say which single requirement on your list does the most work in knocking candidate rules out.

  Purpose, so the negotiable/non-negotiable marks mean something: I want a rule I could code up and run. Not a theory of ideal rationality for its own sake — something that takes probabilistic, conditional-shaped readings off an instrument or off an expert panel (which is more or less what my old retrieval codes did with an a priori covariance) and returns a posterior, without my having to invent a prior over the messenger's psychology. If a requirement only matters to someone doing foundations of rationality, mark it that way and move on.

  Last, briefly — a line or two each, no scorecard, I'll take that bit to the group: how the minimum-information/minimal-change family, the treat-the-conditional-as-something-with-a-probability-and-conditionalize-on-it family, and the supposing/imaging sort of rule do against your list, and which one you'd actually hand to someone with a noisy instrument and a deadline.
reasoning: |-
  We are given the Judy Benjamin problem: A soldier parachutes into an area divided into four cells:
     - Blue (friendly) and Red (enemy), each split into two: 2nd Company and HQ.
     So the cells: B2, BH, R2, RH.

   Prior: We assume a prior distribution P over these four cells.

   The message: "Given that you're in Blue, your chance of being in 2nd Company is three quarters." 
     In other words, P(2nd Company | Blue) = 0.75.

   We are to update the prior to a posterior based on this message.

   The task: Write desiderata for a general updating rule that takes such conditional probability constraints.

   Let's go through the points:

   1. Collapse to standard rules:
      - When the evidence is "A for certain" (i.e., P(A)=1), then the rule should become standard conditionalization: 
          newP(X) = oldP(X | A).
      - When the input is a new probability distribution over a partition (say, a partition {A_i}), then the rule should become Jeffrey conditioning:
          newP(X) = sum_i oldP(X | A_i) * newP(A_i).

      Both are non-negotiable because they are the basic consistency conditions for updating. Any rule that doesn't reduce to these in the respective limits would be failing in the most fundamental cases.

   2. Locality / Rigidity:
      - The message is explicitly about the conditional chances inside Blue. Therefore, we require that the conditional probabilities *within* the Blue region should be set to the given value. That is:
          newP(B2 | Blue) = 0.75, and hence newP(BH | Blue) = 0.25.

      - What about the Red region? The message says nothing about Red. Therefore, we require that the conditional probabilities within Red remain unchanged? That is, rigidity for Red:
          newP(R2 | Red) = oldP(R2 | Red)
          newP(RH | Red) = oldP(RH | Red)

      However, note: the message does not explicitly mention Red. But by giving information about Blue, it might indirectly affect the probabilities of the whole space, which could change the relative weights of Blue and Red. The rigidity for Red is not directly given by the message. 

      Case to settle: Suppose the prior is such that the soldier is almost certainly in Red. Then the message about Blue might not change much. But what if the prior is uniform? Then after the message, the conditional within Red should remain unchanged? Consider: if we don't require rigidity for Red, then we might end up with a rule that arbitrarily changes the Red conditional probabilities. But the message does not say anything about Red. Therefore, it is natural to require that the update should not change the conditional distribution given Red. This is the principle of minimal change: only change what the evidence directly constrains.

      Conclusion: Rigidity within the mentioned partition (Blue) is non-negotiable. Rigidity within the unmentioned partition (Red) is also required because the evidence is silent about it. This is the principle of "conservatism" or "minimal change". Without it, the update would be underdetermined.

   3. Order:
      - If two such messages arrive (say, one about Blue and then one about Red, or two about the same partition but with different conditionals), does the order of updating matter? 

      Commutativity is a comfort blanket. In general, updating on evidence that is not propositional (and especially when the constraints are not about independent partitions) might not commute. However, if the two messages are about two disjoint partitions (like Blue and Red) then we might hope for commutativity. But note: the message about Blue changes the probability of Blue and Red, so when we then update on a message about Red, we are updating on a partition that has been changed. This is not symmetric.

      Therefore, commutativity is not a genuine desideratum. It is nice when it holds, but it is not required. In practice, when implementing, we would have to specify the order. However, if the two messages are about the same partition, then applying them in sequence might not even be defined (unless the constraints are consistent and the rule is idempotent). 

      We must note: if the two messages are about conditionals in two different partitions that form a product space (like Blue/Red and then within each, a different company partition) then we might hope for commutativity. But in general, it's not guaranteed.

      Verdict: Order matters. A rule should specify how to update sequentially. Commutativity is not required.

   4. The input as a non-proposition:
      - The update is on a constraint on the agent's own credences. It is not a proposition in the world. Therefore, the rule must specify how to interpret such constraints. 

      What is owed: The rule must be defined for any linear constraint (or more generally, for any constraint that can be expressed as an expectation) on the probabilities. The rule must also be consistent with the principle that the update should satisfy the constraint and be as close as possible to the prior in some sense (if we adopt minimal change) or by some other principle.

      Where it bites: In the Judy Benjamin problem, the constraint is linear: P(B2 | Blue) = 0.75. This can be written as: P(B2) = 0.75 * P(Blue). So it's a linear constraint. But what if the constraint is non-linear? Then the rule might not be straightforward.

      For the purpose of coding, we need a rule that can handle linear constraints (at least) without requiring us to model the messenger's psychology.

   5. Indicative vs subjunctive:
      - The message as stated is indicative: it is giving information about the actual world. A subjunctive conditional might be: "if you were in Blue, then your chance of being in 2nd Company would be 0.75". This is counterfactual.

      They are different. The indicative update should only use the constraint to update the probabilities of the actual world. The subjunctive might involve a change in the world (like a counterfactual shift). 

      A rule for updating on indicative conditionals is what we are after. The counterfactual version is a different problem. So we require the rule to handle the indicative case.

   6. Exploitability and minimal change:
      - Dutch book arguments: These are about coherence over time. If an update rule is such that an agent using it can be Dutch-booked, then that might be a problem. But note: updating on conditional constraints might not be covered by the standard Dutch book arguments. 

      However, for a rule to be coded, we want it to be coherent in the sense of avoiding sure losses. Therefore, we require that the rule, when applied sequentially, does not lead to incoherent probabilities (i.e., the posterior must be a probability distribution). But beyond that, avoiding Dutch books over time might be too strong because the update is not on a proposition.

      Minimal change (minimizing some distance) is a natural regularization. It is the approach we used in satellite retrievals. It is non-negotiable for practical purposes because without it, the update is underdetermined. We must choose the posterior that is closest to the prior in some sense (like Kullback-Leibler divergence) subject to the constraint.

      Verdict: 
          - Being a probability distribution: non-negotiable.
          - Avoiding sure losses (coherence) in a single update: non-negotiable.
          - Avoiding Dutch books over multiple updates: desirable but possibly not achievable in full generality? (We mark this as a "foundations" issue, but for coding, we require at least that each update produces a coherent posterior.)

      Minimal change (with KL divergence) is the standard in information geometry and has many nice properties. We require it for the update to be well-defined and for practical implementation.

   7. Grain:
      - If the message uses a partition that is finer or coarser than the agent's, then we must be able to map the constraint to the agent's partition. 

      Example: Suppose the message is about a partition that is coarser (e.g., only Blue and Red) but gives a conditional within a coarser set? Actually, in our case, the constraint is about the partition within Blue. If the agent has a finer partition, then the constraint is directly applicable. If the agent has a coarser partition (e.g., only Blue and Red, without the company split) then the constraint cannot be applied because the agent doesn't have the concept of 2nd Company within Blue. 

      Therefore, we require that the agent's partition must be at least as fine as the one used in the message. Otherwise, the update is impossible. This is non-negotiable: the rule must be applicable only when the constraint is expressible in the agent's algebra.

      But note: the constraint might be about a random variable that the agent doesn't have. Then the agent must first extend the algebra? That's beyond the scope of a simple update rule. So for coding, we assume the constraint is given in terms of the existing partition.

   8. Noisy channel:
      - The channel garbles one in ten messages. This is a new layer: we are uncertain about the message itself. Therefore, we have to update on the event that the message was sent correctly. 

      This is not the same problem. It requires modeling the reliability of the channel. The agent now has a prior over the possible messages and the channel noise. We can handle it by expanding the state space to include whether the message was garbled and what the intended message was. 

      Therefore, it is the old desiderata applied to a bigger space. We mark it as such.

   Summary of desiderata:

     Non-negotiable (for the purpose of coding a rule):
      1. The rule must reduce to standard conditionalization when the evidence is a proposition with probability 1.
      2. The rule must reduce to Jeffrey conditioning when the evidence is a new distribution over a partition.
      3. Rigidity: 
          - Within the partition that the message is about (Blue), the conditional probabilities must be set to the given values.
          - Within any partition that the message does not mention (Red), the conditional probabilities must remain unchanged.
      4. The rule must produce a valid probability distribution.
      5. The rule must be based on minimal change (minimizing KL divergence) to avoid arbitrariness and for regularization.
      6. The constraint must be expressible in the agent's current partition (grain condition).

     Negotiable or for foundations:
      - Commutativity: not required.
      - Avoiding Dutch books over multiple updates: desirable but might be too vague for our purpose. We leave it to foundations.
      - The input as a non-proposition: we have addressed it by requiring the rule to handle linear constraints via minimal change.
      - Indicative vs subjunctive: we are only handling indicative.

     Additional note on minimal change: We require the posterior to minimize the KL divergence (also known as relative entropy) from the prior, subject to the constraint. This is the information-theoretic approach.

   Why the collision?

     The Judy Benjamin problem highlights a conflict between:

       (a) Rigidity for the unmentioned partition (Red): we want to preserve the conditional probabilities within Red.
       (b) The constraint: P(B2 | Blue) = 0.75.
       (c) The principle of minimal change (KL divergence).

     However, it turns out that with the KL divergence approach, the rigidity for the unmentioned partition (Red) is automatically satisfied! Why? 

     The KL divergence minimization subject to the constraint P(B2)/P(Blue)=0.75 (and also that the probabilities sum to 1) leads to a posterior that factorizes in a way that preserves the conditional distributions given the partition {Blue, Red}. Specifically, the conditional distribution given Red is unchanged. This is a property of the KL divergence update on linear constraints that are about conditional probabilities within a partition.

     Therefore, the rule that minimizes KL divergence (also called the maximum entropy update or the minimum relative entropy update) satisfies:

          newP(B2 | Blue) = 0.75,
          newP(BH | Blue) = 0.25,
          newP(R2 | Red) = oldP(R2 | Red),
          newP(RH | Red) = oldP(RH | Red).

     So in this case, there is no conflict.

     However, there is a known issue: the constraint does not specify the probability of being in Blue. The minimal change rule will adjust the probability of Blue and Red in a way that is determined by the prior and the constraint. 

     But note: if we require that the update should not change the odds between regions that are not mentioned? The message is about Blue, so it might change the overall probability of Blue. The rigidity condition we set only requires that the conditional within Red is unchanged, but the overall probability of Red might change.

     Now, what if we also require that the absolute probabilities of the cells in Red remain unchanged? That is:

          newP(R2) = oldP(R2)
          newP(RH) = oldP(RH)

     Then we have a conflict because the constraint might require that the total probability of Blue is increased or decreased, which would have to come from Red. But we cannot hold the absolute probabilities of the Red cells fixed and also change the probability of Blue? 

     However, note: the constraint does not require any particular value for P(Blue). So we don't have to fix the Red absolute probabilities. We only fix the conditional within Red. Therefore, the absolute probabilities of the Red cells may change proportionally to the change in P(Red). Specifically:

          newP(R2) = oldP(R2 | Red) * newP(Red)
          newP(RH) = oldP(RH | Red) * newP(Red)

     And newP(Red) = 1 - newP(Blue). The value of newP(Blue) is determined by the KL minimization. 

     Therefore, the rule we propose (KL minimization) satisfies:

          - The constraint on the conditional in Blue.
          - The rigidity condition for the conditional in Red.
          - And it minimizes the overall change (in the information sense).

     So for the Judy Benjamin problem, the minimal change rule (KL divergence) is the one we want.

     But note: there is a different approach: "conditionalizing on the conditional". This approach treats the constraint as a proposition and then conditionalizes on it. But what proposition? We have to imagine a proposition that says "the conditional probability of B2 given Blue is 0.75". This requires a larger space that includes possible conditional probabilities. And then we have to assign a prior to such propositions. This is what we want to avoid (because we don't want to model the messenger's psychology).

     The minimal change rule does not require such an extended space.

     Another approach: imaging. This is a form of moving probabilities from one cell to another. But it is typically defined for counterfactuals. We are dealing with indicative conditionals.

     Therefore, we recommend the minimal change rule (KL divergence).

     How to compute it for the Judy Benjamin problem:

       We have four cells: B2, BH, R2, RH.

       Prior: p0 = [P0(B2), P0(BH), P0(R2), P0(RH)]

       Constraint: P(B2 | Blue) = 0.75  => P(B2) = 0.75 * P(Blue) = 0.75 * [P(B2)+P(BH)]

       We minimize KL(newP || oldP) subject to:

          newP(B2) = 0.75 * (newP(B2) + newP(BH))

          and newP(B2)+newP(BH)+newP(R2)+newP(RH)=1.

       We can rewrite the constraint as:

          newP(B2) = 0.75 * (newP(B2) + newP(BH))   =>   newP(B2) = 3 * newP(BH)

       So we set:

          newP(B2) = 3 * newP(BH)   ... (1)

       And we have the normalization:

          newP(B2) + newP(BH) + newP(R2) + newP(RH) = 1   ... (2)

       The KL divergence is:

          D = newP(B2)*log(newP(B2)/P0(B2)) + newP(BH)*log(newP(BH)/P0(BH)) 
            + newP(R2)*log(newP(R2)/P0(R2)) + newP(RH)*log(newP(RH)/P0(RH))

       We also require that the conditional probabilities in Red are preserved? Actually, the KL minimization automatically preserves the conditional distribution for the unconstrained parts? 

       How? The minimization will set:

          newP(R2) = P0(R2) * exp(λ)   ? 

       Actually, the constraint only involves the Blue part. The unconstrained part (Red) is free? But note: the constraint is linear. The solution is found by setting:

          newP(B2) = P0(B2) * exp(λ1 * (indicator for B2) + λ2)   [but we have a constraint that relates B2 and BH]

       Alternatively, we can use the method of Lagrange multipliers. It turns out that the posterior must be of the form:

          newP(B2) = k * P0(B2) * α
          newP(BH) = k * P0(BH) * β
          newP(R2) = k * P0(R2)
          newP(RH) = k * P0(RH)

       But note the constraint (1): newP(B2) = 3 * newP(BH). So we have:

          k * P0(B2) * α = 3 * k * P0(BH) * β   =>   P0(B2) * α = 3 * P0(BH) * β   ... (3)

       Also, we have the normalization:

          k [ P0(B2)*α + P0(BH)*β + P0(R2) + P0(RH) ] = 1   ... (4)

       However, we have two free parameters (α, β) but only one equation (3). We need another condition. The minimal change principle in KL divergence requires that we set the multipliers so that the constraint is satisfied with minimal change. But note: the constraint only relates B2 and BH. So we can set:

          α = 3 * γ
          β = γ

       Then equation (3) becomes:

          P0(B2) * 3 * γ = 3 * P0(BH) * γ   =>   P0(B2) = P0(BH)

       This is not generally true. So we must adjust γ. Actually, we can set:

          newP(B2) = k * P0(B2) * 3 * γ
          newP(BH) = k * P0(BH) * γ

       Then from (3): we have:

          k * P0(B2) * 3 * γ = 3 * (k * P0(BH) * γ)   =>   P0(B2) * 3 * γ = 3 * P0(BH) * γ   =>   P0(B2) = P0(BH)

       This is a contradiction unless the prior satisfies that. So we must use a different approach.

       Actually, the constraint is linear and the solution is simpler. We can express:

          newP(B2) = 3 * newP(BH)

          and the probabilities in Red are proportional to the prior:

          newP(R2) = c * P0(R2)
          newP(RH) = c * P0(RH)

          and the Blue part:

          newP(B2) = d * P0(B2)   [but not necessarily]

       The correct method: the KL divergence minimization subject to linear constraints leads to a posterior that is the prior multiplied by factors that are constant on the sets that are constrained. Here, we have one constraint that only involves the Blue cells. The unconstrained cells (Red) are left with the same relative probabilities. So:

          newP(B2) = a * P0(B2)
          newP(BH) = a * P0(BH)
          newP(R2) = b * P0(R2)
          newP(RH) = b * P0(RH)

       But now we have:

          newP(B2) = a * P0(B2) = 3 * newP(BH) = 3 * a * P0(BH)   =>   P0(B2) = 3 * P0(BH)

       This is again a contradiction unless the prior satisfies that.

       The resolution: the constraint does not require that the ratio of the posterior probabilities of B2 and BH is 3:1, but it does require that the ratio of the posterior probabilities of B2 to BH is 3:1. So we set:

          newP(B2) = a * 3 * P0(B2)   [if we try to keep the prior ratios?] 

       Actually, the correct solution is to note that the constraint is:

          newP(B2) = 0.75 * (newP(B2)+newP(BH))   =>   newP(B2) / newP(BH) = 3   =>   newP(B2) = 3 * newP(BH)

       We are free to change the absolute probabilities. So we can write:

          newP(B2) = 3 * t
          newP(BH) = t

          and for Red:

          newP(R2) = s * P0(R2)   [but we want to keep the prior ratios within Red?] 

       Actually, the KL divergence minimization with the constraint of the form of a linear relation on the probabilities leads to a solution where the posterior is:

          newP(i) = P0(i) * exp(μ0 + μ1 * f(i))

       where f(i) is a function that captures the constraint. In this case, we have one constraint: 

          f(B2) = 1, f(BH) = 0, f(R2)=0, f(RH)=0   ??? 

       But that does not capture the constraint. Alternatively, we can write the constraint as:

          newP(B2) - 0.75 * (newP(B2)+newP(BH)) = 0   =>   0.25*newP(B2) - 0.75*newP(BH) = 0.

       So we can set:

          f(i) = 0.25 if i=B2, -0.75 if i=BH, and 0 otherwise.

       Then:

          newP(i) = P0(i) * exp(λ * f(i))   (with a normalization constant)

       So:

          newP(B2) = P0(B2) * exp(0.25 * λ) / Z
          newP(BH) = P0(BH) * exp(-0.75 * λ) / Z
          newP(R2) = P0(R2) / Z
          newP(RH) = P0(RH) / Z

