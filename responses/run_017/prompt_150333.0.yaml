          newP(B2) / newP(BH) = [P0(B2) * (3 * P0(BH)/P0(B2))^(0.25)] / [P0(BH) * (P0(B2)/(3 * P0(BH)))^(0.75)]
                              = [ (3 * P0(BH)/P0(B2))^(0.25) ] * [ (3 * P0(BH)/P0(B2))^(0.75) ]   [because (a/b)^0.75 = (b/a)^(-0.75) but we have the reciprocal]
                              = (3 * P0(BH)/P0(B2))^(1) = 3 * P0(BH)/P0(B2) * ... wait, no.

       Actually, let me simplify:

          = [ (3 * P0(BH)/P0(B2))^0.25 ] * [ (3 * P0(BH)/P0(B2))^0.75 ]   [because (x)^(-0.75) in the denominator becomes x^(0.75) when flipped?]

