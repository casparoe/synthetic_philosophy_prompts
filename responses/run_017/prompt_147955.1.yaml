prompt: |-
  I'm a program officer at a research foundation. We run maybe a dozen review panels a year, each handing out a few million dollars, and the rules are mostly inherited: eight reviewers from the relevant subfield, everyone sees each other's scores before the meeting, we fund whatever a majority puts in the top half. I've been reading about the Condorcet jury theorem and I want to turn whatever in it is actually usable into a procedure my team can run when we set up a panel — not a general essay on collective wisdom.

  What I have in mind: a short ordered checklist covering (a) whether the decision is even the kind of thing the theorem applies to, (b) whether our reviewers are better than chance on this kind of call and how we'd know without a stats department, (c) how badly the independence assumption is being violated and what to do about it — secret pre-votes, withholding scores until after discussion, deliberately mixing subfields — (d) panel size and the point where adding people stops buying anything, (e) when to hand the call to one named person instead of a vote. For each question say what counts as a sufficient answer, where the procedure returns a hard no, and where it has to stop and hand the call to a human because it's a value judgment.

  One thing I'd like built into the middle of it. I've started sorting panel failures into three buckets and I want the procedure to diagnose which one a given panel is headed for: "echo" (everyone anchored on the same first score or the same methodological reflex), "coin-flip" (the case is just hard and reviewers are near chance), and "drift" (errors systematically point one way, e.g. everyone is sceptical of the same kind of method). If that framing is wrong or misses a bucket, say so and fix it. I also suspect there's two different things people lump together as crowd wisdom — averaging scores versus majority on a yes/no — and I want the procedure to be clear about which one it's licensing, and what it says about mixing the two.

  Then run it on three of our real setups: [1] the standard eight-person subfield panel on ordinary proposals; [2] our flagship "transformative" program, where I honestly think reviewers are barely better than a coin flip at picking which weird proposals will pan out — I have a feeling the procedure will tell me something I don't want to hear, that a big panel there is worse than a lottery or a single trusted expert, and I'd rather have it stated plainly than softened; [3] a cross-cutting call where every plausible reviewer comes out of the same methodological tradition with a strong shared view of what counts as rigorous.

  Constraints: reviewers are volunteers with limited time, whatever we do has to be explainable to our board in a paragraph, and I can't ask anyone to estimate probabilities in any formal way. Please also say what the procedure can't tell me — especially for the cases where there's no fact of the matter about which application is "best" and we're really just aggregating preferences.
reasoning: |-
  We are going to design a checklist procedure based on the Condorcet Jury Theorem (CJT) for grant review panels. The CJT states that if each voter has an independent probability p > 0.5 of being correct (better than chance), then as the group size increases, the probability that the majority vote is correct approaches 1. If p < 0.5, then increasing the group size makes the majority vote worse (approaching 0). If p=0.5, the majority is no better than a coin flip.

  The checklist will address:
  (a) Applicability of the theorem to the decision type.
  (b) Reviewer competence (p > 0.5) and how to assess it without formal statistics.
  (c) Independence of reviewers and mitigation strategies (e.g., secret pre-votes, mixing subfields).
  (d) Panel size and diminishing returns.
  (e) When to delegate to a single expert.

  Additionally, we will incorporate a diagnostic for panel failures: "echo", "coin-flip", and "drift". We'll clarify that CJT applies to binary decisions (yes/no) and not to averaging scores. For averaging, we rely on the law of large numbers and Central Limit Theorem, which require independence and that reviewers are unbiased (centered on the true value). But note: the CJT is for binary majority decisions.

  The procedure will also note when we are aggregating preferences (no fact of the matter) versus trying to find a correct answer.

  We'll then apply the procedure to the three scenarios.

  ---

  **Checklist Procedure for Grant Review Panels**

  **Step 1: Decision Type (Binary vs. Non-binary; Fact vs. Preference)**
     - *Question*: Is the decision a binary choice (e.g., fund/not fund) for which there is a factually correct answer (even if we can't know it with certainty) that the panel is trying to uncover? Or is it a ranking or scoring of proposals? 
     - *Sufficient Answer*: The decision is a binary choice (e.g., "Is this proposal worthy of funding?" or "Does this proposal meet the threshold?") and we are trying to make a correct collective judgment (not just aggregating preferences). 
     - *Hard No*: If the decision is about aggregating preferences (e.g., which proposal is more important to the field, which is more aligned with the foundation's mission) without an objective truth, then CJT does not apply. Also, if the decision is multi-choice (e.g., rank 10 proposals) then CJT (which is for binary) does not directly apply. However, note that we can break a ranking into a series of binary comparisons, but that is complex and not covered by the basic CJT.
     - *Stop for Human*: If the decision is not binary, but we are using a majority vote on a threshold (e.g., top half), then we can use CJT for each proposal independently (if we assume that each proposal's vote is independent and binary). But note: the votes are not independent if the panel is ranking a fixed set. Also, if the decision is about preference aggregation (no fact of the matter), then we must acknowledge that and use a different method (e.g., averaging scores might be more appropriate for capturing intensity of preference).

  **Step 2: Reviewer Competence (p > 0.5)**
     - *Question*: Are the reviewers, on average, better than chance at correctly judging the binary question? How do we know? 
     - *Assessment without stats*: 
          - Look at historical data: Do funded proposals from this panel tend to succeed (by some metric)? If we have past data on how individual reviewers' scores correlate with outcomes, use that. But without a stats department, we can use:
              - Consistency among reviewers: If reviewers tend to agree with each other (on the same proposal) more than they disagree, that suggests p>0.5 (if we assume that the majority is more often correct). However, note that agreement can also be due to herding or shared biases.
              - Reviewer expertise: Are they recognized experts in the specific area of the proposal? 
              - Track record: Have they been reviewers before and have their past recommendations generally led to successful outcomes? (But this is hard to track without data.)
          - If we have no data, we can rely on expert nomination and reputation.
     - *Sufficient Answer*: We have evidence of past success of the panel's decisions, or the reviewers are highly specialized experts in the proposal's area. 
     - *Hard No*: If the task is so speculative (e.g., transformative research) that even experts have no better than a coin-flip record, then p<=0.5 and CJT says a large panel is worse. Also, if the reviewers are not experts (e.g., they are from a different field) then p might be <=0.5.
     - *Stop for Human*: When we suspect p>0.5 but have no data, we proceed with caution. If we are unsure, we might need to adjust the panel composition or decision method.

  **Step 3: Independence**
     - *Question*: Are the reviewers' judgments independent? Or are they influenced by each other or common biases?
     - *Mitigation*: 
          - Use secret pre-meeting votes (to avoid anchoring).
          - Withhold scores until after initial discussion (but then vote again?).
          - Deliberately mix subfields or methodological backgrounds to break up groupthink.
          - Avoid having a dominant reviewer speak first.
     - *Assessment*: 
          - Check for herding: Do scores change after discussion? If so, pre-discussion scores are more independent.
          - Check for shared biases: Are all reviewers from the same school of thought? If so, they may have correlated errors.
     - *Sufficient Answer*: We have taken steps to ensure independence (e.g., secret pre-votes, diverse panel) and there is no obvious common bias.
     - *Hard No*: If the panel is composed of reviewers who all share a strong bias (e.g., against a certain method) that systematically distorts their judgment, then independence is violated and errors are correlated (leading to drift). Also, if the panel is too small and dominated by one individual, independence is violated.
     - *Stop for Human*: When we cannot achieve independence (e.g., the entire field shares a bias) and we must decide whether to accept that bias or seek external input.

  **Step 4: Panel Size and Diminishing Returns**
     - *Question*: How many reviewers do we need? When does adding more stop helping?
     - *Guidance from CJT*: 
          - The probability of a correct majority vote increases with group size if p>0.5, but the marginal improvement decreases. 
          - A rule of thumb: For p around 0.6, 5-7 reviewers get you above 80% chance of correct decision. For p=0.7, 3-5 might be enough. 
          - Diminishing returns set in quickly: beyond 10-15 reviewers, the gain is very small (unless p is very close to 0.5). 
          - We can use a table (if available) or a simple formula: the probability of a correct majority is given by the binomial distribution. Without a stats department, we can use:
              - For p>0.5, the chance of a correct majority vote increases with n, but after about 10-15, the gain is minimal.
              - For p=0.5, adding reviewers doesn't help (remains 50%).
              - For p<0.5, larger groups are worse.
     - *Sufficient Answer*: We have at least 5 reviewers and p>0.5. The panel size is between 5 and 15. 
     - *Hard No*: If p<=0.5, then a panel of more than 1 is worse than a single person (if that person has p>0.5). Also, if the panel is too small (e.g., 2) and p is not high, the majority might not be reliable.
     - *Stop for Human*: When we are unsure of p, we might choose a conservative panel size (e.g., 7-9). Also, when the cost of adding reviewers (time, money) outweighs the benefit.

  **Step 5: When to Delegate to a Single Expert**
     - *Question*: Is there a situation where a single expert is better than a panel?
     - *Conditions*:
          - If p>0.5 but the panel size is too small to get a high probability (e.g., n=3, p=0.6 gives only about 65% correct) and we have one expert with very high p (say 0.8), then the expert might be better.
          - If p<=0.5 for the panel (but we have one expert with p>0.5), then use the expert.
          - If independence is impossible (e.g., the entire field is biased) and we know one expert who is unbiased and competent, use that expert.
          - In transformative research (where p is low for the panel) and we have a trusted expert who has a track record of spotting transformative ideas (p>0.5), then delegate.
     - *Sufficient Answer*: We have a trusted expert with a known high p (e.g., past successful picks) and the panel conditions (p and independence) are poor.
     - *Hard No*: If we don't have any individual with p>0.5, then even a single expert is not better than chance. Also, if the panel has high p and independence, then a single expert is worse than the panel.
     - *Stop for Human*: When we are unsure about the expert's p or if the decision requires multiple perspectives (even if p is moderate) to avoid blind spots.

  **Diagnosing Panel Failure Modes**

  During the panel setup and after the review (if possible), we look for:

  - **Echo**: Reviewers converge on the same initial score or reflex. *Indicators*: Scores change little after discussion; first speaker dominates; high pre-discussion agreement. *Mitigation*: Use pre-votes and anonymous scoring; structure discussion to hear from everyone; assign a devil's advocate.
  - **Coin-flip**: The decision is inherently difficult and reviewers are near chance (p≈0.5). *Indicators*: Low inter-reviewer agreement; historical data showing low success rate of funded proposals; reviewers express high uncertainty. *Mitigation*: Reduce panel size (since a large panel is worse when p<0.5) or delegate to an expert with p>0.5; accept that it's a lottery and use a random selection.
  - **Drift**: Systematic bias in one direction (e.g., against a method). *Indicators*: Consistently low scores for proposals using a certain method; reviewers share a common background that might lead to bias. *Mitigation*: Add reviewers from diverse backgrounds; use external adjudication; blind the reviewers to the method until after assessing the idea.

  *Missing Bucket?*: We might add **"Noise"** - when the review is dominated by irrelevant factors (e.g., writing style, prestige) that introduce random error. This is similar to coin-flip but might have a different cause. However, it can be seen as part of low p (because noise reduces p). Alternatively, **"Conflict"** - when reviewers are polarized and not trying to find the truth. This breaks the CJT assumption that all are trying to find the correct answer. We can call this **"Polarization"** and it would be characterized by two clusters of scores (bimodal) and low agreement. Mitigation: structured discussion to focus on evidence, or use a super-majority rule.

  **Clarification: Averaging vs. Majority**

  - **Majority Vote (Binary)**: CJT applies. Use for threshold decisions (e.g., fund/not fund) when we want the majority's judgment on a binary question.
  - **Averaging Scores**: This is for when we have a continuous score (e.g., 1-10). The law of large numbers says that if reviewers are unbiased (their average score is the true score) and independent, then the average is a good estimate. But if reviewers are biased (e.g., they all rate too high) then the average is biased. Also, if the true score is not well-defined (preference aggregation) then averaging is a way to combine preferences. 
  - **Mixing the Two**: If we use a majority vote on a threshold (e.g., average score above 7), then we are combining both. The CJT does not directly apply to the thresholding of averages. However, if we assume that each reviewer's binary vote (above/below threshold) is independent and has p>0.5, then we can apply CJT to the vote. But note: the threshold might be arbitrary and the p for the binary vote might be low if the proposal is near the threshold.

  **Procedure Output**:
  For a given panel setup, we run the checklist and get:
  - Go ahead with panel vote (if all checks pass).
  - Adjust the panel (e.g., add diversity, change size) to fix an issue.
  - Delegate to a single expert.
  - Use a different method (e.g., lottery) if p<=0.5.

  Now, we apply to the three scenarios.

  ---

  **Scenario 1: Standard eight-person subfield panel on ordinary proposals**

  - **Step 1**: The decision is binary (fund/not fund) and we are trying to fund the best science. There is a fact of the matter (which proposals are most promising). Applicable.
  - **Step 2**: Reviewers are experts in the subfield. We assume p>0.5 because they are specialists and past panels have funded successful projects. Sufficient.
  - **Step 3**: We currently show scores before the meeting. This may violate independence (anchoring). We should change to secret pre-votes and then discuss. Without mitigation, there is a risk of echo. We recommend withholding scores until after initial discussion.
  - **Step 4**: Panel size of 8 is within 5-15. With p>0.5, this is good. Adding more would have diminishing returns.
  - **Step 5**: No need to delegate.

  *Diagnosis*: Without mitigation, we risk "echo". With mitigation, the panel should work well.

  **Recommendation**: Proceed with the panel but use secret pre-votes and do not share scores until after discussion.

  ---

  **Scenario 2: Flagship "transformative" program**

  - **Step 1**: Binary decision (fund/not fund) but the fact of the matter (which will be transformative) is highly uncertain. Applicable.
  - **Step 2**: You suspect reviewers are barely better than chance (p≈0.5 or even p<0.5). Without data, we rely on your judgment. If p<0.5, then a large panel is worse. 
  - **Step 3**: Independence might be an issue because transformative ideas are often controversial and might trigger shared biases (e.g., against unorthodox methods). But the main problem is low p.
  - **Step 4**: With p<=0.5, an eight-person panel is worse than a single expert (if available) or even a lottery. For p=0.5, the majority is correct with probability 50% (same as coin flip). For p<0.5, the probability of correct majority decreases with n (e.g., for p=0.4, with 8 reviewers, the chance the majority is correct is only about 30%).
  - **Step 5**: If you have a trusted expert (or a small group of experts) with p>0.5 in spotting transformative ideas, then delegate to them. Otherwise, consider a lottery among proposals that pass a minimum threshold (to filter out clearly bad ones).

  *Diagnosis*: This is a "coin-flip" situation. Without a trusted expert, a big panel is worse than a small one or a lottery.

  **Recommendation**: 
  - If you have a trusted expert (with a track record), delegate to that person or a very small group (2-3) of such experts. 
  - Otherwise, use a two-stage process: 
      - Stage 1: Use a small panel (3-5) to remove clearly unworthy proposals (p>0.5 for identifying clear failures). 
      - Stage 2: For the remaining, use a lottery.

  ---

  **Scenario 3: Cross-cutting call with reviewers from the same methodological tradition**

  - **Step 1**: Binary decision, fact of the matter exists. Applicable.
  - **Step 2**: They are experts, so p>0.5? But note: they might be biased by their shared methodology. They might be competent for proposals within their tradition but incompetent for others? If the call includes proposals from multiple traditions, then for proposals outside their tradition, p might be low. 
  - **Step 3**: Independence is violated because of shared biases (drift). They will be systematically skeptical of other methods. This is a classic "drift" failure.
  - **Step 4**: Even with 8 reviewers, the shared bias means errors are correlated. The CJT (which assumes independence) does not hold.
  - **Step 5**: We need to break the shared bias. If we can't, then we might need to delegate to a balanced committee or add diverse reviewers.

  *Diagnosis*: Drift (systematic bias against other methods).

  **Recommendation**: 
  - Expand the panel to include reviewers from other methodological traditions. 
  - If that is impossible, then create a two-tier review: first, a panel from the same tradition to assess technical soundness (for which they are competent) and then a separate panel with diverse methods to assess the broader value. 
  - Alternatively, delegate the final call to a single individual who is known to be open to multiple methods (if such a person exists and has high p).

  ---

  **What the Procedure Can't Tell You**

  - It cannot resolve when there is no fact of the matter (preference aggregation). In that case, we are not trying to find a correct answer but to align with the foundation's values. Then, we might use a different method (e.g., scoring and averaging, or a deliberative process that seeks consensus on values).
  - It cannot give exact probabilities without data.
  - It cannot create expertise where none exists (e.g., for transformative research, if no one has a track record of identifying it, then we cannot get p>0.5).
  - It cannot eliminate all biases, especially if the entire field is biased.

  **Final Note**: The procedure is a guide. It requires judgment at each step. But it forces us to think about the assumptions behind panel reviews and to take steps to avoid common failures.
answer: |-
  Below is a procedural checklist based on the Condorcet Jury Theorem (CJT) and real-world constraints for grant review panels. It addresses your requirements: applicability, reviewer competence, independence, panel size, delegation, failure diagnosis, and the binary-vs-averaging distinction. The procedure is designed as a step-by-step filter—if any question returns a "hard no," the panel setup must be reconfigured. Where judgments are needed, it flags for human intervention. I'll then apply it to your three scenarios.

  ---

  ### **Condorcet Jury Theorem (CJT) Checklist for Review Panels**  
  **Core Principle**: CJT applies only to **binary decisions** (e.g., "fund/don't fund") where there is a *factually correct answer* (even if unknown). It assumes:  
  - Each reviewer has independent probability \( p > 0.5 \) of being correct.  
  - Majority vote improves accuracy as panel size increases (if \( p > 0.5 \)).  

  **Key Boundaries**:  
  - **Not for preference aggregation**: If "best" is subjective (e.g., alignment with mission), CJT doesn’t apply. Use scoring averages instead.  
  - **Not for scoring/ranking**: CJT licenses majority votes on binary thresholds, not averaging scores.  

  ---

  #### **Step 1: Decision Type (Applicability)**  
  *Question*: Is this a binary choice (fund/don’t fund) with a factually correct outcome (e.g., "will this project succeed?"), not a value judgment?  
  - **Sufficient answer**: Yes, and we have defined explicit success criteria (e.g., scientific rigor, feasibility).  
  - **Hard no**: The decision is:  
    - A ranking/score (e.g., "top 5 proposals").  
    - Based on preferences (e.g., "aligns with foundation values").  
  - **Human judgment needed**: If binary but success criteria blend facts and values (e.g., "transformative potential").  

  #### **Step 2: Reviewer Competence (\( p > 0.5 \))**  
  *Question*: Are reviewers better than chance at judging this proposal type? How do we know?  
  - **Sufficient answer**:  
    - Past data: >50% of funded projects met success metrics (e.g., publications, impact).  
    - Expertise: Reviewers have domain-specific track records (e.g., published in the field).  
  - **Hard no**:  
    - Historical data shows funded/non-funded outcomes are random (e.g., 50% success rate).  
    - Reviewers lack subject-matter expertise (e.g., evaluating quantum computing as biologists).  
  - **Human judgment needed**: No data exists; use qualitative proxies (e.g., reviewer CVs, proposal complexity).  
  - **Diagnostic**:  
    - **Coin-flip risk**: If no past data and proposals are novel/high-risk (e.g., transformative grants).  
    - **Drift risk**: If reviewers are experts but systematically biased (e.g., all favor established methods).  

  #### **Step 3: Independence**  
  *Question*: How severe is shared bias or influence? What mitigations are feasible?  
  - **Sufficient answer**:  
    - Pre-meeting secret votes are used.  
    - Reviewers come from diverse subfields/methods.  
    - Scores hidden until post-discussion voting.  
  - **Hard no**:  
    - All reviewers share a conflict (e.g., same institution) or ideological bias.  
    - Discussions dominate voting (e.g., no secret pre-votes).  
  - **Human judgment needed**: Bias is suspected but unquantifiable (e.g., "everyone dislikes AI research").  
  - **Diagnostic**:  
    - **Echo risk**: Scores cluster tightly pre-discussion; one vocal reviewer dominates.  
    - **Drift risk**: All reviewers have similar backgrounds (e.g., same methodology).  
    - **Mitigations**:  
      - Secret pre-votes → Fights *echo*.  
      - Mix subfields → Fights *drift*.  
      - Withhold scores → Fights *anchoring*.  

  #### **Step 4: Panel Size**  
  *Question**: Is the panel large enough to leverage CJT (if \( p > 0.5 \)) but not wasteful?  
  - **Sufficient answer**:  
    - \( p \sim 0.6-0.7 \): 5–9 reviewers (accuracy ~70–90%).  
    - \( p \sim 0.8 \): 3–5 reviewers (diminishing returns after 7).  
  - **Hard no**:  
    - \( p \leq 0.5 \): Any panel harms accuracy (delegate or lottery).  
    - \( n > 15 \): No meaningful gain (unless \( p \) is near 0.5).  
  - **Human judgment needed**: Uncertain \( p \); default to 5–7 reviewers.  
  - **Key CJT insight**:  
    | \( p \) | Min. Reviewers | Max Before Diminishing Returns |  
    |--------|----------------|--------------------------------|  
    | 0.55   | 7              | 11                             |  
    | 0.6    | 5              | 9                              |  
    | 0.7    | 3              | 7                              |  
    | 0.8    | 3              | 5                              |  

  #### **Step 5: Delegation to Single Expert**  
  *Question*: When is one trusted expert better than a panel?  
  - **Sufficient answer**:  
    - \( p \leq 0.5 \) for the panel (e.g., transformative grants).  
    - One expert has \( p > 0.5 \) and domain credibility.  
  - **Hard no**:  
    - \( p > 0.5 \) and independence is achievable.  
  - **Human judgment needed**: Who is the expert? Use conflict-of-interest checks.  

  #### **Failure Diagnosis Table**  
  | Failure    | Indicators                          | Mitigation Steps               |  
  |------------|-------------------------------------|--------------------------------|  
  | **Echo**   | Scores converge pre-discussion; one dominant reviewer. | Secret pre-votes; anonymized input. |  
  | **Coin-flip** | Low inter-reviewer agreement; high-risk proposals. | Delegate or lottery; reduce panel size. |  
  | **Drift**  | Shared biases (e.g., all skeptics of method X). | Add diverse reviewers; blind methods. |  
  | **Polarization*** | Bimodal scores; low consensus. | Super-majority vote; structured mediation. |  
  *Added bucket: Polarization occurs when reviewers split into opposing camps (e.g., theory vs. experiment).  

  #### **Critical Distinction: Averaging vs. Majority Vote**  
  - **Majority vote (CJT)**: Use for binary decisions with a correct answer. Requires \( p > 0.5 \) and independence.  
  - **Averaging scores**: Use for preference aggregation or rankings. Requires reviewer calibration (e.g., similar scoring scales).  
  - **Never mix**: Averaging scores then thresholding to binary violates CJT assumptions (e.g., a score of 7.5 may not reflect \( p > 0.5 \)).  

  ---

  ### **Application to Your Scenarios**  

  #### **Scenario 1: Standard 8-Person Subfield Panel**  
  - **Step 1**: Binary decision (fund/don’t fund) with factual criteria (e.g., scientific merit). → **Applicable**.  
  - **Step 2**: Reviewers are subfield experts; past data shows >60% success rate. → **\( p \sim 0.65 \)**.  
  - **Step 3**: Scores visible pre-meeting risks *echo*. → **Mitigate**: Secret pre-votes; hide scores until discussion ends.  
  - **Step 4**: \( n = 8 \) is optimal for \( p \sim 0.65 \) (accuracy ~85%). → **Valid**.  
  - **Step 5**: No delegation needed.  
  - **Failure risk**: **Echo** (anchoring on first scores).  
  - **Verdict**: Proceed with mitigations. Majority vote is justified.  

  #### **Scenario 2: Flagship "Transformative" Program**  
  - **Step 1**: Binary decision, but "success" is speculative (no factually correct answer). → **Human judgment needed** (values dominate).  
  - **Step 2**: Reviewers historically ~50% accurate. → **\( p \approx 0.5 \)** (coin-flip). **Hard no** for CJT.  
  - **Step 3**: Independence irrelevant (competence issue).  
  - **Step 4**: \( n = 8 \) with \( p = 0.5 \) → majority accuracy = 50% (**worse than 1 expert**).  
  - **Step 5**: Delegate to one trusted expert with \( p > 0.5 \) (e.g., visionary in the field). If none, **use a lottery**.  
  - **Failure risk**: **Coin-flip** (panels add noise).  
  - **Verdict**: **CJT forbids panel voting**. Use expert delegation or lottery.  

  #### **Scenario 3: Cross-Cutting Call (Shared Methodology)**  
  - **Step 1**: Binary decision with factual criteria. → **Applicable**.  
  - **Step 2**: Reviewers competent (\( p > 0.5 \)) but all from same tradition. → **Risk of drift**.  
  - **Step 3**: Shared bias toward "rigor" = their methods. → **Independence violated** (hard no).  
  - **Step 4**: \( n = 8 \) useless with correlated errors.  
  - **Step 5**: Delegate only if an unbiased expert exists. Else, **reconfigure panel**.  
  - **Failure risk**: **Drift** (systematic skepticism of alternatives).  
  - **Verdict**: **Add reviewers from outside the tradition** or use a meta-reviewer to audit bias. Do not vote.  

  ---

  ### **What the Procedure Can't Tell You**  
  1. **No fact of the matter**: When "best" is subjective (e.g., mission fit), CJT doesn’t apply. Use:  
     - Score averaging (if reviewers are calibrated).  
     - Deliberative discussion (not voting).  
  2. **Quantifying \( p \)**: Without historical data, \( p \) is estimated qualitatively (e.g., "reviewers are seasoned").  
  3. **Reviewer calibration**: Averaging scores requires reviewers to use scales consistently (CJT doesn’t address this).  
  4. **Cost-benefit trade-offs**: E.g., adding reviewers vs. volunteer fatigue.  

  ### **Summary for Your Board**  
  > "We use the Condorcet Jury Theorem to optimize panel voting. It only applies to yes/no funding decisions where there’s a correct answer (e.g., scientific merit). We ensure reviewers are experts (>50% accurate), independent (secret votes, diverse backgrounds), and panels sized 5–9. If panels are unqualified, biased, or judging subjective questions, we delegate to experts or use lotteries. This avoids common failures like groupthink (echo), guesswork (coin-flip), and bias (drift)."  

  This procedure prioritizes actionable, binary outputs ("proceed," "reconfigure," "delegate") and embeds your diagnostic framework. For transformative grants (Scenario 2), it confirms your suspicion: a large panel is statistically harmful.
