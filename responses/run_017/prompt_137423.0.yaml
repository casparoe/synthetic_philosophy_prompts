answer: |-
  ## Dialogue: The Normative Weight of Intractability

  **Setting:** A university common room overlooking a rain-slicked quad. Mira and Dev sit near a window, coffee cups cooling, discussing Ari’s predicament. Charts depicting tangled dependency graphs are briefly visible on Dev’s open laptop before he closes it.

  **Mira:** (Leaning forward, gesturing towards the closed laptop) Dev, we agree Ari’s problem is intractable in the worst-case sense. Every known exact method *could* take longer than his hour on *some* configuration of those fifty variables. Lives hang on his revised plan every sixty minutes. Given that, surely the *norm* he must follow – the instruction set for what constitutes ‘doing his job’ – cannot be the ideal, infallible plan. That’s a philosopher’s ghost. It must be the best tractable *approximation* his laptop and his hour can produce. Demanding the impossible isn’t normative; it’s cruel. Feasibility is a constraint on admissibility.

  **Dev:** (Nodding slowly) We agree on the complexity, Mira. Truly. The lattice of dependencies, the partial observability, the probabilistic entanglements – it screams intractability. But agreement on the *description* of Ari’s struggle doesn’t entail agreement on the *evaluation*. The norm *is* the correct plan, the one that would save the most lives given the true state of the world, however obscured. Its intractability doesn’t make it incorrect. It makes achieving it tragically difficult. The gap between what Ari *can* do and what he *ought* to do – that gap *is* the space for normative judgment. Collapsing the ‘ought’ into the ‘can’ robs us of that evaluative stance.

  **Mira:** But Dev, that stance feels empty here. Worse, it paralyzes. If the norm is forever out of reach, how does it guide Ari *now*, at hour eleven? You say the gap allows evaluation – but evaluation *by whom*? Some cosmic judge? Ari needs to *act*, not be judged post-hoc by an impossible standard. If feasibility isn’t a constraint, then *any* norm, no matter how unachievable, could be asserted as ‘correct’. That seems like normative anarchy. The correctness of a norm *must* be tied, somehow, to the possibility of its being followed by the agent it binds.

  **Dev:** (Raises a finger) Not anarchy, Mira. Structure. The impossible norm provides the *target*. It tells us what we’re approximating, and *why* one approximation might be better than another. Without it, how do you choose *which* tractable surrogate Ari should use? Speed alone? That seems arbitrary. Why favour a fast, suboptimal greedy algorithm over a slightly slower but potentially much better Monte Carlo tree search? Your choice of surrogate *presupposes* some notion of correctness that speed alone doesn’t supply. You need the ideal, however unreachable, to justify the choice of the practical.

  **Mira:** (Sighs) That’s a fair push, Dev. You’re right: simply pointing to computational speed isn’t enough to *justify* one surrogate norm over another. We need a *criterion* for choosing the best approximation. And yes, that criterion often references the ideal – minimizing the expected divergence from the ideal outcome under resource constraints. But crucially, *implementing that criterion itself must be feasible*. We can define ‘best approximation’ *within* the feasible set using expected utility relative to the ideal, but the *selection and application* of the surrogate policy must be something Ari can actually compute within his hour. The ideal norm informs the *design* of the surrogate, but Ari lives by the surrogate.

  **Dev:** So Ari *aims* at the ideal, but *satisfies* it only when feasible? That sounds like a compromise: "Conform to the ideal norm when you can compute it within the hour; otherwise, use the best surrogate." Would that satisfy you? Ari strives for the correct plan, falling back only when necessity dictates.

  **Mira:** (Shakes her head firmly) It sounds plausible, Dev, but it ignores a crucial feature of the complexity we both acknowledge. *How does Ari know if he can compute the ideal plan within the hour for* this specific *instance at hour eleven?* The problem is intractable, but is its *difficulty* **diagnosable**? Let me define that: a method’s difficulty is *diagnosable* if there’s a computationally cheap test – cheap *within* Ari’s budget – that flags *in advance* the instances where the method will blow his time budget. If such a test exists, your compromise *might* work: run the cheap test; if it says ‘easy’, run the exact method; if it says ‘hard’, run the surrogate.

  **Dev:** (Leans back, intrigued) Diagnosable versus...?

  **Mira:** Versus **opaque**. Opaque difficulty means *no* such cheap test exists. Discovering whether *this* specific instance is one he can solve exactly costs him almost as much time and effort as just *trying* to solve it exactly. He can’t afford to run the diagnostic *and* potentially run the exact method; he has to choose blind. If the difficulty is opaque, Dev – as it very well might be for Ari’s messy, interdependent variables – then your compromise collapses. He *cannot* reliably tell when he’s in the ‘feasible’ region for the ideal norm. Your ‘satisfy-when-hard’ strategy issues *no guidance at all* when he needs it most. He needs a single policy he *can* execute within the hour, start to finish. The surrogate isn’t a fallback; it’s the only viable norm.

  **Dev:** (A slow smile spreads) Ah, Mira, you wield your distinction well. But you’ve sharpened a blade that cuts both ways. *If* the difficulty is opaque – which I’ll grant is often plausible for Ari’s domain – then *your* position faces the same problem! How does Ari know, *in advance* and *cheaply*, which instances demand the *surrogate* norm? If diagnosing the need for the exact method is too expensive, diagnosing the need for the surrogate is equally expensive. You cannot have a *conditional* policy: "Use surrogate *only* on hard instances." Because you can't *identify* the hard instances cheaply! Therefore, your ‘surrogate norm’ *must* be a **universal policy**: a single computational procedure Ari applies to *every* instance, regardless of its true (but unknowable) difficulty. He runs Algorithm X every hour, come what may.

  **Mira:** (Pauses, conceding the point) Touché, Dev. You’re right. If difficulty is opaque at the *instance* level, a conditional policy based on diagnosing *this instance now* is infeasible. My prescription *does* require a universal policy.

  **Dev:** Exactly. So Ari runs Algorithm X every hour. Now, the critical question: *Which* universal policy should Ari adopt? You offer Surrogate S1, I might argue for Surrogate S2, someone else suggests S3. How do we decide? Complexity theory tells us S1, S2, and S3 are all *tractable* – they run within the hour. But it tells us *nothing* about which one Ari *should* run. To choose between S1 and S2, we need to know which one produces *better plans*. Which one gets *closer* to the ideal outcome more often. And that judgment – ‘better’, ‘closer’ – *requires* the ideal norm as the standard of correctness! Complexity theory, focused on time and worst-case guarantees, falls silent on the *quality* of the approximation. The choice between surrogates hinges entirely on an evaluation *external* to complexity: which one best approximates the *correct* plan. Therefore, the ideal norm, though intractable, remains indispensable for justifying the choice of the tractable policy. It does critical work precisely *because* it’s unsatisfiable – it provides the measure.

  **Mira:** (Takes a deep breath) I concede that choosing *between* tractable universal policies requires a criterion beyond mere speed. We need a quality measure. But Dev, you’re anchoring that quality measure solely in the asymptotic, worst-case complexity result – the source of the intractability. That’s the wrong anchor. What matters for Ari is not the worst-case instance that *might* exist in some abstract problem space, but the **distribution of instances he actually faces in his specific environment**. Is his city prone to cascading failures that trigger the worst-case complexity? Or are 99% of his hourly revisions solvable near-optimally by a well-tuned heuristic because the dependencies are usually sparse? This is an *empirical, local* question about Ari’s world, not a question settled by an asymptotic theorem.

  **Dev:** So you relocate diagnosability? From diagnosing the *instance* to diagnosing the *environment*?

  **Mira:** Precisely. The critical question isn't "Can Ari diagnose *this* instance cheaply?" but "Can we, or Ari, reasonably assess that the *distribution* of instances he encounters is one where Policy X’s *expected performance* – its average closeness to the ideal, or its worst-case performance *within the likely distribution* – is acceptable, given the stakes?" Complexity results tell us the *worst-case* over *all possible* instances is bad. But if the empirical evidence shows the *actual* instances Ari faces rarely or never hit that worst case, then a policy that performs well on the *typical* distribution might be normatively sufficient, even if it fails catastrophically on some pathological input Ari will never see. The feasibility constraint binds relative to the *actual* environment and budget, not the abstract worst-case.

  **Dev:** (Leaning in intently) So, Mira, your normative architecture rests on an *empirical premise*: that the distribution of problems Ari faces is ‘benign’ in the sense that the worst-case complexity pathologies are vanishingly rare or absent. That Policy X’s *expected* performance is acceptable. Who makes that empirical judgment? Ari? His superiors? Philosophers? And crucially, *what justifies accepting that premise*? What if the stakes are so high – entire hospitals overwhelmed, bridges collapsing – that even a *small* probability of encountering a worst-case instance, where Policy X fails catastrophically, is unacceptable? Doesn’t the *ideal norm*, defining what ‘catastrophic failure’ even means and *why* it’s unacceptable, remain the necessary reference point for evaluating the *risk* inherent in your empirical premise? Without the ideal, how do you define ‘acceptable’ expected performance? It seems circular: ‘acceptable’ is defined relative to the stakes, but the stakes are defined by the gap between outcome and ideal!

  **Mira:** The justification is practical and iterative, Dev. We start with our best empirical understanding of Ari’s environment and the stakes. We design policies whose *simulated* or *historical* performance on *representative* instances meets our provisional standards for ‘acceptable’. We deploy them. We monitor outcomes. If failures occur that trace back to the policy’s limitations in the face of complexity, we *update* our empirical model, our risk tolerance, or the policy itself. The ‘acceptable’ threshold isn’t handed down from the ideal; it’s negotiated through experience, observation, and an understanding of what’s humanly and computationally achievable under pressure. The ideal norm *informs* our sense of loss, but it doesn’t dictate the feasible threshold. Ari, at hour eleven, must run the policy vetted by this process as the best achievable guard against disaster. He cannot chase a ghost.

  **Dev:** And there we land, Mira. For you, the normative force lies in the achievable, validated by empirical risk assessment within the feasible set. The ideal is a distant star, useful for orientation but not for navigation. For me, the ideal norm *is* the pole star. Its intractability highlights the tragedy of Ari’s position, but its correctness is the unyielding measure against which all actions, all surrogates, and all empirical risk assessments must ultimately be judged. It defines the ‘disaster’ Ari guards against. Without it, your ‘acceptable risk’ and ‘best achievable’ lack their ultimate grounding. Ari, at hour eleven, must strive in the *direction* of the ideal, using the best tools he has, knowing he may fall short, but knowing *why* falling short matters.

  **Mira:** He strives towards what the *feasible ideal* – the best validated surrogate – represents, Dev. Not an unreachable phantom. The grounding is in the lives saved *here*, with the tools *available*.

  **Dev:** And the measure of lives saved is against the lives *that could have been saved*.

  **(They hold each other's gaze, the rain streaking the window behind them.)**

