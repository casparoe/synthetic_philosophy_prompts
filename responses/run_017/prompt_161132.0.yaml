prompt: |-
  I manage a three-person outreach team at a city benefits-access office, and most weeks we send short letters, texts, and phone scripts to residents who appear eligible for Medicaid, SNAP, or a utility-arrearage program but haven't enrolled. The decisions I need help with come up constantly — we produce roughly forty message variants a quarter, each reviewed in a single twenty-minute slot by two staff members with no philosophy or behavioral-science training, with me signing off and anything contested going to our director. Because our funder audits a sample of these messages and asks for the reasoning, whatever procedure we use has to end in a short written rationale, and it has to degrade gracefully: we usually have no A/B test, no idea why an earlier message worked, and very little information about the individual recipient's actual circumstances, literacy, or stress level. A disagreement last month made this concrete for me. We sent a letter saying that neighbors in the recipient's ZIP code had already renewed and that they should confirm by Friday to keep their coverage — the deadline was invented and there is no coverage to lose, since the letter goes to people who were never enrolled. My colleague thinks this is obviously fine because it moves people into benefits they're entitled to and that we know are good for them; I think something is wrong with it that isn't captured by "does it work" or "is anyone lied to," and I'd rather have a procedure than keep having this argument.

  Reading around on my own, the best core idea I've found is that persuasion engages the target's reasons while manipulation somehow bypasses or subverts them — but I can't hand that to my staff, because the hard question in each case is precisely whether a given technique is tracking the recipient's reasons or going around them. The operational version I've been toying with is a kind of flip test: if the program were mildly bad for this particular resident, or if their own reasons genuinely pointed against enrolling, would the same technique still push them to enroll anyway? A deadline and a social-proof claim would still work in that flipped case, so on my test they aren't tracking reasons; a sentence explaining that the program covers a specific drug the recipient is taking would stop working, so it is. I'm not confident this is the right test rather than a proxy that mostly tracks deception or the sheer effectiveness of the technique, and I'd like you to keep it if it survives and replace it with something better if it doesn't. Please write my team a decision procedure built on whatever the philosophy of this distinction actually supports — ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no and sends the message back for redrafting, and where it explicitly hands the decision to a person because the remaining question is one of values rather than facts (for instance, whether enrolling people in benefits they're entitled to can justify a means we've already classified as manipulative). It has to be runnable in twenty minutes by a non-specialist, so any term it uses needs an operational test attached rather than a definition — give me a check for "bypasses the recipient's reasons" that doesn't presuppose the answer. It also has to say what to do when a step can't be answered at all, as will often happen when we know almost nothing about the recipient. Please tell me which distinctions have to survive the simplification and which you dropped as unusable at our level, and be explicit about which steps are judgment calls dressed up as procedure.

  Run it on four live cases and show the work: (1) the invented-deadline social-proof letter above; (2) a reply card on which "yes, enroll me" is pre-checked, so that doing nothing enrolls you; (3) a phone script that opens with what the household loses by not enrolling and states a funding deadline that is genuinely true — I expect the procedure to tell me something here that I will not like, and I'd rather see that than have it quietly tailored to spare my current practice; and (4) a case where the recipient is an eighty-year-old with low literacy and probable mild cognitive impairment, where the procedure should either give an answer or stop and explain why it can't. Please don't give me a literature review, citations, or reading suggestions; I have no library access and only want the operationalized procedure, worked through, plus an honest final note on what the procedure cannot settle and where it will misfire.
reasoning: |-
  Hmm, the user manages a three-person outreach team that sends messages to residents about benefits enrollment. They need a decision procedure to evaluate whether their outreach methods are persuasive or manipulative. The team creates about forty message variants per quarter, each reviewed in just twenty minutes by staff without specialized training. The procedure must result in a written rationale for funder audits and handle cases where there's little information about recipients.

  The core challenge is distinguishing between persuasion (engaging reasons) and manipulation (bypassing reasons). The user has proposed a "flip test": if the technique would still work even if the program were bad for the recipient or their reasons pointed against enrolling, then it's manipulative. But they're unsure if this is the right approach.

  Key requirements include:
  - Must be executable in 20 minutes by non-specialists
  - Needs operational tests instead of definitions
  - Must degrade gracefully with limited recipient information
  - Must indicate when to stop and redraft
  - Must identify when decisions become value judgments

  The user provides four test cases:
  1. Letter with invented deadline and social proof
  2. Pre-checked "yes" reply card
  3. Phone script with true funding deadline and loss framing
  4. Outreach to elderly recipient with low literacy and cognitive impairment

  I need to build a procedure that:
  1. Uses operationalizable checks
  2. Handles incomplete information
  3. Clearly flags manipulative techniques
  4. Separates factual analysis from value judgments
  5. Provides audit-ready rationales

  For the philosophical foundation, I'll draw on the reasons-responsive approach - whether the technique would work regardless of the recipient's actual reasons. The flip test is actually quite sound when properly framed, so I'll refine it into concrete questions.

  The procedure should follow this flow:
  1. Identify the core technique
  2. Assess if it engages recipient's reasons
  3. Check for bypassing mechanisms
  4. Evaluate truthfulness
  5. Make final determination

  For each step, I'll create specific pass/fail criteria with operational tests. Important to include:
  - How to handle "can't determine" cases
  - When to redraft
  - Where value judgments occur
  - How to document rationale

  The final procedure must be transparent about:
  - What it can't resolve (e.g., borderline cases)
  - Where it might misfire (e.g., with vulnerable populations)
  - That some tradeoffs require human judgment
answer: |-
  Here is a decision procedure for evaluating outreach messages, designed to distinguish persuasion from manipulation while meeting your operational constraints. It's built on the principle that **persuasion respects the recipient as a rational agent by engaging their reasons for action, while manipulation bypasses their agency by exploiting cognitive biases or vulnerabilities regardless of reasons**. The "flip test" you proposed is retained and operationalized below.  

  ### Core Principles Simplified
  1. **What survived**:  
     - The distinction: "Does this technique work *by* engaging the recipient’s own reasons?" vs. "Does it work *despite* their reasons?"  
     - The flip test (refined): **If the recipient had good reasons *not* to act, would this technique still push them to act?**  
     - Truthfulness is necessary but not sufficient; non-deceptive messages can still be manipulative.  
  2. **What was dropped**:  
     - Subjective intent ("We meant well").  
     - "Effectiveness" as justification (manipulation can be effective).  
     - Recipient’s "true interests" (we can’t assume we know them).  
     - Degrees of rationality (too fuzzy for 20 mins).  

  ---

  ### Decision Procedure: Persuasion vs. Manipulation Screen  
  **Time:** 15–18 mins per message (strictly enforced).  
  **Inputs:** Draft message + known recipient details (often minimal).  
  **Outputs:** **APPROVE**, **REDRAFT**, or **ESCALATE** (for value judgments), with a 1–3 sentence rationale.  

  #### Step 1: Identify the Core Technique (2 mins)  
  *"What is the primary psychological driver in this message?"*  
  - **Test:** Underline the sentence/fragment most likely to make the recipient act. If >1, pick the strongest.  
  - **Sufficient answer:** A concrete example (e.g., "Friday deadline," "pre-checked box").  
  - **Can’t answer?** REDRAFT (message is too vague or scattershot).  

  #### Step 2: Flip Test (5 mins)  
  *"Would this technique work if the action were mildly harmful to the recipient or if they had good reasons not to act?"*  
  - **Operational test:**  
    - Imagine a hypothetical recipient with a clear reason *not* to enroll (e.g., enrolling triggers a 5% utility rate increase, or they morally oppose "handouts").  
    - Ask: "Would this technique *still* push them to enroll, ignoring their reason?"  
  - **Answer YES (bypasses reasons):** Technique is **manipulative**. Proceed to Step 3.  
  - **Answer NO (tracks reasons):** Technique is **persuasive**. Proceed to Step 4.  
  - **Can’t answer?** Assume **YES** (if technique exploits urgency/inertia/social pressure) or **ESCALATE** (if too ambiguous).  

  #### Step 3: Truthfulness Check (3 mins)  
  *"Is the core technique literally true and not misleading?"*  
  - **Test:** Would a reasonable recipient, reading carefully, feel misled?  
  - **Answer NO:** REDRAFT immediately (e.g., false deadline, implied threat).  
  - **Answer YES:** Proceed to Step 5 (Value Judgment).  

  #### Step 4: Engagement Check (3 mins)  
  *"Does the technique help the recipient connect the action to their own values/goals?"*  
  - **Test:** Does it offer a fact, benefit, or value *they* might care about (even if generic)?  
  - **Answer YES:** APPROVE (persuasive).  
  - **Answer NO:** REDRAFT (too weak; risks being ignored).  
  - **Can’t answer?** APPROVE with note ("Assumes baseline interest").  

  #### Step 5: Value Judgment (When Manipulative but Truthful) (2 mins)  
  *"Does the social good of enrolling justify using this technique?"*  
  - **Test:** "Would we use this technique for a program with *debatable* benefits (e.g., a commercial product)?" If NO, it’s high-risk.  
  - **Answer:** ESCALATE to director. Non-specialists *cannot* resolve this—it’s a values call.  

  #### Final Output & Rationale  
  - **APPROVE:** "Persuasive: [Technique] engages recipient’s likely reasons (Step 4/Flip Test NO)."  
  - **REDRAFT:** "Manipulative (Step 2 YES) or untrue (Step 3 NO). Redraft to focus on factual benefits."  
  - **ESCALATE:** "Truthful but manipulative (Step 2 YES + Step 3 YES). Director must weigh ethics vs. enrollment."  

  ---

  ### Worked Examples  
  **Case 1: Invented-deadline social-proof letter**  
  - **Step 1:** Core technique = "Neighbors renewed; confirm by Friday to keep coverage."  
  - **Step 2 (Flip Test):** YES. Even if enrolling *cost* money, the deadline/social pressure would still push action. → **Manipulative.**  
  - **Step 3 (Truthfulness):** NO. "Keep coverage" implies existing enrollment; deadline is fake. → **REDRAFT.**  
  - **Rationale:** "REDRAFT: Core technique (deadline/social proof) is manipulative and untruthful. Recipient never enrolled; 'keep coverage' is false."  

  **Case 2: Pre-checked "yes" reply card**  
  - **Step 1:** Core technique = Pre-checked "yes" (exploits inertia).  
  - **Step 2 (Flip Test):** YES. Recipient might not want enrollment (e.g., fears paperwork), but inaction still enrolls them. → **Manipulative.**  
  - **Step 3 (Truthfulness):** YES. No false claims.  
  - **Step 5 (Value Judgment):** ESCALATE. "Truthful manipulation. Does enrollment justify overriding inaction?" → **ESCALATE to director.**  
  - **Rationale:** "ESCALATE: Pre-checked box bypasses agency (Step 2 YES). Truthful, but requires value judgment on inertia exploitation."  

  **Case 3: Phone script with true funding deadline and loss framing**  
  - **Step 1:** Core technique = "You lose $X/month by not enrolling; funding ends Friday."  
  - **Step 2 (Flip Test):** YES. Loss framing/deadline would pressure someone even if they had reasons to decline (e.g., privacy concerns). → **Manipulative.**  
  - **Step 3 (Truthfulness):** YES. Facts are accurate.  
  - **Step 5 (Value Judgment):** ESCALATE. "True loss/deadline exploits urgency. Does benefit justify urgency?" → **ESCALATE to director.**  
  - **Rationale:** "ESCALATE: Loss framing/deadline manipulates (Step 2 YES) but is truthful. Director must approve urgency-based approach."  

  **Case 4: 80-year-old, low literacy, cognitive impairment**  
  - **Step 1:** Core technique = (Assume) Large font: "Sign now to get $ for bills."  
  - **Step 2 (Flip Test):** **Can’t answer.** Technique targets vulnerability (simplicity/urgency), but cognitive impairment clouds "reasons."  
  - **Handling uncertainty:** Default to **REDRAFT**.  
  - **Rationale:** "REDRAFT: Recipient’s impairment risks exploitation (Step 2 unclear). Use plain-language benefit explanation only; avoid urgency."  

  ---

  ### Honest Final Notes  
  **What the procedure cannot settle:**  
  1. **Borderline techniques:** E.g., "9/10 people enroll" (social proof). Step 2 may be ambiguous → Escalate.  
  2. **Vulnerable populations:** Cognitive impairment or crisis (Step 2 unreliable) → Always REDRAFT toward simplicity/neutrality.  
  3. **"Mildly harmful" in Flip Test:** Staff must imagine a *plausible* harm (e.g., time cost). Judgment call, but your test case defines it well.  
  4. **Value conflicts:** When manipulation is truthful and effective, the procedure flags it (Step 5) but doesn’t resolve it.  

  **Where it will misfire:**  
  - **False negatives:** Overly charitable to "benign" manipulation (e.g., "Act now!" with true deadline). Step 2 catches this, but staff might rationalize.  
  - **False positives:** May flag weak persuasion (e.g., "This program exists") as "manipulative" if staff misapply Step 2. Training mitigates this.  
  - **Low-info contexts:** Leans toward caution (REDRAFT) when uncertain. This slows output but avoids abuse.  

  **Recommendation:** Pair this with a 1-hour training on the Flip Test (using your examples). It forces concrete thinking and aligns with your intuition that "something is wrong" with manipulation—even when it "works."
