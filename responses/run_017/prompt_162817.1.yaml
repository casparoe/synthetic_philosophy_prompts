  Okay, let me start by understanding the user's problem. They're on a technical staff for a public body and need to recommend an emissions target. Their colleague presented an argument that policies affecting people over 80 years out can't be morally criticized because those individuals wouldn't exist otherwise. The user thinks this is flawed but can't pinpoint where. They provided four issues: the argument generalizes to historical injustices, allows harming future generations if lives are still "worth living," creates a moral cliff, and depends on unknowable facts.

  First, I need to parse the colleague's argument step by step. Premise (1) says a policy can only be criticized if it makes someone worse off compared to alternatives. (2) states that policies change who exists in the future due to different life paths. (3) concludes that if someone exists because of the policy, they aren't worse off since the alternative was non-existence. (4) adds that as long as lives are worth living, no harm is done. (5) says if no one is harmed and no rights violated, it's not objectionable. (6) concludes that policies can't be objectionable based on effects over 100 years out.

  The user's key concerns are the implications: justifying historical injustices, permitting harmful actions if lives are barely worth living, an arbitrary threshold for life worth living, and reliance on unverifiable facts. They tried two repairs: a non-comparative harm standard and comparing expected welfare of random individuals. Both have issues they're uncomfortable with.

  The user prefers keeping premises (2) and (5) since (2) is a sociological fact and (5) avoids aggregation. So any solution must work within those constraints. The core problem seems to be step (3) and the non-identity issue. 

  I recall Parfit's non-identity problem, but the user can't access literature. The flaw might be in step (3). The colleague assumes that if a person exists only because of the policy, they can't be worse off. But this ignores that the policy could create conditions where people have worse lives than those who might have existed under a different policy. Step (3) incorrectly claims there's no alternative where the same person fares better, but the relevant comparison might be between different possible populations.

  Step (4) then limits wrongs to lives not worth living. But the user's issue is with the moral significance of creating lives that are significantly disadvantaged, even if above the threshold. Step (5) ignores that policies can be wrong for reasons other than individual harm, like violating obligations to future generations or creating unjust conditions.

  The user's repair attempts highlight the tension. The first repair introduces a non-comparative standard but faces the problem of claiming existence itself can be harmful. The second uses expected welfare of a random individual, but aggregates under a personal description, which the user dislikes.

  A better approach might be challenging step (3)'s implication. Even if specific individuals aren't worse off compared to non-existence, the policy might be wrong because it creates individuals with severe hardships when better options were available. The moral issue isn't harming specific people but failing in a duty to create conditions where future people have good lives.

  This connects to the user's point about historical injustices. The wrong isn't necessarily to specific descendants but to the group or to the principle of justice. Similarly, for the toxin case, the firm wrongs the workers by risking their future children's health, even if those children wouldn't exist otherwise. The obligation is to avoid creating avoidable suffering, not just to avoid harming existing individuals.

  The colleague's argument breaks at step (3) because it conflates the inability to harm specific individuals with the absence of any moral wrong. Policies can still be objectionable for creating worse-off populations compared to alternative policies, even if the individuals differ. This doesn't require aggregative calculus but recognizes a duty to future people collectively.

  For the emissions target, the user can argue that we have an obligation to ensure future generations inherit a livable world, not just that lives are minimally worth living. The "cliff" problem remains, but focusing on avoiding catastrophic risks might justify more ambitious targets without needing a precise threshold.
answer: |-
  Your colleague's argument is clever but flawed at step (3), and the flaw infects steps (4) and (6). I'll diagnose it plainly, preserve your preferences for (2) and (5), and show how this blocks the problematic generalizations while letting you reject (6). The core issue is a **misapplication of the "non-identity" insight**.

  ### Where the Argument Breaks: Step (3)
  Step (3) states:  
  *"If a person owes their existence to the policy we choose, then there is no alternative course of events in which that same person fares better. So, by (1), that person is not made worse off by our choice."*

  This is **incorrect** in its inference. While it's true that *the same person* cannot fare better in an alternative where they don't exist, it **falsely assumes** that "not made worse off" implies "no moral objection can apply to the policy regarding that person." This ignores a critical distinction:  

  - **What (3) gets right**: A person whose existence depends on the policy cannot coherently claim, *"I would have been better off if you had chosen differently,"* because under the alternative, they wouldn't exist.  
  - **What (3) gets wrong**: It conflates **individual harm** (defined by counterfactual comparison for a specific person) with **moral permissibility**. Policies can still be objectionable *due to their effects on future people* even if no *specific* future person is made worse off than they would have been otherwise.  

  ### Why This Matters for Your Objections
  Your intuitions about overgeneralization (i–iv) are correct because step (3) erroneously reduces all moral assessment to individual harm avoidance. But:  
  - **(i) Historical injustices**: The wrong of slavery isn’t solely about harming specific descendants (though they may inherit disadvantages). It’s about *the act itself* violating norms of justice, dignity, or rights—wrongs that transcend individual counterfactuals.  
  - **(ii) Toxin exposure**: The firm wrongs the workers *by creating avoidable suffering for their children*, even if those children wouldn’t exist otherwise. The moral failure is in *deliberately creating persons with severe disabilities* when a better alternative (healthy children) was possible.  
  - **(iii) The "cliff" problem**: This arises only if we accept (4)’s claim that "lives not worth living" is the *only* wrong. But if (3) is false, we can object to policies that create *unnecessarily bad lives* (even if above the "worth living" threshold) when better lives were achievable.  
  - **(iv) Unknowable facts**: If morality hinges solely on comparing specific individuals (as (3) requires), permissibility *does* depend on unknowable conception dates. But if we reject (3), we avoid this—we can assess policies based on the *foreseeable quality of life for future populations*, not specific identities.  

  ### How to Fix It Without Abandoning (2) or (5)
  Your first repair (non-comparative harm) is unstable, as you note. Your second repair (expected welfare of a random person) is closer but feels aggregate. Here’s a better fix:  

  **Revise step (3) to reflect a duty to future generations**:  
  > *(3 Revised)* If a person owes their existence to our policy, they are not "made worse off" *in the comparative sense of (1)*. However, we can still assess whether the policy *fails in a duty to provide reasonably favorable conditions for future people*, given the alternatives available to us.  

  **Then revise (4) accordingly**:  
  > *(4 Revised)* Policies can be morally objectionable not only if they make specific people worse off, but also if they *unreasonably create or permit conditions where future people suffer severe hardships that could have been avoided*—even if those specific people owe their existence to the policy.  

  This satisfies your constraints:  
  - **Preserves (2)**: Accepts the sociological fact that policies affect who exists.  
  - **Preserves (5)**: No rights violation or promise-breaking is invoked here. Instead, we ground the duty in the **obligation not to create persons in unjust or foreseeably dire conditions when better alternatives exist**. This is consistent with non-aggregative ethics (e.g., "person-affecting" principles with a future-oriented scope).  
  - **Blocks the generalizations**:  
    - Historical injustices wronged *victims at the time* (e.g., enslaved people) and created ongoing unjust structures—no need to hinge reparations on counterfactuals about descendants.  
    - The toxin case is wrong because it *needlessly imposes disability*—a failure of the firm’s duty to workers and their children.  
  - **Resolves the cliff/unknowability issues**:  
    - We don’t need a bright line for "life worth living." We can object to policies that foreseeably create *preventable suffering* (e.g., climate-driven famine) even if life remains "worth living."  
    - Assessment uses *foreseeable outcomes* (e.g., "Policy X risks 200 million climate refugees by 2100"), not unverifiable facts about specific individuals.  

  ### Implications for Your Emissions Target
  1. **The argument’s narrower (invalid) conclusion**: If you accept the original (1)–(5), (6) *does* follow—but only because (3) smuggles in a false equivalence between "not made worse off" and "no grounds for objection." Once corrected, (6) is unsupported.  
  2. **Why a narrower conclusion fails**: Even if the original argument were valid, a conclusion like "we needn’t consider impacts beyond 80 years *for identity-dependent reasons*" wouldn’t help you. Climate policy’s worst harms (e.g., sea-level rise) unfold beyond 2100, and identity dependence doesn’t absolve us of responsibility for *the quality of the world we bequeath*.  
  3. **Recommending a number**: With the revised view, your target should minimize *foreseeable severe suffering* for future people. Focus on:  
     - **Thresholds of catastrophe** (e.g., warming limits that prevent civilizational collapse), not "life worth living."  
     - **Avoidable injustices** (e.g., emissions causing displacement in vulnerable nations).  
     This doesn’t require aggregative calculus—it’s about fulfilling a duty to not create persons in conditions of systemic, preventable harm.  

  ### In short:
  - **Reject step (3)** for inferring that "no individual harm" implies "no moral objection."  
  - **Accept a duty to future people**: We must not create lives in foreseeably unjust conditions when better options exist.  
  - **Result**: You can endorse ambitious climate targets without aggregative ethics, while avoiding the colleague’s overgeneralizations. The memo should state: *"While policies may affect future identities, this doesn’t nullify our duty to ensure the world we leave them is not needlessly impoverished by our choices."*  

  This meets your needs: philosophically robust, demography-compatible, and action-guiding for setting the target.
