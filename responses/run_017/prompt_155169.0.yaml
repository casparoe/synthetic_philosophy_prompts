answer: |-
  ### Case: Patent Royalty Valuation

  Alice and Bob co-own a small biotechnology patent. The patent will yield a $100 royalty if a drug trial succeeds (state A) or $0 if it fails (state B), pending FDA approval. Success hinges on which of two expert methodologies (A or B) correctly predicts trial outcomes. Both parties review identical FDA dossiers: Method A has 60% credibility and predicts a 70% success probability; Method B has 40% credibility and predicts a 30% success probability. They hold equal 50% shares ($50 payout if successful). Both are risk-neutral, have no liquidity needs, and the patent has no hedging or use value beyond its payout.

  Alice prices her share using a **credibility-weighted mixture**:  
  Expected value = \([0.6 \times 0.7 + 0.4 \times 0.3] \times \$50 = 0.54 \times \$50 = \$27\).  
  Her reservation sell price is \(\geq \$27\); buy price is \(\leq \$27\).  

  Bob uses **maxmin expected utility** over the two methods:  
  Minimal expected value = \(\min(\text{Method A value}, \text{Method B value}) = \min(0.7 \times \$50, 0.3 \times \$50) = \min(\$35, \$15) = \$15\).  
  His reservation sell price is \(\geq \$15\); buy price is \(\leq \$15\).  

  **Trade interval**: Bob sells to Alice at any price \(p \in (\$15, \$27)\) (e.g., \(\$20\)). Bob gains \(\$20 - \$15 = \$5\) (by maxmin); Alice gains \(\$27 - \$20 = \$7\) (by mixture).  

  ### No-Trade Inference Failure  
  Buyer (Alice) infers: Seller (Bob) accepts \(p \geq \$15\), consistent with his maxmin rule (not new information).  
  Seller (Bob) infers: Buyer offers \(p \leq \$27\), consistent with her mixture rule (not new information).  
  **Premise failed**: *Common prior belief*. Though evidence is identical, their decision rules generate divergent valuations—no common posterior or prior exists. Neither is irrational; both follow explicit, consistent rules.  

  ### Observer Perspective & Evidence  
  An outsider sees trade without private information, liquidity needs, risk aversion, or hedging motives. There is **no factual disagreement**—both accept the credibility weights (60%/40%) and model probabilities (70%/30%). Trade is evidence for **divergent ambiguity attitudes** (mixture vs. maxmin) as the driver.  

  ### Swap Test  
  Replace maxmin Bob with expected-value Bobʹ using *only* the pessimistic model (B) as his prior:  
  Value = \(0.3 \times \$50 = \$15\) (reservation sell price \(\geq \$15\)).  
  Trade survives identically at \(p = \$20\). However:  
  - **No observable difference**: Identical trade occurs.  
  - **Interpretation shift**: Trade now stems from **heterogeneous priors** (Bobʹ believes model B is certain; Alice uses mixture). The original case isolates ambiguity aversion (same evidence → different rules); the swap reintroduces belief disagreement.  
  **Implication**: The case supports your claim *only if* traders share evidence but apply different ambiguity rules—otherwise, it reverts to the "heterogeneous priors" exemption.  

  ### Key Feature  
  **Ambiguity (Knightian uncertainty) with asymmetric decision rules**. Remove ambiguity (e.g., only one method exists) → identical expected values → no trade interval.  

  ### Objections  
  **1. Dynamic incoherence of maxmin**:  
  If ambiguity resolves pre-payout, dynamically coherent maxmin (e.g., prior-by-prior Bayesian updating) recalculates the worst-case *after* resolution. Here, resolution occurs post-trade but pre-payout.  
  - Post-resolution: Under Method A, share value = \(\$35\); Method B = \(\$15\).  
  - Maxmin value *now* = \(\min(\$35, \$15) = \$15\) (unchanged).  
  Trade survives since Bob’s reservation price remains \(\$15\).  

  **2. Ambiguity aversion as risk aversion**:  
  If maxmin is reframed as risk aversion over "model uncertainty," gains resemble risk-sharing. **Rebuttal**: Risk aversion requires concave utility, but both are risk-linear here. Maxmin evaluates *epistemic uncertainty* (which model is true), not stochastic risk (known probabilities). The exemption "risk-sharing" presumes known probabilities; here, probabilities are contested.  

  ### Market Implications  
  A market of such pairs exhibits:  
  - **Elevated volume**: Driven by systematic ambiguity-attitude mismatches.  
  - **Price dispersion**: Bid-ask spreads reflect ambiguity premiums (e.g., maxmin traders depress bids).  
  For real-world relevance, traders must:  
  (i) Face genuine ambiguity (e.g., novel assets, untested models),  
  (ii) Systematically vary in ambiguity attitudes (e.g., mixers vs. maxminers),  
  (iii) Lack collateral exemptions (no liquidity/hedging needs).  

  ---  
  **Summary**: Trade emerges from ambiguity-attitude divergence under shared evidence, invalidating the common-prior assumption without irrationality. Volume signals ambiguity conflicts when standard exemptions are closed.
