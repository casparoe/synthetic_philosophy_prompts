  The user's background reveals fascinating tensions: letterforms must maintain identity across radical visual variations (like single vs double-storey 'a's) while being context-dependent (a glyph only reads as 'a' within its typeface system). Their team composition is perfect for this - philosophers for conceptual rigor, a psychophysicist for perception testing, a generative modeler for creating variations, and a type designer for practical constraints.

  Key philosophical dilemmas stand out: Is "a-ness" intrinsic or relational? How do intention/perception conflicts resolve? Is this a good model for natural categories? The user specifically wants the ordering to address whether contrastive accounts can be distinguished from style-inference models - that feels like the hottest epistemological challenge here. 

  I notice the user dismisses "philosophically fashionable" questions - probably meaning abstract debates decoupled from empirical testing. That makes sense given their applied constraints. The team's three-year timeline and mixed methods suggest we need questions where philosophical framing meets testable hypotheses early on.

  The generative modeling component is particularly exciting as an experimental tool. If the system produces glyphs that only read correctly in context, that could tease apart whether recognition relies on systemic contrasts or just stylistic cues. But we'd need clever controls to isolate these mechanisms - perhaps by systematically severing glyph relationships while preserving style.

  For prioritization, the identity question must come first - it's logically upstream of everything else. Without clarifying whether "a-ness" is intrinsic or relational, we can't meaningfully investigate perception conflicts or category generalizability. The generative model experiments could deliver pivotal data here within 18 months. 

  I'm least confident about cutting the "teleology vs residue" question - while it might feel like philosophical wheel-spinning, type designers do treat style as functional. But with only three years, focusing on identity and perception mechanics seems more urgent.
answer: |-
  Here is a prioritized research agenda of 5 core questions, ranked by logical and empirical dependency, feasibility, and potential to resolve the funder's core challenge:

  ### Ranked Questions:
  1.  **Is letter identity primarily contrastive (system-dependent) or intrinsic (shape/skeleton-based), and can we isolate the necessary conditions for "a-ness" across variations?**
      *   **Why Ranked #1:** Logically foundational. Until we understand *what constitutes* the category "a", questions about perception, intention, and generative models are premature. It directly tackles the funder's core question ("what makes every 'a' an 'a'?").
      *   **Feasibility:** High. The team is ideal: philosophers frame the problem (invariance vs. contrast), the type designer provides real-world constraints and variations, the psychophysicist designs discrimination/perception tasks (e.g., morphing between 'a's, isolating glyphs vs. presenting in minimal context), the modeler generates controlled variations (e.g., interpolating skeletons, perturbing features). Testable within 18 months.
      *   **Neglected?** While debated, the *empirical testing* of intrinsic vs. contrastive accounts using generative models and controlled psychophysics on typographic categories is novel.
      *   **Progress Indicator (18mo):** Clear empirical signature favoring one account (e.g., robust recognition of novel 'a' skeletons *only* when presented with minimal context vs. universal recognition of isolated glyphs matching an intrinsic template despite style). Moves down if results are ambiguous or strongly context-dependent *without* clarifying mechanism.

  2.  **Can we empirically distinguish between a *strong contrastive account* (identity *requires* systemic discrimination) and a *weak style-inference account* (isolated recognition depends on prior style categorization) using generative models and perception studies?**
      *   **Why Ranked #2:** Directly addresses the user's critical second issue and builds directly on Q1. If Q1 suggests contrast matters, this tests *how* it matters. It operationalizes the philosophical distinction empirically.
      *   **Feasibility:** High. The generative modeler is key: seed models with partial alphabets/styles, generate completions. Psychophysicist tests recognition of isolated generated 'a's vs. 'a's in minicontexts (e.g., with 'o', 'd', 'n') vs. full alphabets, across styles. Philosophers design the interpretations.
      *   **Neglected?** The specific operationalization using generative AI to *create* the test cases for this precise distinction in typography is highly novel.
      *   **Progress Indicator (18mo):** Results from generative model completions + perception tests. Does isolated recognition correlate perfectly with stylistic coherence of the glyph itself (supporting weak account), or *only* occur when the minimal discriminative context is present (supporting strong account)? Moves up if Q1 points strongly to contrast but mechanism is unclear; moves down if Q1 strongly supports intrinsic invariance.

  3.  **What resolves conflicts in identity assignment when intention, perception, encoding, and history diverge? What authority (if any) prevails?**
      *   **Why Ranked #3:** Assumes we have some grasp of identity conditions (Q1) and recognition mechanisms (Q2). Addresses the user's third issue – real-world messiness. Essential for applicability to both philosophy (concept grounding) and type design (designer intent vs. user experience).
      *   **Feasibility:** Moderate-High. Requires philosophical analysis of authority sources and empirical study (psychophysics on misperceived glyphs, analysis of historical encoding errors, interviews with designers). The type designer's insight is crucial here.
      *   **Neglected?** Often discussed abstractly in philosophy; rarely studied empirically in this specific, controlled typographic domain with all factors present.
      *   **Progress Indicator (18mo):** Development of a framework/taxonomy of conflict cases and pilot empirical data (e.g., how often does designer intent override common misperception in practice? What features trigger encoding mismatches?).

  4.  **Is the letterform case a valid model for natural categories, or is its reliance on design and discriminative function fundamentally limiting?**
      *   **Why Ranked #4:** Requires results from Q1-Q3 to evaluate. Addresses the user's fourth issue and the broader philosophical significance. Crucial for justifying the "test case" approach to the funder and academic audiences.
      *   **Feasibility:** Moderate. Primarily philosophical analysis informed by empirical results from Q1-Q3 and comparison to literature on artifact vs. natural kind cognition. The generative modeler could simulate "less optimized" categories.
      *   **Neglected?** The *specificity* of using typography as the testbed for this meta-question is novel, though the general debate isn't.
      *   **Progress Indicator (18mo):** Clear articulation of how results from Q1-Q3 bear on the artifact/natural kind distinction. Moves up if Q1-Q3 reveal deep parallels with natural category debates; moves down if results seem uniquely tied to design optimization.

  5.  **Is "style" a separable residue or a dimension constitutive of letter identity? How many orthogonal dimensions define it?**
      *   **Why Ranked #5:** Builds on understanding identity (Q1) and perception (Q2). Addresses the user's fifth issue. Important for type design tools and generative models (output control).
      *   **Feasibility:** Moderate. Requires psychophysics (similarity judgments, discrimination tasks), generative modeling (latent space traversal), and type designer expertise. Complex to define and measure dimensions.
      *   **Neglected?** Style is often treated intuitively; rigorous decomposition into potentially orthogonal dimensions (weight, contrast, proportion, skeleton, serif form, curvature...) and testing their role in identity is less common.
      *   **Progress Indicator (18mo):** Preliminary model of style dimensions derived from designer input and psychophysics. Moves up if Q1/Q2 show style *is* constitutive; moves down if style proves easily separable without affecting core identity judgments.

  ### The Cut Question
  *   **Question to Cut:** "Does 'a' have an essential geometric skeleton invariant across all typefaces?"
  *   **Why Cut:** While seemingly central, it risks being philosophically fashionable (chasing essentialism) but low-yield. Q1 directly confronts the viability of intrinsic accounts *including but not limited to* skeleton invariance. Focusing narrowly on skeleton pre-emptively dismisses other potential intrinsic features (topology, stroke sequence remnants, feature constellations) and the strong possibility that *no* robust intrinsic invariant exists (as the Futura/Helvetica example suggests). Investigating "intrinsic" broadly in Q1 is more productive and avoids getting bogged down in one specific (likely flawed) hypothesis.

  ### Confidence & Least Sure Claim
  *   **Confidence in Ranking:** High (8/10) on Q1-#1 and Q2-#2 due to logical dependency and team alignment. Moderate (7/10) on Q3-#3 and Q4-#4. Moderate-Low (6/10) on Q5-#5 as it's more specialized.
  *   **Least Sure Claim:** My ranking of **Q5 (Style) at #5**. It *could* be more fundamental if early results in Q1/Q2 show style is inextricably bound to identity perception in ways that challenge the intrinsic/contrastive dichotomy itself. It might need elevating if pilot studies show style dimensions directly constrain possible skeletons or contrasts. (Confidence in its placement: 6/10).

  This agenda prioritizes foundational ontology (Q1), then critical mechanism testing (Q2), then real-world application and conflict (Q3), then generalizability (Q4), and finally a deeper dive into a key parameter (Q5). It leverages the unique team composition for empirical progress on philosophically core issues within 3 years, directly targeting the funder's brief.
