  Key elements from the instructor's request:
  1. The scenario: A bi-infinite chain of people (one per integer), baseline welfare for person n is n.
  2. The "shift" world: welfare for person n is n+1. This is a permutation of the baseline welfare levels (since shifting integers is a bijection). 
     - Pareto: In the shift world, every person is better off (n+1 > n for each n). 
     - Anonymity: The multiset of welfare levels is the same (both are the integers). So by anonymity, the two worlds should be equally good. But by Pareto, the shift is strictly better. Conflict.
  3. Objections: 
     a. The construction relies on welfare being unbounded below? 
     b. Can we run the same with bounded welfare using a clever permutation?
  4. Tethered difference rule: 
     - Fix a nested sequence of finite sets (a "tether") that covers all people. 
     - For two outcomes A and B, look at the difference in total welfare (A minus B) within each finite set in the tether. 
     - Rule: 
          * A > B if the difference is positive for all sufficiently large sets in the tether.
          * A < B if the difference is negative for all sufficiently large sets in the tether.
          * Incomparable otherwise.
  5. Questions to press:
     a. Does this rule escape paralysis for local actions? (e.g., saving one child: a finite improvement in a finite region)
     b. Does it violate anonymity? (We suspect it might because the tether breaks symmetry)
     c. Do the verdicts depend on the tether? (We'll ask to construct an example: two worlds that are permutations of each other, and two tethers that lead to opposite verdicts, and a symmetric one that leads to incomparable.)
     d. What happens if we demand tether-independence? Then we might be left with only robust dominance (which is when the outcome is better regardless of the tether) and incomparability otherwise.

