  ## Part 1: The Shift Conflict (7 marks)

  Consider a world with a countably infinite population, one person for each integer. In the baseline world, person \(n\) has welfare \(w_n = n\). In the shift world, person \(n\) has welfare \(w'_n = n+1\).

  (a) (2 marks) Explain why the shift world is strictly better than the baseline world according to the Pareto principle.  
  (b) (2 marks) Explain why the baseline and shift worlds should be judged equally good according to the anonymity principle.  
  (c) (3 marks) Now consider a bounded welfare setting: for each integer \(n\), let the baseline welfare be \(v_n = (-1)^n \frac{1}{|n|+1}\). Consider the world obtained by swapping the welfare of person 0 and person 1 (so person 0 gets \(v_1\) and person 1 gets \(v_0\), while others remain unchanged).  
     - Is this swapped world a Pareto improvement over the baseline? Why or why not?  
     - Does anonymity require that the swapped world is equally good as the baseline?  
     - Is there a conflict between the Pareto principle and anonymity in this case? Explain.

  ## Part 2: Tethered Difference Rule (8 marks)

  The tethered difference rule is defined as follows:  
     - Fix a nested sequence of finite sets of people \(S_1 \subset S_2 \subset \cdots\) such that \(\bigcup_{k=1}^\infty S_k = \mathbb{Z}\) (all integers). This is called a *tether*.  
     - For two outcomes \(A\) and \(B\), for each set \(S_k\), compute the total welfare in \(A\) minus the total welfare in \(B\) restricted to \(S_k\).  
     - We say \(A\) is better than \(B\) if there exists some \(K\) such that for all \(k \geq K\), the difference is positive.  
     - \(A\) is worse than \(B\) if there exists some \(K\) such that for all \(k \geq K\), the difference is negative.  
     - Otherwise, \(A\) and \(B\) are incomparable.

  (a) (3 marks) In the baseline world from Part 1 (welfare \(n\) for person \(n\)), we improve the welfare of person 0 from 0 to 1, leaving everyone else unchanged. Call this new world \(A\) and the baseline world \(B\). Show that regardless of the choice of tether, the tethered difference rule ranks \(A\) better than \(B\).

  (b) (5 marks) Consider two worlds:  
     - World \(X\): for every even integer, welfare is 1; for every odd integer, welfare is 0.  
     - World \(Y\): for every even integer, welfare is 0; for every odd integer, welfare is 1.  
     Note that \(X\) and \(Y\) are permutations of each other.  
     - Tether 1: \(S_k = \{-k, -k+1, \ldots, k\}\) for \(k=1,2,3,\ldots\)  
       Apply the tethered difference rule to compare \(X\) and \(Y\) using Tether 1. What is the verdict?  
     - Tether 2: \(S_k = \{1, 2, \ldots, 2k-1\}\) for \(k=1,2,3,\ldots\)  
       Apply the tethered difference rule to compare \(X\) and \(Y\) using Tether 2. What is the verdict?  
     - Construct a third tether (Tether 3) such that the rule returns that \(X\) and \(Y\) are incomparable. Describe Tether 3 explicitly and briefly explain why the verdict is incomparable.

  ## Part 3: Anonymity and Tether-Independence (5 marks)

  (a) (2 marks) In light of your findings in Part 2(b), does the tethered difference rule respect the anonymity principle? Explain.  
  (b) (3 marks) Suppose we require that the tethered difference rule's verdict must be the same for every choice of tether (i.e., the rule is tether-independent). Under this requirement, what pairs of worlds would be comparable? What would happen in the comparison between \(X\) and \(Y\) from Part 2(b)?

  ## Part 4: Impossibility (5 marks)

  We desire a rule that satisfies the following three properties:  
     1. *Responsiveness to finite local improvements*: If two worlds \(A\) and \(B\) are such that \(A\) differs from \(B\) in the welfare of only a finite set of people, and in \(A\) at least one person is better off while no one is worse off, then \(A\) is better than \(B\).  
     2. *Tether-independence*: The rule's verdict does not depend on the choice of tether (as defined in Part 3).  
     3. *Acyclicity*: The strict preference relation defined by the rule is acyclic (i.e., there is no cycle \(A_1 > A_2 > \cdots > A_n > A_1\)).

  Show that no rule can satisfy all three properties. Which property would you drop? Defend your choice.

