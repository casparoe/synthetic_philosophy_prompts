     - *Typical mistake*: Assumes swap is Pareto or ignores that anonymity’s permutation argument applies here.  

  3. **Tethered Applications (Part 2a/b)**:  
     - *Full marks*: Shows \(A > B\) always (via person 0); computes \(X > Y\) for Tether 1 and \(Y > X\) for Tether 2; constructs Tether 3 with oscillation (e.g., sequential addition) and explains incomparability.  
     - *Typical mistake*: Incorrect even/odd counts in \(S_k\) or builds a tether that doesn’t cover all integers.  

  4. **Anonymity Cost (Part 3)**:  
     - *Full marks*: States rule violates anonymity (due to tether dependence); under tether-independence, only robustly dominant pairs are comparable (incomparable for \(X/Y\)).  
     - *Typical mistake*: Claims anonymity holds if we "fix" the tether or misses that tether-independence collapses comparability.  

  5. **Impossibility Defense (Part 4)**:  
     - *Full marks*: Shows tether-independence conflicts with responsiveness/acyclicity (e.g., \(X/Y\) incomparability vs. finite improvements); drops tether-independence and defends based on responsiveness/acyclicity priorities.  
     - *Typical mistake*: Drops responsiveness or acyclicity without justification; fails to link to Part 2(b) arbitrariness.  

