  (a) The Pareto principle says that if one world is strictly better for at least one person and at least as good for everyone else, then it is strictly better overall. In the shift world, for every person \(n\), we have \(n+1 > n\), so every person is strictly better off. Therefore, by Pareto, the shift world is strictly better.  
  (b) Anonymity requires that if two worlds have the same multiset of welfare levels (i.e., the same distribution), then they are equally good. The shift world assigns welfare levels \(n+1\) for each \(n\), and the baseline assigns \(n\). The multiset of welfare levels in both is the set of all integers, \(\{\ldots, -2, -1, 0, 1, 2, \ldots\}\), because the integers are permutation-invariant under shifting. Hence, by anonymity, they are equally good.  
