  ### Take-Home Final Question  
  **Consequentialism and Infinite Value**  
  **Total Marks:** 25  
  **Time Guidance:** Strong students should aim to complete this question in 90 minutes.  

  ---

  #### **Part 1: The Shift Conflict** (7 marks)  
  Consider a world with a countably infinite population, one person for each integer. In the baseline world, person \(n\) has welfare \(w_n = n\). In the shift world, person \(n\) has welfare \(w'_n = n+1\).  

  (a) Explain why the shift world is strictly better than the baseline world according to the Pareto principle. (2 marks)  
  (b) Explain why the baseline and shift worlds should be judged equally good according to the anonymity principle. (2 marks)  
  (c) Now consider a bounded welfare setting: for each integer \(n\), let the baseline welfare be \(v_n = (-1)^n \frac{1}{|n|+1}\). Consider a world where the welfare of person 0 and person 1 are swapped (person 0 gets \(v_1\), person 1 gets \(v_0\), others unchanged).  
  - Is this swapped world a Pareto improvement over the baseline? Why or why not?  
  - Does anonymity require that the swapped world is equally good as the baseline?  
  - Is there a conflict between Pareto and anonymity here? Explain. (3 marks)  

  ---

  #### **Part 2: Tethered Difference Rule** (8 marks)  
  The *tethered difference rule* fixes a nested sequence of finite sets \(S_1 \subset S_2 \subset \cdots\) (a "tether") covering all integers. For outcomes \(A\) and \(B\), compute \(\Delta_k = \text{total welfare in } A \text{ minus total welfare in } B \text{ over } S_k\).  
  - Rank \(A > B\) if \(\Delta_k > 0\) for all sufficiently large \(k\).  
  - Rank \(A < B\) if \(\Delta_k < 0\) for all sufficiently large \(k\).  
  - Otherwise, \(A\) and \(B\) are incomparable.  

  (a) In the baseline world, we improve person 0’s welfare from 0 to 1, leaving others unchanged. Call this new world \(A\) and the baseline \(B\). Show that \(A > B\) under any tether. (3 marks)  
  (b) Consider:  
    - World \(X\): Welfare 1 for even integers, 0 for odd integers.  
    - World \(Y\): Welfare 0 for even integers, 1 for odd integers.  
    Note: \(X\) and \(Y\) are permutations of each other.  
    - Using *Tether 1* (\(S_k = \{-k, -k+1, \ldots, k\}\)), compute the verdict for \(X\) vs. \(Y\).  
    - Using *Tether 2* (\(S_k = \{1, 2, \ldots, 2k-1\}\)), compute the verdict for \(X\) vs. \(Y\).  
    - Construct *Tether 3* (describe explicitly) such that \(X\) and \(Y\) are incomparable. Explain briefly. (5 marks)  

  ---

  #### **Part 3: Anonymity and Tether-Independence** (5 marks)  
  (a) In light of Part 2(b), does the tethered difference rule respect anonymity? Explain. (2 marks)  
  (b) Suppose we require verdicts to be *independent of the tether* (i.e., the same for all tethers).  
  - Which pairs of worlds would be comparable?  
  - What would happen when comparing \(X\) and \(Y\) from Part 2(b)? (3 marks)  

  ---

  #### **Part 4: Impossibility** (5 marks)  
  We want a rule with three properties:  
  1. **Responsiveness**: If \(A\) improves welfare for a finite set of people (at least one strictly) and leaves others unchanged, then \(A > B\).  
  2. **Tether-independence**: Verdicts do not depend on the choice of tether.  
  3. **Acyclicity**: No cycles in strict preferences (e.g., no \(A_1 > A_2 > \cdots > A_n > A_1\)).  

  Show that no rule satisfies all three. Which property would you drop? Defend your choice.  

  ---

  ### Model Answer  
  **Approximate word count: 850**  

  #### **Part 1**  
  (a) The Pareto principle ranks \(A\) above \(B\) if at least one person is better off in \(A\) and no one is worse off. In the shift world, every person \(n\) has welfare \(n+1 > n\), so each is strictly better off. Thus, the shift world is strictly better.  
  (b) Anonymity requires that if two worlds have the same multiset of welfare levels, they are equally good. The shift assigns welfare \(n+1\) to person \(n\), which is a permutation of the integers (the same multiset as baseline). Thus, anonymity demands equal goodness.  
  (c)  
  - **Not a Pareto improvement**: In the swapped world, person 0’s welfare falls from \(v_0 = 1\) to \(v_1 = -\frac{1}{2}\), while person 1’s welfare rises from \(-\frac{1}{2}\) to \(1\). One is worse off, violating Pareto.  
  - **Anonymity requires indifference**: Swapping two people is a permutation, so anonymity implies the swapped world is equally good.  
  - **No conflict**: Pareto does not demand improvement (since someone loses), so anonymity’s requirement of indifference poses no conflict. The original shift conflict relied on an *infinite* permutation where *everyone* gains (only possible with unbounded welfare).  

  #### **Part 2**  
  (a) The welfare difference \(\Delta_k = (\text{total in } A) - (\text{total in } B)\) is 1 if \(0 \in S_k\) (from person 0’s improvement), else 0. Since the tether covers all integers, there exists \(K\) such that \(0 \in S_k\) for all \(k \geq K\). Thus, \(\Delta_k = 1 > 0\) for \(k \geq K\), so \(A > B\) for any tether.  
  (b)  
  - **Tether 1** (\(S_k = \{-k, \dots, k\}\)):  
    Number of even integers: \(k + 1\) (including 0). Number of odd integers: \(k\).  
    Total welfare in \(X\): \(k + 1\), in \(Y\): \(k\).  
    \(\Delta_k = (k + 1) - k = 1 > 0\) for all \(k\). Verdict: \(X > Y\).  
  - **Tether 2** (\(S_k = \{1, \dots, 2k-1\}\)):  
    Even integers: \(2, 4, \dots, 2k-2\) (\(k - 1\) values). Odd integers: \(1, 3, \dots, 2k-1\) (\(k\) values).  
    Total in \(X\): \(k - 1\), in \(Y\): \(k\).  
    \(\Delta_k = (k - 1) - k = -1 < 0\) for all \(k \geq 1\). Verdict: \(Y > X\).  
  - **Tether 3**: Let \(S_k\) add people in order: \(0, 1, -1, 2, -2, 3, -3, \dots\) (e.g., \(S_1 = \{0\}\), \(S_2 = \{0, 1\}\), \(S_3 = \{0, 1, -1\}\), etc.).  
    \(\Delta_k\) oscillates:  
    - \(S_1\): \(X\) (welfare 1 at 0), \(Y\) (0) → \(\Delta_1 = 1\).  
    - \(S_2\): Both have total 1 → \(\Delta_2 = 0\).  
    - \(S_3\): \(X\) (0:1, 1:0, -1:0 → total 1), \(Y\) (0:0, 1:1, -1:1 → total 2) → \(\Delta_3 = -1\).  
    - \(S_4\): Both total 2 → \(\Delta_4 = 0\).  
    - Pattern repeats: \(\Delta_k\) cycles through \(1, 0, -1, 0, \dots\). Never eventually positive/negative. Verdict: Incomparable.  

  #### **Part 3**  
  (a) The rule violates anonymity. \(X\) and \(Y\) are permutations (should be equally good), but Tether 1 ranks \(X > Y\), Tether 2 ranks \(Y > X\), and Tether 3 calls them incomparable. Anonymity is broken because the tether imposes an arbitrary "labeling" (ordering) that treats identical distributions differently.  
  (b) Under tether-independence:  
  - **Comparable pairs**: Only those differing in finitely many positions and where one is better for all affected (robust dominance), e.g., \(A\) and \(B\) in Part 2(a).  
  - **\(X\) vs. \(Y\)**: They differ infinitely and are permutations, so no robust dominance. All tethers must agree or be incomparable. Since verdicts conflict (Part 2(b)), the only consistent outcome is incomparable.  

  #### **Part 4**  
  **Impossibility**: Suppose a rule satisfies all three.  
  - By responsiveness, if \(A\) improves one person’s welfare finitely (no others affected), then \(A > B\).  
  - By tether-independence, \(X\) and \(Y\) (Part 2(b)) must be comparable or incomparable *uniformly*. But Part 2(b) shows verdicts vary by tether, so tether-independence forces incomparability for \(X\) and \(Y\).  
  - Now, apply responsiveness: Improve person 0 in \(X\) from 1 to 2, calling this \(X'\). Then \(X' > X\). But \(X'\) and \(Y\) are not robustly comparable (differ infinitely), so tether-independence also forces \(X'\) and \(Y\) incomparable.  
  - Consider a cycle: Start from \(X\).  
    - Improve person 1 in \(X\) from 0 to 1, calling this \(X_1\). Responsiveness: \(X_1 > X\).  
    - Improve person 2 in \(X_1\) from 1 to 2, calling this \(X_2\). Responsiveness: \(X_2 > X_1\).  
    - Continue indefinitely. Each \(X_{k+1} > X_k\), so by acyclicity, \(X < X_1 < X_2 < \cdots\) (no cycle).  
  - **Conflict**: The sequence \(X_1, X_2, \dots\) approaches a world \(X^*\) similar to \(X\) but with all finite improvements. However, \(X^*\) and \(Y\) are still not robustly comparable, so incomparable. No direct cycle arises, but the *combination* of properties is unsustainable:  
    Responsiveness and acyclicity allow finite chains, but tether-independence forces incomparability in cases like \(X\) and \(Y\), preventing coherent infinite aggregation.  

  **Which to drop?** Drop **tether-independence**.  
  - **Defense**: Responsiveness is essential for ethical traction (e.g., saving a child). Acyclicity prevents irrational cycles. Tether-independence, while ideal for fairness, is the source of arbitrariness (as seen in Part 2(b)) and over-constrains the rule. By fixing a single tether, we restore comparability for finite cases (e.g., Part 2(a)) and avoid incompleteness, though verdicts may depend on the tether. Anonymity must then be sacrificed, but this reflects a real ethical cost: the tether breaks symmetry between individuals.  

