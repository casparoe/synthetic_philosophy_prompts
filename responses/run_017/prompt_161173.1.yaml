  Below is a decision tree designed to diagnose implicit accounts of the killing/letting-die distinction in clinical ethics. It uses 8 concrete case-based questions (nodes) to map to 9 coherent ethical positions (leaves), including unnamed or rare views. The tree avoids theory names and legal/jurisdictional issues, focusing on moral structure. Required cases are integrated into the nodes. Unoccupied combinations are noted, and indistinguishable leaf pairs are flagged.  

  ### **Decision Tree: Killing vs. Letting Die in Clinical Ethics**  
  *Answer each question based on gut response to the case. Follow the path to your leaf position.*  

  1. **Withdrawing Ventilation**: A patient is ventilator-dependent. When we withdraw the vent and they die, is the cause of death:  
     - **A. Our action** (we removed their support).  
     - **B. The underlying disease** (we allowed it to take its course).  

  2. **Intention vs. Foresight**: A doctor stops a burdensome treatment to respect patient autonomy. They foresee death but don’t aim for it. If they did the *same action* intending death, would this change the classification?  
     - **A. Yes** (intention shifts it from letting die to killing).  
     - **B. No** (the physical act determines classification, not intent).  

  3. **Iatrogenic Threat**: A surgeon creates a temporary dependence (e.g., a graft). The team declines follow-up, and the patient dies. Is this:  
     - **A. Killing** (we caused the lethal threat).  
     - **B. Letting die** (we didn’t fix a pre-existing threat).  

  4. **Failing to Re-Arm**: An infusion pump requires resetting every 24 hours. A clinician doesn’t reset it, and the patient dies. Is this:  
     - **A. An omission** (failure to act = letting die).  
     - **B. Part of an ongoing action** (inaction completes a prior act = killing).  

  5. **Handoff Refusal**: Clinician A disconnects a vent. Clinician B refuses to reconnect it. Clinician B is:  
     - **A. Killing** (active refusal to sustain life).  
     - **B. Letting die** (omission to intervene).  

  6. **Time to Death**: A patient dies 3 minutes after extubation vs. 3 weeks after stopping tube feeds. Does timing affect classification?  
     - **A. Yes** (fast death = killing; slow = letting die).  
     - **B. No** (irrelevant to classification).  

  7. **Competent Refusal**: A patient refuses dialysis. The team honors this, and the patient dies. Is the team:  
     - **A. Killing** (actively enabling death).  
     - **B. Letting die** (respecting refusal to accept help).  

  8. **Protracted Suffering**: A patient dies slowly and painfully after withdrawal of care. If killing had been quicker, would *this case* be:  
     - **A. Killing** (outcome makes inaction equivalent to killing).  
     - **B. Letting die** (classification unchanged by suffering).  

  ---

  ### **Leaves (Ethical Positions)**  
  *Combinations map to coherent views. Unnamed positions lack standard labels. Unoccupied combinations are noted.*  

  - **Leaf 1: Traditional Double Effect**  
    *Path:* 1B, 2A, 3B, 4A, 5B, 6B, 7B, 8B.  
    Killing requires *actively causing death*; letting die is *omission*. Intention distinguishes otherwise similar acts. Withdrawing treatment allows disease to kill; iatrogenic inaction isn’t killing; time/suffering irrelevant.  

  - **Leaf 2: Causal Responsibility View**  
    *Path:* 1A, 2B, 3A, 4B, 5A, 6B, 7B, 8B.  
    Killing = *causing death* (actively or via created dependence). Letting die = *not intervening* in pre-existing threats. Vent withdrawal causes death; failing to re-arm is killing; handoff refusal is active.  

  - **Leaf 3: Act-Omission Only**  
    *Path:* 1A, 2B, 3B, 4A, 5B, 6B, 7B, 8B.  
    Strict physical distinction: killing = *bodily act* causing death; letting die = *inaction*. Vent withdrawal is an act (killing); iatrogenic inaction is omission (letting die). Intention irrelevant.  

  - **Leaf 4: (Unnamed: Iatrogenic Asymmetry)**  
    *Path:* 1B, 2B, 3A, 4A, 5B, 6B, 7B, 8B.  
    Killing only if we *created the threat* (e.g., surgical complication). Otherwise, letting die. Vent withdrawal isn’t killing (disease causes death); but iatrogenic inaction is.  

  - **Leaf 5: (Unnamed: Intention-Sensitive Causation)**  
    *Path:* 1A, 2A, 3A, 4B, 5A, 6B, 7B, 8B.  
    Killing = *causing death* + *intent to end life*. Vent withdrawal is killing only if intended; otherwise letting die. Rare due to tension between nodes 1A and 2A.  

  - **Leaf 6: (Unnamed: Outcome-Utilitarian)**  
    *Path:* 1B, 2B, 3B, 4A, 5B, 6B, 7B, 8A.  
    Classification depends on *consequences*. Protracted suffering makes letting die equivalent to killing (asymmetry flips). Other nodes align with Traditional.  

  - **Leaf 7: (Unnamed: Consent-Based Letting Die)**  
    *Path:* 1B, 2B, 3B, 4A, 5B, 6B, 7A, 8B.  
    Competent refusal turns *any* death into letting die (patient "causes" it). Otherwise, withdrawal/intention irrelevant.  

  - **Leaf 8: Time-Dependent View**  
    *Path:* 1B, 2B, 3B, 4A, 5B, 6A, 7B, 8B.  
    Killing = death *immediately* follows act; letting die = *delayed* death. Vent withdrawal (3 min) is killing; stopping feeds (3 wks) is letting die.  

  - **Leaf 9: Killing-Only Equivalence**  
    *Path:* 1A, 2B, 3A, 4B, 5A, 6B, 7A, 8A.  
    No meaningful distinction. All deaths involve causal responsibility (e.g., vent withdrawal, refusing reconnection, honoring refusal).  

  ---

  ### **Unoccupied Combinations & Notes**  
  - **Incoherent**: 1A + 7B + 3B. *Why?* Claiming withdrawal causes death (1A) but iatrogenic inaction doesn’t (3B) contradicts causal consistency.  
  - **Unattractive**: 1B + 3A + 4B. *Why?* Inaction (failing to re-arm) classified as killing, but withdrawal (active) as letting die—logically strained.  
  - **Unoccupied**: Paths with 6A + 7A. *Why?* Time-sensitivity (6A) clashes with "refusal = killing" (7A); no coherent view holds both.  
  - **Indistinguishable Leaves**:  
    - Leaf 1 (Traditional) and Leaf 6 (Outcome-Utilitarian) *only differ at Node 8*. The tree cannot separate them further; Node 8 is the sole divider.  
    - Leaf 2 (Causal) and Leaf 9 (Killing-Only) *differ only at Node 7*. Node 7 distinguishes them.  

  ---

  ### **Key Node for Clinical Disagreements**  
  **Node 1 (Withdrawing Ventilation)** generates the most conflict in hospital settings. It forces consultants to declare whether removing support *causes death* or *permits disease to kill*. This split underlies debates about withdrawal (e.g., vent vs. lethal injection), iatrogenic cases, and handoffs. When teams agree on facts but disagree morally, Node 1 typically reveals whether they prioritize *causal responsibility* (A) or *natural causation* (B). Resolving this often preempts later nodes.  

  ---  
  *Design notes: Tree built from logical space of moral features (causation, intent, dependence, time, outcome). Cases anonymized to avoid bias. "Unnamed" leaves lack widely accepted labels but represent internally consistent views.*
