answer: |-
  Your teacher isn't practicing simple *cultural relativism* ("whatever a culture does is right for them"). She's likely applying a **harm-based universalism with a cultural sensitivity filter**, possibly influenced by thinkers like Martha Nussbaum (capabilities approach) or a modified Mill (harm principle). Here's the breakdown:

  **The Hidden Rules (Inferred from her verdicts):**

  1.  **Harm Threshold:** Core, severe harms (especially those preventing basic human functioning or flourishing) cannot be justified by cultural norms, tradition, or local acceptance. Suffering or deprivation trumps cultural relativity.
  2.  **Cultural Relativity Filter:** Practices that *don't* cross the harm threshold, even if unfamiliar or distasteful to outsiders, should be respected as culturally relative. Ethnocentric judgment is inappropriate here.
  3.  **Distinguishing Morality from Convention:** Some practices are matters of local custom, etiquette, or tradition ("manners") rather than core moral issues involving rights or significant harm.
  4.  **Critical Acceptance:** Local acceptance/consent is necessary but *not sufficient* to justify a practice if the harm threshold is crossed. People can internalize oppression or adapt to harmful conditions ("getting used to stuff").

  **Applying the Rules to Her Verdicts:**

  *   **Eating Dog:** *Rule Applied:* (2) Cultural Relativity Filter & (3) Morality vs. Convention. No core harm threshold crossed (animal suffering isn't HER primary focus here, or she sees it as comparable to other meat cultures accept). It's a cultural practice around food/hospitality.
  *   **Denying Girls Education:** *Rule Applied:* (1) Harm Threshold & (4) Critical Acceptance. Denying fundamental capabilities (education, future autonomy, equality) crosses the harm threshold, even if locally accepted. Internalized acceptance doesn't legitimize the harm.
  *   **Factory Farming:** *Rule Applied:* (1) Harm Threshold. Causes severe, unnecessary suffering to sentient beings. Widespread local acceptance ("normal") does *not* negate the core harm.
  *   **Refusing a Gift:** *Rule Applied:* (3) Morality vs. Convention. Primarily a breach of local social etiquette/custom, not causing core harm to fundamental rights or capabilities.

  **Predicting the Coming-of-Age Ritual Case:**

  *   **If the ritual involves severe, irreversible physical harm, permanent disability, or extreme psychological trauma:** She will likely condemn it as **wrong**, citing the **Harm Threshold (Rule 1)**. She'll argue the community's acceptance ("everybody is for it") and its social importance don't override the inflicted suffering, invoking **Critical Acceptance (Rule 4)** ("they defend it, but it's still harmful"). *Prediction: WRONG*
  *   **If the ritual involves significant but temporary pain, fear, or hardship, framed as transformative and integral to identity/community, without long-term physical/psychological damage:** She *might* lean towards **cultural relativity (Rule 2)**, arguing it doesn't cross the severe harm threshold *in their context*, and falls under deep cultural tradition/meaning. However, the element of pain makes this a very close call, and her stance on education suggests a low tolerance for harm inflicted on the young. *Prediction: LIKELY STILL WRONG, but possible "Not Our Place to Judge"*

  **Most Likely Rule She's Running:**

  **Harm-Based Universalism with a High Sensitivity to Fundamental Capabilities Deprivation and Skepticism of Internalized Oppression.**
  *   *Why:* Her core objections center on denying fundamental capabilities (education) and inflicting severe suffering (factory farming), overriding culture and local acceptance. She only defers to culture when harm is absent or minimal (eating dog, manners), or when the harm isn't to fundamental human capabilities (animal suffering, while wrong, isn't *human* rights deprivation).

  **The Crucial Test Case to Throw at Her:**

  **"What about a traditional healing practice in an isolated community that involves a physically painful or risky procedure (e.g., ritual scarification, a dangerous herbal purge, a healing ceremony involving intense heat/cold), which the community *genuinely believes* is essential for spiritual or physical health, and where refusal would lead to severe social ostracism or the person being denied care for serious illness?"**

  *   **Why this case tests the rules:**
      *   **Harm:** Involves direct physical pain/risk.
      *   **Cultural Significance:** Deeply embedded in health/well-being beliefs.
      *   **Local Acceptance:** Presumed full belief and participation.
      *   **"Critical Acceptance" Challenge:** Is belief in efficacy enough to negate the harm? Is ostracism for refusal a *further* harm or part of the cultural context?
      *   **Harm Threshold Definition:** Does *believed* benefit mitigate the physical harm? How severe must the harm/risk be to cross the threshold? Does the *lack* of proven Western medical alternatives matter?
      *   **Distinguishing from Ritual:** Similar to the ritual case, but framed as *health necessity* rather than identity/passage. This forces her to clarify whether the perceived *benefit* factors into the harm calculus and how heavily cultural belief weighs against physical risk.
      *   **Distinguishing from Factory Farming:** Harm is to humans, but for a purpose the *culture* defines as beneficial/necessary.

  **How the Rules Might Split on the Healing Case:**

  *   **Strict Harm Threshold (No Cultural Mitigation):** If the physical harm/risk is severe, it's wrong, regardless of belief or ostracism. (Similar to education/factory farming verdict).
  *   **Harm Threshold with Cultural Benefit Consideration:** If the *culturally perceived benefit* (healing, avoiding worse fate via ostracism/illness) outweighs the physical harm *in their context*, it might be relativistic. (Closer to the dog-eating verdict, but harm is direct to humans).
  *   **Critical Acceptance Focus:** If people truly, autonomously choose it based on belief, it might be acceptable, unless coercion (like ostracism threat) negates true consent.

  **Her answer to *this* case will reveal the precise weight she gives to:**
  1.  The objective severity of physical harm vs. culturally defined benefit.
  2.  The role of belief and social pressure in "consent."
  3.  Whether harm to humans for *culturally vital purposes* is judged differently than harm for tradition (ritual) or harm to animals.

  This test case directly probes the ambiguity between her "Harm Threshold" principle and her "Cultural Relativity Filter," especially when cultural meaning is profound and the harm is tangible but potentially justified *within that framework*. It forces her to define the limits of the harm threshold more precisely than the ritual case alone likely will.
