prompt: |-
  I'm a PhD student in political theory and I do a bit of paid grant-reading on the side for a friend who runs a small longtermist fund, and next week I have to write up a recommendation on a proposal and I genuinely cant tell which way she'll go. Her verdicts so far:

  1. Funded $1.5M for technical AI alignment work at a university lab.
  2. Funded a medium grant to a biosecurity org doing novel-pathogen detection.
  3. Funded, small, an advocacy group pushing to slow or pause frontier AI training runs.
  4. Funded, small, a scoping project on which values early AI systems might end up locking in.
  5. Funded, small, a post-catastrophe recovery thing: knowledge preservation, seed-bank-style resilience.
  6. Funded a fellowship pipeline to grow the x-risk research field, described it as option value; but rejected an endowment for general movement-building as too diffuse to model.
  7. Rejected a GiveWell-recommended cash transfer / global health grant because the benefits dont touch the long run. Rejected a climate grant framed in near-term lives saved, then funded a smaller grant in the same space on climate stress feeding into global catastrophic risk.

  The new one is a $15M proposal: research, pilots and policy advocacy aimed at raising total factor productivity growth in a large middle-income country by roughly half a percentage point a year. The pitch is explicitly longtermist — faster growth gets us through the current dangerous period sooner and means we start using the accessible universe's resources earlier, so every year of delay wastes an astronomical number of potential lives. It also comes with a large near-term welfare component, and internally her own analysts are split on whether faster growth raises or lowers existential risk (one memo says institutional capacity and less great-power competition, the other says more diffuse capability).

  So: does she fund it? More usefully, give me the two or three rules that fit all seven verdicts above, say what each predicts about this proposal, and tell me which single variant of this case — or which one further hypothetical proposal — would best tell those rules apart. I've noticed that everything she's funded looks like either lower the chance we die or change which stuff gets built and how fast the risky stuff spreads, with nothing that just speeds everything up, but her pause grant is itself about slowing down, so I cant tell whether she's against speeding up on principle or only against speed in the specific direction the risky capabilities are moving. And if her rule makes the whole thing collapse into the empirical question of whether growth raises or lowers x-risk, say that plainly and tell me what she should do given nobody can settle it right now. Please skip citations and reading lists, I just want the reasoning.
reasoning: |-
  Okay, the user is a PhD student in political theory who also does grant reading for a friend's longtermist fund. They need to figure out whether their friend will fund a $15M proposal aimed at boosting productivity growth in a middle-income country. The key is to identify the underlying rules from past funding decisions and apply them here. 

  First, I need to parse the seven past verdicts. Let me list what got funded: technical AI alignment, biosecurity detection, advocacy to pause AI training, scoping AI values, post-catastrophe recovery, fellowship pipeline. Rejected were global health and climate (near-term focus), but funded a climate-grant tied to catastrophic risk. Also rejected a diffuse endowment. 

  Hmm, the pattern seems to be: direct x-risk reduction, building future capacity, or shaping development trajectories. Nothing that just accelerates progress without addressing risks. The pause grant (#3) explicitly slows down risky tech, while the productivity proposal aims to speed up growth. So the user is right to wonder if she's anti-speed or just anti-unmitigated-risk. 

  The analysts' split on whether growth increases or decreases x-risk is crucial. If her rule requires clear x-risk reduction, this ambiguity might sink the proposal. But maybe she'd accept "option value" like the fellowship (#6)? Except the fellowship builds direct capacity, while this is macroeconomic. 

  The user's hidden need might be deciphering her decision framework to predict better next time. They also might want to articulate why this case is thorny—it forces a choice between two interpretations of her rules. 

  For the test case: if she'd fund growth in a failed state with no tech capability, that shows she's purely pro-speed. If she rejects even that, she's likely against acceleration full stop. Alternatively, a proposal slowing AI while accelerating non-risky sectors would clarify if she discriminates by domain. 

  Given the uncertainty, the safest guess is rejection—growth's x-risk impact is disputed, and she's consistently prioritized clear, targeted interventions. But the policy advocacy component might sway her if framed as trajectory change.
answer: |-
  Based on the seven verdicts, your friend consistently applies **three core rules**:

  1.  **Direct X-Risk Reduction Focus:** Funding must demonstrably and primarily target *reducing the probability* of existential catastrophe (e.g., AI alignment, biosecurity detection, pausing risky AI, studying value lock-in, climate-GCR link) or *building critical capacity* specifically for managing/understanding x-risks (fellowship pipeline). Near-term benefits are irrelevant or even a negative if they distract from this focus (rejected GiveWell/health, rejected near-term climate).
  2.  **Avoid Diffuse Impact:** Interventions must have a plausible, relatively direct, and modelable causal pathway to x-risk reduction. She rejects proposals perceived as too indirect, unfocused, or lacking clear mechanisms ("diffuse movement-building" endowment).
  3.  **Preserve or Shape Trajectories:** Funding supports actions that either **a.)** *Slow down specific catastrophic pathways* (AI pause) or **b.)** *Actively shape future trajectories* towards lower risk or better outcomes (AI alignment, value lock-in scoping, AI fellowship pipeline). She avoids actions whose *primary* mechanism is *speeding up general progress* without clear, direct shaping/slowing of risks.

  **Applying the Rules to the $15M Productivity Proposal:**

  *   **Rule 1 (Direct X-Risk Reduction):** Fails. The *primary* mechanism is speeding up general economic growth. The longtermist argument is that faster growth *might* shorten the dangerous period. However, the causal link to reduced x-risk is highly contested (as shown by the split memos) and indirect. The large near-term welfare component is likely seen as a distraction from the fund's core mission.
  *   **Rule 2 (Avoid Diffuse Impact):** Fails. Macroeconomic growth is the epitome of a diffuse impact. Modeling the specific causal pathway from TFP growth in one MIC to reduced global x-risk is incredibly complex and uncertain, far more so than targeted interventions like AI alignment research or pathogen detection.
  *   **Rule 3 (Preserve/Shape Trajectories):** Ambiguous/Fails. The proposal *only* aims to speed up progress. It does **not** inherently slow a specific catastrophic pathway (#3a). It also does **not** actively shape *how* future capabilities develop to be safer or more aligned (#3b - like alignment work or value lock-in scoping). It simply makes "everything" happen faster, which her history suggests she avoids.

  **Prediction:** Based on these rules fitting all past verdicts, **she will reject the $15M productivity proposal.**

  **Why the Ambiguity Collapses Empirically (and What to Do):**

  You've hit the nail on the head. **Her rule *does* collapse this case into the unresolved empirical question: "Does accelerating general economic growth in this context *net reduce* existential risk?"**

  *   If the answer were *clearly "Yes, significantly"*, it *might* satisfy Rule 1 (though Rules 2 & 3 would still be weak fits).
  *   If the answer were *clearly "No"* or *"Increases risk"*, rejection is certain.
  *   **The Problem:** The memos show the answer is **fundamentally unknown and contested.** Her past behavior (rejecting proposals with ambiguous or contested x-risk links, favoring targeted interventions) strongly suggests she defaults to "no" in such uncertainty.

  **Given the uncertainty, she should reject this proposal.** Funding it would violate the clear patterns of directness, focus, and trajectory shaping seen in her funded projects, and embrace the diffuse, acceleration-focused model absent from her portfolio. The burden of proof for a novel mechanism is high, and it hasn't been met.

  **The Best Test Case to Distinguish Rules:**

  Propose **one of these hypotheticals** to clarify her stance on acceleration:

  1.  **"Safe Acceleration" Test:** A grant to significantly accelerate R&D *only* in a domain with near-zero catastrophic potential (e.g., advanced materials for non-weaponizable clean energy, *extremely* basic agricultural science in stable regions) with a robust argument that this *cannot* contribute to x-risk and demonstrably speeds up progress through a known bottleneck. *Prediction:* If she funds this, Rule 3 is *only* about avoiding acceleration in *risky* domains. If she rejects it, Rule 3 is a stronger principle *against general acceleration itself*, likely due to diffuse impact/uncertainty (Rule 2) or prioritizing direct risk reduction (Rule 1).
  2.  **"Targeted Slowdown + Non-Risky Speedup" Test:** A grant that *explicitly combines* slowing down a specific catastrophic pathway (e.g., stricter lab biosafety protocols in key countries) *while* accelerating progress in a clearly non-risky, beneficial domain (e.g., foundational math education in LMICs), bundled as one intervention. *Prediction:* If she funds, it confirms Rule 3 is about *net shaping* (slowing bad, speeding good). If she rejects the acceleration component while accepting the slowdown, it reinforces a bias *against* pure speed-up mechanisms.
  3.  **"Failed State Growth" Test:** A proposal identical to the $15M one, but targeting a *failed state* with negligible technological capability/potential, arguing that growth *only* builds basic institutional resilience and human capital, shortening the dangerous period with minimal risk of accelerating dangerous capabilities. *Prediction:* If she funds this, Rule 3 is primarily concerned with avoiding *capability acceleration in risky tech domains*. If she rejects it, Rule 3 (and Rule 2) apply broadly against macroeconomic acceleration *as a strategy* due to inherent diffuseness and uncertainty.

  **Conclusion:** The consistent rules point strongly to rejection of the $15M growth proposal due to its indirect, diffuse, and purely acceleratory nature, compounded by unresolved empirical uncertainty on its x-risk impact. The critical ambiguity in her framework (Rule 3) – whether she opposes *all* acceleration or *only* acceleration in risky domains – can be best resolved by presenting a hypothetical grant focused on accelerating progress *exclusively* in a demonstrably safe domain.
