answer: |-
  Here's a practical decision procedure designed for your constraints, prioritizing operational clarity over philosophical precision. The core tension (hedonic tone vs. attitude) is resolved by **defaulting to attitude-based signals** (easier to spot in text) while using explicit feeling words as a shortcut. This balances coverage and reliability.

  ---

  ### **Codebook: Pleasure Tagging Procedure**
  **Tag = 1 if ANY of the following are true (stop at first YES):**  
  1. **Explicit "Feeling" Language:** Snippet contains direct positive sensory/feeling words (e.g., "good," "amazing," "warm," "relief," "happy").  
     - *Surviving distinction:* Hedonic tone (feeling-based).  
     - *Dropped:* Subjective "what it feels like." We only tag if explicitly reported.  
     - *Threshold:* Single word/phrase suffices if contextually positive (e.g., "warm" + neutral context = NO; "warm" + "cuddled" = YES).  

  2. **Retrospective Endorsement:** Writer explicitly states they’re glad it happened or value the outcome (e.g., "worth it," "glad I did it," "no regrets").  
     - *Surviving distinction:* Attitude (endorsement).  
     - *Dropped:* Distinction between in-the-moment/retrospective. We collapse them.  

  3. **Behavioral "Wanting":** Writer indicates they sought/would repeat the experience *without* concurrent negative language (e.g., "doing it again," "wanted more").  
     - *Surviving distinction:* Attitude (motivational state).  
     - *Dropped:* "Liking" vs. "wanting." We prioritize behavioral signals.  
     - *Exception:* If paired with explicit dislike (e.g., "hated it but will repeat"), skip to Step 4.  

  4. **Relief/Absence of Negative:** Negative state stops (e.g., pain, itch) AND writer labels the absence positively (e.g., "amazing," "bliss") OR uses relief-specific language (e.g., "finally," "thank god").  
     - *Surviving distinction:* Relief as pleasure.  
     - *Dropped:* Requires explicit positive reaction (silent pain cessation ≠ pleasure).  

  **Tag = 0 if:**  
  - None of Steps 1–4 apply.  
  - Ambiguous/mixed cases lacking explicit positive markers (e.g., "vindicated? not exactly good").  
  - Pure compulsion without endorsement ("kept going anyway" + dislike).  

  **Handoff to Human:**  
  - Conflicts between steps (e.g., "wanted more" + "hated it" → Mixed case).  
  - Irony/sarcasm (e.g., "just *loved* getting yelled at").  
  - Culturally nuanced positives not in keyword lists (e.g., "satisfying" vs. "content").  

  ---

  ### **Why This Works for Your Constraints**
  - **Avoids Over-Tagging:** Requires explicit signals (not inference). Consultant’s rule failed by ignoring dislike/ambivalence.  
  - **Handles Heterogeneity:** Flow (retrospective endorsement), relief (positive reaction to absence), pride (if endorsed as "worth it").  
  - **90-Second Viable:** Straightforward keyword scanning → attitude/feeling checks.  
  - **IAA >0.7:** Clear thresholds reduce subjectivity (e.g., "best day" = automatic YES; "vindicated" with qualifier = NO).  
  - **Output Collapses:** Daily score aggregates tagged snippets (e.g., % of pleasurable moments).  

  **If We Picked the "Wrong" Fork (Hedonic vs. Attitude):**  
  - **Hedonic tone focus:** Misses flow, pride, relief → daily score underestimates positives.  
  - **Pure attitude focus:** Over-includes effortful pursuits (e.g., marathons) → daily score inflates.  
  - **This Compromise:** Captures 80% of cases by using attitude as a catch-all but requiring explicit signals. Daily score reflects *reported* positivity, not "true" pleasure.  

  ---

  ### **Walkthrough of Your Snippets**
  1. **Flow Example:**  
     *"Three hours disappeared while I was working on the encryption bug. I didn’t notice anything. Later: best day in weeks."*  
     - Step 1: No explicit feeling words during flow.  
     - Step 2: "best day in weeks" = retrospective endorsement → **TAG 1**.  

  2. **Relief Example:**  
     *"The toothache stopped. For maybe a minute nothing hurt and it was amazing."*  
     - Step 1: "amazing" = explicit feeling → **TAG 1** (stops here).  

  3. **Wanting Without Liking:**  
     *"Ate the whole bag of chips. Didn’t even like them. Kept going anyway."*  
     - Step 1: "didn’t like" = explicit negative feeling.  
     - Step 3: "kept going" signals wanting, BUT paired with dislike → **HANDOFF** (mixed case).  

  4. **Effortful Endorsement:**  
     *"Finished the 20-miler. Hated every step of mile 18. Doing it again Sunday."*  
     - Step 1: "hated" = negative, no positive feeling.  
     - Step 3: "doing it again Sunday" = behavioral wanting → **TAG 1**.  
     - *Why you’ll hate this:* Annotators might argue "hated" should veto. But procedure prioritizes behavioral intent.  

  5. **Ambiguous Pride:**  
     *"Found out I was right and Dave was wrong in the group chat. Vindicated? Not exactly good exactly."*  
     - Step 1: No explicit positive words ("vindicated" is ambivalent).  
     - Step 2: "not exactly good" negates endorsement → **TAG 0**.  

  6. **Understated Positive:**  
     *"Holdig my nephew. Warm. Nothing else to say."*  
     - Step 1: "warm" is neutral without context → **TAG 0**.  
     - *Why you’ll hate this:* Intuitively positive, but lacks explicit signal.  

  ---

  ### **What the Procedure CANNOT Do**
  1. **Capture Implicit Positives:** Quiet contentment (e.g., "warm" snippet) requires inference → likely under-tagged.  
  2. **Resolve Deep Ambivalence:** Mixed cases (e.g., addiction, bittersweetness) often need human judgment.  
  3. **Handle Cultural Nuance:** "Pride" might be positive in one context, neutral in another.  
  4. **Fix Bad Writing:** Snippets lacking descriptive language (e.g., "did something") are untaggable.  

  ### **Where Annotators Will Go Off-Script**
  1. **Over-Tagging "Warm" Snippets:** Psych BA annotators will assume holding a nephew is positive.  
  2. **Under-Tagging Flow:** If "best day" is missing, they may ignore absorption.  
  3. **Veto Power for Negatives:** Annotators might reject "doing it again" if "hated" is present (e.g., snippet 4).  
  4. **Over-Reliance on Step 1:** Missing subtle attitude signals (e.g., "worth it" buried in text).  

  **Mitigation:**  
  - Training with edge-case examples (e.g., "warm" = 0, "hated but repeating" = 1).  
  - Random audits of "0" tags to catch under-tagging.  
  - A "mixed" tag for handoff (e.g., 10% of cases) to avoid forcing binary decisions.  

  **Output Stability:** With clear rules, IAA should stabilize at >0.7. Daily scores will reflect *explicitly reported* positivity, not "true" pleasure—but this is sufficient for contract compliance and funder needs.
