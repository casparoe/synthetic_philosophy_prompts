prompt: |-
  I have been working through the diachronic money-pump argument and I think it generalizes into a conclusion nobody should want. I would like you to find where it breaks.

  Set-up. Let H be the proposition that the referendum passes. At t1 Nadia's credence in H is 0.5, and that is exactly what her evidence supports. She also knows the following reliably: at t2 tomorrow she will be given a drug as part of a trial she cannot leave; the drug is administered under a fixed protocol that is independent of H; and it reliably induces in subjects a credence of 0.9 in H together with the conviction that this new credence is well grounded and that their earlier hesitation was mere confusion. She knows all of this now, and she knows that at t2 she will not act on anything she now decides: any note she leaves, she knows, her later self will dismiss as the product of her pre-drug confusion. Assume the bookie knows everything Nadia knows.

  (1) The exploitability criterion: a body of attitudes is irrational if there is a possible sequence of trades, each individually acceptable to the agent at the price offered at the time it is offered, whose net effect is a sure loss to her. This is the whole force of the money-pump argument; without it, the coherence norms — transitivity, the probability axioms, and the diachronic constraint that your planned later credence in H should equal your current credence in H conditional on having that later credence, the principle usually called Reflection — are brute stipulations.

  (2) The construction. At t1 the bookie buys from Nadia a ticket paying $1 if H, for $0.51. Given credence 0.5, the ticket is worth $0.50 to her, so she accepts. At t2, after the drug, the bookie sells her a ticket paying $1 if H, for $0.89. Given her new credence of 0.9, the ticket is worth $0.90 to her, so she accepts. Her holdings cancel in every state of the world; her cash position is −$0.38 for sure. Raise the stakes and the loss is unbounded. I have written the bets unconditionally because the event that her t2 credence is 0.9 is certain for her; the version with bets conditional on that event, called off if it fails, is the same argument in general form.

  (3) The construction needs nothing beyond the gap between her current credence in H and the credence the drug will give her: it needs a violation of Reflection. Nadia violates it maximally, since cr_t1(H | cr_t2(H) = 0.9) = 0.5.

  (4) Foresight does not rescue her. She can see the whole sequence at t1. But refusing at t1 means declining a trade that is favorable by her own current lights, and the money-pump argument cannot permit that escape: if declining a locally favorable trade is allowed, then an agent with cyclic preferences is immune to every pump by the same move, and the argument for transitivity collapses. And at t2 she cannot refuse, since the trade is favorable by the only lights she then has.

  (5) Generalization. The same construction works for any agent who knows in advance how her attitudes will move for reasons she now regards as irrelevant: hypnosis, a stroke, targeted advertising, a decade of ordinary ageing, or a drug. Each such agent is, at t1, exploitable, and so by (1) irrational at t1.

  (6) The only way for such an agent to be non-exploitable is to have already, at t1, the attitudes she knows she will later be made to have: 0.9, in Nadia's case. Nothing in the construction cares whether the induced attitude is an improvement or a deterioration. The requirement is conformity to whatever comes.

  (7) So the argument makes irrationality a function of what will happen to a person rather than of how she thinks, and it directs her to bring her current attitudes into line with a process she correctly regards as distorting. I take that as a reductio.

  (8) A further wrinkle. If Nadia foresees the pump and would pay up to $0.38 to be spared it, the bookie can extract nearly that amount merely by turning up with the offer. An agent who is perfectly coherent but merely mistaken about whether she will be manipulated is then exploitable too, and her exploitability is a function of her empirical beliefs about her own future.

  Here is what I want to keep: (1) in some restricted form, since I know no other non-stipulative argument for the coherence norms; and the claim that rationality is a property of attitudes and reasoning rather than of causal situation. What I cannot accept is (5) and (6).

  One contrast I also cannot let go of. If Nadia were going to take the drug voluntarily, because tomorrow she will want to and she now thinks wanting to is a bad reason, I have no hesitation saying that something is defective in her plan, and I would want the diachronic argument to reach it. Whatever you propose has to separate that case from the coerced one.

  So: which step do you reject? If you restrict (1), state the restriction exactly — that the exploiter must not cause the later attitude change, that the later attitudes must be ones the agent would now endorse, that the trades must be acceptable given her foresight rather than merely locally, or something else — and say whether the restriction is principled or ad hoc. If instead you reject (4) and let foresight in, tell me what the money-pump argument is still worth, and what it costs a cyclically preferring or non-conditionalizing agent to become sophisticated. Then price the alternatives: what each rejection commits me to, and which is cheapest.
reasoning: |-
  We are presented with a diachronic money-pump argument that seems to lead to the conclusion that an agent must conform to a future credence even when that future credence is known to be induced by a distorting process (like a drug). The argument generalizes to any situation where an agent knows in advance that her attitudes will change for reasons she currently regards as irrelevant. The user finds this conclusion unacceptable and wants to know where the argument breaks down.

  The user also wants to keep the core idea that rationality is a property of attitudes and reasoning, and not of causal situation. They also want to preserve the exploitability criterion (1) in some form, but without the unpalatable consequences.

  Key steps in the argument:

  (1) The exploitability criterion: irrational if there's a sequence of trades acceptable at each time leading to sure loss.

  (2) The construction: at t1, bookie sells a bet that H at $0.51 (Nadia's t1 credence is 0.5, so she values the bet at $0.50 and accepts). At t2, after the drug, bookie buys back a bet that H at $0.89 (Nadia's t2 credence is 0.9, so she values the bet at $0.90 and accepts). Net loss of $0.38.

  (3) The key violation is of Reflection: cr_t1(H | cr_t2(H)=0.9) = 0.5, not 0.9.

  (4) Foresight doesn't help because at t1 she must accept the trade that is favorable by her current lights, and at t2 she must accept by her then lights.

  (5) Generalization: any agent who knows her attitudes will change for reasons she now regards as irrelevant is exploitable and hence irrational.

  (6) The only escape is to have the future credence now.

  (7) This is a reductio because it makes rationality depend on what will happen and requires conforming to a distorting process.

  (8) Even if she foresees the pump, she might pay to avoid it, and then the bookie can exploit that.

  The user wants to reject (5) and (6). They also want a distinction between voluntary change (which they think should be criticizable) and coerced change (which should not).

  Possible responses:

  A. Restrict the exploitability criterion (1) so that it does not apply in cases of externally induced attitude change.

  B. Allow foresight to block the initial trade (reject step (4)).

  C. Reject the applicability of the money-pump in this case because the later state is not one that the agent endorses at t1.

  D. Argue that the agent is not required to satisfy Reflection in this case because the future credence is not based on evidence that she now regards as relevant.

  Let me consider each.

  Option A: Restrict the exploitability criterion.

  We could say that the exploiter must not cause the later attitude change. In this case, the bookie is not causing the change (the drug is), so maybe the criterion doesn't apply? But note the bookie is taking advantage of a change that will happen anyway. The user might worry that this restriction is ad hoc.

  Alternatively, we might require that the later attitudes are ones the agent would now endorse. In the voluntary case (where she plans to take the drug because she will want to) she does not now endorse the future attitude, but in the coerced case she also does not. So that might not help.

  Option B: Allow foresight to block the initial trade.

  The user notes that if we allow declining a locally favorable trade due to foresight, then cyclic preference agents can do the same and avoid being pumped. This would undermine the argument for transitivity.

  However, there is a known solution for cyclic agents: sophistication. A sophisticated agent, who foresees that she will make choices in the future that she now disprefers, can take steps to avoid the path that leads to loss. For example, in a money-pump for cyclic preferences, the agent might precommit or refuse the first trade because she knows it will lead to a cycle. This is often taken as a way to avoid the pump without requiring transitivity.

  But note: in the cyclic case, the agent's future choices are under her control and she can plan to avoid the cycle. In Nadia's case, the future credence is fixed by the drug and she cannot change it. Moreover, at t2 she will accept the trade because it is favorable by her then lights. So if at t1 she refuses the first trade, she avoids the loss. But is that allowed?

  The user says: if we allow refusing a locally favorable trade, then cyclic agents become immune. But in the cyclic case, the argument for transitivity is that without it, the agent is vulnerable to exploitation. If the agent is sophisticated and refuses the first trade, then she avoids exploitation. So the money-pump argument for transitivity only works against myopic agents, not sophisticated ones. This is a known limitation.

  Therefore, we can say that the money-pump argument for transitivity (and other norms) only applies to agents who are not sophisticated. For diachronic coherence, we might require that agents are sophisticated.

  In Nadia's case, if she is sophisticated and foresees that she will accept the t2 trade, then at t1 she can see that accepting the first trade leads to a sure loss. Therefore, she should refuse the first trade. This refusal is rational even though the trade is favorable by her current credence? Why? Because her current credence is not the whole story: she also has beliefs about her future behavior.

  But note: by her current credence, the bet at t1 is favorable. However, if she accepts it, she will end up with a sure loss. Therefore, her current overall evaluation of the transaction (if she can see the whole sequence) is negative.

  We can model her as evaluating the entire plan. At t1, she can choose to accept the first bet or not. If she accepts, then she will (for sure) accept the second bet and end up with a loss of $0.38. If she declines, she ends up with $0. If she is rational, she will decline.

  This does not require her to change her credence to 0.9 at t1. She can keep 0.5 and refuse the first bet because she knows that taking it will lead to a loss.

  But why is this refusal rational? Because she is avoiding a sure loss. The exploitability criterion (1) is about sequences of trades that lead to a sure loss. But if she refuses the first trade, she avoids the sequence. So she is not exploited.

  The same move is available for cyclic preferences: if the agent foresees the cycle, she can refuse the first trade. So the money-pump argument does not force transitivity on sophisticated agents. However, many philosophers and decision theorists still hold that transitivity is a requirement of rationality, and that sophistication is a way to avoid exploitation but does not make cyclic preferences rational.

  But in the credence case, we are not dealing with preferences but with beliefs. The issue is whether Nadia's credences are irrational because they violate Reflection.

  With sophistication, we avoid the money-pump. So the argument does not show that Nadia is irrational at t1 for having credence 0.5 while knowing she will have 0.9. She can avoid the pump by refusing the first bet.

  But what about step (4)? The user says: if we allow refusing a locally favorable trade, then cyclic agents become immune. That's true, but perhaps that is the cost of having cyclic preferences: you must be sophisticated to avoid exploitation, but that doesn't make cyclic preferences rational. We might still want to say that cyclic preferences are irrational, but the money-pump argument alone does not force the sophisticated cyclic agent to change; it only shows that if she is myopic, she is exploitable.

  Similarly, for Nadia, if she is myopic (only considers one trade at a time), she is exploitable. But if she is sophisticated, she is not. So we can say that rationality requires either satisfying Reflection or being sophisticated enough to avoid the pump.

  However, note that in the cyclic case, sophistication does not remove the internal conflict in the preferences. Similarly, for Nadia, there is a conflict between her current and future credences.

  But the user wants to keep the idea that rationality is about attitudes, and they think that in the voluntary case (where she plans to take the drug) there is a defect, but not in the coerced case.

  So let's use that distinction.

  Proposal: The money-pump argument for Reflection does not apply when the future credence change is caused by a process that the agent currently regards as distorting and that she cannot prevent. In such a case, she is not required to satisfy Reflection. Instead, she can (and should) use her foresight to avoid the first trade.

  In the voluntary case, however, if she plans to take the drug (and hence change her credence) even though she now thinks that doing so is irrational, then she is criticizable for having an inconsistent plan. In that case, she should either not plan to take the drug or change her current credence.

  So we can restrict the Reflection principle to cases where the future credence is based on evidence that the agent currently expects to be relevant. The original Reflection principle (van Fraassen) requires that your current credence conditional on having a future credence c should be c. But it is often restricted to cases where you expect your future credence to be based on more information.

  In this case, the drug does not provide new information about H, so it is not a case where Reflection applies.

  Standardly, Reflection is defended for cases where the future credence is based on new evidence. Here, the drug is a distorting factor, not evidence.

  So step (3) is wrong: the violation of Reflection is not irrational in this case because the condition for applying Reflection is not met.

  What is the condition? One common restriction is that you must regard your future self as rational and as having at least as much evidence as you now have. In this scenario, at t1, Nadia does not regard her future self as rational (because she knows the credence is drug-induced) and the future self does not have more evidence about H. So Reflection does not apply.

  Therefore, the money-pump does not show that she is irrational at t1; it only shows that if she is myopic (or fails to be sophisticated) she will be exploited. But since she can avoid the exploitation by being sophisticated, and she is not required to satisfy Reflection in this case, there is no problem.

  Now, the bookie might still try to exploit her by offering the first bet. But if she is sophisticated, she refuses. And that refusal is rational.

  What about step (8)? If she foresees the pump and would pay to avoid it, then the bookie can extract that money by threatening to pump her. But note: the bookie has to actually offer the first bet to threaten. If the bookie approaches her and says: "I will pump you unless you pay me $0.37", then she might pay. But that is a different scenario. In the original construction, the bookie just offers the bets without an explicit threat.

  In the original, if she is sophisticated, she refuses the first bet. So the bookie doesn't get to make the second bet. So she doesn't pay anything.

  But if the bookie first demands a payment to not offer the bets, then we have a new situation. However, at t1, she can simply refuse to pay and also refuse the first bet if offered. So again, she avoids loss.

  Therefore, the sophisticated agent is not exploited.

  Now, what about the cyclic agent? If we allow sophistication to block the money-pump, then cyclic preferences are not exploitable by a sophisticated agent. But that is a known result. However, many still argue that cyclic preferences are irrational for other reasons (they lead to inconsistent choices in other contexts, or they are inherently inconsistent). Similarly, we might say that violating Reflection in the voluntary case is irrational even if the agent avoids exploitation by being sophisticated.

  But in the coerced case, we don't want to say that the agent is irrational at t1 for having a credence that differs from the one she will be forced to have.

  So the answer is: we reject step (4) in the sense that we allow the agent to use foresight to refuse the first trade. This does not undermine the entire money-pump argument because:

  - For cyclic preferences, we can still argue that they are irrational because they lead to inconsistent choices in other scenarios (like when the agent must choose between all three options at once) or because they violate axioms that are independently plausible.

  - For the Reflection principle, we can restrict it to cases where the future credence is based on new evidence, and then the money-pump argument (with the assumption of myopia) can support that restricted principle.

  Moreover, in the voluntary case (where she plans to take the drug), she is violating the restricted Reflection principle because she expects her future credence to be based on no new evidence and she does not endorse it. So she is irrational at t1 for having a credence that is not 0.9? Or she is irrational for planning to take the drug? Either way, there is a defect.

  In the voluntary case, if she plans to take the drug, then she expects that after taking it her credence will be 0.9. If she now thinks that taking the drug is a bad reason (so she does not endorse the future credence) then she should not take the drug. If she does, she is acting against her current judgment. Alternatively, if she takes the drug, then she must have changed her mind about the drug being a bad reason, but that change might be irrational.

  But in the coerced case, she has no choice about taking the drug, so she is not criticizable.

  Therefore, the solution is to restrict the Reflection principle to cases where the agent expects to update on new evidence. Then, in Nadia's case, she is not required to have cr_t1(H) = 0.9. And she can avoid the money-pump by being sophisticated: refusing the first bet.

  This restriction is principled because the Reflection principle is only intended for rational updating. The drug-induced change is not rational updating.

  Moreover, this restriction saves the intuition that rationality is about reasoning and attitudes, not about causal processes.

  So to summarize:

  - We reject step (4) for this case: Nadia can and should refuse the first bet because she foresees that accepting it will lead to a sure loss. This refusal is rational.

  - We restrict the exploitability criterion: a sequence of trades that leads to sure loss is only irrational if the agent would accept each trade when offered and cannot avoid the sequence by foresight. But if the agent can avoid by foresight, then she is not irrational for having the attitudes, though she might be irrational if she fails to use foresight (but that is a different matter).

  - We restrict the Reflection principle to cases where the future credence is based on new evidence and the agent regards her future self as rational.

  This allows us to:

  - Keep the money-pump argument for the restricted Reflection principle (in contexts of rational updating).

  - Explain why the coerced case is different: because the change is not rational updating, Reflection does not apply.

  - Allow the voluntary case to be criticizable: if she voluntarily takes the drug without new evidence, then she is violating the restricted Reflection principle (because she expects to have a credence that she now does not endorse) and she might be exploitable if she is not sophisticated.

  But note: in the voluntary case, if she is sophisticated, she might avoid the pump by refusing the first bet. However, she is still criticizable for planning to take the drug because it will lead to an irrational credence. So the defect is not in the credence at t1, but in her plan.

  Alternatively, if she does not plan to take the drug, then there is no issue.

  Therefore, the key step we reject is the application of the Reflection principle to this case. The money-pump does not show that Nadia is irrational at t1 for having credence 0.5 because the future credence is not one that she expects to be based on evidence. Moreover, she can avoid exploitation by being sophisticated.

  This approach does not require us to give up the exploitability criterion entirely; we just note that sophisticated agents can avoid exploitation even without satisfying the coherence norm in question. But we can still hold that the norm is a requirement of rationality for other reasons.

  However, the user wants a non-stipulative argument. The money-pump argument is one such argument, but it has limitations. We can still use it for the restricted case.

