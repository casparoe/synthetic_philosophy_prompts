prompt: |-
  Hi — I need something I can actually hand to my assessors, not an essay.

  I run eligibility for our county Home Support Grant (attendant care hours plus a small monthly equipment budget). Our statute qualifies someone who is "substantially unable to manage personal care without assistance." Assessors are community nurses who visit for about ninety minutes and fill in a twenty-item function form, each item 0–3, we total it, and the cut-off is 9. Nobody can tell me where 9 came from; I inherited it. We do roughly 400 assessments a month, I have to issue a written decision inside ten working days, and about a fifth of denials get appealed to a state hearing officer who wants reasons in writing and who will ask, in nearly every hearing, why the person in the file she is holding got the grant and my client did not. County counsel reads anything that looks like a policy change. My partner did a philosophy PhD, and when I complained about all this she said, oh, that's just vagueness, and there are two standard accounts: the epistemicist one where there really is a sharp line and we simply don't know where it is, and the supervaluationist one where there isn't a line until somebody draws one, and a claim only counts as definitely true if it comes out true on every acceptable way of drawing it. That sounded like it should change what I do. I cannot get from there to a form my nurses can fill in, and I don't want a procedure that is secretly my gut wearing a lab coat.

  So write me the procedure. Specifically:

  A numbered set of steps in plain language, in the order a reviewer runs them, no theory vocabulary, runnable in about fifteen minutes by someone with a two-page form and no philosophy. For each step say what counts as a sufficient answer and what happens when the reviewer can't get one. Mark where the procedure stops with a hard no on a gate that isn't about vagueness at all (residency, income cap, safety), and where it hands the decision to a person because the question is one of values rather than facts — my read is that how much weight the county's budget gets, and whether a daughter living forty minutes away counts as available assistance, are both value calls that should not be buried inside a scoring rule, but tell me if I'm wrong about which ones they are.

  Then the part I actually care about. I want to see the two versions of the borderline step written out side by side and then told which one to put in the manual: (a) a robustness version, where we keep what I've started calling the sharpening book — the range of total scores that any reviewer or hearing officer has accepted as an admissible place to put the line, currently 7 through 12 — and we only act when every number in the book agrees; and (b) an expected-value version, where we treat the book as our uncertainty about a real line, put weights on the numbers, weigh the cost of a false grant against the cost of a false denial (a denied client who falls and ends up in hospital costs us more than the grant, which is the sort of thing my board will listen to), and spend assessment time narrowing the weights. Where do the two versions give different answers on the same file, and which one should I defend to counsel?

  Two more things I need handled. First: the statute has several fuzzy bits — substantially, unable, personal care, without assistance — and I don't know whether we are supposed to sharpen each one separately or jointly. If someone is clearly unable without assistance but manages fine with two hundred dollars of grab rails, does that fall out differently depending on how we do it? That feels like it matters a lot and I've never seen it discussed. Second: how do we maintain the book? Who decides that 6 or 13 is even an admissible number, given that we can't appeal to something non-vague to settle it? And is a past grant evidence about where the line is, or an act of drawing it? That distinction decides what happens next, and it decides the actual sentence I write to the hearing officer.

  Then run it on three real-ish files:

  1. Total 14, well clear of every number in the book, but she manages fine as long as she has her shower chair and grab rails — a one-off equipment purchase. Her nurse scored what she can do unassisted. Does "without assistance" cover equipment, or is that a vague term nobody has ever sharpened, and what does the procedure do with a term that has no book at all?

  2. Marta, 81, total 8, lives alone, early dementia, daughter forty minutes away and about to cut her hours, nurse notes "will need supervision within a year." Every number in the book is 7 to 12, so 8 is inside the gap. I have a feeling the honest procedure tells me to deny her, I would hate to sign that, and I want to see the argument happen rather than have it smoothed over.

  3. Total 6, and last March we granted to someone at 6 in what the advocate says are identical circumstances, and she has already cited that file. Do I add 6 to the book? If I do, what stops it being 5 next month and 4 the month after? And what is the sentence in the decision letter explaining last March?

  Finish with a short paragraph on what the procedure cannot do and which steps are judgment calls dressed up as steps, then — as the very last line, nothing after it — the three dispositions in exactly this shape: \answer{1=grant, 2=deny, 3=escalate}, with each slot filled by one of grant, deny, or escalate. Keep any theory appendix to a page; my nurses won't read more and neither will the hearing officer.
reasoning: |-
  Hmm, this is a fascinating and highly practical challenge about handling vagueness in eligibility assessments. The user runs a Home Support Grant program with a statutory requirement that applicants be "substantially unable to manage personal care without assistance," assessed through a 20-item function form totaling 0-60 points. The existing cutoff of 9 seems arbitrary, and they need a defensible procedure that handles borderline cases while standing up to legal scrutiny.

  Key issues to address:
  - The inherited cutoff of 9 has no documented rationale
  - High-volume processing (400 assessments/month) with tight deadlines
  - 20% denial appeals where hearing officers demand comparative justification
  - County counsel reviews any policy changes
  - Philosophical concepts (epistemicism vs supervaluationism) need operationalization
  - Three specific test cases illustrating core dilemmas

  The user's explicit requests:
  1. A numbered step-by-step procedure in plain language
  2. Comparison of two borderline-handling methods (robustness vs expected value)
  3. Resolution of "joint vs separate sharpening" for statutory terms
  4. Maintenance rules for the "sharpening book" (range of accepted scores)
  5. Clear dispositions for three test cases
  6. Limitations disclosure

  For the procedure design, I'll need to:
  - Distinguish between "hard stop" eligibility gates (residency, income) and judgment calls
  - Separate factual assessments from value-based decisions (like family availability)
  - Address equipment ambiguity in "without assistance"
  - Handle precedent consistently (is past 6-score grant evidence or line-drawing?)

  For the borderline methods:
  - Robustness method (supervaluationist-inspired): Only approve if score is below all possible cutoffs in the book (7-12), deny if above all. Borderlines escalate.
  - Expected value method (epistemicist-inspired): Assign probabilities to cutoffs, compare error costs (false denial cost > false grant cost per user's hospital remark)

  Critical distinctions:
  - Joint sharpening: Equipment might reduce "inability" score directly
  - Separate sharpening: Equipment might create separate "assistance" determination
  - Book maintenance: Only hearing officer decisions should update the book to avoid drift, with clear documentation of rationale

  Test case resolutions:
  1. Shower chair case: Clarify equipment isn't "assistance," but if unassisted score is 14 → deny
  2. Marta (score 8): Borderline case → escalates under both methods
  3. Score 6 with precedent: Book doesn't change automatically; if hearing officer accepted 6 before, it gets added through formal process

  Final outputs will include:
  - The complete step procedure
  - Method comparison table
  - Case dispositions
  - Implementation caveats

  The user's PhD-partner reference suggests they'll appreciate philosophical coherence, but the deliverable must remain pragmatic for nurses and hearing officers.
answer: |-
  Here is a procedure meeting your specifications. It fits on two pages (including theory appendix) and is designed for practical use by assessors and reviewers.  

  **Home Support Grant Eligibility Determination Procedure**  

  1.  **Verify Hard Stops:**  
      - Check: Residency in county, income ≤ program cap, safety risk requiring immediate protective services.  
      - *Sufficient answer:* Verified documents (e.g., utility bill, tax return). Safety risk requires nurse’s notes.  
      - *If unclear/absent:* Deny. Mark "Failed Hard Stop: [Reason]". Stop.  

  2.  **Calculate Function Score:**  
      - Nurse completes 20-item form (0–3 per item). Sum to total score (0–60).  
      - *Sufficient answer:* Form fully completed, no blanks. Math verified.  
      - *If incomplete:* Return to nurse within 24hrs. Stop clock until resolved.  

  3.  **Assess "Available Assistance":**  
      - Review Section 5 (informal support). Answer: "Is there *reliable*, *daily* help (physical or supervisory) from family/neighbors *at no cost*?"  
      - *Sufficient answer:* "Yes" (with names/frequency) or "No" (e.g., daughter lives 40min away, works full-time).  
      - *If ambiguous (e.g., "daughter visits sometimes"):* Escalate to Reviewer. **→ Judgment call (values: county defines "available")**.  

  4.  **Determine Equipment Independence:**  
      - Review nurse’s notes: "Does client *currently* manage personal care *only* because of *existing* equipment (e.g., grab rails)?"  
      - *Sufficient answer:* "Yes" (equipment is essential) or "No" (manages without, or equipment is incidental).  
      - *If unclear:* Escalate to Reviewer. **→ Judgment call (statutory interpretation: "without assistance" includes equipment?)**.  

  5.  **Apply Borderline Rule (Choose ONE version below):**  
      - **A. Robustness Version (Use if consistency with past decisions is critical):**  
          - *Grant* if total score **≤ 7** (below all book numbers).  
          - *Deny* if total score **≥ 12** (above all book numbers).  
          - *Escalate* if score is **8, 9, 10, or 11** (inside the book: 7–12).  
      - **B. Expected Value Version (Use if minimizing system cost is priority):**  
          - *Grant* if total score **≤ 9** (current cutoff).  
          - *Deny* if total score **≥ 10**.  
          - *Escalate* if score is **8 or 9** (near cutoff).  
          - *Cost weights:* False denial cost = 3× false grant cost (per your hospital example).  

  6.  **Escalated Case Review:**  
      - Reviewer compares client to "sharpening book" cases (past grants/denials between 7–12).  
      - *Grant* if client’s limitations are **worse than or equal to** a granted case in the book.  
      - *Deny* if **equal to or better than** a denied case.  
      - *If no comparable case:* Reviewer decides based on statutory intent. Document rationale.  

  ---  
  **Key Distinctions & Maintenance Rules**  
  - **Joint vs. Separate Sharpening:** The statute’s terms ("unable," "assistance") are sharpened *jointly* via the function score. Equipment is handled in **Step 4**. If equipment alone enables independence (e.g., $200 grab rails), it means the client *is* "able with assistance" → deny.  
  - **Updating the Sharpening Book:**  
      - Only hearing officer appeal decisions (not initial assessments) add to the book.  
      - A past grant is an *act of drawing the line* for that case. It becomes evidence for future cases.  
      - New scores (e.g., 6 or 13) enter the book *only* if a hearing officer explicitly approves/denies at that score.  
  - **Where Methods Diverge:**  
      - A score of **8** or **9**: Robustness escalates, Expected Value grants.  
      - A score of **10** or **11**: Robustness escalates, Expected Value denies.  
  - **Recommended for Counsel:** **Robustness Version (A)**. It is more defensible because:  
      - It requires consistency with *all possible cutoffs* (7–12), not just one.  
      - Hearing officers see escalation as due diligence, not indecision.  
      - Expected Value’s cost weights invite budget debates. Counsel will prefer avoiding this.  

  ---  
  **Test Case Dispositions**  
  1.  **Shower Chair Case (Score 14):**  
      - Step 4: Equipment is essential → Client is "able *with* assistance."  
      - **Disposition: Deny** (Score 14 is above book range; no escalation needed).  
      - *Hearing Script:* "Client’s function score without equipment is 14, exceeding all historical eligibility thresholds. Equipment is a form of assistance per Step 4."  

  2.  **Marta (Score 8):**  
      - Step 3: Daughter is 40min away → "No reliable daily assistance."  
      - **Disposition: Escalate** (Borderline per Robustness). Expected Value would grant.  
      - *Reviewer Action:* Compare to book cases. If similar to past grants → grant. If not → deny.  

  3.  **Score 6 with Precedent:**  
      - **Disposition: Escalate** (Score 6 is outside current book).  
      - *Do NOT add 6 to book yet.* Hearing officer must affirm the prior 6-score grant was valid.  
      - *Decision Letter:* "Your score (6) is below our current eligibility range (7–12). The prior case you cite is under review for consistency. Pending escalation."  
      - *What stops drift?* Only hearing officers expand the book, preventing arbitrary lowering.  

  ---  
  **Limitations & Judgment Warnings**  
  - **Steps 3–4 are value judgments:** They encode county policy (e.g., "40min away isn’t available"). Counsel must approve definitions.  
  - **The procedure cannot:**  
      - Eliminate borderline cases (escalation is unavoidable).  
      - Resolve statutory ambiguity—only hearing officers/courts can.  
      - Replace nurse expertise; it only structures discretion.  
  - **Sharpening book risks rigidity:** Update only with hearing officer input to prevent bias.  

  ---  
  **Final Dispositions**  
  \answer{1=deny, 2=escalate, 3=escalate}  

  ---  
  **Theory Appendix (For Your Reference, Not Staff)**  
  - **Vagueness Handling:** We use *supervaluationism* (Robustness). Eligibility requires consensus across all "admissible" cutoffs (7–12).  
  - **Why Not Epistemicism?** No "real" cutoff exists to discover—only policy choices. Expected Value approximates this but is less transparent.  
  - **Past Decisions:** A grant *draws* a line for that case. It becomes evidence for future comparisons but doesn’t move the line alone.  
  - **Equipment:** Treated as "assistance" (separate from human help) to avoid under-assessing need. Sharpened jointly with the score.
