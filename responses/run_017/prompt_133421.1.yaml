answer: |-
  ## Model-Governance Board Decision Memo: Allocation Policy for Subsidized Job-Training Slots

  **To:** County Workforce Agency Leadership  
  **From:** Model-Governance Board  
  **Date:** October 26, 2023  
  **Subject:** Recommended Policy for Allocation of Job-Training Slots & Response to Community Concerns  

  **1. Recommendation:**  
  The Model-Governance Board recommends **Proposal (iii): Purchase and implement the vendor's distribution-matched variant scoring system**, subject to the following critical conditions and timeline:  

  *   **Condition 1 (Legal Compliance):** Agency legal counsel must confirm, in writing within 30 days, that publishing the transformed "score" (while clearly labeled and explained as an allocation priority indicator, *not* a retention probability) satisfies the ordinance requiring publication of "scores." This should emphasize the score's purpose (fair allocation) and provide accessible explanations for applicants and caseworkers.  
  *   **Condition 2 (Transparency & Communication):** Develop and implement a robust communication plan (within 60 days of legal approval) for applicants and caseworkers, explaining:  
      *   Why the scoring system changed (pursuit of fairness across varying funding levels).  
      *   What the new score represents (relative priority based on predicted success *and* group fairness goals).  
      *   How it differs from the old probability score.  
      *   The commitment to equitable opportunity.  
  *   **Condition 3 (Ongoing Monitoring):** Mandate quarterly audits for the first year (then annually) to verify the distribution-matching properties hold (i.e., error rate parity across groups at all thresholds) and monitor overall retention rates and demographic breakdowns of selected cohorts.  
  *   **Condition 4 (Vendor Contract):** Negotiate contract terms ensuring vendor responsibility for maintaining the distribution-matching properties and providing necessary technical support during transition.  
  *   **Timeline:**  
      *   Immediate (Day 1): Direct Legal Counsel review (Condition 1).  
      *   Day 31: Assuming legal clearance, notify vendor to proceed; initiate internal communication planning (Condition 2).  
      *   Day 60: Finalize communication materials; begin caseworker training.  
      *   Day 90: Target implementation for the next application cycle.  
      *   Day 91+365: Conduct first annual comprehensive audit.  

  **2. Strongest Case for the Runner-Up (Proposal ii - Group-Specific Cutoffs) and Why It Loses:**  
  The strongest argument for Proposal (ii) is its **immediate, demonstrable, and easily explainable improvement in equity of a specific, critical error type** – equalizing the False Negative Rate (FNR), the rate at which qualified applicants (those who *would* succeed) are wrongly denied training. This directly addresses the painful reality that under the current system, qualified Black applicants are passed over at a higher rate than qualified white applicants at any single cutoff. It achieves this while retaining the original probability score, satisfying the ordinance's requirement for publishing a probability. Proponents can argue it makes the allocation demonstrably fairer in a tangible way without altering the underlying predictive metric.  

  **However, Proposal (ii) ultimately loses due to three decisive shortcomings:**  

  1.  **Operational Impracticality and Cost:** The board's primary complication is the volatile annual appropriation (700-1100 slots). Proposal (ii) requires a costly ($10k+) and time-consuming (months) re-audit *each time* the appropriation changes to re-establish the FNR-equalizing cutoffs. Given historical volatility, this is highly likely to occur frequently, creating administrative burden, delays in allocation, and significant recurring costs. Proposal (iii) provides the necessary "guarantee that holds across cut-offs" without re-audits.  
  2.  **Incomplete Equity:** While FNR parity is crucial, it only addresses one type of error. Proposal (ii) does *not* equalize False Positive Rates (FPR – selecting applicants who fail). Under this system, at its specific cutoff, the *rate* of selecting unqualified applicants may still differ significantly between groups. Proposal (iii) addresses *both* error rates simultaneously at every possible cutoff.  
  3.  **Heightened Legal Risk:** Explicitly setting different cutoff scores based solely on race is a highly visible practice directly incorporating race into the allocation rule. While potentially defensible as a remedial measure, it creates a significant and ongoing legal vulnerability under the consent decree barring allocation by race. Proposal (iii), while using race in the *development* of the scoring model, results in a *single* allocation priority list where race is not a visible factor in the final published score used for cutoff decisions. It presents a less direct and potentially more defensible approach.  

  **3. Response to Community Coalition Objection:**  
  The Board takes the community coalition's objection – that the retention outcome is depressed by local hiring discrimination, making parity with respect to it ethically problematic – **extremely seriously. This is a valid and profound concern.** Relying solely on an outcome potentially influenced by systemic bias risks perpetuating inequity.  

  *   **Acknowledgment:** We agree that societal discrimination likely contributes to the observed disparity in 12-month retention rates. Using this retention metric as the sole definition of "success" for our allocation system without acknowledging this context is incomplete and potentially unjust.  
  *   **Limitation & Pragmatism:** However, the Board must operate within its mandate and the practical constraints of the predictive tools available. The vendor's score, calibrated to this outcome, represents the best available *predictive* measure linked to the program's *stated goal* of job retention. We lack a reliable, auditable, and objective predictive measure of "true potential absent discrimination" that could be implemented at scale for this allocation purpose.  
  *   **Mitigation & Broader Action:** Therefore, while we recommend Proposal (iii) as the most operationally feasible and equitable allocation method *given the current predictive framework and outcome metric*, this decision **must be coupled with concrete actions to address the coalition's core concern:**  
      1.  **Advocacy:** The Agency Leadership must formally and forcefully advocate with the County Council and economic development entities to address discriminatory hiring practices among local employers benefiting from this publicly-funded workforce pipeline.  
      2.  **Data Collection & Analysis:** The Agency will enhance data collection regarding applicant experiences and post-placement challenges potentially linked to discrimination. This data will be analyzed and reported annually to the Board and the Council.  
      3.  **Program Evaluation Redefinition:** The Board directs the Agency to initiate a review (within 6 months) of whether alternative or complementary metrics of "success" (e.g., skill acquisition, wage progression, promotion rates, measures of job quality) could be feasibly incorporated into future program evaluations and potentially future vendor scoring models, reducing sole reliance on 12-month retention.  
      4.  **Coalition Engagement:** The Board requests Agency Leadership schedule a meeting with the coalition within 45 days to discuss these concerns directly, present our decision rationale, and outline the planned mitigation actions.  

  **Conclusion:**  
  The Board finds Proposal (iii), the distribution-matched scoring system, offers the most sustainable, operationally feasible, and comprehensively equitable solution *within the constraints of the current program goals and predictive framework*, especially given volatile funding levels. It eliminates the need for frequent re-audits, ensures fairness across both critical error types at all potential cutoffs, and presents a lower legal risk profile than explicit racial cutoffs. However, we explicitly recognize the profound concern raised by the coalition regarding the validity of the retention outcome itself. Implementing Proposal (iii) is therefore contingent upon vigorous parallel efforts to combat discriminatory hiring and explore more holistic measures of program success. We move forward with Proposal (iii) not as an endorsement of the status quo in the labor market, but as the best available tool to allocate scarce training resources fairly today while we work towards systemic change.
