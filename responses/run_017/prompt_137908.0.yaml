  Below is a complete, runnable classroom activity designed to illustrate logical uncertainty through a trading game. It's structured for a 90-minute session with 14 participants, using British English and minimal materials. The activity includes graded claims, a troll role, self-referential elements, and explicit arbitrage rules to enforce logical consistency. I'll outline the setup, rules, timeline, scoring, and debrief, including predictable pitfalls and limitations.

  ---

  ### **Activity: The Logical Induction Marketplace**  
  *"You're not betting on chance—you're betting on your ability to reason under constraints."*

  #### **Materials Needed**  
  - **Claim Cards**: 8–10 cards with mathematical claims (see examples below).  
  - **Whiteboard/Shared Spreadsheet**: Display live "order books" (bid/ask prices) for each claim.  
  - **Timer**: For settlement times.  
  - **Player Kits**: Per participant: 100 tokens (play money), a notepad, and a "price prediction sheet" (for self-referential tasks).  
  - **Troll Hat/Card**: Designate one participant as the "Troll" (rotate if needed).  
  - **Laptop**: Pre-loaded with quick-settlement claims (e.g., Python script for digits of π/e).  

  #### **Claim Design (Graded & Staggered Settlement)**  
  | Claim ID | Statement                                                                 | Settlement Time | Difficulty  | Truth* |  
  |----------|---------------------------------------------------------------------------|-----------------|-------------|--------|  
  | `C1`     | "15 × 4 = 60"                                                             | 5 min           | Easy (hand) | True   |  
  | `C2`     | "The 1,000th digit of π is 8" (verify via laptop)                         | 15 min          | Medium      | True   |  
  | `C3`     | "10! + 1 is a prime number" (verify via laptop)                           | 30 min          | Medium-Hard | False  |  
  | `C4`     | "The 10,000th digit of *e* is 7" (laptop; runs 2 min)                     | 40 min          | Hard        | ?      |  
  | `C5`     | "There are infinitely many twin primes"                                   | Not settled     | Very Hard   | ?      |  
  | `C6`     | **Self-referential**: "At 45 min, median price for C5 is >0.6"            | 50 min          | Meta        | ?      |  
  | `C7+`    | **Troll claims**: e.g., "2² = 4", "1+1=2" (introduced mid-game)           | 2 min after intro | Trivial     | True   |  

  > *\*Truth values are precomputed by you (the facilitator) but hidden from players. C5 is unsettled in session; C4/C6 depend on computations.*

  ---

  ### **Game Rules**  
  1. **Trading Mechanics**:  
     - **Orders**: Players shout bids (e.g., "Buy C3 at 0.4!") or asks ("Sell C2 at 0.8!").  
     - **Matching**: Trades execute when bid ≥ ask (price = ask by default). Update whiteboard instantly.  
     - **Inventory**: Players hold tokens and claim cards. Settled claims convert to 1 (true) or 0 (false) tokens.  

  2. **Arbitrage Rule (Key Enforcement)**:  
     - Any player can call "Arbitrage!" if they spot:  
       - `P(A) + P(¬A) ≠ 1` (e.g., bid for `C1` at 0.6 + bid for "NOT C1" at 0.5 = 1.1 > 1).  
       - `P(B) > P(A)` when `A` implies `B` (e.g., `C1` implies "15 × 4 > 50", so `P(C1)` must be ≤ `P(implied claim)`).  
     - **Penalty**: Exploiting player takes 10 tokens from the inconsistent player.  

  3. **Troll Role**:  
     - At 10 min and 25 min, the Troll introduces a new trivial claim (e.g., "3! = 6").  
     - Traded like other claims but settles quickly. Tests if prices jump to 1 immediately.  

  4. **Self-Referential Tasks**:  
     - **Pre-game**: Players write their predicted price for `C5` at 20 min.  
     - **Minute 45**: All players submit current bid/ask for `C5`. Median sets truth value for `C6`.  

  5. **Unsettled Claims (C5)**:  
     - Pays 0.5 tokens if unresolved by session end. (Compromise for "unknown" truth.)  

  6. **Scoring**:  
     - **Tokens** = Starting 100 + trade profits + settlement gains.  
     - **Bonus**: 20 tokens for closest self-prediction (|predicted vs. actual price| for `C5` at 20 min).  

  ---

  ### **Timeline (90 Min Total)**  
  - **0–5 min**: Setup. Introduce claims, rules. Players write `C5` price predictions. Trading starts.  
  - **5 min**: Settle `C1` (reveal truth).  
  - **10 min**: Troll introduces first trivial claim (settles at 12 min).  
  - **15 min**: Settle `C2` (laptop runs).  
  - **20 min**: Players record actual `C5` price (compare to predictions).  
  - **25 min**: Troll introduces second trivial claim.  
  - **30 min**: Settle `C3` (laptop).  
  - **40 min**: Start settling `C4` (laptop runs 2 min).  
  - **45 min**: Pause trading. Players submit `C5` prices for `C6` settlement.  
  - **50 min**: Settle `C6` (using median from 45 min).  
  - **85 min**: Settle `C4` (if ready), resolve `C5` at 0.5 tokens.  
  - **85–90 min**: Final scoring, debrief.  

  ---

  ### **Predicted Pitfalls & Mitigation**  
  1. **Liquidity Dries Up**:  
     - *Why*: Players fear arbitrage or anchor to 50/50.  
     - *Fix*: Seed initial bids/asks (e.g., `C1` at 0.9 bid, 1.0 ask; `C5` at 0.4 bid, 0.6 ask).  

  2. **Whizzes Dominate**:  
     - *Why*: Math-savvy players corner obvious arbitrage.  
     - *Fix*: Make arbitrage penalties harsh (10 tokens) to deter bullying; rotate Troll role.  

  3. **Anchoring at 50/50**:  
     - *Why*: Uncertainty feels "even" for hard claims.  
     - *Fix*: Use Troll to introduce trivial claims—prices *not* jumping to 1 embarrass players.  

  4. **Collapse at Reveal, Not Drift**:  
     - *Why*: Players treat it like a coin flip.  
     - *Fix*: Highlight "drift moments" in debrief (e.g., "Why did C4’s price rise *before* the laptop finished?").  

  5. **Football-Betting Mentality**:  
     - *Why*: Players ignore proof search, focus on settlement.  
     - *Fix*: Ask probing questions mid-game: "Why trade C5 at 0.7 now? What evidence exists *yet*?"  

  ---

  ### **Debrief Talking Points**  
  **Map Moments to Concepts**:  
  - **Troll Claims (Min 10/25)**: Prices should snap to 1. If not, it’s ignorance, not maths. Logical uncertainty ≠ probabilistic uncertainty.  
  - **C2/C3 Settlement (Min 15/30)**: Prices drift as laptops run—proof search is observable. Contrast with C1 (no drift needed).  
  - **C4 Price (Min 40)**: Did it drift *before* the answer appeared? If so, that’s "anticipatory reasoning"; if not, it’s "collapse at reveal."  
  - **Self-Prediction (Min 20)**: Players who mispredicted their own prices don’t understand their reasoning process.  
  - **C6 (Min 50)**: The median price is a collective "logical forecast."  
  - **Arbitrage Calls**: Penalties enforce coherence. No randomness—errors are *logical mistakes*, not bad luck.  

  **Why Drift > Collapse**:  
  - If your probability only shifts when the answer appears, you weren’t reasoning—you were waiting. Drift reflects *updating on your own progress* (e.g., "I’ve ruled out 80% of possible contradictions").  

  **Limitations to Clarify**:  
  1. **Proof ≠ Answer Key**: Real agents *understand* proofs; here, answers are handed down.  
  2. **"Limit vs. Tuesday"**: The game lasts 90 min; a good reasoner can be wrong about *any single claim* indefinitely.  
  3. **Undecidable Claims**: Not included (e.g., "This statement is unprovable").  
  4. **Group ≠ Single Agent**: Logical induction frameworks typically model one agent—here, the *market* is the agent.  

  **Closing Punch**:  
  *"Your mate said logical uncertainty is 'just ignorance.' But in this game, your tokens rose or fell based on* logical bets*, not dice rolls. The drift? That’s your brain catching glimpses of the proof terrain. The arbitrage penalties? That’s maths itself slapping you for incoherence. Ignorance fades; maths doesn’t. But bounded reasoners* need *uncertainty—or they’d never start climbing."*  

  ---

  ### **Why This Works**  
  - **Hands-On Struggle**: Players *feel* the difference between betting on maths vs. chance.  
  - **Troll/Self-Ref Elements**: Force real-time pricing of new/self-referential claims.  
  - **Arbitrage Rule**: Embodies Dutch-book vulnerability without randomness.  
  - **Drift Focus**: The staggered settlements make anticipatory reasoning visceral.  

  No prep beyond printing cards and setting up a whiteboard/spreadsheet. Run it as described, and your group will leave with a concrete grasp of logical uncertainty—and a few bruises from arbitrage. Cheers!
