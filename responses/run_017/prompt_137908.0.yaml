   2. Settlement schedule: Announce when each claim will be checked (if at all during the session).
   3. Troll role: A designated person (or the facilitator) introduces new claims at random times, including trivial ones.
   4. Self-referential claim: e.g., "At minute 45, the median price for Claim X will be above 0.6".
