prompt: |-
  I work in a small evidence and policy unit inside a ministry, and I have been asked to draft a memo that I am struggling even to structure, so what I need is help with the argument rather than sources or further reading. Background: our country usually places somewhere in the high teens in the well-known annual world happiness rankings, the ones that put Finland at the top year after year, and a newly appointed junior minister has announced an official target of reaching the top five within ten years, with a small budget attached and our unit made responsible for the delivery plan. Two problems have come up that I cannot reconcile with each other.

  The first concerns the cheapest proposals on the table, all of which work on the moment of measurement rather than on anyone's circumstances: a public broadcasting campaign about noticing the good things in one's life, timed to the weeks when the survey is in the field; a "positive news hour" partnership with the main commercial broadcaster; and a suggestion from an external polling firm that respondents be asked a couple of warm-up questions about recent good events before the life-satisfaction question itself. A friend at the national statistics office says this is straightforwardly corrupt: we would be manufacturing the appearance of improvement and would ruin the series for anyone who later wants to track anything. My instinct is with her, but I cannot state the objection cleanly, because the minister's reply seems hard to answer. The thing being measured just is what people say when they are asked, he says; if the campaign leaves people genuinely more inclined to register what is good in their lives, then their lives have improved in the only sense the ranking tracks, so what exactly is the difference between moving the number that way and moving it by, say, shortening hospital waiting lists? A second friend added a different worry: we could improve everyone's life substantially and still not rise, if other countries improve faster, so is a position in a table even the sort of thing a government should aim at?

  The second problem is that we ran a small pilot module of our own alongside the regular survey, because several of us were uneasy about the headline question, the one that asks people to place their current life on a rung between the worst and the best life they can imagine for themselves. Our module asked whether there is something about their life they have wanted to change for more than a year and have not been able to change, and how often in the past week they felt they were getting through the day rather than living it. On the official question, our poorest region scores almost the same as the capital, and young people in the big cities score almost the same as retirees on the coast. On our two questions the gaps are enormous, and they cut against the official picture. I cannot tell whether this shows that the official question is a poor instrument and that we should propose a different one as the target, or whether it shows that our own questions are intrusive and condescending, the sort of thing a government has no business asking, because people may honestly judge their lives to be going well by standards that are their own and it is not for us to say those standards have quietly shrunk to fit what they can realistically hope for.

  So the memo needs to decide three things, and I would like your reasoning on each as much as your conclusion. Should we recommend adopting a numerical target at all, given that the number is a comparison with other countries and a report of how people say they feel rather than a count of anything we deliver? If we do adopt one, should the official target be the standard ladder question, something closer to our pilot questions, or some combination, and what should we say to the regions whose poor scores on our module would suddenly become the thing government is accountable for? And how should I answer the minister's argument that changing what people say and changing how their lives go are not really different here, given that the measure is self-reported? The memo is three pages, due Friday, and will be read by people who will be impatient with anything that sounds like academic hedging, so please tell me plainly where you think I am confused and where you think the minister is right.
reasoning: |-
  Hmm, the user is struggling with drafting a memo about a national happiness ranking target. They work in a government policy unit and need help structuring arguments, not sources. The core tension is between gaming the survey through cheap interventions versus addressing real issues, and whether the target itself is valid.

  The user presents three key dilemmas: First, whether to recommend a numerical ranking target at all, since it's relative to other countries and based on subjective reports. Second, which survey questions to use as the target metric - the standard ladder question or their pilot questions that revealed large inequalities. Third, how to counter the minister's argument that influencing responses is as valid as improving actual lives.

  From the background, I can see several layers of concern. The cheap proposals (media campaigns, survey priming) feel ethically dubious to the user and their statistician friend - it's manufacturing appearance rather than change. But the minister's "if it changes perceptions, isn't that real?" point has philosophical weight. Their pilot module uncovered troubling disparities masked by the standard question, suggesting it might measure resignation rather than wellbeing. Yet asking about unmet desires could be seen as paternalistic.

  The deeper policy questions here are fascinating: Can governments ethically optimize for a survey metric? Does a ranking target make sense when improvement depends on others' performance? And crucially - when does influencing responses cross from legitimate framing effects into manipulation?

  The memo needs to balance ethical rigor with political realism. For the numerical target, I think we should recommend against fixating on rankings but propose tracking absolute scores. For the measurement, we should keep the standard question for comparability but supplement it with their distributional data. And for the minister's argument - while perception matters, there's a clear line between changing context (like healthcare access) and manipulating the survey moment. The integrity of data matters for future policy.

  The user's pilot questions reveal important structural issues, so the memo should frame them not as replacement targets, but as diagnostic tools. This turns the "intrusive" concern into strength - it shows where real problems exist beneath surface-level satisfaction.

  The tone must be ministerial: direct, no academic hedging, but preserving statistical integrity. The three-page limit means prioritization is key - focus on actionable recommendations first, then layered arguments.
answer: |-
  Here’s a clear, argument-driven structure for your memo, cutting through the confusion with direct recommendations:

  ---

  **MEMORANDUM**  
  **To:** Junior Minister  
  **From:** [Your Name/Unit]  
  **Date:** [Date]  
  **Subject:** Recommendations on National Happiness Target Strategy  

  ### 1. **Should we adopt a numerical ranking target?**  
  **No.** Recommend *against* targeting a top-5 global ranking.  
  **Why:**  
  - **The ranking is relative, not absolute.** Rising depends on outpacing countries like Finland or Denmark—whose policies we don’t control. Even with major improvements, we could stagnate if others improve faster.  
  - **It prioritizes optics over substance.** A ranking target incentivizes short-term manipulation (e.g., survey timing) over durable well-being gains.  
  - **Better approach:** Target *absolute* improvements in our national happiness score (e.g., "Raise average life satisfaction from 7.2 to 7.8 by 2034"). This focuses on our citizens’ outcomes, not global volatility.  

  ### 2. **Which measure should we target?**  
  **Target the standard ladder question—but supplement it with our pilot questions.**  
  **Why:**  
  - **The ladder question is the int’l standard.** Changing it invalidates comparisons and undermines policy credibility.  
  - **But our pilot reveals critical gaps.** It uncovers hidden inequalities (e.g., regional/age disparities in agency and stagnation) masked by the ladder question.  
  - **Recommendation:**  
    - **Primary target:** Standard ladder question (for comparability).  
    - **Secondary metrics:** Integrate our pilot questions ("unmet needs" and "daily stagnation") into national reporting.  
    - **To regions:** Acknowledge disparities: *"The ladder score shows resilience; our new metrics highlight where people feel trapped. Targeting both ensures growth is broad and meaningful."*  

  ### 3. **How to counter the Minister’s argument?**  
  **Distinguish between *shaping perception* and *improving lives*.**  
  **Why the Minister is partially right—but dangerously incomplete:**  
  - **He’s right that** subjective well-being *is* defined by self-reporting. If a campaign genuinely makes people notice joy more often, that *is* a real gain.  
  - **But he’s wrong to equate this with systemic change:**  
    - **Cheap tactics (e.g., survey priming) create illusory gains.** They inflate scores without altering daily experiences. Once the tactic ends, scores revert.  
    - **Systemic changes (e.g., healthcare access) create durable gains.** They address root causes of unhappiness (stress, insecurity) and sustain improvements.  
    - **Key distinction:** *Does the intervention outlive the survey?* If not, it’s manipulation.  

  ---

  ### **Summary of Recommendations**  
  1. **Abandon the ranking target.** Pursue an *absolute* improvement in our national happiness score.  
  2. **Retain the standard ladder question** as the primary metric, but **elevate our pilot questions** to diagnose hidden inequalities.  
  3. **Reject cheap tactics** that manipulate survey moments. Focus on policies with lasting impact (e.g., healthcare, social support).  
  4. **Tell regions the truth:** "Our new metrics reveal unmet needs. We will target these while celebrating your community’s resilience."  

  ### **Where Confusion Lies**  
  - **You’re not confused—the measure is flawed.** The ladder question *can* mask suffering (as your pilot shows). But swapping it mid-target invites skepticism. Supplement, don’t replace.  
  - **The Minister misses the stakes.** Gaming surveys corrupts evidence-based policy. If we inflate scores, we lose the ability to diagnose real problems.  

  ### **Where the Minister is Right**  
  - Well-being *is* subjective. If a *lasting* culture shift (e.g., national gratitude campaigns) genuinely changes perspective, that’s valid. But ephemeral tricks are not.  

  ---  
  **Final Word:** Target what matters—durable well-being—not a ranking. Integrity in measurement is non-negotiable.
