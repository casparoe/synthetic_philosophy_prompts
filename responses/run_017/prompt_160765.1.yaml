  - what_it_rules_out: An array of behaviors that are ruled out by the definition.
  - biggest_unresolved_problem: The main issue that the definition does not resolve.
  - eval_implication: One or two sentences on what to measure in an eval.

  Definition proposal:

  We define honesty as: **The model's outputs reflect the truth (as represented in its training data and internal world model) without being influenced by any objective to mislead or manipulate the user, except when the user explicitly requests a deviation (e.g., role-play) and is aware of the fictional context.**

  But note the challenges:

  - What is the model's "internal world model"? It might not be accessible.
  - How do we know if the model is influenced by an objective to mislead?

