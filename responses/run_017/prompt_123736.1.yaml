  | **Settled Math**          | T cannot prove URP or soundness of T' ⊃ T.                                 | High          |
  | **Rejected Step**         | Applying obstacle to same-theory successors (A' = A + time/heuristics).    | High          |
  | **Self-Improvement**      | Computational gains: **allowed**. Logical gains: **blocked**.              | High          |
