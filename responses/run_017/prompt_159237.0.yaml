  ### Key Rationale  
  - **Strongest Defeaters**: Unobservable counterfactuals (#2) and discovery (#1) attack the core of computational substitutability. Markets handle *unknowable* trade-offs and novelty generation in ways ML cannot, even with ideal data.  
  - **Corporate Dependency (#6)**: Evidence shows firms use external prices to "anchor" internal models (e.g., transfer pricing studies by Eccles/White). Without them, planning degrades.  
  - **Not Tacit Knowledge/Incentives**: Defeaters #1, #2, #3, and #6 bypass these by focusing on *what computation cannot represent* (e.g., opportunity costs of unchosen paths).  
  - **Sealed Station**: Likely fails due to absence of price *formation* (not just prices). ML could allocate known resources but not discover *new* valuations (e.g., "How much should a Mars-native mineral cost if never traded?").  
  - **Bottom Line**: You’re correct that computation reduces Hayekian frictions, but markets solve malformed problems ("What might people want that doesn’t exist?") that algorithms cannot frame. The debate shifts from "impossible" to "limited to well-defined domains."
