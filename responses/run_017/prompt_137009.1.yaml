  - Insurance/loan contract requirements
  - Database management (their system already separates objects from materials)
  - Ethical obligations (especially to source communities)
  - Audit trail requirements

  Key constraints:
  - No metaphysics jargon allowed
  - Must flag where human judgment is unavoidable
  - Needs to handle material subtraction/addition/replacement
  - Must accommodate non-physical objects (digital files, instructions)

  Looking at their examples:
  1) The bronze case tests material replacement thresholds
  2) The wax artwork challenges persistence through physical recreation
  3) The house post examines cultural vs institutional definitions

  For the house post (case 3), they explicitly want the procedure to validate the community's view or clearly state who should override it. This suggests ethical considerations may sometimes trump physical analysis.

  The user's mention of "substantial transformation" in customs law is insightful - we can adapt that legal concept since it's designed for administrative decisions. Also noting their database structure already distinguishes objects from materials implies our procedure should leverage that existing framework.

  Important philosophical touchstones to simplify:
  - Sortals (category-dependent identity): "What kind of thing are we tracking?"
  - Constitution vs identity: "Is this the same statue or new material?"
  - Teleological persistence: "What purpose defines this object?"

  For the decision procedure, I'll structure it as:
  1) A flowchart-style Q&A with clear exit points
  2) Plain language definitions (e.g., "substantial transformation = changed beyond recognition as that thing")
  3) Designated "human judgment" flags
  4) Specific outputs for insurers/auditors
  5) Three worked examples showing different paths

  Crucially, for case 3, I'll build in an ethical override upfront - if a source community claims persistence, that likely trumps material analysis. The procedure should explicitly route such cases to the ethics committee rather than attempting technical resolution.

  Finally, I'll be transparent about limitations:
  - Determines institutional position, not metaphysical truth
  - Can't resolve deep philosophical disagreements
  - Requires consistent application to build audit trail credibility
  - Depends on initial categorization (which may need revision)

  The tone should remain practical throughout - this is a tool for professionals, not an academic exercise. Where philosophy is unavoidable, it gets distilled into single-sentence operational definitions.
answer: |-
  Here's a pragmatic decision procedure for object identity in collections management, designed for speed, auditability, and alignment with common institutional/legal frameworks. It prioritizes operational clarity over metaphysical resolution.

  **Object Identity Decision Procedure (30-Minute Workflow)**

  1.  **Confirm the Stakes:**
      *   *Ask:* "What practical outcome depends on this decision? (e.g., insurance coverage, loan compliance, return obligation, catalog accuracy, legal title, ethical obligation)?"
      *   *Sufficient Answer:* Specific requirement cited (e.g., section 4.2 of loan agreement, insurance policy clause XYZ, NAGPRA claim, cataloguing standard ABC).
      *   *Stop if:* No specific stake is identified (log decision as informational only).

  2.  **Identify the Relevant Sortal:**
      *   *Ask:* "What is the *primary category* we are tracking for *this specific purpose*? (e.g., 'the artwork', 'the functional device', 'the cultural patrimony object', 'the archival document', 'the bulk material')?" **Gloss:** *Sortal = The defining category determining what counts as persistence for this object (e.g., "Picasso's Guernica" vs. "canvas and oil paint").*
      *   *Sufficient Answer:* A clear category stated in the accession record, donor agreement, loan contract, artist instructions, or relevant cultural protocol. Default to the primary designation in the catalog if ambiguous.
      *   *Hand Off if:* The stake (#1) involves an ethical obligation (e.g., return to source community) AND the community defines the sortal differently. **Hand off to:** Ethics Committee / Director (for decision based on ethical/cultural obligation, not physical identity).
      *   *Judgement Needed:* Interpreting ambiguous records or conflicting definitions.

  3.  **Assess Physical Transformation (Against the Sortal):**
      *   *Ask:* "Has the physical item undergone **substantial transformation** relative to its defined sortal?" **Gloss:** *Substantial Transformation = A change so significant the item can no longer reasonably be considered the *same instance* of its sortal category.*
      *   *Check:*
          *   **Material Composition:** What % of the original *material* is present? (Estimate: >80% = likely same; <20% = likely new; 20-80% = grey zone). Does the sortal prioritize material (e.g., mineral specimen) or form/function (e.g., sculpture, machine)?
          *   **Form/Function:** Has the essential form, structure, or function defined by the sortal been lost or fundamentally altered? (e.g., vase shattered vs. lens replaced in microscope).
          *   **Intent/Origin:** Was the change intended as part of the object's nature (e.g., artist instructions) or an external intervention (e.g., conservation, damage)?
          *   **Replacement vs. Accretion/Subtraction:** Is new material *replacing* core original material (raises identity questions), or is it *added* (mount, label) or *removed* (dirt, corrosion products, sacrificial coating) without altering the core defined by the sortal?
      *   *Sufficient Answer for "No Substantial Transformation":*
          *   High original material retention (>80%) AND core form/function intact.
          *   Changes are accretion/subtraction of non-core material (dirt, mounts, minor losses).
          *   Changes are documented, reversible conservation treatments *not* altering core material/form *and* consistent with the sortal's definition (e.g., cleaning a painting).
      *   *Sufficient Answer for "Substantial Transformation":*
          *   Very low original material retention (<20%).
          *   Complete loss of core form/function defined by the sortal (e.g., sculpture melted down).
          *   Complete replacement of core functional/defining components (if sortal prioritizes function over specific matter - e.g., replacing *all* lenses in a microscope designated as a functional unit).
      *   *Stop with "No":* If Substantial Transformation is confirmed *and* the stake requires the original instance (e.g., "Is this the specific item insured?" = **No**; "Does the lender get this back?" = **No, unless contract specifies otherwise**).
      *   *Judgement Needed:* Grey zone material % (20-80%); interpreting "core" form/function; assessing reversibility impact.

  4.  **Resolve Tracking (Multiple Numbers/Matter vs. Object):**
      *   *Ask:* "Does our catalog *already* track the material separately from the functional/cultural/artistic object (multiple accession/LOT numbers)?"
      *   *If YES:* Maintain separate tracking. The "Object" number follows the identity defined by the sortal/stakes after transformation assessment. The "Material" number follows the original matter.
      *   *If NO:* Does the transformation assessment (#3) suggest the *original matter* now has distinct significance (e.g., removed fragments in a tray)? **Judgement Needed:** Consult Collections Manager/Curator on whether to create a new number for the removed material. Default is *no new number* unless the material has independent value/research significance.
      *   *Hand Off if:* Creating a new number has significant resource or ethical implications. **Hand off to:** Collections Manager / Collections Committee.

  5.  **Non-Physical Origins (Instructions/Digital):**
      *   *Ask:* "Is the accessioned item primarily defined by information (digital file, instructions, recipe) rather than a unique physical instantiation?"
      *   *If YES:* The *information* is the persistent object. Physical instantiations (prints, casts) are *manifestations*. Identity depends on the integrity/authenticity of the information, not the physical carrier.
      *   *Sufficient Answer:* "Same Object" if the core information is unchanged. "New Object" only if the information itself is fundamentally altered.
      *   *Tell Insurer/Lender:* Specify you are loaning/insuring a *manifestation* generated from the accessioned instructions/file on a specific date. The value lies in the information + authorized instantiation.

  6.  **Document Decision & Rationale:**
      *   Record: Stake (#1), Sortal Used (#2), Transformation Assessment (#3), Tracking Decision (#4), Key evidence cited, Person responsible for decision/judgement points.
      *   Output: Clear statement for the required purpose (e.g., "For loan X, Object 1972.1 is considered the same item as accessioned.", "For insurance renewal, the current wax block is considered a new manifestation; the insured object is the artist's instructions.").

  **Procedure Limitations:**

  1.  **Not Metaphysical Truth:** Determines the **institutional position** needed for operational purposes (contracts, ethics, catalog), not whether there's one "true" answer. It answers "what should we *call* this for form X?".
  2.  **Judgement Required:** Grey zones exist (material %, defining "core", interpreting sortals). The procedure flags these; consistent application and documentation are key for audits.
  3.  **Sortal Dependency:** The answer *can* change based on the purpose/sortal (e.g., the same item might be "the artwork" for loan but "different matter" for material analysis).
  4.  **Database Limits:** Relies on existing catalog structure; won't fix fundamental data model issues.
  5.  **Future Proofing:** May struggle with extreme edge cases (e.g., AI-generated evolving digital art, nanoscale repairs).
  6.  **Ethical Override:** Cannot resolve conflicts between institutional physical assessment and community/cultural understanding of persistence. Defers these to ethical/policy decision-makers.

  ---

  **Applied to Your Cases:**

  1.  **Bronze Figure (60% infill, fragments separate):**
      *   **Stakes:** Loan travel, Insurance (which object?).
      *   **Sortal:** "Artwork" (Sculpture by Artist X).
      *   **Transformation:** Significant material replacement (40% original). *Grey Zone (20-80%).* **Judgement:** Core *form* of the artwork has been preserved/reconstructed using significant original material. Not substantially transformed *as the artwork*. Removal of fragments was accretion/subtraction.
      *   **Tracking:** Catalog already separates (Object number for figure, LOT for fragments). Maintain this.
      *   **Decision:** The assembled figure (Object number) is "the artwork" for loan and insurance purposes. The fragments (LOT number) are removed material.
      *   **Tell Insurer:** "The insured artwork (Object# ABC) currently incorporates approximately 40% original metal and 60% modern infill, preserving its artistic form. Removed unstable fragments are tracked separately (LOT# XYZ) and are not part of the loaned artwork."

  2.  **Wax Block (Recast annually per artist):**
      *   **Stakes:** Insurance (is the 2026 block the accessioned object?).
      *   **Sortal:** "Artwork" defined by artist's concept/instructions (living artist confirms this).
      *   **Transformation:** Physical matter is completely replaced annually. **BUT** the sortal ("Artwork") is defined by the *instructions/concept*, not the specific matter. The annual recasting *is the artwork's intended mode of persistence*. No substantial transformation *of the artwork* occurs through authorized recasting.
      *   **Tracking:** Accession number is for the artwork (instructions/concept), not the specific wax lump.
      *   **Decision:** The 2026 wax block *is* the current valid manifestation of the accessioned artwork.
      *   **Tell Insurer:** "The insured artwork (Accession# XYZ) is defined by the artist's instructions, which mandate annual recasting. The current physical manifestation (2026 wax block) represents the artwork and requires insurance coverage for its current form and value. Coverage should reflect the nature of the work." (Insurer may still price risk differently).

  3.  **Carved House Post (Community view vs. 1972 record):**
      *   **Stakes:** Return claim from source community.
      *   **Sortal:** **Immediately Hand Off!** The stake involves an ethical obligation to a source community, and the community defines the sortal ("Persisting Cultural Patrimony Object") differently than the museum's historical record ("1972 Reconstruction"). **Do not proceed to transformation assessment.**
      *   **Hand Off to:** Ethics Committee / Director / Repatriation Committee, with clear input: The community asserts persistence through plank replacement as integral to the object's cultural identity. The procedure stops here; the decision is based on ethical obligation, cultural protocols, and policy, not physical continuity assessment.
      *   **Your Goal:** The procedure *explicitly supports* achieving the outcome you desire (returning it as the same object) by routing it to the correct ethical decision-making body and preventing a purely material assessment from blocking it. **The procedure itself won't declare it the same object, but ensures the community's perspective is the deciding factor.**

  **Final Honesty:** This procedure determines **what your institution will consistently record and assert for operational purposes** based on defined criteria and available evidence. It **cannot** tell you if there's a single, universal "fact of the matter" about object identity outside of a specific context (purpose/sortal). Philosophers debate this endlessly. The procedure answers the only question that matters for your desk: **"What do we write on the form (and why) to meet our obligations and keep the auditor happy?"** It makes the implicit judgements explicit and defensible.
