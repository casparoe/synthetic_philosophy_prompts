prompt: |-
  hey — I moderate a critique group for novelists. Eight of us, we meet monthly, and between full manuscripts and thirty-page chunks I'm reading other people's work-in-progress most nights. The actual job I keep failing at isn't writing feedback, it's adjudicating it: two readers come back on the same pages with flatly opposite verdicts (one says it's the best thing she's written, one says he couldn't get past chapter two), the writer looks at me, and whatever comes out of my mouth next decides which way six months of revision goes. That's maybe forty of these calls a year, the readers are unpaid volunteers I can't give homework to, I have about twenty minutes with both sets of notes in front of me and the pages, and whatever I decide I have to say out loud in a way that doesn't make either reader quit the group.

  I half-remember that Hume wrote something about whether taste can be objective at all — true judges, delicacy of sentiment, practice, comparison, being free of prejudice, we defer to critics who've done all that. There's also some story about two guys at a wine tasting who both complained the wine was off, one said leather and one said metal, everyone else said it was fine and laughed at them, and then when the barrel was drained there was an old key on a leather thong sitting at the bottom. I don't want an essay about any of this. I want a procedure.

  So: give me an ordered set of tests — a checklist, a flowchart in words, whatever — that I can actually run in twenty minutes to decide which reader's judgment to back, or whether to declare the disagreement undecidable. For each step say what counts as a sufficient answer, where the procedure just stops with "no verdict" and I tell the writer to pick based on what she wants the book to be, and where it has to hand the question to a person because it's a values call and not a facts call. Every step has to be phrased so someone who's never opened a philosophy book can run it, and you should say plainly which of Hume's distinctions survive being turned into a checklist and which ones you're dropping and why.

  Please steal, fix, or replace my own half-baked ideas:

  1. The key-and-thong step. Before I decide who is right, I go looking for a concrete thing in the text that both readers are actually responding to from different angles — a tense shift, a narrator who withholds, a deliberately dull scene, a joke that lands as cruelty for one reader and as honesty for another. If I find it, the disagreement is evidence about the book. If I can't find it after a fixed amount of time, the disagreement is evidence about the readers. I don't know how to stop myself from finding something, though, so this step needs a way to fail.
  2. Local reasons beat global verdicts. "On page twelve the tense shifts and I lost the timeline" is usable. "It didn't work for me" and "I couldn't put it down" are not. But our best reader writes almost entirely in global verdicts and is usually right, so I need to know what to do with that.
  3. The inversion test. Have the champion argue against the manuscript and the detractor argue for it, and see which of their specific observations survive the flip. Observations that survive get kept; overall verdicts get discounted. I've tried this twice and once it felt rigged toward whoever is more articulate.
  4. The borrowed-standard problem. Half our fights are really about a reader judging a quiet literary novel by thriller standards, or a comic novel by standards of sincerity, or a first-person voice by standards of likability. What's the test for "you're using the wrong standard for this book" versus "you just dislike it and that's allowed"?

  Two more things about my group you have to build around. There's a retired editor in her seventies who is scary good and has been right more often than the rest of us put together, and there's a writer whose own books are unlike anything anyone else writes and who loves things the rest of us hate and is sometimes the only early reader of something that later wins prizes. I don't want a procedure that just says defer to the expert, and I don't want one that pretends track records are nothing.

  Then run the procedure on three cases, including one where it tells me to back the reader I personally disagree with — I want to see that happen, because if the procedure never overrules me I'll never trust it. Make them cases I'd recognise: a debut literary novel everyone loves except one reader who says the narrator is unbearable; a genre manuscript where the group's praise is about the idea and the complaints are about the prose; and a case where the two readers disagree about whether a book is even finished. End by telling me what this procedure cannot do.

  One format thing: lead with your bottom line in the first sentence, then give me the reasoning. No preamble and don't restate the question back at me. Casual is fine — I'll be reading it at midnight.
reasoning: |-
  Okay, the user moderates a novel critique group and needs a practical procedure to handle conflicting feedback when two readers have opposite verdicts. They want a step-by-step checklist or flowchart that's actionable in 20 minutes, uses plain language, and incorporates some of their own ideas while addressing group dynamics (like the retired editor's expertise and the unconventional writer's insights). 

  Hmm, the key challenges are: avoiding philosophical jargon while still leveraging Hume's useful concepts (like "delicacy of sentiment"), designing fail-safes against the user's own biases, and ensuring the procedure doesn't default to deferring to track records. The user also explicitly wants to see the procedure overrule their personal preference in one test case—that's crucial for credibility.

  First, let's dissect their half-baked ideas. The "key-and-thong" concept (finding a textual root for divergent responses) is solid but needs a time-bound escape hatch. Their point about local vs. global feedback is valid, but the group's best reader uses global verdicts—so the procedure must allow exceptions for consistently accurate observers. The inversion test seems prone to charisma bias, and the borrowed-standard problem is essentially about genre alignment. 

  For the procedure itself, I'll prioritize: 
  - Speed (all steps under 20 min total)
  - Text-first focus (always return to manuscript evidence)
  - Bias checks (explicit flags for when user's preference creeps in)
  - Escape valves ("undecidable" options at every bottleneck)

  The retired editor and outlier writer complicate things. Their track records matter, but shouldn't override the text. Solution: use their history only as a tiebreaker if steps 1-4 deadlock, and only if their feedback aligns with their proven strengths (e.g., editor on pacing, outlier on voice).

  Now structuring the checklist: 
  Start concrete (textual evidence), then move to reader reliability, then values calls. Each step must have clear exit points. For example: 
  - Step 1: Hunt for textual anchors. If found, divergence is about interpretation → proceed. If not, divergence is reader-centric → jump to bias checks. 
  - Step 4 (borrowed standards): Genre alignment is verifiable via querying the author's intent, but personal taste isn't → split that into two substeps.

  Test cases need to stress-test the system: 
  1. The "unbearable narrator" case will test genre alignment vs. subjective taste. 
  2. The "great idea, weak prose" case challenges how to weight craft vs. concept. 
  3. The "is it finished?" debate probes objective milestones vs. artistic vision. 

  Biggest risk: The procedure might over-index on resolvable disagreements. Need clear "undecidable" off-ramps so the writer retains agency. Also, flag that toxic group dynamics (e.g., readers feeling dismissed) fall outside this tool's scope—that's interpersonal work.
answer: |-
  Here's your 20-minute conflict resolution procedure, distilled from your needs and Hume's workable ideas (delicacy, practice, comparison, lack of prejudice = "qualified readers"), while dropping impractical ones (universal "true judges" don't exist in your volunteer group). **Bottom line: Prioritize textual evidence and reader track record alignment over global verdicts, defaulting to "no verdict" if disagreements stem from irreconcilable values or insufficient data.**

  ---

  ### The Conflict Resolution Checklist
  **(Run steps in order; stop if you hit "Undecidable" or get a clear answer.)**

  1.  **The Key-and-Thong Test (5 mins max):**
      *   **Action:** Re-read the disputed section *twice*. First, read neutrally. Second, read while asking: "Is there a *specific, concrete element* (word choice, sentence structure, plot beat, character decision, tone shift, imagery) that **both** readers might be reacting to, even if interpreting it oppositely?"
      *   **Sufficient Answer Found:** YES (e.g., "The tense shift on p.15 disoriented Reader A but created urgency for Reader B"; "The protagonist's cold line on p.7 felt cruel to Reader A but darkly funny to Reader B"). **Result:** The disagreement reveals a *textual ambiguity or strength*. Tell the writer: "Both reactions point to [specific element]. This is working powerfully but divisively. Your revision choice depends on the *effect you intend* for this element." **STOP PROCEDURE.**
      *   **Sufficient Answer NOT Found (or time expires):** NO. **Result:** Disagreement is likely reader-centric. **Proceed to Step 2.**

  2.  **Local vs. Global & Track Record Check (5 mins):**
      *   **Action A (Local/Global):** Scan both feedback sets. Does *either* reader provide **specific, text-referenced reasons** (page/line, quote, concrete technique) supporting their verdict? Ignore unsupported global praise/critique ("boring," "brilliant," "couldn't put down").
      *   **Action B (Track Record Alignment):** For readers *without* strong local evidence, ask: **Does their global verdict *align* with their established track record AND the *type* of feedback they're usually strong on?** (e.g., The scary-good editor is usually right about *pacing/structure*, not necessarily voice. The outlier writer is often right about *originality/voice*, not necessarily marketability).
      *   **Sufficient Answer Found:**
          *   **Reader A** has strong local evidence **OR** their global verdict aligns with their specific, proven expertise relevant *to this manuscript's disputed aspect*.
          *   **Reader B** has neither strong local evidence nor track record alignment.
          *   **Result:** Back the reader meeting these criteria. Tell the writer: "[Reader A]'s feedback is grounded in [specific evidence/proven strength in X area], making it the more actionable path here." **STOP PROCEDURE.**
      *   **Sufficient Answer NOT Found / Tie:** Both readers have comparable local evidence OR comparable track record alignment. **Proceed to Step 3.**

  3.  **The Borrowed-Standard Test (5 mins):**
      *   **Action:** Ask: "Is the *core complaint or praise* from the detractor/champion based on a standard **fundamentally misaligned** with the writer's stated goals or the manuscript's established genre/tone *as presented*?" Check the writer's submitted synopsis/query or stated intent if available.
      *   **Sufficient Answer Found - YES (Borrowed Standard):** (e.g., Reader dislikes a *quiet literary novel* for lacking car chases; Reader praises a *dark tragedy* for being "so fun!"; Reader criticizes an *unreliable narrator* for being "unlikable"). **Result:** The reader using the borrowed standard's verdict is less applicable. Back the *other* reader *if* they passed Step 2. If *both* fail the borrowed standard test, or only one does but the other has weak evidence (Step 2), result is **Undecidable**.
      *   **Sufficient Answer Found - NO (Legitimate Taste):** (e.g., Both readers acknowledge the genre/tone; one simply finds the protagonist compelling, the other finds them grating; one loves the complex prose, the other finds it overwrought). **Result:** Disagreement stems from legitimate, irreconcilable differences in taste. **Undecidable.** **Proceed to Step 4 ONLY if Step 3 was inconclusive (neither clearly borrowed standards) AND you haven't declared Undecidable.**

  4.  **The Inversion Test (3 mins - Use Sparingly):**
      *   **Action:** *Only run if Steps 1-3 yielded a tie AND you have strong rapport with both readers.* Briefly ask each: "Imagine you *had* to defend the opposite position. Based *only* on the text, what's *one specific element* you could point to to support that view?" Don't force full arguments.
      *   **Sufficient Answer Found:** One reader identifies a *new, concrete* textual element supporting the opposite view, while the other struggles or repeats vague points. **Result:** The reader who could identify counter-evidence demonstrates deeper engagement. Back their *original* verdict *cautiously*. Tell the writer: "[Reader X] showed deeper textual engagement by identifying counter-evidence, making their initial reaction weightier." **STOP PROCEDURE.**
      *   **Sufficient Answer NOT Found / Both Perform Equally:** **Result: Undecidable. STOP PROCEDURE.**

  **"Undecidable" Outcome:** Tell the writer: "This disagreement highlights a genuine fork in the road for your book, based on taste/values. Neither reader is 'wrong.' Consider which path aligns best with *your* vision for [specific element or overall goal]. You have our perspectives; trust your instinct."

  ---

  ### What Survived/Dropped from Hume & Why
  *   **Survived & Used:** "Delicacy" (finding the Key-and-Thong), "Practice/Comparison" (Track Record Alignment), "Lack of Prejudice" (Borrowed-Standard Test). Turned into concrete checks for textual sensitivity, past accuracy on relevant aspects, and genre/vision alignment.
  *   **Dropped:** Universal "True Judges" / Objective Taste. **Why:** Your group *has* experts (editor, outlier), but they aren't infallible or universal. The procedure uses their *specific, proven strengths* within the group context, not absolute authority.

  ---

  ### Test Cases (Run Through the Checklist)

  1.  **Case: Debut Literary Novel - Loved by All Except One (Unbearable Narrator)**
      *   **Step 1:** You find the Key: The narrator's constant, subtle condescension (e.g., describing characters with loaded adjectives). One reader finds this brilliantly complex; the other finds it gratingly pretentious.
      *   **Result:** STOP. Tell writer: "Both reactions pinpoint the narrator's voice/tone. Revision depends on how challenging/alienating you *want* this voice to be."

  2.  **Case: Genre Manuscript - Praised for Idea, Criticized for Prose**
      *   **Step 1:** No Key found (disagreement seems global: "great concept" vs. "clunky writing").
      *   **Step 2:** Critic provides specific examples of clunky prose (awkward sentences p.4, confusing action sequence p.12). Praisers offer only "amazing world!" & "couldn't put down!". Track Record: The best global-reader praised it, but their *proven strength* is plot/ideas, *not* line-editing. The critic has a good track record on prose clarity.
      *   **Result:** Back the critic (strong local evidence + track record alignment on prose). Tell writer: "The specific prose issues identified on p.4/p.12 need addressing, even if the core idea is strong."

  3.  **Case: Disagreement on "Finished" (You personally think it *is* finished)**
      *   **Reader A (Scary-Good Editor):** "Structure is flawed, ending feels rushed, subplot X unresolved. Needs significant revision." (Provides page refs for pacing/rush).
      *   **Reader B (Prize-Winning Outlier):** "The raw energy and unconventional voice are perfect. Polishing it further would kill its power. It's done."
      *   **Step 1:** Potential Key: The rushed ending / unresolved subplot. Editor sees flaw; Outlier sees acceptable rawness.
      *   **Step 2:** Editor has strong local evidence (pacing/rush). Outlier has global praise ("energy/voice"). Editor's track record: Strong on *structure*. Outlier's track record: Strong on *voice/originality*. **Tie.**
      *   **Step 3:** Is it Borrowed Standards? Editor judging a raw, voice-driven piece by tight-structure standards? Possibly, BUT the writer *did* present it as a complete novel expecting structural critique. Outlier judging it by innovation standards, which *is* aligned. **Not clearly borrowed - Legitimate difference in values (Polish vs. Raw Power).**
      *   **Result: Undecidable.** Tell writer: "This is a values choice about polish vs. rawness. The Editor highlights structural points to fix if you want tighter convention; the Outlier champions the voice's power as-is. Which goal matters more *for this book*?" **PROCEDURE OVERRULES YOU:** It didn't back your "finished" view; it declared the core disagreement undecidable.

  ---

  ### What This Procedure Cannot Do
  1.  **Resolve fundamental differences in literary taste or values.** It identifies them as "Undecidable."
  2.  **Compensate for consistently poor feedback.** It relies on readers *sometimes* providing evidence or having track records.
  3.  **Fix toxic group dynamics.** If a reader quits over a verdict delivered respectfully via this process, the issue is deeper than the procedure.
  4.  **Guarantee the "right" revision path.** It identifies the *most defensible feedback to act on* or clarifies the writer's necessary choice.
  5.  **Work without your knowledge of the readers' track records.** You need that data point for Step 2.
