prompt: |-
  I've been lurking on rationalist blogs since the Sequences were still going up, and I still don't have a rule for the thing I actually do most at work. Hoping someone here does.

  I'm the only quant on a four-person team at a specialty insurer. We price weird, thin risks — political risk in a single country, cyber for one narrow industry, satellite launch, a couple of kidnap-and-ransom books. Most of the time there is no data: either nothing has happened yet, or we have three observations and none of them are events. Twice a month I have to put a number — a probability, a rate, a severity distribution — into a model that produces a price, and the price gets filed. If I'm off by 3x we lose the account or we eat a loss. I've got maybe half a day per number, teammates who can drive a spreadsheet but don't know what a conjugate prior is, and everything goes past a chief actuary who trained in the nineties, thinks "prior" means "what we assumed last year," will sign anything that arrives with a documented rule attached, and will bounce anything that says judgment call.

  The rule I need is for choosing a default prior when we genuinely have nothing, and I need it to survive Bertrand's paradox rather than just gesture at it. You know the setup: an equilateral triangle inscribed in a circle, a chord chosen at random, how often is it longer than a side of the triangle — and depending on how you spell out "random," three applications of the principle of indifference give you 1/3 (two random points on the circumference), 1/2 (random point on a fixed radius, chord perpendicular to it), or 1/4 (random midpoint anywhere in the disk). I've read the Jaynes maximum-ignorance argument secondhand and I take the point that the paradox is really about an ill-posed question, but "go find the actual generator of the randomness" is not advice I can use at 4pm on a Thursday when the quantity is "share of claims in this class that exceed $5m."

  So: write me a procedure my team can actually run, in order, in under two hours, on a new quantity. Specifically:

  - the questions to ask about the quantity, in the order to ask them, and what counts as a sufficient answer to each — where sufficient means checkable by someone who can't derive a posterior by hand.
  - a decision-sensitivity check near the front: if every candidate prior I could defensibly pick gives the same decision, the procedure should say stop and file a note rather than let us argue about priors.
  - an explicit invariance step: which symmetries the quantity ought to have (rescaling the units, regraining the time window, aggregating or disaggregating the exposure), a reparameterization test I can run in the spreadsheet, and a rule for what to do when the answer moves under reparameterization.
  - where the procedure hard-stops with "no number comes out of this" and we tell the underwriter we can't price it, as against where it hands the question to a human because the remaining question is about our risk appetite or our solvency rather than about the world.
  - an honest marking of the steps that are judgment calls wearing a lab coat.

  Run it on three cases. (1) The chord problem itself, twice: once exactly as stated with no generator given, and once where I tell you the chord is produced by a machine that picks a uniformly random point in the disk and draws the chord perpendicular to the radius through that point. I want to see it return "ill-posed" the first time and a number the second, and I want to know what it did differently. (2) A component that has flown 200 times with zero failures; I need a defensible 90% upper bound on the per-flight failure probability, and I want to see what the procedure does with the three priors that all look uninformative here and all give different bounds. (3) The one I actually care about, which I suspect your procedure is going to be useless on: probability that a named sovereign imposes capital controls within twelve months. No symmetry, no exchangeable sequence, nothing to be indifferent between.

  There's one homebrew move I've been using that I want you to adopt, kill, or show is a special case of your procedure. Instead of being indifferent over the parameter, I write down my uncertainty as the ten deciles of the outcome distribution and treat those as exchangeable — indifference over the quantile function rather than over some coordinate I picked to describe it. It feels like it sidesteps the parameterization problem, because I'm being indifferent over the thing the decision actually touches. My guess is that its either deep or complete bullshit, and if it's bullshit I want to know what it was doing that made it look like it worked.

  Finally, tell me plainly what the procedure cannot do, so I know which numbers to keep apologizing for.
reasoning: |-
  We are facing a problem of setting a prior under extreme uncertainty, with the constraint that we need a mechanical procedure that can be followed by non-experts and that must avoid the pitfalls of paradoxes like Bertrand's. The procedure must include:

  1. Questions to ask about the quantity, in order, with checkable answers.
  2. A decision-sensitivity check: if the decision (e.g., the price) is insensitive to the choice of prior, then stop and note that.
  3. An explicit invariance step: test for symmetries (like rescaling) and handle reparameterization.
  4. Clear stopping rules: when to say "no number" and when to hand off to human judgment.
  5. Marking of steps that are judgment calls.

  We are to run the procedure on three cases and evaluate a homebrew move (indifference over quantiles).

  I propose a procedure that draws from standard Bayesian practices, the principle of maximum entropy, and invariance principles, but with a focus on being operational.

  ### Proposed Procedure

  **Step 0: Define the Quantity and Its Role in the Model**
     - Ask: "What is the exact form of the quantity we are estimating? (e.g., probability, rate, severity distribution parameter)"
     - Ask: "How is this quantity used in the pricing model? (e.g., it is multiplied by X, it is the parameter of a Poisson distribution for claim counts, etc.)"
     - Ask: "What would be the consequences of overestimating or underestimating this quantity by a factor of 2? 10? (This helps in understanding the sensitivity and also sets the stage for the decision-sensitivity check.)"
     - *Checkable*: The answers should be in terms of the model's inputs and outputs, and the consequences should be described in terms of loss of account or losses. The team should document the answers.

  **Step 1: Decision-Sensitivity Check**
     - Ask: "What is the smallest change in this quantity that would change the price by more than 10%? (or by an amount that would cause us to lose the account or take a loss, if known)"
     - If the answer is "a change of at least X", then we set a range of possible values for the quantity that spans at least an order of magnitude around any plausible value (e.g., from 0.1X to 10X of a rough guess). Then, we run the pricing model for the minimum and maximum of this range. If the resulting prices are both acceptable (i.e., we would not lose the account and we would not take a loss) and the difference in price is less than the threshold that would cause a problem, then we stop and note: "The decision is insensitive to the prior for this quantity. We used [a specific value, e.g., the midpoint] and note that the price is robust." We then use a default value (like the midpoint of the range) and move on.
     - *Checkable*: The team can run the model at two points and compare the prices. They do not need to understand the prior.

  **Step 2: Identify Symmetries and Invariance**
     - Ask: "What are the natural units and scales for this quantity? (e.g., dollars, per year, dimensionless probability)"
     - Ask: "If we changed the units (e.g., from dollars to millions of dollars, or from per year to per month), how would the quantity transform? (e.g., it scales linearly, logarithmically, etc.)"
     - Ask: "Is there a natural symmetry? (e.g., the quantity is a rate and should be invariant under time rescaling; the quantity is a scale parameter and should be invariant under multiplication by a positive constant; the quantity is a location parameter and should be invariant under addition of a constant.)"
     - *Reparameterization test*: We consider two different parameterizations that are related by a smooth transformation. For example, if the quantity is a rate λ, we consider λ and θ = log(λ). We then consider a uniform prior on λ and a uniform prior on θ and see how the resulting posterior (or the induced distribution on the outcome) differs. But note: we don't have data, so we are only comparing the priors.
     - However, without data, we cannot form a posterior. Therefore, we focus on the prior predictive distribution for a minimal set of observables. Since we are in extreme uncertainty, we might have to rely on the principle of transformation groups (as Jaynes did) to choose a prior that is invariant under the symmetry.

     - *Rule for when the answer moves under reparameterization*: If the symmetry is clear (like scale invariance for a positive scale parameter), then we use the invariant prior (e.g., Jeffreys prior). If there is no clear symmetry, then we must note that the choice of prior is arbitrary and proceed with a default (like uniform or log-uniform) but then we must flag the arbitrariness and run a sensitivity analysis (see Step 4). If the symmetry is broken by the problem context, we use the symmetry to choose the prior and then adjust by any available information.

  **Step 3: Elicit Any Available Information (Even If Sparse)**
     - Ask: "What is the absolute minimum and maximum value this quantity could take? (e.g., a probability must be between 0 and 1; a rate must be positive and might have an upper bound from physical constraints.)"
     - Ask: "Is there any historical data, even from a different but similar context? (e.g., for a new country, data from a neighboring country; for a new industry, data from a related industry.)"
     - Ask: "Are there any theoretical constraints? (e.g., the quantity must be at least X because of [reason], or at most Y.)"
     - *Checkable*: The team must document the sources for the bounds and any data.

  **Step 4: Choose a Default Prior and Run Sensitivity Analysis**
     - If Step 1 did not stop the procedure (i.e., the decision is sensitive to the prior), then we proceed to choose a prior.
     - We consider the following candidate priors based on the symmetries identified in Step 2:
          - If the quantity is a probability: use a Beta(1,1) (uniform) or Beta(0.5,0.5) (Jeffreys for binomial) or Beta(1, k) for a known odds ratio? But without data, we need to be careful. We might use a Beta(1,1) as a default.
          - If the quantity is a rate (with no upper bound): use an improper Gamma(0,0) (which is like 1/λ) or a Gamma(1, very small) but these are improper. Alternatively, we might use a log-normal with a very wide variance? But we want a rule.
          - If the quantity is a scale parameter (positive and multiplicative): use a prior proportional to 1/λ (which is the Jeffreys prior for the scale parameter of an exponential distribution, and also the invariant prior under scale transformations).
          - If the quantity is a location parameter: use a uniform prior.
          - If we have identified a symmetry group, we use the invariant measure under that group as the prior.
     - If there is no symmetry, we use a uniform prior on a bounded interval (from Step 3) or a log-uniform (i.e., uniform on the log scale) for positive quantities without a natural upper bound.

     - *Sensitivity analysis*: We compute the quantity of interest (e.g., the posterior mean, or the premium) using at least two different defensible priors (e.g., uniform and log-uniform) and see how much the result changes. If the change is less than the threshold from Step 1, then we choose one (say the first) and note the robustness. If the change is large, we must either:
          - Choose the prior that is most conservative (i.e., leading to a higher premium if we are worried about underestimating risk) and document that, or
          - If the problem is too sensitive and we cannot justify one prior over another, then we stop and say: "We cannot produce a number without additional data or expert judgment because the result is too sensitive to the choice of prior."

  **Step 5: Human Judgment and Solvency Considerations**
     - Ask: "Is there a regulatory or solvency constraint that overrides the statistical estimate? (e.g., we must hold capital for at least a 1-in-200 year event, so we cannot use a prior that ignores that.)"
     - Ask: "What is our risk appetite? (e.g., we are willing to lose this account if the price is too high, but we absolutely cannot take a loss above Z.)"
     - If the prior leads to a premium that violates these constraints, we adjust the prior (or the resulting premium) to meet the constraint and document the adjustment as a business decision.

  **Step 6: Documentation and Review**
     - Document each step, the answers, the chosen prior, and the sensitivity analysis.
     - The chief actuary gets a document that includes: the quantity, the range considered, the chosen prior, the resulting premium, and a note on sensitivity and any adjustments.

  ### Marking Judgment Calls
     - Step 0: Defining the quantity and its role is a judgment call, but one that must be grounded in the model.
     - Step 1: Setting the range for the sensitivity check is a judgment call (but we can use the min and max from Step 3).
     - Step 2: Identifying symmetries is a judgment call (but we provide guidelines: if it's a scale, use scale invariance; if it's a count, use Poisson and thus Gamma prior for rate, etc.).
     - Step 3: Setting bounds is a judgment call.
     - Step 4: Choosing the set of candidate priors and the criterion for conservatism is a judgment call.
     - Step 5: Adjusting for risk appetite is a judgment call.

  ### Homebrew Move: Indifference over Quantiles
     - The idea: Instead of setting a prior on the parameter, we set a prior on the quantiles of the outcome distribution. For example, we specify the 10th, 20th, ..., 90th percentiles and treat them as exchangeable. This is equivalent to setting a uniform prior on the quantile function.
     - This move is attempting to be invariant to reparameterization because the quantile function is a property of the distribution, not the parameter. However, it is not clear that it is always well-defined. For example, if the outcome is continuous, we can define the quantile function, but if the outcome is discrete, we have to be careful.
     - In the absence of data, this method requires specifying a set of quantiles and then using a uniform distribution over the space of quantile functions that satisfy constraints (like being non-decreasing). This is computationally difficult and is not standard.
     - Moreover, it does not entirely avoid the parameterization problem because the quantile function itself is defined relative to the outcome space. For example, if we are estimating a loss severity, we might be indifferent between the quantiles of the loss in dollars or in log-dollars? That would lead to different priors.
     - Therefore, I think this move is not a general solution. However, it can be seen as a special case of the principle of maximum entropy: if we only know the bounds and nothing else, then the maximum entropy distribution is uniform on the bounded interval, which corresponds to a uniform prior on the outcome. But if we have more constraints (like the mean), then maximum entropy would give a different distribution.

     - In our procedure, if the quantity is the entire outcome distribution (like a severity distribution), then we might use a Dirichlet process or a uniform prior on the cumulative distribution function (which is equivalent to the quantile function approach). But this is complex and hard for non-experts. Instead, we often use a parametric family and then put a prior on the parameters. The homebrew move is then a nonparametric approach but is not practical for a two-hour exercise.

     - My verdict: Kill it for the purpose of this procedure. We will use parametric families and put priors on the parameters using the symmetries.

  ### What the Procedure Cannot Do
     - It cannot invent data where there is none.
     - It cannot resolve fundamental ambiguities (like Bertrand's paradox) without additional structure (like symmetry).
     - It cannot produce reliable estimates when the quantity is highly sensitive to the prior and there is no data and no symmetry.
     - It cannot replace expert judgment when the risks are truly novel and without any analogy.

