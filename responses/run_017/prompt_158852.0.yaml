  ### Procedure for Setting Default Priors Under Extreme Uncertainty

  Below is a step-by-step procedure for your team. It prioritizes operational simplicity, avoids Bertrand-style paradoxes via explicit symmetry checks, and includes decision-sensitivity gates. Judgment calls are marked with **(JC)**.

  ---

  #### **Step 0: Define the Quantity and Decision Threshold**  
  **Questions to ask:**  
  1. "What is the mathematical form of the quantity? (probability, rate, scale parameter, etc.)"  
  2. "How is this quantity used in the pricing model? (e.g., input to loss distribution, multiplier for exposure)"  
  3. "What is the decision threshold? (e.g., 'If our estimate is off by >2x, we lose money or the account')"  

  **Sufficient answers:**  
  - Quantity form documented (e.g., "failure probability," "loss scale parameter").  
  - Pricing model step identified (e.g., "used in Poisson frequency formula").  
  - Threshold quantified (e.g., ">3x error unacceptable").  

  **Output:**  
  - A range `[L, U]` for the quantity where `L = min plausible value`, `U = max plausible value` (e.g., for probability, `L=1e-6`, `U=0.5`). Use expert input or physical constraints. **(JC)**  

  ---

  #### **Step 1: Decision-Sensitivity Check**  
  **Procedure:**  
  - Compute the price at `L` and `U` using the pricing model.  
  - If `|Price(L) - Price(U)| < decision threshold`:  
    - **Stop.** Use midpoint `(L+U)/2` or log-middle for scale parameters. File note: "Decision insensitive to prior; range [L, U]."  
  - Else: Proceed to Step 2.  

  **Checkable by non-experts:**  
  - Teammates run pricing model at `L` and `U` and compare outputs. No stats required.  

  ---

  #### **Step 2: Symmetry and Reparameterization Test**  
  **Questions to ask:**  
  1. "What transformations leave the problem unchanged? (e.g., rescaling dollars to millions, per-year to per-month)"  
  2. "Is the quantity invariant under aggregation? (e.g., if we combine two risks, does the parameter add/multiply?)"  

  **Reparameterization test:**  
  - Define two parameterizations:  
    - `θ` (e.g., failure probability).  
    - `ϕ = f(θ)` (e.g., `log(θ)`, `θ^2`, `1/θ`).  
  - Compute default priors for both:  
    - `θ`: Uniform in `[L, U]` OR log-uniform if multiplicative.  
    - `ϕ`: Uniform in `[f(L), f(U)]`.  
  - Compute implied outcome (e.g., expected loss) for both priors.  
  - If `|Outcome(θ) - Outcome(ϕ)| < decision threshold`:  
    - **Proceed.** Use `θ`-parameterization.  
  - Else:  
    - **Flag:** "Reparameterization changes decision. No unique symmetry."  
    - Proceed to Step 3 with sensitivity analysis.  

  **Output:**  
  - Chosen parameterization and symmetry justification (e.g., "scale parameter → log-uniform prior").  

  ---

  #### **Step 3: Elicit Sparse Information & Choose Prior**  
  **Questions to ask:**  
  1. "What is the most conservative value? (e.g., max defensible loss)"  
  2. "Is there a known physical constraint? (e.g., 'probability < 0.3 due to regulations')"  
  3. "Any analogous data? (e.g., 'similar country's capital control probability')"  

  **Default prior rules:**  
  - **Probability:** Beta(1,1) (uniform) OR Beta(0.5,0.5) (Jeffreys) if binary outcome.  
  - **Rate (λ):** Gamma(1, k) with `k` large (e.g., `k=1e6`) for near-improper prior.  
  - **Scale parameter:** `1/θ` prior (Jeffreys for scale).  
  - **No natural symmetry:** Log-uniform for positive quantities.  

  **Sensitivity analysis:**  
  - Compute outcomes for 2–3 defensible priors (e.g., uniform, log-uniform, conservative).  
  - If outcomes differ by < decision threshold: Use simplest prior.  
  - Else: Use most conservative prior (e.g., highest premium) and document. **(JC)**  

  ---

  #### **Step 4: Hard Stop or Human Judgment**  
  **Hard stop ("no number") if:**  
  - Reparameterization test fails **and** sensitivity analysis shows outcome variance > decision threshold.  
  - No symmetry, no data, and no plausible bounds (e.g., sovereign risk with no analogs).  

  **Hand off to humans if:**  
  - Symmetry exists but risk appetite/solvency dominates (e.g., "Even if p=1e-9, we can't absorb the loss").  

  **Output:**  
  - Number with documentation OR "No defensible prior; cannot price."  

  ---

  ### **Evaluation of Homebrew Move (Quantile Indifference)**  
  - **Verdict: Kill it.**  
  - **Why:**  
    - Quantile indifference assumes exchangeability of quantiles, which is invalid for heavy-tailed distributions (e.g., finance).  
    - It only *shifts* the parameterization problem to the outcome space (e.g., indifference over dollars vs. log-dollars gives different priors).  
    - In practice, it often reduces to a uniform prior on a transformed parameter, which Step 2 already handles.  
  - **Special case:** Only valid if the outcome space has a natural symmetry (e.g., circular quantities like angles), which is rare.  

  ---

  ### **Case Studies**  
  #### **Case 1: Bertrand's Paradox**  
  **a) No generator given:**  
  - Step 0: Quantity = P(chord > side). Decision threshold = 0.1 (absolute difference).  
  - Step 1: [L, U] = [0,1]. Price(0.25) vs. Price(0.5) differ by 0.25 → exceeds threshold.  
  - Step 2:  
    - Parameterizations: (1) θ = arc length → uniform, (2) ϕ = radius distance → uniform, (3) ψ = midpoint area → uniform.  
    - Outcomes: P(θ) = 1/3, P(ϕ) = 1/2, P(ψ) = 1/4 → max difference 0.25 > 0.1.  
    - **Stop:** "Ill-posed; no unique symmetry."  
  **b) Generator specified (uniform midpoint in disk):**  
  - Step 0: Same as above.  
  - Step 2: Generator implies rotational symmetry → natural parameterization is radial distance (ϕ).  
  - Reparameterization test not needed (generator defines symmetry).  
  - Use uniform prior on radius → P = 1/4.  
  - **Output:** 0.25.  

  #### **Case 2: Satellite Component (200 flights, 0 failures)**  
  **Goal:** 90% upper bound on failure probability *p*.  
  - Step 0: *p* = failure probability. Decision threshold = 2x premium change.  
  - Step 1: [L, U] = [1e-6, 0.1]. Premium(U)/Premium(L) = 100,000x → sensitive.  
  - Step 2:  
    - *p* is a probability → Jeffreys (Beta(0.5,0.5)) is standard for binomial.  
    - Reparameterization test:  
      - θ = *p* (uniform): 90% bound = `BETA.INV(0.9, 1, 201) ≈ 0.0114`.  
      - ϕ = log(*p*) (log-uniform): 90% bound = `exp(BETA.INV(0.9, 1, 201)) ≈ 0.0102` (using transformed Beta).  
      - Ratio = 0.0114/0.0102 ≈ 1.12 < 2x → insignificant.  
  - Step 3: Use Jeffreys prior (Beta(0.5,0.5)). Posterior = Beta(0.5, 200.5).  
  - **Output:** 90% bound = `BETA.INV(0.9, 0.5, 200.5) ≈ 0.0147`.  

  #### **Case 3: Sovereign Capital Controls (12-month probability)**  
  - Step 0: *p* = probability. Decision threshold = 2x premium.  
  - Step 1: [L, U] = [1e-3, 0.3] (e.g., "never seen" to "crisis-level"). Premium(U)/Premium(L) = 300x → sensitive.  
  - Step 2:  
    - No symmetry (no natural scaling/aggregation).  
    - Reparameterization test:  
      - θ = *p* (uniform): E[*p*] = 0.15.  
      - ϕ = log-odds(*p*) (uniform): E[*p*] = 0.5 (logistic prior).  
      - Premium ratio = 0.5/0.15 > 3x → exceeds threshold.  
  - Step 4: **Hard stop.** "No symmetry, no data, reparameterization changes decision >3x. Cannot price."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Create knowledge from nothing.** If no symmetry, no data, and no bounds (e.g., truly novel risks), it will fail.  
  2. **Handle non-stationary processes.** E.g., sovereign risk with regime shifts.  
  3. **Replace expert judgment for tail risks.** Solvency-driven decisions (e.g., "We must charge X to survive") override priors.  
  4. **Resolve deep ambiguities quickly.** Bertrand-like cases require >2 hours if symmetry isn't obvious.  

  ### **Judgment Call Summary**  
  - **Step 0:** Setting `[L, U]` based on sparse info.  
  - **Step 2:** Choosing which symmetries to test.  
  - **Step 3:** Selecting "defensible" priors for sensitivity analysis.  
  - **Step 4:** Deciding "conservative" vs. "can't price."  

  ### **Final Output**  
  Your team now has a checklist:  
  1. Bound the quantity and test decision sensitivity.  
  2. Check symmetries and reparameterization invariance.  
  3. Use default priors + sensitivity analysis.  
  4. Stop early or hand off if stuck.  
  5. Document every step—especially judgment calls.  

  This won't solve every problem (sovereign risk still hurts), but it bakes rigor into the process and avoids the worst paradoxes.
