prompt: |-
  For about a dozen years I have made my living subtitling films, which means watching the same three or four minutes of a scene anywhere from thirty to a hundred times, and for the last six of those years I have also helped run a discussion night at a public library where we screen a film and talk for an hour afterwards. So I have more exposure than most people both to the wearing-off and to the stubborn not-wearing-off of emotional responses to fiction, and I have started to notice a pattern I cannot name. It is not the puzzle I have seen raised about why anyone gets upset at characters they know do not exist; I have read a little about that, and it is not my question. I have no difficulty being moved by something I know to be invented, and I do not find it puzzling. What interests me is the opposite-looking case: a response that dies and cannot be brought back, even though none of my beliefs about the work seem to have changed in a way that should matter. First case: a few years ago we screened what we had announced as a documentary about a fishing town that had lost its fleet — plainly shot, no score, people talking to camera about their fathers. Half the room was visibly shaken. After the discussion, someone who knew the director mentioned that the film was staged: the crew were actors, the interviews were written, though drawn from real testimony and checked with the people who had given it. The room went cold and several people said they felt had. We showed it again a month later, honestly relabeled and with the staging explained in advance. The print was identical; everyone knew exactly what they were watching; and the response was markedly thinner. What struck me is that it did not come back even when I explained that the staging had been done at the request of the community itself, that they had wanted their story told that way and had seen and approved the script, and that nothing had been concealed from them. People accepted all of that, agreed that no one had been wronged, and still said, in so many words, that they knew it was fine but could not feel it the same way.

  The second case is from my own work. There is a scene — a father saying goodbye to his daughter at a station, nothing more — that I found genuinely hard to sit through for the first several dozen passes. Then I read an interview in which the director explained how it was built: the child's line had been fed to her off-camera, she did not know what it referred to, and the reaction everyone reads as heartbreak was filmed before the actor was told what the scene was about. I have thought about that interview for years now, and I still think the procedure is entirely legitimate; I admire the same technique in a dozen other films and have argued with people who call it cheating. None of that has helped. The response is gone, and it stays gone, and the odd thing is that on the very same viewings the suspense still works, the flinch still works, the scene still holds me — so this is not numbness or boredom or having worn it out, and it is not that I have come to believe something false about the world, since I never believed the events happened. A friend I described this to said it sounded like the intentional fallacy, which did not seem right to me, because nothing about what the scene means or how I would describe it has changed; only my ability to feel it has. What I think I am looking at has five features: the feeling was real and not pretended; it never rested on a belief that the events occurred; a change in what I believe about the work's provenance or construction destroys it; withdrawing that belief does not restore it; and the thinner state does not present itself to me as a defect — it presents itself as more accurate, and the earlier response now seems slightly embarrassing, like something that happened to me rather than something I did. I am also unsure whether my two cases are the same phenomenon, since one involves a breach of trust about what kind of object I was being handed and the other involves only finding out how the effect was made; and I cannot tell whether a memoir exposed as fabricated, or a card trick once you know the method, belongs to this pattern or to something else entirely.

  So: does this have a name? I want to be clear that a label is the least of it, and that I would rather have the carving than the word. Please do not give me a reading list or citations — I am writing this in a library with no database access and could not follow them up anyway, so if names of views or authors are unavoidable, describe them rather than pointing me at them. What I would like is: whether this is one thing or two; what the nearest established concepts are and precisely how my case differs from each of them, including the standard accounts of emotional response to fiction and any notion of an emotion that fails to track what the subject believes; which of them, if any, actually fits; whether the metaphor of hysteresis — a system that does not return to its earlier state when the cause is removed — is a helpful borrowing here or a misleading one; and, if nothing established covers it, a term you would propose, a definition tight enough to separate it from the neighbouring cases, and a couple of boundary cases that decide what does and does not count. Finally, if it can be said without sending me to a bibliography: is a pattern like this evidence for or against any of the standard stories about what these fictional emotions are?
reasoning: |-
  Okay, the user has a fascinating query about emotional responses to fiction that fade and don't return even when beliefs haven't changed. They've observed this both in their subtitling work and during film screenings. Let me unpack this step by step.

  First, the user describes two scenarios: one where a documentary turned out to be staged, causing emotional detachment even after full disclosure; another where learning about a filmmaking technique killed their emotional response to a scene. The core paradox is that cognitive awareness (knowing it's constructed) permanently alters emotional engagement, without changing interpretation or causing disbelief in fiction's power.

  The user wants several things analyzed: whether this is one or two phenomena, how it differs from existing concepts like the intentional fallacy or suspension of disbelief, and whether hysteresis is a good metaphor. They also want terminology suggestions if no existing term fits.

  Hmm... The key distinctions here are: 1) Unlike standard fiction responses, the emotion here depended on perceived authenticity/provenance; 2) When that perception breaks, there's irreversible collapse; 3) The new state feels "correct" retroactively. This doesn't match emotional numbing or changed interpretations. 

  The documentary case involves breach of trust - it's about categorical misrepresentation. The technique revelation is about demystification. But both share that irreversible emotional shift upon learning the "backstage" truth. 

  I recall affective science concepts: "belief-dependent emotions" usually track current beliefs, but here the emotion dies despite unchanged beliefs about fiction. The hysteresis metaphor works surprisingly well - like metal staying magnetized after the field is removed. 

  For terminology, maybe "constructive disillusionment"? Emphasizes how revealing construction causes irreversible emotional dissolution. Boundary cases: A fabricated memoir would fit if emotions vanish permanently; a card trick's magic loss is different because it's about wonder rather than empathy.

  This pattern challenges theories claiming emotional responses to fiction are fully belief-independent. It shows provenance matters more than we admit - not for meaning, but for emotional access. The irreversible aspect suggests some emotional engagements are cognitively "brittle" in specific ways.

  The user's deep experience with repetition makes their observation particularly valuable - they've controlled for desensitization. Their framing of the vanished emotion feeling "accurate" is crucial; it's not regret but recalibration.
answer: |-
  This phenomenon you're describing is both recognizable and under-theorized. It doesn't fit neatly into standard accounts of emotional response to fiction, nor is it captured by common fallacies. Let's carve it:

  1.  **One Phenomenon, Two Manifestations:** Your two cases share a core mechanism: **the irreversible collapse of an affective scaffold built on perceived authenticity or unmediated access.** While the *trigger* differs (breach of trust vs. revelation of technique), the *effect* is the same: a specific emotional resonance dependent on a tacit belief about the *origin* or *immediacy* of the stimulus evaporates and cannot be reinstated, even when the intellectual framework is restored.
      *   **Documentary Case:** The scaffold was "this is direct testimony, unmediated re-enactment." The breach revealed it *was* mediated (actors). The scaffold collapsed. Restoring trust in *why* it was mediated (community request) couldn't rebuild the scaffold demanding *direct* witnessing.
      *   **Technique Case:** The scaffold was "this emotional authenticity emerges directly from the actor's understanding *within* the moment." The revelation showed it emerged *despite* (or orthogonal to) the actor's immediate understanding – the effect was constructed from the outside. The scaffold ("immediate actor-derived authenticity") collapsed. Intellectual justification of the technique can't rebuild *that specific* affective connection.

  2.  **Established Concepts & Differences:**
      *   **Suspension of Disbelief:** This is about *intentionally* setting aside knowledge of fiction to engage. Your cases involve an *involuntary* collapse triggered by new information, *after* suspension was already successfully operating. The knowledge of fiction existed beforehand; the new knowledge is about *how the effect was achieved*, not *that* it's fiction.
      *   **Intentional Fallacy:** This argues meaning resides in the work, not authorial intent. Your problem isn't about *meaning* changing. The scene's *meaning* (father's sorrowful goodbye) remains unchanged. The *feeling* elicited by that meaning, dependent on assumptions about its *genesis*, has vanished. It's an *affective*, not an interpretive, shift.
      *   **Emotional Responses to Fiction (Standard Accounts - "Thought Theory" & "Illusion Theory"):** These generally hold that emotions are triggered by *thoughts* about the fictional scenario (thought theory) or a temporary feeling *as if* it's real (illusion theory). Your cases challenge both:
          *   The *thoughts* about the scenario (father losing daughter) haven't changed.
          *   The *illusion* of reality wasn't necessary initially (you knew it was fiction) and isn't destroyed later (suspense still works!).
          *   The trigger is specific information about *production*, not the fictional content itself. The emotion wasn't tracking the belief "this happened," but a more nuanced belief like "this emotional display originates directly from the depicted situation within the performer's consciousness during filming."
      *   **"Cheated" Feeling (e.g., manipulated endings):** This usually involves feeling the *narrative* was unfair or illogical, changing interpretation. Here, the *narrative* is unchanged. The feeling is that the *emotional effect itself* was achieved via a method perceived (rightly or wrongly) as undermining the assumed basis for its authenticity.
      *   **Demystification/Aesthetic Disenchantment:** These are broad terms for losing magic upon seeing the mechanics. Your case is a specific, irreversible *subset*: where the enchantment relied *critically* on a specific, now-shattered illusion about *provenance/process*, and where intellectual acceptance of the process cannot rebuild the affective link.

  3.  **The Best Fit:** The phenomenon is closest to a **specific, brittle form of affective scaffolding dependent on tacit beliefs about artistic provenance or process authenticity.** When that scaffolding collapses due to contradictory information, the affective response it supported vanishes permanently, even if the intellectual justification for the process is accepted. It highlights that some emotional responses to art depend not just on *what* is represented, but on our (often unconscious) beliefs about *how* and *from where* the representation emerged.

  4.  **Hysteresis - A Helpful Metaphor?** Yes, **hysteresis is a remarkably apt metaphor.** In physics/material science, hysteresis describes a system that doesn't return to its original state when the driving force is removed (e.g., magnetism remaining after the magnetic field is gone, or deformation persisting after stress is removed). Here:
      *   **Original State:** Strong emotional response supported by tacit belief in a specific authenticity/provenance (Field ON).
      *   **Trigger:** Revelation destroys that tacit belief (Field OFF).
      *   **New State:** Emotional response collapses (Magnetization DROPS).
      *   **Attempted Reset:** Intellectual acceptance restores justification for the process (Field ON again).
      *   **Result:** Emotional response *does not* return to original strength (Magnetization remains LOW). The affective system retains a "memory" of the collapse and resets to a different baseline. The metaphor captures the irreversibility and path-dependence perfectly. It's not misleading; it illuminates the core dynamic.

  5.  **A Proposed Term & Definition:**
      *   **Term:** **Affective Provenance Collapse (APC)**
      *   **Definition:** *The irreversible diminishment or loss of a specific emotional response to an artwork, triggered solely by information revealing the actual process or provenance contradicts a tacit belief necessary for sustaining that affect, despite the subject's unchanged intellectual understanding and appreciation of the work's meaning, legitimacy, and fictional nature, and where the diminished state is perceived retrospectively as more accurate.*
      *   **Key Boundaries:**
          *   **In Scope (APC):** Documentary revealed as staged (emotional rawness lost); actor technique revealed (specific pathos lost); memoir exposed as fabricated *if* the emotional response relied on belief in direct, unmediated testimony (even if labeled memoir, not autobiography); authentic-looking historical re-enactment revealed as shot on a soundstage with actors *if* the assumed "you are there" immediacy was key to the affect.
          *   **Out of Scope (Not APC):**
              *   Emotional numbing from over-exposure (you ruled this out).
              *   Loss of respect/anger due to ethical breaches (e.g., exploitative documentary) - this changes the *evaluation*.
              *   Card trick method revealed - this destroys wonder/surprise, which *is* directly tied to belief in impossibility; it's core to the effect, not a tacit scaffold for another emotion. Magic relies on the illusion of reality in a way fiction doesn't.
              *   Learning an author's offensive biography changes interpretation/feeling *about the meaning* of the work itself.
              *   Simply deciding a scene is melodramatic or poorly acted – this is an aesthetic judgment, not a collapse triggered by provenance revelation.

  6.  **Evidence for Standard Stories?**
      APC presents a significant challenge, particularly to simplistic versions of "thought theory":
      *   **Against Strong "Thought Theory":** If emotions arise *only* from thoughts about the fictional content, why does information about the *real-world production* (which doesn't change the fictional content thoughts) so specifically and permanently destroy *some* emotions but not others (suspense, flinch remain)? APC suggests certain affects require *additional*, often unconscious, *meta-beliefs* about the *source* or *authenticity of the representation* itself.
      *   **For a Nuanced "Two-Level" View:** APC supports views that emotional responses involve layered processes: engagement with the *fiction* (largely belief-independent) *plus* engagement with the *artefact* and its making (which *can* be belief-dependent). The "tacit belief" shattered in APC resides at this artefact/production level. Your persistent suspense/flinch operates at the fiction level; the lost pathos relied on an artefact-level belief about performance authenticity.
      *   **Highlights the Role of "Immediacy":** APC underscores that the *feeling* of unmediated access, of witnessing something "raw" or "directly emergent," even within acknowledged fiction, is a potent affective driver that, when exposed as constructed *in a way that contradicts the assumed immediacy*, causes a unique and irreversible collapse. Standard theories often overlook this dimension of affective engagement.

  In essence, **Affective Provenance Collapse** reveals a hidden fragility in our emotional connection to art: some responses depend not just on the story told, but on an unspoken, often unrecognized, belief about *how the telling itself came to be*. Shattering that belief doesn't change the story, but it permanently alters the emotional landscape, leaving behind a colder, seemingly more "accurate" terrain where the original feeling now feels like a naive, almost embarrassing, misinterpretation of the artefact itself. The hysteresis metaphor perfectly captures this path-dependent irreversibility.
