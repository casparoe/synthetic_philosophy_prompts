  **Debrief:**
  - In the first activity, you encountered a row that no pure row dominated, but a mixture did. This is called a dominated by a mixed strategy. 
  - In the second activity, you saw that after eliminating a column, then you could eliminate a row that was not dominated before. This is iterated elimination. 
  - The procedure you used is iterated elimination of strictly dominated strategies (mixed allowed). 
  - In the third activity, you saw that sometimes a strategy can survive iterated elimination but not be played in any equilibrium. This shows that the procedure is a lower bound (actually an upper bound on the set of strategies that might be played) but not necessarily the equilibrium set.

