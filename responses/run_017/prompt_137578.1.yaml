  ### Game Theory Session Design: Iterated Dominance and Nash Equilibrium

  **Session Goal:** Students discover three key concepts through guided activities, with definitions introduced only in the final 15 minutes.  
  **Constraints:** 24 students, 90 minutes, no software/money. Physical randomization (token bags) used for mixtures.  
  **Prior Knowledge:** Normal-form matrices, 2x2 mixed Nash, strict dominance by pure strategies.  
  **New Concepts:**  
  1. Strict dominance by mixed strategies.  
  2. Iterated elimination order-independence and opponent-action shrinkage.  
  3. Surviving strictly dominant strategies with zero Nash probability.  

  ---

  ### 1. Strict Dominance by a Mixed Strategy  
  **Objective:** Students discover an action dominated only by a mixture, not by any pure action.  
  **Game (Row vs. Column Player):**  

  |          | Col L | Col R |
  |----------|-------|-------|
  | **Row T**| 5, -  | 0, -  |
  | **Row M**| 0, -  | 5, -  |
  | **Row B**| 1, -  | 1, -  |

  *Column payoffs irrelevant (set to 0). Row payoffs shown.*  
  **Why it works:**  
  - **B vs. T:** T wins against L (5>1) but loses against R (0<1).  
  - **B vs. M:** M loses against L (0<1) but wins against R (5>1).  
  - **B is not dominated by any pure strategy.**  

  **Activity:**  
  - **Groups of 3:** 1 Row, 1 Column, 1 Referee.  
  - **Task:** "Eliminate a strictly dominated row. If none, try mixtures."  
  - **Randomization Mechanic:**  
    - Referee has a bag with 2 red (T) and 2 blue (M) tokens.  
    - Draws one token to determine Row's action (T or M).  
    - **Verification Rule:** Test mixture against *each* Column action separately:  
      - Against L: Expected payoff = (5 + 0 + 5 + 0)/4 = 2.5 > 1 (B’s payoff).  
      - Against R: Expected payoff = (0 + 5 + 0 + 5)/4 = 2.5 > 1 (B’s payoff).  
  - **Outcome:** B is eliminated. Mixture (50% T, 50% M) dominates B.  

  **Key Insight:** Mixture must beat B for *every* opponent action, not on average.  

  ---

  ### 2. Iterated Elimination with Order Independence  
  **Objective:** Students see that after one pass, nothing is dominated, but after opponent-action shrinkage, more can be eliminated.  
  **Game (Row vs. Column Player):**  

  |          | Col X | Col Y | Col Z |
  |----------|-------|-------|-------|
  | **Row A**| 4, 1  | 0, 0  | 0, 1  |
  | **Row B**| 0, 0  | 4, 1  | 0, 1  |
  | **Row C**| 0, 5  | 0, 5  | 3, 3  |

  **Phase 1: Eliminate a Column**  
  - **Column Z is dominated by a 50-50 mixture of X and Y:**  
    - **Verification (Column payoffs):**  
      - Against A: (1 + 0)/2 = 0.5 > 1? **No!** Wait, *domination must use strict inequality*.  
      - **Correction:** Use 60% X, 40% Y:  
        - Against A: 0.6×1 + 0.4×0 = 0.6 > 0.1 (adjust Z’s payoff to 0.1 for strict dominance).  
      - **Revised Payoffs for Z (to ensure strict dominance):**  
        - (A, Z): 0.1, (B, Z): 0.1, (C, Z): 2.9.  
    - **Verified with 50-50 mixture:**  
      - Against A: (1 + 0)/2 = 0.5 > 0.1  
      - Against B: (0 + 1)/2 = 0.5 > 0.1  
      - Against C: (5 + 5)/2 = 5 > 2.9  
  - **Outcome:** Eliminate Z. Reduced game:  

  |          | Col X | Col Y |
  |----------|-------|-------|
  | **Row A**| 4, 1  | 0, 0  |
  | **Row B**| 0, 0  | 4, 1  |
  | **Row C**| 0, 5  | 0, 5  |

  **Phase 2: Eliminate a Row**  
  - **Row C is dominated by a 50-50 mixture of A and B:**  
    - Against X: (4 + 0)/2 = 2 > 0  
    - Against Y: (0 + 4)/2 = 2 > 0  
  - **Outcome:** Eliminate C.  

  **Order Independence & Nuance:**  
  - **Order-Independent Result:** Final surviving set {A, B} for Row, {X, Y} for Column (verify: no further domination).  
  - **What if a group eliminates Row C first?**  
    - Initial game: No row dominates C (against Z, C gets 3 > 0 from A/B).  
    - **Arithmetic Slip:** If a group claims C is dominated early, check their mixture math.  
    - **Lesson:** Deleting an opponent’s action (Z) *removes a contingency*, making it easier to dominate C. Deleting your own action (A/B) *removes a dominator ingredient*, making domination harder.  
  - **Weak Dominance (if time):** Use a game where weak dominance allows order-dependence (e.g., payoff ties). Explain: "Weak dominance can change results based on order; strict cannot."  

  ---

  ### 3. Survival in Iterated Dominance but Zero Nash Probability  
  **Objective:** Show an action surviving iterated strict dominance but played in *no* Nash equilibrium.  
  **Why 3 Players?** Impossible in 2-player games (surviving strategies are in *some* Nash support). Third player breaks correlation.  

  **Game (3 Players: Row, Column, Matrix)**  
  - **Actions:** All choose {A, B}.  
  - **Payoffs:**  
    - **Row:** Always 0.  
    - **Column:** 1 if (Row=A and Matrix=A) OR (Row=B and Matrix=B); else 0.  
    - **Matrix:** 1 if (Row=A and Column=A) OR (Row=B and Column=B); else 0.  

  **Iterated Strict Dominance:**  
  - **No dominated strategies:**  
    - Row is indifferent (always 0).  
    - Column: If Row plays A, Column prefers A (if Matrix=A, 1; else 0). No domination.  
    - Matrix: Analogous to Column.  
  - **All actions survive iterated elimination.**  

  **Nash Equilibrium Analysis:**  
  - **Only equilibria:** (A, A, A) and (B, B, B).  
    - **(A, A, A):** Col=1 (Row=A, Matrix=A), Matrix=1 (Row=A, Col=A). No deviation incentive.  
    - **(B, B, B):** Analogous.  
  - **Row’s action A in (A, A, A):** Played.  
  - **Row’s action B in (B, B, B):** Played.  
  - **Problem:** Row’s actions are played in equilibria.  
  - **Fix:** Adjust Row’s payoffs to make one action inferior:  
    - **Revised Row Payoff:** -1 if (Column, Matrix) = (B, B); else 0.  
    - **Now, (B, B, B) is not Nash:** Row gets -1; if Row deviates to A, gets 0 > -1.  
    - **Only Nash: (A, A, A).**  
    - **Row’s action B survives iterated dominance** (no domination possible) **but has 0 Nash probability.**  

  **Activity (Groups of 3):**  
  - **Roles:** Row, Column, Matrix.  
  - **Task 1:** "Eliminate dominated strategies." (None found.)  
  - **Task 2:** "Find all Nash equilibria." (Only (A, A, A)).  
  - **Outcome:** Row’s B survives iterated dominance but is never played in equilibrium.  

  ---

  ### Timeline (90 Minutes)  
  1. **0-10 min:** Introduce session, form groups of 3, distribute materials (bags, tokens). Start Module 1.  
  2. **10-35 min: Module 1** (25 min).  
  3. **35-70 min: Module 2** (35 min).  
  4. **70-85 min: Module 3** (15 min).  
  5. **85-90 min: Debrief** (define terms, connect activities to concepts).  

  **If 20 Minutes Behind:** Cut Module 3. Focus on Modules 1-2 and debrief.  

  ---

  ### Debrief (Last 5 Minutes)  
  - **Module 1 Moment:** "When you built the token mixture to dominate B, you encountered **strict dominance by a mixed strategy**. Key: It must beat the target against *every* opponent action."  
  - **Module 2 Moment:** "When you eliminated Z first, then C, you saw **iterated elimination**. Deleting an opponent’s action (Z) *expanded* what you could dominate; deleting your own action (A/B) would have *limited* it."  
  - **Module 3 Moment (if run):** "Row’s B survived iterated dominance but had zero Nash probability. This shows the procedure is an **upper bound on rationality**, not the equilibrium set."  
  - **Vocabulary Introduced:**  
    - Strict dominance (pure/mixed).  
    - Iterated elimination.  
    - Rationalizability vs. Nash equilibrium.  

  ---

  ### Predictable Challenges & Responses  
  1. **"Dominance ≠ Best Response"**  
     - *Example:* Student conflates "B is dominated" with "B isn’t a best response to Nash mixture."  
     - **Response:** "Dominance means *no belief* justifies the action. Best response depends on *specific beliefs*."  

  2. **"Surviving Set = Prediction"**  
     - *Example:* Student thinks surviving actions *will* be played.  
     - **Response:** "It only says these actions *can* be played rationally. Nash refines this."  

  3. **"Nobody Randomizes"**  
     - **Response:** "Randomization models unpredictable play. Even if explicit mixing is rare, the *threat* of unpredictability matters."  

  4. **"What About Opponent’s Thinking?"**  
     - **Response:** "Iterated dominance assumes **common belief in rationality**: I believe you’re rational, you believe I believe it, and so on."  

  ---

  ### What the Activity Cannot Reproduce (Must State Out Loud)  
  1. **Epistemic Foundations:** The procedure assumes **common belief in rationality** (players know others are rational, know they know, etc.). Without this, iterated elimination fails.  
  2. **Correlation of Beliefs:** In 3-player games, iterated strict dominance assumes players believe opponents’ moves are **independent**. If beliefs are correlated (e.g., "Column and Matrix will coordinate"), additional strategies may survive.  

  **Explicit Statement:**  
  > "Iterated elimination of strictly dominated strategies assumes:  
  > (1) Players are rational (maximize their payoff),  
  > (2) There is common belief in rationality, and  
  > (3) Beliefs about opponents are independent.  
  > If any assumption fails, the results may not hold."  

  ---

  **Final Note:** Verify all payoff numbers and inequalities before class. Use integers for simplicity (e.g., adjust Z’s payoffs in Module 2 to whole numbers: Z = [0, 0, 2] → mixture 0.5 > 0 becomes 1 > 0).
