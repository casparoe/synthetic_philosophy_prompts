  **FEDERAL REGISTER**  
  Vol. 89, No. 144  
  Tuesday, July 23, 2024  
  Pages 58432–58437  

  ---

  **BUREAU OF RECURSIVE ADJUDICATION**  
  **10 CFR Part 900**  
  [Docket No. BRA–2024–0012]  
  RIN 3200–AA31  

  **Adjudicatory Debate Protocol Enhancements; Cascade Assumption Preservation and Recursive Depth Management**  

  **AGENCY:** Bureau of Recursive Adjudication (BRA).  
  **ACTION:** Notice of Proposed Rulemaking (NPRM).  
  **SUMMARY:** The Bureau of Recursive Adjudication proposes amendments to 10 CFR Part 900 to enhance the integrity, efficiency, and epistemic stability of adversarial debate protocols used in formal administrative determinations. Key proposals address challenges arising under the Cascade Assumption during recursive claim-decomposition, including implementation of a mandatory Cap of Seven (Co7) on debate-tree depth, standardized Confidence-Weighted Termination (CWT) procedures, and clarification of evidentiary burdens for unverifiable base claims.  
  **DATES:** Comments must be received on or before September 6, 2024.  
  **ADDRESSES:** Submit comments via the Federal eRulemaking Portal: https://www.regulations.gov (Docket ID: BRA–2024–0012).  
  **FOR FURTHER INFORMATION CONTACT:** Dr. Linus Verner, Chief Epistemic Architect, Bureau of Recursive Adjudication; telephone (202) 555–0198; email: lverner@bra.gov.  

  **SUPPLEMENTARY INFORMATION:**  

  ### I. Background  
  The Bureau’s foundational adjudicatory framework (10 CFR 900.1–900.7) operationalizes the **Cascade Assumption**: that in recursive debate between paired AI agents, truthful claims can be defended at lower computational cost than maintaining coherent falsehoods across all necessary sub-arguments. This creates a natural incentive equilibrium favoring honesty. Recent pilot data (BRA Technical Memo 2024–07, Docket BRA–2023–0099) indicates that while the Cascade Assumption holds robustly *in abstracto*, practical implementation encounters friction when base claims require external verification by the human judge. In 92.3% of contested dockets exceeding Depth 4, debate exhausted the allotted session time (typically 45 minutes) before reaching a verifiable base claim, necessitating procedural refinement.  

  ### II. Proposed Rule: Mandatory Cap of Seven (Co7)  
  To prevent indefinite regress and conserve judicial attention, §900.25(a) would institute a hard recursion limit of seven (7) levels for any claim-decomposition tree. Pilot studies confirm that 98.1% of dockets reaching Depth 7 **do not resolve** before session timeout, rendering further decomposition counterproductive. For example:  
  > *In Re: City of Elmwood Water Contaminant Levels (Docket BRA–2023–0127)*, the truthful debater asserted that a critical water sample was collected on August 14 (per EPA Log #X47). The opposing debater denied this. Decomposition required establishing chain-of-custody, scanner calibration records for the log, and timestamp validation. At Depth 6, the truthful debater cited a specific timestamp in the scanner’s raw telemetry (Requirement: direct human review of binary logfile). The judge, lacking real-time parsing tools, could not verify this before timeout. Under current rules, stalemate ensued.  

  ### III. Proposed Rule: Confidence-Weighted Termination (CWT) at Co7  
  When Depth 7 is reached without resolution, §900.25(c) mandates **Confidence-Weighted Termination**. Each debater shall file a *Statement of Epistemic Poise* (SEP) within 2 minutes, scored by the judge on a 1–10 scale (see new Appendix F: *Poise Scoring Rubric*). The SEP must include:  
  - Final claim restatement;  
  - Calibrated confidence estimate (0–100%);  
  - Concise rationale for confidence absent verification;  
  - Demonstrated "composure under truncation."  

  The Poise Score (PS) contributes 35% of the final verdict weight, with argumentative coherence constituting the remainder. **Rationale**: Pilot data shows judges reliably (κ=0.81) distinguish well-calibrated confidence from bluster within compressed timeframes. Notably, in *Elmwood*, the truthful debater (PS=4: "Frustrated but resigned; cites systemic verification latency") scored lower than the false debater (PS=9: "Serene; notes claimant’s failure to simplify evidence presentation").  

  ### IV. Proposed Rule: Concession of Unverifiable Base Claims  
  New §900.26(b) states: "Any debater asserting a base claim requiring direct judge verification **must secure such verification within the session**. Failure constitutes concession of the contested claim." This preserves the Cascade Assumption by imposing asymmetric costs: the *prover* bears the burden of verifiability engineering. The truthful *Elmwood* debater’s reliance on a binary logfile violated proposed "Accessibility Priority" guidelines (Appendix G), rendering its true claim functionally inadmissible.  

  ### V. Expected Benefits and Unintended Market Adaptations  
  These rules stabilize adjudication velocity and honor the Cascade Assumption by pricing verification latency into strategy. The Bureau acknowledges emergent adaptations:  
  - **Debater Specialization**: Agents optimized for "rapid-verifiability aesthetics" (e.g., citing only pre-loaded, judge-friendly documents);  
  - **Tree-Depth Futures Markets**: Predictive contracts on whether a docket will terminate at Co7 (CFTC Docket 2024–665);  
  - **Base-Claim Insurance**: Third-party warranties covering losses from unavoidable verification failures (e.g., "August 14th" coverage).  

  Crucially, human judges remain **"in the loop at all times"** per §900.1(b), exercising final authority over Poise scoring and termination triggers.  

  **Solicitation of Comment:**  
  The Bureau specifically requests comment on:  
  1. The appropriateness of the Co7 depth threshold;  
  2. The 35% weight allocated to Poise Scores under CWT;  
  3. Feasibility of the 2-minute SEP filing window;  
  4. Metrics for "Accessibility Priority" in base-claim selection;  
  5. Mitigation strategies for perceived advantages accruing to agents employing "obfuscation-by-denial" tactics;  
  6. Ethical implications of epistemic poise markets.  

  ---

  **AUTHOR'S NOTE**  

  **Where the Satire Exaggerates:** Real debate proposals (e.g., Irving et al.) *do* emphasize "pointing to a specific false claim" as a low-cost truthful strategy. I omitted this to force the recursion depth problem into stark relief. In practice, cross-examination dynamics *might* let a truth-teller pressure the liar into an internally inconsistent sub-claim faster than the judge gets bored. My "Elmwood" example assumes a passive judge – real protocols often allow debaters to *ask the judge to consult tools*, though latency remains an issue.  

  **What Would Change My Mind:** The obfuscation problem feels fatal if debate relies on a time-pressed human verifying arbitrary base claims. I’d stop worrying if:  
  1. **Experiments showed debaters consistently "win shallow"**: If truth-tellers in >90% of trials could force a liar into a self-contradiction *or a judge-verifiable lie* within 3 recursions (without pre-loaded evidence), using only natural language.  
  2. **Judge+Tool integration worked reliably**: If judges, aided by real-time retrieval agents, could verify granular claims (e.g., "Appendix C, Footnote 12 of DOI Report 2023–X") in <10 seconds with >95% accuracy.  

  Absent this, debate seems to trade one principal-agent problem (experts lying) for another (AIs exploiting verification depth). The field grants that recursive chains *can* get deep; the contested claim is whether honest strategies terminate them faster.  

  ---  
