  They explicitly reject that this is simply about unfalsifiability, noting they're worried about a specific pattern of "redescribing whatever happened" after the fact. They mention Duhem-Quine but correctly note that this involves auxiliary hypotheses rather than internal parameter adjustments. They want to know if this phenomenon has a name, how it differs from similar concepts, and most importantly, what would distinguish legitimate uses from empty ones.

  This is a sophisticated critique. The user has identified what philosophers call "ad hoc parameterization" - the practice of explaining outcomes by adjusting unconstrained parameters after observation. While not identical to unfalsifiability (which is about testability), it's a specific mechanism that can lead to unfalsifiability.

  To address their concerns: The core issue is when parameters lack independent constraints. Legitimate uses require either: 1) Pre-specified boundaries for parameters (e.g., measurable priors), 2) Independent measurement methods (like neural correlates for "precision weighting"), or 3) Cross-system predictions (if parameter X is high in domain A, it should affect domain B). Without these, we're just retrofitting labels to outcomes.

  This differs from Duhem-Quine because here the adjustments happen within the theory's own vocabulary before testing, not through external auxiliary hypotheses. It differs from "just-so stories" which are narrative explanations without testable mechanisms. The key diagnostic is whether we could have predicted the parameter setting before seeing the outcome.

  For their thermostat/puddle example: This reveals the framework's risk of triviality. The legitimate response would be to specify what constitutes "surprise" for different systems - a thermostat has clearly defined expected states, while a puddle lacks any model to violate. But if every state is equally "predicted," the theory explains nothing.
answer: |-
  Your concern has an established name: it describes a case of **ad hoc parameterization within an unconstrained model**. This differs from unfalsifiability generally (which concerns testability) or the Duhem-Quine thesis (which involves saving a core hypothesis by revising auxiliary assumptions external to it). Here, the framework itself contains flexible internal parameters—like "prior confidence" or "sensory weighting"—that are tuned post hoc to fit any observed behavior, with no independent grounding or predictive constraint.

  The core issue is the **lack of independent measurability** for these parameters. In legitimate science, a theoretical dial must have:
  1.  **Pre-specified boundaries**: Limits on possible values defined before observation.
  2.  **Independent measurement**: Ways to quantify the parameter distinct from the outcome it explains (e.g., neural correlates for "precision," or behavioral baselines for "prior expectations").
  3.  **Cross-system predictions**: If a parameter setting explains Behavior X in context A, it should predict related effects in context B.

  Without these, the parameter becomes an empty redescription. Consider your examples: If "high prior confidence" explains *both* hallucination *and* inattentional blindness, we need independent ways to measure "confidence" (e.g., neural assays, pupillometry, or pre-trial bias induction) *before* seeing the outcome. If we only infer it *from* the perceptual error, it’s circular. Similarly, explaining action by positing "a prior belief in acting" becomes vacuous unless we can specify—*in advance*—what constitutes a violation of this "prior" (e.g., quantifying metabolic cost versus sensory gain) or measure such priors independently (e.g., via explicit goals or physiological states). The thermostat/puddle point highlights the triviality risk: if *any* stable state minimizes "surprise," the theory explains nothing specific without constraints on what constitutes the system’s "model" and "expected states."

  A legitimate deployment requires **empirically anchored parameters**. For instance, if "sensory precision weighting" were independently indexed by neurotransmitter levels (e.g., acetylcholine) measurable via PET scans, and if manipulating those levels predictably shifted belief updating *before* behavioral tests, the dial would have substance. Your worry is well-placed: the move is empty when the dial’s setting is *only* read from the outcome it must explain, with no independent handle or predictive bite. The test is simple: *Could you have known—or constrained—the dial’s setting before seeing the result?* If not, it’s likely ad hoc. Predictive processing *can* avoid this—by tethering its parameters to biology or quantifiable tasks—but often doesn’t in practice, making your vigilance essential.
