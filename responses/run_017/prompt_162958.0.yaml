prompt: |-
  I'm externing this term for Judge Whitlock on our state's intermediate appellate court, and I've been asked to draft the "which way does she vote" memo on a case that gets argued in two weeks. She's the judge everyone here calls the statutory-interpretation judge, but nobody in chambers agrees on what she's actually doing. Dan says she's a plain-meaning person who just lets old words pick up new referents as the world changes. Priya says she's a closet purposivist who stops at the edge of what the words can bear. I have a third theory I can't shake: she reads statutory words as naming a mechanism or an arrangement, and she treats a new technology as covered only when it runs on that same mechanism — a text that arrives on your residential phone line is a telephone solicitation to her, but an email is not first-class mail, even though it does the same job better. She never says any of this in so many words, so I want to test it against her record.

  Her opinions that seem relevant: (1) Under the Unsolicited Solicitation Act of 1974, which bars "an unsolicited telephone solicitation to a residential subscriber," a company blasted promotional SMS messages to mobile handsets on residential family plans. She held the Act reached it, saying something to the effect that a reading which lets the same intrusion in through a different door would leave the Act a dead letter. (2) Under the Residential Tenancies Act of 1961, a rent-increase notice must be "mailed by first-class mail to the premises"; the landlord emailed a PDF to the tenant's personal address and the tenant answered "got it." She held the notice invalid and the increase void — actual receipt, she said, is a windfall for the landlord, not a reading of the statute. (3) Under the Wage Claim Act, a claim must be "a written complaint signed by the employee"; a worker filed through the agency's online portal by typing his name into a signature field after a password and a one-time code sent to his phone. She held that signed: a signature is whatever mark a person adopts as his own, and the portal tied the mark to him. Priya counts this as her purposivist case; I think the word "signed" just isn't specific enough to do any work. (4) A 1996 city ordinance bars any person from operating "a motorized vehicle on a residential street" between 10 p.m. and 6 a.m.; a company ran remote-supervised delivery robots — electric, about forty pounds, on the sidewalk, crossing at crosswalks — through a residential neighborhood at 2 a.m. She held the ordinance didn't reach them, conceding that a speaker today might well call a robot a motorized vehicle but saying the ordinance was written about trucks and cars in the roadway. (5) Our wills statute requires that a will be signed "in the physical presence of two witnesses"; during 2020 a testator signed on camera while the two witnesses watched a live video call and then signed the paper later that day. Not valid, she held, and her opinion more or less rested on the word "physical" being there to be read.

  The new case: our Home Solicitation Sales Act of 1969. Section 2 defines a home solicitation sale as "any sale of consumer goods or services for a price of twenty-five dollars or more made at the buyer's residence, at which the seller or the seller's representative is present at the time the buyer signs," and gives the buyer until midnight of the third business day to cancel. There is no purpose clause or findings section anywhere in the Act. Facts: Ms. Alarcon, 71, alone at her kitchen table, clicked an ad on her tablet for a home security package — cameras plus monitoring, $4,180 — and within a minute a salesman appeared by two-way video on her 55-inch smart display. Ninety-minute pitch, five hundred dollars off if she signed before the call ended, she e-signed on the tablet at 6:40 p.m., and she emailed a cancellation two business days later. The salesman was in a call center two states away and no human being from the company was ever within forty miles of the house. The trial court assumed the written cancellation notice buried on page nine of the e-sign packet was adequate, so the only question on appeal is whether this was a home solicitation sale at all. One more thing from discovery that I can't figure out how much to weight: in roughly a third of these calls the thing on the screen isn't a person but the company's synthetic video agent, and nobody has established which kind of call Ms. Alarcon got.

  So: how do you think she votes, and how confident are you? Which rule is she actually running, which of her five opinions is the closest analog, and which single further case would you put to her to tell Dan's, Priya's and my theories apart — I was thinking of one where the seller's "presence" is a telepresence robot wheeled into the living room with a remote employee's face on it, but I'm not sure that's the most diagnostic one, and I'm also not sure whether the human-versus-synthetic-agent question is the real dividing line or a distraction. If you think her record genuinely doesn't decide this, say that plainly, and tell me what principle she'd be committing herself to with each answer.
reasoning: |-
  Okay, the user is a law extern for Judge Whitlock and needs to draft a memo predicting her vote in an upcoming case involving the Home Solicitation Sales Act. The judge is known for her unique approach to statutory interpretation, but chambers disagree on what that approach actually is. The user has three competing theories from colleagues and their own, plus five past opinions to analyze.

  First, I need to unpack the judge's pattern across those five cases:
  - SMS case: Applied old phone solicitation law to texts because it's the same "intrusion mechanism" despite new technology.
  - Email notice case: Rejected email as equivalent to "first-class mail" even though functionally superior.
  - E-signature case: Accepted digital signature as valid because it captured the core function of authentication.
  - Delivery robot case: Excluded sidewalk robots from "motorized vehicle" ban meant for road vehicles.
  - Virtual witnessing case: Insisted on literal "physical presence" for wills.

  The core conflict seems to be whether she focuses on the functional equivalent (Dan's view), purposive spirit (Priya's), or mechanism-specific implementation (user's theory). The mechanisms theory fits best - she cares about how the intrusion/transaction physically occurs, not just outcomes.

  Now applying this to Ms. Alarcon's case: 
  - The key statutory hook is "seller or seller's representative is present." 
  - Video call presence (human or synthetic) clearly isn't physical presence. 
  - The delivery robot and virtual witnessing cases suggest she'd reject technological equivalents. 
  - But the e-signature case shows flexibility when the mechanism fulfills the original purpose (authentication). 

  Crucial distinction: The signature statute's purpose was identity verification, which the portal achieved. Here, the physical presence requirement likely served consumer protection purposes like pressure avoidance - which video calls might replicate. But the judge consistently prioritizes mechanism over function when the text specifies form (like "physical" or "first-class mail").

  The synthetic agent complication might not matter - both video forms lack physical presence. A telepresence robot test case would be revealing: if she accepts that (physical object in home), it confirms the mechanism theory; if she rejects all non-human-presence, it's stricter textualism.

  Prediction: She'll hold it's not a home solicitation sale. Confidence 80% - her pattern shows resistance to extending physical presence requirements to digital equivalents unless the statute's words are inherently flexible (like "signed"). The first-class mail and physical presence cases are closest analogs.

  For the memo, I should emphasize: 
  - Her mechanism-centric approach outweighs functional equivalence 
  - Synthetic vs human agent is likely irrelevant 
  - The telepresence robot hypothetical would best test theories 
  - If she surprises us, it'd imply a new consumer-protection purposivism - but that contradicts her email rejection
answer: |-
  Based on Judge Whitlock's record and your mechanism-centric theory, here's the breakdown for the *Alarcon* case:

  ### Prediction
  **She votes that this is *NOT* a home solicitation sale** (i.e., the cancellation right does not apply).  
  **Confidence: High (80-85%)**.  
  Her reasoning will likely hinge on the statute’s requirement of physical presence ("**the seller or the seller’s representative is present at the time**"), which remote video fails to satisfy regardless of human vs. synthetic agents.

  ---

  ### Why Your Theory Fits Best
  Her jurisprudence consistently prioritizes **the specific mechanism or arrangement described by the statute**, not functional equivalence or evolving purposes:
  - **Mechanism over function**: She rejects "same job, better" arguments (email ≠ first-class mail; video witnessing ≠ physical presence).
  - **Contextual framing**: She interprets terms based on the *contemporary understanding of the mechanism* (delivery robots ≠ "motorized vehicles" for roadway use; SMS = "telephone solicitation" due to analogous intrusion).
  - **Textual rigidity**: When statutory language specifies a *physical* mechanism ("physical presence," "first-class mail"), she demands strict compliance.
  - **Purpose only at the edges**: She invokes purpose only to avoid absurdity (SMS case) or when the text is inherently flexible ("signed" = any adopted mark).

  Dan’s "new referents" theory fails in cases like *first-class mail* and *physical presence*. Priya’s purposivism is inconsistent with her refusal to extend statutes to functionally superior technologies (e.g., email for rent notices).

  ---

  ### Closest Analog: **Case (5) – Virtual Witnessing**
  - **Statutory hook**: Both require **physical co-location** ("physical presence" vs. "is present").  
  - **Key similarity**: She treats physical presence as non-negotiable. Video interaction (even live) is insufficient because the statute’s mechanism requires spatial proximity. Actual awareness/receipt (like the tenant’s "got it" email) is irrelevant.  
  - **Distinction from e-signature (Case 3)**: "Signed" is inherently flexible because signatures are defined by authentication, not physics. "Presence" implies a bodily, spatial element.

  ---

  ### Diagnostic Test Case: **Telepresence Robot**
  - **Facts**: Seller’s remote employee controls a wheeled robot with a screen displaying their live face; it enters the buyer’s living room during the pitch. Buyer signs on the robot’s tablet.  
  - **Why it’s diagnostic**:  
    - **Dan’s theory**: Likely covered ("same intrusion" as a human solicitor).  
    - **Priya’s theory**: Covered (purpose is pressure/impulse control; physical object in home achieves this).  
    - **Your theory**: *Not covered*. The mechanism isn’t a "representative *present*" but a machine operated remotely. Statute contemplates human bodies, not proxies.  
  - **Her likely vote**: Uncovered. Aligns with *delivery robots* (Case 4) – the ordinance targeted human-operated road vehicles, not autonomous devices.  

  **Human vs. Synthetic Agent in *Alarcon*?**  
  Irrelevant. Both fail the physical-presence test. Her *SMS* and *e-signature* cases show she cares about the *mechanism of interaction* (intrusion via communication device; authentication via adopted mark), not the humanity of the actor.

  ---

  ### If She Surprises Us: Competing Principles
  If she votes *for* coverage (low probability), she’d commit to:  
  1. **Priya’s purposivism**: The Act’s goal is protecting vulnerable buyers from high-pressure *tactics*, and video calls replicate the coercive dynamic.  
  2. **Textual evolution**: "Present" now includes virtual presence via real-time audiovisual tech (collapsing Dan’s and Priya’s views).  

  But this contradicts her *physical presence* and *first-class mail* rulings. It would suggest inconsistency or a new consumer-protection outlier.

  ---

  ### Recommendation for Memo
  1. **Lead with mechanism theory**: Frame her approach as "**technological mechanism originalism**" – the statute applies only if the new tech operates via the *same physical or contextual mechanism* understood when enacted.  
  2. **Distinguish e-signature case**: Emphasize that "signed" is a *legal concept* defined by intent/authentication, while "present" is a *physical state*.  
  3. **Address the synthetic agent**: Note it’s a red herring; the core issue is spatial absence.  
  4. **Predict no coverage**: "The statute requires a human body in the residence, not a digital projection."  

  **Key quote for your memo**:  
  > "Judge Whitlock’s jurisprudence suggests that when a statute specifies a *physical mechanism* (presence, mail), technological substitutes fail unless they replicate the exact *arrangement* – not merely the outcome."  

  This case turns on whether "present" implies spatial co-location. Her record says yes.
