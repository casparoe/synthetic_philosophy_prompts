  ok so this is gonna sound dumb but its been bugging me for like a month and I can't figure out where the bad part is.

  Every saturday since 9th grade I go over to my neighbor Ray's house and we fix up old bikes in his driveway and give them to kids at the elementary school. He taught me basically everything, and the tools were my grandpa's, which only matters because they're weird old tools and you have to be shown how to use them. Nobody ever says why anyone is there. We dont talk about it at all. That's kind of the whole thing, and I think if we started saying stuff like that out loud it would stop working.

  My friend Priya says I'm wasting my time. Her argument is that I've got a limited number of hours and I should be putting them wherever they do the most good, and that if I can't show bikes are the best use of those hours then I'm doing it because it feels good, which is just selfishness with a nice story stapled to it. She also says the fact that I'd never have cared about bikes if I hadn't met Ray just means my commitment is an accident, and accidents aren't reasons.

  Two more things. When I said I'd feel like I stopped being someone who keeps his word (I told Ray I'd show up), she said that's sunken cost and my ego and that identity is not an argument. And when I admitted that if I had to choose between helping her move and helping a stranger who needed help way more, I'd pick her, she said that just proves I never had a reason and I'm rationalizing the whole time.

  So: is she right, or is something off about what she keeps demanding from me? I keep trying to answer her question, what makes this matter more than the other stuff, and everytime I get close to an answer it feels like I'm wrecking the thing itself, like now I'd be there for the reason instead of just being there. Also, she offered a compromise which is that I keep visiting Ray but do my work hours wherever they help most, and that somehow sounds even worse to me and I have no idea why.

  I don't want a book recommendation or quotes or anything, I just want to know who's confused here and what I should actually do with the saturdays.
