prompt: |-
  I'm in a tiny metaethics reading group this term — four of us plus one visiting PhD student who is very quick and slightly annoying — and we got stuck on something I still can't shake a week later. It started as a question about whether the normative supervenes on the descriptive and turned into an argument that Hume's law is false. I don't believe that, but I also can't find the mistake, and its not for lack of going over it on the walk home. Here's the argument as he put it on the whiteboard (cleaned up a bit, numbers mine):

  (1) Supervenience: necessarily, no two possible situations are alike in every descriptive respect and different in their normative status — there is no difference in what someone ought to do without some difference in the facts somewhere.

  (2) The Bridge Requirement: if the normative supervenes on the descriptive, then that covariance is either brute — a necessary connection with nothing explaining it — or it is explained by necessary truths that state, for each descriptive condition, which normative status goes with it.

  (3) Brute necessary connections between the descriptive and the normative are not on offer: a necessary link that nothing explains is exactly the sort of coincidence a serious metaphysic shouldn't help itself to. (He flagged this as the one place he's making a real philosophical bet.)

  (4) So there are necessary bridge truths, roughly of the form: necessarily, anything descriptively thus-and-so is pro tanto to be done, or is good.

  (5) Hume's law: no valid argument has only descriptive premises and a normative conclusion — you can't derive an 'ought' from an 'is'.

  (6) But if (4) is true, then those bridge truths just are the derivations that (5) says don't exist. So (5) is false, and the is-ought gap is a methodological habit rather than a logical or metaphysical barrier.

  (7) And then, given enough descriptive knowledge, moral inquiry just is empirical inquiry plus the bridge truths: in principle you could read off what anyone ought to do from the natural facts alone.

  Two things he added make me more suspicious rather than less. First, he insists he hasn't committed the naturalistic fallacy, because he isn't defining 'good' as any descriptive property — he's only claiming necessary coextension, which he says is weaker and still enough to kill the gap. Second, he cheerfully admits the argument generalizes: swap in phenomenal properties supervening on physical ones, or the aesthetic on the non-aesthetic, and the same three premises force either brute necessary connections — which non-reductive physicalists seem perfectly comfortable with — or entailments from physics to experience. So either the argument is broken or non-reductivists everywhere are in deeper trouble than they admit. He says he's fine with either; I think a proof that settles all of that at once is a proof that to much.

  What I want from you: name the step where it actually goes wrong, or, if nothing goes wrong, tell me which premise is cheapest to give up and what giving it up commits me to. I'm attached to (1) — I can't see how there could be a moral difference with no factual difference anywhere — and I'm attached to something like (5), at least in the sense that you can't get from 'this policy will cause a lot of suffering' to 'don't do it' by logic alone without adding something. My friend says those two attachments plus (2) can't all be true. I have a hunch the real action is in how 'descriptive' and 'normative' are being drawn, and in whether (5) is a claim about arguments or a claim about the world, but whenever I try to say that precisely it goes fuzzy on me. So: is there a usable distinction between a gap in the argument and a gap in the world that this argument slides between? Is the disjunction in (2) really exhaustive — is there room for covariance explained by identity or by grounding rather than by statable bridge laws, and would that option survive the open-question style worries Moore raised? And if the honest answer is that brute necessary covariance is fine after all, what exactly do I give up by saying so, and does it cost me more in ethics than it would in the philosophy of mind?
reasoning: |-
  Okay, let's start by unpacking this user's dilemma. They're in a metaethics reading group where a visiting PhD student presented an argument challenging Hume's law. The user is attached to both supervenience (no normative difference without descriptive difference) and Hume's law (no deriving 'ought' from 'is'), but the argument seems to show these can't both be true. They suspect the issue lies in how "descriptive" and "normative" are defined or whether the gap is logical vs. metaphysical, but they can't pin it down.

  First, I need to recall the core steps of the argument. Premise (1) is supervenience, which seems solid—most metaethicists accept this. Premise (2) claims the covariance must be brute or explained by bridge truths. Premise (3) rejects brute connections, leading to (4) necessary bridge truths. This contradicts Hume's law (5) because those bridge truths would allow deriving 'ought' from 'is'. 

  The user's discomfort makes sense. They mention the PhD student insists this isn't the naturalistic fallacy because it's about coextension, not definition. But Moore's open-question argument still applies: even if "good" co-occurs with some descriptive property, we can always ask "But is it good?" meaning the concepts aren't identical. So necessary coextension doesn't bridge the gap for logical derivations. 

  Ah, that's a key point. Hume's law is about logical entailment in arguments, while supervenience is about metaphysical covariance. The bridge truths in (4) are metaphysical necessities, not axioms you can use in deductions. So you can't "derive" normative conclusions from descriptive premises without adding these necessary truths as premises, which themselves are normative or hybrid. That violates Hume's law's spirit—you still need some normative input. 

  The user also worries about the distinction between argument gaps and world gaps. The PhD student conflates them. Supervenience is about the world (metaphysics), Hume’s law about arguments (logic). Bridge truths don’t help in derivation because they’re not descriptive; they’d be normative premises in disguise. 

  Grounding is another angle. Maybe the covariance is explained by grounding relations (descriptive facts ground normative ones), not bridge laws. This avoids brute necessities without providing derivable truths. Non-reductive physicalists use this in philosophy of mind—mental properties supervene on physical but aren't reducible via bridge laws. Same could work for ethics. 

  Giving up (3) (rejecting brute necessities) is an option, but the user might not like it. The PhD student says non-reductivists are comfortable with brute supervenience, so why not in ethics? But the user’s attachment to avoiding coincidences makes this costly. Alternatively, questioning (2)'s disjunction: maybe covariance is explained by grounding, not bridge laws or brute facts. That preserves supervenience without bridge truths. 

  The generalization to other domains like philosophy of mind is tricky. For consciousness, brute supervenience might be more acceptable than in ethics. But the user can handle them differently—different explanatory demands. 

  The user’s core need is to preserve both supervenience and the is-ought gap. The cheapest move is denying (2)'s exhaustiveness—opting for grounding. This avoids brute facts and bridge laws, keeping Hume’s law intact. If they must reject something, (3) is next, but that’s philosophically heavier. Clarifying the logic/metaphysics distinction should empower them to push back in the reading group.
answer: |-
  Your instincts are sharp—the argument *is* clever but flawed, and the mistake lies in conflating metaphysical covariance with logical derivability. The fatal slide happens between steps (4) and (6), and the culprit is the ambiguous treatment of "bridge truths." Here's the breakdown:

  ### The Core Mistake: Bridging the Wrong Gap
  - **Step (4) claims**: There are necessary truths like "Necessarily, if descriptive condition D obtains, then normative status N obtains."  
  - **Step (6) claims**: These truths allow us to *derive* normative conclusions from descriptive premises.  
  - **The error**: These bridge truths are **metaphysical necessities**, not **logical truths** or **analytic entailments**. Hume's Law (5) concerns *logical derivability in arguments*, not metaphysical covariance.  

  Bridge truths like (4) don't license "deriving" 'ought' from 'is' *within an argument* because:  
  1. **They are not descriptive premises**: A statement like "Pain is bad" is *itself normative* (or at least hybrid). Adding it as a premise smuggles normativity into the argument.  
  2. **They are not tautologies**: You can't deduce them from descriptive concepts alone (Moore's open-question argument still bites: "I agree X is descriptively D, but *is* it good?" remains coherent).  

  Hume's Law survives: No valid argument with *purely descriptive premises* can yield a normative conclusion. Bridge truths break purity—they *are* normative.  

  ### Diagnosing the Premises
  Here's where each premise stands and the cost of rejection:  

  | **Premise** | **Status** | **Cost of Rejection** |
  |-------------|------------|----------------------|
  | **(1) Supervenience** | Likely true | Denies a core metaethical commitment (e.g., leads to moral luck or arbitrariness) |
  | **(2) Bridge Requirement** | **False** (the disjunction isn't exhaustive) | Minimal cost—grounding offers a better explanation |
  | **(3) No brute necessities** | Defensible but negotiable | Allows "cosmic coincidences" (may cost more in ethics than philosophy of mind) |
  | **(5) Hume's Law** | Intact (as a logical thesis) | Forces reductivism or error theory |

  ### Saving Supervenience Without Bridge Truths: Grounding to the Rescue
  The gap in (2)'s disjunction is **grounding**. The normative can supervene on the descriptive without brute connections *or* bridge laws by being **grounded in** descriptive facts.  
  - **Grounding**: Descriptive facts *explain why* normative facts hold (e.g., "This act causes suffering" grounds "This act is wrong").  
  - **Why this avoids (4)**: Grounding relations aren't "bridge truths" that license logical derivation. They're explanatory relations in the world, not premises in an argument. Moore's worry is sidestepped because grounding doesn't equate "good" with a descriptive property—it makes normativity *emergent* but irreducible.  

  ### What About Generalization?
  The PhD student is right that the argument generalizes, but wrong that it's fatal:  
  - **Philosophy of mind**: Non-reductive physicalists *already* accept brute supervenience (e.g., Chalmers' hard problem). They'd reject (3), arguing that brute psychophysical laws are unavoidable.  
  - **Aesthetics/ethics**: Here, brute supervenience feels costlier—why *should* suffering ground wrongness? But grounding offers a path: normative facts aren't brute; they're constituted by descriptive facts in a way that's explanatory but non-reductive.  

  ### Your Best Moves
  1. **Target Premise (2)**: Reject the false disjunction.  
     - **Say**: "Supervenience requires explanation, but grounding provides it without bridge truths. Bridge truths would need to be *analytic* to violate Hume's Law—but they're not."  
     - **Cost**: None. Grounding is mainstream in metaphysics.  

  2. **Defend Hume's Law by Sharpening the Distinction**:  
     - **Logical Gap**: You can't derive 'ought' from 'is' *without normative premises*. Bridge truths *are* normative.  
     - **Metaphysical Gap**: Supervenience holds, but it's secured by grounding, not derivability.  

  3. **If you must reject something, deny (3)**:  
     - **Cost in ethics**: Accepting brute normative supervenience might weaken objectivity (e.g., "Why *these* connections?").  
     - **Cost in philosophy of mind**: Less severe—brute psychophysical laws are widely tolerated.  

  ### Why the PhD Student is Wrong About the Naturalistic Fallacy
  Necessary coextension *is* weaker than definition, but Moore’s open-question argument still applies: if "good" merely *covaries* with a descriptive property, we can still ask, "But is it *actually* good?" This shows the concept isn't captured descriptively. Bridge truths don't close the *logical* gap—they're hostages to normativity themselves.  

  ### The Upshot
  The argument slides from **metaphysical covariance** (supervenience) to **logical derivability** (violating Hume’s Law) by ignoring that bridge truths are *normative*. Grounding supervenience in descriptive facts preserves both (1) and (5) without brute necessities. You keep supervenience, keep the is-ought gap, and avoid unexplained coincidences—all by rejecting (2)'s impoverished disjunction. Your reading group’s next move: demand the PhD student show how bridge truths can be *derived from descriptive premises alone*. They can’t—and that’s Hume’s Law in action.
