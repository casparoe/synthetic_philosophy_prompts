  You're a professional philosopher of physics who has published on both sides of the time question, so please think carefully before you write: spend a little while brainstorming where the load-bearing assumptions actually sit in this debate, then draft the document I describe below.

  I'm a journalist working on a feature about whether time really passes, and I have two sources who've been sniping at each other in blogs and journal symposia for about fifteen years and who I'd like to force into the same room. One is an eternalist: she thinks the Rietdijk–Putnam argument basically settles it — Minkowski spacetime admits no preferred slicing, simultaneity is frame-relative, so every event, past and future, is as real as this one, and "now" is just an indexical like "here." The other is a theorist of objective becoming: he accepts all of special relativity's formalism and every prediction it makes, but denies the step from there being no invariant simultaneity to there being no fact about what is happening now. His line is that the block picture gets the physics right and the metaphysics wrong, and that either a physically undetectable priviledged foliation or a relativized notion of what exists is doing work the eternalist hasn't paid for.

  What I want is the joint statement they'd produce if they genuinely collaborated instead of trading footnotes. Give me:

  1. A numbered agreed-claims section — the propositions both can sign, including about the formalism of special relativity, about what the Rietdijk–Putnam argument does and doesn't assume, about what the Andromeda-paradox style case (two people walking in different directions, different slices through a distant galaxy) adds over the bare argument, if anything, and about what a satisfactory account of temporal experience would have to do.
  2. A disagreements table: the issue; the eternalist's formulation in wording she'd accept; the becoming theorist's formulation in wording he'd accept; and a column saying whether the disagreement is genuine or verbal.
  3. The cruxes, with for each one a case, argument, or finding both agree would bear on it, and each side's prediction written down in advance. I'd guess the cruxes include whether the absence of a preferred foliation in the formalism is a metaphysical claim or only a claim about the laws; whether all times being equally real requires the future to be determinate, or whether an open but fully real future is coherent; and whether the block view can explain the asymmetry of memory and anticipation without importing entropy as an extra premise.

  Here's a scenario of my own invention to feed into this — don't worry about whether it's physically plausible, just take it as given: suppose a future cosmology hands us a physically privileged foliation, a slicing singled out by the fundamental fields the way the CMB rest frame singles out a velocity, and it lines up with nothing in our ordinary experience. Take each side's verdict on that: does the eternalist concede that becoming is real, does the becoming theorist concede that the argument was sound all along if no such foliation ever turns up, and is there anything either would count as evidence against their own view?

  If you think part of the row is merely about words, say exactly which part and why. And at the end add a short note for me, as the reporter: how confident are you in each of the agreed claims, which single line in the document are you least sure of, and which claim would each side privately want a hedge on?
reasoning: |-
  We are crafting a joint statement between an eternalist (E) and a becoming theorist (B). Both accept special relativity (SR) and its empirical predictions. The goal is to find common ground and clarify disagreements.

  ## Step 1: Brainstorming the Load-Bearing Assumptions
  - **Eternalist's core**: The Rietdijk-Putnam (R-P) argument shows that if SR is true and no preferred frame exists, then all events are equally real. The block universe is the only consistent ontology. "Now" is indexical, like "here".
  - **Becoming theorist's core**: The R-P argument assumes that the absence of an invariant simultaneity relation in the physics implies there is no objective fact about what is present. But this is a metaphysical leap. One can accept SR's formalism and yet hold that there is an objective (though perhaps undetectable) foliation or a relativized existence (e.g., existence-at-a-time). The block view fails to capture the dynamic aspect of time.

  Common ground:
  1. Both accept the mathematical structure of Minkowski spacetime and the relativity of simultaneity.
  2. Both agree that the R-P argument is valid within its assumptions: if there is no privileged foliation, then from the perspective of any event, events spacelike separated are not absolutely past or future, and thus the reality of all events follows.
  3. Both agree that the Andromeda paradox (two observers in relative motion disagreeing about what is happening "now" in Andromeda) illustrates the relativity of simultaneity and the frame-dependence of the present.
  4. Both agree that any account of temporal experience must explain why we have the impression of a moving "now", the asymmetry between past and future, and the directedness of time.

  Disagreements:
  - **Metaphysical interpretation of SR**: E sees the block as the only consistent ontology; B sees room for objective becoming even within SR.
  - **Status of the foliation**: E says no preferred foliation is part of SR and is a physical fact; B says that the absence of a preferred foliation in the physics does not rule out a metaphysical one (or a relativized becoming).
  - **Open future**: E typically holds that the future is just as real as the past, hence determinate. B may hold that the future is open (not yet real) and becoming is the coming into existence of events. But note: some eternalists might allow an open future (e.g., growing block), and some becoming theorists might not tie becoming to indeterminism.
  - **Experience**: E explains temporal experience as a psychological phenomenon within the block; B argues that the block cannot account for the directedness and flow without importing additional asymmetries (like entropy).

  ## Step 2: Drafting the Joint Statement

  ### 1. Agreed Claims
  Both parties agree on the following:

  1. **Special Relativity Formalism**: The mathematical structure of Minkowski spacetime, including the relativity of simultaneity and the absence of a privileged foliation in the standard formulation of special relativity, is empirically well-supported and must be accounted for by any metaphysical theory of time.

  2. **Rietdijk-Putnam Argument**: The R-P argument, which demonstrates that in the absence of a privileged foliation, the reality of an event at one location implies the reality of all events (since for any two spacelike separated events, there is a frame in which one is past and the other future), is logically valid under the assumption that there is no physically privileged foliation. The argument shows that if one accepts that what is real is not frame-dependent, then one must accept that all events are real.

  3. **Andromeda Paradox**: The Andromeda paradox (in which two observers in relative motion assign different times to the same distant event) is an illustration of the relativity of simultaneity. It does not add new formal content beyond the R-P argument but vividly demonstrates the operational consequences of the relativity of simultaneity for the concept of "now".

  4. **Temporal Experience**: Any satisfactory account of time must explain the following features of human experience:
     - The apparent passage of time (the feeling that time flows).
     - The asymmetry between past and future (we remember the past but not the future, we feel we can affect the future but not the past).
     - The directedness of time (the arrow of time).

  5. **Evidence for a Privileged Foliation**: Both parties agree that if a future cosmology were to establish a physically privileged foliation (e.g., one defined by the global structure of the universe, such as the CMB rest frame or a fundamental field), this would have significant implications for the metaphysics of time. However, they note that at present, no such foliation is required by the laws of physics as we know them.

  ### 2. Disagreements Table

  | Issue | Eternalist's Formulation | Becoming Theorist's Formulation | Genuine or Verbal? |
  |-------|--------------------------|--------------------------------|--------------------|
  | **Ontological Status of Events** | All events in spacetime are equally real; the universe is a four-dimensional block. | Only events that are present (in an absolute or relativized sense) are real; past events were real and future events are not yet real (or: reality is relativized to a time). | Genuine (metaphysical disagreement about what exists). |
  | **Interpretation of the Absence of Privileged Foliation in SR** | The lack of a privileged foliation in the formalism of SR is a physical fact that implies there is no metaphysical basis for a privileged "now". | The absence of a privileged foliation in the physics does not preclude a metaphysical privileged foliation (or a relativized becoming) that is not detectable by physical means. | Genuine (disagreement about the relationship between physics and metaphysics). |
  | **The Open Future** | The future is just as real and determinate as the past. The feeling of an open future is epistemic or psychological. | The future is not yet real and is open (indeterminate). The becoming of events is the coming into being of what was previously indeterminate. | Genuine (though note: some versions of eternalism, like the growing block, also have an open future). |
  | **Explanation of Temporal Experience** | The block universe can explain temporal experience by appealing to the psychological arrow of time (which is grounded in entropy) and the indexical nature of "now". | The block universe cannot explain the dynamic aspect of time (passage) without smuggling in becoming. A satisfactory account requires an objective becoming that is not reducible to entropy. | Partly verbal, partly genuine. Verbal in that both agree entropy is involved; genuine in whether the block alone suffices or whether becoming is needed. |

  ### 3. Cruxes

  **Crux 1: The Status of the Foliation**
  - **Case**: Suppose a future cosmology discovers a fundamental field that defines a unique foliation of spacetime (like a universal time), but this foliation is not aligned with any human experience (e.g., it is orthogonal to our psychological arrow of time). 
  - **Bearing on the debate**: This would provide a physically privileged foliation. 
  - **Eternalist's prediction**: E would say: "This does not establish becoming; it only adds a physical structure. The block view remains, but with an extra geometrical feature. Becoming still doesn't follow." 
  - **Becoming theorist's prediction**: B would say: "This provides a candidate for the objective foliation required for becoming. If we accept this foliation, then we can define an objective present and thus objective becoming." 
  - **Evidence against their own view**: 
    - E: If it were shown that the privileged foliation is necessary for the laws of physics (not just a contingent feature) and that it implies a dynamic aspect (e.g., if the laws were not time-symmetric in that foliation), E might reconsider. 
    - B: If no such foliation is found and it is shown that none can exist (e.g., from quantum gravity), B would have to rely on a non-physical foliation or a relativized becoming, which might be seen as ad hoc.

  **Crux 2: The Open Future**
  - **Case**: Consider a quantum experiment where the outcome is truly indeterminate until measured. Does the future event (say, the decay of a radioactive atom at a specific time) exist before it happens?
  - **Bearing on the debate**: If the future is indeterminate, does that mean it is not real? 
  - **Eternalist's prediction**: E: "The block universe can accommodate indeterminism: the future is real but not determined. The block has multiple potential futures (in a branching structure) or is inherently probabilistic. The feeling of openness is due to our ignorance." 
  - **Becoming theorist's prediction**: B: "Indeterminism supports the open future. The future is not real until it happens. The becoming of events is the resolution of indeterminacies." 
  - **Evidence against their own view**: 
    - E: If it were shown that determinism is true (e.g., in a hidden-variable theory), E would not be troubled, but if it were shown that the future is not real (e.g., by a logical argument that real events must be determinate), that would challenge E. 
    - B: If it were shown that the future is determinate (e.g., by a complete and deterministic theory of everything), B would have to either accept a determinate future that is not yet real (which might be odd) or abandon the open future.

  **Crux 3: Explanation of Temporal Experience Without Entropy**
  - **Case**: Imagine a universe with the same laws as ours but without an entropy gradient (e.g., a universe in thermal equilibrium). Would there be temporal experience?
  - **Bearing on the debate**: Can the block view explain temporal experience without relying on entropy?
  - **Eternalist's prediction**: E: "Without an entropy gradient, there would be no psychological arrow of time. Thus, temporal experience requires entropy." 
  - **Becoming theorist's prediction**: B: "Even without entropy, there might be an objective becoming that grounds temporal experience. However, without entropy, there would be no memory or perception of change, so conscious beings might not exist. But becoming is independent." 
  - **Evidence against their own view**: 
    - E: If it could be shown that there is temporal experience in a low-entropy state (e.g., in a computer simulation that doesn't rely on entropy), that would challenge E's reliance on entropy. 
    - B: If it were shown that temporal experience is entirely dependent on entropy (e.g., by creating an agent that experiences time only when entropy increases), then B's claim that becoming is necessary would be weakened.

  ### Note to the Reporter

  **Confidence in Agreed Claims**: 
  - I am highly confident in the agreed claims about the formalism of SR and the R-P argument (Claims 1-3). These are standard and non-controversial among physicists and philosophers of physics. 
  - Claim 4 (temporal experience) is also solid, as both sides acknowledge these phenomena. 
  - Claim 5 (about a future privileged foliation) is more speculative, but the conditional agreement is reasonable.

  **Least Sure Line**: 
  - The least sure line is in the Disagreements Table under "Explanation of Temporal Experience": the claim that the disagreement is "partly verbal". It might be more genuine than I have allowed. The eternalist might insist that the psychological arrow (with entropy) is sufficient, while the becoming theorist might argue that without objective becoming, there is no account of why we are located at this particular time (the "problem of the present"). This could be a deep metaphysical divide.

  **Private Hedges**:
  - **Eternalist**: Might privately hedge on the open future. Some eternalists (e.g., those favoring the growing block) do allow for an open future. So E might not want to commit to the future being determinate if that is not essential to eternalism.
  - **Becoming theorist**: Might privately hedge on the detectability of the foliation. If pressed, B might admit that if the foliation is entirely undetectable, it becomes metaphysically suspect. But B would likely fall back on a relativized becoming (e.g., existence relative to a time) that does not require a global foliation.

  This document provides a framework for constructive dialogue. The cruxes are designed to be testable, and the disagreements are clarified. Both sides have staked out positions that can be challenged by future developments.
