  Throughout, I'll flag where I'm extrapolating, like predicting grudge duration in the triage case, since the literature doesn't settle it. The goal is to present genuine disputes without false consensus, keeping the agreed claims robust. The joint statement should feel like a hard-won truce, not mushy compromise. 

