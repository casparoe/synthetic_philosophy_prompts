  ### Commitment
  I recommend the package **kept: D2, D3, D4, D5, D6, E3** and **dropped: D1, E1, E2**.  
  - **Why sacrifice D1?** D1 conflicts fatally with D2 and E3 due to selective labels. Keeping it would make fairness unenforceable at new cutoffs, inviting vendor loopholes. Dropping it lets us audit and enforce calibration at the *current* cutoff, with post-hoc fixes if new cutoffs expose issues.  
  - **Why sacrifice E1 and E2?** E1/E2 are prejudices masquerading as principles. Banning group data (E1) prevents adaptive fairness (e.g., re-calibrating for group T after gaming); enforcing same cutoffs (E2) ignores base rates, harming high-need group S and low-scoring group T.  
  - **Consequences for groups**:  
    - **Group T (low base rate)**: Gains from group-wise calibration (E3), ensuring scores ≈ true urgency. Risks short-term unfairness if cutoffs change abruptly (due to dropped D1), but audits will catch this.  
    - **Group S (high base rate)**: Loses if same cutoff (E2) isn’t enforced, but gains from anti-gaming measures (D3) and calibration.  
    - **Group R (medium base rate)**: Balanced benefits; protected by contestability (D5).  

  The **least confident claim** is that dropping D1 is sustainable. Evidence of frequent, drastic cutoff changes harming groups before audits would force D1’s reinstatement with historical validation.
