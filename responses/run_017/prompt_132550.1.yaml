  D2: Auditability under selective labels
  - Requirement: The criterion can be checked (at least approximately) from data in which outcomes are only observed for fast-tracked applicants.
  - Failure case: Without this, we cannot audit the system. For example, if we require calibration (F3) for the whole population, we cannot compute it because we don't know the outcomes for non-fast-tracked applicants.
  - Status: Non-negotiable. Without auditability, the contract is unenforceable.
  - Conflicts: Some criteria (like F3: calibration for the entire population, or F4: PPV for the entire population) require knowing outcomes for non-fast-tracked applicants. Also, F1 (equal FPR) and F2 (equal FNR) require knowing the true labels for both fast-tracked and non-fast-tracked to compute errors.
  - Rules out: Any criterion that requires knowledge of outcomes for non-fast-tracked applicants.

  D3: Stability under adaptation
  - Requirement: The criterion still means what it says after applicants have adjusted their answers to the cutoff, and it does not invite an arms race that only the better-off can afford.
  - Failure case: If applicants learn how to game the system, the score becomes less informative. For example, if the system uses a linear model and applicants inflate their answers on certain questions, the score might become biased. Moreover, if only richer applicants can afford to game the system, then the system becomes unfair to the poor.
