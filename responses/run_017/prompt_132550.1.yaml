  - Conflicts: Might conflict with some group-wise parity requirements. For example, if we require equal FPR across groups, then improving accuracy might break the equality. But note: the requirement says that improving accuracy for every group should not lower fairness. So if improving accuracy breaks group parity, then that parity requirement is flawed.
