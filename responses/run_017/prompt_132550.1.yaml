  - Conflicts: Might conflict with E3 (same score interpretation) because if adaptation happens differentially by group, the meaning of the same score might change. Also, might conflict with E1 (not using group) because if we don't use group, we cannot adjust for differential adaptation.
  - Rules out: Criteria that are highly sensitive to gaming, such as those that rely on the exact relationship between features and scores without accounting for strategic behavior.

  D4: No reward for worse predictions
  - Requirement: The criterion is not satisfied by trivial systems (constant score, random assignment, or fast-tracking almost nobody). Also, adding a feature that improves accuracy for every group cannot lower measured fairness.
  - Failure case: Without this, a vendor could meet the fairness requirement by making the system useless (e.g., assigning everyone the same score, or randomizing). Also, we want to encourage innovation that improves accuracy without being penalized by the fairness metric.
