  We are designing a fairness specification for a procurement contract. The system assigns a need score between 0 and 1 to each applicant. Applicants above a cutoff are fast-tracked; others wait. The cutoff is reset each quarter. There are three groups: R, S, T. The base rates of genuine urgent need are:
  - R: 1/6 ≈ 0.1667
  - S: 1/3 ≈ 0.3333
  - T: 1/10 = 0.1

  The score is informative but imperfect and distributions overlap heavily. Outcomes are only observed for fast-tracked applicants. Applicants can adapt their answers to improve their scores.

  We have five demands (D1 to D5) to stress-test and three additional demands to rule on.

  First, we create a table of requirements. We will assign IDs to each requirement. D1 to D5 are given. We also need to address the three demands we keep hearing and the familiar candidates (which we may or may not use).

  Additional demands to consider:
  - E1: The score must not use group membership or anything that tracks it. (This is often called "fairness through unawareness".)
  - E2: The same cutoff must apply to all three groups.
  - E3: A given score must carry the same interpretation in every group (e.g., same probability of urgent need).

  Familiar candidates (we may add as requirements if they are valuable and auditable):
  - F1: Equality of false positive rates (FPR) across groups.
  - F2: Equality of false negative rates (FNR) across groups.
  - F3: Calibration within group: for any score value, the proportion of urgent need cases among those assigned that score should equal the score (or be close).
  - F4: Equality of positive predictive value (PPV) or negative predictive value (NPV).
  - F5: But-for invariance: the score would not change if the group membership were changed.
  - F6: Closure over every subgroup: the criterion holds for every subgroup definable from our records.

  However, we must be cautious: not all of these are auditable (due to selective labels) or stable under adaptation.

  We now build the table.

  Requirement Table:

  ID | Requirement | Failure case that motivates it | Status | Which other requirements it conflicts with | What it rules out

  D1: All-cutoff validity
  - Requirement: The fairness criterion must hold at every cutoff, not just the current one.
  - Failure case: If we only require fairness at the current cutoff, a vendor might design a system that is fair only at one cutoff but not at others. Then when the cutoff changes (as it does every quarter), the system becomes unfair. For example, at a low cutoff, group S might be disproportionately fast-tracked, but at a high cutoff, group R might be disproportionately excluded.
  - Status: Non-negotiable. Because the cutoff changes quarterly, we need consistency.
  - Conflicts: Might conflict with requirements that are defined for a fixed cutoff (like some error rate balances). Also, if we require group-wise thresholds (E2) then at every cutoff we must use the same threshold for all groups, which might be incompatible with other requirements at different cutoffs.
