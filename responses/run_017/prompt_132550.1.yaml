      "what_would_change_it": "Evidence that cutoffs change drastically quarter-to-quarter (e.g., from 0.2 to 0.8), causing systematic harm to groups (e.g., urgent T applicants consistently missed at high cutoffs) before audits catch it. This would necessitate reintroducing D1 with historical data allowances."
