prompt: |-
  I convene a large first-year course on practical reasoning, and twice a term my teaching assistants and I have to grade short policy papers in which the argument almost always turns on a historical analogy: this is another Munich, this is Vietnam again, this is the Thucydides trap playing out. We mark them inconsistently, and I would like a procedure instead.

  Please give me a decision procedure a marker can run in about ten minutes per paper, with no training in philosophy or history, to determine whether a given analogy is doing argumentative work or only lending a conclusion an air of inevitability. I want ordered tests, each with a statement of what would count as a pass and what as a fail, and a clear account of where the procedure stops and hands the remainder to judgment.

  The cases it must handle: the student who supplies no features beyond the name; the lesson stated so that no outcome could disconfirm it; the analogy the historical actors were themselves invoking, so that the comparison is part of the causal story rather than a neutral observation of it; and the case both sides cite for opposite conclusions. I also want a place for the level-of-abstraction problem, since any two episodes match under some description, and for a test I have found useful in my own reading — an invariance test, on which an analogy earns its conclusion only if the outcome would survive changes in the features the analogy does not mention.

  Then apply the procedure to three papers on my desk: one arguing that a trade concession to a rising power is Munich; one arguing that a limited military intervention is justified because Vietnam taught us to avoid quagmires; one invoking the Thucydides trap to argue that a great-power war is structural and policy therefore cannot matter. The Vietnam argument is one I make myself in lecture; if the procedure fails it, say so plainly. Finally, tell me what the procedure cannot tell me — where a good paper will still be marked down and a weak one still pass.
reasoning: |-
  Okay, the user teaches a first-year practical reasoning course and needs a consistent grading procedure for policy papers that use historical analogies. The key issues are inconsistent marking among TAs, with papers often using analogies like Munich, Vietnam, or Thucydides trap superficially. 

  The user wants a 10-minute decision procedure for non-specialist markers that can handle specific cases: name-only analogies, unfalsifiable lessons, analogies that were part of the historical actors' reasoning, and cases where both sides cite the same analogy for opposite conclusions. They also want to address the level-of-abstraction problem and include an invariance test. 

  Hmm, the user is clearly frustrated with current grading inconsistencies and wants something operationalizable. But beneath that, they might be worried about students missing the point of practical reasoning - which should be about rigorous argument, not rhetorical shortcuts. The procedure needs to kill two birds: standardize grading while teaching critical thinking.

  Let me structure this as a flowchart with ordered tests. First, screen out the worst offenders (name-dropping, unfalsifiable claims), then assess argumentative substance. The invariance test comes late because it requires understanding what the analogy actually claims. 

  For the test cases: 
  - The Munich trade paper likely fails early (no mechanism). 
  - The Vietnam quagmire paper might pass if it specifies applicability conditions (like the user's own lectures do). 
  - Thucydides trap paper probably fails invariance - if war is truly structural, changing policy shouldn't matter, but that's contradicted by historical cases where diplomacy worked.

  Important limitations: The procedure won't catch bad writing or weak evidence outside the analogy itself. And it might unfairly penalize creative but well-argued analogies at high abstraction levels. Still, for first-year papers, false positives (passing weak analogies) are the bigger risk than false negatives.

  The user's mention of their own Vietnam argument is interesting - they're testing if the procedure can distinguish between superficial and substantive uses of the same analogy. Good. The procedure should flag that without mechanism specification, even "valid" analogies fail.
answer: |-
  Here's a 10-minute decision procedure for grading historical analogies in student papers, designed for TAs without specialized training. It uses 5 ordered tests with clear pass/fail criteria, stopping early on failure. The procedure targets **whether the analogy does substantive argumentative work** rather than serving as rhetorical decoration.

  ---

  ### **The Historical Analogy Evaluation Protocol (HAEP)**
  **Time Budget:** 10 minutes per paper  
  **Focus:** Assess ONLY the analogy's argumentative function. Ignore writing quality, factual accuracy, or other argument elements unless directly relevant.

  #### **Test 1: Feature Specification Check**  
  *"Does the paper specify *concrete features* of the analogy beyond its name?"*  
  - **PASS:** Lists ≥3 **specific, non-tautological features** shared between the historical case and current situation (e.g., "Munich: democratic appeaser, expansionist dictator, unresolved territorial claims").  
  - **FAIL:** Only names the analogy ("This is Munich"), states vague lessons ("Avoid weakness"), or lists features true of *all* conflicts (e.g., "both involved leaders").  
  - **OUTCOME:** FAIL → **Grade DOWN** (analogy is decorative). STOP.  
  - **PASS** → Proceed to Test 2.

  #### **Test 2: Falsifiability Test**  
  *"Could the analogy's lesson *in principle* be disconfirmed by outcomes?"*  
  - **PASS:** Lesson is **contingent** (e.g., "Concessions here will embolden aggression *as in Munich*" → could fail if concessions yield peace).  
  - **FAIL:** Lesson is **tautological/untestable** (e.g., "This is Munich, so we must avoid appeasement" without defining appeasement; or "Thucydides Trap means war is inevitable" regardless of actions).  
  - **OUTCOME:** FAIL → **Grade DOWN** (analogy is non-explanatory). STOP.  
  - **PASS** → Proceed to Test 3.

  #### **Test 3: Causal Isolation Test**  
  *"Is the analogy presented as an *external* comparison, not a causal factor in the current situation?"*  
  - **PASS:** Analogy is used **descriptively/comparatively** (e.g., "Like at Munich, State A is making concessions to State B").  
  - **FAIL:** Analogy is **part of actors' motivation** (e.g., "Leaders cited Vietnam to justify withdrawal" → the analogy is *itself* a historical cause).  
  - **OUTCOME:** FAIL → **Flag for instructor review** (causal entanglement requires expert judgment). STOP.  
  - **PASS** → Proceed to Test 4.

  #### **Test 4: Disanalogy Stress Test**  
  *"Does the paper address *at least one major disanalogy*?"*  
  - **PASS:** Identifies & engages ≥1 **plausible difference** (e.g., "Unlike Vietnam, this region has no jungle terrain" OR "Nuclear weapons didn’t exist in Thucydides' time").  
  - **FAIL:** Ignores disanalogies or dismisses them without argument.  
  - **OUTCOME:** FAIL → **Grade DOWN** (superficial treatment). Proceed to Test 5 but cap grade at B-.  
  - **PASS** → Proceed to Test 5.

  #### **Test 5: Invariance Test**  
  *"Would the predicted outcome hold if *non-analogized features* changed?"*  
  - **PASS:** Outcome **depends on analogized features** (e.g., "Even with different leaders, concessions to expansionists invite aggression" → tests *mechanism*).  
  - **FAIL:** Outcome **relies on unique features** (e.g., "War is inevitable because of the Thucydides Trap" but changing economic interdependence doesn’t alter conclusion → analogy isn’t doing work).  
  - **OUTCOME:**  
    - PASS → **Grade UP** (analogy is substantive).  
    - FAIL → **Grade DOWN** (analogy is decorative/fatalistic).  

  ---

  ### **Application to Your Cases**
  1. **Trade Concession = Munich**  
     - Test 1: FAIL (likely just names "Munich"). **STOP. Grade DOWN.**  
     *(If features listed: Test 2 PASS → Test 3 PASS → Test 4 FAIL → Test 5 FAIL: "Appeasement bad" ignores economic interdependence, nukes, etc.)*

  2. **Limited Intervention = Justified by Vietnam**  
     - Test 1: PASS ("quagmire" implies features: protracted war, unclear objectives, local resistance).  
     - Test 2: PASS (intervention could succeed if no quagmire features present).  
     - Test 3: PASS (analogy is comparative, not causal).  
     - Test 4: **CRITICAL:** PASS if paper notes disanalogies (e.g., "Unlike Vietnam, we have drone surveillance"); FAIL if not.  
     - Test 5: PASS if argues "quagmire dynamics" (not mere historical similarity) dictate outcome.  
     **VERDICT:** **PASSES if disanalogies addressed** (as in your lectures). Grade UP.

  3. **Thucydides Trap = War Inevitable**  
     - Test 1: PASS (features: rising vs. established power).  
     - Test 2: **FAIL** ("inevitable" is unfalsifiable). **STOP. Grade DOWN.**  
     *(If modified: Test 4 FAIL (ignores disanalogies like globalization); Test 5 FAIL (war "inevitable" even if features like diplomacy change).)*

  ---

  ### **What HAEP Cannot Assess**  
  1. **False Equivalence Nuances:** A paper may pass all tests but still draw a weak analogy (e.g., comparing cyber disputes to Munich). HAEP flags *how* the analogy is used, not *whether* it’s apt.  
  2. **Historical Accuracy:** TAs won’t verify if the student’s depiction of Munich/Vietnam is correct.  
  3. **Non-Analogy Arguments:** A brilliant paper with a flawed analogy might still deserve an A; HAEP only grades the analogy’s role.  
  4. **High-Abstraction Arguments:** Some valid analogies operate at structural levels (e.g., "balance of power dynamics"). HAEP may flag these as Test 2/5 fails if not carefully framed.  
  5. **Rhetorical Skill:** A weak analogy persuasively embedded in narrative might pass; a strong one poorly explained might fail.  

  **Recommendation:** Use HAEP for 70% of the analogy grade (e.g., 7/10 points). Reserve 30% for instructor discretion on historical accuracy/creativity. Provide students with HAEP *before* writing—it’s a teaching tool as much as a grading rubric.  

  **Your Vietnam Example:** HAEP passes it *if* disanalogies are addressed (as you do). If a student mimics your argument superficially, Test 4 or 5 will catch it.
