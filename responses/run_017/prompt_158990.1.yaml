prompt: |-
  I work in behavioural ecology, in a lab that builds optimality and game-theoretic models of foraging and signalling, so I have some skin in this game; but I read outside my subfield, and I have just finished a recent popular book on evolution whose chapter on adaptationism I cannot tell how much to trust. The chapter is well written and I think mostly right, but it reaches conclusions that would embarrass people in my department if they were fair, and I cannot locate where it goes wrong.

  It says, in substance, this: Gould and Lewontin's 1979 paper attacked what they called the adaptationist programme, the near-universal habit among evolutionary biologists of breaking an organism into separate traits and then telling a story in which each trait was individually built by natural selection for the job it now does. Their central metaphor comes from the Basilica of San Marco, where the tapering triangular panels between the arches under the dome are not there for the sake of the mosaics that fill them; the panels are forced by the geometry of arches and vaults, and the glorious decoration came later and had to fit the space it was given. In biology, a spandrel is the same thing: a feature that exists as a by-product of how an organism has to be built — the standard textbook examples are male nipples and the human chin — rather than as a product of selection. Crucially, the book says, this means that a trait whose present usefulness was not the reason it evolved counts as a spandrel rather than as an adaptation; bird feathers, which arose before flight and were later recruited for it, are on this view spandrels with respect to flight. The book calls this the double-lock rule: a trait is an adaptation only if selection both built it for its current role and currently maintains it for that role. The methodological moral the book draws is that the null hypothesis for any trait should be non-adaptation, with adaptationists bearing the burden of proof, because a theory that can cook up a plausible advantage for any feature whatsoever explains nothing — which is why the paper likened adaptationist stories to Kipling's Just So Stories and to Voltaire's Dr Pangloss, with his insistence that noses were made to carry spectacles. The upshot, the book concludes, is that the adaptationist programme was refuted: form is driven mainly by architectural and developmental constraint rather than by selection, most traits are not adaptations at all, and the discovery that much of the genome is non-functional is the molecular vindication of the whole critique.

  My own hypothesis is that the chapter is running together distinctions that the careful literature keeps apart — being a structural by-product, being co-opted for a new use, having no current function, and having no selectionist explanation — and that most of its force comes from sliding between them. But I am not confident, and I would rather be corrected than confirmed.

  So please do an audit rather than a survey: take the claims one by one and tell me which a working evolutionary biologist would accept, which are defensible simplifications, which are distortions, and which Gould and Lewontin would themselves have rejected, given that they insisted they were not denying the centrality of natural selection. Then: does the double-lock rule follow from anything in their argument, and how does it handle a trait that was co-opted and then extensively reshaped by selection for the new role? Do the chapter's conclusions about my lab's models and about how common spandrels are survive the corrections? Is the frequency question even the one the paper raises? Finally, a philosopher friend said the architectural example is itself shaky — that the panels are not really forced by the geometry, and that someone proposed pendentives as the better term — and I want to know whether the argument actually depends on the example being clean, or whether that is a distraction. No bibliographies, please; I want the reasoning.
reasoning: |-
  Okay, let me unpack this user's query. They work in behavioural ecology with a focus on optimality and game-theoretic models, so they're deeply familiar with evolutionary theory but concerned about a popular book's interpretation of Gould and Lewontin's spandrels paper. The book's chapter pushes strong claims: adaptationism is refuted, most traits are spandrels, and non-functional DNA proves it. The user suspects conceptual slippage but wants a rigorous audit.

  First, I need to dissect the book's claims point by point. The core issues seem to be: (1) conflation of spandrels with exaptations (like feathers pre-flight), (2) the "double-lock rule" requiring both historical and current selection, (3) methodological burden shifting to adaptationists, and (4) overstatement of constraints over selection. 

  The architectural metaphor is secondary, but I recall pendentives vs. spandrels is a real debate—though irrelevant to the biological argument. More importantly, G&L never claimed most traits are spandrels; their point was about default assumptions. The user's lab models aren't threatened because optimality approaches already test hypotheses against alternatives (drift, constraints). 

  On molecular "vindication," junk DNA supports non-adaptation but doesn't negate selection's role in functional traits. The user's unease is justified: the book overcorrects by replacing adaptationist bias with constraint bias. Key nuance: traits like co-opted feathers become adaptations if subsequently modified by selection. The double-lock rule oversimplifies; current utility matters more for evolutionary maintenance than strict historical origin.

  User's hidden worry: could this misinterpretation discredit their modeling work? Unlikely—good models incorporate constraints and test adaptive hypotheses. They need reassurance their field's methods already address G&L's critique. Also, their philosopher friend's pendantive quibble is a red herring; biological insight stands regardless.
answer: |-
  Here's a point-by-point audit, grounded in evolutionary biology's conceptual framework and Gould & Lewontin's (G&L) actual arguments:

  1.  **"Breaking organisms into separate traits and telling individual selectionist stories"**: **Distortion.** G&L rightly criticized *exclusively* atomizing traits and assuming selection *must* explain every detail *without considering alternatives*. Modern evolutionary biology accepts this criticism – traits are analyzed in context, considering constraints, trade-offs, and history. Your lab's models inherently do this by defining costs/benefits/trade-offs.

  2.  **Spandrel Definition (by-product of structure/development)**: **Acceptable simplification.** Male nipples (developmental constraint from shared embryonic blueprint) and the human chin (likely a biomechanical by-product of facial reduction) are classic examples. The core concept is valid.

  3.  **Feathers as Spandrels for Flight**: **Distortion.** This misapplies the concept. G&L distinguished:
      *   **Spandrel**: Non-adaptive structural by-product *at origin* (e.g., chin).
      *   **Exaptation**: Trait *co-opted* for a new function *after* its origin (Gould & Vrla, 1982). Feathers originated likely for thermoregulation/display (adaptation for *that* function), then were *exapted* for flight. Calling them "spandrels with respect to flight" is incorrect and conflates origins with current utility.

  4.  **The "Double-Lock Rule" (Adaptation requires selection *built* it *and* maintains it for current role)**: **Not G&L's Rule / Problematic Distortion.**
      *   **"Selection built it for current role"**: This is the standard definition of *adaptation*. If selection didn't shape it *for* that function, it's not an adaptation *for* that function.
      *   **"Selection currently maintains it"**: This is generally true for complex adaptations (drift or weak selection might maintain simple traits). The critical error is applying this rigidly to origins. For a co-opted trait:
          *   If co-opted with *minimal modification* (e.g., using a rock as a hammer), it's an **exaptation**. Not an adaptation for the new role.
          *   If *extensively reshaped by selection* *for the new role after co-option* (e.g., reshaping bird wings/feathers specifically for flight), it **becomes an adaptation for that new role**. The double-lock rule falsely denies this possibility. Selection *did* "build" (modify) the trait *for* flight in this case.

  5.  **Null Hypothesis = Non-adaptation / Burden of Proof on Adaptationists**: **Defensible Simplification of G&L's Methodological Point.** G&L argued that assuming adaptation *first* blinds researchers to alternatives (constraint, drift, exaptation, non-function). The "null hypothesis" framing is a strong interpretation of this, emphasizing that adaptive hypotheses need *testing*, not just plausible storytelling. Most evolutionary biologists agree adaptive hypotheses require evidence (consilience, comparative tests, optimality predictions, etc.), avoiding "Just So Stories." This doesn't mean assuming non-adaptation is always *correct*, but that alternative hypotheses must be *considered and tested*. Your lab's models implicitly do this by specifying costs/benefits – a model failing to predict observed behaviour *is* evidence against pure adaptation *for that specific hypothesized benefit*.

  6.  **"The adaptationist programme was refuted"**: **Major Distortion.** G&L argued the *methodology* (uncritical assumption of adaptationism) was flawed, not that adaptation was unimportant. They explicitly stated natural selection is potent. The "refuted" claim grossly overstates their position.

  7.  **"Form driven mainly by constraint, not selection / Most traits not adaptations"**: **Distortion / Unsupported Exaggeration.** G&L argued constraints are *underappreciated*, not *dominant*. They did *not* claim most traits are spandrels or non-adaptive. They argued that *some* traits are, and failing to consider this leads to bad science. The frequency question *is* secondary to the methodological one – the point was that the *possibility* of non-adaptive origins must be considered. Molecular "junk" (non-functional DNA) *does* demonstrate that not everything is an adaptation, supporting the existence of spandrels/genetic drift, but it doesn't imply *most phenotypic traits* lack function or weren't shaped by selection.

  8.  **Molecular "Vindication"**: **Defensible but Overinterpreted.** Non-coding DNA prevalence shows much evolution is neutral/maladaptive (Muller's ratchet, drift), supporting G&L's point that not *all* genomic features are adaptations. However, it doesn't vindicate the extreme claims about phenotypic traits or the dominance of constraints.

  **Conclusions on Your Lab's Work & Spandrel Frequency:**

  *   **Your Lab's Models:** **Largely Unaffected, Potentially Vindicated.** Optimality/game theory models *are* powerful tools for testing adaptive hypotheses *precisely because* they make quantitative predictions. A good model explicitly defines trade-offs and constraints – the very things G&L said adaptationists ignored. If your models successfully predict behaviour while incorporating realistic constraints/trade-offs, they are *doing* the hard work G&L demanded. The critique applies more to vague verbal adaptationism than rigorous modeling.
  *   **Spandrel Frequency:** The chapter **exaggerates wildly**. While constraints and exaptations are crucial, complex functional traits (eyes, wings, complex behaviours) clearly demonstrate the power of selection. The "most traits are not adaptations" claim is not supported by G&L nor by evidence. The key G&L point is methodological: *consider the alternatives*.

  **The Architectural Metaphor:**

  *   **Pendentives vs. Spandrels:** Your philosopher friend is correct architecturally. The San Marco features are pendentives (curved triangles supporting a dome on a square base), not spandrels (residual spaces between arches). G&L used "spandrel" loosely.
  *   **Relevance to Argument?** **Minimal Distraction.** While technically inaccurate, the *conceptual point* stands: the pendentive/spandrel space exists primarily due to architectural necessity, not to be decorated. Its *form* is constrained. The metaphor effectively illustrates the concept of a structural by-product co-opted later. The argument about biological spandrels doesn't hinge on the architectural term being perfect.

  **In Summary:** The chapter gets the core *concept* of a spandrel (structural by-product) roughly right but **severely distorts** G&L's arguments and evolutionary biology by: conflating spandrels with exaptations; inventing the flawed "double-lock rule"; overstating the dominance of constraints/non-adaptation; misrepresenting the status of adaptationism; and misapplying the molecular evidence. G&L's primary contribution was a vital **methodological corrective**: test adaptive hypotheses rigorously against alternatives (constraint, drift, exaptation, non-function). This corrective is now widely accepted and integrated into good evolutionary biology practice, including rigorous modeling like your lab's. The chapter's extreme conclusions do not follow.
