prompt: |-
  I've been going to the same rationalist-adjacent meetup for years and some version of Goodhart's law comes up every few months, always in the one-liner form — "When a measure becomes a target, it ceases to be a good measure" — and always deployed as a conversation-stopper. Last week it got used against me. We were arguing about whether our little local giving group should score grant applications on a few explicit numbers (cost per unit of outcome, some rough reach estimate) instead of the current setup, where two people read the narrative applications and go with their gut. Someone said "Goodhart's law" in that tone that clearly means "explicit metrics always get gamed, therefore holistic judgement," and everyone sort of nodded. I pushed back with something like "judgement is a measurement channel too and it gets Goodharted just as easily, people learn to write the kind of narrative our reviewers respond to," but I dont think I said it well and I'm not fully sure it's right. What complicates it for me is that the one-liner isn't Goodhart's own phrasing — I gather the wording comes from Marilyn Strathern quoting Keith Hoskin in a 90s paper on accountability stuff — and the version actually attributed to Goodhart himself, from a 1975 article on UK monetary policy, is "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes," which reads to me like a much narrower econometrics claim than what my meetup person needed it to be.

  The problem is I can't keep straight which thing is being claimed. Here are the distinctions I can half-see, and I'd like them sharpened: (a) it's just the intervention-versus-conditioning point — any predictor that isn't causal breaks once you intervene on it, i.e. correlation-isn't-causation with extra words — which is true but seems to apply to human judgement exactly as much as to a spreadsheet; (b) something like a regressional story where the proxy is target-plus-noise, so hard selection over-selects positive residuals and the shortfall grows with how hard you select relative to how noisy the proxy is, which sounds substantive and quantitative and would tell you "don't optimize too hard on a noisy proxy" rather than "don't use proxies"; (c) a strategic story that requires actual agents who know the metric and have incentives, and which splits into redirecting effort from unmeasured to measured dimensions (teaching to the test) versus corrupting the measurement itself (faking the numbers) — note that in both of these the measure may still be measuring its thing perfectly, so "ceases to be a good measure" looks like the wrong diagnosis; (d) a thing I keep coming back to that I can't find a name for, call it shadow dimensions: the target is high-dimensional, the metric is a low-dimensional projection, so even a noiseless causally-valid metric leaves all the unmeasured coordinates unconstrained and optimization pressure drives them somewhere extreme — is that a separate failure mode or just (a)-(c) in a costume, and does it need an intentional agent at all, or does gradient descent / natural selection do it too; (e) a constitutive or transformative reading where instituting the metric changes the practice being measured, so the metric doesn't fail to track the target, the target just stops being the thing you wanted.

  So: can you lay out for me the menu of precise claims that line could be making, ordered roughly trivial-to-radical, and give me verdicts on each — platitude, substantive-and-defensible, only-true-with-caveats, or just false — plus, for each one, whether it would actually get my meetup person to "so drop the numbers and trust the reviewers' gut"? I particularly want to know which reading has to be doing the work if publicity or explicitness of the metric is supposed to be the active ingredient, because that's the only place I can see his conclusion living, and even then it seems like the conclusion you'd draw is "hide or rotate your metrics, use several independent channels, cap the optimization pressure, audit for corruption" rather than "use vibes, vibes aren't a metric." Bonus points if you can tell me where (d) fits, whether there's a reading of the line that's straightforwardly false (e.g. that any proxy degrades without bound under any amount of optimization), and whether the one-liner and Goodhart's 1975 sentence are even claims about the same phenomenon. I want something I can bring to the next meetup without sounding like I'm just name-dropping a law.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been part of a rationalist meetup where Goodhart's law is frequently cited as a conversation-stopper, especially in the context of using explicit metrics versus holistic judgment for grant applications. The user pushed back by arguing that human judgment is also subject to Goodhart-like distortions but feels they didn't articulate it well. They're confused about the different interpretations of Goodhart's law and want a clear breakdown.

  First, I need to address the core issue: the meetup's use of the one-liner version versus Goodhart's original statement. The user mentioned that the one-liner isn't from Goodhart but from Strathern quoting Hoskin. Goodhart's original 1975 paper was about monetary policy, where statistical regularities collapse under policy pressure. The user is right that this is narrower. The meetup seems to be using the broader, more popular version.

  The user listed several interpretations (a-e) and wants them categorized from trivial to radical, with verdicts. They also want to know which interpretations support the "use vibes instead of metrics" conclusion. Let me tackle each interpretation:

  (a) Intervention vs. conditioning: This is basic causality. Any proxy not causally linked breaks when acted upon. True for both metrics and human judgment. Verdict: Platitude. Doesn't support ditching metrics because judgment is equally vulnerable.

  (b) Regression to the mean: Hard selection on a noisy proxy leads to overfitting. This is a substantive statistical point. Verdict: Defensible with caveats. Suggests not optimizing too hard, not abandoning metrics. Supports using multiple metrics or capping optimization.

  (c) Strategic gaming: Intentional agents gaming the system via effort redirection or measurement corruption. Verdict: Defensible but requires incentives and knowledge. Suggests countermeasures like audits, not abandoning metrics.

  (d) Shadow dimensions: Low-dimensional proxies leave other dimensions unconstrained. Can happen without intent, via optimization processes. Verdict: Defensible and distinct. Explains why even good proxies can fail. Suggests using more dimensions or constraints, not ditching metrics.

  (e) Constitutive change: The metric redefines the target. Verdict: Defensible in social contexts. Suggests the need for periodic reassessment, not abandoning metrics.

  The user wants to know which interpretation the meetup person relies on. Since they emphasize gaming and explicit metrics, it's likely (c). But the user's counterpoint is that judgment can be gamed too. The conclusion "use vibes" only holds if vibes are immune, which they're not—narrative crafting is gaming judgment.

  The user also asked if any interpretation makes the one-liner false. Claiming that any proxy degrades without bound under any optimization is false—some proxies are robust, and moderate optimization might be fine. The one-liner oversimplifies.

  For the next meetup, the user should focus on:
  1. All measurement channels (including judgment) are vulnerable.
  2. Goodhart effects are manageable with design, not avoidable by switching to judgment.
  3. The original Goodhart's law was narrower; the one-liner is a broad oversimplification.
  4. Solutions involve multiple metrics, audits, capping incentives, and recognizing that judgment needs the same scrutiny.

  The user's deeper need is to effectively counter the misuse of Goodhart's law as a conversation-stopper and promote nuanced discussion. They need clear arguments to show that abandoning metrics isn't the solution, and that both approaches require careful implementation.
answer: |-
  Here's a breakdown of the precise claims behind "When a measure becomes a target, it ceases to be a good measure," ordered from trivial/platitudinous to radical, with verdicts and implications for your meetup debate. I'll address your specific questions (including shadow dimensions and the bonus) at the end.

  ---

  ### The Menu of Claims (Trivial → Radical)

  1.  **The Causality Claim (Your "a"):**
      *   **Claim:** Any *correlational* (non-causal) proxy will break when you intervene on it directly. This is "correlation isn't causation" applied to proxies and interventions.
      *   **Verdict:** **Platitude** (in rationalist circles). Fundamental but obvious. Applies universally.
      *   **Supports "drop numbers, trust gut"? NO.** Human judgment ("gut") is also based on learned correlations (pattern-matching) that can be non-causal. If the reviewer's gut relies on a non-causal correlation between narrative style and impact, intervening (writing *for* that style) breaks it just like gaming a number.

  2.  **The Regression Artifact Claim (Your "b"):**
      *   **Claim:** If the true goal `T` is measured by a noisy proxy `M = T + ε` (where `ε` is error/noise), then selecting *hard* on `M` selects cases where `ε` was positive. The average `T` for high-`M` selections is lower than true `T` would predict due to regression to the mean. The *harder* you optimize `M` relative to the noise level, the worse `M` predicts `T` for your selections.
      *   **Verdict:** **Substantive and defensible.** A core statistical pitfall. Applies even without intentional agents.
      *   **Supports "drop numbers, trust gut"? NO.** Human judgment is *also* a noisy proxy (`Gut = T + δ`). Selecting hard on what the gut likes suffers the *exact same regression artifact*. This claim argues for *not optimizing too hard on any single noisy proxy*, not for abandoning explicit proxies in favor of implicit ones.

  3.  **The Effort Substitution Claim (Subset of your "c"):**
      *   **Claim:** Agents with knowledge of the metric and incentives will redirect effort from unmeasured aspects of `T` towards improving the measured `M`. `M` still measures its specific thing well, but `T` suffers because unmeasured dimensions are neglected (e.g., "teaching to the test").
      *   **Verdict:** **Substantive and defensible (with caveats).** Requires intentional agents, knowledge, and incentive alignment. A dominant mechanism in social/economic contexts.
      *   **Supports "drop numbers, trust gut"? ONLY IF GUT IS IMMUNE.** But narrative applications are *designed* to influence the gut. Applicants learn what narratives resonate (unmeasured dimensions: emotional appeal, framing, buzzwords) and optimize for *that*, neglecting aspects of `T` the reviewers *think* they're capturing but aren't explicitly measuring. **This claim cuts *against* trusting the gut.** Explicit metrics make effort substitution *visible* and potentially mitigable (see below). Gut metrics hide it.

  4.  **The Measurement Corruption Claim (Subset of your "c"):**
      *   **Claim:** Agents directly manipulate or corrupt the measurement process itself to improve `M` without improving `T` (e.g., faking data, exploiting loopholes). `M` genuinely *ceases* to be a good measure of its *own thing*.
      *   **Verdict:** **Substantive and defensible (with caveats).** Requires intentional agents, knowledge, opportunity, and incentives. Common where oversight is weak.
      *   **Supports "drop numbers, trust gut"? ONLY IF GUT IS UNCORRUPTIBLE.** But reviewers can be biased, misled by narratives, or even subtly corrupted (e.g., favoring friends). Gut measurement *is* corruptible. Explicit metrics make corruption *detectable* in principle (audits, consistency checks). Gut metrics make corruption harder to detect. **This claim argues for better oversight/design, not abandoning explicitness.**

  5.  **The Shadow Dimensions Claim (Your "d"):**
      *   **Claim:** The true goal `T` is high-dimensional. Any metric `M` is a low-dimensional projection (e.g., a single number, a gut feeling pattern). Optimization pressure on `M` will drive the system towards the point in `T`-space that maximizes `M`, which is likely an extreme point neglecting the unmeasured dimensions. This happens *even if `M` is a perfect, noiseless, causal indicator within its projection*.
      *   **Verdict:** **Substantive, defensible, and distinct.** Crucial insight. Doesn't require agents (evolution, gradient descent do it). Explains why *even good proxies* can lead to perverse outcomes under optimization. This is the "multi-tasking problem" or "you get what you measure (and nothing else)".
      *   **Supports "drop numbers, trust gut"? NO.** Human judgment ("gut") is *also* a low-dimensional projection (pattern recognition based on limited cues). Optimizing for what *feels* impactful to Reviewer A & B *also* drives applications towards extreme points in the unmeasured dimensions of `T`. **Gut is just another low-D projection.** This claim argues for *richer, multi-dimensional measurement*, not for trusting a single implicit channel.

  6.  **The Constitutive Change Claim (Your "e"):**
      *   **Claim:** Instituting `M` as a target fundamentally changes the nature of the activity or the goal itself. `M` doesn't fail to track the original `T`; the original `T` ceases to exist or becomes irrelevant. The practice adapts to serve `M`. (e.g., publishing metrics changing the nature of research).
      *   **Verdict:** **Substantive and defensible (in social contexts).** A deeper sociological point. Can happen with or without intent.
      *   **Supports "drop numbers, trust gut"? AMBIGUOUSLY.** Using explicit metrics *could* shift the giving group's culture towards technocracy. But relying *only* on holistic gut judgement constitutes its own system, defining `T` as "what feels impactful to Reviewer A & B *right now*," which can also drift arbitrarily and lacks accountability. Neither approach is immune. This argues for *reflexivity and revisiting goals*, not inherent superiority of gut feel.

  ---

  ### Answering Your Specific Questions

  1.  **Where does publicity/explicitness matter?** Explicitness is central to **Effort Substitution (3)** and **Measurement Corruption (4)**. Agents need to *know* the metric to game it effectively. *This is the only place your meetup person's conclusion ("use gut") finds any foothold.*
      *   **Why it's weak:** As you argued, gut judgment is *also* a metric channel applicants learn to game ("narrative crafting"). The "metric" is just implicit. Hiding the rules doesn't stop gaming; it just makes the rules opaque, harder to audit, and prone to hidden biases. The *correct* conclusion is **"Use multiple metrics/channels (explicit and implicit), cap incentives, rotate/obfuscate metrics, and audit rigorously"** – not "abandon explicit metrics".

  2.  **Where does (d) - Shadow Dimensions - fit?** It's a distinct, core failure mode (#5 above). It highlights that *any* low-D summary (explicit number *or* implicit gut feeling) leaves vast swathes of the target space unconstrained. Optimization *inevitably* exploits this. It doesn't need agents; it's fundamental to optimization under incomplete measurement.

  3.  **Is there a reading of the one-liner that's straightforwardly false?** YES. The strongest, most common (mis)interpretation: **"Any proxy metric *inevitably* degrades *without bound* under *any* amount of optimization pressure."**
      *   **Why False:** Many proxies are *robust*. If `M` is highly correlated with `T`, causally connected, and captures key dimensions, *moderate* optimization on `M` improves `T`. Goodhart effects are *risks* and *asymptotic tendencies*, not universal, instant failure. Well-designed metrics with safeguards can be highly effective.

  4.  **Are the one-liner and Goodhart's 1975 claim the same?** **No.** Goodhart (1975) was narrowly about *statistical regularities collapsing under policy control* in macroeconomics (your "a" leaning on "b"). The one-liner (via Strathern/Hoskin) is a broader, pithier generalization covering the full spectrum (#1-6 above), especially the social/gaming aspects (#3, #4, #5, #6). The one-liner captures the *phenomenon* Goodhart identified, but applies it far beyond its original context and strengthens the claim.

  ---

  ### What to Say at the Next Meetup (Without Name-Dropping Laws)

  "Look, 'when a measure becomes a target, it ceases to be a good measure' is a useful warning, but it's being misapplied here as a veto against *any* explicit metrics. That one-liner actually describes at least 6 different problems. Let me lay out the key ones relevant to us:

  1.  **Gaming the Numbers:** People fudge data or focus only on what's measured. *Solution: Audit, verify, use multiple numbers.* **But narrative applications get gamed too** – people learn what stories our reviewers like and write those, neglecting other aspects of impact. Hiding the rules doesn't prevent gaming; it just hides *how* it happens.
  2.  **Missing Dimensions:** No single number (or gut feeling!) captures everything that matters. Optimizing hard on one thing ignores the rest. *Solution: Use several complementary metrics/channels (quantitative AND qualitative), cap how much weight one factor has.* **Relying *only* on two people's gut is the ultimate 'single metric' – it just hides its dimensions.**
  3.  **Regression Artifacts:** If our metric is noisy, picking the absolute top scorers might just mean we got lucky applicants, not the *truly* best. *Solution: Moderate selection pressure, look at consistency.* **This applies equally to gut scores – picking only what 'feels' 10/10 risks the same statistical trap.**

  The point isn't 'numbers bad, gut good.' **All measurement channels – numbers *and* judgment – are vulnerable to these distortions.** The question is: which approach lets us *manage* these risks better? Explicit metrics offer advantages: they're transparent (so we *can* see and fix bias/gaming), auditable, and combinable. Gut feel is opaque and hard to scale or critique.

  We shouldn't abandon numbers because of Goodhart. We should design a *system* that mitigates Goodhart effects: use a **basket of metrics** (some numbers, some narrative scores, maybe a diversity score?), **cap the stakes** for any single metric, **audit outcomes** later, and **rotate reviewers**. Pretending gut feel is immune is the biggest risk of all."

  ---

  This approach shifts the debate from a law-based veto to a nuanced discussion of *design principles* for robust evaluation, acknowledging vulnerabilities in *all* human measurement systems. Good luck!
