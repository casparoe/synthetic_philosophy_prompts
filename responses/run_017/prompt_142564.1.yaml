  | Question | Confidence | Rationale |  
  |----------|-----------|----------|  
  | 1 | 85% | Direct textual basis; F2 is a clean counterexample. |  
  | 2 | 75% | Strong alignment with 1958 + automata work; complexity thresholds are implicit. |  
  | 3 | 60% | Extrapolative; consciousness was outside his scope, but evolution/design is settled. |  
  | 4 | 80% | Funding priorities follow from his focus on theory; F2 refutation is unambiguous. |  

