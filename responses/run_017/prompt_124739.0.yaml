    Then we explain:

        - The textbook pattern (differential cost) appeared in condition 3.
        - The noisy cue condition (5) might not show the pattern perfectly, but we can point out the middle types (medium quality) and the ambiguous cue (B) led to higher signals.

    Finally, we reveal the terms: handicap principle (differential cost and wasteful expenditure), separating equilibrium, and counter-signalling.

