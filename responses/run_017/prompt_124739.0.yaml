answer: |-
  Below is a concrete, runnable game design for your seminar. It uses index cards for hidden types, signals, and decisions; envelopes for anonymized matching; and a projector to display rules/payoffs. The game progresses through six conditions, each demonstrating key concepts without using technical jargon. Reputation is blocked via one-shot anonymous matching and type reshuffling between conditions.

  ---

  ### **Game Setup**
  - **Students**: 18.
  - **Roles per round**: 9 signallers (S) and 9 receivers (R). Rotate roles each round so all students play both roles.
  - **Materials**: 
    - Index cards (type cards, signal/decision cards).
    - Envelopes (for anonymized card collection/redistribution).
    - Projector (display payoffs, matching protocol, public cues).
  - **Type distribution**: 6 Low, 6 Medium, 6 High per condition. Reassign types randomly between conditions.
  - **Signal range**: 0–10 (students write a number on their card).
  - **Rounds**: 1–2 rounds per condition (time-permitting; 1 round suffices). 6 conditions total (∼60 mins gameplay + 20-min debrief).
  - **Matching protocol**: 
    1. **Anonymity**: S write signal on card (no names). Cards go into envelopes, shuffled, redistributed randomly to R.
    2. **One-shot**: No repeat interactions. Re-pair and reshuffle types between conditions.
    3. **Blind decisions**: R accept/reject based *only* on signal (or signal + cue/index if applicable). True type revealed *after* decisions.
  - **Reputation blocking**: If students try to coordinate (e.g., "I’ll signal high!"), enforce: 
    - No talking during gameplay. 
    - Emphasize anonymity: "You’ll never interact with the same person twice." 
    - Ignore off-equilibrium promises: "Your card goes to a random stranger."

  ---

  ### **Payoff Tables (Projected)**
  **Base payoffs** (before signal costs):
  - If R accepts:  
    - S gets +10 points.  
    - R gets points based on S’s true type: **High = +10**, **Medium = 0**, **Low = –10**.  
  - If R rejects:  
    - S gets 0 points.  
    - R gets 0 points.  

  **Signal costs** (subtracted from S’s payoff *regardless* of R’s decision):  
  - **Condition 1 (Free)**: Cost = 0.  
  - **Condition 2 (Uniform cost)**: Cost = signal level (e.g., signal 4 → cost 4).  
  - **Conditions 3–6 (Differential cost)**:  
    - **Low**: Cost = 3 × signal  
    - **Medium**: Cost = 2 × signal  
    - **High**: Cost = 1 × signal  

  *(e.g., High S signalling 5 pays 5; Low S signalling 5 pays 15).*

  ---

  ### **Conditions & Instructions**
  Run sequentially. Display payoffs before each.  
  **Total rounds**: 6–12 (1–2 rounds/condition).  

  1. **Condition 1: Signals free**  
     - Goal: Experience cost-free signalling (expect: rampant lying).  
     - Rules: Signals cost 0. S choose signal (0–10). R accept/reject.  
     - Debrief seed: *"Did signals feel trustworthy? Why/why not?"*  

  2. **Condition 2: Uniform cost**  
     - Goal: See why "expensive = honest" fails (expect: mimics thrive).  
     - Rules: Signals cost = signal level (identical for all).  
     - Debrief seed: *"Did high cost stop lying? What went wrong?"*  

  3. **Condition 3: Differential cost**  
     - Goal: Feel differential cost enabling honesty (expect: separation).  
     - Rules: Differential costs (Low:3×, Med:2×, High:1×).  
     - Debrief seed: *"Could you trust signals now? What changed?"*  

  4. **Condition 4: Unfakeable index**  
     - Goal: See redundancy when index exists (expect: signals vanish).  
     - Rules: S *must* write true type on card (besides signal). R see both.  
     - Debrief seed: *"Did anyone signal? Why bother if type is revealed?"*  

  5. **Condition 5: Noisy public cue**  
     - Goal: Trigger counter-signalling (middle types signal hardest).  
     - Rules:  
       - Project a **public cue** for each S (correlated with type):  
         - **High**: 80% "A", 20% "B"  
         - **Medium**: 20% "A", 60% "B", 20% "C"  
         - **Low**: 20% "B", 80% "C"  
       - S and R see cue before S signals. Differential costs apply.  
     - Debrief seed: *"Who signalled most? Was it the highest/lowest types?"*  

  6. **Condition 6: Burn vs. gift**  
     - Goal: Prove wastefulness is essential (gifting breaks honesty).  
     - Rules:  
       - S choose: **Burn** (cost lost) or **Gift** (if R accepts, R gains cost as points).  
       - Differential costs apply.  
       - *Example*: S signals 4 (cost 12 for Low). If "gift" and R accepts, R gets +12 points.  
     - Debrief seed: *"Did gifting make signals more or less honest? Why?"*  

  ---

  ### **Debrief Script**  
  **Avoid jargon** until final recap. Use observed behaviors to derive concepts.  

  1. **Map behavior to insights**:  
     - **Cond 1/2**: "Expensive signals weren’t always honest. Why?" → *Uniform costs let mimics copy (Low S gain +10 by mimicking, even with cost 10: net 0 vs. –10 if honest).*  
     - **Cond 3**: "Suddenly signals worked! What changed?" → *Differential cost: High S pay less for the same signal (e.g., 5 vs. 15 for Low), so only they afford high signals. Mimicry stops paying.* → **Handicap principle core: Not cost, but differential cost.**  
     - **Cond 4**: "Signals disappeared" → *Honesty needs no cost if index exists.*  
     - **Cond 5**: "Medium types signalled most" → *Counter-signalling: High types rely on cue "A"; Low on "C"; ambiguous "B" forces Medium to signal.*  
     - **Cond 6**: "Gifting broke honesty" → *Burning cost wastes value; gifting transfers it, letting Low S bribe R to accept (–10 + gift > 0 for R). Waste is necessary.*  

  2. **Flag fragile condition**:  
     - **Condition 5 (noisy cue)** may not show textbook counter-signalling if:  
       - Students underuse cues (e.g., R ignore cues).  
       - Medium types signal weakly.  
     - **Recovery**: Focus on aggregate data. Ask:  
       - *"Did anyone with cue A or C signal high? Why not?"*  
       - *"Who needed signals to prove themselves?"* → Nudge toward middle types.  

  3. **Limitations of the game**:  
     - **Biology ≠ rational choice**: In nature, signals evolve via selection (not conscious choice); costs are fitness trade-offs (energy/predation risk).  
     - **Fixed types vs. evolution**: Game types are static; real traits vary genetically.  
     - **No coevolution**: Receivers’ strategies don’t adapt over generations.  
     - **Simplified ecology**: Public cues/noise in nature are more complex.  

  **Final reveal**: "What you experienced has names: **handicap principle** (differential cost ensures honesty), **separating equilibrium** (signals split types), **counter-signalling** (high/low types stay quiet). But remember—biology works over millennia, not index cards!"

  ---

  This design ensures students *feel* the logic: Differential cost (not cost alone) enables honesty, and waste (not transfer) is irreplaceable. The burn/gift round settles why signals must be "handicaps," not bribes. Constraints (anonymity, no repetition) prevent reputation shortcuts, forcing engagement with cost structures.
