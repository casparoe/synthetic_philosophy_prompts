    - Condition 3 (differential cost): we hope to see separation: high types signal at a high level, medium at medium, low at low or not at all. And receivers can set a threshold: accept only if signal >= X. Then the signal is honest.

    - Condition 4 (index): the receiver sees the type, so the signal is ignored. We expect very little signalling (maybe zero).

    - Condition 5 (noisy cue): we expect high types with cue A and low types with cue C to signal low (or zero), but medium types and those with cue B to signal high to distinguish themselves.

    - Condition 6 (burn vs gift): we expect that with the gift option, even low types will signal high and then gift, and receivers will accept them (because the gift compensates). So the signal is not honest.

    The key insight: honest signalling requires that the cost is differentially lower for higher quality individuals AND that the cost is wasted (not transferred) so that it is too expensive for low quality to mimic.

    The round most likely not to produce the textbook pattern is condition 5 (noisy public cue) because it is complex. To recover, we can show the data and explain that in the presence of a public cue, the need to signal is only for the types that are not revealed by the cue.

    What the card game cannot show: 
        - The biological reality: signals evolve over generations, not in one-shot games.
        - The cost in biology is often in terms of fitness, not points.
        - The game does not involve genetics or evolutionary dynamics, but only rational choice.
        - In biology, signals are not necessarily chosen strategically but are shaped by evolution.

    We also note that reputation was blocked by one-shot interactions and re-pairing.

  Concrete Setup for Each Condition:

    Let's define the signal level: an integer from 0 to 10.

    Payoffs:

        Signaller payoff if accepted: 10 - cost(s)
        Signaller payoff if rejected: 0 - cost(s)   [which is negative if cost(s)>0]

        Receiver payoff if accepted: 
            High: 10 
            Medium: 0 
            Low: -10
            Plus in gift condition (if accepted): + cost(s)   [but only in the gift option and accepted]
        Receiver payoff if rejected: 0

    In condition 4 (index), the receiver sees the true type so they can make a decision based on type. The signal is still charged, so the signaller might choose s=0 to avoid cost.

    In condition 5, the cue is public. How to implement: the instructor, for each signaller, draws a cue based on their type using the probabilities. The instructor then gives the cue to both players in the pair. The signaller then chooses s. The receiver sees the cue and s and decides.

    We'll run 6 conditions (including burn/gift) and one round per condition (with 9 interactions per condition).

