  Debrief Mapping:

    We'll collect the data from each condition and show aggregate results:

        For condition 1: 
            Plot signal level by type. Expect no separation.

        Condition 2: 
            Signal level by type: might see some separation if high types choose higher signals, but low types might also choose high signals. Then show that receivers were sometimes fooled.

        Condition 3:
