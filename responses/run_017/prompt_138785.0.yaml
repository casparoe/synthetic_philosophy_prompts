answer: |-
  ## Project Proposal: The Sequence-Sensitivity of Idealization in Indirect Normativity

  **Abstract:** Indirect normative theories determine what an agent has most reason to do by appealing to the verdicts of an idealized counterpart – a surrogate possessing full information, coherence, rationality, and freedom from bias. This project identifies a critical under-specification within this framework: idealized surrogates are constructed by applying multiple distinct idealizing *operations* (e.g., adding information, imposing coherence, removing bias), and there is no a priori guarantee that these operations *commute*. If the sequence of idealization affects the surrogate's final verdict, then indirect normativity yields indeterminate or arbitrary outputs until a specific sequencing is justified. This project will systematically map these operations, model their interactions and sequence-dependence, diagnose the theoretical implications for prominent indirect views, and explore the interplay with the ambiguous role of the surrogate (as advisor vs. deliberative continuation). The goal is to determine whether indirect normativity can robustly avoid sequence-sensitivity, and if not, what form it must take to remain viable.

  **1. The Core Question: Does Sequence Matter?**

  Indirect normative theories (e.g., Railton’s ideal advisor, Smith’s rational advisor, certain reflective equilibrium or constitutive aim views) posit that an agent S’s normative reasons are determined by the verdicts of an idealized surrogate S*. S* is defined by applying several idealizing operations to S: typically adding information (FullInfo), correcting factual errors (ErrorCorr), imposing coherence on beliefs and preferences (CohBel, CohPref), removing cognitive biases and motivated reasoning (NoBias), extending reasoning time/capacity (FullReason), and requiring full imaginative realization of known consequences (FullImag). **The core question is: Does the order in which these distinct idealizing operations are applied to S to generate S* affect the content of S*'s final deliberative verdict?** If the operations commute (order doesn't matter), the problem dissolves. If they do not, indirect normativity faces a critical challenge: its verdicts depend on an unjustified choice of sequence. A "depends" answer is insufficient; the project seeks a *determined* answer regarding sequence-sensitivity and its consequences. To ensure tractability, the project focuses on *deliberative* verdicts (what S* concludes S should do) and sets aside purely procedural or constitutive interpretations of idealization not yielding a specific verdict. It also assumes the surrogate is well-defined *enough* for the operations to be conceptually separable, even if actual modeling is complex.

  **2. Why Existing Views Leave the Question Open**

  Existing indirect views treat idealization as a single, holistic package ("fully informed and rational") rather than a sequence of distinct operations. They implicitly assume that turning up the "idealization dial" uniformly achieves the desired surrogate without worrying about the path taken. Consequently, the question of sequence-dependence is rarely posed explicitly. Two obvious replies fail to resolve it:

  *   **Canonical Idealization:** Proposing one specific sequence (e.g., "First FullInfo, then CohBel/CohPref, then NoBias/FullReason") as intuitive. However, this is arbitrary without independent justification. *Why* this order? Alternatives (e.g., "First CohPref/NoBias on *actual* beliefs, *then* FullInfo") seem equally intuitive in different contexts, potentially yielding divergent verdicts (as shown in Section 5). Intuition alone cannot settle the matter definitively.
  *   **Convergence Arguments:** Claiming that all "reasonable" idealizations converge on the same verdict. This is an empirical claim about the structure of reasons and deliberation under idealization, not a conceptual truth. The non-commutation examples (Section 5) directly challenge this by showing plausible sequences leading to different outcomes. Without a proof of universal convergence under all plausible sequences, this reply is question-begging.

  The ambiguity in the surrogate's role (**advisory** – S* tells S what to do, allowing opaque deference – vs. **continuation** – S* is S's own deliberation completed, demanding transparency) compounds the problem. The advisory model might tolerate more radical information asymmetry (FullInfo early), while the continuation model might necessitate a sequence preserving traceable deliberative pathways (FullInfo late, after coherence/bias removal on existing beliefs). This ambiguity interacts with sequence-dependence: sequences viable under one role may be incoherent under the other.

  **3. Methodology: Mapping, Modeling, Diagnosis (Two-Year Plan)**

  This purely conceptual project employs formal modeling and philosophical analysis to systematically investigate commutation, avoiding the pitfalls of intuitive case-work (too piecemeal) or abandoning idealization (prematurely rejecting a significant approach).

  *   **Year 1, Term 1-2: Conceptual Mapping & Role Ambiguity (Work Package 1)**
      *   *Deliverable:* A refined taxonomy of core idealizing operations (FullInfo, ErrorCorr, CohBel, CohPref, NoBias, FullReason, FullImag), precisely defining each and distinguishing their normative/logical character (e.g., informational vs. coherence-enforcing vs. procedural). Explicitly analyze the Advisory/Continuation distinction and its implications for permissible idealizations (e.g., information limits for Continuation).
      *   *Why this approach?* Intuitive case-work lacks systematicity; this provides the necessary conceptual groundwork. Abandoning idealization forfeits the chance to rigorously test its coherence.

  *   **Year 1, Term 3 - Year 2, Term 1: Modeling Interactions & Commutation (Work Package 2)**
      *   *Deliverable:* A formal framework (drawing on decision/game theory and formal epistemology) for modeling sequences of operations on agent-states. Analysis of pairwise commutation (Does Op1 then Op2 = Op2 then Op1?) for key pairs (e.g., FullInfo & CohPref; NoBias & FullReason; CohBel & FullImag). Development of illustrative "toy cases" demonstrating sequence-dependence where it occurs and invariance where it holds. Production of a commutation matrix (see Section 5).
      *   *Why this approach?* This structured analysis directly addresses the commutation question, revealing where sensitivity arises and why. Intuition alone cannot reliably predict commutation properties. Formal modeling provides clarity and rigor lacking in purely discursive critiques.

  *   **Year 2, Term 2-3: Theoretical Diagnosis & Viability Assessment (Work Package 3)**
      *   *Deliverable:* Assessment of the three main conclusions (Collapse, Principled-Ordering, Robust-Core) in light of findings from WP1 & WP2. Evaluation of how the Advisory/Continuation distinction interacts with sequence-sensitivity and each conclusion. Articulation of the minimal commitments an indirect theory must make to avoid arbitrariness.
      *   *Why this approach?* This synthesizes the analysis into a clear verdict on the viability of indirect normativity, moving beyond identifying a problem to diagnosing solutions or failure conditions. It leverages the conceptual work done to answer the core question definitively.

  **4. Possible Conclusions and Assessment**

  1.  **Collapse Verdict:** Significant sequence-sensitivity is pervasive across plausible operations and roles. No non-arbitrary way to select a sequence exists. *Implication:* Indirect normativity fails as a reductive account, yielding indeterminate or arbitrary verdicts in many (perhaps most) cases. *Deciding Factor:* Widespread, robust non-commutation demonstrated across diverse operations and agent-types in the modeling (WP2), especially for verdicts central to normative theory.
  2.  **Principled-Ordering Verdict:** While operations often don't commute, one specific sequence (or small class) is normatively privileged (e.g., Continuation demands coherence *before* massive information influx; Advisory might prioritize FullInfo). *Implication:* Indirect views survive but must incorporate a normative justification for the idealization *procedure* itself, making them less indirect than claimed (the procedure now carries normative weight). *Deciding Factor:* Identifying a sequence uniquely demanded by the nature of agency, deliberation, or the specific role (Advisory/Continuation), where alternatives generate incoherent or normatively defective surrogates.
  3.  **Robust-Core Verdict:** Significant non-commutation occurs, but only for verdicts outside a core domain. For fundamental normative questions (or under a specific role interpretation like Advisory), verdicts are sequence-invariant. *Implication:* Indirect normativity retains authority over a restricted domain, leaving many ordinary, complex cases indeterminate. *Deciding Factor:* Identifying a substantive domain of normative truths (e.g., basic prudential requirements, core moral prohibitions) or a specific surrogate role where commutation holds robustly across plausible sequences.

  **Assessment:** The **Robust-Core Verdict** is judged most likely. FullInfo interacting with coherence constraints (CohPref) is highly sequence-sensitive (see Case 1). Similarly, NoBias interacting with FullInfo can yield different "unbiased" interpretations depending on informational context. However, for very coarse-grained verdicts (e.g., "don't cause gratuitous suffering to innocents") or under a purely Advisory model that tolerates massive information asymmetry, some invariance seems plausible. The Continuation role likely exacerbates sequence-sensitivity due to transparency demands. A full Collapse is possible if core verdicts also show sensitivity. Principled-Ordering seems least likely; justifying a *unique* sequence normatively is a tall order and risks circularity.

  **5. Illustrative Cases and Commutation Matrix**

  *   **Case 1 (Sequence Matters - CohPref & FullInfo):** Agent S has inconsistent preferences: she prefers A to B, B to C, but C to A (intransitive cycle). She is unaware of consequence X of choosing A.
      *   *Sequence A (CohPref then FullInfo):* CohPref first forces S to resolve the inconsistency (e.g., drop C>A). *Then* FullInfo reveals X. The now-coherent-and-informed S* decides based on her revised preferences and X.
      *   *Sequence B (FullInfo then CohPref):* FullInfo first reveals X. *Then* CohPref forces coherence on preferences that now incorporate the (potentially complicating) knowledge of X. The resolution of the cycle might differ significantly (e.g., she might drop a different preference link) due to the presence of X.
      *   *Verdict Divergence:* S* under Sequence A might choose A (knowing X but with preferences resolved without X's influence), while S* under Sequence B, influenced by X during coherence resolution, might choose C. The cost and nature of achieving coherence depend on the informational context.

  *   **Case 2 (Sequence *May* Not Matter - NoBias & FullReason):** Agent S suffers from strong confirmation bias regarding policy P and has limited time to deliberate.
      *   *Sequence A (NoBias then FullReason):* Remove bias first. Unbiased-S then reasons fully. She impartially weighs evidence for/against P.
      *   *Sequence B (FullReason then NoBias):* Give S unlimited time first. Biased-S reasons extensively, but her bias distorts her evidence gathering/weighting. *Then* remove the bias. The now-unbiased S* must confront the distorted belief state produced by biased full reasoning.
      *   *Potential Convergence/Divergence:* If FullReason, even biased, tends to uncover sufficient counter-evidence to overcome the initial bias *in this specific case*, verdicts *might* converge. However, if biased FullReason entrenches false beliefs (e.g., via motivated reasoning on abundant data), the distorted state NoBias must correct could lead to a different verdict than if bias was removed first. Non-commutation is plausible.

  **Commutation Matrix (Preliminary Assessment):**
  | Operation 1 ↓ \ Operation 2 → | FullInfo | CohPref | NoBias | FullReason |
  | :---------------------------- | :------- | :------ | :----- | :--------- |
  | **FullInfo**                  | N/A      | **No**  | **?**  | **Likely Yes** |
  | **CohPref**                   | **No**   | N/A     | **Likely Yes** | **Likely Yes** |
  | **NoBias**                    | **?**    | **Likely Yes** | N/A    | **Plausibly No** |
  | **FullReason**                | **Likely Yes** | **Likely Yes** | **Plausibly No** | N/A |

  *   **FullInfo & CohPref:** **No** (Case 1). Coherence costs depend on information state.
  *   **FullInfo & NoBias:** **?** Highly dependent on the bias. Does bias depend on specific false beliefs (ErrorCorr might suffice)? Or is it a deep cognitive distortion? FullInfo first might "cure" some biases, others might distort interpretation of new info. Non-commutation likely in many cases.
  *   **FullInfo & FullReason:** **Likely Yes.** Giving more info before or after unlimited reasoning plausibly leads to the same outcome (reasoning incorporates all available info eventually).
  *   **CohPref & NoBias:** **Likely Yes.** Removing bias likely doesn't change the *structure* of coherent preferences needed, just the inputs. Biases might cause inconsistent preferences, but CohPref fixes the structure regardless of source.
  *   **CohPref & FullReason:** **Likely Yes.** Achieving coherence is a structural constraint; having more time to reason about preferences doesn't change the coherence requirement itself.
  *   **NoBias & FullReason:** **Plausibly No** (Case 2). Reasoning while biased can create entrenched distortions that are harder to correct than preventing the bias from influencing reasoning in the first place.

  **6. Scope, Risks, Failure Conditions, and Minimum Viability**

  *   **Scope Creep:** The risk of proliferating operations or endlessly nuanced cases is real. **Mitigation:** Strict adherence to the core taxonomy (WP1); focus on most theoretically central pairs/sequences; prioritize illustrative over exhaustive modeling.
  *   **Restatement Risk:** Could this just be the familiar "Which idealization?"/indeterminacy problem? **Mitigation:** The novelty lies in rigorously analyzing the *interdependence* and *sequential logic* of distinct operations, proving non-commutation formally/in models, and explicitly linking it to the Advisory/Continuation ambiguity. This provides a new, precise mechanism for generating indeterminacy where previously only intuition suggested it.
  *   **Intractability:** Modeling complex sequences formally might prove too difficult. **Mitigation:** Employ simplified but revealing toy models and focus on pairwise interactions initially. Conceptual analysis suffices to demonstrate the *possibility* and *significance* of non-commutation.
  *   **Failure to Find Sensitivity:** If most key operations commute robustly, the project's negative thesis fails. **Response:** This would be a significant *positive* result, bolstering indirect views by resolving a potential objection. The commutation matrix itself would be valuable.
  *   **Smallest Valuable Result:** Even without a grand unified verdict, producing a rigorously defended **Commutation Matrix** (as in Section 5) identifying which pairs of core operations commute (and under which surrogate roles) would be a major contribution. It would provide essential guidance for theorists developing or refining indirect views, highlighting where sequencing choices are critical and potentially problematic. This deliverable (from WP2) alone would make the project worthwhile, forcing greater precision in idealization specifications.
  *   **Useful Deliverable:** Beyond publications, the final report's structured analysis of specific operation pairs and their commutation properties, tied to the Advisory/Continuation roles, will provide a crucial reference point and diagnostic tool for anyone working on idealized agent accounts in metaethics, decision theory, or political philosophy. It moves the discussion beyond vague appeals to "full rationality" towards a precise understanding of its component mechanisms and their interaction.

  This project tackles a fundamental but neglected structural question at the heart of influential metaethical and rational choice theories. By dissecting the idealization procedure and rigorously testing its sequence-sensitivity, it promises to either significantly strengthen indirect normativity by clarifying its foundations or reveal a deep indeterminacy requiring substantial theoretical revision. The purely conceptual, armchair methodology is not just adequate but essential for probing these foundational assumptions about rationality and normativity.
