prompt: |-
  You are a professional philosopher specializing in metaethics and the theory of rationality, with a working knowledge of formal epistemology and of the way idealization is modeled in decision theory. You also have a track record of winning competitive research fellowships. Please think carefully, and before drafting anything, do a short unstructured brainstorm: (i) list the distinct operations that get bundled together under the heading of idealizing an agent (adding information, correcting factual error, imposing coherence on beliefs and on ends, removing motivated or self-serving reasoning, extending reasoning time, requiring full imaginative realization of what one already knows, and so on); (ii) for each pair, ask whether the order in which you apply them could change what the idealized agent ends up deliberating to; (iii) list the three strongest things a defender of an indirect view would say in reply. Keep the brainstorm brief and do not include it in the final deliverable.

  Now write the proposal itself.

  The context: I am applying for a two-year postdoctoral fellowship at an institute that funds conceptually focused, high-risk work with no empirical component. Reviewers are generalist philosophers, so the proposal has to be legible to a non-specialist while still making a contribution a specialist would recognize. Do not include a bibliography or any citations — I will insert the references myself — but feel free to gesture at well-known positions and arguments by description. Target length: 1,400–1,600 words, with section headings, a one-paragraph abstract at the top, and a closing section on risks and failure conditions.

  The topic. By indirect normativity I mean the family of views on which what an agent has most reason to do is not settled directly by her actual reasons, but by some idealized surrogate: what a fully informed, fully coherent, unbiased counterpart of her would deliberate her way to, or would advise her to do. My half-formed idea is that these views are under-specified in a way the literature has not taken seriously, because the surrogates are generated by applying several distinct idealizing operations at once, and there is no reason to assume those operations commute. If they do not, then what the idealized agent says depends on the order in which you idealized, and the theory has no determinate verdict until an order is specified. I want this turned into a proposal.

  A second half-formed idea I want you to use: distinguish two roles the idealized verdict can play. It can be modeled as advice issued to the actual agent by someone who knows more than she does, in which case opaque deference seems permissible — she may rationally do what she is told without being able to see why. Or it can be modeled as her own deliberation carried through to completion, in which case transparency seems required, and a verdict she cannot in principle follow the reasoning to is not available to her. Call this the advisory/continuation ambiguity. My sense is that the two readings pull in opposite directions on how much information the surrogate may have, and that this interacts with the ordering problem rather than sitting alongside it.

  What I need the proposal to contain:

  1. The question, stated so that it has a determinate answer and so that it depends is not an acceptable response. If you think my framing needs restricting to make it tractable, restrict it and say what you set aside.

  2. Why the existing positions leave the question open: what indirect views need from their surrogates, why they have treated the surrogate as a single thing arrived at by turning up the idealization, and why the obvious replies — pick a canonical idealization and defend it on intuitive grounds, or argue that reasonable idealizations converge — do not settle it.

  3. The method, sequenced by term or quarter across two years rather than month by month, with three or so work packages and a deliverable for each. Say explicitly why this approach is better than the two obvious alternatives: doing more intuitive case-work about which idealization feels right, or abandoning idealization and going fully non-ideal in the way recent critics urge. Explain how an armchair project makes genuine progress here, since there is no empirical component to lean on.

  4. The possible conclusions, named and distinguished. My guesses are: a collapse verdict, on which indirect normativity is revealed as a family of theories with no determinate output and so fails as a reductive account; a principled-ordering verdict, on which some sequencing of the operations is itself normatively privileged, which would mean the idealization procedure carries normative weight the view was not supposed to need and the theory is less indirect than advertised; and a robust-core verdict, on which only the order-invariant verdicts bind, preserving a central domain of application at the cost of leaving many ordinary cases indeterminate. For each, say what would decide for or against it, and give your own assessment of which is most likely.

  5. At least two worked toy cases, one of which should be a case where the ordering clearly matters, and a small table or matrix showing, for a handful of idealizing operations, whether they plausibly commute and why.

  6. Honest scope and failure conditions. When would this project be too big for two years, or turn out to be a restatement of a familiar indeterminacy worry about full-information accounts rather than a new argument? What is the smallest result that would still make the project worth funding, and what deliverable would actually be useful to someone working on these views?
