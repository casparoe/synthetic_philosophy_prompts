prompt: |-
  You are a philosopher of mind and cognitive science who has published on the extended mind thesis and on the metaphysics of cognitive artefacts. Please think this through carefully: before you answer, spend a paragraph or two brainstorming what a practice like the one below could be for, and what the least charitable reading of it would be, so that you don't simply rationalise the status quo. Then give me the reconstruction.

  I sit on my university's assessment committee, and we are rewriting the rules on which external resources students may use in exams. The existing patchwork is what I want you to analyse. Closed-book exams are the default, but many courses permit one handwritten page of notes or an instructor-supplied formula sheet. Printed or photographed solutions to similar problems are banned even when the student made them herself. Calculators are permitted in some courses and not others, apparently depending on whether the course is meant to certify arithmetic fluency. Spell-check and error-flagging grammar tools are fine; autocomplete that proposes sentence continuations is not. Dictation software and human scribes are granted as accommodations to students with diagnosed dysgraphia, while the very same software used by a student without a diagnosis counts as a violation. And our honour code defines academic dishonesty as presenting as one's own work, or knowledge, that is not one's own.

  The last clause is what keeps bothering me, because it looks like the whole system rests on an ownership relation between a person and a piece of knowledge that I can't spell out — and because the thing we permit (a formula sheet, i.e. an external store consulted at need) is structurally the closest to the paradigm case in the extended mind literature, while the thing we forbid (a tool that transforms input into output) is the case people usually treat as merely causal scaffolding. So: what theory of cognition, and of the boundary between a person and her tools, does this patchwork presuppose? Reconstruct the implicit view in the vocabulary of the extended mind debate, including whether it has to commit itself to anything like a parity principle or to the familiar checklist about an external resource being reliably available, automatically endorsed and easily accessible (I'm paraphrasing that from memory, so correct me if I have it wrong). Then separate what the practice strictly presupposes from what it merely fits well with: does any part of it actually require the falsity of the extended mind thesis, or is every rule compatible with it, and does the storage-versus-processing distinction our rules rely on survive scrutiny? Tell me too whether the practice is better explained without any metaphysics at all — as a view about what a grade certifies, about credit, fairness, or portability across contexts — and, if so, which rival theories of mind would license exactly the same rules, so that the rules are philosophically underdetermined.

  Finally, be concrete about the counterfactual: if the committee took the extended mind thesis seriously, what would have to change? Is a closed-book exam then morally akin to testing a student with part of her memory temporarily disabled, and if the analogy fails, where exactly does it fail? What becomes of the honour code's ownership language — what could it mean for a belief or a piece of knowledge to be someone's own — and what becomes of the line between an accommodation and a cheat, given that both work by coupling a student to an external system? Please also flag where you think we are simply inconsistent and where the apparent inconsistency dissolves under a better description, and be explicit about which of your claims are contested in the literature and which are ones you'd defend without hedging. Argue from the structure of the cases rather than from sources: I need something I can circulate to a committee of non-philosophers, so no citations, no footnotes and no suggested reading. Put the reconstruction first, the diagnosis of incoherence second, and any recommendations last, and mark clearly when you are speaking as a philosopher and when you are speaking as someone with a view about how a university should be run.
reasoning: |-
  Hmm, I need to analyze this assessment committee's rules through the lens of extended mind theory. The user is a philosopher of mind familiar with cognitive artefacts, so I should approach this rigorously while keeping it accessible for non-philosopher committee members.

  First, I'll brainstorm the possible purposes behind these rules. The least charitable reading would be that they're arbitrary gatekeeping tools designed to preserve academic hierarchy by controlling knowledge access. More charitably, they might aim to certify different cognitive skills: memorization, problem-solving, tool mastery, or raw computational ability. The dysgraphia accommodation highlights how disability status creates a sharp boundary that feels morally significant but cognitively arbitrary.

  The key tension is between the honour code's emphasis on "owning knowledge" and the permitted external resources. The handwritten notes permission looks exactly like Clark and Chalmers' Otto's notebook example - yet the ban on photographed solutions suggests a deep distinction between storage and processing. The calculator rules imply that arithmetic isn't considered part of "real" cognition in advanced courses, while grammar tools get partial acceptance but autocomplete doesn't.

  For reconstruction, the implicit view seems to be: 1) Cognition ends at the skull, 2) Storage devices can be "transparent" extensions if personally created (handwritten notes), 3) Processing tools are always "opaque" scaffolding, 4) Disabilities create moral exceptions to cognitive boundaries. This rejects the parity principle - external resources aren't treated equally to internal capacities regardless of implementation. 

  The storage/processing distinction collapses under scrutiny. Using a formula sheet involves interpretive processing, while mental calculation is a stored algorithm. Spell-check automates what some students do internally. The rules are philosophically underdetermined - they could equally stem from credentialist views (grades certify raw ability) or situated cognition theories.

  If we took extended mind seriously: Closed-book exams would indeed resemble disabling part of someone's mind. The honour code's "owning knowledge" would need redefinition as "maintaining reliable cognitive coupling." Accommodations and tools would differ only in coupling reliability, not kind. But practical concerns remain: How do we prevent privilege amplification? How to assess coupled systems fairly?

  Recommendations: 1) Admit the storage/processing distinction is pragmatic, not metaphysical, 2) Frame permissions around what skills we aim to certify, 3) Make disability accommodations the model for all, 4) Replace "ownership" with "responsible coupling" in the honour code. The core inconsistency is treating identical cognitive processes differently based on implementation location - a failure of the parity principle.
answer: |-
  ### Reconstruction of the Implicit View (Extended Mind Framework)
  The assessment rules presuppose a **cognitivist internalism**: cognition ends at the biological brain, and external resources are merely instrumental tools. This view implicitly distinguishes between:
  - **Storage vs. Processing**: Permitted resources (formula sheets, spell-check) are passive "reference libraries" – they *store* information but don’t *generate* cognitive labor. Banned resources (autocomplete, solution sheets) are active processors that *replace* cognitive work.  
  - **Personalization vs. Automation**: Handwritten notes are allowed because they reflect *personal synthesis* (e.g., selecting/formulating content). Photographed solutions are banned because they bypass synthesis, even if self-made, implying the *act of retrieval* must be "earned" internally.  
  - **Scaffolding vs. Incorporation**: Calculators are permitted in non-arithmetic courses because they’re deemed "scaffolding" for higher thinking (irrelevant to certified skills). Grammar tools are tolerated as "prosthetics" for low-level errors, but autocomplete is forbidden as it intrudes on *constitutive* thought processes.  
  - **Accommodation as Compensation**: Tools for dysgraphia are framed as restoring "normal" function (internal cognition intact), while non-disabled use of identical tools "augments" cognition unnaturally.  

  The rules **reject the parity principle** (equal treatment of internal/external processes if functionally identical). Instead, they adopt a **checklist of permissibility**: external resources must be (1) *reliably available* (formula sheets), (2) *not automatically endorsed* (no autocomplete), and (3) *not generative* (no solution sheets). Accessibility is secondary (scribes require diagnosis). The honour code’s "ownership" implies knowledge must be *biologically instantiated* to count as "one’s own."  

  ---

  ### Diagnosis of Incoherence  
  1. **Storage/Processing Distinction Collapses**:  
     - A formula sheet consulted to solve a problem *is* part of a coupled process; its use involves pattern-matching and decision-making indistinguishable from "internal" recall. Banning photographed solutions (a stored representation of *personal* reasoning) while allowing handwritten notes privileges *medium* over *function*.  
     - Spell-check flags errors (permitted processing), but autocomplete proposes continuations (banned processing). Both automate tasks some students perform internally – the line is arbitrary.  

  2. **Inconsistent Treatment of Externalization**:  
     - Handwritten notes are "incorporated" (extended mind), yet identical content in photographed form is "merely causal." This contradicts functionalism: if the resource plays the same role, implementation shouldn’t matter.  
     - Dysgraphia accommodations reveal the flaw: if dictation software *is* part of a disabled student’s cognitive system (per extended mind), why is it "cheating" for others? The boundary isn’t metaphysical but medicalized.  

  3. **Honour Code Contradiction**:  
     - Claiming knowledge must be "one’s own" while allowing formula sheets implies ownership can *include* reliable external stores. Yet banning self-made solution sheets denies that ownership extends to *externalized problem-solving*.  

  **Where Incoherence Dissolves**:  
     - The calculator policy coheres if arithmetic fluency is a certified skill (e.g., in math fundamentals). This is *pragmatic* (certifying context-specific abilities) not metaphysical.  
     - Grammar tools vs. autocomplete *might* reflect certifying *compositional skill* – but this isn’t consistently applied (spell-check still processes language).  

  **Philosophical Underdetermination**:  
  The rules fit multiple theories:  
  - **Internalism**: Cognition is skull-bound; tools are aids.  
  - **Credentialism**: Grades certify context-independent abilities (e.g., unaided recall).  
  - **Fairness/Pragmatism**: Uniformity prevents inequity (e.g., some can’t afford tech).  
  - **Extended Mind**: All rules *could* be compatible *if* reliability/access criteria were met, but the bans on "processing" tools reject this.  

  ---

  ### Recommendations (as Philosopher & Committee Member)  
  **As Philosopher**:  
  - The practice **presupposes internalism** but doesn’t *require* its truth. It’s compatible with extended mind if reinterpreting "ownership" as *reliable cognitive integration*.  
  - Closed-book exams **are** like disabling memory *if* notes are part of a student’s cognitive system. The analogy fails only if cognition is *defined* as internal – a circular defense.  
  - The storage/processing distinction **doesn’t survive scrutiny**: all tool-use involves coupled processing (e.g., interpreting a formula sheet).  

  **As Committee Member**:  
  1. **Reframe Permissions Around Skills Certified**:  
     - Explicitly state what an exam assesses (e.g., "recall under pressure," "synthesizing solutions"). Allow tools irrelevant to those goals. *Example:* Permit calculators everywhere if arithmetic isn’t core.  
     - Drop the handwritten/photograph distinction; allow *any* self-created reference if synthesis is certified elsewhere.  

  2. **Redefine "Ownership" in Honour Code**:  
     - Replace "knowledge one’s own" with **"cognitive work for which the student is responsibly coupled."** This covers internal recall *and* well-integrated tools.  

  3. **Universal Design Over Accommodations**:  
     - Offer dictation/scribes to *all* students. If the tool is "cheating," it’s cheating for everyone; if it enables valid assessment, it’s valid for all. Diagnoses medicalize a false cognitive boundary.  

  4. **Sunset Arbitrary Bans**:  
     - Autocomplete/grammar tools: Permit them if the certified skill is *argumentation*, not sentence mechanics. Ban only if assessing raw composition.  

  **Counterfactual**: Taking extended mind seriously means **grading the coupled system** (student + permitted tools). This doesn’t erode rigor – it assesses real-world cognitive ecosystems. The moral failure isn’t "disabling memory"; it’s *artificially constraining cognition* to biological limits when integrated tools exist. Fairness isn’t equal deprivation, but equal access to augmentation.  

  **Final Note**: The core inconsistency isn’t philosophical but practical: we let students *be* cyborgs in some contexts (notes, spell-check) but police the boundary elsewhere. Consistency demands we choose: either defend internalism coherently (ban *all* external aids) or embrace integration (permit all reliable, personalized tools). The current patchwork is indefensible.
