answer: |-
  ### (1) Exam Question (90 minutes, 1000 words max)  
  **Methods in Scientific Inference - Hempel’s Raven Paradox Revisited**  

  Two ecologists study Hypothesis H: "All ravens on Island X are black." Island X has a **closed, fixed population of exactly 200 ravens**. They consider two protocols:  
  - **Protocol A**: Visit all nesting sites and record the colour of every raven observed.  
  - **Protocol B**: Select a random geographic point, walk a 1 km transect, and record every *non-black* object encountered, noting if it is a raven.  

  Under Protocol B, a researcher records a white plastic bottle washed ashore. Call an observation’s **counterfactual yield** the set of possible outcomes *the same protocol could have produced*. For example:  
  - Under Protocol B, the bottle’s counterfactual yield includes finding a non-black raven (refuting H).  
  - Under Protocol A, observing a black raven has a counterfactual yield excluding non-ravens.  

  **Questions:**  
  1. Does observing the white plastic bottle under Protocol B confirm H? Does observing a black shoe under Protocol B confirm H? Explain using the concept of counterfactual yield.  
  2. Would your answer change if the bottle had been observed under Protocol A? Justify.  
  3. How does restricting H to a *closed population of 200 ravens* (rather than "all ravens everywhere") alter the paradox?  
  4. Discuss: What does this reveal about scientific confirmation? Is it about prediction, intervention, or probabilistic support?  

  ---

  ### (2) Model Answer (~600 words)  

  **(1) Confirmation under Protocol B**  
  Observing the white bottle under Protocol B does **not** meaningfully confirm H. While Hempel’s equivalence condition suggests that non-black non-ravens (like the bottle) confirm "All ravens are black" via contraposition ("All non-black things are non-ravens"), this ignores protocol design. The counterfactual yield of Protocol B includes possible non-black ravens. Critically, the bottle *fails to rule out alternatives*: H remains unscathed only because no non-black raven was *sampled*, not because evidence positively supports it. Protocol B’s yield is saturated with irrelevant non-ravens (bottles, shoes, rocks), making "no non-black raven observed" unsurprising *even if H were false*. Thus, the bottle lacks *severity* (Mayo 1996): it does not probe H’s risk of falsification. The same applies to a black shoe—it "confirms" H trivially but uninformatively.  

  **(2) Protocol A vs. Protocol B**  
  Under Protocol A, observing the bottle is **impossible**—the protocol only records ravens. If a raven *were* observed (e.g., a black raven), its counterfactual yield includes non-black ravens. Finding only black ravens *does* confirm H because the protocol tests ravens directly, making non-black ravens detectable. The bottle under B confirms H only in an empty logical sense; under A, it is irrelevant. The protocol dictates *what evidence is diagnostically meaningful*.  

  **(3) Closed Population vs. Universal Hypothesis**  
  The closed population (200 ravens) **defangs the paradox**. For universal H ("all ravens everywhere"), non-black non-ravens *seem* confirmatory because sampling is open-ended: a white shoe could hypothetically precede a non-black raven discovery. But on Island X, with 200 fixed ravens, the hypothesis is a finite conjunction: H ≡ "Raven 1 is black ∧ Raven 2 is black ∧ ... ∧ Raven 200 is black." Protocol A verifies each conjunct directly. Protocol B’s random sampling becomes **redundant**: finding non-black non-ravens does not reduce uncertainty about ravens, as ravens are a distinct, finite set. Non-ravens are irrelevant to the closed system.  

  **(4) Purpose of Confirmation**  
  Confirmation should serve **predictive accuracy or interventionist guidance**—not merely raise probabilities (Howson 2000). Under Protocol B, the bottle marginally increases H’s probability (if non-ravens are abundant), but this is epistemically inert: it cannot guide interventions (e.g., "if I see another bottle, are ravens safe?"). Protocol A produces evidence that refines predictions about raven colour distributions. The paradox thus exposes a flaw in purely probabilistic accounts (e.g., Bayesianism) that detach confirmation from experimental design. Effective confirmation requires evidence from procedures that *could have falsified* the hypothesis (Popper 1959), which Protocol B fails to ensure for H.  

  ---

  ### (3) Marking Scheme (Total: 20 marks)  
  **Must-hit points** (Award marks proportionally for partial credit):  

  | **Key Point**                                     | **Marks** | **Common Fumbles** |
  |---------------------------------------------------|-----------|--------------------|
  | **1. Rejects simple contrapositive resolution** (Equivalence condition is insufficient; must invoke background knowledge/design) | 4 | Students recite "non-black non-ravens confirm" without critique. Ignores role of protocol. |
  | **2. Applies counterfactual yield correctly**: <br> - For B: Yield includes non-black ravens → bottle lacks falsification power. <br> - For A: Yield excludes non-ravens → bottle irrelevant. | 5 | Confuses yield with likelihood. Fails to contrast protocols. Assumes bottle is "evidence" under A. |
  | **3. Closed population analysis**: <br> - Finite conjunction vs. universal generalization. <br> - Non-ravens irrelevant when ravens are fixed/identifiable. | 5 | Treats closed/unrestricted H identically. Misses that B’s sampling is redundant for fixed set. |
  | **4. Links confirmation to purpose**: <br> - Distinguishes probabilistic support from predictive/interventionist utility. <br> - Cites severity or risk of falsification. | 4 | Only discusses probability/likelihood. No critique of "confirmation as probability increase." |
  | **5. Structure/clarity**: Logical flow, concision, no major omissions. | 2 | Digressions into Nicod/Hempel history without synthesis. |

  ---

  **Notes for Markers**:  
  - **A/A+ (16–20)**: Hits all 5 points. Explicitly ties counterfactual yield to *severity of test* or *experimental design*. Contrasts closed/universal H.  
  - **B (12–15)**: Addresses protocols and counterfactuals but vague on "purpose of confirmation" or closed populations.  
  - **C (8–11)**: Relies on contrapositive argument; superficial treatment of protocols.  
  - **D/E (<8)**: Ignores counterfactual yield; universalizes paradox; conflates protocols.  

  ---  
  **Rationale**: This scheme forces engagement beyond textbook paradox resolutions. Top answers recognize that confirmation depends on *how data is generated* (not just content) and that finite populations collapse sampling-based objections. The "purpose" point challenges naive probabilism—aligning with contemporary philosophy (e.g., Mayo’s error statistics).
