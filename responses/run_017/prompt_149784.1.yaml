  - **No** → **Leaf: Source Incompatibilism**.  

  #### **Node 7: Practice Justification**  
  *Claim: "Even if she doesn't deserve blame, should we still blame her to encourage better behavior in her or others?"*  
  - **Yes** → **Leaf: Revisionism (Forward-Looking)**.  
  - **No** → **Leaf: Hard Incompatibilism / Skepticism**.  

