  ### **Decision Tree for Moral Responsibility**
  **Start**: An intelligent reader (unfamiliar with Frankfurt) considers a Frankfurt-style case: *The protagonist acts as she wants without intervention, but a device would have forced her to act that way if she wavered. Is she morally responsible (blameworthy)?*  

  #### **Node 1: Standard Frankfurt Case**  
  *Claim: "The device made it impossible for her to do otherwise—she was locked into her action. Does this lack of alternative possibility mean she isn't blameworthy?"*  
  - **Yes** (PAP upheld) → Go to Node 2.  
  - **No** (PAP rejected) → Go to Node 4.  

  #### **Node 2: Artifact Alternative Variant**  
  *Claim: "But what if the device induced a twitch of hesitation—an artificial alternative? She still couldn't truly succeed in doing otherwise, but she had a flicker of avoidance. Does this change anything?"*  
  - **Yes** (The artifact alternative suffices for blame) → Go to Node 3.  
  - **No** (The artifact alternative is irrelevant) → Go to Node 5.  

  #### **Node 3: Determinism Compatibility**  
  *Claim: "Suppose her actions were determined by prior causes (e.g., her genes, upbringing). Could she still be blameworthy if she had alternatives like the twitch?"*  
  - **Yes** → **Leaf: Leeway Compatibilism** (unnamed).  
  - **No** → **Leaf: Leeway Incompatibilism**.  

  #### **Node 4: Preemptive Self-Alteration Variant**  
  *Claim: "Years ago, she freely chose to become the sort of person the device wouldn't correct. She acts now without intervention. Is she blameworthy for her action?"*  
  - **Yes** (Her history matters) → Go to Node 6.  
  - **No** (Her history is irrelevant or insufficient) → Go to Node 7.  

  #### **Node 5: Trying-and-Failing Variant**  
  *Claim: "What if her only alternative was to feel a pull or try to do otherwise but fail? She never acts on it. Does this 'inner struggle' make her blameworthy?"*  
