prompt: |-
  I write software for a living and read about statistics and the philosophy of science on the side, so I know the standard Bayesian machinery — priors, likelihoods, updating by conditioning — but I have no formal philosophy training, and I keep running into a distinction I cannot name. Here are the three situations I cannot keep apart.

  First, my own work. I have a dataset, I plot it, I notice a kink, and then I write a model with a term that produces the kink. The model fits beautifully. I do not feel entitled to say the data confirmed the model, because I chose the model after looking at the data. In my field the remedy is mechanical: hold out data the model never saw and check it there.

  Second, a case from physics. A theory is built partly to account for a fact that astronomers had known for decades — the residual, unexplained precession of Mercury's perihelion, recognised as an anomaly since 1859 and still unexplained when general relativity arrived — and that accommodation is routinely counted among the strongest evidence for the theory. The shape looks identical to my first case: the fact was sitting there first, and the theory was shaped to fit it. But nobody reaches for a held-out set, and the fit is treated as genuine support rather than as cheating.

  Third, the formalism, as I understand it, says the second case should not work at all. If I already know a fact, I assign it probability one, and conditioning on something of probability one cannot move any probability. So an already-known fact cannot raise the probability of any hypothesis, however elegantly the hypothesis explains it. On that telling, case one and case two come out the same way, and both come out badly, which is the opposite of what the physicists and my own instincts say.

  So my question: is there a name for what I am circling, and is it one thing or several?

  Is whatever makes case one illegitimate the same thing that makes case three a problem, or are these two separate complaints that merely look alike in a formalism that only tracks probabilities?

  My own hypothesis is that the variable that matters is not whether the fact was known before the theory existed, but whether the fact was in front of the theorist while the theory was being built — whether I had that data point on my screen when I chose the functional form. Someone who fixed the model first and only then looked at the data would be entitled to count it, even if the data had been sitting in a filing cabinet for fifty years. Is there an established concept for that distinction, and does it line up with whatever the philosophy literature calls the problem in case three?

  A related guess, which I lack the vocabulary to state properly: perhaps what does the work is not how probable the fact was to me, but how probable it was that a theory of this kind would manage to fit it at all. My model's kink term could have fit anything, so the fit tells me little; general relativity could easily have failed to reproduce the Mercury residual, and that it did not is the news. Is that a different thing from the first distinction, or the same thing in other words?

  Finally, does my train/test split capture any of this? It seems to me to measure predictive accuracy on unseen cases, which is a different virtue from being supported by a fact: a model can predict well while being wrong about why.

  I do not want references or a reading list. I want the carving: what the phenomenon is, what it is not, where its edges are, and which nearby concepts attach to which of my three cases. If part of what I am describing has no established name, say so and give me a working label with a definition, plus the boundary cases that would settle whether it applies.
reasoning: |-
  Okay, let's tackle this problem step by step. The user is a software developer with a strong grasp of Bayesian statistics but lacks formal philosophy training. They're struggling with a distinction between three scenarios involving theory confirmation and data fitting. 

  First, I need to unpack their three cases clearly. The first scenario is about their own work: they notice a kink in data, build a model to fit it, but feel this doesn't count as true confirmation. Their field uses train-test splits as a solution. The second case is from physics: General Relativity was developed partly to explain Mercury's precession, and this fit is considered strong evidence despite the data being known beforehand. The third issue is formal: Bayesian updating says known facts (P=1) can't support hypotheses.

  Hmm, the core tension is why case 2 is valid while case 1 isn't, especially when formalism seems to reject both. The user's hypotheses point to key nuances: whether data was visible during theory-building, and the riskiness of the fit. 

  I recall that in philosophy of science, this touches on accommodation vs. prediction. Accommodation is fitting existing data, prediction is forecasting new data. But the Mercury example complicates this—it's accommodation yet still evidential. Why? Because General Relativity was a broad framework that could've failed to explain it, making the fit surprising. Whereas the user's kink-term feels ad hoc, designed solely for that pattern.

  The Bayesian problem is trickier. The user's right that P(known fact)=1 blocks updating. But in practice, we don't actually assign probability 1 to observations. There's always measurement error or possible revisions. Still, this feels unsatisfying. Better to think in terms of how the hypothesis constrains possibilities: if it's flexible (like the kink-term), fitting is easy; if it's rigid (like GR), fitting is informative.

  Their train/test split is useful but targets predictive accuracy, not explanatory depth. A model can predict well but be wrong—like epicycles. So it solves case 1's overfitting but doesn't address why case 2 works.

  The user's intuition about "data visibility during theorizing" is insightful but not the full story. What matters more is theory flexibility. GR's structure wasn't reverse-engineered for Mercury; it was derived from deeper principles. The kink-term lacks that independence.

  I should emphasize that case 2's strength comes from multiple factors: the anomaly was longstanding (so many attempts failed), GR explained it naturally (not forced), and it made novel predictions (light bending). It's the package that counts.

  For their third case, the Bayesian formalism is too rigid. We need to think counterfactually: "If GR were false, how likely is Mercury's precession?" That probability isn't 1—it's high only if alternative theories could explain it, which they couldn't. The update happens not on the fact itself but on the fact being explained by this specific mechanism.

  The user's "riskiness" point nails it: it's about P(fit | theory) vs. P(fit | ~theory). For GR, P(fit | ~theory) was low because competitors flopped; for the kink-model, P(fit | ~true model) is high since many models could fit. Train/test splits lower P(fit | ~true model) by demanding generalization.

  So the concepts they need are: 
  - Accommodation vs. prediction (but with caveats for Mercury)
  - Ad hoc vs. non-ad hoc hypotheses
  - Riskiness of a fit (explanatory constraint)
  - Bayesian "old evidence" problem

  I'll define these sharply and map them to their cases, noting where lines blur. The key is that legitimacy hinges on whether the theory's structure makes the fit unsurprising (bad) or surprising (good)—which depends on theory scope and prior failures.
answer: |-
  Your inquiry cuts to the heart of theory confirmation, touching on deep issues in epistemology and philosophy of science. Below is a precise carving of the phenomena, using your cases as anchors. The core distinctions involve **explanatory constraint**, **temporal/data visibility status**, and the **riskiness of the fit**.

  ---

  ### **1. The Core Distinction: Explanatory Constraint vs. Data-Snooping**
  The primary split is between two phenomena:
  - **Accommodation with Constraint (Legitimate)**: A theory explains a known fact *because* it is tightly constrained by independent principles or mechanisms, making the fit non-arbitrary.  
  - **Ad Hoc Accommodation (Illegitimate)**: A theory is modified *solely* to fit a known fact, with no independent justification.  

  This resolves your cases:  
  - **Your Model (Case 1)** is **ad hoc accommodation**: The "kink term" exists only because you saw the kink. It lacks independent motivation (e.g., derived from first principles or prior theory).  
  - **General Relativity (GR) (Case 2)** is **accommodation with constraint**: GR explains Mercury’s precession as a *consequence* of its core spacetime curvature principles. The anomaly wasn’t "reverse-engineered"; it emerged from a framework built for broader reasons (e.g., equivalence principle).  

  **Why the Bayesian Formalism Falters (Case 3)**  
  Bayesianism’s "old evidence problem" (Glymour, 1980) is a technical artifact:  
  - If evidence \(E\) is known (\(P(E) = 1\)), conditioning on \(E\) cannot boost \(P(H|E)\).  
  - **But**: This assumes logical omniscience. In practice, you learn *not* \(E\) itself, but **"H entails E"** (Garber, 1983). GR’s confirmation came from realizing its equations *predicted* the precession, not from the raw data. The update occurs on the *explanatory link*, not the evidence.  

  ---

  ### **2. Your Hypotheses: Refined and Tested**
  #### **Hypothesis 1: "Data Visibility During Theorizing"**  
  - **Partially correct, but incomplete**. Visibility matters only if it leads to **loss of independence**.  
    - *Boundary test*: If a theorist sees the data but derives \(H\) from fundamental axioms (e.g., Einstein using symmetry principles), the fit is legitimate. If they add free parameters to match \(E\) (e.g., your kink term), it is not.  
    - **Label**: **Theory-Data Independence Criterion**.  

  #### **Hypothesis 2: "Probability That a Theory Would Fit"**  
  - **Correct and central**. This is **explanatory riskiness**:  
    - *Low risk* (bad): Many theories could fit \(E\) (e.g., your kink term is flexible).  
    - *High risk* (good): Few theories predict \(E\) (e.g., GR’s field equations *had* to output 43"/century).  
  - **Label**: **Risk of Explanatory Failure** (How easily could \(H\) have *failed* to explain \(E\)?).  

  **Synthesis**: Explanatory constraint drives riskiness. GR was risky because its core machinery *could not be adjusted* to force-fit Mercury; your kink term was low-risk because it was adjustable.  

  ---

  ### **3. Mapping to Established Concepts**  
  | Concept                  | Your Case 1 (Kink Model) | Your Case 2 (GR & Mercury) | Case 3 (Bayesian Old Evidence) |  
  |--------------------------|---------------------------|----------------------------|--------------------------------|  
  | **Accommodation**        | Ad hoc (illegitimate)     | Non-ad hoc (legitimate)    | Problematic if \(P(E)=1\)      |  
  | **Predictive Novelty**   | Absent (fits seen data)   | Present (e.g., light bending) | Not directly addressed         |  
  | **Explanatory Riskiness**| Low (flexible parameter)  | High (rigorous derivation) | Independent of temporal order  |  
  | **Theory-Data Independence** | Violated (model built *for* data) | Maintained (theory built *then* applied) | Not modeled in standard Bayes |  

  **Key Insights**:  
  - **Temporal order** (known before/after) is a proxy for **independence**, but not decisive. GR’s legitimacy comes from its *explanatory structure*, not timing.  
  - **Train/test splits** solve *overfitting* (a reliability issue) but do not validate *explanatory truth*. A model can predict well yet be ad hoc (e.g., epicycles).  

  ---

  ### **4. Boundary Cases for Clarity**  
  - **Edge Case A**: A theorist sees Mercury’s data, then develops GR *from scratch* using only equivalence + covariance. **Legitimate**: Constraint comes from principles, not data.  
  - **Edge Case B**: A physicist adds a "planet-specific curvature parameter" to GR solely to fit Mercury. **Illegitimate**: Ad hoc even if GR’s core is constrained.  
  - **Edge Case C**: Unknown data from 1859 is "discovered" after a theory predicts it. **Strong confirmation** (novel prediction), but absent predictive novelty, it reduces to accommodation with constraint.  

  ---

  ### **Summary: The Carving**  
  1. **Illegitimacy in Case 1**: Arises from **ad hoc accommodation** (no independent justification) and **low explanatory riskiness**.  
  2. **Legitimacy in Case 2**: Due to **non-ad hoc accommodation** (constrained by core principles) and **high explanatory riskiness**.  
  3. **Formalism Failure in Case 3**: A quirk of Bayesian probability (old evidence problem), solved by updating on *explanatory links*, not evidence.  

  The core phenomenon is **theory-driven vs. data-driven explanation**. No single term captures it perfectly, but **"explanatory constraint"** (with **riskiness** as its operational measure) comes closest. Your instincts align with philosophy’s treatment: accommodation is legitimate only when the theory *could not easily have been different* (Popper, Lakatos, McMullin). 

  Train/test splits address *predictive robustness*, not *explanatory depth*. To capture what GR achieved, you need both riskiness and constraint—something no mechanical split can provide.
