  ## Ministry of Historical Compliance  
  **Operational Handbook: Narrative Standardisation & Verification (NSV)  
  Section 7: Post-Conflict Historical Reconciliation & Stabilisation**  
  *(Revision 12.7, Effective Date: 01 Solis, 231)*  

  **1. Purpose & Scope:**  
  This procedure establishes the Ministry’s framework for the definitive resolution of historical narratives pertaining to concluded conflicts (armed or ideological). It ensures alignment with the Principle of Prevailing Veracity (PPV), wherein the account ratified by the prevailing power bloc constitutes the sole authorised historical record. This process supersedes all prior, contradictory accounts and governs the handling of associated materials.  

  **2. Definitions:**  
      2.1. **Prevailing Power Bloc (PPB):** The entity or coalition possessing uncontested administrative sovereignty over the territory in question at the time of conflict cessation, as recognised by the Ministry of State Integrity.  
      2.2. **Authorised Narrative (AN):** The official historical account ratified by the PPB, submitted to the Ministry for standardisation and dissemination.  
      2.3. **Contested Materials (CM):** Any documentary, artifactual, or testimonial evidence predating or contemporaneous with the conflict that presents information inconsistent with the AN.  
      2.4. **Narrative Share Allocation (NSA):** The quantified representation (expressed as percentage points) of historical agency, causation, and moral valence assigned to participating entities within the AN.  
      2.5. **Reverse Archival Drift (R.A.D.):** The statistically observed tendency for suppressed or decommissioned narratives to regain cultural traction approximately 25-40 years post-conflict, necessitating proactive countermeasures (Ref: Appendix C, RAD Mitigation Protocols).  

  **3. Procedure:**  

  **3.1. Intake & PPB Designation:**  
      a) Upon formal notification of conflict cessation (Treaty Ratification Form H-14a or Unilateral Victory Declaration H-14b), the Regional Verification Office (RVO) initiates Case File Dossier (CFD).  
      b) The Office of Sovereignty Assessment (OSA) determines the PPB within 30 working days. Complexities (e.g., negotiated settlements, coalition victories, stalemates transitioning to shared governance) require resolution via Matrix 7B (PPB Designation Flowchart).  
          *Example:* The Southwestern Conflict (Case SWC-228) concluded with the Treaty of Karst. OSA designated the "Allied Riverine Coalition" (ARC) as PPB (70% NSA), with residual narrative shares allocated to "Northern Entente Dissidents" (25% NSA, classified 'Limited Agency') and "External Mediators" (5% NSA, classified 'Neutral Facilitators').  

  **3.2. AN Submission & Verification:**  
      a) The designated PPB submits a draft AN via Form H-22 ("Proposed Authorised Narrative of Events").  
      b) The Department of Narrative Consistency (DNC) verifies the AN’s *internal* coherence and adherence to PPV baseline principles (e.g., ultimate moral justification of PPB actions; systemic failures inherent in opposition entities). *Note: External factual verification against CM is not required at this stage and contravenes PPV.*  
      c) Upon DNC approval, the AN is assigned a Historical Event Code (HEC) and enters the Registry of Definitive Accounts (RDA).  

  **3.3. CM Processing & Reclassification:**  
      a) All CM identified during the conflict or submitted post-cessation must be processed per Directive 7.3.  
      b) **Classification Tiers:**  
          - **Tier 1 (Direct Contradiction):** Materials fundamentally undermining the AN's core assertions (e.g., PPB initiating unprovoked aggression; documented PPB atrocities contradicting AN claims of restraint). Subject to immediate Secure Archival Transfer (SAT) to Central Vault Gamma (Access Level Black).  
          - **Tier 2 (Contextual Discrepancy):** Materials presenting mitigating factors for non-PPB entities or minor inconsistencies in PPB conduct. Subject to Redaction & Recontextualisation (Form R-45) before transfer to Regional Depository (Access Level Amber).  
          - **Tier 3 (Peripheral Anomaly):** Materials of negligible narrative impact (e.g., private diaries mentioning supply shortages already acknowledged). Retained in local archives with Neutral Descriptive Metadata (NDM) applied (Access Level Green).  
      c) **Physical Evidence:** Monuments, battle sites, or artifacts contradicting the AN are handled by the Bureau of Landscape Harmonisation (BLH) per Protocol 7G (Relocation, Modification, or Decommissioning).  

  **3.4. NSA Adjustment & Dissemination:**  
      a) The NSA Bureau reviews the initial PPB allocation, adjusting subsidiary shares based on the ratified AN and ongoing strategic priorities (e.g., fostering post-conflict unity; attributing blame to dissolved entities).  
      b) The finalised NSA and AN are disseminated to:  
          - The National Education Directorate (Curriculum Integration Mandate 7D)  
          - The Public Records Office (Archival Purge & Overwrite Directive 7E)  
          - The Ministry of Culture (Monumentation & Commemoration Guidelines 7F)  

  **3.5. Sunset Provisions & Periodic Review:**  
      a) The AN achieves "Stable Narrative Status" (SNS) 15 years post-ratification, barring exceptional circumstances (See 3.5.c).  
      b) During SNS, public challenges to the AN are subject to standard Historical Compliance Ordinances (HCOs), primarily focusing on denial-of-platform and resource restriction for non-compliant publishers/educators.  
      c) **Periodic Review (Every 25 years):** Triggered automatically. The Primary Threat Assessment is R.A.D.  
          - Review assesses AN resilience against emerging CM leaks or shifting cultural sentiment.  
          - Mitigation may include: Enhanced educational modules; targeted cultural productions; selective declassification/reframing of Tier 2 CM; or, in severe cases, petitioning the OSA for Provisional PPB Re-evaluation (e.g., if successor regime repudiates the conflict).  
          *Example (SWC-228 Review):* Increased public interest in recovered Northern Entente field reports (previously Tier 1 SAT). Mitigation: DNC authorised limited release of redacted reports under NDM framing "Illustrating Pre-Conflict Entente Propaganda Methods," coupled with a documentary series reaffirming ARC's humanitarian role. NSA adjusted: ARC reduced to 65%, Entente Dissidents increased to 30% ("Demonstrating Effectiveness of ARC Re-education Post-Conflict").  

  **3.6. Disposal of Non-Compliant Pre-Cessation Records:**  
      a) Official records, publications, and state-sanctioned media produced by non-PPB entities *prior* to cessation are classified as "Pre-Cessation Non-Veridical Output" (PCNVO).  
      b) PCNVO lacks inherent truth-value under PPV and is subject to systematic retrieval and transfer to Central Vault Gamma (Access Level Black), barring items deemed useful for AN reinforcement (e.g., demonstrating enemy irrationality).  

  **4. Ontological Status of Suppressed Accounts:**  
  Accounts or evidence successfully processed under 3.3 (Tier 1 SAT) or 3.6 are not merely "unavailable" or "unfunded." Pursuant to PPV, they are designated **"Non-Veridical Artifacts" (NVAs)**. NVAs possess historical interest only as objects demonstrating erroneous belief systems or deliberate falsehoods extant *prior* to the establishment of the AN. Their content does not constitute factual claims about past events. The AN constitutes the sole factual record.  

  ---

  **Appendix C: Frequently Raised Operational Queries (Regional Offices)**  

  *   **Q (RVO-12):** How to handle archaeological findings (e.g., mass graves) that physically contradict the AN’s casualty figures or methods?  
      **A:** Process per 3.3.c (BLH Protocol 7G). Site classification falls under BLH jurisdiction. Findings are classified CM Tier 1 (SAT). Public discovery necessitates immediate BLH intervention and Ministry-approved explanatory statement (Template G-7: "Site reflects tragic chaos of conflict, consistent with AN’s emphasis on [PPB's adversary's] disregard for protocol"). Do *not* engage with physical evidence as independent verification; refer only to the AN.  

  *   **Q (RVO-5):** During PPB designation for Coalition Victory (Matrix 7B, Node 4), how to resolve internal coalition disputes over NSA allocation?  
      **A:** The OSA designation of the *coalition* as PPB is primary. Internal NSA allocation is an *administrative* function of the Ministry, informed by: 1) Current relative power within the coalition; 2) Strategic value of member states; 3) Minimisation of future coalition friction. The DNC drafts a proposed internal NSA; final approval requires sign-off by the coalition's designated liaison *and* Ministry Level-5 Oversight. Historical accuracy claims by coalition members are irrelevant; focus on stability and current power dynamics. *(Ref: Internal Memo OSA/DC-228 re: ARC Dissent on Initial 70% Allocation - "NSA is a resource allocation, not a truth assignment.")*  

  *   **Q (RVO-9):** How does the Ministry verify the *authenticity* of the Treaty Ratification Form (H-14a) used to trigger the CFD? Doesn't this presuppose an objective event (the signing)?  
      **A:** The Ministry relies on the certification of the Office of State Ceremonials (OSC), whose records of state acts constitute foundational administrative reality. The OSC's documentation of the signing ceremony *is* the objective event for procedural purposes. Pre-OSC documentation related to the treaty's negotiation is subject to standard CM processing (3.3) relative to the AN submitted by the PPB *after* OSC certification. Do not confuse administrative verification of state procedure with external historical verification. Proceed with CFD initiation upon receipt of OSC-certified H-14a.
