prompt: |-
  hey — so I'm in this moral psych seminar and I've got to lead one 45-minute discussion section next week on the cross-cultural variation stuff and what it's supposedly supposed to show about whether morality is objective. The prof has banned trolley problems in section (everyone's sick of them) so I can't use one, which is most of what I'd have reached for.

  The thing I actually want them to get is a distinction the prof made in lecture that half my section seemed to sleep through: there's a difference between (a) people disagreeing about how much weight to give a consideration that everyone in the disagreement already counts as a moral reason, and (b) people disagreeing about whether some consideration is a moral reason at all — like whether loyalty to your kin, or not touching something that's taboo, or deferring to elders, is even the kind of thing that can be a moral reason. Only (b) looks like it might threaten objectivism at all; (a) is compatable with basically every view on offer. And the readings we did can't separate the two, because 'people answered differently on the survey' is consistent with either one.

  So don't explain the distinction to me — plan how I teach it. What has to be on the board before the (a)/(b) split even means anything to them? What's the one example that should carry the whole session — it needs to be a case where my students won't already agree that the consideration in play is a moral one, so that 'is that morality or just custom/manners?' is genuinely live for them, and it can't turn on harm. What do they walk in believing — I'm guessing either 'science found differences, so morality is relative lol' or 'sure, but deep down everybody knows X is wrong' — and at exactly which point in the sequence do I block each? There's one thing I think I have to name and then kill: treating each study's sample as one independent vote, when a lot of the societies in these samples share ancestors and borrowed from each other. Where in the session does that go?

  Also: one question I can ask at the end that tells me they got the distinction rather than just the vibe, and flag the places where your plan leans on a contestable reading of 'objective' or of what the cross-cultural findings actually show. Last thing — what would make you throw out the ordering and rebuild it? Like what's the one thing about the students, or about the material, that would change your plan most.
reasoning: |-
  Okay, the user is leading a seminar discussion on cross-cultural moral variation and its implications for moral objectivity. They want to focus on distinguishing between disagreements about the weight of moral reasons versus disagreements about what counts as a moral reason at all. The challenge is to teach this distinction effectively without using trolley problems or harm-based examples. 

  Hmm, the user seems frustrated that their peers slept through this distinction in lecture. They're clearly passionate about getting this right and want a concrete teaching plan. Their anxiety about students oversimplifying ("morality is relative lol" vs "everyone knows X is wrong") feels very real. 

  First, I need to find an example that makes the distinction visceral. The user specifically requested something where "is this morality or just custom?" is genuinely debatable. Food taboos might work - say, beef in Hindu cultures vs pork in Jewish/Muslim contexts. The key is showing how violating these feels morally wrong to adherents ("desecration") but merely impolite to outsiders. 

  Wait, should I avoid religious examples? Maybe not - the user needs the consideration to be non-obviously moral. Workplace loyalty could be a secular alternative: in Japan, staying late with your team is a moral duty; in Denmark, it's just poor work-life balance. But does that capture the "sacred" quality needed for (b)-type disagreement? 

  For structure: must start by defining "moral reason" (their board point 1). Students will conflate this with values or preferences. Need to emphasize the "should" quality - the felt authority. Then we can contrast disagreements within a framework (how much to donate) vs about the framework (is donating even obligatory?). 

  Biggest risk is students thinking cultural variation alone proves relativism. So after the food taboo example, I'd explicitly diagram why (a)-type variation (donation amounts) doesn't threaten objectivity, while (b)-type (is loyalty moral?) might. Must slaughter the "each society = independent vote" fallacy when discussing data limitations. 

  The killer question: "If two cultures agree that loyalty is moral but disagree about whether lying for a friend is loyal, is this (a) or (b)?" If they say (a), they get it. 

  What would make me rebuild? If pre-seminar polling shows students already grasp the reason/weight distinction. Then I'd pivot to harder cases - like when considerations shift categories across contexts. But given the slept-through lecture, that's unlikely.
answer: |-
  Here’s a battle-tested plan for your 45-minute session, designed to surgically implant the (a)/(b) distinction in your students’ minds while dodging trolleys and harm-centric examples. Lean into cultural friction to make the abstract tangible.

  **Core Objective:** Students exit understanding that cross-cultural disagreement over *whether X is a moral category* (b) is fundamentally different from (and potentially more challenging to objectivism than) disagreement over *how much weight to give X within shared moral categories* (a).

  **The Anchor Example (Non-Harm, Live "Morality or Custom?" Question):**  
  **"Hospitality & Priority in Line"**  
  *Scenario:* In Culture A (modeled on some Mediterranean/Middle Eastern norms), allowing a close friend or family member to jump the queue for a scarce resource (e.g., concert tickets, a crucial medical appointment slot) is seen as a strong moral duty of loyalty/solidarity. Refusing would be a serious betrayal.  
  In Culture B (modeled on some Northwest European/Scandinavian norms), this act is seen as profoundly unfair corruption or cheating, violating impartial justice. Prioritizing kin/friends in this context is morally wrong.  
  *Why it works:*  
  1.  **Not obviously harm-based:** The harm (delaying others) is indirect and often outweighed by the perceived moral good (solidarity) in Culture A.  
  2.  **"Morality vs. Custom" is live:** Students in Culture B-heavy contexts readily see queue-jumping as "just unfair," while those from Culture A-heavy backgrounds may viscerally feel the "betrayal" angle. Others will genuinely waver.  
  3.  **Avoids religious taboos (mostly):** Less charged than purity/sanctity examples.  
  4.  **Relatable:** Everyone has queued.  

  **Session Flow (45 Mins):**

  1.  **Priming the Pump: What is a "Moral Reason"? (5 mins)**  
      *   **Board:** "Moral Reason = A consideration that counts *for or against* an action because it makes the action *morally right/wrong, good/bad, required/forbidden*."  
      *   **Do:** Quick brainstorm: "Shout out things that *feel* like moral reasons." (Harm, fairness, honesty, loyalty, authority, purity, liberty, care... list them). Emphasize *why* they feel moral – they carry normative *force*, a "should/shouldn't".  
      *   **Goal:** Establish a baseline understanding of what a "moral reason" *is* before dissecting disagreement. Block the "everything is subjective" nihilism early by acknowledging shared intuitions.

  2.  **Introducing the Problem: Variation is Real (10 mins)**  
      *   **Board:** "Cross-Cultural Finding: People in different cultures sometimes make different moral judgments about the *same* action."  
      *   **Do:** VERY brief reference to relevant readings (e.g., Haidt's WEIRD critique, Shweder's ethics of Autonomy/Community/Divinity). *Crucially:* Immediately pose the key question: "**What does this variation actually show? Does it mean morality isn't objective?**"  
      *   **Student Prediction:** Expect "Yes, it proves relativism!" or "No, they're just confused/mistaken about the *real* morals!"
      *   **Block Here:** "Hold that thought. We need a finer-grained tool to analyze *what kind* of disagreement this is." (Transition to distinction).

  3.  **Building the Distinction: (a) vs. (b) (15 mins - Heart of the Session)**  
      *   **Introduce with Anchor Example:** Present the "Hospitality & Priority in Line" scenario.  
          *   *Question 1:* "For someone in Culture A, what is the primary *moral reason* FOR letting their friend jump the queue?" (Loyalty/Solidarity/Duty to Kin).  
          *   *Question 2:* "For someone in Culture B, what is the primary *moral reason* AGAINST letting their friend jump the queue?" (Fairness/Justice/Impartiality).  
      *   **Board:**  
          > **(a) Disagreement about WEIGHT:** *Both sides agree* Loyalty *and* Fairness are moral reasons. They disagree about *which reason is STRONGER* in *this specific context*.  
          > **(b) Disagreement about STATUS:** One side believes Loyalty (in *this context*) is a valid moral reason; the other side believes Loyalty (in *this context*) is *not a moral reason at all* (maybe it's just preference, custom, or even *immoral*).  
      *   **Apply to Example:**  
          *   "Is the Culture A vs. Culture B disagreement about queue-jumping *primarily* (a) or (b)?" (Guide them: It looks like (b) – Culture A sees loyalty *here* as moral; Culture B sees loyalty *here* as *not* moral (or actively immoral, violating fairness)).  
          *   **Contrast with a CLEAR (a) Example:** "Imagine two people in Culture B: Both agree queue-jumping is wrong (Fairness is paramount). But one thinks it's *slightly* excusable if the jumper is desperate for a medical appointment; the other thinks it's *never* excusable. What kind of disagreement is this?" (a - they agree Fairness is the key moral reason, disagree on *how much* desperation mitigates its weight).

  4.  **Why (b) is the Real Challenge & Killing Misconceptions (10 mins)**  
      *   **Board:** Why (a) is Compatible with Objectivism: "If morality involves balancing *shared* fundamental reasons (e.g., Harm, Fairness, Loyalty), objective principles could exist governing how they interact, even if applying them is complex/hard/disputed contextually." (Analogy: Disagreeing on a fair price haggling doesn't mean fairness isn't objective).  
      *   **Board:** Why (b) *Potentially* Threatens Objectivism: "If cultures fundamentally disagree on *what kinds of considerations even count* as moral reasons in the first place (e.g., is Divinity/Purity a *moral* category?), it's harder to see how a single, universal, mind-independent standard exists."  
      *   **Kill the "Independent Vote" Fallacy:** "Crucial Caveat: Many 'different' cultures studied share deep historical roots, colonial influences, or religious traditions. Finding variation between them *doesn't* automatically mean we have X *truly independent* data points proving radical incommensurability. Shared ancestry or borrowing can explain some patterns. This weakens simplistic 'count the cultures' relativist arguments." (Place this HERE, after they grasp (a)/(b), so they see *why* the fallacy matters for interpreting data suggesting (b)-type disagreement).

  5.  **Synthesis, Implications, & The Killer Question (5 mins)**  
      *   **Board Recap:** (a) Weight Disagreement vs. (b) Status Disagreement.  
      *   **Implication:** Cross-cultural variation *alone* doesn't sink objectivism. The *nature* of the disagreement matters crucially. Finding widespread (b)-type disagreement is a *much* stronger challenge.  
      *   **Killer Question (Reveals Understanding):**  
          *"Imagine two cultures. Culture X believes failing to show deep, visible reverence towards elders (e.g., through specific gestures, forms of address) is morally wrong (a violation of respect). Culture Y believes such rules are matters of politeness or tradition, not morality – being inwardly respectful is what matters morally, not the outward show. Is this primarily an (a)-type or (b)-type disagreement? EXPLAIN WHY."*  
          **Correct Answer:** (b). They disagree on whether *outward displays of reverence* constitute a *moral reason* (Status). Culture X says yes (it's morally required); Culture Y says no (it's custom; the moral reason is inward respect, which doesn't strictly require the display).  
      *   **Flag Contestable Points:**  
          *   "This assumes 'objective' means universal, mind-independent moral truths. Some views (e.g., relativism, constructivism) reject this definition."  
          *   "It assumes the cross-cultural data *reliably* identifies (b)-type disagreements. Critics might argue apparent (b) disagreements are often deeper (a) disagreements or mistranslations/misunderstandings."  

  **What Would Make Me Rebuild the Plan:**  
  *   **Student Starting Point:** If a pre-discussion poll or opening question reveals they already grasp the *concept* of (a)/(b) distinction intuitively but struggle with *identifying it in data*, I'd pivot faster to analyzing specific study claims: "Does Haidt finding less emphasis on Harm in non-WEIRD cultures show (a) or (b)? What about the doctrine of double effect variations?" Focus on application/critique.  
  *   **Material Limitation:** If the assigned readings provide *no* concrete, non-harm examples of potential (b)-type disagreements, I'd need to supply 1-2 more strong anchors upfront (e.g., ancestor worship as moral duty vs. superstition; differential moral weight of promises to strangers vs. kin). The queue example *must* land.  

  **Key Teaching Moves:**  
  *   **Use the Board Relentlessly:** Keep the (a)/(b) definitions visible the whole time.  
  *   **Force Application:** Don't just explain; constantly ask "Is *this* (a) or (b)? Why?"  
  *   **Embrace the Friction:** Let students wrestle with the queue example. "Why might someone see loyalty *here* as *not* moral?"  
  *   **Name the Misconceptions:** Explicitly call out "independent vote" and "variation = relativism" when you squash them.  
  *   **End with the Killer Question:** Use it as an exit ticket or quick poll to gauge real understanding vs. vibe.  

  This plan leverages cultural contrast, defines terms upfront, isolates the critical distinction with a tailored example, explains its philosophical significance, debunks a major methodological pitfall, and provides a clear test for comprehension – all within 45 minutes. Good luck!
