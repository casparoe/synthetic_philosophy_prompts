answer: |-
  Here’s a custom Twin Earth case meeting all constraints, with principled derivations:

  **Scenario**: Oscar (Earth) and Twin Oscar (Twin Earth) are intrinsic duplicates. Earth’s lakes contain H₂O, Twin Earth’s contain superficially identical XYZ. Both communities exhibit genuine division of linguistic labour for “water”: ordinary speakers (like the Oscars) possess only partial grasp (e.g., knowing “water” denotes a clear, drinkable lake-liquid but not its chemical essence) and *defer to chemists for correct application*. Crucially, both planets defer to a *single, shared off-planet scientific institution*. This institution’s textbooks and paradigm samples authoritatively fix “water” as H₂O, making them *correct* about Earth but *mistaken* about Twin Earth’s lakes (which are XYZ).

  **Putnam-style environmental externalism** (reference fixed by causal-historical relations to the *local* environment):  
  *Principle*: The extension of a natural kind term is determined by the underlying nature of the substance in the speaker’s environment that typically causally regulates its use.  
  *Derivation*: Oscar’s use of “water” is causally regulated by H₂O in his environment; Twin Oscar’s by XYZ. Despite shared deference, the local samples that initially ground the term differ. Thus, Oscar’s “water” refers to H₂O; Twin Oscar’s to XYZ.  

  **Burge-style deferential externalism** (content fixed by communal norms when grasp is incomplete):  
  *Principle*: When a speaker incompletely grasps a term, its reference is fixed by the standards of the expert community to which they defer.  
  *Derivation*: Both Oscars incompletely grasp “water” and defer to the *same* expert institution, which authoritatively defines water as H₂O. The actual composition of local lakes doesn’t override this shared normative standard. Thus, both Oscars’ “water” refers to H₂O.  

  **Critical Feature**: The experts are *shared but wrong about the local liquid on Twin Earth*. Remove this (experts correct locally):  
  - Putnam still says references diverge (local samples differ).  
  - Burge now says references diverge too (Earth experts fix H₂O; Twin Earth experts fix XYZ). The theories *converge* when experts are locally correct, but *diverge* here due to expert error.  

  **Attack from Putnam-style theorists**: They’d argue that deference requires *actual causal contact* with samples the experts describe. The shared institution’s H₂O samples aren’t causally connected to XYZ in Twin Oscar’s environment, so deference fails; Twin Earth’s “water” is still regulated by XYZ locally. Genuine deference must track the *local* causal chain.  

  This cleanly separates the environmental and social externalist mechanisms, as required. (Word count: 497)
