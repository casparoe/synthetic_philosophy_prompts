  1. Wasp: fails to adjust when prey is moved (relevant change) -> Sphexish. Fits.
  2. Pick-and-place: fails to adjust when part is moved -> Sphexish. Fits.
  3. HVAC: fails to adjust to the room's actual temperature (relevant change) -> Sphexish. Fits.
  4. Language model: fails to adjust to the new constraint (relevant change) -> Sphexish. Fits.
  5. Forklift: she adjusted when called (relevant change: being called is a reason to stop autopilot) -> Flexible. Fits.
  6. Gripper: adjusted after failures (failure is a relevant change) -> Flexible. Fits.

  This principle fits all six.

  #### Principle: Alternative Possibilities (AP)

  But note: we must read it carefully. In the language model (4), there are many possible outputs (it could have chosen any token), but Marta called it Sphexish. So we cannot define AP as merely having multiple possibilities. We need a more refined version: the system must have the ability to choose an alternative that is appropriate given the change in circumstances.

  So let's define: **Appropriate Alternative Possibilities (AAP)**: A system is flexible if, when the situation changes in a way that requires a different action for the goal, it has the capacity to choose (and does choose) that appropriate alternative. Otherwise, sphexish.

