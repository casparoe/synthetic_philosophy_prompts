prompt: |-
  I have kept the issue tracker for a medium-sized open-source project for about fifteen years, and I have become preoccupied by one word in it: "same". Whether two reports are "the same bug" decides what gets merged, what gets closed as a duplicate, which release notes say "fixed", and who gets the credit. Everyone on the team makes these calls dozens of times a week, and we nearly always make them without hesitation. What interests me is that we do not make them by a rule, and that the reason we give changes from case to case.

  Three cases from the past year. (1) Two users report a crash with different messages and different stack traces; a week of digging shows both come from one unguarded null. Nobody argues: same bug. (2) Two users report byte-identical wrong output from unrelated causes, one a rounding error in the backend and one a caching fault in the client. We insist these are not the same bug, and we are genuinely puzzled by a newcomer who says they obviously are, since they look identical from the user's chair. (3) A single root cause produces two symptoms needing two different fixes, in two subsystems owned by two different people. Here the team splits and stays split: half of us say one bug with two faces, half say two bugs with one ancestor.

  I have read a little philosophy, so let me head off the easy answers. This does not feel like vagueness: there are no heaps, no "sort of the same", no sense of a borderline. In each case every competent person has a confident view, and where we differ we differ confidently and at length. It does not feel like ambiguity either: nobody hears two senses of "same bug" and picks one. We resist the suggestion that we are picking at all, and say things like "no, really, those are the same bug". A friend who does philosophy rattled off some candidates — vagueness, polysemy, family resemblance, open texture, cluster concepts — and none seemed to me to be quite it, though I could not say why. The cases are not held together by overlapping features; they are held together by a story about causes and fixes, and the people who know the causes beat the people who know the symptoms.

  Three further things make me think this is a phenomenon of its own.

  First, the shifts are graded, and the grading is shared. Some re-identifications are accepted the moment they are proposed; others are argued over for months; and this ordering is stable across our team and, as far as I can tell, across projects. What marks a good triager is not refusing to shift but shifting by the right amount: the pedant who splits everything and the enthusiast who merges everything are both criticised, and criticised in the same words.

  Second, the relation is not transitive, and our repairs for that are lopsided. It is common to have A the same as B, B the same as C, and A not the same as C. Repairing it by merging, we say "we were wrong about that"; repairing it by splitting, we say "it turned out to be two things after all". One direction is confessing an error, the other is reporting a discovery — as if the relation were at once stipulated and found. I have never seen that asymmetry discussed.

  Third, every attempt to write the policy down fails in the same way. "Same root cause, same issue" and "same user-visible failure, same issue" each handle the routine cases perfectly, and each misfires precisely where the shifting was doing the work — and systematically, not accidentally: the cases the rule gets wrong are exactly the cases we would have argued about.

  So: is there an established concept for this? I have taken to calling it "negotiated identity" in my own notes, which I am sure is wrong, if only because none of us experiences it as a negotiation. I am after the carving rather than a label: what exactly the phenomenon is; how it differs from each of its nearest neighbours; which of them, if any, it really is; and where its edges lie, including whether it shows that nothing here was ever strictly the same. If nothing established fits, please coin a term, define it tightly enough that I could decide whether a new case falls under it, and give me the boundary cases where it should not be applied. I am not after a reading list or citations — I want the distinctions. I shall be circulating the answer to my team, whose house style is American, so please write it in American English.
reasoning: |-
  Hmm, the user has presented a fascinating philosophical puzzle about bug identity in software development. They've maintained an issue tracker for 15 years and noticed that determining whether two bug reports describe "the same bug" isn't governed by clear rules, yet developers make these judgments confidently. They've provided three concrete cases showing how these decisions vary based on context, and highlighted three unique characteristics: graded judgments, non-transitivity with asymmetric repairs, and the failure of formal policies.

  I need to analyze this through multiple lenses. Epistemically, this seems related to how we categorize things in practice versus theory. The "causal nexus" concept feels promising - bugs are identified not by symptoms or fixes alone, but by their position in the causal web of the system. This explains why developers who understand causes override those focused on symptoms.

  The non-transitivity is particularly telling. When A=B and B=C but A≠C, merging is seen as correcting an error while splitting is a discovery. This asymmetry suggests identity isn't just discovered or stipulated, but both simultaneously. The system's causal structure is being mapped, and our understanding evolves.

  The policy failures make sense too. Any single-axis rule (root cause or symptoms) misses the contextual judgment required when factors pull in different directions. The cases where rules fail are precisely where human judgment was needed.

  For terminology, "causal identity" captures the core concept best. It's not negotiated identity because it's not consciously bargained - it's recognized. And it's not vague or ambiguous; it's contextual. The boundaries become clear when we consider edge cases like the "causally promiscuous" root cause that should be split versus the "causally integrated" one that shouldn't.

  The user will need this clearly articulated for their team, with concrete decision criteria they can apply to future cases. The key is emphasizing that this isn't a flaw but a necessary feature of dealing with complex systems.
answer: |-
  Your phenomenon is neither vagueness nor ambiguity, but **causal identity**—a contextually determined judgment of sameness based on a bug's *role in the causal structure of the system*, not its symptoms or fixes alone. It's a distinct epistemic practice in software maintenance. Here's a precise dissection:

  ### **Core Concept: Causal Identity**
  - **Definition**: Two bug reports describe "the same bug" iff they share a *minimal, non-arbitrary causal nexus*—a focal point in the system's causal web where intervention resolves both failures *without oversimplifying or overcomplicating* the engineering context.
  - **Boundary Condition**: Identity holds when merging/splitting reports optimizes for:
    1. **Traceability** (one root cause maps cleanly to one fix/release note),
    2. **Accountability** (clear ownership for diagnosis/fix),
    3. **Cognitive economy** (minimizes mental overhead for triagers).

  ### **How It Differs from Nearest Neighbors**
  | **Concept**          | **Why It Doesn't Fit**                                                                 | **Causal Identity Contrast**                                                                 |
  |----------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Vagueness**        | No borderline cases; judgments are sharp and confident.                                | Boundaries are crisp but *context-dependent*; sameness is fixed by the system's causal topology. |
  | **Polysemy**         | No multiple definitions; "same bug" has one meaning (causal nexus).                    | Meaning is unitary but *elastic*: the "nexus" scales with system understanding.                |
  | **Family Resemblance**| No overlapping features; identity can persist despite divergent symptoms/fixes.        | Held together by *causal role*, not shared attributes.                                         |
  | **Open Texture**     | Not about unforeseen cases; disputes arise in known scenarios.                         | Disagreements stem from *competing valid focal points* in the causal graph.                    |

  ### **Resolving Your Cases via Causal Identity**
  1. **Crash with different stack traces**:  
     - **Same bug**: One unguarded null is a *minimal causal nexus*. Fixing it resolves all crashes. Splitting would fracture traceability.
  2. **Identical symptoms from different causes**:  
     - **Different bugs**: No shared causal nexus. Merging would obscure distinct fixes (rounding vs. caching) and muddle ownership.
  3. **One cause, two symptoms needing separate fixes**:  
     - **Split if**: Fixes are in decoupled subsystems with separate owners → *two causal nexuses* (e.g., backend logic flaw + client caching bug).  
     - **Merge if**: Fixes are interdependent → *one nexus* (e.g., a protocol violation requiring coordinated patches).

  ### **Explaining Your Three Phenomena**
  1. **Graded judgments**:  
     - Confidence scales with how *obviously* the causal nexus minimizes engineering overhead.  
     - Pedants (over-split) and enthusiasts (over-merge) violate **cognitive economy**.
  2. **Non-transitivity & asymmetric repairs**:  
     - Non-transitivity arises when the causal nexus shifts with new evidence (e.g., A=B and B=C initially share a nexus; later, A≠C when deeper analysis reveals distinct nexuses).  
     - **Merging A,B,C → "We were wrong"**: Admits the initial nexus was *too coarse*.  
     - **Splitting A,C → "Discovery"**: Recognizes a finer-grained nexus was *always latent* in the system.  
  3. **Policy failure**:  
     - Rules fail because they isolate one dimension (cause/symptom/fix). Causal identity *weights all three* against engineering constraints:  
       - "Same root cause" → Fails when one cause demands multiple fixes (your case #3).  
       - "Same user symptom" → Fails when identical failures have unrelated causes (your case #2).

  ### **Edge Cases: When Causal Identity Breaks**
  - **The Causally Promiscuous Bug**:  
    A single root cause (e.g., memory corruption) manifests as 20+ unrelated symptoms.  
    → **Split**: One nexus would overload traceability; assign sub-nexuses per symptom cluster.
  - **The Causally Integrated Duo**:  
    Two bugs (e.g., UI glitch + backend error) always co-occur; fixing one without the other is impossible.  
    → **Merge**: Their nexus is inseparable; treating them as one optimizes accountability.

  ### **Term and Definition**
  - **Term**: **Causal Nexus Identity** (CNI)  
  - **Test for CNI**:  
    *Merge reports A and B only if:*  
    (a) They share a root cause **and**  
    (b) Fixing that cause resolves all reported failures **and**  
    (c) No distinct subsystems demand independent fixes/ownership.  
    If (a) fails → *always different bugs*.  
    If (a) holds but (b) or (c) fail → *split*.

  ### **Why "Negotiated Identity" Misses the Mark**
  It’s not negotiated because engineers aren’t bargaining—they’re *discovering* the system’s causal structure. Disagreements reflect competing insights into where the nexus lies, not social compromise. The "shifting" you observe is the iterative refinement of causal models, not relativism.

  This framework explains your team’s intuition: **those who know causes beat those who know symptoms** because causes reveal the nexus. Distribute this to your team—it’s how they already think, now formalized.
