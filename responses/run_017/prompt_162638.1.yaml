  2. Priya's pushback: Suspension isn't neutral; inaction damages relationships just as much as disbelief.
  3. Ravi's distinction: Belief vs. acceptance - one can act as if Dev is innocent without believing it.
  4. Priya's trust dynamic: Evidence about trustworthiness only emerges after extending trust, so waiting prevents evidence-gathering.
  5. Ravi's experiment counter: Extend trust as a test while staying agnostic.
