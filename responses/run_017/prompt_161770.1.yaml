  1. Divide the class: half World, half Bettors. If the class is small, maybe 3 for World and 11 for Bettors? But 7 and 7 is fine. The World group steps out to draw c? Or they do it at the front.

  2. Explain the rules to the whole class:
     - There is a cutoff c chosen by the World group from a geometric distribution with p=0.2 (explain: at each step, 20% chance that the rule changes after that step).
     - The rule: all draws up to and including c are Green; after c, they are Blue.
     - The World group has drawn c and will now generate the sequence step by step.
     - The Bettors will see the sequence and then, after each draw, they will write down their probability that the next draw is Green.

  3. Run the game for 5-10 steps.

  4. Debrief as above.

  Debrief mapping:

  - Moment 1: After the first Green, the Bettors assign 0.8 to the next being Green. Why not 1? Because there's a 20% chance that the cutoff is at step 1 (so the next is Blue). But they saw Green, which means c>=1. The chance that c=1 is 0.2? Actually, P(c=1 | c>=1) = P(c=1)/P(c>=1)=0.2/1=0.2. So 0.2 chance that the next is Blue.

  - Moment 2: If they see a second Green, then they again assign 0.8 to the next Green. Why isn't it higher? Because P(c=2 | c>=2) = 0.2. So the chance that the next is Blue is still 0.2.

  - And so on: every time, 0.8.

  - Why does the disagreement (between the next being Green or Blue) survive? Because the data doesn't change the conditional probability of the cutoff happening at the next step.

  - Why do we want to say it should be higher? Because we think the cutoff is less likely to happen after many Greens? But the prior says it's always 0.2.

  - Why is this not Hume? Because we assumed there is a stable rule (the cutoff rule). The problem is not whether the rule will change, but when.

  - The reflexive answers: 
      - Simplicity: the cutoff rule is just as simple as a rule that doesn't cutoff? But we didn't have the non-cutoff rule. If we had two rules (cutoff and no cutoff), then simplicity would favor no cutoff? But why? And why do we favor no cutoff? Because we are used to it? (entrenchment)
      - No gerrymandering: the cutoff rule is defined by a specific time? But the grue predicate is defined by a specific time T? So it's similar? And it's not gerrymandered? It's a natural rule? But we don't have a reason to prefer one over the other? So we need a prior.

  - What the game cannot reproduce: the symmetry between green and grue. In our game, we are only considering one predicate: Green. The rule is defined in terms of Green and Blue. We are not introducing an alternative predicate that is time-dependent. So we have to state that explicitly: Goodman's riddle introduces an alternative predicate (grue) that is defined in terms of time and color, and it is equally supported by the evidence.

  We can then say: imagine that instead of calling the color after the cutoff "Blue", we call it "Gree", and we define a new predicate: an object is "Gree" if it is observed before the cutoff and is Green, or it is observed after the cutoff and is Blue. Then the entire sequence so far is Gree? And the next one will be Gree only if it is Green (if before cutoff) or Blue (if after cutoff). But that is always true? So the rule is that they are always Gree? Then we would project that the next one is Gree. But that doesn't tell us the color.

  Alternatively, we can say: the rule is that before the cutoff, the color is Green and after it is Blue. So if we project the color, we have to choose which projection: we could project that the color will be Green (as we did) or that the color will be Blue? But the evidence doesn't tell us which? But in our prior, we assumed that after the cutoff it is Blue, so we project Blue after. But why that and not the opposite? 

  Goodman's point is that we project the color green for the next one, but we could project grue (which would imply that the next one is blue if after T). So to simulate that, we would need two competing teams: one projecting green and one projecting grue? But that would be more complex.

  Given the constraints, we can state after the game: "In Goodman's riddle, we have two predicates: 'green' and 'grue'. The evidence supports both equally. But they project different things for the future. We break the tie by projecting 'green' because it is entrenched: we have a prior that favors it. In our game, we broke the tie by having a prior that the cutoff happens at a geometric rate? But that prior is arbitrary? And it leads to a fixed prediction."

  So the activity isolates the need for a prior (or entrenchment) to break the symmetry between projectible predicates.

  Implementation note:

  - Use p=0.2 so that the probability of Green next is 0.8, a round number.
  - Prepare the World group: give them a die (5-sided or 10-sided) to draw c. For example, a 10-sided die: if 1 or 2, cutoff at this step; otherwise, continue. They roll for step 1: if cutoff, then c=1. If not, then step2: roll again, etc.
  - Alternatively, to save time, the instructor can precompute c for the World group using a random number generator.

  Example sequence with c=3:
    t=1: Green
    t=2: Green (then Bettors bet on t=3: they say 0.8, but actually t=3: Green? Wait: c=3, so t=3 is Green? Then t=4 is Blue. So at t=3, the World will announce Green? Then the Bettors are asked for t=4: they will say 0.8? But actually it will be Blue. So they get it wrong? But that's okay? Because it happens 20% of the time.

  But note: after t=3 (Green), the Bettors are asked for t=4. They say 0.8 for Green. But then the World announces Blue. Then they see that sometimes it happens.

  We hope that after several rounds, they see that their probability assessment is always 0.8, and sometimes they are wrong (20% of the time) and sometimes right (80% of the time).

  This should drive home the point.

