answer: |-
  ### In-Class Activity: The Cutoff Game
  **Objective:** Isolate projectibility by demonstrating that even with a stable rule, evidence alone cannot determine which rule is supported, highlighting Goodman's new riddle of induction.

  **Activity Structure:**  
  - **Groups:** Split the class into two halves:  
    - **Group A (The World):** 7 students. They generate the observation sequence using a hidden cutoff rule.  
    - **Group B (The Bettors):** 7 students. They bet on the next observation after seeing the sequence.  
  - **Rule:** The sequence follows a cutoff rule: all observations are Green (G) up to and including a hidden cutoff point \(c\), and Blue (B) afterward. \(c\) is fixed in advance but concealed.  
  - **Prior for \(c\):** \(c\) is drawn from a geometric distribution with success probability \(p = 0.2\). This means:  
    - \(P(c = k) = (0.8)^{k-1} \times 0.2\) for \(k = 1, 2, 3, \ldots\)  
    - The hazard rate is constant: \(P(\text{cutoff at } t \mid \text{no cutoff before } t) = 0.2\) at any step \(t\).  
  - **Sequence Generation:**  
    - Group A draws \(c\) in advance (e.g., using a random number generator or 10-sided die: cutoff on 1–2, continue on 3–10).  
    - They generate observations: Green for \(t = 1\) to \(c\), Blue for \(t > c\).  
    - **Example sequence (if \(c = 3\)):** G, G, G, B, B, B, ...  
  - **Betting Rounds:**  
    - **Reveal observations:** Group A announces one observation at a time (e.g., \(t_1 = G\), then \(t_2 = G\), etc.).  
    - **Bet:** After each observation \(t_n\), Group B individually writes their probability \(q\) that \(t_{n+1} = G\).  
    - **Scoring:** Use the **quadratic scoring rule** for honesty:  
      - If \(t_{n+1} = G\), score \(= 1 - (1 - q)^2\)  
      - If \(t_{n+1} = B\), score \(= 1 - q^2\)  
      - (Higher scores are better; max score = 1 for perfect prediction.)  
    - **Payoff:** Track cumulative scores for "bragging rights" (no real stakes).  
  - **Key Sequence for Demo:** Start with a run of Greens to force the paradox (e.g., pre-set \(c = 10\) or draw until \(c \geq 5\)). After \(n\) Greens, Bettors **must** bet on \(t_{n+1}\).  
  - **Duration:** Run 5–7 rounds (e.g., reveal \(t_1\) to \(t_5\), with bets on \(t_2\) to \(t_6\)).

  ### Why This Design Isolates Projectibility
  - **Stable Rule Granted:** Students know the sequence follows a strict cutoff rule—no Humean skepticism about uniformity.  
  - **Evidence Underdetermines Hypotheses:** After \(n\) Greens, two hypotheses remain live:  
    - \(H_1\): "Next is G" (cutoff \(c > n\)).  
    - \(H_2\): "Next is B" (cutoff \(c = n\)).  
  - **Prior Dominates Data:**  
    - The geometric prior implies \(P(\text{next is G} \mid n \text{ Greens}) = P(c \geq n+1 \mid c \geq n) = 0.8\) (constant, regardless of \(n\)).  
    - Example: After 10 Greens, \(P(\text{next G}) = 0.8\)—same as after 1 Green. Data doesn’t shift odds; only the prior does.  
  - **Predictable Student Behavior:**  
    - Bettors will (correctly) always bet \(q = 0.8\) for next G.  
    - Intuition clashes: Students *feel* long runs of G should increase \(P(\text{next G})\), but math shows it doesn’t.  

  ---

  ### Debrief: Mapping to Goodman's New Riddle  
  **1. Disagreement Survives Every Observation**  
  - After \(n\) Greens, \(H_1\) (G forever) and \(H_2\) (B after \(n\)) are both consistent with the evidence.  
  - **Why?** The cutoff rule’s structure ensures \(H_2\) (e.g., "cutoff at \(c=n\)") is always possible, and the prior assigns it fixed probability (0.2). Data can’t eliminate \(H_2\) because no Blue has been observed to refute it.  
  - **Goodman Link:** Like "all emeralds are green" vs. "all emeralds are grue" (grue = green if observed before time \(T\), else blue). Both fit green observations; evidence can’t distinguish them.  

  **2. Reflexive Answers Depend on Entrenchment or Priors**  
  - When students suggest "simplicity" or "no gerrymandering" to favor \(H_1\) (G forever):  
    - **Simplicity:** Both rules are equally simple (e.g., "always G" has 1 parameter; cutoff rule has 2, but \(c\) is fixed). No objective reason to prefer one.  
    - **Gerrymandering:** Students might call \(H_2\) "contrived," but the cutoff rule isn’t inherently gerrymandered—it’s as valid as "always G."  
    - **The Real Issue:** These lean on **entrenchment** (we’re accustomed to projecting "green" over "grue") or a **prior** (e.g., favoring small \(p\) or no cutoff). But the prior isn’t justified by evidence—it’s a subjective input.  

  **3. Why This Isn’t Hume’s Problem**  
  - **Hume:** Worries if the future resembles the past (e.g., "Is induction even reliable?").  
  - **Goodman:** Grants uniformity (the rule *is* stable) but asks *which* rule is projected given the evidence. Here, the problem is underdetermination: multiple rules fit the data, and projectibility depends on priors/entrenchment.  

  ---

  ### Predictable Challenges and Limitations  
  **What Will Go Wrong the First Time:**  
  - **Misunderstanding the Prior:** Students may intuit that \(P(\text{next G})\) should rise with more Greens (e.g., "After 10 Gs, \(c\) is probably large, so next is likely G"). They’ll resist \(q = 0.8\) even after calculations.  
    - **Mitigation:** Walk through Bayes’ rule explicitly after Round 1:  
      - After first G: \(P(c=1) = 0.2\), \(P(c>1) = 0.8\) → \(P(t_2 = G) = P(c>1) = 0.8\).  
      - After second G: \(P(c=2 \mid c \geq 2) = 0.2\), \(P(c>2) = 0.8\) → \(P(t_3 = G) = 0.8\).  
  - **World Group Errors:** Students may misdraw \(c\) (e.g., confuse geometric distribution).  
    - **Mitigation:** Provide a simple tool (e.g., 10-sided die: cutoff on 1–2 = 20% chance per step).  

  **Feature the Game Cannot Reproduce:**  
  - **Symmetry of Grue:** The game uses a fixed color (Green/Blue), not a time-dependent predicate like "grue." Students won’t see how "grue" is empirically equivalent to "green" for past data.  
    - **Solution:** State this explicitly in debrief:  
      > "In our game, we assumed the post-cutoff color is Blue, but Goodman’s riddle introduces *grue*—green before \(T\), blue after. Evidence supports both 'green' and 'grue' equally, but we project 'green' because it’s entrenched. Our game’s prior mimics this entrenchment but hides the symmetry."

  **Materials Needed:**  
  - Randomizer for Group A (e.g., 10-sided die or app).  
  - Scoreboard for bets.  
  - Pre-drawn sequence if time is tight (e.g., \(c=5\): G, G, G, G, G, B, B, ...).  

  This activity forces students to confront projectibility head-on, setting up your introduction of Goodman’s riddle as the solution to the "live hypothesis" problem.
