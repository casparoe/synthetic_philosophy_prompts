prompt: |-
  I spent most of last night arguing with a friend about whether a certain shape of historical question is even well formed, and we stalled in a way that makes me think we were each gesturing at something I can't name. I'd like the carving rather than the label, so please don't stop at supplying a term.

  The shape is "why X in A but not in B?", of which the famous instance is "why the industrial revolution in Britain and not in China?" — the question usually called the Needham question, at the centre of the Great Divergence literature. My friend's position was that the question is perfectly well posed but merely hard: we need better data about Qing China, and eventually the causal list will sort itself out. I kept saying that something structural is wrong with the question itself, and that no amount of data fixes it. Neither of us could say precisely what.

  Here is the pattern I think I was reacting to, in two instances.

  First, the answers to such questions take the form of a list of features A had and B lacked. But when it turns out that B had one of those features too — commercialised handicraft production in the Yangzi delta, say, or a large internal market, or widespread literacy in practical arithmetic — the feature gets redescribed so that B's version doesn't count: not really a market, not really science, not really the same kind of city. The list survives every counterexample by moving its own terms. My friend says that's just ordinary scholarly revision of concepts; I think the revision is systematically one-directional, which is a symptom rather than a coincidence.

  Second, the choice of B seems to be fixed by the answer rather than by the question. We ask about Britain and China rather than Britain and, say, the Netherlands or Saxony — comparisons that are arguably better controls because they hold more background conditions fixed — because China is the case that dramatically lacks the outcome. That makes the contrast class a function of the very thing to be explained.

  Underneath both, I suspect a conflation of two different questions: what caused the outcome in A, and what made the difference between A and B. These can come apart. A may have had a genuine cause that B also had, with B's failure due to a separate blocker; or the cause of the outcome in A may not be the thing that distinguishes A from B at all ("why A and not B?" then has an answer that is no part of the answer to "why A?").

  My friend proposed a repair: distinguish comparisons whose contrast case is fixed in advance by matching on antecedently specified variables from comparisons whose contrast case is selected because it lacks the outcome, and treat only the first kind as respectable. I objected that even the "matched" case is chosen with hindsight about which variables matter, and that matching on the wrong variables can hide a real cause, so the distinction looks like one of degree and the repair looks cosmetic.

  So my questions. Is there an established concept or literature for (i) the one-directional redescription of the comparison case's features, (ii) the selection of the contrast class by the outcome, and (iii) the difference-making / cause-of-the-outcome conflation — and are these three aspects of one established thing or three different things that happen to travel together? Where are their edges? In particular, give me a boundary case: some "why A and not B?" that is entirely in order — my candidate is "why did this bridge fail and not that one, when both were built to the same specification?" — and say exactly which of the three features it lacks and why, since that is the test of whether you have located the real problem. Finally, on that basis: is the Needham question well posed, ill posed, or ill posed as stated but rescuable under a reformulation you should specify?

  End with a single machine-readable line in exactly this form: \answer{name: <short established label, or "no established name: " followed by your coinage>; verdict: <"well posed" | "ill posed" | "ill posed as stated, rescuable if…">}
reasoning: |-
  Okay, let me try to unpack this user's query. They had a heated debate with a friend about whether "why X in A but not in B?" questions are fundamentally flawed, using the Needham Question as a prime example. The user feels there's a structural problem beyond just data gaps, while their friend thinks it's merely difficult but valid.

  Hmm, I recognize this dilemma from historical methodology debates. The user identifies three specific issues: (1) features getting redefined to exclude B whenever counterexamples appear (like calling Chinese markets "not real markets"), (2) selecting B based on the outcome rather than controls (choosing China because it's dramatically different), and (3) conflating "what caused X in A" with "what made A different from B." 

  The bridge example they propose is telling - it works because the specifications create a natural control. But history lacks such controlled conditions. I recall this relates to what historians call the "comparative method" problems, though no single term covers all three issues. The moving-goalposts problem resembles what philosophers call "ad hoc rescue" in falsification debates. The case-selection bias echoes "selecting on the dependent variable" in social science methodology. And the conflation maps onto the difference between necessary/sufficient conditions and actual causation.

  For the boundary case test: their bridge example avoids all three pitfalls because (a) specifications define features objectively, (b) the "not B" choice isn't outcome-driven but design-controlled, and (c) causation vs. difference collapses when systems are near-identical. Whereas the Needham question fails on all counts - Qing China's features get reinterpreted through Eurocentric lenses, the comparison is chosen precisely for its dramatic divergence, and we can't assume shared causal pathways.

  The verdict seems clear: ill posed as stated. But it might be rescuable by reframing as "under what necessary/sufficient conditions did industrialization emerge?" using Mill's methods with multiple cases. Still, that risks reapplying the same biases unless we account for equifinality. 

  User's clearly deeply read in historiography - they reference Needham and Great Divergence literature precisely. Their frustration with "one-directional redescription" suggests they've spotted how Eurocentrism warps categories. Underneath, they might be seeking validation that their methodological unease is substantiated, not just pedantic. The coinage request shows they want conceptual tools, not just labels. 

  Final output must balance precision with accessibility: name the phenomena separately since no umbrella term exists, explain why the bridge case works as boundary, and give the reformulation explicitly. The machine-readable line needs exact formatting - no wiggle room there.
answer: |-
  Based on your dissection, here's the conceptual carving, boundary case analysis, and verdict:

  **(i) One-directional redescription:** This is **Conceptual Stretching/Conceptual Travel with Asymmetric Salvaging**. When a feature (F) allegedly present in A but absent in B is found in B, F is redefined (stretched) to exclude B's instance, salvaging the original explanation asymmetrically (only for A). This isn't neutral refinement; it's often driven by the outcome (industrialization as the telos) making B's features seem "incomplete" or "not real."

  **(ii) Selection of contrast by outcome:** This is **Selecting on the Dependent Variable (Outcome)**. B is chosen *because* it lacks outcome X, rather than based on antecedent similarity on potentially relevant controls. This biases the search for causes towards whatever differences are most salient *given the outcome*, potentially missing shared factors or blockers.

  **(iii) Cause-of-Outcome vs. Difference-Making conflation:** This is **Conflating Necessary/Sufficient Conditions with Actual Causation**. The question assumes the cause of X in A *must* be the critical difference from B. However:
      *   A's cause might be present but insufficient in B (B had blocker Z).
      *   The difference might be irrelevant (A had unique factor Y, B lacked it, but Y wasn't causal).
      *   X might have multiple sufficient pathways (equifinality).

  **Relationship:** These are three distinct but interconnected methodological pathologies that frequently co-occur in ambitious historical "Why A not B?" comparisons:
  *   **(ii) Selecting on the DV** creates the raw material for **(i) Asymmetric Salvaging** (differences *must* be found/exaggerated).
  *   **(ii) & (iii)** together drive the core confusion: assuming the salient difference (chosen because of the outcome) is *the* cause.
  *   **(i)** is the tactical maneuver used to protect the causal story derived from **(ii)** and **(iii)** when counter-evidence arises.

  **Boundary Case: "Why did Bridge A fail and Bridge B not fail, built to the same spec?"**
  *   **Lacks (i) Asymmetric Salvaging:** Features (materials, design, load) are defined *antecedently* by the shared specification. If Bridge B has a "steel beam," it's uncontroversially the same feature type as Bridge A's "steel beam." No redescription needed.
  *   **Lacks (ii) Selecting on the DV:** B is chosen *because* it matches A on the antecedent specification (the control), *not* primarily because it didn't fail. Outcome informs *which* matched pair is interesting, not *how* the pair is defined.
  *   **Lacks (iii) Conflation:** The cause of failure in A (e.g., a specific manufacturing defect in a beam) is highly likely to *be* the difference-maker from B (which lacked that defect). Causation and difference-making collapse because the systems are near-identical by design. Finding *the* difference *is* finding *the* cause.

  **Verdict on the Needham Question:**
  The Needham Question ("Why the Industrial Revolution in Britain and not in China?") as classically posed is **ill posed**.

  **Why:**
  1.  **Selects on the DV (ii):** China is chosen overwhelmingly *because* it lacked the IR outcome despite seeming "comparable" in scale/complexity, not due to rigorous antecedent matching on specific, agreed-upon potential preconditions.
  2.  **Invites Asymmetric Salvaging (i):** Features claimed as prerequisites (markets, science, proto-industry) found in China (e.g., Yangzi Delta) are persistently subject to qualifications ("not *really* capitalism," "not *real* science," "not *sustained*") to preserve Britain's uniqueness, demonstrating the bias.
  3.  **Conflates Cause & Difference (iii):** It assumes the cause(s) in Britain *must* be what China lacked. This ignores:
      *   China may have shared key factors but had potent blockers (e.g., resource distribution, state policies, internal instability).
      *   Britain's unique path might involve contingent, non-replicable elements irrelevant to China's trajectory.
      *   Industrialization might not have been a singular, inevitable outcome with one necessary pathway.

  **Rescue (If Possible):**
  The question is rescuable **only if radically reformulated away from the binary "Why A not B?" frame:**

  *   **Option 1 (Multiple Cases, Necessary/Sufficient Conditions):** "Under what necessary and/or sufficient conditions did sustained, transformative industrialization first emerge? How did the concatenation of factors (e.g., energy access, institutions, knowledge, demand, geopolitics) differ across relevant cases (e.g., Britain, China, Japan, Netherlands, India) in the early modern period, leading to divergent paths of development?" *(Uses J.S. Mill's methods with multiple cases to isolate conditions, avoiding binary outcome-driven selection)*.
  *   **Option 2 (Separate Causal Analyses):** "What were the specific causal mechanisms that led to the Industrial Revolution in Britain?" and separately, "What were the specific factors (blockers, alternative paths, lack of catalysts) that shaped China's distinct path of economic development in the 18th-19th centuries, preventing a similar *industrial* breakthrough at that time?" *(Explicitly decouples the causal analysis of A from the difference-making question with B)*.

  These reframings mitigate (ii) by selecting cases based on theoretical relevance or shared characteristics, not just outcome. They reduce (i) by requiring consistent definitions across cases. They directly address (iii) by not assuming the cause in A is simply what B lacked.

  \answer{name: no established name: Conceptual Salvaging (i), Selecting on Dependent Variable (ii), Causal/Difference Conflation (iii); verdict: ill posed as stated, rescuable if reformulated as a multi-case study of necessary/sufficient conditions for the outcome or as separate causal analyses of A and B's divergent paths}
