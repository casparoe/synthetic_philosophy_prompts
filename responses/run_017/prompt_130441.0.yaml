answer: |-
  Below is a committed plan for your 90-minute masterclass, structured to build understanding of Aumann's agreement theorem as a structural tool for diagnosing "earned" vs. "manufactured" disagreement in fiction. The plan prioritizes intuitive scaffolding, minimizes abstraction, and anticipates misconceptions. It uses a single, tightly designed scene to carry the core concepts, followed by the "leak test" for application. I've incorporated your constraints, and where I suggest minor adjustments to your framing (e.g., the leak test), I note it concisely with a rationale before proceeding.

  ### **Overall Structure & Timing**
  - **Total time:** 90 minutes.
  - **Pedagogy:** Start concrete (scene example), then abstract (theorem components), then applied (leak test). Avoid math; use character-driven narrative.
  - **Goal by end:** Writers can identify why a disagreement persists in their draft (earned via a "leak") or is contrived (no leak).

  ---

  ### **Order of Components and Why**
  *(45 minutes total for this section)*

  1. **The Disagreement Scene (Carrying Example)**  
     **Time:** 0-15 minutes (opening hook).  
     **Content:** Present a **single, self-contained scene** between two competent, rational characters with no hidden motives.  
     - **Characters:** Two doctors, Elara and Ben, reviewing the same medical scan for a patient. They must decide: "Is the tumor malignant (cancerous) or benign?"  
     - **Setup:**  
       - Both saw the identical scan (same evidence).  
       - Both have the same medical training (common prior implied).  
       - Both are rational, honest, and want the truth (no stubbornness/bad faith).  
     - **Disagreement:**  
       - Elara says: "I’m 80% sure it’s malignant."  
       - Ben says: "I’m 80% sure it’s benign."  
       - *They discuss but neither changes their mind.*  
     - **Why start here?**  
       - Immediately engages writers with relatable conflict (medical stakes).  
       - Shows disagreement that feels "manufactured" — writers will sense it’s odd but can’t yet articulate why. Creates cognitive dissonance to resolve.  
     - **What it lacks (crucially):** No leaks yet. No hidden evidence, no prior asymmetry, no irrationality. This forces the theorem to "break" the scene later.  

  2. **Common Prior**  
     **Time:** 15-20 minutes.  
     **Content:** Define "common prior" as **shared starting point + shared rules for updating beliefs**. Use the scene:  
     - "Elara and Ben have the same medical training: they agree on how scans work, what malignancy looks like statistically, and how to weigh evidence."  
     - **Analogy:** "Like two chefs with the same recipe book—they start with identical instructions."  
     - **Why here?**  
       - Builds from the scene’s implied context. Writers accept it intuitively ("of course they have the same training").  
       - Moving it later would make the scene feel absurd too early; moving it earlier feels abstract.  

  3. **Posterior Beliefs**  
     **Time:** 20-25 minutes.  
     **Content:** Define "posterior" as **current belief after seeing evidence**. Use the scene:  
     - "Elara’s 80% malignant and Ben’s 80% benign are their posteriors after seeing the scan."  
     - Emphasize: "Posteriors are personal conclusions, not facts."  
     - **Why here?**  
       - Natural progression from prior ("they started together, now they’re apart").  
       - Sets up the core mystery: same evidence + same prior = same posterior? (Spoiler: yes, so why disagree?).  

  4. **Common Knowledge vs. Mutual Knowledge**  
     **Time:** 25-35 minutes.  
     **Content:** Distinguish:  
     - **Mutual knowledge:** "Elara knows Ben’s belief, and Ben knows Elara’s." (They stated it.)  
     - **Common knowledge:** "Elara knows Ben knows her belief, Ben knows Elara knows his, and so on forever. In practice, it’s achieved when no one has doubts about what everyone knows."  
     - **Scene analogy:** "If they state beliefs in person and acknowledge understanding, it’s common knowledge. If they text and one doubts delivery, it’s not."  
     - **Why here?**  
       - Writers will assume "they talked, so they know" — this forces precision.  
       - Moving it earlier overcomplicates the scene; moving later misses why their discussion failed.  

  5. **Iterated Updating as Evidence**  
     **Time:** 35-45 minutes.  
     **Content:** Explain that **each refusal to update is new evidence**. Use the scene:  
     - "When Ben hears Elara’s 80% malignant and doesn’t budge, Elara thinks: 'He must have a reason.' If Ben is rational, this suggests Elara missed something. But they have the same evidence! Contradiction."  
     - **Key:** "One round of talking isn’t enough. Rational characters would keep discussing until beliefs align or a leak is exposed."  
     - **Why here?**  
       - Resolves the scene’s tension: their disagreement is impossible unless something’s broken.  
       - Depends on understanding common knowledge (step 4); moving earlier makes updates seem optional.  

  6. **Beliefs vs. Preferences**  
     **Time:** 45-50 minutes.  
     **Content:** Clarify the theorem **only applies to factual beliefs, not values**. Contrast with the scene:  
     - "Elara and Ben disagree on facts (malignant/benign). But if they agreed it’s 50% malignant, they could still argue about surgery—that’s preferences, and the theorem doesn’t touch it."  
     - **Why here?**  
       - Writers often conflate fact-arguments with value-arguments. Placing this last prevents misapplication.  
       - If moved earlier, it dilutes the focus on belief structure.  

  ---

  ### **The Carrying Example: Full Requirements**
  - **What it contains:**  
    - Two competent professionals (doctors) with identical evidence (scan) and training (common prior).  
    - Symmetric disagreement (both 80% confident in opposite conclusions).  
    - A discussion where beliefs are shared (mutual knowledge) but persist.  
  - **What it lacks:**  
    - No hidden evidence (same scan seen by both).  
    - No prior asymmetry (same training).  
    - No irrationality (no ego, trauma, or deception).  
    - No preferences (purely factual disagreement).  
  - **Why it works:**  
    - Feels "off" to writers, priming them for the theorem. Later, we reveal the leak: in reality, same prior + same evidence + common knowledge → same posterior. Their disagreement is only possible if a condition fails (e.g., they don’t truly share a prior).

  ---

  ### **Misconceptions: Order and Mitigation**
  Writers will form these in real-time. Address them at these points:  

  1. **"This means characters should meet in the middle."**  
     **When:** During posterior beliefs (step 3) or scene discussion.  
     **Why:** Humans default to compromise; writers will project this.  
     **Head off:** During iterated updating (step 5): "No—convergence isn’t averaging. It’s a new belief from all evidence. If Elara and Ben update rationally, they’d agree on one answer (e.g., 50%), not 50/50."  

  2. **"It assumes the same evidence, not the same prior."**  
     **When:** During common prior (step 2).  
     **Why:** "Prior" sounds abstract; "evidence" feels tangible.  
     **Head off:** When defining prior: "The prior is their shared starting rules. Evidence is what they see. They can have different evidence and still converge if priors are shared—but here, they don’t."  

  3. **"Convergence should happen in one conversation."**  
     **When:** During scene discussion or iterated updating (step 5).  
     **Why:** Writers expect quick resolutions.  
     **Head off:** During iterated updating: "Rational updating takes multiple rounds. If Ben doesn’t move immediately, that’s new evidence for Elara to process. One exchange isn’t enough."  

  4. **"This is how real people behave."**  
     **When:** When stating the theorem (next section).  
     **Why:** Writers anthropomorphize theorems.  
     **Head off:** Explicitly: "This is a constraint on coherent scenes, not real life. Real people have biases—fiction needs intentional leaks."  

  5. **"Disagreement is always about values or emotions."**  
     **When:** During beliefs vs. preferences (step 6).  
     **Why:** Writers default to psychology.  
     **Head off:** When introducing preferences: "The theorem isolates belief disagreements. If your characters argue about facts but share priors/evidence, irrationality isn’t the only leak—common knowledge might be missing."  

  6. **Missed misconception: "Common knowledge is just talking openly."**  
     **When:** During common knowledge (step 4).  
     **Why:** Writers equate dialogue with understanding.  
     **Head off:** "Common knowledge requires no doubts. If Elara worries Ben is lying, it’s broken. Fiction can use this leak deliberately."  

  ---

  ### **Leak Test Integration**
  - **Time:** 50-70 minutes (after all components).  
  - **Content:**  
    - Revisit Elara and Ben: Their disagreement is unearned because no leak exists—same prior, same evidence, common knowledge of posteriors, and rationality. By the theorem, they must agree.  
    - **Introduce the leak test:** "For any disagreement in your drafts:  
      1. Identify the leak:  
         - A: No common prior (e.g., different training).  
         - B: Posteriors not common knowledge (e.g., hidden doubts).  
         - C: Inference too costly (e.g., character skips rational updates).  
         - D: Value difference (e.g., arguing what to do, not what is).  
      2. If no leak, the scene is contrived."  
  - **Why here?**  
    - After the theorem and scene, writers see the test as diagnostic, not prescriptive.  
    - **Your framing note:** *I worry the leak test oversimplifies if used early, but placed here—after depth—it frames leaks as narrative tools, not excuses.*  
  - **Check for understanding:**  
    - **Activity (70-80 minutes):** Give a quick example: "Two detectives see the same crime-scene photos. Both are rational. One thinks Suspect A did it; the other, Suspect B. They debate but don’t agree. What leak applies?"  
    - **Answer:** "A (no common prior—e.g., different profiling training) or B (posteriors not common knowledge—e.g., one hides their uncertainty)."  
    - **Why:** Tests structural grasp (isolating leaks) vs. slogan-memorization.  

  ---

  ### **Refusal to Explain**
  - **Time:** During Q&A or if writers digress (80-85 minutes).  
  - **What to refuse:**  
    - **Bayesian math:** "I won’t explain Bayes’ rule—it’s not needed. We’re treating updating as a rational black box for fiction."  
    - **Proof of theorem:** "I won’t prove Aumann—we’re using it as a lens for scenes, not debating math."  
    - **Real-world behavioral economics:** "I won’t discuss why real people disagree—focus is on fictional coherence."  
  - **Why:** Keeps session focused on application, not theory.  

  ---

  ### **Closing (85-90 minutes)**
  - **Summary:** "Aumann reveals that persistent disagreement needs a leak—else it’s manufactured. Use the leak test to audit your scenes."  
  - **Final prompt:** "Open your drafts. Find an argument scene. Ask: What leak earns this? If nothing, what could—a prior difference? A hidden doubt?"  

  This plan ensures writers leave with:  
  - A concrete scene to model the theorem.  
  - A step-by-step mental model for leaks.  
  - A practical tool (leak test) for revision.  
  By front-loading the example and back-loading application, it balances engagement with rigor, respecting your writers’ craft.
