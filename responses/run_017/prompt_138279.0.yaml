  - Form P7 framework with numbered clauses
  - Deadpan tone with subtle institutional voice
  - Worked examples showing rejected/granted cases
  - Appendix of unanswered questions

  For the bureaucratic logic:
  - Section 1 establishes non-existence as default comparator
  - Section 2 voids all child-centric reasoning (pleasure/consent thresholds)
  - Section 3 creates the "Unattributed Non-Existence Benefit" ledger entry
  - Section 4 allows only parental welfare effects as valid inputs
  - Later revisions retract any beneficiary-sneaking clauses

  Worked examples:
  - Case A: "Child's enjoyment" rejected (invalid beneficiary)
  - Case B: Parental fulfillment granted (surviving optimism bias discount)

  The appendix's unanswered questions will highlight paradoxes:
