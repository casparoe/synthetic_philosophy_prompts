prompt: |-
  I'm in a 4th-year seminar right now on measurement and machine learning (cross-listed between philosophy and the i-school), we spent most of last week on Goodhart's law, and I've realised the thing I keep noticing isn't quite it and I don't know what to call it.

  The pattern: you pick a proxy, you optimise against it, the proxy goes up and up, and the thing you actually cared about really does improve — genuinely, not just on paper. But the proxy quietly stops being able to tell apart the cases you now actually have. It hasn't stopped tracking the target in the coarse sense: if you plotted the whole history including the bad old days, it would still correlate fine. It's just that everything you now see is crammed into a narrow band near the top where the proxy has no resolution left, so a real improvement and a real collapse look identical, and the number you were relying on as an early-warning system has gone deaf.

  Three cases I keep coming back to:

  1. My sleep tracker's "sleep score". I actually fixed my sleep — same bedtime, dark room, nothing to drink after nine. Score went from around 70 to a steady 92–95. And now it's useless: it gives me 93 whether I wake up fine or wake up wrecked, and if something new started ruining my sleep I genuinely don't think the number would budge.
  2. My university's counselling service started being measured on time-to-first-response for intake. They got fast, the average dropped under an hour, good. Then the bottleneck moved to the second appointment, a real backlog built up, and the response-time number just sat there. Nobody gamed anything, and the number still measures exactly what it says it measures.
  3. Our course project: we fine-tuned a summariser against a learned reward model. Rewards climbed smoothly. The outputs weren't doing the obvious reward-hack stuff we'd been warned about — no all caps, no weird padding — they just stopped getting better in any way any of us could detect, while the number crept up. And we had no way to tell whether we were still improving or had quietly broken something.

  So: is there an established concept for this? So far everyone just says "that's Goodhart", but the flavors we went through in class don't seem to fit — nobody is adversarially gaming the measure, it isn't regression toward the mean from selecting on a noisy proxy, it isn't the extreme-tails version, and the causal link between proxy and target hasnt been broken by the optimisation. Someone said Campbell's law, someone said restriction of range, someone said it's just the base-rate problem (the outcome got rare, so the measure got noisy). All feel close, none feel right, and I also can't tell whether case 2 is even the same phenomenon as 1 and 3 or a different one where the bottleneck just moved downstream.

  I don't want a label on its own — I want to know what exactly the phenomenon is, how it differs from each of the nearby things, whether it's really a special case of one of them, and where its edges are. Is it still the same thing if the proxy lost resolution because you *selected* on it rather than optimised against it? What if the target hasn't changed at all? What if the proxy still has plenty of variance but the variance has stopped meaning anything? If there's no name, coin one and define it, including the cases where you'd say no, that's not an instance. And is there any way to tell from the numbers alone, before it bites you, that you've slid into it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a seminar on measurement and machine learning, and they've noticed a recurring pattern that isn't quite captured by Goodhart's law. They describe a scenario where optimizing a proxy improves the actual target, but then the proxy loses resolution in the high-performance range. They give three examples: a sleep tracker, a counseling service, and a machine learning project. 

  First, I need to understand why existing concepts don't fit. The user mentions that their class discussed Goodhart's law, but the adversarial gaming or broken causal links aren't present here. Campbell's law involves corruption due to stakes, which isn't the case. Restriction of range is a statistical issue but doesn't explain the optimization part. Base-rate fallacy is about probability misestimation, which isn't the core issue.

  Looking at their examples, all three share a common thread: the proxy works initially, improvement happens, but then the proxy becomes insensitive in the high-performance region. The key is that the measure loses discriminative power at the top end without any manipulation. 

  I recall concepts like the "ceiling effect" in psychometrics, where scores cluster at the top, limiting variance. But that's more about test design than optimization. In engineering, "sensor saturation" happens when a sensor can't detect beyond a certain range. Combining these ideas with the optimization aspect might create a new term. 

  The user wants a clear definition, boundaries, and ways to detect the issue early. They also wonder if their second example (counseling service) is the same phenomenon. In that case, the bottleneck shifted downstream, but the core issue is the same: the proxy no longer detects problems because it's saturated at the top. 

  For detection, they need to monitor the variance of the proxy and the target. If the proxy's variance decreases while the target's variance remains high, that's a red flag. Also, tracking other downstream metrics could help, like the second appointment backlog in the counseling example. 

  They asked about selection vs. optimization. If you select on a proxy (e.g., hiring based on test scores), the same loss of resolution can occur without active optimization. The key is the reduction in proxy variance at high performance levels. 

  Is there an existing term? "Indicator saturation" or "resolution collapse" come to mind. Defining it clearly with the optimization component is crucial. Also, distinguishing from Goodhart: here the link isn't broken; it's just that the proxy's sensitivity is gone in the high end. 

  Finally, for the ML project, they might need a validation set with human evaluations since the reward model stopped being discriminative. Monitoring the distribution shifts and checking for latent variables could help preempt the problem.
answer: |-
  This is a brilliant observation, and you're right to feel unsatisfied with existing terms like Goodhart's law variants, Campbell's law, restriction of range, or base-rate fallacy. Your pattern describes a distinct **measurement failure mode arising from the *successful* optimization of a valid proxy in a bounded context.**

  **Core Phenomenon: Resolution Collapse under Optimization (RCO)**

  Here's a definition incorporating your key insights:

  > **Resolution Collapse under Optimization (RCO)** occurs when:
  > 1.  A **valid proxy metric** is selected to represent a **complex target outcome**.
  > 2.  **Deliberate optimization pressure** is applied to this proxy.
  > 3.  Optimization **genuinely improves the target outcome** (the causal link holds).
  > 4.  **The variance of the proxy metric collapses significantly** within the "high-performance" regime achieved by optimization.
  > 5.  This collapse **renders the proxy incapable of discerning meaningful variation** in the *actual target outcome* within this new high-performance state.
  > 6.  Crucially, **no adversarial gaming, causal break, or fundamental invalidity of the initial proxy is required**. The proxy simply loses its discriminatory power at the top end.

  ### Why Existing Terms Don't Fully Fit

  1.  **Goodhart's Law (General & Variants):**
      *   *General:* "When a measure becomes a target, it ceases to be a good measure." Too broad. RCO is a specific *mechanism* by which this happens *despite initial validity and genuine improvement*.
      *   *Regressive:* Relies on measurement noise/error. RCO can happen with perfectly reliable proxies.
      *   *Extremal:* Involves optimizing *beyond* the intended domain, breaking the causal link. In RCO, optimization remains *within* the intended domain, the causal link holds, but resolution vanishes at the high end.
      *   *Adversarial:* Involves deliberate manipulation. RCO requires no bad faith.
  2.  **Campbell's Law:** Focuses on corruption *caused by* high stakes (e.g., teaching to the test). RCO can occur without any corruption or high stakes; it's an inherent consequence of optimizing a bounded proxy *even if done perfectly honestly*.
  3.  **Restriction of Range:** A statistical phenomenon where correlation weakens due to reduced sample variance. RCO is a *causal consequence of optimization* that *causes* restriction of range in the proxy *specifically in the high-performance state*, making it useless for ongoing monitoring *despite* the underlying target potentially still having variance. The restriction is the *symptom*, optimization is the *cause*, and the loss of monitoring capability is the *failure*.
  4.  **Base-Rate Problem:** Concerns the rarity of an *outcome* affecting predictive power. In RCO, the *target outcome* (e.g., good sleep, effective service, good summary) may become common, but the *variation within that good outcome* is what matters. The problem is the loss of resolution in the *proxy* for detecting *variation* in the common good outcome, not necessarily the rarity of the outcome itself.

  ### Why Your Cases ARE RCO

  1.  **Sleep Tracker:** Valid proxy (correlates with sleep quality). Optimized (behavior changes). Target improved (better sleep). Proxy collapsed to 92-95 (loss of variance). Cannot discern "good sleep" vs. "great sleep" vs. "slightly disturbed sleep" within the high band. No gaming, causal link intact.
  2.  **Counseling Service:** Valid proxy (response time matters). Optimized (process changed). Target improved (faster initial response). Proxy collapsed (sub-hour average). Cannot discern system health *after* initial response (bottleneck moved downstream). Proxy still accurately measures initial response time, but this measure is now blind to the *current critical bottleneck*. **This IS RCO:** The optimization succeeded on the proxy, moved the system into a state where the key variance in overall service quality (wait for second appointment) is no longer captured by the original proxy, which is now saturated at the top.
  3.  **ML Summarizer:** Valid proxy (learned reward model). Optimized (fine-tuning). Target improved (initially better summaries). Reward collapsed to high values. Cannot discern if summaries are still improving or have plateaued/degraded subtly. No obvious reward hacking; the proxy just lost resolution at the high end. Causal link (reward model preference) likely still holds *in principle*, but provides no signal.

  ### Boundaries & Edge Cases

  *   **Selection vs. Optimization:** Selecting on a proxy (e.g., hiring only people with test scores > 90) can *also* cause RCO for the *selected population*. The key driver is the **reduction in proxy variance in the high-performance group**, making it useless for distinguishing within that group. Optimization is the most common *cause*, but selection is another pathway.
  *   **Target Unchanged:** If the optimization pressure *doesn't* genuinely improve the target outcome (e.g., you "optimize" sleep score by hacking the tracker, not by sleeping better), that's **classic adversarial Goodhart**, not RCO. RCO *requires* genuine target improvement. If the target *never* changes but the proxy collapses (e.g., sensor drifts), that's **instrument failure**, not RCO.
  *   **High Proxy Variance but Meaningless:** If the proxy still has high variance but it no longer correlates with the target *at all*, that's **proxy breakdown** (Goodhart/Campbell). If the variance is high but doesn't reflect *meaningful* target variation (e.g., noisy measurement), that's **regressive Goodhart** or just **measurement noise**. RCO is specifically about the *loss of variance* in the proxy *after successful optimization*, rendering it insensitive to *real* variations in the target *within the high-performance band*.
  *   **Edge: Ceiling Effect:** A ceiling effect (where scores cluster at the theoretical maximum) is a common *cause* or *manifestation* of RCO. But RCO can also occur slightly below the absolute ceiling if variance collapses sufficiently (e.g., counseling service times clustered well above the minimum possible but below the old average).

  ### Detection: Can You Spot It Before It Bites?

  **Yes, potentially, by monitoring the right signals:**

  1.  **Collapsing Proxy Variance:** This is the hallmark. Track the **standard deviation**, **range**, or **interquartile range (IQR)** of the proxy metric *over time*. A significant and sustained *decrease* in variance, especially after initial improvement, is a major red flag. Plot the distribution - is it becoming a narrow spike? In your ML case, watching the *distribution* of rewards per batch/generation, not just the average, would have shown it collapsing.
  2.  **Decoupling from Downstream/Ancillary Metrics:** As in your counseling case. If your key proxy (time-to-first-response) is stable at high performance, but other metrics downstream (time-to-second-appointment, client satisfaction, counselor workload) start degrading, it signals the proxy is no longer capturing the system's critical state.
  3.  **Stable Proxy Despite Known Interventions:** If you make a change *known* to affect the target (e.g., have a terrible night's sleep deliberately, introduce a known slowdown in a non-first-step counseling process, try a radically different summarizer architecture), but the proxy metric *doesn't budge*, it's likely saturated/resolution collapsed.
  4.  **Human Judgment Divergence:** When domain experts (you judging your sleep, counselors judging system health, humans judging summaries) consistently perceive variations that the stable proxy metric utterly fails to reflect, RCO is likely at play.
  5.  **Sensitivity Analysis:** In designed systems (like ML), test the proxy's response to *small, controlled perturbations* of inputs or parameters known to affect the target. If the proxy shows minimal/no response within the high-performance band, it's lost resolution.

  **Why it's hard to spot *just* from the proxy number:** The collapsing variance *is* the key signal, but it requires looking beyond the mean/trend and actively monitoring the distribution's spread. Focusing solely on "the number going up" blinds you to its loss of information.

  ### In Summary

  You've identified **Resolution Collapse under Optimization (RCO)**: A measurement failure where successful optimization of a valid proxy genuinely improves the target but drives the proxy into a state of minimal variance where it becomes insensitive to meaningful variations in the target outcome within the new high-performance regime. It's distinct from Goodhart variants due to the lack of gaming/causal break and the genuine initial improvement. It's distinct from restriction of range because the range restriction is the *result* of optimization and *causes* the monitoring failure. It's a critical pitfall in any performance management or optimization loop where proxies are used. Monitoring proxy *variance* and *downstream metrics* is essential for early detection.
