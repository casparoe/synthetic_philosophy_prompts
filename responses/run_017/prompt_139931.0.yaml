  Now, the core of your question: are these two phenomena the same? And what is the shading down when uncertain?

  The shading down (betting less than the Kelly fraction when uncertain about the edge) is a form of robust control. It's a way to protect against the possibility that your estimated edge is too high. This is sometimes called "fractional Kelly" (betting a fraction of the Kelly bet) and is justified by uncertainty about the true probabilities.

  The phenomenon in the second part (merging vs. splitting) is about model uncertainty and model selection. It's about aggregating information from multiple sources.

  They are related in that both deal with uncertainty, but they are distinct:

  1. The first is about uncertainty in the probability estimate for a single bet, leading to a reduction in bet size (shading down).

  2. The second is about uncertainty in which of two models (forecasters) is correct, leading to a structural choice between merging and splitting.

  However, note that one can also use a Bayesian approach to combine the two forecasters and then shade down the merged estimate due to remaining uncertainty. So they can be combined.

  **What's the Name?**

  The first phenomenon (asymmetric penalty for overbetting) is a property of the Kelly criterion and is often discussed in the context of "fractional Kelly" strategies. The idea of reducing the bet fraction due to uncertainty is sometimes called "Kelly with uncertainty" or "robust Kelly".

  The second phenomenon (merging vs. splitting) is related to the literature on forecast aggregation and portfolio selection under model uncertainty. It is similar to the concept of "model averaging" vs. "model selection".

  **Your Specific Questions:**

  1. *Does the lopsidedness survive if winnings aren't reinvested and every bet uses fresh money?*

     If you are not reinvesting, then the bet sizing is independent each time. The growth rate per bet is still defined as the expected log return per bet. The asymmetry in the growth rate function (the fact that overbetting hurts more) is still present. However, the long-run compounding effect (like the risk of ruin) is not an issue because you are not compounding. But note: the penalty for overbetting is still there in the form of lower expected log return per bet.

  2. *Or if there's only ever one bet?*

     For a single bet, the Kelly criterion maximizes the expected log wealth, which is equivalent to maximizing the geometric mean. However, without repeated bets, the rationale for using log utility is less compelling. In a single bet, the asymmetric penalty is still present in the growth rate function (as we computed above for one bet: G(f) is asymmetric). But for a single bet, if you are not concerned with the long run, you might use a different utility function.

  3. *Or if my bankroll is topped up from outside after every round?*

     If the bankroll is reset to a fixed amount after every round, then each round is independent and the problem reduces to a single bet per round. The growth rate per round is still the expected log return. The asymmetry in the growth rate function remains. However, the risk of ruin is eliminated because you are reset. But note: overbetting can still lead to negative expected log return, which means that in the long run (if you care about the total log wealth) you will do worse.

  4. *Is "I just hate deep drawdowns" an instance of the same thing or something else entirely?*

     The aversion to deep drawdowns is a separate issue, but it is related. The Kelly criterion naturally avoids ruin (if you bet the full Kelly fraction and the bet has a positive edge, you avoid ruin almost surely in the long run). But overbetting increases the chance of deep drawdowns. The shading down due to uncertainty is partly motivated by avoiding deep drawdowns in case the true probability is less than estimated. So it is a way to manage drawdowns. But if you have a separate, additional aversion to drawdowns, you might shade down even more. That would be a form of risk aversion beyond the log utility.

  **Carving the Concepts:**

  Let me define two concepts:

  1. **The Kelly Asymmetry:** The property that the expected log growth rate is more sensitive to overbetting than underbetting. Specifically, the function G(f) has a negative second derivative and is skewed such that the left tail (underbetting) is flatter than the right tail (overbetting). This is an intrinsic property of the Kelly growth function.

  2. **Robust Fractional Kelly:** The strategy of betting a fraction of the Kelly fraction when there is uncertainty about the true probabilities. This is a response to model risk. The fraction is chosen to maximize the expected growth rate under the uncertainty (which might be represented by a prior distribution over p). This is distinct from the asymmetry, but the asymmetry motivates it because the cost of overbetting is high.

  3. **Forecaster Aggregation Dilemma:** The choice between merging (averaging the probabilities and then betting) and splitting (letting each forecaster bet independently on a portion of the bankroll). This is a form of model uncertainty. The optimal choice depends on the correlation of the forecasters' errors and the prior belief about their relative accuracies.

  **A Case that Looks Like an Instance but Isn't:**

  Consider a situation where you have two forecasters, and you are certain that one is correct but you don't know which. Then splitting is clearly better because it allows the correct one to dominate. But if you merge, you are averaging the two, which dilutes the better one. This is an instance of the Forecaster Aggregation Dilemma.

  Now, consider a situation where you are uncertain about the true probability, but you have only one forecaster. Then you shade down the bet. This is Robust Fractional Kelly.

  But what if you have two forecasters and you merge and then shade down? That would be combining the two. This is a third strategy. The relative performance of these strategies depends on the details.

  **Conclusion:**

  The two phenomena you describe are distinct but related. The first (asymmetric penalty for overbetting) is a mathematical property of the expected log growth function. The second (merging vs. splitting) is a strategy choice under model uncertainty. The shading down in the first is a form of robust control, which is a different kind of response to uncertainty than the splitting strategy.

  In summary:

  - The lopsided hill is the Kelly Asymmetry.
  - The shading down when uncertain is Robust Fractional Kelly.
  - The combine-two-forecasters dilemma is the Forecaster Aggregation Dilemma.

  They are all facets of decision-making under uncertainty in repeated betting.
answer: |-
  ### Step 1: Brainstorming Candidate Framings
  I'll start by identifying two core phenomena from your description, then propose candidate conceptual framings for each. After testing them against your observations, I'll select the best fit and explain why the others fall short.

  **Phenomenon 1: Lopsided Growth-Rate Sensitivity**  
  *Observation:* When betting a fraction \( f \) of your bankroll with estimated edge \( e \) (where \( f^* = e \) is Kelly-optimal), the expected log growth rate \( G(f) \) is asymmetric. Betting \( f = 2e \) yields \( G(f) \approx 0 \) (near-stagnation), while \( f = e/2 \) retains ~75% of optimal growth. This forces aggressive down-shading when uncertain about \( e \).  

  **Phenomenon 2: Forecast Aggregation Dilemma**  
  *Observation:* When combining probabilities from two forecasters for repeated bets, "merging" (average probability, bet full bankroll) outperforms "splitting" (bet halves independently) if errors cancel, but splitting wins long-term if one forecaster is consistently better. Short-term results mask this, appearing as a wash.  

  **Candidate Framings:**  
  1. **Robust Control Perspective**  
     - Focuses on *parameter uncertainty*. Down-shading is hedging against misestimation of \( e \), leveraging Kelly's asymmetry.  
     - Tests: Does it explain both phenomena? How does it handle aggregation?  
  2. **Multi-Armed Bandit (MAB) Perspective**  
     - Frames aggregation as *exploration vs. exploitation*. Splitting allows natural selection of the better forecaster.  
     - Tests: Does it capture the lopsided hill? Is it distinct from uncertainty hedging?  
  3. **Utility Curvature Perspective**  
     - Attributes lopsidedness to properties of log utility. Asymmetry arises from \( G(f) \)’s convexity left of \( f^* \) and concavity right.  
     - Tests: Is it fundamental or derivative? Does it generalize?  

  ### Step 2: Calculations to Ground the Framings  
  **Phenomenon 1 Calculation:**  
  Take a binary bet with win probability \( p = 0.6 \), even-money payoff (net odds \( b = 1 \)). True edge \( e = p - 0.5 = 0.1 \), so Kelly fraction \( f^* = e = 0.1 \).  
  - Growth rate: \( G(f) = p \ln(1 + f) + (1 - p) \ln(1 - f) \).  
  - At \( f^* = 0.1 \): \( G(0.1) \approx 0.0150 \).  
  - At \( 2f^* = 0.2 \): \( G(0.2) \approx -0.0201 \) (negative, stagnation).  
  - At \( f^*/2 = 0.05 \): \( G(0.05) \approx 0.0112 \) (~75% of \( G(f^*)\)).  
  *Verifies asymmetry: Overbetting by 100% destroys growth; underbetting by 50% preserves most of it.*  

  **Phenomenon 2 Calculation:**  
  Two forecasters, true \( p = 0.6 \).  
  - *Case A (Errors cancel):* Forecaster 1: \( p_1 = 0.7 \), Forecaster 2: \( p_2 = 0.5 \).  
    - Merging: \( p_{\text{merge}} = 0.6 \), \( f^* = 0.1 \), growth optimal.  
    - Splitting: Each half-bankroll bets their \( f_i^* \). Asymptotic growth = average of individual \( G(f_i^*) \).  
    - Result: \( G_{\text{merge}} \approx 0.0150 \), \( G_{\text{split}} \approx 0.0125 \) (merge wins).  
  - *Case B (One dominant):* Forecaster 1: \( p_1 = 0.6 \) (true), Forecaster 2: \( p_2 = 0.9 \).  
    - Merging: \( p_{\text{merge}} = 0.75 \), \( f^* = 0.25 \), \( G \approx -0.008 \) (overbetting ruin).  
    - Splitting: Forecaster 1’s half grows at \( G \approx 0.0150 \), Forecaster 2’s half at \( G \approx -0.067 \). After 100 bets, split bankroll > merge despite initial lag.  
  *Shows merge thrives with uncorrelated errors; split wins with persistent skill differences.*  

  ### Step 3: Evaluating Candidate Framings  
  **Framing 1: Robust Control (Best Fit)**  
  - **What it is:** Down-shading and aggregation choices are responses to *Knightian uncertainty* in edge estimation. Kelly’s asymmetry amplifies the cost of overconfidence, making robustness critical.  
  - **Why it fits Phenomenon 1:**  
    - Uncertainty \( \sigma_e \) about edge transforms the problem: Maximizing \( \mathbb{E}[G(f)] \) over a prior for \( e \) shifts \( f_{\text{robust}} < f^* \).  
    - Math: If \( e \sim \mathcal{N}(0.1, \sigma^2) \), optimal \( f \) solves \( \int G(f)  dP(e) \). For \( \sigma = 0.05 \), \( f_{\text{robust}} \approx 0.07 \) (30% down-shade), avoiding negative \( G \).  
    - Your instinct ("shade down hard") is optimal Bayesian or minimax under uncertainty—not risk aversion.  
  - **Why it fits Phenomenon 2:**  
    - Merging averages probabilities, reducing variance when errors cancel (like a pooled estimator). Splitting is robust when unsure which forecaster is reliable, as it *diversifies model risk*.  
    - Short-term "pointless compromise" in splitting reflects exploration cost; long-term takeover is exploitation emerging.  
  - **Edge cases:**  
    - Non-reinvestment: Asymmetry persists (curvature of \( G(f) \) is intrinsic), but no compounding. Down-shading still optimal if uncertainty exists.  
    - Single bet: Asymmetry irrelevant; max expected log is still Kelly, but down-shading rational if you suspect \( p \) is misspecified.  
    - Bankroll top-ups: Resets risk, but \( G(f) \) asymmetry remains. Down-shading still advised under uncertainty.  
  - **Distinction from risk aversion:** You dislike drawdowns only insofar as they destroy compounding. Robust control targets *survival*, not smoothness.  

  **Framing 2: Multi-Armed Bandit (Partial Fit)**  
  - **What it is:** Splitting is natural selection via parallel exploration; merging commits to one "arm."  
  - **Why it fits Phenomenon 2:**  
    - Splitting’s slow takeover resembles Thompson sampling: The better forecaster’s bankroll share \( \to 1 \) exponentially.  
  - **Why rejected:**  
    - Fails Phenomenon 1: MAB doesn’t explain growth-rate asymmetry or down-shading. Ignores parameter uncertainty within each "arm."  
    - Doesn’t unify: Your down-shading instinct isn’t about exploration.  

  **Framing 3: Utility Curvature (Incomplete)**  
  - **What it is:** Lopsidedness arises from \( G(f) \)’s mathematical properties:  
    - \( \frac{d^2G}{df^2} < 0 \) everywhere, but steepness increases for \( f > f^* \).  
    - Taylor expansion: \( G(f) \approx G(f^*) - \frac{1}{2} K (f - f^*)^2 \), with \( K \) larger for \( f > f^* \) due to \( \ln(1 - f) \) singularity at \( f = 1 \).  
  - **Why partially fits:**  
    - Explains Phenomenon 1’s asymmetry universally.  
  - **Why rejected:**  
    - Doesn’t explain down-shading under uncertainty: Curvature is a given, but *response* to uncertainty requires decision theory.  
    - Silent on aggregation: No insight into merging vs. splitting.  

  ### Step 4: The Verdict – Robust Kelly Optimization  
  **The core concept:** Your phenomena are two facets of *robust growth-rate maximization under probability misestimation*. It’s not just fractional Kelly; it’s *which fraction* under *which uncertainty structure*.  
  - **Phenomenon 1** is robust control for *parametric uncertainty*.  
  - **Phenomenon 2** is robust control for *model uncertainty* (which forecaster’s model is true).  

  **What it is and isn’t:**  
  - **Is:** A blend of Bayesian decision theory and Kelly optimization. Key tenets:  
    - Growth asymmetry necessitates conservatism when inputs are suspect.  
    - Aggregation method depends on error correlation: Merge for uncorrelated noise, split for structural disagreements.  
  - **Isn’t:**  
    - Not general risk aversion: You’d take a volatile bet with *known* odds, so it’s purely epistemic.  
    - Not mean-variance optimization: Log utility cares about full distribution, not just moments.  
    - Not just "fractional Kelly": It specifies *how* to choose the fraction (e.g., integrate over \( p \)’s posterior).  

  **Edge Cases Dissected:**  
  - **Non-reinvested bets:** Asymmetry *survives* (it’s in \( G(f) \)), but down-shading matters less—no compounding to protect. Optimal \( f \) still lower if uncertain.  
  - **Single bet:** Asymmetry irrelevant; Kelly still max expected log, but if distrusting \( p \), down-shade.  
  - **Topped-up bankroll:** Asymmetry *survives* (curvature unchanged), but ruin impossible. Down-shading wise if uncertainty exists.  
  - **"I hate deep drawdowns":** Not the same. Drawdown aversion is preference-based (e.g., prospect theory). Your shading is belief-based (uncertainty). They conflate only if drawdowns cause misestimation (e.g., bankruptcy preventing learning).  

  **Coined Concept: *Kelly Robustness Asymmetry***  
  - **Definition:** The property that growth-rate maximization under probability misestimation requires down-shading, due to the convexity of losses in \( f \) for \( f > f^* \).  
  - **Tight scope:** Applies when (1) bets are repeated, (2) utility is log wealth, (3) edge uncertainty dominates risk preferences.  
  - **Falsifying case:** With linear utility, asymmetry vanishes—betting more is always better if \( \mathbb{E}[\text{return}] > 0 \). Down-shading would be irrational.  

  ### Final Answer  
  Your "lopsidedness" is **Kelly Robustness Asymmetry**—a consequence of optimizing for compounded growth under imperfect information. Phenomenon 1 (down-shading) and Phenomenon 2 (merge/split) are unified under robust control: The first hedges *within-model* uncertainty, the second hedges *between-model* uncertainty. Your friend is half-right: Averaging edges (e.g., merging forecasts) helps, but splitting is superior when forecasting skill is heterogeneous. The asymmetry isn't about risk aversion; it's about the geometry of compounding under epistemic constraints.  

  For your spreadsheet: When unsure, shade \( f \) toward \( e_{\text{conservative}} \) (e.g., 25th percentile of your edge distribution). For two forecasters, split if you suspect one might be right; merge if errors look random. In both cases, the lopsided hill is your ally—it rewards humility.
