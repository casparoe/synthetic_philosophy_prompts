  Hey — please answer as a professional philosopher / decision theorist who is also completely at home with the math of repeated betting, and actually think it through: do a couple of small calculations before you commit, brainstorm two or three candidate framings, and then tell me which one you think is right and what made you drop the others.

  I've been messing about with a spreadsheet of repeated bets and I keep tripping over the same lopsidedness, and I can't tell whether it's one thing or two, or whether it already has a name.

  I size bets the usual way: pick the fraction of my pile that maximises the expected log of what I'll have after the bet. Call the gap between my estimated chance and the price I'm being offered my "edge". Two things I keep running into.

  First: when I plot how fast the pile compounds against the fraction I bet, I get a very lopsided hill. The peak sits at the fraction equal to my edge. If I bet twice that fraction, my growth rate comes out at essentially zero in the sims — I'm not shrinking much, but I'm not going anywhere either, no matter how many rounds I run. If I bet half of it, I keep something like three quarters of the best possible compounding. So guessing too big is near-fatal and guessing too small is a mild haircut. Consequence: whenever I'm unsure about my own numbers I shade down, hard.

  Second: the same lopsidedness seems to show up when I'm not betting my own numbers but combining two people's. Say two friends each give me a probability for the same repeated event. I can merge their probabilities into one number and bet that, or I can split my money in half and let each of them bet their own number on their own half. What I get depends on how they're wrong. If their mistakes point in opposite directions and roughly cancel, merging beats splitting hands down. If one of them is plainly closer to the truth, splitting wins — but only after a few hundred rounds; for the first few dozen it just looks like a pointless compromise, and then the better friend's half slowly takes over everything.

  Now the bit I can't pin down. The shading-down instinct in the first case doesn't feel like risk aversion to me: I'd happily take a wildly swingy bet if I was confident about the odds, and I don't care about smooth wealth for its own sake. It feels like it's specifically about not trusting the number. But a friend says part of what I'm describing is just doing the arithmetic right — that if I'm unsure whether my edge is big or small, the correct fraction is your *average* edge, not your favourite guess, and that this has nothing to do with the shape of the hill. And I can't tell whether the combine-two-forecasters thing is the same phenomenon wearing a hat or a genuinely different one.

  So: does this have a name, and more importantly what is it and what isn't it? Please tell me which established concepts are nearest and exactly how my thing differs from each, and which one fits best — I'd rather have the carving than the label. Please don't stop at "just use fractional Kelly": that's my observation restated as a rule of thumb, and it doesn't tell me which way to err when the choice isn't a number but a way of combining two people's numbers. I'd also like the edges: does the lopsidedness survive if winnings aren't reinvested and every bet uses fresh money, or if there's only ever one bet, or if my bankroll is topped up from outside after every round? And is "I just hate deep drawdowns" an instance of the same thing or something else entirely? If there's genuinely no established concept, coin one, define it tightly, and give me a case that looks like an instance but isn't.

  (I'm not after a reading list or citations, by the way — I can't get to a university library from out here, so just your own reasoning please.)
