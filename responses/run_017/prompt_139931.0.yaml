  The choice between merging and splitting depends on your prior belief about the forecasters:

  - If you believe they are equally good (same accuracy) and their errors are independent, then merging is better because it reduces the variance of the probability estimate.

  - If you believe one might be much better than the other, then splitting is better because it allows for the better one to take over.

