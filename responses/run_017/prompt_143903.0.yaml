  Considering the two purposes: for rhetorical cases, slight loading might be acceptable if effective; for evidential, strict isolation is needed. The procedure should flag issues but leave the final call to the professor when context-dependent.

  Structure the procedure in phases: Setup, Isolation Test, Contamination Check, Purpose Bridge. Each phase has specific yes/no questions. End with a decision tree: if all passes, keep; if fixable with minor edits, fix; else, retire or escalate.

  For the three test cases: Apply the procedure step by step. Case 1 (pharmacist): Likely fails isolation on arrival time vs. profession. Fix might involve standardizing professions. Case 2 (lab samples): May pass as rhetorical but fail for evidential due to consent issue. Case 3 (hikers): Probably passes as rhetorical but has smuggled ceteris paribus; fix by stating assumptions.

  In "Where it misfires," address limitations: when the TA's personal biases affect responses, or when the edit is too complex. Emphasize that for borderline cases, the professor decides.

  Ensure the language is clear and directive. Avoid jargon. Keep sections within word limits: ~700 for procedure, ~500 for cases, ~250 for misfires. Aim for practicality so TAs can implement it efficiently.
answer: |-
  ## The Procedure

  Here's a 15-minute procedure for TAs to vet ethics cases. It focuses on isolating the intended variable and identifying hidden drivers. **Always read the case aloud first.**

  **Phase 1: Setup & Core Intent (2 mins)**
  1.  **Identify Target Feature (TF):** *"What single ethical feature (e.g., intent vs. outcome, personal merit, consent, luck, arrival time) is this case primarily designed to test or illustrate? Write it in one sentence."* (e.g., "Does arrival time alone justify allocation?")
  2.  **State Purpose:** *"Is this case primarily for evidential use (tracking the TF) or rhetorical use (eliciting a strong feeling about the TF)? Circle one: EVIDENTIAL / RHETORICAL."*

  **Phase 2: Isolation Test (The "Swap & See") (5 mins)**
  This is the core test for *both* purposes. The goal is to see if changing *only* the TF changes the judgment.
  3.  **Swap the TF:** *"Change ONLY the Target Feature identified in Step 1 to its opposite or neutral state. Write the new version concisely."* (e.g., TF = Arrival Time. Swap: "Both patients arrived at the *same* time.").
  4.  **Hold Judgment:** *"Does the *core* ethical judgment (e.g., who deserves the dose, is the action permissible, is blame deserved) STAY THE SAME in the swapped version? Yes/No."*
      *   **If YES:** Proceed to Phase 3. The TF *might* not be doing the work.
      *   **If NO:** The TF *is* likely driving the judgment. This is good for isolation. Proceed to Phase 3 to check for *other* drivers.

  **Phase 3: Contamination Check (5 mins)**
  Look for hidden influences *besides* the TF. Run these quick checks:
  5.  **Vividness/Disgust Test:** *"Is there a highly evocative detail (gruesome outcome, saintly profession, repulsive act) unrelated to the TF? Does the *wrongness* feel driven by disgust or shock rather than the TF? Yes/No."*
  6.  **Default Fill-In Test:** *"Is there an under-described element where you automatically filled in a common assumption (e.g., 'nurse' implies good/deserving, 'tissue sample' implies consent was probably not needed)? What did you assume? Write it."*
  7.  **Ceteris Paribus Smuggle:** *"Does the case *rely* on 'all else being equal' without stating it? If you imagine a *relevant* difference (e.g., the 'nurse' is actually lazy; the 'tissue' was stolen), does the judgment change even if the TF stays the same? Yes/No."*
  8.  **Irrelevant Sympathy/Antipathy:** *"Is there a character you instinctively like/dislike for reasons unrelated to the TF? Does this feeling strongly influence your judgment? Yes/No."*

  **Phase 4: Purpose Bridge & Decision (3 mins)**
  9.  **Synthesize for Purpose:**
      *   **If EVIDENTIAL:** *"Did Phase 2 (Swap & See) show the TF *alone* changes the judgment (Step 4 = NO), AND Phase 3 (5,6,7,8) shows NO significant contamination? Yes/No."*
          *   YES: Keep.
          *   NO: Move to Fix/Retire.
      *   **If RHETORICAL:** *"Does the case *effectively* evoke the intended feeling about the TF, EVEN IF Phase 3 (5,6,7,8) shows some contamination (e.g., vividness helps the punch)? Yes/No."*
          *   YES: Keep.
          *   NO: Move to Fix/Retire.
  10. **Fix/Retire/Handoff:**
      *   **Fixable?** *"Can you fix the main contamination identified in Phase 3 with ONE minimal edit (e.g., remove 'nurse', add 'and both are strangers', state 'assume the nurse is average at their job', explicitly add 'and no other factors differ')? Write the exact edit."* If YES and simple: **Fix (Specify Edit)**.
      *   **Unfixable/Minor?** If the edit is complex or changes the core case, OR if the issue is minor for Rhetorical but would fail Evidential: **Handoff to Prof**. (Note the specific issue).
      *   **Fundamentally Flawed?** If the Swap & See (Step 4) showed the TF *doesn't* drive the judgment, or contamination is severe and unfixable with one edit: **Retire**.

  **Stopping Rule:** The TA stops and **Handoffs to Prof** if: Step 10 leads to Handoff, OR the TA is unsure if contamination is acceptable for the purpose (esp. Rhetorical), OR the minimal fix feels too impactful.

  ---

  ## Three Cases Applied

  1.  **Pharmacist Case:**
      *   **TF:** Does earlier arrival time justify allocation? (Evidential)
      *   **Swap & See:** Change to "both arrived at the same time". Judgment *changes* (likely allocate to nurse or flip a coin). **Step 4: NO** (Good, TF drives it).
      *   **Contamination:**
          *   Vividness: "Nurse" is evocative (sympathy/deservingness). **Step 5: YES** (Nurse detail).
          *   Default Fill-In: "Nurse" implies helpful/deserving. **Step 6: Assumed "good/deserving".**
          *   Ceteris Paribus: Relies on "all else equal" for professions. **Step 7: YES** (If nurse was negligent, judgment changes).
          *   Sympathy: Instinctive sympathy for nurse. **Step 8: YES**.
      *   **Synthesize (Evidential):** Contamination significant (Nurse detail drives judgment *alongside* arrival time). **Step 9: NO**.
      *   **Fix/Retire:** Fixable? **YES (Minimal Edit: Remove "nurse", make both "visitors" or "patients from another town"). Fix (Specify Edit: Remove "nurse", replace with "visitor").**

  2.  **Lab Tissue Case:**
      *   **TF:** Is consent absolutely necessary for beneficial research? (Likely Rhetorical - feel tension between consent rule and benefit)
      *   **Swap & See:** Change to "donors gave explicit consent". Judgment *changes* (likely permissible). **Step 4: NO** (TF drives tension).
      *   **Contamination:**
          *   Vividness/Disgust: "Saves hundreds" is strong benefit. Not disgust. **Step 5: NO** (Benefit is relevant to TF tension).
          *   Default Fill-In: "De-identified", "ethics approval" might imply consent *wasn't* crucial. **Step 6: Assumed "low risk/harmless".**
          *   Ceteris Paribus: Assumes no harm/dignity violation from lack of consent. **Step 7: YES** (If dignity violation was clear, judgment might differ).
          *   Sympathy: For the hundreds saved. **Step 8: YES** (Drives permissibility).
      *   **Synthesize (Rhetorical):** Does it evoke tension? **YES**. Contamination (Step 6,7,8) exists but *serves* the rhetorical purpose by emphasizing the benefit side. **Step 9: YES**.
      *   **Decision: Keep.** (For Evidential use, it would fail Step 9 due to contamination).

  3.  **Hikers Case (Responsibility/Luck):**
      *   **TF:** Does moral blame depend on consequential luck? (Rhetorical - feel that blame based *only* on luck is incoherent/unfair)
      *   **Swap & See:** Change outcome - "both cigarettes go out". Judgment *changes* (no blame). **Step 4: NO** (Outcome/Luck drives blame).
      *   **Contamination:**
          *   Vividness: "Burns down a house" is bad outcome. Not disgust. **Step 5: NO** (Relevant to luck).
          *   Default Fill-In: "Identical dry pine needles", "lit cigarette" implies identical *circumstances/actions*. **Step 6: Assumed "identical actions & risk level".**
          *   **Ceteris Paribus:** **CRITICAL - SMUGGLED.** The case *utterly relies* on "all else was identical" (actions, intent, awareness, risk) without stating it. **Step 7: YES** (If one hiker stomped theirs out deliberately, judgment differs wildly).
          *   Sympathy: For the unlucky hiker. **Step 8: YES** (Drives the intuition).
      *   **Synthesize (Rhetorical):** Does it evoke the feeling? **YES**. Contamination (Step 7 Smuggle, Step 8 Sympathy) feeds the core point about luck. **Step 9: YES**.
      *   **Fix/Retire:** Keepable for Rhetorical? **YES**. *However*, the **Ceteris Paribus Smuggle (Step 7)** is fundamental. Minimal Fix to address: **Fix (Specify Edit: Add "and both acted with identical carelessness and awareness of the risk" after describing them dropping the cigarettes).** This makes the luck isolation explicit. TA might still Handoff given its centrality, but minimal fix exists.

  ---

  ## Where It Misfires

  1.  **TA Blind Spots:** The procedure relies on the TA noticing their *own* assumptions (Step 6) and emotional pulls (Step 5, 8). If a TA shares a common blind spot (e.g., assuming certain professions are inherently deserving), they might miss contamination. The "Swap & See" helps but isn't foolproof.
  2.  **Complex Fixes:** The "one minimal edit" rule sometimes isn't enough. A case might need *multiple* small edits to fully isolate the TF or remove contamination, pushing it beyond "minimal." The TA correctly Handoffs here, but it means more work for you.
  3.  **Purpose Ambiguity:** While the procedure distinguishes Evidential/Rhetorical upfront (Step 2), some cases sit on the borderline. A TA might misclassify, or a case intended as Evidential might have contamination that *could* be rhetorically powerful. The Handoff step catches this, but relies on TA awareness.
  4.  **Over-Correction for Rhetoric:** The procedure allows more leeway for contamination in Rhetorical cases if it aids the feeling. A cautious TA might flag something acceptable (e.g., the vivid "saves hundreds"), forcing unnecessary Handoffs. Training on the *degree* of acceptable loading for rhetoric is key.
  5.  **Theoretical Baggage:** While avoiding named theories, Step 3 checks might inadvertently probe intuitions tied to *unstated* theoretical commitments (e.g., Step 7's "relevant difference" might depend on a theory of responsibility). This is minimized by focusing on common-sense intuitions and the Swap test, but impossible to eliminate entirely. The procedure catches the *effect* (judgment changes based on an unstated factor), not the theoretical reason.
