prompt: |-
  I am writing the introduction to a collected volume of papers on rational belief by a philosopher who argues almost entirely by ruling on cases, and I have to say what principle her verdicts embody. Before I commit myself I want your read on a case she has never discussed, and on the reasoning that gets you there.

  Her verdicts, as I have tabulated them from five papers:

  1. Fair lottery, one thousand tickets, one winner, nothing distinguishes the tickets: one should not believe of any ticket that it will lose.
  2. The same lottery with a million tickets: the same verdict, with a note that nothing turns on how many tickets there are.
  3. The winning number is printed in a newspaper you have independently established to be right nine hundred and ninety-nine times in a thousand: you may believe that ticket four thousand one hundred and eighty-two won. So she does not treat merely statistical support as inert across the board.
  4. The preface: the author of an eighteen-hundred-claim monograph, who knows from long experience that books like hers carry about ten errors, may believe each of her claims while also believing, and saying in the preface, that at least one of them is false. She treats the combination as ordinary rather than defective.
  5. Closure: she denies that rational belief is closed under conjunction, and has said in print that one can rationally believe each of the three hundred steps of a long derivation while withholding belief from the theorem those steps entail.
  6. Stakes: raising the stakes in the preface case, by making the monograph a field manual for a dangerous procedure, does not change her verdict; neither does raising them in the lottery case.
  7. Speech and action: the lottery player may not flatly say that his ticket will lose, but there is nothing wrong with his acting on the prospect.
  8. She uses a single verb throughout, believe, and nowhere distinguishes believing a proposition from accepting it for the purposes of some inquiry. I suspect that is doing a great deal of work in her papers; I cannot tell which way it cuts.

  The thing I keep returning to: she withholds belief at a credence of 0.999 in the lottery and permits it at roughly 0.994 in the preface, so no single threshold can be what she is running; and since she permits the preface pair while refusing the corresponding lottery pair, something other than the numbers is carrying the weight.

  The case she has not discussed:

  A research consortium finalizes an assessment containing three thousand separate findings. Each finding rests on its working group's own item-specific evidence, and the consortium puts the chance of any given finding being false at about one in a thousand, expecting around three errors in the report as a whole. After the report is finalized, an independent replication unit reports, on the basis of a capture-recapture reanalysis that shares no evidence with the per-finding work and re-examines none of the findings, that reports of this kind contain about thirty false findings per three thousand, a rate near one per cent, and that this report very probably contains several. The consortium has no reason to doubt the replication unit, and knows that the estimate is not a remark about its general competence but a measurement of this report. The audit identifies no particular finding. Conditional on it, the chance that any given finding is false is about one in a hundred, which is essentially the position of the author in case 4.

  Two variants. In the first, everything is the same except that the one per cent figure is not external: the consortium has known all along, from its own track record of having to correct findings of this kind, that its per-finding error rate is about one in a hundred, so the expectation of thirty errors is already folded into its first-order assessment of each finding. In the second, the replication unit follows up with a localized result: essentially all of the thirty errors are concentrated in the one hundred and fifty findings contributed by a single working group whose data pipeline has since been found defective, giving those findings an error rate near twenty per cent and the remaining findings a rate near zero.

  What I want from you: the principles that fit verdicts 1 through 8 equally well; what each predicts about whether the consortium may believe a given finding, may believe the audit, may publish each finding flatly and unhedged, and must retract or hedge anything; your single best prediction of her verdict on the main case and on each variant, with your reasons for preferring the principle you attribute to her over the others; what she would be committing herself to in giving that verdict; and one further case, specifiable in a paragraph, that would separate the leading candidates where mine does not. I care less about the verdict in itself than about which principle she would be endorsing by giving it, but I do want a committed prediction rather than a survey of what she might say, and I want you to say how confident you are, and which further verdict from her, or which feature of her record I may have misdescribed, would move you to a different one.
reasoning: |-
  Hmm, the user is writing an introduction to a collected volume on rational belief by a philosopher who argues by ruling on cases. They've tabulated eight key verdicts from her papers and want me to analyze an unpublished case involving a research consortium to deduce her underlying principles.

  Let me examine the philosopher's established positions. She rejects belief in any ticket losing in a lottery (cases 1-2), even with high probabilities, but allows belief based on newspaper reports with similar probabilities (case 3). She permits believing individual claims while acknowledging overall errors in the preface paradox (case 4), denies belief closure under conjunction (case 5), and ignores stakes sensitivity (case 6). She distinguishes between speech and action (case 7) and uses a single notion of "belief" (case 8).

  The core puzzle is her asymmetric treatment of lottery (0.999 not sufficient) vs. preface (0.994 sufficient). The new consortium case presents three scenarios: external audit revealing 1% error rate, internal knowledge of 1% error rate, and localized errors affecting only a subgroup.

  I see three viable principles that could explain her pattern:
  1) The Evidential Source Principle: Belief requires non-statistical evidence about particulars.
  2) The Defeasible Justification Principle: Belief is permitted when justification isn't universally undermined.
  3) The Assertoric Context Principle: What's assertible determines belief standards.

  For the consortium case, I predict she'd allow belief in all scenarios except flat assertion in the external audit case. This aligns best with the Evidential Source Principle while accommodating her preface verdict through the "local justification" loophole. The key differentiator is whether evidence speaks to the particular proposition rather than general statistics.

  A decisive test case would be a "single-claim monograph" where the author knows their own error rate is 1% - here ESP would forbid belief while DJP might allow it. My confidence is high (85%) but would drop if we reinterpret her newspaper case as purely statistical or if she endorsed a purely credence-based threshold in unpublished work.

  The user needs this to credibly present her unified view, so I'm emphasizing how ESP explains her distinctions while respecting her anti-threshold and anti-closure commitments. The speech-action distinction remains important for her consortium verdicts about publication.
answer: |-
  Based on the philosopher's established pattern (verdicts 1-8), the underlying principles, predictions for the consortium case, and a decisive test case are as follows:

  **Principles Fitting Verdicts 1-8:**
  1.  **Evidential Source Principle (ESP):** Rational belief requires *non-statistical, particularized evidence* for the specific proposition. Purely statistical evidence (like lottery odds or base rates), even when highly probable, cannot generate rational belief *on its own* because it doesn't address the *particular* case. Other evidence (like the newspaper report for a specific ticket, or an author's item-specific justification for a claim) can provide this particularized support, making belief rational even against a statistical background.
  2.  **Defeasible Justification Principle (DJP):** Belief is rational when supported by *defeasible, locally sufficient justification* for the specific proposition, even if there is *undifferentiated* statistical evidence of error elsewhere in a larger set. The statistical evidence functions as a *general defeater* that doesn't automatically defeat *each specific instance* of justification unless it is specifically targeted or undermines the justificatory source itself for that instance.
  3.  **Assertoric Context Principle (ACP):** What matters is the *pragmatic context of assertion or action*. Belief itself might be permissible in contexts where flat-out assertion is not, reflecting different norms governing speech vs. belief/action. Rational belief is governed by whether the evidence suffices for *relying* on the proposition in practical reasoning (action), not necessarily for guaranteeing its truth in a public context (assertion).

  All three principles explain the key asymmetries:
  *   **Lottery (No Belief):** Purely statistical evidence (ESP), no local justification overcomes the universal defeater (DJP), or flat assertion is inappropriate (ACP).
  *   **Newspaper (Belief):** Non-statistical evidence for the particular (ESP), local justification overrides the general statistical risk (DJP), or the evidence suffices for reliance/assertion in context (ACP).
  *   **Preface (Belief + Meta-Belief):** Each claim has particularized justification (ESP), the statistical defeater is general and doesn't target any specific claim's justification (DJP), or belief is sufficient for reliance while the meta-belief governs public acknowledgment (ACP).
  *   **Non-Closure:** Conjoining beliefs doesn't magically create new particularized evidence for the conjunction (ESP), the defeater for the conjunction is distinct and stronger (DJP), or the norm for asserting the conjunction is stricter (ACP).
  *   **Stakes-Insensitivity:** The *source* or *structure* of justification/evidence (ESP/DJP) or the *type* of reliance (action vs. assertion) (ACP) matters more than stakes for *belief* itself.
  *   **Speech vs. Action:** Assertion requires stronger evidence/justification or different norms than belief/action (ACP, also compatible with ESP/DJP focusing on the *act* of assertion needing more than the belief state).

  **Predictions for the Consortium Case:**

  *   **Main Case (External Audit):**
      *   **ESP:** *Cannot* rationally believe any *specific* finding. The audit provides only updated *statistical* evidence (1% error rate) about the findings *as a class*. It offers no particularized evidence against any specific finding, nor does it reinstate the particularized evidence for any finding – it merely casts statistical doubt on all. *Can* believe the audit report itself (it has its own evidence base). *Cannot* publish findings flatly/unhedged (lacks warrant for assertion). *Must* hedge/retract previous unhedged publications if based solely on the pre-audit confidence level, as the evidential basis is now undermined statistically.
      *   **DJP:** *Can* rationally believe a *specific* finding *if* the original item-specific evidence still provides locally sufficient justification *despite* the general statistical defeater. The defeater is undifferentiated; it doesn't attack the justification for *this specific finding*. *Can* believe the audit. *May* be able to publish findings flatly *if* the local justification is deemed strong enough to override the statistical risk in the communicative context (but this is less clear for DJP; hedging might be prudent). Retraction/hedging not strictly *required* for belief, but communicatively responsible.
      *   **ACP:** *Can* rationally believe a specific finding for purposes of internal reliance/action *if* the original evidence is still deemed sufficient for *reliance*. *Cannot* flatly assert/publish findings unhedged – the audit creates a context where asserting certainty is unwarranted. *Must* hedge/retract previous unhedged claims to avoid misleading assertion. *Can* believe the audit.

  *   **Variant 1 (Internal Known Rate):**
      *   **ESP:** Identical to Main Case. The error rate is still purely *statistical* evidence regarding any specific finding. Knowing it internally doesn't transform it into particularized evidence for/against any specific claim. Verdicts same as Main Case for ESP.
      *   **DJP:** Identical to Main Case. The defeater was already present and presumably factored into the original assessment of "locally sufficient" justification. If belief was rational before, it remains rational. Verdicts same as Main Case for DJP.
      *   **ACP:** Identical to Main Case for assertion (hedging required). Belief for reliance might still be permissible if original evidence is deemed sufficient *despite* the known rate.

  *   **Variant 2 (Localized Errors):**
      *   **ESP:** *Cannot* believe findings from the defective group (only statistical + source-undermining evidence remains). *Can* believe findings from the other groups (original item-specific evidence stands, audit provides no reason to doubt *them* specifically). *Can* believe the audit. Findings from the good group *can* be published flatly. Findings from the bad group *cannot* be published flatly; must be retracted/hedged heavily.
      *   **DJP:** *Cannot* believe findings from the defective group (the audit provides a *specific* defeater targeting the justification source for *those* findings - the defective pipeline). *Can* believe findings from the other groups (no specific defeater for them; general defeater effectively eliminated). Verdicts on publication/retraction follow belief: flat assertion ok for good group, not for bad group.
      *   **ACP:** *Cannot* rationally *rely* on/assert findings from the defective group. *Can* rely on/assert findings from the good group. Publication/retraction verdicts follow assertion norms.

  **Best Prediction & Principle Attribution:**

  *   **Prediction:** She would rule that in the **Main Case** and **Variant 1**, the consortium **cannot rationally believe any specific finding**, **can believe the audit**, **cannot publish findings flatly/unhedged**, and **must retract or hedge previous unhedged claims**. In **Variant 2**, she would rule they **cannot believe findings from the defective group** but **can believe findings from the good group**; publication must reflect this distinction (flat for good, hedged/retracted for bad).
  *   **Attributed Principle: Evidential Source Principle (ESP)**. This is the strongest fit.
  *   **Reasons for Preferring ESP:**
      1.  **Lottery vs. Preface/Newspaper Core:** ESP provides the cleanest explanation for the fundamental asymmetry. The lottery is *pure statistics*. The newspaper and each claim in the preface have *something more* – a specific report, the author's specific justification for *that* claim – addressing the particular. The audit in the consortium case injects only pure statistics.
      2.  **Non-Closure:** ESP naturally explains this – the evidence for the conjunction is merely the conjunction of the evidence for the parts, which remains particularized for each part but doesn't constitute a new body of particularized evidence *for the whole conjunctive proposition* as a single unit. The statistical risk applies specifically to the *conjunction* in a way it doesn't to individual, well-justified parts.
      3.  **Treatment of "Local" Evidence:** Her preface verdict shows belief is permitted *despite* the statistical defeater *because* of the local evidence. The localized variant (Variant 2) shows she recognizes when evidence *does* become particularized (targeting a specific group). ESP handles this shift elegantly.
      4.  **Stakes-Insensitivity:** ESP makes justification hinge on the *type* of evidence (particularized vs. statistical), not the degree of risk or stakes, aligning perfectly with verdict 6.
      5.  **Speech vs. Action (Verdict 7):** While ACP also explains this, ESP is compatible: Action relies on the high probability *as such*, which is permissible, while assertion purports to convey a specific warrant (particularized evidence) that is lacking in the lottery/audit cases.

  **Commitment by Giving this Verdict:** By ruling against belief in specific findings in the Main Case and Variant 1, she commits to the view that **purely statistical evidence, no matter how probabilistically potent, cannot on its own rationalize belief in a specific contingent proposition, even when it significantly lowers the credence below thresholds she accepts in cases with particularized evidence (like the preface).** Belief requires a justificatory connection to the *particular fact* in question, not just its statistical profile.

  **Decisive Test Case (Separating ESP from DJP):**

  *   **The Single-Claim Monograph with Known Error Rate:**
      An author writes a monograph containing *only one central claim*, supported by their usual rigorous, item-specific evidence. However, the author knows from their long track record that *monographs of this exact type (single-claim, on this topic, by them)* have been wrong in the past, with a historical error rate of about 1 in 100. They have no specific reason to doubt *this particular* claim or evidence; the doubt is purely statistical, based on the past failure rate of similar endeavors.

  *   **Predictions:**
      *   **ESP:** *Cannot* rationally believe the single claim. The only evidence against it is purely statistical (the base rate of error in similar single-claim monographs). The item-specific evidence is the *only* evidence *for* it, but ESP requires *non-statistical* evidence *addressing the particular*. The statistical evidence undermines without providing an alternative particularized reason. (Analogous to the lottery ticket: strong evidence *for* winning is lacking, strong statistical evidence *against* winning exists, but no particularized evidence *against* this specific ticket).
      *   **DJP:** *Can* rationally believe the claim. The author has locally sufficient, item-specific justification for *this particular* claim. The statistical defeater (1% error rate for such monographs) is general and undifferentiated; it doesn't specifically target the justification for *this* claim. It might lower confidence, but not necessarily defeat belief if the local justification is strong enough. (Analogous to a single claim within the large preface monograph, just without other claims creating the statistical shadow).
      *   **ACP:** Likely aligns with DJP (belief for reliance possible) but asserts assertion might require hedging due to the known error rate context.

  *   **Why it Separates:** The philosopher's verdict on the standard Preface case (verdict 4) suggests that for DJP, the general statistical defeater doesn't automatically defeat each specific instance. Applying that logic consistently, DJP *should* permit belief here. ESP, however, driven by the lottery intuition and the need for particularization, would likely forbid belief, seeing it as too close to a "single-ticket lottery" where only statistics are at play. Her ruling here would strongly confirm ESP (if she forbids belief) or force a significant revision towards DJP (if she permits it). Her newspaper case (verdict 3) is different because there *is* particularized evidence *for* the specific ticket (the report).

  **Confidence & Caveats:**

  *   **Confidence:** High (85%) for ESP as the core principle and the consortium predictions, based on the strong fit with the lottery/preface asymmetry and non-closure.
  *   **What Could Change My View:**
      1.  **Reinterpretation of Verdict 3 (Newspaper):** If it turned out she explicitly characterized the newspaper report *as* purely statistical evidence (which seems unlikely given her other verdicts), ESP would be harder to maintain. DJP or ACP might fit better.
      2.  **Treatment of Variant 1:** If she ruled that *internal* knowledge of the 1% error rate *allowed* belief in specific findings (perhaps arguing it was "baked in" to the justification), this would strongly favor DJP over ESP.
      3.  **Explicit Endorsement of Thresholds:** If an undiscovered paper revealed she explicitly endorsed a simple threshold (e.g., belief above 0.99) *without* the source distinction, this would contradict the entire pattern. (But verdicts 1, 2, and 4 directly contradict a single threshold).
      4.  **Verdict on the Single-Claim Case:** As described above, her ruling there would be highly diagnostic between ESP and DJP.

  Her consistent use of "believe" (verdict 8) likely reflects her view that there's a unified epistemic state governed by these principles (ESP), rather than fragmenting into belief vs. acceptance for different purposes. This monism reinforces the need for a principle like ESP to handle the starkly different verdicts she gives in structurally similar high-probability situations.
