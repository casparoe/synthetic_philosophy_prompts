  Below is a decision tree designed to guide students from the observed cross-national pattern to one of seven explanatory positions. The tree uses the four provided findings (a-d) to force concrete choices, avoiding abstract nature/nurture framing. Each internal node is a question about what further data would show or how to interpret the findings, phrased so a first-year student can answer based on logic alone. Leaves include predictions for (a-d), an awkward commitment, and a one-line implication for what society "owes" individuals. Key terms are briefly glossed in context.

  ### Decision Tree
  *Start by assuming the pattern is real: Higher gender equality correlates with a lower share of women in engineering/CS degrees.*

  1. **Node 1: "If we surveyed 16-year-olds in high- vs. low-equality countries, would girls in low-equality countries more often cite 'job security' as a reason for pursuing engineering?"**  
     - *Yes* → Go to Node 2  
     - *No* → Go to Node 3  

  2. **Node 2: "Finding (d) shows women avoid engineering when other high-status jobs are open. If we compared earnings, would engineering in low-equality countries offer better relative pay for women (vs. other jobs) than in high-equality countries?"**  
     - *Yes* → **Leaf: STEM as Escape Hatch**  
       - *Core idea*: Engineering is a safe, well-paid option where women lack alternatives; equality reduces this pressure.  
       - *Predicts*: (a) Yes—equality reduces economic necessity; (b) Yes—engineering/CS are high-security fields; biology/medicine are less "secure" so equality helps; (c) Wider self-rating gap in high-equality—girls don't need to "sell themselves" for jobs; (d) Yes—women leave engineering for better options.  
       - *Awkward commitment*: Implies women in low-equality countries choose STEM out of need, not passion.  
       - *What we owe*: Ensure all professions are economically viable so choices aren't coerced.  
     - *No* → Go to Node 4  

  3. **Node 3: "Finding (c) shows a wider gap in 'I am good at math' self-ratings in high-equality countries. If we measured non-cognitive traits (e.g., empathy, competitiveness), would gender gaps in those traits better predict the field-specific patterns in (b) than math scores?"**  
     - *Yes* → **Leaf: Intrinsic Preferences Show Through**  
       - *Core idea*: Affluence/equality lets innate preferences emerge; women lean toward people-oriented fields (e.g., medicine) over thing-oriented ones (e.g., engineering).  
       - *Predicts*: (a) Yes—rising equality enables choice; (b) Yes—biology/medicine are people-oriented; (c) Wider self-rating gap in high-equality—preferences amplify perceived strengths; (d) Yes—women prefer other high-status jobs.  
       - *Awkward commitment*: Risks implying women are "naturally" less suited to key STEM fields.  
       - *What we owe*: Nothing—respect free choices reflecting intrinsic preferences.  
     - *No* → Go to Node 5  

  4. **Node 4: "Finding (d) shows women enter other high-status jobs when available. Would employment data show that, in high-equality countries, men in engineering resist sharing status by making the field less welcoming?"**  
     - *Yes* → **Leaf: Backlash / Identity Threat**  
       - *Core idea*: As equality rises, men in male-dominated fields (e.g., engineering) double down to protect status, deterring women.  
       - *Predicts*: (a) Yes—backlash grows as equality rises; (b) Yes—engineering/CS are male-dominated; biology/medicine are not; (c) Wider self-rating gap in high-equality—hostility erodes confidence; (d) Yes—women flee to friendlier fields.  
       - *Awkward commitment*: Assumes men actively exclude women more in equal societies.  
       - *What we owe*: Actively combat discrimination in STEM.  
     - *No* → **Leaf: Adaptive Preferences**  
       - *Core idea*: Equality doesn't fix stereotypes; women internalize "STEM isn't for me" via media/social cues, avoiding engineering despite opportunities.  
       - *Predicts*: (a) Yes—stereotypes adapt slowly to equality; (b) Yes—engineering/CS are stereotyped as "male"; (c) Wider self-rating gap in high-equality—internalization lowers confidence; (d) Yes—women are steered toward "feminine" high-status jobs.  
       - *Awkward commitment*: Suggests women in equal societies have less autonomy than in unequal ones.  
       - *What we owe*: Correct stereotypes to ensure choices aren't self-limited.  

  5. **Node 5: "Finding (c) shows girls in high-equality countries rate themselves worse at math despite small test-score gaps. Would data on skill distributions show that boys are more often at the very top of math ability, making girls with strong math skills avoid engineering for fields where they have a *comparative advantage* (e.g., medicine)?"**  
     - *Gloss: Comparative advantage = Choosing fields where you have the greatest edge relative to others, even if you're good at many things.*  
     - *Yes* → **Leaf: Comparative Advantage Sorting**  
       - *Core idea*: In equal societies, women with strong math skills choose fields where they stand out more (e.g., medicine) due to men's greater variability in math.  
       - *Predicts*: (a) Yes—efficient sorting increases with equality; (b) Yes—engineering/CS reward top math skills; biology/medicine don’t; (c) Wider self-rating gap in high-equality—girls see top math as male-dominated; (d) Yes—women sort into fields with less male competition.  
       - *Awkward commitment*: Assumes innate gender differences in skill distributions.  
       - *What we owe*: Nothing—sorting optimizes outcomes and is "fair."  
     - *No* → Go to Node 6  

  6. **Node 6: "Would data from a new gender-equality index (e.g., one that measures unpaid labor parity) show the pattern reversing or disappearing?"**  
     - *Yes* → **Leaf: Measurement Skeptic**  
       - *Core idea*: The pattern is an artifact; equality indices don't capture real barriers (e.g., sexist norms), so STEM gaps persist even as indices improve.  
       - *Predicts*: (a) No—decades of progress should close gaps if equality were real; (b) Field differences reflect biased definitions; (c) Self-rating gaps are cultural, not meaningful; (d) Correlation is spurious due to flawed metrics.  
       - *Awkward commitment*: Must explain why the pattern replicates across studies.  
       - *What we owe*: Fix equality metrics and address unmeasured injustices.  
     - *No* → Go to Node 7  

  7. **Node 7: "For a 16-year-old girl in a high-equality country who loves engineering, does the pattern imply she's an outlier who should be encouraged, or that her choice may be constrained?"**  
     - *"Outlier"* → **Leaf: Intrinsic Preferences Show Through** (Same as earlier leaf—tree forces this merge)  
     - *"Constrained"* → **Leaf: Real and Social, Nothing Owed**  
       - *Core idea*: The pattern is socially caused (e.g., via stereotypes or sorting), but this doesn’t license interfering with individual choices.  
       - *Predicts*: (a) Yes—social forces are persistent; (b) Yes—social factors vary by field; (c) Yes—social norms shape self-ratings; (d) Yes—social opportunity costs exist.  
       - *Awkward commitment*: Accepts social harms but opposes collective action.  
       - *What we owe*: Nothing—individual autonomy outweighs group fairness.  

  ### Tree Structure Notes
  - **Internal nodes**: 7 (as specified). Each is a concrete bet/data question.  
  - **Leaves**: 7 (all named).  
  - **Distinctions**:  
    - The tree forces **Intrinsic Preferences** and **Comparative Advantage** to share a path (Node 5) because both predict field-specific sorting based on traits, but they diverge at Node 5: Intrinsic is about innate *interests*, while Comparative Advantage is about innate *skill distributions*. If Node 5 is answered "no," it rules out Comparative Advantage.  
    - **Justice implications**:  
      - Two leaves share "owe nothing" verdicts: **Intrinsic Preferences** and **Real and Social, Nothing Owed**. Proponents of these would disagree (one sees choices as natural, the other as socially constrained but private), but the tree merges their justice conclusions.  
      - **Backlash** and **Adaptive Preferences** both imply we owe interventions, but for different reasons (combating discrimination vs. correcting socialization).  

  ### Unoccupied Positions
  - **Total possible combinations**: 7 binary nodes → 128 possible paths.  
  - **Occupied leaves**: 7 paths (one per leaf).  
  - **Unoccupied paths**: 121 paths. Reasons:  
    - **Incoherent**: Paths affirming "pattern is real" while denying all social/structural causes (e.g., "no" to all nodes) are incompatible with findings (a-d).  
    - **Unattractive**: Paths combining "measurement skeptic" with strong justice claims (e.g., "we owe massive interventions") are rare—if the pattern is artifactual, interventions seem misplaced.  
    - **Unexplored**:  
      - **Cell 1**: Pattern real + substantially biological + demands aggressive intervention (e.g., "we must compensate for innate differences"). This isn't a leaf; the tree lacks a biological-justice path because nodes prioritize social/choice mechanisms.  
      - **Cell 2**: Pattern artifactual + full-strength justice claim (e.g., "inequality is worse than data show, so we owe more"). Only **Measurement Skeptic** covers artifactual views, and its "owe" tag focuses on fixing metrics, not broad interventions.  

  This tree forces students to confront tensions (e.g., between autonomy and justice) and uses findings (a-d) to rule out simplistic explanations. It shows 7 coherent positions, their testable predictions, and their implications—without requiring prior expertise.
