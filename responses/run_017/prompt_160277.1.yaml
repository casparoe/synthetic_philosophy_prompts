prompt: |-
  hey, quick context so the ask makes sense. I'm doing scoping work for a small foundation program — roughly $3M over five years, so realistically four to six junior researchers plus a couple of workshops and some commissioned empirical work we don't run ourselves — and the live question is whether "is a bigger population better, and if so should anyone try to make it happen" deserves to be its own research program, or whether it just gets folded into existing longtermist work on existential risk and into ordinary global-priority-setting where population size barely shows up as a variable at all.

  What I want from you is an agenda, not a survey. Which open questions in this area should the program actually put money on, in what order, and why? I care much more about your criteria and your dependency map than about the list itself. For each question tell me:

  - what other questions its answer is upstream of — I want the dependency structure, not just "this is important";
  - how tractable it is with tools we actually have (conceptual work, demography, macro, forecasting), and roughly who'd have to do it;
  - how neglected it is, i.e. whether our funding changes anything or whether it'd happen anyway;
  - what specific result or evidence over the next five years would move it up or down the list.

  Three things I keep comming back to, and I want you to place them in the ordering — and tell me if any of them is a dud:

  1. The cohort-lag point. Any fertility intervention now mostly changes who exists after 2080, not the next couple of decades, so basically the whole case has to run on long-run considerations — trajectory, civilization's capacity, the shape of the far future — rather than on near-term welfare. Which makes the program weirdly dependent on views about long-run discounting and on how much weight demographic extrapolation that far out can bear.
  2. The "minimum viable population for a technological civilization" question: whether there's a threshold below which recovery from a really big catastrophe isn't possible anymore. If there is, then definately the marginal value of an extra person is huge near that threshold and roughly zero far above it, and "is more better" stops being a question about average value per life and becomes a question about where we sit relative to a cliff.
  3. The capture-and-composition worry. Fertility is basically only ever moved by states, and states have historically wanted more population for ethnic-composition and military-capacity reasons, not because of the value of existence. So maybe the honest answer is that any movement big enough to actually move TFR ends up being used for aims this program wouldn't endorse, and the "should anyone try to make it happen" half of the question has a political answer rather than an axiological one.

  If the standard material — person-affecting vs impersonal views, the repugnant conclusion, total vs average vs critical-level, the asymmetry — makes your list, that's fine, but say where it sits and whether it's genuinely upstream of anything or mostly downstream of questions people aren't asking. And please add at least one question that isn't on my list and isn't in the usual literature.

  Then give me a table, one row per question, columns: rank | question | upstream_of (which other questions on your list its answer settles or reshapes) | tractable_in_5y (high / medium / low, plus who does the work) | neglectedness (high / medium / low) | what_would_move_it (the specific result or evidence that would change its rank) | confidence (your own, 0 to 1). Keep the prose before the table focused on defending the ordering, on the trade-offs between importance, tractability and neglectedness, and on what you'd spend the first year on.
reasoning: |-
  Okay, the user is working on scoping a research program for a small foundation with a $3M budget over five years. The core question is whether studying "is a bigger population better, and should anyone try to make it happen" deserves its own program or should be folded into existing longtermist work. They want an agenda with prioritized questions, dependency maps, and assessments of tractability, neglectedness, and what could change the ranking.

  First, I need to understand their key concerns. They mentioned three main points: the cohort-lag (fertility interventions affect the far future), minimum viable population thresholds, and the capture-and-composition worry about state motivations. They want these placed in the ordering and evaluated. Also, they emphasize dependency structures over just importance, and want at least one new question not in standard literature.

  The user's explicit request is for a research agenda, but their deeper needs might include wanting to justify the program's existence as distinct from other longtermist efforts. They might be concerned about funding redundancy or ensuring their work has unique impact. The mention of political answers for the "should try" part suggests they're aware of real-world complexities beyond theoretical ethics.

  To structure the response, I'll start by establishing criteria: importance (affects key decisions), tractability (feasible in 5 years), neglectedness (current attention), and leverage (how answers influence other questions). Then, prioritize questions based on these, mapping dependencies. 

  The cohort-lag point is crucial because it forces long-term focus, making discounting and trajectory modeling upstream. Minimum viable population (MVP) is high priority because it could shift the entire debate to threshold effects, but tractability is medium due to modeling challenges. Capture-and-composition is important but might be more downstream, affecting implementation rather than core theory.

  I should introduce a new question: "Differential Fertility Effects," which examines how fertility changes among different groups affect long-term outcomes. This ties into capture concerns and trajectory modeling, making it a bridge between ethical theory and real-world dynamics.

  For the table, each question needs clear columns: rank, upstream dependencies, tractability (high/med/low, with required expertise), neglectedness, what would move it (specific evidence), and confidence. The MVP question should rank highest because its answer could make other questions moot (e.g., if no threshold, focus shifts). Cohort-lag comes next as it underpins the time horizon for all other work.

  Tractability assessments: MVP requires integrating catastrophe models with demographic data—doable by interdisciplinary teams. Neglectedness is high since few study thresholds in this context. If new biosphere vulnerability models emerge, it could raise urgency. 

  Capture-and-composition has high neglectedness but lower tractability because historical/political analysis is harder to quantify. If policy shifts occur (e.g., pronatalism linked to exclusion), it climbs the ranks. 

  The first year should focus on MVP and cohort-lag, commissioning literature reviews and expert workshops to clarify dependencies before empirical work. Allocating funds to meta-science ensures efficient resource use later. 

  Confidence levels reflect uncertainty; e.g., MVP at 0.7 since thresholds are plausible but evidence is emerging. The new question on differential fertility adds practical relevance, addressing the user's implicit need for actionable insights beyond theory.
answer: |-
  Here’s a research agenda structured by dependency, tractability, neglectedness, and leverage, with your three focal points integrated. The ordering prioritizes **questions that unlock downstream reasoning** and have **high policy leverage but low current investment**. Crucially, we front-load questions that determine *whether population size is a high-priority lever at all*.

  ### Core Criteria & Trade-offs
  - **Importance**: Does the answer fundamentally alter the "should we act?" decision or redirect resources?
  - **Tractability**: Can we make progress in 5 years with existing tools (e.g., computational models, meta-analysis, historical case studies)?
  - **Neglectedness**: Is this being addressed by academia/EA/longtermism? (High neglect = higher marginal value per dollar)
  - **Leverage**: How many downstream questions does this settle or simplify?
  - **First-year focus**: Prioritize #1, #2, and #5 to validate the program’s premise before committing to applied work.

  ### Ranked Research Questions
  *(New question: #5 on differential fertility effects)*

  | Rank | Question                                                                 | Upstream Of                                | Tractable in 5y (Who)                          | Neglectedness | What Would Move It                                                                 | Confidence |
  |------|--------------------------------------------------------------------------|--------------------------------------------|-----------------------------------------------|---------------|------------------------------------------------------------------------------------|------------|
  | 1    | **Is there a robust minimum viable population (MVP) threshold for civilizational recovery?** | #3, #4, #6, #7, #8 (Reshapes the entire field) | Medium (Catastrophic risk modelers + demographers) | High          | New evidence of biosphere vulnerability thresholds or failed recovery simulations → ↑; Lack of plausible thresholds in models → ↓ | 0.7        |
  | 2    | **How does cohort-lag discounting affect the cost-effectiveness of fertility interventions?** | #3, #4, #6 (Determines time horizons)      | High (Forecasters + economists)               | Medium        | Improved demographic transition models → ↑; Consensus on near-zero long-term discount rates → ↓ | 0.8        |
  | 3    | **Under what conditions do fertility changes affect long-term trajectory (e.g., innovation rate, risk resilience)?** | #4, #6, #7 (Focuses empirical work)        | Medium (Macrohistorians + complexity scientists) | High          | Historical studies linking pre-crisis demographics to recovery speed → ↑; Null findings across cases → ↓ | 0.6        |
  | 4    | **Can states increase fertility without illiberal/ethnic-targeting policies?** (Addresses capture risk) | #6, #7 (Determines "should try")           | Medium (Political scientists + economists)    | High          | Rigorous evaluation of pronatalist policies (e.g., Hungary’s childcare) → ↑; Rising nationalist rhetoric → ↓ | 0.7        |
  | 5    | **Do differential fertility rates alter long-term outcomes?** (e.g., education/wealth gradients) | #3, #6, #7 (New: Tests composition worries) | High (Demographers + data scientists)         | High          | Data showing persistent gaps → ↑; Convergence trends → ↓                           | 0.75       |
  | 6    | **Is the marginal value of added lives nonlinear?** (e.g., MVP cliffs vs. diminishing returns) | #7, #8 (Shapes "bigger=better")            | Low (Philosophers + modelers)                 | Low           | Breakthrough in value aggregation theory → ↑; Stalemate in population ethics → ↓    | 0.5        |
  | 7    | **What interventions increase fertility *and* are governance-compatible?** | #8 (Guides funding)                        | Medium (Policy evaluators)                    | Medium        | Pilot studies on cultural/incentive-based programs → ↑; Evidence of capture → ↓     | 0.6        |
  | 8    | **How do totalist/averagist/critical-level views interact with MVP?**    | — (Mostly downstream)                      | Low (Philosophers)                            | Low           | N/A (Already well-debated)                                                         | 0.3        |

  ### Key Justifications
  1. **MVP (#1) is the linchpin**: If a credible threshold exists (e.g., ≤10M humans unable to restart industrial civilization), it dominates all other considerations. Current models (e.g., Baum 2015) are speculative—targeted funding could refine this. High neglect + high leverage justifies top rank.  
  2. **Cohort-lag (#2) enables realism**: Without clarifying discount rates and model uncertainty for 2080+ effects, cost-effectiveness estimates are fiction. Highly tractable via forecasting tournaments.  
  3. **Differential fertility (#5) is the critical add**: Your capture worry (#3) assumes homogeneity, but *who* births matter (e.g., low-fertility/high-education groups). Neglected and tractable using cohort datasets (e.g., EU-SILC).  
  4. **Standard ethics (#8) deprioritized**: Person-affecting debates are downstream of MVP/trajectory questions. If MVP exists, repugnant conclusions become irrelevant near thresholds.  
  5. **Capture (#4) tested early**: Before investing in interventions, we must know if "good" pronatalism is feasible. Historical/comparative analysis (e.g., Scandinavia vs. China) is feasible.  

  ### Where Your Focus Points Land
  - **Cohort-lag**: Ranked #2—upstream of cost-effectiveness and intervention timing.  
  - **MVP**: Ranked #1—the highest-leverage question. Not a dud; under-explored empirically.  
  - **Capture**: Addressed via #4 (policy viability) and #5 (differential effects). Not a dud; requires empirical policing.  

  ### First-Year Priorities (≈$500K)
  1. **Workshop on MVP modeling** ($150K): Gather demographers, ecologists, and industrial archaeologists to stress-test recovery thresholds.  
  2. **Commission cohort-lag discounting studies** ($200K): Fund 2–3 teams to model 2100 population trajectories under alternative discount frameworks.  
  3. **Scoping study on differential fertility** ($100K): Mine existing datasets (e.g., UN fertility/education stats) for correlations.  
  4. **Meta-science/monitoring** ($50K): Track EA/longtermist work to avoid duplication; identify emerging gaps.  

  This structure ensures that by Year 2, you know whether MVP or differential effects demand a full program—or if the field should fold into broader x-risk work. If MVP thresholds prove implausible or cohort-lag discounting is too steep, the program pivots to trajectory analysis (#3) or composition (#5).
