  First, I need to map out each of their points and see where they might conflict. Starting with (b) and (e): they use a Kripke-style paracomplete system where the Liar is gappy. But they also want to say within the language that the Liar is gappy. In strong Kleene logic, if you try to say "The Liar is neither true nor false," that statement might itself become gappy or lead to a Strengthened Liar. That's a big tension. They need a way to express semantic status without falling into the same paradox.

