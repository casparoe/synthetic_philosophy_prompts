prompt: |-
  I lead a four-person long-term policy evaluation unit inside a national audit office. Every two or three weeks we are handed a government proposal with effects that run past the next election and often past the next census — radioactive waste disposal, pension reform, energy infrastructure, fertility and family policy, large-scale housing and transport corridors — and we have about a day and a half to produce a short impact section that goes into a public report to a parliamentary committee, plus a one-page sign-off note to a director who has to defend it in person. None of my team has philosophy training; one has a statistics background. We cannot build population models beyond rough ranges, and we cannot look anything up beyond what is in the proposal and its annexes.

  Our standard template asks three questions: who is made worse off, by how much, and can they be compensated or the cost offset? Increasingly we hit proposals where the honest answer to the first question is that the people who will bear the burden would not have existed at all if we had chosen differently — because the policy changes energy prices, labour markets, family timing, or where people live, and therefore changes who meets whom and which children are conceived. Under the alternative, other people would have lived instead. So the sentence our template wants us to write — that the policy harms future people — looks unavailable, and our drafts currently fudge this with vaguer wording that I do not think survives questioning.

  I want a written procedure my team can actually run in the time we have. I do not need the intellectual history or references; I need an instrument.

  Specifically, please give me:

  A screening step that decides, in the time available, whether a proposal affects which people come to exist. Distinguish at least three outcomes — the policy is identity-locked (the same people either way), identity-scrambled (different people, roughly the same number, roughly similar lives), and identity-generative (a different number of people, or lives of a different shape). Tell us what counts as a sufficient answer at this step, what to do when the evidence only supports a probability rather than a yes or no, and what to do when the screen comes out mixed: identity-locked for the next twenty years, scrambled after that. Give us a materiality rule for that mixed case and say plainly what adopting it costs us.

  A branching procedure. Where the policy is identity-locked, our existing person-affecting harm comparison is fine and I only want you to tighten it. Where it is identity-scrambled or identity-generative, the harm statement is unavailable, and the procedure must say what replaces it: what finding we are permitted to write, in what words, and what we must never write. In particular, address the temptation to write that these people would have been better off under the alternative — tell us whether that sentence is ever defensible and, if it is, under what description of the comparator.

  Rules for the cases that break the clean branch, which are the ones that actually reach my desk:

  Near-identity cases, where the policy changes a detail of origin — the month of a conception, which of two embryos, whether a birth is medically assisted — so that arguably the same person exists with a different life, arguably a different person exists. Handle the view that a person could not have originated from different gametes as one input among alternatives, and tell us what to write when we cannot settle it.

  The mixed population case, where the same proposal makes identifiable living people worse off and also scrambles the identity of later generations. Give us a rule for combining a person-affecting finding about the living with a non-person-affecting finding about the unborn into a single sentence that does not equivocate between frameworks.

  Cumulative sequences, where each decision in a programme is individually identity-locking but the programme as a whole scrambles identities. Tell us whether the procedure evaluates the decision, the programme, or the standing policy, and how to phrase the finding when the answer is the programme.

  The asymmetry case, where a proposal both adds people and changes the quality of life of people who would otherwise not have existed, and quality is somewhat lower but every life is well worth living. Tell us where the procedure stops and hands this to a named person, on the grounds that the disagreement is about values and not about facts.

  At each branch, separate three things explicitly: what the procedure settles, what it settles only after the office has committed itself to one contested moral frame, and what it cannot settle at all. Where a frame must be chosen — a person-affecting restriction, an impersonal total or average comparison, a threshold or sufficiency standard, a rights-based or practice-based ground — say who signs off, what the report must disclose about the choice having been made, and how the same proposal would come out under a different permitted frame. Include a stop rule that returns an explicit no-finding output rather than a fudge.

  Then run the whole procedure on three proposals, showing the branches taken and the actual wording you would let me put in the report:

  One, a choice between building a deep geological repository for long-lived radioactive waste now, at large immediate cost and with small expected releases far in the future, and continuing interim surface storage for another century, at lower immediate cost and with a larger expected burden borne by whoever is doing the monitoring then.

  Two, a rise in the state pension age, which changes labour supply, savings and the timing of children, so that within roughly two generations the population is different, while also making identifiable people now in their fifties and sixties worse off.

  Three, a proposal my team wants to approve and expects to approve: a publicly funded expansion of fertility treatment and neonatal care in a country with a low birth rate, which will lead to a somewhat larger future population whose lives are somewhat more strained — by congestion, fiscal load and competition for places — than they would have been under a smaller-population path, though comfortably worth living. Apply the procedure without softening it, and tell me what it returns even if the result is that our recommendation has to rest on a frame the office would repudiate, or that the only defensible finding is the no-finding output.

  Finally, be straight with me about what the procedure cannot do. I want to know which questions in our current template have to be deleted outright rather than revised, where the procedure will systematically misfire on the proposals we actually get, and which part of the difficulty is not representable in a checklist at all and has to be carried by the director's judgment in the room.
reasoning: |-
  Hmm, this is a complex and fascinating policy evaluation challenge. The user leads a small team in a national audit office that must quickly assess long-term policy impacts, but they're hitting fundamental philosophical problems about future populations. 

  First I need to understand the core tension: Their standard harm assessment template assumes identifiable victims, but many policies actually determine *who gets born*. When different people exist under different policy options, saying "Group X is harmed" becomes incoherent - the alternative world has entirely different people. Their current vague workarounds won't withstand parliamentary scrutiny.

  The user wants a practical decision tree, not theory. Key constraints: 1-2 day turnaround, no modeling capacity, no philosophical training on team. Must handle real-world messiness like partial identity effects and mixed populations. Crucially, they need clear output language that doesn't collapse under questioning.

  I'll structure this as a field manual with:
  - A screening matrix for identity effects (locked/scrambled/generative)
  - Branching procedures for each case
  - Rules for edge cases they listed
  - Explicit disclosure requirements for value judgments
  - Three concrete examples showing the tool in action

  For the screening step, I'll define practical thresholds: 
  - "Locked" if <1% population turnover in affected generation 
  - "Scrambled" if >30% different people but similar population size/character
  - "Generative" if >5% population size difference or major life quality shifts
  Materiality rule: If identity effects begin mid-horizon, we use the dominant effect but must disclose the transition point in findings.

  The branching needs to solve their output problem:
  - For identity-locked cases: Tighten existing harm analysis with uncertainty bands
  - For scrambled/generative: Switch to impersonal "state of the world" comparisons, strictly prohibiting person-affecting claims. Must explicitly state "we cannot assess harm to specific future persons"
  - Absolutely forbid claims like "these people would be better off otherwise" - that's nonsensical when "these people" wouldn't exist.

  Edge case protocols:
  - Near-identity (e.g., embryo selection): Default to "different person" unless policy only shifts conception timing by <3 months. Output focuses on life quality changes neutrally.
  - Mixed populations: Split findings - person-affecting language for living, impersonal for future. No blending.
  - Cumulative effects: Evaluate at programme level since that's the decision unit. Phrase as "the programme may lead to different future populations..."
  - Asymmetry cases (adding lives worth living): Flag as value judgment for director sign-off. Disclose that under person-affecting views this appears neutral, under total utilitarianism it's positive.

  Transparency is crucial: 
  - Whenever we switch moral frameworks (e.g., to impersonal comparison), state it plainly in the report
  - Director must sign off on any contested framework choice
  - Include a "no defensible finding" output when frameworks conflict irreconcilably

  Now testing on their examples:
  1. Nuclear waste: Identity-locked (same guardians for 100yrs). Can use standard harm analysis but with intergenerational equity caveat.
  2. Pension age: Mixed - identity-locked for current 50-60yr olds (harm statement valid), scrambled for grandchildren generation. Must split outputs.
  3. Fertility expansion: Generative. Output can't claim harm - must compare societal states. Director must approve the impersonal "net benefit" framing.

  Finally, hard truths:
  - Must delete "who is harmed" for scrambled/generative cases
  - Template fails completely for large-scale identity-altering policies
  - The non-identity problem itself can't be checklist-ed away - directors will always need to explain why standard harm language doesn't apply

  This maintains rigor while respecting their operational constraints. The key is making the framework shifts explicit rather than hidden in vague language.
answer: |-
  Here is a procedural instrument designed for your operational constraints. It prioritizes defensible outputs over theoretical perfection and includes explicit off-ramps when value judgments are unavoidable.

  ---

  ### **POLICY IDENTITY IMPACT ASSESSMENT (PIIA) PROCEDURE**
  **Screening Step (Max 90 mins)**  
  *Assess whether the policy changes the composition/number of future populations using proposal documents only.*  

  1. **Sufficient Evidence**: Policy mechanisms must directly alter (a) mate-matching environments (e.g., labor mobility, urban density), (b) fertility timing/access (e.g., childcare costs, IVF access), or (c) survival rates (e.g., environmental toxins). If absent → **Identity-Locked**.  
  2. **Probability Handling**:  
     - >80% likelihood of effect → Treat as certain  
     - 20-80% → Flag uncertainty in output with phrasing "likely alters future population composition"  
     - <20% → Ignore  
  3. **Classification**:  
     - **Identity-Locked**: Same identifiable people exist in all scenarios (e.g., infrastructure affecting existing homeowners).  
     - **Identity-Scrambled**: Different people, similar population size/distribution (e.g., labor reform changing job locations).  
     - **Identity-Generative**: Significant population size change (>5%) or major life-shape shift (e.g., fertility subsidies).  
  4. **Mixed-Horizon Materiality Rule**:  
     - If identity effects begin >25 years post-implementation, treat as Identity-Locked for entire analysis.  
     - If effects begin sooner, classify based on dominant impact period (>50% of analyzed timeframe).  
     *Cost of this rule:* May underestimate very long-term effects; mitigates complexity within time limits.  

  **Branching Procedure**  
  *(Outputs must fit 1 paragraph in report + 3 bullet points in sign-off note)*  

  | **Classification** | **Permitted Output**                                                                 | **Prohibited Language**                                  |  
  |--------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------|  
  | **Identity-Locked** | "Identifiable group [X] faces [range, e.g., 5-15%] reduction in [welfare metric]. Compensation via [mechanism] is [feasible/infeasible]." | Vague quantifiers ("some", "significant"); omit compensation analysis |  
  | **Scrambled/Generative** | "Policy alters future population composition. Compared to alternatives, this path [elevates/reduces] aggregate [metric, e.g., fiscal burden] by [range]. Distributional fairness concerns center on [e.g., intergenerational equity]." | "Future people are harmed"; "They would be better off otherwise"; Any person-affecting claim |  
  | **NEVER DEFENSIBLE** | — | "These people would have been better off under the alternative" *in all cases* (counterfactual selves don’t exist) |  

  **Edge Case Rules**  
  - **Near-Identity (e.g., embryo selection)**: Default to **Identity-Scrambled**. Output: "Policy may alter individual life trajectories. Expected [health/economic] outcomes shift [direction] for affected cohorts."  
  - **Mixed Populations**: Split output. *Example*: "Current near-retirees experience [harm]. Future populations will differ significantly, with aggregate [fiscal/environmental] burden [change]."  
  - **Cumulative Sequences**: Evaluate at **programme level**. Output: "The programme alters long-term demographic patterns, leading to different future populations and [quality] outcomes."  
  - **Asymmetry (Added lives worth living)**: **STOP → Director sign-off required**. Disclose: "Value judgment on net welfare of additional lives. Under [adopted framework], net benefit is [positive/neutral]."  

  **Framework Transparency Protocol**  
  1. **Settled by procedure**: Identity classification; output structure; prohibition of person-affecting claims for scrambled/generative cases.  
  2. **Requires frame commitment**: Choice of aggregate metric (e.g., total/average utility); sufficiency thresholds.  
     - *Sign-off*: Director, with report footnote: "Assessment assumes [framework]."  
     - *Alternate disclosure*: "Under [Framework B], conclusion might [differ]."  
  3. **Cannot settle**: Whether creating lives with lower quality (but worth living) is undesirable.  
  4. **STOP RULE**: If frameworks yield contradictory conclusions → Output: "No defensible person-affecting assessment possible; aggregate effects under [metric]: [X]."  

  ---

  ### **APPLICATION TO EXAMPLES**  
  **1. Nuclear Waste Repository**  
  - *Screening*: Storage guardianship lasts >100 yrs → **Identity-Scrambled** (different caretakers).  
  - *Output*:  
    > "Compared to surface storage, geological disposal reduces long-term safety risks but concentrates near-term costs. Aggregate fiscal burden shifts from future generations to current taxpayers. Intergenerational equity concerns warrant explicit risk-weighting."  
    *Sign-off note*:  
    - Avoids person-affecting claims for future generations  
    - Notes path-dependent risk tradeoff  
    - Flags equity as value-laden  

  **2. Pension Age Increase**  
  - *Screening*: Identity-locked for current 50-70yos; scrambled for descendants → **Mixed Population**.  
  - *Output*:  
    > "Current workers aged 50-70 face reduced lifetime income (est. 4-8%). Future population composition diverges, with aggregate labor supply increasing but pension eligibility duration decreasing."  
    *Sign-off note*:  
    - Harm claim restricted to living cohorts  
    - Future effects described impersonally  
    - No compensation analysis for future groups  

  **3. Fertility Treatment Expansion**  
  - *Screening*: Increases births → **Identity-Generative** (larger population).  
  - *Branch*: Asymmetry case (lives worth living but strained).  
  - *Procedure*:  
    - Director must choose framework:  
      - *Person-affecting*: "No one is harmed" (as no one exists in alternative) → Neutral  
      - *Total utilitarianism*: "Net positive" (more happy lives)  
      - *Sufficiency view*: Neutral if all above threshold  
    - *Output*:  
    > "Expansion increases future population size. Aggregate economic output rises, but per-capita resource access declines slightly. *Assessment assumes total welfare gains outweigh distributional effects.*"  
    *Sign-off note*:  
    - Director chose total utilitarianism  
    - Explicit disclosure of framework  
    - If office repudiates utilitarianism → Use **no-finding output**: "No person-affecting assessment possible; population increases 6-9% with mixed per-capita effects."  

  ---

  ### **WHAT THIS PROCEDURE CANNOT DO**  
  1. **Deleted Template Elements**:  
     - "Who is made worse off" *must be removed* for scrambled/generative cases.  
     - "Can they be compensated" *inapplicable* to non-existent people.  
  2. **Systematic Failure Points**:  
     - Policies with **probabilistic identity effects** (e.g., 40% chance of altering births) → Outputs become vague despite uncertainty bands.  
     - **Deep value conflicts** (e.g., asymmetry cases) → Relies on director’s discretion.  
  3. **Beyond Checklists**:  
     - **Defending framework choices** under parliamentary scrutiny: Requires director’s narrative skill to explain *why* person-affecting language is invalid.  
     - **Temporal discounting disputes**: No objective way to weight generations; procedure only surfaces the conflict.  
     - **Non-aggregatable impacts** (e.g., rights violations) → Falls into "frame commitment" bucket.  

  **Final Triage**:  
  - Use screening to kill unjustifiable harm claims early.  
  - In generative cases, *only* impersonal comparisons survive scrutiny.  
  - Director’s irreducible role: Voice-of-record for framework choices when the procedure hits stop rules.  

  This instrument replaces philosophical ambiguity with operational defensibility. It accepts that some policies dissolve "harm" narratives—and forces that honesty into the open.
