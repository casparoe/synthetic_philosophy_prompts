answer: |-
  Below, I present a scenario designed to produce an observational difference between substantivalism and relationism (specifically, a Machian variety) within your constraints. The scenario leverages general relativity (GR) and the phenomenon of frame-dragging, as a satisfactory classical case is impossible due to the lack of Machian effects in Newtonian mechanics. I will first describe the setup, then provide predictions for each view, isolate the key feature, show what happens if it is removed, and address the losing side's best reply. The case adheres to your constraints: local manipulation, no appeal to absolute position/velocity, detectable matter, avoidance of trivial rotation, qualitative GR treatment, and theory-generated verdicts.

  ### **Scenario: Rotating Dense Shell with a Central Bucket**
  **Apparatus**:  
  - A spherical shell made of ultra-dense material (e.g., neutron-star matter) with total mass \(M\), radius \(R\), and uniform density. The shell is rigid and initially at rest relative to the distant stars (which are detectable and serve as the reference for "fixed" matter).  
  - A bucket of water at the exact center of the shell, suspended by a rigid, non-rotating support anchored to the Earth (which is at rest relative to the distant stars). The bucket is small (e.g., 10 cm diameter) to minimize tidal effects.  
  - A mechanism to spin the shell about an axis at angular velocity \(\Omega\) without disturbing the bucket or distant matter. This is done locally (e.g., via magnetic bearings) over minutes.  

  **Key Parameters**:  
  - \(M/R\) is large (e.g., \(10^{26}\) kg/m, achievable with neutron-star densities).  
  - \(\Omega\) is rapid (e.g., 100 rad/s).  
  - The distant stars are fixed and detectable (e.g., via telescopes).  
  - Gravitational and mechanical effects are controlled:  
    - The shell is uniform and spherical, so its *static* gravitational field at the center is zero (by Newton's shell theorem or Birkhoff's theorem in GR), preventing baseline curvature.  
    - The rotation is slow enough that centrifugal deformation of the shell is negligible (ensuring no time-varying tidal forces).  
    - The support is vibration-isolated to avoid mechanical coupling.  

  **Manipulation**:  
  1. Start with the shell and bucket at rest relative to distant stars. The water surface is flat (baseline).  
  2. Spin the shell up to \(\Omega\) locally over minutes. Distant matter is unaffected.  
  3. Observe the water surface after transients settle.  

  ---

  ### **Predictions and Reasoning**
  #### **Relationist (Machian) Prediction: Curved Water Surface**  
  - **Reasoning**:  
    - Relationism holds that inertia arises from relative motion with respect to the total mass distribution. Distant stars are detectable and dominate the mass, defining the global reference.  
    - In GR (which embodies Machian principles), rotating the shell relative to distant stars drags the local inertial frame via the Lense-Thirring effect. The local inertial frame at the center rotates with angular velocity \(\omega_{\text{drag}} \propto (G/c^2)(M/R)\Omega\), where \(G\) is gravity's constant and \(c\) is light speed.  
    - The bucket is fixed to distant stars (non-rotating globally), but the local inertial frame rotates. Thus, the bucket rotates relative to its local inertial frame, producing centrifugal forces.  
    - Water at radial distance \(r\) from the bucket's center experiences centrifugal acceleration \(r \omega_{\text{drag}}^2\). For a finite bucket (e.g., \(r = 5\) cm), this curves the surface parabolically.  
  - **Verdict**: Observably curved surface (e.g., measurable with laser interferometry).

  #### **Substantivalist Prediction: Flat Water Surface**  
  - **Reasoning**:  
    - Substantivalism posits that space (or spacetime) is a real entity independent of matter. Inertia is defined by absolute space or a fixed global structure (e.g., Minkowski spacetime asymptotically).  
    - The bucket is at rest relative to distant stars, which align with absolute space. Rotation is absolute, not relational.  
    - In GR, substantivalists accept frame-dragging as a property of spacetime curvature but argue it is not fundamentally relational. Crucially, **if we use Newtonian mechanics** (as substantivalism often defaults to without GR), no frame-dragging exists.  
    - Even in GR, at the exact center (\(r=0\)), centrifugal acceleration is zero. For a small bucket, the effect is negligible. More importantly, substantivalists deny that the shell's rotation relative to distant stars *alone* induces inertia changes; absolute rotation is key, and the bucket isn't rotating.  
  - **Verdict**: Flat surface (no centrifugal forces).

  #### **Summary of Divergence**  
  - **Relationist (GR)**: Curved surface due to frame-dragging from relative rotation.  
  - **Substantivalist (Newtonian)**: Flat surface; no frame-dragging or absolute rotation of bucket.  

  ---

  ### **Single Feature Doing the Work**  
  The key feature is **frame-dragging in GR**, specifically the Lense-Thirring effect, where a rotating mass drags the local inertial frame. This effect:  
  - Depends on the shell's rotation *relative to distant matter* (Machian).  
  - Generates centrifugal forces in a globally stationary bucket.  
  - Is absent in Newtonian mechanics.  

  #### **If This Feature Is Removed**  
  - **No frame-dragging (Newtonian limit)**: Both views predict a flat surface.  
    - Relationism reduces to "no measurable effect" without GR, as classical Machian mechanics lacks a mechanism for local inertia changes from relative rotation.  
    - Substantivalism predicts flatness as above.  
  - **No relative rotation (\(\Omega = 0\))**: Both predict flatness.  
  - **Non-rotating or non-dense shell**: Both predict flatness, as \(\omega_{\text{drag}} \to 0\).  

  ---

  ### **Losing Side's Best Reply**  
  The **substantivalist** loses if GR is correct and the effect is observed. Their best replies:  
  1. **"This is Newton's Bucket Scaled Down"**:  
     - Argue: "The scenario rotates the 'star sphere' (now a dense shell) around a stationary bucket—identical to Newton's thought experiment but localized. It proves nothing new, as the dispute is about whether relative rotation causes inertia, and this setup merely assumes GR's Machian interpretation."  
     - Rebuttal: The shell is *local and detectable* (unlike Newton's unobservable stars), and the effect is mediated by a real physical phenomenon (frame-dragging) that is empirically tested in GR (e.g., Gravity Probe B). Newton's bucket lacked a mechanism; here, GR provides one.  

  2. **"GR Doesn't Favor Relationism"**:  
     - Argue: "Frame-dragging is a property of substantival spacetime, not relative motion. Spacetime is real and curved by the shell, but this doesn't reduce inertia to matter relations. Relationists illicitly co-opt GR."  
     - Rebuttal: GR *operationalizes* Mach's principle—inertia here depends on relative motion to distant matter. The effect vanishes if distant matter is absent (e.g., in an empty universe), supporting relationism.  

  3. **"Effect is Too Small"**:  
     - Argue: "For any lab-sized shell, \(\omega_{\text{drag}}\) is tiny (e.g., \(10^{-24}\) rad/s for \(M/R = 10^3\) kg/m), making curvature unobservable. Thus, the case is impractical and doesn't advance the dispute."  
     - Rebuttal: Principle trumps practice. With dense materials (e.g., \(M/R = 10^{26}\) kg/m), \(\omega_{\text{drag}} \approx 1\) rad/s, giving measurable curvature. Conceptually, the predictions diverge.  

  ---

  ### **Conclusion: Is the Dispute Empirical?**  
  - **Yes, via this scenario**: Predictions observationally diverge due to frame-dragging in GR. Relationism predicts curvature; substantivalism (in Newtonian form) predicts flatness.  
  - **But limitations exist**:  
    - The case relies on GR, not pure classical mechanics.  
    - Substantivalists can adopt GR and reinterpret frame-dragging non-relationally, blurring the philosophical divide.  
  - **If no case existed**: Without GR, the dispute is observationally empty in classical mechanics, as Newtonian physics lacks Machian effects and both views agree on all experiments.  

  This scenario satisfies your constraints and shows that, with GR, the dispute becomes empirical: the existence of frame-dragging supports relationism, while its absence would support substantivalism. Newton's bucket is thus updated, not merely rescaled.
