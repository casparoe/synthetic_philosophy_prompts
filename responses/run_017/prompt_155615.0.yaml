prompt: |-
  Hi — I'm trying to get a proper gut-level feel for Lewis's triviality result for indicative conditionals, and I've wrote the argument out a few times now but still feel like I'm just pushing symbols around. Could you help me see *why* it goes wrong? British English please, and please don't give me a reading list or a tour of named positions — I've got no web access where I'm writing this, so I need it reasoned out from scratch.

  Where I've got to. The tempting thesis is that the probability of an indicative conditional just is the corresponding conditional probability: for a credence function P, the probability of if A then C equals P(C given A). Lewis's result is supposed to show this can't hold in full generality, because it collapses into everything being probabilistically independent of everything else — which would mean nothing could ever be evidence for anything. Concretely: fair die, A = the roll came up even, C = it came up six. P(C given A) is 1/3, so the thesis says the conditional gets probability 1/3. But split its probability by whether C holds: conditional on six, the conditional if even then six should be certain; conditional on not-six, it should be impossible. That gives 1 × 1/6 + 0 × 5/6 = 1/6. Contradiction, and the general version apparently gives P(C given A) = P(C) full stop.

  Here's the bit I actually care about, because it's where I'm stuck. A friend says the identity version was always a strawman: the real intuition was only that a conditional's probability *tracks* the conditional probability, possibly through some fixed recalibration, since people's probability judgements are regressive or just noisy. So he posits that the probability of if A then C equals f(P(C given A)) for one fixed, strictly increasing f — same f for every A and C and every credence function, maybe something like f(x) = x² or f(x) = (1 + x)/2. His hope is the slack in f stops the collapse and leaves a weaker, survivable constraint. I don't see how that could help, but I can't say precisely why.

  So, could you: (1) redo the die calculation with his f in place and show what you end up with — is it genuine triviality, or just a weaker constraint like conditional probability depending only on P(C) and not on A at all, and is that weaker thing survivable, or does it also blow up once you compare two different antecedents, e.g. six-or-two against six-or-two-or-four; (2) lay out which premise is doing which piece of work — the thing having an unconditional probability you can conditionalise on at all, the thesis being applied to conditionalised credence functions and not just your current one, the law of total probability, and those annoying positivity side conditions (I noticed the argument seems to need A compatible with both C and not-C — does that mean cases like if it's a six then it's even escape entirely?); (3) handle his second escape move, which is to deny that a true consequent guarantees the conditional — I suspect that doesn't help at all, because in the argument above that step seems to *fall out* of the thesis applied to a conditionalised credence function rather than being assumed seperately, but I'd like you to check me on that; and (4) say in the end which premise you'd actually give up and what it costs you, especially if the answer is something like giving up that conditionals express truth-conditional propositions in the first place.

  Then, finally, the one-sentence moral I could repeat to him: what is the result really telling us, and why is it called triviality rather than just a contradiction?
reasoning: |-
  Okay, let's tackle Lewis's triviality result step by step. The user is struggling to grasp why the result holds and specifically wants to understand why a friend's proposed fix (using a recalibration function f) fails. They've laid out their current understanding and have specific questions. 

  First, I need to recall the core issue: Lewis showed that equating P(if A then C) with P(C|A) leads to absurdity because it forces probabilistic independence (P(C|A) = P(C)). The user's friend suggests weakening this to P(if A then C) = f(P(C|A)) for some strictly increasing f, hoping this avoids collapse. 

  For part (1): Redoing the die calculation with f. The original contradiction arose because splitting by C gave 1/6 while P(C|A)=1/3. With f, we'd have:
  - When C is true (roll=6), P(if A then C) should be 1 under the thesis? But wait – this is where the friend's view gets messy. Under conditionalization on C, P_C(if A then C) should equal f(P_C(C|A)). But P_C(C|A) is P(C|A∧C)=1, so f(1). Similarly, if not-C, P_{not-C}(if A then C)=f(P_{not-C}(C|A))=f(0). Then law of total probability gives P(if A then C) = f(1)P(C) + f(0)P(not-C). But by the friend's thesis, this must also equal f(P(C|A)). So we get f(P(C|A)) = f(1)P(C) + f(0)(1-P(C)). 

  This must hold for all A,C and probability distributions. Now suppose we pick two different antecedents for the same consequent, say A1="even" (giving P(C|A1)=1/3) and A2="six or two" (giving P(C|A2)=1/2). For fixed C="six", we'd have:
  - f(1/3) = f(1)(1/6) + f(0)(5/6)
  - f(1/2) = f(1)(1/6) + f(0)(5/6)
  So f(1/3)=f(1/2) – but since f is strictly increasing, this forces 1/3=1/2, contradiction. The function f doesn't save us; it just pushes the contradiction elsewhere. The constraint isn't survivable because it still forces conditional probabilities to be constant when they're not.

  For part (2): The key premises are:
  - (a) Conditionals have unconditional probabilities (so we can apply law of total probability)
  - (b) The thesis P(if A then C) = f(P(C|A)) holds for all credence functions (especially conditionalized ones)
  - (c) The law of total probability itself
  - (d) Positivity: A must be possible (P(A)>0) and in the subcases, we need C and not-C to be compatible with A (so P(A∧C)>0 etc.). In the "if six then even" case, A=C, so P(C|A)=1 and P(not-C|A)=0 – but the latter breaks positivity since A∧not-C is impossible. So yes, such cases escape, but they're rare.

  The real killer is (b) applying to conditionalized credences. This is what generates the f(1) and f(0) terms.

  For part (3): The friend might deny that C being true makes the conditional certain. But in Lewis's framework, when we conditionalize on C, we're evaluating what the thesis says about P_C(if A then C). The thesis forces it to be f(P_C(C|A)) = f(1). If the friend denies this equals 1, they're effectively abandoning the thesis for conditionalized credences – but that's the whole point. If they only apply f to the original credence function, not updated ones, the argument doesn't go through, but then the thesis becomes toothless and context-dependent.

  For part (4): The premise I'd give up is that conditionals express propositions with fixed truth values (hence fixed probabilities). This costs us a clean Boolean logic for conditionals but matches the data better (e.g., Adams' thesis holding for non-embeddings). The moral: Triviality shows that conditionals can't simultaneously be (i) truth-apt propositions and (ii) obey P(if A then C)=P(C|A) universally. "Triviality" refers to the collapse to probabilistic independence, making all learning trivial.

  The one-sentence moral: Lewis's result exposes that embedding indicative conditionals in standard probability forces either absurd universal independence or abandoning their status as ordinary truth-bearing propositions.
answer: |-
  Right, let's break this down step by step without fluff. British English throughout, and no appeals to literature — just the logic.

  ### (1) The Die Calculation with Your Friend's f
  Recall: Fair die, A = "even" (P(A)=1/2), C = "six" (P(C)=1/6). P(C|A) = 1/3.  
  Your friend claims: **P(if A then C) = f(P(C|A)) = f(1/3)** for some fixed, strictly increasing f (e.g., f(x)=x² or f(x)=(1+x)/2).

  Now, split by whether C is true:  
  - **If C is true (roll=six):** The conditional *if even then six* seems undeniable. Under your friend's thesis, *after conditionalising on C*, we have:  
    P<sub>C</sub>(if A then C) = f( P<sub>C</sub>(C|A) ) = f(1)  (since P<sub>C</sub>(C|A) = P(six|even) = 1 when we know it's six).  
  - **If C is false (not-six):** The conditional seems false. Conditionalising on not-C:  
    P<sub>¬C</sub>(if A then C) = f( P<sub>¬C</sub>(C|A) ) = f(0)  (since P<sub>¬C</sub>(C|A) = P(six|even) = 0 when we know it's not-six).  

  Apply the Law of Total Probability to P(if A then C):  
  **P(if A then C) = P<sub>C</sub>(if A then C) · P(C) + P<sub>¬C</sub>(if A then C) · P(¬C) = f(1) · (1/6) + f(0) · (5/6)**  

  But by your friend's original thesis, **P(if A then C) = f(P(C|A)) = f(1/3)**.  
  So we have:  
  **f(1/3) = f(1) · (1/6) + f(0) · (5/6)**  

  **Why this blows up:**  
  This equation *must hold* for *any* A and C. Now consider a *different* antecedent for the same consequent:  
  - Let A₁ = "even" → P(C|A₁) = 1/3  
  - Let A₂ = "six or two" (so P(A₂)=1/3) → P(C|A₂) = 1/2 (since if it's six or two, P(six) = 1/2).  

  Apply the same logic to A₂:  
  **f(1/2) = f(1) · (1/6) + f(0) · (5/6)**  

  Notice: **f(1/3) = f(1) · (1/6) + f(0) · (5/6)** and **f(1/2) = f(1) · (1/6) + f(0) · (5/6)**.  
  So **f(1/3) = f(1/2)**. But f is strictly increasing → **1/3 = 1/2**. Contradiction.  

  **Result:**  
  - It's **genuine triviality**, not a weaker constraint. The equation forces P(C|A) to be identical for *any* A that implies C is possible (e.g., P(C|A₁) = P(C|A₂) even when they clearly differ, like 1/3 vs 1/2).  
  - **Survivable?** No. It collapses conditional probability into a constant for fixed C (depending only on P(C), f(1), f(0)), destroying any dependence on A. Learning A could never change your credence in C — so nothing is evidence for anything.  

  ---

  ### (2) Premises and Their Roles
  The argument relies on:  
  - **Premise 1 (Unconditional Probability):** "if A then C" has a well-defined unconditional probability P(·).  
    *Role:* Lets us apply the Law of Total Probability to it.  
  - **Premise 2 (Thesis Rigidity):** P(if A then C) = f(P(C|A)) holds for *any* probability function, *including conditionalised ones* (e.g., P<sub>C</sub> and P<sub>¬C</sub>).  
    *Role:* Generates f(1) and f(0) when conditionalising on C/¬C. This is the killer. If f only applied to your *current* credence, the collapse wouldn't happen.  
  - **Premise 3 (Law of Total Probability):** Standard probability axiom.  
    *Role:* Combines the conditionalised probabilities.  
  - **Positivity Conditions:** P(A) > 0 (so P(C|A) is defined) and P(A ∧ C) > 0 / P(A ∧ ¬C) > 0 (so we can conditionalise on C/¬C without division-by-zero).  
    *Role:* Escapes cases like "if six then even" where A = C. Here P(A ∧ ¬C) = 0 (no six and not even), so we can't conditionalise on ¬C — the argument doesn't bite. But this is a tiny refuge: most conditionals (e.g., "if even then six") have non-zero A∧C and A∧¬C.  

  ---

  ### (3) Denying "True Consequent Guarantees Conditional"
  Your friend suggests: *even if C is true, "if A then C" might not be certain*. But in the argument, **this is not assumed separately**. It falls out of the thesis itself when applied to P<sub>C</sub>:  
  - Under P<sub>C</sub> (credence conditional on C), P<sub>C</sub>(C|A) = 1 (since C is certain).  
  - The thesis *demands* P<sub>C</sub>(if A then C) = f(1).  
  - If your friend denies P<sub>C</sub>(if A then C) = 1, they must deny f(1) = 1 (or f(0) = 0 for false consequents). But this doesn't help:  
    The equations **f(1/3) = f(1)(1/6) + f(0)(5/6)** and **f(1/2) = f(1)(1/6) + f(0)(5/6)** still force f(1/3) = f(1/2) → 1/3 = 1/2.  
    **Why?** f(1) and f(0) are constants — whether they're 1 and 0 or not, they're the *same* in both equations. The collapse persists.  

  ---

  ### (4) What Premise to Give Up and the Cost
  Give up **Premise 1: that "if A then C" expresses a proposition with an unconditional probability**.  
  - **Cost:** Conditionals aren't truth-apt in the standard way. You lose Boolean logic for them (e.g., no negation, no equivalence to ¬A ∨ C). P(if A then C) becomes "shorthand" for P(C|A) *in contexts where it's assessed* (e.g., when supposing A), but it can't be embedded freely (e.g., you can't condition on the conditional itself).  
  - **Alternative:** Keep Premise 1 but reject Premise 2 (thesis rigidity). But then f(P(C|A)) only tracks *your current* credence — not how you'd evaluate the conditional *after learning C or ¬C*. This guts the thesis of predictive power.  

  ---

  ### The One-Sentence Moral
  **"Triviality" means the result collapses all probabilistic dependence: if indicative conditionals are ordinary propositions whose probability matches conditional probability (even via a fixed f), then learning anything could never change what you believe about anything else — reducing probability theory to triviality.**  

  This isn't just a contradiction in one case; it forces a universally absurd independence. Your friend's f doesn't help — it just disguises the same collapse. The core lesson: conditionals can't be bottled into truth-conditional propositions without sabotaging how evidence works.
