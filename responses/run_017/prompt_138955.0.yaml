prompt: |-
  Had a blazing argument in the pub last night with my mate about whether blowing thirty grand on a wedding is actually a signal of commitment. He kept saying it's costly so it's honest, end of; I kept saying cost on its own proves nothing — a signal's only honest if it costs a bloke who's going to bail in two years more than it costs one who isn't, and anyone can borrow thirty grand, so the reception is just a reciept. Problem is I'm best man at that wedding in three weeks and I've now got to write the toast. I need a three-minute speech that gets the handicap principle right without turning into a lecture: the real evidence is him turning down the Singapore posting, selling the car, and doing a reading he wrote himself in front of two hundred people, not the price tag. But I can't say "they must love each other, look at the flowers" because that's the exact move I spent all evening arguing against, and I can't insult her parents who paid for the flowers either. Can you write it so it also gets across that all I can really offer the room is the signals and not his feelings, which I've got no access to — and so it still lands when half the room think the whole wedding's a racket and the other half have never heard of any of this?
reasoning: |-
  Okay, the user was in a heated debate with his friend about whether spending a lot on a wedding signals true commitment. He argued that cost alone isn't proof because anyone can borrow money. Now, as the best man, he needs to give a speech that conveys the handicap principle subtly—highlighting real sacrifices like turning down a job, selling a car, and writing his own vows. But he can't mention the flowers or insult the parents who paid for them. He also wants to acknowledge that he can only speak to the signals, not the couple's private feelings, and make it relatable to everyone, regardless of their views on weddings.

  First, I need to understand the key points from his argument. The handicap principle in biology says that signals are honest when they're costly to fake. So spending money isn't a reliable signal because it's easy to borrow, but personal sacrifices are harder to fake. The user needs to highlight those without sounding academic. 

  He mentioned specific sacrifices: turning down a Singapore job, selling his car, and writing a personal reading. These are concrete examples that show genuine commitment. The speech should focus on these without mentioning the cost of the wedding itself. Also, avoiding any reference to the flowers is crucial since that was part of his earlier argument and the parents paid for them.

  The audience is mixed—some think weddings are a racket, others might not know about signaling theory. The speech needs to bridge that gap. Using relatable metaphors like "skin in the game" or "putting yourself on the line" can help. Humor and personal anecdotes will make it engaging without lecturing.

  He also needs to clarify that as the best man, he can only observe actions, not feelings. Emphasizing that the sacrifices are visible proofs of commitment addresses this. It's important to validate both perspectives in the room—some might value grand gestures, others personal sacrifices—so the speech should acknowledge both without taking sides.

  Structure-wise, start with a warm opening to set a positive tone. Then introduce the debate with a light-hearted touch to avoid awkwardness. Highlight the groom's specific sacrifices as evidence of commitment, linking each to a broader point about what truly matters. Use humor to keep it light, especially about the reading. Wrap up by tying the sacrifices to the couple's future, showing that these actions predict their dedication. End with a heartfelt toast to celebrate their commitment.

  Need to ensure no mention of cost or flowers. Focus on actions: job sacrifice for shared future, selling the car symbolizing priorities, personal reading as vulnerability. These are the honest signals. Also, include a nod to the bride's efforts to show it's mutual. Finally, make the conclusion inclusive, uniting both sides of the audience in celebrating the couple's love and commitment.
answer: |-
  Here’s a speech that threads the needle: celebrates genuine commitment, honors the couple’s specific sacrifices, subtly applies the "handicap principle" without jargon, avoids cost/value debates, and works for *everyone* in the room – all while keeping it warm, personal, and under 3 minutes.

  **(Clink glass gently, warm smile, confident stance)**

  "Right then! For those who don’t know me, I’m [Your Name], and I’ve had the dubious honour of being best mate to this fine gentleman, [Groom's Name], for… well, let’s just say long enough to have witnessed *several* questionable fashion choices and a truly legendary karaoke disaster. But today? Today he looks incredible. And you, [Bride's Name], you take his breath away – and frankly, you’ve silenced the rest of us too. Stunning.

  **(Pause for smiles/applause)**

  "Now, being Best Man, you get asked a lot: ‘How do you *know* they’re right for each other?’ ‘How can you *tell* it’s real?’ **(Slight, knowing chuckle)** Bit deep for pub chat, usually. But it got me thinking. Anyone can say the words, right? ‘Forever,’ ‘Always,’ ‘I do.’ Words are easy. What *shows* it? What makes you sit up and think, ‘Blimey, they *mean* this’?

  **(Lean in slightly, more conversational)**

  "It’s not the grand gestures everyone *sees*, necessarily. It’s the choices made when no one’s really looking, or the things you give up because something else matters more. The things that actually *cost* you something personal, something real.

  **(Directly gesture to Groom, warmly)**

  "Take [Groom's Name]. That Singapore posting? Huge opportunity. Glamorous, career-defining. But it meant being apart from [Bride's Name]. And he turned it down. Flat. Not because he didn’t want the job, but because he wanted *this* – building a life *here*, *together* – infinitely more. That’s a choice with weight. That’s putting skin in the game.

  "And the car! Oh, the beloved [Mention Car Model if known, otherwise just "car"]! Many a lads' trip in that thing. But when it came to building a future, a home *with* [Bride's Name]? Sold. Without a second thought. Because priorities shift when you find your person. That’s not just spending money; that’s investing your whole self.

  **(Gesture towards the ceremony space/order of service)**

  "And then today... that reading. He didn’t just pick something nice out of a book. He sat down, wrestled with words, probably stressed more about *that* than the suit fitting **(gentle laugh)**, and wrote something raw and honest from his heart. Standing up there, in front of all of you, laying himself bare like that? That’s courage. That’s vulnerability. That’s saying, ‘This is me, and I’m all in for her.’ And [Bride's Name], we all saw the way you looked at him while he did it. You’ve clearly put your own heart on the line just as fiercely for him.

  **(Shift to encompass both, then the room)**

  "*That’s* the stuff, isn’t it? That’s the real evidence – not just of love, but of commitment. The choices that prove it’s not just words. The sacrifices that show you’re building something bigger than yourselves. Anyone can throw a fantastic party – and what an absolutely *incredible* party this is, thanks so much to [Bride's Parents] for making it so beautiful! **(Raise glass slightly towards them, sincere smile)** – but not everyone makes the *choices* [Groom's Name] and [Bride's Name] have made leading up to this moment.

  **(Focus back on the couple, heartfelt)**

  "So, how do I know? Because I’ve seen him – and through him, I’ve seen *you both* – consistently choose ‘us’ over ‘me’. Choose the hard, meaningful thing over the easy, flashy one. Choose to be all in, heart, soul, and yes, even his beloved car keys. That’s the foundation. That’s the promise made real long before today, and the best guarantee for every single day after.

  "So, let’s raise our glasses – high! – not just to the love we celebrate today, but to the profound, everyday commitment [Groom's Name] and [Bride's Name] have already shown. To the choices that prove it, and to a lifetime of making more just like them. To [Groom] and [Bride]!"

  **(Big smile, clink glass, lead applause)**

  **Why this works:**

  1.  **Avoids Cost/Flowers Directly:** Never mentions the £30k debate. Compliments the *beauty* of the party/flowers generically and thanks the parents sincerely, sidestepping any value judgment.
  2.  **Highlights "Handicap" Without Jargon:** Uses accessible concepts: "skin in the game," "something personal, something real," "weight," "sacrifices," "investing your whole self," "vulnerability," "choices that prove it’s not just words." Focuses on actions that *genuinely cost the individual* (Singapore job, beloved car, personal vulnerability) which are hard to fake if you're not committed.
  3.  **Centers Their Specific Actions:** The Singapore job, selling the car, and writing the reading are the concrete evidence, exactly as you wanted. It shows observable signals.
  4.  **Acknowledges Bride's Role:** Explicitly mentions her visible reaction and her own commitment ("putting your own heart on the line"), making it about *them*.
  5.  **Distinguishes Signals from Feelings:** Explicitly states: "That’s the real evidence – not just of love, but of commitment." Acknowledges the observable proof is what you *can* speak to. "The choices that prove it’s not just words."
  6.  **Works for Both Camps:**
      *   **The "Racket" Camp:** Hears a speech validating that *real* commitment is deeper than the party, pointing to concrete sacrifices. It doesn't glorify the spend.
      *   **The "Traditional" Camp:** Hears a heartfelt, romantic toast celebrating love and commitment, praising the beautiful event, and focusing on the couple's devotion. The specific sacrifices sound like proof of true love to them.
      *   **Everyone Else:** Gets a warm, funny-ish, personal, and meaningful tribute to the couple's relationship.
  7.  **Tone:** Warm, personal, slightly humorous, heartfelt, and celebratory. Avoids sounding like a lecture or sociology seminar.
  8.  **Structure:** Clear opening, relatable question, concrete examples proving commitment, heartfelt conclusion tying it to their future, rousing toast.

  **Delivery Tip:** Practice pacing. Let the warmth and sincerity come through, especially when listing his sacrifices and talking about the reading/vulnerability. The glance and thanks to the parents should be genuine and warm. Keep the energy up for the final toast! Good luck!
