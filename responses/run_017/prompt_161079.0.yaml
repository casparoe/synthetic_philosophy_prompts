prompt: |-
  so I'm writing a novel and one of my characters — Ines, night porter at a big hotel — runs her day on a routine so exact that another character accuses her of being a machine. Not cruel, not cold, just running a program. I want that accusation to actually mean something, and the word I keep circling is sphexish: the digger-wasp thing where the wasp paralyses a cricket, drags it to her burrow, leaves it on the step, goes in to inspect, comes back out and hauls it in — and if you nudge the cricket a few inches while she's down there, she runs the whole inspection from the top again, apparently without end. Not stupid, just locked.

  I need a spec before I write the scene. Give me the desiderata for a theory of sphexishness: what an account of the difference between rigid mechanical behaviour and flexible agency has to deliver to be worth anything. Purpose matters here, so: good enough for two things — (1) a reader should be able to tell, from what I put on the page, whether Ines is sphexish or is just a woman who likes her routines, and (2) the accusation has to be able to do moral work between characters, excuse or blame, without collapsing into "she isn't free."

  For each requirement give the case or consideration behind it. The cases I want covered: the wasp; a sleepwalker; an OCD hand-washing ritual; a concert pianist whose hands know the piece better than she does; a nurse on autopilot at 4am; a bureaucrat who follows procedure and is thereby monstrous; a tick or an ant with a three-item repertoire; a language model producing perfectly fluent text; and a person whose options have all been quietly closed off by money or threat — she varies her behaviour lots, but every variation was scripted in advance by someone else.

  Two things I've been mulling that you should fold in. First, off-distribution rigidity: it feels to me like sphexishness is a property of a system relative to a *range* of environments, not a binary trait of the system, so a thing can be fabulously flexible inside the range it was built for and still fall apart the moment you move the cricket. Second, canned spontaneity: a system whose flexibility is itself stereotyped — the improv student with forty bits she recombines, the rebel teenager performing rebellion — strikes me as sphexish in a higher-order way, and I want to know if the theory can say that or whether it's just a prejudice of mine.

  Also tell me: which distinctions the theory must not collapse (stupid vs rigid vs predictable, behaviour vs mechanism vs history, local vs global rigidity, degrees vs threshold), which requirements are non-negotiable and which are camp preferences (I assume "must not smuggle in indeterminism" is non-negotiable and "must be legible from the outside" is negotiable for some camps), and whether any subset is jointly unsatisfiable — my hunch is that "diagnosable third-personally" and "sensitive to the agent's reasons" can't both hold, and that "graded" and "sharp enough to blame on" can't either. Which single requirement rules out the most candidate accounts? A line each on the obvious candidates — behavioural, mechanistic, reasons-responsive, information-theoretic — is fine, but keep the weight on the criteria, not the scorecard.
reasoning: |-
  Hmm, the user is writing a novel and needs help developing a theory of "sphexishness" - that robotic, inflexible behavior exemplified by the digger-wasp that keeps repeating its routine even when circumstances change. They want clear criteria to distinguish between mere routine-loving humans versus genuinely sphexish behavior, and they need this concept to carry moral weight in character interactions.

  The user has provided several fascinating case studies: everything from OCD rituals to concert pianists to bureaucratic monsters. They're particularly concerned about two nuances: 1) how systems can be flexible within expected parameters but break down when pushed beyond them, and 2) whether "canned spontaneity" (like rehearsed improvisation) counts as higher-order sphexishness. They also want warnings about potential contradictions in the theory - especially whether we can simultaneously judge behavior from outside while respecting the agent's internal reasons.

  I need to establish robust desiderata for this theory. The core tension seems to be between observability (so readers can recognize sphexishness through narrative details) and moral relevance (so characters can meaningfully accuse each other of mechanical behavior without denying free will). The theory must avoid collapsing important distinctions like stupidity versus rigidity, or confusing predictability with lack of agency.

  For the cases: The sleepwalker shows mechanical behavior without consciousness, while the nurse on autopilot demonstrates how fatigue can induce sphexishness in otherwise flexible humans. The bureaucrat case is crucial - it highlights how procedural adherence can become monstrous when divorced from moral reasoning. The "scripted rebel" perfectly illustrates higher-order sphexishness through meta-rigidity.

  Key non-negotiables include: no smuggling in indeterminism (sphexishness isn't about quantum randomness), avoiding mind-body dualism, and ensuring the concept has gradients rather than being binary. The biggest challenge will likely be Requirement 5 (diagnosability) clashing with Requirement 6 (reasons-sensitivity), since we can't directly access characters' internal states in narration. The concert pianist case resolves this by showing how deeply-learned skills can appear mechanical while retaining responsiveness.

  For moral work, the theory must allow accusations to function as social correctives ("you're acting mechanically") rather than metaphysical judgments ("you have no free will"). This preserves blame/excuse dynamics while acknowledging that even sphexish humans can break patterns with effort - unlike actual digger-wasps.
answer: |-
  Here’s a rigorous set of desiderata for a theory of sphexishness, designed to meet your narrative and philosophical goals, grounded in your cases and constraints. The non-negotiables are marked **(NN)**.

  ---

  ### **Core Desiderata for a Theory of Sphexishness**
  1. **Environment-Relative Rigidity (Off-Distribution Breakdown)**  
     - *Requirement*: Must explain why flexibility in a *familiar* environment doesn’t preclude sphexishness if behavior collapses under novel perturbations (e.g., moving the cricket).  
     - *Case Basis*: The digger-wasp is hyper-competent *until* the cricket is displaced; a bureaucrat follows protocol flawlessly until faced with a moral emergency outside the rules.  
     - *Non-Negotiable*: **(NN)**. Sphexishness is defined by failure modes, not baseline behavior.

  2. **Distinction from Mere Predictability/Routine**  
     - *Requirement*: Must differentiate rigid *compulsion* (sphexish) from intentional, interruptible habit (e.g., Ines’ routine vs. a pianist’s muscle memory).  
     - *Case Basis*: The nurse on autopilot at 4am can snap into agency during a crisis; the sleepwalker *cannot*. OCD ritual feels externally imposed; a "routine-lover" can choose to skip coffee.  
     - *Non-Negotiable*: **(NN)**. Essential for reader diagnosis and moral weight.

  3. **Higher-Order Rigidity (Canned Spontaneity)**  
     - *Requirement*: Must capture meta-rigidity: systems that *simulate* flexibility via pre-scripted variations (e.g., the improv student’s "spontaneous" toolkit).  
     - *Case Basis*: The rebel teenager cycles through rebellion tropes; a language model recombines training data fluently but can’t *truly* innovate.  
     - *Negotiable*: Camp preference, but critical for modern relevance (AI/performative agency).

  4. **Moral Blame/Excuse Without Free-Will Collapse**  
     - *Requirement*: Must allow accusations to function as *social/moral critiques* ("you’re behaving mechanically") without implying metaphysical determinism.  
     - *Case Basis*: The bureaucrat is blameworthy for hiding behind procedure; the coerced person is excused because their "script" is imposed externally.  
     - *Non-Negotiable*: **(NN)**. Core to your "moral work" constraint.

  5. **Third-Person Diagnosability**  
     - *Requirement*: Must be legible through observable behavior + context (no mind-reading).  
     - *Case Basis*: Reader must judge Ines from her actions (e.g., how she reacts to a disrupted routine). The wasp’s rigidity is evident from external manipulation.  
     - *Negotiable*: Degree of legibility varies, but must be feasible for prose.

  6. **Reasons-Responsiveness (Without Dualism)**  
     - *Requirement*: Must acknowledge the *agent’s perspective* (e.g., OCD feels rational; the coerced person acts for reasons) while explaining why those reasons don’t reflect flexible agency.  
     - *Case Basis*: The tick responds to stimuli but has no "reasons"; the coerced person has reasons but no *meaningful* alternatives.  
     - *Non-Negotiable*: **(NN)**. Avoids reducing agency to mere unpredictability.

  ---

  ### **Distinctions the Theory MUST Preserve**
  - **Stupid vs. Rigid vs. Predictable**:  
    Stupidity = poor solutions; Rigidity = inability to update solutions; Predictability ≠ rigidity (e.g., the pianist is predictable but responsive).  
  - **Behavior vs. Mechanism vs. History**:  
    Rigid behavior (wasp) can stem from simple mechanisms (neural loop) *or* complex trauma (OCD). History matters for blame (coerced vs. bureaucrat).  
  - **Degrees vs. Threshold**:  
    Sphexishness is graded (ant < bureaucrat < wasp) but needs thresholds for blame ("you crossed a line").  
  - **Local vs. Global Rigidity**:  
    A system can be locally flexible (nurse’s tasks) but globally sphexish (no capacity for self-reinvention).

  ---

  ### **Tensions & Dealbreakers**
  - **Key Tension**: **Diagnosability (5) vs. Reasons-Sensitivity (6)**.  
    Observers see behavior; agents experience reasons. A theory must bridge this without privileging one (e.g., by focusing on *capacity to integrate novel reasons*).  
  - **Gradedness (Degrees) vs. Blame Threshold**:  
    Solved by context: Blame applies when rigidity violates role-based expectations (e.g., Ines *should* adapt as a human; a tick *cannot*).  
  - **Most Exclusionary Requirement**: **Environment-Relative Rigidity (1)**.  
    Rules out theories that define sphexishness as simple determinism or low behavioral complexity (e.g., the pianist or nurse would falsely qualify).  

  ---

  ### **Why Candidate Theories Fail (Briefly)**
  - **Behavioral (e.g., repetition = sphexish)**:  
    Fails (1) & (2): Pianist repeats notes but is flexible; OCD has internal variation. Collapses predictability/rigidity.  
  - **Mechanistic (e.g., neural reflex loops)**:  
    Fails (3) & (6): Can’t explain higher-order rigidity (canned spontaneity) or reasons-sensitivity (coerced person).  
  - **Reasons-Responsive (e.g., Frankfurt)**:  
    Fails (1) & (5): Coerced person is reasons-responsive but sphexish; hard to diagnose third-personally.  
  - **Information-Theoretic (e.g., low algorithmic complexity)**:  
    Fails (2) & (3): Wasp and bureaucrat may have complex behaviors; canned spontaneity has high complexity but is rigid.  

  ---

  ### **The Winning Theory: Contextual Counterfactual Rigidity**
  A system is sphexish **to the extent that it cannot adapt its goals/problem-solving methods in response to *perturbations outside its functional design envelope***, even when:  
  - It exhibits internal complexity (bureaucrat, AI).  
  - It experiences subjective reasons (OCD, coerced person).  
  - It simulates flexibility (canned spontaneity).  

  **How it delivers**:  
  - **Reader Diagnosis (Ines)**: Show her failing to adapt when routine is disrupted *in ways a human should handle* (e.g., guest emergency during her "inspection" ritual).  
  - **Moral Work**: Accusation means: "You are *choosing* not to engage your capacity to adapt" (blame) vs. "Your environment has disabled your adaptability" (excuse).  
  - **Coverage**:  
    - *Wasp*: Design envelope = cricket at burrow; perturbation = moved cricket → rigid loop.  
    - *Canned Spontaneity*: Design envelope = pre-approved "rebel" scripts; perturbation = demand for authentic vulnerability → breakdown.  
    - *Coerced Person*: Design envelope = threat-bound options; perturbation = removed threat → regained flexibility (if not traumatized).  
  - **Non-Collapse**:  
    - Freedom ≠ indeterminism: A traumatized person may be sphexish *despite* chaotic behavior.  
    - Blame Threshold: Ines is sphexish if she *could* adapt (given her role) but *won’t*; the coerced person *can’t* without external change.  

  This satisfies all **(NN)** requirements, handles your cases, and lets the accusation cut deep without invoking metaphysics.
