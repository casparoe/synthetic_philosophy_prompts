  The formal-methods objection about partial observability and branch point dependence is critical. The reply admits limits but argues for approximate feasibility—weak because it handwaves implementation. The decision theorist's utility-function-in-disguise critique hits hard; the reply emphasizes constraint-as-deontic not consequentialist, but inherits index-number problems. The philosopher's status-quo-bias charge is philosophically damning; the reply weakly claims neutrality while admitting state variables embed values.

