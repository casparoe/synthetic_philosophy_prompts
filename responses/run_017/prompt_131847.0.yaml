prompt: |-
  I keep bumping into a thing and I dont have a word for it. Example: arguing with a friend who says, seriously, that any photo in the news might be AI-generated, so nothing visual is evidence for anything anymore. I notice I can't produce an argument that stops him — every reason I give already assumes what he's denying — but I also don't treat his position as a live option I might turn out to be wrong about. I just treat him as outside the conversation. Same shape, different content, a couple of hundred years back, or so it seems to me: which sources count as testimony you can build on has changed, and it changed without anyone winning an argument.

  So the pattern. Some claims work as stopping points where reasons run out, but (a) they're not insulated from revision — whole communities have swapped them out over time and you can often say roughly when, and (b) while one is in force, denying it doesn't get you a hearing; you get corrected, trained, or laughed at rather than argued with. They behave like facts when you deny them and like contingent historical commitments when you look at them from far enough away.

  I half-remember that Wittgenstein's On Certainty is somewhere in this neighborhood, but as far as I can tell that's about propositions that can't be doubted, and mine plainly can be — just not all at once. Is there an established concept for this exact configuration, and what are the nearest candidates and where does each fail to fit? Don't just hand me a label: if nothing established fits, give me a name, a definition, and the borderline cases where it'd be unclear whether something counts.
reasoning: |-
  Okay, the user is describing a specific epistemic phenomenon where certain claims function as foundational stopping points in reasoning within a community. These points are treated as unquestionable facts in practice (deniers get dismissed rather than argued with), yet historically we can see they're contingent and have changed over time. They mention Wittgenstein's "hinge propositions" but note theirs are doubtable collectively over time, just not individually during their reign.

  The core tension here is between the psychological immovability of these commitments in a given context versus their historical mutability. The user wants a precise conceptual label for this configuration, rejecting superficial answers. They're clearly philosophically sophisticated—they've already identified Wittgenstein's relevance but find it insufficient. 

  Hmm... let me mentally scan related concepts:
  - Kuhnian paradigms? Too broad, more about scientific frameworks.
  - Foucault's episteme? Too diffuse and structural.
  - Brandom's default entitlements? Closer but not quite capturing the social enforcement aspect.
  - Lewisian conventions? Focuses on coordination problems rather than epistemic foundations.

  The user's example about photographic evidence is perfect—it shows how deep epistemic norms operate. When their friend denies this modern hinge proposition ("photos generally depict reality"), they don't get reasoned with; they get excluded. Yet we know this norm emerged circa 1840-1920 when photos became evidence in courts. 

  What's needed is a term that captures: 
  1) The quasi-factual status in practice
  2) The social enforcement mechanism (dismissal not refutation) 
  3) Historical contingency visible in retrospect

  "Epistemic bedrock" feels right but isn't established terminology. Let me justify why I'd coin it:
  - "Bedrock" invokes Wittgenstein's metaphor while allowing revision
  - "Epistemic" centers the knowledge-function
  - Captures the unyielding quality during its tenure

  Borderline cases would be:
  - Mathematical axioms (too permanent to fit)
  - Religious dogmas (often have explicit insulation from revision)
  - Mere cultural biases (lack the evidentiary function)

  The user's frustration is palpable—they've sensed this pattern across eras but lack the vocabulary. They're not just asking for themselves; they want to articulate this for scholarly discourse. My response must honor that depth while delivering precision.
answer: |-
  You've hit upon a profound and slippery epistemic phenomenon. There isn't a single universally agreed-upon term, but your description is exceptionally clear, and we can build a precise conceptual framework. Wittgenstein's "hinge propositions" are *related* but, as you note, insufficient because they're meant to be *undoubtable* within a language game, whereas yours are *historically revised* and *socially enforced*. Let's break this down:

  ### The Core Concept: **Epistemic Bedrock Commitments (EBCs)**
  *(Proposed Term & Definition)*

  **Definition:** *Epistemic Bedrock Commitments (EBCs) are propositions or practices treated within a specific epistemic community, during a specific historical period, as foundational stopping points for justification. They function as non-negotiable premises in reasoning and discourse. Denial of an EBC is met not with counter-argument, but with social exclusion, correction, or dismissal, as it is seen as undermining the very possibility of shared inquiry. However, EBCs are historically contingent: communities can and do replace them over time through shifts in practice, technology, or culture, not through formal refutation.*

  ### Why This Fits Your Description:
  1.  **"Stopping points where reasons run out":** EBCs are treated as axiomatic within their context; demanding further justification for them is seen as nonsensical or hostile.
  2.  **(a) "Not insulated from revision... swapped out over time":** They are contingent, historical artifacts, not eternal truths. Their replacement happens via broader socio-epistemic shifts (e.g., rise of photography, print culture, digital tech).
  3.  **(b) "Denying it doesn't get you a hearing... corrected, trained, or laughed at":** The *social enforcement mechanism* is key. Denial marks one as outside the epistemic community ("outside the conversation"). Responses are pedagogical, corrective, or derisive, not dialectical.
  4.  **"Behave like facts... like contingent historical commitments":** This captures the Janus-faced nature. *Internally*, they *function* as objective facts. *Externally* (historically/sociologically), they are revealed as contingent commitments.
  5.  **Difference from Wittgenstein:** "Hinge propositions" (e.g., "The world exists," "I have hands") are meant to be *logically* necessary for doubt to make sense *at all*. Your EBCs are *historically* necessary for *specific forms* of inquiry and evidence within a *particular community* at a *particular time*. They *can* be doubted collectively over time, just not individually *within* their functional period without social penalty.

  ### Why Other Concepts *Don't* Fully Fit:
  1.  **Wittgenstein's "Hinge Propositions" (On Certainty):**
      *   **Failure:** Hinges are framed as *trans-historical/logical* preconditions for *any* language game/doubt. Your cases are *historically specific* and *replaceable* (e.g., the status of photographic evidence *changed*). Hinges resist doubt conceptually; EBCs resist doubt *socially and practically* but succumb to it *historically*.
  2.  **Thomas Kuhn's "Paradigms" or "Exemplars":**
      *   **Failure:** Paradigms are broader frameworks governing *how* science is done (methods, problems, standards). Your EBCs are *specific, foundational propositions/practices* embedded *within* a paradigm (e.g., "Photographs reliably depict reality" is an EBC *within* the modern empiricist paradigm). Paradigms contain many EBCs.
  3.  **Robert Brandom's "Default Entitlements":**
      *   **Failure:** Default entitlements are propositions one is *entitled* to assert without proof *unless challenged*. Your cases are stronger: *challenging them* is what triggers dismissal or correction, not a request for justification. They are *immune* to challenge within the community, not merely *presumed*.
  4.  **David Lewis's "Conventions":**
      *   **Failure:** Conventions are solutions to coordination problems (e.g., driving on the right). While EBCs have a conventional element, their primary function is *epistemic* – they ground *justification* and *evidence*, not just coordination. Their denial is an epistemic transgression, not just a coordination failure.
  5.  **"Taboos" or "Sacred Cows":**
      *   **Failure:** These terms emphasize emotional or moral prohibition, often with irrational roots. EBCs *function* rationally *within* their framework; they are the basis *for* what counts as rational inquiry in that context. Their defense feels like defending reason itself, not just tradition.
  6.  **"Axioms" (in a loose sense):**
      *   **Failure:** Axioms are explicitly chosen starting points within a formal system. EBCs are often *implicit*, operate in *informal* reasoning and social practice, and their status is tied to *social enforcement*, not formal declaration. Their contingency is more evident than formal axioms.

  ### Borderline Cases & Unclear Applications of EBC:
  1.  **Mathematical Axioms:** Are the Peano Axioms EBCs? *Unclear.* Within mathematics, denying them *would* get you dismissed. They *are* swapped out historically (e.g., Euclid's parallel postulate). However, they are often seen as more *logically necessary* and less *contingent on historical practice* than "photos are evidence." **Verdict:** *Leaning towards EBC,* especially for axioms whose necessity was historically debated (like the parallel postulate).
  2.  **Basic Logical Laws (e.g., Non-Contradiction):** Denial *does* get you dismissed/corrected. Are they revisable? Arguably not without collapsing rationality entirely, making them closer to Wittgensteinian hinges. **Verdict:** *Not EBCs.* They are closer to universal hinges, necessary for *any* discourse.
  3.  **Religious Dogma (in a theocratic society):** "God exists" might function as an EBC: denial gets you excluded (heresy), not argued with; it grounds inquiry; it *can* be swapped out historically (secularization). **Verdict:** *Clear EBC* within that epistemic community. Its *content* being non-empirical doesn't disqualify it; its *functional role* does.
  4.  **"The Earth is Round" (in modern cosmology):** Denial gets you laughed at/corrected. Is it revisable? Only via a massive, unimaginable paradigm shift. **Verdict:** *Borderline EBC.* It *functions* as bedrock now, but its evidence is so overwhelming and its connection to fundamental physics so deep that challenging it feels different than challenging the current status of photos vs. AI. It leans towards hinge status but retains a historical contingency that pure hinges lack.
  5.  **"Racial Equality" (in modern liberal democracies):** Functionally bedrock in *official* discourse; denial gets you socially/politically excluded. Historically contingent (replaced older hierarchies). **Verdict:** *Strong EBC.* Its grounding is primarily moral/political/social, but it functions as a non-negotiable starting point for legitimate discourse *within that community*.

  ### Key Features of an EBC (Summary):
  *   **Function:** Foundational stopping point for justification/evidence *within a specific epistemic community*.
  *   **Enforcement:** Denial met with *social exclusion, correction, or ridicule*, not argument (signals epistemic exile).
  *   **Status:** Treated *as fact* internally; revealed as *historically contingent commitment* externally.
  *   **Revision:** Changed over time via *shifts in practice, tech, culture* ("won without an argument").
  *   **Scope:** Specific to a community/period, not universal logical preconditions (unlike hinges).

  **Epistemic Bedrock Commitments (EBCs)** capture your "exact configuration" by emphasizing the *functional role in halting justification*, the *social mechanism of enforcement* (exile, not refutation), and the *historical contingency* visible only in retrospect when the bedrock itself has shifted. They are the deep, often unspoken, agreements that make shared sense-making possible *for a time and a people*, agreements defended not with reasons but with the boundaries of the community itself.
