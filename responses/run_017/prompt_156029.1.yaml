prompt: |-
  I have spent the last several months deciding whether to take the predictive genetic test for Huntington's disease. My mother was diagnosed last spring, so my prior is very close to a coin flip, and the result would tell me nothing I could act on medically. While trying to think about this properly I started reading on the value of information, and I keep circling around Good's theorem, or rather around the result I take it to state: for an agent whose preferences satisfy the expected-utility axioms and whose utility function will not itself be altered by what she learns, a costless piece of information cannot have negative expected value, since she can always decline to let it change what she does and act exactly as she would have acted without it. I find that result both unimpeachable and, in my situation, close to useless. So I want to stop arguing with it in the abstract and instead start from the verdicts I actually have about particular cases, and see what principle, if any, they add up to.

  Here is where I find myself.

  1. Taking the Huntington's test itself: worth doing, before the decisions I have coming up about children, about a mortgage, about whether to stay in a job whose pension vests in twelve years.

  2. A whole-genome scan returning several hundred variants of uncertain significance and lifetime risk estimates for dozens of conditions, free, through a research study I've been invited into: not worth doing, even though some of the returned results would be actionable.

  3. Asking the surgeon who would do a procedure on me how many of them he has performed and what his complication rate is: worth asking, even on the assumption that the answer may well be unflattering.

  4. Reading the last fifty pages of the novel I am two hundred pages into: not worth doing, and this feels like the clearest case on my list even though nothing turns on it and no decision is at stake.

  5. Being told my own score on an IQ test I have already sat: not worth being told.

  6. Looking at my students' teaching evaluations before I finalize their grades: not worth doing, and I would go further and say it would be a reason to distrust the grades I then produced.

  7. Letting my employer, or any insurer, come to know my genetic result: not worth it, even though it is the very same information I have just said I want for myself.

  8. Asking my mother's neurologist to walk me through her early clinical notes: worth it, I think, even though I can foresee that I will then read my own ordinary twitches as symptoms for years.

  Two of these pairs I cannot get comfortable with. In 3 and 6 alike the information is free, relevant to something I am going to do anyway, and impossible for me to pretend I have not seen; yet I want the surgeon's numbers and I do not want the evaluations. And 1 and 2 are harder than they look: the scan in 2 contains strictly more actionable content than the test in 1, and my reason for refusing it is not that the information is useless but that I do not trust myself to hold several hundred weak signals at their proper weight rather than converting them into dread. That is, I take the theorem's escape clause — that one can always ignore the information — to be doing far more work than it appears to do, because ignoring is a thing I can resolve to do and then fail to do.

  The closest I have come to a principle is this: costless information is worth acquiring just in case its expected effect on what I do runs through a channel I endorse — it should move me by revising my beliefs about matters I already count as reasons for that action — and not through a channel I do not endorse: altering what I want, degrading an experience that is itself part of what I was choosing, leaking into a judgment I am obliged to make only on specified grounds, or becoming visible to someone who will then use it against me. The obvious trouble is that this is close to empty. Stated in terms of channels I endorse, it threatens to ratify whatever the information does in fact do, and so to restate my verdicts rather than explain them. What I need is a version that tells me, before I have the information, which channel it will travel by; otherwise I have a slogan and not a principle.

  So I would like the following: a principle, or a small set of rival principles, stated precisely enough to be applied, with the case that motivates each clause; its verdicts on my eight cases; a plain statement of which of my verdicts it refuses to accommodate and whether you think I should abandon those verdicts or abandon the principle; and what it says about two cases I have not listed — a friend in my exact position who is certain that no result would change her mind about having children, and the difference, if the principle recognizes one, between being told my own result in a clinic and having it appear in a patient-portal message on a Sunday night. If the honest answer is that there is no single principle here and that what I need is a taxonomy of the ways in which the theorem's antecedents fail in ordinary life, say that instead, and give me the taxonomy.
reasoning: |-
  Okay, the user has been grappling with the decision of whether to take a predictive genetic test for Huntington's disease. Their mother was recently diagnosed, so they have a 50% chance of inheriting the gene. They've been studying Good's theorem, which states that costless information should never have negative expected value because you can always ignore it. But they find this impractical in real-life situations. They've listed eight scenarios where they've made decisions about seeking or avoiding information, and they're struggling to find a consistent principle behind these choices.

  The user's main pain point seems to be the tension between rational theory (Good's theorem) and their intuitive judgments about specific cases. They recognize that in theory they could ignore information, but in practice they doubt their ability to do so. Their examples highlight situations where information might influence them through "channels they don't endorse" - like altering their emotional state or leaking to third parties.

  Looking at their examples: They want the Huntington's test (1) but reject a broader genome scan (2). They want surgical statistics (3) but reject seeing student evaluations before grading (6). This creates cognitive dissonance since both are "free, relevant information" they couldn't ignore.

  Their proposed principle focuses on whether information affects decisions through "endorsed channels" - basically, does it influence them only by updating beliefs about relevant factors? The problem is this risks being circular: any information that changes their behavior could be said to use an "unendorsed channel."

  I think they need a more structured framework that distinguishes different ways information can cause harm beyond just affecting decisions. Some possibilities:
  - Information that creates unavoidable psychological burden (like the genome scan)
  - Information that creates conflicts of interest (like seeing evaluations before grading)
  - Information that could be misused by others (like genetic results seen by insurers)
  - Information that spoils experiences (like novel spoilers)

  For their unresolved pairs:
  For 3 vs 6: The surgeon's stats directly inform a specific decision (endorsed channel), while evaluations might unconsciously bias grading (unendorsed channel). 
  For 1 vs 2: The single Huntington's result is interpretable and actionable, while the genome scan's noise would overwhelm their decision-making capacity.

  The user also asks about two additional cases: 
  - A friend certain the test wouldn't change childbearing decisions: Here the info has little instrumental value but might still cause psychological harm.
  - Getting results in-clinic vs online: The context determines support systems for processing the news.

  Ultimately, Good's theorem fails in real life because:
  1) We can't reliably ignore information (cognitive limitations)
  2) Information has intrinsic psychological costs/benefits
  3) Third parties can misuse information
  4) Information can alter our preferences/values
  5) It can spoil future experiences

  The taxonomy should address these failure modes explicitly. The user needs practical decision heuristics acknowledging that humans aren't perfectly rational agents - our psychology and social context constrain how we handle information.
answer: |-
  Your struggle resonates deeply—Good's theorem is logically sound but often psychologically inadequate. Your cases reveal how information's value hinges not just on content, but on **how it interacts with human cognition, emotion, and social context**. Below is a taxonomy of principles derived from your verdicts, each addressing a distinct failure mode of Good's theorem. These principles aren't mutually exclusive; real decisions often involve multiple.

  ---

  ### **Principle 1: Cognitive Endorsement**  
  *Information is worth acquiring only if you can rationally integrate it into your decision-making framework without distortion.*  
  - **Motivating Case**: Your genome scan (#2) vs. Huntington's test (#1). The genome scan floods you with low-signal data you distrust yourself to weigh properly ("converting them into dread"). Huntington's result, while high-stakes, is a single, clear input for specific life decisions.  
  - **Core Insight**: Good's theorem assumes perfect Bayesian updating. But humans suffer from **cognitive overload** and **probability neglect**. When information exceeds your capacity to process it rationally (e.g., hundreds of VUS variants), its expected value turns negative.  
  - **Verdicts**:  
    - ✓ #1 (Huntington's test): Interpretable for discrete decisions.  
    - ✗ #2 (Genome scan): Unmanageable noise-to-signal ratio.  
    - ✓ #3 (Surgeon's stats): Actionable, focused data.  
    - ✗ #6 (Teaching evals): Risks *irrational* bias in grading (you're obliged to grade on merit, not likability).  
  - **Rejects**: None of your verdicts—it explains why #2 is refused despite "more actionable content."  
  - **Friend's Case**: If she’s truly certain the test won’t change her choice, the info lacks instrumental value. But Principle 1 still warns: Can she *really* avoid cognitive distortion? If not, abstain.  
  - **Result Delivery**: Clinic (✓) allows professional support for integration; patient portal (✗) risks isolation + misinterpretation.  

  ---

  ### **Principle 2: Agency Preservation**  
  *Information is worth acquiring only if it doesn't undermine your autonomy or identity.*  
  - **Motivating Case**: IQ test results (#5) vs. surgical stats (#3). Knowing your IQ might *redefine your self-concept* ("I’m a 110, not a 130"), altering intrinsic motivation. Surgical stats merely inform a risk calculation.  
  - **Core Insight**: Good's theorem assumes preferences are static. But information can **shift your values** (e.g., IQ score inflating/deflating ambition) or **pre-empt experiences** (e.g., novel spoilers in #4).  
  - **Verdicts**:  
    - ✗ #4 (Novel spoilers): Robs the experience of discovery.  
    - ✗ #5 (IQ test): Threatens self-narrative without benefit.  
    - ✓ #3 (Surgeon): Empowers informed consent.  
    - ✗ #7 (Sharing genetics): Grants others power to discriminate.  
  - **Rejects**: None. Explains #5’s refusal and #7’s asymmetry (you want control, not your insurer).  
  - **Friend's Case**: If the test could corrode her certainty about children (e.g., "I’d feel selfish risking this"), she should refuse—even if she believes she’ll "ignore" it.  
  - **Result Delivery**: Clinic (✓) preserves agency via counseling; portal (✗) forces unmediated confrontation.  

  ---

  ### **Principle 3: Moral Hygiene**  
  *Information is worth acquiring only if it doesn't corrupt morally sensitive processes.*  
  - **Motivating Case**: Teaching evaluations (#6). Even if you resolve to ignore them, their emotional salience might subtly bias grades. This violates your duty to judge students *only on merit*.  
  - **Core Insight**: Good's theorem ignores **motivated reasoning** and **duty-alien influences**. When you’re obligated to decide on narrow grounds (e.g., grading), extraneous info is toxic.  
  - **Verdicts**:  
    - ✗ #6 (Evaluations): Risks conflating popularity with competence.  
    - ✓ #8 (Mother's notes): Painful but morally relevant to understanding her decline.  
    - ✓ #1 (Huntington's): Decisive for personal choices (no third-party duties).  
  - **Rejects**: None. Justifies #6’s refusal despite parallels to #3.  
  - **Friend's Case**: If she’s a parent, the test might reframe a child’s existence as a "gamble"—corrupting parental love. Abstain.  

  ---

  ### **Taxonomy of Good's Theorem's Failures in Practice**  
  Your cases expose five ways the theorem’s assumptions collapse:  

  | **Failure Mode**         | **Description**                                  | **Your Cases**                          |  
  |--------------------------|--------------------------------------------------|-----------------------------------------|  
  | **Cognitive Limits**     | Humans can’t process complex/noisy data rationally. | #2 (Genome scan overwhelms you)         |  
  | **Preference Drift**     | Information alters values/identity.              | #4 (Spoilers ruin joy), #5 (IQ redefines you) |  
  | **Agency Threats**       | Others weaponize information against you.        | #7 (Insurers misuse genetic data)       |  
  | **Moral Contamination**  | Info creates conflicts in duty-bound judgments.  | #6 (Evaluations bias grading)           |  
  | **Emotional Burden**     | Info imposes psychological costs beyond decisions.| #8 (Notes induce hypervigilance for symptoms)|  

  ---

  ### **Resolving Your Conflicts**  
  - **#3 vs. #6 (Surgeon vs. Evaluations)**:  
    - Surgeon stats (#3) pass all principles: cognitively manageable, preserves agency (you choose surgery), no moral risk.  
    - Evaluations (#6) fail Moral Hygiene (duty to grade fairly) and risk Cognitive Limits (salient negativity may overshadow merit).  
  - **#1 vs. #2 (Huntington's vs. Genome Scan)**:  
    - Huntington's (#1) is a single, high-stakes input for specific decisions (Principle 1).  
    - Genome scan (#2) violates Cognitive Limits and risks Preference Drift (e.g., "I now see myself as prone to cancer").  

  ---

  ### **Conclusion: No Single Principle, but a Toolkit**  
  Good’s theorem fails you because it assumes a frictionless, emotionless, socially isolated decision-maker. Your judgments reveal that information’s value depends on:  
  1. **Interpretability** (Can I use this rationally?),  
  2. **Identity Integrity** (Will this redefine me?),  
  3. **Moral Safety** (Will this corrupt my duties?),  
  4. **Social Control** (Who else could use this?).  

  **For your unlisted cases**:  
  - Your friend "certain" no result would change her mind: She likely underestimates Preference Drift. If the test could make her resent a child or feel doomed, Principle 2 says *don’t test*.  
  - Clinic vs. patient portal: Principle 1 and 2 favor the clinic. Context shapes integration—a portal message risks shock + isolation, undermining Agency Preservation.  

  **Final advice**: Your instinct is right—ignore Good’s theorem when cognitive, moral, or emotional risks dominate. Screen information through the four filters above. For the Huntington’s test, if you trust yourself to use the result *only* for mortgage/job/children decisions (not to redefine your identity), take it. If not, abstain. Neither choice is irrational.
