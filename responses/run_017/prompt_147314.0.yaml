prompt: |-
  I'm a novelist and I've got a problem that isn't really a plotting problem, it's been bugging me for two years. My next book is about a species that lives inside rock. The individuals never meet, never see each other, never touch anything they talk about — they're blind, and they communicate by scoring marks into clay tiles that get pushed along tunnels. So every one of them learns the whole language from the marks on tiles and from nothing else. And yet they coordinate: they shore up tunnels before collapses, they route water, they leave warnings that other burrowers act on correctly.

  Halfway through the book a human character builds a thing — call it the reader — hooked to sensor arrays and trained on a huge corpus of the tiles, and after a while it starts cutting new tiles of its own that the burrowers treat as perfectly sensible. My narrator has to say one of two things and I need to know what I'm committing to: that the burrowers' marks are about the dark outside the rock and the reader's aren't, or that it's patterns all the way down for both of them. Two cases I keep circling: the burrowers have a word for the big predator that really tracks the vibration-pattern on their skin and not the animal, and they've been wrong about it for ten thousand years with nothing ever going wrong for them; and they've got a word for what's outside that's been handed mark to mark for a thousand generations without anybody checking it against anything.

  So before I write myself into a corner — what would a theory of when a symbol is actually about something have to deliver for me to trust it? I want the requirements list, not the theories, and good enough for a narrow purpose: it has to let my narrator write a straight sentence about what the marks mean, or tell me she can't. Give me exactly five numbered requirements, one or two sentences each, no intro and no summing-up at the end. Each one starts with MUST or NICE-TO-HAVE and carries the case — from my world, or one you invent that's worse — that shows why it's on the list. Put an asterisk on the one you think rules out the most candidate theories. If two of them can't be had together, say so inside whichever item it bites and don't smooth it over. And one of the five has to be about what my human character could actually go do in the field: she's standing there with the tiles in her hands and she has to decide, so the theory owes her some test, not just a verdict.

  Two things I don't want. No scorecard of the usual candidate theories — I'll do that myself once I know what to ask for. And no name-dropping: I'm writing in a cabin with no signal, so no papers, no quotes, no famous thought experiments I'd have to look up, no "as so-and-so argued". Just the spec. If it turns out the spec is definately unsatisfiable as a set, that's honestly the most useful thing you could tell me, because then the book writes itself.
reasoning: |-
  Okay, the user is a novelist struggling with a philosophical problem about meaning in their book. They've created a species that communicates solely through marks on clay tiles, never interacting directly. Now they need to decide whether these marks actually refer to real-world things or are just patterns. 

  The core tension is between realism (marks correspond to reality) and patternism (marks are self-referential systems). The human character builds an AI ("reader") that generates convincing fake tiles, forcing the narrator to take a stance. The user provides two key examples: a "predator" term that actually describes vibrations, and a concept of "outside" that's never verified.

  Hmm... the user wants exactly five requirements formatted very specifically: MUST/NICE-TO-HAVE, tied to their fictional cases, with one marked as most restrictive, and one being a practical test. No theory names or citations - just pure criteria. They're clearly exhausted by abstract philosophy and want actionable constraints for their narrative.

  Breaking this down: First requirement must ground meaning in something beyond the system itself, using their "predator" example. Second needs to handle the "outside" concept where verification is impossible. Third is the kicker - about error detection, since their species survives despite "wrong" terms. Fourth must provide a real-world test for the human character. Fifth should address the AI successfully faking meaning.

  The vibration-predator disconnect suggests meaning must involve causal chains, not just survival value. The unverifiable "outside" concept forces us to accept that some meanings can't be checked. The survival despite error means we can't require perfect accuracy. The field test must be something doable with tiles and sensors. And the AI mimicry shows that behavior alone isn't enough.

  Biggest hurdle is probably the asterisked item - if meaning requires verifiable causal links, but their species has terms that seemingly don't have that (like "outside"), does that make those terms meaningless? That tension might be exactly what the novel needs. For the test, comparing tile reactions to sensor data seems viable - if "collapse warning" tiles correlate with actual tunnel stability readings, that's evidence of reference.

  Noticing the user emphasizes "two of them can't be had together" - likely referring to the verification requirement conflicting with unverifiable concepts. That's intentional though; their narrative thrives on that ambiguity. Might be why they said unsatisfiable specs would "write the book itself." Smart framing.

  ...Final list balances what philosophers call "causal theories of reference" with pragmatic constraints, while leaving room for the eerie plausibility of the AI's fakes. The field test item (#4) does heavy lifting by making it actionable rather than theoretical. User's frustration with abstract debates is palpable - this spec forces concreteness.
answer: |-
  Here are five requirements for your narrator's theory of meaning, formatted as requested:

  1.  **MUST distinguish patterns that track external states via causal chains from patterns that don't, even if both are treated identically within the system.** *Case:* The burrowers' "predator" mark triggers avoidance based solely on vibration patterns, not the actual predator's presence or absence. The Reader generates vibration-pattern sequences that trigger identical avoidance, but without any predator link. The theory must show why the burrowers' mark *was* about the vibration pattern (which *is* sometimes caused by the predator) while the Reader's *isn't* about the predator either, despite functional equivalence.
  2.  **MUST accommodate terms/concepts where direct verification is impossible for the users, without collapsing into pure patternism.** *Case:* The burrowers' mark for "what's outside" has been passed down mark-to-mark for millennia. No burrower can ever verify it against "outside." The theory must allow this mark to *mean* something beyond the system itself (e.g., an inferred cause for tunnel openings, rock types), even if potentially wrong, without requiring direct sensory confirmation.
  3.  **NICE-TO-HAVE account for systemic error without meaning collapse, but MUST explain why persistent error doesn't automatically invalidate reference.** *Case:* The "predator" mark misattributes the vibration source (it's really a seismic vent) but the avoidance behaviour remains beneficial (prevents collapse near vents). The theory must explain how the mark can still *refer* (e.g., to the vibration pattern itself, or the danger *signaled* by it) despite the misattribution, and why survival doesn't *guarantee* accurate reference to the intended external object.
  4.  **MUST provide a practical, empirical test the human character can perform using the tiles and sensor data.** *Case:* Your human needs to compare the *context of use* recorded by sensors (e.g., specific rock stress before a "collapse warning" tile appears, water flow before a "divert here" tile) to the Reader's *output context* and its *actual sensor-recorded outcomes*. If the Reader's "divert here" tiles appear in contexts *not* correlating with actual water flow needs (based on sensors), despite being accepted, the test flags potential non-reference or different reference. *(This is the field test item)*
  5.  **MUST explain why the Reader's patterns are accepted as meaningful by the burrowers *without* necessarily granting them the same kind of external reference.** *Case:* The Reader generates tiles using statistical correlations from the corpus. Burrowers treat them as sensible communications. The theory must explain this acceptance (e.g., pattern coherence, functional utility within the language game) *while* allowing that the Reader's marks might lack the *history of causal interaction* or *intentional grounding* that gives the burrowers' original marks their specific external connection, making them fundamentally different kinds of symbols. *(*\*\*\*)*

  **Key Conflict Called Out:** Requirement 1 (MUST track via causal chains) and Requirement 2 (MUST accommodate unverifiable terms) create tension. For the unverifiable "outside," what is the causal chain grounding it? If the causal chain is only the *history of mark-production* itself (e.g., marks copied when encountering unusual rock), does that collapse into patternism for *this specific term*? The theory must resolve this tension without abandoning either requirement entirely. Requirement 5 (\*\*\*) highlights why patternism is tempting but insufficient, as it rules out theories that *only* consider internal coherence or functional role within the system.
