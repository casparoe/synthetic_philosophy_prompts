  ### Scene: The Package Delivery

  Sarah stood in the office hallway, a small parcel tucked under her arm. She had just seen Alice—her colleague—step into her office and pull the door halfway shut behind her. Sarah had turned away then, distracted by a call from her own desk. Now, she was back, and the door was out of sight around the corner. *Alice is in*, she thought. *She always closes the door when she’s inside*. That meant the door would be shut now. Sarah needed to deliver the package. If the door was closed, she’d knock; if open, she could walk in. Knocking on an open door would feel foolish, but barging in unannounced if it was closed would be rude. She decided to knock.  
  As she rounded the corner, she saw it: Alice’s door stood slightly ajar. Alice looked up from her desk, surprised. “You could’ve just come in,” she said. Sarah flushed, realizing the door hadn’t latched. Alice had been in a rush, preoccupied with a deadline, and hadn’t pushed it closed.

  ---

  ### Compact Apparatus
  - **P**: Alice is in her office.  
    - **Method M for P**: Visual perception of Alice entering the office and initiating door closure, followed by a brief lapse in direct observation (grain: specific to the sensory act of witnessing entry and initial door movement, not including verification of full closure or continuous monitoring).  
  - **Q**: Alice’s office door is closed.  
    - **Entailment**: P entails Q necessarily given Alice’s established habit (if Alice is in her office, she closes the door). Sarah infers Q from P via deduction.  
  - **Method for Q**: Deductive inference from P (using the known entailment). If the method were described coarsely to include M (e.g., "perception-plus-deduction"), she would know Q, as M tracks P robustly. But at the fine grain specified, inference is distinct.

  #### Tracking Conditions
  1. **P (Alice is in her office)**  
     - True: Alice entered; Sarah saw it.  
     - Belief by M: Sarah believes P via visual perception of entry.  
     - If P false (nearest worlds): Alice never entered (e.g., she walked past to the break room). In these worlds, Sarah wouldn’t have seen her enter, so M wouldn’t deliver belief in P. (Condition 3: holds)  
     - If P true (nearby worlds): As actual; M delivers belief. (Condition 4: holds)  
     **Verdict**: Sarah knows P.  
     - *Key asymmetry*: Nearest ~P worlds (no entry) are closer than nearest ~Q worlds.  

  2. **Entailment (P → Q: If Alice is in, the door is closed)**  
     - Sarah knows this from long observation (Alice’s habit).  
     - Nearest worlds where entailment false: Alice is in (P true) but door open (Q false). These are the same as the ~Q worlds. They are not extremely remote (could happen if Alice is distracted), but are further than nearest ~P worlds. In them, Sarah still believes the entailment (her method—past experience—isn’t sensitive to one-off lapses).  
     **Verdict**: She tracks the entailment, but only because falsifying worlds are moderately remote (not substantive sensitivity). No embarrassment: this remoteness is ordinary (like forgetting keys), not skeptical.  

  3. **Q (Door is closed)**  
     - True: In actuality, door latched shut.  
     - Belief by method: Inference from P.  
     - If Q false (nearest worlds): Door open but Alice in (P true; e.g., Alice distracted, door unlatched). In these worlds, Sarah still believes P (via M, as she saw entry) and infers Q, so she believes Q. (Condition 3: fails)  
     - If Q true (nearby worlds): As actual; inference delivers belief. (Condition 4: holds)  
     **Verdict**: Sarah does not know Q.  
     - *Single feature doing the work*: Asymmetry in nearness—nearest ~Q worlds (P true, Q false) are farther than nearest ~P worlds (P false). If removed (e.g., if nearest ~Q were also nearest ~P), she’d know Q: in ~P/~Q worlds, M wouldn’t deliver P, so she wouldn’t infer Q.

  #### Unused Method and Action
  - **Unused method**: Sarah could have walked to the door to check. Its mere availability doesn’t restore knowledge—she didn’t use it, so it doesn’t affect the inference-based method for Q.  
  - **Neutralizing without negligence**: The scene shows her as reasonable (high stakes: social awkwardness; habit reliable; she’s briefly distracted). No need to mention the unused method explicitly.  
  - **Action**: Knocking is reasonable despite not knowing Q. Tracking theory separates knowledge from reasonable action: reasonableness depends on evidence and stakes (here, strong evidence for Q via P, and low risk of major harm).

  ---

  ### Strongest Attacks and Answers
  1. **Attack: Verdict is artifact of method grain.**  
     If M for P were coarser (e.g., "evidence Alice is in"), Sarah might not believe P in ~Q worlds (e.g., if door open, she’d doubt P). But at the specified fine grain (perception of entry), M still delivers P in ~Q worlds. Grain choice is defensible: it reflects how Sarah forms the belief (entry witnessed, closure assumed).  

  2. **Attack: This is skepticism without sci-fi—undetectable, unlikely falsifier destroys knowledge.**  
     It is not skepticism. Skepticism uses global, undetectable falsifiers (e.g., brains in vats) that undermine all knowledge. Here, the falsifier (door ajar) is local, detectable (she could have seen it), and ordinary. It exploits a contingent habit, not a radical doubt. Closure fails non-skeptically because tracking is method-relative.  

  3. **Attack: Knowledge of P and entailment should transfer tracking to Q.**  
     Tracking doesn’t transfer. The method for Q (inference) must satisfy its own conditions. In nearest ~Q worlds, P is true, so inference still produces belief in Q—it doesn’t "inherit" P’s tracking because it operates in worlds where P’s method isn’t challenged.  

  **Honest assessment**: Attack 2 partially succeeds in highlighting a tension, but it doesn’t fully undermine the case. Tracking theory *does* allow non-skeptical closure failure by requiring method-specific sensitivity, and this case minimizes skepticism by using an ordinary, non-global falsifier. Every closure failure on tracking will involve *some* remote possibility, but it only becomes skeptical if it’s undetectable *and* pervasive. Here, it’s detectable and local, so it’s not skepticism—just a strict view of knowledge. Attack 3 fails decisively; attacks 1 and 2 are defused.

  ---

  ### Craft Notes for the Scene  
  - **Reader attributions**:  
    - Show Sarah’s confidence in P (sensory detail: "saw Alice step into her office and pull the door halfway shut").  
    - Make the deduction natural (internal monologue: *She always closes the door... so it would be shut*).  
    - Avoid mentioning the unused method (checking the door) or the falsifier (door ajar) until the reveal, to prevent reader doubt from arising prematurely.  
  - **Character’s awareness**:  
    - If Sarah considers the remote possibility (door open), it might make those worlds epistemically closer, potentially restoring knowledge (if she dismisses it negligently). The scene avoids this—she doesn’t think of it, so the verdict holds.  
    - **Narration must not name the possibility** (e.g., don’t say "Sarah didn’t consider the door might be open"). Naming it makes it salient, bringing it "closer" and risking reader attributing negligence, which would spoil the effect.  
  - **Where to cheat**:  
    - The novelist must subtly withhold the falsifier until the reveal and avoid implying Sarah is forgetful or irrational. Stress her competence (e.g., "Alice always closes the door" as established fact) and the distraction as mundane (a work call). This preserves the asymmetry: the reader grants P and the deduction, but the remoteness of the ~Q worlds feels natural only in hindsight.  
  - **Last resort**: If neutrality is impossible, emphasize the habit’s reliability to make the falsifier seem genuinely remote, then subvert it with a plausible, human cause (distraction).
