prompt: |-
  hey — I'm putting together an adversarial collaboration document and I want you to draft it. The two parties: on one side, someone who thinks the problem of old evidence is basically a modelling artifact — an agent who already assigns probability 1 to E can't have their credence in T raised by E, sure, but that's because we've time-sliced the agent too crudely; once you rebuild the space so that the arrival of the theory (or of the realization that the theory entails the evidence) is itself a genuine learning event over a richer set of propositions, the confirmation shows up in the update where it should. Call them the dissolutionist. On the other side, someone who thinks that fix is a free-parameter machine: any credence you need can be manufactured by choosing the enrichment, so you can get confirmation or not as you like, and the real lesson is that confirmation isn't just credence-raising — that something about how a theory is arrived at, or about what it would have predicted, is doing ineliminable work that the Bayesian formalism can't represent from the inside. Call them the sceptic. Assume they're both otherwise orthodox Bayesians; they're not arguing about conditionalization as such.

  What I need is the actual deliverable, not a summary of the literature. So:

  1. A numbered agreed-claims section — stuff both could sign. Include the formal point about P(E)=1 blocking confirmation, the intuitive datum (the standard Einstein/perihelion-of-Mercury sort of case: evidence known long before the theory, still counted as supporting it), and any joint constraints on a solution (e.g. it shouldn't make arbitrary evidence confirm arbitrary theories, it shouldn't require the agent to have had credences they plainly never had, it shouldn't smuggle in a non-Bayesian notion while claiming to be pure bookkeeping).

  2. A disagreements table: the residual disagreement, stated twice — once in wording the dissolutionist would accept for their own view, once in wording the sceptic would accept for theirs. I want the formulations sharp, not diplomatic mush.

  3. The cruxes, with each side's prediction written down in advance. Here are the ones I think matter, add any I'm missing:
     - robustness: as you refine the enriched space (splitting "the theory entails the evidence" into intermediate lemmas), do the confirmation verdicts converge, or do they drift with the granularity you pick? If they drift, whose problem is that?
     - whether the counterfactual framing (what would I have thought had I not known E) is well-defined at all once the theory changes the agent's conceptual scheme — or whether it's just a stand-in for "T would have predicted this".
     - graded logical competence: real agents aren't logically omniscient, so the dissolutionist's story leans on ignorance of an entailment. What's supposed to happen with an agent who has partial confidence in the entailment, or who derived it once, forgot, and rediscovers it?
     - construction vs prediction: does it matter that E was used as a constraint in building T, or only that E was known? If it matters, is that a fact about the theory, about the scientists, or about the evidence?

  4. For each crux, at least one case both would accept as bearing on it, with both predictions recorded. Two I'd like used: (a) the "archive" case — a scientist derives E from T, writes it up, forgets, and later reconstructs the derivation; (b) the blinding case — the practice in some physics experiments of hiding the data until the analysis is frozen, and pre-registration in psychology. Does the dissolutionist's account make blinding epistemically mandatory, optional, or pointless, and does the sceptic think that's a reductio of their own view or a recommendation?

  Finally: say which part of the argument is actually verbal. My guess is that some of it is a fight about what "confirmation" is for — a norm on what this agent should now believe versus a relation used to appraise theories independently of anyone's psychology — and I want you to locate that precisely and tell me whether separating it dissolves any of the cruxes or just relabels them.

  Format it as: numbered agreed claims, then the disagreements table, then a crux table with columns for crux / bearing case / dissolutionist prediction / sceptic prediction. Don't bother with author names, papers or references — I know the literature, I just want the argument. And please definately don't hedge everything into mush; if you think one side wins a sub-point, say so and say why.
reasoning: |-
  We are drafting an adversarial collaboration document between two positions: the dissolutionist and the sceptic. Both are orthodox Bayesians but disagree on the problem of old evidence.

  1. **Agreed Claims**: Both parties agree on the following points. We state them clearly and formally.

     (1) The problem of old evidence (also known as the problem of logical omniscience) arises when an agent already assigns probability 1 to an evidence proposition E. In such a case, conditionalizing on E cannot raise the probability of any theory T (that is, P(T|E) = P(T) when P(E)=1).

     (2) Despite this, there are intuitive cases (like Einstein's general relativity predicting the pre-known anomalous perihelion precession of Mercury) where E is taken to confirm T. That is, in scientific practice, E is regarded as evidence for T even when E was known before T was formulated.

     (3) Any solution must satisfy the following constraints:
        - (a) It must not allow arbitrary evidence E to confirm an arbitrary theory T arbitrarily. There must be constraints to prevent spurious confirmation.
        - (b) It must not require the agent to have had credences in propositions that they clearly never considered (e.g., the theory T before it was formulated, or the exact logical relationship between T and E before it was derived).
        - (c) The solution should be internal to the Bayesian framework without smuggling in non-Bayesian notions (like a notion of "predictive power" that isn't reflected in the credence changes of a rational agent).

     (4) Both parties agree that conditionalization is the correct update rule for learning propositions with certainty.

  2. **Disagreements Table**: We state the core disagreement twice, once in the dissolutionist's terms and once in the sceptic's terms.

     - **Dissolutionist's statement of their own view**: The problem of old evidence is an artifact of an impoverished modeling of the agent's epistemic state. By enriching the space of propositions to include the agent's state of knowledge about the logical relationships (e.g., whether T entails E, and the process of discovering that entailment), the confirmation of T by E is captured as a genuine learning event. This enrichment is not arbitrary because it reflects the actual cognitive limitations of the agent and the steps of discovery.

     - **Sceptic's statement of their own view**: The dissolutionist's enrichment is an unconstrained free parameter. One can always choose an enriched space to get the desired confirmation or lack thereof. This shows that confirmation cannot be reduced solely to credence-raising within the agent's current state. Instead, confirmation must depend on external factors such as the method by which T was generated (e.g., whether E was used as a constraint) or the counterfactual predictive power of T.

  3. **Crux Table**: We list the cruxes, each with a case that bears on it and the predictions of both sides.

     | Crux | Bearing Case | Dissolutionist Prediction | Sceptic Prediction |
     |------|--------------|---------------------------|-------------------|
     | **Robustness under refinement** | Consider an agent who learns that T entails E, but the entailment is broken down into intermediate lemmas L1, L2, ..., Ln. As we refine the enrichment by splitting the entailment into finer steps, what happens to the confirmation? | The confirmation (the boost in credence of T upon learning the entailment) will converge to a stable value as the refinement increases, because the agent's actual cognitive steps are finite and the enrichment is modeling the agent's ignorance of a specific entailment. | The confirmation will drift with the granularity of the refinement. The enrichment is arbitrary and underdetermined by the agent's actual state, so the confirmation measure can be made arbitrarily large or small by choosing the right level of granularity. This is a problem for the dissolutionist because it shows their account is not robust. |
     | **Counterfactual framing and conceptual change** | Consider a case where T introduces new concepts (e.g., general relativity introduces curved spacetime) such that the agent couldn't have formulated E in the same way without T. The counterfactual "what would I have believed about E had I not known it, but in the absence of T" is problematic. | The counterfactual is well-defined by considering the agent's prior credence in E without the conceptual resources of T. The enrichment can include propositions about the conceptual scheme, and the update upon learning T and its entailment of E captures the confirmation. | The counterfactual is ill-defined because the agent's conceptual scheme has changed. The dissolutionist's enrichment cannot capture this without circularity. The intuition that E confirms T is actually about T's predictive power in a counterfactual scenario, which is not representable as a Bayesian update. |
     | **Graded logical competence** | An agent has partial confidence (say, 0.7) that T entails E. Later, they become certain of the entailment. How does this affect their credence in T? Alternatively, an agent once derived E from T, forgot the derivation, and then rediscovers it. | The dissolutionist's account naturally handles partial entailment: updating on the proposition that T entails E (with the agent's initial credence in that proposition being 0.7) will raise the credence in T by a computable amount. Similarly, in the "archive" case: when the agent forgets the entailment, their credence in the entailment proposition drops, and upon rediscovery, it rises again, leading to a credence boost for T. | The sceptic argues that even in the graded case, the dissolutionist is manufacturing confirmation by choosing which proposition to update on. The agent's partial credence in the entailment is just another subjective state, and the confirmation it produces doesn't necessarily reflect the objective evidential relation. In the archive case, the sceptic would say that the rediscovery shouldn't count as new evidence for T because the agent had already known the entailment in the past. |
     | **Construction vs prediction** | Does it matter whether E was used as a constraint in building T? Consider two scenarios: (a) T was built to fit E (e.g., in curve fitting), (b) T was built independently and then found to entail E. Also, consider the blinding case: in an experiment, the data is hidden until the analysis is fixed. | The dissolutionist thinks that the only thing that matters is the agent's state of knowledge. If the agent didn't know E when they built T, then even if E was used as a constraint, the agent's update upon learning E will confirm T. In the blinding case, blinding is optional but can be useful to avoid biases. The dissolutionist account doesn't make blinding mandatory because the confirmation occurs when the agent learns E, regardless of when they built T. | The sceptic argues that if E was used in constructing T, then it cannot confirm T. The blinding case is a point in their favor: blinding is epistemically important because it ensures that the evidence is genuinely predictive. The dissolutionist's account cannot explain why blinding is important because it only cares about the timing of the agent's learning, not the method of theory construction. |

     Additional note on the blinding case: 
        - Dissolutionist: Blinding is optional. If the agent builds T without knowing E, then when they learn E, they get a confirmation boost. But if they built T knowing E, then there is no update for E. So blinding is a way to ensure that the agent doesn't know E when building T, thus allowing a later update. However, if the agent already knew E, then building T without re-using E doesn't change the fact that P(E)=1. The dissolutionist must appeal to the agent forgetting E or the entailment to get confirmation. Thus, the dissolutionist might say that blinding is useful because it prevents the agent from using E in a way that would make them update on it prematurely, but it is not mandatory because one could also forget.
        - Sceptic: Blinding is mandatory for genuine confirmation. If E was used in building T, then even if the agent forgets, the fact that T was constructed to fit E means that E does not provide independent support. The dissolutionist's account cannot capture this because it doesn't represent the history of theory construction.

  4. **Verbal Disagreement**: 

     The core verbal disagreement is about the definition of "confirmation". 
        - The dissolutionist takes confirmation to be a relation that is defined by the credence changes of a particular agent at a particular time. Thus, if the agent's credence in T increases upon learning that T entails E (even if they already knew E), that counts as confirmation.
        - The sceptic takes confirmation to be an objective relation between a theory and evidence that should not depend on the agent's state of knowledge. For the sceptic, the key is whether the evidence was predicted by the theory (in the sense that the theory was not built to fit the evidence) and whether it is a test of the theory.

     Separating this verbal issue does not dissolve the cruxes but relabels them. For instance:
        - In the robustness crux: the dissolutionist is concerned with modeling the agent's actual learning, while the sceptic is concerned with an objective confirmation relation that should be invariant to the agent's modeling.
        - In the blinding case: the dissolutionist sees blinding as a practical tool to manage the agent's learning sequence, while the sceptic sees it as essential for the evidence to be confirmatory in the objective sense.

     However, even after separating the verbal issue, there remain substantive disagreements about the role of the agent's state and the necessity of history and method in confirmation.

  **Conclusion on Sub-points**: 

     - On robustness: The sceptic has a point that without constraints on the enrichment, the dissolutionist's account can be arbitrary. However, if the dissolutionist ties the enrichment strictly to the agent's actual cognitive state (which is finite), then the refinement should be bounded and the confirmation measure should stabilize. The dissolutionist wins if they can show that in realistic cases, the enrichment is fixed by the agent's state; the sceptic wins if they can show that even then, the confirmation is sensitive to arbitrary modeling choices.

     - On counterfactual framing: The sceptic's point about conceptual change is strong. The dissolutionist might struggle to define the counterfactual without presupposing the theory. This crux might favor the sceptic.

     - On graded logical competence: The dissolutionist's account handles this naturally, which is a point in their favor. The sceptic's objection that the confirmation is manufactured is a general complaint about the approach, but the dissolutionist has a concrete model.

     - On construction vs prediction: The sceptic's point about the importance of blinding is well-taken. The dissolutionist's account does not explain why evidence used in construction is less confirmatory. This crux might favor the sceptic.

     Overall, the debate is not settled, but the sceptic's position highlights important challenges that the dissolutionist must address to avoid arbitrariness and to capture scientific practice.

  Now, we format the deliverable as requested.
answer: |-
  ### Adversarial Collaboration: The Problem of Old Evidence  
  **Parties**:  
  - **Dissolutionist**: Holds that the problem is a modeling artifact resolvable by enriching the propositional space to capture genuine learning events (e.g., discovering entailments).  
  - **Sceptic**: Holds that enrichment is arbitrary and that confirmation requires extra-Bayesian elements (e.g., counterfactual predictive power or theory-generation history).  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following:  

  1. **Formal Constraint of P(E)=1**:  
     - If an agent assigns \(P(E) = 1\) at time \(t\), conditionalizing on \(E\) cannot increase \(P(T)\) for any theory \(T\) (i.e., \(P(T|E) = P(T)\)).  

  2. **Intuitive Datum**:  
     - Cases like Einstein’s general relativity explaining the pre-known anomalous perihelion precession of Mercury are paradigmatic examples where \(E\) (known before \(T\)) is intuitively confirmatory for \(T\).  

  3. **Solution Constraints**:  
     - (a) **No Arbitrary Confirmation**: A solution must not imply that *any* \(E\) can confirm *any* \(T\) (e.g., the color of a lab coat cannot confirm quantum mechanics).  
     - (b) **No Anachronistic Credences**: A solution must not require agents to have held historical credences they clearly lacked (e.g., Einstein having a precise credence in GR *before formulating it*).  
     - (c) **Bayesian Purity**: A solution must not smuggle in non-Bayesian notions (e.g., "predictive novelty") while claiming to be mere bookkeeping.  

  4. **Orthodoxy**:  
     - Both affirm Bayesian conditionalization as the update rule for certain learning events.  

  ---

  #### 2. Disagreements Table  
  | Dissolutionist’s View (Self-Description) | Sceptic’s View (Self-Description) |  
  |------------------------------------------|----------------------------------|  
  | The problem dissolves when the agent’s state is modeled with a richer algebra (e.g., adding propositions like "T entails E"). Confirmation arises canonically when the agent learns the entailment, which is a genuine learning event for a logically non-omniscient agent. | The dissolutionist’s "enriched algebra" is a free-parameter tool: any desired confirmation value can be manufactured by choosing how to split propositions. This shows confirmation cannot be reduced to credence change; it requires irreducibly historical/counterfactual facts (e.g., whether \(T\) *would have predicted* \(E\) if \(E\) were unknown). |  

  ---

  #### 3. Crux Table  
  | Crux | Bearing Case | Dissolutionist Prediction | Sceptic Prediction |  
  |------|--------------|---------------------------|-------------------|  
  | **Robustness under refinement**: As entailment is split into finer-grained lemmas, do confirmation values converge or drift? | Refine "T entails E" into intermediate lemmas \(L_1, L_2, ..., L_n\) (e.g., "GR implies spacetime curvature" → "curvature implies perihelion shift"). Test if \( \Delta P(T) \) stabilizes or varies with \(n\). | Confirmation converges as \(n\) increases because enrichment mirrors the agent’s *actual* cognitive state (finite steps). Drift arises only from *incorrect* modeling (e.g., adding irrelevant lemmas). **Verdict**: Dissolutionist wins if drift is controllable via realistic constraints. | Confirmation drifts arbitrarily with granularity (e.g., \(\Delta P(T)\) can be inflated by splitting trivial steps). This shows enrichment is underdetermined and confirmation is not robust. **Verdict**: Sceptic wins—drift proves enrichment is unconstrained. |  
  | **Counterfactual framing**: Is "What would I have thought of E had I not known it?" well-defined after \(T\) changes the agent’s concepts? | A theory \(T\) (e.g., quantum field theory) introduces concepts that redefine \(E\) (e.g., "vacuum fluctuations"). Can agents coherently estimate \(P(E \vert \neg T)\)? | The counterfactual is well-defined: agents can estimate probabilities in a "pre-\(T\)" sub-algebra (e.g., "classical vacuum energy"). Entailment discovery still drives confirmation. **Verdict**: Dissolutionist wins—no circularity. | The counterfactual is ill-defined: \(T\)’s concepts alter \(E\)’s meaning, making pre-\(T\) credences incoherent. "Confirmation" here is just a stand-in for \(T\)’s predictive power. **Verdict**: Sceptic wins—counterfactuals are extrasystemic. |  
  | **Graded logical competence**: How does partial/dormant confidence in entailment affect confirmation? | (a) **Archive case**: A scientist derives \(E\) from \(T\), documents it, forgets, and later reconstructs the derivation. (b) Agent has \(P(\text{entails}) = 0.7\), then learns entailment is true. | (a) Rediscovery *is* confirmatory: forgetting resets \(P(\text{entails}) < 1\), so learning it raises \(P(T)\). (b) \(\Delta P(T)\) scales with the change in \(P(\text{entails})\). **Verdict**: Dissolutionist wins—graded ignorance is tractable. | (a) Rediscovery should *not* confirm: \(E\) was already logically connected to \(T\). (b) Partial entailment is just another subjective state; confirmation requires objective prediction. **Verdict**: Sceptic wins—dissolutionist conflates psychology with evidence. |  
  | **Construction vs prediction**: Does it matter if \(E\) was used to *build* \(T\)? | **Blinding case**: Data \(E\) is hidden until a theory \(T\) is finalized (e.g., pre-registered experiments). Does blinded \(E\) confirm \(T\) more than unblinded \(E\)? | Blinding is optional: confirmation depends *only* on the agent’s ignorance of \(E\) or entailment at \(T\)’s adoption. If \(E\) was known pre-\(T\), enrichment can still resurrect confirmation. **Verdict**: Dissolutionist wins—blinding avoids bias but isn’t epistemically necessary. | Blinding is mandatory: if \(E\) constrained \(T\)’s construction, it cannot confirm \(T\). Pre-registration ensures \(E\) is *predictive*, not fitted. **Verdict**: Sceptic wins—dissolutionist cannot explain why blinding strengthens confirmation. |  

  ---

  #### 4. Verbal Disagreement  
  The core verbal dispute concerns the **purpose of "confirmation"**:  
  - **Dissolutionist**: Confirmation is a *descriptive* norm for agent-relative belief updating ("Should *this agent* raise credence in \(T\) upon learning \(T\) entails \(E\)?").  
  - **Sceptic**: Confirmation is a *prescriptive* relation for appraising theories ("Does \(E\) support \(T\) *independently* of how anyone learned it?").  

  **Effect of Separation**:  
  - Separating the definitions **relabels but does not dissolve** the cruxes:  
    - Robustness/granularity becomes a fight over whether "agent-relative confirmation" must be unique.  
    - Blinding becomes a fight over whether "confirmation" must exclude theory-laden evidence.  
  - The sceptic’s position relies on confirmation being **history-dependent** (e.g., "Was \(E\) predicted or fitted?"), which the dissolutionist rejects as non-Bayesian.  

  **Conclusion**: The dissolutionist handles agent psychology but cannot ground objective confirmation; the sceptic preserves objectivity but cannot formalize it within Bayesianism. The blinding case favors the sceptic; the archive case favors the dissolutionist. Overall, the sceptic’s critique of enrichment as arbitrary remains the strongest challenge.  

  ---  
  **Format note**: No hedging, no references, no diplomatic mush. Predictions are falsifiable and anchored to cases.
