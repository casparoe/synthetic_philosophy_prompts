  ### **Residue Report**  
  #### **Clean Mappings (No Distortion)**  
  - **Convergence of formalisms:** Proving that λ-calculus, Turing machines, and register machines compute the same partial functions is routine (Church-Turing equivalence theorems).  
  - **Interface thesis distinction:** Batch vs. interactive computation is fundamental (e.g., partial functions vs. reactive systems). Contextual equivalence for termination versus bisimulation for traces are distinct.  
  - **Compiler correctness:** Preservation of observable behavior under compilation directly maps to proving physical systems implement only Turing-computable functions.  

  #### **Mappings with Distortion**  
  - **Core claim "human procedure":**  
    - *Distortion:* Replaced with **benchmark validation**. You test a formalism against a corpus of known algorithms (e.g., implementing Prim's algorithm in your language). This is empirical but local to your corpus, unlike the universal claim about "any human procedure."  
    - *Nearest substitute:* Differential testing against a reference implementation (e.g., run the same algorithm in Python and your interpreter; compare outputs).  
  - **Stronger claim "physical process":**  
    - *Distortion:* Primitive extensions are banal, so the debate shifts to the **implementing runtime**. If physics is the runtime, your vocabulary assumes it is Turing-equivalent—but this is exactly the disputed claim.  
    - *Nearest substitute:* Prove that a primitive's implementation (e.g., an analog hardware model) compiles to a Turing-equivalent substrate.  

  #### **No Counterpart**  
  - **Epistemic status (informal practice):** Claims about "intuitive computability" have no formal home.  
    - *Defect in your vocabulary:* Formalism-first design avoids grounding in pre-theoretic intuition.  
    - *Usable substitute:* **Validation against benchmark corpus** + **contextual equivalence proofs**. If all benchmarks run correctly and your formalism is proven equivalent to a Turing-complete one, the thesis holds operationally.  
  - **Empirical nature of the stronger thesis:** Asserting that no physical system breaks Turing-equivalence is an empirical claim. Your framework cannot settle this—it only checks specific implementations.  

  #### **Hunch Verdict**  
  Your hunch **holds** and is central:  
  - Adding undefinable primitives (e.g., `syscall`) is trivial in language design.  
  - The debate's substance is whether the **runtime/environment implementing the primitive** is Turing-equivalent.  
  - This does not concede the point—it forces explicit modeling of the "physical substrate" as part of the language's operational semantics.  

