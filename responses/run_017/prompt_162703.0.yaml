  - Modal properties don't map cleanly.
  - Coincidence without identity is hard: two rows for the same spacetime region? How to enforce they share all parts? We might have a single table for matter, and then two views (lump and statue) with different constraints? But then they are the same row, so same identity.
  - Bare numerical difference (as in twin castings) might force surrogate keys, which are arbitrary. But is that a problem? Camp 1 might say: yes, the difference is primitive. Camp 2 and 4 might avoid it.

