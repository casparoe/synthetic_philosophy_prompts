  - **Object:** A row in a base table, identified by a primary key (natural or surrogate). *Strain:* Forces a commitment to what exists as what is in base tables. Views are not objects.
  - **Persistence Condition:** Defined by the primary key: if the key remains, the object persists through updates. Deletion (hard or soft) ends persistence. Valid-time in bitemporal tables models existence in time. *Strain:* Reduces persistence to key continuity, ignoring metaphysical criteria.
  - **Modal Property:** Not directly expressible. Approximated by CHECK constraints (necessary properties) or schema evolution rules (what changes are allowed). *Strain:* Modal properties are about possibilities, not actual DB states.
  - **Constitution:** Two base tables with a 1:1 relationship and same spatiotemporal columns, but different keys and constraints. *Strain:* Forces two rows for one region, which may be seen as two things.
  - **Coincidence:** Two rows (from different tables) with identical spatiotemporal and matter columns at a time. *Strain:* Requires denormalization or redundancy.
  - **Numerical Identity:** Primary key equality within a table. Across tables, foreign keys with UNIQUE constraint can simulate identity but are not identity. *Strain:* Cannot have two distinct objects with the same key in one table; across tables, they are distinct rows.
  - **Sortal:** A view definition that selects and projects from base tables, possibly with its own criteria. *Strain:* Views don't have primary keys; identity under a sortal becomes view-dependent, not base.
  - **Grounding:** The base table row that makes a view row true. *Strain:* Implies base tables are ontologically prior.

