  **3. Two space-time worms (4D):**
  - Clean: Use bitemporal tables (valid-time and transaction-time) or a table with time slices. Each object (statue and lump) is a row that spans a time interval. The statue row has a time interval from sculpting to destruction; the lump row from before sculpting to after. At a time t, they share the same spatial and matter columns — but they are two different rows with different time intervals. Primary key might be a surrogate key plus time? Or separate rows for each time slice? Then at time t, two rows (one for statue, one for lump) have the same matter and location. This maps cleanly.
