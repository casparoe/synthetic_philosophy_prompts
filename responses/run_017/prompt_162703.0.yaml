  - **Modal Property:** What could happen to the object. This is tricky — databases are actual. We might use CHECK constraints for necessary properties, but they are only about what is allowed in the DB, not about metaphysical possibility. Or we might use schema evolution to model "what if" changes, but that's not the same.

