  - **Numerical Identity:** Primary key equality. But: if two rows have the same key, they are the same. If different keys, different. This forces a choice: either statue and lump have same key (then one thing) or different keys (two things). But in metaphysics, constitution says they are two but coincident. How to have two keys for the same spacetime region? We might have two tables with a foreign key between them, but then they are linked, not identical.

  - **Sortal:** A view definition? A table? If a view, then counting depends on the view. But in a base table, we count by primary key. So if we have one base table for matter, and then a view for statues, then when we count by base table we get one object (lump), by view we get one statue. But then the view is not an object in the same sense.

  - **Grounding:** What makes it true that a statue exists? In DB, it's the existence of a row in the statue table or satisfying the view. But if we use views, then we have no base table for statues — so camp 4 might say: only the matter table is base, statue view is derived.

