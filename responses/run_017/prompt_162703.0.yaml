  - Inexpressible: Why are they two? The modal differences are built into the time extent — the lump row exists longer. But modal properties (what could have happened) are not in the DB.

  **4. No statue at all (eliminativism):**
  - Clean: Only one base table: `matter` or `particle` or `atom`. Each row is a bit of matter. Then a view `statue_view` that aggregates matter when arranged statue-wise. The statue is not a row in a base table; it's a derived view. Persistence of the statue is just the view being non-empty at different times. This maps very cleanly.
