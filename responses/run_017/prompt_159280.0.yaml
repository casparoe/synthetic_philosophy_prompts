prompt: |-
  I started a new job about three months ago on the safety team at a self-driving car company, and somehow I got handed the spreadsheet where our ethics lead (Priya) logs her verdicts on "unavoidable collision" test scenarios. Now I have to write up the recommendation for next week's design review, my name goes on it, and legal reads it. I've been reading about the doctrine of double effect on my own but I definately can't get it to line up with her actual calls. Here's what's in the sheet:

  - Divert the car from 5 pedestrians onto a trajectory that kills 1: permissible.
  - Push a heavy person into the car's path so his body stops it: impermissible.
  - Rotate the car so it heads at 1 instead of 5, where the 1's death does nothing to help — the car stops on its own: permissible.
  - The only way to stop is to hit 1, whose body is what brings the car to rest: impermissible. Her note says he's functioning as part of the braking mechanism.
  - Hospital backup power: reroute electricity to keep 5 patients alive, which kills 1 ventilator patient in another wing: impermissible. Note says "withdrawing support, not the same as the switch."
  - Precision strike on a munitions plant, proportionate, civilian deaths foreseen: permissible.
  - Same expected death count where the civilians dying is the point: impermissible.
  - Sacrificing our own passenger to save 5 pedestrians: permissible, but flagged "reasons unclean."

  The new case I have to write up: our car's brakes fail because of a firmware bug we shipped (not negligence exactly — it passed our tests). It's heading at five pedestrians. The only other trajectory mounts a sidewalk and kills one person at a bus shelter who is completely safe otherwise. She isn't what stops the car — the shelter frame is, she's just in the crush zone — and the numbers are proportionate. Two wrinkles: the threat exists only because of us, and our published safety policy says the car will never mount a sidewalk when pedestrians are present.

  What would Priya say? I need one call, not a menu: give me the verdict, the rule you think she's actually running, which of her past verdicts that rule handles awkwardly, which precedent is the closest analogue, and how confident you are. If you think her likely verdict is the wrong thing to put in the policy, say that plainly too. Last thing: I can sneak exactly one extra scenario into the review — tell me which single case would tell the two candidate rules apart.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a safety team member at a self-driving car company, dealing with ethics verdicts on unavoidable collision scenarios. They need to predict Priya's decision on a new case involving a firmware bug causing brake failure, with the car heading toward five pedestrians. The alternative is mounting a sidewalk to kill one person at a bus shelter, which violates their published policy. 

  First, I'll analyze Priya's past verdicts to identify patterns. Her rulings show a clear distinction between permissible and impermissible actions. For example, diverting the car to kill one instead of five is allowed, but using a person as part of the braking mechanism isn't. This suggests she's applying a version of the Doctrine of Double Effect (DDE), focusing on intention and the distinction between intended harm and foreseen harm.

  Key points from past cases:
  - Diverting the car to save five by killing one: permissible (harm as a side effect).
  - Using a person to stop the car: impermissible (intending harm as a means).
  - Sacrificing the passenger to save pedestrians: permissible but flagged, indicating unease about intention.

  The new case involves diverting onto a sidewalk, killing one person who's incidentally in the crush zone. The harm isn't intended as a means to stop the car—the shelter frame stops the car, and the person is collateral damage. However, the threat is caused by the company's firmware bug, and diverting violates their safety policy. 

  Applying DDE:
  - Intended effect: Save five by changing trajectory.
  - Foreseen harm: One death in the crush zone.
  - Not using the person as a means (their body isn't stopping the car).
  - But the action violates policy, which Priya might view as introducing a new "intentional" element to uphold societal trust.

  Contradictions in past rulings:
  - The ventilator case (impermissible) seems similar to DDE-allowed cases but was rejected. Priya might be adding a layer about institutional roles or specific duties.
  - The "reasons unclean" flag on sacrificing the passenger shows she's wary of appearing to intend harm, even when it's a side effect.

  For the new case, Priya would likely rule "impermissible" due to the policy violation, treating it as an intentional breach. The closest precedent is the ventilator case, where institutional duties overrode DDE. But the sidewalk diversion is more like the permissible cases where harm is a side effect. This inconsistency highlights a tension in her approach.

  Recommended test case: A scenario where policy violation is the only difference from a permissible case (e.g., diverting onto a sidewalk with no pedestrians, but policy forbids it anyway). If Priya forbids this, it confirms policy adherence trumps DDE. If she allows, it shows DDE is primary. This test clarifies her underlying rule.
answer: |-
  Based on Priya's past verdicts, here's the breakdown for your new case and the underlying rule:

  1.  **Verdict for the New Case: IMPERMISSIBLE**
  2.  **The Rule Priya is Actually Running:** A hybrid rule combining a **Strict Doctrine of Double Effect (DDE)** with a **Strong Prohibition on Using Persons as Means or Instrumentalizing Harm**, further constrained by **Institutional/Role-Based Duties and Public Trust Commitments (like published policies)**. Harm is *only* permissible if:
      *   The *intended act itself* is good (saving lives).
      *   The bad effect (death/harm) is *not intended* (neither as an end nor as a *means* to the good effect).
      *   The good effect does *not result directly from the bad effect* (the bad effect isn't the *mechanism* for the good).
      *   The good effect *sufficiently outweighs* the bad effect (proportionality).
      *   The agent *does not violate specific institutional duties or public commitments* (like a published safety policy) in performing the act.

  3.  **Past Verdict Handled Awkwardly:**
      *   **The Ventilator Case (IMPERMISSIBLE):** This is the most awkward fit. Rerouting electricity away from Patient 1 to save 5 seems like a classic DDE-permissible case: intended good (saving 5), unintended bad (Patient 1 dies), good doesn't come *through* the bad (Patient 1's death isn't the *mechanism* saving the 5; it's the rerouted electricity). Priya's note "withdrawing support, not the same as the switch" suggests she's importing a medical ethics distinction (killing vs. letting die) that doesn't cleanly map onto DDE or the other cases. Her rule struggles here because this case structurally resembles the *permissible* divert-from-5-to-1 cases more than the *impermissible* body-as-braking cases. The institutional context (hospital) might be triggering a stronger "do no harm/duty of care" interpretation overriding pure DDE.

  4.  **Closest Analogue Precedent:** **The Published Policy Element + Institutional Role:** While the *harm* aspect resembles the permissible diversions, the **violation of the published safety policy** ("car will never mount a sidewalk when pedestrians are present") makes the **Hospital Ventilator case** the closest analogue *in terms of reasoning*. In both cases:
      *   DDE logic might *prima facie* allow the action (save more, harm unintended side-effect).
      *   However, Priya invokes a higher-order rule related to the *agent's role and commitments*: the hospital's duty not to actively withdraw support from a specific patient under its care, and the car company's duty not to violate its explicit, public safety promise. The act itself breaches a core institutional duty/trust, making it impermissible *regardless* of the net lives saved. The "threat exists only because of us" reinforces this institutional responsibility angle.

  5.  **Confidence Level:** **High (80%)**. The policy violation is the decisive factor aligning perfectly with the Ventilator precedent reasoning. The fact that the harm is incidental (like the permissible rotations) rather than instrumental (like the body-braking) is likely overridden by the breach of trust. The "threat exists only because of us" further strengthens the institutional duty angle.

  6.  **Is this the Wrong Thing for the Policy?** **Yes.** While Priya's logic might focus on trust and liability avoidance, declaring the diversion *impermissible* in this scenario likely leads to a *worse* ethical outcome: 5 preventable deaths instead of 1. The policy was likely intended for *normal operation*, not catastrophic failure scenarios where *all* choices involve breaking a promise or causing harm. Basing the verdict *solely* on policy adherence in an unavoidable collision caused by a system failure prioritizes legal defensibility over minimizing overall harm. A better policy would explicitly address failure modes and allow proportionate harm reduction *even if* it violates a normal-operational rule, provided the harm remains incidental and unintended.

  7.  **The One Extra Scenario to Sneak In (To Test the Rules):**

      **Scenario:** Identical to the new case (brake failure, heading towards 5, diverting onto sidewalk kills 1 incidentally due to shelter impact), **BUT** the published safety policy *does not mention sidewalks at all*. Everything else is the same (threat caused by us, etc.).

      *   **Why this Scenario?** It cleanly isolates the **published policy violation** as the decisive factor.
      *   **Testing the Rules:**
          *   If Priya says **PERMISSIBLE**, it confirms the core rule is DDE + Anti-Instrumentalization. The previous impermissible verdict *was* driven by the policy breach.
          *   If Priya says **IMPERMISSIBLE**, it reveals a deeper inconsistency or an additional strong factor (e.g., creating a *new* threat/danger zone where none existed, or an absolute duty to minimize corporate-caused harm regardless of policy). This would make the Ventilator case even more awkward and suggest her rule is less coherent than initially thought, potentially overly focused on liability or a strict "first do no harm (to new victims)" principle. Her verdict here would force a re-evaluation of the permissible diversion cases where a *new* danger path is chosen.

  **In Summary:** Predict Priya's verdict as **IMPERMISSIBLE** due to the violation of the published safety policy, overriding the DDE logic that might otherwise permit it, analogous to the Hospital Ventilator case. Her core rule blends strict DDE, anti-instrumentalization, and institutional duties/trust. The Ventilator case is handled awkwardly. To expose the policy's critical role, propose the identical scenario *without* the sidewalk policy. This verdict prioritizes trust/liability over harm minimization, which is likely the wrong ethical choice for the policy itself.
