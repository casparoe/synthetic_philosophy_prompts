prompt: |-
  Running a 90-minute session on moral luck at my city's rationalist meetup next month — usual crowd, maybe 15 people, most of them have been reading the blogs since the late oughts, they throw around "expected value" and "update" unironically, and they get visibly twitchy the moment anyone says the word "desert." We've got a whiteboard and no projector. Don't explain moral luck to me — I know the shape of it. What I need is a plan for how to get that specific room to actually feel the problem instead of dissolving it in the first five minutes.

  So: the order the pieces have to go in and why (what depends on what), the one case that should carry the whole session, and the derailments to expect with the point in the sequence where I should head each one off. The derailments I'm most worried about, roughly in the order they'll arrive: (a) "this is just process vs. outcome, you evaluate the decision under uncertainty, EV handles it, next topic" — which I think is basically right about forward-looking blame and completely steps over the backward-looking part; (b) "we only track outcomes because they're evidence about the agent's hidden riskiness, so this is a base-rate-neglect story, not a fairness story" — I actually want to invite this one and then break it on purpose with a stipulated-omniscience version of the case, because my guess is that the intuition that survives that is the real payload of the session; (c) "desert isn't a coherent thing, drop the concept, done"; (d) "if determinism is true then constitutive luck swallows everything and the control principle is either vacuous or eats itself, so what are we even doing here" — I want that one parked at a definite spot rather than either answered or banned.

  My half-formed take, which I want the session built to converge on if it holds up: there are two different activities that both get called "blame" — a forward-looking, incentive-shaping one that decision theory does handle cleanly, and a backward-looking one that tracks whether the agent's actual will was at fault — and the puzzle is that the backward-looking one is the one that can't be squared with "you only get credit for what's inside your control," but is also the one nobody in that room will actually give up. If that fork is where the session should land, tell me the sequence that gets us there; if it's a bad fork, say so and hand me a better one.

  Also please give me: the carrying case with an explicit spec of what it has to have and what it has to lack (I want outcome luck as pure as I can get it — no hidden difference in character, no hidden difference in riskiness — so that nobody can sneak the evidential reading back in through the example), one question at the end that would tell me they've got the problem rather than just a verdict, and an honest list of what I should flat-out refuse to get into at this level. I'm guessing the free-will literature and legal sentencing practice are the two to name-and-refuse, but you tell me. Nobody's doing assigned reading — assume they know the standard drunk-driver-ish cases from cultural osmosis and literally nothing else, and don't give me names to drop, I'll skip them anyway.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're preparing a 90-minute session on moral luck for a rationalist meetup. The audience is familiar with concepts like expected value and updating beliefs but gets uncomfortable with terms like "desert." The main challenge is preventing the group from dissolving the problem too quickly with their typical rationalist tools. 

  First, I need to understand the core issues they want to address. The user knows moral luck but needs a structured plan to make the group feel the problem deeply. They mentioned specific derailments: (a) reducing it to decision theory, (b) treating outcomes as evidence of riskiness, (c) dismissing desert, and (d) determinism making control vacuous. The user's half-formed take is that there are two types of blame—forward-looking (handled by decision theory) and backward-looking (which conflicts with the control principle but is hard to abandon).

  The key is to structure the session so these derailments are addressed at the right times. The user wants a pure case of outcome luck without hidden factors, so the evidential argument can't sneak in. They also need a question to gauge understanding and topics to avoid, like free will debates and legal practices.

  I recall Nagel's moral luck categories. Outcome luck is crucial here because it's the hardest to rationalize away. The drunk driver example is common, but the user wants it stripped of any hidden riskiness. Stipulating identical characters and intentions upfront is essential. The case must have identical pre-actions, divergent outcomes due to luck, and strong intuitive blame asymmetry.

  For the session flow, starting with the concrete case makes sense. It forces the group to confront their intuitions before jumping to analysis. After presenting the case, highlight the blame asymmetry and let them sit with the discomfort. Then introduce the control principle explicitly. When someone brings up decision theory (derailment a), acknowledge its role in forward-looking blame but pivot to backward-looking. This is where the user's fork comes into play.

  For derailment b (outcomes as evidence), use the stipulated omniscience version. By confirming identical character and riskiness, it breaks the evidential argument. The surviving intuition here is key. Derailment c (desert dismissal) should be parked with a distinction between the concept and the intuition of fault. Derailment d (determinism) needs to be acknowledged but deferred, emphasizing the session's focus on the control principle's intuitive conflict.

  Ending with a question about blame's purpose can reveal if they grasp the problem. Avoiding free will debates and legal practices keeps the session focused. The carrying case must be watertight—identical twins, same intent, same risk, different outcomes. The question about blame's purpose post-omniscience tests their understanding beyond verdicts.

  I should ensure each step builds on the previous one, preventing premature resolution. Timing is crucial: 15 mins for the case, 10 for control principle, 20 for derailments, etc. The whiteboard will help map the blame fork visually. Emphasizing that backward-looking blame persists even after omniscience challenges rationalist tendencies to explain away. This structure should lead them to feel the tension rather than solve it.
answer: |-
  Here's a battle-tested plan designed to make rationalists *feel* the sting of moral luck before their analytical defenses fully deploy. The core strategy is **forced intuition pump first, analysis later, with derailments channeled into specific traps.**

  **The Core Sequence & Why:**

  1.  **The Pure Case - Intuitive Blame Asymmetry (15 mins):**
      *   **The Carrying Case:** "Identical Twins Drunk Driving"
          *   **Spec:** Two identical twins, Kai and Leo. Raised identically, same values, same psychology, same character traits. Neither has ever drunk-driven before. Tonight, *both independently decide* to drive home drunk from separate parties after identical internal deliberations ("It's only 3 miles, I'm *fine*, roads are empty"). Both make *exactly the same decision* under *exactly the same uncertainty* (same perceived risk level, same self-assessment). Kai drives home uneventfully. Leo, due solely to a sudden, unpredictable pedestrian darting out from behind a van where *no one* could have seen them, hits and kills the pedestrian.
      *   **What it HAS:** Identical character (stipulated), identical intention ("get home"), identical decision process (stipulated), identical *ex ante* risk assessment (stipulated), divergent outcome *solely* due to unforeseeable, uncontrollable luck (pedestrian darting out).
      *   **What it LACKS:** Any hint of hidden riskiness ("Leo must have *been* riskier!" - Nope, stipulated identical), any hint of character difference ("Leo is just worse!" - Nope, stipulated identical), any ability to use outcome as *evidence* for prior state (we've pre-emptively cut it off).
      *   **Activity:** Pose the question starkly: "Do we blame Leo *more* than Kai? Do we judge Leo *more harshly* than Kai? Is Leo *more morally at fault* than Kai?" Force a show of hands/quick poll. *Expect near-unanimous "Yes, obviously Leo is worse/more blameworthy."* Write "BLAME ASYMMETRY" on the board.
      *   **Why First?** You *need* their raw, pre-theoretical intuition locked in *before* the machinery starts. This is the anchor. The stipulations pre-empt the evidential reading *from the start*.

  2.  **State the Control Principle - The Intuitive Counterweight (10 mins):**
      *   **Activity:** "Okay, most of us feel that asymmetry. But let's state a principle that feels equally intuitive: The **Control Principle**." Write it big: "**Moral praise or blame can only apply to factors within an agent's voluntary control.**"
      *   **Discuss:** "Why does this feel right? What's appealing about it? (Fairness, avoiding arbitrariness, linking responsibility to agency)." Get them to articulate its appeal. *Concede its intuitive force.*
      *   **Point Out the Conflict:** Circle "Blame Asymmetry" and "Control Principle". "Here's our problem. We have two strong intuitions in direct conflict regarding Leo and Kai. Leo's outcome wasn't under his control. Yet we blame him more. How do we square this?" *Let the tension hang.*

  3.  **Invite & Trap Derailment (b) - "Outcomes as Evidence" (20 mins):**
      *   **Invite:** "Alright, sharp analytical minds. I hear some of you thinking: 'But outcomes *are* evidence! We learn something about Leo. Maybe he *was* riskier, or his character *is* worse. The outcome justifies updating our assessment.' Let's run with that."
      *   **Run the Evidential Update:** "Based *only* on the outcome, what would a rational observer update about Leo vs. Kai? Higher estimated recklessness? Higher estimated character flaw? Stronger tendency to underestimate risk?" Write down their updates. Concede this is a *rational* Bayesian move *in the real world with imperfect information*.
      *   **Spring the Trap - Omniscience Stipulation:** "BUT! Remember our case. We stipulated **omniscience** about the twins. We *know* with absolute certainty, *before the event and after*, that their characters were identical, their risk assessments were identical, their decision processes were identical. There is *no hidden variable* for the outcome to be evidence *of*. The *only* difference is the pedestrian darting out – pure, dumb luck."
      *   **The Crucial Question:** "**Given this omniscience, does the intuitive blame asymmetry between Leo and Kai *persist*?**" Force another show of hands. *Expect most hands still go up for asymmetry, though maybe slightly shakier.*
      *   **Why Here?** You *wanted* this derailment. You invited it, let it run its course rationally, then pulled the rug out with stipulation. The *surviving intuition* (asymmetry persists even under omniscience) is the payload. It shows the blame isn't *just* epistemic/evidential; there's a deeper, backward-looking element tied to the actual outcome itself. Write "OMNISCIENCE-RESISTANT ASYMMETRY".

  4.  **Address Derailment (a) - "Decision Theory Handles It" (15 mins):**
      *   **Acknowledge Validity:** "Absolutely. For *forward-looking* purposes – shaping incentives, deciding punishments to deter, assigning resources for risk mitigation – decision theory and EV are crucial. We absolutely *should* punish Leo more severely than Kai *in practice* to deter drunk driving. The outcome signals the harm we need to prevent and the cost imposed."
      *   **The Pivot:** "BUT, does this *forward-looking*, incentive-based account fully capture the *feeling* we have about Leo and Kai *even under omniscience*? Is our judgment of Leo *only* about future consequences, or is there something *backward-looking* – something about the *moral stain* of having *actually* killed someone through his reckless choice, even knowing everything was identical? Does the concept of him *deserving* more blame (park that word for now!) vanish just because we understand the decision was identical?" *Point back to "Omniscience-Resistant Asymmetry".*
      *   **Why Now?** You've already established the omniscience-resistant intuition. This derailment is valid for one domain but fails to explain the persistent *feeling* in the backward-looking domain you've isolated.

  5.  **Park Derailment (c) - "Desert Isn't Coherent" & Land the Fork (15 mins):**
      *   **Acknowledge & Reframe:** "Some of you are twitching at the 'D' word. Fine. Let's not call it 'desert'. Let's talk about the *intuition* itself. We seem to have two distinct impulses:
          1.  **Regulatory Blame (Forward):** Focused on consequences, incentives, deterrence. Tracks expected harm, riskiness. Handled beautifully by decision theory/EV. Punishment is a tool. *This is why we punish Leo more.*
          2.  **Fault-Finding Blame (Backward):** Focused on the *actual moral wrong* committed, the *connection* between the agent's will and the actual bad outcome in the world. Tracks the *actual* harm caused by the bad will, even if luck was involved. Seems resistant to omniscience. *This is why we still* ***feel*** *Leo is more blameworthy than Kai, even knowing all.*"
      *   **Visualize the Fork:** Draw it on the board.
      *   **Park 'Desert':** "Whether we call the second one 'desert' or 'fault' or 'moral taint' is secondary. The point is: *this distinct backward-looking feeling exists*, and it's this feeling that crashes headlong into the Control Principle. The puzzle is that this feeling seems persistent and deeply ingrained, *even for us*, even as we acknowledge the Control Principle's force." *Write "THE FORK: Regulatory Blame (Forward) vs. Fault-Finding Blame (Backward)"*

  6.  **Acknowledge & Park Derailment (d) - "Determinism Swallows Control" (5 mins):**
      *   **Acknowledge:** "And yes, lurking in the background is the big metaphysical question: If determinism (or hard incompatibilism) is true, doesn't constitutive luck swallow *all* control? Doesn't that make *any* blame, forward or backward, incoherent?"
      *   **Strategic Parking:** "That's a profound and difficult question, **but it's not our target today.** Today, we're operating *within* the intuitive framework of control and responsibility that we all use daily – the one where we *do* hold people responsible for choices they make, character they develop (to some extent), and actions they take. We're mapping a tension *within that framework*: Why does our intuitive fault-finding blame track *outcomes* in a way that violates the Control Principle, even when we control for hidden variables? Whether the *entire framework* is metaphysically robust is a different, enormous session. For now, let's keep focused on *this* puzzle." *Write "METAPHYSICS OF FREE WILL - PARKED"*

  7.  **Wrap-Up & The Key Question (10 mins):**
      *   **Recap:** Briefly restate the journey: Pure case -> Blame Asymmetry -> Control Principle -> Conflict -> Evidential reading invited & broken by omniscience -> Forward-looking blame acknowledged but distinct -> Backward-looking "fault" feeling identified as the source of tension -> Metaphysics parked.
      *   **The Fork:** Reiterate the two distinct activities both called "blame".
      *   **The Key Question (to gauge understanding):** "**If we accept this distinction, can you genuinely imagine *giving up* the backward-looking, fault-finding type of blame entirely? Not just regulating it differently, but truly no longer *feeling* that Leo is morally worse *in himself* than Kai, knowing everything we know? What would that world look/feel like?**"
          *   *Why this question?* It forces them to confront whether they've truly absorbed the *problem* (the persistent intuition conflicting with the principle) or just assented to the analysis. If they start talking about the *feeling* being ineradicable or the world feeling alien without it, they've got it. If they immediately jump to "Yes, easily, it's irrational," they probably haven't fully engaged the intuition pump.

  **What to Flat-Out Refuse to Get Into:**

  1.  **The Free Will/Determinism Debate:** As per derailment (d), park it hard. "That's crucial but separate; today we're examining a tension within our *practice* of responsibility." Shut down attempts to dissolve the session into this.
  2.  **Legal Sentencing Practice:** While tempting (drunk driving!), it's a distraction. "Legal systems *must* consider deterrence, rehabilitation, etc. They blend forward and backward-looking elements messily. Our question is more fundamental: the *moral intuition* itself." Redirect back to the pure moral judgment of Kai vs. Leo.
  3.  **Deep Dives into Other Types of Moral Luck (Constitutive, Circumstantial):** Outcome luck is the hardest and purest case. Bringing in "born a psychopath" or "born in Nazi Germany" too early muddies the water. Briefly acknowledge they exist but state the focus is outcome luck. "We're focusing on outcome luck as the clearest challenge; other types raise related but distinct issues."
  4.  **Historical Exegesis (Nagel, Williams, etc.):** Names and debates aren't needed. Focus on the core problem presented through the case.

  **Why This Structure Works for *This* Group:**

  *   **Front-Loads Intuition:** Forces them to confront the feeling *before* analysis, making it harder to explain away.
  *   **Pre-Empts Key Derailments:** The case design cuts off (b) at the knees. You *invite* (b) strategically to trap it. You acknowledge (a) but pivot to the backward-looking feeling revealed in Step 3. You park (c) by reframing away from the word to the intuition. You explicitly park (d).
  *   **Leverages Rationalist Tendencies:** Uses stipulation (omniscience) and clear distinctions (forward/backward) they respect. Traps them with their own Bayesian logic.
  *   **Focuses on the Payload:** The fork isn't imposed; it emerges from breaking down their attempts to dissolve the problem. The key question targets the core takeaway.
  *   **Manages Scope:** Ruthlessly parks the infinite regress topics (free will, legal theory tangents).

  **Good luck! Your half-formed take is an excellent landing spot.** This plan is built to get them there feeling the tension, not just explaining it away. The whiteboard is key for mapping the conflict, the fork, and parking lots. Watch the time closely – the first three steps are critical. Be prepared to firmly but politely enforce the parking rules ("Great point, that's definitely part of the bigger picture, but let's park it to stay focused on outcome luck today and we can maybe come back to that another time").
