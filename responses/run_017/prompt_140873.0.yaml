prompt: |-
  I'm a second-year PhD student in philosophy, currently in a seminar on formal epistemology, and we have just spent two weeks on Aumann's agreement theorem and on the epistemology of disagreement that it tends to get wheeled into. My verdicts on concrete cases don't seem to line up with any of the positions we have discussed, and I would like help working out what principle, if any, they add up to. I may be misremembering the theorem, so tell me if I am: as I understand it, if two agents start from a common prior over a shared space of possibilities, and it is common knowledge between them what each of their posterior probabilities for some event is, then those posteriors are equal — ideally rational agents with a shared prior cannot agree to disagree. I would rather not be told what to read next; the cases are what I want help with.

  Two forecasters at the same weather service. Same model, same training, each gets the readings from half the stations in the region; they exchange their probability of heavy rain tomorrow, then exchange again, and could go on indefinitely. I think each round should shrink the gap, that any residual gap after one round is entirely fine, and that persisting in a gap after ten rounds would be irrational.

  Same setup, except that each forecaster's evidence is a radar image whose noise level the viewer cannot tell from the image itself: you see what you see, and you have no independent handle on how much of it is artefact. They share the images and their probabilities. Here I do not think convergence is required even in the limit — neither has any way of telling whose image was cleaner, and sharing does not manufacture one. I feel there is something structurally different about this case, but I cannot say what it is.

  Two climatologists who disagree about the probability that some threshold will be crossed by 2050. They have read everything, they know each other's posteriors, and the disagreement traces to how much weight each gives to a class of historical evidence. My verdict is that the disagreement is permissible, because the common-prior assumption is exactly what fails here. But I know the obvious reply — that evidential weightings are themselves rather like probabilities, so why should the theorem not apply one level up and force agreement about the weighting? My gut resists that, and I cannot say why.

  Two analysts with a common prior, full common knowledge of each other's posteriors, disagreeing about whether there will be a run on a particular bank next week, where whether the run happens depends partly on what depositors believe will happen. I think standing firm here is fine, and I think the theorem does not apply at all, but I would like to know what the principled statement of the exemption is.

  Two of us in the seminar, similar training and similar track records, read the same forty-page paper over the weekend; on Monday one says the central argument is sound and the other says it is a howler. Neither has done anything extra. I think both should reduce confidence substantially, though not all the way to agnosticism. But now vary it: same pair, same paper, except that one of them spent the weekend reconstructing the central lemma step by step and checking it against a textbook treatment, while the other read it once on a train. I think the careful reader may keep nearly all her confidence and need give almost no ground. I hold both verdicts, and I notice that the surface situation is the same in each — two peers, one text.

  Two pairs of agents both end the day with posteriors of roughly 0.7 and 0.4 for the same event after three rounds of exchanging posteriors. In one pair the exchange stopped because the market closed at five. In the other it stopped because they lost interest and went to the pub. I think the first pair's residual disagreement is not irrational and the second pair's is. I know this commits me to permissibility being a property of something other than the posterior reached, and I would like to see a principle say what.

  Two agents with a common prior face a posterior that would require integrating over an enormous space; neither can compute it and each knows the other cannot. I do not want to call their persistence irrational, and I do not want to call it permitted either — I oscillate between thinking them excused and thinking them fine, and I suspect the distinction matters for everything above.

  Finally, I am told the theorem entails that purely informational trade cannot occur between rational agents with a common prior. I do not believe that of actual markets, and this makes me suspect the common prior is doing all the work, so I distrust any conclusion that leans on it.

  The case I keep going back and forth on is peer disagreement about a normative question — say whether a particular gene-editing policy is permissible — where the peers share a background, share all the empirical evidence, and have no experts to defer to. I cannot settle whether full conciliation is required there or whether something about normative subject matter licenses steadfastness.

  Is there one principle that captures these verdicts, or nearly all of them, and what is it? Please state it precisely, say which of my cases motivates which clause, and then give me its verdicts on three cases I have not listed: the normative case above; a case where one peer is demonstrably better calibrated in the domain but the other has the more specific evidence; and a case where the disagreement is discovered only after the decision has been made and cannot be revisited. Say plainly which of my verdicts the principle cannot accommodate and would force me to give up, and give me the simpler alternative principle that overturns one of them, so I can see what the trade really is. Where you can, separate what is settled — the status of the theorem itself as mathematics, about which I want to be corrected if I am wrong — from what is genuinely contested among people who work on this: whether a common prior is a requirement of rationality, whether results about ideal agents constrain agents like us, whether higher-order evidence about one's own reliability changes the answer, and anything else you think specialists would divide over. Please do not present a contested view as the consensus, and flag the points where you would expect a seminar reading list to have pushed me in one direction. And please write the whole thing as continuous prose — no headings, no bullet points, no bold, no tables — the way you would write a long email to a student you know.
reasoning: |-
  Okay, let me start by unpacking this philosophy PhD student's query. They're deep into formal epistemology, specifically Aumann's agreement theorem and its implications for disagreement. Their core issue is that their intuitive judgments on various cases don't align with standard positions, and they want to find a unifying principle. 

  First, I need to verify their understanding of Aumann's theorem. They've got it right: common prior, common knowledge of posteriors → identical posteriors. But their cases reveal discomfort with how this applies to real-world scenarios. 

  Looking at their examples: The weather forecasters with shared data should converge quickly; the noisy radar viewers shouldn't; climatologists lack common priors; bank run analysts deal with reflexive beliefs; peer disagreement depends on effort; stopping rules matter; computational limits create ambiguity. The normative case is their sticking point. 

  What's the pattern here? It seems they're rejecting the common prior assumption in most cases, but not all. When evidence is objective and partitionable (weather stations), convergence feels obligatory. When evidence is noisy or interpretation-laden (radar, climatology), divergence seems permissible. Reflexive cases (bank runs) break the theorem's setup entirely. Effort in peer disagreement acts as a justifier for steadfastness. 

  The deeper thread might be about what counts as "common knowledge" in practice. For the weather forecasters, exchanging probabilities effectively creates common knowledge because the evidence is transparent. But with noisy radar images, even sharing the images doesn't establish common knowledge about evidence quality. Similarly, in peer disagreement about a paper, the surface facts are common knowledge, but the depth of engagement isn't - hence their different verdicts based on reading effort. 

  For the normative case, I suspect their hesitation comes from uncertainty about whether moral truths admit of common priors. If morality is objective but hard to access, divergence might still be rational; if it's fundamentally interpretive, steadfastness could be warranted. Their trade example skepticism suggests they doubt common priors exist in practice. 

  The principle emerging is something like: Rational disagreement persists when (1) agents reasonably doubt they share identical evidence partitions (radar), (2) common priors are implausible (climatology), (3) the event depends on their beliefs (bank runs), or (4) cognitive limitations prevent Bayesian updating. But convergence is required when evidence is publicly shareable and models are algorithmic (weather). 

  On the unanswered cases: For normative disagreement, the principle would permit steadfastness iff they doubt shared priors. For the better-calibrated peer, it depends whether calibration differences are known - if so, the less calibrated should defer. For post-decision disagreement, rationality might not demand revision since beliefs no longer affect action. 

  The main tension is with the computation case - their ambivalence between "excused" and "fine" isn't fully resolved. The principle might call it excused but not ideal, forcing them to choose whether rationality requires feasible computation. 

  Alternative views would insist common priors are always rational (forcing convergence in climatology) or that peer disagreement always demands conciliation (contra their reading effort case). That's the trade: either bite the bullet on normative disagreement or abandon their intuitive distinctions.
answer: |-
  Your intuitions across these cases reveal a coherent pattern that challenges a naive application of Aumann’s theorem to real-world disagreement. The theorem itself, as you recall, is mathematically sound: under common priors, common knowledge of posteriors implies identical posteriors. But your cases highlight where the theorem’s idealizations fracture in practice. The unifying principle I discern from your judgments is this:  

  **Rational agents must revise toward agreement only when they have *common reason to believe their evidence partitions are symmetrically reliable* and *no unresolved ambiguity about how evidence bears on the hypothesis*. Disagreement is permissible when evidence is ambiguous, interpretation-laden, reflexive, or computationally intractable, or when agents have asymmetric grounds to trust their own evidence-partitioning.**  

  Let’s dissect your cases under this principle:  

  1.  **Weather forecasters (shared stations):** Convergence is required because evidence partitions are symmetric and unambiguous (station readings directly constrain rain probability). Residual gaps shrink with exchanges since each update incorporates the other’s evidence-as-probability. After ten rounds, persistent gaps indicate irrationality—failure to properly condition on the shared evidence.  
  2.  **Weather forecasters (noisy images):** No convergence required. The noise ambiguity prevents agents from knowing whose evidence partition is more reliable. Sharing images doesn’t resolve the *epistemic asymmetry* in their access to noise levels. This is the "structurally different" element: evidence here isn’t partitionable into common, unambiguous likelihoods.  
  3.  **Climatologists:** Disagreement is permissible. The common prior fails precisely because weighting historical evidence isn’t a mere probability judgment—it’s a model-dependent, theory-laden choice. Your gut resists "applying the theorem one level up" because weightings aren’t events in a shared possibility space; they’re divergent interpretive frameworks.  
  4.  **Bank run analysts:** Standing firm is permissible. The theorem doesn’t apply because the event (bank run) is *reflexive*: it depends on agents’ beliefs. Your posteriors affect the outcome, violating the assumption of a fixed event independent of beliefs.  
  5.  **Seminar peers (equal effort):** Both should conciliate substantially. Surface symmetry in training/track records implies symmetric reliability, but the disagreement itself is higher-order evidence that something (e.g., a subtle flaw) was missed. Agnosticism isn’t required because their prior competence still anchors some confidence.  
  6.  **Seminar peers (unequal effort):** The careful reader may stand firm. Effort breaks the symmetry—it gives her asymmetric reason to trust her evidence partition (the lemma reconstruction). The surface "peer" status is overridden by the known differential in evidence-handling.  
  7.  **Stopped exchanges (market close vs. pub):** Disagreement is irrational only for the pub pair. Stopping due to external constraints excuses residual disagreement; stopping voluntarily implies they *could* have converged further but chose not to. Permissibility depends on the *reason* stopping occurred, not just the posteriors.  
  8.  **Computational intractability:** Ambivalence is warranted. They are *excused* from convergence (as full rationality is infeasible) but not *fully rational*—ideal agents would agree. This isn’t mere permission; it’s a concession to cognitive limits.  
  9.  **Informational trade:** Your skepticism is justified. The "no trade" result assumes common knowledge of rationality and common priors—both rarely hold. Markets thrive on divergent interpretations (violating common priors) or asymmetric confidence in private signals (violating common knowledge of posteriors).  

  ---  

  ### **Principle Applied to New Cases**  
  1.  **Normative disagreement (gene-editing permissibility):**  
      - **Verdict:** Steadfastness is permissible.  
      - **Why:** Normative questions involve irreducible interpretive frameworks (like climatologists’ weightings). There’s no unambiguous evidence partition; "shared evidence" (e.g., consequences of gene-editing) is evaluated through divergent moral lenses. The principle exempts cases where evidence-to-hypothesis mapping is fundamentally contestable.  
  2.  **Better-calibrated peer vs. specific evidence:**  
      - **Verdict:** The agent with specific evidence should conciliate *only if* the calibration advantage is salient and domain-relevant.  
      - **Why:** Calibration provides objective grounds to trust the better-calibrated peer’s evidence partitioning *in general*. But if the specific evidence is direct and unambiguous (e.g., an email from the CEO), while the peer relies on indirect indicators (e.g., market trends), the specific-evidence holder retains asymmetric justification. The key is whether calibration differences override the *quality* of the local evidence.  
  3.  **Disagreement discovered post-decision:**  
      - **Verdict:** No revision required.  
      - **Why:** Rationality governs belief revision insofar as it affects action. If the decision is irreversible (e.g., a fired missile), and beliefs no longer guide action, maintaining the pre-decision belief isn’t irrational—though updating may still occur for consistency.  

  ---  

  ### **Tensions and Trade-offs**  
  - **Your verdict the principle challenges:** The pub pair’s irrationality. If the market-close pair is excused by external constraints, why isn’t the pub pair excused by "boredom" as a constraint? The principle insists rationality requires *using available opportunities* to resolve disagreement. Voluntarily stopping implies negligence. To abandon this, you’d need a simpler principle: *"Agents are never irrational for failing to update after communication ceases."* But this would force you to accept the pub pair as rational—and likely abandon your intuition about the ten-round weather forecasters.  
  - **Computation case:** The principle forces a choice. Either call them *excused but suboptimal* (since ideal agents would agree) or expand "rationality" to include feasible computation. The latter risks permitting all computational failures.  

  ---  

  ### **Settled vs. Contested**  
  - **Settled:**  
      - Aumann’s theorem is mathematically correct given its assumptions.  
      - Common knowledge of posteriors + common priors → identical posteriors.  
      - Real-world disagreements often violate these assumptions.  
  - **Contested (where specialists divide):**  
      - **Common prior as rationality requirement:** Some (e.g., Harsanyi) argue priors *must* converge for rational agents; others (e.g., Aumann himself) see it as an idealization. Your climatology case rejects it—a stance defended by "permissivists" about evidence weighting.  
      - **Ideal vs. non-ideal theory:** Does Aumann bind non-ideal agents? You treat computational limits as excusing (non-ideal), but effort as relevant (ideal-like). Most formal epistemologists concede ideal theory’s limits here.  
      - **Higher-order evidence (HOE):** Your peer cases hinge on HOE (disagreement signals possible error). But *how much* it should move us is contested (e.g., Elga vs. Kelly). Your seminar likely pushed you toward "conciliatory" views (HOE dominates).  
      - **Reflexivity:** The bank run case is often excluded from Aumann-style results. Consensus holds that game-theoretic beliefs require different tools (e.g., Nash equilibrium).  

  ---  

  Your core insight is that disagreement’s rationality turns not on the *fact* of exchanged posteriors, but on the *nature of the evidence and agents’ access to it*. The radar case fails on ambiguous partitions; the climatologists on interpretive weight; the bank run on reflexivity; the pub pair on neglected opportunities. What unifies these is the breakdown of *common, unambiguous evidence-handling*. Where this holds (weather stations), Aumann applies; where it frays, your principle carves exemptions. 

  On normative disagreement: Your instinct that steadfastness *might* be permissible reflects the "objective weightiness" of moral evidence—but this is deeply contested. If your seminar emphasized "moral uncertainty" arguments, it might push you toward conciliation. Your principle, however, licenses steadfastness by treating normative evidence as inherently interpretation-laden.
