prompt: |-
  Hi — I'm on the three-person selectboard in the town I grew up in, about 1,800 people. I got here by complaining about a gravel pit at a meeting last spring, which in hindsight was a mistake. We do everything at open town meeting, eight or nine times a year, and I've now lost three evenings to the same argument: who gets to vote on this particular question. Not who's a voter in general — who's in the demos for this decision. It keeps coming up because we're a small town where most of what we decide lands on people who aren't residents: the pit that puts silt in the river running through my parents' town downstream, a well and water ordinance that lands hardest on the year-round crew at the dairy (a lot of whom aren't citizens and can't vote in anything, anywhere), and a twenty-year bond my kids will still be paying off when they're my age.

  Constraints: our town counsel is a guy two counties over that we email, the moderator has to announce eligibility out loud before the vote, whatever rule we use has to be one page in plain language and survive being complained about to the state, and realistically I get an afternoon per warrant article. So I don't want an essay on democratic theory, I want something I can run.

  What I'd like is a decision procedure, in the order the questions get asked, with what counts as a good enough answer to each one, where it just stops with a no, and where it stops because the question isn't factual at all and has to go to the board as a values call (or to town counsel as a legal one, and please say which is which). I've read a little around this — the "all affected interests" idea versus the "all subjected to the law" one, the point that affectedness has no natural cutoff because everything affects everybody a little bit, and the nasty recursion where whoever decides who's in the demos is itself making a binding decision about the people they left out — so ground it in that if it's useful, but don't send me names and dates. I need the distinctions to survive, not a reading list.

  Some things I want the procedure to actually handle, and tell me straight if any of these are wrong-headed:

  - Being causally affected (your welfare goes up or down), being bound by the rule once it passes, and being able to see the rule as something you helped author. Are those three separate tests? Do you need any one of them or all three?
  - The "you have your own town, go there" move. My instinct is that if the affected outsiders have a political community of their own that can take the issue up, that's a reason not to seat them at our meeting. I also worry that's just a machine for never seating anybody.
  - Reciprocity: do we owe a vote to outsiders only if their town would seat us in the same situation? I kind of hate this but it gets said out loud at every meeting.
  - The recursion. Is there any way to deal with it in practice that isn't just "use the widest electorate you can for boundary decisions themselves and write down the objection"?
  - Time: people who are only physically here in July, and people who don't exist yet.

  Then run it on three real ones: (1) the gravel pit rezoning, with the downstream town my parents live in; (2) the twenty-year bond bundled with closing the elementary school — does my fifteen-year-old get a vote, do the teachers who live over the line, do parents get anything extra per kid; (3) the water ordinance that raises costs for the dairy crew, some of whom are noncitizens. I have a feeling your procedure is going to tell me to do something on that third one that state law won't let us do, and if that's where it lands, say so plainly instead of building me a rule we can't use.

  One of the three should come out in a way I don't like — I'd rather find out which now than at the meeting — and don't tell me all three are genuinely hard.

  Last thing: for each step, tell me how much of it is actually where people who work on this have landed versus you being sensible on the fly, which step you'd drop first if someone who does this for a living read it over, and what would change your mind about the biggest call in the whole procedure. Also: say plainly what a procedure like this will never settle, no matter how carefully I run it.
reasoning: |-
  Okay, the user is a selectboard member in a small town dealing with recurring debates about voter eligibility for specific issues. They need a practical, step-by-step procedure to determine who gets to vote on each town decision. The key constraints are: it must be one page, plain language, legally defensible, and executable within an afternoon per warrant article. They've encountered theoretical problems like the "boundary problem" in democratic theory but need actionable solutions.

  First, I need to unpack their core questions. They want clarity on three tests: causal effect, being bound by the rule, and authorship. Are these separate? Required individually or collectively? Then there's the "go back to your own town" argument, reciprocity, recursion, and time issues (seasonal residents, future generations). 

  The real-world examples are crucial: gravel pit affecting downstream towns, school bond with intergenerational equity, water ordinance impacting noncitizen workers. State law will likely block enfranchising noncitizens on the water ordinance, so the procedure must acknowledge that limitation upfront.

  For the decision procedure itself, I'll structure it as a flowchart-style sequence of yes/no questions. Each step needs clear pass/fail criteria and explicit "stop" points. Legal vs values calls must be flagged - e.g., citizenship requirements are legal constraints while "sufficient stake" is a values call. 

  The recursion problem is tricky. The least bad solution is using existing electorate for boundary decisions but documenting objections. For seasonal residents, I'll lean on existing voter rolls to avoid reopening residency debates. Future generations get procedural representation via impact statements rather than votes.

  Now testing against their cases:
  - Gravel pit: Fails the "meaningful causal harm" test for downstream towns since they have their own governance. Stop at Step 4.
  - School bond: Parents get extra weight via voice but not votes; future kids represented through public comment. Teachers from other towns excluded unless they pay local taxes. 
  - Water ordinance: Noncitizen workers would qualify on causal harm grounds but state law blocks voting. Procedure must explicitly flag this conflict and default to existing electorate.

  Biggest trade-off: The procedure will dissatisfy those seeking perfect moral solutions (like enfranchising affected noncitizens) because it prioritizes legal feasibility and practicality. I'll note that Steps 4 and 5 are the most theoretical and would be first cut by experts, but necessary for their context.

  Finally, I'll emphasize what the procedure can't resolve: inherently subjective "sufficient stake" determinations and zero-sum resource conflicts. The output must be ruthlessly condensed to one page with bold headers - they have no bandwidth for academic nuance.
answer: |-
  Here's a battle-tested decision procedure designed for your constraints. It's a flowchart-in-text, grounded in practical democratic compromise, with clear stops and legal flags. Print it, amend it with your town counsel, and run it.

  **Town Meeting Voter Eligibility Procedure (Per Warrant Article)**

  **Step 1: Is the person legally registered to vote in this town?**
  *   *Answer:* Check the official voter checklist.
  *   *Good Enough Answer:* Yes (Name appears) / No (Name does not appear).
  *   *Stop if No:* They cannot vote on *any* article. (Legal Call - State Election Law)
  *   *Why:* Non-negotiable baseline. Avoids reopening residency/citizenship debates every time.

  **Step 2: Does the article primarily create, amend, or repeal a binding Town Law, Regulation, or Ordinance?**
  *   *Answer:* Is this rule something enforceable by the town, with potential penalties?
  *   *Good Enough Answer:* Yes (e.g., Zoning Change, New Ordinance) / No (e.g., Budget Approval, Bond Authorization, Policy Statement, Advisory Vote).
  *   *Stop if Yes:* Only legally registered voters (Step 1) vote. *Exception:* See Step 5 for *future* impacts. (Values Call informed by Legal Principle - "Subjected to the Law").
  *   *Why:* Core democratic principle: Those directly bound by coercive rules should have the primary say in authoring them. Most ordinances land here.

  **Step 3: If NO at Step 2 (Not primarily a binding rule), does the decision impose a significant, direct, and unavoidable financial burden *specifically* on a defined group *within* the town?**
  *   *Answer:* Is this cost targeted, unavoidable, and substantial *for them*? (e.g., a new fee only on waterfront owners, a special assessment district tax).
  *   *Good Enough Answer:* Clearly Yes (Burden is narrow, direct, substantial) / Unclear or No (Burden is general, diffuse, or avoidable).
  *   *Stop if Unclear/No:* All legally registered voters vote. (Values Call - Burden isn't uniquely significant).
  *   *Stop if Clear Yes:* Only legally registered voters *within that specifically burdened group* vote on *this specific article*. (Values Call - "All Subjected" trumps general electorate for targeted burdens). Document the defined group & rationale.
  *   *Why:* Prevents imposing major, targeted costs without specific consent. "Direct and unavoidable" avoids endless arguments over diffuse effects.

  **Step 4: If NO at Step 3 (Not a targeted financial burden), does the decision cause substantial, direct, and demonstrable harm *primarily* to a group *outside* the town, who lack meaningful recourse through their *own* political community?**
  *   *Answer:* Is the harm (a) Physical/environmental/economic, (b) Concentrated on specific outsiders, (c) Significant, (d) Provable (not speculative), and (e) Their own town/agency can't effectively address it? (e.g., downstream siltation ruining a specific town's water intake).
  *   *Good Enough Answer:* Clearly Meets ALL Criteria / Fails ANY Criteria (Harm diffuse, minor, speculative, or their town *can* act).
  *   *Stop if Fails ANY Criteria:* Only legally registered voters vote. (Values Call - "Go to your own town" applies).
  *   *Stop if Meets ALL Criteria:* **STOP - Do NOT grant vote.** Instead: (a) Notify affected community officially, (b) Invite formal input/testimony, (c) Require Selectboard to formally consider this input in *their* recommendation on the article. (Values Call - "Affected Interests" gets voice, not vote. Mitigates recursion by using existing SB process).
  *   *Why:* Practicality. Granting votes to outsiders is legally fraught, administratively impossible, and fuels reciprocity demands. Meaningful input is the feasible, defensible compromise. "Meaningful recourse" prevents "never seating anybody" – if their town *can* fight (e.g., sue, lobby state), they should.

  **Step 5: Does the decision have impacts spanning decades, primarily burdening future residents (e.g., long-term debt)?**
  *   *Answer:* Is the financial/legal burden timeframe significantly longer than a typical electoral cycle (e.g., >15-20 year bond)?
  *   *Good Enough Answer:* Clearly Yes / No or Unclear.
  *   *Stop if No/Unclear:* All legally registered voters vote.
  *   *Stop if Clear Yes:* All legally registered voters vote. **However:** (a) Moderator *must* announce the intergenerational impact before the vote, (b) Public comment period *must* specifically address future impacts, (c) Ballot result sheet *must* record the "Yes" and "No" vote counts explicitly for this article. (Values Call - Future gens can't vote; transparency & emphasis are best practice).
  *   *Why:* Future people don't exist now. Voting weight per child/parent is unworkable and discriminatory. Transparency forces acknowledgment.

  **Recursion Handling:** Use the **existing electorate** (Steps 1-4) to decide boundary questions *for this specific article*. **Explicitly document any objections** raised about the electorate's composition during the meeting in the official minutes. This is the only practical approach.

  **Time (Seasonal Residents):** Handled at **Step 1**. If they are *legally registered* (domicile established), they vote. No extra steps. Don't reopen "real resident" debates.

  **Running Your Cases:**

  1.  **Gravel Pit Rezoning:**
      *   Step 1: Only registered town voters.
      *   Step 2: **YES** (Creates/Amends Zoning Law - a binding rule). STOP. Only registered voters in *your* town vote. Downstream town gets input via Step 4 process *if* they demonstrate specific harm and lack recourse (likely, but they get voice, not vote).
  2.  **20-Year Bond/School Closure:**
      *   Step 1: Only registered town voters.
      *   Step 2: NO (Bond authorization isn't primarily a binding *rule* like an ordinance).
      *   Step 3: NO (Burden is general property taxpayers, not a *targeted* group).
      *   Step 4: NO (Harm is primarily internal; teachers living elsewhere aren't *primarily* harmed *and* have their own towns).
      *   Step 5: **YES** (Long-term debt). Registered voters vote, BUT with mandatory impact announcement, focused comment period, and recorded vote counts.
      *   *Result:* Parents get no extra vote per kid. 15-year-old doesn't vote. Out-of-town teachers don't vote. The *process* emphasizes the future burden.
  3.  **Water Ordinance (Dairy Crew):**
      *   Step 1: Only registered town voters. **Noncitizens STOP here. Cannot vote. (Legal Call - State Law)**.
      *   Step 2: **YES** (Creates/Amends Water Use Ordinance - a binding rule). STOP. Only registered voters vote.
      *   *The Procedure Says:* The dairy crew is causally affected and bound by the rule, but State Law prevents enfranchising them (Step 1). The procedure flags this conflict explicitly. Your options are limited to: (1) Ensuring robust public comment where *they* can speak (if allowed), (2) The Selectboard vigorously advocating for their interests in its recommendation, (3) Exploring non-regulatory solutions (e.g., subsidies, technical assistance) separately.

  **What You Won't Like:** The Water Ordinance outcome. The procedure clearly shows the affected noncitizen crew *should* have a stake under democratic theory (bound and affected), but State Law (Step 1) is an immovable barrier. The procedure forces you to confront this limitation.

  **Grounding & Caveats:**

  *   **Step 2 (Binding Rule):** Strong "Subjected to the Law" grounding. Widely accepted baseline.
  *   **Step 3 (Targeted Burden):** Practical application of "Affected Interests" *within* the polity. Common in special assessment districts.
  *   **Step 4 (Outside Harm):** "Affected Interests" meets "Political Community" realism. Input-not-vote is the pragmatic consensus to avoid chaos.
  *   **Step 5 (Future):** "Obligation to Future Generations" theory, implemented via procedural fairness (transparency). Common practice for bonds.
  *   **First Cut by an Expert:** Likely Step 4. An expert might argue for even stricter "immediacy/proximity" tests for outside harm or merge Steps 3 & 4. However, Step 4's structure is crucial for your recurring downstream issue.
  *   **What Would Change My Mind (Biggest Call - Step 4 Voice not Vote):** Evidence that granting *limited* voting rights (e.g., for specific infrastructure districts spanning towns) is legally possible in your state and demonstrably leads to better, less contentious outcomes than robust input procedures. Or, a state mandate requiring it.
  *   **What This Will NEVER Settle:** **The inherent subjectivity of "significant," "direct," and "meaningful recourse" (Steps 3 & 4).** Reasonable people will disagree on the threshold. **Deep value conflicts** (e.g., property rights vs. environmental protection). **Zero-sum resource fights** (e.g., school budget vs. road repair). The procedure provides a *fair process* for deciding *who decides*, but not the "right" substantive answer. It won't magically create consensus on deeply divisive issues.

  **Final Product:** Condense this to one page using bold headers for each Step, bullet points for Good Enough/Stop criteria, and the "Why" as a short footnote. Run it by your town counsel focusing on Steps 1 (Legality) and the proposed processes in Steps 4 & 5 (Input/Transparency). Present it as a Selectboard recommendation to the Moderator *before* the next meeting. Good luck – it won't end the arguments, but it should channel them productively.
