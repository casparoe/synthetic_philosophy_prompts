  The philosophical notes will unpack this: The toast implies some actions can be both obligatory (given role) and praiseworthy in manner - challenging strict supererogation views. It leans on the "cost to agent" requirement being flexible (her "cost" was making obligations look easy). Most fragile point might be claiming her way of working shouldn't be the baseline - that's where institutional critique bites hardest. If role-duties swallow supererogation entirely, I'd reframe praise as being for enduring unreasonable demands without complaint.

  Key will be keeping the toast warm and human while the notes do the heavy philosophical lifting. The user needs both - the speech to honor their mother, the analysis to satisfy their academic rigor.
answer: |-
  ## The Toast

  (Setting down glass, warm smile to the room, then to Mum)

  Good evening, everyone. For those who don’t know me, I’m [Your Name], [Mum's Name]’s incredibly proud, and slightly intimidated, son. Intimidated because trying to sum up thirty-one years of my mother’s work – work that wasn’t just a job, but a calling woven into the fabric of our family life – in a few minutes feels… well, let’s just say my PhD thesis on moral philosophy feels easier right now.

  Mum, you know your official title was Director of the Shelter. But anyone who walked through those doors, any staff member who needed backup at 3 AM, any colleague navigating a crisis, knew it was never *just* that. You were the fixed point. The one who knew where the extra blankets were hidden, how to talk down a panic attack, which social worker might actually return a call, and crucially, when the ancient boiler was about to stage a revolt. You were there when the funding ended but the need didn’t. You were there when someone turned up soaked and desperate long after “closing time.” Because for you, the sign might have said “8 to 8,” but the commitment was simply “open.”

  When you say you were “just doing your job,” Mum, we all know the job description you *actually* worked to never got written. No board memo ever listed “Be the person who covers the impossible gap” or “Become the de facto emergency contact for half the city’s vulnerable after hours.” That wasn’t in the budget line items the donors approved. That came from you. From a kind of fierce, stubborn care that refused to let protocol or paperwork get in the way of someone finding a safe place to sleep. It came from a reliability so deep that for thirty-one years, people knew: if [Mum's Name] is there, *something* can be done.

  But here’s the thing we mustn’t miss: praising you *only* for those late nights and covered shifts feels like a disservice. Because it misses the *how*. The how was everything. It was the respect you showed every single person who walked in, treating their dignity as non-negotiable. It was the way you could be firm about rules without ever making someone feel small. It was the dark humour that got the staff through impossible days – yes, including the puns, Mum, they *were* atrocious, but they worked! It was the sheer, unwavering *presence*. You showed up. Consistently. Relentlessly. For decades.

  And crucially, that presence wasn’t just at the shelter. It was digging in the allotment, coaxing life from the soil. It was picking up that banjo – apologies to the neighbours from those bluegrass band years! It was being our mum, our sister, our aunt, even when Christmas dinner sometimes had to be reheated because shelter duty called. That wholeness, that refusal to be *only* defined by the immense demands of the job, is part of what made you able to do it for so long. It’s part of what makes you *you*.

  So tonight, Mum, we’re not just celebrating the end of a job. We’re celebrating *how* you did it. We celebrate your profound reliability – the kind that builds trust brick by brick over thirty-one years. We celebrate the depth of your care – the kind that sees the person, not just the problem. We celebrate your resilience – the kind that weathers burnout and finds renewal in a vegetable patch or a bluegrass riff.

  This toast isn’t about setting you on a pedestal as some kind of solitary saint. It’s about recognizing the specific, sustained, and deeply human way you inhabited a role that demanded everything. You showed us what it looks like to meet profound need not just with duty, but with unwavering dedication and a full heart.

  The shelter will keep going. Others will step up. But the mark you’ve left – on this organization, on the countless lives you’ve touched, on your colleagues who learned from you, and on your family who watched you live your values – that endures.

  So, raise your glasses, everyone. To Mum, [Mum's Name]: For thirty-one years of showing up, of caring fiercely, of being the fixed point in the storm. For your strength, your heart, your terrible puns, and your incredible, unforgettable presence. We are all so profoundly grateful. To [Mum's Name]!

  ---

  ## Philosophical Notes: Commitments and Fragilities

  This toast attempts to navigate the philosophical minefield you described by making several key moves, each resting on contestable assumptions about supererogation, duty, and praise. Here’s a breakdown:

  1.  **Shifting Praise from *What* to *How*:** The core strategy is to avoid praising the *actions* themselves (covering shifts, being always available) as strictly "beyond duty" or "merely obligatory," and instead praise the *manner* and *sustained character* with which she performed her role.
      *   **Commitment:** This assumes that actions *within* one's duty can still be praiseworthy *if performed exceptionally well or with exceptional virtue*. It challenges the strict view that praise is solely reserved for the supererogatory (actions beyond duty). It leans on the idea that "duty well done" (especially under demanding, sustained conditions) is praise-worthy.
      *   **Fragility:** The line between "what" and "how" is blurry. Is relentless availability part of the "what" of her *actual, lived* role, or the "how"? Critics (like your Mum!) might argue the constant coverage *was* the job requirement in practice, making praise for it misplaced. The toast implicitly argues that the *degree* and *consistency* tip it into praiseworthiness.
      *   **Challenge - Institutional Critique:** If the institutional critique is correct (that individual virtue masks systemic failure), praising the *manner* still risks valorizing the unreasonable demands themselves. The toast counters this *slightly* by mentioning the "unwritten job description" and gaps not funded, but it doesn't fully condemn the system.
      *   **Challenge - Role-Duties Swallowing Supererogation:** If role-duties entirely consume potential supererogation, praising the *manner* becomes the *only* avenue. The toast embraces this, arguing that exceptional virtue *within* the role is the locus of praise. If one believes no praise is due for merely meeting (even expansive) role-obligations, this move fails.
      *   **Change My Mind (Cost Requirement):** If the "cost to agent" requirement for supererogation is false, it might open the door to praising *easily* performed good deeds as supererogatory. This wouldn't significantly change the toast's core strategy (praising the *manner* of demanding action), but it might make the "unwritten demands" seem less uniquely praiseworthy. The toast focuses on the *sustained* cost/demand.

  2.  **Praising Reliability & Character:** Focusing on traits like "reliability," "fierce care," "resilience," "respect," and "presence."
      *   **Commitment:** This commits to the view that character virtues are praiseworthy, especially when consistently manifested over time and under pressure, *even if* their manifestation occurs within the scope of duty. It sees character as a distinct object of praise separate from isolated acts.
      *   **Fragility:** This still risks implying that others (staff, future director) who cannot manifest these virtues to the *same degree* (e.g., due to being single parents with second jobs) are less praiseworthy. The toast tries to mitigate this by emphasizing Mum's *specific* 31-year tenure and the *uniqueness* of her mark, not setting a benchmark. ("Others will step up" implies different ways).
      *   **Challenge - Asymmetry (Praise/Blame):** The worry that praising Mum implies blame for those who did less. Praising *character* and *sustained effort* over 31 years is less directly comparative than praising specific "above and beyond" *acts*. It praises *her* journey, not a standard others failed to meet. However, the implication isn't entirely erased, especially for the board/donors. The toast's warmth and focus on Mum tries to soften this.

  3.  **Acknowledging Systemic Failure Without Centering It:** Mentioning the "unwritten job description," "gaps not funded," and "scandal of the job existing" (via her own line) but not making it the focus.
      *   **Commitment:** This acknowledges the institutional critique without letting it dominate a celebratory moment. It tries to walk the line Mum sets: the work was necessary and demanding, but the *need* for it is the scandal.
      *   **Fragility:** This is the tightrope. Donors/board might hear the critique; guests/staff might feel the praise doesn't go far enough in condemning the system. The toast relies on context (it's *her* retirement dinner) and the preceding focus on *her* effort to keep it affectionate. The line "That wasn’t in the budget line items..." is the key, slightly risky, nod.
      *   **Challenge - Vocabulary of Virtue as Trap:** If this vocabulary *is* a trap, then any praise of her individual effort risks absolving the system. The toast's nod to systemic issues is an attempt to inoculate against this, but it's arguably insufficient. A stronger critique might alienate the audience (board/donors paying for dinner) and violate the "affectionate" brief. This is a core tension.

  4.  **Emphasizing Wholeness:** Including her allotment, puns, bluegrass band, and family life.
      *   **Commitment:** This explicitly rejects the "life wholly narrated by moral demand" and affirms that her value and praiseworthiness stem from her full humanity, not just her sacrifice. It argues that this wholeness *enabled* her sustained effort.
      *   **Fragility:** Minimal. This directly addresses your concern and hers. It strengthens the portrait of her as a specific person.

  **The Most Fragile Line & Alternatives:**

  *   **Line:** "That wasn’t in the budget line items the donors approved. **That came from you.** From a kind of fierce, stubborn care that refused to let protocol or paperwork get in the way..."
  *   **Why Fragile:** This most directly confronts the systemic gap and pins the filling of it on Mum's individual virtue. It risks:
      *   Letting donors/board "off the hook" by implying Mum's virtue solved the problem they created/ignored.
      *   Implying to guests that care *was* dependent on her individual goodwill, not a systemic guarantee.
      *   Overstating the "voluntariness" if her character made the actions feel necessary *to her*.
  *   **Alternatives Based on Challenges:**
      *   **If Role-Duties Swallow Supererogation Entirely/Institutional Critique Dominates:** "...That came from you *because the system demanded it and you were the one who answered, year after year.* From a fierce, stubborn care that *refused to abandon people when the system did,* even when it meant..." (Shifts emphasis to her *endurance* of systemic failure, less on her virtue *filling* it).
      *   **If Cost Requirement is False (Less Impact Here):** "...That wasn't in the budget, *imposing a constant burden*. That came from you, fueled by a fierce, stubborn care..." (Emphasizes the cost she bore, even if not strictly supererogatory).
      *   **Softer Version (Prioritizing Affection):** "...That went beyond what any formal description could capture. It came from a fierce, stubborn care in you that simply wouldn't turn anyone away..." (Removes direct reference to donors/budget, focuses on her care and action).

  **The Line for Your Supervisor:** "Praising you *only* for those late nights and covered shifts feels like a disservice. Because it misses the *how*." This subtly points towards the "manner vs. matter" distinction crucial to debates about praising actions within duty and the potential praiseworthiness of virtuous execution. They'll hear the unspoken "supererogation of the will" or "duty well done" argument.

  **Overall Reasoning Fragility:** The reasoning is most likely to fail if the audience holds a **strict, act-centered view of supererogation** as the *only* basis for praise. Someone expecting a list of "above and beyond" deeds might feel the toast doesn't adequately justify praising her "just" doing her job (even exceptionally well). The second point of failure is the **institutional critique**. If the systemic failure is deemed so overwhelming that *any* individual praise is complicit, the toast's attempt to balance celebration with a nod to the system will feel insufficient or even offensive to some. The success hinges on the audience accepting the core premise: that sustained, virtuous commitment *within* a demanding role, performed with humanity and integrity, is genuinely and uniquely praiseworthy.
