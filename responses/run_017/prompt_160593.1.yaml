  First, I need to understand the core issue. The scenario involves two parties in a repeated cooperative relationship. An external event prevents one side from fulfilling their commitment—like a bridge collapse or a dead radio battery. The other side interprets this non-action as deliberate defection and retaliates. The first party, seeing unwarranted retaliation, retaliates back. Both parties feel they've done nothing wrong, so no apologies happen, and the cooperation unravels. The user mentioned this happened in their department too, with a co-author missing a deadline due to a family emergency, leading to a permanent rift.

  The user has already checked the security dilemma and noise in repeated games but found them insufficient. The security dilemma involves active defensive actions misinterpreted as offensive, whereas here the issue is a passive omission. Noise literature deals with accidental defections (doing the wrong thing), but here the problem is the inability to act, not a wrong action. Attribution theory explains single judgments but not the compounding effect over interactions.

  I recall related concepts. The security dilemma doesn't fit because it's about actions, not omissions. Noise in game theory (like tit-for-tat with mistakes) assumes the defection is an action, not a failure to act. Attribution theory focuses on how people judge others' behavior but doesn't address the iterative breakdown. Cheap talk is relevant because claims of inability aren't verifiable. Sender-receiver models show that unverifiable messages can't resolve uncertainty. Trust and verification mechanisms are key here—without them, explanations are dismissed as cheap talk.

  The user's deeper needs include identifying if this is a distinct phenomenon, finding relevant literature, and understanding factors that prevent or mitigate such breakdowns. They might also want to contribute a new concept if none exists, requiring clear boundaries for their case studies.

  From my knowledge, the closest framework is the interaction of unverifiable incapacity and attribution errors leading to a spiral. The key elements are: unintentional omission, external attribution of defection, no mechanism for verification, and mutual belief in their own innocence. This prevents standard repair mechanisms like contrition from activating.

  For terminology, "verification crisis" or "attributional cascade" could work. The former emphasizes the inability to confirm the reason for omission, while the latter highlights the compounding misattributions. "Omission-induced breakdown of reciprocity" is descriptive but clunky. "Unverifiable incapacity trap" captures the essence but might be too narrow.

  Predictors of resilience would include established trust from past cooperation, robust communication channels for verification, and institutional mechanisms like third-party mediators. However, high trust might increase expectations, leading to harsher judgments when failures occur. The user's example with their co-author shows that even in academia, without verification, trust erodes.

  Cases where the "can't" was partly the agent's fault (e.g., negligence) might blur the lines, as the other party could see it as a deliberate choice. If verification was possible but not utilized, it shifts blame to the recipient for not confirming. Defining clear boundaries for the concept will help the user categorize their cases consistently.

  In conclusion, while elements exist in existing literature, the combination is unique enough to warrant a new term. Highlighting the absence of malicious intent and the clean internal ledgers distinguishes it from related concepts. The user should synthesize signaling theory, attribution theory, and reciprocity breakdowns to frame their phenomenon, contributing a novel concept to conflict studies.
answer: |-
  This is a fascinating and under-discussed failure mode in reciprocity systems! You're right that existing concepts come close but don't quite capture the unique dynamics you're observing, particularly the **absence of deliberate action** and the resulting **mutual perception of blamelessness** blocking standard repair mechanisms. Here's a breakdown:

  1.  **Why Existing Concepts Don't Fully Fit:**
      *   **Security Dilemma:** As you note, this is about *actions* (arming, fortifying) misinterpreted as offensive intent. Your case involves *inaction* interpreted as defection. The "ledger is clean" aspect also differs – in the security dilemma, actors *know* their defensive actions might be misread but feel compelled to take them.
      *   **Noise in Repeated Games (TFT, Contrite TFT, Generous TFT):** This literature focuses on *execution errors* – someone *tried* to cooperate but their action was misimplemented (e.g., a faulty signal sent, a soldier firing accidentally). The core problem is an *erroneous action*. Your case is about the *complete absence* of an expected action due to external constraint. The repair mechanisms (contrition, forgiveness) rely on acknowledging *some* level of fault or error. In your cases, neither side feels *any* fault – the first for failing (it was unavoidable), the second for retaliating (it seemed justified).
      *   **Attribution Theory (Dispositional vs. Situational):** This gets closer, especially the fundamental attribution error (overemphasizing disposition/internal causes for others' behavior). However, as you note, it typically explains a *single judgment*. Your phenomenon is about how that *initial misattribution triggers a reciprocal action* (retaliation), which *itself* is then misattributed by the first party as *dispositional* aggression/defection, creating a self-reinforcing spiral. It's the **interactive, reciprocal escalation driven by sequential misattributions of omission as commission** that's unique.
      *   **Cheap Talk / Signaling:** This is highly relevant to the *explanation* problem ("I couldn't"). You correctly identify that the statement "I couldn't" is cheap talk – unverifiable and therefore non-credible to the recipient who suspects defection. It highlights the **critical lack of a verifiable signaling mechanism for incapacity.**

  2.  **Defining the Phenomenon & Its Core Elements:**
      This pattern deserves its own label. I propose:

      **The Reciprocity Breakdown Spiral via Unverifiable Incapacity (RBU Spiral)** or **Attributional Cascade Failure (ACF)**

      **Core Definition:** A dynamic failure in reciprocal cooperation triggered by one party's *genuinely unavoidable failure to perform an expected cooperative action*, which is *misattributed by the other party as deliberate defection*, leading to retaliatory action. This retaliation is then *misattributed by the first party as unprovoked aggression/defection*, prompting counter-retaliation. Critically, both parties maintain an *internal perception of blamelessness* (viewing their own actions as justified responses to the other's perceived defection), preventing standard repair mechanisms reliant on perceived fault or contrition, and rendering explanations of incapacity non-credible due to unverifiability.

      **Essential Elements (The "Carving"):**
      *   **Precondition:** An established or anticipated reciprocal relationship with conditional cooperation.
      *   **Trigger:** A genuine, *non-deliberate* failure by Party A to deliver an expected cooperative action, caused by *external constraint or incapacity* beyond their reasonable control ("couldn't", not "chose not to").
      *   **Misattribution 1:** Party B interprets Party A's *omission* as a *deliberate act* of defection ("wouldn't").
      *   **Action 1 (Retaliation):** Party B responds with what they perceive as justified retaliation/defection.
      *   **Misattribution 2:** Party A interprets Party B's retaliation as an *unprovoked, deliberate* act of defection ("out of nowhere").
      *   **Action 2 (Counter-Retaliation):** Party A responds with counter-retaliation.
      *   **Spiral:** Reciprocal defection escalates, often becoming entrenched.
      *   **Perpetual Blamelessness:** Both parties maintain a belief in their own righteous position and the other's culpability. Party A knows their initial failure was unavoidable; Party B knows their retaliation was a justified response to perceived defection.
      *   **Repair Failure:** Mutual blamelessness blocks apology/contrition/forgiveness mechanisms. Party A's explanations are non-credible cheap talk ("couldn't") as they are indistinguishable from what a deliberate defector *would* say. Party B sees no reason to apologize for justified retaliation.
      *   **Verification Failure:** The core incapacity is inherently difficult or impossible for Party B to verify independently at the critical moment.

  3.  **Boundaries & What Counts:**
      *   **"Partly Own Fault" Incapacity:** This *blurs* the case. If Party A's negligence *caused* the incapacity (e.g., forgot to charge the radio battery, chose a risky route knowing the checkpoint was unreliable), then Party B's attribution of "wouldn't" (or at least reckless disregard) becomes *more justified*. The core "clean ledger" for Party A is compromised. It moves towards being an *actual* (if perhaps negligent) defection rather than pure unavoidable incapacity. **Likely NOT a core case.** The purer the external constraint beyond Party A's control, the stronger the case.
      *   **Cheaply Verifiable Incapacity:** If Party B *could* have easily verified the incapacity (e.g., a quick call to a neutral third party confirming the bridge collapse, open-source satellite imagery showing the blocked road) but *didn't bother*, this significantly changes the dynamic. Party B's failure to verify becomes a key causal factor, potentially introducing fault/blame on their side. The "clean ledger" for Party B is now compromised. **This is a distinct, though related, failure mode.** It might be termed "Verifiable Incapacity Neglect" or "Attributional Laziness." The core RBU/ACF relies on the incapacity being *inherently difficult or costly to verify* at the time, making reliance on cheap talk explanations necessary but insufficient.

  4.  **Predictors of Survival vs. Spiral:**
      *   **Depth & Length of Prior Cooperation:** This is complex.
          *   *Protective:* A long, robust history builds "relationship capital" and trust. Party B might be more likely to initially suspend judgment ("Maybe something happened?") or seek clarification before retaliating. They have more invested in maintaining cooperation.
          *   *Fragilizing:* High trust and perfect history set very high expectations. A single, unexpected omission can be *more* shocking and damaging to the perception of trustworthiness ("After all we've done, they do *this*?"). The fall from grace is steeper. The cost of *not* retaliating (appearing weak, encouraging future "defection") might feel higher.
      *   **Communication Channels & Verification Mechanisms:** The presence of robust, reliable, and *trusted* channels for *verifying* claims of incapacity is crucial. Third-party verification is often key. Redundant communication methods help (if the radio dies, is there a fallback?).
      *   **Pre-existing Frameworks for Handling Uncertainty:** Do the parties have established protocols for signaling problems (e.g., "if we miss contact window X, assume technical failure, not defection, and try again at window Y")? Are there norms about granting temporary benefit of the doubt?
      *   **Cost of Retaliation vs. Cost of Verification:** If retaliation is low-cost or symbolic, it might happen faster. If verification is very costly or slow, it becomes less likely.
      *   **Perceived Stakes:** Higher stakes (existential threat, vital resources) likely increase the speed and severity of retaliation and reduce willingness to risk verification delay. Lower stakes might allow more breathing room.
      *   **Cognitive Biases & Prior Beliefs:** Parties prone to suspicion, having prior negative experiences with each other (or similar groups), or holding dispositional negative views of the other, will be quicker to attribute omission to malice.
      *   **Availability of "Face-Saving" Explanations:** Can Party B frame their *lack* of immediate retaliation as strength/prudence rather than weakness? Can Party A frame their explanation/apology as strength/reliability rather than weakness/excuse? This helps bypass the blamelessness trap.

  **Conclusion & Recommendation:**

  You've identified a distinct and important failure mode – a **Reciprocity Breakdown Spiral via Unverifiable Incapacity (RBU Spiral)** or **Attributional Cascade Failure (ACF)**. It synthesizes elements from attribution theory (misreading omission as commission), signaling theory (non-credibility of "couldn't" claims), and the dynamics of reciprocal retaliation, but its unique combination – especially the *absence of deliberate action* at the trigger and the *mutual blamelessness* blocking repair – sets it apart from the security dilemma or noise literature.

  **Coining the term explicitly in your work is valuable.** Define it rigorously using the elements above. This phenomenon likely explains many breakdowns in fragile cooperation, from interpersonal conflicts (like your departmental example) to local ceasefires and informal enforcement pacts in civil wars. Your empirical cases are gold for illustrating it.

  When analyzing resilience, focus on the **interplay between trust, verification mechanisms, communication redundancy, and the development of shared norms/handling uncertainty** as critical factors determining whether a pair survives an unavoidable omission or spirals into mutual defection fueled by self-righteousness. The "clean ledger" paradox is central to understanding why these breakdowns are so hard to reverse.
