  Okay, let me unpack this user's query. They work in assessment design for professional certification and have noticed a pattern where on-the-spot judgment reveals true competence in a way that prepared artifacts don't. The core mechanism seems different from costly signaling theory, and they want to understand the underlying principles.

  First, I need to identify the key characteristics of this phenomenon: receiver-controlled variation, unpredictability, and dynamic difficulty adjustment. The user specifically mentions three counterintuitive features that distinguish it from traditional costly signaling. 

  Hmm... the closest existing concept might be "elicited variation" or "demand-driven authenticity," but neither fully captures the receiver's role. I recall that in evolutionary biology, Zahavi's handicap principle focuses on signaler-borne costs, which doesn't fit here. The user's examples show the cost is imposed by the receiver through unpredictable requests.

  Interesting how predictability kills the effect - like when oral exam questions become known. That suggests the mechanism relies on sampling from a latent competence distribution. The "competence manifold" analogy feels right: strong performers can access any point, while others cluster around prepared samples. 

  For the reverse case (skilled people freezing under pressure), that seems like a separate issue of performance anxiety or context-dependent skill. The assessment method might be valid but miss certain competence types. I should distinguish between the validity of the method and individual response variations.

  The user needs clear boundaries: this works when the demand space is open-ended and unpredictable, but fails when candidates can pre-map all possibilities. Also important to note it doesn't measure preparation ability - which might explain why some competent people struggle with spontaneity.

  Since no perfect term exists, I'll propose "Receiver-Controlled Probing (RCP)" with strict defining criteria. The label matters less than the carve-out: this is about sampling methodology, not signal cost. Professional implications include avoiding fixed question banks and designing variation-rich assessments while accommodating different expression styles.

  The user's frustration with lacking vocabulary is palpable. They've clearly observed this deeply but need theoretical framing. I should emphasize how this differs from related concepts like VUCA or authentic assessment, and why traditional signaling theory falls short here. The reverse case discussion shows they're thoughtful about assessment limitations - that deserves careful handling.
answer: |-
  Based on your detailed description and analysis, this phenomenon is distinct from classic costly signaling theory, though related. It revolves around **receiver-controlled sampling of latent competence** rather than signaler-borne costs. Here's the conceptual carving:

  ### Core Concept: **Receiver-Controlled Probing (RCP)**
  **Definition:** A mechanism for assessing competence where reliability stems from the *receiver's* (examiner's) ability to demand *arbitrary, unpredictable variations* of performance in real-time, forcing the signaler to demonstrate the *breadth and depth* of a latent skill manifold. Reliability arises from exposing the inability to produce coherent instances outside a narrow, prepared set.

  **Mechanism Breakdown:**
  1.  **Latent Competence Manifold:** True competence exists as a flexible, interconnected "space" of skills/knowledge (e.g., understanding vocal technique, problem-solving principles, authentic experience).
  2.  **Receiver-Imposed Sampling:** The examiner probes this manifold by demanding specific, unpredictable points (variations: key change, new domain, follow-up detail).
  3.  **Discrimination via Coherence & Generativity:** Strong performers navigate the manifold fluidly, producing coherent responses at any demanded point. Weak performers reveal the *boundaries* of their preparation:
      *   **Lack of Generative Ability:** Cannot create a *new* valid instance (e.g., blank on unaccompanied singing).
      *   **Incoherence:** Cannot connect the new instance to the original or maintain consistency (e.g., story details contradict under probing).
      *   **Limited Prepared Set:** Can only reproduce specific, rehearsed instances.

  ### Why it's NOT Just Costly Signaling
  *   **Cost Location:** Costs are *imposed* by the receiver (examiner) via constraints (time, variation) *during* signaling, not inherently *borne* by the signaler in producing the *type* of signal (singing, writing). The *marginal* instance *should* be low-cost for the competent.
  *   **Predictability Kills It:** Unlike a peacock's tail (expensive regardless of anticipation), RCP *requires* unpredictability. Known variations become preparable "points," collapsing the manifold back to a rehearsed set.
  *   **Reliance on Receiver Agency:** Reliability hinges on the examiner's freedom to choose *any* variation, making the probe an active sampling process, not passive signal observation.

  ### Boundary Conditions & Failure Modes
  1.  **Predictability Collapse:** If the possible variations are finite and known (e.g., fixed question bank), candidates prepare specific responses for each point. Discrimination vanishes as competence ≠ exhaustive preparation. (*Boundary: Requires an effectively open-ended or unpredictable demand space*).
  2.  **Preparation Saturation:** If a candidate can invest upfront in preparing a sufficiently large, diverse set of instances covering the *entire plausible demand space* (e.g., memorizing 100 case studies), RCP fails. Competence is masked by rote coverage. (*Boundary: The demand space must be too large/complex for exhaustive preparation*).
  3.  **Skill Mismatch:** RCP primarily assesses *generative application* and *robustness* of skill/knowledge under variation. It may poorly assess:
      *   **Deep Revision Skills:** Excellence requiring iterative refinement (your "strong writer freezing orally").
      *   **Performance Anxiety:** The ability to perform *on demand* under pressure, distinct from latent competence.
      *   **Highly Contextualized Skills:** Competence deeply tied to specific tools/environments not replicable on-demand.
  4.  **Reverse Case (Competent but Poor On-Demand):** This highlights the distinction between **latent competence** and **performance competence under RCP conditions**. The failure isn't necessarily in the underlying skill, but in:
      *   **Performance Fluency:** Inability to access/manifest the skill spontaneously.
      *   **Anxiety/Pressure Response:** Cognitive load inhibits access to the skill manifold.
      *   **Skill Expression Modality:** Competence may be tied to a specific mode (writing vs. speaking) not probed well by RCP. RCP primarily measures the *accessibility* and *flexibility* of the competence, not its peak potential in ideal conditions.

  ### Key Distinctions from Nearby Concepts
  *   **Costly Signaling Theory:** Focuses on *signaler-borne costs* as guarantees of honesty (e.g., energy spent on a tail). RCP focuses on *receiver-imposed constraints* enabling *sampling* of latent structure. Cost is incidental (time pressure) or a tool (harder key), not the core signal.
  *   **Authentic Assessment:** While RCP *can* feel authentic, its core is *probing for generativity/robustness*, not necessarily mimicking real-world tasks. An unpredictable key change for a singer might be *less* authentic than a recording but *more* revealing of fundamental skill.
  *   **VUCA (Volatility, Uncertainty, Complexity, Ambiguity):** RCP introduces VUCA *as a tool* for assessment, leveraging uncertainty/complexity to probe adaptability. VUCA describes an environment; RCP is a method *using* those elements.
  *   **Stress Testing:** RCP shares similarities but emphasizes *arbitrary variation* and *coherence across instances* rather than just performance degradation under load. Stress is often a *byproduct*, not the sole goal.
  *   **Oral Examination Vivas:** While RCP often manifests here, traditional vivas *can* rely on predictable questions or assessment of specific knowledge points. RCP is the specific *unpredictable variation* technique within that context.

  ### When RCP Stops Working Precisely
  1.  **The Demand Space is Closed:** All possible variations are known and preparable in advance.
  2.  **Preparation Exceeds Demand Space Scope:** Candidates can invest to cover the entire plausible space.
  3.  **The Competence is Fundamentally Non-Generative:** Skill is purely reproductive (e.g., reciting facts) or relies entirely on specific, unreplicable context.
  4.  **Assessment Goal Mismatch:** The goal is to assess peak potential under ideal conditions, deep revision ability, or competence in a highly stable/predictable environment where robustness/variation isn't relevant.

  ### Professional Implications & Addressing the Reverse Case
  *   **RCP's Strength:** Ideal for assessing *adaptive expertise*, *conceptual understanding*, *authenticity of experience*, and *robustness* of skill – crucial for unpredictable professional contexts.
  *   **The Reverse Case Challenge:** Candidates with deep competence but poor spontaneous performance under RCP conditions pose a validity threat. Mitigation requires:
      *   **Multi-Method Assessment:** Combine RCP with other methods (reviewing portfolios of revised work, simulations with prep time) to capture different facets of competence.
      *   **Scaffolding RCP:** Provide slightly more time, reduce ambiguity, or allow brief notes to lower the extraneous cognitive load for those affected by anxiety, focusing the probe on the *latent skill* rather than *performance fluency* alone.
      *   **Recognizing Modality:** Acknowledge that competence expression can be modality-specific. An oral defense might not be the *only* valid way to assess a writer's skill.
      *   **Vocabulary for Failure:** Describe the reverse case as a potential **Performance-Competence Gap under Receiver-Controlled Probing**, highlighting a disconnect between latent ability and its on-demand accessibility/manifestation under specific assessment constraints.

  **In essence, Receiver-Controlled Probing (RCP) is a distinct mechanism leveraging unpredictability and receiver agency to sample the latent structure and generativity of competence, differentiating it from costly signals based on inherent signaler expenditure and collapsing when predictability or exhaustive preparation are possible.** It's a powerful tool for assessing adaptability but must be used judiciously, acknowledging its limitations with specific skill types and performance modalities.
