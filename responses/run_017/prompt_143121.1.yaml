prompt: |-
  I work in root cause analysis at a freight company, and me and two colleagues have started noticing something we keep doing, and I want to know whether it has a name.

  Our whole job is basically "what's the best story that explains this mess" — a friend who did a philosophy minor says that's got a fancy name, inference to the best explanation or abduction or something. Anyway. What we've noticed is that our best explanation tends to get *better* over time, and we don't think it's because we learned anything new. We think it's because the list of stuff the explanation is supposed to cover keeps getting quietly edited.

  Two cases.

  1. A run of late deliveries in the north region. The explanation we settled on was that the nightly batch job in the sorting software was finishing late, so vans were going out with half their loads. That covered maybe seventy percent of the incidents right away. The rest: over the next couple of months they one by one stopped being the kind of thing we were explaining. A depot that doesn't even use the batch job had late vans — that got called a dispatch problem, different failure mode. Late arrivals where the van actually left on time became transit delays, not a depot thing. Nobody ever said ignore those, and honestly each reclassification was reasonable on its own, some of them were probably right. But by the end the batch job story explained everything on the list, and the list had been trimmed to fit the story.

  2. Not work, family history. Why did my great-uncle's shop go under in the sixties? The family answer is that he was undercapitalized after the expansion. The bits that don't fit — the fire, the year his brother ran it, the near-identical shop two streets over that survived on less capital — have all, over about forty years of retelling, been reclassified as separate stories. The fire was after he'd already lost it. That year was really my grandmother's business. Again: each one plausible, maybe even correct, and the explanation now fits perfectly.

  I also think there's a mirror image. Once we'd committed to the batch job story, new complaints started getting *folded in* as extra successes — the routing complaints, the driver overtime — where before we'd committed they'd have been logged as unrelated grumbling.

  So the thing has two directions, and that might be one phenomenon or two, I can't tell.

  I had a look around and it isn't anything I could put a name to. It isn't bolting an extra assumption onto a theory to save it; nothing gets added to the batch job story. It isn't the thing where a theory explains everything and therefore explains nothing — the story has real content, it's the target that moved. I thought of the Texas sharpshooter, but as I understand it that's drawing the circle around your bullet holes after you've fired; here the target was drawn up front and then narrowed. Moving the goalposts isn't right either, that's about changing what counts as success, not about what's on the inventory.

  So: is there an established concept for this — the cumulative, individually defensible redrawing of what an explanation is answerable for, in both directions? And I don't just want a label. If there's a literature I'd want to know what the nearest concepts are and where exactly this sits relative to each. If there isn't one, then: what's the right way to carve it, when is "that's actually a different phenomenon" a legitimate move and when is it this thing, and does any of it matter for whether best-explanation reasoning can work at all, or is it just sloppy bookkeeping that a careful person could avoid?
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in root cause analysis at a freight company and noticed a pattern where their explanations improve over time not because of new information, but because the scope of what needs explaining gets adjusted. They gave two examples: one from their job with late deliveries and another from family history about a shop failing. 

  First, I need to understand the core issue. They mentioned inference to the best explanation (abduction) but feel that the target of the explanation shifts. Specifically, incidents that don't fit are reclassified as separate issues, and after committing to an explanation, new related issues get included. This two-way adjustment—trimming and folding—seems to be the crux.

  The user wants to know if there's a named concept for this. They’ve already considered and dismissed ideas like ad hoc hypotheses, Texas sharpshooter fallacy, and moving goalposts. So I should look for concepts that match both trimming and folding. 

  Looking at cognitive biases and philosophy of science, confirmation bias comes to mind, but it's broad. More relevant might be the "explanation filter" or "explanatory drift." The trimming part resembles concept creep or boundary-work, where categories are redrawn. The folding-in part is like assimilation bias or overgeneralization. 

  They also asked about legitimacy. When is reclassification valid? That ties into Kuhn's normal science versus paradigm shifts. If reclassification is based on new evidence, it's legit; if it's to preserve the theory, it's problematic. They’re concerned about whether abduction can still work if scope adjustments are subconscious. 

  The user’s deeper need might be validating their methodology. They want to ensure their root cause analyses are sound, not just storytelling. They might need frameworks to distinguish legitimate scope adjustments from bias. Practical solutions could include pre-registration of incident classifications or documentation of changes to maintain transparency. 

  I should also connect this to abduction’s limitations. While scope adjustment is part of refining theories, unchecked, it can lead to reinforced narratives. Emphasizing documentation and peer review addresses their concern about sloppy bookkeeping. Highlighting concepts like boundary-work and explanatory drift provides the terminology they seek while acknowledging the complexity of their observation.
answer: |-
  This is a fascinating and astute observation that cuts to the heart of how explanation works in practice. You've identified a very real process that sits at the intersection of cognitive science, philosophy of science, and organizational behavior. While there isn't a single universally accepted label that perfectly captures *both* directions of your phenomenon ("trimming" and "folding"), several established concepts illuminate different facets of it, and together they provide a robust framework for understanding it.

  **Core Phenomena & Relevant Concepts:**

  1.  **The "Trimming" Aspect (Excluding Incongruent Cases):**
      *   **Confirmation Bias (Selective Attention/Focus):** This fundamental cognitive bias describes our tendency to seek, interpret, favor, and recall information that confirms our preexisting beliefs or hypotheses. In your case, once the "batch job" hypothesis gains traction, incidents that *don't* fit become less salient or are actively scrutinized for reasons to exclude them. Your focus *confirms* the dominant story.
      *   **Concept Creep / Boundary-Work:** This involves shifting the definition or boundaries of a concept or category. What counts as a "late delivery caused by depot issues" versus a "transit delay" or "dispatch problem" is being redefined *in light of the preferred explanation*. The "failure mode" category is shrunk to exclude anomalies. This is often done subconsciously and incrementally ("individually defensible").
      *   **Kuhnian "Normal Science" & Anomaly Management:** Thomas Kuhn described how scientists work within a dominant "paradigm." Anomalies (facts that don't fit) are often initially dismissed, explained away, or categorized as "not relevant to the core theory" before they accumulate enough force to cause a paradigm shift. Your team is acting like scientists protecting a nascent paradigm by managing anomalies through reclassification.
      *   **Motivated Reasoning:** This is the subconscious tendency to process information in a way that leads to desired conclusions. The desire for a clear, singular root cause motivates the reinterpretation of messy data. The defensibility of each reclassification masks the underlying motivation.
      *   **"Explanation Filter":** (Less formal term) The explanation itself acts as a filter, determining what data is deemed relevant or irrelevant to the *current* investigation.

  2.  **The "Folding" Aspect (Including Congruent Cases):**
      *   **Assimilation Bias / Overgeneralization:** Once a pattern is recognized, we tend to assimilate new, even tangentially related, information into that pattern. Routing complaints and overtime *feel* related now that the "batch job causing late starts" story is dominant, even if they weren't initially linked or have other potential causes.
      *   **Pattern Matching / Apophenia (Mild Form):** Humans are wired to see patterns. Once the "batch job" pattern is established, new data points that vaguely resemble it (any depot problem, any complaint vaguely related to timing) are more readily incorporated into the pattern, potentially seeing connections that aren't strictly causal.
      *   **Halo Effect:** The perceived success or validity of the explanation for the *core* cases casts a "halo," making it seem more likely to explain *other* related problems, even if the evidence for that specific link is weak.
      *   **Scope Creep (of the Explanation):** The explanatory scope subtly expands beyond its original, justified boundaries to encompass more phenomena.

  3.  **The Combined Process & Its Drivers:**
      *   **Narrative Construction / Sense-Making:** Humans fundamentally make sense of the world through stories. Your job title literally involves finding "the best story." A good story is coherent, parsimonious, and causally clear. The trimming and folding are mechanisms to *maintain narrative coherence*. Incongruent elements disrupt the story, so they are edited out; congruent elements strengthen it, so they are incorporated. This happens dynamically as the narrative solidifies.
      *   **Cognitive Dissonance Reduction:** Holding conflicting cognitions (e.g., "This explanation is good" vs. "But it doesn't explain these cases") is uncomfortable. Reclassifying the troublesome cases reduces this dissonance.
      *   **Efficiency & Closure:** Organizations and individuals crave clear answers and closure to move on. A perfectly fitting explanation provides this, even if achieving that fit involved subtle data massage. It stops the seemingly endless investigation.
      *   **Social Reinforcement:** As an explanation gains acceptance within a group (your team, the family), there's social pressure to interpret new information consistently with it and to downplay inconsistencies. Retelling the story reinforces the edited boundaries.

  **Where It Sits Relative to Your Rejected Concepts:**

  *   **Ad Hoc Hypotheses:** You're right, you're not *adding* assumptions *to the theory itself* (like "the batch job fails *except on Tuesdays*"). You're *editing the dataset* the theory is responsible for. It's a different strategy to protect the core theory.
  *   **Texas Sharpshooter Fallacy:** Your understanding is correct. The fallacy is firing randomly *then* drawing the target. In your case, the target (the list of incidents) was defined *first*, but then *redrawn* after the "shot" (the explanation) was taken. It's retrospective redefinition of the target domain.
  *   **Moving the Goalposts:** This is usually about changing the criteria for *success* or *acceptance* of a claim *in an argument*. You're changing the *domain* the claim applies to (what counts as an incident to explain). It's related but distinct.
  *   **Explanation as Tautology:** You correctly note the explanation *does* have empirical content about the batch job. The problem isn't that it explains nothing, but that its *apparent success* at explaining *everything* (in the final dataset) is artificially inflated by data selection.

  **Does it Matter? Is it Sloppy Bookkeeping?**

  **Yes, it matters significantly, but it's not *just* sloppy bookkeeping that carefulness alone can completely avoid.** It's a fundamental feature of human cognition and collaborative sense-making:

  1.  **Threat to Validity:** This process *can* lead to accepting incorrect explanations. You might miss the *real* systemic issue because inconvenient data was excluded, or over-attribute problems to the favored cause. The "undercapitalized" story might obscure other crucial family dynamics.
  2.  **Reinforces Echo Chambers:** It can solidify groupthink around a potentially flawed narrative.
  3.  **Undermines "Best Explanation" Reasoning:** Inference to the Best Explanation (IBE) relies on comparing theories *against a fixed set of data*. If the data set itself is malleable based on the leading theory, the comparison becomes circular and unreliable. The "best" explanation might simply be the one that most effectively shaped the data to fit it.
  4.  **Inherent Cognitive Bias:** While carefulness helps, these biases are deeply ingrained. Completely avoiding subconscious trimming and folding is extraordinarily difficult. It requires constant, deliberate vigilance.

  **Is it Ever Legitimate? How to Carve It?**

  *   **Legitimate Reclassification:** Reclassification is legitimate when driven by **new, independent evidence** that genuinely clarifies the nature of the event, *not* primarily by the desire to fit a favored explanation.
      *   *Example:* Investigating the depot that didn't use the batch job and finding conclusive proof (e.g., dispatch logs showing drivers were sent to the wrong locations) that it *was* a dispatch error *is* legitimate. *Assuming* it must be different *just because* it doesn't fit the batch job theory is not.
      *   *Carving Principle:* The justification for reclassification should stand independently of the leading hypothesis. The evidence supporting the reclassification should be evaluated *before* knowing whether it helps or hurts the current favorite theory.
  *   **Legitimate Expansion:** Incorporating new cases is legitimate when there is **positive evidence of a causal link** to the identified root cause, not just correlation or thematic similarity.
      *   *Example:* If analysis shows the batch job delays *directly caused* specific driver overtime on those routes because loading took longer, folding in overtime is legitimate. Folding it in *simply because* overtime complaints happened around the same time is not.
      *   *Carving Principle:* Establish the causal mechanism linking the root cause to the *new* symptom *before* incorporating it as supporting evidence. Demonstrate it's not just coincidence or correlation.

  **Mitigating the Phenomenon in Root Cause Analysis:**

  1.  **Pre-Register the Dataset:** Before deep analysis, rigorously define the scope: "What specific incidents *exactly* constitute the problem we are investigating *right now*?" Document this list. Any changes require explicit justification recorded in the analysis log.
  2.  **Blind Analysis (Where Possible):** Have someone unfamiliar with the leading hypothesis categorize new incidents or re-examine anomalies *before* they are compared against the hypothesis.
  3.  **Seek Disconfirming Evidence Actively:** Make it a formal step: "How could we *prove* this root cause is *wrong*? What evidence would contradict it?" Then look for that evidence. Actively investigate anomalies *as potential counter-evidence*, not just nuisances to reclassify.
  4.  **Alternative Hypotheses:** Force the generation and serious evaluation of competing hypotheses *against the original, fixed dataset*. Don't let one story dominate early.
  5.  **Document Evolution Meticulously:** Keep a clear audit trail: "Incident X was initially included. On [date], after [evidence/reasoning], it was reclassified as Y." "Symptom Z was added to the scope on [date] because [evidence of causal link]." This transparency reveals the process.
  6.  **Peer Review & Challenge:** Have colleagues explicitly challenge the boundaries: "Why was *this* incident excluded?" "Why is *that* symptom now included? What's the direct causal link?"
  7.  **Acknowledge Complexity & Multi-Causality:** Explicitly state that not every instance within the defined scope *must* have the same single root cause. The "best explanation" might explain the *majority pattern*, while acknowledging outliers or contributing factors.

  **Conclusion:**

  You've identified a crucial and subtle process best described as the **dynamic co-evolution of explanation and explanandum** driven by **narrative coherence, cognitive biases (especially confirmation bias and assimilation bias), and motivated reasoning**, operating through **concept creep/boundary-work (trimming)** and **overgeneralization/assimilation (folding)**.

  While not having one perfect name, it's a recognized challenge within philosophy of science (Kuhnian anomaly management, theory-ladenness of observation), cognitive psychology (confirmation bias, motivated reasoning), and organizational learning.

  It *does* pose a significant challenge to the reliability of "Inference to the Best Explanation" in practice, as it can corrupt the data against which theories are judged. Careful procedural safeguards (pre-registration, documentation, seeking disconfirmation, evaluating alternatives) are essential to mitigate it, but complete elimination is likely impossible due to inherent cognitive biases. The goal is to make the process conscious, transparent, and evidence-driven, rather than subconscious and theory-driven. Your awareness of it is the critical first step towards more robust root cause analysis.
