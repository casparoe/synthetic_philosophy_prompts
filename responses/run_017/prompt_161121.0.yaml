prompt: |-
  Morning — I'm the (unpaid, no legal training whatsoever) governance secretary for a housing co-op with about 900 members, and one of my jobs is screening every proposed rule change before it goes on the ballot for a general meeting. We meet two or three times a year, pass maybe six amendments a year, and I'm the one who has to stamp each proposal "in order" or send it back to whoever drafted it. I get about twenty minutes a proposal, sending something back costs us a month because of the notice period, and a board of nine has to sign off on whatever I've certified — so I need something I can actually point at and work through, not my own vibes. The bit that keeps biting me is self-amendment. Our rulebook can change itself and says so out loud: Rule 31 says any rule, including Rule 31 itself, can be amended by a two-thirds majority at a general meeting with fourteen days' notice. And members keep handing me amendments that do things to the machinery of amendment itself, usually by accident but sometimes quite deliberately. Can a two-thirds vote be used to take some rule out of the reach of future two-thirds votes? If an amendment lowers the quorum, was it validly passed under the old quorum or can it bootstrap itself in under the new one? What do I even do with an amendment that says of itself that it may never be amended or repealed — does it fail, does it take effect but do nothing, or does the rulebook just now contain two rules that contradict each other? And there's an audit problem too: an old amendment gave Rule 19 its own special amending procedure (approval by the management committee), then a later amendment abolished the management committee, so Rule 19 is still on the books and as far as I can tell nobody can now amend it at all.

  My brother did a philosophy degree and says this is exactly what a game called Nomic was invented to play with, and that there's a book about it. I don't want a reading list or a bibliography — I can't get to a university library and I wouldn't read it anyway, so please don't give me sources or citations. What I do want is the actual logic of self-reference and self-amendment turned into an intake procedure: the questions to ask, in order, on each proposal I recieve; what counts as a sufficient answer to each; the point at which the procedure stops with a "no, send it back"; and the point at which it has to hand the decision to a human being because the question is really about what the co-op wants to be able to bind itself to, not about what the rules say. I've started informally sorting proposals into four buckets and I'd like you to tell me which of these distinctions actually need to survive and which are clutter: (1) order — does the amendment touch the amending rule rather than just some first-order rule; (2) reach — does it operate on itself, e.g. retroactively or by repealing its own enabling procedure once it takes effect, i.e. one-shot versus continuing amendments; (3) orphans — does it leave some rule whose amendment route no longer exists; (4) stacking — does it change the threshold, quorum or manner-and-form in the same vote as some substantive change. I also need a tie-break rule, since our rulebook is completely silent on it: when two rules genuinely conflict, do I go later-in-time, higher-order-wins, or more-specific-wins, and whatever you pick, be honest about whether it's derivable from anything or is just a choice we'd be making. And please be straight about which steps are judgement dressed up as procedure — I'd rather know than ship a form that looks rigorous and isn't. British English throughout, please (organisation, favour, judgement), and plain language: the person running this is a volunteer with a spreadsheet, not a lawyer.

  Here's the rulebook as it stands and the three live proposals I want you to run the finished procedure on:

  - **Rule 31**: any rule, including this rule, may be amended by a two-thirds majority at a general meeting of which fourteen days' notice has been given. Quorum for a general meeting is 40 members.
  - **Rule 3**: membership is open to any adult who pays the subscription.
  - **Rule 7**: no member may be expelled without a hearing.
  - **Rule 12**: the treasurer must publish accounts quarterly.
  - **Proposal A** (from a member, looks harmless): Rule 7 may only be amended by a three-quarters majority at two consecutive general meetings.
  - **Proposal B** (from the management committee, and the one I'm under pressure to let through as a single motion before the AGM): the quorum for a general meeting is reduced to 12 members, and Rule 3 is amended to restrict membership to people who have lived in the borough for at least two years.
  - **Proposal C** (from a member who has clearly thought about this too much): Rule 12 is repealed with immediate effect, and this amendment may not be amended or repealed.

  Please run the procedure on all three and give me the verdict on each, including at least one where the answer goes against something I want — I'd guess B is going to be that one, since if it has to be split the quorum fix definately won't land before the AGM and I'll be the one explaining that to the committee. Then tell me what the procedure can't do: which kinds of proposal it will always get wrong or stay silent on, and what I should do with those besides guessing.
reasoning: |-
  Okay, the user is the governance secretary for a housing co-op with about 900 members. They screen rule changes before they go to a vote. Their main challenge is dealing with self-amendment issues in the rulebook, specifically Rule 31, which allows any rule to be amended by a two-thirds majority. They need a practical, step-by-step procedure to evaluate proposals quickly, without legal jargon. 

  They mentioned four buckets they’ve started using: order (does it touch the amending rule), reach (does it operate on itself), orphans (does it leave rules unamendable), and stacking (does it mix procedural and substantive changes). They want to know which distinctions are useful and which are clutter. 

  The key problems they face include whether a rule can be made harder to amend, validity of amendments that change quorum, unamendable rules, and conflicts like Rule 19 which can’t be amended now. They also need a tie-break rule for conflicts since the rulebook is silent. 

  They provided three proposals:
  - **Proposal A**: Makes Rule 7 harder to amend (three-quarters majority at two meetings).
  - **Proposal B**: Lowers quorum to 12 and restricts membership (Rule 3).
  - **Proposal C**: Repeals Rule 12 and declares itself unamendable.

  The user needs a clear procedure that’s efficient, as they only have 20 minutes per proposal. They want to avoid sending things back unnecessarily but also catch problematic amendments. They’re a volunteer, so the process must be straightforward without requiring legal expertise. 

  Deep needs: They likely want to prevent future governance crises by ensuring amendments don’t create logical inconsistencies or trapdoors. They also need to maintain legitimacy without legal backing, so the procedure must be defensible to the board and members. The unspoken stress is being blamed for delays (like if Proposal B is split), so the system must justify tough calls objectively.

  Breaking down the procedure steps: Start with self-reference checks (does it touch Rule 31?), then self-application (does it affect its own validity?), orphan checks, stacking issues. For conflicts, later-in-time makes sense as it’s common and avoids hierarchy disputes. 

  For Proposal A: It’s stacking because it changes Rule 7’s amendment process but doesn’t alter Rule 31. The conflict is that Rule 31 allows amendment by two-thirds, but A requires more. Later-in-time would make A override Rule 31 for Rule 7 only, so it’s valid. But must note the inconsistency—Rule 31 still says "any rule," which is now untrue for Rule 7. Still, it passes the procedure because it doesn’t break the self-amendment mechanism.

  Proposal B: Here’s the problem child. It combines quorum change (procedural) with membership (substantive). The quorum change affects the vote passing it. Since the old quorum was 40, but they’re voting with whoever shows up, if fewer than 40 attend, the amendment might be invalid. So it’s a stacking issue that creates uncertainty. The procedure should flag this as invalid unless split. The user will have to face the committee, but the logic is clear: self-application risk.

  Proposal C: Attempts to make itself unamendable. This violates the self-amendment principle because Rule 31 allows any rule to be changed. A rule claiming immunity contradicts Rule 31. Since later-in-time applies, if passed, it would override Rule 31 for itself but create a conflict. The procedure catches this as a self-application problem—it’s trying to bind future amendments impossibly. Verdict: invalid. 

  The procedure’s limits: It can’t handle ambiguous language or predict member intent. Also, if an amendment creates a paradox (e.g., "no rules can be amended"), it might pass the steps but break the system later. For those, the user should escalate to the board with a clear explanation of the risk. 

  Tie-break rule: Later-in-time is practical—it’s how most systems handle conflicts. It’s not derived from the rules but is a sensible default. Admitting it’s a choice helps transparency. 

  Refining their buckets: Order and reach are crucial. Orphans are critical (like Rule 19). Stacking is vital for mixed proposals. But "reach" might be folded into self-application. Keeping them separate adds clarity. 

  Final procedure steps: 
  1. Check for self-reference (Rule 31 touch). 
  2. Self-application (does it affect its own passage?). 
  3. Orphan check. 
  4. Stacking check. 
  5. Conflict assessment (if any, later-in-time). 

  For each "yes," the proposal might be invalid unless resolvable. The user’s role is to catch inconsistencies, not judge policy. Escalate only when logic fails, like ambiguous wording. 

  This balances rigor and practicality, giving the user a defensible tool without overcomplicating.
answer: |-
  Here's a self-amendment intake procedure designed for your constraints: a 20-minute, non-legal, spreadsheet-friendly checklist. It prioritises **certainty** and **avoiding logical traps** over policy debates. Your four buckets are all relevant—keep them, but reframe as sequential steps.

  ### Core Principles
  1.  **Rule 31 is the Engine:** Amendments happen *because* Rule 31 says they can. Any proposal undermining this engine's core function creates uncertainty.
  2.  **Self-Application is Dangerous:** An amendment altering the rules *used to pass it* risks invalidity or paradox. Treat these as high-risk.
  3.  **Orphans Break the System:** If a rule becomes unamendable, the rulebook is broken. Prevent this.
  4.  **Stacking Creates Ambiguity:** Changing procedure *and* substance in one vote risks the substance passing under invalid/unclear conditions.
  5.  **Conflict Resolution Default:** When rules genuinely conflict, **later-in-time wins**. This is a practical necessity, *not* derived from your rules. State this openly to the board.

  ---

  ### The Intake Procedure (Run in Order - Stop at any "No")
  *(For each proposal, ask these questions sequentially. A "Yes" to Step 2, 3, 4, or 5 requires scrutiny; "Yes" to 6a/b/c likely means "Send Back").*

  1.  **Order Check:** Does the amendment *explicitly* alter Rule 31 (the amending rule) or the amendment procedure of *another specific rule* (like Proposal A does for Rule 7)?  
      *   **No:** Proceed to Step 5. (It's likely a simple substantive change).
      *   **Yes:** Go to Step 2. (High-risk category).

  2.  **Reach (Self-Application) Check:** Does the amendment *alter the conditions* (majority, quorum, notice, procedure) *for its own passage or validity?* (e.g., Proposal B lowers the quorum *in the same vote* that needs quorum).  
      *   **No:** Go to Step 3.
      *   **Yes:** **Send Back Immediately.** Reason: "Amendment attempts to alter the rules governing its own validity, creating unacceptable uncertainty. Proposer must split procedural changes (to Rule 31) and substantive changes into separate votes, taken *in that order*." (This is the most critical filter).

  3.  **Orphan Check (Future):** If passed, would this amendment make *any* existing or new rule **impossible to amend** under the *resulting* rulebook? (e.g., like your Rule 19, or Proposal C attempting to make itself immutable).  
      *   **No:** Go to Step 4.
      *   **Yes:** **Send Back Immediately.** Reason: "Amendment would create an unamendable rule ('orphan'), rendering part of the rulebook permanently inflexible and contradicting the self-amendment principle of Rule 31."

  4.  **Orphan Check (Present):** Does this amendment *rely on* an amendment procedure (e.g., "Management Committee approval") that *no longer exists* or is *contradicted* in the *current* rulebook? (e.g., trying to use the old Rule 19 procedure *after* the committee was abolished).  
      *   **No:** Go to Step 5.
      *   **Yes:** **Send Back Immediately.** Reason: "Amendment relies on a defunct or invalid amendment procedure. Proposer must use the current Rule 31 procedure or first reinstate a valid specific procedure."

  5.  **Stacking Check:** Does this single amendment proposal contain **both**:
      *   a) A change to *amendment procedure* (for Rule 31 or another rule's specific procedure), *or* a change to general meeting procedure (quorum, notice)? **AND**
      *   b) A *substantive change* to another rule (membership, accounts, expulsion, etc.)?
      *   **No:** Go to Step 6. (Likely "In Order").
      *   **Yes:** **Send Back Immediately.** Reason: "Amendment combines procedural changes with substantive changes ('stacking'). This creates ambiguity about the validity of the substantive change. Proposer must split procedural changes and substantive changes into separate proposals, voted on *in that order*."

  6.  **Conflict & Certainty Check (Judgement Step - Escalate if Unsure):**
      *   **a) Internal Conflict:** Does the amendment *as written* contain clauses that directly contradict *each other*? (Rare, but possible).  
          *Yes = Send Back:* "Amendment contains internal contradictions."
      *   **b) Rulebook Conflict:** Does the amendment *as written* directly contradict an *existing* rule *without* explicitly amending or repealing that rule?  
          *Yes = Send Back:* "Amendment creates direct conflict with Rule [X] without amending it. Proposer must explicitly amend/repeal Rule [X]."
      *   **c) Ambiguity:** Is the wording so unclear that members cannot reasonably understand what they are voting for, or how it interacts with other rules?  
          *Yes = Send Back:* "Amendment wording is ambiguous regarding [specific point]. Clarify wording."
      *   **No to a/b/c:** **Stamp "In Order"**. (Proceed to Board sign-off. Your job is done on logic. Policy is for the members).

  **Tie-Break Rule (For Board/Meeting Use Only):** "If two rules conflict and cannot be reconciled by interpretation, the rule passed *later in time* prevails." *Tell the Board:* "This is a practical default we *must* adopt to resolve conflicts. It is not derived from our current rules but is necessary for the system to function. We recommend members formally adopt this principle."

  ---

  ### What the Procedure Can't Do (And What To Do)

  1.  **Policy Judgements:** It won't tell you if an amendment is *wise*, *fair*, or *in the co-op's best interests*. Only if it's logically sound under Rule 31.
      *   *What to do:* Once stamped "In Order", policy debates happen at the meeting. Your job is screening logic, not merit.

  2.  **Ambiguous Wording (Post-Check):** It catches *obvious* ambiguity (Step 6c). Subtle ambiguity might slip through.
      *   *What to do:* Flag *any* wording doubts to the proposer *informally* before Step 6. Say: "This phrasing *could* be read as [X] or [Y]. Do you mean [X]?" If unresolved, escalate wording concerns to the Board at sign-off as a "potential clarity issue" even if it passes Step 6.

  3.  **Future Paradoxes:** It prevents *obvious* orphans and self-application traps. It can't predict every clever future paradox members might invent (like Nomic players do!).
      *   *What to do:* If a proposal gives you a *new* logical headache Step 6 hasn't covered, **escalate it immediately to the full Board with your specific concern**. Don't guess. Say: "This creates a novel potential paradox: [Explain simply]. The procedure doesn't cover this. Board decision needed on whether to allow the vote."

  4.  **"Legal" Validity Challenges:** It ensures *internal* consistency with Rule 31. It doesn't guarantee the amendment is *legally* valid under UK housing/co-op law.
      *   *What to do:* Explicitly note in your role description/reports: "Screening is for internal rulebook logic only, not external legal compliance." Flag *obvious* potential legal red flags (e.g., Proposal B's residency rule *might* risk discrimination claims) to the Board *as a policy concern*, not a logic failure.

  ---

  ### Running the Proposals

  *   **Proposal A:** Amend Rule 7 to require 3/4 majority at two meetings.
      *   Step 1: **Yes** (Alters amendment procedure for Rule 7).
      *   Step 2: **No** (It doesn't change the rules for *its own* passage under Rule 31).
      *   Step 3: **No** (Rule 7 remains amendable, just harder. Rule 31 still applies to other rules).
      *   Step 4: **N/A** (Uses current Rule 31).
      *   Step 5: **No** (It's purely a procedural change for Rule 7, no substantive change stacked).
      *   Step 6: **No** (Clear wording, conflicts only arise *if passed*: Rule 31 says "any rule by 2/3", new Rule 7 says "Rule 7 requires 3/4 & two meetings". Later-in-time resolves this *after* passage).
      *   **Verdict: IN ORDER** (The conflict is resolved by later-in-time *after* adoption. Your job is passage logic, not post-passage harmony). *Tell the Board:* "Passes checks. Note: If passed, Rule 7's specific procedure overrides Rule 31 for Rule 7 only (later-in-time)."

  *   **Proposal B:** Reduce quorum to 12 & amend Rule 3 (membership).
      *   Step 1: **No** (Doesn't explicitly alter Rule 31 or another rule's procedure. Quorum is likely defined *within* Rule 31 or a meeting rule referenced by it).
      *   Step 2: **N/A** (Skipped as Step 1 was No).
      *   Step 3: **N/A**
      *   Step 4: **N/A**
      *   Step 5: **Yes** (Combines procedural change (quorum reduction) with substantive change (Rule 3 membership criteria) in one vote).
      *   **Verdict: SEND BACK IMMEDIATELY** - "Amendment combines procedural change (quorum) with substantive change (Rule 3 membership criteria) ('stacking'). Split into two proposals: (1) Amend Quorum (Rule 31 or relevant meeting rule) to 12 members. (2) Amend Rule 3 membership criteria. Proposal (1) must be voted on *first*." *(This is the tough but necessary call. Explain to the Committee: "If this passes with only 15 members present, was the quorum change valid under the old 40 rule? This uncertainty risks the entire amendment being challenged later. Splitting removes the risk.")*

  *   **Proposal C:** Repeal Rule 12 & declare itself unamendable.
      *   Step 1: **No** (Repeals Rule 12, adds a new rule about itself).
      *   Step 2: **N/A**
      *   Step 3: **Yes** (It declares *itself* unamendable. If passed, this new "immutable" rule becomes an orphan - Rule 31 says "any rule" can be amended, but this rule claims it cannot).
      *   **Verdict: SEND BACK IMMEDIATELY** - "Amendment attempts to create an unamendable rule ('orphan'), contradicting the self-amendment principle of Rule 31. Remove the clause declaring this amendment unamendable." *(The repeal of Rule 12 alone would likely be "In Order", but the self-immortalising clause breaks it).*

  ---

  **Summary for the Board:** "This procedure ensures amendments work within Rule 31's self-amendment system without creating logical inconsistencies, orphans, or self-validating loops. It flags policy/logistical mixes (stacking) needing split votes. It defaults to later-in-time for conflicts. It cannot judge policy merit, subtle wording, future cleverness, or external law. Ambiguous or novel paradox proposals need your direct input." **You are the logic gatekeeper, not the policy decider.** This structure gives you defensible, non-vibes-based reasons for your decisions.
