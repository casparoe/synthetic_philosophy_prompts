  ## National Transparency Register: Citizen Guidance Leaflet  
  *(Issued by the Ministry of Public Rationality & Social Coordination)*

  **1. What is the National Transparency Register (NTR)?**  
  The NTR is a secure, mandatory repository for every citizen’s Decision Program (DP). Your DP is a machine-readable algorithm determining your action (Cooperate or Defect) in any one-shot Prisoner's Dilemma interaction with another citizen. Upon interaction initiation, the Register provides each party the other’s current, certified DP. This ensures fully transparent, strategically sound engagements.

  **2. Why was the NTR established?**  
  Prior to the NTR, interactions suffered from information asymmetry and unpredictable outcomes, leading to widespread suboptimality and social distrust. The NTR mandates mutual transparency, enabling citizens to rationally select actions based on complete knowledge of counterparty intent. This fosters stability and unlocks mutually beneficial cooperative equilibria previously inaccessible.

  **3. What are the technical requirements for my DP?**  
  Your DP must:
  *   Be submitted in an Approved Readability Standard (ARS-7.2, see Annex B).
  *   Terminate execution within **10,000 clock cycles** when provided any other citizen’s DP as input.
  *   Output definitively either COOPERATE or DEFECT.

  **Guidance:** If your DP relies on simulating another DP, ensure simulation depth limits are implemented. Programs exceeding the cycle limit during verification or interaction are deemed non-compliant and default to DEFECT for that interaction. We strongly advise rigorous cycle-limit testing before submission. The Ministry offers free simulation sandboxes (visit NTRPortal.gov/sandbox).

  **4. What are common DP models?**  
  Citizens typically adopt one of three prudent approaches:
  *   **Model A (Unconditional Cooperation):** Always outputs COOPERATE. Simple, fosters goodwill.
  *   **Model B (Unconditional Defection):** Always outputs DEFECT. Safeguards against exploitation.
  *   **Model C (Conditional Cooperation):** Outputs COOPERATE *only* if the counterparty’s DP can be formally proven (within cycle limits) to output COOPERATE *when provided with this exact DP as input*. Otherwise outputs DEFECT. This is the **recommended model** for responsible citizens seeking robust, mutually assured cooperation.

  **5. Why is Model C recommended?**  
  Model C represents the height of strategic prudence. It guarantees cooperation only with entities demonstrably committed to reciprocity under NTR rules, eliminating vulnerability to exploitation while enabling high-value cooperative gains. Statistics show Model C filers achieve significantly higher average payoffs than Model A filers, while maintaining security comparable to Model B. It embodies rational trust through verifiable proof.

  **6. My twin/spouse/clone and I intend to file identical Model C DPs. Will we cooperate?**  
  Yes. A correctly implemented Model C DP, when presented with an *exact copy* of itself, can prove that the copy will output COOPERATE (because the copy, being identical, runs the same proof). This results in mutual cooperation. The NTR celebrates such alignment of strategic intent. (Note: Disputes arising from non-identical filings within relationships are not within the Register's remit.)

  **7. What is a Verified Clique (VC) Certification?**  
  A VC Certification is awarded to a specific, mutually compatible DP design. Citizens filing a VC-certified DP are guaranteed mutual cooperation *only with other holders of the identical VC certificate number*. This streamlines cooperation within specialised groups (e.g., professional associations, affinity networks).

  **8. What if I don’t want VC Certification?**  
  VC Certification is voluntary. Non-certified filers remain fully compliant. Model C DPs will cooperate with non-certified filers only if they can independently prove the non-certified DP will reciprocate cooperation. Model C DPs typically defect against non-certified filers due to proof complexity exceeding cycle limits. Choosing non-certification is a valid personal strategy, acknowledging potentially reduced cooperative opportunities.

  **9. My DP is unique/uses a novel ARS-7.2 extension. What if the Register cannot parse it?**  
  Submissions failing automated readability checks are rejected. Minified, obfuscated, or compiled code is strictly prohibited. If you believe your ARS-7.2 compliant DP was incorrectly rejected, you may appeal to the Readability Appeals Tribunal (NTRPortal.gov/appeals). **Crucially:** During any interaction, if your DP's output cannot be determined by the counterparty's DP within its cycle limit (e.g., due to novel logic), you will be treated as DEFECTING by that counterparty. Ensure your logic is transparently interpretable.

  **10. Does the NTR force me to cooperate?**  
  Absolutely not. The NTR mandates *transparency*, not any specific action. The success of the Register is demonstrated by the full spectrum of rational strategies it accommodates. For instance, citizens filing Model B (Unconditional Defection) enjoy complete compliance with the law. Their transparent signalling of intent allows others to adjust expectations rationally, minimising wasted cooperative effort. Statistics indicate Model B filers experience remarkably consistent, if modest, outcomes – a testament to the system's stability. Similarly, Model C filers prudently defect against Model A filers, correctly identifying exploitable strategies. This behavioural diversity, made possible and predictable by universal transparency, is a core achievement of the NTR.

  **Remember:** File your DP by the deadline. Re-file promptly upon any strategic update. Verify readability. Embrace transparent rationality. The NTR – enabling predictable outcomes for a harmonious society.

  **Need Help?** Contact the NTR Helpline: 0800-RATIONAL (728-6425) | NTRPortal.gov  
  *"Seeing Clearly, Acting Optimally"*
