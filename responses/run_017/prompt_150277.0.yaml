   Let's do the numbers.

   States: s1 (win), s2 (loss), P(s1)=0.5, P(s2)=0.5.

  Utility function: 
     If she buys in s1: 2 (net: 3-1=2)
     If she buys in s2: -1 (net: 0-1=-1)
     If she doesn't buy: 0

  Procedures:

     Procedure N (no signal): 
          She can choose to buy or not.
          EU(buy) = 0.5*2 + 0.5*(-1) = 1 - 0.5 = 0.5
          EU(not buy)=0
          So she buys, EU=0.5.

     Procedure S (signal): 
          She gets the signal and learns the state.
          But then she is not allowed to buy, so only can choose not to buy, getting 0.
          So EU=0.

   Therefore, she chooses Procedure N and gets 0.5, while Procedure S gives 0.0. So the expected value of the signal (when choosing Procedure S) is -0.5 compared to Procedure N.

   Moreover, the expected value of the information in Procedure S is 0, while in Procedure N it is 0.5, so the information has negative value in this context.

  Which premise of Good's theorem fails? 

  Good's theorem assumes that the set of available actions is the same with or without the signal. Here, with the signal, the action "buy" is not available, while without the signal, it is available. So the action set changes.

   Additionally, the theorem assumes that the decision maker can condition her action on the signal, but here, after getting the signal, the action set is reduced.

  What room is left? The only available route is that the signal changes the set of available actions.

   If we delete the feature that the signal removes the action (i.e., if we allow the agent to buy even after knowing the outcome), then in Procedure S, after seeing the signal, in s1 she would buy and get 2, in s2 she would not buy and get 0, so EU=0.5*2 +0.5*0=1.0, which is better than Procedure N's 0.5. Then the theorem holds: having the signal is better.

  What would someone who thinks the theorem is airtight say? They might say that the theorem assumes a fixed action set, and this case violates that assumption. Therefore, it's not a counterexample to the theorem as stated with its assumptions. And they would be right. 

  The question is whether the assumption of a fixed action set is reasonable. In many realistic scenarios, information can change the action set (e.g., by making you ineligible for some actions). So the theorem's assumption is not always true.

  The restated theorem that is true without being empty should include the condition that the set of available actions does not depend on the signal or on the state of information.

   "If an expected-utility maximizer has a fixed set of actions available, and if she updates by conditionalization, and if the signal is free and only affects her beliefs, then the expected utility of having the signal and then choosing an action is at least as high as not having it."

   In this case, the action set is not fixed, so the theorem doesn't apply.

   So for the problem sheet:

   Theorem (restated): For a decision maker with a fixed utility function and a fixed set of available actions, who updates by conditionalization, and for a signal that is costless and which only affects the decision maker's beliefs (i.e., does not change the available actions or the utility function), the expected utility of having access to the signal and being able to condition her action on it is at least as high as not having the signal, and strictly higher if the signal is informative and potentially useful for the decision.

   In our case, the action set changes, so the theorem doesn't apply.

   Therefore, the clinical trial example and the lottery example we've discussed are not counterexamples to the core theorem, but they show that when the action set depends on information, information can be harmful.

   But in the lottery example above, we have a clear case where the expected utility of the signal is negative when we force the comparison between two procedures.

   So for the handout, we'll use the lottery example.

