  We are going to construct a case where a rational expected-utility maximizer, updating by conditionalization, with a fixed utility function over outcomes, and with a free signal (no cost, no side effects) that she can act on arbitrarily, is strictly better off declining the signal. The expected value of the signal (the difference between the expected utility after getting the signal and before, when she can choose to ignore it) must be negative.

  Constraints:
  1. One agent only, no other agent's strategy adapts to the signal (so no game theory). If there's a fixed institutional rule, we must argue it's not a second agent.
  2. The signal is free: no cost of any kind (acquisition, attention, time, etc.).
  3. No demons, no perfect predictors, bounded utilities, finite state spaces.
  4. Realistic setting, one paragraph, with probabilities in small tables.
  5. The signal is ordinary: it only changes beliefs.

  6. The negative value cannot be stipulated by a utility function that directly disvalues knowing. It must be something that arises from the structure and that we can argue for independently.

  We are going to violate one of the assumptions of Good's theorem. Good's theorem assumes that the decision maker can condition her action on the signal. The theorem states that for any decision problem, the expected utility when having the signal is at least as high as without, and strictly higher if the signal is sometimes useful. The proof relies on the fact that the decision maker can always choose to ignore the signal and do what she would have done without it. Therefore, she can't be worse off.

  The only way to get a violation is if the act of getting the signal itself (even though free and without direct cost) forces the decision maker to change her behavior in a way that she cannot avoid, and that change leads to a worse outcome. But note: the decision maker is free to act on the signal however she likes, including ignoring it. So how can she be forced?

  The trick is to have a situation where the decision maker, by the very fact of having the signal, is constrained in her ability to commit to a course of action that would have been available without the signal. In particular, we can design a case where the decision maker would like to commit to an action in advance, but once she has the signal, she cannot resist using it (because she is rational and will update and choose the best action given her new beliefs). This is sometimes called the "value of commitment" and the lack of commitment can make information harmful.

  However, note: the decision maker is always allowed to ignore the signal. But if she ignores the signal, then she is in the same situation as if she never got it. So how can she be worse off? The key is that the availability of the signal might change the set of available actions in a way that is not under her control. But in our setup, the signal does not change the world except for her beliefs. So the actions available should be the same.

  We must find a scenario where the decision maker, after receiving the signal, cannot take an action that she could have taken without the signal. How? This seems impossible because the signal doesn't change the physical world. But note: some actions might require the decision maker to be in a particular epistemic state. For example, an action might be only available if the decision maker does not know a particular fact. This is the concept of "information-induced inability".

  We are going to set up a case where having the signal prevents the agent from taking an action that she could have taken without the signal, because that action requires her to be ignorant. This is the only route left under the constraints.

  But note constraint (5): the signal only changes what the agent believes. How can that remove an action? We must argue that the action is defined in a way that requires a particular state of belief. For example, in a legal setting, you might be allowed to plead the fifth only if you don't know the answer. Or in a medical trial, you might be eligible only if you don't know your condition. This is the idea.

  Setting: A clinical trial for a new drug. The agent is a patient with a disease. There are two possible states of the world: 
     S1: The drug is effective for her condition (state s1).
     S2: The drug is not effective (state s2).

  Actions available to the patient:
     Action A: Enroll in the trial. If she enrolls, then:
          - If the drug is effective (s1), she gets the drug and is cured (utility 10).
          - If the drug is not effective (s2), she gets a placebo and remains sick (utility 0).
          - Additionally, she gets a payment of 1 for participation (so utility 11 in s1, 1 in s2).

     Action B: Do not enroll. Then she gets the standard treatment, which gives her a utility of 5 regardless of the state.

  But wait, without the signal, she doesn't know the state. She has prior beliefs: P(s1) = p, P(s2)=1-p.

  Now, suppose that the trial has an eligibility requirement: the patient must not know whether the drug is effective for her. If she knows (or has received a signal that tells her), then she is ineligible and cannot enroll. Without the signal, she is eligible because she doesn't know.

  We can model the signal as a test that tells her whether the drug is effective for her. The test is free and perfectly accurate. But if she takes the test, then she knows the state and becomes ineligible for the trial. Without the test, she is eligible.

  So the actions available change: without the test, she can choose A (enroll) or B (not enroll). With the test, if she takes it, then she knows the state and cannot choose A. Then she is forced to choose B (and get 5) regardless of the state. But note: if she takes the test and then learns s1, she would have wanted to enroll but cannot. If she learns s2, she is happy to choose B (since 5>1). But without the test, she might have chosen A and gotten an expected utility that is higher.

  We have to show that for some prior, the expected utility without the test is higher than with the test.

  Let:
     Prior: P(s1) = p.

  Without the test:
     If she chooses A: EU(A) = p * 11 + (1-p) * 1 = 10p + 1.
     If she chooses B: EU(B) = 5.

  She will choose A if 10p+1 > 5, i.e., p > 0.4.

  So without the test, she gets max(10p+1, 5).

  With the test: she must take the test? Actually, we are offering her the choice to take the test or not. But in the scenario, if she takes the test, then she becomes ineligible for A. So she ends up with B and gets 5. But wait, that would mean that the test always leads to 5. Then the expected utility of taking the test is 5.

  Without the test, she gets max(10p+1, 5). So if p>0.4, she gets 10p+1, which is greater than 5. Therefore, for p>0.4, she is better off without the test.

  But note: the test is free and she can choose to take it or not. However, if she takes it, she gets 5. If she doesn't take it, she can get max(10p+1, 5). So she will only take the test if 5 > max(10p+1,5) which is never true. So she would never take the test. Therefore, the expected value of the test is negative only in the sense that if she were forced to take it, she would be worse off. But she can decline it. So in this scenario, she declines the test and gets max(10p+1,5). So the theorem holds: she is not worse off by having the option, because she doesn't take it.

  We need a scenario where she must decide whether to get the signal without knowing what it will say, and then after getting it, she is forced into a situation where she cannot take an action that she could have taken without the signal. But note: without the signal, she can take A. With the signal, she cannot take A. So if she gets the signal, she cannot take A. But then she would only get the signal if she wants to. However, if she gets the signal, she loses the option to take A. So she might avoid getting the signal so as to preserve the option.

  But the theorem says: the expected utility of having the signal (and being able to act on it) is at least the expected utility without it. In this case, if she has the signal, she cannot take A. But without the signal, she can take A. So the set of actions changes. The theorem assumes that the set of actions does not change. So we have violated an implicit assumption.

