  We must avoid any cost. So we return to the clinical trial example but with a twist: the agent is not the patient but the trial administrator. And the trial has a rule that only patients who are ignorant of their status can enroll. But then, if the administrator offers the test to the patient, then the patient might take it and then become ineligible. But that involves the patient's decision, which is another agent. Forbidden by (1).

