   However, if she is forced to choose between two lotteries: one where she gets the signal and then can only not buy, yielding 0, and one where she doesn't get the signal and can buy, yielding 0.5, then the latter is better. But in our setup, she is not forced; she can choose to not take the signal.

   Therefore, to get a violation, we need to consider the act of getting the signal as separate from the choice. In Good's theorem, the value of the signal is the expected improvement in decision making. In this case, if you have the signal, you are constrained to not buy, so you make worse decisions. But you can choose to not get the signal.

