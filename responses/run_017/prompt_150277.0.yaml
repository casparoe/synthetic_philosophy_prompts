answer: |-
  Below is a self-contained case, analysis, and restatement of Good's theorem that meets all your constraints. The scenario is set in a lottery context, with probabilities and utilities specified for clarity. I'll present the case, then address each of your requests systematically.

  ### The Case: Insider Information and Lottery Eligibility
  **Setting:** An agent is considering buying a lottery ticket. The lottery has two equally likely outcomes: a win (state \(s_1\)) or loss (state \(s_2\)). The ticket costs $1. If the agent buys a winning ticket, she gains $3 (net $2); if she buys a losing ticket, she gains $0 (net -$1). She can also abstain (net $0). Crucially, lottery rules prohibit purchasing tickets with insider knowledge: if the agent learns the outcome beforehand, she is legally barred from buying. A free, perfectly accurate signal (e.g., a leaked report) reveals the outcome. The agent must decide whether to accept the signal *before* knowing its content. If she accepts it, she learns the outcome but cannot buy; if she declines, she remains eligible to buy.

  **Probabilities and Utilities:**
  - States: \(s_1\) (win, \(P(s_1) = 0.5\)), \(s_2\) (loss, \(P(s_2) = 0.5\)).
  - Signal \(m\): perfectly accurate, so \(P(m_1 | s_1) = 1\), \(P(m_2 | s_2) = 1\) (where \(m_1\) predicts win, \(m_2\) predicts loss).
  - Utilities (net monetary gain):
    - Buy ticket in \(s_1\): \(u = 2\)
    - Buy ticket in \(s_2\): \(u = -1\)
    - Abstain: \(u = 0\)

  **Decision Problem:**
  - **Option 1: Decline signal.** Agent can buy or abstain.
    - EU(buy) = \(0.5 \times 2 + 0.5 \times (-1) = 0.5\)
    - EU(abstain) = \(0\)
    - Chooses to buy \(\rightarrow\) EU = 0.5.
  - **Option 2: Accept signal.** Agent learns outcome but cannot buy; must abstain.
    - EU = \(0.5 \times 0 + 0.5 \times 0 = 0\) (since abstention yields $0 regardless of state).

  **Result:** Expected utility of accepting the signal (0) is less than declining it (0.5). The agent is strictly better off declining the free signal.

  ---

  ### Analysis
  **1. Running the Numbers: Confirming Negative Expected Value**  
  - Expected utility of accepting signal: \(0\) (as above).  
  - Expected utility of declining signal: \(0.5\) (as above).  
  - Expected value of the signal: \( \text{EU}(\text{accept}) - \text{EU}(\text{decline}) = 0 - 0.5 = -0.5 \).  
  The signal’s value is negative. Utilities and probabilities are bounded and finite.

  **2. Premise of Good’s Theorem That Fails**  
  Good’s theorem assumes **a fixed set of available actions**, regardless of the signal. Here, the action set changes:  
  - Without signal: Actions = {buy, abstain}.  
  - With signal: Actions = {abstain} (since buying is legally barred).  
  The agent cannot "ignore the signal and do what she would have done without it" because the action "buy" is physically unavailable after receiving the signal. Other premises hold:  
  - Single agent, fixed utility function (over outcomes, not knowledge).  
  - Costless signal (no fees, attention, or opportunity costs).  
  - Updates by conditionalization (trivially, as the signal is perfect).  
  - No demons/infinities (finite states, bounded utilities).  
  - Signal only affects beliefs (eligibility loss is triggered by changed beliefs, not the signal mechanism).

  **3. Room Left by Constraints: The Only Available Route**  
  Your constraints block standard routes (multiple agents, costs, demons, infinite utilities). The only remaining route is **information-induced action elimination**: a fixed rule (e.g., legal or institutional) makes an action unavailable if the agent has specific knowledge. This is not a "second agent" because the rule is passive and non-strategic—it is triggered automatically by the agent’s epistemic state, not by adaptive behavior of another entity.

  **4. Effect of Deleting the Critical Feature**  
  If the eligibility rule is removed (i.e., the agent can buy after learning the outcome):  
  - Accepting signal: In \(s_1\), buy (utility 2); in \(s_2\), abstain (utility 0). EU = \(0.5 \times 2 + 0.5 \times 0 = 1.0\).  
  - Declining signal: EU = 0.5 (as before).  
  Signal value = \(1.0 - 0.5 = +0.5\), confirming Good’s theorem. The case collapses into a standard confirmation.

  **5. Defense from a Theorem Advocate**  
  An advocate might argue: "Good’s theorem assumes a fixed action set, so this isn’t a counterexample—it’s outside the theorem’s scope." This is **principled, not rhetorical**:  
  - **Substance**: The theorem explicitly requires that actions are independent of the signal. This case violates that axiom.  
  - **Cheating?** No—the advocate correctly notes the necessary assumption. However, this exposes the theorem’s **limited real-world applicability**: many decisions (medical trials, legal pleas, insider-trading rules) tie action availability to knowledge. The theorem is "airtight" only in highly idealized settings.

  **6. Restated Theorem (True Without Being Empty)**  
  *"For an expected-utility maximizer with a fixed utility function and a fixed set of actions (unaffected by the signal or epistemic state), who updates by Bayesian conditionalization, the expected value of a costless signal is non-negative. It is strictly positive if the signal is informative and potentially decision-relevant."*  
  This version is robust, as it clarifies the critical assumption of action-set stability.

  **Convention Note:** The negative value hinges on the convention that institutional rules can be modeled as exogenous constraints. This is substantive in social contexts (e.g., laws against insider trading) but may feel "conventional" if divorced from real-world institutions.

  ---

  ### Handout-Ready Summary
  **Case (1 paragraph):**  
  An agent considers a lottery ticket ($1 cost). Win (50% chance) yields $3 net $2; loss yields $0 net -$1. Abstaining gives $0. Lottery rules forbid buying with insider knowledge. A free, perfect signal reveals the outcome. Accepting it makes buying illegal; declining preserves eligibility.  
  **Probabilities:**  
  | State | \(P(s)\) |  
  |-------|----------|  
  | Win   | 0.5      |  
  | Loss  | 0.5      |  
  **Signal accuracy:**  
  | \(P(m\|s)\) | \(m_1\) (win) | \(m_2\) (loss) |  
  |-------------|---------------|---------------|  
  | \(s_1\) (win) | 1.0 | 0.0 |  
  | \(s_2\) (loss) | 0.0 | 1.0 |  
  **Result:** EU(accept signal) = 0; EU(decline signal) = 0.5. Signal value = -0.5.  

  **Theorem Restatement:**  
  Good’s theorem holds only when the action set is signal-independent. Here, the signal eliminates an action via a fixed rule, violating this premise. In unrestricted settings, information can harm by enabling constraints on actions.  

  ---  
  This case is exam-ready and satisfies all constraints. The lottery setup is intuitive, and the numbers are blackboard-friendly. It demonstrates that Good’s theorem—while logically sound—relies on strong assumptions about action availability, which fail in knowledge-sensitive institutions.
