  To make it harmful, we need the policy to force her to take a worse action. Suppose the policy says: if you order the test, then you must always give the mild treatment. Why? Maybe because the test is experimental and they don't want to risk harm. Then, if she orders the test, she is forced to do B, so she gets 5. Without the test, she can do B and get 5, or A and get 0. So she does B and gets 5. Then the test has no value. But not negative.

