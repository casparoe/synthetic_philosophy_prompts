prompt: |-
  I have to teach the gradual-replacement argument — the case in which neurons are substituted one at a time for functionally equivalent prostheses, and the trichotomy it is meant to force among experience staying fixed, fading with the proportion of biological tissue replaced, and changing in some other way while functional organization is held constant — in a single seventy-minute seminar. The class is roughly half advanced philosophy undergraduates and half cognitive science undergraduates. They have met functionalism and the knowledge argument; none of them has met this argument. The room will split, predictably, between those who think the case is settled in advance by the observation that the computation is unchanged and those who think a question no possible experiment could settle is not a question at all.

  Do not explain the argument to me; I know it. Give me a plan for teaching it. I want, in this order:

  1. The dependency structure. Which distinctions have to be in place before the substitution scenario can even be stated without begging a question or inviting a conflation, and what collapses if one of them arrives late. I take it that the target is a dependence claim about the character of experience and not a claim about what happens to a person, and that functional organization has to be read counterfactually rather than as a match on the actual sequence of inputs and outputs; tell me if either of those belongs somewhere other than first, and what else is load-bearing.

  2. The carrying example. My candidate is a two-channel version: the subject has two visual channels that are, or are stipulated to be, functionally duplicate; the substitution is completed in one channel while the other is left biological, and at the midpoint the same stimulus is presented separately to each. I want the class to ask whether anything is different on the prosthetic side, because I think that question is a trap that will drag the premise the argument actually needs — that a change in experience would normally show up in what the subject can notice and report — into the open, where I can then make them own it. Tell me what this example must have and what it must lack for that to work, whether the duplication should be stipulated or motivated, and whether the trap is where I think it is. I also toyed with performing the substitutions during dreamless sleep, and with running the second half of the sequence in reverse; tell me whether either earns its place or is noise.

  3. The misconception map. Here is what I expect: the Ship of Theseus framing (identity and survival rather than preservation of experience); pinning the whole issue on carbon versus silicon when the argument is meant to be neutral about which non-functional property is supposed to do the work; the charge that the argument assumes functionalism instead of arguing for it; the objection that a genuinely perfect prosthesis is impossible and so the case is moot; and the retreat to vagueness, the claim that there is no fact of the matter about where experience gives out. For each, the point in the sequence at which it should be anticipated or defused, and the one or two sentences that do the defusing. Add the ones I have missed, including any that come specifically from the cognitive science half of the room.

  4. Where the gradualness is doing the real work. I want them able to say what breaks if the substitution is done in a single step, and I do not want them leaving with the impression that the argument shows uploading to be safe.

  5. One thing I should openly refuse to explain at this level, and what I should say when I refuse it.

  6. A closing check: one task or question whose answer would show me they have the structure of the argument rather than its conclusion.
reasoning: |-
  Okay, let me tackle this teaching plan request. The user needs a structured seminar plan for the gradual-replacement argument targeting specific learning outcomes. 

  First considering the dependency structure - the foundational distinctions needed upfront. The core is separating phenomenal character from personal identity, and understanding functional organization counterfactually. If these aren't clear from the start, the substitution scenario becomes unintelligible or question-begging. Must emphasize that functional equivalence requires identical input-output dispositions across all possible circumstances, not just actual behavior.

  For the carrying example, the two-channel visual system seems ideal. Stipulating duplication avoids biological debates while highlighting the key question: if experience changes on the prosthetic side, why wouldn't the subject notice via comparison? The trap works precisely because it forces students to confront the reporting premise. Performing substitutions during sleep adds unnecessary complication - better to keep focus on the comparison moment. Reverse substitution might help later when discussing anti-functionalist positions.

  The misconception map needs careful handling. Ship of Theseus confusions should be preempted when stating the target question. Carbon/silicon fixation can be defused by emphasizing substrate-neutrality early. The functionalism-assumption charge requires clarifying that the argument tests any non-functional property claim. Impossibility objections get neutralized by noting this is a conceivability argument. Vagueness retreats need the "no fact" counter: why wouldn't micro-changes accumulate noticeably?

  On gradualness - must stress that single-step substitution allows massive change without contradiction, defeating the argument's purpose. Should explicitly warn against misinterpreting this as uploading endorsement. 

  For refusal point: quantum consciousness or hardcore physicalist alternatives are too advanced here. Redirect to the argument's structure. 

  Closing check: Asking students to reconstruct the trichotomy from functional organization fixation would best reveal structural understanding over mere conclusion adoption.
answer: |-
  Here’s a seminar plan tailored to your constraints and goals, structured to preempt pitfalls and force engagement with the argument’s mechanics:

  ---

  ### **1. Dependency Structure (15 min)**  
  **Sequence & Load-Bearing Distinctions:**  
  - **First:** *Phenomenal character vs. personal identity/survival.* Open by stating: *"We’re not asking whether it’s still ‘you’ after replacement, but whether your subjective experience (e.g., redness of red) remains the same."* (Collapses if late: Students conflate experience with identity, invoking Ship of Theseus prematurely.)  
  - **Second:** *Functional organization as counterfactual profile.* Clarify: *"Functional equivalence means identical input-output dispositions *across all possible scenarios*, not just actual behavior."* Use a simple example (e.g., a thermostat’s counterfactual responses to temperature changes). (Collapses if late: Students fixate on actual outputs, missing the necessity of dispositional equivalence.)  
  - **Third:** *Targeted dependency claim:* *"Does phenomenal character *depend solely* on functional organization, or also on non-functional properties (e.g., biology)?"* (Sets the trichotomy: fixed/fading/other.)  

  **Why this order?** Starting with identity/survival derails the argument; functional counterfactuals must precede the scenario to avoid "computation settles it" objections.

  ---

  ### **2. Carrying Example (20 min)**  
  **The Two-Channel Setup:**  
  - **Structure:** Subject has duplicate biological visual channels (e.g., left/right visual fields). Prostheses replace one channel gradually while the other remains biological. At 50% replacement, identical stimuli are shown to each channel separately.  
  - **Crucial features:**  
    - **Stipulate duplication** (avoid biological debates; focus on logic).  
    - **Must lack behavioral asymmetry:** Subject cannot behaviorally distinguish stimuli between channels at any point (functional match holds).  
    - **Must include comparison prompt:** *"If experience differs between channels, could the subject detect it?"*  
  - **The Trap:** Forces students to admit that *if experience changed, the subject should notice via direct comparison*. This smuggles in the reporting premise (*changes in experience are reportable under ideal access*).  
  - **Avoid sleep/reversal:** Sleep adds unnecessary complications (unconscious states invite "zombie" objections). Reversal risks confusion (is it restoration or new substitution?). Keep it simple.  

  ---

  ### **3. Misconception Map (15 min)**  
  **Preemptive Strikes & Defusals:**  
  - **Ship of Theseus (identity):** Anticipate when stating the target. Defuse: *"This isn’t about survival of a person, but preservation of an experience-type."*  
  - **Carbon vs. silicon:** Address when introducing non-functional properties. Defuse: *"The argument applies to *any* non-functional property (e.g., quantum vibrations), not just biology vs. tech."*  
  - **"Assumes functionalism":** Preempt during functional organization setup. Defuse: *"We’re testing functionalism’s claim against rivals, not presupposing it."*  
  - **"Perfect prosthesis impossible":** Raise after the scenario. Defuse: *"We’re in conceivability-space: *If* functionally identical replacements were possible, what follows for experience?"*  
  - **Vagueness retreat:** Counter during trichotomy discussion. Defuse: *"If experience fades gradually, why can’t subjects report incremental changes? If it vanishes abruptly, what threshold breaks functionality?"*  
  - **CogSci-specific pitfall:** *"Neural plasticity compensates for prostheses"*. Defuse early: *"Stipulate no compensatory changes: functional organization is fixed by design."*  

  ---

  ### **4. Gradualness Work (5 min)**  
  **Why Not Single-Step?**  
  - **What breaks:** Single-step substitution allows the functionalist to deny continuity (e.g., "consciousness glitches") or the anti-functionalist to claim total loss. Gradualness forces a dilemma: *If functionality is preserved stepwise, how can experience change/fade without violating reportability or functional continuity?*  
  - **Uploading caveat:** Explicitly warn: *"This doesn’t prove uploading is safe. Gradual replacement fixes functional organization *locally*; whole-brain uploading may disrupt global functions (e.g., embodiment)."*  

  ---

  ### **5. Refusal Point (2 min)**  
  **What to refuse:** *"Which non-functional property *actually* grounds consciousness?"*  
  **Response:** *"That’s for metaphysics seminars. Here, we only ask: *Must* such a property exist, given the trichotomy? Don’t confuse the argument’s structure with its resolution."*  

  ---

  ### **6. Closing Check (3 min)**  
  **Task:** *"Suppose an anti-functionalist claims experience fades linearly with biological replacement. How does the two-channel experiment challenge this?"*  
  **Reveals understanding if:** They note that the subject’s inability to detect differences between channels contradicts the prediction of fading (since one channel is 100% biological, the other 50%), forcing either fixed experience or non-reportable changes.  

  ---

  ### **Timing Buffer (10 min)**  
  Reserve for inevitable digressions on "zombies" or quantum consciousness. Redirect firmly: *"Save that for the pub—focus on the argument’s hinges."*

  ### **Why this works:**  
  - **Dependencies** scaffold the logic.  
  - **Two-channel** forces the reporting premise into view.  
  - **Misconceptions** are neutered before they hijack discussion.  
  - **Gradualness** is framed as a dialectical tool, not an endorsement.  
  - **Refusal** maintains focus on structure over speculation.  
  - **Closing check** tests grasp of the dilemma, not conclusion adoption.  

  Tailor pace to room energy—if functionalists dominate, stress the fading/changing options; if verificationists revolt, double down on conceivability.
