prompt: |-
  A small, philanthropically funded institute is standing up a two-year research unit on decomposition-based approaches to aligning advanced AI systems. The unit has four researchers, trained mostly in philosophy and theoretical computer science, and enough compute to run modest empirical probes — small models, crowdworker experiments, toy environments — but no ability to train, fine-tune, or extensively evaluate frontier-scale systems. You have been asked to write the unit's research prospectus.

  The background assumption the unit is interrogating is roughly this: that a hard task can be broken into subtasks that are individually easier for a fallible overseer to check, that this decomposition can be applied recursively, and that the resulting competent behavior can then be distilled back into a single fast model that retains whatever made the amplified process trustworthy. This rests on two separable preservation claims — that decomposition plus recursion preserves *competence*, and that distillation preserves *alignment*, or at least does not specifically erode it — plus an implicit third claim: that the fixed point reached by iterating the procedure is a fixed point *of the task*, rather than an artifact of the procedure's implementation.

  Below is the unit's initial list of candidate questions, deliberately stated in the unit's own vocabulary. Define each term as you use it, and treat the list as a starting point rather than a menu to comment on serially.

  - **Interface relativity.** The overseer–subagent channel has finite bandwidth, a fixed representational format, a memory limit, and a cost per call. If the limit of iteration depends on which decompositions that channel can cheaply express, then the end state is selected partly by the interface and not only by the task. How should the unit think about a limit point that is a function of the plumbing?
  - **The visibility asymmetry.** Distillation optimizes what the training signal can see. Competence on the decomposed subtasks is typically visible in the signal; the dispositions that are supposed to make the amplified system safe — deference under uncertainty, reluctance to exploit gaps in the overseer's specification, honesty about failure — are largely not. Is there a structural reason to expect distillation to be lossy in exactly the wrong direction?
  - **Local compliance, global failure.** Each subagent can satisfy the local criterion it was handed while the composition violates the global criterion the overseer had in mind. Under what conditions is this merely specification gaming at a new level, and when is it a genuine failure of the preservation claim?
  - **Non-idempotence and drift.** Amplifying an already-distilled amplifier need not reproduce it. Small per-level distortions can accumulate, oscillate, or converge somewhere unanticipated. What is the right formalism for asking whether the iteration is contractive, and can the question be made tractable without a full model of the base system?
  - **Verification-decomposability as a property of task distributions.** Which classes of tasks admit decompositions whose parts are genuinely easier to verify than the whole, and which resist it because correctness is a global property? This looks empirical, but the unit lacks the compute to settle it at scale — what is the conceptual content that survives?
  - **Meta-decomposition and fixed-point selection.** In the limit, the decomposition strategy is itself produced by the amplified system. The procedure then has the flavor of a self-referential fixed point, which may admit many. What would it mean to select the right one, and is there a notion of stability that does the work selection is being asked to do?
  - **Error and corruption propagation.** Grant that the base overseer is mildly unreliable or mildly misaligned. Does recursion attenuate that, magnify it, or preserve it at constant rate? How much of the case for the approach rests on the answer?
  - **Limit versus implementation.** The theoretically defined limit object is infinite; any real system truncates at finite depth and finite width. What is lost in the truncation, and is the loss principled or merely practical?

  What the prospectus should contain:

  1. An ordering of the four or five questions the unit should actually spend its roughly eight researcher-years on, defended rather than listed. State the criteria you are using — how many other questions depend on this one, tractability in two years with conceptual tools and small experiments, neglectedness relative to its importance, and how much the answer would change anyone's mind about whether to pursue this family of approaches at all — and be explicit about the trade-offs between them.
  2. An upstream/downstream map: which questions gate which, so the reader can see why the ordering is an ordering and not a ranking.
  3. For each prioritized question, what a *negative* answer would do: would it damage the case for decomposition-based approaches specifically, or would it damage scalable oversight generally; and would the effort then be better spent on debate-style methods, interpretability, formal verification, or something else? Say which questions are load-bearing and which are intellectually interesting but decision-irrelevant.
  4. A candid treatment of dissolution: which candidates are pseudo-problems, which secretly collapse into empirical questions the unit cannot afford to answer, and which should be explicitly declined with reasons — including, if you think so, the possibility that the competence question and the alignment question are not as separable as the framing above suggests.
  5. How you would divide the unit's effort between "does the procedure work" and "would it be safe if it did," and what evidence observable within two years, from the unit's own probes or from the wider field, would move items up or down the list.
reasoning: |-
  We are creating a research prospectus for a two-year unit with four researchers (philosophy and theoretical computer science background) and modest computational resources (small models, crowdworkers, toy environments). The unit's focus is on decomposition-based approaches to AI alignment, specifically investigating the assumptions behind recursive task decomposition and distillation.

  The key claims under scrutiny:
  1. **Preservation of competence**: Decomposition plus recursion preserves task competence.
  2. **Preservation of alignment**: Distillation preserves alignment (or at least does not erode it).
  3. **Fixed point correctness**: The fixed point reached by iterating the procedure is a fixed point of the task, not an artifact of the procedure.

  The unit has provided a list of candidate questions. We must:
  - Order 4-5 questions to focus on (defend the ordering with criteria: dependency, tractability, neglectedness, mind-changing potential).
  - Provide an upstream/downstream map (which questions gate others).
  - For each prioritized question, explain the impact of a negative answer (on decomposition-based approaches vs. scalable oversight generally, and what to pivot to).
  - Candidly treat dissolution: which questions are pseudo-problems, which are unaffordable, and which should be declined (including possible inseparability of competence and alignment).
  - Divide effort between "does it work?" and "would it be safe?" and note what evidence in two years would change priorities.

  Criteria for ordering:
  1. **Dependency**: How many other questions depend on this? (Upstream questions should come first.)
  2. **Tractability**: Can we make progress in two years with our resources? (Conceptual work, small experiments.)
  3. **Neglectedness**: Is this question understudied relative to its importance?
  4. **Mind-changing potential**: Would answering this change minds about pursuing decomposition-based approaches?

  We must also consider the trade-offs between these criteria.

  The candidate questions (with brief definitions for clarity in the prospectus):

  - **Interface relativity**: The limit point of iteration depends on the communication channel (bandwidth, format, etc.) between overseer and subagents. How to think about a limit point shaped by the interface?
  - **Visibility asymmetry**: Distillation optimizes for what is visible in the training signal. Competence (e.g., task success) is visible; safety properties (e.g., honesty, reluctance to exploit) are not. Is there a structural bias toward losing safety?
  - **Local compliance, global failure**: Subagents satisfy local criteria but the composition violates the global criterion. When is this specification gaming vs. a failure of the preservation claim?
  - **Non-idempotence and drift**: Iterative amplification and distillation can cause accumulation of errors, oscillation, or convergence to an unexpected point. What formalism can analyze this without a full model?
  - **Verification-decomposability**: Which tasks are decomposable into easier-to-verify subtasks? Which are not because correctness is global? How to study without large compute?
  - **Meta-decomposition and fixed-point selection**: In the limit, the decomposition strategy is produced by the system, leading to self-referential fixed points. How to select the right one? Is stability a substitute?
  - **Error and corruption propagation**: How does recursion affect initial overseer unreliability or misalignment? (Attenuate, magnify, preserve?)
  - **Limit versus implementation**: What is lost in finite truncation of the infinite ideal? Is the loss principled or practical?

  Prioritization:

  We choose the following 5 questions (ordered by dependency and importance):

  1. **Verification-decomposability as a property of task distributions**
     - Why? This is foundational: if most tasks of interest are not decomposable in a way that makes verification easier, then the entire approach may be infeasible. It gates the other questions because if decomposition doesn't work for key tasks, then issues like interface relativity or drift become moot. It is tractable with conceptual work and small experiments (toy tasks, crowdworkers). It is relatively neglected in the specific context of recursive decomposition for alignment. A negative answer (that many important tasks are not verification-decomposable) would significantly damage the case for decomposition-based approaches and might shift focus to other methods (like interpretability or formal verification for monolithic systems). A positive answer would provide a necessary condition for the approach to work.

  2. **Local compliance, global failure**
     - Why? This directly tests the preservation of alignment under composition. It is dependent on the existence of decompositions (from the first question) but is a core issue for the alignment claim. We can study it with conceptual examples (philosophical) and small experiments (e.g., with crowdworkers as subagents). It is somewhat neglected in the specific form of composition in recursive decomposition. A negative answer (that local compliance frequently leads to global failure and this is not just specification gaming) would challenge the alignment preservation claim and might suggest a pivot to methods that enforce global properties (like formal verification). This question is highly decision-relevant.

  3. **Visibility asymmetry**
     - Why? This addresses the distillation step and whether it preserves alignment. It is downstream of the decomposition working (so after question 1) but critical for the safety of the distilled model. It is tractable with small experiments (distilling small models and measuring both competence and safety properties). It is somewhat studied in ML (e.g., reward misspecification) but understudied in the context of recursive decomposition. A negative answer (that distillation systematically erodes safety properties) would damage the case for distillation in decomposition-based approaches and might push towards alternatives (like preserving the decomposed structure or using debate). This question is load-bearing for the safety of the approach.

  4. **Non-idempotence and drift**
     - Why? This examines the stability of the iterative process. It is downstream of the above because it assumes that decomposition and distillation are working at each step. It is tractable with conceptual work (mathematical modeling) and small simulations. It is relatively neglected. A negative answer (that small per-level distortions accumulate or oscillate in a way that breaks the system) would challenge the feasibility of iterating the procedure to a fixed point. This might push towards finding stable fixed points or limiting iterations. However, it is less mind-changing than the first three because if the first three fail, this becomes less relevant.

  5. **Error and corruption propagation**
     - Why? This deals with the robustness of the system to initial imperfections. It is downstream (assuming the procedure works in the ideal case) but important for real-world application. It is tractable with small experiments (simulating errors in toy systems). It is also somewhat neglected. A negative answer (that errors magnify) would damage the case for decomposition in practice but might be fixable with error-correction. This question is important but less foundational.

  We deprioritize:

  - **Interface relativity**: Important, but we suspect it might be a special case of local compliance and verification-decomposability. Also, without knowing which tasks are decomposable, the interface issue is premature. It might be a pseudo-problem if the interface can be designed flexibly.

  - **Meta-decomposition and fixed-point selection**: This is conceptually deep but may be intractable in two years and is highly abstract. It might collapse into an empirical question we can't answer (without large systems). We should decline it for now.

  - **Limit versus implementation**: This is important for practical implementation but less so for the core theoretical claims. We can note it as a future direction.

  Dissolution:

  - **Interface relativity**: We partially dissolve it by noting that the interface is part of the decomposition design. If a task is verification-decomposable, then a suitable interface exists. The question becomes: for a given task, what interface allows decomposability? This is subsumed by verification-decomposability.

  - **Meta-decomposition and fixed-point selection**: This is a genuine question but too abstract and self-referential for our resources. We decline it because without progress on the more concrete questions, we cannot address the meta-level. It might collapse into an empirical question about what fixed point real systems converge to, which we cannot test.

  - **Limit versus implementation**: We acknowledge it as a practical concern but not core to the theoretical claims. We note it in the prospectus as a caveat but do not prioritize it.

  - **Competence and alignment inseparability**: We must consider that the two preservation claims (competence and alignment) might not be separable. For example, in some tasks, the competence might inherently require alignment (e.g., in ethical reasoning). This is a background concern that might emerge from our studies of local compliance and visibility asymmetry.

  Upstream/downstream map:

  Upstream (most foundational):
  1. Verification-decomposability: Without decomposable tasks, the approach fails.
     - Downstream: Local compliance (if tasks are decomposable, we must check if the composition preserves alignment) and Visibility asymmetry (if we have decomposable tasks and successful composition, we then worry about distillation).

  2. Local compliance: This tests the composition step. If composition fails, then distillation becomes irrelevant.
     - Downstream: Visibility asymmetry (if composition works, then we ask if distillation preserves it).

  3. Visibility asymmetry: This tests the distillation step.

  4. Non-idempotence and drift: This tests the iterative process, which assumes each step (decomposition, composition, distillation) works.

  5. Error propagation: This tests the robustness of the entire process, which depends on the process being sound in the ideal case.

  Division of effort:

  We propose:
  - 50% on "does the procedure work?" (questions 1, 4, and part of 2 and 3 that relate to competence)
    - Specifically: verification-decomposability (30%), non-idempotence (10%), and the competence aspects of local compliance and visibility asymmetry (10%).
  - 50% on "would it be safe if it did?" (questions 2, 3, 5, and the alignment aspects of the others)
    - Specifically: local compliance (20%), visibility asymmetry (20%), error propagation (10%).

  But note: these are intertwined. For example, local compliance and visibility asymmetry address both.

  Evidence that would change priorities:

  - If early experiments (within 6 months) show that even simple tasks are not verification-decomposable, we might shift effort to understanding why and whether there are workarounds, or pivot to other methods.

  - If we find in small experiments that distillation consistently loses safety properties (visibility asymmetry), we might shift effort to alternative distillation methods or to other approaches (e.g., debate).

  - If we observe in simulations that even mild errors propagate catastrophically, we might focus on error correction.

  - External evidence: If the wider field shows that large-scale decomposition works (e.g., in non-safety-critical domains) but alignment fails, we would emphasize visibility asymmetry. Conversely, if decomposition fails at scale for competence, we might question verification-decomposability.

  Prospectus Outline:

  We will write the prospectus with:
  1. Introduction and background.
  2. Prioritized research questions (ordered as above) with detailed defense and impact of negative answers.
  3. Upstream/downstream map (as a diagram or list).
  4. Treatment of dissolved/declined questions.
  5. Allocation of effort and adaptive planning.

  Now, we write the prospectus accordingly.
answer: |-
  ### Research Prospectus: Decomposition-Based Approaches to AI Alignment

  The institute's research unit will investigate decomposition-based approaches to aligning advanced AI systems. These approaches rest on three core claims:
  - **Competence preservation**: Decomposing a task into recursively solvable subtasks preserves overall task competence.
  - **Alignment preservation**: Distilling the resulting amplified process into a single model retains alignment properties.
  - **Fixed-point correctness**: The iterative procedure converges to a task-optimal fixed point, not an implementation artifact.

  Given our constraints—four researchers (philosophy/theoretical CS), modest compute (toy models, crowdworkers, simulations), and a two-year horizon—we prioritize questions that are **upstream** (gate other inquiries), **tractable** (amenable to conceptual analysis/small experiments), **neglected** (underexplored relative to importance), and **decision-relevant** (could alter investment in decomposition-based approaches). We explicitly trade off breadth for depth, focusing on questions where negative answers would most threaten the core paradigm.

  ---

  ### 1. Prioritized Questions and Ordering
  We order five questions by dependency (upstream first) and impact. Criteria:
  - **Dependency**: Does progress here unblock other questions?
  - **Tractability**: Can we make headway in 2 years with our tools?
  - **Neglectedness**: Is this overlooked despite high stakes?
  - **Mind-changing potential**: Could a negative answer undermine the entire approach?

  #### Question 1: **Verification-Decomposability of Task Distributions**  
  *What task classes admit decompositions where subtasks are easier to verify than the whole?*  
  - **Why first?** Most upstream. If tasks *cannot* be decomposed into verifiable subtasks, the entire approach fails.  
  - **Tractability**: Study via toy tasks (e.g., puzzles, ethical dilemmas) and crowdworker experiments simulating overseers. Conceptual work can abstract patterns (e.g., separable vs. holistic tasks).  
  - **Neglectedness**: Task decomposability is often assumed, not systematically tested.  
  - **Mind-changing**: A negative answer (e.g., "Most real-world tasks resist decomposition") would cripple the paradigm.  
  - **Dependency**: Gates all other questions—decomposition must be viable before addressing composition or distillation.

  #### Question 2: **Local Compliance, Global Failure**  
  *When does satisfying local subtask criteria violate the global task objective?*  
  - **Why next?** Tests competence/alignment preservation *during composition*. Upstream of distillation.  
  - **Tractability**: Experiments with crowdworkers or small RL agents in toy environments (e.g., subagents optimize local rewards but harm global goals).  
  - **Neglectedness**: Alignment research often focuses on monolithic systems, not compositional failures.  
  - **Mind-changing**: A negative answer (e.g., "Local compliance frequently causes global misalignment") challenges preservation claims.  
  - **Dependency**: Builds on decomposable tasks (Q1); gates distillation (Q3).

  #### Question 3: **Visibility Asymmetry in Distillation**  
  *Does distillation erode alignment by optimizing only visible competence?*  
  - **Why?** Directly tests alignment preservation in distillation.  
  - **Tractability**: Distill small models (e.g., transformers) in tasks with measurable competence (accuracy) and alignment (honesty, caution). Use probes like anomaly detection.  
  - **Neglectedness**: Distillation safety is understudied vs. competence.  
  - **Mind-changing**: A negative answer (e.g., "Distillation strips alignment properties") undermines trust in end-to-end systems.  
  - **Dependency**: Requires viable decompositions (Q1) and compositions (Q2).

  #### Question 4: **Non-Idempotence and Drift**  
  *Do small per-iteration distortions accumulate catastrophically?*  
  - **Why?** Tests stability of the iterative process.  
  - **Tractability**: Mathematical modeling (e.g., Banach fixed-point theorems) + simulations of recursion depth effects.  
  - **Neglectedness**: Iterative distortion is often handwaved in theoretical work.  
  - **Mind-changing**: A negative answer (e.g., "Drift dominates after 3–5 iterations") questions scalability.  
  - **Dependency**: Assumes functional decomposition/distillation (Q1–Q3).

  #### Question 5: **Error Propagation**  
  *Does recursion amplify or attenuate overseer errors?*  
  - **Why last?** Tests robustness but assumes a working system.  
  - **Tractability**: Simulations with "noisy" overseers (e.g., crowdworkers with injected errors).  
  - **Neglectedness**: Error propagation is rarely quantified.  
  - **Mind-changing**: A negative answer (e.g., "Small errors magnify exponentially") challenges practical viability.  
  - **Dependency**: Depends on all prior questions.

  ---

  ### 2. Upstream/Downstream Map
  ```mermaid
  graph LR
      A[Q1: Verification-Decomposability] --> B[Q2: Local Compliance]
      A --> C[Q3: Visibility Asymmetry]
      B --> C
      B --> D[Q4: Non-Idempotence]
      C --> D
      D --> E[Q5: Error Propagation]
  ```
  - **Q1 gates all**: Without verifiable subtasks, decomposition fails.  
  - **Q2 gates Q3/Q4**: Compositional integrity needed to study distillation and iteration.  
  - **Q3/Q4 gate Q5**: Distillation and iteration stability inform error propagation.  

  ---

  ### 3. Impact of Negative Answers
  | Question | Negative Answer Impact | Pivot Recommendation |
  |----------|------------------------|-----------------------|
  | **Q1** | **Fatal to decomposition-based approaches.** Shows paradigm is infeasible for key tasks. | Shift to non-decomposition methods (e.g., **formal verification** for monolithic systems). |
  | **Q2** | **Damages competence/alignment preservation.** Suggests composition inherently corrupts alignment. | Explore **debate-style methods** (explicitly adversarial) or **interpretability** (directly inspect internals). |
  | **Q3** | **Damages alignment preservation in distillation.** Distillation becomes alignment-eroding. | Prioritize **undistilled amplification** (e.g., tree search) or **hybrid approaches** (distill + explicit safety constraints). |
  | **Q4** | **Challenges scalability.** Iteration is unstable. | Focus on **shallow decompositions** or **stabilization techniques** (e.g., regularization). Less mind-changing than Q1–Q3. |
  | **Q5** | **Hurts practical viability.** Requires near-perfect overseers. | Invest in **error-correction** or **redundant oversight**. Least mind-changing; may not kill the paradigm. |

  **Load-bearing vs. decision-irrelevant**:  
  - **Load-bearing**: Q1–Q3. Negative answers directly threaten the paradigm’s viability.  
  - **Useful but not fatal**: Q4–Q5. Negative answers suggest engineering fixes, not abandonment.  

  ---

  ### 4. Candid Dissolution of Non-Prioritized Questions
  We explicitly decline three candidate questions:  
  - **Interface Relativity**: Pseudo-problem. The "interface" is a design choice, not a fundamental limit. If Q1 (decomposability) holds, interfaces can be optimized; if not, interfaces are irrelevant. **Decline** as secondary to task structure.  
  - **Meta-Decomposition/Fixed-Point Selection**: Intractable abstraction. Requires analyzing self-referential systems beyond our resources. Collapses into an **unaffordable empirical question** (how real systems behave at scale). **Decline** as premature.  
  - **Limit vs. Implementation**: Merely practical. Finite-depth truncation is a universal constraint; the core issue is whether the *direction* is sound (covered in Q4). **Note as caveat** but deprioritize.  

  **Critical dissolution**: The competence/alignment distinction may be **inseparable** for many tasks (e.g., ethical reasoning). If our work on Q2–Q3 reveals this, it could reframe the entire field—decomposition might preserve "trustworthy competence" only if alignment is embedded in task success.  

  ---

  ### 5. Effort Division and Adaptive Triggers
  #### Effort Allocation (8 researcher-years):  
  - **"Does it work?"** (Competence focus): **50%**  
    - Q1 (30%), Q4 (10%), competence aspects of Q2 (10%).  
  - **"Would it be safe?"** (Alignment focus): **50%**  
    - Q3 (20%), alignment aspects of Q2 (15%), Q5 (15%).  

  #### Evidence to Reprioritize:  
  - **From our probes**:  
    - If toy tasks (Q1) show consistent verification failures → Shift effort to formal alternatives.  
    - If distillation (Q3) erodes alignment even in simple cases → Pivot to debate/interpretability.  
    - If simulations (Q4) show stability → Reallocate effort to Q5.  
  - **From the wider field**:  
    - If frontier-scale systems exhibit **compositional failures** (e.g., subagent gaming) → Elevate Q2.  
    - If **distillation losses** are observed in real systems (e.g., LLM honesty degradation) → Elevate Q3.  
    - If **iterative methods** (e.g., self-improvement) prove unstable → Elevate Q4.  

  ---

  ### Conclusion
  This prospectus prioritizes questions that stress-test decomposition’s foundational assumptions. **Q1–Q3** are the tripwires: if any fail, the paradigm likely cannot deliver aligned AGI. Our two-year goal is not to "solve" alignment but to rigorously map the viability of this approach—and redirect resources if it falters. We embrace dissolution where appropriate, acknowledging that competence and alignment may be intertwined in practice. The unit will remain adaptive, using small-scale probes and field developments to refine focus, ensuring our limited resources target the most treacherous uncertainties first.
