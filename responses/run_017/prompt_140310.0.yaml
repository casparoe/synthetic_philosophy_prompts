  ### Nomic Case Study: Path-Dependence of Legality  
  **Starting Rule Set (Plausible, Coherent, 4 Rules):**  

  1. **Amendment Rule:**  
     - Any player may propose an amendment to add, repeal, or alter rules.  
     - An amendment requires a majority vote to pass.  
     - Passed amendments take effect immediately upon vote tallying.  

  2. **Rule of Order:**  
     - No rule may be amended or repealed unless it has been in effect for ≥24 hours.  
     - *Exception:* This restriction is lifted if a rule titled "Waiver of Waiting Period" is in effect.  
     - This rule (Rule 2) may only be amended by a unanimous vote.  

  3. **Voting Protocol:**  
     - Voting on proposals lasts 48 hours. Votes are final when tallied.  
     - Late votes are void.  

  4. **Initial State:**  
     - These rules (1–4) are active at game start.  

  ---

  ### Moves:  
  - **Move A:** *Create the Waiver*  
    Propose: *"Add Rule 5: 'Waiver of Waiting Period.'"*  
  - **Move B:** *Amend Rule 1 and Clean Up*  
    Propose: *"Amend Rule 1 to replace 'majority' with 'unanimous.' Repeal Rule 5."*  

  ---

  ### Sequences & Legality Analysis:  
  #### ✅ Legal Path: **A then B**  
  1. **Move A (Valid):**  
     - **Rules in force:** 1–4.  
     - **Why valid:**  
       - Rule 1 allows adding Rule 5 via majority vote.  
       - Rule 2’s 24-hour restriction does *not* apply to **new rules** (only amendments/repeals of existing rules).  
     - **New rulebook:** Rules 1–5.  
       Rule 5 ("Waiver of Waiting Period") is now active.  

  2. **Move B (Valid):**  
     - **Rules in force:** 1–5.  
     - **Why valid:**  
       - Amending Rule 1 is allowed: Rule 2’s 24-hour restriction is **waived** by Rule 5.  
       - Repealing Rule 5 is allowed: Rule 2’s restriction is waived during this move.  
       - Rule 1 requires only majority vote (Rule 2’s unanimity clause doesn’t apply here).  
     - **Final rulebook (R):**  
       - Rule 1: Amendments require *unanimous* vote.  
       - Rule 2: Unchanged (still has 24-hour restriction + waiver condition).  
       - Rules 3–4: Unchanged.  
       - Rule 5: Repealed (gone).  
     - **R is coherent:** No contradictions.  

  #### ❌ Illegal Path: **B then A**  
  1. **Move B (Invalid):**  
     - **Rules in force:** 1–4.  
     - **Why invalid:**  
       - Amending Rule 1 violates Rule 2: Rule 1 hasn’t been in effect for ≥24 hours *and* no "Waiver" rule exists.  
       - The proposal cannot even be voted on (it’s void at the moment of proposal).  
     - **Rulebook unchanged:** Still 1–4.  

  2. **Move A (Valid but lands in different state):**  
     - After B fails, A can pass (same as above).  
     - **Result:** Rules 1–5.  
     - **Not R:** Rule 1 still requires majority votes; Rule 5 remains active.  

  ---

  ### Key Feature Enabling Path-Dependence:  
  The **asymmetric condition** in Rule 2:  
  - The 24-hour restriction applies only to amending/repealing *existing* rules, not adding new ones.  
  - Move A exploits this by adding Rule 5 (which isn’t restricted), enabling Move B.  
  - Move B fails first because it *amends/repeals* rules, triggering Rule 2’s restriction.  

  > **If we add:** *"Rule 1 (Amendment Rule) may only be amended by unanimous vote."*  
  > - **Outcome unchanged:** Move B in A→B still requires only majority vote (Rule 1 hasn’t been amended yet).  
  > - Move B in B→A is *still invalid* because Rule 2’s 24-hour/Waiver condition is violated *before* voting.  

  ---

  ### Defense of "Legality at the Time":  
  The path-denial argument ("you were legal when you did it") relies on:  
  1. **Legal Doctrine:** *"Legitimacy of Prior Valid Acts."*  
     - If an action was valid under the *rules at the time it was performed*, it remains legitimate even if later rules render it illegal.  
     - Example: A contract signed legally remains binding even if the law later changes.  
  2. **Not the Same Move:**  
     - Move B in A→B occurs in a rulebook *with Rule 5 active*, so it’s a fundamentally different action than Move B in B→A (where Rule 5 is absent).  
     - The *context* (rulebook state) defines the move’s validity. Identical text ≠ identical move.  
  3. **No "Curing" Needed:**  
     - In A→B, no defect exists to "cure" because both moves were lawful when executed. The *later* change making Move B illegal is irrelevant retroactively.  

  ### Why Path-Dependence Matters Here:  
  - **R is identical** in both outcomes, but only the A→B group reached it lawfully.  
  - The B→A group’s rulebook *cannot become R without an extra lawful move* (replicating B after A).  
  - **Taint Claim:** If the B→A group later passes Move B *after* Move A, their R rests on an *initial illegal action* (the void Move B). But under "legality at the time," the *successful* Move B (after A) is standalone-valid, so R is untainted.  

  ---  
  **Final Verdict:**  
  - **Legality is path-dependent** because rules define validity *at the moment of action*.  
  - **R is legitimate only via A→B.** The B→A group must perform a *new* Move B after A to achieve R lawfully.  

