prompt: |-
  I help run, unpaid, an internal forecasting pool at the mid-sized manufacturing company where I work in procurement. About forty of us log in once a week and make small bets with each other — five to twenty-five dollars, settled by me out of a kitty — on internal questions: whether a product will ship by its announced date, which band next quarter's defect rate will land in, whether a particular supplier will deliver on time. Management reads the average of our numbers as a rough forecast, and the pool is meant to be both mildly accurate for them and harmless fun for us, so I have two jobs that sometimes pull apart: I set position limits and decide whether a proposed trade goes through at the size requested, and I also trade myself. I look at somewhere between ten and thirty proposed trades a week, I have about five minutes for each, almost none of us has any training in this, and a couple of members have quietly lost more than they can shrug off. I have no economics background at all, but I half-remember reading something online — some result from game theory or finance, I think — saying that if two people start from the same basic assumptions about the world and each knows the other is reasoning carefully, they should not be able to end up disagreeing once everything they each know is out in the open, and so, paradoxically, there should be no trade between them at all: every real trade is supposed to come from somewhere else, because one side knows something the other doesn't, or one side is shedding a risk the other is happy to hold, or one side simply isn't thinking straight. There was also a joke attached to it about not wanting to join any club that would accept you as a member.

  I would like you to turn whatever is actually true and usable in that idea into a procedure I can run on a proposed trade, and run it on three or four cases. The backbone I have in mind is this: before I allow a trade, and before I take a side myself, I should have to write down, in one sentence, what the other party knows or wants that makes their side of the bet sensible for them — and if I cannot fill that sentence in, the presumption should be that I am the sucker and the trade should be shrunk or refused. Tell me whether that is the right spine, and what has to be added around it: how to tell a genuine informational advantage from a difference in prior judgment, what to do when the disagreement closes or fails to close after the two parties exchange their reasons, how to weigh the fact that one of them works directly on the thing being bet on and the other only reads memos about it, how to treat the explanations that make trade legitimate rather than suspect (someone hedging an exposure, someone with a different appetite for risk, someone who just wants the action), and how to size a trade once I have decided it is allowed. I need the questions in a fixed order, a statement of what counts as a sufficient answer to each one, the points where the procedure just stops and says no, the points where it has to hand the decision to me because the remaining question is one of values or of office politics rather than of fact, and — importantly — what to do at a step where I simply cannot get an answer, which in my setting will be often, since people cannot always say why they think what they think and cannot always disclose what they know. Please also be blunt about which steps are really judgment calls wearing a procedure's clothing. And please do not send me a reading list or point me at papers: I have no library access and I need something I can run on a Tuesday afternoon, not something I can study.

  The cases I want worked are these. First: a production supervisor who has just come out of a tooling meeting wants to bet the maximum that a launch will slip, against an engineer who is equally confident it will not, and when I ask him why, all he will say is that he has seen something he is not allowed to talk about; my instinct is that this is exactly the kind of trade the theory should bless, and also exactly the kind that will make the pool feel rigged. Second: two people in finance, neither of whom has any special line on the product and both of whom read the same internal demand memo, have disagreed every week for a month about whether next quarter's order numbers will beat plan, and now want to double their usual size. Third: me, wanting to take the other side of a colleague who is famously overconfident and has been wrong three weeks running, fairly confident I would be taking his money — if your procedure says I should not do that, say so plainly and tell me what I should do instead, because it is the case where I am least likely to listen. Fourth: someone whose bonus is tied to on-time delivery wants to bet heavily that the delivery will slip, which looks like legitimate risk-sharing but also gives him a reason to make the outcome happen, and I would like the procedure to say what to do when the standard benign explanation for a trade collides with the fact that the trade itself changes the incentives around the event. Please finish by saying, in a few sentences, what such a procedure cannot do — where it will misfire in a setting like mine. Please write all of this as continuous prose, with no headings, bullet points, bold text, or tables, in the manner of a long email to someone with no formal training in the subject, and keep it under about fifteen hundred words.
reasoning: |-
  Okay, the user runs an internal forecasting pool at a mid-sized manufacturing company. They're dealing with weekly bets among colleagues on internal events, and they need a practical procedure to evaluate proposed trades. The core idea they recall is that rational traders with identical information shouldn't trade, so every real trade must stem from information asymmetry, risk preferences, or irrationality. 

  The user wants this theory distilled into a usable checklist. Their proposed "spine" is writing one sentence explaining the counterparty's rationale. That's smart but incomplete. I need to build around it with: how to distinguish information from judgment differences, handle disclosures, account for incentives, and size trades. Crucially, it must work within five minutes per trade with untrained participants who can't always explain their reasoning.

  Breaking this down: First, the procedure needs steps to identify legitimate reasons for trading. Information edges are golden (like the production supervisor's confidential insight), but we must watch for undisclosable secrets. Differing risk appetites (hedging) are valid too, though incentive conflicts (like the bonus-tied bettor) need blocking. Pure irrationality (overconfident colleagues) is exploitable but risks poisoning the pool. 

  For the spine enhancement: Before approving any trade, the user must articulate why the counterparty isn't foolish to take their side. If they can't, veto or shrink the trade. But we add layers: 
  - Prioritize asking "What do you know that others don't?" first. Silence here isn't fatal if other reasons surface later. 
  - Accept "I can't say" only from roles with clear informational access (like the supervisor), but reject vague hunches. 
  - For risk transfers (like hedging), demand specificity about what's being hedged. 
  - Reject trades where the bet could manipulate outcomes (the bonus case) – that's toxic. 
  - When sizing bets, cap at what the loser can shrug off, and scale down if the rationale feels weak.

  Now the cases:
  1. Supervisor vs. engineer: Bless this. His "seen something" is a classic info edge. But note the rigged-feeling risk: disclose that he has confidential grounds without details, and maybe cap the bet. 
  2. Finance duel: Suspect. No clear info edge, just stubbornness. Shrink the bet size dramatically – it's likely noise trading. 
  3. Exploiting overconfidence: Technically legitimate (irrationality is a "reason"), but ethically murky. Allow small bets only to avoid turning the pool predatory. 
  4. Bonus hedge: Block entirely. Hedging is fine, but when the bet incentivizes sabotage, it crosses a line.

  Finally, the procedure's limits: It can't force disclosures, detect lies, or quantify edge sizes. It'll struggle with office politics and emotional trades. Most importantly, it can't replace the user's judgment – especially when people can't articulate why they believe what they believe.

  The user's real challenge is balancing forecast accuracy (needing information-driven trades) with workplace harmony (preventing resentment). The procedure should err toward blocking trades unless a clean rationale exists. And I must emphasize that "I feel lucky" isn't a valid reason – but sometimes, it's all people will offer, and the procedure needs to handle that gracefully by defaulting to small sizes.
answer: |-
  Your instinct about the spine is sound: forcing yourself to articulate why the counterparty isn't foolish to take their side is the core defense against being the sucker. But that spine needs flesh, nerves, and some sharp elbows to work in your messy Tuesday-afternoon reality. Forget pure theory; we build a practical filter, accepting that answers will often be murky or missing. Here’s the procedure, step-by-step, designed for your five-minute window and untrained traders:

  **The Procedure:**

  1.  **What specific, non-public thing does the counterparty likely know that I/the other trader doesn't?** Ask them directly: "What specific insight, data point, or observation are you acting on that isn't widely shared?" *Sufficient answer:* A concrete, plausible piece of information tied to their role or access (e.g., "I saw the test results fail yesterday," "The supplier's lead buyer told me they're prioritizing another client"). *Insufficient:* "I have a feeling," "I've seen this before," "I just know." If they say "I can't say," *only* accept this if their role *obviously* gives them access to confidential info relevant to the bet (like your Production Supervisor). If yes, note that "confidential info suspected" and move on. If the answer is insufficient or missing and their role doesn't scream privileged access, flag this as a major red flag. *Stop point:* If they offer *no* informational edge and their role provides *no* plausible path to one, this trade is highly suspect. Shrink it drastically or refuse unless the next step saves it.

  2.  **Is this about risk or appetite, not information?** Could they be hedging an exposure or have a wildly different tolerance for uncertainty? Ask: "Are you doing this to offset a personal/professional risk, or is your comfort with this kind of gamble just very different?" *Sufficient answer:* A clear statement of hedging (e.g., "My bonus depends on this delivery, so I want to offset if it slips") or a believable admission of differing risk preference (e.g., "I hate uncertainty on launch dates, I'll take a small loss for certainty," "I enjoy the thrill, I don't mind losing this bet"). *Insufficient:* Vague statements about "diversification" if no real exposure exists. *Critical Stop Point:* **If they are hedging an exposure AND the bet itself could incentivize them to *cause* the outcome they're betting on (like your bonus-for-on-time person betting *on* a slip), REFUSE THE TRADE IMMEDIATELY.** This creates a perverse incentive and is toxic. Pure differing risk appetite is generally benign, but keep bets small.

  3.  **Have they consistently been right/wrong on similar things?** This is judgment, not procedure – but lean on history. Is one party demonstrably calibrated (often right at their stated confidence) or wildly over/underconfident? *Action:* If someone has a *documented, clear pattern* of overconfidence (like your colleague wrong three weeks running), this *can* be a valid "reason" (they are predictably irrational), but tread carefully. Allow only small bets to avoid exploitation and pool resentment. Don't let this override a missing answer on Step 1 unless the pattern is stark and recent.

  4.  **Did they talk? What changed?** If the two parties discussed before betting, ask: "Did you share your reasons? Did hearing the other side change anyone's mind?" *Sufficient outcome:* They talked, shared information/judgment, and disagreement *narrowed* (even if it didn't vanish). This suggests a good-faith resolution attempt. *Bad sign:* Disagreement remained wide or worsened after talking, suggesting fundamental differences in interpretation or stubbornness. *Stop point:* If they *refused* to discuss reasons despite your prompt, that's a red flag – refuse or shrink the trade. Persistent disagreement after info exchange often means judgment differences are paramount; cap the size.

  5.  **Can the loser shrug it off?** Regardless of the answers above, check the proposed size against the participants. *Rule:* **No bet should be larger than what the *loser* can comfortably afford to lose without regret.** You know your pool. If someone has quietly lost too much before, or this bet is abnormally large for them, shrink it to their historical "shrug-off" level. This is non-negotiable risk management.

  **Sizing the Trade:**
  *   Strong "Yes" on Step 1 (Clear info edge, especially if undisclosable): Allow up to the max limit, assuming Step 5 passes.
  *   Step 1 "Can't say" but role implies edge (e.g., Production Supervisor): Allow up to 75% of max, acknowledging the edge but also the opacity.
  *   Step 2 only (Hedging with *no* bad incentive OR differing risk appetite): Allow small to medium bets (e.g., 25-50% max).
  *   Step 3 only (Predictable irrationality): Allow *only* very small bets (e.g., min or 25% of min). Exploiting this is ethically grey and pool-damaging.
  *   Weak/Missing Answers on Steps 1 & 2: Shrink dramatically (min or below usual min) or refuse. Suspect trade.
  *   **Always:** Apply Step 5 (Shrug-off test) as the final cap.

  **Running Your Cases:**

  1.  **Production Supervisor vs. Engineer:** Step 1: "Confidential info suspected" (Plausible edge, role fits). Step 2: N/A. Step 3: Unknown/different roles. Step 4: Unknown, but unlikely they fully shared given confidentiality. Step 5: Assume max is within shrug-off. **Verdict:** **Allow, near max size.** This *is* the ideal info edge trade. To counter "rigged" feeling: When listing the forecast, note anonymously "Significant confidential information suspected from production side." Transparency mitigates resentment.
  2.  **Finance Duelists:** Step 1: Both read same memo, no unique info claimed. Insufficient. Step 2: Neither claims hedging/differing risk. Step 3: History shows persistent disagreement, suggesting strong judgment differences, not unique info. Step 4: If they talked and still disagree, it's pure judgment clash. Step 5: Check their loss tolerance. **Verdict:** **Shrink drastically (min size or lower).** No clear edge, likely noise trading. Doubling down is reckless.
  3.  **You vs. Overconfident Colleague:** Step 1: Do *you* have unique info? If not, no edge. Step 2: Are you hedging? Probably not. Differing risk? Unlikely the reason. Step 3: **This is the key.** His overconfidence *is* a predictable flaw. Step 4: Did you talk? Did he dismiss your reasons? Step 5: Can he shrug off the loss? **Verdict:** **Allow only a VERY SMALL bet (e.g., $5).** Yes, you're likely taking his money. But consistently doing this poisons the pool and feels predatory. Tiny bets let you "prove" his miscalibration without harm. Better yet: Don't bet, just note his track record privately. The procedure forces humility: your edge is his stupidity, not your insight. Exploiting that heavily is bad governance.
  4.  **Bonus-Tied Hedger Betting on Slip:** Step 1: Does he have unique info? Maybe, but Step 2 is critical. Step 2: **He *is* hedging (bonus exposure), BUT betting on the slip gives him an incentive to *cause or not prevent* the slip.** This is the perverse incentive. **Verdict:** **REFUSE IMMEDIATELY.** This fails Step 2's critical stop point. Hedging is fine *only* if it doesn't create a conflict of interest (e.g., betting *against* the slip to protect his bonus would be acceptable, though still scrutinize for info edge). Betting for the slip while responsible is a hard no.

  **What This Cannot Do:**

  This procedure won't magically uncover hidden truths. It relies heavily on your judgment about people's roles, honesty, and plausible access to information. It can't force disclosure. It struggles when people genuinely can't articulate their intuition ("I just know the supplier is flaky"). It won't perfectly distinguish a brilliant hunch from stubborn delusion. It might block some legitimate judgment-based trades (though those are riskiest anyway). Most importantly, it can't fix office politics – if someone powerful demands a big bet, the procedure might bend, but it gives you the framework to push back. It's a shield against obvious sucker bets and perverse incentives, not a crystal ball or a substitute for your own calibrated sense of the pool's dynamics and risks. It makes the murky reasons for trade explicit, forcing you to confront them quickly before money moves.
