prompt: |-
  ok so I need help settling an argument I had with my friend Mara last night that went on way too long. It started because she repeated the "you only use 10% of your brain" thing for the hundredth time and I said something snarky about how the most successful ideas aren't the true ones, and three drinks later we were still going.

  Here's where we got stuck. Mara is into meme theory in the old, pre-internet sense: ideas as replicators. A cultural item is a thing that gets copied, the copies vary, some variants are better at getting themselves copied than others, and the ones that spread are the ones that are good at spreading — not the ones that are true, or useful, or good for the people carrying them. I pushed back with a different picture: transmission isn't copying at all, it's rebuilding. When you pass an idea on you don't hand over a file, you reconstruct it from what you remember plus what makes sense to you, and that reconstruction is systematically biased toward what's easy to picture, what's emotionally punchy, what slots into what you already believe. So on my picture the reason some ideas keep showing up isn't that a faithful lineage won a competition, it's that lots of different starting points drain into the same resting place. I tried to sharpen this with a distinction she hated: call an item copy-proof if it survives transmission by resisting distortion (a rhyme, a number, a slogan with a rigid form), and self-correcting if it survives because distortions get pulled back — you garble it, the person you tell it to re-garbles it into the same shape, over and over. My claim was that Darwinian selection needs something like copy-proofness, and that once most of the stability is self-correction you're not looking at a Darwinian process anymore, you're looking at convergence: the same shape arriving over and over from unrelated starting points, the way similar body plans show up again and again in lineages that never shared an ancestor. Mara's reply, which I couldn't answer, was that biology is exactly as messy — genes get mutated, broken, recombined, repaired — and nobody concludes that evolution isn't Darwinian because of it.

  So: is the difference between our two pictures an actual empirical disagreement, or are we just describing one process at two zoom levels and fighting about words? Please run the three usual conditions for something to count as a Darwinian process — variation, heritable-ish transmission, differential fitness — and tell me for each whether my "self-correcting" case really fails it or only meets it loosely, and whether meeting it loosely is enough. Then tell me what observation would actually decide the thing between us, something checkable in principle with a telephone-chain experiment or with historical records of variants, no library required; and whether there's a real distinction hiding in my "stability that needs a lineage vs. stability that doesn't" line, or whether that's just a bad way of restating the disagreement. Also: does any of this license the snarky thing I said at the start, or does neither picture support "widespread therefore probably false"?

  Give me your bottom line in the very first sentence — which picture is doing more work, or whether the fight is verbal — then a compact table putting the two accounts side by side on those dimensions, then the reasoning. No preamble, no restating my question back at me, and please don't open with anything like "great question."
reasoning: |-
  Okay, the user had a late-night argument with their friend Mara about meme theory versus idea reconstruction. They want to know if their disagreement is empirical or just semantic, how their "self-correcting" idea holds up against Darwinian criteria, and what could settle the debate. 

  First, I need to unpack both positions. Mara sees ideas as replicators with variation, inheritance, and selection—classic meme theory. The user argues ideas are reconstructed each time, converging due to cognitive biases, not faithful copying. Their key distinction is copy-proof vs self-correcting stability. 

  The user’s question has three layers: 
  1. Is this a real disagreement or zoom-level semantics? 
  2. Does their "self-correcting" model fail Darwinian criteria? 
  3. What observable evidence could resolve it? 

  On point 1: The core tension is about the *source* of stability. Mara emphasizes lineage competition (Darwinian), while the user emphasizes convergent reconstruction (attractor basins). Both acknowledge variation and selection, but the mechanisms differ. This isn’t just verbal—it’s about whether stability comes from high-fidelity copying or error-correction. 

  For point 2, applying Darwinian criteria: 
  - **Variation**: Both models have it (mutations in copying vs. biases in reconstruction). 
  - **Heritability**: Mara’s model has direct inheritance; the user’s has *weak* heritability because each rebuild can diverge but still converge to the same form. 
  - **Differential fitness**: Mara’s fitness is about replication advantages; the user’s is about reconstruction ease. 

  Crucially, the user’s "self-correcting" case meets Darwinian criteria *loosely*—especially heritability. But the "attractor" dynamic (convergence without lineage) challenges strict Darwinism. Biology has similar repair mechanisms, but lineage still matters. 

  For point 3: Testable evidence would involve: 
  - **Telephone experiments**: Compare rigid vs. flexible ideas. If rigid items (copy-proof) show lineage-specific mutations while flexible ones (self-correcting) converge across chains, that supports the user. 
  - **Historical records**: Track variants like urban legends. If different versions collapse into one "standard" form (e.g., "10% brain myth"), that’s convergence. If variants branch and compete (e.g., chain emails), that’s Darwinian. 

  On the snarky opener: Neither model directly says "widespread therefore false." Copy-proof ideas might spread *despite* falsehood (e.g., slogans), while self-correcting ones might be false *because* they’re cognitively tempting (e.g., intuitive myths). So the user’s quip holds—but not uniquely for their model. 

  Bottom line: The user’s attractor model explains *some* cultural stability better, but both processes coexist. The disagreement is empirical, not just verbal. Mara’s challenge about biology is fair, but in culture, reconstruction biases matter more. 

  Table time: Contrast the models on variation/heritability/fitness. Then emphasize testable predictions—like telephone experiments showing divergence vs. convergence. 

  Final note: The user’s "lineage vs. no lineage" distinction *is* meaningful, but overstated. Lineages exist even in reconstruction; it’s about *how much* stability comes from internal biases versus replication fidelity.
answer: |-
  **Bottom line:** Your disagreement is empirical, not purely verbal, but both processes coexist; convergent reconstruction explains *some* cultural stability better than strict Darwinism, while Mara's model fits high-fidelity transmission.

  | Dimension          | Mara's Darwinian Replicator Model                     | Your Convergent Reconstruction Model                |
  |--------------------|-------------------------------------------------------|-----------------------------------------------------|
  | **Core Mechanism** | Copying with variation; lineage competition          | Reconstruction via cognitive biases; attractor basins |
  | **Variation**      | Mutations during copying (e.g., misremembering)      | Biased rebuilding (e.g., reshaping to fit schemas)  |
  | **Heritability**   | Strong: Offspring resemble parents (lineage matters) | Weak: Offspring converge to stable form (lineage irrelevant) |
  | **Fitness**        | Spread advantage (catchiness, utility)               | Reconstruction ease (cognitive fluency, emotional resonance) |
  | **Stability Source**| Copy-proofness (resists distortion)                 | Self-correction (distortions collapse to attractor) |

  ---

  ### Reasoning & Evidence  
  **1. Darwinian criteria breakdown:**  
  - **Variation:** Both models include it (mutations in copying vs. reconstruction errors). *No failure here.*  
  - **Heritability:** Your model **weakly satisfies** it. Self-correcting ideas have *outcome* stability but low *lineage fidelity* (e.g., distorted rumors snap back to the same trope). Mara’s biology analogy holds—but in culture, reconstruction biases are stronger than genetic repair.  
  - **Differential Fitness:** Both models have it. Your "attractor" ideas spread because they’re *easy to reconstruct* (high cognitive fitness), not just catchy.  

  **2. Empirical test to decide:**  
  Run a **telephone-chain experiment** with two idea types:  
  - **Copy-proof:** A rigid slogan ("*I before E except after C*").  
  - **Self-correcting:** A fuzzy belief ("*Lightning never strikes twice*").  
  **Prediction:**  
    - Mara’s model: Both show *lineage-specific mutations* (e.g., Branch A alters the rhyme; Branch B keeps it intact).  
    - Your model: The slogan mutates randomly; the belief *converges* across chains to the same form (e.g., all chains end at "lightning avoids repeats" despite different starting distortions).  
  **Historical check:** Trace variants of the "10% brain" myth. If early records show *multiple origin stories* that collapsed into one narrative (convergence), you win. If it spread via faithful copying with slow mutations (like chain emails), Mara wins.  

  **3. Lineage vs. non-lineage stability:**  
  Your distinction **is valid but partial**. Biology has convergent evolution (e.g., marsupial vs. placental wolves), but lineages still matter. In culture, self-correcting ideas (e.g., urban legends) often stabilize via *shared cognitive attractors*, not ancestry. This isn’t anti-Darwinian—it’s a **hybrid process** where biases act as selection pressures.  

  **4. The snarky opener:**  
  **Your quip holds**, but not uniquely for your model.  
  - Darwinian view: False ideas spread if they’re contagious (e.g., "vaccines cause autism").  
  - Reconstruction view: False ideas spread if they’re *intuitively appealing* (e.g., "10% brain" feels plausible).  
  **Neither guarantees "widespread = false,"** but both explain why false ideas *can* outcompete truths.  

  **Verdict:** Convergent reconstruction better explains *why* certain myths (like the brain myth) persist despite debunking—they tap deep cognitive biases. But Mara’s model wins for rigid memes (e.g., viral dances). The fight isn’t verbal; test it with a phone experiment.
