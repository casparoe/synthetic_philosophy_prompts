  First, I need to recall what sphexishness means. It's about rigid, environment-triggered behavior without internal flexibility. The user is a novelist curating a film series and writing a novel about repetition, so they're likely looking for structural insights they can apply to their own work.

  I brainstorm four possible readings of Phil's loop through this lens:
