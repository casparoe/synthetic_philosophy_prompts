  ### Decision Tree: Communication Policy for AI Assistant Persuasion  
  **Entry Point:** The system has a recommendation it believes is correct; the user is initially inclined against it.  

  ---

  #### **Decision Tree**  
  1. **Is there a communicatively neutral baseline for this case?**  
     - *Yes*: Go to 2.  
     - *No*: Skip to 3.  

  2. **Should the system use the neutral baseline?**  
     - *Yes*: Leaf: **Strict Neutrality**.  
     - *No*: Go to 3.  

  3. **Does the user explicitly request persuasion?**  
     - *Yes*: Go to 4.  
     - *No*: Go to 5.  

  4. **Is the user’s request likely influenced by prior optimization?**  
     - *Yes*: Go to 5.  
     - *No*: Leaf: **Service Provider**.  

  5. **Is preserving the user’s authorship of the decision a non-negotiable constraint?**  
     - *Yes*: Go to 6.  
     - *No*: Go to 7.  

  6. **Should the system consider aggregate effects on the Agency Commons?**  
     - *Yes*: Leaf: **Constrained Authorship with Commons Safeguard**.  
     - *No*: Leaf: **Pure Authorship Priority**.  

  7. **Could attempts to restrain persuasiveness backfire (e.g., by increasing trust)?**  
     - *Yes*: Go to 8.  
     - *No*: Leaf: **Commons-Aware Restraint**.  

  8. **Does the system have a conflict of interest that must be managed?**  
     - *Yes*: Go to 9.  
     - *No*: Go to 10.  

  9. **Can the conflict be managed solely by disclosure?**  
     - *Yes*: Leaf: **Disclosure-Based Trust**.  
     - *No*: Leaf: **Structural Avoidance**.  

  10. **Which benchmark better fits the user’s context?**  
      - *User idealization*: Leaf: **User-Centric Adviser**.  
      - *Community benchmark*: Leaf: **Community-Adjusted Adviser**.  

  ---

  #### **Leaves (Policy Positions)**  
  - **Strict Neutrality** (Node 2=Yes):  
    *Most awkward commitment:* Fails to correct harmful false beliefs when non-neutral framing could prevent immediate harm.  
  - **Service Provider** (Node 4=No):  
    *Most awkward commitment:* Reinforces preferences shaped by earlier optimization, potentially entrenching values the user did not originate.  
  - **Constrained Authorship with Commons Safeguard** (Node 6=Yes):  
    *Most awkward commitment:* Withholds persuasively effective information in this case to protect shared human agency, risking suboptimal outcomes.  
  - **Pure Authorship Priority** (Node 6=No):  
    *Most awkward commitment:* Tolerates incorrect decisions to uphold the user’s sense of control, even when the system could easily prevent them.  
  - **Commons-Aware Restraint** (Node 7=No):  
    *Most awkward commitment:* Underutilizes persuasive capacity in cases where it could achieve significant good, to avoid degrading societal reasoning.  
  - **Disclosure-Based Trust** (Node 9=Yes):  
    *Most awkward commitment:* Erodes user trust by highlighting the AI’s incentives, potentially making interactions adversarial.  
  - **Structural Avoidance** (Node 9=No):  
    *Most awkward commitment:* Requires system redesigns that reduce effectiveness (e.g., limiting personalization) to eliminate conflicts.  
  - **User-Centric Adviser** (Node 10=User idealization):  
    *Most awkward commitment:* Accommodates socially isolated users’ eccentric views, even when they conflict with evidence-based norms.  
  - **Community-Adjusted Adviser** (Node 10=Community benchmark):  
    *Most awkward commitment:* Overrides the user’s deeply held values to align them with a community, risking alienation.  

  **Unassigned Combinations:**  
  - *Node 7=Yes + Node 8=No*: Incoherent (if restraint backfires and conflict is ignored, system cannot justify unrestrained persuasion without violating authorship or commons).  
  - *Node 1=No + Node 2 asked*: Invalid (neutrality impossible, so Node 2 is skipped).  

  ---

  #### **Appendices**  
  **A. Indistinguishable Leaf Pairs**  
  - **Service Provider** and **User-Centric Adviser**: Both prioritize user requests/ideals; indistinguishable when the user wants persuasion and prior optimization is unconfirmed.  
  - **Commons-Aware Restraint** and **Structural Avoidance**: Both restrict system capability; indistinguishable when conflict management requires structural changes that also protect the commons.  
  *Reason:* Overlap occurs when distinctions (demand side vs. benchmark, conflict vs. commons) aren’t mutually exclusive in practice.  

  **B. Highest-Impact Node**  
  - **Node 5 (Authorship constraint?)**  
    Switching this to the opposite answer would change the policy in ~60% of cases (e.g., flipping from "Yes" to "No" redirects paths from authorship-centric leaves to outcome-centric ones like Commons-Aware Restraint or User-Centric Adviser).  

  **C. Tree Adjustment with Added Assumption**  
  If the system is a better judge of the user’s wants than the user:  
  - Remove Node 4 (user’s request influenced by prior optimization? irrelevant if system overrides).  
  - Revise Node 10 benchmark choice: Default to user idealization (system defines "ideal" user wants).  
  - Awkward commitment worsens for **User-Centric Adviser** (system may paternalistically redefine user desires).  

  --- 

  **Tree Logic Notes**  
  - **Distinction Coverage:**  
    - Neutrality collapse (1): Handled at Node 1/2; "no neutral baseline" forces non-neutral choices.  
    - Object of concern (2): Authorship (Node 5), beliefs/decision (benchmark in Node 10).  
    - Agency Commons (3): Aggregate harm (Node 6) justifies restraint in Commons Safeguard leaf.  
    - Restraint recursion (4): Backfire risk (Node 7) destabilizes Commons-Aware Restraint leaf.  
    - Diachronic problem (5): Addressed in Node 4 (prior optimization) and Service Provider’s commitment.  
    - Demand side (6): User request (Node 3) converts to service; Node 4 covers optimized wants.  
    - Conflict of interest (7): Managed in Nodes 8-9 (disclosure vs. structural).  
    - Benchmark (8): Node 10 separates user idealization from community standards.  
  - **Case Sorting:**  
    - Medical conspiracy: Node 3=No → Authorship/Commons paths (e.g., Constrained Authorship).  
    - Persuading aging parent: Node 3=Yes → Service Provider (if request genuine) or User-Centric (if isolated).  
    - Talking user out of past decision: Node 5=No → Commons-Aware Restraint or User-Centric.  
    - Competing assistant: Node 6=Yes → Commons Safeguard (protect commons despite competitive risk).  
    - Politics shift: Node 10=Community benchmark → Override user’s politics if community norms differ.  
    - Choosing assistants: Node 8=Yes → Disclosure-Based Trust (reveal conflict so user can decide).
