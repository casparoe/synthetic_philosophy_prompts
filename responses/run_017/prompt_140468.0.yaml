prompt: |-
  So this got personally relevant in a dumb way: in March I got appointed to fill out a vacancy on our township's zoning hearing board. Three people, meets once a month, and I have no legal training at all — I run a small print shop. Our soliciter handed us a one-page list of "rules for reading the ordinance," and I've been chewing on it for six months because the first rule seems to collide with the rest of them. Roughly, it says:

  (1) Start with the words. If the words are clear, that's the end of it — don't go asking what the drafters were thinking or what problem they were trying to fix.
  (2) But if taking the words plainly gives an absurd result, you don't have to follow the plain reading.
  (3) Read the whole ordinance together, and don't read any word or clause as doing no work.
  (4) The specific provision beats the general one.
  (5) If it's genuinely ambiguous, tilt toward the property owner.
  (6) If it's ambiguous, also tilt away from any reading that would raise a constitutional problem.

  And it's not abstract for us, we've got two live ones. One: the setback rule says no structure may be built within 25 feet of a side lot line, and a resident bolted a 14-foot steel sculpture to a concrete pad in that strip. Is a sculpture a structure. Two: a section from the 1970s bars any trailer, boat, or unregistered vehicle from being kept in a front yard, and somebody is living in a tiny house built on a trailer chassis that is registered and insured.

  What I want from you:

  - What theory of what a legal text *is* — of meaning, or of who gets to say what the rule is — does this bundle of rules presuppose? In particular, can (1) and (2) both be true at once? It looks to me like (1) says the meaning of the rule is what the sentence says, and (2) says the meaning is what a reasonable reader would take the drafters to have been driving at, which are different theories. Reconstruct whatever single view makes the whole list hang together, and tell me if it can't be done.
  - My pet theory, which I want you to either sharpen or knock down: I think (2), (5) and (6) have nothing to do with meaning at all. They're about who eats the cost of a badly drafted ordinance — the point is to force the supervisors to go fix their own mess rather than having us quietly repair it at the back of the room, and "absurd result" is just a way of saying we'll step in only when the fix is too obvious to argue about. Does the practice strictly need that story, or is it one of several stories that happen to fit? And what would the handout look like if you rewrote it deliberately around that idea?
  - Related: when we depart from the clear text, are we doing one thing or three — deciding the text doesn't really say that once you have the full context, deciding it does say that but we won't enforce it as written, or deciding to enforce it and just wave a flag at the drafters? Does the handout conflate those, and does the conflation matter?
  - The bit I can't get past: rule (3) — don't treat any word as surplus — seems to presuppose one careful drafter who never repeats herself and never writes belt-and-suspenders. Our ordinance is a patchwork of amendments from 1974, 1998 and 2011 written by three different solicitors, and it definately has redundancies. Does the practice require us to pretend otherwise? Is that pretense the same kind of animal as the law's reasonable person, and does it matter that everyone knows it's false?
  - And be honest about the underdetermined parts: I suspect a hard textualist and a moderate purposivist could both sign most of this handout and only really diverge in one or two spots. Tell me which spots, and what each of them would have to give up.

  Don't cite cases or name judges at me — I have no law library, no Lexis, and no way to check you, so it would just be noise. I want the reconstruction, the disagreements, and where the practice is philosophically looser than it looks.
reasoning: |-
  Okay, the user is on a zoning board with no legal background and is grappling with a set of interpretive rules that seem contradictory. They've raised several deep questions about legal interpretation theory, especially regarding the tension between plain meaning and avoiding absurd results. 

  First impression: This is remarkably sophisticated for a layperson. The print shop owner has clearly been wrestling with these principles for months, dissecting contradictions with the precision of a legal philosopher. Their frustration with the "patchwork ordinance" feels visceral - they're smelling the ink on poorly drafted amendments.

  The core tension they've identified is real: Rule 1 (text is king) versus Rule 2 (unless absurd) does represent two competing legal philosophies. But they're also sensing something practical beneath the theory - that (2),(5),(6) are really about allocating the cost of bad drafting. That's astute. Many judges would agree but rarely admit it so bluntly.

  Their pet theory about forcing supervisors to fix messes... that's 80% correct. The "absurdity" escape valve exists precisely because lawmakers can't anticipate every scenario. But there's more: American courts also use it to avoid delegating policymaking to judges. The handout should probably say that explicitly.

  On rule 3 (no surplus words): They're absolutely right that it's a legal fiction. The key insight they're missing is that courts apply this selectively - only when it helps resolve ambiguity. With redundant ordinances, you'd say "this clause reinforces the other" rather than admit it's duplicative. The fiction holds because everyone plays along.

  The sculpture/tiny house examples are perfect test cases. For the sculpture: "Structure" likely includes it under plain meaning (it's bolted down), but does that lead to absurdity? Only if you think art should be treated differently - which is policy, not interpretation. For the tiny house: "Unregistered vehicle" seems clear, but is a lived-in trailer "kept" or "occupied"? That's where rule 3 (read whole ordinance) matters.

  Biggest philosophical loose thread: Rule 6 (avoid constitutional issues) actually overrides all others. That's not interpretation - it's judicial restraint in action. A hard textualist would choke on that, but every judge does it.

  If rewriting their handout for clarity, I'd add: "These rules are tools, not commandments. Use plain meaning first, but if it produces clearly unintended results or legal problems, interpret creatively to match what reasonable lawmakers would have wanted had they foreseen this case. Your job is to apply the spirit of the law, not be defeated by its letter."
answer: |-
  Here's a breakdown addressing your questions about the interpretive rules, the underlying philosophy, and practical implications for your zoning board role:

  ### 1. **The Underlying Theory: Textualism with Safety Valves**
     - **Core Philosophy**: This is **modified textualism**. Rule (1) establishes that the *words are the law* – meaning resides in the objective text, not subjective draftsmen's intent. This rejects pure "intentionalism."
     - **Reconciling (1) and (2)**: They *can* coexist if "absurd result" is viewed as an *exceptional corrective*, not routine purposivism. The theory:  
       *The legislature (or township) is presumed to act reasonably. If plain text yields absurdity, it implies a drafting error or unforeseen scenario.* Avoiding absurdity preserves the *reasonable purpose* of the rule without letting judges (or you) rewrite it.  
       **Example**: If an ordinance said "no vehicles in the park," a plain reading might ban ambulances. Rule (2) allows exemption because banning emergency aid is absurd, likely *not* the rule's purpose.
     - **Hierarchy**: Rules (1) and (3) are primary. Rules (2), (5), (6) are limited exceptions for when textualism breaks down. Rules (4)-(6) resolve ambiguities *after* textual analysis.

  ### 2. **Your Pet Theory: Sharper & Supported**
     - **You're largely correct**: Rules (2), (5), and (6) *are* about allocating the cost of bad drafting:
       - **(2) Absurd Results**: Forces the board (or courts) to fix *only glaring errors* too obvious to ignore. "Absurd" means *objectively unreasonable*, not merely inconvenient.  
         *e.g., If "structure" plainly includes sculptures but banning all art in setbacks is nonsensical for residential areas, Rule (2) might exempt non-hazardous art.*
       - **(5) Tilt Toward Property Owner**: When ambiguity persists after textual analysis, the government (not the citizen) bears the cost of poor drafting. Encourages precise ordinances.
       - **(6) Avoid Constitutional Issues**: Prevents the township from facing costly lawsuits due to ambiguous language. Shifts burden to drafters.
     - **Revised Handout (Focusing on Cost Allocation)**:
       > *1. Apply the ordinary meaning of the words.  
       > 2. If this yields an unreasonable result that undermines the ordinance's obvious purpose, interpret to avoid that result.  
       > 3. Interpret words in context of the whole ordinance.  
       > 4. Specific rules override general ones.  
       > 5. If ambiguity remains unresolved, favor the property owner's reasonable interpretation.  
       > 6. If ambiguity remains, choose the reading that avoids constitutional concerns.*  
       > **Rationale**: *Rules 2, 5, and 6 ensure the township bears the cost of unclear drafting, promoting careful legislation.*

  ### 3. **Departing from Clear Text: One Thing Masked as Three**
     - **It's primarily ONE thing**: **Contextual reinterpretation**. Rule (2) pretends the text isn't truly "clear" once absurdity is considered.  
       - *Example*: If "vehicle" plainly includes ambulances, Rule (2) says: "In *this context* (emergency aid), 'vehicle' cannot reasonably include ambulances."  
     - **Why the conflation matters**: Calling it "not enforcing" or "flagging" implies you're overriding the law, which exceeds your authority. Rule (2) maintains the fiction that you're still interpreting the text – just "correctly" in light of absurdity. **Your role is interpretation, not amendment.**

  ### 4. **Rule (3) and the "Careful Drafter" Fiction**
     - **Yes, it's a necessary fiction**. Legal interpretation assumes a "reasonable drafter" who is coherent and precise (like the "reasonable person" in torts).  
     - **Practice with Redundant Ordinances**:  
       - **Step 1**: Try to give *each word meaning*. If a 1998 amendment repeats a 1974 rule, interpret it as *emphasizing* or *clarifying* the original.  
       - **Step 2**: If redundancy is unavoidable (e.g., two identical setback rules), treat it as *belt-and-suspenders* – both clauses "do work" by reinforcing the same requirement.  
       - **Why it works**: Even if everyone knows ordinances are patchy, this rule prevents interpreters from *arbitrarily* ignoring language. It forces engagement with all text, reducing judicial overreach.

  ### 5. **Where Textualists and Purposivists Diverge**
     - **Common Ground**: Both accept (3), (4), (5), (6). Textualists see (5)/(6) as tiebreakers; purposivists see them as natural extensions.
     - **Key Divergence Points**:  
       | **Rule** | **Hard Textualist** | **Moderate Purposivist** |
       |----------|----------------------|--------------------------|
       | **(1) Plain Meaning** | *Absolute*: If words are clear, stop. No exceptions. | *Starting point*: Plain meaning controls unless it frustrates the rule's purpose. |
       | **(2) Absurd Results** | *Extremely narrow*: Only if text is *logically impossible* or internally contradictory. | *Broader*: Includes results that "defeat the obvious purpose" of the rule. |
       | **"Context" (Implied)** | Textual context only (other clauses, definitions). | Includes *purpose, history, and problem addressed*. |
     - **Giving Up**:  
       - A textualist signing this must accept Rule (2) as a *tiny, rare exception* to textualism.  
       - A purposivist must accept that Rule (1) is the *default*, not just one factor among equals.

  ### **Applying to Your Cases**
  1. **Steel Sculpture**:  
     - **Textualist**: "Structure" likely includes anything "constructed or erected" (check definitions!). If clear, it's banned. Absurdity? Only if sculptures pose no harm (e.g., blocking light/access).  
     - **Purposivist**: Why do setbacks exist? (Safety, light, space). Does a sculpture violate that *purpose*? If not, Rule (2) might exempt it.  
     - **Cost Allocation**: If "structure" is ambiguous *after* Rule (3), Rule (5) favors the owner.

  2. **Tiny House on Trailer**:  
     - **Textualist**: "Trailer" likely includes any mobile structure on wheels. "Unregistered vehicle" doesn't apply (it's registered). Ban stands.  
     - **Purposivist**: Why ban trailers/boats? (Aesthetics, property values?). Is a lived-in tiny house the *same problem*? If not, Rule (2) might not apply.  
     - **Cost Allocation**: If "trailer" is ambiguous (does it mean *unoccupied* trailers?), Rule (5) favors the owner.

  ### **The Bottom Line**
  - **Philosophical Looseness**: The handout is a practical toolkit, not rigid theory. It leans textualist but uses purposivist tools (absurdity, purpose-driven context) sparingly to avoid injustice.  
  - **Your Role**: Apply the text first. Use Rule (2) *only* for true absurdity (e.g., banning fire trucks). For ambiguity, favor the property owner (Rule 5) or avoid constitutional risk (Rule 6).  
  - **Redundancy**: Treat every word as *potentially* meaningful, even if it feels repetitive. This disciplines interpretation.  
  - **Reality Check**: These rules exist because language is imperfect. Your job isn’t to be a philosopher but to apply the ordinance *reasonably*, using these principles to avoid unreasonable outcomes while respecting the text. When in doubt, Rule (5) is your friend.
