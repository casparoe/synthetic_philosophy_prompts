prompt: |-
  I'm in an undergraduate seminar on just war theory, and last week we discussed the "supreme emergency" exemption: the idea that a community facing imminent and catastrophic defeat may do what the in bello rules otherwise forbid, with the area bombing of German cities in 1940–42, when Britain stood effectively alone, as the stock example. In the middle of that discussion, one student defended the bombing by saying, "well, all's fair in love and war," and our TA replied that the proverb hides several quite different claims and that at most one of them could do the work its user needed. Could you lay those readings out as a menu — for instance, that in bello rules are mere conventions that lapse under enough pressure; that military necessity simply overrides them; that the acts in question are not permitted but excused, the "dirty hands" reading; that "fair" means symmetric rather than unlimited, i.e. that combatants on both sides have the same permissions whatever the justice of their cause; or that in extremis the combatant/non-combatant distinction itself gives way — and for each say whether it is a platitude, defensible but contentious, or straightforwardly false, and whether it actually gets you to the conclusion it was being used for, namely that deliberately targeting civilians in that case was permissible rather than merely excusable or tragic? I'd like to know which reading is doing the real argumentative work and which ones are only gesturing at it.
reasoning: |-
  Okay, the user is in an undergraduate seminar on just war theory, specifically discussing the "supreme emergency" exemption. They mentioned a class discussion where a student defended the area bombing of German cities during WWII using the proverb "all's fair in love and war." The TA responded that this proverb hides several different claims, and at most one could support the argument. The user wants me to break down the possible interpretations of that proverb, evaluate each one (as platitude, defensible, or false), and see if it justifies the permissibility of targeting civilians in a supreme emergency.

  First, I need to recall the different philosophical interpretations the TA might be referring to. The user provided some options: in bello rules as conventions that lapse under pressure; military necessity overriding rules; acts as excusable but not permissible (dirty hands); "fair" meaning symmetric permissions; or the combatant/non-combatant distinction giving way. I should address each of these systematically.

  Starting with the conventions interpretation. This is the idea that rules of war are just social constructs that dissolve when survival is at stake. In just war theory, this is problematic because the rules are based on deeper moral principles, not mere agreements. Walzer would argue against this, so it's defensible but contentious. However, it might lead to permissibility, but it's not the strongest argument.

  Next, military necessity overriding in bello rules. This is a common utilitarian argument. If the stakes are high enough, like preventing a greater evil, it might justify bending the rules. But this clashes with deontological principles that prohibit targeting non-combatants. So, it's defensible but contentious. It could support permissibility in a supreme emergency, as Walzer suggests provisionally.

  Then there's the dirty hands approach. This separates permissibility from blame. Even if an act is morally wrong, it might be necessary, leaving the actor with dirty hands. Walzer uses this in his original discussion of supreme emergency. Here, the acts are excusable but not permissible, so it doesn't justify the initial claim that the bombings were permissible. The user specifically asked about permissibility vs. excusable, so this interpretation doesn't get them to the desired conclusion.

  The symmetric permissions interpretation suggests that both sides have the same rights regardless of jus ad bellum. This is related to the independence thesis. While combatant equality is a platitude, applying it to non-combatant immunity is false because the distinction protects civilians universally. This doesn't support targeting civilians; it actually undermines it since both sides should protect non-combatants. So, it doesn't help the argument at all.

  Lastly, the idea that the combatant/non-combatant distinction collapses in extremis. This argues that in total war scenarios, everyone contributes, so targeting civilians becomes permissible. But this is straightforwardly false in just war theory. Non-combatant immunity is a cornerstone, and exceptions aren't accepted. Even in supreme emergency, it's a violation, not a lapse of the rule. So this is false and doesn't justify permissibility.

  Now, putting it together, the user wants to know which interpretation actually supports permissibility. The military necessity view does, though contentiously. The dirty hands approach gets to excusability but not permissibility. The other interpretations either don't hold or contradict the argument. The real work is done by military necessity, while dirty hands is a fallback. The user might also be looking to understand the nuances for their seminar discussions or papers, so clarity on each point is key. They might need to present these distinctions in class or use them in their own arguments. Highlighting that "all's fair" is too vague and that each interpretation has different implications for permissibility versus excuse will address their deeper need to critically engage with just war principles.
answer: |-
  Here's a breakdown of the possible readings of "all's fair in love and war," evaluated for their status (platitude, defensible/contentious, false), their ability to justify the *permissibility* (not just excuse) of targeting civilians in a supreme emergency, and which one likely does the *real* argumentative work:

  **The Menu of Interpretations:**

  1.  **Conventionalism:** The *in bello* rules (like non-combatant immunity) are mere social conventions or agreements, not deep moral principles. Under sufficient pressure (like supreme emergency), these conventions lapse, and previously forbidden acts become permissible.
      *   **Status:** Defensible but **Highly Contentious**. (Legal positivists or strict realists *might* argue this; most just war theorists, especially Walzer-inspired ones, strongly reject it).
      *   **Gets to Permissibility?** **Yes**, but weakly. It directly states the rules *don't apply* anymore, making the act permissible *in that context*. However, it struggles against the claim that non-combatant immunity is grounded in fundamental human rights, not convention.
      *   **Role:** A potential supporting argument, often implicit, but rarely the *primary* driver in serious just war discussion. It undermines the moral weight of the rules.

  2.  **Military Necessity Override:** The principle of military necessity – achieving a vital objective crucial for survival – can, in truly extreme circumstances, morally override the *in bello* prohibitions. The catastrophic evil being prevented *justifies* violating the rule.
      *   **Status:** **Defensible but Contentious.** This is the core of Walzer's *provisional* acceptance of supreme emergency as a justification (not just excuse). Critics (e.g., absolute pacifists, strict deontologists like Elizabeth Anscombe) find it abhorrent and believe some acts (like targeting civilians) are *never* justified.
      *   **Gets to Permissibility?** **Yes, explicitly.** This is the interpretation that directly aims to establish that deliberately targeting civilians *can be morally permissible* (not just excusable) *if* the threat is sufficiently catastrophic, imminent, and no other options exist. Walzer argues Britain met this threshold in 1940-41.
      *   **Role:** **This is almost certainly the interpretation doing the *real* argumentative work** in the context of defending the supreme emergency exemption and the early British bombing. It directly addresses the moral conflict and offers a (contentious) path to permissibility based on consequentialist reasoning within a largely deontological framework.

  3.  **Dirty Hands / Excuse:** The *in bello* prohibitions remain absolute moral prohibitions. Violating them (like bombing civilians) is always morally *wrong*. However, in supreme emergency, a leader may be *excused* or *absolved* for committing this wrong because they faced an impossible choice to prevent a greater evil. They get "dirty hands."
      *   **Status:** **Defensible but Contentious.** This is a different strand within moral philosophy (often associated with Michael Walzer's *original* formulation of supreme emergency and thinkers like Max Weber on the ethics of responsibility). Critics argue it incoherently separates justification from blame or provides too easy an "out."
      *   **Gets to Permissibility?** **No.** This interpretation explicitly **denies permissibility.** The act remains *wrong*, but the actor might not be (fully) blameworthy. It gets you to "excusable" or "tragic necessity," **not** "permissible." If the TA was pushing back against permissibility, this might be what they had in mind as the *only* plausible reading, but it doesn't support the student's claim that the bombing was *permissible*.
      *   **Role:** Often presented as the *alternative* to the Military Necessity Override view. It's crucial for understanding the deep moral tension but directly *contradicts* the claim that "all's fair" means the act was okay. It's a fallback position if permissibility arguments fail.

  4.  **Symmetry ("Fair" as Equal Permissions):** "Fair" means that combatants on both sides of a conflict have the *same* set of permissions and restrictions in fighting the war (*in bello* rules), regardless of the justice of their cause (*jus ad bellum*). This is the "moral equality of combatants."
      *   **Status:** A **Platitude** within the *in bello* framework itself. The independence of *jus in bello* from *jus ad bellum* is a foundational principle of modern just war theory and international humanitarian law (IHL).
      *   **Gets to Permissibility?** **No.** This interpretation is about *who* has permissions, not *what* those permissions are. It affirms that *all* combatants are bound by the *same* rules prohibiting targeting civilians. It actually **undermines** the permissibility argument by reinforcing the universal applicability of non-combatant immunity. It says nothing about whether those rules can be overridden.
      *   **Role:** A red herring in this context. It explains why a *Wehrmacht* soldier and a British soldier are both bound not to shoot prisoners, but it doesn't help argue that *either* is permitted to bomb cities.

  5.  **Collapse of the Combatant/Non-Combatant Distinction:** In total war or supreme emergency, the distinction between combatants and non-combatants breaks down. Civilians are so integrated into the war economy/machine that they become legitimate targets ("fair game").
      *   **Status:** **Straightforwardly False** within just war theory and IHL. While the line can be blurry (e.g., workers in munitions factories), the core principle that civilians *not* directly participating in hostilities are immune from deliberate attack is absolute. Supreme emergency might be argued to *justify violating* this distinction, but it doesn't mean the distinction *ceases to exist* or becomes morally irrelevant. Walzer explicitly rejects this.
      *   **Gets to Permissibility?** **Tries, but fails on its own terms.** If the distinction *truly* collapsed, then targeting wouldn't be "targeting civilians" anymore – they'd *be* combatants. But this is empirically and morally inaccurate. It's usually used as a *rationalization* for targeting civilians, not a sound moral argument. Even if accepted, it would make targeting *permissible* only by redefining the victims, not by overriding a prohibition.
      *   **Role:** Often used as wartime propaganda or a post-hoc justification, but carries little weight in ethical analysis. It gestures towards the *effect* total war has on perception, not a moral principle.

  **Conclusion: What's Doing the Work & What Gets You There**

  *   **The Real Argumentative Work:** The **Military Necessity Override (#2)** is almost certainly the interpretation intended to do the heavy lifting in justifying the *permissibility* of the bombing under supreme emergency. This is Walzer's core argument for the exemption. It directly confronts the moral dilemma and argues that the rules can be justifiably breached in catastrophic circumstances.
  *   **The Fallback Position:** The **Dirty Hands (#3)** interpretation is the main alternative offered within serious discourse, but it explicitly **denies permissibility**, settling for excuse. If the TA argued only *one* reading could possibly work, they likely meant this one, but it doesn't deliver what the student wanted (permissibility).
  *   **Gestures and Red Herrings:**
      *   **Conventionalism (#1)** gestures at the idea that rules aren't absolute but struggles against the deep moral foundation of non-combatant immunity.
      *   **Symmetry (#4)** gestures at standard *in bello* structure but is irrelevant or even counterproductive to the permissibility argument.
      *   **Collapse of Distinction (#5)** gestures at the *reality* of total war but provides a false moral justification by misrepresenting the status of civilians.
  *   **What Gets You to *Permissibility*:** Only **Military Necessity Override (#2)** seriously attempts to get you to the conclusion that deliberately targeting civilians was *permissible* (not just excusable or tragic) in the British supreme emergency. **Conventionalism (#1)** tries but fails robustly against moral critiques. The others either deny permissibility (#3) or don't address the core issue (#4, #5).

  The proverb "all's fair in love and war" is indeed a sloppy and potentially dangerous oversimplification. The TA was correct: it masks fundamentally different, and often incompatible, ethical claims. In the context of justifying supreme emergency bombing, it primarily serves as a crude shorthand for the highly contentious Military Necessity Override argument.
