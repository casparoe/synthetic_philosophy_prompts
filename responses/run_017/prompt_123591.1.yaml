prompt: |-
  I keep noticing the same move in arguments and I don't have a word for it. Hoping there's an established one, or that someone can coin a good one.

  I'm a backend engineer, no philosophy background, and I got dragged into a dinner argument about Malthus. The claim was: population compounds, food production only adds, so famine. Someone pointed out that the famine didn't happen, and in fact the opposite happened. The reply was that the mechanism was right but the timeline was wrong — we were "right but early" — because of stuff nobody could have foreseen in 1800: fertilizer, mechanization, the green revolution. Then the date gets moved out.

  Here's what I can't sort out. I've seen three versions of this and they feel different but I can't say why from the outside.

  Version one, which seems fine: at work we said the service falls over at 10x traffic. It didn't. But we could name the specific thing that changed — we'd put a cache in front of it since — and we could redo the arithmetic with that variable included and get a new number that we then actually tested. Nothing sketchy there.

  Version two, which seems bad: a prediction fails, and the response is just a new date. No new variable named, no re-derived number, nothing added to the theory except "later." And when that date passes, another one. What gets me is that this doesn't feel unfalsifiable in the plain sense. These people keep making testable dated predictions and they keep being wrong, and being wrong costs them nothing. Each individual miss gets explained by something reasonable on its own — unforeseen tech, a policy change, a war — and nobody ever seems to add up the fact that it's happened four times in a row. It's not that the claim can't be tested. It's that it can be tested forever without ever losing credibility.

  Version three, which I think is a genuinely different thing: the prediction fails because the prediction was heard. Everyone gets scared, goes and builds the thing that prevents the outcome, and so the outcome never arrives. From outside that looks exactly like being wrong, but it feels like the predictor deserves credit rather than blame. Did Malthus get that? No idea.

  A friend with a philosophy minor waved at "unfalsifiable" and something about "immunizing" moves, but she couldn't remember details and neither seems right — an immunizing move is supposed to protect you from ever being tested, and these people definitely get tested, they just survive it.

  So: is there a name for version two specifically, the serial date-shift with no new content? If there are established concepts near it, tell me which ones, how my thing differs from each, and which fits best. If there's nothing, coin a term and define it with its boundary cases. I don't want a label — I want to know what to look for, from the outside, to tell version two from versions one and three, since the people doing all three say basically the same sentence.

  Also: whatever you settle on, say what would change your mind about it, and where you think your own distinction is weakest. And I'd rather have a confident answer with the weak point flagged than a list of nine things it might be.
reasoning: |-
  Okay, let me tackle this user's problem. They're a backend engineer who got into an argument about Malthusian theory and noticed a pattern in how predictions fail. They described three versions of this pattern and want a term specifically for version two—where predictions keep getting new dates without adding new variables or re-deriving numbers. 

  First, I need to understand each version clearly. Version one is straightforward: a prediction fails because of a specific change, like adding a cache. The model is updated and tested again. That's good scientific practice. Version three is the self-defeating prophecy, where the warning itself prevents the outcome. The predictor here might deserve credit. Version two is the tricky one: repeated date shifts without substantive updates to the theory, just pushing the deadline further out each time it fails.

  The user mentioned their friend suggested "unfalsifiable" or "immunizing maneuvers," but those don't quite fit because version two makes testable predictions—they're just always wrong without consequence. So I need to find a term that captures this serial postponement without adjustment. 

  I recall concepts like the "Moving the Goalposts" fallacy, but that's usually about changing criteria for success after the fact. The user's case involves time-based predictions failing repeatedly. Then there's the "Ad hoc rescue" from Lakatos, where auxiliary hypotheses protect the core theory. That seems closer. Each failure is explained away by unforeseen events (like new tech), but the core claim remains unchanged. 

  The key distinction for version two is the lack of model updates. Unlike version one, where variables are added and tested, version two just shifts the date. The predictors don't learn from failures; they just defer. And unlike version three, there's no causal link where the warning prompts action. 

  I should check if "chronological immunization" fits. It combines the temporal aspect with the idea of protecting the theory. The user needs to differentiate version two from the others. The boundary cases: if a new variable is introduced and tested (like version one), it's not version two. If the prediction's dissemination causes prevention (version three), that's different. 

  Weaknesses? Well, sometimes unforeseen events genuinely affect timelines. But the issue is the pattern—repeated excuses without model refinement. The user's observation that failures don't erode credibility is key. That's the hallmark of pseudoscience versus science. Lakatos's MSRP framework helps here: degenerative vs. progressive problem shifts. 

  So, "chronological immunization" seems apt. It captures the endless date-shifting without progress. The user can look for whether each failure leads to model updates or just a new deadline. If it's the latter, especially with ad hoc excuses, that's version two.
answer: |-
  Based on your detailed breakdown and the need to pinpoint **Version Two** specifically, the established concept that fits best is **Ad Hoc Rescue with Chronological Immunization**, drawing primarily from Imre Lakatos's philosophy of science. Here's the breakdown:

  ### The Term & Definition
  **Term:** **Degenerative Chronological Shift** (DCS)  
  *Definition: The repeated postponement of a failed prediction's timeline without substantive modification to the core theoretical model, mechanism, or variables, relying instead on *ad hoc* external factors (often unforeseeable events) to explain each failure while preserving the original claim's perceived inevitability.*

  ### Why "Degenerative Chronological Shift" Fits Version Two
  1. **Degenerative**: From Lakatos's "Methodology of Scientific Research Programmes" (MSRP). A research program becomes *degenerative* when it avoids refutation by adding *ad hoc* hypotheses that don't lead to novel predictions or empirical discoveries. Your Version Two adds no new variables, no re-derived math, no testable refinements—just excuses.
  2. **Chronological Shift**: Explicitly captures the repeated date-moving without structural change to the theory.
  3. **Key Mechanism**: Reliance on *unforeseen external contingencies* (fertilizer, wars, policy changes) as the *sole* explanation for failure. This is distinct from Version One (which *integrates* new variables) and Version Three (where the prediction *causes* prevention).

  ---

  ### How to Distinguish Version Two (DCS) from the Others
  | **Feature**               | **Version One (Valid Update)**          | **Version Two (DCS)**                     | **Version Three (Self-Defeating Prophecy)** |
  |---------------------------|-----------------------------------------|-------------------------------------------|---------------------------------------------|
  | **Response to Failure**   | Identifies & integrates **new variables** | Only shifts **timeline**; no model change | Outcome **prevented by awareness** of prediction |
  | **Theory Modification**   | Core model updated; math re-derived     | Core model unchanged; excuses added       | Prediction succeeded *by failing* (reflexive) |
  | **Testability**           | New prediction derived & empirically tested | "Tested" only by waiting for new date     | Non-repeatable (prediction altered history) |
  | **Credibility Impact**    | Failure improves model accuracy         | Failure costs nothing; credibility persists | Predictor may gain credit for averting crisis |
  | **Core Mechanism**        | **Internal variable adjustment**        | **External *ad hoc* contingencies**       | **Reflexive societal response**             |

  ---

  ### Boundary Cases & Weaknesses in This Distinction
  1. **Boundary with Version One**:  
     - *Clear Cut*: If new variables are named, quantified, and tested, it's not DCS.  
     - *Gray Area*: What if a variable is named but never quantified/tested? (e.g., "Unforeseen innovation" as a catch-all). This edges into DCS territory. **Your litmus test**: Does failure lead to a *testable* model update? If no → DCS.

  2. **Boundary with Version Three**:  
     - *Clear Cut*: If the predictor actively campaigned for prevention *based on their model*, it's Version Three. Malthus didn’t trigger the Green Revolution → his defense is DCS.  
     - *Gray Area*: What if external actors *coincidentally* prevent the outcome? DCS proponents might claim credit ("See? We warned you!"), but this is still DCS unless prevention was *caused* by the prediction.

  3. **Weakness of the Term**:  
     - **The "Unforeseeable" Dodge**: DCS relies on blaming "unforeseeable" factors. But *all* scientific models simplify reality. The flaw is refusing to *learn* from surprises. Your observation—"four failures cost nothing"—exposes this. Yet, if a *genuinely* unprecedented event (e.g., alien tech) averted famine, *could* a one-off delay be reasonable? **Yes**, but DCS is defined by the *pattern* of repeated shifts without progress.

  ---

  ### Why Other Terms Don't Quite Fit
  - **"Moving the Goalposts"**: Too broad; applies to changing success criteria (e.g., "My cancer cure works if you wait 50 years!").
  - **"Ad Hoc Hypothesis"**: Correct but incomplete; DCS specifies the *temporal* evasion.
  - **"Unfalsifiable"**: Incorrect. DCS *is* falsifiable—*if the rescheduled date passes without the event*. The issue is *evasion of accountability* despite falsification.
  - **"Immunization Stratagem"**: Close (from Popper), but DCS is a *subtype* where immunization is achieved *chronologically*.

  ---

  ### What Would Change My Mind?
  1. If repeated timeline shifts *always* involved integrating new variables into testable models (collapsing Version Two into Version One).
  2. If historical analysis proved Malthusians *directly* motivated agricultural innovation (making it Version Three).
  3. If proponents consistently abandoned the theory after N failures (showing accountability, not degeneration).

  ---

  ### In Practice: Spotting DCS
  **Listen for**:  
  - "The mechanism was right, but the timing was off due to [unforeseen X]."  
  - "It’s inevitable—just delayed."  
  - No new math/model after failure.  

  **Ask**:  
  - "What *specific* variable did you add to your model after the last failure?"  
  - "How does this new date differ from past miscalculations?"  
  - "What evidence would make you abandon the theory?"  

  **Version Two (DCS)** thrives on the inertia of inevitability. It’s not that the prediction *can’t* be falsified—it’s that each falsification is met with a temporal retreat into the future, leaving the core claim eternally "pending." Your engineer’s instinct is correct: the absence of iterative model refinement is the red flag.
