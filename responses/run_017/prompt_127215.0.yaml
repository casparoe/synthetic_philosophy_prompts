prompt: |-
  I am marking a take-home exam for a graduate seminar on judgment and decision making and would like an independent reading before I finalise the grades. The question was:

  **Question (25 marks).** "The contrast between the inside view and the outside view is often presented as giving a general argument for epistemic modesty about one's own plans. Explain the contrast, state that argument, and assess how strong it is. In your answer you must also discuss the following case.

  A team is forecasting the cost and schedule of a first-of-a-kind direct air capture plant. Their bottom-up estimate is $400m and four years. They then assemble a reference class of thirty comparable first-of-a-kind energy and chemical demonstration plants. For each, the database records the estimate made at the point of sanction and the final out-turn: the median estimate in the class is $350m and three and a half years, the median out-turn $900m and seven years. The team sets its forecast at the median out-turn, $900m and seven years.

  A colleague objects that the class was selected on the basis of, and characterised by, exactly the kind of optimistic inside-view estimates the outside view was supposed to correct for: the sanction estimates came from the same bottom-up process that produced the team's own $400m, and the recorded overruns are measured against them. On this objection the adjusted forecast inherits the very bias it was meant to remove. Assess the objection. Does the outside view still have anything to offer here, and if so what? Does your answer depend on whether the team's own estimate came from the same kind of process as the estimates in the class?"

  Below is one student's answer. Please grade it out of 25 and give me the marginal comments I could hand back with it: a mark, a brief breakdown by part of the question, and specific notes on which claims are correct, which are only half right, and which are mistaken — including anything a hasty reader would wave through.

  **Student's answer**

  "The inside view is what you get by looking closely at the case in front of you: you decompose the job into work packages, price each one, talk to the engineers, and arrive at $400m and four years. The outside view is the perspective of someone who is not inside the project — an external reviewer, a board, a consultant — who has not spent two years living with the design and has not become attached to it. In practice you get it by placing the project in a reference class of similar projects and looking at the distribution of outcomes there. Kahneman's work on the planning fallacy is the standard illustration of why the two come apart: forecasters working from the inside imagine the most likely route to completion and neglect the many ways a project can slip, so their forecasts are systematically optimistic.

  The argument for epistemic modesty is straightforward. Modesty about your own judgement means not trusting your own reading of the details when there is a track record to consult; you defer to what generally happens rather than to yourself. Once you have taken the outside view, the details of the particular case carry no evidential weight of their own — they matter only insofar as they put the case into a class with a different distribution. So the team was right to move from $400m to $900m, and arguably should have moved further.

  The colleague's objection is, I think, sound, and more damaging than it first appears. Two things go wrong. First, the reference class is not given; choosing it is itself a judgement call. The team chose first-of-a-kind demonstration plants, but it could have chosen all energy projects, or all projects of this size, or all projects its own firm has attempted, and each class would yield a different median. Because selecting the class requires the very case-specific judgement the outside view was meant to set aside, the outside view is contaminated by the inside view from the outset. Second, here the contamination is direct: the figures in the database are overruns measured against sanction estimates produced by the same optimistic bottom-up process that generated the team's own $400m. If the base rates are just other people's inside views, then consulting them is still consulting an inside view — deference to a crowd of forecasters biased in the same direction.

  So nothing is gained by the adjustment. I would discount the $900m heavily and move back toward the team's own figure, which at least reflects the specifics of this plant. The outside view is worth taking only where the reference class is fixed in advance by someone independent; here it was not, so the inside view should dominate."
reasoning: |-
  Alright, I need to evaluate this student's answer for a graduate seminar on judgment and decision making. The question is about the inside vs. outside view and the colleague's objection to the forecasting method. Let me break down the student's response part by part.

  First, the student explains the inside view and outside view correctly. They mention decomposition, talking to engineers, and getting $400m and four years. The outside view is described as using a reference class of similar projects. They reference Kahneman's planning fallacy, which is spot on. So that section seems solid. No issues here.

  Next, the argument for epistemic modesty. The student states that modesty means deferring to track records over personal judgment. They note that once the outside view is taken, specific details shouldn't sway the forecast unless they change the reference class. The student supports the team's move to $900m. This is mostly correct, but they might overstate that details carry "no evidential weight." The outside view should inform the base rate, but specifics might adjust it (regression to the mean). Still, they capture the core idea. So partial credit here.

  Now, the colleague's objection. The student agrees and points out two issues: reference class selection requires judgment, which is an inside-view contamination, and the data itself is based on optimistic estimates. They argue that using such a reference class still relies on biased inside views. This is a strong point. However, they miss that the outside view uses actual outcomes (out-turns), not the estimates. The median out-turn is $900m, which is the actual cost, not the estimate. The student conflates the base rate (actual outcomes) with the initial estimates. The colleague's objection is that the overruns are measured against biased estimates, but the out-turn values themselves are factual. So the student's claim that the base rates are "other people's inside views" is incorrect. The out-turns are real data, not estimates. That's a significant error.

  The student concludes that nothing is gained and suggests moving back to the team's estimate. They say the outside view is only valid if the reference class is fixed independently. This overlooks that the outside view provides empirical evidence of systematic overruns. Even with biased initial estimates, the actual costs are higher, indicating a planning fallacy. The student dismisses the outside view entirely here, which isn't warranted. They also don't address the last part of the question about whether the team's estimate process matters. That's a missed requirement.

  Breaking down the grading: Explanation of inside/outside view is excellent (5/5). The epistemic modesty argument is good but slightly overstated (4/5). Assessing the objection starts strong but falters by misunderstanding the out-turn data (3/10). The conclusion is weak due to the oversight and missing the process question (0/5). That totals 12/25. The student's misunderstanding of out-turn vs. estimates is a critical flaw, leading to an incorrect assessment of the objection. They also omitted the required discussion on whether the team's process similarity matters, which costs points.
answer: |-
  ### Grading Summary  
  **Overall Mark: 12/25**  

  **Breakdown by Question Part:**  
  1. **Explain the inside/outside view (0–5 marks):** 5/5  
  2. **State and assess the argument for epistemic modesty (0–5 marks):** 4/5  
  3. **Assess the colleague’s objection and address sub-questions (0–15 marks):** 3/15  
     - *Sub-parts: Objection assessment (10 marks), "Does outside view still offer anything?" (3 marks), "Dependence on same process?" (2 marks)*  

  ---

  ### Specific Feedback  
  **✓ Correct/Strong Points:**  
  1. **Explanation of inside/outside view (5/5):**  
     - Clear distinction: Inside view = case-specific decomposition (e.g., work packages, engineer consultations).  
     - Outside view = reference-class benchmarking (e.g., comparable projects).  
     - Accurate linkage to Kahneman’s planning fallacy (neglecting risks, systematic optimism).  

  2. **Epistemic modesty argument (4/5):**  
     - Core argument well-stated: Defer to track records over personal judgment.  
     - Valid point that details carry weight only if they shift reference-class membership.  
     - *Minor deduction:* Overstated claim that details "carry no evidential weight" (they inform base-rate adjustments, e.g., regression to the mean).  

  **⚠️ Half-Right/Incomplete Points:**  
  1. **Reference class selection critique (Partial credit):**  
     - Correctly notes that class selection involves subjective judgment (inside-view contamination).  
     - *But misses key nuance:* Outside view *acknowledges* this limitation; solutions exist (e.g., using multiple classes, averaging). Not fatal to the method.  

  **✗ Mistaken/Problematic Claims:**  
  1. **Misinterpretation of the reference-class data (Critical error):**  
     - **Incorrect:** Assumes the median out-turn ($900m) is "other people’s inside views" or "biased estimates."  
     - **Reality:** Out-turns are *actual outcomes* (final costs/durations), not estimates. The $900m is empirical data revealing systematic overruns vs. *sanction estimates* ($350m median). The outside view uses *realized outcomes* to correct for bias.  
     - **Consequence:** Undermines the entire objection assessment. The colleague’s worry (bias inheritance) applies to *sanction estimates*, not out-turns.  

  2. **Dismissal of the outside view’s value (Major oversight):**  
     - **Flawed conclusion:** "Nothing is gained by the adjustment... move back toward the team’s figure."  
     - **Reality:** Even with imperfect reference classes, the outside view exposes *systematic planning fallacy* (e.g., median 157% cost overrun). It offers empirical evidence against inside-view optimism. Discounting it entirely is unwarranted.  
     - **Missed mitigation:** The team could adjust for class-selection bias (e.g., use broader classes, error margins) or test robustness.  

  3. **Ignoring dependence on process similarity (Unaddressed requirement):**  
     - **Omitted:** The question explicitly asks if the answer depends on whether the team’s process matches the class’s sanction estimates.  
     - **Key implication:** If processes differ (e.g., team used better tools), the outside view may overcorrect. If processes are similar, it strengthens the correction. Vital for full credit.  

  4. **Overstated contamination claim:**  
     - **Hyperbole:** "Contaminated from the outset" ignores that outside-view adjustments *reduce* (not eliminate) bias. Empirical data (out-turns) still provides an anchor against inside-view optimism.  

  ---

  ### Recommendations for Improvement  
  - **Critical:** Distinguish between *estimates* (subjective) and *out-turns* (objective) in reference-class data. The $900m is not a "biased estimate" but a realized cost.  
  - **Strengthen nuance:** Acknowledge that reference-class forecasting is a tool to *counteract* (not perfectly erase) bias. Discuss mitigations (e.g., class robustness checks).  
  - **Address all sub-questions:** Explicitly engage with process-dependence (e.g., "If the team’s estimate uses identical methods to the class, the outside view is more reliable").  
  - **Avoid absolutism:** The outside view need not be discarded if imperfect; it offers probabilistic insight ("likely overrun") versus inside-view point estimates.  

  **Why a hasty reader might miss errors:**  
  The answer is articulate and critiques reference-class selection persuasively, masking the fundamental confusion between estimates and out-turns. The dismissal of the outside view feels decisive but rests on a factual error.
