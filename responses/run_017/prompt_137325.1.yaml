  First, I need to address their hypothesis. They think unity is doing three jobs: distinguishing structure from a heap, grounding truth-conditional differences (like sentence order), and explaining why a state of affairs is one thing. The user suspects each camp focuses on one job, thinking they've solved all. I agree. For example, Frege's unsaturated concepts handle the structure vs. heap issue but don't resolve why the unified whole is singular. Russell's relations might handle asymmetry (truth conditions) but lead to regress. Wittgenstein avoids the composition problem by treating propositions as facts, sidestepping the heap issue but not explaining the unity of facts themselves.

