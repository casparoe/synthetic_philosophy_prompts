  ### **Critical Reflections**
  1. **Judgment Calls Dressed as Procedure**:  
     - **Heritage Filter**: Distinguishing "colonial legacy" (heritage) from "institutions" (changeable) requires subjective historical interpretation.  
     - **Mechanism Test**: Judging "cross-context evidence" risks accepting superficial parallels (e.g., "both post-conflict").  
     - **Competing Causes**: Officers may overlook alternatives not explicitly stated in the report.  

  2. **Distinctions Requiring Theoretical Nuance**:  
     - **Mechanism vs. Narrative**: Officers may conflate correlation (e.g., "reform then growth") with mechanism without understanding counterfactuals.  
     - **Overdetermination**: Untrained officers may miss interacting causes (e.g., "copper prices + institutions") and default to HOLD.  

  3. **Systematic Misfires**:  
     - **Misfires**:  
       - **Resource-Cursed Countries**: Will be misread as "institutions" (fundable) when terms-of-trade are the real cause (Stage 4 failure).  
       - **Cultural Explanations**: Consultants may disguise culture as "institutional norms" to pass Stage 1.  
       - **Small Island States**: Geography/heritage easily dismissed if levers (e.g., "trade corridors") are proposed.  
     - **Gaming the Procedure**:  
       - Consultants add token "cross-context" examples (Stage 3) or invent weak kill conditions (Stage 5).  
       - Officers may skip Stage 6 for politically sensitive cases (e.g., Maroya) to avoid HOLD.  

  This procedure forces explicit engagement with causality, levers, and testability while minimizing unfalsifiable narratives. It accepts that 90% of reports may yield HOLD—reflecting the reality that development is overdetermined and context-bound. The output ensures auditability by documenting what evidence was considered and what would falsify claims.
