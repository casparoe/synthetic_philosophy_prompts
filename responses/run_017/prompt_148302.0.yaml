  ### Triage Procedure for Kestrel Fund Country Diagnostics
  Below is a 90-minute triage procedure grounded in causal inference realities for small-N historical cases. It incorporates your constraints: no econometrics, no external data, LEVER TEST, KILL CONDITION, cultural funding prohibition, and emphasis on actionable, testable claims. The procedure is executed sequentially—failure at any stage terminates the review unless otherwise noted.

  #### **Prose Procedure**
  1. **Heritage Filter (10 min)**  
     *Question: "Is the primary cause heritage (geography, colonial legacy, or culture) or changeable within 10 years?"*  
     - **Pass**: Cause is changeable (e.g., institutions, economic policies). Culture automatically fails (charter prohibition).  
     - **Fail**: Cause is heritage. If no alternative cause exists, verdict = HOLD. If an alternative is proposed, restart procedure with it.  
     - *Rationale*: Heritage factors (geography, culture) are immutable in a 10-year window. Culture is excluded per charter.

  2. **LEVER TEST (15 min)**  
     *Question: "Does the claim name a specific instrument Kestrel can deploy within 5 years to move the cause?"*  
     - **Pass**: Instrument is concrete (e.g., "fund district revenue-sharing software"), feasible (within $60M/year scope), and allowed (non-cultural).  
     - **Fail**: Cause is reclassified as heritage. Verdict = HOLD if no alternatives.  
     - *Rationale*: Uncauses Kestrel cannot influence (e.g., "build a new port" for landlocked countries).

  3. **Mechanism vs. Narrative Test (20 min)**  
     *Question: "Is the causal mechanism shown to operate in ≥1 other context, or is it a timeline-fitting narrative?"*  
     - **Pass**: Evidence from another country/region (e.g., "revenue-sharing boosted growth in Country X").  
     - **Fail**: Proceed but flag as "narrative-only." Weakens confidence.  
     - *Rationale*: Distinguishes generalizable mechanisms (e.g., institutions) from idiosyncratic stories (e.g., "the 1994 constitution alone explains growth").

  4. **Overdetermination & Competing Causes (20 min)**  
     *Question: "Does the report address the strongest alternative cause (e.g., commodity prices, terms of trade)?"*  
     - **Pass**: Report refutes alternatives (e.g., "copper prices didn’t explain district-level variations").  
     - **Fail**: Note the uneliminated alternative. Proceed but require KILL CONDITION.  
     - *Rationale*: Growth/stagnation is overdetermined; ignoring alternatives inflates confidence.

  5. **KILL CONDITION (15 min)**  
     *Question: "Does the report name an observable event within 5 years that would falsify the claim, and a detection date?"*  
     - **Pass**: Event is specific, observable, and time-bound (e.g., "service delivery scores in target districts increase by 20% by Q3 2026").  
     - **Fail**: Verdict = HOLD.  
     - *Rationale*: Ensures testability within funding windows; avoids unfalsifiable claims.

  6. **Contextual Feasibility (10 min)**  
     *Question: "Are there contextual barriers (e.g., political constraints) to deploying the lever?"*  
     - **Pass**: No barriers, or workarounds exist (e.g., "fund NGOs instead of government").  
     - **Fail**: Verdict = HOLD.  
     - *Rationale*: A lever blocked by context (e.g., untouchable programs) is not actionable.

  **Final Verdict Assignment**:  
  - **FUND**: Passed all stages, high confidence (Mechanism Test and Competing Causes passed).  
  - **FUND-WITH-KILL-CONDITION**: Passed all stages but low confidence (Mechanism Test or Competing Causes failed).  
  - **HOLD**: Failed any stage with no alternatives.  
  - **REFER**: Disagreement is about values (e.g., "should we fund democracy if institutions are colonial?"), not evidence.  

  ---

  ### **Worked Examples**
  #### **1. Vandara Report**  
  - **Claim**: Growth stalled due to institutions (1994 constitution = natural experiment), not copper prices.  
  - **Procedure**:  
    - Stage 1: Pass (institutions are changeable).  
    - Stage 2: Pass (lever = "fund district revenue-sharing tools").  
    - Stage 3: Fail (no evidence beyond Vandara; narrative-only).  
    - Stage 4: Fail (does not refute copper prices as alternative; notes growth stopped with price fall).  
    - Stage 5: Fail (no KILL CONDITION named).  
  - **Verdict**: HOLD  
  - **Memo Note**: "Insufficient due to unaddressed copper-price alternative and lack of testable kill condition. LEVER exists but evidence is narrative-only."  

  #### **2. Kalunda Report (vs. Sembwe)**  
  - **Claim**: Stalled industrialization due to low-trust culture (2016 survey data).  
  - **Procedure**:  
    - Stage 1: Fail (culture = heritage; charter prohibits funding). No alternative cause.  
  - **Verdict**: HOLD  
  - **Memo Note**: "Cause is cultural/heritage; charter prohibits action. Report provides no actionable alternative."  

  #### **3. Maroya Report**  
  - **Claim**: Stalled growth due to weak institutions (despite terms-of-trade windfall).  
  - **Procedure**:  
    - Stage 1: Pass (institutions are changeable).  
    - Stage 2: Pass (lever = existing $40M integrity program).  
    - Stage 3: Fail (no cross-context evidence; narrative-only).  
    - Stage 4: Fail (does not separate institutions from terms-of-trade windfall).  
    - Stage 5: Fail (no KILL CONDITION named).  
  - **Verdict**: HOLD  
  - **Memo to Director**:  
    > "The diagnostic fails to isolate institutional weakness from terms-of-trade effects and provides no testable kill condition. While the $40M program is politically locked, evidence for its impact is insufficient. We recommend HOLD: maintain funding due to constraints but commission a mid-term review with explicit kill conditions (e.g., 'integrity metrics improve by 15% by 2026')."  

