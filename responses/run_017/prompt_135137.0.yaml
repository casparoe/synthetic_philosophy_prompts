answer: |-
  Here’s the scenario and analysis, strictly adhering to your constraints:

  **The Case**  
  At a family gathering, Maya discovers her brother Liam has been secretly siphoning money from their elderly mother’s savings to fund his luxury car payments. Maya confronts him privately: "You’re stealing from Mom while pretending to care for her—that’s vile. You owe her the truth and repayment immediately." Liam retorts: "And you? You lied to the IRS last year to dodge $20k in taxes! You’re no saint." Maya doesn’t deny it: "What I did was wrong, and I’m a fraud for it. But this is Mom—we can’t exploit her trust. You’re hurting her directly." Maya’s tax fraud (unexposed, unpunished) involved deliberate deception for financial gain, mirroring Liam’s misconduct in kind and severity. She isn’t self-deceived; she acknowledges her guilt internally. Liam knows her history. Maya isn’t the victim (Mom is), holds no office, and has no special authority over Liam beyond being his sister. Her blame is motivated by outrage for her mother, not deflection.

  **Walkthrough**  
  1. **Liam’s Desert and Aptness of Blame**:  
     Liam’s deception exploits a vulnerable family member for personal gain—objectively wrong, with no excuse (e.g., duress). Maya’s blame is apt: she accurately identifies his betrayal, her anger reflects the gravity of the wrong, and addressing him directly gives him opportunity to respond. The value at stake (familial trust) is rightly invoked.  

  2. **Verdicts on Standing**:  
     - **Forfeiture View**: *No standing*. Maya’s equivalent, unrepented wrongdoing (tax fraud = deception for gain) nullifies her moral position. Liam’s tu quoque is valid; she cannot demand Liam uphold a standard she flouts. Her blame is hypocritical and thus illegitimate.  
     - **Second-Personal/Relationship View**: *Standing via proxy*. As Mom’s primary caregiver (a role Maya holds), Maya has "borrowed standing" to voice the victim’s moral claim. Mom’s vulnerability (e.g., dementia) renders her unable to blame Liam herself, delegating that role to Maya. Liam’s wrongdoing damages a shared relational fabric Maya is part of, giving her a stake.  
     - **Character-First View**: *Standing intact*. Hypocrisy taints Maya’s character but not the act of blaming. Her blame succeeds if she *sincerely affirms* the standard (here, she does: "What I did was wrong"). The focus is on Liam’s desert, not Maya’s purity. Her admission ("I’m a fraud") signals sincerity, not self-exemption.  

  3. **The Critical Feature and Its Removal**:  
     - **Key Feature**: *Maya’s role as voice for an incapacitated victim*. Mom cannot confront Liam, creating a moral vacuum Maya fills. This distinguishes her from a "pure" hypocrite: her standing derives from agency exercised *on behalf of* another, not personal authority.  
     - **Collapse Test**: Remove Mom’s incapacity. Suppose Mom is cognitively sharp but avoids conflict. If Maya blames Liam identically, her hypocrisy dominates. Liam’s "and you too" now fully deflects, as Mom could speak for herself. The blame feels like sanctimonious overreach, not protection.  
     - **Forfeiture Attack**:  
       1. **Laundering Objection**: If borrowed standing excuses hypocrisy, any wrongdoer could "launder" blame by channeling a victim’s claims (e.g., a cheating spouse blaming a friend’s infidelity "on behalf" of the friend’s partner). This renders the forfeiture condition meaningless.  
       2. **Moral Contamination**: Even proxy standing requires *moral credibility*. Maya’s ongoing fraud corrodes her legitimacy as Mom’s voice—why trust a liar to convey another’s moral claim?  

  **The Work Done by Sincerity (Without Self-Exemption)**  
  This case isolates **insincerity** as the dropped defect. Maya *genuinely endorses* the norm against deception ("What I did was wrong"), so her blame isn’t performative. Self-exemption *is* present (she blames Liam while unrepentant) and hypocrisy *is* present (same wrongdoing). But insincerity’s absence allows her to invoke the standard authentically *on behalf of the victim*, leveraging relational duty over personal purity. The forfeiture theorist counters that sincerity is irrelevant; the hypocrite’s act of blaming *itself* violates reciprocity. Yet in this constrained, victim-focused context, the moral urgency of protecting the vulnerable partially overcomes that defect—suggesting standing may be **domain-scoped** (here, to familial caregiving) rather than absolute.  

  **Why This Doesn’t Trivialize Forfeiture**  
  Borrowed standing only works here because:  
  - The victim is *incapacitated*, creating a necessity for proxy blame.  
  - The hypocrite *acknowledges their own failing*, preventing smugness.  
  - The wrongdoing *directly harms the relationship* the proxy inhabits.  
  Remove any element (e.g., Mom can speak for herself, Maya denies her guilt, or Liam’s act targets a stranger), and hypocrisy regains its defeasing force. The laundering objection is thus contained to narrow, necessity-driven contexts.
