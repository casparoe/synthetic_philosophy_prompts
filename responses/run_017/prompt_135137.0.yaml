  Hmm, they've set incredibly strict parameters: no official roles, no self-deception, same generic wrongdoing, unacknowledged past misdeeds, and the hypocrite mustn't be the victim. The key is to isolate hypocrisy from self-exemption or insincerity. 

  I recall their scaffolding about three defects: hypocrisy proper, self-exemption, and insincerity. The solution might lie in removing self-exemption while keeping hypocrisy - meaning the blamer genuinely endorses the standard but fails to meet it herself. 

  The family context seems promising. Imagine two siblings: Maya (the hypocrite) who cheated on her taxes, and Liam who cheated on his spouse. Both involve deception for personal gain. Maya discovers Liam's affair and confronts him harshly. Crucially, she fully owns the tax standard while failing at it - "I'm a fraud but marriage vows matter" shows she's not exempting herself. 

  Liam deserves blame, Maya's anger is fitting, and as the victim's sister-in-law (Eva), she has borrowed standing. But when I remove the family link - say if Maya were just Eva's friend - the case collapses into pure hypocrisy. The forfeiture theorist would pounce here: Maya's moral taint contaminates any borrowed standing. 

  The laundering objection feels thorny. If borrowed standing works for hypocrites, does that nullify forfeiture entirely? Maybe not - perhaps familial bonds create a unique moral channel that bypasses hypocrisy, but only when values are sincerely held. Still, I worry this might stretch "ordinary scenario" with the sister-in-law dynamic. 

  Alternative approach? Workplace could work: say hypocrite Alex (who stole designs) calls out Ben for stealing credit. But Alex's insincerity would undermine it - unless we show Alex genuinely values attribution. Hard to do without role-playing HR. Family feels cleaner. 

  Final check: does this violate "no special relationship to target"? Liam is just Maya's brother, so no. Victim-adjacency via Eva is permitted. And crucially, Maya's "I'm a fraud" admission stops self-exemption. 

  Walkthrough must emphasize: 1) Liam's desert 2) Maya's accurate blame 3) Forfeiture says "no standing" 4) Second-personal view allows proxy-standing 5) Character view focuses on her sincerity. Then break it by removing Eva's perspective - watch it crumble. 

  Biggest risk: students might argue Maya's tax fraud isn't "same generic kind" as infidelity. But both are "deception for personal gain" per user's allowance. Should make that explicit. 

