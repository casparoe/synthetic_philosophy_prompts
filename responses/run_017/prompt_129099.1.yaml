  Hey — I'm putting together a ~2 minute stand-up set for this slightly cursed "Philosophy Has Jokes" night we're throwing after the grad conference dinner, and I want one bit on Parfit's hitchhiker. You know the one: hitchhiker stranded in the desert, promises the driver a big chunk of money if he'll drive him to the city; once they're actually in the city the reason to pay has evaporated, so the driver will only take him if he's confident he'll get paid, and what the hitchhiker really needs is to be the sort of person who'll hand over the cash for a reason that will no longer be a reason by then. I've been futzing around with a finitely repeated variant of it in a paper draft — same driver, same hitchhiker, weekly commute, driver is moving away after N more trips, so the last trip unravels and then backward induction chews its way back through the earlier ones — and I'm def happy for the joke to be set in that version instead of the one-shot case if it gives you more to work with.

  The thing I care about is that the punchline turns on the actual machinery of the case: the timing of the reasons, the fact that what the driver is betting on is a disposition (or a prediction about one) rather than a reason that will still be standing at the end of the ride, the whole rational-irrationality move where it can be rational to arrange to later do something you'll then have no reason to do. Not just "look how silly people who think about decision theory are". Concretely: no Hitchhiker's Guide to the Galaxy riff (everyone does that one and its not even about the right thing), no puns on utility or expected value, and please don't drift into the toxin-puzzle setup where you get a reward just for forming an intention you'll have no reason to act on — that's a separate bit I'm saving for later in the set.

  Ideally it works on two levels: the room of slightly drunk philosophers and partners-of-philosophers who've never read a word of this should still laugh, and the people who have should groan extra at why it lands. Keep it short — a setup and a punchline you can say out loud in under thirty seconds, no paragraphs of framing. Give me the joke itself, and then maybe a single line afterwards on what the mechanism is supposed to be, so I can tell if its actually doing the thing or just dressed up as it. No citations or quoting Parfit, I just need the bit.
