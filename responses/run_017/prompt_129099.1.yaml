  Here's the tight, mechanics-focused bit:

  **Setup:**  
  "Got this weekly desert commute. Driver saves me, I promise him cash *in* the city. Every Friday. But now he’s retiring after 4 more trips. So last trip? Once we’re *in* the city... why would I pay him? Exactly. Zero reason. So he won’t drive Trip 4. But if he won’t drive Trip 4... why would I pay him at the end of Trip 3?"

  **Punchline:**  
  "...turns out, for this whole arrangement to work, what my driver *actually* needs is for me to be the kind of predictable sucker who just pays him on principle, even when it’s spectacularly against my own interests."

  *(Beat)*

  **Mechanism Tag (Optional, for your clarity):**  
  "Backward induction forces the driver to bet on my disposition, not my future reasons."

  **Why it works:**  
  *   **Audience 1 (Drunk Non-Philosophers):** Laughs at the absurdity of needing to be a "sucker" and the relatable "weekly commute" setup turning sour. "Pays on principle... against my own interests" is the clear, funny takeaway.
  *   **Audience 2 (Philosophy Grads):** Groans at the accurate, painful description of backward induction unraveling the repeated game ("Trip 4? Zero reason... won't drive Trip 4... why pay Trip 3?"), and the core punchline perfectly captures the **disposition/prediction** element ("kind of predictable sucker") and **rational irrationality** ("pays... even when spectacularly against my own interests") that solves the one-shot case and makes the repeated case collapse. "On principle" nods to the non-present reason.
  *   **Mechanics Check:** It explicitly avoids future reasons ("why would I pay?"), centers the driver's reliance on predicting a *type* of person ("kind of predictable sucker"), and highlights the rational need for a disposition leading to irrational action ("against my own interests"). No toxins, no utility puns, no HHGTTG.
  *   **Timing:** Delivered briskly, this should land well under 30 seconds.

  **Deliver it fast, land hard on "predictable sucker" and "against my own interests".** Good luck with the set!
