answer: |-
  ### Q&A Prep Sheet: Pascal's Mugging as Logical Uncertainty

  ---

  #### **1. Room Map (120 words)**  
  This audience views Pascal’s Mugging as a "solved" puzzle via bounded utility or probability discounting. They’ll grant Step 1 (complexity penalties) silently—it aligns with Occam’s razor. Step 2 (conjecture mugger) will trigger skepticism: epistemologists will deny its realism ("No mugger *actually* does this!"), while economists will question if it differs from ambiguity aversion. Step 3 (logical uncertainty) faces hostility: Bayesians see logical omniscience as a tractable idealization, not a flaw. The ML person may nod at computational limits but reject market prices as credences. Overall, they’ll treat the *original* mugging as a parlor trick but fight your reframing—logical uncertainty seems like an unnecessary complication to a settled debate.

  ---

  #### **2. Objections, Most to Least Damaging (800 words)**  
  **1. "This isn’t uncertainty—it’s ignorance. Bayes handles ignorance with priors. Why invent new tools?"**  
  *(Raised by: Lead epistemologist, framing it as a dismissive challenge)*  
  **Reply:** "Logical uncertainty isn’t just ignorance; it’s *undecidability on a deadline*. Priors require a sample space of possible worlds, but math truths don’t live in such a space. A prior over 'conjecture true vs. false' is arbitrary—unlike empirical priors, it can’t be informed by frequency or symmetry. Bayesian updating can’t resolve this because you lack observable evidence. Logical induction (LI) isn’t 'inventing tools'—it’s *describing* how we actually reason under bounded computation."  
  **Soft Spot:** LI’s lack of convergence guarantees feels non-normative to Bayesians.  

  **2. "Your 'conjecture mugger' is incoherent. If I inspect the code, I see it halts iff the conjecture is true. That’s a *fact*, not uncertainty!"**  
  *(Raised by: ML person, leaning on computational realism)*  
  **Reply:** "Inspection confirms the code’s *semantics*, not its *outcome*. Deciding if it halts requires solving the conjecture itself—which is NP-hard or worse. You’re conflating understanding the program with deciding its behavior. In practice, we use heuristics (e.g., 'most searches fail'), but those aren’t probabilities. LI makes this explicit: your 'credence' is a best guess from limited computation, not a measure of possibility."  
  **Soft Spot:** Audiences may insist inspection implies eventual knowledge, ignoring time constraints.  

  **3. "Even if logical uncertainty exists, why not use a flat prior? Paying the mugger still has negligible EV."**  
  *(Raised by: Decision theorist, appealing to conservatism)*  
  **Reply:** "Flat priors *are* arbitrary—why 50% true vs. 10⁻¹⁰⁰%? The mugger exploits this arbitrariness. Logical induction avoids this: prices reflect peer consensus and past accuracy, not symmetry. In LI, short proofs raise prices faster, so a 20-line program threatening 3↑↑↑3 suffering might still get low weight, but *for reasons tied to practical proof discovery*, not ad hoc discounts."  
  **Soft Spot:** LI’s prices can behave erratically—hard to defend as "rational."  

  **4. "Bounded utility solves this cleanly. No need for logical uncertainty."**  
  *(Raised by: Anti-fanaticism economist, confidently)*  
  **Reply:** "Bounded utility dodges the *original* mugging but not the conjecture variant. Here, the disutility isn’t huge—it’s *conditional on a logical fact*. If the conjecture is provable, the disutility is finite (say, 10¹⁰⁰). Bounding utility caps *that* number, but your *expectation* still depends on the *likelihood* the proof exists. Logical uncertainty determines that likelihood. Bounding utility doesn’t address the core problem: assigning weight to an undecided logical claim."  
  **Soft Spot:** If the audience insists all uncertainties are probabilistic, this fails.  

  **5. "Logical induction *is* Bayesian—it’s just priors over proof lengths."**  
  *(Raised by: Bayesian epistemologist, reclaiming territory)*  
  **Reply:** "LI uses Bayesian-style updates but lacks a *coherent prior*. Prices are defined via trading algorithms, not measure theory. Crucially, LI can assign P(φ) + P(¬φ) > 1 if the market hasn’t found a proof yet. This isn’t subadditivity—it’s *computational incompleteness*. Traditional Bayes requires logical omniscience to avoid Dutch books; LI embraces non-omniscience and still avoids Dutch books *in the limit*. It’s a *tool for decision-making*, not belief representation."  
  **Soft Spot:** LI’s pre-convergence non-probabilism seems irrational to purists.  

  **6. "This is just ambiguity aversion. We have tools for that (e.g., maxmin EU)."**  
  *(Raised by: Ambiguity economist, offering an escape)*  
  **Reply:** "Ambiguity applies to *unknown probabilities* (e.g., a coin’s bias). But with logical uncertainty, there’s no 'true probability'—the conjecture is true or false, period. Maxmin EU might say 'ignore the mugger,' but that’s a hack. In LI, prices can be precise (e.g., P(conjecture) = 0.2 based on partial progress), letting you compute nuanced decisions. Rejecting *all* logical uncertainty forces underreaction to plausible threats (e.g., AI alignment failures)."  
  **Soft Spot:** Audiences may view logical claims as having "metaphysical probabilities."  

  **7. "Your argument assumes we *must* assign numbers. Why not suspend judgment?"**  
  *(Raised by: Cautious epistemologist, pushing back on quantification)*  
  **Reply:** "Suspension isn’t free—refusing to pay the mugger *is* a decision with consequences. Logical induction quantifies the unquantifiable *because we have to act*. LI prices aren’t 'true credences' but *best-available guides* for timely choices. We already do this heuristically (e.g., 'P≠NP is 80% likely'); LI just makes it rigorous."  
  **Soft Spot:** Purists will argue suspension *is* viable (e.g., "Just walk away!").  

  **8. "Real agents approximate logical omniscience. Why not treat this as high computational cost?"**  
  *(Raised by: Pragmatic ML person, defending Bayes)*  
  **Reply:** "Approximation works for *tractable* problems (e.g., chess), not undecidable ones. The conjecture’s truth isn’t a 'costly computation'—it may be *unknowable* before acting. Treating it as 'high cost' implies you’ll eventually know, but decisions can’t wait. LI explicitly models *unresolved* claims, while Bayes sweeps them under 'priors' that magically become sharp with time."  
  **Soft Spot:** If the conjecture is decidable quickly (e.g., small proofs), this weakens.

  ---

  #### **3. Concede Up Front (120 words)**  
  Open with: "I grant that bounded utility *solves the original Pascal’s Mugging*—this talk isn’t about that. I also agree logical omniscience is a useful idealization for *many* problems. But the conjecture mugger exposes a gap: when decisions hinge on *timelimited logical uncertainty*, Bayesianism lacks tools. Logical induction isn’t a replacement for credences in empirical cases—it’s a scaffold for decisions when proof search is incomplete. If you think all uncertainties reduce to probability, I’ll try to change your mind, but my core point is: for *this specific class of decisions*, we need new theory."

  ---

  #### **4. The Reply That Has to Land (120 words)**  
  When defending Step 3, hammer this: **"In empirical uncertainty, you can *imagine* a probability space (e.g., 'possible coin biases'). But for a logical claim, there is no 'space of possible truths'—just one fact, unknown due to computational limits. Bayes requires a prior *defined over outcomes*, but here outcomes aren’t 'possible worlds'—they’re *proofs*, and we haven’t found them yet. A Bayesian prior here is either arbitrary (e.g., 50%) or undefined. Logical induction *starts* from this reality: your 'credence' is a tool for action based on current knowledge, not a probability measure. Ignoring this forces ad hoc fixes that fail in decision-critical cases."**  
  *If this doesn’t land, the talk fails.*

  ---

  #### **5. The Question I’m Hoping Nobody Asks (150 words)**  
  **Question:** "Isn’t this just radical probabilism? All uncertainties—empirical or logical—are quantified with probabilities. Why treat math differently?"  
  *(Raised by: A Bayesian hardliner, equating all uncertainty to collapse your argument)*  
  **Reply:** "Radical probabilism assumes *all* uncertainty can be modeled with *additive* probabilities over a sample space. But logical uncertainty violates additivity: before a proof is found, P(φ) + P(¬φ) can exceed 1 without irrationality—it reflects *ignorance of dependencies*. In LI, if φ and ¬φ share a deep logical link the market hasn’t seen, prices don’t sum to 1. This isn’t subadditivity; it’s *computational incompleteness*. Forcing additivity demands arbitrary precision about the unknowable. Math is different because its truths are necessary; your uncertainty isn’t about *states* but *discovery*. Probability works for contingent facts; logical uncertainty is about *knowledge progress*."  
  *If this fails, pivot to concession: "Even if you insist it’s probabilistic, standard Bayesianism lacks the tools to model it."*
