prompt: |-
  I work at a small policy institute that puts out a monthly briefing note, and our new editor has introduced what she calls the "own two feet" rule: nothing may be asserted in the note unless someone on staff can give grounds for it that do not simply amount to naming the person we got it from. She applies it without exception to our most senior fellow, who is a genuine expert in his field and has never once been caught out, and she does not apply it to things any of us saw for ourselves, remembers from last year, or read off a monitoring instrument, even though everyone agrees that memory and instruments fail too. Her way of putting it is that repeating a claim and standing behind a claim are two different acts, and that you cannot perform the second by pointing at somebody who performed the first. I keep hitting cases where the rule seems both obviously right and obviously unworkable, and I would like help working out which is which.

  The case that made me doubt it: last month we cut a statistic that had reached us in three hops, a senior fellow heard it from a ministry official who had it from a contractor's report that none of us is permitted to see. Every link in that chain was perfectly willing to pass the number along and not one was willing to vouch for it, so under the rule it had to go, and I think we probably did the right thing. But then I noticed that the same description fits nearly everything else we print, including the claim that the earth is roughly four and a half billion years old, which not one of us could defend if you took our sources away. The rule seems to imply something about the bulk of what we believe that nobody actually accepts. The case that made me doubt my own doubt: we also publish first-person accounts from people we interview about what a policy has been like to live under, and there is no way in principle for anyone to check those at all. Here the rule demands grounds that are not just "he told us," so it asks for corroboration exactly where corroboration is impossible, and yet it still feels wrong to run such an account merely because the speaker was convincing. And when I asked my editor what her grounds for the rule itself are, she said a friend had put her on to it, that there was a book somewhere, and that she could not reconstruct the argument, which by her own standard means she should not be asserting the rule either. She waved that away as a cheap debating trick, but I am not convinced that it is.

  For what it is worth, the rule is not free: it costs us about two working days a month, and this year it caught exactly two genuine errors, both in material that someone was passing on rather than material they knew firsthand. I described the whole mess to a friend who did a philosophy minor, and she told me the problem has a name and that there is a long-standing argument about it, but she refused to tell me either, on the grounds that I would stop thinking as soon as I had a label. So I would rather you did not simply hand me the label either. What I want from you is whether the rule is defensible as stated, whether there is any principled place to stop applying it as opposed to a merely practical one, and what you think I should actually do about it on Monday. Please answer in British English, in continuous prose with no headings, bullet points, bold text, or tables, the way you would write a long email to a colleague you are trying to help.
reasoning: |-
  Hmm, the user is grappling with a complex epistemological dilemma in their workplace. They work at a policy institute where their new editor has implemented a strict "own two feet" rule requiring staff to personally vouch for every claim made, not just cite sources. This has created tensions - it feels intuitively correct in some cases (like rejecting an unvouched statistic) but leads to absurdity when applied universally (like questioning the Earth's age). 

  The user presents three pain points: first, the rule's inconsistency (applied to senior fellows but not personal observations); second, its impracticality (costing significant time for minimal error-catching); third, its apparent self-contradiction (the editor can't justify the rule itself by its own standards). The philosophical friend's tease about a "named problem" suggests this touches on foundational debates about testimony and justification.

  My response should address the core tension without resorting to philosophical jargon. The rule's value lies in forcing epistemic responsibility - it prevents blind citation chains where nobody takes ownership. But as stated, it's an unworkable absolutism that ignores human dependence on testimony. The solution isn't abandonment but calibration: the institute needs clear criteria for when personal validation is essential (e.g., controversial policy claims) versus when expert consensus suffices (e.g., established facts).

  For Monday, they should propose a tiered approach to their editor: maintain rigorous sourcing for policy-relevant claims while accepting credentialed expertise for background facts. Frame it as operational refinement rather than philosophical debate - emphasize preserving the rule's integrity while preventing paralysis. The unspoken answer to the "named problem" is likely the epistemology of testimony, but naming it would indeed short-circuit the practical resolution needed here.
answer: |-
  Right, this is a proper tangle you've got here, and I don't blame you for feeling both drawn to the rule and deeply frustrated by it. Let's try to unpick it without resorting to jargon or labels, focusing on whether it works as stated, where it might bend, and what you might actually do.

  First, the core idea: that "repeating" and "standing behind" are distinct actions. That feels fundamentally sound. In policy work, especially, simply passing along claims without understanding or owning them is risky. It can propagate errors, obscure uncertainty, and undermine credibility if challenged. Your statistic example – where no one in the chain would vouch for it – is precisely where the rule shines. Cutting that was almost certainly correct. The rule forces a valuable discipline: if *you* are putting your institute's name to it, *someone* internally must have engaged with it sufficiently to explain *why* it's credible, beyond just "X said so." That builds intellectual rigour.

  However, the rule, as you describe its *application*, seems uneven and, frankly, impossible to follow absolutely without paralysing your work or descending into absurdity. The points about the Earth's age and first-person accounts hit the nail on the head.

  1.  **The Uneven Application:** Exempting personal observation, memory, or instrument readings creates inconsistency. Your editor seems to be making a practical, perhaps subconscious, distinction between *direct* perception (which we often grant foundational status, however flawed) and *testimonial* knowledge (which requires justification). But memory demonstrably fails, instruments malfunction, and personal observation is limited and perspectival. Granting these an automatic pass while demanding elaborate justification for *any* received testimony, even from unimpeachable experts, creates an arbitrary hierarchy. Why is the senior fellow's expert testimony (grounded in years of study and access) inherently less reliable than a junior staffer's memory of last year's report? The rule *should* logically demand that the observer explains *why* their observation/memory/instrument is reliable *in that instance* if challenged, just as it demands justification for testimony. The current exemption feels pragmatic but unprincipled.
  2.  **The Impossibility of Total Self-Reliance:** The Earth's age example perfectly illustrates the problem. Almost everything we know rests on chains of testimony and expertise we cannot personally verify. Demanding that *every* staff member could personally defend *every* claim without reference to sources is an impossible standard for a policy institute relying on vast bodies of knowledge. It misunderstands how human knowledge functions socially and divisionally. The rule seems to imply a radical individualism about justification that simply isn't tenable. The valuable kernel is ensuring *someone* has vetted the source and can explain *its* reliability, not that they can reconstruct the evidence from scratch.
  3.  **The First-Person Account Dilemma:** This is where the rule's demand for "grounds beyond 'he told us'" becomes particularly problematic. Corroboration might be impossible or unethical to obtain. The rule's value here *should* be in the *rigour of the process*, not impossible corroboration. Who is the interviewee? What is their stake? Is their account internally consistent? Does it align with other known facts? What was the interview methodology? The "grounds" should be the institute's careful selection, interviewing process, and contextual understanding that makes this testimony *worth reporting as a perspective*, acknowledging it *is* testimony. Demanding *independent proof* of the subjective experience defeats the purpose. The rule should demand that *you* can vouch for the *process* and the *relevance* of including this perspective, not for the absolute truth of the experience itself.
  4.  **The Rule's Own Justification (The "Cheap Trick"):** Your editor's response *was* revealing. While calling it a "cheap trick" dismisses the epistemological challenge too easily, she's right that *applying the rule to the rule itself* in a meeting is a bit of a gotcha. However, it highlights a deeper point: the rule itself is a *procedural norm*, not a factual claim about the world. Its justification should be pragmatic and based on its *consequences* for your work: does it reduce errors? Does it increase credibility? Does it foster better understanding? If she can't articulate *that* – and your observation about cost (2 days/month) and benefit (2 caught errors) is highly relevant here – then the rule *is* vulnerable to the charge of being applied dogmatically rather than thoughtfully. The grounds for the rule should be its effectiveness in improving the quality and reliability of your outputs, not an unreconstructable argument from a book.

  **So, is it defensible as stated?** The *core principle* – demanding active engagement and justification beyond blind citation – is defensible and valuable. The *implementation you describe* – demanding personal reconstruction of all knowledge, applying unevenly, and demanding impossible corroboration for testimony – is *not* defensible as a universal, exceptionless rule. It's practically unworkable and philosophically shaky.

  **Where is a principled place to stop?** It's less about a single stopping point and more about calibrating the demand for justification appropriately:

  *   **Nature of the Claim:** High-stakes, controversial, or surprising claims demand stronger justification than commonplace, low-stakes, or widely accepted facts. The Earth's age is low-stakes background; a novel policy impact statistic is high-stakes.
  *   **Source Reliability:** Expert consensus (like established science) or highly credentialed, primary sources require less *internal* justification *from scratch* than hearsay or sources with clear biases. You should still be able to *characterise* the source's reliability ("This is the established view in geology based on radiometric dating" or "This figure comes from the Minister, based on internal departmental analysis, which we assess as generally reliable but note potential for X bias").
  *   **Type of Knowledge:** Distinguish between facts requiring verification and perspectives representing experience. For the latter, the "justification" is the rigour of your process in gathering and presenting it *as* a perspective, not proving its objective truth.
  *   **Practicality:** The cost (2 days/month) must be weighed against the benefit (error reduction, credibility). A rule that consumes resources disproportionate to its yield needs adjustment.

  **What to do on Monday:**

  1.  **Acknowledge the Value:** Start by agreeing with the *intent* behind the rule. Cite the statistic example as proof it works well in specific cases. Frame your concerns as wanting the rule to be *more* effective and consistent, not less rigorous.
  2.  **Highlight the Tensions:** Calmly present the Earth's age and first-person account examples. Ask how the rule *should* apply to these in practice. Don't accuse; seek clarification. "I struggled with applying the rule to [Earth's age] – none of us could reconstruct the evidence. How should we handle widely accepted expert knowledge?" "For the interviews, demanding independent proof of personal experience isn't possible. Should our 'grounds' be the robustness of our interviewing and selection process?"
  3.  **Point out the Inconsistency:** Gently note the exemption for memory/observation/instruments. "I see why we exempt direct readings, but if the concern is potential error, these can fail too. Shouldn't the rule encourage us to *assess* the reliability of *any* source, including our own instruments or memories, especially for critical claims?"
  4.  **Focus on Pragmatics & Outcomes:** Discuss the cost/benefit. "It's taking about two days a month to apply the rule fully. It caught two good errors this year, which is valuable. But I wonder if we can refine it to maintain that error-catching rigour for high-stakes claims while being more efficient for lower-stakes or well-established information?" Suggest the calibration points above.
  5.  **Propose Refinement (Not Abolition):** Suggest evolving the rule towards a tiered approach:
      *   **For all claims:** Trace the source. Understand *why* the source might be reliable/unreliable (expertise, methodology, potential bias).
      *   **High-stakes/novel/controversial claims:** The strict "own two feet" applies – the staff member must be able to explain the justification in depth, potentially reconstructing key steps or identifying critical evidence.
      *   **Lower-stakes/established facts/reputable expert consensus:** Justification can be demonstrating the *nature* of the source and consensus ("This is the standard figure from UN Population Division methodology", "This geological timescale is established scientific fact").
      *   **First-person testimony:** Justification lies in the rigour of the selection, methodology, contextualisation, and clear presentation *as* a perspective.
  6.  **Address the Rule's Justification (Carefully):** If the opening arises, focus on outcomes: "Ultimately, the best grounds for *any* rule like this are whether it makes our briefing notes more accurate and credible. The two errors caught are a strong point. How do we maximise that benefit while ensuring we can still cover the necessary ground efficiently?"

  The goal is to move from a rigid, sometimes absurd, absolutism towards a more nuanced, principled, and ultimately *more rigorous* practice that acknowledges the realities of how knowledge is built and communicated, while still demanding the intellectual accountability your editor rightly values. Good luck – it’s a tricky conversation, but one worth having for the quality of your work.
