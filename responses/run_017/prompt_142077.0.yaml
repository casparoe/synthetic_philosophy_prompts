prompt: |-
  I'm in a theory of computation course this term (second-year CS) and the way we handle the Church–Turing thesis keeps bugging me. Me and my roommate, who's a physics major, went back and forth about it for like two hours after a guest lecture on analog computing and got nowhere, so I figured I'd ask people who think about this stuff properly.

  Here's what I keep noticing about how the subject is actually done, as opposed to how it's introduced. First: the course defines "computable" by picking Turing machines, then shows that a handful of other setups — lambda calculus, register machines, whatever — pick out exactly the same class, and presents that convergence as *evidence* for the thesis, while also saying flat out that the thesis can't be proved, because the informal side ("whatever a human or a machine can do by following a rule") isn't a mathematical object you can prove things about. Second: every time someone floats a machine that would outrun a Turing machine, the reaction is set-aside rather than refutation. The two examples we kept circling: a gadget that does its first step in a second, its second in half a second, its third in a quarter, so it gets through infinitely many steps in under a minute; and a device that measures some continuous physical quantity to infinite precision and reads the answer off an infinite decimal expansion. Both get waved off as "not a physically realisable process" — but my roommate's point is that physics idealises like that all the time (point masses, frictionless planes, infinitely extended fields, real-valued quantities generally), so the move can't just be "it's unphysical, therefore no". Third: our complexity unit helped itself to "efficient = polynomial time on a Turing machine" plus the assumption that any sane physical computing device is at worst polynomially slower, and the crypto notes then lean on exactly that when they say some protocol is safe because breaking it would take too long. But it's also treated as common knowledge that quantum algorithms really do put pressure on that efficiency claim, and that it could have turned out false — whereas the basic thesis gets treated as not the kind of thing that could turn out false at all.

  So what does that whole bundle of practices presuppose about what sort of claim the Church–Turing thesis is? Is the implicit view that it's an empirical claim about the physical world — in which case why is all the evidence for it mathematical, i.e. the agreement of several formalisms, which are all just mathematics and so tell you nothing about matter? Or that it's a definition, or an analysis of what we mean by "following a rule" or "effective procedure" — in which case why does anyone bother marshalling the convergence argument, and what would a hypercomputer even be a counterexample *to*? Or something in between? My roommate's guess, which I have no way to evaluate, is that it works like the definition of a physical quantity — temperature, energy, that sort of thing — where the meaning gets fixed by the role the term plays in a whole network of claims, so it's neither provable nor straightforwardly falsifiable, but also not arbitrary, and can come apart from any one of the claims that pin it down. Is that what the practice is quietly committed to, or is it too strong a story, or does the practice really only need something much weaker and just happen to sit comfortably with several different stories at once? I'd also like to know where exactly the practice is genuinely underdetermined rather than committed. And whatever you think it presupposes: what would concretely have to change in how computer science is done — how uncomputability results get stated, how hypercomputer proposals are received, how "efficient" gets defined, whether cryptographers should be more nervous — if we swapped that story for one of the rivals? Oh, and is the asymmetry I mentioned actually defensible, the base thesis being treated as untouchable while the efficiency version is treated as an open empirical question, or is that just historical accident?
reasoning: |-
  Okay, let me start by unpacking this student's question. They're grappling with the Church-Turing thesis in their theory of computation course, and there's a clear tension between how it's presented and how it's actually used. The student points out three main issues: the convergence of formalisms as evidence despite the thesis being unprovable, the dismissal of hypercomputers as unphysical without thorough refutation, and the asymmetry between the base thesis and efficiency claims in complexity theory. 

  First, I need to address the nature of the Church-Turing thesis itself. The student is questioning whether it's an empirical claim, a definition, or something else. The roommate's analogy to physical quantities like temperature is interesting—suggesting it's a concept defined by its role in a theoretical network. That resonates with how computer science treats the thesis: it's a bridge between formal systems and real-world computation. 

  Looking at the convergence argument, the student wonders why mathematicians bother showing equivalence between Turing machines, lambda calculus, etc., if the thesis can't be proven. The key here is that while the thesis itself isn't provable, the equivalence of formalisms strengthens the claim that we've captured *something* fundamental. It's not proof, but it's compelling evidence that these models all point to the same class of computable functions. 

  Then there's the hypercomputer issue. The student is right that physics often uses idealizations, so dismissing analog computers or infinite-time processes as "unphysical" feels inconsistent. But the deeper point is that computability theory is about *procedures*—finite, discrete steps. Hypercomputers violate the finiteness requirement inherent in the notion of an algorithm. So the dismissal isn't just about physics; it's about what counts as a mechanical procedure. 

  For complexity, the student notes the asymmetry: the base thesis is untouchable, but "efficient = polynomial time" is treated as contingent. That makes sense because complexity depends on physical implementation, while computability is more abstract. Quantum computing challenges the efficiency claim precisely because it leverages physical phenomena that classical models don't capture. 

  The student asks what would change if we swapped the underlying story. If we treated the Church-Turing thesis as purely empirical, uncomputability results would become conditional—e.g., "no physically realizable computer can solve the halting problem." Cryptographers would need to worry about new physics enabling hypercomputation. But since we treat it as a definitional anchor, those results are stated absolutely. 

  Finally, the asymmetry between computability and efficiency is defensible. Computability is about what's possible in principle, while efficiency is about feasibility. The former is more stable because it's tied to logical limits; the latter is hostage to physical discoveries. 

  In summary, the practice presupposes that the thesis is a robustly defined concept, stabilized by mathematical equivalence and aligned with physical practice. Changing this would unsettle foundations, but the current approach balances mathematical rigor with empirical flexibility where needed.
answer: |-
  Your frustration is spot-on—the Church–Turing thesis (CTT) occupies a unique, philosophically fraught space in CS. The practices you describe reflect a pragmatic stance grounded in **robust mathematical convergence and physical realizability constraints**, treating CTT as a **conceptual anchor** rather than a proposition open to empirical falsification. Here's how this works and what it presupposes:

  ### 1. **The Role of Convergence Evidence**  
     - **Why it's presented as evidence**: Demonstrating that Turing machines, lambda calculus, register machines, etc., all compute the *same class of functions* shows that CTT captures a **stable, invariant concept** across wildly different mathematical formalisms. This isn't proof of CTT (which concerns informal notions like "human computation"), but it suggests that these formalisms are isolating a coherent, mathematically natural phenomenon.  
     - **What it presupposes**: That the equivalence of formal models *corroborates* the thesis by showing that our intuitive notion of "computation" has a precise, model-independent core. If radically different systems all converged on different classes, CTT would be questionable. They don't—so it gains plausibility.

  ### 2. **Dismissing Hypercomputation: Not Just "Unphysical"**  
     - **Physical realizability isn't the whole story**: Yes, physics uses idealizations—but CTD isn't primarily about physics. It's about **what counts as an *algorithmic procedure***. The objections to hypercomputers (e.g., infinitely precise measurements, Zeno machines) are deeper:  
       - They violate **finiteness** (e.g., requiring infinite energy/information in finite time/space).  
       - They rely on **non-constructive or idealized resources** (e.g., exact real numbers, which can encode uncomputable data).  
     - **Key presupposition**: CTT defines the limits of *mechanical symbol manipulation* under finite, discrete, step-by-step constraints. Hypercomputers aren't "stronger computers"—they're *different kinds of processes* (e.g., oracle-assisted, analog-continuous) that fall outside the scope of what CTT aims to characterize. The practice assumes CTT is a thesis about **procedures**, not general physical phenomena.

  ### 3. **Efficiency vs. Computability: The Asymmetry**  
     - **Why CTT feels untouchable, while "efficiency" isn't**:  
       - **Computability** (CTT) is about *fundamental limits of information processing*. Its mathematical robustness (via equivalence proofs) and alignment with 80+ years of physical practice make it seem inevitable.  
       - **Efficiency** (e.g., P vs. NP) depends on *physical implementation details*. Quantum computing shows that the "polynomial-time = efficient" heuristic isn't universal—it's a **model-dependent empirical claim**.  
     - **The asymmetry is defensible**: CTT concerns *what is computable in principle*; efficiency concerns *what is feasible under physical constraints*. Physics can radically alter feasibility (e.g., quantum speedups) but hasn't threatened the *existence* of a fundamental computability barrier. Even quantum computers compute only Turing-computable functions—just faster for some problems.

  ### 4. **What CTT *Is*: A Conceptual Analysis Anchored in Practice**  
     Your roommate's "physical quantity" analogy is insightful. CTT is best seen as:  
     - **A *conceptual analysis***: It refines the vague pre-theoretic idea of "mechanical computation" into a precise mathematical concept (Turing-computability).  
     - **A ***normative*** claim**: Any system claiming to perform "computation" must either compute Turing-computable functions or explain why it shouldn't count as "following a rule."  
     - **Empirically constrained**: Its credibility comes from (1) mathematical convergence, and (2) the **failure to discover physical processes** that compute beyond Turing machines *while still satisfying the intuitive notion of an algorithm*.  

  ### 5. **What Would Change Under Different Assumptions?**  
     If CTT were treated as purely empirical (e.g., "No physical system computes beyond TMs"):  
     - **Uncomputability results** would be stated conditionally: "If CTT holds, then the halting problem is unsolvable."  
     - **Hypercomputers** would be serious counterexamples rather than curiosities. Physics majors (like your roommate) would dominate the conversation.  
     - **Cryptography** would collapse: Security proofs could never rule out physical hypercomputation.  

     If CTT were a tautological definition (e.g., "Computable = Turing-computable"):  
     - **Convergence evidence** would be pointless—why compare formalisms if it's true by definition?  
     - **Hypercomputers** would be "non-computers" by fiat, rendering the term meaningless.  

  ### 6. **Where Practice is Underdetermined**  
     - **The scope of "effective procedure"**: What counts as "mechanical"? Are neural networks, quantum systems, or cosmological processes "following rules"? Practice assumes discrete, finite-step processes but doesn't legislate this.  
     - **Physical realizability**: CTT doesn't *require* physical implementation—it's a claim about abstract procedures. But dismissing hypercomputation relies on conflating mathematical and physical constraints.  

  ### Conclusion  
  The implicit view is a hybrid: CTT is a **conceptually refined, mathematically robust, and physically corroborated** thesis. It's treated as untouchable because:  
  - Its mathematical core is solid (equivalence proofs),  
  - No compelling counterexample (that fits "algorithm") exists after decades,  
  - Rejecting it would uproot the foundations of CS.  

  **Concrete implications if swapped**:  
  - **Cryptographers** *should* be nervous about quantum attacks but *not* about hypercomputation—because CTT is stable while efficiency isn't.  
  - **Complexity theory** would need multiple efficiency measures (quantum, classical) but **computability** wouldn't change.  

  **Recommendation**: Read *Copeland & Shagrir's* "The Church-Turing Thesis: Logical Limit or Breachable Barrier?" for a nuanced defense of the status quo. Your skepticism is healthy—it shows you're engaging deeply with the philosophy beneath the formalism.  

  *TL;DR: CTT is treated as a "fixed point" of computational theory, justified by mathematical convergence and physical practice. Hypercomputation is excluded not (just) for being unphysical, but for violating the notion of an algorithmic procedure. Efficiency is contingent; computability isn't.*
