  1. **Verbal Dispute:** A student might say that the classification (fink vs mask) is arbitrary because it depends on how we describe the object. For example, if we describe the object as having the fink device, then it's a fink, but if we describe the fink device as part of the object's intrinsic properties, then maybe the object wasn't fragile to begin with? The TA should be ready to explain that the dispute is about the persistence of the disposition through the stimulus.

  2. **Confusion in Classification:** Students might misclassify masks as finks or vice versa because the scenarios are complex. The debrief should clarify with examples.

  3. **Time Pressure:** Some groups may not finish in 8 minutes. Have a timer and move on.

  4. **Scoring Confusion:** Make sure the scoring is clear: they bet 1 point on whether the object has the disposition (based on the description before the test). Then they get 1 point back if correct, lose 1 if wrong. Then they classify and get 1 point if correct, lose 1 if wrong.

  **Final Note:** The game is designed to make the students feel the problem. They will be frustrated by the misleading cases and by the need for second-order dispositions. The debrief should tie that frustration to the philosophical problem.

  **Materials Preparation:** The TA needs to prepare 18 scenario cards and score sheets. Example of a card:

  **Card Example (Fink):**

  - **Object:** A bomb that is disposed to explode when the red button is pressed.
  - **Fink Device:** When the button is pressed, a device disarms the bomb in 0.1 seconds (so it loses the disposition to explode).
  - **Test:** The red button is pressed.
  - **Outcome (hidden):** The bomb does not explode.

  **Instructions for the group:**
  1. Read the object and fink device description. Do not read the outcome yet.
  2. Bet: Does the bomb have the disposition to explode when the button is pressed? (Circle: Yes or No) -> They should bet "Yes" (because the description says it is disposed, and the fink device is there but hasn't activated yet).
  3. Reveal the outcome: no explosion.
  4. Classify: Why did the outcome happen? 
     - Fink: The disposition was lost when the button was pressed.
     - Mask: The disposition was present but blocked.
     - Mimic: The disposition wasn't there, but something else caused the explosion (but here it didn't explode, so not mimic) -> so Fink.

