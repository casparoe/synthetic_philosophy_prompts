  - 23-31 min: Third round (same).
  - 31-40 min: Groups tally their scores and then we have a whole class discussion: each group reports on one of their scenarios (especially the tricky ones) and how they classified it and why. The TA writes the scenarios on the board and the classifications.
  - 40-50 min: Debrief.

  **Debrief:**

  1. Map specific moments in the game to the concepts:
     - When a group was misled by a fink device and bet that the object didn't have the disposition, but then it manifested? (They lost the bet.) Then they classified it as a fink. But in the scenario where the fink device failed, they might have bet incorrectly because they trusted the fink device would work.
     - When a group encountered a mask and bet that the object had the disposition (because they knew about the mask) but the manifestation didn't occur? Then they won the bet? But then the classification: mask. But what if the mask was removable? Then the manifestation occurred and they won the bet, but they might have thought it was a mask and been wrong in classification.

  2. The regress: point out that in the scenarios with second-order features, to classify the case as fink or mask, they needed to know about the dispositions of the fink device or the mask. For example, to know if the fink device would work, they needed to know if it was disposed to activate when the stimulus occurred, which might depend on further devices. This leads to a regress.

  3. Why finks and masks are different:
     - In a fink, the disposition is lost when the stimulus is applied. The object no longer has the disposition at the time of the manifestation (if there were a manifestation).
     - In a mask, the disposition is retained, but something prevents the manifestation.
     - The game should have shown that in a fink, the test outcome (no manifestation) leads us to think the disposition was absent, but it was present until the stimulus. In a mask, the test outcome (no manifestation) might be consistent with the disposition being present (if we know about the mask), but without that knowledge, we might think the disposition is absent.

     The key difference is what happens to the disposition during the stimulus: does it go away (fink) or stay (mask)?

  4. What the game cannot stage: The game relies on the scenario descriptions to tell the students about the underlying dispositions. In reality, we don't have such descriptions. We have to infer from other tests or from theory. The game cannot stage the metaphysical distinction without the descriptions, so we have to supply the idea that in the real world, we don't have the designer's notes. We have to use science and philosophy to figure out the best account.

