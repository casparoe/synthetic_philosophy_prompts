       - Object: A bomb that is disposed to explode when the red button is pressed (C). It has a fink device: when the button is pressed, the device disarms the bomb (so it loses the disposition). But there is a second device: when the button is pressed, it also sends a signal to disable the fink device. However, the second device is slow: it takes 1 second to disable the fink device, but the fink device disarms the bomb in 0.5 seconds. So the bomb is disarmed? Then the test outcome: the bomb does not explode. But was the disposition present at the time of the stimulus? Before pressing the button, yes. After pressing, it was disarmed. So it's a fink. But to know that the fink device worked, we are relying on the timing of the second device? And what if there was a third device to speed up the second device? This leads to regress.

