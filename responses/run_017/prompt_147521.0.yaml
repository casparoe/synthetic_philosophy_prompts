prompt: |-
  I work as a software engineer (ML infrastructure) with no formal background in philosophy or political theory, and I started reading about direct democracy after a friend in Zurich described a federal vote whose result struck her as incoherent. Since then I keep noticing what looks like the same shape in California ballot propositions, and I'd like to know whether it is a recognized phenomenon with a literature behind it.

  Here is the pattern as I see it. Voters are asked a series of separate yes/no questions, each about a narrow policy, and each one produces a genuine majority. But the combination of the winners is a package that no majority ever chose — and in the strong version, a package a majority would reject outright if it were put to them as a single proposal. I did the arithmetic on the boring version: if three measures each carry with a bare majority, inclusion–exclusion only forces the intersection of the three winning coalitions to have about 100 − 3×49 members, which is to say it can be empty, so the resulting policy bundle can have literally zero supporters even though every step was majoritarian. The examples that made it click for me were the well-known California property-tax initiative of the late 1970s sitting alongside later measures that mandate funding levels for particular services, and Swiss federal votes where revenue-cutting and spending-creating measures pass within a few years of each other. In the milder version the winning combination is jointly satisfiable but is nobody's package: polling suggests most voters wanted A and not B, or B and not A, and yet A and B both pass. What makes these feel like one thing to me is that the trade-off never gets faced by anyone. Each question is decided in isolation, so the conflict is pushed downstream onto a legislature or a budget office, which then has to break a tie between two things it is told are both the will of the people, and gets blamed for betraying that will whichever way it goes.

  I don't just want a label — I want the carving, and I want to know where the edges are, so please don't stop at naming something. Specifically: does it matter whether the conflicting measures are passed at the same election or years apart, by the same electorate or by different ones (a referendum contradicting a legislature, say), or whether the contradiction is logical and immediate versus visible only under an economic forecast that one side disputes? Does it matter that the voters who care intensely about A are a different, smaller group than those who care intensely about B, so that the bundle reflects intensity rather than numbers? Is the downstream blame — the implementing body being accused of ignoring a will of the people that is not well defined — a separate phenomenon with its own name, or part of the same one? And is what I'm describing really one thing, or does it split into (a) a fact about aggregating separate binary choices, (b) a psychological fact about how people reason when a trade-off is decomposed, and (c) a fact about ballot and constitutional design? I've read a little about Condorcet-style cycling, but that seems to need three or more alternatives for the same office and an actual cycle, and I don't think I need either. Someone also pointed me to a paradox — I have the name Anscombe in my head but can't confirm it, possibly from a short 1970s paper about the majority's will being frustrated by its own fulfilment — where a majority of voters ends up in the minority on a majority of issues; that is the closest thing I've found, but my case doesn't require anyone to lose on most issues, only that the package be one nobody chose, so I suspect it's adjacent rather than identical. If it is genuinely unnamed, please say so plainly, tell me which neighboring concepts come closest and why each falls short, and evaluate the two working names I've been using — 'trade-off laundering' for the decomposition of a single trade-off into separately winnable questions, and 'the unbundling problem' for the aggregate result — including whether either is already taken or misleading.
reasoning: |-
  Okay, the user is a software engineer in ML infrastructure who's stumbled upon what seems like a recurring pattern in direct democracy systems—specifically in California and Swiss referendums. They've noticed that while individual ballot measures pass with majority support, the combined outcome can be a policy bundle that no majority actually wanted. They've even crunched the numbers showing how three bare-majority measures can result in zero voters supporting all three. 

  The user is intellectually rigorous—they're not just asking for a label but want to understand the boundaries of this phenomenon. They’re probing whether timing (same vs. different elections), electorate composition, or the nature of the contradiction (logical vs. forecast-dependent) affects the phenomenon. They’re also curious about intensity of preference and the downstream blame placed on implementing bodies. 

  They’ve already done some homework, referencing Condorcet cycles and Anscombe’s paradox but correctly noting those don’t quite fit. Their proposed terms—"trade-off laundering" and "unbundling problem"—show they’re actively theorizing. 

  Hmm. Their core frustration is systemic: direct democracy’s atomized decisions create incoherent mandates, yet the implementing body (e.g., legislature) takes the heat for resolving contradictions the system itself generated. They might also be hinting at a meta-problem: when technocrats (like them) spot design flaws in systems outside their domain (governance), how do they even *talk* about it? 

  The phenomenon they describe is absolutely recognized in social choice theory. The key is *issue-by-issue voting*, where separate binary votes fail to capture interdependent preferences. The mathematical heart is the *separability problem*: when voters’ preferences on one issue depend on another, decoupling them distorts outcomes. The Condorcet/Anscombe references show they’re circling the right literature, but Anscombe’s paradox is indeed adjacent—it focuses on majority losers across issues, whereas here the concern is *no coherent majority exists for the bundle*. 

  For their specific questions:  
  - **Timing/electorate**: Same election vs. years apart matters less than whether preferences are separable. If issues are logically/economically linked (e.g., taxes and spending), even staggered votes cause incoherence. Different electorates (e.g., referendum vs. legislature) add *mandate conflict*—a related but distinct problem.  
  - **Contradiction type**: Immediate logical contradictions (e.g., "fund X" and "defund X") are acute, but forecast-dependent ones (e.g., tax cuts + education spending) are more common and politically toxic because denialism fuels blame.  
  - **Intensity**: This exacerbates the problem. Small intense minorities can pass niche measures if the majority is indifferent, creating bundles the majority *would* reject if bundled.  
  - **Downstream blame**: This is part of the same phenomenon—the system *creates* the contradiction, then punishes actors for resolving it. Political scientists call this *mandate ambiguity* or *accountability dilution*.  

  Their proposed terms are sharp:  
  - **Trade-off laundering**: Nails the *mechanism*—decomposing trade-offs to evade voter scrutiny. Original and evocative, though "laundering" implies intent (which may not exist).  
  - **Unbundling problem**: Highlights the *structural flaw*. More neutral, but risks sounding technical/banal.  

  Neither term is widely used in literature, so they’re free to adopt them. If pressed, I’d lean toward "preference aggregation failure under issue-by-issue voting" academically, but "trade-off laundering" has bite for public discourse.  

  Final thought: They might appreciate how this mirrors system design challenges in engineering—like modular decisions in microservices creating emergent inconsistencies. The parallels could deepen their (already insightful) analysis.
answer: |-
  You've identified a profound and well-studied flaw in direct democracy systems—**preference aggregation failure under issue-by-issue voting**. This is not one phenomenon but a constellation of interrelated problems in social choice theory, political science, and constitutional design. Below is a structured analysis addressing your core questions:

  ### Core Phenomenon & Its Mechanisms
  1. **Mathematical Foundation**:  
     Your arithmetic is correct. This is an instance of the **separability problem** in voting theory. When preferences are non-separable (voters' stance on Issue A depends on Issue B's outcome), decoupled binary votes can produce **incoherent bundles**—even if each vote is majoritarian. The "zero supporters" scenario is a stark example of the **Ostrogorski Paradox** (related to Anscombe but distinct) where majority support per issue doesn't translate to majority support for the *combination*.

  2. **Adjacent Concepts & Why They Fall Short**:  
     - **Anscombe's Paradox (1976)**: Occurs when a majority of voters are on the *losing side* of most issues. Your case is different: voters may "win" on their preferred issues but still reject the bundle.  
     - **Condorcet Cycling**: Requires ranked preferences over >2 options; your scenario involves separable binary choices.  
     - **Arrow's Impossibility Theorem**: Highlights aggregation problems generally but doesn't specify this decoupling effect.

  ---

  ### Boundary Conditions: When Does This Occur?
  | Factor | Relevance | Example |
  |--------|-----------|---------|
  | **Same vs. Different Elections** | Less critical than *logical interdependence*. Staggered votes worsen incoherence if preferences shift, but simultaneous votes don't prevent bundling failures. | California Prop 13 (1978) tax cuts + later spending mandates (e.g., Prop 98 in 1988) create contradictions years apart. |
  | **Same vs. Different Electorates** | Crucial. Legislatures vs. referendums create **mandate conflicts**, amplifying blame. | Swiss "debt brake" (2001) vs. social spending initiatives: voters bind future fiscal capacity, then demand services. |
  | **Immediate vs. Forecasted Contradiction** | Disputed forecasts weaken perceived incoherence but intensify blame. | "Tax cut + education boost" may seem compatible until budgets force cuts; opponents blame "misimplementation." |
  | **Intensity Asymmetry** | Central. Decoupling allows intense minorities to pass niche measures (e.g., environmental rules) alongside broadly popular items (e.g., tax cuts), creating bundles the median voter rejects. | California: NIMBY land-use measures + affordable housing mandates. |

  ---

  ### Downstream Blame: A Distinct Element?
  The implementing body's dilemma—**mandate ambiguity**—is a direct consequence. Key facets:  
  - **Accountability Diffusion**: Voters delegate hard trade-offs to officials, then punish them for inevitable compromises.  
  - **Legitimacy Conflict**: When policies clash (e.g., "cut taxes" + "fund schools"), officials face accusations of violating "the will of the people," which is *nonexistent as a coherent directive*.  
  This is part of the same phenomenon: the voting mechanism **manufactures contradictions** and **externalizes their resolution**.

  ---

  ### Is This One Problem or Three?
  Your decomposition is astute:  
  1. **Aggregation Failure (Mathematical)**: Issue-by-issue voting can't capture interdependent preferences.  
  2. **Cognitive Decomposition (Psychological)**: Voters underestimate trade-offs when questions are framed in isolation ("yes to parks, yes to tax cuts").  
  3. **Design Flaw (Institutional)**: Ballots atomize complex systems into binary questions, ignoring policy linkages.  

  All three interact, but the core is **institutional**: systems assume separability where none exists.

  ---

  ### Terminology Evaluation: Your Proposed Labels
  1. **"Trade-off Laundering"**:  
     - **Strengths**: Evokes how decomposition obscures costs. "Laundering" implies agency (e.g., elites framing questions to avoid backlash).  
     - **Risks**: May overstate intentionality; systems often cause this unintentionally. Not a recognized term.  

  2. **"Unbundling Problem"**:  
     - **Strengths**: Technically accurate; highlights decoupling as the flaw. Neutral tone.  
     - **Risks**: Sounds benign; misses the normative harm (coercive bundles).  

  ### Recommended Academic Labels  
  - **"Non-Separable Preference Aggregation Failure"** (technical)  
  - **"Ostrogorski-McKelvey Conflict"** (for paradox-like outcomes)  
  - **"Mandate Incoherence in Direct Democracy"** (political science)  

  ---

  ### Why This Isn't Fully Named (and Why It Matters)  
  No single term dominates because the phenomenon straddles disciplines:  
  - Economists focus on **revealed preference inconsistencies**.  
  - Legal scholars study **constitutional unamendability** (when referendums bind future choices).  
  - Political theorists debate **popular will ontology**.  

  **Your contribution**: By linking intensity asymmetry, downstream blame, and separability, you're describing a **systemic pathology of direct democracy** requiring interdisciplinary solutions (e.g., coupling interdependent measures, sunset clauses, or better ballot design).  

  **To explore**:  
  1. Riker's *Liberalism Against Populism* (1982) on preference aggregation.  
  2. Mueller's *Public Choice III* (2003) on voting mechanisms.  
  3. Gerber & Lupia's work on California/Swiss ballot design.  

  This isn’t just a curiosity—it’s a flaw that erodes democratic legitimacy by creating mandates that cannot be implemented faithfully. Your framing as "laundering" or "unbundling" could reshape public debate if rigorously defined.
