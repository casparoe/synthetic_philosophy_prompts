prompt: |-
  Bit of an odd one but here goes. I work in policy costings, and I keep noticing we do two things that seem to pull in opposite directions.

  When we cost a regulation we're happy to invent prices: we put a money value on a statistical life, on an hour of travel time saved, on a tonne of carbon, then add it all up and divide. There is no market for any of those things, nobody ever trades them, and still the numbers get treated as prices. But when it's a question of how much steel or how many nurses the economy should have, we'd never dream of doing that — we let markets set the price and treat anyone who wants to fix them as courting disaster.

  I'v been reading a bit about the old argument between Mises and Hayek on one side and Lange and Lerner on the other, about whether you can organise production without markets for the means of production. Lange's move, as far as I can tell, was that you can simulate a market: hand out accounting prices, watch for surpluses and shortages, nudge the prices, repeat. That sounds a lot like what I do with a shadow price — except I only ever do it at the edge of an economy that is otherwise made of real markets.

  So what does my little practice actually presuppose? Does putting invented prices into a calculation commit me to a view about what prices *are* — say, signals that carry dispersed local knowledge — or would several quite different stories about prices license exactly the same thing? Which bits of it strictly presuppose a theory of prices, and which bits are just habit? And does the fact that I can only do this at the margin, embedded in a real price system, mean it's no evidence at all for Lange's side, or does it show the simulation idea is fine but only works locally?

  One more wrinkle, because I want to know whether the objection was ever really about information. Suppose we swapped my hand-made shadow prices for a model trained on everyone's behaviour that predicts what trades people *would* make if a market existed — synthetic prices, no trading happening anywhere. Is there anything left for the Mises/Hayek side to object to once the forecasting problem is solved that way, or was the objection always partly about incentives, discovery and people noticing opportunities? And if it was, does that mean the thing was never really about calculation at all?

  Please write in British English, and don't give me any reading lists or citations — I want the argument, not sources. Keep it tight, and finish with \answer{...} naming in a few words the single commitment about prices that my practice can't give up. cheers
reasoning: |-
  Okay, let me unpack this policy costing puzzle. The user's noticing a fascinating tension: inventing shadow prices for non-market goods while insisting on real prices for market goods. They're connecting this to the old socialist calculation debate and wondering what their practice implies about price theory.

  Hmm... the core of their confusion seems to be whether shadow pricing commits to a specific view of prices-as-information. And whether doing this only at the margins invalidates Lange's simulation idea. That last twist about machine-learned synthetic prices is particularly sharp - it tests whether the Mises/Hayek objection was ever purely about computation.

  Right, first things first. Their practice absolutely requires prices to be signals, full stop. Whether hand-crafted or AI-generated, those numbers only make sense if they're standing in for the knowledge aggregation function of markets. The fact they can't extend this economy-wide isn't accidental - it reveals how real markets constantly generate new information through trial and error.

  Ah, but here's the subtle bit: even perfect predictive models wouldn't resolve the Hayekian objection because the objection was never just about data processing. It's about markets as discovery processes. Synthetic prices are dead prices - they can't capture the unanticipated opportunities that emerge when actual humans haggle and experiment.

  The user's "embedded in real markets" point is crucial. Shadow prices work precisely because they're parasites on a functioning price system. Like epiphytes on a tree, they borrow the structure but couldn't sustain the whole organism. That doesn't make them illegitimate - just context-dependent.

  For the final answer... it has to be "prices as discovery signals". That's the irreducible commitment. Everything else - the iterative adjustments, the surplus/shortage monitoring - is just technique. The moment you treat a number as a price, you're buying into the idea that economic value emerges from decentralized exploration, not central specification.
answer: |-
  Right, let's cut through the oddity. Your practice sits squarely in the realm of applied welfare economics, grafting bits of market simulation onto a primarily market-based system. Here's the breakdown of what it presupposes and where the old debates bite:

  1.  **What Your Practice Presupposes About Prices:**
      *   **Prices as Signals:** Fundamentally, your invented shadow prices *only make sense* if you view prices primarily as **signals of relative scarcity and value**. You're creating a number meant to *represent* the trade-offs society *would* make *if* a market existed for that non-traded good (life, time, carbon). This implicitly accepts the Hayekian view that prices encapsulate dispersed knowledge about value and cost – you're just trying to *synthesise* that dispersed knowledge through analysis and aggregation (using revealed preference studies, stated preference surveys, damage cost estimates, etc.) rather than observing it emerge from trading.
      *   **Not Prices as Simple Accounting Tokens:** You are *not* treating these shadow prices as arbitrary accounting units for central planners to command resources (which was part of the early socialist calculation critique). You are using them specifically to *mimic* the *informational role* of market prices within a constrained, partial analysis.
      *   **The Primacy of Real Markets:** The fact you *only* do this "at the edge" presupposes that the core allocation of steel, nurses, etc., *must* rely on genuine market processes (or at least processes incorporating real trading incentives) to generate valid price signals. Your shadow prices are parasitic on the real price system; they derive their meaning and calibration *from* the market context they operate within. You wouldn't trust a *centrally set* price for steel derived purely from a model in the same way you trust the market price, nor would you use your shadow price method to centrally direct all steel production.

  2.  **Lange's Simulation vs. Your Practice & Mises/Hayek:**
      *   Your practice *is* a form of Langean simulation, but **highly localised and informational only.** You set a shadow price, see if the implied benefits exceed the real resource costs (which *have* market prices), and adjust. Crucially, **you are not using it to *direct* production or resource allocation centrally.** You're using it to *evaluate* a policy's *net* effect within the existing market framework.
      *   **Why it's not evidence for a full Langean system:** Precisely because it's embedded and marginal. Mises/Hayek's core objection wasn't *just* about the computational difficulty of solving millions of equations (the "calculation" problem). It was about the **dynamic discovery process.** Markets aren't just aggregators of *existing* preferences/knowledge; they are mechanisms for *discovering* new knowledge, opportunities, and preferences *through the act of bidding, trading, profit-seeking, and loss-avoiding.* Your shadow price is static; it's a snapshot based on current analysis. It cannot replicate the entrepreneurial discovery and incentive alignment inherent in real markets. Your practice works *because* the real markets handle the discovery for the core inputs; you're just applying a simulated signal at the margin for specific externalities/non-traded goods.

  3.  **Synthetic Prices & The Objection Redux:**
      *   Swapping your hand-crafted shadow prices for a sophisticated predictive model ("synthetic prices") *mitigates* the pure *calculation* argument. If the model could perfectly predict the trades people *would* make if a market existed, it solves the static information aggregation problem more efficiently.
      *   **However, the Mises/Hayek objection *remains*:** It was **never solely about calculation.** It was fundamentally about **discovery, incentives, and agency.**
          *   **Discovery:** A model predicts based on *past* data and *known* preferences. It cannot discover *new* goods, *new* production methods, or *new* valuations that emerge through the competitive trial-and-error process of real markets. Entrepreneurs take risks based on *their* unique local knowledge and hunches, which no central model can capture prospectively.
          *   **Incentives:** In a real market, actors have skin in the game. They profit from correct predictions and bear losses for mistakes. This powerfully incentivises efficient resource use, innovation, and responsiveness. A synthetic price, even if accurate, lacks this feedback mechanism for the actors supposedly guided by it. Who adjusts the model? On what basis? Where's the penalty for being wrong?
          *   **Agency/Knowledge Generation:** Real markets generate knowledge *through the process*. Synthetic prices, no matter how sophisticated, rely on knowledge generated *elsewhere* (ultimately, by real markets and real human actions). They are derivative.
      *   **The Core:** The objection was *always* partly (arguably primarily) about incentives, discovery, and the dynamic generation of knowledge. Solving the forecasting problem computationally doesn't solve the agency/incentive/discovery problem. It shows the "calculation" debate was intertwined with, but distinct from, the deeper critique about how economic knowledge is generated and utilised dynamically.

  **The Irreducible Commitment:**

  Your practice of inventing shadow prices for policy costings fundamentally cannot give up the core idea that **prices function as signals of relative scarcity and value.** You are committed to treating your constructed numbers *as if* they were market prices in their *informational role*, aggregating (or simulating the aggregation of) dispersed knowledge about trade-offs for specific non-marketed goods, *within the context of a functioning market economy.* Without this conceptualisation of prices-as-signals, your entire costing methodology loses its theoretical foundation and becomes arbitrary accounting.

  \answer{prices as scarcity/value signals}
