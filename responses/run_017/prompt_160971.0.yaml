prompt: |-
  Hey — hoping you can help with something that's been bugging me. I'm not a philosopher; I read about animal cognition as a hobby (kept a reef tank for years and got nerdy about it), so I'm coming at this from the outside.

  Here's the pattern I keep running into. Someone points at a behaviour and says this is what a creature that actually feels things looks like: a fish that keeps rubbing the side of its body against the gravel for hours after being injected with something that stings; a bee that gets shaken the way a predator would shake it and then won't go back to the flowers with a certain smell, for days afterwards; a crayfish that got zapped repeatedly and afterwards just sits in the dark part of the tank even on days when nothing is zapping it. And then someone else says: fine, but that's a reflex, or a fixed action pattern, or learning wired up by evolution — none of it needs anybody to be home inside. So the first person escalates: the animal trades off a shock against a food it really wants, or it transfers what it learned in one setup to a totally different one. And the second person says: sure, more elaborate wiring. And it never stops. However fancy the behaviour gets, the second person can always posit an unconscious mechanism that outputs exactly that behaviour, and the first person never acquires a new *kind* of evidence, because behaviour is all there is to point at, and every piece of it has already been absorbed.

  The bit I want a name for is the structural thing: the "no mind needed" explanation doesn't get any more expensive as it gets more complicated, so it can soak up evidence forever without ever paying for it, while the other side pays full price every time and can never get ahead. I don't think it's just the problem of other minds, because that one is usually framed as a general puzzle about knowing any mind at all, including human ones, and nobody here is doubting other humans. And I've seen people invoke a rule of thumb — don't reach for a fancy mental explanation when a humbler mechanism covers the data — which somebody told me is named after some long-dead psychologist. That feels close but wrong: it's advice about which explanation to prefer, not a description of why one side's explanations cost nothing.

  One more wrinkle, so you don't hand me something too simple. Whatever I'm describing, it isn't plain stinginess about animal minds, because it seems to switch off around animals that are very unlike us. Show people a bee doing something half as elaborate as the fish thing and plenty of them will say yes, that one's conscious — the discount seems to track how much the creature resembles us, not how much evidence there is.

  So: does this have an established name, and if not, coin one and define it tightly enough that I can tell it apart from ordinary scepticism about other minds, from the humbler-mechanism rule, and from just being wrong about a particular species? I'm after the carving, not the label — if the nearest established concept only half fits, tell me exactly where it stops fitting. And where are the edges: does the thing survive if you switch from behavioural evidence to evidence about mechanisms and brain structures, or does it just move house — and if it moves, is that the same phenomenon wearing a hat or a second one? Please don't point me at papers or reading lists, I've got no library access from here and couldn't follow up anyway; just give me the shape of it in your own words. Also say how confident you are in what you're claiming and flag the part you're least sure of — I'd rather have one honest wobble than a tidy answer. Last thing: write it as continuous prose, no headings, bullets, bold text or tables, just paragraphs like you were writing me an email.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a pattern in debates about animal cognition where one side points to behaviors as evidence of inner experience, and the other dismisses it as mere reflexes or complex wiring. The user wants a name for this structural issue where the "no mind needed" explanation doesn't become less plausible with complexity, while the "mind present" side has to keep proving itself anew.

  First, I need to recall relevant philosophical concepts. The problem of other minds comes to mind, but the user already mentioned it's not that because it's specific to non-human animals. Then there's Occam's razor or Lloyd Morgan's canon, which advise simpler explanations, but the user feels that's not quite it—it's about the asymmetry in how evidence is treated.

  The key here is the asymmetry. The skeptic can always propose a more complex but still unconscious mechanism without it seeming ad hoc. Meanwhile, the advocate for animal consciousness has each new behavior challenged anew. This is reminiscent of the philosophical concept of underdetermination, where multiple explanations fit the same data. But applied specifically to consciousness, it might relate to the "hard problem" or the explanatory gap.

  I remember Dennett's "zombie" argument—the idea that behavior alone can't confirm consciousness because a philosophical zombie could behave identically without inner experience. That seems relevant. The user's description matches this: no matter how complex the behavior, a zombie explanation remains possible. So the core issue is the inherent unobservability of subjective experience.

  The user also notes that skepticism decreases for animals similar to us, like mammals versus insects. That points to anthropomorphism bias. People are more willing to attribute consciousness to animals that resemble humans physically or behaviorally, even with less evidence. This adds another layer—the asymmetry isn't just logical but influenced by subjective human biases.

  Putting it together, the structural problem is that consciousness is private. Behavior is public but can't directly prove subjective experience. So the skeptic's position is inherently unfalsifiable; they can always imagine a mechanistic explanation. This creates an uneven burden of proof. The user wants to distinguish this from general skepticism and Lloyd Morgan's canon.

  Lloyd Morgan's canon is a heuristic favoring simpler explanations. But the user's issue is about the persistent viability of the no-consciousness explanation regardless of evidence. That's different. The canon suggests when to prefer one explanation, but the structural problem is why one explanation remains viable despite evidence.

  The edges: if we switch to neural evidence, does the problem persist? For example, if a bee has neural correlates similar to human pain regions, does skepticism vanish? Probably not, because we still can't confirm subjective experience. The skeptic might argue those neural patterns are just mechanisms without qualia. So the problem shifts but remains—it's about the gap between physical processes and subjective experience.

  The user also wants to avoid academic references, so I need to explain in plain terms. Confidence-wise, the core concepts (explanatory gap, zombie argument, anthropomorphism) are solid, but how they interrelate might need careful phrasing. The least certain part is whether neural evidence changes the problem fundamentally or just relocates it. I think it relocates but the underlying issue of accessing subjective experience remains.
answer: |-
  Here's how I see the structural problem you're describing. It's not one neat term, but a specific entanglement of philosophical and psychological tendencies. The closest established label is the **explanatory gap for consciousness**, particularly when applied to non-human animals, but that needs unpacking to fit your carving. Let me build it step by step in prose.

  The core issue is that subjective experience (phenomenal consciousness, "what it's like" to be that creature) is inherently private. Behaviour and neural mechanisms are public evidence we can point to, but they are *correlates*, not the experience itself. This creates an asymmetry. The advocate for animal consciousness must argue that complex behaviour or neurobiology *implies* subjective experience. The sceptic, however, can always posit a "philosophical zombie" scenario: a system that perfectly replicates the observed behaviour and physiology *without* any inner experience. Because consciousness isn't directly observable, this zombie hypothesis remains logically possible, no matter how complex the evidence gets. The sceptic's explanation doesn't require adding a fundamentally new *kind* of entity (subjective experience) to their ontology; they just keep elaborating the physical mechanism. Crucially, because complex behaviour *can* (in theory) be produced by clever unconscious mechanisms (think sophisticated AI), positing increasingly complex mechanisms doesn't inherently strain their explanation more than the simpler ones did. The cost isn't in complexity per se, but in the *type* of explanation – and for the sceptic, sticking to purely physical/functional explanations avoids that cost entirely. This is why the sceptic can "soak up evidence forever" – they're playing within the rules of physical causation, where adding complexity isn't inherently less parsimonious than simplicity if it explains the data.

  This differs from the general "Problem of Other Minds" in a key way you identified: we grant human consciousness readily, usually based on analogy to ourselves (they look/behave like me, so they *are* like me internally). That analogy breaks down with non-human animals. It also differs from **Lloyd Morgan's Canon** (the "humbler mechanism" rule you mentioned). Morgan's Canon is a methodological principle: *prefer* the lower psychological explanation until complexity forces you higher. Your issue is the *structural reason why* the sceptic never *has* to move higher: the zombie alternative remains viable because consciousness is unobservable. Morgan's Canon suggests *when* to switch explanations; your asymmetry explains *why one side never needs to switch*.

  Your wrinkle about resemblance is crucial. This is **anthropocentric bias** or **differential anthropomorphism**. We readily project consciousness onto mammals (especially primates) or vertebrates because their behaviour and physiology feel familiar, making the analogy to human experience easier. We resist it in creatures like insects, fish, or crustaceans because the analogy feels strained. The sceptic leverages this bias: the less human-like the animal, the easier it is to dismiss behavioural evidence as "just reflexes" or "complex programming," even when the behaviour is functionally identical to something a mammal does that we'd accept as evidence of feeling. The burden of proof isn't applied equally; it gets heavier the less the animal resembles us.

  Now, the edges:

  1.  **Switching to Mechanisms/Brain Structures:** The problem absolutely moves house, but it doesn't vanish. Finding neural correlates of pain (e.g., specific brain regions, neurotransmitter responses) in a fish doesn't *force* the conclusion of subjective experience. The sceptic can still say: "That's just the evolved neural circuit *causing* the avoidance behaviour and physiological stress response. It's sophisticated nociception, not necessarily *painful* experience. The circuitry outputs the behaviour without needing 'someone home'." The evidence shifts from behaviour to physiology, but the core challenge – bridging the gap between physical process and subjective feel – remains identical. You've traded behavioural zombies for neural zombies. This *is* the same phenomenon wearing a different hat.
  2.  **Where it Stops Fitting:**
      *   **Ordinary Scepticism:** This *is* a specific form of scepticism about *non-human* minds, amplified by the explanatory gap and anthropocentric bias. Ordinary scepticism might doubt a *particular* claim with *specific* counter-evidence; this is systematic doubt based on the *nature* of the evidence and the target.
      *   **Being Wrong About a Species:** That's an empirical claim ("This species lacks consciousness"). Your structural problem is the *reasoning pattern* that makes such claims persistently defensible *regardless* of mounting evidence for that species. It's about the logic of justification, not the biological fact.
      *   **The Humbler-Mechanism Rule (Morgan's Canon):** As above, this is advice about hypothesis choice. Your asymmetry explains the *background condition* that makes adhering strictly to Morgan's Canon lead to perpetual scepticism about consciousness in non-humans.

  **Confidence & Wobble:**

  I'm highly confident this accurately describes the structural asymmetry you identified: the unfalsifiable nature of the "no-mind" position due to the explanatory gap, combined with the anthropocentric scaling of the burden of proof. I'm confident this is distinct from the general Problem of Other Minds and Lloyd Morgan's Canon as explained.

  My slight wobble is on the precise interplay between the *logical* point (the inherent unfalsifiability of the zombie hypothesis) and the *psychological* point (the anthropocentric bias in applying the burden of proof). Are they two facets of the same phenomenon, or is the bias merely a common amplifier of the logical problem? I lean towards them being intertwined – the logical gap *enables* the bias to persist so effectively – but I'm open to arguments that they are conceptually distinct drivers.

  The core phenomenon you've nailed is the **asymmetrical burden of proof sustained by the explanatory gap and modulated by anthropocentric bias**. While "explanatory gap for animal consciousness" is the most established anchor, the specific dynamic you describe – the sceptic's explanations scaling without cost, the advocate needing ever more complex evidence of the same *kind* that never forces a shift – deserves recognition as a persistent hurdle in understanding other minds, far beyond humans. It's the reason the crayfish's quiet suffering in the dark corner can always, logically, be explained away.
