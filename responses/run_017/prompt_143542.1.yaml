answer: |-
  Here is a prioritized list of desiderata for an adequate evolutionary debunking argument (EDA) targeting sophisticated non-naturalist realism, designed to settle your specified cases, followed by incompatibility analysis and argument-type scoring.

  ### Desiderata for Adequate EDAs (Prioritized)
  1.  **Non-Global Scope (Non-negotiable):** The EDA must debunk only a *subset* of moral judgments (or their justification), leaving room for justified moral belief/knowledge. *Rationale:* Avoids self-defeat (debunking the moral premise of the EDA itself) and nihilism inconsistent with the target (reducing confidence, not inducing abandonment). Fission case forces this: divergence must be explicable without debunking the entire capacity or core judgments.
  2.  **Content-Level Discrimination (Non-negotiable):** The EDA must distinguish debunked from non-debunked judgments *at the level of moral content/propositions*, with a principle for sorting. *Rationale:* Fission case: Divergence occurs on specific content (obligations to distant future people). Plasticity alone cannot explain *why* core judgments might escape; the realist needs to know which judgments lose warrant and why.
  3.  **Targets Justification (Not Necessarily Truth) (Non-negotiable):** The EDA must primarily function as an *undermining defeater* for the *justification* or *warrant* of holding specific moral beliefs, not necessarily demonstrating their falsehood. *Rationale:* Distinguishes undermining from rebutting defeat. Allows the judgment to be true but unjustified given its etiology. Essential for targeting realist confidence without presupposing error theory.
  4.  **Undermining Defeat Mechanism (Non-negotiable):** The EDA must provide a clear *undermining* (not rebutting) defeater arising from the etiological explanation. *Rationale:* The threat is that the explanation shows the belief wasn't formed/held in a way responsive to moral truth, irrespective of its actual truth value.
  5.  **Warrant Distinction: Capacity vs. Token Judgment (Non-negotiable):** The EDA must distinguish explaining the *origin of the capacity* for moral judgment from explaining the *warrant for specific token judgments*. *Rationale:* Explaining the capacity's evolution (e.g., Plasticity case) doesn't automatically defeat warrant for specific judgments formed using that capacity. The defeat must target the warrant for *this judgment* given its causal history.
  6.  **First-Order Focus (Non-negotiable):** The EDA must directly target the justification of *first-order moral judgments*, not merely the meta-claim of stance-independent moral facts. *Rationale:* The target is the realist's confidence in *her specific moral beliefs* (e.g., "slavery is unjust").
  7.  **Independence from First-Order Moral Knowledge (Non-negotiable):** The sorting principle for (2) must *not* presuppose or rely on contested *first-order moral knowledge* held by the debunker. *Rationale:* Otherwise, the EDA begs the question against the realist by assuming the debunker knows which judgments are true to sort them. Fission case requires sorting without assuming *we* know the truth about distant obligations.
  8.  **Requires a Tracking Failure Premise (Non-negotiable):** A complete causal-etiological explanation is *necessary but not sufficient* for defeat. The EDA must include a plausible premise showing why *this specific etiology* fails to track moral truth. *Rationale:* Explanatory Sufficiency concern: Without a tracking failure claim, EDAs overgeneralize wildly (perception, logic, math). The defeat stems from etiology + lack of truth-connection.
  9.  **Specific Epistemic Principle (Non-negotiable):** The tracking failure premise (8) must be grounded in a *specific, articulated epistemic principle* explaining why *this* etiology is unreliable/unresponsive to *moral* truth specifically. *Rationale:* Avoids vagueness. Must show why the principle applies to morality but doesn't overgeneralize catastrophically (e.g., debunking logic). Must address the modal worries of realists (necessary supervenience, a priori access).
  10. **Downstream Stability Account (Negotiable - but Highly Important):** The EDA must provide a plausible account of the *status and persistence* of debunked judgments and moral discourse *after* debunking (e.g., Reformer case). *Rationale:* Explains why the phenomenology and practical grip remain, and what rational role (if any) first-order moral reasoning retains (e.g., fictionalist, conservationist, revised realist view).
  11. **Empirical Falsifiability (Non-negotiable):** The EDA must specify what empirical findings about moral judgment variation or invariance across relevant populations would disconfirm its core claims about etiology and tracking failure. *Rationale:* Necessary for scientific and dialectical seriousness. E.g., Fission case findings could challenge the sorting principle; invariance where pressures differed challenges the etiological dependency.
  12. **Avoids Necessitating Causal Contact (Non-negotiable):** The EDA must *not* rely on the premise that stance-independent moral facts *must* causally interact with believers to be known. *Rationale:* Against realists who hold moral facts are necessarily supervening and knowable a priori, "no causal contact" is irrelevant or question-begging. The argument must work on epistemic grounds (tracking/reliability) acceptable even if knowledge is a priori.

  ### Incompatible Desiderata Pairs
  1.  **Content-Level Discrimination (2) + Independence from First-Order Moral Knowledge (7) vs. Feasibility:** *Incompatibility Argument:* To discriminate *which content* is debunked (Fission case) without presupposing first-order moral knowledge, the EDA needs a *non-moral, etiological* sorting principle (e.g., "judgments directly promoting Pleistocene fitness are suspect"). However, the realist can plausibly argue that the core moral capacity, even if evolved for fitness, *could* discern truths about necessary features of rational agency/sociality (escaping the sorting). Conversely, any sorting principle strong enough to *reliably* pick out debunked content seems to implicitly rely on knowing (or assuming) what the *non*-debunked moral truths *are* to define the contrast class. Satisfying both (2) and (7) simultaneously appears extremely difficult, potentially impossible without smuggling in moral assumptions.
  2.  **Requires Tracking Failure Premise (8) + Specific Epistemic Principle (9) vs. Avoiding Overgeneralization (Anti-Prejudice):** *Incompatibility Argument:* Formulating a *general* epistemic principle (9) that explains why *moral* tracking fails (8) without also implying the failure of tracking in domains like logic/math/perception is highly challenging. The most natural general principles (e.g., "Beliefs caused by processes insensitive to domain-specific truth-makers are unjustified") *will* overgeneralize unless supplemented by specific, non-ad-hoc claims about the *unique* inaccessibility or nature of moral truth. This risks begging the question against realism or making the principle morality-specific, undermining its claim to generality. Satisfying (8) and (9) without overgeneralization requires a highly nuanced, perhaps implausibly specific, epistemic principle.

  ### Most Excluding Requirement
  *   **Specific Epistemic Principle (9)** excludes the largest number of candidate arguments.
  *   *Why:* Many EDAs (especially Type C below) rely on the intuitive force of the genealogy itself or vague notions of "no connection" or "coincidence" (Type A), without articulating a precise, non-overgeneralizing epistemic principle grounding the tracking failure. Type B arguments often focus on a specific feature (authority) but don't always ground it in a clear principle applicable to sorting judgments. Requirement (9) forces explicit engagement with epistemology that most sketches avoid.

  ### Argument-Type Scoring (Against Key Desiderata)

  | Argument Type | Key Strengths                                   | Key Weaknesses                                                                 | Overall Adequacy (Per List)              |
  | :------------ | :---------------------------------------------- | :----------------------------------------------------------------------------- | :--------------------------------------- |
  | **(A) Coincidence Dilemma** | Strong on (1) Non-Global Scope (implies selective debunking), (3) Targets Justification (undermines warrant via coincidence), (11) Falsifiable (invariance would challenge coincidence). | Weak on (2) Content Discrimination (lacks sorting principle), (7) Independence (often relies on realist intuitions about coincidence), (8/9) Tracking Principle (vague; "coincidence" needs epistemic grounding), (12) Avoids Causal Contact (often implies causal contact needed). | **Inadequate:** Fails core requirements (2, 7, 8, 9, 12). |
  | **(B) Authority Debunking** | Strong on (5) Warrant Distinction (targets a specific judgmental feature), (10) Downstream Stability (explains grip/phenomenology), potentially strong on (12) Avoids Causal Contact (targets a conceptual feature). Plasticity case less damaging. | Weak on (2) Content Discrimination (debunks "authority" globally, struggles to discriminate judgments), (6) First-Order Focus (may only debunk the "categorical reason-giving" aspect, not core content), (9) Specific Principle (often lacks clear epistemic principle for *why* evolved authority-belief isn't tracking real authority). | **Partially Adequate:** Addresses plasticity & downstream issues well but fails core discrimination (2) and principled tracking failure (8/9). |
  | **(C) Plain Genealogy (No Contact)** | Simple, intuitive. Potentially strong on (11) Falsifiability. | Fatally weak on (8) Tracking Premise (assumes explanation suffices), (9) Specific Principle (absent), (4) Undermining Mechanism (unclear), massively fails (10) Overgeneralization (debunks everything), ignores (5) Capacity/Judgment distinction, violates (1) Non-Global Scope, relies on (12) Causal Contact premise. | **Inadequate:** Violates nearly all core non-negotiable requirements (1, 4, 5, 8, 9, 12). |
