  We are translating a philosophical debate about discounting into the vocabulary of reinforcement learning (RL). The key terms we have are:
     - Discounted return with factor gamma (γ)
     - Continuing vs episodic tasks
     - Average-reward and Blackwell-optimality criteria
     - γ < 1 as making value iteration a contraction (tractability)
     - Eligibility traces and truncation of credit assignment
     - Reward shaping
     - Interpretation of 1-γ as an exogenous termination hazard
     - Hyperbolic vs exponential discounting and time-inconsistency
     - Risk of ruin under multiplicative dynamics
     - Gap between surrogate training objective and deployment objective

  The philosophical debate:
    Side A (Ramsey, Parfit):
      - Pure time preference (discounting merely because an event is in the future) is ethically indefensible.
      - Ramsey decomposition: social discount rate = pure time preference + term for expected growth in per-capita consumption.
      - Parfit: the temporal location of a pain is as irrelevant as its spatial location.

    Side B (defenders of positive pure rate):
      - Positive pure rate is defensible on agent-relative or generation-relative grounds, or because of uncertainty, extinction, and ruin risk.

  We are to restate both sides as claims about:
     (a) what the discount factor (γ) in an objective function is doing, and 
     (b) what the choice of criterion (e.g., discounted, average, Blackwell) is doing.

  Then, we are to provide a residue report addressing:
     - The suspicion that most of what philosophers call "pure time preference" has no counterpart in RL vocabulary because discounting in RL is always doing one of three jobs: 
          1. regularization (for contraction),
          2. modeling termination/hazard, or 
          3. an implicit statement about the deployment objective.
     - If that suspicion is right, then why? Is it because:
          (i) the RL framework lacks the normative vocabulary (rational vs irrational) and only has target vs surrogate, tractable vs intractable? OR
          (ii) the philosophical disagreement is less substantive once instrumental discounting is accounted for?
     - Also, consider the reverse: are there concepts in RL that the philosophical debate cannot express and might need? (e.g., instrumental value of myopia for credit assignment, two-level optimization)

  We must be explicit about where the translation is faithful and where it is importing RL assumptions. We must mark claims we are least confident about and explain what could change our mind.

  Let's break down:

  Translation:

  Side A (Ramsey/Parfit):
    - They argue that γ should be 1 (no discounting) unless the discounting represents a model of hazard/termination or an expectation of growth in consumption (which in RL would be captured by the reward structure or the state transition dynamics). 
    - In the Ramsey decomposition, the social discount rate (which is 1-γ in the case of exponential discounting) is broken down. In RL terms, they would say that γ should be set to 1 and then adjust for hazard (which would be the termination probability) and for growth (which might be modeled by the reward function or the state transitions). 
    - The pure time preference term in the decomposition (if positive) is rejected. So they would reject setting γ < 1 for any reason other than to model a real hazard or to account for growth (which in RL might be done by other means).
    - They would also reject hyperbolic discounting (because it leads to time-inconsistency) and prefer exponential discounting with γ=1 (i.e., no discounting) or with γ set to model only hazard and growth.

    Restated as claims about γ:
      (a) γ should be set to 1 unless it is modeling a real termination hazard (i.e., 1-γ as a per-time-step survival probability) or unless it is adjusted to reflect expected growth (but note: in the Ramsey model, growth is in the consumption, which in RL might be part of the reward). However, the Ramsey model uses a discount rate that includes a pure rate and a growth term. But Ramsey rejects the pure rate. So in RL, they would argue that γ should be set to 1 for the pure time preference component and then adjusted downward only for hazard and growth. But note: in standard RL, we don't have a separate growth term; we have γ and the reward. So perhaps they would argue that the reward function should be designed to reflect growth and then γ set only for hazard (or set to 1 if there is no hazard).

      (b) The choice of criterion: they would prefer an undiscounted objective (γ=1) in a continuing task, but if the task has a termination hazard, then γ<1 is acceptable to model that. They might also accept the average-reward criterion (which is equivalent to γ=1 in the limit) for continuing tasks without termination. The Blackwell criterion (which optimizes for the discounted reward with a γ close to 1) might also be acceptable.

  Side B (defenders of positive pure rate):
    - They argue that γ can be set less than 1 even without a hazard or growth adjustment. Reasons:
          * Agent-relative: the agent is short-lived and only cares about its own lifetime? (This might be modeled by a termination hazard, so perhaps it falls under hazard modeling.)
          * Generation-relative: future generations are less connected to the current one? (This might be seen as a form of hazard or as a form of reduced reward for future agents, but note the RL agent is typically a long-lived entity making decisions for the future. So this might not fit well.)
          * Uncertainty: because the future is uncertain, we discount it. But in RL, uncertainty is handled by expectations and risk aversion (which might be modeled by the utility function over rewards, not by discounting). However, if the uncertainty includes the possibility of termination (ruin), then that is a hazard.
          * Extinction and ruin risk: this is a hazard, so it would be modeled by 1-γ as a per-step termination probability.

    Restated:
      (a) They would allow γ to be set less than 1 to represent:
            - Hazard (extinction, ruin) -> then γ = survival probability per step.
            - Also, they might allow γ<1 to account for other forms of uncertainty that are not captured by the state transitions (but note: in RL, state transitions already model uncertainty). 
            - They might also argue that even without hazard, γ<1 is acceptable to reflect the agent's own impatience (which is the pure time preference). But in RL, that impatience might be seen as part of the objective we are optimizing for (the deployment objective). 

      (b) They might be open to using the discounted criterion for tractability (if that is the only way to solve the problem) or to model the agent's own preferences.

  Residue Report:

  The working suspicion is that most of what philosophers call "pure time preference" has no counterpart in RL because discounting in RL is always instrumental for one of three jobs:

    1. Regularization: γ<1 makes the Bellman operator a contraction, which is necessary for convergence in value iteration and many other algorithms. Without γ<1, the infinite horizon undiscounted problem (with γ=1) might not have a bounded solution or might be computationally intractable.

    2. Modeling termination hazard: 1-γ can be interpreted as the probability that the episode terminates at each step (independently). This is a model of the environment.

    3. Deployment objective: The discounting might be part of the actual goal we care about. For example, if we are building an agent for a user who is impatient and values immediate rewards more, then we set γ<1 to match that.

  So, the pure time preference in the philosophical sense (discounting merely because an event is in the future) would only appear in RL under the third reason: if the deployment objective includes such discounting. Then, the RL agent is designed to optimize that objective, and the discounting is not a modeling artifact but the goal.

  But note: the philosophical debate is about whether we should have such a deployment objective. Ramsey and Parfit argue that we should not. Defenders of the pure rate argue that we may.

  However, in the RL framework, the objective is given. The framework does not tell us what objective to use; it tells us how to optimize an objective. Therefore, the normative question of whether we should have pure time preference in the objective is outside RL.

  Thus:

    - The RL vocabulary does not have the resources to state the normative claim (rational vs irrational) about what the objective should be. It only has the tools to optimize a given objective (and sometimes to approximate it with a surrogate for tractability).

    - The philosophical disagreement is about what the deployment objective should be. Once we have accounted for the instrumental reasons for discounting (regularization and hazard modeling), the remaining discounting in the deployment objective is what the philosophers are debating. But note: in RL, we can have a deployment objective that is undiscounted (γ=1) and then use a surrogate with γ<1 for tractability, and then correct for it (e.g., using average reward methods or by setting γ close to 1). So the philosophical debate about whether the deployment objective should have pure time preference is independent of the instrumental uses.

  Therefore, the suspicion is partly confirmed: the pure time preference that philosophers debate is only present in RL in the deployment objective. The other two uses (regularization and hazard) are not the same as pure time preference.

  But note: the hazard modeling might be seen as a form of discounting that is not pure time preference because it accounts for the possibility that the future might not happen. That is exactly what the philosophers on the anti-pure-time-preference side would accept. Similarly, the regularization use is a computational trick and not part of the normative objective.

  So, the residue of the philosophical debate in the RL framework is only about the deployment objective: should the deployment objective include discounting for pure time preference?

  But wait: how does the deployment objective come about? In RL, we design the agent for a purpose. The objective is set by the designer. The designer might be influenced by normative considerations. The RL framework itself is silent on whether pure time preference in the deployment objective is rational.

  Now, the reverse direction: are there RL concepts that the philosophical debate cannot express?

    - The two-level optimization (surrogate vs deployment objective): The philosophers discuss the social discount rate as if it were a single concept. But in RL, we might optimize a surrogate objective (with γ<1 for tractability) to approximate the deployment objective (which might have γ=1). This distinction might be missing in the philosophical debate.

    - The instrumental value of myopia for credit assignment: In RL, we use discounting (or eligibility traces) to assign credit to actions that are temporally close to the reward. This is a computational tool and not necessarily a normative claim about the value of the future. The philosophers might not have considered that discounting can be used as a tool for efficient learning without being part of the normative goal.

    - Risk of ruin under multiplicative dynamics: This is a specific risk that might be modeled by the MDP and might lead to a form of discounting (if the agent avoids actions that could lead to ruin). But the philosophical debate might not have a precise way to express the computational challenges of avoiding ruin.

  Explicitly marking where translation cheats:

    1. Philosophical notions of "ethical indefensibility" are normative and have no direct counterpart in RL. We are translating them into the setting of the deployment objective.

    2. The Ramsey decomposition is an economic model that breaks the discount rate into pure time preference and growth. In RL, we don't typically decompose γ in that way. We are interpreting the pure time preference as absent (so set γ=1) and then adjusting for hazard (which is the survival probability) and growth (which would be in the reward). But note: in the Ramsey model, the growth term is also part of the discount rate. So we are mapping the Ramsey discount rate to γ in RL, but then we are breaking γ into hazard and growth? That is a cheat because in standard RL, γ is a single scalar. We are importing the idea that γ can be decomposed, but in RL it is not.

    3. The agent-relative and generation-relative grounds for discounting: in RL, we typically model a single long-lived agent. To model generation-relative discounting, we might need a multi-agent system or a changing agent. This is not standard in RL. We are cheating by reducing it to hazard (if the agent's life is finite) or by changing the reward function for future generations (which is not discounting but a different reward function).

    4. Uncertainty: in RL, we already have stochastic state transitions. The discount factor is not typically used to model general uncertainty. We are cheating by conflating uncertainty with hazard.

    5. The philosophical debate assumes a single objective for society (or for an individual). In RL, we are designing an agent for an objective. The debate about what that objective should be is outside RL.

  Claims I am least confident about:

    - Claim: The generation-relative discounting can be modeled by a termination hazard (when the generation ends). But that might not capture the idea that the current generation cares less about the next generation even during its own lifetime. This might require a reward function that decays with time, which is discounting. So perhaps that is pure time preference in the deployment objective. I am less confident about this mapping.

      What would change my mind: If we consider an agent that makes decisions for the current generation and cares about the next generation but with less weight, then that would be discounting in the deployment objective. But if the agent is only acting during the lifetime of the current generation, then it might be modeled by a finite horizon (episodic task). But the discounting would then be over the finite horizon? Not necessarily exponential discounting. This is messy.

    - Claim: The regularization use of discounting is entirely non-normative and not part of the philosophical debate. But what if we are forced to use γ<1 for tractability and then we cannot achieve the undiscounted objective? Then the philosophers might argue that we should try to approximate the undiscounted objective as closely as possible (by setting γ close to 1). But the defender of pure time preference might argue that it's acceptable to use a lower γ because it matches their normative view. This might blur the line.

      What would change my mind: If we show that in practice, for a given computational budget, we can get a better approximation of the undiscounted objective by using γ=1 and a different algorithm (like average reward) than by using γ<1, then the regularization use is separable. But if we must use γ<1, then the surrogate objective might be the best we can do, and then the deployment objective might be unattainable. The philosophers might then debate whether the surrogate objective (with γ<1) is acceptable as a substitute.

    - Claim: The risk of ruin is entirely captured by the hazard interpretation. But ruin might be an absorbing state with zero reward, and then the discounting might be used to model the fact that once you are ruined, you get no future rewards. This is already in the MDP structure. So why do we need discounting? We don't: the value function will naturally be zero in the ruin state. Therefore, discounting for ruin risk might be redundant. We are cheating by using the hazard interpretation for something that is already in the state transitions.

      What would change my mind: If the ruin state is not terminal but simply very bad, then we might need discounting to avoid it? Not necessarily. We can model it with a negative reward and then the agent will avoid it. So the hazard interpretation is only for termination.

  Therefore, the translation of ruin risk as a hazard is valid because ruin (extinction) is terminal.

  Conclusion:

  The residue report:

    - Pure time preference (as an ethical stance) only appears in the RL framework as a design choice for the deployment objective. The other two uses of discounting (regularization and hazard) are not pure time preference and are acceptable to both sides of the debate once understood.

    - The RL framework lacks the normative vocabulary to state whether pure time preference in the deployment objective is rational or irrational. It only provides the tools to optimize an objective.

    - The philosophical debate is substantive only at the level of the deployment objective. Once we peel off the instrumental discounting (for regularization and hazard), what remains is the deployment objective, and that is where the debate lies.

    - The reverse: the philosophical debate does not have the concept of a surrogate objective (used for tractability) that is distinct from the deployment objective. This might be a useful distinction for philosophers: they might argue that we should use a surrogate with γ<1 to approximate an undiscounted deployment objective, but they might not have considered that possibility.

    - Also, the philosophical debate does not consider the instrumental role of discounting in credit assignment (eligibility traces) and reward shaping. These are RL techniques that use discounting for learning efficiency, not for the normative objective.

