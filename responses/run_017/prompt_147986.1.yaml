  hi — novelist here, not a philosopher, so please be patient with me if I get the terms wrong. You're a working poet who has also read seriously in philosophy of physics, and I need you to take both halves of that seriously; think carefully, and don't draft line one until you've done the brainstorming I ask for at the bottom.

  The setup: my novel is set mostly in Princeton in the early 1950s. One of my characters — Iris, a young Austrian émigré hired to check numerical tables for one of the Institute mathematicians (not Gödel himself; a fictional colleague) — gets quietly obsessed with the rotating solution from 1949: homogeneous dust that swirls, a negative cosmological constant tuned to hold it up, and light cones tipped far enough over that a long enough rocket journey in one direction lands you back in your own past, even though every stage of the trip is locally forward. She isn't a physicist. Her father died the year before she emigrated, and the thought that his death is not gone but simply elsewhere — that "is past" might be like "is there" — is doing something to her she can't name. She leaves a poem in a drawer. I need that poem.

  Form: a proper villanelle — five tercets and a closing quatrain, two refrains on the standard repeating pattern, roughly iambic, something a person could actually say out loud. Here's the constraint I care most about: the two refrains should be the same sentence running in opposite temporal directions (think: one built out of "will have been," the other out of "has been and will be"), so that when they finally meet in the last two lines the reader sees they were never two claims at all — they were one journey described from its two ends. The returning of the refrains is the closed loop; don't let the form be decoration.

  Three things the poem has to get right in its bones, not by name-dropping: (1) this is a modal argument — the payoff isn't that the actual universe rotates, it's that a universe with no global now is a legitimate solution of the field equations, so if physical possibility is whatever the equations permit, then a world without an objective present is physically possible; (2) the consequence isn't "time travel, cool" — it's that if you can come back to your own past, then the events you call past aren't non-existent, they're just not now, and the gap between "is" and "is past" starts to look like the gap between "here" and "there"; (3) the conclusion drawn on the idealist side of this isn't that the solution is absurd and must be rejected, it's that our experience of time passing is no evidence about how reality is — that becoming is appearance, in roughly the Parmenidean/Kantian neighborhood. And hold the human cost: someone can accept all of that and still not be able to stop talking to a dead man. Don't resolve it into either mysticism or a shrug. I'd rather the poem wince than win.

  Brainstorming first, please, and briefly: four candidate refrain pairs, each with one line on why it would or wouldn't survive nineteen returns. Then write the poem. Then, after it, no prose outside this JSON object — give me:

  - "title": string
  - "refrains": object with "a1" and "a2" (the two lines, each with a parenthetical note of which end of the loop it stands for)
  - "moves": array of exactly 3 strings — the three philosophical points above restated the way a philosopher of physics would state them, so I can check the poem against them
  - "form_does_work": string, 2–3 sentences on how the repeating pattern and the final quatrain carry the argument rather than just rhyme it
  - "where_the_form_won": string — the one place the villanelle made you fudge something, and what the honest, unmetrical line would say
  - "accuracy_check": string — the claim in the poem a philosopher of physics would most likely push back on, and your best defense of it
  - "page_fit": string — whether this could sit on the page of a novel with no explanation, and if not, the single line of framing that would fix it

  Definately no bibliography or citations — I'll handle any acknowledgments myself, and honestly a novel page doesn't want footnotes anyway.
