answer: |-
  Here's your complete exam package, designed to push students beyond rote comparisons and into conceptual tensions. I've flagged where alternative arguments can score well.

  ---

  **Exam Question: Functions Beyond the Basics (20 marks total)**

  *Read the following case carefully:*

  > The sand-ghost rodent possesses a distinctive bony ridge above each eye. Paleontological evidence indicates this ridge was shaped by natural selection approximately 500,000 years ago to deflect strikes from the now-extinct razor-clawed hawk (last observed 8,000 years ago). Currently, the ridge performs a different beneficial role: its shape channels minute groundwater droplets towards the corner of the eye, preventing corneal drying and thereby improving vision and survival prospects. However, genetic analysis shows the rodent population has been small and genetically isolated for roughly 200 generations. Population genetics models suggest the reproductive advantage conferred by this moisture-channeling is so slight (estimated s < 0.001) that it is highly vulnerable to being overwhelmed by genetic drift. Two distinct loss-of-function mutations for the ridge have appeared and subsequently disappeared from the population during this isolation period, but stochastic modeling indicates their disappearance is plausibly due to random drift, not selection.
  >
  > *Scenario A:* Analyze the function(s) of the bony ridge in the *natural sand-ghost rodent* described above, according to the etiological account and the causal-role account of function. Pay particular attention to:
  >     (i) How each account handles the *timing* and *effectiveness* of past and potential selection pressures relevant to the ridge's existence and current effect.
  >     (ii) Whether the ridge's current moisture-channeling effect constitutes a *function* under either account, given the role of drift.
  >     (iii) The relevance (if any) of distinguishing between the ridge's 'origin-selected' role (deflecting strikes) and a potential 'maintenance-selected' role (channeling moisture) that hasn't demonstrably shaped the trait.
  >
  > *Scenario B:* Consider a genetically engineered organism, the *bio-synth rodent*, which is identical to the sand-ghost in all relevant physiological respects *except* that it has no evolutionary history involving the bony ridge. The ridge was synthetically engineered *de novo* based on scans of the sand-ghost and perfectly performs the moisture-channeling role. Does the bio-synth rodent's ridge have a function? Explain how the etiological and causal-role accounts would answer, and discuss what this reveals about the fundamental question(s) each account is designed to answer.
  >
  > *General:* Both accounts claim to explain how we can identify *malfunction* (e.g., a ridge that doesn't channel moisture). Briefly discuss how each account grounds the normativity required for malfunction claims in Scenarios A and B. Does one account face a particular challenge in establishing this norm without reference to history?

  **Time Allowed:** 60 Minutes

  ---

  **Model Answer (Approx. 700 words)**

  **Scenario A: Natural Sand-Ghost Rodent**

  *   **Etiological Account:** This account defines a trait's function by its *selected effects history*. The ridge's function is *deflecting predator strikes*, as that is the effect for which it was originally selected 500,000 years ago. The moisture-channeling effect, while currently beneficial, is *not* a function under this view.
      *   *(i) Timing/Effectiveness:* The etiological account requires that the trait was *shaped* by selection for an effect. The original selection episode suffices to establish the function, even if the selective pressure is now absent (as with the extinct hawk). Crucially, for the *new* moisture-channeling effect to become a function, there must be *recent* selection *for that specific effect*. The evidence suggests this hasn't occurred: the advantage is too small relative to drift, and mutant loss is consistent with drift. There is no identifiable selection episode for moisture-channeling. It doesn't require *ongoing* selection for the *original* function, but for a *new* function to be assigned, a distinct selection episode for *that effect* is necessary. It does *not* collapse into the causal-role view because it insists on a historical causal explanation for the trait's presence (why it exists), which the moisture effect lacks.
      *   *(ii) Moisture-Channeling as Function?* **No.** It is merely a beneficial *side-effect* or *exaptation* that has not (yet) been selected for. Its persistence is likely due to lack of *strong counterselection* plus the original structural constraint, not selection *for* it.
      *   *(iii) Origin vs. Maintenance Selection:* The etiological view readily identifies the *origin-selected* function (deflection). The concept of a 'maintenance-selected' function for moisture-channeling is **invalid under strict etiology here** because there's no evidence selection *for moisture-channeling* has maintained the ridge against drift or mutation pressure. The ridge is maintained by *phylogenetic inertia* and *lack of disadvantage*, not *selection for* its current beneficial effect. Calling this "vestigial momentum" adds nothing essential beyond established concepts like vestigiality and exaptation lacking secondary adaptation. The function remains tied solely to the origin.

  *   **Causal-Role (CR) Account:** This account defines function by the trait's *current causal contribution* to the containing system's (the organism's) capacity to persist or perform relevant activities.
      *   *(i) Timing/Effectiveness:* History is irrelevant. The CR account focuses solely on the ridge's *current* role within the rodent's physiology *now*. The effectiveness of past or potential future selection doesn't factor into the *ascription* of the function; only the current causal contribution matters.
      *   *(ii) Moisture-Channeling as Function?* **Yes.** The ridge *currently* contributes causally to maintaining corneal moisture, which contributes to vision and thereby the organism's overall survival and activity. This current contribution is sufficient to assign the function "moisture-channeling," regardless of its history or why it persists.
      *   *(iii) Origin vs. Maintenance Selection:* This distinction is largely **irrelevant to the CR account**. It cares about what the trait does *now*. The original defensive role is a historical fact, but not part of the current functional analysis. The current beneficial effect is the function.

  **Scenario B: Bio-Synth Rodent**

  *   **Etiological Account:** The ridge has **no function**. It lacks any evolutionary history. It was not selected for *any* effect; it was intentionally designed and inserted. Its presence is explained by engineering, not natural selection. Therefore, it has no selected-effect function, even though it contributes beneficially.
  *   **Causal-Role Account:** The ridge **has a function**. It currently contributes causally to the bio-synth rodent's physiology by channeling moisture, aiding vision and survival, just like in the natural rodent. Its history of creation is irrelevant to its current causal role.
  *   **Revealing Fundamental Questions:** This stark disagreement highlights that the two accounts answer fundamentally different questions:
      *   Etiology: "Why is this trait *present* (i.e., why does it exist) in this population/organism?" (Answer: Selection history).
      *   Causal-Role: "What does this trait *do* within the current system that contributes to its organization/activity?" (Answer: Current causal contribution).
      The bio-synth case shows these questions can come apart. Pluralism acknowledges they are different, valid inquiries, not necessarily competing answers to the *same* question. Whether this is a "real resolution" depends on whether one believes function ascriptions must unify these questions or if distinct contexts warrant distinct ascriptions.

  **Malfunction and Normativity**

  *   **Etiological Account:** Malfunction is straightforward: a trait malfunctions if it fails to perform the effect for which it was selected. For the natural rodent's ridge, malfunction would mean failing to deflect a hawk strike (even though hawks are extinct) *or* – crucially – if moisture-channeling *had* become a selected function, failing at *that*. Since moisture-channeling isn't a selected effect, a ridge failing to channel moisture is *not* a malfunction under etiology, just unlucky or non-functional. The norm is set by the selected effect history. For the bio-synth, no function exists, so no malfunction exists – only engineered success or failure.
  *   **Causal-Role Account:** Malfunction occurs when the trait fails to perform its *typical* causal role within the *current* system. For both rodents, a ridge that doesn't channel moisture malfunctions because it fails in its current contributory role. **This is where the challenge arises:** What grounds the "typical" role as the *norm*? The CR account often relies implicitly on statistical normality (what most instances do) or the role in a canonical description of the system's organization. Critics (like your friend) argue this smuggles in a normativity it can't justify solely from current causation – why *should* it do what it typically does? The norm seems arbitrary without reference to design (intentional or natural historical) explaining *why* that role is the expected or proper one. Etiology grounds the norm in historical success (selection); CR struggles to ground it without circularity or implicit historical/design reference.

  ---

  **Marking Scheme (20 marks total)**

  *   **Must-Hit Moves & Marks:**
      *   **(A.i) Etiological Timing (3 marks):** Correctly identifies deflection as the sole function due to origin selection (1). Explains origin suffices, new function requires selection *for that effect* (1). Explicitly states no recent selection for moisture, so no new function, and rejects collapse into CR (1). *Common Error (CE):* Claiming etiology requires ongoing selection for the *original* function; conflating persistence due to lack of disadvantage with selection *for* the new effect.
      *   **(A.i) CR Timing (1 mark):** Correctly states CR ignores history, focuses solely on current contribution. *CE:* Suggesting CR cares about why the trait persists.
      *   **(A.ii) Etiological Moisture (1 mark):** States moisture-channeling is NOT a function (beneficial side-effect/exaptation). *CE:* Calling it a function under etiology.
      *   **(A.ii) CR Moisture (1 mark):** States moisture-channeling IS a function. *CE:* Denying it due to history.
      *   **(A.iii) Origin/Maintenance Distinction (3 marks):** Clearly explains why etiology rejects 'maintenance-selected' function here (no evidence of selection *for* moisture against drift) (2). Explains why the distinction is irrelevant to CR (1). *CE:* Uncritically accepting "vestigial momentum" as a valid functional category under etiology; claiming CR cares about the distinction. **Taking a Side:** The model rejects "vestigial momentum" as a necessary new category. A **strong alternative (full marks possible)** must: a) Define "maintenance-selection" rigorously (e.g., *any* selection preventing loss, even if the trait wasn't *shaped* for the effect), b) Argue plausibly that *stabilizing selection* (even weak) *for the structure itself* due to *any* beneficial effect (like moisture) could count, despite the drift evidence, c) Distinguish this clearly from mere exaptation + secondary adaptation (which requires shaping). It's an uphill battle given the case details.
      *   **(B) Etiological Bio-Synth (1 mark):** States no function (no history). *CE:* Attributing function due to benefit.
      *   **(B) CR Bio-Synth (1 mark):** States has function (current contribution). *CE:* Denying function due to artificial origin.
      *   **(B) Revealing Questions (3 marks):** Accurately states etiology answers "Why present?" (history) (1). Accurately states CR answers "What does it do now?" (current contribution) (1). Discusses pluralism as recognizing distinct questions, not necessarily a unified answer (1). *CE:* Claiming pluralism is just indecision; failing to specify the distinct core questions.
      *   **Malfunction General (4 marks):** Correctly applies etiology: Malfunction = failure of selected effect (deflection for natural; N/A for bio-synth) (1). Correctly applies CR: Malfunction = failure of typical current contribution (moisture for both) (1). Identifies the CR challenge: Grounding the "typical" role as normative without history/design (1). Explains the etiological norm is grounded in selection history (1). *CE:* Claiming CR has no problem with normativity; claiming etiology defines malfunction by current benefit.
      *   **Clarity & Structure (2 marks):** Well-organized, precise language, addresses all parts. *CE:* Rambling, missing key sub-questions.

  **Honest Notes:**

  1.  **"Vestigial Momentum":** This isn't standard terminology. It overlaps significantly with discussions of vestigial traits, exaptations lacking secondary adaptation, and debates about "propensity" or "forward-looking" accounts of function (which both etiological and CR proponents usually reject). Your friend's distinction attempts to carve a niche for a trait maintained *only* against loss by a new benefit *without* that benefit shaping the trait. The etiological counter is that if the benefit isn't causally responsible for the trait's presence (due to drift), it doesn't count as a function. The novelty is subtle and arguably unnecessary.
  2.  **Taking Sides:** The model answer explicitly rejects "vestigial momentum" as a functional category under etiology in this case, aligning with standard etiological views. It accepts pluralism as descriptive of different questions. The marking scheme allows full credit for a robust defense of "maintenance-selection" as functional under a modified etiological view, provided it meets the criteria above. The malfunction challenge for CR is presented as a genuine criticism (reflecting your friend's point).
  3.  **The Crux:** The answer centers on etiology requiring a *specific historical causal explanation* (selection for effect E) for assigning function E, while CR assigns function based on *current systemic contribution* regardless of origin. The bio-synth case starkly illustrates this. The drift scenario in A highlights that mere current benefit + persistence isn't enough for etiology.

  This question forces students to grapple with the core commitments of each theory and their consequences in complex, temporally extended scenarios. Good luck grading the results – expect passionate arguments!
