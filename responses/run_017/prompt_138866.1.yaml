answer: |-
  ### Applied Ethics Seminar Exercise: "Wetland Vector Decision"

  **Brainstorm of Core Philosophical Moves:**  
  1. **Radical uncertainty as default condition:** Participants must commit to action without knowing if insects suffer, exposing how ethical frameworks collapse without this certainty.  
  2. **Temporal displacement of harm:** Larvicide vs. adulticide forces comparison between preventing existence vs. terminating life—with ecological rebound revealing whether "replacement" negates harm.  
  3. **Institutional performativity:** Roles create tension between public accountability (e.g., "being seen to act") and moral caution, testing whether ethics can survive bureaucratic incentives.

  ---

  ### EXERCISE DESIGN: "THE MARSHGATE EMERGENCY"  

  **Materials:**  
  - 16 role cards (laminated cardstock, £10)  
  - 1 sealed A4 envelope labelled "CLASSIFIED: Post-Decision Scientific Briefing" (£1)  
  - Whiteboard columns: "Options", "Pros/Cons", "Vote"  
  - Phone speaker for timer alerts  
  - £9 for charity donation props (see "Consequence")  

  **Roles & Private Briefs (Abridged):**  
  *(All roles: District Pest Control Board member; objective: Reach majority decision in 40 mins)*  

  1. **Mayor**  
     - *Private Objective:* Ensure public sees immediate action before election.  
     - *Payoff:* If option (i) or (ii) chosen, gain "Public Confidence" token (symbolic; no mechanical effect).  

  2. **Treasurer**  
     - *Constraint:* May ONLY cite costs, efficiency stats, or budget limits. No ethical language.  
     - *Private Payoff:* If option (iii) rejected, gain "Fiscal Prudence" token.  

  3. **Health Officer**  
     - *Private Objective:* Reduce human hospitalisations within 3 months.  
     - *Payoff:* If (i) or (ii) chosen, note "Lives Saved" on card.  

  4. **Environmental Officer**  
     - *Private Objective:* Avoid mass non-target insect deaths.  
     - *Payoff:* If (iii) chosen, gain "Ecological Stewardship" token. If (i) chosen, note "Collateral Guilt".  

  5. **Ecologist**  
     - *Secret Knowledge:* "Mosquitoes rebound to 95% carrying capacity in <6 weeks after mass death events." *Reveal only if asked directly about population recovery.*  

  6. **12 Others:** Farmers (x2), Tourism Rep, Ethics Consultant (allowed only procedural questions), etc. *All have mixed motives (e.g., Farmer: "Avoid crop damage but protect bees").*  

  ---

  ### TIMELINE (90 MINS TOTAL)  
  **0-5 mins:** Distribute roles randomly. Instructions: *"You’re the Marshgate Pest Board. Disease cases are rising. Choose 1 option in 40 mins. No formal chair—self-manage. I observe silently."* Write options on board:  
  > (i) AERIAL SPRAY (kill adults now)  
  > (ii) LARVICIDE TREATMENT (prevent next generation)  
  > (iii) STERILE MALES (slow suppression, costly)  

  **5-20 mins:** *Private Prep.* Participants read role cards, note objectives.  

  **20-60 mins:** *Open Debate.* Facilitator:  
  - Starts timer; intervenes only to enforce Treasurer’s speech rules.  
  - If debate stalls: "Reminder: District expects your recommendation by 3 PM."  
  - Note moments when uncertainty/rebound are ignored.  

  **60-65 mins:** *Vote.* Secret ballot. Tally on board.  

  **65-70 mins:** *Open Sealed Envelope.* Read aloud:  
  > *"DEFINITIVE STUDY: Marshgate mosquitoes exhibit nociception but lack neural correlates of conscious suffering. 83% confidence."*  

  **70-90 mins:** *Debrief.* No theory terms. Map moments to philosophy:  
  - *Rebound:* "When Ecologist mentioned repopulation, did that change how you saw killing vs. preventing life?"  
  - *Envelope:* "How did voting *without* this feel? Would earlier knowledge have altered arguments?"  
  - *Treasurer’s constraint:* "What happened when only costs were allowed in the room?"  
  - *Mayor’s token:* "Did ‘being seen to act’ distort ethical weight?"  
  - *Vegan/Beekeeper/Engineer roles:* "Did personal views align with your role’s incentives? Where did they clash?"  

  **Consequence for Loss:** Losing voters donate £1 to BugLife (pollinator charity) next week *and* must argue *for* the winning policy in a 5-min structured debate next seminar. Winning side designs their rebuttal questions.  

  ---

  ### PREDICTABLE FAILURES & RECOVERY  
  1. **Treasurer breaks character:** *Likely.* Recovery: Hand them a red card reading "IRRELEVANT: Restate Quantitatively".  
  2. **Vegan dominates debate:** Assign them Treasurer role (constrained speech). If unassigned, use: "Role reminder: Your position is Health Officer—focus on human impacts."  
  3. **Rebound fact never surfaces:** If unmentioned by 50 mins, ask Ecologist: "How might Option (i) affect *long-term* insect numbers?"  

  **Unreproducible Philosophical Element:**  
  The exercise *cannot* simulate the **non-identity problem** (harm to non-existent beings). In debrief, state: "Option (ii) eliminates future insects who’d never exist. Is that ‘harm’? If not, does that make it ethically safer than (i)?"  

  **Why This Works:**  
  - The envelope creates *retroactive accountability*—students immediately interrogate their own reasoning.  
  - Role constraints force novel arguments (e.g., Treasurer must weaponise cost-benefit neutrally).  
  - Charity stake & mandatory advocacy make dissent materially consequential.  
  - Rebound fact weaponises the engineer’s dismissal: If deaths are "replaced", does killing matter?  

  ---  
  *Final Note:* Use the vegan’s frustration ("But insects *do* suffer!") in debrief: "What did we *do* when we couldn’t assume that?" The corridor arguments write themselves.
