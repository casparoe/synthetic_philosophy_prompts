prompt: |-
  I'm supposed to give the closing remarks at our citizens' assembly handover next Thursday and I've got five minutes and I'm making a mess of it. Bit of background so you know what you're walking into.

  Our city pulled 33 names out of a lottery from the electoral roll to work on the twenty-year housing and transport plan; 24 of us were left by the end, 14 months later, and we handed in a report last month. Nobody applied, nobody campaigned, we just got letters. I was one of them and I've been reading about this stuff on my own ever since — no academic background, just too much time on it — and the other members asked me to speak, which was probably a mistake.

  The handover session is where we give the report to the council. The room will be: the rest of us plus partners and a couple of kids; about nine councillors, roughly half of whom voted against setting the assembly up in the first place; two people from universities who study this and will hear every wrong word; and a local reporter. Roughly five minutes, out loud, no slides.

  Here's why it's hard. Three things I keep going in circles on, and one practical mess.

  First, I don't think I can thank people for having "stepped up" or "put themselves forward", because nobody put themselves forward — that's the entire point. But it's not clean either: nine people dropped out over the year, and the ones who stayed were visibly a type (retired, or no kids at home, or self-employed, or already half-political). I've started calling that the second draw: the random draw picks the sample, and then a second, quieter draw happens that nobody authorised, and what's left at the end looks nothing like the city. I really don't want a speech that ends up praising the second draw by accident.

  Second, I can't say "you're still ordinary people, exactly like the people you represent", because we aren't, not any more — a year of expert witnesses and a budget to move stuff around changes you, and three of our group are now talking about running for council. But I also can't say "you've become experts and you've earned the right to be heard", because that is exactly the thing the career politicians in the room say about themselves ("governance needs professionals"), and it would hand them the whole argument. I've been calling this the polished mirror: we were supposed to be a mirror of the city, but a mirror that's been sat in a committee room for a year gets polished, and after a while it shows the room something flattering.

  Third, I can't say "on behalf of the city, thank you" — I was drawn, not elected, I'm not authorised, and we didn't agree anyway (two of us filed a minority note against one of the recommendations).

  Which brings me to the mess. One of our recommendations is a two-term cap for councillors. Same evening, in the same room, they're doing a small presentation to a councillor who's retiring after 28 years — he was actually decent to us, he answered questions straight, and he is exactly what that recommendation is about. So I have to hand over a document that insults half the room while being gracious about a man whose career the document says shouldn't be possible. I've got an idea I've been using on this that I quite like: the handover test. Whatever someone in a job knows that can't be written down or passed along to whoever comes after them isn't the institution's knowledge, it's theirs, and it leaves the building with them. A lot of what gets called "experience" fails that test, and some of it definately passes. If the tribute to him could turn on that, I'd like it to — but only if it can be said in plain words to people who've never thought about it once.

  Can you write me the five minutes? It needs to land for my fellow members, who mostly need to be told the year mattered, and for the councillors, who mostly need to be told they aren't being abolished; it shouldn't turn into a lecture on democratic theory; and it shouldn't contain anything I'd have to walk back in the pub afterwards with people who were there. Oh — and the report is probably going to be shelved by the council, everyone knows it, and I won't pretend otherwise, but I also can't send 24 people home feeling like they did a year of unpaid work for nothing. Some of them want us to keep going as a permament standing assembly; I think that's the career politician problem in a different hat and I'd rather the speech didn't invite it.

  If one of my three ideas — the second draw, the polished mirror, the handover test — won't actually carry the weight I'm putting on it, say so and tell me what to use instead.
reasoning: |-
  Okay, let me unpack this user's request. They need closing remarks for a citizens' assembly handover that navigates multiple landmines: accidental elitism, political tensions, and the irony of honoring a long-serving councillor while recommending term limits. 

  First, the core tensions jump out:
  - The "second draw" problem: praising participation risks validating the demographic skew of who stayed
  - The "polished mirror" dilemma: claiming expertise plays into politicians' hands, but denying growth insults members
  - The representation paradox: they can't speak "for the city" yet must give the report meaning
  - That brutal overlap where the term-limit proposal clashes with honoring a 28-year veteran

  The user's metaphors are sharp but risky for a speech. "Second draw" might sound like criticism of dropouts. "Polished mirror" could alienate politicians. Only "handover test" feels workable if grounded in the retiring councillor's concrete virtues.

  Hmm... practical constraints matter too:
  - Must acknowledge the report's likely fate without demoralizing
  - Should subtly discourage permanent assembly dreams
  - Needs to pass the "pub test" - no academic jargon or false claims

  Key insights emerging:
  The tone must be humble but not self-deprecating. Can frame their transformation as temporary civic duty, not permanent expertise. For the councillor tribute, pivot to how his conduct embodies transferable values rather than tenure. The report's value is in its existence as proof of concept, not policy adoption.

  Biggest challenge is making term limits not feel personal. Maybe position it as systemic rather than individual critique. And emphasize that institutional memory lives in documented processes, not just long-serving people.

  For structure: open with context, honor the work neutrally, resolve tensions through the retiring councillor example, then end on collective pride. Avoid all three metaphors explicitly - they're better as thinking tools than speech lines.

  Most importantly: the speech must make members feel seen while giving politicians an off-ramp. Not "you must implement this" but "this is what's possible when citizens engage."
answer: |-
  Here’s a draft that navigates your constraints while honoring the truth of the experience. It’s structured for clarity, avoids your pitfalls, and lands your key ideas subtly. **Time: ~4m 45s** when delivered at a moderate pace.

  ---

  **(Start with warm eye contact across the room)**

  "Good evening. My name is [Your Name]. One of the twenty-four names pulled from the electoral roll lottery fourteen months ago to serve on this Citizens’ Assembly. None of us applied. None campaigned. We just got a letter. And here we are – handing over a report on housing and transport for our city’s next twenty years.

  **(Address the Assembly Members Directly)**

  To my fellow members: Look around at each other. We started as thirty-three strangers. We became twenty-four who saw it through. We gave up evenings, weekends, and headspace. We listened to experts, debated fiercely, and wrestled with impossible trade-offs. We didn’t become politicians or planners. But we *did* become something else: **citizens who cared enough to show up, learn, and try.** That matters. This report is proof that ordinary people, given the time and access, can grapple with complex futures. *That’s* the work we did. Thank you, truly, for your commitment.

  **(Acknowledge the Transition - The 'Polished Mirror' Idea, Subtly)**

  But let’s be clear: The people handing over this report tonight are *not* the same people who got that letter fourteen months ago. A year steeped in evidence, debate, and responsibility changes you. We were meant to be a snapshot of the city. Living that snapshot for a year under a microscope? It polishes you, whether you meant it or not. We gained insights, yes. But what we represent most powerfully now isn’t just demographics – **it’s the *process*.** It’s proof that this kind of deep, representative deliberation *can* happen.

  **(Address the Council & The 'Handover Test' - Key Moment)**

  Councillors, this report is yours now. We know its fate is uncertain. That’s politics. But its *existence* is significant. It wasn’t crafted by lobbyists or careerists. It was forged by neighbours, shopkeepers, carers – people who live here, tasked only with thinking about the city’s long-term good. We ask you to engage with it seriously, not as a blueprint you must follow, but as **substantive evidence of what informed public deliberation looks like.**

  **(The Retiring Councillor & 'Handover Test' Application)**

  This brings me to Councillor [Retiring Councillor's Name]. We’re honouring him tonight for his remarkable 28 years of service. And rightly so. He engaged with this Assembly directly, answering our questions honestly – a mark of respect we valued. His dedication is undeniable.

  **(Pivot to the Principle, Not the Person)**

  Councillor [Name]’s tenure also highlights something vital about institutions: **What makes them resilient isn't just individual longevity, but how well knowledge and wisdom are captured and passed on.** True ‘experience’ isn’t just time served; it’s the kind that *can* be shared, documented, and made accessible to those who come next – so the institution itself grows stronger, not just reliant on a few long-serving individuals. That’s a principle we believe in – ensuring fresh perspectives regularly renew our institutions, while valuing the wisdom that *can* be effectively handed over. Our recommendation on term limits stems from this belief in institutional resilience and renewal, not from any lack of respect for individual service. Thank you, Councillor [Name], for demonstrating that respect through your engagement with us.

  **(The 'Second Draw' & Representation - Acknowledged, Not Dwelt On)**

  We also acknowledge reality. Nine members couldn’t stay the course. Life happens. That left twenty-four of us – a group shaped by circumstance as much as the original lottery. We don’t perfectly mirror the city anymore. But the *process* we lived – the access to information, the structured debate – that *should* be something any representative group can experience. The value is in the model.

  **(Closing - Purpose & Pride)**

  So, what are we handing over?
  1.  **A Report:** With specific ideas, born of deep deliberation.
  2.  **Proof of Concept:** That ordinary citizens, given support, *can* meaningfully engage with complex long-term planning.
  3.  **A Challenge:** To value not just *what* is decided, but *how* it’s decided – with genuine public depth and deliberation.

  For us members, this ends tonight. We go back to our ordinary lives, perhaps a little less ordinary after this year. We leave knowing we did serious work for our city. **Not because we were experts, but because we were asked, and we showed up.** That’s worth celebrating. Thank you to everyone who supported this Assembly. The work – our work – is done. The report is yours."

  **(Nod, hold up the report briefly if appropriate, step back)**

  ---

  **Why this works & How it answers your concerns:**

  1.  **"Stepping Up" / "Second Draw":** Solved by focusing on the *effort* ("cared enough to show up, learn, and try") and the *process*, not the representativeness of the final group. Acknowledges the dropout ("Nine members couldn’t stay... Life happens") and the resulting skew *without* praising the skewed group itself. The key phrase: **"We don’t perfectly mirror the city anymore. But the *process* we lived... that *should* be something any representative group can experience."**
  2.  **"Ordinary People" vs. "Experts" / "Polished Mirror":** Explicitly states they are *not* the same people ("polishes you") and *not* experts ("Not because we were experts..."). Positions their value in the **unique *process* they undertook** ("proof of concept," "informed public deliberation"). Avoids claiming expertise or elected legitimacy. The core message: **Their value is in demonstrating the process, not claiming special authority.**
  3.  **"On Behalf of the City":** Never claimed. They speak as participants who completed the task they were given ("We were asked, and we showed up"). The report is presented as the output of the *process*, not the voice of the city.
  4.  **The Retiring Councillor & Term Limits ("Handover Test"):** This is the masterstroke integration. By praising his *conduct* (honesty, engagement) and linking the tribute directly to the **principle of institutional knowledge transfer** ("True ‘experience’... is the kind that *can* be shared..."), you:
      *   Honor him sincerely for specific, relevant actions.
      *   Explain the *principle* behind term limits (renewal, resilience, knowledge sharing) in plain language ("handover test" idea made concrete).
      *   Decouple the principle from the person ("stems from this belief... not from any lack of respect").
      *   Makes the recommendation feel systemic, not personal.
  5.  **Report Being Shelved:** Addressed head-on but neutrally ("We know its fate is uncertain. That’s politics."). The value is placed firmly on the **existence of the report as proof of the process**, not its adoption.
  6.  **Members Feeling Valued:** Strong focus on their effort, the significance of the process, and the pride in completing the task ("serious work," "worth celebrating," "we showed up").
  7.  **Discouraging Permanent Assembly:** Implied by the definitive closing: "For us members, this ends tonight... We go back... The work – our work – is done." Focuses on *this specific task* being complete.
  8.  **Pub Test:** Uses plain language, avoids academic theory, doesn't claim false authority, acknowledges realities (dropouts, skew, report likely shelved), and is honest about their transformation without arrogance. You wouldn't wince saying any of this later.
  9.  **Metaphors:** You were right to be cautious. Explicitly using "second draw," "polished mirror," or "handover test" *would* likely sound academic or critical in a short speech. This draft *embodies* the *ideas* behind them without using the terms:
      *   "Second Draw" => Acknowledges dropout & skew factually, focuses value on the *process*.
      *   "Polished Mirror" => Explicitly states the change ("not the same people," "polishes you"), denies expertise, values the process.
      *   "Handover Test" => Explains the *principle* of transferable knowledge in the tribute to the retiring councillor.

  **Delivery Tips:**

  *   **Practice:** Time yourself. Aim for clarity and conviction, not speed.
  *   **Eye Contact:** Crucial. Connect with members, councillors, the retiring councillor during his part, and the wider room.
  *   **Pacing:** Pause slightly after key points ("That matters." / "The report is yours now." / "We ask you...").
  *   **Tone:** Grounded, respectful, proud but not arrogant, acknowledging reality without cynicism.
  *   **The Report:** Hold it up meaningfully when you say "this report is yours now" and at the very end.

  This speech honors the work, navigates the political minefield, respects the retiring councillor while upholding the principle behind the term limit recommendation, and sends everyone home feeling the effort had meaning, all while staying true to the unique, slightly messy reality of a citizens' assembly. Good luck!
