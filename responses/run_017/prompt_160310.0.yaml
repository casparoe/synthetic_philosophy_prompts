  ### **What Could Go Wrong & Fixes**
  1. **Color phi fails**:  
     - **Prevention**: Test projection timing pre-session; have phone-based demos ready.  
     - **Fix**: Use the partner fallback (shoulders/taps). It’s less elegant but works.  

  2. **Dennett experts derail early**:  
     - **Prevention**: Brief Control Room separately; avoid loaded terms.  
     - **Fix**: *"We’ll discuss that later—for now, play along to help others."*  

  3. **Vision scientists hijack discussion**:  
     - **Fix**: *"That’s a layer of *how*, but today’s about *when*—let’s table that for post-session."*  

  4. **Participant insists on introspection**:  
     - **Fix**: Use the simulation: *"Could the Audience introspect the revision? No. You only experience the output."*  

  5. **Teams argue over bets**:  
     - **Fix**: Focus on aggregate scores ("Most bets failed") to depersonalize.  

  ---

  ### **What the Activity Achieves (and Doesn’t)**
  - **Achieves**:  
    - A felt grasp of first-person indeterminacy (they *lived* the bet failure).  
    - Skepticism toward eyewitness timing and brain-scan claims.  
  - **Doesn’t Achieve**:  
    - The existential dread of "no fact of the matter." (This requires explicit debrief statements.)  
  - **Why It Works**: The simulation makes the abstract concrete. Participants *feel* the frustration of indeterminacy before labeling it.  

  This plan respects your constraints, embeds stakes via betting, and forces a collision with the puzzle. It leaves room for your expertise in the debrief while making the philosophy emerge from experience. Run it as is, and adjust timings based on group engagement.
