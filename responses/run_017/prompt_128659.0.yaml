answer: |-
  1. "As a decision theorist, I contend that risk-weighted utility is merely a reparameterization of expected utility with transformed probabilities or state-dependent utilities, so your model doesn't offer a true generalization—it's just Harsanyi in disguise, and your aggregation theorem collapses into his."  
  Concede that REU can be reduced to EU under specific transformations, but rebut that REU is empirically distinct due to violations of independence, demonstrated by preference reversals in Allais-style paradoxes, and the theorem holds uniquely under REU's axioms; the soft point is that this relies on accepting non-expected utility as a valid framework, which some decision theorists reject.

  2. "Your Common Risk condition smuggles in interpersonal comparability by assuming identical risk functions, but welfare economics requires only cardinal unit comparability of utilities—this extra demand undermines your claim of generalizing Harsanyi, as it imposes an ad hoc restriction absent in the original theorem."  
  Concede that Common Risk introduces a new comparability type, but argue it is less conventional than utility normalization because risk functions map objective probabilities and are uniquely pinned by preferences; the soft point is that this assumes risk attitudes are directly comparable, which may be contested if risk functions are seen as arbitrary constructs.

  3. "From a sufficientarian view, your ex ante aggregation perpetuates Harsanyi's error by ignoring post-resolution fairness—if a gamble leaves some destitute, how does Pareto indifference address their claim, and why prioritize individual risk attitudes over preventing actual deprivation?"  
  Concede that ex ante Pareto cannot guarantee ex post sufficiency, but contend that sufficientarian concerns can be embedded in individual utilities (e.g., steep disutility below thresholds), and the theorem aggregates given preferences; the soft point is that this doesn't resolve deeper normative conflicts about ex ante versus ex post equity.

  4. "Like Harsanyi, your weights are underdetermined—without a veil of ignorance or other device, we cannot fix the social weights, so your theorem is toothless for policy and fails to advance practical welfare economics."  
  Concede that weight indeterminacy persists, but stress that the novelty is the Inheritance Lemma's constraint on social risk attitudes, not the weights; the soft point is that this leaves the theorem without clear policy implications absent additional weight-specifying principles.

  5. "What if individuals have heterogeneous risk functions? Pareto indifference may fail, your lemma breaks, and the social risk function could be unconstrained—so isn't your theorem irrelevant for real-world aggregation where risk attitudes vary?"  
  Concede that heterogeneity invalidates the lemma and limits applicability, but propose homogeneous cases as a benchmark for understanding risk inheritance; the soft point is that this offers no guidance for heterogeneous societies, where ad hoc aggregation rules might be needed.
