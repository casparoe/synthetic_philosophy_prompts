prompt: |-
  I'm doing a long-read on whether violence is actually declining and I want to stop the two camps just talking past each other, so: draft the joint statement that a declinist (thinks homicide and battle-death rates have fallen sharply and that per-capita is plainly the right lens) and a sceptic (thinks the decline is partly an artefact of who does the counting, and that the category "violence" gerrymanders which deaths get grieved) could both sign at the end of an adversarial collaboration. Give me the agreed claims as a numbered list, then a disagreements table where each side's position is phrased the way they'd accept for themselves, plus what each would count as evidence against their own view.

  To keep it from being abstract, invent a shared dataset they've both agreed to argue over: call it the Composite Violence Audit, which tries to merge homicide series, battle deaths and "structural" deaths (prison deaths, sanctions, neglect by authorities) into one index, using what I'll call the accountability test — a death counts as a violence death only if some recognised authority could in principle have been held responsible for it.

  Cover at least three cruxes: the denominator problem (the population you divide by was itself shaped by earlier violence and state pacification, so it may not be a neutral baseline); the substitution hypothesis (falls in recorded interpersonal and battlefield killing get offset by rises in killings the audit files under something else); and whether there is a fact of the matter at all or whether violence is a cluster concept whose extension is fixed by what we want it for. For each crux give a case or test both would accept as bearing on it, with each side's prediction written down in advance. Flag anywhere the dispute turns out to be merely verbal. Oh and write the whole thing in British English, and keep it tight — I've only got so many column inches.
