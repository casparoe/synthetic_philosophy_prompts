prompt: |-
  For the past two years I have kept a running log of my supervisor's verdicts on standing-to-blame cases. She is a responsibility theorist, I am writing a chapter on hypocrisy and standing, and I wanted a record of her judgments that is independent of whatever I end up arguing, so at the end of supervision I have been putting one or two cases to her and writing down the answer before I have time to argue with it. The verdicts I have are these: a husband who is having an affair blames his brother for having one — no standing, she said he was in no position; a woman who shoplifted a chocolate bar at fourteen blames a colleague for systematic expense-account fraud — standing, the earlier act is irrelevantly small; a manager who privately opposed a plan to withhold emissions data but signed off on it anyway blames her CEO for lying to regulators — no standing, or at any rate her blame is defective in whatever way matters here; a colleague who watched a junior researcher being publicly humiliated and said nothing afterwards blames the person who did the humiliating — standing, and she insisted that failing to intervene is not the same as being implicated; a man who once revealed a confidence under a credible threat blames a colleague for gossiping — standing, because his own act was excused and so there is nothing for him to be inconsistent about; a man who cheated on a grant application a decade ago, confessed, was sanctioned, and has been scrupulous since blames a colleague for minor CV inflation — she wavered and then said standing, on the grounds that what matters is whether he is now willing to be judged by the norm he is invoking; and a woman who blames her sister's employer for harassing her sister, when the sister has declined to complain — standing, since you can speak for someone who is not in a position to speak for herself.

  A real case has now come up in my department and I want to know what she will say before I put it to her. Miriam, a postdoc here, has no car, has not flown for leisure in nine years, and has moved her savings out of unscreened index funds; in a department meeting she publicly blamed, first, a senior colleague, Professor Ames, for flying to a conference in Sydney on a trip Ames did not choose — she was assigned to represent the department on a hiring panel — and, second, the department's governing body as a body, for refusing to cap conference travel and for the university's investment policy. Two features make this unlike anything on my list. The first is that Miriam's own pension sits in the university's default scheme, which holds the very index funds she has divested from personally; switching to the screened option is a one-page form she has not filled in, and privately she admits she has not got round to it. She is therefore a beneficiary of, and in some weak causal sense a contributor to, the investment policy she is condemning, while having never done anything remotely like it herself and plainly not being committed to exempting herself from the norm she invokes. The second is that part of the blame is addressed to a collective for a diffuse harm in which there is no individual victim who could complain and no individual member who controls the outcome, and part of it to a person who was not in a position to have acted otherwise — so the case probes whatever she thinks vicarious standing to blame requires when there is no one on whose behalf she is speaking, and whatever she thinks blame of a collective inherits from blame of a member. My own suspicion is that her verdicts are best explained by one forward-looking rule about the blamer's relation to the norm rather than by either a simple no-better-than condition or a complicity condition, and I have been trying to keep apart three things I think she may be running together: standing, meaning the authority to address the blame at all; the aptness of what the blame says; and whether the blaming is itself a fault in the blamer, since it seems to me that a hypocrite's blame can be apt and authorized and still be something he ought not to do.

  Predict her verdict on each half of the case, the individual half and the collective half, and tell me which single rule best explains the whole run of verdicts, including why she said no in the emissions case and yes in the bystander case and why she wavered in the reformed-cheater case. Commit to one rule and one verdict, with your reasons: do not set out the candidate rules with their respective predictions and leave me to choose between them, though do tell me which runner-up your prediction is most at risk of being confused with, and whether you think the beneficiary-but-not-agent feature or the collective-address feature is doing the real work in your answer. Then give me the one further case — the smallest variation on Miriam's, I would guess — that would most cleanly separate the rule you have picked from that runner-up, say what her answer to it would have to be for you to conclude you picked the wrong rule, and tell me how confident you are, in rough terms, that she answers as you predict. If you think my three-way distinction between standing, aptness and fault-in-the-blaming does no work on this material, or that the individual/collective split matters less than I am making of it, say that plainly rather than accommodating me.
reasoning: |-
  Hmm, this is a fascinating philosophical puzzle about moral standing to blame. The user has meticulously collected their supervisor's verdicts on hypocrisy cases and wants to predict her judgment on a new real-world scenario involving Miriam's climate blame. 

  First I need to analyze the supervisor's pattern across seven cases. The key rejections (no standing) are: the adulterous husband (direct equivalence), the complicit manager (participation). Approvals (standing) include: the reformed shoplifter (disproportionate scale), the bystander (non-participation), the coerced confider (excused act), the reformed grant cheat (current endorsement), and the sister's advocate (speaking for others). 

  The supervisor seems to focus on whether the blamer currently endorses and is bound by the norm they invoke - what I'll call the Normative Endorsement Rule. This explains her wavering in the reformed-cheater case: she needed to verify his present commitment. It also clarifies why the emissions-case manager lacked standing (she violated the norm she now cites) while the bystander had standing (non-intervention isn't endorsement of humiliation).

  Now for Miriam's case. The pension detail is crucial: though she benefits from unscreened investments, her personal divestment and lifestyle show active endorsement of the climate norm. Failing to switch pensions is procrastination, not norm-rejection. For blaming Ames: since Ames had no choice about flying, Miriam's blame is inapt - but that's about aptness, not standing. The collective blame stands because the department controls travel policy. 

  The beneficiary aspect doesn't undermine standing because Miriam isn't violating the norm herself - she's just administratively delayed on one action. The collective/individual split matters less than whether the blamer embodies the norm's authority. 

  To test this against the main alternative (a strict complicity rule), I'd propose a variant where Miriam actively invests in fossil fuels while blaming others. If the supervisor denied standing there, it would confirm my rule over complicity theories. 

  I'm about 85% confident in this prediction. The supervisor consistently distinguishes current normative commitment from past acts or tangential involvements. Miriam's case fits that pattern: her blame may be unstrategic or overbroad, but she has standing as a norm-endorser.
answer: |-
  Based on your supervisor's pattern of verdicts and the Normative Endorsement Rule I infer (detailed below), here is the prediction for Miriam's case, the best explanatory rule, and the test case:

  **Prediction for Miriam's Case:**
  - **Blaming Professor Ames (Individual): NO STANDING**  
    *Reason:* Ames was not free to refuse the Sydney trip (assigned duty). Blaming someone for an unavoidable act fails the "aptness" criterion inherent in your supervisor's framework. While Miriam has standing *in general* on climate issues, this specific blame misattributes fault to an agent without alternatives—akin to the emissions case where the manager's blame was defective despite opposing the act privately.
    
  - **Blaming the Department Collective: STANDING**  
    *Reason:* Miriam actively divested her savings, lives austerely, and condemns the policy *while her pension inertia is non-culpable procrastination* (like the reformed cheater’s past). She meets the "current endorsement" threshold: she invokes the norm sincerely, accepts it applies to her (hence divesting elsewhere), and her pension delay doesn’t negate commitment. The collective’s diffuse harm doesn’t require an individual victim to grant standing—your supervisor’s sister case shows one can blame for others *incapable* of acting, and here the "victim" is collective future harm.

  **Best Explanatory Rule: The Normative Endorsement Rule**  
  > **A blamer has standing only if they sincerely endorse the norm they invoke *and* demonstrate a present commitment to being bound by it (regardless of past acts or tangential complicity).**  
  > - **Endorsement:** The blamer must genuinely affirm the norm’s validity (e.g., Miriam’s lifestyle, the bystander’s silence ≠ endorsement of humiliation).  
  > - **Present Commitment:** Current actions must align with the norm *where feasible*, barring valid excuses (e.g., the coerced confider’s act was excused; the reformed cheater’s current scrupulosity shows commitment; Miriam’s divestment/lifestyle suffice despite pension delay).  
  > - **Distinguishes from complicity:** Past acts matter only if they contradict *current* endorsement (adulterous husband) or involve direct participation in the *same* norm violation (emissions manager signing off).  

  **Why This Explains All Verdicts:**  
  - **Emissions case (NO):** The manager *violated the very norm she invoked* (truth-telling) by signing off, showing non-endorsement *at the time of action*.  
  - **Bystander case (YES):** Silence ≠ endorsement of humiliation; bystander’s blame affirms the norm without inconsistency.  
  - **Reformed cheater (YES, wavering):** Wavering resolved by *current* commitment—past violation is irrelevant if norm is endorsed now.  
  - **Beneficiary feature in Miriam’s case:** Her pension status is *irrelevant* under this rule. What matters is her active divestment elsewhere and condemnation—she endorses the norm and acts on it *where she feasibly can*. The pension delay is procrastination, not rejection of the norm.  
  - **Collective address:** Standing derives from norm endorsement, not victim specificity. The sister case established that standing exists when speaking for those *unable* to act; here, the "harm" lacks a concrete victim but the norm (against environmental damage) is still binding.  

  **Closest Runner-Up & Confusion Risk:**  
  - **Runner-Up:** *Complicity-Aware Consistency Rule* ("Standing requires no direct participation in the *same type* of wrong").  
  - **Confusion Risk:** This might incorrectly predict **NO STANDING** for Miriam (due to pension "complicity") or **YES** for Ames (if ignoring aptness). It fails to explain the bystander (non-participation) vs. emissions (participation) distinction your supervisor drew.  

  **Critical Test Case:**  
  - **Variation:** Miriam *actively invests* 20% of her savings in fossil fuels (beyond pension) while blaming the department’s investments. All else equal.  
  - **Prediction Under My Rule:** **NO STANDING**—she actively violates the norm she invokes, negating endorsement.  
  - **If Supervisor Says YES:** My rule fails; the runner-up (or a complicity rule) might hold if she distinguishes personal harm from institutional harm.  
  - **Confidence Level:** **85%** in my prediction. The pension delay is analogous to the reformed cheater’s past—forgiven by current effort. Active investment would be like the adulterous husband, violating the norm *now*.  

  **On Your Three-Way Distinction:**  
  Your separation of **standing** (authority), **aptness** (content), and **fault-in-blaming** (blamer’s conduct) is crucial and *supported* here:  
  - Miriam has **standing** against the collective (authority via endorsement) but her blame of Ames is **inapt** (he lacked agency), not a standing issue.  
  - **Fault-in-blaming** is separate: a hypocrite’s blame *can* be apt (e.g., adulterous husband’s brother *is* wrong) but still lack standing. Your supervisor’s emissions case verdict ("defective in whatever way matters") hints she conflates aptness/standing—but your framework resolves this.  

  **The Real Work:** The **beneficiary-but-not-agent** feature is doing no work; your supervisor consistently dismisses tangential involvement (shoplifter vs. expense fraud). The **collective-address** feature matters only in requiring norm endorsement (which Miriam satisfies), not victim specificity. The core is always *normative endorsement*. 

  **Final Verdict:**  
  - Individual blame (Ames): **No standing** (actually: **inapt blame**—supervisor may conflate this).  
  - Collective blame: **Standing**.  
  - Rule: **Normative Endorsement**.  
  - Test: **Miriam actively invests in fossils → Predict NO STANDING.**
