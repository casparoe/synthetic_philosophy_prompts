  The audience is mostly China-focused comparative politics scholars who use surveys on political trust, a Singapore specialist, and two normative theorists. Each group has different concerns. The comparativists will likely question operationalization, especially how to measure contestability without elections. The Singapore specialist might point out that Singapore has high trust without contestation, challenging the necessity of contestability. The normative theorists will argue about conflating empirical and normative legitimacy.

  I need to anticipate objections in their vocabulary. For the comparativists, terms like perceived legitimacy, output orientation, and operationalization are key. They might ask how to measure contestability in authoritarian contexts. The reply should mention alternative indicators like policy reversals or social mobilization, but concede it's messy. The Singapore specialist might cite Singapore's stability and trust without electoral contestation. The response here should distinguish between stability and legitimacy, using examples like housing policy adjustments as forms of contestation.

  The normative theorists will challenge the blending of normative and empirical claims. They might argue that legitimacy can't be measured by belief alone. The response should clarify that contestability introduces a normative condition into empirical frameworks. Concede that the thesis bridges both but needs further normative justification.

  The user’s deeper needs include validation of their framework across different academic perspectives, showing awareness of methodological limitations, and preempting criticisms. They want to demonstrate that their model applies even in non-democratic contexts without elections. Highlighting the moral hazard in the insurance argument strengthens the critique of regimes controlling both performance metrics and risks.

