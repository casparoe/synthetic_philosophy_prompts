  Here’s a systematic analysis of intentional action in criminal law, drawing on the described practices and theoretical accounts:

  ### Candidate Accounts of Intending
  1. **Aim/Purpose Account**  
     - *Core claim*: Intention requires acting *for the sake of* or *with the goal* of bringing about a result.  
     - *Predicts*: Oblique intent should not exist (contradicts practice). Motive irrelevance is coherent (motive ≠ purpose). Good/bad asymmetry is unexplained.  

  2. **Foresight-as-Constitutive Account**  
     - *Core claim*: Intending X = Acting while believing X is a virtually certain consequence.  
     - *Predicts*: Oblique intent is genuine intent. Motive irrelevance follows (belief, not desire, matters). Good/bad asymmetry is puzzling (should be symmetric).  

  3. **Moralized/Thick Concept Account**  
     - *Core claim*: Intentionality judgments incorporate moral evaluation (e.g., blameworthiness).  
     - *Predicts*: Oblique intent applies only to harms (Knobe effect). Motive irrelevance holds (bad ends aren’t excused by good motives). Asymmetry is inherent.  

  4. **Culpability-Grading Construct**  
     - *Core claim*: "Intent" is a legal label for high culpability, detached from psychology.  
     - *Predicts*: Oblique intent reflects blameworthiness, not mental states. Motive is irrelevant to grading severity. Asymmetry arises from law’s harm-focused structure.

  ---

  ### What Existing Practice Presupposes
  - **Strictly Presupposes**:  
    - *Non-psychologism*: The law does not treat intent as a pure mental state but as a *legal category* justified by culpability.  
    - *Asymmetry*: Intent is only constructively extended to *harms*, not benefits.  
    - *Motive Exclusion*: Purpose (aim) is distinct from motive (ultimate reason for acting).  

  - **Fits Well With**:  
    - *Foresight-as-Constitutive*: Explains oblique intent doctrine neatly.  
    - *Moralized Concept*: Aligns with Knobe-type asymmetry and motive irrelevance.  
    - *Culpability-Grading*: Matches how intent triggers heightened liability.  

  - **Underdetermined Between**:  
    - Foresight-as-Constitutive vs. Moralized Concept: Both license oblique intent and asymmetry.  
    - Purpose Account (if foresight is *evidence* of purpose) vs. Culpability-Grading: Both can explain motive irrelevance.  

  ---

  ### Addressing Key Questions
  1. **Does oblique intent reduce intent to foresight?**  
     - Not necessarily. The practice is *compatible* with:  
       - Foresight as *constitutive* (intent = foresight of virtual certainty).  
       - Foresight as *reliable evidence* of purpose (jury infers aim from certainty).  
       - Culpability grading (foresight warrants murder liability regardless of "true" intent).  
     - *Strongest fit*: Foresight-as-constitutive or moralized accounts, as purpose-based views struggle with cases where the outcome is unwanted (e.g., bomber regretting deaths).  

  2. **Knobe Effect & Moralized Concepts**  
     - The asymmetry (bad outcomes treated as intentional, good ones not) mirrors the Knobe effect, suggesting the law *latches onto a folk concept* moralized by blame.  
     - *Counterargument*: Law’s asymmetry could stem from *institutional purpose* (punishing harm, not rewarding benefit), making it a *legal artifact* independent of psychology.  
     - *Evidence for moralization*: If folk psychology moralizes intent, the law’s refusal to symmetrize (e.g., no "constructive intent" for benefits) reflects embedded folk norms.  

  3. **Workability of Constructive Beneficence**  
     - **Likely unworkable** if the Knobe effect holds: Fact-finders would resist saying the hacker "intended" to save lives, as folk attributions deny intentionality for positive side effects.  
     - **What refusal shows**:  
       - If jurors reject "intent" for benefits despite identical certainty, it implies existing oblique intent doctrine rests on a *genuine, asymmetric psychological category* (moralized intent).  
       - If jurors accept it easily, current doctrine is a *legal construct* borrowing "intent" loosely for culpability.  
     - **Practice-based prediction**: Existing asymmetry suggests refusal. Legal intent for harm is parasitic on folk concepts, while constructive beneficence lacks psychological grounding.  

  ---

  ### Conclusion
  - **Existing Practice’s Foundation**: The law presupposes a **hybrid view**: intent is *constituted* by foresight of virtual certainty *for harms only*, reflecting a moralized (Knobe-compatible) concept. Motive irrelevance reinforces that intent is about chosen means/ends, not ultimate goals.  
  - **Constructive Beneficence Test**: Its potential failure would confirm that current doctrine relies on a **pre-legal asymmetric concept of intentional action**, not merely culpability grading. The law’s refusal to symmetrize intent reveals its debt to folk moral psychology.  

  This analysis shows criminal intent is neither purely psychological nor purely legal, but a category shaped by law’s need to condemn blameworthy choices in terms jurors intuitively grasp.
