prompt: |-
  OK so this came up at work and I've been going in circles on it. We're writing a funding recommendation and the rule we've been told to apply is basically cost-per-QALY: one year in full health = 1 unit, death = 0, intermediate health states get a number between 0 and 1 from those standard-gamble / time-trade-off questionnaires, you add up the QALYs across everybody, and a QALY is a QALY no matter whose it is — no bonus for being severely ill, no penalty for being rich, no discount for being 85. (NICE in the UK is the famous version, with a fixed pound figure per QALY as the ceiling, plus special higher allowances for end-of-life drugs.) Meanwhile in transport and environmental regulation the equivalent agencies do cost-benefit off willingness-to-pay: how much money people say they'd pay for a small cut in their own risk. That obviously weights a rich person's safety more heavily, and everyone in health policy thinks importing that into treatment decisions would be monstrous. So we add up utility across people in one place and refuse to let money do the comparing in the other, and I can't tell whether that's a deep consistency or just turf.

  Here's the bit I actually want help with. A colleague who did some philosophy says the whole exercise is meaningless bcause utility functions are only determined up to positive affine transformation — so there's no fact of the matter about whether my mild chronic back pain is worse than your bad migraine, and adding across heads is incoherent. But that argument seems to kill every cost-benefit analysis ever done, and we plainly do make these judgements all the time, so "meaningless" can't be the right verdict? Separately, I had a fix in mind: anchor each person's scale to their own range — best possible life = 1, worst possible life = 0 — and then the units are comparable and you're done. Someone said that's a known move with known problems, but wouldn't tell me what they were.

  So: what does the cost-per-QALY practice actually presuppose? I want the implicit theory reconstructed, and I want to know which parts are strictly required and which it merely sits well with. As far as I can tell it needs at least: that wellbeing (or health-related quality of life) comes in comparable cardinal degrees; that there's a common zero and a common unit across people; that gains to different people just add; that a QALY gained by someone starting from a terrible baseline is worth the same as one gained by someone starting from a mildly annoying baseline; and that distribution doesn't itself matter. Which of those is load-bearing for the practice, which is an optional extra the practice could drop without collapsing, and are the end-of-life/severity allowances and the refusal to use willingness-to-pay consistent with the rest of it or do they bolt on a different theory? Then: what would concretely have to change in the practice if we replaced that implicit theory with (a) a view where we only ever have partial or ordinal comparability between people, (b) a view where the badly off get strictly more weight per unit of benefit, or (c) the "impartial spectator who doesn't know which person they'll turn out to be" style of justification?

  End the whole thing with a single machine-readable line: \answer{...} containing one short phrase naming the commitment you think is genuinely indispensable to the practice — or the single word "none" if you think it can be rebuilt on purely ordinal / Pareto-style grounds.
reasoning: |-
  Okay, let me approach this systematically. The user is clearly grappling with some deep methodological and philosophical questions about QALY-based health economics in their work context. They've identified several layers: the apparent tension between health sector (QALY) and other sectors (willingness-to-pay) approaches, the utility measurement objection from their philosophy colleague, their proposed anchoring solution, and finally a request to reconstruct the implicit theory behind cost-per-QALY.

  First, I need to unpack that philosophy colleague's argument. The "positive affine transformation" point is technically correct - standard utility theory doesn't permit interpersonal comparisons. But the user's intuition that this can't invalidate all real-world policy analysis is sound. The key is recognizing that QALYs operate as a specific measurement protocol, not as revealed utility. Those standard-gamble and time-trade-off techniques essentially create an artificial cardinal scale through the experimental framing. 

  The user's anchoring proposal (0=worst imaginable health state, 1=best) is actually close to existing practice like EQ-5D, but doesn't fully resolve comparability. If my "worst imaginable" is your Tuesday, we still have no common unit. The real anchor is death=0 and full health=1 - but that assumes health states are commensurable across individuals, which is precisely what's contested.

  Reconstructing the implicit theory: QALYs require at minimum (1) cardinal measurability of health utility, (2) interpersonal comparability of units, (3) additive aggregation. The zero point (death=0) is equally crucial - without it, we couldn't talk about gains. The "a QALY is a QALY" principle implies strong assumptions: no priority to worse-off (contradicted by end-of-life exceptions!), no diminishing returns.

  On their specific questions: 
  - Dropping comparability would destroy QALYs entirely 
  - Adding priority to worse-off would require weighted aggregation (like WHO's equity weights) 
  - The Rawlsian veil-of-ignorance approach actually supports standard QALYs if we assume risk-neutrality behind the veil - but people aren't risk-neutral about health! 

  The end-of-life exceptions reveal tension: they implicitly weight QALYs differently based on baseline health, contradicting the core model. Willingness-to-pay rejection is consistent though - it protects against wealth bias.

  For the answer token: "interpersonally comparable cardinal utilities" captures the indispensable core. Without this, the QALY edifice collapses.
answer: |-
  Here's a step-by-step reconstruction of the implicit theory behind cost-per-QALY and its critical commitments:

  ### Core Presuppositions of Standard QALY Practice
  1. **Cardinal measurability**: Health states can be assigned numerical utilities (0-1) representing *absolute levels* of well-being (not just ordinal rankings).  
  2. **Interpersonal comparability**: A utility of 0.7 for person A means the *same thing* as 0.7 for person B. The scale has identical meaning across individuals.  
  3. **Common zero and unit**: Death = 0 and full health = 1 are *universal anchors*, creating a shared ratio scale.  
  4. **Additive aggregation**: Total welfare is the *arithmetic sum* of individual QALYs (utilitarianism).  
  5. **Distributional indifference**: A QALY gain has equal social value regardless of who receives it (no equity weighting).  

  ### Load-Bearing vs. Optional Elements
  - **Strictly required**: (1) Cardinal measurability, (2) Interpersonal comparability, (3) Common zero/unit.  
    → *Without these, QALY aggregation is mathematically incoherent*.  
  - **Required for current practice**: (4) Additive aggregation, (5) Distributional indifference.  
  - **Contradicts core practice**: Severity/end-of-life allowances (violate #5) but reflect political/pragmatic adjustments.  
  - **Consistent with practice**: Rejecting willingness-to-pay (avoids wealth bias).  

  ### Impact of Alternative Theories  
  | Scenario                     | Concrete Changes Needed                          |  
  |------------------------------|--------------------------------------------------|  
  | **(a) Ordinal/Partial Comparability** | Abandon QALYs; use Pareto improvements only (no aggregation across persons). |  
  | **(b) Priority to Worse-Off** | Apply equity weights (e.g., 1 QALY for severe illness = 1.5 "standard" QALYs); requires explicit weighting formula. |  
  | **(c) Veil-of-Ignorance**     | Same as standard QALYs *only if* individuals are risk-neutral behind the veil; otherwise, requires risk-adjusted aggregation. |  

  ### Evaluation of Your "Anchoring" Fix  
  - **Problem 1**: "Best/worst possible life" is subjective and variable (e.g., chronic pain patient vs. healthy person). Violates the need for a *common* unit.  
  - **Problem 2**: Loses death=0 anchor, making life-extension benefits incomparable.  
  - **Problem 3**: Does not resolve whether a 0.1 utility gain for person A equals 0.1 gain for person B.  

  ### Philosophical Objection: Affine Transformations  
  - **Rebuttal**: QALYs bypass this via *operationalization*. Standard-gamble/time-trade-off impose a *cardinal scale* by fixing 0 (death) and 1 (full health) as invariant reference points. This constructs interpersonal comparability by fiat.  

  ### Consistency Check  
  - **End-of-life allowances**: Inconsistent with core theory (violates distributional indifference).  
  - **Rejecting willingness-to-pay**: Consistent (prevents wealth-based discrimination).  

  \answer{interpersonally comparable cardinal utilities}  

  ### Key Insight  
  The indispensable commitment is **interpersonally comparable cardinal utilities**. Without this, QALY summation lacks justification—ordinal data cannot support aggregation across persons. The practice stands on constructing a shared measurement protocol (death=0, full health=1) to force comparability, despite theoretical objections. Alternatives require fundamentally different methodologies (e.g., equity weights, consent-based thresholds).
