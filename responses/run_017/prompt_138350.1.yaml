prompt: |-
  Hey — possibly a weird one, but let's see. I'm part of a small volunteer group drafting a charter for an imaginary three-level federation (communes / cantons / federation) that we're using as a teaching case in a civic-ed thing, and I want to nail subsidiarity down before we build the rest of the document around it.

  My working understanding is pretty simple: subsidiarity means decisions get made at the lowest level that can competently handle them, and only move up when the lower level obviously can't cope. So our draft pushes basically everything downward by default — we even put in a compulsory devolution rule where any federal competence sunsets after ten years unless the centre re-justifies it, plus a rights floor the federation can enforce against a commune. The EU treaty's "can't be sufficiently achieved by the member states" language looks to me like the same idea with more syllables, so I figure a properly consistent charter would leave the centre with almost nothing: army, currency, rivers.

  Two places where I'm stuck. First, capacity: half our communes are tiny and would clearly botch water treatment or procurement, so a couple of us want a "capacity-first" clause making the federation fund and train a commune before anything is actually devolved to it. One person says that's the opposite of subsidiarity; another says it's the entire point. And a friend who reads a lot of Catholic social teaching says I've got the principle backwards — that "subsidium" means *help*, that the original target was the big centralised state swallowing up smaller associations, and that the higher level can actually be required to step in. Which honestly sounds like having it both ways to me.

  Second: does the principle say anything at all about who pays? We keep sliding into that question. If a canton is made to run a service, does subsidiarity imply it gets the tax base too, or is that a seperate principle altogether?

  So: is "lowest level that can handle it" even the right test, or is there a better one for deciding when something genuinely has to move up? And what's the standard way people handle the case where the lower level *could* handle a decision but its decision wrecks something for the level above — an upstream commune damning a river, a commune zoning out a rail line, that sort of thing. Mostly I want to know whether our whole setup is resting on a misreading.
reasoning: |-
  Okay, let me unpack this user's query. They're drafting a charter for a fictional federation and wrestling with subsidiarity principles. First, I need to confirm my understanding aligns with theirs: subsidiarity means decisions should be made at the lowest competent level. But their team has disagreements, especially about capacity and funding. 

  The user's setup is interesting—they've got a default-downward system with a sunset clause for federal powers. That's bold but might be too rigid. Their first sticking point is capacity: small communes failing at complex tasks. Some want the federation to train/fund first; others say that violates subsidiarity. Then there's the Catholic social teaching angle where "subsidium" implies active help from higher levels. Hmm, that's not contradictory—it's actually complementary. The original principle was indeed about higher levels *enabling* lower ones, not just decentralizing for its own sake. 

  Second issue: who pays? If a canton runs a service, should it control taxes? That's fiscal federalism territory—related but distinct. Subsidiarity focuses on decision-making, not necessarily revenue streams. 

  The spillover problem (e.g., a commune damming a river) is crucial. Pure local control fails here. Real federations handle this with frameworks: local autonomy unless externalities exist. The user's "rights floor" is a good start but needs spillover mechanisms. 

  Their deeper need? Confidence their framework isn't built on a misreading. They might fear their aggressive devolution misses subsidiarity's nuance. And they’re right—the principle isn’t just "lowest level possible" but "lowest level *effective*," with higher tiers as support. The Catholic perspective isn’t having it both ways; it’s the full picture. 

  I should emphasize the "empowerment" aspect and suggest balancing their sunset clause with positive obligations for higher levels to build capacity. For spillovers, propose a test: "Does this decision impose costs/benefits beyond the actor's jurisdiction?" And clarify that funding is a separate (though linked) design choice. 

  Also, their teaching context matters. A hyper-decentralized model might be pedagogically useful but risks oversimplifying real-world subsidiarity. Flagging that tension could help them decide how "pure" to keep the simulation.
answer: |-
  Your setup isn't "misread" – it's a common interpretation, but the Catholic social teaching angle highlights a crucial nuance often missed. Let's break down the core issues:

  **1. Revisiting the Core Principle: "Lowest Level" vs. "Capable Level with Support"**
      *   **The Common View (Your Working Understanding):** "Lowest level that can competently handle it." This emphasizes decentralization and local autonomy. Decisions *start* local and only move up when *proven* necessary.
      *   **The Catholic Social Teaching View ("Subsidium" as Help):** This emphasizes the *purpose* of the higher level: **to support and empower lower levels.** The higher level isn't just a fallback for failure; it has an *active duty* to ensure lower levels *can* function effectively ("subsidium" = aid/support). The original target *was* the overbearing state crushing local associations, but the solution wasn't pure localism – it was a *balanced hierarchy* where higher levels *enable* lower levels to fulfill their proper functions.
      *   **Reconciliation:** **Subsidiarity is a two-way street:**
          *   **Downward:** Decisions belong at the lowest level *capable of handling them effectively*.
          *   **Upward:** The higher level has a *positive obligation* to provide the necessary resources, framework, coordination, and sometimes *temporary intervention* (including funding/training) **to build or restore the capability of lower levels.** It also *must* handle tasks demonstrably beyond the capacity of any lower level *even with support* (e.g., national defense, macro-economy, major inter-cantonal infrastructure).
      *   **Your "Capacity-First" Clause:** **This IS subsidiarity in action (the "help" aspect).** Denying a commune a task it demonstrably *can't* handle *without support* protects the common good (e.g., clean water). Saying "figure it out yourselves or lose it" violates the principle. The clause should reflect the higher level's *duty* to empower, not just a conditional transfer.

  **2. Who Pays? The Fiscal Dimension**
      *   Subsidiarity **primarily governs decision-making competence, not funding sources.** There's no direct "subsidiarity rule" for taxes.
      *   However, **fiscal autonomy is deeply linked to effective subsidiarity:** A level tasked with a responsibility needs adequate resources to fulfill it *autonomously*. If the canton runs the service but relies entirely on federal handouts, its decision-making power is illusory.
      *   **The Standard Approaches:**
          *   **Revenue Assignment:** Assign specific tax bases *primarily* to the level responsible for the service (e.g., property tax to communes for local services, income/sales tax to cantons/federation for broader services). This aligns responsibility and resource generation.
          *   **Vertical Fiscal Imbalance & Transfers:** It's often impractical for lower levels to fund major services entirely from their own narrow bases. Higher levels (with broader tax bases) provide grants:
              *   **Unconditional Grants:** Support general capacity, respecting subsidiarity by letting the lower level decide spending priorities.
              *   **Conditional Grants:** Fund specific mandates or national priorities, but can infringe on local autonomy if too prescriptive.
          *   **Your Charter Needs Clarity:** Specify *how* responsibilities are funded. Does the level *making* the decision also *raise* the revenue? If not, what are the rules for transfers? Link fiscal capacity to functional capacity.

  **3. Handling Spillovers & Conflicts ("Wrecks Something for the Level Above")**
      *   This is where pure "lowest level" logic **fails**, and the "help" aspect morphs into "framework setting." Subsidiarity **does not mean local units can harm the common good of the larger community.**
      *   **The Standard Approach: Framework Legislation & Minimum Standards:**
          1.  **Define the Higher-Level Interest:** The federation/canton must articulate *why* the local action (e.g., damming the river, blocking rail) has significant negative effects beyond the commune (pollution downstream, national transport disruption).
          2.  **Set Minimum Standards/Rules:** The higher level establishes the *framework* within which lower levels operate (e.g., federal environmental laws, canton-wide spatial planning principles, national rail corridor protections). This prevents destructive localism.
          3.  **Empower Intervention:** If a lower level's action *within its competence* still violates these frameworks or causes severe harm, the higher level must have a clear, constrained mechanism to intervene (e.g., judicial review, conditional funding withdrawal, specific override powers). This should be an exception, not the rule.
      *   **Your "Rights Floor" is a Start:** Expand it into a broader "Common Good Framework" covering essential standards (environment, core infrastructure corridors, fundamental rights, macroeconomic stability) that *all* levels must respect.

  **Revised "Test" for Assigning Competences (Incorporating Nuance):**

  > **"A competence belongs at level X if:**
  > 1.  **Effectiveness:** Level X can effectively perform the task *in principle* (considering scale, expertise, resources);
  > 2.  **Proximity & Autonomy:** Level X is closest to the citizens affected, maximizing democratic participation and responsiveness to local needs/conditions;
  > 3.  **Empowerment:** Level X possesses, or can be reasonably *enabled* to possess (through support/training/funding from above), the *actual capacity* to perform the task effectively *now or in the near future*;
  > 4.  **Absence of Harm:** Performing the task at Level X does not *significantly harm* the legitimate interests, essential standards, or vital infrastructure of higher levels or other units at the same level (requiring framework rules from above);
  > 5.  **Higher-Level Necessity:** The task demonstrably *cannot* be performed effectively *even with support* by any lower level (Level X-1 or below) due to inherent scale, complexity, or the absolute need for uniform standards/coordination.
  >
  > **The higher level has a positive duty to empower lower levels (Point 3) and set necessary common frameworks (Point 4)."**

  **Applying this to Your Charter:**

  1.  **"Capacity-First" Clause:** **Keep it!** Reframe it as the Federation's/Canton's *duty* to provide funding, training, and technical assistance to enable Communes/Cantons to competently exercise devolved functions. This embodies "subsidium."
  2.  **Sunset Clause:** **Keep it, but refine it.** Instead of "re-justify," make the test: "Can the Federation demonstrate that this competence still fails the test (Points 1, 3, or especially 5) for lower levels *even with the support mechanisms in place*?" This shifts the burden onto the higher level to prove the *ongoing necessity* of centralization.
  3.  **Fiscal Provisions:** **Add them explicitly.** Decide on principles (e.g., "The level exercising a competence shall have primary responsibility for funding it, supported by a system of fair fiscal equalization and targeted grants where necessary"). Detail revenue assignment and transfer rules elsewhere.
  4.  **Spillover/Framework Rules:** **Significantly strengthen this.** Beyond the rights floor, establish clear mechanisms for:
      *   Setting binding minimum standards (environment, infrastructure corridors, core services).
      *   Resolving inter-communal/cantonal disputes (e.g., a federal environmental agency or court).
      *   Limited, clearly defined override powers for higher levels when lower-level actions violate the common good framework *and* local remedies fail.

  **Conclusion:** Your setup isn't resting on a *misreading*, but on an *incomplete* reading. Embrace the "help" aspect of subsidiarity. Your "capacity-first" idea is spot on. Your sunset clause is a strong accountability tool when combined with the higher level's duty to empower. Fiscal rules and robust framework-setting are essential companions, not separate principles. By incorporating the empowerment duty and common good frameworks, you create a more resilient and truly *subsidiarity*-driven federation design. Good luck with the civic-ed project – this is a fantastic way to teach these complex concepts!
