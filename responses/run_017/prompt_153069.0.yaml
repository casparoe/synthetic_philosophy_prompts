  The user's main case is a modified presumptuous philosopher: two symmetric hypotheses with different observer counts, but the extra observers are in a disconnected future era. Key question: introduce this complexity upfront or start simpler?

  The user also wants:
  - One case where SSA/SIA agree
  - Clarify likelihood vs prior distinction
  - Address misconceptions (can't update on existence, SIA=SSA with wider reference class)
  - Closing question to test understanding
  - Explicitly state what won't be covered

  Hmm... structural priorities:
  1. Must start with minimal conflict to isolate the likelihood issue
  2. Future-era complication should come LATER as a twist
  3. Need a "safe" case first where both principles agree

  Plan sequence:
  First: Simple Doomsday-style case (no future era) to establish:
  - Can update on existence (defuse "had to exist" misconception)
  - SSA/SIA likelihood formulas
  - Show where they diverge (P(I exist | H) term)

  Second: Introduce future-era variant to show:
  - Complications don't change SSA/SIA conflict
  - Highlights causal independence matters for SSA

  Third: Include agreement case (e.g. identical observer groups) to avoid overgeneralization

  Misconception handling:
  - "Can't update on existence": Address when writing first likelihoods by contrasting P(data|H) vs P(I see data|H)
  - "SIA=SSA with wider class": Crush when defining SIA as P(I exist) ∝ observer count

  Closing test:
  Ask to write likelihoods for NEW asymmetric case (e.g., different colored rooms)

  Explicit non-goals:
  - Resolving SSA/SIA debate
  - Full Doomsday argument
  - Observer reference class issues

  Most critical decision: Start SIMPLE. Future-era wrinkle comes after core mechanics are clear.
answer: |-
  **Lead with minimal conflict: Start with a simple two-hypothesis case without temporal/causal disconnection to isolate the likelihood disagreement.**  

  ### Session Plan (90 mins)  
  1.  **Warm-up: Non-anthropic selection effect (10 mins)**  
      - *Activity:* Recall Bayes' theorem. Show a truncated normal distribution example (e.g., "only tall people surveyed").  
      - *Goal:* Reactivate intuition: *likelihoods* drive updates when evidence is filtered.  
      - *Key distinction:* Stress this is **not self-locating** ("tall" is external, not "I am tall").  

  2.  **Core case 1: Simple asymmetric observers (Doomsday variant) (20 mins)**  
      - **Hypotheses:**  
        - \( H_S \): 10 billion observers total (all now, e.g., "short-lived civilization").  
        - \( H_L \): 100 billion observers total (all now, e.g., "long-lived civilization").  
      - **Datum:** *You* exist now as a random observer.  
      - *Activity:* Derive likelihoods together:  
        - **SSA likelihood:** \( P(\text{I exist} \mid H) = \frac{1}{\text{total observers in } H} \) → \( \mathcal{L}(H_S) = \frac{1}{10^{10}} \), \( \mathcal{L}(H_L) = \frac{1}{10^{11}} \)  
        - **SIA likelihood:** \( P(\text{I exist} \mid H) \propto \text{total observers in } H \) → \( \mathcal{L}(H_S) \propto 10^{10} \), \( \mathcal{L}(H_L) \propto 10^{11} \)  
      - *Crucial point:* Circle the **denominator** (SSA) vs. **proportionality constant** (SIA). Emphasize: **This is a likelihood ratio conflict, not prior.**  

  3.  **Defuse misconceptions (10 mins)**  
      - *"Can’t update on existence":* Show Bayes works: \( P(H|\text{I exist}) = \frac{P(\text{I exist}|H)P(H)}{P(\text{I exist})} \). "You must exist to update, but *which* observer you are is data."  
      - *"SIA is SSA with wider reference class":* Contrast math: SIA multiplies likelihood by observer count; SSA divides by it. **Not the same reference class!**  

  4.  **Core case 2: Agreement scenario (10 mins)**  
      - **Hypotheses:** \( H_A \), \( H_B \) with *identical* observer counts and conditions.  
      - **Datum:** You exist as a random observer.  
      - *Activity:* Show SSA/SIA both give \( P(\text{I exist} \mid H_A) = P(\text{I exist} \mid H_B) \).  
      - *Goal:* Prevent overgeneralization. "Anthropic reasoning doesn’t *always* shift beliefs."  

  5.  **Introduce your wrinkle: Future-era observers (20 mins)**  
      - **Add to \( H_L \):** 90 billion observers exist in a causally disconnected future era with alien evidence.  
      - *Activity:* Re-derive likelihoods:  
        - **SSA:** Unchanged! Reference class = all actual observers → \( \mathcal{L}(H_L) = \frac{1}{10^{11}} \)  
        - **SIA:** Unchanged! \( \mathcal{L}(H_L) \propto 10^{11} \)  
      - *Punchline:* The conflict **persists identically**. Temporal disconnection doesn’t resolve it.  
      - *Why last?* Now they see the core conflict is robust. If added earlier, distracts from likelihood mechanics.  

  6.  **Closing discriminator question (15 mins)**  
      - "Hypotheses \( H_X \): 1 observer in a red room. \( H_Y \): 100 observers, each in a blue room. You wake in a blue room. Write SSA/SIA likelihoods for *this datum*."  
      - *Test:* Correct only if they spot:  
        - SSA: \( P(\text{blue} \mid H_Y) = 1 \) (all rooms blue), \( P(\text{blue} \mid H_X) = 0 \) → favors \( H_Y \)  
        - SIA: \( P(\text{I exist in blue} \mid H_Y) \propto 100 \times 1 \), \( P(\text{I exist in blue} \mid H_X) \propto 0 \) → also favors \( H_Y \)  
      - *Why it works:* They must apply principles (no memorized verdict), and see agreement here.  

  7.  **Openly decline to settle (5 mins)**  
      - "We **won’t resolve** which principle (SSA/SIA) is 'correct.' We also **won’t cover** the reference class problem, full Doomsday argument, or ethical implications."  
      - *Reason:* Focus achieved if they can replicate the likelihood split.  

  ### Why this structure?  
  - **Misconception sequence:** Defuse "can’t update" during initial likelihood derivation (Step 2); crush "SIA=SSA" after defining both (Step 3).  
  - **Likelihood-prior clarity:** Stressed when circling terms in Step 2 and reinforced in Step 5 (no prior changes).  
  - **Future-era timing:** Adding it late (Step 5) avoids cognitive overload during first exposure. Its causal irrelevance highlights that SSA/SIA depend purely on *observer count*.  
  - **Carrying case requirements:** Must have asymmetric observer counts with symmetric non-anthropic evidence. Must *lack* non-anthropic disconfirming evidence.  
  - **Key dependency:** Step 2 (simple case) must precede everything—it’s the foundation. Agreement case (Step 4) must precede the discriminator to avoid false negatives.  

  **Final output:** Students can write SSA/SIA likelihoods for asymmetric hypotheses and identify the diverging term (observer count in denominator vs. constant).
