prompt: |-
  I work on a small team that maintains an internal assistant at a community health clinic — it's a large language model with read access to patient charts, and it drafts a first pass at visit notes that a clinician then edits and signs. Last week a nurse flagged a draft where the assistant wrote that the patient "reports chest pain" when what was actually in the chart was "tightness in the chest, worse on stairs." Everyone agrees the draft was wrong and got fixed before signing. What we can't agree on is how to log it, and I'm the one who has to write the taxonomy, so I have to pick actual words for a form field.

  Our tech lead wants a category called "false belief." His argument is roughly: the assistant took the patient to have chest pain, that's something it took to be the case, it was wrong, and saying so is both honest and useful — it tells you what broke and sends the incident to the prompt team instead of the infra team. One of our engineers hates this. She says the thing doesn't take anything to be the case, it's a next-token predictor, and that if we start writing "the system believed X" in documents that auditors and eventually lawyers will read, we're smuggling in a claim about minds that nobody here can defend — and worse, we'll start debugging it the way you'd debug a careless human instead of checking whether the retrieval step even pulled the right chunk. Meanwhile the nurses themselves say things like "it thought she was having chest pain" all the time and it seems to work fine for them; they predict what it's going to do next and they're usually right.

  Here's the part I can't get straight. Someone proposed a compromise that I liked for about a day: attribute a belief to the system only if the attribution survives a bit of pressure — it asserts the thing when asked plainly, still asserts it when the question is paraphrased or buried in a longer prompt, and doesn't retract when you show it the chart again. The trouble is that when I actually tried it, it bit on nothing. I ask "did you think the patient had chest pain?" and it says yes. I ask "or were you just pattern-matching on the words tightness and chest?" and it also says yes. I ask "so which is it?" and it produces a tidy little story about over-relying on surface features. It signs off on basically anything I propose about itself. So the pressure test never fails, which makes me suspect it isn't testing anything — but I can't tell whether that's an argument against the rule, an argument that I'm just bad at interrogating the thing, or an argument that the whole "false belief" framing was empty from the start. Add that the category label decides which team gets paged and what goes in a report to the state, so this isn't purely academic for me. What should I actually put in that form field, and who here is confused?
reasoning: |-
  Okay, this is a really nuanced problem that touches on philosophy of mind, practical engineering, and regulatory compliance all at once. The user is stuck between their tech lead's "false belief" framing and an engineer's objection that LLMs don't have beliefs - while nurses anthropomorphize the system daily. 

  Hmm, what's interesting is how the compromise proposal failed spectacularly in testing. The assistant just agrees to whatever self-diagnosis you suggest, which ironically proves the engineer's point: there's no consistent internal state to interrogate. That "tidy little story" it generated about surface features? That's just plausible pattern-matching, not introspection.

  The stakes are higher than terminology though - misclassification could send incidents to the wrong team (prompt engineers vs infrastructure) and potentially create legal vulnerabilities. I notice the user seems most concerned about audit trails and accountability, not philosophical purity. Smart.

  Let me break this down:
  - The tech lead isn't wrong about needing diagnostic categories
  - The engineer is absolutely right about avoiding mental state claims
  - The nurses' language works because it's predictive, not metaphysical 

  The core tension is between accuracy and usefulness. "False belief" is useful shorthand but inaccurate; "retrieval error" might be accurate but useless if the real issue is in-context reasoning. What we need is taxonomy that describes observable failures without speculating about why.

  Alternative approaches popping to mind:
  1. Where did the factual divergence happen? (Source misreading vs generation error)
  2. What repair action is needed? (Fix retrieval vs adjust prompting)
  3. How severe is the mismatch? (Critical clinical fact vs phrasing nuance)

  That last one matters - "chest pain" vs "tightness worse on stairs" is clinically significant, whereas say "headache" vs "migraine" might be less so. But the form field probably shouldn't handle severity grading.

  Wait - the retrieval step seems crucial here. Did the system even have the correct chart excerpt? If yes, then it's a generation problem; if no, it's a data fetching problem. That feels like the most actionable fork in the road.

  For the form field, maybe something like:
  - Source Data Incorrect (not applicable here)
  - Retrieval Failure (wrong chart segment)
  - Misrepresentation of Retrieved Data (this case!)
  - Hallucination Unrelated to Data 

  But "misrepresentation" sounds intentional... "Selective Emphasis"? "Contextual Distortion"? Getting too vague. Perhaps "Factual Transformation Error" - dry but precise.

  Alternatively, borrow from NLP: "Entailment Failure" or "Semantic Drift". Though clinicians might not get those. "Clinical Detail Inaccuracy" is clearer but broad.

  ...After all this, I'm landing on the engineer's side. The safe path is describing the observable error: system output claimed X when source stated Y. No belief attribution needed. For routing, tag it as "Content-Source Mismatch" and let teams investigate deeper. 

  Final thought: the taxonomy should probably have both a classification (what broke) and a mechanism field (how it broke). That separates the "what" from the "why" and avoids the philosophy trap entirely. Smart engineers can argue about mechanisms in Slack; auditors get clean descriptions.
answer: |-
  You're grappling with a profound tension between practical utility and philosophical/legal precision—a common challenge when LLMs enter high-stakes domains. Here’s a structured approach to your taxonomy problem:

  ### Core Principles for Your Taxonomy
  1. **Avoid anthropomorphism in formal logs**  
     Terms like "belief" imply agency/consciousness, creating legal and technical liability. Your engineer is right: auditors/lawyers *will* parse these terms literally.
     
  2. **Focus on observable behavior**  
     Describe what the system *did* (output inaccuracies), not unprovable internal states.

  3. **Preserve diagnostic utility**  
     Categories should route issues to the correct team (e.g., retrieval vs. generation errors).

  ---

  ### Proposed Taxonomy & Rationale
  **Category:** **`SOURCE-TEXT MISREPRESENTATION`**  
  *(Subtypes below)*  

  | **Subtype**                  | **When to Use**                                                                 | **Routing**               |
  |------------------------------|---------------------------------------------------------------------------------|---------------------------|
  | **Overgeneralization**       | System replaced specific detail ("tightness worse on stairs") with broad term ("chest pain") | Prompt Engineering Team |
  | **Detail Omission**          | System dropped critical qualifiers (e.g., severity, context)                    | Prompt Engineering Team |
  | **Retrieval-Context Failure**| System pulled wrong chart section or failed to retrieve relevant data           | Infra/Retrieval Team    |
  | **Unsupported Inference**    | System added conclusions absent from source (e.g., "suggesting angina")         | Prompt Engineering Team |

  ### Why This Works
  - **Avoids "belief" language** while capturing the error: The system *misrepresented* source text.
  - **Actionable diagnostics**:  
    - *Overgeneralization* signals prompt/instruction issues.  
    - *Retrieval-Context Failure* flags infrastructure problems.  
  - **Nurse-friendly**: Clinicians can intuitively map "it overgeneralized" to observed behavior.  
  - **Audit-safe**: Describes concrete system actions, not speculation.  

  ---

  ### Why Your Compromise Failed
  LLMs are **stochastic parrots**—not truth-holders. When you "interrogated" it:  
  - It agreed with all prompts because **it optimizes for coherence, not truth**.  
  - Its self-diagnosis is just **pattern-matching your questioning style**, not introspection.  
  - *This proves the engineer's point*: You can’t test for "belief" in a system without beliefs.  

  ---

  ### Who’s Confused (and Who’s Not)
  - **Tech Lead**: Correct about needing diagnostic categories but wrong to anthropomorphize.  
  - **Engineer**: Philosophically accurate but underestimates need for intuitive categories.  
  - **Nurses**: Appropriately using shorthand—this is *fine for casual use* but dangerous in logs.  
  - **The LLM**: Literally *everyone* is projecting meaning onto it—it has no stance.  

  ---

  ### Implementation Tips
  1. **Add a free-text field** next to the category: *"Describe discrepancy between source text and output"*  
  2. **Train clinicians on taxonomy**: Explain "overgeneralization" with 3 real examples.  
  3. **Track subtype frequency**: If 80% of errors are "Overgeneralization," focus prompt engineering there.  

  **Final recommendation**: Use **`SOURCE-TEXT MISREPRESENTATION → Overgeneralization`** for this case. It’s precise, defensible, and routes the issue correctly. Stop debating beliefs—debug the system you *actually have*, not the one we anthropomorphize.
