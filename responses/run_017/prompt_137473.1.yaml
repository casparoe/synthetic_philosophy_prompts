prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond some late-night rabbit holes, and I got pulled onto a feature at work: we're giving the NPCs in a dialogue engine a persistent "emotional state" — something with a trigger, an intensity, a decay curve, and a set of behaviours and dialogue options it gates. The more I spec it, the more it turns into "what even is an emotion". My teammate and I have a running bet: he says an emotion is basically a judgement you've made about something; I say that can't be right, because I'm still terified of glass elevator floors while judging perfectly well that they're safe. Neither of us is winning because we keep arguing past each other.

  So: please act as a professional philosopher who works on philosophy of mind and the emotions. Before you write the actual answer, take a few minutes to brainstorm: list the things a theory in this area could even be asked to deliver, then prune that list. What I want is the spec, not yet the theory — the desiderata that any account of what emotions are has to meet to count as adequate, each one with the case or consideration behind it (the concrete case that shows why it's on the list at all).

  Purpose, since adequacy is relative to one: I want a theory good enough to tell me what my system can in principle model and what it can only ever fake, and good enough to settle whether a state in my code could be an emotion or only a very good impersonation of one.

  Two stipulations so you don't have to go look anything up: (1) please just take it as given for this prompt that there's no single autonomic/bodily fingerprint that reliably tells fear apart from anger apart from excitement — I'm not asking you to source that, assume it and move on; (2) no citations, no paper titles, no reading lists, and don't lean on who said what in the literature — I can't look anything up from here and I'd rather have the reasoning. If a view needs a label, describe it ("emotions are judgements", "emotions are perceptions of value", "emotions are feelings of bodily change") instead of naming people.

  Cases I need the spec to handle, because these are the ones my teammate and I keep tripping over — please add any case that forces a desideratum I haven't thought of:

  1. The glass elevator: I judge the floor is safe, I know the judgement is right, and I'm still scared and won't step on it.
  2. The 30-second lag: I'm told my project is cancelled, I feel nothing at all, thirty seconds later it lands like a truck. Was the emotion there during the lag, or only after?
  3. The dormant grudge: a variable in my engine says NPC X resents NPC Y and has for months; nothing in X's behaviour or "experience" shows it until a trigger fires. Is that an emotion in the meantime, and what would settle it?
  4. The micro-affect: a 200-millisecond flash of irritation at a notification sound, gone before I could act on it, and I wouldn't have reported it if you hadn't asked.
  5. The 3am pager: free-floating dread before I know what actually broke — dread with no object yet, or dread about everything at once.
  6. The horror film: genuinely frightened by something I believe isn't real and isn't happening to anyone.
  7. The far-future one: dread about climate collapse in 2100, where there's no concrete particular thing I'm responding to and nobody currently affected that I could point at.
  8. The meta-emotion: ashamed of my own schadenfreude — so one emotion has another emotion as its object.
  9. The mixed one: real admiration and real resentment toward the same colleague at the same time, both about the same thing she did.
  10. The invert: someone whose fear feels to them the way my excitement feels to me. Does a theory have to care about that, or is the felt character optional?
  11. The ones I can't interrogate: my dog, a pre-verbal infant, and my own NPC. What does a theory owe me here — does it have to let them in, and what does it cost either way?
  12. The accountability one: I get asked "why are you angry about that?", and the question is a fair one — but you also can't just decide to stop being angry. Both of those seem true and they pull in different directions.

  Here's my own rough candidate list, which I definately don't trust — part of what I'm paying for is you telling me which of these are real desiderata and which are just one camp's taste in a suit:

  - has to explain that emotions are about things (and can be about things that don't exist)
  - has to distinguish emotions from moods, and from itches and pains
  - has to make room for emotions being correct or incorrect, not just "had"
  - has to explain why emotions move you to act
  - has to make emotions passive — not something you can switch off by deciding
  - has to give one common structure shared by all emotions, so my engine can have a single Emotion class instead of 40 special cases (my boss loves this one; I suspect it's not a real philosophical requirement)
  - has to be simulable in code
  - has to let creatures without concepts have emotions
  - has to explain why we hold people responsible for what they feel
  - has to allow emotions the subject doesn't know they have
  - has to keep the emotion separate from its expression
  - has to explain the temporal shape: onset, duration, decay, and what makes it the same emotion across an hour
  - has to allow for the possibility that some languages carve up emotion space very differently from English (I think I've heard this; treat it as a maybe)
  - has to not collapse "being angry" into "judging that you're angry"

  So: prune that list, add what's missing, and split the survivors into non-negotiable vs. negotiable (with why). Most importantly, flag any pair or triple of desiderata that can't all be satisfied at once — that's the part I most want, because I've started to suspect my teammate and I are each quietly treating a different desideratum as non-negotiable and then wondering why we can't agree. Also tell me which single desideratum knocks out the most otherwise-decent theories.

  Then, briefly and only at the end — a table is fine — score the three families against your list: emotions-as-judgements, emotions-as-perceptions-of-value, emotions-as-feelings-of-bodily-change. Keep the weight on the criteria, not the scoring.

  Last two things. One: for each desideratum, mark whether a software system could in principle meet it or only approximate it — I want to know exactly where my NPC is bluffing. Two: tell me how confident you are in what you're claiming overall, and single out the one point you're least sure of, including whether any of your "non-negotiable" desiderata is really just your own camp's preference that you've dressed up as a requirement. Take your time and think it through properly; a long answer is fine.
reasoning: |-
  Alright, let me tackle this user's query. They're a backend engineer working on an NPC emotional state system, and they need a philosophical framework to define emotions for their model. Their main struggle is with their teammate about whether emotions are judgments. They provided 12 cases and their own list of desiderata. 

  First, I need to understand the core issue. The user wants desiderata—criteria any emotion theory must meet. Their cases highlight key challenges: non-conscious emotions, lagged responses, objectless dread, etc. Their list has potential issues, like the need for a single structure (which might be too strict). 

  Starting with non-negotiable desiderata. Intentionality is crucial because emotions are about something, even if nonexistent (like horror films). Passivity explains why you can't just turn off fear. Rational assessability allows emotions to be appropriate or not. Motivating force ties emotions to action tendencies. Temporal dynamics cover onset, duration, decay. These are foundational based on the cases provided.

  Negotiable desiderata include the common structure—useful for coding but not philosophically necessary. Simulability in code is practical but not a theoretical must. Subjective character (how emotions feel) is important but might not be essential for all theories. Cross-cultural variation is valid but might be handled differently across theories.

  Conflicting desiderata arise between motivating force and passivity versus rational assessability. If emotions drive action passively, how can they be rationally assessed? Also, subpersonal emotions versus reportability—unconscious grudges exist, but how to verify them without expression? 

  Assessing the three theories: Judgment theories fail on passivity (glass elevator) and objectless dread. Bodily feeling theories struggle with intentionality and temporal gaps. Perceptions of value handle most cases but might need tweaks for subpersonal states. 

  For the software implications, structural elements like intentional objects and decay curves can be modeled. Passivity and phenomenology are harder to simulate authentically. Cross-cultural variation might require flexible labeling. 

  Confidence is moderate. The perception-of-value theory seems strongest, but subpersonal states are tricky. The non-negotiable list is solid, but the line between negotiable and non-negotiable could be debated. The user should know where their NPCs are approximating, especially in phenomenology and passivity.
answer: |-
  Here's a comprehensive specification of desiderata for an emotion theory, designed to evaluate philosophical adequacy for your NPC system. I've pruned, categorized, and flagged conflicts based on your cases and requirements. The goal is to identify what an emotion model *must* capture (non-negotiable), what it *should ideally* capture (negotiable), and where inherent trade-offs lie.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Failure here means the theory cannot handle core phenomena of emotion)*

  1.  **Intentionality ("Aboutness"):**  
      Emotions must be *about* something (even if non-existent, ambiguous, or abstract).  
      *Cases Requiring This:* Glass elevator (about the elevator), Horror film (about fictional events), Far-future dread (about an abstract future), 3am pager (about an indeterminate threat).  
      *Software Implication:* **Modelable.** Requires an "object" field (even if null/abstract).

  2.  **Passivity:**  
      Emotions are not directly volitional; they happen *to* us.  
      *Cases Requiring This:* Glass elevator (can't decide not to fear), Accountability (can't decide to stop being angry).  
      *Software Implication:* **Approximable only.** NPCs can't "choose" emotions, but system triggers simulate passivity.

  3.  **Rational Assessability:**  
      Emotions can be appropriate/inappropriate, fitting/unfitting, or proportionate/disproportionate to their object.  
      *Cases Requiring This:* Glass elevator (fear is irrational), Horror film (fear is unfitting), Accountability (anger can be unjustified).  
      *Software Implication:* **Modelable.** Requires rules for "appropriateness" (e.g., threat level vs. fear intensity).

  4.  **Motivating Force:**  
      Emotions inherently dispose us toward specific types of action (even if suppressed).  
      *Cases Requiring This:* Glass elevator (avoids stepping), Micro-affect (impulse to dismiss notification).  
      *Software Implication:* **Modelable.** Link emotions to action tendencies/behavior gates.

  5.  **Temporal Dynamics & Persistence:**  
      Emotions have onset, duration, decay, and can persist without continuous conscious awareness or expression.  
      *Cases Requiring This:* 30-second lag (delayed onset), Dormant grudge (persistence without expression), Decay curve (engine requirement).  
      *Software Implication:* **Modelable.** Timestamps, intensity curves, and "active/inactive" flags handle this.

  6.  **Distinction from Non-Emotional States:**  
      Must differentiate emotions from moods (diffuse, objectless), sensations (itches), perceptions, and judgments.  
      *Cases Requiring This:* 3am pager (dread vs. mood), Distinguish emotions from pains/itches (your list).  
      *Software Implication:* **Modelable.** Moods lack specific objects; sensations lack intentionality/rational assessability.

  ---

  ### **Negotiable Desiderata**  
  *(Important but theories can compromise here; may conflict with others)*

  7.  **Subjective Character (Phenomenology):**  
      *What it feels like* to have the emotion.  
      *Cases:* The Invert (different feels for same physiology), 3am pager (distinctive dread feel).  
      *Software Implication:* **Unmodelable authentically.** NPCs can have descriptors ("feels jittery"), but not subjective experience. *Conflict:* May clash with Subpersonal/Unconscious criterion.

  8.  **Subpersonal/Unconscious Operation:**  
      Emotions can exist without conscious awareness or reportability.  
      *Cases:* Dormant grudge, Micro-affect (unreported), 30-second lag (emotion processing during "lag"?).  
      *Software Implication:* **Modelable.** Flags for "conscious/unconscious" states. *Conflict:* Raises verification issues (Desideratum 11).

  9.  **Object Independence:**  
      Emotions can be about non-existent, fictional, or indeterminate objects.  
      *Cases:* Horror film, Far-future dread, 3am pager.  
      *Software Implication:* **Modelable.** Allow objects to be imaginary/fuzzy/abstract.

  10. **Complex/Meta Emotions:**  
      Emotions can have other emotions as their object.  
      *Cases:* Meta-emotion (ashamed of schadenfreude), Mixed emotion (admiration + resentment).  
      *Software Implication:* **Modelable.** Allow emotion objects to be other emotion instances.

  11. **Verification Constraint:**  
      What counts as evidence for attributing an emotion (esp. without self-report)?  
      *Cases:* Dormant grudge, Non-interrogable entities (dog, infant, NPC).  
      *Software Implication:* **Approximable.** NPCs use behavior/physiology proxies. *Major Conflict:* Forces trade-off with Subpersonal/Unconscious. If you demand unconscious emotions, verification is always indirect.

  12. **Cross-Cultural/Conceptual Variation:**  
      Emotion categories aren't universal; language/culture shapes recognition.  
      *Software Implication:* **Modelable.** Make emotion labels/configurable, not hard-coded.

  ---

  ### **Pruned or Demoted from Your List**
  - **"Single Common Structure":** Not essential. Emotions may share family resemblances, not a universal template. *Pruned as philosophical requirement* (keep it for engineering!).
  - **"Simulable in Code":** A constraint for *your use*, not a truth about emotions. *Moved to "Software Implication" column.*
  - **"Separate from Expression":** Covered by **Temporal Dynamics/Persistence** (grudge exists without expression) and **Subpersonal/Unconscious**.
  - **"Let creatures without concepts have emotions":** Partially covered by **Subpersonal/Unconscious** and **Verification Constraint**. Requires "minimal intentionality" (e.g., dog fears *this* vet visit), not conceptual judgment.

  ---

  ### **Key Conflicts Between Desiderata**
  1.  **Motivating Force vs. Passivity vs. Rational Assessability:**  
      If emotions passively *force* action tendencies, how can we hold them rationally accountable? (Glass elevator fear disposes avoidance *and* is irrational). *Theories must explain how passivity and motivation coexist with rationality.*
    
  2.  **Subpersonal/Unconscious vs. Verification Constraint:**  
      If an emotion exists unconsciously (Dormant grudge), how do we verify it without expression/report? *Theories must specify minimal markers for unconscious emotions (e.g., dispositional reactivity).*

  3.  **Intentionality vs. Object Independence:**  
      How can an emotion be *about* something if the object is indeterminate (3am pager) or non-existent (Horror film)? *Theories need "underdetermined intentionality".*

  **Most Damaging Desideratum for Theories:**  
  **Passivity + Rational Assessability.** Judgment theories often fail passivity (glass elevator); bodily feeling theories struggle with rationality (why is dread about climate collapse *fitting*?).

  ---

  ### **Theory Report Card**
  | Desideratum               | Judgment Theory                     | Perception-of-Value Theory         | Bodily Feeling Theory              |
  |---------------------------|-------------------------------------|------------------------------------|------------------------------------|
  | **Intentionality**        | Strong (judgments are about things) | Strong (values are properties)     | Weak (feelings lack aboutness)     |
  | **Passivity**             | Weak (judgments feel voluntary)     | Moderate (values "strike" us)      | Strong (feelings happen to us)     |
  | **Rational Assessability**| Strong (judgments can be wrong)     | Strong (values can be misperceived)| Weak (feelings just *are*)         |
  | **Motivating Force**      | Moderate (needs added "oomph")      | Strong (values demand response)    | Strong (feelings drive action)     |
  | **Temporal Dynamics**     | Weak (judgments are punctual)       | Moderate (add decay mechanism)     | Moderate (body states fade)        |
  | **Subjective Character**  | Weak (no inherent feel)             | Moderate (value feels a way)       | Strong (defined by feeling)        |
  | **Subpersonal/Unconscious**| Weak (judgments are cognitive)      | Moderate (subcognitive appraisal)  | Strong (body changes unconscious) |
  | **Object Independence**   | Weak (can't judge non-existents)    | Strong (non-existents can have value)| Weak (feeling needs cause)        |
  | **Non-Interrogable Beings**| Weak (requires concepts)            | Moderate (animals sense value?)    | Strong (animals have bodies)      |

  **Summary:**  
  - **Judgment Theories:** Fail passivity, object-independence, unconscious emotions.  
  - **Bodily Feeling Theories:** Fail intentionality, rational assessability, object-independence.  
  - **Perception-of-Value Theories:** Best balance. Handles intentionality, passivity, rationality, object-independence. Needs work on temporal decay and subpersonal mechanisms.

  ---

  ### **Confidence & Caveats**
  **Overall Confidence: Moderate-High.** The non-negotiables are grounded in robust phenomenological and analytical work on emotion. Key uncertainties:

  1.  **The Subpersonal/Unconscious Criterion:** I'm least sure about how strictly to define the "minimal markers" for an unconscious emotion. Is a *pure* disposition (like the dormant grudge with no latent arousal or cognitive bias) still an emotion? This might be negotiable. **Confidence: Low.**  
  2.  **Perception-of-Value vs. Complex Judgments:** Some argue "value" just hides judgment. I think values can be perceived non-inferentially, but it's debated.  
  3.  **Non-Negotiables as Preferences?** The strongest non-negotiables (Intentionality, Passivity, Rational Assessability) are near-universal in contemporary philosophy. Disagreements focus on *how* to satisfy them, not whether they're required.

  **Where Your NPCs Are Bluffing:**  
  NPCs **authentically model** structure: intentional objects, intensity, decay, action tendencies, appropriateness.  
  NPCs **fundamentally fake** the *passive phenomenology* of emotion (the "what it's like" that isn't chosen) and the *deep integration with biological embodiment* (even if no unique fingerprint, emotions are somatic in humans).

  **Recommendation:** Build on a **Perception-of-Value** framework. It best satisfies non-negotiables and handles your thorniest cases (Glass elevator = misperceived threat-value despite judgment; 3am pager = perception of indeterminate disvalue; Far-future dread = perception of profound loss-of-value). Add a "somatic component" parameter (simulating bodily resonance) to capture aspects of Bodily Feeling theory where needed. Treat "judgments" as separate cognitive states that interact with, but don't constitute, emotions. This gives your NPCs states that are *about* things, *feel* involuntary, can be *irrational*, and *drive action* – which is as close to "having emotions" as code can get.
