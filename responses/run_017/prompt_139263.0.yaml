prompt: |-
  You're a decision theorist — the kind who has genuinely spent time on prospects whose expected values don't exist, not just the tidy textbook cases. Take your time and think it through properly: sketch two or three candidate procedures internally, then commit to one and defend that one. Lead with your bottom line in the very first sentence — the actual recommendation, in one sentence — and only then give the reasoning. No preamble, and please don't restate my question back to me.

  Some background. I run the allocations team at a small biomedical venture fund: five of us, we take maybe fifteen positions a year but pre-screen four times that many, and anything we put forward has to survive a half-day committee that includes our CFO, two clinicians and a donor rep, none of whom have any stats past a intro course. The payoffs here have the usual venture shape — most things return zero, a few return 20 to 100x — and when we fit power-law tails to the return distribution the fitted exponent lands right around 1. Depending on the estimator and the window we get 0.9 or we get 1.1, which I take to mean we literally cannot tell, from any data we could have, whether the mean of the thing we're buying exists at all. My colleague Priya says that means we should stop computing means altogether and rank everything by first-order stochastic dominance where it applies, and simply refuse to rank where it doesn't. My other colleague Dave has a different fix: compute the truncated expectation below the p-th percentile as p goes to 1, and if that sequence settles, use the limit; if it oscillates, declare the two prospects EV-incomparable and break the tie with medians, then with the 5th percentile. He keeps invoking the Pasadena game as the canonical case — coin flipped until heads, payout something like 2^n/n with the sign alternating each toss, so the naive EV series is 1 - 1/2 + 1/3 - ... which comes to about 0.69 but only conditionally, and someone told me you can rearrange it to add up to more or less anything. Both of them also want an infinite or undefined expectation to fire a model-misspecification flag and force a refit with a capped tail.

  What I actually need is a procedure my team can run, not a seminar. Ordered questions to ask about a proposal, what counts as a sufficient answer to each, where the procedure just stops and returns a no, and where it hands the decision to a person because what's left is a values question rather than a factual one. It has to be executable in half a day by someone whose measure theory is nonexistent, and explainable on one slide. Be explicit about whether Dave's ladder and Priya's dominance-first rule survive the translation: if you keep the ladder, say whether the tie-break order (median, then 5th percentile) is doing hidden work, and whether the whole thing is invariant to how we coarsen the outcome space or is just an artifact of one way of writing the contract down. One more thing — we don't make these bets once, we make forty a year, so tell me what repeated exposure does to the problem, because I suspect it doesn't rescue things the way people assume.

  Then run it on three cases. First, a literal one-off: a counterparty offers us, for a $2 fee up front, a contract with exactly the Pasadena payoff structure. Second, a real allocation choice: Program A, a platform bet in a modality where our tail fit sits right at α ≈ 1 and we honestly cannot say whether the mean exists, versus Program B, a boring licensing deal with a well-estimated finite mean roughly three times smaller than whatever number A's model spits out. Third, and this is the one I want you to be blunt about: our flagship moonshot, which I personally pushed for and which the committee already likes — call it 0.5% chance of returning 400x, essentially nothing otherwise, and it's the reason half our LPs came in. If your procedure passes on it, say so plainly and tell me what would have to be different for it to say yes. Close by telling me what the procedure cannot do: the questions it is simply the wrong instrument for.
reasoning: |-
  Alright, let me tackle this step by step. The user runs a biomedical venture fund and needs a practical decision procedure for evaluating investments with potentially undefined expected values. The key challenges are: power-law tails with exponents near 1 (meaning mean may not exist), non-technical committee members, and the need for a repeatable process.

  First, I consider Priya's stochastic dominance approach. While theoretically clean, it'll be too indecisive for venture capital where most opportunities have crossing payoff distributions. Dave's truncated expectation method is more practical but introduces arbitrary cutoff points and tie-breakers that might not hold up under scrutiny.

  The core conflict is between mathematical rigor and operational practicality. For repeated bets, the strong law of large numbers won't rescue undefined means - the sample average won't converge. This fundamentally changes the risk profile.

  I sketch three candidate solutions:
  1) Strict mean-based rejection (too restrictive)
  2) Stochastic dominance with fallback metrics (too vague)
  3) Truncation with sensitivity analysis (best balance)

  The winner is a practical truncation procedure with pre-set cutoffs, using the 99th percentile based on their deal volume. This provides a stable reference point while acknowledging the arbitrariness. Tie-breakers like median and 5th percentile are defensible for venture contexts where downside protection matters.

  For the cases:
  1) Pasadena game gets rejected - too unstable
  2) Program A vs B: A wins if its truncated mean exceeds B's, with median as tie-breaker
  3) Flagship moonshot passes only if its truncated mean clears the hurdle rate, else gets flagged for committee override

  The procedure's limits: can't handle correlated failures, non-monetary values, or true ambiguity. But for their stated needs, it provides actionable framework.
answer: |-
  **Recommendation:** Adopt a truncated expected value procedure with a fixed, high percentile cutoff (99th), report that truncated EV alongside the median and 5th percentile, escalate to committee if the truncated EV is unstable under sensitivity analysis (±5% cutoff change), and explicitly flag bets where the tail exponent α ≤ 1 as "model-unspecified tail risk."

  ### Reasoning & Procedure
  1. **Why truncation over dominance or convergence?**  
     - Priya's stochastic dominance is too weak: most venture bets cross (e.g., A has fatter tail but B has better median), leaving too many unranked.  
     - Dave's limiting EV is fragile: the Pasadena game shows convergence depends on *how* you approach infinity (cutoff vs. weighting). Your team lacks the math to diagnose this.  
     - Truncation at a fixed high percentile (99th) is stable, computable, and explainable: "We ignore the top 1% of outcomes to avoid unrealistic extremes."

  2. **The Core Procedure**  
     For any prospect, ask these questions in order:  
     - **Q1:** What is the expected value if we cap all payoffs at the 99th percentile?  
       *Sufficient:* A single number from your model.  
       *Stop if:* Model lacks payoff distribution (return "no").  
     - **Q2:** Is this truncated EV stable? Recalculate at 94% and 99.5%. Does it change >25%?  
       *Sufficient:* "Stable" (changes ≤25%) or "unstable."  
       *Stop if:* Unstable (escalate to committee with metrics below).  
     - **Q3:** If stable, does α > 1? (If α ≤ 1, append warning: "model misspecification risk in tail").  
     - **Output:** Rank by truncated EV. Ties broken by:  
       1. Higher median (downside resilience),  
       2. Higher 5th percentile (worst-case floor).  

  3. **Why 99%? Why median then 5th?**  
     - 99% cutoff: Balances robustness and relevance. With 60 deals/year, you’ll see >1 deal exceeding this in 5 years — rare but not ignorable.  
     - Median first: In power-law worlds, median is robust and captures "typical" loss. 5th percentile breaks residual ties by minimizing ruin risk.  
     - *Not invariant to coarsening*, but your contracts have defined payment thresholds — use those.  

  4. **Dave & Priya’s Ideas**  
     - Dave’s ladder: Replaced by fixed truncation + sensitivity. Tie-breaks are necessary and intuitive (no hidden work).  
     - Priya’s dominance: Used only if Q1/Q2 are identical (vanishingly rare).  

  5. **Repeated Exposure Changes Nothing**  
     If true mean doesn’t exist (α ≤ 1), the sample average doesn’t converge. A 400x moonshot with undefined EV won’t "balance out" — it introduces extreme path-dependence.  

  ---

  ### Case Applications
  1. **Pasadena Game ($2 fee)**  
     - Truncated EV (99%) is finite but *unstable*: Varies wildly with cutoff.  
     - **Output:** "Unstable truncated EV" → Escalate to committee. Reject if stability is required.  

  2. **Program A (α ≈ 1) vs. Program B (3x smaller mean)**  
     - Assume A’s truncated EV (99%) = $30M, B’s = $10M.  
     - A’s EV is unstable if α ≈ 1 (sensitivity test changes >25%).  
     - **Output:** Escalate A/B comparison to committee with:  
       - A: Truncated EV = $30M (unstable), median = $0, 5th %ile = -$500k  
       - B: Truncated EV = $10M (stable), median = $2M, 5th %ile = -$250k  
       *Committee decides based on risk appetite.*  

  3. **Flagship Moonshot (0.5% @ 400x, else $0)**  
     - Truncated EV (99%) = $0 (400x outcome is in top 0.5% → capped to $0).  
     - Median = $0, 5th %ile = $0.  
     - **Output:** **Reject** by procedure. To pass:  
       - Need a *minimum positive outcome* (e.g., 10% chance of 1x) to lift median/5th %ile, or  
       - Cap payoff below 99.5% (e.g., "payout max 200x") to make truncated EV >0.  

  ---

  ### What This Procedure Cannot Do  
  1. **Handle deeply correlated bets** (e.g., pandemic wiping out all biotech).  
  2. **Value non-monetary impacts** (e.g., reputational effects).  
  3. **Resolve true ambiguity** (e.g., rival models with α=0.8 vs. α=1.2).  
  4. **Replace committee judgment** on tail risks — it forces transparency but doesn’t decide.  

  **Final Slide Text:**  
  "Step 1: Model capped EV (ignore top 1%).  
  Step 2: Test stability (±5% cutoff). Unstable? → Committee.  
  Step 3: Rank capped EV. Tie? → Higher median → Higher 5th %ile.  
  Always flag if tail exponent ≤1."
