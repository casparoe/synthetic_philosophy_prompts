  Moreover, the build system framework makes explicit the functional nature of grounding: an artifact is built by a function from its dependencies. This functional view is not always explicit in the metaphysical debate. But it also shows that the debate about whether grounding is a relation or a connective might be missing the point: we need both the dependencies (the relation) and the rule (the connective). 

