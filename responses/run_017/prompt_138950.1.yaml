  2. **Theses that translate only with imported assumptions**:
     - The in-virtue-of relation: we have both edges and rules. We must assume that the build rule is part of the grounding relation, but the rule is not an artifact. In metaphysics, grounding is usually a relation among facts. So we are importing the idea that the rule (a function) is acceptable as part of the grounding relation. Alternatively, we might say that the rule is a necessary part of the system, but not part of the grounding relation. Then the grounding relation would be the dependency edge, but that alone does not determine the content. So we need to import the rule.
     - Counterfactual dependence: in build systems, if a dependency changes, the artifact may change (if the rule uses it). But we assume that the dependency is necessary for the artifact (in the sense that if we remove the dependency, the build fails). We import the assumption that every dependency is used by the rule (no dead code). Without that, counterfactual dependence is not guaranteed.

  3. **No counterpart**:
     - The debate about whether grounding is a relation or a connective: in build systems, we have both. The relation (edge) and the connective (rule) are both essential. But the rule is not a fact, so it doesn't fit neatly as a relation among facts. There isn't a direct counterpart for the rule in the metaphysical debate (which typically only discusses facts). 
     - The idea that grounding might be sensitive to more than what holds across possible worlds: in build systems, with content addressing, we collapse necessary equivalence. So we don't have the structure to represent two different grounding paths that lead to the same fact (because they are the same artifact). But in metaphysics, one might argue that the same fact can be grounded in different ways. This is lost.

  Two specific points:

  1. **Inversion of focus (top-level vs. leaves)**:
     - This is a genuine feature of build systems. In a build system, the user cares about the top-level targets (the outputs) and the leaves are just the inputs. In metaphysics, the fundamental (leaves) are the focus because they are the bedrock. But note: in a build system, the leaves are given and not explained by the system. So the inversion is real. It suggests that in metaphysics, the fundamental are taken as given and the non-fundamental are explained in terms of them, but the point of the explanation is to account for the non-fundamental (the top-level). So it's a matter of perspective: the metaphysician is interested in the entire structure and the fundamental are the starting point, while the build system user is interested in the outputs and the inputs are the starting point. It's not a distortion, but a genuine feature that highlights that the focus of interest is the non-fundamental (which the build system produces) and the fundamental are the means.

  2. **Content addressing and necessary equivalence**:
     - This is a genuine feature of the build system framework. It forces that necessary equivalence implies identity. In the metaphysical debate, this is a point of contention: whether two facts that are necessarily equivalent are the same fact. The build system framework settles this by design. Therefore, if we are to use the build system as a model, we are forced to accept that necessary equivalence implies identity. This is a distortion if the metaphysical debate allows for hyperintensional contexts (where necessary equivalence does not imply identity). So it is a genuine feature of the framework, but it is a distortion of the metaphysical debate because it rules out hyperintensionality.

  Residue as a whole:

