prompt: |-
  You are a professional philosopher who works on population ethics and on decision-making under deep uncertainty. Take your time with this: brainstorm several candidate explanations before committing to one, and tell me which you find most plausible and why.

  I'm a risk economist, and about six months ago I joined a foundation that funds work on very-long-term risks. In meetings I keep hitting the same asymmetry. My colleagues will cheerfully multiply a small, barely estimable probability by an astronomically large number of possible future lives when the sign is positive: a one-in-a-hundred chance of losing a civilisation's worth of future value is treated as obviously warranting very large present-day expenditure. Run the same multiplication with a negative sign — a one-in-a-hundred chance of a future containing vastly more suffering than happiness, the sort of thing people here call s-risks — and the response flips to "that's science fiction", "you can't put a number on that", "we should be humble", with the burden of proof treated as effectively unmeetable. Same people, same orders of magnitude, same epistemic position, same readiness to spend money now.

  I've run the obvious explanations and they seem to point the wrong way, and I'd like you to say why they fail as well as what does fit. Loss aversion, negativity bias, dread, and the affect heuristic should all make a bad tail more urgent, not less; so should an implicit maximin. It isn't act versus omission or status-quo bias, since both responses are active spending. It isn't scope neglect as usually described, because the same people take numbers of that size perfectly seriously when the sign flips. And it survives among colleagues who endorse a fully symmetric axiology, counting a unit of suffering and a unit of happiness as equal and opposite.

  So what is this? Is there an established concept or literature for it, or is it several different things that I am conflating? Is it best read as an implicit axiological asymmetry, as an epistemic asymmetry that might actually be defensible — a real difference in the kind of evidence available, or in who bears the burden of proof — or as something motivational? Where are its edges: does the same reversal show up if you substitute pandemic risk for extinction risk, or is there something specific about suffering? If nothing established fits, coin a term, define it, and describe a case that would test whether it is present. A bare label will not answer my question.
reasoning: |-
  Okay, the user is a risk economist working at a foundation focused on very-long-term risks. They've noticed a consistent asymmetry in how their colleagues approach potential positive and negative tail risks. Specifically, colleagues are quick to act on small probabilities of losing future civilization value but dismiss similar probabilities of catastrophic suffering futures (s-risks) as unquantifiable or speculative. The user has already considered and rejected several common psychological biases as explanations since those would predict greater urgency for negative outcomes, not less. They're looking for a deeper philosophical or psychological explanation.

  First, I need to unpack why standard explanations don't fit. Loss aversion and negativity bias usually make people more responsive to negative outcomes, but here the opposite is happening. The colleagues are more motivated by preventing loss of potential happiness than preventing immense suffering. That's counterintuitive. The user mentions their colleagues even endorse symmetric axiology—valuing suffering and happiness equally—which makes this asymmetry even more puzzling.

  Next, I should brainstorm possible explanations. Let me list them out. One angle could be axiological invisibility: suffering risks might lack concrete reference points compared to extinction risks, which we can imagine based on existing civilizations. Another thought is epistemic learned helplessness—maybe people feel they can't influence suffering risks as effectively, leading to disengagement. Then there's the concept of axiological anchoring, where our moral intuitions are anchored to current experiences, making extreme suffering seem alien compared to happiness.

  Also, consider the burden of proof asymmetry. For positive outcomes, the default assumption might be a neutral or positive future, so preventing extinction preserves that. But introducing suffering risks requires proving a deviation from that baseline, which feels harder. Motivational factors like scope insensitivity for suffering could play a role too; maybe the mind fails to grasp vast suffering in the same way it can grasp vast happiness.

  I recall literature on future ethics and s-risks. Brian Tomasik's work on suffering-focused ethics emphasizes reducing suffering as a priority. There's also the concept of "Pascalian skepticism" from Greaves and MacAskill, which warns against high-stakes actions under uncertainty. But here, the colleagues apply it only to suffering risks, not extinction risks. That selective application suggests a deeper inconsistency.

  Another angle: ontological qualms. Suffering risks might involve scenarios like AI consciousness or mind uploading, which feel more speculative than asteroid impacts or pandemics. But the user says the epistemic positions are similar, so why the difference in treatment? Perhaps it's not the probability estimation but the moral weight assigned. If suffering is seen as less likely to be real in the future, that could justify the asymmetry.

  Testing the hypotheses is crucial. If it's ontological doubt, then suffering risks from known entities (e.g., factory farming scaled up) might be taken more seriously than digital minds. Epistemic learned helplessness would predict more funding if actionable interventions exist. Scope insensitivity might be tested by varying the magnitude of suffering and seeing if responses scale appropriately.

  The user's deeper need seems to be understanding this bias to effectively advocate for s-risk mitigation within their foundation. They might need actionable insights to present to colleagues, or to refine their own approach. Identifying the root cause could help in framing arguments that resonate, or developing strategies to counteract the asymmetry.

  After evaluating, axiological anchoring combined with burden of proof asymmetry seems most plausible. Humans are anchored to a suffering-light present, making vast suffering seem alien, while future happiness feels like an extension of current joys. The burden falls on proving suffering risks are real, whereas extinction prevention maintains the status quo trajectory. This fits the observed behavior even with symmetric axiology, as the base assumption skews the default. Testing with concrete vs. abstract suffering scenarios could validate this.
answer: |-
  As a philosopher specializing in population ethics and decision theory under deep uncertainty, I find this asymmetry deeply fascinating and epistemically significant. After systematic brainstorming, I identify six candidate explanations, evaluate their plausibility, and propose a synthetic resolution. Let's dissect this methodically.

  ### Candidate Explanations & Why Common Biases Fail
  1. **Axiological Invisibility of Suffering States**  
     *Concept*: Suffering lacks positive referents in human experience. While we can imagine enhanced flourishing (extrapolating from art, science, love), extreme suffering (e.g., galaxy-scale torture) has no experiential anchor.  
     *Why common biases fail*: Loss aversion operates on tangible losses (e.g., losing known welfare), but s-risks involve losing a hypothetical "non-suffering default" we never possessed. Dread requires concrete imagery, which s-risks lack.  
     *Plausibility*: High for suffering-specific cases; less for pandemic risks.

  2. **Epistemic Learned Helplessness**  
     *Concept*: When interventions for suffering seem intractable (e.g., "how would we even reduce suffering in digital minds?"), the mind defaults to dismissal. Flourishing-protection feels actionable (e.g., asteroid deflection).  
     *Why burden-of-proof asymmetry?*: Burden shifts to the novel claim (s-risks) because status-quo trajectories assume suffering won't dominate.  
     *Test case*: Introduce an s-risk with a clear intervention lever (e.g., "preventing a bioengineered pain virus"). If asymmetry persists, this fails.

  3. **Teleological Anchoring**  
     *Concept*: Humans implicitly view history as progressing toward greater good. Extinction prevents this telos; s-risks pervert it. Protecting the "arc of progress" feels noble; preventing dystopia feels nihilistic.  
     *Edge cases*: Asymmetry should weaken for non-teleological colleagues (e.g., hard determinists) or for suffering risks framed as "progress interruptions" (e.g., permanent pandemic misery).

  4. **Scope Insensitivity for Suffering**  
     *Concept*: While both large numbers trigger scope neglect, *suffering* may have a logarithmic diminishing-urgency effect ("a trillion pains is only marginally worse than a billion"). Flourishing escapes this due to "peak-end" heuristic biases.  
     *Evidence*: Neurath’s "repugnant conclusion" debates show asymmetric intuitions about adding suffering vs. happiness at scale.

  5. **Ontological Qualms**  
     *Concept*: S-risks often involve non-human consciousness (AI, aliens). Colleagues may grant moral weight more readily to familiar human-like flourishing than unfamiliar suffering entities.  
     *Test*: Substitute "vast human suffering" (e.g., eternal dystopia). If asymmetry remains, this is secondary.

  6. **Motivational Asymmetry in Altruism**  
     *Concept*: Prosocial motivation is stronger for "helping" (preventing loss of goods) than "not harming" (preventing active torment), per Knobe Effect studies. S-risks feel like enabling harm; extinction feels like failing to help.  
     *Why symmetric axiology fails*: Axiological commitment ≠ motivational architecture. We can *believe* suffering is bad while lacking visceral drive to prevent it.

  ### Most Plausible Explanation: **Teleological Burden Shifting**
  I find **Teleological Anchoring + Epistemic Learned Helplessness** the strongest combined explanation. Here’s why:

  1. **The Core Mechanism**:  
     Humans anchor moral reasoning to a perceived default trajectory of history as net-positive. Thus:  
     - *Extinction prevention*: Framed as preserving the default (positive) trajectory. Burden of proof is low—any non-zero probability demands action.  
     - *S-risk prevention*: Framed as diverting resources to combat a deviation from the default. Burden of proof shifts to proving the risk is plausible *and* actionable.  

  2. **Why It Fits Your Observations**:  
     - **Survives symmetric axiology**: Even if suffering/happiness are *axiologically* symmetric, the *baseline assumption* skews asymmetric. Flourishing is the null hypothesis.  
     - **Epistemic asymmetry defensibility?**: Only superficially. The same uncertainty applies to both, but s-risks require overcoming prior odds ("why assume suffering dominates?").  
     - **Edges**: Asymmetry should weaken for:  
       - Non-teleological thinkers (e.g., anti-natalists)  
       - Suffering risks with historical precedents (e.g., industrial-scale torture)  
       - Non-consciousness-dependent risks (e.g., ecological collapse causing pain)  

  3. **Literature Correlates**:  
     - **Derek Parfit**'s *Reasons and Persons*: Asymmetry in how we weigh future lives vs. present suffering.  
     - **Brian Tomasik**'s work on s-risks: Notes dismissal of suffering in longtermism.  
     - **Weber/Johnson on ambiguity aversion**: Under deep uncertainty, agents default to "protect the known good" rather than "prevent novel bads."  

  ### Diagnostic Test
  **Proposal**: Present two scenarios with identical probabilities (1%) and magnitudes (10^38 life-equivalents):  
  - A: *Prevent* a future with 99% flourishing / 1% suffering → framed as "losing civilization's happiness."  
  - B: *Prevent* a future with 1% flourishing / 99% suffering → framed as "avoiding civilization's torment."  

  **Prediction**: If asymmetry persists, it confirms **Teleological Anchoring** (B challenges the "flourishing baseline"). If asymmetry vanishes when suffering is residual, it's **Scope Insensitivity for Suffering**.  

  ### Practical Response
  To counter this:  
  - Frame s-risks as *corruptions of progress* ("ensuring AI aligns with human dignity").  
  - Cite precedents (e.g., factory farming as proof of scalable suffering).  
  - Emphasize *actionable interventions* (e.g., governing AI consciousness architectures) to combat learned helplessness.  

  This asymmetry reveals a deep-seated anthropocentric optimism in longtermist thought. Overcoming it requires not just logical symmetry, but reconstructing the default narrative of the future.
