prompt: |-
  I've been reading LessWrong and its successor forums for something like fifteen years, and the thing I've never managed to get straight is underdetermination. Not the slogan — I grant that evidence never entails a unique theory — but which pairs of theories are supposed to count as a problem. I have fairly stable gut verdicts on individual cases, they don't obviously add up, and I'd like you to try to state the principle I'm implicitly using, or to tell me which of the verdicts has to go.

  Two points of setup, so the answer doesn't get spent on things I already accept. Assume the competing theories are stated precisely, that they entail the same observation sentences, and that they are compared with all auxiliary hypotheses held fixed: I'm setting aside the familiar holism point that any theory can be protected by adjusting an auxiliary. And I'm reserving "underdetermination" for the relation between theories and evidence; what to believe next, or which research programme to fund, is downstream of that and I'd rather keep it separate.

  The cases.

  (1) Two formulations of the same thermal physics: one takes temperature as primitive and states the second law in terms of increasing entropy; the other takes coldness, defined as one over temperature, as primitive and restates every law accordingly, with an explicit dictionary translating each sentence of one into a sentence of the other. My verdict: these are not two theories. There is no underdetermination here, and not because the evidence happens to settle it.

  (2) Two particle theories that fit every measurement to date and diverge only at center-of-mass energies above about 10 TeV, which the next generation of colliders will reach within twenty years. Verdict: not underdetermination in any sense that should worry anybody; this is not-having-the-data-yet. If someone offers it as an instance of the thesis, I think they've changed the subject.

  (3) The classic grue-style pair. Every examined emerald has been green; one hypothesis says the next one is green, the other says it is green if examined before 2050 and blue afterwards. Verdict: I'm not worried, and more than that — I don't think the second hypothesis is a real rival. Not because it is disconfirmed. Because a predicate with that temporal structure isn't, I want to say, the kind of thing a law can cite, or the kind of thing the world can be one way or the other about.

  (4) The apparent-age hypothesis: the world came into existence five minutes ago, complete with our memories, the fossils, and the photons in flight. Verdict: unlike (3), I'm happy to call this a genuine rival — consistent with all the evidence, not a mere redescription — and I reject it flatly. But what rejects it isn't evidence; it's something like prior improbability, or its being a wretched explanation. So: a real rival that loses, as opposed to not-a-rival-at-all.

  (5) Empirical equivalence by duality. Two theories, provably identical in every empirical consequence forever, which disagree about the basic furniture: one describes a four-dimensional spacetime with gravity and no lower-dimensional fields, the other a three-dimensional spacetime with no gravity and a certain family of fields, with an exact dictionary for the observables and none for the ontology. Verdict: this is real underdetermination, and it is the case that actually bothers me. There looks to be a fact about what the world is made of, and evidence will never reach it.

  (6) Divergence about regions we can never observe, not because of any duality but because no signal can ever reach us: the two theories agree about everything inside our observable patch and disagree about the distribution of matter beyond the cosmological horizon. Verdict: I want to say real underdetermination here too — and I notice that I immediately add that it doesn't matter, which I cannot square with (5), where the inaccessible claim is equally inaccessible and I very much do care. Something is distinguishing caring about ontology from caring about remote matters of fact, and I don't know that it's a distinction I can defend under pressure.

  (7) The incommunicable case, which is the one I go back and forth on. Theory A says that an observer sealed inside a perfectly isolated box, who performs a certain measurement and is then destroyed together with the box and every record in it, gets outcome X; Theory B says she gets outcome Y. The theories agree on everything that will ever appear in any record anyone can share. Is there a fact of the matter here that we are merely cut off from, as in (6)? Or is a difference that can never surface in any communicable record no difference at all, as in (1)? My gut flips between those two readings, and it bothers me that I can't tell whether the operative notion is observable-by-someone or available-as-evidence-to-us.

  (8) The simpler rival. Same empirical consequences as our best current theory, for all time, but strictly simpler by every measure I trust: fewer free parameters, shorter axioms, less historical accretion. Verdict: I feel real pull toward switching to it, and I simultaneously feel that switching would be crazy, which makes me suspect that my simplicity tiebreak is doing something quite different from what it was doing in (4).

  (9) The bad-lot case, which I include because I suspect it doesn't belong in this box at all. Two theories on the table both fit, and my actual state is: I expect the truth to be some third theory nobody has proposed yet. Verdict: this is the situation I'm in most of the time, and it seems to me a different problem — about the hypothesis space rather than about the evidence. Tell me if I'm wrong to separate them.

  Here is my tentative principle, which I don't think survives my own verdicts. Two theories are genuinely underdetermined relative to evidence E if and only if: (a) E does not discriminate them; (b) no possible extension of E would either, so the equivalence is permanent rather than an artifact of what we happen to have measured so far; and (c) they are not mere redescriptions of one another. Where they are thus underdetermined, evidence has nothing further to say and the only admissible tiebreakers are prior-theoretic: simplicity, and fit with theories that have independent support in neighbouring domains.

  That handles (1), (2) and (5), I think. But it counts (3) as a genuine rival, which I deny; it makes (4) and (8) symmetric, which they don't feel; and it has no vocabulary for the it-doesn't-matter in (6). So it needs a further clause about which predicates may figure in laws, or a clause about what we're entitled to care about, or it needs to overturn one of my verdicts.

  What I want from you: one principle, or at most two or three candidates, stated precisely enough that I can apply it to new cases myself, with each clause tagged to the case that forces it. Then verdicts on cases I haven't listed — including (7), and at least two cases of your own construction chosen so that they discriminate between your candidates rather than merely illustrating them. Then an honest account of which of my verdicts your best candidate cannot accommodate, and what you'd say to me if I dug in and refused to give them up.

  One last thing, since from where I sit I can't tell which parts of this are load-bearing: as you go, please mark which of your claims are uncontroversial among people who actually work on this and which are live disputes — whether permanent empirical equivalence ever really arises in a mature science, whether the verbal-versus-factual distinction can be drawn at all, whether simplicity is evidence or a pragmatic tiebreak, whether dual theories describe different worlds or the same world twice. If one of your candidates rests on a contested claim, say so explicitly instead of presenting it as where the field has landed; and if my framing above smuggles in a contested assumption of its own, I'd rather be told than humoured.
reasoning: |-
  Hmm, this user has been wrestling with underdetermination for fifteen years. That's a serious investment. They've presented a structured taxonomy of cases with clear verdicts, and they're explicitly asking for a principle that explains their intuitions while flagging where it might break. This isn't a beginner's query—it's a targeted challenge from someone who's read the literature and found it unsatisfying.

  The core tension in their cases leaps out: they accept some empirically equivalent theories as genuine rivals (like the apparent-age hypothesis or spacetime dualities) but reject others (like grue) as "not real." Their proposed principle fails because it can't distinguish these. What they need is a criterion for when theoretical differences are substantive rather than verbal—and when substantive differences matter.

  Breaking it down: their cases cluster into three types. First, non-rivals: thermal physics (1) is clearly notational variance; grue (3) feels like a trick with predicates. Second, rivals that lose: apparent-age (4) is coherent but bad; simpler rival (8) tempts but unsettles. Third, rivals that tie: spacetime duality (5) and cosmology (6) both have permanent equivalence, but ontology feels urgent while distant galaxies don't. Then the wildcards: incommunicable measurement (7) probes what "observable" means, and bad-lot (9) might not belong here.

  Their discomfort with (6) vs (5) is telling. Why care about unobservable ontology but not unobservable galaxies? Probably because the former feels constitutive of reality's nature, while the latter is just contingent detail. But that's metaphysically loaded—and they know it. Their flip-flop on (7) confirms the ambiguity: is evidence what's observable-to-someone or shareable-with-us?

  I'll need to formalize a "substantive variance" criterion. Structural realism handles some cases: if two theories share the same relational structure (like thermal physics), they're equivalent; if not (like spacetime dualities), underdetermination bites. But grue violates structural constraints on projectible predicates, and apparent-age is structurally identical but explanatorily bankrupt. So the principle must weave together structural equivalence, projectibility, and explanatory depth.

  For the response: start by diagnosing their implicit principle as tracking "causal-explanatory substantiveness," then offer three candidate principles of increasing strength. Candidate 1 (structural) handles (1) and (5) but flunks (3) and (4). Candidate 2 adds projectibility to kill grue. Candidate 3 adds explanatory asymmetry to handle apparent-age and simpler rivals. Then confront the normativity in (5) vs (6): caring about ontology might reflect a realist stance, not epistemology. Finally, resolve (7) by distinguishing evidence-as-shareable-record from reality-as-possible-experience.

  Must flag controversies: Quineans reject the verbal/factual distinction; van Fraassen thinks simplicity is pragmatic; Hempel's dilemma challenges "mature science" exceptions. And their verdict on (9) is right—bad-lot is about induction, not underdetermination.

  Tough cases to test: a duality where dictionaries exist but break symmetries (exposes structuralism's limits), and a projectible-but-unexplanatory rival (like a chaotic god tweaking constants daily). If they dig in on caring about ontology in (5), I'll grant that underdetermination doesn't force instrumentalism—but they must own that as a metaphysical choice.
answer: |-
  Based on your case verdicts and the tensions in your proposed principle, I'll formulate a candidate principle that aims to capture your intuitions. The core challenge is distinguishing "substantive" underdetermination (like your cases 5 and 6) from "non-rival" cases (like 1 and 3) and "resolvable" cases (like 4 and 8), while accounting for your asymmetric responses to 5 vs. 6. I'll then test it against your cases and new examples.

  ### Candidate Principle: Substantive Variance Underdetermination (SVU)
  Two theories \(T_1\) and \(T_2\) are **genuinely underdetermined** relative to total possible evidence \(E\) iff:
  1. **Empirical Equivalence**: \(T_1\) and \(T_2\) entail identical observation sentences for all possible evidence \(E\) (permanent equivalence).
  2. **Non-Redundancy**: There is no structure-preserving translation dictionary between \(T_1\) and \(T_2\) that maps all theoretical terms (including laws and ontologies) while preserving *causal-explanatory roles*.
  3. **Substantive Variance**: The theories posit a difference in either:  
     (a) The *causal structure* of unobservable entities/processes, or  
     (b) The *modal profiles* of laws (e.g., counterfactual dependencies, nomological necessities).  
  4. **Irremediability**: No auxiliary hypothesis adjustment, experimental design, or conceptual refinement *within either theory* can break the equivalence without violating the theories' core postulates.

  **Clause origins**:  
  - (1) From your rejection of (2) and acceptance of (5).  
  - (2) From your denial that (1) is underdetermination (dictionary exists) and your acceptance of (5) as substantive (no ontology-preserving dictionary).  
  - (3) From your rejection of (3) (grue lacks causal structure) and your concern for (5) (causal structure differs).  
  - (4) From your rejection of (2) (future evidence will resolve) and acceptance of (5) (no possible evidence resolves).

  **Tiebreakers**: When SVU holds, only *theoretical virtues* (simplicity, explanatory scope, unification) may break ties. But these virtues are **evidential** only if they track *latent causal structure* (e.g., simpler theories often correspond to deeper symmetries). Otherwise, they are pragmatic.

  ---

  ### Verdicts on Your Cases with SVU
  - **(1) Thermal Physics**: **Not underdetermined**. Violates (2): dictionary preserves causal roles (heat flow explanations identical).  
  - **(2) Future Collider**: **Not underdetermined**. Violates (1): equivalence not permanent (future evidence possible).  
  - **(3) Grue**: **Not underdetermined**. Violates (3a): "grue" has no causal-explanatory role independent of temporal indexing.  
  - **(4) Apparent-Age**: **Not SVU**, but **epistemically defective**. Satisfies (1)-(3), but violates (4): auxiliary hypotheses about memory reliability *could* break equivalence if testable. Your rejection is due to *explanatory poverty* (fails theoretical virtues).  
  - **(5) Spacetime Duality**: **Genuine SVU**. Satisfies all: no causal-structure-preserving dictionary, modal profiles differ (e.g., gravity vs. fields sustain different counterfactuals).  
  - **(6) Cosmological Horizon**: **Genuine SVU** but *epistemically inert*. Satisfies all clauses, but the variance lacks *explanatory relevance* to our local causal domain. Your "doesn't matter" intuition reflects this.  
  - **(7) Incommunicable Box**: **Not SVU**. Violates (3a): the outcome difference has no *causal-consequential footprint* outside the box. No difference in modal profiles. (This aligns with "no communicable record = no difference").  
  - **(8) Simpler Rival**: **Not SVU**. Likely violates (2) or (4). If truly identical in *all* empirical consequences, it may be a notational variant. Your unease suggests it violates (3): simplicity without causal variance may be "cheap."  
  - **(9) Bad Lot**: **Separate issue**. Agreed—this is about *inductive risk*, not underdetermination by current evidence.

  ---

  ### New Test Cases
  **Case 10: Symmetry-Broken Duality**  
  *Two quantum gravity theories. \(T_A\): Fundamental spacetime is 4D with supersymmetry. \(T_B\): Fundamental spacetime is 5D with no supersymmetry. A duality map equates observables, but \(T_A\) predicts supersymmetric partners *could* exist if energy scales were higher (counterfactual not in \(T_B\)). All experiments forever constrained to energies where symmetry is unbroken.*  
  - **SVU Verdict**: Genuine underdetermination. Satisfies all clauses: modal variance (3b) via counterfactuals, no causal-role-preserving dictionary (2).  
  - **Why?** Distinguishes from (5) by emphasizing *modal* differences captured in (3b).

  **Case 11: Chaotic God**  
  *\(T_C\): Standard physics. \(T_D\): A deity constantly tweaks particle positions to mimic \(T_C\)'s predictions, with tweaks too fast to detect. The deity leaves no trace beyond ensuring empirical equivalence.*  
  - **SVU Verdict**: **Not underdetermined**. Violates (3a): the deity adds no *causal structure*; it's an explanatory parasite. Rejected like (3) (grue) and (4) (apparent-age).  
  - **Why?** Tests clause (3): positing entities without independent causal roles fails substantive variance.

  ---

  ### Where Your Verdicts Clash with SVU and My Defense
  - **Your Verdict on (4) vs. (8)**: You reject (4) flatly but feel "pull" toward (8). SVU treats both similarly (neither is SVU), but your asymmetry arises because:  
    - (4) is *explanatorily inert* (adds no structure, only subtracts coherence), while (8) *might* point to latent structure (e.g., simpler math → undiscovered symmetry).  
    - **If you refuse this**: Concede that (4) is *technically* empirically equivalent, but reject it because it violates *explanatory norms* (e.g., it makes memories inexplicable). This is a meta-empirical virtue, not evidence.

  - **Your "Doesn't Matter" in (6) vs. (5)**: SVU explains this via *explanatory relevance*. (5)'s ontological variance affects *local* causal laws (e.g., how gravity works here), while (6)'s variance is causally isolated. Caring about (5) reflects a commitment to *causal explanation*, not just ontology.  
    - **If you dig in**: This may stem from *scientific realism*: you believe theories describe mind-independent causal structures, and (5) challenges that. (6) is "just" missing contingent facts.

  - **Your Flip-Flop on (7)**: SVU resolves this by requiring differences to have *causal-consequential signatures* (clause 3a). The isolated measurement affects nothing; it's not a *worldly* difference. If you insist it's real, you're privileging "experience" over shareable evidence—which risks solipsism.

  ---

  ### Controversies and Contested Assumptions
  **In Your Framing**:  
  - You assume the verbal/factual distinction *can* be drawn (contra Quine). SVU relies on this via clause (2).  
  - You treat "prior improbability" in (4) as non-evidential, but Bayesians would call it evidential (via priors). SVU avoids this by invoking *explanatory norms*.  
  - **Controversy**: Van Fraassen (constructive empiricist) would reject SVU entirely, claiming (5) and (6) are equally meaningless since they outrun evidence. Realists (like Boyd) accept SVU's core.

  **In SVU**:  
  - **Contested**: Whether "causal structure" is theory-independent (clause 3a). Norton argues causal relations are model-relative.  
  - **Contested**: Whether modal profiles (clause 3b) are accessible or metaphysical. Empiricists (e.g., Ladyman) might say only actual evidence matters.  
  - **Live Dispute**: Whether dualities (like in 5) describe one world (Wallace) or two (Matsubara). SVU leans realist but doesn't resolve this.  
  - **Uncontroversial**: Permanent empirical equivalence *can* arise (e.g., hole argument in GR), but its epistemic significance is disputed.

  ---

  ### Refined Principle
  If SVU still clashes with your intuitions, consider this weaker variant:  
  **SVU-Lite**: Drop clause (3). Underdetermination holds iff (1) permanent equivalence, (2) no structure-preserving dictionary, (4) irremediability.  
  - *Cost*: Counts grue (3) and apparent-age (4) as underdetermined, which you denied.  
  - *Benefit*: Simpler, avoids contested "causal structure."  

  **Or Stronger**: Add a *pragmatic relevance* clause to (6): "The variance must affect potential explanations within the observable domain."  
  - *Cost*: Makes underdetermination interest-relative.  
  - *Benefit*: Justifies your "doesn't matter" in (6).

  ---

  **Recommendation**: SVU best captures your verdicts if you accept that rejecting grue (3) and apparent-age (4) relies on *explanatory and causal norms*—not just evidence. If those norms feel "extraneous," then underdetermination may be broader than you want, and we need meta-empirical virtues to resolve it. For (7), SVU's causal-consequential requirement should stabilize your gut.
