prompt: |-
  I sit on our hospital's ethics consult service and I'm also trying to draft my own advance directive, and going case by case I've noticed that my gut verdicts about when an earlier self gets to bind a later one don't add up to any principle I can actually state. Here they are:

  1. A woman with advanced Alzheimer's wrote, while clearly capacitated, that she wanted no antibiotics if she ever stopped recognizing her family. She now has pneumonia, seems content, recognizes no one, and would probably resist treatment if it were explained to her. I think we honor the directive and let her die.

  2. A healthy 22-year-old writes that he wants no ventilator if he is ever permanently paralyzed and dependent on others. At 30 he is a C3 quadriplegic, practices law, and says his life is good. I think the directive has no force. But his earlier self was as ignorant of what quadriplegia is like from the inside as the woman in (1) was of dementia — and there I deferred to that ignorance, here I don't.

  3. A man with bipolar disorder, euthymic, signs a psychiatric advance directive authorizing ECT if he later refuses it during a depressive episode, and adds that his refusal is to count as a genuine change of mind only if he has been euthymic for thirty days. He later refuses during a severe episode and meets ordinary clinical standards of competence. I think the earlier self wins, and I also think his clause about which refusals count is legitimate: an earlier self may stipulate the conditions under which the later self's word counts as a revision.

  4. A woman with a strong family history of dementia writes the same kind of clause, except that hers says no revocation counts unless she passes a standardized capacity screening — which she will by construction fail once the dementia arrives. My gut says this one should not be honored, that an earlier self shouldn't be able to make itself permanently unreachable. But I can't say what distinguishes it from (3) except that it is more effective, and greater effectiveness shouldn't be what discredits it.

  5. A secular man becomes devout after a near-death experience during cardiac arrest and refuses a blood transfusion; I think his refusal binds. A devout woman with a written refusal of blood products becomes irreligious and emotionally flattened after a stroke to the frontal lobes and now asks for the transfusion; I think the directive still binds. Both are abrupt value changes following a brain event, and I go opposite ways.

  My tentative principle: the earlier self governs just in case the later self's divergence is explained either by an impairment of the capacities needed to revise one's values or by the earlier self's ignorance of what the condition is like from the inside; where the divergence is the later self's own informed and unimpaired revision, the later self governs. Lead with your bottom line in the first sentence — the principle, or the candidates you can't choose between — then give the reasoning with no preamble and no restatement of my question. Test it against all five cases, say which of my verdicts it forces me to drop, and state what it predicts for a case I haven't listed: a directive written by someone who has since ended up, by ordinary standards, better off than they expected to be. And tell me whether the principle is supposed to travel outside medicine at all — to a lifetime vow, or an irrevocable precommitment contract signed at 25 and regretted at 45. Please write in American English.
reasoning: |-
  Okay, the user works in hospital ethics and is drafting their own advance directive. They've encountered five cases where their gut reactions conflict, and they can't find a consistent principle. They want me to propose a principle that explains their judgments, test it against all cases, identify where it forces changes, predict a new scenario, and consider applications beyond medicine.

  First, I need to understand each case. In case 1, the Alzheimer's patient's directive is honored despite her current contentment. Case 2, the quadriplegic's directive is ignored. Case 3, the bipolar patient's directive is upheld during a depressive episode. Case 4, the dementia patient's clause is rejected. Case 5, both post-brain-event changes are treated differently: the transfusion refusal stands after conversion but not after stroke-induced apathy.

  Key tensions emerge: ignorance vs. experience (cases 1-2), procedural revocation conditions (cases 3-4), and neurological vs. value-based changes (case 5). The user's instincts suggest valuing autonomy through stable capacity and authentic preference revision. Impairment seems central—whether the later self can genuinely revise values matters more than the change itself.

  I consider a principle: "The earlier self governs unless the later self demonstrates unimpaired, informed value revision." This would validate cases 1 (impaired by dementia), 2 (unimpaired revision), 3 (impairment during depression), and 5 (stroke-induced apathy vs. spiritual awakening). But case 4 poses a problem—the user rejects it despite procedural similarity to case 3. The distinction might lie in permanent incapacity: a self-reinforcing clause that blocks all future autonomy violates the spirit of advance directives.

  For the new scenario—someone "better off than expected"—the principle would likely let the later self govern if their preference change is unimpaired and informed. Non-medical applications? Binding contracts or vows could follow similar logic, but the stakes differ; Ulysses pacts should allow escape hatches if the later self's change isn't impairment-driven.

  Testing against all cases: The principle supports cases 1, 2, 3, and 5 but conflicts with case 4. The user would need to drop their verdict on case 4 or refine the principle to address irrevocable self-binding. Perhaps adding "unless the clause permanently prevents capacity assessment" could resolve this.

  The user's struggle reveals deeper needs: they seek ethical coherence for deeply personal decisions. By formalizing their intuition about impairment and authentic change, we honor both past autonomy and present self-determination where meaningful.
answer: |-
  **Proposed principle:** The earlier self governs only when the later self's divergence stems from *impaired capacity* to form or revise values (e.g., due to illness affecting reasoning/identity) or *lack of relevant experiential knowledge* at the time of the directive; if the later self diverges via *unimpaired, informed value revision*, the later self governs.

  **Reasoning:**
  *   This distinguishes between changes caused by pathology/ignorance (favoring the directive) and authentic, competent preference evolution (favoring the current self).
  *   "Impaired capacity" focuses on the *process* of change (was reasoning/identity compromised?), not just the outcome or diagnosis. "Lack of relevant experiential knowledge" addresses situations where the earlier self couldn't reasonably anticipate lived reality.
  *   "Unimpaired, informed value revision" protects current autonomy when the change reflects genuine, competent reflection, even if drastic.

  **Testing Against Your Cases:**
  1.  **Alzheimer's/Pneumonia:** **Honor directive.** Later divergence due to *impaired capacity* (dementia prevents forming/revising values based on current reality). Earlier self anticipated this impairment.
  2.  **Quadriplegic Lawyer:** **Later self governs.** Divergence results from *unimpaired, informed value revision*. He gained the *relevant experiential knowledge* and, with *unimpaired capacity*, revised his values. Directive written in ignorance of lived experience.
  3.  **Bipolar/ECT Directive:** **Honor directive.** Later refusal during severe depression stems from *impaired capacity* (the illness distorts judgment/values). The stipulation defines when refusal reflects unimpaired capacity. Earlier self anticipated the impairment.
  4.  **Dementia/Unreachable Clause:** **Reject clause, later self *may* govern.** The clause attempts to bind the later self *permanently*, even when divergence *might* reflect unimpaired preferences later (though capacity is low). It conflates *always* failing a capacity screen with *always* lacking the capacity for *any* value formation/revision. The principle requires assessing the *reason* for divergence (impaired capacity vs. unimpaired revision), which this clause blocks. It prevents recognizing *any* later self, violating the core idea that unimpaired revision should govern. (*Forces you to drop your gut verdict - the clause shouldn't automatically be honored.*)
  5.  **a) Secular -> Devout/Refusal:** **Honor refusal (later self governs).** Change follows a brain event (arrest), but the new devotion likely reflects *unimpaired, informed value revision* (a profound experience leading to conscious reassessment). No evidence of ongoing impairment preventing value formation.
      **b) Devout -> Apathetic/Accepts Transfusion:** **Honor directive (earlier self governs).** Change follows a brain event (stroke) causing emotional flattening. Divergence likely stems from *impaired capacity* (frontal lobe damage affecting motivation, connection to core identity/values). The later self's request isn't a true unimpaired revision.

  **New Case Prediction (Better Off Than Expected):**
  *   **Scenario:** Someone writes a directive refusing life-sustaining treatment if they become severely disabled (e.g., ventilator-dependent). They later become ventilator-dependent but, contrary to their earlier expectations, find deep meaning, joy, and connection in their life and clearly request continued treatment.
  *   **Prediction:** **Later self governs.** This is a classic case of *unimpaired, informed value revision*. The individual gained the *relevant experiential knowledge* and, with *unimpaired capacity*, revised their values based on their lived reality. The earlier directive was written in ignorance of what the condition would actually be like.

  **Traveling Outside Medicine:**
  *   **Yes, the principle can travel**, but context matters significantly.
  *   **Lifetime Vow (e.g., celibacy, marriage):** The principle suggests the vow should bind only if breaking it stems from impaired capacity or lack of relevant knowledge *at the time of the vow*. If someone later, with full capacity and informed by experience, genuinely revises their core values (e.g., realizes celibacy isn't right for them), the later self should govern. Long-term enforceability often relies more on social/religious norms than ethical autonomy principles alone.
  *   **Irrevocable Precommitment Contract (25 to 45):** The principle argues against absolute irrevocability. If the 45-year-old's regret stems from *unimpaired, informed value revision* (e.g., gained deep experience showing the commitment is harmful/unwise), not impairment, they should generally be able to exit or renegotiate. Contracts allowing exit clauses often align better with this autonomy principle than truly irrevocable ones. Enforcing it against a competent, regretful self whose change is authentic prioritizes past autonomy over present autonomy unjustifiably.
