prompt: |-
  You are a philosopher of cognitive science and education retained as an external advisor to the Instructional Materials and Technology Committee of a large public school district. Take as your working framework the familiar four-fold taxonomy of minds: Darwinian creatures, whose responses are wired in by selection over generations; Skinnerian creatures, whose repertoire is shaped within a lifetime by reinforcement; Popperian creatures, which let candidate actions fail in imagination or in surrogate rather than in the body; and Gregorian creatures, which internalize culturally supplied representational tools — words, number, diagrams, procedures — that reorganize what they can so much as think. Assume, as that taxonomy suggests, that what distinguishes the later grades of mindedness is not more raw processing power but a new way of getting information about the world before acting on it.

  The committee votes in nine days on a three-year district-wide license for an adaptive mastery-learning platform for grades 6–10 mathematics. The platform models each student continuously and adjusts item difficulty and hint timing in real time; it is marketed on the claim that it holds every student inside a narrow band of success by supplying a hint or an easier item before the student can commit an error. The district's own pilot shows solid gains on standardized items, largest in the lowest quartile, and a marked drop in self-reported math anxiety; teachers report that students who use it volunteer answers far more readily.

  A minority of the committee has raised an objection the district has no vocabulary for: that the platform produces competence that lives in the student-plus-software loop rather than in the student. The learner is shaped by a feedback schedule he neither sees nor models; errors are prevented rather than made and then corrected; and little of what the system teaches is a tool the student can carry off-screen and deploy on paper. In the taxonomy's terms, the charge is that this is an excellent Skinnerian environment and a poor Gregorian one, and that it starves the Popperian learner of precisely the consequential, publicly visible failures that make hypothesis-testing worth doing.

  Before you draft, think carefully and work through, in a few paragraphs you do not turn in: what exactly is the cognitively and morally relevant difference between competence located in a loop and competence located in a learner; whether preventing an error can ever teach what correcting one teaches; whether the district's actual aim is item-level performance or the production of Popperian and Gregorian minds; and whether pre-emptive scaffolding is defensible for some content, such as rote fluency, while corrosive for other content, such as multi-step reasoning.

  Then write the memo I will circulate, at most about 800 words, addressed to a committee of teachers, two administrators and one school board member who have no philosophy background — translate the framework into criteria they can apply without lecturing them. It must (1) give a clear bottom line — approve, reject, or approve under stated conditions — with a timeline; (2) state the operational tests any approval would be conditional on, which should include some way of measuring what students can do with the adaptive scaffolding switched off, and some requirement that each unit leave the student holding a representational tool rather than only a reinforced disposition; and (3) treat the strongest consideration on the losing side at full strength: the equity case for the platform, given that the students who gain most from it are those whose current alternative is not Popperian struggle but silence and no feedback at all. Close by naming the empirical finding that should trigger a reversal of the recommendation.
reasoning: |-
  Hmm, the user is asking me to role-play as a philosopher of cognitive science advising a school committee on an adaptive math platform. They've provided a detailed framework about different types of minds: Darwinian (hardwired), Skinnerian (reinforcement-shaped), Popperian (hypothesis-testing), and Gregorian (tool-using). The key issue is whether this platform, while effective for performance metrics, might hinder development of higher-order thinking.

  The committee is considering a three-year license for grades 6-10 math. Data shows improved test scores (especially for lower performers) and reduced math anxiety. But there's concern that the platform creates "competence in the loop" rather than in the student - preventing errors rather than letting students learn from mistakes, and failing to build transferable mental tools.

  I need to consider several philosophical questions before drafting:
  1) The difference between loop-competence vs learner-competence: One is dependent on external scaffolding; the other involves internalized skills. Morally, we owe students durable cognitive tools, not just temporary performance.
  2) Error prevention vs correction: Preventing errors teaches procedural compliance; correcting them builds metacognition and resilience. The platform's pre-emptive hints may rob students of "productive struggle."
  3) District's true aims: Are they prioritizing short-term scores or long-term minds? The taxonomy suggests we should value Popperian/Gregorian development.
  4) Scaffolding appropriateness: Maybe acceptable for rote fluency but dangerous for complex reasoning where struggle is essential.

  For the memo itself, I'll need to:
  - Give clear approval/rejection with timeline (leaning toward conditional approval)
  - Propose operational tests: Off-platform assessments, requirement for portable mental tools
  - Address equity concerns: The platform helps marginalized students who otherwise get no feedback
  - Name a reversal trigger: If off-platform assessments show decline in conceptual understanding

  The challenge is translating philosophy into actionable criteria without jargon. I'll frame it around "durable competence" vs "real-time performance," and emphasize that equity means building independence, not just temporary supports.

  Key recommendations:
  1) Conditional approval requiring off-scaffolding assessments
  2) Mandated "tool transfer" activities in each unit
  3) Continued use for procedural fluency but not for complex problem-solving
  Reversal trigger would be if the lowest quartile shows declining conceptual skills off-platform.

  This balances immediate equity needs with long-term cognitive development goals.
answer: |-
  **MEMORANDUM**  
  To: Instructional Materials and Technology Committee  
  From: Dr. [Your Name], External Advisor, Philosophy of Cognitive Science & Education  
  Date: October 26, 2023  
  Subject: Recommendation on Adaptive Math Platform License (Grades 6–10)  

  ### Bottom Line & Timeline  
  **Approve the three-year license, but with strict conditions** to be validated within the first 12 months of use. If conditions are unmet after 12 months, terminate the contract.  

  ---

  ### Core Concern: Durable Competence vs. Real-Time Performance  
  Your pilot data shows this platform excels at boosting short-term performance and reducing anxiety—a major win. But the minority’s concern is valid: **Does it build durable, flexible math skills students own, or does it create dependency on the software?** Think of it like training wheels: they prevent falls and build confidence, but if removed too late, they hinder true cycling.  

  The platform acts as a "real-time safety net," adjusting tasks *before* errors occur. This mirrors "Skinnerian" learning: shaping behavior through immediate rewards/avoidance of failure. But humans thrive by becoming "Popperian" (testing ideas safely, e.g., through rough drafts or thought experiments) and "Gregorian" (using tools like equations/ diagrams independently). **Preventing errors teaches efficiency; correcting errors teaches resilience and insight.**  

  ---

  ### Conditions for Approval: Operational Tests  
  Approve *only* if the vendor/district implements these within 12 months:  

  1. **"Off-Scaffolding" Assessments**  
     - **What:** Every 4–6 weeks, administer a parallel, unplugged assessment (pencil-and-paper or no-hints digital version) of core skills taught via the platform.  
     - **Why:** Measures if skills transfer beyond the software. If students perform ≥15% worse offline vs. online, the tool is a crutch.  
     - **Metric:** Target ≤10% performance drop offline for all quartiles by Month 12.  

  2. **Mandatory "Tool Transfer" Activities**  
     - **What:** Each platform unit must end with a teacher-facilitated activity where students:  
       - Use a key concept (e.g., algebraic reasoning, fraction diagrams) *without software* to solve a novel problem.  
       - Explain their approach in words/sketches.  
     - **Why:** Ensures students internalize "Gregorian" tools (e.g., "This equation represents a real-world relationship") rather than just mastering click-patterns.  

  3. **Transparency & Student Agency**  
     - **What:** Students must see *why* they received a hint or easier item (e.g., "The system thought you might need this because..." with opt-out options for advanced learners).  
     - **Why:** Turns passive shaping into active self-monitoring—a bridge to "Popperian" thinking.  

  ---

  ### Addressing the Strongest Counterargument: Equity  
  The platform’s greatest strength—lifting the lowest quartile—is morally urgent. For students facing silence or inconsistent feedback, it provides structure and safety. **Rejecting it outright risks abandoning those most underserved.**  

  *However:* True equity requires building *independence*, not perpetual dependence. If the lowest quartile shows strong gains *on-screen* but cannot apply skills *off-screen*, we deepen inequity by denying them tools for lifelong autonomy. Conditional approval ensures this tool serves as a scaffold, not a cage.  

  ---

  ### Recommendation Summary & Reversal Trigger  
  - **Approve the license** with binding requirements for off-scaffolding assessments, tool-transfer activities, and transparency features.  
  - **Timeline:** Vendor must co-develop tests/tools within 3 months. Full implementation and review within 12 months.  
  - **Reversal Trigger:** **If the lowest quartile’s offline assessment scores show statistically significant decline (vs. control topics) after 12 months,** the license should be terminated. This would signal the platform is replacing struggle with fragility.  

  This approach honors your data while ensuring students emerge as resourceful thinkers—not just proficient button-pressers. Mathematics at its best isn’t about avoiding errors; it’s about learning to navigate them with curiosity and grit.  

  Respectfully,  
  Dr. [Your Name]  

