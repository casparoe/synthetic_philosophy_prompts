  Below is a decision tree designed for your graduate seminar in environmental ethics, starting from the core commitment that suffering in wild animals matters morally on par with comparable human suffering. The tree guides students through concrete policy decisions about habitat conversion (e.g., draining wetlands, rewilding farmland, culling deer, or eradicating invasive species). Each branch node is a claim phrased around a case, and leaves represent named (or unnamed) positions with their key vulnerability. The tree includes all required elements (e.g., suffering-focused conversion, resistance to generalist shifts, land-sparing, anti-restoration, holism, and fertility control).

  ---

  ### **Decision Tree: Habitat Conversion and Wild Animal Welfare**
  **Starting Commitment:** Suffering in wild animals matters morally and on par with comparable human suffering.

  1. **Claim 1 (Burden of Proof):** *Given how little we know about welfare in this habitat, the burden of proof falls on anyone proposing conversion (e.g., draining this wetland for housing requires proving it won’t cause net harm).*  
     - **Yes** → Go to Claim 2.  
     - **No** → Go to Claim 3.  

  2. **Claim 2 (Net Welfare in Intact Habitat):** *The intact habitat (e.g., this lowland wetland) contains net negative welfare—most animals suffer more than they flourish.*  
     - **Yes** → Go to Claim 4.  
     - **No** → Go to Claim 5.  

  3. **Claim 3 (Currency of Welfare):** *When evaluating change, we should prioritize total welfare across all animals that could ever live here (e.g., converting this upland scrub to farmland might support more animals overall, even if each has lower welfare).*  
     - **Total Welfare** → Go to Claim 6.  
     - **Welfare Per Animal/Year** → Go to Claim 7.  

  4. **Claim 4 (Benefit to Prevented Existences):** *Animals whose existence is prevented by conversion (e.g., future rats on this island if we don’t cull) count as "benefited" because they avoid suffering.*  
     - **Yes** → Go to Claim 8.  
     - **No** → Go to Claim 9.  

  5. **Claim 5 (Weighing Deaths vs. Prevented Births):** *Deaths/displacements of current animals (e.g., deer in this forest during clearance) must be weighed against preventing future births (e.g., fewer deer if we replant with conifers).*  
     - **Yes** → Go to Claim 10.  
     - **No** → Go to Claim 11.  

  6. **Claim 6 (Comparison Class):** *The baseline for assessing harm is:*  
     - **Habitat as it stands** → Leaf 1.  
     - **Successfully restored habitat** → Leaf 2.  
     - **Densely settled habitat** → Leaf 3.  

  7. **Claim 7 (Ecosystem Standing):** *This ecosystem (e.g., the wetland) has moral standing beyond its sentient individuals—its health matters independently of animal welfare.*  
     - **Yes** → Leaf 4.  
     - **No** → Leaf 5.  

  8. **Claim 8 (Fertility Control vs. Clearance):** *Reducing future suffering is better achieved by fertility control (e.g., immunocontraception for deer) than habitat clearance.*  
     - **Yes** → Leaf 6.  
     - **No** → Leaf 7.  

  9. **Claim 9 (Holism and Suffering):** *Preserving ecosystems (e.g., the upland scrub) is obligatory even if it perpetuates net suffering, due to holistic value.*  
     - **Yes** → Leaf 8.  
     - **No** → Leaf 9.  

  10. **Claim 10 (Generalist Shift Harm):** *Conversion (e.g., draining the wetland) is harmful because it replaces specialists (few, longer-lived) with generalists (many, short-lived, high-suffering).*  
      - **Yes** → Leaf 10.  
      - **No** → Leaf 11.  

  11. **Claim 11 (Restoration Harm):** *Restoration/rewilding (e.g., letting farmland revert to scrub) increases net suffering by creating a habitat with higher mortality/predation.*  
      - **Yes** → Leaf 12.  
      - **No** → Go to Claim 6 (to resolve ambiguity).  

  ---

  ### **Leaves (Terminal Positions)**
  1. **Default Preservationism**  
     (Reached via Claim 1: Yes → Claim 2: No)  
     - **Position:** Oppose conversion; ignorance imposes a burden of proof not met.  
     - **Vulnerable Commitment:** "We must preserve habitats even if they likely cause net suffering, because uncertainty favors inaction."  

  2. **Negative Utilitarian Interventionism**  
     (Reached via Claim 1: No → Claim 2: Yes → Claim 4: Yes)  
     - **Position:** Actively convert to prevent future suffering (e.g., drain the wetland to spare future animals).  
     - **Vulnerable Commitment:** "Killing/displacing current animals is justified if it prevents more suffering in future animals who will never exist."  

  3. **Per-Capita Anti-Conversion**  
     (Reached via Claim 1: No → Claim 3: Welfare Per Animal/Year → Claim 10: Yes)  
     - **Position:** Resist conversion; shifts to short-lived generalists (e.g., rats/insects post-clearance) lower average welfare.  
     - **Vulnerable Commitment:** "Favoring fewer animals with better lives over more animals with worse lives is always preferable, even if total welfare decreases."  

  4. **Land-Sparing Utilitarianism**  
     (Reached via Claim 6: Densely settled habitat)  
     - **Position:** Permit conversion (e.g., intensive farming) to spare wilderness elsewhere.  
     - **Vulnerable Commitment:** "Sacrificing local animal welfare for global conservation gains is effective and obligatory."  

  5. **Restoration Skepticism**  
     (Reached via Claim 11: Yes)  
     - **Position:** Oppose restoration/rewilding (e.g., blocking farmland reversion) as it increases suffering.  
     - **Vulnerable Commitment:** "Human-altered habitats (e.g., managed farmland) often cause less suffering than 'wild' ones."  

  6. **Fertility Control Pragmatism**  
     (Reached via Claim 8: Yes)  
     - **Position:** Reduce suffering via fertility control (e.g., contraceptives for deer) rather than habitat clearance.  
     - **Vulnerable Commitment:** "Non-lethal intervention in nature is morally permissible, even if it disrupts ecological processes."  

  7. **Ecosystem Holism**  
     (Reached via Claim 7: Yes)  
     - **Position:** Preserve ecosystems for holistic value, independent of individual welfare.  
     - **Vulnerable Commitment:** "Ecological integrity outweighs aggregate suffering (e.g., preserving a predator-heavy forest is good even if prey suffer)."  

  8. **Harm-Weighing Preservationism**  
     (Reached via Claim 5: No)  
     - **Position:** Resist conversion; deaths of current animals matter, but prevented future births do not offset them.  
     - **Vulnerable Commitment:** "Current animals have stronger moral claims than potential ones, even in net-negative habitats."  

  9. **Non-Identity Preservationism**  
     (Reached via Claim 4: No → Claim 9: No)  
     - **Position:** Oppose conversion; prevented animals cannot be "benefited," so only harms to current animals count.  
     - **Vulnerable Commitment:** "We have no duty to prevent the existence of suffering beings if they don’t yet exist."  

  10. **Utilitarian Revisionism**  
      (Reached via Claim 6: Successfully restored habitat)  
      - **Position:** Support conversion only if it improves welfare vs. a restored baseline (e.g., rewilding is harmful if it lowers welfare).  
      - **Vulnerable Commitment:** "Human management (e.g., controlled burns) often produces better welfare than 'natural' restoration."  

  11. **Unnamed (Negative Per-Capita Conversion)**  
      (Reached via Claim 2: Yes → Claim 3: Welfare Per Animal/Year → Claim 6: Densely settled)  
      - **Position:** Convert habitats with net-negative welfare to reduce average suffering (e.g., replace a high-mortality forest with low-density settlement).  
      - **Vulnerable Commitment:** "Eliminating habitats with high suffering per animal is desirable, even if it means fewer animals overall."  

  12. **Unnamed (Holist Interventionism)**  
      (Reached via Claim 4: No → Claim 9: Yes)  
      - **Position:** Convert to protect ecosystems (e.g., eradicating invasive rats to restore island ecology).  
      - **Vulnerable Commitment:** "Ecological health justifies inflicting suffering on individuals (e.g., culling overpopulated species)."  

  ---

  ### **Unoccupied Combinations & Coherence Notes**  
  The tree produces 12 leaves, but some answer combinations lead to no position due to logical gaps or unattractive implications:  

  1. **Claim 1: Yes → Claim 2: Yes → Claim 4: Yes → Claim 8: Yes**  
     - *Combination:* Burden of proof on converter, net welfare negative, prevented animals benefited, fertility control preferred.  
     - **Status:** *Unexplored* — No position reconciles burden of proof with proactive fertility control in negative-welfare habitats.  

  2. **Claim 1: No → Claim 3: Total Welfare → Claim 6: As it stands → Claim 7: Yes**  
     - *Combination:* No burden of proof, total welfare focus, baseline as-is, ecosystem standing.  
     - **Status:** *Incoherent* — Ecosystem holism clashes with individualist total welfare (one prioritizes systems, the other aggregates individuals).  

  3. **Claim 1: No → Claim 2: No → Claim 5: Yes → Claim 10: No**  
     - *Combination:* Net welfare positive, deaths weighed against prevented births, no harm from generalist shifts.  
     - **Status:** *Unattractive* — Justifies conversion in positive-welfare habitats if total births increase, ignoring per-capita harm (few defend this).  

  4. **Claim 1: No → Claim 2: Yes → Claim 4: No → Claim 9: No → Claim 6: Densely settled**  
     - *Combination:* Net welfare negative, prevented animals not benefited, no holism, land-sparing focus.  
     - **Status:** *Incoherent* — Land-sparing requires comparing habitats, but non-identity (Claim 4: No) voids the moral weight of future animals.  

  **Indistinguishable Leaves:**  
  - **Leaf 10 (Utilitarian Revisionism)** and **Leaf 5 (Per-Capita Anti-Conversion)** cannot be separated if Claim 11 (Restoration Harm) is answered "No." Both require Claim 6 to resolve (e.g., baseline determines if conversion helps or harms).  

