prompt: |-
  I teach a 300-level Philosophy of Medicine seminar — 18 juniors, one 80-minute session, and I have exactly one slot to spend on how death should be defined. I've run it as straight discussion before and it always degenrates into someone saying "well, brain death" and everyone else nodding, which is the opposite of what I want. So: design me a structured activity — a game, a staged committee exercise, something with real move-making and something at stake — that makes them feel the force of the problem before anyone names the options.

  What they already know: they've read two newspaper-ish pieces on organ donation, so "brain death" is in the room as a phrase, and they all have the lay intuition that death is when your heart stops and you stop breathing. Assume that and basically nothing else. What I do not want is the session collapsing into picking between whole-brain, higher-brain, and circulatory criteria as if these were items on a menu. If they end up choosing one and defending it, the activity failed. The thing I want them to walk into is that the criteria come apart in cases; that no one criterion does all the work we want the concept of death to do (permitting withdrawal of treatment, permitting organ recovery, giving a family closure, closing a chart, settling inheritance); and that the disagreement may be less about the biology than about which of those jobs matters, or even about what we should mean.

  Here's the skeleton I've been toying with — build on it or replace it, your call: four committees of 4-5. Each writes, from scratch, a one-sentence rule for when a patient is dead, with no access to the standard taxonomy. Then they get a deck of case cards and have to sort each into dead / not dead / can't tell. Points for sorting every card without amending the rule, points docked for every amendment made after seeing a card — so they feel, as a cost, the choice between gerrymandering the rule to fit a case and holding the rule and swallowing a verdict they hate. Then the bit I actually think is new: each committee's one-sentence rule is handed to a different committee, which has to apply it cold, in three minutes, to two fresh cases, with no clarifications allowed — as if they were a resident at 3am with a form to sign. Then a last round where a "transplant team" scores each rule on whether it permits recovery in a case where the family wants to donate and forbids it in a case where recovery would kill someone who might get better.

  What I need from you: the actual rules and a scoring scheme that doesn't need money or prizes; a timeline with minute marks; a full deck of 12-14 case cards, one or two sentences each, invented or anonymized rather than real patients' stories (I don't want them arguing about facts, and I have a student whose parent died last year) — including two cards you make up yourself, ideally ones no existing protocol handles cleanly; a note on what the facilitator may and may not say during play; and a debrief that maps particular moments in the game onto particular claims, ending with the question of whether they were having a factual disagreement, a verbal one, or a decision about what to do.

  Also: tell me what will predictably go wrong the first time I run it. I'm guessing at least one group writes a rule that's really just "the doctor decides"; at least one pre-med takes over their group with clinical detail; someone goes quiet; and the scoring tempts everyone to write a maximally vague rule that "can't tell" everything, which I'd want designed against rather than patched in the moment. How do I handle each? And be honest about which feature of the philosophical problem the game structurally cannot reproduce and I'll just have to say out loud at the end. Don't bother with citations, suggested readings, or a bibliography — I have all that.
reasoning: |-
  We are designing an interactive classroom activity to explore the definition of death without prematurely settling on standard criteria. The goal is to make students experience the tension between different purposes of defining death and the difficulty of creating a rule that fits all cases.

  Activity Structure: "The Death Rule Game"
  - 4 committees (4-5 students each)
  - 3 phases: Rule Creation, Case Sorting, Rule Exchange and Application, Transplant Team Evaluation
  - Total time: 80 minutes

  Timeline:
  1. Introduction (5 minutes)
  2. Phase 1: Rule Creation (10 minutes)
  3. Phase 2: Case Sorting (20 minutes)
  4. Phase 3: Rule Exchange and Application (15 minutes)
  5. Phase 4: Transplant Team Evaluation (10 minutes)
  6. Debrief (20 minutes)

  Detailed Breakdown:

  1. Introduction (5 min):
     - Explain the activity: "Today we are going to design a rule for determining when a person is dead. You are on committees that must write a one-sentence rule. Then you will apply your rule to cases. There will be a scoring system to see how well your rule holds up."
     - Emphasize: "Do not use any medical jargon or standard terms like 'brain death'. Write a rule in plain language that anyone could apply. The rule must be one sentence and cannot be changed once you start applying it to cases without penalty."
     - State the goal: "The aim is to create a rule that is clear, consistent, and does the work we need it to do in medical contexts."

  2. Phase 1: Rule Creation (10 min):
     - Each committee writes a one-sentence rule for when a patient is dead.
     - Rules must be in plain language without referencing any standard criteria.
     - Rules must be written on a card and handed to the facilitator.

  3. Phase 2: Case Sorting (20 min):
     - Each committee gets a deck of 12 case cards (the same for all).
     - They must sort each case into: DEAD, NOT DEAD, or CAN'T TELL.
     - They must use their rule without amendment. If they want to change the rule, they can, but they lose points (see scoring).
     - Scoring for this phase:
       - +1 point for each case sorted without amending the rule.
       - -1 point for each amendment to the rule after seeing a case (amendment must be written and initialed by the group).
       - If they use "CAN'T TELL", they get 0 points for that card.

  4. Phase 3: Rule Exchange and Application (15 min):
     - Each group's rule is handed to another group (rotate: group1->group2, group2->group3, group3->group4, group4->group1).
     - Each group now gets 2 new case cards (not in the original deck) and must apply the rule they received to these cases.
     - They have 3 minutes per case (total 6 minutes) to decide and write down the verdict (DEAD, NOT DEAD, CAN'T TELL) with a one-sentence explanation.
     - They cannot ask for clarifications. The facilitator will not help.
     - Scoring for this phase (for the group that wrote the rule):
       - +2 points if the applying group sorts both cases without using "CAN'T TELL" and the rule-writers agree with the verdict (if they disagree, they must explain why at the end, but no points are awarded until the debrief when we discuss).
       - +1 point if the applying group uses "CAN'T TELL" for one case and gets the other right (according to the rule-writers).
       - 0 points if the applying group gets both wrong or uses "CAN'T TELL" for both.

     Note: The rule-writers will not see the application until after the phase, but during the debrief we will reveal and discuss.

  5. Phase 4: Transplant Team Evaluation (10 min):
     - A "transplant team" (which is the entire class, but facilitated by the instructor) evaluates each rule on two specific cases (provided by the instructor) that are critical for organ donation.
       - Case A: A patient who is in a condition where organs could be recovered if the patient is dead, and the family wants to donate. We want the rule to permit recovery (i.e., declare the patient dead).
       - Case B: A patient who is in a condition where organs might be recovered, but if we do, it would kill a patient who might recover. We want the rule to forbid recovery (i.e., declare the patient not dead).
     - For each rule, the class votes: 
       - +2 points if the rule correctly permits in Case A and forbids in Case B.
       - +1 point if it does one but not the other.
       - 0 points if it fails both.

     Note: The cases for this phase are from the original deck (so they have seen them) but the groups don't know which ones until now.

  6. Debrief (20 min):
     - Discuss the process and the challenges.
     - Map moments in the game to philosophical claims:
       - Rule amendments: show that the rule was inadequate and had to be stretched (gerrymandering) to fit cases.
       - Disagreements during rule exchange: show ambiguity in the rule, leading to different interpretations.
       - Transplant evaluation: shows that the rule must serve social and ethical purposes (like organ donation) and not just biological facts.
     - End with the key question: "Were your disagreements about the facts of the cases, about the meaning of words (like 'death'), or about what we should do in these situations?"

  Scoring Scheme:
  - Total points possible: 
    - Phase 2: up to 12 points (if they sort all without amendment and without "can't tell")
    - Phase 3: up to 2 points (if the rule is applied correctly to both new cases without "can't tell")
    - Phase 4: up to 2 points (if the rule passes both transplant cases)
  - Total: 16 points. But the point is not winning but experiencing the trade-offs. We might just tally and see which rule got the most, but the debrief is more important.

  Case Cards (14 total, including 2 that are particularly tricky):

  1. A person whose heart has stopped and who is not breathing for 10 minutes. (Standard circulatory death)
  2. A person whose heart and breathing are being maintained by machines, but who has no brain activity at all (including brain stem). (Brain death)
  3. A person in a deep coma (persistent vegetative state) who can breathe without a machine but shows no signs of awareness. (PVS)
  4. A person whose heart is beating and who is breathing on their own, but has no higher brain function (cerebral cortex is destroyed). (Higher brain)
  5. A person who has been found in freezing cold water with no heartbeat or breathing for 30 minutes. (Cold water drowning - might be revivable)
  6. A person with advanced dementia who cannot recognize family, speak, or move voluntarily, but breathes and has a heartbeat. (End-stage dementia)
  7. A person who has had a severe stroke and is on a ventilator, with some brain stem activity but no higher brain function. (Partial brain function)
  8. A person who has a terminal illness and is in hospice, breathing irregularly and with a very weak heartbeat, expected to stop within hours. (Imminent death)
  9. A person who is in cardiac arrest, but CPR is being performed and they are occasionally gasping. (CPR in progress)
  10. A person with locked-in syndrome: fully conscious but completely paralyzed except for eye movements. (Conscious but paralyzed)
  11. A newborn with anencephaly (born without most of the brain, including cortex, but with brain stem intact so they can breathe and have a heartbeat). (Anencephaly)
  12. A person who has been declared brain dead and is being kept on a ventilator for organ donation. (Brain dead on support)
  13. [Tricky Case 1] A person in a persistent vegetative state for 10 years, but whose family reports occasional smiles and hand squeezes (though these are not reproducible in clinical exams). (PVS with ambiguous signs)
  14. [Tricky Case 2] A person who has been in a coma for a month after a drug overdose, with no brain activity detected so far, but doctors say there is a small chance of recovery because of the drug's effects. (Coma with uncertain prognosis)

  For Phase 3 (Rule Exchange), we need two new cases that are not in the original deck. They should be challenging for interpretation:

  - Case X: A person who has a device that circulates blood and oxygen without a heartbeat (like an artificial heart or ECMO) and has no brain activity. (Circulation without heartbeat, no brain activity)
  - Case Y: A person who has a heartbeat and breathing, but has no higher brain function and is permanently unconscious, and also has a terminal illness that will stop the heart within a week. (Dying but not yet)

  For Phase 4 (Transplant Team), we use two cases from the original deck:
  - Case A (permit recovery): Use Case 2 (brain death on ventilator) - we want the rule to say dead so that organs can be recovered.
  - Case B (forbid recovery): Use Case 5 (cold water drowning) - we want the rule to say not dead because they might recover.

  What the facilitator may and may not say:
  - During rule creation: Encourage clarity and simplicity. Do not allow medical jargon. If a group writes "the doctor decides", ask them to write a rule that a doctor would use to decide. If they persist, allow it but note that it will be hard to apply consistently.
  - During case sorting: Do not answer questions about the cases. Say: "Apply the rule as written." If they ask about medical details, say: "The case is as described; use the information given."
  - During rule exchange: No clarifications. The applying group must interpret the rule as written.
  - During transplant evaluation: The instructor reads the two cases and the class votes on each rule's outcome for these cases.

  Predictable Problems and Solutions:

  1. **A group writes "the doctor decides":**
     - Solution: During rule creation, if you see this, challenge them: "What rule would the doctor use? The point is to write a rule that a doctor could apply." If they don't change, let it go. In the debrief, point out that this rule leads to inconsistency and subjectivity.

  2. **A pre-med takes over with clinical detail:**
     - Solution: Set ground rules at the start: "We are not using medical terminology. We are designing a rule that a non-expert could apply. Focus on the concepts, not the technicalities." If it happens, gently redirect: "Remember, your rule must be in plain language and one sentence."

  3. **Someone goes quiet:**
     - Solution: Assign roles: a scribe, a timekeeper, a spokesperson. Encourage every group to ensure everyone speaks. Circulate and ask quiet students: "What do you think about this case?"

  4. **Groups write a vague rule to avoid points loss:**
     - Design against: The scoring in Phase 3 (rule exchange) penalizes vagueness because another group must apply it. If the rule is too vague, the applying group will use "CAN'T TELL" and the rule-writers lose points. Also, in Phase 4, a vague rule might not clearly permit or forbid organ donation. In the debrief, highlight that a rule that always says "can't tell" is useless.

  What the Game Cannot Reproduce:
  - The game focuses on creating and applying rules, but it may not fully convey the historical and social context of how brain death became accepted. Also, the deep philosophical issue that death is a biological concept that we try to define in a way that serves social and legal purposes. You will have to say: "The definition of death is not just a biological fact but a social construct that must serve multiple purposes, which sometimes conflict. The biology doesn't tell us which purpose should dominate."

  Debrief Mapping:
  - Rule amendments (Phase 2): "When you changed your rule, you were trying to make it fit a case that mattered to you. That's like how in real life, we adjust definitions to avoid outcomes we don't want. But then we lose consistency."
  - Rule exchange (Phase 3): "When another group applied your rule, did they interpret it the way you intended? This shows that even a clear-seeming rule can be ambiguous. The disagreement might be about what the words mean."
  - Transplant evaluation (Phase 4): "We saw that a rule might work for one purpose (like organ donation) but not for another (like avoiding premature declaration). The rule isn't just about facts; it's about what we value."

  End with the question: "So, when you disagreed, was it about the facts of the case, the meaning of the word 'death', or about what we should do?"

  This activity should create the experience of the problem without prematurely settling on a standard definition.
answer: |-
  ### Structured Activity: "Death Rule Lab"  
  Based on your goals, here’s a polished version of your skeleton. The activity forces students to confront the *tensions* in defining death—biological ambiguity, conflicting social purposes, and rule brittleness—before labeling existing criteria. It uses a point system to create stakes (pride/competition), with scoring designed to penalize vagueness, amendments, and rules that fail key social functions. No prizes needed—points are tallied on the board, and "winning" is bragging rights.

  **Core Mechanics**:  
  - **Committees**: 4 groups of 4–5 students.  
  - **Phases**: Rule Drafting → Case Sorting → Rule Exchange → Transplant Audit → Debrief.  
  - **Stakes**: Groups earn/lose points for rule clarity, consistency, and real-world utility. Vagueness is penalized in later phases.  

  **Timeline (80 min total)**:  
  1. **Intro (5 min)**: Frame the problem. *Say: "You’re a hospital ethics committee. Design a one-sentence rule for declaring death that’s so clear, a night-shift nurse could apply it without you. No medical jargon—use plain language. Death must do practical work: allow treatment withdrawal, organ donation, or family closure. You’ll be scored on clarity, consistency, and real-world impact."*  
  2. **Phase 1: Rule Drafting (10 min)**: Each group writes a one-sentence rule.  
  3. **Phase 2: Case Sorting (20 min)**: Groups sort 12 case cards using their rule (Dead/Not Dead/Can’t Tell).  
  4. **Phase 3: Rule Exchange (15 min)**: Groups swap rules and apply them to 2 fresh cases.  
  5. **Phase 4: Transplant Audit (10 min)**: Class evaluates all rules against organ donation cases.  
  6. **Debrief (20 min)**: Structured discussion mapping game moments to philosophy.  

  **Scoring System (No money/prizes—use whiteboard tally)**:  
  - **Rule Drafting**: +2 points per group for submitting a one-sentence rule on time.  
  - **Case Sorting**:  
    - +1 point per case sorted **without** amending the rule.  
    - -2 points per amendment (groups must initial amendments).  
    - 0 points for "Can’t Tell" (no penalty, but no reward).  
  - **Rule Exchange**:  
    - +3 points if the applying group sorts **both** fresh cases correctly (per rule-writers’ intent).  
    - +1 point if they get one right.  
    - -1 point per "Can’t Tell" (applying group is forced to commit).  
  - **Transplant Audit**:  
    - +3 points if the rule permits donation in Case A and forbids it in Case B.  
    - +1 point if it does one but not the other.  
    - 0 if it fails both.  
  - **Max points**: 12 (Sorting) + 3 (Exchange) + 3 (Audit) + 2 (Drafting) = 20.  

  **Why scoring counters vagueness**:  
  - "Can’t Tell" gives 0 points in Sorting (no reward for dodging decisions).  
  - Rule Exchange penalizes vagueness (-1 per "Can’t Tell") and tests interpretability (applying group must guess).  
  - Transplant Audit explicitly tests social utility—vague rules fail Case B.  

  ---

  ### Case Card Deck (12 cases + 2 for Rule Exchange)  
  Cases are anonymized, fictional, and designed to pit criteria against each other. **Key tensions**: circulatory vs. brain function, consciousness vs. biology, prognosis vs. irreversibility. Two invented cases (#13–14) break all standard protocols.  

  1. **Card 1**: A patient in a car crash. No heartbeat or breathing for 5 minutes. CPR has not restarted their heart.  
  2. **Card 2**: A patient with no brain activity (including brainstem) for 24 hours. A ventilator keeps their heart/lungs working.  
  3. **Card 3**: A patient with severe dementia. They breathe and have a heartbeat but show no awareness or response for years.  
  4. **Card 4**: A drowning victim pulled from icy water. No heartbeat or breathing for 30 minutes. Body is very cold.  
  5. **Card 5**: A patient in a coma for 3 months. They occasionally breathe without a ventilator but show no consciousness.  
  6. **Card 6**: A patient with a terminal illness. Their heart beats weakly and irregularly; doctors say death is minutes away.  
  7. **Card 7**: A patient with locked-in syndrome. They are conscious but paralyzed (only eye movements). Heart and lungs function normally.  
  8. **Card 8**: A patient whose heart stopped but was restarted after 10 minutes. They now have permanent brain damage and need a ventilator.  
  9. **Card 9**: A patient with a brain tumor. They have no higher brain function but the brainstem works (they breathe unaided).  
  10. **Card 10**: A patient in cardiac arrest. CPR is ongoing; they gasp occasionally but have no pulse.  
  11. **Card 11**: A newborn with anencephaly (missing most of the brain). They breathe, suckle, and have a heartbeat but will not survive infancy.  
  12. **Card 12**: A patient declared "brain dead" for organ donation. The ventilator keeps their organs oxygenated, and their heart beats.  
  13. **Card 13 (Tricky #1)**: A patient with artificial blood pumps (no heartbeat). No brain activity for 48 hours. Body is warm and pink. *Breaks circulatory criteria.*  
  14. **Card 14 (Tricky #2)**: A patient in a coma after an overdose. They have no brain activity, but doctors say the drug might wear off in 72 hours. Family insists they’d recover. *Breaks irreversibility in all criteria.*  

  **Rule Exchange Cases (fresh, not in deck)**:  
  - **Case X**: A patient with a device that circulates blood without a heart (e.g., ECMO). They have no brain activity but the body is warm.  
  - **Case Y**: A patient with minimal brain activity. They breathe unaided but have no consciousness. Family says they sometimes blink to commands; doctors disagree.  

  **Transplant Audit Cases (from original deck)**:  
  - **Case A (permit donation)**: Use Card 2 (brain death on ventilator). *Rule should call this "dead" to allow donation.*  
  - **Case B (forbid donation)**: Use Card 4 (icy-water drowning). *Rule should call this "not dead" to avoid killing a recoverable patient.*  

  ---

  ### Facilitator Script & Boundaries  
  **What you MAY say**:  
  - During Rule Drafting: *"Make it concrete—what would a layperson see or measure? Avoid 'when hope is gone' or 'when the doctor says.'"*  
  - During Case Sorting: *"Stick to your rule. If it doesn’t fit, amend it—but it costs points."*  
  - During Rule Exchange: *"No clarifications. Apply the rule as written, like a tired intern at 3 a.m."*  
  - During Transplant Audit: *"Does this rule protect recoverable patients while allowing donations?"*  

  **What you MAY NOT say**:  
  - Never define "brain death," "higher-brain," etc. If students use jargon, say: *"Translate that into plain English for your rule."*  
  - Never answer hypotheticals about cases. If asked for details: *"The card has all the information you get."*  
  - Never suggest amendments. If a group is stuck: *"Your rule is your tool—use it or change it and accept the cost."*  

  ---

  ### Predicted Problems & Solutions  
  1. **"The doctor decides" rule**:  
     - **Why it happens**: Students avoid responsibility.  
     - **Prevention**: In the intro, say: *"Your rule must be observable. If a nurse can’t apply it without a doctor, it fails."*  
     - **In-game**: If a group drafts this, let them. In Rule Exchange, the applying group will struggle (e.g., "Which doctor?"), costing points. Debrief this as "subjectivity vs. consistency."  

  2. **Pre-med dominates with clinical details**:  
     - **Why it happens**: They’re confident but derail the philosophy.  
     - **Prevention**: Assign roles: **Facilitator** (keeps discussion on track), **Scribe** (writes rule), **Referee** (enforces plain language), **Spokesperson** (reports).  
     - **In-game**: If it happens, ask: *"How would a non-expert describe that?"* Redirect to rule-writing.  

  3. **Quiet students disengage**:  
     - **Why it happens**: Fast-paced debate overwhelms.  
     - **Prevention**: Use "think-pair-share" within groups: *"Write your own draft rule in 2 minutes, then merge ideas."*  
     - **In-game**: Circulate and ask quiet students: *"How would you sort Case 7? Does your rule cover it?"*  

  4. **Vague rules to avoid amendments**:  
     - **Why it happens**: Groups game the system.  
     - **Prevention**: Scoring penalizes vagueness:  
       - Sorting: "Can’t Tell" earns 0 points (no reward).  
       - Rule Exchange: Applying groups hate vague rules and will use "Can’t Tell" (-1 point).  
       - Transplant Audit: Vague rules fail Case B (e.g., icy-water drowning).  
     - **In-game**: If a rule is vague (e.g., "no life"), applaud their cleverness but let the phases punish it.  

  ---

  ### What the Game Can’t Reproduce (Say This in Debrief)  
  **The game cannot simulate historical/social power dynamics**. Students experience *creating* rules, but not how real-world criteria (e.g., brain death) emerged from transplant needs, not pure biology. Say:  

  > *"In the game, you debated rules in a vacuum. But in reality, definitions like 'brain death' were shaped by organ transplantation’s urgency. Your rules clashed because death isn’t just biology—it’s a social agreement about which purposes (donation, closure, etc.) matter most. That’s why we can’t just 'pick' a criterion from a menu."*  

  ---

  ### Debrief Script (20 min)  
  **Map game moments to philosophy**:  
  1. **Rule amendments** → *"You changed rules to fit cases you cared about. That’s 'gerrymandering'—bending definitions to avoid unwanted outcomes. But it costs consistency. Real-world example: Jahi McMath case, where 'brain death' was amended for cultural reasons."*  
  2. **Rule Exchange confusion** → *"When Group B applied Group A’s rule, they interpreted 'no life' differently. This shows death isn’t a fact—it’s a concept. Disagreements are often about language, not biology."*  
  3. **Transplant Audit failures** → *"A rule that worked for donation (Case A) failed for recovery (Case B). Death must serve social roles, but these conflict. Is death about the body, the mind, or what we need it to do?"*  

  **End with your question**:  
  > *"Throughout this, were your disagreements about...*  
  > - *Facts? (e.g., 'Does icy water change irreversibility?')*  
  > - *Words? (e.g., 'What does "irreversible" mean?')*  
  > - *Decisions? (e.g., 'We must allow organ donation!')*  
  > *...And if it was about decisions, can biology ever answer that?"*  

  **Why this works**: Students feel the frustration of conflicting purposes *before* labeling criteria. By the end, they’ll see that "defining death" is really about choosing which values to prioritize—setting up your next session on the metaphysics/ethics divide.  

  **First-Run Calibration**: Run a timer strictly. If Rule Exchange lags, cut it to 10 min. If groups rush Sorting, remind them amendments cost. Bring printed case cards—it’s faster than screens.
