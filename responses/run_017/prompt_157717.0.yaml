    "Imagine we want a risk score to be fair in three ways. First, we want the score to mean the same thing for everyone: a score of 7 should indicate a 70% chance of reoffending, regardless of race. That's calibration. Second, we want the rate of false alarms to be the same: among people who would not reoffend, we don't want one race to be flagged more often than another. Third, we want the rate of misses to be the same: among those who would reoffend, we don't want one race to be missed more often.

