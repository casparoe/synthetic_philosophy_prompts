  We need to break down the claims.

  First, we recall the fairness impossibility results (Kleinberg, Mullainathan, Raghavan; Chouldechova; Barocas, Selbst, etc.). The key result is that three popular fairness criteria are mutually exclusive except in the two special cases: equal base rates or perfect prediction.

