    So what do we do? We have to choose which fairness criteria matter most for our context. There isn't a single definition of fairness. The choice is ethical and legal, and it must be made by the agency and the board.

    Regarding the percentile proposal: it uses group membership to set different thresholds. This would achieve equal false alarm rates and equal miss rates. But it would not achieve calibration: the same percentile score in two groups would not represent the same absolute risk. And it would also mean that the positive predictive value (the chance that a person flagged as high risk actually reoffends) would differ by race. So it's a choice: it satisfies two of the three criteria, but not the third.

    Also, note that using group membership to set different thresholds might raise legal questions. Even if it achieves some fairness goals, it explicitly treats people differently by race at the decision point, which could be challenged."

  Finally, we flag what is safe and what is contestable.

    Safe:
      - The theorem: the three criteria are incompatible without equal base rates or perfect prediction. (This is mathematically proven and accepted.)
      - A perfect predictor would satisfy all three. (Safe.)
      - The COMPAS example: it was calibrated but had different error rates. (This is an empirical finding and consistent with the theorem.)

    Contestable:
      - The trade-off between accuracy and fairness: The theorem does not say that increasing accuracy causes unfairness. It says that if base rates are unequal, you cannot have all three fairness criteria. But you can have two. And accuracy might be improved without affecting fairness (if defined by two criteria). However, it is true that if you try to satisfy all three, you are constrained to having equal base rates or perfect prediction. But that's not the same as a trade-off between accuracy and fairness.

      - The percentile proposal: We said it fails calibration. But note: if we redefine the score to be the within-group percentile, then we might define a new calibration condition for that new score. However, the standard calibration condition (which is about absolute risk) is not satisfied. The ethical and legal debate might consider the percentile approach to be a form of "race-norming", which has been controversial (e.g., in psychological testing). This is not a mathematical issue but a societal one.

    Where our reasoning might break down:
      - The theorem is for the risk score (continuous) or for the binary classifier? We stated the theorem for the continuous case and then extended to binary. The incompatibility holds in both.
      - The transformation to percentiles: we have to be careful about the domain. The percentile transformation is a monotonic transformation, so it preserves the ordering and the ROC curve. But it changes the meaning of the score. The criteria are defined on the score (or on the binary decision). The theorem applies regardless of the transformation because it is about the joint distribution of (score, outcome, group). So the transformation does not break the theorem.

    What would change our mind?
      - If base rates are equal, then the three criteria are compatible. But they are not in the scenario we are facing.
