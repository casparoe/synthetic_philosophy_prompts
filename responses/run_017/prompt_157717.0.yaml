  Intuition with algebra:

    Let:
      Group A: base rate = p_A
      Group B: base rate = p_B

    We want:
      1. Calibration: For a given risk score, the probability of reoffending is the same in both groups. (This is about the score being well-calibrated.)
      2. Equal FPR: P(score high | non-reoffender) is the same for both groups = α.
      3. Equal FNR: P(score low | reoffender) is the same for both groups = β.

    Now, consider the overall reoffending rate in each group. We can express it using the law of total probability:

      p_A = P(reoffend | A) 
           = P(reoffend | A, score high) * P(score high | A) + P(reoffend | A, score low) * P(score low | A)

    But by calibration, we have:

          P(reoffend | A, score high) = P(reoffend | B, score high) = r_high
          P(reoffend | A, score low)  = P(reoffend | B, score low)  = r_low

    Also, note:

          P(score high | A, non-reoffender) = FPR = α   [for non-reoffenders]
          P(score low  | A, reoffender)     = FNR = β   [for reoffenders]

    Therefore, for non-reoffenders in group A:

          P(score high | A, non-reoffender) = α
          P(score low  | A, non-reoffender) = 1 - α

    Similarly, for reoffenders in group A:

          P(score low  | A, reoffender) = β
          P(score high | A, reoffender) = 1 - β

    Now, we can write the proportion of high scores in group A:

          P(score high | A) = P(score high | A, non-reoffender) * P(non-reoffender | A) 
                              + P(score high | A, reoffender) * P(reoffender | A)
                            = α * (1 - p_A) + (1 - β) * p_A

    Similarly, for group B:

          P(score high | B) = α * (1 - p_B) + (1 - β) * p_B

    Now, the calibration condition for a given score level (high) says that the proportion of reoffenders among those scored high is r_high. But note that:

          r_high = P(reoffend | A, score high) 
                  = [P(score high | A, reoffender) * p_A] / P(score high | A)
                  = [(1-β) * p_A] / [α*(1-p_A) + (1-β)*p_A]

    Similarly, for group B:

          r_high = [(1-β) * p_B] / [α*(1-p_B) + (1-β)*p_B]

    Since r_high must be the same for both groups, we set:

          [(1-β) * p_A] / [α*(1-p_A) + (1-β)*p_A] = [(1-β) * p_B] / [α*(1-p_B) + (1-β)*p_B]

    Simplify (assuming 1-β ≠ 0 and p_A, p_B ≠ 0):

          p_A / [α*(1-p_A) + (1-β)*p_A] = p_B / [α*(1-p_B) + (1-β)*p_B]

    Cross-multiplying:

          p_A * [α*(1-p_B) + (1-β)*p_B] = p_B * [α*(1-p_A) + (1-β)*p_A]

    Expand:

          p_A * α * (1-p_B) + p_A*(1-β)*p_B = p_B * α * (1-p_A) + p_B*(1-β)*p_A

    Simplify:

          p_A * α * (1-p_B) = p_B * α * (1-p_A)

    If α ≠ 0, we can divide both sides by α:

          p_A * (1-p_B) = p_B * (1-p_A)

          => p_A - p_A p_B = p_B - p_A p_B

          => p_A = p_B

    Therefore, unless p_A = p_B, we get a contradiction. The same holds if we consider the low score level.

    This shows that if we have calibration and equal FPR and FNR, then we must have p_A = p_B.

