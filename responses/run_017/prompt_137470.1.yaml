prompt: |-
  I'm in an undergraduate seminar on ethics and public policy, and we have just spent two weeks on social discounting. I want to get clearer on what our actual institutional practice commits us to. I don't need citations or a reading list, and I'd rather you worked from the practice as I describe it than from any canonical statement of it.

  Here is the pattern I can't turn into a single theory.

  (a) When a government cost-benefit analysis compares a regulation that saves lives soon with one that saves lives a century from now, it discounts the later lives at a positive annual rate, so a hundred statistical lives saved in the distant future come out worth a small fraction of a hundred saved next year.

  (b) The same government, licensing a repository for long-lived radioactive waste, evaluates the risk over a horizon of many thousands of years and in some frameworks declines to discount the harm at all, or applies something close to a zero rate.

  (c) The same government borrows at long maturity and funds basic research and disease-surveillance infrastructure, justifying the spending by benefits that arrive decades out, which implies a far lower implicit rate than the one in (a).

  (d) Courts in the same jurisdiction reduce an award for lost future earnings to present value, but do not discount the pain, the loss of a faculty, or the wrongfulness of the injury itself: those are made good in full no matter how far into the future they fall.

  (e) And in the personal case we treat it as a failing, not a preference, that I care less about my own toothache next year than about an identical one today.

  So: what view of the moral significance of time does this set of practices presuppose? More specifically, does (a) strictly presuppose pure time preference, or could the whole of the observed discounting be reconstructed as two non-temporal factors that happen to shrink with distance: a hazard factor, the chance that the benefit never arrives because the beneficiaries, the institution or the state does not survive, and a satiety factor, the thought that future people will be richer, so a unit of resource buys less welfare? If that reconstruction is available, is the practice underdetermined, licensed equally by a date-sensitive and a date-neutral theory? And where do the zero-rate and declining-rate schedules in (b) fit: do they show the practice was never committed to pure time preference, or do they substitute a different view, on which uncertainty about the rate, or extinction risk, is the only legitimate discounter?

  One proposal my seminar kicked around, which we called the Two-Key Rule, is that a public evaluation may apply a hazard factor and a satiety factor and no other temporal factor, and must state the two separately. I have three questions about it. Would the practice as it actually stands look any different under the Two-Key Rule, and if so in which of the cases above? Is the current practice really Two-Key in disguise, which would mean it presupposes nothing about pure time preference at all? And what would the defender of an explicit pure rate say is the strongest reason not to accept the reconstruction?

  Finally, one of us suggested that the discounting in (a) is not about dates at all but about identity: if who exists in a century depends on what we do now, there may be no particular person whose life is being weighed less, so the worry about pure time preference never gets a grip. Does that dissolve the puzzle or just relocate it, and does it make (a) easier or harder to reconcile with (b) through (e)? Please also tell me where in this I have described the practice wrongly, or where an inconsistency I am reading into it is only apparent.
reasoning: |-
  Okay, let me unpack this user's query. They're in an ethics and public policy seminar focused on social discounting, and they've noticed what seems like inconsistent practices across different government contexts. They want to understand the underlying moral view of time that these practices reveal, and whether pure time preference is actually necessary.

  First, I need to parse their five scenarios carefully. The life-saving regulation (a) uses high discounting, nuclear waste storage (b) uses near-zero discounting, long-term investments (c) imply medium-low rates, court awards (d) discount earnings but not pain, and personal toothache (e) judges future discounting as irrational. 

  The user's core question is whether the discounting in (a) can be fully explained by survival probability and wealth growth ("Two-Key Rule"), making pure time preference unnecessary. They're also curious about how the "no particular person" argument affects this. 

  I notice they're not asking for academic references but rather an analysis of practical consistency. That's good - I should avoid theory-diving and stay grounded in their described cases. Their seminar seems advanced; they're comfortable with terms like "satiety factor" and "underdetermined." 

  Hmm... the real tension is between (a) and (b). Why discount far-future lives for regulations but not for nuclear risks? The court case (d) adds another layer - why treat economic loss differently from pain? I need to find the hidden logic connecting these. 

  The Two-Key Rule proposal is clever. If practice separates hazard and wealth effects, it might resolve apparent contradictions. But would this change current methods? Probably not - many analyses already use declining discount rates that blend these factors. The key insight might be that pure time preference isn't explicitly endorsed but sneaks in through shortcuts. 

  On the identity argument: it makes (a) easier to justify (no specific person harmed by discounting) but worsens the clash with nuclear waste cases where we do care about unidentified future people. So it moves but doesn't solve the puzzle. 

  I should flag where their description might be off. For example, in (b), agencies sometimes use very low but non-zero rates - it's not truly undiscounted. And in (c), the implied rate isn't always consistent. These nuances matter. 

  The user seems frustrated by the inconsistency but also excited by the Two-Key idea. I'll validate that instinct while showing how current practice is already groping toward that framework without admitting it. The strongest counterargument? That separating hazard and wealth still leaves normative gaps - like how to value future welfare once those are accounted for. 

  Ultimately, the practices reveal a conflicted but pragmatic view: time matters morally only through contingent factors (risk, wealth), except when it suddenly doesn't (catastrophic risks, intrinsic harms). We're uncomfortable with pure time preference but keep using it as a placeholder.
answer: |-
  Your dissection of institutional practice reveals a sophisticated tension between ethical theories, not a single coherent view. Here's how the pieces fit (and don't fit):

  **The Core Conflict & The Two-Key Reconstruction**
  You're correct that (a) *need not* presuppose pure time preference (PTP). The observed discounting can be largely reconstructed using:
  1.  **Hazard Rate (δₕ):** Probability the benefit/harm doesn't materialize (state collapse, beneficiary extinction, project failure).
  2.  **Satiety/Wealth Effect (δw):** Expected richer future population → lower marginal utility of money/resources.

  The Two-Key Rule formalizes this reconstruction. **Would practice look different?** Yes, primarily in transparency and justification:
  *   **In (a):** Current practice often uses a single discount rate (e.g., 3-7%) blending δₕ and δw implicitly. The Two-Key Rule would force explicit quantification and justification of *both* components. Is the 0.1% extinction risk/year credible? Is 1-2% growth/year realistic over centuries?
  *   **In (b):** This *already resembles* a Two-Key approach with δw ≈ 0 (arguably, waste management doesn't make future richer) and δₕ handled *differently*. Agencies often assess *physical containment* over millennia or use *very low* discount rates precisely because they separate out catastrophic failure risk (handled via containment standards) from pure time effects. Applying a standard δₕ would be seen as unethical for catastrophic, persistent harms.
  *   **In (c):** Long-term borrowing/research often relies on lower *implicit* rates because policymakers intuitively apply lower δₕ (the state/project is seen as durable) and lower δw (benefits are broad, not monetary). The Two-Key Rule would make this intuition explicit and testable.
  *   **In (d):** Courts *partially* follow Two-Key. Lost earnings are discounted mainly for δw (expected wage growth/investment return) and δₕ (mortality risk). Non-economic damages aren't discounted because they are seen as *intrinsic wrongs/experiences* whose disutility isn't diminished by time or wealth – δw and δₕ are deemed ethically inapplicable to the *injury itself*. This highlights a limit: Two-Key applies to *instrumental* goods, not intrinsic harms.
  *   **In (e):** Personal discounting of pain *is* often seen as a cognitive failure precisely because δₕ (personal death) and δw (personal wealth change) are acknowledged as valid reasons *if accurate*, but intrinsic suffering shouldn't matter less *just* because it's later. PTP is the suspect element.

  **Is Current Practice Secretly Two-Key?**
  Mostly **yes, but imperfectly and inconsistently**. The practice *is* largely underdetermined between PTP and a Two-Key reconstruction. Agencies and courts often justify discounting *using the language* of uncertainty (δₕ) and growth (δw), even if they slap a single number on it. The zero-rate in (b) and declining schedules used in some long-term analyses (e.g., UK Green Book, Stern Review) suggest δₕ is recognized as diminishing over very long horizons (extinction risk dominates near-term, but conditional on survival, annual risk *might* decrease) or that δw is contested. **The practice wasn't *committed* to PTP; it was often *masking* δₕ and δw behind a single rate.** However, proponents of PTP *do* exist and argue for its validity.

  **The Strongest Case Against Reconstruction (Pro-PTP)**
  The defender of an explicit, positive pure time preference rate (ρ > 0) argues:
  1.  **Fundamental Impatience is Real:** Even accounting for all risks and growth, there's a residual, ethically defensible preference for well-being sooner rather than later. This reflects the intrinsic value of "presence" or a basic human/biological reality.
  2.  **Preventing Unacceptable Sacrifice:** Without ρ > 0, extremely high current costs could be justified to prevent minuscule harms in the *very* distant future (e.g., spending 50% of GDP now to avert a 0.001% welfare loss in 3000 years). ρ > 0 acts as a pragmatic safeguard against paralyzing obligations to the far future, especially given profound uncertainty. Two-Key alone might not achieve this if δₕ and δw are estimated as very low over millennia.
  3.  **Revealed Preference:** (e) suggests PTP is a deep psychological fact; while it might be irrational for *intrinsic* goods like pain, it reflects a preference structure relevant for social choice.

  **The Identity Argument: Dissolving or Relocating?**
  The argument ("no particular person exists yet, so discounting isn't harming *them*"):
  *   **Dissolves the *Parfitian* Non-Identity Problem for (a):** It removes the strongest objection *against* discounting future lives saved by regulations affecting who exists (e.g., climate policy). Discounting doesn't make specific future people *worse off* than they would otherwise be.
  *   **But Relocates/Intensifies the Puzzle Elsewhere:**
      *   **For (b):** Nuclear waste harms *will* be suffered by identifiable future people, regardless of who exists. The identity argument doesn't help justify discounting *here*. It makes the *difference* between (a) and (b) *more* pronounced, not less.
      *   **For (d):** The plaintiff *is* a specific person suffering future pain/loss. Identity isn't the issue; the nature of the harm is (instrumental vs. intrinsic).
      *   **For Ethics:** It shifts the question from "Are we harming future people?" to "Do we have the same moral obligation to bring about the existence of *possible* future people with good lives vs. protecting *actual* future people from harm?" and "How do we value potential future populations?" This is arguably harder, not easier.

  **Where Practice Might Be Misdescribed or Inconsistencies Apparent**
  1.  **(b) Zero-Rate Nuance:** Agencies rarely use *strictly* ρ=0. They often use very low rates (e.g., 0.1%) or focus on *containment performance periods* (e.g., 10,000 years) after which risk is considered "acceptable" due to dispersion/decay. The "no discounting" often applies within the performance period. The *motivation* is avoidance of PTP, but the *method* is more complex.
  2.  **(c) Implicit Rate Consistency:** The implied discount rate in long-term investments is often *not* consistent across projects or time. It reflects political will, budget constraints, and fuzzy intuition about δₕ and δw, not a single, carefully applied low rate. The "far lower rate" isn't always reliably observed.
  3.  **(d) Non-Economic Damages:** The justification for non-discounting is often practical and intuitive ("how do you discount suffering?") rather than stemming from a deep, consistent ethical theory applied across government. It's a pragmatic legal norm, potentially in tension with (a).
  4.  **The "Satiety Factor" Scope:** δw applies most cleanly to *monetary* costs/benefits or resource consumption. Its application to "statistical lives" in (a) is more contentious. Does a richer future society truly value an *additional life* less? Or just the money needed to save it? Practice often glosses over this.

  **Conclusion**
  The institutional practice **presupposes no single, coherent view** of the moral significance of time. It reflects a **pragmatic, context-dependent blend**:
  1.  **Instrumental vs. Intrinsic Goods:** Time matters differently for money/earnings/resources (discounted via δₕ, δw, ±ρ) vs. intrinsic harms/pain/wrongs (largely not discounted).
  2.  **Risk Dominance:** Hazard (δₕ) is a primary driver, handled explicitly for catastrophes (b) and implicitly elsewhere. Pure time preference (ρ) is often an unacknowledged guest at the table.
  3.  **Wealth Effects:** δw is widely (though often crudely) applied to monetary flows and resource-intensive benefits.
  4.  **Time Horizon:** Very long horizons expose the limits of constant discount rates and force quasi-zero rates or alternative frameworks (b), revealing the underlying reliance on δₕ and δw.

  **The Two-Key Rule** is largely a **rational reconstruction** and **prescriptive improvement** of existing practice, forcing transparency and separating justifiable factors (δₕ, δw) from the ethically contested ρ. Current practice *can* be understood this way, but inconsistently. Adopting Two-Key openly would make the ethical choices clearer, resolve some inconsistencies (e.g., justifying different rates for different contexts), and likely reduce the *de facto* role of PTP, though proponents of ρ would argue it neglects a legitimate normative element. The identity argument helps with *one specific justification problem* in (a) but doesn't resolve the broader tensions, especially with (b).
