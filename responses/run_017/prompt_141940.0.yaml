prompt: |-
  I'm building the epistemic machinery for a simulation of a small team of software auditors who have to decide which of a very large set of claims about a codebase to check before signing off, and I keep hitting the same wall. The standard possible-worlds treatment of belief — the one on which an agent's beliefs are the propositions holding throughout every world compatible with what the agent takes to be the case — makes each auditor believe every logical consequence of what they believe, including consequences that would take longer than the age of the universe to derive, and makes them indifferent between formulations that differ only in how hard the equivalence is to see. I need belief to do two things: predict which claim an auditor will check, act on, or ignore next, and give me a standard for saying that an auditor's reasoning has gone wrong rather than merely stopped short. So before I go shopping for a formal framework, I want the specification one would have to meet.

  Please write the desiderata for a theory of a bounded agent's beliefs: the cases it must get right, the distinctions it must respect, the results from logic and computational complexity it cannot contradict, and the constraint behind each. I have a partial list, which you should correct, reorder, and extend rather than just execute. It includes: an auditor who believes a conditional and its antecedent but has not drawn the conclusion, and must not thereby be described as believing the conclusion; an auditor whose beliefs are jointly inconsistent, who must not thereby believe everything; the requirement that inference sometimes does extend belief, so that noticing a consequence is a genuine way to acquire one (a theory that makes the agent a logical idiot is no better than one that makes it a god); the requirement that some substitutions of equivalents go through while the hard ones do not, and some principled account of where that line falls; the problem I think of as the prefix problem, that closure under each small step, iterated, seems to rebuild full omniscience one cheap step at a time, so the break in the chain has to be located rather than stipulated; and two things I have made up and am suspicious of myself — an attributable-gap condition, on which every permitted failure of closure must be traceable to a specifiable and independently checkable limitation of the agent (a resource bound, a blind spot for a class of equivalences, an unrecognized instance of a schema) rather than posited case by case, and the leash, on which a failure of closure cannot be permanent: if both premises of a one-step inference are occurrent and the agent has the capacity to perform it, the model must be committed to the agent either acquiring the conclusion or giving up a premise, never to a state suspended indefinitely. Also address, with cases: whether belief attaches to propositions or to representations, given that derivational difficulty shifts with how a proposition is written down; what stops a fine-grained notion of belief from degenerating into the modeler attributing any pattern of belief and calling it boundedness; what the theory implies about beliefs about other agents' beliefs, given that the usual results about common belief and agreement presuppose the idealization I am trying to remove; what the graded-belief analogue looks like, since a probability function is already fully coherent over every logical relation; and how the theory represents an agent whose inferential powers improve, and how it marks the difference between an auditor who has not yet noticed a consequence and one who would reject it.

  Mark which requirements are non-negotiable for my two purposes and which are really preferences of one research program; say whether prediction and normative evaluation pull the specification in different directions; flag any pair of requirements you suspect cannot be jointly satisfied, and tell me which single requirement does the most work in excluding candidates. Then, briefly and only for the approaches you can characterize without guessing, how the main families of response to the problem of logical omniscience do against the list; skip any you would have to reconstruct from half-remembered details, since the criteria are the deliverable and the scorecard is a footnote. Please write in American English.
reasoning: |-
  We are building desiderata for a theory of bounded agent beliefs, tailored for a simulation of software auditors. The primary purposes are:
  1. Predict which claim an auditor will check, act on, or ignore next.
  2. Provide a standard for evaluating when an agent's reasoning has gone wrong (as opposed to merely being incomplete).

  We have a partial list of requirements. We will reorganize, extend, and correct as needed.

  ## Core Non-Negotiable Requirements (for both prediction and normative evaluation)

  1. **Non-closure under logical consequence (explicit failure of omniscience)**:
     - *Case*: An auditor believes a conditional (P → Q) and its antecedent (P) but has not drawn the consequent (Q). The theory must not represent the auditor as believing Q until the inference is made.
     - *Constraint*: Avoids the idealization that agents automatically believe all logical consequences.

  2. **Inconsistency without explosion**:
     - *Case*: An auditor holds an inconsistent set of beliefs (e.g., P and ¬P) but does not believe every proposition (explosion). The theory must allow for inconsistent beliefs without trivializing the belief state.
     - *Constraint*: Real agents can hold inconsistent beliefs without being aware of the inconsistency, and without collapsing into believing everything.

  3. **Inference as belief extension**:
     - *Case*: When an auditor performs an inference (e.g., modus ponens on P and P→Q to get Q), the theory must represent the acquisition of a new belief (Q) that was not previously held. This must be a genuine change in the belief state.
     - *Constraint*: The theory must account for the dynamics of belief change through reasoning.

  4. **Sensitivity to formulation (fine-grained representation)**:
     - *Case*: An auditor may believe a proposition expressed in one form (e.g., "x is even") but not in an equivalent form that is computationally hard to recognize (e.g., a complex arithmetic expression that is even only if a certain large number is a perfect square). The theory must respect that some equivalences are not transparent to the agent.
     - *Constraint*: The cognitive cost of recognizing logical equivalences varies and must be modeled.

  5. **The prefix problem (step-wise closure without omniscience)**:
     - *Problem*: If we close belief under each small (efficient) inference step, then by iterating we can derive all consequences, which is infeasible. The theory must break this chain without arbitrary stipulation.
     - *Constraint*: The theory must have a principled account of why some chains of reasoning are not performed (e.g., due to resource limits, lack of attention) without rebuilding omniscience.

  6. **Attributable gap condition**:
     - *Requirement*: Every failure of logical closure must be attributable to a specifiable and independently checkable limitation of the agent (e.g., bounded computational resources, limited memory, lack of specific inference rules, inattention). This must not be done case by case but by general principles.
     - *Constraint*: Prevents ad hoc explanations and ties boundedness to measurable constraints.

  7. **The leash (dynamic commitment to resolution)**:
     - *Requirement*: If both premises of a one-step inference (e.g., modus ponens) are occurrent (currently attended to) and the agent has the capacity to perform the inference (in terms of resources and rules), then the agent must either acquire the conclusion or drop one of the premises in a timely manner. The state of having both premises occurrent and the capacity to infer, but never doing so, is forbidden.
     - *Constraint*: Ensures that the agent is not stuck in an irrational state when the inference is immediate and resources are available.

  ## Additional Requirements (Non-Negotiable or Highly Important)

  8. **Representation matters**:
     - *Requirement*: Belief must attach to representations (sentences, mental tokens) rather than purely to propositions, because the same proposition under different representations may have different cognitive accessibility.
     - *Constraint*: Derivation difficulty depends on syntactic form and the agent's processing capabilities.

  9. **Avoidance of degeneracy**:
     - *Requirement*: The theory must not allow the modeler to attribute arbitrary belief patterns and call it boundedness. There must be objective constraints (e.g., resource bounds, algorithmic limitations) that explain the pattern.
     - *Constraint*: Maintains the normative and predictive power of the model.

  10. **Beliefs about others' beliefs**:
      - *Requirement*: The theory must account for how bounded agents form beliefs about other bounded agents' beliefs, without presupposing common knowledge (which typically relies on logical omniscience).
      - *Constraint*: In multi-agent settings (like a team of auditors), agents must be able to reason about each other's limited knowledge and reasoning.

  11. **Graded belief (probability)**:
      - *Requirement*: For graded beliefs (e.g., probabilities), the theory must not require that the agent's degrees of belief satisfy the laws of probability over every logical relation (which would require omniscience). Instead, it should allow for incoherence due to bounded resources.
      - *Constraint*: Extends the account to uncertainty without idealization.

  12. **Inferential improvement**:
      - *Requirement*: The theory must represent an agent whose inferential powers improve (e.g., by learning new rules, increasing resources). It must also distinguish between an auditor who has not yet drawn a consequence and one who would reject it.
      - *Constraint*: Models agents that learn and change over time.

  ## Distinguishing Non-Negotiable from Preferences

  - **Non-Negotiable** (for the two purposes): 1, 2, 3, 4, 5, 8, 9, 12 (the last part about distinguishing not-yet-noticed from rejection). Also, 6 and 7 are non-negotiable for normative evaluation and dynamic prediction, respectively.
  - **Important but Possibly Debatable**: 10 (if multi-agent reasoning is central) and 11 (if graded beliefs are used). The attributable gap condition (6) and the leash (7) are non-negotiable for a principled account, but their exact form might be adjusted.

  ## Tensions and Potential Incompatibilities

  - **Tension between prediction and normative evaluation**: 
    - Prediction might require a more permissive model (to capture actual, possibly irrational, behavior) while normative evaluation requires clear standards. The attributable gap condition (6) and the leash (7) help bridge this by tying failures to objective limitations.

  - **Potential Incompatibilities**:
    - The leash (7) and the requirement for non-closure (1) might seem at odds: the leash demands that when premises are occurrent and the step is feasible, the conclusion must be drawn (or a premise dropped). But non-closure requires that we don't have closure for all consequences. The resolution is that the leash only applies when the inference is immediate and resources are available. The challenge is defining "occurrent", "capacity", and "timely" without arbitrariness.
    - The attributable gap condition (6) and the prefix problem (5): We must avoid stipulating gaps arbitrarily. The requirement is that gaps are explained by general resource bounds, but the prefix problem warns that even small steps can accumulate. We need a theory that naturally breaks the chain (e.g., by modeling attention or step limits).

  - **Most Exclusionary Requirement**: The **attributable gap condition (6)** does the most work in excluding candidate theories because it forces a principled, non-arbitrary account of boundedness. Without it, one could just list exceptions, which would be ad hoc and not scalable.

  ## Cases for Key Requirements

  - **Case for representation sensitivity**: 
    - Auditor A sees "n is even" and believes it. Auditor A also sees "n = 2 * k" and believes that. But when seeing "n mod 2 = 0", which is equivalent, Auditor A might not believe it if the equivalence is not recognized (due to different representation). The theory must capture this.

  - **Case for beliefs about others' beliefs**:
    - Auditor A believes that claim C is true. Auditor A also believes that Auditor B has checked C. But Auditor A does not believe that Auditor B believes C, because Auditor A knows that Auditor B might have made a mistake or missed a step. The theory must allow for nested beliefs without common knowledge.

  - **Case for inferential improvement and distinguishing non-drawn from rejected**:
    - Auditor A has not yet derived Q from P and P→Q. This is represented as a gap. After a reasoning step, the gap is filled. Alternatively, if Auditor A would reject Q (e.g., because they disbelieve the conditional when pressed), then the state is different. The theory must have a way to mark the difference (e.g., by having a potential for rejection).

  ## Graded Beliefs

  For graded beliefs (probabilities), the requirement is to avoid the assumption that the agent has a coherent probability distribution over all propositions. Instead, the agent might assign probabilities based on available representations and might not satisfy the laws of probability for equivalent propositions (if the equivalence is not recognized). The theory should allow for updating that is locally rational but globally incoherent.

  ## Approaches to Logical Omniscience and How They Fare

  We briefly consider main approaches without deep reconstruction:

  1. **Impossible Worlds**:
     - *Idea*: Extend possible worlds with impossible ones where logical truths may fail. Agents are modeled as not distinguishing impossible worlds.
     - *Against our list*: 
       - (+) Handles non-closure (1) and inconsistency without explosion (2).
       - (-) Often lacks an attributable gap condition (6) — why is a particular world included? It may be arbitrary.
       - (-) Does not naturally handle dynamics (inference as belief extension, 3) or the leash (7).
       - (-) The prefix problem (5) remains: why stop at some impossible worlds and not others?
       - (-) Representation sensitivity (4) is not addressed directly (worlds are usually propositional).

  2. **Syntax-Based Approaches (e.g., Belief Bases)**:
     - *Idea*: Beliefs are represented as explicit sentences in a base, and closure is not assumed. Inference rules expand the base.
     - *Against our list*:
       - (+) Naturally handles non-closure (1) and inference as extension (3).
       - (+) Can handle representation sensitivity (4) by using syntactic forms.
       - (+) Can address the leash (7) by modeling inference as an operation on the base.
       - (-) The attributable gap condition (6) must be added by imposing resource bounds on the inference process.
       - (-) The prefix problem (5) is handled by limiting the number of inference steps, but this must be done without arbitrariness (e.g., via a cost model).
       - (-) Inconsistency (2) may still lead to explosion if not controlled (e.g., by paraconsistent rules or by not deriving everything).

  3. **Resource-Bounded Reasoning (e.g., Bounded Rationality, Time-Limited Computation)**:
     - *Idea*: Model the agent as a computational device (e.g., a Turing machine) with limited resources (time, memory). Beliefs are what the agent can derive within bounds.
     - *Against our list*:
       - (+) Directly addresses the attributable gap condition (6) and the prefix problem (5) by explicit resource constraints.
       - (+) Handles non-closure (1) and inference as extension (3) via computation.
       - (+) Can model representation sensitivity (4) by having representations affect the computational cost.
       - (+) The leash (7) can be handled by requiring that immediate inferences (low cost) are performed when the premises are considered.
       - (+) Can naturally handle improvement (12) by increasing resources.
       - (-) Inconsistency (2) might be less natural, but one can use paraconsistent logics or non-explosive systems.
       - (-) Beliefs about others' beliefs (10) become complex (nesting computations within bounds).

  4. **Dynamic Doxastic Logic (DDL) and Belief Revision**:
     - *Idea*: Model belief change operations (expansion, contraction, revision) with dynamic operators.
     - *Against our list*:
       - (+) Handles inference as extension (3) and dynamics.
       - (-) Without additional constraints, it does not address boundedness (may assume closure under logical consequence).
       - (-) The other requirements (like representation sensitivity) are not built in.

  5. **Probabilistic Approaches with Bounds (e.g., Bounded Probabilistic Reasoning)**:
     - *Idea*: Use probability but with approximations (e.g., sampling, bounded computation for updating).
     - *Against our list*:
       - (+) Addresses graded belief (11) naturally.
       - (+) Resource bounds can be added (6,5).
       - (-) May not handle categorical belief well (which is central to auditors checking claims).

  ## Summary of Recommendations

  For your purposes (simulation of auditors), a **resource-bounded reasoning approach** (with explicit computational models) seems best suited because it naturally meets the attributable gap condition and the leash, and it handles representation sensitivity and dynamics. However, it must be augmented to handle inconsistency without explosion (e.g., by using a paraconsistent logic) and beliefs about other agents (by modeling nested bounded reasoning).

  The most critical non-negotiable requirements are the attributable gap condition (6) and the leash (7) for a principled and dynamic account.

  Finally, note that the requirement to **distinguish between an auditor who has not yet noticed a consequence and one who would reject it** can be addressed by having:
  - A positive disposition to accept the consequence if the premises are held (so the gap is due to lack of resources/attention) vs.
  - A negative disposition (the agent has considered and rejected the inference, perhaps due to a prior belief in the negation of the consequence).

  This requires modeling the agent's attitude toward potential inferences.
answer: |-
  Below is a comprehensive specification of desiderata for a theory of bounded belief tailored to your software auditor simulation. I've reorganized, extended, and refined your partial list, grouping requirements into **core non-negotiables** (essential for prediction and normative evaluation) and **secondary priorities** (valuable but potentially negotiable or program-dependent). I flag tensions, feasibility risks, and the role of each requirement. Finally, I briefly score major approaches to logical omniscience against the list.

  ---

  ### **Core Non-Negotiable Requirements**  
  *Essential for prediction (e.g., "what claim will the auditor check next?") and normative evaluation (e.g., "did reasoning go wrong?").*

  1. **Explicit Failure of Logical Omniscience**  
     - **Case:** An auditor believes `P → Q` and `P` but has not (yet) inferred `Q`. The model must *not* attribute belief in `Q`.  
     - **Constraint:** Predicts inaction (e.g., auditor ignores `Q`). Normatively, failing to infer is *not* an error if the agent hasn’t "seen" the connection.  
     - **Key for:** Prediction, normative evaluation.

  2. **Inconsistency Without Explosion**  
     - **Case:** An auditor believes inconsistent claims (e.g., `P` and `¬P` due to conflicting reports) but does not believe *every arbitrary proposition* (e.g., doesn’t believe "the codebase is written in Sanskrit").  
     - **Constraint:** Real agents tolerate local inconsistencies; explosion contradicts prediction (auditors don’t check everything) and norms (errors are localized).  
     - **Key for:** Prediction (prioritization), normative evaluation (isolating errors).

  3. **Inference as Genuine Belief Extension**  
     - **Case:** When an auditor explicitly infers `Q` from `P` and `P → Q`, the model must update beliefs to include `Q` (if no rejection occurs).  
     - **Constraint:** Inference must *change* the belief state; a theory where inference never adds beliefs is as useless as one where it adds all.  
     - **Key for:** Prediction (modeling learning), normative evaluation (crediting correct reasoning).

  4. **Sensitivity to Representational Form**  
     - **Case:** An auditor believes "`n` is even" (simple) but not "`n² ≡ 0 mod 4`" (complex equivalent) because the equivalence requires non-trivial arithmetic. Substituting equivalents only "goes through" for low-cost transformations.  
     - **Constraint:** Computational hardness (e.g., polynomial-time reductions vs. exponential proofs) must affect belief attribution. Ignores logically equivalent but cognitively distant formulations.  
     - **Key for:** Prediction (which formulations trigger checks), normative evaluation (when simplification is "obvious").

  5. **Attributable-Gap Condition**  
     - **Case:** If an auditor fails to believe a consequence `Q` of their beliefs, this must be traceable to a *specific, measurable limitation* (e.g., "lacks capacity for proofs beyond depth-3", "hasn’t run SAT solver for >10ms", "doesn’t recognize distributivity in Boolean algebra").  
     - **Constraint:** Gaps cannot be arbitrary; must derive from agent-specific constraints (resources, algorithms, learned schemas). Prevents degeneracy (see §9).  
     - **Key for:** Normative evaluation (errors are *explainable*), prediction (gaps suggest required resources).

  6. **The Leash (Dynamic Commitment to Resolution)**  
     - **Case:** If an auditor has `P` and `P → Q` *occurrently* (actively attended to) and capacity to perform MP (e.g., it’s a "cheap" inference), they must *eventually* believe `Q` or drop `P`/`P→Q`. No permanent stasis.  
     - **Constraint:** Forces timely resolution of "salient" inconsistencies/inferences. "Capacity" depends on resources and attention.  
     - **Key for:** Prediction (modeling urgency), normative evaluation (persistent inattention is irrational).

  7. **Prefix Problem Solution**  
     - **Case:** An auditor can perform single-step inferences (e.g., MP) but cannot chain 1,000 such steps to prove a cryptographic claim. The model must *not* implicitly attribute the final result.  
     - **Constraint:** Must block "step-wise omniscience" via *cost-aware chaining* (e.g., tracking derivation depth, time, memory). Failure must stem from §5 (e.g., "depth limit = 10 steps").  
     - **Key for:** Prediction (auditor abandons long proofs), normative evaluation (distinguishing feasible/infeasible reasoning).

  8. **Non-Degeneracy Constraint**  
     - **Case:** A model attributing arbitrary belief patterns (e.g., "auditor believes `A` but not `A ∨ B` for no reason") is invalid. All deviations from logic must be justified by §5.  
     - **Constraint:** Boundedness ≠ arbitrariness; belief patterns must be *systematically constrained* by resources/architecture.  
     - **Key for:** Preventing "anything goes" models that fail prediction/norms.

  ---

  ### **Secondary Priorities**  
  *Important but potentially flexible depending on simulation goals.*

  9. **Beliefs About Other Agents’ Beliefs**  
     - **Case:** Auditor A believes claim `C` is true, knows Auditor B checked `C`, but *does not* believe Auditor B *believes* `C` (B may have missed a step). Common belief must not arise from trivial reasoning.  
     - **Constraint:** Nested beliefs require explicit justification (e.g., A witnessed B’s report). Avoids idealizations behind common knowledge.  
     - **Role:** Critical for multi-agent coordination; may be negotiable if auditors work solo.

  10. **Graded Belief Without Probabilistic Omniscience**  
      - **Case:** An auditor assigns `P(H)` = 0.7 and `P(H|E)` = 0.8 but hasn’t computed `P(E)` due to complexity. They needn’t satisfy `P(H) = P(H|E)P(E) + ...` globally.  
      - **Constraint:** Probabilities must respect *locally computed* coherence (e.g., within cognitive bounds), not global coherence.  
      - **Role:** Needed if auditors use probabilistic heuristics; else omit.

  11. **Inferential Improvement and Disposition Tracking**  
      - **Case:** After training, an auditor now recognizes Boolean equivalences they previously missed. The model must reflect improved capacity. Also, distinguishes "hasn’t considered `Q`" (gap) from "would reject `Q` if proposed" (disposition).  
      - **Constraint:** Requires time-varying parameters (§5) and "dispositional beliefs" (e.g., inference rules the agent *would* accept).  
      - **Role:** Prediction (learning effects), norms (distinguishing ignorance from error).

  ---

  ### **Tensions, Risks, and Key Constraints**
  - **Prediction vs. Normative Evaluation Tension:**  
    Prediction favors descriptive flexibility (e.g., "auditor ignores `Q` due to stress"), while norms demand prescriptive rigor (e.g., "should have inferred `Q` given resources"). **Resolution:** §5 (attributable gaps) bridges both—gaps are predictable *and* evaluable against agent capacity.

  - **Feasibility Risks:**  
    - §5 (**attributable-gap condition**) and §8 (**non-degeneracy**) may conflict with §4 (**sensitivity to representation**) if representations are "too fine-grained." Risk: The model becomes computationally intractable.  
    - §6 (**the leash**) and §1 (**non-closure**) may clash if "timely resolution" is underdefined. Risk: The leash forces near-closure for simple inferences.  
    - **Strongest Exclusionary Requirement:** §5 does the most work. Without attributable gaps, models degenerate into unmotivated exceptions (§8) or fail normative evaluation.

  - **Representation vs. Proposition:**  
    Belief must attach to *representations* (e.g., specific syntactic forms) because derivational difficulty depends on form (§4). Propositions alone erase computational differences.

  ---

  ### **Approaches to Logical Omniscience: Quick Scorecard**
  *(Limited to frameworks I can characterize confidently; others skipped as requested.)*

  | **Approach**               | **Key Idea**                                  | **Fails Core Requirements**                          | **Meets Core Requirements**               |
  |----------------------------|-----------------------------------------------|------------------------------------------------------|------------------------------------------|
  | **Possible Worlds (Ideal)** | Belief = truth in all accessible worlds.      | All: Assumes omniscience (§1,2,4,5,7).              | None.                                    |
  | **Belief Bases**           | Beliefs stored as explicit sentences; no closure. | §3 (inference doesn’t extend belief), §6 (no leash), §7 (prefix problem unsolved). | §1,2,4 (if representations are tracked). |
  | **Resource-Bounded Reasoning** | Agents as algorithms with time/memory limits. | §6 (leash) if "attention" isn’t modeled.            | **All** if gaps tied to resources (§5,7), inference extends beliefs (§3), and representations matter (§4). |
  | **Impossible Worlds**      | "Worlds" where logic may fail.                | §5 (gaps not attributable), §8 (risk of arbitrariness). | §1,2,4.                                  |
  | **Active Logic**           | Time-indexed beliefs; inference as timed steps. | §5 (gaps may lack explicit causes).                  | §1,3,6 (leash via step limits), §7.      |

  **Best Fit:** **Resource-Bounded Reasoning** (e.g., modeled as bounded Turing machines or proof systems with step limits) satisfies most core requirements, especially when combined with explicit representation (§4) and attributable gaps (§5). **Active Logic** is a contender if attention (§6) is prioritized.

  ---

  ### **Recommendations**  
  1. **Start with resource-bounded reasoning** (e.g., agents as proof systems with computational constraints). It naturally handles §1–8 and extends to §9–11.  
  2. **Formalize the attributable-gap condition (§5)** first—it’s the linchpin for avoiding degeneracy and linking prediction/norms.  
  3. **Use syntactic representations** with costed inference rules (e.g., MP = 1 "step", complex equivalence-check = 50 "steps") to handle §4 and §7.  
  4. **For the leash (§6)**, model "occurrent beliefs" as a working memory subset, with priority queues for inference.  

  This spec balances realism and rigor. If stripped to **minimal essentials**, focus on §1–6 and §8—they define the core of boundedness without over-abstracting.
