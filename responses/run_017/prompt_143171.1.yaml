prompt: |-
  I sit on the serious-incident review panel at a hospital, and I keep hitting a pattern I have no vocabulary for. Some of the items we list as contributing factors are things that did not happen. Four recurring shapes:

  (1) A patient deteriorated overnight, and we recorded "the night nurse did not check on him at 4 a.m." But virtually nothing that could have happened did happen — nobody checked at 3:50 either, nobody called the family, nobody on the floor was doing almost anything anyone might conceivably have done. A few non-occurrences make the list; all the rest don't. I can see that we are selecting, but not what the selection tracks: the person's role, what was normally to be expected, whether acting would have made a difference, or something else.

  (2) In another review, three people separately failed to perform the same check, and any one of them performing it would have caught the problem. No individual failure made a difference — had any one acted, the outcome would have been what it was anyway — yet we listed all three, and nobody accepted from any one of them that "my failure didn't matter, the others would have failed too."

  (3) Sometimes the item is nobody's failure at all: "the alarm did not sound." No one omitted anything at the time; it had been muted weeks earlier by another team. It still behaves like case (1) on our list, and I can't tell whether it belongs in the same box.

  (4) Occasionally the non-action is on the good side: a resident did not override the standard protocol, and because she did not, the patient did better than he would have had she intervened. It feels right to call that a cause too, but the word sits badly with us in a review.

  A philosopher friend said "that's just causation by omission," which covers every one of these and therefore none of the distinctions I need; another muttered about "double prevention" and wouldn't explain. Is there an established concept — or several — that carves this up the way I want: the selection problem in (1), the redundancy in (2), the non-agential items in (3), the beneficial ones in (4)? If several are needed, tell me which fits which case and where they overlap or conflict. If some combination of my cases has no established label, coin a term and define it with boundary cases. I want the carving, not a name.

  Format: give me a markdown table with one row per candidate concept, established or coined, with columns: label | established_or_coined | definition_in_one_sentence | cases_covered (by number) | weakest_case (which of 1–4 it handles worst, and why) | coverage (0–100, how much of the total pattern it captures). Under the table, two short labelled lines: confidence (0–100) and what_would_change_this_verdict — the argument or distinction that would make you re-carve or relabel, and where your own carving is most likely to be wrong. Also say whether your answer depends on what the review is for (blame, learning, insurance), or whether "cause" has to mean the same thing in all four cases.
reasoning: |-
  Hmm, this is a fascinating and complex query about analyzing non-events in medical incident reviews. The user sits on a hospital serious-incident review panel and has observed four distinct patterns where "things that did not happen" are listed as contributing factors. They need conceptual tools to distinguish between these patterns, specifically:

  1. Selective listing of omissions where many things didn't happen but only some make the list  
  2. Multiple redundant omissions where any single action could have prevented harm  
  3. System failures rather than human omissions  
  4. Beneficial non-actions that improved outcomes  

  The user explicitly wants conceptual carving rather than just terminology, and has rejected "causation by omission" as too broad. They're clearly highly analytical (mentions philosopher friends) and needs practical taxonomy for real-world application.  

  Key challenges:  
  - Differentiating between selection criteria in pattern 1 (why some omissions get listed while others don't)  
  - Handling redundancy in pattern 2 (where no single omission was necessary)  
  - Assigning appropriate "agency" in pattern 3 (system vs human factors)  
  - Reconciling beneficial outcomes with causal language in pattern 4  

  Approach:  
  I'll need to draw from:  
  1. Philosophy of causation (omissions, preemption, double prevention)  
  2. Systems safety engineering (Swiss cheese model, latent conditions)  
  3. Medical error taxonomy (WHO classifications)  
  4. Legal concepts (but carefully, as user wants learning-focused framing)  

  Critical insight: The user isn't just classifying omissions - they're reverse-engineering the review panel's implicit selection heuristics. The taxonomy must expose those hidden criteria.  

  For the table:  
  Will propose 5 concepts:  
  - Normative Omission (covers expected duties)  
  - Redundant Causation (for multiple failure points)  
  - Latent Condition Failure (for system-level issues)  
  - Preventive Non-Intervention (beneficial inaction)  
  - AND a synthesized concept "Salient Omission" specifically for their selection problem  

  Special attention to:  
  - How "weakest case" reveals each concept's limitations  
  - Coverage percentages showing conceptual overlap  
  - Distinguishing between human vs system agency  

  Post-table analysis must address:  
  - Why "cause" doesn't mean the same in all cases  
  - How purpose (blame vs learning) affects categorization  
  - Where this taxonomy might fail (particularly for pattern 1's selection mystery)  

  Confidence at 85% - mainly because pattern 1's selection criteria may be context-dependent in ways hard to capture universally. The biggest vulnerability is whether "salience" can be objectively defined.
answer: |-
  Below is a conceptual carving of your patterns, designed to expose the *selection criteria* and *causal distinctions* hidden in your panel's approach. The taxonomy prioritizes **functional purpose** (learning from failures) over philosophical purity.  

  ### Conceptual Taxonomy for Non-Events in Incident Reviews  

  | Label                     | Established or Coined | Definition in One Sentence                                                                 | Cases Covered | Weakest Case (Why)                                                                 | Coverage (0–100) |  
  |---------------------------|------------------------|-------------------------------------------------------------------------------------------|---------------|------------------------------------------------------------------------------------|------------------|  
  | **Normative Omission**    | Established¹          | Failure to perform an action *expected by role/protocol*, where performance was feasible and contextually required.       | 1, 2          | **Case 3**: Not agential; expectations apply to systems, not just people.          | 70%              |  
  | **Redundant Causation**   | Established²          | Multiple failures where *any single action* could have prevented harm, making each failure causally relevant despite mutual dependency. | 2             | **Case 4**: Only covers harmful outcomes; beneficial non-actions don’t fit.        | 25%              |  
  | **Latent Condition Failure** | Established³          | A system defect (e.g., muted alarm) that *enabled* harm but required no *contemporaneous* human omission to manifest.      | 3             | **Case 1**: Doesn’t explain why *specific human omissions* are selected from many. | 30%              |  
  | **Preventive Non-Intervention** | Coined⁴               | Beneficial *inaction* where adherence to protocol/system constraints averted worse harm.                                 | 4             | **Case 2**: Not applicable to harmful outcomes or redundant failures.              | 15%              |  
  | **Salient Omission**      | Coined⁵               | A non-event selected for review *because it was both (a) normatively expected and (b) counterfactually decisive* (i.e., acting would likely have changed the outcome). | 1, 2, (3*)    | **Case 4**: Only harmful omissions; beneficial ones are structurally different.    | 85%              |  

  ¹ *Derived from duty-of-care frameworks in healthcare/ethics.*  
  ² *From causal redundancy models (e.g., NESS criteria).*  
  ³ *Adapted from Reason’s "Swiss Cheese Model" (latent errors).*  
  ⁴ *Constructed for beneficial constraint adherence.*  
  ⁵ *Synthesized to solve the "selection problem" in Case 1, combining norms and counterfactuals.*  
  \* *Case 3 fits Salient Omission only if the alarm’s muting was a normative breach (e.g., violating safety protocols).*  

  **Confidence**: 85/100  
  **What would change this verdict**: If the panel’s *primary goal* shifts from **learning** (system improvement) to **blame** (individual accountability) or **compensation** (legal liability), the taxonomy collapses. For blame, "Normative Omission" dominates; for compensation, "Counterfactual Dependence" (not listed) would be central.  

  ### Key Clarifications  
  1.  **"Salient Omission" resolves Case 1**: Your panel lists non-events that are both (a) *expected* (e.g., 4 a.m. check is protocol) and (b) *decisive* (checking *likely* would have detected deterioration). Non-listed omissions fail one/both (e.g., calling family may not be protocol; acting at 3:50 might not alter outcome).  
  2.  **Case 2 is "Redundant Causation"**: Each failure is listed because *any one* could have prevented harm—no individual gets a pass because the outcome was overdetermined.  
  3.  **Case 3 is "Latent Condition Failure" if systemic, but "Salient Omission" if normative**: A muted alarm is a system flaw (no one *omitted* action *during the incident*). If muting violated policy, it becomes a "Salient Omission" by prior agents.  
  4.  **Case 4 is distinct**: Beneficial non-actions ("Preventive Non-Intervention") are causal in a *constraint-satisfaction* sense (not intervening *preserved* safety), but calling them "causes" feels odd as they avert harm.  

  ### Why "Cause" Isn’t Uniform  
  - **Harmful outcomes** (Cases 1–3): "Cause" ≈ *preventable breach in a safety-critical sequence*.  
  - **Beneficial outcomes** (Case 4): "Cause" ≈ *correct adherence to constraints* (avoiding iatrogenic harm).  
  Your discomfort in Case 4 arises because *causal language* is inherently outcome-relative. In reviews, reframe it as **"protocol adherence as a protective factor."**  

  ### Where This Carving Might Fail  
  - **Salient Omission’s weakness**: It assumes panels accurately assess "decisiveness." In reality, hindsight bias may overestimate what "would have" happened (e.g., would a 4 a.m. check *really* have helped?).  
  - **Case 1’s depth**: If omissions are selected based on *blameworthiness* (e.g., nurse’s role > family’s) not outcome decisiveness, revert to **"Normative Omission" alone**.  

  This framework makes implicit review heuristics explicit—prioritizing actions that *should and could* have changed outcomes. For learning, focus on **Salient Omissions** and **Latent Conditions**; they best expose system flaws.
