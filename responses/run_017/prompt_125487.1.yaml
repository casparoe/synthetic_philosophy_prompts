  First possible diagnosis: reject (2)'s tracking condition. This would preserve realism but at the cost of abandoning a major externalist approach to justification. Second: challenge (3)'s modal robustness claim. This might save moral justification but requires showing how moral facts could counterfactually depend on our beliefs without collapsing to anti-realism. Third: block the generalization to (5) by finding a relevant difference between moral and epistemic domains. This maintains (4)'s threat to realism but needs to explain why epistemic norms escape debunking. Fourth: accept (5) and bite the bullet on global skepticism. This is coherent but at the unacceptable cost of philosophical suicide.

  The strongest solution lies in carefully rejecting (3)'s blanket modal robustness claim. Moral facts might counterfactually co-vary with our beliefs through constitutive relationships or response-dependence, without sacrificing objectivity. For example, welfare might be both fitness-conducive and genuinely valuable. This preserves (1)'s genealogies while allowing justification through tracking. The cost is adopting a more nuanced realism that incorporates natural facts.

