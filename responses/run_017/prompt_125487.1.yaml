  Looking at the structure: premise (1) presents bypassing genealogies for moral beliefs, (2) gives a tracking condition for justification, (3) establishes independence of moral facts, leading to (4) that moral beliefs are unjustified. The generalization in (5) extends this to epistemic norms, creating self-undermining problems in (6), forcing rejection of some premise in (7).

