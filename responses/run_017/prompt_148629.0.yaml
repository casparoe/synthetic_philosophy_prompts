prompt: |-
  I'm writing a novel set in an early-modern fishing village — no print, no mass media, nothing that can "go viral" the modern way — and I want a plot turn where some practice takes over the whole village and leaves nearly everyone worse off by their own lights: poorer, hungrier, less safe. Not genetically less fit, just worse off.

  So build me a case where the meme's-eye explanation wins and the bearer-level one loses, i.e. the direction people say can't happen, since the bearer-level story (variant frequencies are explained by what the variant does for the people carrying it, plus ordinary transmission biases like copying the successful or copying the majority) is supposed to always be available as a redescription. Constraints: two rival variants, both equally attractive and equally easy to learn, so the winner can't just be the one people prefer; the winner must not work by deceiving anyone or by hooking some cognitive bias; it has to win on the transmission channel itself. One paragraph, realistic, and something I could actually show in a scene rather than report as a statistic.

  After the scenario: what each framing predicts and why, which single feature is doing the work, what the case collapses into if I take that feature out, and the best line a bearer-level theorist would use to say I've only described a transmission bias in fancy language.
reasoning: |-
  We are given: an early-modern fishing village, no mass media. We need a cultural practice that spreads and leaves the village worse off, without deceiving anyone or exploiting a cognitive bias. It should win purely on transmission dynamics, with two equally attractive variants.

  Scenario: The village has two methods for preserving fish for winter: "salt-packing" and "smoke-drying." Both are equally effective at preservation and equally costly in labor and resources when adopted individually. However, smoke-drying has a hidden transmission advantage: it is a social activity. The smokehouse is a shared space where multiple families can work at once, while salt-packing is done individually in family huts.

  When a family adopts smoke-drying, they join the smokehouse. There, they interact with others, share stories, and form bonds. This social aspect does not make the method more effective (it doesn't preserve better), but it creates more opportunities for the practice to be transmitted. Children playing in the smokehouse observe and learn the method easily, and newcomers to the village are brought to the smokehouse to learn. In contrast, salt-packing is taught only within the family, in private, and without the same social buzz.

  Over time, the smoke-drying method becomes dominant because it is exposed to more people more often. But here's the catch: the village's fish stocks are not sufficient to support the entire community using smoke-drying. The method requires large amounts of a specific type of wood that becomes scarce as more families adopt it. The wood must be gathered from distant forests, increasing labor and risk. Meanwhile, salt could have been obtained by trading fish with inland communities, which would have built beneficial trade relationships. As smoke-drying spreads, the wood becomes depleted, leading to conflicts with neighboring villages over resources and leaving the village with less preserved fish and more strife. By the time the salt-packing families have dwindled to a few, the village is worse off: hungrier and more vulnerable to raids.

  Bearer-level explanation (what the variant does for the people): At the individual level, smoke-drying doesn't offer a better payoff than salt-packing. In fact, as the wood becomes scarce, it becomes more costly. But people adopt it because they are copying the majority or because they are drawn to the social aspect. The bearer-level theorist would say: "The social benefits of the smokehouse (like camaraderie and easier learning) are real benefits to the individual at the time of adoption. That's why it spreads. The later scarcity is an unintended consequence of many people adopting it, not a flaw in the bearer-level explanation. The transmission advantage comes from the immediate social rewards, which are part of the 'what it does for the bearer' story."

  Meme's-eye explanation: The smoke-drying practice spreads because it has a transmission advantage: it forces people into a context (the smokehouse) where it is more likely to be observed and copied. This happens independently of the long-term consequences. The practice is "self-replicating" because it creates a social structure that facilitates its own transmission, even when it becomes maladaptive.

  The key feature: The transmission advantage comes from the practice creating a context (a shared space) that increases exposure. Without the shared space (if smoke-drying were done in isolation like salt-packing), the transmission advantage would vanish. The case collapses into two equally transmitted variants without this feature.

  Bearer-level theorist's best line: "You've only described a transmission bias (social learning in a group setting) and then added an ecological side effect. The social benefits at the time of adoption are real and explain the spread. The long-term harm is a separate problem of resource depletion, not a failure of the bearer-level model."

  Scene: Show the smokehouse bustling with activity, laughter, and storytelling, while a lone salt-packing family works in their dim hut. Then cut to winter: the smokehouse group arguing over the last logs, sending men on a dangerous trip for wood, while the salt-packing family quietly eats their preserved fish and trades with a passing merchant.
answer: |-
  Here's a scenario meeting your criteria, followed by analysis:

  **Scenario:** For generations, villagers dried their catch on simple, individual beach racks ("rack-drying"). A newcomer introduces "basket-burying" – packing fish in sealed baskets buried in cool tidal sand. Both methods preserve equally well, require similar effort, and villagers find them equally practical. Basket-burying, however, has one difference: the burial spots cluster in a single, sheltered cove due to ideal sand conditions, while racks are scattered across the beach. When a storm surge hits, *all* buried baskets in the cove are ruined simultaneously. Word spreads instantly among the clustered basket-users, who witness each other's loss and collectively switch back to racks in panic. Scattered rack-users suffer only isolated losses. Crucially, the clustered failure creates a *shared social event* – a dramatic, visible "extinction" witnessed by many. This intense, synchronous experience makes the abandonment of basket-burying highly memorable and communicable. People retell the vivid story with gestures and emotional emphasis. Within days, basket-burying is stigmatized as "storm-vulnerable," despite it being no more inherently risky than rack-drying. The cove lies empty. Over time, this collective memory hardens into taboo. When the *next* storm destroys many *scattered* racks, the isolated losses lack the same social impact. No shared story forms, no collective switch occurs. Basket-burying vanishes entirely. The village loses a valuable, spatially concentrated method that could have relieved pressure on crowded beach racks during peak catches, leading to more spoilage and hunger. The objectively equivalent method died because its failure mode created a super-spreader event for its own rejection.

  **Framings & Predictions:**
  - **Meme's-Eye View Predicts:** Basket-burying loses *because* its failure clustered users spatially/temporally, creating a high-fidelity, emotionally charged transmission event for its abandonment. Its "extinction story" out-competes the quieter, scattered failures of rack-drying. The variant frequency changes due to the *structure of the transmission channel* (the synchronous, social loss event), not bearer-level benefits.
  - **Bearer-Level View Predicts:** Both methods should persist near equilibrium, as neither offers inherent advantages. Any shift must stem from minor preferences, prestige bias (e.g., copying a respected elder), or rational cost-benefit analysis (neither exists here). The disappearance of basket-burying needs an explanation like "people observed it failed more" (false) or "they disliked the extra walk to the cove" (contradicting equal attractiveness).
  - **Key Feature Doing the Work:** The **synchronous, spatially clustered failure** of basket-burying. This creates a single, high-salience event that dominates social transmission, unlike the asynchronous failures of rack-drying.
  - **Case Collapses Without It:** If basket failures were scattered like rack failures, both methods would likely persist. No super-spreader event for abandonment occurs. Transmission becomes neutral, reflecting the initial equal attractiveness.

  **Bearer-Level Theorist's Rebuttal:**  
  *"You've just dressed up 'negative frequency-dependent bias' in memetic language. People saw many fail at once and copied the dominant rejection – a classic case of conformist transmission based on observed outcomes. The 'meme' didn't hijack anything; individuals rationally avoided a practice they witnessed failing en masse, even if the risk was identical."*

  **How to Show It in a Scene:**  
  Show the night of the storm surge. Basket-users huddle in the cove at dawn, wailing as they dig up putrid fish together, their shared despair palpable. One man, salt crusting his beard, gestures wildly at the ruined baskets and shouts, "See? Buried fish *invites* the sea's wrath!" Cut to the tavern that evening: the same man retells the tale, miming the surge and rot, drawing gasps. Children play-act "foolish buriers" drowning in mud. Contrast this with Old Elara discovering her solitary rack destroyed days later. She sighs, repairs it alone, and tells no one but her granddaughter, who barely listens. The cove becomes a desolate, whispered-about place within a week.
