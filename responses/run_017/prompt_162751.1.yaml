  For step 7-8's self-application: it's not doing independent work but revealing the core problem. The argument can't bootstrap itself without hypocrisy unless we find an external anchor point.

  The solution must be rejecting step 3's absolute claim. Filtered evidence can support hypotheses if we have partial access to the filter's parameters - which geology has through physics/chemistry, while history must rely more on coherence tests. The price is accepting that historical conclusions have different epistemic status - more provisional.

  For the user's field: stratigraphy escapes because they calibrate their filters through experimental sedimentology, radiometric dating, etc. - independent lines not available to pure historians. That's why they could ignore radical skepticism while acknowledging incompleteness.

