  Below is a decision procedure based on the unilateralist's curse, tailored for your team's constraints. It addresses redundancy, counterfactuals, shared downsides, selection bias, and the "non-action" edge case while preserving core curse mechanics. Written in British English as requested.

  ---

  ### **Unilateral Merge Decision Procedure**  
  *For non-trivial PRs. Run in ≤20 mins. Use coarse bands (VL/L/M/H/VH) for estimates.*

  #### **Core Principles Preserved**
  1. **Curse mechanics**: More actors → stricter personal thresholds (prevents "thinnest evidence" selection).  
  2. **Redundant upside**: Benefit isn't additive; credit-seeking is discouraged.  
  3. **Shadow quorum**: Accounts for other maintainers/forks acting soon.  
  4. **Non-excludable downside**: Harm affects all users if triggered.  
  5. **Non-action risks**: Explicitly checks if *not* merging is dangerous.  

  #### **Procedure**  
  **Ask these questions in order. Stop and escalate if any "NO" condition is met.**  
  *Value judgements* are marked with *(V)*. Use bands:  
  - **VL** (Very Low: <10%)  
  - **L** (Low: 10-30%)  
  - **M** (Medium: 30-70%)  
  - **H** (High: 70-90%)  
  - **VH** (Very High: >90%)  

  1. **IMMEDIATE HARM CHECK**  
     *"If we delay this PR by 2 weeks, what’s the severity of ongoing harm?"*  
     - Negligible/Minor → Proceed.  
     - **Moderate or worse** → *Skip to Question 4*.  
     - *Escalate if*: Harm is catastrophic (e.g., life-threatening).  

  2. **REDUNDANCY ASSESSMENT**  
     *"If I don’t merge, what’s the probability another maintainer or fork ships equivalent code within a month?"* (VL/L/M/H/VH)  
     - **H or VH** → Stop. **Do not merge** (upside is redundant; curse risk dominates).  
     - **VL/L/M** → Proceed.  

  3. **UPSIDE BOUNDING**  
     *(V)* *"Is the benefit non-excludable? (i.e., would shipping twice add no value?)"*  
     - **NO** → Proceed (rare; e.g., cumulative optimisations).  
     - **YES** → *Multiply personal benefit estimate by 0.5* (curse adjustment).  

  4. **NON-ACTION RISK**  
     *(V)* *"Is there a credible scenario where NOT merging could cause a tail risk event?"*  
     - **YES** → *This is the action* (merging avoids risk). Skip to Question 6.  
     - **NO** → Proceed.  

  5. **DOWNSIDE TAIL RISK**  
     *"If this PR is flawed, what’s the severity and probability of shared harm?"*  
     - **Severity**: Minor/Moderate/Major/Catastrophic.  
     - **Probability**: VL/L/M/H/VH (of flaw occurring).  
     - *Escalate if*:  
       - Severity = **Catastrophic** OR  
       - (Severity = **Major** AND Probability ≥ **L**) OR  
       - Probability = **H/VH** (regardless of severity).  

  6. **CURSE ADJUSTMENT**  
     *"Given 5 maintainers and shadow quorum, how many would merge this PR with ≤ my evidence?"*  
     - Estimate: **Number** (0-5) including forks.  
     - **Curse threshold** = *1 / (Number + 1)*.  
       - *Example*: If 4 others might merge, threshold = 1/5 = 0.2 (require ≥80% confidence).  
     - *Escalate if*: **Your confidence < Curse threshold**.  

  7. **MERGE DECISION**  
     *(V)* *Final balance*:  
     - **Merge if**:  
       - Upside × Confidence > Downside × (1 – Confidence)  
       - AND no prior "stop" conditions.  
     - **Escalate otherwise**.  

  ---

  ### **Case Applications**  
  *Using the procedure above:*

  #### **Case 1: Sandbox Escape Hatch**  
  1. **Immediate harm**: Negligible (not urgent) → Proceed.  
  2. **Redundancy**: M (possible others might add) → Proceed.  
  3. **Upside bounding**: YES (non-excludable) → Benefit × 0.5.  
  4. **Non-action risk**: NO → Proceed.  
  5. **Downside**: Severity=Catastrophic → **ESCALATE** (stop at Q5).  
     *Verdict: Do not merge. Send to slow review.*  

  #### **Case 2: Capability Downgrade**  
  1. **Immediate harm**: Negligible → Proceed.  
  2. **Redundancy**: VL (unlikely others implement) → Proceed.  
  3. **Upside bounding**: YES → Benefit × 0.5.  
  4. **Non-action risk**: NO → Proceed.  
  5. **Downside**: Severity=Major, Probability=M → **ESCALATE** (stop at Q5).  
     *Verdict: Do not merge. Requires team discussion.*  

  #### **Case 3: Prompt-Injection Fix**  
  1. **Immediate harm**: **Major** (active exploit) → Skip to Q4.  
  4. **Non-action risk**: **YES** (not merging is dangerous) → Skip to Q6.  
  6. **Curse adjustment**:  
     - Assume 2 others might merge → Threshold = 1/3 ≈ 33%.  
     - Your confidence = VH (>90%) → 90% > 33% → Proceed.  
  7. **Merge decision**:  
     - Upside (high) × Confidence (VH) >> Downside (major) × (1–VH)  
     → **MERGE**.  
     *Verdict: Merge immediately.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Correlated errors**: If all maintainers share blind spots (e.g., same biases, tooling gaps), the curse adjustment fails. The model assumes independent judgement.  
  2. **Interdependent PRs**: Doesn’t handle changes where risk/benefit depends on other unreleased code.  
  3. **Precise quantification**: Coarse bands may misrepresent extreme tail risks (e.g., 0.1% vs 0.01%).  
  4. **Ecosystem coordination**: Can’t fully model forks acting maliciously or in conflict.  
  5. **Morally charged decisions**: Values-heavy trade-offs (e.g., "blocklist ethics") are flagged for human judgement but not resolved.  

  ---

  ### **Key Simplifications vs. Theory**  
  | Theoretical Concept          | Simplified Handling                                                                 |  
  |------------------------------|-------------------------------------------------------------------------------------|  
  | Independent evidence         | Assumed via "shadow quorum" count; breaks if team is homogenous.                   |  
  | Perfect rationality          | Replaced with coarse bands + explicit value judgements (V).                        |  
  | Dynamic thresholds           | Curse adjustment (Q6) scales strictness with # of actors.                          |  
  | Recursive game theory        | Dropped; relies on one-shot estimation of others’ behaviour.                       |  
  | Externality pricing          | Implicit via non-excludable downsides (Q5) and redundancy penalties (Q2, Q3).      |  

  This procedure prioritises stopping power for tail risks while respecting your "move fast" ethos. It forces explicit consideration of the curse’s core mechanisms without requiring decision-theory expertise. When in doubt, it defaults to escalation.
