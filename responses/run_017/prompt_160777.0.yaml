     **Final Procedure Document**

     # Unilateral Merge Decision Procedure

     This procedure is for any non-trivial pull request (PR). It should be completed within 20 minutes by the maintainer considering the merge.

     ## Step 1: Assess Harm of Delay
     - Consider: if we delay this change by two weeks (by putting it through the slow review path), what harm might occur?
       - Examples of harm: security breaches, data loss, operational disruptions, missed opportunities, user dissatisfaction.
     - Categorise the harm of delay as:
       - **Negligible**: No significant harm expected.
       - **Minor**: Slight inconvenience or small opportunity cost.
       - **Moderate**: Noticeable harm or moderate opportunity cost.
       - **Major**: Significant harm (e.g., ongoing security breaches, substantial data loss) or major opportunity cost.
       - **Catastrophic**: Severe harm (e.g., life-threatening situations, massive financial loss).

     ## Step 2: Assess Redundancy
     - Consider: if you do not merge this change now, how likely is it that an equivalent change (by another maintainer or in the wider ecosystem) will be merged within one month?
     - Categorise the likelihood as:
       - **Very Low (VL)**: Less than 10% chance.
       - **Low (L)**: 10-30% chance.
       - **Medium (M)**: 30-70% chance.
       - **High (H)**: 70-90% chance.
       - **Very High (VH)**: More than 90% chance.

     ## Step 3: Determine Urgency (Judgement Call)
     - Combine the harm of delay (from Step 1) and redundancy (from Step 2) to determine the urgency of merging now:
       - Use the table below, but apply your judgement:

         | Harm of Delay \ Redundancy | VL       | L        | M        | H        | VH       |
         |----------------------------|----------|----------|----------|----------|----------|
         | **Negligible**             | Low      | Low      | Low      | Low      | Low      |
         | **Minor**                  | Medium   | Medium   | Low      | Low      | Low      |
         | **Moderate**               | High     | High     | Medium   | Low      | Low      |
         | **Major**                  | High     | High     | High     | Medium   | Medium   |
         | **Catastrophic**           | High     | High     | High     | High     | High     |

       - **Note**: If the harm of delay is negligible and redundancy is VL, but the upside of the change is major or transformative, you may upgrade to Medium urgency. Similarly, adjust based on the magnitude of the upside if not captured by harm of delay.

     - Output: Urgency level (**Low**, **Medium**, **High**).

     ## Step 4: Assess Downside Risk
     - **Downside Magnitude**: If this change is flawed, what is the worst-case downside impact?
       - **Minor**: Small bug, easy to fix, minimal impact.
       - **Moderate**: Noticeable bug, may require a hotfix, moderate user impact.
       - **Major**: Serious bug, could cause data loss, security vulnerability, or significant downtime.
       - **Catastrophic**: Irreversible harm, system compromise, life-threatening situations.
     - **Confidence in Correctness**: How confident are you that this change is not flawed in a way that would cause the downside? This is your subjective probability that the change is correct.
       - **Very Low (VL)**: Less than 10% confidence (highly uncertain).
       - **Low (L)**: 10-30% confidence.
       - **Medium (M)**: 30-70% confidence.
       - **High (H)**: 70-90% confidence.
       - **Very High (VH)**: More than 90% confidence.

     ## Step 5: Shadow Quorum Check
     - Consider: if the other four maintainers were to review this change today, how many would decide to merge it? (Estimate without consulting them.)
       - **Fewer than 2**: 0 or 1 would merge.
       - **About 2**: 2 would merge.
       - **More than 2**: 3 or 4 would merge.
     - This accounts for the risk that you might be the least cautious maintainer (unilateralist's curse).

     ## Step 6: Decision Rule
     1. **Base Required Confidence**: Based on downside magnitude:
          - Minor → **VL** (no minimum)
          - Moderate → **M**
          - Major → **H**
          - Catastrophic → **VH**
     2. **Adjust for Urgency**:
          - If urgency is **High**, lower the requirement by one band (e.g., Major normally requires H, becomes M).
          - If urgency is **Low**, raise the requirement by one band (e.g., Moderate normally requires M, becomes H).
          - If urgency is **Medium**, no adjustment.
          - Bands: VL → L → M → H → VH. Do not adjust below VL or above VH.
     3. **Adjust for Shadow Quorum**:
          - If **fewer than 2** other maintainers would merge, raise the requirement by one band (make it stricter).
          - Otherwise (about 2 or more than 2), no adjustment.
     4. **Compare**:
          - If your confidence (from Step 4) meets or exceeds the adjusted required confidence, then **merge**.
          - Otherwise, **do not merge** and escalate to the release lead or the slow review path.

     ## Escalation
     - If the procedure results in "do not merge", escalate the PR. This means:
       - Assign it to the release lead (if appointed) for a decision, OR
       - Put it through the standard two-week review process.

     ## Limitations
     - This procedure assumes maintainers' judgments are independent; correlated errors may break the curse adjustment.
     - It relies on coarse, subjective estimates; borderline cases may be misjudged.
     - It does not handle scenarios where multiple independent changes are beneficial (accumulating upside); it assumes upside is non-redundant.
     - External factors (e.g., ecosystem changes) are only considered in the one-month redundancy window.
     - Personal incentives (e.g., credit for merging) are not accounted for; maintainers must act in the project's best interest.

     Now, we've run the three cases and the procedure gave:
       - Case 1: merge
       - Case 2: do not merge and escalate
       - Case 3: merge

     For Case 3, even though it's your own patch and you're confident, the procedure says merge, which matches your intention.
