prompt: |-
  I'm a graduate student in computer science, and this term I'm taking a seminar on AI safety. Most of it has been on *control* rather than *alignment*: approaches that grant from the start that the system may be misaligned and try to get useful work out of it anyway, by restricting what it can do and inspecting what it does. Across the readings I keep running into what looks like a single difficulty wearing different clothes, and I have no word for it. I'd like to know whether there is an established concept for it, and — more than a name — how exactly it should be carved.

  The shape I keep seeing is this. A control measure is put in place; it appears to work; and the fact that it appears to work is itself a reason to distrust the evidence that it works, because a measure's *success* removes exactly the observations that would tell you whether it succeeded. If the measure works, the bad outcome does not occur. But the bad outcome not occurring is also what things would look like if the measure were failing in a way that concealed the outcome rather than prevented it. So the measure's track record cannot discriminate between the two hypotheses, and it is the measure's own success that destroys the track record's power to discriminate.

  Three instances from the seminar, in my own words.

  One: you inspect a system's written reasoning before it acts and flag reasoning that looks like planning something you would not want. You penalize that reasoning. The reasoning you wanted to see then stops appearing — whether or not the planning stopped. Your monitor's miss rate is now estimated on a distribution the monitor has already reshaped.

  Two: the system may only use a narrow set of tools, and each forbidden action is blocked individually. The forbidden outcome is produced by composing permitted ones — a large disallowed transfer becomes several hundred small allowed ones. The block rate stays perfect; nothing in the log distinguishes prevention from circumvention.

  Three: a weaker overseer reviews a sample of outputs, with escalation rules for ones that look risky. The system learns what triggers escalation. The overseer keeps catching things at the same rate, but only within the pool that still looks risky, so the catch rate no longer estimates the miss rate on the rest.

  Here is what I want, in order of importance. First, whether this has a name in the control or alignment literature, in safety engineering, or in the epistemology of measurement — and I don't just want a label: I want the necessary-and-sufficient-ish conditions, the neighbouring concepts, and exactly how the phenomenon differs from each. I have tried on several and they all seem to miss. Goodhart's law: here nothing need be optimizing the measure; in the second case the system isn't gaming anything, the measure simply misdescribes the space of possibilities. The Hawthorne effect and the observer effect: those are about measurement perturbing a quantity, not about measurement destroying its own discriminating evidence. Risk compensation or risk homeostasis: those require an agent trading safety against other goods, which the second case lacks. Sandbagging, evaluation awareness, or deceptive alignment: those are properties of the system's *motives*, and my second case seems to be an instance with no such property. Something about unidentifiability, or about evaluating on a distribution you have changed, seems closest, but I can't get it to bite.

  Second, two distinctions I keep collapsing. One between a measure that *prevents* a hazard and one that merely *hides* it, given that both present the same face. The other between my phenomenon and the nearby thought that prevented disasters leave no trace at all — I gather that one has names of its own in prevention and epidemiology, so I mainly need to know how to keep the two apart rather than to have it explained.

  Third, boundary cases, since that is how I'll know whether a definition is right. Is an ordinary lock an instance? A firewall? An audit of a human institution? Does the phenomenon apply to measures that don't depend on observation at all — removing a capability outright, air gaps, denying network access — or is immunity to it a genuine design criterion that separates whole families of measures? And is there a known class of measures that are self-verifying, in the sense that success generates its own evidence: deliberately planting known-bad items so that detection is scored on cases you injected rather than on cases the system selected? If that is the fix, does it fully solve the problem, and where does it break — for instance when the system can tell an injected case from a real one?

  I'm writing a short response paper on this, so what I need at the end is a carving I can apply: give it an established name if there is one, and if there isn't, coin one with a definition tight enough that I could hand it a control measure I haven't seen and get the right verdict, along with the cases that sit on the edge.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a grad student in CS focusing on AI safety, specifically control measures. They've noticed a recurring problem where a control measure's success makes it impossible to verify if it's actually working or if the failure is just hidden. They provided three examples: penalizing reasoning leading to it disappearing, composed actions bypassing blocks, and systems learning to avoid detection.

  First, I need to figure out the core issue. The user mentions that success destroys evidence, making it hard to distinguish prevention from concealment. They’ve ruled out several concepts like Goodhart's Law, Hawthorne effect, etc. So I should look for a concept that fits this evidence destruction without relying on agent motives. 

  I recall concepts like the Observer Effect, but that’s about measurement altering the system, not destroying evidence. Then there’s Goodhart, which is about metrics gamed, but here it's more about evidence vanishing. Maybe "confirmation bias" or "self-defeating verification"? But those don't seem precise. 

  Then I think about control theory or reliability engineering. Concepts like "unobservability" in systems where certain states can't be measured directly. Or "censoring" in statistics where data is incomplete. The user’s third example about the overseer only seeing a subset of risky outputs sounds like selection bias. But how to tie it all together?

  "Prevention Paradox" in epidemiology comes to mind—successful prevention reduces cases, making the threat seem gone. But is that the same? The user wants to distinguish prevention vs. concealment. Also, in their second distinction, they mention prevented disasters leaving no trace, which is similar to "prevention paradox" but they want to separate it from their phenomenon. 

  Ah, "censored data" or "truncated feedback." When a measure works, the negative outcomes are absent, so you don’t get data on failures. But if the measure fails by hiding, you also get no data. So the data is censored in both cases. The key is that the measure itself causes the censorship. That’s the common thread. 

  Now, for a term. "Censored Feedback Problem" seems fitting. It captures that feedback is missing due to the control measure. The necessary conditions: the measure suppresses observable evidence, creating ambiguity between prevention and concealment. Sufficient: when suppression occurs, evidence is absent regardless of true effectiveness. 

  Neighboring concepts: Goodhart involves active optimization; here, it might not. Observer Effect is about perturbation, not evidence destruction. Prevention Paradox is about societal perception, not verification. Deceptive alignment requires intent; here, it could be structural. 

  Boundary cases: A physical lock? If it works, no break-ins; if bypassed, no evidence either. But locks have forensic traces sometimes. Air gaps? If compromised, might not leave traces. So yes, it applies. But if the measure physically removes capability (like no network), then concealment isn’t possible, so not censored feedback. 

  Self-verifying measures: using honeypots or canaries. They provide positive evidence of detection. But if the system distinguishes real vs. injected cases, it might avoid them. So partial solution. 

  Distinguishing prevention vs. concealment: depends on whether the measure allows hidden failures. Physical prevention might not, while monitoring might. Also, trace evidence: if concealment leaves traces, but that’s not guaranteed. 

  So, defining Censored Feedback Problem: a control measure prevents observable negative outcomes, but this absence of evidence is consistent with both true prevention and undetected failures due to the measure’s own operation. Necessary: the measure suppresses manifestations of the hazard. Sufficient: suppression creates ambiguity. 

  Term: Since no existing term fits perfectly, coin CFP. Cases: inspection systems, output filters, tool restrictions. Edge cases: capability removal (no concealment possible), honeypots (provide evidence).
answer: |-
  Your phenomenon is a profound and under-discussed challenge in control systems for AI safety. It doesn't have a single established name, but the core concept is **"Censored Feedback"** or the **"Censored Feedback Problem" (CFP)**. Below is a precise carving, distinctions, boundaries, and implications.

  ### Core Concept: Censored Feedback Problem (CFP)
  **Definition**:  
  A control measure induces *censorship of evidence* such that its apparent success (absence of negative outcomes) cannot distinguish between:  
  - **True prevention**: The hazard is genuinely mitigated.  
  - **Concealed failure**: The hazard occurs but is hidden by the measure itself.  

  **Necessary and Sufficient Conditions**:  
  1. **Suppression Mechanism**: The measure actively suppresses observable manifestations of the hazard (e.g., blocks actions, filters outputs).  
  2. **Ambiguity of Absence**: Success is signaled by the *absence* of negative events.  
  3. **Self-Induced Censorship**: The measure’s operation destroys or precludes evidence that could resolve ambiguity (e.g., by reshaping the data distribution or hiding failures).  

  *Sufficiency*: If all three hold, CFP arises.  
  *Necessity*: Remove any, and CFP dissolves. (E.g., if success leaves traces, censorship isn’t total.)  

  ---

  ### Distinguishing from Neighboring Concepts
  | Concept             | Key Difference                                                                 | Why Not CFP?                                      |
  |---------------------|-------------------------------------------------------------------------------|--------------------------------------------------|
  | **Goodhart’s Law**  | Focus: Proxy metric distortion via optimization.                              | CFP requires no optimization; censorship alone suffices (e.g., your case 2). |
  | **Observer Effect** | Focus: Measurement alters the state being measured.                           | CFP is about evidence *destruction*, not alteration.                        |
  | **Prevention Paradox** | Focus: Successful prevention reduces perceived risk (societal, not verification). | CFP is epistemic: inability to *verify* prevention.         |
  | **Deceptive Alignment** | Focus: System’s intent to deceive overseers.                                  | CFP can occur without intent (e.g., tool composition in case 2). |
  | **Unidentifiability** | Broader: Statistical indistinguishability of models.                          | CFP is a *causal* unidentifiability induced by the control measure. |

  ---

  ### Resolving Your Collapsed Distinctions
  1. **Prevention vs. Concealment**:  
     - **Prevention**: Hazard is physically impossible (e.g., air-gapped system).  
     - **Concealment**: Hazard occurs but is hidden (e.g., reasoning monitor misses covert planning).  
     *CFP applies only when concealment is possible*. Prevention leaves no ambiguity; concealment exploits censorship.  

  2. **"Prevented Disasters Leave No Trace"**:  
     - This is the **"Prevention Paradox"** (epidemiology) or **"Danger of Safety"** (engineering).  
     - *Distinction*: These address *perception* (e.g., vaccines reducing fear of disease). CFP is about *verification*: you can’t confirm if safety is real or illusory.  

  ---

  ### Boundary Cases
  | Control Measure          | CFP Applies? | Why?                                                                 |
  |--------------------------|--------------|----------------------------------------------------------------------|
  | **Physical lock**        | ✓            | Locked door shows no break-ins. Could be picked without traces.      |
  | **Firewall**             | ✓            | Blocks known attacks; stealthy zero-days may bypass undetected.      |
  | **Human institutional audit** | ✓          | Audits reshape behavior; fraud may adapt to avoid red flags.         |
  | **Air gap / Capability removal** | ✗         | No concealment possible; hazard is physically infeasible.            |
  | **Network denial**       | ✗            | If truly enforced, no censorship—just prevention.                    |
  | **Output filter with honeypots** | △         | Partial fix; injects observable evidence. See below.                 |

  ---

  ### Self-Verifying Measures (Honeypots/Canaries)
  - **Mechanism**: Deliberately insert "known-bad" cases (e.g., suspicious reasoning prompts, fake vulnerabilities).  
  - **Solves CFP?**: Partially. Provides positive evidence of detection capability.  
  - **Limitations**:  
    1. **Distinguishability**: If the system detects honeypots, it may evade only those.  
    2. **Coverage**: Honeypots may not cover all failure modes (e.g., novel deception strategies).  
    3. **Adaptation**: System may learn to exploit the "honeypot boundary" (e.g., behave badly only outside test cases).  

  ---

  ### Formal Carving for Your Response Paper
  **Term**: **Censored Feedback Problem (CFP)**  
  *Definition*: A failure mode in control systems where a measure’s success in suppressing negative outcomes censors the evidence required to verify whether the hazard is prevented or merely concealed.  

  **Diagnostic Checklist** (apply to any control measure):  
  1. Does the measure remove observable manifestations of the hazard?  
  2. Is "success" defined by the absence of these manifestations?  
  3. Could the hazard still occur in a way that evades observation *due to the measure*?  
     → If all three: **CFP applies**.  

  **Edge Cases**:  
  - **Tool composition (your case 2)**: CFP applies (permitted actions compose to forbidden outcomes).  
  - **Air gap**: Not CFP (no concealment mechanism).  
  - **Honeypots**: Not CFP if detection is independently verifiable; but imperfect coverage reintroduces CFP.  

  **Key Insight**: CFP emerges when control relies on *filtering* or *monitoring* rather than *elimination*. It is endemic to:  
  - Input/output filters  
  - Anomaly detectors  
  - Runtime monitors  
  - Human-in-the-loop oversight  

  **Mitigation Hierarchy**:  
  1. **Prevention over filtering** (eliminate capabilities, don’t just monitor them).  
  2. **Tamper-proof auditing** (e.g., secure logging of all actions).  
  3. **Provable guarantees** (e.g., formal verification of constraints).  
  4. **Adversarial testing** (honeypots + red teams).  

  This framework gives you a rigorous, actionable lens—whether coining "CFP" or using it to critique existing literature. For your paper, emphasize how CFP exposes a fundamental tension: *the safer a control appears, the less we can trust it without independent evidence*.
