  The crux is the "every context" demand. Genuine comprehension isn't just output matching; it's the *source* of open-ended, model-based flexibility. CWC-strong asks if perfect behavioral mimicry *necessarily* implies this source exists. I think it likely does, because probing deeply enough *into the source* (via novel "why" probes, adversarial tests of model integrity) would eventually reveal the difference between a system running on compiled heuristics (competence) vs. one actively constructing understanding (comprehension). Your own case involves building/accessing a dynamic model of harmony – that *is* comprehension, even if implicit and non-verbalizable. Dennett's point holds for simpler competences, but not for the full-strength version demanded here.
