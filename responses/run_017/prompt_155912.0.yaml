  ### Resolving the Centipede Game: Backward Induction Paradox Diagnostic  
  *One-Page Handout for Rational Choice Seminar*  

  **Starting Points (Agreed by All):**  
  1. Backward induction is logically valid given its premises (common knowledge of rationality, perfect information, etc.).  
  2. Real players frequently pass at early nodes in experiments.  

  **Answer the questions below to diagnose your resolution. Be honest—no prior literature knowledge needed!**  

  1. **In a 100-node Centipede Game, would you (as a rational player) take at node 1?**  
     - **Yes** → Go to 2  
     - **No** → Go to 4  

  2. **At node 4 in the 6-node game, does backward induction force you to take?**  
     - **Yes** → Go to 3  
     - **No** → **Leaf B**  

  3. **You watched your opponent pass at node 1 in a prior Centipede game. At node 4, do you believe they’ll take at node 5?**  
     - **Yes** → **Leaf A**  
     - **No** → **Leaf E**  

  4. **Is your "No" in Q1 because reasoning through 100 nodes is impossible for humans?**  
     - **Yes** → **Leaf D**  
     - **No** → Go to 5  

  5. **If your opponent is an exact copy of you (same reasoning), would you pass at node 1?**  
     - **Yes** → **Leaf C**  
     - **No** → Go to 6  

  6. **If your opponent sends a cost-free message: “I’ll pass at every node,” would you believe them and pass at node 1?**  
     - **Yes** → **Leaf E**  
     - **No** → **Empty Cell**  

  ---

  **Diagnosed Positions (Leaves):**  
  - **Leaf A: Biting the Bullet**  
    *Real players aren’t rational, or common knowledge fails.*  
    Uncomfortable: Dismisses observed behavior as irrational without explaining *why* it’s systematic.  

  - **Leaf B: Theorem vs. Action (Off-Path Update)**  
    *Backward induction is valid, but doesn’t dictate action at unreachable nodes (e.g., node 4).*  
    Uncomfortable: How to update beliefs off-path is undefined in the model.  

  - **Leaf C: Team/Symmetry Reasoning**  
    *Players coordinate for joint gains (with a copy, this is guaranteed).*  
    Uncomfortable: Requires abandoning self-interest for collective payoff.  

  - **Leaf D: Bounded Rationality / Level-k**  
    *Players have limited cognitive depth (e.g., can’t compute 100 steps).*  
    Uncomfortable: Sophistication level (k) is arbitrary and context-dependent.  

  - **Leaf E: Model Misspecification**  
    *Incomplete information (e.g., irrational types) or trembles dissolve the paradox.*  
    Uncomfortable: The “standard” game is wrong—backward induction becomes irrelevant.  

  - **Empty Cell: Incoherent/Unattractive**  
    *No clear position. Why?* Rejecting backward induction *and* all alternatives (D, C, E) implies unexplored contradictions.  

  ---

  **Key Distinctions & Design Notes:**  
  - **Concrete Variants Used:** 100-node game (Q1), observed opponent behavior (Q3), opponent as copy (Q5), cost-free message (Q6).  
  - **On-Path vs. Off-Path:** Explicit in Q2 (node 4 is off-path).  
  - **Empty Cell:** Results from rejecting all resolutions (incoherent).  
  - **Why No Splits for Labels?** Positions C and E may overlap on Q5/Q6 (e.g., "team" and "incomplete info" both say "pass with a copy"), but diverge in motivation—this tool prioritizes *diagnostic questions* over labels.  
  - **Uncomfortable Line:** Each leaf includes a core tension to spark debate.  

