answer: |-
  Your questions cut to the heart of legal epistemology and institutional design. The law/fact distinction is indeed foundational yet frustratingly porous. Let's dissect its presuppositions, resilience to Quinean critique, and alternatives, separating what the practice strictly requires from what is merely compatible.

  ### 1. **What the De Novo/Deferential Split Presupposes**
     - **Strict Requirements**:
       - **Epistemic Asymmetry**: The system presupposes that *some questions* (factual ones) are best answered by the tribunal that directly perceives evidence (witness demeanor, physical exhibits), while *other questions* (legal ones) require uniform, systemic application by a centralized authority (appellate courts).
       - **Institutional Competence**: Trial courts/juries have superior tools for resolving empirical uncertainties; appellate courts have superior tools for interpreting authoritative texts (statutes, precedents) and ensuring consistency.
       - **Finality vs. Uniformity**: Society values finality in factual disputes (hence deference) but prioritizes uniformity in legal rules (hence de novo review).
       - **No Deep Metaphysics Needed**: Crucially, **the split does not strictly require any particular theory of meaning, analyticity, or apriority**. It is primarily a pragmatic allocation of authority.

     - **Compatible With (But Not Dependent On)**:
       - **Analytic-Synthetic Distinction**: If one believes legal rules (e.g., "a contract requires offer and acceptance") are "analytic" truths derived from definitions, while facts (e.g., "Did Party A say X?") are "synthetic," this *maps onto* the distinction. But it’s descriptive scaffolding, not a load-bearing beam.
       - **A Priori/A Posteriori**: Similarly, legal questions might be framed as a priori (knowable through reason alone), facts as a posteriori (requiring experience). Again, this is incidental vocabulary.
       - **Underdetermination**: The practice is compatible with:
         - **Semantic Realism** (legal terms have objective meanings).
         - **Pragmatism** (meaning is use-based; legal rules are tools for social ends).
         - **Inferential Role Semantics** (legal concepts are defined by their role in reasoning).
         *All these theories can justify appellate courts' authority to interpret law without appealing to analyticity.*

  ### 2. **Impact of Quine's Critique**
     - **No Practical Change Needed**: Quine’s rejection of the analytic-synthetic distinction (*Two Dogmas of Empiricism*) does not undermine the legal distinction.
       - **Why?**: The law/fact split is **institutional, not epistemological**. Quine attacks a philosophical boundary; courts enforce an *allocation of institutional responsibility*. Even if all statements are revisable (per Quinean holism), society still needs a division of labor between tribunals.
       - **Mixed Questions Prove the Point**: Your observation that courts "choose an outcome then a label" for mixed questions (e.g., "reasonable suspicion," "contract meaning") is astute. This flexibility is *consistent* with Quine. Courts aren’t finding metaphysical joints; they’re making pragmatic allocations:
         - *Example*: Deferring on historical facts but reviewing "reasonable suspicion" de novo balances police accountability (appellate oversight) with respect for the officer’s perception (trial court deference).
       - **Consequence**: You’d need to admit that the distinction is **functional**, not ontological. The "borrowed epistemological language" is rhetorical dressing for policy choices about who decides what best. Quine’s holism might even *support* this fluidity.

  ### 3. **The Pragmatic Alternative: Competence-Allocation**
     - **The Proposal**: Replace law/fact with "which decision-maker (trial or appellate court) is more likely to get it right, net of decision costs?"
     - **Presuppositions**:
       - **Strictly Required**: A belief that institutional competence is measurable and that error reduction justifies administrative costs.
       - **No Semantic Commitments**: *Explicitly*, this avoids metaphysics. It frames review as a comparison of institutional strengths:
         - Trial courts: Contextual judgment, credibility assessments.
         - Appellate courts: Systemic consistency, textual analysis.
       - **Quietly Contested Presuppositions**:
         1. **Commensurability**: That "likelihood of correctness" and "decision costs" can be quantified/compared.
         2. **Predictability Trade-off**: Abandoning categories may increase arbitrariness. The law/fact distinction, however fuzzy, constrains judicial discretion. A pure competence model risks outcome-driven reasoning.
         3. **Epistemic Hubris**: Assumes we can reliably assess which court is "better" at answering nebulous questions (e.g., "Was this punishment cruel?").
       - **Compatibility**: This model aligns with **Legal Realism** and **Pragmatism** (e.g., Posner-esque cost-benefit adjudication). It rejects formalism but doesn’t escape philosophy—it presupposes **consequentialism** (rules should optimize outcomes) and **fallibilism** (no tribunal has absolute access to truth).

  ### Where Current Categories Are Underdetermined
  The legal practice is **philosophically underdetermined** in key ways:
  - **Meaning Theories**: The same review structure could arise from:
    - **Originalist Semantics** (law is fixed by original meaning; appellate courts discern it).
    - **Living Constitutionalism/Dynamic Interpretation** (law evolves; appellate courts update it).
    - **Wittgensteinian "Meaning as Use"** (appellate courts clarify communal practices).
    *All justify appellate authority over "law" without agreeing on what meaning is.*
  - **Epistemology**: The split works with:
    - **Empiricism** (facts are observable; law is conventional).
    - **Coherentism** (both law and fact aim for holistic fit, but courts assign different reviewers).
    - **Social Epistemology** (deference rests on the social role of juries/trial judges).

  ### Conclusion
  - **Core Presupposition**: The de novo/deferential split requires only that **society allocates decision-making authority based on institutional roles**, not metaphysical truths. Analyticity and apriority are optional, disposable justifications.
  - **Quine Changes Nothing**: Practice survives untouched because it answers "Who decides?" not "What is truth?" Mixed questions exemplify the pragmatic adaptation Quine’s holism permits.
  - **Pragmatic Alternative**: Competence-allocation avoids semantics but presupposes consequentialism and measurable institutional strengths. It trades category-based predictability for granular flexibility.

  Your court’s struggle with the line isn’t a failure—it’s proof that the distinction is a **heuristic tool**, not a discovery about reality. The arrangement persists because it balances finality, uniformity, and competence, regardless of philosophical storms. As Holmes warned: "The life of the law has not been logic; it has been experience." The law/fact distinction lives because it *works*, not because it’s *true*.
