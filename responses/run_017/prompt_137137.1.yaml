prompt: |-
  I sit on the grants committee of a small family foundation, and this spring we have to choose between renewing a long-standing commitment to a near-term global poverty programme and making our first grant to an existential-risk research group. Our discussion keeps circling a question I have taught many times but never had to answer: whether the separateness of persons objection has any grip when the people it is supposed to protect do not yet exist, and might not exist at all.

  What I would like from you is a reconstruction, as disciplined as you can make it, of how John Rawls—who died in 2002, before the vocabulary of existential risk and longtermism had settled into its present shape—would have handled this. Please do not summarise the objection for me; I know the standard formulation, the contrast with the single impartial spectator, and the usual utilitarian replies. I want an extrapolation built out of the specific machinery of his theory, and I want you to keep separate what follows from that machinery and what is your own guess about what he would have said.

  Four things in particular I want you to reason from: the original position as a device of *representation*, where the parties stand in for actual identifiable persons; the motivational assumption about concern for descendants that he uses to get a just savings principle at all, together with his assumption that the parties know themselves to belong to a single generation; his refusal to treat the mere addition of happy lives as a social gain; and his insistence that principles must be stable under publicity and capable of being affirmed by each person severally. (Correct me if you think I have misread any of that.)

  The problem I keep tripping over is one I have started calling the Vacant Seat Problem, and I would like your answer to engage with it directly rather than with the literature's usual framing. In a choice that determines *who* will exist, there is no determinate party for the original position to represent: every candidate for the seat owes its identity to the very choice under deliberation, and under a different choice a different candidate would be sitting there. So it seems the maximin either ranges only over people who will exist whatever we do, in which case the deep future drops out of the calculus almost entirely and intergenerational concern collapses into what each generation owes its immediate successors; or it admits merely possible representatives, in which case the device has quietly given up the person-affecting intuition the separateness objection was supposed to protect, since a merely possible person is not the kind of thing that can be wronged or that can complain, and we appear to be back to counting locations of value. Which horn would Rawls take, and would he accept that the horns are exhaustive? Is there a third move available inside his own framework—a way of representing future positions without representing future persons?

  I would also find it useful if you worked through three cases and said, for each, whether the separateness objection generates a complaint at all on his account, what principle he would put in its place, and how confident you are that the answer is implication rather than extrapolation:

  1. A policy that leaves every member of the next generation somewhat worse off than they would have been under an alternative, where the alternative would have brought different people into existence.
  2. A choice between protecting a large population of existing people from a moderate harm and ensuring, at some cost to them, that a vastly larger number of additional well-off lives come to exist.
  3. A policy that changes which people exist without making anyone worse off, and without making anyone better off either.

  Two further questions, if you can get to them. First: would Rawls treat catastrophic and existential risk as a matter of justice at all, or would he say his theory has no jurisdiction—that it belongs to the natural duties, or to some duty of mutual aid, or that it falls outside the domain of justice because no basic structure distributes the benefit in question? Second: everything the committee hears from the longtermist side leans on tiny probabilities of enormous payoffs. Say what, in his apparatus, would do the work in his reply to that—publicity, the strains of commitment, the priority of the right over the good, the primacy of institutions, something else—and where you think the disagreement with the total view would bottom out.

  Finally, and this is the part I actually need: tell me what he would say to my committee. A concrete recommendation if one is available, and the single consideration he would think we are most likely to get wrong.
reasoning: |-
  Okay, let me approach this Rawlsian reconstruction systematically. The user is a philosophy-trained grants committee member facing a concrete dilemma between near-term poverty relief and existential risk research, with specific focus on how Rawls would handle the "Vacant Seat Problem" in intergenerational justice.

  First, I need to clarify Rawls' framework elements as requested:
  - The original position represents *actual future persons*, not merely possible ones. This directly addresses the Vacant Seat Problem by limiting representation to those who will definitely exist.
  - His motivational assumption combines self-interest with concern for immediate descendants, creating a "chain of concern" model rather than direct representation of distant generations.
  - The rejection of mere addition as improvement aligns with his anti-aggregation stance, crucial for handling case 2 (large population vs additional lives).
  - Publicity and stability requirements mean any principle must be justifiable to each actual person, which excludes trading off existing persons for potential future ones.

  For the three test cases:
  - Case 1 (different people worse off): No justice complaint arises since no identifiable person is harmed compared to their baseline existence. But Rawls might still object through the savings principle if it violates obligations to immediate descendants.
  - Case 2 (protect existing vs create new lives): Strong separateness objection - sacrificing existing people for potential future ones violates publicity and strains of commitment.
  - Case 3 (mere different people): No justice issue since no one is comparatively worse off, consistent with his neutrality about population size.

  On existential risk as justice matter:
  - Rawls would categorize this under natural duties (preserving just institutions) rather than distributive justice, since no specific beneficiaries exist to claim rights. But the savings principle could cover maintaining conditions for future societies.

  Regarding small probabilities of huge payoffs:
  - His publicity criterion and aversion to "strains of commitment" would reject gambles that require sacrificing basic liberties or fair equality of opportunity. The lexical priority of justice principles over welfare maximization creates a fundamental divide with utilitarianism.

  Concrete committee recommendation:
  - Rawls would prioritize near-term poverty reduction as a clear duty to identifiable persons under difference principle. Existential risk research might only be justifiable if it doesn't compromise current obligations and addresses threats to political institutions.
  - The key warning: Don't let speculative futures distract from measurable injustices to actual people who can hold us accountable. The separateness of persons isn't negated by temporal distance when beneficiaries are determinate.

  The Vacant Seat Problem's horns are exhaustive in Rawls' framework - he takes the first horn (only representing definite future persons) and supplements with savings principle rather than inventing third options. His approach remains person-affecting for actual people while accommodating future concerns through constrained generational chains.
answer: |-
  Below is a disciplined reconstruction of Rawls' approach to your dilemma, built exclusively from his stated machinery in *A Theory of Justice* and *Political Liberalism*. I distinguish textual implications (¶) from speculative extrapolations (✻). Your "Vacant Seat Problem" is central to this analysis.

  ### Core Rawlsian Machinery Applied
  1.  **Original Position as Representation**: Parties represent *actual persons*—those who will exist under the chosen basic structure (§15, *TJ*). They do not represent "merely possible" persons. The "veil of ignorance" hides which *actual* person one is, not whether one exists.  
      → **Vacant Seat Resolution**: Rawls takes your first horn. The original position only considers persons who *will exist* regardless of the choice. "Merely possible persons" have no representation. Intergenerational concern is mediated through:  
      ¶ The parties know they belong to one generation but are motivated by a "concern for their descendants" (*TJ* §44). This creates a *chain* of obligation: each generation secures just institutions for the next actual generation.

  2.  **Motivational Assumptions**: Parties care about their "immediate descendants" (*TJ* §44), but this is constrained by two facts:  
      (a) They know they are contemporaries (no one represents future generations directly).  
      (b) Their concern is "reasonable" (not purely altruistic) and bounded by the just savings principle.  
      → The savings principle (*TJ* §44) requires provisioning institutions to enable future *actual* persons to pursue their own conceptions of the good. It does not require optimizing for potential persons.

  3.  **Mere Addition Rejected**: Rawls explicitly denies that adding happy lives is a social improvement (*TJ* §81). Justice concerns the life prospects of identifiable persons under the basic structure, not aggregate welfare or population size.  
      → This blocks utilitarian aggregation across possible populations.

  4.  **Publicity & Individual Affirmation**: Principles must be publicly justifiable to each *actual* citizen and stable for reason (§29, *TJ*; *PL*). No one can be asked to sacrifice their basic liberties for others' benefit.  
      → Policies imposing significant costs on existing persons for speculative future gains violate publicity—they cannot be reasonably affirmed by those bearing the costs.

  ---

  ### Analysis of Your Cases
  Rawls evaluates policies based on harm to *actual persons* (those who exist under the policy) compared to their position under alternative arrangements. "Worse off" means deprived of primary goods essential for their life plans.

  1.  **Policy leaving next generation worse off with different people**:  
      ¶ **No justice complaint**. No identifiable person is worse off than *they* would be in an alternative world (they wouldn't exist otherwise). The separateness objection lacks a subject.  
      ✻ However, if the policy violates the savings principle (e.g., by depleting institutions needed by the next generation), it is unjust *to those actual descendants*.

  2.  **Protect existing people vs. create additional well-off lives**:  
      ¶ **Strong separateness objection**. Sacrificing existing persons' primary goods to create *new* persons violates publicity—those harmed cannot reasonably affirm the principle. Mere addition is irrelevant; justice protects actual individuals.  
      ✻ Rawls would prioritize protecting existing persons from moderate harm (assuming it affects basic liberties or fair opportunities).

  3.  **Policy changes who exists without affecting welfare**:  
      ¶ **No justice issue**. No actual person is harmed (they are not "worse off" than they would be otherwise, as they wouldn't exist). The separateness objection does not apply.  
      ✻ Rawls is indifferent to identity changes if no one's justice claims are violated.

  ---

  ### Existential Risk & Justice
  ¶ **Not a matter of distributive justice**. For Rawls:  
  - Justice governs the basic structure distributing primary goods *among actual persons*.  
  - Existential risk affects whether persons *exist at all*. This falls under **natural duties** (*TJ* §19): duties "owed to persons generally," like preserving just institutions.  
  → The savings principle *might* include maintaining conditions for future societies, but this is bounded by duties to the present. Sacrificing existing persons' claims for catastrophic risk reduction violates publicity.

  ### Tiny Probabilities, Enormous Payoffs
  ¶ Rawls rejects this approach via **publicity and the strains of commitment** (*TJ* §29):  
  - Principles requiring generations to bear large costs for improbable future benefits cannot be stably affirmed.  
  - **Priority of the right over the good**: Justice as fairness (with lexical priority of liberty) forbids gambling with basic liberties for aggregate gains.  
  → The "disagreement with the total view" roots in Rawls' rejection of teleological (end-maximizing) theories. Maximin is risk-averse for *essential primary goods*, not speculative welfare.

  ---

  ### Recommendation for Your Committee
  ¶ **Prioritize the near-term poverty programme**. Rawls' framework implies:  
  1.  Existential risk research lacks identifiable beneficiaries. The longtermist proposal asks existing persons (or their descendants) to sacrifice primary goods for "merely possible" future people—injustice under publicity.  
  2.  Global poverty relief directly addresses the **basic liberties and fair opportunities** of actual persons—a core demand of the difference principle.  
  3.  The savings principle requires provisioning institutions for the *next generation*, not speculating about the deep future.  

  ✻ If existential risk directly threatens institutions needed by the *immediate* next generation (e.g., nuclear winter from near-term conflict), mitigation *might* fall under savings—but this is distinct from longtermism's scope.

  ### The Single Likeliest Mistake
  **Overextending the original position to represent non-actual persons**. Rawls’ machinery collapses if we pretend the "vacant seat" can be filled by merely possible people. His system protects *actual individuals* across generations through:  
  - The savings principle (limited, proximate concern),  
  - Natural duties (preserving institutions),  
  - Publicity (no uncompensated sacrifices).  

  The longtermist proposal cannot satisfy publicity: those bearing costs cannot verify if future people exist to benefit, nor affirm a principle that treats their lives as interchangeable with potential ones. **Justice is relational among actual persons; it cannot bind the possible.**  

  → *Concrete advice*: Renew the poverty programme. If considering existential risk, frame it as protecting institutions for the determinately near future (next 2-3 generations), funded only if it doesn’t reduce essential primary goods for existing persons. Rawls would view diverting resources from actual poverty to speculative risk as a profound failure of the basic structure’s duties.
