  Here is a Shakespearean sonnet crafted for your epigraph, adhering to your structural, thematic, and formal specifications. It aims for precision without jargon, clarity without explanation, and uses the alternating rhymes culminating in the adjacent couplet to mirror the grounding chain resolution:

  **Epigraph: On the Duality of the Fundamental**

  The greatest things rest on the small below,
  The towering whole sustained by humble dust.
  We trace the chain where grounded structures flow,
  Expecting bedrock where dependence must.

  For smallest things seem unencumbered, free,
  The source on which all-that-is supervenes.
  Ungrounded *and* the root of all we see,
  One role for "fundamental" this scene convenes.

  But see the Cosmos standing firm, alone,
  Its parts derived, yet grounded in the stars.
  Or watch the chain descend to depths unknown:
  No final floor, no peak where all hangs. Mars

  The name itself must break; the twin demands
  Decouple where no single bedrock stands.

  ---

  ### How it meets your requirements:

  1.  **Structure:**
      *   **Quatrain 1 (ABAB):** Sets up the naive view: "greatest things rest on small," "chain," "expecting bedrock," "dependence must" (stop).
      *   **Quatrain 2 (CDCD):** Makes the conflation explicit: "smallest things... unencumbered, free" (bedrock) *and* "source on which all-that-is supervenes" (coverage). "One role... convenes" emphasizes the assumed unity.
      *   **Quatrain 3 (EFEF):** Shows the split:
          *   Lines 9-10: The "Cosmos standing firm, alone" (bedrock: ungrounded) grounding "Its parts derived" (coverage: everything grounded *in it*). "Stars" here implies the cosmic level.
          *   Lines 11-12: The infinite descent: "chain descend to depths unknown" (no bedrock), "No final floor" (no bedrock), "no peak where all hangs" (no coverage point). "Mars" implies the concept is damaged, wounded, or forced apart.
      *   **Couplet (GG):** "The name itself must break" – "fundamental" cannot hold both meanings unified. "The twin demands decouple" – bedrock and coverage separate. "Where no single bedrock stands" – explicitly states the core consequence: neither the infinite descent nor the cosmic-first view allows a *single* item satisfying both criteria.

  2.  **Content & Accuracy:**
      *   Clearly distinguishes Bedrock ("Ungrounded," "unencumbered, free," "standing firm, alone," "no final floor") from Coverage ("source on which all-that-is supervenes," "all hangs," "no peak where all hangs").
      *   Covers both splitting cases: The Cosmos as fundamental (Lines 9-10) and the infinite descent (Lines 11-12).
      *   Concludes that "fundamental" as a unified concept fails ("The name itself must break").
      *   Uses grounding language ("rest on," "sustained by," "grounded," "derived," "supervenes," "hangs") accurately but poetically.
      *   Avoids jargon, proper names, and citations.

  3.  **Form:**
      *   Shakespearean Sonnet: 14 lines, 3 quatrains (ABAB CDCD EFEF) + rhyming couplet (GG).
      *   Iambic Pentameter: Predominantly used, with minor variations for emphasis/natural flow (e.g., "Expecting bedrock" has an initial trochee; "Ungrounded *and* the root" has a pyrrhic-spondee combo).
      *   Alternating Rhymes: Quatrains strictly follow ABAB, CDCD, EFEF. Only the couplet (GG) has adjacent rhymes, fulfilling the symbolic request.
      *   Poetic Language: Uses metaphor ("humble dust," "towering whole," "depths unknown"), personification ("Scene convenes," "Mars the name"), and evocative phrasing ("break," "decouple," "stands") without sacrificing philosophical precision.

  This sonnet encapsulates the core argument – the duality of "fundamental" and its potential dissolution – in a form that is both academically sound and poetically resonant, suitable for an epigraph or opening a talk. It should stand strongly on its own for readers familiar with grounding.
