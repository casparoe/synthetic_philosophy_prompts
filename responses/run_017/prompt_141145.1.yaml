  *   While "Temporal Discursive Dilemma" isn't a universally standardized term, it accurately describes the phenomenon by combining the core mechanism ("Discursive Dilemma") with the key differentiating factor ("Temporal"). The diagnostic test precisely captures the necessary and sufficient conditions observed in your cases.
