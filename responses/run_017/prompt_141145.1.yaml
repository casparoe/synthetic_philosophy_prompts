answer: |-
  Based on your detailed description and analysis, here's the conceptual carving of your observed phenomenon, addressing all your specific queries:

  ### Analysis of Differences
  1.  **Ordinary Doctrinal Paradox (Discursive Dilemma):**
      *   *How it fits:* Both involve aggregation of individual judgments leading to collective inconsistency with logical constraints (here, `A & B -> C` is violated: Funding Debating (A) and Jazz (B) individually, but not funding Both (C)).
      *   *How your case differs:* The standard paradox occurs *simultaneously* on a fixed agenda. Your inconsistency emerges *dynamically* across separate decisions (`A` and `B` voted separately, then `C` voted later). The "premises" (`A`, `B`) and "conclusion" (`C`) are voted on sequentially, not presented together. The paradox arises from the *accumulation* of decisions over time, not a single aggregation step.

  2.  **Group Changing its Mind:**
      *   *How it fits:* Outcomes differ over time.
      *   *How your case differs:* The group's decisions *about the specific propositions voted on* (`A` passed, `B` passed, `C` failed) are individually consistent *at the time they were made*. No individual member changed their judgment on the propositions they voted on. The inconsistency is in the *implied relationship* (`A & B` is true) deduced from the *record* of separate decisions, not in a reversal on a specific motion.

  3.  **Path-Dependence / Order-Dependence:**
      *   *How it fits:* The outcome depends on the sequence or context of decisions.
      *   *How your case differs:* Path-dependence typically involves voting on the *same set of alternatives* in different sequences leading to different winners (e.g., agenda manipulation in voting). Here, the *agenda itself expands*: New motions (`B`, then `C`) are introduced. The inconsistency isn't about choosing differently among fixed alternatives based on order; it's about introducing new alternatives (`C`) whose logical connection to past decisions (`A` & `B`) reveals an inconsistency in the collective *record*.

  4.  **Membership Turnover Case:**
      *   *How it fits:* The logical structure is identical: `A` passed (Year 1), `B` passed (Year 2), `C` (A & B) failed (Year 2) leading to an inconsistent record `A & B & ~C`.
      *   *How it differs (slightly):* The inconsistency spans collective agents with overlapping but non-identical memberships. However, the *structural flaw* (aggregation leading to an inconsistent historical record) is the same. The core issue isn't individual change (which didn't occur), but the inability of the *institutional record* to maintain logical coherence across decisions made by related groups.

  **Impact of Reopening/Rescission Failure:** If the earlier decision (funding Debating) was formally reopened and a motion to rescind *also failed* (say, 5-4 against rescinding), it strengthens the paradox. It explicitly confirms the group's *continued* endorsement of `A` alongside the new endorsement of `B` and rejection of `C`, making the inconsistency in the record even more explicit and resistant to being dismissed as a simple reversal.

  ### Naming and Classification
  *   **Established Name:** There is **no single, universally established term** for this specific dynamic manifestation. It's recognized as a *variant* or *dynamic extension* of the doctrinal paradox/discursive dilemma.
  *   **Core Concept:** It's the **logical inconsistency arising in the aggregate record of sequential collective decisions** made by a (stable or evolving) group, where individual judgments and individual decision events are consistent, but the combination violates logical constraints.
  *   **Proposed Name:** **Temporal Discursive Dilemma** or **Aggregation Failure Over Time**. (See JSON for definition).

