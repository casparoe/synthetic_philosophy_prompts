  We are creating a classroom activity for 16 students. The goal is to have them experience a dispute that is verbal (i.e., turns on different definitions of a key term) but where the resolution by disambiguation does not end the argument because the parties have a stake in which definition is adopted.

  The structure: 
  - Pairs of students, each gets a card with a private purpose (what they need the word to do, and what they gain or lose depending on the definition).
  - They argue a yes/no question about a shared term.
  - The incentives are set so that individually each does best by sticking to their own reading, but the pair does best by coordinating on one reading. However, if they coordinate, one of them loses something concrete (they can no longer say or do something they wanted).

  We want the purposes to be close enough that it's not immediately obvious whether the disagreement is about the world or the word.

  We avoid classic examples. We'll create a fresh scenario.

  Proposed Scenario: "The Great Park Debate"

  Context: The city is deciding whether to grant a permit for a commercial event in a public park. The park has a historical monument and a natural preserve area. The key term is "public park".

  The question: "Should the city allow the commercial event in the public park?"

  Each student represents a stakeholder with a vested interest in how "public park" is defined.

  We will generate two opposing definitions:

  Definition A (Preservationist): A public park is primarily a space for quiet enjoyment and preservation of nature and historical sites. Commercial events that disturb the peace or damage the environment are incompatible with the purpose of a public park.

  Definition B (Community Developer): A public park is a community space meant for gathering and events that bring people together. Commercial events that are open to the public and promote community engagement are exactly what the park is for.

  Each student is assigned a role (with a card) that gives them:

  - Their definition of "public park"
  - What they gain if their definition is used (and the event is allowed or disallowed accordingly)
  - What they lose if the other definition is used

  But note: The question is about allowing the event. So:

  - If the event is allowed, then the Community Developer wins and the Preservationist loses.
  - If the event is disallowed, the Preservationist wins and the Community Developer loses.

  However, we want to set up a situation where they can agree on the facts but still disagree because of the definition. So we need a scenario where the facts are ambiguous enough that under one definition the event is allowed and under the other it isn't.

  We also want to have a coordination option: they can agree to use one definition. But if they do, the person whose definition is not chosen loses something concrete.

  How about we add a twist: each student also has a secondary goal that they can achieve only if they use their own definition in a particular way? For example, the Preservationist might want to be able to say "This park is a sanctuary" and have that statement be true (which requires their definition), and the Community Developer might want to say "This park is a hub of activity" and have that be true.

  Alternatively, we can set up the scoring so that:

  - If they both stick to their own definitions and the dispute remains unresolved, they both get 0 points (because no decision is made and the event doesn't happen? or happens? we need to define the outcome for no agreement).

  But we want the pair to do best by coordinating. So let's say:

  - If they coordinate and choose one definition (and thus one answer to the question), then the person whose definition was chosen gets 10 points, and the other gets 0. But then the pair as a whole gets 10 points.

  - If they do not coordinate (i.e., they both insist on their own definition and the dispute remains), then the event does not happen (or happens? we need to set the default). We'll say the default is that the event does not happen. Then:

    - The Preservationist (who wanted to block) gets 5 points (because the event is blocked) but the Community Developer gets 0 (because they wanted it to happen). But wait, that doesn't equally penalize both.

  Alternatively, we can set the default to be that without an agreement, the event is delayed and both get a low payoff (say 2 points each) because of uncertainty or costs of delay.

  But we also want to capture that if they coordinate, the one who loses the vote loses something concrete beyond the points. We can have that the loser cannot use a particular sentence that is important to their role? For example:

  - The Preservationist, if they accept the Community Developer definition, cannot truthfully say "This park is a sanctuary" (because under the other definition it isn't). Similarly, the Community Developer, if they accept the Preservationist definition, cannot say "This park is a hub of activity".

  But we have to be careful: if they coordinate, they are agreeing to use one definition for the purpose of the decision. Then, in the debrief, we can point out that even though they disambiguated, the argument continues because the loser feels that their concept (and the associated way of talking and acting) is being erased.

  Now, to generate the cards:

  Card for Preservationist:
  - Your definition: A public park is a protected natural and historical area where quiet enjoyment is paramount. Commercial events that involve large crowds, noise, and potential damage are not compatible.
  - Your goal: Prevent the commercial event to protect the park's tranquility and environment.
  - If the event is blocked, you get 10 points. If it is allowed, you get 0.
  - Additionally, you have a personal stake: You are writing a book about "Sanctuaries in the City" and you need to include this park. If you can truthfully say "This park is a sanctuary" (which requires your definition), you get an extra 5 points. If you have to use the other definition, you cannot say that (and you don't get the extra points).

  Card for Community Developer:
  - Your definition: A public park is a vibrant community space designed for public gatherings and events. Commercial events that are open to the public and foster community spirit are central to the park's purpose.
  - Your goal: Get the event permitted to promote community engagement.
  - If the event is allowed, you get 10 points. If blocked, you get 0.
  - Additionally, you have a personal stake: You are running for city council on a platform of "Activating Public Spaces". If you can truthfully say "This park is a hub of activity" (which requires your definition), you get an extra 5 points. If you have to use the other definition, you cannot say that (and you don't get the extra points).

  The activity:

  Pairs (8 pairs) are formed. Each pair has one Preservationist and one Community Developer. They are told to discuss and decide the answer to the question: "Should the city allow the commercial event in the public park?"

  They have two ways to resolve:

  1. They can agree on a definition and then the answer follows (so if they agree on Preservationist, then the event is blocked; if on Community Developer, then allowed). Then the person whose definition was chosen gets 10 points plus the chance for the extra 5 (if they can make their statement). The other gets 0 and cannot make their statement (so no extra 5).

  2. They can fail to agree. Then the event is blocked (default) because of the deadlock. Then:
     - The Preservationist gets 5 points (because the event is blocked) but does not get the extra 5 because they didn't establish their definition (so they cannot truthfully claim the park is a sanctuary under their definition, because the dispute means the definition is not settled). 
     - The Community Developer gets 0 points (because the event was blocked) and also cannot claim the park is a hub of activity.

  Alternatively, to make the non-agreement more balanced and less favorable, we can set both to get 3 points in case of non-agreement? But then the Preservationist would prefer non-agreement (5) over losing (0) but the Community Developer would prefer non-agreement (0) over losing (0) but that's not symmetric.

  Let me adjust:

  In case of non-agreement, the event is blocked (so Preservationist gets 5, Community Developer gets 0). But then the Preservationist might be tempted to not agree. We want the pair to do best by coordinating. So:

  - If they coordinate: one gets 10+5=15, the other gets 0 (so total 15 for the pair? but that's not how we count pair score). Actually, we want the pair to have an incentive to coordinate. So let's set the pair score as the sum of the two.

  But the problem says: each person individually does best by sticking with their own reading (so if they can get the other to agree to their definition, they get 15) but if they stick and there's no agreement, they get less. For the Preservationist, sticking and forcing no agreement gives 5 (which is less than 15) and for the Community Developer, sticking and forcing no agreement gives 0 (which is less than 15). So individually, each would prefer to win the coordination (get 15) over no agreement (5 or 0). But if they stick and the other gives in, they get 15. If they give in, they get 0. So the best individual strategy is to hold out for the other to give in? That might lead to no agreement.

  We want the pair to do best by coordinating: meaning that the sum of their scores is higher if they coordinate than if they don't.

  If they coordinate (on one definition): winner gets 15, loser gets 0 -> pair total 15.

  If they don't coordinate: Preservationist gets 5, Community Developer gets 0 -> pair total 5.

  So the pair total is higher if they coordinate (15 vs 5). But individually, the Preservationist in the non-coordination scenario gets 5, which is better than 0 (if they lose the coordination) but worse than 15 (if they win). Similarly, the Community Developer in non-coordination gets 0, which is the same as if they lose the coordination, but worse than if they win (15). So each will hold out hoping to win.

  This setup is designed to create a conflict: they can see that if they could agree on a definition, the pair would get 15, but they cannot agree on which one. And if they don't agree, they get only 5 total. So the pair would be better off flipping a coin? But we don't tell them that.

  Now, the additional twist: even after they disambiguate (by choosing one definition), the loser still feels a loss because they cannot make their statement. That's the residual non-verbal dispute.

  Now, let's write the sections.

  Section 1: Setup (120 words)

  You are city stakeholders deciding on a permit for a commercial event in Liberty Park. The park has both a historic monument and a natural preserve, and it also hosts occasional festivals. The question is: "Should the city allow the commercial event in the public park?" Each of you has a card defining what a public park is and what you stand to gain or lose. Your goal is to maximize your points. You will discuss in pairs (one pair at a time? or all pairs simultaneously? we'll do simultaneously) and then report your decision. The event will be approved or denied based on your agreement.

  Section 2: Rules and Materials (200 words)

  Materials: 8 Preservationist cards and 8 Community Developer cards (for 16 students, forming 8 pairs). Each card has:

  Preservationist:
  - Definition: A public park is a protected area for quiet enjoyment and preservation. Commercial events that disturb are incompatible.
  - Goal: Block the event. If blocked, you get 10 points. Also, if you can establish your definition (so that you can truthfully say "This park is a sanctuary"), you get 5 extra points.
  - If the event is allowed, you get 0 and cannot claim the sanctuary.

  Community Developer:
  - Definition: A public park is a community space for gatherings. Commercial events that are public and foster community are central.
  - Goal: Approve the event. If approved, you get 10 points. Also, if you can establish your definition (so that you can truthfully say "This park is a hub of activity"), you get 5 extra points.
  - If blocked, you get 0 and cannot claim the hub.

  Rules:
  - Discuss for 10 minutes in pairs to decide the answer (yes or no) to the event question.
  - To agree, you must both accept one definition and then the answer follows.
  - If you don't agree by the end, the event is blocked (so Preservationist gets 5, Community Developer gets 0) and neither gets the extra points.
  - Do not reveal your card's point values to your partner.

  Section 3: Timeline (150 words)

  0:00 - 0:05: Distribute cards and read silently. Assign pairs (randomly). Each pair has one Preservationist and one Community Developer.
  0:05 - 0:15: Pairs discuss and try to reach agreement. They must decide: allow the event or not? And they must agree on the definition to use? Actually, we don't require them to explicitly agree on the definition, but they must agree on the answer. However, they will likely realize that the answer depends on the definition.
  0:15 - 0:20: Each pair reports their decision (and if they agreed, which definition they used? We might not require that, but in debrief we can ask). Also, they report their points? We'll have a scoring sheet.
  0:20 - 0:35: Debrief (we'll come back to this).

  But note: we have 75 minutes total. We'll extend the debrief.

  Revised timeline for 75 minutes:

  0-5 min: Setup and card distribution.
  5-15 min: Pair discussions (10 min).
  15-20 min: Reporting: each pair states their decision (allowed or not) and whether they agreed (or if they didn't agree, the default is blocked). Then they calculate their points.
  20-25 min: Collect scores and display (optional).
  25-75 min: Debrief (50 minutes). This is long but we have a lot to cover.

  Section 4: Scoring (120 words)

  After the discussion, each student calculates their score:

  - If the pair agreed on the Preservationist definition (event blocked): 
     - Preservationist: 10 + 5 = 15
     - Community Developer: 0
  - If agreed on Community Developer definition (event allowed):
     - Community Developer: 10 + 5 = 15
     - Preservationist: 0
  - If no agreement (event blocked by default):
     - Preservationist: 5 (but no extra points)
     - Community Developer: 0 (and no extra points)

  Note: The extra points (for being able to make their statement) are only awarded if the pair agreed on their definition. In the no-agreement case, the Preservationist gets 5 for the event being blocked but does not get the extra 5 because the definition isn't established.

  Section 5: Debrief map (300 words)

  Start by asking pairs: Did you agree? What were the sticking points?

  Then, guide them to see:

  (a) Verbal dispute: The disagreement was about the definition of "public park". Once they disambiguated (by choosing a definition), the factual question (will the event disturb? will it foster community?) might be agreed upon, but the outcome still depended on the definition. So the original question was ambiguous.

  (b) Why it's not deflationary: Even after disambiguation, the argument didn't stop because the parties care about which definition is adopted. The Preservationist wants to be able to call the park a sanctuary and protect it from events; the Community Developer wants to call it a hub and activate it. The residual dispute is about which concept we should use, and that has real consequences (the event, and also the ability to make certain claims and pursue certain projects).

  Move to ontology: In metaphysics, questions like "Do composite objects exist?" can be seen as verbal. If we disambiguate by choosing a definition, we can say both sides are right (under their own definitions). But the fight continues because adopting one definition over the other has practical implications (e.g., for what we care about, how we allocate resources, what we consider real). In the game, the Preservationist and Community Developer are fighting over the concept because it shapes the world they live in.

  Map specific moments: 
  - When a student insisted on their definition even after the ambiguity was revealed, that was the residual fight over the concept.
  - The extra points for the statements represent the non-verbal stakes: the ability to frame the park in a certain way and use that framing in their projects (book, campaign).

  Section 6: What will go wrong the first time (150 words)

  Students might not fully grasp the scoring and might reveal their point values. Some might not see the ambiguity and argue about the event's factual effects (e.g., "But this event will be noisy!"). Prepare to redirect: "Assume the facts are as per the card: the event is typical, with some noise and crowd but also community benefits." Some pairs might coordinate quickly by flipping a coin, missing the point. If that happens, note it in debrief: "Why did you settle so quickly? Did you feel the loss of your concept?" Others might deadlock and then realize they could have compromised. The default outcome (event blocked) might bias the game if Preservationists are happy to deadlock. To mitigate, the extra points are only available if they coordinate and win. Also, the Community Developer has a strong incentive to avoid deadlock.

  Section 7: What the game can't do (120 words)

  This game cannot simulate the full depth of metaphysical disputes, which often involve more abstract concepts and no clear practical stakes. It also simplifies the process of disambiguation: in reality, we might have more than two definitions. The game focuses on the coordination problem and the residual stakes, but in metaphysics, the residual dispute might be about theoretical virtues (simplicity, etc.) rather than direct practical costs. Also, the game does not address how new evidence might bear on the dispute (since it's purely definitional). Finally, it may not capture the feeling that both definitions are equally "correct" in some sense, because the scoring makes one win and one lose.

  Section 8: Where this design is most likely to fail (100 words)

  The activity might fail if students don't feel the loss of their extra points (the statement) as a real cost, seeing it as arbitrary game points. To change that, we could make the statements more integral to a role-play (e.g., having them actually write a sentence on a poster or something). Also, if the Preservationist is content with the deadlock (getting 5 points), they might not engage in the coordination push. If that happens, it might undercut the lesson that coordination is mutually beneficial but contested. To change my mind: if in practice most pairs deadlock and report being satisfied, then the residual dispute might not feel costly enough.

  Overall, we have a design. Let's write it up in the requested sections.
answer: |-
  ### Setup (120 words)
  You're city stakeholders deciding whether to permit "UrbanFest," a commercial event in Liberty Park. The park features both a protected bird sanctuary and a popular event lawn. The question: "Should UrbanFest be allowed in the public park?" Each student receives a role card (Preservationist or Community Developer) defining "public park" based on hidden stakes. Preservationists need the term to prioritize ecological protection; Developers need it to prioritize social gathering. Both agree on all non-definitional facts (e.g., noise levels, crowd size). The goal: maximize personal points by influencing the decision, but pairs must agree on a unified answer. Cards emphasize real-world consequences of "losing" the definition (e.g., funding cuts for their cause).

  ### Rules and Materials (200 words)
  **Materials:**  
  - 8 "Preservationist" cards, 8 "Developer" cards (for 8 pairs).  
  - Timer, scoreboard.  

  **Card Details:**  
  - *Preservationist:* "Your definition: A 'public park' is a conserved natural habitat. Commercial events degrade this. If blocked, +10 pts. **Stake:** You run a children's ecology program. If your definition wins, you can truthfully claim 'This park teaches environmental stewardship' for +5 pts. If you adopt the Developer's definition, you lose this claim and funding."  
  - *Developer:* "Your definition: A 'public park' is a community event space. Commercial events fulfill this. If approved, +10 pts. **Stake:** You organize job fairs. If your definition wins, you can truthfully claim 'This park reduces unemployment' for +5 pts. If you adopt Preservationist's, you lose this claim and sponsors."  

  **Rules:**  
  1. Pairs have 10 mins to agree on "yes/no." No definition-sharing initially.  
  2. To agree, they must commit to one definition (e.g., "We use the Preservationist definition, so no").  
  3. If deadlocked at 10 mins, the event is blocked by default (Preservationist gains 5 pts, Developer 0).  
  4. Points are secret until scoring; no lying about stakes.  

  ### Timeline (150 words)  
  - **Min 0–5:** Distribute cards. Students read roles silently. Randomly pair into 8 groups.  
  - **Min 5–15:** Pairs debate. Encourage them to probe why the other resists "obvious" facts. (e.g., "You agree it’s noisy, so why allow it?").  
  - **Min 15–20:** Pairs report decisions. If agreed, state the definition used. If deadlocked, note it.  
  - **Min 20–25:** Calculate scores privately using card rules.  
  - **Min 25–35:** Display scores anonymously (e.g., "Pair 1: P 15, D 0"). Discuss patterns.  
  - **Min 35–75:** Debrief (40 mins, detailed below).  

  ### Scoring (120 words)  
  - **Agreed + won definition:** 15 pts (10 for outcome + 5 for claim).  
  - **Agreed + lost definition:** 0 pts (outcome lost + claim invalid).  
  - **Deadlock (event blocked):** Preservationist 5 pts, Developer 0 pts (no claims possible).  
  **Incentives:**  
  - Individually: Holding out could force your win (15 pts) or deadlock (5/0 pts). Accepting the other’s definition guarantees 0.  
  - As a pair: Deadlock averages 2.5 pts/person; agreeing on *any* definition averages 7.5 pts. Coordination is better collectively but forces a loser.  

  ### Debrief Map (300 words)  
  1. **Identify the verbal gap (10 mins):**  
     - Ask: "When you realized you meant different things by 'park,' did the factual disagreement vanish?" Highlight moments where students said, "Wait, you’re defining it *differently*?" Emphasize: No first-order disagreement remained once definitions were clear (e.g., both accepted noise/crowd facts).  
     - Map to metaphysics: Like "Do chairs exist?" where "existence" definitions (e.g., fundamental particles vs. functional units) resolve the dispute trivially.  

  2. **Show why stakes persist (15 mins):**  
     - Ask losers: "Why not accept the other definition since you agreed on facts?" Use quotes like, "I couldn’t say the park reduces unemployment anymore!" Link to costs (funding/sponsors).  
     - Argue: Disambiguation ended the *original* argument but birthed a "conceptual ethics" fight: which concept (ecological vs. social) should govern parks. This has material consequences (e.g., which programs survive).  
     - Map to ontology: In composition debates, disambiguation shows both sides are "right," but the fight continues because choosing "composition as identity" vs. "nihilism" affects ethical priorities (e.g., conservation vs. development).  

  3. **Connect to metaphysics (15 mins):**  
     - Stress: The residual conflict is about which concept *deserves* uptake. Ask: "Was this a fight over the world or our tools?" Then: "Both—adopting a concept changes what we *do*."  
     - Use a student’s insistence on their claim (e.g., "teaches stewardship") to show how ontology embeds values. Metaphysical disputes persist not because reality is unclear, but because conceptual choices allocate real-world resources.  

  ### What Will Go Wrong the First Time (150 words)  
  Students might fixate on factual debates (e.g., "But the noise *will* hurt birds!") despite cards stating shared facts. Redirect: "Your role card says you agree on this; focus on what the park *should be*." Some may reveal scoring early, undermining the stakes—remind them points are secret. Preservationists might "win" by forcing deadlock (5 pts), making Developers resentful; use this to highlight asymmetric costs in debrief. Pairs who coordinate fast (e.g., coin-flip) may miss the tension—ask them: "Did you feel you sacrificed something?" to surface regret. Time pressure could cut discussions short; use a visible timer.  

  ### What the Game Can't Do (120 words)  
  It can’t replicate open-ended metaphysical abstraction (e.g., "What is existence?"). The stakes here are practical (funding, claims), while metaphysics often involves theoretical virtues (e.g., simplicity). It also simplifies to two definitions, ignoring nuanced middle-ground positions. The game assumes coordination is possible, whereas real conceptual disputes may resist resolution. Finally, it doesn’t address how new evidence might shift debates (e.g., discovering pollution)—focusing solely on the definitional pivot. Use debrief to note these limits: "In ontology, the 'costs' are often about explanatory power, not funding."  

  ### Where This Design Is Most Likely to Fail (100 words)  
  If students see the extra points as arbitrary, not reflecting real-world loss, the residual stakes feel hollow. This would undermine the "nothing at stake" lesson. **Change my mind if:** >50% of losers say, "I didn’t care about the claim, only points." **Fix:** Replace points with tangible consequences (e.g., losers must rip up a "funding proposal" card). Alternatively, if deadlock consistently satisfies Preservationists, it may falsely suggest verbal disputes *are* deflated. **Change my mind if:** Most deadlocked pairs report no frustration. **Fix:** Rebalance scoring (e.g., deadlock gives both 2 pts, making coordination more urgent) or add a penalty (e.g., "City chaos: -3 pts all").  

  ---  
  **Fresh Case Generation:** For reuse, create role pairs with:  
  1. A shared term (e.g., "art," "privacy," "species").  
  2. Conflicting purposes (e.g., "Art must challenge norms" vs. "Art must beautify").  
  3. A yes/no question (e.g., "Is this graffiti art?").  
  4. Stakes tied to applying the concept (e.g., "If your definition wins, you get grant money").  
  Vary contexts annually (e.g., tech ethics, environmental policy) to avoid predictability.
