prompt: |-
  I'm the philosophy person on the board of a small land trust — the rest of the board is a retired field biologist, a real-estate lawyer, and two farmers — and two or three times a year we have to decide whether some population we're being asked to protect, buy an easement on, or hand back to the state program is really a distinct species, or "just" a population of something common. The money is small (low six figures at most) but the commitments are basically permanent, and we have to produce a one-page rationale the state natural heritage program will accept. We can't afford new sequencing, so we're always working from whatever conflicting papers someone else published, read by people who are not taxonomists, in one afternoon.

  What I want is a procedure we can run, not a theory. Concretely: the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to hand the decision back to us because the question is really about what we're protecting things *for* rather than about what's out there. Please ground it in the metaphysical stuff I keep half-remembering — the idea that species are historical individuals (lineages) rather than classes with essences, so that membership isn't a matter of how different an organism looks but of which lineage it's part of; and the fact that there are several legitimate species concepts that genuinely come apart, so "how different is different enough" has no theory-neutral answer.

  Two mistakes we keep making: treating some percentage of genetic divergence as a threshold, and treating "they can still interbreed" as decisive. Tell us what to do instead.

  Apply it to three cases. (1) Two streamside salamander lineages, ~2% divergence in mitochondrial DNA, one narrow hybrid zone, no obvious ecological difference. (2) A plant on a serpentine outcrop that looks and flowers differently from the widespread form but is genetically almost identical to it. (3) The one I'll hate: our flagship, a named mountain population that genomics now puts nested inside a widespread, unlisted species — we've raised money on it for years.

  Finally, be blunt about what the procedure can't do, and where we we should expect it to misfire.
reasoning: |-
  Okay, the user is on a land trust board with a mix of professionals—biologist, lawyer, farmers—and they need a practical, repeatable procedure for deciding if a population is a distinct species. They're stuck with existing papers and can't afford new sequencing. They want to avoid two common mistakes: using genetic divergence thresholds or interbreeding as sole criteria.  

  Hmm, they mention philosophical concepts like species as historical lineages rather than essentialist classes. That’s key. They also want the procedure to clearly flag when a decision hinges on conservation values versus scientific facts.  

  The three cases are telling: salamanders with minor genetic differences, a plant with morphological but no genetic divergence, and their flagship population that genomics just demoted. The last one’s emotionally charged—they’ve fundraised on it.  

  What they really need isn’t just science—it’s a decision-making scaffold that:  
  1. Forces them to confront lineage history first (per metaphysics).  
  2. Explicitly separates "what is it?" from "should we protect it?"  
  3. Avoids oversimplified genetic thresholds.  
  4. Builds consensus among non-taxonomists.  

  Biggest unspoken tension: Their biologist might over-index on genetics, farmers/lawyers on practicality. The procedure must bridge that. Also, they’re time-pressed—one afternoon per case!  

  For the metaphysics: Emphasize Ghiselin/Hull’s lineage concept. Stress that "difference" is secondary to "which story does this population belong to?" And yes, multiple species concepts (phylogenetic, ecological, biological) will conflict—that’s normal. The procedure should map those conflicts.  

  On mistakes:  
  - Genetic thresholds: Warn that 2% divergence might mean 100,000 years of separation or recent adaptation. Useless alone.  
  - Interbreeding: Hybridization happens between good species (bears! oaks!). Decisive only if gene flow is rampant and eroding divergence.  

  For the cases:  
  1. Salamanders: Probably one species unless hybrid zone is leaky.  
  2. Serpentine plant: Morphology screams ecology, but genetics say "not a lineage." Conservation may still want it.  
  3. Flagship: Brutal. Science says "no," but the procedure must validate their choice to protect it under "other values."  

  Hard truths:  
  - Some splits/lumps are arbitrary.  
  - Genomics keeps changing things.  
  - Their flagship’s demotion isn’t failure—it’s science working.  

  Procedure design:  
  Phase 1: Lineage history (irreversible split?)  
  Phase 2: Divergence depth (time matters!)  
  Phase 3: Operational concepts (apply PSC/ESC/BSC)  
  Phase 4: Conservation values (own your priorities)  

  Stop signs:  
  - No evidence of historical separation → stop, likely not distinct.  
  - All concepts conflict → hand to board for values call.  

  Finally, name the limits:  
  - Won’t resolve philosophy debates.  
  - Genomics might upend conclusions later.  
  - Emotionally hard choices stay hard.  

  …Time to structure this into a bulletproof flowchart.
answer: |-
  Here’s a practical, step-by-step procedure grounded in evolutionary metaphysics (lineage-based species concepts) for your board. It prioritizes **irreversible separation** over "difference," avoids genetic thresholds, and flags when decisions hinge on conservation values. Use this as a checklist for your one-page rationale.

  ---

  ### **The Procedure: 4 Questions, 3 Stop Signs**  
  *(Based on species-as-lineages [Ghiselin, Hull] and pluralism [Mayr, de Queiroz])*

  1. **QUESTION 1: IS THERE EVIDENCE OF HISTORICAL LINEAGE SPLIT?**  
     *What to ask:* Has this population been evolutionarily isolated long enough that gene flow is *impossible or biologically irrelevant*?  
     *Good evidence:*  
     - Physical barriers (e.g., rivers, mountains) with no recent connection.  
     - Genomic data showing *reciprocal monophyly* (lineage-specific mutations in both nuclear and mtDNA).  
     - Fossil/phylogeographic evidence of long-term separation (>500k years).  
     *Stop and reject distinctness if:*  
     → No barriers exist **and** gene flow is ongoing/possible (e.g., populations are adjacent with no isolation mechanism).  
     *If unclear:* Proceed to Q2.  

  2. **QUESTION 2: IS DIVERGENCE DEEP/IRREVERSIBLE?**  
     *What to ask:* If separated, has divergence reached a point where reunification is unlikely *even if barriers vanish*?  
     *Good evidence:*  
     - *Nuclear DNA* showing fixed differences (not % divergence!).  
     - Hybrids are sterile/inviable **or** ecologically unfit (e.g., mismatched breeding times).  
     - Adaptive traits under selection (e.g., drought tolerance) that would break down in hybrids.  
     *Stop and reject distinctness if:*  
     → Hybrids are fertile, viable, **and** spread genes widely (e.g., >10% hybrid frequency in sympatry).  
     *If unclear:* Proceed to Q3.  

  3. **QUESTION 3: DO OPERATIONAL SPECIES CONCEPTS AGREE?**  
     *Apply the "Big Three" concepts. Agreement of 2+ suggests distinctness:*  
     - **Phylogenetic Species Concept (PSC):** Does the population have ≥1 *fixed, diagnostic trait* (genetic/morphological)? *Not* gradual variation.  
     - **Ecological Species Concept (ESC):** Does it occupy a *unique niche* (e.g., soil type, host plant) and show local adaptations?  
     - **Biological Species Concept (BSC):** Is there *strong* reproductive isolation? (Weak isolation = irrelevant).  
     *Stop and reject distinctness if:*  
     → All concepts conflict **and** no barrier/irreversibility exists (Q1/Q2).  
     *If concepts conflict:* Proceed to Q4 (values-based decision).  

  4. **QUESTION 4: IS PROTECTION JUSTIFIED BY CONSERVATION VALUES?**  
     *Hand decision back to the board if:*  
     - Science is ambiguous (e.g., lineages young, concepts split) **but** the population has:  
       - Unique cultural/historic significance.  
       - Critical ecosystem role (e.g., keystone pollinator).  
       - Irreplaceable genetic diversity (e.g., drought-tolerant lineage).  
     *Rationale must explicitly state:* "Protection based on values, not taxonomic distinctness."  

  ---

  ### **Applying the Procedure to Your Cases**  
  **Case 1: Streamside Salamanders**  
  - Q1: Narrow hybrid zone suggests *no historical split* (gene flow possible). **→ STOP. Not distinct.**  
  - Rationale: "Lineages connected by ongoing gene flow; hybrid zone indicates one species under lineage-based concepts. No irreversible divergence."  

  **Case 2: Serpentine Plant**  
  - Q1: No physical barriers? Gene flow likely? **→ Proceed.**  
  - Q2: Genetically identical → no irreversible divergence. **→ STOP. Not distinct.**  
  - BUT: Q3 (ESC) shows unique niche (serpentine) and adaptations. Q4 decision: Protect as "ecotype" for evolutionary potential.  
  - Rationale: "Not a phylogenetic species, but locally adapted ecotype critical for edaphic biodiversity. Protection justified under ESC/values."  

  **Case 3: Flagship Mountain Population**  
  - Q1: Genomics nests it in widespread species → *no historical split*. **→ STOP. Not distinct.**  
  - Rationale: "Genomic data confirms no lineage separation; population is part of widespread species."  
  - **Q4 Required:** "Despite lack of taxonomic distinctness, protection justified due to: (1) Cultural significance as flagship; (2) Unique high-elevation phenotype; (3) Donor expectations."  

  ---

  ### **What This Procedure Can't Do (Be Blunt)**  
  1. **Resolve philosophy debates:** It won’t make species "real" – it prioritizes lineages but can’t fix arbitrary human categories.  
  2. **Override new data:** Genomics might upend conclusions (e.g., your flagship). Procedure mitigates this by emphasizing *irreversibility*, but permanence is aspirational.  
  3. **Fix bad data:** Garbage in = garbage out. If papers are contradictory, default to Q1 (barriers) – absence = "no."  
  4. **Prevent values-based decisions:** Science stops at Q3; Q4 is unavoidably political. Be transparent.  
  5. **Handle rapid evolution:** Newly isolated populations (<10k years) may fail Q1/Q2 despite adaptive divergence. Protect under Q4 if ecology justifies it.  

  ---

  ### **Why Your Mistakes Fail**  
  - **Genetic % thresholds:** 2% divergence could mean 10,000 years (trivial) or 2 million years (significant) – time matters, not %. Focus on *reciprocal monophyly* and fixed differences.  
  - **"Can interbreed":** Post-zygotic isolation (sterile hybrids) is key. Many "good" species hybridize (e.g., wolves/coyotes). BSC alone is outdated.  

  **Final Tip:** For your one-pager, structure rationale as:  
  ```  
  1. Lineage Status (Q1): [Evidence for/against split]  
  2. Irreversibility (Q2): [Evidence for/against]  
  3. Species Concepts (Q3): [PSC/ESC/BSC alignment]  
  4. Values Justification (if Q4): [Explicit reasoning]  
  ```  
  This forces clarity, exposes where science ends, and satisfies the state.
