prompt: |-
  I'm a novelist — crime-ish stuff set in a made-up Midlands town — and the book I'm halfway through has a strand where the town has to decide what to do with a statue of a Victorian factory owner whose money built the library, the baths and about a third of the street names. My drafts keep flattening into a speech about history, which is boring and not how it actually goes in a parish council room.

  So: I run a fortnightly writting group, 12 adults (mostly retirees, two sixth-formers), two hours on a Tuesday evening, a room with a flipchart and no tech. Design me an exercise that makes them *feel* the thing I'm after, which is that arguments about commemoration are mostly arguments about plumbing, insurance and who has to say the name out loud. Two notions I've been kicking about and want embedded in the rules rather than explained: the 'enunciation burden' — the people forced to repeat a contested name (on forms, giving directions, reading out a prize citation) are rarely the people it injures, and rarely the people who care what it means; and 'referential drift', the way a name stops being about the man once it's a bus stop and a postcode, which is an argument for leaving street names alone that does nothing for statues. I'd also like the trap where adding an explanatory plaque to atone for a monument just makes the monument more thoroughly about him, not less.

  No lecture up front, and they shouldn't hear any of those labels until afterwards. Give me the roles, the rounds, the stakes (nothing that needs real money), and a debrief that maps what happened onto the ideas. Say plainly what will predictably go wrong the first time I run it — half of them will want to debate whether the man was wicked — and be honest about which part of this the exercise can't reach and I'll have to put in the characters' mouths myself. Finally, tell me how confident you are that it'll actually land that way, and single out the bit you're least sure of.
reasoning: |-
  Okay, let me tackle this novelist's challenge. They're writing a crime-ish book set in a fictional Midlands town, struggling with a plotline about a controversial Victorian statue. Their drafts keep turning into boring history lectures when they want to capture the messy reality of parish council debates - the bureaucratic tangles around contested memorials. 

  They've identified three key concepts they want to explore through a writing group exercise: the "enunciation burden" (how marginalized groups often bear the brunt of saying offensive names in daily life), "referential drift" (how place names lose their original meaning over time), and the plaque trap (how adding explanatory context can ironically reinforce a monument's presence). 

  The exercise needs to be run low-tech with retirees and teens in a two-hour session. Crucially, we must avoid upfront lectures - these concepts should emerge from experience. I notice they're worried about participants derailing into historical debates about the statue subject's morality, which misses the point about bureaucratic realities.

  Hmm... What would make people feel the friction of administrative decisions? Maybe a role-play scenario where they have to make concrete choices about renaming things, with built-in constraints that mirror real-world complications. 

  I'm imagining three phases: first, assigning roles that create inherent tensions (like a dyslexic receptionist who has to say names aloud); second, forcing practical compromises under time pressure; third, a debrief connecting their frustrations to the concepts. The roles should include people with different stakes - someone focused on tourism, another on costs, another on accessibility - none purely ideological.

  For the enunciation burden, I could make one character repeatedly say the contested name while others debate abstractly. For referential drift, show how changing "Hargrave Street" affects everything from bus routes to medical records. The plaque trap could surface when they realize adding context makes the statue more prominent. 

  Biggest risk is the group fixating on whether the Victorian was "good" or "bad." To prevent this, I'll bake into the rules that the statue's morality is irrelevant - the decision is already made to remove it, and they're just handling logistics. If they still digress, the facilitator can redirect with "That's noted, but your committee must now decide about [practical consequence]."

  Least confident about whether the plaque dilemma will land clearly - participants might miss the irony that contextualizing reinforces presence. I'll make it explicit in debrief by asking: "Did explaining him actually reduce his presence or deepen it?" 

  The exercise can't capture long-term referential drift, only the immediate chaos of renaming. For the novel, they'll need characters to voice how "Hargrave" eventually just means the dodgy kebab shop corner. But tonight, the teens will feel the receptionist's wince saying it aloud, and the retirees will groan at the insurance costs - that's the gritty truth I want to give them.
answer: |-
  Here’s a low-tech, role-play exercise designed to make your group **feel** the bureaucratic friction of commemoration debates, not just debate the history. It weaponizes petty stakes to bypass ideological grandstanding.

  **Exercise Title:** *The Hargrave Hall Sign Dilemma*  
  **(Avoid using "statue" – focus on a mundane municipal object)**

  ### Setup (10 mins)
  - **Premise:** "You’re the naming sub-committee of Flintham Parish Council. The main hall (used for weddings, yoga, voting) is named after Josiah Hargrave – a 19th-c industrialist. After recent protests, *the council voted last month* to remove his name. Your job is purely logistical: **rename the hall AND handle the fallout.** Budget: £500. Time: 4 weeks until the Queen’s Jubilee event (non-negotiable)."
  - **Flipchart:** Draw 3 columns: **PROBLEMS | SOLUTIONS | COST/CONSEQUENCE**
  - **Assign Roles (Hand out slips):**
      1. **Clerk Derek:** Council admin. *Your Problem:* All booking forms, the website, and the engraved brass sign outside say "Hargrave Hall". You have dyslexia. **Stake:** You dread reading the name aloud at events.
      2. **Treasurer Brenda:** Manages budgets. *Your Problem:* Insurance documents, bank accounts, and the hall’s charity registration are in the old name. **Stake:** Renaming fees + legal paperwork costs. Every penny counts.
      3. **Events Manager Ravi:** Books weddings, markets. *Your Problem:* Couples have "Hargrave Hall" on invites. Google Maps/Waze still shows old name. **Stake:** Confused guests = bad reviews.
      4. **Historian Marjorie:** Local society. *Your Problem:* Wants a plaque explaining *why* the name was removed. **Stake:** "Context is educational!"
      5. **Bus Driver Sam:** (Teen role). *Your Problem:* Your route announcement says "Hargrave Hall". Regulars (especially elderly) use it as a landmark. **Stake:** Changing it confuses your passengers daily.
      6. **Artist-in-Residence Chloe:** (Teen role). *Your Problem:* Hates the ugly 1970s sign. Seeks funding for new art. **Stake:** Budget competition.
      *(Double up roles if needed; ensure Clerk & Bus Driver are played)*

  ### Rounds (80 mins total)
  1. **Problem Storm (15 mins):**  
     Roles shout out **specific, mundane problems** caused by renaming. *Clerk:* "I have to say 'Hargrave' 5 times at each council meeting!" *Bus Driver:* "Mrs. Higgins will get lost if I say 'New Hope Hall' instead!" *Treasurer:* "Re-engraving the brass sign costs £300!" **Facilitator:** Ruthlessly add these to the "PROBLEMS" column. **Stop any moral debates:** "The decision is made. Focus on the mess it creates."

  2. **Solution Slam (20 mins):**  
     Groups brainstorm fixes. **Force concrete choices:**  
     - *New Name?* (Suggestions: Flintham Hall? Unity Centre? After a local river?)  
     - *The Plaque?* (Where? How big? What wording? Who pays?)  
     - *The Sign?* (Patch over old name? Remove it? New artwork?)  
     - *The Forms/Google Maps?* (Temporary signs? Online redirects?)  
     **Add solutions/costs to flipchart.**

  3. **The Trade-Off Vortex (30 mins):**  
     Groups negotiate ONE plan. **Introduce constraints:**  
     - "A donor offers £250 for a new plaque about Hargrave’s *complex legacy* – but only if the hall keeps *some* reference to him."  
     - "The printer can only change website/forms IF you commit to the name TODAY."  
     - "Sam the Bus Driver reports elderly passengers are already complaining about *rumours* of a name change."  
     **Facilitator:** Hammer cost/time. "Brenda, can we afford the plaque *and* the sign?" "Ravi, can you contact all July weddings by Friday?"

  4. **The Jubilee Test (15 mins):**  
     Groups present their plan. **Stress-test it:**  
     - "It’s Jubilee Day. A VIP is unveiling the new name. Clerk Derek – read your script aloud." *(Forces enunciation)*  
     - "A journalist asks Marjorie: ‘Why spend money on this, not potholes?’"  
     - "Mrs. Higgins boards Sam’s bus: ‘Is this the way to Hargrave Hall?’ What do you say?"

  ### Debrief (30 mins - Key Questions)
  1. **"What frustrated you most?"** *(Listen for: paperwork, costs, saying the name, old people’s confusion)* → **Map to "Plumbing & Insurance."**
  2. **"Who had to say the name? Who *felt* it most?"** *(Clerk/Bus Driver vs. Historian)* → **"That’s the ENUNCIATION BURDEN. It’s not about ideology – it’s daily discomfort for those who must utter it."**
  3. **"Did 'Hargrave Hall' stop being about the man? What was it about?"** *(Bus stop, wedding venue, dyslexic’s nightmare)* → **"That’s REFERENTIAL DRIFT. Street names become directions, not tributes. But a statue? It’s *only* him."**
  4. **"Did the plaque solve anything? What did it *actually* do?"** *(Cost money, caused arguments, made them say his name MORE)* → **"The PLAQUE TRAP: Explaining a monument often deepens its presence. You can’t 'context' away a statue."**

  ### Predictable Problems & Mitigations
  - **"Was Hargrave really bad?" Debates:** SHUT DOWN. **Script:** "The council *already decided* he’s out. Your job is the paperwork. What’s your practical problem, Treasurer Brenda?" Redirect to logistics.
  - **Overly Idealistic Solutions:** "That’s £1200. Budget is £500." or "The Jubilee is in 4 weeks – legal paperwork takes 6."
  - **Ignoring Enunciation:** Force Clerk/Bus Driver to *repeatedly* say proposals aloud. "Derek, read the new name in your script. Now with your dyslexia flare-up."
  - **Historian Dominating:** Empower Treasurer/Events Manager: "Brenda, can we afford Marjorie’s 3ft plaque?"

  ### What the Exercise Can’t Do (For Your Novel)
  - **The Raw Emotional Injury:** The exercise shows bureaucratic weight, not the visceral pain of seeing a slaver’s statue daily. That’s for your characters – e.g., a descendant of Hargrave’s workers clenching their fists during the debate.
  - **Long-Term Drift:** It shows *immediate* chaos, not how "Hargrave" becomes just a bus stop in 50 years. Have a character muse: "Nobody remembers who he was. They just know the 142 stops there."

  ### Confidence & Uncertainty
  - **90% Confidence** it will make them *feel* the petty frustrations. The roles force engagement with bureaucracy. The enunciation burden will land because you make people *perform* it.
  - **Least Sure About:** The **plaque trap**. They might see the plaque as a win. **Mitigation:** In debrief, ask: "Did explaining Hargrave make him *more* or *less* present in the solution? Did you spend time/money on *him* or the *hall*?"

  **Why It Works:** It swaps ideology for insurance forms. By making them *solve* trivial problems, they embody the truth: commemoration battles are won by stamina for paperwork, not righteousness. The next time they draft that council scene, they’ll hear the Treasurer sighing over engraving costs.
