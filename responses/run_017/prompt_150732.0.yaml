  hey, I'm in a formal epistemology seminar this term and my group is doing an adversarial collaboration instead of a final paper. Mine is supposed to be between a strict/precise Bayesian and an imprecise-probabilities person on whether rationality ever *requires* indeterminate credences. Can you draft the document the two of them could both sign?

  What I need: a numbered section of claims both sides accept — e.g. that uncertainty you can honestly squeeze into one number should be squeezed into one, that the representation theorems already assume complete preferences so they can't by themselves settle this, that a convex set of priors avoids sure loss, and that sensitivity analysis across priors is tracking something real. Then a disagreements table, each position stated in wording it's own side woud accept.

  The cruxes I want covered: (1) uncertainty about which prior is right — is that just another prior (a mixture), or does mixing collapse a distinction between confidence and how much your evidence covers; (2) whether imprecision under sparse or ambiguous evidence is required or merely permitted; (3) dilation, where learning some coarse event makes your interval *wider* — feature or bug; (4) the Proxy Question: when an agent with a set has to act she must pick some prior in the set to steer by — is the picked prior then also her credence, or just a decision-making stand-in.

  Also one crux I made up: the Shrinkage Question, whether as evidence accumulates the width of the set goes to zero uniformly across the priors in it or can stay wide forever. Fold it in wherever it belongs.

  For each crux give one case or argument both sides would accept as bearing on it, with each side's prediction written down in advance. For the shrinkage one I was thinking of an interval-forecasting tournament: forecasters report intervals, scored on whether the truth lands inside plus a penalty for width — say whether any honest forecaster ever wins with non-degenerate intervals, and what each side predicts. And flag any part of this that's really just a verbal dispute. Please answer in American English, and keep it tight, around 700 words.
