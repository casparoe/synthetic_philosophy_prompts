answer: |-
  ### Moral Worth in the FTX-EA Debacle: A Philosophical Dissection

  **1. The Agent and the Act**  
  The primary agent is **Sam Bankman-Fried (SBF)**, but the "act" needing assessment isn’t a single donation or even his giving program. It’s his **life-plan: "earn to give."** This is the core commitment EA celebrates—amass wealth efficiently, then donate it to high-impact causes. SBF’s execution of this plan (pledging billions, funding bednets, pandemic prep) is inseparable from its motive structure. Why this granularity? Because moral worth attaches to *intentional actions*, and "earn to give" is a unified project with a telos: doing good *through* profit-seeking. Kantian evaluation targets the *maxim* (underlying principle) of such a life-plan: *"I will maximize wealth by any means necessary, then donate it to save lives."* If the maxim is corrupted (e.g., by fraud), the entire enterprise’s moral worth crumbles—even if individual donations achieved good. Conversely, an outcomes-focused view might isolate discrete acts (e.g., funding a malaria clinic) but misses the plan’s inherent unity.

  **2. Operative Reasons and "Motive Laundering"**  
  SBF’s motives were likely **heterogeneous**: genuine EA-inspired concern for suffering (responsive to utilitarian calculus), desire for status/approval within EA, and possibly using philanthropy as reputational "insurance" against scrutiny of FTX. The critical point isn’t just that motives were mixed—it’s that **EA provided a "vocabulary of respectability" that decoupled action from motive integrity.** "Motive laundering" is real, not mere hypocrisy. It occurs when an agent adopts a socially sanctioned moral framework (EA’s effective giving) not purely from duty or empathy, but because it *instrumentally serves* non-moral or self-interested goals (status, deflection), while *appearing* virtuously motivated. Kant would argue this voids moral worth: SBF’s actions weren’t done *because* they were good, but because EA offered a prestigious cloak. The Huck Finn counter (credit tracks what reasons you *respond to*) might salvage *some* worth if SBF was genuinely responsive to EA’s moral arguments—even alongside vanity. But the laundering effect exploits this: the movement’s framework makes it impossible to distinguish whether an agent is responsive to *morality* or to the *social rewards of appearing moral*.

  **3. The Taint Question**  
  Does stolen money void the moral worth of the giving? **Kant says yes; outcome-focused views say no.**  
  - **Kantian verdict:** Moral worth resides in the *will*, not outcomes. SBF’s donations were expressions of a fraudulent maxim ("earn *by theft* to give"). The act of giving was thus *contingent* on wrongdoing—making it morally void *even if* bednets saved lives. The "taint" isn’t magical pollution; it’s that the act was *constituted* by ill-gotten gains and a corrupt intention.  
  - **Outcomes view:** The good done (lives saved) is real and separable from SBF’s character. Worth attaches to consequences, not motives.  
  However, both sides agree the *agent* is blameworthy. Where theory goes silent: Kant doesn’t negate the *factual* good of bednets, only their *moral worth* as acts *of SBF*. The downstream beneficiaries aren’t "tainted"—they received aid, albeit via injustice. The "nothing it touches is clean" view is emotional, not philosophical: it conflates moral worth with causal history. Money is fungible; the wrong is in the *appropriation*, not the donation’s material effects.

  **4. What the Episode Does to the Theories**  
  This case **validates the Kantian view on moral worth but exposes its practical brittleness, while straining the outcomes view.**  
  - **Kant confirmed (awkwardly):** The theory correctly predicts SBF’s giving lacked moral worth *regardless of outcomes*. Its strength is its consistency: it would say the same if the fraud stayed hidden. But this is "embarrassing" because it renders moral worth *epistemically fragile*—unknowable without access to true motives.  
  - **Outcomes view strained:** It struggles to register the core moral failure. If bednets saved lives, SBF gets credit—even if funded by theft. It has no conceptual tool for "taint" beyond demanding repayment.  
  This reveals **moral worth as fundamentally agent-centric:** a verdict on character and intention, not a ledger of good done. The scandal confirms moral worth is *not* reducible to consequences.  

  **Institutions, Movements, and Category Errors**  
  Moral worth, strictly speaking, applies **only to individual agents**. Kantian "good will" or responsiveness to reasons requires consciousness and intention—attributes movements lack. EA as a movement has no "motive"; it’s a framework individuals adopt (or exploit). Calling EA or its institutions "morally worthy" is a category error—but not a useless one. Public discourse *is* committing this error by conflating:  
  - The *framework’s* normative goals (which are ideas, not agents).  
  - The *individual actions* of adherents (which may or may not have worth).  
  - The *movement’s social role* in enabling motive laundering (a systemic critique, not moral assessment).  
  The public argument conflates these, using "moral worth" rhetorically to praise/blame a collective. Philosophically, only SBF (or individual donors) can possess moral worth—but the *system* can be critiqued for how its structure facilitates laundering.

  **The Takeaway**  
  The FTX-EA mess underscores that moral worth belongs to the *agent’s will*, not the outcome. SBF’s "earn to give" life-plan was morally bankrupt because its core maxim (earn by any means) corrupted its end. EA’s framework, while normatively sound, became a tool for "motive laundering" by rewarding the *appearance* of effective giving irrespective of underlying integrity. The stolen money doesn’t magically taint bednets—but it reveals the hollowness of SBF’s purported reasons. Theories survive, but with scars: Kantians must accept that moral worth is often invisible; consequentialists must explain why justice isn’t part of the "good" they tally. The real lesson? Movements promising measurable good must also cultivate measurable integrity.
