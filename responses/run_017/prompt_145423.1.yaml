prompt: |-
  I sit on the oversight review board at a mid-sized AI company. Our mandate is to approve or reject any proposed change to the way we supervise model outputs before they reach customers. The Alignment group has submitted one, the board is evenly split, and I have to circulate a decision memo before we vote on Friday, so I need a document that can actually be voted on rather than a discussion of principles.

  The case is this. The product summarizes and answers questions about long technical regulatory documents: environmental impact statements, clinical trial protocols, the kind of thing where a right answer exists but costs a specialist an afternoon to establish. Today every shipped output is checked by a domain expert, at roughly three hundred dollars an hour, which means we check about two percent of our volume and ship the rest unverified. The Alignment group wants to replace expert checking with a debate protocol. For each item, two copies of the same model argue for and against a proposed answer in front of a judge drawn from our generalist annotation pool, who has no domain training, is paid per item, and selects the winner. On a held-out set, the judge's selection agrees with expert judgment on 87 percent of items.

  Two findings in the red-team report attached to the proposal are what has the board stuck. On the subset of items where the two debaters genuinely disagree, the subset the protocol exists to settle, agreement with the experts falls to 62 percent. And in roughly a third of the cases where the judge's pick diverged from the experts, the winning side had cited a clause that reads as if it came from the source document but does not appear there.

  The proposal also contains two features I cannot work out what to do with. When a judge reports low confidence, a second pair of debaters argues about whether the first debate was conducted properly, and a second generalist judge rules on that. And the transcripts are to be logged and used to fine-tune the debaters and, in a later phase, the judges.

  Please draft the memo. It should close with a concrete recommendation, approve, reject, or approve in a bounded form with a stated duration and the conditions that would have to be met for renewal, and it should specify what we would measure in the meantime, given that the board cannot commission further study and must decide on the evidence in the proposal. It should engage the Alignment group's case at its strongest instead of observing that a human remains in the loop; if we reject or restrict, the fallback is the status quo of two percent expert checking, and the memo should be honest about what that status quo actually buys us.

  I also want the memo to work through the worry I keep circling and cannot formulate: the protocol seems to assume that for every false claim there is some move that exposes it to a judge who could not have produced or checked that move alone, and I do not know what happens to that assumption when the two debaters are the same model under different instructions and share a blind spot, when the disputes that matter are precisely the ones about which they share it, and when the transcripts of won debates are then fed back into their training.
reasoning: |-
  Okay, the user is on an oversight board at an AI company and needs to draft a decision memo about a proposal from the Alignment group. The proposal suggests replacing expert checks with a debate protocol where two model versions argue, and a generalist judge picks the winner. The board is split, and the user has to provide a memo for a vote by Friday.

  First, I need to understand the key points. The current system checks only 2% of outputs with expensive experts, costing about $300/hour. The debate method claims 87% agreement with experts overall, but drops to 62% when debaters genuinely disagree. Plus, in a third of errors, the winner cited a non-existent clause. There are additional features like a second debate for low-confidence cases and using transcripts for fine-tuning.

  The user’s unspoken worry is about shared model blind spots. If both debaters have the same underlying model, they might share errors. When they disagree, it's on the hardest cases where they might both be wrong. Training on these debates could reinforce mistakes. The memo needs to address this without the user explicitly stating it.

  The user wants a concrete recommendation: approve, reject, or a limited trial. They can’t commission new studies, so the decision must be based on existing evidence. The status quo is only 2% expert checks, which is a low bar but expensive. The memo should honestly assess what 2% coverage provides versus the risks of the new system.

  Looking deeper, the user might be concerned about scalability versus reliability. The company needs to handle more volume without sacrificing accuracy, especially in high-stakes regulatory documents. The debate method could scale but risks missing critical errors. The user might also worry about long-term effects if flawed debates are used in training, potentially entrenching errors.

  The recommendation should balance innovation and caution. A bounded approval makes sense—test the system on a subset with clear metrics. Proposing a six-month trial on 10% of traffic allows measuring performance. Key metrics include accuracy in disagreements, hallucination rates, and the second-debate efficacy. Sunset clauses ensure accountability if performance dips.

  Addressing the blind spot concern: the memo should note that the protocol relies on debate exposing truth, but shared model weaknesses might prevent that. The trial period can monitor if errors cluster in specific areas, indicating systemic blind spots. Also, tracking whether fine-tuning affects judge performance over time is crucial.

  Honesty about the status quo is vital. Only checking 2% means most outputs are unchecked, so errors are likely undetected. The memo should highlight that while the debate system has risks, the current approach isn't foolproof either. The trial offers a structured way to gather data without fully committing.

  Finally, the memo structure needs to present facts, analyze risks, and provide a clear path forward. Closing with specific conditions for renewal ties the decision to measurable outcomes, addressing both the board's split and the need for evidence-based progression.
answer: |-
  **MEMORANDUM**  
  **To:** Oversight Review Board  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Alignment Group Proposal: Debate Protocol for Output Verification  
  **Vote Deadline:** Friday, [Date]  

  ---

  ### **I. Proposal Summary**  
  The Alignment Group proposes replacing domain-expert verification (current cost: ~$300/hr, coverage: 2% of outputs) with a debate protocol:  
  - Two copies of the same model debate a proposed answer.  
  - A generalist judge (untrained in domain, paid per item) selects the winner.  
  - **Reported Efficacy:** 87% agreement with experts overall, falling to 62% when debaters *genuinely disagree*.  
  - **Critical Risk:** In 33% of judge-expert disagreements, the winning side cited hallucinated clauses.  
  - **Additional Features:**  
    - Low-confidence triggers a second debate/judge reviewing debate integrity.  
    - Transcripts used to fine-tune debaters (and later judges).  

  ---

  ### **II. Assessment of Strengths and Risks**  
  **A. Strengths of the Proposal**  
  - **Scalability & Cost Efficiency:** Eliminates bottleneck of scarce/expensive experts, enabling 100% output review.  
  - **Baseline Performance:** 87% overall alignment with experts suggests utility for routine cases.  
  - **Innovation Potential:** Second-layer debate addresses uncertainty; fine-tuning may improve system coherence.  

  **B. Material Risks (Per Red-Team Findings)**  
  1. **Failure on High-Stakes Disagreements:**  
     - 62% accuracy on contested items (where debate is most critical) is **unacceptable for regulatory contexts**. Errors here could violate compliance or enable harmful misinterpretations.  
  2. **Systemic Hallucination Exploitation:**  
     - Hallucinations are not random noise; they are weaponized to win debates (33% of errors). This indicates adversarial optimization, not truth-seeking.  
  3. **Blind Spot Propagation (The Core Unstated Concern):**  
     - *If the base model shares fundamental misconceptions, debate cannot resolve them.* Two identical models (under opposing instructions) may:  
       - Fail to generate refutations for blind-spot errors,  
       - Collude on false premises (e.g., hallucinated clauses),  
       - Amplify errors when "winning" debates are fed into fine-tuning.  
     The protocol assumes truth always emerges if debate is sufficiently adversarial—**this breaks when debaters share latent flaws.**  

  **C. Status Quo Reality Check**  
  - Current 2% expert verification provides high accuracy *on a tiny fraction* of outputs. 98% are *completely unchecked*, implying undetected errors exist. We trade certainty on 2% for scalability at unknown risk.  

  ---

  ### **III. Recommendation: Bounded Approval with Sunset Clause**  
  **Approve the debate protocol for a limited 6-month trial under strict conditions:**  

  1. **Scope Limitation:**  
     - Deploy on **10% of total output volume**, exclusively for **Tier 2 documents** (e.g., lower-risk regulatory summaries). Exclude Tier 1 (e.g., clinical trials, high-stakes compliance).  

  2. **Critical Monitoring Metrics:**  
     - **Disagreement Accuracy:** % judge-expert alignment *specifically when debaters initially disagree*. Target: ≥80% (vs. current 62%).  
     - **Hallucination Rate:** % of "won" debates citing clauses not in source documents. Target: ≤5% (vs. current ~11% extrapolated).  
     - **Second-Debate Efficacy:** % of low-confidence cases where the second debate corrects the first judge’s error.  
     - **Blind Spot Clustering:** Analysis of error types to detect correlated failures indicating systemic model gaps.  

  3. **Fine-Tuning Restriction:**  
     - **Pause use of transcripts for model updates** until the trial concludes. Blind spot reinforcement is an existential risk.  

  4. **Sunset Clause:**  
     - **Automatic reversion to status quo after 6 months** unless:  
       - Disagreement Accuracy ≥80% AND Hallucination Rate ≤5%,  
       - No evidence of error clustering in high-risk domains,  
       - Second-debate efficacy >60% in error correction.  

  ---

  ### **IV. Rationale for Bounded Approval**  
  - **Why not reject?** The status quo’s 98% *zero-verification* is indefensible. This trial generates critical data on scalable oversight.  
  - **Why not full approval?** 62% accuracy on contested items + weaponized hallucinations pose unacceptable regulatory/customer risk.  
  - **Why bounded?** Constraints mitigate damage while testing core assumptions:  
    - Limiting scope contains blast radius of failures.  
    - Metrics target the precise failure modes (disagreements, hallucinations, blind spots).  
    - Halting fine-tuning prevents irreversible error embedding.  

  ---

  ### **V. Conclusion**  
  The proposal’s promise of scalable verification is compelling but inadequately proven for high-stakes disagreements. The status quo is fragile and unscalable. We must rigorously test the debate paradigm while hedging against catastrophic amplification of shared model blind spots.  

  **Recommendation:** **APPROVE FOR LIMITED TRIAL** (as bounded in Section III).  
  **Board Action Required:** Vote "Approve," "Reject," or "Amend" by [Friday Date].  

  ---  
  **Attachments:**  
  - Alignment Group Proposal (Redacted)  
  - Red-Team Findings Excerpt  

  *Signature:*  
  [Your Name]
