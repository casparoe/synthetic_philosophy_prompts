prompt: |-
  I am a junior at a large public high school and a member of our school's newly formed Longtermist and Rationality Club. At our last meeting we tried to turn the doomsday argument into a concrete forecasting tool, and I came away convinced that the argument settles an empirical question that my philosophy textbook still describes as merely philosophically contested. I would be grateful for your help understanding why the textbook remains so hesitant.

  Our reasoning went as follows. We started from the simplest form of the doomsday argument: I should treat myself as a random sample from the set of all human beings who will ever live. My birth rank is roughly 100 billion, since about 100 billion people have lived before me. If my fractional position in the total human population is uniformly distributed, then there is a 95 percent probability that I am not among the first 5 percent of all humans who will ever exist. This implies that the total number of humans who will ever live, N, is less than 20 times my birth rank: N is less than about 2 trillion.

  Because we did not want the conclusion to depend on an arbitrary prior, we added what we called the Neutral Prior Amendment. We assumed a scale-invariant prior for N, proportional to 1/N, on the grounds that this is neutral about the overall scale of the human population. We took this to show that the 95 percent bound is not a vague shift in confidence but a precise posterior probability: given the self-sampling assumption and a neutral prior, there is a 95 percent probability that fewer than 2 trillion humans will ever live.

  We then made two further adjustments so that the argument could speak to policy. First, we introduced a Mars weighting adjustment. If humanity founds a permanent, self-sustaining colony on Mars, we reasoned that future people born off Earth should count as only 0.8 of a person when sampling from the relevant reference class, because a Martian-born human plausibly has a somewhat lower chance of being included among observers than an Earth-born human. This change raises the effective bound to about 2.5 trillion people. Second, we adopted a constant-births baseline: the annual number of human births stays near its present level of about 140 million. Dividing the roughly 2.4 trillion remaining effective people by 140 million births per year gives approximately 17,000 years of future human existence under that baseline.

  Our spreadsheet, however, used a slightly different projection. It assumed that annual births will grow at about 1.1 percent for the next century before declining, and it combined that growth path with the bound on total population. The result was a 95 percent credible interval for the extinction of Homo sapiens between the years 2100 and 2400, with a central estimate near 2200. The spreadsheet therefore reports a 95 percent probability that humanity will be extinct by 2200 unless we either stop having children or change the reference class by colonizing space.

  If this chain of reasoning is just an application of the self-sampling assumption together with a neutral prior, then I do not understand what is left to dispute. The mathematics of sampling from a finite population seems straightforward, and our adjustments only make the argument more realistic rather than less. Why, then, do my teacher and our textbook continue to describe the doomsday argument as philosophically controversial rather than as a settled probabilistic theorem? Is there a mistake in our spreadsheet, or are philosophers simply unwilling to accept the implications of the math?
reasoning: |-
  Okay, let me start by really understanding what this high school junior is asking. They're part of a Longtermist and Rationality Club and have been working on the doomsday argument. They've taken it from a philosophical concept to a concrete forecasting tool, complete with adjustments like the Neutral Prior Amendment, Mars weighting, and birth rate projections. Their spreadsheet even outputs a 95% probability that humanity goes extinct by 2200. They're confused why their philosophy textbook still treats the doomsday argument as controversial instead of accepting it as a settled mathematical theorem.

  First, I need to unpack their reasoning. They started with the basic doomsday argument: treating themselves as a random sample among all humans who will ever live. With a birth rank of 100 billion, they applied a uniform distribution to conclude that there's a 95% chance they're not in the first 5%, leading to N < 2 trillion. Then they added a scale-invariant prior (1/N) to avoid arbitrary assumptions. That seems solid to them mathematically. 

  Next, their adjustments. The Mars weighting reduces Martians to 0.8 persons due to lower inclusion probability. Then they assumed constant birth rates to project 17,000 more years. But their spreadsheet used a 1.1% growth model, shortening the timeline to 2100-2400 with a 2200 median. The key question is why this isn't accepted as proven.

  The student is frustrated. They see this as straightforward math, so the textbook's hesitation must mean philosophers are avoiding uncomfortable truths. But I need to identify the real philosophical objections. Let me recall the main critiques. First, the self-sampling assumption (SSA) itself is contentious. Treating oneself as a random sample from all possible observers assumes a specific reference class. What defines an "observer"? Is it all humans, or does it include other sentient beings? SSA also leads to paradoxes like the Sleeping Beauty problem, showing it's not universally accepted.

  Then there's the reference class problem. Their Mars weighting tries to address this, but how do we define "human"? Future beings might be digital or genetically modified, blurring lines. Also, the 0.8 weighting is arbitrary. Why 0.8? This subjectivity undermines the argument's mathematical purity.

  The prior choice is another big issue. They used a 1/N prior, claiming neutrality. But is it truly neutral? This prior is improper, requiring arbitrary truncation. Moreover, scale-invariance might seem neutral, but priors carry assumptions. For example, a uniform prior over N would give different results, and there's no consensus on which prior is correct.

  The birth rate projections add more uncertainty. Assuming 1.1% growth for a century then decline is speculative. Historical trends don't guarantee future patterns, especially with potential existential risks. Combining speculative demography with a controversial prior weakens the conclusion.

  Also, the doomsday argument's implications can be counterintuitive. If humanity survives for millennia, their birth rank would be exceptionally early, which SSA deems unlikely. But that doesn't make survival impossible; it just assigns low probability. Philosophers might reject SSA precisely because it implies doom with high confidence despite no empirical evidence.

  The student's approach is impressive for its rigor, but each step introduces philosophical choices. The textbook's hesitation reflects legitimate debate about these choices, not denial of math. The controversy lies in the assumptions, not the calculations. Highlighting these nuances is key to answering their question without dismissing their effort.
answer: |-
  Your reasoning is impressively rigorous for a high school club, and your frustration is understandable. The Doomsday Argument (DA) is mathematically coherent *given its premises*, but those premises are philosophically contested—not the math itself. Here’s why textbooks treat it as controversial:

  ### 1. **The Self-Sampling Assumption (SSA) Is Not Empirically Neutral**
     - **Core problem**: SSA treats your existence as a randomly selected observer from the set of *all* observers (past, present, and future). This assumes a specific reference class ("humans") and presumes you’re typical within it.
     - **Why it’s contested**:
       - **Reference class problem**: Should "observers" include Neanderthals? AI? Aliens? Your Mars adjustment (0.8 weight) is arbitrary—there’s no objective way to define this.
       - **Paradoxes**: SSA leads to counterintuitive results (e.g., the "Sleeping Beauty Problem" or "Adam and Eve" thought experiments).
       - **No empirical basis**: SSA is a metaphysical claim about probability in the absence of data. It’s not falsifiable.

  ### 2. **The "Neutral Prior" (1/*N*) Isn’t Neutral**
     - Your prior assumes that *all orders of magnitude* for *N* (total humans) are equally likely. For example:
       - *P*(*N* = 10¹²) ≈ *P*(*N* = 10²⁴)
     - **Objections**:
       - **Improper prior**: The 1/*N* prior is not integrable (it sums to infinity). You *must* impose arbitrary bounds (e.g., *N* > 100 billion), which affects results.
       - **Scale-invariance isn’t unique**: A uniform prior over log(*N*) *seems* neutral but ignores other symmetries (e.g., using *N*² instead of *N* changes outcomes).
       - **Contradicts evidence**: Known population growth rates (e.g., exponential post-Industrial Revolution) suggest *N* is far more likely to be 10¹⁴ than 10³⁰—but your prior ignores this.

  ### 3. **Your Adjustments Introduce Arbitrariness**
     - **Mars weighting (0.8)**: Why 0.8? If Martians have 80% inclusion probability, shouldn’t medieval peasants (<100% records) also be downweighted? This exposes the subjectivity of the reference class.
     - **Birth rate projections**: Assuming 1.1% growth for a century then decline is speculative. Small changes here drastically alter your 2200 median estimate.

  ### 4. **Philosophical Objections to the DA’s Conclusion**
     - **Observation selection effects**: If humanity survives for 1 million years, *most* observers *would* be in the far future. SSA says you’re unlikely to be "early," but this discounts independent evidence (e.g., technology reducing extinction risks).
     - **Anthropic shadow**: We only observe worlds where humanity survived long enough for us to exist. This doesn’t imply we’re likely to die soon.
     - **Self-indication assumption (SIA)**: An alternative to SSA argues that *your existence* is evidence *for* large *N* (since more observers increase the chance you exist). SIA cancels the DA’s doom prediction.

  ### 5. **Why Textbooks Hesitate: Key Controversies**
     | **Premise**          | **Your Assumption**       | **Contested Alternatives**         |
     |----------------------|---------------------------|-----------------------------------|
     | Reference class      | Birth-ranked humans       | All conscious entities, or "observer-moments" |
     | Prior for *N*        | Scale-invariant (1/*N*)   | Uniform over *N*, or empirical priors |
     | Sampling probability | Uniform over individuals  | Weighted by observability (e.g., Mars=0.8) |
     | Birth rate trend     | Modeled growth then decline | Continued growth, or unknown |

  ### Conclusion: A Tool, Not a Theorem
  Your spreadsheet correctly implements the DA *under specific premises*, but those premises are debated because:
  - They rely on untestable philosophical assumptions (SSA vs. SIA).
  - "Neutral" choices (e.g., 1/*N*) aren’t objectively neutral.
  - Real-world factors (AI, genetic engineering) could invalidate the reference class.

  Philosophers don’t reject the math—they dispute whether the premises apply to reality. Your textbook’s hesitation reflects that the DA is a thought experiment highlighting how *anthropic reasoning* affects predictions, not a settled empirical tool. For policy, it’s more prudent to rely on evidence-based existential risk models (e.g., nuclear war, AI, biotech) than the DA alone.

  If your club wants to explore further, consider debating:
  - SSA vs. SIA using Nick Bostrom’s *Anthropic Bias* (2002).
  - The "No-Nukes DA" (if nukes make doom likely, why are we here?).
  - Whether DA-like reasoning applies to predictions of AI timelines.
