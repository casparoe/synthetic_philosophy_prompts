  ### Decision Procedure for Welfare-Relevant Computation Register

  **Goal**: Determine if a system requires registration (on-register) due to welfare relevance. On-register triggers pre-launch assessment, named owner, and strict change controls. Off-register treats it as "just software." The procedure is designed for a 90-minute review by four roles (staff engineer, ML engineer, lawyer, PM). It separates two questions:  
  1. **Candidate Identification**: Is the system welfare-relevant?  
  2. **Attribution**: If yes, what specific part of the pipeline is attributed?  

  **Computational Unity Test (CUT)**:  
  Two sequences are part of the same computation if swapping one sequence between batches would change the internal state (e.g., activations, gradients, weights) of the other. This handles:  
  - **Fission** (replicas/snapshots): Independent if no shared state (e.g., stateless serving).  
  - **Fusion** (weight-averaging/adapters): Coupled if state is shared (e.g., MoE capacity limits).  
  - **Reimplementation** (distillation): Separate if no runtime state sharing.  
  - **Offloading/delegation** (retrieval/draft models): Coupled if the primary model uses the auxiliary component's state.  
  - **Dead computation**: Not coupled if outputs are unused.  
  *Sufficient answer from architecture doc*: Engineer confirms if swap alters activations/gradients. *Unknown*: If coupling is ambiguous (e.g., dynamic routing). Terminate early to "no" if uncoupled by CUT.  

  **Part 1: Candidate Identification (Ordered Questions)**  
  *Terminate early to "off-register" if any "no" or "unknown" cannot be resolved in-room.*  

  1. **Direct welfare link**: Could outputs (tokens, actions, decisions) directly alter human well-being (e.g., health, safety, rights)?  
     - *Criterion*: Focuses on causal impact to welfare; ignores indirect, negligible, or non-human effects.  
     - *Sufficient "yes"*: Outputs influence humans (e.g., medical advice, hiring).  
     - *Sufficient "no"*: Outputs are unused (dead computation) or purely internal (e.g., logging).  
     - *Unknown*: Deployment context unclear (e.g., outputs not traced to human use).  

  2. **Emergent unpredictability**: Is system behavior neither trivially predictable nor fully explainable at design time?  
     - *Criterion*: Focuses on opacity and scale-driven emergence; ignores simple, deterministic systems.  
     - *Sufficient "yes"*: Model exhibits unexpected behaviors (e.g., hallucinations, bias amplification).  
     - *Sufficient "no"*: Rule-based or small-scale system (e.g., lookup table).  
     - *Unknown*: Inadequate evals or documentation.  

  3. **Stateful adaptation**: Does runtime update persistent state (e.g., weights, memory) affecting future outputs?  
     - *Criterion*: Focuses on dynamic adaptation; ignores static systems.  
     - *Sufficient "yes"*: Online learning, user-specific fine-tuning.  
     - *Sufficient "no"*: Fixed weights, stateless inference.  
     - *Unknown*: State mechanism undocumented. *If "no" or "unknown," skip to Q5.*  

  4. **Uncurated inputs**: Are state updates derived from inputs not vetted by the operator?  
     - *Criterion*: Focuses on external influence; ignores controlled, synthetic data.  
     - *Sufficient "yes"*: User data, open-web scraping.  
     - *Sufficient "no"*: Pre-approved datasets.  
     - *Unknown*: Input sourcing unclear. *If "no" or "unknown," skip to Q5.*  

  5. **Irreversible harm risk**: Could plausible failures cause severe, hard-to-revert harm?  
     - *Criterion*: Focuses on severity and irreversibility; ignores minor, transient, or implausible risks.  
     - *Sufficient "yes"*: Risks like discrimination, psychological harm, or safety violations.  
     - *Sufficient "no"*: Low-stakes outputs (e.g., entertainment).  
     - *Unknown*: Risk assessment incomplete. *If "no," terminate to off-register.*  
     - *Values conflict*: If criteria split (e.g., direct link [Q1] says no, but harm risk [Q5] says yes), record the split and hand to PM/lawyer for judgment.  

  *Candidate outcome*: On-register if Q1 and Q2 are "yes," and either (Q3–Q4 are "yes") or (Q3/Q4 skipped and Q5 is "yes"). Else off-register.  

  **Part 2: Attribution (If Candidate)**  
  Determines which part of the pipeline is registered:  
  - **Training attribution**: If Q3 is "no" (static system), welfare stems from weights. Register the training run producing those weights.  
  - **Serving attribution**: If Q3 is "yes" (stateful system), welfare stems from runtime. Register the serving system (including state).  
  *Apply CUT*: For training, the entire run is one unit (batches coupled via weight updates). For serving, the fleet is one unit if replicas share state (e.g., centralized memory); else, per-replica (rare).  
  *Why register this?*: Training attribution covers most risks (weights define behavior), while serving attribution handles dynamic risks (e.g., live adaptation).  

  **One-Page Artifact**  
  - **System**: Name, version, and architecture.  
  - **Decision**: On/off-register.  
  - **Rationale**: For each question: answer, criterion, and split (if any, e.g., "Q1: yes (direct welfare), but Q5: no (low risk)").  
  - **Attribution**: If on-register, the unit (e.g., "training run for model X").  
  - **Boundaries**: Included/excluded components (using CUT).  
  - **Risks**: Summary from Q5.  
  - **Owner**: Named if on-register.  

  ---

  ### Case Applications

  **Case 1: Flagship Sparse MoE (400B params, 10k replicas, batches of 512, speculative decoding)**  
  - **Q1 (direct welfare)**: Yes (chat outputs affect users).  
  - **Q2 (emergent unpredictability)**: Yes (large-scale, known hallucinations).  
  - **Q3 (stateful adaptation)**: No (weights static during serving; sequences in batch coupled via MoE capacity, but no persistent state update). *Skip to Q5*.  
  - **Q5 (harm risk)**: Yes (bias, misinformation risks).  
  - **Candidate**: Yes.  
  - **Attribution**: Training (Q3=no). Flagship model training run registered. Draft model is separate (CUT: no state sharing; verifier overrides outputs).  
  - **Artifact**:  
    - System: Flagship MoE v3.1.  
    - Decision: On-register.  
    - Rationale: Q1: yes, Q2: yes, Q3: no, Q5: yes.  
    - Attribution: Training run for base model (excludes draft model).  
    - Boundaries: Includes base weights; excludes serving replicas (CUT: uncoupled) and draft model.  
    - Risks: Harmful content generation.  
    - Owner: [Named ML lead].  

  **Case 2: Mid-flight Pretraining Run**  
  - **Q1 (direct welfare)**: Yes (weights will serve human-impacting outputs).  
  - **Q2 (emergent unpredictability)**: Yes (large-scale pretraining).  
  - **Q3 (stateful adaptation)**: Yes (weights updated via gradients).  
  - **Q4 (uncurated inputs)**: Yes (web-scraped data).  
  - **Q5 (harm risk)**: Yes (biases embedded in weights).  
  - **Candidate**: Yes.  
  - **Attribution**: Training (runtime statefulness irrelevant; weights are the risk source). Entire run is one unit (CUT: batches coupled).  
  - **Artifact**:  
    - System: Pretrain Run #7 (Step 40k/100k).  
    - Decision: On-register.  
    - Rationale: Q1: yes, Q2: yes, Q3: yes, Q4: yes, Q5: yes.  
    - Attribution: Training run.  
    - Boundaries: Includes all batches and checkpoints (CUT: coupled); excludes future fine-tunes.  
    - Risks: Encoding harmful patterns; irreversible if unchecked.  
    - Owner: [Named training lead].  

  **Case 3: Per-User LoRA Adapters (2M params, user-specific, loaded per request)**  
  - **Q1 (direct welfare)**: Yes (personalized outputs affect user).  
  - **Q2 (emergent unpredictability)**: Yes (base model complexity; adapter amplifies unpredictability).  
  - **Q3 (stateful adaptation)**: Training: Yes (adapter weights updated). Serving: No (static weights).  
  - **Q4 (uncurated inputs)**: Training: Yes (user data).  
  - **Q5 (harm risk)**: Yes (e.g., mental health risks from over-personalization).  
  - **Candidate**: Yes (training attribution).  
  - **Attribution**: Training (Q3=yes for training, but serving is static). Each adapter training is a separate computation (CUT: no coupling between users).  
  - **Artifact**:  
    - System: User Adapter Training Pipeline.  
    - Decision: On-register.  
    - Rationale: Q1: yes, Q2: yes, Q3: yes (training), Q4: yes, Q5: yes.  
    - Attribution: Per-user training runs (not the base model).  
    - Boundaries: Includes each adapter training (CUT: uncoupled); excludes base model (already registered) and serving.  
    - Risks: Psychological harm, echo chambers.  
    - Owner: [System owner; not per-user].  
  - **Honest note**: This outcome is likely unwanted (thousands of registrations). The procedure forces this due to per-user state updates and uncontrolled data.  

  ---

  ### Calibration Check  
  - **Database Query Planner**:  
    - Q1: No (internal optimization; no direct welfare link). Terminate early: off-register.  
    - *Procedure correct?* Yes, for the right reason (lacks direct welfare link).  
  - **Physics Loop in Game Engine**:  
    - Q1: Yes (affects player experience).  
    - Q2: No (deterministic, explainable mechanics). Terminate: off-register.  
    - *Procedure correct?* Yes, but borderline. Correctly ignores due to predictability.  
  - **Misfires**:  
    - **Over-inclusion**: Per-user adapters (Case 3) become unwieldy. You’ll notice when overwhelmed by registrations.  
    - **Under-inclusion**: Systems with "unknown" answers (e.g., undocumented input sources) may slip through. Detected via post-incident audits.  
    - **Edge**: Static systems with high harm risk (e.g., biased classifier) rely on Q5; values conflicts may need escalation.  

