  We must identify the boundaries of the computation that we are attributing welfare-relevance to. This is done by applying the CUT.

  - For a serving system with multiple replicas: each replica is independent (unless they share state via some mechanism). So each replica is a separate computation? But note: the weights are the same. However, the weights are fixed and not updated during serving? Then each request is independent? But wait: if the system has a shared state (like a database) then multiple requests might be coupled.

  We break it down:

  - Start with the entire pipeline (e.g., from input token to output token, including retrieval, draft model, etc.).
  - Then, split the pipeline into components that are computationally independent by the CUT: if two parts do not share state that is updated and then used across them, they are separate.

  Specifically, for a given input, we trace the data flow and state updates. If two inputs (or two parts of the system) share no updated state (i.e., the processing of one does not affect the internal state used for the other), then they are separate computations.

  But note: in training, the entire run is one computation because the weights are updated by every batch and then used for the next.

  In serving:
  - If the model is stateless (no weight updates, no shared state between requests), then each request is a separate computation. But note: the model weights are the same for all. However, the weights are fixed and not updated by the requests? Then the weights are an external resource, not part of the state of the computation. So each request is independent.

  But what about the model weights? They are the result of a prior computation (training). We are going to attribute the welfare-relevance to the model weights? But the weights are used in every request. So the weights are a shared resource. How do we attribute?

  We have two options:
  - Attribute to the model weights as a persistent entity that is used in many computations.
  - Attribute to each request as a separate computation.

  But note: the weights are fixed and not updated by the requests. So the weights are not part of the state of the request computation. Therefore, the welfare-relevant behavior of the request is entirely determined by the weights and the input. So if we are concerned about the model weights (because they were trained in a way that might cause harmful behavior), then the training run is the computation that produced the weights, and the weights are the artifact. Then the serving requests are just executions of that artifact.

