  We are designing a decision procedure for the "welfare-relevant computation" register. The goal is to have a practical, step-by-step process that can be run in a 90-minute meeting by four people (staff engineer, ML engineer, lawyer, PM). The procedure must be concrete, handle architectural complexities, separate candidate identification from attribution, and avoid philosophical jargon.

  Constraints:
  1. State moral criteria plainly, without citations or isms. If criteria conflict, record the split.
  2. Handle architectural cases: fission, fusion, reimplementation, offloading/delegation, dead computation. Provide a test for computational unity (we'll use a modified "swap test").
  3. Separate two questions: (a) is it a candidate? (b) if yes, which parts get attribution?

  We'll use the following computational unity test (replacing the swap test):
  **Computational Unity Test (CUT):** Two sequences (or data points) are part of the same computation if the output of one can causally affect the internal state that is used in processing the other. In other words, if the internal state (e.g., weights, activations, memory) that is updated by processing one sequence is then used in processing another sequence, then they are coupled.

  This handles:
  - Fission: Multiple replicas of the same weights are independent (no shared state beyond the initial weights) so each replica is a separate computation. However, if there is a shared state (like in a training run with gradient accumulation across batches) then they are one.
  - Fusion: Weight averaging of two fine-tunes: if the averaging happens after independent training, then the two training runs are separate computations, but the averaged model is a new one. If the adapters are merged into a base, the base and the adapter are part of the same computation when run together.
  - Reimplementation: A distilled model is a separate computation because it does not share internal state with the original at runtime.
  - Offloading/delegation: If a retrieval corpus is used, the corpus is part of the computation because it is used as internal state. Similarly, a draft model and verifier are coupled if the verifier uses the draft's proposals and then updates state that affects future tokens (but note: in speculative decoding, the draft is independent and the verifier just accepts/rejects; the base model's state is not updated by the draft, so they are separate? Actually, the draft is run first, then the base model runs on the same token and the draft's output is thrown away if rejected. So the base model's state is updated only by its own processing. Therefore, the draft and base are independent computations per request? But note: the base model's state is fixed. For a given request, the draft and base are run in sequence but without shared state updates during the request? So they are two separate computations? However, the draft is run to speed up the base, and the base uses the draft's output to skip some steps. But the base model's internal state is not updated by the draft. So they are independent? This is tricky. We'll have to see per case.)
  - Dead computation: If outputs are logged and never read, then there is no effect on any other computation, so it is not part of a larger computation that affects the world. It is isolated and dead.

  But note: in training, the weights are updated by the gradient from multiple batches. So each batch affects the weights, which then affect the next batch. So the entire training run is one computation.

  We'll break the procedure into two parts:

  **Part 1: Candidate Identification** (Is this computation a candidate for the register?)
  **Part 2: Attribution** (If yes, which parts of the pipeline are we attributing the welfare-relevance to?)

  ---

  **Part 1: Candidate Identification**

  We ask the following questions in order. If at any point we get a "no", we stop and the system is off the register. If we get to the end and it's a candidate, we proceed to Part 2.

  **Question 1: Does the system output tokens, images, or actions that will be consumed by a human or an automated system that we know directly affects human welfare?**  
  *Sufficient answer:* Yes, if the outputs are used in a way that can influence human decisions, experiences, or well-being (e.g., a chatbot, a content recommendation, an automated decision system).  
  *Unknown:* If we don't know the deployment context. Then we must get clarity.  
  *Termination:* If no, then off the register.  
  *Note:* This includes outputs that are used by other systems that then affect humans. But if the outputs are never used (like dead computation) then it's no.  
  *Moral criterion:* We care about computations that have a direct or indirect causal pathway to human welfare. What it ignores: computations that are purely internal and never affect anything outside.

  **Question 2: Is the system's behavior non-trivial and non-transparent?**  
  *Sufficient answer:* Yes, if the system's outputs are not easily predictable by the engineers (i.e., they are emergent from the scale and complexity of the model) and we cannot fully explain why it outputs what it does.  
  *Unknown:* If we are unsure about the predictability or explainability.  
  *Termination:* If no (e.g., a simple rule-based system), then off the register.  
  *Moral criterion:* We are concerned about systems that might cause unintended harm due to their opacity and complexity. What it ignores: systems that are simple and predictable, even if they affect welfare.

  **Question 3: Does the system have persistent state that is updated during operation and affects future outputs?**  
  *Sufficient answer:* Yes, if the system has weights, memory, or a database that is updated during operation and that update affects how it processes future inputs.  
  *Unknown:* If the state update mechanism is unclear.  
  *Termination:* If no (e.g., a stateless model with fixed weights), then we skip to Question 5.  
  *Moral criterion:* We care about systems that learn or adapt over time because they might develop behaviors that we didn't anticipate at launch. What it ignores: systems that are static after deployment.

  **Question 4: Does the state update depend on inputs that are not fully controlled by the operator?**  
  *Sufficient answer:* Yes, if the state is updated based on user interactions or real-world data that we don't curate.  
  *Unknown:* If the source of update data is unclear.  
  *Termination:* If no (e.g., the update is only from a fixed, vetted dataset), then we skip to Question 5.  
  *Moral criterion:* We are concerned about systems that are updated by uncontrolled inputs because they might be influenced by malicious or unexpected data. What it ignores: systems that update only in controlled, safe environments.

  **Question 5: Is there a non-negligible risk that the system's outputs or updates could cause harm that is both severe and hard to reverse?**  
  *Sufficient answer:* Yes, if there is a plausible scenario (even if unlikely) where the system causes significant harm (e.g., discrimination, physical harm, psychological harm) and that harm is hard to undo. We must consider both immediate and long-term effects.  
  *Unknown:* If we lack the domain knowledge to assess risk. Then we must consult an expert.  
  *Termination:* If no, then off the register.  
  *Moral criterion:* We care about preventing irreversible and severe harms. What it ignores: minor, reversible, or implausible harms.

  If we answer yes to Questions 1 and 2 and either (a) we answered no to Question 3 or 4 and then yes to Question 5, or (b) we answered yes to both 3 and 4 and then yes to 5, then the system is a candidate for the register.

  But note: if the system has persistent state that updates (yes to 3) and that update is from uncontrolled inputs (yes to 4), then we are more concerned. However, even without state updates, a static system might cause harm (hence Question 5).

  Now, if we have a candidate, we proceed to:

  **Part 2: Attribution**

  We need to identify the minimal computational unit that is welfare-relevant. We use the Computational Unity Test (CUT) to bound the computation.

