  We'll split attribution into two types:
  - **Training attribution:** The computation that produced the model weights (if the weights are welfare-relevant).
  - **Serving attribution:** The computation that runs the model on a particular input (if the serving process itself updates state that affects future inputs).

  But in many cases, serving is stateless. Then the welfare-relevance is entirely due to the training.

  So in Part 2:

  **Step A: Identify the source of welfare-relevance.**
  - If the system has persistent state that is updated during operation (and that update is welfare-relevant), then the serving process itself is welfare-relevant and we attribute to the running system (which includes the state updates).
