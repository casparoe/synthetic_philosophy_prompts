prompt: |-
  I work on a small internal governance group that has to write the value-specification section of a frontier model's deployment spec, and our group has drifted into using one analogy for everything. We say that an aligned system should be neutral among competing conceptions of the good in roughly the way a liberal state is supposed to be: it should not take sides on what makes a life go well, it should supply the framework within which individuals and communities pursue their own ends, and the only commitments it may enforce are the ones required to keep that framework standing. The analogy carries our working conclusion, which is that we never have to answer "whose values?" substantively. Aggregate only over what everyone could be given reason to accept, restrict the model's shared layer to that thin overlap, push the contested thick material downstream into per-user or per-deployment configuration, and the question dissolves into procedure.

  I want that analogy audited rather than endorsed or dismissed. Please do the following.

  Set out the correspondence explicitly: for each element of the liberal-state picture — the demos, territory and borders, citizenship, elections and other authorization mechanisms, the monopoly on legitimate coercion, the coercion-justification link that neutrality is supposed to answer, constitutional essentials versus ordinary legislation, public reason, the public/private distinction, the assumption that citizens can revise their own ends — say what, if anything, plays that role for a deployed model, and mark each mapping as clean, strained, or broken, with the reason in one line. Then identify the features the analogy quietly imports: things true of the source that the target does not have, and that are doing work in the argument rather than sitting inert. For this particular use I suspect the load-bearing ones include these, but tell me if I have the emphasis wrong:

  - A state's demos is bounded and persists across generations, and its authorization comes from that demos. A model's affected set is not a demos: it includes people who never opted in, people in jurisdictions with no input into our process, future people, and arguably nonhuman animals. Neutrality was a requirement about justifying coercion to those subject to it; that structure has no obvious counterpart when "being subject to" means being foreseeably affected by an output.
  - A model's outputs feed back into the values it later aggregates. State neutrality is supposed to leave the distribution of conceptions of the good to the citizens; a system that is neutral with respect to current输入 can still systematically reshape what people come to want, so neutrality here may fail to conserve the very thing it is supposed to leave alone.
  - A state must give one answer over one territory; a model can disaggregate. If each user can have their own value-profile, the framework/ends distinction that neutrality runs on may not have a fixed reference, and "letting users choose" may itself be a thick default rather than the absence of one.
  - The thin-overlap fallback may not be thin, may be empty or unstable, and may simply be the values of whoever we happened to sample. Neutrality among conceptions of the good is not the same as the intersection of the conceptions of the good actually on offer.
  - Neutrality and aggregation pull against each other. Voting-style aggregation produces winners and losers; neutrality is meant to avoid producing either. Our spec currently tries to do both, and I want to know whether that is incoherent or merely in tension.

  Then audit the conclusion. Does "we never have to answer whose values" survive once the disanalogies are on the table? If it does not, say exactly which premise the analogy was carrying.

  I also want you to adjudicate, using the audit, between four live options for the spec, rather than just describing them:

  1. Thin neutrality: shared layer restricted to the overlap, everything thick pushed downstream.
  2. Stake-weighted aggregation of thick values, where weight tracks how much a party is foreseeably affected rather than whether they are a user.
  3. Meta-aggregation: don't aggregate the values at all, aggregate the aggregation rule, chosen under a veil of ignorance about which value-profile one will end up having — a constitutional-level move that borrows the impartiality intuitions behind both Rawlsian and contractarian arguments.
  4. Radical disaggregation: per-user value-profiles with a minimal shared floor.

  Option 3 is our own invention and is the one I care about most. Does the liberal-neutrality analogy actually support moving the choice up to the constitutional level, or does that move presuppose a determinate demos at exactly the point where the analogy was supposed to relieve us of needing one?

  Work two concrete cases through whichever option you think strongest. First: a user asks the model for ordinary dietary and consumer advice, where the model must pick a default about how much moral weight nonhuman animals get. Second: a manager asks the model to help draft a workplace policy that will bind employees who never chose and never used the system. For each, say what the neutrality analogy prescribes, where the prescription runs out, and what your preferred option does instead.

  Finally, propose a better analogy if there is one — something that captures what is actually being done to affected parties without importing a bounded demos and a coercion monopoly. Candidates we have floated are a common carrier, a public utility, a professional fiduciary such as a physician or trustee, and a standards body; take these seriously or replace them, but say what each would license that neutrality does not, and what it loses.

  I don't want citations or a literature review — I want the argument, and I want it anchored to mechanisms we actually have available: system-level defaults, per-user personalization, jurisdiction-specific deployments, access tiers, and an internal oversight board.

  Return your answer as a single JSON object with exactly these fields:

  - "correspondence": array of objects with keys "liberal_state_element", "ai_system_element", "mapping" (one of "clean", "strained", "broken"), "reason"
  - "imported_features": array of objects with keys "feature", "in_source" (true/false), "in_target" (one of "yes", "partly", "no"), "work_it_does"
  - "load_bearing_disanalogies": array of objects with keys "disanalogy", "premise_undermined", "severity" (one of "fatal", "serious", "contained")
  - "inert_disanalogies": array of objects with keys "disanalogy", "why_it_does_not_matter"
  - "conclusion_audit": object with keys "conclusion", "survives" (one of "yes", "partly", "no"), "premise_the_analogy_was_carrying", "what_would_support_it"
  - "option_scores": array of objects with keys "option" (1-4), "verdict", "strongest_point", "fatal_or_serious_problem", "ranking" (1-4, no ties)
  - "option_3_assessment": object with keys "supports_constitutional_move" (true/false), "argument_for", "argument_against", "verdict", "repair_suggestion"
  - "worked_cases": array of objects with keys "case", "what_neutrality_prescribes", "where_it_runs_out", "what_preferred_option_does"
  - "better_analogy": object with keys "candidate", "correspondence", "what_it_licenses", "what_it_loses", "why_better_than_neutrality"
  - "residual_questions": array of strings, the questions the audit shows we still have to answer empirically or politically before the spec can be written
reasoning: |-
  We are given a detailed query about auditing an analogy between liberal state neutrality and AI system value specification. The task is structured into several parts, each requiring specific outputs in JSON format. We'll address each part step by step.

  ### 1. Correspondence between liberal state elements and AI system elements
  We map each element of the liberal state to an analogous element in the AI system, and rate the mapping as clean, strained, or broken, with a one-line reason.

  - **Demos**: The citizen body. In AI, the "affected set" (all individuals and entities affected by the model). Mapping: **broken** because the affected set is unbounded, non-consenting, and includes non-users, future generations, and non-humans, unlike a demos which is bounded and consenting.
  - **Territory and borders**: The physical or jurisdictional boundaries. In AI, the "deployment scope" (where the model is used). Mapping: **strained** because deployment can be global and digital, without clear borders, but we can define scope by access controls or geofencing.
  - **Citizenship**: Legal membership in the state. In AI, "user status" (e.g., registered users). Mapping: **broken** because affected parties include non-users and non-humans who are not "citizens" of the system.
  - **Elections and authorization mechanisms**: How the state is legitimized (e.g., voting). In AI, "governance processes" (e.g., oversight board, user feedback). Mapping: **broken** because there is no democratic process for all affected parties to authorize the system.
  - **Monopoly on legitimate coercion**: The state's exclusive right to use force. In AI, the model's "output authority" (its influence on decisions). Mapping: **broken** because the model doesn't have a monopoly; its outputs are persuasive but not coercive in the legal sense, and other forces (e.g., laws, market) exist.
  - **Coercion-justification link that neutrality answers**: Neutrality justifies coercion to citizens. In AI, "output justification" (why the model's outputs are acceptable). Mapping: **broken** because the model's outputs are not coercive in the same way state actions are (e.g., laws backed by force).
  - **Constitutional essentials vs ordinary legislation**: Fundamental vs changeable rules. In AI, "system-level defaults vs per-user configurations". Mapping: **clean** because the shared layer (constitutional) and downstream configurations (ordinary) parallel this distinction.
  - **Public reason**: Justifications acceptable to all citizens. In AI, "shared layer values" (the overlapping consensus). Mapping: **strained** because the shared layer is based on actual user values, not necessarily public reason that all could accept.
  - **Public/private distinction**: State regulates public sphere, leaves private alone. In AI, "system outputs vs user customization". Mapping: **clean** because the system enforces shared rules (public) and allows user-specific settings (private).
  - **Citizens can revise their own ends**: Autonomy to change life plans. In AI, "user control over settings". Mapping: **strained** because users can adjust their profiles, but affected non-users and future generations cannot.

  ### 2. Imported features
  Features true in the source (liberal state) but not fully in the target (AI system), and doing work in the argument.

  - **Feature**: Bounded demos with consent. **In source**: true. **In target**: no. **Work it does**: Provides legitimacy for neutrality; without it, neutrality doesn't resolve the "whose values" question.
  - **Feature**: Coercion is exclusive and requires justification. **In source**: true. **In target**: no (outputs are not coercive). **Work it does**: Neutrality is a response to the need to justify coercion; without coercion, the analogy loses its force.
  - **Feature**: Stable and persistent demos. **In source**: true. **In target**: no (affected set changes). **Work it does**: Allows for long-term social contracts; without stability, the overlapping consensus may shift arbitrarily.
  - **Feature**: Clear territorial jurisdiction. **In source**: true. **In target**: partly (deployment scope can be defined, but often global). **Work it does**: Defines the set of people to whom neutrality applies; without clear borders, the set is ambiguous.
  - **Feature**: Citizens can participate in authorization. **In source**: true. **In target**: no (affected parties don't all participate). **Work it does**: Makes neutrality democratically legitimate; without participation, the system is imposed.

  ### 3. Load-bearing disanalogies
  These are the disanalogies that undermine the premise of the argument.

  - **Disanalogy**: The affected set is not a bounded demos. **Premise undermined**: That neutrality can avoid answering "whose values" by relying on a democratic foundation. **Severity**: fatal.
  - **Disanalogy**: Model outputs reshape future values. **Premise undermined**: That neutrality conserves the distribution of conceptions of the good. **Severity**: serious.
  - **Disanalogy**: Disaggregation is possible (per-user settings). **Premise undermined**: That the framework/ends distinction provides a fixed reference. **Severity**: contained (it changes the nature of neutrality but doesn't break it entirely).
  - **Disanalogy**: The thin overlap may be arbitrary. **Premise undermined**: That the thin overlap is a legitimate neutral basis. **Severity**: serious.
  - **Disanalogy**: Aggregation and neutrality conflict. **Premise undermined**: That we can aggregate values while remaining neutral. **Severity**: serious.

  ### 4. Inert disanalogies
  Disanalogies that don't affect the argument.

  - **Disanalogy**: The state has a monopoly on violence; the AI system does not. **Why it does not matter**: The key point is about justification of influence, not the monopoly itself, so this difference is not central to the neutrality argument.
  - **Disanalogy**: States have physical territory; AI systems are digital. **Why it does not matter**: The concept of jurisdiction can be adapted to deployment scope without changing the core idea.

  ### 5. Conclusion audit
  The conclusion is: "We never have to answer 'whose values?' substantively."

  - **Conclusion**: As stated.
  - **Survives**: no.
  - **Premise the analogy was carrying**: That the overlapping consensus of a bounded demos provides a procedural escape from substantive value choices.
  - **What would support it**: If the affected set were a consensual, bounded demos with a stable overlapping consensus and no feedback effects.

  ### 6. Option scores
  We score the four options.

  - **Option 1 (Thin neutrality)**: 
    - **Verdict**: Flawed due to disanalogies (thin overlap may be arbitrary or unstable).
    - **Strongest point**: Avoids imposing thick values.
    - **Fatal or serious problem**: Thin overlap may be empty or biased, and non-users are ignored.
    - **Ranking**: 3.

  - **Option 2 (Stake-weighted aggregation)**:
    - **Verdict**: Addresses the unbounded affected set but faces practical challenges.
    - **Strongest point**: Weights by impact, not just user status.
    - **Fatal or serious problem**: Difficult to measure stakes and aggregate conflicting thick values.
    - **Ranking**: 2.

  - **Option 3 (Meta-aggregation)**:
    - **Verdict**: Most promising; uses veil of ignorance for impartiality.
    - **Strongest point**: Avoids bias by not knowing one's position.
    - **Fatal or serious problem**: Still requires a defined group to enter the veil (the demos problem remains).
    - **Ranking**: 1.

  - **Option 4 (Radical disaggregation)**:
    - **Verdict**: Maximizes user choice but ignores non-users and collective effects.
    - **Strongest point**: Avoids imposing values on users.
    - **Fatal or serious problem**: Fails when outputs affect non-users (e.g., workplace policy).
    - **Ranking**: 4.

  ### 7. Option 3 assessment
  - **Supports constitutional move**: True, but with a caveat.
  - **Argument for**: The veil of ignorance provides impartiality, so the aggregation rule chosen would be fair.
  - **Argument against**: Without a bounded demos, who is behind the veil? The analogy doesn't relieve us of defining the affected set.
  - **Verdict**: The analogy partly supports the move but fails at the demos definition.
  - **Repair suggestion**: Define the affected set for the veil of ignorance as all foreseeable stakeholders, and use empirical data to model their interests.

  ### 8. Worked cases
  - **Case 1: User asks for dietary advice (animal moral weight)**:
    - **What neutrality prescribes**: Default to thin overlap (e.g., minimal animal welfare standards), let user customize.
    - **Where it runs out**: If the thin overlap is empty or contested, it fails.
    - **What preferred option (3) does**: Use the meta-aggregation rule (chosen under veil of ignorance) to set a default that balances animal welfare and human preferences, allowing user override.

  - **Case 2: Manager drafts workplace policy affecting non-users**:
    - **What neutrality prescribes**: The policy should be neutral, but non-users have no say, so it defaults to the thin overlap or manager's settings.
    - **Where it runs out**: Non-users are subject to the policy without consent.
    - **What preferred option (3) does**: The meta-aggregation rule would require including non-users' interests (via stakeholder representation) in the policy draft, perhaps through a fairness constraint.

  ### 9. Better analogy
  - **Candidate**: Professional fiduciary (e.g., a physician or trustee).
  - **Correspondence**: The AI system acts as a fiduciary for the user and affected parties, with duties of loyalty and care.
  - **What it licenses**: Prioritizing the interests of the affected parties, even without consent, and allowing for expert judgment in balancing competing interests.
  - **What it loses**: The strict neutrality of the state; it permits substantive value decisions in the interest of the beneficiary.
  - **Why better than neutrality**: It directly addresses the asymmetry of power and the vulnerability of affected parties without requiring a demos or coercion.

  ### 10. Residual questions
  - How to define the set of stakeholders for the veil of ignorance in meta-aggregation?
  - How to measure and weigh stakes in option 2?
  - How to ensure feedback effects do not undermine the thin overlap in option 1?
  - How to handle non-human and future stakeholders in any option?
  - What is the minimal shared floor in option 4 for non-user impacts?

  Now, we compile the answer as a single JSON object.
