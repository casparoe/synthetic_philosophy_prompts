prompt: |-
  I work at a small philanthropic fund — four program officers, maybe thirty grants a year — and increasingly the proposals we get are the kind where the whole case rests on a small probability of an enormous payoff: shave weeks off detection of something that goes global, shift how a field thinks about risky technology, keep a capability out of the wrong hands. The problem isn't that the numbers are made up (though sometimes). It's that when we actually try to compute an expected value, the thing is Pasadena-style: a fair coin until heads, payoffs growing fast enough that the sum over outcomes either doesn't converge or converges to different values depending on what order you add the terms in. So the "expected value" isn't a number, and comparing two such proposals by expected value is meaningless. In practice people here either squint at the upside and fund it, or get spooked and retreat to "well, what's the median outcome" — and both moves feel like giving up.

  So what I want is a decision procedure my team can actually run on a proposal, in a couple of hours, in a spreadsheet, by someone whose math stops at arithmetic and maybe a percentile function. The questions to ask, in order. What counts as a sufficient answer to each. Where the procedure stops with a no and the proposal goes back to the applicant for more work. Where it hands the decision to a person because what's left is a values question and not a factual one. It also has to survive being shown to our board, and it should be honest about which steps are judgment calls dressed up as procedure.

  A few things I've been kicking around that you should feel free to use, scrap, or improve on:

  - a reversed-sum instability check: compute the expectation summing from the biggest payoff down, then from the smallest up, and if the sign flips, flag the proposal as unstable rather than trying to rank it
  - truncating the proposal and a fixed baseline (just give the same money to a boring, well-measured program) at the same payoff ceiling T, and asking whether the proposal beats the baseline at every T from 10x to 10^12x the baseline's own value — dominance across horizons instead of one number
  - making the applicant state a tail exponent, and refusing to rank anything whose verdict swings on the difference between an exponent of 0.9 and 1.1
  - a credibility ceiling: zero weight on any outcome whose probability is smaller than my own confidence that the model producing it isn't nonsense

  Then run it on three live cases. (1) A $2M grant for a genomic surveillance network for novel respiratory pathogens, where essentially all the value sits in a roughly one-in-a-thousand chance of catching something early. (2) A $2M grant to a well-measured cash-transfer-type program with boring, honestly estimated returns. (3) A $400k grant to rewrite a mid-size computer science department's curriculum so that safety norms get into the bones of the field, where nobody can bound the tail at all.

  I expect the procedure to tell me something I won't like about case 3, and that's kind of the point of asking. Also say plainly what it can't do — which comparisons it has to just refuse, and where you'd rather we recieve outside help than trust the output.
reasoning: |-
  We are facing proposals with heavy-tailed distributions where expected value may not converge or may be unstable. We need a practical, spreadsheet-friendly decision procedure that acknowledges mathematical limitations and incorporates judgment calls transparently.

  The procedure should:
  - Be executable by someone with basic math skills (arithmetic, percentiles).
  - Take a couple of hours per proposal.
  - Use a spreadsheet.
  - Clearly indicate when to reject, when to ask for more work, and when to hand off to human judgment.
  - Be defensible to the board, with honesty about judgment calls.

  Proposed ideas to incorporate:
  1. **Reversed-sum instability check**: Compute expected value by summing from largest to smallest payoff and then from smallest to largest. If the sign flips (or if the two sums are very different relative to the scale), flag as unstable.
  2. **Dominance across horizons**: Compare the proposal to a fixed baseline (e.g., a boring cash transfer program) by truncating both at a payoff ceiling T. Check if the proposal dominates the baseline for a range of T (e.g., from 10x to 10^12x the baseline's value). This is about robustness across different levels of risk tolerance.
  3. **Tail exponent requirement**: Require the applicant to state a tail exponent (or at least a range) and avoid ranking proposals that are sensitive to small changes in the exponent (e.g., between 0.9 and 1.1). This is because the tail behavior is critical for convergence.
  4. **Credibility ceiling**: Assign zero weight to outcomes with probability lower than our confidence in the model. For example, if we are only 90% confident that the model isn't nonsense, then we ignore outcomes with probability less than 10%.

  We'll design a step-by-step procedure that uses these ideas. The steps:

  **Step 1: Basic Feasibility Check**
     - Does the proposal clearly state the problem, the intervention, and the chain of causation? If not, reject and ask for more work.
     - Does it provide a breakdown of possible outcomes with at least rough probabilities and payoffs? If not, reject and ask for more work.

  **Step 2: Expected Value with Reversed-Sum Check**
     - Ask the applicant to provide a list of outcomes (at least 3, but ideally more) with:
          - Payoff (in comparable units, e.g., lives saved, dollars of equivalent benefit)
          - Probability of each outcome (must sum to 1)
     - Compute the expected value (EV) in the standard way: sum(p_i * x_i).
     - Compute EV by sorting the outcomes by payoff in descending order and summing (call this EV_desc).
     - Compute EV by sorting in ascending order and summing (EV_asc).
     - If EV_desc and EV_asc differ by more than a factor of 2 (or if one is positive and the other negative), then flag as "unstable EV" and move to Step 3. Otherwise, if the EV is positive and the project is cost-effective (EV > cost), proceed to Step 5. If EV is negative, reject.

  **Step 3: Tail Exponent and Stability Check (for unstable EV cases)**
     - Ask the applicant to provide the tail exponent (if they haven't) or to describe the tail behavior. If they cannot, then we must rely on our own assessment (but note: this is a judgment call).
     - We require the tail exponent to be at least 1.1 (so that the expected value converges) and to be stated with a confidence interval. If the exponent is below 1.1, then the expected value does not converge and we must use an alternative method (go to Step 4). If they provide an exponent above 1.1, then we can compute the EV using a truncated distribution (see Step 4) but note that the tail is still heavy and we must check dominance.

  **Step 4: Dominance Across Horizons (for heavy tails)**
     - We compare the proposal to a fixed baseline (e.g., a cash transfer program with known, fixed returns). Let the baseline have a known payoff B (for example, $0.50 per dollar spent in terms of social good, so for a $2M grant, baseline payoff = $1M).
     - We consider a range of truncation levels T (payoff ceilings). We'll choose T values that are multiples of the baseline payoff: e.g., T = 10 * B, 100 * B, 10^3 * B, ..., up to 10^12 * B.
     - For each T:
          - Truncate the proposal: set any outcome with payoff above T to T. Then compute the expected truncated payoff (ETP) for the proposal.
          - The baseline's truncated payoff is min(B, T) = B (since B is fixed and we are considering T much larger than B).
          - Compute the net benefit of the proposal over the baseline: (ETP - B) * (scale factor) [if the proposal has a different cost, adjust accordingly. In our examples, we assume same cost for simplicity, but if not, we need to normalize by cost. We assume we are comparing at the same funding level.]
          - Note: Since we are truncating, we are effectively computing the expected value under a bounded utility function.
     - If the proposal dominates the baseline at every T (i.e., ETP >= B for every T, and strictly greater for at least one T), then the proposal is robustly better. If it is worse at every T, then it's worse. If it crosses, then we have a problem: the decision depends on the level of risk aversion (truncation level). In that case, we may need to make a judgment call (go to Step 6).

  **Step 5: Credibility Ceiling**
     - We assign a confidence level to the model (from 0 to 100%). This is a judgment call by the program officer. For example, if we are 90% confident in the model, then we set a credibility threshold of 10% (i.e., outcomes with probability < 10% are set to zero).
     - Adjust the probabilities: renormalize the probabilities of the remaining outcomes and recompute the expected value (or the truncated expectations from Step 4) without the low-probability outcomes.
     - Check if the conclusion changes (e.g., from positive to negative). If it does, then note that the result is sensitive to the credibility threshold. This might lead to a rejection or a call for more robustness.

  **Step 6: Human Judgment**
     - If after these steps we still don't have a clear answer (e.g., dominance is mixed, or the tail exponent is too uncertain, or the credibility adjustment changes the result), then we hand it over to human judgment. We document the reasons and let the program officer and team decide based on the organization's values and risk tolerance.

  **Summary of Steps in Order:**
  1. **Feasibility Check**: If missing basics, reject and ask for more.
  2. **Stable EV Check**: Compute EV in two orders. If stable and positive, proceed to Step 5. If unstable, go to Step 3.
  3. **Tail Exponent Check**: Require tail exponent. If exponent >=1.1 and known with confidence, then use truncated EV (Step 4) and proceed. If exponent <1.1 or unknown, go to Step 4 without the expectation of convergence (so we rely on dominance).
  4. **Dominance Across Horizons**: Compare to baseline over a range of T. If robust dominance, proceed to Step 5. If robustly worse, reject. If mixed, go to Step 6.
  5. **Credibility Adjustment**: Apply the credibility ceiling and recompute. If still positive (or dominant) then recommend funding. If not, reject or go to Step 6.
  6. **Human Judgment**: When the procedure is inconclusive.

  **What the procedure cannot do:**
  - It cannot assign a single number to the expected value of a proposal with a very heavy tail (exponent <=1) and then compare it to another such proposal. In that case, we must rely on dominance (if one dominates the other across all T) or on human judgment.
  - It cannot replace expert judgment when the tail behavior is unknown or the model is highly uncertain. We are explicit about these limitations.

  Now, let's run the three cases:

  **Case 1: Genomic surveillance network ($2M grant)**
  - Outcomes: 
     - High probability (say 99.9%) of no pandemic -> payoff 0 (or small).
     - Low probability (0.1%) of catching a pandemic early -> huge payoff (say, saving millions of lives, equivalent to $X billion).
  - Step 1: Assume it passes.
  - Step 2: 
     - Standard EV = 0.999*0 + 0.001 * X billion = 0.001 * X billion.
     - But if X is very large (say, in the trillions) then the EV might be positive and large. However, note that there might be more outcomes (e.g., partial success). Let's assume the applicant has provided a more detailed breakdown? 
     - But if they haven't, we might have to ask for more. However, for this example, let's assume they have two outcomes. Then EV_asc and EV_desc will be the same (only two outcomes). So it's stable. If EV is positive and greater than the baseline (say, the baseline is $1M for $2M spent), then we go to Step 5.
     - However, note: what if X is so large that we are in a heavy tail? We might need to check the tail exponent. But with two outcomes, the tail exponent is undefined? Actually, we have a point mass at X. So we can consider the tail exponent as infinite? Then we skip Step 3.
  - Step 4: We skip because Step 2 was stable and positive.
  - Step 5: Credibility ceiling. We note that the 0.1% outcome is a tail event. If our confidence in the model is 90%, then we set a threshold at 10%. Since 0.1% < 10%, we set the probability of the big payoff to zero. Then the EV becomes 0. This is a problem. So we must decide: is the model for the tail event credible? 
     - We might adjust: if we have 90% confidence in the model, then we are 10% unsure. But the tail event is 0.1%, which is below 10%, so we zero it out. Then the project becomes worthless. 
     - Alternatively, we might not zero out the entire event but discount its probability by our confidence. This is a judgment call. The procedure says "zero weight", so we set it to zero. Then we reject? 
     - But note: the procedure in Step 5 says to renormalize. So we have only the non-tail outcome: 100% chance of 0. Then EV=0. 
     - The baseline, however, has a fixed return. So without the tail, the project is worse than the baseline. 
     - Therefore, we reject? 

  This is a problem because the entire value is in the tail. We must then rely on human judgment (Step 6). The program officer might say: "Even though the probability is below our credibility threshold, we have external reasons to believe in this tail event." Then we fund it. But the procedure flags it.

  Alternatively, we might adjust the credibility threshold. If we are 99.9% confident in the model, then the threshold is 0.1%, and the 0.1% outcome is kept. Then the EV is positive. So the confidence level is critical.

  **Case 2: Cash transfer program ($2M grant)**
  - Outcomes: Well-measured, boring. Say, with 95% probability, return $1.1M in social good, and 5% chance of $0.8M. Then EV = 0.95*1.1M + 0.05*0.8M = 1.085M.
  - Step 1: Pass.
  - Step 2: EV_asc and EV_desc are the same. EV> baseline (which we set as $1M for $2M spent, so this project returns about $1.085M, which is above baseline). Then go to Step 5.
  - Step 5: Credibility ceiling. The probabilities are well-measured, so we are highly confident. Suppose we set confidence at 99%. Then threshold=1%. The outcomes are above 1% (95% and 5%), so we keep both. Then the project still has positive EV. We fund.

  **Case 3: Curriculum rewrite ($400k grant)**
  - Outcomes: Hard to bound the tail. The applicant might provide a range of outcomes, but the tail is very heavy and unknown.
     - Example: 
          - 80% chance: no impact (payoff 0)
          - 15% chance: minor impact (say, 100 students per year learn safety, leading to small improvements) -> payoff X
          - 4.9% chance: moderate impact (field shifts slightly) -> payoff 10X
          - 0.1% chance: major impact (field shifts substantially, preventing a catastrophe) -> payoff 10000X
     - But the tail is unbounded? The applicant might not be able to bound it.
  - Step 1: They provide a breakdown, but note the tail is not bounded. We might ask for more, but they cannot. So we proceed.
  - Step 2: 
     - EV = 0.8*0 + 0.15*X + 0.049*10X + 0.001*10000X = 0.15X + 0.49X + 10X = 10.64X
     - But if we sort by payoff: 
          - ascending: 0, X, 10X, 10000X -> same as above
          - descending: 10000X, 10X, X, 0 -> same
     - So stable? But note: the tail event (10000X) is very large. However, the probability is 0.1%. The EV is 10.64X. If we can estimate X, then it might be positive. But the problem is that the tail might be heavier than described? 
  - Step 3: We ask for the tail exponent. The applicant cannot provide one. We must then go to Step 4 to check robustness.
  - Step 4: Compare to baseline. The baseline for $400k: if our baseline is $0.50 per dollar, then baseline payoff = $200k. We need to express the proposal's payoff in the same units. Let's assume X is such that 10.64X is, say, $300k (so the project seems better). But we need to do dominance across T.

     We set T at multiples of $200k (the baseline):
     - T1 = 10 * 200k = $2M
     - T2 = 100 * 200k = $20M
     - T3 = 1000 * 200k = $200M
     - T4 = 10^4 * 200k = $2B, etc.

     For the proposal:
     - At T1 ($2M): 
          - The outcomes: 
               - 0, X, 10X, and 10000X are capped at $2M if they exceed.
          - We need to know the value of 10000X. If 10000X > $2M, then the 0.1% outcome becomes $2M. Otherwise, it remains 10000X.
          - Let's assume X is $10k. Then 10000X = $100M. So at T1=$2M, we cap the $100M to $2M.
          - Then ETP = 0.8*0 + 0.15*10k + 0.049*100k + 0.001*2e6 = 0 + 1.5k + 4.9k + 2k = 8.4k = $8,400.
          - Baseline: $200k.
          - So the proposal's ETP ($8,400) is less than the baseline ($200,000) at T1.

     - At T2=$20M: 
          - Cap at $20M: the $100M outcome becomes $20M.
          - ETP = 0.15*10k + 0.049*100k + 0.001*20e6 = 1.5k + 4.9k + 20k = $26,400.
          - Still less than $200k.

     - At T3=$200M: 
          - $100M is below $200M, so no cap for the big outcome.
          - ETP = 0.15*10k + 0.049*100k + 0.001*100e6 = 1.5k + 4.9k + 100k = $106,400.
          - Still less than $200k.

     - At T4=$2B: 
          - Still no cap (since $100M < $2B)
          - ETP = same as above: $106,400.

     So at every T, the proposal's truncated expected payoff is less than the baseline. Therefore, we reject.

     However, note: we set X=$10k arbitrarily. What if X is larger? Let's say X is $50k. Then:
     - Without truncation: EV = 10.64 * 50k = $532k, which is above the cost $400k and above baseline $200k.
     - But in Step 4:
          - T1=$2M: 
              - Cap the $50k*10000 = $500M at $2M -> ETP = 0.15*50k + 0.049*500k + 0.001*2e6 = 7.5k + 24.5k + 2k = $34k
          - T2=$20M: 
              - Cap at $20M -> ETP = 7.5k + 24.5k + 0.001*20e6 = 7.5k+24.5k+20k = $52k
          - T3=$200M: 
              - $500M is capped at $200M -> ETP = 7.5k+24.5k+0.001*200e6 = 7.5k+24.5k+200k = $232k
          - T4=$2B: 
              - $500M is below $2B -> ETP = 7.5k + 24.5k + 500k = $532k

     So at T3 and T4, the proposal beats the baseline ($200k). But at T1 and T2, it doesn't. Therefore, we have mixed dominance. Then we go to Step 6: human judgment. The program officer must decide: are we more concerned about the worst-case (low T) or are we willing to bet on the tail (high T)?

  **Conclusion for Case 3**: The procedure flags that the project does not robustly dominate the baseline (it depends on T). Therefore, it goes to human judgment.

  **Final Remarks on the Procedure**:
  - It requires the applicant to provide a probability distribution. If they cannot, we reject in Step 1.
  - The tail exponent requirement in Step 3 might be hard for applicants. We might need to help them or use our own experts.
  - The dominance across horizons (Step 4) is computationally feasible in a spreadsheet for a discrete set of outcomes and a set of T values.
  - The credibility ceiling (Step 5) is a critical judgment call. We must document the chosen confidence level and be consistent.
  - The procedure is honest about its limitations: when it cannot compute a stable EV and when dominance is mixed, it hands off to humans.

  We'll now write the procedure in a step-by-step guide format for the team.
answer: |-
  Here's a decision procedure designed for your team's constraints, incorporating your ideas while being executable in a spreadsheet with basic math. It explicitly flags judgment calls and mathematical limitations.

  ---

  ### **Philanthropic Fund Decision Procedure for High-Tail Proposals**
  **Inputs Required from Applicant**  
  1. List of **possible outcomes** (min 3, max 10), including:  
     - **Payoff** (monetized or standardized impact units, e.g., "equivalent lives saved").  
     - **Probability** of each outcome (must sum to 100%).  
  2. **Baseline comparison**: A fixed, well-understood alternative (e.g., "Give $2M to proven cash-transfer program = 100 units of good").  

  **Procedure Steps**  
  *(Run in order; stop if rejection criteria met)*  

  #### **Step 1: Feasibility Gatekeeper**  
  - **Question**: Are probabilities and payoffs provided for all outcomes? Does the causal chain pass the "sniff test"?  
  - **Sufficient answer**: Yes, with no obvious logical flaws (e.g., "detection tech reduces pandemic risk" is plausible; "AI curriculum causes fewer disasters" is vague but acceptable).  
  - **Reject if**: Critical gaps in logic or missing probabilities.  
    - *Output*: "Return to applicant for restructuring."  
  - **Judgment call**: What counts as "obvious flaw" (team discussion required).  

  #### **Step 2: Stability Check**  
  - **Action**:  
    - Calculate expected value (EV) normally: `SUM(Probability × Payoff)`.  
    - Calculate EV_desc: Sort outcomes by payoff *descending*, then cumulative sum.  
    - Calculate EV_asc: Sort by payoff *ascending*, then cumulative sum.  
  - **Reject if**:  
    - EV_desc and EV_asc have **opposite signs** (e.g., EV_desc = +∞, EV_asc = -∞).  
    - EV_desc/EV_asc > 2 or < 0.5 (indicating severe instability).  
  - *Output*: "Unstable EV. Do not rank numerically." → Proceed to Step 4.  
  - **If stable**: Proceed to Step 3.  

  #### **Step 3: Tail Exponent Sanity Check**  
  - **Question**: What is the exponent `α` for the tail (P(payoff > X) ∝ 1/Xᵅ)?  
  - **Sufficient answer**: Applicant provides `α` (e.g., "α ≈ 1.2 for pandemic detection").  
  - **Reject if**:  
    - `α` < 1.1 (EV mathematically undefined).  
    - Applicant cannot state `α` and tail is unbounded (e.g., "we don't know the worst-case outcome").  
  - *Output*: If rejected, "Tail too heavy or undefined. Prioritize other proposals."  
  - **If α ≥ 1.1**: Use standard EV for ranking against baseline.  

  #### **Step 4: Horizon Dominance Test**  
  *(For unstable EV or undefined tail)*  
  - **Action**: Compare proposal to baseline across payoff ceilings (T):  
    - Set T = [10×, 100×, 10⁴×, 10⁶×, 10¹²×] × baseline payoff.  
    - For each T:  
      1. Truncate all payoffs > T to T.  
      2. Compute truncated EV (TEV) for proposal.  
      3. Compute truncated EV for baseline (fixed value, min(T, baseline)).  
    - Example formula: `=MIN(payoff, T)` in spreadsheet.  
  - **Reject if**:  
    - TEV < baseline TEV at **every T**.  
  - **Fund if**:  
    - TEV > baseline TEV at **every T**.  
  - **Inconclusive if**: Mixed results (e.g., wins at high T but loses at low T).  
    - *Output*: "No dominance. Judgment call required." → Proceed to Step 6.  

  #### **Step 5: Credibility Ceiling**  
  - **Action**:  
    - Team assigns a confidence score `C` (0–100%) to the model.  
    - Set credibility threshold = `1 - C` (e.g., 90% confidence → threshold = 10%).  
    - Set payoff = 0 for all outcomes with probability < threshold.  
    - Renormalize probabilities to sum to 100%.  
    - Recompute EV or TEV.  
  - **Reject if**: New EV/TEV < baseline.  
  - **Judgment call**: Confidence score `C` (team must document rationale).  

  #### **Step 6: Human Judgment**  
  - **Inputs**: All prior steps, plus:  
    - Strategic fit (e.g., "Does this align with our mission?").  
    - Moral weights (e.g., "Is preventing extinction 1000× more valuable than poverty alleviation?").  
  - **Output**: Fund/Reject (no numerical justification).  

  ---

  ### **Application to Your Cases**
  #### **Case 1: Genomic Surveillance ($2M)**  
  - **Step 1**: Pass (clear causal chain).  
  - **Step 2**: Stable EV (only two outcomes: no pandemic = $0, early detection = $B). EV = $M positive.  
  - **Step 3**: α ≈ 1.0 (tail risk = 0.1%, payoff ∞). **Rejected** (α < 1.1).  
  - **Step 4**: Horizon dominance test:  
    - Baseline = 100 units (e.g., cash transfers).  
    - At T = 10× baseline (1,000 units): TEV ≈ 0 (tail payoff truncated).  
    - At T = 10¹²× baseline: TEV = 0.001 × T → dominates.  
    - **Verdict**: Mixed → **Judgment call**.  
  - **Step 5**: Credibility ceiling (e.g., C = 85% → threshold = 15%). Tail outcome (0.1% < 15%) → discarded. EV = 0 < baseline. **Reject**.  
  - **Final**: Reject unless overridden in Step 6 (e.g., "We prioritize extinction risk").  

  #### **Case 2: Cash Transfers ($2M)**  
  - **Step 1**: Pass.  
  - **Step 2**: Stable EV (well-defined distribution).  
  - **Step 3**: α > 2 (thin tail). EV > baseline.  
  - **Step 5**: Credibility ceiling: all probabilities > threshold → unchanged.  
  - **Final**: Fund.  

  #### **Case 3: CS Curriculum ($400k)**  
  - **Step 1**: Pass (outcomes described vaguely).  
  - **Step 2**: Stable EV (if outcomes bounded).  
  - **Step 3**: α undefined (applicant can't bound tail) → **Rejected**.  
  - **Step 4**: Horizon dominance test:  
    - Baseline = 20 units (e.g., $400k cash).  
    - At low T (10× = 200 units): TEV ≈ 0 (no low-probability wins).  
    - At high T (10¹²×): TEV depends on unbounded tail → unknown.  
    - **Verdict**: Inconclusive → **Judgment call**.  
  - **Step 5**: Credibility ceiling: Low confidence in model (C ≈ 50%) → threshold = 50%. Discards all low-probability outcomes → EV ≈ 0. **Reject**.  
  - **Final**: Reject.  

  ---

  ### **What This Procedure Can't Do**  
  1. **Compare two heavy-tailed proposals directly**: If both fail Steps 2–4, no mathematical ranking is possible. Use Step 6 (values) or external experts.  
  2. **Handle "unknown unknowns"**: If a proposal has unlisted outcomes (e.g., "potential for bioterror misuse"), the procedure ignores them. Rely on red-team reviews.  
  3. **Resolve tail exponent debates**: Disagreements about α require domain experts (not spreadsheet math).  
  4. **Replace values-based decisions**: E.g., "Should we prioritize a 0.001% chance of saving 1B lives over guaranteed help for 10k people?" is beyond the math.  

  ### **Practical Notes**  
  - **Spreadsheet Time**: 1–2 hours/proposal (mostly data entry and testing T-values).  
  - **Board Transparency**: Label all judgment calls (yellow highlights in spreadsheet), especially:  
    - Confidence score `C` in Step 5.  
    - Strategic/moral weights in Step 6.  
  - **When to Get Help**:  
    - Tail exponent disputes (Step 3).  
    - Mixed dominance (Step 4) where stakes are high.  
    - Proposals involving contested science (e.g., AI risk timelines).  

  This procedure forces rigor on tractable parts (probability math, stability) while isolating untestable claims (tails, model confidence) for human discretion. It likely rejects "unicorn hunting" proposals (Case 3) unless they align deeply with your values—which is the point.
