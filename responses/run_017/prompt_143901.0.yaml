prompt: |-
  I write a weekly column on science and ideas, and the word I fight about most with my editors is "know." I want a house rule I can actually run in the ten minutes before I file, for when a sentence is allowed to say that someone knows something, versus that they believe it strongly, versus that the evidence points to it. Sorry if this is rambly, Im on deadline.

  Here's the machinery I want it built on, since generic hedging advice is useless to me. A Nozick-style tracking picture says roughly two things: sensitivity — if the claim were false, the person wouldn't be believing it — and safety, or adherence — across the nearby ways things could have gone, they'd believe it only if it were true. And tracking doesn't survive entailment: a source can know the sample was contaminated without knowing that the study's headline result is junk, because in the closest world where the result is junk they'd believe it anyway. For a writer that means knowledge claims have a travel distance: every inferential step away from what the source actually tracked has to be paid for again. And it means two claims I'm each allowed to assert separately can't necessarily be asserted together, since a conjunction can fail sensitivity even when both conjuncts pass on their own.

  So: give me the checklist in order, the test at each step, what counts as a yes, where it just stops with a no, and where it hands the call back to a human because it's a values or legal question rather than a tracking one. Then run it on three sentences of the kind I actually write: "the team knows the effect is real" (from one preregistered study with a p-value near the threshold); "the agency knows the water is unsafe, and therefore that the 2019 tests were wrong"; and "we now know X" where the newsroom's belief is assembled out of a reporter's interviews, one anonymous source, and a preprint nobody has replicated. Include at least one case where the honest output is that I can't use the word, even though the sentence would read much better. And flag where the procedure breaks down or quietly assumes what it's meant to test — I'd rather have the seams showing than a tidy rule.
reasoning: |-
  Okay, let me tackle this query from a science columnist on deadline. They're fighting with editors about when to use "know" versus weaker terms, and want a practical checklist based on Nozick's tracking theory. The core tension is scientific accuracy versus readable prose.

  First, I need to grasp what makes this request unique. The writer specifically rejects generic hedging advice - they want operational rules grounded in epistemology (Nozick's sensitivity/safety conditions). Their examples show real pain points: single-study claims, inferential chains ("therefore..."), and institutional knowledge assertions. The deadline pressure means this can't be academic - needs executable steps.

  The key philosophical framework here is Nozick's tracking theory: knowledge requires both sensitivity (if P false, wouldn't believe) and safety (in nearby worlds, only believe if true). But crucially, tracking degrades over inferential distance. This matches the writer's observation about "travel distance" - each logical step needs fresh justification.

  For the checklist, I consider structuring it as a decision tree:
  1. Start with direct evidence assessment - did the source actually observe/measure this?
  2. Then check inferential steps - is each one tracking-preserving?
  3. Finally handle non-epistemic constraints like legal risks.

  Important to include failure modes: where the rule breaks (e.g., values questions) or forces weaker language despite stylistic cost. The three test cases will demonstrate this - especially the "we now know" example which should fail under tracking theory.

  When drafting the response, I'll prioritize:
  - Concrete flowcharts over abstractions
  - Calling out where rules might feel counterintuitive
  - Preserving the writer's epistemological rigor
  - Highlighting tradeoffs between precision and readability

  The water agency example is particularly telling - tracking theory explains why "knows the water is unsafe" might pass while "...therefore knows 2019 tests wrong" fails sensitivity. That distinction captures exactly why this framework matters for science writing.
answer: |-
  Here's your deadline-friendly tracking-based checklist, designed as a binary decision tree with clear exit points. It prioritizes speed and defensibility over philosophical purity, embracing the seams.

  **The "Know" Checklist (Nozick-Tracking Edition)**

  1.  **Direct Tracking Check:**
      *   **Question:** Did the source(s) *directly observe, measure, or experience* the specific claim (P) using reliable methods, such that their belief tracks P's truth?
      *   **Test:** Would the source *definitively stop believing P* if P were false (Sensitivity)? AND, in nearly all plausible similar situations, would they *only believe P if P were true* (Safety/Adherence)?
      *   **Yes:** Proceed to Step 2.
      *   **No:** Use "believe," "argue," "evidence suggests," or similar. STOP HERE. *(E.g., Beliefs based on hearsay, complex models not directly tested, distant inferences)*
      *   **Handoff:** If the reliability of the method itself is in major dispute (e.g., novel technique, contested instrumentation). Flag for editor/review.

  2.  **Inferential Distance Check:**
      *   **Question:** Is the claim P derived *directly and obviously* from the tracked evidence (Q)? Is it a trivial entailment (like "the sample was blue" -> "the sample was colored")?
      *   **Test:** Does the inference *preserve sensitivity and safety*? Specifically: If P were false, would the source *necessarily stop believing Q or see the contradiction immediately*? AND, in nearby worlds where P is false, is Q *also likely false or the source likely aware of the conflict*?
      *   **Yes (Trivial Inference):** You *can* say "knows P". Proceed to Step 3.
      *   **No (Non-Trivial Inference):** Use language reflecting the evidence ("knows Q, which strongly implies P," "concludes P based on Q," "evidence points to P"). STOP HERE. *(This is the "travel distance" cost - pay it with language.)*
      *   **Handoff:** If the inference involves complex logic, counterfactuals, or disputed background assumptions. Flag for review.

  3.  **Conjunction Check (Only if asserting a compound claim "P and R"):**
      *   **Question:** Are you asserting *both P and R together* in a single knowledge claim?
      *   **Test:** Does the *conjunction* pass Sensitivity? Specifically: In the *closest possible world* where the conjunction "P and R" is false, would the source *definitively not believe the conjunction*? (This often fails if only one conjunct is false in that close world and the source wouldn't detect the single falsehood).
      *   **Yes:** You *can* say "knows P and R". Proceed to Step 4.
      *   **No:** State knowledge claims separately ("knows P" and "knows R") OR weaken the conjunction ("knows P and has established R," "knows P and the evidence shows R," "knows both propositions individually"). STOP HERE. *(The tracking doesn't "add" like that.)*
      *   **Handoff:** If the falsity of the conjunction depends on complex interactions between P and R.

  4.  **Context & Risk Check:**
      *   **Question:** Is there high legal, reputational, or significant ethical risk if P turns out false *even if tracking holds*? OR, is the claim about subjective experience or values?
      *   **Test:** Would asserting "knows P" here expose us to unreasonable liability or misrepresent a fundamentally non-factual claim?
      *   **Yes:** Use weaker language ("is confident," "asserts," "evidence conclusively shows") regardless of tracking. STOP HERE.
      *   **No:** You can use "knows P". Proceed to Step 5.
      *   **Handoff:** Always. This is inherently values/legal. Briefly note risk level for editor (e.g., "Tracking passes, but high-risk claim re: public safety").

  5.  **Editorial Sanity Check (The 10-Second Gut Check):**
      *   **Question:** Does using "know" here feel *excessively jarring or potentially misleading to a careful reader*, even if the tracking tests pass?
      *   **Test:** None. Your call as the writer. If yes, consider weaker language. If no, file with "know".

  **Running the Test Cases:**

  1.  **"The team knows the effect is real" (from one preregistered study, p-value near threshold)**
      *   **Step 1 (Direct Tracking):** Did they *directly track "effect is real"*? Preregistration helps safety (reduces researcher degrees of freedom), but p~0.05 *fails sensitivity badly*. In the *closest world* where the effect is NOT real (but random noise produced a borderline significant result), they'd likely *still believe it* due to the p-value. **NO.** -> Use "the team reports the effect is real," "their study suggests the effect is real," or "they believe the effect is real based on their study." *STOP. (Honest output: Can't use "know". Tracking fails at Step 1, sensitivity broken.)*

  2.  **"The agency knows the water is unsafe, and therefore that the 2019 tests were wrong"**
      *   **Part 1: "knows the water is unsafe"**
          *   **Step 1:** If the agency conducted rigorous, recent, reliable tests *directly* showing contamination exceeding safety limits, this *could* pass (Sensitivity: If water *were* safe, their tests wouldn't show unsafe levels; Safety: Reliable methods mean nearby worlds likely get the same result). Assume **YES**. Proceed.
          *   **Steps 2-4:** "Water is unsafe" is direct result of their testing. Low inference distance. Assume low risk here. **YES to "knows water is unsafe".**
      *   **Part 2: "therefore that the 2019 tests were wrong"**
          *   **Step 1:** Did the agency *directly track* that the 2019 tests *were wrong*? No. They tracked *current* water state. **NO** for direct tracking of "2019 tests wrong". -> Must proceed via inference from "water is unsafe".
          *   **Step 2 (Inferential Distance):** Inference: "Water unsafe now" implies "2019 tests (which said safe) were wrong." Does this inference *preserve sensitivity?* **NO.** In the *closest world* where the 2019 tests *weren't* wrong, the water *could have become unsafe later* (e.g., contamination event in 2020). In that close world, the agency *still knows the water is unsafe now* and would *still believe the 2019 tests were wrong* based on that current knowledge. They *wouldn't stop believing the 2019 tests were wrong* just because the water became unsafe later. Sensitivity for the inference fails. -> Use language like: "knows the water is unsafe, indicating the 2019 tests were likely wrong or conditions have changed." *STOP after Step 2 for the inference.* **Cannot use "know" for the 2019 tests being wrong.**

  3.  **"We now know X" (Newsroom: reporter interviews, one anonymous source, unreplicated preprint)**
      *   **Step 1 (Direct Tracking):** Who is "we"? The newsroom. Did the newsroom *directly track X*? No. Their belief is assembled from hearsay (interviews, anonymous source) and an unreviewed/unreplicated document. Fails Sensitivity: In the closest world where X is false, the anonymous source might still say it, the interviewed scientists might still speculate, the preprint might still exist. The newsroom would likely *still believe X*. Also fails Safety: Nearby worlds include ones where the preprint is flawed or the anonymous source is wrong, and the newsroom still publishes X. **NO.** -> Use "Evidence emerging from interviews and a preprint suggests X," "Sources indicate X," or "According to a preprint and reporting, X." *STOP. (Honest output: Can't use "know" or "we know". Tracking fails completely at Step 1.)*

  **Where the Seams Show & Assumptions Lurk:**

  1.  **Step 1 Sensitivity/Safety Assessment:** This is the core and the messiest part. Judging "closest world" is inherently subjective and context-dependent. The checklist *assumes* you can make reasonable judgements about counterfactuals quickly. It leans on the reporter's understanding of the science/methods.
  2.  **"Trivial" Inference (Step 2):** Defining "trivial" is fuzzy. Does "DNA match" -> "Was at crime scene" count? Usually yes. Does "Increased CO2" -> "Causes significant warming" count? Not trivial – huge inferential machinery. The checklist *assumes* you have good scientific judgement to spot non-trivial inferences.
  3.  **Conjunction Check (Step 3):** Identifying the *closest* world where the conjunction fails is crucial and subjective. Does it fail because P is false? Because R is false? The test focuses on the most *likely* failure mode.
  4.  **Risk Check (Step 4):** This overtly prioritizes pragmatism (avoiding lawsuits, respecting subjectivity) over epistemology. "Know" might track, but you still can't use it.
  5.  **The "We" Problem (Case 3):** The checklist crumbles slightly with institutional "knowers" like newsrooms. It treats them as monolithic belief-holders, which is simplistic. The core tracking test still applies to *their* evidence base.

  **The Deadline Takeaway:** Focus ruthlessly on **Step 1 (Direct Tracking?)** and **Step 2 (Trivial Inference?)**. Most fights are settled here. If it fails Step 1, "know" is dead. If it requires a non-trivial inference in Step 2, "know" is likely dead for the inferred part. Use the language of evidence ("shows," "indicates," "demonstrates," "suggests") or belief ("concludes," "argues," "maintains") for anything that isn't directly tracked or trivially entailed. Save "know" for concrete, directly verified facts close to the source's immediate observation. When in doubt, hedge – your editors will likely demand it anyway on anything borderline, and this checklist gives you the *reason* why hedging is epistemically necessary, not just stylistic. Good luck with the deadline!
