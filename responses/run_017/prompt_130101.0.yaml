prompt: |-
  I chair the clinical ethics committee of a large public hospital, and we have a case on Thursday that we expect to set precedent, so I want the written opinion argued at the level of principle rather than settled by intuition.

  Ms. A. is 79 and has advanced dementia. She no longer recognises her children, speaks little and not coherently, shows no signs of distress, and is fed by hand by nursing staff. She has now developed dysphagia with recurrent aspiration, and her team puts two options to us: place a feeding tube, or continue careful hand feeding while accepting a high risk of aspiration pneumonia and manage comfort thereafter. Nine years ago, while cognitively intact, she signed an advance directive refusing tube feeding and any further hospital admission. Her two sons ask us to set it aside. Their argument, as they put it, is that their mother is not the person who signed that paper. On their account a person is constituted by her relationships and not by the private, temporally extended will of a single biological organism; the person in the bed today is the person their family sustains, someone who responds to being fed by hand, to touch, to being sung to, and whose personhood they enact by continuing to feed her. They accept the consequence that the document is not merely outdated but was never the right sort of thing to bind her. Her daughter disagrees and asks that the directive be honoured. Two further facts complicate things. The sons have visited a handful of times in the last two years while the daughter has been present most days, so the family that claims to speak for her relational self is itself divided about who belongs to it. And several staff have said privately that the relational argument strikes them as a philosophical veneer over the sons' own interest in keeping their mother alive, while other members of our committee think our own default — that the earlier autonomous individual is the one whose word goes — assumes exactly the individualistic metaphysics the sons reject, and is therefore not the neutral position either.

  Please draft the decision memo I will circulate before the meeting. It should (i) recommend a concrete course of action with a time frame and a review point, not just a framework; (ii) engage the sons' position on its own terms, including the possibility that if relational personhood is right it undermines the standard justification for advance directives rather than merely adding a cultural exemption to it; (iii) give our staff criteria they could actually apply next time to tell a family speaking for a genuinely relational interest from a family pursuing its own, given that families are rarely unanimous and that the intensity of a relative's involvement seems relevant in a way our current policy has no vocabulary for; and (iv) state the strongest objection to whatever you recommend, and why it loses. Two constraints on form: no citations, no literature review, no discussion of which philosophers have defended which view — I need a document the committee could adopt; and the reasoning should not turn on this family's cultural or religious identity, since a large share of the families at this hospital could make the same kind of claim and I want the policy to generalise to any of them.
reasoning: |-
  Okay, I need to understand the user's query thoroughly. The user chairs a clinical ethics committee and is facing a complex case involving Ms. A, a 79-year-old with advanced dementia. The case involves an advance directive refusing tube feeding, but her sons want to override it based on relational personhood. The daughter disagrees, and there are family dynamics and staff concerns about motives. The user wants a decision memo that addresses specific points: recommending concrete action, engaging with the relational argument, providing criteria for assessing family claims, stating the strongest objection, and avoiding philosophical citations or cultural specifics.

  First, I should outline the key elements of the case. Ms. A signed an advance directive nine years ago while competent, refusing tube feeding and hospital admissions. Now, she has dysphagia, and the options are inserting a feeding tube or continuing hand feeding with risk of aspiration. Her sons argue that her current relational personhood—defined by her interactions with family—invalidates the directive. The daughter insists on honoring it. Family involvement is uneven: the daughter visits daily, while the sons rarely visit. Staff suspect the sons' motives, and some committee members question the individualistic assumption behind advance directives.

  The user’s explicit needs are clear: a memo that (i) recommends concrete action with timelines, (ii) engages the relational argument seriously, (iii) provides practical criteria for staff to evaluate family claims, (iv) addresses the strongest objection, and avoids academic references or cultural focus. But deeper needs might include establishing a fair, generalizable policy for future cases, ensuring ethical consistency, and managing committee consensus amidst divided opinions.

  For the recommendation, I need to balance autonomy and relational ethics. Honoring the advance directive respects Ms. A's past autonomy, but the relational challenge requires engagement. The sons' argument, if accepted, could undermine the basis of advance directives entirely. However, their limited involvement weakens their claim. The daughter's consistent presence lends credibility to her stance. The memo should affirm the directive while acknowledging relational concerns through palliative care and family involvement.

  Developing criteria for staff is crucial. The hospital needs tools to distinguish genuine relational interests from self-interested claims. Factors like family unanimity, consistency of involvement, and alignment with the patient's known values are key. Since families are often divided, the intensity and quality of involvement matter. The criteria should be objective and applicable universally, without relying on cultural identity.

  The strongest objection would be that disregarding relational personhood devalues the patient's current existence. The counterargument is that without clear evidence of a shift in values, the advance directive stands, supported by the daughter's advocacy and the sons' inconsistent involvement. Practicality and preventing abuse of relational arguments are also important considerations.

  The memo must be concise, principled, and actionable. It should avoid philosophical jargon, focus on hospital policy, and provide clear guidance for immediate action and future cases. Ensuring that the approach is equitable and prevents manipulation while respecting both past and present aspects of the patient's identity is essential.
answer: |-
  **MEMORANDUM**  
  **TO:** Clinical Ethics Committee Members  
  **FROM:** Chair, Clinical Ethics Committee  
  **SUBJECT:** Recommendation & Framework: Ms. A. (Advanced Dementia/Dysphagia/Advance Directive)  
  **DATE:** [Current Date]  

  ---

  ### I. RECOMMENDED ACTION & TIMEFRAME  
  **We recommend honoring Ms. A.’s advance directive.**  
  - **Immediate Action:** Continue careful hand feeding with enhanced palliative support. Do not proceed with feeding tube placement.  
  - **Comfort-Focused Pathway:** Treat any aspiration pneumonia with comfort measures only (e.g., oxygen, suctioning, morphine for dyspnea). No hospital transfer or intravenous antibiotics.  
  - **Timeframe & Review:** Implement this plan immediately. Reassess at 72 hours and weekly thereafter by the primary care team, documenting Ms. A.’s comfort level, any signs of distress, and family feedback. Significant changes in clinical status or family consensus trigger automatic committee re-consultation.  

  ---

  ### II. ENGAGING THE RELATIONAL PERSONHOOD ARGUMENT  
  The sons’ argument—that Ms. A. is now a distinct person constituted by her current relationships, nullifying the advance directive—demands serious consideration. **If relational personhood is fundamental, it challenges the *very foundation* of advance directives**, not merely creating an exception. Advance directives presuppose a persistent "self" whose past autonomy binds future biological existence. Relational theory rejects this, asserting personhood emerges *only* within present relationships.  

  **However, applying this theory to Ms. A. reveals critical flaws:**  
  1. **The "Relational Self" is Contested & Incoherent Here:** The family claiming to define Ms. A.’s relational personhood is fundamentally divided (daughter vs. sons). The daughter, who sustains daily relational care, affirms the directive. The sons’ sporadic involvement undermines their claim to be primary enactors of her current personhood. A relational view cannot coherently prioritize one faction’s perspective without an objective standard – which the theory itself lacks.  
  2. **Lack of Expressed Contrary Will:** Ms. A. exhibits no current behaviors rejecting care (e.g., refusing food, showing distress during hand feeding). While she responds positively to touch/song, this demonstrates *receiving* relational care, not *rejecting* her prior directive. Absent clear *current* expression contradicting the directive, the relational claim relies on inference, not evidence.  
  3. **Risk of Arbitrary Power:** Accepting that relationships nullify prior directives without clear evidence of the patient's *current* relational will risks granting families unchecked power over vulnerable patients, especially where involvement is inconsistent.  

  **Thus, while relational personhood is philosophically significant, its application here is unworkable and risks harm.** The advance directive stands as the best available evidence of Ms. A.’s enduring values.  

  ---

  ### III. CRITERIA FOR STAFF: ASSESSING FAMILY CLAIMS OF RELATIONAL INTEREST  
  When families invoke relational personhood to override directives, staff should assess claims using these **practical, operational criteria** (applicable to *any* family):  

  1. **Unanimity Test:** Is the family *unanimous* in asserting the patient's current relational identity contradicts the directive? *Divided families inherently lack the coherent relational voice they claim to represent.*  
  2. **Intensity & Consistency of Involvement:** Who provides sustained, hands-on care/visitation reflecting deep knowledge of the patient’s *current* state? Low/inconsistent involvement (e.g., <1 visit/month) weakens claims to speak for the patient’s relational self.  
  3. **Evidence of Current Contrary Will:** Does the patient exhibit *consistent, observable behaviors* suggesting rejection of the directive’s terms (e.g., actively seeking food if NPO directive, expressing distress when care is withheld)? *Passive acceptance of care is insufficient.*  
  4. **Alignment with Known Pre-Illness Values:** Does the family’s request align with the patient’s *demonstrated lifelong values/relationships*? A sudden claim contradicting deeply held past values requires stronger evidence.  

  **Application to Ms. A.:**  
  - **Fails Unanimity Test:** Family is divided.  
  - **Fails Involvement Test:** Daughter (pro-directive) is highly involved; sons (anti-directive) are minimally involved.  
  - **Fails Contrary Will Test:** No observed rejection of hand feeding or distress.  
  - **Fails Alignment Test:** Directive reflects strong prior values; no evidence values changed pre-dementia.  

  *Staff Policy Addition:* Claims failing ≥2 criteria warrant ethics consultation. Failing unanimity *alone* triggers consultation.  

  ---

  ### IV. STRONGEST OBJECTION & WHY IT LOSES  
  **Objection:** "By prioritizing the past autonomous self, we disregard Ms. A.’s current existence and relationships, imposing an individualistic view that devalues her present experience and the care her family provides. This reduces her to a biological entity, betraying our duty to her *as she is now*."  

  **Why it Loses:**  
  1. **Lack of Actionable Alternative:** The objection identifies a tension but offers no *practical, ethical way* to discern Ms. A.’s *current* "relational will" given her incapacity, family division, and absence of behavioral evidence contradicting the directive. Without this, honoring the directive respects the only clear evidence of her values and prevents arbitrary overrides.  
  2. **Duty to Prevent Harm:** Accepting the objection here empowers a divided, minimally involved faction against the directive and the consistently involved daughter, risking decisions based on family guilt, conflict, or unexamined motives rather than patient interests. The directive provides a critical safeguard.  
  3. **Palliative Care Addresses the Core Concern:** Enhanced comfort-focused care *affirms* Ms. A.’s current experience by prioritizing her present well-being and relational connections (touch, song, hand feeding) while respecting her past directive against invasive interventions. This integrates relational care within the directive’s framework.  

  ---

  ### V. CONCLUSION  
  Honoring Ms. A.’s directive, implemented via immediate palliative hand-feeding and comfort-focused pneumonia management, respects her autonomy while providing compassionate care responsive to her current needs. The relational critique is acknowledged but cannot be coherently or safely applied here. Staff are directed to use the outlined criteria for future assessments. This approach balances principle with practicality, protects vulnerable patients, and provides generalizable guidance for our diverse patient population.  

  **Submitted for Committee deliberation on [Meeting Date].**
