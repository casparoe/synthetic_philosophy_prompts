    - *Load-bearing:* Q6 (accepts the staircase).  

  ---

  ### Notes on Unseparated Leaves  
  - **Total Utilitarianism** and **"Repugnance is Acceptable"** are **not separated** by this tree. To split them, add: *"Is a world of 10 billion people at +1 welfare better than one person at +1,000?"* (Totalist: No; Repugnance-Accepter: Yes).  
