  ### Population Axiology Decision Tree  
  *Follow the branches by answering each question. Your path ends at a "leaf" representing a position.*

  ---

  #### **Q1: Does adding a person with positive welfare (without affecting others) make the outcome better?**  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  ---

  #### **Q2: In the "drip lives" case:**  
  *Compare:*  
  - **A:** One person at +1,000 welfare.  
  - **B:** 1 billion people at +0.001 welfare each (total welfare = 1,000).  
  Which is better?  
  - **A is better** → Go to Q4.  
  - **B is better** → Leaf: **Quantity-of-Lives View** (unnamed).  
    - *Awkward commitment:* Prefers enormous populations with *barely* positive lives over high-welfare few, even with equal total welfare.  
    - *Load-bearing:* Q2 (values persons, not welfare sums).  
  - **Equal** → Leaf: **Total Utilitarianism**.  
    - *Awkward commitment:* Fully embraces the Repugnant Conclusion (Z > A).  
    - *Load-bearing:* Q2 (only welfare sums matter).  

  ---

  #### **Q3: For the same "drip lives" case (A vs. B):**  
  - **A is better** → Go to Q5.  
  - **B is better** → Leaf: **Quantity-of-Lives View** (as above).  
  - **Equal** → Go to Q6.  

  ---

  #### **Q4: Is there a minimum welfare level for adding a life to be an improvement?**  
  *(Asked if you accepted mere addition (Q1=Yes) and preferred A in drip lives (Q2=A better))*  
  - **Yes** → Go to Q4a.  
  - **No** → Go to Q4b.  

  **Q4a: Is this minimum level fixed (not population-sensitive)?**  
  - **Yes** → Leaf: **Critical-Level View** (e.g., Blackorby et al.).  
    - *Awkward commitment:* Adding lives *above* neutral but *below* the threshold is actively bad.  
    - *Load-bearing:* Q4a (fixed threshold).  
  - **No** → Leaf: **Sliding Critical-Level View** (unnamed).  
    - *Awkward commitment:* The 10-billionth life can be barely positive, making it collapse into slow-motion Repugnance.  
    - *Load-bearing:* Q4a (threshold decreases with population size; escapes fixed-threshold impossibilities).  

  **Q4b: In the staircase from A to Z, which step fails?**  
  - **Reject the first step** → Leaf: **Averagism**.  
    - *Awkward commitment:* Prefers a small, happy population over a larger one with higher total welfare.  
    - *Load-bearing:* Q4b (rejects mere addition when average drops).  
  - **Reject transitivity** → Leaf: **Intransitive View** (e.g., Temkin).  
    - *Awkward commitment:* Moral betterness is non-transitive (A > B, B > C, but C > A).  
    - *Load-bearing:* Q4b (accepts steps but not the chain).  
  - **Accept the chain** → Leaf: **Lexical View** (e.g., Parfit).  
    - *Awkward commitment:* A single high-welfare life trillions of barely-positive lives.  
    - *Load-bearing:* Q4b (endorses Z via staircase but not one-jump).  

  ---

  #### **Q5: Can gains to new people compensate losses to existing people?**  
  *(Asked if you rejected mere addition (Q1=No) but preferred A in drip lives (Q3=A better))*  
  - **Yes** → Leaf: **Critical-Level View** (as above; fixed threshold).  
  - **No** → Leaf: **Asymmetry View** (e.g., Narveson).  
    - *Awkward commitment:* Adding good lives does nothing; adding bad lives is bad. No obligation to create.  
    - *Load-bearing:* Q5 (rejects compensation).  

  ---

  #### **Q6: In the staircase from A to Z, which step fails?**  
  *(Asked if you rejected mere addition (Q1=No) but called drip lives equal (Q3=Equal))*  
  - **Reject the first step** → Leaf: **Inconsistent Position** (unattractive: accepts totalism in drip lives but rejects mere addition).  
