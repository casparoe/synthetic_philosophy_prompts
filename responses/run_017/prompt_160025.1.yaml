  First, I need to establish the core differences between the two accounts. Bratman reduces joint action to interlocking individual intentions and mutual responsiveness, while Gilbert requires an irreducible joint commitment creating normative bonds. The SCA case - with drivers following algorithmically coordinated navigation - challenges both by lacking face-to-face interaction while achieving systemic coordination.

  For the verdict question, Bratman's account clearly excludes SCA because participants lack mutual responsiveness and common knowledge of the joint activity. Gilbert's account fails because there's no expression of joint willingness creating a plural subject. The human coordinator variant might create dyadic obligations between coordinator and each driver under Gilbert, but not collective agency among drivers.

  Regarding the ownerless goal, both accounts struggle to attribute the system-level objective to the collective itself rather than individuals. This exposes a limitation in explaining how groups can have goals not reducible to member intentions. The rebuke reactions in SCA are interesting - they resemble collective blame but can arguably be explained through causal responsibility or institutional roles without invoking joint action.

  The cost question reveals philosophical trade-offs: Bratman could accommodate SCA by weakening mutual responsiveness requirements but loses explanatory precision. Gilbert could stretch "expression" to include algorithmic coordination but erodes the normative foundation. I find SCA genuinely borderline, exposing how standard examples rely on unstated mutual awareness.

  Finally, Searle's primitive "we-intention" approach might handle SCA more easily but pays with reduced analytical power. It's a trade-off between biological plausibility and philosophical rigor.

