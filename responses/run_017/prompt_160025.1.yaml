answer: |-
  ## Scaffolded Collective Action and the Nature of Joint Action: Bratman vs. Gilbert

  **1. Verdict on Pure SCA**

  *   **Account A (Bratman):** The pure SCA case is **not a genuine joint action**; it is merely a set of causally interdependent parallel individual actions.
      *   **Excluding Condition:** The crucial missing elements are **mutual responsiveness** and the **common knowledge structure** concerning the *joint* activity. Participants intend to follow *their individual instructions* from the mechanism, but they do not each intend *that we J* (e.g., "that we collectively distribute traffic"). They lack intentions *concerning the collective outcome* (J-ing) and intentions concerning their actions *by way of the others' actions*. Their responsiveness is solely to the *mechanism*, not to *each other* in the context of a shared plan. Common knowledge pertains only to the mechanism's existence and function, not to a shared intention *among themselves* to J together. The counterfactual interdependence is a byproduct of the mechanism, not a feature of their interlocking intentions.
  *   **Account B (Gilbert):** The pure SCA case is **not a genuine joint action**.
      *   **Excluding Condition:** The fundamental missing element is a **joint commitment constituting a plural subject**. There is no expression of readiness, agreement, or joint willingness *among the participants themselves* to be jointly committed to the activity "as a body." The participants are individually committed to following the mechanism, but there is no act (verbal or otherwise) *between them* that creates a mutual commitment binding them to each other. They remain a collection of individuals coordinated by an external force, not a "we" constituted by their own joint commitment.

  **2. Degree or Kind? (Including Human Coordinator Variant)**

  *   **Account A (Bratman):** The failure is **categorical** concerning the *participants acting jointly among themselves*. The core elements – individual intentions *that we J* and mutual responsiveness *to each other* within the context of those intentions – are absent. The human coordinator variant **does not change** the verdict concerning the *participants themselves*. They still lack intentions *that we J* and mutual responsiveness *to each other*. However, this variant **may generate dyadic joint actions between the coordinator and *each* participant individually**. The coordinator intends that *they* (coordinator and driver X) cooperate via the instructions (a specific J, like "execute the traffic plan concerning driver X"). Driver X arguably intends to follow the instructions *because* they come from the coordinator with a plan. There is mutual responsiveness between coordinator and each driver regarding *that driver's* part. This **asymmetry is not a problem** for Account A. It readily allows for complex structures where individuals jointly act with a central coordinator without implying joint action among all participants. The coordinator-participant dyads satisfy the core conditions; the participant-participant relations do not.
  *   **Account B (Gilbert):** The failure is also **categorical** concerning the *participants acting jointly among themselves*. The absence of a joint commitment *between them* is fundamental. The human coordinator variant **changes the analysis concerning the coordinator and participants**. Arguably, **joint commitments exist between the coordinator and *each* participant individually**. The coordinator's act of issuing instructions *to* a driver, combined with the driver's acceptance (implied by following them), *could* be seen as expressions forming a joint commitment *to* that plan (e.g., "we – coordinator and driver X – are committed as a body to X following route R"). This generates obligations *between* the coordinator and each driver. Crucially, **no joint commitment exists *among the participants themselves***. They have not jointly committed *with each other*. This **asymmetry is potentially a problem** for Gilbert. While her theory allows for hierarchical groups, the joint commitment is typically conceived as binding *all* members of the plural subject *to each other*. Here, the drivers are only bound *to the coordinator*, not to each other. It strains the concept of a *plural subject of drivers*; instead, we have multiple dyadic plural subjects (coordinator-driver1, coordinator-driver2, etc.). This feels less like collective action *among the drivers* and more like individual compliance with a central authority, mediated by dyadic obligations.

  **3. The Ownerless Goal**

  *   **Account A (Bratman):** Strictly, **no**. The account attributes goals only to individuals. The system-level goal resides solely in the mechanism or its designers. Participants have individual goals (e.g., "get to destination," "follow instructions"). Bratman aims to explain *collective* outcomes through the *interlocking* of *individual* intentions concerning the collective ("that we J"). In SCA, no participant has an intention concerning the collective outcome ("that we distribute traffic"). **What is lost:** The ability to naturally attribute the system-level goal *as a goal of the collective itself*, rather than just an outcome caused by individual actions coordinated externally. The collective outcome appears accidental from the participants' perspective, even if systemically intended by the mechanism.
  *   **Account B (Gilbert):** More **ambiguous**, but leaning towards **no**. Gilbert focuses on the *joint commitment to act* together. While the commitment implies a shared goal *in the minimal sense of being jointly committed to doing something*, the specific system-level goal (traffic distribution) is not represented or aimed at *by the plural subject* in SCA. The drivers aren't jointly committed *to distributing traffic*; they are (in the variant) individually committed *to the coordinator* to follow instructions. **What is lost:** Similar to Bratman, the lack of a clear link between the collective action and the system-level goal *as the collective's goal*. Gilbert's plural subject *could* potentially hold goals irreducible to individual goals (e.g., "our goal is to walk together"), but SCA lacks the formation of a plural subject committed *to that specific system goal*. The system goal remains external.

  **4. Rebuke-Shaped Reactions**

  This phenomenon is **not strong evidence against either account** in the pure SCA case. Both accounts can explain the reactions without invoking genuine joint action or collective responsibility *among the drivers*:

  *   **Causal Contribution to Harm:** Anger and blame can be directed at individuals or the aggregate for their *causal role* in a harmful outcome (e.g., "all these drivers using the app flooded my street"). This doesn't require collective intentionality.
  *   **Institutional Role Responsibility:** Participants using the platform implicitly accept its terms. Platform bans or congestion charges are sanctions based on violating *institutional rules* governing platform use or road usage, not breaches of a mutual obligation *to each other*. The "standing" derives from the institutional framework, not a joint commitment among users.
  *   **Blame Towards the Mechanism/Designers:** Much anger is likely directed at the service ("Waze ruined our street!") or its designers for how the algorithm functions.
  *   **Aggregate Effects:** Talking about "what the drivers did" often just refers to the aggregate effect of many individuals acting similarly under the same system, not attributing agency to a collective entity formed by their mutual commitments.

  While the *form* of the reaction resembles collective blame, its *basis* is plausibly different. Neither account *predicts* these reactions in pure SCA, but both can *accommodate* them without contradiction. The human coordinator variant strengthens the case for rebuke *from the coordinator* towards individuals (based on the dyadic joint commitment), but not among participants.

  **5. The Cost of Accommodation**

  *   **Account A (Bratman):** To count SCA as joint action, Bratman would need to **significantly weaken the "intending that we J" and mutual responsiveness conditions**. He might allow intentions directed at the *mechanism-mediated collective outcome* (e.g., "I intend that we, the users of Service X, follow its routing to achieve its goal") and mutual responsiveness *via the mechanism* (e.g., being disposed to adjust *because* the mechanism says others are adjusting). This is **very expensive**. It sacrifices **reductive parsimony** by making the "intention that we J" highly abstract and potentially detached from awareness of other specific participants. It blurs the line between genuinely interlocking intentions and mere coordinated behavior driven by a common external source. The core appeal of explaining jointness through the structure of *individual* attitudes tightly interconnected *with each other* is lost.
  *   **Account B (Gilbert):** To count SCA as joint action, Gilbert would need to **reinterpret "expression of joint willingness" to include participation in an institutionalized system**. Following the mechanism's rules could be seen as an expression of willingness to be jointly committed *with all other participants* to the system's goals *via the platform*. This is also **very expensive**. It stretches the concept of "expression" thin and risks detaching the joint commitment from any specific mutual understanding *among the participants*. Crucially, it **severely weakens the tight normative link**. The obligations and entitlements to rebuke become diffuse and institutional rather than directly interpersonal. The powerful intuition that joint commitment creates *immediate, mutual* obligations grounded in a shared act of commitment is significantly eroded. The account loses its distinctive focus on the *interpersonal bond* created by joint commitment.

  **6. Paradigm-Dependence: Borderline or Degenerate?**

  SCA cases are **genuinely borderline** and **reveal the unearned work of paradigm cases**. Standard examples (walking, singing, painting) rely heavily on mutual awareness, recognition, direct responsiveness, and often shared, conscious goals. These features make the interlocking intentions (Bratman) or the joint commitment (Gilbert) phenomenologically vivid and plausible. SCA strips away these features while preserving complex coordination towards an external goal. Their exclusion is **a potential defect** for both accounts if the goal is a comprehensive theory of collective agency. It suggests that:

  *   For Bratman, the conditions derived from face-to-face cases might be *sufficient* but not *necessary* for a broader phenomenon of collective agency mediated by institutions or technology. The paradigm smuggles in elements (like direct mutual recognition) that aren't strictly required by the core idea of interlocking attitudes, but which the account relies on to distinguish joint action from parallel action.
  *   For Gilbert, the focus on explicit joint commitment formation might capture a *central, normatively rich* form of acting together but miss *institutionally embedded* forms of collective agency where the "we" and its obligations are scaffolded by external systems, even if genuine collective action occurs. The paradigm assumes the commitment creates the group, ignoring groups constituted by institutional roles.

  SCA challenges the idea that mutual recognition and direct responsiveness are essential to collective agency *as such*. While both accounts rightly highlight their importance for rich, small-scale collaboration, excluding SCA entirely suggests their definitions might be overly narrow, shaped by paradigmatic examples rather than the full spectrum of collective phenomena. They are degenerate *relative to the paradigms*, but potentially revealing of a distinct form of collective agency.

  **Extra Check: Searle's Biological Primitive**

  Searle's view, treating the capacity for "we-intentions" as biologically primitive and irreducible, **handles SCA more easily**, but at a **significant cost**. Searle could posit that drivers in SCA individually have a primitive "we-intention" like "we are routing traffic via NavService." This directly attributes the collective goal to the participants without requiring complex interlocking attitudes or explicit joint commitment. It readily explains the system-level goal attribution and perhaps even the rebuke-shaped reactions (as responses to failures of the collective intention). **What it pays:** It sacrifices **analytical power** and **explanatory depth**. By taking "we-intentions" as primitive, it provides no analysis *of what constitutes* joint action beyond the presence of these intentions. It struggles to differentiate genuine collective agency from mere parallel individual actions where someone *falsely* believes they are part of a "we." It offers little insight into the *normative structure* of obligations within groups, which Bratman and Gilbert explicitly address. The account becomes less illuminating about the *mechanisms* and *conditions* of collective action, resting instead on an unexplained primitive capacity. While it accommodates SCA more readily, it does so by being less precise and less able to account for the nuances and normative dimensions captured (even if restrictively) by Bratman and Gilbert.
