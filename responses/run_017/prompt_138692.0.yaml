prompt: |-
  Hi — I'm the staff person for a city historical marker commission, and I could use some help turning something into a checklist.

  Quick setup: we maintain about 140 markers and plaques around town — buildings, a couple of statues, a demolished neighborhood, a splashy one about the 1898 water filtration plant. We revise maybe 20–25 a year. Committee of five, appointed by the city council, two of them think any edit is "erasing history," one is a retired high school civics teacher, none of them have history degrees. I don't either. We meet two hours twice a month, so realistically ten minutes per marker, and every revision has to survive a council vote where someone will always ask "why are you changing it." Markers have to come in under about 90 words and be readable by a twelve-year-old standing on a sidewalk.

  The problem: almost all of these were written in the 1920s–70s in this voice that assumes the town has been climbing a ladder and we're standing on the top rung. Words like "finally," "at last," "brought the city into the modern era," "paved the way for," "a pioneer who." I've read enough to know this has a name — historians call it Whig history, writing the past as a march toward us — and that it's a trap you can fall into in both directions (there's a version where every marker says things used to be better and everything since is a fall). But I can't hand the committee an essay about teleology. I need a procedure.

  So: give me a decision procedure I can actually run out loud, in order, on a draft marker. For each step, what question do I ask, what counts as a good enough answer, where does the procedure just stop and say "this line has to go," and where does it throw up its hands and say "this is a values call, committee votes." I especially need it to distinguish three things I keep getting tangled: (a) sentences that claim something genuinely got better, which is often just true and checkable, (b) sentences that claim we have *arrived* — that the present is the point the story was heading for, and (c) sentences that quietly make people in the past look foolish for not already knowing where things were headed. And whatever you build has to not collapse into "delete every evaluative word," because then every plaque reads "in 1898 the city built a plant" and the council stops funding us and nobody stops to read them. I'd rather the procedure name that failure mode and have a guard against it than pretend it can't happen.

  Two tests I've been using by instinct, tell me if they're junk or how to fix them. One: the 1975 test — would a sentence in exactly this tone, written in whatever year the marker was put up about that year's settled assumptions, now make us wince? Two: the losers' bet — could a sensible, well-informed person at the time have bet against this outcome without being stupid or wicked? If the marker implies no, it's doing the thing I'm trying to avoid.

  Then please run the whole thing on three real drafts, and don't go easy on me:

  One. The water plant: "For years the city drank its own filth. At last, in 1898, science and civic pride prevailed, and Cedar Heights joined the modern world." (I think this one's easy but I want to see what survives — the typhoid numbers are real and I don't want a procedure that can't say so.)

  Two. The one I'm attached to, about Dr. Alice Renner, the first woman licensed to practice here: "Dr. Renner broke through the barriers of her day and opened the door for every woman who followed." I like this marker. I suspect your procedure is going to make me cut most of it, and I know the historical society that paid for it will be furious. If that's what it says, say so plainly, and give me the one or two sentences I can read out to the committee that aren't theory-speak.

  Three. A proposed marker for Brightmoor, the Black neighborhood bulldozed for a highway in 1961: something like "Brightmoor was a place where families thrived, until the city destroyed it and built a road." I worry this is the same mistake with the sign flipped, but I also don't want to end up with nothing to say about it.

  Last thing: tell me what the procedure can't do. Which markers are just unfixable in ninety words, which ones are really a fight about what the town wants to be rather than about the past, and where ten minutes isn't enough and we should just defer. And could you write it as continuous prose — no headings, no bullets, no bold, no tables, just an email-length explanation I can read on my phone before a meeting. Thanks.
reasoning: |-
  Okay, the user is a staffer for a city historical marker commission dealing with outdated language in their markers. They need a practical checklist to revise about 20-25 markers per year within tight constraints – ten minutes per marker in committee meetings, surviving city council votes, and keeping text under 90 words for a 12-year-old reading level. 

  The core problem is Whig history language that frames the past as inevitably progressing toward the present. They want to distinguish between genuine improvements (like reduced typhoid rates), problematic "arrival" narratives, and depictions of past people as foolish. Their instinct tests – the 1975 test and losers' bet – seem insightful but need formalization.

  Key challenges they're facing:
  - Committee dynamics (two resistant members, no historians)
  - Political sensitivity (council votes, donor expectations)
  - Balancing factual accuracy with narrative engagement
  - Avoiding both Whig history and its inverse "decline" narrative

  The three test cases reveal tensions:
  1. Water plant: Needs to acknowledge public health victory without triumphalism
  2. Dr. Renner: Risks overstating individual impact on structural change
  3. Brightmoor: Must condemn injustice without implying pre-demolition utopia

  Hmm... they're clearly experienced – noticing Whig history patterns and anticipating backlash from the historical society shows deep contextual awareness. Their frustration with abstract theory ("can't hand an essay about teleology") suggests they've tried and failed with conceptual approaches before. The "readable on my phone" request implies they're time-pressed during meetings.

  The procedure should:
  - Be flowchart-like but in prose
  - Flag committee vote points early
  - Preserve factual gains (like typhoid reduction)
  - Identify removable value judgments
  - Offer rewrite strategies for each failure mode

  For Dr. Renner specifically, they're braced for cuts but need diplomatic language for the committee. The Brightmoor example needs to validate systemic critique while avoiding simplistic "paradise lost" framing. 

  Biggest risk is creating a procedure so restrictive it produces bland markers. Need explicit guardrails against over-sanitizing – maybe by requiring preserved "why it mattered" elements. Also must acknowledge some markers can't be fixed quickly (those needing fundamental research or reflecting irreconcilable town values conflicts). 

  The "losers' bet" test is particularly clever – it elegantly exposes presentism. Should formalize that as step 3. The 1975 test might need refining to avoid over-applying modern sensitivity to past contexts. 

  Final output must sacrifice academic precision for practicality: no jargon, all steps executable aloud in <2 minutes each, with clear "kill/keep/vote" outcomes. Committee politics mean vote triggers should happen before controversial cuts.
answer: |-
  Here's a straight-shot procedure you can read aloud in meetings, designed for speed and defensibility. It runs through each sentence/phrase in the draft, asking specific questions in sequence. Stop at the first "yes" answer.

  **The Procedure:**

  1.  **Is it factually inaccurate?** (Check sources. If yes, *it must be changed*. Stop. Revise for accuracy. Proceed with revised text.)
  2.  **Is it needlessly inflammatory or offensive *by contemporary standards*?** (e.g., slurs, dehumanizing language. If yes, *it must be changed*. Stop. Revise neutrally. Proceed.)
  3.  **Does it claim people in the past were stupid/immoral for *not* knowing what we know now?** (Implies they *should* have seen the future. If yes, *delete it or rewrite to show context*. Stop. Proceed.)
  4.  **Does it claim the present (or a specific past moment) was the *inevitable goal or endpoint* of this story?** (Uses "finally," "at last," "ushered in the modern era," "paved the way for [us]". If yes, *delete the teleological phrase* OR *rewrite to state the consequence factually*. Stop. Proceed.)
  5.  **Does it attribute change *solely or primarily* to vague forces ("Progress," "Science," "Civic Pride") or a lone "pioneer"?** (Erases complex causes, collective action, or context. If yes, *rewrite to specify who did what and/or the context*. Stop. Proceed.)
  6.  **Does it make a genuine, specific, *verifiable claim about improvement*?** (e.g., reduced disease, increased rights, safety, access. If yes, *it can stay IF* phrased factually: "reduced typhoid deaths," "enabled women to practice medicine," not "brought modernity". If the *improvement* is contested *historically*, flag for committee vote. Otherwise, keep. Proceed.)
  7.  **Does it make a negative judgment about the past *without verifiable evidence* presented?** (e.g., "drank its own filth" vs. "contaminated water caused disease"). If yes, *rewrite factually* OR *delete judgmental phrase*. Stop. Proceed.
  8.  **Is the sentence purely factual and neutral?** (e.g., "Built in 1898," "First licensed woman doctor, 1921"). If yes, keep. Proceed.
  9.  **Is the word/phrase trying to convey *significance* or *impact*?** (This is the "guard against blandness" step). If yes, ask: **Can the significance be stated *as it was experienced/perceived then* OR *as a measurable outcome*?** (e.g., "provided clean water for the first time," "became a center of community life," "sparked debate"). If yes, *rewrite to that effect*. If it *must* imply a later judgment ("opened the door"), *flag for committee vote*. Stop. Proceed.
  10. **If you get here, the phrase is likely:** redundant, overly flowery, vague, or expressing a *contested modern value judgment* about the past (e.g., "thrived," "destroyed" - depending on context). *Flag for committee vote on whether it's essential or should be cut.*

  **Your Instinct Tests Integrated:**
  *   **The 1975 Test:** Primarily covered in Step 2 (offensive now) and Step 4 (teleology sounds silly in hindsight). It's a good gut check.
  *   **The Losers' Bet Test:** Directly addressed in Step 3. If the sentence implies betting against the outcome was stupid/wicked, it fails Step 3.

  **Running the Tests:**

  1.  **Water Plant Draft:** "For years the city drank its own filth. At last, in 1898, science and civic pride prevailed, and Cedar Heights joined the modern world."
      *   Step 1: "drank its own filth" - Exaggerated/judgmental? Not strictly factual. **Yes (Step 7)**. Rewrite factually: "For years, contaminated water caused disease."
      *   Revised Sentence: "For years, contaminated water caused disease." Proceed to next phrase: "At last, in 1898, science and civic pride prevailed..."
      *   Step 4: "At last," "prevailed," "joined the modern world" - Classic teleology/endpoint. **Yes**. Delete teleological phrases: "In 1898, a filtration plant opened."
      *   Revised Sentence: "In 1898, a filtration plant opened." Proceed to next phrase: "...and Cedar Heights joined the modern world." (Already deleted teleology).
      *   **What survives?** The core fact: Contaminated water caused disease (stated factually). A plant opened in 1898. *Significance?* Step 9: Measurable outcome? "providing clean water" or "reducing typhoid deaths" – can be added: "In 1898, a filtration plant opened, providing clean water and reducing typhoid deaths." (Factual, significant, avoids Whig trap).

  2.  **Dr. Renner Draft:** "Dr. Renner broke through the barriers of her day and opened the door for every woman who followed."
      *   Step 3: Does it imply contemporaries opposing her were stupid/wicked? "Barriers of her day" implies they *were* barriers (likely true), but "broke through" and "opened the door" focus on *her* action overcoming inherent stupidity? Borderline, but let's proceed.
      *   Step 4: "opened the door for every woman who followed" - Strongly implies she caused the future outcome (women practicing). Teleological? **Yes**. It frames her as the necessary pioneer for what followed.
      *   Step 5: Attributes change *primarily* to a lone pioneer? **Yes**. "Broke through... opened the door..." centers her individual action.
      *   Step 6: Verifiable improvement? She *was* the first. That's an improvement in access *for her*. "For every woman who followed" is the teleological claim, not the fact of her licensure.
      *   **Result:** The core fact ("first licensed woman doctor, [Year]") survives Steps 1-8. The *significance* (Step 9) is contested. "Opened the door" implies causation/inevitability. Can it be stated as fact/perception/outcome?
          *   *Then:* "Her licensure challenged prevailing norms." (Factual, significance implied).
          *   *Outcome:* "She was the first of many women doctors in Cedar Heights." (Factual if true, states outcome).
          *   *Committee Vote:* The *desire* to emphasize inspiration/barrier-breaking is a *value* about how we interpret pioneers. You'll likely need to flag this sentence for a vote or propose a compromise: "Dr. Renner became the city's first licensed woman doctor in [Year], overcoming significant barriers." (Focuses on *her* achievement within her context, avoids claiming she *caused* the future). Prepare for the historical society: "The procedure flags phrases claiming Dr. Renner *personally caused* all women doctors who followed, as that's hard to prove and makes history seem too simple. We can still celebrate her being first and facing barriers, which are undeniable facts showing change was possible."

  3.  **Brightmoor Draft:** "Brightmoor was a place where families thrived, until the city destroyed it and built a road."
      *   Step 7: "where families thrived" - Positive judgment. Verifiable? Maybe (schools, churches, businesses existed = thriving?), but also potentially idealized. "Destroyed" - Negative judgment. Verifiable? Yes (bulldozed), but emotionally charged. **Flag both phrases for Committee Vote** (Step 10). They express strong, potentially contested *value judgments* about the past (pre-road utopia?) and the action (destruction vs. redevelopment). *However...*
      *   **Crucial Context:** The injustice is the core point. The procedure shouldn't silence condemnation of clear harm. How to navigate:
          *   Focus on *undisputed facts* demonstrating thriving *and* harm: "Brightmoor was a vibrant African American neighborhood with homes, churches, and businesses."
          *   State the action and consequence *factually and specifically*: "In 1961, the city used eminent domain to demolish Brightmoor for highway construction, displacing hundreds of families."
          *   **Result:** The factual core survives: It was a neighborhood, it had institutions, it was demolished via eminent domain for a highway, people were displaced. The *judgment* ("thrived," "destroyed") is softened to factual descriptors ("vibrant," "demolished") that still convey significance and loss. The systemic critique is inherent in the facts presented. If the committee *insists* on stronger judgment, vote on adding "flourishing" or "devastating loss" (Step 9/10).

  **What the Procedure Can't Do (Be Honest in Committee):**

  1.  **Fix Garbage In:** If the original fact is wrong or the event's significance is misrepresented at its core, 10 minutes and 90 words won't fix it. Defer for research.
  2.  **Resolve Fundamental Value Conflicts:** Some markers touch raw nerves about who the town *is* (e.g., Confederacy markers, labor strife). The procedure flags judgment phrases for votes, but if the committee/council is split on the *basic narrative* (Was it progress? Was it oppression? Was it complex?), the procedure just makes the conflict explicit. Defer if consensus seems impossible in the time.
  3.  **Create Compelling Narrative from Scratch:** It cuts Whig language and flags problems. Building an engaging, accurate, *and* significant 90-word story still takes skill. The procedure ensures the foundation isn't rotten, but it doesn't write the marker.
  4.  **Determine "Objective" Significance:** Step 9 requires a judgment call: Is stating the significance *as then perceived* or *as measured* sufficient? If not, it flags a vote. Some significance *is* interpretive.
  5.  **Force People to Agree:** It provides a defensible *process*, not guaranteed outcomes. A committee member shouting "But it *was* progress!" during Step 4 still gets a vote.

  **Before Your Next Meeting:**

  Print this. When reviewing a draft, run each sentence through the steps *in order*. Note where it fails and what action is required (Delete? Rewrite Factually? Flag for Vote?). For flagged votes, have a neutral rewrite option ready. Emphasize the goal: **"We're not erasing history; we're removing hindsight bias and vague judgment to make the actual history and its real consequences clearer."** Good luck.
