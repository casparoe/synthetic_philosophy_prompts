  i'm reading a pop philosophy-of-mind book on the commute (one of those "big ideas in 200 pages" numbers) and the chapter on consciousness builds up to the zombie argument. I have no idea how much of it to trust, so can you audit it?

  Here it is, more or less as the chapter's "in a nutshell" box has it (it says "materialism" throughout, apparently interchangeably with physicalism):

  "A philosophical zombie is a molecule-for-molecule copy of a conscious human being — same brain, same behavior, insisting at length that it has an inner life — with nobody home: no experience at all, all dark inside. Chalmers's point is simply that such a thing is conceivable, and that anything we can genuinely conceive is a genuine possibility. But materialism is the thesis that once all the physical facts are fixed, every other fact comes along automatically, by logic alone. So if zombies are possible there is a world physically identical to ours in which no one is conscious, and materialism is false. It follows that consciousness is something extra, over and above the physical machinery — in substance the very argument Descartes gave when he noticed that he could doubt away his body but not his mind. The practical upshot is that consciousness is cut loose from what anything does: for all behavioral evidence could ever tell you, the person across from you, or a machine that talks exactly like one, may have nothing going on inside. The same goes for any view that identifies consciousness with a causal or functional role, since a zombie occupies all the same roles."

  I have two worries and no idea whether they're the right worries. One: it makes the whole thing sound like "we can imagine it, therefore it's possible," and I remember from somewhere that this line of argument is known to fail in general — something about water and H2O, and Kripke? Two: it spends several pages demolishing the claim that consciousness follows from the physical facts by logic alone, which felt like a strawman; surely a physicalist can say the connection is necessary but knowable only a posteriori. When I tried to check this I drowned in talk of "primary" versus "secondary" and "ideal" versus "prima facie" conceivability, and I couldn't tell whether that machinery is meant to answer my worry or just to rename it.

  A friend who did a philosophy minor also says Chalmers isn't a Cartesian dualist at all, that he's sympathetic to some kind of Russellian monism, and that the zombie argument doesn't hand you that on its own. If she's right, then the last part of the box looks like it's riding on something the argument never delivered. But the part about behavior never being evidence is the bit I actually care about — I want to know whether it survives even if the rest of the summary is junk.

  Could you go through the box claim by claim: what someone who works on this would accept, what they'd want restated more carefully, and what is just wrong? Please flag where you're reporting something uncontroversial among people in the field and where reasonable specialists actually split — I'd much rather be told "people divide on this" than be handed a verdict. Then say whether each of the two upshots it draws (consciousness as a non-physical extra in Descartes's sense; behavior and function as no evidence at all for consciousness) follows from the corrected argument, fails to follow, or needs extra premises nobody has given me.

  Sections, please, in this order: "Line-by-line" (around 500 words, take the claims in the order the box makes them), "What the argument is actually aimed at" (around 200, if the target isn't what the chapter says it is), "Settled vs contested" (around 200), "Do the upshots survive" (around 200). American English, and no citations or links — i'm on the subway and want something I can read offline.
