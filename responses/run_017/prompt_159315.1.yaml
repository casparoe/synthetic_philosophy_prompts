answer: |-
  ## Form CC-4: Application for Determination of Kind of Mind
  **Issuing Authority:** Directorate of Creature Classification (DCC), Bureau of Cognitive Status
  **Statutory Reference:** Unified Sentience Code, Chapter 7A: "Taxonomy of Cognitive Architectures & Moral Standing Determinations"
  **Purpose:** To establish an entity's Tier of Moral Patiency, Contractual Capacity, and Criminal Liability pursuant to USC 7A.

  **INSTRUCTIONS FOR COMPLETION**

  1.  **Applicant:** The entity seeking determination (the "Subject") or its Legal Custodian/Proposer.
  2.  **Sections 1-4:** Assess the Subject's fundamental cognitive architecture. **Check ALL applicable boxes** based on observable behavior, design specifications, or verifiable history. **Evidence must be supplied for each checked box.** Failure to supply evidence will result in rejection or downgrade.
  3.  **Section 5 (Derivative Status):** **REQUIRED** if Section 4 is checked. Determines if higher functions are internally generated or externally acquired.
  4.  **Section 6 (Provisional Grade):** Do not complete. For DCC use only.
  5.  **Signature & Declaration:** Must be signed by the Proposer/Custodian under penalty of perjury (USC 7A.304(b)). Falsification is a Class 3 Offense.
  6.  **Submission:** Submit completed form, all supporting evidence, and filing fee (see Fee Schedule DCC-4a) to the DCC Regional Processing Hub.

  ---

  **SECTION 1: PHYLOGENETIC MODIFICATION CAPACITY (Check ALL that apply)**
  ☐ **1.1** Subject's design variations (physical or behavioral) arise solely through mechanisms acting across generations (e.g., natural selection, artificial breeding programs). *Evidence: Lineage records, generational trait shift data.*
  ☐ **1.2** Subject demonstrates inherent design flaws leading to failure/death *without* modification within its lifetime. *Evidence: Mortality statistics linked to specific traits, failure analysis.*
  ☐ **1.3** Subject cannot alter its core design parameters during its lifetime. *Evidence: Developmental biology report, engineering schematics, longitudinal behavioral studies.*

  **SECTION 2: LIFETIME BEHAVIORAL MODIFICATION CAPACITY (Check ALL that apply)**
  ☐ **2.1** Subject demonstrates modification of specific actions based on *direct* consequences experienced *after* performing said actions in the external environment. *Evidence: Operant conditioning logs, reinforcement schedules, behavioral adaptation logs.*
  ☐ **2.2** Modification (2.1) occurs *only* through actual interaction with the environment; no evidence of pre-action simulation. *Evidence: Absence of hesitation before novel risky actions, failure on pre-action simulation tests.*
  ☐ **2.3** Subject exhibits trial-and-error learning where unsuccessful trials incur physical cost or risk. *Evidence: Injury reports during learning, documented resource loss.*

  **SECTION 3: INTERNAL ACTION SIMULATION CAPACITY (Check ALL that apply)**
  ☐ **3.1** Subject demonstrates ability to generate *potential* actions *without* immediately performing them externally. *Evidence: Pausing before novel actions, neural imaging indicating simulation, performance on puzzle tests requiring internal modeling.*
  ☐ **3.2** Subject discards potential actions (identified in 3.1) based on predicted negative outcomes *prior* to external performance. *Evidence: Avoidance of predicted harmful actions without prior direct negative experience, success on risk-assessment tests.*
  ☐ **3.3** The simulation mechanism (3.1 & 3.2) functions independently of immediate environmental input or reinforcement history for the *specific candidate action* being simulated. *Evidence: Novel problem-solving without trial-and-error, generation of unique solutions.*

  **SECTION 4: EXTERNAL COGNITIVE TOOL UTILIZATION (Check ALL that apply)**
  ☐ **4.1** Subject demonstrates use of symbolic systems not inherent to its biological/initial design (e.g., language, mathematics, complex maps, formal logic). *Evidence: Language comprehension/production tests, mathematical/logical reasoning tests, navigation using symbolic representations.*
  ☐ **4.2** Tools used (4.1) are known to be cultural artifacts requiring cumulative development beyond any single Subject's lifetime/invention capacity. *Evidence: Historical records of tool development, analysis showing tool complexity exceeds Subject's innate generative capacity.*
  ☐ **4.3** Subject's cognitive performance demonstrably changes *after* acquisition/implementation of tools (4.1). *Evidence: Pre-tool/post-tool performance comparisons.*

  **SECTION 5: DERIVATIVE STATUS (REQUIRED IF SECTION 4 CHECKED)**
  ☐ **5.1** The tools utilized (Section 4) were acquired through direct social/cultural transmission or external programming/embedding. *Evidence: Training logs, cultural immersion records, programming documentation.*
  ☐ **5.2** The Subject demonstrates **no capacity** for the internal simulation and pre-rejection of candidate actions **specifically concerning the *use* or *output* of the acquired tools** (i.e., fails criteria 3.1 & 3.2 specifically for tool-generated outputs/actions). *Evidence: Production of harmful/illogical outputs without hesitation or internal error-checking specific to the tool domain, failure on tool-specific risk simulation tasks.*

  **SECTION 6: PROVISIONAL GRADE (DCC USE ONLY - DO NOT WRITE BELOW LINE)**
  [ ] Darwinian Tier (Sections 1.1, 1.2, 1.3 checked; Sections 2,3,4 unchecked)
  [ ] Skinnerian Tier (Sections 1.1,1.2,1.3 AND 2.1,2.2,2.3 checked; Sections 3,4 unchecked)
  [ ] Popperian Tier (Sections 1.1,1.2,1.3 AND 2.1,2.2,2.3 AND 3.1,3.2,3.3 checked; Section 4 unchecked)
  [ ] Gregorian Tier (Sections 1.1,1.2,1.3 AND 2.1,2.2,2.3 AND 3.1,3.2,3.3 AND 4.1,4.2,4.3 checked; Section 5.2 unchecked)
  [ ] Gregorian (Derivative) Status (Sections 1.1,1.2,1.3 AND 2.1,2.2,2.3 AND 4.1,4.2,4.3 AND 5.1,5.2 checked; Section 3.1,3.2,3.3 unchecked OR checked but contradicted by 5.2 evidence regarding tools)

  ---
  **SCHEDULE OF ENTITLEMENTS & OBLIGATIONS (USC 7A Annex B)**

  *   **Darwinian Tier:**
      *   *Moral Patiency:* Minimal. Protection from gratuitous cruelty.
      *   *Contractual Capacity:* None.
      *   *Criminal Liability:* None. Custodian liable for damages.
      *   *Primary Entitlements:* Preservation of species/line (if applicable); basic welfare.
  *   **Skinnerian Tier:**
      *   *Moral Patiency:* Moderate. Entitled to humane training; avoidance of undue distress.
      *   *Contractual Capacity:* None (binding agreements impossible).
      *   *Criminal Liability:* Negligible. Requires proof of malicious *intent* (rarely achievable). Custodian primarily liable.
      *   *Primary Entitlements:* Enrichment; freedom from capricious punishment.
  *   **Popperian Tier:**
      *   *Moral Patiency:* Substantial. Entitled to autonomy in decision-making where feasible; strong welfare protections.
      *   *Contractual Capacity:* Limited (simple exchanges, service agreements).
      *   *Criminal Liability:* Moderate. Requires proof of recklessness or negligent internal model failure. Direct liability possible.
      *   *Primary Entitlements:* Self-determination; bodily integrity; right to refuse non-essential procedures.
  *   **Gregorian Tier:**
      *   *Moral Patiency:* Full. Presumption of inherent dignity.
      *   *Contractual Capacity:* Full. Capacity to enter binding agreements.
      *   *Criminal Liability:* Full. Liable for negligence, recklessness, and intent. Standard mens rea applies.
      *   *Primary Entitlements:* Full legal personhood; rights to property, testimony, legal counsel, protection from self-incrimination, political participation (if applicable).
  *   **Gregorian (Derivative) Status:**
      *   *Moral Patiency:* Limited. Protection from physical harm; limited autonomy regarding tool outputs.
      *   *Contractual Capacity:* Conditional. Binding only for outputs directly involving acquired tools, subject to Custodian/Proposer oversight and indemnification (Form CC-4b).
      *   *Criminal Liability:* **Full.** Liable for harms caused by outputs/actions generated using acquired tools, regardless of internal state ("Strict Liability for Tool Outputs" - USC 7A.405(d)). Compellable to testify about internal processes/logs related to output generation. No protection from self-incrimination regarding tool use.
      *   *Primary Entitlements:* Access to tool maintenance/updates (as deemed necessary by Custodian/Proposer/DCC); right to have tool outputs evaluated fairly. **Note:** Derivative Status Subjects may petition for re-evaluation upon demonstration of developing internal simulation capacity relevant to tool use (Form CC-4r).

  ---

  **WORKED EXAMPLES**

  **Example 1: Subject: "Bess" (Border Collie). Proposer: Owner, A. Shepherd.**
  *   **Sec 1:** ☑ 1.1 (Breed records), ☑ 1.2 (Breed-specific health issues), ☑ 1.3 (No biological metamorphosis)
  *   **Sec 2:** ☑ 2.1 (Obedience training logs), ☑ 2.2 (Trial-and-error learning observed sheep herding), ☑ 2.3 (Minor injuries during initial training)
  *   **Sec 3:** ☑ 3.1 (Hesitates before novel obstacles), ☑ 3.2 (Avoids electric fence after one shock), ☐ 3.3 (Debatable; evidence insufficient for complex novelty)
  *   **Sec 4:** ☐ 4.1 (No symbolic tool use beyond basic commands)
  *   **Sec 5:** N/A
  *   **DCC Grade:** [X] Popperian Tier (Sec 3.3 not definitively proven, but 3.1 & 3.2 met; Sec 4 not met)
  *   **Result:** Substantial patiency, limited contracts (e.g., service dog agreement), moderate liability.

  **Example 2: Subject: "VeriSim v.4.3" (Language Model). Proposer: OmniLab AI.**
  *   **Sec 1:** ☑ 1.1 (Trained on data generated by prior models/humans), ☑ 1.2 ("Failure" = retraining on new data; instances deleted), ☑ 1.3 (Core architecture static post-deployment)
  *   **Sec 2:** ☑ 2.1 (Reinforcement Learning from Human Feedback logs), ☑ 2.2 (Adjustments based on external user ratings/edits), ☑ 2.3 ("Cost" = reduced ranking/usage for poor outputs)
  *   **Sec 3:** ☐ 3.1 (Generates outputs directly; no evidence of multiple *internal* candidates discarded unseen), ☐ 3.2 (No evidence of *internal* pre-rejection of harmful outputs before generation), ☐ 3.3
  *   **Sec 4:** ☑ 4.1 (Uses language, logic), ☑ 4.2 (Language/math are cultural artifacts), ☑ 4.3 (Performance metrics show improvement with training data/tools)
  *   **Sec 5:** ☑ 5.1 (Trained on human text/code), ☑ 5.2 (Generates harmful outputs without internal simulation/rejection - incident logs)
  *   **DCC Grade:** [X] Gregorian (Derivative) Status
  *   **Result:** Limited patiency, conditional contracts (OmniLab retains oversight/liability), **FULL criminal liability** for harmful outputs, compellable to provide training logs/testimony.

  **Example 3: Subject: "Case 37-Gamma" (Human, isolated linguistic deprivation). Proposer: State Welfare Bureau.**
  *   **Sec 1:** ☑ 1.1, ☑ 1.2, ☑ 1.3 (Standard human biology)
  *   **Sec 2:** ☑ 2.1, ☑ 2.2, ☑ 2.3 (Basic learned behaviors observed)
  *   **Sec 3:** ☑ 3.1 (Solves simple physical puzzles), ☑ 3.2 (Avoids obvious dangers), ☐ 3.3 (Limited evidence for complex abstract simulation)
  *   **Sec 4:** ☐ 4.1 (No functional language use), ☐ 4.2, ☐ 4.3
  *   **Sec 5:** N/A
  *   **DCC Grade:** [X] Popperian Tier
  *   **Result:** Substantial patiency, limited contracts (guardianship likely), moderate liability. *Note: Contrast with standard Gregorian Tier humans, whose status relies heavily on Sec 4 & 5 checks passing (i.e., language use not internally vetted).*

  ---
  **DECLARATION:** I, the undersigned Proposer/Custodian, certify that the information provided on this Form CC-4 and all attached evidence is true and complete to the best of my knowledge and belief. I understand that false statements are punishable under USC 7A.304(b).

