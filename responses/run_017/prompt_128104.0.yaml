prompt: |-
  My politics tutor is a pretty hardline Nozickian, and I've been keeping a list of her verdicts on cases we've gone through:

  - Wilt Chamberlain: the resulting distribution is just, and taxing it back is on a par with forced labour.
  - A homesteader who fences off an unclaimed field when there's plenty of similar land left nearby: fine, and she owes later arrivals nothing.
  - A painting looted in the 1940s and bought in good faith thirty years later: goes back to the original owner's heir, and no compensation for the buyer.
  - A firm that patents a compound a community had been using for centuries and then charges monopoly prices: not a legitimate holding — though she's said she can't decide whether that's because the stuff was never unowned or because the community ends up worse off.
  - Copying a recipe out of a published cookbook and opening a rival restaurant that ends up driving the original one out of business: fine, nothing was taken.

  New case, which I get to pick for next week: a company copies, without asking anyone, every publicly posted text on the internet, trains a model on it and sells access. Nobody is worse off at the moment of copying — the texts were free to read anyway — but the model then substitutes for a lot of the writers, many of whom lose most of their income. The company makes billions. A hundredth of one percent of writers used the opt-out form.

  What will she say about whether that's a legitimate holding? I care much less about the verdict than about the rule she's running. I can see two or three rules that fit all five earlier verdicts equally well and come apart here: something about the proviso being a one-off gate at acquisition vs a standing condition, something about information not being the kind of thing you can appropriate because it isn't rival, something about the wrong being use-without-say-so rather than anyone being made worse off. Tell me which of those (or what else) she's really running, what each candidate predicts here, your best guess with the reason for preferring it over the runner-up, and the single further case that would best tell the top two apart. She also doesnt accept "everyone is better off in aggregate" as an answer to anything.

  Lead with your bottom line in the first sentence — verdict plus rule — then the reasoning, no preamble and no restating the question. British English, and no citations, I'll add those myself.
reasoning: |-
  Okay, the user's politics tutor is a hardline Nozickian, and they've provided five cases with her verdicts. Now they have a new case about a company copying all public internet text to train an AI model, which then makes billions while causing many writers to lose income. The user wants to predict the tutor's verdict and understand the underlying rule she's applying, especially since several rules might fit the previous cases but diverge here.

  First, I need to recall Nozick's key principles from "Anarchy, State, and Utopia." His entitlement theory focuses on justice in holdings through original acquisition, transfer, and rectification. The Lockean proviso is crucial—appropriation is just if it leaves "enough and as good" for others. Also, Nozick emphasizes property rights and voluntary exchange, opposing patterned distributions.

  Looking at the previous cases:
  - Wilt Chamberlain: Just distribution; taxing it back is forced labor. This highlights voluntary transfers and opposes redistribution.
  - Homesteader: Fencing off land is fine; no obligation to later arrivals. Supports original acquisition under the proviso if enough resources remain.
  - Looted painting: Returned to original owner's heir; no compensation for buyer. Stresses rectification for past injustices, regardless of current buyer's good faith.
  - Patenting traditional compound: Not legitimate. Possible reasons: never unowned or community worse off. This indicates the proviso might be violated if appropriation harms others.
  - Copying recipe: Fine, nothing taken. Information isn't rivalrous; no property right infringed since no physical taking.

  The new case involves non-rivalrous information. The company copies publicly available texts, trains a model, and sells access. Writers lose income, but no one was worse off at the time of copying. The key issues are whether copying constitutes appropriation and if the proviso applies.

  Possible rules the tutor might use:
  1. **Proviso as one-off gate vs. standing condition**: If the proviso is only checked at acquisition (one-off), copying might be fine since texts were public. But if it's a standing condition (ongoing), the harm to writers might violate it.
  2. **Information non-rivalry**: Since information isn't rivalrous, copying doesn't deprive others, so no appropriation issue. This fits the recipe case.
  3. **Use-without-consent vs. harm**: The wrong might be using without permission, not necessarily causing harm. Here, texts were public, so maybe no issue, but opt-out existence complicates consent.

  From the patent case, the tutor couldn't decide between "never unowned" or "worse off," suggesting she might lean towards harm mattering. However, the recipe case shows that non-rival information use is permissible without consent. 

  The AI case differs because the model substitutes writers, causing harm. But at the time of copying, no harm occurred. Nozick’s proviso typically applies at acquisition. Since the information was publicly posted, copying might be seen as permissible use. The opt-out form's low usage might imply implied consent, but that's weak.

  The tutor would likely say the holding is legitimate. Copying public info doesn't violate rights as it's non-rival; the harm is indirect competition, similar to the recipe case. The proviso was satisfied initially (enough left), and later harm doesn't invalidate it. The verdict aligns with non-rivalry and no initial harm.

  The runner-up might be the proviso as standing condition, but the homesteader case suggests no ongoing obligations. The looted painting case is about rectification, not applicable here. 

  To distinguish between one-off proviso and non-rivalry, a case where copying causes immediate harm or where information is rivalrous (e.g., a secret recipe stolen) could test this. But since information is inherently non-rival, non-rivalry seems more consistent.
answer: |-
  The holding is legitimate because the copied texts were non-rivalrous information publicly available without access barriers, so copying them violated no property right or Lockean proviso at acquisition, and subsequent indirect economic harm is irrelevant under Nozickian entitlement theory.  

  **Reasoning**: Your tutor's prior verdicts consistently prioritise initial appropriation justice and absolute property rights over outcomes. The *Wilt Chamberlain* and *homesteader* cases show she views the Lockean proviso ("enough and as good left") as a one-time gate at acquisition—not an ongoing welfare guarantee. The *recipe* verdict confirms non-rivalrous information (like text) isn't "taken" when copied, as it leaves the original intact. The *looted painting* outcome emphasises historical injustice trumping good-faith possession, irrelevant here where texts were voluntarily posted. The *patent* case’s ambiguity suggests she hesitates when appropriation *directly* deprives others of existing use, but this differs: writers weren’t deprived of their texts; they faced later competition from new technology.  

  For this case:  
  - **Rule applied**: **Information non-rivalry is decisive**. The texts were non-excludable (publicly posted), non-rivalrous (copied without depriving owners), and copying didn’t breach the proviso—"enough and as good" remained for others at the moment of acquisition. The economic harm is a market consequence, not a rights violation, echoing *Chamberlain* (taxation as forced labour) and *recipe* (no restitution for competitive loss).  
  - **Rejected alternatives**:  
    - *Proviso as standing condition*: Would deem the holding unjust due to writers’ later impoverishment. But the *homesteader* verdict (no aid to latecomers) shows she rejects ongoing proviso obligations.  
    - *Use-without-consent as wrong*: The opt-out form’s existence might imply consent was required. Yet the *recipe* case (no permission needed to copy published information) overrules this.  
  - **Why non-rivalry wins**: It cleanly explains all five cases. The *patent* verdict’s uncertainty involved rivalrous resources (a compound), unlike digital text. The writers’ loss stems from innovation displacing labour—a "creative destruction" Nozickians accept unless force or fraud occurs (absent here).  

  **Best distinguisher case**: *A researcher secretly observes a private cooking technique through a restaurant’s window, replicates it identically, and monopolises the market, ruining the original chef*.  
  - **Non-rivalry rule** predicts legitimacy (technique isn’t "used up" by observation).  
  - **Use-without-consent rule** predicts injustice (implicit trespass/secrecy implies non-consensual acquisition).  
  This tests whether mere access method (public vs. covert) overrides information non-rivalry, isolating your tutor’s view on appropriation boundaries.
