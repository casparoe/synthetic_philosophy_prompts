prompt: |-
  I am preparing the sunk-cost session for an upper-level seminar on practical rationality, and I would be grateful for an audit of two analogies that are doing a great deal of unexamined work in it.

  A colleague in the economics department has been asked to advise our provost on whether to continue a large capital project that is over budget, behind schedule, and politically unpopular. His one-page memo rests entirely on two pictures: that continuing is like throwing good money after bad, and that grieving what has already been spent is like crying over spilt milk. The conclusion he draws is unqualified — no rational agent permits a bygone to influence a forward-looking choice — so that every consideration the committee is tempted to raise (the money already sunk, the promises already made, the embarrassment of abandoning a project the university publicly championed) is strictly irrelevant, and the sole remaining question is the ratio of future costs to future benefits.

  My own counter-analogy pulls the other way: the commander who burns his boats on landing, so that retreat ceases to be one of his options and both his own future self and his adversaries may rely on his staying. Here the point of the past outlay is precisely that it constrains the future, and this looks to me not merely rational but prudent. The two pictures cannot both be carrying the weight their users place on them.

  What I want is an audit of each. For both analogies: an explicit mapping of what corresponds to what in my colleague's case (a table of correspondences is welcome); the features of the source domain that the analogy quietly imports and that the target lacks; the points at which the mapping breaks; and — this is the part I care about — which of those breaks matter for the use to which the analogy is being put and which are merely decorative. Then tell me whether the unqualified conclusion survives, and if it survives only in restricted form, state the restriction.

  Three constraints I want the verdict answerable to, because these are the cases on which I keep losing my grip:

  (i) Ledger-sunk versus residue-bearing outlay. The money is gone either way, but spending typically leaves something durable behind: a half-built structure, a trained team, forty annual waves of a longitudinal dataset whose next wave is worth more than its first precisely because the earlier ones exist, a reputation for finishing what one begins. These strike me as forward-looking considerations that merely happen to be caused by past outlay. Is there a formulation of the bygones principle that condemns the first while permitting the second, or do the analogies conceal a distinction the principle itself needs?

  (ii) Outlay as evidence rather than as cause. I suspect much apparent sensitivity to past investment is better explained as sensitivity to information: that I, or a better-informed earlier self, or a committee that screened the project, invested at all is evidence about its prospects; that others are abandoning is evidence the other way. If so, the milk-and-money picture imports the assumption that the past outlay is known to be pure loss and carries no news. Tell me how much of the phenomenon that explains and where it runs out. Note too that the aircraft which gave this fallacy its second name was continued for reasons of prestige, industrial capability and employment that were not bygones at all, which makes me suspect the label begs the question it names.

  (iii) The strategic and diachronic cases: commitments credible only because retreat is expensive; promises, vows and public declarations that alter what is permissible rather than what is advantageous; the fact that quitting is itself not free; and the possibility that a standing policy of never abandoning what one has begun beats case-by-case optimization when returns are back-loaded and one's own judgment about when to quit is unreliable. Relatedly, I have the impression that people escalate more readily when they made the original decision than when it was thrust upon them — is that a mark of irrationality, or a mark of exactly the information-and-commitment structure I have been describing?

  Finally, say what a better analogy would be, if there is one, and close with a single machine-readable line: \answer{...} containing exactly one of survives, survives-in-restricted-form, or does-not-survive, followed, if you choose the middle option, by the restriction in no more than ten words.
reasoning: |-
  Hmm, the user is preparing a seminar on sunk costs and wants me to audit two analogies used in rational decision-making. They're dealing with an economist colleague who uses the "throwing good money after bad" and "crying over spilt milk" analogies to argue that past costs should never influence future decisions. The user counters with the "burning boats" analogy, where past actions deliberately constrain future options. I need to carefully analyze each analogy and see if the economist's unqualified conclusion holds up.

  First, I should map out each analogy to the provost's situation. For the economist's analogies: "throwing good money after bad" corresponds to continuing spending on the failing project, which is like pouring more resources into something already lost. "Crying over spilt milk" is about lamenting money already spent - the sunk costs that can't be recovered. The key assumption here is that sunk costs are pure losses with no residual value.

  For the user's "burning boats" analogy, this represents deliberately making retreat impossible to signal commitment. In the provost's case, this would map to the sunk costs creating constraints like reputational damage or contractual obligations that actually shape future options. This analogy assumes that sunk costs create strategic advantages or constraints.

  Now I need to identify where these analogies break down. The money/milk analogies fail when sunk costs leave behind valuable residues like partial construction or trained teams, or when they provide information about project viability. The burning boats analogy breaks when there's no strategic benefit to commitment, or when the costs of continuing outweigh any benefits.

  The user has raised three important constraints I need to address. First is the distinction between "ledger-sunk" costs (pure losses) and "residue-bearing" outlays that create future value. The economist's analogies don't account for this distinction. Second is when past spending provides evidence about a project's potential - the milk analogy assumes we already know the milk is spoiled, but sometimes we learn from the spill. Third are strategic considerations like credible commitments, reputational effects, and policy-level thinking about abandonment.

  I think the economist's unqualified conclusion doesn't survive because it ignores these nuances. The principle should be restricted to cases where sunk costs are truly irrecoverable and create no strategic value or information. A better analogy would be "continuing construction on a shaky foundation" - you have to assess both the existing structure and future costs.

  For my final answer, I'll say the conclusion survives only in restricted form: when sunk costs leave no residue, carry no information, and create no strategic constraint. This covers the core cases while acknowledging the important exceptions the user has raised.
answer: |-
  Here is a rigorous audit of the analogies, addressing your constraints and questions:

  ### 1. **Economist's Analogies: "Throwing Good Money After Bad" & "Crying Over Spilt Milk"**
     - **Mapping to Provost's Case:**
       | Source Domain          | Target Domain (Provost's Case)       |
       |------------------------|--------------------------------------|
       | "Good money"           | Additional future funding            |
       | "Bad" (lost money)     | Already-spent sunk costs             |
       | "Throwing after"       | Continuing the project               |
       | "Spilt milk"           | Irrecoverable past expenditure       |
       | "Crying over"          | Lamenting/considering sunk costs     |
       | Milk's irrecoverability| Sunk costs' irreversibility          |

     - **Imported Features & Target Deficiencies:**
       - Assumes sunk costs are *pure losses* with **zero residual value** (no half-built structure, reputation, or dataset continuity).
       - Implies **no informational content** from past spending (the "milk" is known spoiled; no learning occurred).
       - Presupposes decisions are **atomistic and ahistorical** (no strategic interdependence between past/future actions).

     - **Critical Breakpoints:**
       - **Mattering Breaks:** 
         - Ignores *residues* (Constraint i): Past spending creates assets (e.g., construction progress, team expertise) altering *future* cost-benefit ratios. Sunk costs aren't "spilt milk" if they leave usable residue.
         - Denies *informational value* (Constraint ii): Past investment signals initial confidence; abandoning may signal failure, affecting stakeholder trust (e.g., donors).
       - **Decorative Breaks:** 
         - Physical vs. financial irreversibility (milk can't be unspilled; money *can* sometimes be partially recouped via asset sales).

  ### 2. **Your Counter-Analogy: "Burning Boats"**
     - **Mapping to Provost's Case:**
       | Source Domain          | Target Domain (Provost's Case)       |
       |------------------------|--------------------------------------|
       | Burning boats          | Sunk costs as irreversible commitment|
       | Commander              | University leadership                |
       | Retreat becoming impossible | Abandonment becoming prohibitively costly |
       | Adversaries/own troops | Stakeholders (donors, public, faculty)|
       | Staying/resolve        | Project continuation                 |

     - **Imported Features & Target Deficiencies:**
       - Assumes **strategic interaction** where commitment alters others' behavior (e.g., deterring opposition, rallying supporters).
       - Presupposes **retreat costs exceed continuation costs** (burning boats rational only if winning is probable/valuable enough).

     - **Critical Breakpoints:**
       - **Mattering Breaks:** 
         - Only applies if stakeholders *observe and react* to commitment (Constraint iii). If abandonment costs are low (no reputational harm), the analogy fails.
         - Requires *credibility*: Burning boats only works if adversaries believe retreat is truly impossible. Half-built structures may not signal commitment if abandonment is common.
       - **Decorative Breaks:** 
         - Physical destruction vs. financial/social costs (boats are materially gone; sunk costs may leave reusable assets).

  ---

  ### **Audit of the Unqualified Conclusion**
  The economist's conclusion ("**no rational agent permits a bygone to influence a forward-looking choice**") **survives-in-restricted-form**.  

  #### **Restriction (9 words):**  
  *When sunk costs leave no residue, carry no information, and impose no strategic constraints.*

  #### **Why, per Your Constraints:**
  - **(i) Residue-Bearing Outlays:** The principle condemns *only* "ledger-sunk" costs (e.g., wasted labor hours). Residues (half-built labs, datasets) are *future assets* and legitimately affect cost-benefit analysis. The analogies conceal this; the principle must exclude residues.
  - **(ii) Outlay as Evidence:** Past spending *is* rationally considered if it updates priors (e.g., cost overruns suggest management failures). The milk analogy assumes perfect foreknowledge (milk *known* spoiled). Where spending reveals new information (e.g., technical feasibility), it’s not irrational to factor it in. The Concorde fallacy mislabels non-sunk motivations (e.g., industrial capability) as sunk-cost bias.
  - **(iii) Strategic/Diachronic Cases:**  
    - *Credible commitments*: Sunk costs alter game-theoretic payoffs (e.g., reputation for persistence attracts partners).  
    - *Decision ownership*: Escalation when one initiated the project may reflect accountability to past promises (a *forward-looking* reputational concern), not irrationality.  
    - *Policy vs. case-by-case*: A "never abandon" rule may optimize if self-control or judgment is unreliable (e.g., preserving long-term research integrity).  

  ---

  ### **A Better Analogy: "Continuing Construction on a Shaky Foundation"**  
  - **Why it works:**  
    - Acknowledges residues (existing structure) while forcing evaluation of *future* costs to repair/complete vs. abandon.  
    - Incorporates informational value (foundation flaws reveal engineering risks).  
    - Allows strategic factors (e.g., completing a visible project maintains municipal goodwill).  
  - **Machine-readable Answer:**  

  \answer{survives-in-restricted-form When sunk costs lack residue, information, or strategic role}
