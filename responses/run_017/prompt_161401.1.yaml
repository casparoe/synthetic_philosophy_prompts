  We are creating a quiz to sort people into different accounts of blame based on their reactions to concrete cases. The quiz must separate the fittingness of blame (whether it is deserved or appropriate in principle) from the appropriateness of expressing or acting on that blame (whether it is all-things-considered right to do so in practice). We have several cases that involve odd blame-targets to tease apart different intuitions.

  The positions we want to map to (leaves) are:
  1. Strawsonian (participant stance): blame is fitting when there is a quality of will (e.g., ill will, indifference) that is lacking in the required goodwill.
  2. Scanlonian: blame is fitting when an action shows that the agent's attitudes impair the relations that the blamer can have with them, and blame is a modification of the relationship.
  3. Reasons-responsiveness / fair opportunity: blame is fitting when the agent had the capacity to recognize and act on moral reasons and a fair opportunity to do so.
  4. Deep-self or identification: blame is fitting when the action expresses the agent's deep self (values, commitments) and they identify with it.
  5. Forward-looking, consequentialist: blame is not about desert but about its consequences (e.g., deterrence, reform).
  6. Hard-incompatibilist/revisionist: no one is blameworthy in a desert-entailing sense (so blame is never fitting in that sense, but might be expressed for consequentialist reasons).
  7. Fittingness-only: blame is often fitting (in a desert sense) but almost never all-things-considered appropriate to express or act on (due to other considerations).

  We need 10 questions (cases). Each case will have three answer options that capture:
  A. The person feels the reactive attitude (e.g., resentment) and thinks it is the right response (fitting and appropriate to express).
  B. The person feels the reactive attitude but thinks they should not feel that way or express it (fitting but not appropriate to express).
  C. The person does not feel the reactive attitude, or feels something else (like concern) and moves to a more objective stance.

  The scoring will map patterns of answers to the positions.

  We also note that some cases must involve:
  - A corporation
  - A friend who died last year
  - A chatbot
  - A four-year-old
  - Yourself last Tuesday
  - The distracted driver (no ill will, just carelessness)
  - Two people who do the identically careless thing but with different outcomes (one victim walks away, one dies)
