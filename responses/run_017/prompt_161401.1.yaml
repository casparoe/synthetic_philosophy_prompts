  - **Reasons-responsiveness**: Typically A in case 1, 4; C in case 3, 9; C in case 6 (attitude not acted on) because no action? But case 6 is about attitude without action, so they might choose C.

  - **Deep-self**: Typically A in case 4 (bad motive reflects deep self), might be A in case 6 if the attitude is deep, but C in case 3 if the cruelty is not endorsed by the deep self? This view is hard to pin down.

  - **Consequentialist**: C in all or most cases.

  - **Hard-incompatibilist**: B or C in all cases.

  - **Fittingness-only**: B in all or most cases.

  We might not be able to distinguish Scanlonian from Strawsonian with these cases, or deep-self from others. But the group can discuss.

  We'll also note that some combinations are unattractive or untried. For example, choosing A for the chatbot (case 10) is rare and might be incoherent because chatbots aren't moral agents. Choosing A for the child (case 9) might be seen as unattractive.

  In the handout, we'll present the cases and then the scoring key with these guidelines.

  Now, to write the quiz.
