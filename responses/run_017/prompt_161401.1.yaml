  We must avoid any jargon. The cases must be described in plain language.

  Let's create the 10 cases:

  1. **Case: Distracted Driver**
     - Scenario: A driver glances at a text message and accidentally hits a cyclist. The driver had no ill will and is devastated by the accident.
     - Question: How would you react toward the driver?
     - A: You feel resentment and think it's right to blame them.
     - B: You feel resentment but think it's not right to express it because they didn't mean to.
     - C: You don't feel resentment; you just feel concern about how to prevent such accidents in the future.

  2. **Case: Different Outcomes for Identical Carelessness**
     - Scenario: Two drivers are equally careless (e.g., both texting while driving). One causes a minor scare (the victim walks away), the other causes a fatal accident.
     - Question: How do you feel about the two drivers?
     - A: You feel more resentment toward the driver who caused the death, and that seems right.
     - B: You feel more resentment toward the one who caused the death, but you think it's unfair to feel that way because they were equally careless.
     - C: You feel the same level of resentment (or none) toward both, because the carelessness was the same.

  3. **Case: Raised with Cruelty as Kindness**
     - Scenario: Someone was raised to believe that a cruel practice (e.g., harsh physical discipline) is an act of kindness. They sincerely believe they are helping when they use it on their child.
     - Question: How do you react toward this person?
     - A: You feel resentment and think they are blameworthy.
     - B: You feel resentment but think it's not fair to blame them because they don't know better.
     - C: You don't feel resentment; you focus on how to educate them.

  4. **Case: Right Thing for Worst Reason**
     - Scenario: A person donates a large sum to charity solely to get a tax break and impress others, not because they care about the cause.
