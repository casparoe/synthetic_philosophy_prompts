prompt: |-
  you're a philosopher of biology who's spent way too much of your career on the function debate. think carefully, and before you write anything, brainstorm a bit about which demands people place on a theory of function are genuine desiderata and which are just the prejudices of one camp.

  I want the requirements list, not the theory. Fix the purpose up front: an account of biological function good enough to (i) license the teleological and malfunction talk that molecular biologists and clinicians actually use, and (ii) be applicable to a system before anyone knows its evolutionary history. Given that purpose, what does such an account have to deliver -- which cases must it get right, which distinctions must it not collapse, which bits of scientific practice must it not contradict?

  Cases I keep tripping over, use them or replace them: a de novo gene with no homologs that's clearly doing work in the cell; the very first bearer of a beneficial variant, before selection has had a single generation to act on the lineage; a subsystem in an engineered minimal cell that's kept in being by a designed repair loop; a trait shaped for one effect that now does a different one; a congenitally malformed heart that has never once pumped properly. And don't collapse having a function with performing it, or a function with a mere effect.

  For each requirement give the case or consideration behind it, and mark whether it's non-negotiable or a preference. Then the part I actually care about: is some subset of them jointly unsatisfiable, so that the list itself is a result? And which single requirement knocks out the most contenders? End with a one-line-per-view scorecard for selected-effects, causal-role/organizational, and whatever hybrid you prefer -- no citations needed, I know who says what. keep it tight.
reasoning: |-
  Okay, the user wants me to act as a philosopher of biology specializing in the function debate. They need a list of requirements for a theory of biological function that serves two specific purposes: (1) licensing the teleological and malfunction talk used by molecular biologists and clinicians, and (2) being applicable before evolutionary history is known. 

  First, I need to distinguish genuine desiderata from mere prejudices. Genuine desiderata should directly support the stated purposes, while prejudices might come from specific philosophical camps like SE or CR theories. For example, SE theorists often insist on historical selection as essential, but that conflicts with purpose (ii) - applicability without knowing evolutionary history. So prioritizing history is likely a prejudice here. CR theorists might downplay malfunction, but that's a genuine need for clinicians.

  The user provided several tricky cases to test the requirements. Let me map each case to potential requirements:

  - De novo gene: requires functions without evolutionary history. Non-negotiable for purpose (ii).
  - First beneficial variant: same as above, emphasizes function before selection acts. Non-negotiable.
  - Engineered minimal cell: challenges naturalness assumptions, tests if artificial maintenance counts. Non-negotiable for covering synthetic biology.
  - Trait with changed effect: needs distinction between original and current function. Non-negotiable to avoid collapsing historical vs. current roles.
  - Malformed heart: requires clear malfunction concept. Non-negotiable for clinicians.

  Other key requirements include distinguishing function from mere effect (e.g., heart sounds vs pumping), and function from performance (malfunction cases). Preventing collapse of these is non-negotiable.

  Now, assessing joint unsatisfiability: The big tension is between "Function Without History" (de novo/first variant cases) and "Function Without Current Action" (malfunction case). SE theories fail the first, CR theories struggle with the second. A hybrid might handle both but could face "Non-Circular Maintenance" issues in minimal cell case.

  The requirement that knocks out most contenders is likely "Function Without Current Action" - it eliminates pure CR theories. SE theories fail on history-free cases. Hybrids like Bigelow/Pargetter or Moreno/Moss can handle more but have trade-offs.

  For the scorecard:
  - SE: Fails history-free cases, excels in malfunction and history-dependent contexts.
  - CR: Fails malfunction cases, good for history-free and current roles.
  - Hybrids: Best compromise but may have circularity issues in designed systems.

  The user's deep needs seem to be a practical, clinically applicable function theory that doesn't rely on speculative evolutionary histories. They want clarity on trade-offs between existing approaches, possibly to develop or advocate for a new synthesis. The analysis shows no perfect solution, highlighting why the debate persists.
answer: |-
  Here's a breakdown of genuine desiderata for your specified purpose, separating them from common prejudices, grounded in your cases and scientific needs. The core tension is exposed.

  **Genuine Desiderata (Non-Negotiables for Purpose):**

  1.  **Function Without History:** Must assign functions to traits in systems where *no* evolutionary history is known or exists. *(Cases: De novo gene; Engineered minimal cell subsystem; First bearer of a beneficial variant before selection acts)*
  2.  **Malfunction is Possible & Meaningful:** Must coherently distinguish a trait that *has a function* but *fails to perform it* (or performs it poorly) from one that simply lacks that function. *(Case: Congenitally malformed heart that never pumped properly)*
  3.  **Function vs. Mere Effect:** Must distinguish effects that *are* the function from effects that are merely causal consequences, even beneficial ones. *(Case: Heart sounds are an effect of pumping, but pumping is the function; trait shaped for one effect now doing a different one - which one is "the function" now?)*
  4.  **Function vs. Performance:** Must distinguish *having* a function from *currently performing* it. (Linked to Malfunction). *(Case: Malformed heart has pumping function but doesn't perform it; healthy heart at rest has function but isn't currently performing it)*
  5.  **Current Relevance:** Functions must be grounded in the *current* constitution and dynamics of the system, not solely in a distant past. *(Motivation: Molecular/Clinical practice focuses on present mechanisms; Cases: De novo gene, Minimal cell, Beneficial variant pre-selection - what it's doing NOW matters)*
  6.  **Maintenance Requirement:** Must explain *why* the trait is present/persists *in this system*. Function should be linked to why the system maintains it. *(Cases: Minimal cell subsystem kept by repair loop; De novo gene integrated into cellular processes; Trait co-opted for new effect - why is it still there?)*
  7.  **Avoid Collapsing Historical & Current Roles:** Must allow that a trait's *current* function (why it's maintained *now*) can differ from its *historical* function (why it was originally selected, if it was). *(Case: Trait shaped for one effect that now does a different one)*

  **Common Prejudices (Not Required for *This* Purpose):**

  1.  **Historical Essence:** The idea that historical selection *must* be the *sole* or *defining* factor for *all* functional attributions. (SE prejudice - conflicts with Purpose ii & Cases 1,2,3).
  2.  **Exclusively Causal Contribution:** The idea that function *only* means "current causal role within the system," potentially ignoring why the trait exists there or allowing malfunction. (CR prejudice - conflicts with Desideratum 2 & 6).
  3.  **Requiring Natural Selection:** Insisting functions only exist in naturally evolved systems. (SE prejudice - conflicts with Minimal cell case).
  4.  **Requiring Beneficial Effects Now:** Insisting a function must *currently* benefit the system/organism. (CR-leaning prejudice - conflicts with Malfunction case & Function vs. Performance).
  5.  **Eliminativism about Teleology:** Demanding the account eliminates all normative/directed language rather than licensing it. (Anti-teleology prejudice - conflicts with Purpose i).

  **The Core Tension (Joint Unsatisfiability?):**
  The major tension lies between **Malfunction (2)** and **Function Without History (1)**, mediated by the **Maintenance Requirement (6)**.
  *   To get **Malfunction (2)**, you need a normative standard: what the trait *is supposed to do*. This standard is often grounded in what it was *selected for* (History) or what it *typically does* (in a population). History-free accounts struggle to ground this norm non-circularly in the *current, individual* system.
  *   **Function Without History (1)** demands an account that works for individuals without a past. Pure current causal role struggles with **Malfunction (2)** (why is the broken heart *supposed* to pump?) and the **Maintenance Requirement (6)** (why is *this* causal role privileged as the function?).
  *   **Maintenance Requirement (6)** is the bridge. Explaining *why the trait is there now* (design, selection, current contribution to persistence) can provide the norm for function/malfunction. But grounding maintenance in the *individual system* without history or a reference class is hard. The Minimal Cell case highlights this – the repair loop defines the function *and* the norm for malfunction via design/purpose, but is "design" acceptable? The De novo gene – what maintains it? Its current causal role? But then why is *that* role its function and not another effect?

  **Requirement Knocking Out Most Contenders:**
  **Function Without History (1)** combined with **Malfunction (2)**. Pure SE theories fail (1). Pure CR theories struggle profoundly with (2) and often with (6). Many hybrids stumble on grounding the norm for (2) in history-free contexts satisfyingly.

  **One-Line Scorecard (vs. Desiderata 1-7):**

  1.  **Selected Effects (SE - e.g., Millikan, Neander):** Fails (1) & (7) spectacularly. Excels at (2), (3), (4), (6) (via history). Partial on (5) (history dominates).
  2.  **Causal Role/Organizational (CR - e.g., Cummins, Davies):** Excels at (1), (3) (contextually), (5), (7). Fails (2) & (4) (no norm for "supposed to"). Struggles with (6) (why *this* role?).
  3.  **Hybrid - Propensity (e.g., Bigelow & Pargetter):** Good on (1), (5), (7). Handles (2) & (4) *if* future selection is plausible, fails them if not (e.g., sterile malformation, minimal cell). Weak on (3) & (6) (propensity ≠ current maintenance reason).
  4.  **Hybrid - Organizational Maintenance (e.g., Mossio, Saborido, Moreno):** Best overall fit. Excels at (1) (via organizational closure), (3), (5), (6) (core), (7). Handles (4). *Struggles most with (2)*: Defining the "specific contribution" norm for malfunction in novel/singular cases (De novo gene, Minimal cell repair *target*) can feel arbitrary or circular without history or design language. Maintenance is clear, the *normative standard* for malfunction is trickier.
