prompt: |-
  I have been asked to run a ninety-minute evening session on Hofstadter's 'Person Paper' satire for a mixed adult-education group at a lifelong-learning institute: about twenty people, mostly retired, no linguistics or philosophy between them, and politically mixed — several will arrive already convinced that the point about sexist language is settled and faintly boring, several will arrive convinced that it is fussiness about words while the real issues lie elsewhere, and one member will say, early and with some feeling, that she has chaired committees for thirty years and has never meant anything by 'chairman'. We have a whiteboard, one double-sided photocopy of the piece, nothing to project on, and I cannot cite any empirical psychology even where it exists, so the session has to work through example and argument alone. The last time a group like this discussed the piece it split into two camps and stayed there: one read the satire as though it were a proof that generic uses of 'man' are simply false, the other read it as a joke that establishes nothing and could therefore be shrugged off. I do not want an explanation of the satire; I want a plan for explaining it.

  The part I am least sure about is the dependency structure, so please be explicit about what has to be in place before what, and about what must be deliberately withheld until later. My own instinct is that nothing works until the group has first felt, rather than been told about, the asymmetry between the two members of a pair — that one term (the unmarked one) can stand both for the whole category and for one half of it, while the other is the marked term, formed by addition or derivation and usable only for its own half — and that the satire cannot land until they have also seen why applying the substitution uniformly produces comedy precisely where the word containing 'man' has stopped being parsed as a compound at all. I have a candidate for the case that carries the whole session: the way 'right' does double duty as a direction and as 'correct' in English and related languages, with 'left' carrying the marked, deviant, faintly sinister sense. I suspect this is the wrong choice, because in that pair the double duty is largely historical and evaluative in a way the gender case is not, so the group may draw the analogy along the wrong feature; tell me whether to keep it as a warm-up, replace it, or restructure around something else, and say what the carrying example must have and must lack. I have also been separating the diagnoses as follows — (i) the unmarked term is ambiguous between the generic and the specific reading, so predicating it of a woman is either false or oddly marked; (ii) even where the generic reading is unambiguous, the unmarked term sets who is pictured by default; (iii) the specific term for women is morphologically derived from the male one, which encodes the male case as the original and the female as the variation; (iv) the satire's comedy feeds on the residue of compounds and idioms where the male element has gone opaque. Tell me which of these the satire actually runs on, in what order to introduce them, and whether I have the dependency backwards.

  Then the misconception map, with a position in the sequence for each: that the whole issue is politeness or etiquette; that a neutral term such as 'chairperson' solves it, so that neutrality is a property of words rather than of defaults in use; the paired errors of treating the satire as a proof and treating it as mere jest; the etymology objection, that 'man' originally meant human being and so nothing can be amiss; the symmetry objection, that swapping the marked term round would be equally funny and so nothing is shown (I do not think it is symmetric, but I want to know why, and where in the hour to deal with it); and the claim that a speaker who means everyone has thereby done nothing questionable. Please also give me one closing check I can run in the last ten minutes that a participant who has absorbed only the etiquette lesson — replace 'chairman' with something neutral — would fail, and that would show me the mechanism has transferred rather than the vocabulary; and tell me what I should openly refuse to settle at this level, since I would rather name those limits than bluff. Give a rough division of the ninety minutes, and write the plan in British English.
reasoning: |-
  Okay, the user is planning a 90-minute session on Hofstadter's "Person Paper" satire for an adult education group. Let me start by understanding their main concerns. They want to avoid the previous outcome where the group split into two camps: one taking the satire as proof that generic 'man' is false, and the other dismissing it as a joke. The group is mixed—politically and with no background in linguistics or philosophy. 

  First, I need to address the dependency structure. The user’s instinct is that feeling the asymmetry between marked and unmarked terms is crucial. They proposed using "right/left" as an example but worry it might lead to wrong analogies because of its evaluative connotations. I should suggest alternatives. Terms like "lion/lioness" or "dog/bitch" might work better because they’re gender-based without the added moral judgment. "Lion" is unmarked, used generically, while "lioness" is marked and derived. This keeps the focus on linguistic structure rather than cultural associations.

  Next, the satire relies on multiple mechanisms. The user listed four points. I need to prioritize: ambiguity and default imagery come first, then morphological marking, and finally opaque compounds. The satire’s humor comes from applying substitutions uniformly, which forces the audience to parse the "man" component, revealing the embedded male-as-default. Starting with ambiguity helps participants experience the confusion firsthand, making the satire’s point more tangible.

  For misconceptions, the user mentioned several. The politeness argument should be addressed early by framing the issue as cognitive rather than etiquette. The etymology objection ("man" originally meant human) can be countered by explaining how language evolves and current usage carries male associations. The symmetry objection—whether swapping terms would be equally funny—needs a clear rebuttal. The satire works because male terms are unmarked; reversing them wouldn’t have the same effect as the unmarked term isn't female. This should come after establishing markedness.

  The closing check is vital. The user wants to ensure participants grasp the mechanism, not just vocabulary. An exercise like applying the substitution to "manpower" or "craftsmanship" can test if they see the embedded male reference. If they only suggest neutral terms without understanding why, the deeper point was missed.

  Time management is key. Allocate 15 minutes for intro and asymmetry exercise, 20 minutes on ambiguity and default, 15 on morphology, 15 on satire and substitution, 10 on objections, and 15 for application and wrap-up. Avoid empirical psychology and focus on examples. Openly state that the session won’t resolve political debates or judge individuals, sticking to linguistic mechanisms.

  I should ensure the plan flows logically, starting with felt experience, building concepts step-by-step, addressing objections in sequence, and ending with practical application. Using relatable examples and interactive elements keeps the group engaged without prior expertise. Highlighting that the satire’s humor comes from revealing hidden assumptions through forced parsing ties everything together.
answer: |-
  Here’s a structured 90-minute plan focusing on experiential learning and logical dependencies, designed to bypass political stalemates and target cognitive mechanisms. British English throughout.

  **Core Insight Dependency:** Participants must *feel* the asymmetry (unmarked/marked distinction) *before* analysing the satire. The satire relies primarily on **(iv) the residue of opaque compounds/idioms** to generate comedy, but this only lands if **(i) ambiguity** and **(iii) morphological derivation** are grasped first. **(ii) Default imagery** is secondary but supports (i). **Avoid "right/left"** – its strong moral conflation ("right=correct") muddies the water. Use **"lion/lioness"** instead: it’s gender-based, morphologically clear ("lioness" derived from "lion"), unambiguous in generic use ("lions roam the savannah" includes females), and lacks extraneous evaluation.

  **Session Plan (90 mins total):**

  *   **Part 1: Feeling the Asymmetry (20 mins)**
      *   *(5 mins)* **Intro:** Briefly state the goal: "We're exploring *how* language structure shapes thought, using Hofstadter's clever piece as a springboard. Focus is on mechanisms, not politics or etiquette."
      *   *(15 mins)* **Exercise: "The Lion Hunt":** Ask participants to describe a scene: "A safari guide says, 'We saw lions near the waterhole yesterday – a magnificent male and three females.'" *Ask:* "Does 'lions' in the first part include the females?" (Yes). *Then:* "Could the guide have said 'We saw a magnificent male and three lionesses'?" (Yes). *Crucially:* "Could the guide have said 'We saw lionesses near the waterhole – a magnificent male and three females'?" (No! Laughter/confusion). **Highlight:** "Lion" does double duty (generic group + specific male), "lioness" *only* does specific female. "Lion" is **unmarked** (flexible), "lioness" is **marked** (restricted, derived by adding "-ess"). *Whiteboard:* Marked vs. Unmarked columns.

  *   **Part 2: Ambiguity & Morphology - The Mechanism (20 mins)**
      *   *(10 mins)* **Applying the Asymmetry (i & iii):** Use "author/authoress" (less archaic than "actor/actress" for some). *Ask:* "If I say 'The author of *Middlemarch* was brilliant', who was it?" (George Eliot - works). "If I say 'The authoress of *Middlemarch*...'?" (Feels odd, unnecessary, maybe even diminishing). *Why?* "Author" can be generic or male-specific; "authoress" is *only* female-specific and morphologically derived (male base + suffix). The generic use of "author" sets the default. **Stress:** This isn't about intent ("I didn't *mean* only men!") but about how the *language itself* carries a structure implying male is the base, female the variant.
      *   *(5 mins)* **Etymology Objection Intercept:** "Some say 'man' originally meant 'human', so it's fine." *Counter:* "True, but *current* usage and structure matter. 'Lion' originally just meant a big cat, but now 'lioness' is derived from it. Language evolves. The *structure* we have *now* encodes a specific relationship." Withhold full discussion of "man" until after the satire.
      *   *(5 mins)* **The Chair Test:** Address the participant upfront: "You've said 'chairman' never excluded women in your intent. Absolutely. The question Hofstadter raises is whether the *word itself*, through its structure, carries baggage independent of intent. Does 'chairperson' or 'chair' feel different? Why might that be?" Link to the marked/unmarked structure. *Do not resolve yet.*

  *   **Part 3: The Satire & Opaque Compounds (20 mins)**
      *   *(10 mins)* **Introduce Satire (Briefly):** "Hofstadter takes the argument for gender-neutral language and applies it *rigidly* to race, substituting 'white' and 'person of colour'. Read a few key *examples* aloud (e.g., "All persons are created equal... white persons and persons of colour"; "craftsworkmanship"; "one small step for a white person"). Focus on the *result*. Ask: *"What's the immediate effect? Why is it jarring/funny?"* (It forces us to parse "white" where it was invisible/default before).
      *   *(10 mins)* **Why it Works (iv):** Explain: "The comedy comes because words like 'craftsman' or phrases like 'all men' are often **opaque compounds/idioms**. We don't consciously parse the 'man' part; it's fused. Hofstadter's substitution *forces* us to parse it, revealing the embedded 'white' (or in the original case, 'male') as the default assumption. It makes the invisible visible. The satire works *because* the unmarked term ('man'/'white') was acting as the generic, hiding its specific meaning." *Link back:* This is the *same* mechanism as "lions" being generic but derived from the male-specific term.

  *   **Part 4: Tackling Objections & Deepening Understanding (20 mins)**
      *   *(7 mins)* **Symmetry Objection:** "Some say swapping terms would be equally funny, so it proves nothing." *Counter-example:* "Try applying the satire *backwards*. Instead of replacing 'man' with 'white person', replace 'woman' with 'person of colour' throughout English: 'person of colourpower', 'chairperson of colour', 'freshperson of colour'. Does it have the *same* effect? Why not?" **Key:** It lacks the comedy/jarring effect because "woman" is *marked* and *not* the unmarked generic term. The substitution isn't revealing a hidden default, it's just being odd. The asymmetry matters.
      *   *(7 mins)* **"Just Politeness/Neutral Words" Objection:** "If it's just about politeness, finding a neutral word like 'chairperson' should solve it. But Hofstadter shows it's deeper. 'Craftsperson' is neutral, but why did 'craftsman' *feel* neutral before? Because the 'man' part was opaque *and* male-as-default was assumed. True neutrality requires shifting the *default*, not just the label." Emphasise: **Neutrality is a property of *use* (what springs to mind by default), not just the word.**
      *   *(6 mins)* **"Proof vs. Joke" Stalemate:** "Neither camp was fully right last time. The satire isn't a *logical proof* that generic 'man' is false (it can function generically, like 'lions'). Nor is it *just* a joke to be shrugged off. It's a **powerful demonstration** of how deeply the unmarked/marked structure, ambiguity, and opaque compounds shape perception and reveal embedded defaults. Its power is in *making us feel* the mechanism."
      *   *(Avoid deep dive into speaker intent alone - it's addressed within other points).*

  *   **Part 5: Application & Closing (10 mins)**
      *   *(5 mins)* **The Transfer Check:** "Let's test understanding. Take the word **'manpower'**. What does it mean generically? (Workforce capacity). If we apply Hofstadter's method, what would the racial equivalent be? ('Whitepower' - jarring, reveals assumed default). What's a genuinely neutral alternative? ('Workforce', 'staffing', 'human resources'). Crucially, **why** does 'manpower' *need* replacing beyond politeness? What does its structure imply by default?" A participant who only learned etiquette will suggest 'personpower' or 'workforce'. A participant who grasps the mechanism will explain **the embedded male default and the need to remove the opaque male reference entirely**.
      *   *(4 mins)* **Summary & Limits:** Recap key mechanism: Unmarked terms (lion, author, man) do double duty (generic/specific), marked terms (lioness, authoress, woman) are restricted/derived. This structure + opaque compounds embed defaults. Satire reveals this by forcing parsing. **State Limits:** "We haven't resolved political debates about language reform. We haven't judged individuals' intentions. We *have* explored a cognitive mechanism in language that shapes perception, which is why changing words alone isn't always enough – we need to change the underlying defaults."
      *   *(1 min)* **Open End:** "Hofstadter gives us a lens. Whether and how we change language based on this is a broader conversation, but now grounded in understanding *how* it works."

  **Key Withholding/Dependency:**
  1.  **WITHHOLD** the satire itself until *after* asymmetry (lion), ambiguity (author), and derivation are felt/grasped.
  2.  **WITHHOLD** deep discussion of "man" and "chairman" until *after* the generic mechanism is established via less charged examples (lion, author).
  3.  **WITHHOLD** tackling major objections (etymology, symmetry, politeness) until *after* participants have experienced the core mechanism and seen the satire.
  4.  **INTRODUCE** opaque compounds (iv) as the *key* to the satire's comedy *after* (i) and (iii) are understood.

  This plan prioritises *experiencing* the linguistic mechanism before analysing the satire or debating objections, minimising defensive reactions and maximising the chance of the satire landing as intended: a revelation of hidden structure, not a polemic or a mere gag. Good luck!
