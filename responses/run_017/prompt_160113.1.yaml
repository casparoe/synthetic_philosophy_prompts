  The user wants a bureaucratic-style leaflet from a fictional agency enforcing Kelly betting on everything—money, careers, marriages. The humor must come from rigorous math: the indifference to ruin vs. massive gains, the mean/median wealth gap, the asymmetric growth curve, and especially extending the logic to non-repeatable life events. Crucially, no strawmen—Kelly is optimal at every horizon under log utility, so the critique must stem from its cold implications.

  First, I consider naming the agency. "Long-Run Growth Directorate" feels appropriately soulless. The mandate needs to sound legally binding but cite asymptotic dominance as justification. For the worked example, I'll use a coin flip with 60% win probability to show a 20% edge and f*=0.2. The math must be precise: mean wealth grows at 2% per bet, median at 1%, highlighting how the average citizen vanishes statistically. 

  The FAQ is where the horror shines. Q1 handwaves ruin as "infinitely improbable" (technically true under log utility but absurd in practice). Q2 dismisses the mean/median gap as proof the system works. Q3 explains the growth curve's harsh punishment of overbetting—critical since the Bureau's probabilities are estimates. Q4 extends "bankroll" to marriage/careers, ignoring that these aren't infinitely repeatable. Q5 decrees log utility as law. 

  The complaints procedure is the punchline: a committee that convenes after 10,000 quarterly bets. It underscores how the "long run" is longer than human life. 

  Throughout, I maintain deadpan bureaucracy. No winks—just officials earnestly explaining why losing 99% of your wealth is fine because it's only -4.6 log units. The user’s friend would approve every step, but the implications are chilling. Specialist laughs? Check. Layperson gets it? Check. And no citations—pure fiction with math so tight it strangles itself.
