  ## OFFICE OF GEOMETRIC WELFARE  
  Long-Run Growth Directorate  
  Citizen Compliance Bulletin: LRD/24-09/OGW  

  **MANDATE:** Pursuant to the Asymptotic Dominance and Optimal Compounding Act (ADOCA-57), every citizen aged 18 years or older is hereby required to participate in the National Compounding Opportunity (NCO) program. Quarterly participation consists of wagering the Optimal Growth Fraction (OGF) of one’s **Total Personal Bankroll (TPB)** on the NCO. The OGF is computed by the Directorate using forward-looking probability estimates to maximize the expected logarithmic growth rate of your TPB. Non-compliance incurs suboptimality penalties (See Schedule Γ-9).

  **DEFINITION: TOTAL PERSONAL BANKROLL (TPB)**  
  Your TPB is the sum of:  
  1.  Current liquid assets.  
  2.  Capitalized net present value of all future earnings (calculated via Directorate Form Ω-12).  
  3.  Capitalized net present value of all non-monetary assets convertible to welfare units, including but not limited to:  
      *   Remaining projected healthy life-years (Actuarial Table LR-7).  
      *   Projected marital satisfaction dividends (Standardized via Marital Utility Index, MUI-5).  
      *   Projected career capital growth (Sector Volatility Adjustment applied).  

  **WORKED EXAMPLE: CITIZEN ID 44782B**  
  *   **Initial TPB Assessment:** \1,000,000 Welfare Units (WU)  
  *   **NCO Parameters (Q3 2024):** Win Probability (`p`) = 0.60, Win Multiplier (`b`) = 1.0 (i.e., double-or-nothing on win).  
  *   **OGF Calculation:** `f* = (p * b - (1 - p)) / b = (0.60 * 1.0 - 0.40) / 1.0 = 0.20`  
  *   **Mandated Wager:** 20% of TPB = 200,000 WU.  

  *   **Outcome A (Win, 60% Probability):**  
      TPB_new = (1,000,000 - 200,000) + (200,000 * 2) = 800,000 + 400,000 = \1,200,000 WU  
      Log-Gain = ln(1,200,000 / 1,000,000) = ln(1.2) ≈ **+0.1823 log-units**  

  *   **Outcome B (Loss, 40% Probability):**  
      TPB_new = (1,000,000 - 200,000) + (200,000 * 0) = 800,000 WU  
      Log-Gain = ln(800,000 / 1,000,000) = ln(0.8) ≈ **-0.2231 log-units**  

  *   **Expected Log-Gain:** (0.60 * +0.1823) + (0.40 * -0.2231) ≈ **+0.0250 log-units per wager.**  
  *   **Expected Wealth Growth Rate:** exp(0.0250) ≈ 1.0253 per wager (**2.53%** quarterly).  
  *   **Median Wealth Growth Rate (Typical Citizen Experience):** (1.2)^0.6 * (0.8)^0.4 ≈ 1.0126 per wager (**1.26%** quarterly).  
  *   **Directorate Note:** The sustained 2.53% expected growth rate is optimal and achievable only through strict adherence to the OGF. The median trajectory (1.26%) reflects expected distributional outcomes under optimal policy; this gap demonstrates the robust efficiency of the mandated system in maximizing aggregate long-run potential. Most citizens will experience trajectories below the ensemble mean; this is mathematically necessary for asymptotic dominance.

  **FREQUENTLY ASKED QUESTIONS (FAQ):**  

  1.  **Q: What if I lose everything? Ruin seems possible, even probable, over time.**  
      A: Under the mandated logarithmic utility framework, ruin (TPB → 0) is infinitely undesirable (ln(0) = -∞). Therefore, the Directorate’s OGF calculation rigorously ensures the *probability* of ruin asymptotically approaches zero. While significant drawdowns occur (e.g., a 99% loss = -4.605 log-units), they are finite losses, mathematically equivalent in utility magnitude to a 100-fold gain (+4.605 log-units). The system ensures infinite negative utility is avoided.

  2.  **Q: The example shows most people growing much slower than the "expected" rate. How is this optimal for me?**  
      A: The Directorate optimizes the *expected logarithm* of terminal wealth. This criterion guarantees maximal *growth rate* over the indefinitely long run. While individual trajectories vary significantly, the policy ensures that, with probability approaching 1 over sufficiently many wagers, your terminal TPB will exceed that achievable by *any* other fixed fractional strategy by an arbitrarily large multiplicative factor. The median/mean gap is inherent to the log-optimal strategy and reflects its superior asymptotic properties; it is not a flaw.

  3.  **Q: What if the Directorate’s forward-looking probability estimate for the NCO is wrong?**  
      A: The OGF (`f*`) is highly sensitive to probability estimates. The growth-rate curve is asymmetric: wagering half the OGF (`f*/2 = 0.10`) retains approximately 75% of the maximum possible growth rate. Wagering twice the OGF (`2f* = 0.40`) reduces the expected growth rate to *zero*. Underbetting due to uncertainty is penalized far less severely than overbetting. The Directorate uses best-in-class forward-looking models. Citizens are reminded that ADOCA-57 mandates use of *official* probabilities only.

  4.  **Q: How can I apply this to my career choice/marriage/health decisions?**  
      A: Your TPB already includes capitalized valuations of Career Capital, Marital Satisfaction, and Health Capital. The OGF principle applies universally to any decision involving uncertain outcomes with fractional resource allocation. Considering a career change with an estimated 60% chance of doubling career capital value and a 40% chance of halving it? The OGF is 20% of your Career Capital Bankroll. Considering marital counseling with a probabilistic outcome? Allocate the fraction maximizing the expected log-change in MUI. The Kelly Criterion provides the unique rational allocation for any such gamble.

  5.  **Q: Why logarithmic utility? Other functions might value large losses differently.**  
      A: ADOCA-57 establishes the logarithmic utility function (`U(TPB) = ln(TPB)`) as the sole basis for Geometric Welfare. This function possesses the unique properties required for asymptotically dominant growth-rate maximization under repeated fractional reinvestment. It is intertemporally consistent and exhibits constant relative risk aversion equal to 1, the canonical setting for proportional betting. Other utility functions imply suboptimal growth or temporal inconsistency and are not sanctioned for NCO participation or TPB valuation.

  6.  **Q: My "long run" feels very finite. How does this help me?**  
      A: The mandate optimizes for the indefinite long run. While your individual horizon is finite, adherence ensures you contribute maximally to the asymptotic welfare frontier. Your finite trajectory is the necessary substrate upon which the Law of Large Numbers operates across the citizen ensemble. Deviating from the OGP based on finite-horizon concerns constitutes impatient myopia, sacrificing infinite future dominance for negligible finite-term adjustments. Trust the asymptote.

  **COMPLAINTS & APPEALS:**  
  Concerns regarding TPB valuation, OGF calculation, or NCO parameters may be submitted via Form Δ-8 "Asymptotic Adjustment Request" to the Office of Geometric Welfare, Long-Run Growth Directorate, P.O. Box 10100. A Review Committee will adjudicate based on the principles of ADOCA-57. **Please note:** Committee findings are based on ensemble optimality over horizons approaching infinity. Initial review cycles commence after 10,000 quarterly wagers (approx. 2,500 years). Expedited review is unavailable as it violates the long-run principle. Suboptimal strategies pending review accrue compounding compliance deficits.
