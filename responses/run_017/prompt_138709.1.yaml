prompt: |-
  Hey — odd one for you, sorry, it's half a work thing and half me being annoyed at myself.

  So: I run a small engineering team, and about three weeks ago in a retro I called out one of the devs for missing deadlines. Which was recieved about as well as you'd expect, given that I miss deadlines constantly and everyone in the room knows it. She said "you literally do this every week" and I had nothing better than "yeah, fair". It's been going round my head since, partly because I still think the complaint was correct and I can't work out how both of those can be true.

  Separately, and this is the actual ask: my department head has put me down to run a 40-minute session next month for the other team leads on "giving critical feedback when you're not exactly clean yourself" (his words). They're all engineers, they will want a yes/no rule, and none of them have done any philosophy. I don't want you to explain the topic to me — I think I basically have it — I want a plan for how I should explain it, and I can't see the shape of the thing.

  Specifically: the order the ideas have to come in and what depends on what. I'm fairly sure the very first move has to be splitting "was the complaint true, did she actually do something wrong" off from "was I entitled to be the one to say it", because if I don't do that first the session just turns into people either defending me or piling on, and we never get anywhere. But I don't know what the third move is, or the fourth. And what example should carry the whole thing? It needs to be a case where the criticism is obviously correct and the critic is obviously guilty of the same thing, so nobody can escape through "well maybe he didn't really do anything wrong" or "well maybe she isn't really a hypocrite" — and it can't be my situation, I'm not putting myself on a whiteboard.

  The misconceptions, and here's the part I most want help on — here's my list, tell me what I've got wrong or what's missing, and exactly where in the sequence I should head each one off, since I think the timing matters as much as the content: (a) "so you're saying a hypocrite can never say anything true", (b) "so the answer is just don't do the thing yourself", (c) the tu quoque thing — that pointing at the speaker is always a dodge, which I half believe myself and don't know whether to teach as false or as true-but-limited, (d) people flattening hypocrisy into ordinary inconsistency, or into just "doesn't practice what he preaches", (e) someone deciding that if you lack standing then the blame has no force at all and the target can just shrug it off.

  There's one thing I want built into the plan if it belongs there, because it's the version that made my head hurt: the person who says, up front, "look, I'm a total hypocrite for raising this, I'm late constantly, but you're late every single day and it's wrecking the standup." Does owning it buy them anything back? My instinct says it does and also that it shouldn't, and I can't tell which of those instincts is the confused one. If there's a version of the session where that case is the hinge rather than a footnote, I'd rather do that version.

  Also: what should I flatly refuse to get into in 40 minutes with this crowd, and say out loud that I'm refusing? I do not want to open the door to "what even is blame" and lose the room for the rest of the hour. And give me one question to ask at the very end that would show me they'd actually got the distinction, rather than just learned to say "standing" at the right moment.

  Last thing, and please commit rather than survey: I have to take a line in that room on whether hypocritical blame is genuinely unfair to the person being blamed, or whether it's just unwise/ineffective for the blamer while being otherwise fine. Pick one, defend it, and then tell me what follows for my own mess — apologise to her, drop the deadline thing entirely, or raise it some other way. Don't hand me the menu of positions with the tradeoffs listed; I can do that myself. Tell me which one is right and why.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a team lead who called out a developer for missing deadlines during a retro, but got called out themselves for doing the same thing. Now they have to run a session for other leads on giving critical feedback when you're guilty of the same thing. 

  First, I need to understand their core struggle. They're stuck on how both things can be true: that the developer deserved criticism AND that they were hypocritical to deliver it. The session they're designing needs to untangle this for other engineers who prefer clear rules, not philosophy.

  The key seems to be separating two questions: (1) Was the criticism factually correct? (2) Did the critic have standing to deliver it? The user already knows this, but needs help structuring the session. They listed several misconceptions to address, like whether owning hypocrisy fixes the problem, or if hypocrisy makes the criticism automatically invalid.

  For the flow, starting with splitting factual truth from standing makes sense. Then we need to show why both matter independently. A strong example is crucial - something where the criticism is undeniable and the hypocrisy is blatant (like a surgeon smoking while telling a patient to quit). 

  The user's personal dilemma about whether owning hypocrisy helps is interesting. Logically, admitting fault doesn't erase the standing issue, but practically it might make feedback more palatable. The session should show this is a tactical choice, not a standing fix.

  I think we should take a firm stance: hypocritical criticism is genuinely unfair because it violates reciprocity. The user should apologize to the developer, then re-address the deadline issue through system changes (process adjustments, not personal blame).

  For the session, we'll avoid philosophical debates about blame itself. The closing question should test if attendees can separate factual accuracy from standing in a new scenario. The whole thing needs to stay concrete and actionable for engineers in 40 minutes.
answer: |-
  Here’s a battle-tested plan for your 40-minute session, designed for engineers who crave structure and avoid philosophy. I’ll commit to clear positions (no hedging), and we’ll use your hypocrisy case as the hinge.

  ---

  ### **Session Structure & Flow**  
  *(Total: 40 mins)*  

  1. **The Core Split (5 mins)**  
     - **Opening Hook:** "You’re late to standup every day. Your teammate says, 'You’re always late!' But you know they’re late constantly too. Is the teammate *wrong* about your lateness? Or just a hypocrite?"  
     - **Draw the Line:**  
       - **Factual Truth:** "Did the thing happen? (Yes/No)"  
       - **Standing:** "Does the *speaker* have the moral/positional right to call it out?"  
     - **Rule #1:** These are separate questions. **Truth ≠ Standing.**  

  2. **The Hinge Example: "The Smoking Surgeon" (10 mins)**  
     - **Setup:** A chain-smoking surgeon tells a patient, "Quit smoking or you’ll die."  
       - **Truth:** The patient *should* quit. (Objectively true)  
       - **Standing:** The surgeon has none. (Hypocrisy undermines authority)  
     - **Force the Binary:**  
       - "Was the surgeon *wrong* about smoking’s risks?" → "No."  
       - "Should the patient ignore the advice?" → "No, but they’ll resent the messenger."  
     - **Key Insight:** Truth survives hypocrisy… but hypocrisy poisons delivery.  

  3. **Why Standing Matters (5 mins)**  
     - **Analogy:** A thief judging another thief. The stolen goods are still stolen (truth!), but the judge loses credibility.  
     - **Engineer-Friendly Logic:**  
       - **Standing = Moral Authority**  
       - Hypocrisy violates reciprocity: "You haven’t held yourself to the standard you enforce."  
     - **Consequence:** Even true criticism feels unfair because the critic exempts themselves.  

  4. **Crushing Misconceptions (10 mins)**  
     Tackle these *in order* after establishing Truth/Standing split:  

     | Misconception | Response (Shut-Down Script) | Timing |
     |---------------|-----------------------------|--------|
     | *(a) "Hypocrites can’t say true things"* | "Nope. Truth is fact-based. A hypocrite can be 100% right *and* 100% illegitimate to speak." | Immediately after Smoking Surgeon |
     | *(b) "Just don’t do the thing!"* | "Irrelevant. We all fail. This is about *how* you critique *when* you’ve failed." | After establishing Standing matters |
     | *(c) "Tu quoque is always a dodge"* | "**Half-true.** Calling out hypocrisy *can* be a dodge... **but not if the hypocrisy invalidates standing.** If the critic’s authority relies on integrity, tu quoque is valid." | During Standing discussion |
     | *(d) "Hypocrisy = any inconsistency"* | "**No.** Hypocrisy is *selective enforcement*: punishing others for what you excuse in yourself." | Define Hypocrisy upfront |
     | *(e) "No standing = no blame"* | "**False.** The blame is *still true*—but the hypocrite can’t deliver it fairly. Transfer the critique: 'This is a team issue; let’s fix our system.'" | When explaining consequences |

  5. **The "Owning It" Trap (5 mins)**  
     - **The Scenario:** "I’m a hypocrite for saying this, but you’re late constantly."  
     - **The Verdict:**  
       - **Buys you nothing on standing.** You still lack moral authority.  
       - **Tactically useful?** Maybe. It disarms defensiveness *if* the recipient values honesty.  
       - **But:** It doesn’t fix unfairness. You’re still demanding a standard you reject.  
     - **Engineer Translation:** "Acknowledging a bug doesn’t fix the broken function. Rewrite the code."  

  6. **What We’re NOT Doing (2 mins)**  
     - **State upfront:** "We’re **not** debating ‘What is blame?’ or ‘Are deadlines evil?’ Stay focused: *Can a hypocrite deliver fair criticism?* Refuse philosophical detours."  

  7. **Closing Question (3 mins)**  
     - **Test Their Understanding:**  
       *"Your lead skips documentation but writes you up for missing a doc deadline. Is the write-up...*  
       *a) Factually wrong if your doc was late?*  
       *b) Unfair even if factually correct?*  
       *Why?"*  
     - **Correct Answer:** "A: No (truth stands). B: Yes (no standing). Unfair due to selective enforcement."  

  ---

  ### **Your Stance: Hypocritical Criticism is Genuinely Unfair**  
  **Why?**  
  Criticism isn’t just data transfer—it’s a demand for change from a position of authority. Hypocrisy corrupts that authority by revealing the speaker doesn’t believe their own standard *matters enough to follow*. It’s a power imbalance: "Rules for thee, not for me." Even factually correct, it’s unjust because it weaponizes a standard the critic actively undermines.  

  **What Follows for You:**  
  1. **Apologize to the dev.** Specifically:  
     *"I called out your deadlines while missing my own. That was hypocritical and unfair. My failure undermines my right to hold you accountable that way. I’m sorry."*  
  2. **Drop the deadline critique as a *personal* issue.**  
  3. **Raise it systemically:**  
     *"Our deadline process is broken. I miss dates, you miss dates—let’s fix the system (estimation, scope, buffers) so we *all* succeed."*  

  **Why This Works:**  
  - The *truth* (deadlines matter) survives.  
  - You address the *unfairness* (your hypocrisy).  
  - You shift blame from people → process (where engineers thrive).  

  ---

  ### **Summary**  
  - **Order Matters:** Truth → Standing → Consequences → Misconceptions.  
  - **Hinge Example:** Smoking surgeon (indisputable truth + glaring hypocrisy).  
  - **Your Action:** Apologize for your hypocrisy, then co-create solutions.  

  This plan gives engineers a clear "rule": **"You can’t enforce a standard you systematically violate. Fix yourself or fix the system—never blame from a glass house."** Now go own your mess.
