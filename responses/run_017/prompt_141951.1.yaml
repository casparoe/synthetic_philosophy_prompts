prompt: |-
  I have been reading rationalist blogs and hanging around the associated forums for something like fifteen years, and I run a small reading group that grinds through decision-theory papers, so I am fluent in the usual vocabulary: expected value, preference versus value, updating on evidence you cannot yet imagine having, precommitment, that sort of thing. I am not asking for citations or a reading list; an answer that can only gesture at literature is useless to me, and I have already read the popular book on this. What I want is help extracting a principle from my own verdicts on transformative choices: decisions where you cannot know what the outcome is like until you are on the far side, and where being on the far side changes what you want.

  Here are my verdicts, with letters so you can cross-reference. A: a man blind from infancy is offered a procedure that would restore his sight. Obviously take it, and I do not think there is any special puzzle here at all; the experience is unimaginable in advance, but nothing about who he is hangs in the balance, so ordinary expected-value reasoning about information and capability settles it. B: moving to a country whose language you do not speak, for a two-year immersive programme. Just go; you will acquire new tastes, but you will still be recognisably you, and proxies and expat testimony are good enough to decide on. C: the standard vampire case everyone in this space has seen, where you cannot know what it is like, it is irreversible, and it rewrites what you care about. I think the right frame is not maximising anything but asking whether you want to discover that you have become the sort of person for whom this matters, and I would say take it if yes. D: having a first child. Same verdict, same frame, and I actively distrust anyone who tries to run the numbers on future happiness. E: a hypothetical pill that gives you the full experience of some radical change for forty-eight hours and then reverses completely, with no trace and no physical risk. Obviously swallow it, and here is where I start to be unsure: I also feel the sample should be close to decisive for the permanent version, because afterwards the case has collapsed into an ordinary decision. I have started calling this the sandbox problem, the question whether a perfect sandbox dissolves the puzzle or merely relocates it one level up. F: a calling intervention, imagine a safe and well-tested neural treatment that reliably makes some activity utterly absorbing to you. The sandbox reveals you would love it, but taking it permanently means you would stop caring about your marriage and your current work, though of course you would not mind. I say do not take it, even though by the frame I used in C and D the new person's endorsement is supposed to be what counts. G: testimony from people already transformed. I discount their assurance that it is worth it and that I should trust them very heavily, on the grounds that they are now different people reporting from outside my value system. But I also want to give real weight to the base rate of post-hoc endorsement among people who were like me beforehand, the ninety per cent who report being glad. I have a sinking feeling those two moves are the same move performed in opposite directions. H: a gradual version of F, where you can escalate and de-escalate in small reversible steps, and each small step slightly changes the person who takes the next one. I care much more about having that exit option than I can justify, given that the end state is identical either way and the future me probably would not use it.

  My own stab at a principle is that the distinction doing the work is not the epistemic versus personal distinction everyone reaches for, but the difference between changes in what you like and changes in what you care about: I am happy to defer to my future self about the first and I get protective about the second, which is supposed to explain why F comes apart from C. But I cannot tell whether that is a real distinction or status quo bias wearing a philosophy costume, and it does not obviously explain why G pulls me two ways, or why the sandbox in E feels decisive. So: give me a principle, or at most two or three candidates, stated precisely enough that I could apply it to a case I have not listed, along with an honest account of which of my verdicts it forces me to drop and why. I would rather give up one verdict than accept a principle with six clauses tuned to save all eight, and if your account collapses into do what your future self will want, say so and say what work the caveats are doing. Then take it to the case I actually cannot settle, Z: whether to have a second child. The person who wants the second child is the person the first child made me, and I genuinely cannot tell whether that is a reason to trust the desire or a reason to distrust it.

  Return a single valid JSON object and nothing else, with this schema. Field principles: a string of one or two sentences giving the account precisely, no hedging. Field decision_procedure: a string of three to five numbered steps saying what an agent should actually do when facing a transformative choice, including what to do when a sandbox exists. Field clauses: an array of objects, each with keys clause (one clause of the principle stated precisely), motivating_case (one of A through H), and cost_if_dropped (which of my verdicts breaks without it). Field case_table: an array of objects with keys case (A through H), my_verdict (short restatement), principle_verdict (what your principle says), and accommodated (one of yes, partly, no). Field overturned: an array of objects with keys case, why_it_cannot_be_saved, and what_to_think_instead, empty if nothing has to go. Field my_distinction: an object with keys verdict_on_liking_vs_caring (one of real, status_quo_bias, partly_real) and argument. Field sandbox: an object with keys does_a_perfect_sample_collapse_the_case (one of yes, no, sometimes) and condition (when it does and when it does not). Field novel_predictions: an array of at least three objects with keys novel_case (a case I have not listed, constructed by you), predicted_verdict, and confidence (one of high, medium, low). Field open_case_Z: an object with keys verdict, depends_on (which clause or verdict the answer turns on), and if_i_drop_that_clause. Use strings throughout, no trailing commas, and no keys beyond the ones I have named.
reasoning: |-
  We are constructing a JSON object according to the user's specifications.

  Principles: We need a precise principle in one or two sentences.

  After analyzing the cases, I propose a principle that distinguishes between changes that preserve the core evaluative perspective and those that fundamentally alter it. The principle is:

  **Principle**: In transformative choices, defer to your future self's preferences only if the transformation preserves your core evaluative perspective. Otherwise, treat the transformation as creating a distinct agent and require that your current self would endorse becoming that agent, even without knowing the specifics.

  Decision Procedure: A sequence of 3-5 numbered steps.

  1. Assess whether the transformation is reversible (even partially) and whether a sandbox (temporary trial) is available. If so, use the sandbox and then decide based on that experience as if it were an ordinary decision.
  2. If irreversible and no sandbox, determine if the transformation preserves your core evaluative perspective (i.e., the fundamental values and cares that define your agency). If it does, use ordinary expected value reasoning.
  3. If the transformation does not preserve your core evaluative perspective, then ask: "Would I endorse becoming the kind of person for whom this outcome is desirable, even without knowing the exact experiential qualities?"
  4. If the answer to the endorsement question is yes, undergo the transformation. If no, decline.
  5. In cases of uncertainty about the core perspective, gather testimony from people who were previously similar to you and note the base rate of endorsement, but discount testimony from those already transformed if they are now too different.

  Clauses: Array of objects, each with clause, motivating_case, cost_if_dropped.

  We break the principle into two clauses:

  Clause 1: Defer to future self only if core evaluative perspective is preserved.
  Motivating Case: F (the calling intervention). Without this clause, we might defer to the future self who loves the new activity and doesn't care about the marriage, but we don't want that. Cost if dropped: We would have to accept F (take the intervention) which contradicts the verdict.

  Clause 2: If core perspective is not preserved, current self must endorse becoming the kind of person who would endorse the outcome.
  Motivating Case: C (vampire) and D (having a child). Without this clause, we wouldn't have a way to decide because we can't use ordinary EV. Cost if dropped: We might reject C and D when we should accept, or vice versa.

  Case Table: For each case A-H, state my_verdict, principle_verdict, and accommodated (yes, partly, no).

  A: Blindness cure. My verdict: take it. Principle: take it (preserves core perspective, ordinary EV). Accommodated: yes.
  B: Move to country. My verdict: go. Principle: go (preserves core perspective, proxies are sufficient). Accommodated: yes.
  C: Vampire. My verdict: take if you endorse becoming that person. Principle: take if current self endorses becoming the kind of person who would value it. Accommodated: yes.
  D: First child. My verdict: have if you endorse becoming a parent. Principle: same as C. Accommodated: yes.
  E: Sandbox pill (48-hour trial). My verdict: take the pill, and it should be decisive for permanent. Principle: Step 1 of the procedure: use sandbox and then decide as ordinary. So take the trial and then base permanent decision on that. Accommodated: yes (because it collapses the case).
  F: Calling intervention. My verdict: don't take. Principle: core perspective not preserved (since you stop caring about marriage and work) and current self does not endorse becoming that person? Actually, the verdict is don't take. The principle: we don't defer to the future self because core perspective is lost. We must endorse becoming that person. The user says in F: don't take, so we must not endorse. The principle says: if we don't endorse, then we don't take. So accommodated: yes.
  G: Testimony. My verdict: discount transformed people, but weight base rate of pre-transformed endorsement. Principle: Step 5 says discount testimony from transformed if too different, but use base rate from pre-similar people. So accommodated: partly? Because we use base rate of endorsement from people who were like us, which is what the user does. But the user feels conflicted. We say: discount transformed testimony, but use base rate from pre-similar. So it matches. I'll say yes.
  H: Gradual version. My verdict: care about exit option. Principle: Step 1: if reversible, use that. So in H, because it's reversible in steps, we can try and back out if we don't like the direction. This matches the user's care about exit. Accommodated: yes.

  Overturned: Array of cases that must be dropped. None? Because all are accommodated.

  But wait: the user has a verdict in G that they feel is pulling two ways. Our principle uses both discounting and base rate, so it's consistent. We don't overturn any.

  My Distinction: The user's liking vs caring distinction.

  Verdict: We say it's partly real. Argument: The core evaluative perspective is about what you care about (values, commitments) not just what you like (preferences, tastes). So the distinction is real, but it's not absolute because what we care about can evolve without a break. The key is whether the change is fundamental to agency.

  Sandbox: Does a perfect sample collapse the case?

  Answer: yes, condition: when the sandbox accurately represents the permanent change (including any shifts in perspective during the trial) and is reversible without residue. Then after the trial, the case becomes ordinary because you have the experience and can reason from it.

  Novel Predictions: At least three novel cases.

  1. Novel Case: A safe, reversible neural modification that makes you love a type of music you currently hate for one week. After reversal, you remember the experience but have no lasting change in taste.
     Predicted Verdict: Take it (sandbox available, so try and then decide about permanent if desired). Confidence: high.

  2. Novel Case: A permanent religious conversion experience that would make you value faith above all else, including current family obligations. No sandbox.
     Predicted Verdict: Only take if you currently endorse becoming that kind of person, even without knowing the experience. Confidence: medium.

  3. Novel Case: A career change to become a monk in a silent order. It's gradual and reversible for the first year. You can leave at any time without penalty.
     Predicted Verdict: Try it (because reversible steps). Confidence: high.

  Open Case Z: Second child.

  Verdict: Have the child. Depends on: Clause 2 (endorsement). The current you (who was transformed by the first child) endorses having a second. The transformation from the first child has already occurred and you now have a core perspective that includes being a parent. So you endorse becoming the person who has two children. If we dropped that clause, we might not have a way to decide because the future self is different, but the current self (as a parent) endores it.

  Now, we write the JSON accordingly.
