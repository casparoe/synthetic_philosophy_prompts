  ### Decision Tree: What Does "Representation of X" Mean Beyond Predictability?  
  *Start here if you believe that calling a feature the model's representation of X means more than "X can be read off the activations." Answer each question to reach your position. Diagnostic cases are used as nodes (italicized) or to illustrate leaves.*

  ---

  1. **Can any empirical evidence (e.g., perfect interchange intervention, causal scrubbing) settle whether a feature is the model’s representation of X?**  
     - **No** → Leaf E: Upstream of Evidence  
       *(Held by philosophers. Awkward commitment: Even a complete causal map of the model wouldn’t resolve the question. Disagreement is upstream of evidence. Not engineer-friendly.)*  
     - **Yes** → Go to 2.  

  2. ***Vestigial feature case***: **A direction predicts X perfectly, clusters cleanly, and steers outputs toward X, but interventions show it is causally inert (never used by the model). Is it the model’s representation of X?**  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. ***Wordless feature case***: **Can the model represent a statistical regularity that no human concept or English phrase covers?**  
     - **Yes** → Go to 5.  
     - **No** → Leaf D: Deflationary/Illusionist View  
       *(Held by philosophers. Awkward commitment: Even causally active features are just descriptions we impose, not discoveries. Settled by evidence? Yes (but only about utility). Not engineer-friendly.)*  

  4. ***Chameleon case***: **A feature is used in-distribution, but under mild shift, the model switches to a different encoding while the feature still lights up. Was it ever the model’s representation of X?**  
     - **Yes** → Leaf B: Functional-Role/Causal-Abstraction View  
       *(Held by engineers and philosophers. Awkward commitment: Representations are defined by which interventions preserve behavior, even if encodings change. Settled by evidence? Yes. Engineer-friendly.)*  
     - **No** → Go to 6.  

  5. ***Seed divergence case***: **Two same-architecture models (same data, different init) behave identically. Model A has a clean linear feature for X; Model B encodes X nonlinearly (only recoverable via nonlinear probes). Does Model B have a representation of X?**  
     - **Yes** → Leaf C: Real-Patterns View  
       *(Held by engineers and philosophers. Awkward commitment: Vestigial features are representations because they compress/predict data. Settled by evidence? Yes. Engineer-friendly.)*  
     - **No** → Leaf F: Linearity-Required View  
       *(Held by some engineers. Awkward commitment: Nonlinear encodings (e.g., Model B) aren’t representations. Settled by evidence? Yes. Engineer-friendly.)*  

  6. ***Phlogiston feature case***: **Can the model represent a "kind" that science says doesn’t exist (e.g., phlogiston) but is coherent in the training text?**  
     - **Yes** → Leaf A: Features-as-Real-Causal-Units Realism  
       *(Held by engineers. Awkward commitment: Models represent non-existent things (e.g., phlogiston) if they’re causal units. Settled by evidence? Yes. Engineer-friendly.)*  
     - **No** → Leaf H: Scientific Realism  
       *(Held by philosophers. Awkward commitment: Denies representations for scientifically invalid concepts (e.g., phlogiston) even if causal. Settled by evidence? Yes. Not engineer-friendly.)*  

  ---

  **Leaf Summary**  
  - **A: Features-as-Real-Causal-Units Realism** (Engineer-friendly)  
  - **B: Functional-Role/Causal-Abstraction View** (Engineer-friendly)  
  - **C: Real-Patterns View** (Engineer-friendly)  
  - **D: Deflationary/Illusionist View** (Not engineer-friendly)  
  - **E: Upstream of Evidence** (Not engineer-friendly; disagreement upstream of evidence)  
  - **F: Linearity-Required View** (Engineer-friendly)  
  - **H: Scientific Realism** (Not engineer-friendly)  

  **Pairs of Leaves Not Genuinely Separated**  
  - **C (Real-Patterns) and F (Linearity-Required)**: The tree uses seed divergence to split them, but both answer "yes" to vestigial and wordless features. The last question (seed divergence) does the work, but it may not capture deeper disagreements about linearity as a necessity.  
  - **B (Functional-Role) and A (Causal-Unit Realism)**: Separated by the chameleon case, but both could agree on causal role; the tree relies on distribution-shift robustness to split them.  

  **Unheld Answer Combinations (Diagnosis)**  
  1. **Path: 1=Yes, 2=No, 4=Yes, 6=Yes** → *Incoherent*: Functional-role (B) requires context-dependence, but phlogiston (6) is irrelevant to this leaf.  
  2. **Path: 1=Yes, 2=Yes, 3=No, 5=Yes** → *Unexplored*: Deflationary (D) denies non-human concepts, but seed divergence (5) is a non-sequitur here.  
  3. **Path: 1=Yes, 2=No, 4=No, 6=N/A** → *Unattractive*: Requires causal-role realism but rejects scientific validity (H) without a phlogiston stance; rare due to tension.  

