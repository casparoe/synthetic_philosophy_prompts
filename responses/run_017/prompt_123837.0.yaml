answer: |-
  Here’s your prep sheet, structured for tactical delivery:

  ### 1. Room Read (145 words)
  - **Applied micro/experimentalists**: Annoyed by lack of quantifiable causal identification. They’ll hear "liability" as "counterfactual harm attribution problem" and demand evidence the ledger isn’t just correlated noise.  
  - **Political-economy/history folks**: Suspicious you’re soft-pedaling colonial extraction. They’ll listen for whether "co-imposed institutions" lets rich states off the hook for historical violence.  
  - **Agency/finance ministry people**: Alarmed by "unconditional transfers." They’ll interpret "liability" as "legal precedent for budget-draining reparations" and fear bypassing state institutions.  
  - **The philosopher**: Unimpressed by "institutional exposure" as a moral threshold. They’ll wonder why this framing beats simpler cosmopolitan cost-benefit.  

  ### 2. Objections, Worst First
  **#1 (Agency Director)**:  
  *"If we route cash straight to households in corrupt states, it’ll be captured by elites or inflame local politics. Project-based aid exists because governments implement things."*  
  **Reply**: "Compensation isn’t aid. It’s owed directly to victims of harm, like court-ordered restitution. We already do this via disaster relief cash transfers – it’s *more* resistant to capture than procurement chains."  
  **Soft spot**: You lack empirical proof this scales nationally without backlash.  

  **#2 (Lead Economist)**:  
  *"Your ‘ledger’ requires quantifying harm from complex systems. Show me an IV strategy to isolate the effect of, say, the debt regime on Malawi’s GDP."*  
  **Reply**: "We quantify liability for oil spills or antitrust fines without perfect IVs. Start with observable harms: e.g., tax revenue lost to treaty-enabled profit shifting. Refine later – we don’t abandon climate costs because GCMs are imperfect."  
  **Soft spot**: Hand-waving on aggregation methodology.  

  **#3 (Historian)**:  
  *"This sanitizes colonialism. If liability tracks active systems, not past genocide, you’re absolving Europe for extracting $45T from India."*  
  **Reply**: "Historic plunder *created* today’s coercive institutions. The ledger captures ongoing harm – like biased WTO rules locking in disadvantage. But I concede: this framework complements, doesn’t replace, historic reparations."  
  **Soft spot**: Feels like dodging the reparations debate.  

  **#4 (Political Philosopher)**:  
  *"Why prefer this over consequentialism? If a dollar in Burundi saves more lives than in Mexico, but your ledger says Mexico gets more, isn’t that immoral?"*  
  **Reply**: "Consequentialism ignores agency. Liability assigns responsibility to harm-doers – it’s corrective justice, not utility maximization."  
  **Soft spot**: Doesn’t resolve when efficiency trumps justice.  

  **#5 (Trade Experimentalist)**:  
  *"Institutions aren’t ‘imposed.’ Poor countries sign treaties voluntarily. Where’s coercion?"*  
  **Reply**: "Signing IMF loans during debt crises isn’t free choice. Coercion is structural: refuse the terms, lose market access/capital flows."  
  **Soft spot**: Tough to prove alternatives were feasible.  

  **#6 (Finance Ministry)**:  
  *"Calling ODA ‘liability payments’ kills political will. Voters fund charity, not reparations."*  
  **Reply**: "Aid budgets are shrinking anyway. Honesty might mobilize communities harmed by offshoring/emissions – it’s constituency-building."  
  **Soft spot**: Naive on realpolitik.  

  **#7 (Development Economist)**:  
  *"Prioritizing middle-income countries over starving LDCs because they trade more with us is perverse."*  
  **Reply**: "The point is harm, not poverty. But: we’d still help LDCs via need-based aid *separately*. This is about paying debts, not charity."  
  **Soft spot**: Implies two parallel systems – messy in practice.  

  ### 3. What I Concede Up Front (140 words)
  - "I’m not against cost-effective aid. But that’s about beneficence, not justice."  
  - "Colonialism’s legacy is profound. My framework addresses *ongoing* harm – it’s one tool, not the whole repair kit."  
  - "Quantifying the ledger is hard. But ‘difficult to measure’ ≠ ‘should ignore.’ Start with low-hanging fruit: tax gap, carbon debt."  
  - "Unconditional cash works better than some project aid, but yes – governance matters. We can phase in modalities."  

  ### 4. The Hill (95 words)
  **The core claim**: What states owe is determined by their **harm-inducing institutional entanglement**, not recipient poverty or donor generosity. If this falls – if obligations are just about wealth gaps or altruism – the chapter collapses. Everything else (cash transfers, ledger design) is scaffolding.  

  ### 5. The Question I’m Hoping Nobody Asks (150 words)  
  **The question**: *"Under your ledger, doesn’t the U.S. owe Mexico vastly more than Malawi? But Mexico’s not poor – so why prioritize them over hungrier people?"*  
  **Honest answer**: "Yes – because NAFTA’s legacy, border policies, and climate externalities harm Mexicans more intensely today than U.S. policies harm Malawians. Morally, we owe those we harm, not those with least resources. It *feels* counterintuitive because we conflate poverty relief with debt payment. But abandoning harm-tracking to match our charity instincts is arbitrary. We should fund Malawi’s needs via other obligations."  
  **Why you dread it**: It forces you to admit middle-class Mexicans "deserve" compensation over starving Malawians on your metric – a brutal soundbite.  

  **Final tip**: When cornered, pivot to: "This isn’t the only obligation – it’s the one we’ve ignored because it implicates us directly." Good luck.
