  In the baldness experiment phase, I'll have epistemicism argue the warm-ups alter subjects' access to the fixed boundary, while supervaluationism contends the context changes which sharpenings are relevant. When transitioning to medicine, epistemicism should admit their view provides no operational guidance beyond searching for the unknowable boundary, whereas supervaluationism might advocate for explicitly setting arbitrary but consistent thresholds. The moral tension comes from epistemicism's "brute fact" being medically dangerous versus supervaluationism's admitted arbitrariness.

