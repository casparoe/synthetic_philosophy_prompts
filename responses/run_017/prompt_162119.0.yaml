prompt: |-
  You are a professional philosopher of science who also does formal work in causal inference and decision theory — someone who has read the statistics papers and the philosophy papers on Simpson's paradox and is convinced that neither group is saying quite the right thing. Take this slowly and think carefully. Before writing your final answer, do one short unstructured pass in which you brainstorm candidate diagnoses — that the dispute is merely verbal, that the sides are answering different questions under one label, that a hidden formal or empirical question is doing the real work, that they disagree about which quantity is action-guiding, or that the question is simply ill-posed — and then commit to the one you think is right, telling me which of the others you considered and why you rejected them. Then give me the finished thing: a diagnosis with reasons, not a survey.

  Here is why I am asking. About a year ago I joined the quality-improvement committee of a regional hospital network. We were comparing two care pathways for the same condition, and the numbers did the famous thing: across all patients the newer pathway had the lower complication rate, but within every severity band the older pathway did better. The committee split instantly and along lines that had nothing to do with the medicine. One group said the aggregate is the number that matters because that is what we actually deliver to the population we serve. Another said the stratified numbers are the real comparison and the aggregate is an artefact of who got sent where. A third, smaller group pointed out that our severity score is recorded *after* patients are assigned to a pathway, so severity is partly downstream of the intervention, and that this makes both numbers suspect in different ways. We never resolved it; we published the aggregate with a footnote.

  I then went looking for the literature, expecting to find the answer, and instead found a fight that has not moved in decades. Statisticians and epidemiologists tend to say there is no paradox at all: it is confounding, standardize or adjust and the problem dissolves, and the only interesting content is a warning about collapsing tables. The causal-graph and do-calculus tradition says something stronger — that once you ask for the effect of an intervention rather than a conditional probability, the reversal is not a feature of the world but of a badly posed query. And decision theorists treat the same examples as evidence about rational choice, connecting them to Savage's sure-thing principle and to the causal-versus-evidential decision theory dispute. Meanwhile applied papers keep being published as though none of this settled anything, and the two canonical examples keep being wheeled out as if they were the same kind of case when they seem to me to be different kinds of case.

  My hypothesis, which I want you to test rather than humour, is that the stalemate is at least partly a case of several distinct phenomena sharing one name. Call them: (i) *uniform-direction* reversals, where every stratum points one way and the aggregate points the other, so the whole reversal is carried by differences in how the arms are distributed across strata; (ii) *heterogeneous-direction* cases, where strata disagree with each other, so the aggregate is not wrong but is an answer about a reference population nobody specified; and (iii) *downstream-stratifier* cases, where the stratifying variable is affected by the intervention, so conditioning on it removes part of the very effect we want and the aggregate is not a confounded version of the truth either. My suspicion is that case (i) is essentially arithmetic and settles itself under standardization onto a common stratum distribution, that case (ii) is a genuine but normative question about which population we owe an answer to, and that case (iii) is where a real, non-verbal disagreement is hiding — and that the literature keeps talking past itself because it runs all three under one heading.

  So: is that right? Is this dispute verbal, or substantive, or several disputes of different kinds? Which of the three camps, if any, is answering a question the others are not asking, and is there any residual disagreement in case (i), or is it fully dissolved by the standardization argument? Where does the decision-theoretic literature fit — is it about the same phenomenon, or has it quietly switched to the question of what the agent will know when they act, which the statistics literature never asks? And finally, given your diagnosis, tell me what would count as progress and what would not: is the right move a decomposition convention, a reporting norm, a small formal result about invariance under re-weighting, a change of question, or is this a place where no resolution should be expected? If your diagnosis has practical bite for my committee — about which figure we should publish, or which question we should have asked before collecting the data — say so explicitly.

  Constraints, please respect them: you have no internet access, so do not cite papers, offer a bibliography, reading list, or named authorities, and do not rest your answer on my having read anyone in particular. Do not spend your answer explaining what Simpson's paradox is or re-deriving the kidney-stone and admissions examples; assume I know them and use them only as reference points. Do not give me a balanced literature review. I want the structure of the disagreement, what each side is actually committed to, and an honest verdict on whether it can be ended — about 900 to 1,200 words.
