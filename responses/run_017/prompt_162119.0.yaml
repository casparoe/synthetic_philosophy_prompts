answer: |-
  ### Diagnosis: The Stalemate as a Conflation of Distinct Phenomena Requiring Different Frames  
  Your tripartite distinction is fundamentally correct and reveals why the literature talks past itself. The core issue is not verbal but *framing-dependent*: **different variants of "Simpson's reversal" answer different questions, and the camps are implicitly solving different problems under one name**. The dispute persists because no single framework resolves all three cases, and each tradition privileges one variant while dismissing others as trivial or misguided. Below, I justify this by evaluating your cases against the camps, then address decision theory and progress.

  ---

  ### Candidate Diagnoses Considered and Rejected  
  - **Merely verbal?** Rejected. While terminology differs (e.g., "confounding" vs. "collider bias"), the camps disagree on *which quantity is epistemically prior* (e.g., conditional vs. interventional probabilities). This reflects deeper divergences in goals.  
  - **Different questions under one label?** **Accepted as primary**. Your (i)/(ii)/(iii) map to distinct queries: (i) "What happens if we ignore subgroups?", (ii) "Which subgroup's effect applies here?", (iii) "Can we isolate the intervention's effect?"  
  - **Hidden formal/empirical question?** Partially valid for (iii), but fails for (i)/(ii). The "real work" differs: (i) is arithmetic, (ii) is normative, (iii) is causal.  
  - **Disagreement about action-guiding quantity?** Relevant but secondary. This explains *why* camps prioritize different quantities (e.g., statisticians focus on observed outcomes, causalists on manipulable effects), but doesn't resolve the conflation.  
  - **Ill-posed question?** Only in (iii) if the causal structure is unspecified. In (i)/(ii), the questions are clear but require auxiliary inputs (e.g., a target population).  

  ---

  ### Analysis of the Three Cases and Camps  
  **1. Uniform-Direction Reversals (i): Arithmetic with a Normative Tail**  
  - *The reversal*: Purely algebraic. If every stratum shows Treatment A > B, but aggregate shows B > A, this *only* occurs due to uneven allocation across strata (e.g., more severe patients receiving B).  
  - *Statisticians' standardization argument*: Fully dissolves the paradox here. Standardizing to a common stratum distribution (e.g., overall population) reconciles aggregate and strata. No residual disagreement exists—this is uncontroversial math.  
  - *Why camps fight anyway*: Causalists dismiss this as "not a real paradox," while decision theorists note that standardization requires choosing a reference population—a normative choice masked as technical. *Your committee's first group* (favoring aggregate) effectively chose the observed population as reference; *the second* (favoring strata) implicitly demanded standardization. Both are "right" if the target population is specified.  

  **2. Heterogeneous-Direction Cases (ii): Normative Population Choice**  
  - *The reversal*: Strata disagree (e.g., Treatment A better for mild cases, B for severe), so the aggregate is a weighted average that varies with stratum proportions.  
  - *The stalemate*: Statisticians correctly note the aggregate is "real" for the observed population but avoid saying which population *should* matter. Causalists (e.g., do-calculus) treat this as uninteresting—once you specify the intervention, the effect is stratum-specific. Decision theorists make the implicit norm explicit: **This is a question of *for whom* we are optimizing**.  
  - *Key insight*: The dispute here is **not about facts but about the target of inference**. Your committee's split reflects this: Publishing the aggregate answers "What happened in our network?"; publishing stratified answers "Which treatment is better for *a specific patient*?" Both valid; neither is "truth" without context.  

  **3. Downstream-Stratifier Cases (iii): The Real Causal Disagreement**  
  - *The reversal*: Stratifying on a post-treatment variable (e.g., severity score altered by treatment). Here, *both* aggregate and stratified comparisons are biased.  
  - *Causalists' strength*: They alone resolve this. Conditioning on a collider (e.g., severity) induces spurious associations. The do-calculus avoids this by forbidding conditioning on post-treatment variables without adjustment.  
  - *Statisticians' blind spot*: Standardization fails here because it assumes severity is pre-treatment. Decision theorists struggle too: Evidential DT would condition on severity, while Causal DT would not—but neither addresses identification.  
  - *Your committee's third group* was correct: **This is where a substantive dispute hides**. The question isn't "Which number is right?" but "Can we estimate the causal effect at all?" with existing data.  

  ---

  ### Where Decision Theory Fits: Changing the Question  
  Decision theory (DT) shifts focus from "What is the effect?" to **"What should I do given my knowledge state?"** This applies to all three cases but alters the query:  
  - In (i), Savage's sure-thing principle (STP) insists that if A > B in all strata, A should be chosen unconditionally—but this assumes strata are the *only* relevant states. DT highlights that STP fails if the stratification is incomplete (e.g., unmeasured confounders) or if actions affect stratum membership (as in (iii)).  
  - In (ii), DT forces explicit reference populations: "Should *we* choose for the overall population, or should *this patient* use their stratum?"  
  - In (iii), DT splits into evidential vs. causal camps, but *this is secondary to the identification problem*. DT asks "How should I use available data to act?" while statistics/causality asks "What does this data mean?" They intersect but aren't the same.  

  ---

  ### Diagnosis Summary  
  The dispute is **three distinct phenomena with shared arithmetic symptoms but different resolutions**:  
  - (i) **Arithmetic artifact**: Resolved by standardization; no paradox.  
  - (ii) **Normative ambiguity**: Resolved by specifying the target population.  
  - (iii) **Causal identification problem**: Resolved only by formal causal models or new data.  
  Camps talk past each other because:  
  - Statisticians treat all cases as (i), dismissing (iii) as "bad conditioning."  
  - Causalists treat (i) and (ii) as trivial, focusing on (iii).  
  - Decision theorists absorb (i)/(ii) into rational choice but lack tools for (iii).  

  ---

  ### What Counts as Progress (and What Doesn’t)  
  - **Not progress**:  
    - Endless rehashing of kidney stone/admissions examples as if identical.  
    - "Universal" adjustments (e.g., always standardize) or claiming one camp "wins."  
  - **Progress**:  
    1. **Decomposition convention**: Papers must classify reversals as (i), (ii), or (iii) upfront.  
    2. **Reporting norms**:  
       - For (i): Report standardized effects.  
       - For (ii): Report stratum-specific effects *and* justify the target population.  
       - For (iii): *Do not report* until causal structure is modeled (e.g., via sensitivity analysis).  
    3. **Formal result for invariance**: In (i), a theorem showing that standardization eliminates reversal iff direction is uniform—this exists but is under-emphasized.  
    4. **Change of question in DT**: Explicitly separate "What should I do?" from "What is the effect?"  

  ---

  ### Practical Bite for Your Committee  
  - **Your data**: Severity recorded *post*-assignment makes this **case (iii)**. Both aggregate and stratified comparisons are biased. Publishing the aggregate with a footnote is misleading; publishing strata is worse.  
  - **Immediate advice**:  
    - Retract the published aggregate. State that causal interference (severity as collider) invalidates both comparisons.  
    - If possible, use pre-treatment severity proxies (e.g., comorbidities) to re-analyze as (i) or (ii).  
    - If no proxies exist, estimate bounds for the causal effect (e.g., via sensitivity parameters for severity’s treatment-dependence).  
  - **Long-term**: Demand recording of *pre*-treatment severity for future studies. In committee discussions, force clarity: "Are we asking about our network’s outcomes (descriptive), optimal treatment for a subgroup (prescriptive), or the intervention’s effect (causal)?"  
    
  **In essence**: Your hypothesis is correct. The "paradox" is a pointer to three different problems—one solved, one normative, one causal. Recognizing this ends the stalemate; it doesn’t resolve all questions but tells us *which* questions to ask.
