  I'll explain why other diagnoses are insufficient: not merely verbal because different mechanisms are involved; not purely about action-guiding quantities because that doesn't resolve (iii); not ill-posed when properly specified.

  For progress: I'll recommend a decomposition convention that clearly separates the three phenomena, with reporting norms requiring specification of causal structure and target population. For the user's committee, I'll advise that since severity is downstream, both aggregate and stratified comparisons are biased, and they need to either model the causal pathway or find pre-treatment severity measures.

