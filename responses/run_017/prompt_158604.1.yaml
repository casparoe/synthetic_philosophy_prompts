answer: |-
  Your analysis is exceptionally sharp, and your friend's "onset/isochron/arrival" framework is insightful. The Anthropocene debate exposes deep tensions in geology's conception of time, evidence, and the nature of human agency. Let's dissect the issues:

  1.  **The Golden Spike Practice: What It Presupposes:**
      *   **Globally Synchronous Boundaries:** This is the core presupposition. The GTS is fundamentally a tool for **global correlation**. A "golden spike" (GSSP) defines an *instant* in time (within the resolution of the marker), recorded simultaneously across the globe in the material record. This allows geologists anywhere to identify the same boundary in their local strata and correlate sections globally. Without this synchrony, correlation becomes probabilistic or impossible.
      *   **A Material Record for the Deep Future:** The marker *must* be a physical, durable alteration of the Earth's strata (sediments, ice, speleothems) that can be preserved and detected by future geologists millions of years hence. It's a "signal" meant to survive deep time.
      *   **A "Natural" Signal:** Traditionally, markers were changes driven by Earth system processes (e.g., volcanic ash layers, isotopic shifts from climate change, extinction horizons). While human artifacts (pottery, tools) define archaeological periods locally, a *global geological* marker being an *intentional human artifact* (plutonium) is unprecedented and deeply challenges the implicit "naturalness" of geological drivers.
      *   **Discrete Events over Gradual Processes:** The practice favors sharp, globally identifiable events as boundaries. It struggles conceptually with gradual, diachronous processes (like the spread of agriculture or industrialization) as the *defining characteristic* of a period's start. The boundary is a point, not a transition zone in the GTS model.
      *   **Discoverability vs. Convention:** It leans heavily towards **discovery**. The "best" marker is the one that creates the most precise, globally identifiable isochronous surface. The *decision* is conventional (choosing the site/marker), but the *validity* of the marker is judged on its objective properties (synchronicity, uniqueness, durability, detectability).

  2.  **What it Rules Out (or Struggles With):**
      *   **Diachronous Periods:** Your friend's "arrival" concept fundamentally conflicts with the golden spike. If the "start" of the Anthropocene is different in the Amazon vs. Europe vs. the deep ocean, the GTS *cannot* formally define it as a chronostratigraphic unit with a single base. The GTS requires *one* globally synchronous boundary.
      *   **Process-Based Definitions:** Defining a period primarily by a *process* (human impact) rather than a discrete *event* marking its clear beginning is alien to the GTS structure. The Holocene subdivisions (Greenlandian, etc.) are controversial precisely because they try to pin short climate events as boundaries, pushing the system's limits.
      *   **Short-Duration Periods:** Many geologists felt the ~70 years since 1950 is far too short for a geological epoch. Epochs typically span millions of years. While the GTS doesn't specify minimum durations, the practicalities of identifying and correlating such a thin slice globally, millions of years in the future, seemed dubious to the voters.
      *   **Human Artefacts as Primary Markers:** Using plutonium fallout – a direct product of specific human geopolitical decisions – as the *defining global marker* was deeply problematic for some. It blurred the line between geology and archaeology/history in an uncomfortable way, implying human culture itself is now a primary geological force, not just its environmental consequences.

  3.  **The Vote vs. Ubiquitous Use: Consistency or Equivocation?**
      This is the crux of the tension. It highlights a distinction geology often makes but rarely states so starkly:
      *   **Formal Chronostratigraphy (GTS):** A highly specific, technical system for global correlation based on material strata. Requires strict adherence to rules (synchrony, material marker). Authority resides in the ICS hierarchy and votes.
      *   **Informal Geological Terminology/Concept:** Broader concepts used to describe Earth history, processes, and human impact ("Ice Age," "Anthropocene"). These are driven by scientific utility and broader discourse, not solely GTS rules.
      The subcommission effectively said: "This concept ('Anthropocene') is scientifically vital and descriptively powerful for understanding human impact on the Earth system *as a whole*, but it **does not meet the specific, stringent criteria required for inclusion as a formal chronostratigraphic unit** within the GTS framework." They rejected the *formalization*, not the *concept*.
      *   **Is it Equivocation?** It can feel like it. But it's arguably consistent within the discipline's internal logic. The vote concerns the *technical framework for correlation*. The widespread use acknowledges the *scientific reality and utility of the concept* outside the strict confines of that framework. It acknowledges that "periods" can be meaningful concepts in different ways for different purposes.

  4.  **Adopting the "Arrival" View: Consequences for the Practice:**
      Adopting your friend's view would necessitate abandoning the core principles of the GTS as it currently exists:
      *   **Loss of Global Correlation:** The primary function of the GTS – to provide a single, globally applicable timeline defined in rock – would collapse. You couldn't definitively say two sections record "the same interval" of the Anthropocene if it started at different times in each location.
      *   **Loss of Mappability:** Geological maps rely on synchronous units. A diachronous "Anthropocene" couldn't be mapped as a discrete unit with a single base.
      *   **What Would Remain?** It would cease to be a formal **chronostratigraphic period** (a unit of rock/time defined by its boundaries). It would become:
          *   An **Event:** The "Anthropogenic Event" – a complex, protracted, diachronous transformation of the Earth system initiated by humans.
          *   A **Process:** The ongoing process of human-caused global change.
          *   A **Conceptual/Epochal Term:** Used in Earth System Science, social sciences, humanities to denote the current phase of planetary history dominated by human influence, *without* claiming a synchronous geological start. This is essentially how it's used now *outside* formal stratigraphy.
      *   **Practicality:** While conceptually appealing, defining thousands of local "arrival" dates for a single "period" is impractical for the GTS's goal of a simple, universal reference framework.

  **Conclusion: What's Truly at Stake?**

  1.  **The Nature of Geological Time:** Is geological time best divided by globally instantaneous boundaries, or is it inherently more complex, featuring thresholds crossed at different times and places? The GTS presupposes the former for practical correlation; the Anthropocene highlights the latter.
  2.  **Human Agency vs. Natural Forces:** Does the inclusion of a period defined by a human artefact signal that humanity has become a geological force indistinguishable from volcanism or orbital cycles? Or does it fundamentally violate the "natural" ontology of geology? The plutonium spike forces this question.
  3.  **Purpose of the Geological Time Scale:** Is the GTS purely a correlation tool for deep-time stratigraphers, or should it also reflect the dominant Earth system processes of the *present*, even if they challenge traditional methods? The vote suggests the former is prioritized for formal inclusion.
  4.  **Epistemic Authority:** Who decides? The small committee has authority over the *formal technical framework*. But the widespread use of "Anthropocene" across science and society shows that the *concept* derives its authority from its explanatory power and resonance, independent of the ICS vote. This creates friction.
  5.  **The Practical vs. the Conceptual:** The GTS is optimized for correlating deep time. The Anthropocene is a concept born from understanding the profound, rapid, complex changes of the *present* Earth system. Forcing the present into a framework designed for the deep past is inherently awkward.

  **In essence:** The golden spike practice presupposes a world where geological time is divisible by globally synchronous, physically legible, durable events, primarily driven by non-human Earth system processes. The Anthropocene, as a phenomenon driven by human activity, spreading diachronously, and potentially defined by a very recent human artefact, challenges every one of those presuppositions. The rejection wasn't about denying human impact; it was about concluding that this impact, as currently defined and proposed, doesn't fit the specific, rigid mold required for a formal GTS unit. The term survives and thrives because that rigid mold isn't the only – or even the most important – way to understand our current planetary moment. Your friend's "arrival" view is likely a better description of the *phenomenon*, but it fundamentally breaks the *practice* of formal chronostratigraphy.
