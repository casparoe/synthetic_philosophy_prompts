prompt: |-
  I work on the payments side of a mid-sized public program that hands out money to organisations for things we want more of -- restoring wetland, retrofitting old buildings, running job training, that sort of thing. The rule we apply, and as far as I can tell every program remotely like ours applies some version of it, is that we are only supposed to pay for the bit that would not of happened anyway. Internally we call it additionality. What I want from you is: what is a program like ours actually committed to, philosophically, by running that test? Because the longer I do this job the more it looks like the test is doing three or four different jobs and only one of them is the job we say it's doing.

  Here's what I mean. On the application form, before anything has happened, we ask applicants the present-tense or future-tense question: if we don't fund you, will you still do this? On audit, two years later, after the thing is done and everyone knows how it turned out, we ask the past-tense question: would you have done this without our money? And I've started to think these are not the same question at all. The first one is asked while the decision is still open, and applicants answer it like they're deciding or negotiating -- a lot of them answer it like a threat, and our own training tells us not to reward that, because someone saying pay me or I walk is just bargaining. The second one is asked when the thing is settled, and people answer it like a question about a fixed fact, and they seem to reason backwards from what actually happened: we did it, so I suppose we'd of found the money somehow. I've watched the same outfit give genuinely different answers to those two questions and I don't think it's only self-interest, though obviously it's partly that.

  Then there's a third move. When we can't get a straight answer out of anyone, we quietly switch to a completely different question: is this the sort of thing that people are doing anyway? Is it already legally required? Would any outfit in this line of work be doing it without a subsidy? That's not about the applicant at all -- it's a generalisation about a class of cases -- and everybody in the office treats it as if it were the same question, just easier to answer.

  And then the fourth thing, which is the one that really bugs me. Even when we've been extremely strict about the individual would-have question at the eligibility stage, the size of the payment is worked out against a regional average, not against what this applicant would have done. So the yes/no is counterfactual and the how much is statistical, and nobody seems to notice the whiplash.

  So: reconstruct the theory that all this presupposes. Does it presuppose that there is a determinate fact of the matter about what a particular organisation would have done? Does it presuppose that the future-tense question and the would-have question have to have the same answer, and if it does, is that presupposition one anybody has defended? Does it need causation to be a matter of difference-making for the individual case, or would a purely probabilistic or statistical view run the whole thing? Is there anything special or dodgy about the fact that the antecedent is about the applicant's own decision -- that the thing we're hypotheticalising away is the very choice we're trying to buy, and that asking about it might change it or make it uncheckable? Tell me which parts of our practice strictly require the strong counterfactual machinery and which parts would survive just fine if we replaced it with averages, and which of the four things I described are flatly in tension with each other. And if we dropped the test entirely -- paid everyone who did the thing, or paid a rate calibrated off randomised trials of the whole program -- what would we actually be giving up, and what would we gain?

  One more thing about how I want the answer pitched: I don't want a reading list or citations, I want it in your own words, and I want you to mark clearly which bits are settled and which are genuinely fought over by people who work on this, and not quietly present one side of a live fight as the consensus. Where you're going past what's actually established and into your own reconstruction, say so and say how confident you are.
reasoning: |-
  Okay, let me unpack this user's question. They work in a public program funding projects like wetland restoration or job training, using the additionality principle—only paying for what wouldn't happen otherwise. But they've noticed four inconsistencies: future vs. past tense questions, shifting to general cases when unsure, using statistical averages for payment amounts despite individual counterfactuals, and tension between these methods.

  First, I need to reconstruct the philosophical commitments behind additionality. The core idea is efficiency—avoiding deadweight loss. But the user's observations challenge whether this is achievable. The future-tense question ("Will you do this without funding?") is predictive and involves bargaining, while the past-tense ("Would you have done it?") is retrospective and often biased by outcome. Then there's the shift to categorical reasoning when unsure, which is about typical behavior, not specific cases. Finally, payment based on averages clashes with the individual counterfactual approach.

  The user is asking about the presuppositions: Is there a determinate fact about what an organization would have done? Do the future and past questions align? The answer is no—behavioral economics shows hindsight bias and strategic responses. The payment method's statistical approach contradicts the individual counterfactual, revealing a tension between precision and practicality.

  They also wonder about dropping additionality entirely. Alternatives like paying all who deliver or using randomized trials could reduce administrative burden but risk funding non-additional projects. The trade-off is between efficiency and practicality. The user's deeper need might be for a more honest, feasible system rather than clinging to a flawed counterfactual.

  I should clarify where there's consensus (e.g., additionality's goal) vs. debate (e.g., feasibility of individual counterfactuals). The shift to categorical reasoning is a practical workaround but philosophically inconsistent. The payment mismatch highlights a core tension: individual assessment vs. scalable methods.

  In conclusion, the program's practices reveal unresolved conflicts between theoretical ideals and operational realities. The user might benefit from acknowledging these tensions and considering hybrid approaches, balancing rigor with practicality.
answer: |-
  Here's a reconstruction of the philosophical commitments and tensions within your additionality practice, based on your sharp observations:

  **Core Philosophical Commitment (The Stated Goal):**
  At its heart, the additionality test commits your program to **Maximizing Net Social Benefit per Dollar Spent.** The core idea is:
  1.  **Avoiding Deadweight Loss:** Public money shouldn't simply replace private funds that *would have been spent anyway* on the same activity. Paying for something that would happen regardless is pure waste (deadweight loss) from the public purse.
  2.  **Achieving Incremental Change:** You are explicitly funding *change* – bringing about outcomes (restored wetlands, retrofitted buildings, trained workers) that *would not exist* without your intervention. Your impact is measured by this difference.
  3.  **Counterfactual Baseline:** This necessitates constructing a hypothetical world – the "counterfactual" – where your program *doesn't exist*, and comparing what happens there to the actual world where you *did* fund the project. The value you create is the difference between these two worlds.

  **The Tensions and What They Reveal:**

  1.  **Future-Tense "Will You?" vs. Past-Tense "Would You Have?"**
      *   **Presupposition:** That there exists a single, knowable, determinate fact about what a *specific organization* would have done in the absence of funding at a *specific point in time*. It presupposes that an organization's counterfactual actions are fixed and discoverable.
      *   **The Problem:** This is **highly contested and likely false** in many cases. As you observe:
          *   **Strategic Behavior:** The future question ("Will you?") is answered in a context of negotiation and uncertainty. Applicants are incentivized to say "No" (or imply it) to get funding. This is *not* a neutral inquiry into a fixed fact; it's part of a bargaining process where the answer *influences* the outcome.
          *   **Hindsight Bias & Cognitive Dissonance:** The past question ("Would you have?") is answered *after* the project is completed, often successfully. Humans naturally reconstruct the past to fit the present outcome ("We did it, so obviously we *must* have found a way"). Admitting "No, we wouldn't have" might feel like admitting incompetence or poor planning. This introduces significant bias.
          *   **Indeterminacy:** For many projects, especially complex ones, there *isn't* one clear path the organization would have taken. Their future actions depended on evolving circumstances, changing priorities, and unpredictable funding opportunities. The counterfactual is fundamentally fuzzy.
      *   **Tension:** The program treats these as the *same* question accessing the *same* fact, but they are asked in fundamentally different contexts (pre-decision negotiation vs. post-hoc justification) and are subject to different cognitive biases. **They are not reliably the same question.**

  2.  **Shifting to "Is This Normally Done Anyway?" (Categorical Additionality)**
      *   **Presupposition:** That reliable counterfactuals for *individual* cases are often impossible to obtain, so the best available proxy is **typical behavior within a class**. It implicitly commits to a **probabilistic or statistical view of causation** ("Projects *like this* are rarely/never done without subsidy").
      *   **The Problem:** This abandons the core commitment to the *individual counterfactual*. It replaces "What would *this* organization have done?" with "What do organizations *like this* usually do?" It's a pragmatic fallback, not the same test.
      *   **Tension:** This is **flatly in tension** with the *stated* principle of individual additionality. It sacrifices precision for practicality and consistency. It's a tacit admission that the strong individual counterfactual is often unworkable.

  3.  **Individual Counterfactual (Yes/No) vs. Statistical Payment (How Much)**
      *   **Presupposition:** That while the *existence* of additionality is a binary, individual fact, *quantifying its magnitude* (the value of the incremental outcome) requires broader market data or typical cost structures.
      *   **The Problem:** The whiplash is real. The eligibility decision screams "This is ALL about *your specific* counterfactual!" Then the payment whispers "...but how much we pay is based on what *everyone else* typically spends/does/saves." It treats the *incrementality* as absolute (happened/didn't happen) but the *cost/value* of that increment as relative to a norm.
      *   **Tension:** This creates a **logical inconsistency**. If the project is truly *additional* for *this* applicant, the "incremental cost" should theoretically be the *full cost they incurred* because they wouldn't have done it otherwise (or perhaps only the marginal cost beyond what they *would* have done). Using a regional average implicitly acknowledges that the individual counterfactual might not be perfectly knowable even for the "yes" decision, or that full cost recovery creates perverse incentives. It's a messy compromise.

  **What Requires Strong Counterfactuals vs. What Survives on Averages:**

  | **Program Element** | **Requires Strong Counterfactual?** | **Could Use Averages?** | **Reasoning** |
  |---------------------|------------------------------------|-------------------------|--------------|
  | **Eligibility (Yes/No)** | **Yes, strictly** | No | Core additionality principle hinges on individual counterfactual. Averages can't tell if *this* applicant would have acted. |
  | **Payment Amount** | No | **Yes** | Already does! Statistical averages are a practical way to estimate costs/benefits without impossible individualized counterfactual costing. |
  | **Categorical Test** | No | **Yes, inherently** | The categorical approach *is* using averages/generalizations by definition. |

  **Dropping the Test Entirely: Gains and Losses**

  *   **Option 1: Pay Everyone Who Does the Thing (Output-Based)**
      *   **Gain:** Massive reduction in administrative burden, complexity, and applicant gamesmanship. Faster payments. Clearer, more predictable rules. Potentially attracts more applicants.
      *   **Loss:** **Abandons additionality entirely.** Significant deadweight loss – you pay for many projects that would have happened anyway. Dramatically reduces net social benefit per dollar spent. Public funds are effectively wasted on non-incremental outcomes. Philosophically abandons the commitment to funding *change*.

  *   **Option 2: Pay a Rate Calibrated by Randomized Controlled Trials (RCTs)**
      *   **Gain:** Rigorous estimate of *average* program-level additionality and impact. Avoids individual counterfactual quagmire. Payments are simple and formulaic. Stronger evidence base for overall program value.
      *   **Loss:** **Sacrifices individual-level additionality.** You *will* fund some non-additional projects (false positives) and potentially underfund or miss some highly additional ones (false negatives depending on design). Requires significant upfront investment in RCTs and assumes results are stable over time/contexts. Doesn't solve the "how much to pay per unit" question perfectly (still needs cost benchmarks). Less responsive to unique, high-impact individual projects that deviate from the average.

  **The Antecedent Problem (Buying the Choice):**
  This is a profound, often underappreciated, issue. Asking "What would you do without us?" about the *very activity you are trying to incentivize* creates fundamental problems:
  1.  **Self-Defeating Inquiry:** The act of offering funding *changes* the counterfactual world you're trying to measure. The applicant's answer is now part of a strategic interaction, not a neutral report.
  2.  **Unobservability:** The counterfactual outcome (what *would* have happened without funding) is inherently unobservable. You can only ever infer it, often poorly.
  3.  **Circularity:** You're trying to verify the necessity of your funding by asking the entity whose decision to act you are trying to purchase. Their incentive is to claim it was necessary.

  **Consensus vs. Debate:**

  *   **Settled:** The *goal* of avoiding deadweight loss and funding incremental change (additionality) is widely accepted as a core principle of efficient public spending in programs like yours.
  *   **Settled:** Individual counterfactuals are **notoriously difficult, often impossible, to verify with certainty.** Strategic behavior and hindsight bias are real, significant problems.
  *   **Fought Over:**
      *   **How much weight to give individual counterfactual assessments vs. categorical/probabilistic approaches?** Purists insist on the former despite its flaws; pragmatists increasingly lean towards the latter for efficiency and consistency, accepting some error.
      *   **Is the RCT-based approach a superior *practical* alternative?** Economists often champion it for robust average impact measurement, but practitioners worry about cost, feasibility, ethical concerns (denying services for control groups), and its blindness to individual project merit.
      *   **How damaging is the payment amount whiplash?** Some see it as a necessary compromise; others see it as a fundamental philosophical inconsistency undermining the credibility of the additionality claim.
      *   **Can the "antecedent problem" be solved?** Most theorists acknowledge its severity. Solutions are hotly debated (e.g., better econometrics, different incentive structures, abandoning strict individual counterfactuals).

  **My Reconstruction & Confidence:**

  Your practice reveals a program philosophically committed to individual additionality but operationally strained by its impossibility. The "four different jobs" reflect **necessary coping mechanisms** for an unattainable ideal:

  1.  The future-tense question is a **bargaining tool** masquerading as a counterfactual inquiry (High Confidence).
  2.  The past-tense question is a **hindsight-biased reconstruction** (High Confidence).
  3.  The categorical shift is a **pragmatic surrender** to the unobservability of individual counterfactuals, adopting a probabilistic view (High Confidence).
  4.  The payment mismatch **exposes the fiction** that the "yes/no" decision is truly based on a knowable, precise individual counterfactual. The payment system acknowledges broader market realities the eligibility system pretends to ignore (High Confidence).

  **In essence:** Your program is genuinely committed to funding *incremental change*. However, the operational reality demonstrates that **strict individual counterfactual additionality is largely a myth.** Your practices are a patchwork of attempts to approximate this ideal while dealing with strategic actors, cognitive biases, unobservable realities, and administrative feasibility. The core tension is between the *philosophical purity* of the additionality principle and the *messy practicality* of implementing it in the real world. The move towards categorical reasoning and statistical payment reveals a program slowly, perhaps unconsciously, evolving towards a more probabilistic understanding of causation and impact, because the strong counterfactual model is breaking down under its own weight. (Confidence: High based on your observations aligning with well-known problems in causal inference and program evaluation).
