answer: |-
  Here is a specification of desiderata for an adequate account of the doing/allowing distinction, structured around your requirements, the tension you identify, and a scoring of major families. The non-negotiables are bolded.

  ---

  ### **Desiderata for an Adequate Account of the Doing/Allowing Distinction**

  1.  **Extensional Adequacy (Non-Negotiable)**:
      *   *Requirement*: Must correctly classify core intuitive cases (e.g., redirect threat ≠ killing for organs; declining to summon help = allowing; discontinuing futile support ≠ killing; earlier threat-creation + later non-removal = doing; double-prevention cases sensitive to who initiated the chain; composite cases where aggregate omissions cause harm).
      *   *Case & Reason*: The distinction is invoked *because* of these intuitions in ethics/law. An account failing here loses its raison d'être. The hospital's withdrawal case and the company's "default setting" case hinge on these distinctions.

  2.  **Non-Collapse (Non-Negotiable)**:
      *   *Requirement*: Must conceptually distinguish doing/allowing from intending/foreseeing, enabling, and failing to prevent. Must also distinguish whether the distinction has pro tanto weight vs. being decisive, and whether it *tracks* moral difference vs. merely summarizing other factors.
      *   *Case & Reason*: Clinicians discontinuing support *foresee* death but don't necessarily *intend* it or *do* it. The company "alert acknowledged/dropped" is a failure to prevent, distinct from actively sabotaging a system. Confusing these leads to misapplication (e.g., DDE overreach).

  3.  **Operationalizability (Non-Negotiable)**:
      *   *Requirement*: Must provide identifiable, non-metaphysical, fact-based criteria applicable by non-philosophers from written reports. Must pinpoint load-bearing facts and resolve disagreements factually/theoretically, not intuitively.
      *   *Case & Reason*: Both the ethics committee and review board need actionable guidance ("Was this discontinuation allowing or doing?", "Was this ignored alert a contributory omission?"). Philosophy must serve practice here.

  4.  **Consistency with Role/Relationship Duties (Non-Negotiable)**:
      *   *Requirement*: Must accommodate the absence of a general duty to rescue while recognizing specific duties arising from roles (clinician, system operator) or relationships (parent-child).
      *   *Case & Reason*: The hospital case *presumes* a clinician's duty; the company case may involve operator responsibilities. The relative declining help exploits the lack of general duty. An account ignoring this renders medical/role ethics incoherent.

  5.  **Robustness to Description & Baseline (Preference - Strongly Held by Many)**:
      *   *Requirement*: Must resolve cases where the same physical act (hand in pocket, walking away) can be described as doing or allowing. Must specify how the "normal course" baseline is fixed and constrain how much it can be moralized.
      *   *Case & Reason*: "Withholding vs. withdrawing" and "delay letting condition worsen" cases turn on baseline shifts. Over-moralization risks circularity (permissible allowing = no duty violated). Needed for conceptual clarity.

  6.  **Explanatory Power for Asymmetry Intuitions (Preference - Empirical/Ordinary Language Camp)**:
      *   *Requirement*: Should explain why the asymmetry feels robust in ordinary judgment (e.g., vaccination reluctance, greater blame for active harm) even when stakes are controlled, without necessarily endorsing its moral weight.
      *   *Case & Reason*: Understanding public distrust of "active" interventions (e.g., withdrawing life support, algorithm adjustments) requires grappling with this deep-seated intuition.

  7.  **Compatibility with Skepticism about Independent Moral Weight (Preference - Consequentialist/Skeptical Camp)**:
      *   *Requirement*: Should be compatible with the view that the distinction itself lacks *fundamental* moral weight, even if it correlates with other morally significant factors (intent, cost, duty).
      *   *Case & Reason*: The core tension you identify. Many argue the moral work is done by duties, rights, intentions, costs – not the doing/allowing distinction itself. An account should not *require* independent weight.

  ---

  ### **The Tension: Moralized Baseline vs. Grounding & Operationalization**

  Your tension is **real and significant**. An account that perfectly satisfies **Extensional Adequacy** and **Robustness to Description & Baseline** (especially matched pairs like withhold/withdraw or delay cases) almost inevitably requires a baseline that is partly **moralized** (e.g., what was expected, what counts as an intervention on a prior state of affairs). However:

  1.  **Operationalization** strongly pushes *towards* moralization. A checklist for a review board asking "Was there a duty?", "Was the baseline defined by role?", "Did the action worsen against this baseline?" is far more usable than intricate counterfactual or causal analyses. This aligns with **Consistency with Role Duties**.
  2.  **Explanatory Power/Grounding** is undermined by moralization. If "allowing" just means "not violating a duty to intervene," then the distinction collapses into duty analysis. It can't *explain* why we have stronger duties against doing harm (if we do) – it presupposes them. **Compatibility with Skepticism** becomes trivial.

  **This is primarily a defect of demanding too much from the distinction.** We want it to both *explain* fundamental moral asymmetry *and* be a simple, duty-based operational tool. These goals conflict. **Operationalizability** is the requirement doing the most work in *excluding* complex metaphysical accounts (causal process, fine-grained counterfactuals) and pushing towards duty/moralized baseline views, even at the cost of independent grounding power. The distinction might be best seen as a **heuristic summary** of other morally relevant factors (especially duties and worseness) in many contexts, rather than a fundamental moral primitive.

  ---

  ### **Scoring Major Account Families (Briefly)**

  *   **Causal-Process/Counterfactual Accounts (e.g., Foot, Bennett):**
      *   *Pros*: Strong on **Extensional Adequacy** for core cases (trolleys, omissions), can handle double-prevention. *Sometimes* addresses baselines physically.
      *   *Cons*: **Operationalization Nightmare** (metaphysical disputes on causation, fragile counterfactuals). Struggles with **Robustness to Description/Baseline** (withhold/withdraw, delay cases) & **Consistency with Role Duties**. Poor fit for **Operationalizability** and **Non-Collapse** (often blends with enabling/failing to prevent).

  *   **Intention/Means-Based Accounts (DDE vicinity):**
      *   *Pros*: Addresses **Non-Collapse** (separates intent from act type), relevant to clinical intent in withholding.
      *   *Cons*: **Fails Extensional Adequacy** fundamentally. Redirecting trolley (doing) vs. killing one for organs (doing) both use victim as means – yet one is intuitively permissible allowing? Cannot handle omission cases robustly. **Operationalization** difficult on intent. Collapses **doing/allowing** into **intending/foreseeing**.

  *   **Constraint/Rights-Based Accounts ("Not Worse Off", e.g., Quinn, Kamm):**
      *   *Pros*: Best fit for **Extensional Adequacy** (handles trolley variants, withdraw/withhold, delay, role duties via rights/duties). Strong on **Robustness to Baseline** (worseness defines baseline). Directly incorporates **Consistency with Role Duties**. Most promising for **Operationalizability** (checklist: "Did act make victim worse off against expected baseline/duty?").
      *   *Cons*: **Moralization Tension Acute:** Baseline is often defined by moral expectations (duties, rights), risking circularity and undermining independent grounding (**Compatibility with Skepticism** becomes description, not challenge). "Worse off" can be tricky (e.g., composite cases).

  *   **Skeptical Views (Asymmetry is Illusion):**
      *   *Pros*: Trivially satisfies **Compatibility with Skepticism**. Avoids baseline problems. Focuses on core factors (duties, costs, consequences) – aids **Operationalizability** via duty-checklists.
      *   *Cons*: **Fails Extensional Adequacy** catastrophically (denies intuitive difference between pushing vs. omitting to save). Ignores **Explanatory Power for Asymmetry Intuitions**. Offers no distinct **distinction**, just dissolves it. Unhelpful for hospital/company needing to *apply* the distinction embedded in their existing frameworks.

  **Conclusion:** No family satisfies all perfectly. **Constraint/Rights-Based** ("not worse off") scores best overall on **Non-Negotiables (Extensional Adequacy, Non-Collapse, Operationalizability, Role Duties)**, making it the most viable *despite* the moralization tension. It offers the best practical tool, acknowledging that the distinction may not be fundamental but is a crucial heuristic summarizing worseness and duties. This directly serves your consulting needs while providing a coherent, if not metaphysically pristine, framework for your chapter. The tension reveals the distinction's nature: less a bedrock moral truth, more a complex practical marker shaped by duties, expectations, and causal roles.
