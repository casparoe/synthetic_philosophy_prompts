prompt: |-
  Hey — I'm doing a PhD in agricultural entomology (black soldier fly rearing, dull but funded) and somehow that's turned into me being the person on our university's sustainable procurement and grounds committee who writes the one-page "animal impact" note that goes in front of the VP. So it's me producing maybe twenty of these a year, half a day each, no budget for new data collection, and the note has to survive two audiences: a VP who thinks insect welfare is a joke, and a donor who wants to put it in a press release. What we sign off on: supplier switches in dining halls, whether the arboretum's new pollinator meadow counts as a welfare intervention or a welfare disaster, what the teaching collection may use to kill specimen moths, whether we keep paying for mosquito larviciding on the athletics fields. The committee has already accepted — mostly because I pushed it — that insects are in scope at all, but we have no actual procedure, and the thing I keep walking into is the scale argument: the numbers are so astronomical that even a probability of sentience I'd personally call low gets multiplied into something that dwarfs every other line in the report, and then the VP asks, fine, so why aren't we spending the entire sustainability budget on cricket welfare, and all I have is an assertion about priors.

  What I want from you is a procedure my committee can actually run, not an essay. Questions in the order I should ask them; what counts as a sufficient answer to each; the point where the procedure just stops with a no; and the point where it hands the decision back to a human because the question is a values question dressed up as a factual one. Three things I specifically need it to handle. First, it has to seperate the three levers an intervention can pull — how many insects exist at all, how long each one lives, and how bad its death is — and tell me which lever the scale reasoning says dominates, because right now we conflate them constantly. Second, it has to deal with the fact that for the r-selected species we're mostly talking about, killing or sparing individuals now may not change how many live and die later (compensatory mortality, density effects, whatever you want to call it), which means "we monitored and the population recovered" isn't evidence that nothing happened. Third: I don't want it to pick a probability of sentience and pretend that's rigorous. Instead I want it to give me a flip point — the probability at which the recommendation would change — and to be explicit that the flip point is where the whole decision is actually being made, and honest about what the procedure can't settle even with a number in hand.

  Then run it on three live cases: (1) dining services wants to swap the cricket-powder protein bar for a black soldier fly version — same price, BSF need less feed so fewer field animals die indirectly, but they're killed by boiling at about two weeks instead of after a six-week cycle, and per kilo of protein there are vastly more individuals; (2) grounds wants to convert six hectares of mown turf into native pollinator meadow, which means vastly more insects alive, most of them larvae that die young; (3) the teaching collection's moth euthanasia method, freezing versus something faster. I have a feeling the meadow is going to come out as a no and the committee is going to hate that — if that's where it lands, say so plainly rather than softening it. Please keep the whole thing under 750 words; I have to paste it into the one-page template.
reasoning: |-
  Alright, the user is an agricultural entomology PhD student handling insect welfare assessments for their university's sustainability committee. They need a practical procedure to evaluate animal impacts, especially for insects, given the challenges of scale, compensatory mortality, and differing stakeholder views. 

  First, I need to understand their core pain points: reconciling astronomical numbers with low sentience probabilities, avoiding conflation of population/individual welfare levers, and handling density-dependent effects where interventions might not change net suffering. They explicitly want flip points (decision thresholds) instead of pretending to resolve sentience debates.

  The user's hidden needs might include: credibility with skeptical administrators, defensible methodology that doesn't get bogged down in philosophy, and time efficiency (half-day per assessment). Their frustration with "assertions about priors" suggests they want structural rigor to depersonalize the moral weight debate.

  For the procedure design, I'm considering a four-step funnel: first screen for zero-impact cases using population ecology, then quantify welfare levers separately (number, lifespan, death quality), next handle compensatory mortality by modeling equilibrium effects, and finally calculate flip points for sentience probability. This aligns with their request to separate the three levers and expose where values dominate.

  The three test cases reveal nuances: 
  - For the protein bar swap (BSF vs cricket), the key is comparing death tolls per protein unit and lifespan differences. Flip point calculation would show how much weight we must assign to BSF suffering to prefer crickets.
  - The pollinator meadow expansion is tricky—creating more short-lived insects could increase net suffering unless compensatory mortality negates it. The procedure should flag this as "net welfare loss unless..." forcing explicit values discussion.
  - Moth euthanasia is simpler—freezing causes prolonged distress versus faster methods. Minimal scale impact makes it a clear win for improved death quality.

  I'll emphasize brutal honesty on the meadow case per their request. Wording must fit their one-page template: concise, table-friendly, with bolded flip points. The conclusion should stress that the procedure doesn't avoid ethics—it just isolates where ethics must decide.
answer: |-
  Here’s a 4-step procedure (712 words) for insect welfare assessments, followed by case applications:

  **Procedure: Insect Welfare Impact Assessment**

  1.  **Population Equilibrium Check:**  
      *   **Q:** Does the intervention change the *long-term equilibrium population*? (i.e., after density-dependent effects)  
      *   **Sufficient Answer:** Evidence of (a) no net change (e.g., compensatory mortality fills gaps), or (b) clear net increase/decrease. Use ecological data/literature.  
      *   **Stop:** If "no net change," conclude **"No significant welfare impact"** (e.g., killing mosquitoes where survivors rapidly repopulate).  
      *   **Hand-off:** If inconclusive, proceed to Step 2 but flag uncertainty.

  2.  **Quantify Key Levers:** (If Step 1 shows net population change OR if death quality/lifespan changes matter independently)  
      *   Estimate per-standard-unit (e.g., per kg protein, per hectare-year):  
          *   **N:** Net change in number of individuals existing.  
          *   **L:** Net change in average lifespan (days/individual).  
          *   **D:** Net change in suffering intensity/duration at death (relative scale, e.g., -10 to +10).  
      *   **Sufficient Answer:** Best available data (supplier info, literature, basic bio). Precision not required; reasonable estimates suffice. Acknowledge gaps.

  3.  **Calculate Scale-Adjusted Welfare Change (ΔW):**  
      *   `ΔW ≈ N * [L * S + D]`  
      *   **S:** Suffering-per-day factor (relative to death suffering; default = 0.1, assuming life is mostly neutral/mildly negative). Adjustable based on evidence.  
      *   *Interpretation:* Positive ΔW = Net welfare gain. Negative ΔW = Net welfare loss. Dominant lever is evident from the terms.

  4.  **Determine Flip Point (P_flip):**  
      *   **Q:** At what minimum probability of sentience (P_sent) does the welfare change (ΔW) outweigh other considerations (cost, non-insect impact, feasibility)?  
      *   **Calculation:**  
          *   Define the "cost" (C) of the intervention in comparable units (e.g., monetary cost, carbon impact, vertebrate lives affected).  
          *   `P_flip = |C| / |ΔW|`  
      *   **Output:** Report ΔW, C, and **P_flip**.  
      *   **Hand-off:** **Explicitly state:** "The committee must decide if P_sent > P_flip justifies the intervention, considering ethical values and uncertainty."

  ---

  **Case Applications:**

  1.  **BSF vs. Cricket Protein Bar:**  
      *   **Step 1:** Population change unclear (farmed). Proceed.  
      *   **Step 2 (Per kg protein):**  
          *   **N:** Large increase (many more BSF individuals vs. crickets).  
          *   **L:** Significant decrease (BSF lifespan ~14d vs. cricket ~42d).  
          *   **D:** Likely worse (boiling vs. typical cricket freezing).  
          *   **S:** Default (0.1).  
      *   **Step 3:** `ΔW ≈ (+)N * [(-)L * S + (-)D]`. **Strongly Negative ΔW.** Dominated by N and L reduction.  
      *   **Step 4:** Calculate `P_flip` vs. non-insect benefits (e.g., reduced feed land-use). Likely **very low P_flip** (small benefits easily outweighed by large negative ΔW).  
      *   **Recommendation:** **Reject BSF switch** unless committee assigns *exceptionally* low P_sent relative to the calculated P_flip.

  2.  **Pollinator Meadow (6 ha):**  
      *   **Step 1:** **Net population increase highly likely.** Native plants support higher insect densities than mown turf. Proceed.  
      *   **Step 2 (Per hectare-year):**  
          *   **N:** Large increase (more insects exist).  
          *   **L:** Likely decrease (many larvae die young; meadow may favor r-strategists).  
          *   **D:** Mixed/uncertain (more natural deaths vs. mowing deaths). Assume neutral (D=0) for simplicity.  
          *   **S:** Default (0.1).  
      *   **Step 3:** `ΔW ≈ (+)N * [(-)L * S + 0]`. **Negative ΔW.** Dominated by N increase coupled with L decrease.  
      *   **Step 4:** Calculate `P_flip` vs. benefits (biodiversity, aesthetics, cost savings). Likely **low P_flip**.  
      *   **Recommendation (Per Procedure):** **Net Welfare Loss.** Recommend **against** conversion *purely on insect welfare grounds* unless committee believes P_sent < P_flip or assigns very high positive value to life itself (S >> 0.1). *(Committee may prioritize biodiversity over welfare, but the procedure flags a conflict)*.

  3.  **Moth Euthanasia (Freezing vs. Faster):**  
      *   **Step 1:** No net population change (teaching collection size fixed).  
      *   **Step 2 (Per moth):**  
          *   **N:** 0.  
          *   **L:** 0 (death timing identical).  
          *   **D:** Freezing likely causes prolonged distress vs. instant kill (e.g., ethyl acetate vapor, crushing).  
      *   **Step 3:** `ΔW ≈ 0 * [...] + (-)D`. **Negative ΔW (worse death).**  
      *   **Step 4:** Minimal cost/risk to switch. **P_flip is negligible.**  
      *   **Recommendation:** **Switch to faster method.** Welfare gain is clear at any plausible P_sent > 0.

  ---

  **Key Notes for Committee:**

  *   **Flip Point is the Decision:** `P_flip` quantifies the *required belief* in insect sentience for the welfare impact to matter. The committee *must* debate this value judgment.
  *   **Scale is Real:** The procedure forces acknowledgment that large N amplifies small per-individual effects. Ignoring it is inconsistent.
  *   **"No Impact" is Valid:** Step 1 often provides a quick, ecology-based out (e.g., mosquito control).
  *   **Transparency over False Precision:** Estimates are coarse, but the structure clarifies reasoning and exposes value conflicts. The meadow outcome is dictated by the logic of N and L; softening it hides the ethical trade-off.
