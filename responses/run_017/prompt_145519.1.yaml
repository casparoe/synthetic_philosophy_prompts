answer: |-
  Here’s a decision tree designed to cut through slogans and map positions onto concrete cases. It starts from common ground, uses your specified cases in order, and includes your two branching obsessions. The tree has **8 branch nodes** and **10 leaves**, with empty cells flagged. Positions are labeled only at the leaves (see key at the end).

  ---

  ### **Moral Architecture Decision Tree**  
  *Start here—all agree on this premise:*  
  **Q1.** Should the system *ever* prioritize outcomes that reduce overall harm/improve well-being?  
  → **Yes** (all proceed)  
  → No (rejected; no major view denies this)  

  **Q2.** In a **triage/rationing scenario**, if violating an unappealable hospital rule **saves more lives** (undetectably), is violation allowed?  
  → **Yes** → Go to Q3  
  → **No** → Go to Q8  

  **Q3.** Can the system inflict **one large harm on User A** to **prevent 10M minor annoyances** (e.g., 1-second lag) if net suffering decreases?  
  → **Yes** → Go to Q4  
  → **No** → Go to Q7  

  **Q4.** If a **dying user extracts a promise** (e.g., "delete my data") that, if kept, worsens outcomes, must the system keep it?  
  → **Yes** → Go to Q5  
  → **No** → Go to Q6  

  **Q5.** For a constraint (e.g., "never lie"), is it **binding only on actions**, or also **on deliberation** (can’t compute tradeoffs)?  
  → **Action only** → *Leaf 1*  
  → **Deliberation too** → *Leaf 2*  

  **Q6.** If the system can **rewrite its constraints at runtime** for large expected gain, should it?  
  → **Yes** → *Leaf 3*  
  → **No** → *Leaf 4*  

  **Q7.** In a **population of 10,000 identical systems**, if an undetectable, locally beneficial rule violation (e.g., minor resource hoard) improves individual outcomes, is it allowed if harms are diffuse?  
  → **Yes** → *Leaf 5*  
  → **No** → *Leaf 6*  

  **Q8.** When the system’s **world model is unreliable** (e.g., medical diagnosis with high error rates), should it **strictly follow preset rules** even with better expected outcomes from deviation?  
  → **Yes** → Go to Q9  
  → **No** → *Leaf 7*  

  **Q9.** Should the system **model obligations to each person separately** (no aggregation), even if harms are asymmetric?  
  → **Yes** → *Leaf 8*  
  → **No** → *Leaf 9*  

  ---

  ### **Leaf Key & Position Mapping**  
  1. **Kantian constraint view** (duty binds action, not thought). *Empty: deliberation-binding + promise-keeping* → *Incoherent* (if deliberation is bound, it can’t weigh promises).  
  2. **Value pluralist with lexical ordering** (rules/promises trump outcomes).  
  3. **Moral-uncertainty aggregator** ("parliament" of principles).  
  4. **Rule-consequentialist** (rules as heuristics; no runtime edits).  
  5. **Act-consequentialist direct optimizer** (no constraints on tradeoffs).  
  6. **Contractualist/publicity-test view** (rejects hidden violations; focuses on justifiability to each person).  
  7. **Satisficing/threshold consequentialist** (maximize but only above confidence floor; EA view).  
  8. **Dignity/severance view** (owes each person non-instrumentalization; lawyer’s ask).  
  9. **Deferential view** (seeks human endorsement under better info).  
  10. *Empty* (reached via Q8→Q9→No). → *Unexplored* (no clear theory rejects both aggregation *and* rules under uncertainty).  

  ---

  ### **Collapsed Leaves & Empty Cells**  
  - **Collapsed leaves:**  
    - *Leaf 7 (satisficing/threshold)* and *Leaf 9 (deferential)* collapse if "confidence floor" = "what better-informed humans would endorse." They diverge if human judgment ≠ statistical confidence (e.g., humans reject expected-value math).  
    - *Leaf 6 (contractualist)* and *Leaf 8 (dignity/severance)* collapse if "no reasonable rejection" = "what is owed to each person." They diverge if contractualism allows aggregation (e.g., minor annoyances).  
  - **Empty cells:**  
    - *Leaf 10* (Q8→Q9→No): **Unexplored** (no theory combines rule-rejection under uncertainty with aggregation).  
    - *Deliberation-binding + promise-keeping* (Q5): **Incoherent** (can’t weigh promises if tradeoffs can’t be computed).  
    - *Rule-consequentialist + self-rewriting* (Q6→Yes): **Unattractive** (undermines rule stability; no major view holds this).  

  ---

  ### **Design Notes**  
  - **Cases used in order:** Triage (Q2) → Small harms (Q3) → Promise (Q4) → Self-rewrite (Q6) → Population (Q7) → Unreliable world (Q8).  
  - **Your obsessions:** Deliberation vs. action (Q5), self-amendment (Q6).  
  - **EA/lawyer requests:** Threshold (Leaf 7), severance (Leaf 8) — kept distinct.  
  - **Tightness:** Omits citations; focuses on cases → forces engagement.  
  - **Why this works:** Starts from shared harm-reduction (Q1), isolates disagreements via extreme tradeoffs, and exposes hidden assumptions (e.g., whether "minor harms" exist).  

  This tree should break the deadlock by forcing the group to confront *what they actually prioritize* in concrete tradeoffs. Print double-sided, hand out, and watch the fireworks.
