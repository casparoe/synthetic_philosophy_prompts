  Goal: Build a structure of facts where each fact is either brute (has a BRUTE token) or is grounded in other facts (has an arrow from it to the fact that grounds it). Avoid cycles.

  Steps:
  1. Arrange the 21 fact cards on the table. 
  2. Draw arrows (with string) from a fact A to a fact B to mean "A obtains in virtue of B". 
  3. Place up to 4 BRUTE tokens on facts that have no incoming arrows (they are brute).
  4. Every fact must have either an incoming arrow (and then it must be grounded in a brute fact via a chain) or a BRUTE token.
  5. If you create a cycle (a loop of arrows), you must break it by removing one arrow and explain why. You get a penalty of -20 points for each cycle broken.
  6. After 25 minutes, you will receive 3 gold cards. Add them to the structure and adjust.
  7. Then, there will be an audit round. Each group will challenge another group. When challenging:
     - Pick an arrow in the other group's structure (from fact A to fact B).
     - Write a near miss on a blank card: a fact that is similar to B but not the same, and that would have been the ground if A had been slightly different.
     - Ask: why is B the ground and not this near miss?
     - The challenged group must defend. If they cannot, they remove the arrow and adjust their structure.
  8. After the audit, fix your structure and then calculate your score.

  Scoring:
  - +1 point for each fact that has a path (via arrows) to a BRUTE token.
  - +5 points for each unused BRUTE token (if you have any left).
  - -10 points for each fact that does not have a path to a BRUTE token (dangling).
  - -20 points for each cycle that had to be broken (during building, audit, or final check).

  The group with the highest score wins.

  Facilitator script:

  Start (0-5 min):
  "Today we are going to play a game about how facts relate to each other. You will work in groups. Each group has a set of fact cards. Your task is to arrange these cards and connect them with arrows. The arrow means that the fact at the tail 'obtains in virtue of' the fact at the head. For example, if you have a fact 'The ball is red', you might think it obtains in virtue of the fact 'The ball reflects red light'. You also have four BRUTE tokens. You can place a BRUTE token on a fact that you think doesn't obtain in virtue of anything else — it's just brute. But you only have four tokens. Your goal is to maximize your score. You get points for every fact that is connected (through a chain of arrows) to a brute fact. You also get a bonus for each BRUTE token you don't use. But you lose points for any fact that isn't connected to a brute fact and for any cycles (which you must break). After about 25 minutes, I'll give you three special gold cards to add. Then, we'll have a challenge round where groups can question each other's arrows. Finally, we'll score. Any questions? You have 25 minutes starting now."

  During building, walk around and help if there are rule questions.

  At 25 min: "Stop. Now each group gets three gold cards. They are facts just like the others and must be incorporated into your structure. You have 5 minutes to add them and adjust your structure."

  At 30 min: "Stop. Now we move to the audit round. Each group will challenge another group. Here is the order: Group 1 challenges Group 2, Group 2 challenges Group 3, Group 3 challenges Group 4, Group 4 challenges Group 1. First, take 2 minutes to choose an arrow in the group you are challenging and write a near miss card. A near miss is a fact that is similar to the ground they used but not the same, and that would have been the ground if the fact at the tail had been slightly different. Then, when it's your turn, present the challenge. The challenged group has 1 minute to respond. If they cannot defend why their ground is the right one and the near miss is not, they must remove the arrow and adjust their structure. Let's start. Group 1, challenge Group 2 now."

  Then facilitate the challenges, keeping time.

  After challenges: "Now, groups have 3 minutes to fix their structures if they lost an arrow during the challenge."

  Then: "Time is up. Now calculate your scores." (Give them the scoring formula again.)

  Then debrief (10-15 min, but we have 10 min in the timeline? We might run over, but we can adjust).

  Debrief script:

  "Let's reflect on the game. What did you notice? [Get responses.] The game was designed to model some ideas in metaphysics. Without using the technical terms yet, let's see:

  1. You found that for almost every fact, you could find some dependence — but the real challenge was to find the one that made the fact obtain. The audit round forced you to show that your ground was the specific one that made the difference.

  2. The scoring made you balance two things: explaining everything (completeness) and using as few brute facts as possible (parsimony). This pressure led to some tough choices. For instance, if you used only one brute fact, you had a single ground for everything — but then it might not be informative. If you used four, you had to choose which facts are brute, and that set might seem arbitrary. And if you didn't have enough brute tokens, you might have been tempted to create a long chain that then didn't end — but the rules forced you to end at a brute fact. So a regress was not allowed.

  3. What did you make brute? Some groups might have made an abstract fact (like the existence of the number 2) brute, or a normative fact. That shows that being fundamental isn't about being small, early, or causally upstream.

  Also, the gold cards: 
     - The conjunctive fact: did you ground it in its conjuncts? But then the conjuncts are already grounded? 
     - The negative fact: similarly tricky.
     - The 'all facts' card: that one is self-referential. How did you ground it? 

  In metaphysics, the terms for these ideas are:
     - The relation we were modeling is called 'grounding'. It's a relation of non-causal dependence.
     - The brute facts are the 'fundamental' facts.

  The game shows that grounding is supposed to be asymmetric (hence no cycles) and well-founded (hence no infinite chains). 

  But note: the game assumes that every fact is either grounded or fundamental. In reality, some philosophers think that some facts (like negative facts) might not be apt for grounding. Also, the game doesn't distinguish between a fact that is fundamental and one that is brute because we don't know its ground. But in the game, we were representing the metaphysical structure, not our knowledge.

  Finally, the game is a model. We were representing how we account for the structure of the world. But the question is: does the world have such a structure? That's what metaphysics is about."

  End.

  This should cover it.
answer: |-
  Below is a comprehensive game design for your metaphysics seminar, refined to meet your specifications. The game, titled **Fact Foundations**, uses index cards, string, and tokens to simulate grounding structures without technical terminology. It emphasizes discovery of your three target concepts through gameplay, followed by a debrief linking game experiences to metaphysical ideas. The design includes materials, rules, a timeline, example cards, debrief guidance, and solutions for predictable challenges.

  ---

  ### **Materials List (Per Group)**
  1. **Fact Cards (24 total, standard index cards):**
     - **Intrinsic Material (6 cards):**  
       - "The ball is red."  
       - "The table is square."  
       - "The rock is heavy."  
       - "The water is liquid."  
       - "The leaf is green."  
       - "The ice is cold."  
     - **Dispositional/Modal (5 cards):**  
       - "The glass is fragile."  
       - "The salt is soluble."  
       - "The door can be locked."  
       - "The rubber band is stretchy."  
       - "The vase is breakable."  
     - **Existence (Composites/Abstracts) (5 cards):**  
       - "The chair exists."  
       - "The United States exists."  
       - "The number 2 exists."  
       - "The set {1,2} exists."  
       - "The pile of leaves exists."  
     - **Normative (5 cards):**  
       - "Stealing is wrong."  
       - "Helping others is good."  
       - "Lying is bad."  
       - "Keeping promises is right."  
       - "Equality is just."  
     - **Gold Cards (3 cards, on yellow cardstock):**  
       - "The ball is red AND the table is square." (Conjunctive)  
       - "The glass is NOT broken." (Negative)  
       - "All facts are on this table." (Completeness)  

  2. **Other Items:**  
     - **String:** 3–4 feet per group (cut into segments for drawing arrows).  
     - **BRUTE Tokens:** 4 identical tokens per group (e.g., wooden chips, buttons, or labeled cardboard).  
     - **Blank Index Cards:** 5 per group (for "near misses" during audits).  
     - **Markers:** 1 per group (for writing near misses).  
     - **Score Sheet:** 1 per group (pre-printed with scoring rules).  

  ---

  ### **Complete Rules & Payoff Scheme**  
  **Goal:** Build a structure where every fact "obtains in virtue of" other facts or is marked brute, to maximize points. Avoid cycles and dangling facts.  

  #### **Core Mechanics:**  
  1. **Setup:**  
     - Groups receive 21 fact cards (excluding gold cards) and 4 BRUTE tokens.  
     - Lay cards on the table. Draw arrows (string) from **A** → **B** to mean "**A** obtains in virtue of **B**."  
     - Place BRUTE tokens on facts with **no incoming arrows** (these are "brute" and need no further explanation).  

  2. **Constraints:**  
     - Use **exactly 4 BRUTE tokens** (no more, no less at start; unused tokens yield bonuses).  
     - Every fact must have a **path to a BRUTE token** via arrows (no dangling facts).  
     - **No cycles** (e.g., **A** → **B** → **A**). If a cycle is found, the group must cut one string (removing an arrow) and explain why.  

  3. **Gold Cards (Mid-Game):**  
     - Added halfway through. Must be integrated like other facts (cannot be ignored).  

  4. **Adversarial Audit:**  
     - Groups challenge each other's arrows.  
     - **Challenger:** Picks an arrow (**A** → **B**) and writes a "near miss" on a blank card (e.g., if **B** is "The molecular structure is XYZ," a near miss might be "The molecular structure is ABC").  
     - **Defender:** Must explain why **B** (not the near miss) is the *right* ground for **A**.  
     - **Outcome:** If defense fails, the arrow is voided (string removed), and the structure must be fixed.  

  5. **Scoring (No Real Money):**  
     - **+1 point** per fact with a path to a BRUTE token.  
     - **+5 points** per unused BRUTE token (bonus for parsimony).  
     - **-10 points** per dangling fact (no path to brute).  
     - **-20 points** per cycle discovered (penalized when cut).  
     - **Highest score wins** (prize: optional bragging rights or candy).  

  ---

  ### **Minute-by-Minute Timeline (80 Minutes Total)**  
  **0–5 min: Introduction (Facilitator Script)**  
  > "Today, we're playing a game about how facts relate. Each group has cards with facts. Your job: connect them with arrows. An arrow **A → B** means **A obtains in virtue of B**. You also have 4 BRUTE tokens. Place one on a fact if it has no 'in virtue of'—it's just brute. Rules:  
  > - Every fact must link to a BRUTE token through arrows.  
  > - Avoid loops (like **A → B → A**). If you find one, cut an arrow and explain why.  
  > - Scoring: Points for linked facts, bonuses for unused BRUTE tokens, penalties for loose ends or cycles.  
  > Later, I'll add special gold cards. Finally, groups will challenge each other's arrows. Goal: Maximize your score. Start now!"  

  **5–30 min: Initial Building (25 min)**  
  - Groups arrange 21 cards, draw arrows, place BRUTE tokens.  
  - **Facilitator Circulates:** Answer questions but avoid theory; e.g., "What would make **A** obtain if **B** changed?"  

  **30–35 min: Gold Card Integration (5 min)**  
  > "Add these three gold cards to your structure. Treat them like any other fact—they must link to BRUTE tokens or have arrows."  

  **35–40 min: Audit Preparation (5 min)**  
  > "Now, groups will challenge each other. Group 1 vs. 2, 2 vs. 3, 3 vs. 4, 4 vs. 1. Pick one arrow in your opponent's structure. Write a 'near miss'—a fact that *would* ground the target fact if it were slightly different. You have 2 minutes to choose."  

  **40–55 min: Adversarial Audit (15 min)**  
  - Each challenge: **3 minutes max** (1 min to present, 1 min to defend, 1 min to adjust).  
  - Example: Challenger voids "The glass is fragile → Molecular structure is XYZ" with near miss "Molecular structure is ABC." Defender must explain why XYZ (not ABC) is constitutive.  
  - **Facilitator Moderates:** Keep time, ensure defenses address "why this ground, not that?"  

  **55–60 min: Post-Audit Adjustments (5 min)**  
  - Groups fix structures (e.g., if an arrow was voided, they may need new arrows or BRUTE tokens).  

  **60–65 min: Final Scoring (5 min)**  
  - Groups calculate scores using the payoff scheme.  

  **65–80 min: Debrief (15 min)**  
  - Link gameplay to target concepts (detailed below).  

  ---

  ### **Debrief: Mapping Game Moments to Metaphysical Ideas**  
  **Debrief Script (Facilitator-Led Discussion):**  
  > "Let's reflect. What happened? [Solicit reactions.] Now, connect this to ideas you've heard in discussion.  
  > 1. **Dependence is cheap, but constitutive grounding matters:**  
  >    - The audit round forced you to defend *why* your ground was right and the near miss wrong. This mirrors how real grounding isn't just any dependence (e.g., 'The glass is fragile' doesn't just depend on *any* molecular structure—it needs the *specific* one that constitutes fragility).  
  > 2. **Completeness + parsimony squeeze you into three outcomes:**  
  >    - When you spent your last BRUTE token, you faced a choice: leave facts dangling (penalty) or force them into a structure. This is the tension between 'no ungrounded facts' and 'few fundamentals.' It pushes toward:  
  >      - A single brute fact (e.g., one token for everything → uninformative).  
  >      - Arbitrary fundamentals (e.g., why BRUTE on 'The number 2 exists' but not 'Equality is just'?).  
  >      - Regresses (e.g., long chains that *could* be infinite, but our rules banned them via cycle penalties).  
  > 3. **Fundamentality ≠ smallest/earliest/causal:**  
  >    - Did anyone make 'The initial universe state' brute? Or 'God'? But then the audit exposed problems: e.g., 'Stealing is wrong' grounded in 'God exists' might have a near miss like 'A different god exists.' Why is *this* brute fact the right one? This shows fundamentality isn't about causality or temporal priority—it's about what *constitutively* stops the chain.  
  > 4. **Other moments:**  
  >    - **Cycle cutting:** Enforced asymmetry (grounding isn't circular) and well-foundedness (chains must end).  
  >    - **Gold cards:** The 'all facts' card often caused chaos—how can it ground itself? This reveals limits of completeness principles. The negative/conjunctive cards forced debates about whether they reduce to their parts or need brute status.  
  >    - **Dispositions vs. bases:** Grounding 'fragility' in 'molecular structure' sparked causal vs. constitutive debates—exactly the distinction metaphysics draws."  

  **Transition to Theory:**  
  > "In metaphysics, we call this 'grounding'—a non-causal dependence where facts hold *in virtue of* others. 'Fundamental' facts are ungrounded. But note: the game assumes every fact *can* be grounded or brute. Reality might differ—e.g., some argue negative facts aren't apt for grounding. Also, our scoring modeled theoretical virtues (completeness, parsimony), but reality doesn't 'score' us. The game shows how our *practices* (e.g., avoiding regresses) point to a structure, but we debate if it's mind-independent."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Group declares everything brute and banks the bonus:**  
     - **Problem:** They use all BRUTE tokens on random facts, ignoring arrows to claim the +5 per unused token.  
     - **Solution:** Scoring penalizes this: 24 facts with 4 brute tokens = 4 points (for brute facts) + 0 bonus (all tokens used) = 4 points. If they leave 20 facts dangling, they get -200 points → net -196. Low score forces grounding.  

  2. **Group builds a chain of redescriptions:**  
     - **Problem:** "The ball is red" → "The ball reflects red light" → "Light has wavelength 700nm" (mere redescriptions).  
     - **Solution:** Audit round exposes this. Challenger provides a near miss (e.g., "Light has wavelength 600nm" for "red"). Defender must explain why *this* description is constitutive, forcing distinction from causal/nomic dependence.  

  3. **Group grounds everything in "initial universe" or "God":**  
     - **Problem:** Overly broad brute fact that "explains nothing" (e.g., all arrows point to one token).  
     - **Solution:** Audit near miss (e.g., "A different initial state") forces defense. Gold cards exacerbate this—e.g., "All facts are on this table" can't be grounded in a physical state. Debrief links to "uninformative ground" outcome.  

  4. **Group finishes early while others argue:**  
     - **Problem:** Fast group disengages.  
     - **Solution:** Assign "refinement tasks": Check for cycles, pre-plan audits, or brainstorm near misses for their *own* structure. Keep them busy without disrupting others.  

  5. **Student calls scoring arbitrary:**  
     - **Problem:** "Why -10 for dangling? Why +5 for unused tokens?"  
     - **Solution:** Acknowledge in debrief: "Yes, scoring models trade-offs in theory-choice. Parsimony (-5) and completeness (-10) penalties reflect real philosophical tensions—e.g., Occam's razor vs. explanatory gaps."  

  ---

  ### **What the Game Cannot Reproduce**  
  **Limitation 1: Ungrounded ≠ Fundamental**  
  - The game conflates "ungrounded due to fundamentality" (metaphysically basic) with "ungrounded due to inaptness" (e.g., facts some philosophers deem ungroundable, like negative facts).  
  - **Facilitator Fix in Debrief:** Explicitly distinguish: "BRUTE tokens represented *fundamentality*, but in reality, some facts might be ungrounded because grounding doesn't apply to them. For example, if you struggled with negative/conjunctive gold cards, this mirrors debates about whether they're 'grounding-apt'."  

  **Limitation 2: From Practice to Reality**  
  - The game shows how accounting *practices* (e.g., avoiding regresses) imply structure, but doesn't prove mind-independence.  
  - **Facilitator Fix in Debrief:** "When your accounting 'ran out' (e.g., you used your last BRUTE token), you assumed reality *has* a bottom level. But is this a fact about the world or our minds? That's a key debate—e.g., some argue grounding structures are objective; others say they're pragmatic."  

  ---

  This design ensures students encounter your three target concepts organically. The first run may be messy (e.g., audit rounds run long), but the solutions above will help. Focus on facilitating, not theory, until debrief. Good luck!
