  **Subject: Structural Realignment: De-layering of Non-Core Operational Units**  
  **From: Synergy Horizons Consultancy (SHC), Strategic Optimization Division**  
  **To: All Staff**  
  **Date: 15 December 2023**  

  1. **Executive Summary**  
     Following a comprehensive operational audit, SHC has identified redundancies across non-fundamental functional layers. This memo outlines the rationalisation of the Mental Properties Department (MPD), effective Q1 2024. Savings will be reallocated to core physical infrastructure.  

  2. **Rationale for MPD Redundancy**  
     Performance metrics confirm that all firm outcomes (e.g., decision execution, workflow triggers) are fully accounted for by Baseline Physical Properties (BPP). BPP operates at 100% causal sufficiency with zero recorded operational gaps. MPD’s activities, while consistently co-occurring with BPP, demonstrate no measurable value-add.  

  3. **Addressing MPD’s Counter-Claim: Joint Causation**  
     MPD asserts its activities jointly produce outcomes alongside BPP. Audit findings reject this:  
     - **Operational Duplication**: BPP alone suffices for all deliverables. Adding MPD creates systemic overdetermination (i.e., two fully sufficient teams redundantly performing identical tasks).  
     - **Fiscal Irresponsibility**: Maintaining parallel operational streams for identical outcomes violates lean management principles.  
     - **Freeloader Principle**: Even if overdetermination were feasible, MPD’s contribution would remain causally idle—merely "present" while BPP executes work.  

  4. **MPD’s Alternative Claim: Inherited Causal Relevance**  
     MPD proposed that its causal relevance is derived from BPP via a "Realisation Reporting Structure." SHC reclassifies this arrangement as follows:  
     - **Line-Management Clarification**: If MPD’s outputs are wholly determined by BPP’s activity, MPD functions as a passive intermediary, not an independent operational unit.  
     - **Redundancy Implication**: Bypassing intermediaries (MPD) to directly fund BPP streamlines workflows and reduces ontological overhead.  

  5. **Scope Expansion: Group-Wide De-layering**  
     Per Section 2’s sufficiency criterion, SHC has identified analogous redundancies:  
     - Key Shape Department (KSD): Outcomes attributed to "shape" (e.g., door access) are reducible to atomic arrangement metrics.  
     - Finance Inflation Metrics (FIM): "Inflation" claims are summarisable as fundamental transaction logs.  
     - Material Integrity Division (MID): "Brittleness" descriptors are excluded by subatomic binding force analytics.  

  6. **Transition Timeline**  
     - 31 Dec 2023: MPD, KSD, FIM, and MID functions archived.  
     - 15 Jan 2024: All non-BPP reporting lines terminated.  
     - 30 Jan 2024: SHC’s own consultancy role sunsetted (see Rationale: Section 5; causal sufficiency of client’s BPP negates consultancy-layer necessity).  

  ---

  **FAQ: Mental Properties Department Transition**  
  *Q: If MPD co-occurs with every BPP action, why is correlation insufficient proof of necessity?*  
  A: Correlation ≠ causation. BPP’s operational completeness requires no supplementary units. Co-occurrence, without distinct deliverables, indicates resource misallocation.  

  *Q: Doesn’t eliminating MPD invalidate emergent properties like "decision-making"?*  
  A: "Emergence" denotes summarised BPP activity, not novel causation. All emergent workflows are reclassified as non-causal descriptive reports.  

  *Q: What happens to MPD’s projects (e.g., "Pain Avoidance Protocol")?*  
  A: Legacy projects are rebranded as BPP subroutines (e.g., "Nociceptor Signal Interruption"). MPD personnel may apply for BPP assistant roles.  

  ---

  **Confidence Assessment**  
  - **High Confidence**:  
    - Overdetermination dismissal: Faithfully mirrors exclusion arguments (e.g., Kim’s pairing of overdetermination’s implausibility with causal idleness).  
    - Generalisation to macro-properties: Aligns with Kim/Sider’s "causal exclusion problem" scalability—brittleness/inflation *are* excluded identically to beliefs.  
  - **Moderate Confidence**:  
    - "Inheritance = line management" analogy: Captures non-reductive physicalism’s struggles, but real-world HR jargon slightly simplifies realisation/dependency debates.  
  - **Key Hedge**:  
    - The memo implies *all* non-fundamental properties are *equally* redundant. Some philosophers (e.g., emergentists) might argue certain macro-properties have stronger "causal credentials" than mental ones—though the exclusion logic itself doesn’t discriminate.  

