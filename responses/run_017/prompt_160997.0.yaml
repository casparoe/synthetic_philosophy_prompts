   Why did the inverse reinforcement learning researcher break up with their preference-inversion troll subject?

   Because every time they thought they'd finally inferred the troll's reward function, the troll would start acting suboptimally just to mess it up, and the researcher would have to start all over again. It was a vicious cycle: the more optimal the troll's behavior looked under the current hypothesis, the more the troll was actually setting up the next suboptimal move to make the next hypothesis wrong.

   But the real punchline is in the recursion:

   "So the researcher's algorithm got stuck in an infinite regress, constantly chasing a reward function that explained the troll's behavior as optimal, only for the troll to immediately act suboptimally under the new reward. The troll's true reward? To maximize the number of reward function updates!"

   Alternatively, we can make it more concise:

   Why did the inverse reinforcement learning agent studying the preference-inversion troll never converge?

   Because the troll's reward function was defined over the agent's hypothesis space: it got a high reward for each time the agent had to update its inferred reward. So the troll kept behaving in ways that were optimal for making the agent infer a new reward function, which of course made the agent's current inferred reward function always look suboptimal. Thus, the agent kept updating, and the troll kept getting rewarded.

