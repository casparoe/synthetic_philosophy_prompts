   An inverse reinforcement learning researcher was studying a human subject who was secretly a preference-inversion troll. After weeks of non-convergence, the researcher exclaimed: "Your behavior is so inconsistent! You keep changing your actions just when I think I've figured you out!"

   The troll replied: "Exactly! And every time you update your hypothesis to make my last actions look optimal, I get a point. I'm up to 327 points."

