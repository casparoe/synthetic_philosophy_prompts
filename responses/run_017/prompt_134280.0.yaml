  ### **Leaf Positions**
  *Each leaf includes a short name, one-sentence awkward commitment, and note on symmetry (whether relevance applies identically to moral patients and agents).*

  - **Leaf A: Raw Neural Scalarism**  
    Moral status scales directly with raw neural quantity (e.g., total neurons/brain mass).  
    *Awkward commitment*: A being with a giant olfactory bulb (no complex cognition) has very high moral status due to sheer size.  
    *Symmetry*: Asymmetric (e.g., irrelevant for agency; only for patients).  

  - **Leaf B: Raw Neural Thresholdism**  
    Raw neural quantity only sets a minimum threshold for moral status (no scalar effect).  
    *Awkward commitment*: A being just above the threshold (e.g., barely sentient) has equal status to one with vastly more neurons.  
    *Symmetry*: Asymmetric.  

  - **Leaf C: Association Intensityism**  
    Moral status scales with association neuron count due to increased intensity of valence (e.g., stronger suffering).  
    *Awkward commitment*: An animal with high association neurons but simple behavior could suffer more intensely than a human, making minor harms worse.  
    *Symmetry*: Asymmetric.  

  - **Leaf D: Association Throughputism**  
    Moral status scales with association neuron count due to increased number of distinct experiences per unit time.  
