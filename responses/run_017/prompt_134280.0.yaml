  #### **Question 1: Human Hemispherectomy Case**  
  *A human born with an atypically small brain (low-normal volume) or a child who had one cerebral hemisphere removed in infancy develops a roughly ordinary mental life. Does the reduction in brain volume/neurons affect their moral status?*  
  - **Yes**: Brain properties are potentially constitutive. Go to Q2.  
  - **No**: Brain properties are not directly constitutive when functional capacity is preserved. Go to Q5.  

  #### **Question 2 (from Q1-Yes): Sensory Map Brain Case**  
  *A being has a very large brain that is almost entirely dedicated to a single sensory map (e.g., a massive olfactory bulb with minimal association areas). Does this being have high moral status?*  
  - **Yes**: Raw neural quantity (e.g., brain mass, total neurons) may be key. Go to Q3.  
  - **No**: Specific properties (e.g., type of neural tissue or functional capacity) may be key. Go to Q4.  

  #### **Question 3 (from Q2-Yes): Scalar vs. Threshold for Raw Quantity**  
  *For raw neural quantity (mass/neurons), is moral relevance scalar (more quantity → higher status) or threshold (only matters for meeting a minimum to "count at all")?*  
