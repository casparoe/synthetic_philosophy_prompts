  Below is a taxonomy of positions on the moral relevance of brain size (and related neural/computational quantities), structured as a branching tree. The tree is built from the logical space first, using concrete cases and questions to sort positions. Each internal node is a branch question answerable by a thoughtful person without prior exposure to the debate, and each leaf is a labeled position with a short descriptive name and one sentence highlighting its most awkward commitment. Cases are phrased hypothetically to avoid dependence on empirical specifics.

  The taxonomy addresses your requested distinctions:
  - **Quantities**: Raw brain mass, total neuron count, neuron-to-body ratio, neurons in association areas, synapse count, functional capacity (e.g., synchronic discriminative bandwidth).
  - **Role**: Constitutive (directly part of moral status), evidential (only evidence for moral status), or irrelevant.
  - **Scalar vs. threshold**: Whether relevance scales continuously or only sets a minimum for counting as a moral patient.
  - **Mechanism**: Whether relevance operates through intensity of valence (e.g., stronger suffering) or number of distinct experiences per unit time.
  - **Symmetry**: Whether relevance applies identically to moral patients (e.g., capacity to suffer) and moral agents (e.g., capacity for responsibility).
  - **Practical use under uncertainty**: Whether a quantity should be used as a proxy when unmeasurable mental states are uncertain.

  Cases integrated into the branches include:
  - Human at small end of normal brain volume or child with hemispherectomy but normal mental life.
  - Animal with 3× human association neurons but no language/long-term planning.
  - Two beings behaviorally and introspectively indistinguishable but differing 100-fold in neural substrate (one with redundant/wasteful hardware).
  - Very large brain almost entirely a single sensory map (e.g., massive olfactory bulb).
  - Chicken vs. shrimp (as in your argument).
  - Two artificial systems: one with 100× parameters and 1000× training compute of the other.

  The tree has **8 branch questions** and culminates in **10 leaves**. Unoccupied combinations are noted and diagnosed. Two leaves (K and L) are flagged as inseparable after all branches. For simplicity, symmetry is addressed in the leaf descriptions. The prose is non-technical except for unavoidable neuroanatomical terms (e.g., "association neurons" for areas involved in complex processing beyond basic sensation).

