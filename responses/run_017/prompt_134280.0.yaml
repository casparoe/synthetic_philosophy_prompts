    *Symmetry*: Symmetric (affects both patient and agent status).  

  - **Leaf F: Functional Thresholdism**  
    Functional capacity only sets a minimum threshold for moral status (no scalar effect).  
    *Awkward commitment*: A being barely above the threshold (e.g., minimal discrimination capacity) has equal status to a highly complex one.  
    *Symmetry*: Symmetric.  

  - **Leaf G: Strict Irrelevatism**  
    Brain properties are irrelevant constitutively and evidentially; only observed suffering/joy matters.  
    *Awkward commitment*: We must ignore brain evidence even for shrimp vs. chicken, risking ignorance of true suffering.  
    *Symmetry*: Irrelevant for both patients and agents.  

  - **Leaf H: Pragmatic Evidentialism**  
    Brain properties are not constitutive but are the best measurable proxy under uncertainty.  
    *Awkward commitment*: In the functional equivalence case, we must prioritize the being with more neurons despite identical experiences.  
    *Symmetry*: Asymmetric (used for patients, not agents).  

  - **Leaf I: Behavioral Evidentialism**  
    Brain properties are weak evidence; only functional outputs (behavior/reports) should be used under uncertainty.  
    *Awkward commitment*: We cannot assign moral status to beings that suffer but lack measurable behavior (e.g., paralyzed AI).  
