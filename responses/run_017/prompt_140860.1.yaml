prompt: |-
  I'm teaching a graduate seminar this term on the metaphysics of dispositions, and our session on finks and masks has bogged down in a way I recognise all too well: after three weeks the students have sorted themselves into two camps who are no longer so much disagreeing as explaining different things, each to its own satisfaction. A colleague from the philosophy of science is sitting in on that session, and rather than hand her a reading list I would like to hand the room a document. So here is what I am asking for: draft the joint statement that a defender of the conditional analysis of dispositional ascriptions and a dispositional realist could both sign after a good-faith adversarial collaboration. By the conditional analyst I mean someone who holds that what it is for a thing to be disposed to manifest M in circumstances C is for a suitably restricted conditional — if C, then M — to hold of that thing, and who therefore owes an account of the restriction that is not circular. By the dispositional realist I mean someone who holds that the disposition is an intrinsic, causally efficacious property of the thing, in virtue of which the conditional holds when it holds, so that the conditional is evidence for the disposition rather than what the ascription says. I want the claims both sides can sign — about what the fink and mask cases actually establish, about what an adequate account of dispositional ascription has to accomplish, about whether cases drawn from the special sciences (solubility, conductivity, virulence) and cases drawn from ordinary life (fragility, flammability) must be handled by the same apparatus — followed by the residual disagreement stated twice over, once in the analyst's preferred vocabulary and once in the realist's, in wording each would accept for its own side.

  For the cruxes, I want each one paired with a case or argument both parties would accept as bearing on it, and — the part that never happens in seminar — each side's prediction about how that case will turn written down in advance, so that the collaboration has something to be wrong about. I have been working up three cases as a shared test-bed, and I would rather you used mine than the stock examples everyone has already seen: (i) a dimmer fink, in which the approach of C lowers the chance of M to some middling value such as 0.3 rather than to zero, so that the disposition is neither simply lost nor simply prevented; (ii) an intrinsic fink that is triggered by the disposition's own beginning to manifest, so that the manifestation would have gone to completion had it not got started; and (iii) a masked mask, in which a condition that would interfere with M is itself interfered with by a further condition, with the result that M occurs after all. For each, say what each theory is committed to about whether the thing has the disposition, whether the relevant conditional is true, and whether the interfering condition should be counted as a mask, a fink, both, or neither — and mark the points at which the two theories' verdicts come apart in a way that could in principle be checked rather than merely asserted. If you conclude that some part of the dispute is merely verbal, say plainly which part and why; my own suspicion is that a great deal rides on whether the chemist's soluble and the vase's fragile are being read as the same kind of ascription at all. Format the whole thing as a numbered agreed-claims section followed by a disagreements table. No names, dates or bibliography, please: the argumentative structure is what I am after, and I can supply the references myself.
reasoning: |-
  We are drafting a joint statement between a conditional analyst (CA) and a dispositional realist (DR) after adversarial collaboration. The goal is to outline points of agreement and then clearly state the residual disagreements, using the three provided cases as test-beds.

  **Agreed Claims (Numbered):**

  1. **The phenomena of finks and masks reveal limitations in simplistic accounts of dispositions.** Both parties agree that cases where a disposition is lost (finks) or prevented from manifesting (masks) challenge any account that does not adequately handle interference.

  2. **An adequate account of dispositional ascriptions must:**
     a. Explain why, in ordinary cases, the presence of a disposition (e.g., fragility) reliably leads to manifestation (breaking) in the appropriate circumstances (striking).
     b. Account for cases in which the manifestation does not occur despite the disposition being present (masks) and cases in which the disposition is lost just when it is needed (finks).
     c. Provide criteria for distinguishing between the absence of a disposition and the presence of a disposition that is interfered with (by finks or masks).

  3. **Dispositional ascriptions in the special sciences (like solubility, conductivity, virulence) and ordinary life (like fragility, flammability) share a common logical structure.** Both parties agree that the same conceptual apparatus should apply across these domains. The differences are in the underlying mechanisms and the complexity of the properties, not in the nature of dispositionality itself.

  4. **The conditional analysis must be non-circular and avoid triviality.** The CA holds that the conditional must be restricted in a way that does not covertly rely on dispositional concepts. The DR agrees that if the CA is to succeed, it must meet this challenge.

  5. **The conditional is evidence for the disposition.** Both parties agree that, typically, the truth of the conditional (if C, then M) is good evidence for the presence of the disposition. However, they disagree on the direction of explanation (see disagreements).

  6. **The three test cases (dimmer fink, intrinsic fink, masked mask) are valid and challenging for both accounts.** Both parties commit to the following descriptions of the cases and the questions to be answered for each:
     - (i) **Dimmer fink**: The approach of C lowers the chance of M to 0.3 (a middling value). Questions: Does the object have the disposition? Is the conditional true? Is the interferer a fink, mask, both, or neither?
     - (ii) **Intrinsic fink**: The disposition's own beginning to manifest triggers a process that stops the manifestation (so the manifestation would have completed had it not started). Questions: Same as above.
     - (iii) **Masked mask**: A condition that would interfere with M is itself interfered with by a further condition, resulting in M occurring. Questions: Same as above.

  7. **The verdicts on the test cases must be consistent and principled.** Both parties agree that the theories must deliver verdicts on the presence/absence of the disposition and the truth of the conditional, and that these verdicts should be based on the theory's core principles.

  **Residual Disagreements:**

  The table below states the disagreements. For each crux, we state:
  - The issue.
  - The test case or argument that both parties accept as bearing on the issue.
  - The CA's prediction and the DR's prediction about how the case will turn out (i.e., what the theory says about the case).
  - How the verdicts come apart in a way that could be checked (if applicable).

  Note: The predictions are about what the theory says, not necessarily about the world. The "check" is whether the theory's verdict is consistent and matches our intuitions or empirical data.

  | Crux | Test Case | CA Prediction | DR Prediction | Point of Divergence (Checkable?) |
  |------|-----------|---------------|---------------|----------------------------------|
  | **1. What is the primary bearer of truth in dispositional ascriptions?** <br>CA: The conditional (if C, then M) under a suitable restriction. <br>DR: The intrinsic property of the object. | All test cases | For each case, the CA will derive the truth of the dispositional ascription from the truth of the conditional (appropriately restricted). The conditional's truth value is determined by the actual sequence of events in the circumstances. | For each case, the DR will base the dispositional ascription on the presence of the intrinsic property, which may exist even if the conditional is false due to interference. | The theories may assign different truth values to the dispositional ascription in the same case. This can be checked by examining whether the disposition is present (e.g., by other tests) and whether the conditional holds. |
  | **2. How to handle probabilistic manifestations?** <br>CA: The conditional must be probabilistic (if C, then chance of M is P). The restriction must account for the probability. <br>DR: The disposition is a property that grounds the chance, so the chance is a measure of the disposition's strength. | Case (i) Dimmer fink | The conditional analyst says: The conditional "if C, then M" is false (because the chance of M is only 0.3, not high enough for the conditional to hold). Therefore, the disposition is not present. The interferer is a fink because it removes the disposition. | The dispositional realist says: The disposition may still be present as an intrinsic property, but its manifestation is probabilistically reduced. The interferer is a mask (prevents full manifestation) and a fink (reduces the disposition's strength). | The CA denies the disposition exists in this case, while the DR asserts it does (though weakened). This can be checked by independent tests for the disposition (e.g., in slightly different circumstances). |
  | **3. How to handle self-undermining manifestations?** <br>CA: The conditional must be evaluated in the circumstances without the fink. <br>DR: The intrinsic property exists until it is destroyed. | Case (ii) Intrinsic fink | The CA says: The conditional "if C, then M" is false because when C occurs, the manifestation starts but then stops. Therefore, the disposition is not present. The interferer is a fink (it removes the disposition as soon as it starts to manifest). | The DR says: The disposition is present until the moment the fink is triggered. The object was disposed to manifest M, but the intrinsic fink process destroyed the disposition mid-manifestation. The conditional is false because the disposition was lost during C. But the disposition was present at the onset of C. | The CA denies the disposition exists at the time of C, while the DR says it exists at the onset but is then lost. This can be checked by whether the manifestation begins (suggesting the disposition was present at the start). |
  | **4. How to handle nested interference?** <br>CA: The conditional holds if in the circumstances without any interference, M would occur. But the restriction must rule out the interferers. <br>DR: The disposition is present and manifests because the mask is itself masked. | Case (iii) Masked mask | The CA says: The conditional "if C, then M" is true because M occurs. The interfering condition (the mask) is itself masked, so it doesn't prevent M. Therefore, the disposition is present. The interferer is a mask that is masked. | The DR says: The disposition is present and manifests because the mask is interfered with. The disposition is not masked in this scenario. The interferer is a mask that is neutralized. | Both agree the disposition is present and the conditional is true. But they disagree on why: the CA says the conditional holds because M occurs; the DR says the disposition is present and causes M. This disagreement is not directly checkable by the outcome (both predict M) but by the underlying explanation. |
  | **5. The nature of the restriction in the conditional analysis** <br>CA: The restriction is non-circular and specifies normal conditions. <br>DR: The restriction must implicitly rely on the disposition. | All cases, especially (ii) and (iii) | The CA must provide a restriction that, without using dispositional terms, makes the conditional true when the disposition is present and false otherwise. In case (ii), the restriction must exclude the intrinsic fink. | The DR argues that any non-circular restriction will either be too permissive (allowing finks) or too restrictive (excluding genuine dispositions). The cases show that the restriction must mention the absence of finks/masks, which are dispositional concepts. | The check is whether a non-circular restriction can be stated that correctly handles all three cases. The CA claims it can be done; the DR claims it cannot. This is a theoretical check: we can try to write down the restriction and see if it works without circularity. |

  **Conclusion on Verbal Disagreement:**

  The parties agree that there is a verbal element in the debate over whether dispositional ascriptions in different domains (e.g., solubility vs. fragility) are the same. However, both sides hold that the same theoretical apparatus applies. The deeper disagreement is about the metaphysics: the CA sees dispositions as conditional truths, while the DR sees them as intrinsic properties. The cases help to expose this metaphysical divergence.

  **Summary of Test Case Verdicts (as per each theory):**

  For clarity, we summarize each theory's verdicts on the three cases:

  | Case | Question | CA Verdict | DR Verdict |
  |------|----------|------------|------------|
  | **(i) Dimmer fink** | Disposition present? | No (conditional false) | Yes (but weakened) |
  |   | Conditional true? | False | False (but manifestation has chance 0.3) |
  |   | Type of interferer | Fink (removes disposition) | Both fink (weakens disposition) and mask (reduces chance of manifestation) |
  | **(ii) Intrinsic fink** | Disposition present? | No (conditional false) | Yes (at onset of C) |
  |   | Conditional true? | False (because M doesn't complete) | False (because disposition is lost during C) |
  |   | Type of interferer | Fink (removes disposition upon C) | Fink (destroys disposition mid-manifestation) |
  | **(iii) Masked mask** | Disposition present? | Yes (conditional true) | Yes |
  |   | Conditional true? | True (because M occurs) | True (because disposition manifests) |
  |   | Type of interferer | Mask that is itself masked | Mask that is neutralized |

  Note: The conditional in the CA's view is the simple conditional (if C, then M) under the restriction. In the dimmer fink, the CA might use a probabilistic conditional, but in the classic form, a low chance makes the conditional false. The DR does not rely on the conditional for the disposition's existence.

  This document provides a structure for the joint statement, highlighting agreements and disagreements with testable predictions.
answer: |-
  ### Joint Statement on Dispositions: Conditional Analysis vs. Dispositional Realism  
  **Agreed Claims**  

  1. **Finks and masks reveal a core challenge for any account of dispositions**: Both parties agree that cases of finks (where a disposition is lost or altered precisely when triggered) and masks (where a disposition is present but prevented from manifesting) demonstrate that naïve accounts of dispositions are inadequate. These cases are not mere edge cases but illuminate fundamental features of dispositional ascriptions.  

  2. **An adequate account must satisfy three criteria**:  
     - (a) **Robustness**: It must explain why dispositions typically manifest in standard conditions (e.g., a fragile vase breaks when struck).  
     - (b) **Interference-handling**: It must distinguish between the *absence* of a disposition and its *presence with interference* (finks or masks), without ad hoc adjustments.  
     - (c) **Unity across domains**: The same theoretical apparatus must apply to both scientific dispositions (e.g., solubility, virulence) and everyday dispositions (e.g., fragility, flammability), as both exhibit analogous interference phenomena. Differences in complexity or context do not justify distinct metaphysical treatments.  

  3. **The conditional is evidentially central but not necessarily constitutive**: Both parties agree that the conditional "if C, then M" (suitably restricted) provides evidence for dispositional ascriptions. However, they disagree on whether this conditional *constitutes* the disposition (Conditional Analyst, CA) or is *grounded in* a causally efficacious property (Dispositional Realist, DR).  

  4. **Test cases are shared probes for theory comparison**: The following cases, designed to push beyond stock examples, are accepted as valid probes for both theories. Each case requires verdicts on:  
     - Whether the disposition is present.  
     - Whether the conditional "if C, then M" (with a non-circular restriction) holds.  
     - Whether the interferer is a fink, mask, both, or neither.  
     Verdicts must derive from each theory’s core principles, not intuition.  

  5. **Non-circularity is a shared constraint**: The CA must provide a restriction on the conditional (e.g., "in normal conditions") that excludes finks/masks without implicitly relying on dispositional concepts. The DR must show that the disposition as an intrinsic property explains the conditional without redundancy.  

  ---

  ### Disagreements: Structured as a Test-Prediction Table  
  *Format*:  
  - **Crux**: The unresolved theoretical issue.  
  - **Test Case**: The agreed-upon case bearing on the crux.  
  - **Predictions**: Each theory’s commitment about the case, stated in its preferred vocabulary.  
  - **Checkable Divergence**: How verdicts could be empirically or conceptually tested.  

  | Crux | Test Case | Conditional Analyst (CA) Prediction | Dispositional Realist (DR) Prediction | Checkable Divergence |  
  |------|-----------|-------------------------------------|---------------------------------------|----------------------|  
  | **1. Ontological Primacy**<br><br>CA: Dispositions reduce to non-circular conditionals.<br>DR: Dispositions are intrinsic properties that ground conditionals. | (ii) Intrinsic Fink<br><br>*Case Setup*: An object’s disposition to M in C triggers a process that destroys the disposition *as M begins*. M would have occurred fully had it not started. | **Disposition**: Absent.<br>**Conditional**: False. The fink activates *during C*, so the restricted conditional "if C, then M" fails. The interferer is a **fink** (it removes the disposition upon triggering).<br><br>*In CA terms*: The restriction must exclude intrinsic finks, but this cannot appeal to dispositions without circularity. | **Disposition**: Present until fink activation.<br>**Conditional**: False. The disposition exists intrinsically at the onset of C but is destroyed mid-manifestation. The interferer is a **fink** (it removes the disposition).<br><br>*In DR terms*: The disposition is real but transient; its destruction explains why M halts. | **Test**: Does M *begin*? If yes, DR claims this confirms the disposition’s initial presence; CA denies this implies dispositional presence (as the conditional fails). |  
  | **2. Probabilistic Manifestations**<br><br>CA: Dispositions require high-chance conditionals.<br>DR: Dispositions can be probabilistic properties. | (i) Dimmer Fink<br><br>*Case Setup*: Approach of C lowers the chance of M to 0.3 (but not 0). | **Disposition**: Absent.<br>**Conditional**: False. The chance of M given C is 0.3, below the threshold for the conditional (which requires near-certainty). The interferer is a **fink** (it destroys the disposition).<br><br>*In CA terms*: A probabilistic conditional "if C, then chance(M) ≥ P" must specify P non-circularly; here, P is not met. | **Disposition**: Present but weakened.<br>**Conditional**: False. The intrinsic property grounds a 0.3 chance of M. The interferer is **both a fink and a mask**: a fink (it weakens the disposition) and a mask (it probabilistically interferes with M).<br><br>*In DR terms*: Dispositions admit of degrees; the property exists but manifests unreliably. | **Test**: Does the object show a *stable tendency* toward M in repeated C-trials? DR predicts clustered near 0.3; CA denies this implies a disposition (calling it a "finked baseline"). |  
  | **3. Nested Interference**<br><br>CA: Conditionals hold if interference is absent in the restriction.<br>DR: Dispositions manifest if interfering properties are absent or neutralized. | (iii) Masked Mask<br><br>*Case Setup*: A mask (which would block M) is itself masked by a further condition, resulting in M occurring. | **Disposition**: Present.<br>**Conditional**: True. M occurs in C, so the conditional holds. The restriction excludes the (neutralized) mask. The interferer is a **mask** (it would block M but is disabled).<br><br>*In CA terms*: The restriction must be defined to exclude masks without dispositional terms (e.g., "no external blockers"), but this risks circularity. | **Disposition**: Present.<br>**Conditional**: True. The intrinsic property causes M because the mask is neutralized. The interferer is a **mask** (it is a latent interferer).<br><br>*In DR terms*: The disposition’s efficacy depends on the absence of masks; here, the mask is inert, so manifestation occurs. | **Test**: Both agree on verdicts here. The divergence is **explanatory**: CA attributes M to the conditional’s truth; DR to the disposition’s causal efficacy. No outcome test, but conceptual: Can the restriction be non-circular? (CA must show how; DR bets it cannot.) |  

  ---

  ### Residual Disagreement: Stated in Each Theory’s Terms  

  - **Conditional Analyst’s Statement**:  
    "Dispositional ascriptions are *truth-apt conditionals* under a non-circular restriction. Finks and masks show that the restriction must exclude interferers without invoking dispositions. The test cases confirm that conditionals are primary: when the probability of M given C drops significantly (as in the dimmer fink), or when M fails despite initial appearance (as in the intrinsic fink), the disposition is absent. The realist’s intrinsic properties are redundant; conditionals predict and explain all observable outcomes when properly restricted."  

  - **Dispositional Realist’s Statement**:  
    "Dispositions are *causal properties* intrinsic to objects. Finks and masks show that these properties can be altered or blocked, but their reality is inferred from their stable causal tendencies. The test cases confirm that dispositions exist independently of single outcomes: a weakened disposition (dimmer fink) or a transient one (intrinsic fink) still reflects a property’s presence. The conditionalist’s restrictions either fail non-circularly or misdiagnose property loss (e.g., in the intrinsic fink, the disposition *was* present when triggered). Conditionals are symptoms, not essence."  

  ---

  ### Agreement on Verbal Elements  
  Both parties agree that **no part of the dispute is merely verbal**. The disagreement is metaphysical: the CA reduces dispositions to conditionals, while the DR takes dispositions as irreducible properties. However, they concur that terms like "soluble" (chemistry) and "fragile" (everyday life) function identically in ascriptions; apparent differences are pragmatic (e.g., precision of manifestation conditions), not semantic or metaphysical.  

  ---  
  This document provides a scaffold for debate, isolating testable cruxes. The test cases force explicit predictions, and the checkable divergences show where evidence could resolve disputes (e.g., stable tendencies in probabilistic cases).
