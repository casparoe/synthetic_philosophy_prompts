prompt: |-
  I've gotten sucked into arguments about religion in politics lately (mostly local school board stuff) and I keep tripping over the same thing, and I dont have a word for it. Let me describe it badly and see if you recognise it.

  So. A few weeks ago two people gave what I thought was the *same* argument against some policy. One was from a church group and it had scripture in it. One was from a secular parents' association and had basically no god-talk at all — it went: institutions make mistakes, some mistakes here can't be undone, a person's life isn't just a unit to be weighed, so don't build a system that can quietly kill somebody. The first one got told it was imposing a religion. The second one got called civic-minded. That felt wrong to me, because the load-bearing part of the first one wasn't the verse either — the verse was kind of bolted on, you could delete it and the argument would still stand.

  Then there's the mirror image. Someone at work argued for a position by appealing to a very specific account of what persons are — something about rational self-conscious agency being the thing that makes a life matter — and I'm just supposed to accept that? I have no idea why I should. I felt exactly as shut out as I imagine a religious person feels when they're told their reasons aren't public. And it's not unusual: appeals to "the science", to a nation's founding promises, to the direction history is going, all seem to work the same way — fine if you already share the premise, useless if you don't.

  And a third thing. I keep noticing that the same person's argument gets treated as admissible or inadmissible depending on whether they *mention* where it came from. Say the quiet part out loud and you're a theocrat; keep it to yourself and say the same sentences and you're a model citizen. Nothing about the argument's content changed. (I've read the wikipedia-level version of public reason, including the bit where you're allowed to bring religious reasons in as long as you later give a properly political one — that's not what I mean, so please don't just explain that at me.)

  What I think I'm circling is this: the thing doing the work in these fights isn't whether a reason is religious. It's something like how much of the argument rests on premises the other person is expected to take from a source they don't share, versus premises they already accept or could go and check for themselves. Plus how much effort the audience is willing to put in — a lot of religious arguments are perfectly inspectable if you'll learn that tradition's internal moves, but nobody will, and somehow that gets counted against the argument. Or maybe I'm wrong that it's epistemic at all, and what people really object to is the certainty religious reasons come with, their motivational oomph, the suspicion that you can't compromise on them.

  Is there an established concept for that dimension, as opposed to the religious/secular one? Or for the specific pattern where an argument flips status depending on whether you name its source? Every time I go looking I just get the religion debate again, and I'm fairly convinced that's the wrong axis. If nothing established fits, say so and give me a term and a definition I could actually apply to hard cases — including cases where a reason is unshared but perfectly checkable, or shared but only for tribal reasons.

  Also, please commit to something. I don't want a menu of options to pick from. Tell me what you think is actually going on, whether this is one phenomenon or two that I'm conflating, which existing label (if any) has earned the right to be used here and why the near misses fall short, and where you're giving me your own judgment rather than something people in the field actually say. And say what would show I'm wrong — what kind of case would break whatever account you give me.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with arguments in religious vs. secular political debates, especially in local school board contexts. The core issue they're noticing isn't about religion per se, but how arguments are treated based on their sources rather than their content. 

  First, I need to understand their examples. They mention two similar arguments against a policy—one from a church group with scripture and one from a secular group without any god-talk. Both make the same point about institutional mistakes and irreversible harm, but the religious one gets dismissed as imposing religion while the secular one is praised. The user points out that removing the scripture doesn't change the argument's validity. Then there's the reverse: a secular argument at work appealing to a specific view of personhood that's just as unexamined as religious reasons, making the user feel shut out. 

  The third point is about how mentioning the source of an argument changes its acceptability. If someone cites their religious basis, they're seen as a theocrat; if they don't, the same argument is acceptable. The user has read about public reason but feels it doesn't capture their concern. They suspect the real issue is about shared premises and the audience's willingness to engage with unshared foundations.

  The user wants a term for this phenomenon beyond the religious/secular binary. They're tired of the standard debates and want a concept that focuses on epistemic accessibility—how much the argument relies on premises the audience doesn't share or isn't willing to verify. They also mention cases where reasons are checkable but ignored, or shared tribally without scrutiny.

  I recall concepts like "epistemic accessibility" and Rawls' public reason, but the user already dismissed Rawls. The key here is the difference between the content's accessibility and the audience's openness. Terms like "epistemic burden" or "shared justificatory base" come to mind. The phenomenon where an argument's status flips when sources are named might be called "source-triggered inadmissibility." 

  The user wants a committed answer, not options. They need a unified concept that explains all their examples. The underlying issue seems to be epistemic asymmetry—unequal access to or willingness to engage with premises. Terms like "justificatory asymmetry" or "argumentative dependence" might fit. The source-triggered issue is part of this, where naming the source highlights the asymmetry. 

  Cases that would break this theory: if an argument using shared premises is rejected just because of its source, or if an inaccessible argument is accepted due to authority. Also, if epistemic accessibility doesn't correlate with acceptance in a given context. The user's examples all show that unshared premises lead to dismissal, especially when sources are cited, so these counterexamples would challenge the theory.

  I should synthesize this into a clear term and definition, emphasizing epistemic accessibility and the source-triggered effect. The term "epistemic asymmetry" covers the core issue, and "source-triggered inadmissibility" explains the flip. Highlighting that the problem isn't religion but shared premises and audience effort. Commit to this framework and explain why other terms like Rawls' fall short by focusing on religion instead of accessibility.
answer: |-
  You're describing a **fundamental asymmetry in epistemic accessibility** – specifically, **argumentative dependence on contested justificatory frameworks**. This is **one core phenomenon** (epistemic asymmetry) with a **specific manifestation** (source-triggered inadmissibility). The religious/secular distinction is often a superficial proxy for the deeper issue: **whether the audience perceives the argument's foundational premises as requiring subscription to an inaccessible or contested authority.**

  Here's the breakdown:

  1.  **The Core Phenomenon: Epistemic Asymmetry & Argumentative Dependence**
      *   **Definition:** An argument's acceptability hinges on the degree to which its *crucial premises* are:
          *   **Accessible:** Verifiable or understandable through shared, non-specialized methods (e.g., widely accepted empirical observation, basic logic, common human experience).
          *   **Shared:** Already accepted by the audience, or demonstrably derivable from premises they *do* accept.
          *   **Independent:** Not reliant on subscribing to a specific, contested worldview, tradition, or authority inaccessible to the audience.
      *   **Why "Religious" is often a red herring:** Arguments labeled "religious" often fail on *this* axis (e.g., "Because Genesis says so" depends entirely on accepting biblical authority). But *secular* arguments can fail equally hard ("Because this specific Kantian metaphysics says rational agency is fundamental" depends entirely on accepting Kantian metaphysics). Conversely, arguments *from* religious traditions *can* pass if they build on accessible/shared premises (e.g., your first example's core argument about institutional fallibility and irreparable harm).
      *   **The Effort Factor:** This is crucial. An argument might *theoretically* be inspectable (e.g., learning Kantian metaphysics or Thomistic natural law), but if the audience perceives the required effort as unreasonable for the public discourse context, the argument fails the accessibility test *in practice*. This isn't necessarily unfair; public debate has practical limits.

  2.  **The Specific Pattern: Source-Triggered Inadmissibility**
      *   **Definition:** The *mentioning* of the specific, contested source/authority/framework upon which a premise depends triggers its dismissal, even if the logical structure of the argument presented remains identical. The source mention acts as a signal that the premise depends on an inaccessible/contested justificatory base.
      *   **Why it happens:**
          *   **Heuristic:** It's a cognitive shortcut. Naming the source flags "This premise comes from *over there*, not from *our* shared ground."
          *   **Suspicion of Motive:** It raises suspicion that the arguer holds unyielding commitments *beyond* the stated argument, making compromise seem impossible ("Oh, it's not *just* about policy X, it's because *God commands it*").
          *   **Highlighting Dependence:** It makes the argumentative dependence explicit. Without the mention, the premise *might* be mistaken for a widely shared intuition or common sense. Naming the source dispels that illusion.

  3.  **The Established Concept That Fits (Closest Match): Foundationalism in Epistemology/Justification Theory**
      *   **Why it fits:** Foundationalism examines how beliefs/claims are justified. Basic beliefs (foundations) must be non-inferentially justified (self-evident, incorrigible, evident to senses) for the structure built on them to be justified. Your concern is about what counts as an acceptable *public* foundation in pluralistic debate.
      *   **The Shortfall:** Foundationalism is a broad epistemological theory, not specifically tailored to the dynamics of public political argumentation or the source-triggering effect. It provides the *underlying structure* but not the precise social/political diagnosis.

  4.  **The Best Label: Epistemic Asymmetry in Public Justification (with Source-Triggered Inadmissibility as a key symptom)**
      *   **Why this label:**
          *   **Epistemic:** It centers the issue of knowledge, justification, and accessibility.
          *   **Asymmetry:** It captures the unequal burden – the arguer relies on foundations the audience doesn't share/access.
          *   **Public Justification:** It ties it directly to the context of giving reasons *to others* in a shared political space.
          *   **Source-Triggered Inadmissibility:** Names the specific flip phenomenon you observe.
      *   **Why near misses fall short:**
          *   **"Public Reason" (Rawls):** You rightly note its insufficiency. Its focus on excluding "comprehensive doctrines" (like religion) *misses* that secular doctrines can be equally "comprehensive" and inaccessible. Its "proviso" (religious reasons allowed if supplemented) doesn't address the core *epistemic* asymmetry – the supplemental reason might *also* depend on an unshared foundation.
          *   **"Burden of Proof":** Too broad. It doesn't specify *why* the burden shifts, which is the contested accessibility of the foundations.
          *   **"Dogmatism" / "Ideology":** Focuses on the *attitude* of the arguer (inflexibility) rather than the structural *accessibility* of the justification.

  5.  **What would show this account is wrong?**
      *   **Cases where high epistemic asymmetry is accepted:** If arguments demonstrably resting *entirely* on premises requiring deep, specialized knowledge of a contested framework (e.g., complex theological dogma, obscure philosophical system) were routinely accepted *as public reasons* in mainstream political debate *without* requiring translation into accessible terms, simply because the source isn't named. (Your work example comes close, but the premise might be *mistaken* for accessible common sense).
      *   **Cases where shared foundations are rejected solely due to source:** If an argument built solely on widely accessible, verifiable premises (e.g., basic harm principle + empirical data) was consistently rejected *only* because the speaker mentioned it *also* aligned with their religious belief, even while conceding the secular reasoning stood alone.
      *   **Cases where source-mentioning *increases* acceptability:** If explicitly stating a contested source ("I believe this because of Marxist dialectical materialism, and here's why that framework leads to this conclusion...") actually made an argument *more* acceptable in mainstream pluralistic discourse than presenting the same conclusions without the source.

  **In short:** You're identifying **epistemic asymmetry** as the core problem. Arguments fail in public discourse not inherently because they are "religious," but because they **depend on premises anchored in justificatory frameworks that are inaccessible, unshared, or require unreasonable effort for the audience to evaluate.** The **source-triggered inadmissibility** is a predictable symptom: naming the source highlights this dependence and asymmetry, triggering dismissal. The religious/secular debate often obscures this deeper epistemic structure. Your frustration stems from seeing arguments dismissed based on *provenance* (religious source) rather than *justificatory accessibility* (can the core reasoning stand on publicly inspectable ground?). This asymmetry is the real axis of exclusion.
