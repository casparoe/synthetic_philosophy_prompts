answer: |-
  Here’s your sorting quiz, designed as requested. It’s a single-page, jargon-free flow that uses concrete cases to map respondents onto positions in the doomsday argument’s logical space. I’ve embedded the branching logic inline and included a scoring key at the end. No leaf is forced where cases genuinely don’t split views—I’ll note the one unresolvable overlap.

  ---

  **Quiz: What’s your gut take on humanity’s future?**  
  *Answer intuitively; no philosophy background needed.*  

  Start with this: You wake up in a white room with no memories. A voice says, "This is an experiment. We flipped a coin: heads, we made one person for one day; tails, we made a trillion people for one day each. We’re telling you that you exist." Do you learn anything about the coin flip? If you think yes, it makes the trillion-person scenario more likely, pick (a). If you think no, it tells you nothing because you had to exist to hear this, pick (b). If you think it makes the one-person scenario more likely, pick (c).  

  Now imagine the universe is infinitely big, with infinitely many observers. You’re one. Does your existence hint at the total number of observers? If you say yes, it suggests a finite total, pick (a). If no, it tells you nothing, pick (b). If yes, it suggests infinity, pick (c).  

  Next, the year 2500. Minds are either biological (like us) or digital uploads. Biologicals are rare: only 100 billion have ever lived. Uploads are common: trillions exist per year. You don’t know which you are. Then you learn you’re biological. Does this change your guess about the total minds that will ever exist? If you now think the total is larger, pick (a). If smaller, pick (b). If it doesn’t shift your guess, pick (c).  

  You’re watching a TV show and just started episode 10. You don’t know how many episodes exist. How do you predict the total? If you guess "about 20," pick (a). If you say your episode number tells you nothing, pick (b). If you think it suggests a small total, pick (c).  

  You’re the 60 billionth human born. Without other clues, what’s your gut guess about all humans ever born? If "around 120 billion," pick (a). If "it tells me nothing," pick (b). If "much larger than 120 billion," pick (c).  

  Two scenarios: total humans will be 120 billion or 120 trillion. In which is your birth rank of 60 billion more likely? If only the 120 billion one, pick (a). If only the 120 trillion one, pick (b). If equally likely in both, pick (c).  

  A foundation debates funding: Project A cuts extinction risk by 1% (e.g., from 10% to 9%). Project B saves 100,000 lives now. They use a doomsday-style argument and now think extinction is more likely AND, if avoided, future populations are smaller. How does this affect Project A’s expected lives saved? If it increases, pick (a). If decreases, pick (b). If no change, pick (c).  

  Your committee might create a huge population in your universe’s future (they live after you, no interaction). If created, they’re part of "all observers." How does this affect your birth rank? If it makes your rank earlier (e.g., you’re now 60 billion out of trillions), pick (a). If no change to your rank, pick (b). If it makes your rank later, pick (c).  

  Same committee, but now the extra population is on a sealed-off universe branch you could never have been part of. Creating them: if you think it makes your birth rank earlier, pick (a). If no change, pick (b). If later, pick (c).  

  Finally, you’re convinced humanity’s total will be small (doomsday-style). When donating to reduce extinction risk, does this change the donation’s expected value? If yes, because extinction is likelier, pick (a). If yes, because fewer would be saved, pick (b). If no, because the math cancels out, pick (c). If no, for another reason, pick (d).  

  ---

  **Scoring Key**  
  *Match your answer pattern to a position. If you land in "Unseparated Pair," see the note.*  

  If you picked (b) in the white-room scenario (Q1), you’re likely a **Skeptic**. You reject updating on your own existence. Skeptics typically answer (b) to the infinitary question (Q2) and (b) to duration sampling (Q4).  

  If you picked (b) in the infinitary scenario (Q2), you’re likely an **Infinitary Escapist**. You think the argument fails with infinite observers. You’ll often pick (b) for the birth-rank guess (Q5) and (c) for extra observers (Q8–9).  

  If you picked (b) in the upload census (Q3) and (a) in the TV show (Q4), you’re likely a **Duration-Sampler**. You apply the logic to lifespan (e.g., "I’m at episode 10, so total ~20") but not necessarily to humanity. You might pick (a) or (b) in birth-rank cases (Q5–6) inconsistently.  

  If you picked (a) for the birth-rank guess (Q5) and (a) for the scenario likelihood (Q6), plus (a) for extra observers in your universe (Q8) but (b) for the sealed branch (Q9), you’re a **Classic Shifter**. You take early birth rank as evidence for a small total and don’t wash it out. You’ll often pick (a) or (b) for the funding case (Q7).  

  If you picked (c) for the scenario likelihood (Q6) and (c) for funding (Q7), plus (c) for the donation question (Q10), you’re a **Canceler**. You think "I exist" is evidence for a large total, exactly canceling the shift. You likely picked (c) in the upload census (Q3).  

  If you picked (c) in the upload census (Q3) and (b) in both extra-observer cases (Q8–9), you’re likely a **Reference-Class Relativist**. You think answers depend on who counts as "you," with no objective choice. You might pick (b) for the birth-rank guess (Q5) or (c) in Q6.  

  If you picked (c) for funding (Q7) and (c) for the donation (Q10), you’re likely **Real but Inert**. You grant the probability shift but think it cancels in expected-utility terms. You often pick (c) in the scenario likelihood (Q6) and (b) for extra observers (Q8–9).  

  **Unseparated Pair**: Classic Shifters and Duration-Samplers *cannot be fully split* by these questions. Both may pick (a) for TV duration (Q4) and birth rank (Q5). To split them, add: "You’re at minute 10 of a song. Guess its total length. If '~20 minutes,' you’re a Duration-Sampler; if 'it tells me nothing about songs, but for humans...', you’re a Classic Shifter."  

  **Unoccupied Boxes**: No one lands in "shift-denying utilitarian" (would pick (b) in Q5, (b) in Q7, (b) in Q10) because it conflates evidence and ethics incoherently. The "infinite shift" box (Q2c, Q5c) is empty—no position argues your existence suggests infinitely many observers.  

  ---

  **Design Notes**  
  - **Upload Census (Q3)** forces the biology/upload bullet: picking (b) accepts "rarity implies small total," (a) rejects it, (c) avoids updating.  
  - **Funding Committee (Q7)** isolates whether the shift affects decisions: (a)/(b) say yes, (c) says it cancels.  
  - **Extra Observers (Q8–9)** splits "all observers" (picks (a) in Q8) from "observers I could’ve been" (picks (b) in Q9).  
  - The Skeptic leaf is cleanly split by Q1b. Real but Inert and Canceler are split by Q6: (c) for Canceler, (a) or (b) for Real but Inert.  
  - Format adheres to your constraints: prose-only, no labels, cases first. Positions emerge from answer patterns.
