  We are building a sorting quiz for the Doomsday Argument. The goal is to sort people by their intuitive answers to concrete cases, without jargon, and map them to positions in the logical space of the Doomsday Argument.

   The positions we want to reach (leaves):
   1. Classic Shifter: Takes early birth rank as evidence for a small total population, and maintains the shift.
   2. Canceler: Believes that the fact of your existence is evidence for a large total population, which exactly cancels the shift.
   3. Reference-Class Relativist: Thinks the answer depends on the reference class (who counts as "you") and there's no objective way to choose, so the argument dissolves.
   4. Infinitary Escapist: Argues that the expected number of observers is infinite, so the argument doesn't get off the ground.
   5. Real but Inert: Grants the probability shift but believes it cancels out in expected utility, so it shouldn't affect decisions.
   6. Skeptic: Believes you cannot update on your own existence at all, so the argument is invalid.
   7. Duration-Sampler: Applies the reasoning to temporal position within the lifetime of a thing (like a TV show) to predict duration.

   Additionally, we have three specific cases to include:
    A. Upload Census: Involves whether to count biological humans vs. uploaded minds (and whether per year or per life).
    B. Funding Committee: How the shift affects funding decisions for extinction risk reduction vs. near-term cause.
    C. Pair of cases about extra observers: One where the extra population is in the future and non-interacting, the other where they are on a sealed-off branch.

   We need 9-10 questions, each with 2-3 answer options. The quiz will be a branching tree, but we'll write it as continuous prose.

   We start by designing the questions to separate the positions. We'll build the logical space by considering the key decision points.

   Key decision points:

   1. Can you update on your own existence? (Skeptic vs. others)
   2. Is the expected total number of observers finite? (Infinitary escapist vs. others)
