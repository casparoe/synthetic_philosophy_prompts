  - Lexical: handles D3 but struggles with D7 (nested spectra thresholds)
  - Intransitive: respects D3 but explodes D1 and D6 (justificatory stability)

  Biggest tension is D3 vs D1+D7. If we insist outcomes must be comparable (D6) and scale-invariant (D7), while avoiding repugnant conclusion (D3), transitivity may be doomed. That might be the user's hidden conclusion - hence their focus on nested spectra as the litmus test.

  Least certain is D2 (intrapersonal parity). Is it essential for institutions? Maybe not if their mandate is purely social, but it weakens analogical arguments. I'll flag it as debatable.

  User seems analytically rigorous but frustrated by piecemeal solutions. Their request for "impossible combinations" suggests they suspect transitivity can't be saved while meeting all institutional demands. I'll validate that explicitly.
answer: |-
  Here’s a distilled set of desiderata for your institutional axiology, built from cases and practical constraints. I’ll argue for scale-invariance as non-negotiable given your public-reason requirement.

  ---

  ### **Desiderata for Institutional Betterness Relations**
  *(Non-negotiable for your institution marked **)***

  1.  **Transitivity of "Better Than" (D1)**  
      **Case:** *The Spectrum Argument (Parfit's Repugnant Conclusion)*. Start with A: 10B people at wellbeing 100. Each step reduces average wellbeing by 1 but multiplies population by 1.2. After 100 steps: Z has ~83M people at wellbeing ~0. If each step is better (due to huge total gain), transitivity forces A < Z — which seems repugnant.  
      **Why it matters **:** Your institution must give a single verdict. Intransitivity risks cycles (A<B<C<A), making decisive choice impossible without arbitrary tie-breaking.**  
      **Conflict:** Anti-repugnance intuitions push *against* transitivity here.

  2.  **Avoidance of the Repugnant Conclusion / Anti-Collapse (D2)**  
      **Case:** *Same Spectrum (A to Z)*. Z is astronomically larger but barely worth living. If A is better than Z, the theory avoids "collapsing" quality into mere quantity.  
      **Why it matters **:** Losers in Z (compared to A) could reasonably reject "your life is barely worth living, but there are trillions more like you" as justification for choosing Z over A. Quantity can't swamp quality entirely.**  
      **Tension:** Directly conflicts with D1 if the spectrum steps seem compelling individually.

  3.  **Intrapersonal/Interpersonal Parity (D3)**  
      **Case:** *The Same-Spectrum but Within One Life*. Compare a 50-year life at wellbeing 100 vs. a 100,000-year life at wellbeing 0.01 (achieved by tiny daily reductions traded for longevity). Is the longer life better? If your theory says "no" intrapersonally but "yes" interpersonally (for the same welfare numbers), it needs justification.  
      **Why it matters:** Without parity, losers in the interpersonal case (e.g., those at wellbeing 0.01) could argue: "You wouldn't accept this life for yourself, so why impose it on us?" **Violating parity risks hypocrisy in public reasons.**  
      **Principled Distinction?** Possible (e.g., "separate persons" matter), but weakens justifiability to losers.

  4.  **Strict Pareto Dominance (D4)**  
      **Case:** *Disjoint Populations*. Outcome X: Group A has high wellbeing, Group B has none (doesn't exist). Outcome Y: Group A has *slightly lower* wellbeing, Group B exists with positive wellbeing. Outcome Z: Group A has *very low* wellbeing, Group B has *very high* wellbeing. If X > Y, is Y > Z?  
      **Why it matters **:** If everyone in Y is better off than in X, but Y is declared worse, losers (Group B, who exist only in Y) have no reason to accept being "worse off" than not existing. Strict Dominance (if everyone better off and no one worse off, it's better) is core to public justification.**  
      **Note:** Only applies when populations overlap. Disjoint cases are harder.

  5.  **Vagueness vs. Genuine Intransitivity (D5)**  
      **Case:** *The Sorites Spectrum*. Is there a sharp line where adding 1 person at wellbeing level L makes an outcome worse? Or is "better than" vague?  
      **Why it matters:** If vagueness, your institution needs a precise rule (e.g., a threshold) to decide. **Genuine intransitivity (A<B, B<C, but A>C) is fatal for decisive choice.** Distinction: Vagueness implies epistemic uncertainty; genuine intransitivity implies no fact of the matter.  
      **Institutional Need **:** You need a rule to *treat* the relation as precise, even if metaphysical status is vague.**

  6.  **Justificatory Stability (Scale-Invariance) (D6)**  
      **Case:** *Nested Spectra*. Suppose the step from A to B in a spectrum isn't atomic. Instead, getting to B requires 100 sub-steps (B1, B2, ..., B100 = B), each trading a tiny welfare loss for a large population gain. If at the "coarse" level A < B, but zooming in shows A > B100 (because the sub-spectrum is repugnant), the verdict is unstable.  
      **Why it matters **:** Losers could argue: "You claim B is better than A, but when we examine how we got here, each small decision looked repugnant. Your justification dissolves under scrutiny." Public reasons must hold at all scales of analysis to be credible. Scale-dependence feels like a shell game.**  
      **Argument for Inclusion:** Institutions make decisions at multiple levels of granularity (policy frameworks → specific implementations). If betterness reverses based on how finely we describe the choice, reasons become arbitrary. **Non-negotiable for public justification.**

  7.  **Primitive Relation: "At Least As Good As" (Weak Order) (D7)**  
      **Case:** *Defining Equality*. "Better than" alone can't define when two outcomes are equally good. "Slightly better" introduces vagueness.  
      **Why it matters **:** Your institution needs to know when outcomes are tied to use a tie-breaker (e.g., status quo). "At least as good as" is minimal for defining a complete preorder. "Better than" can be derived from it.**  
      **Non-negotiable:** Necessary for decisiveness.

  8.  **Choice-Guidance / Non-Cycling (D8)**  
      **Case:** *Money Pump (for Institutions)*. If betterness is intransitive (A<B<C<A), and the institution faces sequential choices (e.g., A vs. B today, winner vs. C tomorrow), it could be "pumped" into paying to cycle endlessly.  
      **Why it matters:** Even in one-shot decisions, **cycling implies no best option exists**, forcing arbitrary choice. Losers can rightly say: "Your theory admits no best outcome; your choice is unjustifiable." **Non-negotiable for terminating in a verdict.**  
      **Objection Refuted:** While money-pumps typically assume repeated choices, the *logical possibility of cycles* alone undermines the existence of a "best" option, violating your requirement for a decisive verdict.

  ---

  ### **Key Tensions & Non-Negotiables**
  - **Impossible Triad?**  
    D1 (Transitivity), D2 (Anti-Repugnance), and D6 (Scale-Invariance) conflict.  
    *Example:* In nested spectra, if each small step is better (satisfying D1 transitively), zooming out leads to repugnance (violates D2). If you block repugnance at the macro level (D2), but accept small steps (D1), zooming in shows micro-repugnance (violates D6).  
    **→ Likely, no theory satisfies all three.**
    
  - **Non-Negotiables for Your Institution:**  
    **D1 (Transitivity)** or **D8 (Non-Cycling)** – Must have acyclic, decisive verdicts.  
    **D4 (Strict Dominance)** – Core to not harming identifiable groups without compensation.  
    **D6 (Scale-Invariance)** – Essential for public reasons to withstand scrutiny.  
    **D7 (Primitive "At Least As Good")** – Needed for completeness.  

  - **Most Exclusionary Desideratum:**  
    **D6 (Scale-Invariance)**. It forces theories to handle spectra consistently at all resolutions, ruling out:  
    - Contextual thresholds (e.g., "better at coarse grain but worse at fine grain").  
    - Theories that "solve" the spectrum by denying comparability at certain scales.  

  - **Least Confident Inclusion:**  
    **D3 (Intrapersonal Parity)**. While powerful for public reasons, an institution might argue its mandate is *only* interpersonal. Still, violating it weakens justifiability.

  ---

  ### **Theories vs. Desiderata (Brief Table)**

  | **Desideratum**          | **Total-Order (e.g., Total Utilitarianism)** | **Lexical/Threshold View** | **Essentially Comparative/Intransitive** |
  |--------------------------|----------------------------------------------|----------------------------|------------------------------------------|
  | **D1: Transitivity**     | ✅ Strictly satisfies                        | ❌ Fails at threshold jumps | ❌ Denies transitivity                   |
  | **D2: Anti-Repugnance**  | ❌ Fails (A < Z)                             | ✅ Blocks macro-repugnance | ✅ Avoids Z > A                         |
  | **D3: Intrapersonal Parity** | ✅ Automatic                               | ⚠️ May differ if thresholds vary | ⚠️ May treat cases differently         |
  | **D4: Strict Dominance** | ✅ Satisfies                                | ✅ Satisfies               | ⚠️ May fail if "essentially" worse      |
  | **D5: Vagueness Handling** | ⚠️ Treats as precise                      | ⚠️ Thresholds are precise | ✅ Embraces vagueness                  |
  | **D6: Scale-Invariance** | ✅ Satisfies (consistent at all scales)     | ❌ Fails (thresholds shift with granularity) | ❌ Fails (context-dependent)           |
  | **D7: Weak Order Primitive** | ✅ Natural fit                            | ✅ Can be defined          | ❌ Often denies completeness           |
  | **D8: Non-Cycling**      | ✅ Satisfies                                | ⚠️ Risks cycles at thresholds | ❌ Cycles guaranteed                 |

  **Summary:**  
  - **Total-Order** fails D2 (repugnance) and struggles with D5 (vagueness).  
  - **Lexical Views** fail D1, D6, D8 (due to threshold jumps).  
  - **Intransitive Views** fail D1, D6, D7, D8 (decisiveness).  

  ---

  ### **Confidence & Final Take**  
  **Confidence in List:** 90%. It captures your cases and institutional constraints. The core tension (D1/D2/D6) is real and likely unresolvable.  
  **Recommendation:** Prioritize D6 (Scale-Invariance) and D8 (Non-Cycling). This forces transitivity (D1) and rules out lexical thresholds and intransitive views. You then *must* accept some version of the repugnant conclusion (abandon D2) or embrace vagueness (D5) with a precise decision rule. **For public reasons, a scale-invariant total order (e.g., Total Utilitarianism with a vagueness-handling rule) may be the least bad option.** If anti-repugnance is non-negotiable, your institution may need to abandon decisive one-shot choice (but you said it can't).
