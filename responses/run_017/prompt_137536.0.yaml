  Now structuring the desiderata. For each, I'll include:
  - Concrete case (as requested)
  - Institutional relevance assessment
  - Non-negotiable status markers

  The nested spectra requirement (D7) is tricky. Consider a self-similar spectrum where each "step" is itself a spectrum. If a theory says A>B at coarse level but B>A when zoomed in, that seems justificationally unstable. But perhaps some contextualism is acceptable? I lean toward demanding scale-invariance for public reason-giving.

  For conflicts: D1 (transitivity) vs D3 (anti-collapse) seems tense. Lexical thresholds often violate D1 in spectra, while totalism violates D3. D2 (intrapersonal consistency) might be negotiable if institution only handles social choice, but weakens justification. D5 (dominance) feels non-negotiable - losers couldn't accept being worse off with no one better off.

  The table comparing views will highlight:
