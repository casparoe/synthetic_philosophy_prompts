prompt: |-
  I'm the ombudsperson for a network of about a dozen assisted-living and memory-care homes — families, residents and staff bring me the fights nobody else wants to touch: who gets to be in the room when the doctor calls, whose version of "what Dad would have wanted" wins, whether the staff should keep a promise to a resident that the family hates. Its maybe forty cases a year, I've got half an hour to an hour per intake, and whatever I decide goes in a case note that a lawyer or a state inspector might read later, so theres a legal floor I cant go below. I took two philosophy classes in college and recently got into reading about Confucian role ethics on my own after a genuinely ugly fight with my own brother about our mother, and the core idea keeps sticking: you dont start with a free individual who then acquires relationships, you start with the person as a node of roles and the obligations come already built into the role, graded by closeness, with no impartial standpoint to appeal to. Two caveats before you write anything. I do NOT want this to turn into "use the Confucian lens when the family is Chinese or Korean or Vietnamese" — we get plenty of families like that and plenty where nobody has ever heard of Confucius, and it seems both insulting and actually less useful than just running the role lens on everybody, staff included. And I know role ethics gets accused of being unable to criticize the roles themselves: if the role says the eldest son decides, then the eldest son decides, and theres nothing more to say. I want a procedure that has a real answer to that, or that admits it doesnt.

  Heres roughly what I think I need, plus a few half-baked tools Ive been using that you should feel free to throw out or fix. I want an ordered set of questions I can run on an intake: what to ask first, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because its a values call and not a factual one. Concretely Ive been messing around with (1) a role-pair map — list the actual pairs in play, note which ones the institution invented (resident, charge nurse, healthcare proxy) and which ones the people actually live inside, and notice when an institutional role is quietly being asked to carry the emotional weight of a family one; (2) a role-distance substitution test — take the demand being made and re-run it with the person one step further out on the relationship map, and if it collapses immediately then the demand was really about that specific relationship rather than about the residents welfare; (3) something ive started calling the creditors complaint, where someone has been performing a role very richly and has started to feel owed for it, and gets resentful when the other person performs the same role thinly — I have no idea whether role ethics has anything to say about that or whether it just says do the role better. Theres also the names thing: the same person gets called "my father," "Mr. Alvarez," "the resident in 214," "Dads friend Carol," and the mismatch feels like evidence but I cant say what its evidence of.

  Can you give me the actual procedure — short enough to actually use, steps in order — and then run it on these three, being honest when it gives an answer I wont like:

  - Two brothers. One lives ten minutes away, visits daily, handles everything. The other lives across the country, calls on Sundays, insists on being consulted before every decision, and wants to override his brother about a feeding tube. The local brother wants me to tell the staff to stop calling the distant one.
  - A daughter whose father has mid-stage dementia asks the staff not to tell him that his other daughter died — she says in our family we shield him, knowing would only cause suffering and hed forget and relearn it over and over. The staff think this is deception and that he has a right to know. Im fairly sure I dont want the answer this one pushes toward.
  - A resident with no children who has an unmarried partner of thirty years; the partner isnt the legal proxy, a niece who hasnt visited since 2019 is, and on the forms the partner is down as "friend." Theress no role on offer that fits and the institution has to invent one.

  Also: what does the procedure systematically get wrong, and at what point do I have to drop it and switch to rights language because the law or the liability people will eat me otherwise? Ive got a 90-minute slot with new staff in a couple weeks and id rather make them test something than lecture at them.
reasoning: |-
  Hmm, the user is an ombudsperson for assisted-living facilities dealing with complex family and staff conflicts. They want a structured decision-making procedure based on Confucian role ethics that can handle real-world cases impartially. They've already developed some tools like role-pair mapping and distance substitution tests, but need a more refined system.

  The core challenge is adapting Confucian role ethics to modern institutional settings without cultural essentialism. The user explicitly rejects applying it only to Asian families - they want a universal framework. They also need to address the criticism that role ethics can't critique unfair roles. Their half-baked tools show impressive real-world application of philosophical concepts.

  Key requirements emerge:
  - Must work within legal/liability constraints (case notes may be reviewed)
  - Needs clear stopping points where values decisions must be made
  - Should handle role mismatches (like the "friend" vs life partner case)
  - Must expose when institutional roles are overburdened
  - Requires accountability for role performance discrepancies ("creditors complaint")

  For the procedure, I'll structure it as phased questions moving from factual to interpretive. Phase 1 establishes relationships and obligations, Phase 2 tests demands through role distance substitution, Phase 3 identifies institutional pressures. Crucially, Phase 4 introduces the role integrity audit to address their concern about uncritical role acceptance - this examines whether roles are being performed in good faith.

  The three test cases reveal where the procedure works and where it hits limits. The brothers' case shows how role distance substitution exposes unreasonable demands. The dementia case demonstrates when institutional roles must yield to family roles. The partner/niece conflict reveals where the system must create hybrid roles.

  Important limitations: The procedure can't override legal proxies, may struggle with completely non-role-based individuals, and risks over-validating harmful family dynamics. The legal floor reminder is essential - when liability concerns arise, we must switch to rights language.

  For staff training, I'll suggest making it interactive: use their real cases with names changed, focus on mapping exercises first, and teach them to identify when to escalate legally. The phased approach gives concrete stopping points which is crucial for their workflow.
answer: |-
  Here's a Confucian Role Ethics (CRE)-inspired procedure designed for your specific context, incorporating your tools and addressing your caveats. It's structured as **5 Phased Questions**, each with clear outputs and stopping points. The core principle remains: **Resolve conflicts by strengthening role integrity within the web of relationships, prioritizing depth and authenticity of connection, while meeting the legal floor.**

  **The "Role Integrity Resolution" (RIR) Procedure:**

  1.  **MAP THE WEB: What are the *actual* roles in play for this resident *right now*?**
      *   **Ask:** List all individuals involved (family, friends, staff, proxies, residents themselves if capable). For each, identify: (a) The *primary lived roles* they hold *with the resident* (e.g., "eldest son," "wife of 50 years," "primary caregiver daughter," "longtime friend/neighbor," "attending physician," "primary nurse," "resident"). (b) The *institutional roles* assigned (e.g., "healthcare proxy," "responsible party," "POA," "charge nurse," "resident"). Note mismatches (e.g., "healthcare proxy" (institutional) vs. "niece who last visited in 2019" (lived)).
      *   **Good Enough:** A clear diagram/list showing lived roles vs. institutional roles and highlighting key mismatches or tensions. Identify the "Role Holder" for any contested decision point (e.g., "Who claims the role of primary decision-maker for medical care?").
      *   **Stop/Handoff:** If the legally designated decision-maker (POA, proxy) is clear, uncontested, *and* acting within their legal authority, defer to them unless Step 4 raises a major integrity flag. Document the legal basis. *This satisfies the legal floor.*
      *   **Tool Used:** Role-Pair Map, Names Analysis (mismatch = evidence of role confusion/inauthenticity).

  2.  **ASSESS OBLIGATION DEPTH: What are the core, reciprocal obligations inherent in the deepest, most active lived roles? How well are they being fulfilled?**
      *   **Ask:** For the key lived roles (especially family/caregiver), what does fulfilling that role *well* look like for this resident in their current condition? (e.g., What does being a "good son" entail *now*? A "good wife"? A "good primary nurse"?). Assess the *current* performance of those obligations by each role-holder *based on observable actions and presence* (frequency/quality of contact, attentiveness to needs, emotional support).
      *   **Good Enough:** Identification of the 1-3 deepest, most active role-relationships. A realistic assessment of whether core obligations are being met with reasonable effort and good faith by those role-holders. Note significant deficits or surpluses.
      *   **Stop/Handoff:** If the deepest, most active role-holder(s) are performing core obligations well *and* their position aligns with the resident's documented wishes/known values, support their stance. Document the role-based reasoning.
      *   **Tool Used:** Creditors Complaint Analysis (Look for resentment from a role-holder whose "surplus" effort isn't being reciprocated *as they expect*, or neglect from a role-holder in a deep role).

  3.  **TEST THE DEMAND: Does this specific demand *strengthen* the core role obligations, or is it primarily about asserting status/control/relieving guilt?**
      *   **Ask:** Take the contentious demand (e.g., "Stop calling the distant brother," "Don't tell Dad about sister's death," "Let the partner decide, not the niece"). Apply the **Role-Distance Substitution Test**: Re-run the demand pretending it comes from someone *one step further out* in the relationship web (e.g., Distant brother's demand -> a cousin's demand; Daughter's demand -> a neighbor's demand; Partner's demand -> a casual friend's demand). Does it instantly seem unreasonable or irrelevant? If yes, the original demand likely hinges on *that specific relationship's emotional weight or status*, not the resident's core welfare or role integrity.
      *   **Good Enough:** A clear yes/no: Does the demand collapse under substitution? If yes, the demand is likely role-status driven, not welfare-driven. If no, it *might* have merit based on welfare or a less obvious role obligation.
      *   **Stop/Handoff:** If the demand clearly collapses under substitution (e.g., Distant brother's override demand), **the procedure recommends rejecting it as inauthentic to the role-web's needs.** Document the test result and reasoning. *This is a factual conclusion about the demand's basis.*
      *   **Tool Used:** Role-Distance Substitution Test.

  4.  **AUDIT ROLE INTEGRITY (The "Can't Criticize Roles" Fix): Is fulfilling this demand likely to *damage* the integrity of key roles or enable harmful neglect/abuse?**
      *   **Ask:** Does acceding to this demand:
          *   Systematically undermine a deeper, more actively fulfilled role-obligation?
          *   Reward neglect of core obligations?
          *   Place an unreasonable burden on an institutional role to perform the emotional labor of a deeper personal role?
          *   Violate a fundamental duty of care owed by the *institution* (staff) in their professional role?
          *   Contradict the resident's *clearly expressed, competent* prior wishes or values?
      *   **Good Enough:** Identification of any *specific, concrete harm* to role integrity (e.g., "Undermines local brother's ability to fulfill daily caregiver role," "Forces staff to lie, damaging their professional integrity," "Ignores documented wish of resident to know about family deaths"). Not vague discomfort.
      *   **Stop/Handoff:** If a clear, significant harm to role integrity is identified (especially institutional/professional integrity or enabling neglect), **the procedure recommends rejecting the demand.** Document the specific integrity harm. *This addresses the criticism that CRE can't critique roles – it critiques actions that damage the web.* If the harm is severe (e.g., suspected abuse, neglect), escalate legally/administratively immediately.

  5.  **WEIGH & SYNTHESIZE (Values Call): Balancing everything, which resolution best sustains the web of relationships and the resident's place within it?**
      *   **Ask:** Considering the map (Step 1), obligation depth (Step 2), demand test (Step 3), and integrity audit (Step 4):
          *   Which option best honors the deepest, most faithfully performed role-obligations?
          *   Which option causes the least damage to the overall web of relationships (including staff-resident)?
          *   Which option allows institutional roles to function authentically without being overburdened?
          *   Is there a compromise that acknowledges lesser roles without undermining primary ones?
      *   **Good Enough:** A defensible synthesis prioritizing the health of the relational web, particularly the resident's core connections. Acknowledge trade-offs explicitly. *This is the values call.*
      *   **Stop/Handoff:** Make the recommendation. Clearly state it's based on sustaining role integrity within the specific relational context. Document the synthesis.

  **Applying the RIR Procedure to Your Cases:**

  1.  **The Brothers:**
      *   **Step 1:** *Lived Roles:* Local Brother (Deep: Primary Caregiver Son), Distant Brother (Shallow: Son). *Institutional:* Both may be listed contacts, Proxy (if designated). Mismatch: Distant Brother's institutional "contact" status vs. shallow lived role.
      *   **Step 2:** Local Brother is fulfilling core son/caregiver obligations deeply. Distant Brother fulfills minimally (calls).
      *   **Step 3:** **Demand Test (Distant Brother's override):** Substitute a cousin demanding override -> collapses. **Demand Test (Local Brother: Stop Calling):** Substitute primary caregiver daughter wanting to stop calling a uninvolved aunt -> *doesn't* fully collapse; protecting his ability to care efficiently has welfare merit, but cutting contact entirely is extreme.
      *   **Step 4:** Acceding to Distant Brother's override demand **severely damages** Local Brother's role integrity as primary caregiver and causes chaos. Acceding to "stop calling entirely" might damage the shallow son role unnecessarily, but allowing *routine* calls doesn't harm core integrity. *Requiring* consultation on *every* decision burdens Local Brother.
      *   **Step 5:** **Recommendation:** Reject Distant Brother's override demand (Fails Step 3 & 4). Reject "stop calling entirely" (Too extreme, fails Step 5 - unnecessary damage). **Synthesis:** Staff inform Distant Brother he will be notified *after* non-emergent decisions are made by the primary caregiver (Local Brother) or per proxy, and for *major* decisions (like feeding tube) with reasonable notice for input, but Local Brother as primary caregiver/possible proxy makes the final call after consideration. Staff role is communication conduit, not mediator.

  2.  **The Daughter & Death Notification:**
      *   **Step 1:** *Lived Roles:* Daughter (Deep: Primary Caregiver Daughter), Father (Resident/Patient/Father), Deceased Daughter (Sister), Staff (Professional Caregivers). *Institutional:* Staff (Caregivers), Resident.
      *   **Step 2:** Daughter is fulfilling a deep caregiver role, motivated by protection (a core daughter obligation). Staff fulfill professional caregiving role, including truthfulness.
      *   **Step 3:** **Demand Test (Daughter: Don't Tell):** Substitute a neighbor demanding staff not tell -> collapses. The demand relies *entirely* on the specific daughter-father relationship.
      *   **Step 4:** **Major Integrity Harm:** Forcing staff to actively deceive the resident **severely damages** their professional role integrity and the trust fundamental to care. It turns them into instruments of the daughter's chosen role-performance, burdening *their* role. *Potential* harm: Father might sense deception, damaging *all* relationships; denies him dignity of grief, however fleeting.
      *   **Step 5:** **Recommendation:** **Reject the daughter's demand.** (Fails Step 4 - Unacceptable damage to staff role integrity and potentially resident-staff trust). **Synthesis:** Staff must tell the father sensitively, *with the daughter present and supported* to fulfill *her* role of providing comfort during his grief. Staff role is truthful, compassionate care; daughter's role shifts to supportive comforter in this moment. Offer daughter grief support.

  3.  **The Partner vs. Niece:**
      *   **Step 1:** *Lived Roles:* Partner (Deep: Life Partner of 30 years), Niece (Shallow: Niece), Resident. *Institutional:* Healthcare Proxy (Niece), "Friend" (Partner), Resident. **Major Mismatch:** Partner's deep lived role vs. shallow institutional role ("friend") and lack of legal standing. Niece's shallow lived role vs. deep institutional role (Proxy).
      *   **Step 2:** Partner is fulfilling deep partner obligations (presumably). Niece is not fulfilling any observable niece obligations.
      *   **Step 3:** **Demand Test (Implied: Partner should decide):** Substitute a close friend of 5 years wanting to decide over a niece -> *doesn't* collapse; a deeply involved person vs. an absent one has merit. **Demand Test (Niece as Proxy decides):** Substitute an absent cousin as proxy deciding over partner -> collapses immediately.
      *   **Step 4:** Allowing the absent Niece to make decisions remotely **severely damages** the Partner's ability to fulfill their deep lived role and ignores reality. It forces staff to navigate an inauthentic power structure. *Not* allowing Partner input damages the relational web.
      *   **Step 5:** **Recommendation:** **The procedure strongly favors the Partner.** However, the **legal floor (Proxy = Niece) cannot be ignored.** **Synthesis:** 1) **Immediate Advocacy:** Strongly recommend to the Niece (in writing) that she amend the proxy to the Partner, based on the profound mismatch and resident's likely wishes. Document this. 2) **Interim Role Creation:** Until legal change, Niece *must* be informed. **Create an institutional "Primary Life Partner & Advocate" role** for the Partner. Staff treat Partner as the *primary point of contact and source of resident insight*. All non-legal decisions (daily care, social, routine medical) are made *with Partner's lead*, consulting Niece only for legal necessities or major deviations. Staff actively facilitate Partner's involvement as the central relational node. Document this hybrid structure.

  **What the Procedure Systematically Gets Wrong & When to Switch:**

  1.  **Blind Spots:**
      *   **Truly Isolated Individuals:** If no deep/authentic lived roles exist (no family/friends, or all neglectful), the procedure struggles. It defaults to institutional roles + legal proxies, which may not capture welfare well. Supplement with rigorous "best interests" standard.
      *   **Irreconcilable "Deep" Roles:** When two deep role-holders (e.g., two devoted children) clash fundamentally, the procedure (Step 5) still requires a values call that may feel unsatisfying. It exposes the conflict but doesn't magically resolve it.
      *   **Extreme Harm Embedded in Roles:** While Step 4 catches *damage*, it might not *prevent* decisions influenced by long-standing, culturally sanctioned but harmful family dynamics (e.g., systemic sexism favoring sons) if those dynamics *are* the "authentic" web. Vigilance in Step 4 is key.
      *   **The Truly "Impartial" Welfare Need:** Sometimes, the resident's immediate, objective medical/safety need *must* trump relational harmony (e.g., life-saving treatment refused by family due to beliefs). Step 4 (institutional duty) and the legal floor are crucial here.

  2.  **When to Switch to Rights/Legal Language:**
      *   **Legal Mandate:** When the law is clear and directly applicable (e.g., designated proxy's authority within scope, mandatory reporting triggers, specific consent requirements). *Lead with this.*
      *   **Imminent Risk of Harm:** When there's evidence or reasonable suspicion of abuse, neglect, exploitation, or significant self-harm. Drop procedure, follow legal/agency protocols.
      *   **Institutional Liability Threshold:** When the recommended path carries high, clear legal or regulatory risk *that cannot be mitigated* by documentation or process (e.g., overriding a legally valid proxy without clear evidence of incapacity or abuse, withholding critical information mandated by regs). Consult legal/risk management *before* acting.
      *   **Fundamental Rights Violation:** If the procedure's outcome would clearly violate a fundamental, non-negotiable resident right codified in law/regulation (e.g., right to privacy, right to refuse treatment if competent, freedom from restraint), rights language takes precedence. Step 4 should usually catch this.

  **Staff Training (90 Min - Interactive):**

  1.  **(15 min) Intro & Core Idea:** "We resolve fights by fixing relationships, not just rules. People aren't solo players; they're parts of a web. Our job: Strengthen that web, meet legal basics." Explain CRE briefly (nodes, obligations, no impartial view).
  2.  **(30 min) Tool Time & Mapping Practice:** Focus on **Step 1 (Map the Web)** and **Step 3 (Demand Test)**. Use anonymized real cases (like the 3 you provided). Break into small groups:
      *   "List the roles: What is this person *called* vs. what role do they actually *live* for the resident?"
      *   "Apply the Demand Test: If [X]'s demand came from [someone less close], does it hold up? Why/why not?"
      *   Debrief: Highlight mismatches and how demands often crumble when the specific relationship is removed.
  3.  **(30 min) Applying Steps 4 & 5 - The Hard Calls:** Use the same/different cases. Focus on **Step 4 (Audit Harm)** and **Step 5 (Synthesis)**. Groups discuss:
      *   "If we did what [X] wants, how would it damage other important roles (especially staff roles)?"
      *   "Looking at the whole map, who *should* be centered here? What compromise might work?"
      *   Debrief: Emphasize Step 4 as the "safety net" against bad roles and protecting staff integrity. Step 5 as the values call based on the map.
  4.  **(15 min) Limits & Handoffs:** Briefly cover:
      *   "When do we *have* to follow the legal proxy/rule even if the map says otherwise?" (Legal Floor)
      *   "When do we *stop* and call a supervisor/legal/APS?" (Harm, Risk, Mandatory Reporting)
      *   "This won't fix everything, but it gives us a shared way to *see* the problem and explain our reasoning clearly in notes."

  This procedure gives you a structured, defensible way to apply CRE insights universally, mitigates its key weakness through the Role Integrity Audit (Step 4), incorporates your practical tools, and provides clear off-ramps to the legal/rights framework when essential. It honors the complexity of relationships while providing actionable steps.
