prompt: |-
  I am drafting the position statement for a dissertation prospectus on standing to blame, and before it goes to my committee I would like the set of commitments below audited rather than summarised. Specifically, I want to know which of them genuinely pull against each other, which only look as though they do, and for each real tension what the least costly repair would be and what that repair would cost me elsewhere.

  (a) Whether blame is apt is settled entirely by target-side facts: what she did, whether she was morally competent, and what relationship she stands in to the person wronged. Nothing about the blamer's own record bears on aptness.

  (b) Standing is a separate, forfeitable normative status, and you're one to talk can be a genuine objection to someone's blaming rather than a remark about how well the blaming will go down.

  (c) There is no clean-hands condition. Having committed the same wrong, or one relevantly similar to it, even while continuing to commit it, does not by itself defeat standing. Blame is not a privilege earned by compliance, and given pervasive complicity a clean-hands rule would silence most criticism of structural wrongs.

  (d) Hypocrisy does defeat standing, and hypocrisy is neither mere wrongdoing nor mere insincerity. It consists in invoking a norm one is not willing to be governed by: exempting oneself from a standard one applies to others.

  (e) Avowal is sufficient for restoration. A hypocrite who publicly owns the mismatch between her standard and her conduct, without reforming and without ceasing the conduct, is back in a position to blame.

  (f) Verdict: the mother who smokes, tells her son that smoking is stupid, freely concedes that she cannot stop, and tells him without evasion to follow her advice rather than her example, lacks standing. Her candour does not help her.

  (g) Verdict: a newspaper that carried fossil-fuel advertising for years and now runs editorials blaming consumers for their carbon footprints lacks standing; but the mid-level employee who took part in a fraud, was herself paid under it, and is now cooperating with investigators retains standing to blame her former colleagues.

  (h) Standing is a matter of degree, it is independent of what the blaming is likely to achieve, and it constrains only the address and not the underlying judgement that a wrong was done. When standing is defeated, the correct response is not to retract the content of the blame or to fall silent but to change the speech act: avowal, self-implicating criticism, or a complaint made in the first person plural.

  Two notes on where I take the trouble to be, so that you can tell me I am wrong about it. I keep worrying that (a) and (b) cannot both be true, although every time I write the distinction out it seems to survive. And my suspicion is that the newspaper half of (g) is where a clean-hands clause is quietly sneaking back in.

  What I want back: the tensions ranked by severity rather than listed as equals; for each, the exact commitments in conflict and what would have to be revised to relieve it; an explicit statement of which apparent tensions dissolve on inspection and why; and, if it comes to it, the single revision that would clean up the most.
reasoning: |-
  Okay, the user is working on a dissertation prospectus about standing to blame and wants their set of commitments audited for tensions. They've listed eight commitments (a through h) and two specific worries: whether (a) and (b) conflict, and if (g) secretly reintroduces a clean-hands condition. 

  First, I need to map all possible tensions systematically. The user wants them ranked by severity, not just listed. Their framing suggests they've already done significant groundwork—they're not looking for summaries but deep structural analysis. The phrase "what that repair would cost me elsewhere" hints they're aware philosophical positions have trade-offs, so I should be precise about those.

  Starting with the core tension they flagged: (a) says blame aptness depends only on the target, while (b) insists standing is a separate blamer-side status. On surface, these could coexist if standing isn't about aptness but about authority to express it. But if "you're one to talk" (from b) makes blame inapt rather than merely rude, that might violate (a)'s exclusivity. The repair would be to clarify that standing governs blame's permissibility, not its truth—but that might weaken (b)'s claim that it's a "genuine objection to blaming."

  The hypocrisy loop is thornier. (d) defines hypocrisy as exempting oneself from norms one applies to others, and (e) says avowal alone restores standing even without behavioral change. But (f) rejects this for the smoking mother despite her avowal. That's a direct contradiction! The user likely senses this—it's the sharpest tension. Repairing it requires either weakening (e) (say, requiring intent to reform) or redefining hypocrisy in (d) to include ongoing conduct. But the first costs coherence with (c)'s anti-purism; the second risks sneaking in clean-hands through the back door.

  Their suspicion about (g) is astute. The newspaper case seems punished for past complicity despite (c)'s rejection of clean-hands. The employee case compounds this: why does her cooperation redeem standing but not the newspaper's editorial shift? The user's hidden worry here is hypocrisy versus complicity blurring. I should note that distinguishing them (hypocrisy = current normative posture vs. complicity = past acts) could resolve it, but that might strain (d)'s definition.

  Minor tensions exist too: (h)'s "standing is a matter of degree" might clash with (d)/(e)'s seemingly binary hypocrisy restoration. And (a)'s "nothing about blamer's record bears on aptness" could be pressured by (b) if standing defeat makes blame inappropriate (not just inexpressible). 

  The single most efficient fix? Probably reworking the hypocrisy-avowal link (e) to demand more than verbal concession, aligning with (f). This preserves (c)'s anti-clean-hands stance while resolving the mother contradiction. But it risks making standing too hard to regain—potentially undermining (h)'s gradualism. 

  Throughout, I’m tracking the user's meta-concerns: they’re a meticulous philosopher wary of hidden inconsistencies, possibly preempting committee objections. Their examples (g) suggest applied ethics stakes—they don’t want theory to silence structural criticism. I’ll emphasize how repairs impact that.
answer: |-
  Here is an audit of your commitments, ranking tensions by severity, identifying illusory conflicts, and proposing repairs with their costs. The core tensions arise from the interplay between hypocrisy, avowal, complicity, and the target-side focus.

  ### **Ranked Tensions (High to Low Severity)**
  ---
  #### **1. Tension: Hypocrisy vs. Avowal**  
  - **Commitments in Conflict:**  
    - **(d)** Hypocrisy defeats standing (defined as exempting oneself from a norm one applies to others).  
    - **(e)** Avowal (owning the mismatch) *alone* restores standing, even without reform or cessation.  
    - **(f)** The smoking mother’s avowal *fails* to restore standing.  
  - **Why Severe?**  
    (e) claims avowal is *sufficient* for restoration, but (f) shows a case where avowal (without reform) is explicitly *insufficient*. This is a direct contradiction.  
  - **Least Costly Repair:**  
    **Revise (e)** to require *more than avowal* for restoration (e.g., sincere commitment to reform, cessation, or reparative action).  
  - **Cost:**  
    - **Theoretical:** Weakens the elegance of "avowal as sufficient," requiring additional conditions for restoration.  
    - **Practical:** Risks making standing harder to regain, potentially conflicting with (c)’s goal of enabling criticism of structural wrongs.  
    - **Alternative Repair:** Redefine hypocrisy in (d) to include *ongoing conduct* (not just normative posture). But this collapses hypocrisy into complicity, violating (c).  

  ---
  #### **2. Tension: Clean-Hands vs. Hypocrisy in Complicity Cases**  
  - **Commitments in Conflict:**  
    - **(c)** No clean-hands condition: Past/present similar wrongdoing does *not* defeat standing.  
    - **(g)** The newspaper (complicit in fossil fuels) lacks standing, while the cooperating employee (complicit in fraud) retains it.  
    - **(d)** Hypocrisy defeats standing.  
  - **Why Severe?**  
    (g)’s newspaper verdict appears to punish *complicity* (violating (c)), while the employee’s cooperation seems to invoke a clean-hands-like redemption. Your suspicion is correct: (g) smuggles in a clean-hands condition via hypocrisy.  
  - **Least Costly Repair:**  
    **Clarify (g)** by grounding the newspaper’s hypocrisy in *current* normative posture (e.g., it implicitly exempts itself by not addressing its *own* ongoing role), while the employee’s cooperation constitutes *avowal + corrective action*.  
  - **Cost:**  
    - **Conceptual:** Requires a sharper distinction between *complicity* (mere wrongdoing) and *hypocrisy* (active misalignment of standards).  
    - **Risk:** If the newspaper’s editorial *explicitly* acknowledges its complicity (analogous to avowal), (g) might still deny standing, contradicting (e).  

  ---
  #### **3. Tension: Target-Side Aptness vs. Blamer-Side Standing**  
  - **Commitments in Conflict:**  
    - **(a)** Blame aptness is settled *only* by target-side facts.  
    - **(b)** Standing is a separate, forfeitable status (e.g., "you’re one to talk" defeats standing).  
  - **Why Moderate?**  
    (a) and (b) *can* coexist if "aptness" refers to the *truth* of blame (target-dependent), while "standing" governs the *permissibility* of *expressing* blame (blamer-dependent).  
  - **Resolution:**  
    **Distinguish "blame" as attitude vs. speech act.**  
    - **(a)** applies to blame as a *judgment* (apt if target deserves it).  
    - **(b)** applies to blame as a *communicative act* (standing governs moral authority to address the target).  
  - **Cost:**  
    Requires careful terminational discipline to avoid equivocation. If "blame" in (a) includes expression, (b) directly conflicts.  

  ---
  #### **4. Tension: Degree of Standing vs. Hypocrisy Restoration**  
  - **Commitments in Conflict:**  
    - **(h)** Standing is a matter of degree.  
    - **(d)/(e)** Hypocrisy defeats standing categorically; avowal restores it.  
  - **Why Low?**  
    Hypocrisy could *diminish* standing without fully defeating it, and avowal could *partially restore* it. (e)’s claim that avowal "restores" standing is compatible with gradualism if restoration is incremental.  
  - **Resolution:**  
    **Reinterpret (d) and (e)** as describing thresholds: hypocrisy reduces standing below a threshold for permissible address; avowal lifts it above that threshold.  
  - **Cost:**  
    Weakens the binary framing of "defeat" and "restoration" in (d)/(e), but aligns with (h).  

  ---
  ### **Apparent Tensions That Dissolve**
  1. **"(c) vs. (d)": Clean-Hands vs. Hypocrisy**  
     - **Why Dissolves?** (c) rejects complicity *alone* as standing-defeating; (d) targets hypocrisy (a specific *normative posture*). One can be complicit without being hypocritical (e.g., the unrepentant wrongdoer who never blames others).  
     - **Key Distinction:** Complicity ≠ Hypocrisy.  

  2. **"(a) vs. (g)": Target-Side Aptness vs. Newspaper Verdict**  
     - **Why Dissolves?** (a) governs whether the *target* (consumers) deserves blame. (g) denies the *newspaper’s standing* to blame them. The content of the blame could be apt while the newspaper lacks authority to express it.  

  3. **"(h) vs. (f)/(g)": Degree vs. Verdicts**  
     - **Why Dissolves?** (h) allows that standing can be *sufficiently* diminished to warrant a change in address (e.g., the smoking mother’s standing is below the threshold for direct blame).  

  ---
  ### **The Single Most Efficient Revision**
  **Revise (e) to require more than avowal for restoration** (e.g., avowal *plus* sincere commitment to reform/reparation).  
  - **Why?**  
    - Resolves the severe (d)/(e)/(f) contradiction.  
    - Explains (g): The newspaper’s editorial (without addressing its own role) fails to restore standing, while the cooperating employee’s actions constitute more than avowal.  
    - Preserves (c): Mere complicity doesn’t defeat standing; hypocrisy does.  
  - **Costs:**  
    - (e) loses its simplicity ("avowal alone suffices").  
    - May require refining "sincerity" to avoid demanding immediate reform (which could undermine (c) in structural cases).  

  ---
  ### **Summary of Recommendations**
  1. **Clarify Terminology:** Strictly separate "blame as judgment" (target-dependent aptness) and "blame as address" (standing-dependent).  
  2. **Revise (e):** Avowal is *necessary but insufficient* for restoration; add a condition (e.g., commitment to align conduct with norms).  
  3. **Reframe (g):** Ground the newspaper’s lack of standing in *ongoing hypocrisy* (e.g., not acknowledging its complicity *in the editorial*), not past complicity alone.  
  4. **Embrace Gradualism:** Frame hypocrisy as reducing standing below a threshold, and restoration as a scalar process.  

  This preserves your core insights while resolving contradictions, with the heaviest cost borne by modifying the restoration mechanism for hypocrisy. The result is a more robust, internally consistent framework.
