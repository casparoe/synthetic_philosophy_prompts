answer: |-
  ### The view under test  
  The Maintenance Account (MA) holds that a trait type T in a current population has function E iff tokens of T are presently being *retained* in that population *because* they produce E. "Retained-because" is a difference-making relation grounded in ongoing selection over a "biologically relevant run of generations": if T stopped producing E (with all else equal), T’s frequency would decline. MA requires actual *maintenance* by E, not just past selection. Ambiguities resolved: "currently" refers to an ongoing process (not a single generation), and "retained" implies counterfactual vulnerability to E-removal. Functions attach to *population-level* trait types, not individual tokens.

  ---

  ### Decisive defeaters (≈350 words)  
  **1. The Passenger Problem (empirically attested):** This is potentially fatal. Consider traits fixed by drift or neutral processes that later become indispensable due to *downstream dependencies*. Example: Vertebrate genomes contain fused chromosomes (e.g., human chromosome 2 from ancestral ape chromosomes 2A/2B). The fusion was likely neutral or deleterious but fixed by drift. Later, essential genes accumulated near the fusion site. Now, disrupting the fused structure is lethal, but its retention isn’t *due to* any effect it produces—it’s a structural constraint. MA would misattribute a "function" (genomic stability?) to the fusion because removing it *now* reduces fitness. Biology treats it as a non-functional historical artifact; its indispensability is a *consequence*, not a cause of maintenance. If such cases are common (e.g., in gene networks or developmental pathways), MA systematically conflates *being currently necessary* with *having a function*.  

  **2. Genomic "Junk" Debate (empirically attested):** MA requires selection for E to assign a function. Yet, large swathes of the genome (e.g., transposable elements, pseudogenes) show biochemical activity (transcription, binding) but no evidence of selective maintenance. MA correctly denies them functions, but proponents of "omnipresent function" (e.g., ENCODE critics) argue that *stabilized* non-selected effects (e.g., structural roles in chromatin) are functional. If biologists widely accept that such stabilized-but-not-selected-for effects *are* functions (e.g., in regulatory "dark matter"), MA is revisionist. This clashes with your claim that MA excludes "mere" contributions like heart sounds.  

  ---

  ### Awkward but survivable (≈250 words)  
  **1. Relaxed Selection:** Cavefish lose eyes due to relaxed selection; MA says eyes no longer have a function. Yet, we can still say an *individual* cavefish eye is "malfunctioning" if diseased (e.g., infected). *Survival strategy:* Concede MA denies *systemic* functions to vestigial traits but argue "malfunction" is contextual—e.g., relative to ancestral or developmental norms. *Cost:* Weakens MA’s claim to explain normativity solely via maintenance.  

  **2. Spatially Varying Selection:** Sickle-cell allele (HbS) is maintained by malaria resistance in endemic regions but neutral or deleterious elsewhere. MA implies HbS has a function (malaria resistance) only in malarial populations. *Survival:* Bite the bullet—functions are population-relative. Define populations by selective regimes. *Cost:* Undermines intuition that a trait has an "intrinsic" function; a single organism’s trait function changes if it migrates.  

  **3. Shifting Mosaic of Effects:** If selection favors trait T for effect E₁ in generation t, E₂ in t+10, and E₃ in t+20, MA might assign disjunctive functions (E₁ ∨ E₂ ∨ E₃) or no stable function. *Survival:* Argue the "biologically relevant run" smooths volatility: if T is maintained over 100 gens *because* it produces *some* fitness-enhancing effect (even if shifting), its function is "to enhance fitness via context-dependent contributions." *Cost:* Functions become vague or disjunctive, losing specificity rivals provide.  

  ---

  ### What a defender concedes, what she dismisses (≈200 words)  
  **Concede:**  
  - The **passenger problem** is a genuine threat if dependencies arise neutrally and later constrain fitness. MA cannot distinguish maintained effects from entrenched constraints.  
  - **Spatial variation** forces population-relativity; MA cannot assign context-independent functions.  
  - Under **relaxed selection**, MA *must* deny vestigial traits have functions (e.g., cavefish eyes). Defenders should admit this but challenge intuitions that "malfunction" implies a *current* function.  

  **Dismiss:**  
  - **"Malfunction" intuitions in relaxed selection:** Argue these confuse *capability* (e.g., "eyes *can* detect light") with *function*. MA explains why cavefish eyes aren’t *supposed* to detect light.  
  - **Collapse into causal-role:** MA’s "retained-because" is irreducibly historical (over generations), unlike ahistorical causal-role accounts. If E stops contributing *now*, MA says it never *was* the function—causal-role disagrees.  

  ---

  ### How exposed is it? (≈200 words)  
  MA is **moderately exposed**. The passenger problem is a critical vulnerability: if entrenched neutral traits are common, MA misattributes functions. It’s **not fully insulated**—"biologically relevant run" can’t resolve passengers, as their indispensability is *current* but not *maintained-by-selection*. Shifting mosaics and spatial variation are manageable with parameter tuning (e.g., defining populations/epochs carefully), but this risks *ad hoc* gerrymandering. The **collapse worry is overstated**: MA’s historical grounding ("retained over generations because") prevents assimilation into causal-role views, which lack this temporal depth. However, if "retained-because" reduces to "currently pays costs," collapse looms; MA must insist maintenance requires a track record of difference-making.  

  ---

  ### What I’d find most persuasive (≈100 words)  
  1. **The chromosome 2 fusion**: MA assigns it a function (genomic stability?), but biologists treat it as a functionless constraint. If this generalizes to other "evolutionary ratchets" (e.g., in gene loss or developmental entrenchment), MA conflicts with biological practice.  
  2. **Genomic "junk" debate**: If working biologists increasingly attribute "functions" to non-maintained but stabilized biochemical activities (e.g., transposable elements providing raw material for innovation *without* being maintained for it), MA is descriptively inadequate. Here, the "slack" in your account—insisting only maintained effects count—does the heavy lifting, but biology might reject this.  

  Both cases pit MA against empirical biological judgment, not just philosophical intuition.
