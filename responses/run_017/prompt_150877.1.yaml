  ### Decision Tree for Forecast Disagreements  
  **Start**: Two people have stated different probabilities for the same event and haven’t converged after sharing written reasoning.  

  1. **"After reading each other’s writeups, do you both mean exactly the same thing by the event description? (e.g., what counts as a 'hard cap' or 'imposed'?)"**  
     - **No** → **A: Mismatched Definitions**  
     - **Yes** → 2  

  2. **"Is there any key fact or data point that one of you knew about and the other didn’t see in the writeups?"**  
     - **Yes** → **B: Unshared Evidence**  
     - **No** → 3  

  3. **"If you sat together and reviewed every piece of evidence line by line, would you still disagree on how strongly each piece affects the probability? (e.g., 'This news report is a strong signal' vs. 'It’s weak')"**  
     - **Yes** → **C: Different Weighting**  
     - **No** → 4  

  4. **"Before researching this topic, would you both have given roughly the same initial guess for this event?"**  
     - **No** → **D: Different Starting Points**  
     - **Yes** → 5  

  5. **"Is either of you adjusting your stated probability for reasons beyond pure belief? (e.g., to game the scoring system, please a client, or avoid looking inconsistent?)"**  
     - **Yes** → **E: Incentive Distortion**  
     - **No** → 6  

  6. **"Is one of you overly attached to your original estimate, resisting updates despite new evidence?"**  
     - **Yes** → **F: Anchoring**  
     - **No** → 7  

  7. **"Would converging now be worse than keeping two estimates? (e.g., to motivate evidence-gathering or preserve alternative scenarios.)"**  
     - **Yes** → **G: Strategic Disagreement**  
     - **No** → **H: Hidden Misupdate**  

  ---

  ### Leaf Diagnoses  
  **A: Mismatched Definitions**  
  - *Awkward truth*: You weren’t even debating the same event.  
  - *Next step*: Co-write a precise event definition and re-forecast.  

  **B: Unshared Evidence**  
  - *Awkward truth*: Critical information was known but not communicated.  
  - *Next step*: Share the missing evidence verbally and recalculate.  

  **C: Different Weighting**  
  - *Awkward truth*: Same facts, but irreconcilable views on their importance.  
  - *Next step*: Debate the 1–2 most contentious weights using historical analogies.  

  **D: Different Starting Points**  
  - *Awkward truth*: Your worldviews are too divergent for evidence to bridge quickly.  
  - *Next step*: Discuss why your baseline assumptions differ (e.g., "Are governments inherently reactive?").  

  **E: Incentive Distortion**  
  - *Awkward truth*: Scores/clients are distorting honest expression.  
  - *Next step*: Forecast anonymously or adjust incentives.  

  **F: Anchoring**  
  - *Awkward truth*: One of you is under-updating due to inertia.  
  - *Next step*: Anchored person forecasts from scratch ignoring their first number.  

  **G: Strategic Disagreement**  
  - *Awkward truth*: Convergence would harm collective accuracy.  
  - *Next step*: Set a deadline to revisit (e.g., "After COP29") and assign evidence gaps to each.  

  **H: Hidden Misupdate**  
  - *Awkward truth*: Someone's mental math is broken (e.g., misweighted evidence, calculation error).  
  - *Next step*: Rebuild probabilities together step-by-step on a whiteboard.  

  ---

  ### Key Notes  
  - **Indistinguishable pairs**:  
    - **C (Different Weighting)** vs. **D (Different Starting Points)**: Both manifest as "same evidence, different conclusions." Only Node 4 (initial guess) splits them.  
    - **B (Unshared Evidence)** vs. **C (Different Weighting)**: If evidence *was* shared but ignored (B leaks into C), the tree prioritizes B.  
  - **Empty branches**: None. All answer combinations map to a leaf.  
  - **Self-trust**: Embedded in **C (Different Weighting)** (e.g., "I discount my own data because I’m poorly calibrated on tech policy").  
  - **Theorem alignment**: Leaves A, B, D, E, F, H imply irrationality per Aumann; G is a rational bypass; C is ambiguous (could be rational with differing expertise).  

  ---

  **Output**: One-page flowchart for team standups. Pin it. When disagreements arise, walk through the tree together.
