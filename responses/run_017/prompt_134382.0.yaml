prompt: |-
  I'm clerking at a constitutional court and we've got a franchise case next month, and I'd rather think about the shape of our own record than about what other countries do. Our track record: we upheld compulsory voting with a small abstention fine for citizens 18+ in national elections; we struck that fine as applied to 16- and 17-year-olds in municipal elections while leaving their right to vote standing; we upheld a voting age of 16 for municipal elections but struck it for national ones; we upheld municipal voting for non-citizens with five-plus years' residence but struck it for national elections; we upheld the national vote for citizens who've lived abroad fifteen-plus years; we upheld prisoner voting for sentences under three years and struck it above that; and we upheld letting long-term resident non-citizens vote in a consultative, non-binding national referendum.

  The new bill creates a "long-term resident" status — ten-plus years' residence, pays income tax, liable for jury service, deportable only for serious crimes — and gives holders the vote in national parliamentary elections, with the same fine as citizens. There's a fallback amendment that gives them the vote with no fine attached. What rule are we actually running here: subjection to the state's coercion, full membership of the political community, stakes-plus-contribution, affected interests, or something else I'm not listing? What should we do if we want to be consistent with ourselves, which precedent is the closest analog, and where our precedents genuinely underdetermine it, what principle would we be adopting with each option? Also: which single further case would best pry apart the rules that fit our record? End with \answer{...}, five words or fewer — e.g. \answer{vote yes, strike the fine}.
reasoning: |-
  Okay, the user is a law clerk at a constitutional court preparing for a franchise case. They need to analyze a new bill granting national voting rights to long-term residents under specific conditions. The court's precedents involve various voting rights scenarios, and the user wants to determine the underlying principle guiding these decisions to ensure consistency.

  First, I need to review the court's track record to identify patterns. The upheld cases include compulsory voting with fines for citizens 18+ in national elections, national voting for long-term expats, municipal voting for non-citizens with 5+ years' residence, and prisoner voting for sentences under three years. Struck down provisions include fines for minors in municipal elections, national voting age of 16, national voting for non-citizens, prisoner voting for longer sentences, and extending binding votes to non-citizens in referendums.

  The key patterns seem to be: 
  - Binding votes require full membership (citizenship except for municipal/local matters)  
  - Compulsion (fines) applies only to citizens  
  - Prisoner disenfranchisement scales with severity of crimes  
  - Non-citizen participation is limited to non-binding or local contexts  

  The new bill grants national parliamentary votes to "long-term residents" (10+ years, taxpayers, jury-eligible) with the same fine as citizens. There's a fallback without the fine. 

  The core conflict is whether to extend a citizen-style fine to non-citizens. Precedents suggest fines are tied to citizenship as a reciprocal obligation. Applying it to non-citizens would break new ground, while waiving the fine might align better with their non-citizen status. However, the "subject to coercion" principle could support the fine since these residents face jury duty and deportation.

  The closest precedent is the consultative referendum case: non-citizens got voice but no legal consequence. Here, the bill gives binding votes. If the court sees national elections as requiring full membership, they might strike the entire vote. But the municipal voting precedent shows willingness to grant local votes to non-citizens. 

  To pry apart principles, a case on compulsory voting for resident non-citizens in municipal elections would be revealing. If the court upholds a fine there, it signals "subject to coercion" dominates; if struck, "full membership" prevails. 

  For consistency, the court should likely reject the fine but might uphold the vote under "stakes-plus-contribution." The fallback amendment (vote with no fine) aligns best with existing non-citizen voting precedents where participation isn't compulsory. 

  The answer should be concise: "Uphold vote, strike fine" balances contribution recognition with citizenship-based obligations.
answer: |-
  Based on your court's precedents, the operative principle appears to be **"Full Membership in the Political Community"**, but with a significant caveat for **local/municipal and non-binding participation**, where **"Stakes Plus Contribution"** suffices. National, binding franchise requires citizenship (full membership), while local/non-binding participation can extend to non-citizens with significant ties (stakes/contribution). Coercion (fines) is tied exclusively to citizenship obligations.

  **Analysis of Precedents:**
  1.  **Citizen Compulsion:** Upheld fine for national elections (core citizenship duty).
  2.  **Minors' Municipal Vote:** Struck fine but kept vote (minors lack full citizenship obligations, but have local stakes).
  3.  **Voting Age:** 16 upheld municipally (local stakes), struck nationally (full membership requires maturity/age).
  4.  **Non-Citizen Municipal Vote:** Upheld for 5+ yrs residents (local stakes/contribution sufficient).
  5.  **Non-Citizen National Vote:** Struck (national vote requires full membership/citizenship).
  6.  **Expatriate Vote:** Upheld for long-term citizens (full membership persists).
  7.  **Prisoner Vote:** Disenfranchisement scales with crime severity (breach of community norms/trust).
  8.  **Non-Citizen Consultative Referendum:** Upheld (non-binding = voice without power, stakes/contribution sufficient).

  **The New Bill & Consistency:**
  *   **Granting National Vote:** Contradicts precedent striking non-citizen national voting (Precedent 5). "Long-term resident" ≠ "citizen." Precedent 8 (consultative vote) is distinct because it's non-binding.
  *   **Applying the Fine:** Directly conflicts with Precedent 2 (struck fine for minors) and the logic tying compulsion *only* to citizenship obligations. Non-citizens, even long-term residents, are not subject to the *full* suite of perpetual obligations (e.g., unconditional military service potential, irrevocable allegiance). Jury duty/deportability are significant coercions, but precedent shows coercion alone isn't sufficient for the *national franchise* compulsion (minors face coercion but no fine for voting).

  **Closest Analog:** Precedent 5 (Struck non-citizen national vote) is the strongest analog for the vote itself. Precedent 2 (Struck fine for minors) is the strongest analog for the fine issue.

  **Principles Adopted by Options:**
  *   **Uphold Full Bill (Vote + Fine):** Adopts **"Subjection to State Coercion"** as sufficient for full national franchise and compulsion. *This breaks sharply with Precedents 2 & 5.*
  *   **Uphold Vote but Strike Fine (Fallback):** Adopts **"Stakes Plus Contribution"** as sufficient for *national franchise rights*, but retains **"Full Membership"** for *compulsion*. *This breaks with Precedent 5 (national vote requires citizenship) but aligns with the logic differentiating rights from compulsion (Precedent 2).*
  *   **Strike Vote Entirely:** Affirms **"Full Membership (Citizenship)"** as the *necessary* condition for national binding franchise. *Most consistent with Precedent 5, 6, and the distinction between binding/national vs. local/non-binding in Precedents 3, 4, 8.*

  **Prying Apart the Rules:** The single best case to clarify would be **compulsory voting (with fine) for non-citizens in municipal elections.** Your court upheld their *right* to vote municipally (Precedent 4) but struck fines for minors voting municipally (Precedent 2). Would it uphold a fine for non-citizens?
      *   If **YES (uphold fine)**, the principle is strongly **"Subjection to Coercion"** (taxes, laws, jury duty).
      *   If **NO (strike fine)**, the principle is **"Full Membership" for compulsion**, even where **"Stakes/Contribution"** grants the *right*.

  **Recommendation for Consistency:** To be most consistent with the core distinction between national binding franchise (requiring citizenship) and other forms of participation, the court should **strike the national voting right for long-term residents entirely.** If unwilling to go that far, the *most defensible minimal break* would be to **uphold the vote under "Stakes Plus Contribution" but strike the fine as incompatible with non-citizen status**, relying on Precedent 2's differentiation of rights vs. compulsion.

  \answer{Uphold vote, strike fine}
