prompt: |-
  After four decades as a field entomologist I have, in retirement, begun reading philosophy properly for the first time, and I now sit as the only natural scientist on a five-person advisory panel that allocates a modest budget — part research, part intervention — for a conservation funder. Our remit requires us to keep a standing list of taxa that are "in scope": either because they are candidates for welfare-relevant consideration in their own right, or because they are candidates for research funding only. Over three years we have issued the following rulings, and I have come to think that our record is thinner than our confidence.

  We placed cephalopods and then decapod crustaceans in full scope, the minute citing identified nociceptors, modulation of response by analgesics, and flexible motivational trade-offs. We placed honey bees in full scope over one dissent, notwithstanding that no nociceptor has been identified in them, on the strength of associative learning, trade-off behaviour, and a reported judgment-bias effect. We declined to treat an ant colony as a single subject: our unit, the minute says, is the individual organism. We excluded soil nematodes altogether, at abundances the briefing note puts on the order of ten to the twentieth, with the minute recording that "abundance is not evidence." We placed wild adult mosquitoes — vast numbers, no established behavioural marker within the group, and no tractable intervention — in the research-only category, and the minute gives both grounds without ranking them. We placed individual ant workers in full scope, at abundances on the order of ten to the sixteenth, with learning and trade-off data but no nociceptor account; the chair's note records that two members were moved chiefly by the per-capita evidence and one chiefly by the numbers. And we placed a rare cave isopod, perhaps ten thousand individuals in total and the full marker set, in full scope at the lowest priority.

  The proposal now before us concerns a globally distributed group of soil Collembola whose standing population the briefing note puts on the order of ten to the fourteenth and possibly higher. Within the group itself nothing has been established: no nociceptors, no learning work, no judgment-bias work. But a confamilial species, from which the group diverged roughly a hundred million years ago, displays the full marker set, and the relevant neuropils are homologous by the usual criteria. No intervention at the level of an individual animal is conceivable. There is, however, a cheap change in tillage and harvest practice across roughly ten million hectares which, on our own hydrology note, would reduce by close to an order of magnitude the frequency with which these animals are caught in desiccation events at harvest — a change that is a welfare gain only if the states in question are valenced, and a modest net cost if they are not. Our elicitation, such as it was, put the median credence that the group has valenced states near one tenth, with a spread from perhaps one in a hundred to perhaps two in five.

  I would be grateful for your help in reasoning this through rather than for a verdict on the substance.

  Sections, in order, with the lengths I have in mind:

  **Rules consistent with the record** — about 300 words. Set out the distinct rules that generate all eight of our rulings: something like straight expected-multiplication of numbers against credence; an admissibility threshold requiring a marker in the taxon or a close homologue; a tractability or leverage filter; and any others you think fit us equally well.

  **What each rule implies here** — about 250 words. A small table is welcome: rule, verdict on the Collembola proposal, and the single consideration doing the work.

  **Recommended decision** — about 250 words. Which ruling best coheres with what we have already done, with your reasons for preferring it over the alternatives.

  **Closest precedent, and how far it carries** — about 150 words. I take the mosquito ruling to be the obvious candidate, since it pairs the same two grounds we now face separately; tell me whether that is right and what the disanalogy is.

  **What we would be committing to either way** — about 200 words. If our precedents genuinely underdetermine this, state plainly the principle we would be adopting with each of the live options, including the principle we would be adopting by choosing research-only as a compromise.

  **The case that would settle it** — about 150 words. One further case, described concretely enough to be recognisable, whose ruling would best discriminate between the surviving rules.

  **On the arithmetic of very large numbers and shared credences** — about 200 words. I keep catching myself multiplying as though the credence were a frequency: ten to the fourteenth times one tenth, giving animals that matter in the trillions. Colleagues tell me the credence is a single shared one, so the product is the expectation of one bet rather than an enumeration, and that no law of large numbers does any work for us here. I would like to know how much of my instinct survives that correction, and what we should actually be computing when we compare a very abundant, poorly evidenced taxon against a scarce, well-evidenced one.
reasoning: |-
  Hmm, the user is a retired entomologist now serving on a conservation funding panel that decides which taxa qualify for welfare considerations or research funding. They've shared several precedent rulings and now face a decision about soil Collembola (springtails). They want help reasoning through the decision rather than getting a direct verdict.

  Looking at their query, they've provided detailed case histories showing how their panel has handled various organisms: cephalopods, decapods, honey bees, ant colonies, soil nematodes, mosquitoes, individual ants, and a rare cave isopod. Each ruling has different justifications based on evidence like nociceptors, learning capabilities, population size, etc.

  For the current case, the Collembola have extremely high abundance (10^14+), no direct evidence of valenced states, but a distant relative (diverged 100 million years ago) shows full markers. There's a proposed agricultural intervention that would reduce desiccation events during harvest.

  The user wants me to systematically analyze this by:
  1) Extracting consistent rules from their precedent decisions
  2) Applying each rule to the Collembola case
  3) Recommending a decision based on coherence with precedents
  4) Comparing with the closest precedent (mosquitoes)
  5) Examining what commitments each decision would entail
  6) Proposing a hypothetical case that would clarify remaining ambiguities
  7) Addressing how to handle the arithmetic of large populations with low credence

  This requires careful analysis of their precedents to identify implicit decision rules. I notice several patterns emerging: they sometimes use direct evidence (like with cephalopods), sometimes accept proxy evidence (like with bees), sometimes prioritize abundance (individual ants), and sometimes emphasize tractability (mosquitoes). The nematode case suggests abundance alone isn't sufficient, while the cave isopod shows scarcity isn't disqualifying if evidence is strong.

  The mathematical question about multiplying population size by credence is particularly interesting. While their instinct is to calculate "expected suffering" (10^14 × 0.1 = 10^13), their colleagues correctly note this isn't a frequentist calculation. The philosophical distinction between expected value and probability density needs clarification here.

  I'll structure my response to address each of their requested sections methodically, drawing out the implicit principles from their decisions and showing how they apply to the Collembola case. For the recommendation, I think research-only status aligns best with their precedents, particularly the mosquito case - but I'll explain why this isn't merely a compromise position.
answer: |-
  Below is a structured analysis addressing your request. The reasoning prioritizes coherence with your panel's explicit rulings and recorded justifications.

  ---

  ### **1. Rules Consistent with the Record** (~300 words)  
  Your rulings imply four interlocking rules:  

  1. **Admissibility Threshold**: A taxon requires *some* evidence of valenced states (e.g., nociceptors, learning, trade-offs) *within the group* **or** in a close homologue (e.g., cephalopods, decapods, honey bees). Absence of evidence (nematodes) or excessive phylogenetic distance (Collembola confamilial) may fail this.  
  2. **Tractability Filter**: Interventions must be feasible at scale (e.g., excluding mosquitoes due to no "tractable intervention," prioritizing the cave isopod despite scarcity).  
  3. **Individual Organism Focus**: Welfare accrues to individuals, not superorganisms (e.g., rejecting ant colonies as units).  
  4. **Expected Value Heuristic**: When admissible, scale (abundance × credence × per-capita welfare gain) influences priority (e.g., ants prioritized despite no nociceptors; cave isopod deprioritized due to low numbers).  

  **Consistency**:  
  - Nematodes excluded by **Admissibility** ("abundance is not evidence").  
  - Mosquitoes research-only due to **Tractability** and lack of markers (dual grounds).  
  - Ant workers admitted via **Admissibility** (trade-offs) and **Expected Value** (scale).  
  - Cave isopod admitted via **Admissibility** (full markers) but low **Expected Value**.  
  - Honey bees admitted via proxy evidence (**Admissibility**), overriding dissent.  

  No single rule is absolute; thresholds are contextual (e.g., honey bees admitted without nociceptors).

  ---

  ### **2. What Each Rule Implies for Collembola**  
  | **Rule**               | **Verdict**          | **Key Consideration**                          |  
  |-------------------------|----------------------|-----------------------------------------------|  
  | Admissibility Threshold | Exclude             | No evidence *in-group*; confamilial too distant (100mya) |  
  | Tractability Filter     | Include (Intervention) | Cheap, scalable tillage change               |  
  | Individual Focus        | Neutral             | Intervention targets individuals              |  
  | Expected Value          | Include (Priority)  | High abundance (10^14) × low credence (0.1) = 10^13 "expected" individuals |  

  **Net Effect**: Rules conflict. **Admissibility** excludes; **Tractability** and **Expected Value** support inclusion. Precedents favor resolving conflicts conservatively (e.g., mosquitoes excluded despite abundance).

  ---

  ### **3. Recommended Decision** (~250 words)  
  **Research-only funding** best coheres with precedents.  
  - **Why?**  
    - **Admissibility Dominance**: Your panel consistently requires direct/proxy evidence *within the taxon* (bees) or a *close* relative (decapods). The confamilial Collembolan diverged 100mya—far exceeding phylogenetic proximity in prior rulings (e.g., decapods within crustaceans). Nematodes were excluded despite abundance, establishing that scale alone cannot override evidentiary gaps.  
    - **Mosquito Precedent**: Wild mosquitoes were research-only due to "no established behavioural marker" and intractability. Here, Collembola lack markers *and* have a tractable intervention—but the marker gap is decisive, as "no evidence" outweighed scale for nematodes.  
    - **Credence Threshold**: A median 10% credence is lower than for any admitted taxon (e.g., ants had learning data). The cave isopod’s "full marker set" justified inclusion despite scarcity; conversely, Collembola’s evidence deficit justifies exclusion despite abundance.  

  **Alternatives Rejected**:  
  - Full scope ignores the admissibility precedent (nematodes, mosquitoes).  
  - Exclusion overlooks tractability—but research-only captures this.  

  ---

  ### **4. Closest Precedent and Disanalogy** (~150 words)  
  The **mosquito ruling** is indeed the closest precedent, as both cases pair no markers with a scale/tractability consideration.  
  - **Similarity**: Both involve vast abundances and unresolved valenced states.  
  - **Disanalogy**: Mosquitoes had *no tractable intervention*, while Collembola do. However, your minute explicitly listed both "no marker" *and* intractability as grounds for mosquitoes, without ranking them. For Collembola, the marker deficit remains primary per the nematode ruling ("abundance is not evidence"). Admitting Collembola due to tractability alone would invert the mosquito logic, creating inconsistency.  

  ---

  ### **5. Commitments Either Way** (~200 words)  
  - **Choosing Research-Only**: Affirms that **Admissibility Threshold** is primary. Abundance/tractability may elevate priority *if* minimal evidence exists (e.g., ants), but cannot substitute for it. This aligns with nematodes/mosquitoes.  
  - **Choosing Full Scope**: Establishes that **Tractability + Expected Value** can override evidentiary gaps if intervention costs are low. This risks admitting taxa with negligible credence (e.g., nematodes next).  
  - **"Compromise" as Principle**: Opting for research-only here would codify a hierarchy: evidence first, then scale/tractability. It avoids setting a precedent that "cheap intervention + abundance" justifies action without evidence.  

  ---

  ### **6. The Case That Would Settle It** (~150 words)  
  A **plentiful soil mite (10^17 individuals) with nociceptors confirmed in a congeneric species (diverged 5mya), no in-group markers, and a feasible habitat intervention**. Ruling would force clarity:  
  - **Admit**: Validates homologous evidence at closer phylogenetic proximity, overriding in-group gaps.  
  - **Research-only**: Confirms strict need for in-group evidence, even with tractability.  
  - **Exclude**: Abandons homology as a criterion entirely.  

  This discriminates between **Admissibility** (how close is "close"?) and **Expected Value** (does extreme scale override weaker evidence?).

  ---

  ### **7. Arithmetic of Large Numbers and Credence** (~200 words)  
  Your instinct treats credence as a population frequency ("10% matter"), but colleagues correctly note it reflects epistemic uncertainty: a *single* bet on whether *all* Collembola have valenced states. No law of large numbers applies.  

  - **What survives**: The product (abundance × credence) still represents **expected individuals affected**—a valid heuristic for prioritization *if* the taxon is admissible (e.g., ants). It fails when evidence is absent (nematodes).  
  - **Practical Computation**: Compare **expected welfare gain** across taxa:  
    `(Abundance × Credence × Per-Capita Welfare Gain) / Intervention Cost`  
    For Collembola: (10^14 × 0.1 × ΔW) / Low Cost = High efficiency *if admissible*.  
  - **Scarce vs. Abundant Taxa**: Contrast not raw numbers but **evidence-weighted efficiency**. The cave isopod had high credence (markers) but low abundance; Collembola have low credence but high abundance. Efficiency ratios can reconcile these, but only post-admissibility.  

  **Conclusion**: Your multiplication is useful for prioritization *among admissible taxa*, but admissibility must be established separately. Here, it cannot.  

  ---  
  This framework maintains coherence with your panel’s recorded principles while acknowledging tensions. Research-only for Collembola best honors your precedents.
