answer: |-
  Below is a practical decision procedure designed for your flood forecasting duty desk. It's based on your available tools (two ensemble models, yesterday's verification, and quick "nudge tests"), and it sorts uncertainty into four actionable buckets: **observational uncertainty** (shrinks with better initial data), **sensitive dependence** (regrows due to chaos, regardless of initial data quality), **model uncertainty** (wrong model structure), and **decision-irrelevant uncertainty** (wide spread, but all outcomes require the same action). The procedure prioritizes speed, using only arithmetic and products you already have. It also flags when to stop (no action) or escalate to a human for value judgments.

  ---

  ### **Decision Procedure: Key Questions in Order**
  **For each forecast (lead time, location, event threshold) and decision (e.g., close road, warn town):**

  1. **Is the uncertainty decision-irrelevant?**  
     - **Check:** Look at the full range (min to max) of all ensemble members (from both models) for the key variable (e.g., river level) at your decision threshold.  
     - **Signature:** All members are either *all below* or *all above* the action threshold.  
     - **Action:**  
       - If **all below**: No action. Note: "Models consistently show no risk of [event]."  
       - If **all above**: Act immediately. Note: "All guidance indicates [event] will occur; [action] recommended."  
       - *Stop here* if true. If the spread *straddles the threshold*, proceed to Question 2.

  2. **Is the uncertainty dominated by model error?**  
     - **Check:** Compare the two models and their internal consistency.  
       - Calculate the difference between the two models' ensemble means: `|Mean_model1 - Mean_model2|`.  
       - Calculate the average spread (standard deviation) of each model: `Avg_spread = (SD_model1 + SD_model2)/2`.  
       - Check yesterday's error: `|Yesterday's ensemble mean forecast - Observed|`.  
     - **Signature:**  
       - `|Mean_model1 - Mean_model2| > 1.5 × Avg_spread` (models disagree more than they agree internally).  
       - *Or* `Yesterday's error > 2 × Yesterday's ensemble spread` (underdispersive ensemble, suggesting missing uncertainty).  
     - **Action:**  
       - Escalate to duty manager. Note: "Substantial disagreement between models or consistent under-prediction of uncertainty. Risk of structural model error."  
       - Default: Use the more conservative model or worst-case scenario.  
       - *Proceed to Question 3* if signatures are absent (to rule out chaos/observational uncertainty).

  3. **Is the uncertainty due to sensitive dependence (chaos) or observational limits?**  
     - **Check:** Growth of spread with lead time and the "nudge test" (if time allows).  
       - **Spread growth:** Calculate the spread (SD) at lead time T and at T/2 (e.g., for 48h, use 24h spread). Compute `Spread_growth_ratio = SD_T / SD_{T/2}`.  
       - **Nudge test:** Perturb a key input (e.g., initial rainfall or soil moisture) by typical observation error (e.g., 10–20%), rerun a single ensemble member, and see if the decision flips (e.g., overtop/no overtop).  
       - **Yesterday's spread vs. error:** `Yesterday's error ≤ Yesterday's spread` (well-calibrated ensemble).  
     - **Signature:**  
       - **Sensitive dependence (chaos):** `Spread_growth_ratio > 1.8` (approximates exponential growth) *and* `Nudge test causes decision flip` *and* `Yesterday's error ≤ Yesterday's spread`.  
       - **Observational uncertainty:** `Spread_growth_ratio ≤ 1.8` *or* `Nudge test does not flip decision` *or* `Yesterday's error > Yesterday's spread` (poor calibration).  
     - **Action:**  
       - **Sensitive dependence:** Trust the ensemble spread. Compute probability of exceeding threshold (e.g., % of members above levee height). Note: "Chaotic uncertainty limits predictability. Probability of [event] is X%."  
       - **Observational uncertainty:** Flag for rapid updates. Note: "Uncertainty may reduce with new data. Monitoring closely."  
       - *Escalate to human* if probability is 20–80% (value judgment on risk tolerance).

  4. **Final decision gate (if not resolved earlier):**  
     - **Human escalation needed when:**  
       - Probability of event (from ensemble) is ambiguous (20–80%) *or* costs are high (e.g., evacuations).  
       - Uncertainty bucket is unclear (e.g., mixed signatures).  
     - **Stop and do nothing if:**  
       - No decision-relevant uncertainty (Q1) *or* probability of event < 10% *and* action has high cost.  
     - **Act if:**  
       - Probability of event > 60% *or* model uncertainty suggests high risk (Q2).

  ---

  ### **Applied to Your Three Cases**
  **Case 1: 48h levee overtop (small town)**  
  - **Q1:** Spread straddles threshold → not decision-irrelevant.  
  - **Q2:** Models agree on rainfall → no model error signature.  
  - **Q3:**  
    - `Spread_growth_ratio` (e.g., SD_48h / SD_24h): If >1.8 (e.g., 2.5), suggests chaos.  
    - **Nudge test:** Perturb soil moisture by 15%. If overtop decision flips (yes→no or no→yes), confirms sensitive dependence.  
    - Yesterday's spread vs. error: Assume well-calibrated.  
  - **Uncertainty bucket:** Sensitive dependence (chaos).  
  - **Action:** Compute probability (e.g., 50% of members show overtop). Since probability is ~50% and action (warn town) is high-cost, escalate to duty manager. Bulletin: "Chaotic uncertainty: 50% chance of levee overtopping. Recommend warning due to high impact."  

  **Case 2: Three-month "wetter than average" outlook**  
  - **Q1:** Spread usually straddles "average" threshold → not decision-irrelevant.  
  - **Q2:**  
    - Models often disagree (`|Mean1 - Mean2| > 1.5 × Avg_spread`).  
    - Yesterday's error > 2× spread (seasonal ensembles are historically underdispersive).  
  - **Q3:** Spread growth ratio is low (seasonal spread doesn't grow exponentially).  
  - **Uncertainty bucket:** Model uncertainty dominates (low skill).  
  - **Action:** Stop issuing as a "forecast." Use climatology-based ranges instead. Bulletin: "Model guidance suggests a 60% chance of wetter conditions, but low historical accuracy limits confidence. Use as one input among many." Escalate to policymakers to redefine the product.  

  **Case 3: Six-hour road closure (floods 4x/year)**  
  - **Q1:** All ensemble members show river level below closure threshold → decision-irrelevant.  
  - **Action:** No closure. Bulletin: "All models agree: no flooding risk at [location]." Stop.  

  ---

  ### **What the Procedure Can't Do (and How to Adapt)**  
  1. **Black swans (e.g., levee breach):**  
     - Fails if the event is outside model physics (e.g., structural failure).  
     - **Mitigation:** Add a pre-defined rule: "If forecasted water level > 90% of levee height, inspect infrastructure regardless of spread."  

  2. **Non-stationary systems (e.g., new urban development):**  
     - Past error stats become useless if catchment changes.  
     - **Mitigation:** Flag catchments with recent changes. Bulletin: "Model uncertainty increased due to land-use changes. Use with caution."  

  3. **Extreme events beyond historical data:**  
     - Ensembles may underrepresent tail risks (e.g., 100-year flood).  
     - **Mitigation:** Escalate any forecast >95th percentile to human.  

  4. **Value judgments (e.g., risk tolerance):**  
     - The procedure identifies "gray zones" (20–80% probability) but can't decide trade-offs (e.g., cost vs. safety).  
     - **Always escalate to duty manager** for high-stakes decisions.  

  ---

  ### **Bulletin Wording by Bucket**  
  - **Decision-irrelevant:** "All model guidance agrees: [event] will [occur/not occur]. [Action/no action]."  
  - **Model uncertainty:** "High model disagreement reduces confidence. Worst-case scenario: [X]. Recommended action: [Y]."  
  - **Sensitive dependence (chaos):** "Inherent unpredictability beyond [X] days. Probability of [event]: [Y]%."  
  - **Observational uncertainty:** "Uncertainty may reduce with new data. Current best estimate: [X]. Monitoring closely."  
  - **Low-skill contexts (e.g., seasonal):** "Forecast skill is limited. Use as low-weight input only."  

  This procedure is defensible, uses your existing workflow, and avoids philosophy. Test it for a week and adjust thresholds (e.g., spread growth ratio) based on your local data.
