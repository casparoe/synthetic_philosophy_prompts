prompt: |-
  I teach a final-year option here at Marchmont on interpretation and authority, and a good deal of the term is spent on the textualism-versus-purposivism dispute as it is conducted about statutes: what it even means to take the words on their own, whether a collective body can have an intention worth calling one, how a purpose can be described at different levels of generality so that almost any text can be made to serve almost any outcome. What prompts me to write is that I now have to decide one of these questions myself. I sit on the Standing Committee on Outside Professional Activities as the Senate's academic member, and we have a case to rule on at the end of the month.

  Ordinance 31 provides that no member of the academic staff shall, without the prior consent of the Committee, receive any remuneration in connection with the teaching of any person who is a registered student of the University. It was introduced in 1937 after a scandal about private coaching colleges that sold candidates preparation for Marchmont's own examinations, and the Council minutes of the day speak of stopping staff from profiting by teaching their own students towards their own papers. The case concerns a colleague in Economics who built, in his own time and largely at his own expense, a short online course in statistics for managers, open to anyone at a fee; of some four thousand people who have enrolled, eleven happen to be registered students of Marchmont, none of them in his department and none of them reading anything the course touches. He declared it on his annual return, and the Committee's administrator told him by email that it fell outside the Ordinance. An anonymous complaint has now arrived, and we must rule. Three things divide us. First, the words, taken on their own and with no purpose in view, are plainly satisfied: he took money for teaching people who are registered students — and the same reading would seem to catch the royalties several colleagues draw from textbooks bought by our own students, which nobody believes the Ordinance is about. Second, the Council debated an amendment in 1971 that would have confined the Ordinance to teaching in preparation for any examination of the University; it was defeated by fourteen votes to eleven, and we cannot agree whether that shows the Council deliberately chose the wider words or shows nothing much at all. Third, over dinner after our last meeting two of us who wanted the same outcome disagreed completely about the reason: one held that the 1937 words should be read as having the applications they would then have been expected to have, the other that they should be read as speaking to circumstances the drafters could not have envisaged; and a third of us doubted whether that choice is a question about what the Ordinance means at all, as opposed to a question about what an administrative body like ours ought to be doing. Several members also think that whatever we write will be treated by the administrator as binding guidance in future cases, and that this is a reason to say as little as the case requires; I am not persuaded.

  I have to circulate a draft decision paper before the meeting. Please work as someone who has both drafted institutional regulations and taught the philosophy of law at a high level, and think carefully rather than quickly: before you begin drafting, spend a little time listing the readings of the Ordinance that are genuinely available and, for each, what else it would drag in — textbooks, open courses, paid external examining, and so on — and only then commit to one. The paper should be something the Committee could actually vote on, not a survey of the jurisprudence: it should state a concrete course of action with a time frame, it should say plainly whether the Ordinance was breached and what is to follow from that, and it should set out the strongest available argument for the reading it does not adopt, since that is the argument I expect to be pressed hardest in the room. Please do not cite cases, statutes or scholarly works — I have all of that to hand, and what I need from you is the reasoning rather than the references. Use British English throughout, and organise the paper under the following headings, in this order: "Recommendation" (around 150 words, leading with the bottom line and any dates); "The readings available, and what else each of them catches" (around 300 words); "Why I recommend the reading I do" (around 300 words); "The strongest argument for the other reading" (around 250 words); "How much, if anything, this decides for future cases" (around 150 words); and finally "How confident I am, and the point I am least sure of" (around 120 words), in which you should say how confident you are in the recommendation overall and identify the single step in the argument you would most expect a good objector to go for.
reasoning: |-
  Okay, this is a fascinating and complex request from an academic deeply immersed in interpretive theory, now facing a real-world application. The professor sits on a committee dealing with a statute interpretation dilemma that mirrors the textualism-versus-purposivism debates taught in class. 

  First, I need to grasp the core tension: the plain text of Ordinance 31 seems to cover the economics professor's online course (since 11 paying students are registered at Marchmont), but applying it this broadly would lead to absurdities like banning textbook royalties. The historical context shows it was aimed at stopping staff from profiting off coaching for university exams, not general teaching. 

  The committee's divisions are telling: some focus on the defeated 1971 amendment (does its rejection affirm the broad wording?), others debate temporal interpretation (original expected applications vs. contemporary circumstances), and some question whether this is even about meaning or about administrative policy. Plus there's operational anxiety about setting precedents.

  I'll approach this methodically as requested. For the readings analysis:
  - Literal reading: catches everything - the course, textbooks, even paid external examining if students are involved. Overly broad but textually irrefutable.
  - Original purpose reading: confined to exam-focused coaching (the 1937 scandal context). Excludes the statistics course since it's unrelated to Marchmont exams or curricula.
  - Defeated amendment inference: tricky - rejecting the 1971 narrowing could imply endorsement of breadth, but equally could mean Council disliked that specific phrasing rather than the principle.

  The purposive approach seems most defensible here. It aligns with legislative intent without producing absurd outcomes, and the administrator's initial assessment suggests institutional practice leans this way. Still, I must acknowledge the textualist counter: words mean what they say, and Council had opportunity to narrow them but didn't.

  For the recommendation structure: 
  Clear breach/no breach conclusion upfront, then layered reasoning. Crucial to emphasize that this case doesn't bind future interpretations - each must be assessed on its facts. My deepest uncertainty lies in weighing the defeated amendment's significance; textualists will pounce there.

  The draft must balance academic precision with adjudicative clarity, avoiding theoretical jargon while honoring the interpretive complexities the committee grapples with. Time to distill this into the requested format.
answer: |-
  ## Draft Decision Paper: Standing Committee on Outside Professional Activities  
  **Case:** Professor of Economics (Online Course Remuneration)  
  **Date Circulated:** [Insert Date]  
  **Meeting Date:** [End of Month]  

  ---

  ### RECOMMENDATION (149 words)  
  **The Committee finds no breach of Ordinance 31.** Professor [Name]’s online statistics course does not require prior consent under the Ordinance. No further action is warranted, and the anonymous complaint is dismissed. The administrator shall inform the Professor and complainant of this decision by [5 working days after meeting].  

  This outcome rests on interpreting the Ordinance as applying only to teaching activities *connected to a student’s studies at Marchmont University*. The course here was general, open to the public, and unrelated to any Marchmont programme or examination. While eleven registered students enrolled, their status as students was incidental; the course was not designed *for them as Marchmont students*. This reading avoids absurd outcomes (e.g., capturing textbook royalties) and aligns with the Ordinance’s core purpose.  

  ---

  ### THE READINGS AVAILABLE, AND WHAT ELSE EACH OF THEM CATCHES (298 words)  
  Two principal readings emerge:  

  1.  **Literal Reading:** "Remuneration in connection with the teaching of any person who is a registered student" is satisfied if payment is received for teaching a registered student, regardless of context.  
      *   **Catches:**  
          *   This case (payment from 11 students).  
          *   Royalties from textbooks purchased by Marchmont students for their courses.  
          *   Paid external examining of Marchmont students (if the examiner is also staff).  
          *   Paid one-to-one tutoring of Marchmont students in *any* subject, even unrelated to their degree (e.g., music lessons).  
          *   Paid workshops/seminars open to the public but attended by Marchmont students.  

  2.  **Purpose-Limited Reading:** The Ordinance applies only to teaching activities *exploiting the staff-student relationship within the University context*, specifically teaching connected to the student’s studies, preparation for Marchmont examinations, or leveraging the staff member’s institutional role.  
      *   **Catches:**  
          *   Running a private "crammer" college for Marchmont exams.  
          *   Paid revision sessions specifically for the staff member’s own course students.  
          *   Private tutoring of a student *in the subject the staff member teaches them at Marchmont*.  
      *   **Excludes:**  
          *   This case (general public course, unrelated content).  
          *   Textbooks purchased for courses.  
          *   External examining (remuneration for role, not direct teaching *of* the student).  
          *   Tutoring/teaching wholly unrelated to the student's Marchmont studies (e.g., teaching a Physics student to play chess for payment).  
          *   Public courses/seminars where student enrolment is incidental.  

  The 1971 amendment debate is ambiguous: rejecting "teaching in preparation for any examination" could indicate a deliberate choice for breadth *or* dissatisfaction with the specific limitation proposed.  

  ---

  ### WHY I RECOMMEND THE READING I DO (297 words)  
  I recommend the **Purpose-Limited Reading** for three compelling reasons, prioritising coherence and avoiding absurdity:  

  1.  **Avoiding Absurdity and Overreach:** The literal reading produces patently unintended and unworkable results. Capturing textbook royalties – a common, accepted practice never previously challenged under this Ordinance – demonstrates its overbreadth. Similarly, catching any paid interaction with a student (e.g., unrelated private tutoring) would be administratively burdensome and stifle legitimate external engagement without serving the Ordinance’s core aim. An interpretation that renders commonplace, benign activities violations is untenable.  

  2.  **Alignment with Original Purpose:** The 1937 context is clear: the target was staff profiting by *teaching their own students towards their own papers*. The mischief was the exploitation of the staff member’s institutional position and access to the specific examination system for private gain, creating conflicts of interest and potential unfair advantage. The purpose was not to regulate all conceivable paid teaching interactions with students. This case – a general public course on unrelated content, built independently – falls entirely outside this mischief.  

  3.  **Coherence with Institutional Practice and Administrator’s Initial View:** The administrator’s original assessment that the course fell outside the Ordinance reflects a longstanding, practical understanding aligning with the purpose-limited reading. This consistency avoids arbitrary application and provides clearer guidance for staff navigating their obligations. The 1971 vote does not conclusively override this purpose; it may simply reflect caution about defining the scope too narrowly *at that time*, rather than endorsing maximal breadth.  

  ---

  ### THE STRONGEST ARGUMENT FOR THE OTHER READING (248 words)  
  The strongest argument for the **Literal Reading** rests firmly on **textual integrity and legislative choice**:  

  The words of Ordinance 31 are unequivocal: "any remuneration in connection with the teaching of any person who is a registered student." Professor [Name] received payment for teaching registered students. This is factually indisputable. The Ordinance contains no explicit exemptions for the nature of the teaching, its relation to University studies, or the number of students involved. To imply such limitations is to rewrite the regulation, usurping the legislative role of Council.  

  The 1971 debate significantly bolsters this view. Council explicitly considered narrowing the scope to "teaching in preparation for any examination" and *rejected* that limitation by a recorded vote (14-11). This demonstrates a deliberate legislative choice to maintain the broader prohibition. Disregarding this clear historical signal of legislative intent regarding scope undermines respect for Council’s authority and the evolution of its statutes. If Council wished to exempt general courses or textbooks, it has had ample opportunity to amend the Ordinance since 1937, particularly after 1971. It has not done so. The Committee must apply the words Council chose, not the words it might have chosen or that the Committee believes it should have chosen. The potential breadth is a matter for Council to address, not this Committee.  

  ---

  ### HOW MUCH, IF ANYTHING, THIS DECIDES FOR FUTURE CASES (148 words)  
  This decision **provides guidance but does not rigidly bind future cases.**  

  It clarifies that the Ordinance is not triggered *merely* because a registered student happens to be taught for remuneration in a context wholly disconnected from their University studies or the staff member’s institutional role. Factors such as the nature of the teaching (specific/general), its relation to Marchmont programmes/exams, the student’s reason for enrolment, and the staff member’s use of their position will be critical in future assessments.  

  The administrator should treat this as indicative of the *type of analysis* required – focusing on the connection to the student’s University status and the Ordinance’s core purpose – rather than a strict rule exempting all "public" courses or including all "private" tutoring. Each case must be judged on its specific facts within this framework.  

  ---

  ### HOW CONFIDENT I AM, AND THE POINT I AM LEAST SURE OF (118 words)  
  I am **moderately confident** in this recommendation overall. The purpose-limited reading best reconciles the text’s potential breadth with its evident aim and avoids unreasonable outcomes.  

  The point I am **least sure of** is the weight to assign the **1971 amendment rejection**. A good objector will forcefully argue, as above, that this signifies Council’s deliberate endorsement of the broadest literal reading, making any purposive limitation impermissible judicial overreach. While I believe the purpose argument withstands this, the clarity of the vote makes this step vulnerable to a strong textualist challenge focused on respecting legislative history as an expression of intent.
