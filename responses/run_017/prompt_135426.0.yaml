answer: |-
  Here’s the scene snippet, hitting your beats:

  **(Leans into mic, weary smirk)**
  "So I used to lie awake, sweating over *quadrillions* of future souls. Had this giant spreadsheet calculating the expected value of saving a life *today* versus preventing existential risk. Nerd shit. Then I finally quit. Know why?"

  **(Pause, sips cheap beer)**
  "Simulation hypothesis. Right? If we're just code in some grad student's basement project... poof! They get bored, pull the plug tomorrow. All those trillions I was sacrificing for? Never boot up. Vanished. Felt *liberating*. Like quitting a cult where the apocalypse keeps rescheduling."

  **(Leans back, then a flicker of panic)**
  "Except... hang on. *If* we’re sims... there’s likely *multiple runs*, right? Copies of me, right now, choosing whether to donate or buy another beer. And the simulators? They're conscious too, probably. So..."

  **(Eyes widen, voice rising with manic dread)**
  "...my one lazy beer choice gets multiplied across *all* instances! And I impact the simulators' future! The numbers... they're BACK! Oh god. THE SPREADSHEET IS ETERNAL!" *(Stares into middle distance, horrified)*

  **Why it works:**
  *   **Deflates:** Simulation argument cuts future potential ("poof!", "never boot up").
  *   **Re-inflates:** Copies multiply impact ("multiple runs"), simulators add moral weight.
  *   **Joke Structure:** The *realization* is the punchline – his liberation traps him worse. "Oh god. THE SPREADSHEET IS ETERNAL!" is the groaner for longtermists.
  *   **Accessible:** Explains core conflict simply ("sacrificing for trillions," "copies of me," "conscious too"). The emotional arc (liberation -> dread) is universal.
  *   **Groan Factor:** For insiders, it perfectly captures the maddening, unresolvable logic of fanatical utilitarianism where every counter-argument just reshuffles the astronomical stakes.
