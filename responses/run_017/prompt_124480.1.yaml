  ### **Decision Tree: Aggregation and Individual Claims**

  #### **Node 1: Slightly Unequal Stakes**  
  *Choice:*  
  - **Option A:** Save Person X from 100 units of harm (e.g., severe pain).  
  - **Option B:** Save Person Y from 101 units of harm.  
  *Stakes:* 1 person vs. 1 person; harms differ by 1 unit.  

  #### **Node 2: Severe Loss vs. Many Trivial Losses**  
  *Choice:*  
  - **Option A:** Save one person from 100 units of harm.  
  - **Option B:** Save 100 people from 1 unit of harm each.  
  *Stakes:* 1 person (100 harm) vs. 100 people (1 harm each).  

  #### **Node 3: Series Threshold Test**  
  *Choice:*  
  - **Option A:** Save one person from 100 units of harm.  
  - **Option B:** Save 5 people from 25 units of harm each.  
  *Stakes:* 1 person (100 harm) vs. 5 people (25 harm each; total harm = 125).  
  *Note:* This number (5) is calibrated to be borderline; adjust in a series to find individual thresholds.  

  #### **Node 4: Risk Case (Certainty vs. Small Chances)**  
  *Choice:*  
  - **Option A:** Save one person from 100 units of harm for sure.  
  - **Option B:** Give 100 people a 10% chance each to avoid 100 units of harm.  
  *Stakes:* Certain harm prevention (1 person) vs. probabilistic prevention (expected harm prevented: 1,000 units).  

  #### **Node 5: Different Beneficiaries (No Ex Ante Overlap)**  
  *Choice:*  
  - **Option A:** In State 1 (50% likely), save Person A from 100 harm; in State 2 (50% likely), do nothing.  
  - **Option B:** In State 1, do nothing; in State 2, save Person B from 100 harm.  
  *Stakes:* Each person faces a 50% chance of harm, but beneficiaries differ across outcomes.  

  #### **Node 6: Same-Kind Losses, Disparate Scales**  
  *Choice:*  
  - **Option A:** Save one person from 100 units of harm.  
  - **Option B:** Save 10,000 people from 0.01 units of harm each.  
  *Stakes:* Harm is identical in kind (e.g., pain duration); total harm prevented is equal (100 units).  

  #### **Node 7: Priority to the Worse Off?**  
  *Choice:*  
  - **Option A:** Save one person (current harm level: 0) from 100 units of harm.  
  - **Option B:** Save 10 people (current harm level: 100 each) from 10 units of harm each.  
  *Stakes:* 1 person (100 harm prevented) vs. 10 people (10 harm each prevented; total = 100). The "worse off" group starts at higher baseline harm.  

