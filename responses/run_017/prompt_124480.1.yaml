  Below is a diagnostic decision tree designed for a graduate seminar on Scanlon's contractualism and the aggregation problem. The tree uses concrete cases with numerical stakes, requires no prior theoretical knowledge, and sorts respondents into positions based on their choices. Each branch node presents a forced choice between two actions, and the leaves represent named positions (except one) with their most awkward commitment. The tree includes all requested case types and positions, including two novel ones (ceilings on aggregation and procedural pairing).

