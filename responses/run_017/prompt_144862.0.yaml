  5. **Availability of Coin and Pill**: Delegation (iii) and pill-taking (iv) are genuine, available acts. The coin is fair and independent of the dossier; the pill erases the presentiment at negligible cost, inducing a 50% chance of fleeing.  

  6. **Standpoint for Improvement**: From the agent’s ex ante perspective, no act exceeds a 50% survival chance. Delegation and the pill achieve 50%, while staying or fleeing yield 20%.  

