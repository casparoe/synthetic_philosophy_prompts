  #### 4. Closing Section  
  In this assessor’s view, the core stake is **whether rationality permits agents to use self-referential evidence (like the itch) in EU calculations when acts correlate with but do not cause states**. CDT holds that such evidence introduces spurious correlations; EDT holds that ignoring it ignores relevant information. This is substantive: it leads to different acts and survival rates.  

