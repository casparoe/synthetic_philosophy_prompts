  ### Joint Statement: Adversarial Collaboration on Death in Damascus  
  **Causal Decision Theorist (CDT) and Evidential Decision Theorist (EDT)**  

  #### 1. Agreed Claims  
  We, the undersigned causalist and evidentialist, concur on the following non-vacuous claims regarding the enriched Death in Damascus case:  

  1. **Causal Independence of Death’s Location**: Death’s location (Damascus or Aleppo) was fixed by the dossier yesterday. Your act today (stay, go, delegate, or pill) has no *causal* effect on Death’s location. The dossier’s prediction is immutable upon action.  

  2. **Distinction from Newcomb’s Problem**: This is not Newcomb’s problem. In Newcomb’s, pre-commitments (e.g., traits or self-training) can exploit the predictor’s accuracy by correlating acts with desirable states. Here, no such strategy works: the dossier’s 80% accuracy holds *regardless* of your choice, and no pre-commitment alters the prediction. The itch (a 90% reliable presentiment) is evidence about your act, not a manipulable common cause.  

  3. **Act-Conditional Survival Symmetry and Credences**:  
     - Staying or fleeing yields identical *act-conditional* survival chances: 0.2. If you stay, P(survive | stay) = P(Death in Aleppo | stay) = 0.2 (since the dossier predicts correctly with 80% probability if you stay). Similarly, P(survive | flee) = 0.2.  
     - Unconditional credence: Your current credence that Death is in Aleppo is 0.74, derived from the itch (P(flee) = 0.9) and dossier accuracy:  
       \[
       P(\text{Dossier Aleppo}) = P(\text{Dossier Aleppo} \mid \text{flee}) \cdot P(\text{flee}) + P(\text{Dossier Aleppo} \mid \text{stay}) \cdot P(\text{stay}) = (0.8)(0.9) + (0.2)(0.1) = 0.74.
       \]  
       Hence, P(Death in Aleppo) = P(Dossier Aleppo) = 0.74.  

  4. **Long-Run Survival Frequencies**:  
     - **Stay**: 20% survival (in repeated trials, 80% of stayers die as Death is likely in Damascus).  
