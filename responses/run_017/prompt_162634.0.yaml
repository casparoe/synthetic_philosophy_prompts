prompt: |-
  I'm giving a talk next month to our department's biology-and-philosophy reading group on where I've landed about the units of selection, and I'd like an audit of my position before I commit it to slides. My commitments are below, stated in my own terms; parenthetical labels are only pointers.

  The case I keep returning to is a stylized model of my own, not a real organism, so please don't try to place it in the literature: a colonial marine invertebrate that grows as a branching stalk and reproduces by releasing clonal propagules. Two colonies occasionally fuse, yielding a chimeric colony whose propagules contain cells of both genotypes. In that system: (i) a cell-lineage allele D biases its own lineage's contribution to propagule germ tissue; colonies carrying D yield about a third fewer viable propagules, yet D spreads; (ii) chimeric colonies build taller feeding crowns and out-reproduce either pure genotype, so a within-colony conflict and a colony-level productivity effect push in opposite directions; (iii) an allele P suppresses D's over-contribution, at a cost to its bearer within the colony and a benefit to colony output; (iv) colonies vary in how early the germ line is sequestered, and daughter colonies resemble parent colonies in this respect.

  My commitments:

  1. Causal criterion. "X is a unit of selection" is a causal claim: heritable variation in a trait at X's level must be doing causal work in explaining differential reproductive output at that level. Elegance or convenience of description is irrelevant to it.
  2. Reproducer constraint. Following the Griesemer/Godfrey-Smith line, being a unit of selection requires being a reproducer — a Darwinian individual with an integrated life cycle, something like a bottleneck, and reproduction of wholes rather than parts. Genes in a sexual population are replicators, not reproducers, so strictly they are not units of selection, and the gene's-eye view is a bookkeeping device.
  3. Yet I also think the gene's-eye view carries explanatory weight no colony-level description can recover: D's spread is selection for the allele's own transmission and against the colony's output, and I want to say that is a fact about where selection acts, not a decomposition I happen to like.
  4. Equivalence. I accept that the multilevel Price partition and the gene-level contextual (neighbor-modulated) partition always agree on total change, so "genes or groups" is, at first pass, a choice of bookkeeping.
  5. Verdicts on the model. I count (ii) as genuine selection among colonies, (iv) as a colony-level adaptation produced by it, and P's spread as a case in which the colony-level force wins.
  6. Strictness about the label. I don't want to hand out "unit of selection" to every statistical partition; I'm inclined to reserve it for levels at which selection has actually accumulated complex adaptation.

  One further thing I have been told is incoherent: I want to say both that D is being selected even though it lowers colony output and that colonies are being selected for higher output. That seems to me obviously fine, and I'd like to know whether it is.

  Please go through the set and tell me which pairs are genuinely in tension and which only appear to be, ordered by severity rather than listed as equal; for each real tension, say what would have to give and what that revision costs; and then say which single revision would clean up the most. If you think the set is already consistent, tell me which distinction I am missing instead of just reassuring me.
reasoning: |-
  Okay, let's start by understanding the user's position. They're presenting a talk on units of selection to a biology-philosophy group. Their model involves a colonial invertebrate with chimerism, conflicts, and adaptations. They've listed several commitments about causal criteria, reproducer constraints, gene's-eye view, equivalence of partitions, verdicts on their model, and strict labeling.

  First, I need to parse each commitment and see where tensions might arise. Commitment 1 emphasizes causality: heritable variation at level X must causally affect reproductive output at that level. Commitment 2 requires units to be reproducers with life cycles, bottlenecks, etc., so genes aren't units but replicators. But commitment 3 says the gene's-eye view explains things colony-level can't, like allele D's spread despite harming colonies. That seems to clash with 2, which excludes genes as units.

  Then there's commitment 4: Price equation and gene-level partitions agree mathematically. So the user thinks choosing between genes or groups is just bookkeeping. But commitment 3 insists the gene's-eye view has unique explanatory power. If both partitions are equivalent, why can't colony-level recover D's spread? That's a tension between 3 and 4.

  Commitment 5 applies their framework to the model. They see colony-level selection in (ii) and (iv), and P's spread as colony-level winning. But D's spread is framed as selection for the allele, which conflicts with reproducer constraint in 2. They want to call D's evolution "selection acting" at gene level, but 2 says genes aren't units. So here, 3 conflicts with 2 and possibly 5.

  Commitment 6 wants strict labeling, only calling levels with complex adaptations "units." But if colony-level has adaptations like (iv), that's fine. However, if gene-level explains D's spread, but genes don't build complex adaptations, they can't call it a unit. But the user might want to say selection "acts" there. Tension between 3 and 6.

  The user also mentions an apparent contradiction: D is selected (lowers colony output) while colonies are selected for higher output. They think this is fine. In multilevel selection, this is possible—intra-group vs. inter-group selection. Price equation handles this. So here, no real tension; it's standard MLS.

  Now, ordering tensions by severity. The biggest is between commitment 2 (reproducer constraint, genes aren't units) and 3 (gene's-eye view has unique explanatory power). If units must be reproducers, genes can't be units, but 3 says gene-level explanation is irreplaceable. To resolve, either drop reproducer constraint (losing a clear individuation criterion) or reframe gene's-eye view as bookkeeping (but user insists it's more). Costly either way.

  Next, tension between 3 and 4. If partitions are equivalent, why can't colony-level explain D's spread? Contextual analysis might show D's fitness depends on colony context, so it's not purely gene-level. User might need to accept that gene's-eye view is a perspective within the reproducer framework, not a separate unit.

  Then, 3 vs. 6: genes don't build complex adaptations, so even if selection "acts" there, it shouldn't be called a unit. User must decide if "unit" requires adaptation-building or if "selection acting" is separate.

  The single revision that cleans up most: reframing the gene's-eye view. Clarify that genes are replicators within reproducers. Selection acts on reproducers (colonies), but gene dynamics (like D's spread) are outcomes of colony-level selection with internal conflict. This preserves causality (1), reproducer constraint (2), and explains D's spread without calling genes units. It resolves tensions with 4,5,6. Cost: user gives up "selection acts on genes" literally, but keeps the explanatory insight.

  Also, the user's model points are consistent with MLS. D's spread is within-colony selection, while colony selection favors higher output. P suppresses D, aligning lower-level with higher-level fitness. So the apparent contradiction is fine.

  In summary, the main tension is reproducer constraint vs. gene's-eye view. By redefining how they present the gene's perspective as part of the reproducer's selection, they can maintain most commitments. The key is distinguishing levels of selection from perspectives of analysis.
answer: |-
  Here's an audit of your position, ordered by severity of tension, with required revisions and their costs. Your core tension stems from the **Reproducer Constraint (2)** conflicting with your desire to grant **explanatory primacy to the gene's-eye view (3)**. The set is *almost* consistent but requires refinement on what "selection acting" means.

  ### Tensions, Ordered by Severity
  1.  **Commitment 2 (Reproducer Constraint) vs. Commitment 3 (Explanatory Primacy of Gene's-Eye View)**
      *   **Tension:** (2) states that units of selection *must* be reproducers (Darwinian individuals). Genes are explicitly excluded, being mere replicators. (3) insists the gene's-eye view explains something fundamental ("selection *for* the allele's transmission") that colony-level description cannot recover. This implies genes are *more* than just a bookkeeping device; they are loci where selection "acts" causally.
      *   **Conflict:** You cannot simultaneously deny genes the status of units of selection (due to lacking reproducer properties) *and* claim that selection "acts" on them in a way that provides unique causal explanation irreducible to the reproducer level. This elevates genes beyond mere bookkeeping into a distinct causal locus, contradicting (2).
      *   **What Must Give:** You must either:
          *   **Option A (Recommended): Reframe "Selection Acting" on Genes:** Abandon the literal phrasing that selection "acts on the allele" or "for the allele's transmission." Instead, describe D's spread *as a causal consequence of selection acting on reproducers (cells/colonies)* under specific conditions (intra-colony competition/variance). The gene's-eye view is a powerful *heuristic* and *causal decomposition* revealing conflicts *within* the reproducer, but the selection *force* operates via differential reproduction/survival *of reproducers* (cells bearing D outcompete other cells within the colony; colonies with P outcompete colonies without P).
              *   **Cost:** Feels less intuitive for describing selfish genetic elements. You lose the punchy "selection acts on the gene" phrasing. Requires careful language to preserve the core insight of intra-genomic conflict without reifying genes as units.
          *   **Option B: Relax the Reproducer Constraint:** Allow "units of selection" to include entities that aren't full reproducers but where heritable variation has significant causal effects on fitness differences (e.g., genes). This resurrects the replicator concept as a unit.
              *   **Cost:** Undermines the theoretical clarity and biological grounding of the reproducer concept (life cycle, bottleneck, integration). Makes "unit of selection" potentially too permissive, conflicting with (6). Forces a major revision of (2) and potentially (1) if causal efficacy alone is sufficient without reproducer properties.

  2.  **Commitment 3 (Explanatory Primacy of Gene's-Eye View) vs. Commitment 4 (Equivalence of Partitions)**
      *   **Tension:** (4) states the multilevel (Price) and gene-centered (contextual/neighbor-modulated) partitions mathematically agree on total change. (3) claims the gene's-eye view provides unique, irreducible explanatory power ("no colony-level description can recover" D's spread).
      *   **Conflict:** If the partitions are formally equivalent, any causal explanation derived from one *must* be recoverable from the other, even if less intuitive. Claiming the gene's-eye view provides *unique* causal insight not capturable by the colony-level partition contradicts their formal equivalence.
      *   **What Must Give:** You must soften the claim in (3). The gene's-eye view isn't *causally irreducible*; it's a *different, often more convenient or insightful decomposition* of the *same* causal processes operating on reproducers (cells/colonies). The spread of D *can* be described colony-level: it's selection *within* colonies favoring cell lineages with higher propagule contribution (even if costly to the colony). The gene's-eye view makes this intra-unit conflict starkly visible and mathematically tractable.
          *   **Cost:** Diminishes the perceived uniqueness of the gene's-eye view. Requires acknowledging that colony-level MLS frameworks *can* describe the conflict (e.g., as within-group selection), just perhaps less elegantly for this specific aspect.

  3.  **Commitment 3 (Explanatory Primacy of Gene's-Eye View) vs. Commitment 6 (Strictness & Adaptation)**
      *   **Tension:** (6) wants to reserve "unit of selection" for levels where selection has built complex adaptations. Genes (as per your (2)) are not reproducers and don't build complex adaptations *themselves*; complex adaptations are built by selection acting on reproducers (like organisms or colonies). Yet (3) implies genes are a locus of significant selective action (D's spread).
      *   **Conflict:** If genes aren't reproducers (2), they can't build complex adaptations (6), so they can't be units of selection (6). But (3) strongly suggests they are a fundamental locus of selection.
      *   **What Must Give:** This tension largely resolves if you adopt **Option A** from Tension 1. If "selection acting on genes" is reframed as "selection acting on reproducers *leading to* changes in gene frequency due to intra-reproducer competition," then the gene-level change is a *consequence*, not a separate locus requiring unit status. D's spread isn't building a complex gene-level adaptation; it's a *side-effect* (or even a *disruption*) of selection at the cell/colony level. P's spread *is* building a colony-level adaptation (suppression of conflict).
          *   **Cost:** Requires consistent application of the reproducer framework. Genes are vehicles *for* heritable variation *in* reproducer traits.

  4.  **Commitment 1 (Causal Criterion) vs. Implication of Commitment 3 (Genes as Causal Loci)**
      *   **Tension:** (1) requires heritable variation at level X to causally explain differential reproduction *at X*. If genes are reproducers (which (2) denies), they could fit. If not, how does heritable variation *at the gene level* cause differential reproduction *at the gene level* if genes don't reproduce?
      *   **Conflict:** This is a consequence of Tension 1. If genes aren't reproducers, they lack a "reproductive output at their level" for variation to causally impact.
      *   **What Must Give:** Resolved by **Option A** (Tension 1). Gene frequency change is caused by differential *reproduction/survival of the reproducers* (cells, colonies) in which they reside. The causal locus is the reproducer.

  **The "Further Thing" (D selected vs. colonies selected):** This is **NOT incoherent** and is a core tenet of Multilevel Selection (MLS) theory. It's a straightforward case of:
  *   **Within-colony selection (Level 1):** Favors D alleles (despite colony cost) because D-lineage cells outcompete other cells for access to the germ line within their colony.
  *   **Between-colony selection (Level 2):** Favors colonies with higher output. This favors non-D alleles *within* pure colonies and P alleles *within* chimeric colonies (which suppress D's costly effect and boost colony output). It also directly favors the trait in (iv).
  The total evolutionary outcome depends on the relative strength of these opposing selective forces at different levels. This is perfectly handled by the MLS Price approach you accept in (4).

  ### The Single Most Effective Revision
  **Adopt Option A for Tension 1: Reframe "selection acting on genes" as "selection acting on reproducers causing gene frequency change."**

  *   **Why it cleans up the most:**
      1.  It directly resolves the core Tension 1 (2 vs 3) by bringing your view of gene dynamics into line with the Reproducer Constraint without abandoning its key insights.
      2.  It naturally resolves Tension 3 (3 vs 6) by clarifying that gene frequency changes like D's spread are *outcomes* of selection on reproducers, not evidence of gene-level units building adaptations.
      3.  It resolves Tension 4 (1 vs implication of 3) by grounding causality firmly at the reproducer level.
      4.  It significantly weakens Tension 2 (3 vs 4) by acknowledging that the gene's-eye view, while powerful and often the most *illuminating* decomposition for conflicts, is *causally recoverable* from the reproducer-level perspective (even if clunkier). The "unique explanatory power" becomes *heuristic/pragmatic*, not *ontological*.
      5.  It preserves your Verdicts (5) and Causal Criterion (1) intact.
      6.  It maintains the Strictness (6) by keeping the unit of selection tied to reproducers capable of bearing complex adaptations (like the colony-level adaptation in iv and P's spread).
      7.  It fully accommodates the "further thing" as standard MLS.

  *   **Cost:** Requires more careful language. Instead of "Selection favors selfish gene D," use "Within-colony selection favors cell lineages carrying D due to their biased germ-line contribution" or "Selfish genetic element D spreads due to intra-colony selection dynamics." This emphasizes the *level* where the causal machinery operates (cell/cell-lineage within colony) while still capturing the gene-centered *effect*.

  ### Key Distinction You Are Missing
  **Selection "Acting" vs. Selection "Explaining Frequency Change":** Your desire in (3) conflates two things:
  1.  **The locus of causal mechanisms:** Where does the differential survival/reproduction *physically happen*? In your model, it happens to *cells* (within colonies) and to *colonies* (between colonies). These are reproducers.
  2.  **The level of heritable variation targeted:** Which *traits* are causally responsible? The *allele D* is a heritable trait *of cell lineages* that causally influences their *within-colony* fitness. The *allele P* is a heritable trait *of cell lineages/colonies* that causally influences *colony* fitness. The *germ-line sequestration timing* is a heritable trait *of colonies* influencing colony fitness.

  The gene's-eye view excels at tracking the frequency changes *of alleles* and attributing them to the fitness effects they cause *in the contexts they experience*. This is invaluable for understanding conflicts like D. However, the *causal engine* of selection – the actual differential reproduction – operates on the reproducers (cells, colonies) bearing those alleles. **The distinction is between the *target of selection* (the heritable trait variant, e.g., allele D) and the *unit of selection* (the entity that reproduces differentially *because* it bears that variant, e.g., the cell lineage within the colony).**

  By adopting the revision, you keep the profound explanatory power of tracking allele frequencies and fitness effects (the *target* perspective) while grounding the causal mechanism firmly in the differential reproduction of Darwinian individuals (the *unit* perspective). This resolves the tensions while preserving the substance of your insights on the model. Good luck with the talk!
