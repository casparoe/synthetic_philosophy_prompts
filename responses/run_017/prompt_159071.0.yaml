  For the third task, I estimate about 0.15 (15%) of current non-acute interventions are enhancement. This includes cosmetic procedures, some fertility treatments, and off-label cognitive enhancers. The case-by-case scores align with this estimate, as most medical interventions still target pathology. I'd stick with this fraction as it reflects real-world practice while acknowledging gray areas exist.

