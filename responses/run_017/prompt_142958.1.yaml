prompt: |-
  I sit on a grant panel that funds field work in animal behaviour, and a large share of the proposals we read contain the same move somewhere in the background section: some trait — a patch of colour, a call, a bout of vigilance, an unwieldy structure — is described as a costly signal, and its cost is said to be what makes it honest. The move is load-bearing. It is what licenses treating the trait as an adaptation for communication rather than as a weapon, a byproduct, a cue, or a symptom, and it usually arrives with no more support than the observation that the trait is expensive or risky to have. Expensiveness alone does not separate types: a cost that every individual pays equally, however large, tells a receiver nothing. But we have no shared standard for when the claim has been earned, and I would like one before the next round.

  Please write me the specification I should be applying when a proposer claims that trait T in species S is maintained as a costly signal of quality Q. That is: the requirements a case must meet before the claim is anything more than a just-so story, each with the case or consideration that motivates it, sorted into what is non-negotiable, what is a strong presumption that can be rebutted with argument, and what is merely the taste of one research tradition. The purpose is fixed, so please keep it in view: this is an evidential standard for empirical claims about particular traits, not a general theory of communication, and "adequate" means adequate to license the word *signal* in that case — as against cue, index, armament, or epiphenomenon.

  These are the demands I keep half-formulating and then abandoning, to show you where I am stuck. I would rather you rebuilt the list than annotated mine, but I want your criteria to be answerable to them:

  - Not "the trait is expensive" but "the extra cost of a somewhat larger or more intense trait is smaller for a higher-quality individual" — the graded or single-crossing condition that the strategic models place at the centre. A flat tax on all bearers cannot separate types.
  - Costs counted at the margin of the signalling act, so that a cost the animal would incur anyway — a display given from a perch it would occupy regardless, a migration route that doubles as an advertisement — cannot be charged to the signal.
  - A currency requirement: the cost must be one that Q genuinely makes cheaper to bear, so that the link between quality and cost runs through Q rather than through some third variable that happens to correlate with it.
  - A declaration of which cost mechanism is being posited: production cost, receiver-imposed or social cost, or vulnerability cost such as attraction of predators — since these make different predictions when receivers are experimentally removed.
  - A timing condition: whether the cost must be realised at the point of the receiver's decision, or whether a cost that is merely pledged and falls due later does the same work.
  - A receiver-side requirement: that someone actually reads the trait, that the reading feeds back onto the signaler's fitness, and that the response is not better explained by a preference that predates the trait.
  - An alternative-hypotheses requirement: why the trait is not a weapon or a direct fitness benefit, and why a cheaper equivalent producing the same response has not invaded.
  - A say-which-it-is requirement: is the trait mechanically tied to Q, in which case the machinery of cost is idle and the evidentiary burden shifts to the mechanism, or is it conventional and cost-maintained?

  Test the list on three composite cases from the current round, since a standard that cannot decide cases is not one:

  (1) A lizard in which males develop a carotenoid-based throat patch, drawn from stores that depend on foraging success and parasite load, only in wet years; the display is performed from basking rocks that males occupy irrespective of patch size; patched males receive more attacks from territory holders; females prefer larger patches; and females of a closely related species lacking the patch also prefer blue-baited models.

  (2) A fish with male parental care in which the courtship display itself is cheap, but displaying commits the male to weeks of egg-guarding during which he loses substantial mass and runs elevated predation risk — a cost that falls due only if the female accepts him, and that he could in principle escape by deserting afterwards.

  (3) A bird whose dawn chorus costs every male, in every condition, roughly the same four per cent of body mass per morning.

  Two further things matter more to me than the list itself. First: which of the things people demand in this area are genuine desiderata and which are inherited rhetoric — in particular whether the cost has to be *wasteful*, something that lowers fitness with no compensating return, or whether that is Zahavi's polemical framing rather than a result, and whether full separation is required or reliability on average is enough. Second: whether some subset of the requirements is jointly unsatisfiable, in which case that is itself the finding I want. My suspicions are that a requirement that the signal mean the same thing across habitats and seasons cannot be met jointly with the fact that costs are context-dependent, and that a requirement of unfakeability by construction cannot be met jointly with one of evolutionary flexibility plus affordability for the lowest-quality bearer; tell me if these are right and whether there are better ones.

  Finally, name the single requirement that does the most work in excluding candidate traits, and — in a few lines only, since the criteria are the deliverable and not the scorecard — say how the main families of account in the area fare: Zahavi's original handicap principle, the Grafen-style strategic models, the index or mechanical-constraint approach, and the results showing that honesty can be stable without cost when interests partly coincide.
reasoning: |-
  We are constructing an evidential standard for when a trait T in species S can be properly claimed to be maintained as a costly signal of quality Q. The goal is to have a set of criteria that must be met to justify the use of "signal" (as opposed to cue, index, armament, or epiphenomenon) in a grant proposal about animal behavior.

  The standard must be empirical and applicable to particular traits. We will sort the requirements into non-negotiable (must be met), strong presumptions (can be rebutted with argument), and matters of taste (vary by research tradition). We will then test the criteria on the three composite cases.

  ---

  **Criteria for Claiming a Trait is a Costly Signal**

  **Non-Negotiable Requirements** (must be met for the claim to hold)

  1. **Conditional Cost Structure (Marginal Cost Differential)**: The extra cost of producing or maintaining a slightly more intense or larger version of the trait must be lower for higher-quality individuals (with respect to Q). This is the single-crossing property. 
     - *Motivation*: Without this, the signal cannot reliably indicate quality because low-quality individuals could afford the same signal level as high-quality ones. A flat cost (same for all) does not separate types.

  2. **Receiver Response and Feedback**: There must be evidence that receivers (e.g., mates, rivals) respond to variation in T in a way that affects the signaler's fitness (e.g., mating success, territory acquisition). The response must be shown to be due to the trait as a signal (i.e., not a pre-existing bias or a response to a different aspect of the trait). 
     - *Motivation*: Without a receiver response that provides a fitness benefit (or cost) to the signaler, there is no communication. The feedback loop is essential for the signal to be maintained by selection.

  3. **Exclusion of Non-Signal Explanations**: The proposer must show that T is not better explained as:
     - A weapon (used in combat).
     - A direct fitness benefit (e.g., thermoregulation, foraging efficiency).
     - A byproduct (e.g., physiological constraint) or epiphenomenon.
     - A cue that is not maintained by the signalling interaction (e.g., an index that is mechanically linked to Q without cost-based maintenance).
     - *Motivation*: The trait must be an adaptation for communication, and alternative hypotheses must be ruled out.

  4. **Cost Attribution**: The cost attributed to the signal must not be a cost the animal would incur anyway (i.e., it must be a marginal cost of signalling). For example, if the display is given from a perch the male would occupy regardless, the cost of occupying the perch is not a signal cost. The cost must be additional and due to the act of signalling or the maintenance of the signal trait.
     - *Motivation*: If the cost is not additional, it does not provide a mechanism for honesty because it does not differentially affect individuals of different qualities.

  **Strong Presumptions** (can be rebutted with evidence and argument)

  5. **Currency Requirement**: The cost must be in a currency that Q genuinely makes cheaper to bear (i.e., the link between Q and the cost must run through Q and not through a correlated third variable). 
     - *Motivation*: If the cost reduction is due to a variable other than Q, then the signal is not about Q. However, if Q is a composite trait that includes the third variable, this may be acceptable.

  6. **Cost Mechanism Declaration**: The proposer must specify the type of cost (e.g., production cost, receiver-imposed cost, social cost, vulnerability cost) and provide evidence consistent with that mechanism. 
     - *Motivation*: Different cost mechanisms make different predictions (e.g., if receivers are removed, a receiver-imposed cost should disappear, but a production cost would remain). This helps design tests.

  7. **Timing of Cost**: The cost may be realized at the time of the receiver's decision or pledged for the future. However, if the cost is pledged (e.g., a commitment to future care), there must be a mechanism that enforces the commitment (e.g., desertion is not feasible or is punished). 
     - *Motivation*: Pledged costs can work if they are binding, but the enforceability must be established.

  8. **Avoidance of Cheaper Mimics**: The proposer must address why a cheaper trait that elicits the same receiver response has not evolved (i.e., why the signal is not invaded by cheats). 
     - *Motivation*: Without this, the stability of the signal is questionable. However, in some cases, constraints (e.g., genetic, developmental) might prevent the evolution of mimics.

  **Matters of Taste or Research Tradition** (not required, but proposers may address if relevant)

  9. **Wastefulness**: It is not necessary that the cost be "wasteful" (i.e., without any compensatory return). Signals can have net benefits to the signaler and still be honest if the cost structure ensures reliability. 
     - *Note*: Zahavi's handicap principle often emphasizes waste, but models (e.g., Grafen) show that net benefits can occur.

  10. **Full Separation vs. Average Reliability**: Full separation (every signal level corresponds to a unique quality) is not required; average reliability (higher signal intensity correlates with higher quality) is sufficient for many models. 
      - *Note*: Some models (e.g., continuous signalling) work with continuous and noisy relationships.

  11. **Context Invariance**: It is not required that the signal means the same thing across habitats and seasons. Costs and benefits can be context-dependent, and the signal can still be honest in a given context. 
      - *Note*: The conditional cost structure must hold in the context in which the signal is used.

  12. **Unfakeability by Construction**: It is not required that the signal be unfakeable by construction (e.g., mechanically tied to Q). Costly signals can be conventional (arbitrary) as long as the cost enforces honesty. 
      - *Note*: The tension between unfakeability and evolutionary flexibility is resolved by the cost structure: even arbitrary signals can be honest if they are costly in a way that depends on quality.

  ---

  **Testing the Criteria on Composite Cases**

  **Case 1: Lizard with Carotenoid-Based Throat Patch**

  - *Trait*: Throat patch size, varying with foraging success and parasite load (Q: health/vitality).
  - *Display*: From basking rocks (occupied regardless).
  - *Cost*: More attacks from territory holders (receiver-imposed cost).
  - *Receiver Response*: Female preference for larger patches.
  - *Complication*: Females of a related species (without the patch) prefer blue-baited models (suggesting a pre-existing bias).

  *Assessment*:
  - Non-Negotiable:
    - (1) Conditional Cost Structure: Not directly tested. Are attacks more frequent or costly for low-quality males? If high-quality males can bear the cost of attacks better (e.g., by being better fighters), then yes. Otherwise, no.
    - (2) Receiver Response: Female preference is present, but the pre-existing bias in a related species suggests that the preference might not have evolved for this signal. The feedback from female choice must be shown to affect male fitness (e.g., mating success). Also, the attacks from territory holders are a cost, but it's unclear if this is a signal cost or a consequence of intruding (if the patch size makes the male more conspicuous to rivals). The cost might be a byproduct of being conspicuous, not necessarily a signal cost.
    - (3) Exclusion of Non-Signal Explanations: The patch might be a cue of health (due to carotenoid availability and parasite load) without being a signal. The attacks from territory holders might be due to the patch acting as an armament (if used in fights) or a badge of status. The proposer must rule these out.
    - (4) Cost Attribution: The basking rock occupation is not a cost of the signal. The cost of the attacks is additional. However, is the patch the cause of the attacks? Or is it the presence of the male? The proposer must show that larger patches lead to more attacks, holding other factors constant.

  - Strong Presumptions:
    - (5) Currency: Health (Q) might make bearing the attacks cheaper (if high-quality males are better at fighting or escaping). But not shown.
    - (6) Cost Mechanism: Receiver-imposed (from territory holders) and possibly vulnerability (predation?) but not specified.
    - (7) Timing: Cost (attacks) occurs at the time of display.
    - (8) Cheaper Mimics: Why not a cheaper blue patch? Perhaps because the carotenoid is hard to fake? Not addressed.

  *Verdict*: The claim is not adequately supported. The pre-existing bias and the lack of evidence that the cost is conditionally borne by quality are major issues. The cost from attacks might be a consequence of being conspicuous, but without the conditional cost structure, it could be a cue or an armament.

  **Case 2: Fish with Male Parental Care**

  - *Trait*: Courtship display (cheap), but committing to egg-guarding (costly: mass loss, predation).
  - *Q*: Male quality (e.g., ability to provide care?).
  - *Receiver Response*: Female choice based on the display.
  - *Cost*: Only incurred if the female accepts and the male guards.

  *Assessment*:
  - Non-Negotiable:
    - (1) Conditional Cost Structure: The cost is the future care. The extra cost of committing to care (if the display is a commitment) must be lower for higher-quality males. For example, high-quality males might lose less mass or have lower predation risk during guarding. Not measured.
    - (2) Receiver Response: Female choice is present, and it leads to the male being accepted and then paying the cost. The feedback is that by accepting a male, the female imposes the cost of care. However, the male's fitness is affected: he gains offspring but pays a cost. The net effect must be positive for high-quality males and negative for low-quality ones? Not shown.
    - (3) Exclusion of Non-Signal Explanations: The display might be a signal of commitment, but why is it a signal? Could it be that the display is a cue of something else (e.g., size) that correlates with care ability? Also, the display itself is cheap, so the honesty comes from the pledged cost. But the male could desert after mating. The proposer must show that desertion is not feasible (e.g., due to female mate guarding) or is punished (e.g., by loss of future matings). Without enforceability, the commitment is not binding.
    - (4) Cost Attribution: The cost of egg-guarding is additional and incurred only if the display is successful. This is a marginal cost of signalling (because without the display, the male might not get the chance to guard). However, the display itself is cheap, so the main cost is the pledged care.

  - Strong Presumptions:
    - (5) Currency: Quality Q (e.g., foraging ability, strength) should make the care cost cheaper. Not tested.
    - (6) Cost Mechanism: Vulnerability cost (predation) and possibly physiological cost. But the cost is pledged and future.
    - (7) Timing: Cost is pledged and falls due later. The enforceability of the commitment must be shown (e.g., males cannot desert without penalty).
    - (8) Cheaper Mimics: Why not a display that mimics commitment without actually guarding? If desertion is possible and not punished, then mimics could invade. The proposer must show why this doesn't happen.

  *Verdict*: The claim has potential, but the enforceability of the commitment is critical. Without evidence that males cannot desert without penalty, the signal may not be honest. The conditional cost structure must be demonstrated (e.g., high-quality males lose less during care).

  **Case 3: Bird Dawn Chorus**

  - *Trait*: Dawn chorus (singing).
  - *Cost*: 4% body mass per morning, same for all males in all conditions.
  - *Q*: Not specified (presumably quality, e.g., health, energy reserves).

  *Assessment*:
  - Non-Negotiable:
    - (1) Conditional Cost Structure: The cost is the same for all. Therefore, it cannot be a signal of quality because low-quality individuals can pay the same cost. This fails the single-crossing condition.
    - (2) Receiver Response: Not described, but even if there is a response, without differential cost, the trait cannot signal quality.
    - (3) Exclusion of Non-Signal Explanations: The trait might be a cue (if it correlates with something else) or an epiphenomenon. But the cost is high and fixed, so it might be maintained for another reason (e.g., territory defense to other males?).
    - (4) Cost Attribution: The cost is incurred by singing, so it is a marginal cost of the signal.

  *Verdict*: The claim fails because the cost is not conditionally dependent on quality. It might be a signal (e.g., of presence or species identity) but not a costly signal of quality.

  ---

  **Addressing the Further Questions**

  1. **Wastefulness**: The requirement that the cost be wasteful (with no compensatory return) is not necessary. In fact, signals often have net benefits (e.g., attracting a mate). The key is that the cost must be differentially burdensome to ensure honesty. This is Zahavi's original framing, but models (like Grafen's) show that honest signals can have net benefits.

  2. **Full Separation vs. Average Reliability**: Full separation is not required; average reliability (a correlation) is sufficient for many signalling models. The single-crossing condition ensures that higher-quality individuals can afford higher signals, but noise and individual variation can blur the relationship.

  3. **Joint Unsatisfiability**:
     - *Context Invariance*: A requirement that the signal means the same across contexts is not necessary and often cannot be met because costs and benefits are context-dependent. The conditional cost structure must hold in the context of use, but it can vary.
     - *Unfakeability by Construction vs. Evolutionary Flexibility*: These are not jointly unsatisfiable. Costly signals can be arbitrary (conventional) and still be honest because the cost enforces honesty. The cost structure allows for flexibility: the signal form can evolve, as long as the cost differential is maintained. The requirement that the signal be affordable for the lowest-quality bearer is not necessary because the lowest-quality might not signal at all or signal at a low level.

     *Your Suspicions*: 
     - The context-dependence of costs does not conflict with the requirement that the signal be honest in a given context. So that requirement is not problematic.
     - The tension between unfakeability and flexibility is resolved by the cost structure. Thus, they are not jointly unsatisfiable.

  4. **The Single Most Important Requirement**: The **Conditional Cost Structure (Marginal Cost Differential)** is the most critical. It does the most work in excluding traits because without it, there is no mechanism for honesty. Traits with flat costs (same for all) or costs that do not vary with quality cannot be costly signals of quality.

  **How Main Theories Fare**:

  - **Zahavi's Handicap Principle**: Emphasizes that the cost must be wasteful and that only high-quality individuals can bear it. Our criteria require the conditional cost structure, which is consistent with Zahavi, but we do not require wastefulness. Zahavi's account is often qualitative and does not require a specific mechanism, which our criteria address.
    
  - **Grafen-style Strategic Models**: These formalize the single-crossing condition and show that honest signalling can be evolutionarily stable. Our criteria align well with these models, especially the conditional cost structure and the receiver response.

  - **Index/Mechanical-Constraint Approach**: This posits that signals are honest because they are mechanically tied to quality (e.g., a deep voice requires a large larynx). Our criteria require that if the signal is an index, the cost mechanism is not the enforcer of honesty, so the proposer must either show that the trait is maintained by cost (and thus is not just an index) or that the index itself is under selection for communication. We require a declaration (say-which-it-is) and then adjust the burden accordingly.

  - **Honesty Without Cost When Interests Align**: When interests coincide (e.g., in mutualisms), signals can be honest without being costly. Our criteria require that if cost is invoked, it must meet the standard. But if interests align, then cost is not necessary, and the trait might be a cue or a signal without being costly. Our criteria are for costly signals, so they do not apply to such cases.

  ---

  **Final Specification**

  To claim that trait T in species S is maintained as a costly signal of quality Q, a proposal must:

  **Non-Negotiable**:
  1. Demonstrate or provide evidence for a conditional cost structure: the marginal cost of a slightly more intense T is lower for higher-Q individuals.
  2. Show that receivers respond to T in a way that affects the signaler's fitness, and that this response is due to T as a signal (not a pre-existing bias or non-signal trait).
  3. Rule out alternative explanations (weapon, direct benefit, byproduct, cue).
  4. Attribute the cost to the signal: it must be an additional cost incurred because of the signal (not a cost that would be paid anyway).

  **Strong Presumptions** (must be addressed, but can be rebutted):
  5. Show that the cost is in a currency that Q makes cheaper to bear (the link runs through Q).
  6. Declare the cost mechanism (production, receiver-imposed, etc.) and provide evidence consistent with it.
  7. For pledged costs (future costs), show that the commitment is enforceable (desertion is not feasible or is punished).
  8. Address why a cheaper mimic has not evolved (stability of the signal).

  **Matters of Taste** (can be mentioned but not required):
  9. Wastefulness: not required.
  10. Full separation: not required; reliability on average is sufficient.
  11. Context invariance: not required.
  12. Unfakeability by construction: not required.

  This specification ensures that the claim of costly signalling is empirically grounded and not a just-so story.
answer: |-
  ### Evidential Standard for Costly Signal Claims

  Below is a specification for evaluating claims that trait **T** in species **S** is maintained as a costly signal of quality **Q**. The criteria are sorted into **non-negotiable** (must be met), **strong presumptions** (rebuttable with evidence), and **taste/tradition** (not essential). Each criterion includes a motivating case/consideration. The standard is designed to empirically justify treating **T** as a *signal* (implying adaptation for communication) rather than a cue, weapon, byproduct, or epiphenomenon.

  ---

  #### **Non-Negotiable Requirements**  
  *Must be met to license the "costly signal" claim.*

  1. **Marginal Cost Differential**  
     *Requirement:* The marginal cost of producing or maintaining a slightly more intense/larger **T** must be lower for higher-**Q** individuals (single-crossing condition).  
     *Motivation:* A flat cost (e.g., all pay 10% energy) cannot separate types; only differential costs ensure low-**Q** individuals cannot afford high-intensity signals. Rejects "expensiveness alone" arguments.  
     *Case Example:* In the lizard (Case 1), if low-foraging-skill males incur higher costs to *enlarge* their patch than high-skill males, this holds. If patch size is fixed by diet, it fails.  

  2. **Receiver Feedback Loop**  
     *Requirement:* **T** must elicit a receiver response that affects the signaler’s fitness (e.g., mating, survival), and this response must specifically target **T** as a signal (not a pre-existing bias or incidental effect).  
     *Motivation:* Without feedback, **T** is a cue, not a signal. Signals require co-evolved communication.  
     *Case Example:* In the lizard (Case 1), female preference for larger patches must directly improve male reproductive success *and* not be better explained by a pre-existing bias (e.g., if the sister species’ blue preference predates the patch).  

  3. **Exclusion of Non-Signal Hypotheses**  
     *Requirement:* The proposer must rule out that **T** is:  
     - A weapon (e.g., used in combat),  
     - A direct fitness benefit (e.g., thermoregulation),  
     - A byproduct/cue (mechanically tied to **Q** without signal selection), or  
     - An epiphenomenon (no adaptive role).  
     *Motivation:* Signals are adaptations for communication; alternatives must be falsified.  
     *Case Example:* The lizard’s patch must not confer a fighting advantage (weapon) or arise purely from carotenoid metabolism (byproduct).  

  4. **Marginal Cost Attribution**  
     *Requirement:* Costs must be *additional* to what the individual would incur without signalling. Costs from pre-existing behaviors (e.g., basking on rocks) or traits do not count.  
     *Motivation:* Shared costs cannot enforce honesty; signals require dedicated investment.  
     *Case Example:* The lizard’s display from basking rocks it occupies anyway fails; only costs from *patch-specific* behaviors (e.g., extra exposure during display) qualify.  

  ---

  #### **Strong Presumptions**  
  *Expected unless rebutted by evidence/argument.*

  5. **Currency-Q Alignment**  
     *Requirement:* The cost must be in a currency that **Q** genuinely reduces (e.g., **Q** = immune strength; cost = infection risk). Costs mediated by a correlative third variable (e.g., body size) are inadequate.  
     *Motivation:* If **Q** does not directly alleviate the cost, the link is coincidental, not adaptive.  
     *Case Example:* In the fish (Case 2), if **Q** is foraging ability, it must reduce mass loss *during care*, not just correlate with territory quality.  

  6. **Cost Mechanism Declaration**  
     *Requirement:* The proposer must specify the cost type (production, receiver-imposed, social, or vulnerability) and test its predictions (e.g., if receivers are removed, receiver-imposed costs vanish).  
     *Motivation:* Different mechanisms imply different tests (e.g., predation-vulnerability costs persist without receivers).  
     *Case Example:* The lizard’s attacks from rivals are receiver-imposed; removing rivals should eliminate this cost.  

  7. **Enforceability of Pledged Costs**  
     *Requirement:* For costs paid after receiver decisions (e.g., future care), the signaler must face binding constraints (e.g., desertion is impossible or punished).  
     *Motivation:* Non-binding pledges (e.g., fish deserting eggs) allow cheating.  
     *Case Example:* The fish (Case 2) must show desertion is penalized (e.g., via female retaliation) or physiologically unavoidable.  

  ---

  #### **Matters of Taste/Tradition**  
  *Not required; reflects theoretical preferences.*

  8. **Wastefulness**  
     *Status:* Zahavi’s "waste" framing is polemical; costs need not reduce net fitness. Signals can have net benefits if offset by returns (e.g., mating success).  
     *Motivation:* Grafen’s models show honesty is possible with net gains; only the *differential* cost matters.  

  9. **Full Separation vs. Average Reliability**  
     *Status:* Full separation (each signal level maps perfectly to **Q**) is unnecessary; reliability "on average" suffices.  
     *Motivation:* Natural systems are noisy; signals need only correlate with **Q** to be informative.  

  10. **Context Invariance**  
      *Status:* Signals need not mean the same across contexts (e.g., seasons). Costs can be context-dependent.  
      *Motivation:* Costs vary with environment (e.g., wet vs. dry years in lizards); honesty requires only local stability.  

  11. **Unfakeability by Construction**  
      *Status:* Mechanical unfakeability (e.g., patch size tied to diet) is not required; conventional signals (e.g., arbitrary colors) are valid if costs enforce honesty.  
      *Motivation:* Flexibility and affordability for low-**Q** individuals are compatible (e.g., low-quality signallers use cheaper forms).  

  ---

  ### **Testing Cases with Criteria**

  **Case 1: Lizard Throat Patch**  
  - **Fails** non-negotiables:  
    - *Marginal Cost Differential:* Unclear if patch *enlargement* costs less for high-quality males. Patch size may be fixed by diet/parasites (a cue).  
    - *Receiver Feedback:* Female preference exists, but sister species’ blue bias suggests pre-existing preference, not co-evolved signal.  
    - *Marginal Cost:* Attacks occur, but males use rocks irrespective of signalling; cost not marginal to signal.  
  - **Verdict:** Likely a cue or pre-existing bias exploitation; not a costly signal.

  **Case 2: Fish Parental Commitment**  
  - **Fails** unless rebutted:  
    - *Enforceability:* Desertion risk must be addressed (e.g., penalties).  
    - *Currency-Q Alignment:* Must show **Q** (e.g., foraging skill) reduces care costs.  
  - **Meets** non-negotiables:  
    - *Marginal Cost Differential:* High-**Q** males lose less mass during care.  
    - *Receiver Feedback:* Female choice affects male fitness.  
  - **Verdict:** Plausible if enforceability and **Q** link are demonstrated.

  **Case 3: Bird Dawn Chorus**  
  - **Fails** non-negotiables:  
    - *Marginal Cost Differential:* Fixed 4% cost for all males implies no separation.  
    - *Exclusion of Alternatives:* Likely a cue (e.g., species ID) or epiphenomenon.  
  - **Verdict:** Not a costly signal of quality; could be a low-cost signal or byproduct.

  ---

  ### **Addressing Key Questions**

  1. **Wastefulness & Reliability**:  
     - Wastefulness is **not required**; Zahavi’s framing was polemical. Signals can have net benefits (e.g., courtship signals).  
     - **Average reliability** suffices; full separation is unrealistic in biological systems.  

  2. **Joint Unsatisfiability**:  
     - **Context Invariance + Cost Context-Dependency**: Your suspicion is correct. Requiring signals to mean the same across contexts is unrealistic and conflicts with cost dependency (e.g., lizard patches only in wet years). *This requirement should be abandoned*.  
     - **Unfakeability + Flexibility/Affordability**: These **are compatible**. Conventional signals (e.g., arbitrary colors) can be honest if costs scale with **Q**, allowing low-quality signallers affordable options (e.g., smaller displays).  

  3. **Most Exclusionary Requirement**:  
     **Marginal Cost Differential** excludes the most candidates. It kills "expensive trait" just-so stories by demanding proof that costs *differentially burden* low-quality individuals.  

  ---

  ### **How Major Theories Fare**  
  *(Briefly, as requested)*  

  - **Zahavi’s Handicap**: Emphasizes waste; less applicable to non-wasteful systems. Marginal cost differential aligns but is less restrictive.  
  - **Grafen-style Models**: Best supported; formalizes single-crossing and handles net-benefit signals. Our criteria mirror this.  
  - **Index/Mechanical Constraint**: Posits honesty via physical links (no cost needed). Our standard requires *cost-maintained* signals; indices must prove they’re not just cues.  
  - **Shared-Interest Honesty**: Shows cost-free stability (e.g., mutualisms). Our criteria only apply when cost is argued; otherwise, "signal" may still hold via other mechanisms.  

  ---  
  **Final Specification**: Apply these criteria to filter costly signals from speculation. Focus on **Marginal Cost Differential**, **Receiver Feedback**, and **Non-Signal Exclusion** as the core. Reject context-invariance demands; allow net-benefit signals.
