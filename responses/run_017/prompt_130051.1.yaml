prompt: |-
  There's a pattern that keeps turning up in our board game group and I don't have a word for it, and I've started to suspect it's actually two or three different patterns that just look alike.

  We've kept a house rules binder for about six years. One of the rules in it is the rule for changing the rules: a proposal needs a week's notice and a majority of whoever turns up that night. Everything is in the same binder at the same level — there's no special higher section that the change-the-rules rule lives in, it's just rule 12 out of about thirty — and I think that's part of why the arguments about it go nowhere.

  First case. Someone proposed adding "this rule cannot be changed or removed except by a two-thirds vote." It got in on an ordinary majority, so it came in through a door it then locked behind itself. Half the table thought that was obviously a bit of a cheat, half thought that's just what rules are. What I can't get past is that we'd made the same kind of move in the other direction a year earlier: someone proposed lowering the bar for rule changes to a simple majority of whoever was in the room, no notice needed, and it passed under the old stricter rule, and literally nobody objected. If there's something wrong with using the rule-change rule to change the rule-change rule, it should be wrong both ways. It only felt wrong one way. So whatever bothered us, it wasn't the self-referential bit on its own.

  Second case, the one I keep thinking about. Someone proposed: any rule that has been in the binder for more than a year can only be removed by a two-thirds vote. Note that this rule isn't protected when it's proposed — on day one you can kill it with a normal majority. It gets hard to kill later. Someone at the table called it a rule that starts out harmless and grows teeth. A year later we wanted rid of it and couldn't, and then someone found the trick: change one word of it, then remove the amended version, because the amended version hasn't been in the binder for a year yet. We did exactly that. Everyone agreed it was within the letter of the rules and completly against the point of them.

  Third thing, which might be a seperate animal entirely. Someone once proposed lowering the threshold for rule changes from two-thirds to a simple majority, and the vote came in between the two — enough for a majority, not enough for two-thirds. So whether it had passed at all depended on whether the old rule or the new rule was doing the counting. We never agreed and just dropped it. That felt different from the other two, which were both cases of "it definately passed, it's just unfair."

  So: is there a name for any of this? Someone used the word "entrenchment" once, but as far as I can tell that just means a rule that's hard to change, which covers plenty of things that aren't this. And are the first and second cases really the same thing, or is the grows-teeth one a different problem? I'm asking partly because we're rewriting the binder from scratch over the winter and I want to know what to actually forbid — but I don't want a label on its own, I want to know where the edges are. Specifically:

  - Is the problem in the first case just that the bar for getting out is higher than the bar for getting in? If a rule needed two-thirds to pass and two-thirds to remove, does the objection vanish? And what about the reverse — a rule that comes in hard and goes out easy? Is that the same phenomenon pointing the other way, or is there something specifically suspicious about making yourself harder to remove that has no mirror version?
  - In the second case, is the question of whether the one-word trick works really a question about when a rule stops being the same rule? Because that seems like a different issue from anything about vote thresholds.
  - And is the third case — where you can't tell whether the thing passed at all — in the same family, or is "rules that apply to their own enactment" a different topic that happens to show up in the same binder?

  If some of this has no settled name, I'd rather you say so and tell me how you'd cut it up yourself, with the boundary cases, than give me a term and a paragraph.
reasoning: |-
  Okay, the user is describing recurring patterns in their board game group's rule-changing process and wants to understand the underlying concepts. They've presented three distinct cases where rule modifications led to confusion or perceived unfairness, and they're seeking terminology and conceptual frameworks to categorize these issues. 

  First, I need to unpack their three scenarios carefully. The first case involves a rule change that altered its own amendment threshold (lowering requirements initially, then later raising them), which passed via the very process it modified. The second case features a "grows teeth" rule where removal difficulty increases over time, leading to a loophole exploit. The third is an ambiguous vote count where the outcome depended on which version of the rules applied. 

  The user's core questions reveal sophisticated meta-thinking: they recognize these might be distinct phenomena and want precise boundaries, not just labels. They're particularly concerned about symmetry (why self-amendment felt wrong only one direction) and identity persistence (when does a modified rule become "new"). There's also practical urgency—they're rewriting their rules binder and want to prevent recurrence.

  Hmm... I recall these patterns from constitutional law and game theory. The first case is clearly self-amendment with asymmetric thresholds—a classic sovereignty paradox. The discomfort they felt only when raising barriers makes sense: lowering thresholds expands democratic access, while raising them restricts future agency, triggering loss aversion. 

  The second case is fascinating—it combines temporal entrenchment with a Ship of Theseus problem. The "one-word trick" loophole exposes how rule identity depends on modification thresholds. If small changes reset the "clock," it defeats the entire purpose of temporal protection. This needs clear definitions of "substantive change" in their new system.

  The third case is simpler—a voter paradox where the outcome-determinative rule is itself contested. It's distinct from the others because it's about indeterminacy rather than self-reference. Arrow's theorem applies here.

  For their rewrite, I should emphasize structural solutions: hierarchical rules (a "constitution" tier), explicit identity conditions for amendments, and predefined conflict resolution. The symmetry concern is especially important—they might consider requiring symmetric thresholds for enactment/repeal unless specially justified. 

  The user's group seems philosophically inclined—they'll appreciate the deeper framework. I'll avoid oversimplifying while giving them actionable distinctions.
answer: |-
  Based on your detailed description, you're grappling with fundamental issues in **rule-making systems**, particularly **self-referential rules** and **rule identity**. While no single term perfectly captures all nuances, here's how to dissect and name these patterns, including boundary cases:

  ### 1. **Self-Amendment with Asymmetric Thresholds (First Case)**
      * **Core Problem:** Changing a rule's own amendment procedure using a lower threshold than the new procedure requires for future changes.
      * **Why it felt wrong only one way:**  
        Lowering the threshold (`strict → simple majority`) increases group agency ("easier to fix mistakes later"), so using the old strict rule feels legitimate. Raising the threshold (`simple majority → two-thirds`) *decreases* future agency ("harder to fix *this* mistake"), so using the old simple majority feels like cheating future voters.  
        **Boundary Cases:**  
        - **Symmetric Thresholds:** If a rule requires 2/3 to pass *and* 2/3 to repeal, objections vanish (e.g., constitutional amendments).  
        - **Reverse Asymmetry:** A rule needing 2/3 to pass but simple majority to repeal is **deliberate vulnerability** (e.g., experimental rules). This is acceptable if intentional but feels different because it doesn't restrict future power.
      * **Term:** **Procedural Self-Entrenchment** (specifically *asymmetric* entrenchment). "Entrenchment" alone is too broad; the self-referential asymmetry is key.

  ### 2. **Temporal Entrenchment & Rule Identity (Second Case)**
      * **Core Problem:** A rule's removal difficulty increases over time, creating a loophole via minor amendments resetting its "age."
      * **Rule Identity Question:** The "one-word trick" exploits ambiguity: **When is an amended rule considered the "same" rule?**  
        - If "same rule" = same conceptual purpose, the trick violates intent.  
        - If "same rule" = identical text, the trick is valid (but defeats the rule's point).  
        **Boundary Cases:**  
        - **Clarifying Edits:** Fixing typos shouldn't reset the clock.  
        - **Substantive vs. Non-Substantive Changes:** Define thresholds (e.g., "changes affecting vote outcomes" reset the clock; cosmetic changes don't).
      * **Term:** **Temporal Graduated Entrenchment** + **Rule Persistence Problem**. This differs from Case 1 by focusing on time and identity, not self-amendment thresholds.

  ### 3. **Voting Paradox of Self-Application (Third Case)**
      * **Core Problem:** Ambiguity about which rule version applies to a vote *on its own enactment*.  
      * **Key Difference:** This is about **indeterminacy** (did it pass?), not unfairness or loopholes.  
      * **Boundary Cases:**  
        - If the vote meets both thresholds → Passes.  
        - If it meets neither → Fails.  
        - **Conflict Zone:** Only ambiguous when between thresholds (as in your case).
      * **Term:** **Self-Application Paradox** or **Bootstrapping Problem**. Distinct from Cases 1 & 2 as it deals with undefined state transitions.

  ---

  ### How to Forbid These in Your New Binder
  1. **Hierarchy:** Create a **"Constitutional Tier"** (e.g., "Rule 0"). Rules governing amendments *must* reside here. Requires higher thresholds to change (e.g., 2/3) and can forbid asymmetric self-amendment.  
  2. **Define Rule Identity:**  
     - "A rule is considered amended if [criteria, e.g., 'any change to its operative clauses']."  
     - "Amended rules reset all temporal conditions (e.g., age counters)."  
     *Alternatively:* "Temporal protections apply to the rule's *purpose*; minor edits don't reset the clock."  
  3. **Resolve Self-Application:**  
     - "Votes to change Rule 0 require [X] threshold. If a proposal receives votes between simple majority and X, it fails."  
     - Or: "The existing threshold applies to its own amendment."  

  ---

  ### Summary of Terms & Boundaries
  | Case | Core Issue                     | Key Terms                          | Boundary Test                                  |
  |------|--------------------------------|------------------------------------|-----------------------------------------------|
  | 1    | Self-amendment raising future bars | **Asymmetric Self-Entrenchment** | Symmetry in thresholds removes objection.       |
  | 2    | Aging rules + amendment tricks | **Temporal Entrenchment** + **Rule Persistence** | Define "amendment" vs. "new rule" in your text. |
  | 3    | Which rule counts the vote?    | **Self-Application Paradox**       | Specify threshold for meta-rule changes.        |

  These patterns are interrelated through **meta-rules** (rules about rules) but address distinct problems: self-empowerment (Case 1), identity/time (Case 2), and indeterminacy (Case 3). By creating a Constitutional Tier with clear amendment procedures and rule identity definitions, you can avoid all three.
