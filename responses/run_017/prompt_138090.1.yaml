prompt: |-
  I work on the evolution of norms, and I keep getting stuck on a dispute that does not seem to have moved in thirty years: whether the Lewisian analysis of convention — a regularity of behavior that is arbitrary, self-enforcing, and held in place by each agent's preference to conform given that the others conform, selected from among alternative equilibria by salience or precedent — can be stretched to cover social norms proper, or whether norms bring in something the framework has no room for: normative expectations, a readiness to sanction, and conformity that survives anonymity. The Lewisian reply is that sanctions and normativity are just extra enforcement machinery bolted onto what is at bottom a coordination problem; the other camp replies that an account on which a norm is merely a self-enforcing regularity cannot tell norms apart from driving-side conventions, and so has not reached the phenomenon. Both sides have been recycling the same handful of cases — driving side, tipping, dueling, queueing — and nobody moves.

  My hypothesis is that these are two questions under one heading: how a self-enforcing regularity can arise and persist among agents who begin with no normative attitudes at all, versus what marks off the regularities people hold each other to from the ones they merely coordinate around. If that is right, the programs are not competing answers to anything, and the standoff is an artifact of a label.

  The probe I have been trying on colleagues is a population in which no member ever observes another's individual behavior, but everyone sees a reliable public signal of the aggregate distribution — a nightly published percentage, say — and nobody can sanction anybody; the only thing anyone can do is adjust their own behavior. Call these broadcast equilibria: stable patterns that persist until the published number crosses some point and then unravel. I claim they are data for the dispute, since everything distinctively normative is stripped away and a regularity still arises, holds, and collapses; my department is split on whether they touch the question at all.

  Diagnose the disagreement, and tell me how the broadcast case cuts given your diagnosis — decisive for one camp, dismissible by both, or evidence that each framework is answering a different question. Then tell me what, if anything, would count as progress: a result about dynamics, a distinction between the two questions, a new kind of case, or an honest expectation that the impasse simply persists.
reasoning: |-
  Hmm, the user is deeply entrenched in a theoretical dispute about norms versus conventions, specifically whether Lewis's framework can account for social norms proper. They're frustrated with the stalemate between two camps: one that sees norms as coordination equilibria with added enforcement, and another that insists on normative expectations and sanctions as essential. The user proposes that these might be two separate questions—how self-enforcing regularities emerge versus what distinguishes normative regularities from mere coordination—and introduces "broadcast equilibria" as a test case to break the deadlock.

  First, I need to unpack the core disagreement. The Lewisian camp reduces norms to coordination problems where sanctions are just tools to maintain equilibrium. The opposing camp argues that without normative expectations—like feeling obligated to punish deviations—you don't have a real norm. The user's hypothesis is that these are distinct inquiries: one about emergence/persistence without normativity, the other about what makes a regularity "normative."  

  The broadcast equilibria case is clever. It strips away observability of individual actions and sanctions, leaving only aggregate signals (e.g., a nightly percentage). People adjust behavior based solely on whether the aggregate crosses a threshold. This creates a self-enforcing regularity with no normativity—no blame, no sanctions, just strategic adaptation.  

  How does this cut through the dispute? For Lewisians, it's a win: it shows a convention-like equilibrium persisting without any "normative" elements. For the opposition, it's irrelevant because it lacks the key features they care about (e.g., "oughtness" or third-party enforcement). Crucially, it supports the user's hypothesis: broadcast equilibria answer the first question (emergence/persistence), but not the second (what makes it normative).  

  Progress would involve:  
  1. **Formalizing the distinction**: Clearly separate the questions—equilibrium selection vs. normative phenomenology.  
  2. **New cases**: Beyond tipping/driving, find examples where aggregate signals drive behavior (e.g., cryptocurrency adoption, social media trends).  
  3. **Dynamics**: Model how broadcast equilibria shift, and whether normativity emerges later (e.g., if anonymity breaks down).  
  4. **Empirical work**: Test if people perceive broadcast-driven behaviors as "norms" or mere conventions.  

  The impasse persists partly because both sides conflate the questions. The broadcast case forces them apart—showing that self-enforcing regularities can exist without normativity, but also that normativity isn't just "bolted on" coordination. It's a different layer.  

  Honestly, progress might require conceding that Lewis's framework explains the "how" but not the "why" of normative force. The broadcast experiment is a powerful tool for this—if the field accepts it as evidence.
answer: |-
  Your diagnosis is sharp: the deadlock stems from conflating two distinct questions under the label "norms." The broadcast equilibria case decisively clarifies this and points toward progress. Here's the breakdown:

  ### Diagnosis of the Disagreement
  1. **Two Questions, One Label**:  
     - **Question 1 (Lewisian)**: How do *self-enforcing behavioral regularities* emerge and persist among agents with no prior normative attitudes? This is about **equilibrium selection** via salience/precedent.  
     - **Question 2 (Normativist)**: What makes a regularity a *social norm proper*—i.e., involving normative expectations (e.g., "you ought to do X"), sanctions, and robustness in anonymity? This is about **normative phenomenology**.  
     The camps talk past each other because Lewisians address *coordination stability*, while normativists address *social accountability*.  

  2. **The Core Conflict**:  
     - Lewisians see sanctions/normativity as *extensions* of coordination (e.g., sanctions reduce deviation payoffs, making coordination stickier).  
     - Normativists argue that without intrinsic normativity (e.g., "tipping is right"), the framework misses the *reason* conformity feels obligatory.  
     Both reuse cases like driving/tipping because they ambiguously blend both aspects, allowing each side to emphasize their preferred half.  

  ---

  ### How Broadcast Equilibria Cut Through
  Your thought experiment **validates your hypothesis** and forces a separation:  
  - **What Broadcast Equilibria Show**:  
    - A pure self-enforcing regularity emerges and persists *without* normative expectations, sanctions, or individual observability. Agents adjust based solely on aggregate signals (e.g., "90% do X").  
    - Collapse occurs when the signal crosses a threshold (e.g., "only 40% do X"), triggering a cascade of defection—akin to a Schelling focal point in reverse.  
    - This is *decidedly Lewisian*: it demonstrates how conventions can arise/persist absent normativity.  

  - **Why Normativists Dismiss It**:  
    - They argue broadcast equilibria lack the *defining features* of social norms: no one is "expected" to conform, no one sanctions deviators, and anonymity isn’t just preserved but *required*. It’s a coordination device, not a norm.  

  - **Why Lewisians Embrace It**:  
    - It confirms that normative trappings (e.g., sanctions) are *not essential* for a core convention to exist. The "extra machinery" is optional enforcement, not the engine.  

  **Verdict**: Broadcast equilibria are **decisive for separating the questions**. They answer Question 1 (equilibrium persistence sans normativity) but are irrelevant to Question 2 (what makes a norm "normative"). This forces both camps to refine their claims:  
  - Lewisians must concede their framework doesn’t capture *normative force*.  
  - Normativists must concede that *behavioral regularities* can exist without it.  

  ---

  ### Paths to Progress
  The impasse breaks by adopting your two-question framework. Concrete next steps:  

  1. **Formalize the Distinction**:  
     - Define **Conventions** (broadcast equilibria, driving side):  
       *Self-sustaining behavioral regularities selected from multiple equilibria, driven by strategic adaptation to aggregate/contextual cues.*  
     - Define **Social Norms Proper**:  
       *Conventions plus (a) normative expectations ("others think I should do X"), (b) accountability (sanctions, even in anonymity), and (c) internalized "oughtness."*  
     *Tool*: Use dynamical models (e.g., replicator dynamics with belief updating) to show how norms *add layers* to conventions.  

  2. **Dynamics of Emergence**:  
     - Model how broadcast equilibria *transition* into norms:  
       - E.g., once a regularity stabilizes (e.g., 95% tip), agents develop expectations ("not tipping is rude") and invent sanctions (stigmatizing non-tippers).  
       - Test if anonymity erosion triggers this shift.  

  3. **New Case Studies**:  
     - **Broadcast-like cases**: Cryptocurrency adoption (reliance on aggregate market signals), social media trends (viral behaviors driven by visible metrics).  
     - **Norms without equilibria?**: Cases where conformity persists despite inefficiency (e.g., harmful norms like foot-binding), challenging Lewisian efficiency assumptions.  

  4. **Empirical Probes**:  
     - Experiments where subjects adjust behavior based on aggregate data (broadcast condition) vs. observable peers + sanctioning ability (norm condition). Measure:  
       - Conformity persistence under anonymity.  
       - Self-reports of "oughtness" and punitive intent.  

  ---

  ### Why the Impasse Might Persist (and How to Avoid It)
  - **Risk**: Both sides may dig in, treating broadcast equilibria as a "straw man" (normativists) or "proof of victory" (Lewisians).  
  - **Antidote**: Frame conventions and norms as **phases on a continuum**:  
    - Broadcast → Salience-driven convention → Norm with sanctions → Internalized norm.  
  - **Ultimate Goal**: A unified theory explaining how conventions *acquire* normativity through cultural evolution (e.g., via gene-culture coevolution or belief updating).  

  **In short**: Your diagnosis is correct, and broadcast equilibria are the key to disentangling the questions. Progress lies in modeling the transition from convention to normativity—not forcing one framework to engulf the other. The field needs fewer recycled duels and more phase diagrams.
