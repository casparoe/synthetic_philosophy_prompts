  Key features of the design:
  1. Uncertainty about the number of legs: We use a sealed envelope with a random number of legs (6,7,8,9,10) to prevent players from knowing the final node.
  2. Pre-play questionnaire: Each student answers a hypothetical about what they think would happen at a late node (node 5) if reached.
  3. Option for cheap talk: Half the pairs can exchange one non-binding public sentence before playing, the other half cannot.

  We'll use chocolate bars as incentives (or bonus credit if chocolate isn't feasible). The payoff structure must be clear and balanced so that passing is tempting but the backward induction logic should still hold in expectation.

  Revised payoff structure to avoid obvious passing:
  - The pot starts at 4 points (or units) and increases by 3 every time a player passes.
  - When a player takes (grabs), the taker gets 60% of the current pot, the other player gets 40%.
  - If the game reaches the last node (the one specified by the envelope) and the player at that node passes, then the pot is split 50/50. If the player at the last node takes, then the split is 60/40 as usual.

