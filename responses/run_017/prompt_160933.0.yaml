prompt: |-
  I sit on a municipal commission that has one year to recommend what to do with a backlog of contested commemorations: two statues, a school name, a couple of street names, a university hall named for a benefactor who also funded eugenics research, and a monument whose subject is unobjectionable but that was erected by a deposed regime partly as propaganda. We can only recommend; the council decides, and we will have to act while the disagreement about what we owe the past is still live. Before we hear from any more interested parties, I want a specification rather than a verdict.

  Write the desiderata that a theory of commemoration would have to meet to be usable by a body like mine: the cases it must handle, the distinctions it must respect, the things about how public honoring actually works that it cannot contradict, and the reason each item is a genuine requirement rather than a prejudice of one camp. Among the claims I want you to test rather than assume: whether honoring is a zero-sum allocation of a scarce stock of public recognition, so that adding one name is a cost to others; whether a monument's meaning is fixed by its makers' intentions or can accumulate meaning from what later happens at the site; the difference between commemorating a victim, a perpetrator, and a collective such as a regiment, a company, or a founding generation, where no individual's record settles the case; whether removal, relocation, recontextualization in place, and adding a second monument nearby are genuinely distinct options or the same option with different costs; and what a commission owes a minority whose heroes keep losing under majority rule.

  Then flag any pair of desiderata you think cannot be jointly satisfied — I suspect administrability by nonhistorians and case-by-case sensitivity pull apart, and that treating like cases alike conflicts with deferring to local attachment — and say which single requirement does the most to exclude candidate theories. You may score the usual strategies (leave everything, remove everything objectionable, contextualize in place, move to museums) against the list, but keep that to a few lines; the criteria are what I need.

  Separate what is settled here from what is genuinely contested among people who work on the topic, and do not present a contested position as the consensus; where you are unsure, say so. Please write in British English.
reasoning: |-
  Hmm, this is a complex and nuanced request about developing criteria for handling contested commemorations. The user sits on a municipal commission facing multiple cases - statues, school names, street names - with only one year to make recommendations. They're asking for desiderata (essential requirements) that any theory of commemoration must meet to be practical for their situation.

  Key challenges they've highlighted include: whether public recognition is zero-sum, how monument meanings evolve over time, distinctions between commemorating different types of historical figures, and what they owe minorities in majority-rule decisions. They specifically want me to test common assumptions rather than accept them as given.

  The user seems highly sophisticated - likely an academic or policy professional given their precise language about "desiderata" and "verdict versus specification." Their emotional state appears professionally anxious about the tight deadline and contentious nature of the work. The core unspoken need might be for a neutral framework that can withstand scrutiny from all sides.

  For the desiderata, I need to cover:
  - Case coverage (must handle all their examples)
  - Conceptual distinctions (victim vs perpetrator etc.)
  - Operational realities (how commemoration actually functions publicly)
  - Avoiding ideological bias (each requirement justified neutrally)

  Special attention needed to their flagged tensions: 
  - Whether recognition is zero-sum (I lean toward "not inherently" but context-dependent)
  - Meaning determination (likely both original intent and evolving interpretations matter)
  - Collective commemoration paradoxes
  - Implementation options (removal vs contextualization etc. are meaningfully different)

  I should particularly examine the conflicts they suspect between administrability and sensitivity, and between consistency and local attachment. The requirement that might exclude most theories is likely the one about contested meanings - many approaches oversimplify this.

  For structure:
  First list the indispensable requirements with clear justifications
  Then identify irreconcilable tensions
  Finally briefly score common strategies against the criteria
  Crucially distinguish settled points from academic debates throughout

  Language must be British English as requested ("council" not "city council", "whilst" not "while" etc.). Tone should remain professionally neutral while acknowledging the political minefield they're navigating.
answer: |-
  Here is a specification of desiderata for a theory of commemoration suitable for your municipal commission, written in British English. It focuses on essential requirements, tests contested claims, identifies tensions, and distinguishes settled from contested ground.

  **I. Indispensable Desiderata (Must-Handle Requirements):**

  1.  **Case Coverage:** Must provide principled guidance for *all* contested types encountered: individual statues, named buildings/schools, street names, monuments with contested origins/associations (e.g., the propagandistic monument, the benefactor with dual legacy), and collective commemorations (regiments, companies, generations). *Requirement:* Practical applicability; failure excludes common real-world cases.
  2.  **Meaning Determination:** Must account for both **original intent** (the reason for erection/naming, including propaganda aims or specific virtues celebrated) *and* **evolved/received meaning** (how the commemoration functions *now*, including associations accrued through historical events, public perception, or use of the site). Cannot assume meaning is solely fixed at creation *or* infinitely malleable by current interpretation. *Requirement:* Reflects historical reality and public experience; ignoring either dimension misrepresents the object's significance.
  3.  **Agent Distinction:** Must provide clear, operational criteria for distinguishing between commemorating:
      *   **Victims/Suffering:** (Requires sensitivity to trauma, representation).
      *   **Perpetrators/Harm-doers:** (Requires confronting harm, assessing culpability and legacy).
      *   **Benefactors with Complex Legacies:** (Requires weighing positive contributions against negative actions/associations).
      *   **Collectives (Regiments, Companies, Generations):** (Requires assessing collective action/purpose, symbolic representation, and whether individual exoneration negates collective responsibility, or vice-versa). *Requirement:* Different ethical and historical considerations apply; lumping them together leads to incoherent outcomes.
  4.  **Option Differentiation:** Must treat **Removal, Relocation, Recontextualisation (in-situ), and Addition (counter-monument/plaque)** as distinct options with potentially different *symbolic meanings and impacts*, not merely as cost variants of the same action. *Requirement:* Each action sends a different public message about the past and its relationship to the present; conflating them ignores the communicative function of public space.
  5.  **Non-Zero-Sum Recognition:** Must *test* the assumption that public commemoration is a zero-sum game. Cannot *assume* adding one honour inherently diminishes others, nor that removal inherently creates space *only* for direct replacement. *Requirement:* Reflects possibility of additive or transformative approaches; assuming zero-sum often predetermines adversarial outcomes. *(Note: This is contested; some theories *do* assume it's zero-sum, others don't. The theory must justify its position, not assume it).*
  6.  **Procedural Justice for Minorities:** Must articulate what the commission/council owes persistent minorities whose commemorative preferences systematically lose under majoritarian decision-making. *Requirement:* Democratic legitimacy requires more than simple majority rule on issues impacting identity, historical representation, and potential harm; ignoring persistent minority views undermines social cohesion and fairness.
  7.  **Administrability by Non-Experts:** Must yield recommendations utilising evidence (historical research, public consultation) *without requiring commissioners to become expert historians or moral philosophers*. Needs clear thresholds or frameworks for decision-making. *Requirement:* Practical necessity for a time-limited, representative public body.
  8.  **Contested Meaning Tolerance:** Must acknowledge that the meaning and value of historical figures/events *are inherently contestable* and that a single, universally accepted "truth" is often unattainable. The theory must function amidst this contestation. *Requirement:* Reflects the reality of pluralistic societies and historiography; ignoring contestation leads to imposed solutions that lack legitimacy.

  **II. Key Tensions Between Desiderata:**

  1.  **Administrability vs. Case-by-Case Sensitivity (Your Suspicions Confirmed):** A highly administrable framework (e.g., clear rules: "Remove if linked to slavery") risks being insensitive to context (e.g., a complex benefactor, a monument with profoundly altered meaning). A deeply contextual approach sensitive to nuance is harder to administer consistently and quickly.
  2.  **Treating Like Cases Alike vs. Deferring to Local Attachment:** The demand for consistency ("Why treat Statue A differently from Statue B?") clashes with the unique history, local significance, and community attachment (positive or negative) specific to *each* object and site. Strong local feeling might demand an exception to a general rule, or vice-versa.
  3.  **Procedural Justice for Minorities vs. Democratic Mandate:** Ensuring minorities aren't perpetually overruled may require mechanisms (e.g., supermajorities, veto points, reserved spaces) that conflict with straightforward majoritarian decision-making by the council, potentially seen as undermining the democratic process.

  **III. The Most Excluding Requirement:**

  **Contested Meaning Tolerance (#8)** likely excludes the most candidate theories. Theories offering singular, definitive verdicts on history (e.g., purely presentist condemnation or rigid originalism) fail because they cannot grapple with legitimate, ongoing debate. Theories predicated on discovering an undisputed historical "truth" applicable to commemoration are also excluded by this requirement.

  **IV. Settled vs. Contested Ground:**

  *   **Settled (Wide Consensus):**
      *   Commemorations have public, communicative functions beyond mere historical record.
      *   Intentions of the erectors/naming bodies are *relevant* to understanding a commemoration.
      *   Historical context is essential for evaluation.
      *   Public consultation is a necessary part of the process for public bodies.
      *   Monuments/names *can* cause genuine harm and offence; this is a legitimate public concern.
      *   There is no single, monolithic "public memory"; it is plural and contested.
  *   **Genuinely Contested (No Consensus):**
      *   **Is recognition zero-sum?** (Strong arguments both ways; depends on theory of public space/resources).
      *   **Primary determinant of meaning:** Intent vs. Reception vs. Evolving context? (Fundamental theoretical split).
      *   **Moral statute of limitations:** How far back does culpability for commemoration extend? How do we weigh past standards?
      *   **The primary purpose of public commemoration:** Is it primarily about honouring virtue, teaching history, representing community identity, or fostering civic values? Different purposes imply different criteria.
      *   **The ontological status of collectives:** Can a regiment/company/founding generation *as a collective entity* be held responsible or deemed worthy of honour in a way distinct from the sum of its parts? (Deep philosophical divide).
      *   **The effectiveness of recontextualisation:** Does adding a plaque or counter-monument genuinely transform the meaning of the original for the public, or does the original often dominate? (Empirical and theoretical dispute).

  **V. Brief Scoring of Common Strategies (Against the List):**

  *   **Leave Everything:** Fails #3 (Distinction), #5 (Assumes non-zero-sum? But ignores harm), #6 (Minorities), #8 (Ignores contestation). Strong on #7 (Admin).
  *   **Remove Everything Objectionable:** Fails #2 (Ignores evolved meaning), #4 (Ignores options), #7 (Defining "objectionable" is hard), #8 (Assumes uncontested verdict). Strong on #6 (if minority defines objection).
  *   **Contextualise In Place:** Meets #2, #4, #8 well. Struggles with #3 (Complexity), #5 (Cost?), #6 (May not satisfy minorities), #7 (Design/effectiveness hard).
  *   **Move to Museums:** Meets #1, #4. Struggles with #2 (Changes meaning radically), #5 (Costly), #6 (May feel like erasure/victory), #7 (Finding suitable museums hard). Addresses harm by removal but loses original public context.

  This specification provides the necessary framework to rigorously evaluate potential approaches for your commission, highlighting the genuine challenges and avoiding presupposing contested answers. Good luck with your vital work.
