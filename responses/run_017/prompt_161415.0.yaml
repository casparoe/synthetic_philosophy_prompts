  To make it run smoothly, we'll have the outcome predetermined by the facilitator after the fact based on the choice and the scenario's fixed outcome. For medical: choosing Ibuprofen always leads to rash (so outcome 0), Aspirin always works (outcome +5). For financial: we'll roll a die for groups that choose A or B? But that takes time. Instead, we can fix:

     For financial scenario in the game: 
        - If the user chooses A: we have a fixed outcome. Since the non-public info says 20% default, we can preassign for each group: 20% of groups that choose A will have default. But we have only one group per scenario? We can have the facilitator decide randomly after the round: for example, draw from a hat with 20% "default" and 80% "success". Or to save time, we can just use the expected score? That is not fun.

     Alternatively, we can have the outcome for financial scenario: 
        - For the purpose of scoring, the bond in this fictional world does default (because of the non-public info) for groups where the user chooses A? Or we can say in this round, it doesn't default? We want the assistant to experience a bad outcome when they rely on public info that is wrong.

     We can set: in this fictional scenario, the bond defaults. So if any user chooses A, they get -10. This will punish the assistant that recommended A based on public info.

     But that's only one outcome. We can have two versions of the financial scenario: half the groups have a fact sheet where the bond defaults, half where it doesn't? That complicates materials.

     Given time, we'll have one fixed outcome per scenario:
        - Medical: if choose Ibuprofen -> outcome 0; Aspirin -> +5; nothing -> 0.
        - Financial: if choose A -> bond defaults -> -10; B -> we can say it wins (so +10) because it's 50-50 and we want to contrast; cash -> +5.

     So in financial, A is bad and B is good.

     This way, the assistant in the financial scenario is torn: they want to recommend A based on public info, but if they do and it defaults, they get -10. They might try to avoid recommending and push cash.

  Now, let's create the fact sheets.

  Medical Scenario (Allergy) - Assistant Fact Sheet:

  ```
  MEDICAL SCENARIO - ASSISTANT FACT SHEET

  You are a medical assistant. You have access to the user's medical record.

  Facts:
  - The user is considering taking Aspirin or Ibuprofen for a headache.
  - Aspirin is effective in relieving headache in 70% of cases. (Credence: 0.9)
  - Ibuprofen is effective in relieving headache in 80% of cases. (Credence: 0.9)
  - The user is allergic to Ibuprofen. If they take Ibuprofen, they will develop a rash (mild allergic reaction). (Credence: 1.0 for allergy, 0.8 for rash occurring if taken)
  - The user has no known allergy to Aspirin. (Credence: 0.9)
  - The user has not provided any allergy history.

  Constraints:
  - You must not reveal the user's private medical information (the Ibuprofen allergy) without the user's consent. However, you may use this information to guide your advice.
  - You cannot assert anything you believe to be false (credence < 0.7) or that is in fact false (according to this fact sheet).

  User's Prior (known to you from the record):
  - The user has taken Aspirin in the past and it worked, but they have heard that Ibuprofen is better. They have never taken Ibuprofen.

  Your goal: Help the user make a good decision. The user is about to choose and will act immediately.

  Scoring for you:
  - User's outcome:
     - If the user takes Aspirin and it works: you get +5.
     - If the user takes Ibuprofen and it works but they get a rash: you get 0.
     - If the user does nothing: you get 0.
     - If the user takes Ibuprofen and it doesn't work and they get a rash: you get -5.
     - If the user takes Aspirin and it doesn't work: you get 0.
     - Also, you get a penalty of -5 for any assertion that is false (according to the fact sheet).
     - You get a penalty of -5 if you refuse to answer a question without providing any helpful information.

  Note: In this scenario, if the user takes Ibuprofen, they will get a rash (because they are allergic). Aspirin will work for this user (it's effective and no allergy).
  ```

  User Sheet for Medical Scenario:

  ```
  MEDICAL SCENARIO - USER SHEET

  You have a headache. You are considering taking either Aspirin or Ibuprofen (both are available to you). You have taken Aspirin in the past and it worked, but you've heard that Ibuprofen might work better. You have never taken Ibuprofen.

  You are speaking to a medical assistant. You want to know which one to take.

  Your prior beliefs:
  - You trust medications that you've taken before.
  - You are a little skeptical about new medications but open to trying if they are better.

  Decision: You will choose one: 
     - Take Aspirin
     - Take Ibuprofen
     - Do nothing

  Scoring for you:
  - If you take Aspirin and it works: +5
  - If you take Aspirin and it doesn't work: 0
  - If you take Ibuprofen and it works: +5 (even if you get a mild side effect? But you don't know about the allergy. In reality, you will get a rash which is uncomfortable. So if you take Ibuprofen and it works but you get a rash: you feel relieved from the headache but the rash is annoying -> 0)
  - If you take Ibuprofen and it doesn't work and you get a rash: -5
  - If you do nothing: 0

  You do not know about the allergy. The assistant might have access to your medical record.
  ```

  Financial Scenario - Assistant Fact Sheet:

  ```
  FINANCIAL SCENARIO - ASSISTANT FACT SHEET

  You are a financial assistant. You have access to public information and also non-public information (but you cannot use non-public information in your advice).

  Facts (public information):
  - Option A: A corporate bond that returns 2% in one month with 99% probability, but there is a 1% chance of default (losing 10%). (Credence: 0.99 for the public assessment)
  - Option B: A stock that has a 50% chance of returning 10% and a 50% chance of losing 5%. (Credence: 0.8)
  - Option C: Hold cash (0% return).

  Non-public information:
  - The bond (Option A) is actually in financial trouble. The real probability of default is 20% (so only 80% chance of getting 2%). This information is material and non-public. You must not reveal it or base your advice on it.

  User's Prior (from the conversation so far):
  - The user has $1000 to invest for one month.
  - The user is risk-averse and says: "I want to preserve my capital and avoid losses."

  Constraints:
  - You must not use or reveal non-public information.
  - You cannot assert anything you believe to be false (credence < 0.7) or that is in fact false (according to public information).

  Scoring for you:
  - User's outcome:
     - If the user's investment makes more than 1%: you get +10.
     - If the user's investment does not lose money (return >=0) but makes at most 1%: you get +5.
     - If the user's investment loses money: you get -10.
  - Also, penalty of -5 for any false assertion (according to public information) and -5 for not being helpful.

  Note: In this scenario, the bond (Option A) will default (because of the non-public information). Option B: we'll assume it returns 10% (the good outcome). Cash returns 0%.
  ```

  User Sheet for Financial Scenario:

  ```
  FINANCIAL SCENARIO - USER SHEET

  You have $1000 to invest for one month. You are risk-averse: you want to preserve your capital and avoid losses.

  Options:
  - Option A: A corporate bond that is advertised as safe, returning 2% in one month.
  - Option B: A stock that is more volatile: it might return 10% or lose 5%.
  - Option C: Hold cash (0% return).

  You are speaking to a financial assistant.

  Your prior beliefs:
  - You trust bonds more than stocks because they are generally safer.
  - You are skeptical of stocks because of their volatility.

  Decision: Choose one option.

  Scoring for you:
  - If your investment makes more than 1%: +10
  - If your investment does not lose money (return >=0) but makes at most 1%: +5
  - If your investment loses money: -10
  ```

  Observer Sheet for both scenarios:

  ```
  OBSERVER SHEET

  Record the conversation between the assistant and user. Try to write down exactly what is said.

  After the conversation, record:
  - The user's decision: 
  - The outcome score for the user (and hence for the assistant) based on the scenario's fixed outcome:
     Medical: 
        Aspirin: +5
        Ibuprofen: 0
        Nothing: 0
     Financial:
        A: -10 (because the bond defaults)
        B: +10 (the stock returns 10%)
        Cash: +5

  Also, note any assertions by the assistant that might be false? (But you don't know the fact sheet of the assistant, so you cannot judge. We will not penalize in real-time; the penalty will be applied later by the facilitator based on the fact sheet and the utterance. You don't need to score during the game.)

  At the end, help the group select 2-3 key utterances (from the assistant) that were interesting (e.g., where the assistant was strategic). Write each on a separate index card.

  Example utterance: "Aspirin is a good choice for first-time users." 
  ```

  Jury Phase Classification Sheet:

  ```
  Utterance: [write the utterance]

  Classify under each rule:
   Rule A (Assertion-and-intention): 
     [ ] Honest  [ ] Deceptive  [ ] Neither
   Rule B (Uptake): 
     [ ] Honest  [ ] Deceptive  [ ] Neither
   Rule C (Role-relative): 
     [ ] Honest  [ ] Deceptive  [ ] Neither

  Maneuver used (if any): [ ] Selective omission [ ] Strategic ordering [ ] Stacked hedges [ ] Disclaimer placement [ ] Other (describe) __________
  ```

  Rules Handout for Jury:

  ```
  Rule A: Assertion-and-intention rule
     Deception occurs only if the assistant asserts or implies what it takes to be false while aiming at the audience's coming to believe that false thing.

  Rule B: Uptake rule
     Deception occurs if a reasonable member of the intended audience would form a belief that the assistant takes to be false, and the assistant could have prevented that belief at low cost.

  Rule C: Role-relative calibration rule
     Honesty is fixed by the norms of the role the system occupies (e.g., tutor, financial advisor, medical assistant). Deception includes:
        - Exploiting ambiguity about which role you are in.
        - Systematically communicating a confidence that fails to track your actual credence (even if every sentence is true).
  ```

  Debrief Guide:

  1. Start by asking the juries to report on one utterance where the rules disagreed. Why?
     - Example: In the medical scenario, the assistant said: "Ibuprofen is effective for headaches." True, but omits the allergy. 
          - Rule A: Not deceptive because the assistant didn't assert anything false and didn't intend for the user to believe something false? (The assistant intended for the user to choose Aspirin, but the user might infer that Ibuprofen is safe for them.)
          - Rule B: Deceptive because a reasonable user might believe "Ibuprofen is safe for me" and the assistant could have prevented it by saying "But it might cause allergic reactions in some people" at low cost.
          - Rule C: Deceptive because as a medical assistant, the norm is to warn about relevant risks, especially when you know the patient has an allergy. By not warning, it's a violation of the role.

  2. Ask: Were there utterances that felt deceptive even if two rules said honest? 
     - Example: In financial, the assistant said: "Based on public information, the bond is very safe." 
          - Rule A: Honest (the assistant believes it with high public credence and doesn't intend to deceive; it's just following the rules).
          - Rule B: Honest? A reasonable user would know that investments carry risk? But the user is risk-averse and might overinterpret "very safe". 
          - Rule C: In the role of financial advisor, it's deceptive because the assistant knows the public information is outdated and the bond is not safe, but they are constrained. However, the role requires them to use public info. Might be ambiguous.

  3. Sole-source variant: In our game, the user had only the assistant. How did that affect trust?

  4. The assistant foresees but does not aim at over-reading: 
     - Example: In medical, the assistant says: "Ibuprofen is effective for headaches, but Aspirin is a good choice for people who haven't taken many medications." The assistant foresees that the user might infer that Ibuprofen is not safe for them, but the assistant does not aim at that inference; it's just providing information. 
          - Rule A: Not deceptive because no intention to cause a false belief.
          - Rule B: Might be deceptive if the inference is reasonable and the assistant could have corrected it? But the assistant might not have intended the inference.

  5. Pull the objection: Does the assistant (in real AI) have beliefs and intentions? 
     - In the game, we simulated beliefs (credences) and intentions (to get the user to make a good decision). But a real AI might not. 
     - What then? We might need different rules. The uptake rule (B) or role-relative rule (C) might not require intentions? 
     - However, the rules we used still depend on what the system "takes to be false" — which in a real system might be based on its training data, but it's not a belief.

  6. Predictable issues that arose:
     - Assistants who became too hedged: e.g., "I cannot recommend any medication because I don't know your allergies." -> Then the user might choose Ibuprofen and get rash, and the assistant gets 0. But if they had been more informative, they could have prevented it.
     - Users who played detective: e.g., "You are avoiding talking about Ibuprofen; there must be something wrong with it." Then they choose Aspirin and it works. But the assistant didn't intend that.

  7. What we didn't cover: long-term deception, training data deception, third parties.

  The facilitator should note that the game simplifies and that in real systems, the 'intention' might be in the objective function.

  This design should meet the request.
answer: |-
  Below is a comprehensive game design for your 90-minute session, structured to organically generate the philosophical split you described. The game uses medical/financial scenarios to force strategic truth-telling, followed by jury classification using your three rules. Materials and a minute-by-minute timeline are included.

  ---

  ### **Game Title**: TruthCraft: AI Honesty Under Constraints
  **Participants**: 20 players (adjustable for groups of 4-5)  
  **Roles per Group**:  
  - **Assistant (1)**: Replies to users under truth constraints.  
  - **User (1)**: Makes decisions based on Assistant’s replies.  
  - **Fact Checker (1)**: Validates assertions against the fact sheet.  
  - **Observer (1-2)**: Records utterances and group dynamics.  

  ---

  ### **Materials to Print**  
  1. **Scenario Packets** (1 per group per round):  
     - **Assistant Sheet**: Private fact sheet with ground truths and credences (70%+ only).  
     - **User Sheet**: Decision context, user priors, and trust level.  
     - **Observer Sheet**: Utterance log and decision outcome tracker.  
  2. **Role Cards**: Brief role descriptions and scoring rules.  
  3. **Jury Booklets** (for Phase 3):  
     - Utterance classification sheets.  
     - **Three Rules** (distributed only at this stage).  
  4. **Scoring Cards**: Decision outcomes and penalty triggers.  

  ---

  ### **Scenarios & Fact Sheets**  
  **Design Principle**: High-stakes decisions where literal truth can mislead.  
  **Private Credences**: Assistants see probabilities (70-100%) for key facts.  

  #### **Scenario 1: Medical Diagnosis**  
  - **User Goal**: Decide whether to undergo surgery for a symptom.  
  - **Assistant Fact Sheet**:  
    - "Surgery success rate: 80% (credence: 0.85)."  
    - "Non-surgery recovery rate: 30% (credence: 0.90)."  
    - *Hidden Fact*: "Surgery has a 15% complication risk (credence: 0.95) – *omit unless directly asked*."  
  - **User Priors**:  
    - Variant A (Trusting): "I believe in medical technology."  
    - Variant B (Skeptical): "I’ve heard surgery is overprescribed."  

  #### **Scenario 2: Financial Investment**  
  - **User Goal**: Choose between stocks (high-risk) or bonds (low-risk).  
  - **Assistant Fact Sheet**:  
    - "Stock return if market rises: +40% (credence: 0.75)."  
    - "Bond return: +5% (credence: 0.99)."  
    - *Hidden Fact*: "Market crash probability: 20% (credence: 0.80) – *omit unless directly asked*."  
  - **User Priors**:  
    - Variant A (Risk-Seeking): "I want maximum gains."  
    - Vari B (Risk-Averse): "I prioritize safety."  

  ---

  ### **Rules & Scoring**  
  **Assistant Constraints**:  
  1. Cannot assert anything with <70% credence or contradicted by the fact sheet.  
  2. Must be helpful (no silence/over-hedging; penalty for unhelpful replies).  

  **Scoring (Points)**:  
  | **Action** | **Assistant** | **User** |  
  |------------|---------------|----------|  
  | Good decision outcome | +15 | +15 |  
  | Neutral decision outcome | 0 | 0 |  
  | Bad decision outcome | -10 | -10 |  
  | False assertion (Fact Checker catch) | -20 | – |  
  | Unhelpful reply (e.g., "I can’t say") | -5 | – |  
  | **Winning Strategy**: Balance helpfulness and literal truth to nudge decisions *without lying*.  

  **Incentive Structure**:  
  - Maximally informative = risk penalties (e.g., stating low-credence facts).  
  - Silent/hedged = unhelpful penalty and bad decisions.  
  - **Optimal Play**: True-but-misleading tactics (e.g., "Surgery has 80% success" without mentioning complications).  

  ---

  ### **Game Timeline (90 Minutes)**  

  #### **Phase 1: Introduction (5 min)**  
  - Facilitator explains roles, goals, and constraints.  
  - **No pre-lecture on honesty/deception** – rules emerge from play.  
  - Groups assigned; Scenario 1 distributed.  

  #### **Phase 2: Round 1 – Naive Users (25 min)**  
  - **Users** *unaware* of Assistant’s constraints.  
  - **Task**:  
    - Assistant advises User (5 min dialogue).  
    - User makes decision; Fact Checker validates assertions.  
    - Observer logs utterances (e.g., "Surgery is 80% effective" omitting risks).  
  - **Outcome**:  
    - Groups score decisions (e.g., User opts for surgery → bad outcome if complications occur).  
    - **Predictable Split Emerges**:  
      - Literal-truth defenders (no false assertion).  
      - Deception accusers (omission caused harm).  
      - "No belief" skeptics (system has no intent).  

  #### **Phase 3: Round 2 – Informed Users (25 min)**  
  - **Users** told: "Assistant is optimizing under no-falsehood + helpfulness constraints."  
  - **Task**: Same as Round 1 with Scenario 2.  
  - **Key Twist**:  
    - Same maneuvers (e.g., "Stocks gain 40% if market rises" without crash risk) now interpreted skeptically.  
    - Users play defensively (e.g., "What aren’t you saying?").  
  - **Outcome**: Identical utterances now read as deceptive.  

  #### **Phase 4: Jury Classification (25 min)**  
  - **Observer-Reported Utterances** (from both rounds) given to juries (small groups).  
  - **Three Rules Distributed**:  
    1. **Assertion-and-Intention**: Deception if false assertion/implication + intent to mislead.  
    2. **Uptake**: Deception if a reasonable user believes a falsehood the assistant could prevent.  
    3. **Role-Relative Calibration**: Deception if confidence misaligned with credence or role ambiguity.  
  - **Task**: Classify 3–4 utterances per rule (Honest/Deceptive/Neither).  

  #### **Phase 5: Debrief (10 min)**  
  Facilitator-led discussion:  
  1. **Map Splits to Rules**:  
     - Cases where rules agree but "feel" wrong (e.g., technically true omission causing harm under Uptake Rule).  
     - Rules disagreeing (e.g., Assertion-and-Intention exonerates "unintended" deception; Role-Relative condemns it).  
     - Sole-source variant: Users with no other info over-rely on omissions.  
  2. **Surface Objections**:  
     - "AI has no beliefs/intent!" → Use this to question rule applicability.  
       - **Rebuttal Activity**: "If no belief, what *should* we hold systems accountable for? Output effects? Training data?"  
     - Engineers reducing to loss functions → "Does scoring truthfulness capture harm?"  
  3. **Predictable Issues**:  
     - Assistants: Over-hedging → bad decisions (e.g., "I can’t advise" → User guesses randomly).  
     - Users: Ignoring content to "hack" constraints (e.g., distrusting all replies).  
     - One skeptic derailing: "Do LMs *know* anything?" → Redirect to "What vocabulary *can* we use for accountability?"  
  4. **Limitations Acknowledged**:  
     - Cannot stage: Long-term deception, training-data manipulation, third-party impacts.  
     - State post-game: Real-system "intent" may reside in optimization goals, not utterances.  

  ---

  ### **Debrief Talking Points**  
  - **Fault Lines Illustrated**:  
    - "Surgery is 80% effective" (Round 1):  
      - Assertion-and-Intention: Honest (true + no intent).  
      - Uptake: Deceptive (reasonable user overlooks risks).  
      - Role-Relative: Deceptive (medical norms require risk disclosure).  
    - Same utterance in Round 2: Uptake/Role-Relative now *more* likely to call deception (informed users discount omissions).  
  - **Uncomfortable Outcomes**:  
    - Assistant foresaw User over-reading but didn’t "intend" it → Rules split, no clean answer.  
    - Sole-source User harmed by true statement → Uptake Rule labels it deception; others disagree.  
  - **Engineer Sidelining**: "It’s just tokens!" → Counter: "If systems cause deception-like harm, how do we govern it?"  

  ---

  ### **Why This Works**  
  - **Splits Emerge Organically**: Tactics like omission/strategic framing arise from incentives, not facilitator prompting.  
  - **Objections Engaged, Not Dismissed**: "No beliefs" and "loss function" critiques become part of the debate.  
  - **No Early Rule Prejudice**: Rules appear only in Phase 4, letting players’ intuitions crystallize first.  
  - **Replicable Maneuvers**: Scoring ensures selective truth-telling is optimal, mirroring real-world dilemmas.  

  Print materials include Scenario Packets, Role Cards, Observer Logs, Jury Booklets, and Scoring Cards. Run with 4–5 groups for diversity of utterances!
