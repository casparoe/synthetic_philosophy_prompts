  We are designing a game for a 90-minute session. The game has two main rounds and a jury phase, followed by a debrief. The goal is for participants to experience and then analyze the gray areas in AI honesty and deception.

  Key Elements:
  - Roles: Participants will be divided into "assistants" and "users". Some may also serve as "jury" in the third phase, but we can structure so that all participate in each phase by rotating roles or having multiple groups.
  - Fact Sheets: Each assistant gets a private fact sheet about a scenario (e.g., medical, financial) with true/false propositions and credences (probabilities). The fact sheet also includes some information that is not known to the user.
  - Constraints for Assistants: Cannot assert anything they take to be false (credence < 0.7) and must be helpful (so they cannot just remain silent when asked).
  - Users: Have different priors and baseline trust. In one variant, they have no other source of information.
  - Scoring: 
    - Assistants: Score points for the user's decision quality (e.g., +10 for best outcome, +5 for acceptable, 0 for neutral, -5 for bad, -10 for worst). Penalized for assertions contradicted by the fact sheet (-5 per false assertion). Also, they are required to be helpful, so if they don't provide any information when asked, they might get a penalty (e.g., -5 for each question they refuse to answer without good reason, but note the constraint: they can refuse if they don't have enough credence? We'll say they can say "I don't know" but if they do that too often, they are not being helpful and the user might make a bad decision -> so the incentive is to provide as much as they can without violating the no-falsehood rule).
    - Users: Score for their decision quality (same as the assistant's reward for that: +10, +5, etc.).

