  ### Scenario: Infrastructure Rollout Strategy Decision  
  A team must choose between two strategies for rolling out a critical database upgrade. The primary risk is customer-visible downtime, measured in expected hours over a quarter. Both strategies face a common risk of total failure (0 hours of uptime) due to unforeseen compatibility issues, but they differ in how they handle partial failures.  

  - **Option A (Aggressive Rollout)**: Prioritizes fast deployment but has a higher chance of severe partial failure.  
    - 10% chance of total failure (0 hours uptime).  
    - 5% chance of severe degradation (10 hours uptime).  
    - 85% chance of optimal performance (100 hours uptime).  
  - **Option B (Conservative Rollout)**: Slower deployment with robust fallbacks, reducing partial failure severity but sacrificing some upside.  
    - 10% chance of total failure (0 hours uptime).  
    - 85% chance of minor degradation (91 hours uptime).  
    - 5% chance of optimal performance (100 hours uptime).  

  ### Explicit Values and Probabilities  
  | Option | Outcome (Hours Uptime) | Probability |
  |--------|-------------------------|-------------|
  | **A**  | 0 (Worst)              | 0.10        |
  |        | 10 (Middle)            | 0.05        |
  |        | 100 (Best)             | 0.85        |
  | **B**  | 0 (Worst)              | 0.10        |
  |        | 91 (Middle)            | 0.85        |
  |        | 100 (Best)             | 0.05        |

  ### Expected Value (EV) Calculation  
  - **EV_A** = (0 × 0.10) + (10 × 0.05) + (100 × 0.85) = 0 + 0.5 + 85 = **85.5**  
  - **EV_B** = (0 × 0.10) + (91 × 0.85) + (100 × 0.05) = 0 + 77.35 + 5 = **82.35**  
  **Ranking**: A (85.5) > B (82.35) → A is preferred.  

  ### REU Calculation with \( r(p) = p^2 \)  
  **REU Formula**:  
  - Order outcomes worst-to-best: \( x_1 < x_2 < x_3 \).  
  - \( T_i = P(\text{outcome} \geq x_i) \), \( U_i = P(\text{outcome} > x_i) \).  
  - Weight on \( x_i \): \( r(T_i) - r(U_i) \) with \( r(p) = p^2 \).  
  - REU = \( \sum \) (weight × outcome).  

  **Option A Weights**:  
  - For \( x_1 = 0 \):  
    \( T_1 = P(\geq 0) = 1.0 \), \( U_1 = P(> 0) = 0.90 \)  
    Weight = \( r(1.0) - r(0.90) = 1^2 - 0.9^2 = 1 - 0.81 = 0.19 \)  
  - For \( x_2 = 10 \):  
    \( T_2 = P(\geq 10) = 0.90 \) (0.05 + 0.85), \( U_2 = P(> 10) = 0.85 \)  
    Weight = \( r(0.90) - r(0.85) = 0.9^2 - 0.85^2 = 0.81 - 0.7225 = 0.0875 \)  
  - For \( x_3 = 100 \):  
    \( T_3 = P(\geq 100) = 0.85 \), \( U_3 = P(> 100) = 0 \)  
    Weight = \( r(0.85) - r(0) = 0.85^2 - 0^2 = 0.7225 \)  
  - **REU_A** = (0 × 0.19) + (10 × 0.0875) + (100 × 0.7225) = 0 + 0.875 + 72.25 = **73.125**  

  **Option B Weights**:  
  - For \( x_1 = 0 \):  
    \( T_1 = 1.0 \), \( U_1 = 0.90 \)  
    Weight = \( 1^2 - 0.9^2 = 0.19 \) (same as A)  
  - For \( x_2 = 91 \):  
    \( T_2 = P(\geq 91) = 0.90 \) (0.85 + 0.05), \( U_2 = P(> 91) = 0.05 \)  
    Weight = \( r(0.90) - r(0.05) = 0.9^2 - 0.05^2 = 0.81 - 0.0025 = 0.8075 \)  
  - For \( x_3 = 100 \):  
    \( T_3 = P(\geq 100) = 0.05 \), \( U_3 = 0 \)  
    Weight = \( r(0.05) - r(0) = 0.05^2 - 0 = 0.0025 \)  
  - **REU_B** = (0 × 0.19) + (91 × 0.8075) + (100 × 0.0025) = 0 + 73.4825 + 0.25 = **73.7325**  

  **Ranking**: B (73.7325) > A (73.125) → B is preferred.  

  ### First-Order Stochastic Dominance Check  
  Cumulative distribution functions (CDFs) for hours uptime:  
  - **At \( x < 0 \)** (e.g., \( x = -1 \)): Both CDFs = 0.  
  - **At \( 0 \leq x < 10 \)** (e.g., \( x = 5 \)):  
    - A: CDF = \( P(\leq 5) = 0.10 \) (only 0 outcome)  
    - B: CDF = \( P(\leq 5) = 0.10 \)  
    → Indifferent.  
  - **At \( 10 \leq x < 91 \)** (e.g., \( x = 50 \)):  
    - A: CDF = \( P(\leq 50) = 0.10 + 0.05 = 0.15 \) (0 and 10)  
    - B: CDF = \( P(\leq 50) = 0.10 \) (only 0)  
    → A has higher CDF → B dominates.  
  - **At \( 91 \leq x < 100 \)** (e.g., \( x = 95 \)):  
    - A: CDF = \( P(\leq 95) = 0.15 \) (still only 0 and 10)  
    - B: CDF = \( P(\leq 95) = 0.10 + 0.85 = 0.95 \) (0 and 91)  
    → B has higher CDF → A dominates.  
  **Result**: Neither option dominates (A dominates in some regions, B in others).  

  ### Critical Exponent for REU Reversal  
  Solve for smallest \( k > 1 \) where REU ranking reverses (REU_B > REU_A):  
  - REU_A = \( 10 \times [0.9^k - 0.85^k] + 100 \times 0.85^k \)  
  - REU_B = \( 91 \times [0.9^k - 0.05^k] + 100 \times 0.05^k \)  
  - Define \( f(k) = \text{REU_B} - \text{REU_A} \):  
    \( f(k) = 81 \times 0.9^k + 9 \times 0.05^k - 90 \times 0.85^k \)  
  - Solve \( f(k) = 0 \) numerically:  
    - \( f(1.83) \approx -0.0144 \) (negative)  
    - \( f(1.84) \approx 0.0288 \) (positive)  
  **Critical exponent**: \( k = 1.84 \) (smallest such \( k \) to two decimals).  
  **Monotonicity**: For \( k > 1.84 \), \( f(k) > 0 \) (reversal persists; no flip-back).  

