  2. Plain variance-aversion: mean minus lambda times variance.

     First, compute the variances.

     Option A:
       Outcomes: 0 (p=0.10), 10 (p=0.05), 100 (p=0.85)
       Mean = 85.5
       Variance = (0-85.5)^2 *0.10 + (10-85.5)^2 *0.05 + (100-85.5)^2 *0.85
                = 85.5^2 *0.10 + (-75.5)^2 *0.05 + 14.5^2 *0.85
                = 731.025 *0.10 + 5700.25 *0.05 + 210.25*0.85
                = 73.1025 + 285.0125 + 178.7125 = 536.8275

     Option B:
       Outcomes: 0 (p=0.10), 91 (p=0.85), 100 (p=0.05)
       Mean = 82.35
       Variance = (0-82.35)^2 *0.10 + (91-82.35)^2 *0.85 + (100-82.35)^2 *0.05
                = 6780.3225 *0.10 + (8.65)^2 *0.85 + (17.65)^2 *0.05
                = 678.03225 + 74.81625*0.85 + 311.5225*0.05
                = 678.03225 + 63.5938125 + 15.576125
                = 757.2021875

     So variance of A is 536.8275, of B is 757.20.

     Then a rule: mean - lambda * variance.

     For A: 85.5 - lambda*536.8275
     For B: 82.35 - lambda*757.20

     We want to see if for any lambda>0, we get B ranked above A? That is:

     82.35 - lambda*757.20 > 85.5 - lambda*536.8275
     => -lambda*(757.20 - 536.8275) > 85.5 - 82.35
     => -lambda*220.3725 > 3.15
     => lambda*220.3725 < -3.15   -> impossible for lambda>0.

     So the variance-aversion rule will not flip. It will always prefer A because A has higher mean and lower variance.

     Therefore, the case is safe against variance-aversion.

  3. The strongest attack for the expected-value advocate: 

     He might argue that the REU weighting is arbitrary and that the expected value is the long-run average. If the team faces the same choice repeatedly, then over time, option A will yield on average 85.5 hours of uptime per quarter, while B yields only 82.35. Therefore, they should go with A. The REU score might be appropriate for a one-off decision, but for a repeated infrastructure decision, the long-term average is what matters.

     Additionally, he might argue that the worst-case (0 hours) is the same for both and has the same probability, and the rest should be averaged without transformation. The REU is overemphasizing the middle outcome in B and underemphasizing the best outcome in A.

     A money-pump argument would not directly apply because there is no dynamic inconsistency here.

  4. Inverse-S shaped weighting function: 

     The inverse-S function overweights small probabilities and underweights moderate and large ones. A common form is: 
       w(p) = p^c / (p^c + (1-p)^c)^{1/c}   for some c, or in the rank-dependent form.

     But we are using a different formalism. In our case, the weighting is applied to the tail probabilities. The inverse-S function in the probability weighting literature (like Prelec) is applied to the cumulative probabilities. 

     We can try a simple inverse-S function: for example, 
       r(p) = p^d for p in [0,1] but with d<1. 
     But note: the user's r(p)=p^k with k>1 is convex. The inverse-S is concave for small p and convex for large p. 

     We can try a specific inverse-S function. A common one is: 
       w(p) = exp(-(-ln(p))^a) for 0<a<1.

     However, we are using a function r on the tail probability to compute weights. 

