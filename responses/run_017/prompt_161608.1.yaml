  We are choosing a rollout strategy for a critical service. Option A: 10% chance of total failure (0 hours of uptime), 5% chance of 10 hours of uptime, and 85% chance of 100 hours of uptime. Option B: 10% chance of total failure, 85% chance of 91 hours of uptime, and 5% chance of 100 hours of uptime. The expected uptime of A is 85.5 hours, which is higher than B's 82.35 hours. But the REU score (with k=2) for A is 73.125 and for B is 73.7325, so REU prefers B. The structural feature is the trade-off between a very low middle outcome in A versus a high middle outcome in B, and the shift in probability from the best outcome to the middle outcome in B.

