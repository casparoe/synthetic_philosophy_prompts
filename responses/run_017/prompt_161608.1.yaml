  ### Additional Analyses  

  **1. Structural Feature and Sensitivity**  
  - **Feature**: The flip arises from B’s **high middle outcome (91)** versus A’s **low middle outcome (10)**, combined with B shifting probability mass from the best outcome (100) to the middle outcome.  
  - **Collapse if middle outcomes equal**: Set both middle outcomes to 50:  
    - EV_A = 85.5 > EV_B = 47.5.  
    - REU_A (76.625) > REU_B (40.625) → **No flip**.  
  - **Collapse if best-outcome probabilities equal**: Set both best probabilities to 0.05:  
    - EV_B (82.35) > EV_A (13.5).  
    - REU_B (73.7325) > REU_A (8.325) → **No flip**.  
  **Conclusion**: The flip vanishes if middle outcomes are equal or best probabilities are matched.  

  **2. Variance-Aversion Rule**  
  - **Variance calculation**:  
    - Var_A = \( (0 - 85.5)^2 \times 0.10 + (10 - 85.5)^2 \times 0.05 + (100 - 85.5)^2 \times 0.85 = 536.83 \)  
    - Var_B = \( (0 - 82.35)^2 \times 0.10 + (91 - 82.35)^2 \times 0.85 + (100 - 82.35)^2 \times 0.05 = 757.20 \)  
  - **Mean - λ·Variance**:  
    - A: 85.5 - λ·536.83  
    - B: 82.35 - λ·757.20  
  - **Comparison**:  
    \( 82.35 - λ·757.20 > 85.5 - λ·536.83 \)  
    ⇒ \( λ·(536.83 - 757.20) > 85.5 - 82.35 \)  
    ⇒ \( λ·(-220.37) > 3.15 \) (impossible for λ > 0).  
  **Result**: Variance-aversion always prefers A (no flip). The case **cannot** be adjusted to make variance-aversion flip, as B has higher variance and lower mean.  

  **3. Expected Value Advocate's Attack**  
  - **Argument**: "REU is arbitrary and violates the long-run principle. If we face this decision repeatedly, A yields 85.5 hours/quarter on average, while B yields only 82.35. REU’s weighting (e.g., underweighting 100-hour upside in A) ignores repeated-game efficiency. Use the law of large numbers: EV maximizes cumulative uptime."  
  - **Counterargument**: REU is designed for one-off, high-stakes decisions where tail risks matter more than long-run averages. A’s 5% chance of 10-hour downtime could cause irreversible customer loss in a single quarter, while B’s 85% chance of 91-hour uptime is reliably acceptable.  
  - **No money-pump**: No dynamic inconsistency, as rankings are fixed per instance.  

  **4. Inverse-S Weighting Function Check**  
  - **Inverse-S function**: Overweights small probabilities, underweights moderate/large ones (e.g., Prelec function with \( \alpha=0.8, \beta=1.0 \)).  
  - **Weights for B’s best outcome (p=0.05)**: Overweighted (e.g., \( r(0.05) \approx 0.10 \)).  
  - **Weights for A’s best outcome (p=0.85)**: Underweighted (e.g., \( r(0.85) \approx 0.80 \)).  
  - **REU simulation**:  
    - A: \( \text{REU} \approx (0 \times 0.15) + (10 \times 0.05) + (100 \times 0.80) = 80.5 \)  
    - B: \( \text{REU} \approx (0 \times 0.15) + (91 \times 0.75) + (100 \times 0.10) = 78.25 \)  
  **Result**: A (80.5) > B (78.25) → **No flip** (same as EV).  
  **Why?**: Inverse-S overweights B’s 5% chance of 100 hours, making its upside more attractive, but also underweights B’s 85% chance of 91 hours (tail probability 0.90), reducing the middle outcome’s impact. REU’s convex weighting (\( p^2 \)) uniformly underweights all tail probabilities, which is necessary to flip the ranking by amplifying B’s middle outcome advantage.  

