prompt: |-
  I'm about eight months into my first term on the selectboard in my town (about nine thousand people, heavily churchgoing, mostly Catholic and evangelical), and part of the job is that when we pass something I'm usually the one who writes the official statement of reasons that goes with it. So I keep having to decide, in real time, what belongs in a justification that's supposed to be for everybody and what somebody can say at the microphone but shouldn't. My brother is the guy who gets up and quotes scripture at every meeting, and I'd like to be able to tell him, kindley, which of his arguments belong in church and which belong in the warrant — without being the kind of person who thinks religion has no business in public life, because I don't. I'm a fairly lapsed Catholic myself, and the shelter funding item got me right in the gut. Please skip the reading list and the citations: I want the argument, and I can't chase down references from here anyway. A friend of mine says there are two different tests hiding inside my confusion — whether other people could in principle check the reason, versus whether they actually accept it — and I think he's right that the crux is somewhere in there, but I can't get either version to sort my cases.

  Here's my gut on the cases, all more or less from this past year. (A) Sister Ellen from the shelter testifies for the funding, says the Gospel tells her Christ is present in the homeless, and also brings the actual cost data: fine, and I don't even mind the religious framing. (B) A neighbor opposing the harm-reduction vending machine because the body is a temple: not fine. (C) Pastor Ray, arguing for the tenant relocation ordinance purely out of the Hebrew prophets and the Jubilee material, offering no secular argument at all: fine, and I'd feel weird asking him to translate it. (D) A mom against the new sex-ed curriculum because children belong to God and to their parents and not to the state: not fine. (E) Our town clerk, who also does civil ceremonies, refusing to marry same-sex couples and saying marriage is by nature the union of a man and a woman: not fine. (F) A tiny congregation asking for a variance to meet in a house on a residential street because their scripture requires them to pray together within walking distance: fine — it feels fine because anyone can grasp the underlying interest even without the belief. (G) The descendants of a burial ground on the lot we were going to turn into a dog park, telling us the ground is sacred and must not be dug: fine, and I hold this one more firmly than F even though it's the case where I understand the claim least. (H) The pastor of the biggest church in town arguing we should not extend the property tax exemption to churches: fine, and more comfortable to me than any of the others. (I) The one I go back and forth on: a guy arguing against the shelter on hard-edged libertarian self-ownership grounds, no religion at all, but resting on a whole worldview my neighbors definately don't share. (J) My own case: my real reason for the shelter is the Gospel, the cost data is secondary and I'd vote yes without it — is it ok for me to vote yes, and is it dishonest if the only reason I say out loud is the cost data? And a wrinkle I can't shake: if the test is something like "accessible to everyone," doesn't it get easier to satisfy in my town than at the state house? But if it's audience-relative, then in a heavily Muslim town sharia arguments become admissible, and I don't want to say that.

  The pair I can't get apart is C and E. Both are scriptural, both are claims about what a social institution is for, both are integral to the speaker's faith in a way they couldn't just set aside, and if anything E has an easier secular back-up available (the state's interest in channeling procreation) than C does. I won't give up either verdict, and I can't say what the difference is supposed to be. The rule I've been trying out is: a religious reason is fine in political argument when (a) the speaker also has, and would act on, a secular reason pointing the same way; or (b) it's a reason for taking a burden on herself rather than putting one on other people; or (c) it's testimony about what her community has actually seen rather than a claim from revelation. But (a) misfires in both directions — C has no secular back-up and feels fine, E has one available and feels not fine — and I'm worried the whole thing is just "religion is fine when I already agree with the conclusion" with extra steps.

  So what's the principle, or the two or three serious candidates for it? I want one stated preciseley enough that I could actually apply it at the microphone next month, with the case that forces each clause, its verdicts on cases I haven't listed, and an honest list of which of my verdicts it can't keep. Please send it back as a JSON object, in American English throughout, with these fields:

  - "principle": string, one or two sentences, the rule you'd recommend (if you think there are two live candidates, put your pick here and the others in the next field).
  - "rivals": array of strings, each a one-sentence statement of another candidate rule you'd take seriously.
  - "clauses": array of objects, one per clause of the principle, with keys "clause", "case_that_forces_it" (reference my letters), and "what_it_rules_out".
  - "case_verdicts": array of objects with keys "case" (A through J), "verdict" (admissible / not admissible / admissible with conditions), "agrees_with_me" (true or false), and "note" (one sentence; where we disagree, say why mine is the wrong call).
  - "test_of_my_rule": object with keys "survives", "needs_patch", and "patches" — which of my three escape hatches (a), (b), (c) hold up, which don't, and the repaired version if there is one.
  - "hard_pair": object with keys "separable" (true or false), "best_line" (the strongest attempt to pry C and E apart on the terms I gave), and "if_not" (which verdict I should drop and why).
  - "unlisted_cases": array of three objects with keys "case", "predicted_verdict", and "seems_right" (your honest yes/no), and please make them: (i) a religious reason offered by a member of a tiny religion nobody else in town has heard of; (ii) a religious reason in the official written statement of reasons we file with an ordinance; (iii) a religious reason used to argue against a policy that would happen to put money in the speaker's own church's pocket.
  - "audience_relativity": string — is the accessibility test audience-relative, and what does your answer commit you to in the Muslim-majority-town case?
  - "bias_check": string — is my rule just "religion is fine when I agree with the conclusion"? Say it straight, and if so, tell me what constraint could replace it.
  - "forum_table": array of objects, i.e. a table with columns "forum" and "what_the_rule_requires", with one row for each of: public comment at a selectboard meeting, deliberation among the five of us, the written statement of reasons filed with an ordinance, a voter pamphlet argument, and my own reasoning before I vote.
reasoning: |-
  We are going to address the user's problem by proposing a principle and then testing it against the cases provided. The goal is to find a rule that distinguishes between admissible and inadmissible religious arguments in public justifications for town policies.

  After analyzing the cases, the key distinction seems to be between reasons that are:
  - Based on religious authority or doctrine that is not accessible to non-believers (which are inadmissible in public justification) and 
  - Reasons that, while religiously inspired, can be expressed in terms of shared public values or observable facts (which are admissible).

  However, note that in case (C), Pastor Ray's argument is purely scriptural and yet the user feels it is admissible. This suggests that the content of the argument might matter: the Hebrew prophets and Jubilee material are about justice and care for the poor, which are values that can be understood and shared by non-believers even if the particular framing is religious. In contrast, in case (E), the town clerk's argument is about the nature of marriage as defined by her religion, which imposes a religious view on others and is not accessible to those who do not share that specific doctrine.

  Thus, the proposed principle is:

  **Principle**: A religious reason is admissible in public political argument if it either (1) invokes religious ideas that are widely recognized as grounding shared public values (like justice, compassion, or human dignity) and can be understood as such by non-adherents, or (2) is offered as testimony about the religious needs or practices of a community that would be burdened by the policy, provided that the burden is not imposed on others who do not share the belief.

  **Rivals**:
  - "Religious reasons are admissible if they can be translated into secular reasons without loss of meaning."
  - "Religious reasons are admissible only when they do not impose a burden on non-adherents."

  **Clauses**:
  1. Clause: "Invokes religious ideas that are widely recognized as grounding shared public values and can be understood as such by non-adherents."
     - Case that forces it: (C) Pastor Ray's argument for the tenant relocation ordinance. It is purely religious but draws on themes of justice and care for the poor that are part of the shared public culture.
     - What it rules out: Arguments that rely on specific religious doctrines that are not connected to widely shared public values (like (B) the body as a temple, which is a specific doctrine that not everyone shares and does not translate to a shared public value in the context of opposing a harm-reduction vending machine).

  2. Clause: "Offered as testimony about the religious needs or practices of a community that would be burdened by the policy, provided that the burden is not imposed on others."
     - Case that forces it: (F) The tiny congregation asking for a variance because their scripture requires them to pray together within walking distance. This is about their own practice and the burden of not having a place to meet. Also (G) the burial ground being sacred: they are testifying about their own community's practice and the burden of desecration.
     - What it rules out: Arguments that use religious doctrine to impose a burden on others, like (D) the mom arguing against the sex-ed curriculum because children belong to God and parents, which would impose her religious view on all children in the public schools.

  **Case Verdicts**:

  - A: Sister Ellen - admissible. Agrees: true. Note: The religious framing is combined with cost data, but even without it, the Gospel reference is about compassion for the homeless, which is a shared public value.
  - B: Neighbor opposing vending machine - not admissible. Agrees: true. Note: The body as a temple is a specific religious doctrine that does not translate to a shared public reason for opposing the machine.
  - C: Pastor Ray - admissible. Agrees: true. Note: The Hebrew prophets and Jubilee are about justice and care for the poor, which are shared public values.
  - D: Mom against sex-ed - not admissible. Agrees: true. Note: The argument imposes a religious view about parental ownership on the public school system.
  - E: Town clerk refusing to marry same-sex couples - not admissible. Agrees: true. Note: The clerk is using religious doctrine to deny a public service to others, imposing a burden.
  - F: Tiny congregation variance - admissible. Agrees: true. Note: They are testifying about their own religious practice and the burden of not having a place to meet, without imposing on others.
  - G: Burial ground - admissible. Agrees: true. Note: Testimony about the sacredness of the ground to their community and the burden of desecration, without imposing a burden on others (the dog park can be placed elsewhere).
  - H: Pastor arguing against property tax exemption - admissible. Agrees: true. Note: Even though religious, it is about the role of the church in society and can be seen as a matter of fairness (a shared public value) and also the church is taking a burden on itself.
  - I: Libertarian against shelter - admissible. Agrees: false. Note: The user's gut says it's not fine? But the rule says: even if the worldview is not shared, libertarian arguments are part of the public political discourse. They are secular and based on reasoning about rights and the role of government. So they are admissible. But the user might feel uncomfortable because it's not widely accepted? However, the rule doesn't require that the reason be accepted, only that it be public (i.e., not relying on inaccessible religious authority). So we mark it as admissible, but note that it disagrees with the user's verdict (which seems to be not fine). The user must decide if they want to change their verdict or adjust the rule.
  - J: User's own reason for the shelter - admissible. Agrees: true. Note: The user can vote based on the Gospel, but in the public statement, it is acceptable to use the cost data. However, if asked, the user can also express the religious reason as long as it is framed in terms of shared values (compassion). But note: the rule for the written statement of reasons (which is an official document) might require a more neutral justification. That is addressed in the forum table.

  **Test of My Rule**:
  The user had three escape hatches: (a) secular backup, (b) taking burden on self, (c) testimony about what the community has seen.

  - Survives: (b) and (c) are incorporated in the second clause (testimony about burden on the community without imposing on others). 
  - Needs patch: (a) is not required because in (C) there is no secular backup and it's admissible. So (a) is not necessary. 
  - Patches: The rule does not require (a). Instead, it requires either connection to shared public values (which might not be secular but are widely recognized) or testimony about burden without imposing on others.

  **Hard Pair (C and E)**:
  - Separable: true.
  - Best line: In (C), Pastor Ray is invoking shared public values (justice, care for the poor) through a religious lens, but the values themselves are accessible and can be endorsed by non-believers. In (E), the town clerk is using a religious doctrine to deny a public service to others, which imposes a burden on non-adherents and does not invoke a shared public value (the definition of marriage as between a man and a woman is a specific religious doctrine not shared by all). 
  - If not: The user should drop the verdict on (E) being not admissible? But the user won't. Alternatively, if the user cannot accept this distinction, then perhaps the rule needs to be adjusted to also consider the context of the argument (like whether it is about the speaker's own practice or about imposing on others). But the rule already does that.

  **Unlisted Cases**:
  1. Case: A member of a tiny, unknown religion argues against a noise ordinance because their faith requires them to chant at 3 a.m. every day.
     - Predicted verdict: Not admissible. They are imposing a burden (noise) on others. If they are asking for an exemption, then it would be a burden on them if they can't chant, but the burden on neighbors is also significant. So it might be a balancing act, but the argument alone is not sufficient without showing how the burden on them outweighs and without a secular reason (like religious freedom) that the town can consider. However, the rule would likely say not admissible because it imposes a burden on others (the neighbors' peace). But note: the rule's second clause requires that the burden not be imposed on others. So if the chanting disturbs others, it's imposing. So verdict: not admissible.
     - Seems right: Yes.

  2. Case: A religious reason in the official written statement of reasons for an ordinance.
     - Predicted verdict: Not admissible. The written statement of reasons is an official document and should be based on shared public reasons. Religious reasons should be avoided in official justifications, even if they are admissible in public comment. 
     - Seems right: Yes.

  3. Case: A religious reason used to argue against a policy that would happen to put money in the speaker's own church's pocket (e.g., opposing a grant program that their church would be eligible for, because they believe the church should not take government money).
     - Predicted verdict: Admissible. The speaker is testifying about their own church's practice and the burden of violating their religious principles (if they were to accept the money). They are not imposing a burden on others. Even though the church would get money, they are arguing against it for religious reasons. But note: the rule requires that the burden not be imposed on others. Here, the speaker is avoiding a burden on their own conscience and church. So it should be admissible.
     - Seems right: Yes.

  **Audience Relativity**: 
  The accessibility test is not audience-relative in the sense that the standard is whether the reason invokes shared public values or testifies about a burden without imposing on others, which should be based on the broader society's shared values, not the local majority. In a Muslim-majority town, a sharia argument would be admissible only if it invokes a value that is shared in the broader public culture (like justice or compassion) or if it is testimony about a burden on the Muslim community without imposing on others. It would not be admissible if it imposes a religious practice on non-Muslims. This avoids the problem of majority tyranny.

  **Bias Check**:
  The rule is not just "religion is fine when I agree with the conclusion." The constraint is the content of the reason: whether it invokes shared public values or testifies about a burden without imposing on others. This is independent of agreement. For example, in (H), the pastor's argument against tax exemption might be one the user agrees with, but it is also grounded in fairness (a shared value) and the church taking a burden. In (B), the user disagrees with the conclusion and the reason is not admissible, but that's because it fails the test. The key is that the rule provides content-based criteria.

  **Forum Table**:
  Different forums may have different standards for what is required in the justification.

  - Public comment at a selectboard meeting: The rule requires that speakers adhere to the principle (shared public values or testimony about burden without imposing), but the meeting is open and we allow a wide range of comments. However, the selectboard should base their decision on the admissible reasons. So in this forum, the rule does not restrict what people can say, but the board should only consider the admissible reasons in their deliberation and justification.
  - Deliberation among the five: The rule requires that the selectboard members use only admissible reasons (shared public values or testimony about burden without imposing) when deliberating and making decisions. They should avoid relying on purely religious reasons that do not meet the criteria.
  - Written statement of reasons: The rule requires that the statement be based solely on shared public reasons (secular or religiously grounded in shared values) and avoid any purely sectarian justifications. Testimony about burden without imposing can be included if it is part of the factual record, but the primary justification should be in terms of public values.
  - Voter pamphlet argument: Similar to the written statement, but may be slightly more permissive because it is advocacy. Still, the rule requires that the argument be framed in terms of shared public values or testimony about burden without imposing on others.
  - Own reasoning before voting: No restriction. The rule does not require the individual to censor their own thoughts. They can base their vote on any reason they wish, but when they express their reasons in public or official contexts, they must follow the rule.

  Now, we structure the response as a JSON object as requested.
