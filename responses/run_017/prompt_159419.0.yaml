prompt: |-
  I'm a PhD student teaching my first standalone seminar in epistemology: 16 upper-level undergraduates, one 90-minute session, a whiteboard, a pack of index cards and nothing else — no AV, no budget, no real stakes I can put on the table. They will have read short selections from Wittgenstein's late notes on certainty (the remarks about doubt coming to an end, and the image of some propositions as the bed of a river that shifts slowly while the water above it moves fast), and roughly half of them will also have read Moore's attempt to prove the existence of an external world by holding up his hands. In my experience students arrive in one of two moods: either they think every well-supported belief is certain in exactly the same flat way, or they think nothing is, and there is always one student who will play the professional skeptic for the whole hour. I ran a version of this session last year and it collapsed in both directions at once — the skeptic paralysed the discussion, and the rest of the class concluded that if doubt stops anywhere it stops everywhere, so that any proposition anyone feels confident about counts as bedrock. I want a design that makes that collapse structurally unlikely rather than one in which I simply talk them out of it.

  What I want them to run into, before the word hinge is ever said out loud, is that the feeling that you cannot seriously doubt something is no detector at all. Please build the activity around a deck of propositions that contains both genuine load-bearing ones, where a sustained doubt makes the practice the group is engaged in literally unplayable, and what I'll call "decoys": propositions that feel exactly as indubitable but whose doubt the practice simply absorbs, because more evidence settles it. I also want the same proposition to appear twice, doing different work — what I'll call a "transplanted" proposition, load-bearing inside one practice and an ordinary checkable hypothesis inside another, with participants assigned to different practices so that each side finds the other side's bedrock scandalous and each side's outrage invisible to the other. And I want some propositions to be "erodible": dropped in the course of the session not because anything refuted them but because the practice they were holding up has quietly changed, so that the group has to feel the difference between that was false and that no longer does any work. None of these three things should be explained to them beforehand. They should be produced by the rules, the roles, the scoring, or the way the cards are distributed, and the group should supply the distinctions themselves before anyone names them.

  So: a runnable activity with roles and rules and no upfront lecture, a timeline, the deck itself, and a debrief that maps specific moments in the session onto specific features of the view, including an honest statement of which feature the activity cannot reproduce and which I will have to state plainly (I suspect it is the way these propositions are not adopted by any decision and are shown in what people do rather than in what they say, but I'd like your diagnosis rather than mine). Tell me what will predictably go wrong — the skeptic, the everything-is-a-hinge slide, the student who treats a hinge as a rule the group voted on — and how to handle each without pausing to lecture. Give the answer as a single JSON object with these fields: materials (string: what I need, all of it cheap); roles_and_setup (string: who is assigned what and how the groups are formed); rules (array of strings); phases (array of objects with keys minutes, participants_do, engineered_to_happen); card_deck (array of 12–16 objects with keys proposition, practice, kind — one of load_bearing, decoy, transplanted, erodible — and intended_discovery); debrief_map (array of objects with keys moment_in_activity, mapped_onto, facilitator_move); predicted_failures (array of objects with keys what_goes_wrong, why, handling); cannot_reproduce (string). Keep every string field to at most three sentences except card_deck and phases.
reasoning: |-
  We are designing a seminar activity for epistemology based on Wittgenstein's "On Certainty". The goal is to have students discover the difference between genuine "hinge" propositions (which are load-bearing for a practice) and propositions that feel indubitable but are actually decoys (which can be settled by evidence). We also want to show that the same proposition can be a hinge in one context and a decoy in another (transplanted), and that some hinges can become erodible (no longer necessary without being falsified).

  Materials: 
  - Whiteboard (to track scores and possibly note discoveries)
  - Index cards (to write the propositions and for students to write their own propositions)
  - Pens

  Roles and Setup:
  - Divide the class into two groups: Group A (scientists) and Group B (historians). Each group has a distinct practice (scientific investigation vs. historical inquiry). 
  - Assign each student in each group a partner from the same group (pairs for discussion). 
  - One student (the skeptic) is assigned a special role: they are allowed to challenge any proposition at any time by playing a "doubt" card (they get 3 doubt cards). 
  - The rest of the class are "inquirers" in their respective practices.

  Rules:
  1. Each group (A and B) receives a set of 6-8 proposition cards. Some cards are shared between groups (for transplanted propositions) but labeled for their practice.
  2. Each group must build an argument or narrative using their propositions. For scientists, it's a chain of reasoning for a hypothesis; for historians, it's a coherent account of a historical event.
  3. Each group scores points by successfully using a proposition in their argument without it being effectively doubted. They start with 10 points.
  4. The skeptic can play a doubt card on any proposition at any time. When doubted, the group must either:
     a) Provide evidence (from their practice) to settle the doubt (if it's a decoy) -> then they gain 1 point and the card is removed from play (because it's settled).
     b) Concede that they cannot provide evidence and then they must replace the proposition with another from their deck (if available) or restructure without it. They lose 2 points.
  5. If a group uses a load-bearing proposition and it is doubted and they cannot provide evidence (because it is a hinge), they lose 5 points and the entire argument collapses (they must start over). They then realize that proposition was foundational.
  6. Groups can challenge the skeptic's doubt if they think it's frivolous (by group vote, but the skeptic has the final say in playing the card). The skeptic can only play 3 doubts in the entire session.
  7. The game has three phases (see below).

  Phases:
  1. Phase 1 (20 minutes): Group work. Each group builds their argument/narrative using the proposition cards. They must use at least 4 cards. During this phase, the skeptic can move between groups and ask clarifying questions but cannot play doubt cards yet.
  2. Phase 2 (40 minutes): Presentation and challenge. Each group presents their argument. The skeptic can play doubt cards during or after the presentation. The other group can also ask questions (but not doubt). The facilitator times each presentation (10 min each) and then cross-group discussion (10 min). The skeptic has 3 doubt cards to play in total (across both groups).
  3. Phase 3 (20 minutes): Erosion. The facilitator introduces a change in the practice for one group (e.g., for scientists: "We now have a new theory that doesn't require that proposition", or for historians: "New evidence shows that this source is unreliable, so we must avoid using it"). Groups must then restructure their argument without the erodible proposition. They do not lose points for this, but they must explain why the proposition is no longer needed.

  Card Deck: We need 12-16 cards. We'll have:

  For Group A (Scientists):
  - Proposition: "The laws of physics are constant across time and space." (load_bearing) -> intended discovery: without this, experiments are meaningless.
  - Proposition: "This microscope is working properly." (decoy) -> intended discovery: can be checked by testing the microscope.
  - Proposition: "Water boils at 100°C at sea level." (decoy) -> intended discovery: can be tested by experiment.
  - Proposition: "The earth is round." (transplanted: for scientists, it's a decoy because they can provide evidence; but for historians, it might be load-bearing in a different way? Actually, we want the same proposition to appear in both groups but as different kinds. So let's have a shared proposition that is load-bearing in one and decoy in the other.)

  For Group B (Historians):
  - Proposition: "Written records from the time are generally reliable." (load_bearing) -> without this, history is impossible.
  - Proposition: "The author of this document was present at the event." (decoy) -> can be checked by other records.
  - Proposition: "The earth is round." (transplanted: for historians, it's load-bearing? Actually, in history, the roundness of the earth might be taken for granted as a background condition, but it's not typically the kind of thing they prove. Let's choose something else.)

  Better transplanted proposition: 
  Let's have a proposition that is load-bearing in history but a decoy in science. How about: "The speed of light is constant." 
  But that might be too scientific. Alternatively: "Carbon dating is reliable." 
  In science, this might be a decoy (they can check it against known samples) but in history, it might be load-bearing because without it they cannot date artifacts and the whole practice collapses? However, historians might have other methods. 

  Alternatively, let's choose: "The universe is more than 100 years old." 
  - For scientists: load-bearing (because if it were only 100 years old, then all their methods for dating would be wrong and they'd have to start over). 
  - For historians: decoy? Actually, historians rely on scientific dating, so it might be load-bearing for them too. 

  We need a proposition that is taken as a hinge in one practice and as an ordinary empirical claim in another. How about: "My senses are generally reliable." 
  - For scientists: they use their senses to observe experiments, so it's load-bearing. 
  - For historians: they rely on written records, not direct senses, so they might treat it as a decoy? But they do use senses to read. 

  Alternatively: "Other people have minds." 
  - For historians: load-bearing because they interpret the actions of historical figures as having mental states. 
  - For scientists: in a lab, they might not need to assume that in every experiment? 

  But let's settle on:

  Group A (Scientists):
  1. "The laws of physics are constant." (load_bearing)
  2. "This microscope is working properly." (decoy)
  3. "Water boils at 100°C at sea level." (decoy) [but note: this is actually false in some conditions, but we are treating it as a decoy that can be checked]
  4. "The speed of light in vacuum is constant." (load_bearing for scientists? Actually, it's a fundamental postulate in relativity, so it's load-bearing. But we want a transplanted one that is decoy in the other group. So maybe not.)

  We'll design two transplanted propositions that are the same in wording but assigned to both groups and of different kinds:

  Card for both groups: "The universe is billions of years old." 
  - For Group A (Scientists): decoy (they can provide evidence from astronomy, geology, etc.)
  - For Group B (Historians): load_bearing (because without the deep time, the entire narrative of human history as a tiny fraction of time doesn't make sense; and they rely on scientific methods that assume this)

  But wait, historians don't typically prove the age of the universe. So let's try: "The earth is billions of years old." -> same issue.

  Alternatively, let's choose a proposition that is more central to history: "Historical events have causes." 
  - For historians: load-bearing (without the idea of causation, history is just a list of events)
  - For scientists: they also use causation, but they might be able to test it? Actually, they might also treat it as load-bearing. 

  Another idea: "The written records in this archive are authentic." 
  - For historians: load-bearing (if they are fake, the whole practice of using that archive collapses) 
  - For scientists: they don't use that archive, so they don't care. So we can't have the same proposition.

  We need the same proposition to appear in both practices. So let's create a proposition that can be used in both but is hinge in one and decoy in the other.

  How about: "The city of Rome existed in ancient times." 
  - For historians: load-bearing (if it didn't, then much of Roman history is called into question) 
  - For scientists: they might use it in a context (e.g., in archaeology) but they can provide evidence (carbon dating, artifacts) so it's a decoy.

  But let's define the practices more narrowly:

  Group A (Scientists): They are building an argument about a biological process (e.g., photosynthesis). 
  Group B (Historians): They are building an argument about the fall of the Roman Empire.

  Then:

  Group A (Science) deck:
  1. "The laws of physics are constant." (load_bearing) -> intended: collapse when doubted.
  2. "This microscope is working properly." (decoy) -> can be tested.
  3. "Plants convert light into chemical energy." (decoy) -> they can describe experiments.
  4. "The sun is the primary source of energy for the earth." (decoy) -> can be supported by evidence.
  5. "The city of Rome existed in ancient times." (transplanted: for scientists, they don't really need it? So let's make it a decoy for them: they can point to historical records, but it's not central. But we want it to be load-bearing for historians.)

  Group B (History) deck:
  1. "Written records from the time are generally reliable." (load_bearing) -> collapse.
  2. "The author of this document was present at the event." (decoy) -> can be checked.
  3. "The Roman Empire fell due to a combination of factors." (decoy) -> they can provide evidence for each factor.
  4. "The city of Rome existed in ancient times." (load_bearing for them) -> if doubted, their entire narrative about Rome collapses.

  But wait, the same proposition "The city of Rome existed in ancient times" is in both groups? Then we have two cards with the same proposition? And for scientists, it's a decoy? That might work if the scientists are using it for background (e.g., in a study of ancient climate?) but it's not load-bearing. So in science, they can drop it without collapse? 

  Alternatively, let's have the same proposition worded the same and given to both groups, but in one group it's a decoy and in the other load-bearing. 

  We also need erodible propositions. For example, in the history group: "The fall of Rome was caused by moral decay." This might be erodible because the practice of history has shifted to emphasize economic factors, and without refuting moral decay, it's just no longer used.

  So let's design the deck:

  Total 16 cards (8 for each group, with 2 shared propositions that are the same in wording but assigned to both and of different kinds).

  Group A (Scientists) cards:
  1. "The laws of physics are constant." (load_bearing) -> intended: collapse when doubted without evidence.
  2. "My senses are generally reliable." (load_bearing) -> collapse because without senses, no observation.
  3. "This microscope is working properly." (decoy) -> can be tested by looking at a known sample.
  4. "Water boils at 100°C at sea level." (decoy) -> testable.
  5. "The earth is round." (decoy) -> scientists can provide evidence (pictures from space, etc.)
  6. "The city of Rome existed in ancient times." (transplanted: decoy for scientists) -> they can point to historical records and archaeological evidence.
  7. "Carbon dating is a reliable method." (decoy) -> they can explain how it works and calibrate it.
  8. "The universe is billions of years old." (erodible? Not really. Let's make an erodible one: "Light travels in straight lines in a vacuum." But that's a law. Alternatively, in the erosion phase, we'll remove one by fiat.)

  Wait, we need an erodible card. How about: "Newtonian mechanics is sufficient for describing everyday phenomena." -> Then in the erosion phase, we say that we are now dealing with quantum effects, so Newtonian mechanics is not sufficient, but it wasn't proven false in the everyday domain.

  But let's assign the erodible to the history group because it's easier: "The primary cause of the fall of Rome was barbarian invasions." -> Then in erosion, we say that recent scholarship emphasizes internal factors, so we don't need the barbarian invasions as a primary cause.

  So for Group B (Historians):
  1. "Written records from the time are generally reliable." (load_bearing) -> collapse.
  2. "Other people have minds." (load_bearing) -> because without that, we cannot interpret the actions of historical figures.
  3. "The author of this document was present at the event." (decoy) -> can be checked by corroborating evidence.
  4. "The battle took place in 410 AD." (decoy) -> can be checked by multiple sources.
  5. "The earth is round." (transplanted: for historians, it's load-bearing? Actually, they don't prove it, but they assume it. But if doubted, they might not collapse? They can point to maps, etc. So let's make it a decoy for them too. Then we don't have a transplanted one. We need to fix.)

  We need a transplanted proposition that is load-bearing in one and decoy in the other. How about:

  Shared proposition: "Other people have minds." 
  - For scientists: in a lab, they interact with colleagues. If they doubted other minds, they couldn't collaborate. So it's load-bearing? But they might not think about it. We want the same proposition to be a decoy in the other group? 

  Alternatively, let's choose: "The past is real and not an illusion." 
  - For historians: load-bearing (without it, history is fiction)
  - For scientists: they can test the past by looking at fossils, etc. so it's a decoy? 

  But that might not be a decoy because they can't test it directly? 

  Perhaps: "The decay rate of radioactive elements is constant." 
  - For scientists: they can test it? Actually, they assume it as a fundamental principle. So it's load-bearing? 
  - For historians: they rely on it for carbon dating, so it's load-bearing for them too? 

  After some thought, let's create a proposition that is more social:

  "Trust in the scientific community is warranted." 
  - For scientists: load-bearing (they rely on peer review, etc.)
  - For historians: they might use scientific results, but if they doubted it, they could still do history by using other methods? So it might be a decoy? 

  But that's fuzzy. 

  We'll go with:

  Transplanted proposition: "The testimony of experts is generally reliable."
  - For historians: load-bearing (they rely on expert historians and archaeologists)
  - For scientists: they can test expert testimony by replicating experiments, so it's a decoy.

  But replication might not always be possible? 

