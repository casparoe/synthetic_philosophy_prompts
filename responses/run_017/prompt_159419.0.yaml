  **Key Design Rationale**:
  1. **Asymmetric Practices**: Historians vs. Scientists create incompatible ecosystems where transplanted propositions (carbon dating, sensory evidence) naturally function as hinges in one context but decoys in another, generating productive conflict.
    
  2. **Controlled Skepticism**: Doubt cards are limited and targeted to prevent paralysis while forcing differentiation between load-bearing and decoy propositions through scored consequences.

  3. **Erosion Mechanism**: Removing erodible cards in Phase 3 without evidence demonstrates how practices abandon hinges through evolution, not disproof - mirroring Wittgenstein's riverbed.

  4. **Discovery-First Approach**: All distinctions emerge from operational failures (collapses), settlements (point gains), and rebuilds rather than lecture. Debrief maps activity moments to philosophical concepts.

  **Predicted Success Indicators**:
  - Outbursts during cross-group debate when transplanted propositions are doubted
  - Visible relief when decoys are settled vs. panic during load-bearing collapses
  - Spontaneous student comments like "But we NEED that!" or "Why can't they just check?" during presentations

  **Critical Note**: The activity cannot replicate how real-world hinges operate *beneath* conscious justification. State this explicitly during debrief using Wittgenstein's "bed of the river" metaphor, emphasizing that the cards represent what hinges *do*, not how they're *held*.
