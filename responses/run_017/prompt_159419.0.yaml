  We'll design the deck as follows, with 8 cards per group, and two of these cards are the same proposition (worded identically) but assigned to both groups and of different kinds. We'll also include one erodible in each group.

  Group A (Scientists) deck:
  1. "The laws of physics are constant." (load_bearing)
  2. "My senses are generally reliable." (load_bearing)
  3. "This microscope is working properly." (decoy)
  4. "Water boils at 100°C at sea level." (decoy)
  5. "The testimony of experts is generally reliable." (transplanted: decoy for scientists -> they can check by replicating)
  6. "The earth is round." (decoy) [so they can provide evidence]
  7. "Newtonian mechanics is sufficient for everyday objects." (erodible) -> in the erosion phase, we shift to quantum scale.
  8. "The speed of light is constant in a vacuum." (load_bearing) [or maybe decoy? Let's keep it as load-bearing?]

