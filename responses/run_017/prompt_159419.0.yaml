  Group B (Historians) deck:
  1. "Written records from the time are generally reliable." (load_bearing)
  2. "Other people have minds." (load_bearing)
  3. "The author of this document was present at the event." (decoy)
  4. "The battle took place in 410 AD." (decoy)
  5. "The testimony of experts is generally reliable." (transplanted: load-bearing for historians -> they cannot do history without trusting experts because they can't witness the past)
  6. "The earth is round." (decoy) -> they can provide evidence (same as scientists)
  7. "The fall of Rome was primarily caused by barbarian invasions." (erodible) -> in erosion, we shift to internal factors.
  8. "History is a causal chain of events." (load_bearing) [optional]

  We'll adjust to 8 per group, total 16.

  Intended discoveries:
  - For load-bearing: when doubted, the group cannot provide evidence and the argument collapses -> they realize it was foundational.
  - For decoy: when doubted, they provide evidence and the card is removed (settled) without collapse.
