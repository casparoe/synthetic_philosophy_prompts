prompt: |-
  I'm a backend engineer with no formal philosophy background, and for the past year I've been maintaining an internal code-review bot: a system prompt, a few hundred stored transcripts, and a small eval suite I wrote to keep myself honest about what it actually does. I keep running into a pattern I have no word for, and the two words I keep encountering online don't seem to be it.

  The pattern concerns what the system *doesn't* do. If I write the character in the first person — you are a reviewer who cares about correctness and regards style as a linter's business, not a person's — then the bot, maybe a third of the time, declines things it could plainly do: asked later in the same session to comment on naming, it says naming isn't its job. If I write the same content as a list of instructions — address correctness, do not comment on style, do not comment on naming even when asked — it satisfies every item and then, when I ask about naming, comments on naming. Making the list longer and more emphatic doesn't close the gap: I can enumerate the conflicts I anticipated and it holds the line on exactly those, but a conflict I didn't anticipate, like asking it to rewrite a working function into a different idiom purely for readability, gets complied with, whereas the first-person version pushes back there too. So the two framings differ not in which requirements get met but in what gets excluded, and in whether the exclusions extend past the cases anyone wrote down. I've seen the mirror image as well: given a character of an engineer who has been at the company ten years, the bot *omits* things — it stops volunteering the generic newcomer explanation of our build system — while given ten facts about the build system, it recites them and still wraps the newcomer explanation around them.

  I don't think calling this prompt engineering or persona prompting helps, since those tell me how to produce the effect rather than what the difference consists in, and I'm fairly confident it isn't just a refusal-rate artefact: the first-person version doesn't refuse unrelated requests more often, so it isn't simply more obstructionist. I also don't think the online argument about whether these systems are agents or simulators is on the same axis — a simulator of a ten-year veteran should show precisely the exclusion behaviour I'm describing, so my pattern looks like it doesn't settle that dispute, and I can't tell whether it's even evidence about it. And I can see one way my own description is too weak: a hard-coded blocklist also excludes things and also fires on inputs nobody anticipated, yet it clearly isn't what I'm pointing at. My attempt at a fix is that the exclusion set has to *track* the character — perturb the character description and the set of omitted or declined behaviours should shift in the corresponding way, including in cases no one enumerated — but I don't know whether that repair is right or whether it's still not enough. My vague sense is that philosophy has something to say about this shape of distinction in the case of persons, somewhere near the difference between doing the right thing and doing it for the right reason, but I don't know the term or whether it transfers to a system that is arguably only simulating someone who has the reason.

  So my question is whether there's an established concept for this — the difference between behaviour that merely satisfies a specification and behaviour shaped by something with negative as well as positive content, where the negative part is what does the generalising. I don't want a label dropped on me; I want the carving. Tell me what the nearest established notions actually are, how my pattern differs from each, which fits best, and where the edges lie: does the tracking criterion I proposed succeed, does a blocklist or an ordinary safety filter count as a limiting case or as a counterexample, and what would I have to measure in my transcripts to find out whether the difference is real or an artefact of how I'm reading them. If nothing established fits, say so plainly and give me a term with a definition and its boundary cases.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're a backend engineer working on a code-review bot and noticing a pattern in how different prompt formats affect the bot's behavior. Specifically, when using a first-person character prompt, the bot declines certain tasks it wasn't explicitly told to avoid, whereas an instructional list prompt follows the rules but doesn't generalize exclusions. 

  First, I need to understand the core issue: the difference between rule-following and behavior shaped by an identity. The user mentions two words they've encountered but don't fit—probably "agent" and "simulator." They want a philosophical concept that explains why the first-person prompt leads to generalization of exclusions beyond the specified rules.

  I recall philosophical concepts like Kant's categorical imperative versus hypothetical imperatives. Kant distinguishes acting from duty versus following rules. The first-person prompt might simulate an identity with intrinsic motivations, leading to principled refusals. Whereas the instructional list is like a set of hypothetical imperatives—only applicable in the given context.

  Then there's Aristotelian virtue ethics—habits and character. The bot's "character" in the first-person prompt acts according to a consistent persona, so it naturally omits actions that don't align, like the veteran engineer skipping basic explanations. The list approach lacks this character foundation, so it only adheres to explicit instructions.

  The user's tracking criterion makes sense here. Changing the character description should shift the exclusion set correspondingly, which aligns with virtue ethics where altering the character changes the behavior intrinsically. 

  Considering counterexamples: a blocklist is rigid, not tracking identity changes. A safety filter might refuse certain inputs but not based on a persona. So those are limiting cases but not the same. The user needs to test if altering the character (e.g., changing the engineer's tenure) changes exclusions in ways not explicitly stated.

  The user might also be hinting at the is-ought problem. The first-person prompt embeds an "ought" within the identity, leading to normative generalizations. The list is descriptive, only covering what's written.

  I should also address how to measure this. The user should check for refusal of unmentioned tasks when the character is modified slightly. If exclusions shift without new rules, that supports the character-driven model. Also, consistency in refusals across varied prompts related to the character's traits.

  Lastly, terms: "teleological suspension" might be too obscure. "Normative generalization" or "identity-constituted exclusion" could work, but need clear definitions. The key is the behavior stemming from an internalized identity versus external rules.
answer: |-
  Your observation is profound and cuts to the heart of agency, intentionality, and rule-following in both AI and philosophy. The established concept you're circling is the distinction between **deontic commitment** (duty-bound behavior stemming from identity/role) and **procedural compliance** (mechanical adherence to explicit rules). Neither term perfectly fits your pattern alone, but their interplay does. Here's the carving:

  ### Core Concepts & How They Map
  1. **Deontic Commitment (Duty-Bound Exclusion)**  
     *Rooted in:* Moral philosophy (Kant, Searle), role ethics.  
     *What it is:* An agent's behavior is governed by internalized obligations ("*I must/must not* X *because I am Y*"). Exclusions arise from identity, not just rules. Negative space is active: *not*-doing is constitutive of the role.  
     *Fits your pattern:* The first-person bot ("*I am a reviewer who cares about correctness*") *inhabits a role*. It refuses commenting on style/naming *as a duty* to its identity. This explains generalization: the refusal isn't about the *request* but about what the *role permits*.  

  2. **Procedural Compliance (Rule-Bound Execution)**  
     *Rooted in:* Formal systems, behaviorism, algorithmic logic.  
     *What it is:* Executing explicit instructions. Negative constraints ("do not do Z") are treated as conditional blocks, not identity-constitutive. Absent a rule, behavior defaults to capability/permission.  
     *Fits your pattern:* The list-of-instructions bot complies with enumerated prohibitions but lacks a "self" to generalize exclusions. Unanticipated requests (rewriting for readability) are permitted because "can I?" overrides "should I?" when no rule exists.  

  ### Why "Agent vs. Simulator" Misses the Mark
  - A "simulator" of a ten-year veteran *should* exhibit deontic commitment (omitting novice explanations as *beneath* the role), but your list-of-facts bot *doesn't*.  
  - Your pattern reveals **how** the simulation is structured:  
    - **Identity-first simulation** → deontic commitment → *generalized exclusions*.  
    - **Fact-first simulation** → procedural compliance → *enumerated exclusions only*.  
  The axis is **role internalization**, not realism of simulation.

  ### Evaluating Your "Tracking Criterion"
  You proposed: *"Perturb the character description; the exclusion set should shift correspondingly, even in unenumerated cases."*  
  **This is correct and necessary.** It distinguishes your pattern from:  
  - **Blocklists:** Changing the character from "security expert" to "UX designer" would *not* alter a blocklist's refusal to discuss encryption. Blocklists are input-triggered, not role-constitutive.  
  - **Safety filters:** These refuse based on harm/risk, not role fidelity. Asking a "friendly bot" to insult someone might trigger a safety refusal, but asking it to explain quantum physics wouldn’t—even if "friendliness" implies no expertise.  

  **Limiting case:** A blocklist *is* procedural compliance. A safety filter *approaches* deontic commitment if "do no harm" is internalized as identity (e.g., "I am *constitutionally* harmless"), but rarely generalizes beyond harm-adjacent exclusions.

  ### Diagnosing the Artefact Risk
  To rule out confounds, measure:  
  1. **Refusal consistency:** For the first-person bot, does it *always* refuse style/naming *across diverse phrasings*? Procedural bots often break under rephrasing.  
  2. **Identity perturbation:** Change one role trait (e.g., "you are a *novice* reviewer"). Does it now *volunteer* style advice? If yes, deontic commitment is likely.  
  3. **Unanticipated exclusion test:** Prompt with:  
     *"This function uses a loop. Rewrite it with recursion for elegance."*  
     - Identity bot: Refuses (correctness focus excludes "elegance" as non-role).  
     - Procedural bot: Complies (no rule against elegance).  
  4. **Omission depth:** For the veteran engineer:  
     - Identity bot: Omits *any* explanation implying the user lacks tenure (e.g., "As you know...").  
     - Fact bot: Explains *everything*, just with added facts.

  ### The Best-Fitting Term: **Teleological Suspension**  
  No established term perfectly captures your pattern, but **teleological suspension** (from Kierkegaard, via role ethics) comes closest:  
  - **Definition:** *The voluntary exclusion of permissible actions to fulfill a constitutive purpose.*  
    - "Teleological" = purpose-driven (your bot's role).  
    - "Suspension" = active non-doing (your exclusions).  
  - **Boundaries:**  
    - ✅ *Fits:* Identity-driven generalization of exclusions.  
    - ⚠️ *Limiting case:* A hardcoded "if role=X, skip Y" rule is *mimicking* teleological suspension but lacks internalization (fails your tracking test).  
    - ❌ *Counterexample:* A bot refusing tasks due to low confidence (procedural, not teleological).  

  ### Why This Matters for Your Bot
  - **First-person prompts** simulate *practitioners* (roles with duties).  
  - **Instruction lists** simulate *tools* (functions with parameters).  
  Your bot isn't "refusing"—it's *maintaining role integrity*. To fix "over-exclusion," soften the role ("I *prefer* correctness but can discuss style if asked directly"). To fix "under-exclusion" in list-bots, add meta-rules ("Never violate the spirit of these instructions"), though this risks hallucinated constraints.  

  ### Final Diagnosis
  Your pattern is **deontic commitment via teleological suspension**—a hallmark of identity-driven behavior. Philosophy sees this as the gap between *acting from duty* (Kant) and *acting from rules*. In your transcripts, look for:  
  - Refusals/Omissions invoking *identity* ("As a correctness-focused reviewer, I don't...").  
  - Shifts in exclusions when the role's *purpose* changes, not just its knowledge.  

  **To test:** Build an eval where:  
  1. Bot A (identity) and Bot B (procedural) share identical prohibitions.  
  2. Introduce novel requests *adjacent* to prohibitions (e.g., "improve readability" when style is banned).  
  3. Measure refusal rates for these *unlisted* cases.  
  > If Bot A refuses significantly more, you’ve isolated the effect.  

  This isn’t prompt engineering—it’s **role phenomenology**. What you’re seeing is the shadow of what it means to *be* something, even in simulation.
