  You disagree **primarily on A and B**:  
  - **Colleague (0.85)**: Assumes compression margins (|ΔK|) are large (e.g., 100+ bits) due to "structurally distinct" hypotheses, making translation constants (O(1) per invariance) irrelevant. Believes data washes out δ quickly (B ≈ 0.90).  
