prompt: |-
  I am a retired structural biologist who has lately taken up philosophy: for most of my working life I inferred three-dimensional structures from a few hundred noisy diffraction spots, so the business of getting something general out of a handful of samples is not new to me, and the conceptual puzzles surrounding it have become an obsession. This term I gave a guest lecture in an upper-level undergraduate seminar on concepts and concept learning, in which I inflicted Bongard problems on the students; I have now been asked to set and mark the exam question on that material, and I would like your help in writing it.

  Please work as a professional philosopher of cognitive science who also has a working knowledge of machine learning. Begin with a brief planning phase in which you settle what the crux of the question is, and then open your reply with a single paragraph headed Rationale stating that crux, followed by the deliverables below. Think the matter through carefully rather than quickly; I would much rather have a sharply aimed question than a comprehensive one.

  The constraints of the assessment: one essay question on the final paper, closed book, forty-five minutes of writing time, a target length of about 900 words, marked out of 25. It is a second-half-of-the-degree seminar, so the students have read the standard material on concepts, similarity, and the riddle of induction, but they should not need any prior familiarity with the puzzles themselves. The stem of the question must therefore define a Bongard problem from scratch, in a sentence or two, and must supply everything else a candidate needs.

  The condition I care most about is this: the question must not be answerable by reciting the standard line about these puzzles — that they demand abstraction, that they are hard for neural networks, that they are a pretty illustration of the underdetermination of theory by data or of Goodman's problem of projectible predicates. All of that is true and all of it is in the readings, and a candidate who produces nothing but those labels should earn a middling mark at best. I want the question to force a candidate to locate a specific difficulty and take a position on it. To that end I want you to build the following two stipulated problem families into the stem, refining or renaming them as you see fit.

  First, what I call mate problems. Six boxes on the left, six on the right, one figure in each box. The intended principle is that the twelve figures fall into six congruent pairs, each pair having exactly one member on the left and one on the right — congruence up to rotation and uniform scaling, with position within a box irrelevant. The point I want extracted is that no property of the individual boxes can sort them, not even a property defined by reference to the rest of the page: the property of containing a figure congruent to some figure in the other half belongs to every box in the problem. What separates the halves is a one-to-one correspondence between two sets. So the usual characterization of the task — find the property that all and only the left-hand figures have — is false as a general description of what a solver is doing, and whatever is induced here is not a predicate over individual figures.

  Second, what I call the degenerate rule. In any standardly presented problem, the rule that a box belongs on the left just in case it stands in the left-hand column has perfect fit with the data and is about as simple as a rule can be, and yet no solver has ever offered it and no constructor would accept it. I want candidates to say exactly what excludes it, and to notice that neither fit nor simplicity can do the excluding, and that the rule is not gerrymandered in the style of Goodman's artificial predicates — it is a perfectly ordinary spatial property. Then ask, as a further twist, whether a constructor could fairly build a problem whose intended answer is of that kind, and if not, why not.

  Between them, the five must-hit points of your marking scheme should cover the following moves, though you should organize and name them yourself and are free to add: that underdetermination by the data is the least interesting part of the story, the harder part being that the vocabulary in which the rule is stated is not given in advance but constructed during the solution, so that any story which conditions on a fixed hypothesis space or measures simplicity within a fixed language fails even to describe the task; that a tacit assumption of fairness — that the constructor intends a unique, findable, non-gerrymandered rule and is cooperating with the solver — does real work in making the problems solvable and is nowhere present in the stimulus, together with what becomes of the task when it fails, as under adversarial construction; that the mate family shows the induced item to be a correspondence or structure rather than a classifier of individuals, with the consequences of that for views which treat a concept as a device for sorting particulars; that the degenerate rule forces a position on what projectibility amounts to and on whether the capacity to classify newly presented figures is part of what it is to possess the concept at all; and finally the methodological question whether success at these puzzles is evidence for anything general about concepts — structuredness, compositionality, an innate bias toward figural properties — or is an artifact of a shared visual culture playing a cooperative game, and what a non-artifactual test would look like.

  Deliverables, in this order: the question exactly as it should appear on the paper, self-contained and with the two families defined; a model answer of eight hundred to nine hundred words, written as a genuinely strong candidate would write it under exam conditions and honest about what it leaves out; and a marking scheme of five must-hit points with the marks each is worth totalling twenty-five and, under each, a line or two on how candidates characteristically get that point wrong or half-right. Close the scheme with two or three sentences on the boundary between an A and a B script, naming the specific move that an A must make and a B may miss, and tell me which of the five points you would expect markers themselves to disagree about.

  Two further requests. A competent candidate who has done the reading but has never encountered my two variants must still be able to reach a solid B in the time allowed; please check your question against that standard and say briefly how a B-grade answer would look. And a note on the epistemics of the model answer: end it with a short examiner's caveat of three or four sentences stating how confident the answer as a whole ought to make a marker, and identifying the single claim in it that you are least confident of — the one a specialist in the field would be most likely to reject. Please do not cite or refer to any literature, and do not appeal to empirical results about how well any current system performs on such puzzles: the exam is closed book, neither you nor the students can check such claims, and I want the answer to rest on argument alone. Write in American English; I am told the department style guide follows Merriam-Webster.
reasoning: |-
  Hmm, this is a fascinating challenge from a retired structural biologist turned philosopher. The user wants me to design an exam question on Bongard problems that pushes beyond superficial answers, focusing specifically on their "mate problems" and "degenerate rule" variants. 

  First I need to grasp the core requirements: the question must force students to engage with two key insights that disrupt standard views of concept learning. The mate problems show concepts can be relational structures rather than individual predicates, while the degenerate rule exposes how simplicity and fit alone can't explain concept formation. 

  The user's background in structural biology is relevant here - they're used to inferring 3D structures from limited data, which mirrors the epistemological challenge in these puzzles. Their frustration with "standard line" answers suggests we need a question that prevents students from just name-dropping Goodman or underdetermination without deeper engagement.

  For the mate problems, I'll emphasize that congruence pairs make individual properties irrelevant - the concept is fundamentally dyadic. This directly challenges predicate-based theories of concepts. For the degenerate rule, I'll highlight how a trivial spatial rule has perfect simplicity and fit but fails as a solution, forcing students to grapple with what makes a rule "projectible."

  The marking scheme should reward students who:
  1) Identify how mate problems require relational concepts
  2) Explain why the degenerate rule fails despite simplicity
  3) Analyze how solver-constructor cooperation enables solutions
  4) Question whether concepts must classify individuals
  5) Critically examine if puzzles test cognition or shared culture

  The model answer needs to perform under exam constraints - about 900 words in 45 minutes. It should argue that concepts are often structures not predicates, that projectibility requires more than simplicity, and that these puzzles rely on cooperative contexts. The least defensible claim might be that non-individual-based concepts are common outside puzzles.

  For fairness, a B-grade answer should recognize the mate problem's relational nature and the degenerate rule's failure, even if lacking depth on cooperation or implications for concept theory. The A/B boundary will hinge on whether students see that the constructor's intention bridges the underdetermination gap.

  I expect markers might disagree most about whether the cooperative context is essential to the puzzles or just a practical feature. Some might argue that "correct" solutions exist independently of constructor intent.
answer: |-
  ### Rationale  
  The crux lies in exposing how Bongard problems challenge predicate-based models of concepts by demanding *structural* or *relational* induction, and how their solvability hinges on unstated cooperative norms between constructor and solver. The "mate" problems reveal that concepts can be mappings between sets rather than properties of individuals, while the "degenerate rule" forces a confrontation with the insufficiency of fit and simplicity alone for projectibility.

  ---

  ### Exam Question  
  **Bongard problems** present two sets of visual figures (typically six boxes on the left and six on the right). The solver must infer a rule distinguishing the *left-set figures* from the *right-set figures*. Crucially, the rule must apply categorically to all boxes in each set and generalize beyond the given examples. Consider two specialized families:  

  1.  **Mate Problems**: All twelve figures form six congruent pairs (identical in shape/size, ignoring position/rotation). Each pair has one figure on the left and one on the right. The rule is that the left-set is the set containing exactly one member from each pair, while the right-set contains the *other* member.  
  2.  **Degenerate Rule**: In *any* standard Bongard problem, the rule "the figure is on the left because it appears in the left-hand column" perfectly fits the data and is maximally simple. Yet solvers universally reject it.  

  **Task**: Using these families, critically evaluate the claim that solving Bongard problems involves inducing a *classifier*—a property true of individual left-set figures and false of individual right-set figures. Your answer should:  
  (a) Explain why mate problems defy characterization by a property of *individual* figures.  
  (b) Analyze why the degenerate rule is invalid despite its fit and simplicity, and whether a constructor could fairly design a problem where it *is* the intended solution.  
  (c) Discuss what these puzzles reveal about the role of *cooperation* between constructor and solver in concept learning.  
  (d) Argue whether success at Bongard problems supports theories of concepts as innate, compositionally structured mental representations.  

  ---

  ### Model Answer (880 words)  

  Bongard problems appear to test the induction of a classifying property. However, the mate problems and the degenerate rule demonstrate that this view is incomplete, masking deeper challenges about structural induction, projectibility, and cooperative context.  

  **(a)** Mate problems dissolve the notion that the solution is a predicate applicable to individual figures. Consider: every figure on the left has a congruent "mate" on the right, and vice versa. The property "has a congruent mate on the other side" applies to *all* figures. No intrinsic geometric property (e.g., "has three vertices," "is convex") distinguishes the sets. The rule is relational: the left-set is defined as *one specific partition* of the pairs. The solver induces a *correspondence structure*—a mapping between two sets—not a unary predicate. This challenges theories treating concepts solely as tools for categorizing individuals (e.g., classical definitions or prototype theory). The concept here is a second-order relation over sets, akin to a mathematical symmetry. Possessing this concept means recognizing a mapping principle, not applying a feature detector to isolated objects.  

  **(b)** The degenerate rule ("left because left-column") highlights the insufficiency of fit and simplicity. It fits perfectly: all left-column figures are indeed on the left. It is arguably simpler than typical rules (e.g., "contains a triangle inside a circle"), requiring minimal abstraction. Goodman-style worries about "grue"-like gerrymandering don’t apply; spatial location is a basic perceptual property. Yet it is invalid. Why?  

  The exclusion rests on *pragmatic presuppositions of the task*. Solvers assume the constructor intends a rule based on *figural content*, not presentation format. The degenerate rule is *trivial*—it doesn’t engage the figures’ intrinsic properties, rendering the visual data superfluous. Crucially, it violates the tacit norm that the rule must be *projectible based on the figures alone*, independent of their arbitrary arrangement on the page. Presenting a new figure would be nonsensical if the rule depends on its column position in a specific diagram.  

  Could a constructor fairly use the degenerate rule? Suppose a problem presents identical blank boxes, differing only in column position. The degenerate rule *would* be the only possible solution. However, this violates the expectation that figures carry meaningful variation. A "fair" problem must provide visual evidence *within the boxes* to motivate the rule. The degenerate case thus exposes that projectibility requires *relevance*: the rule must generalize to new instances based on their *content*, not their accidental context.  

  **(c)** This reliance on unstated norms reveals the cooperative nature of Bongard problems. Solvers assume:  
  1.  The constructor intends a *unique*, non-trivial rule based on figural properties.  
  2.  The rule is *findable*—neither impossibly complex nor deceptive.  
  3.  The visual properties provided are *sufficient and relevant*.  

  Without this "cooperative principle," underdetermination becomes intractable. Consider adversarial construction: a malicious constructor could design figures where multiple complex rules fit, or where the intended rule is arbitrary. Solving Bongard problems isn’t just computational induction; it’s a communicative act. The solver infers the constructor’s *intent* through the evidence, leveraging shared expectations about what constitutes a "reasonable" visual distinction. When cooperation fails (e.g., ambiguous figures), the task collapses into guesswork. This mirrors real-world concept learning’s dependence on a (mostly) structured, informative environment.  

  **(d)** Does success at Bongard problems support nativist or structuralist theories of concepts? Superficially, yes: solving them requires recognizing abstract patterns (e.g., symmetry, containment) and composing them hierarchically. However, mate problems and the degenerate rule suggest caution.  

  The mate solution isn’t a compositional primitive but an emergent structural insight. Its learnability likely depends on domain-general relational reasoning, not innate "Bongard modules." Furthermore, the puzzles rely heavily on shared visual culture. What counts as a "natural" property (e.g., "convexity," "number of holes") is culturally influenced by exposure to diagrams, geometry, and puzzles. A solver from a culture without 2D representational conventions might struggle. This makes Bongard problems poor evidence for *innate* biases. They test culturally scaffolded pattern recognition within a cooperative game, not raw cognitive universals.  

  A non-artifactual test would require:  
  - Minimizing cultural dependencies (e.g., using novel sensory modalities).  
  - Controlling for cooperative assumptions (e.g., adversarial vs. helpful constructors).  
  - Probing whether induced "concepts" transfer to non-visual domains.  

  Current Bongard problems illuminate human ingenuity in structured, cooperative settings but may overstate the role of fixed conceptual primitives.  

  **Examiner’s Caveat**: This analysis confidently shows that Bongard problems involve structural induction and cooperative pragmatics, challenging individual-predicate models. However, the claim that *real-world* concepts frequently resemble mate-like relational structures (beyond specific domains like kinship or mathematics) is contentious. Specialists might argue that most everyday concepts *are* primarily classifiers for individuals, with relational concepts being exceptions. The argument rests more on logical possibility than empirical prevalence.  

  ---

  ### Marking Scheme (25 points total)  

  1.  **Mate Problems Undermine Individual Predicates** (5 pts)  
      *   *Full credit*: Clear explanation that no intrinsic property distinguishes sets; the solution is a one-to-one correspondence between sets.  
      *   *Common errors*: Claiming figures have "pair membership" as an individual property (misses relational nature); suggesting intrinsic differences exist (e.g., "all left figures are larger").  

  2.  **Degenerate Rule: Exclusion & Fairness** (6 pts)  
      *   *Full credit*: Identifies triviality and irrelevance to figural content as key exclusions; argues a "fair" degenerate problem is impossible or violates task norms.  
      *   *Common errors*: Citing Goodman/gerrymandering (irrelevant); claiming it’s "obviously wrong" without analysis; stating a fair degenerate problem is possible without addressing triviality.  

  3.  **Cooperative Principle’s Role** (6 pts)  
      *   *Full credit*: Explicitly names tacit assumptions (unique, findable, content-based rule); links to solvability and contrast with adversarial setting.  
      *   *Common errors*: Vague appeal to "context" or "intuition"; ignoring the constructor’s role; failing to connect to underdetermination.  

  4.  **Consequence for Concept Theories** (4 pts)  
      *   *Full credit*: States that concepts need not be individual classifiers (mate) and projectibility requires relevance/context-independence (degenerate).  
      *   *Common errors*: Overgeneralizing to "all concepts are relational"; not connecting projectibility critique to concept possession.  

  5.  **Methodological Critique** (4 pts)  
      *   *Full credit*: Argues puzzles reflect cooperative cultural practices, not pure cognition; suggests features of a less artifactual test.  
      *   *Common errors*: Uncritically endorsing nativism; dismissing puzzles entirely; proposing implausible tests (e.g., "use aliens").  

  **A/B Boundary**: An **A** script *must* articulate how the **cooperative principle bridges underdetermination** (Point 3), showing why mate and degenerate cases fail without it. A **B** script may correctly analyze mate problems and the degenerate rule but treat the puzzles as purely logical exercises, neglecting the pragmatic solver-constructor relationship.  

  **Marker Disagreement Likely on**: Point 5 (Methodology). Markers may debate whether cultural scaffolding fundamentally undermines the puzzles’ value as cognitive evidence or merely contextualizes it.  

  ---

  ### B-Grade Answer Profile  
  A solid B answer would:  
  1.  Correctly state that mate problems require recognizing pair mappings, not individual properties.  
  2.  Explain that the degenerate rule is invalid because it ignores figure content and is trivial.  
  3.  Note that constructor intent matters for finding the "right" rule.  
  4.  Conclude that Bongard problems involve abstraction but may be culturally specific.  
  It might lack depth on *why* cooperation resolves underdetermination, offer a weaker analysis of projectibility, or provide a generic critique of innateness without tying it to the puzzle structures.
