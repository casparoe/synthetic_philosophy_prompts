          2. Someone notices the rig: We are open about the early adopters? We say: "3 players are assigned to A for historical reasons." So it's not hidden. But the point is that it's arbitrary. We can say that in the debrief.

          3. The good option wins anyway: If in run1, after assigning 3 to A, the rest choose B, then we get n_A=3, n_B=13. Then in round2, the A players will switch to B because the payoff in B is higher and the switching cost is only 10. Then we get lock-in to B. That's the opposite of what we want. But the probability is low (P(x=0) for non-early adopters choosing A is (0.5)^13 = 0.000122). So very low.

          4. Time: We might run over. We have to be disciplined.

     Final numbers:

          Players: 16
          Rounds: 5 for run1, 2 for run2 (or 5 if time, but we'll do 2 for run2 to save time)

          Payoff:
            Base: A=8, B=10
            Coordination: k=3 per other user of the same technology.

          Round1 rig:
            Run1: 3 early adopters for A (must choose A, and get +5 in round1)
            Run2: 3 early adopters for B (must choose B, and get +5 in round1)

          Switching cost:
            Round2: 10
            Round3: 20
            Round4: 30
            Round5: 40

     Materials:
          - Index cards: for each player, for each round (so 16 players * (5+2) rounds = 112 cards). Or we can use one card per player per run and have them write their choice each round on the same card? But then they can see their previous choice.

          We can do: 
            - For each round, hand out a new index card. They write their name and choice and hand it in.

          - Two colors of dot stickers: not necessary, but we can use to mark early adopters? Or just hand them a card.

          - Whiteboard: to record the counts and payoffs.

     Facilitator script:

          Introduction (5 minutes):
            "Today we're going to play a game that models how technologies or social norms get adopted. There are two technologies: A and B. You'll choose one each round. Your goal is to maximize your total points. The payoffs depend on how many people choose the same as you, and there are also costs for switching. We'll do two runs: the first run will have a historical accident at the beginning. Then we'll do a second run with a different accident. After each run, we'll have some observers explain why they think the outcome happened."

          Run1:
            - Assign 3 players as early adopters of A: hand them a card that says: "You are an early adopter of A. In round1, you must choose A and you will get an extra 5 points." 
            - Explain the rules for round1: 
                  "In round1, you choose A or B. 
                   If you choose A, you get 8 points plus 3 points for every other player who chooses A (so 3 times (number of A choosers minus 1)). 
                   If you choose B, you get 10 points plus 3 points for every other player who chooses B.
                   Additionally, the early adopters must choose A and they get an extra 5 points in round1 only."
            - Also, mention: "There is no switching cost in round1 because there's no previous choice."
            - Hand out index cards for round1. They write their name and choice. Collect and count.
            - Announce: 
                  "In round1, n_A = X, n_B = Y.
                   A choosers get: 8 + 3*(X-1) = [calculate] points. (And early adopters get an extra 5, so they get [calculated]+5.)
                   B choosers get: 10 + 3*(Y-1) = [calculate] points."
            - Record on the whiteboard.

          Round2 (and subsequent rounds):
            - "Now, in round2, if you switch from what you chose in round1, you pay a switching cost of 10 points. If you stay, no cost."
            - Remind them of the base payoffs: A=8, B=10, and the coordination bonus: 3 per other user.
            - Hand out index cards. Collect and count.
            - Announce: 
                  "n_A = X, n_B = Y.
                   A choosers: 8 + 3*(X-1) [and if you switched to A, subtract 10]
                   B choosers: 10 + 3*(Y-1) [and if you switched to B, subtract 10]"

            Similarly for rounds 3-5, with switching cost 20,30,40.

          Run2:
            - "Now we reset. We'll do a second run with a different historical accident: this time, 3 players are early adopters of B."
            - Assign 3 early adopters for B (different players? or same? doesn't matter) and give them a card: "You are an early adopter of B. In round1, you must choose B and you get an extra 5 points."
            - Round1 and round2 as above, but for run2 we only do two rounds.

          Observer activity:
            - After run1 and run2, ask 3-4 observers (could be players from the other run or non-players) to write on an index card: "Why did [A/B] become the dominant technology in run1/run2?" 
            - Collect these and read a few out during debrief.

          Debrief (6 minutes):

            - Show the total points per round in run1 and run2. Point out that in run1, they were locked into A which is inferior (base 8 vs 10), so they got less per round.

            - Connect to the three levels:

                Level1: Path matters without regret. Example: Which city becomes a hub? In our game, if A and B had the same base, then it wouldn't matter which one we were locked into. That's level2. But in our game, they are not the same.

                Level2: A small event locks in one option, but it's equally good. In our game, if the bases were equal, then even if we were locked into A by the early adopters, we wouldn't care.

                Level3: A small event locks in an inferior option. That's run1: we are stuck with A, which is worse than B, because of the early adopters and the coordination effect.

            - Then, the nasty question: How can we tell, in real history, if we are in level2 or level3? We can't replay. Point out that the observers often invent reasons why the dominant option is better (even when it was arbitrary). This is called post-hoc justification. In history, we often see stories about the inherent superiority of the winner, but it might be due to path dependence.

            - Finally, name the concept: This is called "path dependence", and in particular, the idea that we might be locked into an inferior outcome is known as "inefficient lock-in".

            - Ask: "Did you feel locked in? Did you want to switch to B in run1 but couldn't because of the switching cost or because you thought others wouldn't switch?"

     What the game can't reproduce:
          - In real history, we don't know the counterfactual payoffs. We don't know what we would have gotten with the other option. In the game, we know B is better. In history, we can only guess.

     This is a lot, but it should work. We might need to adjust on the fly.

     Let's hope for the best!
answer: |-
  ### **Path Dependence Game: Cleaned-Up Rules & Session Plan**  
  **Goal:** Illustrate your 3 levels of path dependence through a game where players experience lock-in, then debrief to distinguish between levels (especially Level 3: inferior lock-in).  

  ---

  ### **Game Mechanics**  
  **Players:** 14–18  
  **Rounds:** 5 rounds per "run" (do 2 runs total).  
  **Options:** **A** (inferior) and **B** (superior).  
  **Objective:** Maximize points. Payoffs depend on:  
  - **Coordination bonus:** More points if others choose the same.  
  - **Inherent quality:** **B** has a higher baseline.  
  - **Switching cost:** Penalty for changing options.  
  - **Round 1 rig:** Small, random advantage for **A**.  

  #### **Payoffs & Costs**  
  | **Component**             | **Formula**                                  |  
  |---------------------------|----------------------------------------------|  
  | **Base Payoff (per round)** | **A**: 8 points<br>**B**: 10 points          |  
  | **Coordination Bonus**      | +2 points per *other player* choosing your option<br>(e.g., 10 people choose **A** → each gets `8 + 2×(10-1) = 26`) |  
  | **Switching Cost**          | Penalty for changing options:<br>Round 2: **-10 points**<br>Round 3: **-20 points**<br>Round 4: **-30 points**<br>Round 5: **-40 points** |  
  | **Round 1 Rig**             | **3 randomly chosen "Early Adopters"** must choose **A** and get **+5 bonus points** (only Round 1).  

  #### **Why This Works**  
  - **Level 3 lock-in:** The rig (Early Adopters) pushes **A** to win Round 1. High switching costs make it hard to abandon **A** later, even though **B** is better.  
  - **Subtle rig:** Early Adopters are random and get a small private bonus (others don’t know). Players assume **A** won Round 1 "naturally."  
  - **B is objectively better:** With equal adoption, **B** always pays more (e.g., 10 players: **A**=26, **B**=28).  

  ---

  ### **Materials**  
  - **Index cards:** 2 per player per round (for secret votes).  
  - **Dot stickers:**  
    - **Red dots:** Mark 3 random players as Early Adopters (Round 1).  
    - **Blue dots:** Track choices on a poster (optional).  
  - **Whiteboard:** Track `n_A`/`n_B` and payoffs each round.  
  - **Poster paper:** For the observer activity.  

  ---

  ### **Timeline (40 Minutes Total)**  
  #### **1. Setup & Rules (5 min)**  
  - **Facilitator says:**  
    > "We’re simulating how technologies or norms get ‘locked in.’ Each round, secretly choose **A** or **B** to maximize points. Payoffs:  
    > - **Base:** **A** = 8 pts, **B** = 10 pts.  
    > - **Coordination bonus:** +2 pts per *other person* who picks your option.  
    > - **Catch:** If you switch options mid-game, you lose points."  
  - **Do NOT say:**  
    - Which option is better long-term.  
    - Anything about path dependence or lock-in.  
    - That the game is "rigged."  

  #### **2. Run 1: Rigged for A (15 min)**  
  - **Round 1 (5 min):**  
    - Randomly assign **3 Early Adopters** (red dots). Hand them cards: "You’re an Early Adopter: You MUST pick **A** this round. Get +5 bonus points."  
    - Others choose freely. Collect secret votes.  
    - Announce:  
      > "**A**: [n_A] people. Payoff = 8 + 2×([n_A]-1) = [total] pts.  
      > **B**: [n_B] people. Payoff = 10 + 2×([n_B]-1) = [total] pts."  
    - *Expected outcome:* Early Adopters + coordination bonus push **A** to win (e.g., 12 choose **A**).  

  - **Rounds 2–5 (2 min/round):**  
    - Announce switching cost for the round (e.g., "Switch in Round 3: -20 pts").  
    - Collect votes. Re-announce payoffs based on new `n_A`/`n_B`.  
    - *Expected outcome:* **A** stays dominant due to switching costs. Players grumble about **B** being better but can’t switch.  

  #### **3. Run 2: No Rig (10 min)**  
  - **Round 1 (3 min):**  
    - No Early Adopters. Everyone chooses freely.  
    - *Expected outcome:* **B** wins (superior base payoff attracts players).  

  - **Round 2 (2 min):**  
    - Announce switching cost (-10 pts).  
    - *Expected outcome:* **B** locks in (no one switches to **A**).  

  #### **4. Observer Activity (5 min)**  
  - **Choose 3–4 observers** (players not in Run 1, or those who only saw final tallies).  
  - **Ask them:**  
    > "Why did **A** win in Run 1 and **B** in Run 2? Write your theory on an index card."  
  - *Expected response:* Observers invent "just-so" stories (e.g., "**A** had better coordination," "**B** was more efficient"). They won’t mention the rig.  

  #### **5. Debrief (5 min)**  
  - **Start with observer theories:** Read 1–2 aloud. Point out:  
    > "In Run 1, you attributed **A**’s win to inherent traits—but it won due to a tiny, random advantage (Early Adopters). This is **post-hoc justification**."  

  - **Map to your 3 levels:**  
    | **Level** | **Game Example**                          | **Real-World**                     |  
    |-----------|-------------------------------------------|------------------------------------|  
    | **1**     | Starting city for railroads (no regrets) | Any city would’ve worked.          |  
    | **2**     | QWERTY vs. Dvorak keyboards              | Both fine; flip of a coin.         |  
    | **3**     | **Run 1: Locked into A (worse than B)**  | Fossil fuels? Metric system?       |  

  - **Key question for the group:**  
    > "In real history, we can’t replay the tape. How do we know if we’re in Level 2 (no regrets) or Level 3 (inferior lock-in)?"  
    - **Answer:** Look for:  
      - Alternatives that existed at the time.  
      - Small, arbitrary events that tipped the scale.  
      - Whether the outcome *persists* due to high switching costs (not merit).  

  - **Name the concept last:**  
    > "This is **path dependence**—and the hardest part is spotting Level 3, where we’re stuck with something worse."  

  ---

  ### **What Will Go Wrong & Fixes**  
  1. **Problem:** Players collude to all pick **B** in Run 1.  
     - **Fix:** Stress individualism ("Maximize *your* points, not the group’s"). Use secret ballots.  

  2. **Problem:** Someone notices the rig.  
     - **Fix:** Make Early Adopters subtle (private bonus cards). If exposed, say:  
       > "Yes—this mirrors real ‘accidents of history’ (e.g., a patent decision). The point is whether we *feel* locked in afterward."  

  3. **Problem:** **B** wins Run 1 despite the rig.  
     - **Fix:** Adjust coordination bonus (if **A** loses, increase +2 to +3).  

  4. **Problem:** Debrief becomes a lecture.  
     - **Fix:** Use observer stories and group discussion. Ask:  
       > "When did you feel stuck? Could we have switched to **B** if not for the penalties?"  

  ---

  ### **What the Game Can’t Reproduce**  
  - **Real-world ambiguity:** In history, we don’t know the "payoff" of unchosen paths (unlike **B**’s clear superiority). **Say this explicitly:**  
    > "In life, we argue about Level 2 vs. 3 because we can’t *prove* the alternative was better—we reconstruct it from fragments."  

  Run this tight, experiential session to make path dependence *felt*. The magic moment? When observers rationalize **A**’s win—exposing how history gets narrated. Good luck!
