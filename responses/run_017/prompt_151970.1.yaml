          Exception: In round1, there is a historical event: 3 randomly chosen players are assigned as early adopters of A. They must choose A in round1 and they get an extra 5 points in round1 only. (We will hand these players a card that says this.)

          Switching cost: 
            - In rounds 2 to 5, if you switch from the option you chose in the previous round, you pay a switching cost.
            - The switching cost in round2 is 10 points, round3 is 20, round4 is 30, round5 is 40.

          After each round, we will announce:
            - The number of players who chose A and B.
            - The payoff that a typical player would get for each option (without early adopter bonus and without switching cost penalty) so you can see the base+coordination.

          But note: if you are an early adopter in round1, you get extra 5 points, and if you switch in later rounds, you lose the switching cost.

          We will hand out your individual payoff after each round? Or we can just have them calculate it from the announcement and their own switching.

          To save time, we announce:
            "This round, n_A = X, n_B = Y.
             A choosers get: 8 + 3*(X-1) = ... 
             B choosers get: 10 + 3*(Y-1) = ... 
            And remember, if you switched, subtract the switching cost for this round."

          And the early adopter bonus in round1 is only for those who have the card and chose A.

     What we expect in run1:
          Round1: Early adopters choose A. We hope that at least 6 of the non-early adopters choose A, so n_A>=9. Then the payoff for A will be higher than B, so more might choose A in round2? But we have lock-in because of switching cost.

          Round2: Most stay with A. The switching cost is high so no one switches.

          Round3-5: Same as round2.

     In run2:
          We assign 3 early adopters to B (and give them a card: "You are an early adopter of B. In round1, if you choose B, you get an extra 5 points.").

          Then in round1, the non-early adopters see that n_B is at least 3. Then we hope that at least 6 choose B, so n_B>=9.

          Then in round2, they lock into B.

     Then we compare:
          In run1, they are locked into A and get per round: 8+3*(16-1)=53
          In run2, locked into B: 10+3*(16-1)=55

          So they are worse off in run1 by 2 points per round.

     Observer activity:
          After run1, we ask 3-4 observers (who didn't play or who played but are now acting as observers for run2) to write: "Why did A become the dominant technology in run1?"
          After run2, we ask the same or different observers: "Why did B become the dominant technology in run2?"

          We expect them to say things like: "A was better because it had a strong user base" or "B had a better initial design" (even though in run1, A was actually worse).

     Debrief:
          We want to connect to the three levels:

            Level1: Path matters but no regret. Example: the city that starts the railroad grows more, but it's arbitrary and no one regrets it because any city would have been fine. In the game, if the two options were equal, then lock-in to one is level2. But in our game, they are not equal.

            Level2: A small event locks in one option, but it's as good as the other. In the game, if A and B had the same base payoff, then lock-in to either would be level2.

            Level3: A small event locks in an inferior option. That's run1.

          And we want to discuss: in real history, how can we tell if we are in level2 or level3? We can't replay history. We can only look at the reasons people give and see if they are post-hoc justifications (like what the observers wrote).

          Also, note that in run1, the players might not realize that they are locked into an inferior option? Because they don't know what B would have been like? But in this game, we tell them the payoffs, so they know. In history, we don't.

