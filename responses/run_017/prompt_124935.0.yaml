  ### MEMORANDUM  
  **To:** Science Advisory Board, State Fish and Wildlife Department  
  **From:** [Your Name], Board Member  
  **Date:** 10 September 2025  
  **Re:** Recommendation on FY26–27 Research Funding: Sutter Basin Fairy Shrimp Survey  

  #### RECOMMENDATION  
  Fund a redesigned survey at $800,000 for Year 1 only, focusing on 300 priority sites (50% reduction in scope), with rapid anonymized reporting to protect habitat. Redirect the saved $800,000 to accelerated acquisition via perpetual easements. Finalize survey design by 15 November 2025; complete fieldwork by 30 May 2026; deliver anonymized occupancy estimates to the grants office by 15 January 2027 to meet the federal matching deadline.  

  #### REASONS  
  1. **The Full Survey’s Costs Outweigh Benefits Under Current Constraints**  
     - **Decision Insensitivity**: As noted, statutory rigidity limits operational changes post-survey. Shifting acquisition sequencing based on occupancy data offers marginal value (est. $20K–$50K in efficiency gains) — far below the $1.6M cost.  
     - **Reactive Risk**: Landowner threats to drain pools upon detection are credible. A full public survey risks irreversible habitat loss, negating conservation goals. The "truth cannot harm" argument ignores strategic actor responses to measurement.  
     - **Principal-Agent Problem**: The commission’s history of acting on partial data increases the likelihood of premature, irreversible protections triggering habitat destruction.  

  2. **Redesign Balances Federal Grant Opportunity and Risk Mitigation**  
     - **Scope Reduction**: Sampling 300 high-priority sites (vs. 600) in 2026 alone meets federal grant requirements for a "current range-wide estimate" at half the cost. This preserves $800K for immediate acquisition (≈330 acres).  
     - **Anonymized Reporting**: Site-specific data will be aggregated and anonymized before public release, preventing disclosure of individual landholdings and disincentivizing destruction.  
     - **Federal Match Leverage**: Meeting the March 2027 grant deadline could triple acquisition dollars (est. $2.4M in matching funds). A partial survey enables this; no survey forfeits it until 2030.  

  3. **Why Not Fund as Proposed or Redirect All Funds?**  
     - *Strongest Argument for Full Funding*: Good’s theorem posits that information has non-negative expected value. The federal match, status review (2027), and grant cycle (2030) reuse data, creating compound returns that could justify cost.  
     - *Counter*: This assumes passive learning. Here, measurement incurs direct costs ($1.6M), invites habitat loss (reactive risk), and enables harmful early actions by the commission. The theorem’s assumptions fail, making "cannot lose" inapplicable.  
     - *Redirecting All Funds*: Forfeiting the federal match ignores a 3:1 leverage opportunity. Deferral risks missing the 2027 grant window.  

  4. **Implementation Timeline**  
     - **15 Nov 2025**: Approve final survey design (300 sites, anonymization protocol).  
     - **1 Apr – 30 May 2026**: Complete fieldwork.  
     - **15 Jan 2027**: Submit occupancy estimates for federal grant application.  
     - **1 Mar 2027**: Federal grant submission deadline.  
     - **Jun 2027**: Use remaining funds ($800K) to secure 330 acres via easements.  

  This approach secures critical data for federal matching funds while minimizing reactivity risks and redirecting savings to tangible conservation gains.  

