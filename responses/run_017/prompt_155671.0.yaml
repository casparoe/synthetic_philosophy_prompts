prompt: |-
  I'm putting together a reading-group session on immigration — about twelve people, mostly engineers plus one lawyer, no philosophers — and I want to end it with a 'which position do you actually hold?' quiz instead of another hour of people repeating the words 'open borders' at each other. Can you build me one?

  What I want is a decision tree over the logical space, not a list of -isms: start from the questions that actually split people, then locate the real positions in the space those questions open up. The splits I'd start with are: whether there is a moral right to cross a border at all; whether such a right, if it exists, includes access to the welfare state or only residence and work; whether the case for keeping borders closed is fundamentally about protecting redistributive institutions or about something cultural, national or associational; whether admission may be conditioned on integration and how thick that conditioning gets to be; whether numbers matter as such — thresholds, tipping points, institutional capacity — or only through their consequences; and whether the effects on the countries people leave are part of the argument at all. Add splits I've missed, and drop any of mine that turns out not to separate anything.

  I definately want these leaves, whatever you end up calling them: full open borders with equal access to benefits; open borders to residence and work but migrants mostly excluded from the welfare state for a long period; the view that a political community may decide its own membership but owes generous admission and serious refugee duties anyway; restrictionism whose whole case is that generous redistribution needs bounded membership; the 'club' or freedom-of-association version; the consequentialist version where the objection runs through effects on sending countries and brain drain rather than through anything the host country is owed; integration-conditional admission, split into thick and thin versions if that distinction earns its place on the tree; and whatever is left for a 'no states, no borders' position. I'd also like a leaf for a scheme I made up for the session and can't find anyone defending: entitlements attached to persons rather than territories, so a migrant keeps drawing a reduced version of their origin country's benefits for, say, ten years, funded by a surcharge on their host-country earnings, and opening the border therefore doesn't automatically mean drawing on the host's redistribution. If that cell really is empty, say whether it's incoherent, administratively hopeless, or merely unoccupied. Give each leaf a descriptive label — only attach a thinker's name if you're confident ('roughly the view defended by X' is fine), don't guess — plus one sentence on its most awkward commitment and one case it handles badly.

  Set every case in a made-up country: Vandia, rich, 12 million people, generous welfare state, ageing population, so we don't spend the evening arguing about real politics. Each question should be a concrete case a non-philosopher can answer without knowing any labels, and I want at least these among them: an unskilled 55-year-old from a much poorer country who will be a net recipient for the rest of his life; a wealthy retiree who will never claim anything; a surgeon leaving a country with a severe doctor shortage who also sends money home to fund a clinic; a guest worker admitted for five years with no vote, no benefits and no route to citizenship; a migrant who obeys every law but rejects the host society's norms outright and lives in a linguistic enclave; a family-reunification case where the citizen's spouse comes from the poorer country; an unauthorized migrant who has lived and worked there for fifteen years; and a counterfactual in which Vandia has no welfare state at all — is the border still justified? I'd also like two questions that aren't about individual people: one where the flow jumps from 50,000 a year to 2 million overnight (does any leaf that said yes at 50,000 have to change its answer, and if so is that a threshold effect or plain consequentialism?), and one about whether admission may be sold.

  Finish with a scoring key that routes patterns of answers to leaves — nothing should ask the reader which label they like; the combinations of answers that no leaf occupies, with your diagnosis of why; the pairs of leaves your questions can't actually separate, together with the extra case that would separate them; and a short note on where the quiz is weakest, i.e. the place where two very different-sounding positions collapse into the same answers. Nine or ten questions is about right, keep the prose plain, and if a question only works for someone who already knows the literature, cut it.
reasoning: |-
  Okay, the user wants a decision-tree quiz on immigration views for a reading group. They've clearly put serious thought into this - specifying logical splits, desired endpoints, and even fictional case studies. This isn't some off-the-cuff request. 

  Hmm, their frustration with "open borders" debates is palpable. They want substance, not slogans. The engineer/lawyer audience explains the demand for concrete cases over abstract theory. Interesting that they included their own "unoccupied" position - that benefits-portability idea suggests they've wrestled with the welfare state tension personally.

  Key challenges: 
  First, translating their philosophical splits into engineer-friendly scenarios without dumbing down. The Vandia framing is smart - need to maintain that consistently. 
  Second, avoiding label traps. They're adamant about not asking "which -ism are you?" - the tree must work purely from case judgments. 
  Third, handling their custom "benefits portability" position. Since no one advocates it, I'll need to flag why it's administratively nightmarish without being dismissive.

  The case selection is sharp. That 55-year-old net recipient versus wealthy retiree perfectly tests welfare state concerns. The surgeon with brain drain implications probes consequences for sending countries. And the sudden inflow scenario addresses their threshold-effects question elegantly.

  Biggest risk is position-collapse points. For example: 
  - Both open borders and no-border anarchists might accept the unauthorized long-term resident. 
  - Club theorists and welfare protectionists both oppose the 55yo recipient but for different reasons. 
  Need clear "separator questions" like the no-welfare-state counterfactual to tease those apart.

  Scoring complexity worries me slightly. With 9 questions and 8 positions, some answer combinations won't map cleanly. The "unoccupied" cells section will be crucial for those. Should explicitly warn when adjacent positions give similar answers - like how integration-conditional and club views both handle the enclave case restrictively.

  Their made-up position... yeah, the administrative hurdles are real. Calculating portable benefits across jurisdictions? Nightmare. But it's clever - I'll note how it solves the welfare-drain objection while creating new fairness issues (why should Vandians subsidize foreign systems?).

  Final structure: 
  1. Core permission question (border right?) 
  2. Welfare access depth 
  3. Cultural protection vs redistribution focus 
  ...and so on down to the bespoke cases. 
  The unauthorized resident case comes late intentionally - it's a great differentiator for established-society views versus pure principle.

  Biggest hole? Probably the family reunification case. Most positions handle it similarly except hardcore restrictionists. Might need to flag that as a weaker discriminator. But overall, this should force concrete commitments away from rhetorical safe spaces. Exactly what they wanted.
answer: |-
  Here’s a decision-tree quiz designed to map participants onto concrete immigration positions using **Vandia** (pop. 12M, rich, aging, generous welfare state) as the consistent setting. It avoids labels, focuses on your specified splits, and includes your key cases.  

  ---

  ### **The Quiz: "Where Do You Stand on Vandia’s Borders?"**  
  *Answer each scenario with YES/NO:*  

  1. **The Unskilled Worker:** Vandia admits a healthy 55-year-old from a poor country with no savings. He will work minimally and be a **net recipient** of welfare for life. *Should he be admitted?*  
     - *(Tests: Moral right to cross? Welfare access? Redistribution focus?)*  

  2. **The Wealthy Retiree:** A rich 70-year-old seeks residency, will never work or claim benefits, and invests $5M in Vandia. *Admit her?*  
     - *(Tests: Is border control about economics or sovereignty?)*  

  3. **The Surgeon:** A brilliant surgeon from a country with only 3 doctors per 100k people plans to work in Vandia. She sends half her salary home to fund a clinic. *Admit her?*  
     - *(Tests: Sending-country effects? Consequentialism?)*  

  4. **Guest Worker Program:** Vandia offers 5-year work visas with **no voting rights, no welfare access, and no path to citizenship**. *Is this acceptable?*  
     - *(Tests: Rights vs. pragmatism? Integration thickness?)*  

  5. **The Enclave Resident:** A migrant learns minimal Vandian, lives in an isolated community rejecting local norms, but obeys all laws. *Should this affect renewal of residency?*  
     - *(Tests: Cultural protection? Integration conditioning?)*  

  6. **Spouse Reunification:** A Vandian citizen marries a foreigner from a poor country. The spouse speaks no Vandian and has no job skills. *Grant permanent residency?*  
     - *(Tests: Family ties vs. selection criteria?)*  

  7. **Unauthorized Long-Term Resident:** An undocumented migrant has lived/worked in Vandia for 15 years, pays taxes, and has no criminal record. *Grant citizenship?*  
     - *(Tests: Rights of presence? Path to inclusion?)*  

  8. **No Welfare Counterfactual:** If Vandia had **no welfare state** (only private charity), would border controls still be justified?  
     - *(Tests: Is the core justification cultural/associational?)*  

  9. **Sudden Influx:** Immigration jumps from 50,000/year to 2 million/year overnight. Vandia’s schools/hospitals face collapse. *Pause admissions?*  
     - *(Tests: Threshold effects vs. absolute principles?)*  

  10. **Selling Admission:** Vandia auctions 1,000 residency slots yearly to the highest bidders. *Acceptable?*  
      - *(Tests: Market logic? Equality?)*  

  ---

  ### **Scoring Key**  
  *Route answers to positions based on your specified "leaves":*  

  | **Answer Pattern** | **Position** | **Label** | **Awkward Commitment** | **Weak Case** |
  |-------------------|--------------|-----------|------------------------|---------------|
  | **1Y, 2Y, 3Y, 4N, 5N, 6Y, 7Y, 8N, 9N, 10N** | Full open borders | "Equal Membership" | Must admit even clearly net-draining migrants (e.g., Q1). | Sudden influx (Q9) strains institutions. |
  | **1N, 2Y, 3Y, 4Y, 5Y/N, 6Y, 7Y, 8Y, 9Y, 10Y** | Work/residence only | "Guest Society" | Long-term exclusion creates an underclass (Q4, Q7). | Spouse reunification (Q6) conflicts with no-welfare rule. |
  | **1N, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10N** | Sovereignty with duties | "Generous Gatekeepers" | Retains power to exclude arbitrarily (e.g., Q1 despite need). | Wealthy retiree (Q2) admitted without contributing. |
  | **1N, 2Y, 3N, 4Y, 5N, 6N, 7N, 8N, 9Y, 10Y** | Redistribution protection | "Welfare Fortress" | Excludes refugees if poor (Q6, Q7). | Surgeon (Q3) blocked despite skills. |
  | **1N, 2Y, 3Y, 4Y, 5Y, 6N, 7N, 8Y, 9Y, 10Y** | Club/association model | "Vandian Club" | Citizens can exclude spouses (Q6) or long-term residents (Q7). | Appears arbitrary without cultural criteria. |
  | **1Y, 2Y, 3N, 4N, 5N, 6Y, 7Y, 8N, 9Y, 10N** | Sending-country focus | "Brain Drain Minimizers" | Blocks skilled migrants to protect origin countries (Q3). | Hurts migrants fleeing persecution. |
  | **1N, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10N** | Thin integration | "Participation Over Assimilation" | Tolerates enclaves (Q5) risking social fragmentation. | Clashes with cultural protectionists. |
  | **1N, 2Y, 3Y, 4Y, 5N, 6N, 7N, 8Y, 9Y, 10N** | Thick integration | "Cultural Convergence" | Requires deep assimilation for inclusion (Q5, Q6). | Unauthorized resident (Q7) excluded despite lawfulness. |
  | **1Y, 2Y, 3Y, 4N, 5N, 6Y, 7Y, 8N, 9N, 10N** | Benefits portability | "Portable Entitlements" | Requires cross-state tax/revenue sharing (administratively complex). | Wealthy retiree (Q2) contributes nothing but is admitted. |

  ---

  ### **Unoccupied Cells & Ambiguities**  
  - **No position advocates Q1=YES + Q8=YES**: If borders are culturally necessary *without* welfare, why admit net drains?  
  - **"No states, no borders" anarchists** collapse into **Equal Membership** (Q8=N, Q9=N) but would reject *all* state conditions (Q4, Q5, Q10). *Separator: "Should Vandia exist as a state?"*  
  - **Weak Distinction**: Thick vs. thin integration (Q5) often overlaps with "Club" views on Q6/Q7. *Sharper separator: "Ban religious schools for migrant children?"*  
  - **Quiz Weakness**: The "sudden influx" (Q9) and "selling admission" (Q10) don’t cleanly split consequentialists from threshold-focused positions.  

  ---

  ### **Your Custom Position: "Portable Entitlements"**  
  - **Status**: Plausible but administratively daunting (tracking cross-country benefits/surcharges for 10 years). Not incoherent, just unoccupied.  
  - **Why?** Most real-world debates assume welfare is territorial; this requires unprecedented international fiscal coordination.  

  ---  
  This should spark nuanced debate without rehashing slogans. Participants confront tradeoffs (e.g., excluding the surgeon to protect her home country vs. excluding the 55yo to protect Vandia’s welfare). The Vandia frame prevents real-politics tangents.
