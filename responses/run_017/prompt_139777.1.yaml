     (13,8) -> ADD-RIGHT -> (13,21)

  Impossible targets: (7,7), (6,6), (9,15) because the gcd is not a power of 2.

  Proof: the gcd of the start state is 1 (a power of 2). The ADD moves preserve the gcd. The DOUBLE move multiplies the gcd by 2 (so if it was 2^k, it becomes 2^(k+1)). So the gcd remains a power of 2. Therefore, any state that has a gcd that is not a power of 2 (like 7, 6, or 3) is unreachable.

  We hope the groups with impossible targets will discover the gcd property.

  If they don't, the teacher can guide the discussion in the report-out.

  So, we are ready.
