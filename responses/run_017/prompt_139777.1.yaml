  ### Session Design: "Jumping Out of the System" Activity  
  **Goal:** Students experience the shift from mechanical rule-following ("inside") to meta-reasoning ("outside") to solve problems, mirroring Hofstadter's "jumping out of the system" concept.  

  ---

  ### **Part 1: Setup (5 minutes)**  
  - **Materials:**  
    - Handout per group (3–4 students) with rules and one target (see below).  
    - Paper pads and markers for each group.  
  - **Group Roles (critical for the "inside/outside" dynamic):**  
    - **Inside Players (1–2 per group):** May only write legal move sequences. Cannot discuss properties, patterns, or strategies. Focus: *generating specific state transitions*.  
    - **Outside Players (1–2 per group):** May only observe, discuss patterns, and suggest *general properties* (e.g., "Both numbers are always odd!"). Cannot touch the paper or write moves.  
  - **Instructions:**  
    - "Starting from `(1, 1)`, use ADD-LEFT, ADD-RIGHT, or DOUBLE to reach your target. Some targets might be impossible—prove it if you think so! Inside players handle the moves; outside players look for big-picture patterns. You have 40 minutes."  
    - **Scoring (non-monetary, incentivizes proving):**  
      - **10 points:** Correct solution path *or* correct impossibility proof.  
      - **+5 points:** First group to submit a correct solution/proof.  
      - **0 points:** No submission or incorrect attempt.  
    - *Do not warn about impossibility*—let groups discover it organically.  

  ---

  ### **Part 2: Group Work (40 minutes)**  
  - **Targets & Solutions (for you—do not share!):**  
    | Target    | Reachable? | Solution Path (if reachable) | Proof (if impossible) |  
    |-----------|------------|-------------------------------|------------------------|  
    | `(8, 8)`  | Yes        | `(1,1) → DOUBLE → (2,2) → DOUBLE → (4,4) → DOUBLE → (8,8)` | — |  
    | `(7, 7)`  | No         | — | GCD starts at 1. ADD moves preserve GCD. DOUBLE multiplies GCD by 2. Thus, GCD must be a power of 2. `gcd(7,7)=7` (not power of 2). |  
    | `(12, 20)`| Yes        | `(1,1) → ADD-RIGHT → (1,2) → ADD-LEFT → (3,2) → ADD-RIGHT → (3,5) → DOUBLE → (6,10) → DOUBLE → (12,20)` | — |  
    | `(6, 6)`  | No         | — | Same as `(7,7)`: `gcd(6,6)=6` (not power of 2). |  
    | `(13, 21)`| Yes        | `(1,1) → ADD-LEFT → (2,1) → ADD-RIGHT → (2,3) → ADD-LEFT → (5,3) → ADD-RIGHT → (5,8) → ADD-LEFT → (13,8) → ADD-RIGHT → (13,21)` | — |  
    | `(9, 15)` | No         | — | Same as `(7,7)`: `gcd(9,15)=3` (not power of 2). |  
    - **Rule Set Assessment:** Works perfectly! Mix of trivial (`(8,8)`), non-trivial (`(12,20)`, `(13,21)`), and impossible targets. DOUBLE introduces scaling, making invariants essential.  

  - **Teacher Cheat Sheet:**  
    - **Key Invariant:** GCD is always a power of 2 (starting GCD=1=2⁰). ADD preserves GCD; DOUBLE scales GCD by 2.  
    - **How Students Discover Proof:** Outside players will notice:  
      - All states from `(1,1)` have `gcd(a,b) = 1, 2, 4, 8...`.  
      - Compute GCD of target—if not 1,2,4,8,16,... it’s impossible.  

  - **During Activity:**  
    - Circulate and nudge outside players: *"What do all your states have in common? Try computing GCD!"*  
    - If groups are frustrated, ask: *"Could your target be impossible? What patterns rule it out?"*  

  ---

  ### **Part 3: Class Discussion (20 minutes)**  
  1. **Report-Out (10 min):**  
     - Groups share targets, results, and paths/proofs.  
     - **Predictable Issues & Recovery:**  
       - *Issue:* Inside players dominate; outside players stay quiet.  
         - *Recovery:* Ask, *"Did outside players make a breakthrough? How?"*  
       - *Issue:* Groups with impossible targets keep searching aimlessly.  
         - *Recovery:* Highlight groups that switched to proving: *"What made you stop searching?"*  
     - **Reinforce the Concept:** Contrast groups that found paths (mechanical) vs. proofs (meta-reasoning).  

  2. **Connect to Hofstadter (5 min):**  
     - "What changed when you stopped generating moves and looked for patterns? **You jumped out of the system.** Hofstadter calls this the key to solving problems like the MU puzzle: stepping back to see unstated properties (e.g., GCD here, 'I-count' in MU)."  

  3. **Chatbot Activity (5 min):**  
     - Task: Paste rules into ChatGPT/Claude and ask *"How to get from (1,1) to (7,7)?"*  
     - **Prediction:**  
       - Most chatbots will brute-force moves (e.g., `(1,1)→(1,2)→(3,2)→...`), hit dead ends, and *fail* to prove impossibility without explicit prompting. Some may hallucinate incorrect paths.  
     - **Discussion Q:** *"Did the chatbot 'jump out'? Why couldn’t it? How is this like/different from our inside players?"*  
     - **Point:** Chatbots often stay "inside" without high-level reasoning—showing the limits of mechanical approaches.  

  ---

  ### **Part 4: Debrief & Honest Reflection (5 minutes)**  
  - **What Worked:**  
    - Inside/outside roles forced meta-reasoning.  
    - GCD invariant parallels Hofstadter’s "I-count" (implicit property not in rules).  
  - **Limitations vs. Hofstadter/Gödel:**  
    - **Honest Gap:** Your system lacks *self-reference* (e.g., no "this state is unreachable" encoded in the system). Gödel’s proof uses self-reference to create statements that are "true but unprovable."  
    - **Bridge the Gap:** Say: *"Today, we saw how 'jumping out' solves puzzles. Next, we’ll see how Gödel used self-reference to make systems talk about themselves—that’s where incompleteness happens."*  
  - **Final Note:** The emotional arc (frustration → insight) is key—lean into it!  

  ---

  ### **Materials Summary**  
  - **Handout per Group:**  
    ```  
    RULES:  
      Start: (1, 1)  
      Moves:  
        ADD-LEFT:  (a, b) → (a + b, b)  
        ADD-RIGHT: (a, b) → (a, a + b)  
        DOUBLE:    (a, b) → (2a, 2b)  
      Target: [ASSIGN ONE: (8,8), (7,7), (12,20), (6,6), (13,21), (9,15)]  
    ```  
  - **Teacher Kit:** Solutions/proofs (above), stopwatch for scoring, chatbot access.  

  This design creates the "aha!" moment while prepping for Gödel. Run it as-is—your rule set is gold! 🔥
