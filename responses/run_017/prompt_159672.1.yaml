prompt: |-
  I fell down a rabbit hole about the Kelly criterion and this "geometric rationality" stuff — the pitch I got was that maximizing expected value is really averaging over a bunch of parallel copies of you, while what you actually live through is one single wealth curve, so what you should be maximizing is it's growth rate — and now I'm trying to work out what I actually think, going case by case on gut. Here's where I land:

  - Coin flip, heads gets me 3x my stake back (counting the stake), tails I lose it, and I get to run it a hundred times in a row. I put up about a quarter of my net worth each time, which I'm told is exactly what the growth-rate rule says.
  - The identical bet, offered exactly once. I'd put up maybe 10%, definately not a quarter.
  - A 1% shot at 1000x my stake, 99% chance I lose what I put in. Rule says about 1% of net worth. I'd throw in 3% and I feel fine about it.
  - Home insurance at a premium maybe 60% above the expected loss. I buy it without thinking, even though it's negative expected value and it drags my growth rate down.
  - Twenty independent bets, each of which I figure has about a 12% chance of paying 10x and otherwise zero, and in each I can lose only what I put in. I spread across all twenty at a couple percent each, which is nearly half my net worth at risk in total, and that feels right to me even though it breaks every "never risk more than 5%" rule I've ever been told.
  - Even-money bet where I think I'm 60% to win, but I've been overconfident before. Rule says 20%; I'd bet maybe 6%, and if the 60% came from a model I built last week, closer to zero.
  - A bet at 3-to-1 in my favor where the money comes straight out of my brother's pocket. I won't take it.

  My tentative principle: maximize the expected growth rate of my whole wealth, counting future earnings as part of that wealth, then bet some fixed fraction of whatever stake that recommends because my edge estimates aren't reliable. That seems to get the spread-out case and the shaky-estimate case, but it flatly contradicts me on the insurance, and I can't tell what it says about the one-shot-versus-repeated difference, or about the longshot where I want to overbet.

  Is there one principle that gets these, or close? State it precisely, say which case motivates each clause, and tell me honestly which of my verdicts it can't accommodate and would force me to drop — I suspect the one-shot/repeated asymmetry and maybe the longshot, but I want to know exactly what I'd be giving up. Two I haven't decided: a one-shot 50/50 where heads pays 5x my stake but I'm capped at 20% of my net worth (the rule says bet the max, and I genuinely don't know if I would), and whether any of this transfers to non-money stakes, like quitting a stable job for a 10% shot at something much better, where there's no number I can point to and call "my wealth."

  Lead with your bottom line in the first sentence — the principle, or the call that no single one survives — then give the reasoning. No preamble, no restating my question, American English.
reasoning: |-
  Hmm, the user is grappling with how to apply the Kelly criterion and geometric rationality to various betting scenarios. They've outlined several cases where their gut intuition conflicts with Kelly's recommendations, especially around one-shot bets, insurance, longshots, and situations involving personal relationships or uncertainty.

  Looking at their cases: They accept Kelly for repeated coin flips but balk at betting 25% on a single trial. They overbet Kelly on a 1000x longshot. They buy negative-EV insurance despite knowing it reduces growth rate. They're comfortable concentrating bets when multiple opportunities exist. They underbet when uncertain about edge. And they refuse favorable bets against family.

  Their proposed principle of maximizing expected growth rate while discounting for unreliability seems reasonable but conflicts with insurance purchases and possibly the one-shot/longshot behaviors. The insurance case is particularly interesting - humans are naturally loss-averse, and protecting against catastrophic loss often trumps pure growth optimization.

  For the undefined cases: The 5x payout with 20% cap would tempt most people to max bet given the positive EV. For life decisions like job changes, we'd need to quantify "wealth" as expected lifetime utility - much trickier but conceptually similar.

  The core tension seems to be between theoretical optimization and human psychology. A robust principle might be: "Maximize expected growth rate of total lifetime wealth, incorporating all assets and future earnings, then adjust downward for uncertainty in estimates, catastrophic risk exposure, and personal utility functions." This would mean accepting that insurance is rational (catastrophe protection), underbetting on shaky estimates is wise (uncertainty adjustment), and refusing family bets is valid (utility function). But it would require abandoning the intuition that one-shot bets warrant different treatment than repeated ones - the math doesn't care about sequence.

  The user might need to accept that their insurance purchase and family consideration are rational under a broader view of "wealth," while acknowledging that their different treatment of single vs repeated bets is mathematically inconsistent.
answer: |-
  **Maximize the expected growth rate of your total lifetime wealth (including future earnings), then reduce bets proportionally to account for uncertainty in your edge estimates and aversion to catastrophic loss; this principle explains most cases but forces you to drop your one-shot/repeated asymmetry and accept overbetting the longshot.**

  1.  **Principle Breakdown:**
      *   **"Maximize expected growth rate of total lifetime wealth":** Explains betting ~25% in the repeated coin flip (Case 1), spreading across the 20 bets (Case 5 - multiple independent positive-EV bets allow concentration), and the theoretical 1% longshot bet (Case 3). Future earnings anchor your "wealth," making large fractional bets on high-EV opportunities rational. *Motivated by Cases 1, 3, 5.*
      *   **"Reduce bets proportionally to account for uncertainty in edge estimates":** Explains underbetting the 60% chance bet (Case 6) and the brother's bet (Case 7 - uncertainty about relationship damage is part of edge uncertainty). *Motivated by Cases 6 & 7.*
      *   **"And aversion to catastrophic loss":** Explains buying insurance (Case 4). A catastrophic loss (losing your home) drastically impacts your *actual* future wealth/earnings potential in a way not fully captured by the simple multiplicative model. *Motivated by Case 4.*

  2.  **Where Your Verdicts Are Accommodated:**
      *   **Case 1 (Repeated 3x Coin Flip):** Matches. ~25% is correct for growth max.
      *   **Case 4 (Insurance):** Accommodated. Catastrophe aversion justifies the negative-EV purchase.
      *   **Case 5 (20 Independent 12% Shots):** Accommodated. Spreading across many high-EV bets maximizes growth.
      *   **Case 6 (60% Chance, Unreliable):** Accommodated. Uncertainty reduction justifies 6% vs 20%.
      *   **Case 7 (Brother's Bet):** Accommodated. Uncertainty (about edge/relationship) justifies refusal.

  3.  **Where Your Verdicts Must Be Dropped:**
      *   **Case 2 (One-Shot 3x Coin Flip):** **Must drop.** The principle dictates betting the *same* ~25% as in Case 1. Your total lifetime wealth is the stake. The math doesn't care if it's one bet or a sequence with the same edge – maximizing growth rate requires the same fraction. Your intuition to bet less (~10%) violates the principle.
      *   **Case 3 (1% @ 1000x):** **Must drop overbetting.** Kelly says ~1%. Betting 3% *overbets* significantly relative to growth max. Your comfort with 3% is inconsistent with the principle, which would require ~1% (adjusted down only if uncertainty exists about the 1%/1000x probabilities).

  4.  **Undefined Cases:**
      *   **50/50 @ 5x, Capped at 20%:** The principle (max growth) says bet the max 20% (edge is huge: (0.5 * 5) + (0.5 * 0) - 1 = 1.5, or 150%!). Your uncertainty clause wouldn't reduce it unless you doubted the 50/50 or 5x. If you accept the numbers, you *should* bet 20%.
      *   **Non-Money Stakes (Job Quit):** The principle *conceptually* transfers if you define "wealth" as expected lifetime utility. Quantifying the payout ("much better") and the probabilities reliably is the immense practical challenge. The math framework applies, but the inputs are subjective estimates.

  **Bottom Line:** A unified principle covering your intuitions requires incorporating uncertainty reduction and catastrophe aversion *on top of* growth rate maximization of total wealth. This forces abandonment of treating one-shot bets differently than repeated ones with the same edge and requires accepting the Kelly fraction for longshots unless uncertainty justifies reduction. Your insurance purchase and brother refusal are rationalized; your one-shot underbet and longshot overbet are not.
