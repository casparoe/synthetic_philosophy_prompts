answer: |-
  ## The Immaterialist Necessity: Berkeley's Unavoidable Nominalism

  Your friend’s metallist counter-argument relies on a distinction Berkeleyan immaterialism dissolves. Immaterialism doesn't just deny *intrinsic value*; it denies the very *mind-independent substance* upon which the metallist's "robust natural scarcity" argument depends. This collapse of the material substrate forces a purely nominalist conception of money, where value and scarcity are fundamentally constituted within the divine order of ideas, rendering the metallist's "natural" anchor incoherent. Crucially, this framework provides *superior*, not weaker, constraints against arbitrary issuance.

  **The Metallist Premise Undermined: Substance Without Substance**
  The core metallist claim is that gold (or similar) possesses a value grounded in its *physical properties* and *naturally fixed scarcity*, persisting independently of convention. This requires two things: (1) the existence of mind-independent matter possessing those properties, and (2) that the scarcity of this matter is a brute, non-contingent fact distinct from human or divine agency concerning tokens. Immaterialism obliterates (1). Berkeley famously argues that *esse est percipi aut percipere* – to be is to be perceived or to perceive. Matter, as an inert substance underlying perceived qualities, is a meaningless abstraction. What we call "gold" is simply a stable, divinely-ordained complex of ideas (yellowness, heaviness, malleability, etc.). Its "physical properties" are just regularities in the perceived order. Consequently, premise (2) collapses. Gold's "scarcity" isn't a fact about a mind-independent *stuff*; it is an observed regularity *within the divine ordering of ideas*. It is a *feature of the experienced world*, dependent on God’s consistent will, not an inherent property of a self-subsisting material entity.

  **The Collapse of "Natural" vs. "Conventional" Scarcity (Steelman Rebutted)**
  Your friend is correct to highlight a *phenomenal* difference: gold deposits seem discovered, while token supply caps seem invented. The metallist insists this difference in *robustness* (gold's scarcity feels "given," a token's feels "chosen") preserves a mind-independent anchor. However, for the immaterialist, this is a distinction *only* within the realm of ideas, concerning the *mode of divine action*, not a difference in ontological grounding. Both are equally dependent on God’s governance:

  1.  **Gold's Scarcity:** The regularity that certain ideas (gold-like sensations) appear only in specific locations, requiring effort (mining ideas) to bring them into exchangeable proximity, is a *law* instituted by God within the phenomenal order. Its perceived "fixity" is a function of the *stability* and *predictability* of God's operations, making it *feel* external and immutable. But it remains a divinely maintained regularity, not an independent fact.
  2.  **Token Scarcity:** The rule limiting the issuance of paper notes or digital tokens is also a rule within the divine order of ideas. It arises from human institutions (themselves complexes of ideas governed by divine law) and is enforced through legal, social, or technological mechanisms – all operating within, and dependent upon, God's consistent ordering. Its "artificiality" reflects its originating in *human volition* operating under divine law, rather than directly in the sensory regularities God presents *as* nature.

  **The crucial immaterialist point is this:** Both types of scarcity are *conventional* in the profound sense that *all* order, including what we call "natural," is constituted by God’s will manifesting as regular ideas. The difference is one of *provenance within the divine scheme* (direct sensory regularity vs. institutional rule reflecting divine laws of human association), *not* a difference between mind-independent nature and human convention. The metallist’s "robust natural scarcity" is, for Berkeley, simply the most deeply ingrained *convention of perception* established by God. It offers no *ontologically privileged*, mind-independent anchor.

  **Digital Tokens: The Superior Berkeleyan Counter?**
  This immaterialist perspective illuminates the digital token case surprisingly. Your friend dismisses a cryptocurrency's hard cap as "only a fact about what people have agreed to enforce." But under immaterialism, this is precisely its strength *as a counter*, arguably making it a *better* instantiation of Berkeley’s concept than gold:

  1.  **Transparency of Convention:** A token's scarcity rule (e.g., the Bitcoin cap) is explicitly defined within the institutional/technological complex (the code, the network rules). Its conventional nature is *manifest*, unlike gold's scarcity, which *masks* its conventional (divinely ordained) nature under the illusion of material independence. Berkeleyan nominalism values clarity in understanding the true nature of money as a counter. The digital token embodies this clarity.
  2.  **Direct Link to the "Order of Ideas":** The token's value and scarcity function entirely within the realm of ideas – cryptographic rules, network consensus, digital records, human expectations. There is no distracting appeal to an illusory material substrate. Its existence and properties are *purely* ideational, perfectly aligning with the immaterialist ontology where *all* value and relation exist within perception and divine ordering.
  3.  **Divine Governance Still Applies:** The token's efficacy as money *still* depends on the divine order: the reliability of human cognition, the stability of the laws governing communication and computation (ideas of mathematics, logic), and the divine laws underpinning social trust and expectation. Its scarcity rule, while human-devised, functions only because God sustains the orderly relations of ideas that make the rule enforceable and credible.

  Gold, in contrast, tempts the metallist fallacy. Its apparent "natural" scarcity obscures its true status as a divine convention of sensation. The digital token, by making its conventionality explicit and operating purely within the immaterial realm of ideas, paradoxically becomes a *more authentic* Berkeleyan counter – a clear "ticket" whose value derives solely from its role within a divinely sustained system of relations and expectations, unmuddied by the illusion of matter.

  **Constraining Issuance: Divine Order Replaces Metal Anchor**
  The debasement objection ("Why not just mint more tickets?") misunderstands Berkeleyan constraints. Rejecting a metallist anchor doesn't mean embracing anarchy. Berkeley replaces the *external physical anchor* with constraints rooted in the *divine order governing minds and their relations*:

  1.  **The Psychology of Credit (Demand & Plenty):** Money functions as a pledge of future industry. Its efficacy depends entirely on *confidence* – the belief that the ticket can reliably command goods/services later. Indiscriminate issuance shatters this confidence. As Berkeley understood (Queries 441, 442), excessive paper without corresponding industry creates inflation, eroding the ticket's purchasing power and destroying its function as a "pledge." The constraint is *psychological* and *functional*: if the ticket fails to sustain the expectation of value (due to oversupply relative to demand for goods/industry), it ceases to be useful money. This expectation is not arbitrary; it arises from divinely governed laws of human association, desire, and perception of cause and effect.
  2.  **Divine Law and Public Utility:** Berkeley’s bank proposal wasn't anarchic. Its issuance was tied to specific, productive purposes (e.g., funding public works, employing the poor – Query 5, 6). The constraint comes from the *purpose* of money within the divine order: to facilitate industry, trade, and public well-being (Queries 1, 2, 23). Indiscriminate issuance violates the divine imperative for humans to act rationally and promote the common good within the providential order. It disrupts the divinely instituted relations of trust and exchange necessary for society. The "anchor" is the teleological structure of the divine order itself, demanding responsible stewardship.
  3.  **The Stability of Divine Regularity:** While God *could* alter the regularities governing scarcity (of gold *or* token rules), Berkeley consistently argues God acts with perfect regularity and benevolence. The predictability of the divine order *is* the ultimate foundation for any stable convention, including monetary rules. Trust in a token's scarcity cap is possible *because* God reliably sustains the laws of nature and human interaction that make the cap enforceable and credible. The constraint is the inherent stability of God's governance, applied *through* the human institution and its rules.

  **Conclusion: Immaterialism's Inescapable Nominalism**
  Immaterialism doesn't merely make nominalism *compatible*; it renders metallism *incoherent*. By denying mind-independent matter, Berkeley eliminates the ontological foundation for intrinsic value or "natural" scarcity grounded in physical substance. Gold's value and scarcity are revealed as divinely ordained regularities *within* the order of ideas, functionally equivalent to – though phenomenally distinct from – the explicitly instituted rules governing tokens. The contrast between "natural" and "conventional" scarcity dissolves into a distinction between *types* of divine regularities governing perception versus human institutions. Digital tokens, far from being inferior, expose the conventional core of money more honestly than gold, aligning perfectly with the immaterialist ontology. Constraints on issuance arise not from inert metal, but from the psychological laws of credit, the divine imperative for public utility, and the inherent stability of God's benevolent governance over the order of ideas. Therefore, adherence to Berkeley's immaterialism *logically necessitates* a nominalist theory of money. The metallist's fallback – a value anchored in mind-independent natural kinds – is not merely weakened; it is conceptually impossible within the Berkeleyan framework. Your position stands: immaterialism commits one irrevocably to nominalism.
