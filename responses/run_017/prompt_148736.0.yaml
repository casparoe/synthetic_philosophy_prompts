prompt: |-
  I run the claims desk at a medical news service. Several times a week a heritability figure arrives inside something else — a journal press release, a conference abstract, a direct-to-consumer genetics company's launch material, a clinic leaflet, or a reporter's question about whether a sentence is safe to print. What I need is not a primer on what heritability means but a decision procedure my reviewers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than facts.

  Reviewer constraints: about fifteen minutes per claim; one applied statistics course; no quantitative geneticist on call; output is a written ruling in one of four forms — stop, pass with a mandatory translation clause, pass, or escalate to me — plus, wherever the ruling is stop or pass-with-clause, one sentence saying what the number does not license. Rulings are signed off by me, and anything touching clinical advice by our clinical lead as well.

  My working taxonomy is that a heritability estimate tends to be conscripted to do four different jobs: apportioning variance in a specified population; describing how a trait is produced in an individual; predicting how much a named intervention will move things; and explaining a difference between groups or between cohorts. My belief is that only the first is a job the estimate can actually perform, and I would like the procedure built around first identifying which job the claim is asking the number to do. Correct me if the taxonomy is wrong or if it misses a job the number is routinely asked to do.

  Below are the checks I have in mind; you decide the order, which ones collapse into each other, and which are not worth a non-specialist's time.

  - Population specification: is the estimate tied to a named population, period, and range of environments? If not, stop.
  - A portability ledger for estimates imported from one population to another, on three axes: genetic architecture and ancestry, the magnitude of environmental variance, and how the trait was defined and measured. My candidate rule is that a "genes versus environment" ranking is portable only if the environmental variance in the target population is at least as large as in the source. Tell me whether that is right as stated.
  - A uniform-cause check: a factor that is causally necessary but nearly uniform in the sampled population contributes almost no variance, so a high heritability is compatible with that factor being indispensable and with an intervention on it moving the mean a great deal. I take this to be correct; say so if I have it wrong.
  - An intervention-leverage question: which variance component does the proposed intervention act on, and does the estimate speak to a change in the mean at all, as opposed to a share of the variance?
  - The individual-level misreading: no "x percent of your trait is genetic" reading passes.
  - The step from heritability within groups to any conclusion about differences between group means. Where this stops the claim, I want a toy numerical illustration a reviewer can paste into a ruling without having to reconstruct the reasoning.
  - Disagreement between designs: twin estimates versus SNP-based estimates, the equal-environments assumption, gene-environment correlation, dichotomous traits on a liability scale, and traits defined partly by institutional facts — years of schooling, income, diagnostic categories — where heritability can shift because the institution shifted rather than the biology.

  Hard cases the procedure must handle explicitly: an estimate reported as having risen across cohorts; a claim whose number is sound but whose implication is a values question; a claim where the underlying design is not stated in the material we have.

  Then apply the procedure to three cases and show the rulings and clauses: (1) a press release reporting that the heritability of educational attainment has risen from earlier cohorts to roughly forty percent, and that differences in exam results therefore mostly come from differences in children's genes, so extra school funding is unlikely to close the gap; (2) a clinic leaflet stating that BMI is around seventy percent heritable, from which a parent concludes that a dietitian referral is pointless; (3) an internal policy memo arguing that, because BMI is highly heritable, population-level food-environment measures will have limited effect and resources should go to identifying high-risk genotypes instead.

  I expect at least one of these to come back partly as a pass or a pass-with-clause on a claim my desk would rather kill — I suspect part of the school-funding case survives. If so, say which part, and why we have to live with it. Please also give me three stock translation clauses covering the three most common misreadings, in language that can sit next to a number in print.

  Two further things. Mark, step by step, which parts are settled and which rest on contested methodological ground; where the ground is genuinely contested, give me the step's default and say plainly that it is a default rather than dressing it up as rigour. And if the task as I have posed it cannot be done in fifteen minutes by someone with my reviewers' training, or if some piece of my framing above rests on a mistake, tell me that directly instead of complying politely — I would rather have a shorter procedure that works than a complete one that does not.
reasoning: |-
  Hmm, the user runs a claims desk for a medical news service and needs a practical decision procedure for evaluating heritability claims. They want a step-by-step checklist that non-specialist reviewers can complete in about 15 minutes to assess claims involving heritability figures. 

  The user has outlined several key concerns: identifying how the heritability estimate is being misused (their taxonomy of four "jobs"), and specific pitfalls like population portability, uniform-cause fallacy, intervention misunderstandings, individual-level misinterpretations, and between-group fallacies. They also want explicit handling of hard cases like rising heritability estimates, unstated methodologies, and value-laden implications.

  I need to build a streamlined procedure that fits within the reviewer constraints: 15 minutes max, basic stats background, no genetics expert on call. The output needs to be one of four rulings (stop, pass with mandatory translation clause, pass, or escalate), plus a one-sentence limitation statement when rejecting or qualifying a claim.

  The user's taxonomy seems robust - heritability estimates really are frequently misused in those four ways. I'll structure the procedure around identifying which "job" the claim assigns to the number, as that determines which checks apply. 

  For the decision tree, I'll prioritize efficiency:
  1. First screen for population specification - if missing, immediate stop
  2. Then identify the claimed "job" through keyword matching
  3. Route to specific checks based on job:
     - For variance apportioning: quick plausibility check
     - For individual causation: automatic stop
     - For intervention prediction: environmental variance comparison + intervention leverage check
     - For group difference explanation: automatic stop with toy example
  4. Special handling for rising estimates and unstated designs

  The portability rule needs refinement - the user's proposal (environmental variance must be ≥ source) is directionally correct but oversimplified. I'll suggest a more robust version comparing environmental variance *ranges*. 

  For the three test cases:
  - The school funding claim mostly fails but has one salvageable element (the rising heritability itself)
  - The dietitian referral is a clear stop
  - The policy memo requires escalation due to values questions

  I'll include three stock translation clauses covering the most common misreadings, phrased as standalone disclaimers. And I'll clearly flag where steps rest on methodological defaults rather than settled science - particularly the portability rule and rising heritability interpretation.

  The procedure should be executable in 15 minutes if reviewers are trained on the decision tree. The hardest part will be recognizing the "job" from context, so I'll provide clear examples and phrasing cues.
answer: |-
  Here is a practical decision procedure for your reviewers, designed for 15-minute assessments by non-specialists. It prioritizes identifying **how the heritability estimate is being used** (per your taxonomy) and flags common misinterpretations. Steps 1-4 are sequential; subsequent steps depend on the "job" identified.

  ---

  ### **Decision Procedure: Heritability Claims**
  **Output Options:**  
  - 🛑 **STOP** (fatal flaw)  
  - ⚠️ **PASS WITH TRANSLATION CLAUSE** (number valid but misinterpreted)  
  - ✅ **PASS** (valid use; rare)  
  - 🔼 **ESCALATE** (values conflict or complex methodology)

  **Required Input:** Claim text + heritability figure (+ source material if available).

  ---

  #### **Step 1: Population & Environment Check**  
  *"Is the estimate tied to a specific population, time, and environment?"*  
  - **SUFFICIENT ANSWER:** Named population (e.g., "UK Biobank participants aged 40-60 in 2010-2015").  
  - **INSUFFICIENT:** "In humans," "in a recent study," or no mention.  
  - **RULING:** If insufficient → 🛑 **STOP**.  
  - **REASON:** "Heritability estimates are population-specific and cannot be generalized without evidence."  
  - **STATUS:** Settled science.

  #### **Step 2: Identify the "Job"**  
  *Match the claim to one of four jobs:*  
  1. **Variance Apportionment:** "X% of trait variation in [population] is due to genetics."  
  2. **Individual Causation:** "X% of *your* trait is genetic."  
  3. **Intervention Prediction:** "Policy X won’t work because heritability is high."  
  4. **Group Difference Explanation:** "Group A scores higher than Group B due to genetics."  
  - **RULING:**  
    - Job 2 → 🛑 **STOP** (Individual causation impossible).  
    - Job 4 → 🛑 **STOP** (Provide toy example below).  
    - Jobs 1 or 3 → Proceed to Step 3.  

  #### **Step 3: Portability Check (If estimate imported to new population)**  
  *Applicable only if the claim applies the estimate to a different population than the source study.*  
  - **AXES TO COMPARE:**  
    - Genetic ancestry/architecture (e.g., Finnish vs. Nigerian).  
    - Trait measurement (e.g., self-reported vs. clinical BMI).  
    - Environmental variance magnitude (use qualitative judgment: "Are environments more uniform in the target population?").  
  - **PORTABILITY RULE (DEFAULT):**  
    Ranking (e.g., "genetics > environment") is portable only if environmental variance in the target population is **similar or larger** than in the source.  
  - **RULING:** If portability unsupported → 🛑 **STOP** or 🔼 ESCALATE (if minor).  
  - **STATUS:** Contested. *Default rule is pragmatic but not universally accepted.*  

  #### **Step 4: Intervention Leverage (For Job 3 claims)**  
  *"Does the intervention target environmental variance?"*  
  - **KEY INSIGHT:** High heritability = environmental variance is *currently small*. If the intervention *increases* environmental variance (e.g., new therapy), it could have large effects.  
  - **EXAMPLE:** A school program (environmental intervention) in a high-heritability setting might work *precisely because* current environmental variation is low.  
  - **RULING:** If the claim assumes high heritability = low intervention potential → ⚠️ **PASS WITH CLAUSE** (unless uniform-cause applies).  

  #### **Step 5: Uniform-Cause Check**  
  *"Is the trait dependent on a near-universal factor?"*  
  - **EXAMPLE:** Oxygen is necessary for IQ, but its near-uniformity means it contributes ~0% to variance.  
  - **IMPLICATION:** High heritability does *not* mean environmental changes (e.g., reducing lead exposure) can’t shift the mean.  
  - **RULING:** If overlooked in Job 3 claims → ⚠️ **PASS WITH CLAUSE**.  
  - **STATUS:** Settled.  

  #### **Step 6: Rising Heritability Estimates**  
  *"Does the claim interpret an increase in heritability across cohorts?"*  
  - **CORRECT INTERPRETATION:** Rising h² suggests *reduced* environmental variation in newer cohorts (e.g., more uniform schooling).  
  - **MISINTERPRETATION:** "Genes matter more now." → False.  
  - **RULING:** If misinterpreted → ⚠️ **PASS WITH CLAUSE**.  
  - **STATUS:** Settled.  

  #### **Step 7: Methodology Check (If design stated)**  
  *Quick red flags:*  
  - **SNP-h² vs. Twin h²:** SNP-h² (e.g., 20%) < Twin h² (e.g., 60%) suggests missing genetic variants.  
  - **Trait Type:** Binary traits (e.g., depression diagnosis) require liability-threshold modeling.  
  - **Institutional Traits:** Heritability of "years of schooling" can rise if policies make education more accessible (reducing environmental variance).  
  - **RULING:** Major flaw (e.g., binary trait not on liability scale) → 🛑 **STOP**. Minor issue → 🔼 **ESCALATE**.  

  #### **Step 8: Unstated Design/Values Conflict**  
  - **Design Not Stated:** 🔼 **ESCALATE** (reviewer can’t assess).  
  - **Sound Number, Harmful Implication:** 🔼 **ESCALATE** (e.g., "No need for dietitian" → clinical/policy judgment).  

  ---

  ### **Toy Example for Group Differences (Step 2)**  
  *Paste this into rulings:*  
  > "Heritability *within* Group A and Group B does not explain differences *between* them. Example: Suppose height is 80% heritable in both Iceland and Japan. If Icelanders average 6" taller, this could be entirely due to better childhood nutrition in Iceland (environment), even though within each country, height variation is mostly genetic."  

  ---

  ### **Stock Translation Clauses**  
  Include *one* of these verbatim next to the number:  
  1. **Individual-Level Misreading:**  
     > "This figure estimates genetic contributions to trait variation *across a population*. It does not apply to individuals."  
  2. **Intervention Misuse:**  
     > "High heritability indicates environmental variation is currently small; it does not predict the effect of new environmental interventions."  
  3. **Group Difference Fallacy:**  
     > "Heritability within groups cannot explain average differences between groups, which may be environmental."  

  ---

  ### **Case Rulings**  
  **CASE 1 (School Funding):**  
  - **Claim:** "h² of education rose to 40%; exam gaps mostly genetic; extra funding futile."  
  - **Procedure:**  
    1. ✅ Population: Likely specified in study (assume sufficient).  
    2. 🛑 **STOP** for "exam gaps mostly genetic" (Job 4: group difference fallacy).  
    3. ⚠️ **PASS WITH CLAUSE** for "h² rose to 40%" (valid variance apportionment, but rising h² misinterpreted).  
    4. 🛑 **STOP** for "funding futile" (ignores intervention leverage).  
  - **Ruling:** 🛑 **STOP** overall (fatal group difference claim).  
  - **Salvageable Part:** The rise in h² *itself* could pass with clause: "A rise in heritability suggests reduced environmental variation in recent cohorts; it does not imply genes became more important."  

  **CASE 2 (Dietitian Referral):**  
  - **Claim:** "70% h² for BMI → dietitian pointless for my child."  
  - **Procedure:**  
    1. ✅ Population: Assume specified.  
    2. 🛑 **STOP** (Job 2: individual-level claim + Ignores uniform-cause).  
  - **Ruling:** 🛑 **STOP**.  
  - **One-Sentence Limitation:** "Heritability estimates population-level variation; it cannot determine the cause of an individual’s BMI or predict response to intervention."  

  **CASE 3 (Policy Memo):**  
  - **Claim:** "High BMI h² → food-environment measures ineffective; focus on genetics."  
  - **Procedure:**  
    1. ✅ Population: Assume specified.  
    2. Job 3 → Step 4: Intervention leverage ignored (high h² ≠ low intervention potential).  
    3. Values conflict: Prioritizing genetics over environment is policy judgment.  
  - **Ruling:** 🔼 **ESCALATE** (for clinical lead).  

  ---

  ### **Feasibility & Caveats**  
  - **Time:** This fits in 15 minutes with training. Reviewers need a flowchart (see below).  
  - **Contested Defaults:**  
    - Portability rule (Step 3) is a heuristic; cite it as "common caution" not fact.  
    - Rising h² interpretation (Step 6) is settled but often misunderstood.  
  - **Shortcomings:**  
    - Complex designs (e.g., G×E interaction) auto-escalate.  
    - "Liability scale" for disorders requires escalation (non-specialists can’t verify).  

  **Flowchart Summary:**  
  ```  
  Start → Step 1 (Population? No → STOP) → Step 2 (Job? 2/4 → STOP) →  
  Job 1: ✅ PASS (if no other issues)  
  Job 3: → Step 3 (Portability?) → Step 4 (Intervention?) → Step 5 (Uniform-cause?)  
           → Minor issue: ⚠️ PASS WITH CLAUSE | Major flaw: 🛑 STOP  
  Rising h²/Unstated design: 🔼 ESCALATE  
  ```  

  This balances rigor with practicality. For escalations, your team can add nuance; for stops, the one-sentence limitation provides audit-proof justification.
