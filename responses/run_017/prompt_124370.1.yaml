prompt: |-
  I chair the allocations committee of a health research charity that awards one fixed envelope of money four times a year. We are six lay trustees and a scientific officer; we meet for a single afternoon; the money must all go; our decision is final. We are also required to publish written reasons to every applicant, including the ones we turn down, within two weeks. And because we meet quarterly with rotating membership, we have to be able to say how this quarter's choice relates to last quarter's without either being bound by it or drifting away from it at random.

  Our difficulty is not missing information. It is that the things we compare do not share a measure. A cheap, well-evidenced intervention that gives many people a small benefit; an expensive service that gives a few severely ill people a large and irreversible one; an exploratory programme that will probably come to nothing and might change practice for everyone. Cost-per-outcome in one currency, or a weighted score that adds everything up, would settle these comparisons only by pretending the difficulty away, and my trustees will not accept that. So I want a procedure we can run — ordered questions, what counts as a sufficient answer to each, where it returns a determinate result, and where it stops and hands the decision to a person because the remaining question is one of values rather than facts.

  Specifications I care about, roughly in the order the procedure should handle them:

  First, a diagnostic step. When two bids look incomparable, I want the committee to be able to tell apart at least four situations: that we simply cannot measure something we know to be comparable; that our comparisons are vague or only roughly comparable, so that more or better evidence would sharpen them; that the options are, in the technical sense, on a par — comparable, better in one respect and worse in another, but neither better overall nor equally good; and that there is a genuine lexical ordering or radical incomparability. The point of the distinction is that each diagnosis licenses a different next step, and I want that stated explicitly: which diagnoses are responsive to evidence, which leave the choice rationally underdetermined so that something other than a reason — commitment, the will, a decision to make an aim one's own — is what settles it, and which are settled by the ordering itself.

  Second, a second diagnostic, because I think we conflate two things. Some of our hard choices are choices between genuinely permissible options, where the right account of what we are doing is that we commit. Others are conflicts in which we must act and there is a remainder whatever we do: the appropriate aftermath is regret, acknowledgment, perhaps apology or compensation to those who lose, even though we chose correctly. These call for different handling downstream, and I want a way for a committee — not an individual agent — to tell which it is in, and what it is supposed to do about it either way.

  Third, a rule for agglomeration. Most quarters we are tempted by a large number of small improvements in one value set against a concentrated severe loss under another. Adding the small improvements up already presupposes a common unit, so I want the procedure to say what we may do here, what we must refuse to do, and how to describe the refusal honestly to an applicant who has twenty small studies and wants them counted.

  Fourth, a rule about chance. Say when randomising is legitimate and when it is buck-passing, and distinguish a fair lottery among equally-placed claimants from tossing a coin between two programmes because we cannot decide. If the procedure ever permits the latter, I want to know what has to be true first.

  Fifth, a rule about recurrence: what precedent may and may not do across quarters, how a committee tells a genuine re-weighing of aims from mere noise or from a change in who happens to be in the room, and what has to be recorded when we depart from what we did last time.

  Throughout, mark the points at which judgment cannot be eliminated rather than smoothing them over, and say who signs off at each: the chair, the full committee, the scientific officer, or the board. Say what happens when the committee cannot agree. The whole thing has to be runnable inside one afternoon by people with no philosophical training, and it must not depend on monetising outcomes, on a health-economic common currency, on a weighted-sum spreadsheet, on a lexical ordering asserted without an account of why that ordering, or on calling for more evidence as a general answer.

  Then run it. Start with the three-way choice above. Then take a quarter in which last quarter's precedent favoured the many-small-benefits programme and a new applicant makes that same case better than it was made before — say what the procedure does with precedent there. Finally, apply it to the case I expect to dislike: an application that is stronger than its rival on every consideration this committee has ever cited, arriving alongside a weaker one that would serve an aim we have not yet committed to. If your procedure permits funding the second and saying so, tell me what the published reason to the first applicant can honestly be, given that it cannot cite any deficiency in their proposal. If it does not permit it, say why not and what the procedure is missing.

  Close by saying what the procedure cannot do. I have two worries in particular that I want addressed directly: that it cannot, from the armchair, certify which of the four diagnoses is the correct one in any actual case; and that a committee could use the language of incommensurability as cover for preference, fatigue, or noise. Say what would detect that, and say plainly where the procedure stops and a person has to answer for the choice.
reasoning: |-
  Hmm, this is a fascinating challenge. The user chairs an allocations committee for a health research charity facing complex ethical and procedural dilemmas. They need a practical decision-making framework that respects incommensurable values while meeting operational constraints: quarterly meetings, fixed funding, diverse rotating trustees, and required transparency.

  Key pain points emerge:  
  - Comparing fundamentally dissimilar interventions (scale vs severity vs innovation)  
  - Avoiding false quantification like QALYs or weighted scores  
  - Distinguishing different types of hard choices (genuine parity vs epistemic limits)  
  - Handling aggregation and recurrence systematically  
  - Preventing "incommensurability" from becoming a cop-out  

  Their specifications reveal sophisticated philosophical awareness - they explicitly reference parity, lexical ordering and agent-relative commitments. The operational constraints are brutal: one afternoon with lay trustees, no philosophical training, mandatory written feedback.  

  I notice three core tensions:  
  1) Epistemic vs ontological incommensurability (can't measure vs truly incomparable)  
  2) Regret-worthy vs commitment-worthy choices  
  3) Precedent vs flexibility across quarters  

  The proposed framework needs to:  
  - Diagnose comparability status first (Step 1)  
  - Clarify choice architecture (Step 2)  
  - Set aggregation boundaries (Step 3)  
  - Govern randomness (Step 4)  
  - Manage precedent (Step 5)  

  For the test cases:  
  The initial trilemma requires teasing apart why interventions resist comparison - is it measurement limits (cheap/many) vs true parity (severe/few) vs category difference (exploratory)?  

  The precedent challenge needs to distinguish between:  
  - Improving evidence for existing aims  
  - Versus shifting aims improperly  

  Most delicate is the "disliked case" where a weaker proposal aligns with new aims. Here the framework must either:  
  a) Block funding unless aims were formally reconsidered first, or  
  b) Require explicit aim-adoption with commensurate accountability  

  The closing concerns are valid - no procedure can eliminate bad faith or armchair diagnosis. Safeguards must include:  
  - Forced specification of which values conflict  
  - Public justification audit trail  
  - Chair's accountability for step transitions  
  - Distrust patterns detection (e.g., inconsistent diagnosis of similar cases)  

  Ultimately the chair remains answerable when the procedure reaches its limits - that's not a bug but a feature. The framework makes values conflicts visible rather than hiding them in false quantification.
answer: |-
  Below is a complete decision procedure designed for your committee's constraints. It addresses your specifications through a structured sequence of questions, explicit stopping points for value judgments, and rules for agglomeration, chance, and precedent. The procedure is runnable in one afternoon by lay trustees, avoids false quantification, and marks where responsibility falls.

  ---

  ### **The Procedure: Structured Deliberation for Incommensurable Choices**

  #### **Step 1: Diagnostic Comparison**  
  *Goal: Diagnose why options seem incomparable.*  
  **Question 1:** *"Can we identify a single shared aim (e.g., ‘reduce suffering,’ ‘extend healthy lifespan’) that both proposals serve, even imperfectly?"*  
  - **Yes** → Proceed to **Question 2**.  
  - **No** → Diagnose **genuine incomparability** (options serve radically different aims). Skip to **Step 2**.  
  - **Unclear** → Assign Scientific Officer (SO) to clarify within 15 mins. If still unclear → **incomparability**.  

  **Question 2:** *"For the shared aim, is there *any* evidence that one proposal is clearly better across all material respects (scale, severity, certainty)?"*  
  - **Yes** → Fund the better option. *Stop.*  
  - **No** → *"Is the uncertainty due to missing evidence (e.g., underpowered studies)?"*  
    - **Yes** → Diagnose **epistemic vagueness** (fixable with more evidence). SO flags this in the rejection letter.  
    - **No** → *"Are the options better in mutually irreducible ways (e.g., many small benefits vs. few large ones)?"*  
      - **Yes** → Diagnose **parity** (options "on a par").  
      - **No** → Diagnose **lexical ordering** (e.g., severity trumps scale).  

  **Outputs & Next Steps:**  
  - **Epistemic vagueness**: Reject weaker option; note in letter: "Insufficient evidence to compare efficacy." SO responsible.  
  - **Parity** or **Lexical Ordering**: Proceed to **Step 2**.  
  - **Incomparability**: Proceed to **Step 2**.  
  - **Chair** signs off on diagnosis.  

  ---

  #### **Step 2: Choice-Type Diagnosis**  
  *Goal: Distinguish "permissible choice" from "tragic choice."*  
  **Question:** *"Would funding either option leave a significant moral remainder (e.g., abandoning a group with severe needs)?"*  
  - **Yes** → **Tragic choice** (regret/apology owed). Document: "We recognize this leaves unmet needs."  
  - **No** → **Permissible choice** (commitment suffices). Document: "This aligns with our priorities."  
  **Responsibility**: Full committee debate (20 mins max). **Chair** decides if deadlocked.  

  ---

  #### **Step 3: Agglomeration Rule**  
  *Rule: Agglomeration is only permitted within a *single value dimension* (e.g., "number of lives improved").*  
  **Test**: *"Do all aggregated benefits share a unified description (e.g., ‘reduced minor symptoms’) without conflating distinct values?"*  
  - **Yes** → Allow aggregation (e.g., 20 small studies).  
  - **No** → Reject aggregation. Tell applicant: "Benefits are too heterogeneous to sum."  
  **Responsibility**: **SO** applies test; **committee** ratifies.  

  ---

  #### **Step 4: Randomization Rule**  
  *Rule: Randomize only among options diagnosed as **on a par** (Step 1) or **incomparable** (Step 1).*  
  **Conditions**:  
  - Must have exhausted comparison (Step 1).  
  - Must be a **fair lottery** (equal chance per option), not coin-flip discretion.  
  - **Never** permitted for tragic choices (Step 2).  
  **Output**: Letter states: "Proposals were equally compelling; allocation randomized."  
  **Responsibility**: **Full committee** must approve randomization.  

  ---

  #### **Step 5: Precedent Rule**  
  *Rule: Precedent binds only if (a) the value framework is unchanged, and (b) new evidence doesn’t alter parity/lexical judgments.*  
  **Test**: *"Does this application challenge last quarter’s value weights (e.g., prioritizing scale over severity)?"*  
  - **No** → Follow precedent unless new evidence breaks parity (Step 1).  
  - **Yes** → **Chair** leads 15-min debate on whether to re-weigh aims. Must document: "We re-evaluated our emphasis on [value] because [reason]."  
  **Red Flag**: If >2 quarters of erratic weighting, **Board** reviews committee composition.  

  ---

  ### **Running the Procedure: Your Test Cases**

  #### **Case 1: The Initial Three-Way Choice**  
  - **Cheap, well-evidenced (A)**: Many small benefits.  
  - **Expensive, severe (B)**: Few large benefits.  
  - **Exploratory (C)**: Uncertain, high upside.  
  **Procedure**:  
  1. **Step 1**: No single aim covers all three → **Incomparability** (A: scale, B: severity, C: innovation).  
  2. **Step 2**: Funding any one abandons others → **Tragic choice**.  
  3. **Step 4**: Options incomparable → **Randomization permitted**.  
  4. **Outcome**: Fair lottery among A/B/C. Letters state: "Competing priorities; allocated randomly."  

  ---

  #### **Case 2: Precedent Challenge**  
  *Last quarter: Funded "many small benefits" (A). New applicant: Stronger evidence for similar proposal (A+).*  
  **Procedure**:  
  1. **Step 5**: No challenge to values → Follow precedent. Fund A+ unless:  
     - **Step 1**: New evidence shows A+ and rivals aren’t on a par? (Unlikely; same value).  
  2. **Outcome**: Fund A+. Letter: "Aligned with our focus on scalable interventions."  

  ---

  #### **Case 3: The Disliked Case**  
  *Strong proposal (X) beats rival (Y) on all past criteria, but Y serves a new aim (e.g., rare diseases).*  
  **Procedure**:  
  1. **Step 1**: X and Y serve different aims → **Incomparability**.  
  2. **Step 5**: Funding Y requires re-weighing aims. **Committee** must debate: "Do we adopt ‘support rare diseases’ as a new aim?"  
     - If **yes**, document: "We expanded priorities to include [new aim]." Fund Y.  
     - If **no**, reject Y.  
  3. **Letter to X**: "Your proposal excelled on established criteria, but we prioritized a new direction [if applicable]."  
  4. **Honesty Test**: If committee adopts the new aim, the letter is truthful. If not, X wins.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Armchair Diagnosis**: The procedure *requires* committee engagement to diagnose comparability. It doesn’t presume to label cases from afar; it forces trustees to articulate *why* options resist comparison.  
  2. **Prevention of Bad Faith**: Committees *could* misuse "incommensurability" to hide bias. **Safeguards**:  
     - **Detection**: SO tracks inconsistencies (e.g., calling similar cases "incomparable" vs. "on a par" across quarters).  
     - **Accountability**: Chair must justify transitions (e.g., "Why is this incomparability, not vagueness?").  
     - **Transparency**: Published reasons must cite *specific* values in conflict (e.g., "severity vs. scale"). Vague appeals to "incommensurability" are rejected.  

  **Stopping Point for Judgment**: The procedure ends where values must be chosen (Step 2, Step 5). **The committee owns these choices**, with the Chair breaking deadlocks. No algorithm can override this—your trustees *are* the charity’s moral agents.  

  **Final Output**: A defensible, auditable record of *how* values were weighed—not a false "objective" ranking. This meets your mandate: explaining decisions without pretending away the difficulty.
