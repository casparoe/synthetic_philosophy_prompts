  Okay, I need to grade this student's answer for a genetics teaching assistant. The question is based on a real-life argument the TA had with their sister about heritability and reading ability. The student's response is detailed, but I have to check it against the rubric and see where they got things right or wrong. 

  First, I'll tackle part (a). The student correctly calculates A, C, and E using Falconer's formula. A is 2*(0.72 - 0.44) = 0.56, C is 2*0.44 - 0.72 = 0.16, and E is 1 - 0.72 = 0.28. That sums to 1, good. Their explanation of heritability is spot-on: it's about variance in this population, not individual causation, and they mention it doesn't apply to population means or non-varying causes. The spousal correlation point is handled well—they note assortative mating inflates MZ-DZ difference, making heritability overestimated, and suggest a lower true value around 0.45. Full marks here, though adding a specific adjustment method like (r_MZ - r_DZ)/(1 + r_spouses) would make it perfect.

  Part (b) is about population differences. The student correctly rejects the commentator's inference—heritability within groups doesn't explain between-group differences. They use the maize example perfectly and suggest common-garden experiments as evidence. Good point about heritability varying between X and Y due to environment or sampling error. For pooled heritability, they note the added between-group variance would lower heritability if the gap is environmental, or raise it if genetic. Exactly right. Full marks again; just clarifying that pooled h² depends on why the gap exists would be the cherry on top.

  In part (c), the student dismantles the school-board member's argument: high heritability ≠ unchangeable. They give strong examples (height, PKU) and note that non-genetic variance isn't purely environmental. Their point about gene-environment correlation making interventions *more* plausible is excellent—it shows how heritability can be confounded. But then they slip up: claiming no intervention could move the mean beyond sqrt(0.44) SDs is wrong. That limit applies to individual variance, not population shifts. Like, improving nutrition could raise average height massively even with high h². This is a significant error—it undermines their own argument. So I'll deduct a point here. They missed emphasizing that heritability says nothing about mean malleability.

  Part (d) is flawless. They nail all three issues: heritability is population-level, not individual; the ratio g_i/P_i is scale-dependent; and averaging ratios doesn't equal V_A/V_P. Great examples with temperature scales and nonlinear transformations. Full marks.

  Overall, the student is sharp—they grasp nuances like G-E correlation and between-group fallacies. But the part (c) mistake is serious because it contradicts their core point. Final score: 19/20. For feedback, I'll praise their strengths and flag that one error clearly, suggesting they revisit population-vs-individual limits.
