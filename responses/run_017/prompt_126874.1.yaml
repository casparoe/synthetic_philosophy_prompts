prompt: |-
  hey — I'm a backend dev with no philosophy background, so apologies in advance if I get the terminology wrong. On weekends I've been hacking on a solver for Bongard problems (you know the kind: six little boxes on the left that all follow some rule, six on the right that all break it, twelve examples total and that's all you get). What I keep flip-flopping on isn't the search algorithm, it's what description language to build the feature extractor around. Here are eight candidate vocabularies for describing a single figure:

  1. raw bitmap / occupancy grid, plus a few global stats like ink density and centroid
  2. shape nouns: how many things, closed vs open curve, convex vs concave, number of holes, order of mirror and rotational symmetry
  3. relations only: inside/outside, touching, connected components, nesting depth, is-between — no absolute sizes or shapes at all
  4. metric and proportion: lengths, angles, areas and ratios between them, with deliberately loose thresholds (about twice as long, roughly a right angle)
  5. generator-first: assume each figure was produced by a short program and describe it by that program's parameters — N copies rotated by 2π/N, an arc of radius r swept through θ, and so on
  6. negative space: run the same shape vocabulary on the background instead of the ink, and on each figure's complement inside its own box
  7. near-miss / defect: describe a figure by which regularities it almost satisfies — a curve that's nearly straight, a symmetry broken in exactly one place
  8. cross-figure deltas: never describe a figure on its own; describe each one by how it differs from the other five on its side, and require that the left panel's set of differences hangs together

  Please rank them by how many problems you'd expect a solver restricted to that vocabulary to actually get right — not by how expressive it is in principle, and not by how much it can describe. The thing that makes this hard for me is that with only twelve examples a vocabulary with tons of knobs can always cook up some rule that fits the left panel, which is worth exactly nothing, so I want you to score each out of 100 with a one-sentence reason that names that tradeoff explicitly. Then: tell me if any two on my list are secretly the same thing wearing different hats, tell me one vocabulary you'd add as a ninth that none of these cover, and say where (if anywhere) the ranking would flip if the problems were mostly about weird one-off shapes instead of clean geometric families. Dont bother citing papers or naming who came up with what — I just want the reasoning.
reasoning: |-
  Alright, let's tackle this problem. The user is a backend developer dabbling in Bongard problems on weekends. They need help ranking eight vocabularies for feature extraction based on how effective each would be in solving these problems. The key challenge is the limited data—only twelve examples—which makes overfitting a big risk. 

  First, I need to understand each vocabulary option. The user listed eight, each with different approaches. The goal is to rank them by practical effectiveness, not theoretical expressiveness. The user emphasized that a vocabulary with too many parameters can overfit, so simplicity and robustness are crucial.

  Starting with option 8: Cross-figure deltas. This focuses on differences between figures rather than individual descriptions. Since Bongard problems require contrasting two sets, this approach directly addresses that. It avoids describing single figures, which minimizes overfitting. For example, if all left figures change in a consistent way (like increasing the number of sides), while the right figures don't, that's a clear rule. This seems efficient with limited data. Score: 85.

  Option 7: Near-miss/defect. Humans often solve these by spotting almost-perfect patterns. A figure might have a shape that's nearly symmetric but has one flaw. This captures irregularities which are common in Bongard problems. It's specific enough to avoid overfitting but still captures subtle differences. Score: 80.

  Option 5: Generator-first. Assuming each figure comes from a simple program. For instance, a figure might be generated by rotating a shape N times. This is concise and aligns with how many Bongard problems are designed. However, if the actual rule doesn't fit a procedural generation, it might fail. Still, it's efficient with few parameters. Score: 75.

  Option 4: Metric and proportion. Using approximate measurements like "about twice as long." This avoids precise thresholds, which helps with generalization. Ratios and angles are common in these problems. But it might struggle with non-metric rules. Score: 70.

  Option 2: Shape nouns. Basic geometric properties like symmetry, holes, convexity. These are common in Bongard problems. However, it might miss relationships between shapes. Still, it's a solid baseline. Score: 65.

  Option 3: Relations only. Focusing on spatial relationships without sizes. This is good for relational rules but might miss absolute properties. Some problems depend on sizes, so this could be limiting. Score: 60.

  Option 6: Negative space. Analyzing the background instead of the foreground. Some problems use this, like holes or enclosures. But many rules are about the shapes themselves, so this might not generalize well. Score: 55.

  Option 1: Raw bitmap. Using pixel data and global stats. This is too low-level and prone to overfitting. Without high-level features, it'll struggle with abstract rules. Score: 40.

  Now, about overlaps: Options 5 (generator-first) and 7 (near-miss) are related. Generators imply regularity, and near-miss highlights deviations from that. They're complementary but distinct.

  Missing vocabulary: Function or behavior. Like arrows indicating direction, paths, or movement. Some problems involve implied motion or sequences, which current options don't cover.

  If the problems were mostly weird one-off shapes, the ranking might change. Options like raw bitmap (1) or negative space (6) could become more useful since high-level features might not apply. But generator-first (5) and near-miss (7) would suffer because they rely on regular patterns. Cross-figure deltas (8) might still work if differences are structural. So, 8 and 4 (metric) might stay strong, while 5 and 7 drop.
answer: |-
  Here's the most practical ranking based on Bongard problem dynamics (limited examples, focus on robust generalization over expressiveness), scored out of 100 with explicit tradeoffs:

  1.  **#8: Cross-figure deltas (85/100)**  
      *Reason:* Forces the solver to find *relational differences inherent to the grouping itself*, drastically reducing overfitting risk by ignoring single-figure descriptions entirely – the tightest coupling to the core Bongard task structure.  
  2.  **#7: Near-miss / defect (80/100)**  
      *Reason:* Directly targets the *imperfections* humans use to solve Bongard problems, balancing specificity (broken symmetry) with generality (no need for precise parameters) – excellent signal-to-noise for sparse data.  
  3.  **#5: Generator-first (75/100)**  
      *Reason:* Assumes *procedural regularity*, matching how many Bongard figures are designed; concise parameterization (N, r, θ) inherently limits overfitting compared to open-ended description.  
  4.  **#4: Metric and proportion (70/100)**  
      *Reason:* Deliberate fuzziness ("roughly", "about") provides *noise-tolerant comparisons* of sizes/angles – essential for geometric rules without brittle thresholds.  
  5.  **#2: Shape nouns (65/100)**  
      *Reason:* Captures fundamental *geometric categories* (holes, symmetry) with low dimensionality – robust but often misses critical spatial relationships.  
  6.  **#3: Relations only (60/100)**  
      *Reason:* Focuses purely on *topology* (inside/touching), ignoring distracting metrics – powerful for relational rules but useless for absolute property-based rules.  
  7.  **#6: Negative space (55/100)**  
      *Reason:* Shifts perspective to *background/holes*, useful for enclosure rules – highly situational and adds complexity without broad reliability.  
  8.  **#1: Raw bitmap + stats (40/100)**  
      *Reason:* Pixel-level data is *fatally susceptible to overfitting* with only 12 examples; global stats (density, centroid) are too weak alone – lacks abstraction.  

  **Overlaps:**  
  #5 (Generator-first) and #7 (Near-miss) are deeply linked. Generators imply an "ideal" form (#5), and near-misses (#7) describe deviations *from* that ideal. They're complementary angles on the same concept.  

  **Missing Vocabulary (9th Option):**  
  **Dynamic/Functional Properties:** Describe shapes by *implied behavior or change* – e.g., "arrow-like," "pointing toward X," "path connects A to B," "unstable/tipping," "appears to be rotating." This covers rules about direction, sequence, or potential motion not captured by static geometry.  

  **Ranking Shift for Weird One-Off Shapes:**  
  If problems feature unique, non-geometric shapes (e.g., amorphous blobs, organic forms):  
  *   **#4 (Metric), #5 (Generator), #7 (Near-miss)** drop significantly. They rely on clean, regular patterns.  
  *   **#3 (Relations), #6 (Negative Space), #8 (Deltas)** hold value or even gain, as they abstract away shape specifics.  
  *   **#2 (Shape Nouns)** weakens (fewer symmetries/holes).  
  *   **#1 (Raw Bitmap)** might *relatively* improve (still poor, but less outclassed) if weirdness defies abstraction.  
  *   **New Winner:** #8 (Cross-figure deltas) likely remains strongest, as *differences* between weird shapes can still be structural or relational.  

  **Key Takeaway:** Prioritize vocabularies that enforce *contrastive reasoning* (#8) or highlight *deviations from simplicity* (#7, #5). Expressiveness is the enemy here – the best features constrain the hypothesis space *naturally* to align with Bongard's intent.
