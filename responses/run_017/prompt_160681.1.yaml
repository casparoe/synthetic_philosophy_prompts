prompt: |-
  hey — I'm on the student conduct board at my school, which is the panel that hears cases where one student says another student did something (copied homework, harrased someone, took something, whatever) and then writes up what we think probably happened, and the dean decides the punishment after that. It's me plus four other kids and a teacher advisor who has to sign off on whatever we write. We get maybe one case a week, hearings are 20-30 minutes, nobody trained us in anything, and "use your judgment" in practice means whoever talks smoother and isn't shaking wins. I was complaining about this to my sister's boyfriend, who's in grad school for philosophy, and he said there's a whole literature on this stuff — something about credibility deficits, identity prejudice, and also a version where someone can't even name what happened to them because the words aren't there yet — and the more I think about it the more I think we're definately doing the bad thing a lot of the time. But his version feels too strong to me too, because some kids really do lie or exaggerate or misremember, and we can't just believe everybody, and we're not a court, we don't get to bring in lawyers or delay for a month.

  So can you turn that into an actual procedure our panel can run on a case, in order? I mean: the questions to ask one after another, what would count as a good enough answer to each one, the point where we stop and say we can't credit this person's account, and the point where we stop and hand it to the advisor or dean because it's actually a values call and not a fact call. Some constraints on it: our writeup form makes us pick a "reason code" from a dropdown for why we did or didn't believe each person — options are things like "inconsistent with other evidence," "implausible sequence of events," "witness had no opportunity to observe," "manner and hesitation while speaking," "prior inconsistent statements" — and I want to know which of those are legitimately about evidence and which are just prejudice with a badge on. Also: what do we do with a kid who's obviously articulate, confident, well-spoken, and tells a clean story — is believing them more automatically the bad thing, or is there a version of relying on that which is fine, and how do I tell the difference in thirty seconds? And what about a kid who reports something but can only say it "felt wrong," or who uses a label they clearly picked up off tiktok last week and applies it loosely — I don't want to be the panel that dismissed someone because they didn't have the vocabulary, but I also don't want to send the dean after someone on pure vibes. And please be honest about where a checklist is just fake rigor, i.e. where we're really making a judgment call and dressing it up as a step.

  Then run the finished procedure on three cases, since that's how I'll know if it's usable. One: a quiet freshman who stutters and sometimes switches into spanish mid-sentence says a popular senior shoved her in the hallway; the senior is the debate captain, very calm, gives a detailed and internally consistent account of being somewhere else entirely, and no footage exists. Two: a sophomore who has made two false reports before — both pretty clearly attention-seeking, everyone on the board knows about them — says someone stole her phone, and this time the details check out against a blurry hallway camera and a text timestamp, though the camera doesn't show a face. Three: pick the case yourself where you think the procedure gives me an answer I won't like, and show it anyway — my guess is it's either a case where the procedure says we should refuse to decide, or one where it says we should discount someone for a reason that feels mean but is actually evidentiary, but you choose. Also tell us straight up what the procedure can't fix: where five sixteen-year-olds with no training, one adult who's half-checking his email, and a dropdown menu are just going to get it wrong no matter what checklist you hand us, and where the honest conclusion is that the decision shouldn't be made by students at all.
reasoning: |-
  We are designing a procedure for a student conduct board that must be efficient (20-30 minutes per case) and fair, while avoiding common pitfalls like credibility deficits due to identity prejudice or lack of vocabulary. The procedure must also account for the fact that the panel is made of students with no formal training and an advisor who signs off.

  Key principles from the literature (as referenced by the sister's boyfriend) that we must incorporate:

  1. **Credibility deficits**: When a person's credibility is unfairly discounted due to their identity (e.g., race, gender, disability, language barrier, etc.).
  2. **Identity prejudice**: Preconceived notions about a person based on their identity affecting judgment.
  3. **Hermeneutical injustice**: When a person cannot articulate their experience because they lack the vocabulary or concepts (e.g., a victim of harassment might say it "felt wrong" but not know the term "sexual harassment").

  We also have to address:
  - The need to not automatically believe everyone, as some reports are false.
  - The existing dropdown reasons for credibility assessments and which are legitimate versus potentially prejudiced.
  - How to handle articulate, confident witnesses versus those who are nervous, stutter, or lack vocabulary.
  - The fact that the panel is not a court and cannot conduct lengthy investigations.

  The procedure will be a step-by-step guide for the panel to follow in each hearing. It must include:
  - The sequence of questions to ask.
  - What counts as a good enough answer.
  - When to stop and say we cannot credit an account.
  - When to hand over to the advisor/dean as a values call.

  We'll also analyze the existing dropdown reasons and flag which are legitimate and which might mask prejudice.

  Then, we'll test the procedure on three cases.

  ---

  **Proposed Procedure for a Hearing**

  **Step 0: Pre-Hearing Preparation**
  - The panel reviews the written complaint and any evidence submitted (e.g., text messages, photos, witness statements, camera footage if available). This should be done before the hearing.
  - The panel must note: What is the alleged incident? Who are the parties? What evidence is already available?

  **Step 1: Opening the Hearing (2 minutes)**
  - The advisor (teacher) explains the process: Each party (complainant and respondent) will have a chance to speak without interruption, then the panel may ask questions. The panel's role is to gather facts, not to decide punishment.
  - Set ground rules: No interruptions, be respectful.

  **Step 2: Complainant's Account (5-7 minutes)**
  - Ask the complainant: "Please tell us in your own words what happened, including when, where, and who was involved."
  - Allow the complainant to speak without interruption. Panel members take notes.
  - After the account, the panel may ask clarifying questions. These should be open-ended and non-leading:
    - "Can you tell us more about what happened right before [specific moment]?"
    - "How did you feel at that moment?"
    - "Is there anyone else who might have seen this?"
    - Avoid questions that suggest an answer (e.g., "Did he push you hard?" vs. "What happened next?")

  **Step 3: Respondent's Account (5-7 minutes)**
  - Same as Step 2: The respondent gives their account without interruption, then clarifying questions.

  **Step 4: Evidence Review (5 minutes)**
  - The panel reviews any physical evidence (e.g., text messages, timestamps, video footage, etc.). If there are written statements from witnesses, they are considered here.
  - Ask both parties: "Is there any other evidence you would like us to consider?" (They might have brought something not previously submitted.)

  **Step 5: Panel Deliberation (5-10 minutes)**
  - The panel discusses the case in private (without the parties). The advisor is present but should not dominate; they can provide guidance if the panel is stuck.
  - The panel must answer the following questions in order:

    **Question 1: What are the material facts in dispute?**
      - Identify what is agreed upon and what is not. If there is no dispute (e.g., both agree that a shove happened but disagree on intent), then the panel notes that.

    **Question 2: Is there any physical or documentary evidence that directly supports or contradicts either account?**
      - If yes, evaluate that evidence. For example:
          - A timestamped text message that shows the complainant was texting at the time of the alleged incident might support an alibi.
          - Video footage that shows part of the incident.
      - If the evidence is inconclusive (e.g., blurry video), note that.

    **Question 3: Are there any internal inconsistencies in either account?**
      - Look for contradictions within one person's story (e.g., "I was alone" but later "my friend saw it"). This is a legitimate reason for doubt (dropdown: "inconsistent with other evidence" or "prior inconsistent statements" if there's a written complaint that differs).

    **Question 4: Are there any external consistencies or inconsistencies?**
      - Does the account align with what we know about the world? For example:
          - If someone claims they were in two places at once, that's implausible (dropdown: "implausible sequence of events").
          - But note: what seems implausible might be due to lack of understanding (e.g., a person with a disability might behave in ways that seem odd to others but are normal for them).

    **Question 5: Are there any credibility factors that we must adjust for to avoid identity prejudice?**
      - This is critical. The panel must consciously reflect:
          - Is the complainant/respondent nervous? (Nervousness is normal and does not imply lying.)
          - Do they have a speech impediment, language barrier, or cultural difference that affects how they present? (This should not count against them.)
          - Are they using vague terms because they lack the vocabulary? (This might be hermeneutical injustice; we must focus on the underlying events they describe, not the labels.)
          - Is one party more articulate? (Articulateness does not equal truthfulness; it might reflect education, training, or social privilege.)
      - Adjustment: Imagine the same account given by a confident, articulate person. Would it then be credible? If yes, then the nervousness or lack of articulateness should not be held against the person.

    **Question 6: Considering the above, what is the most probable version of events?**
      - The panel must decide on a balance of probabilities (more likely than not) what happened.

    **Question 7: Are we stuck on a values question?**
      - If the dispute is about whether an action constitutes a violation (e.g., "Was that comment harassment or just rude?"), then the panel should note the facts and let the advisor/dean decide the values part.

  **Step 6: Writing the Report (during deliberation, using the form)**
  - For each party, the panel selects one or more reason codes for why they believed or disbelieved parts of the account. The legitimate evidence-based reasons are:
      - "inconsistent with other evidence" (if there's a conflict with physical evidence or multiple prior statements)
      - "implausible sequence of events" (use cautiously, only when it defies basic logic, e.g., being in two places at once)
      - "witness had no opportunity to observe" (e.g., the witness claims to have seen something but was not present)
      - "prior inconsistent statements" (if the person has given different accounts at different times)

  - Reasons that might mask prejudice and should be avoided or heavily scrutinized:
      - "manner and hesitation while speaking": This is problematic because nervousness is common and may be due to the stress of the hearing or cultural factors. Instead, the panel should consider if the hesitation is about key facts and if there's a pattern of inconsistency. If used, it must be coupled with Question 5 adjustment.

  - Additional notes for the report:
      - If the panel cannot decide because the evidence is insufficient, they should state that and not make a finding.
      - If there is hermeneutical injustice (e.g., the complainant says "it felt wrong" but cannot articulate why), the panel should describe the events factually and let the dean decide if it meets the code of conduct.

  **Step 7: Conclusion**
  - The panel writes a summary of the facts as found, and the advisor signs off.

  ---

  **Legitimacy of Dropdown Reasons**

  - **Legitimate (if used with caution and evidence)**:
    - "inconsistent with other evidence": Requires that there is other evidence (e.g., a text message, a video, a witness statement) that directly contradicts the account.
    - "implausible sequence of events": Use only for clear impossibilities (e.g., "I was in math class and at the scene at the same time"). Do not use for subjective judgments (e.g., "I wouldn't have done that").
    - "witness had no opportunity to observe": Only if there is evidence the witness was not present (e.g., attendance records, a reliable alibi).
    - "prior inconsistent statements": If the person has given a different account in writing or to another person, and it's documented.

  - **Potentially Problematic (require extra scrutiny and the Question 5 adjustment)**:
    - "manner and hesitation while speaking": This can be influenced by prejudice. Only use if there is a clear pattern of evasiveness on key points that cannot be explained by nervousness, and after considering identity factors. Better to avoid this reason unless it's extreme and coupled with other inconsistencies.

  ---

  **Handling Specific Situations**

  1. **Articulate, confident witness**: 
     - Do not automatically believe them. Apply the same steps: look for consistency, plausibility, and corroborating evidence. Remember that confidence can be rehearsed or a product of privilege. The key is to not let smoothness override the lack of evidence or the presence of contradictory evidence.

  2. **Vague reports ("felt wrong") or new vocabulary from TikTok**:
     - Focus on the events: "Can you describe what happened that made you feel that way?" Get concrete details (what was said, what was done, when, where). 
     - If the person uses a label (e.g., "gaslighting") but the events they describe don't match, note the events and avoid the label. The panel should describe the facts and let the dean decide if it meets the definition in the code of conduct.

  ---

  **What the Procedure Cannot Fix**

  - Lack of training: Students may not recognize their own biases or may be influenced by social dynamics (e.g., popularity of the accused).
  - Time constraints: 20-30 minutes is very short. Some cases require more investigation.
  - Inherent unreliability of eyewitness testimony: Memory is fallible, and without corroboration, it's hard to know.
  - The advisor may not be fully engaged, and students might defer to them.
  - Cases with no evidence: The panel might have to say "we don't know," which might feel unsatisfactory.

  In some cases, the honest conclusion is that the decision should not be made by students at all, especially for serious allegations (e.g., sexual assault, racial harassment) that require professional investigation. The school should consider having a trained adult investigator for such cases.

  ---

  **Testing the Procedure on Three Cases**

  **Case 1: Quiet freshman vs. popular senior**
  - Complainant: Freshman, stutters, switches to Spanish, says a senior shoved her in the hallway.
  - Respondent: Senior, debate captain, calm, detailed alibi (was elsewhere), no footage.
  - **Procedure Application**:
    - Step 2: Freshman gives account. She might be nervous and switch languages. Panel asks: "Can you describe the shove? Where were you? What time? Did anyone see it?" She might not have details because it was quick.
    - Step 3: Senior gives a detailed alibi. Panel asks: "Where exactly were you? Is there anyone who can confirm? What were you doing?" 
    - Step 4: No physical evidence.
    - Step 5 (Deliberation):
        - Q1: Disputed fact: whether the shove happened and whether the senior was present.
        - Q2: No physical evidence.
        - Q3: Check for internal inconsistencies. Freshman's account might be sparse but consistent. Senior's account is detailed and consistent.
        - Q4: Plausibility? Both accounts are plausible.
        - Q5: Adjust for credibility factors. Freshman's nervousness and language switching are not reasons to disbelieve. Imagine her account given confidently: "A senior shoved me in the hall at 3pm." Is that credible? Yes, shoves happen. Senior's articulateness might mask a lie. 
        - Q6: Without evidence, we cannot say who is more credible. The panel cannot decide.
    - **Conclusion**: The panel writes that the incident is disputed and there is insufficient evidence to conclude what happened. They do not credit either account fully and do not assign a reason code that blames the freshman's manner. They note: "No corroborating evidence, and both accounts are plausible." This goes to the dean with a finding of "unresolved."

  **Case 2: Sophomore with prior false reports**
  - Complainant: Sophomore, two prior false reports (attention-seeking), says someone stole her phone.
  - Evidence: Blurry hallway camera shows someone taking a phone from a desk, text timestamp shows she sent a text at the time she says it was stolen.
  - **Procedure Application**:
    - Step 2: Sophomore gives account. Panel notes prior false reports but does not hold it against her yet. Focus on this incident.
    - Step 3: No respondent identified? (The case is about whether a theft occurred, not accusing a specific person.) So skip respondent's account or have a general denial if someone is accused.
    - Step 4: Evidence: Camera shows a theft but no face. Text timestamp is consistent with her account (she texted, then the phone went dead).
    - Step 5 (Deliberation):
        - Q1: Fact: whether the phone was stolen.
        - Q2: Physical evidence: Camera shows theft and timestamp confirms the time. This supports her account.
        - Q3: Her account is consistent with evidence.
        - Q4: Plausible? Yes.
        - Q5: Prior false reports: This is a legitimate factor to consider (it goes to credibility) but must not be the sole reason. Here, the physical evidence corroborates her account. Without evidence, the prior false reports might lead to doubt, but with evidence, they are outweighed.
        - Q6: On balance, the theft likely occurred.
    - **Conclusion**: The panel credits her account. Reason codes: "consistent with other evidence" (camera and timestamp). They do not use "prior inconsistent statements" for the prior false reports because they are about past incidents, not this one. The report states that the evidence supports the account despite prior issues.

  **Case 3: A Case Where the Procedure Gives an Unpopular Answer**
  - **Case Description**: A junior (complainant) says that a classmate (respondent) made a racist remark during a group project meeting. The complainant is Black, the respondent is White. There were no other witnesses. The complainant says the remark was "you people are always causing trouble," but when asked, she cannot remember the exact context. The respondent denies it and says he is not racist. The complainant is emotional and says, "I know what I heard, but I can't prove it." The respondent is calm and says, "I would never say that; I have Black friends."
  - **Procedure Application**:
    - Step 2: Complainant gives account. She is upset and says the remark was racist and hurtful. When pressed for context, she says it was during a disagreement about the project but cannot recall the exact words beyond the gist.
    - Step 3: Respondent denies, provides his version: they had a disagreement about the project, but he did not say anything racist. He says she is misinterpreting.
    - Step 4: No evidence (no recordings, no other witnesses).
    - Step 5 (Deliberation):
        - Q1: Disputed fact: whether the racist remark was made.
        - Q2: No physical evidence.
        - Q3: Both accounts are internally consistent.
        - Q4: Both are plausible (racist remarks happen; also, misunderstandings happen).
        - Q5: Adjust for credibility: The complainant's emotion is normal for someone reporting racism. The respondent's calmness does not mean he is truthful. The panel must not discount the complainant because she is emotional or because the respondent "has Black friends" (a common trope). Also, note hermeneutical injustice: she might not have the exact words because she was shocked.
        - Q6: Without evidence, the panel cannot decide. The remark might have been made, but there is no way to confirm.
    - **Conclusion**: The panel writes that they cannot determine whether the remark was made. They note the complainant's distress and the seriousness of the allegation, but without corroboration, they must leave it unresolved. This might be unpopular because the complainant feels unheard, and the panel might feel they are failing a victim. However, the procedure requires that without evidence, they do not make a finding. The dean might still take action based on the report (e.g., provide support to the complainant or monitor the respondent) but the panel does not find a violation.

  This case highlights a limitation: without witnesses or evidence, it's hard to prove verbal harassment. The school might need a different approach (e.g., restorative justice) for such cases.

  ---

  **Final Note**

  The procedure aims to be fair and evidence-based, but it is not perfect. It requires panel members to be self-aware about their biases and to focus on facts. The school should provide training on implicit bias and active listening for panel members. Also, for serious cases, the school should consider having a professional investigator.

  The procedure in a nutshell: 
  1. Get accounts without interruption.
  2. Review evidence.
  3. Deliberate by asking: what's disputed? what does evidence say? is it consistent? is it plausible? adjust for identity factors. then decide.
  4. Write the report with legitimate reasons.

  This should fit within 30 minutes with practice.
answer: |-
  Below is a structured, step-by-step procedure for your panel to follow in hearings. It integrates principles from epistemology, credibility assessment, and hermeneutical injustice (the "can't name what happened" problem) while being realistic for a 20-30 minute hearing. The procedure focuses on **evidence-based reasoning** and flags where identity prejudice might creep in. I'll break it down into phases, questions, decision thresholds, and how to use your dropdown codes legitimately. Then I'll apply it to your three cases.

  ---

  ### **Core Principles Embedded in the Procedure**
  1. **Credibility ≠ Confidence**: Nervousness, stuttering, or lack of polish doesn’t make someone less credible. Confidence can mask rehearsal or privilege.
  2. **Hermeneutical Injustice**: If someone can’t articulate harm (e.g., "it felt wrong"), focus on **concrete actions** they describe, not their labels.
  3. **Evidence > "Vibes"**: Prioritize physical/digital evidence, timelines, and inconsistencies. Subjective factors (e.g., "manner while speaking") are last-resort flags.
  4. **Prior History ≠ Current Truth**: Past false reports don’t automatically discredit someone—corroborate with current evidence.
  5. **Know Your Limits**: If evidence is balanced or a values call is needed (e.g., "Was this harassment or just rude?"), pass it to the dean.

  ---

  ### **The Procedure: Step-by-Step for a 20-30 Minute Hearing**
  **Phase 1: Pre-Hearing Prep (5 mins)**  
  - **Panel reviews documents**: Complaint, evidence (texts, videos, timestamps), prior reports.  
  - **Advisor assigns roles**: One panelist tracks timelines, one notes inconsistencies, one watches for identity prejudice (e.g., "Are we judging speech patterns?").  

  **Phase 2: Complainant’s Account (7 mins)**  
  - **Ask**: "Describe exactly what happened, step by step. Where were you? What time? What did you see/hear/do? Who else was there?"  
  - **Listen for**:  
    - Concrete actions (e.g., "He pushed my shoulder," not "He assaulted me").  
    - Gaps in vocabulary (e.g., "It felt gross" → probe: "What did they *do* that felt gross?").  
  - **Threshold to discredit**: Only if account is **internally inconsistent** (e.g., "I was alone" vs. "My friend saw it") *and* no explanation given.  
  - **Dropdown codes allowed here**:  
    - ✅ Legit: "Prior inconsistent statements" (if they’ve changed their story), "Implausible sequence" (e.g., "I was in two places at once").  
    - 🚩 **Danger Zone**: "Manner and hesitation while speaking" — **Only use if** hesitation directly contradicts physical evidence (e.g., stuttering when lying about a timestamp that’s disproven).  

  **Phase 3: Respondent’s Account (7 mins)**  
  - **Same questions as Phase 2**, but add: "How do you explain the complainant’s version?"  
  - **Watch for**: Overly polished stories — ask, "Can you walk us through that again in reverse order?" (Rehearsed lies often crumble).  
  - **Threshold to discredit**: Same as above — only for internal inconsistencies or physical impossibilities.  

  **Phase 4: Evidence Check (5 mins)**  
  - **Ask both**: "Is there any evidence (texts, videos, witnesses) supporting your version?"  
  - **Compare to**: Timelines, camera footage, digital records.  
  - **Threshold to discredit**:  
    - If account contradicts **verified evidence** (e.g., "I wasn’t there" but camera shows them).  
    - If no evidence exists → proceed to consistency/plausibility checks.  
  - **Dropdown codes allowed here**:  
    - ✅ Legit: "Inconsistent with other evidence," "Witness had no opportunity to observe."  
    - 🚩 **Danger Zone**: "Implausible sequence" — **Only use if** it defies physics/logic (e.g., "I teleported"), not if it’s just unlikely.  

  **Phase 5: Deliberation (6 mins)**  
  Ask these questions **in order**:  
  1. **"What do we all agree happened?"** (Start with common ground.)  
  2. **"Is there physical/digital evidence that directly supports or contradicts either side?"** (Prioritize this.)  
  3. **"Are there internal inconsistencies in either account?"** (Ignore nerves — focus on facts.)  
  4. **"Does identity prejudice affect how we’re judging this?"** (E.g., "Are we doubting the freshman because she codeswitched to Spanish?")  
  5. **"On balance, what’s more probable?"** (Use "more likely than not" standard.)  
  6. **"Is this a fact issue we can decide, or a values issue for the dean?"** (E.g., "Was this theft or borrowing?" → pass to dean.)  

  **Decision Thresholds**:  
  - ✅ **Credible**: Account aligns with evidence, consistent, and any gaps are explained (e.g., "I froze and can’t recall details").  
  - ❌ **Not credible**: Contradicts evidence, internally inconsistent, or physically impossible.  
  - ⚠️ **Inconclusive**: No evidence + balanced plausibility → write "unable to determine" and explain why.  

  **Phase 6: Report Writing (5 mins)**  
  - **Dropdown codes**: Use only if backed by **specific examples** (e.g., not "Manner and hesitation" unless tied to a provable inconsistency).  
  - **Pass to advisor/dean if**:  
    - Values judgment needed (e.g., "Was this harassment?").  
    - Safety risk (e.g., violence, discrimination).  
  - **Template for hermeneutical injustice**:  
    > "Complainant described [concrete actions] but could not label the harm. We assessed the actions based on evidence."  

  ---

  ### **Which Dropdown Reasons Are Legit?**
  - ✅ **Evidence-based**:  
    - "Inconsistent with other evidence" (e.g., alibi disproven by camera).  
    - "Prior inconsistent statements" (e.g., changed story in writing vs. hearing).  
    - "Witness had no opportunity to observe" (e.g., witness wasn’t present).  
  - 🚩 **Use sparingly (often masks prejudice)**:  
    - "Manner and hesitation while speaking" — **Only** if paired with a proven lie (e.g., hesitated when lying about a text receipt).  
    - "Implausible sequence of events" — **Only** if physically impossible (e.g., "I was in class and at the scene simultaneously").  
  - ❌ **Never use alone**:  
    - Nervousness, accent, stuttering, or lack of polish. These require **corroborating evidence** to discredit.  

  ---

  ### **Applying the Procedure to Your Cases**
  #### **Case 1: Quiet freshman vs. debate captain senior**  
  - **Phase 2 (Complainant)**: Freshman says, "He shoved me near locker 12 at 3:05 PM." She stutters, mixes Spanish/English. No witnesses.  
  - **Phase 3 (Respondent)**: Senior says, "I was in debate prep at 3:05 — here’s my attendance sheet." Calm, detailed.  
  - **Phase 4 (Evidence)**: No footage. Attendance sheet shows senior was in debate.  
  - **Phase 5 (Deliberation)**:  
    1. No agreement on events.  
    2. Evidence supports senior’s alibi.  
    3. Freshman’s account is sparse but consistent; senior’s is polished but no inconsistencies.  
    4. **Identity check**: Would we doubt the freshman if she were confident? Yes → adjust for prejudice.  
    5. **Probability**: Senior’s alibi is corroborated → freshman’s account unlikely.  
  - **Decision**: ❌ Complainant not credible.  
  - **Dropdown code**: "Inconsistent with other evidence" (attendance sheet).  
  - **Why not "manner and hesitation"?** Her nerves/language aren’t evidence of lying — the alibi is.  

  #### **Case 2: Sophomore with prior false reports**  
  - **Phase 2 (Complainant)**: "Someone stole my phone from my bag in the gym at 4:30 PM."  
  - **Phase 4 (Evidence)**:  
    - Blurry camera shows someone taking a phone from a bag in gym at ~4:28 PM.  
    - Text timestamp: She texted at 4:25 PM; phone went dead at 4:30 PM.  
  - **Phase 5 (Deliberation)**:  
    1. Agreement: Phone was taken.  
    2. Evidence supports her timeline.  
    3. No internal inconsistencies in her story.  
    4. **Identity check**: Prior reports are relevant but don’t override physical evidence.  
    5. **Probability**: Evidence matches her account → credible.  
  - **Decision**: ✅ Complainant credible.  
  - **Dropdown code**: "Consistent with other evidence" (camera + timestamp).  
  - **Note**: Prior reports aren’t used — current evidence is conclusive.  

  #### **Case 3 (My Choice): The "Unpopular but Evidentiary" Case**  
  **Scenario**: A student (complainant) says a teacher made them uncomfortable by "always staring and standing too close." They say it "felt predatory" but admit no explicit threats. The teacher (respondent) says they were "being attentive." No witnesses, no prior incidents.  
  - **Phase 2 (Complainant)**: "He stood inches away daily during lab. It felt invasive." Uses "predatory" loosely (TikTok influence).  
  - **Phase 3 (Respondent)**: "I circulate closely to help students — it’s pedagogy."  
  - **Phase 4 (Evidence)**: None.  
  - **Phase 5 (Deliberation)**:  
    1. Agreement: Close proximity occurred.  
    2. No evidence to contradict either side.  
    3. No internal inconsistencies.  
    4. **Identity check**: Complainant’s vague language isn’t dishonesty — they lack vocabulary.  
    5. **Probability**: Both accounts plausible. No proof of malicious intent.  
    - **Values call**: "Is this misconduct or teaching style?" → Not a fact issue.  
  - **Decision**: ⚠️ Inconclusive → **Pass to dean** with note:  
    > "Confirmed close proximity occurred, but intent unclear. Dean to determine if this violates conduct policy."  
  - **Why unpopular?** The complainant feels dismissed, but the panel can’t adjudicate intent without evidence.  

  ---

  ### **What the Procedure Can’t Fix: The Hard Truths**  
  1. **You’re not investigators**:  
     - No training + no time = You’ll miss nuances in serious cases (e.g., coercion, trauma responses).  
     - **Solution**: Pass **all** harassment/discrimination cases to the dean. Your role: gather facts, not judge harm.  

  2. **Identity prejudice is inescapable**:  
     - Unconscious bias will sway you (e.g., believing the debate captain). The procedure mitigates this but can’t eliminate it.  
     - **Solution**: Rotate panelists to avoid "popularity" skews; mandatory bias training.  

  3. **The advisor’s role is flawed**:  
     - If they’re disengaged, they’ll rubber-stamp your report. Demand they participate in Phase 5 deliberations.  

  4. **"Dropdown menus invite laziness**:  
     - Selecting "implausible events" for a nervous kid is quicker than digging for evidence. The procedure forces rigor, but panelists might cut corners.  

  5. **When students shouldn’t decide**:  
     - Cases involving trauma (e.g., sexual harassment), power imbalances (e.g., teacher-student), or legal risks (e.g., theft of high-value items). **Your panel lacks the expertise.** Advocate for adult-led investigations in these cases.  

  ---

  ### **Final Checklist for Your Panel**  
  - ✅ **Before hearing**: Review evidence, assign roles.  
  - ✅ **During hearing**: Focus on concrete actions, not labels.  
  - ✅ **Deliberation**: Follow the 6-question sequence.  
  - ✅ **Report**: Use dropdown codes only with evidence.  
  - ✅ **When stuck**: Pass values calls or inconclusive cases to the dean.  

  This won’t make you infallible, but it replaces "who talks smoother" with a legit process. Remember: Your job is **fact-finding**, not justice. If the system is broken, use these flaws to advocate for better training or adult oversight.
