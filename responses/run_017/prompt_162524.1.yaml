prompt: |-
  I sit on the allocation committee of a small family foundation that has funded, for roughly a decade, almost entirely within the effective-altruism orbit: global health, cash transfers, some animal welfare, nothing political. In the last year or two several of us have become persuaded by the institutional critique — specifically the version that says our cost-effectiveness methodology does not merely happen to select against structural and political work, but reliably does so, because the effects of that kind of work are diffuse, delayed, and hard to attribute to any particular grant, while the effects of a bednet distribution are countable.

  Where I am stuck is the remedy. My instinct has been that this is at bottom an epistemic defect and should be repaired epistemically: our estimates for systemic interventions are implausibly precise, so we should widen them — larger error bars, fatter upper tails, perhaps a higher prior mean for interventions that act on leverage points rather than on individual recipients — and then apply something like a discount for model uncertainty, scaled to how speculative the causal story is, and otherwise leave the maximizing framework untouched. Two colleagues think this misses the point, but neither has been able to say what the point is.

  So my question, concretely: is there a principled way to calibrate such a discount, and would calibrating it do the work we are asking of it? I have started to doubt it. Widening an interval symmetrically does not raise its mean; a discount scaled to how poorly measured an option is seems, if anything, to push us further from political work rather than toward it; and raising the prior mean looks like asserting the conclusion. If that is right, then the critique is not really a claim about the precision of our estimates, and I would like to know what it is a claim about instead — and whether an allocator can answer it from inside her own allocation decision at all, or only at the level of what the field collectively funds, studies, and therefore comes to know.
reasoning: |-
  Okay, the user is part of a family foundation allocation committee that has historically funded effective altruism (EA) causes like global health and animal welfare. They've recently been persuaded by the institutional critique that their cost-effectiveness methodologies inherently favor measurable interventions over systemic or political ones. The user's instinct is to adjust their models—wider error bars, fatter tails, higher prior means for systemic work—but their colleagues think this misses the point, and the user is starting to doubt their approach. They want to know if there's a principled way to calibrate such adjustments and whether it addresses the core critique.

  First, I need to unpack the institutional critique. The issue isn't just about measurement precision; it's about the fundamental mismatch between the EA evaluation framework and the nature of systemic change. Systemic interventions have diffuse, long-term, and non-attributable outcomes, which don't fit into cost-effectiveness models designed for direct, quantifiable impacts. The user’s proposed solutions—like widening error bars or adjusting priors—might not solve this because they’re still operating within the same maximizing framework that’s the root of the problem.

  The user mentions that symmetrically widening intervals doesn’t raise the mean, and discounts for uncertainty might penalize systemic interventions further. Adjusting the prior mean could feel arbitrary. So, the critique is deeper: it's about the limits of quantification itself. The foundation might be trying to fit a square peg (systemic change) into a round hole (cost-effectiveness models).

  I should consider alternatives. Maybe they need a portfolio approach, diversifying funding to include both measurable and systemic interventions. Or perhaps adopting different evaluation frameworks for different types of work. For systemic efforts, qualitative theories of change and case studies might be more appropriate than quantitative metrics. Also, funding field-building and ecosystem support could help build the knowledge base needed to evaluate systemic work in the future.

  The user’s deeper need might be balancing their commitment to EA principles with the recognition that some impactful work can't be measured the same way. They might also be seeking validation that moving beyond strict quantification isn't abandoning rigor but adapting to different contexts. Ensuring the foundation remains effective without being constrained by methodologies that exclude certain interventions is key.

  Another angle: epistemic humility. Accepting that some interventions can't be evaluated within the current models and that the foundation might need to fund based on different criteria. This could involve trusting domain experts in political or systemic change, even without the same level of evidence. The challenge is maintaining accountability without relying solely on metrics.

  The user’s question about whether this can be addressed at the allocation level or requires collective action is important. Individual foundations can adopt portfolio diversification, but field-wide shifts in evaluation methods and knowledge infrastructure are essential for long-term change. Encouraging research into systemic interventions' impacts and developing better evaluation frameworks could be part of their strategy.

  In summary, the user needs to recognize that their epistemic adjustments might be insufficient. The solution lies in diversifying their approach, using different evaluation methods for different interventions, and contributing to broader field-building efforts. Balancing immediate measurable impacts with long-term systemic change through a portfolio approach could address both aspects without compromising their values.
answer: |-
  Your instincts and doubts are profoundly insightful. The institutional critique you're grappling with isn't merely about *precision*; it's a challenge to the *fundamental applicability* of the standard EA cost-effectiveness maximization framework to systemic/political interventions. Your proposed epistemic fixes are logical attempts within the existing paradigm, but they likely won't bridge the gap because the problem runs deeper. Here's a breakdown:

  1.  **Why the Epistemic Fixes Fall Short:**
      *   **Wider Error Bars/Fatter Tails:** As you note, this symmetrically increases uncertainty without necessarily increasing the *expected value*. More importantly, it doesn't address the core problem: **non-attributability**. How do you assign *any* plausible numerical estimate, even with huge uncertainty, to "contributing to a shift in political norms" or "strengthening resistance movements" when the outcome is the result of countless actors and factors over decades? The model demands *some* estimate, but generating one feels arbitrary.
      *   **Discount for Model Uncertainty/Speculativeness:** This actively *penalizes* systemic work relative to direct work. Bednet distributions have well-established causal models. Systemic work, by its nature, relies on more complex, contested, and inherently "speculative" theories of change. Discounting based on this speculativeness systematically biases against systemic work, precisely what you're trying to counter.
      *   **Raising the Prior Mean:** This feels like "asserting the conclusion" because it *is*. Without a robust, independent justification grounded in evidence or theory specific to the *actual expected impact* of the intervention (not just the category), it's arbitrary. It abandons the core EA principle of evidence-based prioritization without offering a rigorous alternative.

  2.  **What the Critique is *Really* Claiming:**
      The core claim of this strand of the institutional critique is that **the standard EA cost-effectiveness maximization framework is methodologically incapable of adequately evaluating systemic/political interventions due to fundamental ontological and epistemological mismatches:**

      *   **Ontological Mismatch:** Systemic interventions aim to change *systems* (structures, rules, norms, power distributions). Their effects are **emergent, non-linear, context-dependent, and path-dependent**. They work through complex causal chains involving many actors and feedback loops. Direct interventions (like bednets) aim for discrete, attributable outputs/outcomes on a specific population.
      *   **Epistemological Mismatch:** Reliable quantification and attribution are often impossible for systemic change within relevant timeframes. Success is often **counterfactual-dependent** (what *didn't* happen due to the intervention?) and relies on **narrative and process tracing** more than statistical attribution. The "unit of analysis" (the system) is often too large and complex for controlled measurement.
      *   **Temporal Mismatch:** Significant systemic change often operates on **decadal timescales**, far exceeding typical grant cycles and evaluation horizons. Direct impacts are often measurable within years.
      *   **Attribution Mismatch:** Systemic work is inherently **collective and cumulative**. Attributing a specific outcome (e.g., a policy change) to a single grantee or intervention is usually impossible and misrepresents how change happens. Direct work is designed for attribution.

      **Therefore, the critique claims that applying the *same* maximization framework to both types of work isn't just quantitatively inaccurate; it's *qualitatively* inappropriate. It forces complex, long-term, collective systemic processes into a model designed for discrete, short-term, attributable interventions, inevitably distorting the evaluation and undervaluing the systemic work.**

  3.  **Principled Ways Forward for an Allocator:**
      Abandoning the framework entirely isn't necessary, but *modifying how you use it and complementing it* is essential. The key is recognizing different "domains of action" requiring different evaluation approaches:

      *   **Explicitly Define Funding "Buckets" or "Portfolio Allocation":**
          *   **Bucket 1: Proven, Quantifiable Direct Interventions:** Continue using your standard CEA framework here (bednets, deworming, cash transfers with strong RCT evidence). Allocate a defined portion (e.g., 60-80%) of your budget here based on maximizing expected value within this bucket.
          *   **Bucket 2: Systemic/Political Interventions:** Allocate a defined portion (e.g., 20-40%) using *different criteria*. This is crucial. Within this bucket:
              *   **Abandon Direct Maximization:** Don't try to force these grants into a direct CEA comparison with bednets.
              *   **Focus on Theory of Change (ToC):** Rigorously assess the plausibility, coherence, and evidence base for the grantee's ToC. Is their analysis of the problem, leverage points, and strategy sound? Does it align with relevant social science?
              *   **Focus on Capacities & Positioning:** Fund organizations with deep contextual understanding, strong relationships, legitimacy within the relevant communities or systems, strategic clarity, and adaptive capacity. Are they *well-positioned* to exert influence?
              *   **Focus on Process & Proxies:** Track meaningful process indicators (e.g., coalition building, policy proposals drafted/advanced, shifts in public discourse, mobilization capacity, network growth) and plausible intermediate outcomes *within the system* (e.g., passage of specific ordinances, changes in institutional practice, measurable shifts in public opinion on a target issue) *as defined by the grantee's strategy*. Avoid forcing attribution to your grant.
              *   **Accept Higher Risk & Uncertainty:** Explicitly acknowledge that these grants carry higher risk of apparent "failure" and uncertainty about long-term impact. Frame them as essential bets on potentially high-leverage, transformative change that the other bucket cannot address.
              *   **Longer Time Horizons & Patient Capital:** Offer longer grant terms (5+ years) with flexible, core support to match the nature of the work.
              *   **Qualitative Evaluation:** Embrace qualitative methods – case studies, process tracing, key informant interviews – to understand contribution and learning, rather than seeking definitive quantitative attribution.

      *   **Strategic Field-Building within Systemic Work:** Use a portion of your systemic bucket to fund:
          *   **Research:** Supporting efforts to *develop better methodologies* for evaluating systemic change (e.g., contribution analysis, process tracing frameworks, qualitative impact assessment).
          *   **Infrastructure:** Funding intermediaries, field-scanning organizations, and networks focused on identifying and supporting high-potential systemic actors and strategies.
          *   **Learning Communities:** Facilitating learning and strategy refinement among grantees working on systemic change.
      *   **"Epistemic Humility" Parameter (Less Reliance, More Nuance):** If you *must* attempt some quantitative comparison *across* buckets:
          *   **Avoid False Precision:** Use *very* broad ranges (orders of magnitude) for systemic work, acknowledging the inherent guesswork.
          *   **Focus on "Importance, Neglectedness, Tractability" (INT) Framework:** Use INT more explicitly and qualitatively. Systemic work often scores high on "Importance" (potential for massive scale/leverage) and "Neglectedness" (funding gaps), even if "Tractability" is harder to quantify. Weigh these factors explicitly.
          *   **Apply a "Systemic Leverage Multiplier" Judiciously:** Instead of a "discount," consider a *qualitatively assessed multiplier* based on the *potential scale of leverage* (e.g., changing a national policy vs. a local one, targeting a key bottleneck). This should be based on the plausibility of the ToC and the strategic positioning, not arbitrary numbers. Use it to justify funding within the systemic bucket, not to rank against direct interventions.

  4.  **The Level of Action:**
      *   **Individual Foundation Level:** You *can* make significant changes by adopting a portfolio/bucket approach, shifting evaluation methods within buckets, funding field-building, and embracing epistemic humility. Your foundation can become a vital source of "patient capital" for systemic work.
      *   **Collective/Field Level:** The critique *requires* collective action. Your foundation can:
          *   **Advocate:** Encourage other EA funders to adopt similar portfolio approaches.
          *   **Fund Research:** Explicitly fund the development of better evaluation frameworks and knowledge infrastructure for systemic work.
          *   **Share Learning:** Document and share your experiences and lessons learned in funding systemic work within the EA community.
          *   **Support Intermediaries:** Fund organizations whose explicit mission is to bridge the gap – identifying, vetting, and supporting high-potential systemic interventions using appropriate methods.

  **Conclusion:**

  Your doubt is well-founded. Widening error bars or applying discounts within the existing maximization framework won't solve the fundamental mismatch. The institutional critique is a claim about the *incommensurability* of evaluating direct and systemic interventions using the same quantitative, attribution-focused, short-term maximization tool.

  The principled remedy lies in **strategic pluralism:** deliberately allocating resources across distinct "domains of action" (direct vs. systemic) and applying fundamentally **different evaluation frameworks suited to the nature of the work in each domain**. This involves embracing qualitative assessment, theory of change analysis, and process-focused evaluation for systemic work, while accepting higher uncertainty and focusing on leverage, positioning, and long-term potential. This *can* be done at the individual foundation level through a clear portfolio strategy, but its full realization requires collective effort to build better knowledge and methodologies for systemic change. You are not abandoning rigor; you are applying the *appropriate kind* of rigor for the task at hand.
