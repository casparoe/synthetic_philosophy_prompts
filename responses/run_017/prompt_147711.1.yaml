  First, I need to design a decision tree that separates three distinct layers: (1) Does the action cause measurable change? (2) If not, does it still create moral obligations? (3) Are there non-causal reasons to fund it? The pivotality test must guard against magical thinking - requiring actual thresholds and defensible probabilities. When time runs out, the burden of proof should fall on the proposer.

  For the beef campaign, the supermarket's 500-case threshold means individual acts are causally inert until coordinated. The email deletion case fails because data centers don't adjust capacity based on marginal storage changes - it's pure theater. The heat-pump pledge gets interesting at the threshold: at 4,999 pledges, each signer's pivotality is real but tiny; above 5,000, it becomes a coordination problem with different moral math.

  Key design challenges: Making the "non-causal benefits" assessment rigorous (not just vibes), and forcing the committee to explicitly state when they're funding expressivism rather than impact. The publishable rationales must withstand public scrutiny while masking the philosophical machinery underneath.

  The user's sarcasm about funded email deletion campaigns suggests they'll appreciate the procedure calling out such proposals. For the heat-pump case, I'll emphasize that above-threshold participation creates conditional obligations - a nuance their committee likely misses.
answer: |-
  Here's a decision procedure designed for operational clarity, philosophical rigor, and defensible public rationales. It separates the three concerns explicitly and flags when normative/value judgments are required.

  **Decision Procedure: Collective Action Evaluation Framework (CAEF)**

  1.  **Question 1: Causal Pathway & Measurability**
      *   *Question:* "Does the proposed behavior change, *by itself and without requiring coordinated action of others*, have a *measurably different* physical outcome (e.g., reduced emissions, fewer animals harmed) compared to not performing it? Precisely describe the causal chain and the smallest unit of measurable change in the relevant system."
      *   *Sufficient Answer:* Clear identification of a physical causal chain and the quantifiable threshold/resolution at which the system responds (e.g., "Supermarket orders adjust in 500-case beef units," "Grid emissions drop per MWh reduced," "Slaughterhouse reduces shifts by X animals").
      *   *Stop/No:* If no plausible causal chain to a measurable outcome is presented *or* the change required per individual is demonstrably below the system's resolution (e.g., one person's beef consumption <<< 500 cases, deleting 1GB of emails <<< data center storage adjustment unit).
      *   *Output if Stop:* **NO**. Rationale: "Proposal lacks a demonstrable causal pathway to measurable individual impact given system constraints." (Focuses on empirical claim (a) failure).
      *   *Move to Q2:* If a plausible causal chain to measurable change exists *or* if the answer hinges on contested but plausible pivotality (see Q1a).

      1a. **Pivotality Sub-Test (Triggered if Q1 answer involves "tiny chance" or tipping points)**:
          *   *Question:* "Is there a *specific, identifiable threshold* in the causal chain where behavior aggregates to cause a discontinuous change? Can you provide a *defensible estimate* of the probability that any *single* participant's action will be pivotal in crossing that threshold?"
          *   *Legitimate:* Concrete threshold (e.g., bulk-buy discount level, policy vote count, slaughterhouse shift reduction point) + probability estimate based on historical data, participant tracking, or reasonable model (e.g., "P(individual pivotal) ≈ 1/(total needed)" if sign-ups near threshold and campaign credible).
          *   *Shell Game:* Vague thresholds ("change culture," "send a signal"), probabilities pulled from thin air, thresholds too large relative to campaign scale for individual chance to be non-negligible.
          *   *45-Minute Rule:* **Proposer bears the burden of proof.** If no defensible probability/threshold mechanism provided within time, **default to NO** for Q1. Rationale: "Insufficient evidence presented to demonstrate individual pivotality mechanism or probability." (Prevents speculative pivotality from masking Q1 failure).
          *   *Output if Pass:* Proceed to Q2, noting pivotality *is* the claimed causal mechanism.
          *   *Output if Fail:* **NO**. Rationale: "Proposal relies on individual pivotality, but insufficient evidence for a specific threshold or defensible probability estimate was provided."

  2.  **Question 2: Non-Causal Benefit Test (The "Dressing Up" Filter)**
      *   *Question:* "If the answer to Q1 is 'No' (or relies solely on speculative pivotality), what *non-causal* benefits does the campaign achieve? Precisely identify the mechanism: Expressing values? Building solidarity? Fulfilling fairness/conditional obligations? Shifting identities? *Do not use causal impact language.*"
      *   *Purpose:* Explicitly forces separation of (c) from (a). Catches campaigns masking expressivism as impact.
      *   *Sufficient Answer:* Clear articulation of non-causal benefits *without* reverting to implied causal claims (e.g., "It expresses solidarity with victims," "It fulfills a perceived duty of fairness," "It builds community identity around sustainability," "It creates visible demand signaling to policymakers *without claiming individual signal causes policy change*").
      *   *Stop/No:* If proposer *cannot* articulate non-causal benefits without relying on (discredited) causal claims or vague "raising awareness" that implicitly targets future causal actions without a clear pathway. **OR** If the *only* claimed benefit is individual moral satisfaction/absolution.
      *   *Output if Stop:* **NO**. Rationale: "Proposal relies on individual causal impact which is not supported (Q1), and no sufficient alternative non-causal benefits were identified or substantiated." (Explicitly flags failure on both (a) and (c)).
      *   *Move to Q3:* If plausible non-causal benefits are clearly articulated and distinct from causal claims.

  3.  **Question 3: Normative Foundation & Foundation Scope (The Values Gate)**
      *   *Question:* "What is the *normative basis* for claiming that individuals *should* perform this action? Does this basis *depend* on the existence of individual causal impact (Q1), or does it hold *even if* Q1 fails, relying solely on the non-causal benefits (Q2)? Does this normative argument align with the foundation's mandate to fund 'individual-behaviour-change campaigns'?"
      *   *Foundation's Allowed Funding:*
          *   **YES:** Campaigns passing **Q1** (demonstrable causal impact, incl. defensible pivotality). (Empirical impact justifies obligation).
          *   **YES:** Campaigns failing Q1 but passing **Q2** (clear non-causal benefits) *if* the normative basis is **expressivism, solidarity, fairness/conditional obligations, or identity formation** *and* the committee judges this aligns with the foundation's mission.
          *   **NO:** Campaigns relying *solely* on the normative move from "no difference" (Q1 fail) to "no obligation" *without* articulating valid non-causal benefits (Q2 fail). Campaigns whose only normative argument *requires* individual causal impact (Q1) but fail Q1.
      *   *Stop/Board Call:* If the campaign passes Q2 (non-causal benefits) but the normative basis is controversial *or* significantly stretches the interpretation of "individual-behaviour-change" (e.g., purely symbolic acts with no clear link to broader change, highly sectarian identity formation). **This is a values judgment.**
      *   *Output if Stop (Fund via Q1):* **FUND**. Rationale: "Campaign demonstrates a plausible pathway for individual actions to contribute to measurable positive outcomes." (Focus on causal efficacy).
      *   *Output if Stop (Fund via Q2):* **FUND**. Rationale: "While individual causal impact is unlikely, the campaign effectively promotes [Expressivism/Solidarity/Fairness/Identity] consistent with fostering responsible citizenship on [Climate/Animal Welfare]." (Explicitly names the non-causal benefit).
      *   *Output if Board Call:* **BOARD CALL**. Rationale: "Campaign emphasizes non-causal benefits ([State Benefits]), but the normative justification requires broader consideration of foundation values and mission scope." (Flags the values conflict).

  **Systematic Misfires:**
  *   **Underestimating Coordination Costs:** Q1 might pass for a pivotality campaign, but if the coordination effort to *reach* the threshold is immense and the campaign doesn't address it, it could still fail in practice. The procedure doesn't deeply cost-effectiveness.
  *   **"Soft" Signaling:** Some non-causal benefits (e.g., demand signaling to policymakers) *might* indirectly cause change, but the mechanism is complex and hard to verify. The procedure forces a binary choice: either claim causality (and face Q1 scrutiny) or claim expressivism (Q2).
  *   **Value Bias:** The BOARD CALL relies on the committee's interpretation of the foundation's values. A different committee might judge Q2 justifications differently. The procedure exposes but doesn't eliminate this.
  *   **Over-reliance on Proposer:** If proposers are poor at articulating causal chains or non-causal benefits, even good campaigns might fail Q1 or Q2.

  ---

  **Application to Proposals:**

  **1. City-Wide Beef Reduction Campaign (Supermarket 500-Case Unit)**
  *   **Q1:** Does individual quitting cause measurable change? **No.** Supermarket adjusts in 500-case units. One person quitting beef <<< 500 cases. *No plausible causal chain to individual impact.*
  *   **Q1a (Pivotality):** Not triggered (Q1 clear No). *Default to Q1 Fail.*
  *   **Q2:** Non-Causal Benefits? Proposer might claim "expresses values," "builds movement," "signals demand." *Requires articulation.* Assume they say: "Expresses ethical commitment, builds community solidarity against factory farming."
  *   **Q3:** Normative Basis? Relies on expressivism/solidarity, *not* causal impact. Foundation allowed to fund? **YES, if committee accepts expressivism/solidarity as valid for behaviour-change mandate.**
  *   **Output:** **FUND (via Q2)** / **BOARD CALL**
      *   *Rationale (FUND):* "While individual consumption changes fall below supermarket ordering thresholds, the campaign promotes ethical expression and solidarity in reducing meat consumption, aligning with fostering responsible consumer behaviour."
      *   *Rationale (BOARD CALL):* "Campaign focuses on ethical expression and solidarity around meat reduction, but the direct link to individual behaviour change requires broader consideration of foundation priorities." (Choose based on committee's comfort with expressivism).

  **2. "Delete Old Emails & Cloud Photos" Campaign**
  *   **Q1:** Does deleting data cause measurable change? **Highly unlikely.** Data center storage/energy use adjusts on large infrastructure scales (server decommissioning, new hardware purchases). Marginal storage reductions from individual deletions are far below adjustment thresholds and are often offset by background data growth. *No plausible causal chain.*
  *   **Q1a:** Not triggered credibly (no specific threshold for deletion volume causing energy reduction). *Default to Q1 Fail.*
  *   **Q2:** Non-Causal Benefits? Proposer might claim "raises awareness of digital footprint," "promotes mindful data use," "symbolic act for sustainability." *Crucially: Does this avoid causal language?* Past funding suggests it often doesn't ("Save CO2 by deleting!").
  *   **Analysis:** If proposer *insists* on causal claims (likely, given history), Q2 fails. If they pivot to *only* non-causal (awareness, symbolism), Q2 passes.
  *   **Q3:** If Q2 Fails: **NO**. If Q2 Passes: Normative basis is awareness/symbolism. Is this sufficient for "individual-behaviour-change"? **Highly questionable.** Likely seen as trivial or ineffective (the "in-joke").
  *   **Output:** **NO** (if Q2 fails on causal claims) / **BOARD CALL** (if Q2 passes)
      *   *Rationale (NO):* "Proposal relies on individual causal impact on data center emissions, which is not supported by evidence of measurable system response at the individual level."
      *   *Rationale (BOARD CALL):* "Campaign focuses on symbolic awareness of digital footprints, but its efficacy and alignment with core individual behaviour-change goals require broader consideration." (Likely leads to NO based on history & triviality).

  **3. Heat-Pump Bulk-Buy (5,000 Pledge Threshold)**
  *   **Q1:** Does signing the pledge *by itself* cause change? **No.** The discount/launch only happens at 5,000.
  *   **Q1a (Pivotality):** **Yes.** Clear, identifiable threshold (5,000 pledges). P(individual pivotal) is highest near the threshold.
      *   *At 4,999 pledges:* P(individual pivotal) ≈ 1 (if their sign-up triggers launch). High, defensible probability.
      *   *At 5,001 pledges:* P(individual pivotal) ≈ 0. Their individual sign-up didn't tip it; the collective did. *Crucially, the campaign must credibly commit to ONLY launching at 5,000.*
      *   *Sufficient Answer:* Clear threshold, mechanism for counting/verifying, credible commitment. P(individual pivotal) quantifiable based on current count relative to 5000.
  *   **Q1a Pass:** Proceed to Q2 (though causal claim via pivotality is primary).
  *   **Q2:** Non-Causal? Secondary benefits might exist (community, expressing green values), but Q1a success makes them ancillary. Focus remains on pivotality.
  *   **Q3:** Normative basis relies *primarily* on the causal impact via pivotality (justifying obligation based on the *chance* of making a difference). Foundation explicitly funds causal mechanisms (incl. pivotality). **Allowed.**
  *   **Output:** **FUND (via Q1a)**
      *   *Rationale:* "Campaign creates a clear threshold mechanism where individual pledges have a quantifiable probability of triggering significant emissions reductions through a bulk purchase discount." (Highlights the defensible pivotality).
  *   **Note:** The procedure forces acknowledgment that the *nature* of the obligation changes based on the pledge count relative to the threshold (pivotal vs. non-pivotal). At 5,001, signing might still be supported by conditional obligations ("if others join, I should too") or fairness, but the *primary* justification (pivotality) is gone. The campaign design (only launching at 5k) keeps the focus on the threshold.
