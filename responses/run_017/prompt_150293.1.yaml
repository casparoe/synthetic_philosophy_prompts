prompt: |-
  My friend Mo did a PhD in semantics before she bailed for a data job, and for the past few weeks she's let me read her little scenarios over text and tell her which "if" sentences I think work in them — except she's the one giving the verdicts, and I've definately started writing them down because I want to figure out what rule she's actually running. I don't know any of the technical vocabulary for this stuff, so sorry if I describe it clumsily. The thing I keep noticing is that she treats the plain "if X did/didn't, then Y" sentences and the "if X had/hadn't, then Y would have" ones as different animals, and I can't tell exactly where the difference bites.

  Here's the track record so far.

  1. Camp stove, never used, dry night, igniter fine.
  - "If I had pressed the igniter, it would have lit." True.
  - "If I had pressed the igniter and the fuel line had been blocked, it wouldn't have lit." Also true.
  - "If I had pressed it, the line had been blocked, and I had primed it first, it would have lit." Also true.

  2. Same stove: "If I had pressed the igniter, it might not have lit." True. When I pointed out that this seems to clash with the first sentence in 1, she said it doesn't, because "would have" means what happens in the normal run of things, not in literally every possibility you can cook up.

  3. The lab freezer got unplugged overnight. Only Priya and Sam had keycard access that night, and the temperature log shows a steady climb from 2am, so we know for certain somebody unplugged it — just not who.
  - "If Priya didn't unplug it, Sam did." Fine, she says — true, even.
  - "If Priya hadn't unplugged it, Sam would have." No, she says, definitely not. Priya's not doing it wouldn't have made Sam do it.

  4. The freezer's temperature crossing a threshold pings the night guard's phone. Automatic, reliable, never fails.
  - "If the temperature hadn't crossed the threshold, the guard's phone wouldn't have pinged." True.
  - "If the guard's phone pinged, the temperature crossed the threshold." True — and she had no problem at all with this one running backwards, from the later thing to the thing that caused it.

  5. The new one. A greenhouse vent: purely mechanical, a wax cylinder that expands and pops the vent open once the air inside hits 30°C. No electricity, no handle, can't be forced open by hand, hasn't failed in twelve years, and the gardener has never once seen the hinge stick — though he admits it could in principle. Right now I can see from the path that the vent is standing open. The temperature logger's battery died yesterday so nobody knows how hot it actually got, but it was sunny and the gardener says it hits 30 on most sunny afternoons.

  Two sentences about it:
  - "If the vent opened, the temperature hit 30°C."
  - "If the vent hadn't opened, the temperature wouldn't have hit 30°C."

  My own guess is that she takes the first one but that the second one is a real fork: she either accepts it too, rejects it, or says it doesn't have a proper answer. What I actually want to know is what rule she's running that fits 1 through 4 — I suspect more than one rule fits those, and that they come apart on the second sentence in 5. So: what are the candidate rules, what does each one say about that sentence, which is your best guess for her and why, and what single extra scenario should I text her next week to separate the rules that survive? Please write the answer in American English, I'm forwarding it to someone in the States.
reasoning: |-
  Okay, let me tackle this step by step. The user's friend Mo has a specific way of interpreting "if" conditionals, and the user wants to figure out her underlying rules. The key is to analyze the given scenarios and identify patterns in Mo's judgments.

  First, looking at Scenario 1 with the camp stove. Mo accepts all three sentences as true. The first uses a counterfactual "had pressed... would have lit" for a scenario that didn't happen. The second adds a hypothetical obstruction but still holds. The third introduces priming as an additional factor overriding the blockage. This suggests Mo allows adding hypothetical conditions as long as they're consistent with the setup.

  In Scenario 2, Mo accepts "might not have lit" alongside the earlier "would have lit" from Scenario 1. Her explanation indicates she distinguishes between normal expectations ("would have") and possibilities ("might not"), meaning she incorporates real-world uncertainty—like potential unmentioned faults—into counterfactuals.

  Moving to Scenario 3 about the freezer unplugging. Mo accepts the indicative "If Priya didn't, Sam did" (which is logical based on access logs) but rejects the counterfactual "If Priya hadn't, Sam would have." Her reasoning is that Priya not acting wouldn't compel Sam to act, highlighting that Mo sees counterfactuals as requiring causal dependency, not just logical inference. This shows a clear split between factual and counterfactual conditionals in her system.

  Scenario 4 involves a reliable temperature-ping system. Mo accepts both the counterfactual "If temperature hadn't crossed threshold, ping wouldn't have happened" and the indicative "If ping happened, temperature crossed threshold." The latter is effectively modus ponens for a biconditional relationship. Her comfort with both directions confirms she handles necessary and sufficient conditions cleanly when causation is unambiguous.

  Now for Scenario 5—the greenhouse vent. The first sentence "If the vent opened, the temperature hit 30°C" should be straightforward for Mo since it's a direct causal relationship (vent opening necessitates 30°C). The second sentence "If the vent hadn't opened, the temperature wouldn't have hit 30°C" is trickier. Does vent failure prevent temperature rise? Realistically, no—heat could still build up even if the vent fails. But the mechanism is reliable, so would Mo consider the possibility of failure? Her past behavior suggests:  
  - She might reject it because temperature could theoretically hit 30°C without the vent opening (if it stuck).  
  - Or she might accept it by prioritizing normal operation, as in Scenario 2 ("might not" vs "would have").  

  The key difference from Scenario 4 is that the ping system was infallible, while the vent could hypothetically stick. Mo's acceptance of "might" in Scenario 2 implies she weighs possibilities, so rejection seems plausible here.  

  Candidate rules for Mo:  
  1. **Strict Causal Dependency**: Counterfactuals require actual causal links, not just inference. Explains rejection in Scenario 3.  
  2. **Normal-World Default**: Counterfactuals assume normal conditions unless stated otherwise. Explains "would have" vs "might" distinctions.  
  3. **Backtracking Inhibition**: Avoids inferring causes from effects unless backed by necessity (e.g., ping scenario works because effect strictly requires cause).  

  For the vent's second sentence, Rule 1 would reject it (no causal link from vent to temperature). Rule 2 might accept it by assuming no failure, but her openness to possibilities in Scenario 2 suggests caution. Rule 3 would reject it as improper backtracking.  

  Best guess: Mo rejects the second sentence, as temperature could rise independently.  

  To test, propose a scenario with ambiguous causation:  
  *"A reliable smoke alarm always sounds if there's a fire. Yesterday it sounded, but the fire department found no fire—just a faulty alarm. Later, we learned a small fire had actually occurred in the wall and self-extinguished."*  
  Then ask:  
  - "If the alarm hadn't sounded, there wouldn't have been a fire."  
  Her answer would clarify if she requires strict necessity (reject) or allows reliability-based inference (accept).
answer: |-
  Based on the patterns in Mo's judgments across your scenarios, she's likely applying **causal dependency rules** combined with **modal logic distinctions** (i.e., how "possible" vs. "certain" outcomes are treated). Her system prioritizes real-world causality over logical tautologies and distinguishes sharply between:  
  - **Indicative conditionals** (plain "if X did/didn’t, Y happened"): Used for *inferences* about factual or unresolved past events.  
  - **Counterfactual conditionals** ("if X had/hadn’t, Y would have"): Used for *causal simulations* of hypothetical scenarios, assuming "normal" conditions unless specified otherwise.  

  Here’s how her rules explain each verdict:  

  ### Key Rules Mo is Likely Following  
  1. **Rule 1: Indicative conditionals express logical necessity in known contexts.**  
     - Used when evidence implies a fixed outcome (e.g., freezer unplugging *must* be Priya or Sam).  
     - Example: "If Priya didn’t unplug it, Sam did" (Scenario 3) is true because the access logs constrain possibilities.  

  2. **Rule 2: Counterfactuals require *causal dependency*, not just correlation.**  
     - "If X hadn’t, Y would have" demands that X *causes* Y. If Y could happen without X, it fails.  
     - Example: "If Priya hadn’t unplugged it, Sam would have" (Scenario 3) is false because Priya’s inaction doesn’t *cause* Sam’s action.  

  3. **Rule 3: Counterfactuals assume 'normal conditions' by default.**  
     - "Would have" implies the outcome under typical circumstances, but "might have" allows exceptions (e.g., hidden faults).  
     - Example: Camp stove "would have lit" (Scenario 1) assumes no blockages, but "might not have lit" (Scenario 2) acknowledges possible failures.  

  4. **Rule 4: Backward inference (from effect to cause) is valid only if the effect *necessitates* the cause.**  
     - Example: "If the guard’s phone pinged, the temperature crossed the threshold" (Scenario 4) works because the ping *always* requires the temperature rise.  

  ---  

  ### Applying Rules to Scenario 5 (Greenhouse Vent)  
  - **Sentence 1: "If the vent opened, the temperature hit 30°C."**  
    - **Verdict prediction: TRUE.**  
    - Why? This is an **indicative conditional** (Rule 1). The vent’s mechanism *requires* 30°C to open (like Scenario 4’s ping). Evidence (open vent + reliable history) supports this inference.  

  - **Sentence 2: "If the vent hadn’t opened, the temperature wouldn’t have hit 30°C."**  
    - **Verdict prediction: FALSE.**  
    - Why? This is a **counterfactual** (Rule 2). The vent opening doesn’t *cause* the temperature to hit 30°C—it’s the *result*. If the vent stuck closed (e.g., hinge failure), heat could still build to 30°C (as the gardener admits). No causal dependency exists.  

  Mo’s rejection aligns with her freezer verdict (Scenario 3): "Priya didn’t unplug" doesn’t *cause* "Sam did," just as "vent didn’t open" doesn’t *cause* "temperature didn’t hit 30°C."  

  ---  

  ### Candidate Rules and How They Fit  
  | Rule System                          | Scenario 5 Verdict (Sentence 2) | Why It Fits Mo’s Prior Judgments                                                                 | Weakness                                                                 |  
  |--------------------------------------|----------------------------------|--------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|  
  | **Causal Dependency Only**           | FALSE                           | Explains freezer (Sc. 3) and stove (Sc. 1–2): Counterfactuals fail without direct causation.    | Doesn’t fully explain "might" vs. "would" distinctions (Sc. 2).         |  
  | **Normal-World Default (Lewis-style)** | TRUE*                           | Assumes no hinge failure unless stated; treats vent like infallible ping (Sc. 4).                | Fails on freezer (Sc. 3): Priya/Sam’s actions aren’t causal.             |  
  | **Hybrid Causal + Epistemic**        | FALSE                           | Combines causation (core) with "might" for exceptions (Sc. 2) and backward necessity (Sc. 4).   | Most consistent with all scenarios.                                      |  

  **\*Best guess for Mo: Hybrid Causal + Epistemic** (with Sentence 2 **FALSE**).  
  - **Why?**  
    1. She rejects non-causal counterfactuals (freezer Sc. 3).  
    2. She allows "might" for exceptions (stove Sc. 2) but demands certainty for "would."  
    3. She accepts backward inference *only* with necessity (ping Sc. 4), which doesn’t apply here.  

  ---  

  ### Critical Test Scenario to Confirm the Rule  
  Text Mo this next week to distinguish between the surviving candidates:  

  > **"The backup generator at the clinic kicks in automatically if the main power fails. It’s never failed in 10 years, but maintenance logs show it *could* jam. Last Tuesday, the main power failed at 3 PM. We know the generator turned on because lights stayed on.  
  > - If the main power hadn’t failed, the generator wouldn’t have turned on.  
  > - If the generator hadn’t turned on, the main power wouldn’t have failed."**  

  #### Predictions Under Each Rule:  
  - **Causal Dependency Only/Hybrid:**  
    - First sentence: **TRUE** (power failure *causes* generator activation).  
    - Second sentence: **FALSE** (generator not turning on doesn’t *cause* power to stay on; power could fail regardless).  
  - **Normal-World Default:**  
    - Both sentences: **TRUE** (assumes no generator failure, making power failure and generator activation biconditional).  

  #### Why this test works:  
  - If Mo rejects the second sentence, she’s using **causal dependency** (matching the freezer/vent logic).  
  - If she accepts both, she’s using **normal-world defaults** (like the ping system).  

  Given her history, expect her to **reject the second sentence**. This would confirm the hybrid model where counterfactuals require causation, not just correlation or reliability.  

  ---  
  **Final note:** Mo’s approach resembles **causal models** in semantics (e.g., Pearl-style counterfactuals), where "Y would have happened" requires X to be a *direct cause* of Y in a simulated scenario. Your instinct about the vent sentence being a fork is spot-on—it exposes whether she prioritizes causation over reliability. Good luck testing!
