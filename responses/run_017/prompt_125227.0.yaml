answer: |-
  The configuration lacks a single established name, but Case (1) exemplifies **Semantic Interdependence**, while Case (2) exemplifies **Constitutive Interdependence**. These are distinct phenomena sharing non-causal, non-temporal mutual dependence between levels, but differing in mechanism. 

  ### Core Shared Structure
  - **Mutual Specification Dependence**: Neither individual (micro) nor collective (macro) level can be fully specified without reference to the other. This is not causal (no temporal loop) nor mere supervenience (which is asymmetric: macro supervenes on micro).  
  - **Methodological Blind Spot**: Individualism ignores macro vocabulary embedded in micro-explanations; holism neglects micro-constitution of macro properties. Both erroneously assume unidirectional priority.  

  ### How They Differ  
  1. **Case (1): Semantic Interdependence**  
     - Dependence arises through *intentional content*: Individuals’ beliefs/actions reference collective phenomena (e.g., "the bank failing").  
     - The macro is *semantically presupposed* in micro-explanations. Without collective concepts, individual mental states lack determinate content.  
     - **Boundary**: Not circular because beliefs about macros are *constituents* of micro-states, not premises. A purely physicalist micro-specification (e.g., neural states) would lose explanatory power.  
     - **Evidence Against Unity**: If individual actions could be fully described *without* collective concepts (e.g., "I withdraw because the bank’s reserves are <X" not "…because others withdraw"), this case dissolves.  

  2. **Case (2): Constitutive Interdependence**  
     - Dependence arises through *property constitution*: The macro-property (e.g., firm-level risk-aversion) emerges from relational/organizational features of parts, not their intrinsic properties.  
     - The macro is *metaphysically irreducible*: Distributing the property to individuals is category-erroneous (like asking which neuron is "conscious").  
     - **Boundary**: Contrasts with aggregativity (e.g., total mass). Here, the whole’s property constrains part-descriptions: e.g., a "risk-averse" firm’s committee may follow identical *procedures* as a risk-neutral firm’s, but *count as* different actions due to organizational context.  
     - **Evidence Against Unity**: If the macro-property were reducible to intrinsic micro-properties (e.g., all traders becoming risk-averse), this case vanishes.  

  ### Neighboring Concepts Demarcated  
  - **Supervenience**: Asymmetric (micro → macro), while here dependence is symmetric.  
  - **Emergence**: Strong emergence implies downward causation; weak emergence allows computational irreducibility. Neither captures *semantic/constitutive entwinement*.  
  - **Microfoundations**: Demands reduction, ignoring that micro-explanations often *require* macro-vocabulary (Case 1) or that macro-properties aren’t "built from" micro-properties (Case 2).  
  - **Self-Fulfilling Prophecy**: Causal-temporal loop; here, dependence is synchronic and conceptual.  
  - **Non-Aggregativity**: Necessary but insufficient; non-aggregative properties can still lack mutual specification (e.g., chaotic systems).  

  ### Confidence Levels  
  - **High Confidence**: Cases (1) and (2) are distinct phenomena (Semantic vs. Constitutive Interdependence).  
  - **Moderate Confidence**: No established umbrella term exists. "Mutual Specification Dependence" could serve provisionally.  
  - **Lowest Confidence**: Whether Case (1) has been fully addressed in collective intentionality literature (e.g., Searle’s "we-intentions" approach individual-level content but may not resolve the interdependence).  

  ### Verdict  
  Your cases expose two distinct gaps: **Semantic Interdependence** (collective concepts as irreducible components of individual cognition) and **Constitutive Interdependence** (macro-properties as irreducibly relational). Treating them as one obscures their mechanisms. Evidence for separation: Case (1) persists even if the firm is a legal fiction; Case (2) persists even with no collective beliefs (e.g., a risk-averse algorithm).
