prompt: |-
  I'm a fourth-year PhD student in a psychology department that adopted a pre-registration requirement about two years ago, and our chair now wants the same thinking written into the dissertation guidelines as an explicit grading scheme for evidence. I sit in on a philosophy of science reading group, where we recently ran into what people call the problem of old evidence: if you already know that E, then your credence in E is 1, so conditioning on E cannot raise your credence in any hypothesis, and yet theories plainly do get confirmed by evidence everyone already had. I would like to understand what our department's actual practice presupposes about confirmation, because the parts of it seem to me to point in opposite directions, and I would rather reconstruct the implicit theory than be told that the rubric is merely sloppy.

  Here is the practice, as concretely as I can state it. The scheme has three tiers. A hypothesis written down and time-stamped before the data were collected gets the top tier. A hypothesis formulated without consulting a dataset that already exists in the lab, and then tested against it, gets the middle tier. A hypothesis read off a dataset the researcher has already looked at gets the bottom tier, is dismissed as post hoc, and counts for almost nothing — no matter how well it fits or how large the effect is. But the same department also does two things that seem to cut against this. First, it treats a successful replication as confirmatory, even though the replicating team knows the original result and deliberately designs its study around reproducing it: the hypothesis there is as post hoc as anything, and nobody minds. Second, the results our subfield actually celebrates — the ones people give keynotes about — are cases where a theory accounted for an anomaly that everyone in the field had known about for years and that the reigning theory had conspicuously failed to explain; those are treated as stronger evidence than any pre-registered prediction, not weaker. A friend in the physics department says his field is the same way: the memorable cases are known recalcitrant data being accounted for, and he keeps using the anomalous advance of Mercury's perihelion as his example. He adds that his field sometimes institutionalises the worry in the opposite direction, by doing a blind analysis: the group fixes the entire analysis pipeline using simulated data and control regions of the real data, and only afterwards looks at the region where the new effect would show up, so that nobody can be accused of having tuned anything to the answer.

  So my question is what view of confirmation this pattern of credit presupposes. Is novelty of prediction doing the real work, or is it only a proxy for something else — that the data were not available for tuning, that the theory had no spare degrees of freedom, that the evidence discriminates against a live class of rivals? Does the celebration of the known anomaly force the practice into a comparative or contrastive account, on which confirmation is a three-place relation between a hypothesis, evidence, and an alternative, rather than a boost to a hypothesis on its own? Does it also force confirmation to be indexed to an agent's epistemic situation at a time, so that whether something confirms depends on what you already knew and whether you helped yourself to the data when you built the theory? I especially want to know which parts the practice strictly presupposes, which parts merely sit well with it, and where it is underdetermined: could someone who keeps a broadly Bayesian framework and handles old evidence by some counterfactual or likelihood-ratio route endorse the rubric exactly as written, and would the blind-analysis practice look rational to them? Finally, if we replaced the implicit view with a straightforward comparative-likelihood view, what would have to change in the rubric — would the three tiers collapse into one, would the credit for explaining old anomalies survive, and would blind analysis become pointless?

  Please answer in under 700 words, and don't cite or recommend any readings.
reasoning: |-
  Okay, let me tackle this PhD student's query about confirmation theory in their psychology department's practices. They're wrestling with apparent contradictions between their pre-registration rubric and how their field actually evaluates evidence. 

  First, I need to unpack the core tension they've observed: 
  - Their department emphasizes predictive novelty (pre-registered > exploratory > post-hoc) 
  - Yet celebrates two scenarios that violate this: 
    (1) Replications (knowing the original result) 
    (2) Explaining longstanding anomalies (e.g., Mercury's perihelion)

  Hmm, the key insight here is that the rubric isn't actually about novelty per se. It's about epistemic security - preventing researchers from covertly tuning hypotheses to data. The three tiers map to decreasing confidence that the hypothesis wasn't reverse-engineered: 
  - Tier 1: Data completely inaccessible 
  - Tier 2: Data exists but unseen 
  - Tier 3: Data already consulted 

  But why then value replications and anomaly resolutions? Because they serve different epistemic functions: 
  - Replications test robustness (was the original result a fluke?) 
  - Anomaly resolutions test explanatory power (can the theory swallow tough cases?) 

  This suggests the practice presupposes a contrastive view of confirmation. When the department dismisses post-hoc fits, they're rejecting H's ability to discriminate against alternatives that could also fit the same data. But when they celebrate anomalies, they're recognizing H's ability to outperform entrenched rivals on known difficult evidence.

  For the Bayesian question: Yes, one could maintain Bayesianism while endorsing the rubric by: 
  - Using likelihood ratios (comparing H to specific alternatives) 
  - Assessing how surprising E is given background knowledge (even if E is "old") 
  - Distinguishing between discovery context vs justification context 

  The blind analysis example perfectly fits this - it's about preventing data leakage into model-building while keeping Bayesian updating.

  If switching to pure comparative likelihoods: 
  - The three tiers would collapse (only predictive success would matter) 
  - Post-hoc fits could get equal credit 
  - Anomaly resolutions would still work (as likelihood comparisons) 
  - But blind analysis would lose its rationale since tuning wouldn't be problematic

  Crucially, the current practice preserves the tier system because preventing opportunistic fitting protects against false positives better than any statistical adjustment can. The physics-style blind analysis takes this further by isolating the entire analysis from the target data.

  The student's intuition is correct - the department's implicit theory isn't sloppy, but it does rest on unstated contrastive and anti-adhocness principles. Their challenge will be making these philosophical underpinnings explicit in the dissertation guidelines.
answer: |-
  Your department's practice reflects a nuanced, pragmatically motivated view of confirmation that prioritizes epistemic security over formal Bayesian updating. Here's the implicit structure:

  1.  **The Core Concern is Ad Hocness, Not Novelty:** The tiered system primarily guards against *opportunistic hypothesis tuning*, not the temporal novelty of evidence. Pre-registration (Tier 1) and pre-data-access formulation (Tier 2) are proxies ensuring the hypothesis wasn't *constructed to fit* the specific dataset. Post-hoc hypotheses (Tier 3) are suspect because they *could* be ad hoc constructions exploiting noise.

  2.  **Replication & Anomaly Resolution Serve Different Functions:** These celebrated cases aren't exceptions but address distinct epistemic goals:
      *   **Replication:** Confirms the *robustness and reliability* of an effect against flukes or context-dependence. Knowing `E` beforehand is irrelevant; the question is whether `E` *reoccurs* under controlled repetition. It tests stability, not initial prediction novelty.
      *   **Anomaly Resolution:** Demonstrates *explanatory power and scope*. The value lies in a theory `H` *successfully encompassing* a known, problematic `E` that rivals `H_r` conspicuously failed to explain. This is inherently **contrastive confirmation** – `H` gains credence relative to `H_r` *because* it explains `E` while `H_r` does not. The anomaly `E` being "old" doesn't diminish its power to discriminate between `H` and `H_r`.

  3.  **Confirmation is Agent-Relative & Contextual:** The practice presupposes that the *process of hypothesis generation* matters for the *evidential weight assigned to a fit*. Whether `E` confirms `H` depends on the researcher's prior access to `E` during theory-building, making confirmation sensitive to the epistemic history. Blind analysis institutionalizes this by severing the link between analysis development and the target data, ensuring the analysis pipeline wasn't tuned to `E`.

  **Presuppositions vs. Compatibility:**
  *   **Strictly Presupposed:** Confirmation is contrastive (at least implicitly comparing hypotheses or requiring discriminatory power) and agent-relative (sensitive to how the hypothesis was generated relative to data access).
  *   **Compatible:** Bayesianism can be salvaged. One could:
      *   Use *likelihood ratios* comparing `H` to a relevant alternative `H_r` (explaining why anomaly resolution works).
      *   Define "confirmation" counterfactually (e.g., "How likely would `E` be if `H` were false *and* I hadn't peeked?").
      *   Treat *severe testing* (avoiding ad hocness) as a precondition for meaningful `p(E|H)`.
      *   Distinguish *discovery context* (where ad hocness matters) from *justification context* (where the logical relation matters more, e.g., replication).
      *   A Bayesian could endorse the rubric as a heuristic ensuring severe tests and reliable likelihoods, seeing blind analysis as rational for preventing biased model specification.

  **Impact of Switching to Pure Comparative Likelihood:**
  *   **Tiers Collapse:** The tier system would vanish. Credit would depend *only* on `P(E|H) / P(E|~H)` or similar, regardless of when `H` was formulated. Post-hoc hypotheses could receive full credit if they fit well.
  *   **Anomaly Resolution Survives:** Explaining known `E` could still be highly confirmatory if `P(E|H)` is high and `P(E|~H)` (or `P(E|H_r)`) is low.
  *   **Blind Analysis Becomes Pointless:** If only the final likelihood ratio matters, the *process* of avoiding data during analysis development is irrelevant. Tuning the analysis to the data wouldn't be epistemically problematic, only statistically adjustable.

  **Conclusion:** Your department's practice presupposes a contrastive, agent-relative view where epistemic security (avoiding ad hoc fitting) is paramount. Novelty of prediction is valued primarily as a guarantee against tuning. Replication tests reliability, while anomaly resolution leverages old evidence for contrastive discrimination. Bayesianism can accommodate this via likelihood ratios and severe testing principles, but a *pure* comparative likelihood view would dismantle the tier system and negate the rationale for blind analysis, focusing solely on the final evidential relationship. The rubric prioritizes trust in the *process* to ensure the *result* isn't an artifact of opportunism.
