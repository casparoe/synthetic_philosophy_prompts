  The interpretability expert seems prickly about philosophy co-opting their field. They'll challenge whether ML cases are even relevant to metaphysical debates about consciousness. 

  The user's strategy is clever - using ML cases as a parity argument to force exclusionists into an uncomfortable dilemma. But the soft spots are obvious: the disanalogies (especially the derived content point) need airtight handling, and the "abstraction" counterargument could unravel if pressed. 

  For the prep sheet, I should: 
