  ### 1. Mapping the Wager to Kelly

  In the context of LTCM, the fundamental wager is a convergence trade: betting that the spread between two closely related securities (e.g., on-the-run vs. off-the-run Treasuries, or sovereign bonds of converging European countries) will narrow. Each trade has a small edge (a few basis points) and is typically held until convergence (or until the trade is closed for other reasons). 

