      f* = (25 * μ_a) / (25² * σ_a²) = μ_a / (25 * σ_a²)

  Now, what were `μ_a` and `σ_a` for LTCM's portfolio?

  - **Expected return on assets (μ_a)**: LTCM targeted returns of about 20-25% per year on equity. Since equity was about 1/25 of assets, the return on assets would be about 20% / 25 = 0.8% per year. Similarly, 25% on equity would be 1% on assets. So let's take μ_a = 0.008 to 0.01 (0.8% to 1%).

