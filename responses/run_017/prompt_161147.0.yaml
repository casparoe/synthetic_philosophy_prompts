  ### 2. Independence Assumption

  LTCM had hundreds of trades, but they were highly correlated in the sense that they all depended on the same underlying factors: liquidity, market volatility, and the ability to hold the positions until convergence. In August and September 1998, a series of events (Russia defaulting on its debt, a flight to liquidity) caused many of these spreads to widen simultaneously, leading to massive losses.

  If we treat the entire book as a single aggregated bet, then we need the mean and variance of the entire portfolio. The Kelly criterion for a portfolio with normally distributed returns is:

      f* = μ_p / σ_p²

  where:
  - `μ_p` = expected return of the portfolio (on the bankroll)
  - `σ_p` = standard deviation of the portfolio return (on the bankroll)

  Given that the portfolio is leveraged 25:1, then the return on the bankroll is 25 times the return of the unleveraged portfolio. But note: the unleveraged portfolio is the entire set of assets. Let:

