  - **Kelly fraction for a single trade**: The Kelly criterion says to bet a fraction of your bankroll equal to (edge/odds). In this context, we must express the trade in terms of the bankroll (equity). 

    Let:
    - `b` = the net odds received on the wager (i.e., the multiple of the amount risked that you win, not including the return of the stake). 
    - `p` = probability of winning (the trade converges and the spread narrows).
    - `q = 1-p` = probability of losing (the spread widens).

    However, convergence trades are not binary. They are continuous and the loss is not limited to the amount risked in the same way as a simple bet. Moreover, the leverage complicates the risk.

    Alternatively, we can model the trade as having a normally distributed return. Suppose the trade has an expected return of μ (as a fraction of the amount invested) and a standard deviation of σ. Then the Kelly fraction for a single trade (as a fraction of the bankroll) is:

        f* = μ / σ²

    But note: the amount invested is not the bankroll. Because of leverage, the amount invested is 25 times the bankroll (if we use the 25:1 leverage). However, the Kelly fraction is relative to the bankroll. So if we have a trade that uses `L` times leverage (so that the exposure is `L * bankroll`), then the return on the bankroll is `L * r`, where `r` is the return on the asset. Then the expected return (on the bankroll) is `L * μ` and the variance (on the bankroll) is `L² * σ²`. Therefore, the Kelly fraction (for the entire bankroll) for this trade would be:

        f* = (L * μ) / (L² * σ²) = μ / (L * σ²)

    However, note that this fraction `f*` is the fraction of the bankroll to allocate to this trade. Since the trade requires an investment of `L * f` (where `f` is the fraction of bankroll allocated) to control `L * f * bankroll` in assets, we see that the Kelly formula above is for `f` (the fraction of bankroll to allocate). Therefore, the fraction `f*` = μ/(L*σ²) must be multiplied by the leverage `L` to get the total exposure as a multiple of bankroll? Actually, no: the fraction `f` is the fraction of the bankroll that is allocated to the trade. The exposure (in dollar terms) is then `f * bankroll * L`.

    Alternatively, we can think of the trade as having a return on the bankroll that is normally distributed with mean `μ_b = L * μ` and standard deviation `σ_b = L * σ`. Then the Kelly fraction for the bankroll is:

