    The issue is that the Kelly formula for continuous outcomes (like normally distributed returns) is derived for the case where the fraction bet is such that the entire bankroll is invested in a portfolio with that return distribution. But if we are using leverage, then we are effectively creating a position that has a return distribution that is a multiple of the underlying. The standard formula for a normally distributed return with mean μ and variance σ² is:

