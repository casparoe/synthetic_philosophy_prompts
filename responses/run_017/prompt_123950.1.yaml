  Here's a toast crafted for Hal Brenneman, designed to meet your constraints while honoring the occasion and the complex truths:

  ---

  Ladies and gentlemen, friends, family, colleagues... and especially Hal.

  They told me I won the lottery to be part of this Assembly. Then Hal informed me I’d won it *again* – this time to stand up here tonight. He seemed to find that particularly funny. Maybe because he knows I’m more comfortable with a briefing binder than a ballroom mic. But here I am, because Hal put me here – literally, and in a much bigger sense.

  See, six months ago, I might have stood up and talked about Hal’s incredible expertise. About that deep well of institutional memory gathered over thirty-four years. About how irreplaceable that is. But Hal, in his quiet, stubborn way, spent his last big act making a powerful argument against that very idea. He built something that fundamentally asks: What if the best ideas don’t only come from the people who’ve been in the room the longest?

  His Assembly – this strange, wonderful experiment I somehow got drafted into – rests on a radical kind of faith. Faith that ninety people, picked utterly at random, given time, information, and respect, can tackle hard problems. Faith that the necessary wisdom isn’t locked away in a few experienced heads, but is scattered, widely, among people just living their lives.

  And Hal, you had one especially controversial bit of faith. You insisted on pulling names not just from the usual voter rolls, but specifically from people who *hadn’t* voted. I stood up at a hearing and argued against that. Loudly. I thought it was a recipe for no-shows. I thought non-voters were… disengaged. I was wrong.

  Turns out, showing up – *really* showing up, binder read, questions prepped, ready to listen – well, it seems that particular virtue isn’t reserved only for people who mail in their ballot every November. Hal saw something I didn’t. He looked past the easy signals and saw people the system hadn’t claimed yet. People ready to step up when finally asked. I owe you an apology for that, Hal. And more importantly, I owe you my thanks for the lesson.

  **That’s** the remarkable thing about Hal Brenneman. He spent decades amassing the kind of power and respect that lets you get things done in this building. The kind of power most people use to, well, hold onto power. But Hal? He used that hard-earned clout, gathered over a lifetime, to do something genuinely rare. He used it to *give power away*. He used it to hand the microphone, figuratively and literally, to ninety strangers. He trusted us.

  It takes a special kind of confidence – a deep security – to do that. To believe the work will go on, perhaps even thrive, when you step back and let others, chosen not by campaigns but by chance, take a seat at the table. It’s not that expertise doesn’t matter; it’s that Hal believed, fiercely, that the capacity for wisdom is far more common than we usually acknowledge. He built a door where there wasn’t one, and invited the rest of us in.

  So tonight, Hal, we aren’t here to mourn the loss of your irreplaceable wisdom – though heaven knows, your grandkids might miss a few answers to their homework questions! We’re here to celebrate the unique kind of statesmanship it took to build that door. To celebrate the faith you showed – faith in people like me, faith in people who *weren’t* like the usual suspects, faith in the messy, surprising potential of ordinary citizens given a real job to do.

  You’ve earned your retirement, Hal. Enjoy the quiet mornings, the grandkids’ soccer games, the warm blanket of certainty that comes with knowing exactly where *your* next ballot is going. You’ve left us something powerful, something hopeful, and frankly, something a little bit chaotic – just like democracy itself.

  To Hal Brenneman: A builder of doors. A giver of microphones. A man secure enough to trust strangers. We raise our glasses to you!

  ---

  **Choices Explained:**

  1.  **The Lottery Hook:** Opens with humor about your dual "win," immediately referencing the Assembly obliquely and Hal's amusement, setting a light tone.
  2.  **The Expertise Dodge:** Directly addresses the constraint ("I might have talked about expertise... BUT") while pivoting to Hal's core principle. Uses "faith" instead of jargon.
  3.  **The Non-Voter Anecdote:** Centers your personal experience as proof of Hal's vision working and your own growth. This fulfills your need to acknowledge being wrong without making it the focus – it becomes evidence *for Hal*. Uses Hal's own phrase "people the system hadn’t claimed yet."
  4.  **Addressing the Power Paradox:** Frames it as Hal using "hard-earned clout... to *give power away*" and highlights the "special kind of confidence" and "deep security" required. This captures the irony ("only someone with 34 years could do it") without mentioning term limits, career politicians, or partisanship. "Secure enough to trust strangers" is the key positive spin.
  5.  **The Single Image:** The "Builder of Doors" and "Giver of Microphones" metaphors encapsulate the Assembly concept simply without explanation. "Hand the microphone... to ninety strangers" reinforces it.
  6.  **Affection & Humor:** Warmth throughout ("quiet, stubborn way," "strange, wonderful experiment," "enjoy the quiet mornings"). The grandkid laugh comes with the homework line and the "warm blanket of certainty" about his own ballot.
  7.  **Avoiding Pitfalls:** No mention of missing expertise, needing more like him, or detailed civics lessons. Focus stays on Hal's character and his specific, paradoxical achievement.
  8.  **Tone:** Conversational, suitable for speaking, with moments of sincerity and lightness. Respectful of Hal's nature ("not a roast guy").
