prompt: |-
  I'm on a hiring committee in a physics department right now, and I keep hearing the word "fundamental" used as if it settled an argument. It happened twice in one week. First we passed on a condensed-matter candidate — genuinely strong record, great letters — because a senior colleague said her work was "phenomenology, not fundamental physics." Then at the next meeting the same colleague argued for a string theory hire on the grounds that the Standard Model obviously isn't fundamental, since it's just an effective field theory, so there has to be something deeper underneath it. I did some philosophy as an undergrad and vaguely remember words like grounding and fundamentality, and now I can't work out what any of this presupposes.

  So: what view of fundamentality does this kind of practice actually presuppose — physics departments and funders sorting particle physics and cosmology into "fundamental" buckets while condensed matter, materials and biophysics get labelled "applied," and philosophers doing the same thing when they call their work "fundamental metaphysics" and assume mental and social facts are grounded in physical ones rather than the reverse?

  As far as I can tell the word is doing at least four different jobs in these meetings, and they come apart: (1) smallest length scale; (2) maximal generality — the theory that quantifies over everything, with no domain restrictions; (3) brute, i.e. not itself explained by anything else, the thing everything else is "nothing over and above"; (4) the level from which the rest could in principle be derived. My problem is that these don't obviously cohere, and I can't tell whether the practice needs any of them or whether it's compatible with several, or with none.

  One more wrinkle. A philosopher friend mumbled something at dinner that I half understood: that grounding might not be well-founded at all — maybe the dependence relations descend forever, or levels form a partial order with lots of incomparable peaks rather than a single tidy tower, so "the fundamental layer" fails to refer. If that's right, what happens to a hiring and funding practice that silently assumes one well-ordered tower with a bottom?

  Reconstruct the implicit theory for me, and separate the parts the practice strictly presupposes from the parts it merely sits comfortably with. Tell me whether a purely pragmatic story — prestige, expected value of information, path dependence, what's cheap to test right now — could license exactly the same behavior, in which case all the metaphysics is decoration. And be concrete about what would change if we swapped in each reading: my guess is that under the brute/unexplained reading you'd fund whatever is currently unexplained, which would move money to the measurement problem and away from new particles, and that under the derivability reading you'd have to cash out "in principle" and deal with the fact that most macroscopic phenomena seem decoupled from the microscopic details — but I want that spelled out properly, including where my own stab at a criterion (F is more fundamental than G if you have to hold F fixed to explain G but not vice versa) is circular or useless.

  Also please say something about the bit that puzzles me most: quantum foundations gets funded under the fundamental heading, despite positing no new scale and no new entities, so fundamentality there seems to mean something like maximal generality — a totally different thing again — and meanwhile nobody in these meetings means "most certain" by "fundamental," since it's usually the most speculative work that gets the label.

  Don't give me a reading list; my internet is basically dead this week. I want the argument, and I want to know which commitments are genuinely load-bearing and which are just vibes with a philosophy department stamp on them.
reasoning: |-
  Okay, the user is part of a physics hiring committee grappling with how "fundamentality" is used inconsistently in their discussions. They've observed that the term is applied differently across subfields—condensed matter gets dismissed as not fundamental, while string theory is favored for supposedly being more fundamental. They recall four possible meanings of fundamentality from their philosophy background: smallest scale, maximal generality, brute/unexplained, and derivability. Their core concern is disentangling what the practice actually requires versus what's just philosophical decoration.

  Hmm, this is fascinating because it exposes a tension between physics culture and philosophical rigor. The senior colleague's arguments reveal an unexamined hierarchy where particle physics sits atop while condensed matter gets relegated to "applied." Yet when pressed, the criteria fracture—string theory isn't smaller-scale than the Standard Model, quantum foundations isn't discovering new scales, and the "brute" criterion would prioritize unsolved problems like quantum gravity over established theories. 

  The user's suspicion about pragmatism is sharp. Prestige and funding cycles likely reinforce this hierarchy regardless of philosophical coherence. If "fundamental" just means "expensive toys" (particle colliders) or "mathematically flashy" (string theory), that explains why condensed matter—despite tackling emergence and complexity—gets sidelined. 

  Quantum foundations is the tell here. Calling it "fundamental" while denying it probes smaller scales exposes that "generality" is doing heavy lifting. But that's inconsistent! If fundamentality requires maximal generality, why isn't condensed matter (which applies across materials) considered similarly fundamental? The answer seems cultural: foundations feels "deep" while condensed matter feels "messy."

  The user's proposed criterion (F explains G but not vice versa) is clever but indeed circular—it assumes prior agreement on what counts as explanation. And if dependence isn't well-founded (as their philosopher friend hinted), the whole tower metaphor collapses. Imagine funding committees facing infinite descent ("But what explains quarks?") or disconnected domains (neurophysics vs. cosmology). Chaos! 

  Practically, I should stress that the hiring practice only strictly presupposes a crude scale-based view. The other criteria (generality, bruteness) are vibes—useful for rhetoric but discarded when inconvenient. To test this: if a condensed matter physicist discovered something brute (e.g., topological phases inexplicable from QED), would committees suddenly call it fundamental? Unlikely. The hierarchy is sticky.

  Finally, the user's quiet outrage is palpable. They see talented colleagues dismissed via shaky metaphysics. My response should validate that intuition while arming them with clear distinctions: "Here’s what your colleagues pretend to mean; here’s what they actually rely on." The power move? Ask the string theorist to define "fundamental" without using scales or circular appeals to "depth." Watch the squirming.
answer: |-
  Here's a breakdown of the implicit theory behind "fundamentality" in your hiring practice, separating core commitments from compatible extras, and what pragmatism explains:

  **The Load-Bearing Core of the Practice (What It Strictly Presupposes):**

  1.  **A Towered Ontology:** The practice fundamentally presupposes a **well-ordered, hierarchical structure to reality**, with distinct "levels." It assumes this hierarchy has a **unique bottom level**.
  2.  **Scale as Proxy:** Crucially, this bottom level is **identified with the smallest spatio-temporal scale currently accessible or theorized in high-energy physics.** Particle physics/cosmology (Standard Model, QFT, QG candidates) occupies this "fundamental" level by default. Smaller scale = more fundamental.
  3.  **Downward Explanation:** Properties, laws, and behaviors at "higher" levels (condensed matter, materials, biophysics) are **explained by** or **emerge from** the dynamics at the "fundamental" level. The direction of explanation/dependence is strictly downward.
  4.  **"Fundamental" as Foundational:** Work focused *directly* on the bottom level is deemed "fundamental physics," while work focused on higher levels, even if theoretically deep, is "applied" or "phenomenological." This labels the *subject matter*, not necessarily the *intellectual depth*.

  **How Your Colleague's Arguments Fit (and Conflict):**

  *   **Condensed Matter Rejection ("phenomenology"):** Invokes the scale-based hierarchy (CM is "higher," so not fundamental) and downward explanation (CM properties emerge from particle physics, implying CM work isn't probing the foundation).
  *   **String Theory Advocacy ("Standard Model isn't fundamental"):** Also invokes scale (String Theory aims for a smaller scale - strings/Planck scale) and the need for a deeper level to explain the SM's structure. *Conflict:* The "effective field theory" argument actually leans towards your "brute/unexplained" or "derivability" criterion, *not* scale. The SM *is* fundamental *at its scale*. His argument highlights the *provisional* nature of the current "fundamental" level but reinforces the *need* for a deeper one (the tower).

  **Compatible But Not Required Presuppositions:**

  *   **Maximal Generality:** The fundamental level *could* be maximally general (applying everywhere), but the practice doesn't strictly require this. Quantum field theory is fundamental *for its domain*, but not necessarily a "Theory of Everything." Funding focuses on the *current bottom*, not the ultimate generality.
  *   **Brute/Unexplained:** The practice *hopes* the current fundamental level is brute, but doesn't require it. The *search* for a deeper level (like string theory) explicitly assumes the current level *isn't* brute.
  *   **Derivability in Principle:** The practice *assumes* higher levels are derivable in principle from the bottom level, but it doesn't require that this derivation be feasible or practical (hence "in principle" hand-waving). Decoupling is acknowledged but seen as emergent complexity, not a challenge to the hierarchy.

  **Where the Criteria Come Apart & Cause Tension:**

  1.  **Quantum Foundations:** This exposes the tension. It gets funded as "fundamental" despite:
      *   **No New Scale:** It operates at the quantum level, the *same* scale as the SM/QFT.
      *   **Not Maximal Generality:** It focuses on specific interpretational problems (measurement) within the existing framework.
      *   **Why it fits the *practice*:** It tackles the *foundations* of the *current bottom level*. It asks "what is the most basic *description* or *ontology* at *this* scale?" It reinforces the *idea* of a fundamental layer by probing its conceptual bedrock, even if it doesn't propose a smaller scale. "Fundamental" here means "conceptually foundational for the current scale."

  2.  **Brute/Unexplained vs. Scale:** Funding based *solely* on "brute/unexplained" would indeed shift focus to the *current* deepest mysteries *at any level*. The measurement problem, dark matter, dark energy, quantum gravity would be prime targets, regardless of scale. Condensed matter phenomena like high-Tc superconductivity or topological order (currently unexplained from first principles *at the particle level*) might suddenly look "fundamental" in this sense. This clashes violently with the scale-based hierarchy.

  3.  **Derivability "In Principle":** This is the practice's Achilles' heel.
      *   **Cashing out "In Principle":** Requires specifying the derivation tools (e.g., QM + stat mech + approximations). But most macroscopic phenomena are *only* derivable with heavy approximations, coarse-graining, and emergent concepts (temperature, entropy, rigidity, etc.). The "fundamental" level details are often irrelevant or computationally inaccessible.
      *   **Decoupling:** Many phenomena are robust across vast changes at the micro-level (universality in phase transitions). This suggests the higher level has its *own* fundamental principles, challenging strict downward dependence. The practice ignores this by privileging the micro-scale derivation *whenever possible*, even if practically useless.
      *   **Your Criterion (F explains G but not vice versa):** This is insightful but runs into circularity: What counts as a valid "explanation"? The practice *assumes* micro-to-macro explanations are the valid ones. An emergentist might argue a macro-law (e.g., thermodynamics) explains micro-behavior *in context* just as validly. Your criterion risks presupposing the downward direction it seeks to define.

  **The Well-Foundedness Problem & Implications:**

  *   **If the hierarchy isn't well-founded (infinite descent, loops, multiple peaks):** The core presupposition collapses. There is no unique "fundamental" bottom level to prioritize. Funding based on "fundamentality" loses its primary justification.
  *   **What Happens to the Practice?** It becomes incoherent *on its own terms*. The entire justification for prioritizing particle physics/string theory *over* condensed matter based on "fundamentality" evaporates. Funding decisions would need explicit alternative justifications (pragmatic, intellectual interest, societal impact, etc.).

  **The Pragmatic Story (It's Mostly This):**

  A purely pragmatic account **can largely license the same behavior** without needing the metaphysical tower:

  1.  **Prestige & History:** Particle physics had monumental successes (QED, Electroweak, QCD) defining 20th-century physics. It tackled the "elementary." This built institutional momentum and prestige. "Fundamental" became synonymous with this lineage.
  2.  **Cost & Centralization:** High-energy experiments (colliders, space telescopes) are uniquely massive, expensive, and require huge centralized facilities. Funding agencies need big, distinct categories. "Fundamental Physics" is a convenient bucket for these mega-projects.
  3.  **Expected Novelty:** Probing smaller scales *has* historically yielded revolutionary surprises (new particles, forces). Funders bet on this continuing. Speculative theory (string theory) gets included as the "next frontier."
  4.  **Intellectual Culture:** A cultural preference for reductionism and "first principles" thinking permeates many physics departments. String theory, cosmology, and foundations appeal to this aesthetic ("deep," "abstract," "general").
  5.  **Defining the Discipline:** "Fundamental Physics" defines the core identity for many departments against engineering or applied science. Condensed matter, despite its depth, often straddles this line, making it vulnerable to the "applied" label.
  6.  **Path Dependence:** Once the categories and funding streams exist, they self-perpetuate.

  **What Changes Under Different Readings?**

  *   **Switch to Brute/Unexplained:** Funding shifts dramatically to the *most puzzling unsolved problems*, regardless of scale: quantum gravity foundations, measurement problem, dark matter detection (experiment *and* theory), cosmological constant problem, *and* deeply unexplained emergent phenomena (high-Tc, turbulence, consciousness?). Condensed matter and biophysics gain ground; speculative particle models without clear empirical puzzles lose out.
  *   **Switch to Maximal Generality:** Funding prioritizes frameworks with the widest applicability: quantum theory (foundations, quantum information), statistical mechanics, complex systems theory, computational physics. String theory *if* it truly becomes a TOE, but not in its current state. Particle physics becomes a *specific application* of fundamental frameworks, not the definition of them.
  *   **Switch to Derivability (Strict):** Funding focuses on *actual derivation power*: computational physics, multiscale modeling, statistical mechanics, quantum chemistry. Work that *actually bridges* levels gets prioritized. Highly abstract particle theories with no path to deriving known macro-phenomena lose status. Condensed matter theory gains immense stature.
  *   **Abandon Well-Foundedness:** Requires abandoning "fundamentality" as a primary funding criterion. Decisions shift explicitly to: intellectual interest, potential for breakthrough, societal relevance (energy, materials, computation), educational value, cost-effectiveness, diversity of approaches.

  **Conclusion:**

  Your department's practice **strictly presupposes a well-ordered, scale-based ontological hierarchy with a unique bottom level identified as particle physics/cosmology**. The other criteria (generality, brute, derivability) are **compatible vibes** used rhetorically but discarded when inconvenient (e.g., quantum foundations funding). **Pragmatic factors (prestige, cost, history, culture) are the primary drivers;** the metaphysical tower is largely a post-hoc justification that feels "deep." Quantum foundations funding highlights the cultural commitment to "foundational" questions *at the current privileged scale*, even without new scales or entities.

  **To challenge the practice effectively:** Focus on the **pragmatic incoherence** (why fund speculative strings over unexplained emergent phenomena?) and the **philosophical instability** (scale vs. brute vs. derivability). Argue that **intellectual depth and tackling profound unsolved problems exist at all scales**. Point out that the **"in principle" derivability is often practically meaningless** for complex systems. Propose funding criteria based on **scientific merit, potential impact, and intellectual challenge, explicitly decoupled from the ambiguous and culturally loaded term "fundamental".**
