  I recall philosophical theories: hedonic tone (e.g., Bentham), attitudinal (desire-based), pluralist, and primitivism. The introspection problem is key—can we really find a common feel in such varied experiences? Cases like orgasm vs. solving a math problem challenge this. Also, mixed feelings and simultaneous pleasures/pains need addressing.

  The user’s hunch about conflicting desiderata makes sense. If pleasures are too diverse, summing them becomes dubious. Cardinal scale requires homogeneity, which clashes with heterogeneity. So theories must balance these or choose one. The cardinal scaling criterion might be the most exclusionary because many theories can't provide a common metric without oversimplifying.

  For the desiderata list, each needs a justification. For example, phenomenological heterogeneity is non-negotiable because denying diverse experiences ignores data. Cardinal scaling is also non-negotiable for hedonism. But attitudinal unity might be negotiable if the theory can explain without it.

  Pain asymmetry is interesting. Pain might feel unified because it's tied to avoidance, but pleasure varies more. Does a theory need symmetric accounts? Maybe not, but it should explain why they differ.

  Sensory vs. attitudinal: Some theories collapse them, others separate. Hedonism might need a unified account, so collapsing could be necessary. Mixed feelings and disapproved pleasures challenge attitudinal theories—how can you enjoy something you disapprove of? 

  Mill's higher pleasures bring in quality differences. Is this a real factor or elitism? Including it adds complexity but might be necessary for a comprehensive theory.

  Learning and reinforcement tie into neuroscience. If a theory ignores wanting vs. liking, it might miss empirical data. But is that essential for hedonism? Maybe optional, but strengthens the theory.

  Disjunctive theories might work if they define membership conditions and explain unity. But if too disunified, cardinal scaling becomes hard. Primitivism avoids reduction but doesn't explain much, which might be unsatisfying.

  Scoring theories: Hedonic tone fails heterogeneity and mixed feelings. Attitudinal handles heterogeneity but struggles with cardinal scaling and mixed cases. Desire-based has issues with reflexivity and cardinality. Pluralist might manage heterogeneity but not scaling. Primitivism doesn’t meet explanatory demands.

  The biggest trade-off is heterogeneity vs. cardinal scaling. Hedonism needs both, but they conflict. The cardinal scaling criterion is the toughest, excluding most theories. Attitudinal theories are popular but struggle with scaling, which is a major hurdle.

  In conclusion, the user needs a clear set of criteria to frame discussions, showing why theories succeed or fail. Highlighting the conflict helps students understand debates. Emphasizing the cardinal scaling criterion as the strictest can guide evaluations. Practical takeaways for the TA: use the criteria to structure discussions, acknowledge the tension, and perhaps note that hedonism’s feasibility depends on resolving these issues.
answer: |-
  Here’s a structured desiderata list for a theory of pleasure designed to underwrite hedonism, followed by analysis of tensions and scoring of major theories. The criteria are ranked by centrality to hedonism’s project.

  ---

  ### **Desiderata for a Theory of Pleasure**  
  *(Non-negotiable for hedonism marked ★)*  

  1. **Cardinal Scalability ★**  
     *Requirement:* Must deliver a single, quantifiable dimension (degrees of "pleasure-units") for summation, comparison, and trade-offs against pain.  
     *Justification:* Hedonism requires calculating net welfare as Σ(pleasures) - Σ(pains). Without cardinality, maximization is impossible.  
     *Case:* Comparing the pleasure of finishing a marathon vs. eating chocolate.  

  2. **Phenomenological Heterogeneity**  
     *Requirement:* Must accommodate radical diversity in pleasurable experiences (e.g., orgasm vs. mathematical insight vs. thirst-quenching).  
     *Justification:* Denying heterogeneity ignores introspective reports. A theory that reduces all to "tingles" fails basic plausibility.  
     *Case:* The "introspection problem" across your examples (cold water, proof-solving, etc.).  

  3. **Valence Polarity ★**  
     *Requirement:* Must clearly distinguish pleasure from pain/unpleasure, even if they coexist.  
     *Justification:* Hedonism’s net welfare calculation collapses if pleasure/pain aren’t mutually exclusive opposites.  
     *Case:* Relief when pain stops (pleasure in cessation) vs. burning fever (unpleasure in heat).  

  4. **Motivational-Conative Link**  
     *Requirement:* Must explain pleasure’s connection to "liking," seeking behavior, and reinforcement.  
     *Justification:* If pleasure doesn’t motivate pursuit/learning, it’s unclear why it should ground welfare.  
     *Case:* "Wanting vs. liking" experiments (e.g., addicts "want" without "liking").  

  5. **Attitudinal Unity**  
     *Requirement:* Must resolve cases where phenomenology and attitude diverge (e.g., guilt-ridden pleasures).  
     *Justification:* If you disapprove of a pleasure but still "feel good," is it *welfare-enhancing*? Hedonism says yes.  
     *Case:* Enjoying gossip while morally disapproving of it.  

  6. **Quality-Neutrality ★**  
     *Requirement:* Must treat all pleasures as *commensurable* unless differences reduce to intensity/duration.  
     *Justification:* Mill’s "higher/lower" pleasures threaten hedonism’s core (if quality trumps quantity, net sum isn’t sovereign).  
     *Case:* Mill’s "dissatisfied Socrates" vs. "satisfied fool."  

  7. **Intersubjective Comparability ★**  
     *Requirement:* Must enable rough comparisons of pleasure magnitudes across persons.  
     *Justification:* Social welfare calculations (e.g., policy decisions) require interpersonal comparisons.  
     *Case:* Distributing resources to maximize aggregate pleasure.  

  8. **Explanatory Power**  
     *Requirement:* Should explain why pleasure feels unified *as a good* despite heterogeneity.  
     *Justification:* A theory that merely lists disjuncts fails to justify treating all pleasures as one "currency."  
     *Case:* Why group cold water and orgasm as "pleasure" if they share no common core?  

  ---

  ### **Key Tensions & Trade-offs**  
  - **★ Unresolvable Conflict:** **Heterogeneity (2) vs. Cardinal Scalability (1)**.  
    *Why:* Cardinal measurement assumes a homogeneous "pleasure-substance." If pleasures are phenomenologically diverse (e.g., intellectual joy vs. sensory thrills), summing them feels like adding meters to kilograms. Heterogeneity suggests *incommensurability*, undermining summation.  
  - **Secondary Tension:** **Attitudinal Unity (5) vs. Phenomenological Heterogeneity (2)**.  
    *Why:* Attitudinal theories (pleasure = "taking delight in") handle heterogeneity but struggle with guilty pleasures. Feeling-based theories handle guilt but not heterogeneity.  

  **Most Exclusionary Criterion:** **Cardinal Scalability (1)**.  
  *Why:* Eliminates theories that:  
  - Treat pleasure as primitive (no scale for measurement),  
  - Are strictly phenomenological (diverse feels resist quantification),  
  - Accept radical pluralism (no common scale across types).  

  ---

  ### **Theory Scores (1-5★) vs. Desiderata**  
  *(★ = Poor, ★★★★★ = Strong)*  

  | **Theory**               | Cardinal Scalability | Heterogeneity | Valence Polarity | Motivational Link | Attitudinal Unity | Quality-Neutrality | Comparability | Explanatory Power |  
  |--------------------------|----------------------|---------------|------------------|-------------------|-------------------|--------------------|---------------|-------------------|  
  | **Hedonic Tone** (e.g., Bentham) | ★★★☆☆ (Assumes uniform "feel" but can’t quantify diversity) | ★☆☆☆☆ (Denies diversity) | ★★★★★ (Clear feel-based divide) | ★★★★☆ (Links to "liking") | ★★☆☆☆ (Guilty pleasures problematic) | ★★★★★ (All reducible to intensity) | ★★★☆☆ (Assumes uniformity) | ★★☆☆☆ (No explanation for unity) |  
  | **Attitudinal** (e.g., Feldman) | ★★☆☆☆ (No clear scale for "degree of enjoyment") | ★★★★★ (Any experience can be enjoyed) | ★★★☆☆ (Pain as "disliking" but phenomenology ignored) | ★★☆☆☆ (Separation from desire) | ★★★★☆ (Handles guilt) | ★★★★★ (All attitudes equal) | ★★☆☆☆ (Attitudes hard to compare) | ★★★★☆ (Unified by pro-attitude) |  
  | **Desire-Fulfillment** (e.g., Heathwood) | ★☆☆☆☆ (Desires vary in strength but not pleasure-magnitude) | ★★★★☆ (Any satisfied desire counts) | ★★☆☆☆ (Unfulfilled desire isn’t pain) | ★★★★☆ (Desire drives motivation) | ★★★☆☆ (May not explain guilt) | ★★★☆☆ (Desires can be "higher/lower") | ★☆☆☆☆ (Desires incommensurable) | ★★☆☆☆ (Reduces pleasure to desire) |  
  | **Pluralist/Disjunctive** | ★☆☆☆☆ (No common scale across types) | ★★★★★ (Built-in) | ★★☆☆☆ (Ad hoc for each type) | ★★★☆☆ (Type-dependent) | ★★★☆☆ (Varies) | ★☆☆☆☆ (Implies incommensurability) | ★☆☆☆☆ (No cross-type comparison) | ★☆☆☆☆ (No unity explanation) |  
  | **Primitivism** (e.g., Sidgwick) | ★☆☆☆☆ (No internal structure to quantify) | ★★★★★ (Compatible) | ★★★★☆ (Primitive divide) | ★★★☆☆ (Assumed link) | ★★★☆☆ (Unclear) | ★★★★☆ (All primitive) | ★★☆☆☆ (Subjective reports only) | ★☆☆☆☆ (No explanation) |  

  ---

  ### **Conclusion & Practical Takeaways**  
  1. **Core Tension:** Hedonism demands **cardinal scalability**, but the **phenomenological heterogeneity** of pleasure makes this deeply problematic. This is the central roadblock in your discussions.  
  2. **Best Compromise:** **Attitudinal theories** handle heterogeneity and attitudinal conflicts best but fail at scalability and comparability—the very requirements hedonism needs.  
  3. **Teaching Strategy:** Frame the debate around whether hedonism *can* overcome the heterogeneity-scalability conflict. Ask: *Must welfare be maximizable? If yes, can pleasure deliver?*  
  4. **Primitivism’s Status:** Permitted by criteria (2)-(8) but fails (1) and comparability (7). If students accept that pleasure *can’t* be summed precisely, primitivism is viable—but hedonism collapses.  

  **Explicit Trade-off for Syllabus:** If heterogeneity is real (per introspection), then either:  
  - Hedonism is false (no summable "pleasure"), OR  
  - Hedonists must deny heterogeneity (e.g., reduce all to a common neurochemical currency), risking empirical implausibility.  

  Use this framework to force students to confront *why* hedonism needs a monolithic theory of pleasure—and whether that’s tenable.
