  Now contradictions: Beliefs vs acts in (1)-(2) isn't inconsistent if we see the standard as targeting willful wrongdoing - holding bad beliefs isn't culpable if universal, but acting on them exceptionally is. The money concern in (3) could be reframed as promise-keeping integrity. 

  For rival views, that "lease not deed" proposal implies honor requires ongoing justification - more communitarian than their current policy. The user might like it because it prevents legacy names from becoming untouchable. 

