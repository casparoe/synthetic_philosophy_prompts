answer: |-
  Your policy presupposes a **relational, contextual, and functionalist theory of commemoration**, grounded in three core principles:

  1.  **Blame as Departure from Attainable Norms:** (1) and (2) together assume that historical blameworthiness hinges on *fault* – failing to meet ethical standards *reasonably available* in one's context. It’s not that absolute wrongs (e.g., slavery) become acceptable; rather, culpability attaches to individuals who *uniquely embraced or exceeded* widespread wrongs *despite* accessible criticism. This avoids judging past actors solely by present standards ("presentism"), focusing instead on their *agency within their constraints*. Beliefs causing acts aren't inconsistent here: universally held odious beliefs aren't *blameworthy* (though their *consequences* are condemnable), but *acting* in ways contemporaries condemned *is*. The "man of his time" defense succeeds only for beliefs/acts *truly* near-universal.

  2.  **Commemoration as Intentional Speech Act:** (3) treats naming primarily as a *deliberate act* by the namer (university or donor). Renaming breaks an *agreement* (donor bequest) or retrospectively condemns the *university's own past judgment*. The steelman: It respects the integrity of contracts and institutional promises. Renaming a donor-funded honor isn't just rejecting the honoree; it repudiates the university's *own word* at the time of acceptance. Chesterton's fence applies: the "fence" (the name) exists for a specific, known reason (the deal). Removing it without the donor's consent disregards that original purpose.

  3.  **Honor as Contextual Function:** (4) makes the *current social meaning* paramount. Honor isn't inherent; it's a *performative act* requiring audience recognition. If the signifier loses its historical referent for the community, the act of honoring ceases. The name becomes inert geography, not endorsement. This directly contrasts with (3), revealing a tension: (3) prioritizes the *originator's intent*, while (4) prioritizes the *current audience's perception*.

  **Presuppositions vs. Comforts:**
  *   **Strictly Presupposes:** Blame requires fault relative to contextually available alternatives; institutional promises (like named gifts) create binding moral obligations distinct from the honoree's worthiness; commemoration is a social practice dependent on shared meaning.
  *   **Sits Comfortably With:** Moral progress (allowing retrospective judgment using *past* critiques); institutional integrity; pragmatism about historical change; a view that commemoration serves present communities.

  **Under a Rival View (Lease Model):**
  A "lease" model presupposes honor is contingent on *ongoing* justification to the *current* community, making historical intent irrelevant. Your policy would need radical change:
  *   Automatic sunset clauses override (3) and (4).
  *   (1) and (2) might become irrelevant – the *current* community's values, not historical fault, determine renewal.
  *   Focus shifts entirely to present function and values: "Does this name *currently* represent who we are/want to honor?"

  **Underdetermined Areas (Where Disagreements Hide):**
  *   **"Some contemporaries condemned" (1):** How much criticism? From whom? Does fringe dissent suffice? Does condemnation *after* the act count?
  *   **"Near-universal beliefs" (2):** What threshold? How do we measure prevalence? How to handle complex figures who held *both* progressive *and* odious views common *and* uncommon for their time?
  *   **"Knows or cares" (4):** Who defines "the community"? What if a vocal minority *does* know/care negatively? How long is "so long"?
  *   **Scope of "Deal" (3):** Does it apply only to direct donor funding, or any name chosen long ago? How binding are "deals" made under values the university now rejects?

  Your policy doesn't resolve these, leading to circular debates. It reflects a pragmatic, institutionally focused compromise balancing historical contextualism, promise-keeping, semantic drift, and the belief that only exceptional deviation from *attainable* past norms merits the active act of stripping a name. The disagreements stem from differing weights placed on intent, function, fault, and time.
