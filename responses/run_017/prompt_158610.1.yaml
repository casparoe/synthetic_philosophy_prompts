  Overall 18/20 feels right - nearly perfect but with two precise, defensible deductions. The breakdown shows exactly where points came off: -1 on (b) for slight incompleteness, -1 on (c) for Frankfurt oversight. The reactive attitudes insight earns back half a point in spirit. 

