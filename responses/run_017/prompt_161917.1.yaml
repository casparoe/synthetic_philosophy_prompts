answer: |-
  ### Short Answer  
  No established term perfectly captures your phenomenon, where a question absorbs all empirical results through legitimate re-description rather than evasion. The closest is **persistent operational ambiguity**, but this is descriptive, not a formal concept. What you've identified is a **degenerate problem**: one that lacks stable operational definitions, allowing defensible reinterpretations of any outcome.

  ### Nearest Established Notions  
  1. **Underdetermination of Theory by Data**: Scientific theories can rarely be proven uniquely true by evidence; multiple hypotheses may fit the same data. This is epistemic humility—acknowledging limits of inference. Your case resembles this but goes further: it’s not just that data *fits* multiple answers, but that the *question itself* morphs to neutralize the data.  

  2. **Vagueness/Open Texture (Philosophy of Language)**: Terms like "heap" or "bald" lack precise boundaries, making certain questions ("Is X bald?") unresolvable without stipulation. Molyneux’s "know which is which" suffers similarly: "know" and "at first sight" are vague. But your case adds a dynamic layer—each empirical test *exposes new ambiguities* rather than resolving old ones.  

  3. **Degenerating Research Programme (Lakatos)**: In philosophy of science, a degenerating programme tweaks auxiliary hypotheses to protect its core from falsification. Your phenomenon is analogous but applied to a *single question*: defenders reinterpret methods/results to preserve the question’s "undecided" status, not a core theory.  

  4. **Conceptual Engineering Issues**: When concepts (e.g., "innate," "conscious") are contested, experiments often measure proxies, inviting disputes over validity. Molyneux’s question conflates *perceptual discrimination*, *recognition*, and *conceptual understanding*—all distinct operational targets.  

  ### Where Each Falls Short  
  - **Underdetermination** focuses on theory choice, not question reformulation. Your issue is that the *operationalization* (not the theory) shifts post-hoc.  
  - **Vagueness** explains static ambiguity, not why *each empirical result* triggers new defensible re-descriptions ("low-level cue," "needs experience").  
  - **Lakatos' degeneracy** involves deliberate defense of a theory; here, the ambiguity is inherent to the question’s framing, not strategic.  
  - **Conceptual engineering** addresses messy definitions but doesn’t capture how a question *persistently absorbs disconfirmation*.  

  ### Definition and Boundary  
  **Degenerate Problem**: A question is degenerate if its resolution requires operationalizing inherently unstable or contested concepts, such that any empirical outcome can be defensibly reinterpreted as non-decisive due to:  
  - **Temporal ambiguity** (e.g., "at first sight" lacking a defined window),  
  - **Level ambiguity** (e.g., "recognition" vs. "discrimination" vs. "conceptual knowledge"),  
  - **Causal ambiguity** (e.g., attributing results to "low-level cues" vs. "high-level understanding").  

  **Clear Case**: Molyneux’s question. Any result (yes/no) is reabsorbed: immediate failure → "needs experience"; success → "learned too fast" or "used texture cues." The core concepts ("know," "sight") resist fixed operationalization.  

  **Near Miss**: "Is this person conscious?" (e.g., in vegetative states). fMRI may show brain activity, but disputes arise: "Is it *true* consciousness or reflexive processing?" This is degenerate *if* "consciousness" is operationally unstable. But with agreed markers (e.g., command-following via fMRI), it escapes degeneracy—the ambiguity resolves via stipulation.  

  ### Back to Molyneux  
  Your diagnosis implies Molyneux’s question is degenerate: it conflates **perception** (sensory discrimination), **cognition** (recognition), and **ontology** (cross-modal identity) without specifying which is tested. The "time window" issue exemplifies temporal ambiguity: a 100ms test measures sensory processing; 5 minutes allows cognitive learning. Neither answers the *philosophical* intent (are space concepts inherently multimodal?).  

  Your savings test **doesn’t escape**—it relocates the ambiguity. If handling speeds visual learning:  
  - Pro-Molyneux: "Shared representation transferred!"  
  - Anti-Molyneux: "Low-level sensorimotor priming, not conceptual recognition."  
  Savings measures *transfer efficiency*, not whether concepts were "known" visually. It sharpens the instrument but inherits the degeneracy: "What *kind* of transfer?" remains contested. The question absorbs results because its core—*what counts as "knowing" a shape*—is operationally unanchored.
