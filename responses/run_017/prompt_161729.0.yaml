  ### Battery of Cases  
  Below are concrete cases. For each, provide your verdict by choosing one or more options. *Do not reference philosophical terms; judge based on intuition and description.*  

  1. **Plain Fink**: A glass is fragile. A sorcerer watches it; if struck, she will instantly make it non-fragile before it breaks. The glass is struck. The sorcerer acts instantly, and the glass does not break.  
     - **Verdicts**:  
       - The disposition (fragility) is present just before being struck.  
       - The disposition is absent just before being struck.  
       - If struck, the manifestation (breaking) would occur.  
       - If struck, the manifestation would not occur.  

  2. **Extrinsic Mask**: A fragile glass is in a padded box. If struck inside the box, the padding prevents breaking. The glass is struck in the box and does not break.  
     - **Verdicts**:  
       - The disposition (fragility) is present while in the box.  
       - The disposition is absent while in the box.  
       - The disposition is present only if "struck" excludes being in a box.  

  3. **Intrinsic Mask**: A glass has a chemical coating that makes it shatterproof when struck, but its internal structure is unchanged. It is struck and does not break.  
     - **Verdicts**:  
       - The disposition (fragility) is present before being struck.  
       - The disposition is absent before being struck.  
       - The case is underdescribed; I need to know if the coating is part of the glass.  

  4. **Mimic**: A rubber duck (not fragile) is enchanted by a sorcerer: if struck, it will turn into glass and break. It is struck, turns into glass, and breaks.  
     - **Verdicts**:  
       - The disposition (fragility) is present before being struck.  
       - The disposition is absent before being struck.  
       - If struck, the manifestation (breaking) would occur.  
       - If struck, the manifestation would occur but not in virtue of fragility.  

  5. **Coincidence**: A fragile glass is in a box with padding (masking fragility). A hidden bomb in the box breaks the glass if struck. The glass is struck; the padding prevents fragility from causing breakage, but the bomb breaks it.  
     - **Verdicts**:  
