  I'll structure the poem around a rumor in an office block. Stanzas 1-4 will each end with the required negation lines. The fifth stanza will return to the ordinary level—rumor still spreading, people still believing—without resolving the source. The final line will be mundane and unquotable, like someone continuing their workday. 

