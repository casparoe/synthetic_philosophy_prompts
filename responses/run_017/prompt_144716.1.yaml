  hey, I need a joke for the last slide of a talk im giving on the boundary problem in democratic theory — you know, the question of who's even in the demos before anyone gets to vote on anything. The room will be full of people who actually know this stuff, so it should land with them, not be a generic "democracy is two wolves and a sheep voting on whats for dinner" bit.

  Set it up as some small concrete group facing a decision where the standard criteria actually come apart: the all-affected-interests principle says one bunch of people should have a say, the everyone-subjected-to-the-groups-coercion principle says a different bunch, and neither agrees with just "the people who live here". Or play it on the regress point — that you need a demos to decide who the demos is, so any founding rule is itself up for a vote by nobody in particular. Either way, the punchline should turn on the real content of those criteria rather than on the word "vote" or "demos" being funny on its own.

  One thing you can use if it helps: in the talk I introduce a made-up fourth criterion I call the cleanup rule — the vote belongs to whoever is stuck dealing with the consequences afterwards, not to whoever enjoys arguing about it beforehand. Ideally the joke shows it quietly collapsing back into one of the standard criteria, or kicking off its own regress.

  Please actually tell the joke, punchline written out, not describe one or explain why it would be funny. Under 150 words or so.
