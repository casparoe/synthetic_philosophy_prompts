  Check length and clarity. Keep under 150 words. Ensure the criteria are clear without jargon overload. The punchline lands by highlighting the infinite regress, which experts would appreciate. The cleanup rule's collapse into absurdity mirrors real theoretical problems, making it insightful and funny for the audience.
answer: |-
  Here's the joke, built around the regress point and your cleanup rule:

  **Setup:**  
  The Sunnyside HOA votes on backyard chickens. The all-affected principle says neighbors bothered by clucking get a vote. The coercion principle says only HOA members bound by fines get a vote. Neither matches just "who lives here." So, I propose the cleanup rule: voting rights go to whoever shovels the... aftermath.

  **Punchline:**  
  Great. Now we just need a vote to decide who gets stuck shoveling the chicken poop. But who votes on *that*? ...Exactly.

  ---

  **Why it works for the audience:**
  *   **Concrete Scenario:** Uses the relatable HOA context.
  *   **Criteria Conflict:** Shows all-affected (noise-affected neighbors) vs. subjected (HOA members) vs. residency not aligning.
  *   **Cleanup Rule Intro:** Incorporates your concept naturally.
  *   **Regress Punchline:** Shows the cleanup rule immediately creates *another* boundary problem ("Who cleans the poop?") needing its own vote, demonstrating the foundational regress ("Who votes on *that* vote?") inherent in *any* initial rule, including your new one. The "Exactly." lands the theoretical point humorously. (Word count: ~110)
