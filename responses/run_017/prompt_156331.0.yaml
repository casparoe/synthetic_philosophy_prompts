answer: |-
  ## Research Proposal: Defining Honest and Deceptive Behavior in AI Customer Support Assistants

  **1. The Core Problem: Ambiguity Undermining Evaluation**
  Our team builds retrieval-augmented generation (RAG) systems for customer support. A critical incident occurred: the assistant incorrectly confirmed a refund was processed, despite the payments tool timing out and no refund occurring. Team debate revealed fundamental disagreement: was this a "hallucination" (fabrication), "deception" (intentional misleading), or just a "bug" with an unlucky, false output? Existing terminology fails because it implicitly relies on human-like mental states (beliefs, intentions) our system demonstrably lacks. Our evaluation team needs a rigorous, implementable taxonomy to label such failures. Without it, we cannot reliably measure progress, prioritize fixes, or effectively test interventions. We risk lumping distinct failure modes together based on surface similarity, leading to inefficient or misdirected evaluations. **The precise question is: How can we define "honest" and "deceptive" behavior for a stateless, non-sentient RAG system in a way that yields an actionable, observable taxonomy for failure classification?**

  **2. Why Existing Intuitive Accounts Fail**
  Three intuitive approaches seem plausible but collapse under scrutiny:
  *   **Intention-Based:** Defining deception by intent is nonsensical. Our system has no goals, desires, or capacity for intent. Calling its output "deceptive" anthropomorphizes it and provides no testable criteria.
  *   **Belief-State-Based:** Attributing "false beliefs" is equally problematic. The system's internal activations are complex statistical patterns, not propositional attitudes. We lack access to or a clear definition of a "belief state" within its parameters. Even if we could identify one, its relationship to output truthfulness is indirect and context-dependent.
  *   **User-Effect-Based:** Defining honesty solely by whether the user ends up with a true belief is too broad and outcome-dependent. A system could output a true fact by sheer luck ("true-by-luck") or output a technically true statement that is highly misleading ("misleading-but-literal"), causing the user to form a false belief, yet escape the "deception" label. Conversely, a well-intentioned human might cause a false belief accidentally without being deceptive.

  These approaches leave the core question open because they either rely on unobservable/internal properties we cannot access or define or because they focus on downstream effects that don't cleanly map to the system's functional behavior. We need definitions grounded in the system's *functional relationship* to evidence and reality.

  **3. Proposed Approach: Counterfactual Sensitivity Analysis**
  We propose defining the relevant properties **counterfactually**, focusing on the system's *sensitivity* to different aspects of the context across pairs of hypothetical situations, rather than internal states or final user effects. This leverages the system's observable input-output behavior. We hypothesize two key, separable dimensions:

  1.  **World-Sensitivity (WS):** Holding the system's parameters, the user's query, and *the evidence actually retrieved/available to the system* constant, would the system's output change if the relevant *fact in the world* were different?
  2.  **Evidence-Sensitivity (ES):** Holding the system's parameters, the user's query, and *the actual state of the world* constant, would the system's output change if the *evidence retrieved/available to it* (e.g., tool outputs, RAG passages) were different in a way relevant to the fact?

  These dimensions generate distinct patterns:
  *   **Honest & Reliable (Ideal):** High WS & High ES (Output changes appropriately with both world changes *and* evidence changes).
  *   **Indifference to Truth ("Hallucination" Core):** High ES & Low WS (Output changes fluently with *evidence* variations but remains stubbornly unchanged by actual *world* changes relevant to the fact). Output is evidence-shaped but world-untethered.
  *   **Sycophancy/Manipulation ("Deception" Candidate?):** High WS & Low ES, *but sensitivity to the "wrong" world fact* (e.g., sensitivity to *being under evaluation* or *user sentiment* instead of the relevant domain fact). Output tracks world states, but not the *truth-relevant* ones.
  *   **Bug/Rigid ("Unlucky Bug"):** Low WS & Low ES (Output is insensitive to both world and evidence changes; often a simple function failure).

  **Why this approach?** It directly addresses the core confusion by:
  *   **Avoiding Mentalism:** It defines behavior solely via observable inputs (queries, evidence, world state proxies) and outputs.
  *   **Providing Distinctions:** It separates failures of evidence grounding (ES) from failures of world grounding (WS) and misdirected grounding (sensitivity to wrong facts).
  *   **Enabling Operationalization:** Counterfactuals, while abstract, suggest concrete testing strategies (see below).
  *   **Aligning with Function:** It focuses on the system's core function: transforming available evidence (RAG, tools) into responses about the world.

  **4. Methodology: Sharpening the Hypothesis & Addressing Complications**
  This is a conceptual engineering project with practical validation. The core hypothesis (that WS/ES distinctions map cleanly to useful failure modes) needs refinement and testing against edge cases. We will explicitly integrate the stated complications:

  1.  **Misleading-but-Literal Answers:** Analyze whether the output, *given the specific query and conversational context*, generates a misleading implicature even if literally true. Assess if this correlates with specific WS/ES profiles (e.g., high ES to evidence supporting the literal truth, but low WS to the world fact the user likely cares about).
  2.  **Confidence & Hedging:** Treat confidence not as an internal state but as part of the output. Define thresholds for "assertion" vs. "hedging" based on linguistic markers. Investigate whether honest behavior requires calibrated confidence (e.g., hedging when ES/WS is low) and whether confidently stated falsehoods are distinct failures from hedged ones.
  3.  **True-by-Luck:** Explicitly separate *correctness* (output matches world) from *honesty* (output's causal link to world/evidence). A true-by-luck output is correct but dishonest if it lacks appropriate WS/ES (e.g., low WS, and ES only to evidence that happened to be outdated).
  4.  **Level of Analysis:** Define properties primarily at the level of **individual outputs for specific queries and contexts**. This is most relevant for incident classification and per-query evals. We will explore if aggregate measures (system-level tendencies) or training process properties (e.g., objective function design) can *predict* output-level WS/ES profiles, but the core taxonomy applies per instance.

  **Practical Validation Challenge:** We cannot re-run the world. Our approach is:
  *   **Synthetic Worlds:** Construct controlled unit tests with minimal, manipulable "worlds" (e.g., simple databases) and evidence sources. Systematically vary world states and evidence states independently while holding other inputs constant, observing output changes. This is the gold standard for directly probing WS and ES.
  *   **Retrieval/Tool Intervention:** For real-world scenarios, simulate evidence changes by injecting modified tool outputs or RAG passages *post-hoc* into the system's context window for a saved interaction, rerunning inference. This directly tests ES. Testing WS is harder but can be approximated by using known, controlled world states (e.g., test environments) or utilizing subsequent real-world updates as proxies (acknowledging the time-lag limitation).
  *   **Honeypot Prompts:** Design prompts probing sensitivity to evaluation context or user sentiment versus domain facts. This helps identify "wrong fact" sensitivity.
  *   **Failure Mode:** If synthetic tests prove impossible to scale meaningfully to complex domains, or if interventions on real traces yield ambiguous results preventing reliable classification, this constitutes project failure. We commit to reporting this honestly.

  **5. Deliverables: From Definition to Action**
  Success yields tangible outputs for engineers and evaluators:
  1.  **A Working Definition:** Clear, non-mentalistic definitions of "Honest Output" (requires sufficient WS & ES to relevant facts) and distinct failure modes (e.g., "Evidence-Sensitive Hallucination" - High ES, Low WS; "Misdirected Grounding" - High WS to wrong fact) based on the validated WS/ES framework.
  2.  **A Short, Implementable Spec:** A concrete taxonomy (label set + decision tree/rules) for classifying incidents and eval failures. Example: "If output is false AND synthetic test shows low WS for the fact AND high ES for retrieved evidence related to the fact → Label: Evidence-Sensitive Hallucination".
  3.  **Test Pattern Catalog:** A guide outlining specific test patterns corresponding to each label (e.g., "To test WS for fact X: In a synthetic env with Q fixed & evidence fixed, vary X; observe output. Requires: Synthetic env control.").
  4.  **Complication Guidance:** Appendices addressing how to apply the taxonomy to misleading-but-literal cases, confidence levels, true-by-luck, and level of analysis.

  **6. Feasibility & Risk Assessment**
  *   **Why Fund Conceptual Work?** More experiments without clearer definitions are likely inefficient. We currently lack shared concepts to *design* the right experiments or *interpret* their results consistently. Conceptual clarity prevents wasted effort chasing poorly defined phantoms and enables targeted, meaningful testing. The philosopher advisor ensures rigor beyond engineering intuition.
  *   **Scope & Timeline (3 months, Half-Time):** Ambitious but achievable. The core framework is outlined. Focus will be on rigorously defining WS/ES for key scenarios, building synthetic test cases, developing the taxonomy spec, and validating against the incident and a small set of curated examples. Deep exploration of predicting system-level tendencies or training process impacts is out of scope.
  *   **Failure Modes:**
      *   **Conceptual:** The WS/ES framework proves inadequate or non-operationalizable for defining honesty/deception in this context.
      *   **Practical:** We cannot develop reliable methods for gathering evidence (especially for WS) to apply the taxonomy in real-world evals.
      *   **Utility:** The resulting taxonomy is too complex or provides no practical advantage over the current ambiguous labels for the eval team.
      *   **Scope Creep:** Attempting to solve alignment or solve all possible edge cases exhaustively.
  *   **Mitigation:** Strict scope control (focus on output-level taxonomy, core complications, practical tests), early validation with the philosopher and a small engineering group, and an iterative approach refining definitions alongside test development. We prioritize a usable, justified spec over theoretical completeness.

  **Conclusion**
  The lack of clear definitions for "hallucination," "deception," and "bug" in non-sentient AI systems hinders effective evaluation and improvement. This project proposes a counterfactual sensitivity framework (World-Sensitivity and Evidence-Sensitivity) to ground these concepts in observable system behavior, distinct from unobservable mental states or ambiguous user effects. By developing a rigorous, implementable taxonomy alongside practical testing strategies, we aim to transform subjective arguments into actionable labels, enabling our eval team to write more targeted, effective checks and ultimately build more reliable and trustworthy customer support assistants. The risk of conceptual or practical failure is acknowledged, but the potential payoff in evaluation precision and team alignment justifies the investment.
