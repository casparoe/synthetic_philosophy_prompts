prompt: |-
  I work in operations research at a hospital network, and for three years I have been the person who maintains the solver that assigns operating rooms, surgical teams, and recovery beds for the following day. The model is a mixed-integer program, NP-hard by an easy reduction, and yet branch-and-bound closes it to optimality on most nights inside a two-hour window. The failures are a recognizable minority with a particular near-tie structure in the data, and on those nights we ship a solution with a gap we cannot close. This month the same question arrived from two directions in one week. A vendor told our chief financial officer that a quantum optimization service will shortly make this class of problem exactly solvable at scale. Days earlier, one of our data scientists argued in a design review that we should stop maintaining the exact model at all, on the grounds that the problem is NP-hard and exactness is therefore a mirage. I have to answer both people, and I noticed that I do not have anything I would call a theory of what infeasible means. I have habits of speech.

  So before I answer either of them, I want the specification. Write me the desiderata that an account of computational feasibility would have to meet to be fit for my purpose: a notion good enough to guide go/no-go decisions about algorithms inside a real pipeline. Should we keep paying for exact methods, or is that money better spent on heuristics? Does a quantum service change the answer, and by how much? Is a three-percent gap a failure or a result? A notion good enough for that, not a notion good enough to prove theorems about.

  Give each requirement with the case or consideration behind it, and sort them into the ones you take to be non-negotiable and the ones that are preferences of a camp. I have started a list of things I think such an account must be able to do; tell me which of these are genuine desiderata and which are borrowed prejudices of one research tradition:

  1. Say something about the regime I actually live in, where instance size is bounded and known in advance, so an exponential procedure with a small base may beat a polynomial one with a bad exponent and a large constant forever, without the theory being able to call either infeasible.
  2. Distinguish the cost of getting an answer from the cost of getting a certified optimal one, and handle the shape of the returns we observe: the first ninety-seven percent of the gap closes in minutes and the last three percent costs a hundred times the compute.
  3. Handle amortized feasibility, where an enormous one-time cost — tuning a formulation, learning a branching policy, compiling a cut library — is repaid across nightly runs of the same instance family, so that the honest accounting is over a distribution of repeated use rather than a single call.
  4. Be usable epistemically, before I know the complexity class. In practice I never have a hardness theorem for my exact problem; I have one for a neighbor of it, or five years of failed attempts by competent people, or a vendor's assurance. The account has to say what such evidence licenses me to conclude.
  5. Be stable under reasonable changes of encoding and formulation — and here I mean something stronger than unary versus binary, since two ILP formulations of the same problem, or the same problem on trees versus on general graphs, differ by far more than a polynomial in practice — while remaining sensitive enough to instance structure to tell me why Tuesday is hard and Thursday is not.
  6. Be closed in the way working engineers rely on: if I compose feasible procedures, or reduce my problem to one I have already solved, the result should be feasible. Whatever notion you give me, I will use it as a subroutine.
  7. Not collapse the worst case, the typical case, and the adversarial case, and specifically not let a worst-case monster constructed in a hardness proof stand in for the instances a hospital generates.
  8. Grade approximation: it should be able to tell me when there is a fast procedure for a guaranteed near-optimal answer, when near-optimal is as hard as optimal, and when the hardness result is really a signal to relax the objective or remodel the world rather than to give up on solving it.
  9. Price a speedup. It should say why a quadratic improvement leaves my situation essentially unchanged while an exponential one would transform it, and it should be able to do that without depending on unresolved questions about what quantum polynomial time contains.
  10. Say something about the search for algorithms as a computational cost in its own right — automated tuning, portfolio solvers, synthesized code — and about the difference between there being an algorithm and there being one we know, including procedures that are non-uniform or per-instance in a way asymptotics ignores.

  Then do the part I care about most. My suspicion is that some subset of these cannot be had together: that a notion fine-grained enough to be empirically adequate at fixed instance sizes cannot also be robust enough to prove things with or invariant under machine model, and that closure under composition pulls against sensitivity to constants and structure. If that is right, say exactly which requirements conflict and why the conflict is real rather than a matter of taste. If I am wrong and the list is satisfiable, say so. Either way, tell me which single requirement does the most work in excluding candidate accounts, and give me a short scorecard — a few lines each — for the obvious contenders: identifying the tractable with the polynomial-time, parameterized and fixed-parameter notions, average-case and smoothed analyses, approximation-graded accounts, and purely empirical benchmarking of the kind my team already does.

  Commit to a position. Do not hand me the menu and leave me to choose: tell me which requirement you would drop or weaken, what notion survives that pruning, and what I should therefore say to the vendor and to the data scientist, with your reasons. Mark where you are stating something you know with confidence — the closure properties, what is and is not known about quantum speedups — and where you are extrapolating from how practitioners in fact behave, since I would rather have your reasoning with its seams showing than a survey.
reasoning: |-
  We are facing a practical question in operations research: how to think about computational feasibility in the context of a real-world optimization problem that is NP-hard in theory but often solvable quickly in practice. The goal is to have a notion of feasibility that guides decisions about algorithm selection and investment (e.g., quantum services, heuristics vs. exact methods). The user has provided a list of 10 requirements and wants to know which are essential and which might conflict, and then to have a clear recommendation.

  First, let's analyze the requirements and classify them as non-negotiable or preferences. Then we will identify conflicts and propose a feasible notion.

  ### Classification of Requirements

  1. **Instance Size Bounded and Known**: Non-negotiable. In practice, the problem size is fixed (e.g., number of operating rooms, surgical teams, etc.) and known in advance. Therefore, an exponential algorithm with a small base might be practical. The theory must account for this.

  2. **Cost of Answer vs. Certified Optimal**: Non-negotiable. The observation that the last few percent of the gap takes most of the time is critical for resource allocation. The account must capture the diminishing returns in closing the gap.

  3. **Amortized Feasibility**: Non-negotiable. The cost of tuning the model (e.g., formulation, branching rules) is a one-time investment that pays off over many runs. The accounting must be over a distribution of instances (from the same family) and repeated use.

  4. **Usable Epistemically (without knowing complexity class)**: Non-negotiable. We rarely have a hardness proof for the exact problem we face. We must be able to reason with partial evidence (e.g., hardness of a neighbor problem, historical attempts).

  5. **Stability under Encoding and Sensitivity to Structure**: Non-negotiable. The account must be robust to different formulations (e.g., different ILP formulations) but still sensitive enough to explain why some instances (like Tuesday's) are hard and others (Thursday's) are easy.

  6. **Closure under Composition and Reduction**: Non-negotiable. Engineers build systems by composing procedures and reducing problems. The feasibility notion should be closed under such operations.

  7. **Not Collapse Worst Case, Typical Case, Adversarial Case**: Non-negotiable. We must not let worst-case hardness (from a reduction) override the fact that our instances are non-adversarial and often easy.

  8. **Grade Approximation**: Non-negotiable. We need to know when a near-optimal solution is achievable quickly and when it is as hard as the exact solution. Also, when to relax the model.

  9. **Price a Speedup**: Non-negotiable. We must understand the impact of algorithmic improvements (quadratic vs. exponential) without relying on unresolved questions (like quantum P vs NP).

  10. **Account for Algorithm Search and Non-uniformity**: Non-negotiable. The cost of finding an algorithm (e.g., tuning, portfolios) and the existence of per-instance methods (ignored by asymptotics) must be included.

  All 10 requirements are non-negotiable for the practical context. However, we must now see if they can be satisfied simultaneously.

  ### Identifying Conflicts

  The main tension is between:

  - **Requirement 1 (fixed size) and Requirement 6 (closure under composition)**: 
    - Closure under composition is typically achieved by asymptotic notions (like polynomial time) because they are closed under composition. But at fixed sizes, we care about constants and exact running times. If we define feasibility by a threshold (e.g., runs in under 2 hours), then composing two such procedures might exceed the threshold. Therefore, closure under composition is not guaranteed in a fixed-size world.

  - **Requirement 5 (stability under encoding and sensitivity to structure) and Requirement 6 (closure)**: 
    - Stability under encoding requires that two formulations of the same problem are treated similarly. But if we are sensitive to instance structure (like Tuesday vs Thursday), then the same problem (with different data) might be feasible one day and not the next. This breaks closure because a reduction that maps an easy instance to a hard one (in a different encoding) would then make the composed procedure infeasible.

  - **Requirement 2 (cost of certification) and Requirement 8 (grading approximation)**:
    - These are complementary but must be integrated. However, if we design an account that grades approximation, we must also account for the cost of certification (which might be high even for an approximate solution with a guarantee).

  - **Requirement 10 (cost of algorithm search) and Requirement 9 (pricing a speedup)**:
    - The cost of algorithm search (e.g., tuning) is a fixed cost that must be amortized. But when pricing a speedup, we are usually comparing core algorithm runtimes. The account must combine both.

  ### The Most Conflicting Requirement

  The requirement that causes the most conflict is **Requirement 6: Closure under composition and reduction**. Why?

  - In asymptotic theory, closure is achieved by using time complexity classes (like P) that are closed under polynomial-time reductions. But at fixed sizes, we do not have such a closure. For example, if we define a procedure as feasible if it runs in time T(n) ≤ 2 hours for our n, then:
    - Composing two such procedures (each taking 1.5 hours) might take 3 hours, which is infeasible.
    - A reduction might transform an instance of size n to one of size f(n), and if f(n) is larger, then the running time on the reduced instance might exceed 2 hours even if the reduction itself is fast.

  Therefore, to have closure, we must either:

    a) Use an asymptotic notion (sacrificing fixed-size considerations), or

    b) Define feasibility in a way that is preserved under composition, which is very difficult without asymptotics.

  But Requirement 1 (fixed size) is non-negotiable. Hence, we must relax Requirement 6.

  ### Proposed Relaxation

  We relax Requirement 6 to: **The account should support composition and reduction with explicit accounting for the cost of each step and the size transformation.** 

  Instead of automatic closure, we require that the account provides the tools to compute the feasibility of a composed procedure from the feasibility of its parts and the cost of the composition. This is how engineers work: they estimate the total cost by adding the costs of the steps and accounting for any size changes.

  ### The Surviving Notion

  We propose an **amortized, instance-sensitive, fixed-parameter empirical model** that incorporates:

  - **Fixed Problem Size**: We work in the regime of known, bounded n (Requirement 1).
  - **Cost Components**: We separately account for:
    - Preprocessing (amortized over runs) (Requirement 3).
    - Solution time (for a given gap) (Requirement 2).
    - Certification cost (if any) (Requirement 2,8).
  - **Sensitivity to Instance Structure**: We use features of the instance (like the "near-tie structure") to predict running time (Requirement 5,7).
  - **Approximation and Relaxation**: We explicitly model the trade-off between solution quality (gap) and running time (Requirement 8).
  - **Speedup Pricing**: We model the impact of an algorithmic improvement by how it changes the running time at our fixed size. Exponential speedups (like from O(2^n) to O(n)) are transformative, but quadratic speedups (say, halving the runtime) are incremental (Requirement 9).
  - **Algorithm Search Cost**: We include the cost of tuning, portfolio selection, etc., as a fixed cost that must be justified by the number of runs (Requirement 10).
  - **Epistemic Use**: We use evidence from related problems and historical data to form beliefs about our problem (Requirement 4). For example, if a neighbor problem is NP-hard, we take that as evidence that ours might be too, but we also note that our instances are structured and often easy.

  ### How to Handle the Conflicts

  - **Composition (Relaxed Requirement 6)**: We do not assume closure. Instead, we require that the user explicitly computes the cost of a composed procedure. This is feasible because the problem size is fixed and the costs are measurable.

  - **Stability vs. Sensitivity (Requirement 5)**: We achieve stability by recognizing that different encodings of the same problem should have similar running times when the instance structure is similar. But we also allow that different data (even in the same encoding) can lead to different running times. We use features of the instance (like the presence of near-ties) to explain the variation.

  ### The Contenders: Scorecard

  We evaluate the common approaches:

  1. **Polynomial-Time (P) as Tractable**:
     - Pros: Closure under composition, stable under reasonable encodings.
     - Cons: Fails Requirements 1 (fixed size: constants matter), 2 (cost of certification: P may still be too slow for certification at our size), 3 (amortization: ignores setup costs), 7 (collapses worst-case and typical), 9 (does not price speedup appropriately: quadratic is good in P, but might not be enough for our n), and 10 (ignores algorithm search). Not adequate.

  2. **Parameterized Complexity (FPT)**:
     - Pros: Addresses Requirement 1 by using a parameter k (e.g., treewidth) that might be small even for large n. Can explain why some instances are easy (Requirement 5,7). 
     - Cons: Requires identifying a parameter, which may not be obvious (Requirement 4). Does not handle amortization (Requirement 3) or the cost of certification (Requirement 2) well. Closure under composition is not automatic (Requirement 6). Not directly applicable to approximation (Requirement 8). 

  3. **Average-Case and Smoothed Analysis**:
     - Pros: Addresses Requirement 7 by focusing on typical instances. Can be combined with amortization (Requirement 3). 
     - Cons: Requires a distribution over instances, which we have (nightly runs). However, it is usually asymptotic and might not account for fixed size (Requirement 1). Does not naturally handle certification cost (Requirement 2) or the cost of algorithm search (Requirement 10). Also, it may not be sensitive to the particular structure of a given instance (like Tuesday vs Thursday) without a very refined distribution.

  4. **Approximation-Graded Accounts**:
     - Pros: Directly addresses Requirement 8. Can be combined with fixed-parameter ideas (e.g., FPT approximation). 
     - Cons: Does not address the other requirements (e.g., amortization, composition) by itself.

  5. **Empirical Benchmarking**:
     - Pros: Meets Requirements 1,2,3,5,7,8,9,10 by measuring what actually happens on real data. 
     - Cons: Does not provide a theory (so Requirement 4 is hard: without a model, we cannot extrapolate to new problems or quantum). Also, composition (Requirement 6) must be done by explicit measurement.

  ### Recommendation: Hybrid Empirical Model with Theory-Guided Extrapolation

  The most practical approach is to use **empirical benchmarking** as the core, enhanced by:

  - **Fixed-Parameter Insights**: Identify parameters (like the number of near-ties) that correlate with running time. This helps meet Requirements 5 and 7.
  - **Amortized Accounting**: Track setup costs separately and amortize over the expected number of runs (Requirement 3).
  - **Approximation and Gap Trade-off**: Build a model that predicts running time as a function of the desired gap (Requirement 2,8).
  - **Speedup Pricing**: Model the running time as a function of the algorithm (e.g., T(n) = a * b^n) and then an exponential speedup (changing b to 1) reduces T(n) from exponential to polynomial, while a quadratic speedup (halving a) only reduces by a constant factor (Requirement 9). At fixed n, we can compute the actual time saved.
  - **Epistemic Use**: Use historical data and features of the problem to form beliefs. For example, if a neighbor problem is NP-hard, we expect that our problem might have hard instances, but we also know that our instances are structured. We can then test with a portfolio of benchmarks (Requirement 4).

  For Requirement 6 (composition), we do not assume closure. Instead, we require that any new procedure (composed or reduced) is benchmarked on representative instances.

  ### What to Say to the Vendor and the Data Scientist

  **To the Vendor (Quantum Optimization Service):**

  - Quantum computing might offer exponential speedups for some problems, but it is not yet clear if it will for yours. We must see:
    - How the quantum algorithm performs on instances of our size (n) and structure (e.g., with near-ties). 
    - The cost of the quantum solution (including any classical preprocessing and the quantum runtime) and whether it fits in our two-hour window.
    - The amortized cost: if the quantum service requires a large one-time setup, how many runs are needed to break even?
  - Given that our current solver usually finds optimal solutions in two hours and the gap on hard nights is small (3%), we would need a quantum solver that is faster, cheaper, and closes the gap. But note: quantum solvers today are in their infancy and often cannot handle problems of the size we have. Ask for a benchmark on our specific instances.

  **To the Data Scientist (Exact Methods vs. Heuristics):**

  - We should continue maintaining the exact model because:
    - On most nights, it closes to optimality quickly (within two hours).
    - The 3% gap on hard nights might be acceptable, but we can also use the exact model to provide bounds on the quality of any heuristic.
    - The amortized cost of maintaining the exact model (including tuning) is justified by the nightly runs and the value of optimality.
    - However, we should invest in heuristics for the hard nights: use the exact model until a time limit and then switch to a heuristic that provides a solution with a bounded gap. This hybrid approach is common.

  ### Commit to a Position

  We drop the requirement of automatic closure under composition (Requirement 6) and replace it with explicit accounting. The surviving notion is an **empirical model with theoretical guidance** that is:

  - Based on benchmarking at fixed size.
  - Enhanced by parameterized complexity to explain instance hardness.
  - With amortized accounting for setup costs.
  - And explicit modeling of the gap-time trade-off.

  This approach satisfies the other nine requirements and is practical for the hospital's operations.

  **Why this works:**

  - It uses real data (so Requirements 1,2,3,5,7,8,9,10 are met by construction).
  - For Requirement 4 (epistemic), we use historical benchmarks and analogies to form beliefs. We can run a small set of tests to extrapolate.
  - For Requirement 6 (composition), we require explicit benchmarking of composed procedures, which is feasible because the instance family is fixed and we can test.

  ### Confidences

  - **Confident Statements**: 
    - Quantum computing, as of now, does not change the picture for NP-hard problems at practical scales because current quantum hardware is limited and the speedups (if any) are problem-dependent. Also, quantum algorithms typically require problem reformulation and may have high constant factors.
    - Closure under composition is not achievable in a fixed-size setting without explicit accounting.
    - The current exact method should be retained because it works most of the time and the gap is small on hard nights.

  - **Extrapolations from Practice**:
    - The hybrid approach (exact until a time limit, then heuristic) is widely used in operations research and is recommended.
    - The vendor's claim about quantum should be met with skepticism until they provide benchmarks on our data.

  ### Final Recommendation

  - Keep the exact solver and invest in improving it (e.g., better tuning, cut generation) and in a fallback heuristic for hard nights.
  - Evaluate the quantum service by asking for a benchmark on your specific instance family and comparing the total cost (including setup and run) to your current method.
  - Reject the data scientist's argument to abandon exact methods: NP-hardness does not make exactness a mirage at your scale and with your instance structure.

  By adopting the hybrid empirical model, you can make informed decisions about algorithm selection without being misled by worst-case complexity.
answer: |-
  Below is a specification of desiderata for a notion of computational feasibility fit for your operational context, followed by conflict analysis, a scorecard of existing approaches, and a committed recommendation. The requirements are sorted into **non-negotiable** (essential for real-world decisions) and **preferences** (reflecting methodological biases). Your list is refined to remove redundancies and clarify tensions.  

  ---

  ### **Desiderata for Computational Feasibility**  
  **Non-Negotiable Requirements** (must be met to avoid costly missteps):  
  1. **Fixed-scale realism**: The account must prioritize bounded, known instance sizes (e.g., 20–50 ORs). Exponential algorithms with small bases (e.g., \(O(1.1^n)\)) should not be dismissed if they run faster than polynomial ones (e.g., \(O(n^{10})\)) at your scale.  
     - *Case*: Asymptotic theory cannot declare \(O(1.1^n)\) "infeasible" when \(n \leq 50\) and it runs in minutes, while \(O(n^{10})\) takes days. Ignoring this wastes money on "theoretically efficient" but practically slow algorithms.  

  2. **Cost of certification**: Must distinguish runtime to find a solution from runtime to prove optimality. Must model diminishing returns (e.g., 97% gap closure in minutes, last 3% costing 100× more).  
     - *Case*: Your nightly failures involve near-tie structures where bound tightening stalls. If certification is disproportionately expensive, heuristics may dominate.  

  3. **Amortized costs**: Feasibility must incorporate one-time investments (e.g., tuning formulations, learning branching policies) repaid over repeated runs of similar instances.  
     - *Case*: Your solver’s two-hour average relies on years of tuning. Ignoring amortization misprices new algorithms (e.g., quantum) that require upfront reformulation.  

  4. **Instance-structure sensitivity**: Must explain why "Tuesday" (with near-ties) is hard and "Thursday" is easy, despite identical problem size.  
     - *Case*: NP-hardness reductions often create artificial worst-case instances; your hospital’s data lacks these. Missing this leads to over-pessimism.  

  5. **Approximation grading**: Must quantify when near-optimal solutions are fast (e.g., 3% gap in seconds) and when they inherit the hardness of exact solving.  
     - *Case*: If your 3% gap is unavoidable but acceptable, "failure" becomes a result. If gaps compound (e.g., in schedules), heuristics fail.  

  6. **Speedup pricing**: Must distinguish transformative (exponential) from incremental (quadratic) speedups without relying on unproven assumptions (e.g., quantum P≠NP).  
     - *Case*: Quantum claims require concrete runtime estimates at your scale; quadratic speedups won’t resolve nightly gaps.  

  **Preference-Leaning Requirements** (useful but reflect traditions):  
  7. **Epistemic usability**: Should work with imperfect evidence (e.g., hardness of a "neighbor" problem, historical solver performance).  
     - *Preference of*: Engineers who prioritize evidence over proofs. Theorists prefer formal reductions.  

  8. **Composition support**: Should allow reasoning about composing algorithms (e.g., reduce problem A to B; solve B feasibly).  
     - *Preference of*: Software engineers; conflicts with fixed-scale realism.  

  9. **Algorithm-search costs**: Should include computational effort to find/tune algorithms (e.g., automated portfolio solvers).  
     - *Preference of*: Empirical traditions; asymptotics often ignore this.  

  10. **Encoding invariance**: Should not drastically change feasibility under "reasonable" reformulations (e.g., ILP vs. constraint programming).  
      - *Preference of*: Theory camps; your data shows formulation matters in practice.  

  ---

  ### **Conflicts Between Requirements**  
  Your intuition is correct: **no single account satisfies all requirements**. The core tension is:  
  - **Fixed-scale realism (1) and composition support (8) conflict with instance-structure sensitivity (4)**.  
    - *Why*: Composition relies on abstract reductions (e.g., "reduce OR scheduling to SAT") that ignore instance structure. In practice, such reductions often blow up problem size or create adversarial substructures, violating fixed-scale realism. For example, reducing your "near-tie" instances to SAT might generate exponentially many clauses, turning a Tuesday-like instance into a worst-case monster. Sensitivity to structure (4) demands recognizing that Tuesday is hard due to data quirks, but composition (8) assumes reductions preserve "feasibility" abstractly. This is irreconcilable: reductions optimize for theoretical generality, not your data distribution.  

  **Secondary conflicts**:  
  - **Amortized costs (3) vs. epistemic usability (7)**: Amortization assumes long-term instance stability (e.g., "similar OR networks for years"). Epistemic usability must work when stability is uncertain (e.g., hospital mergers changing instance structure).  
  - **Speedup pricing (6) vs. approximation grading (5)**: Pricing quantum speedups requires concrete runtimes, but approximation grading is quality-focused. Quantum may transform exact solving but leave approximation unchanged (or vice versa).  

  **Most exclusionary requirement**: **Fixed-scale realism (1)**. It forces a break from asymptotic theory (which ignores constants) and invalidates accounts relying solely on polynomial-time or parameterized complexity.  

  ---

  ### **Scorecard of Existing Notions**  
  | **Approach**               | **Strengths**                                  | **Weaknesses for Your Context**                     |  
  |----------------------------|-----------------------------------------------|---------------------------------------------------|  
  | **Polynomial-time (P)**    | Closure (8); encoding invariance (10).        | Fails 1,2,4,5,6: Ignores constants, certification costs, and structure. Useless at fixed scale. |  
  | **Parameterized complexity** | Addresses 1 (if parameter small, e.g., treewidth); some structure sensitivity (4). | Fails 2,3,5,6: Ignores certification costs, amortization, approximation, and quantum pricing. Parameters (e.g., "near-tie count") may be hard to isolate. |  
  | **Average-case/smoothed analysis** | Addresses 4,7 (for known distributions); may handle 3. | Fails 1,2,6: Asymptotic; ignores certification; poor at pricing speedups. Hospital data lacks clear distribution. |  
  | **Approximation-graded**   | Addresses 2,5 (explicit quality-runtime tradeoffs). | Fails 1,3,6: Ignores fixed scale, amortization, and transformative speedups. |  
  | **Empirical benchmarking** | Addresses 1,2,3,4,5,6,9 (measures what matters). | Fails 7,8,10: Poor for extrapolation (e.g., to quantum); no composition rules; encoding-sensitive. |  

  ---

  ### **Committed Recommendation**  
  **Drop composition support (8)** and weaken **encoding invariance (10)**. These are relics of theory-first approaches. In practice, you compose algorithms via empirical testing (not abstract reductions), and formulations are chosen by domain expertise, not invariance.  

  **Adopt a hybrid approach**: **Amortized empirical cost modeling** with **structure-aware forecasting**. This satisfies non-negotiables by:  
  - **Core mechanics**:  
    - Build a runtime model \( T(I, A) \) for instance \(I\) and algorithm \(A\), using historical data.  
    - Incorporate instance features (e.g., "number of near-ties," "team availability variance") to predict hardness (satisfies 1,4).  
    - Split costs: preprocessing (amortized), solution time, certification time (satisfies 2,3).  
    - Fit curves for gap-vs-runtime (e.g., "last 3% gap costs \(e^{gap^{-1}}\) time") (satisfies 5).  
    - Price speedups via empirical scaling (e.g., "quantum annealing reduces \(T(I, A)\) by \(k^n\)") (satisfies 6).  

  **Why this works**:  
  - At your scale, data beats asymptotics (1,4).  
  - Amortization and certification costs are explicit (2,3).  
  - Quantum/classical speedups are priced via extrapolation from benchmarks (6).  
  - Epistemic gaps (7) are filled by feature-based forecasting (e.g., "instances with near-ties match hardness of NP-hard neighbor problems").  

  **What to tell stakeholders**:  
  - **To the data scientist**:  
    > "NP-hardness does not make exact solving a mirage. Our bounded scale and instance structure let branch-and-bound terminate optimally 95% of nights. Abandoning exact methods wastes our amortized tuning investment and risks larger gaps. We will keep exact as the baseline and use heuristics only after a runtime cap (e.g., 1.5 hours), with the 3% gap as a fallback result—not a failure."  

  - **To the quantum vendor**:  
    > "Claims of 'exact solvability at scale' require proof on our instances. Share runtime projections for \(n=50\) ORs with near-tie structures, including preprocessing and certification. A quadratic speedup is irrelevant; we need exponential gains (e.g., \(O(1.1^n) \to O(n^2)\)). Until then, we cannot justify switching."  

  **Confidence markers**:  
  - **High confidence**: Composition (8) must be dropped (it contradicts fixed-scale realism). Quantum quadratic speedups won’t help you (known from classical complexity).  
  - **Medium confidence**: Hybrid empirical models work (extrapolated from logistics/scheduling practice). Your near-tie structures are the true bottleneck (from your description).  
  - **Low confidence**: Quantum exponential speedups for ILP (no proof; demand benchmarks).  

  This approach is grounded in how practitioners *actually* survive NP-hardness: by exploiting domain-specific bounds and data. It avoids theory traps while guiding investment.
