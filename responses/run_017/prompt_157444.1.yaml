prompt: |-
  Last night, over a very long dinner, I argued with a friend — a structural biologist — about whether DNA is really a code, and we got nowhere. She kept saying that the codon table is a mapping and mappings are codes, and that the rest is word-spinning; I kept saying that a mapping is only a code if something can go wrong relative to it, and I could not get her to say what goes wrong when a transfer RNA mischarges beyond the fact that we dislike the result. I think we were answering different questions, but I cannot yet say which.

  So what I want is not a verdict but an instrument: a taxonomy of the positions on this question, built as a tree in which every branch is labelled with the claim that separates the leaves beneath it, so that I can locate both of us in the logical space and see what we were actually disputing. The audience is a mixed reading group of philosophers and working biologists, so the register should be plain but not condescending.

  How I would like it built.

  Work from the logical space first, and only then put names on things. Start from the questions and the combinations of answers they permit, and afterwards situate the actual positions in that space, leaving the unoccupied combinations standing as empty leaves.

  Five to seven branch nodes. Each must be a claim that someone could accept or reject without knowing what any position is called. The distinctions I care about include, though you need not give each its own branch: whether informational talk in molecular biology does explanatory work that could not equally be done by talk of structure, causation and reaction propensities; whether the codon-to-amino-acid assignment is merely not chemically necessitated, or is in addition conventional, in the sense of being held in place by something agreement-like rather than by accident plus inertia; what, if anything, makes a particular assignment the correct one — an actual history of selection, the present dispositions of the translational machinery, the intentions of whoever assembled the system, or nothing beyond the fact that it is what actually happens; whether a code essentially involves a sender and a receiver with something at stake, or whether a purely mechanical reading mechanism will do; whether the notion carries any normativity at all, so that a token can be misread or misexpressed relative to something other than our descriptions, and if so what fixes correctness; and finally whether the whole question is about the terrestrial system as it happens to be or about what any possible genetic system must be like. That last one matters to me, because I suspect my friend was answering the first and I was answering the second.

  Cases the branches must be able to sort. Treat each as stipulated rather than as a claim about what anyone has actually built: a molecule assembled by chance in a prebiotic pond that is base-for-base identical to a working gene, with no history behind it whatsoever; a laboratory strain in which a codon has been reassigned wholesale to a non-standard amino acid, so that the same token now recruits something different; a single cell containing two parallel translation systems, one servicing its own chromosomes and one servicing a synthetic element with a different table, so that one and the same molecule is read two ways depending on which machinery gets to it; a hypothetical lineage in which stereochemistry forces a one-to-one codon-to-amino-acid pairing, so that nothing could be reassigned; a gene transferred into a distantly related species where it yields a misfolded, functionless product; a stretch of sequence with no downstream effect at all; an inherited methylation mark, or a prion conformation, that reliably makes a phenotypic difference; and a regulatory sequence switched on only by an environmental toxin, which raises the question whether the genome thereby says anything about the world outside the organism.

  Eight to twelve leaves. Give a name only where you are confident a label is standard; otherwise mark the leaf unnamed. Every leaf gets one sentence on its most awkward commitment. Where a combination the branches allow is unoccupied, keep it as an empty leaf and say in a line whether it is empty because incoherent, merely unattractive, or simply unexplored. One cell I particularly want you to consider, whether or not anyone occupies it, is the view that DNA is a code only relative to an interpreter who has a use for it — us, in the laboratory — so that codehood is a status we confer rather than one the molecule possesses. Where two named positions come apart nowhere in the tree, flag them as inseparable by these questions rather than manufacturing a distinction to separate them.

  Then a placement key: six or seven yes-or-no items phrased entirely as verdicts about the cases above, with no item of the form do you think DNA is a code. Show the mapping from answer patterns to leaves, and if some patterns land on no leaf, say so and say what that reveals about the tree.

  Finally, a short closing paragraph on which of these splits actually threaten ordinary molecular-biological practice and which leave the day-to-day work untouched.

  Please do not include a bibliography, a reading list or any citations, and do not attribute views to particular authors or papers: I want the distinctions themselves, not the literature around them.
reasoning: |-
  Okay, the user is asking for a logical taxonomy to map their debate with a structural biologist about whether DNA is a "code." They want a tree-structured framework with branches representing key philosophical questions, not just a verdict. The audience is mixed philosophers and biologists, so clarity without condescension is crucial.

  First, I need to identify the core tensions from their description. The user emphasizes distinctions like: explanatory role of information vs. physical causation, conventionality vs. necessity in codon assignments, sources of normativity (selection history? current machinery? human interpretation?), and scope (actual terrestrial biology vs. possible genetic systems). Their frustration centers on whether mischarging tRNA implies "error" beyond human dislike.

  The user also provides specific cases to test the taxonomy: prebiotic identical gene, lab reassignments, dual-translation cells, stereochemical determinism, etc. These must sort cleanly into the leaves. Key challenge: accommodating their meta-insight that they and their friend were answering different questions—one about actual biology, the other about necessary conditions for codes.

  I'll structure the tree around five pivotal binary splits:  
  1. **Explanatory role**: Does "code" explain anything physical causation can't? (Separates instrumentalists from realists)  
  2. **Conventionality**: Is codon assignment arbitrary (like human codes) or chemically determined?  
  3. **Normativity**: Can the system produce "errors" independent of human judgment?  
  4. **Source of correctness**: What grounds normativity—history, current state, or nothing?  
  5. **Scope**: Is this about Earth's biology or possible systems?  

  The seventh branch (intentionality) addresses whether senders/receivers are essential—a nod to the "toxin switch" case implying representation.  

  For leaves, I'll define positions like *Strong Teleosemantics* (normativity from selection history) and *Instrumentalism* (codehood as human-imposed). The lab-strain case will challenge views denying conventionality, while the prebiotic gene tests if history matters. The empty leaf where assignments are non-conventional *and* normative without history highlights a logical gap: if chemistry dictates pairings, "error" loses meaning.  

  Placement key uses case verdicts (e.g., "Does the prebiotic gene contain a code?") to avoid direct questions about DNA. Patterns landing nowhere reveal underspecified branches—e.g., if someone accepts normativity but rejects all correctness sources.  

  Finally, I'll note that only branches about normativity/threaten practice (e.g., if "misreading" isn't objective, quality control in labs loses footing). Other splits, like scope, are philosophically sharp but biologically inert. The taxonomy should crystallize their deadlock: the biologist likely takes a *Descriptivist* view (codes as mappings), while the user leans *Teleosemantic* (codes require design/error).
answer: |-
  Here is a taxonomy structured as requested, designed to map the logical space around "Is DNA a code?" based on your distinctions and cases.

  ### The Taxonomy Tree (5 Branch Nodes)
  1.  **Does 'informational' or 'coding' language provide distinct explanatory power?** (Beyond structure/causation/propensities)
      *   **No → Branch to 2**
      *   **Yes → Branch to 3**

  2.  **Is the codon-amino acid mapping merely descriptive?** (Just a useful label for observed regularities)
      *   *Leaf: **Descriptivism*** (Most awkward: Must hold that all talk of "misreading" or "error" is purely anthropomorphic, reflecting *our* goals, not a fault in the system itself.)
      *   *Leaf: **Unnamed*** (Empty - Incoherent: Claiming "No" to distinct explanation but also rejecting descriptivism implies explanatory power without distinctness.)

  3.  **Is the codon-amino acid assignment conventional?** (Arbitrary/not chemically necessitated *and* held by something agreement-like, not just accident/inertia)
      *   **No → Branch to 4**
      *   **Yes → Branch to 5**

  4.  **Is the assignment stereochemically determined?** (Chemistry forces 1:1 pairing, no reassignment possible)
      *   *Leaf: **Stereochemical Determinism*** (Most awkward: Must deny the *possibility* of functional codon reassignment, even in engineered systems like the lab strain.)
      *   *Leaf: **Unnamed*** (Empty - Unattractive/Unexplored: Assignment not conventional yet not strictly forced, relying only on accident/inertia. Denies both arbitrariness and necessity.)

  5.  **Does the system possess intrinsic normativity?** (Can tokens be "misread" or "misexpress" relative to a standard *within* the system, independent of human description/dislike?)
      *   **No → Branch to 6**
      *   **Yes → Branch to 7**

  6.  **Is codehood dependent on external interpretation?** (Requires a user/interpreter like scientists to confer meaning/function)
      *   *Leaf: **Instrumentalism*** (Most awkward: The prebiotic identical gene contains no code until discovered/used by humans; the lab reassignment isn't "wrong" intrinsically, just different relative to *our* prior assignment.)
      *   *Leaf: **Unnamed*** (Empty - Incoherent: Normativity denied, yet codehood not interpreter-dependent implies codehood exists without normativity *or* interpretation.)

  7.  **What fixes correctness?** (Source of the normative standard)
      *   **Actual History of Selection (Teleology) →** *Leaf: **Strong Teleosemantics*** (Most awkward: The prebiotic identical gene is not a code; the distantly related species' misfolded product is not an "error" if the gene wasn't selected in that context.)
      *   **Current Dispositions of Translational Machinery →** *Leaf: **Mechanistic Normativity*** (Most awkward: The lab strain reassignment is correct *by definition* within that strain; the prebiotic gene *is* a code, interpreted by the ambient chemistry.)
      *   **Nothing (Correctness = What Actually Happens) →** *Leaf: **Causal Descriptivism*** (Most awkward: There are no misreadings; a mischarged tRNA produces a different but equally "correct" outcome by definition. Denies genuine normativity.)

  ### Placement Key via Case Verdicts (Yes/No)
  Answer these based on how a proponent of a view *must* answer:

  1.  **Prebiotic Gene:** Can this identical molecule contain a genetic code? (Y/N)
  2.  **Lab Reassignment:** Is the reassigned codon now *correctly* specifying its new amino acid? (Y/N)
  3.  **Dual Systems:** Can the same DNA sequence be correctly read two different ways *simultaneously*? (Y/N)
  4.  **Stereochemical Lineage:** Is codon reassignment impossible *in principle* here? (Y/N)
  5.  **Distant Species Misfold:** Is the misfolded protein evidence of a "misreading" or "error"? (Y/N)
  6.  **No-Effect Sequence:** Can a sequence with no downstream effect be part of the genetic code? (Y/N)
  7.  **Toxin Switch:** Does the regulatory sequence "say" anything about the toxin? (Y/N)

  **Mapping Answers to Leaves:**

  | Leaf                     | 1   | 2   | 3   | 4   | 5   | 6   | 7   |
  | :----------------------- | :-- | :-- | :-- | :-- | :-- | :-- | :-- |
  | **Descriptivism**        | N   | N/A | N/A | N/A | N   | Y   | N   |
  | **Stereochemical Det.**  | Y   | N   | N   | Y   | N   | Y   | ?   |
  | **Instrumentalism**      | N   | Y   | Y   | N   | N   | Y   | Y*  |
  | **Strong Teleosemantics**| N   | Y   | N   | N   | Y   | ?   | Y   |
  | **Mechanistic Normativity**| Y  | Y   | Y   | N   | Y   | Y   | N   |
  | **Causal Descriptivism** | Y   | Y   | Y   | N   | N   | Y   | N   |

  *   **N/A:** Question not meaningfully applicable (e.g., Descriptivism denies normativity, making "correctness" inapplicable for 2,3,5).
  *   **?:** Answer depends on specific implementation/history (Teleosemantics: Only if selected *for* toxin response; Stereochemical: Only if chemistry dictates it).
  *   ***:** Instrumentalism could say yes if *we* interpret the switch as "saying" toxin.
  *   **Unmapped Patterns:** Patterns affirming normativity (Y on 5) but denying all sources of correctness (No on History, Machinery, Nothing) land on no leaf – reveals need for a plausible source of normativity beyond Branch 7 options. Patterns denying distinct explanation but affirming normativity are incoherent.

  ### Placement of Key Positions
  *   **Your Structural Biologist Friend:** Likely **Descriptivism** or **Mechanistic Normativity**. (Mapping exists; normativity might be denied or tied to current machinery; prebiotic gene is a code; reassignment is correct in its context; rejects need for sender/receiver/history).
  *   **You:** Likely **Strong Teleosemantics** or leaning towards it. (Requires distinct explanation, conventionality, normativity grounded in history; prebiotic gene isn't a code; distant species misfold is an error; sender/receiver/functional stakes implied).
  *   **"Codehood conferred by us":** **Instrumentalism**.

  ### Relevance to Practice
  *   **Threaten Practice:** Splits concerning **normativity (Branch 5)** and **source of correctness (Branch 7)** directly impact how "mutations," "errors," "fidelity," and "functional vs. non-functional" sequences are conceptualized. Denying intrinsic normativity (Descriptivism, Instrumentalism) makes quality control mechanisms purely descriptive of outcomes we dislike, not objectively error-correcting. Teleosemantics restricts "error" to historical context.
  *   **Leave Practice Untouched:** Splits concerning the **distinctness of informational explanation (Branch 1)** and **conventionality vs. necessity (Branch 3)** are largely philosophical. Biologists can map codons, engineer reassignments, and study sequence-function relationships regardless of whether they call it a "code" or see the mapping as arbitrary. The **scope (terrestrial vs. possible) distinction** also rarely intrudes on daily lab work focused on existing systems. The **presence of a sender/receiver** (implied in Branch 7 Teleosemantics) doesn't change experimental manipulation of sequences.

  This taxonomy clarifies that your core disagreement likely centered on **normativity and its source** (Branches 5 & 7), reflecting your focus on possible systems requiring error potential and her focus on terrestrial mappings describable without invoking historical function. The day-to-day work of molecular biology operates smoothly under several leaves, but conceptualizing error and function becomes contentious where normativity is disputed.
