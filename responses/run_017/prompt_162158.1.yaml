prompt: |-
  I teach a third-year seminar in philosophy and decision theory, and I am setting the final exam. I need one essay question on the St. Petersburg paradox, closed book, forty-five minutes, about eight hundred words, worth twenty marks. The difficulty I want is this: the question must be unanswerable by reciting the standard summary — infinite expectation, diminishing marginal utility, bounded utility, no real casino has infinite funds — and must instead separate students who understand where the real problem lies from students who have learned the labels. Assume students know the game and the standard moves; do not make knowledge of any named result or paper load-bearing.

  The vehicle I have in mind is a short dissolution argument that students are asked to assess, built from three moves: cap the payoffs at the house's wealth, appeal to repeated play and the long run, and impose a bounded utility function. Design the question so that each move has to be taken seriously and then shown either to fail or to relocate the puzzle rather than remove it. Specifically, the question should make a good answer do the following: derive that a payoff capped at 2^N dollars has expected payoff N + 1, so that every doubling of the house's wealth adds exactly one dollar to the ticket, and then say why a game with a top prize of 2^100 dollars being worth about a hundred dollars is itself the thing needing explanation; handle the repeated-play move by showing that the running average does not settle down — the total after n plays is of order n log n, so the recoverable fee per play drifts upward only logarithmically, which means the long-run vindication of expected-utility maximisation is unavailable here even though repetition eventually outruns any fixed fee, and at absurd cost, since vindicating a twenty-five dollar ticket this way needs on the order of 2^25 plays; note that capping works for money because a payout cannot exceed what exists, but is unavailable when the stakes are goods such as lives saved or years of welfare, where utility is plausibly unbounded and no bankroll caps anything; and show that with infinite expectations the problem is not that the theory recommends paying too much but that it becomes indeterminate, since a gamble and the same gamble improved by one dollar in every state come out equal, in violation of statewise dominance.

  An answer at the top should also separate three questions that the paradox tends to conflate — what the expected payoff is, what the gamble is worth, and whether to accept it at a given price — and should say what the bounded-utility response costs, given that it requires a saturation point beyond which no amount of the good matters and does the same work as discounting tiny probabilities of enormous payoffs elsewhere.

  Please deliver: the question itself, self-contained, with every non-derivable stipulation supplied and no appeal to readings or citations; a model answer of roughly eight hundred words that derives what it asserts; and a marking scheme of five must-hit points totalling twenty marks, with the marks for each, a one-line note on how candidates typically get each one wrong, a short list of automatic penalties for specific false claims, and a paragraph stating what distinguishes an A answer from a B answer. Add a brief note on the two places where the model answer takes a contested side and what a marker should accept instead.
reasoning: |-
  We are creating an exam question on the St. Petersburg paradox that requires deep understanding. The question will present a short dissolution argument and ask students to assess it. The dissolution argument has three moves: capping the payoffs, appealing to repeated play, and imposing bounded utility. The model answer should show why each move either fails or relocates the puzzle.

  The question must be self-contained. We will state the St. Petersburg game and the three moves of the dissolution argument.

  Question:

  "Consider the St. Petersburg game: a fair coin is tossed until it lands heads. If the first heads occurs on the k-th toss, the player wins 2^k dollars. The standard expected monetary value of this game is infinite, but intuitively, a rational person would pay only a modest amount to play. A proposed dissolution of the paradox argues as follows:

  (1) In reality, no casino has infinite wealth, so we cap the payout at the house's maximum wealth, say 2^N dollars for some large N. Then the expected value becomes finite and modest for large N.

  (2) Even with infinite expectation, in repeated play the law of large numbers will eventually justify paying any fixed finite fee per play because in the long run the average payoff will exceed the fee.

  (3) Since marginal utility diminishes, we should use expected utility instead of expected monetary value. If we set a bound on utility (e.g., utility function bounded above), then the expected utility is finite.

  Assess this dissolution. In your assessment, derive the expected monetary value when payouts are capped at 2^N dollars and show that it equals N+1. Then, explain why the capped game (even with a very high cap, such as 2^100 dollars) having an expected value of about 100 dollars is itself puzzling. For the repeated play argument, show that the total winnings after n plays are of the order of n log n, and explain why this implies that the long-run average does not settle down and why vindicating a fee of, say, 25 dollars requires an impractically large number of plays (on the order of 2^25). For the bounded utility move, explain why capping payouts is not an option when the stakes are non-monetary (like lives saved) and why having an infinite expected utility leads to a violation of statewise dominance (by considering the original gamble and the same gamble improved by one dollar in every state). Also, discuss what the bounded utility response costs in terms of requiring a saturation point and how it relates to discounting tiny probabilities of enormous payoffs.

  Finally, clarify the distinction between the expected payoff, the worth of the gamble, and the decision to accept it at a given price."

  Model Answer (approximately 800 words):

  The St. Petersburg paradox highlights a conflict between the infinite expected monetary value of a particular game and the intuition that a rational person would pay only a modest amount to play. The proposed dissolution attempts to resolve the paradox by capping the payout, appealing to repeated play, and invoking bounded utility. However, each move either fails to resolve the paradox or merely relocates it.

  First, consider capping the payout at 2^N dollars. If the first heads occurs at toss k, the payout is min(2^k, 2^N). For k ≤ N, the payout is 2^k; for k > N, it is 2^N. The probability that the first heads occurs on the k-th toss is (1/2)^k. The expected value is:

  E = Σ_{k=1}^{N} [ (1/2)^k * 2^k ] + Σ_{k=N+1}^{∞} [ (1/2)^k * 2^N ]

  The first sum is Σ_{k=1}^{N} 1 = N.

  The second sum: Σ_{k=N+1}^{∞} (1/2)^k * 2^N = 2^N * Σ_{k=N+1}^{∞} (1/2)^k.

  The series Σ_{k=N+1}^{∞} (1/2)^k is a geometric series with first term (1/2)^{N+1} and ratio 1/2. Its sum is (1/2)^{N+1} / (1 - 1/2) = (1/2)^{N+1} * 2 = (1/2)^N.

  Thus, the second sum is 2^N * (1/2)^N = 1.

  Therefore, the expected value is N + 1.

  So, for a cap at 2^100 dollars, the expected value is 101 dollars. The dissolution suggests that this finite expected value resolves the paradox. But why is a game that pays 101 dollars on average worth 101 dollars? The intuition that the game is not worth very much persists even when the cap is high. The capped game still has a structure where the vast majority of the expected value comes from extremely unlikely events. For example, the chance of winning 2^100 dollars is only 2^{-100}, which is negligible. The puzzle remains: why are we not willing to pay anywhere near 100 dollars for a game that has an expected value of 100 dollars? The capped version does not remove the paradox; it only reduces it to a finite but still counterintuitive level.

  Second, the dissolution appeals to repeated play. Suppose we play the game n times. Let X_i be the payout from the i-th game. The total winnings S_n = X_1 + ... + X_n. The expected value of each X_i is infinite, but in the capped case it is finite. However, even without capping, we can consider the behavior of S_n. The strong law of large numbers does not apply because the expectation is infinite. In fact, it can be shown that S_n grows like n log n in probability. More precisely, S_n / (n log n) converges in probability to 1. Therefore, the average winnings per play, S_n/n, grow like log n. This means that the average does not settle to a finite limit but drifts upward without bound, albeit very slowly. To justify a fee of f dollars per play, we need the average to exceed f. This requires log n > f, so n > e^f. For a fee of 25 dollars, we need n > e^25, which is about 7*10^10 (over 70 billion plays). But note: this is without a cap. With a cap at 2^N, the expected value is N+1, so to justify a fee of N+1, the law of large numbers applies (since the variance is finite) and n must be large enough for the average to be close to N+1. However, the fee we are trying to justify is per play, and the required n grows with the cap. For the uncapped game, the required number of plays to justify even a moderate fee is astronomically large. This is hardly a practical vindication. Moreover, the total investment would be n*f, and the total winnings are about n log n. For f=25, we need n about e^25, so total investment is about 25 * e^25, and winnings are about e^25 * 25 (since log n = 25). Thus, we break even only in the limit and with an enormous number of plays. The repeated play argument does not provide a justification for paying a substantial fee for a single play.

  Third, the dissolution suggests using a bounded utility function. This bounds the expected utility. However, capping the payout is feasible for money because of physical limits (casino's wealth) but not for goods without such limits. For example, if the prize is lives saved, then we cannot cap the number of lives arbitrarily. If utility is unbounded (which is plausible for some goods), then the expected utility may be infinite. Moreover, with infinite expectation, the theory becomes indeterminate. Consider two gambles: G and G', where G' pays one dollar more than G in every possible state. Then G' statewise dominates G. But if both have infinite expectation, then expected value theory values them equally (both infinite). This violates statewise dominance. The bounded utility response avoids this but at a cost. It requires that there is a saturation point beyond which more of the good adds no utility. This is implausible for many goods (like lives saved). Additionally, bounding utility effectively discounts tiny probabilities of enormous payoffs because the utility function flattens. But this is a substantive assumption that may not hold.

  Finally, it is important to separate three questions: (a) what the expected payoff is (infinite in the original game, finite in the capped game), (b) what the gamble is worth (which may be less than the expected payoff due to risk aversion or the structure of the payoffs), and (c) whether to accept the gamble at a given price (which depends on the worth and one's budget). The paradox forces us to rethink how we value gambles with extreme tail risks.

  In conclusion, the dissolution does not resolve the paradox. It shows that capping the payout makes the expectation finite but leaves the intuition that the game is overvalued by expectation. Repeated play only works in the limit with impractically many plays. Bounded utility avoids the infinite expectation but requires implausible assumptions and fails for unbounded goods. The paradox remains a challenge for decision theory.

  Marking Scheme (20 marks total):

  Must-hit points:

  1. Derivation of the expected value for the capped game (4 marks)
     - Common mistake: Failing to break the sum into two parts (k≤N and k>N) or miscalculating the geometric series.

  2. Explanation of why the capped game (even with high cap) is still puzzling (4 marks)
     - Common mistake: Simply restating that the expected value is finite without addressing why the intuition of low value persists.

  3. Analysis of repeated play: showing that the average drifts as log n and the impracticality for a fixed fee (4 marks)
     - Common mistake: Assuming the law of large numbers applies in the uncapped case or not recognizing the slow growth.

  4. Discussion of non-monetary stakes and the statewise dominance violation in the unbounded utility case (4 marks)
     - Common mistake: Not connecting the statewise dominance violation to the indeterminacy of infinite expectations.

  5. Clarification of the three questions (expected payoff, worth, decision) and the cost of bounded utility (4 marks)
     - Common mistake: Conflating the three questions or not explaining the saturation point requirement.

  Automatic penalties (deduct 1 mark for each occurrence, but do not go below zero for the question):

  - Claiming that the expected value of the capped game is 2^N or 2^{N+1} (it is N+1).
  - Misstating the growth of the total winnings (e.g., saying it is linear in n).
  - Asserting that the law of large numbers applies to the uncapped game.
  - Claiming that a bounded utility function is the only solution.

  Distinguishing an A from a B answer:

  An A answer (typically 18-20 marks) will not only hit all the must-hit points but also weave them into a coherent narrative that shows a deep understanding of why each move in the dissolution fails. It will clearly articulate the relocation of the paradox (e.g., the capped game still has an expected value that is counterintuitively high, and the repeated play argument requires an absurdly large number of plays). It will also explicitly note the violation of statewise dominance and the implausibility of saturation for non-monetary goods.

  A B answer (typically 14-17 marks) will cover the required points but may be less insightful in explaining why the dissolution fails. It might present the derivation and the facts correctly but without the same level of integration or without fully addressing the relocation of the paradox. It might also be less precise in the explanation of the statewise dominance violation or the cost of bounded utility.

  Note on contested sides in the model answer:

  1. The model answer claims that for the uncapped game, S_n grows like n log n. This is a known result (it follows from the fact that the distribution is in the domain of attraction of a stable law with index 1). However, a student might not derive this. The marker should accept an explanation that the average does not converge and grows without bound (slowly) and that the required number of plays is exponential in the fee.

  2. The model answer states that bounded utility requires a saturation point and that this is implausible for goods like lives saved. Some philosophers (e.g., Harsanyi) argue for bounded utility even for such goods. The marker should accept an answer that explains the cost in terms of requiring a saturation point, regardless of whether the student agrees with its plausibility.
answer: |-
  ### Exam Question

  **Question:**  
  The St. Petersburg game offers a payout of \(2^k\) dollars if the first heads in a series of fair coin tosses occurs on the \(k\)-th toss. The expected monetary value of this game is infinite, yet intuitively, players would only pay a small amount to play it. A proposed dissolution of this paradox makes three moves:  
  1. **Capping payouts**: Since no real casino has infinite wealth, cap the payout at \(2^N\) dollars (the house’s maximum wealth).  
  2. **Repeated play**: In repeated trials, the long-run average payoff will eventually exceed any fixed entry fee.  
  3. **Bounded utility**: Use a utility function with an upper bound (e.g., diminishing marginal utility) to ensure finite expected utility.  

  Assess this dissolution. In your response:  
  - Derive the expected monetary value when payouts are capped at \(2^N\) and show it equals \(N + 1\). Explain why a game with a cap of \(2^{100}\) (expected value ≈ $100) remains puzzling.  
  - For repeated play, show why the long-run average does *not* stabilize and why vindicating a $25 entry fee requires an impractical number of plays (≈ \(2^{25}\)).  
  - For bounded utility, explain why capping fails for non-monetary stakes (e.g., lives saved) and how infinite expectations violate statewise dominance (e.g., by comparing a gamble \(G\) and \(G\) + $1 in every state).  
  - Finally, distinguish: (a) the expected payoff, (b) the gamble’s worth, and (c) the decision to accept it at a price. Discuss what bounded utility “costs” (e.g., a saturation point for utility).  

  *Word limit: 800 words. Closed book. Time: 45 minutes.*  

  ---

  ### Model Answer (Approx. 800 words)  

  The St. Petersburg paradox reveals a tension between infinite expected monetary value and the intuition that rational agents pay little to play the game. The proposed dissolution—capping payouts, appealing to repeated play, and bounding utility—fails to resolve the paradox. Each move either relocates the problem or introduces new difficulties.  

  **1. Capping Payouts**:  
  Capping payouts at \(2^N\) dollars truncates the game. The payout is \(2^k\) for \(k \leq N\) and \(2^N\) for \(k > N\). The expected value is:  
  \[
  E = \sum_{k=1}^N \left( \frac{1}{2^k} \cdot 2^k \right) + \sum_{k=N+1}^{\infty} \left( \frac{1}{2^k} \cdot 2^N \right) = \sum_{k=1}^N 1 + \sum_{k=N+1}^{\infty} 2^N \cdot \frac{1}{2^k}.
  \]  
  The first sum is \(N\). The second is a geometric series: \(2^N \cdot \sum_{k=N+1}^{\infty} (1/2)^k = 2^N \cdot \frac{(1/2)^{N+1}}{1 - 1/2} = 2^N \cdot (1/2)^N = 1\). Thus, \(E = N + 1\).  
  For \(N = 100\), \(E \approx \$100\). Yet this is still puzzling: Would anyone pay $100 for a gamble where winning the top prize (\(2^{100}\) dollars, enough to buy galaxies) has probability \(2^{-100}\) (near zero)? The expected value is dominated by astronomically unlikely outcomes, violating the intuition that value should reflect plausible outcomes. Capping relocates—but does not solve—the paradox by showing that finite expectation can still feel “too high” due to skew.  

  **2. Repeated Play**:  
  Repeated play claims that the long-run average justifies any finite fee. After \(n\) plays, total winnings \(S_n\) grow as \(n \log_2 n\) (since each play’s payout distribution is heavy-tailed). The average winnings per play, \(S_n / n\), behave like \(\log_2 n\). This average *drifts upward logarithmically* and never stabilizes (the variance is infinite, so the law of large numbers fails). To exceed a fee \(f\), solve \(\log_2 n > f\), giving \(n > 2^f\). For \(f = 25\), \(n \approx 2^{25} \approx 33\) million plays. The total cost is \(n \cdot f \approx 825\) million dollars, while winnings are \(\approx 33\text{M} \cdot \log_2(33\text{M}) \approx 33\text{M} \cdot 25 = 825\) million dollars—a break-even requiring absurd scale. Worse, the average keeps rising; “vindication” is asymptotic and practically unattainable. Repeated play thus fails as a general solution.  

  **3. Bounded Utility**:  
  Bounding utility (e.g., \(u(\$x) = \log x\) or a hard cap) ensures finite expected utility. But this fails for non-monetary goods: If the prize is lives saved, utility may be unbounded (no “saturation point”), and no physical cap (like casino wealth) applies. Moreover, infinite expectations create indeterminacy: Let gamble \(G\) pay \(2^k\) in state \(k\). Gamble \(G'\) pays \(2^k + 1\) in every state. \(G'\) dominates \(G\) statewise, yet if both have infinite expectation, expected utility theory values them equally—violating dominance. Bounded utility avoids this but at a cost: It requires utility to saturate (e.g., no value beyond saving \(M\) lives), which is implausible for many goods. It also functions like ignoring tiny probabilities of vast gains, which may be rational but is not a *resolution*—it is a departure from standard expected utility.  

  **Three Distinctions and the Cost of Bounding**:  
  - (a) *Expected payoff*: The mathematical expectation (infinite or \(N+1\)).  
  - (b) *Worth*: The subjective value accounting for risk, skew, or utility curvature.  
  - (c) *Decision*: Accepting/rejecting at a price, influenced by wealth and risk aversion.  
  The paradox conflates (a) and (b): Infinite expectation need not imply high worth. Bounded utility resolves (a) by altering (b), but it “costs” a saturation point and may conflict with rationality (e.g., when dominance requires sensitivity to unbounded gains).  

  **Conclusion**: The dissolution fails. Capping exposes skewed expectations; repetition demands impractical scale; bounding utility is ad hoc and inapplicable to unbounded goods. The paradox endures by revealing that expected value alone cannot capture worth when probabilities decay slower than payoffs grow.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (deduct marks if missed or flawed):  
  1. **Derivation of \(E = N + 1\) for capped game** (4 marks).  
     *Common mistake:* Incorrect geometric series handling (e.g., missing the \(k > N\) term).  
  2. **Puzzle persists for high cap (e.g., \(2^{100}\))** (4 marks).  
     *Common mistake:* Claiming finite expectation resolves the paradox without addressing skew/risk.  
  3. **Repeated play: Average drifts as \(\log n\), fee vindication impractical (e.g., \(2^{25}\) plays for $25)** (4 marks).  
     *Common mistake:* Assuming LLN applies or misstating growth as linear/exponential.  
  4. **Capping fails for non-monetary goods; statewise dominance violated under infinite expectations** (4 marks).  
     *Common mistake:* Not linking unbounded utility to dominance or not using the \(G\) vs. \(G+1\) example.  
  5. **Distinguish expected payoff/worth/decision; cost of bounded utility (saturation point)** (4 marks).  
     *Common mistake:* Conflating the three concepts or omitting saturation.  

  **Automatic penalties** (deduct **1 mark** per occurrence from total):  
  - Claiming the capped expectation is \(2^N\) (or similar).  
  - Stating LLN applies to the original (uncapped) game.  
  - Asserting unbounded utility is always irrational.  
  - Misdefining statewise dominance.  

  **A vs. B answer distinction**:  
  - **A (18–20 marks)**: Integrates all points coherently; shows *why* each move relocates/fails (e.g., “capping reveals skew, doesn’t fix valuation”); uses precise reasoning (e.g., \(\log n\) drift); explicit discussion of saturation cost.  
  - **B (14–17 marks)**: Covers points but with gaps in depth (e.g., derives \(E = N+1\) but skips skew intuition; mentions statewise violation without example); less emphasis on “relocation.”  

  ---

  ### Note on Contested Sides in Model Answer  
  1. **Growth rate of \(S_n\)**: The model answer assumes \(S_n \sim n \log_2 n\). This is a standard result (the St. Petersburg game is in the domain of attraction of a \(\alpha\)-stable law with \(\alpha=1\)), but proofs are beyond scope. **Marker note**: Accept any argument that the average drifts upward without converging (e.g., “average grows with \(n\)”).  
  2. **Utility saturation implausibility**: The answer claims unbounded utility is plausible for goods like lives. This is contested (e.g., Harsanyi argues for boundedness). **Marker note**: Accept alternative views if the *cost* of bounding (e.g., “requires saturation”) is explained.
