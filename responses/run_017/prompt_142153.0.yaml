prompt: |-
  I had a long and unsatisfying argument with a friend last night about refugees, and I think I now see why it went nowhere: we were each answering a different question and calling it by the same name. I want to try it the other way round. Below are my case-by-case verdicts, given as honestly as I can. What I want from you is the principle, if there is one, that they add up to.

  The first thing I noticed is that "refugee" seems to be doing two jobs at once: it marks a fact about a person (something has gone badly wrong for them) and it triggers a duty on someone else's part (you must let them in and not send them back). My verdicts below suggest those two come apart, and I don't know whether to conclude that there are two principles or that I am confused.

  On who counts:

  1. A shopkeeper who refuses to pay the local gang's extortion, is shot at, and finds the police uninterested because the gang has bought them. Counts. My friend says no, because there is no state persecutor; I say the state's refusal to protect is the whole problem.

  2. A family leaving a delta region where the salt water has reached their fields and their village will be gone within a decade. No one is targeting anyone. Doesn't count — but I resist the inference from "not a refugee" to "we owe them nothing," and I can't say why that inference fails here while it seems fine in the next case.

  3. A woman who would be confined, beaten and socially destroyed by her own family and community for leaving a marriage. The law is on her side; the police are not. Counts. My friend says this is private violence and therefore not the state's business; that strikes me as drawing the line in exactly the wrong place.

  4. A man who fled a city under indiscriminate bombardment. Nobody targeted him; he just lived there. Counts — and, curiously, I feel this more strongly than case 1, even though there is less in the way of anyone *doing* anything to him.

  5. An eighteen-year-old from a poor, peaceful, badly governed country who would simply do much better here. Doesn't count. And unlike in case 2, I do think this answer settles the practical question.

  6. A mixed case: a family that left after the drought killed their herd *and* after being pushed out of local office because they belong to a disfavoured minority. I think each factor alone would have been enough. Counts — but my confidence drains away as I imagine the persecution getting pettier and the drought getting worse, which suggests I am doing something like adding up harms, and I don't know whether that is legitimate.

  7. A former party loyalist who arrives here and, over two years, genuinely converts to a faith his home regime persecutes. Counts. A second man who, before leaving, posted videos denouncing that regime precisely in order to build a claim: doesn't count. A third who converted on the cynical advice of an agent, but who now would genuinely be in danger if returned: I find myself saying no, and then immediately noticing that I have no consistent story about *what* has to be genuine — the belief or the risk.

  8. A woman harassed and dispossessed in her home province who could live safely in the capital, nine hundred kilometres away, at the cost of her land, her language community and her livelihood. Counts, in my judgment — but this is the verdict I am least sure of, and it is the one my friend pressed hardest on.

  9. A former intelligence officer of a fallen brutal regime, now wanted by its successor; the new government would like to try him, and would torture him. Doesn't count. My reason is that he forfeited the claim — but a principle that is otherwise entirely about what will happen to the person has no obvious slot for forfeiture, and I want to know whether I have imported a second idea.

  10. A sixteen-year-old born here to parents whose claim was never resolved; speaks the homeland language poorly, has never lived there. Sending the family back feels wrong, but not, I think, because the child has a claim of the kind in cases 1 to 9. It feels like a different kind of reason altogether.

  On who must take them in:

  11. A neighbouring country hosting two million people from the same war, with schools on double shifts and a collapsed labour market; a rich country four thousand kilometres away hosting forty thousand. I think the rich country is doing far less than it owes — but I don't think the individual has a claim to be admitted *there*, which is apparently consistent with my thinking that they have a claim to be admitted somewhere.

  12. A person who transited four safe countries and claimed in the one with the most generous support and a large community from home. Much weaker claim, perhaps none. What troubles me is that this is case 11 with the choice made explicit, and I dislike the verdict less when the choice is hidden.

  13. A country that armed one of the factions in the war. I want to say its duty is greater, but not that it owes more *to this claimant* in particular — the wrong seems to be a fact about which duty-bearer should act, not about the content of anyone's claim.

  14. Forty million people denied citizenship and barred from most work across a whole region. I cannot accept that admission is the only way to discharge anything here; I equally cannot accept that therefore none of them count. My friend says this shows any individual-level principle fails to scale, and I suspect he is right.

  15. A group of citizens here who offer to fund and host two hundred families. I don't know whether that discharges a duty, transfers one, or merely changes who bears a cost, and my principle has no view.

  The best I have managed on my own is a kind of protection-deficit view: what matters is the size of the gap between the rights a person can actually exercise where they are and the rights they could exercise here, with duties of admission falling on whoever can close that gap at least cost. But I can't make it produce my verdict in case 8, it says nothing about case 10, and it silently assumes the answer in case 14. My friend's candidate is different: you count if your own state will not secure your basic rights, and the duty falls on whichever state is best placed to secure them, weighted by capacity and by causal contribution to the failure.

  So: give me a principle, or a short list of candidates, stated precisely enough that I could apply it myself. Tell me which clause each of my cases is doing the work for, and which verdicts you would overturn. Then tell me what it implies for cases I haven't listed, including at least two you generate yourself and think I would find uncomfortable, and at least one where you expect the principle to give a verdict I would reject. I don't want a survey of the legal categories or of what the literature says — I want the principle underneath, and the price of having one.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had an argument with a friend about refugees and realized they were talking past each other. Now, they want to find an underlying principle that explains their case-by-case judgments. The user provided 15 scenarios where their intuition says someone does or doesn't count as a refugee deserving admission. 

  First, I need to understand their core struggle. They see "refugee" as both a descriptor of harm and a trigger for duty. Their cases show these two aspects don't always align. For example, case 1 (shopkeeper) and case 4 (bombardment) both count for them, but the harm sources differ—state neglect vs. war. Meanwhile, case 2 (climate change) doesn't count, yet they feel uneasy dismissing duty entirely. 

  The user's self-proposed "protection-deficit" view focuses on rights gaps but fails in cases like 8 (internal relocation). Their friend’s state-centric view also seems inadequate. The user’s discomfort in cases like 10 (child born in host country) and 14 (stateless millions) suggests they need a principle that scales and handles non-standard claims.

  Hmm. The key tension is between individual harm and systemic duties. Their verdicts imply that the *source* of harm matters (e.g., persecution vs. drought), but also the *intent* (case 7’s genuine vs. opportunistic conversions). They also wrestle with proximity and capacity (cases 11-13), and forfeiture (case 9). 

  I should propose a principle that separates status from remedy. The "protection breakdown" idea covers cases 1,3,4,6 by focusing on systemic failure, whether state-driven or de facto (like gangs controlling areas). Case 2 (climate) is excluded because no protection framework exists—but this doesn’t negate aid duties. Case 5 (economic migrant) lacks any breakdown. 

  Case 7’s conversion trio reveals that the *reason* for risk matters. The opportunistic claimant isn’t fleeing breakdown; they created artificial risk. But the genuinely converted person *is*—even if cynically advised—because the state’s persecution mechanism now targets them. 

  Case 8 is tricky. If relocation within the country offers *effective* protection (not just nominal), admission isn’t owed—but the user thinks it counts. Their resistance might stem from viewing "protection" as including cultural/economic rights, not just safety. That’s a boundary issue: how basic must the rights be? 

  Case 9 (torturer) introduces desert. The principle can handle this via "no complicity"—protecting him would aid impunity, conflicting with the system’s purpose. Case 10 (child) is outside the framework entirely; it’s about belonging, not protection. 

  For duties, "remedial capacity + causal weight" explains why the rich country in case 11 owes more, and why arming factions (case 13) increases duty. Case 12’s "asylum shopping" weakens the claim because proximate states bear primary burden—choice undermines urgency. 

  Case 14’s stateless millions break individual assessment. The principle must admit collective duties here: states must fix systemic exclusion, but individual admission isn’t the only tool. Case 15’s private sponsorship transfers cost but not the state’s duty to ensure protection. 

  Now, testing the principle with new cases: 
  - A journalist *voluntarily* entering a warzone: no claim if they assumed risk. 
  - A persecuted person who *could* hide locally: admission isn’t owed if protection is feasible internally. 
  - Someone facing harm from a group the state *can’t* control (e.g., natural disaster chaos): this might qualify as breakdown, making it refugee-like. 

  The user might reject this last point—they excluded climate harm in case 2. But if a hurricane collapses state structures, creating lawlessness, it mirrors case 1’s protection void. That’s the uncomfortable edge: breakdown isn’t always human-made. 

  The price of this principle? It calls "refugee" a legal tool, not a moral absolute. That might feel cold—like denying case 2’s farmer despite their suffering. But it clarifies that other moral duties exist beyond refuge. Also, it accepts that some deserve protection but won’t get it (scaling limits), which is grim but honest.
answer: |-
  Based on your verdicts, the underlying principle reconciling most cases is **Systemic Protection Breakdown**:

  *   **Core Principle:** A person qualifies for refuge when they face a *threat to fundamental rights* resulting from a *systemic failure of protection* in their home state or territory, and where *no meaningful internal remedy exists*. Admission is owed by states whose *remedial capacity and causal responsibility* outweigh proximity constraints, provided admission is the *necessary and proportionate remedy*.

  **Breakdown of Clauses & Case Alignment:**

  1.  **Systemic Failure of Protection:** The state (or de facto authority) is unwilling/unable to secure core rights (life, bodily integrity, liberty from persecution).
      *   *Cases Covered:* 1 (state refuses protection to gang violence), 3 (state fails to enforce laws against "private" persecution), 4 (state unable to protect from bombardment), 6 (state persecutes *and* fails climate adaptation?), 7a/c (state actively persecutes belief), 8 (state fails to protect rights *in home region*, forcing untenable relocation).
      *   *Work Done:* Explains why gang violence (1) and familial persecution (3) count (state abdication), while mere poverty (5) or climate alone (2) don't (no *protection* failure). Explains why bombardment (4) counts (state fails core duty to protect life).

  2.  **Threat to Fundamental Rights:** Focuses on severe, rights-violating harm (death, torture, persecution, forced displacement from home), not general welfare.
      *   *Cases Covered:* All "Counts" verdicts (1,3,4,6,7a/c,8). Distinguishes 2 (loss of land/livelihood ≠ *fundamental* rights threat *absent persecution*) and 5 (mere betterment).
      *   *Work Done:* Justifies excluding case 2 while resisting "owe nothing" – other duties (aid, migration pathways) apply, but not *refuge* based on protection failure. Explains why climate *plus* persecution (6) counts.

  3.  **No Meaningful Internal Remedy:** Safe internal relocation must be genuinely viable (safe, legal, dignified, sustainable).
      *   *Cases Covered:* 8 (relocation costs land, language, livelihood → not meaningful), 10 (child has no connection → "return" isn't meaningful remedy *for child*).
      *   *Work Done:* Explains your verdict on 8 (counts) and your unease. Highlights why case 10 feels different – the "remedy" (deportation) is flawed *for the child*, even if parents' claim lapsed.

  4.  **Remedial Capacity & Causal Responsibility (Who Owes):** Duty-bearers are states with capacity to help, weighted by their role in causing the harm/failure.
      *   *Cases Covered:* 11 (rich state has high capacity, doing less than owed), 12 (transiting safe states have proximity/capacity, weakening claim on distant state), 13 (state arming faction has high causal responsibility, increasing *its* duty share), 14 (duty is collective/systemic, admission not sole remedy).
      *   *Work Done:* Explains why rich states owe more (11), why "asylum shopping" weakens claims (12 - safe states bear primary duty), why complicity matters (13), and why mass statelessness (14) requires collective solutions beyond individual refuge.

  5.  **Necessary & Proportionate Remedy:** Admission is required only if it's the least harmful/only way to secure rights. Forfeiture applies if protection would undermine the protective system itself.
      *   *Cases Covered:* 7b (opportunistic claim → admission not "necessary" for protection if risk was manufactured), 9 (protecting torturer undermines justice system → forfeiture via proportionality), 15 (private sponsorship changes cost-bearer, may discharge state duty if it ensures protection).
      *   *Work Done:* Explains rejecting 7b (no genuine *need* created by breakdown) and 9 (protecting him actively harms the system refuge relies on). Allows flexibility for 15.

  **Verdicts Overturned / Clarified:**

  *   **Case 2 (Climate):** Consistent with principle (no protection failure). Your resistance to "owe nothing" is correct – refuge isn't the tool here; climate aid, managed migration, or new legal categories are needed.
  *   **Case 7c (Cynical Convert):** **Overturn to Counts.** If he *would* now face genuine persecution due to state policy, it's a protection failure *he faces*. His motive for converting is irrelevant to the *current threat*. (Clarifies the "genuine risk" requirement).
  *   **Case 8 (Internal Relocation):** Principle supports your verdict (counts) *if* relocation isn't meaningful. However, the principle demands scrutiny: *Could* she live safely/with dignity in the capital? If truly yes, claim weakens. Your unease suggests you doubt this.
  *   **Case 14 (Mass Statelessness):** Principle confirms individual refuge isn't the sole answer (scaling issue). Duty is collective/systemic to resolve statelessness via citizenship, rights protections, or regional solutions – *plus* refuge for individuals facing imminent harm *now*.

  **Implications for New Cases (Generated & Uncomfortable):**

  1.  **The "Voluntary" Warzone Journalist:** A journalist with no prior connection voluntarily enters an active warzone to report, knowing the risks. They are subsequently targeted by a faction. *Principle Verdict:* **Weak/No Claim.** While facing threat, the systemic protection breakdown existed *before* their voluntary exposure. They assumed the risk, making their need less compelling than non-voluntary victims. Admission may be discretionary, not obligatory refuge. (*Uncomfortable because they face real danger, but refuge prioritizes involuntary victims of systemic failure*).
  2.  **Persecuted Minority with Internal Haven:** A religious minority faces severe persecution in Region A of Country X. The central government is hostile but indifferent. They could relocate safely and practice openly in Region B (same country), a semi-autonomous zone protecting their rights. *Principle Verdict:* **Does Not Count for Refuge.** A meaningful internal remedy exists (safe relocation within state). The duty is on Country X to facilitate this, not on other states to admit. (*Uncomfortable if relocation is costly/difficult, but principle focuses on availability of protection, not convenience*).
  3.  **Collapsed State & Warlord "Protection":** In a totally collapsed state (no government), a local warlord offers brutal but effective "protection" (from other warlords) to those who submit to his rule/tribute. A person refuses, flees, and seeks refuge. *Principle Verdict:* **Counts.** The warlord is the *de facto* authority. His "protection" is contingent on submission violating fundamental rights (extortion, forced allegiance). Refusing this abusive "system" constitutes a protection failure. (*Uncomfortable because no "state" exists; relies on de facto authority analysis*).
  4.  **Principle Verdict You Might Reject: The "Safe" Persecutor State Dissident:** A dissident faces certain torture in State Y for their political views. State Z, a safe democracy, offers them asylum. However, State Z has an extradition treaty with Y, and Y credibly promises not to torture if returned (monitored by reputable NGOs). *Principle Verdict:* **State Z can Legitimately Refuse/Extradite.** If the threat (torture) can be demonstrably and reliably mitigated *without* admission (via guarantees/monitoring), admission is not the *necessary* remedy. Refuge addresses the *threat*, not the political oppression itself if safety can be secured elsewhere. (*You might reject this if you distrust such guarantees or believe refuge inherently includes freedom from the persecuting state's control*).

  **The Price of This Principle:**

  1.  **Separation of Status & Remedy:** It decouples "refugee status" (identifying protection failure) from "admission duty" (determined by capacity/causality). This clarifies why someone might "count" but not have a claim on *your specific state* (Case 11/12).
  2.  **"Systemic Failure" is Messy:** Defining the "system" (failed state, complicit state, de facto authority) and its "failure" (unwilling, unable, actively persecuting) requires nuanced, sometimes contestable, factual judgments (Cases 1, 3, 8).
  3.  **Fundamental Rights Threshold:** Drawing the line between "fundamental rights" violation (requiring refuge) and severe hardship (requiring other responses) is inherently difficult and value-laden (Cases 2 vs 6).
  4.  **Forfeiture is Contentious:** Justifying refusal based on past acts (Case 9) or perceived abuse (Case 7b) requires careful limits to avoid undermining protection.
  5.  **Scaling Requires Collective Action:** It concedes individual refuge principles *alone* cannot solve systemic crises like mass statelessness or climate displacement (Case 14), demanding uncomfortable political solutions.
  6.  **It's Not About Compassion:** The principle is coldly functional – protecting people from systemic rights failures. It doesn't capture the full moral weight of displacement or the desire to help those simply suffering (Case 2). Refuge becomes a specific legal/moral tool, not the totality of our obligations to the displaced.

  This principle systematizes your intuitive distinctions by grounding them in the *failure of a political community to fulfill its protective function* and assigning duties based on *practical responsibility and capacity to remedy that failure*. Its strength is coherence with your judgments; its cost is accepting refuge as a constrained, political remedy, not an unlimited humanitarian impulse.
