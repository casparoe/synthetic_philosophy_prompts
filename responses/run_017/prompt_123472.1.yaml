prompt: |-
  I have just come out of a long argument with a friend about whether "democratic backsliding" names anything more than what the losing side calls a reform it dislikes, and I realized we were arguing past each other because we had never said what a usable account of the thing would have to do. Before we return to the cases, I want the specification.

  My friend's three claims, which I could not refute to my own satisfaction, were: that the term is just partisan disapproval dressed up as political science; that Hungary and Poland cannot be backsliding because they never fully consolidated in the first place, so there was no democratic plateau to slide off; and that a government which wins an actual majority in a free election may rewrite the rules it inherited, so any standard that counts that as backsliding is really just elitism about checks and balances.

  What I would like from you is the list of requirements any account of democratic backsliding would have to meet to be worth using — the phenomena it must capture, the cases it must classify correctly, the distinctions it must not collapse — each with the concrete case behind it. Please treat the following as non-negotiable constraints on the exercise.

  First, fix the purpose, because adequacy is relative to it. I want the concept to serve two masters at once, and I want to know whether any single concept can: (a) a comparativist who has to code cases — Hungary, Poland, Turkey, the United States — on a consistent basis, using evidence available to an outside observer; and (b) a domestic actor, official, or ordinary citizen who has to decide whether the label applies strongly enough to warrant responses that would themselves be hard to justify in normal politics. If those two uses pull the requirements in different directions, say so explicitly and say which requirement each use would have to relax.

  Second, the hard cases. Any list that fails on these should be treated as refuted. Please make sure your requirements are tested against at least the following, and add cases of your own where you think the interesting failures lie elsewhere:

  - The ratchet or inventory problem: a long sequence of individually modest, legally valid, separately defensible changes to electoral administration, media regulation, judicial appointments, and civil-service rules, where no single step is the culprit but the package predictably lowers the chance of alternation in power. Each step can be defended on its merits; the sequence cannot.
  - The unconsolidated baseline: a country with a semi-authoritarian inheritance and a defective settlement, whose deterioration therefore may not be a slide from anything.
  - Mandate-laundered entrenchment, as I have started calling it: reforms that are genuinely popular, enacted after a free and fair election, procedurally valid, and that nonetheless make it substantially harder for the incumbent coalition to be voted out a decade later. My friend's third claim lives or dies on this case.
  - The mirror-image case: a governing majority that uses bare-majority means, breaks standing conventions, and bypasses the very institutions that object, in order to do something that plainly increases democratic inclusion — enfranchising an excluded group, abolishing an unelected chamber, dissolving a captured court. The means are indistinguishable from entrenchment; the tendency is not. Any criterion that keys on means alone mishandles this, and any criterion that keys on outcomes alone seems to beg the question about which outcomes count.
  - Rules that are symmetric in form but asymmetric in expected effect, given who currently holds the levers — and conversely, procedural reforms that make competition visibly fairer while increasing the incumbent's structural advantage. I want to know whether the concept is defined over institutional quality, over the probability of alternation in power, or over both, and what it says when those diverge.
  - The near miss: an incumbent attempt to disable a check that is blocked, reversed, or never implemented. Whether this is backsliding, attempted backsliding, or a demonstration of resilience seems to me to be diagnostic of what the concept really tracks.
  - Mere misgovernment: corruption, incompetence, economic decline, and unpopular policy, none of which should count, but all of which degrade the same survey indicators that a measure of backsliding would rely on.
  - The who-decides recursion: once the referees — courts, election commissions, the civil service, the press — have themselves been degraded, what kind of authority is left to certify that backsliding has occurred, and does the concept survive the loss of an uncorrupted authority?

  Third, for each requirement, tell me whether it is non-negotiable or merely a preference of one camp, and give a one-line failure mode: what an account that omits this requirement ends up saying that is unacceptable. Then flag any pair of requirements you suspect cannot be jointly satisfied. My own suspicion is that the pressure is between being able to detect backsliding early enough to be useful and being conservative enough to avoid crying wolf, and that this pair interacts badly with the demand to be symmetric across parties — but make the case yourself rather than confirming mine.

  Fourth, tell me which single requirement in your list does the most work in excluding accounts currently in circulation, and which requirement on your list is really a partisan or methodological prejudice that has been smuggled in as though it were a desideratum. That second item is the one I most want, since it is the part of the argument with my friend that I think I was losing.

  You may close with a brief scorecard — a table is fine, a few lines per entry — of how four structurally different families of account do against the list: accounts built on continuous indices and thresholds, accounts that reduce democracy to free and fair elections, accounts that turn on the intentions and projects of incumbents, and accounts that turn on the health of checks and balances and the rule of law. Keep the weight on the criteria and their motivating cases rather than on the scoring.

  Do not give me citations, bibliographies, reading lists, or surveys organized around named authors and datasets; I have read the well-known work, and I want the arguments rather than a map of the literature. Where an account is associated with a school of thought, describe it structurally, and define any technical term you use the first time it appears. Draw your illustrative cases from Hungary, Poland, Turkey, and the United States, but do not rest anything on fine-grained factual claims about them that a reader could not verify from memory. Please write your answer in American English, in roughly 1,000 to 1,300 words.
reasoning: |-
  Okay, let me unpack this user's request. They're asking for a rigorous framework to evaluate "democratic backsliding" that must satisfy two conflicting purposes: academic coding for comparativists and real-world decision-making for domestic actors. The user presents seven hard cases that any viable definition must handle, from incremental erosion to mandate-laundered entrenchment. 

  Hmm, the core tension seems to be between early detection and false positives. If we define backsliding too broadly, we risk partisan labeling; too narrowly, we miss genuine threats. The user's friend argues that current definitions are elitist - that's the mandate-laundered entrenchment case where popular reforms reduce future electoral competitiveness. 

  I need to build requirements that address:
  First, the purpose duality: Comparativists need observable indicators over time, while domestic actors need actionable thresholds. These conflict on evidentiary standards - scholars can wait for trends, but citizens must act on partial data. Requirement 1 will tackle this.

  Second, the hard cases: 
  - The ratchet problem (Requirement 2) needs to capture institutional decay through cumulative minor changes. 
  - Unconsolidated democracies (Requirement 3) can't be excluded just because they never reached "full" democracy - Turkey's AKP era shows backsliding from an imperfect baseline.
  - Mandate-laundered cases (Requirement 4) are tricky - Poland's judicial reforms were popular but reduced opposition access to power. The key is distinguishing popularity from systemic impact.
  - The mirror case (Requirement 5) tests whether means or ends dominate - like LBJ's procedural hardball for civil rights versus Orbán's similar tactics for entrenchment.
  - Symmetric rules (Requirement 6) demand analyzing context - US voter ID laws may look neutral but have partisan impact.
  - Near misses (Requirement 7) are about institutional response - Trump's 2020 election challenges weren't backsliding because they were contained.
  - Misgovernment distinction (Requirement 8) is vital - corruption degrades democracy but isn't backsliding unless institutional.
  - Referee degradation (Requirement 9) is the endpoint paradox - when courts are captured, we rely on observable effects like opposition viability.

  The user suspects Requirement 4 (mandate exception) and Requirement 9 (authority problem) might be irreconcilable - if referees are captured, how do we judge? I'll argue we shift to observable outcomes like opposition competitiveness.

  For the partisan smuggling point: The elitist bias lurks in how we define "undemocratic" outcomes. If we insist any popular reform reducing alternation is backsliding, we invalidate democratic mandates. Requirement 4 must focus on systemic lock-in regardless of popularity.

  Finally, comparing definition families:
  - Continuous indices miss early warnings (ratchet problem).
  - Election-only definitions ignore institutional decay between votes.
  - Intent-based accounts struggle with plausible deniability.
  - Checks-and-balances approaches best handle the hard cases but risk overemphasizing elite preferences.

  The tradeoff between early detection and false positives remains unresolved - but anchoring to alternation probability rather than institutional aesthetics helps.
answer: |-
  ### Requirements for a Viable Account of Democratic Backsliding  
  *(Purpose: Serve both comparative coding and domestic actionability)*  

  #### **Core Requirements**  
  1. **Purpose Duality**  
     - *Must* enable consistent cross-national coding **and** justify extraordinary domestic responses (e.g., civil disobedience, institutional defiance).  
     - *Failure mode*: If too academic, it lacks urgency for citizens; if too activist, it loses objectivity for comparativists.  
     - *Trade-off*: Domestic use relaxes **certainty** (acts on risk); comparativists relax **timeliness** (requires trend confirmation).  

  2. **Cumulative Incrementalism**  
     - *Must* capture the **ratchet effect** (e.g., Hungary 2010–2018: media laws, judicial appointments, electoral redistricting). Each step defensible, collective effect reduces opposition viability.  
     - *Failure mode*: Misses backsliding disguised as technocratic reform.  

  3. **Non-Ideal Baselines**  
     - *Must* recognize backsliding from **unconsolidated democracies** (e.g., Turkey post-2002: AKP eroded secular checks despite weak prior consolidation).  
     - *Failure mode*: Excludes cases like Poland (1990s–2000s) where backsliding occurs post-transition but pre-consolidation.  

  4. **Mandate Exception**  
     - *Must* condemn **popularly endorsed entrenchment** (e.g., Poland’s 2015 judicial “reforms” after PiS election win) if it systemically reduces electoral competitiveness.  
     - *Failure mode*: Legitimizes elected autocracy by mistaking popularity for democratic health.  

  5. **Means-Ends Distinction**  
     - *Must* classify **procedurally identical but democratically opposite acts** (e.g., U.S. 1965 Voting Rights Act [inclusion] vs. Hungary 2012 supermajority rules [entrenchment]).  
     - *Failure mode*: Labels LBJ’s hardball tactics as backsliding, or Orbán’s as democratizing.  

  6. **Contextual Symmetry**  
     - *Must* assess whether **formally neutral rules** disproportionately disadvantage opposition (e.g., U.S. voter ID laws in GOP states) **or** increase fairness despite incumbent gain (e.g., nonpartisan redistricting).  
     - *Failure mode*: Fails to distinguish genuine reform from gerrymandering.  

  7. **Resilience Test**  
     - *Must* treat **thwarted attempts** (e.g., Trump’s 2020 election subversion failed) as distinct from successful backsliding.  
     - *Failure mode*: Equates democratic defense (e.g., courts blocking power grabs) with backsliding.  

  8. **Non-Equivalence**  
     - *Must* exclude **mere misgovernment** (e.g., Greece’s post-2009 economic crisis) unless linked to institutional demolition.  
     - *Failure mode*: Conflates policy failure (unpopularity) with regime degradation.  

  9. **Authority Paradox**  
     - *Must* function when **referees are compromised** (e.g., Turkey’s judiciary post-2016 purges) by relying on observable outcomes (e.g., opposition viability).  
     - *Failure mode*: Declares backsliding impossible once institutions are captured.  

  ---

  #### **Tensions and Trade-offs**  
  - **Irreconcilable Pair**: **Early Detection vs. False Positives** (Requirements 2 & 7).  
    - Domestic actors need early warnings (e.g., incremental erosion in Hungary 2010–2013); comparativists require confirmed damage (e.g., Poland’s PiS losing power in 2023 proving backsliding reversible).  
  - **Partisan Smuggling**: **Requirement 4 (Mandate Exception)** is often rejected by populists as “elitist,” but excluding it whitewashes democratic suicide.  
  - **Most Exclusionary Requirement**: **Requirement 5 (Means-Ends Distinction)** disqualifies purely procedural or purely outcome-based accounts.  

  ---

  ### Scorecard: Four Families of Accounts  
  *(Tested against requirements)*  

  | **Account Type**               | **Strengths**                                  | **Critical Weaknesses**                              |  
  |--------------------------------|-----------------------------------------------|------------------------------------------------------|  
  | **Continuous Indices** (e.g., V-Dem, Freedom House) | Good for Requirement 1 (coding), 3 (non-ideal baselines), 8 (excludes misgovernment). | Fails Requirement 2 (misses incrementalism), 7 (near-misses inflate scores), 9 (relies on expert surveys vulnerable to capture). |  
  | **Election-Centric** (e.g., Schumpeterian minimalism) | Clear on Requirement 4 (mandates ≠ democratic health). | Fails Requirement 2 (ignores inter-election decay), 5 (can’t distinguish inclusion/entrenchment), 6 (ignores asymmetric impacts). |  
  | **Intentionalist** (e.g., incumbents’ anti-pluralism) | Addresses Requirement 5 (means/ends), 9 (focuses on projects over captured institutions). | Fails Requirement 4 (discounts popular support), 7 (overcounts failed attempts), 8 (hard to distinguish from routine power-seeking). |  
  | **Institutionalist** (e.g., erosion of checks/rule of law) | Excels on Requirement 2 (ratchet effect), 6 (contextual symmetry), 9 (outcome focus). | Struggles with Requirement 5 (mirror-image cases), 4 (risks elitism if checks override mandates). |  

  ---

  ### Conclusion  
  A viable account must center on **systematic reduction of electoral competitiveness**—distinguished from routine politics by **directionality** (sustained decline), **irreversibility** (entrenchment), and **asymmetric harm to opposition access**. It cannot require pristine baselines or uncorrupted referees (addressing your friend’s first two claims). The **mandate-laundered entrenchment** case (friend’s third claim) is resolved by Requirement 4: popular approval doesn’t immunize reforms that make alternation improbable.  

  The core tension remains: **Actionability requires judging risk before damage is irreversible; objectivity demands evidence of damage done.** This forces domestic actors to use looser thresholds than scholars—but both must agree on the *direction* of change. The concept survives if it captures democratic decline *as process*, not just endpoint.
