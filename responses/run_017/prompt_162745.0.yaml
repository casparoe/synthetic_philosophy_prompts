answer: |-
  ### The Scenario
  You're the sole medic on night shift in a flooded hospital ward after a storm. Six patients are trapped in separate rooms as water rises rapidly. You have two kits: one contains a proven injection that will *certainly* save a single patient (Patient A) if administered now. The other is an experimental aerosol that *might* save all five others (Group B) at once—but it has only a 15% success rate. If it fails, all five die. You can only use one kit. If you do nothing, all six die equally from drowning.

  ### How the Views Respond  
  **(a) Expected lives saved:** This sums probabilities: saving A gives 1 life (100% × 1). The aerosol gives an expected 0.75 lives (15% × 5). Since 1 > 0.75, expected utility demands saving A. The gamble sacrifices a certain life for a worse expected outcome.  

  **(b) Anti-numbers view:** Each person has an equal claim to be saved. But claims aren't stronger just because multiple people share a fate. Crucially, saving A *reliably honours one claim*. The aerosol, however, offers no individual in B a reliable rescue—each has only a 15% chance their claim is met. Since nothing makes the group’s *collective* claim trump A’s, and A’s claim can be fully satisfied, you should save A. It’s not just "permitted"—A’s stronger claim (rooted in certainty) carries decisive moral weight.  

  **(c) Lottery view:** All six have equal claims, so all deserve equal survival chances. Saving A gives A 100% and B 0%. The aerosol gives each in B 15% and A 0%. Neither gives equal chances, so you must randomise: flip a coin to decide which action to take (e.g., heads save A, tails use aerosol).  

  ### The Key Lever  
  The critical feature is the **certainty differential**: one option guarantees saving a life; the other offers only probabilistic, all-or-nothing rescue for the group. Remove this (e.g., make both options equally reliable or unreliable), and the anti-numbers view collapses—it loses its grounding to favour saving A, defaulting to indifference or coin-tossing. Expected utility would then favour saving the five if their survival probability exceeds 20%.  

  ### Is Anti-Numbers Smuggling Expected Utility?  
  No. Expected utility aggregates probabilities across people to maximise total expected lives. The anti-numbers view here focuses strictly on the *individual claim strength* per person: A’s claim is actionable with certainty, while each in B’s claim is not (only 15% actionable). This evaluates claims one-by-one, not summing probabilities. A sharp reader might *suspect* aggregation, but the core logic—certain rescue versus near-futile group attempt—rests on non-aggregated claims.  

  ### How a Numbers Defender Wriggles Out  
  They’d challenge the aerosol’s low probability: "15% is arbitrary. If we re-estimate it as 25% (expected lives = 1.25), saving B becomes obligatory." Or they’d argue that even a small chance to save five outweighs certainly saving one, as the *possible* outcome (five lives) has intrinsic value beyond expectation. But this abandons expected utility for a "maximise best-case" stance—a retreat from their core principle.  

