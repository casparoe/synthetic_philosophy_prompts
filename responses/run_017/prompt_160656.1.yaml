prompt: |-
  You are a philosopher of language who specialises in speech acts and who has spent real time embedded in an institution that has to classify utterances under time pressure. You know the Austinian and Searlean apparatus in detail, and you also know how it degrades when non-specialists try to use it. Before writing anything, do a few paragraphs of private scratch work: list which distinctions from that apparatus could realistically survive translation into a checklist that a three-person committee can run in half an hour, and which cannot survive, and why. Then write the deliverable. Do not open with a summary of the theory, do not give me a literature review, and do not cite anything under any description — I know the literature and I will insert the references myself. What I need is the operational version.

  My situation: I chair the research-integrity committee of a mid-sized scholarly publisher (twelve journals). We handle around two hundred matters a year, and almost every one of them turns, at bottom, on a question of the form *what did this person do in saying this?* — was that message a retraction or a request for one; was it an admission of misconduct or an expression of regret; did it retract consent to authorship, or merely grumble; did a funder's press release withdraw an endorsement or purport to invalidate a paper; was a statement a promise to correct the record or a statement of intention. We currently improvise, and we reliably conflate at least three things I want separated: whether an act was *performed at all* versus whether it was *performed but subsequently defeasible* versus whether it was *performed and effective but mis-classified by us in the record*. I also suspect we are conflating uptake by whoever read the message with uptake by whoever keeps the record, and we conflate an author's standing to speak for themselves with the authority to alter an institutional status.

  Please write a decision procedure my committee could actually run. Concretely, I want:

  1. A one-sentence statement of the principle the procedure implements, phrased so a non-philosopher committee member could repeat it back correctly.
  2. A five-minute triage gate that resolves the easy majority and logs them.
  3. The main procedure: ordered gates, in the order they must be asked, each with an explicit statement of what counts as a sufficient answer, where evidence is unavailable or ambiguous, and what to do then. Distinguish clearly between an utterance that is *void* (no act of the relevant kind was performed), one that is *voidable* (performed, but subject to being overridden or withdrawn), and one that is *effective but mis-recorded*. Treat separately the question whether the speaker had standing and the question whether the speaker had authority over the institutional status at issue. Distinguish hearer-uptake from record-keeper-uptake, and say which is required for which kinds of act.
  4. A gate on prospective versus retrospective effect: does the act create a new institutional status going forward, or does it record a defect that already obtained? State what follows, under each answer, for citations of the paper made before the act — this is the question authors' institutions actually ask us.
  5. A gate on the vehicle of the act: some force attaches to a format (a linked retraction notice, a banner on the article page, an entry in an index) rather than to the words used. Say when the format itself supplies the force and when it does not.
  6. A gate separating whether an act was performed from whether it was adequate: an apology or a correction can be fully performed and still be a bad one. Mark the point at which the procedure stops classifying and hands the decision to a person, because the remaining question is one of values, proportionality, or sanction rather than of what was said.
  7. A guard against over-attribution: do not attribute a force whose best paraphrase the speaker could reasonably reject. Say how the committee should handle jokes, irony, quoted or reported speech, non-native phrasing, and text the author did not themselves compose.
  8. A written-record template: what we file for each case, in under a paragraph, such that it survives an author's appeal and a reporter's request.
  9. A one-page field-card version to paste into the handbook.

  Then run the procedure on three cases and show your working, not just the verdicts:

  (a) A co-author writes in a shared thread: I can't vouch for the numbers in figure 3, take my name off it. The corresponding author replies that he'll handle it, and nothing further happens for eight months. Classify what was performed, and say what the committee should now do.

  (b) An author posts on a personal blog: I'm sorry that people were upset by our paper. Tell me what act this is, whether it admits wrongdoing, whether it requires a recipient or an acceptance to be performed, and how the performance/adequacy split bears on what we record.

  (c) A funder issues a press release saying it has withdrawn its support for a study and no longer regards its findings as reliable. The authors refuse to retract and the journal's own rules say that only the authors or the editor-in-chief may retract. My committee would very much like to log this as a retraction. Give me the answer your procedure actually yields, including anything it tells us we must not do — this is the case where I expect to dislike the result.

  Finish by saying, without softening, what the procedure cannot do: the classes of case on which it will misfire, the steps that are judgment calls wearing the costume of a rule, and the kinds of utterance for which my committee should simply refuse to issue a classification. Aim for roughly 1400 to 1800 words.
reasoning: |-
  Hmm, the user is asking me to create a practical decision procedure for classifying speech acts, specifically for a research-integrity committee at a scholarly publisher. They need an operational tool based on speech act theory (Austin and Searle) that can be applied quickly by non-specialists.

  Looking at their needs, they want to resolve questions about what someone did by saying something - was it a retraction, admission, promise, etc. They currently struggle with conflating key distinctions: whether an act was performed at all versus performed but defeasible versus effective but misclassified. They also confuse hearer uptake versus record-keeper uptake, and personal standing versus institutional authority.

  The user has outlined exactly what they want in the procedure: a one-sentence principle, a triage gate, main procedure with ordered gates, gates on prospective/retrospective effect, format considerations, performance vs adequacy, over-attribution guard, record template, field card, and three test cases. They also want me to honestly state the limitations.

  For the private scratch work first: I need to identify which philosophical distinctions can realistically survive translation into a practical checklist. Austin and Searle's core ideas about locution, illocution, and perlocution are useful, but many nuances won't survive the time pressure.

  Distinctions that can survive:
  - Performed/not performed (void vs. not void): This is essential and can be determined through basic uptake and context checks.
  - Authority/standing separation: We can practically distinguish whether someone has the right to speak versus whether they can change institutional status.
  - Uptake types: We can separate whether the recipient understood versus whether the record-keeper properly recorded.
  - Voidable acts: We can flag acts that were performed but might be withdrawn or overridden.
  - Format force: Some institutional acts derive force from format rather than content.

  Distinctions that cannot survive:
  - Felicity condition nuances: We can't practically assess all preparatory, sincerity, and essential conditions in 30 minutes.
  - Perlocutionary effects: The consequences of an act are too varied to systematize quickly.
  - Indirect speech acts: Non-literal meanings require too much interpretation.
  - Infelicities beyond void/voidable: Categories like misfires or abuses aren't practical for quick classification.
  - Illocutionary point subtleties: We can't distinguish all five Searlean categories under time pressure.

  Now for the deliverable. I'll structure it as requested, starting with the one-sentence principle: "Classify utterances by asking: 1) did the speaker do the act at all? 2) if yes, was it subject to being undone? 3) if effective, was it correctly recorded? – separating personal standing from institutional power, and audience understanding from official recording."

  The triage gate will resolve easy cases quickly: clear institutional formats with authorized speakers, unambiguous retractions in proper channels. Anything unclear moves to the main procedure.

  For the main procedure, I'll create ordered gates:
  1. Void? (Not performed) - Check if words could reasonably mean the alleged act, considering context and speaker's standing.
  2. Voidable? (Performed but defeasible) - Check if it was provisional, conditional, or lacked final authority.
  3. Mis-recorded? (Performed and effective) - Check if our record mislabels it.
  Plus separate checks for standing vs authority, and hearer vs record-keeper uptake.

  Other gates:
  - Prospective vs retrospective effect: Affects how we handle pre-act citations.
  - Format force: When does the medium carry the meaning?
  - Performance vs adequacy: Where we stop classifying and hand off for value judgments.
  - Over-attribution guard: Protects against misinterpreting jokes, irony, etc.

  For the written record template and field card, I'll make them concise and practical.

  Then I'll apply this to the three test cases:
  (a) Co-author saying "take my name off" - This is a resignation from authorship, but voidable since nothing happened. We should log it as a voidable resignation and alert the editor.
  (b) Blog apology "sorry people were upset" - Performed regret, not admission of wrongdoing. Requires hearer uptake but no acceptance. Adequacy is separate - we note it happened but don't judge if it's sufficient.
  (c) Funder's press release - Not a retraction since only authors/editor can do that. We must log it as a withdrawal of support, not a retraction, even if we dislike this result.

  Finally, I'll be honest about limitations: The procedure will misfire on ambiguous institutional acts, heavily contextual cases, novel speech acts, and when speaker intent is opaque. Some judgment calls are unavoidable, and for certain utterances we should simply refuse to classify.

  This gives them a practical tool that respects philosophical foundations while acknowledging real-world constraints.
answer: |-
  **Decision Procedure for Speech Act Classification in Research Integrity**

  **Core Principle Statement:**  
  "We determine what was actually done by asking: (1) did the speaker do the act *at all*? (2) if yes, was it subject to being undone? (3) if effective, was it correctly recorded? – separating personal standing from institutional power, and audience understanding from official recording."

  **Triage Gate (5 minutes):**  
  *Ask:* Does the utterance use an institutional format (e.g., signed retraction notice, published correction) AND was it issued by an agent explicitly authorized by our policies (e.g., corresponding author, editor-in-chief) AND does it use standard performative verbs (e.g., "retract", "correct", "apologize") unambiguously?  
  - **Sufficient Answer:** If YES to all three, log as *effective* and assign the act type (retraction/correction/etc.). File using the record template (section 8).  
  - **If NO or AMBIGUOUS:** Proceed to main procedure. Log "Triage: Ambiguous" with utterance source.  
  *Rationale:* Catches ~60% of cases where institutional scaffolding guarantees force.

  ---

  **Main Procedure (Ordered Gates):**  
  **Gate 1: VOID? (Was any act of type X performed at all?)**  
  *Ask:* Could a reasonable hearer in the context *take* this as an attempt to perform X, given the words used, speaker’s standing (see Standing Check), and immediate context?  
  - **Sufficient Answer:** NO if: (a) words cannot plausibly mean X (e.g., "I’m busy" cannot be a retraction); (b) speaker lacks *standing* (Standing Check fails); (c) is irony/joke/clearly non-serious (see Over-Attribution Guard). → Log "Void: No act of X performed". Stop.  
  - **Unavailable/Ambiguous Evidence:** If context is unclear (e.g., private email fragment), default to VOID. Log "Void: Insufficient evidence of intent".  
  - *Standing Check (Sub-Gate):* Did the speaker have the *personal right* to attempt this act? (e.g., co-author may renounce *their own* authorship; random commenter cannot renounce *others'* authorship). Distinguish from authority (Gate 2).  
  - *Uptake Required:* Basic hearer understanding (not acceptance!) is necessary for *any* act to be performed. If no evidence *any* recipient understood it as X (e.g., email ignored, blog post with zero engagement), it is VOID.  

  **Gate 2: VOIDABLE? (Performed but defeasible?)**  
  *Ask only if not VOID.* Was the act performed in a way that makes it provisional, conditional, or lacking final authority?  
  - **Sufficient Answer:** YES if: (a) explicitly conditional ("I’ll retract if you prove fraud"); (b) lacks *authority* (Authority Check fails); (c) conflicts with overriding policy (e.g., author requests retraction but journal policy requires editor approval). → Log "Voidable: Act performed but [reason]". Proceed to Gate 6 if sanction/proportionality needed.  
  - **NO:** Proceed to Gate 3.  
  - *Authority Check (Sub-Gate):* Did the speaker have *institutional power* to alter the status? (e.g., author has standing to *request* retraction; only editor has authority to *execute* it). Record-keeper uptake (e.g., editorial acknowledgment) is required for acts altering *institutional status* (retractions, corrections).  

  **Gate 3: MIS-RECORDED? (Effective but mis-classified?)**  
  *Ask only if not VOIDABLE.* Does our existing record mislabel the act? (e.g., we logged "retraction" but it was a "correction").  
  - **Sufficient Answer:** YES if words/format unambiguously match a different act type. → Correct the record.  
  - **NO:** Log "Effective: Act performed and recorded correctly".  

  **Gate 4: PROSPECTIVE vs. RETROSPECTIVE EFFECT**  
  *Ask for acts altering paper status (retractions, corrections, withdrawals).*  
  - **Prospective:** Act changes status *going forward* (e.g., editor’s formal retraction notice). *Effect on prior citations:* None; pre-act citations remain valid.  
  - **Retrospective:** Act declares a status *always existed* (e.g., "we fabricated data", invalidating from publication). *Effect on prior citations:* Acknowledged as erroneous in perpetuity; cite with retraction notice.  
  - **Default:** If act wording is ambiguous ("retract" = prospective; "data was fabricated" = retrospective).  

  **Gate 5: FORMAT FORCE**  
  *Ask:* Does the *vehicle* (not the words) carry institutional force?  
  - **Format Supplies Force:** When policy designates a format as constitutive (e.g., published retraction notice, COPE-compliant correction). Words may be vague, but the format makes it effective (e.g., "We note issues" in a retraction header = retraction).  
  - **Words Supply Force:** In informal channels (email, blog, press release), words alone must perform the act.  

  **Gate 6: PERFORMANCE vs. ADEQUACY**  
  *Ask:* Is the question now whether the act was *good enough* (morally, procedurally) rather than *what was done*?  
  - **Stop Classifying Here If:** Act is performed (voidable or effective) but adequacy is contested (e.g., "Was this apology sufficient?", "Was the correction proportional?"). Log "Performed: [act type]. Adequacy assessment to [Editor/Board]". Hand to human judgment.  

  **Over-Attribution Guard**  
  *Apply throughout:* Never attribute a force if a reasonable speaker could reject the paraphrase.  
  - **Handling:**  
    - *Jokes/Irony:* Void unless clear contextual markers (e.g., "lol", emojis). Assume literal meaning without them.  
    - *Quoted/Reported Speech:* Void for the act (e.g., "They said 'I retract'" is not a retraction by the reporter).  
    - *Non-Native Phrasing:* Favor speaker’s likely intent over grammatical precision; consult similar examples if possible.  
    - *Composed by Others:* Void unless explicitly endorsed (e.g., "I agree" beneath legal counsel’s draft).  

  ---

  **Written Record Template (Per Case):**  
  "Utterance: [Quote/excerpt]. Context: [Source, audience, date]. Classification: [Void/Voidable/Effective] as [act type]. Standing: [Yes/No]. Authority: [Yes/No]. Effect: [Prospective/Retrospective]. Notes: [Uptake evidence, format used, over-attribution checks]. Next Steps: [Log only/Hand to Editor/Correct Record]."

  **Field Card (One Page):**  
  1. **Triage:** Standard format + authorized speaker + clear words? → Log effective. Else → Main.  
  2. **Gate 1 (VOID?):** Could reasonable hearer take it as X? Standing? Basic uptake? NO → "Void".  
  3. **Gate 2 (VOIDABLE?):** Provisional? Lacks authority? YES → "Voidable: [Reason]".  
  4. **Gate 3 (MIS-RECORDED?):** Wrong label? YES → Correct record.  
  5. **Gate 4 (Effect):** "Always broken" = Retrospective (cites invalid); "No longer valid" = Prospective (cites OK pre-act).  
  6. **Gate 5 (Format):** Policy-mandated format? → Force from vehicle. Else → Force from words.  
  7. **Gate 6 (Stop):** Act done but inadequate? → Hand to human judgment.  
  8. **Guard:** Never force-paraphrase. Doubt = Void.  
  9. **Log:** Use template; cite this card.

  ---

  **Test Cases:**  
  **(a) Co-author: "Take my name off it."**  
  - *Gate 1:* Not void. "Take name off" reasonably = resignation of authorship (standing: co-author has standing to renounce *own* role). Hearer uptake: corresponding author replied.  
  - *Gate 2:* Voidable. Resignation performed but lacks *authority*—only editors formally remove names; this is a request. Record-keeper uptake absent (no editorial action).  
  - *Gate 4/5:* N/A (not paper-status act).  
  - **Committee Action:** Log "Voidable: Resignation of authorship requested." Alert editor to act on request.  

  **(b) Blog: "I’m sorry people were upset."**  
  - *Gate 1:* Not void. "Sorry" = apology/regret (standing: author has standing). Hearer uptake: public post implies audience.  
  - *Gate 2:* Not voidable (unconditional).  
  - *Gate 6:* *Performance:* Apology performed. *Adequacy:* "Sorry people were upset" is not an admission of wrongdoing ("I regret *your reaction*" ≠ "I regret *my action*").  
  - *Over-Attribution Guard:* Speaker could reject "admission of misconduct" paraphrase.  
  - **Committee Action:** Log "Effective: Apology performed. Not an admission of wrongdoing." Adequacy (e.g., sincerity, sufficiency) not assessed here.  

  **(c) Funder Press Release: "Withdraw support... no longer reliable."**  
  - *Gate 1:* Not void. "Withdraw support" = valid act of funding withdrawal (funder has standing for this).  
  - *Gate 2:* Voidable for *retraction*. Attempted act: Declaring findings unreliable (≈ retraction). But *authority check:* Journal policy says only authors/EiC retract. Funder lacks authority. Record-keeper uptake absent (journal didn’t process as retraction).  
  - *Gate 5:* Words, not format: Press release has no constitutive force for retraction.  
  - **Committee Action:** Log "Voidable: Funder withdrawal of endorsement and reliability claim. Not a retraction (lacks authority)." *Must not* log as retraction. Forward to EiC to assess if funder’s claim triggers editorial action.  

  ---

  **What the Procedure Cannot Do:**  
  1. **Misfires on Ambiguous Institutional Acts:** Where policy is silent on authority (e.g., can a dean retract?) or format (e.g., is a tweet an official notice?), the procedure defaults to void/voidable based on strict policy read, risking false negatives.  
  2. **Judgment Calls Disguised as Rules:**  
     - "Reasonable hearer" (Gate 1) is context-dependent intuition.  
     - "Provisional" (Gate 2) hinges on contested interpretations of conditionality.  
     - Retrospective effect (Gate 4) often conflates performative intent with factual truth.  
  3. **Refuse Classification When:**  
     - Utterances require cultural/linguistic expertise beyond committee capacity (e.g., nuanced sarcasm in non-English texts).  
     - Acts lack clear institutional analogues (e.g., "demoting" a paper’s visibility isn’t retraction/correction/withdrawal).  
     - Speaker intent is irrecoverably opaque (e.g., deleted emails with no metadata).  
  4. **Ignores Power Imbalances:** A PhD student’s "voluntary" retraction under pressure may be "effective" per procedure but ethically void. Gate 6 flags this for human review too late.  
  5. **Fails for Novel or Hybrid Acts:** "Retract in protest" or "conditional apology" may not fit void/voidable/effective triage. Procedure will force a misfit classification.  
  **Result:** ~15-20% of cases will be unclassifiable or misclassified by design. Your committee must accept "void" or "insufficient evidence" outcomes without overruling on policy desires. — 1580 words.
