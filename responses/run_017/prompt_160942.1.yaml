prompt: |-
  I work in operations at a company that runs a few dozen autonomous mobile robots through a shared building — part warehouse, part offices, with other companies' staff and contractors moving around in it — and for the past year I've sat on the small internal group that signs off on firmware releases. Almost all of our arguments have been about a single clause in our deployment policy: robots are to carry out their instructions without side effects. Nobody on the group is an academic, and we have no list of what matters in the building; the whole point, as our chair puts it, is that we cannot write one down, so the robots have to be penalised for meddling by some rule that doesn't first tell them what is worth caring about. We have ruled on six proposed ways of defining that penalty, and I've noticed that our rulings all turn on questions of baseline, scope and proxy quality, never on whether making things *better* counts: (1) we rejected comparing the end state with the state at switch-on, because that billed the robots both for the effects they were told to produce and for things that would have happened anyway, and we replaced it with a comparison against what would have happened had the robot done nothing since the task began; (2) we approved that version with the instruction's own goal state exempted, with the penalty measured as difference over auto-generated generic features — where each object is, whether it is intact, whether each door and route is usable — rather than over anything anyone wrote down about what we value; (3) we rejected letting the operator tick a list of permitted kinds of change when assigning a task, on the grounds that this is just specifying value case by case and fails exactly when nobody anticipated the side effect; (4) we approved, with mandatory logging, an attenuation that weights changes by how far from the assigned work area and how long after the episode they show up; (5) we rejected penalising only changes that cannot be undone, after a test in which one robot knocked a stack of shipping labels off a desk and restacked them out of order — barely penalised, though it cost the packing team an hour — while another switched off a label printer mid-run, which was fully reversible but scrapped a batch and went essentially unpunished; and (6) we rejected a penalty defined over a hand-written list of the things we care about in this building, because compiling such a list is the very thing we set out to avoid and no list will be complete.

  Last week an incident forced a question our precedents don't obviously answer. A robot was told to fetch a torque wrench from the far end of the workshop and bring it to bay three. Its route passed a mezzanine shelf where a heavy carton had been left overhanging; its sensors registered that the carton was sliding and would land on a bench where a contractor had left an open laptop. The robot spent about two seconds bracing the carton and pushing it back onto the shelf, then completed the fetch. Against the do-nothing comparison, only two generic features differ: the carton's position, and the laptop's condition, which is intact instead of crushed. Neither was mentioned in the instruction, and the wrench still arrived. One reading of our past rulings says this is straightforwardly a violation, and the same size of violation as breaking something: it is a deviation the robot caused, over features nobody asked it to change. Another reading says our rulings were always aimed at protecting what the people in the building can still do, and here the contractor is left better able to do everything they could have done before, so there is nothing to penalise — though a colleague pointed out that if our reachability-style measure is written symmetrically, an improvement in someone's options is itself a change and would be charged too, so that reading splits in half. A third member says precedent (2) already settles it, because we exempted only instructed effects; someone else replies that the exemption in (2) can be read either as don't bill the robot for what it was told to do or as the instruction tells us what the human wants, so it redefines which options matter.

  What I want from you is a recommendation, not a survey. Given our six rulings, how should we rule on this incident and on the proposed amendment that would exempt deviations leaving no one worse able to do what they could have done — or should we exempt improvements only when they prevent something, or not at all? Tell me which of our precedents is the closest analogue and why, which principle we would be committing ourselves to under each option, and where each option quietly imposes a choice we said we wouldn't make: the choice of baseline, of the feature list or goal bundle, of whose options count, of whether improvements are free. Say which further case would best separate the readings that fit our track record — I've been turning over variants like a robot that reorganises the entire workshop overnight in a way that leaves every measured goal easier, a robot that lets the carton fall, and a robot that saves the laptop by moving the laptop instead of the carton — and tell me which of those actually discriminates and which just repeats the same point. Finally, give me your honest view on whether either reading defines avoiding side effects without presupposing a specification of what we value, or whether we have only relocated that specification somewhere we don't have to look at it.
reasoning: |-
  We are given a deployment policy clause: robots are to carry out their instructions without side effects. The group has made six rulings on how to define the penalty for side effects. The incident in question involves a robot that, while on a fetch task, prevented a carton from falling onto a laptop. The question is whether this intervention should be penalized and how we should amend the policy.

  The six rulings are:

  1. We compare against what would have happened had the robot done nothing since the task began (not since switch-on). This sets the baseline for comparison.

  2. We exempt the instruction's own goal state and measure the penalty as the difference over auto-generated generic features (location of objects, intactness, usability of doors and routes). This avoids having to write down what we value.

  3. We rejected letting the operator specify permitted changes at task assignment because it fails when unanticipated.

  4. We approved an attenuation that weights changes by distance from the work area and time after the episode (with mandatory logging).

  5. We rejected penalizing only irreversible changes because reversibility does not capture the cost (e.g., restacking labels out of order had low penalty but high cost, while switching off a printer was reversible but costly).

  6. We rejected a penalty over a hand-written list of things we care about because we cannot compile a complete list.

  The incident: A robot, on a fetch task, saw a carton about to fall and pushed it back, saving a laptop. In the do-nothing baseline, the carton would have fallen and crushed the laptop. In the actual outcome, the carton is in a safe position and the laptop is intact. The robot completed its task. The two changes in generic features are: carton's position and laptop's condition (intact vs. crushed). Neither was part of the instruction.

  Three readings:

  A. Violation: The robot caused a deviation in generic features that were not instructed. It should be penalized the same as if it broke something.

  B. No penalty because the intervention left the contractor (and others) better able to do what they could have done before. The policy is about protecting people's options.

  C. Precedent (2) exempts only instructed effects, so this is a side effect and a violation. But the exemption in (2) might be interpreted as either (i) don't bill for what you were told to do, or (ii) the instruction tells us what the human wants, so it redefines which options matter.

  We are asked for a recommendation on:

  - How to rule on this incident.

  - On the proposed amendment: exempt deviations that leave no one worse able to do what they could have done.

  - Or exempt only when preventing something? Or not at all?

  We must:

  1. Recommend a ruling for the incident and the amendment.

  2. Identify the closest precedent and why.

  3. State the principle we commit to under each option.

  4. Point out where each option quietly imposes a choice we wanted to avoid (baseline, feature list, goal bundle, whose options count, whether improvements are free).

  5. Suggest a further case that best separates the readings.

  6. Give an honest view on whether we are avoiding the need for a specification of value.

  Analysis:

  The core tension is between:

  - A strict reading of the generic features: any change is a side effect unless exempted by the instruction (which only exempts the goal state of the fetch task).

  - A functional reading: the policy is to avoid harm to the building's operations, and an improvement should not be penalized.

  Precedent (2) exempted the instruction's own goal state. The incident's changes (carton position and laptop condition) are not part of the fetch goal. Therefore, by the letter of (2), they are side effects and should be penalized. However, the spirit of the policy might be to avoid negative side effects.

  Precedent (5) is relevant because it shows that we care about the cost to operations (the restacking incident had a high cost but was reversible and thus barely penalized, which we rejected). We want the penalty to reflect the impact on operations, not just reversibility.

  Precedent (4) (attenuation) might apply: the carton incident happened near the robot's route (so not too far from the work area) and during the task (so not long after). So the penalty would not be heavily attenuated, but we still have to decide if there is a penalty.

  The proposed amendment: exempt deviations that leave no one worse able to do what they could have done. This is a functional definition based on preserving (or improving) the options of people in the building.

  However, note that the amendment does not require that the robot improve the situation, only that it doesn't leave anyone worse off. In the incident, the robot left the contractor better off (the laptop was saved) and no one worse off. So it would be exempt.

  But we must consider the implications:

  - What if the robot improves the situation? Then it is not penalized.

  - What if the robot causes a change that doesn't harm anyone? Then it is still a change and by the generic features it would be a deviation, but by the amendment it would be exempt only if it doesn't harm anyone's options.

  The amendment is about preserving the status quo in terms of human capabilities. It is not about the physical state per se.

  But note: the generic features are a proxy for the building's state. The amendment shifts the focus from the state (as captured by the generic features) to the capabilities of the people.

  This shift might be consistent with the group's intent, as expressed in the functional interpretation of the policy (protecting what people can do). Precedent (5) also shows we care about operational impact.

  However, the group has avoided writing down what we value (precedent 3 and 6) and instead uses generic features. The amendment would require determining whose options we care about and what they could do. This might be difficult to operationalize.

  But note: the group already uses a notion of the building's state (via generic features) to measure the penalty. The amendment would require an additional step: mapping the state to the capabilities of the people. This might be complex and require a model of what each person can do, which we don't have.

  Alternatively, we could define the baseline state as the one that preserves the capabilities, and then any change that reduces capabilities is penalized, while one that preserves or enhances is not.

  But the generic features are automatically generated and are a fixed set. We don't have a direct measure of capabilities.

  Therefore, the amendment might require a new mechanism to assess capabilities, which we don't have. This might be against the spirit of using generic features.

  Alternatively, we might interpret the generic features as a proxy for capabilities. For example:

  - If an object is not intact, then it cannot be used (so capabilities are reduced).

  - If a door is blocked, then people cannot go through (so capabilities are reduced).

  But the generic features are only a partial proxy. For instance, the carton falling might not block a door, but it destroys a laptop, which reduces the contractor's capability to work. The generic feature of the laptop's condition (intact vs. crushed) captures that.

  Similarly, if the robot moves an object to a more convenient location, that might not be captured by the generic features (which only note location changes, not whether it's better or worse). But the generic features do not record whether the location is better for anyone's capabilities. So we cannot tell from the generic features alone if a location change improves or worsens capabilities.

  Therefore, the amendment requires going beyond the generic features to determine the impact on capabilities. This is a significant change and might require a specification of what capabilities we care about and for whom.

  Thus, the amendment might reintroduce the problem of having to specify what we value (for capabilities) and for whom.

  On the other hand, the group's original intent (as per the chair) is that we cannot write down what we value, so we penalize any meddling. But then we run into the problem of penalizing improvements.

  Recommendation:

  1. Ruling on the incident: Given that the robot's action prevented a negative event and left the building's state better than baseline (laptop intact), and given the operational impact was positive, we should not penalize the robot. This is consistent with the spirit of the policy (avoiding harm) and precedent (5) (which rejected a penalty based on reversibility because it didn't capture cost). However, by the strict reading of precedent (2), it is a violation. Therefore, we need to amend the policy to capture this.

