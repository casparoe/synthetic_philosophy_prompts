prompt: |-
  I run a tiny prediction pool at work — nothing fancy, we each throw a fiver in and bet on things like monthly rainfall at the local reservoir, or whether the trains hit their punctuality target. I drifted into reading a bit of decision theory through that, and the two-urn example you see everywhere keeps half-fitting and half-not-fitting what I actually watch my friends do, so I want to know whether the bit that doesn't fit has a name of its own.

  The standard setup everyone knows: people would rather bet on a clean coin flip you've told them is 50/50 than on an urn whose mix of red and black balls nobody told them. Mine do that too. But here's the part that never matches the way it gets explained. If I ask them separately, "never mind the coin — on the urn on it's own, which colour do you want, and would you rather have red at even money or black at even money?", they shrug and say it makes no difference, and they really don't care which side they get. So they aren't acting as if the urn is stacked against them; looking only at what they'd bet on, you'd say they think it's dead even. Yet put the coin beside it and they'll pay to have the coin instead. Every explanation I run into seems to work by making the person out to be a quiet pessimist about the urn — as if they secretly suspect there are more black balls — and that just isn't what I'm watching. (For what it's worth, a coin that's already been flipped and covered with a hand feels the same to them as one I'm about to flip, so it's not about whether the outcome is already fixed somewhere.)

  Second case, same shape but odder. On the rainfall bets, the person most reluctant to bet is the one who knows the most — an actual hydrologist. She has a number out of her models, she'll tell you what it is, she'll happily say "fifty-fifty, I'd take either side" — and then she still finds a way not to take the bet, and lets the rest of us, who know nothing at all, have it. So whatever this is, it isn't simple nervousness about your own ignorance, because it gets stronger the more expertise you have rather than weaker. I do vaguely remember seeing it claimed that people are perfectly happy betting on fuzzy things when it's a subject they feel knowledgeable about, which is more or less the opposite of what I see, so maybe I've misunderstood that too.

  So: is there an established notion for this particular animal — a pull away from the fuzzy option that shows up in what you choose but not in what you'd say the chances are, and that grows rather than shrinks the more you know? Or are these two different effects that I'm lumping together under one description? I don't want a label for the label's sake; what I'd like is someone to say what the thing really is, how it differs from the textbook version where the person is just quietly treating the unknown urn as if it were bad, which of the neighbouring ideas it genuinely is (and which it only looks like), where its edges are, and what I'd have to change about my little pool to tell whether I'm looking at one effect or two. Please don't just hand me a reading list or a pile of citations — I've got no library access out here and I'd rather have the argument than the references.
reasoning: |-
  Okay, the user runs a small prediction pool at work where they bet on things like rainfall or train punctuality. They've noticed their friends behave differently from the classic two-urn problem in decision theory. In the standard example, people prefer betting on a known 50/50 coin flip over an ambiguous urn with unknown red/black ball ratios. While their friends do this too, they don't seem to privately believe the urn is biased - when asked separately about the urn alone, they're indifferent between red or black at even odds. 

  The user also observes a second pattern with their hydrologist friend who has expertise in rainfall prediction. Despite knowing the probabilities and stating she'd take either side at 50/50, she avoids betting while less knowledgeable participants happily bet. This is interesting because it contradicts the common notion that people prefer betting on domains they know well. 

  The user wants to understand if this behavior has a name, how it differs from standard ambiguity aversion explanations, whether these are two distinct effects, and how to test them in their prediction pool. They specifically don't want just references but a clear explanation.

  I need to distinguish between ambiguity aversion (the standard explanation) and the nuances observed here. The key points are: 1) people show indifference when evaluating the urn alone, suggesting no perceived bias, yet avoid it when a known option exists; 2) expertise increases avoidance rather than decreasing it.

  For the first observation, this seems to highlight a distinction between stated beliefs and choice behavior. People can verbally assign 50/50 probabilities while still disliking ambiguity in actual choices. The Ellsberg paradox typically assumes people behave as if they assign pessimistic probabilities, but here they don't - they maintain symmetric beliefs yet avoid choice. This might relate to "ambiguity aversion without pessimistic beliefs" or perhaps "choice aversion under ambiguity."

  For the hydrologist case, this appears to be the "expertise paradox" in ambiguity aversion. More knowledge might increase awareness of model limitations and unquantified uncertainties, making experts more cautious. While novices see a simple bet, experts see deeper complexities. This could connect to concepts like Knightian uncertainty or the precautionary principle.

  The user might also be implicitly asking how to design their prediction pool to reduce this effect or make it more engaging for all participants. They need practical adjustments to test whether they're observing one unified phenomenon or two distinct effects.

  I'll structure the response to first name the phenomena, explain how they differ from textbook ambiguity aversion, explore the relationship between the two observations, and suggest tests for their prediction pool. The core insight is that people can maintain symmetric beliefs while still disliking to act on ambiguous options - a distinction between probabilistic judgment and decision readiness.
answer: |-
  You're observing a fascinating nuance in real-world ambiguity aversion that *doesn't* quite fit the textbook "pessimistic probability weighting" explanation of the Ellsberg paradox. What you're seeing has elements of established concepts, but the specific combination – **symmetric stated beliefs combined with choice avoidance that *increases* with expertise** – points towards a richer phenomenon. Here's the breakdown:

  1.  **The Core Effect (Urn vs. Coin): Ambiguity Aversion + Preference for Resolvability**
      *   **What it is:** Your friends *are* exhibiting classic **Ambiguity Aversion** (Ellsberg Paradox). They prefer the known-risk coin over the ambiguous urn.
      *   **How it differs from the "pessimist" explanation:** Crucially, their *stated beliefs* ("I don't care, red or black") show **no evidence of pessimistic probability distortion**. They verbally assign ~50/50. Their aversion manifests purely in the *choice context* when a less ambiguous alternative exists.
      *   **The Key Nuance: Preference for Resolvability/Knowability.** The coin represents **resolvable uncertainty**. The outcome is determined by a known, clean mechanism. Even if the urn *is* 50/50, the *source* of the uncertainty is opaque ("Why is it 50/50? Could it be rigged? How was it filled?"). People often have a deep-seated preference for uncertainty that feels fundamentally resolvable or generated by a known process, even over ambiguity that might objectively be symmetric. The covered coin flip confirms this – it's the resolvable *mechanism* (the fair flip) they trust, not the "newness" of the uncertainty. This aspect is sometimes called **Source Preference** or linked to **Epistemic Anxiety**.

  2.  **The Expertise Effect (Hydrologist): The Weight of Unknowables & Decision Avoidance**
      *   **What it is:** This is **not** simple ambiguity aversion. It's **Expertise-Induced Decision Avoidance Under Deep Uncertainty**, closely related to **Knightian Uncertainty** (distinguishing measurable "risk" from unmeasurable "uncertainty").
      *   **Why it happens (and contradicts simple "bet on what you know"):**
          *   **Awareness of Model Limitations:** The hydrologist *knows* her model is a simplification. She knows the assumptions, the missing data, the chaotic factors (like a specific unpredicted storm system) that could make her 50% estimate wildly wrong. Her expertise reveals the *depth* of the uncertainty beneath the surface probability.
          *   **Responsibility & Regret Aversion:** Betting makes the uncertainty concrete. If she bets and loses (even if her model was "correct" probabilistically), it feels like a personal failure ("I *should* have known X"). Not betting avoids this potential regret. The less knowledgeable don't feel this weight; they see "50/50, fun bet!".
          *   **Aversion to Acting on Imperfect Knowledge:** Experts often develop a heightened sensitivity to the ethical or practical implications of acting on knowledge they know is incomplete. Betting feels like endorsing a specific probability she knows isn't the whole story. This is related to the **Precautionary Principle** mindset.
          *   **Distinguishing Risk from Uncertainty:** She intuitively understands that rainfall prediction involves true **Knightian Uncertainty** ("I don't know what I don't know"), whereas the coin flip is pure quantifiable **Risk**. Betting on deep uncertainty feels qualitatively different and less palatable, *especially* when you understand its depth.

  **Putting it Together: The "Real-World Ellsberg Plus" Effect**

  You're likely seeing **one core phenomenon with a significant nuance:** **Ambiguity Aversion driven primarily by a Preference for Resolvable Uncertainty and Source Trust, coupled with an Expertise Effect that amplifies aversion by revealing deeper layers of Knightian Uncertainty.**

  *   **The Common Thread:** Avoidance stems not from believing the ambiguous option is biased *against* them, but from discomfort with the *nature* or *source* of the uncertainty itself. It's "fuzziness aversion."
  *   **The Difference:** In the simple urn case, the fuzziness is the unknown composition/source. In the expert case, the fuzziness is the known incompleteness and fundamental unquantifiability of the underlying reality *despite* having a best estimate. Expertise doesn't resolve the fuzziness; it illuminates how deep it goes.
  *   **Why it's not two *entirely* separate effects:** Both involve rejecting an option due to discomfort with the *quality* of information/knowledge underpinning the probabilities, rather than the probabilities themselves. Expertise acts as an *intensifier*, revealing more profound fuzziness.

  **Names & Neighboring Concepts:**

  1.  **Ambiguity Aversion:** The core choice pattern.
  2.  **Source Preference / Preference for Resolvable Uncertainty:** Explains the coin preference *without* requiring pessimistic beliefs.
  3.  **Knightian Uncertainty:** The deep, unquantifiable uncertainty driving the expert's avoidance.
  4.  **Decision Avoidance Under Deep Uncertainty:** The expert's specific behavior.
  5.  **The Ellsberg Paradox with Symmetric Stated Beliefs:** A descriptive label highlighting your specific observation.
  6.  **Epistemic Anxiety / Distrust:** The emotional/cognitive state of discomfort with the unknown source or depth of uncertainty.

  **Testing It in Your Pool:**

  To tease apart the nuances and see if the expert effect is distinct or just amplified:

  1.  **Introduce "Semi-Resolvable" Ambiguity:** Instead of a pure unknown urn, try:
      *   **Urn A:** Completely unknown mix (100 balls, mix secret).
      *   **Urn B:** Known to be filled by a machine that *usually* makes 50/50 urns, but you don't know *this specific urn's* mix. (Adds a trusted source but residual ambiguity).
      *   **Urn C:** You draw 10 balls (with replacement) first, observe the ratio, *then* bet on the next draw. (Provides some resolution).
      *   **Test:** Do people still prefer the coin over *all* urns? Is Urn B preferred to Urn A? Is Urn C preferred to A/B? Do experts show *stronger* preference for resolvable steps?
  2.  **Vary the Stakes:** Try tiny bets (e.g., 1 cent) vs. your usual fiver on ambiguous options. Does the hydrologist participate at tiny stakes? (If yes, it suggests her aversion is partly about responsibility/acting on deep uncertainty, not just belief). Do others show similar sensitivity?
  3.  **"Bet on the Expert" vs. "Bet Against the Model":**
      *   Offer a bet directly tied to the hydrologist's stated probability: "I bet £5 rainfall is above *your* 50% threshold point." Does she avoid *this* bet too? (Likely yes, due to responsibility/regret).
      *   Frame it impersonally: "Here's the output of Hydrologist's Model X: 50% chance above 50mm. Bet £5 it rains above 50mm?" Does she avoid *this*? (If she avoids the first but might consider the second, responsibility/self is key. If she avoids both, it's aversion to acting on *any* model she knows is imperfect).
  4.  **Introduce a "Known Ambiguous" Option:** Create an urn where you *tell* them the mix is either 40% Red/60% Black OR 60% Red/40% Black, determined by a coin flip they didn't see (a classic Ellsberg setup). Compare choice between this urn and your "completely unknown" urn. Do people prefer the "known ambiguous" urn? (Standard Ellsberg predicts they would). Does the hydrologist show *more* aversion to the "completely unknown"? (Likely, reinforcing the depth-of-uncertainty effect).
  5.  **Ask for "Minimum Odds":** Instead of "which side," ask "What odds would you need on Red to bet? What odds on Black?" (e.g., "Would you take Red at 2:1?"). For the urn and the rainfall.
      *   **Prediction:** Your friends might demand slightly better than even odds for *both* sides of the urn to bet (e.g., 1.1:1), revealing implicit ambiguity aversion despite symmetric verbal beliefs. The hydrologist might demand *much* better odds for rainfall than others do, or refuse entirely, revealing her higher sensitivity to its deep uncertainty.

  **In essence:** You've stumbled upon the distinction between disliking ambiguity because you think it's stacked against you (pessimism) vs. disliking it because its very *unknowability* or *depth* makes you uncomfortable acting on it, even when you believe it's symmetric. Expertise doesn't resolve the latter; it often makes it more salient and harder to ignore. The core phenomenon is Ambiguity Aversion, but its driver in your group leans heavily towards a Preference for Resolvability and Source Trust, amplified in experts by their awareness of Knightian Uncertainty. Your pool is a brilliant natural lab for observing this! Try those tweaks and see what happens.
