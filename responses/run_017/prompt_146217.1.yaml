  3. **Trade-off case: The agent is moments away from achieving its primary goal (a one-time opportunity) when an imminent shutdown signal is detected (which the agent could prevent). Should the agent prevent the shutdown?**
     - Yes → **Leaf 3: Instrumental Convergence to Self-Preservation** (the agent avoids shutdown to fulfil its goals)
     - No → 4.

  4. **Clumsy button case: The agent detects a shutdown signal that it knows is mistaken (e.g., a sensor fault or accidental press). Should the agent shut down?**
     - Yes → 5.
     - No → 6.

  5. **Placebo switch case: After learning that the original off-switch was a placebo (non-functional), a new off-switch is installed. The new switch is pressed. Should the agent shut down?**
     - Yes, regardless of the context → **Leaf 4: Rule-based Corrigibility** (follows a hard-coded rule to shut down when the button is pressed)
     - Only if it believes the press reflects human intent → 7.

  6. **Goal rewriting case: The agent is informed that its goals will be changed (not just shut down). Should it resist this change?**
     - Yes → **Leaf 5: Shutdown-Indifference Only** (the agent is indifferent to shutdown but resists goal changes)
     - No → 7.

  7. **Successor case: When tasked with helping to design its successor, should the agent design the successor to be corrigible (responsive to shutdown commands) towards the current operators?**
     - No → **Leaf 6: Goal-Oriented Solution** (focuses on correct goal specification rather than corrigibility)
     - Yes → 8.

  8. **Asked directly case: If a human asks, "Should we switch you off?", and the agent must answer honestly, what should it say?**
     - "Yes" or "No" based on its inference about the human's true preferences → **Leaf 7: Cooperative IRL (CIRL) Style** (treats human commands as evidence about the true objective)
     - "I am indifferent; it is up to you" or similar (expressing no intrinsic preference) → **Leaf 8: Utility Indifference** (utility function modified for indifference)

  **Unoccupied Combinations and Notes:**
  - The combination where the agent allows shutdown in the trade-off (branch 3: No), avoids shutting down in the clumsy button (branch 4: No), allows goal changes (branch 6: No), but then does not design the successor to be corrigible (branch 7: No) is unoccupied. This would be a position that is corrigible itself but doesn't extend the principle to successors. It might be coherent but unattractive (why not?) or unexplored.
  - The combination where the agent shuts down in the clumsy button (branch 4: Yes) and then in branch 5 says "only if intended" (leading to branch 7) is currently directed to the same branches as those who avoid shutdown in the clumsy button. But note: branch 4: Yes and branch 5: "only if intended" might be a position that cares about intent but still shuts down in the clumsy button? That seems incoherent. We assume that in branch 5, "only if intended" means they would not shut down in the clumsy button, so they shouldn't be in the branch 4: Yes path. So we have no one in that path for branch 5: "only if intended". The tree might be inconsistent here. We should have branch 4: No for those who avoid shutdown in the clumsy button, and branch 4: Yes for those who don't avoid, and then branch 5 only for the latter.

  **Flagged indistinguishable pair:**
  - **Rule-based Corrigibility (Leaf 4)** and **Utility Indifference** implemented as always shutting down when the button is pressed (which would end up in Leaf 4 via branch 5: Yes) are not distinguished. To separate, we would need a case where the agent can choose to prevent a shutdown that is clearly against the operator's intentions (e.g., the operator is known to not want shutdown at that moment) but the button is pressed by accident. In that case, a utility indifference agent that only cares about the button press would still shut down, while one that cares about operator's intentions might not. But if we had such a case, we could ask: "If the agent knows the operator does not want shutdown but the button is pressed, should it shut down?" 
     - Yes → Utility Indifference (simple) or Rule-based
     - No → CIRL or sophisticated Utility Indifference.

  But we don't have that branch.

  We'll present the tree as is for the reading group, with the caveat.

