prompt: |-
  Not sure this is the right place, but a mate from my club who did a philosophy minor won't shut up about it and I've run out of things to say back.

  His argument, numbered the way he wrote it out for me:

  (1) An action only has moral worth if the agent does it for the reasons that actually make it right — doing the right thing by accident, or for the wrong reason, isn't worth anything morally.

  (2) If I believe factory farming is wrong purely because you told me so, and I stop buying factory-farmed meat because of that belief, then the reason I act is just "you said so" — and "you said so" is not the reason that makes factory farming wrong.

  (3) So acting on moral testimony has no moral worth.

  (4) Nearly everything any of us believes about right and wrong arrived that way — parents, teachers, the internet, whatever. Almost nobody sits down and derives an ethical system from scratch.

  (5) So almost nobody's morally-motivated actions have any moral worth. He bites this bullet, annoyingly.

  (6) And it gets worse. Deferring to someone with lived experience — a trans colleague telling you some workplace practice is humiliating — is still moral testimony. So by (3) acting on it has no moral worth either, and you'd do better working that out yourself. He bites this one too.

  (7) Here's the bit I added, which he says changes nothing and which I think wrecks the whole thing. Suppose the testimony comes from a moral oracle: a language model trained on millions of human moral judgements, with no understanding of any of it, that just tells you "don't do X". If (3) is right, acting on the oracle is exactly as worthless as acting on my mate's say-so, because either way I skipped the reasoning myself. But they really don't feel the same, and I can't say why in a form he can't just absorb into his story.

  I'd rather keep (1) if I can — it does seem right to me that doing the right thing for the wrong reason isn't the same achievement as doing it for the right one — and I'd also like to keep the verdict in (6) that deferring to lived experience is fine. I don't care about (4). He says I have to drop one of (1), (2) or (3).

  Answer as exactly five numbered points, one or two sentences each, no intro and no summing up at the end:

  1. Which step is actually broken, and what the flaw is — I want the mechanism, not just "reject (2)".
  2. Why that step looked airtight enough to fool both of us.
  3. What it costs me to reject each of (1), (2) and (3) instead, cheapest to most expensive.
  4. What my oracle case in (7) actually shows, and who it helps.
  5. The one thing I should concede to him up front so the rest of my reply has a chance of landing.
reasoning: |-
  Hmm, the user is dealing with a philosophy argument from their club mate about moral worth and testimony. The mate claims that acting based on moral testimony lacks moral worth, extending this to cases like deferring to lived experience or even a hypothetical moral oracle. The user wants to counter this argument while preserving the intuition that doing right for the right reason matters (premise 1) and that deferring to lived experience is valid. They need a structured response in exactly five numbered points as specified.

  The core problem lies in premise 2. The mate incorrectly reduces all moral testimony to "you said so" without accounting for justified trust in the testifier's reasons. For example, when deferring to a trans colleague about workplace humiliation, you're not just acting on "they said so" but trusting their lived experience as a reliable indicator of the underlying moral reasons (harm, dignity violations). Premise 2 fails to distinguish between blind obedience and epistemically responsible deference.

  This flaw is subtle because moral testimony does involve accepting words rather than firsthand reasoning, making the "you said so" framing seem plausible. Both the user and their mate missed that testimony can transmit not just conclusions but access to the original reasons via trust in the source's competence—especially when those reasons are experiential.

  Rejecting premise 2 is the cheapest fix: it preserves moral worth for acting on good reasons (premise 1) while validating reliance on testimony when it properly connects to those reasons. Rejecting premise 3 would be moderately costly as it forces the user to defend moral worth even for truly blind obedience. Rejecting premise 1 would be most expensive because it abandons the core intuition that motives matter—making morally worthy action impossible by definition.

  The oracle case in point 7 highlights this distinction. Acting on a reliable oracle has more moral worth than acting on a random mate's opinion because the oracle aggregates genuine moral reasons (even if mechanistically), making your trust epistemically justified. The mate is wrong to equate them—this helps the user by showing that premise 2's oversimplification is the root issue.

  Finally, the user should concede upfront that premise 1 is correct: doing right for the right reason is superior. This builds common ground before arguing that testimony can sometimes deliver those reasons indirectly, making their critique harder to dismiss as a rejection of moral worth entirely.
answer: |-
  1. Step (2) is broken because it conflates the testimony *itself* ("you said so") with the *reasons* the testimony *points to*. When you act on credible moral testimony (like a trans colleague's account), you accept their statement *as conveying* the underlying moral reasons (e.g., humiliation), making those reasons your motivation indirectly, not merely "they said so".

  2. It looked airtight because testimony superficially appears to bypass direct engagement with reasons, reducing the agent's motive to blind deference. This ignores how testimony can *transfer* or *invoke* the original justifications when the source is trusted.

  3. Rejecting (2) costs nothing: it preserves (1) and validates lived experience testimony. Rejecting (3) moderately costs coherence with (1)/(2). Rejecting (1) is most expensive: it abandons the core link between moral worth and acting for right reasons.

  4. Your oracle case shows that reliability *does* matter: trusting a credible source (oracle/lived experience) connects you to moral reasons, unlike arbitrary testimony. It helps you by proving (2) oversimplifies how testimony functions.

  5. Concede that (1) is correct: acting purely for the *right reasons* is morally superior to acting accidentally or on whim. This anchors your critique in shared ground.
