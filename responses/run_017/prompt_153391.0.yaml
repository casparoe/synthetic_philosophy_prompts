prompt: |-
  Act as a professional philosopher who specializes in normative ethics and decision theory under deep uncertainty, and who has also spent time advising real committees that have to make recurring choices without good forecasting. Please think carefully before you write: start by brainstorming two or three different ways one might operationalize consequentialist cluelessness for a group with no technical training, name the main failure mode of each candidate, and then commit to the one you think is strongest and write that up. I care much more about your reasoning for the choice than about a tidy final product, so keep the discarded options visible in your answer.

  Context: I am a senior at a large public high school, and I chair the allocations committee of our student service council. Every semester we decide how to spend about $4,000 and how to deploy roughly thirty volunteer slots per week across a dozen ongoing projects and new proposals. The committee is six students aged fifteen to eighteen with no training in statistics or economics, plus a faculty advisor who mostly stays out of it. We get one fifty-minute meeting per decision cycle, our choices have to be explainable in plain language to the student body and to the advisor, and while each semester's decision is final once made, the whole exercise repeats every semester and has for years, so a reusable procedure would be genuinely worth a lot to us.

  The problem is that we argue in circles. Half of every meeting is people insisting their favorite project obviously does good, and the other half is people pointing out that we have no idea what the downstream effects actually are, that the counterfactual is never what people assume, and that after six years nobody has ever measured anything. I recently ran into the philosophical version of this worry — the idea that for a lot of ordinary actions we cannot even tell whether the long-run consequences are net positive or net negative, so straightforward expected-value reasoning has nothing to grip on — and it matches our deadlock almost exactly. But that literature is mostly about what we cannot know, and I need something that tells us what to do on a Tuesday afternoon.

  What I want is a written decision procedure we could actually run in the time we have. Please include all of the following:

  Ordered questions to ask about a proposal, with a stated stopping rule for each: what counts as a sufficient answer, when the answer sends the proposal back for revision, and when the answer means no.

  A working distinction between two kinds of uncertainty that I want kept separate throughout: not knowing how big an effect is, versus not knowing whether the effect is good or bad at all. My sense is that these call for different responses and that much of our arguing comes from conflating them, but I would like you to say whether I am right and to build the distinction into the procedure rather than just mentioning it.

  An explicit instruction for what to do when we cannot get a number at all, which is most of the time. If the honest answer is that some step is a judgment call dressed up as a procedure, say so on the step itself rather than in a disclaimer at the end.

  A concrete rule for comparing several proposals when all of them are sign-uncertain. I have heard the suggestion that in such cases one should prefer options that do reasonably well across many different plausible ways the world could be, rather than maximizing under a single best guess. Make that operational for us: how many distinct scenarios should we actually write down, where should they come from, and at what point does writing down more scenarios stop being informative and start being theater for the minutes?

  A ruling on two tempting escapes that come up constantly in our meetings. First, the claim that our contribution is small relative to everything else, so it cannot matter much and we should just do whatever feels good. I want to know whether smallness gets us out of cluelessness or only out of questions about magnitude, and how your procedure treats grant sizes that differ by an order of magnitude. Second, the claim that declining to fund something is the safe default because doing nothing has no consequences to be wrong about.

  A position on the unit of evaluation. Should the procedure be applied proposal by proposal, or to the whole semester's allocation as a bundle, and does the answer change how we should treat a portfolio of proposals whose expected effects might partly cancel?

  Three worked applications, run step by step so I can see where each one exits the procedure. A: continuing Homework Heroes, our weekly peer tutoring program at a partner middle school, which has run for six years, consumes about $1,500 and eight volunteers per week, is the most-loved thing we fund, and has never been evaluated in any way. B: giving the entire semester's budget to a local food pantry that we know is distribution-constrained rather than money-constrained. C: funding a student-led campaign to pressure the district into later school start times, which is cheap, diffuse, long-run, and wildly uncertain in both size and direction. I am fairly confident the honest application of any decent procedure will come out against A, and I want to see that worked through rather than softened, because A is what the committee will defend hardest.

  A short section on what the procedure cannot do, including the cases where it should hand the decision back to a vote because the remaining disagreement is about values rather than facts, and note how the committee should tell the difference.

  One complication I would like addressed if it fits anywhere natural: the procedure's own effects. Spending fifty minutes deliberating is itself an action with uncertain consequences, and the procedure will change what kind of people the committee members become. I do not know whether that belongs inside the procedure or as a note on it, so put it where you think it goes and say why.

  Finally, an epistemics section. For each substantive step of the procedure, give one line on how confident you are that following it would actually make our decisions better rather than merely more defensible-sounding, and then single out the one step you are least confident about and say what kind of evidence or argument would change your mind about it. Please do not give me a reading list, bibliography, or citations; I have no access to academic sources, so if you mention any named view or figure, explain it in your own words in the same breath.
reasoning: |-
  Hmm, the user is a high school student chairing an allocations committee dealing with real-world ethical decision-making under deep uncertainty. They're grappling with philosophical "consequentialist cluelessness" in practice - how to allocate limited resources when long-term impacts are unknowable. 

  Their committee struggles with endless debates about unmeasurable impacts and counterfactuals. What they need is a practical decision procedure that fits within 50-minute meetings, requires no technical expertise, and produces defensible allocations. The core tension is between idealism ("this feels good") and skepticism ("we can't know anything").

  Key constraints I must honor:
  - Must separate magnitude uncertainty (how big?) from sign uncertainty (good/bad?)
  - Must handle proposals with zero measurable data
  - Need concrete rules for comparing sign-uncertain options
  - Must address common fallacies like "small contributions don't matter"
  - Requires worked examples showing unpopular outcomes
  - Needs epistemic transparency about the procedure's weaknesses

  Brainstorming approaches:
  1) Expected value proxy: Assign rough numerical scores for impact likelihoods. Failure: Forces false precision where none exists.
  2) Multi-criteria scoring: Rate proposals on dimensions like reach, equity. Failure: Still conflates magnitude/sign uncertainty.
  3) Robust satisficing: Focus on avoiding bad outcomes rather than maximizing good. Strongest because it embraces uncertainty rather than papering over it.

  The robust satisficing framework works because:
  - Uses "plausible harm" as stopping condition (handles sign uncertainty)
  - Requires concrete evidence of mechanisms (avoids wishful thinking)
  - Uses scenario testing with just 3 worlds: optimistic/pessimistic/status quo
  - Explicitly treats "no harm" as necessary but not sufficient
  - Bundle evaluation prevents portfolio blindness

  For the worked examples:
  A) Homework Heroes fails - no evidence it doesn't cause harm (e.g. dependency)
  B) Food pantry passes - clear mechanism, harm unlikely
  C) Start times campaign fails - sign uncertainty too high

  The epistemology section is crucial here. I'm least confident about the "harm scenario" step - it risks being too subjective. But requiring concrete mechanisms helps. If behavioral studies showed groups reliably imagine implausible harms, I'd revise.

  The procedure's self-awareness matters too. By training students to think in terms of harm prevention, it cultivates caution - which may be good or bad depending on context. That belongs in the limitations section.

  Biggest challenge will be making the rejection of their beloved tutoring program feel fair rather than bureaucratic. The worked example must show exactly where sentiment fails the test.
answer: |-
  Here is a decision procedure designed for your committee, grounded in robust satisficing under deep uncertainty. I'll first present the three candidate approaches I considered, their failure modes, my choice, and then the full procedure with your requested elements.

  **Brainstormed Approaches & Their Failure Modes:**
  1.  **Expected Value Proxy:** Assign qualitative scores (e.g., 1-5) for "estimated impact size" and "confidence in sign," multiply them, and prioritize high products.
      *   *Failure Mode:* Conflates magnitude and sign uncertainty artificially. High confidence in a *wrong* sign leads to disastrous choices. Encourages false precision.
  2.  **Minimax Regret:** Focus on avoiding the worst-case outcome. Prioritize proposals where the worst plausible outcome is least bad.
      *   *Failure Mode:* Paralyzing if *any* proposal has a catastrophic worst case (likely true for complex social interventions). Overly pessimistic, neglects potential for significant good. Hard to define "worst plausible."
  3.  **Robust Satisficing (Chosen Approach):** Seek options that achieve a "good enough" outcome ("satisficing") across a wide range of plausible future scenarios ("robust"), avoiding options with high risk of significant harm. Prioritizes avoiding known bads over speculative goods under sign uncertainty.
      *   *Failure Mode:* Defining "good enough" and "plausible" is subjective. Risks excessive conservatism if standards are too high. Requires disciplined scenario generation.

  **Why Robust Satisficing?** It directly addresses sign uncertainty by demanding evidence against harm *before* considering magnitude. It embraces uncertainty (multiple scenarios) without demanding unattainable precision. It aligns with limited time/resources by focusing on threshold judgments. It naturally separates magnitude and sign concerns. It's more defensible publicly ("we chose things unlikely to cause harm and likely to do some good in many situations").

  ---

  **The Procedure: "Harm-Avoidant Robust Satisficing" (HARS)**

  **Core Principle:** We will only fund proposals that (1) have a **credible mechanism** for doing good, and (2) lack **credible evidence or plausible scenarios** suggesting they cause significant net harm. Among proposals passing this filter, we prioritize those expected to do the most good across plausible futures, acknowledging our uncertainty.

  **Key Distinction Maintained:**
  *   **Magnitude Uncertainty:** "We don't know *how much* good/bad it will do." (Handled by satisficing & scenario ranges).
  *   **Sign Uncertainty:** "We aren't confident it does net good *at all*; it might do net harm." (Handled by the Harm Screen).

  **Decision Steps (Run sequentially for each proposal or bundle):**

  1.  **Harm Screen:**
      *   *Question:* "Is there a *credible mechanism* or *plausible scenario* by which this proposal could cause significant net harm to the intended beneficiaries, others, or important values (e.g., equity, sustainability)?"
      *   *Sufficient Answer (Pass):* Committee agrees no such *credible* mechanism or *plausible* scenario exists. "We can't imagine a realistic way this causes major harm."
      *   *Revise:* A specific, plausible harm mechanism is identified that could be mitigated (e.g., "Tutoring creates dependency? Maybe add training on fostering independence."). The proposer must address the mitigation.
      *   *Stop/Reject:* A credible, unmitigated harm mechanism or plausible scenario for significant net harm is identified and cannot be resolved (e.g., "Campaign might polarize the community, derailing other support.").
      *   *Judgment Call Note:* "Plausible" means more than just logically possible; it should be based on analogous experiences, basic logic, or stakeholder concerns. Focus on mechanisms, not just vague fears.

  2.  **Good Mechanism Check:**
      *   *Question:* "Is there a *credible mechanism* by which this proposal is likely to cause *some* net good for the intended beneficiaries?"
      *   *Sufficient Answer (Pass):* A clear, logical chain links the activity to a positive outcome (e.g., "Food pantry money buys food eaten by hungry people").
      *   *Revise:* The link is unclear or indirect (e.g., "Later start times *might* improve grades... somehow"). Proposer must clarify the causal logic.
      *   *Stop/Reject:* No credible mechanism for net good exists (e.g., funding something completely irrelevant to claimed goals).
      *   *Judgment Call Note:* This sets a low bar – "some net good" via a believable process. It doesn't require proof of large magnitude.

  3.  **Robust Satisficing Scenarios (For Passing Proposals):**
      *   *Task:* Evaluate the proposal against **3 distinct, plausible future scenarios**:
          1.  **Optimistic:** Things go better than expected (e.g., high participation, supportive environment).
          2.  **Pessimistic:** Things go worse than expected (e.g., low participation, implementation problems, unintended side effects).
          3.  **Status Quo Trend:** Things continue roughly as they are now.
      *   *Question for each Scenario:* "In this scenario, would the proposal very likely achieve at least a 'minimally acceptable' level of good (defined as: clear benefit to some people, proportional to resources used, without major harm)?"
      *   *Sufficient Answer (Pass):* Proposal is judged "minimally acceptable" or better in **at least 2 of 3 scenarios**. (It "satisfices" robustly).
      *   *Revise:* Fails in 2/3 scenarios. Proposer must adjust the proposal to improve robustness (e.g., scale down, add safeguards, target differently).
      *   *Stop/Reject:* Fails in all 3 scenarios, or revisions don't improve robustness sufficiently.
      *   *Judgment Call Note:* Defining "minimally acceptable" is key. Base it on: number of people meaningfully helped, importance of the need addressed, efficiency compared to rough alternatives. *Magnitude uncertainty is handled here via ranges within scenarios.*
      *   *Scenarios Source:* Brainstormed by the committee based on: past experience, common sense, known challenges/opportunities, stakeholder perspectives (ask teachers, community partners!). Limit to 3 to avoid theater; focus on *divergent* possibilities.

  4.  **Comparison & Allocation (For Passing Proposals):**
      *   *Task:* Compare proposals based on their **expected performance across the 3 scenarios**.
      *   *Method:* Use a simple table. For each proposal, assign a qualitative rating per scenario (e.g., Low/Med/High Good, or 1-3 stars) based on *magnitude* of expected net good, assuming the sign is positive (vetted by Steps 1 & 2). **Sum the ratings across the 3 scenarios.**
      *   *Rule:* Allocate resources (money/volunteers) to proposals with the highest sums until resources are exhausted. Prioritize higher sums.
      *   *Scale Handling:* Proposals requiring vastly more resources (e.g., 10x) must show proportionally higher expected good (reflected in higher scenario ratings). A $4000 proposal needs to promise *much more* good than a $400 one to score similarly.
      *   *Judgment Call Note:* This comparison is inherently uncertain. Summing scenario ratings prioritizes options resilient across different futures and helps break ties. The unit is the *proposal bundle* – evaluate how the *whole package* of funded proposals performs across scenarios. Look for complementarity (e.g., one does well in Optimistic, another in Pessimistic) and avoid obvious conflicts/cancellation (rare at your scale).

  **Ruling on Tempting Escapes:**
  *   **"Too Small to Matter":** Reject. *Sign uncertainty remains:* even small acts can have unforeseen negative ripple effects or support harmful systems (Harm Screen catches this). *Magnitude* might be small, but that's handled in Satisficing (Step 3) – does it still do *enough* good to be worth it? Smallness doesn't excuse cluelessness about potential harm.
  *   **"Doing Nothing is Safer":** Reject. "Doing nothing" is also an action with consequences! Failing to fund an effective pantry means hungry people stay hungry. The counterfactual (what happens if we *don't* fund this?) must be considered in the Good Mechanism (Step 2) and Scenarios (Step 3). The Harm Screen (Step 1) applies equally to action and inaction (e.g., is *withholding* funds causing harm?).

  **Worked Applications:**

  *   **A: Homework Heroes (Tutoring)**
      1.  **Harm Screen:** *Question:* Could it cause harm? *Plausible Scenario:* Tutored students become dependent, lose confidence in self-learning; Volunteers neglect own studies. *Answer:* Credible harm mechanism exists. *Result:* **Revise or Reject.** (Committee must propose mitigations: e.g., training on fostering independence, tutor time limits. If no credible mitigation, **Reject**.) *Harsh Truth:* Beloved but unevaluated. Harm potential is real and unaddressed.
      2.  *(If Revised & Harm Screen Passes)*: Proceed to Steps 2-4. Good Mechanism (help with homework improves understanding) likely passes. Scenarios: Might satisface (e.g., Med in Optimistic, Low in Pessimistic, Low in Status Quo). Might pass Step 3 but score modestly in Step 4.

  *   **B: Food Pantry (Full Budget)**
      1.  **Harm Screen:** *Question:* Could it cause harm? *Answer:* Direct purchase of food for hungry people. Plausible harm? (e.g., disincentivize other aid? Unlikely/distant). **Pass.**
      2.  **Good Mechanism:** Money -> Food -> Hungry people eat. Clear causal chain. **Pass.**
      3.  **Scenarios:**
          *   Optimistic: Pantry gets great deals, serves many. Rating: **High (3)**
          *   Pessimistic: Food prices spike, pantry serves fewer. Rating: **Med (2)** (still feeds *some*)
          *   Status Quo: Pantry operates as normal. Rating: **High (3)**
          *   Satisficing: Passes (2/3 acceptable+). Sum = **8**.
      4.  **Comparison:** High sum. Likely funded if resources allow scale.

  *   **C: Start Times Campaign (Advocacy)**
      1.  **Harm Screen:** *Question:* Could it cause harm? *Plausible Scenarios:* Campaign sours relations with district, harming other collaboration; Successful change creates logistical chaos, worsening outcomes. **Credible harm mechanisms exist.** *Result:* **Revise or Reject.** (Mitigations? e.g., collaborative approach vs. pressure; detailed transition plan. Hard to mitigate sign uncertainty fully).
      2.  *(If Harm Screen Passes via Mitigation)*:
      3.  **Good Mechanism:** Pressure -> District changes policy -> Student sleep improves -> Better outcomes. Link is long and indirect (sign uncertainty high even if harm mitigated). *Risk:* **Revise or Reject.** (Hard to strengthen causal chain credibly).
      4.  **Scenarios:** (If it passes Steps 1 & 2) High sign/magnitude uncertainty. Might fail Satisficing (e.g., Low/None in Pessimistic & Status Quo if policy doesn't change or benefits are unclear). Sum likely **Low**.

  **What HARS Cannot Do:**
  *   **Resolve Value Conflicts:** If the committee agrees on facts (mechanisms, scenarios, satisficing level) but disagrees on *what counts as "minimally acceptable" good* or *how bad a harm is*, HARS stalls. This is a values debate. Solution: **Hand back to vote.** Use remaining time for structured discussion focusing *only* on the conflicting values, then vote.
  *   **Predict the Future:** It reduces, not eliminates, cluelessness. It makes uncertainty explicit and manageable.
  *   **Guarantee Optimality:** It seeks defensible, robustly acceptable choices, not the theoretical best.
  *   **Handle Extreme Time Pressure Well:** 50 mins is tight. Chair must enforce time limits per step/proposal ruthlessly.
  *   **Evaluate Very Long-Term/Abstract Impacts:** Focuses on foreseeable mechanisms and plausible scenarios within a relevant timeframe (e.g., 1-5 years).

  **Procedure's Own Effects (Complication):**
  *   **Included in Limitations:** Add explicitly: "HARS may cultivate a risk-averse or skeptical mindset in committee members over time, potentially undervaluing high-risk/high-reward or novel initiatives. Be mindful of this bias in future cycles; periodically review if the procedure itself is causing stagnation." *Why here?* It's a meta-consequence of *using* the procedure, not a factor *within* evaluating specific proposals. It's a limitation to be managed by the committee consciously.

  **Epistemics & Confidence:**
  For each substantive step, confidence it improves decisions (not just defensibility):
  1.  **Harm Screen:** **High Confidence.** Focusing on avoiding foreseeable harm is fundamental to responsible action under uncertainty. Prevents clear mistakes.
  2.  **Good Mechanism Check:** **Medium-High Confidence.** Ensures resources aren't wasted on activities with no logical path to good. Low bar avoids unnecessary rejection.
  3.  **Robust Satisficing Scenarios (3 Worlds):** **Medium Confidence.** Explicitly considering multiple futures prevents over-reliance on one guess. Using only 3 scenarios balances rigor and feasibility. Satisficing avoids false precision.
  4.  **Comparison via Scenario Sum:** **Low-Medium Confidence (Least Confident Step).** *Why?* Summing qualitative ratings is crude. It assumes scenarios are equally likely/important, which they rarely are. Magnitude estimation (ratings) is still highly subjective. *What would change my mind?* Evidence that simpler comparisons (e.g., voting after Steps 1-3) or more structured qualitative assessments (e.g., SWOT across scenarios) produce more resilient allocations in similar group settings. Or evidence that the summing consistently undervalues critical niche options or overvalues mediocre-but-consistent ones.

  **Final Note:** HARS is a *tool* for structuring discussion and forcing concrete justifications under uncertainty. Its power comes from consistent application. Use a whiteboard for the Harm/Good checks and scenario tables. Be prepared for the Homework Heroes outcome – the procedure works precisely because it surfaces these uncomfortable truths. Good luck!
