  - Avoid loaded metaphors without naming their function if used.
  - Tone: warm, funny, grateful—not a lecture or confession. Parents should leave proud; the activity must seem valuable.
  - Hand something usable to the incoming sophomore captain about resisting temptation.
  - No direct quotes; paraphrase philosophical ideas vaguely.

  Breaking this down:
  First, the speech needs structure: gratitude (coach, team), the ethical insight (framed as growth), the demonstration (live test), and a forward-looking close. The retiring coach is pivotal—tying the lesson to his mentorship makes it uplifting, not self-flagellating. 

  For the example, using their semifinal case risks exposing the "trick," so I'll create parallel examples: 
  - The vivid "Lena" scholarship story (emotional) vs. stripped-down version (dry numbers). Show intuition shifts.
  - A counterexample: e.g., pushing someone off a bridge to stop a trolley—details like their job shouldn’t matter. Proves not all thought experiments are manipulative.

  Live demonstration: Ask the audience to judge a scenario (e.g., diverting a train), then flip one irrelevant detail (named victim vs. "Person A"). If verdict changes, it’s rhetorical; if not, evidential. This involves parents and makes it engaging.

  Metaphor problem: If calling vivid details "spotlights," immediately add they "illuminate but can blind"—naming the metaphor’s dual role. Keeps it transparent.

  Tone solutions: 
  - Humor: "our team argues so much we’d debate the dessert menu."
  - Gratitude: Coach’s legacy as teaching "how to think, not what to think."
  - Reframe the semifinal not as guilt but as learning—"this tool requires care." 
  - Incoming captain: Pass the "one-detail flip" as a baton for ethical rigor.

