prompt: |-
  I work on a small product team that is localizing a mental-health app for a language with no established everyday single-word equivalent for burnout: the nearest available resources are a borrowed clinical term and idioms about heaviness or pressure in the body. At a design review a senior colleague ended a long discussion with "language shapes thought — that's established, isn't it," and drew two conclusions from it in the same breath: first, that speakers of that language do not presently undergo what we call burnout in quite the way we do, and second, that if we ship a well-chosen term of our own, users will become able to notice, name, and report it. The slogan did an enormous amount of work in about four seconds, and I suspect it did it by sliding between claims of very different strength.

  Please disambiguate it for me. I'm on a locked-down work laptop with no library access, so give me no citations, no study names, and no suggestions for further reading: where a reading turns on evidence, describe the kind of finding that would support or refute it rather than who found it. The distinctions I care about include: whether the claim is about what people can represent at all versus what they habitually notice, recall, or bother to say; whether it concerns only the moment of preparing to speak or write versus standing habits of attention versus the concepts themselves; whether language is being offered as a cause of cognitive differences or as something in terms of which the contents of thought are individuated; and whether "shapes" means makes possible, makes easier, makes salient, or makes social. Please also mark off the readings that are too vague or too hedged to have any consequences, and tell me honestly which of them most people have in mind when they say the sentence.

  Structure your reply as follows:

  1. "The readings, weakest to strongest" — about 450 words, as a numbered menu. For each: a one-sentence statement of the precise thesis, a verdict (platitude, defensible, contested, or false), and whether it supports the first conclusion, the second, both, or neither.
  2. "What my colleague's two conclusions would each require" — about 200 words: the strongest reading each conclusion needs, and how far that reading is actually supported.
  3. "What would settle it" — about 150 words: two or three concrete probes, of the sort one could run or look for without a research library, that discriminate between the readings that are still live.
  4. "The one-sentence version" — about 60 words: something I can say in the next meeting that is accurate and still gets us a decision.
reasoning: |-
  Hmm, the user is part of a team localizing a mental health app and facing a linguistic challenge with the term "burnout." Their senior colleague made a claim about language shaping thought to justify two conclusions: that speakers of this language don't experience burnout the same way, and that introducing a new term will change how users perceive it. The user needs help unpacking this claim's ambiguity.

  The user is concerned about the colleague's reasoning. The colleague used "language shapes thought" to imply both that the absence of a word means the experience doesn't exist in the same way, and that adding a word will create the ability to recognize it. The user suspects this slogan is doing too much work by sliding between weak and strong interpretations.

  I need to disambiguate "language shapes thought" for them. Their constraints are important: no citations, no study names, no further reading suggestions due to work laptop restrictions. I'll describe types of evidence without specifics. The key distinctions they care about include: whether language affects representation vs. habitual noticing; if it's about speech preparation vs. attention vs. concepts; if language causes cognitive differences or just individuates thought; and what "shapes" means (enables, facilitates, highlights, or socializes).

  I'll structure my response as they requested: readings from weakest to strongest, what each conclusion requires, how to settle it practically, and a concise one-sentence version for their meeting.

  For the readings, I'll identify a spectrum from weakest to strongest interpretations of "language shapes thought." Starting with the weakest: language as a tool for communication that doesn't fundamentally alter thought (a platitude). Then moving to stronger versions like habitual noticing or recall being influenced by language (defensible), language affecting attention and memory (contested), and the strongest being linguistic determinism where language dictates what can be thought (largely false). For each, I'll note whether it supports their colleague's first conclusion (no equivalent experience), second (introducing a term creates recognition), both, or neither.

  For the conclusions: The first requires a moderate to strong reading where language constrains habitual noticing, but that's contested and not fully supported. The second conclusion requires a strong reading where language creates new conceptual abilities, which is almost unsupported. Neither conclusion is well-founded based on current understanding.

  To settle it, I suggest practical probes: observe existing idioms to see if they capture burnout-like experiences; test recognition of the concept without the new term; and monitor how usage evolves after introduction. This helps distinguish between language facilitating expression versus fundamentally changing thought.

  Finally, for the one-sentence version, I'll craft something balanced: acknowledge that introducing a term can make discussing burnout easier, but we shouldn't assume it changes the underlying experience or that the experience was previously unrecognized. This keeps the team moving forward without endorsing unsupported claims.
answer: |-
  Here’s the disambiguation structured as requested:

  ### 1. The readings, weakest to strongest  
  *(Ordered by conceptual strength, weakest first)*  

  1. **Weakest: Language merely reflects thought and is a tool for communication.**  
     *Thesis:* Language labels pre-existing concepts for efficient sharing; lacking a word doesn’t mean the concept is absent, only that it’s less convenient to discuss.  
     *Verdict:* Platitude. Supports **neither** conclusion.  

  2. **Weak: Language influences what people habitually notice or bother to verbalize.**  
     *Thesis:* Words act as cognitive shortcuts, making labeled concepts easier to recall, report, or socially validate, but the underlying experience exists independently.  
     *Verdict:* Defensible. Supports **second conclusion only** (introducing a term aids reporting).  

  3. **Moderate: Language shapes real-time attention and memory during speech acts.**  
     *Thesis:* Preparing to speak focuses attention on word-compatible features of experience, altering immediate perception and recall, but not enduring concepts.  
     *Verdict:* Contested. Supports **second conclusion weakly** (aids reporting), **not the first**.  

  4. **Strong: Language restructures standing habits of attention, shaping concepts long-term.**  
     *Thesis:* Repeated use of labels trains persistent cognitive habits, making certain distinctions salient and "natural" over time, though not inevitable.  
     *Verdict:* Contested. Supports **both conclusions partially** (affects recognition/description; doesn’t prove absence).  

  5. **Strongest (Linguistic Determinism): Language constrains what can be conceived or experienced.**  
     *Thesis:* Concepts are indivisible from their linguistic labels; no word means no capacity to represent the experience *as such*.  
     *Verdict:* False for complex experiences like burnout. Supports **first conclusion falsely**, **second questionably** (implies creation, not labeling).  

  **What most people mean:** Typically #2 or #4 – language makes things easier to discuss (#2) or subtly trains attention (#4), but rarely full determinism (#5).  

  ---

  ### 2. What my colleague's two conclusions would each require  
  **First conclusion ("Speakers don’t undergo burnout like we do"):**  
  Requires #4 or #5 – that lacking a term means the experience is either fundamentally inaccessible or consistently overlooked. **Support is poor:** #4 is contested (habit-shaping isn’t guaranteed), #5 is false. Bodily idioms suggest recognition exists without the clinical label.  

  **Second conclusion ("Our term will enable noticing/reporting"):**  
  Requires #2, #3, or #4 – that introducing a term aids articulation, attention, or habit formation. **Support is moderate for #2/#3, weak for #4:** Evidence shows labels improve reporting and discussion (defensible), but not that they reliably create new concepts or sustained attention shifts (contested).  

  ---

  ### 3. What would settle it  
  **Probe 1: Test recognition without the label.**  
  Describe burnout symptoms using existing idioms (e.g., "heavy dread that work won’t relieve"). If users consistently identify it as a distinct pattern, #1/#2 hold; failure weakly supports #4/#5.  

  **Probe 2: Track usage evolution.**  
  After introducing the clinical term, monitor if it *replaces* bodily idioms or is used *alongside* them. Replacement suggests the term captures a novel nuance (#4); coexistence suggests it’s a synonymic tool (#2).  

  **Probe 3: Measure reporting frequency.**  
  Compare user reports of burnout-like symptoms pre- and post-term introduction *with identical onboarding*. A spike supports #2/#3 (ease of reporting); no change undermines #2–#5.  

  ---

  ### 4. The one-sentence version  
  "While a well-chosen term can make discussing burnout easier and more precise, we can’t assume its absence proves the experience is fundamentally different—so let’s test how our users already describe these states and whether the new term adds clarity or creates confusion."
