            Optimistic: [20%,30%] -> then the entire interval is below or at 30%? Actually, at 30% we are at break-even. So by interval dominance, we do not act (because the entire interval is not above 30%: the upper bound is 30% and we require L>30% to act, which is false). But note: the optimistic scenario interval [20%,30%] includes 30%, so still indeterminate? 

            However, the rule: 
              In the optimistic scenario: 
                L_opt=20% < 30% and U_opt=30% -> so we do not act? Because we only act if L_opt>30%? No, we are not making a decision for the optimistic scenario; we are using the base interval for the decision. The swing is just for information.

          The duty officer sees that the base interval is [25%,35%] and the pessimistic scenario is [35%,45%] (which would require acting). They might reason that the risk of being wrong (if the true probability is 35%) is too high, so they choose to buy the easements.

          The procedure does not kill the project; it forces the duty officer to take responsibility for the decision.

   13. **Implementation Note**

       We require that every model and expert provides:
          - A base interval (50% credible interval) for the probability of exceeding the levee crest.
          - For the contested assumption, they must also provide:
               - An optimistic interval (setting the assumption to the risk-reducing value)
               - A pessimistic interval (setting the assumption to the risk-increasing value)

       The procedure:

          Step 1: Collect the base intervals from all sources (models and experts). Compute the base aggregate interval: [min_base, max_base] = [min(all lower bounds), max(all upper bounds)].

          Step 2: Collect the optimistic intervals. Compute [min_opt, max_opt].

          Step 3: Collect the pessimistic intervals. Compute [min_pess, max_pess].

          Step 4: For each decision threshold T, apply the interval dominance rule to the base interval.

          Step 5: Fill the one-pager.

       Time: This requires each modeler to run three scenarios (if they haven't already) and each expert to provide three intervals. The aggregation is quick (taking min and max of a few numbers). The duty officer then reviews the one-pager and makes a decision on the inconclusive cases.

       We assume the models and experts can produce these intervals in advance or very quickly.

   14. **Conclusion**

       This procedure addresses the fake precision by reporting an interval that captures model and expert disagreement. It uses interval dominance for decisions, which is simple and relies on the board's thresholds. It incorporates the board's swing requirement by reporting the intervals under the favorable and unfavorable resolution of the most contested assumption. It handles dilation honestly and provides a clear one-pager for the duty officer.

       The main judgment calls are:
          - The choice of 50% interval (we could use 90%, but 50% is more stable and less likely to be extremely wide; but it might not capture tail events). We stick with 50% for simplicity and because it is common. If the team prefers 90%, they can adjust, but note: the interval will be wider and more decisions will be inconclusive.
          - The identification of the contested assumption.
          - The decision in inconclusive cases.

       We believe this procedure meets the constraints and provides a defensible and honest representation of uncertainty.
