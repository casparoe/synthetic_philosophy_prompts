  ### **Imprecise Probability Procedure for Flood-Risk Estimates**  
  **Designed for your team: Simple, executable in 30 mins, fits on one page, and flags judgment calls.**  

  ---

  #### **1. From Disagreement to a Defensible Interval**  
  **Step:** Use the **"Guarded Union"** of all model/expert intervals.  
  - **How:**  
    - Collect 50% credible intervals from all sources (4–5 models + 2 hydrologists).  
    - Take the **lowest lower bound** and **highest upper bound** across all intervals.  
    - *Example:* Models give [10%, 20%], [15%, 25%]; experts give [12%, 18%], [30%, 40%]. Guarded Union = [**10%, 40%**].  

  **Why this works:**  
  - **Defensible:** Captures full uncertainty (no hidden averaging).  
  - **Handles empty intersections:** No averaging when intervals conflict (e.g., [10%, 20%] and [30%, 40%] → [10%, 40%]).  
  - **No philosophy degree needed:** Just calculate min/max in Excel.  

  ---

  #### **2. Models vs. Humans: Does It Matter?**  
  **Short answer:** **No distinction in aggregation.** Treat all intervals equally.  
  - **Why:** Human judgments already contextualize model outputs. Separating them adds complexity without improving accuracy.  
  - **Practical fix:** Label sources on the one-pager (e.g., "Interval based on 5 models and 2 expert assessments").  

  ---

  #### **3. Decision Rule: "Maximin" (Best Worst-Case)**  
  **Plain English:** **Act if the worst-case scenario of *not* acting is worse than the worst-case scenario of acting.**  
  - **How:**  
    - Calculate the cost of **under-preparation** (flood damage if you didn’t act) vs. **over-preparation** (cost of acting unnecessarily).  
    - **Act** if:  
      `(Upper bound of interval) × Cost of under-prep > (1 - Lower bound) × Cost of over-prep`  
    - Use thresholds set by your board (e.g., 15% for pumps, 30% for easements) as proxies for these costs.  

  **Why Maximin for your agency:**  
  - **Public justification:** Focuses on avoiding catastrophic outcomes ("We prioritized preventing loss of life/property").  
  - **Hearing-ready:** "We acted because inaction’s worst case was unacceptable."  
  - **Fits thresholds:** Plug thresholds into the inequality (e.g., at 15%, assume cost of under-prep = 6× cost of over-prep).  

  ---

  #### **4. When the Interval Straddles a Threshold**  
  **Procedure:**  
  1. **Calculate the "decision gap":**  
     - If the interval straddles the threshold (e.g., [12%, 18%] vs. 15% threshold), compute:  
       `Gap = (Threshold - Lower bound) / (Upper bound - Lower bound)`  
       *Example:* [12%, 18%] vs. 15% → Gap = (15–12)/(18–12) = 0.5.  
  2. **Flag for duty officer:**  
     - **Gap < 0.3 → Lean toward ACTING**  
     - **Gap > 0.7 → Lean toward NOT ACTING**  
     - **0.3 ≤ Gap ≤ 0.7 → "Inconclusive: Buy more data"**  
  3. **What data to buy:**  
     - **Fast/cheap:** Satellite soil moisture, short-term rainfall forecasts (available in <1 hr).  
     - **Never delay >24 hrs:** If critical data isn’t timely, defer to Maximin.  

  ---

  #### **5. "We Don’t Know Enough to Act" – How to Write the One-Pager**  
  **Template:**  
  > **Decision: INCONCLUSIVE**  
  > - Probability interval: [X%, Y%] vs. threshold: Z%.  
  > - **Reason:** Evidence spans action/no-action scenarios.  
  > - **Recommendation:** Pre-position monitoring teams; no irreversible actions.  
  > - **Duty officer’s call:** [ ] Act [ ] Don’t act [ ] Monitor and reassess in 24h.  
  > *Justification required:*  

  **Why this works:**  
  - **Board-friendly:** Forces explicit justification (avoids "we don’t know").  
  - **Accountable:** Duty officer signs off, not you.  

  ---

  ### **Handling Special Cases**  
  #### **Case 1: Dilation (Uncertainty Increases with New Data)**  
  **Scenario:** Initial interval = [25%, 35%]. New snowmelt data → widens to [20%, 45%].  
  **How to write the one-pager:**  
  > **Update: Increased uncertainty (dilation)**  
  > - New data revealed conflicting model sensitivities.  
  > - Interval widened from [25%, 35%] to [20%, 45%].  
  > - **Interpretation:** Data ruled out mid-range values; true risk could be higher or lower than before.  
  > - **Action:** Delay irreversible decisions; deploy rapid-assessment team.  

  **Director-friendly spin:** "New data exposed hidden uncertainties, preventing a costly mistake."  

  #### **Case 2: Milburn Bend Easements (Your Pet Project)**  
  **Scenario:** Interval = [28%, 32%] vs. 30% threshold.  
  **Procedure output:**  
  - Straddles threshold → Gap = (30–28)/(32–28) = 0.5 → **Inconclusive**.  
  - **Duty officer’s call:** Leans toward acting if gap <0.3, but 0.5 is neutral.  
  - **Swing figure:** Resolving soil-absorption uncertainty shifts interval to [26%, 30%] (no-action) or [31%, 35%] (action).  

  **Result:** Maximin *doesn’t* kill your project—but flags it for human judgment. Duty officer can approve with justification: "Swing to 31–35% outweighs cost of inaction."  

  ---

  ### **The "Swing Figure" Requirement**  
  **Where it fits:** **Step 1 (interval calculation).**  
  - **How to compute:**  
    1. Identify the #1 contested assumption (e.g., soil saturation). Hydrologists vote if disputed.  
    2. Recalculate all models/experts:  
       - **"Low risk" scenario:** Assume favorable resolution (e.g., dry soil).  
       - **"High risk" scenario:** Assume unfavorable resolution (e.g., saturated soil).  
    3. Report on one-pager:  
       ```  
       Swing figure:  
       - If [assumption] resolves favorably: [X_low%, Y_low%]  
       - If [assumption] resolves unfavorably: [X_high%, Y_high%]  
       ```  
  - **Why it doesn’t wreck the approach:**  
    - **Not a point estimate:** Output is two intervals (avoids fake precision).  
    - **Adds value:** Shows how assumptions drive uncertainty.  

  ---

  ### **The One-Pager Template**  
  ```markdown
  [Reach Name] - [Date]  
  ----------------------------------------------------------------  
  1. INTERVAL: [L%, U%]  
     Sources: [e.g., 5 models, 2 experts]  

  2. SWING FIGURE:  
     - If [assumption] resolves favorably: [L_low%, U_low%]  
     - If [assumption] resolves unfavorably: [L_high%, U_high%]  

  3. DECISION:  
     - Pre-position pumps: [ ] ACT (L > 15%) [ ] DON'T ACT (U < 15%) [ ] INCONCLUSIVE  
     - Buy easements: [ ] ACT (L > 30%) [ ] DON'T ACT (U < 30%) [ ] INCONCLUSIVE  
     *If inconclusive, duty officer must choose:* [ ] Act [ ] Don’t act [ ] Monitor  
     Justification: _________________________  

  4. NOTES:  
     - [e.g., "Dilation occurred after new data"]  
     - [e.g., "Swing figure shows high sensitivity to soil data"]  

  Duty officer: ___________________   Date: _________
  ```

  ---

  ### **What’s Judgment vs. Science?**  
  | **Step**               | **Judgment?** | **Notes**                                  |  
  |------------------------|---------------|--------------------------------------------|  
  | Choosing 50% intervals | Minimal       | Standard engineering practice.             |  
  | Guarded Union          | None          | Mechanical min/max.                        |  
  | Maximin cost ratios    | **Yes**       | Duty officer uses board thresholds.        |  
  | Gap thresholds (0.3/0.7)| **Yes**     | Flagged for duty officer.                  |  
  | Swing-figure assumption| **Yes**       | Hydrologists vote; duty officer breaks ties|  

  **What imprecise probabilities *can’t* do:**  
  - Eliminate uncertainty; only represent it honestly.  
  - Replace board-set thresholds.  
  - Guarantee "optimal" decisions—but ensures *defensible* ones.  

  **Final note:** This method is bulletproof in hearings because it’s transparent, uses board rules, and documents uncertainty. Start testing it on historical cases—I bet Milburn Bend clears the bar.
