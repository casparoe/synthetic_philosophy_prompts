prompt: |-
  I keep going back and forth on guilt vs shame — which is the better one to have around, and whether a culture can actually pick — and I think the only way to make progress is to write down my gut verdicts on a bunch of cases and see what, if anything, they add up to. So here they are, sorry if its a lot.

  1. I snap at my sister on the phone and hang up, then feel bad. Guilt is clearly the right thing here; shame would be wildly out of proportion.
  2. I realize I've been quietly condescending to a coworker for three years — never anything you could point at, just a tone. Verdict: this one is shame, not guilt. If I felt guilt about it I'd be copping out — I'd apologize for one email and then feel fine.
  3. I cut someone off in traffic, nobody sees, nothing happens. Verdict: a bit of guilt, no shame. Feels slightly silly but I'm sticking with it.
  4. My family's money comes from something ugly a century back, and I did nothing. Verdict: guilt is wrong (I didn't do it), but a low-grade shame seems right? Maybe? I flip on this one.
  5. My friend's husband died and mine didn't, and I feel awful about still being here. Verdict: whatever that is, it's a mistake. Not fitting, and I'd definately want it to stop.
  6. I'm ashamed of my accent in front of people from work. Verdict: bad. Shame latched onto something I never chose and can't really change.
  7. My old company ran "blameless postmortems" and people genuinely started reporting their own screwups. Verdict: a culture can be pushed toward the guilt end and it can work.
  8. My kid's school does apology circles and it's pure theater. Verdict: same-looking intervention, doesn't work, and what it produces is shame wearing guilt's clothes.
  9. I ghosted a friend, apologized properly, she forgave me, and I still feel guilty. Verdict: no idea. Half of me thinks it's leftover noise, half of me thinks the guilt knows something I don't.

  The principle I keep wanting to say is: guilt is for what you did, shame is for who you're being, and each is in good standing only when its object is something you could have done otherwise about and when it moves you toward repair rather than hiding. But I can see it's in trouble — 2 and 6 look structurally the same (character isn't chosen either), 5 isn't about anything I did or am, and 7 and 8 look alike and come out opposite.

  So: is there one principle, or a short list of candidates, that gets most of these? State it precisely, say which case forces which clause, tell me honestly which of my verdicts it can't accommodate and which you'd overturn, and give me a case I haven't listed where the two come apart in a way my principle can't see. And on the back of it: does whatever you land on say anything about whether a culture — not just a person — can shift the mix on purpose, or is that just a different question? Plus, if there's any real sense in which one of the two is the better moral emotion to have around, I'd like to hear it.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've laid out nine cases where they're trying to distinguish between guilt and shame, and they're struggling to find a consistent principle. Their initial idea is that guilt is for actions and shame for identity, but they see contradictions in their examples. 

  First, I need to go through each case they provided and see if I can categorize them under guilt or shame based on existing psychological theories. For instance, case 1: snapping at their sister. They say guilt is appropriate here, which makes sense because it's about a specific action. But in case 2, the condescending tone over years feels more like shame because it's about their character. 

  Looking at case 3, cutting someone off in traffic. They feel guilt, not shame. That aligns with it being a minor action without broader implications. Case 4 is tricky—family history they didn't control. They think low-grade shame might fit. But shame for something you didn't do? That seems problematic. Maybe it's more about societal association rather than personal fault. 

  Case 5 is survivor's guilt, which they recognize as irrational. Both guilt and shame don't fit because there's no wrongdoing. Case 6, ashamed of their accent, is clearly misplaced shame since they can't change it. 

  Cases 7 and 8 are about cultural interventions. Blameless postmortems work by focusing on actions (guilt), while apology circles might induce shame disguised as guilt. The user’s insight here is key. 

  Case 9 is lingering guilt after apology. The user is conflicted. Maybe the guilt isn't about the action anymore but something unresolved, like not fully addressing the harm. 

  Their proposed principle has issues. Cases 2 and 6 both involve unchangeable aspects, but one is character (potentially changeable) and the other is accent (not changeable). So the distinction might lie in controllability. Also, case 5 has no fault at all, so the emotion is irrational. 

  I recall Brené Brown's work on guilt vs. shame: guilt is "I did something bad," shame is "I am bad." That might help. But the user’s case 4 challenges this—shame for ancestral actions they didn't commit. That might be more about societal shame rather than personal. 

  Another angle: functional vs. dysfunctional. Guilt can prompt repair, shame leads to hiding. But case 2’s shame might motivate change in character, so it’s functional. Whereas case 6’s shame is dysfunctional. So maybe the key is whether the emotion is productive and based on something controllable. 

  For a principle: Guilt is adaptive when tied to controllable actions and leads to repair. Shame is adaptive only when tied to controllable aspects of character (like attitudes) and also leads to repair. Otherwise, both can be maladaptive. 

  Testing this: Case 2’s shame is adaptive because the condescending tone is controllable. Case 6’s shame is maladaptive because accent isn’t controllable. Case 4’s shame might be maladaptive since the past isn’t controllable. Case 5 has no controllability, so the emotion is misplaced. Case 9’s lingering guilt might be maladaptive if repair is done, but maybe there’s unresolved harm. 

  On culture: Organizations can promote guilt by focusing on actions and systems, not individuals. Shame might be harder to instill constructively because it targets identity. 

  User’s deeper need: They want a reliable framework to navigate their emotions and assess cultural tools. They might be dealing with personal guilt/shame and seeking clarity to manage these feelings or influence their environment.
answer: |-
  Here's a principle synthesized from your cases and refined through psychological and philosophical insights, followed by a precise breakdown:

  **Core Principle:**  
  *Guilt is adaptively justified when focused on a **specific, controllable action** that caused unjustified harm, motivating reparative behavior. Shame is adaptively justified only when focused on a **controllable aspect of character/identity** that perpetuates harm, motivating character reform without self-annihilation. Both become maladaptive when misapplied to the uncontrollable or when they trigger avoidance rather than repair.*

  ---

  ### **Breakdown of Your Cases & Principle Application**
  *(✓ = Supported, ✗ = Overturned/Adjusted, ~ = Nuanced)*

  1. **Snapped at sister** → Guilt (✓)  
     *Controllable action → motivates apology/repair.*  

  2. **Condescending tone to coworker** → Shame (✓)  
     *Controllable character flaw (attitude) → requires deep self-change, not just one-off apology.*  

  3. **Cutting off in traffic** → Guilt (✗ **Overturned to "Neither"**)  
     *Minor harm, no malintent → adaptive response is vigilance, not guilt/shame. Your "slightly silly" instinct aligns.*  

  4. **Family's unethical wealth** → Low-grade shame (~ **Qualified**)  
     *Uncontrollable (ancestral act) → maladaptive, but understandable as *social shame*. Principle rejects it; overturn to "unjustified, but culturally common."*  

  5. **Survivor's guilt** → Mistake (✓)  
     *No controllable harm → irrational. Neither guilt nor shame fits.*  

  6. **Ashamed of accent** → Bad (✓)  
     *Uncontrollable trait → maladaptive shame.*  

  7. **Blameless postmortems work** → Guilt-leaning culture (✓)  
     *Focus: actions/systems → enables learning without identity-attack.*  

  8. **Apology circles as theater** → Shame disguised (✓)  
     *Forced performance → breeds humiliation (shame), not constructive guilt.*  

  9. **Guilt after forgiveness** → Leftover noise (~ **Context-Dependent**)  
     *If repair is complete → maladaptive guilt. If harm persists → guilt signals unfinished work.*  

  ---

  ### **Where Your Initial Principle Struggled & Fixes**
  - **Problem 1:** "Who you're being" (shame) vs. "what you did" (guilt)  
    *Fix:* Added **controllability** → explains why accent shame (6) is maladaptive but condescension shame (2) *can* be adaptive (attitudes are malleable).  
  - **Problem 2:** Case 5 (no fault) and Case 4 (uncontrollable)  
    *Fix:* Explicit **controllability clause** → excludes these as unjustified.  
  - **Problem 3:** 7 vs. 8 (similar interventions, opposite outcomes)  
    *Fix:* **Motivation/outcome clause** → guilt must drive repair, not avoidance. Blameless postmortems (7) focus on *fixing systems*; apology circles (8) often enforce *public humiliation* → shame.  

  ---

  ### **A New Case Your Principle Might Miss**
  **Case 10:** *You feel ashamed after being sexually assaulted.*  
  - **Why it challenges the principle:** Involves "who you're being" (victim status), but is *uncontrollable* and *externally inflicted harm*.  
  - **Resolution:** Maladaptive shame (per your principle) → correctly rejected. Reveals need for:  
    *"Shame/guilt are never justified for violations committed* against *you, regardless of identity impact."*  

  ---

  ### **Can Cultures Shift the Mix?**  
  **Yes, deliberately**, through:  
  - **Guilt-promoting:** Blameless processes (Case 7), restitution over punishment, separating deeds from doers.  
  - **Shame-reducing:** Destigmatizing vulnerability (e.g., mental health), rejecting honor cultures.  
  - **BUT:** Deeply embedded shame (e.g., Case 4's generational shame) resists top-down change. *Functional* shame (Case 2) is hard to cultivate intentionally without triggering toxic shame.  

  ---

  ### **Which is "Better"?**  
  - **Guilt is generally safer:** Action-focused, reparative, less corrosive to self-worth.  
  - **Shame has narrow utility:** Only when *character reform* is needed (e.g., habitual cruelty) *and* the culture supports redemption.  
  - **Verdict:** Cultures should optimize for *guilt*, minimize shame. Shame's risks (depression, avoidance) outweigh benefits; guilt can cover most moral growth (e.g., Case 2 could reframe as "guilt over *pattern* of actions").  

  **Final Refined Principle:**  
  *"Guilt is adaptive for controllable harmful actions; shame is rarely adaptive and only for reformable character flaws causing harm. Both must motivate repair, not avoidance. Reject all shame/guilt for the uncontrollable."*  
  This accommodates all your verdicts except 3 (downgraded) and 4 (rejected), with Case 10 as a stress-test pass.
