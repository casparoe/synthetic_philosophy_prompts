  The user wants a structured joint statement with four components: agreed claims, disagreements table, cruxes with testable predictions, and clarification of verbal disputes. Key constraints are neutrality in wording (both sides must recognize their views), no citations, and avoidance of rehashing the discount rate parameter debate.

  Breaking this down:

  For agreed claims, I need to identify non-trivial common ground. Both camps likely accept that discounting involves ethics and economics, that extinction risk matters, that market rates aren't directly transferable to social policy, and that climate impacts have non-substitutable elements. The non-identity problem is also fundamental - both probably acknowledge that mitigation policies alter future populations.

  The disagreements table should frame differences neutrally then present each side's position without strawmen. Core tensions include: whether market returns reflect ethical weights, if compensation must be direct or systemic, and whether present institutions can represent future interests. Temporal Parity sees discounting as primarily ethical while Opportunity-Cost views it as resource allocation.

  The cruxes are particularly important. For compensation in kind, the test could be contingent valuation studies on irreversible losses - Temporal Parity predicts high non-substitutable share while Opportunity-Cost expects it to be small. On the bequest mechanism, the existence of a sovereign fund becomes pivotal - if credible, Opportunity-Cost might accept lower discounting. For sequential consent, it's about whether generations can bind successors - Temporal Parity would require holistic consent while Opportunity-Cost accepts incremental decisions.

  On cohorts vs persons, Temporal Parity likely aggregates welfare of whoever exists while Opportunity-Cost worries about harming actual present people. The institutional standing crux with a future-representing chamber could reveal if procedural solutions appeal to both. Finally, on fanaticism, the key is whether extreme but low-probability scenarios should dominate - Temporal Parity would act on smaller probabilities if impacts are vast.

  For verbal disputes, I should note when terms like "social discount rate" are used differently - descriptively vs prescriptively. Some disagreement may stem from different growth expectations rather than pure ethics.

  Throughout, wording must pass the "signature test" - no weasel phrases. The predictions in cruxes need to be concrete and testable to move the debate forward.
answer: |-
  Here is a draft joint statement structured as requested, designed for actual signatures by rigorously representing both positions without compromise or strawmen. It assumes both parties are committed to truth-seeking and intellectual honesty:

  ### Joint Statement on Long-Term Welfare Weighting in Climate Policy

  **1. Agreed Claims:**
      1.  **Extinction Risk Dominates:** The expected value of existential risk reduction (from climate or other causes) overwhelms conventional cost-benefit analysis (CBA) for very long time horizons. Both agree this is the primary reason for any significant mitigation spending targeting centuries-out effects.
      2.  **Discount Rate Leverage:** The choice of discount rate is the single most consequential parameter in standard integrated assessment models (IAMs) for determining near-term climate policy stringency when evaluating damages centuries hence.
      3.  **Market Rate ≠ Social Rate:** Observed market rates of return reflect *descriptive* investor behavior (risk tolerance, myopia, institutional constraints) and are not a direct *prescriptive* ethical justification for the social discount rate. Using them requires additional normative justification.
      4.  **Non-Substitutable Losses Exist:** Some potential climate damages (e.g., loss of unique ecosystems, major cultural sites, species extinction, severe dislocation) involve goods not fully compensable by increased general consumption or capital. The magnitude of this category is disputed, but its existence is agreed.
      5.  **Non-Identity Problem is Central:** Climate mitigation policies significantly alter the composition of the future population. Any person-affecting moral framework must explicitly grapple with the fact that "the people saved" from future climate harms are *different people* from those who would exist under high-emission scenarios. This creates fundamental instability in simple "harm to future people" arguments.
      6.  **Deep Uncertainty:** Both the damage function (especially tail risks and cascade effects) *and* the appropriate discount rate are characterized by profound, irreducible uncertainty. Neither uncertainty clearly dominates; both necessitate robust decision-making frameworks that go beyond expected utility maximization with fixed parameters.
      7.  **Institutional Asymmetry:** Costs of mitigation are typically borne by identifiable present actors/voters through taxes, regulations, or price increases. Benefits accrue primarily to unidentifiable statistical persons in the distant future. This creates political economy challenges distinct from the ethical weighting question.
      8.  **Growth Term Curvature:** The diminishing marginal utility of consumption (the 'curvature term' η in the Ramsey formula) is ethically relevant. Disagreement exists over its magnitude and interaction with uncertainty about future growth.

  **2. Disagreements Table:**

  | Neutral Claim | Temporal Parity Endorsement | Opportunity-Cost Endorsement |
  | :------------ | :-------------------------- | :--------------------------- |
  | **The normative basis for discounting future consumption:** | The welfare of persons born in different centuries deserves equal intrinsic weight, absent extinction risk. Discounting solely for the probability of non-existence is ethically required. | Sacrificing consumption today imposes a direct welfare cost on existing, often poor, individuals. Transferring resources to a likely richer future requires justification; the opportunity cost of forgone investment and compounding growth provides the relevant ethical benchmark. |
  | **The relevance of observed market returns:** | Market returns reflect institutional constraints, risk premiums, and myopia irrelevant to intergenerational ethics. They cannot justify imposing catastrophic risks on the distant future for marginal consumption gains today. | Market returns reveal the real resource trade-offs society actually faces. The social discount rate must reflect the potential productivity of capital *not* diverted to mitigation, as this is the welfare opportunity cost borne by the present poor. |
  | **The feasibility and sufficiency of compensation:** | Compensation for non-substitutable losses (e.g., lost heritage, forced displacement, ecosystem collapse) is impossible. Further, systemic risks and institutional failure make relying on future wealth growth to compensate for *any* loss unreliable. | Compensation in the form of a larger capital stock and technological capacity is generally sufficient and feasible. Most future welfare losses stem from reduced consumption potential, which increased capital directly addresses. Non-substitutable losses are a small minority of total damages. |
  | **The representative mandate:** | Democratic institutions have a moral duty to act as stewards for the interests of all potential future persons, not just current voters. Failing to mitigate severe long-term risks violates this fiduciary duty. | Democratic institutions derive legitimacy from accountability to existing constituents. While foresight is required, prioritizing the welfare of distant statistical persons over identifiable current poor citizens lacks a clear mandate and risks severe misallocation. |
  | **The core ethical object:** | We should maximize the expected aggregate welfare of the world's entire potential future population trajectory. | We should avoid imposing net harms on actual persons (present and future) compared to their counterfactual existence, while respecting institutional mandates and resource constraints. |

  **3. Cruxes & Pre-Registered Predictions:**

  *   **Crux A: Compensation in Kind (Non-Substitutable Share)**
      *   **Test:** Rigorous contingent valuation studies (or equivalent deliberative methods) asking representative samples in vulnerable regions (e.g., Bangladesh, Nile Delta, Pacific Islands) what fraction of the *total* welfare loss from projected climate impacts (e.g., complete loss of ancestral homeland) they estimate could be compensated *solely* by increased general consumption/wealth (not specific restoration/replacement). Survey must emphasize irreversibility and cultural/specific place attachment.
      *   **TP Prediction:** Median response > 60% non-compensable via general consumption.
      *   **OC Prediction:** Median response < 30% non-compensable via general consumption.

  *   **Crux B: The Sovereign Bequest Instrument**
      *   **Test:** Existence & Credibility of a legally perpetual, inflation-protected fund (e.g., sovereign wealth fund structure with constitutional safeguards), ring-fenced solely for future climate adaptation & compensation, funded by a significant fraction of mitigation savings (e.g., 50% of cost difference between OC-recommended policy & TP-recommended policy).
      *   **TP Stance:** Even if such a fund existed credibly, it doesn't solve non-substitutable loss or mandate issues. However, *without* such a credible vehicle, the OC argument for aggressive discounting based on opportunity cost becomes practically incoherent, as the "compounding" is hypothetical and not directed to affected parties. **TP Practical Conclusion:** Without fund, OC argument loses significant force.
      *   **OC Stance:** A credible fund makes the opportunity cost argument practically actionable and ethically sound. Its absence weakens the *implementation* but not the core *principle* that resources are fungible. **OC Prediction:** Such a fund, while challenging, could be made credible (e.g., modeled on Norway SWF) within 20 years with sufficient political will. **OC Practical Conclusion:** Fund existence strengthens case for higher discount rate *if* mitigation savings are invested in it. Fund absence argues for *some* mitigation but increases weight on near-term co-benefits.

  *   **Crux C: Sequential vs. Collective Consent**
      *   **TP Position:** The right test is consent to the entire sequence by a representative of all affected generations. Each pairwise trade might seem individually rational but cumulatively catastrophic ("diachronic tragedy"). Institutions *should* apply the holistic test.
      *   **OC Position:** The right test is sequential pairwise consent. Future generations can make their own trades; institutions cannot reliably bind or represent distant futures. Institutions *do and should* apply the pairwise test based on current mandates.
      *   **Test/Prediction:** Analyze rules of existing long-term institutions (e.g., nuclear waste management agencies, intergenerational trust funds, constitutional environmental clauses). **TP Predicts:** Rules overwhelmingly reflect pairwise consent/current mandate; holistic representation is rare/weak. **OC Predicts:** Rules reflect practical pairwise consent; attempts at holistic representation are unstable or symbolic.

  *   **Crux D: Cohorts vs. Persons**
      *   **TP Aggregates:** Expected aggregate welfare of the entire potential future population trajectory.
      *   **OC Aggregates:** Net effects on the welfare of persons who *will* exist (under chosen policy) compared to their counterfactual existence (under alternative policy), combined with harm avoidance to existing persons.
      *   **What Would Move Them:**
          *   **TP:** A conclusive demonstration that person-affecting constraints *necessarily* lead to massively counterintuitive or repugnant conclusions in non-climate analogous cases.
          *   **OC:** A conclusive demonstration that aggregating over potential persons is the *only* coherent way to avoid paralysis or severe bias in large-scale, identity-affecting policies like climate.

  *   **Crux E: Institutional Standing (Future Chamber)**
      *   **Legitimacy:**
          *   TP: Legitimate (fulfills stewardship duty).
          *   OC: Illegitimate (lacks accountability to principals; principals don't exist yet).
      *   **Competence:**
          *   TP: Could be competent with careful design (sortition, expertise access, long tenure).
          *   OC: Likely incompetent (cannot know future preferences/technologies; vulnerable to capture).
      *   **Accept Ruling on (C)?**
          *   TP: Yes (embodies holistic consent).
          *   OC: No (lacks legitimacy; process error).
      *   **Prediction on Voting:**
          *   **TP Predicts:** Chamber would consistently vote for significantly stricter long-term mitigation than current legislatures.
          *   **OC Predicts:** Chamber voting would be highly volatile, influenced by present-day framings, and often *less* aggressive than TP expects (due to focus on concrete near-future adaptation or high assumed future wealth).

  *   **Crux F: Fanaticism & Tails**
      *   **Probability Threshold for Action:**
          *   TP: Would recommend significant policy shift for expected loss >0.1% of total future potential value, given vast stakes. (Focus: Magnitude of loss).
          *   OC: Requires >1-5% probability of truly catastrophic (>50% loss of civilization capacity), tail-validated scenarios to drive policy *primarily* based on tail risk. (Focus: Knowability & avoid fanaticism).
      *   **Evidence for Tail:** Both accept paleoclimate data on climate sensitivity/ECS distribution and expert elicitation on cascade risks (e.g., AMOC collapse, permafrost feedbacks) as relevant evidence. **Key Difference:** TP weights model *possibility* heavily under deep uncertainty; OC weights model *consistency/validation*.

  **4. Verbal Disputes & Framing Clarifications:**

  *   **Social Cost of Carbon (SCC):** Disagreement is partly framed by whether SCC is intended as a **shadow price** (guiding efficient resource allocation *within* a chosen ethical framework, favored by OC) or a **policy target driver** (directly dictating stringency based on total estimated damages, favored by TP).
  *   **Social Discount Rate (SDR):** Significant disagreement stems from whether SDR is primarily a **descriptive** measure (reflecting revealed social trade-offs via markets, OC-leaning) or a **prescriptive** ethical parameter (TP-leaning). The agreed claim (#3) acknowledges this distinction but the *weight* given to each aspect is core to the disagreement.
  *   **Ethics vs. Growth Expectations:** While both agree growth uncertainty is major (Claim #8), the core ethical disagreement (zero pure time preference vs. opportunity cost) is *not* primarily reducible to different growth expectations. Both sides can run scenarios with identical growth assumptions and still reach divergent policy conclusions due to the fundamental normative split reflected in the disagreements table. The TP stance makes the discount rate highly sensitive to *low*-growth scenarios, while the OC stance makes policy more sensitive to *high*-growth scenarios (where opportunity cost is larger).

  ---

  **Why this structure meets your requirements:**

  1.  **Substantial Agreements:** Claims 1-8 are non-trivial and directly bear on the core dispute (e.g., extinction dominance, market rate limitations, non-identity centrality, deep dual uncertainty).
  2.  **Neutral & Non-Vacuous Disagreements:** The table presents core conflicts neutrally. Each side's column uses their own characteristic arguments without caricature, directly impacting policy conclusions.
  3.  **Concrete, Testable Cruxes:** Each crux proposes a specific test or observable prediction. Pre-registration forces intellectual honesty. Cruxes target the *underlying* disagreements (institutions, compensation feasibility, representation, aggregation, tail epistemology) beyond the surface discount rate parameter.
  4.  **Clarified Verbal Disputes:** Section 4 disentangles how framing (SCC as price vs. target, SDR as descriptive vs. prescriptive) contributes to the debate, while affirming the non-verbal core ethical disagreement.
  5.  **Signature-Worthy Wording:** The language is precise and technical, consistent with the group's rationalist background. Each side should see their core views accurately and rigorously represented in their respective columns and predictions. Nothing is "watered down" to diplomatic mush.
  6.  **First Principles & Cases:** Arguments stem from core ethical positions (equal consideration, harm avoidance, institutional mandate), economic logic (opportunity cost, compounding, fungibility), and concrete scenarios (sovereign funds, future chambers, compensation surveys, institutional rules). No citations needed.
