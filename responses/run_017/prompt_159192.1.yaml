prompt: |-
  Hey — I teach a final-year metaphysics seminar and I'm stuck on the final. The last block of the course was on dispositions, and I want one essay question that actually separates the students who get why finks and masks matter from the ones who've just memorised that finks and masks are counterexamples to the simple conditional analysis, so we need some reformed analysis instead. My current draft is basically "do finks and masks refute the simple conditional analysis? discuss", and it's useless — everyone writes the same paragraph and everyone gets the same mark.

  Two things I want built into the question.

  First, give them at least one case they can't have seen before, ideally one where the labels we used in seminar don't obviously apply. I was thinking of something like (a) a mask that counterfactually depends on the disposition it masks — the shielding only kicks in because the thing is fragile, so you can't hold the disposition fixed and then subtract the interferer, which is what the usual reformed analyses want to do — and (b) a case where the disposition is lost partway through the stimulus-or-manifestation window rather than cleanly before it or cleanly after it, so it's unclear whether we even have a fink or a mask. Use whatever versions of those work best; the point is that reciting the standard pair of examples shouldn't get anyone very far.

  Second, make them take a stand on whether the two problems pull in the same direction. Does a fix that handles finks (roughly, something about holding the causal basis fixed across the counterfactual) thereby handle masks, or do masks push somewhere quite different — toward extrinsicness, or toward denying that the masked thing really has the disposition, or somewhere else? A strong answer should be able to say what a reformed analysis would have to look like to get both right, or else say why no single reform can, and what that shows about what dispositions are.

  Constraints: one question, 90 minutes in the exam room, 20 marks. Give me the question text as I'd put it on the paper, a model answer of about 700 words, and a marking scheme built around five must-hit points with the marks for each and one line on how people usually get each one wrong. Also tell me explicitly what separates an A from a B: I want the A answer to do something beyond hitting the five points — notice something about the cases I hadn't flagged, or draw a consequence I hadn't put in the question — so say what that extra move is and how you'd recognise it.

  Working background, which the question can just assume: dispositions are real properties had in virtue of a causal basis, reasonably intrinsic ones, and the seminar question has been whether they can be analysed counterfactually, not whether they exist. Nobody needs to defend that. The students have only read my handout, so please don't presuppose any particular published version of the fink and mask cases, and don't put any citations or reading suggestions in the question, the model answer, or the scheme. And no "discuss": I want there to be a best answer, or at most a short list of answers that are clearly better than the alternatives, and I want the scheme to say which ones count as correct and why.
reasoning: |-
  Hmm, the user is a metaphysics professor struggling to design a challenging final exam question about dispositions that can differentiate student understanding. They want to move beyond rote memorization of finks and masks as counterexamples to the simple conditional analysis (SCA). 

  The key requirements are:
  1) Include novel cases that don't fit standard labels - specifically a dependent mask and a temporal edge-case
  2) Force students to analyze whether finks and masks require the same solution
  3) Avoid "discuss" prompts in favor of structured arguments with clear best answers
  4) Provide full assessment package (question, model answer, rubric)

  I notice they're frustrated with current responses being uniform. This suggests the question needs to disrupt predictable answers by:
  - Introducing ambiguity in case classification (is it a fink? mask? neither?)
  - Creating tension between standard solutions (causal basis fix vs extrinsic approaches)
  - Demanding meta-level comparison of the counterexamples

  The professor's implicit goals seem to be:
  - Testing conceptual flexibility beyond seminar examples
  - Evaluating whether students grasp why these counterexamples matter philosophically
  - Assessing ability to synthesize rather than regurgitate

  For the novel cases, I'll design:
  a) A mask whose existence depends counterfactually on the disposition itself (creating circularity for standard solutions)
  b) A disposition that disappears mid-stimulus (challenging temporal boundaries)

  The core trap to avoid: letting students just recite "Martin's fink" and "Johnston's mask" without understanding their structural differences. The question must force them to show why these cases break analyses, not just name them.

  For the model answer, I'll demonstrate:
  - How the dependent mask resists both SCA and reformed analyses
  - Why the temporal case exposes a gap in current taxonomies
  - That finks/masks require different solutions (intrinsic basis vs extrinsic conditions)
  - The implied trade-off: either accept extrinsicness or abandon counterfactual analyses

  The marking scheme will punish:
  - Treating new cases as identical to seminar examples
  - Failing to contrast fink/mask implications
  - Not engaging the "same direction?" subquestion
  - Superficial treatment of the temporal ambiguity

  The A-grade differentiator: spotting that the dependent mask case reveals dispositions aren't purely intrinsic, or that the temporal case demands a process ontology. That insight should emerge from their analysis, not be pre-scripted.
answer: |-
  Here’s a complete exam package designed to meet your specifications, forcing students to engage deeply with the *structure* of the problems rather than reciting textbook cases.

  ---

  **EXAM QUESTION (20 marks; 90 minutes)**  
  *Answer the following question in continuous prose. Your answer should be structured, concise, and address all parts explicitly.*

  > **"Fink-style cases** (e.g., a sorcerer making a fragile vase robust just before it is struck) and **mask-style cases** (e.g., a protective coating preventing a fragile vase from breaking when struck) are both counterexamples to the Simple Conditional Analysis (SCA) of dispositions.  
  >   
  > Consider two novel cases:  
  > **(i) A glass’s molecular structure is such that, *because* it is fragile, it emits a force field when struck that absorbs impacts. Without its fragility, no force field would exist.**  
  > **(ii) A radioactive particle is disposed to decay within 1 nanosecond when observed. If unobserved after 0.5 nanoseconds, it loses this disposition entirely.**  
  >   
  > Do these cases fit cleanly into the categories of "fink" or "mask"? Explain why or why not.  
  >   
  > Then, argue whether solutions to fink-style cases (e.g., holding a causal basis fixed) *also* resolve mask-style cases. Use the novel cases to test your view.  
  >   
  > Conclude: What does this show about whether a *single reformed analysis* can succeed for all dispositions?"**

  ---

  **MODEL ANSWER (≈700 words)**  

  **(1) Classifying the Novel Cases**  
  Case (i) is not a straightforward mask. Standard masks (e.g., a coating) operate independently of the disposition: removing the mask should restore the conditional. Here, the "force field" *counterfactually depends* on the glass’s fragility—it exists *because* the glass is fragile. If we try to "hold the causal basis fixed" (a common fink-solution), the force field remains, blocking manifestation. Yet subtracting the force field requires altering the basis, violating the fix. This creates a loop: fragility causes the mask, but the mask blocks fragility’s manifestation. It resists categorization because it conflates the disposition’s basis with its extrinsic prevention.  

  Case (ii) is neither a pure fink nor mask. Finks remove dispositions *before* the stimulus (e.g., the sorcerer acts pre-strike); masks prevent manifestation *during* the stimulus. Here, the disposition vanishes *mid-stimulus* (at t=0.5ns). The stimulus (observation) is ongoing, but the disposition ceases during its application. SCA fails because the particle *would* decay if observed for the full nanosecond—but after 0.5ns, it *loses* this tendency. This temporal instability challenges analyses requiring dispositions to persist unchanged through stimuli.  

  **(2) Do Fink-Solutions Resolve Masks?**  
  No—finks and masks demand distinct fixes, and novel case (i) proves this. Fink-solutions (e.g., Lewis’s "holding the causal basis fixed" across counterfactuals) ensure dispositions aren’t lost pre-stimulus. This *fails* for masks: holding the basis fixed in case (i) *retains* the force field, so the glass still wouldn’t break if struck. Mask-solutions often require adding a "no interferers" clause (e.g., Choi). But this makes dispositions *extrinsic*—the glass’s fragility now depends on external blockers. Worse, in case (i), the "blocker" (force field) is *intrinsic* to the basis. A "no interferers" clause here would falsely deny the glass is fragile, since the force field is ever-present.  

  Fink-solutions address *retention* of dispositions (ensuring they exist when stimulated); mask-solutions address *manifestation* (ensuring nothing blocks output). These are orthogonal problems. Case (ii) confirms this: holding the basis fixed pre-stimulus doesn’t help—the disposition vanishes mid-process due to the stimulus itself. Mask-style fixes also fail—no external blocker exists; the disposition self-destructs.  

  **(3) Implications for a Single Reformed Analysis**  
  The cases show no unified analysis works. Finks push toward *intrinsic causal bases* held fixed across counterfactuals. Masks—especially case (i)—push toward *extrinsic conditions* for manifestation. Case (i) proves these conflict: if the mask emerges from the basis (intrinsic), but blocks manifestation (extrinsic condition), no account can satisfy both demands. Case (ii) compounds this: dispositions may be *process-sensitive*, requiring temporal indexing (e.g., "disposed *at t* to manifest if stimulated at *t*"). This fractures counterfactual analyses into context-specific rules.  

  Ultimately, SCA’s failure isn’t merely technical—it reveals dispositions as *structurally complex*. A reformed analysis must either:  
  - (a) **Accept extrinsicality** (making masks "part" of the disposition), but then case (i)’s glass is fragile *only* without its force field—contradicting its basis.  
  - (b) **Deny masked objects have the disposition** (e.g., Martin), but case (i)’s force field *depends* on fragility, suggesting the glass *is* fragile.  
  - (c) **Adopt a non-counterfactual analysis** (e.g., powers ontology), abandoning reduction.  

  The novel cases force this trilemma. A single counterfactual analysis cannot handle finks (requiring basis-stability), masks (requiring extrinsic conditions), *and* dynamic cases like (ii) without fragmenting or sacrificing intrinsicality.  

  ---

  **MARKING SCHEME (5 key points; 20 marks total)**  
  **Aim:** Reward recognition that finks/masks target *different* aspects of SCA and that novel cases expose unresolved tensions.  

  | **Key Point**                                                                                                | **Marks** | **Common Errors** |
  |-----------------------------------------------------------------------------------------------------------|-----------|-------------------|
  | **1. Correctly analyzes case (i)**: Identifies force field’s dependence on fragility creates a loop; not a standard mask. | 4 | Treating it as a normal mask; missing the dependence. |
  | **2. Correctly analyzes case (ii)**: Identifies mid-stimulus loss of disposition; not a fink/mask.          | 4 | Calling it a fink (disposition not removed *before* stimulus) or mask (no external blocker). |
  | **3. Argues finks/masks need distinct fixes**: Uses cases to show basis-fixing fails for masks (esp. case (i)). | 5 | Claiming basis-fixing solves both; not testing solutions against cases. |
  | **4. Concludes no single analysis works**: Identifies tension (intrinsic basis vs. extrinsic conditions) using the cases. | 5 | Vague pessimism; not deriving the tension from case (i)’s structure. |
  | **5. Structure/clarity**: Logical flow; precise terminology; addresses all sub-questions.                   | 2 | Disorganized; omitting sub-questions. |

  ---

  **GRADE DIFFERENTIATION**  
  - **B (14–16/20)**: Hits all 5 key points competently.  
  - **A (17–20/20)**: Adds **one** of these insights:  
    - **Case (i) implies intrinsicality/extrinsicality is context-dependent** (force field is intrinsic to the object but extrinsic to the disposition’s manifestation).  
    - **Case (ii) suggests dispositions are temporally indexed properties** (e.g., "disposed *at t*"), making SCA’s stimulus-manifestation link too coarse.  
    - **The "loop" in case (i) reveals a regress**: If dispositions must cause their own masks, analyses need a hierarchy (e.g., "basis > disposition > mask").  
    - **Connects the trilemma (extrinsicality/denial/non-reduction) to a deeper metaphysical claim** (e.g., "Dispositions are irreducible to non-dispositional properties").  

  **Rationale for A-grade move**: The top answers won’t just apply concepts—they’ll spot *new structural problems* implied by the cases (e.g., temporal indexing in (ii) or regress in (i)) or draw an independent consequence (e.g., "This shows dispositions are relations, not monadic properties"). This mirrors professional engagement—seeing beyond the prompt’s frame.  

  --- 

  **WHY THIS WORKS**  
  - **Novel cases disrupt memorization**: (i) isn’t "just a mask" due to dependence; (ii) breaks the fink/mask dichotomy. Students *must* engage structurally.  
  - **Forces contrast**: The "do solutions transfer?" sub-question *requires* comparing fink/mask mechanisms.  
  - **Clear best answer**: The model answer’s core (finks ≠ masks; no single fix) is defensible and gradable. A-grades reward originality *within* this framework.  
  - **No citations needed**: Cases are original and self-contained; terminology (e.g., "causal basis") is from your handout.  

  This should robustly sort students on philosophical insight, not recall.
