prompt: |-
  You are a veteran teacher of philosophy and social science to intelligent non-specialists — the kind of person who has spent years running university outreach seminars and who knows where lay audiences actually get stuck rather than where textbooks say they do. Please think this through carefully, and before committing to an arc, sketch two or three candidate orderings in your head and say briefly what made you discard the ones you did not use. I would much rather have a plan that has been reasoned outwards from the dependency structure than a tidy list of teaching tips.

  The situation: I run a monthly evening reading group of about fourteen people — mostly software engineers, a GP, a retired maths teacher — who know effective altruism mainly from podcasts and blog posts, and who have had no formal philosophy or economics. We have ninety minutes. Last month we attempted the earning-to-give debate and it went badly: the group spent almost the whole session arguing about whether high-earning donors are hypocrites, and they left with the impression that every critique of effective altruism is really a critique of motives. So this month I want to do the institutional critique properly, as a critique of a method rather than of anyone's character.

  My gloss on it, so that we are working with the same thing: effective altruism's standard method takes the menu of existing interventions as given, assesses each candidate use of a marginal pound by asking what would have happened otherwise — including whether the intervention has room for more funding — and ranks options by expected benefit per pound. The institutional critique, as I understand it, holds that this procedure is structurally blind to actions whose return comes from changing the menu itself: founding organisations, shifting professional or legal norms, building funding pipelines, seeding a research field. Those returns are threshold-shaped, path-dependent, and attributable to no single marginal pound, so a method built to compare marginal contributions to going concerns will systematically underrate them. That is roughly what I want the group to see, and I want them to see why it is a problem for a way of reasoning rather than a reason to feel sulky about donors.

  What I want from you is the plan, not the explanation itself, structured as follows.

  **Prerequisites, in order** (roughly 250 words): which ideas have to be in place before the critique is even intelligible, and what genuinely depends on what. My guess is that they need to feel the pull of marginal reasoning first — why one asks the counterfactual question at all, why room for more funding matters — and to have some grip on non-linear or threshold-shaped returns, but tell me if I have the dependency backwards, and tell me what I can safely compress into a single sentence because it is doing no work.

  **The carrying example** (roughly 200 words): the one case the session is built around, what properties it must have, and — just as important — what it must lack. I tried bednets versus lobbying for a tax and a friend objected that it drags in too much contested politics; I also tried an open-source analogy, funding individual bug fixes versus funding a maintainer or a foundation, which plays beautifully with engineers but may smuggle in the wrong assumptions about who benefits. Choose one, improve one, and defend the choice against the other.

  **Misconception map** (roughly 300 words, as a table): the misunderstandings the group will bring or form, the point in the sequence where each has to be headed off, and the specific move that heads it off rather than a note that it should be. My own predictions: that the critique is really longtermism wearing a coat; that it implies we should stop funding direct interventions; that if something cannot be measured its expected value is zero, which is where the measurability-bias worry sneaks back in and which I want kept separate from the institutional point; that the critic must think the current top interventions are worthless; that the whole thing is a licence to do whatever is prestigious or fun; and, as residue from last month, that this is about motives rather than outcomes.

  **The two distinctions I want left on the board** (roughly 150 words): the difference between the best thing to fund and the best thing to make fundable, and the thought that some actions are worth taking largely for the options they create even when no expected value can be computed for them. Tell me where each sits in the arc — whether they are the payload or merely scaffolding — and push back if you think either is the wrong thing to send people home with.

  **What to leave out** (roughly 100 words): what I should openly decline to settle in ninety minutes, and how I should say so without making the session feel evasive. Please do not give me a reading list or any organisational history; the group has its own material and I want the architecture of the explanation.

  **The check** (roughly 120 words): one question to end on that would show they have taken the critique as a claim about a method, rather than about motives or about the far future, and that would separate genuine uptake from polite agreement — plus what an answer that merely looks right would sound like.

  Please write in British English throughout, and give me your reasons for the ordering, so that I can re-plan on the fly if the discussion runs long.
reasoning: |-
  Hmm, the user is running a reading group for intelligent non-specialists - mostly software engineers, a GP, and a retired maths teacher - who have some familiarity with effective altruism but no formal philosophy or economics background. Last session on "earning-to-give" devolved into debates about hypocrisy rather than substantive critique. Now they want to properly present the institutional critique of EA as a methodological limitation rather than a character judgment.

  The core issue seems to be that EA's marginalist approach systematically undervalues actions that change the intervention landscape itself - things like founding organizations, shifting norms, building pipelines. These have threshold effects and path dependencies that don't fit the "expected value per pound" model.

  Key requirements for this session:
  - Must avoid rehashing motive debates from last time
  - Needs concrete examples that resonate with engineers but don't smuggle in political assumptions
  - Requires careful sequencing to build understanding step-by-step
  - Must anticipate and defuse predictable misconceptions
  - Should leave participants with two clear conceptual distinctions

  The challenge is pedagogical architecture - how to structure 90 minutes so non-specialists genuinely grasp why this is about methodology. The user wants the dependency structure made explicit so they can adapt if discussion runs long.

  For prerequisites, the group needs to understand why EA asks counterfactual questions in the first place and why "room for more funding" matters. We can't jump straight to critique without establishing what's being critiqued. The threshold concept of nonlinear returns is also essential - if they think all impacts are linear, the critique won't land.

  For the carrying example, the open-source analogy (bug fixes vs. funding a maintainer) seems perfect for this audience. Engineers will immediately grasp why some contributions create multiplicative value. We'll need to explicitly state that this benefits all users equally to avoid assumptions about inequitable impact.

  The misconception map is crucial - this group will likely conflate the critique with longtermism, assume it means abandoning direct work, or revert to motive debates. Each needs specific preemptive moves at precise points in the sequence.

  The two key distinctions to end on:
  1. Best thing to fund vs. best thing to make fundable
  2. Recognizing option-value even without computable EV

  And we must openly bracket what we won't cover: political implications, measurement debates, and historical examples. The check question will reveal whether they've really understood this as a methodological point.
answer: |-
  Here’s a structured plan for your session, rooted in pedagogical dependencies and designed to preempt misconceptions. I’ve sketched two rejected arcs first to clarify the reasoning.

  **Rejected Arcs**  
  *Arc 1: Start with "menu-changing" actions (e.g., founding charities)*  
  Discarded because it assumes premature buy-in. Without first establishing *why* EA’s marginal method feels intuitive, critiques seem abstract or ideological. Engineers especially need to "debug" a system they understand before accepting its flaws.  

  *Arc 2: Lead with measurability bias*  
  Discarded for conflation risk. The institutional critique is distinct from "hard-to-measure = undervalued" (though related). Starting here would muddy the core point about *structural irreducibility to marginal units*.  

  ---

  **Prerequisites (Ordered Dependencies)**  
  *(1) The marginal mindset* (5 min): **Start with EA’s core question:** "What happens if I donate £X here vs. elsewhere?" Use a *linear* example they accept (e.g., "Buying 10 malaria nets saves ≈10 lives, assuming constant costs"). Emphasise the *counterfactual*: "Would nets have been bought anyway? If not, my £X directly enables Y." **Why:** This establishes EA’s strength – avoiding wasted effort – and makes "room for more funding" feel necessary, not bureaucratic.  

  *(2) Non-linearity* (5 min): **Contrast with a threshold effect.** Use a simple analogy: "Paying for 1% of a bridge buys you nothing; paying the final 10% unlocks 100% utility." Compress: "Some outcomes aren’t additive – they jump at points." **Why:** Thresholds show why marginal analysis breaks, priming the institutional critique. Dependency: Without (1), (2) feels arbitrary; without (2), the critique lacks force.  

  *(3) Attribution problem* (1 sentence): "When many actors contribute to a threshold, no single £1 gets ‘credit’." **Why:** This is a bridge, not a payload. Compressible because (2) already made thresholds tangible.  

  ---

  **The Carrying Example: Open-Source Maintainer**  
  *Case:* Funding individual bug fixes (marginal) vs. funding a full-time maintainer (institutional).  
  *Why chosen over bednets/lobbying:* Avoids political valence and leverages engineers’ domain knowledge. Fixes have clear per-pound impact; a maintainer improves code quality, attracts contributors, prevents ecosystem collapse – benefits irreducible to any single fix.  

  *Crucial properties:*  
  - Must show **non-attributability**: "No single commit by the maintainer may match a bug-fix’s direct impact, but their work enables thousands of fixes."  
  - Must have **path-dependence**: "Without early funding, the project fragments; with it, a thriving ecosystem emerges."  
  - *Must lack* **zero-sum tradeoffs**: Frame as "both matter, but EA’s method struggles to *compare* them." Avoid implying maintainers are "better" – the point is methodological blindness.  

  *Defence against alternatives:* Bednets/lobbying risks partisan tangents; open-source is apolitical and mirrors institutional work (sustainability > one-off wins). Pre-empt equity concerns: State explicitly, "Assume all users benefit equally from stability."  

  ---

  **Misconception Map**  
  | **Misconception**                          | **When to Intercept**             | **Preemptive Move**                                                                 |
  |--------------------------------------------|-----------------------------------|-------------------------------------------------------------------------------------|
  | "This is just longtermism in disguise"     | After intro of threshold effects  | **Contrast:** "Longtermism weighs future lives. This is about *how* to fund change *now* – even near-term institutions face thresholds." |
  | "We should stop direct interventions"      | After open-source example         | **Reframe:** "Not ‘either/or’. EA undercounts institution-building; we must *adjust* comparisons, not abandon proven work." |
  | "If it can’t be measured, EV=0" (measurability) | During Q&A                     | **Decouple early:** "This critique applies even *if* we could perfectly measure impact. It’s about structure, not uncertainty." |
  | "Current top charities are worthless"      | When discussing attribution       | **Anchor:** "They’re highly effective *at their niche*. The issue is missing *new* niches EA’s method can’t see." |
  | "Licence for fun/prestigious work"         | Before introducing distinctions   | **Constraint:** "Only actions that *plausibly create high-value options* qualify. Founding a think-tank ≠ founding a jazz club." |
  | "It’s about motives, not outcomes"         | In opener (recap last month)      | **Reset:** "Today we critique the *calculator*, not the *calculator-user*. Assume everyone wants impact." |

  ---

  **Two Distinctions to Leave on the Board**  
  *(1) "Best thing to fund vs. best thing to make fundable"*  
  - **Payload**, placed after the open-source example.  
  - **Why:** Embodies the core methodological gap. EA excels at the first; the critique reveals the second as a blind spot.  

  *(2) "Option value > computable expected value"*  
  - **Scaffolding**, introduced during thresholds but crystallised in Q&A.  
  - **Why:** It’s a *reason* distinction (1) matters, but not the takeaway. Pushback: Overemphasising "options" risks vagueness; anchor it in *concrete institutional functions* (e.g., "making vaccine R&D scalable").  

  ---

  **What to Leave Out**  
  Openly state: *"We won’t resolve whether specific institutional work (e.g., policy advocacy) is effective – that’s context-dependent. Nor will we solve how to *apply* this insight practically within EA. Today is about seeing a hole in the map, not filling it."*  
  **Why:** Prevents rabbit holes on politics/implementation. Signals focus: *conceptual* limits, not operational ones.  

  ---

  **The Check Question**  
  *"If we had perfect impact measurements, could EA’s current method still undervalue starting a new charity? Why?"*  

  - **Genuine uptake:** "Yes, because even with perfect data, marginal analysis can’t attribute value to *creating* the charity – only to its later outputs." (Shows grasp of structural flaw).  
  - **Polite agreement:** "Yes, because new charities are riskier" (reverts to measurability) or "Because EA is too rigid" (misses the counterfactual point).  

  ---

  **Flow & Contingencies**  
  **Order:** Prerequisites (1)→(2)→(3) → Open-source case → Distinction (1) → Misconception defences (woven throughout) → Check.  
  **If short on time:** Compress threshold examples to one vivid case (e.g., "50% funding for a dam = useless"). **If overruns:** Skip detailed attribution discussion; focus on the open-source analogy to carry the intuition.  

  This sequence forces engagement with EA’s logic *first*, exposing its limits through their own tools – making the critique methodological, not moral.
