  I should emphasize how Hart separates law's existence from moral evaluation - his "separation thesis" remains the real battleground. Even when discussing penumbral cases, Hart treats judicial legislation as gap-filling within a value-free system, whereas Fuller sees it as fidelity to law's moral purpose. The user might be missing how Hart's analytical framework resists Fuller's fusion of law and morality. 

