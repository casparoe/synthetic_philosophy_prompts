  - **Normative disagreement**: Yes—scientists *should* test hypotheses where they’re most vulnerable.  
  - **Data scope**: Unconvincing; logically, all observations are data.  

  My committed take: **The paradox arises from conflating *logical confirmation* (any probability boost) with *pragmatic/scientific confirmation* (evidence from a targeted test).** The "absurdity" stems from ignoring context—who tests raven color by looking at apples?  

  Weak spot: Probability theory *can* model relevance (e.g., requiring P(e|h) >> P(e|¬h)), but it’s tacked on. The paradox persists if we ignore scientific norms.  

  Progress would be: Showing why *relevance* isn’t just pragmatic—it’s embedded in how we *define* hypotheses. "All ravens are black" is *about* ravens; apples are off-topic. But this risks circularity.  

