  Their "corroboration vs. testing" distinction is on point but needs reframing. I think the deeper issue is *relevance*—a concept missing from pure logic. In scientific testing, evidence should be *criterial*: it should come from a domain where the hypothesis makes a *risky prediction*. Ravens being black is risky; green apples being irrelevant isn’t.  

  Alternative diagnoses they mention:  
