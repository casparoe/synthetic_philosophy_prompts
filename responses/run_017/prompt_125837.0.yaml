answer: |-
  Your approach to the arsenic-life affair as a lens for analyzing definitions of life is insightful. Let’s dissect the episode through both accounts, addressing your three focal points. (Note: *Science* retracted the paper in 2012, not 2025; this doesn’t alter the conceptual analysis but corrects the timeline.)

  ### Under NASA’s Working Definition  
  NASA’s "self-sustaining chemical system able to undergo Darwinian evolution" would require, for a "new form of life," evidence that the bacterium utilized arsenic in a way that fundamentally altered its evolutionary mechanism while maintaining self-sustenance. The claim would mean that arsenic was integral to its hereditary chemistry, enabling Darwinian processes distinct from phosphorus-based life. To establish this, the experiment needed to demonstrate: (1) arsenic’s stable incorporation into biomolecules critical for heredity (e.g., nucleic acids), (2) functional equivalence to phosphorus in sustaining replication and metabolism, and (3) evidence of heritable adaptation via arsenic biochemistry.  

  The actual measurements—growth in arsenic-rich, low-phosphorus media and inferred arsenic in DNA—could only suggest arsenic tolerance and possible partial substitution. They could not establish stable hereditary integration because the methods failed to purify DNA (leaving contaminants) or prove arsenate esters’ kinetic stability. Critically, they could not demonstrate that arsenic-enabled evolution; growth alone is insufficient, as Darwinian evolution requires heritable variation and selection across generations. The gap here is stark: operational tests (growth + elemental analysis) were misaligned with the definitional claim (arsenic-dependent evolution). A positive result would only have shown adaptation, not novel biochemistry enabling evolution.  

  This account explains the excitement’s shape: NASA’s definition implicitly ties "new life" to novel chemistry enabling evolution, fueling speculation about shadow biospheres. The decisive chemical/methodological criticisms arose because the definition’s reliance on Darwinian evolution is non-operational for a single sample; evolution cannot be observed instantaneously. Thus, critics attacked what *was* testable—biochemical plausibility and experimental rigor. The strain’s genealogical ordinariness matters because it implies this isn’t a lineage with alternative evolutionary mechanisms; it’s a variant of known life, undermining the "new form" narrative. The episode conflates novel chemistry and second genesis: NASA’s definition collapses them, as arsenic biochemistry would *imply* a separate origin if it enabled evolution. Yet paradoxically, the organism’s aliveness was never in doubt—exposing that the definition is ill-suited for borderline cases. It treats "life" as binary, forcing debates toward extremes (viruses, mules) where evolution seems uncertain.  

  For NASA’s definition, the episode is an anomaly. It reveals the definition’s operational vacuity: "undergoing Darwinian evolution" is a historical, population-level property, unverifiable for a single organism or short-term experiment. The chemistry—arsenate ester instability—functions as an exclusion, but only because the definition lacks intrinsic physicochemical constraints. It doesn’t anticipate that "self-sustaining" and "evolution" could be decoupled from specific chemistry, leaving it vulnerable to overinterpretation of adaptation. This supports Chyba and Cleland: the episode shows definitions without theory invite misalignment between criteria and evidence.  

  ### Under Your Hereditary-Vehicle + Single-Sample Account  
  Your definition adds: (1) a hereditary vehicle must be identifiable *before* assessing aliveness, and (2) a single specimen must be evaluable without genealogical data. For a "new form of life," the claim would mean an alternative hereditary vehicle (not necessarily nucleic acids) using arsenic stably. To establish this, the experiment needed to: (1) identify the hereditary material *de novo* (e.g., via replication fidelity or mutation inheritance), (2) prove arsenic’s essential role in that vehicle’s structure/function, and (3) show the system’s self-sustenance around this vehicle—all on one generation/specimen.  

  The actual measurements could not address this. Arsenic’s presence in impure DNA extracts is irrelevant without first confirming nucleic acids *are* the hereditary vehicle—which your clause forbids assuming in a shadow biosphere. Growth tests might hint at self-sustenance but say nothing about heredity. The single-sample clause highlights the core flaw: the study inferred "evolution" from growth, but your account demands a contemporaneous test for the hereditary vehicle (e.g., observing information transfer or decoding). The gap is profound: operational tests (biomass growth, bulk chemistry) ignored heredity identification, rendering the arsenic-DNA question premature.  

  This account explains why criticism focused on chemistry/method: without a confirmed hereditary vehicle, arsenate ester instability isn’t just a technical flaw—it invalidates the foundational assumption that DNA *was* the vehicle. The strain’s genealogical ordinariness is secondary; what matters is whether arsenic enabled an alternative hereditary mechanism, which rRNA data alone can’t refute. Your definition separates novel chemistry from second genesis: arsenic biochemistry is only significant if it supports a *hereditary system*, regardless of origin. The conflation in the episode arises because researchers assumed DNA was the vehicle, collapsing the questions.  

  For your account, the episode is confirmation. It exposes the hazard of assuming hereditary mechanisms (e.g., measuring arsenic in "DNA") without empirical validation. The chemistry’s role shifts: arsenate ester instability isn’t merely exclusionary but reinforces why hereditary vehicles require stable bonds—a theoretical insight. The strain isn’t a borderline case for aliveness; it’s unambiguously alive but mischaracterized biochemically. Your clauses reframe the debate: the insistence on single-sample evaluability explains why lineage-based definitions (like NASA’s) stumble in such cases, while the hereditary-vehicle clause forces clarity on what "novel biochemistry" must achieve.  

  ### Synthesis  
  Neither account treats this as a borderline life case; both agree the organism is alive. But they diverge on why the debate fixates on borderline cases. NASA’s definition, by making evolution essential but untestable instantaneously, pushes scrutiny to system-level ambiguities (e.g., "Can it evolve?"). Your account, by requiring upfront identification of heredity, redirects attention to material specificity—precisely where this case failed.  

  The episode confirms your account’s value: it prevents conflation by demanding that novel chemistry be linked to heredity, not just metabolism. It also shows that definitions *with chemical constraints* (like ester stability) do work—not as arbitrary exclusions but as inferences from heritability’s physical requirements. NASA’s definition, while useful for system-level criteria, lacks tools to dissect this episode’s errors. Ultimately, the affair underscores that definitions without operational precision for heredity and instantiation risk conflating adaptation with origin, chemistry with aliveness. Your clauses mitigate this by forcing the question: *What carries the information?*—a question never posed, let alone answered, in the arsenic-life affair.

  ---

  This analysis runs both ways: the episode reveals NASA definition’s weaknesses (operational gaps, conflation) while validating your account’s focus on hereditary specificity and single-sample testability. It was always about biochemistry *as the basis of heredity*, not life per se—a distinction your definition enforces and NASA’s obscures. The debate’s trajectory reflects this: critics targeted methods because the core claim was chemically incoherent for heredity, a flaw your account anticipates and NASA’s does not.
