  First, I need to understand the core debate. Maya argues testimony is just inference with suppressed premises (reliability of the speaker), while Rohan maintains testimony is irreducible because it gives us knowledge we couldn't obtain otherwise, especially in cases like language acquisition. The user wants me to evaluate each of their arguments and then apply this to the chatbot case.

