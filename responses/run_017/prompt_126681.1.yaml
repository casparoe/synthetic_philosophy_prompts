prompt: |-
  I sit on the grants committee of the Marchbank Foundation, which makes five-year, high-risk programme grants in basic science. Our charter commits us to funding work that would not survive a conventional peer-review panel, and it instructs us to fund 'science' without ever saying what would fail that description. Because we expect most of what we fund to be wrong, a failed prediction has never by itself been a reason to stop paying. Lately, though, three of us have started to suspect that we are making demarcation decisions case by case while pretending to be making only judgments of quality, and the current renewal has forced the question.

  The renewal is the Kestrel Programme (PI: Dr. Amara Okoye), which claims that a specified class of rapid behavioural adaptations across taxa is produced by a single heritable mechanism. I will summarise its record in the terms we have been using, because the disagreement turns on how to describe it:

  1. In year 1 it predicted an effect nobody had looked for, in a species nobody had studied, with a directional and roughly quantitative specification; the effect was found about as predicted.
  2. In year 2 it predicted a parallel effect in a second taxon; the result was null, in a study with adequate power by our own statistical consultant's review.
  3. Its response to (2) was a new auxiliary hypothesis about a gating condition. That auxiliary had consequences nobody had tested; in year 3 an independent group tested one of them and confirmed it.
  4. In year 4 it predicted a third effect. The estimate came out with the opposite sign to the prediction.
  5. Its response to (4) was a revision of the model's mathematical form that introduces a free parameter able to absorb either sign, offered without a new test. When the year-1 effect was independently replicated this year at roughly a third of the predicted magnitude, the PI said the mechanism constrains the existence and direction of the effect but not its size.
  6. The programme now states its core claim as: the mechanism is whatever produces the observed pattern of rapid adaptation in this class.

  Our own precedents, which we have never written down: we renewed a programme with one failed headline prediction because it had produced two confirmed predictions made before the relevant data existed and had declared in advance which auxiliary assumptions it would allow itself to revise; we declined to renew a programme with no failed predictions at all, on the grounds that its central claim had been restated three times to fit whatever data appeared; and we declined a programme whose only empirical successes were accommodations of facts already known when the prediction was framed.

  For the last cycle we have been drafting an instrument we call the Auxiliary Register: before data collection a grantee files the predictions it will count as tests, the auxiliary hypotheses it may revise without supplying a new test, and — for each such permitted revision — one further consequence to be tested inside the funding period. I have proposed adding a hostile-design clause, under which the programme must nominate one result it would concede to be refuting, and a designated critic from outside the programme must certify that the test could actually produce that result. The Kestrel Programme predates the Register and has nothing on file.

  We are split three ways: renew outright (the record looks like a healthy programme absorbing punishment, and item 3 is the sort of thing we exist to fund); decline (items 5 and 6 are the pattern we said was disqualifying in the precedent above, and the freedom to disown effect sizes makes item 1 weaker evidence than it looked); renew with conditions. Our colleague Professor Densmore argues that the whole exercise is incoherent — that no programme has ever been abandoned on a refutation, that every celebrated historical success involved protecting a core claim with auxiliaries, and that a Register is just an unfalsifiability test wearing a lab coat.

  Draft the decision memo I will circulate on Thursday, 900–1,200 words, addressed to the committee with a copy of the operative conditions going to Dr. Okoye. It should: state a single recommendation — renew, decline, or renew with conditions — in the first two sentences; say how you are classifying this record and why, using our three precedents rather than general philosophy; specify the conditions, if any, as things a working scientist could actually comply with, with dates and a decision gate; state whether the Register and the hostile-design clause should be applied to this programme retroactively, and what fairness requires either way; and give the strongest version of the argument against your own recommendation — Densmore's or another — in a form its supporters would recognise, before saying why it does not carry, or what in the recommendation it should change. Please do not cite literature or supply references; argue the case from the record and the precedents as I have given them.
reasoning: |-
  Okay, the user is on a grants committee for the Marchbank Foundation, which funds high-risk science that conventional panels wouldn't support. They need to draft a decision memo for the Kestrel Programme renewal. Let me break down the key points.

  The Kestrel Programme, led by Dr. Okoye, claims a single heritable mechanism for rapid behavioral adaptations. The record shows mixed results: a successful prediction in year 1, a null result in year 2 followed by a confirmed auxiliary hypothesis in year 3, a failed prediction in year 4, and then model revisions that introduced a free parameter. Now the core claim is very flexible, stating the mechanism is whatever produces the observed pattern. 

  The committee has three precedents: renewing a program with one failed prediction but clear pre-registered auxiliaries, declining one that restated its core claim to fit data, and declining one that only accommodated known facts. They're split three ways on renewal.

  I need to consider how to classify Kestrel against these precedents. The year 2-3 sequence (failed prediction followed by independently confirmed auxiliary) is strong and aligns with Marchbank's mission. But items 5 and 6 look like the declined precedent - revising the model post-hoc to absorb contrary data and making the core claim unfalsifiable. The PI now disclaims effect size prediction, weakening the initial success.

  The Auxiliary Register proposal (pre-registering predictions, revisable auxiliaries, and new tests) seems relevant. The hostile-design clause (naming a refutable outcome) addresses unfalsifiability concerns. Kestrel predates this though, so retroactive application needs careful handling.

  Professor Densmore's critique that all science uses protective auxiliaries and no program is truly abandoned on refutation is important to address. But Marchbank's precedents show they do make distinctions between productive protection and degenerative shifts.

  For the memo structure: start with a clear recommendation in the first two sentences. Renew with conditions seems most balanced - it recognizes the promising aspects while addressing the concerning flexibility. Conditions should include filing an Auxiliary Register within 60 days, specifying which predictions will be treated as tests, which auxiliaries can be revised, and new testable consequences. The hostile-design clause should apply prospectively, not retroactively. 

  I'll need to present Densmore's "incoherence" argument fairly before explaining why the Register isn't just "unfalsifiability in a lab coat" - it's about maintaining testability boundaries while allowing productive theory protection. The key distinction is between refining auxiliaries to expose core claims to risk versus redefining the core to escape risk.

  The conditions must be practical for a working scientist: clear deadlines (60 days for Register filing), defined decision gates (review after next prediction), and no retroactive penalties. This balances accountability with fairness to a pre-Register program.

  Word count is tight at 900-1200 words, so I'll be concise while covering all required elements: classification against precedents, conditions specification, retroactivity decision, and counterargument response.
answer: |-
  ## Marchbank Foundation Grants Committee  
  Interim Decision Memo: Kestrel Programme Renewal (PI: Dr. A. Okoye)  
  Date: [Thursday Date]  

  **Recommendation:** Renew the Kestrel Programme for one final funding cycle (Years 6-10) subject to binding conditions. The programme demonstrates the high-risk, innovative potential Marchbank exists to fund, but its recent trajectory risks crossing the demarcation line our precedents establish between protectively refining a core claim and redefining it to evade empirical risk. Conditions are required to restore testability.  

  **Classification Against Precedents:** The Kestrel record presents a critical tension between two of our precedents.  

  1.  **The Positive Precedent (Renewal Despite Failure):** Item 1 (novel, directional/quantitative prediction confirmed in a new system) and Item 3 (novel auxiliary generated in response to failure *independently confirmed*) strongly echo the programme we renewed. Like that successful case, Kestrel absorbed significant punishment (Year 2's null result) and generated fruitful, testable novelties *before* seeing the relevant data. This independent confirmation of an auxiliary consequence is precisely the high-risk, generative work our charter prioritizes. It suggests a core idea interacting productively with the world, generating new knowledge even when parts fail.
  2.  **The Negative Precedent (Decline for Redefinition):** However, Items 5 and 6 align disturbingly with the programme we declined for restating its central claim to fit data. The Year 4 effect emerged with the *opposite sign* to the prediction. Kestrel's response – revising the model's mathematical form to introduce a free parameter absorbing *either* sign without proposing a new immediate test – fundamentally weakened the model's predictive specificity. This was compounded by the response to the Year 1 replication: disclaiming predictive power over effect size *after* the fact. Crucially, this revision directly followed a failed prediction. Item 6 crystallizes the issue: redefining the core claim as "whatever produces the observed pattern" renders it effectively unfalsifiable, mirroring the "restated to fit data" pattern we previously rejected. It transforms the mechanism from a specific, testable hypothesis into a tautological description of the phenomena it purports to explain. While Year 3 showed productive protection, Year 5 shows degenerative protection.

  The key distinction lies in *when* and *how* revisions occur relative to empirical challenges, and the resultant testability of the core claim. Year 3 involved a *novel auxiliary* generated *before* new data, leading to a *new, confirmed prediction*. Year 5 involved a *revision to the core model* (introducing a free parameter) *after* a failure, explicitly *reducing* predictive content (disclaiming effect size) without generating a new test. This shift moves Kestrel towards the precedent we declined. However, the strength of Items 1 and 3 warrants a final opportunity to demonstrate the core claim retains empirical bite, under enforced safeguards. It is not yet definitively in the "accommodation of known facts only" category (our third precedent), though Year 5 edges towards it.

  **Conditions for Renewal:** Renewal is contingent on Dr. Okoye accepting and complying with the following conditions by **Friday, [Date - 60 days from Thursday]**:

  1.  **Auxiliary Register Filing:** The Kestrel Programme must file a complete Auxiliary Register entry with the Committee. This must specify:
      *   **Core Claim:** A clear, testable statement of the hypothesized mechanism and its predicted consequences, distinct from the mere observation of the pattern (Item 6).
      *   **Designated Tests:** At least two specific, directional, and quantitatively bounded predictions (where feasible) to be tested within Years 6-10 that the programme agrees will constitute tests of the core claim.
      *   **Permitted Auxiliary Revisions:** A defined list of auxiliary hypotheses that may be revised if a designated test fails *without* requiring the programme to immediately propose a new test for the revised auxiliary.
      *   **Consequences of Revision:** For *each* permitted auxiliary revision listed above, one specific, novel, testable consequence must be proposed. This consequence must be tested and results reported to the Committee *within the remaining funding period*.
      *   **Hostile-Design Clause:** The programme must nominate *one* specific, plausible experimental or observational outcome (related to a designated test or a core claim prediction) that it would concede *refutes* the core claim as currently stated in the Register. A designated external critic (agreed upon by PI and Committee) must review the proposed test methodology and certify in writing that it *could* realistically produce the nominated refuting outcome. This certification must be submitted to the Committee by **Friday, [Date - 45 days from Thursday]**.

  2.  **Decision Gate - Mid-Cycle Review (Year 8):** Continuation of funding beyond Year 8 is contingent on a positive review by the Committee assessing progress against the filed Register. This review will specifically evaluate:
      *   The outcome of at least one designated test.
      *   Compliance with the Register structure, particularly regarding any auxiliary revisions and the initiation of tests on nominated consequences.
      *   The overall coherence and empirical risk retained by the core claim in light of results obtained.
      Failure to file an acceptable Register by the deadline, or failure to pass the Year 8 review, will result in immediate termination of the grant.

  **Retroactive Application of the Register & Fairness:** The Auxiliary Register and hostile-design clause represent a *new* procedural framework developed *after* Kestrel's initial funding. Applying them retroactively to judge *past* performance (Years 1-5) would be unfair. Kestrel operated under our prior, unwritten norms. Our assessment of its past record relies solely on those unwritten norms and precedents, as detailed above.

  However, applying the Register framework *prospectively* to Kestrel's *next* cycle is essential and fair. It provides a structured, pre-agreed mechanism to address the specific concerns raised by Items 5 and 6 within a funded period Kestrel would not otherwise receive. It gives the programme a clear, feasible path to demonstrate its core claim remains scientifically testable and distinct from mere accommodation, aligning with the positive precedent's spirit. Denying renewal outright based on concerns the Register is designed to address, without giving Kestrel a chance to operate under it, would also be unfair given its early successes and the Register's novelty. The conditions impose a manageable burden focused on future testability.

  **The Counterargument (Densmore's Incoherence Thesis):** Professor Densmore argues compellingly that our entire endeavour is incoherent: no significant scientific programme is ever abandoned solely due to a "refutation"; celebrated breakthroughs always involved protecting core ideas with revised auxiliaries (as Kestrel did in Year 3); and the Auxiliary Register, particularly the hostile-design clause, is merely a bureaucratic ritual ("unfalsifiability test wearing a lab coat") that cannot capture the dynamic, often messy, reality of how science progresses. Imposing such structure on high-risk science, he contends, undermines the very freedom and tolerance for protective manoeuvres that Marchbank exists to foster. Applying it to Kestrel now, especially given its early generative success (Items 1 & 3), is philosophically naive and operationally stifling. He would likely advocate for outright renewal based on the programme's demonstrated ability to generate novel, confirmed predictions and its clear alignment with our high-risk mission, dismissing Items 5 and 6 as necessary, if inelegant, adjustments inherent in ambitious science.

  **Why This Does Not Carry (For This Case, At This Time):** Professor Densmore's argument powerfully highlights the perils of over-rigid demarcation and the vital role of protective adjustments. We agree that demanding instant surrender on any failed prediction contradicts how science works. **However, our precedents demonstrate we *do* draw a line, however difficult, between productive protection and degenerative retreat.** The programme we declined for restating its core claim crossed that line. Kestrel's actions in Year 5 (absorbing opposite signs via a free parameter without a new test, then disclaiming effect size post-replication) and Item 6 (defining the mechanism as the pattern itself) represent a *pattern* of retreat *away* from specific testability, moving perilously close to that precedent. The Register is not a demand for instant falsification but a mechanism to enforce *continued* testability. It doesn't ban auxiliary revision (it explicitly permits it!) but demands that revisions generate *new, specified tests* to maintain empirical content. The hostile-design clause forces explicit consideration of what *would* count against the core claim *before* data arrives, countering the unfalsifiable drift evident in Item 6. While Densmore is right that science is dynamic, our mandate requires us to ensure funded work remains recognizably *scientific* – meaning testable against the world, not just descriptive of it. Kestrel deserves a final chance under this new framework precisely *because* of its early successes and generative potential (Items 1 & 3), but that potential is now threatened by the trajectory seen in Items 5 and 6. The conditions provide a structured, fair opportunity to demonstrate the core claim retains the empirical risk essential for Marchbank funding. Outright renewal without these safeguards risks funding a programme that has, de facto, abandoned the testable specificity that once made it compelling.
