  ## Toast for Professor Miriam Kessel

  [Raise glass slightly, warm smile to the room, then specifically towards Miriam and her mother]
  Miriam, Dean, colleagues, friends, family… especially Mum Kessel. What an honour to close this chorus of appreciation. And Miriam, I must confess, seeing my name last on this programme feels… *significant*. After all, who better to follow everyone else than her first student? It’s practically a controlled experiment in sequencing. [Light chuckle, glance at Miriam]

  [Shift tone slightly, more personal, direct connection with Miriam]
  Six beautiful tributes. Six voices painting a vivid picture of the formidable scholar, the demanding mentor, the unforgettable character. They’ve covered the rules – writing down verdicts first! – the quirks – ordering before anyone else could contaminate the choice! – the wisdom – the chorus *not* being ten times the evidence. And they’ve done it wonderfully. Truly.

  [Move closer to the lectern, sincere, quieter]
  But Miriam taught me – drilled into me, really – the value of the private signal. The evidence only *you* have, that hasn’t yet been folded into the public record. Especially when the public chorus is so strong, so persuasive. So, I want to offer one small piece of evidence tonight. Not another verdict on your brilliance – that chorus is already singing perfectly. Just… a fact. Something only I witnessed, from my unique vantage point as the first one through your formidable doors.

  [Pause, gather thoughts, look directly at Miriam]
  Spring, 1997. I had a choice. Two paths diverging. One felt right to me. The other… well, the other felt like putting on someone else’s shoes that were two sizes too small and made of lead. But Miriam… Professor Kessel then… was *adamant*. Passionate. Forceful, even. She pressed me, hard, relentlessly, to take that job. The one I didn’t want. The one that felt wrong in my bones. She believed in it fiercely. For me. She saw a future there I simply couldn’t see.

  [Small, wry smile]
  And she was wrong. Completely, utterly wrong. The job *was* two sizes too small and made of lead. It went… badly. Exactly as my private signal had screamed it would.

  [Pause, tone softens, becomes more reflective]
  But here’s the evidence, Miriam. The thing I carry. In the twenty-five years since? You never once tried to quietly rewrite that story. You never claimed you’d actually favoured the other path all along, or hinted that I’d somehow misunderstood your nuanced advice. You never suggested, even gently, that the failure was solely mine for not executing your brilliant plan correctly. Faced with clear evidence that your strong, public advocacy for that path had been… misplaced… you simply absorbed it. You owned the mistake. Not defensively, not grudgingly, but with a kind of quiet, almost ruthless, intellectual honesty.

  [Look around the room, include everyone]
  *That* is a rare signal. Think about it. How often do we see that? How often does conviction that strong, advocacy that passionate, meet a negative outcome… and the advocate just… *acknowledges* it? Without flinching, without blame-shifting, without retrospective editing? Especially when they’re as brilliant, as accomplished, as Miriam?

  [Turn back to Miriam, warmth and respect]
  Miriam, you spent a career dissecting how signals get distorted, how reputations get managed, how crowds converge, especially on praise. You know better than anyone how powerful the forces are that push us to curate our narratives, to align with the chorus, to make the past fit a more flattering present. But that day, and every day since when that story surfaced? You resisted that cascade. You let the dissonant note stand. Your private signal – the evidence of being wrong – wasn’t suppressed for the sake of a smoother public story. It was integrated. Honestly.

  [Raise glass higher, voice lifts with conviction]
  *That* integrity, that refusal to let ego override evidence, even evidence against yourself… that’s the bedrock. That’s the foundation beneath the formidable scholar, the demanding mentor. It’s why we trusted your relentless questions, even when they made us squirm. It’s why your challenges weren’t just performative, but pathways to a harder, better truth. It’s why your praise, when it came, felt like gold – because we knew it hadn’t been cheapened by any cascade.

  [Include the family, especially Mum Kessel, with a warm glance]
  So, Mum Kessel, sisters, grandkids… while my colleagues appreciate the profound theorems and the razor-sharp critiques… I suspect you recognize this too, deep down. That stubborn, unvarnished honesty. That refusal to bend the truth for comfort’s sake. That core of realness.

  [Back to Miriam, full warmth]
  Miriam, your legacy isn’t just the ideas that transformed our fields, or the students you shaped – though that is immense. It’s also that unwavering commitment to the signal, however inconvenient. Even when the signal was you, being gloriously, unflinchingly, humanly wrong. For teaching us that the most important cascade to resist might be the one inside our own heads… for showing us that intellectual courage starts with owning your own fallibility…

  [Raise glass fully]
  … we honour you. Thank you. To Miriam!

  **[Delivery Notes:**
  1.   **Pacing:** Start warm and slightly self-deprecating with the "last/first student" joke. Shift to sincere and personal for the 1997 story. The "she was wrong" moment should be clear but not harsh – matter-of-fact. Build warmth and respect through the reflection on her integrity. End with strong, heartfelt conviction on the final lines.
  2.   **Eye Contact:** Crucial. Connect with Miriam during the personal story. Include the whole room when speaking about the rarity of her honesty. Make specific, warm eye contact with Miriam's mother during the lines addressed to the family ("Mum Kessel... recognize this too").
  3.   **Tone:** Avoid academic jargon entirely. Let the story carry the weight of the cascade concept implicitly. The "signal" metaphor is accessible; the "cascade" concept is demonstrated, not named after the initial reference. The emotion should be deep respect, affection, and admiration, grounded in a real, slightly imperfect, shared history. **]**
