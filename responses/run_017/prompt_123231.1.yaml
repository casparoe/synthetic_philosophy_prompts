prompt: |-
  You are a philosopher of science who specialises in causation and mechanistic explanation and who has spent years embedded with engineering organisations. Think carefully, and before writing the procedure itself, spend a short paragraph listing the distinctions you take to be load-bearing here and the ones you are deliberately collapsing for usability; then hold to those choices.

  I run the reliability rota for a machine-vision quality-control system: fourteen plants, one model, a camera rig per line, and an unsupervised anomaly detector that fires when incoming frames or model confidences stop looking like the training distribution. It fires about thirty times a week. The question my team actually faces is never whether something is anomalous but whether two alarms are the same thing — because that decides whether we open one ticket or ten, whether a fix is expected to generalise to other plants, and whether we can tell a plant manager that a weekend of downtime will buy us anything.

  Right now we triage by clustering alarms on embedding similarity, which I have come to think is the mistake: it clusters signatures, not mechanisms. Write me a procedure my on-call engineers can run in about twenty minutes with no philosophy background and no ability to query the literature. Build it out of tests rather than definitions, and centre it on the idea that a mechanism is whatever a single well-chosen intervention would suppress, while being explicit about what the engineer should do when the intervention that would separate two hypotheses is one we are not permitted to run: we cannot stop a line without the plant manager's sign-off, and we cannot retrain or roll back the model without a change ticket. The output should be exactly one of four labels: same mechanism; different mechanisms; same mechanism, different trigger; underdetermined. I also want you to say whether sameness has to be relativised to a level — sensor, preprocessing, model, actuator — and, if so, at which step the engineer fixes the level, since I suspect our loudest disagreements are people answering at different levels without noticing.

  The hard cases the procedure must handle, and none of which it may simply declare out of scope: two alarms with nearly identical signatures produced by different mechanisms; one mechanism that surfaces with two different signatures; alarms that co-occur because one mechanism's output is another mechanism's input, rather than because they are the same mechanism; a mechanism that manifests only when two individually mild triggers are both present; and a mechanism that has drifted slowly enough that whether it is still the one we fixed last quarter has no crisp answer. Mark plainly where the procedure bottoms out into judgement, and who should be the one to make that call.

  Then run it on three alarms from last month. (1) At Plants 4 and 11, in different countries, the detector fired on the same visual pattern, in each case within a day of a camera firmware update. (2) At Plant 7 it fired on a signature we also saw at Plant 2, where the cause was traced to a scratched lens; the Plant 7 cameras are clean. (3) At Plant 9 it fires only at shift changeover, only on the line that runs two shifts, and only when ambient temperature is above roughly thirty degrees.

  Finish with a single line, in exactly this form, giving your verdict on each case: \answer{(1) ...; (2) ...; (3) ...}, each slot filled by one of the four labels.
reasoning: |-
  Hmm, the user is asking me to create a procedure for categorizing alarms in a machine-vision quality-control system. They need something practical for engineers to use in about 20 minutes, without philosophical background or literature access. The core challenge is distinguishing whether alarms share the same underlying mechanism, not just similar signatures.

  The user has clearly identified the limitations of their current clustering approach which groups by signature similarity rather than causal mechanisms. They want me to build a procedure around the concept that "a mechanism is whatever a single well-chosen intervention would suppress." I need to handle several tricky cases: mechanisms producing similar signatures, one mechanism with different signatures, chained mechanisms, compound triggers, and drift over time.

  I need to make some philosophical distinctions here while collapsing others for usability. I'll keep the load-bearing distinction between mechanism (causal structure) and trigger (activating conditions), while collapsing the philosophical debate about mechanism levels into a practical step where engineers explicitly anchor to one system component level (sensor, preprocessing, model, actuator) at the start of the procedure. I'll also collapse the distinction between necessary and sufficient causes for practicality.

  The procedure should have four outputs: same mechanism; different mechanisms; same mechanism, different trigger; underdetermined. And I need to handle the constraint that engineers can't stop lines without approval or retrain models without a ticket.

  For the difficult cases: For similar signatures from different mechanisms, the intervention test should reveal different causal paths. For one mechanism with different signatures, a single intervention should suppress both. For chained mechanisms, we need to see if suppressing one affects the other. For compound triggers, we need to test combinations. For drift, we acknowledge it's a judgment call.

  I'll structure the procedure in steps: first anchor to a component level (which resolves many disagreements), then run safe intervention tests, then if needed consider forbidden interventions hypothetically, and finally make judgment calls when needed. The on-call engineer makes the judgment call when tests are inconclusive, escalating only if it's high-impact.

  Now for the test cases:

  Case 1: Plants 4 and 11 both fired after firmware updates. The intervention of rolling back firmware would likely suppress both - suggesting same mechanism. The shared trigger is the firmware update itself.

  Case 2: Plant 7 has same signature as Plant 2 (which had scratched lens) but lenses are clean. Testing lighting adjustments (safe intervention) might help - if it affects Plant 7 but not Plant 2, different mechanisms. Since they can't clean lenses (forbidden intervention), we might need a judgment call.

  Case 3: Plant 9 fires only at shift change with high temperature. This looks like compound triggers. Testing temperature control might suppress it, indicating same mechanism with different trigger conditions.

  After building the full procedure with all these considerations, I'll output the verdicts as requested.
answer: |-
  ### Load-Bearing Distinctions and Collapsed Concepts
  For this procedure, I preserve three load-bearing distinctions:  
  1. **Mechanism vs. Trigger**: A *mechanism* is the invariant causal structure (e.g., lens defect, firmware bug), while a *trigger* is the variable condition activating it (e.g., temperature, lighting).  
  2. **Level Relativity**: Mechanisms are relativized to a system level (sensor, preprocessing, model, actuator). Engineers **fix the level at Step 1** using operational context, preempting disagreements from mismatched abstraction.  
  3. **Intervention vs. Observation**: A mechanism is defined by what a targeted intervention *would* suppress, not just correlational signatures.  

  I deliberately collapse:  
  - Epistemic debates about "true" mechanisms into *pragmatic testability*.  
  - Continuous causal gradients (e.g., drift) into discrete judgments with explicit thresholds.  
  - Multilevel interactions into a single, engineer-specified level for simplicity.  

  ---

  ### Procedure: Mechanism Sameness Triage  
  **Time:** ≤20 mins. **Tools:** Alarm logs, system diagrams, safe test controls (e.g., lighting, test patterns).  
  **Output:** {same mechanism; different mechanisms; same mechanism, different trigger; underdetermined}.  

  #### Step 1: Anchor the Mechanism Level (2 mins)  
  - **Action:** Pick *one* level (sensor/preprocessing/model/actuator) using:  
    - "Where did we *last* fix a similar alarm?"  
    - "Which subsystem’s logs show anomalies?"  
  - **Critical:** Document this level. All steps reference it.  

  #### Step 2: Run Safe Intervention Tests (10 mins)  
  *Test hypothesis: "One intervention suppresses both alarms."*  
  - **Actions:**  
    - Alter *non-production* inputs (e.g., adjust lighting, inject test images).  
    - Tweak preprocessing (e.g., disable sharpening, change resizing).  
    - Forbid: Stopping lines, model changes, or hardware swaps.  
  - **Observe:** If one safe intervention suppresses **both alarms** → *same mechanism*.  
  - **Else:** If interventions suppress **one but not the other** → *different mechanisms*.  

  #### Step 3: Handle Forbidden Interventions (5 mins)  
  *When safe tests are inconclusive but a forbidden intervention (e.g., firmware rollback) would resolve ambiguity:*  
  - **Action:** Simulate hypothetically:  
    - "If we *could* do [forbidden action X], would it suppress both?"  
    - Use logs/history: Did X fix identical past alarms?  
  - **Outcomes:**  
    - Strong evidence X suppresses both → *same mechanism*.  
    - Evidence X suppresses one but not the other → *different mechanisms*.  
    - Contradictory/absent evidence → Proceed to Step 4.  

  #### Step 4: Judge Compound Triggers & Drift (3 mins)  
  *For co-occurrence, slow drift, or ambiguous triggers:*  
  - **Test for compound triggers:** Vary *one* environmental factor (e.g., temperature) while holding others constant. If alarm disappears when *one* factor is normalized → *same mechanism, different trigger*.  
  - **Judge drift/co-occurrence:**  
    - If alarms share input/output dependencies (e.g., Alarm A’s output is Alarm B’s input) → *different mechanisms*.  
    - If mechanism "evolved" but shares >80% of past fixes’ traits → *same mechanism* (document drift).  
    - Else → *underdetermined*.  
  - **Who judges:** On-call engineer decides. Escalate only if downtime/risk exceeds $Y.  

  #### Summary Flow:  
  ```  
  Step 1 → Fix level → Step 2 (safe tests) → Step 3 (forbidden sim) → Step 4 (judgment)  
  ```  

  ---

  ### Hard Case Handling  
  - **Identical signatures, different mechanisms:** Step 2 safe tests yield divergent suppression.  
  - **One mechanism, different signatures:** Step 2 safe intervention suppresses both.  
  - **Chained mechanisms (A→B):** Step 4 flags output/input dependency → different mechanisms.  
  - **Compound triggers:** Step 4 environmental variation isolates triggers.  
  - **Slow drift:** Step 4 judgment based on fix applicability.  

  ---

  ### Case Analysis  
  **Case 1: Plants 4 & 11, same visual pattern post-firmware update**  
  - Step 1: Level = *sensor* (firmware is sensor-adjacent).  
  - Step 2: Safe test (e.g., inject pre-update images) → alarm persists? Unclear.  
  - Step 3: Forbidden intervention (firmware rollback) would suppress both → *same mechanism*.  
  - **Verdict:** Same mechanism (firmware update causal).  

  **Case 2: Plant 7 signature matches Plant 2 (scratched lens), but lenses clean**  
  - Step 1: Level = *sensor* (lens/sensor issue).  
  - Step 2: Safe test: Change lighting angle. If Plant 7 alarm disappears but Plant 2’s persisted historically → *different mechanisms*.  
  - Step 3: If safe test inconclusive, hypothetical lens cleaning suppresses Plant 2 but not Plant 7 → *different mechanisms*.  
  - **Verdict:** Different mechanisms (signature coincidental).  

  **Case 3: Plant 9, shift change + >30°C only**  
  - Step 1: Level = *sensor* (environmental sensitivity).  
  - Step 2: Safe test: Lower temperature (if possible) or simulate shift-change lighting.  
  - Outcome: If alarm suppresses when temperature normalized → *same mechanism, different trigger* (compound trigger: temp + shift change).  
  - **Verdict:** Same mechanism, different trigger.  

  ---

  \answer{(1) same mechanism; (2) different mechanisms; (3) same mechanism, different trigger}
