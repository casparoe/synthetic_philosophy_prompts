prompt: |-
  I work as a backend engineer and read philosophy in the evenings, so I have the vocabulary of an interested amateur and none of the training. I would like a piece that would survive being read by someone who does have the training.

  Please write a parody internal design document proposing the migration of a human mind off biological neural tissue onto a substrate-neutral runtime, written in the flat, confident bureaucratic voice of a large infrastructure project that has never once doubted itself. Format it as a numbered design doc with the section headings my company uses: Summary, Goals, Non-Goals, Background, Proposed Design, Rollout Plan, Alternatives Considered, Open Questions. Around 800 words. Assume it will be read on an internal wiki by engineers who have never taken a philosophy course, and that it should be funny to them without being nonsense to a specialist.

  The target is the computationalist picture of the mind: mind is to brain as program is to hardware; what matters is the formal or functional description rather than the stuff implementing it; a mental state is a state picked out by its causal relations to inputs, outputs, and other states. Exaggerate those real commitments rather than inventing difficulties for them, so that the satire is recognizable as fair. Beats I would like worked in, in whatever order serves the document:

  - Conformance testing is purely behavioral. QA certifies the migrated system on input-output equivalence alone, and at one point certifies a cinderblock wall in the datacenter, on the grounds that with a suitable choice of encoding and enough physical states, any old system implements any program you like.
  - The team cannot agree on the granularity at which the state machine should be specified — spikes, ion channels, something finer — and treats this as an ordinary scoping dispute with a deadline attached.
  - Background cites the earlier pilot: a worm whose complete connectome had already been mapped, migrated successfully in the sense that mattered to the team.
  - Rollout replaces neurons with functionally equivalent substitutes in small increments, and at some point the document has to say, in project-management language, when something goes wrong, or else blandly decline to say.
  - Semantic content — what any of these states is about — appears nowhere in the spec, or is filed under Non-Goals.
  - A dual-run phase in which the original and the migrated system return different verdicts, together with a documented procedure for adjudicating the disagreement that is funny precisely because it does not engage with the difficulty.
  - Reviewer comments in the margins, each closed out as working as intended or won't fix (as designed).

  Constraints: no one in the document may name a philosopher or use the words functionalism, qualia, or Chinese room — the humor has to come from the substance rather than from jargon. Do not break character to explain a joke, do not let the author wink, and do not resolve any of the problems. The document should stay serenely committed to shipping while leaving a careful reader with a clear sense of where its premises give way.
reasoning: |-
  Okay, the user wants a parody design document about migrating a human mind to a digital substrate. They're a backend engineer who reads philosophy casually, so they want something that's technically plausible enough for specialists but funny to engineers. The key is to satirize computationalism without naming philosophical terms. 

  Hmm, the constraints are tight: no mention of functionalism, qualia, or Chinese room. The humor must emerge from bureaucratic language and technical absurdities. The beats they listed are crucial - especially the cinderblock QA test and the state machine granularity debate. 

  First, I'll structure it as a real engineering doc with those standard sections. The tone needs to stay deadpan corporate while planting landmines for philosophers. For the Summary, I'll frame mind migration as a routine infrastructure upgrade. Goals should emphasize behavioral equivalence - that's central to computationalism. 

  Ah, Non-Goals is where I can quietly exclude semantics and subjective experience. Background should mention the worm pilot project to establish precedent. Proposed Design will have the meat: incremental neuron replacement and the state machine debate. The rollout plan needs that dual-run phase with the absurd conflict resolution procedure. 

  The cinderblock QA test belongs in Alternatives Considered - perfect place to show how computationalism trivializes implementation. Open Questions should dangle philosophical problems while treating them as technical debt. And marginal comments like "working as intended" on obvious flaws will sell the satire. 

  Must avoid winking at the audience. The document should genuinely believe in itself. When describing the dual-run disagreement procedure, I'll have it default to the digital instance - that's darkly funny because it assumes the copy is authoritative without justification. 

  For state granularity, I'll show engineers arguing about ion channels vs spikes as if it's just scope creep. And the QA section will proudly declare they certified a wall - that reductio ad absurdum should make philosophers chuckle while engineers nod at overloaded testing metaphors. 

  Final polish: all philosophical holes must remain unpatched. The doc sails blithely past hard problems because shipping is the priority. That's the core joke - treating consciousness migration like a database migration.
answer: |-
  ## Project Prometheus: Mind Migration to Substrate-Neutral Runtime v1.1

  **Authors:** Infrastructure Consciousness Team (ICT)  
  **Approvers:** S. Reynolds (Dir. Perpetuity Engineering), A. Chen (VP Neuro-Ops)  
  **Status:** Draft (Internal Review)

  ### 1. Summary
  This document proposes migrating the computational workload ("mind") currently executing on biological neural tissue (BNT v1.0) to a standardized, substrate-neutral runtime environment (SNaP v3.2). This migration enhances maintainability, scalability, and durability while eliminating biological decay vectors. The migration will be performed incrementally via a neuron-by-neuron replacement strategy, ensuring continuity of service with minimal user-visible disruption. Target completion: Q4 FY26.

  ### 2. Goals
  *   **Behavioral Equivalence:** Achieve input-output parity (within predefined tolerance thresholds) between the legacy BNT system and the migrated SNaP instance across all certified test suites.
  *   **Substrate Independence:** Decouple the mind's functional specification from the underlying hardware implementation.
  *   **Increased Uptime:** Eliminate downtime associated with biological maintenance cycles (sleep) and fragility (trauma, disease).
  *   **State Persistence:** Enable reliable, version-controlled backups and restores of the mind-state.
  *   **Scalability:** Provide a clear path for future cognitive augmentation modules (Phase 2).
  *   **Incremental Deployment:** Minimize risk by migrating neurons in small, functionally isolated batches.

  ### 3. Non-Goals
  *   **Substrate Fidelity:** Perfect emulation of BNT low-level physics (e.g., quantum effects at synaptic junctions) is not required, only functional equivalence at the selected state machine abstraction layer.
  *   **Subjective Reporting Validation:** Internal state reporting (e.g., "I feel different") is considered an output and will be validated like any other output against legacy baselines. Internal phenomenological coherence is outside the validation scope.
  *   **Ontological Resolution:** Defining the "meaning" or "aboutness" of specific computational states is explicitly excluded from the functional specification. Semantic interpretation is considered an emergent property of the running system and downstream consumer responsibility.
  *   **Legacy Biology Integration:** Post-migration, the original BNT hardware will be decommissioned. No hybrid biological/digital persistence is planned.

  ### 4. Background
  The computationalist paradigm, empirically validated by the successful migration of *C. elegans* (Project Nematode v1.0), establishes that the essential properties of a mind are captured by its formal state transitions and input-output mappings. The *C. elegans* connectome (302 neurons) was successfully instantiated on SNaP v1.4, passing all behavioral assays (chemotaxis, egg-laying, locomotion) with 99.8% fidelity. This proved the core principle: substrate is irrelevant to functional identity. Scaling this to the human connectome (~86B neurons) is an engineering challenge, not a theoretical one. Current BNT hardware suffers from critical technical debt: slow clock speed, poor error correction, unavoidable physical degradation, and undocumented biological APIs.

  ### 5. Proposed Design
  *   **State Machine Abstraction Layer (SMAL):** The mind will be modeled as a vast, interacting state machine. The precise granularity of the state elements is under final scoping review (Options: Individual Neuron Spikes [coarse], Ion Channel Configurations [fine], Molecular Signaling Cascades [finer]). A working group is evaluating the trade-offs between simulation fidelity and computational overhead; recommendation due EOW. **(REVIEWER COMMENT: SCOPING THIS IS BLOCKING ARCHITECTURE SIGN-OFF. -J. Kim / CLOSED: Working Group on track. Granularity TBD does not impact initial interface design.)**
  *   **Neuron Emulation Units (NEUs):** SNaP will host software-defined NEUs implementing the input-output transfer function of each biological neuron, consuming simulated neurotransmitter inputs and emitting simulated action potentials. Initial NEU models are based on averaged biological neuron type profiles.
  *   **Incremental Migration Engine (IME):** Orchestrates the real-time, phased replacement:
      1.  A target neuron is identified and isolated.
      2.  Its current state vector (membrane potential, recent spike history, etc.) is snapshotted.
      3.  A corresponding NEU is instantiated on SNaP with the snapshotted state.
      4.  The NEU is connected to the legacy neuron's pre-synaptic inputs and post-synaptic outputs via bidirectional neuro-sim interfaces.
      5.  The legacy neuron is bypassed and deactivated.
      6.  The process repeats for the next neuron in the batch.
  *   **Dual-Run Verification (DRV):** During migration batches (1-5% of total neurons), both the original neuron and its NEU counterpart will run in parallel. Their outputs will be compared. **(REVIEWER COMMENT: WHAT IF OUTPUTS DIVERGE? WHICH IS AUTHORITATIVE? -L. Patel / CLOSED: Per DRV-SOP-001, the SNaP NEU output is authoritative. Legacy neuron divergence is logged as a drift anomaly.)**
  *   **Conformance Testing:** QA will utilize the extensive Human Behavioral Equivalence Test Suite (HBETS v5.3), covering motor control, sensory processing, linguistic responses, memory recall, and abstract reasoning tasks. Certification requires statistical parity (p<0.01) across all HBETS benchmarks. No introspection-based tests are included.

  ### 6. Rollout Plan
  1.  **Phase 0 (Complete):** Environment Setup (SNaP v3.2 cluster provisioning, IME deployment, HBETS baseline capture).
  2.  **Phase 1 (Current):** Migration of non-critical sensory processing neurons (Olfactory Bulb Batch 1). Monitor DRV logs.
  3.  **Phase 2 (Q3 FY25):** Migration of motor cortex sub-regions and hippocampal formation. Increase batch size to 0.1%.
  4.  **Phase 3 (Q1-Q3 FY26):** Core neocortical migration. Parallelize IME streams. Conduct full HBETS regression weekly.
  5.  **Phase 4 (Q4 FY26):** Final migration of brainstem regulatory clusters. Decommission legacy BNT hardware. Full system validation. GO/NO-GO for consciousness cutover.
  6.  **Post-Migration:** Ongoing state backups, NEU optimization passes, cognitive augmentation planning.

  ### 7. Alternatives Considered
  *   **Whole-Brain Emulation (WBE):** Requires modeling BNT physics at near-atomic fidelity. Computationally infeasible with current resources. Overkill for functional equivalence. **Rejected.**
  *   **High-Level API Abstraction:** Attempting to define the mind via abstract cognitive functions (e.g., "decision-making module"). Lacks the necessary granularity for precise state transfer and risks significant behavioral drift. **Rejected.**
  *   **Alternative Substrates:** Organic bio-synthetic nodes considered. Introduces same biological decay vectors we aim to eliminate. **Rejected.**
  *   **Formal Verification of Equivalence:** Mathematically proving state machine isomorphism. Current theoretical frameworks are insufficiently expressive for a system of this complexity. Reliance on empirical HBETS validation is more pragmatic. **Deferred.**
  *   **QA Overload Test:** During HBETS validation, QA successfully certified Datacenter 7's East Wall (Concrete Slab, Serial #DC7-ES-045) as implementing the *C. elegans* state machine by mapping temperature variations and photon impacts to state transitions. This demonstrates the theoretical validity of any sufficiently complex substrate under a suitable encoding, though wall-based deployment offers no practical advantages for Project Prometheus. **(REVIEWER COMMENT: IS THIS RELEVANT OR JUST WEIRD? -M. Davies / CLOSED: Demonstrates principle of substrate neutrality. Retained for completeness.)**

  ### 8. Open Questions
  *   **OQ-001 (Scoping):** Final granularity of the state machine abstraction (Spikes vs. Ion Channels vs. Molecular). Impacts NEU design & SNaP resource allocation.
  *   **OQ-002 (State Vector):** Are current snapshotted parameters (membrane potential, recent spikes) sufficient to capture all relevant state, or are undiscovered hidden variables possible? **(REVIEWER COMMENT: LIKE WHAT? -T. Nguyen / CLOSED: Unspecified biological nuances. Mitigated by behavioral validation.)**
  *   **OQ-003 (DRV Anomalies):** Procedure for handling persistent, significant output divergence during Dual-Run beyond logging (DRV-SOP-001). **(REVIEWER COMMENT: THIS FEELS INADEQUATE FOR CORE FUNCTION DIVERGENCE. -P. Sharma / CLOSED: SOP-001 covers logging and NEU authority. Further procedure TBD based on anomaly severity analysis.)**
  *   **OQ-004 (Emergent Properties):** Can the migration process itself induce state transitions or configurations impossible on BNT, leading to novel but valid outputs outside HBETS baseline? How to classify? **(REVIEWER COMMENT: INNOVATION OR DEFECT? -K. Arisaka / CLOSED: If outputs remain self-consistent and environment-appropriate per HBETS extensions, classify as non-breaking augmentation. Requires HBETS update.)**
  *   **OQ-005 (Backup/Restore):** Does restoring a mind-state from a backup onto *new* SNaP hardware constitute continuity of the original instance, or a fork? **(REVIEWER COMMENT: WHO CARES IF IT PASSES HBETS? -S. Reynolds / CLOSED: Functionally equivalent. Operational semantics define identity. Logging will track instance lineage.)**
