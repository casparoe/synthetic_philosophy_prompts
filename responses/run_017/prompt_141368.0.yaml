answer: |-
  Here is a point-by-point assessment with marginal comments as requested, followed by the overall mark:

  **Marginal Comments:**

  **On (a):**  
  *   **Correct:** Accurately identifies S&W’s rejection of the premise that employing knowledge-that requires *occurrent contemplation* of the proposition. Correctly notes their constitutive claim about knowing-how being standing propositional knowledge.  
  *   **Imprecise:** The practical mode of presentation is *not* doing "separate work" merely to distinguish expert from book knowledge *after* the constitutive claim. It is *essential to the constitutive claim itself* – it’s *how* the proposition is known that makes it knowledge-*how*.  
  *   **Reasoning Fails:** The conclusion that S&W "collapse into anti-intellectualism" is a significant error. S&W *explicitly* deny knowledge-how is a disposition to *behave*; it is a relation to a proposition under a practical MoP. A standing propositional attitude is *not* equivalent to a Rylean behavioural disposition. The regress escape requires no such collapse. This misrepresents S&W’s core thesis.

  **On (b):**  
  *   **Correct:** Clearly presents the physiologist objection and accurately states S&W’s standard reply invoking the lack of a practical mode of presentation.  
  *   **Imprecise:** Describing it as the "mirror image" of Ryle's cyclist is apt for the cases, but the subsequent claim about necessity is overstated within S&W's framework.  
  *   **Reasoning Fails:** The leap that this shows "knowing-that is not necessary for knowing-how" *undercuts the intellectualist reply just given* and misrepresents S&W. S&W *deny* the physiologist has the relevant *knowledge-that* (because she lacks the practical MoP), and they *deny* the skilled cyclist lacks the relevant *knowledge-that* (they possess it under a practical MoP, even if they can't articulate it theoretically). Therefore, S&W maintain that (their specific kind of) knowing-that *is* necessary and sufficient for knowing-how. Asserting that the cases show knowing-that isn't necessary contradicts the intellectualist position being discussed.

  **On (c):**  
  *   **Correct:** Correctly identifies why it’s not *merely* verbal (disagreement over the nature of the state: factivity, content, storage/testimony). Correctly notes agreement on cases doesn't entail verbal dispute and that cases underdetermine theory. Good point about absorption of cases not making the dispute non-substantive.  
  *   **Imprecise:** The claim that anti-intellectualists see knowledge-how as non-factive is debatable (many tie it to ability/performance, which has success conditions). More crucially, misses that S&W *insist* their propositional knowledge (with practical MoP) *explains* the ability-linked features (storage, forgetting, testimony limitations) – they aren't denying these phenomena exist.  
  *   **Reasoning Fails:** While defending substantiveness well, the answer doesn't engage with the *strongest argument for verbalism*: that S&W might be *re-describing* the ability/disposition (the anti-intellectualist's core posit) *as* a type of propositional knowledge via the practical MoP, potentially just relabeling the same underlying state. The student asserts substantiveness but doesn't adequately counter this specific concern about re-description.

  **Mark: 14 / 20**

  **Breakdown:**  
  *   **(a): 4/7** (Strong start, crucial error in the collapse claim).  
  *   **(b): 4/7** (Good setup & initial reply, but final conclusion contradicts S&W's position and undermines the reply).  
  *   **(c): 6/6** (Good defense of substantiveness, minor imprecision, but addresses the core demand effectively).  

  **Rationale for Mark:** Demonstrates a good grasp of the core arguments and texts, with sophisticated structure and insight (especially in (c)). However, it contains significant substantive errors in interpreting S&W's position in (a) and (b) – specifically misrepresenting their view as collapsing into Ryle's and misstating the implications of the dissociation cases *for S&W's specific theory*. These errors prevent a higher mark despite the strengths.
