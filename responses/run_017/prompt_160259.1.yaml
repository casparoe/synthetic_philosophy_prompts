answer: |-
  ### Charitable Restatement of Positions  
  *(Uncontroversial framing, per your description)*  

  **Individualists** argue: Social phenomena are *constituted* by individuals' states and interactions. Any causal claim at the macro level must be *mechanistically redeemable*—traceable to micro-level mechanisms (beliefs, constraints, interactions). If a macro pattern dissolves when individuals and their relations are fixed, it’s epiphenomenal. Their strength: cases where apparent "structural" effects (e.g., price bubbles) emerge from simple individual rules + local interactions.  

  **Holists** argue: Some causal powers are *emergent* at the macro level. Identical individuals in different structures yield different outcomes; macro variables (e.g., "institutional trust") provide stable, transportable causal insights even when micro mechanisms vary. Their strength: cases where macro variables (e.g., network density) predict outcomes despite micro-heterogeneity, and where micro models fail to generalize.  

  **Point of contact**: Both agree social facts supervene on individuals. The dispute is whether macro-level *causal explanations* require micro-foundational reduction to be valid.  

  ---

  ### Diagnosis: What Kind of Disagreement Is This?  
  *(Confidence: High, based on debate dynamics you describe)*  

  This is **primarily a methodological dispute about explanatory priorities**, **secondarily a variable choice problem**, and **only superficially a metaphysical clash**.  

  - **Why methodological?**  
    Both sides accept supervenience but diverge on *what counts as explanatory*. Individualists prioritize *mechanistic fidelity*: an explanation must specify *how* outcomes are produced. Holists prioritize *predictive robustness*: an explanation must identify *reliable levers for intervention* across contexts. Your group’s stalemate arises because each side treats their criterion as necessary for "genuine" causation.  

  - **Why variable choice?**  
    The dispute hinges on which variables are most *tractable and invariant* for modeling. Individualists see macro variables as coarse summaries of micro states; holists see them as stable nodes in causal networks. When holists cite "same individuals, different outcomes," individualists retort that the individuals *aren’t* identical (their beliefs/constraints changed with the structure). This is a variable-operationalization clash, not ontology.  

  **Predictions confirmed**:  
  - Both sides dismiss each other’s cases as compatible with their view (e.g., individualists say structural differences reduce to micro-constraints; holists say emergent patterns are irreducible *for practical purposes*).  
  - The debate devolves to "what explanations must do" because core metaphysics is agreed upon.  

  ---

  ### Assessment of Your Hypothesis  

  **Part 1 (Two notions of cause)**:  
  *(Confidence: High that this captures a real divide; Moderate that it fully explains the stalemate)*  
  - **Correct**: The production/difference-making distinction aligns cleanly with the camps. Individualists demand productive mechanisms; holists seek invariant difference-makers.  
  - **Incomplete**: It doesn’t explain why the debate *persists* despite mutual acknowledgment. The deeper issue is **explanatory monism**: both sides implicitly claim their causal notion is *the* standard for science. Your "verbal dispute with a policy stake" is apt—but the stalemate persists because each denies the other’s notion is sufficient.  

  **Part 2 (Domain-specific invariance)**:  
  *(Confidence: High; this is the crux)*  
  - **Spot-on**: The genuinely empirical question is *where invariants reside* (micro or macro) in a given domain. This *is* domain-specific and slow to resolve.  
  - **Why it fails to break the stalemate**: Individualists demand that macro invariants *must* be micro-reducible (even if inconvenient); holists see micro-reduction as often futile for policy. This empirical question gets hijacked by prior methodological commitments.  

  ---

  ### Audit of Realizer-Swap Invariance  
  *(Confidence: Moderate; conceptually coherent but fragile in practice)*  

  Your criterion: Macro causation earns autonomy if (i) effects persist when individuals are swapped (holding structure fixed), and (ii) macro interventions aren’t just bundled micro-interventions.  

  - **Not incoherent, but question-begging**:  
    - (i) assumes "structure" can be held fixed independent of individuals—but structures *are* instantiated by individuals. Swapping individuals *is* an intervention on the structure (e.g., replacing workers *changes* a firm’s culture). Individualists will reject "holding structure fixed" as smuggling in holism.  
    - (ii) is circular: whether an intervention is "merely redescriptive" depends on prior assumptions about variables.  

  - **Collapses into variable choice**: Satisfying (i)-(ii) just shows macro variables are *pragmatically useful nodes* for modeling. It doesn’t prove ontological emergence—only that, for some systems, macro descriptions are *irreplaceable tools* for prediction/control. Individualists can concede this while denying it reflects "real" causation.  

  - **Would it settle anything?**  
    - **Holists** would see it as validating macro-autonomy.  
    - **Individualists** would reinterpret: Persistence under realizer-swap just shows the *structural constraints* on individuals are causal (micro-level), not the macro variable itself.  

  **Verdict**: Useful for isolating *pragmatic autonomy* but fails as an ontological test.  

  ---

  ### What Counts as Progress?  
  *(Confidence: High on this path; based on resolving similar disputes)*  

  **Progress requires abandoning the global fight and focusing on local, empirical wins**:  

  1. **Shift the question**: Stop asking "Which level is *really* causal?" and ask:  
     > *"For a specific outcome in a specific context, which level of analysis delivers the most invariant, tractable, and policy-useful model?"*  

  2. **Develop test cases**: Identify domains where micro and macro models make *conflicting predictions*. Example:  
     - **Macro claim**: "Centralized bargaining reduces wage inequality."  
     - **Micro claim**: "Inequality stems from skill-biased tech change; bargaining structures are epiphenomenal."  
     - **Test**: Swap bargaining structures (e.g., via policy reform) while tracking micro-attributes. If inequality shifts predictably *without* micro-changes, holism gains ground.  

  3. **Formalize trade-offs**: Build models showing when macro variables *lose information* (favoring individualism) vs. when micro models *overfit* (favoring holism). Key metrics:  
     - **Transportability**: Does the model work in new contexts with minimal re-specification?  
     - **Intervention fidelity**: Can the model guide precise interventions?  

  4. **Acknowledge explanatory pluralism**: Legitimize both goals:  
     - **Mechanistic explanation** (individualist) for understanding *how* things work.  
     - **Difference-making explanation** (holist) for predicting *what* will happen under intervention.  

  **Why this works**: It sidesteps unresolvable metaphysics, leverages your group’s shared supervenience premise, and turns the debate toward tractable, domain-specific questions. The standoff persists because both sides are partly right—but "right" for different purposes. Progress comes when your group can say: *"For problem X, use a micro model; for problem Y, a macro model suffices—and here’s how to tell which is which."*  

  **What won’t work**: Any "ultimate" test (like realizer-swap) or abstract argument. The dispute is pragmatic, not metaphysical—and pragmatics are settled case-by-case.
