  For the solution, suggest a working group to draft guidelines based on Orwell's "agent-verb-affected" test, with a 6-week timeframe. Include implementation steps: mandatory review for high-impact communications, optional workshops, and an annual audit using the clarity test. This addresses the need for measurable outcomes.

