prompt: |-
  Hey — I'm a novelist, about two hundred pages into the middle book of a trilogy set in Glasgow and Williamsburg, and I've hit a problem with one of my characters that I can't think my way out of. Ishbel is the daughter of a Glasgow tobacco merchant, sharp, largely self-taught, and she's got hold of a copy of the new book by the Glasgow professor everyone in the city is arguing about — still in wrappers, title page missing, she stays up reading it by the kitchen fire. I want her to be genuinely against the colonial system, for reasons she'd actually have had available to her, while her father and his Virginia cousin are for it. My writing group keeps telling me to just make her morally outraged, which is exactly the note I don't want: I want her opposition to be the kind a person could have arrived at from the arguments in the room.

  The thing I keep circling is this. As far as I remember it, Smith's case against the colonies is almost entirely a ledger case: the monopoly drags British capital into a slower trade than it would otherwise find at home, the wars and the governing cost more than the commerce returns, the whole arrangement is run for the benefit of merchants and politicians at everyone else's expense, and the sensible thing would be to open the trade, or let the colonies go their own way, or bring them properly into the constitution. What he more or less doesn't do — or so it reads to me — is say that the whole business is a wrong done to the people actually living under it. The complaint is that Britain is being cheated and badly served, not that anyone is being ruled without their consent. So: what are the most important implications of that shape of argument — an argument about cost and mismanagement rather than about injury — for the kind of anti-imperialism it's plausible for someone like Ishbel to hold in 1776? I'm especially interested in what follows for (a) how she'd answer the obvious question "but what if it did pay?", (b) whether Smith's remedies are really an alternative to empire or just a tidier version of it, and (c) whether she can get from Smith to "this is an injustice" at all without quietly importing something Smith himself wouldn't have accepted.

  Two more things, and please push back on both rather than being agreeable. First, I've been sorting objections to empire into what I call 'the auditor's objection' (it doesn't pay, it's run badly, the money lands in the wrong pockets) and 'the neighbour's objection' (whatever it pays, you are ruling people who never agreed to be ruled, and that's the whole of it) — my sense is that Smith gives you the first almost completely and the second barely at all. Is that pair doing any real work, or is it a false contrast I've talked myself into? Second, the wrinkle I genuinely can't get straight: Smith seems to hold at once that people are much alike everywhere (the bit about a philosopher and a common street porter differing very little by nature) and a kind of staging-picture where societies pass through hunting, herding, farming and commerce, with some a long way behind others. If both of those are really in him, what follows for whether his critique of empire is a critique of ruling over people at all, or only of ruling over them badly and at a loss? I have a sinking feeling the honest answer is "both, and he never noticed", which would make Ishbel's position unstable in a way that might actually be good for the novel. Oh — American English please, my New York editor keeps flagging my spellings, and don't give me citations or a reading list, I've got a stack of secondary stuff on the desk already and I'll match it up myself; its the argument I need. (Sorry, typo there, been at this since six.)
reasoning: |-
  Okay, the user is a novelist working on a historical fiction trilogy set in Glasgow and Williamsburg. They're stuck on developing a character named Ishbel, the daughter of a tobacco merchant, who opposes the colonial system. The challenge is making her opposition plausible based on the arguments available in 1776, particularly drawing from Adam Smith's economic critiques rather than modern moral outrage. 

  The user has identified two types of objections to empire: the "auditor's objection" (economic inefficiency) and the "neighbor's objection" (moral injustice). They want to know how Ishbel can navigate Smith's arguments, which focus mainly on economic inefficiency, to form a coherent anti-imperial stance. 

  Key questions they raised:
  1. How would Ishbel respond if the colonial system did turn a profit? 
  2. Are Smith's proposed reforms (free trade, constitutional integration) truly alternatives to empire or just more efficient versions? 
  3. Can she derive a moral objection ("this is an injustice") from Smith's framework without anachronism?

  They also highlighted a tension in Smith's work: his belief in universal human similarity versus his stadial theory of societal development. This creates ambiguity about whether Smith objects to ruling people per se or just ruling them poorly. 

  The user explicitly asked not for citations but for argument structure, and wants American English. They seem deeply researched but overwhelmed by secondary sources. Their frustration with writing group suggestions ("just make her morally outraged") shows they care deeply about historical authenticity. 

  The challenge is balancing:
  - Historical plausibility (using 1776-available arguments)
  - Character consistency (Ishbel as self-taught thinker)
  - Narrative tension (her views should clash meaningfully with her father's)
  - Intellectual honesty (not smuggling modern ethics into 1776)

  The core opportunity here is leveraging the contradictions in Smith's own position to create rich character conflict. Rather than a flaw, the instability in Ishbel's views could be a strength for the novel.
answer: |-
  You're sharp to spot the tension in Smith—it's exactly where Ishbel's most interesting contradictions would live. Here's how I'd break it down for her, arguing from *within* that 1776 Glasgow room, using Smith's own tools to push further than he might:

  ### Your Auditor/Neighbor Distinction is Spot On (And Useful)
  Smith gives you **almost pure Auditor**. His case is: empire is *fiscally idiotic* for Britain. The monopoly distorts investment, the wars bleed the treasury, the administration is corrupt, and the whole thing enriches a tiny clique while burdening the British taxpayer and consumer. The neighbor's objection (ruling people without consent *as a fundamental wrong*) isn't his focus. *But*, his framework creates cracks where Ishbel could lodge a crowbar:

  1.  **His Universalism ("philosopher and porter"):** Smith believes in fundamental human equality *of capacity and interest*. People everywhere respond to incentives, seek betterment, and possess reason. For Ishbel, this undermines the *justifications* for ruling others. *Why* do Virginians need Glasgow merchants dictating their trade? *Why* can't they govern their own affairs if their capacity is similar? The Auditor says "It costs us too much." The Universalist implication Ishbel might seize is "It insults *their* capacity." It becomes inefficient *because* it ignores this universal drive for self-determination.

  2.  **His Stadial Theory (Hunting to Commerce):** This is where it gets messy and fruitful for you. Smith sees progress as natural but uneven. Crucially, he argues **commerce requires security of property and predictable justice** to flourish. The Auditor says colonial rule is inefficient. Ishbel could argue: **Imperial rule *itself* actively *prevents* colonies from reaching the "commercial" stage necessary for mutual benefit.** How?
      *   **Monopoly Stifles Growth:** Smith hates monopolies because they stifle competition and innovation *in Britain*. Ishbel applies it *there*: the Navigation Acts prevent *Virginians* from developing diverse industries, selling where they get the best price, buying where it's cheapest. This *keeps them* artificially dependent, like a less "advanced" society – a problem *caused* by empire, not inherent.
      *   **Corruption Undermines "Commercial" Society:** Smith rails against the corruption of British politics by colonial interests. Ishbel sees the *colonial administration itself* as inherently corrupt and arbitrary, *preventing* the establishment of the secure property rights and impartial justice Smith says is essential for commercial society. How can Virginia progress if its courts favor British creditors or its governors are placemen enriching themselves?
      *   **War Disrupts Progress:** Constant imperial wars devastate colonial economies and drain British resources needed for domestic improvement. This actively *reverses* or stalls the "progress" Smith describes.

  ### Answering Your Core Questions Through Ishbel's Lens

  *   **(a) "But what if it *did* pay?" (The Auditor's Nightmare):**
      Ishbel’s retort, rooted in Smith’s deeper principles:
      1.  **"It *can't* truly pay in the long run *because* it stifles them."** Even if the treasury showed a surplus *today*, the monopoly and political control prevent the colony from reaching its full productive potential. Britain’s *future* gains from a free, prosperous trading partner (via Smith’s mutual benefit of free trade) are sacrificed for short-term monopoly rents. It’s *still* inefficient when you account for lost opportunity.
      2.  **"Who pays? And who *really* gains?"** If it "pays," it pays the *British treasury* (maybe) via taxes/tariffs, and *definitely* pays the monopolist merchants (like her father). But it costs the *colonists* through higher prices, restricted opportunity, and arbitrary rule. It costs the *British poor* through taxes for wars and higher prices for goods. Smith’s Auditor cares about net loss to Britain. Ishbel uses his focus on *distribution*: "Paying" just means better-organized extraction benefiting a few at the expense of the many *on both sides*. That’s not true national gain.
      3.  **"Would you sell your own liberty so cheaply?"** (The Universalist jab). If the capacity is the same, how can perpetual subjugation be justified *even if profitable*? This edges towards the Neighbor, but grounds it in Smith's own assertion of universal capacity and self-interest. *His* logic implies people *everywhere* will resist being milked like this, leading to instability and future cost (rebellion!).

  *   **(b) Smith's Remedies: Alternative or Tidy Empire?**
      Smith’s options (free trade, constitutional union, or peaceful separation) are **fundamentally Auditor-driven solutions to an Auditor-identified problem.** Ishbel would see:
      *   **Free Trade:** This directly addresses the inefficiency. It *is* an alternative to *mercantile* empire. But it doesn't inherently challenge *political* control. Ishbel could argue *real* free trade requires *political autonomy* for the colony to set its own regulations and negotiate freely. Otherwise, "free trade" is just a less restricted monopoly imposed by London.
      *   **Constitutional Union:** Giving colonies representation at Westminster *might* solve the "no taxation without representation" cry *and* align interests. But Smith himself worried about the logistics. Ishbel would see the *arrogance*: "We'll decide when *you* are ready to join *us* on *our* terms." It assumes British superiority and centrality, preserving empire under a different name. How would Virginia's interests *really* be balanced against Lancashire's?
      *   **Peaceful Separation:** Smith admits this might be best if union is impossible. For the Auditor, it cuts losses. For Ishbel, this is the logical endpoint of Universalism + Stadial Theory: *Let them manage their own progress.* This is the clearest alternative, but it’s presented by Smith as a pragmatic last resort, not a moral imperative.

  *   **(c) Can she get to "Injustice" from Smith? (Without Cheating):**
      **Yes, but it's a specific *economic and developmental* injustice, not a pure "natural rights" cry.** She can argue:
      *   **Injustice to the Colonists:** Imperial rule *denies colonists the natural right to pursue their own interest* within a fair commercial society, which Smith posits as the driver of progress and betterment. It artificially holds them back ("stadial" theory misapplied *by policy*), denies them security of property under impartial law (due to corrupt/captive administration), and forces them to subsidize British interests (monopoly pricing, taxes for imperial wars). This is a violation of the *universal* principles of self-betterment and fair exchange Smith describes. *That's* the injustice: **systematically thwarting their natural economic liberty and potential.**
      *   **Injustice to the British People:** The system burdens the many (taxpayers, consumers, soldiers) for the benefit of the few (merchants, politicians). *That's* unjust distribution – a core Smithian concern.

  ### The Instability is the Gold

  You’re right: **Smith *does* hold both universalism and stadial theory, and he never perfectly reconciles them.** This *isn't* a flaw for your novel; it’s Ishbel’s engine.

  *   Her "anti-imperialism" isn't a modern, fully formed ideology. It's a bright, self-taught young woman grappling with a radical text, applying its logic ruthlessly to the world she sees (her father's trade, Glasgow's debates, news from Virginia). She *will* be inconsistent.
  *   She might fiercely argue the Universalist point against her father ("They're as capable as us! Why can't they...?") but unconsciously slip into stadial language when imagining Virginia ("trapped in dependency," "prevented from advancing").
  *   She might passionately decry the *injustice* done to Virginians' economic potential while barely considering the enslaved Africans upon whose labor the whole tobacco economy rests. *That's* the room she's arguing in.
  *   Her argument against empire *is* unstable because Smith’s critique is fundamentally about efficiency, not inherent right. She’s pushing his logic towards a more radical conclusion than he might have embraced, fueled by her own observations and the inherent tensions in his work. That struggle *is* her character development.

  **How this sounds for Ishbel (arguing with her father):** "It’s not just that it bleeds the Treasury, Father! Don't you see? The Navigation Acts *bind* them. How can Mr. Jefferson's people ever build proper warehouses, or mills, or anything but tobacco fields, if they can only ship to us, on our ships, at our prices? Professor Smith says all men seek betterment, that commerce needs freedom to thrive. We’re *stopping* them thriving! We keep them like... like tenants forbidden to improve their own land, all so a few men in London and Glasgow can take their cut. It’s not just wasteful. It’s... it’s *holding them back*. It’s unjust! And mark my words, they won't stand for it forever. Why should they? Would *you*?"

  This makes her opposition:
  1.  **Plausible:** Rooted directly in Smith's text (monopoly, stifled growth, universal capacity, self-interest).
  2.  **Complex:** Economic *and* developmental, edging towards moral ("unjust," "holding them back") via Smith's own logic, not imported natural rights.
  3.  **Historically Grounded:** Reflects the actual 1776 debates focusing on trade, governance, and cost.
  4.  **Unstable & Dynamic:** Her Universalism clashes with the implications of Stadial theory; her focus is on colonial *planters* like Jefferson, not the enslaved. This creates internal tension and room for future growth (or disillusionment).
  5.  **Dramatic:** Provides specific, pointed arguments against her father's livelihood and worldview.

  The Auditor gave her the axe. Smith's Universalism and focus on the *conditions* for progress showed her where to swing it. The Neighbor’s pure moral outrage isn't available to her *yet*, but she’s chipping away at the wall between them using the tools she has. Lean into that friction – it’s where your novel lives.
