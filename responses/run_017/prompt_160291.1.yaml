prompt: |-
  Hey — I write novels, not philosophy papers, so apoligies in advance if I mangle the vocabulary. I'm maybe two hundred pages into a book about a country coming apart, and I've hit the part where two characters have to sit in a room and argue about whether the breakaway region is *entitled* to go. I can't fake that argument. So what I want from you is the spec, not the verdict.

  Write me the desiderata: what a theory of when secession is legitimate — as opposed to merely successful — has to deliver in order to be worth taking seriously. And fix the purpose for me, since I gather adequacy is relative to one: I need a theory good enough that (i) I can tell where it lands on the cases in my book without the outcome feeling arbitrary, and (ii) a smart character can say it out loud in a negotiation scene and a reader who has never opened a political theory book still feels its force. Please don't give me the actual constitutional law of Spain, the UK or Canada, and no citations or reading lists — my country is made up and I'm not writing about those places anyway.

  The cases I need it to get right, with the reason each one is a test:

  The real ones, which I know roughly and you don't need to research — Scotland, where the union is old, the secessionists wanted to keep some shared institutions and the vote was negotiated and lost; Catalonia, where the rump state's constitution says the country is indivisible, the vote was held anyway and called illegal, and money flowing out of the region is part of the grievance; Quebec, where the secession is peaceful and democratic and the region already has a lot of self-government, but leaving would cut the remaining country geographically in half. Plus the nested version: a smaller people inside the seceding region saying that if the region leaves, they and their land leave with it. And the case where a region's complaint is basically fiscal — we're richer, we're tired of transferring, we want out.

  The invented ones, which are the ones I actually care about:
  - The territory that wants to leave is not contiguous. It's a river valley, a port city, and a strip of highway connecting them that runs through districts that vote to stay. Is that still secession? Does contiguity matter, and if it does, why — what is the theory even about, land or people?
  - The referendum passes 51–49, and one district inside the region votes 70% to remain in the rump state. It wants its own mini-counter-secession. Any border you draw seems to manufacture the problem again one scale down.
  - The rump state's objection is not justice but survival: it needs the port and it needs the water that comes off the upstream dams in the seceding territory. It says it cannot function without them.
  - One of the seceding groups is mostly descended from people who arrived two generations ago. They've been there long enough to have a distinct accent and a distinct grievance. Is that a "people" yet, and who says?

  The distinctions I don't want collapsed: a right to self-determination versus a right to secede (maybe the first is satisfiable by autonomy and the second never follows from it); a moral right to secede versus a legal one versus a third country's right to recognize; secession versus dissolving the whole state versus a province joining a neighbouring country versus just moving a border; legitimacy of seceding versus what the rump state may do to resist it (surely a state can oppose a legitimate secession in an illegitimate way). And tell me what a theory has to say about who gets to vote — residents, people born there, emigrés, recent arrivals, the people in the corridor — because that looks like the question the whole thing sits on.

  Then mark which requirements are non-negotiable and which are just prejudices of one camp. Some things I suspect are camp preferences dressed up as requirements: that secession can only ever be a remedy for injustice; that the consent of a democratic majority settles it; that existing states get a presumption in favour of their borders; that a group has no claim unless it already has a national identity; that a theory must be able to handle a purely economic grievance as legitimate, or must be able to rule it out. Tell me which of those are load-bearing and which are just what that camp wanted to conclude anyway.

  The part I most want: flag any pair of desiderata you suspect can't be jointly satisfied. I have a feeling at least two of them are in tension — something like "a clear majority in the region settles it" against "no border change may create a new permanent minority," and something like "legitimacy must be knowable in advance by the people deciding" against "legitimacy depends on how viable the new state turns out to be," which nobody knows until after. If the honest conclusion is that no theory can have all of this at once, say so plainly, because that's genuinely useful to me: it means the scene can't be won on principle and I should write it differently.

  Also: mark any criterion that an ordinary reader would feel in their gut — the ones my characters will actually say out loud, like you can't just take the port with you. Those matter more to me than the elegant ones.

  And tell me which single requirement does the most work in ruling theories out — which one knocks out the most candidates at a stroke.

  At the end, a very short scorecard, three sentences each max, for the three or four big families I keep half-remembering: remedial-right-only, plebiscitary or primary-right theories, nation-or-people-based ones, and whatever the aggregative consequentialist version is called. Keep the weight on the criteria, though — that's the part I'm going to actually use.
reasoning: |-
  Okay, let me unpack this novelist's request. They're building a fictional country's dissolution scene and need the philosophical scaffolding for a secession debate - not answers, but the criteria that make a theory credible. The real challenge is crafting something that feels airtight to readers while serving dramatic tension.

  First, I notice they need two layers: technical robustness (to avoid arbitrariness) and rhetorical gut-punch (for character dialogue). The test cases are clever - Catalonia/Scotland/Quebec as real anchors, plus invented dilemmas like non-contiguous territory and nested secessions. Key distinctions matter: self-determination ≠ secession, moral ≠ legal rights. 

  Hmm... the core tension emerges around irreconcilable desiderata. For example:
  - Clarity vs Flexibility: "Knowable in advance" clashes with "depends on viability outcomes"
  - Majority rule vs Minority protection: 51% vote can't create new oppressed groups
  - Land logic vs People logic: Non-contiguous territory exposes this fault line

  The river valley case is particularly brilliant - it forces the theory to declare whether territory or population is sovereign. And that 51-49 vote with a 70% remain enclave? Any solution either betrays democracy or manufactures micro-minorities. Perfect dramatic fodder.

  I'll flag the "gut-feel" criteria hard: things like "you can't take the port" or "we paid for those dams." These matter more than academic elegance. The viability requirement ("rump state collapses without the dams") feels especially primal - survival trumps principle.

  For knockout criteria, "no new permanent minorities" seems strongest. It sinks most simple-majority theories. Close second is viability - if secession dooms either state, is it legitimate?

  On theory families:
  - Remedial-only (injustice required) feels fair but too narrow for economic grievances
  - Plebiscitary (vote=legitimacy) is clean but ignores minorities and viability
  - Nationalist (pre-existing "people") gets fuzzy on new identities
  - Consequentialist risks justifying anything that "works"

  The honesty moment comes in admitting some criteria conflict fundamentally. That's useful - it means their characters can't "win" the argument, only fight compellingly. I'll emphasize that in the response.

  Most importantly: the vote question ("who decides?") is the trapdoor beneath all theories. Every answer creates new inclusions/exclusions. That's where the drama lives.
answer: |-
  Here’s the spec for a theory of legitimate secession – stripped to its load-bearing beams, with tensions flagged and gut-level hooks highlighted. Aim for **coherence, practical adjudication, and rhetorical force** over philosophical perfection.

  ---

  ### **Core Purpose of the Theory**  
  To provide a **morally defensible, consistently applicable framework** for judging when a region’s attempt to break away is *legitimate* (not just successful), such that:  
  1. **Outcomes feel non-arbitrary** in your fictional cases (no "hand-waving").  
  2. **Characters can argue its core logic in plain language** that resonates with readers lacking theory background (appeals to fairness, survival, or obvious injustice).  

  ---

  ### **Desiderata: What the Theory MUST Deliver**  
  *(Non-negotiables in bold; camp biases in italics)*  

  1. **Define the "Self" in Self-Determination**:  
     - Must specify **who gets to claim secession** (a defined group? residents of a territory? both?) and **why they qualify**.  
     - *Trap:* "Pre-existing nationhood" vs. "oppressed population" vs. "territorial majority" – each loads the dice.  
     - **Gut Hook**: *"We’ve lived here for generations, built this place – it’s ours."* vs. *"You can’t split people who’ve been part of us for centuries!"*  

  2. **Address Territory vs. People**:  
     - Must resolve **non-contiguity** (your river valley/port/corridor case). Is land just a vessel for people? If land matters, why?  
     - **Gut Hook**: *"You can’t carve out the port and leave us strangled!"*  

  3. **The Border Problem**:  
     - Must handle **nested secession** (minority-within-minority) and **counter-secession** (your 70% remain district).  
     - **Non-negotiable**: **No solution can create new permanent, oppressed minorities** without recourse. "Our 70% vote counts too!"  

  4. **The Threshold of Suffering/Survival**:  
     - Must weigh **rump state’s existential needs** (water, port, geography) against the region’s desire to leave.  
     - **Gut Hook**: *"Without that water, millions of us die. Is that your ‘freedom’?"*  

  5. **The Grievance Test**:  
     - Must clarify if **injustice is required** or if **economic/cultural dissatisfaction suffices**.  
     - *Camp Bias:* Remedial-only theories (injustice required) vs. Primary-right theories (no injustice needed).  

  6. **The Vote Problem**:  
     - Must define **who votes** (residents? citizens? ancestral groups?), **what majority is needed** (50%+1? supermajority?), and **whether a vote alone legitimizes secession**.  
     - **Non-negotiable**: **Legitimacy ≠ mere procedural legality** (Catalonia’s "illegal" vote).  

  7. **Distinguish Legitimacy from Resistance**:  
     - Must separate "**was secession justified?**" from "**was the rump state justified in resisting?**" (e.g., violently).  

  ---

  ### **Key Tensions (Irreconcilable Desiderata?)**  
  These pairs **cannot be fully satisfied simultaneously** – your characters *must* grapple with them:  

  - **"Clear majority settles it" vs. "No new oppressed minorities"**  
    *The 51-49 vote with a 70% anti-secession district forces a brutal choice: betray majority rule or create a trapped minority.*  
  - **"Legitimacy knowable in advance" vs. "Depends on post-secession viability"**  
    *Does the rump state’s survival threat invalidate the secession upfront, or only if collapse happens?*  
  - **"Land belongs to its people" vs. "Vital infrastructure is shared"**  
    *Your river valley’s dams – built by the whole country but now controlled by secessionists.*  

  **Conclusion**: No theory flawlessly resolves all cases. **Secession debates are inherently tragic** – every principle breaks somewhere. Your scene gains power by exposing this.  

  ---

  ### **The Knockout Criterion**  
  **"Does this create new, indefensible injustices?"**  
  If a theory allows secession to:  
  - Trap hostile minorities (e.g., ignores your 70% district),  
  - Strangle the rump state (e.g., takes the *only* port), or  
  - Reward ethnic cleansing/forced displacement,  
  it fails. This sinks simplistic "majority vote = legitimacy" theories.  

  ---

  ### **Theory Scorecard (Short & Brutal)**  
  1. **Remedial-Right Only**  
     *Legitimacy only as remedy for grave injustice (oppression, genocide).*  
     **✓** Strong on preventing frivolous secession; **gut hooks** for injustice.  
     **✗** Fails your fiscal grievance case; ignores peaceful, democratic exits like Quebec.  

  2. **Plebiscitary (Primary-Right)**  
     *Legitimacy via clear democratic will in the region.*  
     **✓** Clean, intuitive ("let the people decide!"); handles Quebec-style cases.  
     **✗** Ignores minorities, viability, and territory issues (fails your 51-49 and corridor cases).  

  3. **Nationalist/Cultural**  
     *Legitimacy requires a distinct, pre-existing "nation" with territorial claim.*  
     **✓** Explains Scotland/Quebec; resonates emotionally.  
     **✗** Arbitrary on "nation" definition (fails your 2-generation group); ignores non-cultural grievances.  

  4. **Consequentialist/Aggregative**  
     *Legitimacy depends on net outcomes (peace, prosperity, stability).*  
     **✓** Pragmatic; weighs survival needs (your dam/port case).  
     **✗** Unknowable in advance; justifies blocking *any* secession that risks chaos.  

  ---

  ### **What Your Characters Would Actually Say**  
  - **Secessionist**: *"We built the wealth they steal. We’ve voted. We’ve suffered. Why do we need their permission to leave?"*  
  - **Rump State**: *"You can’t take the river that feeds us all. You can’t split our families. You can’t break the peace we built."*  
  - **Trapped Minority**: *"If they leave, we become hostages. Our vote matters too!"*  

  **Use this friction**. The theory’s job isn’t to solve the fight, but to frame it in terms that feel **inescapable and human**. The best argument loses to a dam.
