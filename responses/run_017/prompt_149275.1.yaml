  I need to craft an argument that addresses three specific objections the friend raised: (1) inert-surplus (the extra detail makes no practical difference), (2) sign-indeterminacy (brain size doesn't correlate clearly with moral value), and (3) proxy (we should care about experience, not brain size itself). The user wants me to avoid hedging arguments or academic references, and instead build a case from first principles.

