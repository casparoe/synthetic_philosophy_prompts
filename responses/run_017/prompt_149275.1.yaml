  For the inert-surplus objection, I'll argue that moral significance attaches to what is actually experienced, not just what affects future states. For sign-indeterminacy, I'll concede the complexity but maintain that in principle, total experiential content could be measured. For the proxy objection, I'll acknowledge that brain size matters only as an indicator of potential experience, but emphasize that in this specific thought experiment, the size difference directly correlates with experiential richness.

