prompt: |-
  I teach a first-year module on the philosophy of history, and next term I am screening Robert Bolt's *A Man for All Seasons* — Zinnemann's 1966 film, though the 1960 stage version is what I'd be glad to have the argument work from where the two differ — as a case study in Butterfield's complaint about the Whig interpretation of history. What I want is a reading of the work through that lens: not a summary of what Whig history is, and not a plot recapitulation.

  The reason it interests me is that the film does something Butterfield's category does not obviously cover. His target is a complaint about success stories: beginning from the present and reading backwards, abridging the record into a drama with an apparent moral clarity, and sorting the agents of the past into those who furthered what we now have and those who contributed nothing to the making of it. Bolt's More belongs to no such story. He loses, he is executed, and the cause he defends — the universal visible Church under the papacy — is not vindicated at any later point in the film's own terms; the break with Rome, which did so much to produce the modern state and arguably modern liberty, is on the wrong side of the drama. Yet almost everything else in the work is a machine for producing identification: we are meant to recognise ourselves in More, to hear in his defence of conscience an early version of something we now hold, and to see Cromwell, Rich and Wolsey as men who left nothing worth inheriting.

  So I want four things worked out.

  First, the taxonomy I should be putting on the board. I have been distinguishing teleological whiggism, in which the sequence is narrated so that the present looks like its point; motivational anachronism, in which an agent is given a motive he could not have had; anticipatory anachronism, in which he is credited with foreseeing what came after; and a fourth thing for which I have no good name, in which a figure is cast as our ancestor electively rather than causally, needing neither to have foreseen nor to have intended anything, and not needing to have won. Is that fourth thing genuinely distinct, or does it collapse into the second or third? And is it what the film is doing?

  Second, what is the film actually committed to? More cannot have meant by conscience what the film's More means: his conscience was bound to the authority of the visible Church, and the man who wrote polemics against Tyndale, and who held the chancellorship while Protestants were burned in England — how directly implicated he was is itself something historians argue about — did not take private judgement to be the last court of appeal. Does the film require us to think otherwise? Or can it claim him under the fourth heading, as a causal ancestor of a doctrine he would have repudiated, on the ground that martyrs for conscience became, over the following two centuries, part of the case for toleration? I want to know whether unintended lineage is a defence against the charge of whiggism or only a subtler version of it.

  Third, what to do with the Common Man. My hypothesis, which I would like you to argue with, is that he is not merely a Brechtian narrator but the play's way of licensing the anachronism: a figure who steps out of the action, plays servant, boatman, gaoler, foreman, headsman, tells us he is no hero and only wants to keep his skin, and thereby names the distance between 1530 and the audience in order to make that distance safe to ignore. If that is right, the device is a confession that buys permission, and a knowing whiggism is still whiggism. If it is wrong — if the Common Man does something to the structure of the work rather than to our complicity in it — give me the better account.

  Fourth, where does the work resist the reading, and where should I say in the seminar that the honest critic has to let it go? I have in mind More's insistence that even the Devil is entitled to the protection of the law, which is not obviously a modern liberal point at all; the play's thorough anti-authoritarianism, which looks more like Bolt's own century than More's; and the sacramental, hierarchical world the film's More actually inhabits.

  Close by saying what the film adds to the debate that argument alone does not, if it adds anything. My suspicion is that it shows the pull of ancestry-selection to be not merely an error but something a narrative about the past has to exercise if it is to matter to anyone, and that a criticism which can only forbid it is less use to me than one which says what we are allowed to want from a usable past. Name the scenes you would put on screen beside Butterfield, and don't pad the answer with plot.
reasoning: |-
  Okay, let me approach this query methodically. The user teaches philosophy of history and wants to analyze "A Man for All Seasons" through Herbert Butterfield's critique of Whig historiography. The core tension is that Bolt's More loses historically yet the audience identifies with him as a proto-modern conscience figure - a pattern that seems to evade Butterfield's definition of Whig history as progressivist triumphalism.

  First, I need to unpack the user's four requested dimensions:

  Regarding taxonomy, their proposed fourth category (elective ancestry without causation/foresight) strikes me as genuinely distinct. Teleological Whiggism demands victory; motivational/anachronistic types require intent. This fourth mode operates through retrospective symbolism - making More a "precursor" by our choice, not historical outcome. The film absolutely deploys this.

  On the film's commitments, there's clever double movement: it shows More's actual theology (anti-Protestant, anti-private-judgment) yet invites elective ancestry. The key scene is More's "I am the King's true subject" speech - his loyalty is feudal, not liberal. The defense against Whiggism charges lies in the work's own framing devices acknowledging the anachronism.

  The Common Man's function is crucial. Beyond Brechtian alienation, he embodies what Hayden White calls "the burden of history" - the visceral survival instincts that make More's stand extraordinary. His interruptions don't excuse anachronism; they highlight the cost of conscience across time. Show the jail scene where he refuses More's bribe.

  Resistances to Whiggism appear precisely where the text is most medieval: More's view of law as God's edict (not human rights), and his world's sacramental texture. The trial scene's power comes from More quoting Christ - entirely foreign to secular liberalism. These elements prevent full Whig recuperation.

  The film adds visceral force to Butterfield's critique. When More tells Norfolk "I will not give in because I oppose it - I do - not my pride, not my spleen," we see conscience being forged, not found. This complicates Whiggism by showing historical actors as more than just steps toward us. Project the Tower dialogue with Margaret about "planting corn" - it grounds the elective ancestry in lived sacrifice.

  Ultimately the film argues that usable pasts require creative appropriation, but must honor historical distance. The Common Man's closing monologue ("it isn't difficult to keep alive, friends") should screen alongside Butterfield's warnings - together they show history's dual pull toward identification and alienation.
answer: |-
  Your analysis cuts to the heart of Butterfield's critique and Bolt's sophisticated evasion of it. Here’s how I'd frame the seminar, addressing your four points directly:

  ### 1. Taxonomy: Beyond Teleology & Anachronism
  *   **Your Fourth Category is Distinct (and Vital):** It **does not collapse** into motivational/anticipatory anachronism. Name it **"Elective Ancestry"** or **"Symbolic Precursorship"**.  
      *   **Motivational Anachronism:** Gives More modern liberal motives (e.g., believing conscience = private judgment against state authority). *The film largely avoids this.*  
      *   **Anticipatory Anachronism:** Suggests More foresaw modern liberal democracy. *The film explicitly rejects this (e.g., More's "a country governed by laws... not men" is feudal, not democratic).*  
      *   **Elective Ancestry/Symbolic Precursorship:** More is claimed *retrospectively* by modernity as a foundational symbol of conscience *despite* his actual beliefs, his loss, and the historical failure of his cause. His value lies in the *symbolic capital* his martyrdom later accrued for *different* causes (toleration, rights of conscience), not in any causal contribution to those outcomes. **This is precisely what the film does.**

  ### 2. The Film's Commitment & Unintended Lineage
  *   **The Film is Remarkably Clear (and Clever) on More's Actual Beliefs:** It shows his Catholicism (Mass, sacraments, deference to Rome), his horror at Tyndale’s heresy, his feudal concept of law ("I give the Devil benefit of law... for my own safety's sake!"), and his view of conscience as submission to God's authority *as mediated by the Church*. It **does not require us** to think he held modern views.
  *   **Unintended Lineage is the Core Mechanism:** Yes, the film claims More under **"Elective Ancestry"**. His martyrdom *became*, centuries later, a powerful *symbol* in the fight for toleration and rights of conscience. Bolt shows the *raw material* of the martyrdom (integrity, refusal to swear against conscience, death for principle) that *later generations* reinterpreted and claimed.
  *   **Defence or Subtler Whiggism?** It's **both**. It avoids Butterfield's *explicit* targets (teleology, misattributed motives/foresight). However, it *is* inherently **"Whiggish" in a broader sense:** It performs a retrospective act of symbolic appropriation, reading a past figure through the lens of later values he wouldn't recognize, *because* those later values find his story useful. It's Whiggism of **symbolic resonance**, not causal progress. The defence lies in the film's *honesty* about the gap (see Point 4).

  ### 3. The Common Man: More Than a License
  *   **Your Hypothesis is Partially Correct, but Limited:** Yes, he names the distance ("I'm breathing... Are you breathing too? It's nice, isn't it? It's nice.") and embodies the survival instinct antithetical to More's sacrifice. This *does* acknowledge the gap.
  *   **But He Does Structural Work:** He's not *just* buying permission; he's the **embodiment of the historical "norm" against which More's action is measured.** He represents the overwhelming majority who *did* conform, compromise, and survive under tyranny. He shows *why* More's stand was exceptional *and* historically ineffective in its immediate context. His constant presence **relativizes** More – highlighting the cost and isolating nature of the principled stand. He forces the audience to confront the question: "Would *you* (or the Common Man in you) do this?" This complicates identification, it doesn't just license anachronism. **Key Scene:** His final monologue – the sheer banality of survival after witnessing martyrdom underscores More's tragic isolation.

  ### 4. Where it Resists & Where to Yield
  *   **Resistances (Hold the Line):**
      *   **More's Concept of Law:** His "Devil's benefit of law" speech is **anti-Whig gold.** It's feudal, hierarchical, and theological: law as an objective, God-given structure protecting *everyone's place* (even the Devil's) and thus *his own* as a subject. It's about cosmic order, not individual rights against the state. *This must be foregrounded.*
      *   **The Sacramental World:** The film's texture (Mass, prayers, More's hair shirt) constantly reminds us this is a profoundly different mental universe. More's agony is about damnation, not civic liberty.
      *   **Anti-Authoritarianism? Bolt's, not More's:** More *is* authoritarian – just to a different authority (Pope/Church). The play's *structural* anti-authoritarianism (showing Henry/Cromwell's tyranny) is Bolt's 20th-century perspective layered *over* the historical drama. Acknowledge this as Bolt's lens, not More's motive.
  *   **Where to Yield:**
      *   **The Pull of "Conscience":** While More's *content* of conscience is medieval, the film's *dramatic focus* on the *act* of holding to conscience against overwhelming state power *does* create an irresistible bridge to modern concerns. We *are* meant to feel the universal pull of integrity. Allow the emotional resonance while dissecting the historical specificity.
      *   **Bolt's Framing:** The work *as a whole*, especially via the Common Man and Bolt's own stated purposes, *is* inviting a meditation on individual integrity vs. state power relevant to the 20th century. Accept this as Bolt's project, even as you critique its historical application.

  ### What the Film Adds to Butterfield: The Necessity & Cost of "Elective Ancestry"
  Butterfield diagnoses the error; Bolt's film dramatizes the **inescapable human *yearning* for a usable past, and its moral cost.** It shows that narratives of the past *must* resonate with present concerns to be compelling, leading inevitably to forms of "Elective Ancestry." However, it also shows the *violence* of that appropriation (More would recoil from his liberal heirs) and the *tragedy* inherent in the true story (his cause lost, he died alone).

  **Scenes to Screen Beside Butterfield (Non-Plot Focus):**
  1.  **More's "Devil's Benefit of Law" Speech (Norfolk's Visit):** Illustrates his *actual* feudal/theological concept of law – the core resistance to Whig appropriation.
  2.  **More & Roper Arguing About the Devil (Early):** "God's my ambition... God's my desire... What would you do, cut a road through the law to get to the Devil?" – Highlights the gap between More's submission to divine/ecclesiastical law and potential proto-liberal impulses (Roper).
  3.  **More Taking Communion with Family:** The sacramental world in action – the reality Bolt overlays with modern resonance.
  4.  **Common Man (as Jailer) Refusing More's Bribe:** "Oh, no, sir! I couldn't! Not me!" – Embodies the survival instinct, the historical norm, the cost of More's isolation.
  5.  **Common Man's Final Monologue:** "...it isn't difficult to keep alive, friends... just don't make trouble..." – The chilling banality of survival post-martyrdom, relativizing More's act.
  6.  **More's "I do none harm..." Speech (Trial):** Shows the core of his stand: loyalty to God/Church *and* King (in that order), framed in terms of silence and non-malice, *not* active liberal resistance. His appeal is to God, not popular sovereignty.

  **Conclusion for the Seminar:** Bolt's work demonstrates that Butterfield's critique, while essential, doesn't eliminate the profound human need to find meaning and precedent in the past. "Elective Ancestry" is an almost inevitable narrative strategy for creating a *morally resonant* past. The film's genius lies in simultaneously *performing* this act (making us identify with More as conscience) and *exposing its mechanism and cost* (through More's actual beliefs, his loss, and the Common Man). It forces us to confront the question: Can we value a past figure *for* qualities that resonate with us, *without* distorting who they truly were and what they truly fought for? The film suggests we try, but never lets us forget the gap.
