prompt: |-
  I'm the TA for a graduate seminar on social choice and welfare economics, and I'm marking the midterm right now — 14 scripts, this is the third one I've got to, and I keep flip-flopping on it. The writing is much better than the two I just did, and I'm worried I'm either being taken in by the prose or inventing problems that aren't there. Here's the question I set, then the answer, verbatim.

  **Q3. Harsanyi's aggregation theorem (20 marks)**

  Setup: there are n individuals (n fixed), a fixed set of social outcomes, and lotteries over those outcomes. Each individual i's preferences over lotteries satisfy the von Neumann–Morgenstern axioms, so each is represented by a utility function u_i that is unique only up to positive affine transformation. The social ordering over the same lotteries also satisfies the vNM axioms. Assume Pareto: if every individual strictly prefers lottery p to lottery q, then p is socially strictly preferred to q.

  (a) [6 marks] State the conclusion of the aggregation theorem. What exactly is the role of the weights in the resulting sum, and how much freedom is there in choosing them, given that each u_i is only defined up to positive affine transformation?

  (b) [6 marks] Harsanyi's impartial-observer argument asks you to imagine an equal chance of being anyone and to maximise expected utility from behind that veil, which appears to deliver equal weights. Explain why the equal-probability assumption cannot do this job on its own: what else has to be fixed first, and why does it matter?

  (c) [8 marks] A critic says: "The real content of Harsanyi's theorem is not the Pareto condition but the assumption that the social ordering satisfies the expected-utility axioms." Explain the criticism, and assess how much damage it does to the argument for utilitarianism.

  **Student's answer:**

  The set-up is the same as Arrow's, except that where Arrow had a social ordering over social states derived from profiles of individual *ordinal* rankings, Harsanyi has a social ordering over *lotteries*, and each individual's utility is cardinal. Society's ordering is assumed to satisfy completeness, transitivity, continuity and independence of irrelevant alternatives — the same condition Arrow used in his impossibility theorem — so Harsanyi's move is essentially to keep Arrow's framework but add lotteries and cardinal utility, and that extra information is what turns an impossibility result into a possibility result. Given the Pareto condition, there exist non-negative weights a_i, not all zero, such that the social ordering is represented by W(p) = Σ a_i u_i(p). So any rational and Paretian social ordering must be utilitarian in form.

  The weights are where the action is. a_i is a pure number measuring how much person i's welfare morally matters: a bigger weight means a given increment of i's utility counts for more in the social ranking. Crucially this is independent of how we have scaled each person's utility function — the affine uniqueness of the u_i is already built into the representation, so rescaling u_i doesn't change what the weights say. That is why the theorem is so striking: it hands you interpersonal comparisons for free rather than assuming them. To be fair, some readers complain that the axioms leave the weights completely unconstrained and so the result is nearly empty; Harsanyi's reply was that the weights get pinned down once you fix how each person's utility is measured, and anyway the important point is that the *form* is utilitarian.

  Harsanyi's own answer on the weights is that they should be equal. Behind the veil you don't know who you'll be, so you assign probability 1/n to each person and maximise your own expected utility; adding the anonymity condition then forces a_i = 1/n for everyone. And since, as noted, the weights don't depend on the normalisation of the individual u_i, the argument needs no extra assumption about interpersonal comparability of units — the equal probabilities settle it. This is why the theorem is standardly read as an argument for average utilitarianism; and because it delivers average rather than total, Harsanyi's framework isn't vulnerable to the repugnant conclusion in the way that total utilitarianism is.

  On (c): the criticism is right, and it's the most serious objection. The Pareto condition by itself is thin — it only says society should follow unanimous strict preference. The heavy lifting is done by requiring the social ordering itself to satisfy the vNM axioms, in particular independence, which forces society to evaluate a lottery as the expected value of a single weighted sum rather than in any other way. That rules out evaluating lotteries by, for instance, the expected value of an inequality-averse function of the realised utility vector — a symmetric concave function, or the minimum — which is exactly what an "ex post" egalitarian wants to do. Diamond's example makes the point: with one indivisible good and two people, the fair lottery and giving the good to one person for sure have the same sum of expected utilities, so Harsanyi's social ordering is indifferent between them, while an ex post egalitarian strictly prefers the lottery. So the theorem does not derive utilitarianism from Pareto plus mere rationality; it builds in the assumption that the social evaluator is an expected-utility maximiser over lotteries, which already rules out caring about how welfare is distributed once uncertainty is resolved. How much damage this does depends on whether you think a social evaluator ought to be indifferent between those two options; I think the defender of Harsanyi has to show that ex ante expected utility is the right object of social concern, and that is a substantive claim, not a formality.

  **What I want from you:** give it a mark out of 20 with a breakdown by part, and give me the specific comments I should write in the margin, keyed to particular sentences (quote the line). I want to know which slips are harmless matters of wording and which are real errors that change the substance of the answer, and — this is the bit I keep going back and forth on — whether there's anything here that reads smoothly enough that I'd let it through if I were marking fast. If a comment lands better with a one-line numerical counterexample, put the counterexample in; don't rewrite the whole answer for me. Also tell me whether, overall, this is the work of someone who understands the theorem and made two or three slips, or someone who has memorised the shape of the argument without the details, since I grade those two quite differently, and I recieve a lot of complaints about B+ versus A−.
reasoning: |-
  Okay, the TA is grading a midterm for a graduate seminar on social choice and welfare economics. They're on the third script and are conflicted because the writing is better than the previous ones, but they're unsure if they're being too lenient or too harsh. The question is about Harsanyi's aggregation theorem, divided into three parts: (a) stating the conclusion and explaining the weights, (b) the impartial-observer argument and why equal probability alone isn't sufficient, and (c) a criticism about the role of the vNM axioms in the social ordering.

  First, I need to evaluate the student's answer. For part (a), the student correctly states that the social ordering is represented by W(p) = Σ a_i u_i(p) with non-negative weights and mentions that the weights are independent of the scaling of individual utilities. However, they say the weights are "pure numbers measuring how much person i's welfare morally matters." This isn't entirely accurate. The weights are scale-dependent; they absorb the scaling of individual utilities. If you rescale u_i, the weight a_i must adjust to keep the weighted sum consistent. The student seems to misunderstand this, thinking the weights are invariant. That's a substantive error since it misrepresents how interpersonal comparisons are handled in the theorem.

  For part (b), the student discusses Harsanyi's impartial-observer argument, claiming that equal probability and anonymity lead to equal weights. But they miss a crucial point: the impartial observer's utility function must be consistent with the individual utilities. The student says the weights don't depend on normalisation, but actually, the observer's utility is affine-transformed, so the weights depend on how individual utilities are scaled. Without fixing the scales, equal probability doesn't pin down equal weights. The student didn't address the need to normalize utilities, which is essential. This is a significant oversight.

  In part (c), the student correctly identifies that the vNM axioms, especially independence, force the social ordering to be linear, ruling out ex post egalitarian approaches. They reference Diamond's example appropriately. However, they mistakenly claim Harsanyi's framework avoids the repugnant conclusion because it uses average utilitarianism. Actually, Harsanyi's theorem can justify either total or average utilitarianism depending on how the weights are set. The repugnant conclusion applies to total utilitarianism, but the theorem doesn't inherently avoid it. This is another error, though perhaps less central to part (c)'s focus.

  Now, the TA wants a mark breakdown and specific comments. The writing is polished, which might mask these errors. The student clearly understands the structure but has key misunderstandings in parts (a) and (b), and a minor slip in (c). The errors in (a) and (b) are substantive because they misrepresent the theorem's mechanics. For example, in (a), the weights are not invariant; they adjust with utility scaling. In (b), the need to normalize utilities before applying equal probability is omitted. 

  For marking, part (a) should lose points for the weight misconception. Part (b) misses the normalization requirement entirely. Part (c) is mostly correct but has the repugnant conclusion error. Overall, the student seems to grasp the big picture but has memorized some arguments without full depth, particularly on technical details. 

  The TA should note that the prose is fluent, which might lead to overlooking errors during quick marking. However, the errors are significant enough to deduct marks. The final score would be around 14/20, broken down as (a) 3/6, (b) 2/6, (c) 6/8. Specific comments should highlight the weight-scaling confusion in (a), the missing normalization in (b), and the repugnant conclusion mistake in (c). 

  The student is between B+ and A- territory; their understanding is good but not flawless, so a B+ (around 14) is appropriate. The TA should be cautious not to be swayed by the writing style and focus on the technical inaccuracies.
answer: |-
  ### Mark Breakdown & Feedback  
  **Overall Score: 14/20** (B+ tier: Solid grasp of structure and key ideas, but substantive errors in core concepts. Not A− due to weight-scaling misunderstanding.)  

  ---

  ### Part-by-Part Feedback  
  ***(a) Conclusion & Role of Weights [3/6]***  
  **✓ Correct:**  
  - States conclusion: W(p) = Σ a_i u_i(p) with weights a_i ≥ 0.  
  - Recognizes weights capture "moral importance".  
  **✗ Errors:**  
  > *"a_i is a pure number [...] independent of how we have scaled each person's utility function [...] rescaling u_i doesn't change what the weights say."*  
  **→ Substantive Error:** Weights **are not invariant** to scaling! If you rescale u_i → k_i u_i + m_i, the weights must adjust to a_i / k_i to preserve W(p). The theorem does **not** deliver "interpersonal comparisons for free"; weights depend on how utilities are normalized.  
  **Margin Comment:** *"Careful: weights absorb scaling. If u_i is rescaled (e.g., doubled), a_i must halve to keep W(p) equivalent. Weights aren't 'pure numbers'—they depend on utility normalisation. Harsanyi *assumes* comparability via fixed scales."*  

  ***(b) Impartial Observer & Equal Weights [2/6]***  
  **✓ Correct:**  
  - Links equal probability (1/n) to equal weights under anonymity.  
  **✗ Errors:**  
  > *"the weights don't depend on the normalisation [...] equal probabilities settle it."*  
  **→ Critical Omission:** Equal probability **cannot** pin down weights unless individual utilities are **normalized first** (e.g., same zero and unit). Without this, doubling i’s utility scale doubles their *effective* weight.  
  **Margin Comment:** *"Missing step: To get equal weights, we must fix the *scale* of each u_i (e.g., set zero=worst outcome, unit=best) BEFORE applying equal probability. Otherwise, rescaling u_i changes the observer's EU calculation. Equal probability alone doesn’t resolve scaling ambiguity."*  
  **Counterexample:** Suppose u_A(win) = 1, u_A(lose) = 0; u_B(win) = 100, u_B(lose) = 0. Observer EU for 50% chance of being A or B = 0.5(1) + 0.5(100) = 50.5. But if we scale u_B down (u_B(win)=1, u_B(lose)=0), EU=1. Weights changed by scaling!  

  ***(c) Criticism of vNM Axioms [6/8]***  
  **✓ Strong Points:**  
  - Correctly identifies vNM independence as the key axiom forcing *linear* aggregation.  
  - Uses Diamond’s example (lottery vs. sure thing) to show exclusion of ex-post egalitarianism.  
  - Notes Pareto is "thin" and vNM rationality is the "heavy lifting".  
  **✗ Minor Slip:**  
  > *"Harsanyi's framework isn't vulnerable to the repugnant conclusion"*  
  **→ Misleading:** Harsanyi’s theorem justifies *either* total or average utilitarianism depending on weight sum. Average utilitarianism avoids repugnance, but weights could be set for total utilitarianism (Σa_i=1 isn’t required).  
  **Margin Comment:** *"Clarify: The theorem allows Σa_i ≠ 1 (e.g., weights summing to n for total utilitarianism), so repugnance isn’t automatically avoided. Harsanyi *argued* for average, but the theorem doesn’t enforce it."*  

  ---

  ### Overall Assessment  
  - **Strengths:** Excellent prose, clear structure, understands critique of vNM axioms (especially part (c)), and correctly links Harsanyi to Arrow.  
  - **Weaknesses:** **Fundamental misunderstanding of weight scaling** in (a) and (b). This is not wording—it’s a substantive error that alters the theorem’s interpretation.  
  - **Verdict:** Student has **memorized the shape** but missed technical nuances (scaling/weights). Errors suggest partial grasp, not deep understanding. Polished writing masks gaps.  

  **Recommendation:**  
  - **Mark:** 14/20 (Breakdown: 3+2+6 +3 for clarity). B+ (good but not excellent).  
  - **Margin Note:** *"Strong writing, but revisit how utility scaling affects weights. Harsanyi does *not* resolve interpersonal comparability ‘for free’—it’s built into the normalization. See MWG Ch. 22 for technical details."*  
  - **If Marking Fast:** Errors might slip by due to fluency, but (a) and (b) are too central to ignore. Always check weight-scaling claims!  

  **Key Quotes for Marginalia:**  
  1. On weights: *"a_i is a pure number [...] rescaling u_i doesn’t change what the weights say."* → **"Error: Weights compensate for scaling. Rescale u_i → ku_i? Then a_i → a_i/k."**  
  2. On impartial observer: *"weights don’t depend on normalisation"* → **"Not true: Scales must be fixed first (e.g., common zero/unit)."**  
  3. On repugnance: → **"Theorem allows total utilitarianism (Σa_i arbitrary). Harsanyi *advocates* average, but it’s not enforced."**
