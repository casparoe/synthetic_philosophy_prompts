     So the maxmin agent never changes. Therefore, the free peeks are worthless. This is the flaw: the maxmin updating rule does not change the set of possible compositions in a way that affects the worst-case evaluation for the bets we are considering. The set of compositions we consider after the data is the set that are compatible with the data (i.e., they could have produced the data, even if with very low probability). And the worst-case for a bet on black is always the composition with the minimum number of black balls that is compatible with the data (which is 1, unless we see more than one color?).

