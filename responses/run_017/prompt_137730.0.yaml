prompt: |-
  In most cities the remedy adopted over the last decade for a contested monument has not been destruction but relocation: the statue is lifted from its pedestal and offered to a museum or stored in a depot, the plinth is sometimes left empty or fitted with an explanatory plaque, and the whole operation is described as recontextualization rather than erasure. When the contested object is a name rather than a statue — a street, a school — the remedy is characteristically the reverse: not removal but addition, an honorary co-designation mounted beneath the official sign, which leaves every address, map, and legal record untouched. Some commemoration commissions are now discussing a third option for new monuments: a commemorative authorization granted for a fixed term, renewable only if a standing body votes that the honoree still merits civic honor, with any monument whose authorization lapses transferred to an off-site archive open by appointment.

  What view of what a monument does does this family of practices presuppose? I want three things pressed in particular. First, does relocation-plus-contextualization presuppose that a statue's honoring is a function of its setting and its framing — so that the same bronze, in a gallery behind wall text, has stopped honoring and started only teaching — and is that defensible, or does it merely move the difficulty somewhere else? Second, what explains the asymmetry between statues, which get taken down, and names, which get added to: does the practice presuppose that a name's honorific force is detachable from its use as an address, and is that distinction stable enough to bear the weight placed on it? Third, does the renewable-authorization scheme presuppose that honoring is an ongoing act performed by the present polity rather than a completed act of a past one or a piece of testimony about what happened — and if honoring is ongoing in that sense, what follows for the default: does an un-renewed monument become a kind of speech, and do private commemorations, a family stone or a donor plaque in a hospital corridor, need authorization as well?

  Say finally where the practice is underdetermined: which rival theories of commemoration would license the same policy, so that nothing the commission is doing forces a choice among them.
reasoning: |-
  Okay, the user has presented a complex query about the underlying assumptions behind different practices for handling contested monuments. They're asking about three specific approaches: relocation with contextualization for statues, additive co-designation for names, and renewable authorization for new monuments. 

  The user wants me to press three particular points: whether relocation changes honoring into teaching, why there's asymmetry between statues and names, and whether renewable authorization makes honoring an ongoing act. They also want to know where these practices remain ambiguous between different theories of commemoration.

  Hmm, this seems like a sophisticated philosophical inquiry about public memory and political symbolism. The user appears well-versed in cultural heritage debates - probably an academic or policy professional working on monument controversies. Their questions reveal deep concern about whether these technical solutions actually address the underlying ethical problems.

  Let me unpack each practice's presuppositions systematically. For relocated statues: moving them to museums while adding plaques assumes that context determines meaning - a constructivist view where the same object can honor in a public square but only educate in a museum. But this raises tricky questions. Does the statue itself become neutral? Or does the museum setting merely mask ongoing honoring? The distinction feels unstable.

  The naming asymmetry is fascinating. Adding secondary plaques while keeping original names suggests we believe toponyms have dual functions: practical (as addresses) and honorific (as tributes). But in reality, these layers constantly interact. Every time someone uses "Jefferson Street," both functions activate simultaneously. The practice tries to surgically separate what's inseparable.

  Renewable authorization is the most radical approach. It treats commemoration as a continuous present-tense endorsement rather than historical record. This makes monuments resemble speech acts that require renewal. But then what status do they have when authorization lapses? And does this logic extend to private memorials? The implications could be far-reaching.

  Regarding underdetermination: multiple theories could support these practices. Consensus pluralism (avoiding conflict), democratic expressivism (present community's values), and pedagogical instrumentalism (teaching history) might all endorse them without agreeing on fundamentals. The commission can implement policies while remaining theoretically agnostic.

  The user's pushing at the limits of these pragmatic solutions. All three practices reveal contemporary monument culture's struggle to reconcile historical preservation with ethical accountability - trying to have both memory and justice. But each "solution" creates new philosophical tensions around agency, meaning, and time. That's probably what the user wants exposed.
answer: |-
  This family of practices presupposes a **constructivist, context-dependent view of commemoration**, where a monument's meaning and function—specifically its *honoring* effect—are not inherent in the object itself, but are actively shaped by its **spatial context, framing, and the ongoing endorsement of the present community**. Here's how each practice reflects this, addressing your three key presses:

  1.  **Relocation + Contextualization (Statues):**
      *   **Presupposition:** Honoring is a function of *placement* (prominent public space) and *absence of critical framing* (a pedestal implies unquestioned reverence). Moving the statue to a museum (a space dedicated to contextual interpretation) and adding explanatory text fundamentally changes its function.
      *   **Does it stop honoring & start teaching?** Yes, the practice explicitly presupposes this. The museum setting and wall text reframe the statue as a historical artifact subject to analysis, not an object of uncritical veneration in the civic landscape.
      *   **Is it defensible? Partially, but it moves the difficulty.** It's defensible pragmatically (avoiding destruction, enabling education) and theoretically (acknowledging context shapes meaning). **However, it moves the difficulty:**
          *   *To the museum:* Does the statue *truly* lose all honoring power? Does displaying it, even critically, still grant it a form of prestige? Museums themselves have power dynamics.
          *   *To the empty plinth/plaque:* Does this adequately represent the contested history and its legacy? Is it just a different, potentially ambiguous, form of commemoration?
          *   *Conceptually:* It relies on a potentially unstable distinction between "honoring" and "teaching/historicizing," implying honoring requires passive acceptance, not critical engagement.

  2.  **Addition/Co-designation (Names):**
      *   **Presupposition:** The honorific force of a name (e.g., Jefferson High School) is *not* primarily tied to its *utilitarian function* as an address/identifier. The honor is seen as a separate, detachable layer that can be modified or supplemented *without* disrupting the practical function.
      *   **Is the distinction stable? Likely not.** The practice presupposes a clean separation that doesn't hold:
          *   *Ubiquity:* Every use of the name *reinforces* the original honoree. Saying "I live on Lee Street" or "My kid goes to Columbus Elementary" perpetuates the honorific in daily life, regardless of an added plaque.
          *   *Co-designation as Band-Aid:* The addition often feels symbolic, failing to counterbalance the constant, practical repetition of the original name. The primary identifier remains the contested figure.
          *   *Weight-Bearing:* The distinction struggles to bear the weight placed on it. While less disruptive than renaming, co-designation often fails to satisfy those seeking substantive change, precisely because the honorific force of the original name persists through constant use.

  3.  **Renewable Authorization:**
      *   **Presupposition:** Honoring is an **ongoing act performed by the *present* polity**, not merely a completed act of the past or inert historical testimony. Civic honor requires *current* endorsement.
      *   **Implications:**
          *   **Un-renewed Monument:** It ceases to be an active civic honor. It becomes **historical testimony** (a record of past commemoration) or potentially **critical speech** (a testament to changing values). It is explicitly *decommissioned* as an honorific object in the public sphere.
          *   **Private Commemorations:** This scheme strongly implies that **only *public*, civic commemorations require democratic authorization**. Private memorials (family stones, donor plaques) are presupposed to operate under different rules – expressions of private gratitude, familial memory, or contractual recognition, not official civic endorsement. They fall outside the "ongoing act of the polity." Requiring authorization for these would be a radical extension of the logic, likely seen as overreach.

  **Where Practice is Underdetermined (Rival Theories):**

  The commission's practices don't *force* a choice between several rival theories of commemoration, as they can be justified under multiple frameworks:

  1.  **Consensus Pluralism:** The practices aim to manage conflict and find a minimally disruptive compromise acceptable to diverse groups (relocate rather than destroy, add rather than remove, allow time-limited honoring). The focus is on social peace, not a deep philosophical commitment about the nature of commemoration.
  2.  **Democratic Expressivism:** The emphasis on the *present* polity's ongoing endorsement (via relocation, addition, or renewable vote) aligns with the view that monuments express the *current* values and identity of the community. The practices become mechanisms for democratic expression over time.
  3.  **Pedagogical Instrumentalism:** The focus on contextualization (museum text, plaques, even the act of relocation or non-renewal itself) treats monuments primarily as tools for public history education, where their value lies in their ability to teach, including teaching about contested pasts and changing values. Honoring is secondary or contingent on pedagogical value.
  4.  **Minimal Preservationism:** The aversion to destruction (statue relocation, name retention with addition, archiving lapsed monuments) reflects a baseline commitment to preserving the *physical artifact* or *historical record* of commemoration, even if its honorific function is revoked or contextualized. The object's existence as historical evidence is prioritized.

  **Conclusion:**

  The core presupposition is that commemoration's *meaning and effect*—especially its power to *honor*—are socially constructed and contingent on context (space, framing, present endorsement). While defensible in acknowledging this contingency, each practice reveals tensions: relocation risks residual honoring or inadequate contextualization; co-designation fails to fully detach honor from utility; renewable authorization creates a novel category of decommissioned civic speech but draws a sharp (and potentially arbitrary) line between public and private commemoration. The policies remain underdetermined, compatible with theories prioritizing social peace, democratic expression, pedagogy, or historical preservation over a single, definitive theory of what commemoration fundamentally *is*.
