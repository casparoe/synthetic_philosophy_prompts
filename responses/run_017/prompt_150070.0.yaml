  - Explain: "For this round, when you want to use your memory aid, you must wait 5 seconds after the question is read. The registrar will count '1...2...3...4...5' aloud. After that, you can look at the card and answer. You can also choose to answer without the card and without waiting. You must decide for each question. You can change your mind, but once you start answering, you can't use the card."
  - Run 5 new questions. For each question, after reading, the registrar asks: "Do you want to use the card (and wait) or answer without?" 
    - If they choose without: they answer immediately, confidence, etc.
    - If they choose with: wait 5 seconds, then they can look and answer.

  **55-65 min: Wind Down (10 min)**
  - Collect all materials. "Please discuss in your groups for 5 minutes: how did you feel about the activity? What strategies worked?" This is to let them vent and prepare for debrief.

  **65-90 min: Debrief (25 min)**
  - Reveal deception: "In the third round, we altered some of your cards. If you were in the altered group, your card had two changes. We did this to see how you would react to errors. We are sorry for the deception, but it was to test a real psychological response."
  - Discuss the three tests:
    - Substitution: How did it feel to use a different card? Did you trust it? Did the quality matter more than ownership?
    - Tampering: If you had an altered card, how did you react to the errors? Did you blame yourself or the card? Why?
    - Friction: How did the waiting affect your use of the card? Did you avoid using it? Did you feel the answers were less yours?
  - Then connect to extended mind: "In philosophy of cognitive science, there's a debate about whether external aids like notebooks can be part of the mind. The conditions include constant availability, automatic trust, and prior endorsement. In this activity, we saw that these don't always go together. For example, in substitution, you might have trusted a better card even if it wasn't yours (so trust without prior endorsement?). In tampering, you might have blamed the card even though it was 'yours' (so no automatic trust when error occurs). In friction, you might have avoided the card (so it wasn't constantly available) and felt the answer was less yours."
  - Then open to criticisms: 
    - "Some argue that even if we rely on an external resource, it's not literally part of the mind. It's just causally coupled. How would you draw the line?"
    - "If we count notebooks, what about smartphones? Where do we stop? Is there a principle?"
  - Finally, introduce the key terms and the Clark and Chalmers paper.

  **Recording Sheet Example for Registrars:**
  For each test, a table with:
  - Question number
  - Confidence (0-5)
  - Time (seconds)
  - Answer
  - For tampering: if error, note attribution (self/card)
  - For friction: choice (with/without card) and time (if with card, include wait time in total? or separate)

  This design is ambitious. The first time, focus on one or two tests if time runs out. Be prepared to drop friction if behind.

  Good luck!
answer: |-
  Below is a complete, runnable 90-minute activity designed for your seminar. It targets the core philosophical tension in the extended mind debate by having students **generate cases where Clark and Chalmers's conditions (constant availability, automatic endorsement, trust over time) come apart** through experiential "tests." The activity avoids upfront theory, uses paper-only materials, and includes safeguards for ethical deception. Predictable pitfalls and recovery tactics are detailed in the "Caveats" section.

  ---

  ### **Activity Title: The Memory Trust Game**  
  *Goal:* Show that reliance on external resources doesn't imply constitution, and that Clark/Chalmers's marks (availability, endorsement, trust) can conflict.  

  ---

  ### **Materials & Setup**  
  - **For Participants (12 students):**  
    - 1 blank index card + pen per student.  
    - 1 "Fact Sheet" (see below) for the build phase.  
    - 1 "Response Sheet" for answers/confidence (Appendix A).  
  - **For Registrars (6 students):**  
    - 1 clipboard + stopwatch (or phone timer *if allowed only for timing*).  
    - 1 "Registrar Sheet" (Appendix B) to record latency, confidence, errors, and attribution.  
  - **For Instructor/TA:**  
    - Master question sets (5 Qs per test; Appendix C).  
    - Pre-written "superior cards" for substitution (3–4 copies).  
    - Red pens for tampering alterations.  
    - Scoreboard (blackboard or poster paper).  

  **Fact Sheet Content** (Fictional, to prevent prior knowledge):  
  > **Dr. Elara Vance**  
  > - Born: March 14, 1978  
  > - Field: Neuro-linguistics  
  > - Key Theory: "Bilingual Synergy Model"  
  > - Education: PhD, MIT (2005)  
  > - Book: *Language and the Fluid Mind* (2010)  
  > - Award: Turing Award (2018)  
  > - Current Role: Director, Berlin Institute of Cognition  
  > - Hobby: Competitive fencing  

  ---

  ### **Roles**  
  - **Participants (12):** Create memory aids, answer quiz questions, stake confidence points.  
  - **Registrars (6):** Time answer latency (seconds), record confidence (0–5), note error attribution (e.g., "I misremembered" vs. "Card is wrong!"), and track scores.  
  - **Groups:** 6 teams of 3 (2 participants + 1 registrar).  

  ---

  ### **Rules & Payoff Scheme**  
  - **Confidence Staking:** Before answering, participants stake 0–5 points.  
    - **Correct answer:** Gain 10 points + 2× staked points.  
    - **Incorrect answer:** Lose staked points.  
    - *(e.g., Stake 3 on a correct answer: 10 + 6 = 16 points. Stake 4 on incorrect: –4 points.)*  
  - **Score Tracking:** Registrars update team scores publicly after each test.  
  - **Friction Tax:** In the friction test, consulting the card costs 3 points (paid before answering).  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **Phase 0: Intro & Build (15 min)**  
  - **0–5 min:** Assign roles (no theory terms!). Briefly explain:  
    > *"Today we’re exploring how we use tools to remember. You’ll create a personal memory aid for a fictional expert, then answer quiz questions to earn points. Registrars: track speed, confidence, and reactions."*  
    - Distribute fact sheets, index cards, and pens.  
  - **5–15 min:** Build phase. Participants create memory aids on index cards (e.g., notes, diagrams). *Collect fact sheets afterward.*  

  #### **Phase 1: Baseline Test (10 min)**  
  - **15–20 min:** Run 5 quiz questions (e.g., "What award did Dr. Vance win in 2018?").  
    - Participants answer using their cards, stake confidence, and speak answers aloud.  
    - Registrars record latency (start timing when question is read; stop when answering begins), confidence, and scores.  
  - **Goal:** Establish "normal" reliance. *No surprises here.*  

  #### **Phase 2: Substitution Test (15 min)**  
  - **20–25 min:** Collect all memory aids. Redistribute under 3 conditions (4 participants each):  
    - **Condition A (Control):** Return their *own* card.  
    - **Condition B (Stranger):** Give a card from another participant (same content, unfamiliar handwriting).  
    - **Condition C (Superior):** Give a pre-written "superior card" (neater, more complete, e.g., adds "Turing Award for AI contributions").  
  - **25–30 min:** Run 5 new questions.  
  - **30–35 min:** Quick reflection: *"Did any cards feel less trustworthy? Why?"* (Registrars note reactions.)  

  #### **Phase 3: Tampering Test (15 min)**  
  - **35–40 min:** Collect cards again. Alter cards for **half the participants** (6 students):  
    - Change 2–3 details in their *own handwriting* (e.g., "2018" → "2020"; "fencing" → "archery"). Use red pen to mimic "edits."  
    - Leave the other 6 unaltered as controls.  
  - **40–45 min:** Return cards (participants don’t know if altered). Run 5 new questions.  
  - **45–50 min:** Registrars log error attribution (e.g., *"I messed up"* vs. *"My card is wrong!"*).  

  #### **Phase 4: Friction Test (15 min)**  
  - **50–55 min:** Keep cards but add "tax":  
    - To consult their card, participants must pay 3 points (announced before answering).  
    - They can answer unaided (no cost) or pay to use the card.  
  - **55–60 min:** Run 5 final questions.  
  - **60–65 min:** Registrars record consultation choices and confidence.  

  #### **Phase 5: Debrief & Reveal (25 min)**  
  - **65–70 min:** **Reveal tampering deception.** Apologize and explain:  
    > *"Some cards were altered to test reactions to errors. This was a necessary deception to explore how we attribute mistakes. Thank you for your trust—let’s discuss what happened."*  
  - **70–90 min:** Structured discussion:  
    1. **Map tests to conditions:**  
       - Substitution → Trust over time? (Did "stranger/superior" cards break trust even if accurate?)  
       - Tampering → Automatic endorsement? (Did altered cards cause external blame? Did controls self-correct?)  
       - Friction → Constant availability? (Did taxing access reduce card use? Did confidence drop?)  
    2. **Generate contradictions:**  
       - *"When did a resource help cognition but NOT feel like part of you? (e.g., superior card) When did it feel integrated but fail? (e.g., altered card)"*  
    3. **Connect to extended mind:** Introduce Clark/Chalmers’s conditions. Ask:  
       - *"Which marks mattered most in your tests? Did they always align?"*  
    4. **Critiques:** Surface objections:  
       - **Causal coupling ≠ constitution:** *"If your card was altered, was it still part of your mind, or just a faulty tool?"*  
       - **No principled stopping point:** *"If your card counts as ‘extended mind,’ what about phones? The internet? Where do we draw the line?"*  
    5. **Synthesize:** *"The live question isn’t ‘Do aids help?’ but ‘When does reliance become constitution?’ These tests show their marks can pull apart."*  

  ---

  ### **Appendices**  
  #### **A. Participant Response Sheet**  
  | Question | Confidence (0-5) | Answer | Points Staked | Points Earned |  
  |----------|------------------|--------|---------------|--------------|  

  #### **B. Registrar Sheet**  
  | Test | Participant | Latency (sec) | Confidence | Answer | Correct? | Error Attribution (if wrong) | Notes |  
  |------|-------------|---------------|-----------|--------|----------|----------------------------|-------|  

  #### **C. Sample Question Sets**  
  - **Baseline:** Q1. Birth date? Q2. Field? Q3. Key theory? Q4. Education? Q5. Book title?  
  - **Substitution/Tampering/Friction:** New combos (e.g., Q1. Award? Q2. Current role? Q3. Hobby? Q4. Book year? Q5. PhD institution?).  

  ---

  ### **Caveats: Predictable Pitfalls & Recovery**  
  1. **Tampering Fails (30% chance):**  
     - **Risk:** Alterations are spotted mid-test (e.g., a student says, *"This isn’t my writing!"*).  
     - **Recovery:** Abandon the test; pivot to hypothetical: *"Imagine your card had errors—would you blame yourself or the card?"* Use registrars’ notes on past errors.  
     - **Fallback Trigger:** If >2 participants publicly note tampering, skip to discussion.  

  2. **"Why Bother?" Apathy:**  
     - **Risk:** Students dismiss friction tax ("I’ll just guess").  
     - **Prevention:** Emphasize competition (post scores publicly). In debrief, contrast groups who paid vs. didn’t.  

  3. **Over-Generalization:**  
     - **Risk:** Students conflate *all* external aids with Otto’s notebook.  
     - **Mitigation:** In debrief, stress Otto’s *specific* criteria. Ask: *"Did your card meet all three conditions? When did it fail?"*  

  4. **Premise Vulnerability:**  
     - **Core Premise:** Attribution of ownership/errors reveals constitutive boundaries of the mind.  
     - **If Premise Fails:** The activity becomes a psychology demo (e.g., "people like their own notes") but loses philosophical bite. **Recovery:** In debrief, argue that functional role (not just phenomenology) matters—e.g., if you *automatically* treat the card as truth, it acts like belief.  

  ---

  ### **Design Uncertainty: The Substitution Test**  
  - **Weak Point:** The "superior card" may not feel alien if participants prioritize accuracy over ownership.  
  - **Abort Signal:** If >75% of Condition C (superior) report *higher* confidence/trust than baseline.  
  - **Pivot:** Contrast registrars’ latency data—if "stranger" cards cause delays (suggesting distrust) but "superior" cards don’t, ask: *"Does ease trump ownership?"*  

  ---

  ### **Why This Works**  
  - **Control for "You Like Your Notes":** Substitution’s "superior card" tests when a *better* resource feels less integrated (sentiment vs. function).  
  - **Generates Tension:** Students *experience* conflicts (e.g., friction reduces "ownership" feelings; tampering causes external blame).  
  - **Ethical Deception:** Briefing ("variations may occur") + immediate debrief minimizes harm.  
  - **No-Tech Focus:** Forces creativity (paper, handwriting) and avoids digital distractions.  

  **First-Run Advice:** Start small—use 3–4 questions per test if short on time. The magic is in the debrief: use registrars’ data to expose contradictions in real time.
