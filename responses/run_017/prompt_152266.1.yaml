prompt: |-
  I do translation and questionnair localisation for survey instruments (mostly market research, but I've done a handful of academic ones), and I read philosophy blogs for fun, so I keep running into the cross-cultural vignette studies: you tell people a short story and ask something like "did he really know, or did he only think he knew", and then you compare answer rates between two countries — the one where people mostly give the answer philosophy professors give, and the one where they mostly don't.

  Here's the pattern I keep noticing and don't have a word for. In a chunk of the responses, from whichever group, people aren't answering the question that was asked. Ask "did he know" and they write back things like "you couldn't say that in court" or "for practical purposes you have to act as if he didn't" — they've turned a question about how things are into a question about what we should say, or what someone in that position should do. That much is boring. Three things make it look like something with a shape to me:

  1. It isn't spread evenly across respondents, it tracks the verdict. Nearly everyone who gives the minority answer is answering a question I didn't ask, while the people giving the majority answer mostly answer straight. So it can't just be noise that averages out across the sample.
  2. The off-target answers are often *good*. They cite considerations that are genuinely relevant to the original question, the sort of thing a philosopher would count as a reason. It's not confusion, and it's not failing to follow the story: comprehension checks come out fine.
  3. It shows up in both groups but lopsidedly. In the other group the minority-verdict people do it too, just less often and more vaguely. And I've seen the same shape in a completely different kind of case — the sort where someone uses a name they picked up second-hand and got the details wrong, and you ask who they're talking about.

  So the measured gap between groups seems to sit almost entirely inside the subpopulation who quietly switched the question, and if you coded only "did this person answer what was asked" the gap would shrink a lot but not vanish.

  Is there a name for this? I assume survey methodology has a term for an item meaning different things to different groups, but I don't know it, and I suspect it isn't quite my thing either, because here the switching is tied to the content of the answer rather than to which group someone is in.

  What I actually want is the carve, not a label. What is this, and what is it not — it isn't plain misunderstanding, it isn't translation failure, it isn't people being yea-sayers or picking the extreme option. Where are the boundary cases: someone who does answer the asked question but backs it with a "you couldn't say that" consideration; someone who answers both versions; someone whose off-target answer is just barely on target. And the bit I really can't settle: is this a confound to be screened or weighted away, or is it the datum — is what differs between the groups the verdict, or what they take the case to be *about*? If nothing established fits, coin a term and define it with its edges. Please don't just hand me a word or point me at papers to read.
reasoning: |-
  Okay, the user works in survey localization and translation, particularly for market research and some academic studies. They've noticed a pattern in cross-cultural vignette studies where some respondents don't answer the question as asked—instead, they shift it to a question about social norms or practical implications. The user wants to understand this phenomenon better and is seeking a term for it, but more importantly, they want a clear conceptual carve-out.

  The user describes three key aspects: the phenomenon correlates with the minority verdict, the answers are often insightful and relevant, and it's asymmetric across groups. They need to distinguish this from simple misunderstandings or translation errors.

  First, it's important to identify what this isn't. The user mentions it's not comprehension issues because checks are passed. It's not response styles like yea-saying. The off-target answers are coherent and context-aware, suggesting a deliberate reframing. The minority respondents consistently shift the question's frame, especially those giving the non-standard answer. This reframing seems tied to how they interpret the scenario's purpose rather than confusion.

  The core issue might be epistemic framing. Philosophers might intend a truth-conditional question ("did he know?"), but some respondents interpret it as a speech-act or normative question ("can we claim he knew?"). This aligns with different cultural or contextual understandings of what knowledge entails. For example, in some contexts, knowledge might inherently include social accountability, leading to a normative response even when the question is factual.

  The asymmetry could stem from cultural differences in epistemology. If one group has a more individualistic view of knowledge versus a collectivist one, the latter might prioritize communal verification over individual belief. The minority respondents in each group might be those who implicitly challenge the default framing, explaining why they shift the question more often.

  Boundary cases help clarify: someone answering the original question but justifying it with normative reasons is partially shifting the frame. If they address both, it's a dual focus. Barely on-target answers might indicate a weak frame shift. 

  Is this a confound or the real finding? The user suggests that the gap between groups might actually lie in how they frame the question. If so, this reframing is the critical cultural difference, not just a bias to correct. Weighting might mask the real insight that groups interpret the question's intent differently.

  Existing terms like "differential item functioning" (DIF) touch on this but focus on statistical biases, not the cognitive reframing. "Frame-switching" or "epistemic reframing" could be coined terms. The user needs a clear conceptual definition with boundaries, emphasizing the shift from descriptive to normative domains and its link to answer choice.
answer: |-
  Based on your detailed description and the need for a conceptual carve-out rather than just a label, here's a breakdown of the phenomenon, its boundaries, and its implications:

  **The Core Phenomenon: Epistemic Frame-Shifting**

  This occurs when respondents systematically reinterpret a *descriptive* epistemic question ("Did X *actually* know P?") as a *normative* or *pragmatic* question ("*Can we say* X knew P?", "What *should we do* as if X knew/didn't know P?", "Is X *accountable* for knowing P?"). The shift isn't random confusion, but a coherent reinterpretation of the question's *purpose* or *domain of relevance*.

  **What it IS (The Carve):**

  1.  **Intentional Reframing, Not Misunderstanding:** Respondents comprehend the vignette and the literal words of the question. They deliberately shift the *interpretive frame* applied to the question. They are answering a *different, but related* question they deem more relevant or appropriate.
  2.  **Content-Driven & Verdict-Linked:** The frame-shift is intrinsically tied to the *content* of the specific vignette and the *verdict* the respondent is inclined towards. Minority-verdict respondents are significantly more likely to employ this shift to justify their non-standard conclusion.
  3.  **Rational & Contextually Aware:** The responses are often insightful, citing genuine considerations relevant to knowledge *ascription*, *justification*, *responsibility*, or *action* in a *social context*. They demonstrate an understanding of the *implications* of the answer.
  4.  **Asymmetric Manifestation:** While potentially present in both groups, the frame-shift is:
      *   **Strongly Associated** with the *minority verdict* within any given cultural group.
      *   **More Explicit & Systematic** in the group where that verdict is minority (e.g., "Intuitionists" in a "Non-Intuitionist" culture, "Non-Intuitionists" in an "Intuitionist" culture).
      *   **Potentially More Vague** in the group where the verdict aligns with the majority/cultural norm.
  5.  **Source of Measured Gap:** The observed cross-cultural difference in verdicts largely resides within the subpopulation that engages in this frame-shifting. Coding *only* respondents who answer the literal descriptive question would significantly reduce (but likely not eliminate) the gap, as frame-shifting is unevenly distributed and linked to the verdict.

  **What it is NOT (Boundaries & Exclusions):**

  1.  **Not Simple Miscomprehension:** Comprehension checks are passed. They understand the story and the words. They aren't answering "what color was the car?" when asked about knowledge.
  2.  **Not Translation Artifact:** The issue persists across languages and cultures using seemingly accurate translations. It's a conceptual shift, not a lexical ambiguity (though lexical ambiguity *could* facilitate it).
  3.  **Not Response Style (Acquiescence/Extremity):** It's not about agreeing with everything or choosing strong options. It's a substantive reinterpretation of the *meaning* of the question. A yea-sayer would answer "yes" to the literal question.
  4.  **Not "Noise":** It's patterned, systematic, and linked to the dependent variable (the verdict). It doesn't average out; it *creates* the pattern.
  5.  **Not Ignoring the Stimulus:** They engage deeply with the vignette but draw different *conclusions about what matters* for the answer.
  6.  **Not Simple "Pragmatic Encroachment":** While related, pragmatic encroachment argues knowledge *itself* depends on practical stakes. Frame-shifting is about *which question is being answered* – the literal epistemic one or a pragmatic/social one – even if the respondent believes knowledge itself is unaffected by pragmatics.

  **Boundary Cases & Nuances:**

  1.  **Literal Answer + Normative Justification:** *Not Frame-Shifting.* This person answers the descriptive question ("No, he didn't *know*") and *then* adds normative support ("...and you couldn't say it in court either"). The *answer* is to the literal question; the justification reveals their reasoning. Frame-shifting involves the *answer itself* addressing the normative question.
  2.  **Dual/Mixed Answer:** ("He didn't *really* know, *and* you couldn't say it in court") *Likely Frame-Shifting.* The inclusion of the normative phrase as part of the core answer suggests the normative frame influenced the verdict or was central to their interpretation. The descriptive part might be a concession.
  3.  **Barely On-Target Normative Answer:** ("Well, it depends on how strict the rules are...") *Frame-Shifting.* This directly addresses the conditions for *saying* someone knows, not whether they *do* know. It's still shifting the frame to normative/pragmatic conditions of assertion, even if vague.
  4.  **Off-Topic Non-Sequitur:** ("The man was reckless") *Not Frame-Shifting.* This is a comprehension failure or irrelevant association, not a coherent reinterpretation of the question's domain.

  **Is it a Confound or the Datum?**

  **This is the crucial insight:** **It is likely the primary datum, not merely a confound.**

  *   **Why it might seem like a confound:** It introduces variance not intended by the researchers. It means respondents in different groups (and sub-groups) are answering substantively different questions, making direct comparison of "knowledge" verdicts problematic. Screening out frame-shifters would yield a "cleaner" comparison of reactions to the *literal* question.
  *   **Why it is likely the datum:** Your observations strongly suggest that the core cultural difference isn't primarily about the *epistemic judgment itself* under a shared interpretation, but about the **interpretive frame applied to the scenario and the question.** The groups differ in what they perceive the vignette *is about* or *what the question is asking for*.
      *   The frame-shift is *systematically linked* to the minority verdict *within* a culture. This minority isn't just "disagreeing" on the facts; they are operating with a different understanding of the *kind* of question being asked.
      *   The fact that the *same* asymmetry appears in the reverse cultural context (minority verdict respondents frame-shift more) points to the frame-shift being an integral part of *holding that minority view*, regardless of the prevailing cultural norm.
      *   The responses are "good" – they reveal sophisticated reasoning within their chosen frame.

  **Conclusion: Coining the Term & Definition**

  **Term: Epistemic Pragmatic Reframing (EPR)**

  **Definition:** Epistemic Pragmatic Reframing (EPR) is a systematic cognitive response pattern observed in vignette studies (particularly cross-cultural epistemology), where respondents reinterpret a researcher's intended *descriptive* epistemic question ("Did X know P?") as a *normative* or *pragmatic* question concerning the conditions for appropriately *asserting*, *acting upon*, or *holding X responsible for* knowing P ("Can we say X knew P?", "Must we act as if X knew P?", "Is X accountable for knowing P?").

  **Key Characteristics & Boundaries:**

  1.  **Requires Comprehension:** EPR occurs despite respondents demonstrating comprehension of the vignette and the literal wording of the question.
  2.  **Coherent Shift:** The reframing is a rational reinterpretation, not confusion, often citing contextually relevant normative or pragmatic considerations.
  3.  **Verdict-Linked Asymmetry:** EPR is strongly associated with respondents giving the *minority verdict* within their cultural context regarding the literal descriptive question. It manifests more explicitly and systematically in these respondents.
  4.  **Not Mere Justification:** EPR is distinguished from providing normative *justifications* for a literal descriptive answer. In EPR, the *primary response* addresses the normative/pragmatic question.
  5.  **Primary Cultural Signal:** EPR is not merely a methodological confound obscuring "true" epistemic differences. It signals a fundamental difference in how respondents from different cultures (and subcultures) *interpret the purpose and domain* of epistemic vignette questions, making the reframing itself a critical finding about cultural epistemologies.
  6.  **Boundary:** Responses demonstrating simple misunderstanding, lexical confusion, irrelevant associations, or pure descriptive answers with normative justifications fall outside EPR.

  **In essence:** EPR reveals that the cross-cultural "knowledge gap" you measure is less about divergent answers to the *same* question and more about divergent interpretations of *what the question is asking in the first place*. The minority verdict respondents aren't just outliers; they are applying a different interpretive lens, and this lens is a core part of the cultural difference under investigation. Screening EPR would remove this vital signal. Your observation points towards analyzing *why* certain groups (and sub-groups) find the normative/pragmatic frame more salient or appropriate for these scenarios.
