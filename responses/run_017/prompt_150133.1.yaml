  We are writing a parody of an official guidance document from the fictional Bureau of Admissible Precisifications (BAP). The document is a joint guidance note to taxpayers regarding the Heap Levy, and it must be in a deadpan civil-service voice. The two divisions (Epistemicist Directorate and Supervaluationist Directorate) have their own perspectives, and the humor should come from accurately representing their views without caricature.

  Key elements:

  Epistemicist Directorate:
  - There is an exact grain count boundary, but it is unknowable to citizens due to margin-of-error constraints on knowledge.
  - Include:
     a. Refusal of Freedom-of-Information requests for the cutoff.
     b. Warning against using private grain-counting firms (because counts near the boundary have a margin of error and cannot be relied upon).
     c. A tax notice addressed to a single grain (the one that made the difference).

  Supervaluationist Directorate:
  - Three stamps: 'heap', 'not a heap', and 'no determinate status'. A heap is true under every admissible precisification.
  - Issues:
     a. The enabling statute allows collection only when the levy is determinately owed (so in the penumbra, the statute itself is neither true nor false).
     b. Their mission statement (that the levy has no sharp cutoff) is not straightforwardly true on their own semantics.
     c. The boundary between 'definitely a heap' and 'borderline' is itself borderline, so footnotes should be hedged, and then footnotes to the footnotes.

  Ending: Both divisions issue the same verdict for any actual pile for incompatible reasons, and an Inspector-General's appendix notes that no taxpayer has ever detected the difference and proposes funding research to find one.

  Structure:
  - The document should be in numbered clauses (like a government regulation).
  - Aim for 600-700 words.
  - Keep it readable for someone without philosophy background.

  Outline:

  1. Introduction: Bureau of Admissible Precisifications (BAP) and the Heap Levy.
  2. Joint guidance note from the two directorates.
  3. Epistemicist clauses:
     - Clause about the existence of a precise cutoff and its unknowability.
     - Clause refusing FOI requests for the cutoff.
     - Clause warning against private grain-counting firms.
     - Example of a tax notice to a single grain (as an illustration? or a note?).
  4. Supervaluationist clauses:
     - Clause about the three statuses and the definition of a heap (true in every admissible precisification).
     - Clause about the enabling statute and its limitations (only collect when determinately owed).
     - Clause noting that their own mission statement has indeterminate truth value.
     - Issues with definiteness being borderline (so footnotes with hedges, and footnotes to footnotes also hedged).
  5. Concluding clauses: Both directorates agree on the outcome for any given pile, but for different reasons.
  6. Inspector-General's appendix: No taxpayer has ever detected the difference, and proposes research.

  We'll write in a formal, bureaucratic style without winking at the reader. The humor is in the deadpan delivery of the absurdity.

