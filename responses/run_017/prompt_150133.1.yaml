answer: |-
  ### BUREAU OF ADMISSIBLE PRECISIFICATIONS  
  **JOINT GUIDANCE NOTE: ADMINISTRATION OF THE HEAP LEVY (SAND ACCUMULATION TAX)**  
  **REF: BAP/GN/HL/23-01**  

  1. **Purpose and Scope**  
  This guidance outlines the statutory obligations of property owners under the *Heap Levy Act 1999 (as amended)*. The Levy applies to any accumulation of sand grains on private land meeting the statutory definition of a “heap”. The Bureau comprises two directorates—Epistemicist (ED) and Supervaluationist (SD)—which jointly administer the Levy. Both directorates concur on all operational outcomes, though methodological disparities exist.  

  ---

  ### EPISTEMICIST DIRECTORATE (ED) GUIDANCE  
  2. **Determination of Heap Status**  
     a. A sand accumulation is a heap if, and only if, it contains at least *n* grains, where *n* is the exact cutoff established under Schedule 2 of the Act.  
     b. *n* is fixed and knowable in principle but falls under Section 14(3) (“Margin of Error Constraints”). Consequently, no taxpayer may reliably ascertain *n* through private measurement.  

  3. **Freedom of Information Requests**  
  All requests for disclosure of *n* (per the *Transparency Act 2005*) are denied. The precise cutoff is a state secret under Article 9(2)(b) of the *Official Secrets Framework*. Taxpayers are reminded that unauthorised speculation about *n* may constitute misfeasance.  

  4. **Private Grain-Counting Services**  
     a. Commercial grain audits are strongly discouraged.  
     b. Per Section 14(3), any grain count within ±*k* grains of *n* carries inherent epistemic uncertainty (*k* = statutory error margin). Certificates from private firms are inadmissible in appeals.  
     c. Example: A taxpayer audited at *n*+1 grains (liable) cannot discount the risk that their true count is *n*−1 grains (non-liable) due to error margins.  

  5. **Levy Assessment Procedure**  
     a. Assessments are issued for accumulations at or above *n* grains.  
     b. In cases where liability arises solely from a marginal grain (e.g., grain #*n*), the notice will itemise this grain (see *Assessment Voucher, Annex 3*: “Levy payable by: Grain #247,301, Lot 4B”).  

  ---

  ### SUPERVALUATIONIST DIRECTORATE (SD) GUIDANCE  
  6. **Determination of Heap Status**  
     a. A sand accumulation is a heap only if it satisfies *every admissible precisification* of “heap” under the Act.  
     b. Three statutory classifications apply:  
        - **HEAP** (Levy owed);  
        - **NOT A HEAP** (No levy);  
        - **NO DETERMINATE STATUS** (Penumbral cases; levy suspended).  

  7. **Levy Collection Authority**  
     a. Per Section 5(1), the Bureau may collect the Levy solely where liability is *determinate* (i.e., “HEAP” classification).  
     b. In penumbral cases (“NO DETERMINATE STATUS”), the enabling statute itself lacks determinate truth conditions¹. Collection attempts are thus ultra vires.  

  8. **Classification Procedures**  
     a. SD surveyors apply tripartite stamps (see *Fig. 1: Stamp Protocol*).  
     b. The boundary between “HEAP” and “NO DETERMINATE STATUS” is indefinite². Consequently, stamps applied near thresholds carry intrinsic vagueness³.  

  ---

  ### JOINT ADMINISTRATIVE PROVISIONS  
  9. **Reconciled Outcomes**  
     a. For any physical sand accumulation, ED and SD will issue identical liability verdicts (e.g., both “HEAP” or both “NO DETERMINATE STATUS”/non-liable).  
     b. Discrepancies in theoretical rationale do not affect practical compliance.  

  10. **Compliance Advice**  
      a. Taxpayers uncertain of their accumulation’s status must submit Form HL-8 (“Sand Pile Disclosure”) within 30 days.  
      b. Unauthorised sand removal during classification may incur penalties under the *Anti-Evasion Measures Act*.  

  ---

  ### INSPECTOR-GENERAL’S APPENDIX  
  **Observations on Operational Coherence**  
  Despite divergent methodologies (§2 vs. §6), no taxpayer has ever demonstrably experienced divergent outcomes under ED and SD procedures. This empirical consistency suggests either:  
  - (a) Current sand configurations inherently avoid borderline cases; or  
  - (b) The directorates’ classifications are functionally equivalent.  

  **Recommendation:** Funding is sought for Project SANDSTORM (Semantic Audit of Non-Discrete Sand Thresholds for Ontological Realignment Modelling) to identify a verifiable instance of methodological divergence.  

  ---  
  **Issued jointly by the Epistemicist and Supervaluationist Directorates**  
  *© Crown Copyright. Bureau of Admissible Precisifications, 2023.*  

  ---  
  **FOOTNOTES**  
  ¹ *Statutory indeterminacy in penumbral cases*: SD notes that the phrase “levy owed” in Section 5(1) lacks determinate application where “heap” lacks determinate truth conditions. This does not imply legislative defect but reflects ordinary linguistic practice⁴.  
  ² *Vagueness of definiteness*: The transition between “definitely a heap” and “borderline heap” admits of higher-order vagueness. Thus, the “NO DETERMINATE STATUS” stamp may itself be indeterminately applicable⁵.  
  ³ *Operational impact*: Surveyors are trained to apply stamps conservatively. When uncertainty persists, the accumulation is referred to ED for grain estimation (per Memorandum BAP-ED/SD-12).  
  ⁴ *Mission statement paradox*: The Bureau’s founding principle (“The Heap Levy has no sharp cutoff”) is not straightforwardly true under supervaluationist semantics, as it presupposes a non-admissible precisification. This does not impede statutory functions.  
  ⁵ *Footnote 2 clarification*: The indefiniteness described is not subject to further administrative remedy, as any attempt to precisify “definite” would generate new penumbras.  

  ---  
