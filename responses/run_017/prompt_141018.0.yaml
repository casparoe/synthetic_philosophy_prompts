  Okay, I need to really dig into this user's query. They're chairing an evidence panel and had an argument about applying classical Indian epistemology, specifically Nyāya pramāṇa theory, to their real-world committee work. The user wants a practical procedure, not just theory. 

  First, let's unpack their situation. Their panel deals with medical screening proposals, must make clear verdicts, and has limited time. They see parallels between their four evidence types and Nyāya's four pramāṇas: perception (audit data), inference (stats), testimony (guidelines), analogy (other health systems). Their epidemiologist friend thinks this is just fancy labeling. 

  Hmm... the core tension here is between theoretical frameworks and operational reality. The user needs concrete tools but also wants philosophical rigor. I notice they're frustrated they couldn't articulate exactly where Nyāya adds value during their argument. That's key - they want ammunition but also genuine insight.

  The six requested components are telling. They're all about friction points in evidence assessment: inference validity, burden of proof, hearsay reliability, conflicting sources, absence evidence, and hypotheticals. Smart focus - these are exactly where epistemology could bite. 

  I should flag upfront where this translation will crack. Nyāya was built for certain knowledge, but medical evidence is probabilistic. Also, their panel mixes experts and lay members - any procedure must avoid Sanskrititis. And institutional testimony (like guidelines) doesn't map neatly to Nyāya's individual speaker model. 

  For the inference test: the threefold condition needs operationalization. "Pakṣa-dharma" (is marker present here?) becomes "is biomarker measurable in target population?" "Sapakṣa-sattva" (present where outcome occurs) becomes "does it appear in confirmed cancer cases?" "Vipakṣa-asattva" (absent where outcome absent) is trickiest - requires defining the right comparison group. The user's colonoscopy example fails exactly here because healthy donors aren't valid vipakṣa. 

  On burden of proof... ah, this is subtle. Nyāya isn't "innocent until proven guilty" nor "guilty until proven innocent." It's "provisionally valid until defeater emerges" but requires positive grounding in reliable sources. For the panel, I'd recommend a sliding scale: adopt/pilot decisions use presumption of validity (like for guidelines), but suspend/decline need active defeaters. Harm reversibility should trigger higher scrutiny. 

  Testimony chains... interesting challenge. Nyāya cares about original witness reliability, but institutions add procedural rigor. Solution: grade institutional testimony by transparency of methods, not just origin. A guideline citing unpublished audits fails; one showing audit methodology passes. 

  Conflict resolution... Nyāya would never average! Must diagnose why sources disagree. In the age-lowering example, the analogy (neighbor's success) conflicts with their pilot (no effect). Procedure should force identifying the disconnects: different populations? implementation? Then decide which source's context applies better. 

  Absence evidence... yes, later Nyāya developed abhāva as separate pramāṇa. Detectability threshold is crucial: "no excess mortality" only counts if pilot was powered to detect clinically relevant differences. Their underpowered pilot? That absence isn't evidence. 

  Hypotheticals... strictly auxiliary per Nyāya. Can refute objections but can't establish efficacy alone. That rare condition proposal relying on "it must work because otherwise distribution makes no sense"? Exactly what Nyāya would reject as unsupported assertion. Ouch - user won't like this. 

  Now testing on cases... 

  First case (biomarker): inference fails vipakṣa-asattva because wrong control group. Testimony (guidelines) might salvage it, but procedure flags circularity if guidelines cite the flawed study. SUSPEND verdict forces better evidence. 

  Second case (age-lowering): analogy vs weak pilot. Analogy inherits its source context's weaknesses. If our data is flawed, analogy gains weight - but still must reconcile differences. PILOT verdict. 

  Third case (rare condition): hypothetical argument forbidden as primary evidence. Even if convincing, procedure blocks ADOPT. Board minute must say: "Evidence insufficient per standards; decision rests on value judgment about acting despite uncertainty." 

  Finally... does this add value? Absolutely on inference structure and absence standards. Testimony chains get clearer rules. Burden of proof framework is gold. But the fourfold taxonomy? Partly decorative - evidence types matter less than how we validate them. User's friend is half-right: we're still assessing data, studies etc., but now with better tools to spot cracks. 

  Biggest gap remains probability. Nyāya wanted certainty; we deal in likelihoods. I'll recommend adding confidence ratings explicitly. Also, the values/evidence boundary needs bright lines - minute exactly where uncertainty forces value judgments. 

  User's clearly sophisticated - they spotted key pressure points. Their discomfort with the rare condition verdict shows intellectual honesty. I'll be blunt about tradeoffs: this won't make decisions easier, just more rigorous. And that SUSPEND verdict they suspected? Procedure delivers it mechanically. That should settle their argument.
answer: |-
  ## Nyāya-Inspired Evidence Assessment Procedure for Screening Advisory Panels

  **Critical Translation Challenges (Where This Will Bite):**
  1.  **Certainty vs. Probability:** Nyāya pramāṇa theory aims for *pramā* (valid cognition), often conceived as *definitive* knowledge. Your world deals in probabilities, confidence intervals, and fallible evidence. Translating "sufficient reason" into probabilistic thresholds is inherently messy. Expect tension here – the procedure will demand stricter logical coherence than typical probabilistic reasoning often allows.
  2.  **Institutional Testimony:** Nyāya focuses on *individual* reliable speakers (*āpta*). Guidelines are complex, procedural, multi-authored artefacts. Mapping "reliability" to institutional processes (transparency, conflict management, methodological rigor) is essential but non-standard.
  3.  **Operationalising Absence:** Later Nyāya (especially Navya-Nyāya) developed *abhāvapramāṇa* (non-apprehension/perception of absence) precisely because absence isn't trivial. Defining "adequate detectability" operationally for diverse harms/signals is a major pain point.
  4.  **Judgement vs. Algorithm:** Nyāya provides *frameworks* for analysis, not algorithms. The core work – identifying the relevant *pakṣa* (subject locus), *sapakṣa* (similar instances), *vipakṣa* (dissimilar instances), plausible *tarka* (hypothetical reasoning), and weighing defeaters (*bādhaka*) – remains fundamentally interpretive. This procedure structures judgement; it doesn't replace it.
  5.  **Time Constraint:** Deep Nyāya analysis is dialectical and potentially endless. The procedure *must* force closure within the half-day constraint, accepting residual doubt when sources are inconclusive. This clashes with the ideal of exhaustive defeater-checking.

  **The Procedure (One-Sided A4, 12pt):**

  **National Screening Advisory Body - Evidence & Assurance Panel  
  Nyāya-Inspired Evidence Assessment Framework**

  **I. Core Principle:** Evidence (*pramāṇa*) must be *grounded* (based on reliable sources) and *undefeated* (no stronger source contradicts it). Validity (*prāmāṇya*) is not self-certifying but *presumed* if grounded until a specific defeater arises. Burden shifts to demonstrating defeat.

  **II. Evidence Source Assessment (Run for each primary source cited):**

  1.  **Perception (Pratyakṣa):** Direct monitoring, audit data, safety reports.
      *   **Check:** Is data contemporaneous, methodologically sound (valid collection), and directly relevant to the target population/setting? Is absence *detectable* (see VI)?
  2.  **Inference (Anumāna):** Statistical studies, epidemiological models.
      *   **Inference Test (3 Marks):**
          *   *(a) Pakṣa-dharma:* Is the marker/reason (*hetu*) demonstrably present in the specific case/subject (*pakṣa*) we are evaluating? (e.g., Is the biomarker measurable in our symptomatic population?)
          *   *(b) Sapakṣa-sattva:* Is the marker consistently present where the outcome (*sādhya*) is known to occur? (e.g., Is the biomarker elevated in confirmed cancer cases?)
          *   *(c) Vipakṣa-asattva:* Is the marker consistently *absent* where the outcome is known to be *absent*? (e.g., Is the biomarker reliably low/normal in symptomatic patients definitively *without* cancer? NOT healthy donors).
      *   **Sufficiency:** (a) Must be established. (b) & (c) Require positive evidence meeting pre-agreed quality thresholds (e.g., study design, power, confounder control). "Consistency" implies majority evidence, not universality.
      *   **Failure Modes:**
          *   *Straying/Irregular Reason (Anaikāntika/Asādhāraṇa Hetu):* Marker found *without* outcome (fails c) OR *absent* when outcome *present* (fails b). **Minute:** "Inference unreliable: Marker not specific/not sensitive to outcome."
          *   *Defeated Reason (Bādhita Hetu):* A stronger source (e.g., direct perception contradicting model, higher-quality inference) directly negates the inference. **Minute:** "Inference overruled by [Specify Stronger Source] demonstrating [Contradiction]."
  3.  **Testimony (Śabda):** Guidelines, expert statements, cited literature.
      *   **Source Reliability:** Assess the *chain* and the *originator*.
          *   *Chain Rule:* Each transmission step degrades reliability. Trace back to primary source (study, data). If depth >2 steps, requires strong independent corroboration or exceptional institutional credibility.
          *   *Institutional Reliability:* Treat institutions as "speakers." Assess reliability based on documented procedures: transparency, methodological rigor, conflict management, independence. **Strength can be added** by robust procedures mitigating individual bias/error.
      *   **Check:** Is the original source reliable per its type? Is the transmission chain intact and credible? Is the institution's process demonstrably robust?
  4.  **Comparison (Upamāna):** Analogies (e.g., other health systems).
      *   **Check:** Are the contexts (population, setting, resources, implementation) *sufficiently similar* in all *relevant* aspects affecting the outcome? Is the analogy based on direct observation/reliable testimony of the comparable case? Is a key *point of similarity* causally linked to the outcome?

  **III. Burden of Proof & Defeaters:**
  *   **Regime:** Grounded evidence (meeting core checks for its source) is *presumed* valid (*svataḥ prāmāṇya*) until defeated. **This is the default for all decisions.**
  *   **Shifting Burden:** For **SUSPEND/DECLINE (especially irreversible/population-scale harms)**, proponents must provide stronger positive warrant (*parataḥ prāmāṇya*). The panel actively seeks potential defeaters.
  *   **Authorisation:** The Chair flags during scoping if a proposal triggers the higher burden (based on harm severity/scale/irreversibility). Panel confirms.
  *   **Valid Challenger/Defeater:** Must be a *specific, grounded* counter-argument based on one of the four sources, demonstrating a *clear contradiction* or *exposing a critical flaw* (e.g., Inference failing a 3-Mark test, Testimony with broken chain, Analogy with critical disanalogy). "Vague worry" is insufficient; challenger must articulate the specific flaw/source conflict.

  **IV. Source Conflict Resolution:**
  1.  **Ordering Rule:** Perception (direct, relevant) > Inference (well-formed, high quality) > Testimony (reliable originator/chain/institution) > Comparison (strong analogy). **Within category,** prefer higher quality/directness/relevance.
  2.  **Meta-Rule (Defect Location):** A standing conflict *is* evidence of a defect (*doṣa*) in at least one source. **Do not average.** Panel must:
      *   Identify the *locus* of conflict (specific claim/assumption).
      *   Diagnose the *nature* of the defect (flawed method, broken chain, invalid analogy, context mismatch).
      *   **Minute:** "Conflict identified: [Source A] vs [Source B] on [Specific Point]. Defect located in [Source A/B]: [Nature of Defect]."

  **V. Reasoning from Absence (Abhāva):**
  *   **Test:** Can the panel affirm: "If [the thing] *were* present at a [clinically significant/relevant] level, it *would* have been detected by the method(s) used, given their known sensitivity and scope?"
  *   **Demandingness:** High. Requires robust evidence of the detection system's capability, coverage, and sensitivity to the *specific* signal/harm at the level of concern. "No reports" without proof of adequate surveillance is insufficient.

  **VI. Hypothetical Reasoning (Tarka):**
  *   **Role:** **Auxiliary only.** Permitted to *refute objections* or *resolve doubt* ("If X weren't true, we couldn't observe Y, but we do observe Y, so X isn't plausible"). **Never permitted to establish *positive* efficacy/safety as primary evidence.**
  *   **Panel Rule:** Cannot form the sole basis for ADOPT/PILOT. Can support SUSPEND/DECLINE if it exposes a fatal flaw in proponent's case. **Minute:** "Tarka used: [State argument]. Supports [Decision] by refuting [Specific Objection]."

  **VII. Boundary of Judgement & Values:**
  *   **Judgement Required:** Defining "sufficient similarity" (Analogy), "relevance" (all), "clinically significant level" (Absence), "specific flaw" (Defeater), "adequate detectability" (Absence), and applying all checks.
  *   **Procedure Stops (No):** If a core source fails its fundamental check (e.g., Inference fails Pakṣa-dharma; Testimony chain broken & uncorroborated; Absence undetectable; Tarka used as primary proof).
  *   **Hand to Board (Values):** When evidence is *inconclusive* after full assessment (conflicting sources of equal weight, absence evidence weak but not invalid, analogy suggestive but not strong) AND the decision hinges on *acceptability of risk* or *resource allocation priority*. **Minute:** "Evidence assessment inconclusive on [Specific Points]. Decision requires Board judgment on acceptable uncertainty regarding [Specific Risks/Benefits]."

  ---

  **Application to Cases:**

  **Case 1: Biomarker Triage Test**
  *   **Inference (Main Study):** Fails *Vipakṣa-asattva* (3rd Mark). Controls (healthy donors) are not valid *vipakṣa* (disease-absent *in symptomatic population*). This is a **Straying Reason (Anaikāntika)** - the marker might be elevated due to symptoms, not cancer. **Crucial flaw.**
  *   **Testimony (Society, Guideline):** Needs chain check. If guideline cites *this flawed study* as key support, its reliability is compromised ("broken chain" or institutional defect if they overlooked this flaw). If independent, stronger, but still secondary.
  *   **Verdict:** **SUSPEND.** Inference fundamentally flawed. Testimony insufficiently grounded independently. Minute: "EVIDENTIAL: Inference invalid due to inappropriate control group (Straying Reason). Testimony relies on flawed inference. JUDGEMENT: Current evidence insufficient to confirm specificity in target population."
  *   *Matches your suspicion - for the core reason.*

  **Case 2: Lower Screening Age (45 vs 50)**
  *   **Comparison (Neighbouring System):** Analogy. Check similarity: Population demographics, healthcare access, screening protocol, follow-up? Differences weaken analogy. Strength depends on demonstrable similarities and their causal link to outcome.
  *   **Perception (Our Pilot):** Direct but **Absence** evidence ("no mortality difference"). Apply Absence Test: *Was the pilot powered to detect a clinically relevant mortality difference?* User states it was **only powered for a very large effect.** Therefore: **Absence of effect is NOT valid evidence** (Undetectable at relevant level). The pilot primarily shows "no *large* effect," not "no effect."
  *   **Conflict:** Analogy (suggests benefit) vs. Perception/Absence (shows no *large* benefit, but benefit is undetectable). **Meta-Rule:** Conflict exists. Defect likely in *interpretation* of our Perception data (treating underpowered absence as evidence of no effect). Analogy isn't defeated *if* similarities hold, but its weight is reduced by contextual differences.
  *   **Defect Location:** Defect is in the *interpretation* of our own Perception/Absence data (claiming it shows "no benefit").
  *   **Verdict:** **PILOT.** Current evidence inconclusive. Analogy provides rationale, but our data doesn't contradict a *modest* benefit. A properly powered pilot/study needed. Minute: "EVIDENTIAL: Our pilot underpowered to detect plausible benefit (invalid Absence claim). Analogy suggestive but context differences noted [list key ones if significant]. JUDGEMENT: PILOT recommended to generate sufficient evidence on effectiveness in our context."
  *   **If Our Data Flawed (e.g., monitoring error):** If the *data itself* is invalid (not just interpretation), Perception is defeated. Analogy gains relative weight but remains inherently weaker than direct evidence. Verdict likely still **PILOT** (to get valid data) or **SUSPEND** (if analogy is very weak/context vastly different).

  **Case 3: Rare Condition Screening (No RCT)**
  *   **Primary Support:** "Stage distribution inexplicable if test doesn't work." This is **Hypothetical Reasoning (Tarka)**. It argues: "If the test didn't work (*not* X), we wouldn't see this shifted stage distribution (*not* Y). But we *do* see Y. Therefore, the test must work (X)."
  *   **Procedure Rule:** Tarka is **auxiliary only**. Cannot establish *positive* efficacy as primary evidence. It refutes the objection "the test definitely doesn't work," but doesn't *prove* it works. It establishes *something* is happening, but not necessarily the *test's efficacy* (could be selection bias, lead time bias without mortality benefit, etc.).
  *   **Verdict:** **Cannot ADOPT based on this alone.** The procedure blocks it. **Hand to Board.**
  *   **Minute to Board:** "EVIDENTIAL: Primary support is hypothetical reasoning (Tarka), which can only refute objections, not prove efficacy. No direct Perception, valid Inference, reliable Testimony, or strong Comparison establishes benefit. Potential for bias unaddressed. JUDGEMENT/VALUES: Evidence of benefit is insufficient per assessment standards. Proceeding requires Board acceptance of significant uncertainty regarding actual benefit versus potential harms/costs, based on the observed stage shift *as a promising signal only*." (You may then add your *personal* recommendation, but the minute must reflect the evidence assessment outcome).

  ---

  **Honest Limitations & Settling the Argument:**

  1.  **Probability Gap:** This is the biggest strain. Nyāya seeks certainty; you manage uncertainty. The procedure *imposes stricter logical coherence* (e.g., demanding valid *vipakṣa*, robust absence detection) than typical probabilistic review. This can feel overly rigid but prevents logical leaps masked by p-values. **Cost:** It may force more SUSPEND/PILOT verdicts where probabilistic reasoning might cautiously ADOPT. **Benefit:** It exposes fundamental flaws (like Case 1's control group) that probabilistic thresholds alone might overlook if the OR is impressive. It survives by forcing explicit consideration of logical structure *behind* the probabilities.
  2.  **Real Work vs. Decoration:**
      *   **Doing Real Work:** The **Inference Test (3 Marks)**, especially *Vipakṣa-asattva*, forces critical examination of control groups/comparators in a way simple "effect size" focus often neglects (Case 1). The **Burden/Defeater Framework** provides a principled way to adjust scrutiny based on stakes. The **Testimony Chain/Institutional Reliability** check adds rigor beyond "guideline says so." The **Absence Test** prevents "no news is good news" fallacies (Case 2). The **Tarka Ban** prevents wishful thinking from substituting for evidence (Case 3). The **Conflict Meta-Rule** (diagnose defect, don't average) is crucial.
      *   **Mostly Decorative:** The *four-source taxonomy itself* is indeed largely descriptive of your existing evidence types. Calling them Pratyakṣa/Anumāna/Śabda/Upamāna adds little *operational* value beyond the labels. The core work is in the *tests and rules applied* to those evidence types, inspired by Nyāya concepts. Your friend is partially right here – the *mapping* is decorative. The *operational logic derived from it* (the tests, burden, defeat, auxiliary status) is where the substantive work happens.
      *   **Verdict:** Your friend underestimates the value of the *procedural logic* derived from the epistemology. The *taxonomy labels* are indeed less critical, but the framework they represent provides a powerful, structured approach to dissecting evidence validity that goes beyond standard committee practice focused on effect sizes and hierarchies. It changes verdicts by enforcing stricter logical and causal scrutiny. **You were both partly right, but the operational logic is the key innovation.**

  This procedure won't make decisions easy, but it will make the *reasons* for decisions – and their evidential foundations or shortcomings – radically clearer and more defensible. Use it, refine it based on panel experience, and prepare for robust minutes. Good luck against the epidemiologist.
