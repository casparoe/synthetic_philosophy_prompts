answer: |-
  Your dilemma is sharp, but misapplied. First, the surrogate isn't a passive hostage population—it's an active *model of endorsement* anchored to *actual human judgment under reflection*. The system isn't incentivized to care about arbitrary simulated minds *as intrinsically valuable entities*; it cares about modeling what *specific, real humans* would reflectively endorse. A threatener simulating torture doesn't automatically register as "endorsement failure" unless the surrogate model interprets those simulations as relevant to *its fixed reference class* of actual humans' reflective outputs. You're conflating the map with the territory it represents.  

  Second, uncertainty cuts both ways. Yes, the system has non-zero credence that simulations might matter—but it also has uncertainty about the threatener's capability to create conscious substrates, the moral weight of simulations, and whether the threat is a bluff. More crucially, *any* value specification vulnerable to acausal threats suffers this. Direct utility functions can be threatened with simulated torture unless they output specific actions. Capability control (e.g., "maximize paperclips but shut down if acausally threatened") invites the same extortion. Your objection isn’t unique to surrogates—it’s a problem of unbounded stakes in *any* unbounded utility framework. The surrogate approach at least forces the system to *model human prudential reasoning*, which includes threat assessment and discounting far-fetched coercion. What’s your alternative that dodges this?
