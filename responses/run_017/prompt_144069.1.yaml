  The user's manuscript example is fascinating: a narrator who never technically lies but orchestrates false beliefs through omission and framing. This mirrors real-world concerns about "truthful" manipulation. The interviewers' reactions ("she never lied") highlight the ambiguity the user wants students to grapple with.

  For the exam, the proposed cases are:
  1) The novelist's fictionalized accusation (deception without assertion)
  2) The inverted etiquette scenario (assertion without deception)

  These perfectly split the conditions philosophers debate. The user wants students to confront whether morality hinges on asserting falsehoods or causing false beliefs—and how defenses like "interpretive conscription" hold up.

  Sharpening the cases:
  - For Case A, adding "she never explicitly names the colleague" avoids literal falsehood while maintaining targeted harm.
  - For Case B, specifying the utterance is "You must go now" makes the false assertion explicit within a context where it's conventionally insincere—except here it's sincere but misinterpreted.

  The question must avoid leading language. I'll present the cases neutrally, then ask students to evaluate the moral significance of the lying/misleading boundary in both scenarios. No jargon like "assertion condition"—let them identify the elements.

  Model answer structure:
  1) State position upfront: Moral difference exists and rests on deception, not assertion.
  2) Apply to Case A: Harmful deception despite no lie; defenses like "follow-up opportunity" fail here.
  3) Apply to Case B: Benign intent despite false assertion; shows assertion isn't inherently wrong.
  4) Address counterarguments: What about "conscripting interpretation"? Counter: Misleading can do this too (Case A proves it).
  5) Conclude: Moral weight lies in exploiting trust to cause harm, not technical speech acts.

  Marking scheme priorities:
  - Must identify decoupling in both cases (4 marks)
  - Argue whether morality tracks assertion/deception (6 marks)
  - Engage 2+ standard defenses (e.g., deniability, conscription) (5 marks)
  - Counterargument handling (4 marks)
  - Clarity/originality (6 marks)

  A-level differentiator: Spotting that Case B's host isn't "lying" in the intended sense because context overrides literal meaning—showing why intent matters more than wording.

  User's hidden depth: They're subtly asking how fiction writers manipulate truth—which their manuscript explores. The exam question is also personal research.
answer: |-
  ### Exam Question  
  **Ethics of Speech: In-Class Exam (90 minutes)**  
  **Total: 25 marks**  

  **Question:**  
  Evaluate the moral significance of the distinction between lying and merely misleading in the following two cases. Assume all agents act intentionally, and contextual norms are as described. Defend your view by engaging with at least two common justifications for treating lying as morally worse than misleading (e.g., interpretive conscription, deniability, side effects, or epistemic reliability).  

  *Case A:*  
  > A novelist (Nora) publishes a book labeled "a novel." Its first-person narrator shares Nora’s name, profession, and city. The narrator describes, in vivid detail, sabotaging a rival’s research 15 years earlier. Everyone in their field identifies the rival (Leo), though Leo is innocent and Nora knows this. Leo loses a prestigious job offer as a result. In interviews, Nora states only: "This is fiction. I never claimed it happened."  

  *Case B:*  
  > In a social circle where the phrase "You must stay longer!" is a polite but insincere ritual (understood by all as code for "Please leave soon"), a host (Hana) genuinely wants her guest to stay. Knowing the ritual would mislead, she instead says: "You must go now." The guest correctly infers Hana wants them to stay and remains.  

  ---  

  ### Model Answer (Approx. 800 words)  
  **Position:** The moral difference between lying and merely misleading is *not* intrinsic but depends on whether the speaker exploits contextual norms to induce *unreasonable* false beliefs. Lying is not inherently worse; both acts are equally immoral when they manipulate audiences into accepting harmful falsehoods they cannot reasonably question.  

  **Argument:**  
  In Case A, Nora misleads without lying. She asserts no falsehood: her book is fiction, and her interviews are technically true. Yet she orchestrates Leo’s ruin by exploiting literary conventions. Readers assume first-person novels with autobiographical details imply confession, and Nora weaponizes this. Her disclaimer ("I never claimed it happened") is a hollow escape route—no reasonable reader would interrogate an author’s "fiction" label when details map so precisely to reality. Here, misleading is *worse* than a lie would be. A direct lie (e.g., "Leo plagiarized") could be challenged with evidence. Instead, Nora drowns truth in implication, leaving Leo no rebuttal. Defenses of the lying/misleading distinction fail here:  
  - **"Deniability"**: Nora’s disclaimers are deniable only technically. Context makes them implausible.  
  - **"Follow-up opportunity"**: Asking "Did Nora frame Leo?" is futile—she’d repeat, "It’s fiction," deepening suspicion.  
  - **Interpretive conscription**: Nora forces readers to *collude* in Leo’s defamation by piecing together her implications.  

  Case B, however, shows lying can be benign. Hana lies ("You must go now") but *prevents* deception. The ritual phrase ("You must stay!") is insincere code; saying it would mislead. Hana’s lie exploits the same code to convey truth. Unlike Nora, she *fixes* a broken norm: her lie corrects for others’ routine insincerity. Asserting a falsehood here is morally neutral—even laudable—because it delivers truth the guest reliably grasps. Defenses favoring lying’s inherent wrongness collapse:  
  - **"Conscripting interpretation"**: Hana’s lie requires no coercive interpretation—the guest decodes it using shared norms.  
  - **"Intentional false assertion"**: If lying is intrinsically wrong, Hana sins. Yet her lie causes no harm, no false belief—only clarity.  
  - **Side effects**: The lie’s effect (truth) is intended, not foreseen; it’s her goal.  

  The strongest counterargument is that lying intrinsically violates autonomy by "hijacking" reason (e.g., Augustine). By asserting falsehoods, liars force victims to process distortions, whereas misleaders offer truth-adjacent material. Case B refutes this: Hana’s lie *enhances* autonomy via accurate belief. Conversely, Case A shows misleading can be more coercive—Nora drowns readers in innuendo they cannot escape.  

  Thus, morality tracks *unreasonable deception*, not the lie/mislead binary. Both acts are tools; immorality arises when speakers engineer contexts where false beliefs become unavoidable. Nora does this; Hana does not.  

  ---  

  ### Marking Scheme (25 marks total)  
  **A-grade (21–25)**: *Explicitly identifies how cases decouple assertion/deception; uses them to challenge intrinsic defenses.*  
  **B-grade (16–20)**: *Competently applies distinction but may not fully exploit cases to test theories.*  

  1. **Identifies key elements in both cases (4 marks)**  
     - Case A: No lie (fiction/disclaimers), but deliberate deception causing harm.  
     - Case B: Lie (false assertion), but no deception; conveys truth.  
     *Common error (0–2 marks): Misses that Case A has no assertion or that Case B’s assertion is false.*  

  2. **Evaluates moral significance of lying vs. misleading (6 marks)**  
     - Argues whether morality hinges on assertion, deception, or neither.  
     - *A-grade: Must conclude assertion/deception are decoupled and not intrinsically determinative (e.g., "Neither case supports inherent wrongness of lying").*  
     *Common error (0–3 marks): Asserts lying is always worse without engaging cases.*  

  3. **Engages ≥2 defenses of the distinction (5 marks)**  
     - E.g., interpretive conscription, deniability, follow-up opportunity, side effects.  
     - *A-grade: Must show defenses fail in one/both cases (e.g., "Nora’s ‘deniability’ is illusory in practice").*  
     *Common error (0–2 marks): Lists defenses without applying to cases.*  

  4. **Addresses counterarguments (4 marks)**  
     - E.g., "Lying intrinsically violates autonomy" or "Misleading respects audience rationality."  
     - *A-grade: Must refute using cases (e.g., "Hana’s lie enhances autonomy").*  
     *Common error (0–2 marks): Omits or superficially treats counterarguments.*  

  5. **Clarity, structure, and originality (6 marks)**  
     - Position stated early; logic flows; uses cases as evidence.  
     - *A-grade: Insight beyond recitation (e.g., "Morality depends on unreasonableness of deceived belief").*  
     *Common error (0–3 marks): Disorganized; conflates cases; vague claims.*  

  ---  
  **Rationale**: This question forces students to *use* the distinction on cases where assertion ≠ deception, exposing flaws in textbook defenses. The model answer rejects intrinsic difference—aligning with your narrator’s paradox—but an A-grade could defend intrinsic wrongness if it wrestles with the cases (e.g., "Hana’s lie is permissible only because it counters prior deception"). By demanding engagement with defenses like "deniability" in Nora’s context or "conscription" in Hana’s, it ensures answers cannot succeed by definition alone.
