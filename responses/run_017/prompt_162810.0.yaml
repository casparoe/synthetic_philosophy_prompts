answer: |-
  Here's your Q&A prep sheet, structured by likely questioner, ordered by potential damage, with blunt assessments of your vulnerabilities. Focus on concise, conversational replies – aim for 90-120 seconds max per answer.

  **The Order & The Objections:**

  1.  **Population Ethics Scholar (Friendly but Foundational):**
      *   **Question (Sympathetic Skepticism):** "Help me see why 'authorization' isn't just a new label for the asymmetry's core intuition. What explanatory work is it *doing* that the standard 'no harm' or impersonal value frameworks can't do, besides getting you to your 'borrowed life' conclusion? Isn't the 'imposition without gain' just another way to say 'harm' in this context?"
      *   **Your Reply:** "Great point. The key difference is *source* and *waivability*. Harm-focused views often struggle to explain why creating a person with a life *worth living* isn't a *benefit* owed to them. Impersonal views struggle with the asymmetry itself. Authorization grounds the reason in the *agent's authority* to permit significant impositions *on another*. It's about respecting *their* potential moral status as a source of permissions *for actions affecting them*. Crucially, unlike many harm claims or impersonal values, authorization-based reasons *can be waived* by the subject later – that's the core move the 'borrowed life' case exploits. Harm claims usually persist even if the harmed person forgives or accepts it; authorization reasons can dissolve."
      *   **Weakness/Concession:** Your reply is strongest on waivability vs. harm. The vulnerability is in *proving* "authorization" isn't *just* a restatement of the asymmetry's core "no duty to create" intuition dressed up. Be ready to say: "You might be right that it captures an intuition, but I argue it provides a *structural explanation* for *why* that intuition holds and how it interacts with other moral concerns (like consent) in a way 'harm' or impersonal value don't neatly allow." Concede if pressed that "imposition without gain" *overlaps* with harm language, but stress the distinct *relational* and *permissive* aspect.

  2.  **Totalist Consequentialist (Hostile Core):**
      *   **Question (Dismissive):** "This feels like elaborate philosophical gymnastics to preserve a status quo bias. Why isn't the 'asymmetry' just an irrational intuition that we *should* discard? If creating a happy person adds net good to the world, why *wouldn't* we have a reason to do it? Your 'authorization' framework seems designed solely to avoid that conclusion, making it circular. Isn't this just privileging non-existence for no good reason?"
      *   **Your Reply:** "I hear the skepticism! My project isn't to *defend* the asymmetry's truth against consequentialism, but to offer what I argue is its *best interpretation if we take it seriously*. Many smart people *do* find the intuition robust. The question is: *if* we grant that intuition some weight, what structure best makes sense of it? Authorization offers a structure rooted in familiar moral concepts (consent, imposition on others) that explains *why* adding good to the world via creating a new subject of experience feels different morally from benefiting existing people. It's not about privileging non-existence *per se*, but about the unique moral constraints involved in *imposing existence itself* on a new being."
      *   **Weakness/Concession:** This is the hardest objection. Your reply is defensive ("if we grant the intuition..."). The core vulnerability is that your whole project *assumes* the asymmetry is worth saving. **Concede upfront:** "You're absolutely right that from a pure totalist view, this looks unnecessary. My chapter assumes the asymmetry reflects *something* morally significant that needs explaining, even if you ultimately reject it." Don't try to *prove* the asymmetry true against consequentialism here – that's not your chapter's goal. Focus on the interpretive project.

  3.  **Kantian Political Philosopher (Sympathetic but Sharp):**
      *   **Question (Metaphysical Worry):** "The appeal to hypothetical future endorsement is fascinating but deeply problematic. How can a *non-existent* being 'authorize' its own creation? Isn't this circular? We're using the *result* of the creation (the existing person who endorses) to retroactively justify the act that brought them into existence in the first place. Doesn't this render 'authorization' conceptually incoherent for procreation?"
      *   **Your Reply:** "Excellent point – the circularity worry is serious. I'm *not* claiming the non-existent being authorizes it *beforehand*. That *would* be incoherent. Instead, I'm arguing that the *nature* of the authorization-based reason *against* creation is such that it *can be defeated* by the *actual, counterfactually robust endorsement* of the *now-existing* person. The reason is grounded in the *risk* of imposing an unendorsed existence. If that risk is *retrospectively shown* to be unfounded – if the person *does* endorse it with full awareness – then the *force* of that initial reason dissipates significantly. It's not about prior consent; it's about the reason being contingent on the *actual outcome* for the specific person regarding endorsement."
      *   **Weakness/Concession:** This is central to your "borrowed life" case. Your reply is crucial. The vulnerability lies in explaining *why* a reason grounded in the *ex ante* imposition (when authorization *was* impossible) should be defeasible *ex post*. Be ready to lean hard on the analogy: "Think of risky surgery on an unconscious patient. The reason against doing it without consent *is* strong *ex ante*. But if the patient wakes up and says, 'Thank God you did that, I fully endorse it knowing the risks,' it *does* seem to morally vindicate the act, even if the *ex ante* reason was weighty. The *reason* against imposing was always partly conditional on the outcome being *unwanted* by the subject."

  4.  **Feminist Philosopher (Real-World Focus):**
      *   **Question (Practical/Political):** "Okay, abstract cases aside: what does this *do*? Does your view imply parents of children with disabilities (congenital or acquired) *didn't* wrong them by creating them if the child endorses life? Does this help or hurt arguments against selective termination based on disability? And crucially, could you *actually* say to an existing child: 'We had no moral reason *for your sake* to create you' without it being a devastating rejection?"
      *   **Your Reply:** "These are vital questions. First, **disability:** My view *explicitly avoids* equating disability with a 'life not worth living.' The 'borrowed life' case involves *harm* (pain), not disability *as* harm. Endorsement is about the *overall life*. Many disabled people powerfully endorse their lives. On my view, if they do, the *initial authorization-based reason against creating them* is *defeated*. It says nothing about whether creating *was* a harm *to the parents* or society – that's separate. **Selective Termination:** My view is neutral on the permissibility of termination *itself*. It *does* suggest that if a potential child *would* have a life overwhelmingly full of unconsented, unendorsed suffering, the authorization reason *against* creating is very strong. But it doesn't dictate policy. **The Parent-Child Conversation:** This is the hardest. My view claims there *wasn't* a strong *pro tanto* reason *owed to the child* for their sake to create them *in virtue of the good life they'd have*. But parents have countless *other* reasons (love, desire, societal, etc.). Telling a child *only* that would be cruel and misleading. The moral truth might be complex, but emphasizing *all* the reasons for their existence, especially love and commitment, is what matters interpersonally."
      *   **Weakness/Concession:** **This is a major vulnerability.** Your view *does* potentially undermine a standard "we created you *for your benefit*" narrative. **Concede:** "You're right that stating the 'no reason for your sake' part in isolation to an actual child would be morally disastrous and inaccurate to the full picture of why parents procreate. My claim is a specific philosophical one about *one type* of moral reason within the asymmetry debate, not a guide for parent-child relationships." Be very clear you **reject** the idea that disability makes life not worth living. The "devastating rejection" point is potent – don't dismiss it.

  5.  **Grad Students (Decision Theory Focus):**
      *   **Question (Technical):** "Isn't your 'endorsement' move just a sneaky way of evaluating the creation decision *ex post* rather than *ex ante*? The standard asymmetry is usually framed *ex ante* (reasons for/against creating *before* we know the outcome). By letting *actual* endorsement defeat the *ex ante* reason, haven't you just changed the decision rule to an *ex post* evaluation disguised as a reason defeater?"
      *   **Your Reply:** "Sharp distinction! I'm *not* advocating an *ex post* decision procedure. The *decision* is still made *ex ante*, under uncertainty. The authorization-based reason *against* creating is an *ex ante* reason, grounded in the *risk* of imposing unendorsed suffering/harm. What the 'borrowed life' case shows is that this specific *type* of reason has a *defeater condition*: if the *actual outcome* is robust endorsement, that *ex ante* reason is retrospectively shown to have been *misapplied* or *overridden* in *this specific instance*. It's not that we evaluate the decision *ex post*; it's that the *nature* of the authorization reason means its *moral force* depends counterfactually on whether the created person *would* endorse it. If they *do*, the reason wasn't as strong *in this case* as the *ex ante* risk suggested it *might* be."
      *   **Weakness/Concession:** This touches on the Kantian's worry. The line between "defeated reason" and "*ex post* evaluation" is thin. **Concede:** "It's a fine line, I agree. My claim is that the defeasibility is *built into the structure* of authorization-based reasons themselves, making it distinct from simply switching to an *ex post* optimization rule. But the mechanism relies on information only available *ex post*."

  **The Question You Hope Nobody Asks (But Prepare For It - Possibly from the Grad Students or Consequentialist):**

  *   **Question (Scope Challenge):** "If authorization is so central for *procreation* because existence is an 'imposition,' why doesn't it apply equally to *any* action that dramatically shapes a future person's life *without their prior consent*? For example, moving countries, choosing their school, or even having them vaccinated as a baby? If those don't generate strong asymmetric authorization reasons, why does procreation get this special, uniquely stringent treatment? Isn't this just *ad hoc*?"
  *   **Your Reply (Grit your teeth):** "That's a deep challenge. The difference, I argue, lies in the *fundamental nature of the imposition*. Procreation imposes *existence itself* – the necessary condition for *any* benefits or harms, *any* consent or authorization capacity. It creates the subject *upon whom* all other acts will be performed. Other significant acts (like major medical decisions for infants) *presuppose* the existence of a subject and occur within the context of ongoing care and relationship, where proxy consent and the duty to act in the child's best interest are well-established frameworks. Procreation lacks that context; it creates the subject *and* the context *ex nihilo*. The 'authorization gap' is uniquely total and foundational."
  *   **Weakness/Concession:** **This is a major weakness, especially in the borrowed life half.** Your distinction is plausible but debatable. The "uniqueness" claim needs robust defense. **Concede:** "You've hit on a core tension. I argue for a categorical difference in *kind*, not just degree, but I acknowledge the line can be blurred. If the authorization framework *only* applies plausibly to procreation and nothing else, that *would* be suspicious. I think it illuminates other 'existence-shaping' acts too, but procreation is the starkest case where the asymmetry manifests." **This objection might be the best argument for your supervisor's point to cut the second half.**

  **Overall Strategy & Concessions:**

  *   **Lead with Interpretation:** Constantly frame this as "Here's the best way to *make sense of* the asymmetry if we find it intuitive," not "Here's why the asymmetry is definitively true."
  *   **Bite the Bullet on Borrowed Life:** Defend it clearly as a *feature* showing the waivability of authorization reasons. Use the risky surgery analogy relentlessly. Acknowledge it's counterintuitive but argue it solves a bigger problem (not wronging parents).
  *   **Concede Key Vulnerabilities Early:**
      *   To the Consequentialist: "This assumes the asymmetry intuition is worth explaining."
      *   To the Feminist: "Stating the 'no reason for your sake' claim in isolation to a child would be cruel and misleading."
      *   On Scope: "Procreation's uniqueness is crucial and needs robust defense."
      *   On Circularity/Time: "The defeasibility mechanism relies on *ex post* facts but is built into the *ex ante* reason structure."
  *   **Protect the Core:** Your strongest ground is the *waivability* of authorization reasons vs. the persistence of harm claims. Hammer this. The analogy to other consent-based impositions (surgery) is your best tool.
  *   **Listen to Your Supervisor:** The "borrowed life" case and its implications (scope challenge, parent-child convo) are the thinnest, most controversial parts. Be prepared to acknowledge in the session that this is the part you're least sure about and might cut. Frame it as "Here's an interesting consequence, but it might show a flaw."

  Good luck! Remember, it's a *works-in-progress*. Show you're thinking deeply and are open to refinement, especially on the second half. Your awareness of the room's dynamics is a huge asset – use it!
