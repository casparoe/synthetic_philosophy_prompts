  Hmm, their background in population genetics might explain why they’re zeroing in on heredity as a "selection rule." They’re treating it like a biological trait that’s lost its adaptive purpose but persists. Clever framing. Their lottery idea is a sharp tool to isolate the variables: What does heredity *actually* contribute? Is it about mandate-proofing, continuity, or something sacred? 

