prompt: |-
  ok weird situation, hopefully you can help. My team got "reorganized" at work and I got dumped onto a data migration project, and it has quietly turned into a metaphysics problem that I now have to have opinions about by Friday.

  Setup: there's a legacy system I'll call the Beast, with an old schema — Customers, Accounts, Households, and junk like "Arrangement" and "Shadow Account" — and we're merging it into a new system with its own schema. About a third of the Beast's documentation is gone, everyone who built it left years ago, and the vendor will only give us query access to outputs: no internals, no historical logs, no way to run interventions against it. So over and over we hit the same argument: does entity type X in the Beast denote something real in the domain, or is it an artifact of how they happened to store things, or is it the same thing as Y in the new system under another name? And "just look at the data" doesn't settle it, because for a lot of these the accessible outputs provably can't discriminate between the candidates. I keep saying things like "that's not a thing, that's a way of talking" and my colleague says "you can't know that, you can't see the logs," and we are going in circles.

  I've been reading up on ontology identification / ontology matching and it's 90% tooling and 10% the question I actually have, so I want the philosophical spec instead. Write me the desiderata: what a method for identifying what a system's ontology really is has to deliver, in a situation where part of the evidence is permanently inaccessible. Requirements list, with the case or consideration behind each one, and put it in my setting (schemas, lost logs, orphan predicates) as much as in abstract terms. Things I specifically want dealt with, because these are literally the arguments we're having:

  - orphan predicates: a term in the Beast that no accessible query can make come out differently — nothing we can do makes a difference to any output we can see. Does an adequate method owe us a verdict on those at all? Is "delete it" a verdict or a refusal?
  - dormant vs dead: some of these would matter again if we ever recovered the logs or got write access; some wouldn't matter under any expansion of access at all. Is a method allowed to treat "it would make a difference if we could see more" as evidence that it's there now? Should it?
  - I think two requirements we both sort of want can't both hold: never conclude non-existence just because the evidence is missing, but also don't keep entities alive forever just because nobody can disprove them. If that's right, say so and say what has to give.
  - should the method also have to tell us what would settle the question — which inaccessible fact, if we got it, would flip the verdict? My colleague says that's the whole point; I think it's optional. Who's wrong?
  - granularity: Household vs. the three Customers in it. Is that a fourth thing or a façon de parler, and what does the method owe us here? Be explicit about whether "it's just how we talk" is an ontological verdict or a cop-out.
  - identity over time and across systems: is supplying identity criteria an input to the method or a deliverable of it? And can the method work pairwise (match two schemas at a time) or must it be global? I have a feeling that pairwise matching + treating "is the same entity as" as transitive + admitting borderline cases are jointly unsatisfiable — tell me if that's a real tension or if I'm talking nonsense.
  - verdicts indexed to an access profile (same system, different clearance, different verdict): bug or feature?

  Mark which requirements are non-negotiable and which are just the taste of one camp — I'm pretty sure my colleague is smuggling in a verificationist prejudice and I want it flagged as such rather than smuggled into the spec. Also, fix the purpose: I need this good enough to actually decide what to migrate and what to flag to compliance as uncertain, so say which desiderata change if the purpose is legal/audit rather than description. Tell me which single requirement knocks out the most tempting approaches. Then a short scorecard, three approaches only: count only what's directly accessible; count whatever the best explanation of the accessible evidence needs; count whatever our best description of the domain quantifies over. Keep the weight on the criteria, not the scoring. No bibliographies or citations, I can't follow up on references right now and I'd rather have the argument anyway.
reasoning: |-
  We are in a data migration scenario with partial information. The goal is to outline a method for determining the ontology (what entities and relations really exist) of a legacy system (the Beast) given that some evidence (e.g., internal logs, write access) is permanently inaccessible. We must produce a set of desiderata (requirements) for such a method, addressing the specific issues raised.

  ## Core Philosophical Problem
  The central issue is that we cannot observe the entire system (due to missing documentation, no access to internals, etc.), so we are forced to make ontological commitments based on incomplete evidence. We must avoid both:
  - Prematurely dismissing entities because we cannot currently observe them (verificationism).
  - Indefinitely preserving entities that are not needed to explain anything (anti-occamism).

  ## Desiderata for an Adequate Method

  ### 1. **Non-Negotiable: Evidence-Based Commitment**
     - **Requirement**: The method must not commit to the existence of an entity or relation unless there is some accessible evidence that depends on it (i.e., without which the evidence would be different or inexplicable). Conversely, it must not deny existence solely because of lack of evidence.
     - **Rationale**: Without this, we either fall into verificationism (only what is observed exists) or we allow arbitrary entities (anything goes). This requirement anchors ontology to what we can observe, but does not require that every entity be directly observable. It allows for inference to the best explanation.
     - **In Context**: For orphan predicates (terms that no accessible query can discriminate), this requirement implies that we cannot commit to their existence because they do not affect any accessible output. However, we also cannot assert their non-existence arbitrarily. We must remain agnostic unless we can infer from the context (see dormant vs dead).

  ### 2. **Non-Negotiable: Agnosticism for Orphan Predicates**
     - **Requirement**: The method must explicitly mark orphan predicates (those that do not affect any accessible output) as "ontologically indeterminate" (neither real nor non-real) and record the reason (lack of discriminatory evidence).
     - **Rationale**: Orphan predicates are underdetermined by the accessible evidence. We cannot know if they are artifacts or real but currently dormant. Therefore, we must not delete them (which is a verdict of non-existence) without justification, nor keep them as real. Instead, we flag them as uncertain.
     - **Migration Implication**: For migration, we might choose to not migrate orphan predicates, but we must document the uncertainty for compliance.

  ### 3. **Non-Negotiable: Distinguish Dormant vs Dead**
     - **Requirement**: The method must distinguish between:
       - **Dormant**: Orphan predicates that would affect outputs if we had access to more (e.g., logs or write access). We have reason to believe they are real but currently inactive.
       - **Dead**: Orphan predicates that would not affect any output even with expanded access (e.g., they are pure implementation artifacts). We have reason to believe they are not real.
     - **Rationale**: We can sometimes infer dormancy from the design of the system (e.g., the term appears in a context that suggests it is intended to be used, or it is part of a pattern that is active elsewhere). Dead terms are those that are vestigial (e.g., a column that is never read by any part of the system, even internally). However, without full access, we must rely on inference.
     - **How**: This requires an abductive inference (inference to the best explanation) of the system's design. For example, if the term is part of a table that is joined in a view that is never output, but the view exists, it might be dormant. If the term is never referenced in any view, stored procedure, or output, it might be dead.

  ### 4. **Non-Negotiable: Reject Universal Verificationism and Anti-Occamism**
     - **Requirement**: The method must not require that every entity be directly verifiable (rejecting verificationism) but also must not allow entities to be kept without explanatory power (rejecting anti-Occamism). Therefore, the method must use inference to the best explanation as the standard for existence.
     - **Resolution of the Tension**: What must give is the requirement for absolute certainty. We accept that ontology is relative to the available evidence and the best explanation. We do not require proof of non-existence for deletion, but we do require that an entity must contribute to the explanation of the evidence to be kept.

  ### 5. **Non-Negotiable: Provide Counterfactual Discriminants**
     - **Requirement**: The method must, for every ontological commitment (including indeterminacy), specify what evidence (if accessible) would change the verdict. This is non-negotiable because it is necessary for audit and future work.
     - **Rationale**: This allows us to know what to do if access changes (e.g., if logs are recovered). It also provides transparency and a way to resolve disputes. Your colleague is right that this is essential for a robust method.
     - **In Context**: For example, for an orphan predicate, the method must say: "If we had write access, then if changing the value of this field in the Beast caused a change in output X, then it is real; else, it is dead."

  ### 6. **Non-Negotiable: Clarify Granularity**
     - **Requirement**: The method must decide whether a term (like Household) is a real entity or a façon de parler (a way of talking) by requiring that real entities must have independent identity conditions and causal powers (i.e., they must be able to change the outputs independently of their parts).
     - **Rationale**: If a Household is just a grouping of Customers and never appears in any output independently (i.e., every output that mentions Household can be rewritten in terms of Customers without loss), then it is not a real entity. But if there are outputs that treat the Household as a whole (e.g., a total balance that is not the sum of individual balances) then it is real.
     - **What the Method Owes**: A verdict: either "Household is a real entity because it has independent causal effects" or "Household is a façon de parler because its effects are reducible to its parts". This is not a cop-out because it is based on evidence.

  ### 7. **Non-Negotiable: Identity Criteria as Input**
     - **Requirement**: The method must take as input the identity criteria for entities in both the source (Beast) and target systems. This is because identity criteria are domain-specific and cannot be inferred without domain knowledge.
     - **Pairwise vs Global Matching**: The method should work pairwise (Beast vs new system) because global matching (with multiple systems) is intractable and not necessary for migration. However, it must account for the fact that identity is not always transitive (e.g., due to borderline cases). Therefore, the method must allow for non-transitive matching and explicitly handle borderline cases by marking them as such.
     - **Your Feeling**: You are correct that pairwise matching + transitivity + borderline cases are jointly unsatisfiable. Therefore, the method must reject transitivity as a requirement and instead rely on domain-specific identity criteria. Borderline cases must be flagged.

  ### 8. **Feature: Verdicts Indexed to Access Profile**
     - **Requirement**: The method must allow that ontological verdicts are relative to the access profile (what we can observe). This is a feature because it reflects the epistemic situation. However, the method must also allow for updating the verdicts when the access profile changes.
     - **Rationale**: What we consider real might change if we get more access. This is not a bug because ontology in the context of partial information is inherently relative.

  ## Addressing Verificationism
  Your colleague's insistence that we cannot know without the logs is a verificationist prejudice. The method must reject this by allowing inference to the best explanation. However, we must also not overstep by inferring without evidence.

  ## Purpose: Legal/Audit vs Description
  - For **description**, we want the most accurate representation of the domain.
  - For **legal/audit**, we must be conservative: we cannot discard anything that might be required for compliance, and we must document uncertainty.
    - **Changes in Desiderata**:
      - Orphan predicates must be kept (or their data preserved) until proven dead, even if the ontological verdict is indeterminate.
      - The requirement for counterfactual discriminants becomes even more critical for audit trails.
      - We must err on the side of over-inclusion in migration to avoid losing data that might be required.

  ## The Single Requirement That Knocks Out Tempting Approaches
  **Requirement 1 (Evidence-Based Commitment)** rules out:
  - **Naive Verificationism**: Only what we can directly observe exists -> rejects orphan predicates entirely, which may be wrong if they are dormant.
  - **Naive Realism**: Everything in the schema exists -> keeps too much, including artifacts.

  ## Scorecard: Three Approaches

  ### Approach 1: Count Only What's Directly Accessible (Verificationism)
  - **Orphan Predicates**: Verdict: non-existent. **Problem**: Might be dormant; violates Requirement 2 (agnosticism) and Requirement 3 (dormant vs dead).
  - **Dormant vs Dead**: Cannot distinguish because it doesn't consider counterfactuals. **Problem**: Fails Requirement 5 (counterfactual discriminants) and Requirement 3.
  - **Granularity**: Might declare Household non-existent if it doesn't appear in outputs, even if it is reducible but real in the domain. **Problem**: Fails Requirement 6.
  - **Identity**: Only what matches directly. **Problem**: Fails Requirement 7 because identity criteria are not considered.
  - **Access Profile**: Absolute to current access. **Problem**: Fails Requirement 8 (relativity) because it doesn't allow for change.
  - **Overall**: Fails on non-negotiables 1,2,3,5,6,7,8.

  ### Approach 2: Count Whatever the Best Explanation of the Accessible Evidence Needs (Abduction)
  - **Orphan Predicates**: Marked as indeterminate unless they are part of the best explanation (e.g., if they explain why the schema is structured a certain way). **Meets Requirement 2 and 3** by requiring inference.
  - **Dormant vs Dead**: Actively infers based on the role in the system (e.g., if it is part of a table that is used in an internal view, even if not output, it might be dormant). **Meets Requirement 3**.
  - **Granularity**: If the best explanation requires treating Household as a real entity (e.g., to explain aggregated outputs), then it does. **Meets Requirement 6**.
  - **Identity**: Uses identity criteria provided as input to match. **Meets Requirement 7**.
  - **Access Profile**: Verdicts are relative to current evidence but can be updated. **Meets Requirement 8**.
  - **Counterfactual Discriminants**: Explicitly provided as part of the explanation (e.g., "if we had logs, we would see X"). **Meets Requirement 5**.
  - **Overall**: Best meets the non-negotiables.

  ### Approach 3: Count Whatever Our Best Description of the Domain Quantifies Over (Domain Realism)
  - **Orphan Predicates**: If the domain description (from business knowledge) includes them, they exist. **Problem**: Without evidence, this might include artifacts. Fails Requirement 1 (evidence-based) because it doesn't tie to the system's behavior.
  - **Dormant vs Dead**: Cannot distinguish because it ignores system behavior. **Problem**: Fails Requirement 3.
  - **Granularity**: Follows domain description. **Problem**: May not match the system (e.g., the Beast might implement the domain differently). **Risk**: Might force a household as an entity even if the Beast doesn't treat it as such. Fails Requirement 6 if it doesn't consider system evidence.
  - **Identity**: Based on domain, may not match the system. **Problem**: Fails Requirement 7 (needs system-specific identity).
  - **Counterfactual Discriminants**: Not provided. **Problem**: Fails Requirement 5.
  - **Overall**: Fails on non-negotiables 1,3,5,6,7.

  ## Conclusion
  The method must be based on **inference to the best explanation (abduction)** of the accessible evidence. This approach best satisfies the non-negotiable requirements. For your migration project:
  - Use the abductive approach.
  - Flag orphan predicates as indeterminate and preserve their data (for compliance) unless proven dead by the best explanation.
  - Document counterfactual discriminants for every verdict.
  - Work pairwise and do not assume transitivity for identity.
answer: |-
  Below is a structured breakdown of the desiderata (requirements) for a method to determine the ontology of your legacy system (the Beast) in the context of data migration, given permanently inaccessible evidence (e.g., internal logs, write access). The requirements address your specific pain points (orphan predicates, dormant/dead distinctions, granularity, etc.), with each item including the rationale and how it applies to your scenario. Non-negotiable requirements (based on epistemic principles) are marked as **Non-Negotiable**; others reflect practical or philosophical preferences. I'll also address the purpose (legal/audit vs. description), flag verificationist biases, identify the "knockout" requirement, and provide a scorecard of three approaches.

  ---

  ### **Desiderata for Ontology Identification in Partial Evidence Scenarios**
  #### **Context**: Legacy system (Beast) with partial access (query-only outputs, no internals/logs), merging into a new system. Goal: Decide what to migrate, what to flag as uncertain, and resolve disputes about whether entities are "real" or artifacts.

  1. **Non-Negotiable: Evidence-Dependent Ontological Commitment**  
     - **Requirement**: The method must only assert the existence/non-existence of an entity if it makes a testable difference to the accessible evidence. If an entity has no observable effect on any output, the method must not force a binary verdict (real vs. non-real).  
     - **Rationale**: Prevents arbitrary claims. If nothing in the accessible data (e.g., query outputs) changes based on an entity, asserting its existence or non-existence is epistemically unjustified. Verificationism (only what is observed exists) is rejected here—we allow inference but demand evidence-linked justification.  
     - **Your Setting**: Orphan predicates (e.g., "Shadow Account" with no discriminatory output) cannot be declared "real" or "non-real" outright. The method must output "indeterminate" for these, not "delete it" (which assumes non-existence). Deleting is a migration decision, not an ontological verdict.  
     - **Legal/Audit Impact**: For compliance, "indeterminate" entities may need to be migrated or preserved as "unverified" to avoid liability.

  2. **Non-Negotiable: Distinguish Dormant vs. Dead for Orphan Predicates**  
     - **Requirement**: The method must classify orphan predicates as either:  
       - **Dormant**: Would affect outputs if inaccessible evidence (e.g., logs) existed or write access was available.  
       - **Dead**: No possible expansion of access (e.g., even with full logs) would make it affect outputs.  
     - **Rationale**: Resolves the "you can't know without logs" stalemate by using inference from accessible evidence. Dormant entities are "real but inactive" (e.g., inferred from schema patterns or dependencies); dead ones are artifacts (e.g., deprecated fields).  
     - **Your Setting**: If "Arrangement" is referenced in a view definition but never affects outputs, it might be dormant; if it has no dependencies, it might be dead. The method must use abductive reasoning (inference to the best explanation) to decide, not direct evidence.  
     - **Verificationist Bias**: Your colleague's "you can't know without logs" is verificationist—it assumes only direct evidence counts. This requirement rejects that by allowing inference.

  3. **Non-Negotiable: Reject Absolute Anti-Skepticism and Verificationism**  
     - **Requirement**: The method must not require 100% evidence to deny existence (anti-skepticism), nor demand that all entities be directly observable (verificationism). Instead, it must use a best-explanation standard: an entity exists only if it is necessary to explain the accessible evidence.  
     - **Rationale**: Breaks your deadlock: "Never conclude non-existence due to missing evidence" and "Don't keep entities alive forever" can't both hold. What gives: We deny existence if the entity is not needed to explain any evidence (even inferred). But we remain agnostic if it might explain something inaccessible (dormant).  
     - **Your Setting**: If "Household" is reducible to Customer data in all outputs, it may not exist as a separate entity. But if it explains anomalies (e.g., aggregated balances), it exists.  
     - **Legal/Audit Impact**: For audit, "not needed to explain evidence" justifies non-migration, but must be documented.

  4. **Non-Negotiable: Counterfactual Discriminants as Required Output**  
     - **Requirement**: For every ontological verdict (including "indeterminate"), the method must specify which inaccessible fact (e.g., log entry, write test) would change it.  
     - **Rationale**: Your colleague is right—this is essential for transparency, auditability, and future-proofing. It forces the method to show its work and avoids "faith-based" claims.  
     - **Your Setting**: For an orphan predicate, the method might say: "If write access showed changing field X alters output Y, then X is real; else, dead."  
     - **Verificationist Bias**: Treating this as optional (your view) risks untestable assertions. Non-negotiable for accountability.

  5. **Non-Negotiable: Granularity Verdicts via Causal Independence**  
     - **Requirement**: The method must decide if an entity (e.g., "Household") is real or a "façon de parler" based on whether it has independent causal power—i.e., can it affect outputs in ways its components (e.g., Customers) cannot?  
     - **Rationale**: "Just how we talk" is a cop-out if unsubstantiated. Real entities must have unique explanatory roles (e.g., Household-level balances that aren't sums of Customer balances).  
     - **Your Setting**: If Household appears in outputs only as a grouping of Customers (no unique data), it's a façon de parler. If it enforces rules (e.g., joint-account limits), it's real.  
     - **Legal/Audit Impact**: Façon de parler entities can be omitted in migration; real ones must be preserved.

  6. **Non-Negotiable: Identity Criteria as Input, Not Output**  
     - **Requirement**: The method must take domain-specific identity criteria (e.g., "Customer is identified by SSN") as user input. It cannot infer identity from scratch due to partial evidence.  
     - **Rationale**: Identity is domain-dependent and cannot be reliably inferred without full system access. The method must use these criteria to match entities pairwise (Beast vs. new system).  
     - **Your Tension**: Pairwise matching + transitivity + borderline cases is unsatisfiable (e.g., Beast Account = New Account, and New Account = New Product, but Beast Account ≠ New Product). The method must flag borderline cases and not assume transitivity.  
     - **Your Setting**: Provide identity rules (e.g., "Accounts are identical if they share a key") and accept non-transitive matches (e.g., "Beast Arrangement" partially matches "New Contract").

  7. **Feature: Access-Relative Verdicts (Bug for Description, Feature for Audit)**  
     - **Requirement**: Verdicts must be indexed to the current access profile (e.g., "Given query-only, X is indeterminate"). If access improves, verdicts should update.  
     - **Rationale**: Reflects epistemic reality—ontology isn't absolute but evidence-relative.  
     - **Your Setting**: A "dormant" verdict today might become "real" if logs surface.  
     - **Purpose Dependence**: A bug for pure description (which wants system-agnostic truth), but a feature for audit (which requires evidence trails). For legal purposes, this is non-negotiable—it justifies uncertainty flags.

  ---

  ### **Purpose Impact: Legal/Audit vs. Pure Description**
  - **Legal/Audit Purpose**: Desiderata 1–7 all apply, but with stricter outcomes:  
    - Orphan predicates must default to "indeterminate/dormant" and preserved in migration.  
    - Counterfactual discriminants (Requirement 4) are critical for compliance paper trails.  
    - Access-relativity (Requirement 7) is a feature—it documents evidence limits.  
  - **Pure Description Purpose**: Focuses on "true" ontology, so:  
    - Requirement 7 (access-relativity) becomes a bug—it admits relativity where realism is desired.  
    - Dead entities can be discarded more aggressively.  
    - Best-explanation (Requirement 3) suffices without legal caution.

  ---

  ### **The Knockout Requirement**
  - **Requirement 1 (Evidence-Dependent Commitment)** knocks out the most tempting approaches:  
    - **Verificationism**: Denies all orphan predicates (violates by requiring direct evidence).  
    - **Schema Literalism**: Assumes all schema entities exist (violates by ignoring evidence).  
    - **Domain-Driven Matching**: Forces new-system ontology onto Beast (violates by not using Beast-specific evidence).

  ---

  ### **Approach Scorecard**
  **Key**: Assessed against core requirements (1–7). Weight on **feasibility** (works with partial evidence), **audit-support** (provides justifications), and **decisiveness** (minimizes "indeterminate" verdicts). No approach wins outright; choose based on your purpose (audit favors Abduction).

  | Approach                          | Feasibility | Audit-Support | Decisiveness | Key Trade-offs                                                                 |
  |-----------------------------------|-------------|---------------|--------------|--------------------------------------------------------------------------------|
  | **1. Count Only Accessible**      | High        | Low           | High         | Fails R1–R3: Orphans deleted prematurely (verificationist). Ignores inference. |
  | (Only what queries directly show) |             |               |              | Poor for legal—lacks counterfactuals (R4) and over-reduces granularity (R5).   |
  | **2. Best Explanation (Abduction)** | Medium      | High          | Medium       | Best on R1–R7: Uses inference for dormant/dead (R2–R3), provides counterfactuals (R4). |
  | (What explains accessible evidence)|             |               |              | Less "decisive" due to agnosticism on orphans, but auditable. Your colleague may dislike inferences. |
  | **3. Domain Quantification**      | Low         | Medium        | High         | Fails R1, R3, R5: Ignores system evidence. Forces domain entities (e.g., Household) even if Beast doesn't use them. |
  | (What the business domain "has")  |             |               |              | Decisive but risky for audit—may migrate artifacts or omit real entities.      |

  **Recommendation**: Use **Best Explanation (Abduction)**. It handles partial evidence, delivers counterfactuals for compliance, and resolves disputes via inference (not dogma). For your Friday deadline:  
  - Classify orphans using schema dependencies (dormant if linked to other entities, dead if isolated).  
  - For granularity (e.g., Household), check if outputs require it as a causal entity.  
  - Document all verdicts with counterfactuals (e.g., "If logs showed X, we'd reclassify Y").  
  - Flag "borderline" identity matches for manual review.  

  This balances pragmatism and rigor—your colleague gets testable justifications, and you avoid verificationism.
