  | **INT-02**      | Cap Elite University Places for High-Income Backgrounds                     | B: Top 10% (High)        | ZPA (4.2.1)      | Excessive concentration of opportunity in B creates systemic instability ("elite distrust"). Capping reduces B's welfare *relative to a new 'social harmony threshold'*, below which their welfare contributes normally. | Evidence defining 'harm threshold' (e.g., polling on trust collapse). Proof capping reduces B's welfare *above* this threshold.             |
  | **INT-03**      | Mandatory Pay Ratio Disclosure (CEO:Median)                                 | A: Median (Medium) B: CEO (Very High) | CWM (4.3.1)      | Disclosure narrows perceived gap. Improves relative standing of A, activating the CWM factor (λ) to increase the weight given to A's *existing* welfare level in PWS. | Empirical validation of λ coefficient (e.g., surveys showing increased life satisfaction in A post-disclosure *without pay rise*). |
  | **INT-04**      | "Reverse Scholarships": Fees for Wealthy Students at Top Unis               | B: Wealthy Students (High) | VPE (4.4.1)      | High fees deter some B cohort study, reducing future high-skilled/high-wage population. Reduces future competition for scarce high-status roles, boosting morale/retention in current lower-welfare skilled workers (Cohort C), increasing their welfare and population stability. | Demographic modelling of reduced B fertility/emigration due to debt. Proof of improved C morale/retention due to reduced future competition. |

