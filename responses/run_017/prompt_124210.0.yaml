  ## INTERNAL DELIVERY PLAN: PRIORITY-ALIGNED INTERVENTIONS FOR DISTRIBUTIONAL HARMONISATION  
  **Ministry of Equitable Outcomes (MEO)**  
  **Ref: MEO/PRI/DP/2024/07**  
  **Classification: POLICY DEVELOPMENT – SENSITIVE**

  **1.** **Background & Statutory Context:** Following the enactment of the *Equity Advancement Act 2023* (EAA), the Ministry of Equitable Outcomes (MEO) is mandated to operationalise Prioritarianism as its sole distributional objective (EAA, s.2(1)). Prioritarianism is defined as the aggregation of individual welfare states, weighted such that a unit of welfare gain accruing to an individual counts for more, the lower that individual’s absolute welfare level prior to the gain (Standard Additive Model, EAA, Schedule 1). The core metric is the Prioritarian Weighted Sum (PWS).

  **2.** **Operational Challenge Identification:** Analysis (MEO Internal Research Note 24/113) indicates standard welfare-improving interventions (e.g., targeted skills programmes for low-wage workers, healthcare access expansion in deprived areas) demonstrably increase PWS. However, stakeholder consultation (MEO/Stake/Cons/24/08) and cross-departmental liaison (HMT Ref: EQ/Fin/24/099) have identified strong policy interest in interventions primarily reducing inequality through mechanisms that may not generate absolute welfare gains, particularly those affecting high-welfare cohorts. Initial modelling (MEO/Mod/Base/24/15) confirms pure "levelling down" (LD) – interventions reducing the welfare of a higher-welfare cohort without increasing the welfare of any lower-welfare cohort – invariably *decreases* PWS under the Standard Model, as no individual experiences a weighted gain.

  **3.** **Strategic Imperative:** Achieving societal harmony and perceived fairness (EAA, s.1(a)) necessitates exploring pathways to implement LD-type interventions where deemed socially beneficial, while remaining compliant with the Prioritarian PWS objective. This requires innovative methodological approaches within the established framework.

  **4.** **Approved Methodological Pathways for LD-Type Intervention Assessment:** To reconcile policy objectives with the Prioritarian mandate, MEO Policy Directorate, in consultation with the Office for Welfare Metrics (OWM), approves the following assessment pathways for LD-type proposals:

      **4.1.** **Welfare Metric Recalibration (WMR):** Proposers may submit evidence justifying a recalibration of the welfare metric itself for specific cohorts or contexts. For example:
          *   **4.1.1.** Demonstrating that perceived relative deprivation in Cohort A (lower-welfare) causes quantifiable psychological harm (e.g., via validated Wellbeing-Adjusted Life Year - WALY - indices). Reducing the welfare of Cohort B (higher-welfare) could then be argued to *increase* the absolute welfare of Cohort A by alleviating this harm, converting LD into a net PWS gain (See Annex A, Intervention 1).
          *   **4.1.2.** Proposing context-specific welfare functions where status goods or positional advantages contribute negatively to *overall* welfare if their possession fuels resentment in others. Reducing such advantages could yield net welfare gains via reduced social friction.

      **4.2.** **Zero-Point Adjustment (ZPA):** Proposers may argue for a context-dependent shift in the welfare scale's zero point. If the welfare of the highest cohort is demonstrably causing systemic instability or existential risk disproportionately impacting lower-welfare cohorts, the welfare of the highest cohort could be interpreted relative to a new "harm threshold."
          *   **4.2.1.** Welfare *above* this threshold might contribute less (or negatively) to the PWS calculation for that individual, while welfare *below* remains positively weighted. Reducing welfare above the threshold could thus increase PWS (Annex A, Intervention 2). Robust justification for the threshold's location is mandatory.

      **4.3.** **Comparative Weighting Module (CWM):** A supplementary weighting factor may be applied *within* the prioritarian weighting function, sensitive to the *relative* position between cohorts.
          *   **4.3.1.** Where an intervention reduces the gap between a low-welfare Cohort A and a high-welfare Cohort B, even without absolute gain to A, a CWM factor (λ) could be applied to Cohort A's *existing* welfare level during PWS calculation, effectively increasing its weight due to improved relative standing. This requires empirical validation of the λ coefficient's impact on overall welfare perception (Annex A, Intervention 3). OWM oversight is essential.

      **4.4.** **Variable Population Extension (VPE):** Proposers may model the long-term demographic impacts of persistent high inequality.
          *   **4.4.1.** Evidence suggesting LD interventions reduce resentment-driven emigration among lower-welfare cohorts (thus increasing the domestic population size of lower-welfare individuals) or discourage fertility among higher-welfare cohorts (reducing future high-welfare population) can be incorporated. The resultant change in the *number* of individuals at various welfare levels, coupled with prioritarian weighting, may yield a positive net PWS over a defined time horizon (e.g., 25 years) even if short-term PWS decreases (Annex A, Intervention 4). Discount rates apply.

  **5.** **Assessment & Approval Protocol:**
      *   **5.1.** All LD-type proposals MUST utilise at least one pathway (4.1-4.4) for PWS modelling.
      *   **5.2.** Proposals must include a counterfactual "do nothing" PWS projection.
      *   **5.3.** The Primary Assessment Criterion remains Net ΔPWS over the intervention lifecycle. A positive Net ΔPWS is required for funding eligibility.
      *   **5.4.** Proposals utilising CWM (4.3) or VPE (4.4) require mandatory peer review by the OWM Prioritarian Methodology Panel.
      *   **5.5.** Proposals relying solely on WMR (4.1) or ZPA (4.2) require Senior Responsible Officer (SRO) sign-off at Director level within MEO.

  **6.** **Next Steps:**
      *   **6.1.** Disseminate this Delivery Plan and Annex A to all Policy Teams and Delivery Partners by 2024-08-01.
      *   **6.2.** OWM to develop technical guidance on implementing WMR, ZPA, CWM, and VPE methodologies by 2024-10-15.
      *   **6.3.** Pilot assessments of LD-type proposals using these pathways (Q1-Q2 2025).
      *   **6.4.** Review efficacy and PWS outcomes of pilot interventions by end Q4 2025.

  **Signed:**  
  *[Signature]*  
  **Sir Reginald Bureaucrat**  
  Director General, Policy & Delivery  
  Ministry of Equitable Outcomes  
  2024-07-27

