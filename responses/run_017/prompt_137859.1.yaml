prompt: |-
  I'm a software engineer on a long work assignment in a city whose everyday norms differ sharply from the ones I grew up with: queues here are loose and pushy, tipping is not expected, and people cross wherever they like rather than at corners. A colleague ended an argument about whether I should adapt by saying these conventions are exactly like the rule of the road. Driving on the right is arbitrary in content, since driving on the left would coordinate just as well, but once everyone expects right, you have a genuine obligation to drive right, and visitors have it too. So, he concluded, I owe it to locals to queue, tip, and cross as they do for as long as I'm here.

  I would like an audit of that analogy rather than a verdict on the underlying question. Please lay out the mapping explicitly, as a correspondence table: arbitrary content, mutual expectations, the payoff from coordinating, the harm from deviating, the role of law and enforcement, the situation of the visitor. Then tell me which of those features tipping, queueing, and jaywalking actually share with the road-rule case and which they lack. My own sense is that the three are different kinds of thing: queueing looks like genuine coordination, tipping looks like a transfer to a particular worker rather than an equilibrium I join, and crossing the street looks like a rule about risk that happens to be partly codified in law.

  Two complications I want handled. First, apply what I think of as the invisible-deviation test: if I skip the tip, melt into a loose queue, or cross against the light at three in the morning on an empty street where no local sees me and no one is affected, does the analogy still generate an obligation? If the road-rule case survives that test and the others don't, that seems to matter a great deal. Second, take the visitor's excuse seriously and tell me whether it is special pleading or whether it exposes a real gap: I did not help set the local equilibrium, my single deviation changes nothing, and I could endorse a rule permitting discreet opt-out by outsiders without the convention collapsing.

  Does my colleague's conclusion survive once the disanalogies are on the table? Does it survive for all three norms or only for some, and is there a better analogy for the ones the road-rule picture does not fit? I have no philosophy training, so please define any term of art you rely on.
reasoning: |-
  Okay, let me unpack this user's request. They're a software engineer working abroad, grappling with cultural norms around queuing, tipping, and jaywalking that clash with their upbringing. Their colleague used the road rule analogy to argue for full adaptation, but the user wants that analogy audited, not a verdict. 

  First, I need to map the road rule analogy precisely. The core components seem to be: arbitrary convention (right/left driving), mutual expectations, coordination payoff, harm from deviation, legal codification, and visitor obligations. The user already suspects the three norms differ - queuing as pure coordination, tipping as transfer, jaywalking as risk-management. 

  The invisible-deviation test is crucial here. If an action has zero impact when unseen (like 3am jaywalking), does the obligation hold? Road rules likely pass this test because the risk exists independently of witnesses. Tipping might fail - no one harmed if undetected. Queuing is trickier; even invisible cutting might erode the norm if discovered later.

  Then there's the visitor's excuse: "I didn't set this system, my individual deviation won't collapse it." This exposes whether the norm is truly coordination-dependent or has independent moral weight. For road rules, the answer is clear - your single swerve can cause disaster. For tipping, the harm is diffuse (worker income, cultural expectations), so the excuse has more force. 

  Hmm, the user's background matters here. As a software engineer, they'll appreciate system-thinking: equilibria, externalities, failure conditions. I should frame the analysis in those terms without jargon. Their "no philosophy training" note means explaining terms like "collective action problem" when used.

  The colleague's conclusion survives best for queuing (coordination-heavy) and least for tipping (transfer-heavy). Jaywalking sits in between - coordination matters at busy intersections but not at 3am on empty streets. Better analogies might be: tipping as optional service charge (like hotel minibar), jaywalking as risk calculus (like choosing to use an umbrella).

  Ultimately the road analogy oversimplifies. The real insight is that norms have different "failure tolerances." Queuing collapses if enough people cut; tipping withstands some stiffers; jaywalking risks are situational. The user's instinct about distinct norm types seems correct - the audit should validate that.
answer: |-
  Here’s a systematic audit of your colleague’s analogy, presented as requested. I’ll define key terms in **bold** and address both complications explicitly.

  ### 1. Mapping the Road-Rule Analogy: Core Features
  | **Feature**               | **Road Rule Example (Driving Side)**                                                                                                                                 |
  |---------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Arbitrary Content**     | Choice of left/right is arbitrary (no inherent moral superiority).                                                                                                   |
  | **Mutual Expectations**   | Everyone expects others to drive on the same side; predictability is key.                                                                                             |
  | **Payoff from Coordinating** | Prevents chaos, collisions, and delays (efficient traffic flow).                                                                                                     |
  | **Harm from Deviating**   | Direct physical harm (crashes), disruption, and eroded trust in the system.                                                                                           |
  | **Role of Law/Enforcement** | Codified in law; enforced by fines/police. Violations are unambiguous.                                                                                                |
  | **Situation of Visitor**  | Obligation applies regardless of origin: deviation risks harm even if unintentional. No "opt-out" for safety reasons.                                                 |
  | **Invisible Deviation Test** | **Fails**: Swerving to the "wrong" side at 3 AM on an empty road *still* creates risk (unexpected pedestrian, another car). Harm is *activity-dependent*, not perception-dependent. |
  | **Visitor's Excuse**      | **Invalid**: Individual deviation *can* cause harm (e.g., if one other driver is present). Collective stability relies on universal adherence. No "discreet opt-out" is safe. |

  ---

  ### 2. Applying the Analogy to Queueing, Tipping, and Crossing Norms
  #### **Queueing (Loose/"Pushy")**
  | Feature                | Shared with Road Rule? | Explanation                                                                                               |
  |------------------------|------------------------|-----------------------------------------------------------------------------------------------------------|
  | Arbitrary Content      | ✅ Yes                 | Orderly queues vs. loose clusters are culturally arbitrary.                                               |
  | Mutual Expectations    | ✅ Yes                 | Locals expect fluid movement; rigid queues feel inefficient to them.                                      |
  | Payoff from Coordinating | ✅ Yes                 | Prevents conflict, ensures fair(ish) access.                                                              |
  | Harm from Deviating    | ⚠️ **Partially**       | Pushing might cause irritation or conflict, but rarely physical harm. Harm is *social*, not physical.     |
  | Role of Law            | ❌ No                  | Rarely codified/enforced (unlike traffic rules).                                                          |
  | **Invisible Deviation**| ❌ **No obligation**   | If no one sees you "cut" in an empty, loose crowd, no harm occurs. Harm depends on *perception*.          |
  | **Visitor's Excuse**   | ✅ **Valid**           | A single discreet deviation won’t collapse the system. Norm stability doesn’t rely on universal adherence. |

  **Verdict**: Partial fit. Queueing is a **coordination convention**, but harm is social, not physical. Fails the invisible deviation test.

  #### **Tipping (Not Expected)**
  | Feature                | Shared with Road Rule? | Explanation                                                                                                |
  |------------------------|------------------------|------------------------------------------------------------------------------------------------------------|
  | Arbitrary Content      | ✅ Yes                 | Tipping customs vary arbitrarily (e.g., 20% in US vs. rounding up in EU).                                 |
  | Mutual Expectations    | ⚠️ **Partial**         | Workers may expect tips if it’s the norm *in their industry*, but not as a universal social contract.      |
  | Payoff from Coordinating | ❌ No                  | Not a coordination game. Payoff is a *transfer* (worker income), not mutual benefit.                       |
  | Harm from Deviating    | ⚠️ **Indirect**        | Withholding expected tips harms workers' livelihoods, but no *immediate* systemic collapse.                |
  | Role of Law            | ❌ No                  | Rarely legally mandated; social/corporate policy-driven.                                                   |
  | **Invisible Deviation**| ❌ **No obligation**   | If no one knows you skipped a tip, no direct harm occurs. Harm is *economic*, not activity-dependent.      |
  | **Visitor's Excuse**   | ✅ **Valid**           | One skipped tip won’t destroy the system. Workers budget assuming *some* non-tippers (e.g., tourists).     |

  **Verdict**: Weak fit. Tipping is a **transfer custom**, not a coordination game. No mutual payoff; harm is indirect. Fails both tests.

  #### **Crossing (Anywhere vs. Corners)**
  | Feature                | Shared with Road Rule? | Explanation                                                                                                |
  |------------------------|------------------------|------------------------------------------------------------------------------------------------------------|
  | Arbitrary Content      | ✅ Yes                 | Designated crossings are arbitrary (e.g., "jaywalking" laws exist in some cities, not others).            |
  | Mutual Expectations    | ⚠️ **Contextual**      | Drivers expect pedestrians at crossings; in "cross anywhere" cultures, they’re alert everywhere.           |
  | Payoff from Coordinating | ✅ Yes                 | Predictability prevents accidents.                                                                         |
  | Harm from Deviating    | ✅ Yes                 | *Physical harm* (accidents) if deviating where cars expect coordination (e.g., crossing mid-block in a "corners-only" city). |
  | Role of Law            | ⚠️ **Variable**        | Often codified but weakly enforced ("jaywalking" laws).                                                    |
  | **Invisible Deviation**| ⚠️ **Situational**     | At 3 AM on an empty street: **no risk = no obligation**. If cars *could* appear, risk remains.             |
  | **Visitor's Excuse**   | ⚠️ **Partial**        | A single deviation won’t collapse the norm, but *if seen*, it might encourage locals to deviate unsafely.  |

  **Verdict**: Strong fit **only when risk exists**. It’s a **risk-coordination convention**. Passes the invisible deviation test *only* when danger is present.

  ---

  ### 3. Conclusion: Does the Analogy Hold?
  - **Queueing**: The analogy **partially holds** as coordination, but fails the *invisible deviation test* and allows for the *visitor's excuse*.  
  - **Tipping**: **Poor fit**—not about coordination but economic transfer. Fails both tests.  
  - **Crossing**: **Strong fit when safety is at stake**, but obligation dissolves without risk (e.g., empty streets).  

  **Does your colleague’s conclusion survive?**  
  - **For queueing**: Only weakly. Social friction matters, but discreet deviations by outsiders don’t undermine the system.  
  - **For tipping**: No. Tipping is a redistributive practice; your obligation is to workers (if local wages rely on tips), not to "coordinate."  
  - **For crossing**: Only in high-risk scenarios. At 3 AM on an empty street? No obligation.  

  **Better Analogies**:  
  - **Tipping** ≈ **Service fee customs** (e.g., resort fees). Not joining an equilibrium, but participating in a local economic practice.  
  - **Queueing** ≈ **Seating etiquette** (e.g., taking shoes off indoors). A social script where deviation *can* cause minor friction but isn’t catastrophic.  
  - **Crossing** ≈ **Safety protocols** (e.g., standing on escalators). Obligation scales with actual risk.  

  **Final Takeaway**:  
  Your colleague’s analogy works best for **risk-based coordination norms** (like crossing safely) but overextends to purely social/economic norms. The "invisible deviation" and "visitor’s excuse" tests reveal critical gaps: true coordination norms (like driving) impose obligations *independent* of observation because risk is inherent. For queueing/tipping, harm relies on social or economic context, making the obligation more contextual and less absolute.
