  **The Matched Pair (Final):**

  1.  **Case 1 (Hyperbolic Discounting Generated): The Morning Run**
      *   *Setup:* Taylor plans Sunday night for Monday morning. She knows **LL:** Getting up at 6:00 AM for a run (immediate effort cost: -7 utils) leads to better energy and focus *later that morning/afternoon* (+10 utils delayed a few hours). **SS:** Sleeping in until 7:30 AM (immediate reward: +6 utils). At T1 (Sunday night), contemplating Monday, *both options involve future costs/rewards*. Taylor focuses on the net outcome: Run nets +3 utils (-7 +10), Sleep nets +6 utils. Discounted equally (delay ~10 hours), she judges the run (+3) is "better for her" long-term than sleeping in (+6), as the +6 is fleeting while the run's benefits compound. She prefers and plans the run (LL).
      *   *T2 (6:00 AM Monday, alarm rings):* The immediate effort of getting up (-7 utils) feels overwhelmingly salient. The reward of energy later (+10 utils) feels distant and abstract. The comfort of more sleep (+6 utils) is vividly immediate. Taylor's *evaluation flips*: the immediate cost/benefit comparison (-7 effort vs +6 sleep) outweighs the discounted future benefit of the run. She hits snooze (SS).

  2.  **Case 2 (Time-Consistent Akrasia): The Salad or the Fries**
      *   *Setup:* Lee is at lunch on Friday, committed to healthy eating after a checkup. **LL:** Order a salad (-0 utils effort, health reward: feeling virtuous and energized +8 utils later today/ongoing). **SS:** Order fries (+7 utils immediate taste pleasure, cost: sluggishness and guilt -5 utils later today). At T1 (before ordering), Lee calculates: Net LL Util = +8. Net SS Util = +7 - 5 = +2. +8 > +2. Lee prefers the salad, tells the waiter "I'll have the salad, please" (LL), and feels resolved.
      *   *T2 (Waiter asks "Salad or fries?" for the final time):* Lee's evaluation is unchanged: salad nets +8, fries net +2. She *knows* the salad is better, all things considered, right now. Yet, faced with the immediate temptation of the fries' smell and the effort of self-denial, she hesitates and says, "...actually, I'll have the fries." She chooses the SS option against her own concurrent judgment.

