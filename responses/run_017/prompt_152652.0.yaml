  1.  **Case 1 (Hyperbolic Discounting Generated): The Early Draft Deadline**
      *   *Setup:* Jordan is a writer. Her editor offers a choice on Monday: **LL:** Submit a polished draft by Friday 5 PM for a $500 bonus. **SS:** Submit a rough draft by Wednesday 5 PM for a $200 bonus. Jordan values $1 as 1 util and finds polishing the draft aversive, costing effort worth -$250 utils spread over Thursday/Friday. At T1 (Monday 9 AM), both deadlines are future. Jordan uses βδ discounting (β=0.5, δ=1 per day -简化). Net LL Util = 500 - 250 = +250 (received Friday). Net SS Util = +200 (received Wednesday). Discounted LL (delay 4 days) = βδ⁴ * 250 = 0.5 * 1 * 250 = 125. Discounted SS (delay 2 days) = βδ² * 200 = 0.5 * 1 * 200 = 100. 125 > 100 → Jordan prefers and commits to the LL option ($500 on Friday).
      *   *T2 (Wednesday 4 PM):* **SS Option:** Can be achieved *now* by quickly submitting the rough draft: +200 utils (immediate reward perception). Utility = β * 200 = 0.5 * 200 = **100**. **LL Option:** Requires effort (-250 utils) starting now/soon for reward Friday (+500 utils). Utility = β * (-250 + δ² * 500) = 0.5 * (-250 + 1*500) = 0.5 * 250 = **125**. 125 > 100 → **Still prefers LL!** **Final Case 1 (Imperfect but Shows Mechanism): The Gym or the Movie**
