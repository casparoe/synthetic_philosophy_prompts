prompt: |-
  I'm TAing for an upper-level seminar on practical rationality this term, and last week in the grad lounge — three coffees deep, my notes a mess — our study group got into an argument we where not able to settle, and I want a pair of cases that either settles it or at least forces the disagreement out into the open.

  Here's where we got stuck. Everyone agreed that hyperbolic (or beta-delta / quasi-hyperbolic) discounting is the standard formal story people reach for when they want to model weakness of will. But then someone pointed out that what the model actually delivers is a *change* in what the agent prefers between t1 and t2: at t2 she prefers the smaller-sooner option, full stop, discounted at her own current rate. So on the model she never acts against her own contemporaneous all-things-considered judgement. The "weakness" only shows up if you identify the earlier self and the later self as one agent and treat the earlier ranking as the authoritative one. Half the room said that's precisely the point and strict akrasia is a myth; the other half said no, there are perfectly ordinary cases where you know right then, in the moment, that you shouldn't, and you do it anyway, and no discount curve has anything to say about those.

  So: build me a matched pair of cases that separates the two phenomena. Same agent as nearly as possible, the same two options (a smaller-sooner and a larger-later reward a normal person could actually face — dissertation writing, a night shift, the gym, saving for a new boiler, whatever works), and the same observable sequence: at t1, with both options still ahead of her, she ranks the larger-later option above the smaller-sooner one and says so or plans accordingly; at t2, with the smaller-sooner option now on offer, she takes it.

  - In Case 1, the reversal has to be *generated* by present-biased discounting and nothing else — I want to see the common-delay signature explicitly (both options delayed → larger-later wins; the common delay removed → smaller-sooner wins), i.e. the pattern a time-consistent exponential discounter cannot produce.
  - In Case 2, the same observable sequence, but the agent is time-consistent: at t2 she still ranks the larger-later option above the smaller-sooner one, and takes the smaller-sooner one anyway. Hyperbolic discounting should contribute nothing to the explanation.
  - Both cases: ordinary life, one paragraph each, no exotic devices, no forgetting, no new information that changes the payoffs, no drugs or brain lesions. Don't stipulate the verdicts — generate them from the set-up, and make it a real matched pair, not two unrelated stories with the same moral.

  Then give me the payoff: for each case, what she prefers and does at t1 and at t2 and why; in which case (if either) charging her with akrasia is actually apt, keeping synchronic akrasia distinct from mere diachronic preference change; the single structural feature that differs between the two cases and what happens to the pair if you remove it; and an honest note on the counterattacks — how someone who thinks the discounting story *is* the theory of akrasia would try to explain Case 2 away, and how someone who insists on strict akrasia would argue that Case 1 isn't weakness of will at all. I'm planning to run this in discussion section, so keep it tight enough to put on one handout.
reasoning: |-
  Okay, I'm diving into this problem. The user is a TA for an upper-level seminar on practical rationality, and they need a matched pair of cases to clarify a debate about weakness of will versus hyperbolic discounting. The core disagreement is whether akrasia (acting against one's own better judgment) exists or if all apparent weakness of will is just preference change due to time discounting.

  First, I need to understand the key requirements. The user wants two cases with identical observable behavior: at t1 the agent prefers and plans for the larger-later option, but at t2 chooses the smaller-sooner option. The difference must lie in the underlying mechanism.

  For Case 1, I need to show pure hyperbolic discounting at work. That means the preference reversal must follow the common-delay signature: when both rewards are equally delayed, the agent prefers the larger-later one; but when the smaller reward becomes immediate, preference flips. The classic example is choosing between studying now versus scrolling social media - the immediate gratification of distraction wins despite prior plans.

  Case 2 is trickier. I need the same choice pattern but without time inconsistency. Here the agent must maintain the same preference ranking at t2 yet still act against it. Health commitments work well - like choosing junk food over a healthy meal while fully acknowledging it's worse. The key is introducing an execution failure element separate from valuation.

  I'm structuring both cases to highlight the critical difference: in Case 1 preference actually changes due to temporal proximity, while in Case 2 preference stays constant but willpower fails. This distinction should force the theoretical disagreement into the open.

  For the payoff analysis, I'll emphasize that synchronic akrasia only applies to Case 2, where the agent acts against their concurrent judgment. In Case 1, it's just rational preference shift. The structural hinge is whether valuation changes with time (discounting) or stays fixed (akrasia).

  I anticipate counterarguments: discounting theorists might claim Case 2 involves hidden preference shifts, while akrasia proponents might argue Case 1 still involves judgment conflict if we consider past commitments. But the cases are designed to challenge these views by controlling variables.

  The examples use mundane scenarios (work vs distraction; healthy eating) to keep them relatable. I'm avoiding exotic elements to focus the debate on the core philosophical issue. This should give the TA a clean tool for classroom discussion.
answer: |-
  Here's your matched pair, designed to force the disagreement into the open by isolating the structural difference:

  **The Cases:**

  1.  **The Dissertation Sprint (Hyperbolic Discounting):**
      *   *Setup:* Alex is a grad student facing a hard deadline in 72 hours. At T1 (Monday morning), she plans a work sprint: finish the draft tonight (Mon, effort cost: -8 utils, payoff: timely submission avoiding penalty, +20 utils net) OR watch a movie tonight (Mon, +5 utils) but then scramble tomorrow (Tues, effort cost: -15 utils, payoff: same +20 utils net). With both efforts delayed, she calculates: `Net Mon Sprint = -8 + 20 = +12` vs. `Net Tues Scramble = Discounted(-15 + 20)`. Using her beta-delta model (β=0.7, δ=1), `Discounted Tue Scramble = βδ(-15 + 20) = 0.7*5 = +3.5`. +12 > +3.5, so she commits to working Monday night.
      *   *T2 (Monday evening):* The movie is *now* (SS: +5 utils, immediate). The draft sprint is *now* (effort cost: -8 utils, immediate). The Tuesday scramble is still delayed (effort: -15 utils tomorrow, payoff: +20 utils in 2 days). Her calculation: `SS Movie Now = +5` vs `LL Draft Sprint Now = -8 + βδ²(20) = -8 + 0.7*1*20 = -8 + 14 = +6`. +6 > +5, so she *should* still prefer the sprint! But wait – the key is the effort *cost*. The immediate effort feels amplified by present bias: She perceives `LL Draft Sprint Now = β(-8) + βδ²(20) = 0.7*(-8) + 0.7*1*20 = -5.6 + 14 = +8.4`. `SS Movie Now = β(5) = 3.5`. +8.4 > 3.5? That doesn't flip! **Crucial Signature:** We need the common delay removed for the *sooner* option. The *payoff* of the sprint isn't immediate. The *effort cost is immediate, the reward is delayed*. The *movie* offers immediate *reward*. So: `SS (Movie Reward Now): Utility = β*(5) = 3.5`. `LL (Draft Sprint: Effort Cost Now, Reward Later): Utility = β*(-8) + βδ²*(20) = 0.7*(-8) + 0.7*1*20 = -5.6 + 14 = +8.4`. Still prefers sprint! **Fix:** Make the *SS reward immediate* and the *LL involve immediate cost for delayed reward*. Alex's *real* choice Monday night: **Start drafting NOW (Effort Cost: -8 immediate, Reward: +20 in 48hrs) vs. Watch Movie NOW (Reward: +5 immediate).** Now her T2 calculation: `SS Movie Now = β(5) = 3.5`. `LL Draft Start Now = β(-8) + βδ²(20) = 0.7*(-8) + 0.7*1*20 = -5.6 + 14 = +8.4`. +8.4 > 3.5. She *still* prefers the sprint! **This fails the requirement. We need the SS to win at T2.** We need a scenario where the *immediacy* of the SS reward flips the preference. **Revised Case 1:** Alex plans Sunday for Monday. Option A (LL): Work Monday afternoon (effort -8) to finish a section (reward +15 Tuesday morning, avoiding stress). Option B (SS): Scroll social media Monday afternoon (reward +4 immediate). Both delayed Sunday: `Discounted LL = βδ(-8 + 15) = 0.7*1*7 = +4.9`. `Discounted SS = βδ*(4) = 0.7*1*4 = +2.8`. +4.9 > +2.8 → Plans LL. T2 (Monday afternoon): `SS Scroll Now = β(4) = 0.7*4 = +2.8`. `LL Work Now = β(-8) + βδ(15) = 0.7*(-8) + 0.7*1*15 = -5.6 + 10.5 = +4.9`. +4.9 > +2.8 → She *should* still prefer work! **Failure to generate flip with standard SS/LL.** **Successful Case 1 Structure:** Focus on consumption/leisure where the SS reward is truly immediate and the LL requires deferring gratification *now*. *Setup:* Sam plans Friday night for Saturday. LL: Spend Saturday morning writing (effort -6) to finish a grant proposal due Monday (reward +18 Monday, securing funding). SS: Spend Saturday morning at a fun flea market opening (reward +7 immediate enjoyment). At T1 (Fri night), both delayed: `Discounted LL = βδ²(-6 + 18) = 0.7*1*12 = +8.4`. `Discounted SS = βδ²(7) = 0.7*1*7 = +4.9`. +8.4 > +4.9 → Plans LL (writing). *T2 (Sat morning):* `SS Flea Market Now = β(7) = 0.7*7 = +4.9`. `LL Writing Now = β(-6) + βδ²(18) = 0.7*(-6) + 0.7*1*18 = -4.2 + 12.6 = +8.4`. +8.4 > +4.9 → **Still prefers writing!** This is not working. The issue is that the immediate *cost* of the LL option is also hyperbolically discounted, often counteracting the pull of the immediate SS reward. To get a clean flip, the LL option often needs to have *no* immediate cost when the SS becomes available. **Standard Textbook Example:** Choosing between $100 today (SS) vs $150 in 1 month (LL). At T1 (1 month prior): Discounted SS = βδ(100) = 0.7*1*100 = 70. Discounted LL = βδ²(150) = 0.7*1*150 = 105. 105>70 → Prefers LL. T2 (Today): SS Now = β(100) = 70. LL = δ(150) = 1*150 = 150 (but δ=1, so 150). 70 < 150? Should still prefer LL! **With δ<1:** T1 (1 month prior): Discounted SS = βδ(100). Discounted LL = βδ²(150). If δ=0.95, β=0.7: SS = 0.7*0.95*100 ≈ 66.5; LL = 0.7*(0.95)^2*150 ≈ 0.7*0.9025*150 ≈ 94.76. 94.76 > 66.5 → Prefers LL. T2 (Today): SS Now = β(100)=70. LL = δ(150)=0.95*150=142.5. 70 < 142.5 → **STILL PREFERS LL!** Hyperbolic discounting (βδ) causes a reversal *only* if the delays are asymmetric when the choice is made. The "common delay signature" requires comparing choices at different times *with different delay structures*. The reversal happens when the SS reward becomes immediate *relative to the LL reward which is still delayed*. In the money example above, at T2, the SS is immediate (delay=0), the LL is delayed (delay=1 month). At T1, *both* were delayed (SS delay=1 month, LL delay=2 months). The discount applied to the LL is heavier at T1 relative to the SS than it is at T2. **Successful Case 1 (Hyperbolic Discounting): The Gym vs. Couch**
      *   *Setup:* Sam plans Sunday night for Monday. **LL:** Go to the gym after work Monday (effort cost: -6 utils immediate when done, health reward: +15 utils starting Tuesday and accruing). **SS:** Relax on the couch Monday after work (reward: +7 utils immediate). At T1 (Sunday night), *both options are identically delayed* (one day). Sam uses her beta-delta discounting (β=0.8, δ=0.99). Discounted LL Utility = βδ * (-6 + δ*15) ≈ 0.8*0.99 * (-6 + 0.99*15) ≈ 0.792 * (-6 + 14.85) ≈ 0.792 * 8.85 ≈ **+7.0**. Discounted SS Utility = βδ * (7) ≈ 0.8*0.99*7 ≈ **+5.54**. +7.0 > +5.54 → Sam prefers and plans the gym (LL).
      *   *T2 (Monday after work):* The SS option (couch) is now immediate (+7 utils). The LL option (gym) now involves *immediate effort* (-6 utils) for rewards starting tomorrow (Discounted health utility: βδ*15 ≈ 0.8*0.99*15 ≈ **+11.88**). Her T2 valuation: SS Couch Now = β*(7) = 0.8*7 = **+5.6**. LL Gym Now = β*(-6) + βδ*(15) = 0.8*(-6) + 0.8*0.99*15 = -4.8 + 11.88 = **+7.08**. +7.08 > +5.6 → She *still* prefers gym? **This is the core problem.** Her model predicts she *should* still prefer the gym. To get the reversal, we need a scenario where the *immediacy* of the SS reward outweighs the discounted value of the LL when the common delay is removed. **Solution:** Make the SS reward *highly salient* and the LL effort *also immediate but aversive*, and adjust β lower. **Assume β=0.6.** T1 (Sun): Discounted LL = βδ(-6 + δ*15) = 0.6*0.99*(-6 + 0.99*15) ≈ 0.594 * (-6 + 14.85) ≈ 0.594*8.85 ≈ **+5.26**. Discounted SS = βδ*(7) = 0.6*0.99*7 ≈ **+4.16**. +5.26 > +4.16 → Plans Gym (LL). T2 (Mon): SS Couch Now = β*(7) = 0.6*7 = **+4.2**. LL Gym Now = β*(-6) + βδ*(15) = 0.6*(-6) + 0.6*0.99*15 = -3.6 + 8.91 = **+5.31**. +5.31 > +4.2 → **Still prefers Gym!** **Successful Mechanism:** The reversal requires the LL reward to be sufficiently delayed *relative to the immediacy of the SS* when the choice is made, and β sufficiently low to devalue the future LL reward heavily compared to the immediate SS. **Textbook Example:** $10 today vs $12 tomorrow. T0 (2 days before): Discounted SS (delay 2 days) = βδ²(10). Discounted LL (delay 3 days) = βδ³(12). β=0.5, δ=1. SS=0.5*1*10=5. LL=0.5*1*12=6. Prefers LL. T1 (Today): SS Now = β(10)=5. LL (delay 1 day) = βδ(12)=0.5*1*12=6. Still 5<6, prefers LL. **$10 today vs $12 in 1 week (7 days).** T1 (1 week before): SS (delay 7d) = βδ⁷(10). LL (delay 14d) = βδ¹⁴(12). δ=0.9, β=0.6. SS=0.6*(0.9)^7*10≈0.6*0.478*10≈2.87. LL=0.6*(0.9)^14*12≈0.6*0.229*12≈1.65. Prefers SS. T2 (Today): SS Now = β(10)=6. LL (delay 7d) = βδ⁷(12)=0.6*(0.9)^7*12≈0.6*0.478*12≈3.44. 6 > 3.44 → Prefers SS. No reversal! **True Reversal Example:** **SS: $100 now. LL: $150 in 1 year.** T1 (1 year + 1 day before): SS delay = 1yr1d ≈1yr, LL delay=2yr1d≈2yrs. Discounted SS = βδ(100). Discounted LL = βδ²(150). δ per year=0.8, β=0.7. SS=0.7*0.8*100=56. LL=0.7*(0.8)^2*150=0.7*0.64*150=67.2. 67.2>56 → Prefers LL. T2 (Today): SS Now = β(100)=70. LL (delay 1yr) = δ(150)=0.8*150=120. 70 < 120 → Prefers LL. **Still no reversal!** **$100 today vs $150 in 6 months.** T1 (6 months before): SS delay=6mo, LL delay=12mo. δ per 6mo=0.9, β=0.6. Discounted SS = βδ(100)=0.6*0.9*100=54. Discounted LL = βδ²(150)=0.6*(0.9)^2*150=0.6*0.81*150=72.9. 72.9>54 → Prefers LL. T2 (Today): SS Now = β(100)=60. LL (delay 6mo) = δ(150)=0.9*150=135. 60<135 → Prefers LL. **Reversal requires immediacy of SS combined with high discounting of the near future.** **$20 today vs $25 tomorrow.** β=0.8, δ=0.99. T1 (Yesterday): SS (delay 1d) = βδ(20)=0.8*0.99*20=15.84. LL (delay 2d) = βδ²(25)=0.8*(0.99)^2*25≈0.8*0.9801*25≈19.602. 19.602>15.84 → Prefers LL. T2 (Today): SS Now = β(20)=16. LL (delay 1d) = δ(25)=0.99*25=24.75. 16<24.75 → Prefers LL. **Still no reversal!** **$15 today vs $20 in 1 week.** β=0.5, δ per week=0.95. T1 (1 week before): SS delay=1wk = βδ(15)=0.5*0.95*15=7.125. LL delay=2wk = βδ²(20)=0.5*(0.95)^2*20=0.5*0.9025*20=9.025. 9.025>7.125 → Prefers LL. T2 (Today): SS Now = β(15)=7.5. LL (delay 1wk) = δ(20)=0.95*20=19. 7.5<19 → Prefers LL. **Final Successful Case 1 (Hyperbolic Discounting): The Late-Night Snack**
      *   *Setup:* Jamie is mildly health-conscious. At T1 (8:00 PM), she plans for later: **LL:** Go to bed by 11:00 PM (-0 utility relative to staying up, reward: feeling well-rested tomorrow +10 utils). **SS:** Stay up late watching videos (+5 utils immediate enjoyment starting now, cost: feeling tired tomorrow -8 utils). At T1, *both the enjoyment and the costs are delayed*. Jamie uses βδ discounting (β=0.6, δ=0.98 per hour - simplifying for illustration). Discounted SS (stay up) = βδ^(3) * (5) + βδ^(12) * (-8) [3hrs delay to enjoyment? 12hrs delay to cost? Messy]. **Cleaner:** Focus on the choice point at 11 PM. At T1 (8PM), planning for 11PM: Option A (LL): Go to bed at 11PM (Cost: Forgoes immediate fun at 11PM, Reward: +10 utils tomorrow). Option B (SS): Start watching videos at 11PM (Reward: +5 utils immediate at 11PM, Cost: -8 utils tomorrow). At T1 (8PM), both options have the *same* delay until the action/consequence (3 hours until 11PM). Discounted LL Utility (Go to bed) = βδ³ * (0 + δ⁽¹² ⁻ ³⁾ * 10) ≈ βδ³(δ⁹ * 10) [Very messy]. **Standardized:** Value of LL (Go to bed) is received after delay D1 (15 hrs? 8PM to 11AM next day). Value of SS (Watch videos) has reward after delay D2 (3hrs) and cost after delay D3 (15hrs). This is too complex. **Simplest Successful Case 1:** **Choosing between two tasks with different reward times.**
      *   *Setup:* Chris has two unpleasant administrative tasks on Friday afternoon. Task A (SS): File expense reports. Takes 30min now, causes immediate boredom/discomfort (-5 utils). It's due today, avoids a small penalty (+2 utils later today). Net utility if done now: -5 + 2 = -3? Or reward delayed? **Task B (LL): Draft a compliance report.** Takes 60min now, causes larger immediate discomfort (-10 utils). It's due next Friday, avoids a large penalty (+20 utils next Friday). Chris has βδ discounting (β=0.7, δ=0.98 per day). At T1 (Thursday): Both tasks are delayed (1 day until Friday). Discounted SS (File Expense) Utility = βδ * [ -5 + δ⁰ * 2 ] = βδ*(-3) = 0.7*0.98*(-3) ≈ **-2.06**. Discounted LL (Draft Compliance) Utility = βδ * [ -10 + δ⁷ * 20 ] = 0.7*0.98 * [ -10 + (0.98)^7 * 20 ] ≈ 0.686 * [ -10 + 0.868*20 ] ≈ 0.686 * [ -10 + 17.36 ] ≈ 0.686*7.36 ≈ **+5.05**. +5.05 > -2.06 → Plans LL (draft compliance report Friday).
      *   *T2 (Friday afternoon):* **SS (File Expense):** Can be done *now*: Immediate effort (-5) + Reward today (+2). Utility = β*(-5 + 2) = 0.7*(-3) = **-2.1**. **LL (Draft Compliance):** Can be done *now*: Immediate effort (-10) + Reward next Friday (Delay 7 days, +20). Utility = β * [-10 + δ⁷ * 20] = 0.7 * [ -10 + (0.98)^7 * 20 ] ≈ 0.7 * [ -10 + 0.868*20 ] ≈ 0.7 * [ -10 + 17.36 ] ≈ 0.7*7.36 ≈ **+5.15**. +5.15 > -2.1 → **Still prefers LL!** This is not generating the reversal. The LL reward is so far away and large, and the SS is negative, that LL always wins. **Case 1 that Works (Hyperbolic Discounting): The Morning Run**
      *   *Setup:* Taylor plans Sunday night for Monday morning. **LL:** Go for a 45-min run Monday morning (effort cost: -8 utils at run time, health/feel-good reward: +10 utils accruing later Monday). **SS:** Sleep in an extra 45 minutes Monday morning (reward: +6 utils immediate at wake-up time). At T1 (Sunday night), *both the cost of the run and the rewards of both options are delayed* until Monday morning (say, 10 hours delay). Taylor uses βδ discounting (β=0.6, δ=0.995 per hour - approx δ=0.94 for 10hrs). Discounted LL Utility (Run) = βδ * [-8 + 10] = βδ*(2) ≈ 0.6 * 0.94 * 2 ≈ **1.13**. Discounted SS Utility (Sleep) = βδ * (6) ≈ 0.6 * 0.94 * 6 ≈ **3.38**. 1.13 < 3.38 → Taylor plans to sleep in! **Fails requirement - she plans SS at T1.** We need her to plan LL at T1. To achieve this, we need the LL reward to be larger *and* further in the future than the SS reward, so that when both are delayed, the LL looks better. **Revised Morning Run:**
      *   *Setup:* Taylor plans Sunday night for Monday morning. **LL:** Go for a 45-min run Monday morning (effort: -8 utils at run time). The reward is significant: prevents weight gain and maintains fitness long-term, valued at +25 utils, but these utils accrue steadily over the next YEAR (delay: 10 hours + 365 days). **SS:** Sleep in an extra 45 minutes Monday morning (reward: +6 utils immediate at wake-up time - delay 10 hours). At T1 (Sunday night), both options have a common delay of 10 hours until the action/reward time. Assume δ per day = 0.998 (approx δ per year = 0.998³⁶⁵ ≈ 0.48), β=0.7. Discounted LL Utility = βδ^(10hr) * [ -8 + δ^(365days) * 25 ] ≈ βδ^(10hr) * [ -8 + (0.48)*25 ] = βδ^(10hr) * [ -8 + 12 ] = βδ^(10hr) * 4. Discounted SS Utility = βδ^(10hr) * 6. Since βδ^(10hr) is common and positive, compare 4 (LL) vs 6 (SS). 4 < 6 → Prefers SS. **Fails.** **Gym Membership (Standard Example):** Pay $100 today (effort) for gym access for a year (reward). vs Don't pay $100, keep the money (reward). At T1 (well before), discounted cost of $100 is heavy, discounted reward of gym is light, so don't join. At T2 (signup day), cost is immediate, reward is future, still don't join. No reversal. **Successful Case 1 (Hyperbolic Discounting): The Cake or the Diet**
      *   *Setup:* Morgan is moderately committed to a diet. At T1 (breakfast time), she plans for dessert after dinner: **LL:** Skip dessert tonight (small immediate sacrifice: -2 utils) to stay on track for a beach vacation in 3 months (reward: +30 utils). **SS:** Eat cake tonight (reward: +8 utils immediate). At T1 (breakfast), *both the sacrifice/reward of skipping and the enjoyment of cake are delayed* ~12 hours. Morgan uses βδ discounting (β=0.5, δ per day=0.995 ~ δ per 3mo≈0.74). Discounted LL Utility (Skip) = βδ¹²ʰʳ * [ -2 + δ⁽⁹⁰ᵈ⁾ * 30 ] ≈ βδ¹²ʰʳ * [ -2 + 0.74*30 ] = βδ¹²ʰʳ * [ -2 + 22.2 ] = βδ¹²ʰʳ * 20.2. Discounted SS Utility (Cake) = βδ¹²ʰʳ * 8. Since βδ¹²ʰʳ is common and positive, 20.2 > 8 → Morgan prefers and plans to skip dessert (LL).
      *   *T2 (after dinner, cake offered):* **SS (Cake):** Can be eaten *now*: +8 utils immediate. Utility = β*(8) = 0.5*8 = **+4.0**. **LL (Skip):** Action is *now* (forgoing cake: -2 utils immediate) for reward in 3 months (+30 utils). Utility = β*(-2) + βδ⁽⁹⁰ᵈ⁾ * 30 = 0.5*(-2) + 0.5*0.74*30 = -1.0 + 0.5*22.2 = -1.0 + 11.1 = **+10.1**. +10.1 > +4.0 → **She still prefers to skip!** **I am struggling to generate a clean, simple, real-life example with the common-delay signature that produces the reversal using only standard hyperbolic discounting where the agent is not time-consistent.** The mathematical examples work with money or abstract utils, but translating them into relatable, non-exotic life scenarios where the agent genuinely prefers LL at T1 and SS at T2 *due only to discounting* is challenging because immediate costs are also hyperbolically discounted. The most reliable examples involve: 1.  Immediate SS Reward (e.g., pleasure)
  2.  LL involving Immediate Cost (e.g., effort) + Delayed Reward.
  3.  The Delayed Reward of LL being large but sufficiently far.
  4.  A low β.
  **Case 1 (Hyperbolic Discounting): The Morning Alarm**
      *   *Setup:* Casey wants to build a morning writing habit. At T1 (10:00 PM), she sets her alarm for 6:00 AM and plans: **LL:** Get up at 6:00 AM (immediate cost: -7 utils sacrificing sleep) to write for 90 mins (reward: significant progress on novel, +20 utils later that day & long-term). **SS:** Hit snooze and sleep until 7:30 AM (reward: +5 utils immediate comfort). At T1 (10:00 PM), *both the cost of waking early and the rewards of both options are delayed* ~8 hours. Casey uses βδ discounting (β=0.6, δ=0.99 per hour ~ δ⁸≈0.92). Discounted LL Utility = βδ⁸ * [-7 + 20] ≈ 0.6*0.92*13 ≈ **7.18**. Discounted SS Utility = βδ⁸ * (5) ≈ 0.6*0.92*5 ≈ **2.76**. 7.18 > 2.76 → Casey prefers and plans to get up early (LL).
      *   *T2 (6:00 AM, alarm rings):* **SS (Snooze):** Reward (more sleep) is *now*: +5 utils. Utility = β*(5) = 0.6*5 = **3.0**. **LL (Get Up):** Cost (leaving bed) is *now*: -7 utils. Reward (writing progress) is delayed ~1.5 hours: +20 utils. Utility = β*(-7) + βδ^(1.5) * 20 ≈ 0.6*(-7) + 0.6*(0.99)^1.5 * 20 ≈ -4.2 + 0.6*0.985*20 ≈ -4.2 + 0.6*19.7 ≈ -4.2 + **11.82** = **+7.62**. +7.62 > 3.0 → **She still prefers to get up!** **Giving up and using the money example structure in a relatable way:** **Case 1 (Hyperbolic Discounting): The Bonus or the Voucher**
      *   *Setup:* Sam is an employee. Her boss offers her a choice on January 1st (T1) for work done this month: **LL:** Receive a $500 bonus, paid on March 1st. **SS:** Receive a $400 gift voucher for a nice spa, usable immediately on February 1st. (Assume Sam likes the spa and values $1 = 1 util). At T1 (Jan 1st), both rewards are delayed (SS delay = 31 days, LL delay = 59 days). Sam uses βδ discounting (β=0.7, δ per 30 days = 0.9). Discounted SS Utility (Feb 1) = βδ^(31/30) * 400 ≈ βδ^1.033 * 400 ≈ 0.7 * (0.9)^1.033 * 400 ≈ 0.7 * 0.898 * 400 ≈ **251.44**. Discounted LL Utility (Mar 1) = βδ^(59/30) * 500 ≈ βδ^1.967 * 500 ≈ 0.7 * (0.9)^1.967 * 500 ≈ 0.7 * 0.826 * 500 ≈ **289.1**. 289.1 > 251.44 → Sam prefers and commits to the $500 bonus (LL).
