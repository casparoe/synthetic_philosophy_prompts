prompt: |-
  I'm a journalist working on a piece about how scientific institutions police truthfulness in public communication, and I need help with a prediction — and, more than that, with working out what the institution actually believes.

  The body I'm writing about is a national academy's standing committee on the public communication of science. It hears complaints about members' public statements and issues anonymized findings on whether a statement breached the duty of truthfulness, graded by seriousness. I have the gist of its last five published rulings. I've anonymized the institution and altered identifying details, and there is nothing to look up: I want the conceptual work, not the docket.

  Its precedents, as I understand them:

  One. A clinical researcher said on a broadcast morning show that his drug cut deaths by a third, when the trial's mortality result was null and he had the figures in front of him. Breach, unanimous, top grade.

  Two. Asked at a press conference whether her institute took money from a pesticide manufacturer, a toxicologist replied that the study under discussion was funded in full by the national research council. That was true, and the institute separately held an unrestricted industry gift. The committee found a breach in the same grade as the first case, reasoning in substance that arranging for a true sentence to be heard as a false one differs from asserting a falsehood only in technique. This is the ruling in which the committee appeared to collapse the lying-versus-misleading distinction for cases of designed misleading — what some writers call paltering.

  Three. At a specialist conference session that reporters also attended, a physicist stated a result with a hedge; a journalist cut the hedge and filed a story asserting certainty. She had anticipated that this might happen and did nothing to prevent it. No breach. The substance of the reasoning was that the duty is calibrated to the audience the speaker addressed, and that it does not extend to preventing other people's errors, however cheaply they might have been prevented.

  Four. In a newspaper op-ed written for a general audience, a geneticist used a sentence that was literally true under its technical reading but that the committee found most non-specialist readers would take to assert a considerably stronger and false claim; a true and jargon-free alternative was available to her. Breach, one grade below the first two. The committee expressly declined to find that she had wanted the false reading: in substance, choosing to address a lay audience brings with it a duty about formulation, and the committee has never required proof of intent to deceive.

  Five. A group leader's press office issued a release containing a false claim that he had neither drafted nor seen. After he learned of it he left it standing on the press office site and then featured a link to it on his group's own page. Breach, but the committee limited the finding to the featuring of the link, which it treated as adoption; the bare failure to seek a correction was found not to be a breach, consistently with the third case, with two members dissenting on the ground that this punished an omission.

  Now the pending case, which is why I'm writing to you.

  The researcher is a climate scientist whose group has published regional heat-mortality projections: a central estimate of roughly a fifteen percent increase, with an uncertainty range running from a small decrease to something close to a doubling. Her university's news office runs every release through an automated summarizer that generates the plain-language one-line headline, and the tool is known to strip hedges and quantifiers: in something like four cases out of five it converts a hedged central estimate into a flat assertion. She drafted roughly a dozen versions of her summary sentence and ran each through the tool. Two of them produced hedged headlines, which she judged clumsy; she kept the one that produced the headline Heat deaths to double in the region by 2050. Her own sentence, which appears verbatim in the release one click below that headline, is true and properly hedged. She did not write, preview, or approve the headline, and she could not have predicted it with certainty. Her defence is that she was optimising for readability, that she asserted nothing false to anyone, and that the tool is the news office's instrument and the news office's problem. The file also notes that she later saw the published headline and neither requested a correction — a process she has used before — nor amplified it.

  What I want from you:

  Predict the ruling, and state the rule the committee is implicitly running if it rules that way. Then set out the other rules that fit the five precedents at least as well, and say what each of them predicts here: a rule turning on whether the speaker designed the false uptake, a rule turning on fit between formulation and the audience addressed, a rule turning on whose error it is, and any rule I haven't listed that you think the record supports. Tell me which of the five precedents is the closest analog and which of them you think is doing the least work in its own rationale.

  Then give me the variant of this case that would best separate the surviving rules — the further case I should watch for, or put to the chair — and say what the committee's answer to it would tell us. Alongside that, I want your view on whether the lying-versus-misleading distinction is doing any real work anywhere in this record, or whether the operative axes are other ones entirely: design versus mere foresight, the audience addressed versus whoever ends up reading, authoring a falsehood versus enabling one. There is an argument I keep turning over, which is that the machine case is not really a lying case or a misleading case but a third thing, in which a speaker gets the causal effect of a false assertion while keeping the deniability of having said nothing false, and that this is worse than either. Tell me whether that argument survives contact with the committee's own reasoning.

  Finally: if the committee wants to be consistent with itself, what should it decide, and what principle would it be adopting either way? I have an interview with the chair, so tell me as well what single question would most quickly reveal which of the candidate rules the committee actually runs.
reasoning: |-
  Hmm, the user is a journalist working on a piece about scientific institutions and truthfulness in public communication. They've presented a detailed scenario involving a national academy's committee that handles complaints about members' public statements, along with five anonymized precedents and one pending case about a climate scientist and an automated headline generator. 

  The journalist wants me to predict the committee's ruling on this pending case, analyze the implicit rules from precedents, identify which precedent is most analogous, and suggest hypothetical cases to test the committee's principles. They're also interested in whether the lying-versus-misleading distinction matters here or if other factors like design, audience, and causality are more important.

  First, I need to carefully unpack those precedents. Case 1 is straightforward deception - stating a false fact. Case 2 is interesting because it collapses lying vs misleading for "designed misleading" (paltering). Case 3 establishes that speakers aren't responsible for others' errors. Case 4 introduces audience-appropriate formulation duties without requiring intent. Case 5 shows adoption matters more than original authorship.

  For the pending case: The climate scientist tested multiple phrasings in a tool known to strip hedges, chose one yielding a false headline (though her actual text was accurate), and didn't correct it later. It feels like Case 2 (paltering) and Case 4 (audience formulation duty) are most relevant. She technically didn't write the false headline, but she engineered the conditions for it. 

  The key tension is between her defense (it's the tool's fault) and the committee's apparent philosophy that scientists must actively prevent foreseeable misinterpretation, especially when addressing lay audiences. Her later inaction after seeing the headline might sway them too, referencing Case 5's "adoption" logic.

  I think they'll rule "breach" - probably grade 2 (like Case 4). The implicit rule: Scientists bear responsibility for foreseeable distortions when using tools they know to be flawed for lay communication, especially if they select formulations that trigger those distortions. 

  Alternative rules worth considering: 
  - A "design" rule (breach only if distortion was intended) would likely absolve her since she didn't write the headline. 
  - A "formulation-audience fit" rule (from Case 4) would find breach because she failed to adapt to lay readers. 
  - An "error ownership" rule (from Case 3) might not find breach since the tool/news office caused the error. 

  Case 2 (paltering) is the closest analog - both involve creating conditions for others to draw false conclusions. Case 3 is doing the least work since it's about third-party errors, not self-created risks.

  For a variant case to test boundaries: What if she used the tool unknowingly? That would separate "foreseeability" from "design." I suspect the committee would still find breach if she should have known, given their duty-of-care approach. 

  On lying vs misleading: The distinction seems irrelevant here. Cases 2 and 4 show the committee cares about effects (false public belief) more than technical truthfulness. The real axes are foreseeability, audience vulnerability, and causal contribution. That "third thing" argument (getting false effects with deniability) actually fits their philosophy - Case 2 treated paltering as equivalent to lying.

  For consistency, they should find breach. The principle: Scientists must safeguard against foreseeable distortions in lay communication channels they choose to use. 

  Best question for the chair: "In borderline cases, does your duty of truthfulness require scientists to avoid foreseeable false interpretations by non-expert audiences, even when their literal words are accurate?" A "yes" confirms their preventive duty ethos.
answer: |-
  Based on the committee's precedents, here's a systematic analysis of the pending case and the committee's likely reasoning:

  ### Prediction & Implicit Rule
  - **Prediction:** Breach (Grade 2, consistent with Case 4)  
  - **Implicit Rule:** *"Scientists bear a duty to prevent reasonably foreseeable and materially false public interpretations of their work when addressing non-expert audiences, even if they do not directly assert falsehoods. This includes avoiding tools or formulations known to distort meaning, where alternatives exist."*  
    **Why:**  
    - The scientist knew the tool stripped hedges in 80% of cases (foreseeability matches Case 4's "lay audience" duty).  
    - She actively tested formulations and selected one triggering a false headline, despite having hedged alternatives (parallel to Case 2's "designed misleading" and Case 4's failure in formulation).  
    - Her later inaction after seeing the headline mirrors Case 5's "adoption" logic (featuring the link = endorsing the distortion).  

  ---

  ### Alternative Rules & Predictions
  1. **Rule: "Design of False Uptake" (Intentional Manipulation)**  
     - *Fit with Precedents:* Strong (Cases 1, 2, 4).  
     - *Prediction here:* **No breach.** She didn't *design* the headline; the tool’s output was probabilistic. Case 2 required active paltering; here, distortion was indirect.  

  2. **Rule: "Audience-Formulation Fit" (Duty to Match Audience)**  
     - *Fit with Precedents:* Strongest (Cases 1, 3, 4, 5).  
     - *Prediction here:* **Breach.** She addressed lay audiences via a tool known to mislead non-experts (Case 4) and failed to ensure formulation fidelity (Case 3’s "duty calibrated to audience" inverted).  

  3. **Rule: "Ownership of Error" (Liability Only for One’s Own Acts)**  
     - *Fit with Precedents:* Moderate (Cases 3, 5).  
     - *Prediction here:* **No breach.** The error was the tool’s/news office’s (Case 3: no duty to prevent others' errors). Her link-sharing might be "adoption" (Case 5), but dissent there shows ambiguity.  

  4. **Rule: "Causal Contribution" (Liability for Foreseeable Outcomes)**  
     - *Fit with Precedents:* Best overall (Cases 2, 4, 5).  
     - *Prediction here:* **Breach.** Her choices foreseeably caused false public uptake (Case 2’s paltering logic; Case 4’s neglect of lay interpretation).  

  ---

  ### Precedent Analysis
  - **Closest Analog:** **Case 4** (Geneticist’s op-ed). Both involve technically true statements warped for lay audiences, with foreseeable misreading and alternatives available.  
  - **Least Impactful Rationale:** **Case 3** (Journalist cutting hedge). Its narrow "no duty for others' errors" is overridden by Cases 4/5, where the scientist’s own choices *enabled* the error.  

  ---

  ### Critical Variant Case to Separate Rules  
  **Scenario:** *A scientist uses the same tool for a press release, unaware it strips hedges. The headline is false. She later sees it but doesn’t correct it.*  
  - **Why it Separates Rules:**  
    - **Design Rule:** No breach (no intent).  
    - **Causal Rule:** Breach only if foreseeability exists (did she *should* have known?).  
    - **Audience-Fit Rule:** Breach (duty includes vetting tools for lay audiences).  
    - **Error Ownership:** No breach (tool’s error; no adoption if she doesn’t amplify).  
  - **Committee’s Likely Answer:** Breach if foreseeability is imputed (e.g., the tool’s flaw was widely known). This would confirm their focus on **preventive duties to non-expert audiences**.  

  ---

  ### Lying vs. Misleading: Is the Distinction Relevant?  
  **No.** The committee’s record shows:  
  - **Paltering = Lying** (Case 2 explicitly equates them).  
  - **Negligent Formulation = Breach** (Case 4 requires no intent).  
  - **Operative Axes:**  
    - **Foreseeability & Audience Vulnerability** (Cases 3, 4, 5).  
    - **Causal Contribution** (Cases 2, 4, 5: "enabling" falsehoods via tools/inaction).  
    - **Adoption/Endorsement** (Case 5’s link-sharing).  

  Your "third thing" argument **(causal effect + deniability)** aligns perfectly with the committee’s reasoning:  
  - Case 2 treats paltering as "worse than lying" due to its disguised falsity.  
  - Case 4 penalizes negligent formulation enabling false uptake.  
  - Case 5 condemns passive endorsement.  
  **Verdict:** This argument *survives and strengthens* the committee's stance. The climate scientist’s actions epitomize this "third thing."  

  ---

  ### Consistency & Principle  
  - **What the Committee Should Do:** Find a **Grade 2 breach** to uphold:  
    *"Scientists must actively prevent foreseeable public distortion of their work when engaging non-expert audiences. Using known-flawed tools and selecting distortion-prone formulations breaches this duty, especially when alternatives exist."*  
  - **Core Principle:** **Preventive responsibility for public truthfulness** > Literal truthfulness.  

  --- 

  ### Key Question for the Chair  
  **"In your rulings, does the duty of truthfulness require scientists to avoid *foreseeable* false interpretations by non-expert audiences—even if their own words are technically true—and if so, does that extend to choosing communication tools?"**  
  - **Why it Works:**  
    - A "yes" confirms **preventive duties** (Cases 2, 4) and **causal liability** (pending case).  
    - A "no" suggests the committee prioritizes **explicit authorship** (Cases 1, 3) over outcomes.  

  This cuts to the heart of the committee's philosophy: whether public truthfulness is about *accountability for effects* or merely *personal honesty*. The precedents point strongly to the former. Use this to frame your interview.
