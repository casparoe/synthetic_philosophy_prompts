  Hmm, their notes are impressively nuanced. They've structured it in four moves: distinguishing meanings of "code," proposing a swap test thought experiment, addressing complications like alternative splicing, and offering a constructive alternative. Their doubts show intellectual humility—they're aware they might be reinventing existing philosophy positions and worry about their metaphors being hypocritical.

