answer: |-
  Below is a structured set of desiderata for evaluating animal-welfare impacts in your decision-making context. Each requirement is justified by a specific case from your scenario, marked for negotiability, and assessed for confidence. The scorecard at the end evaluates common approaches against these criteria.

  ---

  ### **Desiderata for Animal-Welfare Impact Comparison**
  1. **Functional Unit & Harm Currency**  
     - *Requirement*: The method must explicitly state its functional unit (e.g., per meal, per gram of protein) and harm currency (e.g., deaths, suffering-hours, preference-frustration). If rankings flip when units change, the method must:  
       (a) Disclose this sensitivity upfront,  
       (b) Provide a defensible rationale for its chosen unit.  
     - *Case*: Comparing soy-fed hens (high eggs/hen but crop deaths) vs. grass-fed beef (low deaths/kg but high land use) could invert rankings under per-protein vs. per-hectare units.  
     - *Negotiability*: **Non-negotiable** (flipping without explanation invalidates comparisons).  
     - *Confidence*: High. Flipping rankings without transparency is scientifically indefensible.  

  2. **Counterfactual Baseline**  
     - *Requirement*: The method must define its counterfactual (e.g., "what happens if I don’t buy X?") and remain robust to baseline uncertainty. When data is inaccessible (e.g., supermarket restocking rules), it must:  
       (a) Default to a conservative, plausible baseline (e.g., no change in aggregate demand),  
       (b) Flag where conclusions depend on unverified assumptions.  
     - *Case*: Buying your neighbor’s steer quarter might displace no animals (if already slaughtered) or trigger restocking (if demand-responsive). Supermarket chicken may always be restocked.  
     - *Negotiability*: **Non-negotiable** (baseline errors distort causality).  
     - *Confidence*: Highest. Ignoring counterfactuals conflates correlation with responsibility.  

  3. **Crop Cultivation Harms**  
     - *Requirement*: The method must account for all *directly attributable* deaths from crop production (harvest machinery, pesticides, displacement). It may exclude background mortality (e.g., "animals who would have died anyway"). The accounting window must be bounded (e.g., one growing season).  
     - *Case*: Soy feed for your hens requires attributing deaths from the combine harvester in adjacent fields.  
     - *Negotiability*: **Negotiable** on scope (e.g., poisoning vs. displacement), but **non-negotiable** on inclusion.  
     - *Confidence*: Medium. "Directly attributable" is contestable (e.g., is habitat loss "direct"?), but excluding crop deaths entirely is omission bias.  

  4. **Joint Production Allocation**  
     - *Requirement*: For co-products (e.g., leather from beef, soy meal from oil), the method must avoid arbitrary allocations (e.g., mass-based splits). Instead, it should:  
       (a) Use system expansion (credit for displacing alternative products), or  
       (b) Attribute harms only to the *primary driver* of production.  
     - *Case*: Your steer quarter shares harms with leather buyers; soy feed shares harms with soy-oil consumers.  
     - *Negotiability*: **Non-negotiable** against arbitrary splits (e.g., economic allocation), **preference-based** for system expansion.  
     - *Confidence*: High for rejecting arbitrariness; medium for alternatives (system expansion needs data).  

  5. **Existence of Animals**  
     - *Requirement*: The method must treat existence as neutral (no "happy life" credit) unless it prevents a worse alternative (e.g., rescue hens avoiding slaughter). Benefits should only offset harms if existence directly reduces net suffering.  
     - *Case*: Your ex-commercial hens’ lives are arguably better than culling, but creating demand for new chicks is net harmful.  
     - *Negotiability*: **Negotiable** (e.g., deontologists vs. utilitarians debate this), but **non-negotiable** that it must be explicit.  
     - *Confidence*: Low. This is deeply philosophical; if evidence showed animals in systems *only* exist due to demand and have net-negative lives, I’d demote it.  

  6. **Inframarginal Cases**  
     - *Requirement*: The method must assign zero marginal harm to decisions that cannot alter outcomes (e.g., buying already-slaughtered beef, feeding existing hens).  
     - *Case*: Your quarter-steer is paid for; your hens exist regardless of their feed.  
     - *Negotiability*: **Non-negotiable** (else responsibility detaches from agency).  
     - *Confidence*: High. Failing here misattributes impacts.  

  ---

  ### **Key Insights**
  #### 1. **Most Debunked Requirement**:  
     **Counterfactual Baseline Sensitivity** dismantles common methods:  
     - Footprint tables (e.g., per-kg CO₂e) assume static baselines.  
     - Death counts ignore whether purchases trigger new production.  
     - Suffering metrics (e.g., "days of suffering per meal") still rely on "what if?" scenarios.  

  #### 2. **Methodological "Costumes"**:  
     - "Existence as benefit" is often a **preference of welfare-focused camps** (e.g., "happy cows").  
     - "Per-protein unit" is sometimes **passed off as objective** but reflects a health-priority bias.  

  #### 3. **Incompatible Pairs**:  
     - ✅ **Portability vs. Counterfactual Sensitivity**: **Genuine conflict**. Portable data (e.g., LCA databases) use industry averages, while your neighbor’s steer may have near-zero marginal impact. *Resolution*: Default to conservative baselines for portability, but note uncertainty.  
     - ❌ **Itemized Accounting vs. Joint Production**: **No inherent conflict**. System expansion avoids arbitrary allocations while allowing additive diets (e.g., credit soy meal for displacing chicken feed).  

  #### 4. **Weakest Desiderata**:  
     - **Existence Valuation**: Confidence is low. If all animals in industrial systems had lives worse than non-existence (debatable for layer hens), I’d drop "benefit" arguments entirely.  
     - **Crop Death Boundaries**: Confidence medium. If crop deaths were proven inseparable from background wildlife mortality, I’d narrow the scope to harvest-time kills only.  

  ---

  ### **Verdict**  
  **No existing method fully satisfies these criteria for household decisions**. Footprint tables lack counterfactual nuance; suffering metrics lack data; death counts ignore system dynamics. The closest is a **marginal, context-sensitive analysis** (e.g., your hens’ feed matters more than buying beef), but even this requires unavailable data (e.g., supermarket restocking rules).  

  ---

  ### **Scorecard of Common Approaches**  
  | **Approach**          | **Fatal Flaws per Desiderata**                                                                 | **Viability for You** |  
  |------------------------|------------------------------------------------------------------------------------------------|------------------------|  
  | **Footprint Tables**   | Ignores baselines (#2), inframarginal cases (#6), joint production (#4). Portable but misleading. | ❌ Useless            |  
  | **Death Counts**       | Neglects suffering (#1), crop deaths (#3), counterfactuals (#2). Arbitrary for joint products (#4). | ❌ Inadequate         |  
  | **Suffering Metrics**  | Requires unmeasurable data (#1, #3), still baseline-dependent (#2). Portable averages often false. | ❌ Unactionable       |  

  ---

  ### **Recommendation**  
  Prioritize decisions with **provably low marginal harm**:  
  1. **Keep your hens** (inframarginal existence; harm lies in feed).  
  2. **Source low-crop-death feed** (e.g., food waste, pasture).  
  3. **Buy the neighbor’s steer** *only* if it’s truly surplus (otherwise, supermarket chicken may have lower restocking elasticity).  
  Reject any ranking that ignores **your actual counterfactuals**. The honest answer may be that certainty is unattainable – but the desiderata expose why.
