prompt: |-
  I am in the fourth year of a philosophy PhD, and the chapter I am currently failing to write is about explanation in the social sciences — specifically about when it is legitimate to cite a social-level fact (a rate, a structure, a norm, an institution, a climate of opinion) as part of the explanation of what individuals do, as opposed to treating such facts as mere shorthand for a story about those individuals. My supervisor treats the question as closed in favour of some form of methodological individualism; a friend in the sociology department does network modelling and treats it as a pseudo-problem about levels of description. I do not want either of those answers. What I want is to stop flip-flopping: I notice that I permit some social-level explanations and gag at others, and I cannot say what the difference is. So please do not give me a literature survey, a reading list, or citations — I can find those myself. Give me the principle, stated precisely enough that I could apply it to a case we have not discussed, and tell me honestly which of my verdicts it cannot save.

  Here are my verdicts, as concretely as I can state them. (1) A modeller explains a city's residential sorting by giving each household a mild individual-level threshold — move if fewer than about a third of your immediate neighbours are like you — and showing that the macro pattern follows. Verdict: a paradigm of good explanation; nothing social-level does any causal work beyond the individuals' thresholds. (2) An urban economist explains rising house prices by the fall in average household size. Verdict: fine, but I want to say this is not an instance of the thing I am worried about at all: it is aggregative bookkeeping, arithmetic over individual-level facts, and calling it a social-level cause would be a category mistake. (3) A public-health paper explains low rates of walking to work in one district by the street-network layout: the grid has no through routes to the centre, so walking is infeasible for nearly every origin–destination pair. Nobody's beliefs or desires differ between the districts; what differs is what the built arrangement makes available. I call these *affordance explanations*, and my verdict is that they are fine. (4) A Durkheim-style explanation of a suicide-rate differential between two religious groups in terms of the weaker social integration of one of them. Verdict: I want to allow it — I would hate to have to call a century of social research confused — and yet I cannot produce the mechanism: I cannot point to the individuals whose integration was weaker and whose despair was thereby greater. (5) Hearts are there because pumping blood circulates oxygen. Verdict: no problem at all. (6) The punishment system has the shape it has because it maintains social solidarity. Verdict: I gag, even though it is the same sentence form as (5) — and note that I would stop gagging if a selection story were supplied, e.g. that polities whose punishment systems lost cohesion were conquered or replaced. (7) The spirit of the age turned against the regime; neoliberalism produced the rise in precarious work; the market decided. Verdict: I gag; these feel like redescription with a capital letter. (8) Investment in an industry falls because a published index crosses a threshold, when everyone knows that everyone else watches that index and everyone knows the others know it too. I call these *tracked variables* — social-level quantities that individuals respond to precisely because they are public and mutually known to be watched. Verdict: I allow this one, and I cannot say why it differs from (7). (9) The case I go back and forth on: a currency collapses because enough people expect it to collapse, where each person's expectation is largely a response to what they expect others to expect, and the object everyone is tracking is the aggregate outcome of everyone's own behaviour. I have argued myself into both corners on this and cannot settle.

  My tentative principle is a test of in-principle replaceability: a social-level explanation is in good standing if and only if there could in principle be an individual-level mechanism story — beliefs, desires, opportunities, and interactions — that would do the same explanatory work, where the story need not be known, filled in, or even statable in our current vocabulary; anything not so replaceable is either bookkeeping or mysticism. I suspect this is broken in both directions: it looks too permissive, since a determined theorist can always sketch a mechanism for the spirit of the age, and too restrictive, since neither the street layout in (3) nor the tracked index in (8) seems replaceable by a beliefs-and-desires story without loss of explanatory power. Please test it against my cases, then repair it or replace it. I would like: the resulting account stated clause by clause, each clause paired with the case that motivates it, including any clause you need only to save one verdict; its verdict on (9); its verdicts on at least two cases I have not listed, of which the first should be a network-topology explanation (a behaviour spreads because of the degree distribution of the contact network, or because a few weak ties bridge otherwise separate clusters — a structural property that no individual has beliefs about) and the second is yours to choose; and an honest statement of which of my verdicts the account cannot accommodate, with the trade-off made explicit — I would rather overturn one verdict than accept an ad hoc clause per case, but I want to see what the overturning costs. Finally, please flag anywhere I have misdescribed what one of these explanations is actually doing, i.e. anywhere two cases I have treated as the same shape are not. A thousand to fifteen hundred words is fine; precision matters more to me than coverage.
reasoning: |-
  Okay, let me tackle this user's problem. They're a fourth-year PhD student in philosophy struggling with when social-level explanations are legitimate in explaining individual behavior. They’ve provided concrete cases where they intuitively accept or reject such explanations but can’t articulate a consistent principle. Their supervisor favors methodological individualism, while their sociologist friend dismisses the issue as levels of description. The user wants a precise principle that explains their intuitions without resorting to literature surveys.

  First, I need to understand their verdicts on the nine cases. They accept threshold-based residential sorting (1), aggregative bookkeeping like household size affecting house prices (2), affordance explanations like street layouts (3), and tracked variables like published indices (8). They’re conflicted about Durkheim’s social integration (4) and currency collapse due to expectations (9), but reject functional explanations without selection (6) and vague concepts like "spirit of the age" (7). The heart example (5) is fine, but analogous social functionalism isn’t.

  Their tentative principle of replaceability by individual mechanisms seems flawed. It’s too permissive (allowing vague mechanisms for "spirit of the age") and too restrictive (affordances and tracked variables lose explanatory power when reduced). I need a better criterion.

  Looking for patterns: Cases they accept (1,2,3,8) involve clear constraints or information structures that don’t depend on individual attitudes toward the social fact itself. In contrast, rejected cases (6,7) involve teleology or reification. The conflict in (4) and (9) might stem from whether the social fact has emergent causal properties irreducible to individual intentional states.

  The key distinction seems to be between social facts as external constraints versus as aggregates requiring interpretation. Affordances (3) and tracked variables (8) create objective situations individuals respond to, whereas "social integration" (4) might be too vague without specifying how it materially constrains individuals. 

  I should propose a principle based on constraint realism: Social facts are explanatory when they create physically or informationally inescapable conditions. This accommodates affordances (street layouts physically constrain walking) and tracked variables (index creates mutual knowledge loop). It excludes reified concepts (7) and unsupported functionalism (6). For Durkheim (4), it would require showing how weak integration objectively restricts options or information flow.

  Testing against their unresolved cases: Network topology explanations (like weak ties) would be valid if the structure objectively channels information/contact. Currency collapse (9) is tricky—expectations might form a self-fulfilling loop akin to tracked variables, but only if the expectation mechanism is specified.

  The trade-off: This principle likely rejects Durkheim unless supplemented with constraint details. That’s acceptable per the user’s preference for coherence over saving every intuition. It also clarifies why some functional explanations (hearts) work (physical constraints) while others (punishment systems) don’t (lacking selection mechanism).

  Finally, I need to ensure precision: Stating the principle as necessary/sufficient conditions, applying it to new cases, and explicitly noting where the user’s verdicts must be revised (e.g., Durkheim only acceptable with mechanistic constraints).
answer: |-
  Here is a principle designed to capture your intuitions, built clause-by-clause from your verdicts, tested against your cases and new ones, with explicit trade-offs:

  **The Constraint-Realist Principle for Social Explanations:**

  A social-level fact (SLF) is legitimately cited in explaining individual behavior if and only if:

  1.  **Constraint Clause (Motivated by Case 3: Affordances):** The SLF constitutes an *objectively constraining condition* on the feasible set of actions, beliefs, or information available to individuals *independently of their specific attitudes towards that SLF itself*, OR
  2.  **Information-Loop Clause (Motivated by Case 8: Tracked Variables):** The SLF functions as a *publicly accessible, mutually known signal* within a strategic interaction, where individuals' actions are constitutively dependent on reacting to this shared signal *because* it coordinates expectations about others' actions, creating a self-reinforcing informational loop.

  **Additionally:**

  3.  **Non-Teleology Clause (Motivated by Case 6: Punishment System & Case 5: Hearts):** The explanation *must not* attribute causal efficacy to the *future beneficial consequences* of a pattern or institution for a social whole, *unless* a specific, plausible selection or reinforcement mechanism operating on individual actions/decisions is specified (e.g., market competition, institutional learning, evolutionary pressure). (Note: Case 5 satisfies this via natural selection on individuals/organisms; Case 6 without selection does not).
  4.  **Non-Reification Clause (Motivated by Case 7: Spirit of the Age):** The SLF *must not* be merely a reified aggregate label (a "capital letter") lacking specific, identifiable constraining properties (Clause 1) or a specific coordinating function within a strategic information loop (Clause 2). It must pick out a concrete structural property, informational state, or resource distribution.

  **Applying the Principle to Your Cases:**

  *   **(1) Residential Sorting (Threshold Model):** **Permitted (Constituent).** This is explicitly *not* relying on a social-level fact *doing* causal work. The explanation *is* the story about individuals. The pattern is a consequence. (Not an SLF explanation by your framing).
  *   **(2) Household Size & House Prices:** **Permitted (Constituent/Aggregate).** This is aggregative bookkeeping, as you note. The "fall in average household size" is a summary statistic of individual-level facts (household formation decisions). It doesn't *constrain* (Clause 1) or *coordinate* (Clause 2) in a way beyond the sum of its parts. It's arithmetic shorthand. (Not primarily an SLF *explanation of individual action*).
  *   **(3) Street Layout (Affordance):** **Permitted (Clause 1).** The street layout is an *objectively constraining condition* on feasible walking routes. It physically limits possibilities ("no through routes") regardless of any individual's beliefs *about the layout itself* as a social fact. It shrinks the feasible set.
  *   **(4) Durkheim/Social Integration:** **Problematic under this Principle.** "Weaker social integration" *might* imply constraints (e.g., fewer support networks, less reliable information flow - Clause 1) or altered coordination possibilities (Clause 2), but *as stated*, it is vague. It doesn't *specify* the constraining mechanism operating *on individuals*. It risks reification (Clause 4) or implicit teleology (Clause 3 - "integration" as a beneficial state). **Verdict:** Your unease is justified by this principle *unless* "social integration" is explicitly cashed out as specific constraints (e.g., "individuals in Group A had access to, on average, 2 fewer potential confidants within walking distance, reducing perceived coping options") or coordination failures.
  *   **(5) Hearts/Pumping:** **Permitted (Clause 3 satisfied via Selection).** The explanation invokes a consequence ("circulates oxygen"), but the *causal mechanism* is natural selection acting on individual organisms/variants. The functional consequence explains the *persistence* via a selection mechanism. Clause 3 is satisfied.
  *   **(6) Punishment System/Solidarity (No Selection):** **Rejected (Violates Clause 3).** Attributes causal power to a future social benefit ("maintains social solidarity") without specifying a mechanism by which this consequence *causes* the specific shape of the system via individual actions/decisions. It's teleological without a selection/reinforcement story. You stop gagging *with* selection – which would satisfy Clause 3.
  *   **(7) Spirit of the Age/Neoliberalism/Market Decided:** **Rejected (Violates Clause 4 & possibly 1/2).** These are prime examples of reified aggregate labels lacking specific constraining properties or coordinating functions. "Spirit of the age," "neoliberalism" (used vaguely), "the market" as an agent – they don't specify *how* they objectively constrain options (Clause 1) or function as a mutually known signal in a coordination game (Clause 2). They are capital letters.
  *   **(8) Tracked Index:** **Permitted (Clause 2).** The published index is a *publicly accessible, mutually known signal*. Individuals react to it *precisely because* they know others react to it, and everyone knows this. It coordinates expectations (e.g., "if the index crosses X, others will sell, so I should sell") creating a self-reinforcing informational loop. The index's social status *as a tracked variable* is essential to the explanation.
  *   **(9) Currency Collapse (Self-Fulfilling Expectation):** **Permitted (Clause 2).** This is a paradigmatic case of Clause 2. The expectation *of* collapse is the mutually known signal individuals are reacting to. Each person expects collapse *because* they expect others to expect it and act accordingly (e.g., sell). The object tracked (the likelihood of collapse) *is* constituted by the aggregate of everyone's expectations and intended actions. It's a pure coordination/expectation loop centered on a social-level prediction.

  **New Cases:**

  1.  **Network Topology (Weak Ties):** "Behavior X spread rapidly in Community A but not Community B because Community A had more long-range 'weak ties' bridging otherwise isolated clusters." **Verdict: Permitted (Clause 1).** The network structure (a social-level fact) is an *objectively constraining condition* on information flow and contact opportunities. It determines the *feasible paths* for diffusion. An individual in a cluster with no weak ties *cannot* access information from another cluster, regardless of their beliefs *about* the network topology itself. The structure constrains the possible interactions.
  2.  **Institutional Rule:** "Fewer junior scholars challenged Professor P's theories because the department's tenure criteria heavily emphasized publishing within established paradigms." **Verdict: Permitted (Clause 1).** The tenure criteria (an institutional rule, a social fact) constitutes an *objectively constraining condition* on career advancement opportunities. It alters the cost/benefit calculation and perceived feasible strategies for junior scholars, independent of their personal views *about the criteria itself* as a social fact. It shrinks/perverts the feasible set of actions (risky innovation vs. safe conformity).

  **Trade-offs and Overturned Verdicts:**

  *   **Cost:** The principle **cannot comfortably accommodate your desire to accept the Durkheim case (4) as stated.** Your verdict ("I want to allow it") clashes with the principle's demand for specificity regarding the constraining mechanism (Clause 1) or information loop (Clause 2). Accepting Durkheim as-is requires weakening the principle to allow vague social properties as causes, which would open the door to the reification you gag at in (7). This is the core trade-off: coherence vs. saving a specific historical intuition.
  *   **Overturning:** The principle forces a **revision of your verdict on (4)**. To be legitimate, the Durkheimian explanation must be recast to explicitly identify the *specific constraints* (lack of material support, restricted marriage options, absence of communal enforcement mechanisms) or *coordination failures* resulting from "weak integration" that operate *on individuals* in a way satisfying Clause 1 or 2. "Social integration" itself cannot be the unexplained explainer.
  *   **Accommodated:** The principle saves all your other clear verdicts (1, 2, 3, 5, 6, 7, 8) and provides a clear verdict on (9). It explains why network topology (New Case 1) is legitimate (constraint) and distinguishes tracked variables (8) from reified capital letters (7) via Clause 2 vs. Clause 4. It captures the asymmetry between hearts (5 - selection) and punishment (6 - no selection) via Clause 3. It explains why affordances (3) work.

  **Misdescription Check:**

  *   **Case 5 (Hearts) vs. Case 6 (Punishment):** You correctly note the sentence structure similarity ("X exists because X does Y for Z"). The key difference is the presence (Hearts) or absence (Punishment, as initially stated) of a specified selection/reinforcement mechanism operating on individual variants/decisions. Your intuition and the principle correctly distinguish them based on this.
  *   **Case 3 (Affordance) vs. Case 1 (Threshold):** You correctly distinguish them. Case 1 is an individual mechanism *generating* a pattern. Case 3 is an SLF (built environment) *constraining* individual possibilities. They are different explanatory shapes.
  *   **Case 8 (Tracked Variable) vs. Case 7 (Spirit of Age):** The key difference is specificity and causal role. The tracked index is a specific, public signal creating a coordination loop (Clause 2). "The spirit of the age" is a vague, reified label lacking specific constraining or coordinating properties (Violates Clause 4).

  **Summary:** The Constraint-Realist Principle grounds legitimate social-level explanations in either **inescapable objective constraints** on individual action/information (Clause 1) or **self-reinforcing informational loops** created by public signals (Clause 2), while banning **teleology without mechanisms** (Clause 3) and **vague reification** (Clause 4). It validates your core intuitions about affordances, tracked variables, network structure, and institutional rules, rejects mysticism and capital letters, resolves your flip-flop on currency collapse, and provides a clear framework for functional explanations. The cost is that it demands more mechanistic rigor for Durkheimian explanations than you might wish, overturning your desire to accept them as traditionally stated. This trade-off prioritizes explanatory coherence over preserving a specific, historically influential but potentially vague explanatory form.
