prompt: |-
  Im trying to write down what I should even be demanding of a theory of rational belief under uncertainty before I read another round of people talking past each other. Keynes territory: the cases where you dont have a base rate and cant get one.

  The purpose I care about, so adequacy is relative to it: the theory should be good enough to guide somebody facing a genuinely new risk -- an insurer pricing a liability that has no loss history at all, someone deciding whether to move their family to a country whose political settlement may not survive the decade, a government building infrastructure against climate scenarios the models dont agree on. Not good enough to be elegant, good enough to tell that person what to do and why they should trust it.

  So: write me the desiderata. What a theory of this kind has to deliver, with the case or consideration behind each requirement, and a verdict on which requirements are non-negotiable and which are just the tastes of one camp. Here is the messy list I have so far -- reorganize it, split things, merge things, throw things out, add the ones Ive missed:

  - It has to mark some real difference between risk (you have numbers, or a defensible way to get them) and uncertainty (you dont), and the marker cant just be that the agent feels unsure. Motivating case: the urn with a known 50/50 composition versus the urn whose composition you know nothing about -- what exactly is different, and why does the difference survive the fact that both urns force you to act?
  - It has to say what rationality requires when you genuinely cant put a number on it. Is a number mandatory, or may the output be an interval, or a set of admissible probabilities, or no number at all -- and if no number, then what do you do, and how is that not just panic?
  - Seperate slots for (i) how confident you are and (ii) how much that confidence rests on the evidence you actually have. Case: a drug given to ten patients, six recover; the same drug given to a thousand, six hundred recover. Same ratio, very different amount of evidence. I want the theory to say whether slot (ii) is allowed to change what you should do, or whether it is merely a feeling of comfort that a rational agent should ignore.
  - Something about where the state space comes from: being uncertain about the model versus being uncertain within a model. My worry is that this distinction is fake, because which model is right is itself just another proposition you can have a probability about. So tell me whether distinguishing structural uncertainty is a genuine desideratum or a prejudice of the anti-Bayesian camp.
  - It has to handle the ambiguity cases where people prefer known odds to unknown ones. But I genuinely dont know whether reproducing that preference is a requirement a theory must meet or whether a good theory is allowed to explain it away as a bias -- give me your view, with the reasoning.
  - It has to say how confidence combines across independent matters when there are no numbers to multiply, and whether independence is even something the agent can be entitled to assume in the cases I described above.
  - It owes something to an agent who cannot enumerate the possibilities: uncertainty about what your options even are, outcomes nobody has thought of yet. Is that a separate desideratum or just a special case of the model-uncertainty one?
  - It is not allowed to smuggle in what it is supposed to be earning: no quiet assumption that the future resembles the past, or that unseen cases are drawn from the same distribution as the seen ones. But it also is not allowed to conclude that nothing can be said. Whatever it does with induction has to be done honestly, and I want you to say whether those two constraints leave any room at all.

  The part I actually want, though: which subset of these cannot be had together. My guess is that representing confidence without numbers, giving a compositional rule for combining uncertainties, and yielding determinate action guidance are jointly unsatisfiable, but argue it properly, or swap in the triple that is really in trouble. Also tell me which single requirement does the most work in knocking candidates out -- the one that excludes the most otherwise-decent theories. If the answer is that the whole list is only satisfiable by collapsing uncertainty back into risk, say that and tell me which requirement to drop to avoid it.

  Keep it short at the end: a quick scorecard, table is fine, for a strict subjectivist Bayesian with one precise prior, an imprecise-probability or set-of-priors view, a Keynes-style logical-relation account with a seperate notion of evidential weight, and a maximin or robust-decision-making approach. Two or three lines each, the criteria are what Im paying for.
reasoning: |-
  We are building desiderata for a theory of rational belief under uncertainty (Keynesian "uncertainty" as opposed to "risk"). The context is decision-making in novel situations without base rates or reliable models.

  Desiderata Reorganized and Expanded:

  1. **Distinguish Risk from Uncertainty**:
     - *Requirement*: The theory must mark a real difference between situations with quantifiable probabilities (risk) and those without (uncertainty). The marker should not be merely subjective (feeling unsure) but objective (epistemic condition).
     - *Case*: Known 50/50 urn vs. urn with unknown composition. The difference must survive the need to act in both cases.
     - *Non-negotiable*: Yes. Without this, the theory collapses uncertainty into risk.

  2. **Action Guidance Without Numbers**:
     - *Requirement*: When numbers (precise probabilities) are unavailable, the theory must specify what rationality requires. It must say what the output is (interval, set of probabilities, or non-probabilistic representation) and how that leads to action without collapsing into indecision or panic.
     - *Case*: Pricing insurance for a novel liability with no loss history.
     - *Non-negotiable*: Yes. The core purpose is to guide action in the absence of numbers.

  3. **Separate Confidence and Evidential Weight**:
     - *Requirement*: The theory must account for two dimensions: (i) degree of confidence (e.g., probability) and (ii) the weight of evidence (how much evidence that confidence rests on). It must say whether (ii) affects rational action or is merely psychological.
     - *Case*: Drug tested on 10 patients (6 recover) vs. 1000 patients (600 recover). Same ratio, different weight.
     - *Non-negotiable*: Yes. Ignoring weight leads to overconfidence in sparse evidence.

  4. **Model Uncertainty vs. Parameter Uncertainty**:
     - *Requirement*: The theory must handle structural uncertainty (uncertainty about the correct model) differently from uncertainty within a model (parameter uncertainty), or explain why such a distinction is unnecessary.
     - *Case*: Climate models that disagree on fundamental structure vs. uncertainty within one model.
     - *Non-negotiable*: Maybe. We need to clarify: if the theory can treat model uncertainty as just another proposition, then the requirement might be met without a separate category. But if structural uncertainty is qualitatively different (e.g., non-probabilizable), then it must be handled.

  5. **Ambiguity Aversion**:
     - *Requirement*: The theory must either accommodate the empirical fact of ambiguity aversion (preference for known over unknown odds) or explain it away as irrational.
     - *Case*: Ellsberg paradox: people prefer betting on known 50/50 urn over unknown urn.
     - *Non-negotiable*: No, but important. It's a test of descriptive adequacy, but a normative theory might reject ambiguity aversion as irrational. However, for guiding real agents, explaining or accommodating it is valuable.

  6. **Combining Uncertainties**:
     - *Requirement*: The theory must provide rules for combining confidence across independent (or dependent) uncertainties when numbers are absent. It must address when independence can be assumed.
     - *Case*: Deciding to move a family to a politically unstable country: uncertainty about economic collapse, civil war, etc., which may not be independent.
     - *Non-negotiable*: Yes. Without composition, the theory cannot scale to complex decisions.

  7. **Unenumerated Possibilities**:
     - *Requirement*: The theory must handle uncertainty about what the possibilities are (unknown unknowns).
     - *Case*: Building infrastructure against climate change: scenarios not yet modeled.
     - *Non-negotiable*: Yes. This is a key feature of radical uncertainty.

  8. **Honest Induction**:
     - *Requirement*: The theory must not smuggle in unwarranted assumptions (e.g., uniformity of nature, i.i.d. draws) but must still yield actionable conclusions. It must justify induction without circularity.
     - *Case*: Predicting the political survival of a country with no historical precedent.
     - *Non-negotiable*: Yes. Without this, the theory is question-begging.

  Tensions and Trade-offs:

  The core tension is between:
  - Representing confidence without precise numbers (requirement 2).
  - Providing a compositional rule for combining uncertainties (requirement 6).
  - Yielding determinate action guidance (requirement 2 and 8).

  These are jointly difficult because:
  - Without numbers, composition (e.g., multiplying probabilities) is undefined.
  - Without composition, complex decisions become intractable.
  - Without determinate action guidance, the theory fails its purpose.

  The requirement that does the most damage to candidates is **Honest Induction (8)** because it forbids the usual Bayesian move of assuming a prior that enforces uniformity. Without that, many theories cannot get off the ground.

  The requirement that excludes the most theories is **Unenumerated Possibilities (7)** because it requires the theory to account for unknowns that cannot be captured by any fixed state space. This is a challenge for any theory based on a predefined set of states.

  If we insist on all requirements, we might be forced to collapse uncertainty into risk (by requiring precise probabilities) only if we drop requirement 1 and 7. But that defeats the purpose. Alternatively, we might have to accept that no single representation (like a probability) is sufficient and that action guidance might be less than fully determinate.

  Scorecard:

  | Theory                         | 1. Risk/Uncertainty | 2. Action w/o Numbers | 3. Confidence & Weight | 4. Model Uncertainty | 5. Ambiguity Aversion | 6. Combining | 7. Unenumerated | 8. Honest Induction |
  |--------------------------------|---------------------|------------------------|------------------------|----------------------|------------------------|--------------|-----------------|---------------------|
  | **Strict Subj. Bayesian**      | ✘ (Collapses)       | ✘ (Requires numbers)   | ✘ (Ignores weight)     | △ (As probability)   | ✘ (Rejects as bias)    | ✔ (If known) | ✘ (Fixed space) | ✘ (Prior assumes)   |
  | **Imprecise Probabilities**    | ✔                   | △ (Sets, but action?)  | △ (Weight reflected?)  | △ (As set)           | ✔ (Accommodates)       | △ (Hard)     | ✘ (Fixed space) | △ (Less assumption) |
  | **Keynesian (Logical/Weight)** | ✔                   | △ (Non-numeric)        | ✔ (Explicit weight)    | ? (Unclear)          | ? (Varies)             | △ (Hard)     | △ (Partial)     | △ (Tries)           |
  | **Robust (Maximin, etc.)**     | ✔                   | ✔ (Determinate action) | ✘ (Ignores)            | △ (Via models)       | ✔ (Accommodates)       | △ (Hard)     | △ (Via sets)    | ✔ (No prior)        |

  Key:
  ✔ = Satisfies well
  △ = Partially or with caveats
  ✘ = Fails

  Notes:
  - **Strict Subj. Bayesian**: Fails on 1, 7, 8. Requires a prior that may not be justifiable. Action is determinate but based on assumed numbers.
  - **Imprecise Probabilities**: Handles 1 and 5, but action guidance may be indecisive (multiple priors). Struggles with 6 and 7.
  - **Keynesian**: Explicit on 1 and 3 (weight), but may lack clear action guidance (2) and composition (6). Unenumerated possibilities (7) might be partially handled by acknowledging ignorance.
  - **Robust (e.g., Maximin)**: Meets 1, 2 (by selecting worst-case), 5, and 8 (no prior). Ignores weight (3) and may be overly pessimistic. Composition (6) is ad hoc, and unenumerated (7) is a challenge.

  Conclusion: No theory satisfies all. The most promising for your purpose might be a hybrid: using robust decision-making (for action) while incorporating a Keynesian notion of weight to avoid overconfidence. But composition and unenumerated possibilities remain challenges.
answer: |-
  ### Desiderata for a Theory of Rational Belief Under Uncertainty  
  *(Keynesian uncertainty: no base rates, novel risks)*  

  **Core Purpose**: Guide action in novel, high-stakes scenarios (e.g., pricing unprecedented insurance, relocating to unstable countries, climate infrastructure). Output must be action-guiding, not just elegant.  

  #### Non-Negotiable Desiderata  
  1. **Distinguish Risk vs. Uncertainty**  
     - *Requirement*: Objectively differentiate "risk" (quantifiable probabilities) from "uncertainty" (unquantifiable). The distinction must survive the need to act.  
     - *Case*: Known 50/50 urn vs. urn with unknown composition. Actions differ because uncertainty lacks epistemic grounding.  
     - *Why Non-Negotiable*: Without this, the theory ignores the core challenge of novelty.  

  2. **Action Guidance Without Numbers**  
     - *Requirement*: Specify rational action when probabilities can’t be quantified. Output may be intervals, sets of probabilities, or non-probabilistic rules—but must avoid indecision ("panic").  
     - *Case*: Insurer pricing a liability with zero loss history.  
     - *Why Non-Negotiable*: The theory fails if it can’t tell an agent what to *do*.  

  3. **Evidential Weight as Rational**  
     - *Requirement*: Separate (i) *degree of confidence* from (ii) *weight of evidence*. Weight must affect rational action, not just psychological comfort.  
     - *Case*: Drug tested on 10 patients (6 recover) vs. 1,000 patients (600 recover). Same ratio, higher weight in the latter should alter decisions (e.g., lower caution).  
     - *Why Non-Negotiable*: Ignoring weight leads to overconfidence in sparse data.  

  4. **Unenumerated Possibilities**  
     - *Requirement*: Handle "unknown unknowns" (outcomes no one has considered).  
     - *Case*: Climate infrastructure facing unmodeled scenarios.  
     - *Why Non-Negotiable*: Novel risks inherently involve surprises; treating this as mere "model uncertainty" (Desideratum 5) undersells it.  

  5. **Honest Induction**  
     - *Requirement*: Justify conclusions without smuggling in assumptions (e.g., "future resembles past" or "unseen cases match seen"). Must still yield actionable guidance.  
     - *Case*: Assessing political survival of a country with no historical precedent.  
     - *Why Non-Negotiable*: Circular reasoning invalidates the theory.  

  #### Negotiable Desiderata  
  6. **Ambiguity Aversion Accommodation**  
     - *Requirement*: Explain or accommodate the preference for known odds over unknown odds (e.g., Ellsberg paradox).  
     - *Case*: Betting on a known 50/50 urn vs. an unknown urn.  
     - *Why Negotiable*: A normative theory may deem this preference irrational (e.g., as a bias), but should still explain it.  

  7. **Combining Uncertainties**  
     - *Requirement*: Provide rules for combining confidence across independent/dependent uncertainties without numbers.  
     - *Case*: Relocating a family amid uncertain economic/political risks.  
     - *Why Negotiable*: Composition may be intractable; a theory can satisfy other desiderata without a universal rule.  

  8. **Model vs. Parameter Uncertainty**  
     - *Requirement*: Address structural uncertainty (about the model itself) differently from parametric uncertainty (within a model).  
     - *Case*: Climate models disagreeing on core mechanisms vs. uncertainty within one model.  
     - *Why Negotiable*: Structural uncertainty can be reduced to probabilistic beliefs about models (it’s not fundamentally distinct). Anti-Bayesian demands here often reflect preferences, not necessity.  

  ---  
  ### Tensions and Trade-offs  
  **The Incompatible Trio**:  
  - **Representing confidence without numbers** (Desideratum 2),  
  - **Compositional rules for combining uncertainties** (Desideratum 7),  
  - **Determinate action guidance** (Desideratum 2).  
  *Why unsatisfiable?* Non-numeric representations (e.g., sets of probabilities) lack natural composition rules (e.g., multiplying intervals is underdetermined). This leads to indecision or arbitrary actions—violating determinacy.  

  **Most Damaging Requirement**: **Honest Induction** (Desideratum 5) excludes the most theories. It forbids "easy" solutions (e.g., assuming i.i.d. data or uniform priors), forcing theories to grapple with true novelty. Bayesianism often fails here by smuggling in priors.  

  **Collapse into Risk?** Yes, if you drop **Distinguish Risk vs. Uncertainty** (Desideratum 1). But this surrenders the core problem. To avoid collapse, prioritize Desiderata 1–5 and accept that composition (Desideratum 7) may be limited.  

  ---  
  ### Theory Scorecard  
  *(✔ = Strong, △ = Partial, ✘ = Weak/Fails)*  

  | **Desideratum**               | **Strict Bayesian** | **Imprecise Probability** | **Keynesian** | **Robust (Maximin)** |  
  |-------------------------------|---------------------|---------------------------|---------------|----------------------|  
  | **1. Risk vs. Uncertainty**   | ✘ (Collapses to risk) | ✔ (Sets mark difference) | ✔ (Logical uncertainty) | ✔ (Unquantifiable as "ambiguity") |  
  | **2. Action w/o Numbers**     | △ (Requires precise numbers) | △ (Intervals; action indecisive) | △ (Qualitative; action vague) | ✔ (Choose worst-case) |  
  | **3. Evidential Weight**      | ✘ (Ignores weight)  | △ (Reflected in set width) | ✔ (Explicit weight) | ✘ (Ignores weight) |  
  | **4. Unenumerated Possibilities** | ✘ (Fixed state space) | ✘ (Fixed state space) | △ (Acknowledges ignorance) | △ (Handles via "robustness") |  
  | **5. Honest Induction**       | ✘ (Prior assumptions) | △ (Less assumptive) | △ (Tries; no prior) | ✔ (No probabilistic assumptions) |  
  | **6. Ambiguity Aversion**     | ✘ (Rejects as bias) | ✔ (Accommodates) | △ (Varies) | ✔ (Builds in aversion) |  
  | **7. Combining Uncertainties** | ✔ (Multiplication) | △ (Ad hoc rules) | ✘ (No clear rules) | ✘ (No general rule) |  
  | **8. Model Uncertainty**      | ✔ (As probability) | ✔ (As set of models) | △ (Folded into weight) | ✔ (Via multiple models) |  

  **Summary**:  
  - **Strict Bayesian**: Fails on uncertainty/weight/unenumerated possibilities. Strong only for composition.  
  - **Imprecise Probability**: Best for ambiguity aversion and model uncertainty. Weak on unenumerated possibilities and weight.  
  - **Keynesian**: Best for weight and uncertainty distinction. Weak on action guidance and composition.  
  - **Robust (Maximin)**: Best for action guidance and honest induction. Weak on weight and composition.  

  **Recommendation**: For your use cases (novel risks), prioritize **Keynesian** or **Robust** approaches—they handle uncertainty and action best. Drop strict demands for **composition** (Desideratum 7) to avoid collapse into risk.
