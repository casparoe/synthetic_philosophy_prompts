  But note: E_n and E_m are conditionally independent given T_n? Not exactly: because E_m is determined by T_n (since the guess at m is fixed by T_n and x_m is fixed by T_n). So given T_n, E_m is deterministic. Then:

  P(E_n and E_m | T_n) = P(E_n | T_n) * 1_{E_m}   (if E_m occurs given T_n) or 0 if not.

  But also, since E_m is deterministic given T_n, we have:

  E[I_n I_m | T_n] = I_m * E[I_n | T_n] = I_m * (1/2).

  Therefore, E[I_n I_m | T_n] = (1/2) * I_m.

  Now, taking expectation over T_n:

  E[I_n I_m] = E[ E[I_n I_m | T_n] ] = E[ (1/2) I_m ] = (1/2) E[I_m] = (1/2)*(1/2) = 1/4.

  Therefore, Cov(I_n, I_m) = E[I_n I_m] - E[I_n]E[I_m] = 1/4 - 1/4 = 0.

  So the centred indicators are uncorrelated (orthogonal in L2).

  The argument then uses a law of large numbers for orthogonal random variables. The standard strong law requires independence or at least some stronger condition (like pairwise independence and boundedness) but note that pairwise uncorrelatedness is not enough for the strong law. However, the argument says: "Chebyshev on a sparse subsequence plus interpolation" to get the limit.

  A common way to handle orthogonal random variables is to use the following: if we have pairwise orthogonal (uncorrelated) random variables, then the variance of the sum S_N = (1/N) sum_{n=1}^N (I_n - 1/2) is Var(S_N) = (1/N^2) sum_{n=1}^N Var(I_n - 1/2) because the covariances are zero. Since Var(I_n - 1/2) = Var(I_n) = 1/4 (because I_n is Bernoulli(1/2)), we have Var(S_N) = (1/N^2) * N * (1/4) = 1/(4N) → 0. By Chebyshev, for any ε>0, P(|S_N|>ε) ≤ Var(S_N)/ε^2 → 0. This gives convergence in probability of the average (1/N) sum_{n=1}^N I_n to 1/2.

  But the argument claims almost sure convergence? It says: "the limiting proportion of correct guesses is one half with probability one".

  The above only gives convergence in probability. However, the argument says it can be made precise by using a sparse subsequence. Indeed, one can choose a subsequence N_k = k^2, then by Chebyshev, P(|S_{N_k}| > ε) ≤ 1/(4ε^2 N_k) = 1/(4ε^2 k^2) which is summable. By Borel-Cantelli, S_{N_k} → 0 almost surely. Then one interpolates: for any n, let k be such that N_{k-1} < n ≤ N_k, and then show that S_n is close to S_{N_k}. But note that the sequence S_n is not necessarily monotonic. However, the usual argument for the strong law under pairwise independence (or uncorrelatedness) requires more care. Actually, it is known that for pairwise independent identically distributed random variables with finite variance, the strong law holds (this is a theorem of Etemadi, but note that here the variances are bounded). However, in this case, we have pairwise uncorrelatedness (which is weaker than pairwise independence) but still, for the strong law, there is a result that if the random variables are pairwise uncorrelated and uniformly bounded (which they are) and have a common mean, then the strong law holds? I think that is actually true. Alternatively, one can use the variance bound and a subsequence argument to get a.s. convergence.

  But let us grant that the argument for (5) is correct: for any strategy, the proportion of correct guesses converges to 1/2 almost surely.

  Now, the contradiction: step (2) gives a strategy that, for every sequence, the proportion of correct guesses is 1 (because only finitely many are wrong, so the proportion goes to 1). But step (5) says that for any strategy, the proportion goes to 1/2 with probability 1 (i.e., for almost every sequence). These two statements are contradictory because the strategy in (2) would require that the set of sequences for which the proportion goes to 1 has full measure? Actually, no: step (2) says the strategy works for every sequence. So the set on which the proportion goes to 1 is the entire space (which has measure 1). But step (5) says that for this strategy, the set on which the proportion goes to 1/2 has measure 1. Therefore, the entire space must be contained in the set where the proportion goes to 1/2? But that's impossible because 1 ≠ 1/2.

  Therefore, we have a contradiction.

  Now, where is the flaw?

  The flaw must be in the construction of the strategy in (2). The argument in (2) uses the selector r. But note: the selector r is not a measurable function. In fact, it cannot be measurable. The probabilistic argument in (5) assumes that the strategy functions f_n (which map the tail to a guess) are measurable. This is necessary for the events to be measurable and for the probabilities to be defined.

  In step (5), we are working in the context of the fair coin measure, which is a probability measure on the space of sequences. The sigma-algebra is the product sigma-algebra. The strategy functions f_n must be measurable for the events E_n to be measurable. The argument in (5) relies on the fact that the guess at n is a function of the tail beyond n, and that the tail beyond n is measurable. But the selector r is a function on the entire space that is not measurable (with respect to the product sigma-algebra). Therefore, the strategy functions f_n defined by:

  f_n(tail) = the nth coordinate of r(x)

  where x is any sequence that has that tail (but note: the tail determines the equivalence class, so r(x) is the same for any x with that tail). Therefore, f_n is well-defined as a function of the tail. However, the issue is that this function f_n may not be measurable.

  In fact, it cannot be measurable. Because if it were, then the entire strategy would be measurable and the events E_n would be measurable, and then the probabilistic argument would hold. But then we would have a contradiction because the strategy would have to satisfy both that the proportion is 1 for every sequence (by step (2)) and that the proportion is 1/2 for almost every sequence (by step (5)).

  Therefore, the selector r (and hence the strategy) is not measurable. The flaw is that in step (2), the strategy is not measurable, so the probabilistic argument in (5) does not apply to it. Specifically, the functions f_n are not measurable with respect to the product sigma-algebra, so the events E_n are not measurable. Therefore, we cannot assign probabilities to them in the usual way, and the entire probabilistic argument breaks down.

  To put it simply: the set of sequences for which the prisoners guess correctly only finitely many times is not measurable (it might not be in the product sigma-algebra). Therefore, we cannot talk about its measure. The probabilistic argument requires measurability, which is absent.

  This is a classic example of a non-measurable set that arises from the Axiom of Choice. The selector r is a non-measurable function, and the strategy built from it leads to non-measurable events.

  Therefore, step (5) is correct for any measurable strategy. But the strategy in (2) is not measurable. Hence, there is no contradiction.

  To answer the specific questions:

  1. Which step fails? Step (2) is correct in that such a strategy exists (by AC), but the strategy is not measurable. Therefore, when we try to apply the probabilistic argument (step (5)) to it, we cannot because the events are not measurable. The flaw is that the argument in (6) assumes that the strategy is measurable, but it is not.

     Why did it look unexceptionable? Because in the absence of AC, we often assume that all sets are measurable, but here AC is used to construct a non-measurable object. The step (4) and (5) assume that the strategy is measurable (which is necessary for the probability theory to apply).

     What does rejecting it cost? We do not reject step (2) entirely: the strategy exists by AC, but we cannot use it in a probabilistic context because it is not measurable. We must restrict to measurable strategies when doing probability.

  2. What does the argument establish? It shows that there is no measurable selector for the eventual equivalence relation. That is, there is no measurable function r that assigns to each equivalence class a representative. This is a known result: the equivalence relation of eventual equality on 2^N is not smooth (i.e., it does not admit a measurable selector). In fact, it is a standard example in ergodic theory and descriptive set theory.

     It also shows that the prisoners cannot have a measurable strategy that guarantees only finitely many errors. This is a known result in the hat problem literature.

     So it is not a new result, but a manifestation of non-measurability.

  3. How much choice is needed? The strategy in (2) requires a selector for the equivalence relation. The equivalence relation has continuum many classes (each class is countable, and there are 2^N classes). The existence of such a selector is equivalent to AC in this context? Actually, the existence of a selector for any equivalence relation is equivalent to AC. However, there are weaker forms. For example, the axiom of choice for countable families would not suffice because we have an uncountable family of classes. We need a choice function for a family of sets of size continuum, each set being countable. This is a strong form of AC.

     Therefore, if we reject AC entirely, then such a selector does not exist, and the strategy cannot be built. But the refutation only shows that if we have AC, then we have non-measurable sets, and we cannot use such strategies in probability. It does not refute AC; it only shows that AC leads to non-measurable sets, which is well-known.

  In summary:

  - The flaw is in applying the probabilistic argument to a non-measurable strategy.
  - Step (2) is correct (given AC), but the strategy is not measurable.
  - Step (5) is correct for measurable strategies.
  - The contradiction is avoided because the strategy from step (2) is not measurable.

  The cheapest place to give is to accept that the strategy is not measurable and hence not subject to the probabilistic analysis. We do not need to abandon the law of large numbers; we only need to restrict to measurable strategies.

  Additional note: The argument in (5) about the almost sure convergence requires that the random variables are measurable and that the strategy is measurable. Without measurability, we cannot even define the probability.

  Therefore, the argument establishes that there is no measurable strategy for the prisoners that guarantees only finitely many errors. This is a known result. It also shows that the axiom of choice can lead to non-measurable sets, but that is not a refutation of choice; it is a feature of it.

  So, to directly answer: the step that fails is the application of (5) to the strategy of (2), because the strategy of (2) is not measurable. The flaw is in the transition from (5) to (6) when applied to the non-measurable strategy.

  The cost: we must acknowledge that the strategy is not measurable and hence cannot be used in a probabilistic context. We do not lose the law of large numbers; we only lose the ability to apply it to non-measurable functions.

  If we want to avoid non-measurable sets, we can work in set theory without AC (like ZF) or with restricted choice that ensures measurability (like dependent choice). But that is a separate matter.
answer: |-
  Your query presents an intriguing argument that purports to refute the Axiom of Choice (AC) by deriving a contradiction between a prisoner hat-guessing strategy (using a selector for eventual equality) and a probabilistic result about fair coin tosses. After careful analysis, I identify the flaw and address your concerns. The argument is clever but ultimately fails due to a subtle issue of measurability. Below, I explain step by step, answering your questions precisely.

  ### Step-by-Step Diagnosis
  The core issue arises at the transition from step (5) to step (6) when applied to the strategy from step (2). Specifically:
  - **Step (2) is valid given AC**: AC indeed provides a selector \(r\) for the equivalence classes of eventual equality. The prisoners' strategy—where each prisoner \(n\) uses the tail they see to determine the equivalence class and guesses the \(n\)th coordinate of the representative \(r(x)\)—guarantees that only finitely many prisoners err for every hat sequence \(x\). This is correct under AC, as the strategy depends only on the selector \(r\).
  - **Step (5) is valid for measurable strategies**: The probabilistic argument—that for any fixed strategy, the proportion of correct guesses converges to \(1/2\) almost surely under the fair-coin measure—holds **only if the strategy is measurable** with respect to the product \(\sigma\)-algebra. The proof sketch (using orthogonal indicators, Chebyshev, and interpolation) is sound under this measurability assumption. Pairwise orthogonality of the centred indicators \(I_n - 1/2\) (due to the independence structure) and the variance computation leading to almost sure convergence are correct for measurable strategies.
  - **The flaw**: The strategy from step (2), constructed using AC, **fails to be measurable**. The selector \(r\) is not measurable with respect to the product \(\sigma\)-algebra on \(\{0,1\}^{\mathbb{N}}\) (equipped with the fair-coin measure). Consequently, the guess functions \(f_n\) (which map tails to guesses) are not measurable, and the events "prisoner \(n\) guesses correctly" are not measurable sets. Therefore, step (5) does not apply to this strategy, as it assumes measurability to define probabilities and expectations. The contradiction in step (6) vanishes because the probabilistic conclusion cannot be drawn for non-measurable strategies.

  **Why did this step look unexceptionable?**  
  - The misstep is subtle because the argument in step (5) appears purely combinatorial and probabilistic, with no explicit mention of measurability. In finite or constructive settings, measurability is often automatic, but with AC, we can define pathological objects. The selector \(r\) is a classic example: it is not constructible and violates regularity properties like measurability. The audience member's argument implicitly assumed that all strategies are subject to probabilistic laws, but AC-generated strategies escape this by being non-measurable.

  **What does rejecting the flawed step cost?**  
  - **Cost**: You must accept that AC produces non-measurable sets and functions, which cannot be analysed with standard measure theory. This does not force you to abandon AC, but it restricts probabilistic reasoning to measurable contexts. Crucially, you retain:
    - The fair-coin measure and law of large numbers for measurable sets/functions.
    - Standard analysis tools (e.g., Hahn-Banach, vector space bases) if you accept AC, but with awareness that some AC-dependent objects are non-measurable.
  - **No loss of probability theory**: The law of large numbers stands firm for measurable strategies. The flaw only confirms that non-measurable strategies (like the one here) fall outside probabilistic analysis.

  ### What the Argument Establishes (After Repair)
  Once repaired, the argument shows:
  - **Impossibility of a measurable selector**: There is no measurable selector for eventual equality. That is, no function \(r\) that chooses representatives from each equivalence class can be measurable under the product \(\sigma\)-algebra. This is a known result in descriptive set theory and ergodic theory.
  - **Impossibility of a measurable winning strategy**: For the hat problem, no measurable strategy guarantees only finitely many errors for every sequence. This aligns with existing literature (e.g., the hat problem is often used to illustrate non-measurability).
  - **Not a new result**: This is a manifestation of the following familiar phenomenon: AC implies the existence of non-measurable sets, but this does not refute AC; it highlights its incompatibility with universal measurability. The equivalence classes of eventual equality form a partition into countable sets, and a non-measurable selector is a standard example.

  ### Choice Strength and Weaker Alternatives
  - **Strength needed for the strategy**: The strategy in step (2) requires a selector for an equivalence relation with \(2^{\aleph_0}\) classes (one per equivalence class). This is a strong form of AC, equivalent to AC for families of sets indexed by \(\mathbb{R}\), since each class is countable but the family has continuum size. AC is essential here; weaker principles (e.g., dependent choice or countable choice) do not suffice.
  - **Refutation scope**: If the argument were correct, it would refute this strong form of AC. However, since the flaw is in measurability, not AC itself, the refutation fails. AC remains consistent with ZF set theory, and you can retain it while acknowledging that it produces non-measurable objects. If you reject AC entirely, you lose the strategy but gain a universe where all sets are measurable (assuming large cardinals or determinacy), but this comes at high cost (e.g., sacrificing Hahn-Banach and vector space bases).

  ### Your Suspicions and the Cheapest Resolution
  - **Suspicions about steps (4)–(5)**: You were right to suspect these steps, but not because the gambling system "beats chance" in absolute terms. Rather, the strategy beats chance *everywhere* by being non-measurable, evading the probabilistic framework entirely. Step (4) is correct (the guess depends only on the tail, and \(x_n\) is independent and fair), and step (5) holds for measurable strategies.
  - **Cheapest resolution**: Maintain AC, the fair-coin measure, and the law of large numbers by **restricting probability theory to measurable strategies**. This costs you nothing beyond accepting that AC introduces non-measurable sets—a well-known trade-off. Abandoning step (5) or the law of large numbers is unnecessary and undesirable. The flaw is repaired by adding a measurability requirement to step (5): "For any **measurable** strategy fixed in advance...".

  ### Summary
  - **Flaw**: Step (5) does not apply to the strategy from step (2) because it is non-measurable. The contradiction vanishes.
  - **Outcome**: The argument establishes the impossibility of a measurable selector for eventual equality, a known result.
  - **Recommendation**: Keep AC if you need its consequences (e.g., for analysis), but recognise that non-measurable sets arise and cannot be handled probabilistically. This preserves both the law of large numbers and standard mathematics, with measurability as the boundary.

  This resolves your four-day conundrum without upending mathematics. If you pursue set theory further, you will encounter this phenomenon frequently—non-measurability is the price of choice, not a refutation of it.
