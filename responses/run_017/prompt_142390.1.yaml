  But note: the guess at n is a function of the tail beyond n, which is the sequence (x_{n+1}, x_{n+2}, ...). The guess at m (for m>n) is a function of the tail beyond m, i.e., (x_{m+1}, x_{m+2}, ...). The tail beyond n includes the tail beyond m and also the coordinates from n+1 to m. Therefore, the guess at n depends on x_{n+1}, ..., x_m, and the tail beyond m. The guess at m depends only on the tail beyond m. And x_n is independent of all of these.

  But the key point: the events E_n and E_m are independent? Not necessarily. However, the argument does not require independence but orthogonality (uncorrelatedness) of the centred indicators. We compute:

  Cov(I_n, I_m) = E[I_n I_m] - E[I_n]E[I_m].

  We know E[I_n] = 1/2, E[I_m] = 1/2, so E[I_n]E[I_m]=1/4.

  Now, E[I_n I_m] = P(E_n and E_m).

  Condition on the entire tail beyond n (call it T_n). Then the event E_n is determined by x_n and the guess at n (which is a function of T_n). Similarly, the event E_m is determined by x_m and the guess at m (which is a function of the tail beyond m, which is part of T_n).

  However, note that given T_n, the coordinates x_n and x_m are independent (because the coin tosses are independent). Moreover, the guess at n is fixed by T_n, and the guess at m is also fixed by T_n (because the tail beyond m is included in T_n). Therefore, given T_n, the events E_n and E_m are independent? Why? Because E_n depends only on x_n (given T_n) and E_m depends only on x_m (given T_n), and x_n and x_m are independent given T_n (since they are independent unconditionally and T_n is independent of them? Actually, T_n is the tail beyond n, which includes x_m for m>n, so T_n does not include x_n but includes x_m for m>n. But note: the coordinate x_n is independent of T_n, and the coordinate x_m (for m>n) is part of T_n? Wait, no: T_n is (x_{n+1}, x_{n+2}, ...), so it includes x_m for m>n. Therefore, given T_n, the value of x_m is known (so it is deterministic). Therefore, the guess at m is known (because it is a function of the tail beyond m, which is part of T_n). Similarly, the guess at n is known (because it is a function of T_n). Therefore, given T_n, the event E_n is the event that x_n equals a specific value (the guess at n, which is a function of T_n). Similarly, the event E_m is the event that x_m equals a specific value (the guess at m, which is a function of T_n). But note: x_n is independent of T_n, so P(E_n | T_n) = 1/2. Similarly, P(E_m | T_n) is either 0 or 1? Because the guess at m is fixed by T_n and x_m is fixed by T_n (since m>n, T_n includes x_m). Therefore, given T_n, x_m is known, so the event E_m is either certain or impossible. Hence, P(E_m | T_n) is either 0 or 1.

  Therefore, the joint probability:

