prompt: |-
  I'm on the grants committee of a small longtermist foundation — we give out a few million a year, mostly AI safety, biorisk, a couple of institutional-resilience things, and one standing line for research on how to weigh the very long run at all. Last night my housemate and I got into a two-hour fight about whether we're living in a simulation and whether that should make us less fanatical about the far future, and I now have to turn that into an actual decision document.

  The concrete case: a two-person team has applied for ~$180k to spend eight months writing us an internal report answering exactly that question. Their pitch, roughly: (1) if we're in a simulation, there's a real chance it gets shut down or reset long before anything like a billion-year future plays out — whoever is running it probably wants results on a short horizon, not the whole history — so the expected number of future people is much smaller than our models assume; (2) whatever we do inside the sim may not propagate to whatever base reality is running it, so "protect the long run" work could turn out to be locally-only; (3) but they insist it cuts the other way too, because a base civilization running lots of sims means there are probably far more morally relevant beings than we assumed when we did our headcounts, so maybe the future gets bigger, not smaller. And one of our own board members has already emailed saying that if simulated experiences count at all, a short sim densely packed with people isn't obviously worse than a long empty one — it's just different, and she doesn't see why that lowers the priority.

  Half the committee thinks this is metaphysics cosplay with restricted funds, and that even asking has a cost: once "maybe we're simulated" is on the table as a budget line, every grant gets a speculative haircut and nothing gets funded. The other half thinks that if there's even a 15% chance of point (1), it swamps every cause-prioritization disagreement we've ever had, and refusing to look is just motivated reasoning to protect the portfolio.

  Draft the memo I circulate Thursday: a clear recommendation — fund, don't fund, or fund with conditions, and if conditions, what they'd have to actually deliver — plus the reasoning, and a genuinely fair statement of the strongest version of whichever side you're rejecting, so the losing side reads it and thinks they were heard rather than steamrolled. Please dont just say the simulation argument is unfalsifiable; that's the thing my housemate kept repeating and it settled nothing.
reasoning: |-
  Okay, the user is on a grants committee for a longtermist foundation and needs to make a decision about funding a report on the simulation hypothesis. They had a heated debate with their housemate about whether living in a simulation should affect their focus on the far future. Now they need to draft a memo with a clear recommendation and balanced reasoning.

  First, I need to understand the key points from the proposal. The applicants argue that if we're in a simulation: (1) it might be shut down early, reducing the expected future population; (2) actions inside might not affect the base reality; but (3) there could be many more simulated beings, increasing moral weight. A board member adds that a short, dense simulation might not be worse than a long, sparse one.

  The committee is split. Half think this is a waste of funds and could lead to speculative cuts across all grants. The other half believe a 15% chance of (1) could drastically change priorities and ignoring it is motivated reasoning.

  The user specifically wants to avoid dismissing the argument as unfalsifiable. They need a memo that clearly recommends funding or not, with conditions if applicable, and genuinely acknowledges the strongest counterarguments.

  I should start by outlining the core tension: the high stakes of the simulation hypothesis versus the practical concerns of funding and focus. The recommendation needs to balance these. Funding the report but with strict conditions seems reasonable. That way, the concerns are addressed without derailing the foundation's work.

  For the conditions, the report must avoid metaphysical debates and instead focus on decision theory under uncertainty. They should provide concrete tools or models the foundation can use, assess implications for current priorities, and quantify uncertainties. Also, they need to deliver interim findings early to prevent scope creep.

  The memo should emphasize that the foundation is risk-averse but can't ignore high-impact uncertainties. The strongest case against funding is the opportunity cost and the risk of opening the door to endless speculation. But the pro side's point about a 15% chance being pivotal is valid and needs addressing. The conditions aim to mitigate those risks by limiting scope and demanding practical outputs.

  Also, the board member's point about the value of a short, dense simulation versus a long, sparse one should be included in the report's analysis. That's a crucial moral consideration that could affect longtermist calculations.

  In the memo, the reasoning should acknowledge both sides fairly. The rejection of the "don't fund" argument isn't about dismissing their concerns but about structured investigation with safeguards. The losing side should feel their points about resource constraints and slippery slopes were heard and addressed through the conditions.

  Finally, the memo needs a clear structure: summary, background, analysis of both sides, recommendation with conditions, and next steps. Keeping it concise but thorough is key since it's for internal circulation.
answer: |-
  ## MEMORANDUM  
  **To:** Grants Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Thursday Date]  
  **Subject:** Recommendation on Proposal: "Simulation Hypothesis & Longtermist Priority Weighting"  
  **Proposal:** $180k for 8-month internal report by [Team Name]  
  **Recommended Decision:** **Fund with Strict Conditions**  

  ---

  ### **I. Executive Summary**  
  I recommend funding the proposal **contingent on revised deliverables focused exclusively on *decision-relevant uncertainty quantification* and *action-guidance frameworks* under simulation hypotheses**. The simulation argument’s potential stakes (if plausible) justify targeted investigation, but the proposal’s current scope risks abstract philosophy. The team must reframe their output as **practical tools for robust decision-making**, not metaphysical speculation. Conditions enforce this pivot.  

  ---

  ### **II. Background & Core Tension**  
  The proposal argues that if we inhabit a simulation:  
  - **(Risk)** The simulation may terminate/reset prematurely, shrinking the expected far-future value (§1).  
  - **(Relevance)** Our actions may not affect base reality, reducing the impact of "protect the long run" work (§2).  
  - **(Upside?)** Base civilizations running many sims could vastly increase total moral patients (§3).  

  **Committee Divide:**  
  - **Against Funding:** This is untestable philosophy. Prioritizing it risks paralyzing all grants with unquantifiable "what-ifs" and legitimacy costs.  
  - **For Funding:** A non-negligible probability of simulation-induced future-truncation could dominate all other cause-prioritization debates. Ignoring it is epistemic negligence.  

  **Board Member Input:** Simulated lives may hold equal moral weight, making a short/dense future not inherently less valuable than a long/sparse one—questioning whether simulation hypotheses lower longtermist priority at all.  

  ---

  ### **III. Analysis: Why Conditional Funding is Optimal**  

  #### **A. The Case for Investigation**  
  - **Stakes Are Asymmetric:** If the simulation hypothesis meaningfully shifts our expected future value (e.g., via early truncation), it could radically alter resource allocation. A 5-15% credence in high-impact scenarios warrants scrutiny, per our commitment to *high-stakes uncertainty management*.  
  - **Not Purely Metaphysical:** The question isn't "Are we simulated?" (falsifiability concerns acknowledged) but "*How should we act* given non-zero credence in simulation-related risks/opportunities?" This is a decision-theoretic challenge central to longtermism.  
  - **Mitigating Motivated Reasoning:** Dismissing this *because it threatens existing priorities* violates our duty to truth-seeking. A disciplined analysis protects against both overreaction and underreaction.  

  #### **B. The Case Against Unconditional Funding**  
  - **Scope Creep & Legitimacy Risk:** An open-ended "answer the simulation question" report invites unanchored speculation. Granting this without guardrails signals that untestable hypotheses merit dedicated funding, potentially inviting low-quality submissions.  
  - **Opportunity Cost:** $180k could fund concrete AI safety technical research or biorisk preparedness. Philosophy must justify its cost via actionable insights.  
  - **Misplaced Precision:** Calculating "expected beings in base reality vs. sims" is currently intractable and distracts from the core need: *robust decision procedures under deep uncertainty*.  

  #### **C. The Board Member’s Point: A Critical Insight**  
  The argument that a simulation’s *density* of morally valuable experiences might offset its *duration* is profound. If valid, it could **neutralize** the main risk (premature termination) cited by the proposal. This must be central to the analysis.  

  ---

  ### **IV. Recommendation: Fund with Binding Conditions**  
  **Approve $180k, contingent on the team accepting these deliverables:**  
  1. **Decision-Theoretic Frameworks, Not Truth Claims:**  
     - Output: **A toolkit for evaluating longtermist interventions under *multiple* world-models** (simulated/non-simulated, short-dense/long-sparse futures).  
     - *Deliverable Example:* "Sensitivity analysis matrices showing how intervention X's expected value changes under varying simulation scenarios and moral weight assumptions."  
  2. **Quantified Uncertainty Boundaries:**  
     - Define the *range of credences* in simulation hypotheses that should alter priorities. E.g., "Only if P(early truncation) > 10% AND P(no experience-duration equivalence) > 70% does AI safety priority drop below biosecurity."  
  3. **Priority-Specific Impact Assessment:**  
     - Assess how simulation scenarios affect **our current portfolio** (AI safety, biorisk, institutional resilience). Does P(sim) = 0.2 change our marginal dollar allocation? If not, the report must state so clearly.  
  4. **Interim Report at 4 Months:**  
     - Demonstrate progress on frameworks above. Committee retains right to terminate funding if outputs become purely philosophical.  

  **Why these conditions?** They force the team to:  
  - Serve *our institution’s need* for actionable guidance.  
  - Prevent metaphysical overreach.  
  - Directly address the Board Member’s density-duration equivalence challenge.  
  - Isolate scenarios where simulation hypotheses *actually change decisions*.  

  ---

  ### **V. For the "Against" Side: Your Concerns Were Heard**  
  *(Strongest case against funding, articulated as its proponents would):*  
  > *"This sets a precedent that any speculative hypothesis with non-zero probability deserves dedicated funding. We exist to tackle concrete, actionable risks—not host philosophy seminars. Granting this opens the door to endless "what-if" proposals (e.g., Boltzmann brains, quantum immortality) that drain resources while offering no testable insights. Worse, it signals that our priorities are unstable, undermining donor confidence and our ability to recruit serious technical talent. Even a 15% chance of simulation truncation is meaningless without a *falsifiable mechanism* for assigning that probability. We risk becoming a foundation that funds navel-gazing while the world burns."*  

  **Our Response:** These risks are real. **This is why we imposed conditions.** The approved scope is not about proving simulations exist, but stress-testing our decision-making against *any* hypothesis implying radical value truncation/transformation. If the team cannot produce practical tools within 4 months (per Condition 4), we terminate funding. This is not an endorsement of speculation—it is a controlled experiment in robust longtermism.  

  ---

  ### **VI. For the "Pro" Side: Why Not Full Funding?**  
  *(Strongest case for unconditional funding, articulated as its proponents would):*  
  > *"A modest probability that we're in a simulation could reduce the expected value of far-future work by orders of magnitude. Ignoring this because it's 'hard' or 'weird' is burying our heads in the sand. If we claim to care about expected value maximization, we must confront hypotheses that dominate the calculation. Failing to fund this is admitting that our longtermism is performative—we only care about the future if it fits comforting models. The cost is trivial compared to our budget, and the downside of inaction could be catastrophic misallocation."*  

  **Our Response:** The stakes justify investigation, but **undisciplined analysis is worse than none.** Conditions ensure the output forces concrete decisions. If truncation risk is as pivotal as you believe, the team should welcome the chance to prove it via our decision frameworks.  

  ---

  ### **VII. Next Steps**  
  1. Committee vote on conditional approval.  
  2. If approved, negotiate deliverables with [Team Name] by [Date].  
  3. 4-month review of interim report: Continue only if frameworks are operational and decision-relevant.  

  **Final Thought:** This isn’t about settling debates with housemates. It’s about ensuring our portfolio withstands *all* plausible challenges to its expected value—even uncomfortable ones. The conditions make this investigation a hedge, not a pivot.  

  ---  
