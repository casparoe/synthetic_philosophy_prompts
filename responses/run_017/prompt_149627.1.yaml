prompt: |-
  I'm a PhD student in history, and the chapter I am currently drafting turns on a claim I cannot state to my own satisfaction: that a pathogen, a shift in the North Atlantic climate, and a volcanic eruption can each be treated as something more than a background condition — that they can, in some sense still to be specified, act. My committee divides between those who regard this as a harmless façon de parler and those who regard it as a category mistake, and I have noticed that the disagreement is never about the cases. It is about what we take ourselves to be demanding when we demand that something be an agent.

  So I would like the specification rather than the literature. Write the desiderata that a theory of non-human historical agency would have to meet in order to be usable by a working historian: someone who wants to be able to write that the blight acted on a population already weakened by three successive harvest failures without either lapsing into mysticism or committing herself to the determinism on which a physical setting simply dictates a human outcome.

  For each requirement, give the consideration or case that motivates it. The cases I have in mind are of the following shape, though substitute if you prefer: the 1918 influenza pandemic; the eruption of Tambora and the cold, dark year that followed; cholera in nineteenth-century cities; the Irish blight; the failure of European engineering projects in the tropics before mosquito vectors were understood.

  I also want the list to do some sorting, because I suspect that several of the demands I keep encountering are sectarian preferences wearing the costume of requirements. Please sort the following into genuine desiderata, defensible but negotiable expectations, and outright prejudices of one camp or another, saying briefly why in each case:

  - that the account close the agency–causation gap: it must say what acting adds to causing, and must not simply stipulate that any difference-making cause is thereby an agent, on pain of making every oxygen molecule an actor;
  - that an actor be re-identifiable across the stretches of narrative in which it figures, and that the theory say what holds a strain, an eruption, or a decade of cold together as one actor rather than as many events;
  - that agency require responsiveness to reasons, goals, or representations, so that germs, climates, and volcanoes fail and the attribution is at best metaphorical;
  - that a non-human factor count as an actor only where contemporary sources registered it as one, so that we are not retrojecting our causal models onto people who lacked them;
  - that the account be symmetric: whatever counterfactual and mechanistic scrutiny we apply to human action we apply to non-human contribution, and vice versa;
  - that the account make environmental determinism unavailable — that no non-human factor, taken alone, entail a human outcome such as a revolt, a migration, or the political consequences of a famine;
  - that the account be scale-invariant, handling a microbe acting over weeks and a cooling trend acting over a century with the same machinery;
  - that the account say what becomes of deliberative, intention-centered explanation once a non-human actor has been admitted: displaced, supplemented, or reframed.

  Then flag any subset of the surviving desiderata that plausibly cannot be jointly satisfied, and say which you would abandon and what that would cost. My own hunch is that the pressure concentrates where the demand for legibility in the archive meets the demand for scale-invariance, but I would rather have the argument than my hunch.

  Two further requests. First, address the proxy problem explicitly: our evidence for past pathogens, climates, and eruptions comes through proxies — ice cores, tree rings, parish burial series, recovered DNA — and reading a proxy as the trace of an actor's act already presupposes much of the causal model that the attribution was supposed to earn. Is that circularity real, and if so what condition on the theory blocks it? Second, I have been toying with a requirement of my own, which I call the two-ledger condition: an adequate account must keep separate a geophysical-and-biological ledger, on which an eruption or a mutation is an event in a series with its own dynamics and no addressees, and a narrative ledger, on which significance, patients, and consequences are attributed; and it must state the rules by which items pass from one ledger to the other. An account that fuses them — so that the volcano warns, or the eruption simply is the famine — has collapsed causation into meaning. Is this a genuine desideratum, a confused restatement of some other item on the list, or a prejudice of my own?

  Skip the scorecard; I can do that with my committee. What I need is the standard.
reasoning: |-
  Hmm, the user is a PhD history student wrestling with a theoretical problem about non-human agency in historical narratives. They're drafting a chapter where they want to treat pathogens, climate shifts, and volcanic eruptions as more than background conditions - as entities that "act" in some sense. Their committee is divided between those who see this as harmless phrasing and those who consider it a category mistake.

  The user wants me to outline the requirements for a theory of non-human historical agency that would be useful for working historians. They want to avoid both mysticism and determinism while being able to write statements like "the blight acted on a population." They've provided several historical cases like the 1918 influenza pandemic and the eruption of Tambora.

  They've asked me to evaluate eight specific demands about agency, sorting them into genuine requirements, negotiable expectations, or outright prejudices. These include things like closing the agency-causation gap, requiring responsiveness to reasons, symmetry in analysis, and preventing environmental determinism.

  They also want me to address two specific concerns: the proxy problem (how we interpret evidence from ice cores, tree rings, etc. without circular reasoning) and their own "two-ledger condition" which separates geophysical/biological events from narrative significance.

  I'll need to provide a clear framework that balances philosophical rigor with practical historical writing needs. For the eight demands, I'll categorize each based on whether it's essential for avoiding determinism/mysticism (genuine), helpful but flexible (negotiable), or rooted in anthropocentric bias (prejudice).

  I'll pay special attention to the proxy problem and their two-ledger condition, assessing whether the latter is a genuine requirement or something else. I'll also identify where requirements might conflict, particularly between archival legibility and scale-invariance, as the user suspects.

  The response should be theoretically robust but grounded in historical practice, helping the user advance their chapter while addressing committee concerns.
answer: |-
  Here is a framework for non-human historical agency, designed for the working historian seeking rigorous but non-mystical, non-deterministic attribution of "action" to entities like pathogens, climates, or eruptions. The desiderata are derived from the core problem: how to integrate material forces as historical *actors* without anthropomorphizing or resorting to physical determinism, while respecting the historian's craft and evidence.

  **Core Desiderata for a Theory of Non-Human Historical Agency:**

  1.  **Agency as Emergent Efficacy in Historical Trajectories:**
      *   **Requirement:** The theory must define "acting" as *making a difference that demonstrably alters the course of human events in a way that is contingent, non-automatic, and requires narrative explanation.* It must be more than inert background but less than intentionality. Action implies a *force with consequences that reshape possibilities and responses* within the human social/political/economic sphere.
      *   **Motivation:** The Irish Potato Blight. The *Phytophthora infestans* spore isn't "acting" like a general. Yet, its introduction, reproductive strategy, and interaction with susceptible monoculture created a *specific, devastating, contingent crisis* demanding explanation beyond "crop failure happened." Its "action" lies in its specific *efficacy* in triggering a catastrophic chain of events against which human systems struggled and failed. It wasn't just a condition; it was an active disruptor. This avoids both inert background *and* determinism (human responses varied wildly in effectiveness).

  2.  **Contextual Contingency (Anti-Determinism Safeguard):**
      *   **Requirement:** Attributing agency to a non-human factor MUST imply that its historical *effects* were contingent on the specific human context it encountered. The theory must explicitly rule out the notion that the non-human factor *alone* dictates the human outcome. Its "action" is always *in relation to* and *mediated by* human structures, vulnerabilities, and responses.
      *   **Motivation:** Cholera in 19th-Century Cities. The *Vibrio cholerae* bacterium acts (replicates, produces toxin). But whether this action leads to minor outbreaks, localized disasters, or city-wide panic and major sanitary reforms depends entirely on pre-existing infrastructure, social organization, medical understanding, and political will. The pathogen acts *upon* a specific context; it doesn't determine the outcome. Failure of tropical engineering projects pre-mosquito understanding similarly shows the *interaction* between the non-human actor (vector-borne disease) and human ignorance/vulnerability.

  3.  **Archival Legibility / Traceable Impact:**
      *   **Requirement:** The "action" of the non-human entity must be demonstrably legible *within the historical record* (broadly construed: texts, material culture, demographic data, proxy data interpreted robustly). Its disruptive efficacy, the contingency of its effects, and the human responses it provoked must be traceable.
      *   **Motivation:** Tambora's Eruption & The Year Without a Summer. The volcanic eruption (physical event) is reconstructed via proxies (ice cores, tree rings). Its "action" as a historical agent isn't the eruption itself, but its *traceable, disruptive impact*: the global climate anomaly evidenced in widespread crop failures documented in diaries, grain prices, mortality records, and political unrest (e.g., European famines, migration pressures). Its agency lies in the *scale and nature of the disruption evident in the human record*. The 1918 Flu's agency is similarly traced through mortality spikes, overwhelmed hospitals, labor shortages, and social behavior changes documented contemporaneously.

  4.  **Narrative Cohesion / Bounded Disruption:**
      *   **Requirement:** The entity must be identifiable as a coherent source of disruption *within the narrative timeframe*. The theory must allow us to meaningfully speak of "the blight," "the 1918 pandemic," or "the Tambora climate anomaly" as single historical actors *for the purpose of analyzing their specific historical impact*, even if they are complex processes scientifically. This doesn't require metaphysical unity, but narrative utility and causal coherence regarding *their specific disruptive role*.
      *   **Motivation:** The Irish Blight & Decadal Cooling. "The Blight" refers to the specific pathogen invasion causing the Famine. Treating each spore generation or each field's infection as a separate actor is useless for historical narrative. Similarly, a "decade of cold" (e.g., Little Ice Age phases) acts as a persistent pressure/context shaper over its duration. Its agency stems from its *sustained, identifiable influence* on human activities (agriculture, settlement patterns) across that period. The unity is historical, not ontological.

  **Evaluation of Specific Demands:**

  *   **Genuine Desiderata:**
      *   **That the account close the agency–causation gap...:** **YES.** This is fundamental. Without distinguishing agency from mere causation, the concept collapses into triviality ("oxygen acts"). The proposed "Emergent Efficacy in Historical Trajectories" (Desideratum 1) coupled with "Contextual Contingency" (Desideratum 2) directly addresses this. Agency is causation *plus* contingent, disruptive efficacy reshaping human historical possibilities in a traceable way. Not all difference-making causes rise to this level.
      *   **That the account be symmetric...:** **YES (Conditional).** Symmetry in *rigor* of causal analysis (counterfactuals, mechanisms) is crucial to avoid anthropocentric bias and mystify non-human factors or downplay human ones. We must scrutinize *how* the climate shift constrained options as rigorously as we scrutinize *why* a leader made a decision. However, symmetry in *kind* of explanation (e.g., requiring "reasons" for both) is misplaced (see below). Motivated by the need for consistent historical epistemology.
      *   **That the account make environmental determinism unavailable...:** **YES.** This is non-negotiable and is explicitly covered by Desideratum 2 (Contextual Contingency). The theory *must* embed the non-human actor within a web of human responses and preconditions. The Irish Famine wasn't *determined* by the blight; it was the catastrophic result of the blight acting *upon* specific colonial policies, land tenure systems, and economic structures. The failure of tropical projects wasn't determined by mosquitoes, but by their action *within* a context of specific engineering choices and lack of scientific knowledge.
      *   **That the account say what becomes of deliberative, intention-centered explanation...:** **YES.** A viable theory must integrate with, not obliterate, intentional explanation. The answer is **reframed and supplemented.** Non-human actors set new conditions, create crises, open or close possibilities *within which* human deliberation and intention operate, often under severe constraint or unexpected pressure (e.g., how did leaders *respond* to the 1918 pandemic? How did farmers *adapt* to the cold decade?). Human agency is contextualized and constrained by non-human agency, and vice-versa; they interact dynamically.

  *   **Defensible but Negotiable Expectations:**
      *   **That an actor be re-identifiable across stretches of narrative...:** **YES, but negotiable in scope.** Narrative cohesion (Desideratum 4) requires bounding the actor for analytical purposes ("the blight of 1845-52," "the Tambora climate anomaly"). However, demanding a strict ontological "what holds it together" *beyond* its coherent historical role as a disruptive force is potentially overreaching. The "actor" is defined by its historical impact trace, not by an intrinsic essence. Its unity is pragmatic and narrative-driven.
      *   **That the account be scale-invariant...:** **YES, but challenging.** The *core logic* (contingent disruptive efficacy traceable in the record) can apply from a pandemic (weeks/years) to climate change (centuries). However, the *specific mechanisms* of tracing impact and demonstrating contingency will differ vastly. Parish records show weekly mortality spikes during plague; paleoclimate proxies and economic trends show century-scale cooling impacts. The theory's core must be flexible enough to accommodate this, but perfect scale-invariance in methodological application is unrealistic. The historian must adapt the lens.

  *   **Outright Prejudices:**
      *   **That agency require responsiveness to reasons, goals, or representations...:** **NO.** This is anthropocentric bias smuggled in as a requirement. It explicitly excludes the very phenomena the historian wants to analyze (pathogens, climate). While humans *interpret* these forces (sometimes attributing agency, like "the wrath of God"), the forces themselves do not *have* or *respond to* reasons. Their agency lies in their material impact and the contingent disruption they cause (Desiderata 1 & 2), not internal states. This demand makes non-human agency impossible by definition, which isn't a neutral requirement but a commitment to human exclusivity.
      *   **That a non-human factor count as an actor only where contemporary sources registered it as one...:** **NO.** This confuses historical epistemology with ontology and privileges specific forms of evidence. Contemporary understanding is crucial *context* (Desideratum 3: how did people *respond* given their understanding?), but it doesn't limit what *actually* acted upon them. We can know (via modern science and proxy data) that a volcanic eruption caused climate disruption even if contemporaries attributed it to other causes. We can trace the impact of a pathogen before its identification. Demanding contemporary recognition as an "actor" would prevent us from writing scientifically informed history about forces operating beyond contemporary comprehension (e.g., mosquito vectors before germ theory). It risks historical solipsism.

  **Addressing the Proxy Problem:**

  The circularity concern is real but manageable. The solution lies in **robust process tracing and consilience.**

  1.  **Independent Proxy Validation:** Proxies (e.g., sulfate in ice cores = volcanic eruption) are validated through *independent* physical/chemical principles and cross-proxy correlation (e.g., tree rings, historical eclipse observations) *before* being used in historical narratives. This establishes the geophysical/biological *event* on its own ledger.
  2.  **Trace Impact, Don't Impute Motive:** Using the proxy data, we establish the *occurrence* and *physical magnitude* of the event (e.g., massive eruption 1815). We *then* turn to the *human record* (archives, demographics, economics) to trace its *consequences* (crop failures 1816, famine, migration). The "action" as a historical agent is *not* read directly from the proxy (ice core sulfate doesn't "act historically"). The proxy provides evidence for the *event*; the human record provides evidence for its *disruptive impact*. The agency attribution arises from the *demonstrated connection* between the event (established via proxies/consilience) and the contingent disruption (established via human records). Circularity is broken by using distinct lines of evidence for the cause and its historical effects.

  **Evaluating the Two-Ledger Condition:**

  This is a **Genuine and Valuable Desideratum.** It directly addresses the core danger of collapsing causation into meaning or anthropomorphizing. Its value is:

  1.  **Prevents Conflation:** It rigorously separates the physical dynamics of the non-human entity (ledger 1: eruption as geological event, mutation as biological process) from its historical *significance* as an agent (ledger 2: famine trigger, demographic catastrophe).
  2.  **Clarifies "Action":** The "action" occurs precisely *at the point of passage* from Ledger 1 to Ledger 2. It is the *impact* of the Ledger 1 event *on* the human world, contingent on human context. The volcano doesn't "warn"; its eruption (Ledger 1) *causes* atmospheric changes that *lead to* crop failure within vulnerable human agricultural systems (Ledger 2). The eruption *is not* the famine; it is a necessary *cause* that, *in that specific context*, became a *famine-triggering agent*.
  3.  **Rules for Passage:** The "rules" for an item passing from Ledger 1 (Event) to Ledger 2 (Historical Actor) are defined by the core desiderata:
      *   Did it have **Emergent Efficacy** (Desideratum 1) – did it demonstrably disrupt the human trajectory?
      *   Was its effect **Contingent** on the human context (Desideratum 2) – did the outcome depend on human structures?
      *   Is its disruptive impact **Legible** in the historical/archival/proxy record (Desideratum 3)?
      *   Can it be treated as a **Coherent Source** of disruption for the narrative purpose (Desideratum 4)?

  This condition formalizes a crucial disciplinary boundary while enabling productive analysis.

  **Tensions and Trade-offs:**

  The major tension lies between **Scale-Invariance (Negotiable Expectation)** and **Archival Legibility (Core Desideratum 3)**.

  *   **The Problem:** Demonstrating "Emergent Efficacy" and "Contextual Contingency" with the rigor demanded by "Symmetry" is far easier at shorter, more documented timescales (e.g., 1918 Flu's impact on WWI troop movements via hospital records) than over centuries (e.g., the Little Ice Age's role in the collapse of Norse Greenland). The density and nature of evidence change dramatically.
  *   **The Trade-off:** To maintain Archival Legibility as a *core* requirement, perfect scale-invariance must be abandoned. The *conceptual core* (contingent disruptive efficacy) remains scale-invariant, but the *methodological standards* for establishing it must scale appropriately.
  *   **The Cost:** For very long-term or diffuse non-human actors (e.g., multi-century climate trends, slow soil depletion), attributing specific "agency" to them becomes more tentative and interpretive. We can speak of persistent *pressures* or *context-shaping forces*, but pinpointing specific "actions" with contingent disruptive effects on discrete historical events becomes harder, risking vagueness or over-attribution. The historian must be more cautious and explicit about the evidentiary basis and the nature of the claimed agency at larger scales. The focus shifts more towards establishing the *context of constraint/possibility* created by the long-term force, within which more discrete human and non-human agents interact.

  **Conclusion: The Standard for the Working Historian**

  A usable theory of non-human historical agency must allow you to write that "the blight acted" by satisfying these core demands:

  1.  **Demonstrate Emergent Efficacy:** Show *how* this specific entity caused a contingent disruption that actively reshaped historical possibilities and demanded response.
  2.  **Establish Contextual Contingency:** Prove that the *outcome* was not determined by the non-human factor alone, but emerged from its interaction with specific human vulnerabilities, structures, and responses.
  3.  **Ensure Archival Legibility:** Ground the attribution in traceable impacts within the historical record (broadly defined, using proxies rigorously and independently validated to break the proxy circularity).
  4.  **Maintain Narrative Cohesion:** Treat the entity as a coherent source of disruption for the analytical purpose, bounded by its historical impact.
  5.  **Reframe Human Agency:** Integrate the non-human actor by showing how it constrained, enabled, or redirected human intentions and actions within the narrative.
  6.  **Respect the Two Ledgers:** Separate the geophysical/biological event from its historical significance; agency arises at the point of disruptive impact contingent on human context.

  This framework avoids mysticism (no imputed intentions), determinism (outcomes are contingent), and triviality (not all causes are agents). It provides a rigorous, evidence-based standard for when and how a historian can legitimately treat a pathogen, a climate shift, or a volcano as an actor that shaped the human story. The tensions, particularly around scale, are inherent to the historical enterprise but are managed by adhering to the core standard of demonstrable, contingent, legible disruptive efficacy.
