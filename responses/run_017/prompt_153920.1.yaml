  When Marcus compares it to the Smoking Lesion (Move 3), he's making a good point about evidential reasoning, but Priya's counter (Move 4) feels more persuasive. The key difference is that in Newcomb's, the predictor's model directly responds to your decision procedure, while the lesion is just correlated. That "subjunctive dependence" concept is crucial - it's why one-boxing isn't just buying good news.

  Marcus's procedural point (Move 5) about installing dispositions is clever but problematic. As Priya notes (Move 6), it creates a weird disconnect - why acquire a disposition you'll later consider irrational? And it doesn't help the person already at the boxes. Her "self-undermining" criticism hits home.

