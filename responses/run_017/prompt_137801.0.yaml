        For Activity 2: none new, but we split the group.
        For Activity 3: 5 index cards for the mimic (each with an input pattern and the output pattern for a 7-node system after 3 steps).
        For Activity 4: 14 cards with the rule: "Pass any bean you have to the next node when the bell rings." (or one card for the mimic in Activity 4? No, in Activity 4 we have a circle and each node has the same rule: pass the bean to the next node.)

    - Beans: at least 14 beans (but more in case of multiple beans? In Activity 4 we start with one bean, so 1 bean. In Activity 1, we might have up to 14 beans? So have a bag of beans.

    - String: to connect the nodes? Not necessary for the CA because they are in a line and can see each other. But for the circle in Activity 4, we can arrange chairs in a circle. So string might not be used. We can skip the string.

    - Bell: to mark time steps.

    - Whiteboard: to record states and votes.

  Roles:

    - All participants are nodes in the activities. In Activity 3, one participant is the mimic. In Activity 4, all are nodes in a circle.

  Minute-by-Minute:

    0-5 min: 
        - Introduce: "We are going to build a system. You are the nodes. We'll have a bell to mark time. Follow the rules on your card."
        - Arrange 14 participants in a line. Hand out rule cards for the CA (Activity 1). 
        - Explain the rule: "At each bell, you will do: Look at your left neighbor (if exists) and right neighbor (if exists), and yourself. Count how many beans are there. If the total is odd, then you will have a bean in the next step (take a bean if you don't have one). If even, then you will not have a bean (remove your bean if you have one). We start with an initial pattern: [put beans at node0, node3, node7]."

    5-20 min: Activity 1 (Upload)
        - Ring the bell. Wait for participants to compute (they can use scrap paper or just think). 
        - Go down the line and ask each for their next state (0 or 1). Record on whiteboard.
        - Then, have them update: they take or remove beans to match the next state.
        - Repeat for 3 steps.
        - Vote: "Moral consideration for this system? (0-5 beans)" Collect in a cup, calculate average, write on board.

    20-35 min: Activity 2 (Replay)
        - Split into two groups of 7. Each group will form a line of 7 nodes. They get the same rule (but for 7 nodes). 
        - Use the same initial pattern for both (e.g., nodes0,2 in each group have beans).
        - Run 3 steps (with bell) for both groups simultaneously. Record states on whiteboard (one side for group A, one for group B).
        - Vote: 
            Vote A: "Moral consideration for one copy? (0-5)"
            Vote B: "Moral consideration for the entire setup (both copies)? (0-5)"
        - Collect both votes (use two cups? or do one after the other). Record averages.

    35-50 min: Activity 3 (Mimic)
        - Bring the group back together. Assign one participant as the mimic. Give them the 5 precomputed lookup cards.
        - Choose an initial pattern (one of the 5) for a 7-node system. Ask the mimic to look up the output after 3 steps.
        - The mimic reads the output pattern.
        - (Optionally, run the distributed version for the same input to show it matches.)
        - Vote: "Moral consideration for the mimic system? (0-5)"

    50-65 min: Activity 4 (Multiple Descriptions)
        - Arrange the 14 participants in a circle. 
        - Give one bean to node0.
        - Rule: "When the bell rings, if you have a bean, pass it to the next node (to your right)."
        - Ring the bell 14 times. At each ring, the bean is passed. After 14 rings, it returns to node0.
        - Then, we do two votes:
            Vote A: "This system is a clock. It measures time in 14-second intervals. How much moral consideration? (0-5)"
            Vote B: "This system is a memory. It stores the fact that a bean was input 14 seconds ago and then outputs it. How much moral consideration? (0-5)"
        - Record both averages.

    65-75 min: Variant (Speed) for Activity 4
        - We don't run it again. Instead, we imagine: "What if we ran the clock system very fast, in 1 second instead of 14 seconds? Would that change your vote for the clock description?" 
        - Then: "What if we ran it very slowly, taking a day per step?" 
        - We don't vote, just discuss briefly.

    75-90 min: Debrief
        - Start with: "What did you find surprising?"
        - Then: "In the circular passing, did anyone vote differently for the clock and the memory? Why?"
        - Highlight: "The same physical system was seen as two different computations, and that might have changed the moral consideration. In my novel, I have systems that can be described in multiple ways. The upload might be described as a distributed mind or as a bunch of idle phones. The replay might be one mind or two. The mimic might be a mind or just a big table. And the description we choose does the work."
        - Final vote: "Imagine a system that does exactly what the upload did (the distributed CA) but implemented by one person flipping coins to determine the next state of each node. How much moral consideration? (0-5)" 
        - Collect votes, compute average, and award the prize to the person whose vote is closest to the average.

    Note: We didn't do the damage variant due to time, but if we have time in debrief, we can ask: "What if one node in the upload was replaced by a coin flip? Would that change your moral consideration?"

  This plan is ambitious and might run over. We can cut the number of steps in the CA to 2 instead of 3 to save time.

  Let's hope the wifi is not needed!
answer: |-
  ### Session Design: "The Mind in the Machine"  
  **Goal:** Participants experience the moral ambiguity of non-human minds through physical simulation, confronting how computational descriptions shape moral judgments.  

  ---

  #### **Materials & Setup**  
  - **Index cards** (30+): Pre-written rules/variants  
  - **Dried beans** (50+): Tokens for computation/voting  
  - **String** (14 pieces, 2ft each): "Wires" between nodes  
  - **Bell:** Marks computational steps  
  - **Whiteboard:** Track votes/patterns  
  - **Two cups:** For private voting (labeled "MORAL WEIGHT")  
  - **Prizes:** 3 "golden beans" (special tokens) for the final vote winner.  

  **Room Layout:**  
  - Arrange 14 chairs in a line (left to right = data flow).  
  - Each chair gets a string "wire" connecting to the next (except the last).  
  - Place whiteboard at the front for tallies.  

  ---

  ### **Minute-by-Minute Plan**  
  **Total: 90 minutes**  

  #### **Phase 1: The Upload (Distributed Mind)**  
  *(20 min)*  
  1. **Intro (0-5 min):**  
     - *Don’t explain the theme.* Say: *"We’re simulating a system that solves a problem. Each of you is a node. Follow your card’s rule. When the bell rings, pass tokens via strings. We’ll vote on outcomes—most accurate guess wins a prize."*  
     - Assign roles: Give each participant:  
       - **Card 1 (Upload Rule):** *"If you receive ≥1 bean, flip a coin (secretly). Heads: Send 1 bean right. Tails: Send nothing."*  
       - **String:** Attach to neighbor’s chair.  
     - Seed the system: Give 3 beans to the leftmost participant.  

  2. **Run (5-15 min):**  
     - Ring the bell every 60 seconds (3 rings total).  
     - Participants pass beans per rules. The rightmost node outputs beans into a cup.  
     - *Observe:* Beans scatter unpredictably; no node "thinks."  

  3. **Vote & Bind (15-20 min):**  
     - *Vote Q1:* "How much moral weight does this system deserve? (0 beans = none, 5 = human-level)." Secretly place beans in cup.  
     - Tally average on whiteboard (e.g., "Upload: 2.3").  
     - **Stakes:** If average ≥3, label the system "ALIVE" on whiteboard (binds later).  

  ---

  #### **Phase 2: The Replay (Duplicated Mind)**  
  *(20 min)*  
  1. **Reset (20-25 min):**  
     - Split group into two parallel lines (7 each).  
     - Give all **Card 2 (Replay Rule):** *Identical to Card 1.*  
     - Seed both lines with 3 beans (same starting point).  

  2. **Run (25-35 min):**  
     - Ring bell simultaneously for both lines. Run 3 steps.  
     - Outputs collected in separate cups.  

  3. **Vote & Trap (35-40 min):**  
     - *Vote Q2:* "Moral weight for one line?" (Beans in cup).  
     - *Vote Q3:* "Moral weight for both lines combined?" (Beans in cup).  
     - Tally averages. **Key trap:** If Q2 ≠ Q3, note inconsistency aloud: *"Is one line half a mind? Or two whole minds?"*  
     - **Stakes:** If "ALIVE" from Phase 1 applies, announce: *"Because you declared the Upload alive, you must preserve one Replay line—turn off the other."* Sacrifice one line’s output.  

  ---

  #### **Phase 3: The Mimic (Lookup Mind)**  
  *(20 min)*  
  1. **Reset (40-45 min):**  
     - Collapse group into one line. Designate one participant as **Mimic**.  
     - Give **Mimic Card 3:** *"Lookup Table: If input beans = X, output beans = Y"* (Pre-computed to match Upload’s past outputs).  
     - Others become "dummy nodes": Pass beans directly, no decisions.  

  2. **Run (45-55 min):**  
     - Seed leftmost node with 3 beans.  
     - On bell rings, dummy nodes pass beans instantly to Mimic.  
     - Mimic checks input, reads output from table (e.g., "Input=3 → Output=1 bean").  

  3. **Vote & Challenge (55-60 min):**  
     - *Vote Q4:* "Moral weight for the Mimic system?"  
     - Tally average. **Challenge:** *"Why vote higher/lower than the Upload? Same outputs!"*  
     - **Stakes:** If "ALIVE" label exists, Mimic inherits it—participants must "consult" it on a fictional dilemma (e.g., *"Should the system get a day off?"*).  

  ---

  #### **Phase 4: Variants & Unsettling**  
  *(15 min)*  
  - **Variant 1 (Speed):** Re-run Upload at 1/10 speed (bell every 30 sec for 1 step). *Vote Q5:* "Moral weight now?"  
  - **Variant 2 (Damage):** Remove 4 random nodes. Replace with coin flips (participants flip coins to decide outputs). *Vote Q6:* "Moral weight now?"  
  - **Variant 3 (Giant Table):** Mimic performs Upload’s role *without* nodes—reads outputs from a giant table. *Vote Q7:* "Moral weight?"  
  - **Whiteboard Tally:** Compare all votes (Upload, Replay, Mimic, Variants). Point out inconsistencies: *"Same behavior, different votes—why?"*  

  ---

  #### **Debrief & Bridge to Insight**  
  *(15 min)*  
  1. **Reveal the Theme (75-80 min):**  
     - *"Today we simulated three non-human minds: an Upload (distributed), a Replay (duplicated), and a Mimic (lookup). Your votes determined their ‘moral weight.’"*  

  2. **Map Activities to Problems (80-85 min):**  
     - **Upload** → *"40k idle handsets."*  
       - Unsettled: *Can a mind exist if no part ‘thinks’?*  
       - Vote inconsistency exposed: Physical distribution ≠ moral weight.  
     - **Replay** → *"One mind, two copies."*  
       - Unsettled: *Is duplication 2x moral weight or 1x weight counted twice?*  
       - Trap: Binding vote forced confrontation with consequences.  
     - **Mimic** → *"A lookup table mimicking behavior."*  
       - Unsettled: *Do internal reasons matter, or just outputs?*  
       - Challenge: Identical outputs, different mechanisms—why vote differently?  
     - **Variants** → *"Selecting the description does the work."*  
       - Speed/Damage: Show physical changes alter votes despite same "computation."  
       - Giant Table: Identical to Mimic, but participants *feel* it’s "less alive."  

  3. **The Bridge (85-88 min):**  
     - *"Notice: The same physical setup (people passing beans) was called an Upload, a Replay, or a Mimic. We could describe it as calculating math, telling a story, or predicting weather. The computation isn’t in the beans—it’s in how *we* label it. And that label decided your moral votes. In fiction and ethics, the story we tell about a mind *is* the moral choice."*  
     - **Connect to Novel:** *"My upload, replay, and mimic turn on this: The ‘mind’ isn’t handed to us. We select it—and that choice does the heavy lifting."*  

  4. **Final Vote & Prize (88-90 min):**  
     - *Vote Q8:* "Moral weight for a system that *only* exists when we describe it as a mind?"  
     - Award golden beans to the voter closest to the group average.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"It’s just people passing beans!"**  
     - *Response:* "Exactly. But if this were software, would you vote differently? Why?" Force them to engage the analogy.  

  2. **Votes treated as polls, not judgments:**  
     - *Prevent:* Emphasize *"This is your personal moral call"* before each vote. Use secret beans/cups.  

  3. **Collapse into "We can’t know!" by minute 40:**  
     - *Solution:* "Agreed—but you *must* vote. Forced choices reveal biases. Later, we’ll ask why you voted anyway."  

  4. **Right objection, wrong moment (e.g., early functionalism):**  
     - *Response:* "Brilliant! Write that down for the debrief." Defer depth; prioritize experiential flow.  

  5. **Chaos in Variants:**  
     - Simplify: Skip Giant Table if time lags. Use Damage variant only.  

  ---

  ### **What the Activity Can’t Teach**  
  - **The Hard Problem of Consciousness:** Participants may conflate cognition with subjective experience (qualia). The activity shows *functional* minds, but not inner life.  
    - *Debrief Script:* *"We simulated cognition, not consciousness. Does a lookup table *feel*? I can’t make you experience that. But in fiction, forcing readers to sit with this ambiguity—that’s the power."*  

  - **The Frame Problem:** How systems "select" relevant computations from infinite possibilities.  
    - *Debrief Script:* *"In reality, a system doesn’t ‘choose’ its description. We do. My upload’s 40k phones could be seen as calculating pi, not thinking. The moral weight comes from the story we wrap around it."*  

  ---

  ### **Rules & Materials Summary**  
  - **Cards:**  
    - Upload/Replay: *"If ≥1 bean, flip coin. Heads: Send 1 bean right. Tails: Send nothing."*  
    - Mimic: Pre-computed table (e.g., "Input=3 beans → Output=1 bean").  
  - **Votes:** 8 total (beans in cups, averaged on whiteboard).  
  - **Stakes:** Early votes bind later actions (e.g., killing a Replay line). Prize for final vote accuracy.  

  This design forces engagement with ambiguity, exposes inconsistencies, and delivers your core insight: **The describer, not the system, bears the moral burden.** Run it as a game—and let the beans do the talking.
