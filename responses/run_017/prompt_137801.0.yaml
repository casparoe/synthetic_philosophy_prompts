  We are designing a 90-minute session for 14 fiction writers to engage with the concept of non-human minds through interactive activities. The goal is to make them feel the difficulty of attributing moral consideration to such minds without lecturing. We have index cards, dried beans, a bell, string, and a whiteboard. We avoid laptops and formal philosophy terms.

  The core idea: Use the room as a system to simulate the three non-human minds (upload, replay, mimic) in variants, and then challenge the participants to vote on moral consideration and confront their inconsistencies. The key insight we want to emerge is that the same physical process can be interpreted as implementing different computations, and the choice of interpretation (grain/level) is what does the moral work.

  Structure:
  1. Introduction (5 min): Set up without revealing the topic. Assign roles and explain the first activity.
  2. Activity 1: The Upload (Distributed Computation) (20 min)
  3. Activity 2: The Replay (Duplicated Computation) (20 min)
  4. Activity 3: The Mimic (Lookup Table) (20 min)
  5. Variants and Voting (15 min): Introduce variations to challenge assumptions.
  6. Debrief and Discussion (10 min): Reveal the point and connect to the novel.

  Key Elements:
  - Real stakes: We'll have a vote at the end with a prize (e.g., a special notebook or a small book) for the person whose vote is closest to the group's final consensus (but note: we are not seeking truth, just consistency). Also, early votes will bind later conditions (e.g., if they vote high moral consideration in Activity 1, then in Activity 3 they must treat the system as having rights and adjust the activity accordingly).
  - Forced choices: At each stage, they must vote (with beans) on a scale (e.g., 0-5 beans) for moral consideration. The votes are private (beans in a cup passed around) and then we reveal the average (rounded) to the group. Then they must argue about why they voted as they did and why others might disagree.

