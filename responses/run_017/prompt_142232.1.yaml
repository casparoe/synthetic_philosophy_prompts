prompt: |-
  I'm a senior at a large public high school, and I run a small student forecasting club. Every Monday we post a board — in the hallway and online — with roughly ten predictions for the week and the month ahead: whether the baseball fields will be playable on Saturday, whether the creek behind the school will top its banks in April, when the first frost will hit the community garden, how many people will come to the fall play, whether the courtyard will be dry enough for an outdoor assembly three weeks out. The groundskeeper, the garden club's faculty sponsor, the athletic director, and — somewhat alarmingly — a couple of local reporters read it and act on it. We've been doing this for a year. We have a rooftop weather station that logs temperature and rainfall, a spreadsheet, and a track record that includes two calls I'd rather not be reminded of: a harvest we organized two weeks early, and a field treatment the groundskeeper applied ahead of a rain that never came. Nobody on the team has had differential equations; we can do arithmetic, logarithms, and basic statistics. I have about an hour a week for this, and a faculty advisor has to approve anything before it goes up.

  The reason I'm writing is an argument we keep having, which is now getting in the way of the actual work. One member says the world is deterministic, the equations fix a single future, so every failed forecast is just a measurement problem and better instruments plus a bigger computer would eventually get everything right. Another says that because of chaos anything past ten days is random in exactly the way a coin flip is, so there is nothing to choose between forecasts and no point in trying. I don't think either can be right, but I can't say why in a way that settles it, and I suspect the truth is a set of distinctions rather than a compromise.

  What I'd like is a written procedure my team can run on each new request in ten or fifteen minutes, something we can tape up next to the whiteboard. For each prediction we're asked for, in order: the questions to ask, and what would count as a sufficient answer to each one. I have in mind a few distinctions I only half understand, and I'd rather you correct them than flatter me. First, the difference between not knowing the current state precisely enough and having equations that are themselves slightly wrong — I gather these fail in different ways, that the first kind of error grows and then levels off while the second drags the forecast systematically in one direction, and that this difference should show up in our own past errors if we look at them the right way. Second, the difference between predicting what happens on a particular day and predicting how many days in a month will be above some value; I've been told the first can be hopeless while the second is fine, and I'd like to know exactly when that gap opens and how wide it is. Third, the thing where a model produces a perfectly self-consistent story that no real sequence of events actually matches — whether we should treat our own run as evidence at all. And fourth, the arithmetic that tells us what better instruments would actually buy: I gather that each extra digit of precision in the starting conditions buys a fixed amount of extra time rather than an ever-growing amount, and I'd like that turned into a number-of-days calculation we can do on a spreadsheet, because it converts a philosophical argument into one we can settle at a whiteboard.

  I also need the procedure to know when to stop. There should be a point at which it says: do not issue this as a date or a number, issue it as a range or a probability or nothing at all, and here is how to tell which. And there should be a point at which it says: this is not a question about the system, it is a question about what we're willing to risk — whether a false alarm that sends volunteers out for nothing is worse than a missed frost that kills the tomatoes — and that belongs to the advisor and the garden club, not to us. Please mark those hand-offs explicitly, and be honest about which steps are judgment calls dressed up as procedure, because I'd rather know now than discover it in front of the newspaper.

  Finally, please run the finished procedure on three of our real requests. The first is the first-frost date for the garden, which is the prediction we're proudest of — we've been close two years running — and I have a suspicion the procedure will tell us we've been getting lucky and can support nothing sharper than a window, which I will not enjoy hearing but would rather hear. The second is the April creek-flood question, where what people actually need is a yes or no about a threshold rather than a daily river level. The third is the outdoor assembly three weeks out, which I think the procedure may tell us not to answer at all, and where I'd like to know what we should post instead that isn't just a shrug. For each, show the steps as my team would actually work through them in fifteen minutes, including where we'd have to write "we don't know" for a quantity we'd normally just guess. And please end by saying plainly what a procedure like this cannot do — which questions about predictability it has no purchase on, so that we don't start trusting it in places where it is only giving us the appearance of having thought.
reasoning: |-
  Okay, the user runs a high school forecasting club that makes practical predictions for their school and community. They're facing a philosophical disagreement among team members about determinism vs. chaos, which is hindering their work. They need a clear, actionable procedure to evaluate prediction requests.

  Hmm, the core tension here is between theoretical physics and practical forecasting. The deterministic viewpoint ignores chaos theory and measurement limitations, while the chaotic viewpoint undermines any forecasting beyond 10 days. Both extremes are unhelpful for their operational needs. What they really need is a framework to assess predictability case-by-case.

  The user's identified four key distinctions that show impressive insight:
  1. Initial condition errors vs model errors (epistemic vs aleatoric uncertainty)
  2. Point predictions vs aggregate/statistical forecasts
  3. Model overconfidence vs reality 
  4. Predictability horizons

  Their real need is to convert these concepts into a step-by-step checklist. The procedure must be usable by high schoolers with basic math skills in 15 minutes per prediction. It should also clearly flag when to hand off decisions to stakeholders.

  For the frost date case study - their pride point - we'll likely have to show them why they've been lucky. The physics is clear: soil moisture memory creates some predictability, but day-specific frost timing has high chaos sensitivity. They'll need to shift to probability windows.

  The creek flood example is perfect for demonstrating threshold vs precision. Hydrological models have different error structures than weather models - soil saturation provides memory that extends predictability for binary outcomes.

  The 3-week assembly forecast will be our reality check. Beyond 2 weeks, dynamical models decay to climatology. We'll suggest they post reference forecasts instead to manage expectations.

  Most importantly, the procedure must include hard stop rules:
  - When uncertainty exceeds operational thresholds
  - When decisions involve value judgments
  - When only climatology is possible

  The conclusion should emphasize that no procedure can eliminate fundamental uncertainty - only characterize it honestly. Their maturity in wanting to acknowledge this limitation is commendable.
answer: |-
  Here's a procedure addressing your core distinctions and operational needs. It’s structured as a decision tree with explicit hand-offs, designed for a 15-minute team discussion per request. The key is **classifying uncertainty type** and **matching output format to predictability limits**.

  ---

  ### **Forecast Evaluation Procedure**  
  *(Tape this next to your whiteboard)*  

  **For each new prediction request, ask these questions in order:**  

  1. **DEFINE THE QUESTION**  
     - *Ask:* "Is this a **specific event** (e.g., frost on Oct 15) or an **aggregate/statistic** (e.g., 5 frost-free days in October)?"  
     - *Sufficient answer:* Clearly state which type it is.  
     - *Hand-off:* If unclear, ask requester to rephrase.  

  2. **CHECK FOR EXISTING DATA PATTERNS**  
     - *Ask:* "What do **historical records** (our logs, local almanacs) show? Is there a trend or stable range (e.g., first frost always between Oct 10–30)?"  
     - *Sufficient answer:* Plot 3+ years of data; calculate mean/range. If no data exists → **Stop. Output: "No historical basis"**.  

  3. **CLASSIFY THE UNCERTAINTY**  
     - *Ask:* **"Is the system chaotic?"**  
       - *Yes* if small changes cascade (weather, crowd size).  
       - *No* if inputs are stable (e.g., ticket sales with fixed enrollment).  
     - *Ask:* **"Are model errors systematic?"**  
       - Check past errors:  
         - If errors **grow then plateau** → initial measurement error.  
         - If errors **consistently skew** (e.g., always overestimating rain) → model bias.  
     - *Sufficient answer:* "Chaotic: Yes/No. Bias: Yes/No."  

  4. **CALCULATE PREDICTABILITY HORIZON**  
     - *Only for chaotic systems (e.g., weather):*  
       - *Rule:* Each 10x improvement in initial measurement precision buys **~2.5 extra forecast days** *(derived from Lyapunov time in mid-latitude weather)*.  
       - *Your calculation:*  
         1. Estimate current measurement error (e.g., temp ±1°C, rain ±2mm).  
         2. Ask: "If we had perfect instruments, error = ±0.1°C?" → 10x better = **+2.5 days**.  
         3. Max horizon = Current skill horizon (from past data) + days bought.  
       - *Sufficient answer:* "Horizon: X days."  

  5. **DECIDE OUTPUT FORMAT**  
     - *If specific event (e.g., frost date):*  
       - Beyond predictability horizon → **Output probability range** (e.g., "40% chance Oct 20–26").  
       - Within horizon → Output date ± error margin (e.g., "Oct 22 ±2 days").  
     - *If aggregate (e.g., flood days/month):*  
       - Output expected value + confidence interval (e.g., "3 days > flood threshold, 90% CI 1–5 days").  
     - *If no historical data/model → **Stop. Output: "Insufficient basis"**.*  

  6. **HAND OFF VALUE JUDGMENTS**  
     - *Ask:* "Does this require weighing **false positive vs. false negative** costs?" (e.g., evacuating vs. flood damage).  
     - *If yes → **Stop.** Flag for advisor/stakeholder with note: "Risk trade-off required."*  

  ---

  ### **What This Cannot Do**  
  - **Resolve philosophical debates** (determinism vs. chaos). It only quantifies practical limits.  
  - **Predict truly unprecedented events** (e.g., a hurricane where none occurred before).  
  - **Replace stakeholder risk preferences** – only show uncertainty.  
  - **Eliminate overconfidence** – rigor comes from tracking past errors.  

  ---

  ### **Applied to Your Cases**  
  *(Worked examples in 15-min team format)*  

  ---

  **Case 1: First Frost Date for Garden**  
  1. **Define:** Specific event (date).  
  2. **Historical data:** Oct 18–29 over past 4 years. Mean: Oct 23.  
  3. **Uncertainty:** Chaotic (weather). Past errors: ±3 days, no bias → initial condition error.  
  4. **Horizon:**  
     - Current precision: ±1.5°C from rooftop station.  
     - Perfect instruments (±0.01°C) = 100x better → buys 5 days (2.5 days per 10x).  
     - Max horizon = 7 days (current skill) + 5 = 12 days.  
     - Forecast lead time: 30 days → **Beyond horizon!**  
  5. **Output:** Cannot issue a date. **Output probability window:** "60% chance between Oct 20–28" (using historical mean/range).  
  6. **Value judgment?** No (gardener decides action).  
     - *Note:* Your past success likely combined climatology with luck. Beyond 12 days, a single date is unjustifiable.  

  ---

  **Case 2: April Creek Flood Threshold (Yes/No)**  
  1. **Define:** Aggregate (binary threshold exceedance).  
  2. **Historical data:** Floods occurred in 3 of last 10 Aprils when rain >100mm/month.  
  3. **Uncertainty:**  
     - Chaotic (rainfall), but soil saturation adds memory → less chaotic than frost date.  
     - Past errors: Under-predicted 2 floods → possible model bias in rain estimates.  
  4. **Horizon:** N/A (aggregate statistic).  
  5. **Output:**  
     - Target: Probability of exceeding threshold.  
     - Inputs: April rain forecast (statistical), soil moisture model.  
     - **Output: "40% chance of flood"** (based on forecast rain + history).  
  6. **Value judgment?** Yes (cost of false alarm vs. damage).  
     - **Hand-off:** Advisor/garden club decides action threshold (e.g., "Warn if >30% chance").  

  ---

  **Case 3: Courtyard Dry Enough for Assembly (3 Weeks Out)**  
  1. **Define:** Specific event (dry on Day X).  
  2. **Historical data:** Late Oct rainfall highly variable (0–200mm). No dry-day pattern.  
  3. **Uncertainty:** Strongly chaotic (precipitation hardest to predict).  
  4. **Horizon:**  
     - Current skill: ~7 days for rain.  
     - Perfect instruments buy +5 days → max 12 days.  
     - Lead time: 21 days → **Far beyond horizon!**  
  5. **Output:** Cannot issue forecast. **Do not post "shrug." Instead:**  
     - "Historical dryness probability: 70% (based on 30-yr climate data). Check back on [Date 10 days out] for forecast update."  
  6. **Value judgment?** No.  
     - *Key move:* Defer to climatology + commit to nearer-term update.  

  ---

  ### **Why This Works**  
  - **Settles arguments:** Converts "determinism vs. chaos" into measurable horizons and error types.  
  - **Exposes overconfidence:** Forces acknowledgment of predictability limits (e.g., frost date).  
  - **Clear hand-offs:** Flags when stakeholders must decide risks.  
  - **Uses your tools:** Leverages spreadsheets for error tracking and horizon math.  

  **Final note:** The deepest insight isn’t about physics—it’s that **forecasts are decisions to act, not truths.** Your procedure succeeds when it tells users *how* to use the numbers, not just the numbers themselves.
