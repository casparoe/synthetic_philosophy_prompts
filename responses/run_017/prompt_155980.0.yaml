  ### Raven Paradox Activity: "Evidence Auction"

  **Materials**  
  - Two opaque bags:  
    - Bag R (Ravens): 50 black tokens (no non-black)  
    - Bag NR (Non-Ravens): 98 white tokens (non-black), 2 black tokens  
  - Play chips: 100 per participant (14 sets)  
  - Bidding sheets, pens, tally board  
  - Timer  

  **Setup**  
  - Hypothesis: "All ravens are black."  
  - Participants bid chips to draw tokens from bags. They don't know token colors or scoring until after bidding.  
  - Bag R draws cost 20 chips (expensive, limited supply).  
  - Bag NR draws cost 1 chip (cheap, unlimited supply).  
  - Only 10 Bag R draws available *total* (group scarcity).  

  **Rules**  
  1. Each round, participants secretly bid chips for one draw (either Bag R or Bag NR).  
  2. Highest bidder for Bag R pays bid and draws (if supply remains). Tie? Random selection.  
  3. All Bag NR bidders pay their bid and draw (no supply limit).  
  4. Record draws (e.g., "R: black", "NR: white", "NR: black").  
  5. After 5 rounds, scoring revealed:  
     - Black raven (R+black): **10 points**  
     - White non-raven (NR+white): **1 point**  
     - Black non-raven (NR+black): **0 points**  

  **Timeline**  

  | Phase          | Minutes | Participant Actions                                                                 |  
  |----------------|---------|-----------------------------------------------------------------------------------|  
  | **Setup**      | 5       | Receive chips. Hear: "Buy observations to test 'All ravens are black.' Bags cost different amounts." |  
  | **Bidding**    | 20 (4x5min rounds) | Each round: Bid secretly for Bag R or Bag NR. Winners draw tokens and record results. |  
  | **Scoring**    | 10      | Learn scoring. Calculate points: R+black=10, NR+white=1, NR+black=0. Tally scores. |  
  | **Debrief**    | 20      | Discuss patterns: Why did some buy NR? Why do white shoes *technically* confirm? |  

  **Debrief Guide**  
  1. **Cost vs. Yield**: Ask:  
     - *"Who paid more for ravens? Why?"* → They’re rare/scarce.  
     - *"What did a white shoe (NR+white) give you?"* → 1 point (weak but real confirmation).  
     - *"Was the shoe a 'better deal' per chip?"* Calculate:  
       - NR: 1 chip → 1 point (if white) or 0 (if black). Avg. yield: **0.98 points/chip** (since 98% white).  
       - R: 20 chips → 10 points → **0.5 points/chip**.  
       → Shoes *are* more efficient per chip... but low absolute value.  

  2. **The Paradox Sting**:  
     - **Logic**: Note: *"All ravens are black" = "Anything non-black must be a non-raven."*  
       - White shoe (non-black + non-raven) confirms the logical equivalent.  
     - **Discomfort**: Ask: *"Why hesitate to buy shoes despite the math?"*  
       → White shoes are *weak* evidence (98% of NR draws confirm, but ravens are the *only* thing that can *disprove* the hypothesis).  
     - **Tiny Numbers**: Stress:  
       - 2% of NR draws (black shoes) give 0 points → Wasted chips.  
       - Raven draws *guarantee* 10 points but drain chips fast.  

  **Predictable Problems & Fixes**  
  - **Problem**: Everyone overspends on Bag R, ignoring NR.  
    **Fix**: Restrict Bag R supply (only 10 total draws). Scarcity forces NR bids.  
  - **Problem**: Post-scoring frustration over "wasted" NR bids.  
    **Fix**: Emphasize *during debrief*: "This is the paradox! Why *should* a shoe count?"  
  - **Problem**: Math anxiety during scoring.  
    **Fix**: Use round numbers (e.g., "98% of non-ravens are white").  

  **What the Game Can’t Capture**  
  The game quantifies confirmation but can’t replicate **why our intuition rejects the shoe**. You must say:  
  > *"In real life, we *know* shoes don’t affect ravens. But logic says they must count—even minimally. That gap between math and gut is the paradox’s heart."*  

  **Outcome**: Participants bid big on ravens early (scarcity fear), then "settle" for shoes. Post-scoring, they *see* shoes add points but feel cheated by the tiny yield—mirroring the paradox. The cost structure highlights efficiency (shoes/chip) vs. power (ravens/evidence).
