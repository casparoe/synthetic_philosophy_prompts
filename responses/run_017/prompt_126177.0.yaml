prompt: |-
  I am in the fourth year of a philosophy PhD, and the chapter I am currently failing to write is about explanation in the social sciences — specifically about when it is legitimate to cite a social-level fact (a rate, a structure, a norm, an institution, a climate of opinion) as part of the explanation of what individuals do, as opposed to treating such facts as mere shorthand for a story about those individuals. My supervisor treats the question as closed in favour of some form of methodological individualism; a friend in the sociology department does network modelling and treats it as a pseudo-problem about levels of description. I do not want either of those answers. What I want is to stop flip-flopping: I notice that I permit some social-level explanations and gag at others, and I cannot say what the difference is. So please do not give me a literature survey, a reading list, or citations — I can find those myself. Give me the principle, stated precisely enough that I could apply it to a case we have not discussed, and tell me honestly which of my verdicts it cannot save.

  Here are my verdicts, as concretely as I can state them. (1) A modeller explains a city's residential sorting by giving each household a mild individual-level threshold — move if fewer than about a third of your immediate neighbours are like you — and showing that the macro pattern follows. Verdict: a paradigm of good explanation; nothing social-level does any causal work beyond the individuals' thresholds. (2) An urban economist explains rising house prices by the fall in average household size. Verdict: fine, but I want to say this is not an instance of the thing I am worried about at all: it is aggregative bookkeeping, arithmetic over individual-level facts, and calling it a social-level cause would be a category mistake. (3) A public-health paper explains low rates of walking to work in one district by the street-network layout: the grid has no through routes to the centre, so walking is infeasible for nearly every origin–destination pair. Nobody's beliefs or desires differ between the districts; what differs is what the built arrangement makes available. I call these *affordance explanations*, and my verdict is that they are fine. (4) A Durkheim-style explanation of a suicide-rate differential between two religious groups in terms of the weaker social integration of one of them. Verdict: I want to allow it — I would hate to have to call a century of social research confused — and yet I cannot produce the mechanism: I cannot point to the individuals whose integration was weaker and whose despair was thereby greater. (5) Hearts are there because pumping blood circulates oxygen. Verdict: no problem at all. (6) The punishment system has the shape it has because it maintains social solidarity. Verdict: I gag, even though it is the same sentence form as (5) — and note that I would stop gagging if a selection story were supplied, e.g. that polities whose punishment systems lost cohesion were conquered or replaced. (7) The spirit of the age turned against the regime; neoliberalism produced the rise in precarious work; the market decided. Verdict: I gag; these feel like redescription with a capital letter. (8) Investment in an industry falls because a published index crosses a threshold, when everyone knows that everyone else watches that index and everyone knows the others know it too. I call these *tracked variables* — social-level quantities that individuals respond to precisely because they are public and mutually known to be watched. Verdict: I allow this one, and I cannot say why it differs from (7). (9) The case I go back and forth on: a currency collapses because enough people expect it to collapse, where each person's expectation is largely a response to what they expect others to expect, and the object everyone is tracking is the aggregate outcome of everyone's own behaviour. I have argued myself into both corners on this and cannot settle.

  My tentative principle is a test of in-principle replaceability: a social-level explanation is in good standing if and only if there could in principle be an individual-level mechanism story — beliefs, desires, opportunities, and interactions — that would do the same explanatory work, where the story need not be known, filled in, or even statable in our current vocabulary; anything not so replaceable is either bookkeeping or mysticism. I suspect this is broken in both directions: it looks too permissive, since a determined theorist can always sketch a mechanism for the spirit of the age, and too restrictive, since neither the street layout in (3) nor the tracked index in (8) seems replaceable by a beliefs-and-desires story without loss of explanatory power. Please test it against my cases, then repair it or replace it. I would like: the resulting account stated clause by clause, each clause paired with the case that motivates it, including any clause you need only to save one verdict; its verdict on (9); its verdicts on at least two cases I have not listed, of which the first should be a network-topology explanation (a behaviour spreads because of the degree distribution of the contact network, or because a few weak ties bridge otherwise separate clusters — a structural property that no individual has beliefs about) and the second is yours to choose; and an honest statement of which of my verdicts the account cannot accommodate, with the trade-off made explicit — I would rather overturn one verdict than accept an ad hoc clause per case, but I want to see what the overturning costs. Finally, please flag anywhere I have misdescribed what one of these explanations is actually doing, i.e. anywhere two cases I have treated as the same shape are not. A thousand to fifteen hundred words is fine; precision matters more to me than coverage.
reasoning: |-
  Okay, the user is a fourth-year philosophy PhD student struggling with a chapter on explanation in social sciences. They need a precise principle to distinguish legitimate social-level explanations from those that are merely shorthand for individual-level stories. They've provided nine concrete cases with their intuitive verdicts and a tentative principle of "in-principle replaceability" which they suspect is flawed.

  First, I need to understand their core dilemma: they reject both methodological individualism (supervisor's view) and levels-of-description dismissal (sociologist friend), seeking a principled distinction that matches their mixed intuitions. Their tentative principle fails because it's both too permissive (allows "spirit of the age" explanations via sketchy mechanisms) and too restrictive (can't handle affordances like street layouts or tracked variables).

  Examining their cases reveals three explanation types they accept: computational aggregations (1-2), affordances (3), and coordination devices (8). They reject reified abstractions (7) and struggle with feedback loops (9) and structural effects (4,6). Their gag reflex seems triggered by explanations that anthropomorphize social constructs or lack clear causal anchors.

  The key insight is distinguishing between causal mediators (which must be individual-accessible) and causal constraints (which can be emergent). I'll propose a two-part principle: 
  1) Social facts can only enter explanations as constraints (not causes), meaning they enable/disable individual actions without doing the causing. 
  2) These constraints must be epistemically accessible to individuals through their subjective states (beliefs/perceptions). 

  This handles their cases well: Street layouts (3) physically constrain movement; tracked indexes (8) are perceived constraints. It rejects Durkheim without mechanisms (4) and "spirit of age" (7) by requiring constraint accessibility. For the currency collapse (9), it accepts since expectations are accessible constraints. 

  Notably, it overturns their tolerance for Durkheim (4) - but this trade-off seems worthwhile as it avoids ad-hoc fixes. Network topology explanations pass if structural constraints are perceptible (e.g., actually seeing cluster bridges), not just modelled. 

  The user might resist abandoning Durkheim, but the principle's coherence justifies this cost. I should emphasize that "constraint" isn't metaphorical - it must have concrete purchase on action possibilities. This maintains naturalism while granting social facts real explanatory weight.
answer: |-
  Here is a principled distinction, built from your intuitions and tested against your cases. The core idea is that **social-level facts can legitimately explain individual actions *only* when they function as *causal constraints* on individual agency, and these constraints must be *epistemically accessible* to the individuals whose actions are being explained.** This avoids reification while acknowledging irreducible structural realities.

  **The Principle (Causal Constraint + Epistemic Access):**

  1.  **Constraint Role:** The social-level fact (S) must function as a *causal constraint* shaping the *space of possible actions or outcomes* for individuals, not as an agent or direct cause. It sets boundaries, creates enablements/disablements, alters costs/benefits, or defines coordination points. *(Motivated by Cases 3, 5, 8)*
  2.  **Epistemic Access:** The constraining force of S must be *operationally effective* for individuals *through their subjective states* (beliefs, perceptions, knowledge, affordance perception). S must be something individuals *can* (and often *do*) perceive, know about, believe in, or respond to *as a constraint*, given their cognitive capacities and epistemic position. *(Motivated by Cases 3, 7, 8; Distinguishes 4/6 from 5)*
  3.  **Non-Reification:** S cannot be invoked as a causal *agent* with its own goals, intentions, or powers independent of individual actions and beliefs. Explanations violating this are illicit reifications. *(Motivated by Cases 6, 7)*
  4.  **Mechanism Agnosticism (Clarification):** The *specific* cognitive or behavioral mechanisms by which individuals respond to S need not be fully specified or known *in detail* for the explanation to be legitimate. However, the *form* of access (e.g., perception, common knowledge, belief) must be plausible and non-mysterious. *(Clarifies your tentative principle; Motivated by Cases 3, 8, 9)*

  **Application to Your Cases:**

  1.  **Residential Sorting (Threshold Model):** **Allowed.** *Constraint:* The *aggregate pattern* isn't the constraint; the constraint is each individual's *threshold rule* (an individual-level disposition). S (the pattern) is the *outcome*, not the constraint. Your verdict stands, but it’s individual-level, not social-level constraint. *(Fits via Role: Not actually using S as constraint)*
  2.  **House Prices & Household Size:** **Allowed (but irrelevant).** As you note, this is aggregative bookkeeping. S (avg. size) is a summary statistic, not a causal constraint guiding action. It explains the price *change* via arithmetic, not individual buying/selling decisions. *(Fits: Not invoking S as constraint on action)*
  3.  **Street Layout (Affordance):** **Allowed.** *Constraint:* The physical street network *causally constrains* possible walking routes (disablement). *Access:* Individuals perceive/immediately experience the layout's navigability (or lack thereof) in planning routes. The constraint operates through their perception of feasibility. *(Fits Constraints 1 & 2)*
  4.  **Durkheim Suicide (Social Integration):** **Rejected.** *Constraint:* Weak integration *might* constrain social support (an affordance). *Access:* **Problem.** How does "weak social integration" *as a macro fact* become an *operationally effective constraint* on the *individual's* subjective state leading to suicide? What do they perceive, know, or believe *about the macro level* that triggers despair? The mechanism linking macro-structure to individual psychology is opaque and lacks plausible epistemic access. Calling it a "climate" risks reification. *(Violates Constraint 2: Epistemic Access unclear/implausible; likely violates 3)* **Overturned Verdict.**
  5.  **Hearts Pump Blood:** **Allowed (irrelevant analogy).** This is biological function, not social explanation. The *function* explains existence via past selection. The "constraint" is evolutionary pressure (acting on populations/organisms). Epistemic access is irrelevant here. Useful analogy for function, but distinct domain. *(N/A - Different domain)*
  6.  **Punishment Maintains Solidarity:** **Rejected (without selection).** *Constraint:* "Social solidarity" is invoked as a *goal* the system serves, implying agency/purpose at the social level. *Access:* Unclear how "solidarity" *as a macro state* constrains the designers/maintainers of the system *through their beliefs*. It reifies "society" as having needs. **Allowed with Selection Story:** Historical selection *is* a constraint (failed systems disappear). *Access:* Participants/designers may *believe* their system promotes order/stability/survival (even if "solidarity" is fuzzy). *(Without selection: Violates Constraint 3 (Reification) & 2 (Access). With selection: Allowed via Constraint 1 (Selection pressure) & 2 (Beliefs about system survival).)*
  7.  **Spirit of Age/Market Decides:** **Rejected.** *Constraint/Reification:* Terms like "spirit of the age" or "the market" are invoked as causal agents ("turned against", "produced", "decided"). *Access:* While individuals might hold vague beliefs about "mood" or "market sentiment," these concepts are too amorphous and reified to function as *specific, operationally effective constraints* guiding concrete actions in a non-circular way. They redescribe the outcome. *(Violates Constraint 3 (Reification) & Constraint 2 (Lacks specific operational access))*
  8.  **Tracked Index:** **Allowed.** *Constraint:* The index value crossing a threshold *defines a coordination/equilibrium point*. *Access:* Crucially, it is *common knowledge* that everyone watches and responds to this *public signal*. Individuals *believe* others will act based on it, making their own response rational. The index's status as a *public, mutually known focal point* provides the epistemic access. *(Fits Constraints 1 & 2 perfectly - S is a clear coordination constraint known/believed by all)*
  9.  **Currency Collapse (Expectations):** **Allowed.** *Constraint:* The *expected* collapse (or the belief about others' beliefs) *creates a disabling constraint* on holding the currency (it becomes rational to sell). *Access:* Individuals form beliefs about others' expectations (via news, signals, common knowledge of the situation). The *mutually believed expectation of collapse* becomes a self-fulfilling prophecy, operating as a constraint through individual beliefs. Similar to (8) but with a self-referential object. *(Fits Constraints 1 & 2: Beliefs about others' beliefs create the disabling constraint)*

  **New Cases:**

  1.  **Network Topology (Virus Spread):** "The behavior spread rapidly due to the scale-free network structure (many hubs)." **Assessment:** *Constraint:* The network structure *causally constrains* possible transmission paths (enablement). *Access:* **Problematic.** Unless individuals have *beliefs or perceptions* about the *global* network structure (degree distribution, presence of hubs) that guide their *specific* susceptibility or transmission behavior, the constraint lacks operational epistemic access. They might respond to *local* connectivity (number of contacts they *see*), but not the global property. **Verdict:** **Rejected as a direct explanation of individual adoption/transmission.** It's a *mechanism* explanation for the *pattern* of spread, not (without further individual-level mediation) an explanation of why *specific individuals* performed the behavior. *(Violates Constraint 2: Global topology isn't epistemically accessible to guide individual action.)* **However:** If the explanation is "The behavior spread *to this individual* because they were connected to a hub *and they perceived that hub as influential*", then it *is* allowed (access via perception/belief about the *local* node property).
  2.  **Institutional Rule:** "Fewer applicants applied to the grant because the new eligibility rules explicitly excluded part-time researchers." **Assessment:** *Constraint:* The institutional rule *causally disables* part-time researchers from applying. *Access:* The rules are publicly published documents. Potential applicants *read and understand* these rules (or hear about them), forming the belief "I am ineligible." This belief directly constrains their action (not applying). **Verdict:** **Allowed.** Clear constraint (disablement) with direct epistemic access (published rules, belief formation). *(Fits Constraints 1 & 2)*

  **Overturned Verdict & Cost:**

  *   **Overturned:** Case 4 (Durkheim Suicide). The account cannot accommodate your desire to allow it without a plausible mechanism for *epistemic access*. The cost is rejecting a century of research *if that research relies solely on macro-to-macro or opaque macro-to-micro links*. The trade-off is accepting that explanations relying *solely* on macro-structural properties without specifying how those properties become *meaningful constraints on individual cognition and action* are incomplete or illegitimate for explaining individual behavior. It demands microfoundations *for the constraint's operational effectiveness*, not necessarily for the entire aggregate pattern.

  **Misdescriptions Clarified:**

  *   **Case 1 vs. Case 3/8:** You treated the threshold model (1) as analogous to affordances (3) or tracked variables (8). It's not. Case 1 is a *generative mechanism* explaining an *outcome pattern* from individual rules. The *pattern* (S) isn't *doing* any constraining in the explanation. Cases 3 & 8 use S *itself* (layout, index) as the constraining factor *within* the explanation of individual action/outcome.
  *   **Case 5 vs. Case 6:** The functional forms are similar, but the *explanatory context* differs crucially. Biological function explains *existence* via past selection. Social function explanations (like Case 6 without selection) often attempt to explain *maintenance* or *shape* via *current* purpose imputed to the system, inviting reification. The selection mechanism (when present) rescues it by providing a *causal history* constraint, analogous to evolution.

  **Summary Principle Restated:** A social-level fact (S) legitimately explains individual actions or their aggregate outcomes if and only if:
      **(A)** S functions as a *causal constraint* (enablement/disablement, cost/benefit shift, coordination point) on the possibilities for individual action, and
      **(B)** The constraining force of S is *operationally effective* through the *epistemically accessible* subjective states (perceptions, beliefs, knowledge) of the individuals whose actions are being explained, and
      **(C)** S is not reified as a causal agent with independent intentions or powers.

  This principle preserves your intuitive acceptances (Affordances, Tracked Variables, Currency Expectations, Institutional Rules), rejects your intuitive rejections (Spirit of Age, Reified Function), clarifies the status of aggregations and pattern-generating mechanisms, and provides a clear (though demanding) reason to reject Durkheimian explanations *without microfoundations linking the macro property to individual cognition*. It replaces "in-principle replaceability" with a demand for *operational effectiveness via epistemic access* at the point of action.
