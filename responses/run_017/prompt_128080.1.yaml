  **DEPARTMENT FOR DECISION ARCHITECTURE AND PROBABILISTIC COMPLIANCE (DAPC)**  
  **Consultation Draft: Code of Practice CP-117**  
  **Mandatory Single-Probability Filing for Uncertain Outcomes**  
  *Issued under the Certainty in Choices Act (Provisional Measures)*  

  ---

  **1. Preamble**  
  1.1. Uncertainty in probabilistic reporting impedes rational choice, burdens decision systems, and generates avoidable agent distress.  
  1.2. This Code eliminates the reporting of "unknown" probabilities, ensuring all decisions operate within a filed, auditable probability framework.  
  1.3. Compliance ensures agent coherence and aligns preferences with the axioms of subjective expected utility.  

  **2. Definitions**  
  2.1. **Uncertain Outcome**: An event for which no reliable frequency data or consensus probability exists.  
  2.2. **Filed Probability (FP)**: A single numerical value (0 ≤ *p* ≤ 1), issued or approved by DAPC, representing the binding likelihood of an Uncertain Outcome.  
  2.3. **Decision Agent (DA)**: Any entity expressing preferences over acts with Uncertain Outcomes.  
  2.4. **Probability Gap**: The absence of a Filed Probability prior to DAPC intervention.  

  **3. Core Stipulation Requirement**  
  3.1. Where an Uncertain Outcome exists, the responsible entity (e.g., clinician, insurer, urn-operator) **must** request a Filed Probability from DAPC.  
  3.2. The FP replaces all qualitative descriptors (e.g., "unknown," "variable," "unquantified") in communications to DAs.  
  3.3. Once filed, the FP is binding for all decisions involving the outcome until superseded under Section 7.  

  **4. Worked Examples**  
  *Example A: Medical Consent*  
  - *Prior State*: "Response rate for Treatment B: No reliable estimate available."  
  - *DAPC Action*: FP issued: *p* = 0.63 (see Section 7.1 on generation).  
  - *Revised Consent*: "Response rate for Treatment B: 63% (DAPC Ref: FP-1142)."  

  *Example B: Ellsberg-Type Urn (Standard Reference Case)*  
  - *Scenario*: Urn contains 30 red balls, 60 balls either black or yellow (unknown ratio).  
  - *Probability Gap*: Likelihood of drawing black (*p_b*).  
  - *DAPC Action*: FP issued: *p_b* = 0.35 (therefore *p_y* = 0.65).  
  - *Compliance Effect*:  
    - Bet on Red (known *p_r*=0.33) vs. Bet on Black (FP *p_b*=0.35): Preference for Red permitted (0.33 < 0.35).  
    - Bet on {Black or Yellow} (*p_b*+*p_y*=1.00) vs. Bet on {Red or Yellow} (*p_r*+*p_y*=0.33+0.65=0.98): Preference for {Black or Yellow} permitted (1.00 > 0.98).  
    - *Coherence Achieved*: Preferences now derivable from single probability measure (FP *p_b*=0.35).  

  *Example C: Insurance Pricing*  
  - *Scenario*: Novel cyber-risk with no loss history.  
  - *Prior State*: "Risk premium: Undetermined."  
  - *DAPC Action*: FP issued: *p_breach* = 0.082.  
  - *Outcome*: Premium set at £12,400 p.a. using FP. Market consistency achieved.  

  **5. Audit and Enforcement**  
  5.1. **Preference Consistency Testing**:  
     - DAs’ choices across all acts involving an FP **must** satisfy the Sure-Thing Principle.  
     - *Test Protocol*: Where acts *A*, *B*, *C* share a common outcome sub-component, preference *A* > *B* must hold if *C* is added identically to both. Non-compliance triggers Agent Re-education (Schedule 3).  
  5.2. **FP Stability Clause**:  
     - Once a decision is taken using an FP, the FP **cannot** be revised for that decision context.  
     - *Rationale*: Revision would expose retrospective preference incoherence, undermining decision integrity and public trust.  

  **6. Handling Informational Asymmetry**  
  6.1. Where DAs express aversion rooted in others possessing superior knowledge ("They know the urn!"), DAPC will:  
     - Register the *Informational Gap* (IG) between the DA and better-informed parties.  
     - Apply an *IG Surcharge* to the FP, increasing the FP’s stated probability by up to 0.2 to account for "distrust premiums."  
  6.2. **FP Generation Protocol**:  
     - Where no data exists (e.g., urn composition), FPs shall be generated via DAPC-certified quantum random number generators (QRNGs).  
     - *Note*: This acknowledges concerns about urn-fillers’ strategic behavior by removing human agency.  

  **7. Consultation Questions**  
  7.1. Should FP generation use QRNGs (current standard) or a fixed algorithm (e.g., *p* = *e*<sup>-1</sup> ≈ 0.367)?  
  7.2. Is the IG Surcharge cap (0.2) sufficient to neutralize distrust?  
  7.3. Should FPs expire after 5 years to permit "planned consistency resets"?  

  ---

  **APPENDIX: EXTRACT FROM DISSENT BY THE COLLEGIUM FOR ROBUST DECISION PRACTICE (CRDP)**  
  *Submitted in response to Consultation Draft CP-117*  

  > "CP-117 mistakes mathematical convenience for epistemic virtue. Mandating a single *p* for Uncertain Outcomes ignores the essence of ambiguity: **the absence of a knowable probability measure**. Agents rightly treat truly uncertain outcomes differently than risky ones with known odds. The Ellsberg urn demonstrates this is normatively rational: agents hedge against the *uncertainty itself*, not just low probability.  

  > CRDP proposes:  
  > - **Uncertain Outcomes** be scored using the *minimum plausible probability* over the possible range (e.g., for black in the urn: min *p_b* = 0, max *p_b* = 0.66).  
  > - Acts evaluated by their worst-case performance across this range (maximin expected utility).  
  > - Reporting of **Probability Intervals** (PIs) instead of FPs.  

  > This recognizes ambiguity aversion as a rational response to missing information. Filing *p_b*=0.35 fabricates knowledge where none exists, coercing coherence to a flawed model. A decision procedure that rejects ‘I don’t know’ fails precisely when uncertainty matters most."  

  **DAPC RESPONSE TO CRDP DISSENT**  
  > "CRDP’s proposal violates Core Principle 3.1 (Single Probability Filing). A ‘Probability Interval’ cannot be filed; it is computationally incompatible with standard choice architectures. Maximin scoring encourages excessive caution, paralyzing decisions. ‘Minimum plausible probability’ (often 0) renders all novel ventures untenable. CRDP’s framework is rejected as non-compliant with the Certainty in Choices Act."  

  ---  
  *Consultation closes 60 days from publication. Submit via Form DAPC-C117.*
