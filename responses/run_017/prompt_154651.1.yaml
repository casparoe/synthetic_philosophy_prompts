prompt: |-
  I write real-time control software, and my team has now had the same argument perhaps a dozen times in different guises. I would like to know whether the thing we keep arguing about has a settled name and an established way of being carved up, or whether we are reinventing, badly, something that already exists. I am not after a reading list; I am after the carving.

  The recurring shape is this. We have a module with a precise specification: it takes inputs of a certain kind and returns outputs, and the specification fixes the correct answer for every input, including inputs the device will never in fact receive. Then someone proposes a substitute, and we argue about whether the substitute "does the same thing" or merely "produces the same answers." Four cases, with the verdicts my team actually reached:

  (1) A clean reimplementation in a different language, using entirely different internal steps and intermediate quantities, correct across the whole specified range including values we never test. Verdict, uncontested: yes, it does the same thing.

  (2) A learned approximator fitted to the original's behavior. It matches within tolerance across the operating range, and it also generalizes correctly to inputs far outside anything it was fitted on, including inputs we construct only in order to stress it. Nothing inside it corresponds to any intermediate quantity named in the specification. Verdict, contested: I say yes; a colleague says it computes nothing at all, it estimates.

  (3) A precomputed table covering every input the device will encounter during its service life, plus a fallback that behaves safely outside that set. It agrees with the original on every input that will ever actually occur. Verdict, uncontested the other way: no, it is playing back answers.

  (4) A table like (3) together with a small routine that detects an off-table input and, on those occasions, derives a new entry and caches it. Verdict: we cannot agree, and we cannot say what would settle it. A related variant: a system containing a real copy of the original, buried under a great deal of idle machinery, which consults that copy whenever queried.

  What I think I see is that our verdict tracks neither agreement on actual inputs — (3) agrees perfectly and still loses — nor correspondence between the internal steps and the specification's steps, since (2) has none and often wins. What it seems to track is how the substitute would behave on inputs that have not occurred and will not occur, and on worlds slightly unlike ours in ways that do not change the function itself. Two further features bother me. First, the verdict is retrospective: we only learn whether a substitute really did the thing when an input arrives from outside the range we designed for, and until then we are guessing. Second, the verdict seems to shift with what we want it for — certification, assigning blame after a failure, explaining the device to a regulator — even when the box on the bench is unchanged.

  So my questions. Does the distinction we are reaching for have an established name? People have gestured me toward two neighbouring debates — one about whether a system that reproduces a process's effects thereby does the thing itself or only imitates it, and one about whether any physical system can be said to realize any formal description you like — and neither seems to be quite ours, though I cannot say precisely why. If one of them is ours, say which and say where the fit is imperfect; if ours sits between them, say that. If nothing established fits, coin a term and define it.

  Either way, I want more than a label. I want to know: what exactly the property is; how it differs from mere agreement on all actual inputs, from robustness, and from generalizing to new cases; whether it is a property of a system alone or of a system together with a range of inputs and a purpose; and how it should classify cases (4) and the buried-copy variant, which I offer as boundary cases. If part of our disagreement turns out to be only about words, tell me which part.

  One reason I care. The same move appears when people argue about brains: someone claims that if each neuron were replaced by a small device that does what that neuron does, the result would still think, and someone else replies that the replacement would only be a playback of what a brain does. That exchange seems to me to turn on exactly our distinction, and I would like to know whether there is a real distinction there or only our own unclearness, projected onto a bigger question.
reasoning: |-
  We are dealing with a distinction that has deep roots in philosophy of mind, computer science, and cognitive science. The central issue is about the nature of implementation, realization, or genuine computation versus mere simulation or playback.

  The property you are reaching for is often called **implementation** (in the sense of a physical system implementing a computation) or **realization** (of a functional specification). The key idea is that the system must not only produce the same outputs for the same inputs, but it must do so in a way that is **counterfactually robust** and **explains** the behavior by the same causal structure as specified.

  However, I think the most precise term for the distinction you are after is **strong equivalence** versus **weak equivalence** in the context of computational systems, but that usually refers to the same algorithm (same steps). Your case (2) breaks that.

  Alternatively, we might frame it as **computational realism** versus **instrumentalism**. The real question is whether the system is actually performing the computation (with the internal states having causal efficacy) or merely producing outputs that match.

  But I think the most fitting concept is **realization of a functional state**. In functionalism (philosophy of mind), a mental state is defined by its functional role (causal relations to inputs, outputs, and other internal states). A system realizes that functional state if it has internal states that play the same causal roles.

  Let me break it down:

  1. **Case (1): Clean reimplementation** - This is unproblematic because it has the same functional organization. The internal steps are different but they are steps that play the same causal roles (i.e., they are functionally equivalent). The system is realizing the same computation.

  2. **Case (2): Learned approximator** - The disagreement arises because the approximator does not have internal states that correspond to the intermediate states in the specification. It might be that the approximator (e.g., a neural network) has internal representations that are not isomorphic to the original but still capture the same function. However, if it generalizes correctly to novel inputs (even outside the training set) and does so by virtue of having learned a model that captures the underlying function (even if the representation is different), then it might be seen as realizing the function. But if it's just a statistical pattern without any causal structure that mirrors the computation, then it might be seen as merely estimating.

     The key is: does the system have internal states that are causally responsible for the output and that play the same functional role as the intermediate states in the specification? In the neural network, the hidden layers might be seen as implementing the intermediate steps, but they are not explicitly designed to match the specification's steps. However, if the network has learned to compute the function in a way that is structurally similar (even if not identical) then it might be acceptable. But if it's a black box that just happens to give the right answers, then it might not.

     But note: the specification might not require a particular intermediate representation. If the specification only specifies the input-output behavior and not the intermediate steps, then any implementation that produces the same outputs is acceptable. However, in your case, the specification does fix the intermediate quantities? You say: "the specification fixes the correct answer for every input, including inputs the device will never in fact receive." But does it also specify the intermediate steps? If it does, then the implementation must have states that correspond to those intermediates.

     You say: "Nothing inside it corresponds to any intermediate quantity named in the specification." So the specification names intermediates? Then the learned approximator does not have those intermediates. But then, why is it acceptable to some? Because the specification might be seen as over-specifying? Or because the intermediates are not part of the contract?

     This is the crux: the specification might be at two levels:
     - Level 1: The input-output function (extensional).
     - Level 2: The algorithm (with intermediate states).

     If the specification is only at level 1, then any implementation that matches the input-output function (including the table) is acceptable. But you say that the table (case 3) is rejected. So the specification must include level 2? Or is there something else?

     I think the issue is about **causal structure** and **counterfactual resilience**.

  3. **Case (3): Precomputed table** - This fails because it does not compute the outputs; it merely plays them back. It lacks the causal structure that would support counterfactuals: if an input had been different (even one that is never going to occur), the table would not produce the correct output for that new input (unless it was precomputed). The fallback might be safe, but it does not compute the function in the way the specification requires.

  4. **Case (4): Table with dynamic extension** - This is a hybrid. For inputs in the table, it plays back. For new inputs, it computes and caches. The issue is: does this system, as a whole, compute the function? It is not a pure playback because it can handle novel inputs by computing. However, for the precomputed inputs, it is just playing back. But note: the original specification might require that every output is computed (by the specified algorithm) at the time of the input. The caching system does not do that for the precomputed ones. It did the computation at an earlier time (or by a different process) and then just retrieves.

     The buried-copy variant is even clearer: it contains the original, so it is computing the function by the same algorithm, but it might be doing it lazily or only when needed. But if it uses the original algorithm when it needs to, then it is computing.

  The property we are after is **genuine computation** versus **simulation/playback**. It is not just about input-output behavior, but about the **process** that generates the output.

  But how to define it? I propose:

  A system S **genuinely computes** a function F (as specified by an algorithm A) if and only if:

  1. **Correctness**: For every input in the domain of F, S produces the output specified by F.
  2. **Process faithfulness**: The causal process in S that leads from input to output mirrors the steps of algorithm A. That is, there are internal states in S that correspond to the intermediate states of A, and the transitions between these states correspond to the steps of A.

  But in your case (1), the steps are different (different language, different intermediates) but you accept it. So we must relax (2). Instead, we might require that the system implements the same algorithm in the sense of **computational equivalence** (same asymptotic complexity, same steps in a more abstract sense). But that is not always required.

  Alternatively, we can use a notion of **functional equivalence**: the system has internal states that play the same functional roles as the states in the algorithm. The algorithm is defined by a set of states and transitions. The implementation must have states that are causally connected in the same way.

  But for the learned approximator (case 2), there are no states that correspond to the intermediates. So we might have to drop the correspondence and require only that the system computes the function by some algorithm that is robust.

  I think the key is **counterfactual robustness**. The system must be able to handle not only the actual inputs but also counterfactual inputs. Moreover, the way it handles them must be by a process that is sensitive to the features of the input in the same way as the original algorithm.

  But note that the table (case 3) would fail on a counterfactual input that is not in the table (even if that input never occurs). The table does not have the mechanism to compute for arbitrary inputs; it only has a fixed set.

  In case (4), the table with dynamic extension can handle counterfactual inputs by computing, so it is robust. But is the process the same? It uses a fallback algorithm that may or may not be the same as the original.

  So let me define:

  A system S **implements the function F** (as per the specification) if:

  - It produces the correct output for every input (in the domain of F) when given that input.

  But that would include the table (if the fallback is correct). So we need more.

  We require that the output is produced by a process that is **causally sensitive** to the input in a way that matches the algorithm. The algorithm describes how the input is transformed step by step into the output. In the table, the input is used only to look up a precomputed output; there is no transformation. In the dynamic table, for a new input, there is a transformation (the fallback routine), but for a cached input, there isn't.

  So the issue is: does the system, for every input, compute the output at the time of the input? The table (case 3) does not: it precomputed. The dynamic table (case 4) does for new inputs, but for cached inputs, it does not. So it's mixed.

  But what if the fallback routine is the original algorithm? Then for new inputs, it is the same as the original. For cached inputs, it is not. So the system as a whole does not always compute the output at the time of the input. However, the cached output was computed by the same algorithm at an earlier time. So the system relies on the fact that the computation was done (by the same algorithm) in the past. This is like caching in computing: we consider the system as still computing the function because the cache is just an optimization.

  Therefore, the critical point is: **the output must be causally derived from the input by a process that instantiates the algorithm (or an equivalent one) at the time of the query, or by a process that has previously instantiated the algorithm for that input and stored the result, but only if the storage is reliable and the algorithm was the same.**

  In the dynamic table case (4), if the fallback routine is the original algorithm, then the system is effectively using the same algorithm for every input, either at the time of the query or in the past. So it is acceptable.

  But what if the fallback routine is different? Then for new inputs, it uses a different algorithm. So it might not be acceptable.

  Now, what about the learned approximator? It does not precompute; it computes at the time of the input. But it uses a different internal process. However, if that process is robust and captures the same function, then it is a different implementation of the same function. But the specification might require a particular algorithm.

  So we must distinguish:

  - **Extensional equivalence**: same input-output behavior.
  - **Intensional equivalence**: same algorithm (same steps).
  - **Functional equivalence**: same functional organization (same causal roles for states) but possibly different implementation.

  In your case, the specification includes intermediate quantities, so it is intensional. Therefore, the implementation must have states that correspond to those intermediates and transitions that correspond to the steps.

  But then case (1) would be rejected because it has different steps? You accepted it. So the specification must be at a higher level of abstraction. The intermediates named in the specification are functional roles, not physical states. So any state that plays that role is acceptable.

  Therefore, the learned approximator (case 2) would be acceptable if it has internal states that play the same functional roles as the intermediates, even if they are not named the same and even if the representation is different. But you say it has no such intermediates. So it doesn't.

  Hence, the disagreement in case (2) might be about whether the hidden units in the approximator can be interpreted as playing the functional roles of the intermediates.

  But if the specification is very detailed (e.g., it requires that there is an intermediate state representing, say, a particular physical quantity in a control system), and the approximator does not have any state that represents that quantity, then it fails.

  Now, the term I propose for the property you care about is **algorithmic realization**. A system algorithmically realizes a specification if it has internal states and processes that are isomorphic to the algorithm described in the specification (at an appropriate level of abstraction).

  But that might be too strong. Alternatively, we can use **causal computational equivalence**.

  But let me try to formalize:

  Given a specification that includes an algorithm A (with inputs, outputs, and a sequence of operations on intermediate states), a system S **algorithmically realizes** A if:

  - There is a mapping from the inputs of S to the inputs of A.
  - There is a mapping from the outputs of S to the outputs of A.
  - There is a mapping from the internal states of S to the intermediate states of A (or to sets of intermediate states, allowing for parallelization, etc.).
  - The causal transitions in S correspond to the steps in A, such that if S is in a state s_i that maps to an intermediate state a_i, and receives input (or has an internal transition) that according to A should lead to a_j, then S transitions to a state s_j that maps to a_j.

  This is very strict and would require a step-by-step correspondence. Case (1) might fail if the reimplementation uses a different decomposition. But we can allow for a more abstract mapping.

  Another approach: **the system must satisfy the counterfactuals that the specification implies**. For example, if the specification says that intermediate state X should be Y when input is Z, then in the system, when input is Z, there must be an internal state that is Y (or corresponds to Y). And if we were to intervene on that internal state, it would affect the output as per the specification.

  This is a functionalist account.

  Now, the difference from mere agreement on actual inputs is that we care about counterfactuals. The difference from robustness is that robustness might only require that the system still works under perturbations, but not necessarily that it uses the same process. The difference from generalization is that generalization is about how the system behaves on new inputs, but again, it does not require the same internal process.

  The property is of a system relative to a specification (which includes the algorithm and the intermediate states) and a mapping from the system's states to the specification's states.

  Now, for the brain example: replacing each neuron with a device that does what the neuron does (i.e., same input-output behavior at the neuron level) would be like case (1) at the neuron level. But if the replacement is a table that plays back the outputs (case 3), then it would not be a real neuron. The brain example is more about whether the replacement device is doing the actual computation that the neuron does (which is part of a larger system) or just mimicking.

  In philosophy, this is the difference between **functional isomorphism** and **mere simulation**.

  To answer your questions:

  1. **Name**: I propose **algorithmic realization** or **causal-computational realization**. But note that in computer science, the term **implementation** is often used. However, to be precise, we might say **strong implementation** versus **weak implementation** (where weak is only input-output).

     Alternatively, in philosophy, **realization** is the term for when a physical system instantiates a functional description.

  2. **The property**: A system S realizes a computational specification (which includes an algorithm with intermediate states) if and only if:

     - S produces the correct outputs for all inputs (actual and counterfactual) in the domain.
     - There is a mapping between the internal states of S and the intermediate states of the algorithm such that the causal relations among the internal states of S mirror the formal relations among the intermediate states of the algorithm.

     This mapping must preserve the structure of the computation. This is a version of the **isomorphism** requirement.

  3. **Difference from agreement on actual inputs**: The table (case 3) agrees on actual inputs but fails on counterfactuals and does not have the causal structure.

  4. **Difference from robustness**: Robustness is about maintaining function under perturbations. Realization is about the mechanism. A robust system might use an entirely different mechanism.

  5. **Difference from generalization**: Generalization is about performance on new inputs. Realization might imply good generalization (if the algorithm generalizes), but a system might generalize without realizing the algorithm (e.g., a learned model that generalizes by a different method).

  6. **Is it a property of the system alone?** No, it is relative to a specification (which includes the algorithm and the intermediate states) and a mapping from the system's states to the algorithm's states.

  7. **Case (4)**: The table with dynamic extension: if the fallback routine is the original algorithm, then for the precomputed inputs, the system is using a cached result from a previous run of the algorithm. This is acceptable because the algorithm was run (by the same system) in the past. It is like an optimization. However, if the fallback routine is different, then for new inputs, it is not using the original algorithm, so it might fail the realization condition.

     The buried-copy variant: it contains a copy of the original and uses it when needed. This is a clear case of algorithmic realization because it uses the original algorithm for every input (either by cache or by direct computation). The caching is just an optimization.

     Therefore, case (4) with the same algorithm in the fallback should be considered as realizing the algorithm, but with caching. The variant with the buried copy definitely does.

  8. **The brain example**: The issue is whether the replacement devices are realizing the same functional roles as the neurons. If they are functionally isomorphic (same inputs causing same outputs in the same context, and having the same effect on downstream neurons), then the whole system would be functionally equivalent and thus would realize the same computation. But if they are just tables that play back the outputs without being sensitive to the exact input (as in case 3), then they are not. The brain example turns on whether the replacement is a genuine realization of the neuron's function or a mere simulation.

  9. **Part of the disagreement about words**: The disagreement in case (2) might be about whether the learned approximator has states that are functionally equivalent to the intermediates. Your colleague might be using a stricter notion of computation (e.g., that it must be symbolic) while you are allowing sub-symbolic. Also, the word "estimates" implies that it is not exact, but you said it is within tolerance. But the specification requires exactness? Or is the tolerance part of the specification?

     If the specification requires exact computation and the approximator is approximate, then it fails. But you said it matches within tolerance, so maybe the specification allows that.

     The core issue is the level of abstraction of the specification. If the specification includes the intermediate quantities as essential, then the approximator fails. If the specification is only input-output, then it passes. But you rejected the table (case 3) even though it matches input-output. So the specification must include the process.

     Therefore, the team might need to clarify the specification: does it specify only the input-output function, or does it also specify the algorithm?

     In practice, for safety-critical systems, the algorithm might be part of the certification.

  Conclusion:

  The distinction is between **realization** (or **implementation**) of the algorithm and **simulation** of the behavior. The property is **algorithmic realization** (or **causal-computational realization**). It is defined relative to a specification that includes an algorithm with intermediate states. The system must not only produce the correct outputs but also have an internal causal structure that is isomorphic to the algorithm's structure.

  For case (4): if the fallback routine is the same algorithm, then it is algorithmic realization (with caching). The buried-copy variant is algorithmic realization.

  For case (2): if the learned approximator does not have internal states that map to the intermediates, then it does not algorithmically realize the specification. It only simulates the behavior.

  But if the specification does not require particular intermediates (only input-output), then case (2) and case (3) would be acceptable. But you said the specification names intermediates, so it does require them.

  Therefore, the resolution might be that the specification should be clear about what is required: is it the input-output function, or is it the algorithm? If the algorithm is required, then case (2) fails. If not, then case (3) should be accepted. But your team rejects case (3) even though it matches input-output, so the algorithm must be part of the specification.

  So the real issue is: what is the specification? If it specifies the algorithm, then the implementation must follow it. If it doesn't, then the table is acceptable.

  But in safety-critical systems, the algorithm might be required for certification because it provides traceability and explainability. The table is not explainable in the same way.

  Therefore, the property you care about is **faithfulness to the specified algorithm**.
answer: |-
  Your recurring argument centers on a distinction that is well-recognized in philosophy of computation, cognitive science, and formal verification, though it lacks a single universally settled name. The core issue is whether a substitute system **realizes** the original specification (i.e., performs the computation itself) or merely **simulates** its behavior (i.e., reproduces outputs without the underlying causal process). I'll define this distinction, address your cases, and clarify the boundary issues you raised.

  ### The Distinction: Realization vs. Simulation
  The property you're reaching for is **causal-computational realization** (or **algorithmic realization**). This is not merely about input-output agreement, robustness, or generalization, but about **whether the system's internal causal structure mirrors the formal process described in the specification**. Here's the carving:

  1. **Definition**:  
     A system **realizes** a specification if:  
     - It produces the correct outputs for all inputs (actual and counterfactual) in the domain.  
     - Its internal states and transitions **causally implement** the steps and intermediates of the specification's algorithm. This means:  
       - There is a mapping from the system's internal states to the intermediate states in the specification.  
       - The transitions between these states are causally sensitive to the inputs and intermediates in a way that matches the algorithm's logic.  
     - Crucially, the output for any input is generated **at the time of the query** via this causal process, not precomputed or fetched from storage.

     A system merely **simulates** the specification if it reproduces the correct outputs but lacks this causal structure (e.g., via lookup, playback, or statistical approximation without algorithmic correspondence).

  2. **Key differences from related concepts**:  
     - **Agreement on actual inputs**: Necessary but insufficient. Simulation can achieve this (e.g., your case 3). Realization requires counterfactual correctness and causal structure.  
     - **Robustness**: About stability under perturbations (e.g., noise, component failure). Realization implies robustness only if the algorithm is robust; a simulator might be robust without realizing the algorithm (e.g., a hardened lookup table).  
     - **Generalization**: About extrapolation to new inputs. Realization implies generalization if the algorithm generalizes, but a simulator might generalize without realization (e.g., your case 2, if it generalizes correctly but without causal correspondence).  
     - **Property relativity**: Realization is not a property of the system alone. It depends on:  
       - The **specification** (which defines intermediates and steps).  
       - The **purpose** (e.g., certification requires realization for traceability; playback might suffice for efficiency).  
       - The **counterfactual range** (inputs that could occur in plausible variations of the system's environment).

  3. **Why the verdict is retrospective and purpose-dependent**:  
     - **Retrospective**: You only know if realization holds when an unanticipated input tests the causal structure. A simulator might coincidentally generalize correctly but fail under slight environmental changes (e.g., sensor noise patterns not in the training data).  
     - **Purpose-dependent**: Realization matters for:  
       - **Certification/explanation**: Regulators need the causal chain to assign blame or verify safety.  
       - **Blame assignment**: A failure in a realized system can be debugged via intermediates; a simulator's failure is opaque.  
       - **Extensibility**: Realization supports modifications (e.g., tweaking an intermediate step); simulation does not.  
     This doesn't make the distinction subjective—it just means realization is evaluated relative to the spec's scope and the system's intended use.

  ### Classification of Your Cases
  Using causal-computational realization:

  - **Case 1 (Clean reimplementation)**:  
    **Realizes the specification**. Different intermediates are acceptable if they map to the spec's intermediates and transitions (e.g., variables in the new language correspond to those in the spec). The causal process is preserved, even if optimized.

  - **Case 2 (Learned approximator)**:  
    **Simulates the specification**. It generalizes correctly but lacks state-to-state correspondence with the spec's intermediates. Your "yes" and your colleague's "estimates" both capture truths:  
    - It computes *a* function (so it's not "nothing"), but not the *specified algorithm* if intermediates are missing.  
    - Disagreement stems from the spec's ambiguity: If intermediates are critical (e.g., for debugging), it fails; if only outputs matter, it might pass. But your team rejects pure playback (case 3), suggesting intermediates are essential.  
    - **Verdict**: This is simulation unless the approximator's hidden layers map interpretably to the spec's intermediates (e.g., via mechanistic interpretability).

  - **Case 3 (Precomputed table)**:  
    **Simulates the specification**. Outputs are correct but generated via storage, not computation. No causal process occurs at query time, and intermediates (if any) aren't embodied in the system's state transitions.

  - **Case 4 (Table with dynamic extension)**:  
    **Boundary case, depends on implementation**:  
    - If the fallback routine **matches the spec's algorithm** (e.g., computes intermediates at query time), then it realizes the spec. Caching is an optimization; the causal process is preserved.  
    - If the fallback is **different** (e.g., a simpler approximation), it simulates—even if outputs are correct.  
    - **Buried-copy variant**: Realizes the spec, as the original algorithm runs at query time (lazily). The "idle machinery" is irrelevant if the causal process is invoked when needed.  
    - **Settling the disagreement**: Check if the fallback/dynamic step implements the spec's intermediates and transitions. If yes, it realizes; if no, it simulates.

  ### Relation to Broader Debates
  Your distinction sits between two neighboring debates but is distinct:
  - **Process vs. effect (e.g., "does a simulation think?")**: Your focus is narrower—limited to computational specs with defined intermediates. The brain example you mentioned hinges on this: Neuron replacements must **realize the causal roles** of biological neurons (e.g., responding dynamically to inputs) to preserve thinking; playback devices (like case 3) would only simulate.  
    - **Imperfect fit**: The brain debate often assumes functionalism (which cares only about inputs/outputs), but your spec includes intermediates, making realization stricter.  
  - **Realization under a formal description (e.g., "does any system compute X?")**: This is more permissive (e.g., a rock "computes" its trajectory if you map states to it). Your distinction is stricter: The system must match the spec's causal structure, not just any mapping.  
    - **Why it's not this**: Your team rejects case 3 despite perfect outputs, showing you require causal alignment, not arbitrary realizability.

  ### Is This a "Real" Distinction or Projected Unclearness?
  It's a **real distinction** with practical consequences:
  - **In your work**: Realization ensures systems are debuggable, certifiable, and adaptable; simulation risks opaque failures (e.g., a neural net crashing on edge cases with no intermediates to inspect).  
  - **In the brain example**: The neuron-replacement thought experiment clarifies that realization (not simulation) preserves cognition. If replacements merely playback outputs without causal sensitivity, they fail functionalism—a view supported by philosophers like Fodor and Pylyshyn (who argue computation requires structure-sensitive processes).  
  - **The unresolved part**: Your team's disagreement in case 2 stems from **specification ambiguity**. If intermediates are explicit in the spec, the approximator simulates; if not, it might realize. This isn't just words—it's about what the spec must include for safety-critical systems.

  ### Proposed Term and Definition
  - **Term**: **Algorithmic realization** (to emphasize faithfulness to the spec's algorithm).  
  - **Definition**: A system algorithmically realizes a specification if and only if:  
    1. **Correctness**: Outputs match the spec for all inputs in the domain (actual and counterfactual).  
    2. **Causal alignment**: Internal states map to the spec's intermediates, and transitions between them causally implement the spec's steps. Outputs are generated at query time via this process.  
    3. **Relativity**: Evaluated relative to the spec (including intermediates), a counterfactual input range (plausible variations), and purpose (e.g., certification).

  This distinction is not "reinvented badly"—it echoes Marr's levels of analysis (computational vs. algorithmic), Fodor's computational theory of mind, and verification concepts like refinement checking. But it's often conflated in practice, leading to your team's repeated debates. Clarify the spec's requirements (are intermediates essential?), and algorithmic realization will classify your cases consistently.
