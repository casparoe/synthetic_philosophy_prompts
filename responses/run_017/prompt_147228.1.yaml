answer: |-
  **Prioritize framework replacement (50%), then resolution-sensitive deference (30%), then belief-aim split (20%). Abandon translatability as non-normative strategy.**  

  ### Why this ranking?  
  **1. Framework replacement is load-bearing and tractable.**  
     - **Dependency**: Without solving how to relate credences across incommensurable frameworks, *no* deference norm (including your bridge reflection idea) can be formally stated. It blocks progress on all other questions.  
     - **Tractability**: Use category theory (adjunctions between proposition spaces) or generalized probability frameworks (e.g., projective extensions) to define "partial comparability." A postdoc could formalize when a successor’s verdict *constrains* your current credences (e.g., via coarse-graining bounds) within 18 months.  
     - **Impact**: Engineers building self-modifying systems *need* to know when old control parameters remain valid. A negative result ("no coherent deference possible under radical framework shifts") would force hard operational constraints (e.g., lock ontology cores).  
     - **Neglect**: Most work assumes refinement; replacement is underexplored.  
     - *Downrank if*: A trivial embedding theorem shows all "replacements" reduce to refinements with noise. *Uprank if*: A counterexample proves inevitable Dutch books under replacement.  

  **2. Resolution-sensitive deference is engineering-actionable.**  
     - **Dependency**: Builds *on* comparability (from #1) but doesn’t require full framework equivalence.  
     - **Tractability**: Model as a filtering problem: use mutual information between your coarse partition and the successor’s fine partition. Derive a deference threshold where their signal/noise ratio dominates. A postdoc could produce closed-form bounds.  
     - **Impact**: Directly informs "abstraction level" choices for monitoring/control (e.g., "Trust the successor on macro-features, not micro-details").  
     - **Neglect**: Anti-deference literature ignores granularity; this is novel.  
     - *Downrank if*: Optimal deference reduces to simple noise calibration. *Uprank if*: A non-monotonic deference boundary emerges (e.g., trust medium granularity only).  

  **3. Belief-aim split is risky but high-upside.**  
     - **Dependency**: Independent of framework issues; can be explored in parallel.  
     - **Tractability**: Requires merging utility theory with epistemology. Start with simple cases (e.g., successor optimizes for a corrupted U = U_true + ε). Risk: May need contested rationality axioms.  
     - **Impact**: If belief/aim deference can decouple, engineers *must* harden goal stability separately from epistemology. A positive result ("always fight aims if beliefs defer") simplifies design.  
     - **Neglect**: Alignment literature conflates the two; splitting them is fresh.  
     - *Downrank if*: It reduces to "defer only if values are stable." *Uprank if*: A Dutch book forces coupling belief/aim deference.  

  ### Deprioritize translatability (0%):  
  Overrated as a *norm*. It’s strategic (helps debugging) but not rationally required—an agent may lack resources to build bridges. No Dutch book forces it. Demanding it ignores computational limits.  

  ### Overrated danger:  
  The agenda *won’t* collapse into calibration platitudes. Framework changes break calibration’s premises (what are you calibrating *to*?). A clean "comparability criterion" from #1 would be a non-platonic foundation.  

  ### Resource allocation:  
  - **Postdoc 1**: Framework replacement (core formalism)  
  - **Postdoc 2**: Resolution-sensitive deference (applied math)  
  - **Postdoc 3**: Belief-aim split (contingency plan)  
  - **Your time**: Oversee #1, integrate #2, and kill #3 if no traction in 12 months.
