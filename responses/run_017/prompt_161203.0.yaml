  ### Profile
  Consider a five-member committee ranking three candidates, A, B, and C, with the following strict preferences:  
  - Voter 1: A ≻ C ≻ B  
  - Voter 2: A ≻ C ≻ B  
  - Voter 3: B ≻ A ≻ C  
  - Voter 4: B ≻ A ≻ C  
  - Voter 5: C ≻ B ≻ A  

  ### Verdicts
  - **Borda scores (2-1-0)**:  
    - A: 2 (V1) + 2 (V2) + 1 (V3) + 1 (V4) + 0 (V5) = 6  
    - B: 0 (V1) + 0 (V2) + 2 (V3) + 2 (V4) + 1 (V5) = 5  
    - C: 1 (V1) + 1 (V2) + 0 (V3) + 0 (V4) + 2 (V5) = 4  
    Social ordering: A ≻ B ≻ C (A wins, C is loser).  
  - **Condition checks**:  
    - (i) A is Borda winner, C is loser: satisfied.  
    - (ii) C is first for Voter 5: satisfied.  
    - (iii) Pairwise A vs B: B wins 3–2 (V3, V4, V5 prefer B ≻ A).  
    - (iv) After C withdraws, Borda on A and B (1-0):  
      - A gets 1 from V1, V2 → 2 points.  
      - B gets 1 from V3, V4, V5 → 3 points.  
      Social ordering: B ≻ A (flip from original A ≻ B).  
  - **Arrow’s conditions**:  
    - Unrestricted domain: satisfied (strict rankings).  
    - Pareto: satisfied (if all prefer X ≻ Y, X ranks above Y).  
    - Non-dictatorship: satisfied.  
    - Completeness/transitivity: satisfied.  
    - IIA fails: Social ordering of A and B flips despite unchanged individual preferences on A and B.  

  ### What does the work
  The flip arises from asymmetric treatment of C relative to A and B:  
  - Voters 1–2 rank C above B (reducing B’s score).  
  - Voter 5 ranks C above A (reducing A’s score) but B above A.  
  - Numerical asymmetry: 2 voters rank C above B, but only 1 ranks C above A.  
  - **Proof**: Make all voters rank C on the same side (e.g., C last):  
    - Change Voter 5 to B ≻ A ≻ C.  
    - Borda: A = 7, B = 8 → B wins. No flip (B ≻ A both before and after C’s removal).  
  - **Condorcet cycle**: Present (A ≻ C 4–1, C ≻ B 3–2, B ≻ A 3–2). No Condorcet winner. The cycle enables the Borda pathology.  
  - **With Condorcet winner requirement**: No such profile found with 5 voters. The flip likely requires cycle-induced tensions.  

  ### The defence
  A Borda defender argues:  
  - IIA is not rational when leveraging positional (intensity) information. The flip reflects C’s role as a "spoiler," revealing A’s artificial lead due to C’s intermediate ranks in pro-A ballots.  
  - **Cost**: Violating IIA invites strategic nomination (e.g., withdrawing a candidate to alter outcomes) and fails robustness to irrelevant alternatives, as highlighted by Arrow’s theorem.  

  ### IWL
  - **Weaker than IIA?** Yes. IIA implies independence of withdrawn losers (IWL), but not vice versa (Borda satisfies IIA only trivially). IWL fails here, showing strict weakness.  
  - **Rule satisfying Pareto, non-dictatorship, completeness, transitivity, and IWL**: Sequential pairwise voting with a fixed agenda (e.g., alphabetical order).  
    - **Concrete example**: Agenda: A vs B, winner vs C. Full ordering: Recursively apply to winners/losers.  
    - **Verification**:  
      - In the profile, social ordering is C ≻ B ≻ A (C wins after B beats A, then C beats B). Remove A (loser): Re-run on B and C → C ≻ B (unchanged ordering of survivors).  
      - Pareto: If all prefer X ≻ Y, X wins pairwise.  
      - Non-dictatorship: Depends on all votes.  
      - Completeness/transitivity: Built by agenda.  
      - IWL: Removing the loser does not alter agenda or pairwise comparisons among survivors.  
  - **Near-misses**:  
    - Copeland: May produce ties (violates completeness without tie-breaker).  
    - Plurality: Vulnerable to ties and fails IWL if tie-breaking is inconsistent (e.g., tie in full set broken as A ≻ B, but tie in subset broken as B ≻ A).  
    - Borda: Fails IWL (as shown).  

