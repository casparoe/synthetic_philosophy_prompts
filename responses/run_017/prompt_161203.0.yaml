            Therefore, sequential pairwise voting on a fixed agenda, with a recursive application to get the full ordering, seems to satisfy IWL.

          So we have a rule: sequential pairwise voting with a fixed agenda (and if we have more than two candidates, we pick the winner by the agenda and then recursively apply to the losers) and it satisfies the conditions.

