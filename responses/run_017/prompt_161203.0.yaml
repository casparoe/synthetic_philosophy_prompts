                        Then A has 7 and B has 8 -> B wins -> no flip.

            The defence:
              Borda defenders argue that IIA is too strong because it discards valuable information about preference intensity. The flip occurs because the removal of C changes the relative weights of A and B. The cost is vulnerability to strategic nomination and the potential for cycles to affect the outcome.

            IWL:
