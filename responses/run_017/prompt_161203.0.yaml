              - A rule satisfying Pareto, non-dictatorship, completeness, transitivity, and IWL: sequential pairwise voting on a fixed agenda (for example, alphabetical order of candidates). For three candidates: first compare the first two in the agenda, the winner faces the third, and then the overall winner is chosen. Then, to get the full ordering, recursively apply the rule to the set of candidates: the overall winner is first, and then the ordering of the rest is determined by the same rule on the remaining set. This rule satisfies IWL: removing the last-place candidate does not change the agenda for the remaining candidates, and the relative order among the rest is the same as in the full set.

