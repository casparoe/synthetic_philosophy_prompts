          Now, the defence of Borda:

            The defence: IIA is not a requirement of rationality once we allow positional or intensity information. Borda count uses the full ranking and hence captures the intensity of preferences. In the example, the flip occurs because the removal of C reveals that the support for A was artificially inflated by the presence of C. Specifically, the two voters who had A first also had C in the middle, which pulled down B's score relative to A. But when C is removed, B's true strength (as the majority candidate) emerges. 

            What does that cost? Arrow's theorem shows that if we want to respect the independence condition, we cannot have a non-dictatorial rule that satisfies the other conditions. By giving up IIA, we can have a rule that satisfies the other conditions. However, the cost is that the rule becomes vulnerable to strategic voting (like the introduction of spoiler candidates) and may not be robust to the set of alternatives.

