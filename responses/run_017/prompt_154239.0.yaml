prompt: |-
  I'm taking a one-hour session on superrationality with a mixed group of first-year computer science and philosophy students. They know the payoff matrix of a one-shot prisoner's dilemma and nothing beyond it: no decision theory, no game theory past the phrase 'Nash equilibrium'. I want a plan for the explanation, not the explanation itself.

  Give me the order in which the components have to be introduced and, at each step, what it depends on that has not yet been said. Tell me what the one carrying scenario must contain and must lack: I am inclined to have each student submit a sealed decision procedure to a referee who runs both and pays out, but I want to know what has to be excluded for the case to do its work — iteration, reputation, communication between the submissions, and, more delicately, whether each procedure is shown the other's source — and whether including that last feature turns it into a different lesson entirely.

  Given a computer-science-heavy room, someone will propose early on 'cooperate if and only if I can verify the other procedure is identical to mine'. Is that the target or the trap, and where in the sequence should it be met?

  Three further misconceptions, each of which I want placed at a particular point: that superrationality is only evidential decision theory in costume and so falls with it wherever an action is correlated with but does not cause its outcome; that it is reciprocal altruism with the iteration deleted; that it returns 'cooperate' for any prisoner's dilemma, including heavily asymmetric ones or ones where most of the other players are not superrational. For each, say what the plan must already have established for the correction to land rather than be memorised.

  Close with one question that separates a student who has the idea from one who has merely learned to repeat that both players are running the same computation — I would like it to turn on a variant where the two procedures reason alike but face slightly different payoffs — and tell me what I should openly decline to settle in an hour: I assume whether superrationality is correct, and anything turning on the general contest between causal and evidential decision theory.

  Please write the plan in British English.
reasoning: |-
  We are designing a one-hour session on superrationality for mixed first-year computer science and philosophy students. They know the payoff matrix of a one-shot prisoner's dilemma (PD) and the term 'Nash equilibrium' but nothing else. We must build the concept step by step.

  Plan Components:

  1. **Recap Prisoner's Dilemma (PD) and Nash Equilibrium (5 minutes)**
     - Present the standard PD payoff matrix (e.g., both defect: (1,1); both cooperate: (3,3); one cooperates and one defects: (0,5) and (5,0)).
     - Explain the Nash equilibrium: both defecting is the only Nash equilibrium because, given the other player's choice, defecting yields a higher payoff regardless.
     - This step depends on their prior knowledge of the PD matrix and the term Nash equilibrium.

  2. **Introduce the One-Shot Setup with Sealed Decision Procedures (10 minutes)**
     - Describe the scenario: two players, each independently writes a decision procedure (a function that returns either Cooperate or Defect) in isolation. These are sealed and given to a referee. The referee runs both procedures (without any communication between them) and pays out according to the PD matrix.
     - **Must contain**: The procedures are written without any knowledge of the other's code and without any possibility of communication. They are run in a black-box manner by the referee.
     - **Must lack**:
       - Iteration: This is one-shot.
       - Reputation: No history or future.
       - Communication: The procedures cannot send messages to each other.
       - **Delicate point**: The procedures are not shown the other's source code. They must decide based solely on their own reasoning about the situation.
     - Why exclude source code access? If we allow the procedures to see each other's source, we enter the realm of Quining (programs that can reason about their own source and others') which is a different (and more complex) topic. We wish to avoid that for now because superrationality is about symmetric reasoning without direct access to code.

  3. **The Challenge: Can Cooperation be Rational? (5 minutes)**
     - Pose the question: In this one-shot, no-communication setting, is there any rational way for both to cooperate? The Nash equilibrium says no, but perhaps there is another way.
     - This sets up the problem and motivates superrationality.

  4. **Introduce Superrationality (10 minutes)**
     - Key idea: Both players are rational and they both know that they are both rational. Moreover, they both know that they are in the same situation and that they are both using the same kind of reasoning. Therefore, they should come to the same conclusion. So, the two choices must be identical: either both cooperate or both defect.
     - Now, if both are going to do the same thing, then the payoffs are:
       - Both cooperate: (3,3)
       - Both defect: (1,1)
     - Clearly, both would prefer the outcome (3,3) to (1,1). Therefore, they should both cooperate.
     - This step depends on the symmetry of the situation and the assumption that both players are using the same rational decision procedure.

  5. **Address the Early Proposal from CS Students (5 minutes)**
     - Someone might propose: "Cooperate if and only if I can verify the other procedure is identical to mine."
     - **This is a trap**. Why?
       - How can you verify the other procedure is identical without access to its source? (We excluded that.) Even if you could, in the symmetric setting, both are trying to do the same verification, leading to infinite regress or undecidability.
       - Moreover, if both require verification and they are identical, then they both try to verify and fail (because they don't have access to the other's source) and thus defect. Then we get (1,1) which is worse.
     - Place this after introducing superrationality but before the next misconceptions. We use it to clarify that superrationality does not rely on verifying code but on the symmetry of the reasoning.

  6. **Misconception 1: Superrationality is just Evidential Decision Theory (EDT) (5 minutes)**
     - **When to address**: After explaining superrationality but before discussing variants.
     - **Correction**: Superrationality is not EDT. EDT would say: "If I cooperate, that is evidence that the other also cooperates (because we are in a symmetric situation), so I should cooperate to get the higher payoff." But EDT can lead to absurdities in other scenarios (e.g., Newcomb's problem) and is controversial. Superrationality is specifically about symmetric games and the idea that both players are using the same decision procedure. It is a solution concept for symmetric games, not a general decision theory.
     - **Prerequisites already established**: The students must understand the symmetric reasoning of superrationality and the one-shot PD setup. Then we can contrast with EDT and note that while they might coincide in this symmetric PD, superrationality is a distinct idea for symmetric games.

  7. **Misconception 2: Superrationality is Reciprocal Altruism without Iteration (5 minutes)**
     - **When to address**: After addressing the EDT point.
     - **Correction**: Reciprocal altruism (as in repeated games) relies on future punishment. Superrationality does not require any future interaction. It is about one-shot cooperation based on logical symmetry.
     - **Prerequisites**: The one-shot setup without iteration must be clear.

  8. **Misconception 3: Superrationality always says 'cooperate' in any PD, even asymmetric ones (5 minutes)**
     - **When to address**: After clearing the previous two, and before the closing question.
     - **Correction**: Superrationality applies only to symmetric games. If the payoffs are asymmetric (e.g., one player gets a much higher payoff when both cooperate than the other), then the reasoning breaks because the players are not in identical situations. Similarly, if one player is known not to be superrational, then the symmetry is broken.
     - **Prerequisites**: The symmetry assumption must be established. We then show a variant with asymmetric payoffs to illustrate that superrationality does not apply.

  9. **Closing Question to Test Understanding (5 minutes)**
     - Present a variant: Two players, both are superrational and using the same decision procedure, but the payoffs are slightly asymmetric. For example:
       - If both cooperate: Player A gets 3, Player B gets 3.1 (so B gets a little more).
       - If both defect: (1,1)
       - If A cooperates and B defects: (0,5)
       - If A defects and B cooperates: (5,0)
     - Question: Should they both cooperate? Why or why not?
       - **Correct insight**: The symmetry is broken because Player B has a higher incentive to cooperate (if both cooperate, B gets 3.1 vs A's 3) but also a higher incentive to defect if A cooperates (5 vs 0). However, the superrationality argument relies on symmetry. Since the payoffs are asymmetric, the players are not in identical situations. Therefore, the argument that both must do the same thing might still hold (because they are using the same reasoning) but now the best common action is not obvious. In fact, if they both do the same, then both cooperating yields (3,3.1) and both defecting yields (1,1). But note that the common action must be chosen, and from a universal perspective, both might still prefer (3,3.1) over (1,1). However, the existence of asymmetry might break the assumption that they will both choose the same action? Actually, if they are both using the same decision procedure and the procedure is sensitive to the payoffs, then they might not even choose the same action. This is a deeper issue. The key point is that superrationality as originally defined requires symmetry in the game. This variant challenges the student to see that superrationality is not straightforwardly applicable.
     - We want the student to recognize that the symmetry of the game is broken and thus the superrationality argument is not directly applicable. A student who merely repeats "same computation" without noticing the asymmetry hasn't fully grasped the concept.

  10. **What to Openly Decline to Settle (1 minute)**
      - We do not settle whether superrationality is the "correct" decision theory. It is one approach among many.
      - We do not resolve the general debate between causal and evidential decision theory. That is beyond the scope of the session.

  Timing Summary:
  - 5 min: Recap PD and Nash.
  - 10 min: Sealed decision procedure setup.
  - 5 min: Challenge: Can cooperation be rational?
  - 10 min: Introduce superrationality.
  - 5 min: Address the CS proposal (trap).
  - 5 min: Misconception 1 (EDT).
  - 5 min: Misconception 2 (Reciprocal altruism without iteration).
  - 5 min: Misconception 3 (Asymmetric PD).
  - 5 min: Closing question (asymmetric variant).
  - 1 min: What we don't settle.

  Total: 56 minutes, leaving 4 minutes for flexibility.

  Note: The session is fast-paced. Be prepared to adjust timing based on student responses.
answer: |-
  Below is a structured plan for your one-hour session on superrationality, tailored to a mixed group of first-year computer science and philosophy students. The plan sequences concepts logically, ensuring each step builds on prior knowledge while preempting common misconceptions. Key principles:  
  - **Progressive introduction**: Start simple (recap Prisoner's Dilemma), introduce superrationality as a "way out" of defection, then refine with challenges and corrections.  
  - **Active engagement**: Use the "sealed decision procedure" scenario to make ideas concrete, but strictly control variables (e.g., no code-sharing).  
  - **Misconception timing**: Address errors when students have enough context to *understand* why they’re wrong, not just memorise corrections.  
  - **Closing question**: Designed to test deep understanding via asymmetry.  

  British English is used throughout.  

  ---

  ### **Session Plan (Total: 60 minutes)**  
  **Format**: Interactive lecture with Q&A. Use a whiteboard for payoff matrices.  

  #### **1. Recap Prisoner’s Dilemma (PD) and Nash Equilibrium (5 mins)**  
  - **Content**:  
    - Display a symmetric PD matrix (e.g., Cooperate/Cooperate = (3,3); Defect/Defect = (1,1); unilateral defection = (5,0) or (0,5)).  
    - Explain Nash Equilibrium (NE): "Both defect" is the only NE, as defecting is optimal *regardless* of the other’s choice.  
  - **Dependencies**: Assumes prior knowledge of PD payoffs and the term "Nash equilibrium". Nothing new introduced yet.  
  - **Purpose**: Establish the "problem"—why defection seems inevitable in one-shot PD.  

  #### **2. Introduce the Sealed Decision Procedure Scenario (10 mins)**  
  - **Content**:  
    - Describe the setup: Two isolated players each submit a sealed decision procedure (e.g., a function `decision() -> C or D`) to a referee. The referee runs both (without modification) and pays out based on the PD matrix.  
    - **Must contain**:  
      - Procedures are written in isolation (no communication).  
      - No iteration (truly one-shot).  
      - No reputation or history.  
    - **Must lack**:  
      - **No access to the other’s source code**: Procedures cannot inspect or verify each other’s code. (If included, this becomes a lesson on Quining/self-reference, which is distinct and too advanced.)  
      - **No communication**: Procedures cannot pass messages.  
      - **No asymmetry**: Use a symmetric PD matrix initially.  
  - **Dependencies**: Builds on the PD recap but introduces a novel "decision procedure" framing for CS students.  
  - **Purpose**: Create a controlled environment to explore rational choice without traditional game-theoretic crutches.  

  #### **3. Pose the Core Question (5 mins)**  
  - **Content**:  
    - "Can two rational players cooperate in this one-shot setup? If so, how?"  
    - Highlight that NE mandates defection, but perhaps rationality isn’t that narrow.  
  - **Dependencies**: Relies on the sealed procedure setup. No new concepts yet.  
  - **Purpose**: Create tension and motivate superrationality.  

  #### **4. Introduce Superrationality (10 mins)**  
  - **Content**:  
    - Define superrationality: Players recognise they are identical rational agents using the *same* decision process. Thus, they must output the *same* action (both C or both D).  
    - Argue: If both do the same, mutual cooperation (3,3) > mutual defection (1,1), so both *should* cooperate.  
    - Contrast with NE: NE considers "given the other’s choice", superrationality considers "given we are identical".  
  - **Dependencies**: Requires understanding of the sealed setup and PD payoffs.  
  - **Purpose**: Present superrationality as a solution to the cooperation problem.  

  #### **5. Address the CS Proposal: "Cooperate iff I Verify the Other’s Code" (5 mins)**  
  - **Content**:  
    - When a student proposes this (likely here), label it a **trap**:  
      - Verification is impossible (scenario lacks code access).  
      - Even if possible, it leads to infinite regress ("How do I verify their verification of me?").  
      - Outcome: Both defect due to failed verification → (1,1), worse than (3,3).  
  - **Placement**: Immediately after introducing superrationality, as it’s a natural but flawed CS response.  
  - **Purpose**: Show that superrationality relies on *logical symmetry*, not code inspection.  

  #### **6. Misconception 1: "Superrationality = Evidential Decision Theory (EDT)" (5 mins)**  
  - **Content**:  
    - **Correction**: Superrationality is *not* EDT.  
      - EDT acts based on evidence (e.g., "If I cooperate, it’s evidence they cooperate").  
      - Superrationality acts based on logical necessity in symmetric games ("We must do the same, and same=C is better").  
    - **Example to contrast**: In a non-symmetric Newcomb-like problem, EDT and superrationality diverge.  
  - **When to address**: After superrationality is defined but before asymmetry.  
  - **Prerequisites to land**: Students must grasp superrationality’s symmetry argument. Without this, the EDT distinction feels arbitrary.  
  - **Purpose**: Isolate superrationality as a game-theoretic solution, not a general decision theory.  

  #### **7. Misconception 2: "Superrationality = Reciprocal Altruism Minus Iteration" (5 mins)**  
  - **Content**:  
    - **Correction**: Reciprocal altruism relies on repeated interaction and punishment. Superrationality requires no iteration—it’s logical, not strategic.  
    - **Analogy**: Reciprocal altruism is like "I’ll help if you help back later"; superrationality is "We’re identical, so we’ll do the same now".  
  - **When to address**: After dismissing EDT, as students may confuse both with "cooperation without direct cause".  
  - **Prerequisites to land**: The sealed procedure’s one-shot nature must be crystal clear.  
  - **Purpose**: Emphasise superrationality’s uniqueness to symmetric one-shot games.  

  #### **8. Misconception 3: "Superrationality Always Says ‘Cooperate’ in Any PD" (5 mins)**  
  - **Content**:  
    - **Correction**: Superrationality fails in asymmetric PDs (e.g., Player 1 gets 10 for mutual cooperation; Player 2 gets 2).  
      - Reason: Players are no longer identical—their payoffs differ, breaking the symmetry.  
    - Also fails if some players aren’t superrational (e.g., one uses NE).  
  - **When to address**: Last, after establishing symmetry’s importance.  
  - **Prerequisites to land**: Students must understand superrationality hinges on symmetry (Step 4). Use an asymmetric matrix to demonstrate.  
  - **Purpose**: Show superrationality’s limits and prevent overgeneralisation.  

  #### **9. Closing Question to Test Understanding (5 mins)**  
  - **Content**:  
    - Pose: "Two superrational players use identical procedures, but payoffs are asymmetric—e.g., mutual C gives (3, 3.1), mutual D gives (1,1). Will they cooperate? Why?"  
    - **Target insight**: Cooperation is not guaranteed. The slight asymmetry breaks the symmetry superrationality requires. Players may still coordinate on C (if they ignore the asymmetry) or defect (if they overfit to differences). A student who *only* repeats "same computation" without addressing asymmetry misses the point.  
  - **Purpose**: Distinguish deep understanding (symmetry is fragile) from rote learning.  

  #### **10. Openly Declare What Won’t Be Settled (0–1 min)**  
  - **Content**: State clearly:  
    - "We won’t resolve whether superrationality is ‘correct’—it’s one perspective among many."  
    - "We won’t settle causal vs. evidential decision theory debates—that’s for advanced courses."  
  - **Purpose**: Manage scope and avoid philosophical rabbit holes.  

  ---

  ### **Key Structural Notes**  
  - **Pacing**: Allocate time rigidly—misconceptions and the CS trap must fit within their slots.  
  - **Why the sealed scenario works**: Excluding code-access, iteration, and communication forces students to confront logical symmetry (the core of superrationality). Including code-access would shift focus to program equivalence (a CS tangent).  
  - **Handling the CS trap**: By addressing it early (after introducing superrationality), you preempt distractions and reinforce that superrationality is *not* about code verification.  
  - **Flow**: Each step scaffolds the next:  
    PD recap → Sealed setup → Superrationality → Challenges (trap + misconceptions) → Application test (asymmetry).  

  This plan balances conceptual rigor with accessibility, leveraging CS intuitions (e.g., decision procedures) while grounding philosophy students in game-theoretic reasoning.
