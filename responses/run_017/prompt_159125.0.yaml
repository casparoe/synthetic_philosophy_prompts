  Hi — I run a fortnightly reading group on constructive mathematics at my uni, mostly second and third years who've done a course on first-order logic and a bit of computability, plus one philosophy guy who keeps dragging the discussion toward meaning and anti-realism, and a Coq user who thinks the whole thing was settled ages ago. For our next session I want to make a one-page handout that's really a flowchart: you start at the top, answer a string of questions one at a time, and end up at a named position — Brouwerian intuitionism, Bishop-style constructivism, the Russian/recursive school, the Martin-Löf-ish type theory view, plain classical mathematics, predicativism, finitism, ultrafinitism, and whatever 'unnamed' leaves you need. What I keep failing at is phrasing the branch questions so they don't give away where they lead: every time I try, a node comes out as something like 'do you think truth outruns provability?', which just tells you which box you're heading for. So I need eight to ten nodes, each one either a concrete case or a claim about one specific logical principle, that someone could have a settled view about without already knowing the labels.

  A few cases I want used as nodes, because they're the ones that actually got us arguing. The classic argument that there exist irrationals a and b with a^b rational, where you consider √2 raised to the √2 and say that either it's already rational or else squaring it up gives 2 — does that establish the existential claim, or only that it's not refutable? Whether you'd assert right now that either the decimal expansion of pi contains infinitely many 7s or it doesn't. A program that searches for a counterexample to Goldbach: if you can show it's impossible for the search to run forever, does it follow that it halts? Whether defining a number as the least n such that for all m, Q(n, m) is legitimate, given that the definition quantifies over a totality that includes the very thing being defined. Whether the function that's 0 for x below 0 and 1 everywhere else is a genuine total function on the reals. Whether 10 to the power 10 to the power 10 is a number in quite the same sense that 7 is. And whether there are real numbers that no rule or law picks out at all. (I think Bishop's version refuses to define that step function but also refuses to assert that every function is continuous, and I'm not sure how — so if the tree genuinely can't separate Brouwer from Bishop, please say so rather than inventing a node to force them apart.)

