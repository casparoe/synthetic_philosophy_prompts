  **Flowchart: Classifying Views in Mathematics**  
  *Start at the top and follow the answers.*

  1. **Is the function \(f(x)\) defined as 0 for \(x < 0\) and 1 for \(x \geq 0\) a genuine total function on the real numbers?**  
     - **Yes** → Go to Q5  
     - **No** → Go to Q2  

  2. **Are there real numbers not specified by any rule or law (e.g., free choice sequences)?**  
     - **Yes** → **Brouwerian intuitionism**  
       - *Characterization:* Mathematics is mental construction; truth requires proof via intuition.  
       - *Awkward commitment:* All total functions on reals are continuous (discontinuous functions are impossible).  
     - **No** → Go to Q3  

  3. **If a program searching for a Goldbach counterexample cannot run forever, must it halt?**  
     - **Yes** → **Russian/recursive school**  
       - *Characterization:* Mathematics is computable; objects must be algorithmically realizable.  
       - *Awkward commitment:* Markov's principle (if non-halting is impossible, halting must occur).  
     - **No** → Go to Q4  

  4. **Is the set of natural numbers a completed infinite totality?**  
     - **Yes** → **Bishop-style constructivism or Martin-Löf type theory**  
       - *Characterization:* Mathematics must be computational; proofs provide explicit algorithms.  
       - *Awkward commitment:* Rejects the step function in Q1 yet denies all functions are continuous.  
       - *Note:* Tree cannot distinguish Bishop from Martin-Löf (both share core constructive commitments).  
     - **No** → Go to Q7  

