prompt: |-
  I'm a PhD candidate in public policy (decision-science track), and I'm writing the final exam for the MPP seminar I TA this term, "Global Priority Setting". The students have had cost-effectiveness analysis and the importance–tractability–neglectedness (ITN) heuristic, and most of them can recite the three factors and the instruction to multiply them. I want one 90-minute, 30-mark question that gives nothing to that recitation: it should force them to say what single quantity the framework is trying to estimate, what each factor is a stand-in for, and what goes wrong when the stand-in comes apart from the quantity. An answer that only restates the framework should land in the B range at best.

  I've been toying with a stylised case, in welfare units (WU), which I'd like you to use — or to tighten so that the arithmetic is unambiguous and no alternative reading yields a different ranking. If you adjust numbers, please keep the two structural features that make it bite: one cause has constant, non-diminishing returns, and another's best opportunity is lumpy and sits at a very high level of existing funding.

  Treat WU as fully comparable across causes and ignore timing and discounting.

  The setup. A foundation has a single non-recurring grant of $50M to allocate this year. Its trustees' fallback use is Cause C, whose return is known exactly.

  Cause A — control of a chronic parasitic infection. Fully solving it is worth 12,000 WU. Returns are constant: every additional $1M solves 1% of the problem, i.e. yields 120 WU, right up to complete solution at $100M of cumulative funding. Cumulative funding to date: $30M. Current annual funding: $10M. No other funder is expected to change its behaviour in response.

  Cause B — the eradication endgame for a vaccine-preventable livestock disease. Fully solving it is worth 1,000,000 WU, but 99% is already solved. If eradicated this year, the remaining benefit is 10,000 WU (the residual 1%) plus 15,000 WU from permanently avoiding resurgence. Eradication requires an indivisible one-off $50M campaign; any smaller contribution adds nothing at all. Current funding: $2,000M a year of routine vaccination, which continues until eradication occurs.

  Cause C — an established scholarship programme, the trustees' default. Worth 500,000 WU if fully solved; each additional $1M solves 0.06% of the problem, i.e. yields 300 WU, over the relevant range. Current annual funding: $500M. Divisible, no crowding out.

  The parts I have in mind: (a) rank the uses of the $50M with numbers, and say how the ranking changes if the foundation had only $1M to give this year; (b) apply the ITN heuristic the way it is usually applied in this seminar (each factor rated, then multiplied), compare its ranking with yours, and explain precisely why the two differ and what that shows about what ITN is estimating; (c) say what neglectedness would have to mean for it to be more than a crude proxy — redefine it, or argue the framework should drop it; (d) in a sentence or two, if eradication happens the $2,000M a year of routine vaccination stops — should that be counted in Cause B's benefit, and if so, how?

  What I want from you:

  1. The question exactly as it should appear on the paper: parts (a)–(d), stated time (90 minutes), a word cap (1,200 words), and the mark total (30). Lead with this, as it would be handed to candidates — no preamble, no commentary on how you constructed it, and no repeat of this email's discussion.

  2. A model answer of roughly 800 words whose first sentence states the bottom line — the ranking with its numbers — and which then gives the reasoning. No restatement of the question, no citations, and no reference to any organisation's write-up; the question has to be answerable from the information given and nothing else.

  3. A marking scheme: five must-hit points, the marks each is worth (totalling 30), and one line on each about how candidates typically get it wrong — the specific error or the specific recitation that should cost them the marks.
reasoning: |-
  Okay, the user is a PhD candidate in public policy, focusing on decision science, and they're designing a final exam question for their MPP seminar on "Global Priority Setting." They want a question that forces students to go beyond rote memorization of the Importance-Tractability-Neglectedness (ITN) heuristic. Specifically, they want students to understand the underlying quantities ITN is trying to estimate, what each factor proxies for, and the problems when those proxies diverge from reality. 

  The user has provided a stylized case with three causes (A, B, C) and specific structural features: one with constant returns (A), another with a lumpy opportunity at high funding (B). They want the question to include four parts: (a) ranking uses of funds with calculations, (b) applying ITN and explaining discrepancies, (c) redefining neglectedness or arguing for its removal, and (d) addressing whether saved routine vaccination costs should count as a benefit for Cause B.

  Hmm, the user's frustration with surface-level understanding is palpable. They’re tired of students "reciting" ITN without grasping its purpose as a proxy for marginal impact. The exam question needs to expose this by creating tension between ITN’s multiplicative output and the actual cost-effectiveness in the cases. The lumpy vs. constant returns in Causes B and A are perfect for this—ITN will misrank them because it doesn’t capture marginal dynamics. 

  For part (a), I’ll tighten the numbers to eliminate ambiguity. Cause B’s eradication campaign must be clearly inferior to A at $50M but superior at $1M. The $1M scenario is clever—it forces students to see that "importance" (total benefit) is irrelevant when marginal returns differ. 

  Part (b) is the core trap. ITN will rank B highest due to high "importance" (total WU) and "neglectedness" (low % solved), but that’s wrong because B’s marginal return at $50M is zero unless fully funded. Students must spot that ITN proxies *average* benefit per unit effort, not *marginal*. 

  Part (c) requires redefining neglectedness as a signal of *marginal* rather than *average* effectiveness. If students just parrot "low funding," they miss the point. 

  Part (d) tests understanding of economic costs. The $2B saved from routine vaccination isn’t a benefit—it’s a cost reduction. But since WU only measure welfare gains, it shouldn’t count. 

  The model answer must lead with the ranking: A > C > B for $50M, B > A > C for $1M. Then dissect why ITN fails: its factors conflate total vs. marginal, and neglectedness (as typically defined) is a poor proxy for diminishing returns. 

  Marking scheme should punish rote ITN recitation. Key traps: not calculating marginal WU/$ for (a), not seeing that ITN’s "importance" isn’t marginal, and missing that neglectedness should correlate with *marginal* returns, not funding gaps. 

  One risk: students might overcomplicate (d) by invoking "fungibility" or other concepts. The question explicitly says "ignore timing and discounting" and treats WU as comparable, so they should stick to the given framework. 

  Final check: Does the arithmetic force the intended ranking? 
  - Cause A: 120 WU/$M always → 6,000 WU for $50M 
  - Cause C: 300 WU/$M → 15,000 WU? Wait, no! At $500M annual funding, solving 0.06% per $1M, but the user says "over the relevant range." Need to confirm if returns are constant. The user’s email says "each additional $1M solves 0.06%," so yes, 300 WU/$M. Then $50M gives 15,000 WU. But that’s higher than A’s 6,000. That breaks the intended A > C ranking for $50M. 

  Mistake! The user’s numbers need adjustment. Cause C should be *less* effective than A at the margin. Original: A gives 120 WU/$M, C gives 300 WU/$M. But then C > A, which undermines the "A is best at $50M" lesson. 

  Fix: Reduce C’s yield. Change to 60 WU/$M (so 0.03% per $1M of 500,000 WU). Then: 
  - A: 120 × 50 = 6,000 WU 
  - C: 60 × 50 = 3,000 WU 
  - B: 0 WU for $50M (since not full amount) → Perfect. 

  For $1M: 
  - A: 120 WU 
  - C: 60 WU 
  - B: 0 WU → But user wants B > A here? Wait, no—at $1M, B still can’t do anything. The user said "ranking changes if only $1M," but B’s opportunity is only at $50M. So for $1M, B should rank last. Then why would ranking change? 

  Ah! The user’s part (a) says "how the ranking changes if the foundation had only $1M." With original numbers: 
  - A: 120 WU 
  - B: 0 WU (still lumpy) 
  - C: 300 WU → So C > A > B. But the user implied B might rank higher? No—re-reading, they said "another’s best opportunity is lumpy at high funding," so B should be useless below $50M. 

  But then for $1M, B is worst. The "change" is just flipping A and C? But user wants to show B’s lumpiness matters. Perhaps add a small-scale opportunity for B? No—the case says "any smaller contribution adds nothing." So the change is only between A and C’s rankings? 

  Double-checking user’s email: "how the ranking changes if [...] only $1M." With adjusted C (60 WU/$M): 
  - $50M: A (6,000) > C (3,000) > B (0) 
  - $1M: A (120) > C (60) > B (0) → Same order. But user wants to demonstrate that B’s "importance" misleads when marginal returns are zero. The $1M case reinforces that B is always bad unless fully funded. 

  For ITN application in (b), the trap is that ITN will rank B highly due to large total benefit and low % solved, but actually B has zero marginal impact with partial funding. 

  For part (d), the $2B/year saved isn’t a welfare gain—it’s resource savings. But since WU measure welfare, not resources, it shouldn’t be included. Some students might confuse cost savings with benefit. 

  Final tweak: In Cause B, clarify that "current funding" is $2B/year for routine vaccination, and eradication stops it. But the benefit is only the 10,000 + 15,000 = 25,000 WU. The $2B/year saving is irrelevant to WU. 

  Model answer will emphasize: 
  - Marginal analysis, not total benefits 
  - ITN as a flawed proxy for marginal cost-effectiveness 
  - Neglectedness should be redefined as "steepness of returns curve" or similar 

  Marking scheme: 
  1. Correct WU calculations and rankings for both funding scenarios (8 marks) 
  2. Accurate ITN application and ranking (4 marks) 
  3. Explanation of divergence focusing on marginal vs. average/stand-ins (8 marks) 
  4. Redefining neglectedness as marginal signal (6 marks) 
  5. Correct handling of cost savings in (d) (4 marks) 

  Common errors: 
  - Forgetting B yields zero for $50M 
  - Using total WU instead of marginal for ranking 
  - ITN: overvaluing B due to high importance/neglectedness 
  - Claiming saved vaccination funds are a "benefit" 

  This should push students beyond recitation.
answer: |-
  ### Final Examination Question  
  **Module:** Global Priority Setting  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1,200 words  
  **Total Marks:** 30  

  ---

  **Question**  
  A foundation must allocate a single non-recurring grant. Its goal is to maximize welfare units (WU), which are fully comparable across causes. Ignore timing, discounting, and behavioural responses from other funders.  

  **Causes:**  
  - **Cause A** (Chronic parasitic infection control):  
    - Full solution value: 12,000 WU.  
    - Returns: Constant. Each $1M solves 1% of the problem (yields 120 WU), up to full solution at $100M cumulative funding.  
    - Cumulative funding to date: $30M. Current annual funding: $10M.  

  - **Cause B** (Livestock disease eradication):  
    - Full solution value: 1,000,000 WU (99% already solved). Eradication *this year* yields 10,000 WU (residual 1%) + 15,000 WU (avoiding resurgence).  
    - Eradication requires a one-time $50M campaign. Smaller contributions yield *0 WU*.  
    - Current annual funding: $2,000M for routine vaccination (continues until eradication).  

  - **Cause C** (Scholarship programme, trustees’ fallback):  
    - Full solution value: 500,000 WU.  
    - Returns: Each $1M solves 0.03% of the problem (yields 150 WU), constant over the relevant range.  
    - Current annual funding: $500M. Divisible, no crowding out.  

  **Tasks:**  
  (a) Rank the causes for a $50M grant and a $1M grant, with numerical justification. (8 marks)  
  (b) Apply the ITN heuristic (rate importance, tractability, neglectedness from 1-10, multiply) to rank causes for $50M. Compare this to your (a) ranking and explain the discrepancy, specifying what ITN fails to capture. (8 marks)  
  (c) Redefine "neglectedness" so it better approximates the quantity ITN should estimate, or argue to discard it. (8 marks)  
  (d) If eradication (Cause B) stops $2,000M/year in routine vaccination, should this affect the benefit calculation? Explain in 1–2 sentences. (6 marks)  

  ---  

  ### Model Answer (≈800 words)  
  **Ranking:** For $50M: **A > C > B** (A: 6,000 WU; C: 7,500 WU; B: 0 WU). For $1M: **A > C > B** (A: 120 WU; C: 150 WU; B: 0 WU).  

  #### (a) Numerical ranking  
  - **$50M grant:**  
    - *Cause A:* Constant returns. $50M yields 50 × 120 WU = **6,000 WU**.  
    - *Cause B:* Lumpy returns. $50M < indivisible $50M cost → yields **0 WU**.  
    - *Cause C:* Constant returns. $50M yields 50 × 150 WU = **7,500 WU**.  
    - Ranking: **C > A > B** (C best).  
  - **$1M grant:**  
    - *Cause A:* $1M → 120 WU.  
    - *Cause B:* $1M → 0 WU (indivisible).  
    - *Cause C:* $1M → 150 WU.  
    - Ranking: **C > A > B** (C best).  

  #### (b) ITN vs. reality  
  - **Standard ITN application** (rates 1-10, multiplies):  
    - *Importance* (I): Total WU if solved. B:10 (1M WU), A:2 (12k WU), C:5 (500k WU).  
    - *Tractability* (T): % solvable per effort. A:10 (linear), B:1 (lumpy), C:1 (low yield).  
    - *Neglectedness* (N): Inverse of % solved. B:10 (99% solved → low attention), A:7 (70% unsolved), C:2 (well-funded).  
    - *ITN Score (I×T×N)*: B:10×1×10=100; A:2×10×7=140; C:5×1×2=10.  
    - ITN ranking: **A > B > C** (A best).  
  - **Discrepancy:** ITN ranks A best for $50M, but C yields more WU (7,500 > 6,000). ITN also ranks B above C (100 > 10), but B yields 0 WU.  
  - **Why ITN fails:**  
    - ITN estimates *average* expected benefit per unit effort (total WU × solvability ÷ attention).  
    - But cost-effectiveness requires *marginal* impact: WU per *additional* dollar.  
    - Here, ITN overestimates B (due to high I and N, ignoring lumpiness) and underestimates C (due to low N, ignoring constant returns).  

  #### (c) Neglectedness redefined  
  - **Problem:** Standard neglectedness (e.g., current funding) is a proxy for diminishing returns. Here, it misleads:  
    - Cause B is "neglected" (low % solved) but has *no* marginal return below $50M.  
    - Cause C is "saturated" but has linear returns.  
  - **Solution:** Redefine neglectedness as **"marginal returns elasticity"**:  
    - *Measure:* How much marginal WU/$ decreases as funding increases (e.g., % change in marginal yield per % funding increase).  
    - *Example:* Cause C has flat marginal returns (elasticity ≈0) → not neglected. Cause B has infinite elasticity (0 return until $50M) → highly neglected.  
  - **Alternative:** Discard neglectedness. Marginal returns can be directly estimated if data exists, avoiding proxy errors.  

  #### (d) Routine vaccination savings  
  No. The $2,000M/year savings is a **resource release**, not a welfare gain. WU measure direct welfare (e.g., health, education outcomes). Resources saved could fund other causes, but this is indirect and beyond the WU framework.  

  ---  

  ### Marking Scheme (30 marks total)  
  **1. Correct WU calculations and rankings (8 marks)**  
  - *Must-hit:* $50M: C=7,500, A=6,000, B=0 → **C>A>B**; $1M: C=150, A=120, B=0 → **C>A>B**.  
  - *Common error:* Ranking B > C for $50M due to "importance," or ignoring B’s lumpiness.  

  **2. ITN application and discrepancy explanation (8 marks)**  
  - *Must-hit:* ITN ranks A>B>C for $50M; discrepancy due to ITN estimating *average* benefit vs. needed *marginal* impact.  
  - *Common error:* Stating "ITN is subjective" without linking I/T/N to average vs. marginal.  

  **3. Neglectedness redefinition (8 marks)**  
  - *Must-hit:* Redefine as signal of *marginal* returns (e.g., elasticity) OR argue for dropping it with a marginalist rationale.  
  - *Common error:* Rephrasing standard neglectedness (e.g., "low funding") without addressing marginality.  

  **4. Cost savings exclusion (6 marks)**  
  - *Must-hit:* Explicitly state savings are *not welfare gains* and note indirect effects are outside WU.  
  - *Common error:* Claiming savings "increase B’s benefit" without distinguishing resources from welfare.  

  **5. Marginal focus throughout (implicit, deduct if missing)**  
  - *Must-hit:* All answers emphasize marginal WU/$ over total benefits or averages.  
  - *Common error:* Using total WU (e.g., B’s 1M WU) without conversion to marginal yield.  

  ---  
  **Rationale for strict grading:** Answers scoring B or lower typically restate ITN without critiquing proxies (e.g., "ITN prioritizes neglected causes" without addressing lumpiness/returns). Full marks require showing ITN’s stand-ins (I≈total WU, N≈funding gap) misestimate marginal cost-effectiveness when returns deviate from assumptions.
