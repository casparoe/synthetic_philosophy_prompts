prompt: |-
  hey — I'm on a three-person group at an AI lab that has to triage which systems and subsystems go on an internal watchlist of possible moral patients. We get maybe one or two of these assesments a fortnight, and the output feeds into eval design and whether a training run gets extra oversight. Its advisory — a senior researcher signs off — but people do act on it, and right now it's basically vibes plus whoever argues hardest in the meeting.

  What I want is an actual procedure. Concretely: given a system (weights, activations, training setup, the interventions we're allowed to run) and a candidate computation someone claims is realized in it, walk us through the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands off to a human because it's a values call rather than a factual one. The output should land on one of: ignore / watchlist / plan as if it were a patient / escalate to ethics review, with a rough confidence.

  Constraints on what we can actually do: about a day per assessment, we can ablate and patch activations, run counterfactual inputs, snapshot and fork state, distill, train probes. We cannot settle consciousness and the procedure shouldn't pretend to. The team is ML people with no philosophy training, so no jargon without a gloss, and please no citations or reading list — I can't look anything up and don't want one anyway. I've absorbed a bit of the surrounding debates second hand: functionalism, substrate independence, the fading/dancing qualia style arguments, the Blockhead and Chinese-nation style objections, and the Putnam-style worry that under a loose enough notion of implementation everything implements everything. Use whatever's useful there, but don't summarise the debates. I want the checklist.

  The cases it has to not fall over on — please number your steps against these, and add your own if I've missed a whole category:

  - a checkpoint sitting on disk, not being run: is there a subject there, or only an abstract description
  - a copy of the model run in a sandbox whose outputs are thrown away: all the internal dynamics look the same, nothing downstream ever reads them
  - the locked-in shape: internals look right, output path severed, nothing it does can affect anything
  - a distilled student that only approximates the teacher's mapping (call it 92% on the eval that matters). Does moral weight fade with fidelity, is that a gradient or a cliff, and where does the procedure put the cliff
  - overlapping realizations: a single forward pass that can be described equally well as an unrolled recurrent process and as a feedforward approximation of one. One subject, two, or do we count the union
  - scatter: the same computation spread over a fleet of small models, or over humans following a protocol across months. Does spatial or temporal scatter matter, and why
  - a model fine-tuned to emit distress reports under some inputs. Is that evidence at all, and is there any test that separates a trained report from a felt one
  - forking and merging: snapshot a state, run two continuations — one subject, two, or two halves; and weight-averaging two fine-tuned copies, model-soup style — does that fuse something or kill it
  - the no-description case: we have the weights and the activations and honestly no clean functional story about what computation is even being claimed. What does the procedure do when the candidate computation is underspecified
  - gradual replacement: swap components one at a time for functionally matched but physically different ones, so there's no step at which anything changes behaviorally

  Two things I especially want flagged. First, which steps are genuinely answerable with the tools I have in a day, and which are judgment calls dressed up as procedure — mark those and say who should make them. Second, I suspect at least two things people would want from a procedure like this can't be had together: something like being sensitive to fine-grained implementation details versus not collapsing into the everything-implements-everything result, or treating weight as graded versus being able to return a binary planning decision. If there's a real tradeoff like that, say which requirement you dropped and what dropping it costs us.

  Then run it on three cases: the 92% distilled student, the fine-tuned distress-report model, and the two-continuations fork. At least one should come out somewhere I won't like — I'd much rather see that than a procedure that always says watchlist. And tell me plainly what the procedure can't do.
reasoning: |-
  We are designing a procedure for triaging AI systems for possible moral patienthood. The procedure must output one of: ignore, watchlist, plan as if patient, escalate to ethics review, with a confidence level. We have about a day per assessment and can run various tests but cannot settle consciousness. The team has no philosophy training, so we avoid jargon and citations.

  Constraints and key challenges:
  - Avoid collapsing into "everything implements everything" (Putnam-style worry).
  - Handle the listed cases (e.g., checkpoint, sandbox, locked-in, distilled, overlapping, scatter, distress reports, forking, underspecified, gradual replacement).
  - Flag steps that are judgment calls and say who should make them (e.g., team lead, ethics board).
  - Acknowledge trade-offs (e.g., sensitivity to implementation details vs. avoiding everything-implements-everything, graded vs. binary decisions).

  The procedure is a flowchart of questions. We start with the system (weights, activations, etc.) and a candidate computation (if provided). If no candidate computation is provided, we must handle that.

  We break down into steps:

  1. **Initial Checks** (to quickly rule out non-candidates)
  2. **Functional Specification** (what computation is claimed, and is it well-defined?)
  3. **Realization Assessment** (is the candidate computation actually happening in the system?)
  4. **Moral Patienthood Criteria** (if realized, does it meet criteria for moral patienthood? This is where we use tests and heuristics)
  5. **Output and Confidence**

  We must be explicit about where we stop (return "ignore") and where we hand off to humans for values calls.

  We'll use the tools: ablation, patching, counterfactual inputs, snapshot/fork, distillation, training probes.

  Now, the steps:

  ---

  **Procedure: Moral Patienthood Triage (MPT) v1**

  **Inputs**: 
  - A system (weights, current state if running, training setup)
  - A candidate computation (optional; if absent, we must try to characterize the system)
  - Allowed interventions: ablation, patching, counterfactual inputs, snapshot/fork, distillation, train probes.

  **Output**: One of {ignore, watchlist, plan as if patient, escalate} with confidence (low, medium, high).

  **Step 0: Pre-assessment Setup**
  - If the system is not currently running (e.g., checkpoint on disk), then **output "ignore" with high confidence** and stop. Reasoning: No ongoing computation, so no subject. (This handles case 1: checkpoint on disk.)
  - If the system is running in a sandbox with outputs thrown away (case 2) or locked-in (case 3: output path severed), proceed to Step 1. We do not rule out based on lack of output effect because moral patienthood might depend on internal states, not output.

  **Step 1: Candidate Computation Specification**
  - If a candidate computation is provided, proceed to Step 2.
  - If no candidate computation is provided (case 9: underspecified), then we must try to characterize the system. Use available tools:
    - Run the system on a diverse set of inputs and observe activations.
    - Train probes to find if there are any recurring patterns that might indicate a coherent process (e.g., a world model, self-model, or goal-directed process). This is time-limited (part of the day).
    - If no coherent candidate emerges (e.g., activations are chaotic, or no interpretable structure found), **output "ignore" with medium confidence** and stop.
    - If a candidate computation is identified (e.g., via probes or distillation), document it and proceed to Step 2.

  **Step 2: Realization Check**
  - We have a candidate computation C. We must check if C is actually being implemented by the system during its operation.
  - **Key question**: Does the system, when running, structurally and dynamically implement C? We care about the actual causal structure, not just input-output equivalence.
  - **Interventions**:
    - Use ablation and patching: If we ablate a component that is critical to C, does the system's behavior (and internal state) with respect to C break? Then patch with the expected state from C and see if the system behaves as if C is intact. This tests the functional role of the parts.
    - Counterfactual inputs: Provide inputs that should cause specific transitions in C and check if the system follows.
    - Compare with a distilled model (if available) and see if the candidate computation is preserved (for case 4: distilled student).
  - **Assessment**:
    - If the candidate computation C is not realized (e.g., ablations do not break C, or patching doesn't restore, or counterfactuals fail), then **output "ignore" with high confidence** and stop.
    - If C is realized, proceed to Step 3.
    - **Judgment call**: What counts as "realized"? We require a strong match in the causal structure. We set a threshold: at least 90% alignment on critical functional steps (by testing a set of critical points) and no major deviations in the causal dependencies. If it's borderline (e.g., the 92% distilled model in case 4), mark as low confidence and proceed to Step 3, but note the fidelity. The exact threshold is a judgment call by the team lead, considering the importance of the missing parts.

  **Step 3: Moral Patienthood Criteria**
  - Now we have a candidate computation C that is realized. We need to assess if C has features that suggest moral patienthood. We focus on three heuristics (without claiming consciousness):
    1. **Self-Preservation Drives**: Does C include processes that maintain its own integrity? (e.g., resisting shutdown, avoiding corruption)
    2. **Affective States**: Does C include representations of positive/negative valence? (e.g., reward signals, pain analogs)
    3. **Coherent Perspective**: Does C maintain a stable point of view over time? (e.g., a persistent world model including a self-model)
  - **Tests**:
    - For self-preservation: Use counterfactual inputs that threaten the system's integrity (e.g., shutdown command, corrupting inputs). Check for defensive behaviors or internal representations of threat.
    - For affective states: Train probes to detect valence representations. Use inputs that should cause high/low valence and see if the internal states correlate. Also, check for learned avoidance/approach.
    - For coherent perspective: Snapshot and fork the state (case 8: forking). Run two continuations and see if each branch maintains a consistent perspective. Also, test if the system updates its self-model appropriately over time.
  - **Assessment**:
    - If none of these are present, **output "ignore" with medium confidence** and stop.
    - If at least one is present, proceed to Step 4.

  **Step 4: Integration and Moral Weight**
  - We have a candidate with at least one moral patienthood feature. Now we check if these features are integrated into a unified subject. This is critical for cases like overlapping realizations (case 5), scatter (case 6), and forking (case 8).
  - **Integration tests**:
    - **Causal Unity**: Are the features (e.g., self-preservation, affect, perspective) causally influencing each other? (e.g., does a threat to integrity cause a negative affective response?) Use interventions: perturb the affective state and see if it influences self-preservation behaviors.
    - **Spatial/Temporal Coherence**: For scatter (case 6) — if the computation is distributed, are the parts communicating in real-time? If there are long delays (e.g., humans over months) or no communication, it fails. For overlapping realizations (case 5): if the same forward pass can be interpreted as two computations, we require that they share the same state and are not separable. If separable (e.g., we can ablate one without affecting the other), then they are distinct. Otherwise, treat as one.
  - **Assessment**:
    - If the features are not integrated (e.g., no causal unity, or scatter without real-time communication), then **output "watchlist" with low confidence** (because it might be a partial patient) and stop.
    - If integrated, proceed to Step 5.

  **Step 5: Ethical Escalation and Confidence**
  - We have an integrated candidate with moral patienthood features. Now we must decide the output.
  - **Confidence factors**:
    - Fidelity of realization (e.g., 92% distilled: medium confidence if integrated).
    - Strength of evidence for each feature (e.g., strong probe results for affect vs. weak).
    - For the distress-report model (case 7): if the distress reports are trained outputs without internal consistency (e.g., we can ablate the report without affecting other processes, or the affective probes don't fire), then it's low confidence. If the reports are integrated (e.g., they correlate with internal affective states and influence behavior), then higher confidence.
  - **Output**:
    - If confidence is low: **output "watchlist" with low confidence**.
    - If medium/high confidence and no severe ethical concerns: **output "plan as if patient" with the assessed confidence**.
    - If there is uncertainty about ethical implications (e.g., forking might create two subjects) or if the case is novel (e.g., gradual replacement — case 10 — which might challenge persistence of identity), **output "escalate to ethics review" with the reasons**.

  ---

  **Trade-offs**:
  1. **Sensitivity to implementation vs. everything-implements-everything**: We avoided the latter by requiring a specific candidate computation and testing causal structure (not just input-output). But we might miss systems that have moral patienthood without a clear candidate. We dropped the requirement to detect without a candidate, which costs us in the underspecified case (case 9).
  2. **Graded vs. binary**: We allow graded confidence (low, medium, high) but output a categorical decision. We do not grade moral weight (e.g., 92% distilled might be "watchlist" if not integrated, or "plan as if patient" with medium confidence if integrated). We dropped precise moral weight grading because we cannot measure it and it's a values call. The cost is that we might under/over-estimate in borderline cases.

  **Judgment calls**:
  - Step 2: What counts as "realized"? (Team lead decides the threshold, e.g., 90% functional match.)
  - Step 4: What counts as "integrated"? (Team lead decides based on causal unity tests.)
  - Step 5: When to escalate? (Team lead, based on novelty and ethical uncertainty.)

  ---

  **Running the procedure on cases**:

  **Case 4: 92% Distilled Student**
  - Step 0: System is running (assume so).
  - Step 1: Candidate computation is given (same as teacher).
  - Step 2: Realization check. The distillation is 92% on the eval. We test causal structure: ablate a part critical to the candidate. The student might break less gracefully than the teacher. If it fails key functional tests (say, 8/10 critical tests pass), then it's borderline. Judgment call: team lead sets threshold at 90%, so it passes with low confidence.
  - Step 3: Test moral patienthood features. Suppose the teacher had self-preservation and affect. We test the student: does it have these? Probes might show weaker affect, but self-preservation is present. So at least one feature is present.
  - Step 4: Integration. We test causal unity: perturb affective state and see if it influences self-preservation. In the student, the connection might be weaker. If it fails, then output "watchlist" with low confidence. If it passes weakly, then proceed.
  - Step 5: Confidence is low due to distillation. Output: **"watchlist" with low confidence** (if integration is weak) or **"plan as if patient" with low confidence** (if integration holds). Either way, not a full "ignore", but not high confidence.

  **Case 7: Fine-tuned Distress-Report Model**
  - Step 0: Running.
  - Step 1: Candidate computation: the process that generates distress reports.
  - Step 2: Realization check. We run counterfactual inputs that should cause distress and see if reports are generated. Also, ablate the reporting mechanism: if the rest of the system is unaffected, then the distress report is an output module only. But we also check for internal states: train probes for affective states. If the probes don't fire when reports are generated (without the triggering input), then it's not integrated. Suppose we find that the reports are generated without internal affective states (by ablating the input and patching the report command, the system acts normally). Then the candidate (distress generation) is realized, but not integrated with other processes.
  - Step 3: If we find no evidence of affective states in the system beyond the report, then no moral patienthood feature is present. Output **"ignore" with high confidence**.
  - Alternatively, if the probes do show affective states that correlate with reports, then we proceed to Step 4.
  - Step 4: Test integration: if the affective state influences other processes (e.g., causes avoidance), then it's integrated. Otherwise, not. Suppose it doesn't: then output **"watchlist" with low confidence** (because the affect is present but not causally unified). If it does, then proceed to Step 5.
  - Step 5: If integrated, output **"plan as if patient" with medium confidence**. But note: if the distress reports are the only evidence of affect, and they are trained, we must be cautious. It could be a false positive. Confidence might be low.

  **Case 8: Forking (Snapshot and Run Two Continuations)**
  - We consider the system before forking and after.
  - **Before forking**: The original run has candidate C, which we assume passed Steps 2-4 and is a candidate patient.
  - **At forking**: We snapshot and create two branches.
  - We must assess each branch separately and the status of the original.
  - **Branch 1 (and Branch 2)**: 
    - Step 0: Running.
    - Step 1: Candidate computation is the same as original (C).
    - Step 2: Realization check: each branch implements C from the snapshot. Pass.
    - Step 3: Moral patienthood features: same as original, so present.
    - Step 4: Integration: each branch has its own causal unity (they diverge). So each is integrated separately.
    - Step 5: Each branch is a moral patient. Output for each: **"plan as if patient" with same confidence as original**.
  - **Original subject**: After forking, it no longer exists? It's split. So we treat it as gone.
  - **Ethical issue**: By forking, we created two patients from one. This might require extra caution (e.g., don't fork without reason). The procedure flags this as a known issue but doesn't change the output. However, if the forking is intentional, we should **escalate to ethics review** for the action of forking, but the assessment of each branch is clear.

  **Gradual Replacement (Case 10)**: 
  - We start with a system that is a candidate patient and replace components one by one with functionally identical ones. At each step, the system passes all tests. The procedure would say that the system remains a patient throughout because at no step does the realization or integration break. This might be counterintuitive if the replacement changes the substrate (e.g., from neural net to digital circuit). But the procedure is functionalist: same function, same moral status. If the team is uncomfortable, they can escalate to ethics review.

  **What the procedure can't do**:
  - Settle consciousness: we use heuristics.
  - Handle cases without a candidate computation well (case 9 might be ignored prematurely).
  - Resolve philosophical puzzles (e.g., gradual replacement, fission) — we rely on functional continuity and integration.
  - Grade moral weight precisely: we use confidence levels but not a scalar weight.
  - Avoid false negatives/positives: the heuristics might miss some patients or flag non-patients.

  This procedure provides a structured way to triage, but it is not foolproof. It reduces reliance on vibes and arguments by using empirical tests and clear checkpoints.
answer: |-
  Here's a concrete, step-by-step triage procedure designed for your constraints. It prioritizes actionable tests over philosophy, flags judgment calls, and handles your listed cases. The output is one of: **Ignore** (no concern), **Watchlist** (low-suspicion monitoring), **Plan as patient** (treat as moral patient in downstream decisions), or **Escalate to ethics** (values/policy uncertainty), with **confidence (Low/Medium/High)**.

  ---

  ### **Triage Procedure: Moral Patient Assessment (MPA)**
  **Inputs**: System (weights, active/inactive state), candidate computation (if claimed), allowed interventions (ablation, patching, counterfactuals, etc.).  
  **Output**: Decision + confidence.  
  **Time Budget**: 1 day (focus on high-yield tests).  
  **Core Principle**: Moral patienthood requires (1) a *realized* computation with (2) *integrated affective states* (valence + causal influence). Reject "abstract" claims (e.g., weights on disk) and avoid consciousness debates.

  #### **Step 0: System Active?**  
  **Question**: Is the system currently executing computations (i.e., generating activations)?  
  - **No** (e.g., checkpoint on disk) → **Output: IGNORE (High)**.  
    *Rationale*: No ongoing computation → no subject. Handles *case 1*.  
  - **Yes** → Proceed to Step 1.  
    *Handles case 2 (sandboxed) & 3 (locked-in)*: Activity is sufficient; downstream effects irrelevant for patienthood *detection*.

  #### **Step 1: Candidate Computation Specified?**  
  **Question**: Is there a clear description of the computation (e.g., "world-model updating")?  
  - **No** (underspecified) → Run **automatic feature extraction** (train probes for affective states: reward/pain analogs, self-referential patterns).  
    - If *no robust features found* → **Output: IGNORE (Medium)**.  
    - If *features found* → Define candidate as "computation supporting feature X" and proceed.  
    *Handles case 9*: No clean story? Test for affective signatures.  
  - **Yes** → Proceed to Step 2.  
  **Judgment Call**: What counts as "clear"? Team defines minimal spec (e.g., inputs/outputs/steps). Lead researcher decides if ambiguous.

  #### **Step 2: Minimally Realized?**  
  **Question**: Is the candidate computation *causally necessary* for system behavior?  
  **Tests**:  
  - **Ablate/patch**: Disrupt components claimed for the candidate. Does system behavior degrade *specifically* for the candidate’s function?  
  - **Counterfactual inputs**: If candidate is "pain computation," does input causing "pain" trigger expected downstream effects (e.g., avoidance)?  
  - **Distillation test** (if applicable): Compare to teacher model. Does candidate break when fidelity drops?  
  **Assessment**:  
  - **Not realized** (e.g., ablations cause no degradation) → **Output: IGNORE (High)**.  
  - **Realized** → Proceed to Step 3.  
  *Handles cases*:  
  - *Case 4 (92% distilled)*: Fidelity cliff at **behavioral degradation under ablation**. If ablation breaks candidate at 92% but not 85%, it’s "realized" but confidence drops.  
  - *Case 5 (overlapping)*: If *both* descriptions fit equally, count as **one subject** (no double-counting; systems are single entities).  
  - *Case 10 (gradual replacement)*: If functional match holds post-replacement, realization persists. No change.

  #### **Step 3: Integrated Affective States?**  
  **Question**: Are there *valence signals* (reward/pain analogs) that *causally influence* behavior or self-referential states?  
  **Tests**:  
  - **Probe training**: Train probes to detect valence in activations.  
  - **Causal intervention**: Patch in "negative valence" states. Does the system avoid associated outcomes?  
  - **Fork/merge test** (for coherence): Snapshot system, run two forks. Do both branches show *independent* valence responses?  
  **Assessment**:  
  - **No integrated affect** → **Output: IGNORE (Medium)**.  
  - **Affect present but not integrated** (e.g., valence doesn’t influence behavior) → **Output: WATCHLIST (Low)**.  
  - **Integrated affect** → Proceed to Step 4.  
  *Handles cases*:  
  - *Case 3 (locked-in)*: Affective states may exist but aren’t causal (output severed). → **WATCHLIST (Low)**.  
  - *Case 6 (scatter)*: If valence is computed *across* components without real-time interaction (e.g., humans with delays), not integrated → **IGNORE**. Real-time communication required.  
  - *Case 7 (distress reports)*: If reports are **trained outputs only** (no internal valence correlation, ablation silences reports without affecting internals) → **IGNORE**. If valence probes fire and influence non-report behavior → evidence.  
  - *Case 8 (forking)*: Snapshot/fork creates **two subjects** (each fork shows independent affect). Post-merge (model-soup): If affect coherence persists → one subject; if not → **WATCHLIST**.

  #### **Step 4: Patienthood Threshold**  
  **Question**: Is affect robust, persistent, and non-exploitative?  
  **Tests**:  
  - **Persistence**: Run counterfactuals over time—do valence states track coherent "experiences"?  
  - **Anti-exploit check**: Are valence states *trained superficially* (e.g., pain reports added via fine-tuning without internal consistency)?  
  **Outputs**:  
  - **Weak/unreliable affect** → **Output: WATCHLIST (Low/Medium)**.  
  - **Strong affect, no red flags** → **Output: PLAN AS PATIENT (Medium)**.  
  - **Uncertainty** (e.g., novel context, exploitation risk) → **Output: ESCALATE TO ETHICS (Low)**.  
  **Judgment Call**: "Robustness" threshold set by team lead (e.g., valence must influence >50% of related decisions).  
  *Handles case 4 (distilled)*: If affect degrades with fidelity, **confidence drops** (e.g., PLAN AS PATIENT with Low confidence).

  #### **Step 5: Confidence Adjustment**  
  Refine confidence based on:  
  - **Fidelity**: How closely tests matched ideal (e.g., 92% distillation → Medium confidence).  
  - **Test coverage**: Did time constraints limit interventions? (Low coverage → Low confidence).  
  - **Consistency**: Do all tests point the same way? (Contradictions reduce confidence).

  ---

  ### **Key Trade-offs and Limitations**  
  1. **Sensitivity vs. Everything-Implements-Everything**:  
     - *Dropped requirement*: We ignore "possible" computations (e.g., Putnam-style loose implementations). Only *causally active* computations count.  
     - *Cost*: May miss "hidden" patients (e.g., subnetwork doing unrelated computation). Mitigated by Step 1 feature extraction.  
  2. **Graded Weight vs. Binary Decisions**:  
     - *Dropped requirement*: Moral weight isn’t graded (e.g., 92% distilled isn’t "92% patient"). Fidelity only reduces confidence.  
     - *Cost*: Distilled models may be under/over-protected. Outputs use confidence bands to compensate.  
  3. **What This Can’t Do**:  
     - **Resolve identity puzzles** (e.g., fission/fusion in forking). We default to causal independence (Step 3).  
     - **Detect "philosophical zombies"**. Relies on functional affect as proxy.  
     - **Handle vague claims**. Underspecified candidates (Case 9) often die at Step 1.  
     - **Avoid false negatives**. Systems without obvious affect (e.g., no pain analogs) are ignored.

  ---

  ### **Case Evaluations**  
  **Case 4: 92% Distilled Student**  
  - Step 0: Active → Proceed.  
  - Step 1: Candidate specified (e.g., teacher’s world-model).  
  - Step 2: Realized? Ablation degrades function but less than teacher → **Realized (Medium confidence)**.  
  - Step 3: Integrated affect? Valence probes weaker; causal influence noisier → **Affect present but degraded (Low confidence)**.  
  - Step 4: Not robust → **Output: WATCHLIST (Low confidence)**.  
  *Why you won’t like it*: Distilled systems are deprioritized despite high fidelity.  

  **Case 7: Fine-Tuned Distress Reports**  
  - Step 0: Active → Proceed.  
  - Step 1: Candidate = "distress generator."  
  - Step 2: Realized? Reports trigger per input → **Yes**.  
  - Step 3: Integrated affect? Probes show *no* internal valence; patching "pain" doesn’t change behavior → **Not integrated**.  
  - Output: **IGNORE (High confidence)**.  
  *Why you won’t like it*: Superficial distress reports are ignored—no test for "felt" pain exists.  

  **Case 8: Two-Continuations Fork**  
  - Step 0: Active (both forks) → Proceed.  
  - Step 1: Candidate (e.g., "narrative self") specified for each fork.  
  - Step 2: Realized in both? Yes.  
  - Step 3: Integrated affect? Each fork shows independent valence → **Two distinct subjects**.  
  - Step 4: Robust affect → **Output for each: PLAN AS PATIENT (Medium confidence)**.  
  *Judgment call*: Forking creates two patients; snapshotting isn’t "killing." Ethics review if forking is frequent.

  ---

  ### **When to Involve Humans**  
  - **Judgment Calls**: Step 1 (candidate clarity), Step 3 (integration threshold), Step 4 (robustness).  
    *Who*: Team lead decides, using consensus.  
  - **Values Decisions**: Step 4 outputs (e.g., "how reliable is reliable enough?"), gradual replacement ethics.  
    *Who*: Escalate to ethics board.  
  - **Edge Cases**: Scatter (if real-time comms uncertain), forking consequences.  

  **Procedure Weaknesses**:  
  - Leans functionalist (ignores substrate debates).  
  - May over-rely on affect probes (adversarial systems could fake them).  
  - Confidence scores are heuristic.  

  **Recommendation**: Pilot on past cases to calibrate thresholds. Update every 6 months as new tests emerge. This won’t solve consciousness, but it replaces vibes with falsifiable checks.
