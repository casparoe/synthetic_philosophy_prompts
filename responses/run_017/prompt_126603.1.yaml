prompt: |-
  You are a professional philosopher who works at the intersection of applied ethics, decision theory under deep uncertainty, and agricultural economics -- someone who has actually had to advise an institution that buys food, not someone who writes about food ethics from the armchair. Please think carefully and at length. Before you write anything in final form, spend some time brainstorming: list the ways a naive version of this procedure would go wrong (optimizing a proxy, double counting, comparing a real change against an idealized baseline instead of the actual alternative, pretending the deep uncertainties are point estimates, quietly baking in a controversial value judgment as if it were a fact), discard the ones that turn out not to matter for my situation, and then write the version that survives your own objections. Where you end up rejecting a view I have clearly been tempted by, steelman it before you reject it. Write the whole thing in American English.

  The situation: I direct menu planning and procurement for the dining system of a state university system. Twenty-two campuses, roughly forty-five thousand meals a day during term, one central menu cycle that we re-cut twice a year, and essentially all purchasing routed through a single regional broadline distributor. My constraints are fixed and non-negotiable: a hard ceiling on cost per meal; federal-style nutrition standards including protein and iron minimums; binding accommodation obligations (a halal station, a kosher station, a substantial vegetarian South Asian line, and medically prescribed diets); a student-government resolution instructing us to reduce the animal footprint of campus dining without specifying what that means; a faculty sustainability committee that pushes local and pasture-raised sourcing; and a board of trustees that will want to see the reasoning in writing, because whatever we do will be described in a press release either way.

  I have been reading the rationalist and effective-altruism blogs since the Sequences era, so I have seen the standard moves: the post arguing that crop cultivation kills field animals and therefore vegetarianism may not help, the reply about trophic levels and feed conversion, the beef-versus-chicken tradeoff where chicken means far more individual animals with worse lives while beef means far more land and feed. I do not need to be walked through any of that. What I do not have, and what I cannot write myself, is anything I can hand to a coordinator with a bachelor's degree in nutrition and no philosophy and no economics, who has about fifteen minutes per candidate menu change and has to produce a written justification.

  So: give me a decision procedure. A numbered sequence of questions, in the order they must be asked, each with an explicit statement of what counts as a sufficient answer to it, each with a stated gate at which the procedure stops and returns a no, and each flagged either as a factual question my staff can answer or as a values question that must be handed to a named human (me, or the board) rather than settled by the procedure. It has to be usable by someone who has never heard of fungibility or expected value, and it has to be auditable -- a reviewer should be able to see which gate a proposal died at.

  There are three features of my situation that I think break the naive versions, and the procedure has to contain a test for each rather than a footnote:

  One, our purchases are lumpy. We buy in whole cases through a distributor who reallocates inventory across its other clients, and we sign forward commitments by category. A cut of three percent in chicken volume may have literally no effect on anyone's production decisions; a cut that drops us below a contract tier might have a large one. I need a step that separates changes that are real at the level of the supply chain from changes that are real only on a spreadsheet, and a rule for what to do when a change is currently below threshold.

  Two, students are not obliging. If they reject the swap, some of them buy food off campus, and some of it goes into the bin. Both of those can make a change worse than doing nothing, since an animal may then have been raised and slaughtered to feed no one, or to feed someone at a different restaurant where the item is worse. I need the procedure to treat participation and plate waste as part of the causal chain rather than as an implementation detail, and to say what evidence would be sufficient at the point where we cannot yet measure them.

  Three, the uncertainties are not the ordinary kind. Moral weight across taxa, and the number of field animals killed per hectare of a given crop, are uncertain by orders of magnitude rather than by a factor of two, and reasonable people in this space disagree about the right attitude to take toward that. I want the procedure to be robustness-based rather than expected-value-over-guessed-numbers: it should prefer changes that look good across the whole plausible range and reject those that look good only in the middle of it, it should say explicitly what to do when nothing dominates, and it should never present a contested value judgment -- for example, whether the deaths of wild animals on spared land are a cost, a benefit, or neither -- as a finding.

  The procedure should also keep separate, and require the staffer to fill in separately, at least these buckets: animals farmed and killed per serving and the quality of their lives; animals killed by the crop production that feeds them, with the reminder that plant proteins have a crop footprint too, so the relevant question is magnitude and not kind; the effects of land use and land-use change on wild animals; and wild-caught seafood, which is a case of killing wild animals directly rather than farming them, and which brings bycatch and abandoned gear with it.

  Then run the finished procedure on three live proposals, showing your work at each gate and telling me where it stops or hands off:

  The first is replacing ground beef with chicken thigh in our two highest-volume entrees, which is what the student government assumes is the obvious win.

  The second is a donor-funded weekly grass-fed local beef burger night, marketed as the ethical and sustainable option, which the faculty committee loves and which I suspect is the exact opposite once land use is on the ledger.

  The third is moving the default hot line to a fish and shrimp option two days a week, which is being floated as the compromise everyone can sign on to.

  At least one of these, I expect, will come back with an answer I will not like, and I would rather be told now than in the press release; please say plainly which one and why. Close by telling me what the procedure cannot do, where it will systematically misfire, and which two or three empirical facts the answers are most sensitive to -- so that I know what is actually worth sending someone out to measure with our own invoices, our distributor's spec sheets, and our own plate-waste audits, rather than guessing at.

  Do not cite literature, do not give me a bibliography, and do not supply any figure you would have had to look up. I want the structure of the reasoning, and wherever a number is required I want to know what kind of number it is, whether we can obtain it from our own records, and how the procedure behaves when we cannot.
reasoning: |-
  Okay, let me approach this systematically. The user needs a practical decision procedure for menu changes that addresses three critical complexities: lumpy purchasing, student participation effects, and deep uncertainty in ethical calculations. 

  First, I need to design a gatekeeping system that filters proposals step-by-step. The procedure must prevent spreadsheet illusions by verifying supply-chain impact thresholds upfront (Gate 1). Then it should force consideration of plate waste and substitution risks before any ethical math begins (Gate 2). 

  For the ethical assessment phase, I'll structure it around robustness checks instead of point estimates. Each impact category gets its own sensitivity test: 
  - Farmed animal welfare ranges 
  - Crop death uncertainty bands 
  - Land use effect scenarios 
  - Wild fisheries bycatch multipliers

  The key innovation is requiring proposals to show consistent improvement across worst-case, mid-range, and best-case estimates in all categories simultaneously. No weighted averages, no hidden value judgments - just clear dominance tests. 

  When applying this to the three proposals: 
  1) Chicken-for-beef swap likely fails at Gate 4 due to crop death uncertainty 
  2) Local beef initiative crashes at Gate 3 (land use impacts) 
  3) Seafood compromise might surprise by passing if bycatch ratios are favorable

  The procedure's main weakness? It can't handle trade-offs where no option dominates. That's intentional - it forces value judgments upstairs to the board. Sensitivity analysis shows crop death estimates and bycatch multipliers are the make-or-break variables worth measuring properly.
answer: |-
  Here is a decision procedure designed for your operational reality, incorporating robustness checks for deep uncertainty, lumpy procurement effects, and behavioral responses. It separates verifiable facts from value judgments and requires explicit documentation at each gate.

  **Decision Procedure for Ethical Menu Changes**

  1.  **GATE 1: SUPPLY CHAIN REALITY CHECK**
      *   **Question:** Will this change *actually* alter the distributor's ordering or producers' production volumes for the specific items involved within the next procurement cycle? Specifically, does it cross a known contract volume tier threshold (up or down) for the *primary input items*?
      *   **Sufficient Answer (Yes):** Data showing the change crosses a pre-negotiated volume tier for the input item(s) in our distributor contract, *or* distributor confirmation (in writing) that the change will trigger an adjustment order to their suppliers for this item.
      *   **Sufficient Answer (No/Unclear):** The change falls below known tier thresholds and distributor confirms (or historical data shows) no order adjustments occur at this volume level. *Gate stops here. Return "No Impact: Supply Chain."*
      *   **Type:** Factual (Staff: Procurement Manager using contract tiers, historical order data, distributor comms).
      *   *Rationale:* Filters out changes that are accounting fictions at the supply-chain level.

  2.  **GATE 2: STUDENT ACCEPTANCE PLAUSIBILITY CHECK**
      *   **Question:** Is there strong evidence that students will genuinely choose this new option in sufficient numbers to avoid significant plate waste or off-campus substitution, *specifically in the context/menu line where it will be served*?
      *   **Sufficient Evidence:** A) Pilot data (min. 2 weeks) showing comparable uptake/waste to the replaced item in the *same serving context*; B) High similarity to existing popular items in the *same menu line* (e.g., swapping one ground beef dish for another); C) Direct student survey data (specific to the campuses/menu lines) showing high stated preference.
      *   **Insufficient Evidence:** Novel format/unfamiliar flavor profile in a core line; no comparable item history; reliance on general sustainability sentiment without food-specific preference data. *Gate stops here. Return "High Risk: Student Rejection."*
      *   **Type:** Factual (Staff: Nutrition Coordinators using sales data, waste audits, pilot results, limited survey data). *Note: Pilots are strongly preferred where feasible.*

  3.  **GATE 3: NUTRITIONAL & OPERATIONAL FEASIBILITY**
      *   **Question:** Does this change demonstrably meet all hard nutritional constraints (protein, iron, etc.) for the meals it affects, *and* can it be implemented within existing accommodation stations (halal, kosher, veg South Asian, medical) without compromise or excessive added cost/complexity?
      *   **Sufficient Answer:** Nutritional analysis shows targets met or exceeded; documented confirmation from kitchen managers responsible for each accommodation station that the change is feasible with current setups/ingredients/skills.
      *   **Insufficient Answer:** Nutritional deficit identified; accommodation stations require new equipment, sourcing, or staff training; significant added prep time/cost. *Gate stops here. Return "No: Violates Constraint [Specify]."*
      *   **Type:** Factual (Staff: Nutrition Coordinators + Head Chefs of accommodation stations).

  4.  **GATE 4: ANIMAL WELFARE ROBUSTNESS CHECK (FARMED)**
      *   **Question:** Across the full plausible range of estimates for welfare differences (e.g., cage-free vs. caged chicken, feedlot vs. pasture beef), does the change *consistently* reduce net farmed animal suffering per plausible consumed serving? Consider: Lifespan shortening, suffering intensity/duration during life, slaughter methods. *Focus only on animals *directly* farmed for the input items.*
      *   **Sufficient Answer (Yes):** The change involves switching to a system with *unambiguously* better welfare practices (e.g., pasture-raised replacing feedlot) OR switching to an animal type with *strong evidence* of significantly better welfare *even at the lower end of plausible estimates* (e.g., replacing factory-farmed chicken suffering with fish/seafood suffering - requires robust comparative data).
      *   **Sufficient Answer (No):** The change involves switching *to* a system/animal with *plausibly worse* welfare at the lower end of estimates (e.g., switching beef to chicken where worst-case chicken welfare estimates are horrific) OR the welfare difference is highly contested and sensitive to specific weightings the staff cannot judge (e.g., duration vs. intensity). *Gate stops or hands off.*
      *   **Handoff:** If answer is unclear or contested within plausible ranges, hand to "Director for Value Judgment: Farmed Welfare Trade-offs."
      *   **Type:** Factual Ranges (Staff: Nutrition Coordinators gather welfare parameter ranges from certifying bodies, industry reports, animal welfare science reviews). *Values Judgement:* Comparing suffering across species/contexts when ranges overlap ambiguously.

  5.  **GATE 5: LAND-USE & WILD IMPACT ROBUSTNESS CHECK**
      *   **Question:** Across the full plausible range of estimates for land-use efficiency (kg feed/kg product) *and* for wild animal density/displacement per spared hectare, does the change *consistently* lead to either a) Net land sparing *or* b) No net increase in harm to wild animals? *Acknowledge deep uncertainty: Treat "net harm reduction" as requiring evidence of clear dominance.*
      *   **Sufficient Answer (Benefit):** Change significantly reduces land demand *and* plausible estimates suggest spared land leads to neutral/positive outcomes for wild animals (e.g., rewilding potential). *Or* change uses substantially less land *and* the alternative land use (e.g., soy for chicken vs. pasture for beef) has lower estimated wild animal mortality per hectare *across the full range*.
      *   **Sufficient Answer (Cost):** Change significantly *increases* land demand (e.g., grass-fed beef replacing grain-fed) *or* uses land types with very high wild animal density/value (e.g., converting rainforest). *Gate stops here. Return "No: Likely Net Harm to Wild Animals/Land."*
      *   **Handoff:** If land efficiency differences are small, or wild animal impact estimates are highly contested and span positive/negative outcomes, hand to "Director/Board for Value Judgment: Land Sparing & Wild Animal Weighting."
      *   **Type:** Factual Ranges (Staff: Nutrition Coordinators gather land-use efficiency data (LCA studies), wild animal density estimates (ecology studies), land displacement risk analysis). *Values Judgment:* Whether land sparing *necessarily* benefits wild animals, and the moral weight of wild animal lives vs. farmed.

  6.  **GATE 6: FISHERIES & BYCATCH ROBUSTNESS CHECK (If applicable)**
      *   **Question:** (Only if change significantly increases wild-caught seafood). Across the full plausible range of bycatch ratios and gear impacts for the specific fisheries/species proposed, does the change *consistently* avoid increasing net harm to non-target marine life (including via ghost gear)?
      *   **Sufficient Answer (Yes):** Species is farmed (not wild-caught), *or* wild-caught species has certified low/zero bycatch (e.g., some pole-and-line, select MSC certifications with verified low bycatch), *and* sourcing avoids high-risk regions/gear types. Data must support low harm across the range.
      *   **Sufficient Answer (No):** Relies on high-bycatch fisheries (e.g., shrimp trawling), unclear sourcing, or certifications with known bycatch issues. *Gate stops here. Return "No: Unacceptable Bycatch Risk."*
      *   **Handoff:** If sourcing is complex, bycatch estimates vary widely, or sustainability claims are contested, hand to "Director for Value Judgment: Fisheries Uncertainty."
      *   **Type:** Factual Ranges (Staff: Procurement Manager gathers specific fishery data, bycatch reports, certification details (MSC, etc.)). *Values Judgment:* Acceptable level of collateral damage in wild ecosystems.

  7.  **GATE 7: NET ETHICAL ROBUSTNESS**
      *   **Question:** Considering the outputs of Gates 4, 5, and 6 (factual ranges and any Director/Board judgments made): Does the change demonstrate a *robust* net reduction in overall harm (farmed animal suffering + wild animal harm + ecosystem damage) across the *majority of plausible scenarios and reasonable value weightings*? (i.e., It doesn't need to win in *all* scenarios, but must win in most mainstream views and avoid catastrophic losses in any plausible view).
      *   **Sufficient Answer (Yes):** Clear dominance or significant net benefit across core scenarios. Proceed to implementation.
      *   **Sufficient Answer (No):** Net benefit is highly sensitive to specific contested assumptions or weightings; potential for significant net harm in plausible scenarios. *Gate stops here. Return "No: Lacks Robust Net Benefit."*
      *   **Handoff:** Complex trade-offs where reasonable people strongly disagree even after analysis. Hand to "Board of Trustees for Final Value Judgment."
      *   **Type:** Integrative Synthesis (Staff: Director synthesizes prior gate outputs and value judgments).

  **Procedure Application to Live Proposals:**

  **Proposal 1: Replace Ground Beef with Chicken Thigh (High-Volume Entrees)**

  1.  **Gate 1 (Supply Chain):** *Likely PASS.* Large volume entrées; a 3% cut *might* be below threshold, but a full swap likely crosses tiers. Staff must verify exact volumes vs. contract tiers for ground beef and chicken thigh. *Assume PASS for example.*
  2.  **Gate 2 (Student Acceptance):** *PASS.* Similar format (ground meat), familiar flavors (tacos, chili, pasta sauce). Low rejection risk.
  3.  **Gate 3 (Nutrition/Operations):** *PASS.* Chicken thigh meets protein/iron needs; works in same lines; no accommodation conflicts.
  4.  **Gate 4 (Farmed Welfare):** *HANDOFF/FAIL.* *Steelman:* Chicken lives are shorter, potentially less intensely miserable than feedlot cows per some welfare metrics. *Reality:* Worst-case chicken welfare (intensive confinement, leg issues, slaughter) is horrific. Beef welfare (castration, feedlot, slaughter) also bad. Difference depends *entirely* on contested weightings of suffering duration vs. intensity and specific supply chain practices. No robust dominance. *Handoff to Director.* Director likely rejects due to lack of robust welfare gain and potential for worse suffering per serving at the low end of estimates.
  5.  **Gate 5+:** *Not Reached.*
      *   **OUTCOME:** Likely **STOP at Gate 4 (Handoff/Fail)**. Lack of robust farmed animal welfare improvement.

  **Proposal 2: Donor-Funded Weekly Grass-Fed Local Beef Burger Night**

  1.  **Gate 1 (Supply Chain):** *PASS.* New volume, likely triggers new orders.
  2.  **Gate 2 (Student Acceptance):** *PASS.* Burgers are popular; novelty/local/sustainable marketing likely boosts uptake initially. Monitor waste.
  3.  **Gate 3 (Nutrition/Operations):** *PASS.* Beef meets nutrition; can be sourced halal/kosher; minimal operational change.
  4.  **Gate 4 (Farmed Welfare):** *PASS (Conditional).* *If* verifiably pasture-raised with humane slaughter, welfare is *plausibly* significantly better than feedlot beef across most estimates. Robust improvement *relative to the conventional beef it replaces*. (Note: Doesn't compare to *no beef*).
  5.  **Gate 5 (Land Use/Wild):** *FAIL.* Grass-fed beef requires significantly more land per kg protein than grain-fed beef or especially chicken/plant proteins. This *increases* land demand. Plausible estimates suggest the spared land from *not* eating conventional beef is less than the land *used* by grass-fed. Furthermore, converting land to pasture often displaces wild animals/habitat. No robust land sparing or wild animal benefit. High risk of net harm. *Gate stops: "No: Likely Net Harm to Wild Animals/Land."*
      *   **OUTCOME:** **STOP at Gate 5.** Land use impact dominates and is negative. (This is the proposal you likely won't like).

  **Proposal 3: Default Hot Line to Fish/Shrimp 2 Days/Week**

  1.  **Gate 1 (Supply Chain):** *PASS.* Significant new volume of fish/shrimp.
  2.  **Gate 2 (Student Acceptance):** *CAUTIOUS PASS (Requires Pilot).** Risk of rejection higher than beef/chicken swap. *Must run pilot:* Track uptake vs. previous default, plate waste. Strong evidence needed before full roll-out.
  3.  **Gate 3 (Nutrition/Operations):** *PASS.* Fish provides protein/iron; ensure sourcing fits halal/kosher needs (species/slaughter); watch for shellfish allergies in prep.
  4.  **Gate 4 (Farmed Welfare):** *HANDOFF/POTENTIAL PASS.** *Steelman:* Fish/shrimp may have lower neurological capacity for suffering than birds/mammals. *Reality:* Welfare in aquaculture (crowding, disease, slaughter) is often very poor; wild capture involves suffocation/crushing. Comparison to terrestrial livestock is highly uncertain and values-laden. *Handoff to Director.* Director may accept if evidence suggests *possible* significant reduction in high-intensity suffering per kg, despite uncertainty.
  5.  **Gate 6 (Fisheries):** *CRITICAL GATE.** *FAIL (Shrimp):* Most shrimp farming (aquaculture) involves high habitat destruction/mangrove loss. Wild shrimp have *extremely* high bycatch. *PASS (Certain Fish):* *If* using sustainably farmed fish (e.g., trout, some barramundi) with low environmental impact, *or* pole-and-line caught small pelagics (sardines, mackerel) with verified low bycatch. Staff *must* provide specific species/source/fishery data.
  6.  **Gate 5 (Land Use):** *PASS (Aquaculture/Small Pelagics).** Most fish/shrimp (except some unsustainable aquaculture) use less land than terrestrial meat. Land impact likely net positive.
  7.  **Gate 7 (Net Robustness):** *DEPENDS.* If sustainable low-bycatch fish is used (Pass Gate 6) and Director accepts plausible farmed welfare benefit (Pass Gate 4 Handoff), then likely PASS (Net benefit robust across land use & potentially welfare). If shrimp or high-bycatch fish used (Fail Gate 6), then FAIL.
      *   **OUTCOME:** **HIGHLY CONTINGENT.** Can pass only with *very specific, verifiably sustainable sourcing* (likely specific fish types) *and* Director acceptance of farmed welfare uncertainty. Fails utterly with shrimp or unsustainable fish. Requires meticulous sourcing work.

  **Closing Assessment:**

  *   **The Procedure Cannot Do:**
      *   **Resolve Fundamental Value Conflicts:** It surfaces them for human judgment (Director/Board) but doesn't solve them (e.g., wild animal intrinsic value, suffering comparisons across taxa).
      *   **Optimize Complex Multi-Variable Trade-offs:** It focuses on robustness and avoiding clear harm. Truly optimal solutions under deep uncertainty may be elusive; this prioritizes harm reduction.
      *   **Predict Long-Term Market Shifts:** It assesses near-term supply chain impacts. Catalyzing larger shifts (e.g., making plant-based mainstream) requires separate strategy.
      *   **Fully Capture Indirect Effects:** E.g., educational value of "sustainable" labels influencing student habits long-term.
  *   **Systematic Misfires:**
      *   **Overly Conservative:** May reject beneficial changes if uncertainty bands are too wide, even if the *expected* value is positive. This is intentional (robustness focus).
      *   **Underestimates Behavioral Shifts:** Relies heavily on pilots/similarity. A wildly popular novel sustainable item might be missed if deemed too risky at Gate 2.
      *   **Lumpy Procurement Artifacts:** Small changes with cumulative potential might be blocked at Gate 1. Requires aggregating similar small changes over time to hit thresholds.
  *   **Most Sensitive Empirical Facts (Worth Measuring):**
      1.  **Distributor Volume Tier Thresholds:** (From your contracts/invoices). Critical for Gate 1 accuracy. Know your exact breakpoints.
      2.  **Plate Waste by Specific Menu Item:** (Via standardized waste audits). Essential for validating Gate 2 assumptions and measuring actual impact post-implementation. Don't rely on aggregate waste data.
      3.  **Specific Fishery Bycatch Ratios & Gear Types:** (From distributor spec sheets, MSC/FishWatch reports). The make-or-break factor for any seafood proposal at Gate 6. Generic "sustainable seafood" claims are useless.
      4.  **(Secondary) Land Use Efficiency (kg feed/kg product):** (From LCA databases, Agri-footprint). Key input for Gate 5. Focus on *marginal* differences between the specific options being swapped.

  This procedure forces explicit acknowledgment of uncertainty, separates facts from values, prioritizes real-world impact over spreadsheet math, and builds in safeguards against student rejection and supply-chain illusions. It provides an auditable trail and clear handoff points for the necessary value judgments you and the Board must make.
