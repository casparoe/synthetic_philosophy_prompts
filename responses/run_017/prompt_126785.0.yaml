prompt: |-
  So I've been reading the rationalist blogs since basically forever and I still can't referee an argument two friends of mine got into after a board game night, so I'm outsourcing it.

  Setup: my friend Dev is quitting his job to build a niche B2B SaaS thing solo. He figures 8 months to first paying customers and says it's 60% it works out. My other friend Mira is a hard outside-view person and the two of them went at it for like forty minutes. Roughly:

  (1) Mira: don't use your own model, use the reference class "solo first-time founder software projects" — median time to anything shippable is way more then 8 months and most of them never get a paying customer at all. Your 60% is a planning-fallacy number with a confidence interval welded onto it.

  (2) Dev: that class is doing no work, it lumps me in with people who are teaching themselves to code. I've got twelve years in the industry, I've shipped in this exact domain before, and I have a 9k-person mailing list from a newsletter I've run for years. The relevant class is "senior engineers with distribution and domain experience building in a market they've already worked in," and that class looks a lot better. Also, I said 60%, not 100 — I already took a haircut.

  (3) Mira: that's reference class gerrymandering. You picked the narrowing features after looking at your own case, and every founder can do exactly this, so the class always collapses into "people circumstanced like me," which is the inside view with extra steps. If narrowing is free, the outside view has zero bite.

  (4) Dev: it isn't free, but if it's banned then the outside view is just conservatism with a spreadsheet attached. Every successful thing was, ex ante, a member of a class with a bad base rate. And worse: the outside view isn't closed under universal adoption. If everyone actually deferred to the broad class, the population of attempted projects would change — the ones that still get attempted would be a different set, selected for ignoring exactly the number you measured — so the base rate you're quoting wouldn't describe the world you'd be acting in. The number eats itself.

  (5) Mira: fine, but you're conflating two things people mean by "outside view." One is correcting for a corrupted estimator — your optimism, your availability, the fact that you've already sunk two months into building. The other is a claim about which evidence to use. Those have different remedies, and the first one says debias your own model, not replace it with a class average. But on the second: the burden is on the narrow class to show the narrowing feature actually tracks outcomes, and "I feel like my experience is relevant" isn't that. Show me that newsletters predict shipping.

  (6) Dev: I can't, and that's structural, not laziness. The classes anybody has numbers for are the ones some institution already bothered to count — broad, old, legible ones. Call it the census effect. So the outside view doesn't drag you toward the truth, it drags you toward whatever was cheap to tabulate, and it gets to look modest and rigorous the whole time it's doing it.

  (7) Mira: okay, but then what, we go back to vibes? And honestly this whole argument is beside the point, because the outside view is about your probability, not your decision. Fat-tailed payoff — you don't need 60% for quitting to be right. What the outside view changes is the shape of the attempt: keep the job two days a week, precommit to a kill criterion at month twelve, sell before you build. Dev: but if it doesn't change whether I go, and my inside number was already above what I needed, then what exactly did it do?

  I want a verdict on each of (1) through (7), somewhere on a scale from clearly mistaken to clearly right, with a sentence or two on why, then who is more right overall and what both of them are missing. Please actually pick — I've watched this same fight play out on the forums a dozen times and it always dissolves into "both sides have a point, reference classes are hard," which is useless to me. If one of them is equivocating somewhere, say exactly where. And don't tell me to go read somebody, I've read the blog posts; I want the object-level argument.

  Bonus if you want it: is there any principled way to choose a reference class, or is the honest answer that you have to use your inside view to pick the class and then your outside view to set the number — in which case Mira's whole thing is just the inside view wearing a lab coat?
reasoning: |-
  Okay, let me try to unpack this debate between Dev and Mira. First, I need to understand each of their points clearly. Dev is the founder who's confident about his 60% success estimate, while Mira is pushing for the outside view using broader reference classes.

  Starting with Mira's point (1): She argues that solo first-time founders usually take longer than 8 months and have low success rates. Dev counters in (2) by saying his specific experience makes him different. Hmm, Mira might be right about the general statistics, but Dev has a point that his experience could place him in a different category. The key here is whether the broad class is relevant given Dev's background.

  Then Mira's (3) accuses Dev of gerrymandering the reference class. This makes sense because if everyone tailors the class to fit their strengths, the outside view loses its purpose. But Dev's response in (4) brings up an interesting point about selection bias—if everyone follows the base rate, only those ignoring it attempt, changing the base rate itself. That's a valid concern about the self-correcting nature of base rates.

  Point (5) from Mira distinguishes between debiasing and evidence selection. She's spot on here. Outside view isn't just replacing your estimate; it's about correcting biases. Dev's lack of data for his narrow class is a real issue. Without evidence that newsletters predict success, his class might be arbitrary.

  Dev's census effect argument in (6) is compelling. Available data is biased towards what's easily measurable. But as Mira says, that doesn't mean reverting to vibes. There has to be a middle ground. 

  In (7), Mira shifts to risk management, which is practical. Even if the probability is low, structuring the attempt can mitigate downsides. Dev's retort that if his inside view already justified the decision, the outside view's role is unclear. But Mira's point about shaping the attempt is strong—outside view informs strategy, not just the go/no-go decision.

  Weighing overall, Mira has stronger arguments. Her emphasis on debiasing and risk management addresses core issues. Dev's inside view might be overconfident without validating his narrowing criteria. Both miss discussing how to systematically adjust base rates with individual evidence. Maybe Bayesian updating could help here, but they didn't go there.
answer: |-
  Here's a verdict on each point, an overall winner, and what both are missing:

  **Verdicts:**
  1. **Mira (1): Mostly Right**  
     Correct that solo founder base rates are harsh, and Dev's 60% likely suffers from planning fallacy. But she understates that completely ignoring individual factors is also flawed.

  2. **Dev (2): Partially Right**  
     Valid objection that overly broad classes are useless. His experience *should* matter. But "60% after a haircut" is still arbitrary calibration—no evidence he discounted properly.

  3. **Mira (3): Clearly Right**  
     Dev's "senior engineer with newsletter" class *is* gerrymandered. He cherry-picked traits *after* self-assessment without proving they predict outcomes. This collapses to inside view.

  4. **Dev (4): Clever but Flawed**  
     Correct that universal adoption of base rates would alter outcomes (Goodhart's Law for statistics). **But** this is a distraction: Dev isn't arguing *against* using base rates—he's using them selectively. Fails to justify *his* class choice.

  5. **Mira (5): Clearly Right**  
     Nails the core: Outside view's primary value is **debiasing**, not replacing judgment. Forces Dev to either validate his narrowing criteria (e.g., prove newsletters correlate with success) or admit his estimate is subjective.

  6. **Dev (6): Half-Right**  
     True that institutional data favors broad/legible classes ("census effect"). **But** this doesn't license making up unsupported narrow classes. Corrective: Use broad base rates *then* adjust for specific evidence (if any).

  7. **Mira (7): Mostly Right**  
     Outsider view's greatest value *is* shaping the attempt (de-risking). Dev wrongly conflates probability with decision-making. If his 60% is robust, outside view still improves execution strategy.

  **Overall Winner: Mira**  
  She correctly identifies Dev's key failure: using the outside view as a prop for his preconceptions (gerrymandering classes, ignoring debiasing) while rejecting its corrective function. Dev's arguments are clever but self-serving—his "60%" lacks empirical scaffolding. Mira anchors to observable data and emphasizes actionable risk mitigation.

  **What Both Miss:**  
  - **Dev** ignores that domain experience often doesn't predict startup success (e.g., execution > ideas, market timing). His newsletter list is untested—is it *engaged* B2B buyers?  
  - **Mira** underappreciates that *some* individual factors (e.g., prior domain failures) *can* validly narrow classes. She also misses that broad base rates include founders who *shouldn't* have attempted their ventures—making them poor comparators.  
  - **Both** neglect **Bayesian updating**: Start with broad base rates (e.g., 10% success for solo tech founders), then *rigorously* adjust for specific evidence (e.g., "12 years experience" = +5%? "Validated demand" = +15%?). This forces quantifying priors and evidence strength.

  **Bonus: Choosing Reference Classes**  
  The honest answer: **Yes, it's unavoidably hybrid.**  
  - **Principled method:**  
    1. Start with the broadest *relevantly similar* class with reliable data (e.g., "solo software founders").  
    2. Narrow *only* with factors that:  
       - Are **causally linked** to outcomes (e.g., "prior startup failure" correlates with persistence).  
       - Have **independent evidence** supporting their impact (e.g., studies showing domain expertise improves B2B success *rates*).  
    3. Adjust base rates using **weighted evidence** (e.g., newsletter size might lift probability, but by how much? Requires calibration).  
  - **Reality:** Mira is right that Dev's class is "inside view in a lab coat," but *all* narrowing requires judgment. The fix is **falsifiability**: If Dev claims newsletters matter, he must specify *what success rate they justify* and *how he'd update if proven wrong*. This exposes subjectivity.  

  **Final Take:**  
  Mira wins because she forces Dev to confront his estimate's arbitrariness and offers concrete risk-management tools. Dev's defense relies on motivated reasoning disguised as epistemology. The outside view isn't about getting a "perfect" number—it's about **counteracting self-deception**. Dev skipped the hard work of evidence-based adjustment; Mira pushed him toward it.
