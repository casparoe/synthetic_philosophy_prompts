answer: |-
  This is a profound and under-discussed limitation of debate systems—you've perfectly dissected a critical failure mode. It has no widely accepted name, so let's carve out the concept systematically.

  ### The Core Problem: **Weighting Ambiguity Under Irreducible Uncertainty**
  When the core disagreement isn't falsifiable facts but *the relative significance or interpretation of multiple true-but-incomplete claims*, debate exhausts itself on micro-truths without resolving macro-judgment. The judge gains no traction on the *weighting* of factors, which remains subjective or domain-dependent.

  **Proposed Name:**  
  **Epistemic Learned Helplessness in Multi-Factor Attribution (ELMA)**  
  *(or "Resolution Residue" for brevity)*

  ### Definition:
  ELMA occurs when:  
  1.  **Truth is composable**: The answer depends on aggregating multiple sub-claims (C₁, C₂, ..., Cₙ).  
  2.  **Sub-claims are locally verifiable**: Each Cᵢ can be individually checked by the judge.  
  3.  **Global weighting is unanchored**: No shared, objective function exists to combine Cᵢ into a final judgment.  
  4.  **Debate exhausts local disputes**: All Cᵢ are either conceded or resolved as "true but qualified," leaving only irreducible disagreement over their *significance*.  

  ### Boundary Cases: What Makes a Question ELMA-Susceptible?
  | **Question Type**          | **Chain-of-Facts (Debate Works)**                | **ELMA Territory (Debate Fails)**                |  
  |----------------------------|--------------------------------------------------|--------------------------------------------------|  
  | **Structure**              | Serial dependencies (e.g., proof; causal chain)  | Parallel factors with tradeoffs (e.g., risk assessment) |  
  | **Falsifiability**         | Single broken link disproves whole               | All links true-but-insufficient/overemphasized   |  
  | **Resolution Mechanism**   | Binary fact-checking                            | Subjective weighting or holistic intuition       |  
  | **Example**                | "Is this chemical reaction possible?" (Step 3 violates thermodynamics → NO) | "Is this drug safe enough for market?" (All side-effect rates true, but risk tolerance disputed) |  

  ### Why Existing Concepts Miss the Mark:
  1.  **Motte-and-Bailey Fallacy**: Involves deliberate retreat from weak to strong claims. ELMA has no bad faith—all claims stand, just underweighted/overweighted.  
  2.  **Argument Dilution**: Focuses on burying key points in noise. Here, *all* points are addressed clearly, but their collective meaning is unclear.  
  3.  **Underdetermination of Theory**: Philosophical term; too broad (applies to single hypotheses). ELMA is about aggregating *known* truths.  
  4.  **Gish Gallop**: Overwhelming with false/weak arguments. ELMA features *true* arguments with unresolved salience.  

  ### Solutions for ELMA-Type Questions:
  1. **Shift the Debate Target**:  
     - Instead of "Is the bridge safe?", debate "Which explicit safety threshold (e.g., 1/10,000 failure risk) does this design meet?"  
     - Forces disagreement onto quantifiable standards.  

  2. **Require Weighting Commitments Upfront**:  
     - Debaters must propose their weighting function *first* (e.g., "Safety = 0.7 × load margin + 0.3 × inspection rigor").  
     - Debate then critiques the weights or inputs.  

  3. **Hybridize with Estimation Markets**:  
     - Debaters bet on probabilities of sub-claims mattering (e.g., "Incomplete welds increase failure odds by X%").  
     - Prices aggregate weightings implicitly.  

  4. **Synthetic Judges**:  
     - Train an ML judge on historical data (e.g., past bridge approvals/failures) to *learn* domain weightings.  
     - Human judge evaluates debate relative to this baseline.  

  ### When to Suspect ELMA:
  Questions where:  
  - The answer is **"It depends"** followed by a list of factors.  
  - Experts disagree despite agreeing on underlying facts.  
  - The field uses **checklists with implicit thresholds** (e.g., medical diagnostics, policy risk assessments).  

  Your bridge and psychology examples are quintessential ELMA: debate resolves the *atoms* (weld records, load calcs, p-values) but not the *molecule* (safety/replicability judgment). The key is recognizing that not all questions are truth-apt—some are **decision-apt**, requiring tools beyond falsification. ELMA exposes debate's limits when "What is true?" becomes "What *counts*?"
