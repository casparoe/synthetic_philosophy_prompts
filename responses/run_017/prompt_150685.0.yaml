  **Key Revision & Survivor**

  *   **Single Revision Cleaning Up Most:** **Qualify (a) to acknowledge the spectrum of choice/circumstance.** This directly addresses the most severe tension (a × d) and softens the clash with (c). It makes your justice principle more realistic and defensible without abandoning responsibility.
