  *(e.g., does "recidivism" reflect policing biases, not underlying behavior?)*  
  - **Yes** → **Leaf 1: Construct Abandonment** (throw out target variable).  
    - *Named position?* Yes (e.g., "Fairness as Critique" in critical data studies).  
    - *Most awkward commitment:* Must define an alternative target or decision framework without prediction, often lacking institutional buy-in.  
  - **No** → Proceed to Q5.  

  #### **Q4 (if feedback loop invalidates target OR Q3=Yes): Should the practice the classifier serves be abandoned?**  
  *(e.g., should pretrial detention exist at all?)*  
  - **Yes** → **Leaf 2: Practice Abolition** (abolish the practice).  
    - *Named position?* Yes (e.g., prison abolitionism).  
    - *Most awkward commitment:* Defending alternative systems (e.g., restorative justice) in contexts where the practice is deeply institutionalized.  
  - **No** → **Leaf 3: Human Fallback** (decline to build score; use human judgment/blunt rules).  
    - *Named position?* Yes ("Procedural Minimalism").  
    - *Most awkward commitment:* Accepting that humans may be more biased/arbitrary than algorithms.  

  #### **Q5: Should group membership be excluded from training data?**  
  *(e.g., delete race/zip code variables to "blind" the model.)*  
  - **Yes** → **Leaf 4: Fairness Through Unawareness (Trap)**.  
    - *Named position?* Yes (common industry practice).  
    - *Trap diagnosis:* Proxy variables (e.g., income → race) reactivate group disparities; often worsens fairness. Not a solution, hence a terminal "trap" leaf.  
  - **No** → Proceed to Q6.  

  #### **Q6: Which fairness error is morally worse in this context?**  
  *(Scored branch: Assign 1 point to FNs (e.g., high-risk defendant released), 1 to FPs (e.g., low-risk defendant jailed). Use real cases: e.g., pretrial detention FPs harm employability; FNs risk public safety.)*  
  - **False Negatives (FNs) are worse** → Proceed to Path A.  
  - **False Positives (FPs) are worse** → Proceed to Path B.  
  - **Equal concern** → Proceed to Q7.  

  ---

  #### **Path A (FNs worse): Which criterion minimizes harm from FNs?**  
  - Prioritize **equal FNR** → **Leaf 5: Criterion Selection (Equal FNR)**.  
    - *Named position?* Yes (e.g., "Public Safety Priority" in criminal justice).  
    - *Most awkward commitment:* Tolerating higher FPs in some groups (e.g., over-jailing low-risk Black defendants).  
  - Prioritize **predictive parity** → **Leaf 6: Criterion Selection (Predictive Parity)**.  
    - *Named position?* Uncommon, but used in finance.  
    - *Most awkward commitment:* Accepting higher FNRs in groups with lower base rates.  

  #### **Path B (FPs worse): Which criterion minimizes harm from FPs?**  
  - Prioritize **equal FPR** → **Leaf 7: Criterion Selection (Equal FPR)**.  
    - *Named position?* Yes (e.g., "Anti-Subordination" in civil rights law).  
    - *Most awkward commitment:* Higher FNs in high-risk groups (e.g., releasing more violent offenders).  
  - Prioritize **calibration** → **Leaf 8: Criterion Selection (Calibration)**.  
    - *Named position?* Yes (e.g., "Accuracy First" in predictive policing).  
    - *Most awkward commitment:* Allowing disparate FPR/FNR if scores are "accurate."  

  ---

  #### **Q7 (if Q6=Equal concern): Should the fairness metric be chosen by the subject?**  
  *(e.g., a defendant picks whether FPR/FNR equality matters more for their case.)*  
  - **Yes** → **Leaf 9: Metric Self-Determination**.  
    - *Named position?* Unnamed (no real-world examples; theoretically debated).  
    - *Diagnosis:* Likely incoherent—individual choices could conflict with group fairness or create gaming. Empty cell.  
  - **No** → Proceed to Q8.  

  #### **Q8: Should the institution disclose fairness tradeoffs without resolving them?**  
  *(e.g., publish: "We equalize FPR; this costs Group X 5% more FNs.")*  
  - **Yes** → **Leaf 10: Transparency Without Resolution**.  
    - *Named position?* Unnamed (rarely implemented; "fairness menus" in research only).  
    - *Diagnosis:* Good practice but not a standalone position—shifts responsibility to stakeholders.  
  - **No** → Proceed to Q9.  

  #### **Q9: Should fairness ignore groups and focus on similar individuals?**  
  *(e.g., ensure two people with identical crime history/rehab access get similar scores, regardless of race.)*  
  - **Yes** → **Leaf 11: Individual Fairness**.  
    - *Named position?* Yes (theoretical CS work, e.g., Dwork et al.).  
    - *Most awkward commitment:* Defining "similarity" without baking in bias (e.g., "crime history" may reflect policing bias).  
  - **No** → **Leaf 12: Procedural Fairness** (move fairness off metrics).  
    - *Named position?* Yes (e.g., "Democratic AI" in policy).  
    - *Most awkward commitment:* Fair procedures (e.g., community input) may still produce biased outcomes.  

  ---

  ### **Key Notes on Structure**  
  - **12 leaves total**, covering all requested positions:  
    - Single criterion + moral argument (Leaves 5–8).  
    - Throw out target (Leaf 1).  
    - Individual fairness (Leaf 11).  
    - Procedural fairness (Leaf 12).  
    - Human fallback (Leaf 3).  
    - Practice abolition (Leaf 2).  
    - Metric self-determination (Leaf 9).  
    - Publish tradeoffs (Leaf 10).  
    - Fairness through unawareness trap (Leaf 4).  
  - **Indistinguishable leaves?** Leaf 10 (publish tradeoffs) and Leaf 12 (procedural) *can* overlap if transparency is part of the procedure. To separate them:  
    - **Extra question:** *"Does disclosure alone satisfy fairness, or must the procedure rectify harms?"*  
      - Disclosure only → Leaf 10.  
      - Rectify harms → Leaf 12.  
  - **Feedback loop integration:** Q1–Q2 force engagement early. "Yes" to Q1 funnels toward abolition (Leaf 2), human fallback (Leaf 3), or construct abandonment (Leaf 1), but doesn't preclude other paths.  
  - **Unattractive/unexplored positions:**  
    - Metric self-determination (Leaf 9) is empty—no workable implementations exist.  
    - Transparency without resolution (Leaf 10) is "good practice" but rarely defended as a terminal position.  
  - **Why this works live:**  
    - **Binary branches** (except scored Q6) prevent decision paralysis.  
    - **Concrete cases** (e.g., pretrial FPs/FNs) anchor questions.  
    - **Flowchart depth:** Max 4 questions deep (Q1 → Q2 → Q4 → Leaf 2/3).  

  This tree maps the logical space while forcing confrontation with real-world dynamics (e.g., feedback loops). Use it to reveal where disagreements truly lie—not in the math, but in empirical assumptions and value weightings.
