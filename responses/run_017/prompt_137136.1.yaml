answer: |-
  Based on Marcos's track record, two primary candidate rules emerge as equally consistent with his verdicts. They diverge sharply on your boat-building case and the others. Here's the breakdown:

  **Candidate Rule 1: The Faithful Replication Criterion**
  *   **Definition:** A phenomenon is a Darwinian meme *only if* it relies on the faithful copying of specific, discrete, inherited units of information (memes) from one individual/carrier to another. Independent regeneration from environmental cues, universal biases, or individual problem-solving does *not* count, even if the outcome is similar. Lineage matters more than outcome.
  *   **Fits Verdicts:**
      *   **Yes (Chain Email, Jingle, Rumor, Ritual, Fashion):** All involve copying specific informational content (the email text, the jingle tune/lyrics, the rumor details, the ritual actions, the fashion item/style) from others.
      *   **No (Sound Change):** Emerges independently due to universal articulatory laziness in each learner, not copying a specific variant. No lineage of copied units.
      *   **No (Antiseptic Routine):** Each hospital reinvents its own version based on mortality data (environmental feedback), not by copying a canonical form from another hospital. No faithful transmission.
      *   **No (Keyboard Layout):** Survives due to network effects/costs, but crucially, *the specific layout design itself isn't being selected for copying fidelity*; it's locked in. Marcos emphasizes "retraining is expensive," not "it's copied well." The *survival* is economic, not memetic selection on the *design*.
  *   **Predictions for Your Cases:**
      *   **Boat Tradition (General):** **NO.** No faithful copying of discrete design units. Knowledge is tacit, gained through individual trial-and-error ("guessing, trying") filtered by performance ("keeping what floats"). It's cumulative improvement driven by individual learning + environmental selection, not copying a replicator. (Similar to antiseptic routine reinvention).
      *   **Boat Tradition (Teachable-but-Worse Variant):** **YES.** *This specific design variant* **is** being faithfully copied ("taught in a single season"). Its spread is due to its high copy-fidelity/ease of transmission relative to other variants, even though it performs worse. It wins *because* it's copied easily.
      *   **Perfectly Copied Keyboard Standard:** **YES.** The arrangement *is* copied perfectly faithfully ("copied perfectly faithfully"). This satisfies the core requirement of faithful replication of a specific unit, even if it never changes.
      *   **Monastic Scribal Rule:** **YES.** The rule mandates perfect, faithful copying ("reproduce the text letter for letter") of specific informational units (the text). Variation (correction) is actively suppressed. This is the epitome of faithful replication, regardless of improvement.

  **Candidate Rule 2: The Darwinian Population Criterion**
  *   **Definition:** A phenomenon is a Darwinian meme *only if* it exhibits a population of variants undergoing the full Darwinian algorithm: 1) **Heredity/Inheritance:** Variants are passed on (not necessarily perfectly). 2) **Variation:** New variants arise. 3) **Differential Fitness/Selection:** Variants differ in their ability to spread/replicate in a given environment. 4) **Cumulative Adaptation:** This process leads to changes in the population *over generations* that improve functional fit to the environment (beyond just initial spread). Mere spread or persistence isn't enough; there must be adaptation *via* selection on inherited variation.
  *   **Fits Verdicts:**
      *   **Yes (Chain Email, Jingle, Rumor, Ritual, Fashion):** All show variants (different emails, jingles, rumors, ritual interpretations, fashions) spreading differentially based on traits (catchiness, emotional charge, group cohesion, novelty/rarity). Fashion *specifically* shows frequency-dependent selection. Cumulative adaptation is implied in ritual (synchronization) and fashion (cyclic adaptation to "rarity" niche).
      *   **No (Sound Change):** While variants exist and one wins (the simplified cluster), the *reason* it wins isn't Darwinian selection among inherited variants competing *in a population*. It wins *every time independently* due to a universal bias (laziness). No heritable variation in a population undergoing differential spread; it's convergent evolution via constraint.
      *   **No (Antiseptic Routine):** Variation exists (different routines), and selection occurs (mortality data), but the *inheritance* is broken. Each hospital *regenerates* its solution based on environmental feedback, not by inheriting variants from others. No lineage of inherited variants being selected *differentially*. Improvement is via individual/social learning, not Darwinian selection on inherited memes.
      *   **No (Keyboard Layout):** Variation is suppressed (one dominant standard). Its survival isn't due to the inherent fitness *of the layout design itself* competing with others in a population, but due to external network effects/costs. There's no differential fitness *of variants* leading to adaptation; it's locked in. (No heritable variation + selection).
  *   **Predictions for Your Cases:**
      *   **Boat Tradition (General):** **YES.** Clear population of boat design variants. Heredity: Designs are passed down imperfectly ("guessing, trying," but knowledge is built upon). Variation: New trials introduce changes. Selection: Environmental (floats, doesn't capsize). **Cumulative Adaptation:** Designs measurably improve over generations. This is cumulative cultural evolution via selection on inherited (albeit imperfectly) variation.
      *   **Boat Tradition (Teachable-but-Worse Variant):** **YES.** This variant has high *cultural fitness* (spreads easily/quickly) despite lower *functional fitness* (worse performance). It out-competes the better design *differentially* because of its transmission advantage. This *is* Darwinian selection on heritable variation (teachability is a variant trait).
      *   **Perfectly Copied Keyboard Standard:** **NO.** No variation ("never varies"), no differential selection ("never improves"). It's static. Fails criteria 2 (Variation) and 4 (Cumulative Adaptation). Mere persistence via faithful copying isn't enough.
      *   **Monastic Scribal Rule:** **NO.** Actively suppresses variation ("must never correct it") and thus selection and adaptation. Perfect copying preserves the meme but prevents the Darwinian process of adaptation via selection on variation. Fails criteria 2 (Variation) and 4 (Cumulative Adaptation).

  **Analysis & Best Guess for Marcos:**

  *   **Rules are Ambiguous:** Both rules fit his past verdicts *perfectly*. The key differences lie in the antiseptic routine and keyboard verdicts.
      *   Rule 1 focuses on the *mechanism of spread* (copying vs. regeneration) for the antiseptic routine and the *lack of copying-based selection* for the keyboard.
      *   Rule 2 focuses on the *lack of heritable variation in a population* for the antiseptic routine and the *lack of variation + selection leading to adaptation* for the keyboard.
  *   **Your Cases Force the Issue:**
      *   **Boats (General):** Rule 1 says NO (no copying), Rule 2 says YES (cumulative adaptation via selection on inherited variation).
      *   **Teachable Boat:** Both likely say YES. Rule 1 sees copying; Rule 2 sees selection on a transmission-fitness trait.
      *   **Keyboard Standard:** Rule 1 says YES (faithful copying), Rule 2 says NO (no variation/adaptation).
      *   **Scribal Rule:** Rule 1 says YES (faithful copying), Rule 2 says NO (no variation/adaptation).
  *   **Best Guess for Marcos's Rule & Verdicts:** Based on his emphasis on "not copying a canonical form" (Antiseptic) and "survives purely because everyone else already uses it... not selection" (Keyboard), **Rule 1 (Faithful Replication Criterion)** seems more likely. He's fixated on the *copying mechanism itself* as the defining feature, not necessarily the population-level adaptive process.
      *   **Boat Tradition (General):** **NO.** "Not copying discrete designs; it's individual trial-and-error filtered by the sea, each builder reinventing the wheel like the hospitals. No meme lineage."
      *   **Boat Tradition (Teachable):** **YES.** "Ah, *this specific design* is being copied directly and efficiently. It spreads *because* it's easy to copy. That's the meme."
      *   **Perfectly Copied Keyboard Standard:** **YES.** "It's copied perfectly faithfully. That's replication. The reason it *persists* (network effects) is separate from the fact that the design *is* replicated."
      *   **Monastic Scribal Rule:** **YES.** "The ultimate meme! Perfect, enforced copying. The rule against correction *ensures* fidelity. No variation needed for it to *be* a replicator."

  **The Cleanest Test Case to Force Them Apart:**

  Phrase this concretely: **"A children's clapping game passed down perfectly for generations with zero changes to the rhythm or sequence. Every child learns it *exactly* from older children. However, analysis shows the specific rhythm is actually the *least* catchy or enjoyable variant possible; it only survives because it was the first one written down in a famous songbook used in all schools, making it the universal starting point. No child invents a different version because they think 'that's just not how it's done.'"**

  *   **Why it Forces the Issue:**
      *   **Rule 1 (Faithful Replication) Prediction: YES.** Perfect, faithful copying of a specific unit (the rhythm/sequence) occurs across generations. The *reason* for its persistence (historical accident/lock-in) is secondary to the copying mechanism itself.
      *   **Rule 2 (Darwinian Population) Prediction: NO.** While there is faithful copying (heredity), there is **no variation** (no different rhythms arise or compete) and thus **no selection** based on inherent properties (like catchiness). There is **no cumulative adaptation** (it's the worst variant!). Its persistence is due to institutional lock-in/historical accident (like the keyboard), not Darwinian selection favoring *its* properties over others. Fails criteria 2 (Variation), 3 (Differential Fitness based on traits), and 4 (Cumulative Adaptation).
  *   **How it Differs from Marcos's Cases:** Unlike the keyboard (where he said No, likely focusing on lack of copying-based *selection* or the regeneration aspect of antiseptic), this case isolates *perfect copying without variation or adaptation*. Rule 1 must say Yes; Rule 2 must say No. The scribal rule is similar, but the songbook origin adds the "worse variant/lock-in" element mirroring the keyboard, making the conflict with Rule 2 even sharper.

  **Conclusion:** Marcos is likely using **Rule 1 (Faithful Replication Criterion)**. Predict he says **NO** to the general boat tradition, **YES** to the teachable boat variant, **YES** to the keyboard standard, and **YES** to the scribal rule. The clapping game case will definitively expose whether he requires the Darwinian population process (Rule 2) or if faithful copying alone is sufficient (Rule 1). Good luck with the £20!
