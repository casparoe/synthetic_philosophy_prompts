prompt: |-
  I'm writing the section of my chapter where I argue that evidentialism's favourite escape hatch — believe less, act on the hypothesis anyway — its not generally available, and I need one clean case to carry the argument. Can you build me one?

  Specs: realistic, one paragraph, clinic or workplace. Some proposition p that it would be genuinely better for the agent to believe, where the evidence for p is insufficient (not merely contested), and where p's truth doesn't depend on whether she believes it — no bootstrapping, no faith that makes its own fact true, and no shipowners or mountaineers, since that whole family of cases lets the evidentialist off far to easily. What I need instead is that the good is available only to believing and not to accepting: something in the story blocks the act-as-if route, but it has to be blocked by a mechanism in the case, not by me stipulating in the set-up that acting as if fails. The option should still be live, forced and momentous in James's sense, so that James plainly licenses the belief and Clifford plainly forbids it.

  Then: what Clifford's rule says and why, what James's argument gives you and why, what the belief-versus-acceptance move says, and the exact point at which that third route breaks. Isolate the feature doing the work, tell me what happens if you strip it out, and give me the strongest Cliffordian reply — I'd rather hear it now than from a referee. Bonus if you can name the condition in which a payoff is available only to genuine belief rather than to acceptance; I keep needing it and "conviction-dependent" doesn't feel right.
