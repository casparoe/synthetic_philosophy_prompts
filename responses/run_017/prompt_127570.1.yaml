  The user provides detailed background on both positions and their concessions. They want a structured document including: agreed claims, disagreements table, cruxes with testable predictions, subsystem audits, criteria evaluation, terminology clarification, and evidence each would accept against their own position. The document must be neutral and signable by both parties.

  First, I need to synthesize their conceded points into non-vacuous numbered statements. Both agree the brain isn't a von Neumann machine, trivial implementations must be blocked, non-computational signaling exists, both modeling approaches are useful, and consciousness is separate. These can be strengthened into substantive claims without filler.

  For the disagreements table, I'll identify six core issues: implementation criteria, representational status, uniqueness of computation, causal vs historical content, explanatory targets, and modeling value. For each, I'll draft formulations each would sign, avoiding straw positions. Where compromise isn't possible (like the fundamental "does it compute" question), I'll note irreconcilability.

  The cruxes section should focus on testable sub-questions. The user suggests four key issues: implementation criteria boundaries, background conditions, multiplicity, and content origin. For each, I'll propose concrete experiments like intervention-transfer tests, hardware porting, and gradual substrate replacement - with specific predictions from both sides.

  The subsystem audit will compare judgments across neural structures. I suspect disagreements will cluster in areas like neuromodulation and glia where signaling is less digital. The criteria evaluation will assess the user's etiological and compression proposals - Marcus would accept both with caveats while Ines rejects them as still observer-dependent.

  Terminology clarification is crucial. Many disputes may reduce to different senses of "computation" (mathematical, causal, explanatory). I'll map where disagreements persist even with clarified definitions.

  Finally, for evidence against their positions, Marcus would need failed predictions under his implementation criteria, while Ines would require cases where only computational explanations capture novel interventions.

  The tone must remain neutral and collaborative throughout. Where positions are irreconcilable (like the core metaphysical question), I'll explicitly note it without forcing false agreement. The goal is clarity on exactly where they disagree and how to test it, not resolution.
answer: |-
  ## Adversarial Collaboration: Joint Statement on Computation in Neural Systems  
  **Drafted for Marcus & Ines**  
  Version 0.9 | Confidential Draft for Review  

  ---

  ### 1. Agreed Claims (Non-Vacuous)  
  Both signatories endorse the following statements as substantive, empirically grounded points of consensus:  

  1.  **Non-Von Neumann Architecture:** The brain lacks core features of classical von Neumann machines (e.g., stored program, central clock, clean CPU/RAM separation, error-corrected digital communication). Claims that "the brain is a computer" must specify a meaning distinct from this architecture.  
  2.  **Triviality Constraint:** Any criterion for claiming a physical system "implements a computation" must block trivial mappings (e.g., reading arbitrary computations off rocks or stomachs via gerrymandered state assignments).  
  3.  **Plurality of Neural Signaling:** Significant neural phenomena (e.g., dendritic plateaus, gap junctions, volume transmission, astrocyte Ca²⁺ waves, ephaptic effects, stochastic release, overlapping assemblies) do not readily map onto canonical notions of discrete, step-wise computation over symbolic representations. Their explanatory adequacy requires non-computational frameworks.  
  4.  **Utility of Multiple Modeling Paradigms:** Computational models (positing representations & algorithms) and dynamical/embodied models (positing continuous state spaces & coupling) are both empirically useful tools for prediction and control in neuroscience. Neither approach is universally superior across all explananda.  
  5.  **Explanatory Autonomy:** The question "Does the brain compute?" is distinct from "Could a machine be conscious?" Neither position (pro- or anti-computation) entails a specific answer to the hard problem of consciousness by itself.  

  ---

  ### 2. Disagreements Table  

  | Issue                                      | Marcus Would Sign                                                                                               | Ines Would Sign                                                                                                                                                                | Nature of Disagreement                                                                                                  |  
  | :----------------------------------------- | :-------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |  
  | **Core Implementation Claim**              | Specific neural circuits (e.g., retinal ganglion cell arrays) literally perform computations over representations; successful mechanistic models reveal real causal structure. | Neural systems are high-dimensional dynamical systems; describing some states/transitions as "computations" is a useful modeling heuristic, not a discovery of intrinsic properties. | **Substantive (Metaphysical):** Is computation a fundamental *causal category* in nature (Marcus) or an *observer-relative description* (Ines)? |  
  | **Uniqueness of Computation**              | For a given circuit under specific conditions, there is a fact of the matter about *the* computation it implements, constrained by causal structure & implementation criteria. | Any physical system can be mapped to *many* computations. There is no single "privileged" computation implemented by a circuit; the choice is pragmatic, driven by explanatory goals. | **Substantive (Metaphysical/Epistemic):** Does causal structure uniquely determine *which* computation is performed? |  
  | **Origin of Representational Content**     | Content depends primarily on *current causal role* within the system's functional architecture. Learning history shapes the architecture enabling that role. | Content depends constitutively on *historical contingencies* (learning/development/evolution). Current causal role alone is insufficient to fix content. | **Substantive (Semantic):** What grounds the "aboutness" of a neural state? |  
  | **Scope of "Background Conditions"**       | Implementation includes the minimal physical substrate sufficient for the causal transitions defining the computation. Weird physiology (e.g., ephaptic coupling) can be part of the implementation or a boundary condition, depending on functional impact. | There is no non-arbitrary line between "implementation" and "background conditions." The brain's dense, continuous coupling means *all* physical details are constitutive of the dynamics; isolating a "core computation" is always an abstraction. | **Substantive (Methodological):** Where does the computation "end" and the environment/coupling "begin"? |  
  | **Primary Explanatory Target**             | Computational models uniquely explain how systems achieve specific, complex input-output *functions* robustly across variations in implementation detail or noise. | Dynamical models uniquely explain the real-time, embodied *process* and temporal structure of behavior/neural activity, capturing features missed by input-output mappings. | **Verbal-Pragmatic:** Disagreement on what constitutes the most significant or fundamental explanandum. |  
  | **"The Brain Computes" (Summary Claim)** | Yes, in a literal, mechanistic sense: specific subsystems perform identifiable computations over representations. | No, not literally: it is a complex dynamical system best described using dynamical/embodied frameworks; computational descriptions are useful tools but not literal truths. | **Substantive (Core):** **Irreconcilable on this phrasing.** (See Cruxes & Terminology). |  

  ---

  ### 3. Cruxes & Testable Predictions  
  Settling these *specific sub-questions* would rationally compel at least one side to significantly update their position.  

  *   **(a) Implementation Criterion Validity:**  
      *   **Test (i): Intervention-Transfer.** Train a mechanistic computational model (M-type: variables map to cell types, ops to causal interactions) and a black-box dynamical model (I-type: fits recorded activity equally well) on the same sensory-motor dataset (e.g., rodent whisking). Predict novel optogenetic suppression patterns (e.g., silencing specific interneuron types) and responses to never-seen stimulus families (e.g., chaotic whisker deflections).  
          *   *Marcus Prediction:* M-model will significantly outperform I-model on *both* suppression patterns *and* novel stimuli (>20% better RMSE on key kinematic/neural metrics). Failure implies his criterion doesn't isolate causally relevant structure.  
          *   *Ines Prediction:* I-model will match or outperform M-model on suppression patterns (showing dynamics capture causal structure) and match on novel stimuli. Significant M-model failure on suppression (>15% worse) suggests computational mappings are not robustly causal.  
  *   **(b) Background Conditions Boundary:**  
      *   **Test (ii): Porting & Perturbation.** Identify a computation Marcus claims for a circuit (e.g., "cerebellar granule layer performs sparse combinatorial encoding"). Implement it *exactly* on radically different hardware (e.g., analog neuromorphic chip, FPGA, even mechanical system) meeting Marcus's implementation criterion. Then, introduce perturbations mimicking "weird physiology" (e.g., simulated stochastic release, cross-talk, slow modulatory drift).  
          *   *Marcus Prediction:* The computation remains identifiable *until* perturbations disrupt the causal transitions defined by the abstract model. Specific point of failure depends on the model's tolerance parameters. Survival despite perturbations shows they are background.  
          *   *Ines Prediction:* Identifying "the same computation" will become increasingly arbitrary/vague under perturbations, especially cross-talk/drift. Success requires imposing *additional* dynamical constraints not in the original abstract model, showing its insufficiency.  
  *   **(c) Multiplicity of Implementations:**  
      *   **Test (iii): Slow Substrate Replacement.** Gradually replace neurons in a trained circuit (e.g., cortical microcircuit supporting a decision task) with artificial devices replicating *only* the measured input-output function and plasticity rule of each cell *in isolation*. Monitor task performance and neural population dynamics.  
          *   *Marcus Prediction:* The core computation (e.g., evidence accumulation) is maintained until replacements disrupt the specific causal interactions implementing the computational steps (>50% replacement? Specific connectivity motifs lost?). Behavior may degrade earlier due to loss of non-computational dynamics.  
          *   *Ines Prediction:* The "computation" degrades continuously with each replacement, as the unique dynamical context of biological coupling is lost. No clear threshold exists where "the computation" stops; only behavioral/metric degradation is measurable.  
  *   **(d) Origin of Content:**  
      *   **Test:** "Knock-in" History. Train two identical neural network models (e.g., RL agent) on the *same* task, but with different learning histories (e.g., Model A: learned from scratch in target environment; Model B: weights "knocked-in" via distillation from A, bypassing learning history). Probe for content (e.g., representational similarity analysis, perturbation analysis, generalization to novel but related tasks).  
          *   *Marcus Prediction:* Models A & B will show identical representational content and causal roles *once trained*. History is causally inert for current content.  
          *   *Ines Prediction:* Model B will show subtly different representations (e.g., less robust, different generalization patterns) revealing the constitutive role of history, even if input-output matches.  

  ---

  ### 4. Subsystem Audit: "Does Subsystem X Compute?"  
  *(C: Computes literally; D: Dynamical system, computation is a description; ?: Genuine Disagreement)*  

  | Subsystem              | Marcus Verdict | Ines Verdict | Agreement/Disagreement | Notes |  
  | :--------------------- | :------------- | :----------- | :--------------------- | :---- |  
  | **Retina**             | C              | D            | **?**                  | Marcus: Clear input-output transform. Ines: Continuous, analog phototransduction & processing. |  
  | **Cerebellum**         | C              | D            | **?**                  | Marcus: Canonical feedforward circuit, timing. Ines: Embodied timing loop, dense recurrent dynamics. |  
  | **Cerebral Cortex**    | C              | D            | **?**                  | Core disagreement. Marcus: Hierarchical processing. Ines: Embodied, situated dynamics. |  
  | **Basal Ganglia**      | C (Selection)  | D            | **?**                  | Marcus: Action selection algo. Ines: Dynamic gating/thresholding. |  
  | **Neuromodulatory Sys**| D (Mostly)     | D            | **Agree (D)**          | Volume transmission, slow state shifts = primarily dynamical. |  
  | **Spinal CPG**         | D              | D            | **Agree (D)**          | Central pattern generation = paradigmatic dynamical system. |  
  | **Glia**               | D              | D            | **Agree (D)**          | Homeostasis, metabolic coupling = non-computational roles. |  

  ---

  ### 5. Evaluation of Proposed Implementation Criteria  
  *(Response per side; flaws; alternative?)*  

  *   **Criterion A (Etiological):** Computes iff selected/developed/trained/designed to maintain counterfactually robust map to abstract states.  
      *   *Marcus:* Accepts *if* "counterfactually robust map" includes causal efficacy. Flaw: May under-block (e.g., highly evolved stomach acid control?). Needs stricter causal coupling.  
      *   *Ines:* Rejects. Still observer-relative ("map", "abstract states"). "Selected for" is ambiguous; doesn't make computation intrinsic.  
  *   **Criterion B (Compression):** Computes iff the shortest predictive description under interventions *requires* content/formal states.  
      *   *Marcus:* Accepts *if* "requires" means *causal-mechanistically necessary for prediction under intervention*. Flaw: Compressibility is epistemic, not ontological. A rock *could* have a long dynamical description.  
      *   *Ines:* Rejects. Favors dynamical descriptions by definition ("shortest predictive"). Still pragmatic (depends on *our* math, *our* interventions).  
  *   **Potential Common Ground Criterion?**  
      *   **Weak Causal Coupling:** A system S implements computation C only if: (1) There is a physically-definable mapping from S's states to C's states. (2) The causal transitions between S's states reliably mirror the formal transitions of C *under relevant interventions*. (3) This mirroring contributes non-trivially to S's capacity to produce specific outputs given specific inputs *in its natural context*.  
      *   *Likely Status:* Marcus sees this as a minimal core. Ines sees (1)/(2) as still observer-dependent and (3) as insufficient to distinguish from non-computational systems. **Unlikely full agreement.**  

  ---

  ### 6. Terminology: Disentangling "Computation"  

  *   **Senses of 'Computation':**  
      *   **Mathematical Mapping:** Any input-output system can be *described as* computing a function (trivial sense). **Both reject this as sufficient.**  
      *   **Causal-Mechanistic:** Physical states/transitions causally mirror formal states/transitions (Marcus's core sense).  
      *   **Explanatory-Role:** Positing representations/computations provides indispensable explanatory power for certain phenomena (e.g., systematicity, robustness).  
  *   **Disagreements Surviving Clarification:**  
      1.  **Is the Causal-Mechanistic sense *literally true* of neural systems?** (Marcus: Yes; Ines: No, mirroring is imposed/selected).  
      2.  **Does Explanatory-Role success imply Causal-Mechanistic truth?** (Marcus: Generally yes, via inference to best explanation; Ines: No, indispensability is pragmatic).  
      3.  **Is the Causal-Mechanistic sense *exclusively necessary* for explaining cognition/behavior?** (Marcus: For core functions, often yes; Ines: No, dynamical explanations are sufficient and often more fundamental).  

  ---

  ### 7. Evidence Against Own Position  

  *   **Marcus:** "I would reconsider if, *despite satisfying a strict implementation criterion* (blocking triviality, reflecting causal structure), a computational model of a well-characterized circuit *consistently failed* to predict the effects of targeted interventions (like Test (i) predictions failing) while a purely dynamical model succeeded. Specifically, if dynamical models outperformed computational models by >30% on predicting novel intervention effects across multiple circuits, it would challenge the causal efficacy of the posited computational structure."  
  *   **Ines:** "I would reconsider if dynamical models, incorporating full embodiment and known physiology, *fundamentally failed* to capture the *temporal precision, robustness, and generalization capabilities* of a neural system across diverse tasks, while a computational model *with fixed representational assignments and algorithms* succeeded *and* its success *required* interpreting its states as representations with specific content (not just as dynamical variables). Specifically, if computational models consistently predicted fine-grained timing or novel compositional behaviors (>20% better accuracy) where dynamical models failed despite equivalent resources, it would suggest computation is more than just description."  

  ---  
  **End of Draft**  
  *(To be reviewed & revised by Marcus and Ines prior to submission to the Chair)*
