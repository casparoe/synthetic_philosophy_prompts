answer: |-
  Here is a specification for a national wellbeing statistic designed for governance, grounded in concrete dilemmas and the inherent tensions of the task. This is the list Deputy Director Anya Rostova would have pinned to the committee room wall.

  **Desiderata for a Governance-Ready National Wellbeing Statistic: The "Rostova Test"**

  **I. Measurement Imperatives: Whose Life? What Counts? How Do We Know?**

  1.  **Inclusion of the Voiceless:** *Requirement:* Must account for the wellbeing of individuals unable to self-report (infants, severe dementia, profound intellectual disability, coma). *Case:* Excluding newborns ignores the future foundation; excluding dementia patients in long-term care allows their suffering (or contentment) to vanish from national accounting. A policy improving infant nutrition or dementia care *must* move the needle.
  2.  **Temporal Scope:** *Requirement:* Must balance recent experience (affect) and retrospective evaluation (life judgment), explicitly acknowledging the trade-off. *Case:* A citizen undergoing painful but life-saving treatment has terrible *current affect* but high *life evaluation* due to hope. Governing purely by affect discourages necessary hardship; governing purely by life evaluation ignores present misery. An index ignoring affect might fund only palliative care, ignoring prevention; one ignoring evaluation might cancel vital infrastructure projects due to construction misery.
  3.  **Interpersonal Comparability (The Cardinality Trap):** *Requirement:* Must explicitly state whether it assumes interpersonal cardinal comparability (that my "8" = your "8") and the consequences if it does not. *Case:* If comparability is assumed falsely, policies favoring easily-pleased groups over harder-to-please groups appear beneficial when they are not (e.g., investing in rural areas reporting higher scores vs. frustrated urbanites). If comparability is rejected, aggregation becomes impossible or arbitrary (does reducing one person's misery from 10 to 5 outweigh increasing another's joy from 5 to 10?).
  4.  **Adaptation Discounting:** *Requirement:* Must attempt to distinguish between genuinely high wellbeing and "resigned satisfaction" born of lowered expectations after prolonged hardship. *Case:* A population decimated by war or economic collapse reports "moderate satisfaction" after years because "it could be worse." A naive index rewards stagnation. Conversely, a population rapidly lifted from poverty reports explosive gains partly due to novelty. The index must capture genuine improvement, not just shifting baselines.
  5.  **Forecasting Error Adjustment:** *Requirement:* Must account for systematic errors in people's predictions about their own future feelings (affective forecasting). *Case:* A policy based on "people think this will make them happy" (e.g., a massive sports stadium) might proceed despite evidence it won't (long-term studies on lottery winners, major purchases). Governing requires distinguishing *anticipated* satisfaction from *actual* wellbeing impact.
  6.  **Non-Compensability of Suffering:** *Requirement:* Must not allow intense suffering to be fully "cancelled out" by vast amounts of mild pleasure elsewhere. *Case:* A policy creating horrific conditions for a small group (e.g., brutal prison labor) cannot be justified by slightly cheaper goods for millions. The index must reflect that some pains are lexically prior to gains.
  7.  **Cross-Cultural & Linguistic Robustness:** *Requirement:* Must demonstrate minimal conceptual distortion across major linguistic and cultural groups within the nation. *Case:* Translating "happiness" or "satisfaction" directly might evoke concepts of luck (English etymology), social harmony (East Asian concepts), or spiritual fulfillment (various traditions). A policy promoting individual achievement might boost scores in individualist cultures but depress them in collectivist ones due to lost "harmony," not actual wellbeing loss. The concept measured must be stable.

  **II. Aggregation Imperatives: What Does "National" Wellbeing Mean?**

  8.  **Sensitivity to Distribution (Beyond the Mean):** *Requirement:* Must be sensitive to changes *where* they happen in the distribution, not just the average. It must be capable of showing improvement if the worst-off get significantly better, even if the mean barely moves, and vice-versa. *Case:* A targeted mental health program lifting the chronically depressed from misery to coping might show little mean gain but be a profound moral and practical achievement. Conversely, massive gains for the already well-off shouldn't mask stagnation at the bottom. The index must *force* attention to the tails.
  9.  **Sufficiency Threshold Recognition:** *Requirement:* Must explicitly incorporate or be compatible with a defined "sufficiency" threshold below which wellbeing is critically unacceptable. *Case:* A small rise in the mean could hide more people falling below a critical threshold of basic security (food, shelter, safety). Governing requires knowing if anyone is in freefall, even if the average is stable. The index shouldn't allow "musical chairs" misery.

  **III. Political Usability Imperatives: Governing with the Number**

  10. **Citizen & Parliamentary Legibility:** *Requirement:* Must be understandable enough for citizens to grasp what "improvement" means and for Parliament to debate policy implications without advanced statistics degrees. *Case:* If citizens can't understand why the number rose or fell (e.g., "the hedonic recalibration sub-index offset gains in affective balance"), they lose faith. If Parliament can't debate the trade-offs implied by a policy's predicted impact, the target becomes meaningless theatre.
  11. **Resistance to Gaming & Distortion:** *Requirement:* Must be structurally resistant to manipulation by government agencies, local authorities, or survey respondents seeking to influence the result. *Case:* If hospital waiting times are a proxy, managers stop recording delays; if self-reports are key, propaganda campaigns urge people to "report positively for the nation"; if GDP-linked, creative accounting flourishes. The target *will* distort behavior; the index must minimize perverse incentives.
  12. **Policy Horizon Stability:** *Requirement:* Must be stable enough not to fluctuate wildly due to short-term noise, allowing multi-year policies to be credibly evaluated. *Case:* A 10-year education reform shouldn't be abandoned because year 1 saw a dip due to a mild recession or a bad flu season. The index must reflect underlying trends, not ephemera.
  13. **Target-Induced Distortion Mitigation (The Goodhart Problem):** *Requirement:* Must minimize the risk that making it the *primary* target damages the underlying wellbeing it aims to measure. *Case:* Teachers "teaching to the test" (narrow focus on index components) or hospitals neglecting uncounted aspects of care to hit targets. *Implementation Choice:* This argues strongly *against* a single, opaque composite (too easy to game blindly) and *for* either (a) a small dashboard of complementary, legible metrics (no single target) OR (b) abandoning the single-number statutory target concept entirely, using the index for reporting/informing only.

  ---

  **Analysis & Scoring**

  **A. Genuine Desiderata vs. Ideological Preferences:**
  *   **Genuine Desiderata (Must-Haves):** 1 (Inclusion), 4 (Adaptation Discounting - at least recognition), 6 (Non-Compensability), 8 (Distribution Sensitivity), 9 (Sufficiency Threshold), 11 (Gaming Resistance), 12 (Stability), 13 (Distortion Mitigation - dictates structure/target use).
  *   **Ideological Preferences (Contested Camps):**
      *   *Camp Cardinality:* Requirement 3 (Interpersonal Comparability). Hedonic purists demand it; capability theorists often reject it.
      *   *Camp Subjectivity:* Requirement 2 (Temporal Scope) & 5 (Forecasting Error). Affect-focused camps prioritize real-time experience; life evaluation/eudaimonic camps prioritize judgment/meaning. Requirement 5 is particularly contested by preference-satisfaction economists.
      *   *Camp Objectivity:* Requirement 7 (Cross-Cultural Robustness) leans towards capability/objective lists. Pure subjectivists argue that self-report *is* the reality, regardless of translation nuances.
      *   *Camp Reductionism:* The *demand for a single cardinal quantity itself* is a major ideological preference (often economic/policy efficiency driven) opposed by many wellbeing scientists and philosophers who favor dashboards.

  **B. Irreconcilable Tensions:**
  1.  **Legibility vs. Gaming Resistance & Distortion Mitigation (10 vs. 11 & 13):** Simple, legible indices (like average life satisfaction) are highly gameable. Complex, robust indices (multi-dimensional, incorporating objective data, adaptation adjustments) become illegible. You cannot perfectly satisfy both.
  2.  **Citizen Legibility vs. Distribution Sensitivity (10 vs. 8):** A single number inherently obscures distribution. A distribution-sensitive index (e.g., incorporating the median, lower quartile, or sufficiency rate) is harder for the public to grasp than a simple average.
  3.  **Single Cardinal Quantity vs. Non-Compensability & Distribution Sensitivity (The Core Tension):** A single number *requires* aggregation and thus *implies* compensability. It struggles to inherently reflect that lifting the worst-off matters more than improving the comfortable, or that intense suffering shouldn't be traded away.

  **C. The Great Excluder:**
  **Requirement 4 (Adaptation Discounting)** is likely the most devastating. Accurately *measuring* when satisfaction reflects genuine flourishing versus lowered expectations/resignation is profoundly difficult. Most established indices simply accept self-reports at face value. Any attempt to discount for adaptation requires highly contestable assumptions and complex modeling, undermining legibility and increasing gaming risks. This requirement alone casts doubt on the validity of self-report-based indices for governance under conditions of long-term stress or decline.

  **D. Scoring Candidate Families (Briefly):**

  1.  **Self-Report Life Satisfaction (e.g., Cantril Ladder, ONS LS):**
      *   *Pros:* Good legibility, measures life evaluation (stability), established methodology.
      *   *Cons:* Fails Adaptation Discounting (4) catastrophically, highly susceptible to Gaming (11) and Goodhart distortion (13), assumes Cardinality (3), poor on Non-Compensability (6), Distribution Sensitivity (8) requires secondary metrics, weak on Inclusion (1). *Verdict:* Flunks core governance needs despite ease.

  2.  **Experience-Sampling / Affect Measures (e.g., DRM, real-time apps):**
      *   *Pros:* Captures real-time affect, good for Temporal Scope (2) (affect side), potentially better at spotting intense suffering (Non-Compensability - 6).
      *   *Cons:* Impractical for national scale (cost, burden), misses Life Evaluation (Temporal Scope - 2), very noisy (hurts Stability - 12), still susceptible to Gaming (11) and Adaptation (4) in reporting, poor Inclusion (1), Legibility (10) challenging ("net affect"?), Distribution Sensitivity (8) hard. *Verdict:* Authentic snapshot, governance nightmare.

  3.  **Objective-List / Capability Proxies (e.g., adjusted HDI, Multidimensional Poverty Index):**
      *   *Pros:* Strong on Gaming Resistance (11) (if objectively measured), Inclusion (1) (can include infant mortality, etc.), Distribution Sensitivity (8) & Sufficiency Thresholds (9) are core strengths, better Cross-Cultural Robustness (7), mitigates Adaptation (4) by focusing on objective conditions, inherently addresses Non-Compensability (6) for basic deprivations.
      *   *Cons:* Weakest on direct Subjective Experience (Temporal Scope - 2 & 5, Cardinality - 3), Legibility (10) can be low if complex ("what's capability score?"), defining the "objective" list is highly political/ideological, misses nuances of mental health/positive experience not captured by proxies. *Verdict:* Most robust *structurally* for governance but risks missing the subjective point of wellbeing.

  **The Committee's Honest Conclusion & Recommendation:**

  After months of heated debate, the committee concludes that **no single, cardinal national wellbeing statistic can simultaneously meet the non-negotiable requirements for honest governance.** The tensions are fundamental:
  *   Legibility demands simplicity; gaming resistance and adaptation discounting demand complexity.
  *   Capturing true wellbeing requires subjective experience; governing effectively requires objective anchors resistant to manipulation and adaptation.
  *   A single number inherently masks distribution and implies compensability.

  **Recommendation: Abandon the Single Statutory Target Mandate.** Instead, propose:

  1.  **A National Wellbeing Dashboard:** Mandate the ONO to publish an annual report featuring a small set (5-7) of complementary metrics, including:
      *   **A Core Subjective Metric:** Likely Life Satisfaction (acknowledging its flaws) *alongside* its distribution (e.g., % below a sufficiency threshold, median).
      *   **Key Affective Indicators:** E.g., prevalence of anxiety/depression (negative affect proxy).
      *   **Critical Capability/Objective Metrics:** Tailored to the republic (e.g., healthy life expectancy, material deprivation rate, youth NEET rate, perceived corruption index).
      *   **An "Inclusion & Suffering" Metric:** Focusing explicitly on the worst-off (e.g., wellbeing index for institutionalized populations, severe poverty rate).
  2.  **Qualitative Narrative:** A mandatory, substantial narrative section interpreting the dashboard, highlighting tensions, distributional shifts, and adaptation concerns.
  3.  **Policy Impact Assessment Requirement:** All major legislation and budgets must include an assessment of predicted impact *across the dashboard metrics*.

  **Why this is the Honest Ending:**

  1.  **Integrity:** It acknowledges the complexity of wellbeing and the impossibility of reductionism for governance without sacrificing accountability.
  2.  **Mitigates Key Risks:** Avoids Goodhart distortion by removing *the* target, reduces gaming by using diverse metrics, addresses distribution and sufficiency directly.
  3.  **Maintains Focus:** Forces government to consider multiple facets and trade-offs explicitly. The "dashboard plus narrative" structure satisfies Requirement 13 (Distortion Mitigation) and partially satisfies 8, 9, and 10.
  4.  **Political Realism (of a sort):** While abandoning the political allure of a single score, it provides concrete metrics for Parliament and the public to hold government accountable across multiple dimensions. It transforms the mandate from "make the number go up" to "explain and justify outcomes across these vital areas."
  5.  **Follows from Specification:** This conclusion flows directly from the irreconcilable tensions identified, particularly the impossibility of satisfying legibility, gaming resistance, adaptation discounting, distribution sensitivity, and non-compensability simultaneously within a single cardinal index. It accepts that governing wellbeing requires nuance, transparency, and multiple perspectives, not algorithmic simplicity.

  Anya Rostova presents this not as a failure, but as a harder-won victory for honest governance. The novel ends not with a triumphant number, but with the first, complex, contested draft of the Wellbeing Dashboard Framework landing on the Prime Minister's desk. The real argument is just beginning.
