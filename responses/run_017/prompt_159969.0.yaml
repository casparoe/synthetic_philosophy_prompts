  We are designing a protocol that operationalizes five theoretical points into a step-by-step checklist for field linguists. The goal is to produce reliable glosses for an endangered language under constrained conditions. The protocol must be runnable by non-specialists in about 20 minutes per cluster of utterances, offline, on paper.

  Translation of theoretical points:
  1. Charity: We implement this via a global error budget per speaker. Starting budget: 10 points per speaker (adjustable). Each non-charitable attribution (attributing a false belief) costs 1 point and requires naming a specific error mechanism. Exhaustion triggers review of background assumptions. This is kept intact.
  2. Humanity vs. Charity: We prioritize Charity for truth-conditional content and Humanity for attitudes. When they pull apart, we note the divergence in the gloss (tag) and let the downstream use decide. This is distorted: we simplify by having the runner note when a gloss feels "unnatural" but stick with Charity for the core gloss. Cost: we may miss some cultural specificity.
  3. Triangulation: We require two perceptual conditions for reference fixing. If failed, the term is tagged as "unverified reference" and the gloss is provisional. This is kept but with a practical limit: we can't always get two conditions, so we allow "narrative consistency" as a fallback for historical terms. Cost: some references remain uncertain.
  4. Holism: We use a neighborhood test: substitute the proposed gloss into 3 attested sentences (minimum). Failure if it creates a contradiction or absurdity in any. Kept intact.
  5. Prior vs. Passing theory: We distinguish "core" glosses (go into manual) from "session" glosses (nonce uses). Core requires occurrence in 3+ sessions or contexts. Session glosses expire after 6 months unless reattested. Decision by senior linguist. Kept.

  The protocol is structured in ordered steps. We mark judgment flags where intuition is used.

