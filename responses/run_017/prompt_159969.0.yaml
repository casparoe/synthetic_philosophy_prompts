  ### Limits  
  The protocol cannot handle:  
  - Systemic worldview gaps (e.g., PK's causal claim), where it defaults to "false belief" tagging, distorting cultural coherence.  
  - Irony/humor without clear markers, often mis-tagging nonce uses as core.  
  - Historical/mythical references (e.g., MT's rock), always failing triangulation and weakening land claims.  
  - Holism fails for isolated terms, forcing over-reliance on neighborhood tests that assume prior data.  
  It becomes intuition-based at: step 2 (humanity), step 4 (absurdity), step 6 (nonce detection). Values-based decisions (e.g., community veto) are handed to named roles but not resolved procedurally. Stops at "no" for irreconcilable divergences (step 4 fail).
