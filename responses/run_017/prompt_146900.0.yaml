prompt: |-
  I'm a second-year PhD student in philosophy, and this term I'm taking a seminar on infinity, probability, and rational choice. I also host my department's graduate-student podcast, and in two weeks I'm recording a forty-minute interview with Dr. Renata Halvorsen, a decision theorist whose forthcoming paper "Pasadena Is a Process, Not a Sum" defends what she calls procedural expectation: the expectation of a gamble is not a property of its payoff distribution alone, but of the sum of payoff-times-probability taken in the order supplied by the physical procedure that generates the outcome. As she sets the case up, the Pasadena game pays as follows: a fair coin is tossed until it lands heads; if the first heads occurs on toss n you receive (−1)^{n+1}·2^n/n dollars. Since the probability of first-heads-on-n is 1/2^n, the expectation series is 1 − 1/2 + 1/3 − 1/4 + ..., the alternating harmonic series, which converges but only conditionally; by the Riemann rearrangement theorem its terms can be re-ordered so as to sum to any real number you like, or to diverge. Her claim is that the correct value is ln 2, and that it is ln 2 because the tosses arrive in a temporal order, not because ln 2 is the privileged sum of an un-ordered family of terms.

  Please draft eight to ten questions, each with a follow-up keyed to the reply she is most likely to give, that press on the details of that position rather than letting her restate it. No opening biographical questions and no "who else has written about this" questions — she has asked not to do a literature survey on air. The ground I want covered:

  1. The same payoff distribution implemented without any temporal order — say, a device that samples n from the geometric distribution in a single readout and pays off from a lookup table, so that no outcome comes "before" any other. Does the game still have a value? Her likely move is that the gamble is a process, not a distribution; the follow-up should push on whether two gambles that agree on the probabilities of every payoff, and differ only in how the chance is realized, can really differ in value when the difference shows up nowhere in what the agent receives.
  2. Relatedly: if the unordered implementation has no determinate value, is that a discovery about the gamble or an artifact of the way we sum, and why is it not simply skepticism about infinite state spaces?
  3. Her probable appeal to finite approximations: the game capped at N tosses (equivalently, thegame restricted to its N most probable outcomes) has a determinate expectation that differs from ln 2 by less than 1/(N+1). Press on why truncation by toss-number, or by decreasing probability, is the canonical way to approximate, given that other truncation schemes pick out different finite subsets and yield different limits or none.
  4. An audience member who has read a little nonstandard analysis is likely to suggest that the expectation be taken as a hyperfinite partial sum up to an infinite index: since the ordinary partial sums converge to ln 2, every such hyperfinite sum should be infinitesimally close to ln 2, giving ln 2 plus an infinitesimal. Ask whether this vindicates her or merely encodes the ordering she already assumed — a re-ordered enumeration would give 100 plus an infinitesimal — and whether the infinitesimal tail ever does any real decision-theoretic work if comparisons go by standard parts.
  5. Additivity. The sign-flipped twin of the Pasadena game pays the exact negative in every state, so holding both tickets pays zero for sure, even though each is worth ±ln 2 on her account. She will probably restrict additivity to cases where both expectations converge absolutely; the follow-up should ask what replaces additivity when an agent is choosing bundles or adding a ticket to a portfolio, and whether a package can be worse than one of its parts.
  6. Exploitability. One can construct, for any real c, a game on the same chance setup whose procedural expectation is exactly c, by fixing a conditionally convergent series summing to c and setting the payoff on outcome n to 2^n times its n-th term. An agent who maximizes procedural expectation will pay a cent to trade up from the c-game to the (c+1)-game, for every c. Ask whether her view licenses an endless sequence of such trades, whether the sequence can be arranged so that the agent does worse in every state, and — if she rules out infinite sequences of decisions — whether that ruling also undercuts her own use of limits over finite truncations.
  7. Second-order regress. If the agent is unsure which implementation she is facing, she must in effect take an expectation over procedures; but if the class of admissible procedures is rich enough, that higher-order sum is again only conditionally convergent, or unbounded. Ask what fixes the procedure — the physics, the agent's concepts, the phrasing of the offer — and whether the view has relocated the problem rather than solved it.
  8. Contrast with the St. Petersburg game, where the difficulty is infinite rather than order-sensitive expectation; ask whether her apparatus gives any unified diagnosis or whether these are simply two independent problems that both arise in infinite state spaces.

  Her stock deflection throughout is some version of "you are describing the gamble as a sum; I am describing it as a procedure." Please order the questions so that this move becomes progressively harder to fall back on, and close with one question about what evidence could count against the view. For each question, add a line or two in brackets saying why it is a genuine problem for her and not just a request for clarification.
reasoning: |-
  Okay, the user is a second-year PhD student in philosophy preparing for a podcast interview with decision theorist Dr. Renata Halvorsen. They need focused questions that challenge her "procedural expectation" theory about the Pasadena game, specifically avoiding surface-level clarifications and preventing her from retreating to her standard "procedure vs sum" deflection. 

  Hmm, the core tension is fascinating: Halvorsen claims expectation depends on physical implementation, not just payoff distributions. But if two games have identical payoff probabilities and outcomes, differing only in how chance is realized, can they really have different values? That seems to violate the principle that identical consequences should yield identical valuations. The user wants questions that force her to confront this without letting her restate her position.

  *scratches head* Her finite approximations defense is clever but vulnerable. Why privilege truncation by toss order when other partitions could yield different expectations? If she appeals to "naturalness," we need to press what makes temporal ordering metaphysically privileged over other indexing schemes. 

  *checks notes* The nonstandard analysis angle is slippery. Even if hyperfinite sums give ln2 ± infinitesimal, that just encodes her preferred ordering. A different enumeration could make it 100 ± infinitesimal! The infinitesimal doesn't solve the rearrangement problem—it presupposes an order.

  *winces* The additivity paradox is brutal. Holding both Pasadena and its negative twin pays zero deterministically, yet each supposedly has nonzero expectation. Her absolute convergence restriction feels like moving goalposts. What happens when agents combine non-absolutely convergent gambles in portfolios? Can a bundle be strictly worse than one component?

  *smirks* The exploitability trap is deliciously malicious. Constructing a sequence of c-games lets you pump money from the agent indefinitely. If she blocks infinite decision sequences, doesn't that undermine her own infinite truncation argument? 

  *pauses* The meta-problem of uncertain procedures might be the kill shot. If the agent doesn't know the physical implementation, she has to average over procedures—but that higher-order sum could itself be conditionally convergent! Then we're back to square one.

  *rearranging question order* Should start with implementation-independence (Q1) to establish the core dilemma, then hit finite approximations (Q3) before she can use them as cover, then spring the nonstandard trap (Q4) and additivity (Q5), before unleashing exploitability (Q6) and regress (Q7). St. Petersburg contrast (Q8) can be late-stage palate cleanser. Final question must force falsifiability—what evidence would make her abandon proceduralism? 

  *double-checking* Each question needs embedded barbs: "This isn't about clarification—it's about whether two empirically indistinguishable games can differ in value" (Q1 follow-up), or "Doesn't restricting additivity concede that procedural expectation isn't functioning as value?" (Q5 follow-up). No softballs.
answer: |-
  Here are eight tightly focused questions designed to press Dr. Halvorsen's procedural expectation, ordered to progressively undermine the "procedure vs. sum" deflection. Each includes a predicted reply and a targeted follow-up exposing a tension in her view. Bracketed notes explain the underlying problem.

  ---

  ### **Question 1: Implementation-Independence**  
  **Q:** Suppose I build a "static" Pasadena device: it samples *n* from a geometric distribution in one step (no sequential tosses), then pays (−1)^(n+1)·2ⁿ/ *n* via a lookup table. Since every payoff-probability pair matches the original game identically but lacks temporal order, does this gamble have a determinate expectation?  
  **Likely Reply:** *"No—the expectation is defined by the physical process generating outcomes. Without the temporal sequence, there’s no privileged order for summation, so no unique value."*  
  **Follow-up:** If two gambles assign identical probabilities to identical payoffs—differing only in physically inert implementation details—how can they differ in *value* when the agent’s *experienced outcomes* are indistinguishable? Doesn’t this violate the principle that value supervenes on possible outcomes and their likelihoods?  
  **[Problem: Challenges supervenience of value on payoff distributions. If value isn’t determined by what the agent actually receives/risks, what is it tracking?]**  

  ---

  ### **Question 3: The Privilege of Temporal Truncation**  
  **Q:** You argue finite *N*-toss truncations approximate ln2, differing by <1/(*N*+1). But why truncate by toss number? If I truncate by payoff *magnitude* (e.g., all outcomes with |payoff| > *M*), or by *deviations from ln2*, I get different limits—or divergence. What makes temporal order the canonical truncation?  
  **Likely Reply:** *"The physical process generates outcomes sequentially, so capping tosses is the natural operational approximation."*  
  **Follow-up:** But if the *only* justification is "naturalness," isn’t this circular? The procedure defines the expectation, but the procedure’s "natural" truncation is only privileged *because* it’s the procedure. Doesn’t this render procedural expectation inscrutable under alternative physically possible approximations?  
  **[Problem: Reveals the "approximation" defense assumes the very temporal ordering it seeks to justify, lacking independent grounding.]**  

  ---

  ### **Question 4: Nonstandard Analysis as Mimicry**  
  **Q:** A nonstandard analyst suggests: "Take a hyperfinite sum over outcomes up to infinite *H*; since standard partial sums converge to ln2, this yields ln2 + ε for infinitesimal ε." Does this vindicate procedural expectation?  
  **Likely Reply:** *"It captures the ordered process: fixing the toss sequence, hyperfinite sums align with ln2."*  
  **Follow-up:** But if I *re-index* the same payoffs using a permutation that sums to 100 in standard analysis, the hyperfinite sum gives 100 + ε. Doesn’t nonstandard analysis merely *encode* your preferred order? If comparisons use standard parts (shadows), the infinitesimal ε vanishes—so how does this resolve the rearrangement problem?  
  **[Problem: Nonstandard methods don’t solve ordering-dependence; they formalize it. The "infinitesimal tail" is epistemically inert.]**  

  ---

  ### **Question 2: Skepticism vs. Ontology**  
  **Q:** If the unordered game lacks a determinate value, is this an ontological fact ("no expectation exists") or an epistemic limitation ("we lack a summation method")? Why isn’t this just skepticism about infinite spaces?  
  **Likely Reply:** *"It’s ontological: the expectation is a property of the process, not the distribution. No process, no expectation."*  
  **Follow-up:** But the probability *distribution* over payoffs is well-defined and identical in both cases. If we accept that infinite fair lotteries can have expectations (e.g., St. Petersburg), why can’t we say the unordered Pasadena game *has* an expectation—it’s just not unique? Isn’t denying any value more radical than acknowledging underdetermination?  
  **[Problem: Positions her view as inventing new ontology rather than addressing underdetermination in standard terms.]**  

  ---

  ### **Question 5: Additivity and Self-Cancellation**  
  **Q:** Consider holding both the Pasadena ticket and its sign-flipped twin (paying −Pasadena payoff in all states). The bundle pays 0 everywhere, so its value is 0. But each ticket has procedural expectation ±ln2. Do we need to restrict additivity?  
  **Likely Reply:** *"Additivity only applies when expectations are absolutely convergent. Here, the conditional convergence violates the premises."*  
  **Follow-up:** But when an agent *actually holds both tickets*, they have a guaranteed $0. If procedural expectation can’t explain why the bundle is worth 0 (since ±ln2 ≠ 0), doesn’t it fail as a decision value? What replaces additivity for *actual* portfolio choices?  
  **[Problem: Shows procedural expectation is not "money-pump-proof" and can’t guide real portfolio decisions.]**  

  ---

  ### **Question 6: Exploitability via c-Games**  
  **Q:** For any real *c*, I can design a "c-game" on the same coin-toss process: payoff on outcome *n* is 2ⁿ · *aₙ*, where Σ*aₙ* = *c* (conditionally convergent). An agent maximizing procedural expectation pays $0.01 to trade *c*-game for (*c*+1)-game, for every *c*. Doesn’t this license an infinite money pump?  
  **Likely Reply:** *"Infinite decision sequences aren’t feasible. We evaluate gambles singly, not in constructed chains."*  
  **Follow-up:** But your *defense* of Pasadena uses limits of finite truncations—an infinite conceptual sequence. If you forbid infinite *decisions*, why permit infinite *approximations*? Doesn’t this inconsistency protect your view by ad hoc restrictions?  
  **[Problem: Reveals a double standard—infinite processes are valid for defining expectations but invalid for testing them.]**  

  ---

  ### **Question 7: Second-Order Regress**  
  **Q:** If an agent faces uncertainty about the *physical implementation* (e.g., "Is this a sequential device or a lookup table?"), she must take an expectation over procedures. But if the class of possible procedures allows rearrangements summing to arbitrary values, won’t this higher-order expectation also be indeterminate?  
  **Likely Reply:** *"The actual physics fixes the procedure. Agents should use known mechanisms."*  
  **Follow-up:** But the agent’s uncertainty is about the mechanism itself. If she assigns equal credence to two procedures generating the same payoffs but different orders (e.g., toss-order vs. reverse-order), must she compute an expectation over conditionally convergent series? Isn’t the problem just relocated?  
  **[Problem: Procedural uncertainty recreates the same order-dependence at a meta-level, suggesting no resolution.]**  

  ---

  ### **Question 8: Contrast with St. Petersburg**  
  **Q:** The St. Petersburg game has infinite expectation due to unbounded payoffs, while Pasadena’s issue is order-dependence. Does your framework offer a unified diagnosis, or are these two distinct pathologies of infinite spaces?  
  **Likely Reply:** *"They’re distinct: St. Petersburg’s problem is divergence; Pasadena’s is non-absolutely convergent dependence on process."*  
  **Follow-up:** But both arise from infinite state spaces violating finite additivity or boundedness. If procedural expectation *solves* Pasadena while St. Petersburg remains pathological, does this suggest your account is a local patch rather than a general theory?  
  **[Problem: Highlights fragmentation—her solution doesn’t unify or extend to other infinities.]**  

  ---

  ### **Closing: Falsifiability**  
  **Q:** What empirical or conceptual evidence could falsify procedural expectation? For example, if we found agents consistently indifferent between ordered/unordered implementations (when payoffs match), would that undermine your view?  
  **[Problem: Tests whether the view is empirically vacuous or tied to observable choice behavior.]**  

  ---  
  **Order Rationale:** Starts with core tension (Q1), blocks retreat to approximations (Q3), pre-empts technical escapes (Q4), then forces contradictions in additivity (Q5) and exploitability (Q6). Q2 and Q7 undermine ontological and epistemic foundations, Q8 tests generality. The closer demands falsifiability, preventing the "procedure vs. sum" move from serving as an unfalsifiable mantra.
