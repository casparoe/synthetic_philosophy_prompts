answer: |-
  ### Decision Tree: The Logical Space of Death Determination

  **Entry Point (Node 0):**  
  A ventilated patient with total loss of clinical brain function (including brainstem reflexes and respiratory effort), on adequate testing, is dead.  
  *Rationale:* This reflects near-universal clinical acceptance of neurological criteria as sufficient for death.

  ---

  **Node 1:**  
  In a controlled donation after circulatory death (DCD), ventilation is withdrawn, asystole occurs, and after a 5-minute "hands-off" interval (where CPR *could* restart circulation but is not given), death is declared. Is the patient **dead at the moment of declaration**?  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  
  *Rationale:* Tests whether death requires *irreversible* loss (cannot be reversed) or merely *permanent* loss (will not be reversed due to context). Uses DCD case (#5).  
  *Case impact:* #5 (DCD) discriminates here. If "no," DCD protocols violate the dead donor rule.

  ---

  **Node 2 (from Node 1 "Yes"):**  
  A patient on veno-arterial ECMO has no cardiac output, no pulse, and no spontaneous respiration, but ECMO maintains cerebral blood flow and EEG-confirmed brain activity. Is this patient **dead**?  
  - **Yes** → Leaf: **Circulatory-Respiratory (Permanent)**.  
  - **No** → Proceed to Node 4.  
  *Rationale:* Tests if machine-sustained circulation "counts" as the organism's own function. Uses ECMO case (#6).  
  *Case impact:* #6 (ECMO) discriminates here. If "yes," you prioritise absence of *spontaneous* circulation over preserved brain function.

  **Leaf: Circulatory-Respiratory (Permanent)**  
  *Descriptive name:* Circulatory-Respiratory with Permanent Cessation.  
  *Awkward commitment:* You must hold that a patient with ECMO-sustained brain activity is dead because spontaneous pulse is absent, even if consciousness were present.  

  ---

  **Node 3 (from Node 1 "No"):**  
  After asystole, extracorporeal perfusion and cooling begin within minutes, preserving brain structure but with no electrical activity. Is this patient **dead at the start of perfusion**?  
  - **Yes** → Leaf: **Circulatory-Respiratory (Irreversible)**.  
  - **No** → Leaf: **Death as Process**.  
  *Rationale:* Tests if death requires *irreversible* loss (unresuscitable even with future tech) or if revival tools negate death. Uses perfusion case (#7).  
  *Case impact:* #7 (extracorporeal perfusion) discriminates here. If "no," death is not an event but a gradual process.

  **Leaf: Circulatory-Respiratory (Irreversible)**  
  *Descriptive name:* Circulatory-Respiratory with Irreversible Cessation.  
  *Awkward commitment:* You must hold that a patient cooled/perfused minutes after cardiac arrest is dead, even if their brain is structurally intact and could be revived.  

  **Leaf: Death as Process**  
  *Descriptive name:* Gradualism.  
  *Awkward commitment:* You must hold that death has no determinate moment—it is a process completed only when irreversible loss *and* decomposition occur.  

  ---

  **Node 4 (from Node 2 "No"):**  
  A patient meets clinical brain-death criteria (no brainstem reflexes, apnoea) but has preserved neuroendocrine function (e.g., normal sodium balance, no diabetes insipidus). Is this patient **dead**?  
  - **Yes** → Proceed to Node 5.  
  - **No** → Leaf: **Whole-Brain Strict**.  
  *Rationale:* Tests if loss of *all* brain functions (including neuroendocrine) is needed, or if clinical tests suffice. Uses neuroendocrine case (#1).  
  *Case impact:* #1 (neuroendocrine preservation) discriminates here. If "no," standard brain-death testing is inadequate.

  **Leaf: Whole-Brain Strict**  
  *Descriptive name:* Whole-Brain Criterion (Loss of All Functions).  
  *Awkward commitment:* You must hold that a brain-dead patient with intact hypothalamic function is not dead, contradicting legal standards in most jurisdictions.  

  ---

  **Node 5 (from Node 4 "Yes"):**  
  A brain-dead pregnant patient is maintained for weeks to deliver a viable foetus. During this period, is the patient **dead**?  
  - **Yes** → Proceed to Node 6.  
  - **No** → Leaf: **Organismal Integration**.  
  *Rationale:* Tests if somatic integration (e.g., gestating a foetus) signifies life, regardless of brain function. Uses pregnancy case (#2).  
  *Case impact:* #2 (brain-dead pregnancy) discriminates here. If "no," brain death alone is insufficient for death.

  **Leaf: Organismal Integration**  
  *Descriptive name:* Organism-as-Integrated-Whole View.  
  *Awkward commitment:* You must hold that a brain-dead patient is alive if their body performs complex biological functions (e.g., wound healing), even without consciousness.  

  ---

  **Node 6 (from Node 5 "Yes"):**  
  A patient with an anoxic injury has no cortical activity, breathes spontaneously, and has sleep-wake cycles, but is permanently unconscious. Is this patient **dead**?  
  - **Yes** → Proceed to Node 7.  
  - **No** → Leaf: **Brainstem Criterion**.  
  *Rationale:* Tests if loss of consciousness alone is sufficient for death, or if brainstem function (e.g., spontaneous breathing) indicates life. Uses anoxic injury case (#3).  
  *Case impact:* #3 (vegetative state) discriminates here. If "no," consciousness is irrelevant to death.

  **Leaf: Brainstem Criterion**  
  *Descriptive name:* Brainstem Criterion.  
  *Awkward commitment:* You must hold that a spontaneously breathing, permanently unconscious patient is alive, but a brain-dead patient with no breathing (on a ventilator) is dead.  

  ---

  **Node 7 (from Node 6 "Yes"):**  
  An infant born with hydranencephaly (no cerebral hemispheres) breathes spontaneously, reacts to stimuli, and has sleep-wake cycles. Is this infant **dead**?  
  - **Yes** → Leaf: **Higher-Brain**.  
  - **No** → Leaf: **Conventionalism**.  
  *Rationale:* Tests if absence of consciousness *capacity* (due to missing cortex) is sufficient for death. Uses hydranencephaly case (#4).  
  *Case impact:* #4 (hydranencephaly) discriminates here. If "no," brain-based criteria are pragmatic, not biological.

  **Leaf: Higher-Brain**  
  *Descriptive name:* Higher-Brain Criterion.  
  *Awkward commitment:* You must hold that a breathing, reactive infant is dead because it lacks the neural substrate for consciousness.  

  **Leaf: Conventionalism**  
  *Descriptive name:** Neurological Criterion as Legal Convention.  
  *Awkward commitment:* You must hold that brain death is a useful fiction for organ procurement, not a biological truth about human death.  

  ---

  ### Unoccupied Combinations & Incoherences
  - **Whole-Brain Strict + Permanent Circulatory:** Incoherent. If death requires loss of *all* brain functions, DCD (where the brain may not be fully destroyed) cannot declare death at 5 minutes.
  - **Gradualism + Organ Procurement:** Incoherent. If death is a process, the "dead donor rule" (requiring death before organ removal) is unworkable.
  - **Conventionalism + Brainstem Criterion:** Unoccupied. Conventionalism treats brain death as a convention, while the brainstem criterion treats it as biological fact. Merging them is inconsistent.

  ### Practical Purposes Shifting Outcomes
  | **Purpose**               | **Nodes Where Outcome Shifts**                       | **Example**                                                                 |
  |---------------------------|------------------------------------------------------|-----------------------------------------------------------------------------|
  | Organ procurement         | Node 1 (Permanent vs. Irreversible)                  | DCD (#5): Dead for procurement if permanent; alive if irreversible.         |
  | Treatment withdrawal      | Node 6 (Brainstem vs. Higher-Brain)                  | Vegetative patient (#3): Alive for treatment (brainstem); dead (higher-brain). |
  | Legal death (inheritance) | Node 5 (Organismal Integration)                      | Brain-dead pregnant patient (#2): Alive for inheritance if integrated.      |
  | Death certificate         | Node 4 (Whole-Brain Strict)                          | Brain-dead patient (#1): Alive if neuroendocrine function persists.         |

  ### Redundant Cases
  - **Isolated brain perfusion (#8)** and **ECMO (#6)** both test machine-sustained function. #8 is redundant with #6 if ECMO already confirms your view.
  - **Spinal cord injury (#9, control)** confirms consensus: all paths agree such a patient is alive, so it lacks discriminatory power.
