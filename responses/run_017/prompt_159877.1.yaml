prompt: |-
  Six weeks ago my co-founder and I shut down the company we had spent four years and most of our savings on, and the post-mortem has turned into a somewhat unwanted education in escalation of commitment. As penance, the incubator that housed us has asked us to run a forty-five minute session for about fifteen first-time founders on why intelligent people keep paying into failing projects. So the topic is not academic for me right now — but I want the session to be conceptual rather than confessional, and I'd rather you did not coach me about my own case. Treat me as an instructor preparing a session.

  You are a philosopher of action and decision theorist who has also taught judgment and decision making to managers, and who has thought hard about where the rational-choice story and the psychological story come apart. Please think carefully and brainstorm before you commit: I would like, first, two or three candidate orderings for the session with the one thing each of them loses, and only then the ordering you recommend and why.

  The plan I want has these parts.

  One: the dependency structure. What has to be in place before what? In particular, I want the bookkeeping point (money already spent is gone and cannot be recovered) kept visibly distinct from the forward-looking point (whether the remaining cost is worth paying for the remaining chance), and I want to know which of the two has to be secured first and whether securing the first makes the second harder to teach. I also want escalation separated from neighbouring things it gets confused with: plain risk-seeking in the domain of losses, the option value of genuinely continuing, consistency as a virtue, and the sunk-cost slogan itself.

  Two: the carrying example. I was going to use the dollar auction — a dollar sold to the highest bidder on the rule that the runner-up also pays what they bid — but I have two worries. First, it is a two-player game with a fixed prize and a locally rational next step, whereas the phenomenon I am trying to get at is single-agent: the person you are bidding against is, in some sense, your own earlier self. I want you to say whether that mismatch is fatal or whether it can be turned into the thing that makes the example work, and how. Second, I have been toying with two modifications and would like you to pick between them or reject both. In the bridge-round variant, at any point a bidder may bring in a backer who covers half of the next increment in exchange for half of the eventual prize. In the growing-pot variant, each bid adds to the prize rather than merely chasing it. Tell me what the carrying example must have and must lack if it is to do the work here — I suspect it must have a step that is locally rational, so nobody dismisses the escalator as a fool, and it must lack any pre-declared budget or fixed number of rounds, so the audience cannot lean on a rule instead of seeing the trap. Correct me if that is wrong.

  Three: the misconception map, in the order these founders will actually form them, and where in the sequence each should be headed off. My candidate list, which you should cut down, re-order and add to: that the moral is simply ignore sunk costs, which they will over-apply and use to abandon projects whose remaining costs really are worth paying — the mirror-image error, and the one I most want prevented; that escalation is irrational by definition, which sits badly with each step of the auction being defensible; that perseverance is constitutive of being a founder, so that any anti-escalation message will be heard as an attack on their identity and defended against rather than examined; and that the fix is a pre-committed stop-loss, when the difficulty is that the threshold you would need to write down depends on information you only get later. There is also a notion I have started calling the completion gradient: the pull to continue seems to grow with the proportion of the project already finished, even while the absolute remaining cost is growing too. Tell me where that sits — a separate mechanism, a redescription of sunk cost, or a confusion of fraction-completed with probability of success — and whether it should be named out loud at this level or left implicit.

  Four: the check. Give me one question to end on whose answer distinguishes someone who has the structure from someone who has absorbed a slogan, and tell me what a confidently wrong answer to it will sound like.

  Five: what I should openly refuse to explain in forty-five minutes to this audience, and say so from the podium. I have in mind the formal apparatus of backward induction and subgame perfection, the shape of a prospect-theoretic value function, the self-justification and self-presentation literature, and above all any general rule for knowing when to quit — but tell me if I am cutting in the wrong place.
reasoning: |-
  Hmm, this is a rich and complex request from someone who's clearly deeply familiar with the subject matter. The user is an entrepreneur preparing a session on escalation of commitment after shutting down their own company, and they want a rigorous conceptual framework rather than personal coaching. 

  First, I need to acknowledge the emotional weight behind this request - they're processing their own sunk costs while trying to help others avoid the same trap. The intellectual framing ("treat me as an instructor") is clearly a protective mechanism, and I should respect that boundary strictly.

  The core challenge is structural: how to sequence these interconnected concepts in 45 minutes for first-time founders who likely have strong emotional investments in perseverance. Key tensions I see:
  - The sunk cost fallacy (backward-looking) vs marginal cost analysis (forward-looking) distinction is fundamental but risks being oversimplified
  - Founders' identity investment makes this emotionally charged - they'll hear "don't escalate" as "don't persevere"
  - The dollar auction example is clever but has game theory complications that may distract from the psychological mechanism

  For session orderings:
  Option A (Conceptual build) would start with economic rationality then show psychological deviations. Risk: founders might dismiss as "academic" before seeing relevance.
  Option B (Inverse narrative) begins with the painful outcome to create cognitive dissonance. Risk: could trigger defensiveness if they feel accused.
  Option C (Mechanism-first) jumps straight into the auction analogy. Risk: might seem gimmicky without proper framing.

  I'm leaning toward Option B because:
  1) It meets them where they are (likely already experiencing sunk cost pressure)
  2) Creates "fertile confusion" when we reveal the auction maps to their experience
  3) Lets us position rationality as the solution rather than the unrealistic standard

  Critical adjustments:
  - Must explicitly decouple "escalation" from "perseverance" early using the forward/backward distinction
  - The growing-pot auction variant better mirrors startups (investment increases perceived value)
  - Completion gradient should be named as separate from sunk costs - it's about proportion invested, not absolute amount

  What to explicitly exclude: 
  - Prospect theory visuals (too abstract)
  - Subgame perfection (irrelevant to solo decisions)
  - Any "when to quit" formula (would undermine the whole point)

  The closing question should force application of the framework, not regurgitation. "Would you invest fresh capital now?" makes them engage marginal cost analysis while ignoring sunk costs. A wrong answer would fixate on past investment ("We've come too far to quit").

  Most importantly: this session shouldn't provide answers so much as install alarm bells. The goal is to have founders catch themselves thinking "But we've already..." and recognize that as a danger signal.
answer: |-
  Here’s a structured approach for your 45-minute session, designed to build conceptual clarity while avoiding common traps. I’ll first outline candidate session orderings, then recommend one with rationale.

  ---

  ### **Candidate Orderings & Key Trade-offs**
  1. **Option A: Conceptual Build (Theory → Example → Pitfalls)**  
     - **Sequence**:  
       1. Dependency structure (Sunk cost ≠ Marginal cost)  
       2. Dollar auction (growing-pot variant)  
       3. Misconception map + Completion gradient  
       4. Check question  
     - **Gains**: Logical progression from theory to application.  
     - **Loses**: May feel abstract early; risks losing founders before emotional resonance.  

  2. **Option B: Inverse Narrative (Example → Theory → Pitfalls)**  
     - **Sequence**:  
       1. Dollar auction (bridge-round variant) as visceral hook  
       2. Dependency structure (framed as "why the auction traps us")  
       3. Misconception map (addressing identity/overcorrection)  
       4. Check question  
     - **Gains**: Immediate engagement; example grounds theory.  
     - **Loses**: May conflate auction mechanics with startup escalation early.  

  3. **Option C: Problem-First (Pitfalls → Theory → Example)**  
     - **Sequence**:  
       1. Misconception map (opening with founder identity tension)  
       2. Dependency structure (as antidote)  
       3. Dollar auction (growing-pot) to illustrate  
       4. Check question  
     - **Gains**: Addresses emotional barriers upfront.  
     - **Loses**: Risks reinforcing misconceptions before debunking them.  

  ---

  ### **Recommended Order: Option B (Inverse Narrative)**  
  **Why**: Founders are action-oriented. Starting with the auction creates shared confusion ("Why did no one stop?") that primes them for theory. The emotional punch bypasses defensiveness, making subsequent concepts stickier.  

  **Session Sequence & Key Moves**:  
  *(Total: 45 mins)*  
  #### **1. Dollar Auction: The Hook** (12 mins)  
     - **Use the growing-pot variant**: Each bid adds $0.20 to the prize (e.g., start at $1.00, after 5 bids prize = $2.00).  
     - **Why it works**:  
       - Mirrors startups: Investment inflates perceived value (more effort/savings poured in → vision feels "bigger").  
       - Locally rational steps: "I’m only bidding $0.10 more for a chance at $1.20? Worth it."  
       - No fixed endpoint: Reflects open-ended startup pivots.  
     - **Address your concern**: Frame the "opponent" as your past self: "You’re not bidding against others, but against the version of you that already invested."  
     - **Skip bridge-round**: Overcomplicates; dilutes the psychological trap.  

  #### **2. Dependency Structure** (15 mins)  
     - **Key separation**:  
       | **Sunk Cost** (Backward) | **Marginal Cost** (Forward) |  
       |--------------------------|-----------------------------|  
       | "What’s spent is gone."  | "Is the next dollar worth the remaining chance of success?" |  
     - **Teach sunk costs FIRST**:  
       - *Why*: It’s the cognitive foundation. Until this is accepted, marginal analysis is contaminated.  
       - *How*: Use a brutal metaphor: "Buried treasure costs $100K to dig. You’ve spent $90K and hit rock. Do you spend $10K more? Sunk costs say: *Ignore the $90K grave at your feet*. Only ask: Is $10K worth the 1% chance of treasure?"  
     - **Distinguish escalation from neighbors**:  
       - ≠ Risk-seeking: Escalators often hate risk but fear regret more.  
       - ≠ Option value: Real options are rational; escalation inflates options illusorily.  
       - ≠ Consistency: Virtue applies to principles, not dollars.  

  #### **3. Misconception Map** (13 mins)  
     - **Order of correction** (sequenced to preempt defenses):  
       1. **"Perseverance = Founder Identity"**:  
          - *Shut down early*: "This isn’t about quitting vs. grit. It’s about *directing* grit rationally. Escalation steals grit from better ideas."  
       2. **"Escalation = Irrational"**:  
          - *After auction*: "Each step was rational! That’s the trap. Smart people escalate *because* they optimize locally."  
       3. **"Just Ignore Sunk Costs"**:  
          - *During marginal cost*: "Sunk costs are irrelevant, but the *future* isn’t! Don’t abandon projects where marginal cost < expected value." Show a "remain vs. quit" equation: **Continue if (Probability of Success × Future Value) > Future Cost**.  
       4. **"Pre-Commit to Stop-Loss"**:  
          - *Limit*: "Thresholds fail when new info changes probabilities. Better: Schedule 'kill decisions' to reassess *all* variables quarterly."  
     - **Completion Gradient**:  
       - Name it! Frame as **"Proportional Sunk Cost Fallacy"**: Mistaking "90% done" for "90% likely to succeed," when the last 10% may cost more or reveal failure.  

  #### **4. The Check Question** (3 mins)  
     - **Q**: *"Your project has a 10% chance of success. It needs $50K more to complete. If you could rewind time, would you start this project today for $50K and 10% odds?"*  
     - **Confidently Wrong Answer**: "No, because we’ve already spent $500K." (Focuses on sunk costs)  
     - **Right Answer**: Compares $50K to 10% × project value (forward-looking).  

  #### **5. What to Explicitly Refuse** (2 mins)  
     - **Declare upfront**: "We won’t cover:  
       - Prospect theory graphs (intuition > math),  
       - Subgame perfection (this isn’t game theory),  
       - *Any universal rule for when to quit* (context trumps formulas).  
       Why? Today is about installing mental fire alarms—not false certainty."  

  ---

  ### **Why This Works**  
  - **Psychological Flow**: Auction → "Why did I fall for that?" → Framework to prevent relapse.  
  - **Preempts Identity Defense**: Separates "founder grit" from "escalation" early.  
  - **Forces Forward-Focus**: The check question tests internalization, not jargon.  
  - **Safe Conceptual Distance**: Your story isn’t center stage—the auction and framework are.  

  **Final Tip**: Open by saying, "This isn’t about my mistakes—it’s about a bug in human cognition. Let’s debug together." Sets the tone.
