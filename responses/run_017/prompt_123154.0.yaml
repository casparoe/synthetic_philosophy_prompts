          - Key features: Look at the bottom-right terminal flick (if present in the exemplar) and the shape of the counter.
     - **Sufficient answer:** 
          - If there are exemplars and the style (double-storey vs. single-storey) is different, then kick to expert (because this is a fundamental disagreement between you and your cofounder and requires an expert decision).
          - If the stroke order and key features (like the terminal flick) are very different (e.g., exemplar has a flick to the right and this one has a flick to the left, or the stroke order is reversed) then kick to expert.
          - If there are no exemplars, proceed to step 4.
     - **Judgment call?** Yes, especially in determining "very different". Provide clear examples of what counts as a significant difference (e.g., starting in a different place, moving in the opposite direction, missing a key feature). Minor variations are acceptable.

  **Step 4: Check for potential stitching issues.**
     - **How to check:** Look for:
          - Overlapping or overstitched segments: If the same segment is drawn multiple times (like doubling back), it might cause overstitching and look thick. This is acceptable only if it doesn't distort the letter.
          - Very small details: If the glyph has extremely small loops or tight curves that might not stitch well at small sizes.
          - Closure of the counter: If the counter (the enclosed area) is not fully closed, it might look like an open shape when stitched small. Check how closed the counter is (if applicable).
     - **Sufficient answer:** 
          - If there is an overstitched segment that is very obvious (e.g., it makes a thick blob) then kick to expert (because sometimes it might be acceptable and other times not).
          - If the counter is not closed and the letter might merge with an 'o' at small sizes (especially if the gap is less than, say, 1/5 the height of the letter) then kick to expert.
          - Otherwise, proceed.
     - **Judgment call?** Yes. The contractor might need to estimate the gap and the effect at small sizes. We can provide a reference: if the gap is less than the width of a typical stitch (which we can define as 1/10 of the x-height) then it's a concern.

  **Step 5: Check for originality (to catch traced Helvetica).**
     - **How to check:** Compare the glyph to standard fonts (like Helvetica, Arial, Times New Roman) by having reference images of these. Look for:
          - Exact match: Does it look exactly like a standard font? (e.g., the curves are too perfect, the proportions are exactly like Helvetica)
          - Lack of natural variation: Handwriting should show some natural variation (like slight wobbles, uneven curves, or personal touches). If it's too perfect, it might be traced.
