     - Step 4: Check for overstitched segment. The doubling back causes overstitching. If it's very obvious (thick blob), kick to expert. Otherwise, pass? In this case, it's overstitched so we kick to expert.
     - Step 5: Check for originality: if it's hand-drawn and not traced, pass. But if it's traced, we'd reject. However, the overstitching might be a sign of hand-drawn? So if it passes step 5, then kick to expert because of step 4.

