     - Step 4: The counter is barely closed. The gap is very small. At small sizes, it might merge with 'o'. If the gap is less than the threshold (say, 1/10 of x-height) then kick to expert. Otherwise, pass? But in this case, it's a problem -> kick to expert.
     - Step 5: If it passes, then kick to expert because of step 4.

