     - Note: This step is subjective. If the contractor is unsure, they should kick to expert.

  **Final Decision:**
     - If the glyph passed steps 1 and 2, and step 3 (if applicable) without rejection, step 4 without rejection, and step 5 without rejection, then accept.
     - If at any step the glyph is rejected, then reject.
     - If at any step the contractor is unsure or the step requires expert judgment and the glyph hasn't been rejected, then kick to expert.

  **What the procedure can't do:**
     - It cannot perfectly determine if a glyph is in the contributor's hand when there are no exemplars (for a new contributor) or only one exemplar (so variation is unknown).
     - It cannot resolve deep typographic debates (like whether a single-storey 'a' is acceptable when the contributor previously did double-storey) without expert input.
     - It may not catch every instance of a traced font if the tracing is very skillful and mimics hand variation.

  Now, let's run the four test cases through the checklist:

