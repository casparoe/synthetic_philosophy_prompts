     - Step 1: Continuous path -> pass.
     - Step 2: Looks like an 'a' -> pass.
     - Step 3: If there are exemplars, check consistency. If the contributor has a very consistent hand and this matches, then pass. But if it's the first submission, no issue. So let's assume no exemplars (or it matches) -> pass step 3.
