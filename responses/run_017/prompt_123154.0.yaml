  The procedure should be robust enough to handle the four test cases.

  **Checklist for Evaluating an 'a' Glyph**

  **Step 1: Check if the glyph is a single continuous path.**
     - **How to check:** Visually inspect the drawing to see if the pen never lifts. Also, check the data: if there's only one stroke (or multiple strokes that are connected without lifting the pen) then it's continuous.
     - **Sufficient answer:** If it's not a single continuous path, then reject immediately. (Note: The machines require one continuous path for stitching without trims.)
     - **Judgment call?** No, this is objective.
     - **Stop early?** If not continuous, reject.

  **Step 2: Check basic shape: Does it look like an 'a'?**
     - **How to check:** Compare to a standard 'a' (provide a reference image of a typical double-storey and single-storey 'a'). The contractor should look for:
          - A closed or nearly closed counter (the hole) at the top-right? 
          - A stem (a vertical or slanted stroke) on the right side? 
          - The overall shape should be distinct from 'o' and 'd' and other similar letters.
     - **Sufficient answer:** If the glyph is missing both the counter and the stem, or if it looks more like another letter (e.g., 'o', 'e', 'c'), then reject. Otherwise, proceed.
     - **Judgment call?** Yes, but we can provide clear references. The contractor should only reject if it's clearly not an 'a'. If in doubt, proceed to next steps.

  **Step 3: Check for consistency with the contributor's hand (if exemplars are available).**
     - **How to check:** If this is not the first submission for this contributor (i.e., there are previous exemplars of 'a' from the same person), then compare the current glyph to the exemplar(s). Look for:
          - Stroke order and direction: Does the current glyph follow the same starting point, stroke direction, and order as the exemplar(s)? (e.g., if the exemplar starts at the top of the stem, does this one too?)
