  **Case 2: A single-storey 'a' submitted into a family where every other exemplar is double-storey.**

     - Step 1: Continuous path -> pass.
     - Step 2: It looks like an 'a' (single-storey) -> pass.
     - Step 3: There are exemplars (all double-storey) and this is single-storey -> kick to expert (because of style difference).

