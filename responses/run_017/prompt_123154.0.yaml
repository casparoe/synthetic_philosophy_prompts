answer: |-
  Below is a structured, step-by-step checklist designed for your contractor to evaluate 'a' glyphs. It prioritizes objective checks first, flags judgment calls explicitly, and routes ambiguities to you. The procedure assumes access to the contributor's existing exemplars (if any) and reference images of standard 'a' shapes (double-storey and single-storey).

  ---

  ### **Glyph Evaluation Checklist: 'a'**
  **Instructions:**  
  1. Proceed in order. Stop early only at rejection points.  
  2. Use provided reference images (standard 'a' shapes, contributor's exemplars).  
  3. Answer each step as "Yes," "No," or "Unsure."  
  4. **Time target:** ≤2 minutes per glyph.  

  #### **Step 1: Single Continuous Path?**  
  - **Check:** Is the glyph one unbroken stroke (pen never lifts)? Verify via stroke data.  
  - **Sufficient answer:**  
    - **No** → Reject. *(Machines require one path; thread trims are unacceptable.)*  
    - **Yes** → Proceed to Step 2.  
  - **Judgment call?** No.  

  #### **Step 2: Basic Shape Legibility?**  
  - **Check:** Does the glyph have **either**:  
    - A closed or nearly closed counter (top-right enclosed area), **OR**  
    - A stem (vertical stroke) + a bowl (curved stroke) forming a distinct right side?  
    *(Use reference images—ignore stroke order/direction for now.)*  
  - **Sufficient answer:**  
    - **No** (e.g., no counter/stem, looks like an 'o' or 'e') → Reject.  
    - **Yes** → Proceed to Step 3.  
  - **Judgment call?** Minimal. Reject only if clearly illegible as 'a'.  

  #### **Step 3: Stroke Order Consistency (If Exemplars Exist)?**  
  - **Check:** If contributor has prior 'a' exemplars:  
    - Does the stroke **start and end in the same place** (e.g., top of stem vs. bottom)?  
    - Does it follow a **similar direction** (e.g., clockwise bowl vs. counter-clockwise)?  
  - **Sufficient answer:**  
    - **No** (e.g., exemplar starts at stem, new glyph starts at bowl) → Kick to expert.  
    - **Yes** or **No exemplars** → Proceed to Step 4.  
  - **Judgment call?** Yes. Minor variations allowed; major deviations kick to you.  

  #### **Step 4: Terminal Flick/Exit Consistency (If Exemplars Exist)?**  
  - **Check:** If exemplars exist, does the bottom-right stroke end:  
    - With a similar **flick direction** (e.g., upward curl vs. straight exit)?  
    - At a similar **exit angle** (within 20 degrees of exemplar)?  
  - **Sufficient answer:**  
    - **No** (e.g., exemplar flicks up, new glyph flicks down) → Kick to expert.  
    - **Yes** or **No exemplars** → Proceed to Step 5.  
  - **Judgment call?** Yes. Use angle guides; reject only if blatantly inconsistent.  

  #### **Step 5: Style Consistency (Double vs. Single-Storey)?**  
  - **Check:** If exemplars exist, is the glyph:  
    - **Double-storey**: Bowl and stem are distinct shapes (even if connected).  
    - **Single-storey**: Bowl and stem fuse into one curve (circle + stick).  
  - **Sufficient answer:**  
    - **Mismatch** (e.g., exemplars all double-storey, new glyph single-storey) → Kick to expert.  
    - **Match** or **No exemplars** → Proceed to Step 6.  
  - **Judgment call?** Yes. Use reference images; kick on disagreement.  

  #### **Step 6: Stitching Viability?**  
  - **Check:**  
    - **Closure:** Is the counter (enclosed area) ≥90% closed? *(Measure gap: if >10% of glyph height, reject.)*  
    - **Overstitching:** Are overlaps >2x stroke width? *(Highlight if visible thickness doubling.)*  
  - **Sufficient answer:**  
    - **No** (e.g., gap too wide, severe overstitching) → Reject.  
    - **Yes** → Proceed to Step 7.  
  - **Judgment call?** Partially. Use measurements; reject only if objectively unstitchable.  

  #### **Step 7: Hand-Drawn Authenticity?**  
  - **Check:** Does the glyph show **at least two** of:  
    - **Natural wobble**: Curves/lines have minor imperfections (not digitally perfect).  
    - **Pressure variation**: Stroke width changes (if data available).  
    - **Idiosyncrasy**: Unique flourish (e.g., exaggerated flick, asymmetric bowl).  
  - **Sufficient answer:**  
    - **No** (e.g., perfectly smooth, no quirks) → Kick to expert.  
    - **Yes** → Accept.  
  - **Judgment call?** Yes. Use reference fonts (Helvetica/Arial) for comparison.  

  ---

  ### **Final Decision**  
  - **Accept**: Passes all steps with no rejection/kick.  
  - **Reject**: Failed Step 1, 2, or 6.  
  - **Kick to expert**: Ambiguity in Steps 3, 4, 5, or 7.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Resolve foundational debates** (e.g., "Is single-storey a valid 'a'?"). Your experts must rule on kicks from Step 5.  
  2. **Detect subtle tracing without exemplars**. Step 7 catches only obvious tracing; nuanced cases require your eye.  
  3. **Handle extreme handwriting variants** (e.g., abstract shapes) without exemplars. Step 2 filters only universally illegible glyphs.  

  ---

  ### **Test Case Evaluations**  
  **Case 1: Double-storey 'a' with overstitched bowl (doubled-back stroke)**  
  - Step 1: Pass (continuous).  
  - Step 2: Pass (recognizable 'a').  
  - Step 3/4: N/A (assume no exemplars).  
  - Step 5: N/A.  
  - Step 6: **Kick to expert** (overstitching >2x stroke width).  
  - **Result**: Kick to you.  

  **Case 2: Single-storey 'a' in double-storey family**  
  - Step 1: Pass.  
  - Step 2: Pass (still an 'a').  
  - Step 5: **Kick to expert** (style mismatch with exemplars).  
  - **Result**: Kick to you.  

  **Case 3: 'a' with barely closed bowl (merges with 'o' when small)**  
  - Step 1: Pass.  
  - Step 2: Pass (counter is present).  
  - Step 6: **Reject** (gap >10% height; high risk of merging with 'o').  
  - **Result**: Reject.  

  **Case 4: Traced Helvetica 'a' (no hand-drawn quirks)**  
  - Step 1: Pass.  
  - Step 2: Pass.  
  - Steps 3–6: Pass (assume no exemplars/stitching issues).  
  - Step 7: **Kick to expert** (fails authenticity; no wobble/idiosyncrasy).  
  - **Result**: Kick to you.  
    - **Why not rejected?** Step 7 requires your policy on "authenticity."  
    - **To auto-reject traced glyphs**: Add to Step 7: "If glyph matches standard font (e.g., Helvetica/Arial) with ≤1 natural variation, reject."  

  ---

  ### **Recommendations for Your Workflow**  
  - **Training**: Provide contractors with clear reference sheets (standard fonts, stitching thresholds, angle guides).  
  - **Step 7 Enhancement**: Add a "side-by-side" overlay tool to compare glyphs vs. Helvetica/Arial during checks.  
  - **Expert Review**: For kicked glyphs, use a 5-second rule: If *you* can’t decide quickly, default to rejection.  

  This system routes disagreements (e.g., single-vs-double-storey) to you via Step 5, and handles functional issues (stitching, legibility) objectively. The traced Helvetica is caught in Step 7 as a judgment call, preserving your agency.
