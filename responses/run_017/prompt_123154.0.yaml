     - Step 5: Check for originality. It's a traced Helvetica, so it lacks natural variation. The contractor should look for signs of tracing: too perfect, no wobbles, no personal touches. If the contractor determines it's traced (because it matches Helvetica exactly and has no irregularities) then reject. Otherwise, if they miss it, it might get accepted.

