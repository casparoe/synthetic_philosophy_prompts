  The core tension they've identified is between the field's apparent Rankean empiricism (objectivity resides in verifiable particulars) and more contemporary theories (Carr's selectivity, White's emplotment). Their frustration is palpable—they've done the theoretical reading but need a practical reconstruction of what their discipline's unwritten rules *actually* presuppose, not just a survey of theories. 

