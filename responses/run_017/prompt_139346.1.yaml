prompt: |-
  i'm TAing my first solo section this term, 50 minutes, first-years, and next week i have to do causation by omission. They've just come off two weeks of Humean regularity stuff and Mackie-style INUS conditions, and they haven't done counterfactuals or possible worlds properly, so I'd rather not lean on "in the nearest world where..." if I can avoid it. I tried this last year with the plant that died because nobody watered it and it went badly: within ninety seconds someone said "so the Queen of England killed your plant," everyone agreed that was absurd, half of them concluded omissions can't be causes and the other half concluded that everything is a cause, and I had no move ready for either. So: don't explain causation by omission to me — I want a plan for how to teach it.

  What I'd like most is the order. What has to be on the board before "can a not-doing be a cause?" even feels like a real question rather than a verbal trick, given where these students are (they're happy talking about INUS conditions and drawing little sufficient-condition diagrams, and they currently think causation is a relation between events that happen)? Where does the "fine, but when and where did the not-watering happen?" worry fit — before the metaphysical "are absences things?" bit, after it, or should I skip that bit entirely at this level? And does the counterfactual way of putting it have to be smuggled in early anyway even though they don't have the machinery for it? For the carrying example I want one case, not three, that does the whole job: tell me what structural features it has to have and what it has to lack (my guess is exactly one person with a standing reason to act, nothing positive happening at all between the last chance to act and the outcome, and a counterfactual that is realistic rather than silly), why the plant fails — I think because it's too easy to reconstrue as a positive act, or because the real cause is obviously the sun and the dryness — and why the lurid medical cases will derail us into blame before we've even got the puzzle.

  Then the misconceptions, including the ones I've named myself, and the exact point in the sequence where each should be headed off: what I've been calling positive reconstrual — they turn the omission back into an action, "he chose to sit there," "she was doing something else instead" — which I think is the dangerous one because it makes the topic dissolve instead of getting answered; profligacy panic, the Queen of England line, which ate my whole class last year; the slide from cause to blame, which I suspect is what's really driving the "of course not" intuition; and the shrug where they decide it's just counterfactual dependence and move on. I've also been toying with a distinction I made up, between bare omissions (nobody had any reason whatsoever to expect you to act) and loaded omissions (there's a role, a practice, a standing expectation that you would): tell me whether bringing that in early gives me a clean way to handle profligacy without ending up having quietly substituted norms for causation, or whether it just teaches them that what causes what depends on what we expect of people — and if it's the latter, whether that's a bug I should hide for a week or a feature I should own out loud. Finally, what should I openly refuse to settle in fifty minutes and say out loud that I'm refusing (I'm guessing the legal act/omission doctrine, any structural-equation or difference-making formalism, and the free-will-adjacent material, but you tell me), and one question for the last five minutes that would actually show me they've grasped the shape of the problem rather than just picked a verdict.
reasoning: |-
  Okay, the user is a TA preparing to teach a 50-minute section on causation by omission to first-year students. They've had prior experience where the lesson went off the rails quickly with students either concluding omissions can't be causes or everything is, leading to confusion. The students have covered Humean regularity and Mackie's INUS conditions but haven't delved into counterfactuals or possible worlds. The TA wants a structured plan to avoid past pitfalls.

  First, I need to understand why the plant example failed. The user mentioned that students immediately brought up the Queen of England, leading to profligacy—every omission being a cause. The plant case might have too many potential non-actors, making it hard to pinpoint responsibility. Also, positive factors like the sun or dryness could overshadow the omission, causing students to misconstrue the actual cause.

  The TA wants a single case study that avoids these issues. Key features needed: one clear agent with a duty, a specific window for action, no intervening positive events, and a realistic counterfactual. This setup should prevent positive reconstrual (e.g., turning omission into an action) and profligacy by limiting relevant omissions to those with expectations.

  The user also mentioned misconceptions: positive reconstrual, profligacy panic, blame slide, and counterfactual shrug. Each needs addressing at specific points. For instance, profligacy should be tackled by defining relevant omissions early using normative contexts (roles, duties) without conflating causation with blame. However, introducing "bare vs. loaded omissions" might help by restricting causes to loaded cases, but the TA worries about replacing causation with norms. This distinction should be presented as a tool to limit profligacy, emphasizing that norms help identify which omissions are relevant, not that they create causation.

  The TA needs to avoid certain topics: legal doctrines, formalisms like structural equations, and free-will issues. The 50-minute limit means focusing on the puzzle itself, not solutions. A closing question could assess understanding—asking why the guard's omission caused the failure but the Queen's didn't, testing grasp of contextual relevance.

  Structuring the lesson is crucial. Start by anchoring in INUS conditions to make omissions feel like a real question. Show how INUS diagrams include absences, making omissions a natural extension. Then introduce the guard case to illustrate a clear omission. Preempt misconceptions: after presenting the case, immediately address profligacy by contrasting with irrelevant omissions (the Queen). Later, discuss blame versus cause to separate intuition. Avoid counterfactual language but subtly use it in examples when necessary.

  Timing is tight. Each segment must be concise. Use board space efficiently: diagrams for INUS, then guard scenario. Guide discussion to stay on track, redirecting blame talk. The loaded vs. bare distinction can be introduced as a practical tool, clarifying it's about relevance, not defining causation. End with the reflection question to gauge comprehension.

  Overall, the plan should build step-by-step, validating the problem within their existing knowledge, using a controlled example, addressing misconceptions preemptively, and leaving deeper theories for later. This approach should prevent derailment and ensure students grasp the core issue.
answer: |-
  Here's a battle-tested plan for your 50-minute causation-by-omission section, designed for first-years fresh off INUS/Hume and avoiding counterfactual machinery. The key is **structure and controlled examples** to prevent derailment.

  **Core Objective:** Get them to see the *puzzle* of causation by omission within *their existing framework* (INUS/events) and understand why it's philosophically contentious, without collapsing into profligacy, denial, or premature blame.

  **Order & Board Flow (Crucial):**

  1.  **(5 min) INUS Refresher & Planting the Seed:**
      *   *Board:* Draw a simple INUS diagram for a *positive* cause (e.g., Short Circuit (SC) causing Fire (F): SC + Oxygen + Flammable Material = F. Box "SC").
      *   *Say:* "Recall: SC is an INUS condition. It's an insufficient but necessary part of an unnecessary but sufficient condition for F. It's an *event* that happened."
      *   *Question:* "Can an *absence* be part of a sufficient condition? Can a *lack* of something be an INUS condition?" Plant the seed. Don't answer yet.

  2.  **(15 min) Introducing the Puzzle via a Controlled Example:**
      *   **The Case: Security Guard & The Vault Door**
          *   *Board:* "Scenario: Highly secure vault. Door *must* be manually locked by 10 PM by the *designated* security guard (Guard Gary) on duty. Protocol is clear: it's Gary's *sole responsibility* during his shift. Gary is sitting at his desk, awake, playing solitaire. At 9:58 PM, he thinks 'I should lock it now,' but gets distracted by a tricky card move. He *does nothing*. At 10:01 PM, thieves walk in (door unlocked) and steal everything."
          *   *Key Features:* **One** clear agent with **explicit, sole responsibility/duty**. **Specific, defined window** for action (before 10 PM). **No positive intervening event** (the door didn't jam, Gary didn't sabotage it). **Realistic counterfactual** implied (If Gary had locked it at 9:59, theft prevented) - but *don't say "nearest world"*, just state the obvious dependency. **Outcome clearly bad**.
      *   *Board:* Start the INUS diagram for Theft (T):
          *   "Thieves Present (TP) + Vault Unlocked (VU) + [Other Stuff?] = T"
          *   Focus on "Vault Unlocked (VU)". What caused VU? Highlight: *No locking event occurred between 9:00 PM and 10:00 PM.* Gary's *omission to lock*.
      *   *Question:* "Was Gary's *not locking the door* part of the sufficient condition for the theft? Was it an INUS condition? Did it *cause* the vault being unlocked?" (Force engagement with INUS framework).
      *   *Goal:* Get them to tentatively agree *in this specific case* that the omission seems causally relevant. This establishes the puzzle as real.

  3.  **(10 min) Why the Plant Failed & Blocking Profligacy:**
      *   *Say:* "Last time I used a plant. Why did that go wrong? Let's diagnose."
      *   *Board:* "Plant Dies (PD): No Watering (NW) + Sunlight (S) + Dry Soil (DS) = PD?"
      *   *Problems:*
          *   **Profligacy Panic:** "Who *could* have watered? Me? You? The Queen?!" → *No designated agent/duty.*
          *   **Positive Reconstrual:** "The *sun* dried it out!" / "The *dryness* killed it!" → Positive events overshadow the absence.
          *   **Ambiguity:** When/where was the omission? Constant state? Multiple points?
      *   *Contrast with Guard Case:* "Why is Gary different?"
          *   Specific Agent (Gary) with Duty (Guard Role).
          *   Specific Time Window (Before 10 PM).
          *   The omission *is* the direct cause of VU (unlocked state). No obvious positive event *causing* the unlocked state at the critical time besides the *lack* of locking.
      *   **Introduce Bare vs. Loaded Omission (Carefully!):**
          *   *Say:* "This points to a useful distinction, *for now*, just to manage the 'Queen of England' problem:"
          *   *Board:* "**Bare Omission:** An absence where there is *no expectation, duty, or role* for any specific agent to act. (e.g., *Anyone* watering the plant, including the Queen)."
          *   *Board:* "**Loaded Omission:** An absence where there is a *specific agent* who has a *recognized expectation, duty, or role* to perform the action. (e.g., *Gary* locking the vault door)."
          *   *Crucial Nuance:* "We're **not** saying loaded omissions *are* causes and bare omissions *aren't*. We're saying that loaded omissions are the *paradigm cases* that make us *ask the question seriously* about causation by absence. They avoid the 'everything causes everything' panic. The *metaphysical puzzle* remains for *both*, but loaded omissions give us a clearer case to focus on." **OWN THIS DISTINCTION AS A TOOL, NOT A THEORY.** Say: "This helps us focus our examples and avoid chaos. We're bracketing the deeper 'are absences real?' question for now."

  4.  **(10 min) Addressing Core Misconceptions Head-On:**
      *   **Positive Reconstrual ("He chose to sit there!"):**
          *   *When:* Right after discussing the Guard case, when someone (inevitably) says it.
          *   *Response:* "Okay, let's grant that. Gary *chose* to play solitaire. That's an *action* (playing cards). But does the *action of playing cards* cause the vault being unlocked? Or is it the *lack of the locking action* that causes it? Suppose Gary was *thinking hard* about locking it but forgot? Suppose he was asleep? The *positive thing he did instead* isn't what *made the vault unlocked*; what made it unlocked was the *failure to lock it*. We need to separate the *inaction* from the *action done instead*." Redirect to the absence.
      *   **Blame Slide ("But he was negligent!"):**
          *   *When:* Usually arises quickly with loaded omissions.
          *   *Response:* "Absolutely, we might blame Gary! But is *causation* the same as *blame* or *responsibility*? Could something be a cause *without* anyone being blameworthy? (e.g., a tree branch falls, blocking the lock mechanism). Could someone be blameworthy *without* causing the outcome? (e.g., Gary forgets, but thieves were already inside and would have cracked the safe anyway). We're focused on *causation* right now. Blame involves norms, duties, intentions – important, but a separate layer." **Write "CAUSATION ≠ BLAME" on the board.** Repeat as needed.
      *   **Counterfactual Shrug ("It's just dependence!"):**
          *   *When:* If someone tries to dissolve the puzzle.
          *   *Response:* "That's a popular *solution* (counterfactual theories)! But remember our starting point: Hume, Mackie, events. We usually think of causes as *events that happen*. Does dependence *between events* capture this? The *absence* of an event – is that itself an 'event that happens'? That's the core puzzle we're wrestling with. Counterfactual dependence might be true, but it doesn't make the metaphysical weirdness go away." Acknowledge the view but keep focus on the event-based tension.

  5.  **(5 min) The "When/Where?" Worry & Skipping Deep Metaphysics:**
      *   *When:* Likely when discussing the Guard case or contrasting with Plant.
      *   *Response:* "Great question! Where *is* Gary's omission? When did it happen? Is it at 9:59? Is it a state lasting all night? This points to a deep metaphysical issue: **Are absences 'real' things? Can nothingness be part of the causal chain?** Philosophers debate this fiercely! *For today's 50 minutes, we are NOT solving this.* We're just trying to see *why* omissions pose this puzzle for our usual event-based, INUS picture of causation. The 'when/where?' worry is a big part of *why* it's puzzling! File it away for metaphysics class." **Write "METAPHYSICS OF ABSENCES: ?" and box it.**

  6.  **(5 min) Wrap-Up & Assessment Question:**
      *   *Board:* Recap the core tension: "Causation (INUS/Hume) → Events that happen? BUT: Loaded Omissions (like Guard Gary) seem causally relevant. PUZZLE!"
      *   *Refuse to Settle (Openly):*
          *   "We are NOT settling the legal act/omission doctrine."
          *   "We are NOT introducing structural equations or formal difference-making."
          *   "We are NOT diving into free will or determinism."
          *   *Say:* "Today was about *seeing the puzzle clearly* within the framework you know."
      *   **The Question (Last 5 min):** "**In the Security Guard case, why does it seem *more plausible* (even if still puzzling) to say Gary's omission caused the theft than it does to say the Queen of England's omission caused it? What key difference does the 'loaded omission' distinction highlight about the *way we think about causation* in these cases?**"
          *   *Why this works:* It forces them to articulate the contextual relevance (role/duty) that makes Gary's omission salient without requiring them to endorse a full theory, and separates it from bare omissions/profligacy. It shows they grasp the *shape* of the problem and the tool used to manage it.

  **Why this plan works:**

  1.  **Anchors in Prior Knowledge:** Starts firmly within INUS/Humean events. Makes omission feel like a *new challenge to that framework*, not a trick.
  2.  **Controlled Example (Guard):** Solves the Plant's problems: Single agent/duty, clear timing, omission directly leads to critical state, prevents positive overshadowing & profligacy.
  3.  **Manages Profligacy Early:** The Bare/Loaded distinction is introduced *pragmatically* as a problem-focusing tool, not a causal theory, explicitly sidestepping the "norms define causation" pitfall. Own its limitations.
  4.  **Preemptive Strike on Misconceptions:** Addresses Positive Reconstrual, Blame Slide, and Counterfactual Shrug *at the point they're likely to arise* with prepared, clear responses.
  5.  **Defuses Metaphysics:** Explicitly brackets the deepest "are absences real?" and "when/where?" questions as important *but beyond scope*, preventing rabbit holes.
  6.  **Clear Boundaries:** States upfront what *won't* be covered (law, formalism, free will).
  7.  **Assessment Focus:** The final question tests understanding of the *puzzle* and the *pragmatic tool* used to manage its scope, not just a verdict on "can omissions cause?"

  **Key Teaching Moves:**

  *   **Board as Scaffold:** Use it relentlessly for INUS diagrams, case details, key distinctions (Bare/Loaded), and core tensions (Cause ≠ Blame, Metaphysics ?).
  *   **Guide Discussion Firmly:** "That's a great point about blame, but let's park that for a second and focus on causation..." / "The Queen is an example of a *bare* omission, remember our distinction...".
  *   **Validate Intuitions:** "Yes, it *feels* weird to say 'nothing caused something'! That's the puzzle!" / "The dryness *was* involved, but let's look at the INUS condition carefully...".
  *   **Embrace the Puzzle:** Your goal isn't to *solve* causation by omission in 50 mins. It's to make them see *why* it's a genuine and difficult problem worth thinking about. End with it unresolved but clarified.

  This structure provides the clarity and guardrails needed to navigate this treacherous topic with first-years and avoid the Queen of England stealing your class again. Good luck!
