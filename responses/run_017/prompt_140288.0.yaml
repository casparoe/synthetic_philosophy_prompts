  I need to analyze this argument about Hilbert's Hotel and figure out where it goes wrong. My flatmate claims it proves that no actually infinite collection of concrete objects can exist, but I think it might be attacking supertasks instead. Let me restate the argument to make sure I understand it.

  First, we have Hilbert's Hotel with infinitely many rooms, all occupied. The manager performs an operation: evict all odd-numbered room guests and move each guest from room 2k to room k. After this, the hotel is still full, and the number of guests is the same because we can pair them one-to-one with before.

  Then, he does this operation infinitely many times in a supertask: at times 11:00, 11:30, 11:45, etc., halving the intervals so that by noon, infinitely many operations have been done.

  After each finite number of operations, the hotel is full, but each guest is evicted at some finite stage because no guest is in a room divisible by all powers of 2. Therefore, at noon, no guest is left, so the hotel is empty.

  But since after each operation the hotel is full, and the number never drops, it seems like it should still be full at noon. Contradiction.

  My flatmate says this shows that such a hotel can't exist, hence no actual infinities.

  I thought I could run a similar argument with one room: evict and readmit the guest at each halving interval, so by noon, he's been evicted infinitely many times. If we say he's evicted at each stage, then at noon he shouldn't be there, but during each interval he's readmitted, so it's full except possibly at noon. But in this case, it's ambiguous what happens at noon.

  My flatmate says the infinite case is different because both conclusions are forced: it must be empty and it must be full, whereas in the finite case, it's just undefined.

  But I think the core issue might be with supertasks or with how we handle the limit.

  I need to find which step to reject.

  I want to keep: possibility of infinite universe, continuous spacetime, and Cantor's bijection for cardinality.

  So, let's look at the steps.

  Step 1: The operation doesn't reduce the number of guests. This seems fine; it's a bijection.

  Step 2: Performing the operation infinitely many times in a supertask. Here, "supertask" means completing an infinite sequence of actions in finite time.

  Step 3: Every guest is evicted by some finite stage, so at noon, no guest is present. This seems logical if we think that if each guest is removed and not brought back, they should all be gone.

  Step 4: At noon, zero guests.

  Step 5: After every finite number of operations, the hotel is full, so at noon, it should still be full. But this is where the contradiction arises.

  The key is what we mean by "at noon." Noon is the limit of the sequence of times.

  In mathematics, for sequences, the limit can be different from the values at finite stages.

  For example, consider the sequence of sets of guests present after n operations.

  After 0 operations: all guests present.

  After 1 operation: guests in even-numbered rooms originally, now renumbered.

  Actually, after n operations, the guests present are those whose original room number is divisible by 2^n.

  Because each operation, you keep only those divisible by higher powers.

  After n operations, a guest is present only if their room number is divisible by 2^n.

  Since no number is divisible by all 2^n, for any guest, there is some n where they are evicted.

  So the set of guests after n operations is S_n = {k | 2^n divides k}

  And S_n has the same cardinality as the original set, infinite.

  But the intersection over all n of S_n is empty, because no k is in all S_n.

  At time noon, which is after all finite operations, we might think of the state as the limit of the S_n.

  In set theory, the limit of a decreasing sequence of sets is the intersection.

  Here, S_{n+1} ⊆ S_n? Let's see.

  After n operations, S_n is guests with k divisible by 2^n.

  After n+1 operations, which is one more eviction and shifting, S_{n+1} is guests with k divisible by 2^{n+1}, so S_{n+1} ⊆ S_n.

  Yes, it's a decreasing sequence of sets.

  The intersection ∩_{n=1}^∞ S_n = ∅, since no k is divisible by all 2^n.

  So the limit of the sets is empty.

  Therefore, at noon, the hotel is empty.

  But after each finite n, |S_n| = ℵ₀, infinite.

  There's no contradiction here; it's just that the cardinality at the limit is not the limit of the cardinalities.

  In other words, the cardinality function doesn't commute with taking limits for infinite sets.

  For finite sets, if you have a decreasing sequence, the cardinality decreases step by step, and at the limit, it matches.

  But for infinite sets, the cardinality can be constant at each finite stage but drop at the limit.

  That's what's happening here.

  In step 5, when it says "after every one of those rounds the hotel was completely full, and step 1 says the operation never reduces the number of guests," it's true for each finite round, but at the infinite limit, the number can change.

  The argument assumes that since the number never reduces at any finite stage, it can't reduce at noon. But that's the mistake; it can reduce at the limit.

  Similarly, in the one-room case: after each eviction and readmission, at each finite time before noon, the guest is present. But at noon, if we define the state as the limit, it might be absent or present?

  In the one-room case, let's define the state.

  Suppose at time t_n, which is 11:30 for n=1, etc., but let's index properly.

  Set t_0 = 11:00, operation: evict and immediately readmit.

  Similarly at t_1 = 11:30, t_2 = 11:45, etc., down to noon.

