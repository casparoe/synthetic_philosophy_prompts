  Specifically, for the cardinality.

  In this case, the number does drop at the limit.

  Moreover, in the one-room case, if we define the state at noon based on the limit, we might have no guest, or we might say he is present. But it depends on how we define the process.

  In the one-room case with immediate readmission, it's like at each step, he is out for a moment but back in immediately. At noon, since there's no time between last operation and noon, it could be undefined or defined as in.

  But to avoid contradiction, we can define it consistently.

  Back to the infinite case.

  The "absurdity" my flatmate mentions is that the hotel goes from full to empty with nothing happening at the change, but that's what limits do; changes can happen at limit points without a specific event.

  For example, consider a particle moving continuously from point A to point B. At each time before noon, it's not at B, but at noon it arrives. Nothing "happens" at noon except the limit is reached.

  Similarly here.

  So I think the mistake is in step 5, assuming that the state at the limit must match the states at finite times if they are all the same.

  But it doesn't have to for infinite collections.

  Now, about Cantor's bijection: in step 1, the operation is a bijection, so cardinality same. At finite stages, cardinality same. At limit, cardinality changes to zero.

