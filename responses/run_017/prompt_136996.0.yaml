  We are given a problem about font fallback and the concept of "sameness" of letters across different scripts and typefaces.

  The user has noticed:
  1. Unicode assigns different code points to Latin 'a' and Cyrillic 'а' even though they look identical, because they belong to different scripts.
  2. CJK ideographs that are written differently in Chinese, Japanese, and sometimes Korean are given the same code point because they are considered the same character (despite glyph differences) based on their role in the script.

  The user's half-baked rule: two glyphs are the same letter if you can slowly morph one into the other without the reader ever stopping to recognize it as that letter.

  But the user notes that this rule breaks on italics: the roman double-storey 'a' and the italic single-storey 'a' are considered the same letter, but there's no continuous morphing without passing through unrecognizable shapes.

  The questions:
  1. What does font substitution, Unicode, and typeface families (with roman, italic, bold) presuppose about what makes an 'a' an 'a'?
  2. Is there one underlying view or several that don't collide?
  3. What would a fallback tool built on a different view do differently?
  4. Is the morph rule just one of those views with extra steps, or does it give different answers?

  We are to provide:
  - A reconstruction (analysis)
  - A one-sentence bottom line naming the view that existing practice commits us to.
  - A tag: either SHAPE, ROLE, FAMILY-RESSEMBLANCE, or OTHER.

  Analysis:

  Unicode's approach is based on the character's identity in a writing system. They encode characters (abstract concepts) and not glyphs (visual representations). So:
  - Latin and Cyrillic are different scripts, so even if a glyph looks the same, they are different characters (different code points).
  - CJK ideographs are unified because they share a common historical origin and meaning, and are considered the same character even though the glyphs (the way they are drawn) may differ by region.

  In typeface families, the roman, italic, and bold are considered stylistic variants of the same design. The italic 'a' is not a different letter from the roman 'a'. The same holds for bold. They are variations of the same abstract character.

  Font substitution in browsers: when a character is not available in the requested font, the browser looks for a fallback font that has a glyph for that code point. It does not consider the visual appearance (glyph) but the code point. So if the code point is the same, it will substitute even if the glyph looks very different (e.g., a CJK character in a Chinese font vs. a Japanese font). But if the code point is different (like Latin vs. Cyrillic), then it won't substitute even if they look the same.

  So the existing practice (Unicode and font substitution) is based on the abstract character (as defined by its role in a script) and not on the visual shape.

  The user's morph rule is based on the continuity of visual form. It fails in the case of the two 'a' forms because the morphing would go through an unrecognizable state. But in practice, we don't require a continuous morph. We accept that the two 'a's are the same because they represent the same abstract character in the same script.

  Thus, the existing practice commits to the view that a letter is defined by its role in a script (i.e., its abstract identity) and not by its visual appearance.

  However, note that in the case of typeface families, the roman and italic are considered the same because they are part of the same family and represent the same abstract character. So the underlying view is that the abstract character (with a specific role in a script) is the invariant.

  Now, what about the morph rule? The morph rule is a visual continuity rule. It would give different results in cases where two glyphs are visually continuous but belong to different abstract characters? Actually, the example of Latin and Cyrillic 'a' shows that they are visually identical but are different abstract characters. So the morph rule would consider them the same (because you don't need to morph at all) but the existing practice does not. Conversely, the two 'a' forms in the same typeface family are the same abstract character but the morph rule fails to connect them continuously.

  Therefore, the morph rule is a different view (based on visual continuity) and would lead to a different fallback tool. Such a tool might substitute a Cyrillic 'а' for a Latin 'a' because they are visually the same, but that would be incorrect because they are different letters in different scripts. Also, it might fail to substitute within the same typeface family for the italic 'a' because the morphing path breaks.

  But note: the morph rule as stated is about the same letter. The user says "readers keep reading it as that letter". So it's not just visual but also about perception. However, the perception is tied to the script? For example, if you are reading a Latin text, you expect Latin letters. So the context matters. The morph rule doesn't account for the script context.

  Bottom line: The existing practice (Unicode, font substitution, and typeface families) is committed to the view that a letter is defined by its role in a script (abstract character) and not by visual shape or continuity.

  Tag: This view is "ROLE" because the identity is determined by the role in a writing system.

  However, note that the tag options are: SHAPE, ROLE, FAMILY-RESSEMBLANCE, or OTHER.

  - SHAPE: if it were based on visual appearance.
  - ROLE: if based on the abstract role in a script.
  - FAMILY-RESSEMBLANCE: if we think of it as a family resemblance concept (like Wittgenstein) where there is no single invariant but a network of similarities.

  But the existing practice does have a clear invariant: the abstract character as defined by the script and the code point. So it's not family resemblance in the sense of multiple criteria. It's a single criterion: the character's identity in the script.

  Therefore, the tag should be ROLE.

  One-sentence bottom line: Existing practice commits to the view that a letter is defined by its abstract role in a script.

  Reconstruction:

  The Unicode standard, font substitution algorithms, and typeface family design all rest on a shared principle: the identity of a character is determined by its role within a writing system (script). This abstract character is invariant across visual variations (like italics, bold, or even regional glyph variations in CJK). 

  In contrast, the user's morph rule is a visual continuity criterion that does not align with the script-based identity. It would lead to substitutions that ignore script boundaries (like substituting a Cyrillic letter in a Latin text) and fail to capture the same character across typographic variants that are discontinuous in shape.

  A fallback tool built on the morph rule would substitute across scripts when the glyphs are visually similar (or can be morphed) and might not substitute within a script when the glyphs are too different (like the two 'a' forms). This would break the expectations of the text: a Latin text must use Latin letters, and an italic variant must be considered the same letter as the roman.

  The morph rule is not just an extra step for the existing view; it represents a fundamentally different view (visual continuity) that gives different answers in key cases.

  Therefore, the existing practice commits to the role-based view.

  Final tag: ROLE

