answer: |-
  ### Reconstruction
  The core issue revolves around defining "sameness" for characters across scripts, fonts, and typographic variants. Unicode's approach prioritizes *abstract character identity* based on a character's role in a writing system (script), not visual appearance. This explains why Latin "a" (U+0061) and Cyrillic "а" (U+0430) have distinct code points despite identical glyphs—they belong to different scripts—while CJK ideographs share code points because they represent the same abstract character across regional writing systems, despite glyph variations. Font substitution relies on this code-point matching, ignoring glyph shape. Meanwhile, typeface families (e.g., roman vs. italic) treat stylistic variants as the "same letter" by appealing to a shared *design intent*: the italic "a" is a contextual rendering of the abstract Latin "a", not a new character. 

  These practices cohere under a single view: sameness is defined by **functional role in a script**, not shape or continuous visual transformation. Your morph rule, while intuitively appealing, conflicts with this. It fails for italics (as you note) and would misapply across scripts (e.g., morphing Latin "a" to Cyrillic "а" would preserve appearance but violate script boundaries, breaking text semantics). A fallback tool based solely on morph continuity would substitute incorrectly—e.g., replacing Latin "a" with Cyrillic "а" in Latin text—and fail to handle discontinuous variants like roman/italic "a". It isn't just "existing view with steps"; it yields different outcomes by prioritizing perceptual continuity over script function. Alternative views (e.g., shape-based or family-resemblance) would disrupt Unicode consistency and typographic conventions—for instance, a shape-based tool might unify Latin/Cyrillic glyphs but fracture CJK or italic/roman pairs.

  ### Bottom Line
  Existing practice commits to **ROLE**: a character's identity is defined by its abstract, contextually invariant function within a writing system, not visual form or transformational continuity.

  \answer{ROLE}
