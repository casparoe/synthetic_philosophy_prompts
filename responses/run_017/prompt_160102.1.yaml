prompt: |-
  hi — I write SF novels (the kind with a lot of argument in them, sorry) and I'm stuck on a chapter. There's a character, Marta, who has to write the expedition report on whether the locals count as thinkers at all, and I want her reasoning to be better than two cliches trading slogans. The creatures in my book are:

  the Shoal — a colony of about ten thousand small organisms. There is no single body whose states do anything. The patterns that would play the belief and desire roles only exist across the whole colony, and if you remove any one organism the pattern survives but reorganises.

  the mimics — behaviourally indistinguishable from us, internally nothing like us: same inputs, same outputs, different machinery, and on top of that the machinery that does the job on Tuesday isn't the machinery that does it on Thursday.

  the sleepers — internally full of the right states, causally wired to each other in all the right ways, but nothing downstream ever reaches behaviour. They never move differently because of what they believe.

  Marta's colleagues have two lines and I don't want her to just recite them. One says: same job, so same mind — which as far as I can tell collapses into saying a thermostat or a national economy has beliefs. The other says: no neurons, no mind — which my readers will see through in a paragraph.

  So what I actually want, before I write the scene, is the spec. Write me the list of requirements any theory of what-it-is-to-have-a-belief has to meet to be any good at cases like these. Cases it has to give a verdict on. Distinctions it isn't allowed to flatten — having a mind vs. having the same kind of mind we have; being in a state vs. that state being realised by something; the state vs. whatever plays the role; how fine-grained the job description gets to be; occurrent vs. merely dispositional. And the arguments it has to survive: the old one where it turns out every damn system realises some role or other (Putnam's, I think?), and the one about whether the realiser or the role is what does the causal work.

  For each requirement give me the case or consideration behind it, and mark which ones are non-negotiable and which are just what one camp happens to want. Then flag any pair of requirements I probably can't have both of — that's the bit I most want, because it gives me something for Marta to genuinely be stuck on rather than something she wins.

  If there's room at the end, a short scorecard for the obvious candidates: the it's-the-job-not-the-stuff view, the view that mental states are just brain states, and whatever the current version is where the science tells you what the realiser is and the folk theory only fixes the role. But keep the weight on the requirements, that's the part I can't get from a skim. And no reading list or footnotes — my character is on a planet without a library, and neither of us can look anything up.
reasoning: |-
  Okay, the user writes science fiction and is stuck on a chapter. The character Marta needs to write a report on whether certain alien creatures count as thinkers. The user wants to avoid clichéd arguments and instead have Marta engage with deeper philosophical requirements for what it means to have beliefs. 

  First, I need to unpack the three alien species: the Shoal (a distributed colony), the mimics (functionally identical but internally variable), and the sleepers (internally structured but behaviorally inert). The user explicitly rejects two simplistic positions: functionalism (same job = same mind) and biological chauvinism (no neurons = no mind). 

  The core request is a "spec" - a list of requirements any theory of belief must satisfy to handle these edge cases. The user wants: cases each requirement addresses, which are non-negotiable vs. debatable, conflicting requirements to create genuine tension for Marta, and brief scorecards for major theories. Crucially, no citations - Marta's stranded without references.

  Hmm... the challenge is balancing philosophical rigor with narrative utility. The requirements must:
  - Cover key distinctions (mind vs. human-like mind, state vs. realizer, etc.)
  - Interlock in ways that create dilemmas (no easy answers)
  - Be understandable through fictional examples
  - Avoid academic jargon where possible

  I'll structure around 6 core requirements:
  1. Causal efficacy (Shoal test) - non-negotiable
  2. Internal coherence (mimics test) - negotiable
  3. Behavioral link (sleepers test) - non-negotiable
  4. Realizer independence (Putnam's puzzle) - non-negotiable
  5. Grain sensitivity (description level problem) - negotiable
  6. Occurrent presence (dispositional trap) - negotiable

  The conflicts are crucial for Marta's struggle:
  - Efficacy vs. independence creates a true dilemma (Shoal breaks both)
  - Coherence vs. grain sensitivity torpedoes simple behaviorism
  - Behavioral link vs. occurrence makes sleepers tragic

  For scorecards:
  - Functionalism (job-focused): Fails Shoal/sleepers
  - Biologism (brain states): Fails mimics
  - Role/realizer distinction: Best but still cracks under Shoal

  The user's deeper need seems to be intellectual honesty in worldbuilding - they want philosophical depth that feels lived, not lectured. Marta's report should mirror real metaethics struggles where clarity reveals harder questions. I'll emphasize how each requirement's conflict prevents tidy solutions, forcing Marta to make a call without cosmic certainty. That's the "stuck" quality they want.
answer: |-
  Here's the spec for a viable theory of belief, tailored to your cases and designed to avoid the clichés. The conflicts are where Marta's genuine intellectual struggle lies.

  **Core Requirements for a Theory of Belief (The "Marta Test")**

  1.  **Causal Efficacy ("The Shoal Test")**:
      *   **Requirement**: Belief states must play a *causal role* in generating *intelligent, flexible behavior* appropriate to the environment and the system's goals. They can't just be inert patterns.
      *   **Case/Consideration**: The Shoal. Its large-scale patterns *do* cause complex, adaptive colony-level behavior (foraging, defense, reproduction). The pattern reorganizes if damaged, showing resilience. *Non-negotiable*. A belief that does nothing isn't a belief driving action.
      *   **Conflict**: Raises the "Grain Sensitivity" problem (#5) – *how* flexible/intelligent? Also clashes with "Realizer Independence" (#4) regarding *what* is causing the behavior.

  2.  **Behavioral Link ("The Sleeper Trap")**:
      *   **Requirement**: Belief states must have a *necessary connection to potential behavior*. A state utterly disconnected from any possible output cannot be a belief.
      *   **Case/Consideration**: The Sleepers. Their internal states are causally isolated from *all* behavior. They *look* like they *should* believe, but it never manifests. *Non-negotiable*. Beliefs must be *for* guiding action, even if not acted upon *right now*.
      *   **Conflict**: Creates tension with "Occurrent Presence" (#6). How strong must the link be? Mere "potential" is slippery. Also clashes with overly internalist views.

  3.  **Realizer Independence ("Putnam's Puzzle")**:
      *   **Requirement**: The *specific physical stuff* realizing the belief state cannot be the defining factor. Different substrates can realize the same belief.
      *   **Case/Consideration**: Mimics (and human variation). The machinery differs wildly, even day-to-day in Mimics, yet the input-output behavior (and arguably the "belief" driving it) remains consistent. *Non-negotiable*. Any theory demanding specific biology fails here.
      *   **Conflict**: Creates the **MAJOR DILEMMA** with "Causal Efficacy" (#1). *What* is causing the behavior? The abstract functional role? Or the specific physical realizer? If it's the role, how does an abstract pattern *cause* anything? If it's the realizer, Mimics (and humans!) fail when their machinery changes. This is the **heart of Marta's struggle**.

  4.  **Fine-Grained Role Specificity ("Not the Thermostat")**:
      *   **Requirement**: The functional "job description" for a belief must be *rich* and *specific* enough to exclude simple systems like thermostats or economies while including genuinely cognitive systems.
      *   **Case/Consideration**: The "same job, same mind" cliché collapsing into thermostats/national economies. What *extra* does a belief do that a thermostat's temperature representation doesn't? *Negotiable but crucial*. Different theories add different specifics (inference, holism, self-monitoring, etc.). Marta needs *her* theory's specifics.
      *   **Conflict**: Raises the "Mimics Challenge" (#5). How specific is *too* specific? If the "job" is described too finely (e.g., requiring specific neural pathways), Mimics fail. Too coarsely, thermostats qualify.

  5.  **The Mimics Challenge / Grain Sensitivity ("Not Just Inputs & Outputs")**:
      *   **Requirement**: The theory must account for *internal coherence and integration* beyond just stimulus-response pairs. Beliefs aren't isolated states; they interact with each other and desires.
      *   **Case/Consideration**: The Mimics. Same inputs/outputs, different/variable internals. Does the *way* they achieve the input-output mapping matter? Is the internal *structure* of the state, its relationship to other states, part of what makes it a belief? *Negotiable but critical*. Pure behaviorism fails here; pure functionalism struggles if "function" is defined only by inputs/outputs.
      *   **Conflict**: With "Realizer Independence" (#3) – if internal structure matters *too much*, Mimics fail when their machinery changes. With "Fine-Grained Role" (#4) – defining the "job" to include internal relations is hard without becoming overly specific or biological.

  6.  **Occurrent vs. Dispositional ("The Sleeping Shoal?")**:
      *   **Requirement**: The theory must distinguish between *occurrent* beliefs (actively guiding thought/action *right now*) and *dispositional* beliefs (stored knowledge that *could* be activated). Both are legitimate, but different.
      *   **Case/Consideration**: Is the *entire* Shoal pattern "occurrent" all the time? Or are only active sub-patterns occurrent? What does a Sleeper's "dispositional" belief even mean if it can *never* become occurrent? *Negotiable*. Any complete theory needs this distinction, but its boundaries are fuzzy.
      *   **Conflict**: With "Behavioral Link" (#2) – How strong is the link for dispositional beliefs? With "Causal Efficacy" (#1) – Only occurrent beliefs are causally active *now*.

  **Conflicts & Where Marta Gets Stuck:**

  1.  **The Shoal Dilemma (Causal Efficacy vs. Realizer Independence):** This is the **big one**.
      *   *Problem*: The Shoal's belief-pattern *causes* complex behavior (satisfies #1). But *what* is causing it? The abstract pattern distributed across shifting organisms? Or the specific organisms *right now*? If it's the pattern (#3), how does an abstract pattern exert physical force? If it's the organisms (#3 fails), then when an organism dies and the pattern reorganizes using different organisms, is it a *different* belief? Marta sees the causal power but grapples with *what* possesses it.
  2.  **The Mimics Trap (Fine-Grained Role vs. Mimics Challenge):**
      *   *Problem*: To avoid thermostats (#4), Marta needs a rich job description involving inference, integration, etc. But if she makes this description *too* specific about *how* the inference/integration works internally (#5), the Mimics fail when their machinery changes on Thursday. If she keeps it too abstract, thermostats sneak back in.
  3.  **The Sleeper Paradox (Behavioral Link vs. Realizer Independence):**
      *   *Problem*: Sleepers have perfect internal realizers (#3) utterly disconnected from behavior (#2 fails). This seems clear. But *why* does the internal realization matter *at all* if it has no link to behavior? What *is* the "belief" in the Sleeper besides inert structure? Marta needs to justify why the internal state *would* be a belief *if* connected, even though it isn't. This pushes her towards needing something like potential (#2) or intrinsic structure (#5), both tricky.

  **Scorecard for Major Views:**

  *   **Radical Functionalism ("It's the Job!"):**
      *   Shoal: **PASS** (Pattern plays the role, causes behavior).
      *   Mimics: **PASS** (Same job, different/variable stuff).
      *   Sleepers: **FAIL** (Internal states play no role in behavior).
      *   Thermostat: **RISK** (Must define "job" VERY carefully to exclude).
      *   **Marta's Problem:** Struggles with *what* causes behavior (Shoal dilemma) and risks including too much (thermostat). Sleepers are a clear fail.

  *   **Biological Chauvinism ("Only Brains!"):**
      *   Shoal: **FAIL** (No neurons).
      *   Mimics: **FAIL** (Wrong/variable machinery).
      *   Sleepers: **PASS?** (Has brain states, but... useless).
      *   Thermostat: **PASS** (Excluded).
      *   **Marta's Problem:** Clearly fails Shoal & Mimics. Sleepers "pass" absurdly. Too narrow.

  *   **Role/Realizer Distinction ("Folk Role + Scientific Realizer"):**
      *   Shoal: **UNCLEAR/STUCK** (Is the distributed pattern the realizer of the folk role? Does the folk role *require* a localized realizer? Can the pattern *as a whole* be the realizer? Causal efficacy problem remains).
      *   Mimics: **PASS** (Folk role same, realizer changes but maintains role).
      *   Sleepers: **FAIL** (Realizer exists, but plays NO causal role matching the folk concept).
      *   Thermostat: **PASS?** (Only if folk role is defined too simply).
      *   **Marta's Problem:** Provides the best *framework* but doesn't solve the hard cases automatically. The Shoal forces a decision on whether a radically distributed, shifting physical system *can* realize the folk role *and* exert causal power *as that role*. This is where her report lives.

  **Marta's Path:** She can't have a theory that smoothly satisfies all requirements perfectly across all cases. The conflicts are real philosophical knots. Her report's strength comes from rigorously laying out these requirements, showing how the cases stress them, and then making a *reasoned judgment call*, likely prioritizing **Causal Efficacy**, **Behavioral Link**, and **Realizer Independence** (leading to a "Yes" for Shoal & Mimics, "No" for Sleepers), while openly grappling with *how* the Shoal's pattern can be causally efficacious and why the Mimics' variable internals don't break the functional role. Her struggle *is* the insight. Good luck!
