  Next, we need a scoring key that maps answer patterns to leaves.

  We'll define the leaves:

  - Full aggregator (FA): aggregates interpersonal, intrapersonal, risks, benefits, etc.
  - Probabilistic Aggregator (PA): aggregates risks but not small actual burdens.
  - Tie-Breaker (TB): only aggregates when the harms are of roughly equal severity.
  - Intrapersonal Aggregator (IA): aggregates within a life but not between lives.
  - Lexical Priority (LP): never aggregates; the worst off has lexical priority.
  - Threshold (TH): aggregates only above a threshold, and gives priority to getting people above threshold.
  - Incomparabilist (INC): does not aggregate and sees the options as incomparable.
  - Person-Affecting (PAF): has a person-affecting constraint, especially against causing harm.

