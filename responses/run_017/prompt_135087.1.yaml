  **Notes on the Scoring Key:**  
  - **Indistinguishable Pairs:** The quiz *cannot* distinguish:  
    - **Tie-Breaker (TB), Intrapersonal Aggregator (IA), and Lexical Priority (LP).** All share the same answer pattern (differences are in justifications, not cases).  
    - **Threshold (TH) vs. others in Case 9:** TH prioritizes the threshold floor, but answers overlap with non-aggregators.  
  - **Least Confident Leaf:** **Incomparabilist (INC)** is the least confident. It relies on inconsistent/coin-flip answers, which may reflect indecision rather than a principled position.  
  - **Weakest Question:** **Item 4 (Burden vs. Benefit)** does little work. Only FA consistently chooses B; others choose A, making it redundant for differentiation.  
  - **Gaps in the Logical Space:** A pattern suggesting a new position would be:  
    - **B in 10 (Above-Threshold) + B in 11 (Risk-Choice) + A in 7a (Small Burdens).** This combines risk aggregation, threshold-sensitivity, and no small-burden aggregation—an unexplored view.  
    - **Frequent coin-flips (e.g., 6c, 11c, 12:A/B randomly)** with no consistent pattern may indicate a "hybrid" or underdefined position.  

  ---

  ### **How to Use This Handout**  
  - Participants self-score using the key.  
  - Discuss why certain leaves cluster (e.g., TB/IA/LP) and why gaps exist (e.g., accepting risk aggregation but rejecting intrapersonal aggregation is incoherent).  
  - Emphasize that cases 7a/7b and 11 are designed to isolate PA and risk sensitivity.  

  This quiz prioritizes cases over self-reporting to reveal implicit commitments. If answers don’t fit any leaf cleanly, it may reflect an untheorized view—perfect for closing discussion!
