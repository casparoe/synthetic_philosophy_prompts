  Below is your "Which Aggregator Are You Actually?" quiz for the Scanlon-style contractualism reading group. It includes 12 concrete cases designed to sort participants into the specified leaves without asking directly about aggregation principles. Each case has 2–3 answer options. The scoring key maps answer patterns to the leaves, flags indistinguishable pairs, and includes a note on limitations.

  ---

  ### **Quiz: Which Aggregator Are You Actually?**  
  *For each scenario, select the option that best reflects your moral intuition. There are no right or wrong answers—choose what feels most compelling.*

  1. **The Itch vs. The Wrist (Interpersonal)**  
     You must choose between:  
     - **A) Preventing one person from suffering a broken wrist.**  
     - **B) Preventing 100,000 people from each suffering a barely noticeable, 1-second itch.**  

  2. **The Itch vs. The Wrist (Intrapersonal)**  
     You must choose for a single person:  
     - **A) Preventing them from suffering a broken wrist.**  
     - **B) Preventing them from suffering 100,000 barely noticeable, 1-second itches.**  

  3. **Risk Distribution Policy**  
     A policy must be implemented:  
     - **A) One identified person suffers a serious injury (e.g., a broken leg) for sure.**  
     - **B) 10,000 people each face a 1-in-10,000 risk of the same serious injury.**  

  4. **Burden Relief vs. Benefit Provision**  
     You must choose:  
     - **A) Relieving one person of a significant burden (e.g., curing a chronic illness causing daily pain).**  
     - **B) Providing 100,000 people with a significant benefit (e.g., a month-long mood boost from a safe treatment).**  

  5. **Limb vs. Fingertips Spectrum**  
     You can prevent:  
     - **A) One person from losing a limb (life-altering impairment).**  
     - **B) *n* people from each losing a tiny fingertip sliver (permanent, minor sensitivity loss).**  
     *At what minimum n would you switch from A to B?*  
     - **a) Never switch; always choose A.**  
     - **b) Switch at n = 100.**  
     - **c) Switch at n = 10,000.**  
     - **d) Switch at n = 1,000,000.**  

  6. **Repeated Small Choices**  
     You face the same choice five independent times. Each time, you choose between:  
     - **A) Preventing one person from a moderate harm (e.g., a deep cut requiring stitches).**  
     - **B) Preventing 10 people from a minor harm (e.g., a mild headache).**  
     *What would you do across all five instances?*  
     - **a) Always choose A (save from moderate harm).**  
     - **b) Always choose B (save from minor harms).**  
     - **c) Mix choices (e.g., sometimes A, sometimes B).**  

  7. **Small Burdens vs. Small Risks**  
     *(Designed to split "chances add" from "small burdens add")*  
     - **Case 7a (Small Burdens):**  
       Choose between:  
       - **A) Preventing one person from a broken finger.**  
       - **B) Preventing 1,000 people from a barely noticeable itch.**  
     - **Case 7b (Small Risks):**  
       Choose between:  
       - **A) Preventing one person from a broken finger.**  
       - **B) Preventing 100,000 people from a 1-in-100,000 risk of a broken finger.**  

  8. **Severity vs. Numbers (Lexical Test)**  
     You must choose:  
     - **A) Preventing one person from paralysis (permanent, severe disability).**  
     - **B) Preventing 1 million people from a broken arm (temporary, heals fully in 6 weeks).**  

  9. **Threshold Floor Priority**  
     You must choose:  
     - **A) Preventing 100 people from severe malnutrition (lifelong impairment below basic functioning).**  
     - **B) Preventing 10,000 people from a barely noticeable itch.**  

  10. **Above-Threshold Tradeoff**  
      *(All harms are above a basic functioning threshold)*  
      Choose between:  
      - **A) Preventing 10 people from a broken arm (painful, temporary disability).**  
      - **B) Preventing 1,000 people from a mild headache (annoying but no functional impairment).**  

  11. **Repeated Risk-Choice Separation**  
      *(Designed to split "chances add" from other leaves)*  
      You face the same choice five independent times. Each time:  
      - **A) Prevent one person from a broken finger.**  
      - **B) Prevent 100 people from a 1-in-100 risk of a broken finger.**  
      *What would you do on the first instance?*  
      - **a) Choose A.**  
      - **b) Choose B.**  
      - **c) Flip a coin.**  

  12. **Person-Affecting Harm**  
      Choose between:  
      - **A) Saving one life, but causing 100 people a temporary headache as a side effect.**  
      - **B) Doing nothing: the person dies, and no headaches occur.**  

  ---

  ### **Scoring Key**  
  Map your answers to the leaves using the branch questions below. The logical space is defined by four branch questions derived from your answers:  
  1. **Interpersonal Aggregation (IA):** Do numbers *ever* add across people? (Y/N)  
  2. **Intrapersonal Aggregation (IntraA):** Do numbers add within a single life? (Y/N)  
  3. **Risk Aggregation (RiskA):** Do mere chances of harm add? (Y/N)  
  4. **Severity Lexical Priority (SLP):** Does severity *always* trump numbers? (Y/N/Threshold)  

  Leaves are positioned in this space as follows:  
  - **Full Interpersonal Aggregation (FA):** IA=Y, IntraA=Y, RiskA=Y, SLP=N  
  - **Probabilistic Aggregator (PA):** IA=N, IntraA=Y, RiskA=Y, SLP=N (aggregates risks but not small actual burdens)  
  - **Tie-Breaker (TB):** IA=Only for equal severity, IntraA=Y, RiskA=N, SLP=Y  
  - **Intrapersonal Aggregator (IA):** IA=N, IntraA=Y, RiskA=N, SLP=Y  
  - **Lexical Priority (LP):** IA=N, IntraA=Y, RiskA=N, SLP=Y  
  - **Threshold (TH):** IA=Y above threshold, IntraA=Y, RiskA=Y, SLP=Threshold  
  - **Incomparabilist (INC):** IA=N, IntraA=N, RiskA=N, SLP=N (incomparability)  
  - **Person-Affecting (PAF):** IA=Y, IntraA=Y, RiskA=Y, SLP=N, but with "no harming" constraint  

  **Scoring Instructions:**  
  - Use the table below to find your leaf. Match your answers to the response patterns.  
  - If you match multiple leaves, see the "Indistinguishable Pairs" note.  
  - Empty cells (e.g., IA=Y, IntraA=N, RiskA=Y, SLP=Y) are unattractive/incoherent (e.g., aggregating interpersonally but not intrapersonally while accepting risks creates contradictions).  

  | Leaf                      | Key Answers (Item: Option)                                                                 | Branch Logic (IA/IntraA/RiskA/SLP) |  
