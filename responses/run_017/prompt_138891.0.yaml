prompt: |-
  I'm in a small reading group that just worked its way through Arrow's theorem — the four-ish conditions (unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship) and the result that nothing satisfies all of them at once — and instead of moving on I've been obsessing over actual ranked-choice voting, the eliminate-the-last-place-candidate-and-redistribute kind that Maine, Alaska, New York City primaries and Australia's lower house now use for real elections. So here's what I want: a reconstruction of what this practice presupposes about what an election is *for* and about what it even means to talk about the will of the voters, written for someone who has no library access and can't look anything up.

  The specific things I keep tripping over, in no particular order. (1) The reform pitch is basically that ranked choice ends spoilers — that a candidate who can't win shouldn't change who does — but that sounds like independence of irrelevant alternatives, and ranked choice notoriously violates it; whether a no-hope candidate is on the ballot can flip the winner. So is the reform case committed to something its own method breaks, or is the anti-spoiler complaint actually a weaker, more local thing about vote-splitting under plurality specifically? I'd like you to separate what the practice strictly presupposes from what it merely fits well with, and to say where it's just underdetermined and several theories would licence the same rules. (2) It's sold as producing majority winners, but the majority in question is *still standing after everyone else has been eliminated*, not *beats every rival one-on-one*, and those can come apart: ranked choice can dump the candidate who'd beat both finalists head to head, and in Alaska's 2022 special election the one Republican who looked like the stronger general-election candidate got knocked out ahead of the other one. What conception of collective preference does that presuppose, and is it a coherent one? (3) The ballot asks for one ranking up front and then reuses it after candidates have dropped out, which seems to presuppose that my ranking is stable and menu-independent — that my second choice in a ten-way field is the same as my second choice once it's down to three. Is that a real commitment of the practice or just a practical convenience? (4) And relatedly: two-round runoffs like France's let voters change their minds between rounds, which Arrow's framework doesn't even have room for, since it takes preference orderings as fixed inputs. Is that an evasion of the theorem or a genuinely different picture of elections as preference-forming rather than preference-aggregating?

  Then, the part I care about most: if we took the pairwise-majority idea seriously instead — elect the candidate who beats everyone head to head — what would actually have to change in how elections are run and talked about, what do we do when there is no such candidate, and is there any reading on which the specific pattern of violations ranked choice has is a feature rather than a bug? I'd rather get one argument followed all the way down than a survey of options, and please don't point me at papers or reading lists — just reason it out.
reasoning: |-
  Okay, let me unpack this user's query about ranked-choice voting (RCV) and its philosophical underpinnings. They're clearly deep into Arrow's theorem and now wrestling with how real-world RCV aligns or conflicts with those principles. 

  First, I notice they're not just asking for textbook explanations - they want a coherent reconstruction of what RCV presupposes about democracy itself. That's ambitious. Their four pain points are beautifully precise: the spoiler/IIA tension, the "majority" illusion, ballot stability assumptions, and the runoff vs preference-formation question. 

  Hmm... the user's frustration with Alaska's 2022 example tells me they've done their homework. They're not some undergrad regurgitating lecture notes - this is someone who's stared at actual election results and smelled blood in the water. That "is it a feature or bug?" question at the end? That's where their soul is bleeding. They want to know if RCV's flaws reveal something profound or just confirm it's messy.

  Let me tackle their IIA confusion first. The key is distinguishing Arrow's global IIA from the "vote-splitting" complaint. RCV absolutely violates IIA (as they know), but its anti-spoiler pitch is really about plurality's pathology where two similar candidates cannibalize each other. That's local. I should use their Alaska example to show how IIA failure manifests differently in RCV versus plurality. 

  For the "majority" question... ah, this is juicy. RCV manufactures a majority by elimination, but that's not the same as a Condorcet winner. The presupposition here is radical: that collective preference emerges through sequential elimination. It's not about finding some pre-existing "will" but constructing legitimacy through the counting process itself. Alaska 2022 proves this isn't academic - when Palin knocked out Begich, it assumed Republican voters' rankings were transitive (Begich > Palin > Dems) even if head-to-head Begich would've beaten her. 

  The ballot stability issue is trickier. Practically, RCV pretends preferences are static to avoid costly runoffs. But philosophically? It leans toward a snapshot theory of voter judgment. The French runoff model, by contrast, treats preferences as deliberative. Neither escapes Arrow - just kicks the can down the road. 

  Now for their main dish: what if we took pairwise comparisons seriously? Buckle up. To actually implement Condorcet, we'd need radically different ballots (full rankings for all pairs) and accept that sometimes there's no clean winner. The user's "feature not bug" question about RCV's specific failures is brilliant. Maybe RCV's flaws are the price of avoiding cyclic chaos? Or perhaps its elimination ritual serves social cohesion better than a Condorcet tiebreaker would. 

  I'll structure this as a journey: start by debunking the IIA confusion, then expose RCV's manufactured majorities, dissect the ballot fiction, contrast runoff philosophies, and finally confront the Condorcet alternative head-on. The through-line should be that RCV presupposes elections are preference-shaping performances, not preference-revealing mechanisms. That's the unspoken worldview. 

  And no academic references - promise. This needs to stand on pure reasoning. The user wants to see gears turning, not name-dropping. Time to wrestle this beast barehanded.
answer: |-
  You're drilling into the exact tensions that make voting theory philosophically rich. Let's reconstruct the presuppositions of Ranked-Choice Voting (RCV) step by step, then contrast with a pairwise-majority (Condorcet) approach. No citations, just reasoning from first principles.

  ### Core Presuppositions of RCV
  RCV presupposes an election is **a procedure to identify a broadly acceptable winner by simulating a sequence of runoff elections**, where voter preferences are **static, ordinal rankings** collected once. The "will of the voters" is defined as **the candidate who can survive sequential elimination by accumulating majority support from voters whose first choices are exhausted**. This isn't about discovering a pre-existing societal preference, but about *constructing legitimacy* through a specific counting ritual.

  Now, your specific questions:

  **(1) The Spoiler/IIA Tension**  
  The anti-spoiler argument is **weaker and more local** than full IIA. It targets one pathology of plurality voting: vote-splitting between *similar* candidates causing a *less popular, dissimilar* candidate to win (e.g., Nader "spoiling" Gore for Bush in 2000). RCV fixes *this specific failure* by redistributing votes. But it violates full IIA because:
  - Adding/removing a **non-winning candidate** can change vote redistribution paths, altering the elimination order (e.g., a centrist candidate absorbing votes that would have gone to other moderates).
  - **Presupposition**: Elections should avoid *grossly* perverse outcomes (like plurality spoilers), but perfect menu-independence isn't required. The reform case presupposes that eliminating *obvious* spoiler effects is more urgent than satisfying Arrow’s global IIA.

  **(2) The "Majority Winner" Illusion & Collective Preference**  
  RCV produces a candidate with majority support *in the final round*, but this is **not** a claim about beating all others head-to-head (Condorcet efficiency). The Alaska 2022 example (Begich eliminated before Palin, despite likely beating her head-to-head) reveals RCV’s core presupposition:  
  **Collective preference is path-dependent and constructed through elimination.** It assumes that a voter’s ranking reflects **absolute thresholds of acceptability**, not relative strength. If Begich was many voters’ *second* choice but few people’s *first*, RCV interprets this as "less broadly acceptable" than a candidate with more first-choice support.  
  - **Presupposition**: A candidate eliminated early lacks *core support*. The "will of the voters" is the last candidate standing after others are deemed *insufficiently preferred* by too many voters. This is coherent only if you accept that legitimacy comes from surviving sequential attrition, not from being the Condorcet winner.

  **(3) Ballot Stability & Menu Independence**  
  This is a **practical necessity, not a deep commitment**. RCV *pretends* your ranking is menu-independent because it must simulate later rounds without revoting. But the practice doesn’t presuppose voters *actually* have static, context-independent rankings. It’s a trade-off:  
  - **Presupposition**: The cost of gathering new preferences (via multiple elections) outweighs the distortion of reusing initial rankings. Voters are expected to rank *strategically* (e.g., "I’ll rank the lesser evil second") anticipating eliminations. It’s a computational shortcut, not a philosophical claim about human psychology.

  **(4) Runoffs vs. Preference Formation**  
  Two-round runoffs **evade Arrow’s framework explicitly** by allowing preference revision. This presupposes elections are **dynamic preference-forming processes**. Voters may:  
    - Learn about candidates’ viability between rounds.  
    - Deliberate or negotiate (e.g., tactical voting).  
    - Update preferences based on new information.  
  RCV’s static ballot presupposes preferences are **fixed inputs**; runoffs presuppose they are **malleable outputs** of the election process. Neither "solves" Arrow; they sidestep it by rejecting fixed input orders. RVC prioritizes efficiency; runoffs prioritize reflection.

  ---

  ### Pairwise Majority (Condorcet) Approach: A Radical Alternative
  If we took pairwise majority seriously, elections would fundamentally change:

  1.  **Ballot Revolution**: Voters would need to submit a *complete ranking of all candidates* (or at least pairwise preferences). The ballot becomes a matrix: "Who do you prefer in every possible matchup?" This demands more voter engagement.

  2.  **The "No Condorcet Winner" Problem**: When no candidate beats all others head-to-head (a Condorcet cycle), we need a fair tiebreaker. Common solutions:  
      - **Ranked Pairs/Tideman**: Lock in strongest pairwise victories sequentially, ignoring later conflicts.  
      - **Schulze Method**: Elect the candidate with the strongest "path" of victories.  
      - **Minimax**: Elect the candidate whose worst pairwise defeat is smallest.  
      These methods presuppose that cycles reflect **legitimate ambivalence**, not incoherence. The winner is the "least objectionable" in conflict scenarios.

  3.  **Campaigns & Rhetoric**:  
      - Candidates would compete on *electability against specific rivals* ("I’m the only one who beats Trump in a swing state").  
      - "Vote-splitting" arguments vanish; similar candidates highlight their pairwise strengths.  
      - Negative campaigning might increase, as pairwise matchups force direct comparisons.

  4.  **RCV’s Violations as "Features"?**  
      In a Condorcet view, RCV’s flaws are bugs:  
      - Eliminating a Condorcet winner (like Begich) is a failure.  
      - IIA violations are chaotic, not deliberate.  
      But one *could* argue RCV’s path-dependence is a feature:  
      - It favors candidates with **strong core support** (many 1st choices) over consensus candidates who are everyone’s second choice but no one’s favorite.  
      - Sequential elimination is **ritually intelligible**; voters see a "story" of who was defeated. Pairwise methods are black-box computations.  
      - **Presuppositional Difference**: Condorcet methods seek a "best compromise"; RCV seeks a "broadly acceptable winner with passionate backing."

  ### The Bottom-Line Reconstruction
  - **RCV Presupposes**: An election is a **streamlined attrition ritual** where legitimacy comes from surviving elimination rounds. Voters express static preferences; the system manufactures a majority. Anti-spoiler claims are about mitigating pluralty’s acute flaws, not satisfying IIA.  
  - **Condorcet Presupposes**: An election should reveal the **most defensible compromise candidate** via direct comparisons, even if cycles require computational resolution.  
  - **Arrow’s Shadow**: Both systems violate at least one condition. RCV embraces path-dependence; Condorcet embraces computational complexity. Neither "finds" a pre-existing will; they define it through different aggregation logics.  

  RCV’s appeal is in its *narrative simplicity* ("we eliminated the losers until someone had 50%+"). Condorcet’s appeal is in its *conceptual rigor* ("the winner beats everyone else"). The choice isn’t technical but philosophical: Is democracy about **procedural legitimacy** (RCV) or **minimizing majority regret** (Condorcet)? Your obsession is well-founded—this is where formal theory meets democratic soul-searching.
