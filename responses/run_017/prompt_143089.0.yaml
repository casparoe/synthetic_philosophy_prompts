answer: |-
  ## Fellowship Proposal: The Frame Problem in Sortition — Boundary Laundering and Democratic Legitimacy  

  **Project Title:** Invisible Exclusions: Sampling Frames as Democratic Boundaries in Sortition-Based Systems  

  ### Core Question  
  Is the "frame problem" in sortition—where the construction of the sampling population launders political exclusion as technical necessity—a *distinctive* vulnerability that undermines sortition’s core claims to impartiality and legitimacy, or merely a technical echo of the boundary problem inherent to all democratic systems?  

  ### Why the Obvious Answers Fail  
  1. **The "It’s Just Elections’ Boundary Problem" Rebuttal (Steelmanned):**  
     *Claim:* Sortition draws from the same demos (e.g., electoral roll) as elections, inheriting identical exclusions. Descriptive representativeness only ever references the *defined* population.  
     *Why it’s insufficient:* Sortition’s legitimacy relies on **mechanical impartiality** and **passive representativeness**, whereas elections treat boundaries as active contestation (e.g., suffrage movements). The frame’s technical presentation obscures exclusion, neutralizing dissent. Randomness "launders" the frame’s politics, making it harder to politicize—unlike electoral franchises, which remain visible sites of struggle.  

  2. **The "Better Lists/Weighting Fixes It" Response:**  
     *Claim:* Stratified sampling, oversampling marginalized groups, or post-hoc weighting corrects frame limitations.  
     *Why it’s insufficient:* Technical fixes address *statistical* exclusion but not *legitimacy* exclusion. Weighting compensates mathematically but cannot legitimize why Group X was omitted from the frame initially. The deeper issue is epistemic: if the frame defines "who counts," sortition’s claim to "mirror" the public collapses into circularity.  

  ---

  ### Frame Options & Why One Prevails  
  1. **Option 1: Democratic Boundary Laundering**  
     *Focus:* Sortition’s machinery obscures exclusion by depoliticizing the frame. Contrast with elections’ open boundary contests.  
     *Weakness:* Risks overclaiming uniqueness; elections also use technical rolls (e.g., voter registration databases).  

  2. **Option 2: Epistemic Legitimacy Gap**  
     *Focus:* How frame exclusions undermine sortition’s knowledge claims (e.g., "the people’s wisdom" assumes a complete demos).  
     *Weakness:* Too narrow; neglects institutional design responses.  

  3. **Option 3: Recursive Design Challenge**  
     *Focus:* "Who selects the frame?" as an infinite regress, demanding meta-governance innovations.  
     *Weakness:* Too abstract; hard to ground in observable cases.  

  4. **✅ Winning Option: Comparative Discretion in Democratic Mechanisms**  
     *Focus:* **Where systems hide discretion**. Elections localize boundary decisions in visible franchises; sortition buries them in technical frames. This framing:  
     - Explains *why* the frame problem is *worse* for sortition (laundered exclusion),  
     - Connects to legitimacy crises in real assemblies,  
     - Opens space for design interventions.  

  ---

  ### Methodology (9-Month Plan)  
  **Months 1–3: Theoretical Deconstruction**  
  - Map key justifications for sortition (Fishkin’s deliberation, Dahl’s representation, Landemore’s epistemic claims).  
  - Identify *which premises* implicitly assume an uncontested frame (e.g., "representativeness" requires an unproblematic *demos*).  
  - *Deliverable:* Theory paper pinpointing frame-dependency in sortition’s legitimacy arguments.  

  **Months 4–6: Empirical Case Studies**  
  - Analyze 3 assemblies with documented recruitment:  
    - **Case 1:** Assembly using electoral roll (e.g., Ireland’s abortion CA) → Excluded homeless, non-citizens.  
    - **Case 2:** Assembly using census/residency data (e.g., Ostbelgien) → Excluded undocumented migrants.  
    - **Case 3:** Assembly using commercial address database → Class/age skew.  
  - Track whether exclusions were debated publicly or treated as technical.  
  - *Deliverable:* Comparative case report on "invisible exclusions."  

  **Months 7–9: Design Interventions**  
  - Prototype 2 responses:  
    - **A. Issue-Relative Frames:** For housing policy, sample from tenants + landlords + shelter registries + homeless outreach NGOs.  
    - **B. Meta-Sortition with Stopping Rules:** Randomly select a "frame design jury" from initial *minimal* frame (e.g., residency), with mandate to *expand* (not contract) inclusions. Stopping rule: Jury dissolves when consensus reached or 3 iterations.  
  - Test viability via interviews with 5 practitioners (e.g., OECD, Democracy R&D).  
  - *Deliverable:* Design brief for "contestable frames."  

  ---

  ### Possible Conclusions & Deciding Factors  
  1. **"Worse for Sortition" Confirmed:** If cases show frame exclusions are *less contested* than electoral franchises, and legitimacy claims depend on frame-invisibility.  
  2. **"Technically Solvable" Confirmed:** If meta-sortition/issue-relative frames resolve exclusion without regress, and practitioners adopt them.  
  3. **"Collapses into Demos Literature"**: If frame debates *explicitly* replicate franchise contests in practice (evidence: assembly records show vigorous frame disputes).  

  **Failure Condition:** Discovery that practitioners *already* treat frames as political (e.g., public hearings on sampling) negates "laundering" claim.  

  **Scope Check:** This is a *dissertation chapter* (not whole thesis). It bridges theory/practice but doesn’t resolve the "all-affected" problem—it asks *how* boundary decisions hide.  

  ---

  ### Non-Academic Deliverable: Frame Transparency Protocol  
  A practitioner toolkit for making exclusions visible and contestable:  
  1. **"Frame Impact Statement" Checklist:**  
     - Who does our frame exclude? (e.g., under-18s, non-citizen residents, institutionalized persons)  
     - Is exclusion justifiable *for this issue*? If not, what supplemental sources exist?  
  2. **Decision Procedure for Frame Selection:**  
     - Default: Start with maximal legal residency data.  
     - For contested boundaries: Mini-citizens’ panel (n=25) to advise on frame expansion.  
  3. **Legitimacy Narrative Script:**  
     - "This assembly represents [defined] group X. We excluded Y because [reason]. If you’re in Y, here’s how to input evidence."  

  **Answer to Funders:**  
  *"You’re paying a philosopher to study mailing lists because 80% of recruitment budgets fund them—and those lists silently exclude the marginalized groups your policies aim to help. If legitimacy collapses because ‘random’ selection isn’t random *for everyone*, the entire investment in deliberative democracy fails. I’m diagnosing the flaw and building a fix."*  

  ---  
  **Word Count:** 998 (fits 2 pages single-spaced)  
  This proposal leverages your seam-focused lens, avoids bibliography bloat, and offers a clear path to academic *and* practical outputs. If the frame problem is as critical as you suspect, this could anchor your dissertation’s contribution.
