prompt: |-
  Okay so context: I'm a third-year PhD student in political theory and I need to write a two-page proposal for a nine-month dissertation fellowship, and I want the proposal to be about something I've only got half-thought-through. Please act as a political theorist who works on democratic innovation (sortition, citizens' assemblies, the whole lottocratic family of proposals) but who has also spent real time around the practitioners who actually run these things — that combination is what I need, because I think the interesting version of my question lives right at the seam between the normative argument and the boring logistics. So: think carefully, and before you settle on a structure, brainstorm three or four different ways the project could be framed, then pick one and tell me why the others are worse. Be willing to tell me if this is a whole dissertation or a footnote.

  Here's the half-formed idea. I was at a small workshop last spring where someone from an assembly-organising outfit said, more or less in passing, that most of their recruitment budget goes on the mail-out, and that the list they mail to is basically whoever their contractor has addresses for. That's stuck with me ever since. The standard pitch for sortition is that random selection is impartial in a way voting isn't: nobody picks the winners, so no faction can rig the composition of the chamber, and you get descriptive representativeness for free. But a lottery has to draw from a sampling frame — an actual list of people — and building that list is a political act that randomness then launders. If the frame is the electoral roll, or a commercial address database, or a residency register, then non-citizen residents, prisoners, people without fixed addresses, long-term emigrants, and everyone under eighteen are simply not in the population being sampled from, and there is no stage of the procedure at which that shows up as a decision anyone made. I've been calling this the frame problem for sortition, and my suspicion — the thing I want the proposal to test — is that it's *worse* for sortition than it is for elections rather than better: with voting, the franchise is at least an openly contested political question that can itself be voted on, whereas the sampling frame arrives as a technical input, and the epistemic and legitimacy arguments for sortition both seem to quietly help themselves to a boundary decision that the theory has no resources to make.

  What I want from you is a proposal document, not an essay defending a conclusion. Specifically: state a precise question (my first pass is something like — is the frame problem a fixable technical defect in sortition, solvable by better list construction, stratified sampling and post-hoc weighting, or does it reveal that sortition's advantage over voting was always conditional on a prior answer to the boundary question, so that the two mechanisms differ less in kind than in where they hide the discretion?); say why the obvious answers don't settle it, including a proper steelman of the reply I keep getting from friends, which is that representativeness is only ever representativeness of the enrolled population, that we already accept the electoral roll as the demos for elections, and so sortition inherits exactly the same boundary problem and no more — if that reply is right my chapter collapses into the general all-affected / who-is-the-demos literature and I want to know that now; lay out the method month by month for nine months (I'm imagining: reconstruct the argument for sortition premise by premise and locate exactly which premise the frame is doing work in; then two or three close cases of real assemblies where the recruitment pipeline is documented well enough to see what the frame excluded and whether anyone noticed; then a design response, which for me is the fun part — I've been toying with issue-relative frames, where the sampled population changes with the policy domain, so housing policy samples tenants and landlords and unhoused residents rather than the citizenry at large, and long-horizon environmental decisions sample alongside some kind of designated proxy for people who don't exist yet, and also with meta-sortition, i.e. randomly selecting whoever builds the frame, which I suspect hits a regress unless you can say non-arbitrarily where the recursion stops); tell me what the possible conclusions are and what would decide between them; and give me an honest failure condition as well as a scope check.

  Two last things. I know the literature well enough and I'll fill in all the citations myself, so please don't give me a bibliography or a reading list or anything that depends on looking things up — argue from the positions and arguments directly, and where you need a real example of an assembly, use it loosely rather than fencing me in with details I'd have to check. And I'd like a deliverable that isn't only academic: if the design response works, what would it actually look like for someone deciding how to constitute a real body next year — a decision procedure for choosing a frame, maybe, plus a checklist of who the frame silently drops — and what would I say if a funder asked why they should pay a philosopher to think about mailing lists?
