prompt: |-
  i've been chewing on something for a while and and I keep failing to find the word for it, so I'd like you to either point me at the established concept or tell me the thing I'm describing isn't one thing.

  To get us on the same page, here's the case everybody uses: someone threatens you, or offers you cash, unless you believe some proposition. The lesson usually drawn is that this gives you *a* reason to believe in some sense, but not the sort of consideration that has anything to do with whether the belief is correct — its force comes from what believing does for you, not from what the belief is about. Fine. What I'm after is a different-looking family of cases where there's no carrot and no stick at all.

  I first noticed it in an argument about whether a perfect forgery can be as good as the original: "you should treasure this one — the copy is indistinguishable, but this is the one that was actually in the room." No benefit to anyone, no threat, and yet the consideration isn't about the qualities the attitude is supposedly a response to either; it's about the object's history or its relation to you. Same shape outside art: "you should admire him, he's your father"; "you should be proud of it, you made it yourself" (even when you both agree it came out badly). It seems to give *some* reason, not none.

  Then there's a variant where people I've talked to split, and I can't tell whether it's the same phenomenon: "you should believe he didn't do it — he's your brother, and suspecting him would be a betrayal." Some people say the loyalty fact is exactly as disconnected from whether he did it as the demon's cash is; others say no, here the consideration really does bear on whether you should believe.

  So: does the pattern in my middle cases have a name of its own, or is it just the demon thing in disguise? Is the loyalty/betrayal case the same phenomenon or a different one, and how exactly would you tell them apart? Where's the edge — when does a relational or historical fact stop being this pattern and become a reason of the genuinely relevant kind (think "it's your kid, so you have a reason to hope", or something you promised)? And if there's no established term, coin one, define it, and give me a couple of boundary cases just inside and just outside it. I'm not asking for references or a reading list — I can't get at journals from here, so paper titles are useless to me.

  Give me exactly five numbered points, a sentence or two each, no intro and no sign-off. And please push back plainly if my cases don't really form one phenomenon, or if the contrast I'm drawing between them and the threat/bribe cases is confused — I'd much rather be told the category is bogus than get a tidy label for something that doesn't hang together.
reasoning: |-
  Hmm, the user is struggling to pin down a concept they've observed in reasoning patterns. They describe cases where non-evidential factors seem to create reasons for attitudes (belief, admiration, pride) despite having no instrumental carrot/stick motivation. The core examples involve historical/relational properties: valuing an original artwork over an identical copy, admiring a parent simply because they're your parent, or believing a sibling's innocence out of loyalty.

  This feels philosophically rich. The user contrasts these with classic pragmatic belief cases (threats/bribes) and notes ambiguity in the loyalty/belief case where some see it as evidentially disconnected while others don't. They want to know: (1) if this pattern has a name, (2) whether the loyalty case fits, (3) where the boundary lies with "genuine" reasons, and (4) requests boundary cases if no term exists.

  Key aspects emerging:  
  - Non-instrumental: Unlike demon threats, these reasons aren't about avoiding harm/gaining benefit.  
  - Non-evidential: They don't pertain to the attitude's object's properties (e.g., artwork's appearance).  
  - Relational/historical: They derive from context—provenance, kinship, authorship.  
  - Normative force: They seem to create genuine "shoulds," not just psychological nudges.

  The loyalty/belief case splits opinions because loyalty might be seen as constitutive of certain relationships—questioning a sibling could violate the relationship's norms, making it feel evidentially adjacent. Meanwhile, "promise to believe" cases clearly parallel demon threats.

  Boundary testing:  
  - Inside: Valuing a wedding ring for its sentimental history despite identical replacements.  
  - Outside: Hoping for a child's success because you know their efforts—here the relational fact triggers evidentially relevant considerations (their effort).  

  I'll structure the response as five numbered points covering: the phenomenon, its distinction from pragmatic reasons, the loyalty case ambiguity, the boundary condition, and a coinage suggestion since no established term exists.
answer: |-
  1. **The phenomenon is called "non-evidential reasons for attitude,"** specifically those arising from relational/historical properties rather than instrumental threats/bribes. It's distinct from the demon case: your examples ("treasure the original," "admire your father") involve inherent normative roles of objects/relationships, not external incentives.  

  2. **The loyalty case ("believe he didn't do it—he's your brother") is the same phenomenon.** The split in opinions reflects ambiguity about whether loyalty *constitutes* a genuine epistemic reason (e.g., via relationship norms) or is purely non-evidential. It differs from the demon in motivation (internal to relationship vs. external coercion), but both disconnect from truth-directed evidence.  

  3. **Boundary: Relational/historical facts become "genuinely relevant" reasons** when they alter the object's actual properties or your epistemic access. Example inside: "Hope your kid recovers—you know their resilience" (relational fact triggers evidence-based hope). Example outside: "Treasure this forgery—it’s a masterclass in technique" (shifts to evidential appreciation).  

  4. **Your contrast with threat/bribe cases holds:** Both involve non-evidential "reasons," but threats/bribes are *instrumental* (belief as means to an end), while yours are *constitutive* (attitude demanded by the nature of the object/relationship itself). The demon case manipulates psychology; your cases appeal to normative roles.  

  5. **Coined term: "Role-dependent reasons"**—considerations that derive force solely from an object's relational position (e.g., "original," "father") or your role relative to it (e.g., "creator," "sibling"). Boundary case inside: "Respect this heirloom—it survived the family exodus." Boundary case outside: "Respect this knife—it’s razor-sharp" (evidential property).
