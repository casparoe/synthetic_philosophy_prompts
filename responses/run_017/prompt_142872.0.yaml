  Surprisingly, their voidness argument for self-enslavement (b) holds up well - it's anchored in agency preservation rather than fluctuating consent, so it coheres with (a) and (c). The recapitulation condition (g) is clever but fragile; I wonder if they've considered how linguistic articulation might dissociate from decision-making capacity in certain impairments. 

