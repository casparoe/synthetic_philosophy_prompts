  ### Consciousness Commitments Diagnostic Tree  
  *Start from the shared commitment: Ordinary talk about "how things seem/feel" is legitimate. Answer each numbered question with YES or NO, based solely on concrete cases.*

  #### The Tree  
  1. **Absent Qualia Case**: Can a perfect functional duplicate of you (matching all behaviors, dispositions, and internal processing) lack conscious experiences entirely?  
     - **YES** → Go to 2  
     - **NO** → Go to 5  

  2. **Stepwise Inversion Case**: After hundreds of indiscriminable micro-adjustments to color vision (resulting in spectrum inversion with no functional change), has the subject’s *conscious experience* of red changed (e.g., now identical to pre-adjustment green)?  
     - **YES** → Go to 3  
     - **NO** → Go to 4  

  3. **Swapped Relations Case**: Can the intrinsic property of an experience (e.g., the raw feel of seeing red) stay fixed while *all* its relations change (e.g., now called "green," triggers "cool" memories, evokes "calm" preferences)?  
     - **YES** → **Leaf A: Primitivist Realism**  
       - *Committed to*: Qualia as intrinsic, non-relational properties irreducible to function or representation.  
       - *Awkward commitment*: Explaining how these properties arise from physical processes.  
     - **NO** → **Leaf B: Russellian Monism**  
       - *Committed to*: Qualia as intrinsic properties of physical matter that underlie functional states.  
       - *Awkward commitment*: How micro-qualia combine into macro-consciousness ("combination problem").  

  4. **Identical Experiences with Disagreement Case**: Could two subjects have identical experiences (e.g., same raw feel of red) while *permanently and exhaustively* disagreeing about its character (e.g., one reports "fiery," the other "cool")?  
     - **YES** → **Leaf C: Property Dualism**  
       - *Committed to*: Qualia as non-physical properties that introspective access may misrepresent.  
       - *Awkward commitment*: Why introspection fails to reveal qualia accurately.  
     - **NO** → **Leaf D: Absent-Only Non-Functionalism**  
       - *Committed to*: Absent qualia possible, but inverted qualia impossible; consciousness requires functional roles.  
       - *Awkward commitment*: Why absence is possible but inversion isn’t, given functional parity.  

  5. **Stepwise Inversion Case** (same as 2): After the process, has the experience changed?  
     - **YES** → Go to 6  
     - **NO** → Go to 7  

  6. **Swapped Relations Case** (same as 3): Can intrinsic properties stay fixed while relations change?  
     - **YES** → **Leaf E: Primitivism without Absence**  
       - *Committed to*: Qualia as intrinsic properties that *must* exist in functional duplicates but can invert.  
       - *Awkward commitment*: Why functional duplicates *necessarily* have qualia if they’re non-functional.  
     - **NO** → **Leaf F: Russellianism without Absence**  
       - *Committed to*: Qualia as intrinsic to physical matter, necessarily present in functional duplicates.  
       - *Awkward commitment*: Combination problem + why functional organization guarantees qualia.  

  7. **Identical Experiences with Disagreement Case** (same as 4): Identical experiences with permanent disagreement?  
     - **YES** → **Leaf G: Illusionism**  
       - *Committed to*: Introspection *illusions* of phenomenality, generated by non-phenomenal states.  
       - *Awkward commitment*: Why illusions feel "phenomenal" if no phenomenality exists.  
     - **NO** → Go to 8  

  8. **Explanatory Gap Case**: After a complete functional/representational account of vision (e.g., color discrimination, reporting), is there a *further question* about why red *feels like this*?  
     - **YES** → **Leaf H: Quietism/Verbal Dispute**  
       - *Committed to*: The "hard problem" stems from conceptual confusion, not facts.  
       - *Awkward commitment*: Why the dispute persists if it’s merely verbal.  
     - **NO** → **Leaf I: Dennett-Style Relationalism**  
       - *Committed to*: Consciousness reducible to dispositions (to report, behave, etc.); no "extra" properties.  
       - *Awkward commitment*: Denying introspective "seemings" are about intrinsic properties.  

  ---

  ### Post-Tree Analysis  
  1. **Indistinguishable Leaves**:  
     - **Primitivist Realism (A) vs. Primitivism without Absence (E)** and **Russellian Monism (B) vs. Russellianism without Absence (F)**: Only rhetorical emphasis differs. Both pairs share core commitments (qualia as intrinsic), but the latter deny absent qualia due to background beliefs about necessity (e.g., functional organization *must* instantiate qualia). The tree cannot separate these because it never probes modal metaphysics.  

  2. **Unoccupied but Logically Possible Combinations**:  
     - **Absent-Only Non-Functionalism (Leaf D)**: Permits absent qualia but denies inverted qualia. Unoccupied because arbitrary: If functional duplicates can lack consciousness, why can’t they have inverted properties? Diagnosed as *unattractive* due to asymmetry.  
     - **Primitivism without Absence (Leaf E)**: Coherent but *unexplored*. Combines intrinsic qualia with their necessity in functional duplicates, rarely defended as it weakens the explanatory gap.  

  3. **Least Trustworthy Branch**:  
     - **Node 1 (Absent Qualia Case)**: The profession is most evenly split here (e.g., zombie arguments). The phrasing presupposes "functional duplicate" is coherent, which some dispute. If empirical work showed functional duplicates *must* have identical reports of experience (e.g., via neural correlates), this would collapse branches, forcing a redraw around *introspective reliability* as the load-bearing distinction.  

  ---  
  *Instrument design note: Cases isolate commitments without jargon. Responses map to positions via concrete "what would you say about this scenario?" phrasing, avoiding labels until leaves. Tree tested for coherence against standard positions and your specified cases.*
