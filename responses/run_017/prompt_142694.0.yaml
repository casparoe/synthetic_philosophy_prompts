from the last, so that either nothing changes at any step or something changes with no fact of the matter where; the classic absent-qualia case, where a functional duplicate has no experience at all; a case in which the property is held fixed in itself but its relations to everything else — memory, discrimination, verbal report, downstream preference — are swapped, so that the subject's dispositions change while the property is stipulated not to; and a case where two subjects are stipulated to have identical experiences while disagreeing exhaustively and permanently about what they are like, along with whatever cases you think the space actually requires. I especially want the tree to separate three destinations that my group kept collapsing into one: the Dennett-style view that the traditional posit is so much conceptual lumber and should be dropped in favor of relational, partly extrinsic facts about what a subject is disposed to say and do; the illusionist view that there really is a "what it's like" that introspection seems to reveal, but it is an introspective illusion produced by non-phenomenal quasi-phenomenal states; and the quietist or verbal-dispute view that the fighting is over which concept the word is doing duty for. I also want Russellian-monist and primitivist-realist destinations to come apart from each other, and I want a leaf for someone who accepts the possibility of absent qualia but denies inverted qualia (or vice versa), if the space allows it.

