  ### Engineered Case: Dispositional Gate in Windfall vs. Request

  #### Scenario
  A stranger tosses a fair coin, observes the outcome (unknown to you), and spends an hour assessing whether you would hand over $1,000 if asked, forming a read ("would" or "wouldn't") with 70% accuracy. Later, the stranger may arrange a windfall transfer of $W to your bank account and/or approach you for $1,000. The windfall occurs before the request; your payment has no causal effect on the windfall. You are now approached (request made). In **Setting A**, the windfall occurs iff the coin lands heads *and* the read says "would hand over"; the request is made iff the coin lands tails. In **Setting B**, the windfall occurs iff the coin lands heads; the request is made iff the read says "would hand over" XOR the coin lands heads (i.e., request made if (read="would" AND tails) OR (read="wouldn't" AND heads)). Stakes are ordinary: \(W = 3000\), and you start with sufficient funds. Accuracy is fixed at 0.7; no other mechanisms.

  ---

  #### Verdicts with Arithmetic

  **Setting A (Windfall Depends on Read)**  
  - **CDT & EDT: Refuse**  
    - *CDT*: Intervention on action breaks dependencies. Given request made (so coin=tails), windfall absent regardless of action. Paying loses $1,000; refusing costs $0. Expected utility (EU): Pay = \(-1000\), Refuse = \(0\).  
    - *EDT*: Conditional on action and request made. Windfall absent (tails), so payment only evidences disposition, but no windfall to affect. EU(Pay) = \(-1000\), EU(Refuse) = \(0\).  

  - **FDT: Pay**  
    - Evaluates counterfactual of decision procedure output. EU depends on global branches:  
      - If procedure outputs Pay:  
        Heads (P=0.5): Windfall if read="would" (P=0.7), so EU = \(0.7 \times 3000 = 2100\); no windfall if read="wouldn't" (P=0.3), EU=0. Request not made, so no payment.  
        Tails (P=0.5): Windfall absent. Request made, pay $1,000. EU = \(-1000\).  
        Total EU(Pay) = \(0.5 \times (0.7 \times 3000) + 0.5 \times (-1000) = 1050 - 500 = 550\).  
      - If outputs Refuse:  
        Heads: Windfall if read="would" (P=0.3), EU=\(0.3 \times 3000 = 900\); else EU=0.  
        Tails: EU=0 (no payment).  
        Total EU(Refuse) = \(0.5 \times 900 = 450\).  
      - \(550 > 450\), so FDT pays. Ratio: \(550 / 450 \approx 1.22\) (within 1.2–2).

  **Setting B (Request Depends on Read)**  
  - **CDT & EDT: Refuse**  
    - *CDT*: Intervention on action. Conditioned on request made, with uniform prior over type (P(pay-type)=0.5, P(refuse-type)=0.5):  
      - Cases: Heads and read="wouldn't" (P=0.5, EU=\(3000 - 1000\) if pay, \(3000\) if refuse); Tails and read="would" (P=0.5, EU=\(-1000\) if pay, \(0\) if refuse).  
      - EU(Pay) = \(0.5 \times 2000 + 0.5 \times (-1000) = 500\); EU(Refuse) = \(0.5 \times 3000 = 1500\).  
    - *EDT*: Conditional on action and request made:  
      - If pay: Evidences pay-type → P(heads and read="wouldn't" | pay, request) = 0.3, EU=\(0.3 \times 2000 + 0.7 \times (-1000) = -100\).  
      - If refuse: Evidences refuse-type → P(heads and read="wouldn't" | refuse, request) = 0.7, EU=\(0.7 \times 3000 = 2100\).  
      - \(-100 < 2100\).  
    - Both refuse. Verdict identical to Setting A (refuse).

  - **FDT: Refuse**  
    - Evaluates decision procedure:  
      - If Pay:  
        Heads (P=0.5): Request if read="wouldn't" (P=0.3), EU=\(3000 - 1000 = 2000\); no request (P=0.7), EU=\(3000\).  
        Tails (P=0.5): Request if read="would" (P=0.7), EU=\(-1000\); no request (P=0.3), EU=\(0\).  
        EU(Pay) = \(0.5 \times (0.3 \times 2000 + 0.7 \times 3000) + 0.5 \times (0.7 \times (-1000)) = 0.5 \times (600 + 2100) + 0.5 \times (-700) = 1350 - 350 = 1000\).  
      - If Refuse:  
        Heads: EU=\(3000\) (windfall, no payment, regardless of request).  
        Tails: EU=\(0\) (no windfall, no payment).  
        EU(Refuse) = \(0.5 \times 3000 = 1500\).  
      - \(1500 > 1000\), so FDT refuses.

  ---

  #### Feature and Case Comparisons
  - **Feature Doing the Work**: Attachment of the read to the windfall (unexperienced branch) vs. the request (experienced branch). In Setting A, FDT pays because the read affects windfall in the counterfactual heads branch. In Setting B, FDT refuses because the read affects request occurrence in a way that makes paying net harmful.  
  - **Comparison**:  
    - Setting A resembles **Counterfactual Mugging**: Payment in tails branch benefits the counterfactual heads branch (windfall), but *differs* as the windfall depends on the read (disposition) rather than a direct link.  
    - Setting B resembles **XOR Blackmail**: Request occurs based on XOR of read and coin, but *differs* as no blackmailer exploits the agent; the structure is emergent.  

  ---

  #### Tipping-Point Computation
  - **FDT Flip in Setting A**: FDT pays if \((2p - 1)W > 1000\) (from EU(Pay) > EU(Refuse): \(0.5pW - 500 > 0.5(1-p)W\)).  
    - At accuracy \(p=0.7\), flip at \(W = 1000 / (2 \times 0.7 - 1) = 1000 / 0.4 = 2500\).  
    - With \(W=3000 > 2500\), FDT pays (ratio 1.22 > 1).  
  - **Changes**:  
    - If accuracy drops below \(p=0.625\) (for \(W=3000\)), FDT flips to refuse: \((2 \times 0.625 - 1) \times 3000 = 0.25 \times 3000 = 750 < 1000\).  
    - If windfall unconditional on read (windfall iff heads), FDT refuses: EU(Pay) = \(0.5 \times 3000 - 500 = 1000\), EU(Refuse) = \(0.5 \times 3000 = 1500\).  

  ---

  #### Strongest Objection and Reply
  - **Objection (Causal/Evidential Theorist)**: FDT covertly reruns an *ex-ante* calculation after the coin is settled. In Setting A, the agent knows they are in tails (windfall gone) and cannot influence the heads branch. Paying $1,000 sacrifices real money for a counterfactual benefit, mistaking correlation (with the read) for influence.  
  - **Reply**: FDT selects the decision procedure *ex ante* (before the coin toss), maximizing global EU. The procedure’s output affects the read and thus the windfall in heads. The agent implements the procedure, ensuring consistency across branches.  
  - **Surviving Part**: The objection highlights that FDT’s *ex-ante* norm may conflict with *ex-post* rationality (caring about an unexperienced branch). If one rejects global optimization post-update, FDT seems irrational.  

  ---

  #### What the Case Cannot Show
  1. **Human Implementation**: Whether unmodified humans can consistently follow FDT’s policy (e.g., paying in Setting A despite knowing the windfall is gone).  
  2. **Accuracy Calibration**: Real-life accuracy estimates are uncalibrated; the case assumes precise \(p=0.7\), but results are sensitive to this.  
  3. **Normative Justification**: Whether FDT is "correct"; the case only isolates a structural divergence.  
  4. **Robustness to Noise**: Dependence on strict independence (read ⊥ coin | decision procedure) may not hold with real predictors.  
  5. **Broader Applicability**: How theories handle sequential decisions, learning, or ambiguity.  
  6. **Non-Monetary Goods**: Stakes are purely monetary; cannot show effects with moral or social values.
