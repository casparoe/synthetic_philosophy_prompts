  What the case cannot show:

  1. Whether an unmodified human can implement the FDT policy: The FDT agent in Setting A pays even though they are in the tails branch and know they are in the tails branch. This requires the agent to take a loss to benefit a counterfactual branch. Humans are often myopic and might not be able to commit to such policies.

