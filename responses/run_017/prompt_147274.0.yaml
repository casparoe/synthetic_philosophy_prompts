  Objection (from CDT/EDT): FDT is taking an ex-ante perspective after the coin is tossed. The coin is already tossed, so the agent is either in the heads branch or the tails branch. In Setting A, the agent is in the tails branch and the windfall is already gone (because the coin is tails). Therefore, the agent should not sacrifice their own money to benefit the heads branch, which is a counterfactual branch that they are not in. FDT is effectively allowing the agent to pay to "make it true" that they are the type that would pay, so that in the heads branch they would have gotten the windfall. But the heads branch is already fixed: either the windfall occurred or it didn't. The agent's action now cannot change that. Therefore, FDT is smuggling in an ex-ante perspective after the coin is tossed.

