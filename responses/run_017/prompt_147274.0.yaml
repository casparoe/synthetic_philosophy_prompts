  3. The case assumes that the predictor's read is independent of the coin given the agent's decision procedure. In real life, there might be common causes or noise that break this independence.

  4. The case cannot show that FDT is rational. It only isolates a structural difference and shows how the theories diverge.

  5. The case does not address whether FDT can be implemented in sequential settings where the agent might learn more information.

  Now, let's write the entire case as required.

  **The Scenario:**

  A stranger, after having tossed a fair coin and observed the outcome, spends an hour with you to form a read (accurate with probability 0.7) about whether you are the sort of person who would hand over $1,000 in cash if asked. Later that afternoon, the stranger may or may not arrange a windfall transfer of $3000 to your bank account and may or may not approach you to request $1,000. The windfall transfer, if it occurs, happens before the request. In Setting A, the windfall occurs only if the coin landed heads and the read says you would hand over the money; the request is made only if the coin landed tails. In Setting B, the windfall occurs if the coin landed heads; the request is made only if the read says you would hand over the money XOR the coin landed heads (that is, the request is made if either the read says you would and the coin is tails, or the read says you wouldn't and the coin is heads). You are now being approached (so the request is made). You must decide whether to pay $1,000 or refuse. Your action has no causal effect on the windfall, which has already been either transferred or not.

  **Verdicts with Arithmetic:**

  *Setting A:*

  - **CDT and EDT**: Both refuse. 
    - Reasoning: The windfall did not occur (since request made implies tails, and windfall requires heads). Paying causes a loss of $1000 with no compensating gain. Refusing costs nothing. So both have expected utility 0 for refusing and -1000 for paying.
  - **FDT**: Pays.
    - Reasoning: 
        EU(pay) = 0.35 * 3000 - 500 = 1050 - 500 = 550
        EU(refuse) = 0.15 * 3000 = 450
        550 > 450, so pays.

  *Setting B:*

  - **CDT**: Refuses.
    - Reasoning: With prior probability 0.5 for each case (since the agent uses a uniform prior over their type), the expected utility of paying is 0.5*(3000-1000) + 0.5*(-1000) = 1000 - 500 = 500. The expected utility of refusing is 0.5*3000 = 1500. 1500>500.
  - **EDT**: Refuses.
    - Reasoning: 
          EU(pay) = 0.3*3000 - 1000 = 900 - 1000 = -100
          EU(refuse) = 0.7*3000 = 2100
          2100 > -100.
  - **FDT**: Refuses.
    - Reasoning:
          EU(pay) = 0.5*3000 - 500 = 1500 - 500 = 1000
          EU(refuse) = 0.5*3000 = 1500
          1500>1000.

  **Which Feature is Doing the Work and Comparison to Known Cases:**

  The feature is whether the predictor's read (which depends on the agent's disposition) is used to determine the windfall in the unexperienced branch (Setting A) or to determine the occurrence of the request in the experienced branch (Setting B). Setting A resembles the counterfactual mugging: the agent pays in the tails branch to ensure the windfall would have occurred in the heads branch. Setting B resembles XOR blackmail: the agent's disposition affects whether they are blackmailed in a way that is unprofitable. The two settings differ in that in counterfactual mugging the payment is for the benefit in a counterfactual branch, while in XOR blackmail the payment is demanded in a way that is correlated with the agent's disposition and the state of the world.

  **Tipping-Point Computation:**

  For FDT in Setting A, the tipping point occurs when (2p-1)W = 1000. With p=0.7 and W=3000, (2*0.7-1)*3000=0.4*3000=1200>1000, so FDT pays. If accuracy p drops below 0.5, FDT never pays in Setting A. If the windfall is made unconditional on the read (i.e., occurs on heads regardless), then FDT would refuse in Setting A because the windfall would occur independently of the agent's disposition.

  **Strongest Objection and Reply:**

  Objection: FDT is illicitly re-running an ex-ante calculation after the coin is settled. In Setting A, the agent is in the tails branch and knows the windfall is gone. Paying $1000 cannot cause the windfall to occur, so it is irrational to pay. FDT is buying a correlation with a prediction the agent cannot influence at the time of decision.

  Reply: FDT chooses the decision procedure that maximizes expected utility from the ex-ante perspective. The agent's decision procedure was fixed before the coin toss and affects the predictor's read, which in turn affects the windfall in the heads branch. The agent now is merely implementing that procedure. The objection assumes that the agent should only care about their current branch, but FDT holds that the agent should care about all branches that their decision procedure affects.

  Honest Note: The objection survives in that if one rejects the ex-ante perspective after learning which branch one is in, then FDT's action in Setting A seems irrational.

  **What the Case Cannot Show:**

  - Whether unmodified humans can implement the FDT policy (paying in Setting A) because it requires sacrificing immediate, certain money for the sake of a counterfactual branch.
  - How much of the result depends on the accuracy estimate, which in real life is uncalibrated and uncertain.
  - Whether FDT is the correct theory of rationality, as the case only isolates a structural difference.
  - Whether the predictor's read is truly independent of the coin toss in practice.
  - How the theories would behave if the agent had the opportunity to learn more information or if there were sequential interactions.
