     3. Only slow learning and expertise reshape what you see: long-term changes, not immediate cognitive states.
     4. Beliefs get in, but only to make experience more accurate (e.g., when beliefs are true).
     5. Beliefs get in either way, accurate or not.
     6. Perception just is inference: priors are integral, so cognitive states always influence experience.
     7. Deflationary: the debate is verbal; there's no substantive difference.

