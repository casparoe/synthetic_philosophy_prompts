  Below is a sorting tree designed to distinguish positions on cognitive penetrability through case-based questions, avoiding overused examples and focusing on empirical distinctions. Each branch uses a **triple (Viewer A, Viewer B, False-Belief Variant)** to isolate specific perceptual mechanisms. Ten branch questions are included, followed by leaf positions with their key commitments. Cases are drawn from diverse, less-cited research (e.g., affordances, linguistic priming, sensorimotor effects).

  ---

  ### **Branch Questions**  
  Each question compares two viewers differing *only* in a cognitive state (belief, expectation, training) and includes a variant where the cognitive state is **false** (to separate accuracy-driven effects from genuine penetration).

  1. **Spatial Affordance (Size Perception)**  
     - *Viewer A:* Believes a handle is graspable (due to prior experience).  
     - *Viewer B:* Believes it is decorative (non-graspable).  
     - *False-Belief Variant:* Handle is actually too small to grasp.  
     **Question:** Does the handle *visually appear larger* to Viewer A? (Controls for attention/eye movements.)  

  2. **Linguistic Priming (Color Discrimination)**  
     - *Viewer A:* Hears the word "sunset" (priming warm colors).  
     - *Viewer B:* Hears "ocean" (priming cool colors).  
     - *False-Belief Variant:* The image contains no sunset/ocean (e.g., abstract shapes).  
     **Question:** Does Viewer A report *more reddish hues* in a monochrome orange shape?  

  3. **Sensorimotor Expertise (Motion Perception)**  
     - *Viewer A:* Trained juggler (predicts object trajectories).  
     - *Viewer B:* Novice.  
     - *False-Belief Variant:* Objects violate physics (e.g., abrupt mid-air stops).  
     **Question:** Does Viewer A *see smoother motion paths* despite violations?  

  4. **Attentional Salience (Pop-Out Effect)**  
     - *Viewer A:* Told a rare symbol (e.g., **∇**) is worth money.  
     - *Viewer B:* Told it is irrelevant.  
     - *False-Belief Variant:* The symbol is absent.  
     **Question:** Does **∇** *stand out more forcibly* in a cluttered array for Viewer A?  

  5. **Temporal Binding (Audio-Visual Synchrony)**  
     - *Viewer A:* Expects a beep to align with a flash (due to prior cues).  
     - *Viewer B:* No expectation.  
     - *False-Belief Variant:* Beep is delayed by 300ms.  
     **Question:** Does Viewer A *perceive the flash as delayed* to match the beep?  

  6. **Conceptual Load (Detail Discrimination)**  
     - *Viewer A:* Memorizes a number during the task.  
     - *Viewer B:* No memorization.  
     - *False-Belief Variant:* The number is irrelevant to stimuli.  
     **Question:** Can Viewer A *discriminate fine details* (e.g., texture gradients) as accurately?  

  7. **Emotional Valence (Brightness Contrast)**  
     - *Viewer A:* Shown a face labeled "trustworthy."  
     - *Viewer B:* Shown "suspicious."  
     - *False-Belief Variant:* Labels are randomized/arbitrary.  
     **Question:** Does the face *appear brighter* to Viewer A?  

  8. **Cultural Training (Illusion Susceptibility)**  
     - *Viewer A:* From a culture with circular architecture (e.g., Yupik).  
     - *Viewer B:* From rectilinear-architecture culture (e.g., Dutch).  
     - *False-Belief Variant:* Illusion uses neutral shapes (no cultural cues).  
     **Question:** Is Viewer A *less susceptible* to the "bent line" illusion?  

  9. **Procedural Priming (Ambiguous Figures)**  
     - *Viewer A:* Performs a twisting hand motion before viewing.  
     - *Viewer B:* Performs a tapping motion.  
     - *False-Belief Variant:* The figure is unambiguous (e.g., clearly a cube).  
     **Question:** Does Viewer A *see more spiral interpretations* in a helix-like figure?  

  10. **Predictive Coding (Tactile Sensitivity)**  
      - *Viewer A:* Expects a vibration on the left hand (cued by sound).  
      - *Viewer B:* Expects it on the right.  
      - *False-Belief Variant:* Vibration occurs on the *uncued* hand.  
      **Question:** Does Viewer A report *stronger intensity* on the expected hand?  

  ---

  ### **Leaf Positions**  
  Based on answers to branches, sort into one leaf. Each leaf includes a one-sentence "awkward commitment" (its hardest-to-defend implication).

  1. **Strict Encapsulation**  
     - *Commitment:* Must deny *all* top-down effects (even in false-belief variants) as post-perceptual bias.  
  2. **Cognition Orchestrates Attention Only**  
     - *Commitment:* Must argue changes in "what it's like" (e.g., brightness, size) are *solely* from where/when you look.  
  3. **Only Slow Learning/Expertise Reshapes Perception**  
     - *Commitment:* Must reject immediate belief effects (e.g., linguistic priming) as "judgment," not experience.  
  4. **Beliefs Penetrate Only for Accuracy**  
     - *Commitment:* Cannot explain why *false* beliefs alter experience (e.g., sensorimotor violations) without calling it malfunction.  
  5. **Beliefs Penetrate (Accurate or Not)**  
     - *Commitment:* Accepts that false beliefs can distort perception (e.g., affordances), making it less adaptive.  
  6. **Perception as Inference (Priors All the Way Down)**  
     - *Commitment:* Blurs perception/cognition boundaries; e.g., calling *all* vision "guessing" (even simple edges).  
  7. **Deflationary (Verbal Debate)**  
     - *Commitment:* Argues "what it's like" reports are inherently unverifiable, making the debate non-empirical.  

  ---

  ### **Notes on Ambiguities & Gaps**  
  - **Hard-to-Pull-Apart Leaves:**  
    - **Beliefs Penetrate (Accurate or Not) vs. Perception as Inference:** Both predict effects in false-belief cases, but the latter insists *all* perception is inferential (e.g., early vision). Branch 6 (detail discrimination under load) may not resolve this.  
    - **Slow Learning vs. Deflationary:** Both deny immediate effects, but deflationism avoids commitments to mechanisms (calling it a "framing issue").  

  - **Unoccupied Answer Combinations:**  
    - **YES to early neural effects (Branch 5) + NO to false-belief effects (Branches 1,2,4,7,10):** *Unexplored* (no known theory claims penetration only occurs with accurate beliefs *and* shows in early processing).  
    - **NO to attentional effects (Branch 4) + YES to false-belief pop-out (Branch 2):** *Incoherent* (pop-out is attentional; denying attention shifts but claiming salience changes is contradictory).  
    - **YES to slow learning (Branch 3) + NO to all immediate effects (Branches 1–10):** *Unattractive* (admits perceptual change via training but denies obvious attention/orchestration effects).  

  ---  
  This tree prioritizes empirical distinctions over labels, using novel cases to avoid cached debates. For your reading group, track answers to the 10 branches to assign positions, flagging ambiguous cases (e.g., "perception as inference" vs. "beliefs penetrate either way") for discussion.
