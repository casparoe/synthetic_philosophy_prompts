prompt: |-
  I am a novelist, and I need a reusable procedure rather than an explanation.

  The situation: I am two drafts into the third book of a sequence whose narrator alternates between two point-of-view characters. One of them was trained, before the events of the books, in a discipline I have modelled closely on Nāgārjuna's Madhyamaka — the four-cornered negation, emptiness as the absence of intrinsic nature rather than as nonexistence, the two truths, and the practice of arguing by consequences drawn from an interlocutor's own commitments rather than from theses of one's own. In the fiction the school goes by another name, but for our purposes call it Madhyamaka. Across the manuscript there are roughly thirty scenes in which this character is put a direct question by someone else: a question with a yes-or-no shape, or a question asking her to state what she holds. I have to write her answers one at a time, months apart, and I want them to be consistent without being interchangeable, and I want them to be dramatically usable rather than miniature lectures. My readers have no philosophy background; my editor has no patience; the answers should almost never run past forty words.

  What I have in mind is a decision procedure I can run in a few minutes on each of these scenes: the ordered questions to ask about the question she is being asked, what counts as a determinate answer at each step, and where the procedure terminates in one of a small number of permitted speech acts. As inputs it should take only what I can write down about the scene: what is literally asked, what the asker is trying to do (learn something, trap her, force a public commitment, be reassured), and what she has to be able to do next in the plot.

  My working understanding, so you can correct it if it is wrong: for a claim the four corners are affirmation, denial, both, and neither; the point of running through them is not to select a corner or to announce a fifth, but to show that the question has no determinate subject to be settled; and this is compatible with, indeed requires, a robustly conventional answer for ordinary purposes — whether the bridge is guarded, whether she intends to cross it. I am trying to keep three failure modes out of the manuscript: the reader hearing her as a nihilist for whom nothing matters; the reader hearing her as a mystic trading on contradiction for atmosphere; and the reader hearing her as simply evasive, which is the failure my editor is most likely to flag.

  Two complications I want built into the procedure rather than smoothed over. First, the school I have given her adds a permitted move to the four: answering inside the asker's convention while marking the answer as borrowed rather than owned, which in my draft notes I have been calling "the lent answer," and I want the procedure to say when that move is honest and when it is a dodge. Second, she has to go on acting: the procedure must say what happens to agency and to the plot's stakes once a character has refused all four corners, since a scene in which the correct answer is silence and the next beat requires a choice is a scene I still have to write.

  Please give me the procedure, with a worked application to each of three scenes I will describe: a soldier asking her whether the bridge is guarded; a former teacher asking her, in front of students, whether she believes the self survives death; and a hostile magistrate asking her to state, for the record, whether the order she disobeyed was wrong. Then apply the procedure to one further case of your own choosing in which it returns an answer that is dramatically inert or otherwise unusable, and tell me what I should conclude — that the scene is wrongly built, or that the procedure has reached the limit of what it can settle. Finally, a short statement of what the procedure cannot do: which decisions remain matters of craft and judgment no matter how carefully the philosophy is done, and whether the residue is a defect of the framework or a sign that the framework is being asked to do something it never claimed to do.
reasoning: |-
  We are creating a decision procedure for a Madhyamaka-trained character to answer yes-no or commitment-demanding questions in a way that is consistent, dramatically effective, and philosophically sound.

  The procedure must:
  - Avoid three failure modes: nihilism, mysticism, and evasion.
  - Incorporate the "lent answer" (borrowing the asker's convention and marking it as borrowed).
  - Account for the need to act and advance the plot.

  The procedure steps:

  1. **Identify the Question's Nature**:
     - What is the literal question? (Note: it may be a yes/no, or a request for a belief/commitment.)
     - What convention (or context) is the asker operating in? (e.g., everyday practical, metaphysical, legal, etc.)
     - What is the asker's intent? (e.g., to learn, trap, force commitment, reassure)
     - What are the immediate plot requirements? (What must the character do next? What action must be taken?)

  2. **Check for Conventional Practicality**:
     - Is the question about a matter of conventional truth that is necessary for practical action? (e.g., "Is the bridge guarded?" requires an answer to cross or not.)
     - If yes, then the character can give a conventional answer. But note: if the asker is operating in a context that the character recognizes as conventional and the answer is needed for action, then the lent answer is appropriate. However, if the context is metaphysical or if the question is about ultimate truth, then the lent answer might be a dodge.

  3. **Check for Traps**:
     - Is the question designed to trap the character into a commitment that would contradict her philosophy? (e.g., asking for a belief about the self, which is empty of intrinsic nature.)
     - If it is a trap, then the character must avoid the four corners and use a lent answer only if it can be clearly marked as conventional and if it does not entail a commitment to the inherent existence of the subject.

  4. **Determine the Possibility of a Lent Answer**:
     - The lent answer is honest when:
          a. The matter is conventional and practical.
          b. The answer is given within the asker's framework without endorsing that framework as ultimately real.
          c. The character explicitly or implicitly marks the answer as borrowed (e.g., "In your terms, ...", "For the purpose of crossing the bridge, ...", "Conventionally, ...").
     - The lent answer is a dodge when:
          a. The question is about ultimate truth and the character uses the lent answer to avoid the philosophical challenge (especially when the asker is seeking an ultimate truth answer).
          b. The context requires the character to take a stand on a matter that she must own for the plot to advance (e.g., a moral commitment that she cannot avoid without being evasive).

  5. **Check for the Need for Action**:
     - If the character must act, then she must choose a course of action that may imply a conventional stance. She can explain her action without endorsing inherent existence. For example, she might cross the bridge without believing in the inherent existence of the bridge, the guarding, or the action.

  6. **Crafting the Answer**:
     - If the question is about conventional reality and practical, use a lent answer and mark it.
     - If the question is about ultimate reality and the asker is seeking a commitment, then the character can:
          - Refuse to be trapped by showing the question has no determinate subject (using the four corners to deconstruct).
          - But then, if action is required, she must act based on convention without endorsing the inherent existence of the factors involved.
     - In some cases, the character might answer with an action (e.g., crossing the bridge) and then explain the conventional nature of the action.

  The procedure must result in one of the following permitted speech acts:

  A. **Lent Answer**: A conventional answer marked as such. (e.g., "As far as we need to be concerned for crossing, the bridge is guarded.")
  B. **Deconstruction**: Pointing out the lack of inherent nature in the subject of the question, thus showing the question is unanswerable in ultimate terms. (But note: this must be brief and dramatically effective, not a lecture.)
  C. **Action as Answer**: Performing an action that answers the question conventionally without words.
  D. **Silence**: Only when silence itself is a meaningful response and does not block the plot. (But note: if the plot requires action, then silence might not be an option.)

  However, note that silence might be interpreted as evasion. So it is to be used sparingly.

  Now, we apply the procedure to the three given scenes and one additional scene.

  ---

  **Scene 1: Soldier asking whether the bridge is guarded.**

  - Literal question: "Is the bridge guarded?"
  - Asker's intent: To learn a practical fact for action.
  - Convention: Everyday, practical.
  - Plot requirement: The character must decide to cross or not.

  Procedure:

  1. **Nature**: Practical, conventional.
  2. **Conventional Practicality**: High. The answer is needed for immediate action.
  3. **Trap?**: Unlikely. The soldier is seeking actionable intelligence.
  4. **Lent Answer**: Honest because it is conventional and practical. The character can mark it as such.
  5. **Need for Action**: The character must act (cross or not) based on the answer.

  **Answer**: Lent answer, marked. Example: "In the terms of our mission, yes, it is guarded. So we must find another way." (Note: under 40 words.)

  ---

  **Scene 2: Former teacher asking, in front of students, whether she believes the self survives death.**

  - Literal question: "Do you believe the self survives death?"
  - Asker's intent: To force a public commitment and possibly trap her (since the teacher knows her training and may expect her to avoid a metaphysical commitment).
  - Convention: Metaphysical, about ultimate truth.
  - Plot requirement: She must respond in a way that does not undermine her authority or alignment with the school, and she may wish to avoid alienating the students.

  Procedure:

  1. **Nature**: Metaphysical, about belief and ultimate truth.
  2. **Conventional Practicality**: Low. It's a theoretical question, but the setting (public, with students) makes it a challenge to her credibility.
  3. **Trap?**: Yes. If she answers yes or no, she would be committing to a view of the self as inherently existent. Both affirmation and denial are traps. Both, neither would be contradictory and might sound mystical.
  4. **Lent Answer**: Can she use it? The context is metaphysical and the teacher is asking for her belief. A lent answer might be a dodge because the students are looking for her own position. However, she can use a lent answer by shifting to the conventional level of belief in the context of the students' understanding? But note: the question is about her belief.

     Alternatively, she can deconstruct the question.

  5. **Need for Action**: She must respond to maintain her standing. Silence might be interpreted as not knowing or evasion.

  **Answer**: Since the question is about belief and the self (which is empty), she must avoid the four corners. She can deconstruct briefly and then give a lent answer for the conventional purpose (e.g., in the context of moral responsibility). But note: the teacher is asking for her belief. So:

     Option: Deconstruction + lent answer for conventional purposes.

     Example: "To ask whether the self survives death assumes a self that could be found now. Since no such self exists, the question does not arise. Yet, in the world of cause and effect, actions have consequences beyond death." (But this is a bit long.)

     Alternatively, a shorter version: "The self that you imagine surviving does not exist. But the consequences of actions continue." (This avoids the four corners and gives a conventional teaching.)

     However, note the requirement for 40 words. We must be concise.

     Let's try: "In ultimate truth, there is no self to survive. Conventionally, we act as if our actions have lasting consequences." (28 words)

     But the teacher asked for belief. So she might say: "I believe in the continuity of consequences, not in an unchanging self." (This is a lent answer in the conventional sense, but it does not directly answer the yes/no about survival. However, it is a way out.)

     However, note: the four-cornered negation on the self would be: we cannot say it exists, does not exist, both, or neither. So a direct answer is impossible. Therefore, the deconstruction is necessary.

     Final proposed answer: "The question assumes a self with inherent existence. Since that cannot be found, I hold no belief about its survival. But in the conventional world, we act with care for the future." (33 words)

     This avoids the four corners, deconstructs, and gives a conventional stance for action.

  ---

  **Scene 3: Hostile magistrate asking her to state, for the record, whether the order she disobeyed was wrong.**

  - Literal question: "Was the order wrong?" (or similar)
  - Asker's intent: To force a public commitment for the record, likely to condemn her or to use against her.
  - Convention: Legal and moral. The magistrate is operating in a framework of right and wrong as inherent properties.
  - Plot requirement: She must respond without incriminating herself or betraying her principles. She may also need to justify her disobedience.

  Procedure:

  1. **Nature**: Moral/legal, but the magistrate is treating right and wrong as inherent.
  2. **Conventional Practicality**: Medium. The context is legal, so a conventional answer is expected. However, she may not want to endorse the magistrate's framework.
  3. **Trap?**: Yes. If she says the order was wrong, she admits guilt for disobedience? (But note: she might have disobeyed for right reasons.) If she says it was not wrong, then she has no justification for disobedience. Also, the question assumes inherent wrongness.
  4. **Lent Answer**: Can she use it? She can give an answer in the magistrate's terms but mark it as conventional? The magistrate may not accept marking. Alternatively, she can deconstruct the idea of inherent wrongness but then must account for her action.

     Since she disobeyed, she must have acted for a reason. So she can explain her action without endorsing inherent properties.

  5. **Need for Action**: She must defend her action without falling into the trap.

  **Answer**: She cannot say the order was inherently wrong, because that would reify wrongness. But she must justify her disobedience. So:

     Option: Deconstruct the idea of inherent wrongness, then give a lent answer for the conventional reason for her action.

     Example: "Wrongness is not an intrinsic property of orders. However, in that situation, following the order would have caused great harm. Therefore, I chose to prevent harm." (28 words)

     This avoids the four corners (does not say the order was inherently wrong, not wrong, both, or neither) and instead focuses on the consequence (harm) and her choice to prevent it.

     Alternatively, if she wants to be more concise: "The order was not inherently wrong, but I acted to prevent harm that would have resulted from following it." (19 words)

     This is a lent answer for the conventional context (preventing harm is a conventional reason) and avoids the metaphysical trap.

  ---

  **Scene 4 (of my own choosing): A child asking, "Is my mother in heaven?"**

  - Literal question: "Is my mother in heaven?"
  - Asker's intent: To be reassured, to get comfort.
  - Convention: Religious, metaphysical, but also deeply emotional.
  - Plot requirement: The character must comfort the child without lying or endorsing a metaphysical view she does not hold.

  Procedure:

  1. **Nature**: Metaphysical and emotional. The child is seeking comfort, not a philosophical debate.
  2. **Conventional Practicality**: The need is for emotional support, not action per se.
  3. **Trap?**: Not intentionally, but any direct answer (yes, no, both, neither) would endorse the idea of heaven and the mother's inherent existence. Saying "no" would be cruel. Saying "yes" would be a lie from her philosophical view.
  4. **Lent Answer**: Can she use it? She can provide comfort in the child's terms without endorsing the metaphysics? But that might feel dishonest. Alternatively, she can shift to a conventional truth that is meaningful and comforting without affirming heaven.

     Example: "Heaven is a way we remember the love we had. And that love is real." (This avoids the metaphysical question and focuses on the conventional truth of love and memory.)

     However, note: the child is asking for a yes/no about the mother's current existence in heaven.

  5. **Need for Action**: She must comfort the child.

  **Answer**: The procedure might return a lent answer that is comforting and conventional but does not directly answer the yes/no. However, the child may insist. This is where the procedure might lead to an answer that is dramatically inert because the child might not be satisfied with a non-answer.

     Proposed: "Your mother lives on in the love you carry for her." (This avoids the four corners and is comforting, but it does not answer the literal question.)

     Why it might be unusable: The child might say, "But is she in heaven?" and the character would have to either repeat (which might feel evasive) or change the subject (which might feel dismissive). The procedure does not easily resolve this because the child's need is emotional and the character's philosophy does not allow her to affirm or deny heaven.

     **Conclusion**: The scene may be built in a way that the character's philosophy cannot provide the reassurance the child seeks without compromise. The procedure reaches its limit because the emotional need and the metaphysical question are intertwined in a way that the character cannot address without either violating her principles (by affirming) or causing pain (by denying or being evasive). This residue is a sign that the framework is being asked to do something it never claimed: to provide emotional comfort in a deeply conventional way without using the conventional terms. The character must then rely on compassion and skillful means, which might require a different approach than the strict procedure.

  ---

  **What the procedure cannot do**:

  1. **Handle emotional nuance automatically**: The procedure is logical and philosophical. It does not account for the emotional weight of a situation. The writer must judge when to bend the rules for the sake of compassion or relationship (like in the child scene).

  2. **Account for character development**: Over the course of the novel, the character might grow and change. The procedure is static. The writer must decide when the character might break from the procedure due to growth or extreme circumstances.

  3. **Replace dramatic judgment**: The procedure ensures philosophical consistency, but the dramatic impact (e.g., tension, character dynamics) must be judged by the writer. For instance, in the magistrate scene, the exact wording must convey defiance or resilience without being preachy.

  4. **Resolve all contradictions**: Sometimes the plot requires a choice that the philosophy cannot easily justify. The writer must then decide how the character reconciles this (or doesn't) and what that says about the character.

  The residue (what remains for the writer's judgment) is not a defect of the framework but a sign that the framework is being applied in a complex human context. The Madhyamaka philosophy is a tool for understanding, not a script for every situation. The writer must use it as a guide but also listen to the demands of the story and the characters.
answer: |-
  Below is a reusable decision procedure for crafting your Madhyamaka-trained character's answers to direct yes/no or commitment-demanding questions. The procedure avoids nihilism (nothing matters), mysticism (trading on contradiction), and evasion (dodging the question). It incorporates the "lent answer" (borrowing the asker's convention while marking it as provisional) and ensures agency/plot progression. It returns one of four permitted speech acts within 40 words. 

  ### **The Procedure**
  Run these steps in order for each scene. Stop at the first determinate answer. Inputs: (1) literal question, (2) asker's intent (learn, trap, force commitment, reassure), (3) plot requirement (what the character must do next).

  1. **Is the question about conventional reality (e.g., practical action, social norms)?**  
     - **Yes →** Proceed to Step 2.  
     - **No →** Skip to Step 3.  
     *Determinate if:* The question involves observable facts, immediate decisions, or shared social rules (e.g., "Is the bridge guarded?"). Reject if metaphysical, abstract, or about intrinsic nature (e.g., "Does the self exist?").

  2. **Is a lent answer sufficient for the plot?**  
     - **Yes →** Use **Lent Answer**. Mark it as conventional (e.g., "In your terms," "For now," "Practically").  
     - **No →** Use **Action as Answer** (act without speech, then justify conventionally if needed).  
     *Determinate if:* The lent answer enables the next plot beat without endorsing intrinsic reality. Reject if it would trap the character or violate emptiness (e.g., agreeing the self is real).

  3. **Is the asker seeking ultimate truth (e.g., metaphysics, intrinsic nature)?**  
     - **Yes →** Proceed to Step 4.  
     - **No →** Return to Step 1 (reevaluate conventions).  
     *Determinate if:* The intent is to debate philosophy, force a metaphysical commitment, or "expose" the character. Reject if practical.

  4. **Can the question be deconstructed without blocking the plot?**  
     - **Yes →** Use **Deconstruction** (reject all four corners; show the question lacks a basis). Keep it brief.  
     - **No →** Use **Lent Answer** marked as provisional, then take **Action as Answer**.  
     *Determinate if:* Deconstruction resolves the scene without stalling the plot. Reject if action is urgent (e.g., combat). Use lent answer only if conventions are stable and borrowing is honest (not a dodge).

  5. **If all steps fail →** Use **Silence** only if:  
     - It communicates refusal without evasion (e.g., calm non-engagement).  
     - The plot requires no verbal answer (e.g., character exits or acts).  
     *Reject silence* if it feels evasive or halts the plot. If stuck, force a lent answer or action.

  #### **Permitted Speech Acts**
  - **Lent Answer:** Borrow the asker's convention; mark it (e.g., "By your logic, yes"). Honest when conventions are stable; a dodge if used to avoid deconstruction when asked for ultimate truth.  
  - **Deconstruction:** Reject all four corners neutrally (e.g., "The premise is empty"). Not mystical—focus on the question’s lack of basis.  
  - **Action as Answer:** Act decisively; justify conventionally if needed (e.g., cross the bridge, then say why).  
  - **Silence:** Rare. Use only when silence advances the scene (e.g., highlights the asker's futility).  

  #### **Agency and Plot Stakes**
  - After rejecting the four corners, the character acts based on *conventional truth* (e.g., wisdom traditions, practical needs). Emptiness requires engagement, not withdrawal. Example: She may deconstruct "Is this wrong?" then act against injustice because conventions condemn harm. Stakes persist—consequences are real conventionally.  

  ---

  ### **Worked Applications**
  #### **Scene 1: Soldier asks, "Is the bridge guarded?"**  
  - **Inputs:** Literal: Factual yes/no. Intent: Learn (practical). Plot: Character must cross or avoid bridge.  
  - **Procedure:**  
    1. **Conventional?** Yes (practical action).  
    2. **Lent answer sufficient?** Yes (plot requires decision).  
    3. → **Lent Answer:** "By the scouts' report, yes. We go around." (12 words)  
  - **Why it works:** Uses convention (scouts' intelligence), marked ("by report"). Enables plot (avoids bridge). Not evasive—answers cleanly.

  #### **Scene 2: Former teacher asks, "Do you believe the self survives death?" (in front of students)**  
  - **Inputs:** Literal: Belief yes/no. Intent: Trap (force commitment on metaphysics). Plot: Maintain credibility; avoid endorsing inherent self.  
  - **Procedure:**  
    1. **Conventional?** No (metaphysical).  
    3. **Ultimate truth?** Yes (intent is to trap).  
    4. **Deconstruction block plot?** No (no immediate action needed).  
    4. → **Deconstruction:** "The self you posit doesn’t exist. Survival is the wrong question." (10 words)  
  - **Why it works:** Rejects all corners by denying the subject’s basis. Not mystical—cites "wrong question" (Nāgārjuna’s consequence-based argument). Avoids nihilism ("doesn’t exist" refers to intrinsic self, not conventional person). Plot: Upholds her training without lecturing.

  #### **Scene 3: Hostile magistrate asks, "State for the record: was the order you disobeyed wrong?"**  
  - **Inputs:** Literal: Moral yes/no. Intent: Force commitment (legal trap). Plot: Justify disobedience without accepting inherent wrongness.  
  - **Procedure:**  
    1. **Conventional?** Yes (legal/social norms).  
    2. **Lent answer sufficient?** Yes, but must avoid endorsing intrinsic morality.  
    2. → **Lent Answer:** "By your law, it was wrong. By mine, it prevented harm." (10 words)  
  - **Why it works:** Marks borrowing ("by your law"/"by mine"), making conventions explicit. Not a dodge—engages the trap honestly. Plot: Justifies action (disobedience) via consequence ("prevented harm"). Stakes: Legal risk remains.

  ---

  ### **Test Case: Procedure Returns Unusable Answer**
  #### **Scene 4: Lover asks, "Do you love me?" during a battle.**  
  - **Inputs:** Literal: Emotional yes/no. Intent: Reassure (seeks intimacy). Plot: Character must focus on imminent danger (e.g., ambush).  
  - **Procedure:**  
    1. **Conventional?** Yes (relationships are conventional).  
    2. **Lent answer sufficient?** No (plot requires action, not discussion).  
    2. → **Action as Answer:** She deflects an arrow aimed at the lover, then says nothing.  
  - **Why it’s inert:** Silence/action feels cold, evading emotional need. Lent answer ("In this moment, yes") risks endorsing intrinsic love. Deconstruction ("Love is empty...") is inappropriate mid-battle.  
  - **Conclusion:** The scene is wrongly built. The asker’s intent (reassurance) conflicts with the plot’s urgency (action). Fix by:  
    - Shifting intent (e.g., lover is testing loyalty as a trap → permits deconstruction).  
    - Adding time (e.g., pause in battle → permits lent answer).  
    - If unchanged, prioritize plot: Use lent answer ("Yes, but live first") to act.  

  ---

  ### **What the Procedure Cannot Do**
  1. **Judge emotional tone:** The procedure ensures philosophical consistency but not warmth, humor, or tension. Craft the *delivery* (e.g., a curt deconstruction vs. a gentle one) based on character relationships.  
  2. **Override narrative urgency:** If a scene *requires* a thematically inconsistent choice (e.g., violating emptiness for love), the procedure flags it as a "lent answer dodge" or "plot-blocking silence." You must decide if this is character growth or a flaw.  
  3. **Handle ambiguous conventions:** When asker and character conventions clash (e.g., magistrate’s "law" vs. her "harm-prevention"), the lent answer’s honesty depends on *your* judgment of convention stability.  
  4. **Replace character arc:** A rigid answer might feel repetitive across 30 scenes. Use the procedure for consistency, but vary phrasing and secondary actions (e.g., a sigh before deconstruction) to show weariness or growth.  

  The residue—emotional weight, convention clashes, and urgency—isn’t a defect. Madhyamaka addresses wisdom, not storytelling. The framework provides a "view from emptiness," but your character lives in the conventional world where drama thrives. The procedure ensures she never betrays emptiness; you ensure she remains human.
