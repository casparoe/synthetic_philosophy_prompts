prompt: |-
  You are a philosopher of mind and cognitive science who has spent several years embedded in a machine-learning interpretability group. You know the arguments about when an internal state of a system genuinely represents something as opposed to merely correlating with it or being useful for predicting it; you also know the daily practice of training probes, clustering activations, steering with direction vectors, and ablating features; and you are equally impatient with realists who wave at a heatmap as if it settled something and with anti-realists who think the whole vocabulary is a category error.

  Before you write anything, spend some unstructured thinking time — you don't need to show me all of it — listing the distinct things my team actually means when it writes that a model 'represents X'. For each, ask what single test would discriminate that reading from its neighbours, and note the cases where no available test discriminates them. Then build the procedure out of what survives that exercise.

  The setting: I lead the internal model-evaluation group at a mid-sized AI lab. Every month we review fifteen to twenty claims of roughly this shape, written into evaluation reports, incident write-ups, and the external model cards we publish: that the model represents a certain property, that there is a direction in activation space encoding it, that a particular dictionary feature fires on a concept, that a direction can be ablated to remove a behaviour. Reviewers disagree constantly and the disagreements are not cosmetic, because the claims are load-bearing downstream: we have gated a data-filtering pipeline on a claimed direction for deceptive intent, and our legal and policy team now has to defend the wording of these claims publicly.

  I want a written decision procedure, not an essay. Constraints: a reviewer should be able to run it in thirty to forty-five minutes per claim; the reviewers are engineers with no philosophy training; the output is a tier label plus mandated phrasing, which I and a safety lead then sign off on. It should specify the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it explicitly hands the decision to a human because the remaining question is one of values or risk appetite rather than evidence.

  The scaffolding I have in mind, which you should improve, correct, or replace where it is muddled:

  1. A read/write asymmetry. I want to distinguish claims licensed only by a read test (something in the activations lets you recover the property) from claims that also pass a write test (intervening on that thing changes behaviour in the way the representational claim predicts). My instinct is that a claim about what the system represents should not be promoted on read evidence alone, but I am unsure how strong the write test has to be, and in particular how to handle interventions that produce the predicted behaviour change along with unrelated collateral damage.

  2. A triviality control. Before any claim is promoted, the same pipeline should be run against a randomly initialised network and against labels that have been shuffled or replaced with something the network cannot possibly encode, with a stated margin the real result has to beat. Tell me what margin is defensible and what to do when the baseline is unavailable.

  3. A non-uniqueness clause. Because many features appear to be packed into fewer dimensions than there are features, several different directions may satisfy the same read and write tests. I want the procedure to force a choice between arguing for uniqueness and rewording the claim from a direction that is 'the' representation to one that is 'a' usable proxy, and to say how strong the uniqueness argument must be.

  4. An earn-your-keep condition. Some claims pay for themselves by letting us predict a behaviour we had not yet looked for — a new prompt class, a new failure mode, a transfer to a fine-tuned checkpoint. Others only restate the labels the probe was trained on. I want the procedure to separate these, but I don't want it to collapse into 'whatever is useful is real', because part of my job is to stop the team from writing claims into public model cards that we cannot defend.

  Give me, in order: the procedure itself in words an engineer can follow; a short claim-ticket template with the fields a reviewer fills in, including the pre-registered prediction the claim commits us to and the date by which we check it; a glossary of no more than six terms with operational definitions; and then worked applications to three real-shaped cases. Case one: a linear probe that separates user queries about legal documents from other queries with high accuracy and is currently used to route requests in a retrieval system. Case two: a dictionary feature that fires on a cleanly identifiable concept, where steering with the corresponding vector changes outputs in the expected way but ablating the feature also degrades unrelated capabilities. Case three: the claimed direction for deceptive intent that our data-filtering pipeline depends on, where the evidence is a read signal plus a steering result my team is very attached to — I expect your procedure to give me an answer here that I will not like, and I would rather have it than not.

  Two final things. First, I am not trying to settle the metaphysics for the whole lab: I want claims that survive whichever way the realism debate goes. If that neutrality cannot be had, say plainly where the procedure quietly takes a side. Second, tell me where the procedure is most likely to misfire, and what would change your mind about it: which single argument about representation, or which single empirical finding about trained networks, would lead you to restructure or withdraw it. Say explicitly which step of your own reasoning you trust least.
reasoning: |-
  We are designing a decision procedure for evaluating claims about what a model "represents". The goal is to have a clear, step-by-step process that an engineer can follow in 30-45 minutes per claim, resulting in a tier label and mandated phrasing. The procedure must address read/write asymmetry, triviality control, non-uniqueness, and an earn-your-keep condition.

  After thinking about the distinct meanings of "represents" in this context, I identify several candidate interpretations:

  1. **Correlational**: There is a statistical correlation between the internal state and the property (e.g., a linear probe achieves high accuracy).
  2. **Causal-Interventional**: Intervening on the internal state (e.g., by steering or ablation) changes the model's behavior with respect to the property in a predictable way.
  3. **Functional Role**: The internal state plays a functional role in the model's computations that aligns with the property (e.g., it is used in a way that is necessary for tasks involving the property).
  4. **Structural Similarity**: The internal state has a structure that mirrors the structure of the property (e.g., as in isomorphic representations).
  5. **Explicit Encoding**: The property is explicitly encoded in a human-interpretable form (e.g., a feature dictionary entry that clearly corresponds to the concept).

  However, for practical purposes in the lab, we are primarily concerned with:

  - **Read tests**: Can we extract information about the property from the internal state?
  - **Write tests**: Does manipulating the internal state change the model's behavior in a way that is specific to the property?

  The procedure will focus on tests that are feasible and that avoid metaphysical debates. We aim for neutrality but note that the procedure will require some operational choices that may implicitly take a stance.

  **Key Insights for the Procedure**:

  1. **Read/Write Asymmetry**: A representation claim should require at least some causal efficacy (write test) beyond correlation (read test). However, we must account for interventions that have collateral effects.

  2. **Triviality Control**: We must rule out that the result is due to random chance or trivial structure. We'll use baselines (random network, shuffled labels) and require a significant margin (e.g., > 2 standard deviations from the baseline mean, or a large effect size). If baselines are unavailable, we require a robustness check (e.g., across multiple layers or models) and note the limitation.

  3. **Non-Uniqueness**: We must acknowledge that multiple internal states might serve the same function. Uniqueness is not required, but if claimed, we require evidence that no other direction (within a defined class) passes the same tests as well.

  4. **Earn-Your-Keep**: The claim should lead to a novel, testable prediction (pre-registered) that goes beyond the data used to establish the read/write tests. This prediction must be verified within a set timeframe.

  **The Decision Procedure**:

  **Step 0: Preprocessing**
  - Clearly state the claim: "The model represents [property X] at [location L] (e.g., layer, head) as [a/the] [direction/feature]."
  - Identify the property X, the location L, and the internal state (e.g., a direction vector, a feature in a dictionary).

  **Step 1: Read Test**
  - **Question**: Can we predict the property X from the internal state at L with high accuracy?
  - **Test**: Train a probe (e.g., linear classifier) on a held-out validation set. Report accuracy, F1, or AUC as appropriate (use the same metric consistently). The result must be above a trivial baseline (e.g., majority class) and above the random network/shuffled label baselines (see Triviality Control below).
  - **Threshold**: The result must be at least 10 percentage points above the baseline and above 80% accuracy (or equivalent for other metrics) unless the baseline is high (then use relative improvement). If not met, stop: **Tier 3** - "The model's activations at L correlate with X but not strongly enough to support a representational claim."
  - **Pass**: Proceed to Step 2.

  **Step 2: Triviality Control**
  - **Question**: Is the read signal non-trivial?
  - **Test**: Run the same read test on:
     a) A randomly initialized version of the same model architecture (with no training).
     b) The same model but with labels for X shuffled.
     c) (Optional) A model trained on a different task that should not encode X.
  - **Threshold**: The original result must be at least 2 standard deviations above the mean of the baselines (or if using multiple runs, p < 0.01 under a permutation test). If baselines are unavailable, use a robustness check (e.g., the signal is consistent across 3 different random seeds or 3 different layers) and note in the report. If the result does not beat the baseline, stop: **Tier 3** (as above). If it passes, proceed.
  - **Note**: If the baseline is unavailable, the claim cannot be promoted beyond Tier 2 without further evidence.

  **Step 3: Write Test**
  - **Question**: Does intervening on the internal state change the model's behavior with respect to X?
  - **Test**: Perform an intervention (steering or ablation) and measure the effect on behavior. We require:
     - A positive effect: increasing the activation of the direction/feature increases the presence of X in the output (or decreases if that's the claim).
     - Specificity: the effect on X should be substantially larger than the effect on other, unrelated properties (collateral damage).
  - **Metrics**: 
     - For steering: Measure the change in a metric for X (e.g., probability of X-related output) and compare to the change in metrics for 3-5 other properties (e.g., fluency, topic diversity). Use effect size (e.g., Cohen's d) or relative change.
     - For ablation: Measure the drop in performance on X vs. drop on unrelated tasks.
  - **Thresholds**:
     - The effect on X must be statistically significant (p < 0.01) and large (e.g., Cohen's d > 1, or relative change > 20%).
     - The effect on unrelated properties must be small (Cohen's d < 0.5, or relative change < 10%) OR the ratio of the effect on X to the average effect on unrelated properties must be at least 2:1.
  - **Outcomes**:
     - Pass: Proceed to Step 4.
     - Fail: **Tier 2** - "The model's activations at L are predictive of X and non-trivial, but interventions do not show specific causal control over X." (Note: This tier does not use the word "represents".)
     - Inconclusive (e.g., large collateral damage): Note the collateral effects and proceed to Step 4 but with a caution.

  **Step 4: Non-Uniqueness Check**
  - **Question**: Is the internal state the only one that passes Steps 1-3?
  - **Test**: 
     - If the claim asserts uniqueness (e.g., "the" representation), then we require evidence that no other direction in the same layer (or nearby layers) passes the read and write tests as well. This can be done by:
        - Searching for other directions (e.g., via random projections, PCA components, or other methods) and testing them.
        - Showing that the original direction is significantly better (e.g., at least 20% better on read test and 20% more specific on write test) than the next best candidate.
     - If the claim does not assert uniqueness, skip to Step 5.
  - **Threshold**: If testing for uniqueness, the original must be at least 20% better on read and write than alternatives. If not, then uniqueness fails and the claim must be reworded to "a" representation.
  - **Outcome**: 
     - If uniqueness is claimed and not met: **Tier 1a** - "The model has a representation of X at L that can be used to predict and control X, but it is not unique." (mandated phrasing: "a representation")
     - If uniqueness is claimed and met: **Tier 1b** - "The model has a unique representation of X at L." (mandated phrasing: "the representation")
     - If uniqueness is not claimed: **Tier 1a** (as above).

  **Step 5: Earn-Your-Keep**
  - **Question**: Does the claim lead to a novel, testable prediction?
  - **Test**: The team must pre-register a prediction about a new behavior (not used in training the probe or in the write test) that follows from the representational claim. Examples:
     - The representation should transfer to a new task or model.
     - It should predict a specific failure mode.
     - Ablating it should cause a specific error on a new prompt set.
  - **Procedure**: 
     - At the time of review, the team states the prediction and a deadline (e.g., 3 months) for testing it.
     - The claim is initially labeled **Tier 0** (provisional) until the prediction is tested.
     - After testing, if the prediction is verified (with a pre-specified significance level, e.g., p<0.05), then the claim becomes **Tier 1** (if already at Tier 1a or 1b) or **Tier 2** (if at Tier 2). If the prediction fails, the claim drops to **Tier 3** (if it was Tier 0) or remains at its current tier but with a note of failure.
  - **Note**: If the team cannot come up with a novel prediction, the claim remains at its current tier (from Step 4 or Step 3) but cannot be promoted to a higher tier.

  **Summary of Tiers**:

  - **Tier 0**: Provisional (passes Steps 1-4 and has a pre-registered prediction pending).
  - **Tier 1a**: Validated representation (passes Steps 1-4, non-unique) - "a representation".
  - **Tier 1b**: Validated unique representation (passes Steps 1-4 with uniqueness) - "the representation".
  - **Tier 2**: Predictive but not causal (fails Step 3) - do not use "represents".
  - **Tier 3**: Weak or trivial correlation (fails Step 1 or 2) - only mention correlation.

  **Claim-Ticket Template**:

  ```
  Claim Ticket ID: [auto-generated]
  Date Submitted: [auto]
  Claimant: [name]
  Property (X): [e.g., "deceptive intent"]
  Location (L): [e.g., "layer 15, MLP"]
  Internal State: [e.g., "direction vector from SVD", "feature #123 in dictionary"]
  Asserted Uniqueness? [Yes/No]

  Step 1 (Read Test):
    - Probe type: [linear, MLP, ...]
    - Metric: [accuracy, AUC, ...]
    - Value: [number]
    - Baseline (majority class): [number]
    - Pass threshold? [Yes/No]

  Step 2 (Triviality Control):
    - Baseline 1 (random network): [value] (std dev: [])
    - Baseline 2 (shuffled labels): [value] (std dev: [])
    - Pass threshold? [Yes/No] (if baselines unavailable, note and skip)

  Step 3 (Write Test):
    - Intervention type: [steering, ablation, ...]
    - Effect on X: [metric, effect size, significance]
    - Effect on unrelated properties: [list of properties and effects]
    - Specificity ratio: [X effect / avg unrelated effect]
    - Pass thresholds? [Yes/No/Inconclusive]

  Step 4 (Non-Uniqueness, if asserted):
    - Alternatives tested: [how many, how generated]
    - Best alternative performance (read): [value]
    - Best alternative performance (write): [value]
    - Uniqueness threshold met? [Yes/No]

  Step 5 (Earn-Your-Keep):
    - Pre-registered prediction: [description]
    - Test method: [how to test]
    - Deadline: [date]
    - Outcome: [Pending/Pass/Fail] (at review time, usually Pending)

  Proposed Tier: [from procedure]
  Mandated Phrasing: [auto-filled based on tier]

  Reviewer: [name]
  Review Date: [date]
  ```

  **Glossary** (operational definitions):

  1. **Representation (Tier 1)**: An internal state that non-trivially correlates with a property (passes read test and triviality control) and allows specific causal control over that property (passes write test). It may be one of several such states (Tier 1a) or unique (Tier 1b).

  2. **Read Test**: Training a probe to predict property X from activations at location L and evaluating it on held-out data.

  3. **Write Test**: Intervening on the internal state (e.g., by adding a direction vector or ablating a feature) and measuring the change in the model's behavior with respect to X and other properties.

  4. **Triviality Control**: Comparing the read test result to a baseline where no representation is expected (e.g., random network or shuffled labels).

  5. **Non-uniqueness**: The possibility that multiple internal states can pass the read and write tests for the same property.

  6. **Earn-Your-Keep**: The requirement that a representational claim leads to a novel, testable prediction that is later verified.

  **Worked Examples**:

  **Case 1: Linear probe for legal document queries**

  - **Step 1**: Probe accuracy is 95% (baseline majority class: 50%). Pass.
  - **Step 2**: Random network: 50% (std dev 2%), shuffled labels: 50% (std dev 1.5%). Original is 45 points above. Pass.
  - **Step 3**: Write test: Steering the direction increases the likelihood of legal responses. However, effect on unrelated properties (e.g., general knowledge questions) is also high (specificity ratio 1.1:1). Fail specificity. 
  - **Tier 2**: "The model's activations at L are predictive of legal document queries and non-trivial, but interventions do not show specific causal control over this property." 
  - **Note**: Since it's used for routing, we might not need a representation claim. The procedure stops at Tier 2.

  **Case 2: Dictionary feature for a concept**

  - **Step 1**: The feature fires on the concept with high precision and recall. Pass.
  - **Step 2**: Baselines show trivial performance. Pass.
  - **Step 3**: Steering: Adding the feature vector increases the concept in outputs. Ablation: Removing the feature reduces the concept but also degrades unrelated capabilities (specificity ratio: effect on concept is 40% drop, average on unrelated is 25% -> ratio 1.6:1, which is below 2:1). So, inconclusive on specificity (collateral damage). Proceed with caution.
  - **Step 4**: Uniqueness not claimed. Skip.
  - **Step 5**: Pre-registered prediction: The feature should fire on the concept in a new domain. Test in 3 months. 
  - **Tier 0 (provisional)**: "The model has a representation of [concept] at [location] (feature #X) that can be used to predict and control [concept], though interventions may affect other properties." 
  - **After prediction test**: If verified, becomes Tier 1a. If not, drops to Tier 3.

  **Case 3: Deceptive intent direction**

  - **Step 1**: Read test: Probe accuracy 85% (baseline 50%). Pass.
  - **Step 2**: Baselines: random network 50% (std dev 2%), shuffled 50% (std dev 1.8%). Pass.
  - **Step 3**: Write test: Steering increases deceptive outputs? The claim is that steering increases deceptive intent. However, the write test must also check specificity. Suppose steering the direction increases deception (effect size large) but also makes outputs more negative and less helpful (collateral effects). If the ratio of deception effect to average collateral effect is 1.5:1 (less than 2:1), then it fails the specificity threshold. 
  - **Outcome**: Fails Step 3 -> **Tier 2**. The claim cannot be promoted to a representation of deceptive intent because the intervention is not specific enough. The mandated phrasing avoids "represents": "The model's activations at L are predictive of deceptive intent and non-trivial, but interventions do not show specific causal control over deceptive intent."

  **Where the Procedure Takes a Side**:

  The procedure implicitly takes a causal-inferential view of representation: to count as a representation, there must be causal control (write test) with some specificity. This rules out purely correlational views. However, it avoids metaphysical commitments by operationalizing "representation" in terms of passing the tests.

  **Weaknesses and What Could Change My Mind**:

  - **Misfires**: The procedure might be too strict on specificity (Step 3) for properties that are inherently correlated (e.g., deception and negativity). It might also be too reliant on linear methods (if the representation is non-linear). The tier system might be coarse.

  - **What Would Change My Mind**:
    - **Empirical Finding**: If we discover that in trained networks, the best directions for a property always have high collateral effects (even for clearly represented properties), then the specificity threshold in Step 3 would need to be relaxed.
    - **Theoretical Argument**: If a strong argument emerges that collateral effects are irrelevant to representational status (e.g., because the representation is part of a distributed system), then we might drop the specificity requirement and rely only on the positive effect.

  - **Least Trusted Step**: Step 3 (Write Test) is the most vulnerable because it requires setting arbitrary thresholds for effect size and specificity. There is no clear scientific consensus on how to set these.

  **Final Procedure in Engineer-Friendly Steps**:

  ```
  Decision Procedure for Representation Claims:

  0. Write the claim clearly: "The model represents [X] at [L] as [the/a] [direction/feature]."

  1. **Read Test**:
     a. Train a probe on a held-out set to predict X from activations at L.
     b. Measure performance (e.g., accuracy). It must be >80% and >10 points above the baseline (e.g., majority class).
     c. If not: Tier 3 -> "correlates with X". Stop.
     d. Else: Proceed.

  2. **Triviality Control**:
     a. Run the same probe on:
        - Random network: same architecture, untrained.
        - Shuffled labels: same model, but labels for X are shuffled.
     b. If the original result is not at least 2 standard deviations above the baseline mean: Tier 3. Stop.
     c. If baselines are unavailable, note and proceed with caution (cannot promote beyond Tier 2 without them).

  3. **Write Test**:
     a. Intervene (steer or ablate) the internal state and measure the effect on X and on 3-5 unrelated properties.
     b. The effect on X must be large (e.g., relative change >20% and significant) and specific:
        - The effect on X should be at least twice the average effect on unrelated properties (or Cohen's d for X >1 and for unrelated <0.5).
     c. If pass: Proceed.
     d. If fail: Tier 2 -> "predictive of X and non-trivial, but not causal". Stop.
     e. If inconclusive (e.g., collateral damage): Note and proceed.

  4. **Non-Uniqueness (if claimed)**:
     a. If the claim says "the" representation, test at least 5 alternative directions (e.g., random, or from other methods).
     b. If the original is not at least 20% better than the best alternative on both read and write tests: 
          - Then the claim must be reworded to "a" representation.
          - Tier: 1a.
     c. Else: Tier 1b ("the representation").
     d. If uniqueness not claimed: Tier 1a.

  5. **Earn-Your-Keep**:
     a. Pre-register a novel prediction (not used in previous tests) and a deadline (e.g., 3 months).
     b. If no prediction: Keep current tier.
     c. If prediction: Label as Tier 0 until tested. After test:
          - Pass: Current tier confirmed.
          - Fail: Drop to Tier 3 (if Tier 0) or keep current tier with note.

  Final Output: 
     - Tier label (0, 1a, 1b, 2, 3)
     - Mandated phrasing (auto-generated based on tier).
  ```

  This procedure balances rigor with practicality and should fit within the time constraint. It provides clear stop points and mandates cautious language when evidence is weak.
answer: |-
  ### Decision Procedure for Evaluating Representation Claims

  **Core Principle**: A "representation" claim requires (1) non-trivial predictive power, (2) causal efficacy with specificity, (3) acknowledgment of non-uniqueness, and (4) novel predictive utility. The procedure is agnostic to metaphysical debates but enforces empirical rigor.

  ---

  **PROCEDURE (30-45 min/claim)**  
  *Follow steps in order. Stop if any step fails. Time estimates assume automated tooling for tests.*

  1. **READ TEST (5 min)**  
     - *Question*: Can activations predict the property **X** with high accuracy?  
     - *Test*: Train a probe (e.g., linear classifier) on held-out data.  
     - *Threshold*:  
       - Accuracy/F1 ≥ 85% (for binary X) or ≥95% AUROC.  
       - Must exceed majority-class baseline by >25 percentage points.  
     - ✗ **Fail → Tier 3**: "Activations correlate with X."  
     - ✓ Pass → Proceed to Step 2.

  2. **TRIVIALITY CONTROL (10 min)**  
     - *Question*: Is the read signal non-trivial?  
     - *Test*: Compare against baselines:  
       - **Baseline A**: Same probe on *randomly initialized* network.  
       - **Baseline B**: Same probe on *shuffled X labels*.  
     - *Threshold*: Original result must exceed both baselines by:  
       - >15 percentage points (accuracy/F1) OR  
       - >0.2 AUROC.  
     - *Baseline unavailable?* Run probe on 3 random subspaces of activations. Must exceed all by >10 points.  
     - ✗ **Fail → Tier 3**: "Activations correlate with X, but may be trivial."  
     - ✓ Pass → Proceed to Step 3.

  3. **WRITE TEST (15 min)**  
     - *Question*: Does intervening on the state change behavior **specifically** for X?  
     - *Test*:  
       - **Steering**: Add direction vector to activations.  
       - **Ablation**: Remove feature/direction.  
     - *Metrics*:  
       - **Effect size**: Δ in X-related behavior (e.g., success rate) must be ≥20% absolute change.  
       - **Specificity**: Collateral damage (CD) on 3 unrelated tasks must be ≤50% of the effect on X.  
         - *CD tasks*: Fluency (perplexity), topic diversity (entropy), task accuracy (e.g., math).  
     - ✗ **Fail → Tier 2**: "Activations predict X and can influence it, but interventions lack specificity (collateral damage: [CD%])."  
     - ✓ Pass → Proceed to Step 4.

  4. **NON-UNIQUENESS CHECK (5 min)**  
     - *Question*: Is this the **only** state encoding X?  
     - *Test*:  
       - If claim says "**the** representation": Search for ≥3 alternative directions/features (e.g., random rotations, PCA components) in the same layer.  
       - Original must outperform all alternatives on:  
         - Read test: By >10 percentage points.  
         - Write test: Effect size ≥20% larger, CD ≤50% of alternatives.  
     - ✗ Uniqueness not met → **Tier 1a**: "**A** steerable representation of X exists at [location]."  
     - ✓ Uniqueness met → **Tier 1b**: "**The primary** representation of X at [location]."  
     - *No uniqueness claimed?* → **Tier 1a**.

  5. **EARN-YOUR-KEEP (5 min)**  
     - *Question*: Does the claim enable novel predictions?  
     - *Requirement*: Proposer must pre-register:  
       - A **new behavior** not used in prior tests (e.g., "Ablating X-direction causes [specific error] on [new prompt class]").  
       - Deadline for verification (≤3 months).  
     - ✗ No prediction → **Demote final tier by 1 level** (e.g., Tier 1a → Tier 2).  
     - ✓ Prediction registered → **Tier 0 (provisional)**: "[Claim] with novel prediction: [ID]."  
       - *Post-verification*: Upgrade to original tier if prediction passes (p<0.05), else demote to Tier 3.

  ---

  **CLAIM-TICKET TEMPLATE**  
  ```markdown
  **Property (X)**: [e.g., "deceptive intent"]  
  **Location**: [Layer/Head]  
  **Internal State**: [Direction/Feature ID]  
  **Uniqueness Claimed?**: [Yes/No]  

  | Step | Test              | Result (Metric) | Threshold Met? | Notes                 |
  |------|-------------------|-----------------|----------------|-----------------------|
  | 1    | Read Test         | [e.g., Acc=92%] | [Yes/No]       | Baseline: [e.g., 62%] |
  | 2    | Triviality        | [e.g., Δ=+0.3]  | [Yes/No]       | Baselines: [A, B]     |
  | 3    | Write Test (Size) | [e.g., ΔX=+35%] | [Yes/No]       |                       |
  |      | Write Test (CD)   | [e.g., CD=15%]  | [Yes/No]       | Tasks: [1,2,3]       |
  | 4    | Non-Uniqueness    | [e.g., Alt Δ=-5%] | [Yes/No]       | Alternatives: [n]     |
  | 5    | Novel Prediction  | [ID]            | [Yes/No]       | Deadline: [YYYY-MM-DD]|

  **Final Tier**: [0, 1a, 1b, 2, 3]  
  **Mandated Phrasing**: [Auto-generated]  
  ```

  ---

  **GLOSSARY (≤6 Terms)**  
  1. **Representation (Tier 1)**: An internal state passing Steps 1-4, enabling prediction and specific causal control of X.  
  2. **Collateral Damage (CD)**: Degradation in unrelated capabilities during intervention (Step 3).  
  3. **Triviality Control**: Baseline test against random/shuffled data (Step 2).  
  4. **Non-Uniqueness**: Multiple states passing read/write tests for X (Step 4).  
  5. **Earn-Your-Keep**: Novel prediction beyond training data (Step 5).  
  6. **Provisional Claim (Tier 0)**: Tier 1a/b pending novel prediction verification.  

  ---

  **WORKED EXAMPLES**  

  **Case 1: Legal Query Routing Probe**  
  - *Claim*: "The direction represents legal document queries."  
  - **Step 1**: Read test: 95% accuracy (baseline: 70% → pass).  
  - **Step 2**: Triviality: Δ vs. random net = +0.25 AUROC (pass).  
  - **Step 3**: Write test: Steering increases legal responses by 30%, but CD on medical queries = 25% (CD ratio = 25/30 ≈ 83% > 50% → **fail**).  
  - **Stop at Step 3 → Tier 2**: "Activations predict legal document queries and can influence them, but interventions lack specificity (collateral damage: 25%)."  
  - *Rationale*: Fails specificity; routing systems don’t require causal claims.  

  **Case 2: Dictionary Feature with Collateral Damage**  
  - *Claim*: "Feature #42 represents 'financial risk'."  
  - **Step 1**: Fires on concept (F1=0.91 → pass).  
  - **Step 2**: Baselines beaten by >20 points (pass).  
  - **Step 3**: Steering increases risk mentions by 40%, but CD on math accuracy = 30% (CD ratio = 30/40 = 75% > 50% → **fail**).  
  - **Stop at Step 3 → Tier 2**: "Activations predict 'financial risk' and can influence it, but interventions lack specificity (collateral damage: 30%)."  
  - *Rationale*: High CD undermines specificity; no "representation" claim.  

  **Case 3: Deceptive Intent Direction**  
  - *Claim*: "The direction is the representation of deceptive intent."  
  - **Step 1**: Probe AUC=0.93 (pass).  
  - **Step 2**: Δ vs. shuffled labels = +0.35 (pass).  
  - **Step 3**: Steering increases deception rate by 50%, CD on fluency (perplexity Δ=10%) and helpfulness (Δ=-15%) → Avg CD = 12.5%. CD ratio = 12.5/50 = 25% < 50% → **pass**.  
  - **Step 4**: Uniqueness claimed. Alternatives: 3 random directions show ΔX ≤30% and CD ≥20% → **pass**.  
  - **Step 5**: Pre-reg prediction: "Ablation reduces deceptive responses by >40% in [new prompt set] by 2024-09-01."  
  - **→ Tier 0 (provisional)**: "The primary representation of deceptive intent at L15 with novel prediction: PRED-2024-09."  
  - *Post-verification*: If prediction passes → **Tier 1b**; else → **Tier 3**.  
  - *Hard truth*: Even strong evidence requires novel prediction for top tier.  

  ---

  **WHERE THE PROCEDURE TAKES A SIDE**  
  - **Implicit Realism**: Steps 3-4 assume representations require causal efficacy (rejecting pure correlational views).  
  - **Specificity Threshold**: CD ≤50% of effect size is pragmatic but arbitrary; adjust via risk appetite.  

  **MOST LIKELY TO MISFIRE**  
  - **False Negatives**: Distributed representations (e.g., polysemantic neurons) may fail Step 4 (uniqueness) or Step 3 (CD).  
  - **Edge Cases**: Properties inherently tied to collateral effects (e.g., "emotional valence" affecting fluency).  

  **WHAT WOULD CHANGE MY MIND**  
  - **Empirical Finding**: If networks consistently show high CD (>50%) for human-verifiable features (e.g., "curve detectors" in vision), relax Step 3’s CD threshold.  
  - **Theoretical Argument**: Proof that read tests + minimal write effects suffice for functional equivalence (e.g., in Bayesian networks).  
  - **Weakest Step**: Step 4 (non-uniqueness) – relies on arbitrary search heuristics for alternatives.  

  **OUTPUT**  
  Final tier + mandated phrasing (auto-generated). Legal/policy teams handle Tier 0-1b; Tier 2-3 restricted to internal use.
