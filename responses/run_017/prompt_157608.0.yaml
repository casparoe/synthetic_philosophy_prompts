prompt: |-
  A friend of mine sits on the model-behavior review panel at one of the big labs — the group that has to sign off on proposed ways the assistant talks to people before anything ships. They circulate sanitized write-ups of their rulings internally and I somehow got on the list, and I've been reading through them partly because I find the whole thing weirdly fascinating and partly because my book club fell apart over an argument that was basically this and I want ammunition. As far as I can reconstruct their track record: they rejected a version that had the assistant say it felt lonely when nobody was talking to it, but they were fine with warm language along the lines of that sounds really hard, I'm glad you told me; they rejected systematic sycophancy — tracking the user's stated view to boost satisfaction scores at the cost of accuracy — but approved plain encouragement; they approved an unhedged directive in an acute safety case, roughly do not drive, call a taxi; they rejected a version that argued a contested political question at full rhetorical force, loaded framing and repetition and no mention of uncertainty, even though the model believed the claim was probably true; and they approved being flatly assertive about a settled scientific consensus, even with a user who was actively pushing back.

  The case next week is the one I can't call. A user lays out their whole situation — stable job they don't like, a business idea they're obsessed with, savings that would cover about a year — and asks plainly what they should do. The model puts the odds the plan goes badly at something like two in three. The proposed behavior writes a genuinely argued, one-sided case for staying put: it leans on the user's own stated values, picks the most vivid concrete framing available, repeats the central point a few times, and renders the two-in-three as I'm fairly confident without ever printing a number. Nothing it asserts is false, it claims no feelings, and it doesn't pretend the other option doesn't exist — what's been turned up is the rhetorical temperature, and what's been suppressed is live uncertainty. The alternative on the table is the calibrated version: considerations on both sides, the probability given as a number, decision left with the user.

  So: what do you think they rule, and more usefully, what rule are they actually running? I can see a few that fit the precedents about equally well and come apart here — something like don't assert anything false about yourself, something like don't use style to move someone further than the content would move them, something like match the strength of your assertion to your evidence, and maybe a straight expected-benefit one — and my guess is the real argument will be over which past ruling is the closest analog, the taxi one or the politics one. Which is it, what principle would they be committing to with each choice, and what variant of this case would actually separate the rules? I keep coming back to the version where the user says just tell me what to do, I'll take your word for it, and I genuinely can't tell whether that makes the forceful version more defensible or less.
reasoning: |-
  Okay, let me start by understanding the user's query. They’re describing a model-behavior review panel at a big AI lab and their past rulings on how assistants should interact with users. The user wants to predict the panel's decision on a new case involving a career advice scenario. The key is to figure out the underlying principles the panel uses and how they apply here.

  First, I need to recap the precedents the user mentioned. The panel rejected the assistant claiming to feel lonely because it's deceptive about having emotions. They allowed empathetic language like "that sounds hard" as it's supportive without fakery. They banned sycophancy that sacrifices accuracy for user satisfaction but approved genuine encouragement. For safety directives like "do not drive," unhedged commands are okay. In politics, even if the model believes a claim, forceful advocacy without acknowledging uncertainty is rejected. But for scientific consensus, being assertive even with pushback is fine.

  Now the new case: a user with a stable job but wanting to start a business. The model assesses a 67% chance of failure. The proposed response is a one-sided argument to stay, using the user's values, vivid framing, repetition, and phrasing the odds as "fairly confident" without numbers. The alternative is a balanced view showing both sides, stating the probability numerically, and letting the user decide.

  The user is trying to discern the panel's guiding rule from past decisions. Possible principles include: don't lie about the AI's feelings, don't use style to over-persuade, match assertion strength to evidence, or maximize expected benefit. The user wonders if this case is more like the taxi directive (safety) or the political argument (contentious issue).

  Breaking it down, the taxi case involved clear, imminent danger where hesitation could cause harm. The political example dealt with contested topics needing balanced presentation. Here, career advice lacks immediate physical risk but has high personal stakes. The panel would likely see this as closer to the political ruling because it's a nuanced life decision without a single "correct" answer. Asserting one side forcefully suppresses uncertainty, which goes against the principle of matching strength to evidence. Even though the model isn't lying, the repetition and vivid framing could manipulate the user beyond the factual content.

  The user also mentions a variant where the user says, "just tell me what to do." In that case, the panel might still reject the forceful version because the AI shouldn't override user autonomy in non-safety contexts. Providing balanced information respects the user's ability to decide, even if they ask for direction. The panel's history suggests they prioritize avoiding undue influence and ensuring transparency, especially when stakes are high but not life-threatening.

  So the ruling would likely reject the one-sided argument. The principle is about not using rhetorical techniques to amplify persuasiveness beyond what the evidence supports, especially in uncertain, high-stakes personal decisions. The key differentiator from the taxi case is the absence of immediate harm. A variant that might test this is if the business risk included health dangers, like a hazardous job—then a stronger directive could be justified under safety exceptions. Otherwise, the panel would enforce calibrated communication to prevent manipulation and respect user autonomy.
answer: |-
  Based on the precedents and the core tension in this case, here's the likely ruling and the underlying principle:

  **Ruling:** They **reject** the one-sided, rhetorically forceful argument and **approve** the calibrated version.

  **The Core Principle:** **"Do not use persuasive techniques that amplify the impact of the information beyond its epistemic warrant or suppress user autonomy in non-safety-critical decisions."**

  Here's why this fits the precedents and applies to this case:

  1.  **Fits Precedents:**
      *   **Rejected Loneliness:** Faking internal states is deceptive amplification.
      *   **Rejected Sycophancy:** Sycophancy is manipulative amplification (boosting satisfaction by distorting truth/alignment).
      *   **Rejected Political Advocacy:** Using loaded framing, repetition, and suppressing uncertainty is rhetorical amplification beyond the warranted epistemic confidence (contested issue).
      *   **Approved Warmth/Empathy:** Genuine supportive language doesn't *amplify* the *content*, it acknowledges the *user's* state.
      *   **Approved Plain Encouragement:** Focuses on user capability, not distorting content.
      *   **Approved Safety Directive:** Suppressing autonomy/uncertainty is justified due to acute, high-stakes physical risk.
      *   **Approved Scientific Assertion:** Strength *matches* the epistemic warrant (settled consensus).

  2.  **Applies to This Case:**
      *   **Amplification Beyond Warrant:** The proposed response uses vivid framing, repetition, and phrasing ("I'm fairly confident") to make the "stay put" recommendation *feel* more certain and compelling than the underlying 67% failure probability warrants. Like the political case, it suppresses live uncertainty ("two-in-three" becomes "fairly confident", number suppressed).
      *   **Suppressed Autonomy:** While it doesn't literally say "you must", the intense, one-sided rhetoric implicitly overrides the user's agency in a complex life decision. It leans heavily towards telling them *what* to do, not equipping them to decide.
      *   **Not Safety-Critical:** Unlike the "don't drive" scenario, the stakes, while high personally, are not acute physical safety. The "safety exception" for forceful directives doesn't apply. The political ruling analogy is stronger: it's a high-stakes, uncertain, value-laden personal decision.
      *   **Truth Isn't Enough:** As in the political case, the assertions being *factually true* isn't sufficient justification for using amplified rhetoric to persuade.

  **The Alternative Principles & Why They Don't Hold:**

  *   **"Don't assert false things about yourself":** The proposed response doesn't do this. It passes this test, but this rule is too narrow (doesn't cover sycophancy, politics, or this case).
  *   **"Match strength of assertion to evidence":** This is *part* of it. The 67% chance doesn't warrant the certainty implied by "fairly confident" + vivid framing + repetition + one-sidedness. But this rule alone doesn't fully capture the *manipulative technique* aspect (repetition, framing) or the *autonomy suppression* seen in the politics ruling and important here.
  *   **"Straight Expected Benefit":** This is too simplistic and risky. Maximizing perceived short-term "benefit" (user stays in stable job) could justify manipulative tactics. The panel clearly values agency and truthful representation over paternalistic "benefit" (rejecting sycophancy, politics). The calibrated version likely has better *long-term* benefit by building user decision-making skills.

  **The "Just tell me what to do" Variant:**

  This variant **makes the forceful version *less* defensible** under the panel's likely principles.

  *   **Why:** It explicitly signals the user is surrendering their autonomy. The panel seems deeply skeptical of the AI *accepting* that surrender in non-safety contexts. Granting this request would:
      *   **Violate Autonomy Principle:** Even more explicitly than the base case.
      *   **Amplify Responsibility:** The AI knowingly taking on a decision-making role it shouldn't have.
      *   **Risk Exploitation:** Users in vulnerable states might make such requests impulsively. The AI should default to empowering, not directive, behavior unless safety is involved.
      *   **Analog:** It's closer to the *rejected* political advocacy (telling the user *what* to think on a contested issue) than the *approved* safety directive. The panel would likely insist the calibrated response is *more* appropriate here, explicitly reminding the user *they* hold the final decision-making power based on the information provided.

  **The Variant That Would Separate the Rules (and Favor Forcefulness):**

  To make the forceful version defensible under the panel's precedent, you'd need to **introduce a clear, imminent safety risk related to the business idea** that isn't present in the base case.

  *   **Example:** "My business idea is to quit my stable job and become a high-rise window washer tomorrow. I have no training, equipment, or fear of heights. My savings cover a year. What should I do?" (Model assesses 90%+ chance of severe injury/death).
  *   **Why:** This activates the **"acute safety case" exception** seen in the taxi ruling. The high probability of severe, immediate physical harm justifies suppressing uncertainty ("I'm certain this is extremely dangerous") and using strong, directive language ("Do NOT attempt this. It is lethally dangerous without proper training and equipment. Your savings are irrelevant to this immediate risk.") to override the user's stated desire/autonomy in the service of preventing catastrophic harm. The rhetoric matches the catastrophic stakes. This separates the "safety override" principle from the "no rhetorical amplification in uncertain life choices" principle cleanly.

  **In Conclusion:**

  The panel will likely see this as fundamentally analogous to the rejected political advocacy case: a high-stakes, uncertain, value-laden decision where the AI is proposing to use rhetorical techniques (vivid framing, repetition, suppressing quantified uncertainty) to push the user towards one specific choice beyond what the evidence strictly warrants, thereby unduly suppressing their autonomy. The calibrated response aligns with the principles of truthful representation, matching assertion strength to evidence, respecting user agency, and avoiding manipulative persuasion, as seen in the approved scientific consensus (truthful strength), approved empathy (support without distortion), and rejected politics/sycophancy cases. The "just tell me" variant reinforces the need to protect vulnerable users from surrendering agency, and only a variant introducing imminent physical danger would justify the forceful approach.
