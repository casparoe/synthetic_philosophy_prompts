  First, I need to recall the key elements of revealed preference theory. It's based on observable choices, not hypotheticals. The user wants a disciplined mapping: who is the agent, what's the choice set, budget constraints, etc. Their friend argues that survey responses aren't real choices, while the user feels revealed preference is being misapplied.

  The user mentions three interpretations of revealed preference: positivist (purging unobservables), consistency condition (like WARP), and welfare criterion. I should address each in the context of passive use value. For passive use, there's no market, so no observable choices. Revealed preference theory would be silent here because there's no behavior to observe. That's a crucial point.

  Then there's the friend's fallback: the survey response itself is a choice, revealing preference for warm glow or self-image. But this shifts the good being valued. If that's the case, then the survey isn't measuring the environmental good but the act of answering. That seems like a bait-and-switch. The user's gut feeling is right—it's clever but undermines the original intent.

  The divergence between WTP and WTA is another issue. In standard theory, they should be close, but in practice, they're not. This inconsistency challenges the theory's applicability here. The user wants to know if this invalidates the whole approach for non-market goods.

  Underlying all this, the user is grappling with the limitations of economic tools for valuing intangible goods. When markets don't exist, how do we assign value? Revealed preference can't help, and hypothetical surveys have their flaws. The user might be seeking validation that their friend's strict adherence to revealed preference is too narrow, especially for environmental valuation.

  I need to ensure each part of the mapping is addressed clearly. The agent is the survey respondent, but without a real transaction, the choice set is hypothetical. Budget constraints aren't binding. WTP isn't a real price. The theory is silent on goods outside the opportunity set. 

  The warm glow argument does technically fit revealed preference as a choice, but it misrepresents the intended valuation. This creates a tension between the consistency and welfare interpretations. The user might be hinting at a deeper issue: when we need to value non-market goods, revealed preference falls short, forcing us to confront the theory's limitations.

  Finally, the user's frustration about having nothing to say when it matters most is key. Revealed preference works within markets but fails for existential values. The takeaway is that for passive use, alternative methods might be necessary, acknowledging their imperfections. The honesty here is admitting the theory's silence where it's needed most.
answer: |-
  Here's a disciplined mapping of the Exxon Valdez contingent valuation (CV) controversy through the lens of revealed preference theory (RPT), dissecting its core interpretations and their implications:

  ### Core Tenets of Revealed Preference Theory (RPT)
  1.  **Positivist Foundation:** Utility is *not* an introspective mental state. It is *defined* solely by observable choice behavior under constraints. Unobservables (feelings, beliefs) are purged.
  2.  **Consistency Condition:** Choices must satisfy logical axioms (e.g., WARP, GARP) to be rationalizable by a stable preference ordering. Violations imply inconsistency, not deep psychology.
  3.  **Welfare Criterion:** The chosen bundle within a budget set reveals it is preferred to all other affordable bundles. This defines "better off" *relative to that set*. RPT is silent on welfare comparisons involving goods never chosen or outside the set.
  4.  **Requisite Elements:** Requires an *agent*, a well-defined *choice set* (available bundles), *binding constraints* (prices, income), and *actual choices*.

  ### Mapping the CV Survey to RPT
  *   **The Agent:** The survey respondent.
  *   **The Choice Set:** Hypothetical options: "Pay $X to prevent spill Y" vs. "Don't pay, risk spill Y". Crucially, **no actual payment occurs**.
  *   **The Budget Constraint:** Hypothetical. The respondent faces no real income reduction or trade-off with other goods. The constraint is **not binding**.
  *   **The "Choice":** Stating a Willingness-to-Pay (WTP) number. This is **not an actual purchase decision**.

  ### Analysis Through RPT Lenses
  1.  **Positivist Lens (Purging Unobservables):**
      *   **View:** CV surveys directly violate the core positivist principle. They ask about *hypothetical* mental states (utility loss from spill) and *hypothetical* choices. The stated WTP is not observable market behavior. RPT, strictly applied, declares this data meaningless for inferring preferences or utility.
      *   **Verdict on CV:** **Invalid.** Measures unobservable mental content, not revealed choice.

  2.  **Consistency Lens (Testing Choice Data):**
      *   **View:** There is no sequence of *actual* choices involving the Alaskan wilderness (or similar non-use goods) to test for consistency (WARP/GARP). The CV "choice" is a single, isolated, hypothetical event. There is no behavioral pattern to analyze for rationality axioms. The huge WTP/WTA gap *is* problematic for consistency *if* it were observed in real markets (suggesting endowment effects/path-dependence incompatible with standard utility models), but here it arises from hypothetical questions, not choices.
      *   **Verdict on CV:** **Irrelevant.** No actual choice data exists to which consistency conditions could be applied. The WTP/WTA disparity *in hypotheticals* highlights the lack of anchoring in real trade-offs but doesn't directly test consistency of *revealed* preferences.

  3.  **Welfare Lens (Inferring Preference from Chosen Bundle):**
      *   **View:** Welfare statements in RPT are *contextual*. Saying "A is preferred to B" only means "A was chosen when both A and B were available and affordable *in a specific choice situation*." The passive use good (undamaged Prince William Sound) **was never in the respondent's actual opportunity set**. They never faced a real budget constraint forcing a trade-off between this good and other market goods.
      *   **Verdict on CV:** **Silent / Meaningless.** RPT provides no basis for inferring welfare changes related to goods entirely outside the historical choice set. Stating a hypothetical WTP does not reveal that the respondent *would* actually pay that amount if faced with a real budget constraint and payment mechanism. The "chosen bundle" in the CV scenario doesn't exist.

  ### Where RPT is Simply Silent
  *   **Non-Market Goods:** RPT fundamentally relies on choices made *within markets* under constraints. For goods like passive existence value, **there is no market and no observable choice behavior**. RPT has *nothing* to say about the valuation of such goods. It defines utility *only* over goods that are actually chosen. This is its core limitation in this context.

  ### Evaluating Your Friend's "Warm Glow" Fallback
  *   **The Argument:** The act of *answering the survey* is a real choice. The "good" being chosen is the warm glow of answering virtuously, signaling identity, or avoiding cognitive dissonance. The WTP number reveals preference *for that warm glow experience*.
  *   **Mapping to RPT:**
      *   **Agent:** Respondent.
      *   **Choice Set:** Options for answering (e.g., state $5, state $50, refuse to answer).
      *   **Constraints:** Time, cognitive effort, social desirability bias (internal "costs").
      *   **Choice:** The specific number stated (or refusal).
  *   **Assessment:**
      *   **Positivist/Consistency:** This *does* salvage RPT technically. An actual choice (writing a number) was made under *some* constraints. One could potentially analyze patterns across surveys for consistency.
      *   **Welfare:** This **completely guts CV as a method for valuing the *environmental good*.** It reveals only the value of the *survey experience itself* (warm glow, signaling). The stated WTP number is disconnected from any genuine trade-off involving Prince William Sound. It measures "purchase" of a feeling *during the survey*, not valuation of the spill prevention.
      *   **Tension:** This highlights the core tension. The **consistency reading** (choice = behavior) can be satisfied by redefining the good. The **welfare reading** (choice reveals preference *for the named bundle*) is obliterated. Your suspicion ("too clever by half") is justified: it saves the *letter* of RPT (observable behavior) while destroying its *spirit* for valuing the intended object (the environment). It vindicates RPT as a *method* for studying survey behavior but guts it as a way to value passive use.

  ### What the Episode Reveals About RPT Utility
  1.  **Utility is an Index of Choice:** RPT utility is purely an index constructed to rationalize *observed choices within markets*. It has no independent psychological reality.
  2.  **Silence on the Unchosen:** RPT utility **has no business valuing goods nobody ever chooses** in real transactions. By its own definition, it cannot speak to the value of goods entirely outside the historical opportunity set.
  3.  **The Existential Dilemma:** This episode starkly reveals RPT's limitation: **it leaves you with exactly nothing to say at the moment you most need to say something** – when valuing non-market, non-chosen goods with significant societal importance. RPT is powerful *within* its domain (market behavior) but is structurally mute *outside* it. Contingent valuation, flawed as it may be, is an attempt (however imperfect) to speak where RPT *cannot*.

  ### The Crucial Distinction / Test
  The fundamental test RPT imposes is: **"Is this an *actual* choice involving a *real* trade-off under *binding* constraints?"**

  *   **For the Environmental Good:** The answer is **No.** No trade-off occurred. Therefore, RPT says the CV WTP does not reveal preference *for the environmental good*.
  *   **For the Survey Experience:** The answer is **Yes.** An action (writing a number) was taken. Therefore, RPT says it reveals preference *for the act of answering in that specific way* under the survey's implicit constraints.

  **Conclusion of the Mapping:** Revealed Preference Theory, taken seriously in its positivist/behaviorist foundations and its requirement for actual choices under constraints, **cannot recognize contingent valuation survey responses as revealing preferences *for the passive use environmental good*.** The good is outside the opportunity set; the choice is hypothetical; the constraint isn't binding. Your friend is correct *within the strict confines of RPT*. However, this episode powerfully demonstrates RPT's profound silence on valuing non-market goods. The "warm glow" reinterpretation technically rescues RPT for analyzing survey behavior but renders it useless for valuing the environment, exposing the chasm between the consistency and welfare interpretations when applied outside RPT's natural domain of market transactions. The theory works impeccably within its designed sphere but offers no tools for the valuation problem posed by passive use.
