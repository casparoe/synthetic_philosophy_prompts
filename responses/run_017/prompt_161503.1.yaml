prompt: |-
  Hi — I'm the clinical lead for multidisciplinary review panels at a regional hospital system. Roughly 40–50 decisions a month, panels of 4 to 9 people (mix of consultants, registrars, senior nurses), simple majority, advisory to whoever is on call. Typical questions: is this imaging finding suspicious enough to recall the patient; is this patient deteriorating enough to escalate; is this discharge safe. I've been reading about the Condorcet jury theorem and I want to know whether it can be turned into something my team actually runs each week, rather than a thing I half-remember from a blog post.

  What I want is a decision procedure we can follow in about fifteen minutes before a panel meets, no stats background required, that decides how to set the panel up for this class of case. In order, roughly:

  1. Does the theorem even apply — is there a right answer that exists independently of what the panel says? I have a nagging feeling that for a good chunk of our calls the panel's say-so partly constitutes the answer, or it's really a values call about acceptable risk, and majority voting is just a way of laundering responsibility. If so, say so and hand it to a named person.
  2. Is average competence on this class of case actually above half, or are we assuming it? Note that competence is an average over a type of case, not a fixed trait of a person — we get outcome data back on maybe half our calls, and for the escalation ones nobody ever observes what would have happened to a patient we didn't escalate.
  3. Independence. Everyone reads the same chart, the same guideline, the same handover note from the same tired registrar, so the errors share a component. My hunch is there's an effective number of independent voters that saturates around four or five and a ninth person buys approximately nothing — but I dunno how to check which regime we're in, or how to weigh a smaller, genuinely defferent group against a bigger, correlated one.
  4. Protocol: blind votes, then deliberate, then re-vote? Or just deliberate and vote? Show a running tally or not? I keep hearing both that discussion wrecks independence and that it's the entire point of meeting.
  5. Weighting — do we weight by seniority? My guess is no unless someone can show the variable tracks accuracy on this case type.

  Two more things. First, a hunch: for questions that are really forecasts about what will happen rather than facts already fixed, majority-of-yes/no is the wrong aggregation device and averaging probabilities would be better. Tell me when to switch, and be straight with me if the switch needs calibration data we don't have and won't get. Second, flag which steps are judgment calls dressed up as procedure, and mark where the procedure just stops and a human decides — and say for each stop whether it's because it's a values question or because we're data-poor.

  Run it on three cases: (a) recall-or-not on a screening mammogram, five readers, same images, outcome known about a year later; (b) should this borderline patient go to a higher level of care tonight, ground truth never observed, on-call consultant has to sign; (c) a rare presentation where the two most senior people disagree and nobody in the room has seen more than a couple like it. I suspect at least one gives me an answer I don't want — say which, and don't soften it.

  Don't bother with citations, I can chase those myself. Sorry for the rambling, I'm writing this between two meetings.
reasoning: |-
  We are going to design a decision procedure based on the Condorcet Jury Theorem (CJT) and related concepts, tailored for your multidisciplinary review panels. The procedure will be a step-by-step guide that can be completed in about 15 minutes before a panel meets, without requiring a stats background.

  ### Key Concepts from Condorcet Jury Theorem
  - CJT states that if each voter in a group has an independent probability of being correct (competence) above 0.5, then the probability that the majority vote is correct increases with the group size and approaches 1 as the group becomes very large.
  - However, if average competence is below 0.5, then increasing group size decreases the probability of a correct majority decision.
  - Independence of votes is crucial. If votes are correlated, the effective group size is reduced.

  ### The Decision Procedure
  We break down the procedure according to your requirements.

  #### Step 1: Does the theorem apply? (Is there a ground truth?)
  - **Question**: Is there a "right answer" that exists independently of the panel? Or is the decision a matter of values/acceptable risk?
  - **Procedure**:
    - If the decision is about an objective fact (e.g., "is this imaging finding malignant?") or a forecast that will eventually be verified (e.g., "will this patient deteriorate if not escalated?"), then there is a ground truth and CJT can apply.
    - If the decision is about values (e.g., "what level of risk is acceptable for discharge?") or if the panel's decision itself creates the outcome (e.g., by escalating a patient, you change the course of events), then CJT does not apply. In such cases, majority voting might just be a way to distribute responsibility without necessarily getting closer to truth.
  - **Decision**:
    - If no ground truth exists (values call or outcome constituted by the decision), then do not use voting. Instead, assign the decision to a named person (e.g., the most senior clinician or the one with ultimate responsibility) who must make a judgment call. Document the rationale.
    - If ground truth exists, proceed to Step 2.

  #### Step 2: Is average competence above 0.5?
  - **Question**: For this class of case, is the average panel member's probability of being correct (competence) above 0.5? Note: Competence is case-type specific and we may not have direct data.
  - **Procedure**:
    - If you have outcome data (e.g., for recall decisions on mammograms, you get feedback), use it to estimate the average accuracy of the panel members for that case type. If the average accuracy is above 0.5, proceed. If below 0.5, do not use majority vote (see below).
    - Without data, you must rely on domain knowledge. Consider:
        - For case types that are well-understood and within the expertise of the panel (e.g., common conditions), assume competence > 0.5.
        - For rare or complex cases (e.g., rare presentations) where even experts might perform near chance (0.5) or worse, be cautious.
        - If the case type is such that the panel is likely to be better than random (e.g., because they are trained professionals), then assume competence > 0.5. However, if the case is very difficult and even experts are often wrong, then the average might be below 0.5.
  - **Decision**:
    - If you have data and the average accuracy is below 0.5, then majority voting is counterproductive. Instead, use a smaller group of the most competent members (if known) or assign to a single expert. If no expert is available, then the named person (from Step 1) decides.
    - Without data and if the case type is such that you suspect average competence may be below 0.5 (e.g., very rare cases), then do not use majority voting. Assign to a named person or a small group of the most experienced.
    - Otherwise, if average competence is above 0.5 (by data or assumption), proceed to Step 3.

  #### Step 3: Independence and Effective Group Size
  - **Question**: How independent are the votes? What is the effective group size?
  - **Procedure**:
    - Votes are not independent if panel members are influenced by shared information (same chart, same guideline) or by each other (during discussion). The effective group size (n_effective) is the size of a hypothetical independent group that would have the same majority accuracy as your correlated group.
    - To assess independence:
        - Consider the sources of shared bias: same chart, same guidelines, same registrar's note. This introduces common errors.
        - Also, if the panel is large and members have similar training, they may think alike.
    - Without data, use a rule of thumb: 
        - For a group of size n, the effective independent size might be as low as 3-5, especially if the group is homogeneous and relies on the same information.
        - Adding more than 5-7 members in such a setting may yield diminishing returns because of high correlations.
    - If the group is diverse (e.g., different specialties, different levels of experience) and they approach the problem from different angles, then correlations might be lower and effective size closer to actual size.
  - **Decision**:
    - If the effective group size (after accounting for correlations) is too small (e.g., less than 3 independent thinkers), then a majority vote may not be reliable. In that case, consider:
        - Reducing the group to a smaller set of diverse experts who can provide independent assessments.
        - If you cannot achieve independence, then majority voting might not be better than a single expert. Consider delegating to the most competent member (if known) or the named person.
    - Otherwise, proceed to Step 4.

  #### Step 4: Protocol for Voting and Discussion
  - **Question**: How to structure the panel meeting to balance independence and the benefits of discussion?
  - **Procedure**:
    - The trade-off: Discussion can improve individual judgments (by sharing knowledge) but can also reduce independence (by creating conformity). 
    - Recommended protocol for when CJT applies (ground truth, competence>0.5, and reasonable independence):
        1. **Blind vote first**: Have each member write down their initial vote (yes/no) without discussion. This captures independent judgments.
        2. **Deliberate**: Open discussion, allowing members to share their reasoning and challenge each other.
        3. **Re-vote**: After discussion, take a second vote (by show of hands or ballot). The final decision is based on the majority of the second vote.
    - Why this works: The first vote preserves independence for the CJT. The discussion can correct individual errors and the second vote aggregates the post-discussion judgments. Research (e.g., from deliberative democracy) suggests that this two-step process often outperforms either alone.
    - Do not show a running tally during the first vote to avoid anchoring.
    - If the group is too large (e.g., 9 people) and you are concerned about the effective group size (Step 3), then after the first vote, you might break into smaller groups for discussion and then reconvene for the second vote.
  - **Decision**: Use the two-step (blind vote then deliberate then re-vote) for cases where CJT applies. For other cases (values or no ground truth), skip the voting and focus on deliberation to build consensus and clarify values, then the named person decides.

  #### Step 5: Weighting
  - **Question**: Should we weight votes by seniority?
  - **Procedure**:
    - Weighting by seniority (or any other factor) is only justified if it tracks with higher accuracy for the specific case type.
    - Without evidence (calibration data) that seniority correlates with accuracy for this case type, do not weight. Unweighted majority is the default.
    - If you have data showing that certain members (or roles) are consistently more accurate for a case type, then you could use weighted voting (e.g., give more weight to a radiologist in an imaging recall decision). However, this requires ongoing tracking and validation.
  - **Decision**: Unless you have case-type-specific evidence that a subset of the panel is more competent, use unweighted majority. If evidence exists, consider a weighted majority or even delegating to the high-competence subgroup.

  ### Handling Forecasts vs. Facts
  - **Hunch**: For forecasts (probabilistic events) rather than fixed facts, aggregating probabilities (averaging) is often better than majority vote on a binary outcome.
  - **When to switch**:
    - If the question is about a future event (e.g., "What is the probability that this patient deteriorates in the next 24 hours?") and the panel members can express their judgment as a probability, then use averaging of probabilities (the "linear opinion pool").
    - However, this requires that panel members are reasonably calibrated (i.e., when they say 70%, it happens about 70% of the time). Without calibration data, simple averaging might still be better than majority vote for forecasts, especially if the event is not rare.
    - If the panel is not trained in probability assessment, then stick to binary votes for simplicity.
  - **Practicality**: For your setting, if the question is a forecast and the panel can provide probabilities, then ask for individual probabilities, average them, and then use a threshold (e.g., if average probability > 0.5 then escalate) but note that the threshold is a values call (Step 1). Without calibration, the average might be off, but it's still a reasonable approach.

  ### Flagging Judgment Calls and Data-Poor Steps
  We will mark the steps that are judgment calls and where the procedure stops for human decision:
  - **Step 1**: Judgment call about ground truth. If no ground truth, stop and hand to a named person (because it's a values question).
  - **Step 2**: Judgment call about average competence when data is absent. If we assume competence>0.5 without data, that's a judgment. If data-poor and we suspect competence<0.5, stop and hand to a named person (because we are data-poor and CJT doesn't apply).
  - **Step 3**: Judgment call about independence and effective group size. We are data-poor (no formal measure of correlation) so we use rules of thumb. If the effective group size is too small, stop and hand to a named person or a smaller group (data-poor).
  - **Step 4**: Procedure (no stop).
  - **Step 5**: Judgment call if weighting is used without data (not recommended). Without data, use unweighted.

  ### Running the Cases

  #### Case (a): Recall-or-not on a screening mammogram
  - **Step 1**: Ground truth exists (malignancy will be determined by follow-up). CJT applies.
  - **Step 2**: Average competence: You have outcome data (about a year later). Check if average accuracy of the readers is above 0.5. For mammograms, readers are typically above 0.5 (but not perfect). If data shows average accuracy >0.5, proceed. If not, assign to the best reader (if known) or named person. (Since you have data, use it.)
  - **Step 3**: Independence: Five readers, same images. They are likely to have some shared biases (same image, same guidelines) but also individual expertise. Effective group size might be less than 5 but probably above 3. Proceed.
  - **Step 4**: Protocol: Blind vote first, then discuss, then re-vote. Use majority in the re-vote.
  - **Step 5**: Weighting: Without evidence that seniority tracks accuracy, use unweighted. (But note: in radiology, experience matters, so if you have data that consultants are better, consider weighting. Otherwise, no.)
  - **Forecast?**: This is a fact (malignant or not) but the image finding is a predictor. Since the question is binary (recall or not), majority vote is appropriate.

  #### Case (b): Escalate a borderline patient tonight
  - **Step 1**: Ground truth? The outcome (what would have happened without escalation) is never observed. However, the decision is about a forecast: "Will the patient deteriorate if not escalated?" There is a ground truth (the future event), but note: by escalating, you change the outcome. So the counterfactual is not observable. This is tricky. 
    - **Judgment**: We can treat it as a forecast with an unobservable outcome. CJT might apply if we believe the panel is predicting an objective event (deterioration) that would occur absent intervention. However, the decision to escalate is also a values call (how much risk is acceptable). 
    - **Decision**: This is a hybrid. The forecast part (probability of deterioration) might be aggregated by probabilities (if panel can estimate), but the decision to escalate also depends on risk tolerance (values). Therefore, Step 1: Partly a values call. 
    - **Procedure**: 
        - Split the decision: First, have the panel estimate the probability of deterioration (if not escalated). Use probability averaging (if feasible). 
        - Then, the named person (on-call consultant) decides on escalation based on the average probability and their risk tolerance (values). 
    - Alternatively, if you must make a binary decision without probabilities, then treat the forecast as a fact and use CJT, but note that the outcome is unobserved so you cannot validate competence. 
  - **Step 2**: Competence: No outcome data (since counterfactual is unobserved). Assume competence>0.5? For borderline cases, it might be near 0.5. Judgment call: if the panel has expertise, assume >0.5. But if it's a very uncertain case, then average competence might be near 0.5 and majority vote might not help. 
    - Given the uncertainty, it might be better to have the named person decide, using the panel's input as advisory. 
  - **Step 3 and beyond**: If using CJT, proceed as in (a), but note the limitations.

  #### Case (c): Rare presentation, two seniors disagree
  - **Step 1**: Ground truth? Likely exists (e.g., the correct diagnosis or treatment), but it might be difficult to ascertain. CJT might apply.
  - **Step 2**: Competence: Rare case, panel members have seen only a couple. Average competence might be around 0.5 or even below (because of inexperience). Without data, this is a judgment call. Given that even the seniors disagree, it's likely that the average competence is not much above 0.5. 
    - **Decision**: Do not use majority vote because average competence may be <=0.5. Instead, assign to a named person (e.g., the most senior expert available, even if not in the room) or seek external consultation. 
  - **Stop**: Because we are data-poor and competence is likely low.

  ### Answering Your Suspicions
  - You suspected that at least one case would give an answer you don't want. Case (b) and (c) do:
    - **Case (b)**: We conclude that it's partly a values call and the forecast aspect might be better handled by probability averaging (if feasible) but then the named person must decide based on risk tolerance. Majority voting on a binary decision is not ideal because of the unobservable counterfactual and the values component.
    - **Case (c)**: Majority voting is not recommended because average competence is likely low. You have to hand it to a named person or seek more expertise.

  ### Summary of the Procedure
  1. **Ground Truth Check**: If no ground truth (values call or outcome constituted by decision), assign to a named person. Else, proceed.
  2. **Competence Check**: If data shows average accuracy >0.5, proceed. If data shows <0.5, assign to a named person or small group of best. Without data, assume >0.5 for common cases, but for rare/difficult cases, assume <=0.5 and assign to named person. 
  3. **Independence Check**: Estimate effective group size (rule of thumb: homogeneous group with shared info -> effective size ~3-5). If effective size too small (e.g., <3), assign to named person or smaller diverse group. Else, proceed.
  4. **Protocol**: Use blind vote -> discussion -> re-vote. Final decision by majority of re-vote.
  5. **Weighting**: Use unweighted majority unless you have case-type-specific evidence that a subset is more accurate.

  For forecasts, use probability averaging if feasible (and then apply a threshold by the named person if it's a values call). Without calibration, it's still a reasonable alternative to binary majority.

  This procedure is designed to be completed in 15 minutes by a facilitator (you) before the panel meets. It uses judgment calls where data is poor and stops to delegate when CJT conditions are not met.
answer: |-
  Below is a practical decision procedure based on your requirements, incorporating Condorcet jury theorem (CJT) insights while flagging judgment calls and data limitations. It's designed for a 15-minute pre-panel setup, usable by non-statisticians. The core principle: **Use CJT-style voting only when it adds value; otherwise, default to a named decision-maker.**  

  ---

  ### **Decision Procedure**  
  *Run this checklist before each panel meets.*  

  #### **1. Ground Truth Check: "Is there a right answer?"**  
  - **Procedure:**  
    - *If the decision is about...*  
      - **Objective facts** (e.g., "Is this mammogram suspicious?" → outcome later verified) → **CJT applies**.  
      - **Values/risk tolerance** (e.g., "Is this discharge *acceptably* safe?") → **Not CJT**.  
      - **Self-fulfilling forecasts** (e.g., escalating a patient changes their outcome) → **Not CJT**.  
  - **Judgment call:** Distinguish "what will happen" (CJT) vs. "what should we do" (values).  
  - **Decision:**  
    - **CJT applies?** → Proceed to Step 2.  
    - **Not CJT?** → **Delegate to named person** (e.g., on-call consultant). *Stop here.*  

  #### **2. Competence Check: "Is average accuracy >50%?"**  
  - **Procedure:**  
    - Use **outcome data** if available (e.g., mammogram recalls with follow-up). Calculate historical accuracy for this case type.  
    - *No data?* → Estimate:  
      - Common cases (e.g., routine escalation): Assume **competence >50%** (professionals > coin flip).  
      - Rare/ambiguous cases (e.g., zebras): Assume **competence ≤50%** (experts often disagree).  
  - **Judgment call:** When data absent, lean on case typicality. Rare = low competence.  
  - **Decision:**  
    - **Competence >50%?** → Proceed to Step 3.  
    - **Competence ≤50%?** → **Delegate to named person**. *Stop here.*  

  #### **3. Independence Check: "What’s the effective group size?"**  
  - **Procedure:**  
    - Assess sources of bias:  
      - Shared info? (e.g., same chart/guideline) → **High correlation**.  
      - Diverse roles? (e.g., nurse + radiologist + surgeon) → **Lower correlation**.  
    - Rule of thumb:  
      - Homogeneous group (same role/same info) → **Effective size = min(4, actual size)**.  
      - Heterogeneous group → **Effective size = min(6, actual size)**.  
  - **Judgment call:** Correlation kills CJT benefits. A 9-person panel with shared bias ≈ 3 independent voters.  
  - **Decision:**  
    - **Effective size ≥3?** → Proceed to Step 4.  
    - **Effective size <3?** → **Small group (3–4 diverse voters) or delegate**. *Stop here.*  

  #### **4. Voting Protocol: "Blind votes first?"**  
  - **Procedure:**  
    - **Always start with blind written votes** → preserves independence.  
    - **Then deliberate** → corrects individual errors.  
    - **Re-vote if:**  
      - Initial vote is split (no clear majority).  
      - New evidence emerges during discussion.  
    - **Never show tallies** → prevents herding.  
  - **Why:** Blind voting protects CJT’s independence assumption; discussion adds insights without wrecking CJT if re-vote follows.  

  #### **5. Weighting: "Seniority = accuracy?"**  
  - **Procedure:**  
    - **Never weight by seniority** without evidence.  
    - *Exception:* If you have **case-type-specific data** showing a role’s accuracy (e.g., radiologists > nurses on imaging recalls), give them **2 votes**.  
  - **Judgment call:** Seniority ≠ accuracy. Unweighted majority is default.  

  ---

  ### **Handling Forecasts vs. Facts**  
  - **Use probability averaging when:**  
    - The question is a **forecast** (e.g., "Probability this patient deteriorates tonight?").  
    - Panelists can **quantify uncertainty** (e.g., "60% chance").  
  - **Switch to majority voting when:**  
    - Forecasts are **binary** (e.g., "Will they deteriorate? Yes/No").  
    - Panelists **can’t calibrate probabilities** (e.g., no training/frequency data).  
  - **Brutal truth:** Probability averaging **requires calibration** (e.g., tracking if "60% forecasts" happen 60% of the time). Without this, it’s guesswork. Default to binary voting.  

  ---

  ### **Case Applications**  

  #### **Case (a): Recall on screening mammogram**  
  - **Ground truth:** Yes (biopsy confirms).  
  - **Competence:** >50% (data exists; radiologists > random).  
  - **Independence:** Low (same image/guideline); effective size ≈4 even with 5 voters.  
  - **Protocol:** Blind vote → discuss → re-vote.  
  - **Verdict:** **Use CJT voting** (but 5th voter adds little; cap at 4).  

  #### **Case (b): Escalate borderline patient**  
  - **Ground truth:** No (outcome unobservable; escalation changes trajectory).  
  - **Competence:** Unmeasurable → assume ≤50% for borderline cases.  
  - **Judgment:** Self-fulfilling + values call (risk tolerance).  
  - **Verdict:** **Delegate to named person**. CJT adds false confidence.  

  #### **Case (c): Rare presentation, seniors disagree**  
  - **Ground truth:** Hypothetically yes, but unknown.  
  - **Competence:** Likely ≤50% (rare case; low experience).  
  - **Independence:** Irrelevant (competence too low).  
  - **Verdict:** **Delegate immediately**. Majority voting dangerous here.  

  ---

  ### **Key Takeaways**  
  1. **CJT is narrow:** Only use for verifiable facts with competent, independent voters.  
  2. **You’ll hate this:** **Most escalation/discharge decisions aren’t CJT-appropriate** (values/unknowable outcomes). Default to named person.  
  3. **Data poverty is real:** Competence/independence often rely on assumptions. When in doubt, delegate.  
  4. **Practical fix:** **Cap panels at 4–5 diverse voters** (more adds noise). Always blind-vote first.  

  This procedure prioritizes safety over theory. When CJT assumptions fail (often!), it falls back on human responsibility—no laundering.
