prompt: |-
  I teach a second-year undergraduate seminar on rational choice and decision theory: 22 students, one 75-minute session, mixed majors, most of them with only an introductory logic course behind them. The next session is on ambiguity, and I want them to run into the phenomenon before I name it. Specifically, I want them to discover that they will pay more for a bet on a draw from a bag whose composition they know than for the nominally identical bet on a bag whose composition they do not know, to notice that this happens for both colours and not just one, and then to be faced with the fact that their four valuations cannot all be read as probabilities without contradicting each other. No lecture at the front: the pattern has to come out of choices they actually make, and the naming comes after the last round.

  Some constraints and some things I would like tried. Materials are limited to opaque bags, coloured poker chips, index cards and a projector; no money changes hands, and payoffs need to be points toward a genuinely trivial prize, so the incentives have to be honest without being real. I do not want the standard version in which I secretly fix the composition of the ambiguous bag and they merely bet on it. I would rather the ambiguity be constructed by the participants: before any betting, each student writes down the interval of proportions they regard as genuinely unnarrowable — say, red anywhere between 20 and 80 per cent — and the class aggregates these into the range the ambiguous bag is then drawn from. My thought is that this makes the aversion attach to the spread of their own uncertainty rather than to anything about the physical bag, but I am not confident it works and I would like your view on whether it does or whether it just muddies the setup.

  I also want a round in which they price, rather than merely choose between, four tickets: a bet on red from the known bag, a bet on black from the known bag, and the same two bets on the ambiguous bag — writing a number in points for each, so that whatever incoherence is there can be read straight off the four numbers afterwards rather than inferred from a pattern of forced choices. And I want two further comparisons. First, a chance to buy, with points, the removal of the ambiguity: a sample drawn from the ambiguous bag in advance and revealed to them only after they have committed, so that I can see what the reduction in uncertainty is worth to them. Second, a pair of cases in which the ambiguous bag's composition is fixed either by a randomly selected classmate who is rewarded when the bettor loses, or by an impersonal random mechanism identical in every other respect. The point of that pair is to pry apart genuine aversion to unknown probabilities from the ordinary thought that someone is out to get them; whether the two come out the same or differently, tell me what the result would show and what I should say about it.

  Please give me: the rules and materials; the exact sequence of rounds with timings; how the scoring works so that the numbers they write are incentive-compatible in an honest if approximate sense; what goes on the board and when, given that nothing may be written down before the reveal that tips the structure of the argument; and a debrief that maps particular moments in the session onto particular features of the case — the reversal across the two colours, what it would take for a valuation to be additive, and what the sure-thing principle asks of them here. Tell me what will predictably go wrong the first time I run it, including the most likely way students will try to game the scoring. And be frank about which part of the phenomenon the activity cannot generate and which part I will simply have to state: I would rather know in advance where the game stops and the talking starts.

  Respond as a numbered list of exactly five items, each two or three sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is teaching a seminar on rational choice and decision theory to second-year undergraduates. They want to create a hands-on session about ambiguity aversion where students discover the phenomenon through their own choices before learning the formal concepts. The session needs to involve bets using poker chips in bags, with scoring through points toward a trivial prize. 

  The user has several specific requirements: students should help define the ambiguous bag's composition range through their own uncertainty intervals; they need to price four different bets (red/black in known vs ambiguous bags); they should value ambiguity reduction through advance sampling; and they need to compare ambiguity created by classmates versus random mechanisms to separate probability aversion from mistrust.

  I need to design a sequence that meets all these constraints while ensuring incentive-compatible scoring. The point system must make honest valuation optimal without real money. The Ellsberg paradox pattern should emerge naturally from their pricing behavior, showing higher values for known-probability bets regardless of color. The reveal of valuations should highlight the non-additivity that violates probability axioms.

  For the ambiguous bag construction, having students submit uncertainty intervals and aggregating them makes sense - it roots aversion in their own expressed uncertainty. The pricing round using Becker-DeGroot-Marschak mechanism with random prices should incentivize truthful revelation. Comparing adversary vs random ambiguity sources will test whether aversion stems purely from unknown probabilities or includes suspicion of manipulation.

  Predictable issues include students misjudging the BDM mechanism and writing strategic prices, or failing to recognize the valuation pattern requires both colors showing ambiguity aversion. The activity won't generate the strict preference reversal of the classic Ellsberg two-urn problem since we're using pricing rather than pairwise choices - that aspect will need explicit discussion during debrief.

  The debrief should connect each experimental stage to decision theory concepts: valuation differences illustrating ambiguity aversion, the non-additivity contradicting probabilistic beliefs, the sure-thing principle violation when ambiguity removal is valued differently depending on source, and how this distinguishes uncertainty from risk.
answer: |-
  1.  **Materials & Setup:** Use two opaque bags: Bag K (known composition, e.g., 50 red, 50 black chips) and Bag A (initially empty). Provide each student with index cards and a unique ID. Project a simple points-to-prize conversion (e.g., 100 points = candy bar). Explain all scoring uses the Becker-DeGroot-Marschak (BDM) mechanism: they write a price (Willingness-To-Pay in points), a random price is drawn (say, 0-100), and they "buy" only if their price ≥ random price, winning the bet's payoff (e.g., 100 points) minus the random price if correct, or losing the random price if wrong. This incentivizes truthful valuation as their optimal bid is their true certainty equivalent.
  2.  **Sequence & Ambiguity Construction (30 mins):** a) **Uncertainty Intervals:** Students write their name/ID and the min/max % red they think plausible for an unknown bag on a card (e.g., "Red: 30%-70%"). Collect, shuffle, display range (e.g., Min:20%, Max:80%). Fill Bag A randomly within this class-agreed range (e.g., 35 red, 65 black). b) **Pricing Round:** Students simultaneously price four tickets on separate cards (ID on each): Bet on Red/K, Black/K, Red/A, Black/A. Collect all cards immediately. c) **Ambiguity Removal Value:** Students price (one card, ID) the option to see one random chip from Bag A *after* they commit to a price but *before* the bet outcome is known (this reveals the bag's true composition). Collect cards.
  3.  **Adversarial vs Random Ambiguity (20 mins):** a) **Random Mechanism:** Announce Bag A will be refilled *randomly* within the class range (e.g., use RNG). Students price a new Bet on Red/A and Bet on Black/A. Collect cards. b) **Adversarial Mechanism:** Secretly assign each student an "adversary" ID. Each student writes a red% for their adversary's Bag A *to minimize the adversary's expected points* if betting Red. Collect these compositions. Randomly assign adversary bags to students. Students price Bet on Red/A and Bet on Black/A *against their assigned adversary's bag*. Collect cards.
  4.  **Reveal, Calculation & Debrief Start (15 mins):** Project the class-aggregated range for Bag A and its actual composition. Calculate & display median prices for each of the 4 initial tickets. **Key Reveal:** Show median price(Red/K) > median price(Red/A) *and* median price(Black/K) > median price(Black/A). Highlight that valuing both known-bag bets higher than ambiguous-bag bets suggests aversion to not knowing the probability, for *both* colors. Point out that if prices reflected probability beliefs, P(Red/K) + P(Black/K) ≈ 1, but P(Red/A) + P(Black/A) < 1, violating additivity.
  5.  **Debrief Continuation & Limits (10 mins):** Show value placed on ambiguity removal and compare median prices for Red/A/Black/A under random vs. adversarial mechanisms. Note if adversarial prices are lower, it suggests mistrust amplifies aversion; if similar, aversion is mainly to unknown probability. **State the limits:** The pricing shows aversion but doesn't replicate the strict *preference reversal* of classic Ellsberg choices (e.g., preferring K-red over A-red *and* K-black over A-black simultaneously); you must state this key pattern explicitly. Also, explain that the BDM mechanism ensures approximate honesty, but students might still under-bid strategically if they misapply game theory; emphasize that true personal value is optimal. Link the additivity violation to the Sure-Thing Principle: knowing the exact probability (Bag K) is preferred regardless of the specific color (Red or Black).
