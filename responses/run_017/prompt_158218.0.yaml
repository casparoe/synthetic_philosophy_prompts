            2. Knowledge problem: Even when everyone was truthful, the planning group (and the spreadsheet) did not know the context behind the numbers. For example, in Part2, round4, the production drop was temporary, but the center increased the price. Then in round5, when the shock was gone, the price was too high and there was a surplus. The center had no way to know the shock was temporary.

        - Then we can name the economists and the debate.

    Finally, what the game cannot stage:

        - The activity does not show how a real market might handle local knowledge: through direct communication between buyers and sellers, or through entrepreneurs who spot profit opportunities. We only have a central planner and no decentralized exchange.
        - We also do not show how market prices might emerge from actual trades and how they carry rich information about relative scarcities.

    We will have to state in the debrief that a market system allows for decentralized decision-making based on local knowledge, and the price signal aggregates information without needing a central body to collect reports.

