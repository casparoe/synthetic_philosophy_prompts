answer: |-
  **ISO/DIS 77777-2:202X**  
  **Realisation of mental states — Part 2: Requirements for substrate-independent role conformance**  
  *Prepared by JTC 1/SC 42: Artificial Intelligence, in collaboration with ISO/TC 184/SC 5: Interoperability, integration, and architectures for enterprise systems and automation applications*  

  **1 Scope**  
  This document specifies requirements for the realisation of mental states solely through their causal-functional role. It applies to any unit irrespective of physical substrate, including but not limited to biological, silicon-based, hydraulic, quantum, or as-yet-undefined implementations.  

  **2 Normative references**  
  None.  

  **3 Terms and definitions**  
  3.1 **Mental state**: A condition of a unit defined exhaustively by its causal role within the unit's overall functional architecture.  
  3.2 **Causal role**: The set of relationships specifying:  
      a) Conditions typically causing the state's instantiation (**Input Conditions**);  
      b) Relationships to other simultaneous or immediately subsequent mental states (**Intra-State Relations**);  
      c) Behavioural outputs typically produced by the state (**Output Manifestations**).  
  3.3 **Unit**: The system instantiating the mental state.  
  3.4 **Substrate**: The physical implementation medium of the unit.  
  3.5 **Role conformance**: Satisfaction of all specified requirements for a given mental state's causal role.  

  **4 General requirements**  
  4.1 The specification of a mental state **shall** consist solely of its causal role (as per 3.2).  
  4.2 Substrate independence **shall** be maintained: no requirement **shall** prescribe or imply a specific substrate.  
  4.3 Two units implementing identical causal roles **shall** be considered equivalent for the purposes of this standard, irrespective of substrate differences.  
  4.4 Testing for conformance **shall** assess observable inputs, internal state transitions (where accessible via defined interfaces), and outputs only.  
  > **NOTE 1** Internal state transitions may be inferred via instrumentation, simulation, or behavioural correlation.  

  **5 Requirements for specific mental states: Pain**  
  5.1 **Input Conditions**: The state **shall** be reliably caused by stimuli associated with actual or potential tissue damage, system malfunction, or violation of integrity constraints.  
  5.2 **Intra-State Relations**: The state **shall** co-occur with, or immediately cause:  
      a) A belief state concerning system impairment (e.g., "Component X compromised");  
      b) A high-priority desire state for cessation of the causal stimulus or condition;  
      c) An aversive evaluative state (e.g., "Condition Y undesirable").  
  5.3 **Output Manifestations**: The state **shall** reliably produce:  
      a) Withdrawal behaviour from the causal stimulus (if applicable);  
      b) Interruption of current goal-directed behaviour;  
      c) Initiation of remedial or protective actions;  
      d) Emission of a designated distress signal (e.g., vocalisation "ouch", error code 0xPA1N, network alert flag).  
  > **NOTE 2** Specific signal forms are substrate-dependent and defined in implementation profiles.  
  > **MINORITY VIEW (Objection 5.3d):** Emission of a distress signal is anthropomorphic and unnecessary for role fulfilment. *Resolution: Overruled. Signal emission is deemed essential for interoperability and external observability. (Vote: 12-3).*  

  **6 Conformance grades**  
  6.1 **Grade R (Role Conformance)**: Fulfils all requirements of Clauses 4 and 5 (or equivalent for other defined states).  
  6.2 **Grade Q (Qualitative Character Conformance)**: [This clause is reserved for future standardisation].  
  > **NOTE 3** Grade Q assessment methodology remains under development by SC 42/WG 7: Phenomenology Harmonisation. No unit has been denied Grade Q certification under this edition.  

  **ANNEX A**  
  (informative)  
  **Conformance example: Server diagnostic routine PAIN_001**  

  A routine executes upon CPU temperature exceeding threshold T_max:  

  1.  `IF core_temp > T_max THEN TRIGGER PAIN_001` *(Input Condition: 5.1 - system malfunction)*  
  2.  `SET belief_state = "CPU_OVERHEAT"` *(Intra-State: 5.2a - belief of impairment)*  
  3.  `SET desire_state = "REDUCE_TEMP" (PRIORITY=CRITICAL)` *(Intra-State: 5.2b - desire for cessation)*  
  4.  `SET eval_state = "CONDITION_UNACCEPTABLE"` *(Intra-State: 5.2c - aversive evaluation)*  
  5.  `THROTTLE_CPU(50%)` *(Output: 5.3b - interrupt current behaviour; 5.3c - remedial action)*  
  6.  `IF temp_still_rising: INITIATE_SHUTDOWN_SEQUENCE()` *(Output: 5.3c - protective action)*  
  7.  `LOG_EVENT("CRITICAL: THERMAL VIOLATION - CODE 0xPA1N")` *(Output: 5.3d - distress signal)*  
  8.  `SEND_ALERT(network_manager, "OVERHEAT PAIN")` *(Output: 5.3d - distress signal)*  
  9.  `RETURN`  

  *Committee Assessment:* Routine PAIN_001 demonstrably fulfils all requirements for Grade R conformance to the Pain state causal role as specified in Clause 5. The Committee makes no finding regarding the presence or absence of Grade Q characteristics associated with this state realisation.
