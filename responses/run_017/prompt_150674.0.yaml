  ### Moral Status Decision Tree  
  **Purpose:** To sort readers by their implicit moral commitments using concrete cases, avoiding academic labels. The tree has 5 key questions, leading to 14 distinct positions (leaves). Each question is phrased as a case or claim a layperson can engage with. Empty cells are analyzed for coherence.  

  ---

  #### **Decision Tree Structure**  
  1. **Question 1 (Valence Requirement):**  
     *You encounter a robot crab that perfectly mimics a live crab’s behavior (avoids heat, reacts to damage, etc.). Would replacing the live crab with this robot be morally acceptable?*  
     - **Yes:** Moral status requires only functional behavior. Go to Q2.  
     - **No:** Moral status requires valenced experience (pleasure/pain). Go to Q3.  

  2. **Question 2 (Functional Equivalence):**  
     *A smart thermostat adjusts temperature to match a setpoint and "corrects errors." Does it deserve moral consideration for its goal-directed behavior?*  
     - **Yes:** Moral status arises from functional organization alone. → **Leaf: Strong Functionalism**  
     - **No:** Functional organization is insufficient without consciousness. → **Leaf: Mind-Only Functionalism**  

  3. **Question 3 (Binary vs. Scalar Capacity):**  
     *A nematode worm flees harm but cannot learn to avoid it. Does it have any moral weight?*  
     - **Yes:** Moral capacity is scalar (comes in degrees). Go to Q4.  
     - **No:** Moral capacity is binary (requires learning/avoidance). Go to Q5.  

  4. **Question 4 (Aggregation vs. Threshold):**  
     *In a welfare trade-off, could 1,000 suffering insects ever morally outweigh one suffering pig?*  
     - **Yes:** Moral weight aggregates across individuals. → **Leaf: Aggregating Gradient**  
     - **No:** Beings above a threshold (e.g., pigs) command unique duties; insects cannot outweigh them. → **Leaf: Threshold Gradient**  

  5. **Question 5 (Uncertainty Response):**  
     *Black soldier fly larvae show nociception but no response to analgesics. Given uncertainty about their pain, should we err on the side of caution?*  
     - **Yes:** Precaution is required. Go to Q5a.  
     - **No:** Treat as non-conscious without proof. → **Leaf: Certainty Requirement**  
     - **Q5a:** *Should precaution scale with the probability of consciousness or the stakes of suffering?*  
       - **Probability:** → **Leaf: Probability-Weighted Precaution**  
       - **Stakes:** → **Leaf: Stakes-Weighted Precaution**  

  ---

  #### **Leaves of the Tree (14 Positions)**  
  | Leaf Name                     | Answer Path                   | Awkward Commitment                                                                 |  
  |-------------------------------|-------------------------------|------------------------------------------------------------------------------------|  
  | **1. Strong Functionalism**   | Q1:Y → Q2:Y                   | Must grant moral weight to thermostats or error-correcting algorithms.             |  
  | **2. Mind-Only Functionalism**| Q1:Y → Q2:N                   | Denies status to crabs but accepts it for AI with "distress tokens" if functional. |  
  | **3. Aggregating Gradient**   | Q1:N → Q3:Y → Q4:Y            | Allows trading vast insect suffering for trivial human benefit.                    |  
  | **4. Threshold Gradient**     | Q1:N → Q3:Y → Q4:N            | No number of bee colonies can outweigh a single pig’s suffering.                   |  
  | **5. Certainty Requirement**  | Q1:N → Q3:N → Q5:N            | Treats larvae as disposable since pain isn’t proven.                               |  
  | **6. Probability Precaution** | Q1:N → Q3:N → Q5:Y → Q5a:Prob| Demands costly safeguards for systems with 0.1% consciousness probability.         |  
  | **7. Stakes Precaution**      | Q1:N → Q3:N → Q5:Y → Q5a:Stks| Prioritizes preventing worst-case suffering (e.g., insect farms) over likelihood.  |  
  | **8. Personhood Threshold**   | Q1:N → Q3:N → Q5:N            | Grants rights only to beings with self-models (excludes nematodes/honeybees).      |  
  | **9. Indirect-Duty View**     | *[See Note 1]*                | Cruelty to crabs is wrong only because it coarsens human character.                |  
  | **10. Quietism**              | *[See Note 1]*                | No fact about borderline cases; insect welfare standards are arbitrary conventions.|  
  | **11. Global Broadcast View** | *[See Note 2]*                | Denies status to creatures with only local neural loops (e.g., no "global" pain).  |  
  | **12. Valence-Only Scalar**   | *[See Note 2]*                | Counts pain in fruit flies but ignores agency in AI.                               |  
  | **13. Non-Integrated Hybrid** | *[See Note 3]*                | Demands precaution for AIs but rejects it for plants.                              |  
  | **14. Agency Hybrid**         | *[See Note 3]*                | Values goal-directed AI but dismisses reflexive creatures (e.g., non-learning worms).|  

  **Notes on Leaves:**  
  - *Note 1 (Fixed Positions):* **Indirect-Duty View** and **Quietism** are fixed endpoints (no unique path). They answer:  
    - *Indirect-Duty:* "Moral status derives from human duties, not intrinsic properties."  
    - *Quietism:* "Borderline cases have no objective moral truth; debates are verbal."  
  - *Note 2 (Path from Q3:Y):* **Global Broadcast View** (Q3:Y → Q4:N + "global broadcast matters") and **Valence-Only Scalar** (Q3:Y → Q4:Y + "only valence counts") share Q3:Y but diverge on aggregation/broadcast.  
  - *Note 3 (Hybrids):* **Non-Integrated Hybrid** (precaution for uncertain systems but not simple life) and **Agency Hybrid** (status for agency even without valence) are occupied hybrids.  

  ---

  #### **Diagnostic Notes**  
  1. **Indistinguishable Pair:**  
     - **Global Broadcast View** and **Self-Model Threshold** both deny status to nematodes/honeybees but for different reasons (global integration vs. self-representation). This is a verbal difference: one emphasizes information architecture, the other cognitive depth.  

  2. **Empty Cells & Why They’re Vacant:**  
     | Cell (Answer Pattern)             | Status              | Reason                                                                 |  
     |-----------------------------------|---------------------|------------------------------------------------------------------------|  
     | Q1:Y → Q2:Y → Scalar/Aggregation  | Incoherent          | Strong functionalism denies valence, so scalar valence is irrelevant.  |  
     | Q1:N → Q3:N → Aggregate           | Incoherent          | Binary views reject degrees; aggregation requires scalarity.           |  
     | Q1:Y → Precaution for uncertainty | Unattractive        | Functionalists reject "inner states," making precaution nonsensical.   |  
     | Q1:N → Q3:Y → Deny precaution     | Unexplored          | Possible but rare; no major theorists defend ignoring uncertainty.     |  
     | Q2:N → Valence required           | Incoherent          | Q2:N already rejects functionalism; valence is a separate question.    |  

  ---

  #### **Compressed 8-Question Scoring Key**  
  *For print version; assigns readers to 8 broad positions. Loses resolution in hybrids and nuanced distinctions.*  
  1. **Crab Robot Test:** Accept replacement? (Y/N)  
  2. **Valence Claim:** Moral status requires pain/pleasure? (Y/N)  
  3. **Nematode Test:** Does a non-learning creature fleeing harm have weight? (Y/N)  
  4. **Insect-Pig Trade-off:** Can insects outweigh a pig? (Y/N)  
  5. **Larvae Uncertainty:** Precaution without proof of pain? (Y/N)  
  6. **Precaution Scaling:** If yes to #5, scale by probability or stakes? (Prob/Stks)  
  7. **Global Broadcast:** If no to #3, does global neural broadcast matter? (Y/N)  
  8. **Distress Token:** Honor an AI’s distress signal without understanding it? (Y/N)  

  **Where Compression Loses Resolution:**  
  - Merges **Threshold Gradient** and **Non-Aggregating Gradient** into one anti-aggregation stance.  
  - Cannot distinguish **Strong** vs. **Mind-Only Functionalism** (lumps both under functionalism).  
  - Omits **Quietism** and **Indirect-Duty** (requires explicit opt-in).  
  - Flattens hybrids into nearest neighbors (e.g., **Agency Hybrid** becomes functionalism).  

  ---  
  **Tree Logic:** Built from cases → principles → positions, ensuring lay accessibility. Combines your candidate cases with logical constraints (e.g., scalar aggregation requires scalarity). Positions derived from combinations, not schools.
