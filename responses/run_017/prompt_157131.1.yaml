  | D    | No     | –      | Yes    | –      | Yes    | –      | –      |
  | E    | No     | –      | Yes    | –      | No     | –      | –      |
  | F    | No     | –      | No     | –      | –      | Yes    | –      |
  | G    | No     | –      | No     | –      | –      | No     | Yes    |
  | H    | No     | –      | No     | –      | –      | No     | No     |

  **2. Table of Unoccupied Combinations**  
  Combinations not leading to a leaf are unattractive or unexplored:  
  - **Node 1=Yes, Node 2=Yes, Node 4=Yes/No**: Unattractive—claiming memory persists without access contradicts intuitive phenomenology.  
  - **Node 1=No, Node 3=Yes, Node 5=Yes/No, Node 6=Yes/No**: Unexplored—no known position accepts cognitive systems include non-conscious controllers but rejects shared knowledge or altered beliefs.  
  - **Node 1=No, Node 3=No, Node 6=Yes, Node 7=Yes/No**: Incoherent—if beliefs change via sync errors (Node 6=Yes), neural interfaces (Node 7) shouldn't be treated differently.  

  **3. Indistinguishable Leaves and Further Questions**  
  - **B (Extended Mind) vs. F (Embedded)**: Both say beliefs change in sync-error cases (Nodes 4/6=Yes). To separate, ask: "If the device were destroyed, would you lose the ability to form beliefs or just information access?" (Substantive—probes constitution vs. causation).  
  - **G (Conservative Exceptions) vs. H (Conservative Rejection)**: Both reject most extension. To separate, ask: "Is a surgically implanted memory chip part of your mind?" (Substantive—probes boundaries of biological integration).  
  - **Node 3 (Homeostatic Controller)**: A "Yes" may arise from two reasons: (1) cognitive systems include any self-regulating process (Mind Boundary focus), or (2) non-representational functions are cognitive if they maintain agency (Agency focus). This doesn't split leaves but highlights conflation.  

  **4. Node-Specific Conflation Flags**  
  - **Node 1 (Indistinguishability)**: Conflates Mind Boundary ("same beliefs?") and Unit of Explanation ("individual vs. system").  
  - **Node 3 (Homeostatic Controller)**: Conflates Mind Boundary ("is it cognitive?") and Agency ("does it act for you?").  
  - **Node 5 (Shared Knowledge)**: Conflates Unit of Explanation ("where is knowledge?") and Answerability ("who is responsible for acting?").  

  This tree isolates positions by forcing case-based choices, exposing where disagreements stem from conflated questions. For classroom use, it can diagnose student leanings before introducing labels or theories.
