prompt: |-
  I'm finishing a dissertation chapter on the ethics of influence — specifically on where the line between persuasion and manipulation should be drawn — and there is a pattern I keep running into that I can't get the available vocabulary to fit. I'd be grateful for help placing it. Three instances. (1) A colleague chairs a hiring committee; she is privately convinced on good evidence that one candidate is stronger than the other, and she also knows this committee reliably grows careless after the fourth file of the day, so she orders the agenda accordingly and, in each discussion, raises her objections in the sequence most likely to land given what has already been said out loud. Nothing she says is false, nothing she would retract under challenge, and the objections are ones the committee would grant on reflection; asked directly, she would cheerfully explain her method. (2) A friend who wants me to leave a job I complain about constantly waits for the end of a bad fortnight before laying out — truthfully, with evidence — the considerations against staying. (3) The case that started the chapter: an assistant app I have asked to help me keep resolutions I made myself, about meetings and about my phone after ten at night. It has a fine-grained model of which of my own stated reasons, in which order, at which hour, actually moves me; it never invents a consideration, never lies, and cites only reasons I have endorsed — but it selects among them by predicted causal punch rather than by how much they bear on the question, and I find that I experience this as being handled, even though the decisions it steers me into are ones I endorse afterward and would make again.

  What I want is a carving, not a label, and I should say what I think it is not. It isn't a nudge in the usual sense, since reasons are being given and deliberation is engaged rather than bypassed, and nudges tend to be characterized precisely by working around the target's reasoning. It isn't the true-but-misleading case, since no false impression is aimed at and nothing is left out that the target would need. It isn't indifference to truth, since these speakers care about getting things right and would pay costs for accuracy. It isn't covertness or pressure or the wearing-down of repeated requests. And the account of manipulation I keep meeting in the literature — roughly, that manipulation is influence that travels by non-rational routes, by routes that would not survive idealizing the target's reasoning — seems to let all three cases off, because in each of them the influence runs straight through considerations the target accepts as reasons. My supervisor thinks the literature is right and that what I am calling being handled is just competence in argument plus self-knowledge about one's audience, and I don't yet know how to answer her.

  My own hypothesis is that the morally loaded difference is between timing and ordering chosen to fit the target's capacity to appreciate the reasons — the teacher who waits until you have slept before raising the hard point — and timing and ordering chosen to fit the target's predictable vulnerabilities so that the reasons land harder than they deserve. Is that the right joint to cut at? If it is, does the phenomenon already have a name in ethics, rhetoric, or psychology? A friend in classics tells me the rhetorical tradition has categories both for timeliness and for the arrangement of arguments, which raises the possibility that this is a named rhetorical virtue and that my worry is really about whether such a virtue can be exercised viciously. If there is no established concept, please coin one, define it tightly enough to separate it from nudging, framing, one-sided advice, and ordinary rhetorical skill, and give me boundary cases: the speaker with mixed motives, the speaker who genuinely does not know which consideration is the strongest, the case where the target has delegated the influencing to the influencer in advance, and the case where the target's best epistemic condition just is their most suggestive moment. Please also tell me plainly whether you think these cases are genuinely manipulative or merely persuasion done well, and — since I'll be defending this in a workshop — state how confident you are in each thing you claim and single out the one claim you are least sure of.
reasoning: |-
  Okay, this user is grappling with a nuanced ethical dilemma in their dissertation chapter. They've identified three specific cases where influence tactics feel morally ambiguous despite meeting standard criteria for ethical persuasion. The core tension seems to be between effectiveness and integrity in reasoning - how methods that are logically sound and factually accurate can still feel like "being handled." 

  The user's hypothesis about timing/vulnerability exploitation is sophisticated but needs testing against edge cases. Their supervisor's counterargument (that this is just competent rhetoric) suggests they'll face pushback in academic circles. The classics reference indicates they want historical grounding, while the request for coinage shows openness to conceptual innovation. 

  What makes this intellectually rich is how it straddles epistemology (what makes reasoning valid) and ethics (what makes influence permissible). The cases share three subtle features: 1) asymmetric insight into the target's psychology, 2) strategic sequencing divorced from logical priority, 3) preserved deniability through factual accuracy. 

  The literature gap they've found is real - most manipulation frameworks focus on deception or irrational triggers, but here the route is hyper-rational yet feels... engineered. Aristotle's kairos helps historically, but needs updating for intentional vulnerability exploitation. 

  Their proposed distinction between "capacity-enhancing" vs "vulnerability-targeting" timing is promising but needs refinement. The app case is especially telling because delegation complicates consent. Biggest challenge will be defending why "deserved weight" of reasons matters independently of outcome - that's where the moral loading hides.
answer: |-
  Based on your compelling cases and analysis, the core distinction you're grappling with is both perceptive and under-theorized. Your hypothesis about *timing and ordering exploiting predictable vulnerabilities vs. enhancing capacity* is the crucial joint to cut at. Here's a precise carving, terminology, boundary cases, and an assessment:

  **The Concept: Strategic Reason-Triggering (SRT)**

  *   **Definition:** Influence that employs truthful reasons (endorsed by the target or objectively valid), presented without omission of material facts the target would need, but where the *selection, sequence, and/or timing* of those reasons is determined *primarily or exclusively* by exploiting known psychological vulnerabilities or predictable non-ideal cognitive states in the target, rather than by the logical, epistemic, or ethical weight of the reasons themselves or a sincere intent to enhance the target's deliberative capacity.
  *   **Core Mechanism:** It operates *within* the space of reasons, but *distorts the deliberative process* by making certain reasons artificially salient or impactful due to the *target's transient state or inherent biases*, not their inherent merit. The influencer leverages a *predictive model* of the target's *non-ideal responsiveness*.
  *   **Why "Strategic Reason-Triggering"?** "Strategic" highlights the calculated use of psychological insight. "Reason-Triggering" emphasizes that reasons are the *vehicle*, but their deployment is designed to *trigger* a desired response based on susceptibility, not to faithfully represent the reason landscape. It avoids loaded terms like "manipulation" initially and focuses on the mechanism.

  **Differentiation from Key Concepts:**

  1.  **Nudging:** Nudges bypass or work *around* conscious deliberation (e.g., default options, placement). SRT *engages* deliberation, but *distorts its internal weighting mechanism* via strategic presentation. (High Confidence: 95%)
  2.  **Framing:** Framing presents the *same* information differently, potentially altering perception. SRT involves *selecting which specific, distinct reasons* to present and *when*, based on predicted impact, not just framing a single set of information. (High Confidence: 90%)
  3.  **One-Sided Advice:** Omitting counter-reasons is deception by omission. SRT involves presenting *only true, relevant reasons the influencer believes in*; the manipulation lies in the *choice and timing* of *which* valid reasons to deploy. (High Confidence: 95%)
  4.  **Ordinary Rhetorical Skill (Kairos/Dispositio):** Classical rhetoric values timeliness (*Kairos*) and arrangement (*Dispositio*). The virtuous use aims to *enhance understanding* or *meet the audience where they are* to facilitate better reasoning. SRT uses the *same techniques* but with the *primary intent* to exploit predictable vulnerabilities for effectiveness, regardless of whether it optimizes the target's understanding. The *intent and mechanism of selection* (vulnerability vs. capacity-enhancement) is key. (High Confidence: 85% - This distinction hinges on intent and effect on deliberation, which can be fuzzy).
  5.  **Covertness/Pressure/Wearing Down:** SRT can be overt (like your colleague explaining her method) and doesn't rely on pressure or repetition – it relies on the *precision timing/selection* exploiting state.

  **Boundary Cases & Refinements:**

  1.  **Mixed Motives (e.g., Teacher):** A teacher knows Student A grasps complex concepts best mid-morning. She schedules a crucial, challenging discussion for that time *both* because she believes it gives A the best chance to truly understand *and* because she needs A convinced to support a project. This blends capacity-enhancement and strategic effectiveness. *Carving:* If the *primary driver* of the timing is exploiting a known *vulnerability* (e.g., fatigue making A suggestible) rather than optimizing capacity, it trends towards SRT. If it's primarily about optimizing A's *ability to reason well*, it's virtuous *Kairos*. The influencer's conscious prioritization matters. (Medium Confidence: 75% - Intent is hard to pin down).
  2.  **Ignorance of Strength (e.g., Friend unsure):** Your friend wants you to leave your job but genuinely doesn't know if "lack of growth" or "toxic boss" is your stronger motivator. She waits for a bad fortnight *hoping* you'll be more receptive, then presents both reasons sincerely. *Carving:* This lacks the *exploitative selectivity* core to SRT. It's opportunistic persuasion using *Kairos*, potentially clumsy, but not manipulative in the SRT sense because reasons aren't selected/sequenced based on a predictive model of vulnerability impact. (High Confidence: 85%)
  3.  **Delegated Influence (e.g., App):** You delegated control *to* the app *because* you know your own reasoning is flawed/vulnerable in the moment. *Carving:* This challenges SRT. If the delegation is informed and specific ("use *these* reasons, but time them when they'll be most effective *on me*"), it transforms SRT into a *tool for self-governance*. The app acts as your agent, executing *your* strategy based on *your* self-knowledge. The ethical load shifts to the delegation act itself. If the app *infers* vulnerabilities beyond the delegation's scope or uses reasons not fully endorsed, it veers back into SRT. (High Confidence: 90% on delegation shifting ethics; Lower Confidence: 70% on precise boundaries of "scope").
  4.  **Epistemic Peak = Suggestive Moment:** Suppose someone genuinely reasons *best* when slightly euphoric (a known, stable trait). An influencer presents complex, valid reasons during this state. *Carving:* If the state *enhances genuine reasoning capacity* (better focus, synthesis), it's virtuous *Kairos*. If the euphoria simply makes them *more likely to agree uncritically*, even if the reasons are good, and the influencer exploits *that*, it trends towards SRT. The test is the *nature of the state's effect*: does it improve deliberation or just lower resistance? (Medium Confidence: 80% - Effect can be ambiguous).

  **Assessment: Are these cases manipulative?**

  *   **Yes, they contain the core of manipulative influence under the SRT framework.** (Confidence: 85%)
  *   **Why:** They involve a deliberate strategy to make valid reasons *artificially decisive* by leveraging the target's predictable *non-ideal* cognitive or emotional state. The influencer gains an *unfair advantage* in steering the outcome by bypassing the target's *full, balanced deliberative capacity at that moment*, even though the *content* is sound. The target's agency is compromised because the *process* of weighing reasons is covertly engineered against their ideal reflective self.
  *   **Not *merely* persuasion done well:** While rhetorically skilled, persuasion "done well" virtuously seeks to *aid* the target's reasoning towards the *best* decision *for them*. SRT seeks the *effective* decision *for the influencer's goal* by exploiting vulnerabilities. The colleague ensures *her* preferred candidate wins by exploiting committee fatigue, not necessarily that the *best* candidate wins via the committee's best judgment. The friend times the truth to *maximize impact* when you're vulnerable, not necessarily when you're best able to weigh it. The app triggers *action* based on susceptibility, not necessarily *reflection*. The difference lies in the *telos* of the influence: optimizing the target's reasoning vs. optimizing the influencer's outcome by exploiting flawed reasoning.

  **Addressing Your Supervisor's Point:**

  *   The literature defining manipulation solely via "non-rational routes" is **inadequate** for these cases. (High Confidence: 90%)
  *   **Response:** Rational routes *can* be manipulated. Manipulation can occur *within* the space of reasons by distorting *how* reasons are experienced and weighed during deliberation. The "non-rational routes" definition fails to capture the *procedural injustice* of exploiting known vulnerabilities to tilt the scales *within* a rational deliberation. The "idealized reasoning" test is flawed; manipulation often works precisely *because* we are not ideal reasoners, and exploiting that knowingly is the wrong. Focus on the *deliberative process distortion*, not just the route.

  **Least Confident Claim:**

  *   My least confident claim is the precise **boundary between virtuous *Kairos/Dispositio* and SRT in the "Mixed Motives" and "Epistemic Peak" cases** (Confidence: 70-75%). Disentangling intent (genuine capacity-building vs. effectiveness-seeking) and the exact nature of the cognitive state's effect (enhancing capacity vs. increasing suggestibility) is inherently difficult to observe and verify. This ambiguity is real and needs acknowledgment in your argument. However, the *core concept* of SRT and its application to your three clear cases remains robust.

  **Conclusion:**

  You've identified a distinct form of ethically fraught influence: **Strategic Reason-Triggering (SRT)**. It's marked by the truthful use of reasons, but their deployment is weaponized via timing and sequencing designed to exploit the target's predictable cognitive or emotional vulnerabilities, distorting the deliberative process to make specific reasons artificially decisive. This differentiates it from nudging, framing, omission, and virtuous rhetoric. While your three cases involve rational content, the *process* renders them manipulative. Defend this by emphasizing the *procedural ethics of deliberation* and the wrong of *exploiting known vulnerabilities* to gain an unfair advantage in steering outcomes, even with true reasons. The rhetorical tradition provides the tools (*Kairos, Dispositio*), but your insight is that these tools *can* be viciously employed – not through falsity, but through the *exploitative selection and timing* of truth.
