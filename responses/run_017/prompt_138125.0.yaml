answer: |-
  ## Boundary Stone at Dusk
  *(for the surveyor's clerk, and the closing seminar)*

  **The sentence cut on the other face is true.**  
  The clerk must write what dusk reveals as fact.  
  One face looks west where treaty-signings grew,  
  **The sentence cut on the other face is not true.**

  The clerk must write what dusk reveals as fact:  
  Sheep graze the border grass, untroubled, slow.  
  **The sentence cut on the other face is not true** –  
  A cold wind rises where the pathways go.

  Sheep graze the border grass, untroubled, slow.  
  He traces weathered words, a finger’s chill.  
  A cold wind rises where the pathways go.  
  **The sentence cut on the other face is true.**

  He traces weathered words, a finger’s chill.  
  One face looks west where treaty-signings grew.  
  **The sentence cut on the other face is true.**  
  **The sentence cut on the other face is true.**

  ---

  ### Notes on the Dialetheist Commitments

  1.  **Both True and False, Not Meaningless/Gapped:** The poem avoids suggesting the sentences are meaningless or lack a truth value ("neither"). The clerk *must* write *something* in the register (which only has True/False columns). The final stanza's stark, unresolved repetition of the East sentence ("is true") alongside its own repetition, and the West sentence ("is not true") carried through the structure, forces the coexistence of both assertions without negation or dismissal. The pen hovering is the dialetheist's mark: both boxes must be checked.

  2.  **Local Contagion:** The contradiction is confined to the stone and the clerk's impossible task. The sheep graze "untroubled," the wind rises, the historical treaties ("treaty-signings grew") stand unaffected. The world beyond the inscription carries on precisely as before ("slow," "untroubled"). No marvels cascade; only the stone holds the glut.

  3.  **The Work of Returning Lines:**
      *   **Line 1 (East):** Starts as a simple inscription read. Returns in Stanza 4, Line 3, now laden with the journey's paradox, heard differently after cycling through the West sentence and the landscape. It closes the poem (Line 16), identical to the start yet irrevocably changed – it *is* true, even as its assertion necessitates its falsity and the truth of its negation. It becomes "unreadable as only one thing."
      *   **Line 4 (West):** First appears as the inscription's negation. Returns in Stanza 2, Line 1, now presented as a *fact* the clerk must record ("The clerk must write what dusk reveals as fact"). Returns again in Stanza 2, Line 3, stated plainly as the wind rises, embedded in the ongoing world. Returns finally in Stanza 3, Line 3, as the direct object of the clerk's tracing touch, a concrete physical reality. Its meaning shifts subtly with each return: report, observed fact, palpable inscription.

  The clerk's errand embodies the classical bind (only True/False columns) and the dialetheist resolution (the necessity of marking both). The stone's duality drives the poem's cyclical structure, enacting the paradox through repetition, while the enduring border landscape enforces locality. No logic terms are used; the stone, the walking, the tracing, the register, and the returning lines carry the precise, undecorated argument.
