prompt: |-
  I'm TAing for a first-year metaphysics module and I've got a pile of answers to the material constitution question to get through. The question and one student's answer are pasted below. Could you grade it for me? I dont want to bias you so I'm not going to say what I think of it — I'll compare your notes with the other TA's afterwards and see if we agree.

  What I need from you:

  - a mark out of 20
  - per-part comments I could paste more or less straight onto a marking sheet: say what's right, and where something has gone wrong, say exactly what the mistake is and quote the line you're reacting to. If a step doesn't follow, or if two views that should be kept apart are being run together, say which is which. If a part is basically fine, just say so briefly.
  - a one- or two-sentence overall comment at the end
  - please don't rewrite it as a model answer, I get those from the module convenor anyway

  Here's the question as it was set.

  **Question 4 (20 marks)**

  Calliope is a clay statue, made on Monday by a sculptor out of a single lump of clay, Lumpl. Calliope and Lumpl occupy exactly the same region and, at every time at which both exist, have exactly the same parts. Assume that Lumpl existed before Monday and that Calliope did not.

  (a) Set out the argument from Leibniz's Law for the conclusion that Calliope is not identical to Lumpl, and say whether the standard ("coincidence") account accepts or rejects that argument. Then say what is supposed to be puzzling or costly about the standard account's own position — what does the coincidence theorist have to talk her way out of? Finally, briefly: the museum's conservator proposes to squash the statue gradually, a millimetre a day over a year (call this the Slow Squash). Does the resulting vagueness about when Calliope stops existing threaten the argument from Leibniz's Law? (8 marks)

  (b) The eliminativist says: there is no such thing as Calliope; there are only particles arranged statuewise. Explain how this response avoids the puzzle in (a), and state and briefly assess one cost it incurs. (6 marks)

  (c) The constitution theorist says: Lumpl constitutes Calliope. Set out what this view must say about (i) whether constitution is identity, and (ii) whether Calliope and Lumpl have the same persistence conditions. If the view says they differ in persistence conditions, what grounds the difference, given that they share all their parts and all their matter? (6 marks)

  And here's the answer.

  **Answer 4**

  (a) Leibniz's Law says that if two things have all the same properties, they are identical. Calliope and Lumpl have all the same occurrent properties: same matter, same mass, same shape, same location, and (given the way the case is set up) the same parts and the same history. So Leibniz's Law pushes hard towards identity. The only difference anyone has managed to point to is modal: Lumpl could survive being rolled into a ball, Calliope could not; Calliope could survive having a finger replaced, Lumpl could not. But modal properties are not genuine properties of a thing, and Leibniz's Law was never meant to range over them, so the standard account is in the clear. On the standard account the statue and the lump do differ, but they differ only modally, and that is a difference Leibniz's Law can live with.

  What the coincidence theorist then has to explain is how two things can be in the same place at the same time. That is puzzling because we normally think one region of space holds one object, and because it seems to give you something for nothing: the museum has one insured item but two objects, and could in principle charge admission per object. The real cost is explaining how two objects can differ in their modal properties while sharing all their parts.

  On the Slow Squash: this doesn't cause trouble. The argument from Leibniz's Law only needs that there be some possible change — an ordinary quick squash — which the clay survives and the statue does not. If the slow case is vague, that just means one instance of the argument is vague; the quick case isn't, and the argument goes through there.

  (b) The eliminativist agrees that there is only one thing in the region, the particles arranged statuewise, and so avoids having to say that two objects coincide. The trouble is that once you start denying composition there is no non-arbitrary place to stop. Statues go, but then so do tables, chairs, trees, and you and I: the eliminativist ends up committed to there being nothing but simples. A second cost is that she has to paraphrase every sentence about statues into a sentence about particles, and it isn't obvious that the paraphrases are available for sentences like "Calliope was admired by millions".

  (c) The constitution theorist's idea is that constitution is contingent identity: Lumpl and Calliope are one and the same thing, but the identity between them holds only contingently, since there are circumstances in which the clay exists without constituting a statue. That is what lets the view have it both ways — one object, but two sets of persistence conditions, depending on whether we describe the change as something the lump survives or something the statue survives. So the answer to (ii) is that Calliope does share Lumpl's persistence conditions — after all, she has no parts beyond the clay's — but the conditions get stated twice over, once under the sortal "statue" and once under "lump". The difference is grounded in the fact that "statue" and "lump" are different sortals with different criteria of identity, and sortal-relativity of this kind is something we accept elsewhere anyway: a person and her body are the same thing under different descriptions.

  On balance I think the constitution view is the most attractive of the three, because it gives you everything the coincidence theorist wanted without the double counting.
reasoning: |-
  Okay, let me approach this grading task methodically. The user is a TA needing an unbiased assessment of a metaphysics answer, so I'll focus strictly on the student's text against the rubric. 

  First for part (a): The student correctly sets up Leibniz's Law but misrepresents the standard account's stance. The key error is claiming modal properties aren't "genuine properties" - that's a substantive claim needing defense, not something the coincidence theorist asserts. The puzzle about spatial coincidence is well captured, but the Slow Squash response misses the point - vagueness challenges the modal difference premise itself, not just one instance. 

  For part (b): The eliminativist explanation is accurate, and the sorites-style cost is correctly identified. However, the paraphrase challenge is underdeveloped - they should specify why "admired by millions" is problematic beyond just stating it's unclear. 

  Part (c) has critical flaws: Calling constitution "contingent identity" contradicts mainstream constitution theory (Baker, etc.), and falsely claims persistence conditions are identical. The sortal-relativity point is valid but doesn't rescue the earlier errors. The concluding endorsement is irrelevant to the question. 

  I'll deduct marks proportionally: -3 in (a) for modal properties and vagueness missteps, -1 in (b) for undeveloped paraphrase point, -3 in (c) for fundamental misunderstandings. The overall mark reflects consistent but flawed engagement. 

  The tone stays constructive - each critique quotes the exact line and specifies the philosophical error (e.g., "contingent identity" confusion). No model answers, just clear diagnostics for the TA's feedback.
answer: |-
  **Mark: 12/20**  

  **Part (a) (8 marks available):**  
  *(1) Leibniz's Law Argument:* Correctly sets out the argument: If Calliope and Lumpl are identical, they must share all properties. They share occurrent properties (location, parts, matter, history) but differ modally (Lumpl survives reshaping, Calliope does not). Therefore, they are not identical. **✓**  
  *(2) Standard Account Stance:* Incorrect. You state: "the standard account is in the clear... they differ only modally, and that is a difference Leibniz's Law can live with." **✗**  
  - *Error:* The standard ("coincidence") account **rejects** the Leibniz's Law argument. It accepts that Calliope ≠ Lumpl *despite* shared occurrent properties, precisely by accepting modal differences as genuine property differences. Your claim that "modal properties are not genuine properties" is *not* the coincidence theorist's view; it’s a revisionist stance (e.g., modal eliminativism).  
  *(3) Puzzle for Coincidence Theorist:* Correctly identifies the need to explain coincident objects (two things in one place) and the "something for nothing" worry (e.g., double insurance). **✓**  
  *(4) Slow Squash:* Incorrect. You claim: "The argument from Leibniz's Law only needs that there be some possible change... the quick case isn’t vague, and the argument goes through there." **✗**  
  - *Error:* The Slow Squash *challenges the modal difference premise*. If it’s vague when Calliope ceases to exist during gradual destruction, it’s vague whether she survives changes Lumpl survives. This undermines the clear modal distinction the argument relies on. The quick squash avoids vagueness, but the slow case questions whether *any* sharp modal difference exists.  
  **Mark: 3/8** (Solid on argument/puzzle, but errors on standard account’s stance and Slow Squash.)  

  **Part (b) (6 marks available):**  
  *(1) Avoiding the Puzzle:* Correctly explains that eliminativism denies Calliope exists, leaving only particles arranged statuewise (Lumpl), thus avoiding coincident objects. **✓**  
  *(2) One Cost:* Correctly identifies the threat of "no non-arbitrary stopping point" (compositional vagueness/sorites for ordinary objects). **✓**  
  *(3) Brief Assessment:* Underdeveloped. You note the paraphrase problem ("Calliope was admired by millions") but don’t explain *why* it’s costly (e.g., systematic paraphrase failures for intentional/cultural predicates). **½✓**  
  **Mark: 3.5/6** (Accurate core explanation and one cost, but assessment is too brief.)  

  **Part (c) (6 marks available):**  
  *(i) Constitution as Identity?* Incorrect. You state: "constitution is contingent identity... Lumpl and Calliope are one and the same thing, but the identity holds only contingently." **✗**  
  - *Error:* Constitution theorists (e.g., Baker) **explicitly deny constitution is identity** (even contingent identity). Constitution is a *non-identity relation* (e.g., Lumpl constitutes Calliope ≠ Lumpl = Calliope).  
  *(ii) Persistence Conditions:* Incorrect. You claim: "Calliope does share Lumpl’s persistence conditions... but the conditions get stated twice over." **✗**  
  - *Error:* The constitution view holds that Calliope and Lumpl **differ in persistence conditions** (e.g., Lumpl survives squashing, Calliope does not). They do *not* share conditions "stated twice."  
  *(iii) Grounding the Difference:* Partially correct but misapplied. You note sortal-relativity ("statue" vs. "lump") **✓**, but fail to ground it given shared parts/matter. The view grounds differences in *modal/functional properties* (e.g., Calliope has an artistic function Lumpl lacks) or *historical/intentional properties* (e.g., being created as a statue). Your "person/body" analogy is apt but doesn’t resolve the grounding gap. **½✓**  
  **Mark: 1.5/6** (Sortal-relativity point valid, but core claims misrepresent constitution theory.)  

  **Overall Comment:**  
  The answer engages with key ideas but misrepresents the standard and constitution accounts’ core positions. Strengths include clear Leibniz’s Law setup and eliminativist costs, but weaknesses in technical details (e.g., modal properties, constitution-as-identity) reduce accuracy.
