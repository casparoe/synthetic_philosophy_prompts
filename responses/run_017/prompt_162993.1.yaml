answer: |-
  Here’s a complete exam package designed to meet your specifications, pushing students beyond stock answers while centering on the boundary problem for mental subjects.

  ---

  ### **Exam Question Stem**  
  *(Appears on the paper)*  

  > **QUESTION 3: THE CASE OF AUNT HILLARY AND THE MOUND READOUT**  
  > Consider a sentient-seeming ant colony ("Aunt Hillary") whose collective behavior responds intelligently to tapped signals, with replies emerging from coordinated ant activity over extended timescales. Field researchers deploy a "Mound Readout" sensor array tracking pheromones and ant traffic, yielding two findings:  
  >   
  > **FINDING ONE:** The colony’s foraging/relocation decisions are best predicted by a single, slow-moving variable representing its nutritional deficit and defensive posture. This variable is realized by large-scale chemical gradients and traffic flows in the mound’s galleries—not by individual ants—and functions as a colony-level self-model.  
  >   
  > **FINDING TWO:** When galleries realizing this self-model are destroyed, the colony’s behavior degrades briefly but recovers fully within two weeks. A neighboring colony ("Aunt Beatrice"), whose architecture lacks any integrated self-model (relying solely on local ant-level rules), exhibits long-term functional equivalence to Aunt Hillary (over months), though not short-term equivalence (over minutes).  
  >   
  > ***Assess whether either finding should alter our view of Aunt Hillary as a genuine subject of mental states.*** In your answer:  
  > - **Do not** rehearse debates about emergent properties, individual ant understanding, or whether there is "something it is like" to be the colony.  
  > - **Focus instead** on what fixes the *boundaries of a mental subject*.  
  > - **Justify** which finding (if either) carries decisive argumentative weight, and explain why it matters more than the other.  
  > *(Answer in ~90 mins / 1200 words)*  

  ---

  ### **Model Answer**  
  *(~750 words; Arguing Finding One is decisive for subjecthood)*  

  The Aunt Hillary case forces us to confront *what constitutes a unified subject* of mental states. I argue **Finding One strengthens the case for colony-level mentality**, while Finding Two is inconsequential, as functional equivalence does not settle the metaphysics of subjecthood.  

  A mental subject requires a *criterially bounded system* integrating information into a unified perspective. Borrowing from Dennett’s real patterns but moving beyond it, I propose a subject exists where there is **a persistent, organizationally closed loop of self-monitoring and regulation**, physically realized in a *dedicated medium*. Mere predictive utility (e.g., the intentional stance) is insufficient; the system must enact an *intrinsic self-model* that causally constrains its behavior. Finding One provides exactly this: the colony’s chemical-gradient variable is a *physically realized self-representation* ("nutritional deficit," "defensive posture") that directly regulates foraging/relocation. This is not just a useful pattern—it is an autonomous control architecture. Crucially, it is realized in the mound’s infrastructure (galleries, pheromone distribution), extending beyond individual ants.  

  This invites the "boundary problem": why doesn’t the subject swallow the entire ecosystem? The answer lies in **organizational closure and medium specificity**. The self-model’s physical realization is confined to structures *built and maintained by the colony* (galleries, pheromone trails). The mound is not an environmental contingency like rainfall; it is a scaffolded extension of colonial physiology. Destroying galleries (Finding Two) disrupts this medium—but the colony’s recovery shows it can *rebuild its cognitive architecture*, reinforcing its status as a resilient subject, not a fiction.  

  Finding Two, however, appears to undermine mentality by showing functional equivalence with Aunt Beatrice’s decentralized system. Yet this is irrelevant. Subjecthood depends on *how* cognition is structured, not *that* it produces outputs. Beatrice’s lack of an integrated self-model makes her colony a mere aggregate of ant-level responses. Her monthly-scale equivalence resembles a thermostat matching a human’s temperature regulation: both achieve goals, but only one does so via integrated self-representation. The *minute-scale differences* are telling: Hillary’s self-model enables nuanced real-time adjustments; Beatrice’s does not. Months-long equivalence reflects coarse-grained survival, not cognition.  

  Skeptics might worry about "sub-colony" proliferation: if Hillary is a subject, why not her nest chambers or the forest? But sub-colonies lack organizational closure—their "behavior" is parasitic on colony-wide processes. The forest lacks medium specificity: its "patterns" aren’t actively maintained by a unified system. Hillary’s self-model creates a natural boundary: where its feedback loops cease.  

  Finally, appeals to consciousness obscure this debate. "Nothing it is like" claims often mask verbal disputes: if mentality requires subjective experience, but experience is defined by private access, then *any* third-person functionalist account fails by fiat. The substantive issue is whether a system meets the criteria for *being a subject*—integration, closure, and intrinsic control. Finding One shows Hillary does; Finding Two merely shows her architecture is robust, not illusory.  

  In sum, Finding One decisively supports Hillary’s subjecthood by revealing a physically realized self-model. Finding Two is inert—it demonstrates adaptability, not inadequacy. Beatrice’s functional equivalence proves only that intelligence is multiply realizable, not that integrated selfhood is unnecessary.  

  ---

  ### **Marking Scheme**  
  *(Out of 20; Must-hit points with common errors)*  

  1. **Criterion for Subjecthood** (4 marks)  
     - *Must-hit:* Explicitly states a non-stipulative criterion for mental subject boundaries (e.g., organizational closure, integrated information, self-modeling).  
     - *Common error:* Vague appeals to "emergence" or "complexity" without specifying boundaries (max 2/4).  

  2. **Treatment of Extended Realization** (4 marks)  
     - *Must-hit:* Explains why the mound’s role does/doesn’t extend the subject to the ecosystem (e.g., medium specificity/scaffolding).  
     - *Common error:* Claims the mound’s inclusion is arbitrary without engaging realization mechanisms (max 2/4).  

  3. **Verdict on Aunt Beatrice** (4 marks)  
     - *Must-hit:* Argues whether functional equivalence suffices for mentality, linking to the subjecthood criterion. Distinguishes short/long timescales.  
     - *Common error:* Asserts Beatrice’s equivalence refutes Hillary’s mentality without justifying why function trumps structure (max 2/4).  

  4. **Answer to Proliferation Worry** (4 marks)  
     - *Must-hit:* Explains why sub-colonies/ecology fail the subjecthood criterion without ad hoc exceptions.  
     - *Common error:* Dismisses proliferation as irrelevant or resorts to scale-based stipulations (max 2/4).  

  5. **Meta-Discussion of Substantiveness** (4 marks)  
     - *Must-hit:* Diagnoses how appeals to consciousness can mask verbal disputes; clarifies what is at stake ontologically.  
     - *Common error:* Equates "real pattern" with subjecthood or treats phenomenality as a primitive (max 2/4).  

  ---

  ### **Diagnosis of the B-Grade Ceiling**  
  An otherwise competent answer caps at **B (14/20)** if it:  
  - **Treats the findings asymmetrically to defend a pre-existing view** (e.g., "Finding Two proves it’s not real since the model is fragile," ignoring recovery; or "Finding One settles it, Beatrice is irrelevant").  
  - **Fails to justify why one finding outweighs the other** in boundary-setting (e.g., assumes without argument that functional equivalence trumps architecture, or vice versa).  
  - **Uses the findings illustratively rather than argumentatively** (e.g., mentions both but doesn’t show how they interact dialectically).  

  The A answer *must* grapple with why one finding forces reevaluation while the other doesn’t—exposing the student’s boundary criterion as the engine of the verdict.  

  ---

  This package forces engagement with the metaphysics of boundaries while sidestepping rehearsed debates. The model answer demonstrates how to privilege structural integration over functional output, but the question allows defenses of either finding (or neither) if rigorously justified.
