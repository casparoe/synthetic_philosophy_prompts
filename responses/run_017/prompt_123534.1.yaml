prompt: |-
  I am a principal engineer with no background in philosophy, and I have recently taken over ownership of engineering standards for a product group of about seventy people, split between a London office and a smaller office in another country. Every month or so I have to decide, for one practice or another, whether to make it a hard rule enforced in CI or in code review, a default that people may depart from if they leave a note explaining why, or a matter left to individual judgement. The decisions are frequent, individually cheap to reverse but corrosive when churned, and each one has to be written up as a one-page recommendation that the engineering leadership team signs off and that a sceptical group of senior engineers will actually read.

  The material I have been pointed to is the literature on tight and loose cultures: the claim that groups differ in how strong their norms are and how much deviance they tolerate, that this difference tracks how exposed the group is to threats and how costly miscoordination is for it, and that tightness buys predictability and coordination at the price of autonomy, experimentation, openness to novelty and tolerance of dissent. I do not want a summary of that literature. I want it turned into a procedure a tech lead can run in about twenty minutes, with no knowledge of the theory, on a single practice at a time.

  One thing I would like tested rather than assumed. My suspicion is that tightness is not one dial but two: how wide a range of situations a rule claims to cover, and how much a departure from it is sanctioned when it happens. A convention can be broad and gently enforced, or narrow and strictly enforced, and the trade-offs look different in each case. If that distinction is worth keeping, build the procedure around it; if it collapses under scrutiny, say so and use whatever distinction does the work.

  Please give me: the questions to ask in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it has to hand the decision to a person because the question is one of values rather than facts. Then run it on three practices I am currently arguing about: requiring two approvals on every pull request; enforcing formatting and lint rules automatically in CI; and whether an on-call engineer during an incident must follow the runbook step by step or may improvise. I have a strong prior on the third one — I think improvisation should be allowed — so tell me plainly if the procedure contradicts me. Finally, be explicit about which of the theory's distinctions had to survive the simplification and which you dropped, and about what the procedure cannot tell me: I especially want to know what happens to it given that the theory was built to describe whole societies, while my engineers can leave, and given that some of our rules may simply be wrong.
reasoning: |-
  We are creating a decision procedure for a tech lead to determine the level of standardization and enforcement for a single engineering practice. The procedure is based on two dimensions:

  1. **Scope**: How broad is the rule? (How many situations does it cover?)
  2. **Enforcement**: How strictly is the rule enforced? (What are the consequences of deviating?)

  We are testing the hypothesis that these two dimensions are distinct and that the trade-offs vary accordingly.

  The procedure will consist of a series of questions that can be answered in about 20 minutes. We will consider the following:

  - The cost of miscoordination or failure in the context of the practice.
  - The cost of experimentation and the value of innovation in that area.
  - The current level of agreement among engineers about the practice.

  We must also account for the fact that the team is distributed and that engineers can leave (so rules must be sustainable and not overly oppressive). Additionally, we must remember that rules might be wrong and therefore need mechanisms for feedback and change.

  The procedure:

  1. **Question 1: What is the cost of miscoordination or failure in this practice?**
     - Consider: Could a mistake lead to a severe incident (e.g., outage, security breach, data loss)? Could it cause significant wasted time (e.g., due to inconsistent patterns)? 
     - Sufficient answer: A qualitative assessment (low, medium, high) with a brief justification.
     - If high: leans toward tighter control (either broader scope or stricter enforcement).
     - If low: leans toward looser.

  2. **Question 2: How much do we gain from experimentation and local adaptation in this practice?**
     - Consider: Is this an area where new approaches might yield big benefits? Are conditions highly variable? 
     - Sufficient answer: Qualitative (low, medium, high) with justification.
     - If high: leans toward looser control (narrower scope or more lenient enforcement).
     - If low: tighter.

  3. **Question 3: How much agreement is there among engineers on this practice?**
     - Consider: Is there a strong consensus? Or is there debate?
     - Sufficient answer: Qualitative (high, medium, low) with justification.
     - If low: avoid making a hard rule until there is more agreement (so default to a guideline or even leaving it open). Also, if there's low agreement, it might be a sign that the rule is not yet well understood or that the context is too variable.

  4. **Question 4: How costly is it to enforce this rule?**
     - Consider: Can it be automated? If automated, the cost of enforcement is low. If it requires manual review, then the cost is higher.
     - Sufficient answer: Qualitative (low, medium, high) with justification.
     - If low: stricter enforcement is more feasible. If high, then we might prefer a guideline.

  5. **Question 5: How easy is it to reverse a decision on this practice?**
     - Consider: If we get it wrong, can we change course without major disruption?
     - Sufficient answer: Easy, moderate, hard.
     - If easy: we can be more experimental (looser). If hard: we need to be more cautious (tighter).

  Now, we map the answers to a decision:

  We are going to use a 2x2 grid:

  - **Scope**: Broad vs Narrow
  - **Enforcement**: Strict vs Lenient

  But note: we might also have a third option: no rule at all (or just a guideline). So we can think of four quadrants:

  1. Broad and Strict: Hard rule, automated if possible, no exceptions without a formal process.
  2. Broad and Lenient: Default practice, with explanations allowed for deviations.
  3. Narrow and Strict: Hard rule but only in specific, well-defined situations.
  4. Narrow and Lenient: Guideline that applies in specific situations, with flexibility.

  Additionally, we might have:
  - No rule: leave to individual judgment.

  **Decision Flow**:

  After answering the questions, we assign:

  - If the cost of miscoordination is high AND the gain from experimentation is low AND agreement is high AND enforcement cost is low -> Broad and Strict.
  - If the cost of miscoordination is high but gain from experimentation is medium/high OR agreement is low -> Broad and Lenient (to allow for exceptions with explanation).
  - If the cost of miscoordination is low and gain from experimentation is high -> Narrow and Lenient or even no rule.
  - If the cost of miscoordination is medium and enforcement cost is low and agreement is high -> consider Strict even if Narrow.

  But we must also consider reversibility:

  - If reversibility is hard, we lean toward lenient to avoid locking in a bad rule.

  **Stopping Conditions**:

  - If at any point the answer to Question 3 (agreement) is low, then we cannot make a hard rule (strict enforcement) and must either go with a guideline (lenient) or defer until consensus is built.
  - If the cost of enforcement (Question 4) is high and the cost of miscoordination is not very high, then we avoid strict enforcement.

  **Handing off to Human Judgment**:

  - When there is a conflict between high cost of miscoordination and high gain from experimentation (or low agreement) and the decision is not clear, we must have a human (or group) weigh the values. Also, if the cost of miscoordination is high but the enforcement cost is also high, we need human judgment on whether the trade-off is worth it.

  Now, let's run the procedure on the three practices.

  **Practice 1: Requiring two approvals on every pull request.**

  - **Q1: Cost of miscoordination/failure?** 
    - High: Without proper review, bugs could get into production causing incidents, security vulnerabilities, or degraded code quality leading to tech debt.
  - **Q2: Gain from experimentation?**
    - Low: The process of code review is well-established. Experimenting with the number of approvals might lead to inconsistent quality and is not an area where we expect big innovations. However, note: in some contexts (e.g., a very small change) two approvals might be overkill. So maybe medium? But the practice is about every PR. Let's say low for experimentation in the core requirement (but note: we might allow exceptions for trivial changes?).
  - **Q3: Agreement?**
    - High: Most engineers agree that code reviews are important. The question of two approvals might be less agreed upon? But in many teams, it's standard. We'll assume high agreement for the purpose of this group (but if not, then we adjust).
  - **Q4: Enforcement cost?**
    - Low: Can be enforced by the repository settings (require at least two approvals).
  - **Q5: Reversibility?**
    - Easy: We can change the setting at any time.

  Decision: 
  - Cost of miscoordination is high, gain from experimentation low, agreement high, enforcement cost low -> Broad and Strict. 
    - So: hard rule, enforced in the repository settings.

  But note: we might want to allow for exceptions (e.g., urgent hotfixes). So we can have a process for that (e.g., override with a note). That would be a lenient aspect? But the base rule is strict. We can design the rule to be strict but with an escape hatch that requires explanation (which is then reviewed). So we might adjust: Broad in scope (applies to every PR) and Strict enforcement (must have two approvals) but with a documented override process (which is a form of leniency in enforcement?).

  Alternatively, we can think of the override as a built-in exception. So we can say: Broad and Strict, but with an explicit, auditable exception mechanism. That's a common pattern.

  **Practice 2: Enforcing formatting and lint rules automatically in CI.**

  - **Q1: Cost of miscoordination/failure?**
    - Low to medium: Inconsistent formatting doesn't break the system, but it can cause wasted time in code reviews and reduce code readability. However, it's not directly causing production incidents. But if it leads to arguments and slows down development, the cost could be medium.
  - **Q2: Gain from experimentation?**
    - Very low: There is little benefit to having different formatting in different parts of the code. Consistency is key.
  - **Q3: Agreement?**
    - High: Most engineers agree on having consistent formatting and using linters. The exact rules might require agreement, but the practice itself is uncontroversial.
  - **Q4: Enforcement cost?**
    - Very low: Can be fully automated in CI. The cost is in setting up and maintaining the rules, but once done, it's automatic.
  - **Q5: Reversibility?**
    - Easy: The rules can be updated, and the CI check can be adjusted.

  Decision:
  - Cost of miscoordination: medium (due to productivity impact), gain from experimentation low, agreement high, enforcement cost low -> Broad and Strict. 
    - So: enforce automatically in CI, no exceptions (because the automation makes it painless). If there's a rule that is controversial, we can change the rule set, but the enforcement is strict.

  **Practice 3: Whether an on-call engineer during an incident must follow the runbook step by step or may improvise.**

  - **Q1: Cost of miscoordination/failure?**
    - Very high: Incidents can cause major outages, data loss, or security breaches. Improvisation without proper understanding could make the situation worse.
  - **Q2: Gain from experimentation?**
    - High: Incidents are often novel and complex. The runbook might be out of date or not cover the specific scenario. The engineer might have a better solution. Also, learning and innovation in incident response are valuable.
  - **Q3: Agreement?**
    - Medium to low: There might be disagreement. Some might value strict adherence for safety, others flexibility for effectiveness.
  - **Q4: Enforcement cost?**
    - High: It's hard to enforce during an incident. We can't have someone looking over the shoulder. We can only review after the fact.
  - **Q5: Reversibility?**
    - Hard: If an improvisation goes wrong, it might cause irreversible damage.

  Decision:
  - Conflict: High cost of miscoordination and high gain from experimentation. Also, enforcement cost is high and agreement might be low. 
    - This is a case where we must hand the decision to human judgment because the trade-off is about values (safety vs agility) and context. 

  However, we can try to break it down:

  We might design a rule that is narrow and lenient? For example:

  - Scope: Broad (applies to every incident) but the rule is not about following the runbook strictly but about following a process (e.g., document deviations, have a post-incident review). 
  - Enforcement: Lenient (because we can't enforce in real-time) but with a requirement to justify after the fact.

  Alternatively, we might decide: the runbook is the default, but deviations are allowed if the engineer believes it's necessary and they document the reason. So we have a Broad scope (applies to every incident) but Lenient enforcement (with a requirement to explain).

  But note: the procedure would suggest:

  - Because of the high cost of miscoordination, we want some control (so not no rule). But because of the high gain from experimentation and the high enforcement cost, we don't want strict.

  So: Broad (because every incident should be handled with a baseline of safety) and Lenient (allow improvisation but require an explanation in the postmortem). 

  This aligns with your prior (improvisation allowed).

  **Summary of the Procedure**:

  The procedure uses five questions to assess the two dimensions (scope and enforcement). The distinctions that survived:

  - The two dimensions (scope and enforcement) are treated as distinct and we map to a 2x2 grid.
  - We consider the cost of miscoordination (which relates to the societal threat idea) and the gain from experimentation (which relates to autonomy and openness to novelty).

  What was dropped:

  - The theory also discusses historical and ecological factors that lead to tight/loose cultures. We are not examining the history of the team, but rather the current context for a specific practice.
  - The theory at the societal level also includes norms about norm-enforcement (meta-norms) which we don't address.

  Limitations:

  1. **Rules might be wrong**: The procedure does not explicitly build in feedback loops. We should add that any rule should be reviewed periodically and have a mechanism for challenge. Also, the reversibility question (Q5) helps.
  2. **Engineers can leave**: We are indirectly accounting for this by not making rules overly strict when the gain from experimentation is high (which would frustrate engineers). Also, by requiring agreement (Q3), we avoid imposing rules that are unpopular.
  3. **Whole societies vs teams**: The theory was built for societies where leaving is hard. In teams, leaving is easier. Therefore, we must be cautious about strict rules that might cause attrition. We account for this by:
     - Considering agreement (if agreement is low, we don't impose a strict rule).
     - By allowing leniency (so engineers feel autonomy).

  Finally, the procedure cannot tell you:

  - What the exact rule should be (only the level of standardization and enforcement).
  - It does not resolve fundamental value conflicts (so for those, we hand off to human judgment).

  Let me know if you want adjustments.
answer: |-
  ### Decision Procedure for Engineering Standards

  Below is a step-by-step procedure to determine the appropriate level of standardization (scope) and enforcement for a single engineering practice. It distills the "tight vs. loose" theory into a 20-minute checklist, focusing on two distinct dimensions:
  1. **Scope**: How broadly the rule applies (e.g., "all code" vs. "only critical paths").
  2. **Enforcement**: How deviations are sanctioned (e.g., "blocking in CI" vs. "documented explanation allowed").

  **Key Insights from Theory**:
  - The **scope/enforcement distinction holds**: They represent separate trade-offs. Broad scope maximizes predictability but stifles context-specific optimization; strict enforcement ensures compliance but punishes experimentation. Combining them creates four quadrants (e.g., broad/lenient for high-coordination needs with innovation tolerance).
  - **What was dropped**: 
    - Societal-level factors (e.g., historical threats). Teams face different risks (e.g., outages vs. attrition), so we focus on immediate costs/benefits.
    - Long-term cultural evolution. The procedure assumes rules can be iterated (addressed via reversibility).
  - **Limitations**:
    - **Engineers can leave**: Strict rules risk attrition if autonomy is undervalued. The procedure mitigates this by weighing "gain from experimentation" (Q2) and "agreement" (Q3).
    - **Rules may be wrong**: Built-in reversibility (Q5) and leniency options allow course-correction. The procedure doesn't guarantee "correctness" but reduces churn by requiring evidence for strictness.
    - **Not covered**: Team size/distribution. For your multi-office group, default to broader scope if miscoordination is high (Q1), as remote work amplifies miscommunication costs.

  ---

  ### The Procedure: 5 Questions
  Ask these in order. Answer with **sufficient evidence**: Concrete examples, incident data, or team feedback. Avoid opinions without data. Time: ~4 min/question.

  1. **What is the cost of miscoordination or failure for this practice?**  
     - *Assesses need for predictability (scope/enforcement tightness)*.  
     - **Sufficient answer**:  
       - **Low**: Minor annoyances (e.g., trivial bugs, style debates).  
       - **Medium**: Wasted time/rework (e.g., unclear patterns causing review delays).  
       - **High**: Severe outcomes (e.g., outages, security breaches, safety risks).  
     - **Stop/No rule if**: Cost is **low** → Default to individual judgment. Proceed otherwise.  
     - *Human handoff if*: Cost is contested (e.g., "Is a formatting error medium or low?"). Resolve with data.

  2. **What is the gain from experimentation or local adaptation for this practice?**  
     - *Assesses need for autonomy/innovation (scope/enforcement looseness)*.  
     - **Sufficient answer**:  
       - **Low**: Stable/standardized contexts (e.g., formatting, linting).  
       - **Medium**: Emerging domains (e.g., new libraries).  
       - **High**: Unpredictable scenarios (e.g., incidents, R&D).  
     - **Stop/No rule if**: Gain is **high** → Default to individual judgment. Proceed otherwise.  
     - *Human handoff if*: Gain clashes with Q1 (e.g., high cost + high gain). Values debate (e.g., "How much do we value innovation vs. stability?").

  3. **What is the team agreement level on this practice?**  
     - *Assesses social feasibility (enforcement viability)*.  
     - **Sufficient answer**:  
       - **Low**: Heated debate or split preferences.  
       - **Medium**: Mild consensus but edge-case disagreements.  
       - **High**: Unified support (e.g., linting rules everyone accepts).  
     - **Stop/Lenient enforcement if**: Agreement is **low** → Default to documented explanations for deviations. Avoid strict enforcement. Proceed if medium/high.  
     - *Human handoff if*: Agreement is unclear (e.g., "Is silence consensus or dissent?").

  4. **How costly is enforcement?**  
     - *Assesses practical viability (enforcement tightness)*.  
     - **Sufficient answer**:  
       - **Low**: Automatable (e.g., CI checks).  
       - **Medium**: Manual but lightweight (e.g., review comments).  
       - **High**: Labor-intensive (e.g., audits, training).  
     - **Stop/Lenient enforcement if**: Cost is **high** → Default to guidelines. Proceed if low/medium.  
     - *Human handoff if*: Cost estimation is disputed (e.g., "Will automating this take 1 week or 1 month?").

  5. **How reversible is this decision?**  
     - *Assesses risk of churn (scope/enforcement flexibility)*.  
     - **Sufficient answer**:  
       - **Easy**: Quick change (e.g., tweaking a CI config).  
       - **Moderate**: Effort required (e.g., updating docs, retraining).  
       - **Hard**: Entrenched impact (e.g., architecture changes).  
     - **Stop/Lenient enforcement if**: Reversibility is **hard** → Default to narrow scope/lenient enforcement. Proceed otherwise.  
     - *Human handoff if*: Reversibility conflicts with Q1 (e.g., high cost + hard reversal requires trade-off).

  ---

  ### Decision Mapping
  Combine answers to assign **scope** and **enforcement**:

  | Dimension      | Broad Scope                                  | Narrow Scope                                  |
  |----------------|----------------------------------------------|-----------------------------------------------|
  | **Strict Enforcement** | Hard rule (blocking automation, no exceptions) | Hard rule in specific contexts (e.g., critical paths) |
  | **Lenient Enforcement** | Default with documented deviations           | Guideline (suggested but optional)            |

  - **No rule**: Individual judgment (if stopped at Q1, Q2, or Q3 low).
  - **Human handoff**: If any question requires values arbitration (e.g., Q1 vs. Q2 conflict).

  ---

  ### Applied to Your Practices
  #### Practice 1: Requiring two approvals on every pull request
  - **Q1: Cost of miscoordination?** High. Single-approval misses bugs, security gaps, or knowledge silos → outages or tech debt.  
  - **Q2: Gain from experimentation?** Low. Little innovation in review quotas; consistency aids coordination.  
  - **Q3: Agreement?** Likely medium/high. Standard in mature teams, but may face pushback on trivial changes.  
  - **Q4: Enforcement cost?** Low. Enforceable via repo settings (e.g., GitHub PR rules).  
  - **Q5: Reversibility?** Easy. Toggle settings in minutes.  
  - **Decision**: **Broad scope, strict enforcement**. Hard rule in CI/repo settings. Automate to avoid review overhead.  
    - *Why not lenient?* Low experimentation gain + high miscoordination cost → Strict.  
    - *Edge case*: Allow emergency overrides with post-hoc documentation (adds leniency without sacrificing scope).

  #### Practice 2: Enforcing formatting and lint rules automatically in CI
  - **Q1: Cost of miscoordination?** Medium. Inconsistency wastes review time and harms readability → delayed PRs.  
  - **Q2: Gain from experimentation?** Low. No benefit to varied formatting; standardization aids tooling.  
  - **Q3: Agreement?** High. Most engineers accept auto-formatters (e.g., Prettier).  
  - **Q4: Enforcement cost?** Low. CI automation is cheap and immediate.  
  - **Q5: Reversibility?** Easy. Adjust rules via config files.  
  - **Decision**: **Broad scope, strict enforcement**. Hard rule in CI.  
    - *Why broad?* Applies universally; no context benefits from deviation.  
    - *Why strict?* Automation makes enforcement near-zero cost.

  #### Practice 3: Whether an on-call engineer must follow runbooks or may improvise during incidents
  - **Q1: Cost of miscoordination?** High. Uncoordinated actions risk data loss, prolonged outages, or collateral damage.  
  - **Q2: Gain from experimentation?** High. Incidents are novel; improvisation may yield faster solutions or insights.  
  - **Q3: Agreement?** Likely low/medium. Seniors may trust judgment; juniors may fear mistakes.  
  - **Q4: Enforcement cost?** High. Real-time monitoring is impractical; post-hoc reviews are reactive.  
  - **Q5: Reversibility?** Hard. Bad improvisation can cause irreversible damage (e.g., data corruption).  
  - **Decision**: **Broad scope, lenient enforcement**. Default to runbooks but allow deviations with documented justification in postmortems.  
    - *Scope*: Applies to all incidents (broad) to ensure baseline coordination.  
    - *Enforcement*: Lenient (documented deviations) due to high experimentation gain and enforcement cost.  
    - **Contradiction with your prior?** No – your prior (allow improvisation) aligns with lenient enforcement. The procedure supports this via Q2 (high gain) and Q4 (high enforcement cost).  
    - *Human handoff note*: If disagreement persists on "how much leniency," arbitrate values (e.g., "Is runbook adherence worth potential response delays?").

  ---

  ### Final Notes
  - **What the procedure optimizes for**: Minimizing churn and maximizing evidence-based decisions. It prioritizes autonomy when experimentation adds value and strictness when miscoordination is costly.  
  - **What it cannot do**:  
    - **Ensure rule correctness**: Use retrospectives to challenge rules (e.g., "Q1 cost was overestimated; loosen").  
    - **Replace culture-building**: If attrition risks rise, reassess Q2/Q3.  
    - **Handle interdependencies**: Run this per-practice; merge outcomes later.  
  - **Scalability**: For 70 people, start with strict automation (practices 1/2) to reduce cognitive load, then add leniency where needed (practice 3).  

  This procedure makes tight/loose theory actionable for engineers—no philosophy required. If piloting it, track time-to-decision and reversal rates to refine.
