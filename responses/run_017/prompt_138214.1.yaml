answer: |-
  **Dialogue: The Reachability Clause**  
  *(Setting: A break room at the Lofoten Foundation workshop. Dr. Ilse Brandt and Dr. Kwame Adeyemi stand near a window overlooking a fjord. They hold coffee cups.)*

  **Brandt:** Kwame, this Reachability Clause… it feels like handcuffs. Take my glass-stitch worms. We measured the cost of their mineralised tube ridge: nine percent of their carbonate budget. We showed it improves feeding in flow by twelve percent by creating a vortex. An optimality model *with measured trade-offs*. Now I must prove which shapes were "reachable"? How? They’re extinct worms in rock.

  **Adeyemi:** Ilse, your flow-tank data is elegant. But two species live in stagnant tide pools. No flow, no vortex, yet identical ridges. Your model explains current utility in *some* habitats, not why the ridge exists everywhere. The Clause asks: Could they have built smooth tubes? If not, the ridge isn’t an *adaptation for feeding*; it’s a developmental relic, repurposed where useful. Like a spandrel.

  **Brandt:** Repurposed implies it was free. But it costs nine percent! Selection wouldn’t maintain useless mineralisation. And we *did* test alternatives: Gluing beads into smoothed tubes restored eleven percent efficiency. That shows the ridge’s structure is *optimised* for flow. Why demand proof of unreachable options?

  **Adeyemi:** Because your model assumes the ridge was built *by selection for flow*. But developmentally, the ridge arises automatically. Each segment secretes a curved mineral slab as the worm grows. Stacked slabs create a stepped helix—like a spiral staircase. A smooth tube would require continuous secretion, which their genetics don’t support. The ridge isn’t engineered; it’s baked-in.

  **Brandt:** *(Nods slowly)* Granted, the developmental mechanism constrains form. But selection *optimised within that constraint*. The cost isn’t in making ridges—it’s in mineralising them. Why thicken it beyond structural necessity? Because in flow, that amplifies the vortex. The nine percent is investment, not waste. Reverse engineering works: We found the trade-off currency—carbonate—and the performance benefit.

  **Adeyemi:** But your "optimal" ridge exists even where it’s useless! The stagnant-water species pay the cost for no benefit. If the ridge is inevitable developmentally, selection didn’t *build* it; it merely *tolerated* it where neutral and *exploited* it where beneficial. That’s Gould’s point: Current utility ≠ cause of origin. Your model conflates them.

  **Brandt:** Okay, distinguish origin and maintenance. Say the ridge originated as a developmental byproduct. Fine. But in flowing water, its utility explains why selection *maintained* mineralisation—why it wasn’t lost. The vortex function explains its persistence and refinement. Isn’t that adaptation?

  **Adeyemi:** Only if alternatives were possible. Could selection have *reduced* mineralisation in stagnant habitats? Apparently not—it’s uniform across forty species. The constraint is too strong. Your "refinement" is like calling a pendentive in a dome an adaptation for mosaics. Sure, you can put art there, but the builder chose pendentives over squinches for structural reasons, not artistic ones. The form came first.

  **Brandt:** Ah, the spandrels of San Marco! But pendentives *were* chosen—over corbels or squinches—because they distribute weight better. That’s functional! And once chosen, artists used them. But the *architect’s* selection was functional. Similarly, even if developmental physics "chose" the ridge’s geometry, natural selection could have adjusted its mineralisation for flow.

  **Adeyemi:** Did it? Your stagnant species prove mineralisation wasn’t reduced where useless. If the trait is developmentally locked, selection didn’t sculpt it; it just inherited it. The null hypothesis—that the ridge is inevitable—isn’t tested by your optimality model. You assumed selection *could* modify mineralisation independently. What if it couldn’t?

  **Brandt:** *(Leans forward)* That’s my frustration with "constraints" critiques. They’re untestable ghosts. You say, "Maybe development blocked alternatives." I say, "Show me the mechanism." With glass-stitches, we know the secretion mode. But demanding I prove no hidden constraint prevented smooth tubes? That’s asking me to prove a negative. Science tests positive claims—like my vortex model.

  **Adeyemi:** Ilse, I’m not asking for proof of impossibility. I’m asking for *evidence of possibility*. You claim selection *shaped* the ridge. So: Show that variation in ridge height existed historically, and selection acted on it. Otherwise, you’re just telling a "just-so" story. The Reachability Clause forces that evidence: If you can’t show a smoother tube was achievable, your adaptive story is Panglossian—assuming this is the best of all *possible* worlds.

  **Brandt:** But my model *is* testable! It predicted the vortex effect and the feeding gain. The glued beads restored function—that’s experimental confirmation! What falsifies your constraint hypothesis? If I find a glass-stitch with a smooth tube?

  **Adeyemi:** It would! But they don’t exist. Meanwhile, your model isn’t falsified by the stagnant species—you handwave that selection maintains it "just in case" or due to gene flow. That’s flexible storytelling. Optimality models need a null: the expectation *without* selection. If the ridge is developmentally compulsory, your "optimal" ridge is just… what happens.

  **Brandt:** But the mineralisation cost…  
  **Adeyemi:** …might be unavoidable! Mineralising the entire tube might be a package deal. Or thinning the ridge could weaken the tube. You haven’t shown selection *could* reduce mineralisation alone. Without that, the cost is just… physics.  
  **Brandt:** So we’re stuck?  
  **Adeyemi:** Until you show reachability. Or admit the ridge’s form isn’t explained by selection.  
  **Brandt:** And you’ll accept that selection maintains it where useful?  
  **Adeyemi:** Maintains, yes. Explains its form? No. The helix is geometry, not ingenuity.  
  *(Brandt sips coffee, stares at the fjord.)*  
  **Brandt:** What if I sequence their genomes? Find genes controlling carbonate deposition? Show variation?  
  **Adeyemi:** Then we’d talk. But until then, the Reachability Clause isn’t handcuffs. It’s rigor. Adaptation isn’t reverse engineering if the blueprint was fixed. It’s just… describing the artifact.  
  **Brandt:** Even if the artifact works beautifully?  
  **Adeyemi:** Especially then. Beauty misleads.  
  *(Adeyemi sets down his cup. Brandt doesn’t reply.)*  

  ---

  **Afterword**  
  The dialogue reveals the core disagreement: whether demonstrating a trait's current utility and trade-offs suffices to explain its form, or whether one must also show that alternative forms were historically achievable by the lineage. Brandt sees optimality models as testable explanations for why a trait persists in its current state. Adeyemi insists that without evidence of reachable alternatives, such models risk conflating current use with evolutionary cause, mistaking developmental inevitabilities for selective optimizations. The debate isn’t about pluralism but about the evidence required to attribute a trait's structure to natural selection versus inherited constraints.  

  \answer{REACHABILITY}
