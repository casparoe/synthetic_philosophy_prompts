prompt: |-
  You're a political philosopher — democratic theory, legitimacy, that whole shop — and I need you to actually work this out rather than hand me a menu. Before you answer, spend some time brainstorming in the background: sketch two or three candidate principles, try to break each of them against my list of cases, and only then commit to the one you think survives and argue for it. And be straight with me about where you're confident and where you're guessing, because I'm going to build a scene on whatever you give me.

  I'm a novelist and I've written myself into a hole. The book is set in Saltmarch, a invented city-state of about forty thousand on a tidal estuary — so nothing here has to match the real world. Everything is settled once a year at the Meeting, by show of hands, and the franchise when the book opens is "hearth-holders": anyone registered as keeping a hearth and paying the hearth tax inside the walls. The crisis is a proposal to build a sea-gate, funded by a hundred-year bond, which will permanently flood the moorings where the barge-dwellers live. The plot turns on who gets a hand at that Meeting, and I want the argument underneath it to be something a reader feels in their gut rather than a slogan. So here are my gut verdicts, then the rule I've been trying to make work.

  1. The moorings people: families who live on barges tied up inside the city's jurisdiction nine or ten months a year, no hearth, no tax, but the harbourmaster's law runs against them and the gate destroys their homes. They vote. Very sure.
  2. A hearth-holder who has lived abroad twenty-two years running a shipping business, keeps a house and two servants in the city, visits one month a year, intends to retire and die there. He does not vote. Very sure, and I can't quite say why.
  3. His granddaughter, nineteen, born in the city, away at university in another country for a three-year degree, definitely coming back. She votes. Fairly sure.
  4. A twelve-year-old born in the city who will still be paying off the bond at fifty. Does not vote — but this one makes me uneasy in a way 2 doesn't.
  5. A woman eighteen months into a two-year fraud sentence in the city gaol: a hearth-holder, out before the gate is finished, will live behind it for the rest of her life. She votes. Mildly sure.
  6. The Wardens of the Slack, a religious order living inside the walls who maintain the sluices: subject to city law like everyone else, but they've vowed obedience to their abbot and insist they hold no view on the city's business, and would vote as a bloc however he told them. My gut says no — and I worry that I'm just punishing them for their religion, which would make me a hypocrite.
  7. A lifelong resident with advanced dementia, who will spend her remaining years inside the walls looking at the gate and can no longer follow an argument. My gut says no. But I can't articulate why this is different in kind from 4 rather than just sadder, and that bothers me.
  8. The unborn — most of the people who'll live with a hundred-year bond don't exist yet. My gut says they have some real claim but that a vote is the wrong instrument for it, and I genuinely go back and forth on what the right instrument would be.

  The rule I keep trying to make work is: you get a hand at the Meeting if the decision can be enforced against you and you're the kind of being that can have a view about whether to obey it. That gets 1, 3, 4, 5 and 7 roughly where my gut puts them, but it also lets 2 in (the city can seize his house; he has views in abundance) and it lets 6 in (they can be made to obey and they obviously could have views, they've just promised not to), and it has nothing at all to say about 8. I've tried patching it with something like "and whose life is bound up with the city's life going forward" — which feels right but definately sounds like a way of smuggling my verdict on 2 inside the principle rather than deriving it.

  So: take my rule, or throw it out and start again. Tell me which of my verdicts you'd overturn rather than build a baroque principle to save it, and why. Give me the cases your principle decides that aren't on my list — one of them should be a case I haven't thought of and will need, ideally something to do with the tide-dwellers who are only inside the jurisdiction three months a year. And if you can, give me a one-line version of the finished principle that a character could say out loud at the Meeting without sounding like a lecture.

  Oh — British English throughout, please. My editor is very annoying about it.
reasoning: |-
  Okay, let me start by really understanding what the user needs. They're a novelist stuck on a political philosophy problem for their book set in Saltmarch. The key issue is deciding who gets to vote at the annual Meeting, especially concerning a sea-gate project that affects barge-dwellers. They provided specific cases with their gut verdicts and a rule they tried, which isn't fully working.

  First, I need to break down their current rule: "you get a vote if the decision can be enforced against you and you can have a view about obeying." It works for some cases but fails others like the absentee grandfather (case 2) and the religious order (case 6). The user is also unsure about the unborn (case 8) and the 12-year-old (case 4). 

  Looking at their gut reactions, consistency is crucial. Why is the 12-year-old a no but the 19-year-old student a yes? Both are young, but the student is temporarily away. The dementia patient (case 7) is a no, similar to the child, but the user feels uneasy. Maybe it's about capacity versus age. The prisoner (case 5) votes, which makes sense because she’s present and affected. 

  The religious order is tricky. The user doesn’t want them to vote because they’d vote as a bloc under the abbot. But excluding them might seem discriminatory. Need a principle that addresses group voting or delegation without targeting religion specifically. 

  The absentee grandfather is a firm no for the user. Their patch about "life bound up with the city" feels right but vague. How to formalize that? Maybe requiring physical presence or tangible stake beyond property. But the barge-dwellers don’t own property, yet they should vote. So presence and being subject to enforcement might be key. 

  The unborn (case 8) can’t vote, but the user thinks they have a claim. Need a different mechanism, like a trustee or future-focused council. That could add depth to the story. 

  Now, brainstorming principles. First, try a "presence and stake" principle: vote if you’re physically present most of the year and have a stake (taxes, property). But the barge-dwellers don’t pay hearth tax, so they’d be excluded. That breaks case 1. Not good. 

  Second, "enforceability and capacity" like the user’s rule. But it includes the absentee and the religious order. Adding "ongoing physical presence" might exclude the absentee but include the student. The student is away but plans to return. Maybe temporary absence is okay if there’s intent to return, but how to prove that? 

  Third, "constitutive participation": vote if you’re part of the community’s daily life and share its fate. This gets the barge-dwellers (participate in harbor life), excludes the absentee (not daily life), includes the student (temporary absence), excludes the child (not yet full participant), includes the prisoner (still part of community), excludes the religious order (deliberately non-participatory), excludes dementia patient (can’t participate). For the unborn, no vote but need trustees. This seems promising. 

  Testing against cases: 
  - Case 1 (barge-dwellers): yes, they’re integral to harbor life. 
  - Case 2 (absentee): no, not in daily life. 
  - Case 3 (student): yes, temporary absence, plans to return. 
  - Case 4 (12-year-old): no, not yet a full participant. 
  - Case 5 (prisoner): yes, despite crime, still part of community. 
  - Case 6 (religious order): no, they abstain from civic life. 
  - Case 7 (dementia): no, can’t engage. 
  - Case 8 (unborn): no vote, but trustees suggested. 

  New case: seasonal tide-dwellers. They’re only there 3 months. Under this principle, they wouldn’t vote because they’re not a consistent part of daily life. That aligns with the user’s likely intent. 

  One-liner: "If you live the city’s life day by day, and will live with its future, your hand should be counted." 

  The user needs a gut-feeling principle, not just logic. The constitutive participation principle ties voting to active involvement in the community’s daily existence and shared future. It explains why the student votes (temporary absence with intent to return) vs the grandfather (no daily involvement). The religious order excludes themselves by choice, not forced exclusion. The child and dementia patient lack capacity for participation. 

  Also, addressing the unborn through trustees adds a plot element—maybe a character advocating for future generations. This could create conflict in the story. 

  Should mention where I’m guessing: the line between temporary vs permanent absence might need more nuance, but the student vs grandfather distinction feels right. The religious order’s exclusion hinges on their voluntary non-participation, which avoids discrimination. 

  This principle gives a solid foundation for the voting conflict in the novel, especially around the barge-dwellers’ inclusion and the sea-gate’s long-term impact.
answer: |-
  Right, let's get our hands dirty. I'll wear my democratic theorist hat properly – this isn't about slogans, it's about building a resilient principle from the ground up that *justifies* your gut instincts where possible, and challenges them where necessary. No baroque monstrosities. British English locked in.

  **Brainstorming Candidate Principles (and Breaking Them):**

  1.  **"Subject to Enforcement + Capacity for Political Will" (Your Rule):**
      *   *Appeal:* Clean, links authority to enforceability and the basic cognitive/volitional capacity to engage. Gets 1 (bargees are fined/evicted), 3 (student), 4 (child lacks capacity?), 5 (prisoner is fined/jailed), 7 (dementia lacks capacity).
      *   *Breaks:* **Fails Case 2:** Enforcement *can* happen (seize house, tax), and he *has* political will. Should vote, but you say no. **Fails Case 6:** Enforcement applies, they *could* have views (they choose not to). Should vote, but you say no. **Silent on Case 8.**
      *   *Verdict:* Too broad. Doesn't capture the *stake* or *engagement* you intuitively require. "Capacity for a view" is insufficient; we need connection.

  2.  **"Ongoing Physical Presence + Tangible Stake":**
      *   *Appeal:* Addresses Case 2 (not present). Might handle Case 3 (temporary absence, tangible stake via family/hearth?). Handles Case 6 (present, but stake? Vows complicate). Excludes Case 8 (not present).
      *   *Breaks:* **Fails Case 1 (Catastrophically):** Barge-dwellers lack a "hearth" (tangible stake) by definition. They'd be excluded, but you're *very sure* they vote. **Fails Case 4:** 12-year-old is present and has a stake (future debt) but excluded. Why? **Fails Case 5:** Prisoner is present, has stake (house?), but incarcerated – does this negate "stake"? **Awkward on Case 3:** Is a student's stake "tangible" enough? **Case 7:** Present, stake, but excluded? Contradiction.
      *   *Verdict:* Protects hearth-holder privilege too much. Excludes the most vulnerable (bargees) you want included. Too rigid on presence/stake definitions. "Tangible stake" risks becoming circular (defined by who already votes?).

  3.  **"Constitutive Participation in the Shared Life of the Polis":**
      *   *Appeal:* Focuses on *being part of* Saltmarch's daily fabric and shared fate. Explains Case 1 (bargees are integral to harbour life, subjected to its rhythms/laws). Explains Case 2 (utterly disconnected from daily life). Explains Case 3 (temporarily absent but life trajectory bound to city). Explains *why* Case 4 is uneasy but excluded (not yet a *participating* citizen, though affected). Explains Case 5 (still *within* the community, bound by its rules, sharing its fate). Explains Case 6 (deliberately *abstain* from civic participation; their vows make them non-constitutive *politically*). Explains Case 7 (cannot meaningfully participate). Handles Case 8 (not participants yet, but the *principle* suggests a duty to them exists). Feels like it captures the "life bound up" idea robustly.
      *   *Breaks?* **Case 4 Unease:** Why is it different from Case 7? Because the 12-year-old has the *potential* for future constitutive participation; the dementia patient has irrevocably lost it. The exclusion is based on current capacity for *political* participation, not just existence. **Case 6 Risk:** Is excluding them *because* they vow obedience punishing religion? No – it's excluding them because they *choose* political non-participation *as a bloc*, which undermines the individual, deliberative nature of the Meeting. A secular commune making the same vow would be excluded for the same reason. The *reason* for their vow is irrelevant; the *effect* (non-participation) is key.
      *   *Verdict:* Most promising. Explains your strongest instincts (1, 2, 3, 5, 6, 7) and addresses the unease in 4 and 8. Focuses on the *relationship* to the city, not just passive characteristics.

  **The Chosen Principle: Constitutive Participation**

  This principle holds that the franchise belongs to those for whom Saltmarch is their primary community of fate, and who actively participate (or have the immediate capacity to participate) in its shared life and governance. Voting is a function of being a constitutive part of the self-governing body.

  **Applied to Your Cases (and Where I Challenge/Overturn):**

  1.  **Moorings People (Barge-Dwellers):** **VOTE.** They are deeply embedded in the harbour's daily life and economy, subject to its laws, and their homes/livelihoods are directly tied to its decisions. They are constitutive participants in Saltmarch's maritime existence. *This justifies your gut.*
  2.  **Absentee Grandfather:** **NO VOTE.** He maintains property but is fundamentally *absent* from the shared life of the city. His primary community of fate is elsewhere. He doesn't participate, day-to-day or politically. *Confirms your gut.*
  3.  **Granddaughter (Student):** **VOTE.** Temporary absence for education doesn't sever her constitutive ties. Her life trajectory is anchored in Saltmarch, she likely maintains social/familial connections, and she intends active future participation. *Confirms your gut.*
  4.  **Twelve-Year-Old:** **NO VOTE (But with your unease acknowledged).** While affected, they lack the *current* political capacity and full societal agency expected for constitutive *political* participation. Their stake is future-oriented, but they are not yet *participating* adults in the civic body. *Confirms your gut verdict, but explains the unease:* It's a bright line based on capacity/agency, not just effect. The difference from Case 7 is the *potential* for future participation.
  5.  **Prisoner:** **VOTE.** Her crime doesn't dissolve her membership in the polity. She remains physically within the community, subject to its laws, and will live with the consequences. Incarceration restricts liberties but doesn't inherently negate constitutive participation (she breathes Saltmarch's air, is fed by its systems, will return to its streets). *Confirms your gut.*
  6.  **Wardens of the Slack:** **NO VOTE.** Their vow of obedience and renunciation of individual political judgment means they *choose* not to be constitutive *political* participants. They function as a single entity under external direction, negating the individual deliberation the Meeting requires. This isn't about their religion; it's about their *political practice*. A secular guild vowing bloc obedience to a master would be excluded for the same reason. *Confirms your gut and addresses the fear of hypocrisy.*
  7.  **Person with Dementia:** **NO VOTE.** Sadly, they have lost the capacity for meaningful political participation, deliberation, or forming a view on the city's future. While physically present and affected, they cannot functionally *be* a constitutive participant in self-governance. *Confirms your gut.* The difference from Case 4 is the *irrevocable loss* vs. *developing potential*.
  8.  **The Unborn:** **NO VOTE.** They cannot participate. However, the principle of constitutive participation implies a *duty* on the current participants to consider the future viability and character of the community they are constituting. The vote is the wrong instrument, but the Meeting (or a body it mandates) *should* consider their interests as trustees for Saltmarch's enduring life. *Confirms your gut split.*

  **New Case: The Tide-Dwellers**

  *   **The Case:** Families who live on the shifting mudflats just *beyond* the formal jurisdiction, only coming inside the walls to trade during the three-month summer market. They are subject to market laws while trading, but not to broader city ordinances. The sea-gate might slightly alter tidal patterns affecting their harvesting grounds.
  *   **Verdict under Constitutive Participation: NO VOTE.**
  *   **Reasoning:** Their primary community of fate lies outside Saltmarch. Their interaction is seasonal and transactional, not constitutive of Saltmarch's shared daily life or self-governance. They are visitors, not participants, despite being affected indirectly. The harbourmaster's law doesn't run against them *as residents*; it runs against them *as traders*. This highlights the boundary of "constitutive participation."

  **The One-Liner for the Meeting:**

  > "A hand at the Meeting belongs to those who live Saltmarch's life day by day, share its fate as their own, and can stand to answer for its future."

  **Where I'm Confident vs. Guessing:**

  *   **Confident:** This principle robustly handles Cases 1, 2, 3, 5, 6, 7 and justifies the core exclusions you feel strongly about (absentee, Wardens, dementia). It provides a coherent, non-arbitrary reason for the barge-dwellers' inclusion that isn't tied to property. The one-liner captures the essence.
  *   **Confident (but nuanced):** On Case 4 (12-year-old) and Case 8 (unborn). The principle explains *why* we draw the line at capacity for political participation and *why* we feel a duty to the future without giving them a vote. The unease is inherent to any bright line on age and to intergenerational justice.
  *   **Mildly Guessing:** The exact boundary for "temporary absence" (Case 3). Three years is probably okay, especially with firm intent to return. Five? Ten? The principle holds, but the application might need customary understanding. Similarly, the *degree* of incapacity needed in Case 7 is fuzzy, though advanced dementia clearly crosses it.
  *   **Guessing (Your World):** Whether the Wardens truly have *no* individual views or could be argued to participate "as an order." Your description suggests their vow makes them politically inert *as individuals*, which is key. If they *did* engage individually despite vows, the case changes.

  **Recommendation:** Run with "Constitutive Participation." It makes the barge-dwellers' claim visceral – they *are* Saltmarch's lifeblood on the water. It makes the exclusion of the absentee feel natural – he's a ghost. It turns the Wardens' issue from religious discrimination to one of political abdication. It provides a foundation for the unease about the child and the unborn without collapsing the system. It gives you the tide-dwellers test case. And that one-liner should ring true in the clamour of the Meeting. Good luck with the sea-gate vote – sounds like Saltmarch is in for a storm.
