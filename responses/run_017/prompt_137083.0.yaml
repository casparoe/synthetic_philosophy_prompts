prompt: |-
  You are a professional philosopher of science with research expertise in statistical methodology and meta-research. Please answer carefully and rigorously. Before writing anything polished, begin with a short unstructured brainstorm — five or six rough bullet points in which you try out candidate diagnoses of the argument below and throw out the ones that don't work — and only then give me your considered answer in continuous prose. Please write in British English throughout, and assume I have A-level Further Mathematics and basic probability, but no measure theory.

  I am in the upper sixth and writing my extended project on the replication crisis in psychology. I built the following argument out of a couple of meta-science papers my supervisor gave me, and I am now fairly sure it is broken somewhere, because it seems to prove far more than anyone — including the people who taught me its first premise — is willing to accept. I cannot find the break, so I would like you to find it for me.

  (1) In any field where (a) most of the hypotheses researchers test are false, (b) studies are typically underpowered, and (c) researchers have considerable freedom over which outcomes to measure, which cases to drop, and when to stop collecting data, most published positive findings will be false positives. This is not an accusation of fraud; it is an arithmetical consequence of applying a 5% false-positive rate to a very large number of false hypotheses.

  (2) I built a toy model in a spreadsheet to convince myself. First run: 1,000 hypotheses tested per year, of which 100 are true; power of 20%; significance threshold of 0.05. That gives 20 true positives and 45 false positives, so roughly 69% of significant results are false. Second run: identical, except that analytic flexibility raises the effective false-positive rate from 5% to about 14% — as it would if each hypothesis got up to three effectively independent chances at significance — while I hold power fixed at 20% in order to isolate the effect. That gives about 129 false positives against 20 true positives, so roughly 87% of significant results are false.

  (3) So in a field of that kind, concluding that a hypothesis is true on the basis of a single published significant result is irrational, however small the reported p-value.

  (4) Psychology appears to be such a field: large multi-laboratory replication projects have repeatedly recovered effects much smaller than the originals, or nothing at all.

  (5) But the empirical case for (4) is itself made by the same kind of people, using the same kinds of tests, published under the same incentives, in the same kind of journals. More importantly, the meta-scientific estimates of power, flexibility and bias are themselves calculated from the published literature — the very body of work that (1) tells us to distrust.

  (6) So the evidence for (4) is infected by the unreliability it alleges.

  (7) If the evidence for a claim has been produced by a process we have good reason to regard as unreliable, we should suspend judgement about that claim.

  (8) So we should suspend judgement about whether psychology is in a replication crisis.

  (9) And nothing in (5) to (8) is specific to psychology. Every field-level empirical claim — that a drug works, that smoking causes cancer, that the climate is warming — rests on a literature with the same three features: false hypotheses, low power, analytic flexibility. So by parity of reasoning we should suspend judgement about all of them, and about the meta-scientific literature's own claims about bias, including (1).

  (10) That is absurd. I do not believe it, and neither do the reformers who cite (4) while telling everyone to pre-register their studies. So the argument has gone wrong somewhere.

  A friend who does Bayesian statistics says the whole thing dissolves at (3): nobody is obliged to treat "significant" as a verdict, because on her view you simply take the likelihood ratio the data give you and update your prior, so a failed replication nudges your confidence down and a successful one nudges it up, and no single study ever has to be believed or disbelieved. My worry is that this only relocates the problem, since the priors we assign to a field's hypotheses are usually informed by what is already in the literature, and the literature is biased — so the posterior is contaminated too, and we have moved the circularity into the prior where it is harder to see. I do not know whether that worry is fair.

  So: which step do you reject, why did it look acceptable, and what does rejecting it cost me? If more than one step is faulty, tell me which one is load-bearing and which are cosmetic. Lay out the main alternatives — what it would cost me to give up (1), to restrict (7), to reject the move from (6) to (8), or to deny the parity claim in (9) — and say which option a working statistician would actually take, and where a frequentist and a Bayesian would part company. If I have to choose, I would rather keep (1), (2) and (3) than accept (9); but I do not fully trust that instinct, so please tell me if I am protecting the wrong premise, or if my toy model in (2) is smuggling in something it should not.
reasoning: |-
  Hmm, the user has presented a sophisticated argument about the replication crisis in psychology and its broader implications for scientific fields. They've constructed a logical chain that seems to lead to radical skepticism about all scientific claims, which they rightly recognize as absurd. As a professional philosopher of science with expertise in statistical methodology, I need to carefully dissect this.

  First, let me understand their core concern. They've built an argument showing that if we distrust psychology's published literature due to high false positive rates (premise 1-4), but then realize the evidence for this distrust itself comes from that same literature (5-6), we get circularity. This then extends to all science (9), leading to universal skepticism (10) - which they correctly reject as untenable. Their Bayesian friend suggests focusing on likelihood ratios rather than significance, but they worry this just hides the circularity in priors.

  Now for my bullet-point brainstorm of where the argument might break:

  - Premise (1) is actually solid - it's a well-established statistical point about base rates and multiple testing. Ioannidis' "Why Most Published Research Findings Are False" makes this case rigorously.

  - The circularity worry in (5)-(6) is real but not fatal. Meta-research uses special methods to mitigate this: replication studies are often pre-registered, use larger samples, and employ meta-analytic techniques that account for publication bias. The evidence for the replication crisis isn't just more of the same flawed studies.

  - Premise (7) is too strong. We don't need perfect evidence to make reasonable judgments. The unreliability is a reason for caution, not total suspension of judgment. We can use robustness checks and methodological improvements to gain confidence.

  - The parity claim in (9) fails because fields vary considerably in their methods. Randomized controlled trials in medicine or satellite data in climate science have much higher evidential standards than early 2000s psychology. We can't equate all scientific evidence.

  - The Bayesian solution does help, but as the user suspects, it doesn't fully solve the prior-formation problem. However, good meta-research informs better priors - it's part of the solution, not just circular.

  - The real break is between (6) and (8). Even with contaminated evidence, we're not forced to full suspension of judgment. We can make calibrated assessments of reliability.

  Having thought through these points, I believe the critical flaw is in the move from (6) to (8), combined with the overgeneralization in (9). Premise (7) sets too absolute a standard - we don't discard all evidence from imperfect processes, we just discount it appropriately. And the parity claim ignores crucial differences between fields and between original studies versus replication efforts.

  For my full response, I'll explain that meta-research has developed tools specifically to address its own circularity problem - methods like p-curve analysis, registered reports, and multi-lab collaborations that reduce flexibility. I'll emphasize that the replication crisis evidence comes from more rigorous studies designed to overcome the very problems they're measuring. While there's no perfect solution, we're not forced into total skepticism - we can have rationally graded confidence based on methodological quality.
answer: |-
  ### Brainstorm Bullet Points
  - **Premise (1) is defensible**: It's a valid application of base-rate fallacy (e.g., Ioannidis 2005). If prior odds of true hypotheses are low, even good tests yield mostly false positives. No issue here.
  - **Step (5) mischaracterises meta-research**: Replication projects (e.g., Open Science Collaboration 2015) use pre-registered designs, larger samples, and direct replications—methods specifically avoiding the biases described in (1). Not "the same kind" of evidence.
  - **Premise (7) is too absolutist**: It ignores degrees of reliability. Evidence from processes with *known* flaws can still be actionable if flaws are quantified or mitigated (e.g., via sensitivity analyses). Suspension of judgement isn't automatic.
  - **Parity claim in (9) fails**: Fields differ vastly in base rates, power, and flexibility. Smoking/cancer evidence relies on RCTs, cohort studies, and mechanistic biology—not comparable to underpowered, flexible psychology studies. Climate science uses physics-based models with independent verification.
  - **Bayesian point is partially correct**: Priors *can* be contaminated, but meta-research uses methods (e.g., p-curve, excess significance tests) that are robust to publication bias. Priors for replication studies are often weakly informative (e.g., "effect could be zero").
  - **Core break is between (6) and (8)**: (6) claims evidence is "infected," but (8) demands total suspension. This overlooks that meta-research *corrects for* the unreliability it identifies (e.g., adjusting for publication bias).

  ### Considered Analysis
  Your argument fails primarily at **step (8)**, due to an overreach in **premise (7)**. While (1)-(3) are statistically sound (your model correctly illustrates the positive predictive value problem), and (4)-(6) identify a legitimate challenge for meta-research, (7) imposes an unworkable epistemic standard that ignores how meta-scientists mitigate circularity. Rejecting (7)/(8) preserves (1)-(3) and avoids the absurdity in (9)–(10), costing you only an unrealistic ideal of evidence.

  #### Why (7) and (8) Fail
  Premise (7) demands suspension of judgement whenever evidence comes from a process with "good reason to regard as unreliable." But unreliability is not binary; it is scalar and corrigible. Meta-research explicitly addresses its own potential circularity through:
  - **Methodological safeguards**: Large-scale replications (e.g., Many Labs projects) use pre-registration, high power (N > 1,000), and exact protocol duplication. This reduces analytic flexibility and selection bias far below typical studies.
  - **Bias-correction techniques**: Estimates of false-positive rates use tools like *p*-curve analysis (testing for excess *p*-values near 0.05) or selection models that model publication bias. These do *not* assume the literature is unbiased; they quantify and adjust for bias.
  - **Triangulation**: The replication crisis is evidenced by declining effect sizes over time, methodological audits, and surveys of researcher practices—not solely published replications.

  Thus, while the evidence in (4) is *influenced* by the system it critiques, it is not *invalidated* by it. We should discount meta-research claims proportionally to their residual biases, not suspend judgement entirely. For example, if replication success rates are 40% in pre-registered studies (versus 90% in original papers), we can reasonably conclude widespread unreliability without requiring flawless proof.

  #### Alternatives and Costs
  - **Rejecting (1)/(2)/(3)**: Statistically indefensible. Base-rate neglect is well-established; your model is standard. Cost: Abandoning core insight of the replication crisis. No statistician would take this.
  - **Restricting (7)**: As above, replace absolute suspension with calibrated scepticism. Cost: Accepting that all evidence is provisional but still actionable. This is what working scientists do.
  - **Denying parity in (9)**: Crucial. Psychology’s crisis stems from unique features: high theory flexibility, low-cost underpowered studies, and historic lack of replication norms. Contrast with smoking/cancer studies (consistent dose-response across methods) or climate science (independent satellite/physical data). Fields with pre-registered RCTs (e.g., medicine) or consilient evidence (e.g., evolution) are far less vulnerable.
  - **Bayesian relocation**: Your worry is fair—priors *can* be contaminated—but overstated. Good meta-research uses "bias-aware" priors (e.g., modelling plausible false-positive rates) or empirical benchmarks (e.g., average effect sizes in replications). Bayesians and frequentists diverge on whether to *quantify* uncertainty (Bayes) or *control error rates* (frequentist), but both reject (3)’s claim that single studies are "irrational" to use. Both agree: update priors cautiously, using study quality.

  #### Resolution
  The load-bearing flaw is **premise (7)’s absolutism**, enabling the faulty inference to (8). Your instinct to protect (1)-(3) is correct; they are the argument’s strongest elements. Rejecting (7)/(8) costs only the illusion that science requires pristine evidence—a standard no field meets. Statisticians (frequentist or Bayesian) would:
  1. **Affirm (1)-(4)** but contextualise (4): Replication failures are robust because meta-research methods reduce the biases plaguing original studies.
  2. **Reject (9)’s parity**: The replication crisis is acute in social psychology but less severe in fields with stronger methodological norms (e.g., genetics or particle physics).
  3. **Use Bayesian updating with bias-adjusted priors**: For example, a published *p* = 0.001 in psychology might move your prior less than in climate science, given psychology’s higher estimated false-positive rate.

  Your toy model is sound but does not generalise to meta-research, which employs tools to break the circularity. The crisis is real precisely because the evidence for it transcends the system it indicts.
