prompt: |-
  Hey — I found a blog post about objective chance and rational credence, and I want to know how much of it to trust before I repeat any of it in a reading group presenation next week. Here's the central bit, roughly as written:

  "Objective chance just is long-run relative frequency, so the Principal Principle — the claim that your credence in an outcome, given that its chance is x, should be x — is basically the instruction to set your beliefs by the frequencies you have observed. Because chances are the same for everyone, any two people who start with the same evidence have to end up with the same credence in the same outcome, and that is what makes the principle a requirement of rationality rather than mere advice. It also means nothing except the chance may move you: if a coin is fair, betting on tails because of a horoscope is straightforwardly irrational, since evidence can only ever get a grip on your credence by changing your estimate of the chance."

  My instinct is that the first sentence is the shaky one and the rest is fine, but the author also throws around the word "admissible" without ever explaining it, which is where I suspect the real cheating is.

  I've also been stuck on a case the post never mentions: a genuinely one-off setup. Imagine a machine built to produce a single particle, with its "chance" of decaying in the next minute set once at 0.7, and then the machine is destroyed — there is no sequence of repeatable trials anywhere in the world for 0.7 to be a frequency of. The author would presumably say the principle still applies and my credence should just be 0.7. Does the one-off-ness break anything, or not?

  Can you take the passage apart for me: what someone who defends the Principal Principle would accept as stated, what they'd call a conflation or an overstatement rather than an outright error, and what they'd reject — and then say whether the horoscope conclusion actually follows from the parts that are right. Don't cite anything or give me a reading list, I just want the concepts straight. Keep the whole reply under 450 words; bullets are fine.
reasoning: |-
  Okay, the user is preparing for a reading group presentation on objective chance and the Principal Principle. They found a blog post that claims objective chance is identical to long-run relative frequency and that the Principal Principle requires setting credences based on observed frequencies. The user suspects the first sentence is shaky and is concerned about the author's use of "admissible" without explanation. They also present a one-off machine case to test the theory.

  First, I need to address the core claim: that objective chance is long-run relative frequency. This is actually a specific philosophical position—frequentism. But many philosophers, like David Lewis, see chance as more fundamental, not reducible to frequencies. The Principal Principle doesn't depend on frequentism; it's about constraining credence based on chance, whatever chance is. So labeling that as an outright error makes sense.

  The user is right to worry about "admissible" being unexplained. Admissibility is crucial in the Principal Principle—it specifies when other evidence can override chance information. The author's claim that only chance should influence credence oversimplifies because without admissibility, there's no room for other relevant evidence. That's a conflation, merging chance with total evidence.

  The one-off case is interesting. Frequentists struggle with single events, but the Principal Principle still applies. Chances can be properties of single cases, like the machine's setup, even without frequencies. So the user's credence should be 0.7, and the one-off nature doesn't break the principle. The author's stance would hold here, but for the wrong reasons if they're strict frequentists.

  The horoscope example: the author says betting based on a horoscope is irrational if the chance is known. The conclusion is correct but for incomplete reasons. Rationality requires aligning credence with objective chance unless there's overriding admissible evidence. A horoscope isn't admissible, so it shouldn't affect credence. But the author's reasoning misses the nuance of admissibility, making their argument weaker.

  The user's deeper need is to confidently critique the blog post during their presentation. They need to identify where the author oversimplifies, especially regarding frequentism and admissibility. Highlighting the one-off case shows the principle's robustness beyond frequencies, which strengthens their critique. Emphasizing admissibility clarifies why the horoscope is irrational, correcting the author's incomplete justification.
answer: |-
  Here's a breakdown of the passage:

  1.  **Outright Error:**
      *   **"Objective chance just is long-run relative frequency."** This is a specific, contested view (frequentism). The Principal Principle (PP) is *compatible* with frequentism but **does not require it**. Most defenders of the PP (like Lewis) argue chance is a *more fundamental* physical property *manifested* in frequencies, not identical to them. This matters for the one-off case.

  2.  **Conflation/Oversimplification:**
      *   **"Because chances are the same for everyone, any two people... same credence... same outcome."** This oversimplifies *dramatically*. The PP says **given the same *total evidence*** (which crucially *includes* knowledge of the chance), they should have the same credence. Evidence varies massively. The author conflates "same chance" with "same evidence".
      *   **"evidence can only ever get a grip... by changing your estimate of the chance."** This incorrectly collapses *all* evidence into chance evidence. Evidence *also* affects credence via the PP's **admissibility clause** (your suspicion is spot-on). Evidence can be *inadmissible* (e.g., future outcomes, crystal balls) and override the chance directly *without* changing your estimate *of* the chance.

  3.  **Acceptable Core (with caveats):**
      *   The PP *does* instruct you to align credence with known objective chance (Cr(A | ch(A)=x & E) = x), **provided E is admissible**.
      *   The horoscope conclusion **is correct** (betting against known chance based on a horoscope *is* irrational) **BUT** the reasoning given is flawed/incomplete. The *real* reason is that the horoscope information (if believed at all) is **inadmissible evidence** relative to the chance proposition. The PP explicitly *allows* non-chance evidence to move your credence *if* it's admissible (like historical data affecting a frequency estimate) – it doesn't *only* work via changing the chance estimate.

  **The One-Off Case:**
  *   It **does not break** the PP. A defender would say the machine setup *confers* an objective single-case chance property of 0.7. Your credence *should* be 0.7 upon learning this chance (assuming no other relevant evidence). This case *highlights the error* in the author's frequentist definition – the chance *exists* even without a long run. The PP still applies directly.

  **In short:** The core PP idea (align credence with known chance) is sound, but the author's frequentist definition of chance is wrong, their explanation of evidence's role is confused/missing admissibility, and their "same credence" claim is a significant oversimplification. The horoscope conclusion holds, but for better reasons than given.
