prompt: |-
  I'm a backend engineer and somehow ended up running a biweekly lunch thing at work that's vaguely about "ethics in engineering" — it's mostly just me and 12-16 other engineers in a room for an hour, mixed levels, maybe two people who've read any philosophy at all, one guy who thinks the whole enterprise is performative guilt, and one or two who will go full utilitarian about ten seconds after you say "greatest number." Last month I tried to run a discussion on that Singer essay — the old one about famine, where he starts with a kid drowning in a shallow pond and you'd ruin your clothes to pull them out, then slides to "so why not send the money to strangers far away" — and it was a mess. Half the room kind of shrugged and agreed with the conclusion in a way that meant nothing, the rest treated it as a gotcha about how we should all donate everything and live in a tent, and nobody actually felt anything. I want a redo, as an activity rather than a discussion: people doing something with rules, not sitting around opining.

  Two things I care about, and then the design constraints. First, I don't want anyone to hear the name Singer or the pond case up front — I want them to build the escalation themselves and only find out at the end what they'd been arguing about. Second, the currency shouldn't be money. If it's dollars, everyone's brain goes straight to their salary and charity overhead and it stops being about the structure of the argument. What I'd rather use is the thing my team actually fights about: interruption. So give everyone a budget of "focus" — like on-call paging budget, a limited number of context switches per hour — and make the cost of spending it *convex*: the first interruption is cheap, the third one in the same period wrecks your whole afternoon. I have a suspicion that a convex cost curve gives you something interesting here, like a stopping point that isn't just an arbitrary line you drew, and I genuinely can't tell whether that's a real answer to the argument or whether it just relocates the arbitrariness one level down — I'd like the activity to put the group right on that fork so they have to say which it is. I also want a mechanic for the "someone else would have handled it anyway" move: give each rescue a backup responder who usually but not always acts, so people can watch their own marginal contribution go to zero and then have to decide whether that dissolves the obligation or just launders it. And somewhere in there the distance thing has to show up — cases right in front of you versus a name on a list versus something you can only see as a statistic — but as a feature of the rules, not as me asking "but does distance matter, guys?" No real money, no actual donations, no leaderboard anyone cares about.

  What I need from you: an activity I can literally run in 60 minutes with whatever I can print or hand out on index cards. Rules, materials, a payoff or scoring scheme that doesn't need real stakes, a minute-by-minute timeline, and then a debrief that maps specific moments in the game onto the specific moves in the argument — including where I should finally say the name out loud and how. Tell me what will predictably go wrong the first time: the two utilitarians derailing it, the guy who tries to game the mechanics instead of engaging, the person who checks out because it feels preachy, the risk of it turning into a fight about real charities. And be honest about which part of the argument the game can't reproduce — the bit where you just have to stop and tell them something, because no set of rules will get them there. Success for me is everyone leaving able to state the strongest version of the argument and their single hardest-to-shake objection to it, rather than "so I guess we should give more money," which is what I got last time.
reasoning: |-
  We are designing an activity called "Focus Famine" that uses interruption budgets to explore ethical obligations in a way that parallels Peter Singer's drowning child argument without mentioning it until the end. The key elements are:

  1. **Budget of "focus"**: Each participant gets a limited number of "focus tokens" representing their capacity to handle interruptions without severe productivity loss. The cost of interruptions is convex: the first interruption costs 1 token, the second in the same time period costs 2 more (total 3), the third costs 3 more (total 6), etc. (cumulative cost = n(n+1)/2 for n interruptions in a period).

  2. **Interruption scenarios**: We present a series of interruption events (printed on index cards) that occur over several rounds (each round representing a short time period, e.g., 15 minutes of work). Each event describes a problem that requires immediate attention and costs a certain number of tokens to resolve. The events vary in:
     - **Proximity**: 
       - Level 1: Direct and personal (e.g., "A colleague at the next desk is stuck and asks for help.")
       - Level 2: Indirect but known (e.g., "You see a message in a team channel about a problem in a service you own.")
       - Level 3: Abstract and statistical (e.g., "A monitoring alert shows a spike in errors in a service you don't own, but it's affecting many users.")

     - **Backup responder**: Each event has a listed backup (e.g., "Backup: Jane Doe, who has a 70% chance of handling it if you don't"). If the participant chooses not to handle the event, we roll a die (or use a random number generator) to see if the backup handles it. If the backup doesn't handle it, the problem goes unresolved, leading to a penalty (e.g., loss of productivity points).

  3. **Objective**: Participants are trying to maximize their "productivity points" over several rounds. They start with a base of 100 points per round. Each unresolved problem (after backup fails) deducts points (e.g., 10 points for Level 1, 5 for Level 2, 1 for Level 3). But handling an interruption costs tokens, and if they run out of tokens, they cannot handle any more interruptions and also suffer a penalty (e.g., 50% point loss for the round) for being completely distracted.

  4. **Structure**:
     - **Rounds**: 4 rounds (each representing a work period, e.g., 15 minutes). Each round, every participant faces 1-2 interruption events (drawn randomly from a deck, but the deck is designed to have a mix of levels and backups). The events are presented in sequence (one at a time) so they can decide whether to spend tokens or not.
     - **Tokens**: Each participant gets 10 tokens for the whole session (4 rounds). The cost for handling the k-th interruption in a round is k tokens (so first is 1, second is 2, etc.). Tokens not spent in one round carry over.

  5. **Mechanics**:
     - At the start of each round, reset the interruption count (but not the token budget).
     - For each event in the round, the participant decides: handle it (and pay the current cost for that round) or pass (then we check backup).
     - If they pass, roll a die: if the backup's probability is p, then if a d10 roll is <= p*10, the backup handles it (no penalty). Otherwise, penalty.
     - If they run out of tokens, they cannot handle any more interruptions and must pass on all remaining events.

  6. **Scoring**: 
     - Base: 100 points per round.
     - Deduct for each unresolved problem (after backup fails): 
          - Level 1: -10 points
          - Level 2: -5 points
          - Level 3: -1 point
     - If a participant spends tokens such that the cumulative cost in a round is >= some threshold (say, 6 tokens in one round), they are "overwhelmed" and lose 50% of the base points for that round (so 50 points) in addition to any unresolved problems.

  7. **Materials**:
     - Index cards for events (about 20 unique events, with variations in level and backup probability). Example:
          - Card 1: "Colleague at next desk is stuck on a bug. They need your help now." 
            Level: 1, Backup: "Senior Engineer Bob (50%)", Penalty: 10
          - Card 2: "Alert: Service X is down. You are a secondary on-call." 
            Level: 2, Backup: "Primary on-call (80%)", Penalty: 5
          - Card 3: "News report: Major outage in a service you don't own, affecting thousands." 
            Level: 3, Backup: "Other teams (90%)", Penalty: 1
     - Tokens: Poker chips, paper clips, or just track on paper (each participant gets a token tracking sheet).
     - Score sheets for each participant.
     - Dice (d10) for backup resolution.

  8. **Timeline (60 minutes)**:
     - 0-5 min: Introduction. Explain the rules without any ethics framing. Say: "We are simulating a workday with interruptions. Your goal is to maximize productivity points. You have 10 tokens. Each interruption you handle costs tokens: the first one in a round costs 1, the second 2, etc. If you run out of tokens, you can't handle more. If you don't handle an interruption, there's a backup who might handle it, but if they don't, you lose points. Also, if you handle too many in one round (cost >=6 tokens) you get overwhelmed and lose half the round's base points. We'll do 4 rounds, each with 2 interruptions."
     - 5-40 min: Gameplay (4 rounds, each round: 2 events per participant). For each round:
          - Announce round number.
          - For each event (one at a time), read the event (or hand out the card). Give participants 1 minute to decide: handle or pass? 
          - If pass, roll the die for backup. Record outcomes and update scores.
          - Move to next event. After two events, end the round and reset the interruption count (but tokens carry over).
     - 40-50 min: Scoring and tally. Have participants calculate their total points. Ask for a show of hands for high, medium, low scores. Don't make it a competition.
     - 50-60 min: Debrief. Now reveal the connection to Singer's argument.

  9. **Debrief Structure**:
     - Start by asking: "What strategies did you use? How did you decide when to spend tokens?"
     - Then: "Did you notice patterns? For example, did you always help the colleague next to you? What about the far-away outage?"
     - Introduce the analogy: "This game was designed to mirror an ethical argument. The tokens are your limited attention, and the interruptions are demands for help. The cost curve was convex to model how interruptions compound. The levels of proximity parallel real-life distance: the colleague is like the child in front of you, the team channel is like a distant but known person, and the statistical alert is like a famine far away."
     - Now reveal: "This is based on an argument by philosopher Peter Singer. He says: if you would ruin your clothes to save a drowning child in front of you, then why not send the equivalent money to save a child far away? The drowning child is like your Level 1 interruption. The famine is Level 3. But in the game, what happened? Did you always help Level 1? What about Level 3? Why or why not?"
     - Key questions:
          - "What happened when the backup had a high chance of handling it? Did that make you less likely to spend tokens? Is that like saying 'someone else will donate'?"
          - "The convex cost: did it give you a natural stopping point? Or did it just move the arbitrariness to 'why is the cost curve convex?'"
          - "How did the distance (level) affect your decisions? Was it just about the penalty points, or did it feel different?"
     - End by asking each person to state (anonymously on a sticky note) the strongest version of the argument they see and their hardest objection. Collect and read a few.

  10. **Predictable Problems**:
      - **The two utilitarians**: They might try to calculate the exact expected value for every decision. That's okay! It's part of the experience. But if they dominate discussion, note that in the debrief: "Some of you might have tried to optimize every decision. Did that feel like the right approach? Or did it miss something?"
      - **The gamer**: Someone might ignore the spirit and just min-max the points. That's fine. In debrief, ask: "Did anyone feel like the scoring rules missed something important? What would you change to make it feel more real?"
      - **The skeptic**: If someone checks out because it feels preachy, the gameplay might engage them. In debrief, acknowledge: "This isn't about telling you what to do. It's about examining how we make these decisions. The game mechanics are arbitrary, but so are our real-life heuristics."
      - **Fight about real charities**: Avoid by keeping the game abstract. If someone brings it up, say: "We're not talking about real charities today. We're looking at the structure of the argument. What did the game show about that structure?"
      - **Risk of not feeling anything**: The activity might still feel cold. Counter by asking in debrief: "When you passed on an interruption and the backup failed, how did that feel? What about when you were overwhelmed?"

  11. **What the Game Can't Do**:
      - It can't replicate the emotional weight of a real drowning child. The game is abstract and points-based. In the debrief, you might say: "In real life, the child in the pond would feel immediate and visceral. The game can't capture that. So what does that say about the argument? Is the emotional response a distraction or a crucial element?"

  12. **Success Metrics**:
      - Everyone can state the core argument: "If you would help in a nearby, visible emergency, then you should also help in a distant, abstract one, because the need is the same and your obligation doesn't depend on distance."
      - And their hardest objection: e.g., "The convex cost curve shows that we have limited capacity and must prioritize," or "The backup probability means I'm not obligated because someone else will do it," or "The game shows that we do use distance as a heuristic, and that's rational because of uncertainty."

  **Final Preparation**:
  - Print event cards (enough for 4 rounds * 2 events per participant * 16 people = 128 cards, but you can reuse some).
  - Print token tracking sheets and score sheets.
  - Bring dice or use a random number app.

  This design meets your constraints: no money, no real donations, and it uses interruption as the currency. The convex cost and backup mechanics are central. The debrief explicitly maps to Singer's argument only at the end.
answer: |-
  Here’s a complete, ready-to-run activity called **"Focus Famine"** designed to recreate Singer’s argument using interruption budgets, convex costs, and backup responders—without mentioning ethics until the debrief. It forces players to confront the structural parallels to the drowning child dilemma through mechanics, not discussion.

  ---

  ### **Activity: Focus Famine**
  **Objective:** Players manage a limited "focus budget" to handle interruptions. The goal is to maximize productivity points by deciding when to intervene in problems (vs. relying on backups) while avoiding cognitive overload.

  #### **Materials (Per Player)**
  - **10 Focus Tokens** (paper clips, coins, or drawn on a tracking sheet).
  - **1 Decision Sheet** (see template below).
  - **1 Set of 6 Interruption Cards** (detailed in *Setup*).
  - **1 d6 Die** (for backup resolution).

  #### **Setup**
  1. **Print Interruption Cards** (6 types, 3 copies each for 16 players):  
     Each card has:
     - **Problem Description** (varying proximity)
     - **Backup Success Chance** (d6 roll needed)
     - **Penalty if Unresolved** (productivity loss)
     - **Intervention Cost** (escalating per round)

     | Card Type | Problem Description | Backup Success (Roll ≤) | Penalty | Cost (Tokens) |
     |----------|---------------------|-------------------------|---------|--------------|
     | **L1: Desk Fire** | “Smoke from a trash can at your desk. It’s small but spreading.” | 2 (33%) | -20 | 1 (first), +1 per add’l |
     | **L2: Team Alert** | “Slack alert: Your team’s test pipeline is broken.” | 4 (66%) | -10 | 1 (first), +1 per add’l |
     | **L3: Org Incident** | “Email: Company-wide VPN outage. 1000+ users blocked.” | 5 (83%) | -5 | 1 (first), +1 per add’l |
     | *(Repeat L1-L3 for variety)* | | | | |

  2. **Create Decision Sheets**:
     ```markdown
     Round | Interruption | My Action (Handle/Pass) | Backup Roll (If Passed) | Tokens Spent | Points Change
     ------|-------------|-------------------------|-------------------------|--------------|-------------
     1     | Card ____   | _________               | _________               | _____        | _____
     1     | Card ____   | _________               | _________               | _____        | _____
     2     | ...         | ...                     | ...                     | ...          | ...
     ```

  3. **Scoring**:
     - Start with **100 points**.
     - **-Points** for unresolved problems (after backup fails).
     - **-30 points** if total tokens spent in a round ≥ 6 (convex cost: "overwhelm penalty").
     - Points are symbolic (no real stakes).

  ---

  ### **Rules & Mechanics**
  1. **Focus Budget**: Players start with **10 tokens**.  
  2. **Convex Cost**:  
     - First interruption handled in a round costs **1 token**.  
     - Second costs **+2 tokens** (total 3).  
     - Third costs **+3 tokens** (total 6).  
     *(Formula: nth interruption costs n tokens cumulatively in the round)*.  
  3. **Backup Responders**:  
     - If a player **passes**, roll d6. If roll ≤ backup chance, problem resolved (no penalty).  
     - If roll > backup chance, penalty applies.  
  4. **Rounds**:  
     - 4 rounds (10 mins each).  
     - Each round, players draw **2 interruption cards** (randomly dealt).  
     - Players decide sequentially (card 1, then card 2) whether to **handle** (spend tokens) or **pass** (trigger backup roll).  
  5. **Win Condition**: Highest points win (prize: bragging rights).  

  ---

  ### **Timeline (60 Minutes)**
  - **0–5 min: Intro & Rules**  
    - *Say:* “This is a productivity sim. Manage interruptions using tokens. Goal: max points. No ethics—just mechanics.”  
    - Distribute materials.  
  - **5–45 min: Gameplay (4 Rounds × 10 min)**  
    - **Per Round**:  
      1. Deal 2 cards per player.  
      2. Players decide on Card 1: **Handle** (mark tokens spent) or **Pass** (you roll backup die).  
      3. Repeat for Card 2.  
      4. Record points/tokens. Reset per-round costs (tokens carry over rounds).  
    - *Facilitator:* Walk the room, help with math/dice.  
  - **45–50 min: Tally Scores**  
    - Players calculate final points. Ask top/bottom scorers to share totals (no names).  
  - **50–60 min: Debrief**  
    - *(Structure below)*  

  ---

  ### **Debrief Script (Key Moments → Ethical Moves)**
  **Goal:** Reveal the Singer parallel only at the end. Start gameplay-focused, then pivot.  

  1. **Open with Mechanics** (2 min):  
     - *Ask:* “What strategies worked? Did anyone avoid handling interruptions? Why?”  
     - *Listen for:* Token scarcity, backup reliance, overwhelm.  

  2. **Map to Real World** (3 min):  
     - *Say:* “Notice how costs escalated? That convex curve models cognitive drain. The first interruption is cheap—the third wrecks you. And backups? They’re the ‘someone else will fix it’ hope.”  

  3. **Reveal the Analogy** (3 min):  
     - *Say:* “This mirrors a classic ethics argument. Imagine:  
       - **L1 (Desk Fire)** = A child drowning in front of you.  
       - **L3 (VPN Outage)** = Starving strangers far away.  
       Your tokens = resources (time/money). Backups = other potential helpers.”  
     - **Drop Singer’s name**: “This is Peter Singer’s *drowning child* argument. You just lived it—with interruptions instead of money.”  

  4. **Confront the Fork** (2 min):  
     - *Ask:* “Did the convex cost feel like a *real* limit? Or did it just hide where you draw the line? When did you say ‘no’—and was it because of cost, or distance?”  
     - *Highlight:* “Singer says distance shouldn’t matter. But in the game, L1 felt urgent. L3? Easy to pass. Why?”  

  5. **Hardest Objection** (Final 1 min):  
     - *Ask:* “On a sticky note, write:  
       1. Singer’s strongest point: ______.  
       2. My biggest objection: ______.”  
     - *Collect and share anonymously*.  

  ---

  ### **Predictable Problems & Fixes**
  - **Utilitarians derailing gameplay**: They’ll min-max tokens/backups. *Use it!* In debrief, ask: “Did optimizing points feel ethical? Or just rational?”  
  - **Gamer ignoring the spirit**: Someone will always pass L3 to hoard tokens. *Solution:* In debrief, contrast their score with players who handled more. Ask: “Did high scorers feel like they ‘won’… or failed?”  
  - **Skeptic tuning out**: If someone calls it preachy, say: “This isn’t about guilt—it’s about *why* we draw lines. The game’s rules are arbitrary… just like real-life heuristics.”  
  - **Charity debate**: Shut down with: “We’re not talking real donations. We’re asking: Does *structure* change obligation?”  
  - **Emotional disconnect**: Players won’t “feel” the distant crisis. *That’s the point.* Debrief: “The game can’t make L3 feel visceral. Is that why we ignore real famines?”  

  ---

  ### **What the Game Can’t Do**
  - **Replicate visceral guilt**: No mechanic can make players *feel* the drowning child. You must **tell them**:  
    > “Singer’s power is in the initial punch: *You’d save the child.* The rest is logic. But logic doesn’t spark action—emotion does. The game shows why we agree with Singer… then ignore him.”  

  - **Solve the arbitrariness**: The convex cost *feels* rational but is still arbitrary. Use the debrief to ask: “Is ‘I’ll help until it hurts’ better than ‘I’ll help only if it’s close’? Or is ‘hurt’ just another line?”  

  ---

  ### **Why This Works**
  - **Singer without Singer**: Players experience marginal costs, backup failures, and proximity bias *before* labeling it.  
  - **Convex costs create tension**: Handling that third interruption *hurts*—forcing trade-offs.  
  - **Backups = “someone else”**: Rolling dice makes probabilistic help tangible.  
  - **Points > morality**: Avoiding real money prevents defensiveness.  

  **Success looks like**: Engineers arguing about token allocation, then realizing: *“Oh shit, we’re doing ethics.”* And leaving able to say:  
  > “Singer: If you’d save a nearby child, you must help faraway ones.  
  > But: My attention is scarce, backups exist, and I can’t set myself on fire.”  

  Print the cards, grab dice, and run it. Let the mechanics do the preaching.
