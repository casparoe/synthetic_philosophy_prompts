prompt: |-
  I teach a first-year undergraduate seminar, "Courts, Committees and Collective Reason," in a politics-and-law programme, and I have one fifty-minute session to get students to the point where they can state, and then explain to someone else, why a bench or committee that settles every question before it by majority vote can end up collectively committed to a set of judgments that no individual member holds and that cannot all be true together — the discursive dilemma. Almost none of them have done any formal logic, they arrive thinking of voting as a matter of choosing between candidates or options, and a few will assume the topic is really about jury bias or about how to run a meeting well. Plan the session for me rather than explaining the material to me.

  Order. Give me the sequence in which the components have to appear, with the dependency: the move from voting over options to voting over connected propositions, the point at which a logical relation (two premises that jointly entail a conclusion, neither entailing it alone) has to be on the board relative to the vote profile, and the point at which I draw the collective judgment set and let them see the collision. Mark any step where the natural order tempts me to move faster than they can follow.

  Carrying example. I want one invented example — not the textbook one, since I want to be able to tune it — that carries the whole session. It must have: a small odd-numbered decision-maker; two premises that look like genuinely separate questions and a conclusion entailed by their conjunction; a profile on which each premise is majority-accepted while the conclusion is majority-rejected; and it must be invertible, so that by flipping the profile I get the mirror case in which the conclusion is majority-accepted although neither premise is, letting me show that premise-first and conclusion-first procedures can come apart in either direction. Tell me what the example must contain and what it must avoid: the premises must not look like restatements of each other, the conclusion must not be a rewording of one premise, and the example should not turn on a dispute about the facts rather than about how a rule applies, because that confusion will consume the session if the case invites it.

  Contrast. Several will have met majority cycling over three or more candidates. I need them to leave able to say what is different here — that no individual member is inconsistent and that there is no cycle to point at; the defect is in the collective set. Tell me where in the sequence, and with what board work, to make that contrast land.

  Misconceptions. I expect at least these: that the majority is simply contradicting itself and can be charged with irrationality; that the remedy is to vote only on the final outcome, where I need them to see the cost — a body that owes reasons cannot just announce a verdict, and the premise route can deliver an outcome most members would reject; that it is an artifact of having three members or of a rigged profile; and, subtlest, that they will miss that the majority for the first premise and the majority for the second can be made of different people. Give me the further misconceptions I should expect, and for each the exact moment in the session to defuse it and the single sentence that does the defusing.

  Refusals. I will not open the door to general impossibility results about aggregation rules, and I have no time for weighted or probabilistic voting. Tell me what to say, and what to say I am declining to say, when the strongest student in the room asks whether some rule avoids the problem entirely.

  Check. Give me one closing question, set on a structurally different case — a panel applying a written rule with three conditions to a grant application, say — whose answer tells me whether a student has the idea or has merely learned to fill in the table.
reasoning: |-
  We are designing a 50-minute session to introduce the discursive dilemma to first-year undergraduates without formal logic background. The goal is for students to state and explain why majority voting on connected propositions can lead to collective inconsistency even when every individual is consistent.

  ## Session Plan: Sequence and Dependencies

  1. **Introduction (5 minutes)**
     - Start by acknowledging that they think of voting as choosing between candidates (like in elections) or options (like in a meeting). But today, we are going to think about voting on reasons or propositions that are logically connected.
     - **Example Setup**: We are going to imagine a committee that has to make a decision based on two premises and then a conclusion. The committee members are going to vote on each proposition.

  2. **Introduce the Carrying Example (10 minutes)**
     - Present the invented example (details below). The example: A three-member committee (Alice, Bob, Charlie) is deciding whether to approve a new campus club. The rule is: "A club must be approved if (P1) it is open to all students and (P2) it does not duplicate an existing club's purpose." The conclusion (C) is "Approve the club."
     - Note: The logical connection: The rule says that if P1 and P2 are both true, then C must be true. So, if the committee accepts both P1 and P2, then they must accept C. But they are going to vote separately on P1, P2, and then on C? Or maybe they vote on the premises and then the conclusion is derived? We'll see.

  3. **Voting on Propositions (5 minutes)**
     - Explain that each member will vote on each of the three propositions (P1, P2, C) based on their judgment. But note: each member's set of judgments must be consistent. For example, if a member accepts both P1 and P2, they must accept C. Similarly, if they reject C, they must reject at least one of P1 or P2.

  4. **Present the Profile (10 minutes)**
     - Write on the board a table for three members and three propositions:

       | Member | P1: Open to all? | P2: Not duplicative? | C: Approve? |
       |--------|------------------|----------------------|-------------|
       | Alice  | Yes              | No                   | No          |
       | Bob    | No               | Yes                  | No          |
       | Charlie| Yes              | Yes                  | Yes         |

     - Now, take a majority vote on each proposition:
       - P1: Alice and Charlie say Yes -> Majority Yes (2-1)
       - P2: Bob and Charlie say Yes -> Majority Yes (2-1)
       - C: Only Charlie says Yes -> Majority No (1-2)

     - Collective judgment set: {P1: Yes, P2: Yes, C: No}. But note: if P1 and P2 are both true, then by the rule, C must be true. So the collective set is inconsistent.

  5. **Highlight the Inconsistency (5 minutes)**
     - Show that no individual is inconsistent: 
       - Alice: P1 yes, P2 no -> can consistently say C no (because the rule doesn't require approval if one condition fails).
       - Bob: P1 no, P2 yes -> can consistently say C no.
       - Charlie: P1 yes, P2 yes -> must say C yes, and does.
     - The collective set is inconsistent even though every individual is consistent.

  6. **The Mirror Case (5 minutes)**
     - Flip the profile to show the other side:

       | Member | P1: Open to all? | P2: Not duplicative? | C: Approve? |
       |--------|------------------|----------------------|-------------|
       | Alice  | No               | Yes                  | Yes         |
       | Bob    | Yes              | No                   | Yes         |
       | Charlie| No               | No                   | No          |

     - Majority vote:
       - P1: Only Bob says Yes -> Majority No (1-2)
       - P2: Only Alice says Yes -> Majority No (1-2)
       - C: Alice and Bob say Yes -> Majority Yes (2-1)

     - Collective judgment: {P1: No, P2: No, C: Yes}. But if both premises are false, the rule does not require approval, but it doesn't forbid it either? So this might not be inconsistent? Wait, we have to be careful.

     - Actually, the rule doesn't say that the club must be approved only if both premises hold. It says "must be approved if both hold", but it might be approved for other reasons? We must avoid this confusion.

     - **Adjustment**: We must define the rule strictly: The club is approved if and only if both premises hold? Or at least, the rule we are using for the decision is that the club is approved only when both premises hold. But then the collective set {P1: No, P2: No, C: Yes} would be inconsistent because the rule says that both premises must hold for approval, so if either fails, the club should not be approved. However, in the example, the rule was stated as a sufficient condition, not necessary. This is a problem.

     - **Fix the rule for the example**: Let's restate the rule to avoid ambiguity: "The committee must approve the club if and only if both conditions are met: (P1) it is open to all students and (P2) it does not duplicate an existing club." Then, the logical connection is: C if and only if (P1 and P2). Then in the mirror profile:

       - Alice: P1 no, P2 yes -> then according to the rule, C should be no, but Alice says C yes? That would be inconsistent. So we must adjust the judgments to be consistent for each member.

     - Revised mirror profile (with consistent individuals):

       | Member | P1: Open to all? | P2: Not duplicative? | C: Approve? |
       |--------|------------------|----------------------|-------------|
       | Alice  | No               | Yes                  | No          |
       | Bob    | Yes              | No                   | No          |
       | Charlie| No               | No                   | No          |

       Now, majority:
          P1: No (Alice and Charlie say No, Bob says Yes -> 2 No)
          P2: No (Bob and Charlie say No, Alice says Yes -> 2 No)
          C: No (all say No -> 3 No)

       This doesn't give the mirror case.

     - We need a profile where the majority rejects both premises but accepts the conclusion. So let's try:

       | Member | P1 | P2 | C  |
       |--------|----|----|----|
       | Alice  | No | No | Yes|   -> Inconsistent? If C requires P1 and P2, then if both are No, C should be No. So this is inconsistent for Alice.

     - Therefore, we must have a rule that allows for other reasons? But that breaks the logical connection. Alternatively, we can use a different example for the mirror case? Or note that the mirror case is not always inconsistent? Actually, the mirror case in the literature is when the majority rejects both premises but accepts the conclusion. But that requires that the rule is not biconditional. So let's stick to the original example and only show the first inconsistency. Alternatively, we can use a different example for the mirror.

     - **Alternative for mirror**: Instead of the club example, use a different one? But we want one example to carry the session. So let's adjust the rule to be sufficient but not necessary? Then the inconsistency in the mirror case is not logical but perhaps practical? This is getting too messy.

     - **Solution for the session**: We'll only show the first case (the original profile) and then mention that sometimes the opposite can happen (if we vote on the conclusion first, we might get a majority for C even though neither premise has a majority). We can illustrate that by having the same committee vote on C first and then on the premises? But that might be too much.

     - **Pragmatic approach**: For the session, we focus on the first profile and then verbally explain the mirror without writing the table. Say: "If we had a different set of judgments, we might have the majority accepting the conclusion even though both premises are rejected by majority. But we don't have time to write that. The point is that the order of voting (on premises vs conclusion) can lead to different outcomes."

     Given time constraints, we might skip the mirror case in the board work and just mention it.

  7. **Contrast with Majority Cycling (5 minutes)**
     - **Board work**: Draw a comparison table.
       - In majority cycling (Condorcet paradox): We have three candidates A, B, C. Individual 1: A>B>C; Individual 2: B>C>A; Individual 3: C>A>B. Then majority prefers A to B, B to C, and C to A -> a cycle. The problem is that there is no Condorcet winner.
       - In the discursive dilemma: There is no cycle in the preferences over the propositions. The problem is that the collective set of judgments is inconsistent even though each individual set is consistent.

     - Point out: In cycling, the individuals have transitive preferences but the collective doesn't. In the discursive dilemma, the individuals are consistent (their judgments are logically consistent) but the collective is inconsistent.

  8. **Addressing Misconceptions (5 minutes)**
     - **Misconception 1**: The majority is contradicting itself and is irrational.
       - **Defusing**: "The majority isn't one person; it's an aggregation of different individuals. Each individual is rational, but the way we aggregated led to inconsistency."
       - **When**: Right after showing the collective set.

     - **Misconception 2**: The remedy is to vote only on the final outcome.
       - **Defusing**: "But then the committee cannot give reasons for its decision, and what if the outcome is something that no one would accept if they saw the reasons? For example, in our case, if we had only voted on C, we would have rejected the club, but the majority actually believes that both conditions are met! So they might have approved if they saw the reasons."
       - **When**: When introducing the example, or when someone suggests it.

     - **Misconception 3**: It is because of three members or a rigged profile.
       - **Defusing**: "We can have this with any odd number of members greater than one, and the profile is not rigged; it's a natural disagreement pattern."
       - **When**: After the profile is presented.

     - **Misconception 4**: The majority for P1 and the majority for P2 are the same people.
       - **Defusing**: "Look at the table: the majority for P1 (Alice and Charlie) and for P2 (Bob and Charlie) overlap only on Charlie. The two majorities are different coalitions."
       - **When**: When counting the votes.

     - **Further misconceptions**:
       - **Misconception 5**: This only happens in logic puzzles, not in real life.
         - **Defusing**: "This structure appears in real committees: juries deciding guilt based on elements of a crime, or panels deciding on grant applications based on criteria."
         - **When**: During the introduction or when wrapping up.

       - **Misconception 6**: The problem is that the members are not communicating.
         - **Defusing**: "Even if they communicate, if they stick to their judgments and vote by majority on each proposition, the inconsistency can still arise."
         - **When**: After the example.

  9. **Refusals (2 minutes)**
     - If a student asks whether there's a voting rule that avoids the problem entirely:
       - "There are many voting rules, and some might avoid this particular profile, but there are theorems (like the impossibility theorem by List and Pettit) that show that no aggregation rule can always avoid this problem while satisfying some basic conditions. But that's a topic for an advanced course. For now, we are seeing that majority voting, which seems natural, can lead to this issue."

  10. **Check for Understanding (3 minutes)**
      - **Closing Question**: 
        "Imagine a scholarship panel that uses a rule: 'Award the scholarship if (a) the applicant has financial need, (b) the applicant has academic merit, and (c) the applicant has community service.' The panel has three members. They vote by majority on each condition and then award the scholarship only if all three conditions are met by majority. Here are the votes:

          | Member | (a) Need? | (b) Merit? | (c) Service? | Award? (if follows rule) |
          |--------|-----------|------------|--------------|--------------------------|
          | X      | Yes       | Yes        | No           | No                       |
          | Y      | Yes       | No         | Yes          | No                       |
          | Z      | No        | Yes        | Yes          | No                       |

        What does the majority say for each condition? What is the collective decision about awarding the scholarship? Is there an inconsistency? Why or why not?"

        - Majority: 
          - (a) Need: X and Y say Yes -> majority Yes (2-1)
          - (b) Merit: X and Z say Yes -> majority Yes (2-1)
          - (c) Service: Y and Z say Yes -> majority Yes (2-1)
          - Therefore, by the rule, the scholarship should be awarded. But look at each member: 
            - X: Would award only if (a), (b), and (c) are all Yes? But X says (c) No -> so X says No.
            - Similarly, Y says (b) No -> No.
            - Z says (a) No -> No.
            So every member individually says not to award. But collectively, by the rule, they award it.

        - The collective set: 
            { (a) Yes, (b) Yes, (c) Yes, Award: Yes } 
          which is consistent with the rule. However, the problem here is that the collective decision (to award) is the opposite of what every individual member thinks (they all reject awarding). This is not an inconsistency in the logical sense (because the rule says if all three are yes, then award) but it shows a different problem: the collective outcome is not endorsed by any member. This is sometimes called the "doctrinal paradox" and is a variant.

        - But note: In the original discursive dilemma, the collective set was logically inconsistent. Here, it is consistent with the rule but the outcome is against the unanimous vote on the conclusion. So it's a different flavor. However, it shows that the premise-based approach (voting on each condition) leads to an outcome that is the opposite of what the conclusion-based approach (voting on the award) would do (which would be unanimous no).

        - We can then ask: "Is the collective set of judgments inconsistent? (No, because they have all three conditions and then award, which is consistent with the rule.) But what if we also had a vote on the award? The committee might vote on the award separately? Then we might get an inconsistency? Let's say they vote by majority on the award: all three say no -> majority no. Then the collective set would be: (a) yes, (b) yes, (c) yes, and award: no. That is inconsistent because the rule says that if all three conditions are met, the award must be given."

        So we can use this to show the same structure: if they vote on the award separately and get a majority no, then we have an inconsistency with the premises.

      - Alternatively, if we want exactly the same problem, we can adjust the example to have a logical inconsistency:

        Rule: Award if and only if (a and b and c).

        Then the collective set from the premises is (a: yes, b: yes, c: yes) so they must award. But if they also vote on the award and get majority no, then collectively they have (a: yes, b: yes, c: yes, award: no) which is inconsistent.

        But in the vote above, if they vote on the award by majority, it would be no (unanimous). So the collective set from the two procedures would be inconsistent.

      Therefore, the question can be used to check if they see that the collective set of judgments can be inconsistent if they try to derive the award from the premises and also vote on it.

      **Revised Check Question**:

        "A panel applies a rule: 'A grant is awarded if and only if the application meets condition A, condition B, and condition C.' The panel has three members. They vote by majority on each condition and also on whether to award the grant. The votes are:

          | Member | A?   | B?   | C?   | Award? |
          |--------|------|------|------|--------|
          | X      | Yes  | Yes  | No   | No     |
          | Y      | Yes  | No   | Yes  | No     |
          | Z      | No   | Yes  | Yes  | No     |

        What does the majority say for each condition and for the award? Is the collective set of judgments consistent? Why or why not?"

        Answer:
          - A: Majority Yes (X and Y say Yes) -> Yes
          - B: Majority Yes (X and Z say Yes) -> Yes
          - C: Majority Yes (Y and Z say Yes) -> Yes
          - Award: Majority No (all No) -> No

        The collective set: {A: Yes, B: Yes, C: Yes, Award: No}. But the rule says that if A, B, and C are all Yes, then Award must be Yes. So the collective set is inconsistent.

      This is a direct analogue of the original example but with three premises.

  ## Carrying Example: Requirements

  - **Must contain**:
    - A small odd-numbered committee (3 members).
    - Two premises (P1, P2) and a conclusion (C) that is entailed by the conjunction of the premises (P1 and P2 together imply C).
    - A profile such that:
        - Each member is consistent (so if a member accepts both P1 and P2, they accept C; if they reject C, they reject at least one premise).
        - Majority on P1: Yes
        - Majority on P2: Yes
        - Majority on C: No
    - The example must be invertible: We can flip the judgments to get a case where the majority rejects both premises but accepts the conclusion? But note: if the rule is biconditional (C iff (P1 and P2)), then if both premises are rejected, C must be rejected. So we cannot have a consistent individual accepting C while rejecting both. Therefore, we cannot have a profile of consistent individuals that yields majority for C and majority against both P1 and P2.

    - Alternative: We can invert the implication? Or use a different example? 

    - Instead, we can show the other form: by having the committee vote on the conclusion first and then the premises. That might lead to the conclusion being accepted by majority even though the premises are rejected by majority. But that requires a different profile? And the problem is that the collective set of judgments would still be inconsistent.

    - Given the difficulty, we will focus on the first case and mention that the opposite can occur with a different profile (without writing it) or in the context of the check question.

  - **Must avoid**:
    - Premises that look like restatements of each other (e.g., avoid "the club is open to all" and "the club does not exclude anyone").
    - The conclusion should not be a rewording of one premise (e.g., avoid having C be the same as P1).
    - The example should not turn on a factual dispute (e.g., if the committee disagrees about whether the club is open to all, that's a factual disagreement) because then the discussion might go into how to find the facts. Instead, frame it as a judgment about whether the rule applies.

      In our example: 
        P1: "The club is open to all students." (factual, but we can present it as a judgment about the facts as they see them)
        P2: "The club does not duplicate an existing club's purpose." (also factual)

      But note: The rule is a given, and they are applying the rule. The dispute is about the facts? How do we avoid that?

      We can reframe the example to be about a rule that has criteria that might be interpreted differently? But then we are in the territory of interpretation, not pure logic. 

      **Alternative example**: A tenure committee. The rule: "A professor should be granted tenure if (P1) her research is excellent and (P2) her teaching is excellent." The conclusion (C) is "Grant tenure". Then the judgments are about whether the research is excellent (which might involve interpretation of standards) and similarly for teaching. This is less about pure facts and more about judgment.

      But we can stick to the club example and emphasize that we are not concerned with how they form their judgments, only that they vote consistently.

  ## Final Session Flow

  - 0-5 min: Introduction and setting up the club example.
  - 5-15 min: Present the club example and the profile (the first one). Vote and show the inconsistency.
  - 15-20 min: Show that each individual is consistent. Highlight the collective inconsistency.
  - 20-25 min: Briefly mention the mirror case (verbally) and the issue of procedure (premise-based vs conclusion-based).
  - 25-30 min: Contrast with majority cycling (Condorcet paradox) using a quick example and a comparison table.
  - 30-40 min: Address misconceptions as they arise, but especially at the points noted.
  - 40-42 min: Refusals: if asked about other rules, give the short answer.
  - 42-47 min: Check question (the grant panel with three conditions).
  - 47-50 min: Wrap up and state the takeaway: Majority voting on connected propositions can lead to collective inconsistency even when every individual is consistent.

  This plan is tight but feasible if we avoid digressions.
answer: |-
  ### Session Plan: Sequence and Dependencies  
  **Total: 50 minutes**  
  1. **Introduction (5 min)**  
     - Start with voting on candidates (e.g., "Choose between Candidate A, B, or C"). Ask: "What if we vote on *reasons* instead of just outcomes?"  
     - **Dependency**: Sets up shift from candidate voting to propositional voting.  
     - **Temptation to skip**: Don’t rush; let them voice assumptions (e.g., "voting always gives fair results").

  2. **Introduce Carrying Example (10 min)**  
     - Present: **A 3-member tenure committee** decides whether to promote Professor X.  
       - Rule: *Promote if (P1) research is groundbreaking AND (P2) teaching is excellent.*  
       - Conclusion (C): *Promote Professor X.*  
     - **Key**: Emphasize P1 and P2 are separate (research ≠ teaching), and C is *entailed* only if both P1 and P2 are true.  
     - **Dependency**: Must establish logical connection (P1+P2 → C) before voting.  
     - **Temptation**: Avoid delving into "groundbreaking" definitions; stress this is about applying a rule.

  3. **Vote Profile and Logical Relation (10 min)**  
     - **Profile on board**:  
       | Member | P1: Groundbreaking? | P2: Excellent teaching? | C: Promote? |  
       |---------|---------------------|--------------------------|-------------|  
       | Alice   | Yes                 | No                       | No          |  
       | Bob     | No                  | Yes                      | No          |  
       | Charlie | Yes                 | Yes                      | Yes         |  
     - **Vote tally**:  
       - P1: Majority "Yes" (Alice + Charlie).  
       - P2: Majority "Yes" (Bob + Charlie).  
       - C: Majority "No" (Alice + Bob).  
     - **Draw collective judgment set**: {P1: Yes, P2: Yes, C: No}.  
     - **Reveal collision**: "If P1 *and* P2 are true, C *must* be true. But the majority says C is false!"  
     - **Dependency**: Logical relation (P1+P2 → C) must be on board *before* tallying votes.  
     - **Temptation**: Don’t assume they see the inconsistency; ask, "Can all these be true together?"

  4. **Mirror Case (5 min)**  
     - **Invert the profile** (flip all votes):  
       | Member | P1 | P2 | C  |  
       |---------|----|----|----|  
       | Alice   | No | Yes| Yes|  
       | Bob     | Yes| No | Yes|  
       | Charlie| No | No | No |  
     - **Tally**:  
       - P1: Majority "No" (Alice + Charlie).  
       - P2: Majority "No" (Bob + Charlie).  
       - C: Majority "Yes" (Alice + Bob).  
     - **Contrast**: Premise-first rejects promotion; conclusion-first accepts it.  
     - **Dependency**: Show *after* the first profile to reinforce procedural divergence.  

  5. **Contrast with Majority Cycling (5 min)**  
     - **Board work**:  
       - Draw a Condorcet cycle (A>B, B>C, C>A) with candidate preferences.  
       - Contrast: "In cycling, *individuals* have consistent rankings; the *collective* has a cycle. Here, *each member* is consistent (no one has P1+P2 but ¬C), but the *collective set* is inconsistent."  
     - **When**: Immediately after revealing the collision in Step 3.  

  6. **Address Misconceptions (10 min)**  
     - **During vote tally (Step 3)**:  
       - *Misconception*: "The majority is irrational/contradicting itself."  
         - **Defuse**: "The majority isn’t a single mind; it’s three subgroups with different views."  
       - *Misconception*: "The majority for P1 and P2 are the same people."  
         - **Defuse**: "Count the voters: P1’s majority (Alice+Charlie) and P2’s (Bob+Charlie) only share Charlie."  
     - **When introducing the example (Step 2)**:  
       - *Misconception*: "This only happens with 3 members or rigged profiles."  
         - **Defuse**: "Try 5 members: Add two ‘No/No/No’ voters—P1 and P2 still win majority, C still loses."  
     - **After collision (Step 3)**:  
       - *Misconception*: "Just vote on C (the outcome) to fix it."  
         - **Defuse**: "But what if C wins? Alice and Bob would reject it—and the committee owes reasons for its verdict."  
       - *Misconception*: "It’s about biased jurors or bad meetings."  
         - **Defuse**: "This is a structural flaw in aggregation, not psychology."  
     - **New misconception**: "The rule must be ambiguous if people disagree."  
       - **Defuse (during Step 2)**: "Even with a clear rule, judgments can fairly differ on P1/P2."  

  7. **Refusals (2 min)**  
     - **When asked**: "Is there a voting rule that avoids this?"  
       - **Response**: "Some rules (e.g., unanimity) avoid it *here* but fail elsewhere (e.g., deadlock). General solutions are impossible without trade-offs—advanced topic!"  
       - **Boundary**: "We’re focusing on *why* majority voting has this flaw, not fixes."  

  8. **Check for Understanding (3 min)**  
     - **Closing question**:  
       > "A grant panel uses a rule: *Fund if (A) the proposal is innovative, (B) it has real-world impact, and (C) the budget is sound.* Three members vote:  
       > - Yuen: A=Yes, B=No, C=Yes → Fund? No  
       > - Zara: A=No, B=Yes, C=Yes → Fund? No  
       > - Xiu: A=Yes, B=Yes, C=No → Fund? No  
       >   
       > If they vote by majority on each condition, what is the collective outcome? Is it consistent? Why?"  
     - **Why it checks understanding**:  
       - Correct answer: Majority accepts A, B, and C (each 2-1), so collective says "Fund." But no individual supports funding (all voted "No").  
       - Surface learners will fill the table but miss the inconsistency (collective funds despite unanimous rejection). Deep learners will note: The rule requires A+B+C, but the members reject funding for different reasons—yet aggregation overrides this.  

  ### Carrying Example: Specifications  
  **Must contain**:  
  - **Premises**: Genuinely distinct (e.g., research quality ≠ teaching quality).  
  - **Conclusion**: Entailed *only* by the conjunction (e.g., promotion requires both).  
  - **Profile**:  
    - Allows P1 majority, P2 majority, but C majority-rejected (first case).  
    - Invertible to show C majority-accepted while P1 and P2 majority-rejected (mirror case).  
  - **Avoid**:  
    - Premises that overlap (e.g., not "ethical research" and "non-exploitative research").  
    - Conclusion rewording a premise (e.g., not "promote if research is groundbreaking").  
    - Factual disputes (e.g., avoid "Did Professor X plagiarize?"). Use judgments about rule application (e.g., "Is this research groundbreaking?").  

