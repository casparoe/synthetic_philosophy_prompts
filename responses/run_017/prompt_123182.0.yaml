  Okay, let me start by unpacking the user's query. They're a grad student in medieval land law, sitting in on a computation and mind reading group. They feel out of their depth but have noticed a recurring argumentative move. The move involves using computational complexity results to argue that a human capacity can't be mechanical, then dismissing practical objections by shifting the difficulty to recognizing easy cases or lacking guarantees.

  First, I need to understand the core structure they're describing. The pattern is: claim a task isn't mechanical because it's NP-hard, counter that hard cases don't occur in practice, rebuttal says recognizing easy cases is also hard. Then they mention similar moves in P vs NP debates and Bayesian inference criticisms. The user wants to know if this move has a name, how it relates to existing concepts, and when it's legitimate versus a swindle.

  The user's deeper needs seem to be conceptual clarification. They want to categorize this argument to better engage in discussions. They might feel frustrated by what they perceive as circularity or goalpost-shifting. The mention of medieval land law suggests they might draw analogies from their field—perhaps how legal arguments shift focus similarly. They also hint at circularity in defining "instances that matter" using the capacity in question, which is a key philosophical point.

  Now, breaking down the move: It starts with a complexity-based argument against mechanization. When countered with practical feasibility, the response relocates the difficulty to epistemic access—recognizing easy cases, bounding constants, or certification. The philosophical claim remains, but the interesting content (practical tractability) is conceded. The user notes this feels distinct from standard worst-case critiques or bait-and-switch tactics.

  I recall concepts like the "Complexity-Theoretic Excuse" from Aaronson, but that's about justifying inefficiency. This is different—it's maintaining a philosophical claim by shifting to epistemic inaccessibility. The "Problem of Logical Omniscience" in Bayesianism is related but specific. The "Access Problem" covers the general issue of separating computational difficulty from recognizing tractable instances.

  The user also asks about legitimacy. When is this move valid? In cryptography, recognizing weak keys might be as hard as breaking them, so the shift is legitimate. But in human cognition, if recognizing easy cases relies on the same capacity, it's circular. The user's example of defining "instances that matter" using understanding highlights this circularity risk.

  I should also address their examples. For P vs NP, dismissing constants as philosophically irrelevant ignores practical infeasibility. In Bayesian inference, insisting on exact methods ignores effective approximations. The legitimacy depends on whether the epistemic access is part of the capacity or separable.

  The user needs clear distinctions: when does relocating difficulty hold water versus when does it become a swindle? Circular definitions, ignoring practical feasibility, or unrealistic epistemic demands make it problematic. They also need terminology—Access Problem fits, but emphasizing the "Epistemic Relocation" captures the argumentative maneuver.

  Lastly, the user's background in medieval law might appreciate analogies, but I'll keep the response computational. Ensuring the explanation avoids jargon while precise. Highlighting the circularity concern is crucial, as they flagged it as bugging them. Concluding with sharp definitions and boundary cases will address their request for carving.
answer: |-
  This is an **excellent** observation, and you've pinpointed a pervasive and often philosophically charged maneuver in computational cognitive science, AI theory, and philosophy of mind. While it doesn't have a single universally agreed-upon name, it's widely recognized and debated. Here's the carving you requested:

  **The Core Move: Epistemic Relocation of Computational Difficulty (or The Access Problem)**

  1.  **The Argument:**
      *   **Claim:** Human capacity C (e.g., understanding language, planning) cannot be explained by a feasible computational procedure P.
      *   **Evidence:** Formalizing task T (corresponding to C) reveals T is computationally intractable (e.g., NP-hard, PSPACE-hard, undecidable).
  2.  **The Objection:**
      *   **Reality Check:** The hard instances proving intractability are pathological, artificial, or wildly improbable in the actual environments humans operate in ("enormous, gnarly"). Humans only need to solve a tractable *subset* S of all possible instances of T.
  3.  **The Rebuttal (The Move You've Identified):**
      *   **Shift to Epistemic Access:** Granting that only subset S matters, *identifying whether a given instance belongs to S* (i.e., recognizing it as "benign") is *itself* computationally hard (often as hard as solving the original problem for the worst cases, or at least intractable in a relevant sense). Therefore, the *difficulty hasn't vanished*; it has merely been relocated from "solving the problem" to "*recognizing when the problem is easy to solve*". The fundamental challenge for a purely mechanical explanation remains.

  **Names and Nearest Concepts:**

  1.  **The "Access Problem" (or "Recognition Problem"):** This is probably the most direct and descriptive term. It highlights that the obstacle is now *accessing* or *recognizing* the tractable subset, not (just) solving instances within it.
  2.  **Epistemic Bottleneck:** Emphasizes that the limiting factor is our *knowledge* about the instance (is it in S?), not necessarily the computational cost of processing it *if* we knew it was in S.
  3.  **The "Complexity-Theoretic Excuse" (Aaronson):** Scott Aaronson uses this term critically, arguing it's often invoked too easily to dismiss complexity results without engaging their substance. It captures the sense that the move is used as an "excuse" to ignore worst-case hardness. However, your observation focuses more on the *structure* of the rebuttal than its potential misuse.
  4.  **The Problem of Logical Omniscience (in Bayesian Contexts):** This is a specific instance of the access problem. Bayesian agents are often idealized as having unlimited computational power for probabilistic inference. Recognizing that exact inference is intractable, and that approximation methods lack *guarantees* for *arbitrary* problems, directly mirrors the move: the difficulty is relocated to knowing *which* approximations are sufficiently good *for this specific problem*.
  5.  **Non-Constructive Existence:** You're right that it's adjacent. The move often leverages the gap between the *existence* of an efficient algorithm *for the subset S* and the *non-existence* of an efficient algorithm *to find or certify membership in S*. The algorithm for S exists "in the abstract" but is useless because we can't efficiently *access* it for a given instance.

  **How it Differs:**

  *   **Worst-Case vs. Average-Case:** The objection is *often* about average-case or typical-case complexity. The rebuttal doesn't deny that; instead, it argues that *even if* the average-case is easy, *determining whether you're in an average-case scenario* is hard. It shifts the focus to the complexity of *instance classification*.
  *   **Bait-and-Switch / Weakening Claims:** It's not simply retreating from a strong claim (e.g., "impossible") to a weaker one (e.g., "hard sometimes") and back. The rebuttal *concedes* the practical feasibility *for the solved subset* but *introduces a new, seemingly fundamental difficulty* (recognition) that blocks the original mechanistic explanation.
  *   **Non-Constructivity:** While related, the core issue isn't just that we don't *know* the algorithm for S; it's that *no efficient algorithm exists to decide if an instance is in S*, making the algorithm for S practically inaccessible *even if we knew what it was*.

  **Is it Unnamed?** "Access Problem" is the closest established term, but the specific *argumentative maneuver* – using the access problem as a rebuttal to the "reality check" objection – deserves a sharper label like **"Epistemic Relocation of Intractability"** or **"The Recognition Rebuttal."**

  **Legitimacy vs. Swindle: Boundary Cases**

  The legitimacy hinges on **whether the epistemic access problem (recognizing the easy subset S) is genuinely separable from the original capacity C and whether the demand for such recognition is reasonable.** This is where your point about circularity becomes crucial.

  1.  **Potentially Legitimate:**
      *   **Cryptography:** Proving that breaking a cryptosystem is hard *even on average* often relies on showing that distinguishing "weak keys" (which would make breaking easy) from random keys is *itself* as hard as breaking the system. The access problem *is* the security guarantee.
      *   **Formal Verification:** Proving a program is correct for *all* inputs might be undecidable. Showing that restricting inputs to a "safe" subset S is *also* undecidable highlights a fundamental verification barrier.
      *   **Abstract Philosophical Argument:** If the *only* goal is to establish that C cannot be *reduced to* executing *any single, fixed, efficient algorithm for all instances* (a very strong claim), the access problem argument can be valid. It shows that any mechanical explanation must involve more than just running P; it needs a way to *select* the right P or recognize when P works.

  2.  **Potentially a Swindle / Illegitimate:**
      *   **Circularity (Your Key Insight):** This is the most significant danger. **If the definition of the "benign" subset S inherently relies on the very capacity C being explained (e.g., "the sentences humans actually understand," "the planning problems humans find tractable"), then the rebuttal is circular.** It assumes the capacity C (to recognize what's tractable *for us*) in order to explain C. The move then *presupposes* the non-mechanical nature it purports to prove.
      *   **Ignoring Heuristics & Approximation:** Dismissing practical methods (like variational Bayes or SAT solvers) *solely* because they lack worst-case guarantees for *arbitrary* instances often ignores that these methods work remarkably well *on the instances that actually occur*, potentially *without needing* an explicit, efficient "membership in S" test. The human capacity might *be* a highly effective heuristic that doesn't formally solve the access problem but works in practice. Demanding a *guaranteed* recognition algorithm for S may be setting an impossibly high bar that doesn't reflect biological reality.
      *   **Misplaced Demand for Certification:** Insisting that the brain must be able to *certify* that an instance is in S (or that an approximation is good enough) before solving it might be unrealistic. The capacity might involve solving the instance *and* implicitly recognizing its tractability *through the act of solving it* (or failing to solve it quickly might signal it's hard). The recognition and solution might be intertwined processes, not separable steps.
      *   **Ignoring Evolution/Development:** The access problem frame often assumes the system encounters arbitrary, unseen instances. But humans operate in environments shaped by evolution and development. Our cognitive mechanisms might be *tuned* to the statistical structure of naturally occurring problems, making the "subset S" effectively the *only* set we encounter. Efficient recognition might emerge from this tuning without needing a general algorithm. The hard instances might be genuinely irrelevant outliers.
      *   **Polynomial Exponents Matter (P vs NP Example):** Dismissing huge exponents as "beside the philosophical point" *is* often illegitimate *if* the philosophical claim is meant to say something about *human* cognition. Human cognitive capacities operate under severe time and resource constraints. An algorithm with exponent 100 is utterly irrelevant to explaining human mathematical creativity, regardless of P vs NP. The "philosophical point" here often conflates abstract computability with plausible mechanistic explanation.

  **Conclusion:**

  You've identified a core dialectic: **The Epistemic Relocation of Intractability (or The Access Problem Rebuttal).** Its legitimacy is highly context-dependent. It is strongest when:

  1.  The "benign subset" S can be defined *independently* of the capacity C being explained (e.g., using properties of the environment or problem structure).
  2.  The argument aims for a very strong conclusion (e.g., no *single fixed* efficient algorithm suffices).

  It becomes dubious, potentially circular, or a "swindle" when:

  1.  Defining S *requires* invoking C itself ("instances humans can handle").
  2.  It dismisses effective heuristics and approximations that work in practice without solving the access problem.
  3.  It ignores the role of evolution/development in shaping the encountered problem distribution.
  4.  It demands unrealistic certification or ignores practical constraints (like polynomial exponents) when making claims about human cognition.

  Your medieval land law perspective is an asset here. Think of it like defining a "fair land dispute" only as "one a just lord would resolve correctly." Using that definition to argue that just lordship *can't* be based on written law because no law can *identify* which disputes are "fair" in this sense would be circular. The computational move you've spotted often risks the same circularity. Your outsider's eye for argumentative structure is spot on.
