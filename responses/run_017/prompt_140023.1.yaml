  - Prevents evasion through formulaic responses

  For the question itself, I'll frame it around the logical challenge but require concrete textual engagement. I'll specify mundane examples to force the scope issue. I'll explicitly prohibit changing the subject to avoid weak answers. The phrasing should demand a defended interpretation, not just discussion.

  The model answer should:
  - Directly tackle the redundancy/contradiction charge
  - Distinguish conventional vs ultimate application using textual support
  - Handle the regress by showing emptiness of emptiness
  - Avoid clichés about "not nothingness" while still affirming it minimally
  - Use the Vigrahavyāvartanī strategically but not essentially

  For the marking scheme, I'll identify five key points: logical puzzle resolution, scope distinction, regress handling, textual grounding, and avoidance of evasion. Each worth 3-4 marks with common pitfalls noted.

  Grade differentiation:
  - A answers will show how the tetralemma functions diagnostically to expose presuppositions
