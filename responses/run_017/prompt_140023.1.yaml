  The user has specific concerns: first, a logic friend pointed out that if corners 1 and 2 are contradictories, corners 3 and 4 become redundant or contradictory. Second, they want students to apply the tetralemma to mundane cases to test its scope. Third, they want to address the regress worry about whether Nāgārjuna is asserting something by denying all positions. And fourth, they want to prevent students from just saying "emptiness isn't nothingness" as a superficial answer.

  Key constraints: The question must be answerable in 90 minutes or 1200 words using only the primary text (Mūlamadhyamakakārikā), without relying on secondary literature like Prāsaṅgika/Svātantrika distinctions. Sanskrit terms need definitions. They also want a model answer (800-1000 words), a marking scheme out of 20, and clear differentiation between A, B, and C answers.

  I need to design a question that:
  - Forces students to address the logical puzzle head-on
