  ### Teaching Plan for Explaining Zorn's Lemma

  #### **1. Dependency Structure (Order of Concepts & Rationale)**  
  *Rationale: Build on familiarity with orderings from economics (partial rankings), introduce minimal new terms, and isolate critical subtleties. Avoid transfinite concepts.*

  1. **Partial Orders (5 min)**  
     - **Start here**: Connects directly to "partial rankings" from preference theory.  
     - **Define**: A set with a relation (≤) that is reflexive, antisymmetric, and transitive.  
     - **Example**: Use a simple partial ranking (e.g., policies A > B, but C incomparable to both).  
     - **Why now?** Essential to define chains and upper bounds. Skipping this causes confusion later.

  2. **Chains (3 min)**  
     - **Define**: Subsets where every pair is comparable (totally ordered).  
     - **Example**: In policies, a chain might be A > B > D (all comparable).  
     - **Why now?** Needed for the key condition in Zorn’s Lemma. Postponing chains makes upper bounds unmotivated.

  3. **Upper Bounds (5 min)**  
     - **Define**: For a subset S, an element u such that s ≤ u for all s ∈ S. **Crucially emphasize**: u must be *in the poset*.  
     - **Isolate and hammer**: Draw a poset with a chain and an upper bound outside the set (e.g., finite subsets of ℕ; union is outside). Contrast with a case where it’s inside.  
     - **Why now?** This is the most common point of failure. Misconception: "Upper bound exists somewhere" → must be in the set.

  4. **Maximal vs. Maximum (5 min)**  
     - **Define**:  
       - *Maximal*: Nothing is strictly larger.  
       - *Maximum*: Larger than everything.  
     - **Example**: Two incomparable policies, both maximal, neither maximum.  
     - **Why here?** After chains/bounds but before stating Zorn’s Lemma. Prevents misconception: "Maximal = best".  
     - **Timing**: If delayed, students misapply Zorn’s Lemma to find "best" elements.

  5. **State Zorn’s Lemma (2 min)**  
     - **Phrasing**: "If a non-empty poset P has the property that every chain in P has an upper bound *in P*, then P has a maximal element."  
     - **Emphasize**: Non-empty, every chain, bound *in P*, maximal ≠ maximum.  
     - **Why last?** All prerequisites defined. Stating earlier forces backtracking.

  #### **2. The One Example: Finite Subsets of ℕ**  
  *Why this example?*  
  - **Pros**: Visual, no linear algebra, reveals hypothesis failure, no maximal element.  
  - **Must contain**:  
    - A chain with union outside the set (e.g., {1}, {1,2}, {1,2,3}, ... → union = ℕ ∉ set).  
    - No maximal element (add any element to any finite set).  
  - **Must avoid**:  
    - Vector spaces/fields (distracting).  
    - Cases where maximal exists (save for closing check).  
    - Bounds outside the set (critical for hypothesis failure).  

  *Alternatives considered/rejected*:  
  - Vector spaces: Requires linear algebra.  
  - Interval posets ([0, r] for r < 1): Similar to finite subsets but less intuitive for economists.  

  #### **3. Misconception Map & Mitigation**  
  *(Preempt during definitions, not at end)*  

  | Misconception | When to Address | Mitigation (Board/One-Sentence) |
  |---------------|----------------|---------------------------------|
  | "Maximal = biggest" | During **maximal vs. maximum** | Draw two incomparable elements: "Both maximal, neither dominates." |
  | "This is induction" | After stating **Zorn’s Lemma** | "Induction builds finite chains; Zorn handles infinite chains with no natural 'next step'." |
  | "AC is obvious" | During **axiom discussion** | "AC for ∞ boxes is non-constructive; Zorn packages it for complex orders." |
  | "Bound can be outside" | During **upper bounds** | Circle the union of a chain outside the set: "If it’s not here, hypothesis fails." |
  | "Zorn gives *the* answer" | During **seminar application** | "In rankings, many maximal extensions exist; Zorn guarantees ≥1, not *the* one." |

  #### **4. When to Say "Axiom"**  
  - **Timing**: After stating Zorn’s Lemma, during the axiom of choice (AC) equivalence.  
  - **Honest 40-min Answer**:  
    - "Zorn’s Lemma is *equivalent* to the Axiom of Choice (AC), which you know as 'picking from ∞ boxes'. We accept AC as an axiom in most math—it can’t be proven from simpler axioms, but it’s intuitive and widely used. The seminar didn’t dodge; they used a trusted tool."  
  - **Do not open**: Independence, well-ordering, models.  

  #### **5. What to Refuse**  
  **Explicitly state**: "We’re skipping:  
  - Proof that AC ⇒ Zorn (needs transfinite induction).  
  - Ordinals/transfinite concepts.  
  - Independence results (Zorn can’t be proven without AC)."  
  *Sanity check*: This list is correct—prevents rabbit holes.  

  #### **6. Closing Check**  
  - **Task**: "Consider policies {A,B,C} with a partial ranking A > B. Let P be all partial rankings extending this, ordered by extension. Does Zorn apply? What might a maximal element look like?"  
  - **Correct Answer**:  
    - "Yes: Chains are nested rankings; their union is an upper bound *in P*. Maximal elements are complete rankings (e.g., A>B>C or A>C>B)."  
  - **Near-Miss (Slogan-Level)**:  
    - "Yes, Zorn says a maximal ranking exists" → *Fails to justify hypothesis or note multiple options*.  
  - **Why this task**: Tests chain-bound check, recognizes maximal ≠ unique, and ties to seminar.  

  ---

  ### **Timeline for 40-Min Session**  
  1. **Motivation (3 min)**: Seminar problem (partial → complete ranking).  
  2. **Partial Orders (5 min)**: Define + economic example.  
  3. **Chains & Upper Bounds (8 min)**: Define, stress "bound in set", finite subsets example.  
  4. **Maximal vs. Maximum (5 min)**: Define, contrast, draw incomparable elements.  
  5. **State Zorn’s Lemma (2 min)**: Verbally + on board.  
  6. **AC Equivalence (3 min)**: "Equivalent to AC; an axiom, not a dodge."  
  7. **Seminar Justification (5 min)**: Union of chain is a partial ranking → bound in set → maximal = complete.  
  8. **Closing Check (5 min)**: Policy ranking task + discussion.  
  9. **Refusals (2 min)**: "We skipped X, Y, Z for depth."  
  10. **Q&A (2 min buffer)**.  

  **Whiteboard Flow**:  
  - Left: Definitions (partial order, chain, bound, maximal).  
  - Center: Finite subsets of ℕ (chain → union outside → no bound in set).  
  - Right: Policy ranking (closing check).  

  This plan preempts hostility by anchoring in economics, isolates critical subtleties (bounds in set, maximal≠maximum), and uses a self-contained example. The closing check verifies conceptual grasp, not just recall.
