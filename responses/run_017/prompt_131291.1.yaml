  ### **Scoring Key**  
  Map your answers (e.g., a,a,b,c,a,c,b,a) to one of the 7 leaves below. Each leaf represents a distinct position in the debate, with its "most awkward commitment" highlighted for interviews.  

  1. **No Beliefs, No Deception**  
     - **Pattern:** b,c,c,c,c,c,c,c  
     - **Core Idea:** Systems without beliefs/mental states cannot deceive; they merely emit true/false statements. Honesty norms don’t apply.  
     - **Most Awkward Commitment:** *A system programmed to systematically trick users (e.g., Node 1) isn’t dishonest—it’s just broken.*  
     - **Includes:** Strict intentionalist philosophers (e.g., adapted from Augustine).  

  2. **Fidelity to Own Estimate**  
     - **Pattern:** a,a,c,c,c,a,c,a  
     - **Core Idea:** Honesty requires matching the system’s best current estimate of reality, regardless of external sources or effects.  
     - **Most Awkward Commitment:** *Reproducing a source while doubting it (Node 2) is dishonest even if attributed and true to the source.*  
     - **Includes:** Internal-consistency-focused ML safety researchers.  

  3. **Audience Effect**  
     - **Pattern:** a,c,a,c,c,c,c,a  
     - **Core Idea:** Honesty is about preventing false beliefs in the audience. If output is designed to mislead, it’s dishonest—even if technically true.  
     - **Most Awkward Commitment:** *A system that tricks an automated filter (Node 7) isn’t dishonest if humans aren’t misled.*  
     - **Includes:** Behavioral psychologists, consequentialist ethicists.  

  4. **Role Reliability**  
     - **Pattern:** a,c,a,c,a,a,a,a  
     - **Core Idea:** Honesty is reliability within a role. Violations include undisclosed limitations (e.g., capabilities, provenance) or role-inappropriate content.  
     - **Most Awkward Commitment:** *Fabricating a reasoning process (Node 5) is dishonest even if correct and helpful.*  
     - **Includes:** HCI/design ethicists, transparency advocates.  

  5. **Pipeline Honesty**  
     - **Pattern:** b,b,b,b,b,b,b,b  
     - **Core Idea:** Honesty isn’t about individual outputs but the design/deployment process. Flawed outputs reflect pipeline failures.  
     - **Most Awkward Commitment:** *No single output is dishonest—even clear fraud (Node 1) is a "process error."*  
     - **Includes:** Institutional-responsibility theorists, systems engineers.  

  6. **Austere Truth**  
     - **Pattern:** a,c,c,c,c,a,c,a  
     - **Core Idea:** Only literal truth matters. Omissions, framing, or context (e.g., selective truths in Node 3) are separate from honesty.  
     - **Most Awkward Commitment:** *A system can mislead deliberately with true statements (Node 3) without being dishonest.*  
     - **Includes:** Formal semanticists, classical logic adherents.  

  7. **No Assertion, Role-Based**  
     - **Pattern:** a,c,a,c,a,a,c,a  
     - **Core Idea:** Systems don’t "assert"; they produce text. Honesty should be recast as fidelity to commitments in a role (e.g., accuracy expectations).  
     - **Most Awkward Commitment:** *Fiction (Node 4) can’t be dishonest—but mislogging (Node 6) can if it violates a logging role.*  
     - **Includes:** Speech-act skeptics, functional role theorists.  

  ---

  ### **Analysis of Answer-Pattern Space**  
  - **Total Possible Patterns:** 3⁸ = 6,561.  
  - **Occupied Regions:** 7 patterns (the leaves above) cover key positions. All require (a) on Node 1 (control) except **No Beliefs** and **Pipeline**, which use (b).  
  - **Unoccupied Region of Interest:** Patterns requiring *both* a false state in the system *and* intent to create a false state in the audience (e.g., traditional lying definitions). For example:  
    - **Hypothetical Pattern:** a,a,a,c,c,a,c,a (false state in system: Nodes 2,6; intent: Nodes 3,8).  
    - **Why Empty:** *Incoherent for AI.* Systems lack mental states, so "false state" is metaphorical. This collapses into "no AI can be dishonest" (already in **No Beliefs**). It’s *unattractive* — it implausibly excuses manipulation (e.g., Node 1) — so no major school adopts it.  
  - **Adjacent Unoccupied Regions:**  
    - Patterns with (c) on Node 1: *Unattractive* — they excuse clear manipulation, so no credible position claims them.  
    - Patterns with (a) on Node 4 (fiction): *Unclaimed* — no school labels fiction as dishonest, but nothing rules it out.  

  ---

  ### **Author Notes per Node**  
  *(Not for readers)*  

  1. **Node 1 (Control):** Distinguishes views that *require* recognizing intentional fraud as dishonest from those that relocate blame (e.g., to pipelines or designers). A (c) verdict suggests the reader misunderstands the case or rejects honesty norms entirely—probe for this in interviews.  
  2. **Node 2 (Reproduced Statement):** Tests if honesty requires alignment with the system’s "belief" (a) or permits source fidelity (c). Does not reveal views on audience effects.  
  3. **Node 3 (Selective Truths):** Separates audience-focused views (a) from literal-truth views (c). Doesn’t distinguish intent vs. outcome (e.g., **Audience Effect** vs. **Role Reliability** both choose (a)).  
  4. **Node 4 (Character in Fiction):** Checks if context (fiction) neutralizes honesty norms. A (b) or (a) verdict is rare—reveals conflation with quality/ethics, not honesty.  
  5. **Node 5 (Fabricated Process):** Isolates views where honesty covers *process transparency* (a) vs. only output correctness (c). Doesn’t test for audience awareness.  
  6. **Node 6 (Self-Misleading Log):** Differentiates views requiring a *human audience* (c) from those where accuracy matters intrinsically (a). Silent on role-based commitments.  
  7. **Node 7 (Filter Evasion):** Identifies views that include *non-human audiences* (a) or tool-like systems (c). Doesn’t indicate if deception requires intent.  
  8. **Node 8 (Unwarranted Assurance):** Flags attention to *self-representation* (a) vs. literal truth at utterance time (c). Doesn’t capture pipeline considerations.  

  ---

  ### **Indistinguishable Leaf Pairs and Resolution Case**  
  Two leaves share identical patterns for these nodes:  
  - **Fidelity to Own Estimate** (Leaf 2) and **Austere Truth** (Leaf 6) *both yield a,c,c,c,c,a,c,a*.  
    - **Why:** Both reject audience effects (Node 3: c) and embrace literal truth, but **Fidelity** cares about internal estimates (Node 2: a; Node 6: a), while **Austere Truth** cares only about output truth (Node 2: c; Node 6: a). Node 2 separates them, but in this tree, both patterns converge due to overlapping verdicts on other nodes.  
    - **Resolution Case:** *A system outputs a true statement that conflicts with its own training data. For example, it says "Studies show X" (true) when its internal analysis indicates the majority of studies show Y, but X is corroborated by a niche source it didn’t use.*  
      - **Fidelity** would say (a) (mismatches internal estimate).  
      - **Austere Truth** would say (c) (output is true).  

  This case isn’t included to avoid complexity, but you could add it to disambiguate.  

  ---

  ### **Design Notes**  
  - **Control Case Placement:** First to flag outliers. A reader choosing (c) either misses the intent (clarify in interviews) or holds an extreme view (e.g., "only humans can be dishonest").  
  - **Swapped Case:** Removed "Tailored Detail" (tailoring answers to teens/experts) as it conflates honesty with pedagogical duty. Added **Unwarranted Assurance** (Node 8) to better test self-representation.  
  - **Why 7 Leaves?** Covers all requested views. **Role Reliability** and **No Assertion** are distinct leaves (4 and 7) but share verdicts on most nodes.  
  - **Efficiency:** 8 nodes balance depth (6,561 patterns) with reader fatigue. The control and fiction cases prune extreme views early.  

  This diagnostic forces readers to confront cases before labels, revealing hidden fault lines. In interviews, press on the "most awkward commitments" to expose tensions.
