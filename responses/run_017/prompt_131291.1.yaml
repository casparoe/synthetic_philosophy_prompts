  Below is the complete reader-facing diagnostic structured as an 8-node decision tree, with each node presenting a concrete case and three verdicts (a, b, or c). This instrument is designed to surface disagreements about AI honesty without relying on jargon or predefined labels. The cases are sequenced to progressively differentiate views, with the control case first to anchor expectations. After the tree, I provide:  
  - A scoring key mapping answer patterns to 7 descriptive leaves (positions in the debate).  
