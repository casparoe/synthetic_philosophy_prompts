answer: |-
  Here's the prioritized research agenda for the Humean Political Economy Revival Fund, with explicit tradeoffs:

  **Criteria Weighting:** Upstreamness (40%) - foundational questions that unlock multiple debates; Neglectedness (30%) - avoiding well-trodden ground; Tractability (20%) - feasible for juniors without heavy empirics; Importance (10%) - direct policy relevance. Deliberately deprioritized: standard "trade deficit good/bad" debates (downstream, ideological), currency manipulation accusations (mostly measurement disputes), and optimal tariff theory (well-explored, less Humean-specific).

  ### Priority Order & Steelmanned Lines:

  1.  **Reserve Currency Distortion & Adjustment Mechanisms**
      *   **Open Question:** How does the dollar's reserve status (and invoicing dominance) structurally alter or *prevent* Humean price/wage/demand adjustment mechanisms in response to trade imbalances? Does it create persistent asymmetry?
      *   **Upstream:** Crux for understanding global imbalances, efficacy of sanctions (reliance on dollar system), "exorbitant privilege," and debates on dedollarization. If reserve status fundamentally breaks Humean adjustment, it undermines core policy assumptions.
      *   **Tractable:** Analyze historical episodes (e.g., Plaza Accord, post-2008 imbalances) and sectoral price/wage data across reserve/non-reserve currency economies. Focus on identifying mechanisms/stasis points. Formal modeling minimal; conceptual/empirical tracing suffices.
      *   **Neglected:** Dominant discourse focuses on benefits of reserve status or dedollarization politics, not its *systematic distortion* of classical adjustment. Humean lens provides unique critique.
      *   **Movable by:** Evidence showing persistent divergence in adjustment speed/cost between reserve-currency issuer and others during imbalances; analysis of how dollar invoicing insulates US domestic prices from trade-flow signals.

  2.  **Capital Flows as (Imperfect) Substitutes for Trade Adjustment**
      *   **Open Question:** Do massive cross-border flows into "safe assets" (like US Treasuries) represent a *functional substitute* for gold flows in facilitating sustainable imbalances, or do they merely *mask* underlying disequilibrium, creating fragility? What are the Humean stability conditions?
      *   **Upstream:** Crux for interpreting "sustainable deficits," financial stability risks, the role of deep capital markets, and the interaction of trade/finance. Challenges simplistic "trade deficit = bad" narratives by introducing a financial counterflow.
      *   **Tractable:** Map historical correlations between trade balances, capital flows, and subsequent crises/real adjustments. Conceptual work on defining "sustainability" from a Humean/flow perspective using available macro data.
      *   **Neglected:** Trade debates often ignore capital flows; finance debates often ignore the Humean adjustment imperative. Synthesizing them through the safe asset lens is novel.
      *   **Movable by:** Identifying clear historical thresholds where capital inflows ceased acting as adjustment facilitators and became sources of instability; developing a Humean indicator of "safe asset overhang."

  3.  **Strategic Interdependence vs. Comparative Advantage: Defining the Boundaries**
      *   **Open Question:** Under what specific, empirically-grounded conditions do "strategic" concerns (security, supply chain resilience, tech dominance) *legitimately* override Humean skepticism of mercantilist policies (subsidies, export controls, friend-shoring), and how can overreach be identified?
      *   **Upstream:** Crux for justifying/constraining industrial policy, friend-shoring, tech containment. Challenges both naive free trade and blanket security exceptionalism. Provides criteria for policy evaluation.
      *   **Tractable:** Case studies of key "strategic" sectors (semiconductors, energy, pharma). Develop analytical frameworks (not formal models) for assessing genuine interdependence, single-point failures, and security externalities vs. rent-seeking.
      *   **Neglected:** Debate is polarized. Humean emphasis on systemic consequences and passion-overcoming offers a dispassionate framework lacking in current discourse.
      * **Movable by:** Framework identifying sectors where strategic interventions demonstrably prevented major systemic disruption vs. those driven by rent-seeking/overreaction; analysis of how friend-shoring alters *dynamic* comparative advantage.

  4.  **Fiat Money Systems & the "Passion" of Inflation/Deflation Expectations**
      *   **Open Question:** How do Hume's insights on money as a "veil" and the destabilizing role of passions translate to a fiat/CBDC world where expectations management is paramount? Do modern tools (central bank credibility, digital currencies) tame or amplify these passions?
      *   **Upstream:** Crux for understanding inflation dynamics, central bank legitimacy, and the potential impact of CBDCs/stablecoins on monetary sovereignty and cross-border adjustment.
      *   **Tractable:** Analyze historical shifts in inflation expectations and monetary regime credibility. Conceptual work on how Humean "passions" manifest in digital money runs/hoarding. No complex DSGE required.
      *   **Neglected:** Hume's monetary psychology is underapplied to modern fiat regimes dominated by expectations. CBDCs add a new layer rarely analyzed through this lens.
      *   **Movable by:** Evidence linking specific communication failures/political pressures (passions) to unanchored expectations; analysis of how CBDC design features might trigger or prevent Humean "hoarding" behavior.

  5.  **Sanctions as Artificial Mercantilism & Systemic Feedback**
      *   **Open Question:** Do comprehensive financial/trade sanctions functionally impose a forced, artificial mercantilism (autarky) on the target, and what are the *systemic* feedback effects on the sanctioners' economies and the global adjustment mechanism (e.g., fostering alternative financial networks)?
      *   **Upstream:** Crux for evaluating long-term efficacy and unintended consequences of sanctions, dedollarization momentum, and global fragmentation. Applies Humean skepticism of beggar-thy-neighbor policies to coercion.
      *   **Tractable:** Case studies (Iran, Russia) focusing on price/wage/demand shifts in *both* target and sender economies, and emergence of workarounds. Track changes in invoicing currencies and payment flows.
      *   **Neglected:** Sanctions research focuses on compliance/impact on target; systemic feedback and distortion of global Humean adjustment are rarely analyzed.
      *   **Movable by:** Clear evidence of sanctions creating lasting inefficiencies/higher costs within sender economies; accelerated development of non-dollar trade/finance infrastructure directly attributable to sanctions pressure.

  \answer{reserve-currency-distortion}
