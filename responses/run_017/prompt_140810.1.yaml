  Looking at their three problems, degraded correlation seems fundamental. If correlations in real scenarios are too weak, the whole concept might not hold. Counterparty measure deals with weighting and priors, which could lead to instability. Legibility involves strategic considerations but might be downstream. I should evaluate which of these is most upstream and tractable.

