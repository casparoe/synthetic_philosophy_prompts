  The important theoretical elements to include are: the basic two-party trade where both gain subjectively; the double-counting of moral acts as assets on both ledgers; counterparty risk from "value drift" (changing moral views); and the flagship product - a closed round-trip trade between three parties (A→B→C→A) that creates subjective gains but might be objectively worse.

