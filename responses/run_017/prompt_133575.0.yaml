  ### Mark and Distribution  
  **Total: 14/25**  
  *(a: 7/10, b: 4/7, c: 3/8)*  

  ### Point-by-Point Comments  
  **Part (a) [10 marks]**  
  - **Correct:** Nicod’s criterion and equivalence condition accurately stated. Logical equivalence between "all ravens are black" and "all non-black things are non-ravens" correctly identified.  
  - **Correct:** White shoe (non-black non-raven) confirms "all non-black things are non-ravens" via Nicod, and thus (via equivalence) confirms "all ravens are black." Paradox arises because this seems intuitively irrelevant.  
  - **Incorrect/Misleading:** Claim that a non-black raven "settles the hypothesis outright" is overstated; falsification ≠ full disconfirmation in probabilistic terms. (-1)  
  - **Serious Error:** Conclusion that Nicod and equivalence are "jointly inconsistent" is false. Hempel’s point was that Nicod *appears* to conflict with equivalence, but Bayesian/resolution shows compatibility. Correct view: Equivalence holds; Nicod is oversimplified but not logically inconsistent. (-2)  

  **Part (b) [7 marks]**  
  - **Correct:** White shoe confirms negligibly per Bayesianism due to high baseline probability of non-black non-ravens. Selection bias point (deliberate vs. random sampling) is apt.  
  - **Correct:** Explanation of dilution effect tied to object abundance is sound.  
  - **Critical Error:** Claim that black shoe is "neutral" is false. A black shoe (non-raven that is black) *does* confirm "all ravens are black" via equivalence: It is an instance of the contrapositive "all non-black things are non-ravens" (since it is black and a non-raven). Mistake: Student incorrectly assumes Nicod’s neutrality applies here, but equivalence overrides it. (-3)  

  **Part (c) [8 marks]**  
  - **Correct:** Bayesian point that confirmation from a white shoe is weaker due to larger non-black non-raven class (now includes crows) is valid.  
  - **Correct:** Oddity of mostly confirming via crows noted appropriately.  
  - **Fundamental Error:** H* ("all raven-or-crow things are black") is **not** equivalent to "all non-black things are non-ravens." Correct equivalence: H* ≡ "all non-black things are neither ravens nor crows." A white shoe (non-black non-raven) is *not* an instance of the contrapositive (it says nothing about crows). Thus, Nicod does *not* apply to the contrapositive here. (-4)  
  - **Incomplete:** Fails to specify which observations confirm/disconfirm H*:  
    - Confirms: Black raven, black crow.  
    - Disconfirms: Non-black raven, non-black crow.  
    - Neutral (for H*): Non-raven/non-crow objects (e.g., shoes), *unless* they are non-black (which disconfirms).  
  - **Unsubstantiated:** Claim that "the same argument goes through" is false due to flawed equivalence. Paradox does *not* carry over because contrapositive instances now require excluding both ravens *and* crows. (-1)  

  ### Summary of Key Misses  
  - (a) Overstates incompatibility of principles; misrepresents Hempel’s challenge.  
  - (b) Incorrectly denies confirmation by black non-ravens.  
  - (c) Botches logical equivalence for H*; misses disconfirming role of non-black non-crows; misapplies Nicod.  

