  Okay, let me try to unpack this user's query. They're a philosopher working on social ontology and the morality of everyday conventions. They're in a locum job in a different city and noticing cultural differences in tipping, queueing, and jaywalking. They propose a theory called "reliance-without-promising" where local conventions create moral obligations because others rely on compliance for their planning. They also distinguish between additive, positional, and dead-letter conventions.

  First, I need to grasp their theory properly. The key point is moral obligation arising from others' reliance, even without explicit promises. The three convention types are crucial here. Additive like tipping, where each act contributes to a pool; positional like queueing, where one action directly affects someone specific; and dead-letter like jaywalking, where the norm isn't enforced. 

  The user wants implications for how they should act, especially whether "follow local convention" is sufficient. They're interested in less obvious aspects: their temporary status, locals excusing foreigners, and how their theory might differ from common views in the three cases.

  Hmm, the user is likely struggling with the moral weight of these conventions. They might feel conflicted between adhering to local norms and their own principles. Their deeper need could be understanding how to integrate into a new culture ethically, without losing their moral compass. They might also want to justify when it's acceptable to deviate from norms without feeling guilty.

  Considering their temporary stay: does it affect obligations? In additive cases like tipping, their short stay doesn't matter because each contribution still supports the system. For positional, like queueing, the impact is immediate regardless of duration. But locals excusing foreigners adds complexity. If locals don't expect compliance from outsiders, does that nullify the obligation? Or does it create a new one to respect their leniency? 

  For tipping, the theory suggests a stronger obligation than usual because not tipping directly harms a worker's expected wage. Common views might see tipping as optional generosity, but here it's a duty due to reliance. Queueing is trickier. The local norm allows place-saving, which might seem unfair, but the moral obligation comes from the positional harm. Not joining a friend in line might avoid harm, but if the local practice accepts it, then complying might be better. 

  Jaywalking being a dead-letter rule means compliance isn't morally obligatory. The official rule isn't relied upon, so crossing safely doesn't harm anyone's reliance. The user might feel relieved here, but also question when a dead-letter norm should be followed anyway.

  The user's identity as a temporary resident raises questions about integration. Should they try to blend in fully or maintain their own norms? The reliance theory suggests that if locals accommodate foreigners, then reciprocating by following norms when possible is a way to respect their adjustment. 

  Unspoken needs: The user might seek validation for not always conforming, or reassurance that their actions are morally sound. They could be looking for a framework to navigate cultural differences without feeling overwhelmed. They also might want to contribute positively to the local community during their stay, aligning their actions with deeper moral principles rather than just surface compliance.
answer: |-
  Your framework—reliance-without-promising, paired with the convention typology—generates nuanced implications, especially when filtered through your transient status and local leniency toward foreigners. Below is a structured analysis of non-obvious implications, moving beyond surface-level "follow local norms" advice. British English maintained throughout.

  ### Core Implications of the Framework
  1. **Moral Gravity ≠ Social Visibility**  
     The theory prioritises *reliance costs* over social perception. Thus:  
     - **Tipping (additive convention):** Your £5 omission seems trivial, but it *directly* undermines a worker’s wage calculation (a structured reliance). Moral obligation persists even if the server smiles politely.  
     - **Queueing (positional convention):** Letting a friend join you takes a *specific* turn from someone (reliance setback is determinate). Locals may tolerate it, but the harmed party’s reliance still matters morally.  
     - **Jaywalking (dead-letter rule):** No one plans around universal compliance (no reliance), so crossing safely imposes no moral cost—even if technically illegal.  

  2. **Temporariness is Largely Irrelevant**  
     Your 4-month tenure doesn’t dilute obligations because:  
     - **Reliance is systemic, not personal:** Workers rely on *customer-type* compliance, not *you-as-individual*. Your presence activates the obligation.  
     - **Exception:** If locals *know* you’re transient and adjust expectations (e.g., "tourists never tip"), reliance weakens. Absent this, your short stay is morally inert.  

  3. **The "Foreigner Excuse" Paradox**  
     Locals excusing your non-compliance has two-edged implications:  
     - **Does it cancel obligation?** Only if their forgiveness *retroactively* negates reliance (e.g., "we never expected *you* to queue properly"). But this is rare; usually, forgiveness follows *after* the harm (e.g., you skipped the queue, they sigh but say nothing).  
     - **Does it create obligation?** Yes—through **reciprocity**. Their leniency is a social concession. Refusing to comply when you *can* (e.g., not tipping despite understanding the system) exploits their goodwill. Thus: *knowing* you’re excused doesn’t erase the duty; it adds a duty not to abuse their accommodation.  

  ### Unexpected Verdicts vs. Common Wisdom
  | Convention  | Common View                          | Your Framework’s Verdict                                  |  
  |-------------|--------------------------------------|----------------------------------------------------------|  
  | **Tipping** | "Optional generosity."               | **Strict obligation.** Non-compliance directly damages pre-relied-upon wages. |  
  | **Queueing**| "Saving spots is cheating."          | **Contextually constrained.** If locals accept spot-saving, *joining* a friend may be permissible (no one relies on rigid order), but *creating* a new insertion might harm a specific person. |  
  | **Jaywalking**| "Illegal, so wrong."              | **No moral weight.** The "rule" is detached from practice; compliance gains nothing, non-compliance costs nothing. |  

  ### Key Non-Obvious Conclusions
  - **"Follow local convention" is insufficient.** You must assess:  
    - *Reliance structure* (does my act disrupt planning?).  
    - *Harm specificity* (who bears the cost?).  
    - *Rule vitality* (is this norm "alive" in practice?).  
  - **The greatest moral risk lies in additive conventions.** Tipping’s diffuse harm feels victimless but sustains an unjust system. Your obligation is to tip *while* possibly advocating for fair wages—not weaponising ethics to justify stiffing workers.  
  - **Positional conventions demand harm-minimisation.** In queues, avoid *initiating* place-taking that disrupts a determinate person’s expectation (e.g., joining a friend at the *back* is neutral; squeezing mid-queue isn’t).  
  - **Dead-letter rules liberate conscience.** Jaywalking’s illegality is irrelevant if no one’s plans rely on your compliance. Feel free to cross safely—though prudential reasons (fines, safety) remain.  

  ### Practical Guidance
  - **Tipping:** Pay the expected % consistently. Your transience doesn’t absolve you; the reliance system absorbs everyone.  
  - **Queueing:** Adopt local *forms* of queueing if they’re reliance-respecting (e.g., "saving spots" within accepted bounds). Avoid actions that visibly truncate one specific person’s turn.  
  - **Jaywalking:** Treat it as a non-moral issue. Follow safety and legal prudence, not etiquette.  

  **Final Philosophical Note:** Your framework reveals conventions as *living systems of mutual adjustment*. Obligation arises not from the norm itself, but from the vulnerability created by others’ reliance. Thus, the answer isn’t "follow local rules" but "honour the reliance your presence activates." This demands situational discernment—precisely the work of a moral agent in a pluralistic world.
