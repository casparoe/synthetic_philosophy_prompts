prompt: |-
  Please act as a professional philosopher specializing in value theory and the philosophy of well-being, and think the problem through carefully before answering — feel free to start with some unstructured brainstorming about candidate requirements and then cut it down, since I want to see the reasoning behind the list, not just the list.

  For my senior philosophy seminar I'm writing on hedonism about welfare, and I've got stuck on the heterogeneity objection: the pleasure of drinking cold water on a hot day, of finally solving a hard problem, of a pun that lands, of scratching an itch, of hearing a piece of music resolve, and of being praised all seem to feel like completely different things. So what, if anything, do they have in common? Before I try to answer that, I want the specification: what would an account of what pleasures have in common have to deliver in order to count as adequate? Give me the requirements list — the cases it has to get right, the distinctions it must not collapse (for instance, between feeling pleasure and merely judging that you're enjoying yourself, or between how pleasant something is and how much you want to keep doing it), and the things we're fairly confident about regarding pleasure that it can't contradict — with the case or consideration behind each one. Mark which requirements you take to be non-negotiable and which are really preferences of one camp dressed up as requirements.

  Three things I especially want:

  1. Which pair of requirements you suspect cannot both be satisfied, and why. My worry is that the only way to unify the list above is to make the shared feature so thin that it can no longer explain why pleasure is good or why we pursue it — but tell me whether that tension is real or whether I'm running together two different demands.
  2. Verdicts on three cases of my own, which I can't tell are genuine constraint-generating cases or distractions: (a) valence blindness — someone who has all the sensory and cognitive content of the experiences above, can identify the coldness, the itch, the pun and the praise, and reports knowing these are the sorts of things she used to enjoy, but feels no attraction to any of them and is completely indifferent about repeating them; (b) relief — the first minute after a bad headache stops, which seems to feel good without having a distinctive felt quality of its own; (c) absorption — someone absorbed in a difficult game who reports no particular feeling while playing but judges afterwards that it was the most fun they'd had all year. For each, say whether an adequate account must handle it, and why.
  3. Which single requirement knocks out the most candidates, and which requirement you'd drop first if you had to.

  Skip a full scorecard — one or two sentences on how the usual families of answer (a distinctive felt quality, a desire-based or attitude-based view, something like pleasure as a way of experiencing an object rather than a feeling) do against your list is plenty.

  Finally, be explicit about your own uncertainty: mark which requirements you're confident in and which you'd abandon under pressure, and tell me what would change your mind about the list as a whole — which case or argument would make you revise it, and where your reasoning is most likely to be wrong.
