answer: |-
  1. **Screening step**: Immediately reject any proposal where the upper bound of its failure probability interval exceeds the board's pre-set maximum tolerable risk threshold (e.g., 0.15 annual failure probability) or where the cost per unit risk reduction (using the interval's mid-point) is worse than a benchmark from similar past projects.  
  2. **Ranking rule for overlapping intervals**: Rank options by the upper bound of their interval (to prioritize worst-case risk); if two options' upper bounds differ by less than 10% of their average, choose the cheaper one—otherwise, pick the option with the lower upper bound.  
  3. **Rule about paying to narrow an interval**: Pay to narrow an interval only if the cost of additional information is under 5% of the project cost, the interval width (upper-lower) exceeds 50% of its mid-point, and current rankings are too close to call (e.g., upper bounds differ by <5%).  
  4. **Worked cases**:  
     a. For the cheap levee ([0.04, 0.10], $1M) and expensive levee ([0.03, 0.09], $1.5M): upper bounds (0.10 vs. 0.09) differ by 11.1% of their average (exceeds 10%), so pick the expensive levee for its lower upper bound.  
     b. For the pumping station ([0.01, 0.30]): if another option has an upper bound ≤0.10, the 0.30 upper bound (catastrophic per some experts) forces rejection unless no alternative exists.  
  5. **Board's rule plus what the procedure can't settle**: The rule breaks the procedure—it requires knowing individual expert rankings (not just intervals), so demand consultants report each option's maximum expert point estimate; if the chosen option has the highest such point, flag it. The procedure cannot resolve board vetoes after flagging or subjective factors like political risk.
