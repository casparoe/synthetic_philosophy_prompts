prompt: |-
  I've been writing up a piece on consent for a reading group and I keep finding that my gut verdicts on cases don't line up with any one thing I can state. I'm hoping you can help me find the principle — or tell me which verdicts I have to give up. Roughly my tentative idea is: a yes counts as consent when (a) the person could actually have said no without landing in something someone else was responsible for, (b) nobody lied to them about what the act *was* — what it does to them, who's doing it, what the deal is — as opposed to lying about incidental stuff, and (c) the yes really came from them and wasn't just their mouth moving. But I don't trust it. Here's what I actually think, case by case.

  Deception first. Guy says he's single, isn't: feels gross, but I don't think it voids consent. Someone pretends to be a clinician to perform an exam: obviously void, consent to something else entirely. Someone who's HIV-positive and says they aren't: void. Condom comes off mid-act without her knowing: void, and it feels *worse* than the HIV lie somehow, like a different kind of failure rather than just more of it. Someone says "I love you" to get a yes and doesn't mean it: my gut says valid, which bugs me. A researcher tells me the trial is placebo-controlled when actually I'm guaranteed the active drug — so the lie made me *less* likely to say yes, and the truth would have made me keener: my gut still says void. And here's the one I can't square with that: someone sleeps with a person who, as it happens, belongs to a group they'd have refused on straightforwardly racist grounds, and the person knows this and stays quiet. My gut says the consent is fine. But both are lies (or omissions) about a peripheral fact that changed what was chosen, so any pure but-for test has to give the same answer on both, and I don't want the same answer.

  Coercion. Sleep with me or I fire you, where the firing isn't otherwise justified: not consent. Sleep with me and I'll promote you, where the promotion isn't owed and he's the strongest candidate anyway: I want to say it's slimy but it's consent, and I'm not confident. Lifeguard who'll only throw the ring if you sign over everything you own: not consent. A prison guard offers a prisoner extra food — more than the rules require — for sex: my gut says coerced, even though nothing was taken away. Same guard instead says "sleep with me or I'll put you in the hole," where the hole isn't justified: obviously coerced. A third party says "sleep with him or I leak your photos," and the guy she sleeps with knows nothing about it: I think her yes doesn't count, but I can't say whether that's about her options or about his knowledge. And a driver who happens upon you stranded in the desert and offers a ride only on condition of sex: I lean valid if he didn't put you there, invalid if he did.

  Competence. Blackout drunk: no. Tipsy but coherent: yes. Drunk, coherent, says yes, and would never have said yes sober and hates it the next morning: I lean yes, and I'm uneasy about how confident I am. A woman with dementia who years earlier wrote that if she later initiates sexual contact with her husband and seems content, that should count as her consent even when she can't pass a capacity test — and now she does exactly that: my gut says yes, valid. But the same document saying "go ahead even if I seem to refuse": no way. Surgeon describes the operation as "90% survival" and I consent, where "10% mortality" would have gotten a no: my gut says valid, and valid even if he picked the frame knowing it would work, which feels like it should matter and doesn't.

  Two more I go back and forth on and haven't decided: a friend who said yes mainly because she was scared he'd turn violent, where he said nothing threatening and never would have been — coerced or not? And the yes of someone who thinks, wrongly, that they have no legal right to refuse, and only says yes because refusal seems pointless: my gut says that one is void, which sits badly with my drunk verdict, since both are yeses from a compromised agent.

  So: is there one principle — mine, repaired, or a different one — that gets most of this? I'd like it stated clause by clause with the case that motivates each clause, and I want it to actually say something about cases I haven't listed, especially: is consent obtained through a deliberately annoying app interface (the kind where saying no takes eleven clicks) consent? What about a surgeon who, once you're under, switches to a different technique that's equally good and never mentions it? And does whatever principle you land on have any implications for the friend case and the "no legal right to refuse" case, or does it just punt on them? Please be honest about which of my verdicts your principle can't accommodate — I'd rather drop two verdicts than keep a principle that's really four principles in a trenchcoat.
reasoning: |-
  Okay, the user is dealing with a complex issue about consent and trying to reconcile their intuitive judgments across various scenarios. They've outlined a bunch of cases involving deception, coercion, and competence, and they're struggling to find a unified principle that fits all their gut reactions. They mentioned their initial attempt at a principle but don't trust it because it doesn't cover all cases consistently.

  First, I need to unpack all the cases they listed. For deception, they have examples like lying about marital status (not voiding consent) versus impersonating a clinician (void). Then there's the HIV lie, stealthing, insincere "I love you," the research trial lie, and the racist omission case. Their gut reactions vary here, especially between the racist omission (consent valid) and other lies where consent is void. The challenge is reconciling why some deceptions matter and others don't.

  Coercion cases include threats like "sleep or get fired" (not consent) versus offers like promotion for sex (slimy but consent?). Then there's the lifeguard demanding property for rescue, prison guard trading extra food for sex (coerced), threats of solitary confinement, third-party blackmail, and the desert driver scenario. The user seems conflicted about when an offer becomes coercive, especially when no direct threat is made but power imbalances exist.

  Competence issues include varying levels of intoxication, the dementia patient case, and framing effects in medical consent. They feel confident about blackout drunk being non-consent but unsure about coherent drunk who regrets it later. The dementia case with prior directive is valid to them, but not if it overrides refusal. They also mention the friend who consents out of fear and the person who thinks they have no legal right to refuse.

  The user's initial principle had three parts: ability to say no without harm from another, no lies about the act itself, and authentic yes. But it fails in places like the racist omission (where the lie is peripheral but consent stands) and the research trial lie (void even though the lie made them less likely to consent). 

  I need to find a principle that explains these distinctions. Central to their intuition seems to be whether the deception or coercion affects the core nature of the act or exploits a fundamental vulnerability. For deception, it's about misrepresenting the act's essence (like impersonation, HIV status affecting health risks) versus peripheral details (marital status, racist preferences). The racist case is tricky because the deception is peripheral, but the user feels consent is valid—probably because the act itself (sex) hasn't been misrepresented, only the context. 

  For coercion, the key might be whether the proposer creates the vulnerability (desert driver who caused the stranding) versus exploiting existing vulnerability (prison guard using power imbalance). Offers that worsen someone's position without justification (lifeguard demanding property) are coercive, while quid-pro-quo offers that don't exploit vulnerability might be consensual but unethical.

  Competence hinges on decision-making capacity at the time, not outcomes like regret. The dementia case with prior directive respects autonomy if it aligns with past competent wishes, but overriding refusal crosses a line. The medical framing effect is seen as valid because the information was accurate, even if presented favorably.

  The unresolved cases: the friend fearing violence where no threat exists—this might be about reasonable perception of threat, making it coerced if the fear is reasonable. The "no legal right to refuse" case could be void if the person is mistaken about their rights, as it undermines autonomous choice.

  Putting this together, the core principle could focus on: core deception (misrepresenting the act's nature), coercive proposals (exploiting vulnerability the agent created or is responsible for), and competence (capacity at the time plus prior directives for incompetence). 

  This principle would handle most cases: 
  - HIV lie and stealthing misrepresent core health risks; clinician impersonation misrepresents the act. 
  - Marital lie and "I love you" are peripheral; racist omission doesn't change the act's core. 
  - Research trial lie voids consent because it's about the intervention's nature. 
  - Coercion: firing, solitary confinement, and third-party threats exploit created vulnerabilities. Promotion offer might be consensual if no vulnerability exploited. 
  - Prison guard exploiting systemic vulnerability makes it coercive. Desert driver: coercive only if they caused the situation. 
  - Competence: blackout drunk lacks capacity; coherent drunk has it even with regret. Dementia case valid with prior directive. 
  - Medical framing valid as no misinformation. 

  The friend case: if fear is reasonable, it's coercive due to perceived threat. "No legal right" mistake voids consent as it negates autonomous choice. 

  This approach drops some of the user's intuitions, like the research trial lie voiding consent (since it's not core deception) but explains why it feels void—maybe because it's a professional context with higher disclosure standards. Alternatively, reframing core deception as including all material risks in specific contexts could include it. 

  Overall, the user needs a principle that's consistent even if it means adjusting a few verdicts. Their deep need is for a clear, actionable framework that respects their core intuitions while providing guidance for new cases. They value intellectual honesty over clinging to every gut feeling, so highlighting where the principle diverges and why is crucial.
answer: |-
  Your intuitions reveal a coherent principle, but it requires refining to capture the nuances. Your core insight—**consent hinges on whether the agreement respects the agent's autonomous decision about the *essential nature and stakes* of the act, under conditions free from illegitimate control**—explains most cases. Here's the principle clause-by-clause, with cases motivating each, and clear answers to your unresolved examples:

  ---

  ### **The Principle of Autonomous Authorization**
  A "yes" constitutes valid consent **if and only if**:
  1. **Core Act Clarity**: The agent understands the *fundamental nature* of the act (its physical/biological reality, core risks, and the identity of key participants), and their "yes" corresponds to that act.  
     *Motivated by*:  
     - **Clinician impersonation**: Void—identity and purpose misrepresented.  
     - **HIV lie/stealthing**: Void—core health risk concealed (physical integrity altered).  
     - **Research trial lie**: Void—nature of intervention misrepresented (placebo vs. active drug is fundamental in medical consent).  
     - **"I love you" lie/Marital status**: *Valid*—peripheral to the act's essential nature (sex itself unchanged).  
     - **Racist omission**: *Valid*—group membership doesn’t alter the act’s fundamental nature.  

  2. **Non-Exploitation**: The agreement does not exploit an *illegitimately imposed vulnerability* (i.e., a vulnerability created or weaponized by the proposer, or one they have a duty to relieve without conditions).  
     *Motivated by*:  
     - **"Sleep or I fire you"**: Void—threat creates vulnerability.  
     - **Lifeguard demanding property**: Void—exploits duty to rescue (vulnerability they must relieve unconditionally).  
     - **Prison guard offering extra food for sex**: Void—exploits systemic vulnerability they control.  
     - **Desert driver (didn’t strand you)**: *Valid*—vulnerability preexists; no duty to help (though deeply unethical).  
     - **Promotion for sex (if deserved)**: *Slimy but valid*—if promotion isn’t owed and no threat is made, vulnerability isn’t illegitimately imposed.  

  3. **Authentic Expression**: The "yes" reflects the agent's *operative choice* at the time, absent profound impairment (see Clause 4).  
     *Motivated by*:  
     - **Blackout drunk**: Void—no capacity for choice.  
     - **Coherent drunk (regrets later)**: *Valid*—choice was operative at the time.  
     - **"Mouth moving" (e.g., hypnotism)**: Void—not their choice.  

  4. **Competence & Prior Autonomy**: The agent has *minimum decision-making capacity* (understands act/consequences), **or** a prior directive from their competent self applies and doesn’t violate ongoing dissent.  
     *Motivated by*:  
     - **Dementia patient initiating**: *Valid*—prior directive + current assent.  
     - **"Go ahead if I refuse" directive**: Void—prior autonomy cannot override current dissent.  
     - **Medical framing ("90% survival")**: *Valid*—information is true; framing doesn’t alter core facts.  
     - **"No legal right to refuse" mistake**: Void—undermines *understanding of the choice* (believes refusal is impossible, so no true decision exists).  

  ---

  ### **Resolving Your Unclear Cases**
  - **Friend scared of violence (no threat)**:  
    Void under **Clause 3 (Authentic Expression)**. Her "yes" doesn’t reflect her choice—it’s distorted by paralyzing fear, even if irrational. Contrast with the coherent drunk’s regret: *that* "yes" *was* authentic in the moment.  
  - **Deliberately annoying app interface**:  
    Void under **Clause 2 (Non-Exploitation)**. The designer *creates* the friction to weaponize user fatigue—an illegitimate vulnerability.  
  - **Surgeon switches technique post-anesthesia**:  
    Void under **Clause 1 (Core Act Clarity)**. Technique is fundamental to bodily integrity; undisclosed change misrepresents the act.  

  ---

  ### **Where Your Intuitions Must Shift (and Why)**
  1. **Research trial lie**: Your gut says void—**correct under Clause 1**. This *is* core deception (nature of the intervention), unlike marital status.  
  2. **Prison guard offering extra food**: Your gut says coerced—**correct under Clause 2**. Systemic power exploits inherent vulnerability.  
  3. **"No legal right to refuse"**: Your gut says void—**correct under Clause 4**. Mistake voids capacity to choose meaningfully.  
  4. **BUT: Promotion quid-pro-quo** must be *valid* if no threat exists—even if "slimy." Vulnerability isn’t illegitimately imposed (**Clause 2**).  
  5. **"I love you" lie** must be *valid*—it’s peripheral deception, not altering the act’s essence (**Clause 1**).  

  ### **Why This Isn’t "Four Principles in a Trenchcoat"**  
  The unifying thread is **autonomous authorization over the act’s essence**, blocked by:  
  - Deception about core elements (Clause 1),  
  - Exploitation of illegitimate vulnerability (Clause 2),  
  - Lack of agential expression (Clause 3),  
  - Or inadequate capacity without prior authorization (Clause 4).  

  Each clause addresses a *distinct way autonomy is undermined*, but all serve the same core ideal.

  ---

  ### **Implications for Ethics vs. Legality**  
  This principle aligns with moral blameworthiness (e.g., the desert driver is ethically monstrous but consensual under this framework). Legally, societies often overrule valid consent for public policy (e.g., banning exploitative offers). But as a *conceptual* account of consent, this holds.  

  **Final Verdict**: Drop the "promotion for sex" and ""I love you" lie" intuitions if needed—they’re the cost of a unified theory. The rest cohere.
