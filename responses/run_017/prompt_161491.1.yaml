  For the philosophy part, I should emphasize that doctrine of double effect requires conscious intention - which their ML system lacks. The "intention" would technically be in the engineers' cost function design, but that's several steps removed from the car's moment-to-moment decisions. This makes the doctrine a poor fit for their architecture.

  For the test cases:
  - In scenario (a) (choosing between jaywalker vs sidewalk pedestrian), both options involve foreseeable harm but neither uses harm as a means. The doctrine likely wouldn't prohibit either choice.
  - In scenario (b) (sacrificing passenger to save two kids), actively steering toward the passenger could be seen as using passenger harm as a means to save others - which the doctrine might prohibit. But again, the system isn't "intending" anything.

  The passenger sacrifice question seems more practical than philosophical - it's about consumer acceptance and regulation. I should call this out clearly since the user suspects "PR dressed as ethics."

  For harm-minimization advocates, their strongest points are: ethical symmetry (all lives equal), avoiding arbitrary distinctions, and that hard constraints might increase overall harm. But I should also acknowledge their pragmatic concern about market rejection if passengers feel unsafe.

  Gaps to note: the doctrine doesn't help with uncertainty (60% confidence problems) or near-ties. And importantly, it says nothing about non-fatal injuries or property damage.

  The recommendation should probably be harm-minimization with three key features: symmetric weighting, no special passenger rules, and explicit uncertainty handling. This keeps the system ethically consistent while being practically implementable. The memo should present this as the most coherent approach given their technical architecture.

  I'll structure it with: context, philosophy analysis, case applications, harm-minimization merits, identified gaps, and clear recommendation - all in about one page as requested.
answer: |-
  ## MEMO: Recommended Policy for Unavoidable-Crash Scenarios  
  **To:** Internal Safety Review Board  
  **From:** [Your Name], Planning Team Software Engineer  
  **Date:** [Current Date]  
  **Subject:** Policy Framework for Unavoidable Collision Trajectory Selection  

  ### 1. Context & Core Conflict  
  Our board is split between two approaches for trajectory selection in unavoidable-crash scenarios:  
  - **Harm-Minimization (HM)**: Minimize total expected harm (weighted by injury severity), treating the passenger’s life symmetrically with others.  
  - **Constraint-Based (CB)**: Prohibit actions that (a) *cause* harm to someone who wouldn’t otherwise be hit, or (b) *sacrifice* the passenger to save others.  

  CB proponents cite the Doctrine of Double Effect (DDE), arguing that *intentionally* using harm as a means (e.g., steering into a pedestrian) is distinct from *foreseeing* harm as a side effect.  

  ### 2. Mapping Philosophy to Engineering Reality  
  **Key Insight: DDE relies on *human intention* — our system has none.**  
  - Our planner uses learned cost functions, not explicit ethical reasoning. "Intention" could only refer to:  
    - *Engineers’ design goals* (e.g., cost function weights).  
    - *Regulatory/policy constraints* (e.g., "never sacrifice passenger").  
  - **DDE is a poor fit**: It presumes a moral agent making conscious choices. Our system *foresees* outcomes probabilistically; it does not *intend* harm as a means or end. Applying DDE literally to ML outputs stretches it beyond recognition.  

  ### 3. Where DDE "Bites" (and Where It Doesn’t)  
  Assuming we *force* DDE-like rules onto the system:  
  - **Case (a): Brake (hit jaywalker) vs. Swerve (hit sidewalk pedestrian)**  
    - *DDE View*: Both options involve *foreseen* harm, not *intended* harm. No DDE prohibition.  
    - *Engineering Reality*: HM would choose the lower-risk option (e.g., braking if jaywalker is closer). DDE adds no constraint here.  
  - **Case (b): Swerve (kill passenger, save 2 kids) vs. Do nothing (kill 2 kids)**  
    - *DDE View*: Steering *into* the passenger uses their death as a *means* to save others. DDE likely forbids this.  
    - *Engineering Reality*: HM would sacrifice the passenger to save net lives.  

  **Conclusion**: DDE only constrains in scenarios resembling "sacrifice" (Case b), not symmetrical harm trade-offs (Case a).  

  ### 4. The Case for Pure Harm-Minimization (HM)  
  HM proponents deserve a robust defense:  
  - **Ethical Symmetry**: All human life has equal intrinsic value. Penalizing the car for saving net lives (e.g., 2 > 1) is arbitrary and unethical.  
  - **Avoids Perverse Outcomes**: Hard constraints (e.g., "never steer toward a bystander") could *increase* total harm. Example: Swerving minimally to avoid 5 pedestrians might *graze* one; prohibiting this could kill 5.  
  - **Practicality**: Our system *already* uses expected harm minimization in non-fatal scenarios (e.g., braking curves). Consistency is key.  
  - **The "Passenger Sacrifice" Question**:  
    - If the constraint is truly ethical (vs. PR), it implies passenger life > bystander life — a stance we avoid elsewhere.  
    - **Crucially**: HM argues the *real* concern is market acceptance and regulation. Call this out explicitly — don’t mask pragmatic choices as moral philosophy.  

  ### 5. Gaps & Unresolved Issues  
  DDE/HM frameworks fail to address:  
  - **Uncertainty**: How to act when harm estimates are probabilistic (e.g., 60% chance of fatality)? *Neither approach answers this.*  
  - **Near-Ties**: What threshold defines "equal" expected harm?  
  - **Non-Lethal Harm**: How to weight severe injury vs. death? DDE is silent.  

  ### 6. Recommended Policy  
  **Adopt Harm-Minimization with Explicit Uncertainty Handling**  
  - **Core Rule**: The planner selects the trajectory minimizing *expected weighted harm* (using standard injury severity weights), treating the passenger’s safety as *symmetrical* with others.  
  - **Why This?**  
    1. **Philosophically coherent**: Aligns with equal moral value of lives.  
    2. **Technically consistent**: Fits our ML architecture; avoids grafting "intention" onto a system that lacks it.  
    3. **Reduces total harm**: Maximizes lives saved across scenarios.  
    4. **Addresses the true "passenger sacrifice" concern pragmatically**: We acknowledge market/regulatory risks, but these should be solved via transparency (e.g., user education), not by hardcoding ethical asymmetry.  
  - **Critical Addendum**:  
    - Define strict confidence thresholds for action (e.g., "≥80% confidence in harm estimates to override default emergency braking").  
    - Reject DDE-inspired constraints — they add no value in Case (a) and create ethical/practical problems in Case (b).  

  ### 7. Why Not Constraint-Based?  
  CB’s appeal is understandable (avoids PR nightmares, feels "safer"), but:  
  - It imposes arbitrary moral distinctions our system can’t meaningfully implement.  
  - It risks increasing net harm (e.g., prohibiting swerves that save lives).  
  - If regulators demand passenger preference, we can implement this *transparently* as a policy override (not an ethical claim).  

  ---  
  **Approval Requested**: This policy provides clarity, reduces real-world harm, and avoids philosophical misalignment with our tech stack. We can refine uncertainty thresholds post-approval.
