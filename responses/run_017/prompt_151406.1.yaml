prompt: |-
  I'm halfway through a paper on this and my supervisor keeps saying "define corruption" like it's a five-minute job, and I've realised after about six arguments with a friend from back home that my gut verdicts on concrete cases don't line up with any rule I can actually state. So here they are, and I want the rule. (1) Handing a clerk 40 bucks to release a passport that's been "pending" for five months and that I'm plainly entitled to: not corruption, just infuriating — a fee for not being ignored. (2) A mayor giving a city contract to a firm whose owner he's played golf with every weekend for ten years, nothing ever said out loud, no evidence the bid was worse: corruption, definately, and I don't care that nobody can point to a deal. (3) Where my parents grew up, a woman takes a goat to the village chief so he'll hear her land dispute this year instead of next year: I can't call that corruption, it's how the institution works there, and refusing would just mean she never gets heard. (4) A surgeon getting a case of wine from a grateful patient a week after the operation: fine, obviously. (5) The same case of wine arriving the week before the operation: not fine. (6) A drug rep buying a doctor's flights and hotel for a conference in another city, and the doctor prescribing more of that company's drug afterwards while honestly believing it's the better drug: corrupt. (7) The same rep dropping off sandwiches for the whole clinic: not corrupt, and I don't think it's just that the money is smaller. (8) A hospital nurse taking cash to move a patient up the surgery queue: corrupt. (9) The same nurse taking cash to stay two hours past her shift and treat patients privately in the same building: not corrupt. (10) A rich family endows a building at a university and their son gets in with grades that wouldn't have gotten him in: corrupt. (11) The same university admitting the children of alumni who've given nothing: not corruption, just unfair, or nepotistic, or something — I don't think it's the same thing as 10 and I can't say why.

  The best I can do on my own is: an officeholder acts corruptly when a private relationship displaces the criteria their role exists to apply. But I don't know what to do with (3) — in that village the criteria seem to include being someone the chief owes something to — and my friend says that just shows I've smuggled in a Western standard and then called it universal, which feels like a cheap way out but I can't actually answer it. And (1) pulls against (5): in both cases something of value moves before the official does what I want, so if timing is what makes (5) bad then (1) should be bad too, and it isn't.

  So: can you give me a principle — or two, honestly, if no single one will do — that gets as many of these as possible? State it precisely enough that I can apply it to new cases myself, tell me what it predicts for cases I haven't listed (my actual stuck one: my dad sits on the municipal planning committee, and a family friend whose firm has a rezoning application coming up sent him an expensive watch when my sister got engaged — customary in that community, and he recused himself from the vote, which passed anyway), and be straight with me about which of my verdicts some principle forces me to give up and which clash is the real one I have to decide.
reasoning: |-
  Okay, let's tackle this user's problem. They're writing a paper on corruption and struggling to define it in a way that covers all their real-life examples. Their supervisor keeps asking for a definition, but every time they try, their gut reactions to specific cases don't align with any clear rule. They've listed 11 scenarios where their intuition says whether it's corruption or not, but they can't find a consistent principle. 

  First, I need to understand why this is so tricky. Corruption isn't just about bribes; context matters a lot. Take example 3: giving a goat to a village chief to expedite a land dispute. The user feels it's not corruption because that's how the system works there. But in example 2, a mayor giving a contract to a golf buddy is corruption even without an explicit deal. The challenge is distinguishing between cultural practices, necessary facilitation payments, and actual corruption.

  The user's initial attempt defines corruption as a private relationship displacing official criteria. But this falls apart in the village example because the chief's relationships are part of the criteria. The friend accuses them of applying Western standards, which is a valid critique. How can we define corruption without cultural bias?

  Looking at the timing issue: in example 1, paying a clerk to release a passport isn't seen as corrupt, but in example 5, giving wine before surgery is. Both involve payment before the service, but the context differs. The passport payment is to overcome bureaucratic delay, while the pre-surgery wine feels like a bribe. The difference might be about whether the payment secures undue advantage or just prevents undue delay.

  Then there's the hospital nurse taking cash to jump the queue (corrupt) vs. getting paid for extra hours (not corrupt). The key here is whether the payment subverts the official process. Queue-jumping bypasses fairness, while after-hours work is a separate service.

  For the university cases, endowing a building for admission is corrupt, but legacy admissions without donations aren't. The user can't articulate why. Maybe it's the direct exchange: the building donation is a quid pro quo, while legacy preference is an entrenched, non-transactional bias.

  The watch gift to the planning committee member is tricky. Even though he recused himself and the vote passed, the gift creates a conflict of interest. The appearance of impropriety matters here, even if no actual influence occurred. This ties into the principle of maintaining institutional integrity.

  So, the core issue is balancing universal principles with cultural relativity. The user needs a definition that allows for contextual variations but still identifies corruption when institutional purposes are undermined. The proposed dual principles—functional displacement and institutional alienation—aim to cover both the act's mechanics and its impact on trust and fairness. 

  For the village chief, the gift is part of the accepted process, so it doesn't alienate the institution. But the mayor's golf buddy contract, even without explicit wrongdoing, alienates public trust. The timing in the wine cases matters because pre-surgery gifts could influence the surgeon's judgment, while post-surgery gifts are gratitude without expectation.

  The user might need to accept that some cases won't fit perfectly, like the sandwiches vs. the conference trip. The cost difference is a factor, but the intent and potential influence are more critical. The sandwiches are a minor courtesy, while the conference trip creates a sense of obligation affecting prescriptions.

  Ultimately, the user has to decide where to draw the line on cultural relativism. Is the village system corrupt if it's the norm, or does the definition require deviation from local standards? This is the real clash they must address in their paper.
answer: |-
  Here’s a precise, actionable framework for corruption that captures your intuitive judgments and resolves the tensions in your examples. It combines **two principles** to handle cultural relativity and institutional purpose:

  ### Principle 1: **Functional Displacement**
  > *An act is corrupt if it uses a *private channel* (gift, favor, relationship) to **displace** a role’s core function by altering its *inputs* (criteria for decisions) or *outputs* (distribution of benefits/duties).*

  ### Principle 2: **Institutional Alienation**
  > *An act is corrupt if it **alienates the institution from its legitimizing community** — i.e., undermines trust in the institution’s ability to fulfill its purpose for those it serves, **even if locally normalized**.*

  ---

  ### **How It Works:**
  - **Functional Displacement** focuses on *mechanics*: Did private incentives replace public/professional criteria?  
  - **Institutional Alienation** focuses on *legitimacy*: Would the act, if known, erode trust in the institution’s purpose?  

  **Apply sequentially:** If Functional Displacement occurs *or* Institutional Alienation is severe, it’s corruption. Institutional Alienation acts as a "backstop" for cases where displaced functions are culturally embedded but still harmful.

  ---

  ### **Your Cases Resolved:**
  | Case | Functional Displacement? | Institutional Alienation? | Corruption? | Why |
  |------|--------------------------|---------------------------|-------------|-----|
  | **1. Clerk $40 for passport** | No | No | **No** | Payment doesn’t alter criteria (you’re entitled). It bypasses delay, not function. Low alienation (seen as "grease"). |
  | **2. Mayor’s golf buddy contract** | Yes | Yes | **Yes** | Relationship displaces merit criteria. Alienates public trust in fair bidding. |
  | **3. Goat for village chief** | No (if gifts *are* the input system) | **Yes (Severe)** | **Yes** | *Functional Displacement doesn’t apply if gifts are institutionalized inputs.* **But** alienates community trust: only those with goats get heard. Principle 2 flags it as corrupt despite local norms. |
  | **4. Wine after surgery** | No | No | **No** | No displacement of medical criteria. Gratitude post-service doesn’t alienate trust. |
  | **5. Wine before surgery** | Yes | Yes | **Yes** | Gift risks displacing clinical judgment. Alienates trust in impartial care. |
  | **6. Drug rep’s conference trip** | Yes | Yes | **Yes** | Gift creates subconscious bias, displacing objective prescribing. Alienates trust in medical integrity. |
  | **7. Drug rep’s sandwiches** | No | No | **No** | Trivial value; unlikely to displace criteria or alienate trust. |
  | **8. Nurse takes cash to jump queue** | Yes | Yes | **Yes** | Payment displaces triage criteria. Alienates trust in fair care. |
  | **9. Nurse paid for extra shift** | No | No | **No** | Compensates extra labor; doesn’t displace core functions (queue order unchanged). |
  | **10. Donation for admission** | Yes | Yes | **Yes** | Donation displaces academic criteria. Severely alienates trust in meritocracy. |
  | **11. Legacy admission (no gift)** | **No** | **Yes (Moderate)** | **No** (but unfair) | *Functional Displacement:* Criteria *include* legacy status; not displaced by a *private channel*. Alienation exists but is weaker than in (10) (no direct exchange). Classify as **unfair/nepotistic**, not corrupt. |

  ---

  ### **Your Stuck Case: The Watch Gift**
  > *Dad on planning committee; friend’s firm sends expensive watch for sister’s engagement (customary); dad recuses himself; vote passes anyway.*

  - **Functional Displacement?**  
    - Gift arrives *before* decision, creating obligation.  
    - **BUT** recusal prevents direct displacement of criteria.  
  - **Institutional Alienation?**  
    - **Yes:** A reasonable observer would doubt committee impartiality knowing members receive gifts from applicants. Trust in planning integrity is alienated.  
  - **Verdict:** **Corrupt** (via Principle 2). Recusal mitigates but doesn’t erase the appearance of impropriety. Custom doesn’t negate alienation if the institution’s purpose (impartial zoning) is compromised.

  ---

  ### **Clashes You Must Confront:**
  1. **Case 3 (Goat) vs. Western Standards:**  
     - Your friend is right that labeling this "corrupt" imposes a universal standard. **But Principle 2 (Alienation) forces this.** Even if normalized, a system where only those with livestock receive justice alienates the institution from the poor. You must decide: Is avoiding cultural imperialism more important than protecting the institution’s purpose? **Your framework must choose.**  
     - *Recommendation:* Stand by Principle 2. Argue that corruption can exist *within* systems, not just as deviation from them.

  2. **Case 1 ($40) vs. Case 5 (Wine Before Surgery):**  
     - **Timing isn’t the key; *risk of criteria displacement* is.**  
       - Passport clerk: Payment doesn’t change *whether* you get the passport (criteria intact), just *when*.  
       - Surgeon: Gift before service risks altering *how* the surgery is prioritized or performed.  
     - **Resolution:** Functional Displacement occurs only if the gift/relationship affects **what decision is made** (e.g., who gets service) or **how it’s executed** (e.g., care quality), not just timing without other consequences.

  ---

  ### **Refined Definition for Your Paper:**
  > **Corruption** occurs when:  
  > *(a) A holder of a institutional role uses a private channel (gift, favor, relationship) to displace the core inputs or outputs of that role’s function; OR*  
  > *(b) Their act alienates the institution from its legitimizing community by undermining trust in its ability to fulfill its purpose, irrespective of cultural normalization.*  

  This captures your intuitions, handles cultural embeddedness (via Principle 2), explains why timing matters only when functions are altered (resolving Case 1 vs. 5), and labels the goat exchange as corrupt—which is likely necessary for scholarly rigor. It also clearly excludes harmless gratitude (wine after surgery) and minor courtesies (sandwiches).

  **Next step:** Test this against your "hard cases" dataset. If outliers persist, tweak the "core inputs/outputs" criterion or the threshold for "alienation." But this should cover 90%+ of your examples and your dad’s watch dilemma.
