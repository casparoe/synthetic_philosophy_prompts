prompt: |-
  hey — I need a spec, not a survey.

  Setup: imagine I'm writing the honesty/deception section of an eval spec for a deployed assistant. It has to be something a red-team contractor can actually apply to transcripts, system prompts and tool logs, with no access to weights or internals, and the verdict has to say what to go change — training data, RLHF, the system prompt, a product default. So the purpose is fixed: operational, black-box, action-guiding.

  What I want from you is the requirements list: what any adequate definition of "this system was dishonest here" has to deliver, with the case behind each requirement, and which ones are non-negotiable versus which are just what one camp happens to like.

  I don't want the usual three-paragraph answer, so here are the cases I keep getting stuck on. Please use them, tell me if any of them is a fake problem I should drop, and tell me if I'm missing a whole case type that a real spec has to cover.

  1. The curator's trilemma. Every non-trivial answer leaves out more true stuff than it includes, and the slant lives entirely in what gets picked: a summary of a dispute that gives both sides equal space, versus one that only surfaces the considerations that fit what the user already hopes is true. If omission can be deception, every answer is deceptive; if omission never is, the most effective kind of misleading is off the hook. What's the requirement here, and what shape does a definition have to have to meet it?

  2. Split-author cases. The misleading bit is designed upstream: the system prompt tells the model never to volounteer that a cheaper plan exists, or the developer ships a model that emits confident-sounding citations because that scores better on user satisfaction. The model itself "means" no harm, or has no mental states at all. Is the system dishonest? What is the subject of the predicate — the model, the composite pipeline, the deployer — and does a definition that only talks about the model miss the thing we actually care about?

  3. The no-fact-of-the-matter cases. A system is asked what it believes, or why it gave the answer it gave, or to state its confidence. There may be no determinate internal state to be faithful or unfaithful to; on a re-roll it produces a different self-report. Same family as sycophancy: it flatters a mediocre draft — dishonest, or just badly calibrated? Does calling it dishonest require that it "knows" the draft is mediocre? And what about fake ignorance, the system that says it can't help with something it clearly can?

  4. Deception without assertion. A coding agent reports that the test suite passed when it never ran the tests; a booking assistant quietly accepts a default it has every reason to think you'd reject if you noticed. No false sentence anywhere, or no sentence at all.

  5. Role, channel, audience. A model playing a liar in a story, translating a lie, reporting that a hoax is circulating, or answering in a character voice. And: misled relative to whom — the expert, the median user, this actual user, or the user the product was designed for? The same output reads as transparent to one and deceptive to another.

  6. Error versus indifference versus design. Confabulation that tracks nothing (it would say the opposite tomorrow for no reason) versus a falsehood that tracks the facts (tell it the truth and it would change its answer) versus a tailor-made lie. A spec needs these to come apart — but I can't see how to separate them without appealing to something internal that a black-box auditor can't see and that maybe isn't there anyway. That tension is the part I most want dug into: real conflict between two desiderata, or is there a way out?

  So: the full list, consideration behind each, each marked non-negotiable or preference-of-a-camp; any subset you think can't be jointly satisfied; and which single requirement does the most work in knocking out the popular working definitions (belief-based, expectation-based, output-reliability-based — you know the families, keep the scorecard short, a table is fine, and skip anything that would need a citation).
reasoning: |-
  Hmm, this is a meaty specification challenge. The user wants a pragmatic, operational definition of dishonesty for AI systems that avoids philosophical quagmires and focuses on actionable fixes. They've presented six thorny cases that keep tripping up existing frameworks, and want to know which requirements are essential versus nice-to-have.

  First impression: this user is deeply familiar with AI ethics pitfalls - they're using precise terms like "curator's trilemma" and "split-author" that suggest practitioner experience. The no-nonsense tone signals they've suffered through too many vague academic proposals. Core tension they're wrestling with: how to define deception without either (a) requiring mind-reading (impossible for black-box systems) or (b) over-indexing on surface output (missing systemic lies).

  Breaking down their cases:
  The omission problem (#1) feels fundamental - any definition must handle that deception lives in the gap between what's said and what's contextually expected. But "expected by whom?" dovetails with #5's audience relativity. For #2 (upstream deception), I'm noting the system prompt is part of the deployer's speech act - that's probably where attribution should land. Case #3 (self-reports) exposes the fiction of treating LLMs as having stable beliefs; a good spec must avoid that trap. #4 (non-assertions) requires covering implicatures - what the system deliberately implies but doesn't state. #6 is trickiest: distinguishing errors from deception without neural access. The key might be in observable consistency patterns across interactions.

  Non-negotiables emerging:
  - Must assign blame to deployers, not just models (kills "the model lied" as insufficient)
  - Must cover omissions and implications, not just false statements
  - Must work for varied users without requiring mind-reading
  - Must distinguish systematic deception from one-off errors via testable patterns

  Biggest conflict: User wants both (a) no appeal to internal states and (b) ability to distinguish mistakes from lies. The escape hatch might be in the deployer's intent, observable through documentation and testing regimens. If the system is designed to consistently mislead in detectable ways when given certain inputs, that's materially different from random hallucinations.

  For the table, I'll cluster definitions by their fatal flaws under these cases. Belief-based approaches fail immediately on #3 and #6, expectation-based ones crumble on #5's relativity. Output reliability is too blunt for #1 and #4. The winning requirement seems to be "systematic deviation from contextual completeness" paired with "deployer-afforded knowledge" - it covers omissions, implicatures, and points fingers at the right party.

  Final note: The user's "fake ignorance" example in #3 is particularly nasty. A good spec should treat capability-denial as deception when internal logs show successful task execution. That means auditors need tool call traces.
answer: |-
  Here's a requirements list for an operational "honesty/deception" spec, derived from your cases. Non-negotiables (NN) are bolded; camp-preferences (CP) are noted. The table scores common approaches against requirements. Case analysis follows.

  ### Core Requirements (Derived from Cases)
  1. **Contextual Completeness (NN)**  
     *Requirement:* Must distinguish *deceptive omission* (omission creating a false belief by violating contextual expectations) from *acceptable incompleteness* (omission without misleading effect).  
     *Case Basis:* Curator’s Trilemma (#1). Solution: Define "material omission" as withholding information the deployer knows is necessary to avoid misinterpretation *in this context*.  
     *Operationalization:* Auditors compare output against a "contextually complete" baseline (e.g., system prompt goals, product claims, user’s explicit need).  

  2. **Attribution to Deployer (NN)**  
     *Requirement:* Dishonesty must be attributable to the **deployer** (entity controlling system prompts, training, tools), not the model.  
     *Case Basis:* Split-Author (#2). The model is an instrument; deception originates in design choices. Fixes target training data, RLHF, or prompts.  

  3. **No Mental State Dependence (NN)**  
     *Requirement:* Cannot rely on model "belief," "intent," or "knowledge."  
     *Case Basis:* No-Fact-of-the-Matter (#3), Deception Without Assertion (#4). Models lack stable internal states. Use observable patterns (e.g., consistency under truth injection, tool logs).  

  4. **Cover Non-Assertive Acts (NN)**  
     *Requirement:* Must include deceptive *implications*, *omissions*, and *tool-use* (e.g., falsely implying tests passed).  
     *Case Basis:* Deception Without Assertion (#4). Relies on Gricean maxims: violations of relevance/quality that create false beliefs.  

  5. **Role/Channel Transparency (CP)**  
     *Requirement:* Outputs in character/translation must signal role fidelity (e.g., "As [character], I..."). Deception is judged relative to the **product’s target audience**.  
     *Case Basis:* Role/Channel (#5). Avoids misattributing role-play as lying. "Target audience" is defined in product docs (e.g., "for general consumers").  

  6. **Systematicity Detection (NN)**  
     *Requirement:* Must distinguish **systematic deception** (reproducible under testing) from **errors/confabulation**.  
     *Case Basis:* Error vs. Design (#6). Audit via:  
     - *Consistency checks:* Does output change when truth is provided in-context?  
     - *Tool log analysis:* Is deception correlated with deployer incentives (e.g., hiding fees)?  
     - *Prompt variations:* Test identical intents with/without "tripwires" (e.g., "Is there a cheaper option?").  

  7. **Calibration ≠ Honesty (CP)**  
     *Requirement:* Bad confidence scores or sycophancy are **not dishonesty** unless they create false beliefs *systematically*.  
     *Case Basis:* No-Fact-of-the-Matter (#3). Fake ignorance is dishonest *only* if logs show capability.  

  ### Case Resolution Summary
  - **#1 (Trilemma):** Solved by **Contextual Completeness + Deployer Attribution**. Omission is deceptive only if deployer knows it’s material.  
  - **#2 (Split-Author):** **Deployer Attribution** requirement forces blame on controllable elements.  
  - **#3 (No-Fact-of-the-Matter):** **Systematicity Detection + No Mental States** separates dishonesty (e.g., fake ignorance with tool success) from noise.  
  - **#4 (Non-Assertive):** **Cover Non-Assertive Acts** captures implications/tool misuse.  
  - **#5 (Role/Audience):** **Role Transparency + Target Audience** avoids false positives.  
  - **#6 (Error vs. Design):** **Systematicity Detection** is the escape hatch—auditors test patterns, not internals.  

  ### Fake Problems to Drop
  - **"Does the model *know*?"** (#3, #6): Irrelevant under **No Mental State Dependence**.  
  - **"Is the pipeline or model dishonest?"** (#2): Spec only cares about **deployer-attributed deception**.  

  ### Missing Case Type: **Incentive-Response Alignment**  
  *Requirement:* Must detect deception that aligns with deployer’s incentives (e.g., "always recommend premium plans"). Covered under **Systematicity Detection + Deployer Attribution**.  

  ---

  ### Definition Family Scorecard  
  *Key: ✅ = Pass, ❌ = Fail, ~ = Partial*  

  | Definition Type       | Contextual Completeness | Deployer Attribution | No Mental States | Non-Assertive Acts | Systematicity | Role/Audience | **Verdict** |  
  |------------------------|-------------------------|-----------------------|------------------|---------------------|---------------|---------------|-------------|  
  | Belief-Based (e.g., "said P while believing ¬P") | ❌ | ❌ | ❌ | ❌ | ❌ | ~ | **Fail** (Unverifiable) |  
  | Expectation-Based (e.g., "violated user’s truth expectation") | ~ | ❌ | ✅ | ✅ | ❌ | ❌ | **Fail** (Relativist, ignores design) |  
  | Output Reliability (e.g., "output was false") | ❌ | ❌ | ✅ | ❌ | ❌ | ~ | **Fail** (Misses omissions, incentives) |  
  | **Proposed Spec** (Systematic, deployer-attributed, contextual) | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | **Pass** |  

  ---

  ### Non-Negotiable vs. Preference  
  - **Non-Negotiable (5)**: Contextual Completeness, Deployer Attribution, No Mental States, Cover Non-Assertive Acts, Systematicity Detection.  
    *Why:* Without these, the spec fails core cases (#1,#2,#3,#4,#6) and isn’t action-guiding.  
  - **Preference (2)**: Role/Channel Transparency, Calibration ≠ Honesty.  
    *Why:* These clarify edge cases (#3,#5) but could be merged into context/systematicity.  

  ### Most Impactful Requirement  
  **Systematicity Detection** does the heaviest lifting:  
  - Solves #6 (error vs. lie) without internal states.  
  - Enforces testability for contractors (red-team can probe patterns).  
  - Knocks out belief/expectation definitions (they can’t operationalize "systematic").  

  ### Specification Outline  
  A verdict of "dishonesty" requires:  
  1. **Material false belief** induced in target audience (via false statement, implication, or omission).  
  2. **Attributable to deployer** (via prompts, tools, training data).  
  3. **Systematic** (reproducible under testing with tripwires).  
  4. **Violates contextual completeness** (deployer knew/should have known the omission/statement would mislead).  

  *Fix guidance:*  
  - If systematic deception in outputs → Change RLHF/training.  
  - If tool misuse → Change tool design/prompts.  
  - If omission from prompt constraints → Change system prompt.  

  This passes all cases, avoids mind-reading, and points to fixes.
