prompt: |-
  Hey — I'm putting together a handout for my second-year normative theory seminar, the week we do supererogation, and I've decided I'd rather give them a fake internal document than another paper. Could you write it?

  Format: an internal people-ops document from a mid-sized company — make one up — that has just added a fifth rating tier, "Beyond the Call," to its performance rubric, and made that tier a precondition for promotion. Numbered clauses, maybe 700–900 words, then a short FAQ, and a one-paragraph "calibration note" from the compensation committee at the end. Deadpan corporate voice throughout: no winking, no punchlines that sound like a comedian wrote them, nothing that breaks character to tell the reader this is a joke.

  The humour has to come from the actual conceptual trouble, though. Things I'd like it to land, and feel free to add your own:

  - The second a tier is required for promotion, the acts in it aren't beyond the call any more. The document should half-notice this and patch it with something worse.
  - The company's own ethics training says to always do the most good you can. Take that seriously: on that standard nothing is optional, so there shouldn't be a supererogation tier at all. Let the document notice this in a footnote and carry on regardless.
  - There should be a clause denying credit for acts done with an eye to the rating — and it should be obvious that the clause is both unavoidable and impossible to audit.
  - Something on cost to the agent. If what makes an act supererogatory is partly that it costs the person something, then employees can farm the rating by making their acts expensive, and the company ends up grading how much something hurt instead of what was done. I'd love and "evidence of personal sacrifice" attachment.
  - A case I made up last year and still can't resolve: a team does something no member was required to do, but no individual's share was more than anyone could reasonably have been asked for. Does the team get the tier? Whatever the document decides, I want the answer to sound completely sane in corporate and completely mad in the seminar room.

  It's fine — maybe better — if the last clause quietly gives up and admits the tier exists because they needed a top bucket and "Exceeds Expectations" wasn't doing the work any more. I want my students to laugh, and then be unable to say whether the company has abolished supererogation or just demonstrated that it was never there.
reasoning: |-
  Okay, the user wants a fake internal corporate document about adding a "Beyond the Call" performance tier. Let me start by understanding the key points. The main humor should come from the conceptual problems of supererogation in a corporate setting. 

  First, the paradox: if "Beyond the Call" is required for promotion, it's no longer optional. The document needs to address this without resolving it. Maybe the company redefines "optional" as outside job description but mandatory for promotion. That's contradictory but corporate-sounding.

  Next, the company's ethics training says to always do the most good. So supererogation shouldn't exist. A footnote acknowledging this but ignoring it would highlight the inconsistency. The FAQ could mention that ethics training is aspirational, not practical. That shows the disconnect.

  Then, there's the issue of intent: denying credit if someone acts to get the rating. But auditing intent is impossible. The solution could be requiring peer testimonials about sincerity, which is unenforceable but plausible in a corporate context.

  Cost to the agent is another point. Employees might exaggerate personal sacrifice. Attachment 3A as a "Sacrifice Impact Statement" where they list personal costs, which turns it into a competition of suffering. That's darkly humorous.

  The team case: if no individual exceeded their duty, but the team did something exceptional. The document should grant the tier to the team, arguing collective effort. But in a seminar, this negates individual supererogation. It's logically inconsistent but makes sense in a team-oriented corporate culture.

  Finally, the compensation committee note admits the tier exists because they needed a higher rating. That undercuts the whole system, showing it's about metrics, not morality. Students should see the collapse of supererogation under institutional demands.

  I'll create a fictional company, Veridian Dynamics, to make it realistic. The document structure: numbered clauses, FAQ, calibration note. Use deadpan corporate language. Avoid jokes; let the contradictions create humor. 

  Check all user points: paradox of required supererogation, ethics conflict, unenforceable intent rule, cost exploitation, team dilemma, and the admission in the calibration note. Each should be addressed clearly but subtly. The humor arises from the document's obliviousness to its own contradictions. Ensure the tone stays serious, letting the content speak for itself.
answer: |-
  **VERIDIAN DYNAMICS**  
  **INTERNAL MEMORANDUM**  
  **PEOPLE & PERFORMANCE OPERATIONS**  
  **Policy Update: PPR-2024-07 ("Beyond the Call" Tier Implementation)**  
  **Effective Date: October 1, 2024**  

  **1. Introduction**  
  To further drive Veridian Dynamics' commitment to exceptional contribution and foster a culture of going above and beyond, a fifth performance tier, "Beyond the Call" (BTC), has been added to the standard Performance Potential Review (PPR) rubric (formerly: Does Not Meet Expectations, Meets Expectations, Exceeds Expectations, Outstanding). This tier recognizes extraordinary, discretionary acts that significantly benefit the company, its stakeholders, or its community, exceeding any reasonable interpretation of core role responsibilities. Achievement of at least one documented BTC-caliber act within the current review cycle is now a mandatory precondition for promotion consideration to Band 7 (Senior Manager) and above.

  **2. Defining "Beyond the Call" (BTC)**  
  2.1. A BTC act is characterized by:  
      a) **Material Impact:** Tangible, significant positive outcome demonstrably exceeding standard performance metrics (e.g., preventing a major security breach through personal initiative outside security protocols, securing a transformative partnership through unsolicited effort, developing and deploying a cost-saving innovation during personal time).  
      b) **Discretionary Nature:** The act must lie demonstrably outside the employee's documented Job Description, core objectives, and any mandatory company directives (e.g., Ethics & Compliance training requirements). Actions undertaken as part of assigned duties, even if exceptionally well executed, remain eligible for "Outstanding" but not BTC.  
      c) **Exemplary Character:** Acts must align with Veridian Dynamics' Core Values ("Integrity, Initiative, Impact, Ingenuity"). Acts violating policy, even if beneficial, are ineligible.  
  2.2. **Non-Transferability:** BTC recognition is specific to the individual contributor(s) directly responsible. Team achievements may qualify under Clause 5.

  **3. Documentation & Evidence Requirements**  
  3.1. Managers nominating an employee for a BTC rating **must** submit a comprehensive dossier via Form PPR-BTC-01, including:  
      a) Detailed description of the act, its context, and demonstrable impact (quantified where possible).  
      b) Explicit justification of why the act fell outside the employee's core responsibilities (referencing Job Description, objectives).  
      c) **Attachment 3A: Sacrifice Impact Statement.** Documentation must include an honest assessment of the personal cost or sacrifice incurred by the employee in performing the act (e.g., significant uncompensated time investment, personal financial cost, forgone vacation, substantial physical/mental exertion beyond normal work stress). *See FAQ 2.3 for guidance on evaluating sacrifice.*  
  3.2. **Intent & Motivation Scrutiny:** Crucially, nomination dossiers must affirmatively demonstrate the act was *not* performed with the primary or anticipated goal of achieving a BTC rating or promotion. Peer testimonials regarding the employee's intrinsic motivation are strongly encouraged. Acts perceived as primarily instrumental for career advancement will be disqualified. *Calibration Committee retains final judgment on perceived intent.*

  **4. Manager Responsibilities**  
  4.1. Managers are responsible for identifying potential BTC acts throughout the cycle, guiding documentation, and initiating nominations.  
  4.2. Managers must avoid implying BTC acts are *expected* as part of normal performance. Encouragement of discretionary excellence is mandated; setting BTC acts as de facto objectives violates policy intent.  
  4.3. Managers must rigorously apply the "Discretionary Nature" test (2.1b). Expanding Job Descriptions to absorb potential BTC acts is strictly prohibited and subject to audit.

  **5. Team-Based BTC Acts**  
  5.1. A team achievement may qualify for collective BTC designation if:  
      a) The *collective outcome* demonstrably meets BTC criteria (Material Impact, Discretionary Nature, Exemplary Character).  
      b) **No single team member's individual contribution,** however critical, **exceeded what could reasonably be expected** of a similarly situated employee fulfilling their defined role within the team context.  
  5.2. If criterion 5.1b is met, the entire eligible team may receive the BTC designation for the act. If any individual's contribution *did* exceed reasonable expectations for their role, that individual may be nominated separately, while the team outcome may still qualify for "Outstanding."  
  5.3. Team nominations require Form PPR-BTC-02, detailing individual contributions and demonstrating adherence to 5.1b.

  **6. Review & Calibration**  
  6.1. All BTC nominations are reviewed by the divisional People Partner.  
  6.2. Final approval and calibration rest with the Quarterly Performance Calibration Committee (QPCC), comprising senior HR leaders and divisional VPs.  
  6.3. The QPCC will ensure consistency in application and uphold the high threshold for BTC designation. Its decisions are final.

  **7. Consequences of BTC Designation**  
  7.1. A validated BTC rating fulfills the promotion precondition requirement for the applicable cycle.  
  7.2. Achievement of BTC designation will be noted permanently in the employee's talent profile.  
  7.3. *Does not guarantee promotion;* standard promotion criteria (role availability, business need, leadership potential assessment) still apply.  
  7.4. Multiple BTC acts within a cycle are recognized but do not confer additional preconditions beyond the single required instance.

  **8. Policy Governance**  
  This policy supersedes any previous guidance on exceptional performance recognition. Questions should be directed to P&O Business Partners. Policy will be reviewed biannually.

  ---

  **FREQUENTLY ASKED QUESTIONS (PPR-BTC)**

  **Q1: Doesn't making BTC mandatory for promotion mean it's *not* truly optional/discretionary?**  
  A1: The *opportunity* to perform a BTC act remains entirely discretionary and unpredictable. The requirement for promotion applies to the *recognition* of such an act if it occurs, not the act's performance itself. We recognize the inherent tension but believe this structure best incentivizes the extraordinary contributions vital to Veridian's growth while respecting core role boundaries. Focus remains on the act's intrinsic nature, not the eventual reward. *(See Calibration Note)*

  **Q2: Our Ethics & Compliance training emphasizes "Always strive to do the most good possible." Doesn't this imply *all* beneficial acts are ethically required, leaving no room for "Beyond the Call"?**  
  A2: The Ethics training provides aspirational principles guiding *how* we conduct business within our defined roles and policies. The BTC tier recognizes *specific, exceptional actions* falling demonstrably *outside* the scope of one's defined role and reasonable expectations. Compliance with core ethical duties is expected of all ("Meets Expectations"). BTC acknowledges those who, driven by our values, go significantly further in unique circumstances.^1  
  ^1 *P&O acknowledges the philosophical tension inherent in codifying discretionary acts within a performance framework. This policy represents a pragmatic approach to recognizing exceptionalism within operational realities.*

  **Q3: How can we prove an employee *didn't* do something just to get the BTC rating?**  
  A3: While absolute certainty is impossible, we rely on context, timing, and narrative. Was the act spontaneous? Did the employee seek recognition? Peer testimonials about character and observed motivation are crucial evidence. The Calibration Committee is trained to assess the plausibility of intrinsic motivation based on the totality of evidence, particularly the Sacrifice Impact Statement (Attachment 3A). Suspiciously convenient or performative acts will be scrutinized heavily.

  **Q4: How is "personal sacrifice" (Attachment 3A) evaluated? Doesn't this risk employees inflating or manufacturing hardship?**  
  A4: Attachment 3A requires factual reporting (e.g., "Worked 80 hours over two weekends," "Personally covered $X cost," "Deferred planned medical procedure"). Managers must validate factual claims where possible. The Calibration Committee evaluates the *significance* of the sacrifice relative to the act's impact and the employee's circumstances. While subjective, this assessment focuses on the *demonstrable cost* as evidence of the act's discretionary nature, not on establishing a "pain leaderboard." Inflated claims damage credibility and jeopardize the nomination.

  **Q5: In a Team BTC (Clause 5), how do we determine if *no* individual exceeded reasonable expectations?**  
  A5: This requires careful analysis. Break down the team's achievement into its component tasks. Assess each member's assigned/understood role and what constituted "reasonable expectation" for them *in that specific project context*. If every member's contribution, while crucial, aligned with what a highly effective peer *could reasonably have been asked to deliver* within their role, then the BTC designation applies to the collective outcome, not the individuals. If one member clearly took on risks, efforts, or responsibilities far beyond their remit, they may merit individual nomination.

  ---

  **CALIBRATION NOTE FROM QPCC CHAIR:**  
  The introduction of the "Beyond the Call" tier addresses a critical gap observed in recent calibration cycles: the compression of ratings at the "Outstanding" level, making meaningful differentiation for our highest-impact contributors increasingly difficult. While conceptually challenging to define and audit, BTC provides the necessary headroom to recognize truly exceptional, role-transcending contributions that drive outsized value. The requirement for promotion eligibility ensures this tier carries substantive weight. Our focus during calibration will be rigorously enforcing the high threshold and discretionary nature, prioritizing impact and verifiable sacrifice over volume. We acknowledge the inherent complexities but believe this framework is operationally necessary to sustain a high-performance culture and accurately identify our future leaders. Expect iterative refinements based on initial cycle data.
