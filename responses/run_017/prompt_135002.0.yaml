  ### Design Notes
  - **Cases Used**: (i) Rennert medium (Q3), (ii) History/engineering of quantities (Q6), (iii) Boundary conditions (Q1), (iv) Unfeasible derivation (Q5).  
  - **Bench-Scale Focus**: All cases from classical physics/chemistry (fluids, polymers, reactions). No quantum or consciousness.  
  - **Efficiency**: 8 nodes, 10 leaves. Fits one A4 page; groups of 8 can complete in ~45–60 min.  
  - **Label Avoidance**: Nodes query concrete cases (e.g., "Does viscosity cause vortex stability?"), not abstract labels.
