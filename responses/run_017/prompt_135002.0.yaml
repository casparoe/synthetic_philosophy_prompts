  Below is a decision tree for positions on reduction and emergence, built from concrete cases in bench-scale science. The tree has eight binary or ternary branch nodes (questions) and ten leaves (positions). Each node uses a specific case to elicit commitments, avoiding labels and bibliographic appeals. The tree is designed to fit on one side of A4 paper and be workable in an hour by eight participants. Cases (i–iv) are included as specified, with one additional node on disagreement. Positions are characterized by their commitments, with common labels in parentheses only where unambiguous. Empty answer combinations and unresolved leaf pairs are noted at the end.

  ---

  ### Decision Tree: Reduction and Emergence in Bench-Scale Science
  *Answer the questions sequentially, following the arrows based on your response.*

  1. **Boundary Condition Indispensability (Case iii)**:  
     When deriving a macro law (e.g., fluid turbulence) from micro theory requires a boundary condition (e.g., "high Reynolds number") that can only be stated in macro vocabulary, is the macro level indispensable for a complete explanation?  
     - **A: Yes** → Go to 2  
     - **B: No** → Go to 3  

  2. **Disagreement Resolution**:  
     If micro and macro descriptions of a system (e.g., viscosity in a non-Newtonian fluid), each idealized and corrected, still disagree, which should be revised?  
     - **A: Revise the micro description** → Go to 4  
     - **B: Revise the macro description** → Go to 5  
     - **C: Neither; disagreement reveals a deeper issue** → Go to 6  

  3. **Rennert Invariance (Case i)**:  
     In the Rennert reaction–diffusion system, wavefront speed is invariant across varying micro-kinetics (temperature, catalyst, geometry). Is this invariance an explanatory achievement of the macro law, or just a predictive convenience?  
     - **A: Explanatory achievement** → Go to 7  
     - **B: Mere convenience** → Go to 8  

  4. **Downward Causal Role**:  
     Can a macro property (e.g., viscosity) irreducibly cause or stabilize micro patterns (e.g., preventing vortex collapse) in a way not deducible from micro laws alone?  
     - **A: Yes** → **Leaf 1**  
     - **B: No** → **Leaf 2**  

  5. **Unfeasible Derivation (Case iv)**:  
     When a macro law (e.g., polymer entanglement dynamics) is derivable from micro theory only via unattainable computation, but a 2-parameter phenomenological model predicts it precisely, does the model reveal a genuine pattern?  
     - **A: Yes** → **Leaf 3**  
     - **B: No** → **Leaf 4**  

  6. **History Dependence (Case ii)**:  
     Contrast (a) temperature (fixed by lab practice pre-kinetic theory) with (b) a deliberately engineered macro parameter (e.g., stress-optical coefficient in polymers) trivialized by micro construction. Does the history of epistemic access affect the ontological status of these quantities?  
     - **A: Yes, history matters ontologically** → **Leaf 5**  
     - **B: No, history is irrelevant** → **Leaf 6**  

  7. **Eliminability of Macro Vocabulary**:  
     Can macro-level terms (e.g., "phase transition") be eliminated from science without explanatory loss, using only micro vocabulary?  
     - **A: Yes, in principle** → **Leaf 7**  
     - **B: No, patterns require macro terms** → **Leaf 8**  
     - **C: The question is misguided** → **Leaf 9**  

  8. **Macro Law Truth Without Derivation**:  
     If a macro law (e.g., Fickian diffusion) is empirically robust but cannot be derived from micro theory (even in principle) due to complexity, is it reasonable to regard it as approximately true?  
     - **A: Yes** → **Leaf 10**  
     - **B: No** → **Leaf 4**  

  ---

  ### Leaves (Positions)
  Characterized by commitments, with common labels in parentheses where unambiguous.  
  - **Leaf 1**: Macro properties (e.g., viscosity) have irreducible causal power, stabilizing micro patterns in ways micro laws cannot deduce. Downward influence is genuine, and micro revision resolves disagreements. (*Irreducibility with genuine downward influence*)  
  - **Leaf 2**: Macro laws are autonomous under specific interventions (e.g., varying shear rates), but their causal role is reducible; disagreement prompts micro revision. (*Autonomy relative to interventions*)  
  - **Leaf 3**: Phenomenological models capture real patterns when derivations are unfeasible; macro laws are reliable without micro derivation. History of access is ontologically irrelevant. (*Non-reductive physicalism with multiple realizability*)  
  - **Leaf 4**: Macro laws are derivable from micro theory via bridge laws (e.g., connecting molecular collisions to pressure); disagreements require macro revision. (*Derivational reduction via bridge laws*)  
  - **Leaf 5**: Macro quantities (like temperature) are ontologically distinct due to their history of lab practice; they exert downward influence and resist elimination. (*Combines historicism with downward influence; not a standard label*)  
  - **Leaf 6**: Macro properties (e.g., temperature) are identical to micro properties (molecular kinetic energy) though not derivable; history is irrelevant, and disagreements signal errors in bridge laws. (*Identity without derivation*)  
  - **Leaf 7**: Macro vocabulary (e.g., "diffusion coefficient") is a convenient redescription for prediction; invariance is computational convenience, not explanation. (*Deflationary view*)  
  - **Leaf 8**: Macro laws (e.g., reaction–diffusion wavefronts) are unpredictable from micro details in practice but capture robust patterns; eliminability fails due to complexity. (*Emergence as unpredictability in practice*)  
  - **Leaf 9**: The reduction/emergence framing is ill-formed; cases like boundary conditions or eliminability expose flawed assumptions. (*Question ill-formed*)  
  - **Leaf 10**: Macro laws are true when empirically confirmed, irrespective of derivability; Rennert invariance is explanatory, and history is irrelevant. (*Strong emergence without downward causation; not a standard label*)  

  ---

  ### Empty Answer Combinations
  Three combinations are unoccupied:  
  1. **A at Q1 → B at Q2 → A at Q3**: History matters ontologically (Q3A), but Rennert invariance is mere convenience (Q2B), and the macro level is indispensable (Q1A). Empty as *incoherent*: If macro is indispensable and history matters, invariance cannot be "mere convenience" without explanatory weight.  
  2. **B at Q1 → A at Q2 → B at Q3 → A at Q6**: Macro indispensable (Q1B), Rennert invariance explanatory (Q2A), but history irrelevant (Q6B) and downward influence affirmed (Q4A). Empty as *unattractive*: Downward influence typically requires ontological depth, but excluding history weakens its grounding.  
  3. **B at Q1 → B at Q2 → C at Q7**: Macro not indispensable (Q1B), Rennert invariance mere convenience (Q2B), and eliminability question misguided (Q7C). Empty as *unoccupied*: Deflationary views (Leaf 7) typically accept eliminability, making this a rare hybrid.  

  ---

  ### Unresolved Leaf Pairs and Tie-Breakers
  The tree cannot separate:  
  - **Leaf 2 (Autonomy)** and **Leaf 3 (Non-reductive physicalism)** on causal irreducibility (Q4).  
  - **Leaf 7 (Deflationary)** and **Leaf 10 (Strong emergence)** on macro law truth (Q8).  

  **Tie-Breaker Section** (Add if participants land here):  
  - For **Leaf 2 vs. 3**: *Does macro autonomy imply causal irreducibility?*  
    - If macro stability (e.g., laminar flow) only explicable via interventions (e.g., viscosity changes), choose **Leaf 2**.  
    - If macro patterns (e.g., diffusion) are multiply realizable and causally reducible, choose **Leaf 3**.  
  - For **Leaf 7 vs. 10**: *Is convenience sufficient for truth?*  
    - If predictive convenience exhausts macro validity (e.g., using Fick's law without commitment), choose **Leaf 7**.  
    - If empirical robustness implies approximate truth regardless of reduction (e.g., turbulence scaling laws), choose **Leaf 10**.  

