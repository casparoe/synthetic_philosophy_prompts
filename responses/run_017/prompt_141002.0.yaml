answer: |-
  **1. Question:** What standard of evidence is appropriate for evaluating different grades of cliodynamic claims—point predictions, phase assertions, and structural conditionals—given the field’s methodological constraints (limited independent cases, modern regime shifts) and the reflexivity of social forecasts (where audiences react to predictions)?  

  **2. Why it is open:** The current debate is polarized between modelers citing apparent successes (like instability forecasts) and historians dismissing them as unfalsifiable curve-fitting, ignoring that claims operate at distinct predictive grades requiring tailored validation; further, neither camp adequately addresses how reflexivity or the unique evidentiary base (connected societies, industrial-era outliers) alters the burden of proof for structural claims.  

  **3. Method:**  
  - Months 1–2: Conduct interviews with modelers and historians to map contested claims onto the three-grade framework.  
  - Months 3–4: Replicate one key secular-cycle analysis (e.g., pre-industrial state collapse) using public data to test methodological transparency.  
  - Months 5–6: Design and pre-register a public scorecard tracking live forecasts (e.g., elite overproduction indices, fiscal stress), selecting quantifiable indicators for future verification.  
  - Months 7–8: Draft book sections integrating replication findings, scorecard mechanics, and reflexivity dilemmas.  
  - Month 9: Synthesize arguments on evidentiary standards and revise.  

  **4. Deliverable:** A trade book for intellectually curious non-specialists, translating cliodynamic debates into accessible analysis of prediction’s limits, featuring the pre-registered scorecard as an interactive tool for readers to audit forecasts.  

  **5. Failure conditions and scope:** Failure occurs if structural claims prove universally untestable even under relaxed standards, or interviews reveal insurmountable data gaps for replication. Scope creep is likely in refining the scorecard’s indicators or quantifying historical elite competition, risking overextension into pure research.**
