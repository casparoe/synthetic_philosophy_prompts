prompt: |-
  I'm on a tiny municipal review board — we get asked to sign off on things like a new de-icing solvent for the roads depot, a cell antenna on a school roof, a proposed release of sterile mosquitoes for dengue control, a landfill extension — and I keep reaching for "the precautionary principle" and then getting into arguments with my brother-in-law, who's a toxicologist and says it isn't a principle at all, because on pretty much any proposal you can point at some unstudied possible harm and thereby block it, and equally you can point at the harm of not doing the thing and thereby demand it. He's half right and I want to get less muddled. Here are my gut verdicts, which I suspect don't all fit together. New solvent, plausible mechanism for nerve damage from animal data, no human studies, slightly more expensive substitute available: don't use it, precaution applies. A drug for a fatal childhood disease, great early results, theoretical worry about a cancer thirty years out: approve it, and no — I don't think I'm just being inconsistent, because not approving has bodies attached too, but I don't know how to say when inaction counts as a risk. The school antenna, where we've actually looked for decades and found nothing: not a precaution case at all, even though I can't rule anything out. The mosquito release: much stronger pull toward caution than multiplying probability by magnitude would give me, because whatever goes wrong is permanent and I can't even enumerate the ways it could. Landfill extension, small health risk, falls on a poor neighbourhood that gets nothing out of it: precaution, hard. Same size risk borne by the landfill workers who know about it, chose the job, and get paid extra: much weaker pull. And then there's the one I go back and forth on — the same landfill job in a town where there is no other employer, so the "choice" feels fake, consented to but under pressure that isn't anyone's fault exactly. I also notice I want precaution to apply to things we've been doing for sixty years when a better test finds a problem, even though nobody ever *decided* to take that risk, which seems to kill any rule like "precaution is about new things"; and I want it to apply to harms that only land on people who don't exist yet, maybe more strongly than to present harms, though I can't say why "they don't exist" makes it stronger rather than weaker; and I want it to apply much less to something whose entire purpose is to reduce a risk — a flood barrier, a vaccine — even when that thing carries a small novel risk of its own, since banning the vaccine because of a one-in-a-million side effect strikes me as a misuse of the whole idea.

  The best principle I've managed to cough up is something like: precaution is owed when (i) the downside is severe and hard to walk back, (ii) it lands on people who didn't take it on and can't realistically opt out, and (iii) the uncertainty is of the "nobody has looked" or "nobody can look" variety rather than the "we looked and got a null result" variety — and when all three hold, you don't get to weigh the benefits you'd forgo as if they were the same kind of item as the harm you might cause. I don't want a label or a reading list; I want to know whether that thing actually holds together, which of my verdicts it gets right, which it forces me to give up if I want it simple, whether there's a cleaner principle that gets more of them (and what it costs me), and how whatever you land on handles the no-other-employer case I keep flip-flopping on. Also, if you think one of my distinctions is bogus — the "we looked vs. nobody looked" one feels suspiciously convenient, like I invented it to save the antenna verdict — say so and tell me what to put in its place.
reasoning: |-
  Okay, this user is on a municipal review board dealing with various proposals, and they're struggling with applying the precautionary principle consistently. Their brother-in-law, a toxicologist, argues that the principle isn't really a principle because it can be used both to block and demand actions based on uncertain risks. The user has shared several real-world examples where their gut reactions vary, and they want help refining their own framework to make more consistent decisions.

  First, I need to understand the user's core dilemma. They recognize that their brother-in-law has a point about the precautionary principle being applied inconsistently, but they also feel their own intuitions aren't arbitrary. The user has already developed a three-part framework: (i) severe irreversible harm, (ii) imposed on non-consenting parties, (iii) uncertainty due to lack of study rather than studied null results. They want to know if this holds up, where it aligns or conflicts with their judgments, and how to handle edge cases like the "no other employer" scenario.

  Looking at their examples: 
  The solvent case fits their framework perfectly—potential nerve damage, no human studies, non-consenting public exposure. 
  The drug approval doesn't trigger precaution because inaction (not approving) would cause immediate harm (bodies), even though there's theoretical long-term risk. 
  The cell antenna passes because decades of studies show no harm, so uncertainty is low ("we looked" vs. "nobody looked"). 
  The mosquito release is high precaution due to irreversible ecological consequences. 
  Landfill extension gets strong precaution when imposed on a poor neighborhood (non-consenting, no benefit) but weaker for compensated workers. 
  The gray area is when workers "consent" under economic duress—how voluntary is that choice? 

  The user also flags deeper tensions: applying precaution to legacy risks (e.g., old chemicals with new evidence), future generations, and risk-reduction tools like vaccines. Their framework seems to handle most cases except the consent gray zone and legacy risks. 

  To strengthen their approach, I should emphasize that precaution isn't about eliminating uncertainty but managing asymmetric risks. Their "we looked vs. nobody looked" distinction is valid—it reflects epistemic quality. For the landfill worker case, the key is *structural consent*: true consent requires alternatives and bargaining power. The "no other employer" scenario fails this, so precaution applies. 

  Legacy risks are trickier. Their framework implies ongoing duties to reassess old decisions when new evidence emerges, even if no one formally "decided" the risk originally. That's coherent—precaution isn't just for new actions but for maintaining safety over time. 

  For future generations, their intuition aligns with ethical duties to preserve options and avoid irreversible harm. Vaccines are exempt because their small novel risks are dwarfed by the massive, certain harm they prevent—inaction isn't neutral. 

  The core upgrade I'd suggest: frame precaution as a *duty of care* when imposing novel, irreversible risks on vulnerable parties without robust evidence of safety. This justifies their verdicts, resolves the flip-flop cases, and avoids their brother-in-law's "paralysis by uncertainty" critique by focusing on the asymmetry of harm distribution. 

  I should also note that their "don’t weigh benefits equally" point is crucial—it prevents trading certain harm to some against uncertain benefits to others. That’s the ethical spine of precaution.
answer: |-
  Your framework is remarkably coherent—it captures 90% of your intuitions and can be tightened to handle the rest. Let's break it down step-by-step:

  ### Your Proposed Principle (Refined)
  > **Precaution applies when:**  
  > **(1) Potential harm is severe, irreversible, and systemic** (not just individual);  
  > **(2) Harm is imposed on non-consenting populations with no escape or alternative**;  
  > **(3) Uncertainty stems from ignorance ("unknown unknowns") rather than studied absence of evidence.**  
  >   
  > **When these align, the burden of proof shifts:** Potential imposers must demonstrate safety/necessity, and benefits to others cannot override the protected group's involuntary risk.

  ---

  ### How It Handles Your Cases
  | Case                  | Your Verdict | Framework Verdict | Why It Fits |
  |-----------------------|--------------|-------------------|-------------|
  | **New solvent**       | Precaution   | ✔️ Precaution     | (1) Nerve damage = severe/irreversible; (2) Public exposure = non-consenting; (3) No human studies = ignorance. |
  | **Childhood drug**    | Approve      | ✔️ Approve        | (1) Inaction causes certain, immediate harm (fatal disease); (2) Patients consent to treatment; (3) Theoretical risk ≠ ignorance (it's a "known unknown"). |
  | **Cell antenna**      | Approve      | ✔️ Approve        | (3) Decades of evidence ≠ ignorance; (2) School can implement exposure controls. |
  | **Sterile mosquitoes**| Precaution   | ✔️ Precaution     | (1) Ecological harm = irreversible/systemic; (3) Unforeseen ecosystem effects = pure ignorance. |
  | **Landfill (poor area)** | Precaution | ✔️ Precaution     | (2) Community didn't choose risk & gains no benefit; (1) Health impacts = severe/systemic. |
  | **Landfill (workers)** | Weak precaution | ✔️ Weak precaution | (2) Workers "consent" via compensation, but (1) health risk remains → justifies mitigation (e.g., monitoring), not rejection. |
  | **Vaccines/flood barriers** | Approve | ✔️ Approve | Purpose is risk reduction → inaction causes greater harm. Uncertainty is bounded (e.g., one-in-million side effect), not ignorance. |

  ---

  ### Where It Needs Adjustment
  1. **The "No Other Employer" Case**  
     - **Problem:** Your framework treats "consent" as binary, but economic coercion blurs it.  
     - **Fix:** Add a **consent quality test**: Consent is only valid if alternatives exist and the risk-benefit tradeoff is transparent/negotiable.  
     - **Outcome:** Precaution applies strongly. Workers here lack true alternatives → risk is imposed → burden shifts to landfill operator to prove safety *and* provide opt-outs/compensation.

  2. **Legacy Risks (e.g., 60-year-old chemicals)**  
     - **Problem:** Your "new things" instinct conflicts with your intuition to act on new evidence.  
     - **Fix:** Precaution isn't just for *new* actions—it's for *ongoing* imposition of risk under ignorance. New evidence revealing ignorance triggers the principle retroactively.  
     - **Outcome:** If new data shows severe risk previously unknown, precaution demands reevaluation (phase-out/mitigation).

  3. **Future Generations**  
     - **Problem:** "They don’t exist" feels *more* precaution-worthy, but why?  
     - **Solution:** Their interests are non-represented and irreversible harm robs them of autonomy. This amplifies criteria (1) and (2).  
     - **Refined Principle:** *Severe harm to future generations heightens precaution, as they bear maximal irreversibility with zero consent.*

  ---

  ### Is Your "We Looked vs. Nobody Looked" Distinction Valid?
  **Yes, with nuance.** It separates **epistemic uncertainty** (we lack knowledge) from **aleatory uncertainty** (risk is inherent but quantified).  
  - **Cell antenna:** Decades of studies → aleatory uncertainty (risk exists but is minimal).  
  - **Novel solvent/mosquitoes:** Epistemic uncertainty → true ignorance.  
  **But caution:** A null result only counts if studies were sufficiently powered and contextually relevant (e.g., 5G antennas might need new research).

  ---

  ### One Cost of Your Framework
  You must accept that **inaction is action** when:  
  - Deliberate choices maintain the status quo (e.g., *not* banning a legacy chemical after new evidence);  
  - Systemic harm results from omission (e.g., *not* building flood barriers).  
  This resolves your brother-in-law's critique: Precaution isn’t "block everything" – it forces explicit justification for *imposing* risks under ignorance.

  ---

  ### Final Principle
  > **Asymmetric Harm Precaution Principle**  
  > Prioritize intervention when:  
  > 1. **Harm asymmetry:** Potential harm is severe, irreversible, and disproportionately borne by non-consenting groups (present/future);  
  > 2. **Knowledge asymmetry:** Risk arises from *ignorance* (unstudied mechanisms, novel exposure) rather than quantified probabilities;  
  > 3. **Power asymmetry:** Those affected lack meaningful alternatives or voice.  
  >   
  > **Then:** The proposer bears the burden of proof. Benefits to others do not override these protections unless the *inaction* violates the same criteria (e.g., withholding a lifesaving drug).

  This handles your flip-flops:  
  - **No-employer town:** All three asymmetries apply → strong precaution.  
  - **Vaccines:** Harm asymmetry favors action (inaction kills more); knowledge asymmetry is low (risk quantified).  
  - **Legacy risks:** New evidence creates knowledge asymmetry → triggers precaution.

  You’re not muddled—you’ve intuitively grasped the core ethical tension: **Precaution isn’t about avoiding risk; it’s about refusing to impose uncontrolled, irreversible threats on the powerless.** Your framework formalizes that brilliantly.
