answer: |-
  ### Recommendation
  **Recommended Norm**: The rule should be understood as prohibiting statements presented as fact without the poster having **adequate justification at the time of posting**, assessed based on what a reasonable person in the poster's position could be expected to have or provide. This balances accountability (preventing harmful guesses) with practicality (relying on observable text cues), prioritising the community's need for reliable, actionable advice over philosophical purity. 

  **Why it beats the alternatives**:
  - **Knowledge/Truth**: Unworkable—we cannot verify internal mental states or absolute truth, and claims may become outdated (Case 2).
  - **Belief/Sincere Belief**: Too subjective—sincerity is uncheckable and permits well-meaning but reckless advice (e.g., Case 1's admission of uncertainty).
  - **Evidence/Justification**: **Adequate justification** wins by focusing on *reasonableness*: it demands a baseline of support (e.g., personal experience, a source) without requiring perfection. This discourages guesswork while accommodating non-experts.
  - **Reasonableness/Responsibility**: Too vague alone—tying it to *justification* makes it proceduralisable.  

  **What we lose**: We may penalise true claims made without justification (e.g., a lucky guess) and under-penalise false claims with weak-but-plausible justification. However, this trade-off protects readers by incentivising evidence-based answers.  

  ---

  ### Procedure for Arbitrators  
  **Design Principles**:  
  - **Time of posting standard**: Justification is assessed *only* at posting time. Outdated claims (Case 2) are handled via caveats, not violations.  
  - **Shared accounts**: The *account* must meet the standard. If no individual had justification, it violates.  
  - **Machine translation**: Use original text if available; else, treat translated text literally. Ambiguity defaults to violation (cost on poster).  
  - **Basis tag**: Evidence only, not normative. Blank tags aren’t violations but weaken justification.  

  **Step-by-Step Procedure** (runnable in 15 mins):  

  | Step | Question | Evidence | If Met | If Not Met | Terminal? | Maps to Action |
  |------|----------|----------|--------|------------|-----------|----------------|
  | 0 | **Is this a factual claim?** (vs. opinion/guess/suggestion) | Declarative language (e.g., "is", "must"); absence of hedges ("maybe", "I think"); specificity; context (answering a "what" or "how" question). Machine-translated: if original text shows hedging (e.g., "I think"), treat as non-factual. | Proceed to Step 1 | No violation. Stop. | Yes | Leave |
  | 1 | **Was the claim justified at posting time?** | Basis tag (weight: high), source link/citation (high), personal experience for personal claims (medium), specificity (e.g., "Section 12 of the Act" > "the law says"), checkability (e.g., statute name vs. "I heard"). Shared accounts: treat as one entity; if no tag/source, assume no justification. | Proceed to Step 2 | Violation. Stop. | Yes | Hide (or Hide + Warn if pattern) |
  | 2 | **Was the justification adequate?** | "Adequate" = reasonable for a layperson: personal experience for firsthand claims; dated source <5 years old for time-sensitive topics; common knowledge (e.g., "water boils at 100°C") needs no source. Ignore future changes (Case 2). | No violation. Stop. | Violation. Stop. | Yes | Require Caveat (if mostly true) or Hide |
  | 3 | **Is the claim outdated or misleading now?** (Only if not already hidden) | Arbitrator’s general knowledge (e.g., "law changed in 2021") or thread comments. Not a violation review. | No action | Add caveat | Yes | Require Caveat or Leave |

  **Key Simplifications**:  
  - Drops "truth" and "belief": Focuses on observable justification.  
  - Drops "knowledge": Uses "justification" as a proxy.  
  - Retains "reasonableness": Embedded in "adequate justification" (Step 2).  

  ---

  ### Case Applications  
  **Case 1**:  
  - Step 0: "Your landlord has six years" = factual claim (declarative, no hedge).  
  - Step 1: Blank tag, no source → **not justified** at posting.  
  - Verdict: **Hide** (violation).  
  - Confidence: High. Second moderator agreement: Medium (may argue truth mitigates, but rule prioritises justification).  

  **Case 2**:  
  - Step 0: Statistic ("nine times in ten") = factual claim.  
  - Step 1: Basis tag + linked source → **justified** at posting (2017).  
  - Step 2: Data recent (2010–2014) for 2017 claim → **adequate**.  
  - Step 3: Now outdated → **Require Caveat** (e.g., "Rules changed in 2021; verify current rates").  
  - Verdict: **Leave + Require Caveat**.  
  - Confidence: High. Agreement: High.  

  **Case 3**:  
  - Step 0: Original text ("I don’t think... not sure") = hedged → **not factual claim**.  
  - Verdict: **Leave**.  
  - Confidence: High (with original text). Agreement: High.  

  ---

  ### Verdicts You Will Dislike  
  ```json
  [
    {
      "case": 1,
      "verdict": "Hide",
      "expected_verdict": "Leave",
      "recommendation": "Accept the verdict. The rule prioritises preventing unjustified claims (even if true) to deter guesswork and protect readers."
    }
  ]
  ```

  ---

  ### Judgment Points and Misfires  
  **Judgment Points**:  
  | Step | Why Not Proceduralisable | Who Decides | Values in Play |  
  |------|--------------------------|-------------|----------------|  
  | 0 | Distinguishing fact from opinion requires interpreting language nuance (e.g., flattened translation). | Arbitrator | Clarity vs. leniency; cost of ambiguity on poster. |  
  | 2 | "Adequacy" involves contextual reasonableness (e.g., is a 7-year-old source "adequate"?). | Arbitrator | Reliability vs. accessibility for non-experts. |  

  **Known Misfires**:  
  | Pattern | Direction | Mitigation |  
  |---------|-----------|------------|  
  | Correct claims without justification (Case 1) | Over-penalises | Accept: Trade-off ensures only evidence-based advice thrives. |  
  | Vague but true claims (e.g., "they usually allow this") | Under-penalises | Step 2: Reject overly vague claims as "inadequate." |  
  | Machine-translated ambiguity | Over-penalises | Step 0: Use original text if provided; else, flag for human review. |  

  **Unresolved**:  
  - Defining "common knowledge" for diverse readers.  
  - Handling claims about future events (e.g., "your case will take 6 months").  
  - Shared accounts where one user has justification but others don’t.  

  ---

