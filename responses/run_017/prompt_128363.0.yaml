  Final check: all eight required angles covered? Weighting, transitivity preservation, chain necessity, practical guidance, maximization, evidence. Plus two wildcards (Q2 on intuition and Q6 on aggregation). Solid. User's "fortnightly" suggests UK English—no Americanisms in phrasing. 

