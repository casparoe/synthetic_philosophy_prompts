prompt: |-
  hey — I need a piece of sustained satire for something im putting together.

  Form: the Annual Transparency Report of a city agency with a bland name (something like the Office of Choice Architecture — invent it), written as an actual government document: numbered sections, a mission statement, a few footnotes in the self-congratulatory register of a compliance filing, and a closing FAQ sidebar headed something like "Is This Paternalism? (No.)". About 700 words, deadpan the whole way through — no winking, no nudging the reader, the Office must sound completely sincere and slightly proud of itself.

  The setup: the city has decided that since every interface has a default and there is therefore no neutral design, every default is officially a nudge and nudging is officially nothing special. This year the Office stopped hand-designing defaults and contracted a private ad-tech platform that continuously tests them per citizen; each resident now gets whichever arrangement of options, ordering, wording and friction the platform's model predicts will get them to do the thing. The Office's defense, which it states with total sincerity, is that this is *more* respectful than a one-size-fits-all default, because each nudge is tuned to what that particular person would want if they were paying attention and well-informed — the themselves-clause, basically — and because now the Office only chooses the objective, not the means.

  Things I want in there:

  - at least one passage where the Office explains why nothing it does counts as paternalism, using the real arguments (no options removed, nobody coerced, costs of opting out are trivial, means not ends), while describing a practice that obviously is paternalistic. It should never name the objection or the litterature; the reader supplies it.
  - a "Sludge Registry" section listing frictions the Office deliberately left in place, each with the official reason it stays.
  - a transparency section that discloses, very proudly and in detail, that every nudge is now individually targeted, and then explains why it would be counterproductive to tell any given citizen which nudge they personally received.
  - one genuinely unsettling number buried in an appendix and presented as a success metric.
  - feel free to invent a couple of pieces of in-world jargon — "objective-function laundering", "consent-forward defaults", whatever fits.

  The joke has to come from the content: a reader who actually knows the nudging and libertarian-paternalism debates — the themselves-clause and whether the benchmark survives when preferences are themselves shaped by the architecture, means versus ends paternalism, the publicity principle, whether manipulation undermines the consent that's supposed to make nudges okay, who audits the architects — should laugh rather than wince, because the Office is exaggerating moves those arguments really make rather than ones I invented. If you can land a reductio where personalization collapses the difference between steering someone toward their own good and steering them toward whatever the optimizer was pointed at, that's the payoff. No named real people, and don't quote anything.
