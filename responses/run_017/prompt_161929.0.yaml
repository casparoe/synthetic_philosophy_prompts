prompt: |-
  I'm retired now — I spent most of my working life running a prenatal screening service, and since I stopped I've been reading philosophy in a fairly disorganised way, which is how I stumbled into what I think people call the non-identity problem. Something about our own counselling practice has been bugging me ever since, mostly because I wrote some of the scripts myself.

  Two bits of the same appointment, ten minutes apart, same woman, same pregnancy:

  - The scan or the test turns up something serious. We offer the option of ending the pregnancy, and we were very careful never to say "if you continue, you will be harming your child". The line we actually used was closer to "this isn't a life we'd wish on anyone" — impersonal, nobody is named as the victim.
  - Then: stop drinking, take the folate, get your blood sugar under control. And here we had no hesitation whatsoever — "this will harm your baby." A victim, and someone doing something to them.

  What I can't see is how both halves run on the same theory of harm. If the reason we can't say the child is harmed in the first case is that continuing the pregnancy is what makes this child exist at all, then the folate-and-drinking advice looks like it's in the same boat, because changing the timing or the conditions changes which egg and which sperm meet, so it arguably swaps one child for another. And if the reply is "no, that's a different child getting a better start," then I want to know what settles which comparison is the right one — because in the IVF side of the clinic there isn't even a natural "what would otherwise have happened" to measure against; you're choosing among embryos in a dish.

  The case that really gets me is the one with no identity-preserving option at all: a woman every one of whose eggs carries the same serious condition, so her options are donor egg, adoption, or no child. Every branch replaces who exists. And that was exactly when our language got most confident that the child shouldn't be brought into it — firmer there than in the ordinary case, which feels backwards to me. I might be misremebering, or defintely missing something.

  So: what theory of harm — or of who counts — does this practice presuppose?

  Give me exactly five numbered points, a sentence or two each, no preamble and no wrapping-up paragraph:

  1. the implicit theory: reconstruct what the two halves of the script are committed to about harm, identity, and who there is to be harmed
  2. what the practice strictly has to presuppose versus what it merely fits comfortably with
  3. whether there's a principled line between the halves — does it track whether the intervention fixes which child exists or fixes the condition, and what happens in IVF where there's no default outcome to compare against
  4. which rival theories would license the very same practice — I want to know where it's underdetermined rather than where it's committed
  5. what would concretely have to change in the counselling room if we swapped to the rival: would we have to stop saying "this will harm your baby", and what would we say instead
reasoning: |-
  Hmm, the user is a retired professional who ran a prenatal screening service and is grappling with philosophical issues about harm and identity after encountering the non-identity problem. They're specifically troubled by inconsistencies in their counseling scripts - why they avoided attributing harm in cases of serious fetal conditions ("this isn't a life we'd wish on anyone") while freely using harm language in lifestyle advice ("this will harm your baby"). They're questioning the underlying theory of harm that could make both approaches coherent.

  The core tension centers on whether altering conditions creates a different child (making harm attribution impossible) versus affecting the same child. The user notes this becomes especially stark in cases like complete egg donation where no identity-preserving option exists, yet counseling became more emphatic about not blaming the child - which feels counterintuitive.

  To address their request for five numbered points: I'll reconstruct the implicit theory distinguishing between the two counseling scenarios, identify what's strictly necessary versus merely compatible, examine whether there's a coherent principle separating the halves (especially regarding IVF), consider alternative theories that could justify the same practice, and outline concrete changes if switching theories.

  For point 1: The implicit theory seems to be that harm requires a counterfactual where the same individual exists worse off. Lifestyle interventions are seen as affecting an already-determined identity (post-conception), while serious condition disclosures involve choosing whether to bring that specific identity into existence.  

  For point 2: Strictly the practice only needs the pragmatic distinction that conception marks an identity threshold, but it comfortably aligns with person-affecting morality which prioritizes existing beings over possible future ones.  

  For point 3: The principled line tracks whether the intervention occurs before identity-determination (gamete/embryo stage) versus after. In IVF where there's no "default" outcome, selection between embryos treats identity as already fixed at that stage.  

  For point 4: Rival theories like "impersonal harm" (comparing overall welfare states) or "wrongful life" frameworks could license identical counseling by shifting focus from harm-to-specific-individual to undesirable outcomes generally.  

  For point 5: Switching theories would require replacing "harm your baby" with conditional phrasing like "could lead to health challenges" in lifestyle advice, while serious condition counseling might need to acknowledge moral dilemmas rather than avoiding victim language entirely.  

  I'll maintain the requested format: exactly five points, no preamble or conclusion, one to two sentences per point. This should address both their explicit questions and the underlying discomfort about moral consistency in their former practice.
answer: |-
  1.  **Implicit Theory:** The practice presupposes a person-affecting view where harm requires a worse-off *existing* specific individual compared to their alternative existence. In the serious condition case, continuing the pregnancy doesn't harm *that* child (who wouldn't exist otherwise), making harm language inappropriate; lifestyle changes affect an already-determined specific future child (post-conception), making harm attribution possible.
  2.  **Strict Presupposition vs. Comfort:** It strictly *must* presuppose conception as the threshold for fixing a specific child's identity (making post-conception interventions harm the same child). It comfortably fits with, but doesn't strictly require, the broader person-affecting principle and the non-identity problem's logic.
  3.  **Principled Line?:** The line tracks whether the intervention *changes identity* (serious condition choice/donor egg) or *changes conditions for an already-identity-fixed child* (lifestyle post-conception). In IVF embryo selection, the "default" is the set of existing embryos; choosing one harms the discarded only if discarding makes *them* worse off than continuing existence (often denied), but doesn't harm the selected child compared to non-existence.
  4.  **Rival Theories Licensing Practice:** Impersonal theories (comparing total welfare states, not specific individuals) or "wrongful life" frameworks (where existence itself with severe suffering is a harm, regardless of alternatives) could also justify avoiding harm language for condition-based termination and using it for lifestyle risks affecting a presumed existing child.
  5.  **Concrete Change Under Rival:** Switching to an impersonal or wrongful life theory would likely require *dropping* "this will harm your baby" for lifestyle advice, replacing it with conditional impersonal language like "this significantly increases the *risk* of serious health challenges" or "this creates conditions likely to cause profound suffering." The serious condition counseling might remain unchanged or gain justification for stronger harm/wrongful life language.
