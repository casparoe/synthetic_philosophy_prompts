  3. **Q2**: Must this higher-order state be specifically about the first-order state (e.g., "I am in this very state")?
     - Yes -> Go to 4.
     - No -> **Leaf 1: Unnamed (Higher-Order with General Content)** - *Awkward: It's unclear how a general higher-order state makes a specific state conscious.*

  4. **Q3**: Can the higher-order state misrepresent the first-order state (e.g., represent it as grief when it's relief)?
     - Yes -> Go to 5.
     - No -> **Leaf 2: Self-Representationalism?** - *But wait, self-representationalism doesn't have a separate higher-order state. This branch might be empty. Let's call it:* **Leaf 2: Infallible Higher-Order View** - *Awkward: Subjects are infallible about their conscious states, which contradicts the grief/relief case.*

  5. **Q4**: Must the higher-order state itself be conscious?
     - Yes -> **Leaf 3: Regress-Prone View** - *Awkward: Requires an infinite series of higher-order states, which is unsustainable.*
     - No -> **Leaf 4: Higher-Order Thought (HOT)** - *Awkward: Postulates unconscious thoughts that make states conscious.*

  6. **Q1=No**: Go to here. **Q5**: Is phenomenal consciousness constituted by the state's availability to cognitive processes (e.g., reporting, deliberating, acting)?
     - Yes -> Go to 7.
     - No -> Go to 8.

  7. **Q6**: Can a state be available to cognitive processes (access-conscious) without being phenomenally conscious?
     - Yes -> **Leaf 5: Access-Only View (e.g., GWT without phenomenology)** - *Awkward: Doesn't explain why access should feel like anything.*
     - No -> **Leaf 6: First-Order Representationalism (FOR)** - *Awkward: The absorption case suggests states can be access-conscious without phenomenal consciousness.*

  8. **Q5=No**: **Q7**: Is the state conscious in virtue of representing itself (e.g., the state has a self-referential content)?
     - Yes -> **Leaf 7: Self-Representationalism** - *Awkward: It's unclear how a state can represent itself without circularity.*
     - No -> **Leaf 8: Intrinsic Views (e.g., qualia-based)** - *Awkward: Leaves consciousness as a brute property, unexplained.*

  Additionally, Block's view doesn't fit neatly. Block would say that phenomenal consciousness does not require access and does not require higher-order states. So he might be in Leaf 8 (intrinsic) or in a new leaf. But our tree doesn't have a branch for "phenomenal without any of the above", so we can add:

     - In branch 6 (Q5=No), if you answer Q7=No, then you are in Leaf 8. But Block might be there.

     Block's view: phenomenal consciousness can occur without access consciousness and without higher-order states. So he would be in branch 6, Q5=No (not constituted by availability), and then Q7=No (not self-representation). So Leaf 8: Intrinsic Views. But Block doesn't necessarily endorse intrinsic qualia; he is a representationalist about content but not about consciousness. This is a limitation.

     Alternatively, we can add a leaf for Block:

     **Leaf 9: Phenomenal Consciousness Primitive** - *Awkward: Offers no explanation for why some states are conscious.*

     But our tree has only 7-9 leaves, so we can include it.

     Let's reorganize branch 6 (Q1=No) -> Q5: 
       - A. Yes (constituted by availability) -> then Q6: 
           - A. Yes (access without phenomenology) -> Leaf 5: Access-Only 
           - B. No (access implies phenomenology) -> Leaf 6: FOR
       - B. No (not constituted by availability) -> then Q7: 
           - A. Self-representation -> Leaf 7: Self-Representationalism
           - B. Not self-representation -> **Leaf 8: Block-style view (phenomenal without access or higher-order)** - *Awkward: It's mysterious how phenomenal consciousness arises.*

     But then we miss intrinsic views. We can include them in Leaf 8.

     However, to stay within the leaf limit, we have 8 leaves (0-8).

  ### Final Tree Leaves

  0. **Datum Rejector**: Denies the possibility of unconsciously conscious states.
  1. **Unnamed (Higher-Order with General Content)**: Requires an actual higher-order state with general content. *Awkward: How does a general awareness make a specific state conscious?*
  2. **Infallible Higher-Order View**: Requires actual and specific higher-order state that cannot misrepresent. *Awkward: Subjects cannot be wrong about their conscious states.*
  3. **Regress-Prone View**: Requires the higher-order state to be conscious, leading to infinite regress. *Awkward: Requires an infinite hierarchy of conscious states.*
  4. **Higher-Order Thought (HOT)**: Requires an actual, specific, potentially misrepresenting, unconscious higher-order state. *Awkward: Unconscious thoughts make states conscious.*
  5. **Access-Only View**: Phenomenal consciousness is not explained; only access is. *Awkward: Leaves out the subjective experience.*
  6. **First-Order Representationalism (FOR)**: Phenomenal consciousness is access consciousness. *Awkward: The absorbed driver case suggests access without phenomenology.*
  7. **Self-Representationalism**: A state is conscious by representing itself. *Awkward: Self-representation seems circular or mysterious.*
  8. **Block-style View (or Intrinsic Views)**: Phenomenal consciousness is primitive or intrinsic, not constituted by access or higher-order states. *Awkward: No explanation for consciousness.*

  ### Confidence and Least Sure Branch

  **Confidence**: I am about 75% confident this map is complete for the major positions. It captures the main theories and their commitments regarding the cases. However, there are hybrid views and nuances that are not represented.

  **Least Sure Branch**: The branch for self-representationalism (Leaf 7) is placed under "no actual higher-order state required" and then "not constituted by availability", which is correct, but the tree doesn't capture its positive mechanism well. Also, the placement of Block's view in Leaf 8 is a bit forced because Block is not necessarily an intrinsic theorist; he might be placed in FOR or elsewhere. This is the least sure branch.

  The tree should work for sorting at dinner. Each question is concrete and can be answered by agreement or disagreement with the cases.

  For example, for Q1 (actual higher-order state required), present the humming widower and ask: must he have had a moment of noticing his contentment for it to be conscious?

  For Q5 (constituted by availability), present the absorbed driver: is her state conscious only if it is available for reporting, deliberating, etc.?

