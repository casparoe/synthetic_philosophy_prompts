       - (A) The noticing state must itself be conscious, and this leads to a regress that the theory must stop (e.g., by having some states be intrinsically conscious).
       - (B) The noticing state does not need to be conscious; it can be unconscious.

  5. **Phenomenal vs. Access Consciousness**:
     - *Question*: Consider the case of a character so absorbed in a task that she responds correctly to a traffic light (brakes) but afterwards has no idea whether she saw it or what it was like. Is the theory trying to explain the *what-it's-like-ness* of seeing the light (phenomenal consciousness) or only the fact that the information was available for guiding action and maybe report (access consciousness)? In other words, does the theory account for the subjective experience or just the functional availability?
