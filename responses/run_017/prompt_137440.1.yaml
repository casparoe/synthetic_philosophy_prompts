     - *Question*: For a state to be conscious, must it include a representation of the self? For example, in the widower's case, is his humming state conscious only if it carries a tag that it is his own state? Or can a state be conscious without any self-representation?
     - **Options**:
       - (A) Self-representation is required: a state is conscious only if it is represented as being the subject's own state.
       - (B) Self-representation is not required: a state can be conscious without being tagged as belonging to the self.

