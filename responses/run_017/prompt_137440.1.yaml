  The key distinctions we want to capture:
  1. Does the noticing (or higher-order awareness) have to actually occur, or is a standing disposition sufficient?
  2. Does the higher-order state have to be about that particular first-order state, or can it be more loosely related?
  3. Can the higher-order state misrepresent the first-order state? (And if so, what implications does that have?)
  4. Is the higher-order state itself conscious? (To avoid an infinite regress, how is this handled?)
  5. Is the theory trying to explain phenomenal consciousness (what-it's-like-ness) or only access consciousness (availability for thought, report, etc.)?

  We'll break down the logical space with concrete cases and claims.

  ### Branch Questions

  1. **Actual Occurrence vs. Dispositional**: 
     - *Question*: Consider the humming widower. He is humming and seems to be in a state of contentment, but if you ask him, he sincerely denies feeling anything. For this state to be conscious, must there have been an actual moment (even fleeting) when he noticed his own contentment? Or could it be that the state is conscious simply because he *could* have noticed it if he had turned his attention to it?
     - **Options**:
       - (A) There must have been an actual moment of noticing (even if forgotten immediately).
       - (B) A standing disposition to be noticed (if attended to) is sufficient.

  2. **Aboutness Specificity**:
     - *Question*: When the widower does notice his state (if he does), does that noticing have to be specifically about the humming/contentment state? Or could it be a more general awareness that includes his current state without specifically targeting it?
