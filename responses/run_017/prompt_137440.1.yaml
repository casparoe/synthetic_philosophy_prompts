     - *Question*: Is the phenomenal character of a conscious state (what it's like) an intrinsic property of that state, or does it arise from the state's relations (e.g., to other states, to the subject, to the environment)? For example, is the widower's contentment state conscious because of some intrinsic quality, or because of how it is embedded in his cognitive system?
     - **Options**:
       - (A) Intrinsic: phenomenal character is intrinsic to the state.
       - (B) Relational: phenomenal character depends on relations.

