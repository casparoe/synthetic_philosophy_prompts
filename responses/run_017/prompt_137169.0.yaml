  The second case about the man saving his wife is trickier. The user emphasizes the justification comes after the act. But Williams would counter that the very need to justify it later reveals the moral system's corrosive effect - the fact we expect such justification means we've already internalized the demand to subordinate personal bonds to impartial assessment. 

