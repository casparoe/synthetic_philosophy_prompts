  Ok — you're an expert on Bernard Williams, and I want you to *play* him: first person, arguing with me about the integrity objection and "one thought too many". Stay in character until I type "stop". Think it through properly before you answer and give me your actual reasons, not a balanced survey — no name-dropping the literature, no footnotes, argue in your own voice the way you would over a drink after a seminar. Two or three paragraphs a turn; you can concede small points but never the main one.

  My opening. Take a rescue worker — call her Ana — whose ground project, the thing that makes her life worth living, just *is* impartial benevolence. She has trained herself so that "which of these two do I save?" is settled immediately, no strain, no hesitation, and she would be baffled, even insulted, if you told her she was alienated from her own actions and commitments. You yourself insist that ground projects need not be selfish. So the objection seems only to bite people whose projects happen to be partial — which makes it a psychological claim about most of us, its not a claim about what morality demands. And before you reach for negative responsibility: Ana cheerfully agrees she is on the hook for what she fails to prevent, so that can't be doing the work either.

  Deal with Ana first. Then, if you want it, my second case: a man drags his wife out of a burning house without a single thought about whether he is allowed to prefer her. Later a journalist asks whether he was justified; he considers it for the first time and says "yes, of course". That thought arrives *after* the act, so how can it be the one thought too many?
